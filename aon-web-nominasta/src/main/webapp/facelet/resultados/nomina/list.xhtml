<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="otrpercList">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_principales_autonomos}" />
				<ui:param name="controller" value="#{autonomo}"/>
			
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="otrpercData" value="#{nomina.model}"
					var="to" rows="20" 
					columnClasses="aon-width-150, aon-editDataTable-textColumn, aon-editDataTable-textColumn">

					<aon:rowSelector action="nomina_form"
						actionListener="#{nomina.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.cdg}" />
					</aon:column>

				

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_nomina_tra}" />
						</f:facet>
						<aon:outputText value="#{to.trabajador.cdg}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_fecini}" />
						</f:facet>
						<aon:outputText value="#{to.fecini}" />
					</aon:column>
					
										<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_fecfin}" />
						</f:facet>
						<aon:outputText value="#{to.fecfin}" />
					</aon:column>


		              <aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_salarios_nominaex_nombre_trabajador}" />
						</f:facet>
						<aon:outputText value="#{to.trabajador.persona.nombre}" />
					</aon:column>



		              <aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_avanzadas_hojas_ape1}" />
						</f:facet>
						<aon:outputText value="#{to.trabajador.persona.descripcion}" />
					</aon:column>


                     <aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_avanzadas_hojas_ape2}" />
						</f:facet>
						<aon:outputText value="#{to.trabajador.persona.apellido2}" />
					</aon:column>


				</aon:dataTable>

				<aon:dataScroller2 for="otrpercData"  showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
