<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="nomdtoForm">


			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_resultados_minor}" />
				<ui:param name="controller" value="#{nomdto}" />
				<ui:param name="reportKey" value="DelegacionList" />
				<aon:methodParam name="backAction" value="nomina_form"/>	
			</ui:include>
			<aon:div id="clientes"
				styleClass="aon-scroll-area aon-scroll-area-principales">

				<aon:div id="percep" styleClass="aon-scroll-area">

					<aon:panelGrid columns="4" dir="true" width="100%"
						style="margin-bottom=2px;">

						<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_minor_cdg}" />
						<aon:inputText value="#{nomdto.to.id.cdg}" size="10" maxlength="6"  disabled="true" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_minor_lin}" />
						<aon:inputText value="#{nomdto.to.id.linea}" size="10" disabled="true"
							maxlength="6" />
							
							<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_minor_con}" />
						<aon:inputText value="#{nomdto.to.concepto}" size="10" maxlength="6" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_minor_imp}" />
						<aon:inputText value="#{nomdto.to.importe}" size="10"
							maxlength="6" />

					</aon:panelGrid>

				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{complementoLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
