<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{nomdtoex}" />
			<ui:param name="columnClasses" value="aon-editDataTable-numberColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn" />
			<ui:param name="showDataScroller" value="#{(!comunidad.new) and (comunidad.to != null)}" />			
						
			<ui:define name="columns">

	     	    <aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_resultados_salarios_nominaex_minoracion}" />
					</f:facet>
					<aon:outputText value="#{to.id.linea}" rendered="#{to!=nomdtoex.to}" />
					
					<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{to==nomdtoex.to}" size="5"
							value="#{nomdtoex.to.id.linea}" maxlength="2" />
					<f:facet name="footer">
						<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{nomdtoex.new}" size="5"
							value="#{nomdtoex.to.id.linea}" maxlength="2" />
					</f:facet>
				</aon:column>
		
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_resultados_salarios_nominaex_concepto}" />
					</f:facet>
					<aon:outputText value="#{to.concepto}" rendered="#{to!=nomdtoex.to}" />
					
					<aon:inputText styleClass="aon-form-input-text " required="true"
						rendered="#{to==nomdtoex.to}" size="30"
						value="#{nomdtoex.to.concepto}" maxlength="30" />
					<f:facet name="footer">
						<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{nomdtoex.new}" size="30"
							value="#{nomdtoex.to.concepto}" maxlength="30" />
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_resultados_salarios_nominaex_importe}" />
					</f:facet>
					<aon:outputText value="#{to.importe}" rendered="#{to!=nomdtoex.to}" />
					
					<aon:inputText styleClass="aon-form-input-text " required="true"
						rendered="#{to==nomdtoex.to}" size="30"
						value="#{nomdtoex.to.importe}" maxlength="30" />
					<f:facet name="footer">
						<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{nomdtoex.new}" size="20"
							value="#{nomdtoex.to.importe}" maxlength="11" />
					</f:facet>
				</aon:column>
			</ui:define>
		</ui:decorate>
					
	</aon:div>

</ui:composition>
