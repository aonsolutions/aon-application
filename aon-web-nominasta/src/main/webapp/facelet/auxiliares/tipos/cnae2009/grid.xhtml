<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>
<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="documentoGrid">
	
			<aon:div ajaxRendered="true" layout="none">
	
				<ui:include src="/facelet/templates/gridPrintToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_tipocnae2009}" />
					<ui:param name="controller" value="#{tiposCnae2009}"/>
					<ui:param name="reportKey" value="tiposCnae2009List"/>
					<aon:valueParam name="skipSearchButton" default="false" />
					<aon:valueParam name="skipBackButton" default="false" />
					<aon:methodParam name="backAction" value="auxiliares" />
				</ui:include>
	
				<!-- region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<aon:editDataTable id="cnae2009Data" var="to" rows="20"
						rendered="#{(tiposCnae2009.model.rowCount > 0) or (tiposCnae2009.new)}" value="#{tiposCnae2009.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-width-150, aon-editDataTable-textColumn, aon-width-150, aon-editDataTable-buttonsColumn">
								
						<aon:rowSelector toggleOnClick="#{tiposCnae2009.to == null}"
							actionListener="#{tiposCnae2009.onSelect}" />
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{tiposCnae2009.onReset}" value=""
										rendered="#{!tiposCnae2009.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.cdg}" rendered="#{to!=tiposCnae2009.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposCnae2009.to}" size="4"
								value="#{tiposCnae2009.to.cdg}" maxlength="4" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposCnae2009.new}" size="4"
									value="#{tiposCnae2009.to.cdg}" maxlength="4" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{to!=tiposCnae2009.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposCnae2009.to}" size="140"
								value="#{tiposCnae2009.to.description}" maxlength="250" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposCnae2009.new}" size="140"
									value="#{tiposCnae2009.to.description}" maxlength="250" />
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_section}" />
							</f:facet>
							<aon:outputText value="#{to.seccion}" rendered="#{to!=tiposCnae2009.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposCnae2009.to}" size="1"
								value="#{tiposCnae2009.to.seccion}" maxlength="1" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposCnae2009.new}" size="1"
									value="#{tiposCnae2009.to.seccion}" maxlength="1" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=tiposCnae2009.to}">&#160;</f:verbatim>
								<aon:commandButton id="acceptEdit-Scope" title="[#{bundle.aon_accept}]" 
									rendered="#{to==tiposCnae2009.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{tiposCnae2009.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==tiposCnae2009.to}"
									actionListener="#{tiposCnae2009.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==tiposCnae2009.to}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{tiposCnae2009.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />								
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!tiposCnae2009.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]" 
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{tiposCnae2009.new}"
										actionListener="#{tiposCnae2009.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{tiposCnae2009.new}"
										confirmTitle="#{bundle.aon_confirm_title}" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{tiposCnae2009.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
						
					</aon:editDataTable>
					<aon:dataScroller2 for="cnae2009Data" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
</body>
</html>
