<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
	
	<aon:form id="emprctraSearch">
	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_principales_act_ctrab}" />
				<ui:param name="controller" value="#{emprctra}"/>
				<ui:param name="skipResetButton" value="true" />
				
			</ui:include>	
      
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{emprctra.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="emprctra_list" />	
			
			
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" dir="true" width="100%"
					style="margin-bottom=2px;">


				
								<aon:outputLabel for="Actividad_cdg"
									value="#{appBundle.aon_payroll_principales_tipocuenta_actividad}" />
								<aon:div styleClass="aon-lookup">
									<aon:lookupInputText id="Acti_cdg" lookup="#{actividadLookup}"
										reRender="Acti_description" value="#{emprctra.actividad.cdg}"
										size="5">
									</aon:lookupInputText>
									<aon:lookupButton id="Acti_lookup"
										windowTitle="#{appBundle.aon_payroll_principales_tipocuenta_actividad}"
										selectReRender="Acti_cdg,Acti_description"
										lookup="#{actividadLookup}" minHeight="440"
										property="#{emprctra.actividad}">
									</aon:lookupButton>
									<aon:inputText id="Acti_description"
										value="#{(emprctra.actividad.descripcion!=null)?(emprctra.actividad.descripcion):('')}"
										size="60" disabled="true" />
								</aon:div>

							
								<aon:outputLabel for="Empresa_cdg"
									value="#{appBundle.aon_payroll_principales_tipocuenta_empresa}" />
								<aon:div styleClass="aon-lookup">
									<aon:lookupInputText id="Empre_cdg" lookup="#{empresaLookup}"
										reRender="Empr_description" value="#{emprctra.empresa.cdg}"
										size="5">
									</aon:lookupInputText>
									<aon:lookupButton id="Empre_lookup"
										windowTitle="#{appBundle.aon_payroll_principales_tipocuenta_empresa}"
										selectReRender="Empre_cdg,Empre_description"
										lookup="#{empresaLookup}" minHeight="440"
										property="#{emprctra.empresa}">
									</aon:lookupButton>
									<aon:inputText id="Empre_description"
										value="#{(emprctra.empresa.descripcion!=null)?(emprctra.empresa.descripcion):('')}"
										size="60" disabled="true" />
								</aon:div>



					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_localidad}" />

					<aon:inputText value="#{emprctra.to.domicilio.localidad}" size="50" />

					<aon:outputLabel for="Domicilio_cdg"
						value="#{appBundle.aon_payroll_principales_tipodomcilio_domicilio}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Dom_cdg" lookup="#{domicilioLookup}"
							reRender="Dom_description" value="#{emprctra.domicilio.cdg}"
							size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Dom_lookup"
							windowTitle="#{appBundle.aon_payroll_principales_tipodomcilio_domicilio}"
							selectReRender="Dom_cdg,Dom_description"
							lookup="#{domicilioLookup}" minHeight="440"
							property="#{emprctra.domicilio}">
						</aon:lookupButton>
						<aon:inputText id="Dom_description"
							value="#{(emprctra.domicilio.nomvia!=null)?(emprctra.domicilio.nomvia):('')}"
							size="60" disabled="true" />
					</aon:div>

					<aon:outputLabel for="conv_cdg"
						value="#{appBundle.aon_payroll_principales_act_ctrab_con}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Con_cdg" lookup="#{convenioLookup}"
							reRender="Con_description" value="#{emprctra.convenio.cdg}"
							size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Con_lookup"
							windowTitle="#{appBundle.aon_payroll_principales_act_ctrab_con}"
							selectReRender="Con_cdg,Con_description"
							lookup="#{convenioLookup}" minHeight="440"
							property="#{emprctra.convenio}">
						</aon:lookupButton>
						<aon:inputText id="Con_description"
							value="#{(emprctra.convenio.description!=null)?(emprctra.convenio.description):('')}"
							size="60" disabled="true" />
					</aon:div>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_pot}" />

					<aon:inputText  id="Emprctra_pelectri"
									valueChangeListener="#{emprctra.addExpression}"  size="50" />


					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_maq}" />

					<aon:inputText   id="Emprctra_maquina"
									valueChangeListener="#{emprctra.addExpression}"  size="50" />



					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_sup}" />

					<aon:inputText   id="Emprctra_superficie"
									valueChangeListener="#{emprctra.addExpression}"  size="50" />



					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_min}" />

					<aon:inputText   id="Emprctra_jornada"
									valueChangeListener="#{emprctra.addExpression}"  size="50" />


					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_hor}" />
					<h:inputTextarea   id="Emprctra_horario"
									valueChangeListener="#{emprctra.addExpression}"  cols="50" rows="4"
						size="150" maxlength="100" />


					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_fiest}" />
					<h:inputText  id="Emprctra_fiestas"
									valueChangeListener="#{emprctra.addExpression}"  cols="50" rows="4"
						size="50" maxlength="40" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_env}" />
					<aon:selectOneMenu   id="Emprctra_envioss"
									valueChangeListener="#{emprctra.addExpression}" >
					    <aon:enumConverter	enum="com.code.aon.payroll.enumeration.EnvioSS2" />
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{emprctra.listaenvios}" />
					</aon:selectOneMenu>

					<aon:panelGroup>
						<aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{emprctra.indcal}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_act_ctrab_cal}" />
							</aon:div>
							<br></br>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{emprctra.indnom}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_act_ctrab_nom}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{emprctra.indcoste}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_act_ctrab_est}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{emprctra.toxicos}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_act_ctrab_tox}" />
							</aon:div>


						</aon:div>
					</aon:panelGroup>



					<aon:panelGroup>
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_act_ctrab_rep}" />
						<aon:selectOneRadio   id="Emprctra_represen"
									valueChangeListener="#{emprctra.addExpression}" 
							layout="pageDirection">
						<aon:enumConverter	enum="com.code.aon.payroll.enumeration.Representantes" />
						<f:selectItems value="#{emprctra.listarepre}" />
						</aon:selectOneRadio>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_act_ctrab_ind}" />
						<aon:selectOneRadio   id="Emprctra_inddia"
									valueChangeListener="#{emprctra.addExpression}" 
							layout="pageDirection">
						  <aon:enumConverter	enum="com.code.aon.payroll.enumeration.Inddias" />
							
							<f:selectItems value="#{emprctra.listainddia}" />
						</aon:selectOneRadio>
					</aon:panelGroup>
		
		
			<aon:outputLabel
							value=" " />
			</aon:panelGrid>

		</aon:div>

		 </ui:define>
			</ui:decorate>
		
		</aon:form>
       <aon:lookupButtonPopup lookup="#{domicilioLookup}" />	
       	<aon:lookupButtonPopup lookup="#{empresaLookup}" />
		<aon:lookupButtonPopup lookup="#{actividadLookup}" />
		<aon:lookupButtonPopup lookup="#{convenioLookup}" />
       
		

	</ui:define>
</ui:composition>

</body>
</html>
