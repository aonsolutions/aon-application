<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="prcdivtrabSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_principales_division_mnto}" />
				<ui:param name="controller" value="#{prcdivtrab}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{prcdivtrab.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="prcdivtrab_list" />







							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_division_cdg}" />
							<aon:inputText id="Prcdivtrab_id_cdg" 
								valueChangeListener="#{prcdivtrab.addExpression}"/>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_fecini}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								id="Prcdivtrab_id_fecini" enableManualInput="true"  
								valueChangeListener="#{prcdivtrab.addEqualExpression}"/>
					
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_fecfin}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								id="Prcdivtrab_fecfin" enableManualInput="true"  
								valueChangeListener="#{prcdivtrab.addEqualExpression}"/>
					
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_orden}" />
							<aon:inputText id="Prcdivtrab_id_orden"  
								valueChangeListener="#{prcdivtrab.addExpression}"/>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_porcentaje}" />
							<aon:inputText id="Prcdivtrab_prc"  
								valueChangeListener="#{prcdivtrab.addExpression}"/>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_texto}" />
							<aon:inputText id="Prcdivtrab_texto"  
								valueChangeListener="#{prcdivtrab.addExpression}"/>






				</ui:define>
			</ui:decorate>

		</aon:form>


	</ui:define>

</ui:composition>
