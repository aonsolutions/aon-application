<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="cnaeData" value="#{cnae.model}" 
			var="to" rows="0"
			rendered="#{(cnae.model.rowCount >= 0) or (cnae.new)}"
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{cnae.to == null}" actionListener="#{cnae.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{cnae.onReset}" value=""
							rendered="#{!cnae.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_fecini}" />
				</f:facet>
				<aon:outputText value="#{to.id.fecini}" rendered="#{to!=cnae.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{cnae.to.id.fecini}" id="FechaInicio"
					rendered="#{to==cnae.to}" disabled="#{to==cnae.to}" required="true"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{cnae.to.id.fecini}" id="FechaInicioNew"
						rendered="#{cnae.new}" required="true"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_fecfin}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}" rendered="#{to!=cnae.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{cnae.to.fecfin}" id="FechaFin"
					rendered="#{to==cnae.to}" required="true"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{cnae.to.fecfin}" id="FechaFinNew"
						rendered="#{cnae.new}" 
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pctit}" />
				</f:facet>
				<aon:outputText value="#{to.pctit}" rendered="#{to!=cnae.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<aon:inputText id="cnae_pctit_edit" styleClass="aon-form-input-text"
					rendered="#{to==cnae.to}" required="true"
					value="#{cnae.to.pctit}" maxlength="8" size="10" >
					<f:validator validatorId="porcentajeValidator" />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="cnae_pctit_new" styleClass="aon-form-input-text"  
						rendered="#{cnae.new}" required="true"
						value="#{cnae.to.pctit}" maxlength="8" size="10"  >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pctims}" />
				</f:facet>
				<aon:outputText value="#{to.pctims}" rendered="#{to!=cnae.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<aon:inputText id="cnae_pctims_edit" styleClass="aon-form-input-text"
					rendered="#{to==cnae.to}" required="true"
					value="#{cnae.to.pctims}" maxlength="8" size="10" >
					<f:validator validatorId="porcentajeValidator" />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="cnae_pctims_new" styleClass="aon-form-input-text"  
						rendered="#{cnae.new}" required="true"
						value="#{cnae.to.pctims}" maxlength="8" size="10"  >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pcttotal}" />
				</f:facet>
				<aon:outputText value="#{to.pcttotal}" rendered="#{to!=cnae.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<!-- aon:inputText id="cnae_pcttotal_edit" styleClass="aon-form-input-text"
					rendered="#{to==cnae.to}" required="true"
					value="#{cnae.to.pcttotal}" maxlength="8" size="10" >
					<f:validator validatorId="porcentajeValidator" />
				</aon:inputText-->
				<f:facet name="footer">
					<!-- aon:inputText id="cnae_pcttotal_new" styleClass="aon-form-input-text"  
						rendered="#{cnae.new}" required="true"
						value="#{cnae.to.pcttotal}" maxlength="8" size="10"  >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText-->
				</f:facet>
			</aon:column>

			

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=cnae.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==cnae.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{cnae.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==cnae.to}"
						actionListener="#{cnae.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-cnae" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==cnae.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{cnae.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!cnae.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{cnae.new}"
							actionListener="#{cnae.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-cnae" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{cnae.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{cnae.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
	</aon:div>

</ui:composition>
