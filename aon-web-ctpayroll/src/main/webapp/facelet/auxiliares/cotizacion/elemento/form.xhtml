<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="elementoForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.auxiliares_cotizacion__elemcotizacion}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{porcentajeMaestro.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="cotizacion_elemento"
							actionListener="#{elementoMaestro.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{elementoMaestro.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{elementoMaestro.onCancel}"
							confirmAction="cotizacion_elemento_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!elementoMaestro.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{elementoMaestro.onRemove}"
							confirmAction="cotizacion_elemento_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!elementoMaestro.new}"
							action="cotizacion_elemento" 
							actionListener="#{elementoMaestro.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!elementoMaestro.new}" immediate="true"
							action="cotizacion_elemento_search" actionListener="#{elementoMaestro.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />														

						<aon:spin controller="#{elementoMaestro}" action="cotizacion_elemento" rendered="#{!elementoMaestro.new}" />

						<ui:include src="/facelet/templates/aon.ui.printbuttons.xhtml">
							<ui:param name="manager" value="#{elementoMaestro}"/>
							<ui:param name="reportKey" value="elementoCotizacion"/>
						</ui:include>

					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="elementoMaestro" columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel for="ElementoMaestro_cdg" value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="ElementoMaestro_cdg" value="#{elementoMaestro.to.cdg}" disabled="#{!elementoMaestro.new}" 
						required="true" size="15" maxlength="10" />
				
					<aon:outputLabel for="ElementoMaestro_description" value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="ElementoMaestro_description" value="#{elementoMaestro.to.description}" 
						size="70" maxlength="50" >
					</aon:inputText>

					
				</aon:panelGrid>

				<ui:include src="grid.xhtml" rendered="#{!elementoMaestro.new}" />				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
