<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="cotizacionBonificacionSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni}" />
				<ui:param name="controller" value="#{cotizacionBonificacion}" />
				<ui:param name="skipResetButton" value="true" />
				<aon:methodParam name="backAction"
					value="cotizacionBonificacion_form" />
			</ui:include>
			<!-- end toolbar navigation -->

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{cotizacionBonificacion.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction"
						value="cotizacionBonificacion_form" />

					<aon:outputLabel for="Bonificacion_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Bonificacion_cdg" size="2" maxlength="2"
						valueChangeListener="#{cotizacionBonificacion.addExpression}" />

					<aon:outputLabel for="Bonificacion_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Bonificacion_description" size="30"
						maxlength="50"
						valueChangeListener="#{cotizacionBonificacion.addExpression}" />

					<aon:outputLabel for="Bonificacion_calculo"
						value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni_calculo}" />
					<aon:inputText id="Bonificacion_calculo" size="30" maxlength="50"
						valueChangeListener="#{cotizacionBonificacion.addExpression}" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni_porcentajes}" />

					<aon:panelGrid columns="8">
						<aon:outputLabel for="Bonificacion_prcCg"
							value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni_cg}" />
						<aon:inputText id="Bonificacion_prcCg" size="15" maxlength="50"
							valueChangeListener="#{cotizacionBonificacion.addExpression}" />

						<aon:outputLabel for="Bonificacion_prcAcc"
							value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni_acc}" />
						<aon:inputText id="Bonificacion_prcAcc" size="15" maxlength="50"
							valueChangeListener="#{cotizacionBonificacion.addExpression}" />

						<aon:outputLabel for="Bonificacion_prcAccfgs"
							value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni_conj}" />
						<aon:inputText id="Bonificacion_prcAccfgs" size="15"
							maxlength="50"
							valueChangeListener="#{cotizacionBonificacion.addExpression}" />

					</aon:panelGrid>

					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni_marcas}" />
					<aon:panelGroup>
						<aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="Bonificacion_boniss"
									value="#{cotizacionBonificacion.searchBoniss}" />
								<aon:outputLabel for="Bonificacion_boniss"
									value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni_boniss}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="Bonificacion_mayor60"
									value="#{cotizacionBonificacion.searchMayor60}" />
								<aon:outputLabel for="Bonificacion_mayor60"
									value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni_60}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="Bonificacion_rdl052006"
									value="#{cotizacionBonificacion.searchRdl052006}" />
								<aon:outputLabel for="Bonificacion_rdl052006"
									value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni_rdl5}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="Bonificacion_restait"
									value="#{cotizacionBonificacion.searchRestait}" />
								<aon:outputLabel for="Bonificacion_restait"
									value="#{appBundle.aon_payroll_auxiliares_cotizacion__tipboni_restait}" />
							</aon:div>

						</aon:div>
					</aon:panelGroup>


				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>

</ui:composition>
