<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="porcentajeForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_payroll_auxiliares_divisa}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{divisaMaestro.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="divisas_form"
							actionListener="#{divisaMaestro.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{divisaMaestro.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{divisaMaestro.onCancel}"
							confirmAction="divisas_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!divisaMaestro.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{divisaMaestro.onRemove}"
							confirmAction="divisas_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!divisaMaestro.new}"
							action="divisas_form" 
							actionListener="#{divisaMaestro.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!divisaMaestro.new}" immediate="true"
							action="divisas_search" actionListener="#{divisaMaestro.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />														

						<aon:spin controller="#{divisaMaestro}" action="divisas_form" rendered="#{!divisaMaestro.new}" />

						<ui:include src="/facelet/templates/aon.ui.printbuttons.xhtml">
							<ui:param name="manager" value="#{divisaMaestro}"/>
							<ui:param name="reportKey" value="DivisaList"/>
						</ui:include>

					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="divisaMaestro" columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					
					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_divisa_codigodivisa}" />
					<aon:inputText value="#{divisaMaestro.to.cdg}" disabled="true" 
						required="true" size="10" maxlength="8" />
				
					<aon:outputLabel for="Domain_name" value="#{appBundle.aon_payroll_auxiliares_divisa_desc}" />
					<aon:inputText value="#{divisaMaestro.to.description}" 
						required="true" size="60" maxlength="50" >
					</aon:inputText>
					
               		<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_divisa_redondeo}" />
					<aon:selectOneRadio id="Redondeo" value="#{divisaMaestro.to.redondeo}" >	
						<f:selectItem itemValue="0" itemLabel="tipo 0"/>	
						<f:selectItem itemValue="1" itemLabel="tipo 1"/>
						<f:selectItem itemValue="2" itemLabel="tipo 2"/>
						<f:selectItem itemValue="3" itemLabel="tipo 3"/>										
					</aon:selectOneRadio>
					
				
				</aon:panelGrid>

			  <ui:include src="grid.xhtml" rendered="#{!divisaMaestro.new}" />	
			 
			 	</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
