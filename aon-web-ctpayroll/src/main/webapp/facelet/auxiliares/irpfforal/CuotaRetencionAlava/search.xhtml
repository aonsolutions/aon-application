<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="cuotaRetencionAlavaSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{menuBundle.auxiliares_irpf_foral__cuota_01}" />
				<ui:param name="controller" value="#{cuotaRetencionAlava}" />
				<ui:param name="skipResetButton" value="true" />
				<aon:methodParam name="backAction" value="cuotaRetencionAlava_form" />
			</ui:include>


			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{cuotaRetencionAlava.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction"
						value="cuotaRetencionAlava_form" />


						
					<aon:outputLabel for="CuotaRetencionAlava_id_numTramo"
						value="#{appBundle.aon_payroll_auxiliares_irpf_foral__cuota_01_tramo}" />
						
					<aon:inputText id="CuotaRetencionAlava_id_numTramo" size="10"
						maxlength="4"
						valueChangeListener="#{cuotaRetencionAlava.addExpression}" />


			          				
                  <aon:outputLabel for="CuotaRetencionAlava_id_fecini"
						value="#{appBundle.aon_payroll_auxiliares_irpf_foral__cuota_01_fecini}" />
					<aon:selectInputDate id="CuotaRetencionAlava_id_fecini"
						renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{cuotaRetencionAlava.searchFecini}"
						enableManualInput="true"/>
					
							
                  <aon:outputLabel for="CuotaRetencionAlava_fecfin"
						value="#{appBundle.aon_payroll_auxiliares_irpf_foral__cuota_01_fecfin}" />
					<aon:selectInputDate id="CuotaRetencionAlava_fecfin"
						renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{cuotaRetencionAlava.searchFecfin}"
						enableManualInput="true"/>

						
				<aon:outputLabel for="CuotaRetencionAlava_desdeImporte"
						value="#{appBundle.aon_payroll_auxiliares_irpf_foral__cuota_01_desdeimporte2}" />
					<aon:inputText id="CuotaRetencionAlava_desdeImporte" size="30" maxlength="30"
						valueChangeListener="#{cuotaRetencionAlava.addExpression}" />

					<aon:outputLabel for="CuotaRetencionAlava_hastaImporte"
						value="#{appBundle.aon_payroll_auxiliares_irpf_foral__cuota_01_hastaimporte2}" />
					<aon:inputText id="CuotaRetencionAlava_hastaImporte" size="30"
						maxlength="30"
						valueChangeListener="#{cuotaRetencionAlava.addExpression}" />


				

				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>

</ui:composition>
