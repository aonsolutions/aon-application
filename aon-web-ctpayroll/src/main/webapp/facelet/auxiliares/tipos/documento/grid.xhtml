<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>
<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="documentoGrid">
	
			<aon:div ajaxRendered="true" layout="none">
				
				<ui:include src="/facelet/templates/gridPrintToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_tipos__tipdoc}" />
					<ui:param name="controller" value="#{tiposDocumento}"/>
					<ui:param name="reportKey" value="tiposDocumentoList"/>
					<aon:valueParam name="skipSearchButton" default="false" />
					<aon:valueParam name="skipBackButton" default="false" />
					<aon:methodParam name="backAction" value="auxiliares" />
				</ui:include>
	
				<!-- region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<aon:editDataTable id="documentoData" var="to" rows="20"
						rendered="#{(tiposDocumento.model.rowCount > 0) or (tiposDocumento.new)}" 
						value="#{tiposDocumento.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-width-150, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
								
						<aon:rowSelector toggleOnClick="#{tiposDocumento.to == null}"
							actionListener="#{tiposDocumento.onSelect}" />
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{tiposDocumento.onReset}" value=""
										rendered="#{!tiposDocumento.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.cdg}" rendered="#{to!=tiposDocumento.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposDocumento.to}" size="1"
								value="#{tiposDocumento.to.cdg}" maxlength="1" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposDocumento.new}" size="1"
									value="#{tiposDocumento.to.cdg}" maxlength="1" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{to!=tiposDocumento.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposDocumento.to}" size="60"
								value="#{tiposDocumento.to.description}" maxlength="60" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposDocumento.new}" size="60"
									value="#{tiposDocumento.to.description}" maxlength="60" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=tiposDocumento.to}">&#160;</f:verbatim>
								<aon:commandButton id="acceptEdit-Scope" title="[#{bundle.aon_accept}]" 
									rendered="#{to==tiposDocumento.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{tiposDocumento.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==tiposDocumento.to}"
									actionListener="#{tiposDocumento.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton id="remove-Scope" title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==tiposDocumento.to}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{tiposDocumento.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />								
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!tiposDocumento.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]" 
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{tiposDocumento.new}"
										actionListener="#{tiposDocumento.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton id="cancel-Scope" title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{tiposDocumento.new}"
										confirmTitle="#{bundle.aon_confirm_title}" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{tiposDocumento.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
						
					</aon:editDataTable>
					<aon:dataScroller2 for="documentoData" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
</body>
</html>
