<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="tiposIncidenciaSearch">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_tipos__tipinc}" />
				<ui:param name="controller" value="#{tiposIncidencia}" />
				<ui:param name="skipResetButton" value="true" />
				<aon:methodParam name="backAction" value="tiposIncidencia_form"/>
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{tiposIncidencia.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="tiposIncidencia_form" />				
				
					<aon:outputLabel for="Incidencia_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Incidencia_cdg" size="20" maxlength="20"
						valueChangeListener="#{tiposIncidencia.addExpression}" />

					<aon:outputLabel for="Incidencia_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Incidencia_description" size="40" maxlength="40"
						valueChangeListener="#{tiposIncidencia.addExpression}" />
						
					<aon:outputLabel value="" />
					<aon:panelGroup>
						<aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="Incidencia_indresta"
									value="#{tiposIncidencia.searchIndresta}" />
								<aon:outputLabel for="Incidencia_indresta"
									value="#{appBundle.aon_payroll_indresta}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="Incidencia_inddto"
									value="#{tiposIncidencia.searchInddto}" />
								<aon:outputLabel for="Incidencia_inddto"
									value="#{appBundle.aon_payroll_inddto}" />
							</aon:div>
							
						</aon:div>
					</aon:panelGroup>	
						
						
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
