<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>
<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="cuotasGrid">
	
			<aon:div ajaxRendered="true" layout="none">
	
				<aon:div styleClass="aon-finding-title-toolbar">
					<aon:panelGrid columns="3" dir="true"
						columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
	
						<aon:div styleClass="aon-finding-title-internal">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__cuota}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{appBundle.aon_payroll_crud}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-toolbar-item-group">
							<aon:commandButton id="reset" value="#{bundle.aon_reset}"
								actionListener="#{cuotas.onReset}" rendered="#{!cuotas.new}"
								styleClass="aon-finding-toolbar-item aon-icon-reset"
								accesskey="#{bundle.aon_key_new}"/>
							<aon:commandButton id="save"
								value="#{bundle.aon_save}" rendered="#{cuotas.to!=null or cuotas.new}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								actionListener="#{cuotas.onAccept}" 
								accesskey="#{bundle.aon_key_new}" />
							<aon:confirmButton id="cancelNew"
								value="#{bundle.aon_cancel}" rendered="#{cuotas.new}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{cuotas.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:commandButton id="cancelEdit"
								value="#{bundle.aon_cancel}" rendered="#{cuotas.to!=null and (!cuotas.new)}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								actionListener="#{cuotas.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:confirmButton id="remove"
								value="#{bundle.aon_remove}" rendered="#{cuotas.to!=null and !cuotas.new}"
								styleClass="aon-finding-toolbar-item aon-icon-delete" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{cuotas.onRemove}"
								accesskey="#{bundle.aon_key_remove}"/>
							<h:commandLink id="export2pdf" value="."
									title="#{appBundle.aon_payroll_export} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_pdf}"
									styleClass="aon-finding-toolbar-item aon-icon-pdf"
									action="#{report.onExecute}" rendered="#{!cuotas.new}" 
									target="_blank">
								<f:param name="reportKey" value="irpfCuotaList" />
							</h:commandLink>
							<h:commandLink id="export2excel" value="."
									title="#{appBundle.aon_payroll_export} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_excel}"
									styleClass="aon-finding-toolbar-item aon-icon-excel"
									action="#{report.onExecute}" rendered="#{!cuotas.new}" 
									target="_blank">
								<f:param name="reportKey" value="irpfCuotaList" />
								<f:param name="outputFormat" value="MS Excel" />
							</h:commandLink>
							<h:commandLink id="export2csv" value="."
									title="#{appBundle.aon_payroll_export} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_csv}"
									styleClass="aon-finding-toolbar-item aon-icon-excel"
									action="#{report.onExecute}" rendered="#{!cuotas.new}" 
									target="_blank">
								<f:param name="reportKey" value="irpfCuotaList" />
								<f:param name="outputFormat" value="CSV" />
							</h:commandLink>
						</aon:div>
					</aon:panelGrid>
				</aon:div>
	
				<!-- region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<aon:editDataTable id="cuotasData" var="to" rows="20"
						rendered="#{(cuotas.model.rowCount > 0) or (cuotas.new)}" value="#{cuotas.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-numberColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">
								
						<aon:rowSelector toggleOnClick="#{cuotas.to == null}"
							actionListener="#{cuotas.onSelect}" />
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{cuotas.onReset}" value=""
										rendered="#{!cuotas.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_numTramo}" />
							</f:facet>
							<aon:outputText value="#{to.id.numTramo}" rendered="#{to!=cuotas.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								requiredMessage="numTramo"
								rendered="#{to==cuotas.to}" size="2"
								value="#{cuotas.to.id.numTramo}" maxlength="2" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{cuotas.new}" size="2"
									value="#{cuotas.to.id.numTramo}" maxlength="2" 
									requiredMessage="numTramo" />
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_fecini}" />
							</f:facet>
							<aon:outputText value="#{to.id.fecini}" rendered="#{to!=cuotas.to}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate required="true"
								requiredMessage="fecini"
								rendered="#{to==cuotas.to}"
								value="#{cuotas.to.id.fecini}"
								renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
							</aon:selectInputDate>
							<f:facet name="footer">
								<aon:selectInputDate required="true"
									requiredMessage="fecini"
									rendered="#{cuotas.new}" 
									value="#{cuotas.to.id.fecini}" 
									renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
								</aon:selectInputDate>
									
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_fecfin}" />
							</f:facet>
							<aon:outputText value="#{to.fecfin}" rendered="#{to!=cuotas.to}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate required="true"
								requiredMessage="fecfin"
								rendered="#{to==cuotas.to}"
								value="#{cuotas.to.fecfin}"
								renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
							</aon:selectInputDate>
							<f:facet name="footer">
								<aon:selectInputDate required="true"
									requiredMessage="fecfin"
									rendered="#{cuotas.new}" 
									value="#{cuotas.to.fecfin}" 
									renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
								</aon:selectInputDate>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_hasta}" />
							</f:facet>
							<aon:outputText value="#{to.hasta}" rendered="#{to!=cuotas.to}" >
								<f:convertNumber type="number" pattern="###,###.###" />
							</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text " required="true"
								requiredMessage="hasta"
								rendered="#{to==cuotas.to}" size="11"
								value="#{cuotas.to.hasta}" maxlength="11" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									requiredMessage="hasta"
									rendered="#{cuotas.new}" size="11"
									value="#{cuotas.to.hasta}" maxlength="11" />
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_pesetas}" />
							</f:facet>
							<aon:outputText value="#{to.pesetas}" rendered="#{to!=cuotas.to}" >
								<f:convertNumber type="number" pattern="###,###.###" />
							</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text"
								rendered="#{to==cuotas.to}" size="11"
								value="#{cuotas.to.pesetas}" maxlength="11" />
								
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text"
									rendered="#{cuotas.new}" size="11"
									value="#{cuotas.to.pesetas}" maxlength="11" />
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_resto}" />
							</f:facet>
							<aon:outputText value="#{to.resto}" rendered="#{to!=cuotas.to}" >
								<f:convertNumber type="number" pattern="###,###.###" />
							</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text"
								rendered="#{to==cuotas.to}" size="11"
								value="#{cuotas.to.resto}" maxlength="11" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text"
									rendered="#{cuotas.new}" size="11"
									value="#{cuotas.to.resto}" maxlength="11" />
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_porcentaje}" />
							</f:facet>
							<aon:outputText value="#{to.porcentaje}" rendered="#{to!=cuotas.to}" >
								<f:convertNumber minFractionDigits="2" />
							</aon:outputText>
							<aon:inputText id="cuotas_porcentaje_edit" styleClass="aon-form-input-text"
								rendered="#{to==cuotas.to}" size="5"
								value="#{cuotas.to.porcentaje}" maxlength="5" >
								<f:validator validatorId="porcentajeValidator" />
							</aon:inputText>
							<f:facet name="footer">
								<aon:inputText id="cuotas_porcentaje_new" styleClass="aon-form-input-text"
									rendered="#{cuotas.new}" size="5"
									value="#{cuotas.to.porcentaje}" maxlength="5" >
								<f:validator validatorId="porcentajeValidator" />
							</aon:inputText>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=cuotas.to}">&#160;</f:verbatim>
								<aon:commandButton id="acceptEdit-Scope" title="[#{bundle.aon_accept}]" 
									rendered="#{to==cuotas.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{cuotas.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==cuotas.to}"
									actionListener="#{cuotas.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==cuotas.to}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{cuotas.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />								
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!cuotas.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]" 
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{cuotas.new}"
										actionListener="#{cuotas.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{cuotas.new}"
										confirmTitle="#{bundle.aon_confirm_title}" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{cuotas.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
						
					</aon:editDataTable>
					<aon:dataScroller2 for="cuotasData" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
</body>
</html>
