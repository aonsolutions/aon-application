<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="cuotasSearch">

			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_irpf__cuota}" />
				<ui:param name="controller" value="#{cuotas}" />
				<ui:param name="skipResetButton" value="true" />
				<aon:methodParam name="backAction" value="cuotas_form"/>
		     </ui:include>
			<!-- end toolbar navigation -->

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{cuotas.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="cuotas_form" />


					<aon:outputLabel for="Cuota_id_numTramo"
						value="#{appBundle.aon_payroll_auxiliares_irpf_foral__cuota_01_tramo}" />
					<aon:inputText id="Cuota_id_numTramo" size="10" maxlength="10"
						valueChangeListener="#{cuotas.addExpression}" />

					<aon:outputLabel for="Cuota_id_fecini"
						value="#{appBundle.aon_payroll_auxiliares_irpf_foral__cuota_01_fecini}" />
					<aon:selectInputDate id="Cuota_id_fecini"
						renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{cuotas.searchFecini}"
						enableManualInput="true"/>
					
							
                  <aon:outputLabel for="Cuota_fecfin"
						value="#{appBundle.aon_payroll_auxiliares_irpf_foral__cuota_01_fecfin}" />
					<aon:selectInputDate id="Cuota_fecfin"
						renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{cuotas.searchFecfin}"
						enableManualInput="true"/>


					<aon:outputLabel for="Cuota_hasta"
						value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_hasta}" />
					<aon:inputText id="Cuota_hasta" size="20" maxlength="20"
						valueChangeListener="#{cuotas.addExpression}" />

					<aon:outputLabel for="Cuota_pesetas"
						value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_pesetas}" />
					<aon:inputText id="Cuota_pesetas" size="20" maxlength="20"
						valueChangeListener="#{cuotas.addExpression}" />

					<aon:outputLabel for="Cuota_resto"
						value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_resto}" />
					<aon:inputText id="Cuota_resto" size="20" maxlength="20"
						valueChangeListener="#{cuotas.addExpression}" />
						
					<aon:outputLabel for="Cuota_porcentaje"
						value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_porcentaje}" />
					<aon:inputText id="Cuota_porcentaje" size="20" maxlength="20"
						valueChangeListener="#{cuotas.addExpression}" />


				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>

</ui:composition>
