<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="irpfMaestroSearch">

		 <ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_irpf__datosirpf}" />
				<ui:param name="controller" value="#{irpfMaestro}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>
			

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{irpfMaestro.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="irpfMaestro_list" />				
				
					<aon:outputLabel for="Elemirpf_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Elemirpf_cdg" size="20" maxlength="20"
						valueChangeListener="#{irpfMaestro.addExpression}" />

					<aon:outputLabel for="Elemirpf_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Elemirpf_description" size="60" maxlength="60"
						valueChangeListener="#{irpfMaestro.addExpression}" />
						
				    <aon:outputLabel for="Elemirpf_porcentaje"
						value="#{appBundle.aon_payroll_auxiliares_irpf__datos_porcen}" />
					<h:selectBooleanCheckbox id="Elemirpf_porcentaje" value="#{irpfMaestro.searchPorcentaje}" 
						/>
					
					<aon:outputLabel for="Elemirpf_id_fecini"
						value="#{appBundle.aon_payroll_auxiliares_irpf__datos_desde}" />
					<aon:selectInputDate id="Elemirpf_id_fecini" renderAsPopup="true"
						popupDateFormat="#{appBundle.aon_date_pattern}" enableManualInput="true"
						value="#{irpfMaestro.searchFecini}" />
									
					<aon:outputLabel for="Elemirpf_fecfin"
						value="#{appBundle.aon_payroll_auxiliares_irpf__datos_hasta}" />
					<aon:selectInputDate id="Elemirpf_fecfin" renderAsPopup="true"
						popupDateFormat="#{appBundle.aon_date_pattern}" enableManualInput="true"
						value="#{irpfMaestro.searchFecfin}" />
										
					<aon:outputLabel for="Elemirpf_linirpfs_hasta"
						value="#{appBundle.aon_payroll_auxiliares_irpf__datos_Hastaimp}" />
					<aon:inputText id="Elemirpf_linirpfs_hasta" size="20" maxlength="20"
						valueChangeListener="#{irpfMaestro.addExpression}" />			
					
					<aon:outputLabel for="Elemirpf_linirpfs_importe"
						value="#{appBundle.aon_payroll_auxiliares_irpf__datos_impelem}" />
					<aon:inputText id="Elemirpf_linirpfs_importe" size="20" maxlength="20"
						valueChangeListener="#{irpfMaestro.addExpression}" />		
						
														
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
