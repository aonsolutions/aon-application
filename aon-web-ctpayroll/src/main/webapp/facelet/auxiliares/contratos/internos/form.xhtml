<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="contratosInternosForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.auxiliares_contratos__tipocont}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{contratosInternos.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="contratos_internos"
							actionListener="#{contratosInternos.onAccept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{contratosInternos.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{contratosInternos.onCancel}"
							confirmAction="contratos_internos_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!contratosInternos.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{contratosInternos.onRemove}"
							confirmAction="contratos_internos_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!contratosInternos.new}"
							action="contratos_internos" 
							actionListener="#{contratosInternos.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!contratosInternos.new}"
							action="contratos_internos_search" actionListener="#{contratosInternos.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />				

						<aon:spin controller="#{contratosInternos}" action="contratos_internos" rendered="#{!contratosInternos.new}" />
						
						<ui:include src="/facelet/templates/aon.ui.printbuttons.xhtml">
							<ui:param name="manager" value="#{contratosInternos}"/>
							<ui:param name="reportKey" value="contratosInternosList"/>
						</ui:include>

					</aon:div>
					<!-- end tool bar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div id="contratosInternos" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText value="#{contratosInternos.to.cdg}" disabled="#{!contratosInternos.new}" 
						required="true" size="1" maxlength="2" />
				
					<aon:outputLabel value="#{appBundle.aon_payroll_description}" />
					<aon:inputText value="#{contratosInternos.to.description}" 
						required="true" size="90" maxlength="60" >
					</aon:inputText>

					<aon:outputLabel value="#{appBundle.aon_payroll_asimiladoa}" />
					<aon:selectOneMenu id="Asimilados"
						value="#{contratosInternos.to.porcentajeMaestro.cdg}">
						<f:selectItems value="#{contratosInternos.asimilados}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{appBundle.aon_payroll_desempleado}" />
					<aon:selectOneMenu id="Desempleados" 
						value="#{contratosInternos.to.desempleenum}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{contratosInternos.desempleados}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{appBundle.aon_payroll_minusvalia}" />
					<aon:inputText value="#{contratosInternos.to.gradomin}" size="1" maxlength="2" >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText>
					<aon:outputLabel value="" />
					<aon:panelGroup>
						<aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{contratosInternos.to.mujersubbol}" />
								<aon:outputLabel value="#{appBundle.aon_payroll_mujersub}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{contratosInternos.to.incareadbol}" />
								<aon:outputLabel value="#{appBundle.aon_payroll_incaread}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{contratosInternos.to.primertrabol}" />
								<aon:outputLabel value="#{appBundle.aon_payroll_primertra}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{contratosInternos.to.excsocialbol}" />
								<aon:outputLabel value="#{appBundle.aon_payroll_excsocial}" />
							</aon:div>
						</aon:div>
					</aon:panelGroup>
				</aon:panelGrid>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
