<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="contratosTc2List">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.auxiliares_contratos__ticotc2}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_listing}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="contratos_tc2_search" actionListener="#{contratosTc2.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />				
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="contratos_tc2" actionListener="#{contratosTc2.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="contratosTc2Data" value="#{contratosTc2.model}"
					var="to" rows="20" rendered="#{contratosTc2.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn, aon-editDataTable-textColumn">

					<aon:rowSelector action="contratos_tc2" actionListener="#{contratosTc2.onSelect}" />
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.cdg}"/>
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}"/>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_contratos__tipcotc2_desabr}" />
						</f:facet>
						<aon:outputText value="#{to.desabr}"/>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_contratos__tipcotc2_cdgant}" />
						</f:facet>
						<aon:outputText value="#{to.cdgant}"/>
					</aon:column>
 					
				</aon:dataTable>

				<aon:dataScroller for="contratosTc2Data" rowCount="#{contratosTc2.model.rowCount}" showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
