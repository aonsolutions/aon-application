<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="categoriaList">
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_auxiliares_convenios__categoria}" />
				<ui:param name="controller" value="#{categoria}" />
				
				<ui:define name="additionalToolbarContent">
					<ui:include src="/facelet/templates/aon.ui.printbuttons.xhtml">
						<ui:param name="controller" value="#{categoria}"/>
						<ui:param name="reportKey" value=""/>
						<ui:param name="reportKeyXls" value=""/>
					</ui:include>	
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="categoriaData" value="#{categoria.model}"
					var="to" rows="20" rendered="#{categoria.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn, aon-editDataTable-numberColumn">

					<aon:rowSelector action="categoria_form" actionListener="#{categoria.onSelect}" />
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.id.cdg}"/>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__convenio}" />
						</f:facet>
						<aon:outputText value="#{to.id.codcon}"/>
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}"/>
					</aon:column>

				</aon:dataTable>

				<aon:dataScroller2 for="categoriaData" showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
