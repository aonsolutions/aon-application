<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="nivelData" value="#{nivel.model}" 
			var="to" rows="0"
			rendered="#{(nivel.model.rowCount > 0) or (nivel.new)}" 
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-numberColumn
				, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{nivel.to == null}" actionListener="#{nivel.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{nivel.onReset}" value=""
							rendered="#{!nivel.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
				</f:facet>
				<aon:outputText value="#{to.id.cdg}" rendered="#{to!=nivel.to}" />
				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==nivel.to}" size="2"
					value="#{nivel.to.id.cdg}" maxlength="2" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{nivel.new}" size="2"
						value="#{nivel.to.id.cdg}" maxlength="2" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=nivel.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==nivel.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{nivel.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==nivel.to}"
						actionListener="#{nivel.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-elemento" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==nivelo.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{nivel.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!nivel.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{nivel.new}"
							actionListener="#{elemento.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-elemento" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{nivel.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{nivel.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
	</aon:div>

</ui:composition>
