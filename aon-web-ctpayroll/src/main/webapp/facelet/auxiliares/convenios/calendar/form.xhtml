<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="calendarForm">


<aon:div id="tabla">

			<rich:dataTable id="Calendar" value="#{calendar.yearModel}" var="m">
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:outputText value="#{m.desc}" />
				</aon:column>
				<rich:columns value="#{calendar.dias}" var="day" index="idx">
					<f:facet name="header">
						<aon:outputText value="#{day.diasem}" />
					</f:facet>
					<aon:div>
						<aon:outputText id="pic#{m.desc}#{idx}" value="#{m.days[idx].cdg}"
							style="width: 100%;text-align:center;background-color: #{m.days[idx].color};">
							<a4j:support ajaxSingle="true" event="onclick"
								actionListener="#{calendar.onChangeDay}" reRender="calendarForm" />
						</aon:outputText>
					</aon:div>
				</rich:columns>
			</rich:dataTable>
</aon:div>
			<h:panelGrid  id="filter" columns="2" dir="true" width="70%">

				<aon:div styleClass="aon-lookup">
					<aon:panelGrid columns="2" dir="true" width="50%"
						style="margin-bottom=2px;">

						<aon:outputLabel
							value="#{appBundle.aon_payroll_convenios_calendario}" />

						<rich:inputNumberSpinner  inputSize="4"
							value="#{calendar.actual}" maxValue="3000">
							<a4j:support event="onchange" ajaxSingle="true" 
								reRender="tabla,filter"  >
									<aon:actionListener method="#{calendar.load}" />
									<aon:actionListener method="#{calendar.clearFilter}" />
									</a4j:support>
						</rich:inputNumberSpinner>

					 	<aon:outputLabel value="#{appBundle.aon_payroll_resultados_tc2_emp}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="Emp_cdg" lookup="#{empresaLookup}"
						reRender="Emp_description" value="#{calendar.empresa.cdg}"
						size="5">
					</aon:lookupInputText>
					<aon:lookupButton id="Empresa_lookup"
						windowTitle="#{appBundle.aon_payroll_resultados_tc2_emp}"
						selectReRender="Emp_cdg,Emp_description" lookup="#{empresaLookup}"
						minHeight="440" property="#{calendar.empresa}">
					</aon:lookupButton>
					<aon:inputText id="Emp_description"
						value="#{(calendar.empresa.descripcion!=null)?(calendar.empresa.descripcion):('')}"
						size="60" disabled="true" />
				</aon:div>



				<aon:outputLabel value="#{appBundle.aon_payroll_resultados_tc2_act}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="Act_cdg" lookup="#{actividadLookup}"
						reRender="Act_description" value="#{calendar.actividad.cdg}"
						size="5">
					</aon:lookupInputText>
					<aon:lookupButton id="Act_lookup"
						windowTitle="#{appBundle.aon_payroll_resultados_tc2_act}"
						selectReRender="Act_cdg,Act_description"
						lookup="#{actividadLookup}" minHeight="440"
						property="#{calendar.actividad}">
					</aon:lookupButton>
					<aon:inputText id="Act_description"
						value="#{(calendar.actividad.descripcion!=null)?(calendar.actividad.descripcion):('')}"
						size="60" disabled="true" />
				</aon:div>


				<aon:outputLabel value="#{appBundle.aon_payroll_resultados_tc2_dom}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="Dom_cdg" lookup="#{domicilioLookup}"
						reRender="Dom_description" value="#{calendar.domicilio.cdg}"
						size="5">
					</aon:lookupInputText>
					<aon:lookupButton id="Dom_lookup"
						windowTitle="#{appBundle.aon_payroll_resultados_tc2_dom}"
						selectReRender="Dom_cdg,Dom_description"
						lookup="#{domicilioLookup}" minHeight="440"
						property="#{calendar.domicilio}">
					</aon:lookupButton>
					<aon:inputText id="Dom_description"
						value="#{(calendar.domicilio.nomvia!=null)?(calendar.domicilio.nomvia):('')}"
						size="60" disabled="true" />
				</aon:div>
					</aon:panelGrid>
				</aon:div>

				<aon:div>
					<aon:panel >
						<aon:outputText value="Festivo"
							style="width: 100%;text-align:center;background-color:#CC3333;" />
						<br />
						<aon:outputText value="No Laborable"
							style="width: 100%;text-align:center;background-color:#99CC66;" />
						<br />
						<aon:outputText value="Otros Dias"
							style="width: 100%;text-align:center;background-color:#0099FF;" />
						<br />
						<aon:outputText value="Laborable"
							style="width: 100%;text-align:center;background-color:white;" />
					</aon:panel>
				</aon:div>


			</h:panelGrid>

			<aon:commandButton value="VER CALENDARIO">
				<a4j:support event="onclick" actionListener="#{calendar.loadDays}"
					reRender="tabla" />
			</aon:commandButton>
			<aon:commandButton value="GUARDAR CAMBIOS">
				<a4j:support event="onclick"
					actionListener="#{calendar.saveModelDays}" reRender="calendarForm" />
			</aon:commandButton>


		</aon:form>
		<aon:lookupButtonPopup lookup="#{empresaLookup}" />
		<aon:lookupButtonPopup lookup="#{actividadLookup}" />
		<aon:lookupButtonPopup lookup="#{domicilioLookup}" />


	</ui:define>
</ui:composition>

</body>
</html>
