<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="complementoForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.auxiliares_convenios__complemento}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{complemento.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="convenios_complementos"
							actionListener="#{complemento.onAccept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{complemento.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{complemento.onCancel}"
							confirmAction="convenios_complementos_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!complemento.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{complemento.onRemove}"
							confirmAction="convenios_complementos_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!complemento.new}"
							action="convenios_complementos" 
							actionListener="#{complemento.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!complemento.new}"
							action="convenios_complementos_search" actionListener="#{complemento.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />				

						<aon:spin controller="#{complemento}" action="convenios_complementos" rendered="#{!complemento.new}" />
						
						<ui:include src="/facelet/templates/aon.ui.printbuttons.xhtml">
							<ui:param name="manager" value="#{convenioComplemento}"/>
							<ui:param name="reportKey" value="convenioComplementoList"/>
						</ui:include>

					</aon:div>
					<!-- end tool bar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div id="complemento" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_convenios__complemento_cdg}" />
					<aon:inputText id="Codigo" value="#{complemento.to.cdg}" disabled="#{!complemento.new}" 
						required="true" size="1" maxlength="2" />
					
					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_convenios__complemento_tipcot}" />
					<aon:selectOneMenu id="TipoCotizacion" value="#{complemento.to.tipcotenum}" >
						<f:selectItem value="#{null}" itemLabel=" -  " />
						<f:selectItems value="#{complemento.listaCotizaciones}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_convenios__complemento_description}" />
					<aon:inputText id="Descripcion" value="#{complemento.to.description}" 
						size="50" maxlength="50" />
						
					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_convenios__complemento_desabr}" />
					<aon:inputText id="DescripcionAbreviada" value="#{complemento.to.desabr}"  
						size="20" maxlength="15" />
						
					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_convenios__complemento_tipcom}" />
					<aon:selectOneMenu id="TipoComplemento" value="#{complemento.to.tipcomenum}" >	
						<f:selectItem value="#{null}" itemLabel=" -  " />											
						<f:selectItems value="#{complemento.listaComplementos}"/>
					</aon:selectOneMenu>

					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_convenios__complemento_dinesp}" />
					<aon:selectOneRadio id="Retribucion" value="#{complemento.to.retribuciones}" >	
						<f:selectItems value="#{complemento.listaRetribuciones}"/>											
					</aon:selectOneRadio>
					
					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_convenios__complemento_fijovar}" />
					<aon:selectOneRadio id="FijoVariable" value="#{complemento.to.fijoVariable}" >	
						<f:selectItems value="#{complemento.listaFijoVariable}"/>											
					</aon:selectOneRadio>
					
					<aon:outputLabel value=" " />
					<aon:selectOneRadio id="IndComplemento" value="#{complemento.to.indiceComplemento}" >	
						<f:selectItems value="#{complemento.listaIndiceComplemento}"/>											
					</aon:selectOneRadio>
					
				</aon:panelGrid>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
