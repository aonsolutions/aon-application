<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="percepcionForm">


			<ui:include src="/facelet/templates/formPrintToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_avanzadas_simulacion}" />
				<ui:param name="controller" value="#{costes}" />

			</ui:include>


			<aon:div styleClass="aon-scroll-area aon-scroll-area-principales">
				<aon:panelGrid columns="4" dir="true" width="100%"
					style="margin-bottom=2px;">


					<aon:outputLabel
						value="#{appBundle.aon_payroll_avanzadas_simulacion_tra}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Tra_cdg" lookup="#{trabajadorLookup}"
							value="#{costes.to.codemp.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Tra_lookup"
							windowTitle="#{appBundle.aon_payroll_avanzadas_hojas_cen}"
							selectReRender="Tra_cdg" lookup="#{trabajadorLookup}"
							minHeight="440" property="#{costes.to.codemp}">
						</aon:lookupButton>
					</aon:div>




					<aon:outputLabel
						value="#{appBundle.aon_payroll_avanzadas_simulacion_apenom}" />
					<aon:inputText value="#{costes.to.descripcion}" 
						size="30" maxlength="8" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_avanzadas_simulacion_csg}" />
					<aon:inputText value="#{costes.to.id.numero}" 
						size="8" maxlength="8" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_avanzadas_simulacion_anio}" />
					<aon:inputText value="#{costes.to.anionac}" 
						size="8" maxlength="8" />


				</aon:panelGrid>





				<rich:tabPanel height="250" switchType="client">

					<rich:tab id="datos"
						label="#{appBundle.aon_payroll_principales_clientes_datos}">


						<aon:panelGrid columns="4" dir="true" width="100%"
							style="margin-bottom=2px;">

							<aon:outputText
								value="#{appBundle.aon_payroll_avanzadas_simulacion_sit}" />

							<aon:selectOneMenu layout="pageDirection"
								value="#{costes.to.sitfam}">
								<f:selectItem value="#{null}" itemLabel="    " />
								<f:selectItems value="#{costes.listasitus}" />
							</aon:selectOneMenu>

							<aon:outputText
								value="#{appBundle.aon_payroll_avanzadas_simulacion_min}" />

							<aon:selectOneMenu layout="pageDirection"
								value="#{costes.to.xminus}">
								<f:selectItem value="#{null}" itemLabel="    " />
								<f:selectItems value="#{costes.listaminus}" />
							</aon:selectOneMenu>



							<aon:outputText
								value="#{appBundle.aon_payroll_avanzadas_simulacion_cot}" />

							<aon:selectOneMenu layout="pageDirection"
								value="#{costes.to.procot}">
								<f:selectItem value="#{null}" itemLabel="    " />
								<f:selectItems value="#{costes.listadimes}" />
							</aon:selectOneMenu>


							<aon:outputText
								value="#{appBundle.aon_payroll_avanzadas_simulacion_ret}" />

							<aon:selectOneMenu layout="pageDirection"
								value="#{costes.to.proret}">
								<f:selectItem value="#{null}" itemLabel="    " />
								<f:selectItems value="#{costes.listadimes}" />
							</aon:selectOneMenu>



							<aon:outputText
								value="#{appBundle.aon_payroll_avanzadas_simulacion_tiem}" />

							<aon:selectOneMenu layout="pageDirection"
								value="#{costes.to.indtp}">
								<f:selectItem value="#{null}" itemLabel="    " />
								<f:selectItems value="#{costes.listajornada}" />
							</aon:selectOneMenu>


						</aon:panelGrid>


					</rich:tab>

					<rich:tab id="datos1"
						label="#{appBundle.aon_payroll_principales_clientes_datos}">

						<aon:panel>
							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_avanzadas_simulacion_imp}" />
							</f:facet>

							<aon:panelGrid columns="4" dir="true" width="100%"
								style="margin-bottom=2px;">


								<aon:outputLabel
									value="#{appBundle.aon_payroll_avanzadas_simulacion_pen}" />
								<aon:inputText value="#{costes.to.impPension}" 
									size="30" maxlength="8" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_avanzadas_simulacion_anu}" />
								<aon:inputText value="#{costes.to.impAnual}" 
									size="8" maxlength="8" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_avanzadas_simulacion_red}" />
								<aon:inputText value="#{costes.to.impIrreg}" 
									size="8" maxlength="8" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_avanzadas_simulacion_cotsss}" />
								<aon:inputText value="#{costes.to.impSs}" 
									size="8" maxlength="8" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_avanzadas_simulacion_por}" />
								<aon:inputText value="#{costes.to.solicita}" 
									size="8" maxlength="8" />
							</aon:panelGrid>
						</aon:panel>



						<aon:panelGrid columns="4" dir="true" width="100%"
							style="margin-bottom=2px;">




							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_apre}" />

							<aon:selectBooleanCheckbox value="#{costes.to.aprendiz}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_ct}" />

							<aon:selectBooleanCheckbox value="#{costes.to.temporal}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_alto}" />

							<aon:selectBooleanCheckbox value="#{costes.to.alto}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_porante}" />

							<aon:selectBooleanCheckbox value="#{costes.to.minimo}" />


						</aon:panelGrid>


					</rich:tab>

					<rich:tab id="datos2"
						label="#{appBundle.aon_payroll_principales_clientes_datos}">

						<aon:panelGrid columns="4" dir="true" width="100%"
							style="margin-bottom=2px;">



							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_re}" />
							<aon:inputText value="#{costes.to.semana}" 
								size="30" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_timpo}" />
							<aon:inputText value="#{costes.to.semanatp}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_can}" />
							<aon:inputText value="#{costes.to.cantp}" 
								size="8" maxlength="8" />




							<aon:outputLabel for="Base_cdg"
								value="#{appBundle.aon_payroll_avanzadas_hojas_gtar}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Base_cdg" lookup="#{baseLookup}"
									reRender="Base_descripcion" value="#{costes.to.basecoti.cdg}"
									size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Base_lookup"
									windowTitle="#{appBundle.aon_payroll_avanzadas_hojas_gtar}"
									selectReRender="Base_cdg,Base_descripcion"
									lookup="#{baseLookup}" minHeight="440"
									property="#{costes.to.basecoti}">
								</aon:lookupButton>
								<aon:inputText id="Base_descripcion"
									value="#{(costes.to.basecoti.description!=null)?(costes.to.basecoti.description):('')}"
									size="34" disabled="true" />
							</aon:div>

							<aon:outputLabel for="Epigrafe_cdg"
								value="#{appBundle.aon_payroll_avanzadas_hojas_epi}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Epigrafe_cdg"
									lookup="#{epigrafeLookup}" reRender="Epigrafe_description"
									value="#{costes.to.epigrafe.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Epigrafe_lookup"
									windowTitle="#{appBundle.aon_payroll_avanzadas_hojas_epi}"
									selectReRender="Epigrafe_cdg,Epigrafe_description"
									lookup="#{epigrafeLookup}" minHeight="440"
									property="#{costes.to.epigrafe}">
								</aon:lookupButton>
								<aon:inputText id="Epigrafe_description"
									value="#{(costes.to.epigrafe.description!=null)?(costes.to.epigrafe.description):('')}"
									size="34" disabled="true" />
							</aon:div>

							<aon:outputLabel for="Por_cdg"
								value="#{appBundle.aon_payroll_avanzadas_simulacion_asim}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Por_cdg" lookup="#{porcentajeLookup}"
									reRender="Por_description"
									value="#{costes.to.porcoti.cdg}" size="10">
								</aon:lookupInputText>
								<aon:lookupButton id="Por_lookup"
									windowTitle="#{appBundle.aon_payroll_avanzadas_simulacion_asim}"
									selectReRender="Por_cdg,Por_description"
									lookup="#{porcentajeLookup}" minHeight="440"
									property="#{costes.to.porcoti}">
								</aon:lookupButton>
								<aon:inputText id="Por_description"
									value="#{(costes.to.porcoti.description!=null)?(costes.to.porcoti.description):('')}"
									size="34" disabled="true" />
							</aon:div>



						</aon:panelGrid>

						<aon:panel>
							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_avanzadas_simulacion_plu}" />
							</f:facet>
							<aon:panelGrid columns="4" dir="true" width="100%"
								style="margin-bottom=2px;">
								<aon:outputLabel
									value="#{appBundle.aon_payroll_avanzadas_simulacion_numaut}" />
								<aon:inputText value="#{costes.to.plunumaut}" 
									size="30" maxlength="8" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_avanzadas_simulacion_poplu}" />
								<aon:inputText value="#{costes.to.pluprcmin}" 
									size="8" maxlength="8" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_avanzadas_simulacion_popluu}" />
								<aon:inputText value="#{costes.to.pluprcmax}" 
									size="8" maxlength="8" />
							</aon:panelGrid>
						</aon:panel>


					</rich:tab>

					<rich:tab id="datos3" rendered="#{!costes.new}"
						label="#{appBundle.aon_payroll_avanzadas_simulacion_boni}">
	                     <aon:div id="linDiv">

								<ui:include src="grid.xhtml" />
							</aon:div>


					</rich:tab>
					
					<rich:tab id="datos4" rendered="#{!costes.new}"
						label="#{appBundle.aon_payroll_avanzadas_simulacion_comu}">
	                     <aon:div id="linDiv2">

							 	<ui:include src="grid2.xhtml" />
							</aon:div>


					</rich:tab>


				</rich:tabPanel>


				<h:panelGrid columns="3" dir="true" width="100%"
					style="margin-bottom=2px;">
					<aon:div styleClass="aon-scroll-area aon-scroll-area-sim">
						<aon:panelGrid columns="2" dir="true" width="100%"
							style="margin-bottom=2px;">

							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_avanzadas_simulacion_actu}" />
							</f:facet>

						<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_but}" />
							<aon:inputText value="#{costes.to.impActual}" 
								size="8" maxlength="8" />

                            <aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_impext}" />
							<aon:inputText value="#{costes.to.impExtActual}" 
								size="8" maxlength="8" />


							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_seg}" />
							<aon:inputText value="#{costes.to.ssActual}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_rete}" />
							<aon:inputText value="#{costes.to.irpfActual}" 
								size="8" maxlength="8" />
							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_net}" />
							<aon:inputText value="#{costes.to.netoActual}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_ss}" />
							<aon:inputText value="#{costes.to.ssEmpActual}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_coste}" />
							<aon:inputText value="#{costes.to.costeActual}" 
								size="8" maxlength="8" />

						

						</aon:panelGrid>
					</aon:div>

					<aon:div styleClass="aon-scroll-area aon-scroll-area-sim">
						<aon:panelGrid columns="2" dir="true" width="100%"
							style="margin-bottom=2px;">

							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_avanzadas_simulacion_sup}" />
							</f:facet>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_but}" />
							<aon:inputText value="#{costes.to.impSupuesto}" 
								size="8" maxlength="8" />

                            <aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_impext}" />
							<aon:inputText value="#{costes.to.impExtSupuesto}" 
								size="8" maxlength="8" />


							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_seg}" />
							<aon:inputText value="#{costes.to.ssSupuesto}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_rete}" />
							<aon:inputText value="#{costes.to.irpfSupuesto}" 
								size="8" maxlength="8" />
							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_net}" />
							<aon:inputText value="#{costes.to.netoSupuesto}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_ss}" />
							<aon:inputText value="#{costes.to.ssEmpSupuesto}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_coste}" />
							<aon:inputText value="#{costes.to.costeSupuesto}" 
								size="8" maxlength="8" />

				

						</aon:panelGrid>
					</aon:div>


					<aon:div styleClass="aon-scroll-area aon-scroll-area-sim">
						<aon:panelGrid columns="2" dir="true" width="100%"
							style="margin-bottom=2px;">

							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_avanzadas_simulacion_dif}" />
							</f:facet>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_but}" />
							<aon:inputText value="#{costes.to.impDiferencia}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_impext}" />
							<aon:inputText value="#{costes.to.impExtDiferencia}" 
								size="8" maxlength="8" />


							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_seg}" />
							<aon:inputText value="#{costes.to.ssDiferencia}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_rete}" />
							<aon:inputText value="#{costes.to.irpfDiferencia}" 
								size="8" maxlength="8" />
							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_net}" />
							<aon:inputText value="#{costes.to.netoDiferencia}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_ss}" />
							<aon:inputText value="#{costes.to.ssEmpDiferencia}" 
								size="8" maxlength="8" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_avanzadas_simulacion_coste}" />
							<aon:inputText value="#{costes.to.costeDiferencia}" 
								size="8" maxlength="8" />

					
						</aon:panelGrid>
					</aon:div>
				</h:panelGrid>





			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{trabajadorLookup}" />
		<aon:lookupButtonPopup lookup="#{baseLookup}" />
		<aon:lookupButtonPopup lookup="#{epigrafeLookup}" />
		<aon:lookupButtonPopup lookup="#{porcentajeLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
