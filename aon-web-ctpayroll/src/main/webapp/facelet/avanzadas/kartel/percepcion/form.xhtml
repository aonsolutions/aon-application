<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="percepcionForm">
			
			
			<ui:include src="/facelet/templates/formPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_avanzadas_kartel_percepcion}" />				
				<ui:param name="controller" value="#{percepcion}" />
				<ui:param name="reportKey" value="percepcionList"/>
				<ui:param name="reportKeyXls" value="percepcionXlsList"/>
			</ui:include>
			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="percepcion" columns="2" dir="true" width="100%" style="margin-bottom=2px;">
				
					<aon:outputLabel value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText value="#{percepcion.to.cdg}" disabled="#{!percepcion.new}" 
						required="true" size="8" maxlength="8" />
				
					<aon:outputLabel  value="#{appBundle.aon_payroll_description}" />
					<aon:inputText value="#{percepcion.to.descripcion}" 
						size="50" maxlength="35" >
					</aon:inputText>
						
					<aon:outputLabel value="#{appBundle.aon_payroll_avanzadas_kartel_percepcion_tipo}" />
					<aon:selectOneMenu id="Tipo" value="#{percepcion.to.tipo}" required="#{true}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{percepcion.listaTipos}" />
					</aon:selectOneMenu>
				 
				</aon:panelGrid>

			 	<ui:include src="grid.xhtml" rendered="#{!percepcion.new}" />		 		
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
