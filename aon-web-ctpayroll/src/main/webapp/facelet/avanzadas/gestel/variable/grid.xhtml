<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<rich:spacer />
		<aon:editDataTable id="linbaseData" value="#{variable.model}" var="to"
			rows="0"
			rendered="#{(variable.model.rowCount > 0) or (variable.new)}"
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				,aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				,aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				,aon-editDataTable-numberColumn,aon-editDataTable-numberColumn,aon-editDataTable-numberColumn,aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{variable.to == null}"
				actionListener="#{variable.onSelect}" />

			<f:facet name="header">


				<rich:columnGroup>

					<rich:column colspan="1">

					</rich:column>

		             <rich:column colspan="2">
                            <aon:outputText
							value="#{appBundle.aon_payroll_avanzadas_gestel_vig}" />
					</rich:column>
				
                    <rich:column colspan="2">

					</rich:column>
				
                      <rich:column colspan="2">
                                 <aon:outputText
							value="#{appBundle.aon_payroll_avanzadas_gestel_fest}" />
					</rich:column>
				
                      <rich:column colspan="1">

					</rich:column>
				
                      <rich:column colspan="2">
                           <aon:outputText
							value="#{appBundle.aon_payroll_avanzadas_gestel_horex}" />
					</rich:column>
				
                      <rich:column colspan="2">
                        <aon:outputText
							value="#{appBundle.aon_payroll_avanzadas_gestel_horfes}" />
					</rich:column>
				
					
				

				</rich:columnGroup>
				
			</f:facet>
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{variable.onReset}" value=""
							rendered="#{!variable.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>

				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_avanzadas_gestel_ini}" />
				</f:facet>
				<aon:outputText value="#{to.id.fecini}"
					rendered="#{to!=variable.to}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{variable.to.id.fecini}"
					inputSize="10" rendered="#{to==variable.to}"
					disabled="#{to==variable.to}" renderAsPopup="true"
					popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{variable.to.id.fecini}"
						rendered="#{variable.new}" inputSize="10" renderAsPopup="true"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_avanzadas_gestel_fin}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}" rendered="#{to!=variable.to}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{variable.to.fecfin}"
					rendered="#{to==variable.to}" inputSize="10" renderAsPopup="true"
					popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{variable.to.fecfin}"
						rendered="#{variable.new}" inputSize="10" renderAsPopup="true"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_gestel_noc}" />
				</f:facet>
				<aon:outputText value="#{to.nocturnidad}" rendered="#{to!=variable.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>

				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==variable.to}" size="5"
					value="#{variable.to.nocturnidad}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{variable.new}" size="5" value="#{variable.to.nocturnidad}"
						maxlength="10" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_gestel_plus}" />
				</f:facet>
				<aon:outputText value="#{to.transporte}" rendered="#{to!=variable.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==variable.to}" size="5"
					value="#{variable.to.transporte}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{variable.new}" size="5" value="#{variable.to.transporte}"
						maxlength="10" />
				</f:facet>
			</aon:column>


			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_gestel_nor}" />
				</f:facet>
				<aon:outputText value="#{to.festivo}" rendered="#{to!=variable.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>

				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==variable.to}" size="5"
					value="#{variable.to.festivo}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{variable.new}" size="5" value="#{variable.to.festivo}"
						maxlength="10" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_gestel_esp}" />
				</f:facet>
				<aon:outputText value="#{to.festivoesp}" rendered="#{to!=variable.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==variable.to}" size="5"
					value="#{variable.to.festivoesp}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{variable.new}" size="5" value="#{variable.to.festivoesp}"
						maxlength="10" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_gestel_dom}" />
				</f:facet>
				<aon:outputText value="#{to.domingo}" rendered="#{to!=variable.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>

				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==variable.to}" size="5"
					value="#{variable.to.domingo}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{variable.new}" size="5" value="#{variable.to.domingo}"
						maxlength="10" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_gestel_diu}" />
				</f:facet>
				<aon:outputText value="#{to.diurna}" rendered="#{to!=variable.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==variable.to}" size="5"
					value="#{variable.to.diurna}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{variable.new}" size="5" value="#{variable.to.diurna}"
						maxlength="10" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_gestel_noctur}" />
				</f:facet>
				<aon:outputText value="#{to.nocturna}" rendered="#{to!=variable.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>

				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==variable.to}" size="5"
					value="#{variable.to.nocturna}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{variable.new}" size="5" value="#{variable.to.nocturna}"
						maxlength="10" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_gestel_diu}" />
				</f:facet>
				<aon:outputText value="#{to.festdiurna}" rendered="#{to!=variable.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==variable.to}" size="5"
					value="#{variable.to.festdiurna}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{variable.new}" size="5" value="#{variable.to.festdiurna}"
						maxlength="10" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_gestel_noctur}" />
				</f:facet>
				<aon:outputText value="#{to.festnocturna}" rendered="#{to!=variable.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>

				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==variable.to}" size="5"
					value="#{variable.to.festnocturna}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{variable.new}" size="5" value="#{variable.to.festnocturna}"
						maxlength="10" />
				</f:facet>
			</aon:column>








			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=variable.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]"
						rendered="#{to==variable.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{variable.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==variable.to}"
						actionListener="#{variable.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje"
						title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==variable.to}"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{variable.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!variable.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]"
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{variable.new}" actionListener="#{variable.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje"
							title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{variable.new}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{variable.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

		</aon:editDataTable>
	</aon:div>

</ui:composition>
