<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

<aon:div id="tipcuentasasigDataDiv">

		<aon:panelGrid columns="2">
			<aon:div>
				<aon:editDataTable id="tipcuentasasigData" var="to" rows="5"
					styleClass="tablasmini"
					rendered="#{(tipcuenta.model.rowCount > 0) or (tipcuenta.new)}"
					value="#{tipcuenta.model}"
					columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

					<!-- 	<aon:rowSelector action="tipcuenta_form"
							actionListener="#{tipcuenta.onSelect}" /> -->

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>

						<aon:div>
							<aon:commandButton alt="[#{bundle.aon_reset}]"
								styleClass="aon-editDataTable-button aon-icon-rowSelector "
								actionListener="#{tipcuenta.onSelect}" 
								reRender="datos2"
								accesskey="#{bundle.aon_key_new_line}" />
						</aon:div>
						
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.cdg}" />

					</aon:column>


					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_cuenta_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.cuenta.cdg}" />

					</aon:column>


					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_cuenta_entidad_nom}" />
						</f:facet>
						<aon:outputText value="#{to.cuenta.entidad.cdg}" />

					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_cuenta_sucursal2}" />
						</f:facet>
						<aon:outputText value="#{to.cuenta.sucursal.id.cdg}" />

					</aon:column>
					
							<aon:column>
						<f:facet name="header">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_tipocuenta}" />
						</f:facet>
						<aon:outputText value="#{to.tipcta}" rendered="#{to!=tipcuenta.to}" disabled="true" size="50"
							maxlength="20" />

						<aon:selectOneMenu id="Tipoctas" value="#{tipcuenta.to.tipcta}" 	rendered="#{to==tipcuenta.to}">
							<f:selectItem value="#{null}" itemLabel=" -  " />
							<f:selectItems value="#{tipcuenta.listaTipos}" />
						</aon:selectOneMenu>
						
							<aon:commandButton title="[#{bundle.aon_accept}]"
							rendered="#{to==tipcuenta.to}"
							styleClass="aon-editDataTable-button aon-icon-accept"
							actionListener="#{tipcuenta.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:commandButton title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{to==tipcuenta.to}"
							actionListener="#{tipcuenta.onCancel}" immediate="true" reRender="datos"
							accesskey="#{bundle.aon_key_cancel_line}" />
						<aon:confirmButton id="remove-Porcentaje"
							title="[#{bundle.aon_remove}]"
							styleClass="aon-editDataTable-button aon-icon-delete"
							rendered="#{to==tipcuenta.to}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{tipcuenta.onRemove}" immediate="true"
							accesskey="#{bundle.aon_key_remove_line}" />
					</aon:column>
						
					
					
				</aon:editDataTable>
				<rich:spacer>
				
				</rich:spacer>
				<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_tipocuenta_ver}    " />
				<aon:selectOneMenu id="TipoCta" valueChangeListener="#{tipcuenta.typeChanged}">
                <a4j:support event="onchange" reRender="typeChanged" />
					<f:selectItem value="#{null}" itemLabel=" -  " />
					<f:selectItems value="#{tipcuenta.listaTipos}" />
				</aon:selectOneMenu>
				
				<aon:outputText id="typeChanged" value="#{tipcuenta.typeChanged}"
					 />
				
				
			</aon:div>
			<aon:div id="datos2">

			<aon:panelGrid styleClass="tablasmini" columns="2" dir="true"
					width="100%" style="margin-bottom=2px;">
					                  
					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_tipocuenta_empresa}" />
					<aon:outputText value="#{tipcuenta.to.empresa.descripcion}"
						disabled="true" size="50" maxlength="20" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_tipocuenta_actividad}" />
					<aon:outputText value="#{tipcuenta.to.actividad.descripcion}"
						disabled="true" size="50" maxlength="20" />
            
                	
					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_cuenta_entidad_nom}" />
					<aon:outputText value="#{tipcuenta.to.cuenta.entidad.description}"
						disabled="true" size="50" maxlength="20" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_cuenta_sucursal}" />
					<aon:outputText value="#{tipcuenta.to.cuenta.sucursal.domsuc}"
						disabled="true" size="50" maxlength="20" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_clientes_codpos}" />
					<aon:outputText value="#{tipcuenta.to.cliente.codpos}"
						disabled="true" size="50" maxlength="20" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_clientes_localidad}" />
					<aon:outputText value="#{tipcuenta.to.cliente.localidad}"
						disabled="true" size="50" maxlength="20" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_clientes_provincia}" />
					<aon:outputText
						value="#{tipcuenta.to.cliente.provincia.descripcion}"
						disabled="true" size="50" maxlength="20" />


				</aon:panelGrid>



			</aon:div>

		</aon:panelGrid>

	
		<aon:dataScroller2 for="tipcuentasasigData" showNote="true" />

	</aon:div>

</ui:composition>
