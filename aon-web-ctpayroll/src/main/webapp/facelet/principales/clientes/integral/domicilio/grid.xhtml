<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich">

<aon:div id="domiciliosDataDiv">

	<aon:editDataTable id="domiciliosData" var="to" rows="4"
						rendered="#{(domicilio.model.rowCount > 0) or (domicilio.new)}" value="#{domicilio.model}"
						columnClasses="aon-editDataTable-iconColumn, 
						aon-editDataTable-numberColumn,aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
								
				
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							
							<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-rowSelector "
										actionListener="#{domicilio.onSelect}" action="domicilio_form"
										
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							<f:facet name="footer">
								<aon:div>
									<h:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{domicilio.onReset}" action="domicilio_form"
										rendered="#{!domicilio.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_domicilio_cdg1}" />
							</f:facet>
							<aon:outputText value="#{to.cdg}"  />
						
							
						</aon:column>
						
							<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_clientes_tipovia}" />
							</f:facet>
							<aon:outputText value="#{to.tipovia.description}" />
							
						</aon:column>
						
						
							<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_clientes_tipovia2}" />
							</f:facet>
							<aon:outputText value="#{to.nomvia}" size="60"  />
							
						</aon:column>
						
						
							<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_clientes_num}" />
							</f:facet>
							<aon:outputText value="#{to.numero}"  />
							
						</aon:column>
						
											
							<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_clientes_codpos}" />
							</f:facet>
							<aon:outputText value="#{to.codpos}"  />
							
						</aon:column>
						
							<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_clientes_localidad}" />
							</f:facet>
							<aon:outputText value="#{to.localidad}"  />
							
						</aon:column>
						
						
					
							<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_clientes_email}" />
							</f:facet>
							<aon:outputText value="#{to.email}"  />
							
						</aon:column>
						
					  
						
						
					</aon:editDataTable>
					<aon:dataScroller2 for="domiciliosData" showNote="true" />
										
			      <aon:outputLabel for="Empresa_cdg" 
						value="#{appBundle.aon_payroll_principales_tipocuenta_empresa}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Empre_cdg"
							lookup="#{empresaLookup}"
							reRender="Empr_description"
							value="#{tipdomicilio.to.empresa.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Empre_lookup"
							windowTitle="#{appBundle.aon_payroll_principales_tipocuenta_empresa}"
							selectReRender="Empr_cdg,Empr_description"
							lookup="#{empresaLookup}" minHeight="440"
							property="#{tipdomicilio.to.empresa}">
						</aon:lookupButton>
						<aon:inputText id="Empre_description"
							value="#{(tipdomicilio.to.empresa.descripcion!=null)?(tipdomicilio.to.empresa.descripcion):('')}"   
							size="60" disabled="true" />
					</aon:div>
					 
					 	
			      <aon:outputLabel for="Actividad_cdg" 
						value="#{appBundle.aon_payroll_principales_tipocuenta_actividad}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Acti_cdg"
							lookup="#{actividadLookup}"
							reRender="Act_description"
							value="#{tipdomicilio.to.actividad.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Acti_lookup"
							windowTitle="#{appBundle.aon_payroll_principales_tipocuenta_actividad}"
							selectReRender="Act_cdg,Act_description"
							lookup="#{actividadLookup}" minHeight="440"
							property="#{tipdomicilio.to.actividad}">
						</aon:lookupButton>
						<aon:inputText id="Acti_description"
							value="#{(tipdomicilio.to.actividad.descripcion!=null)?(tipcuenta.to.actividad.descripcion):('')}"   
							size="60" disabled="true" />
					</aon:div>
					 
		   	<aon:commandButton id="asignardom" value="#{appBundle.aon_payroll_principales_tipodomcilio_asignar}"	
				styleClass="aon-finding-toolbar-item aon-icon-transfer"
				action="integral_form" rendered="#{!controller.new}" 
				actionListener="#{cliente.onEditSearch}">
	    	</aon:commandButton>
	    	
	    
	    
					<aon:selectOneMenu id="TipoDoms" value="#{tipdomicilio.to.tipdom}" >												
						<f:selectItem value="#{null}" itemLabel=" -  " />
						<f:selectItems value="#{tipdomicilio.listaTipos}" />
					</aon:selectOneMenu>
	
</aon:div>

</ui:composition>
