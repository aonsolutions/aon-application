<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="clientesForm">

			<ui:include src="/facelet/templates/formPrintToolbarCliente.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_principales_clientes}" />
				<ui:param name="controller" value="#{cliente}" />							
				<ui:param name="reportKey" value="ClienteListDetail" />
				<ui:param name="reportKeyXls" value="ClienteListXLS" />
			</ui:include>


			<aon:div id="clientes"
				styleClass="aon-scroll-area aon-scroll-area-principales">


				<aon:div id="datos1" styleClass="aon-scroll-area">
					<aon:panelGrid columns="4" dir="true" width="100%">


						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_clientes_cod}" />
						<aon:inputText value="#{cliente.to.cdg}" maxlength="4"  disabled="true"/>

						<aon:outputLabel for="nombre"
							value="#{appBundle.aon_payroll_principales_clientes_nom}" />
						<aon:inputText id="nombre" value="#{cliente.to.descripcion}"
							size="60" required="true" maxlength="60" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_clientes_alias}" />
						<aon:inputText value="#{cliente.to.alias}" size="60"
							maxlength="25" />

						<aon:outputLabel for="Dele_cdg"
							value="#{appBundle.aon_payroll_principales_clientes_deleg}" />
						<aon:div styleClass="aon-lookup">
							<aon:lookupInputText id="Delegacion_cdg" lookup="#{delegacionLookup}"
								reRender="Del_description" value="#{cliente.to.delegacion.cdg}"
								required="true" size="5">
							</aon:lookupInputText>
							<aon:lookupButton id="Del_lookup"
								windowTitle="#{appBundle.aon_payroll_principales_clientes_deleg}"
								selectReRender="Delelegacion_cdg,Del_description"
								lookup="#{delegacionLookup}" minHeight="440"
								property="#{cliente.to.delegacion}">
							</aon:lookupButton>
							<aon:inputText id="Del_description"
								value="#{(cliente.to.delegacion.descripcion!=null)?(cliente.to.delegacion.descripcion):('')}"
								size="34" disabled="true" />
						</aon:div>

						<aon:outputLabel for="Empr_cdg"
							value="#{appBundle.aon_payroll_principales_clientes_empre}" />
						<aon:div styleClass="aon-lookup">
							<aon:lookupInputText id="Emp_cdg" lookup="#{empresarioLookup}"
								reRender="Emp_description" value="#{cliente.to.tipempr.cdg}"
								size="5">
							</aon:lookupInputText>
							<aon:lookupButton id="Emp_lookup"
								windowTitle="#{appBundle.aon_payroll_principales_clientes_empre}"
								selectReRender="Emp_cdg,Emp_description"
								lookup="#{empresarioLookup}" minHeight="440"
								property="#{cliente.to.tipempr}">
							</aon:lookupButton>
							<aon:inputText id="Emp_description"
								value="#{(cliente.to.tipempr.description!=null)?(cliente.to.tipempr.description):('')}"
								size="34" disabled="true" />
						</aon:div>
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_clientes_cliinac}" />
						<aon:selectBooleanCheckbox value="#{cliente.to.inactivo}" />


					</aon:panelGrid>
				</aon:div>
				<rich:spacer />


				<aon:div>
					<rich:tabPanel switchType="client">

						<rich:tab id="datos"
							label="#{appBundle.aon_payroll_principales_clientes_datos}">

							<aon:div id="datosDiv">
								<aon:div id="datos2" styleClass="aon-scroll-area">

									<aon:panelGrid columns="4" dir="true" width="100%">

										<aon:outputLabel for="Docu_cdg"
											value="#{appBundle.aon_payroll_principales_clientes_doc}" />
										<aon:div styleClass="aon-lookup">
											<aon:lookupInputText id="Doc_cdg" lookup="#{documentoLookup}"
												reRender="Doc_description" value="#{cliente.to.tipdoc.cdg}"
												size="5">
											</aon:lookupInputText>
											<aon:lookupButton id="Doc_lookup"
												windowTitle="#{appBundle.aon_payroll_principales_clientes_doc}"
												selectReRender="Doc_cdg,Doc_description"
												lookup="#{documentoLookup}" minHeight="440"
												property="#{cliente.to.tipdoc}">
											</aon:lookupButton>
											<aon:inputText id="Doc_description"
												value="#{(cliente.to.tipdoc.description!=null)?(cliente.to.tipdoc.description):('')}"
												size="60" disabled="true" />
										</aon:div>

										<aon:outputLabel for="numero_Documento"
											value="#{appBundle.aon_payroll_principales_clientes_numdoc}" />
										<aon:inputText id="numero_Documento" value="#{cliente.to.numdoc}"
											size="60" required="true" maxlength="20" />

										<aon:outputLabel for="Divi_cdg"
											value="#{appBundle.aon_payroll_principales_clientes_div}" />
										<aon:div styleClass="aon-lookup">
											<aon:lookupInputText id="Div_cdg" lookup="#{divisaLookup}"
												reRender="Div_description" value="#{cliente.to.divisa.cdg}"
												size="5">
											</aon:lookupInputText>
											<aon:lookupButton id="Divi_lookup"
												windowTitle="#{appBundle.aon_payroll_principales_clientes_div}"
												selectReRender="Div_cdg,Div_description"
												lookup="#{divisaLookup}" minHeight="440"
												property="#{cliente.to.divisa}">
											</aon:lookupButton>
											<aon:inputText id="Div_description"
												value="#{(cliente.to.divisa.description!=null)?(cliente.to.divisa.description):('')}"
												size="60" disabled="true" />
										</aon:div>

										<aon:outputLabel for="Pais_cdg"
											value="#{appBundle.aon_payroll_principales_clientes_paisemi}" />
										<aon:div styleClass="aon-lookup">
											<aon:lookupInputText id="Pais_cdg" lookup="#{paisLookup}"
												reRender="Pais_description" value="#{cliente.to.pais.cdg}"
												required="true" size="5">
											</aon:lookupInputText>
											<aon:lookupButton id="Pais_lookup"
												windowTitle="#{appBundle.aon_payroll_principales_clientes_paisemi}"
												selectReRender="Pais_cdg,Pais_description"
												lookup="#{paisLookup}" minHeight="440"
												property="#{cliente.to.pais}">
											</aon:lookupButton>
											<aon:inputText id="Pais_description"
												value="#{(cliente.to.pais.descripcion!=null)?(cliente.to.pais.descripcion):('')}"
												size="60" disabled="true" />
										</aon:div>


									</aon:panelGrid>
								</aon:div>

								<aon:div id="datos3" styleClass="aon-scroll-area">
									<aon:panelGrid columns="4" dir="true" width="100%"
										style="margin-bottom=2px;">

										<aon:outputLabel for="Tipoviaa_cdg"
											value="#{appBundle.aon_payroll_principales_clientes_tipovia}" />
										<aon:div styleClass="aon-lookup">
											<aon:lookupInputText id="Tipovia_cdg"
												lookup="#{tipoviaLookup}" reRender="Tipovia_description"
												value="#{cliente.to.tipovia.cdg}" size="5">
											</aon:lookupInputText>
											<aon:lookupButton id="Tipovia_lookup"
												windowTitle="#{appBundle.aon_payroll_auxiliares_tipos__tipovia}"
												selectReRender="Tipovia_cdg,Tipovia_description"
												lookup="#{tipoviaLookup}" minHeight="440"
												property="#{cliente.to.tipovia}">
											</aon:lookupButton>
											<aon:inputText id="Tipovia_description"
												value="#{(cliente.to.tipovia.description!=null)?(cliente.to.tipovia.description):('')}"
												size="34" disabled="true" />
										</aon:div>

										<aon:outputLabel
											value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__delegacion_nomvia}" />
										<aon:inputText value="#{cliente.to.nomvia}" size="50"
											maxlength="20" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_num}" />
										<aon:inputText value="#{cliente.to.numero}" size="50"
											maxlength="20" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_otros}" />
										<aon:inputText value="#{cliente.to.otrdir}" size="50"
											maxlength="20" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_codpos}" />
										<aon:inputText value="#{cliente.to.codpos}" size="50"
											maxlength="5" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_localidad}" />
										<aon:inputText value="#{cliente.to.localidad}" size="50"
											maxlength="20" />

										<aon:outputLabel for="Provincia_cdg"
											value="#{appBundle.aon_payroll_principales_clientes_provincia}" />
										<aon:div styleClass="aon-lookup">
											<aon:lookupInputText id="Pro_cdg" lookup="#{provinciaLookup}"
												reRender="Pro_description"
												value="#{cliente.to.provincia.cdg}" size="5">
											</aon:lookupInputText>
											<aon:lookupButton id="Pro_lookup"
												windowTitle="#{appBundle.aon_payroll_principales_clientes_provincia}"
												selectReRender="Pro_cdg,Pro_description"
												lookup="#{provinciaLookup}" minHeight="440"
												property="#{cliente.to.provincia}">
											</aon:lookupButton>
											<aon:inputText id="Pro_description"
												value="#{(cliente.to.provincia.descripcion!=null)?(cliente.to.provincia.descripcion):('')}"
												size="34" disabled="true" />
										</aon:div>

										<aon:outputLabel value="   " />

									</aon:panelGrid>

								</aon:div>




								<aon:div id="datos4" styleClass="aon-scroll-area">
									<aon:panelGrid columns="4" dir="true" width="100%"
										style="margin-bottom=2px;">

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_perconta}" />
										<aon:inputText value="#{cliente.to.persona}" size="60"
											maxlength="20" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_email}" />
										<aon:inputText value="#{cliente.to.email}" size="60"
											maxlength="20" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_inirel}" />
										<aon:selectInputDate renderAsPopup="true"
											popupDateFormat="#{appBundle.aon_date_pattern}"
											value="#{cliente.to.fecini}" enableManualInput="true" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_finrel}" />
										<aon:selectInputDate renderAsPopup="true"
											popupDateFormat="#{appBundle.aon_date_pattern}"
											value="#{cliente.to.fecfin}" enableManualInput="true" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_telefono}" />
										<aon:inputText value="#{cliente.to.telefono}" size="60"
											maxlength="20" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_fax}" />
										<aon:inputText value="#{cliente.to.fax}" size="60"
											maxlength="20" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_telefono2}" />
										<aon:inputText value="#{cliente.to.telefono2}" size="60"
											maxlength="20" />

										<aon:outputLabel
											value="#{appBundle.aon_payroll_principales_clientes_telefono3}" />
										<aon:inputText value="#{cliente.to.telefono3}" size="60"
											maxlength="20" />




									</aon:panelGrid>
								</aon:div>
							</aon:div>



						</rich:tab>

						<rich:tab id="domi"
							label="#{appBundle.aon_payroll_principales_clientes_obser}">

							<aon:panelGrid columns="4" dir="true" width="100%"
								style="margin-bottom=2px;">
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_clientes_obser}" />
								<h:inputTextarea value="#{cliente.to.obscli}" cols="60" rows="6"
									size="200" maxlength="150" />



<aon:outputLabel
										value="#{appBundle.aon_payroll_principales_clientes_condi}" />
								<aon:panelGroup>
									<aon:div>
								
										<aon:div>
											<aon:selectBooleanCheckbox value="#{cliente.to. indcal}" />
											<aon:outputLabel
												value="#{appBundle.aon_payroll_principales_clientes_calenlabor}" />
										</aon:div>
										<aon:div>
											<aon:selectBooleanCheckbox value="#{cliente.to.indnom}" />
											<aon:outputLabel
												value="#{appBundle.aon_payroll_principales_clientes_nominaemp}" />
										</aon:div>
										<aon:div>
											<aon:selectBooleanCheckbox value="#{cliente.to.indcoste}" />
											<aon:outputLabel
												value="#{appBundle.aon_payroll_principales_clientes_estcostes}" />
										</aon:div>
										<aon:div>
											<aon:selectBooleanCheckbox value="#{cliente.to.soloases}" />
											<aon:outputLabel
												value="#{appBundle.aon_payroll_principales_clientes_soloase}" />
										</aon:div>

									</aon:div>
								</aon:panelGroup>
								<aon:outputLabel
										value="#{appBundle.aon_payroll_principales_clientes_envioss}" />
								<aon:panelGroup>
									
									<aon:selectOneRadio value="#{cliente.to.envioss}"
										layout="pageDirection">
										<f:selectItems value="#{cliente.listaEnvioss}" />
									</aon:selectOneRadio>
								</aon:panelGroup>
							</aon:panelGrid>
						</rich:tab>

				<!-- 	 <rich:tab id="domidfd"
							label="#{appBundle.aon_payroll_principales_clientes_dom}">


							<aon:div id="domDiv">

								<ui:include src="domicilios/grid.xhtml" />
							</aon:div>

						</rich:tab>
						
							<rich:tab id="ctas"
							label="#{appBundle.aon_payroll_principales_clientes_ctas}">
							<aon:div id="ctasDiv">

								<ui:include src="cuentas/grid.xhtml" />
							</aon:div>
						</rich:tab>
-->
						<rich:tab id="avisosdata"
							label="#{appBundle.aon_payroll_principales_avisos}">


							<aon:editDataTable id="avisoData" value="#{aviso.model}" var="to"
								rows="10"
								columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				, aon-editDataTable-buttonsColumn">

								<aon:rowSelector toggleOnClick="#{aviso.to == null}"
									actionListener="#{aviso.onSelect}" />

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:outputText value="&#160;" />
									<f:facet name="footer">
										<aon:div>
											<aon:commandButton alt="[#{bundle.aon_reset}]"
												styleClass="aon-editDataTable-button aon-icon-reset"
												actionListener="#{aviso.onReset}" value=""
												rendered="#{!aviso.new}"
												accesskey="#{bundle.aon_key_new_line}" />
										</aon:div>

									</f:facet>
								</aon:column>






								<aon:column>
									<f:facet name="header">
										<aon:outputText
											value="#{appBundle.aon_payroll_principales_aviso_cdg}" />
									</f:facet>
									<aon:outputText value="#{to.cdg}" rendered="#{to!=aviso.to}">

									</aon:outputText>
									<aon:inputText disabled="true" id="pcttra_edit"
										styleClass="aon-form-input-text" rendered="#{to==aviso.to}"
										value="#{aviso.to.cdg}" maxlength="8" size="10" />
									<f:facet name="footer">
										<aon:inputText disabled="true" id="pcttra_new"
											styleClass="aon-form-input-text" rendered="#{aviso.new}"
											value="#{aviso.to.cdg}" maxlength="8" size="10" />
									</f:facet>
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText
											value="#{appBundle.aon_payroll_principales_aviso_desc}" />
									</f:facet>
									<aon:outputText value="#{to.descripcion}"
										rendered="#{to!=aviso.to}">

									</aon:outputText>
									<aon:inputText styleClass="aon-form-input-text"
										rendered="#{to==aviso.to}" value="#{aviso.to.descripcion}"
										maxlength="30" size="30" />
									<f:facet name="footer">
										<aon:inputText styleClass="aon-form-input-text"
											rendered="#{aviso.new}" value="#{aviso.to.descripcion}"
											maxlength="30" size="10" />
									</f:facet>
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText
											value="#{appBundle.aon_payroll_principales_aviso_fecha}" />
									</f:facet>
									<aon:outputText value="#{to.fecha}" rendered="#{to!=aviso.to}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
									<aon:selectInputDate value="#{aviso.to.fecha}"
										rendered="#{to==aviso.to}" disabled="#{to==aviso.to}"
										renderAsPopup="true"
										popupDateFormat="#{bundle.aon_date_pattern}">
									</aon:selectInputDate>
									<f:facet name="footer">
										<aon:selectInputDate value="#{aviso.to.fecha}"
											rendered="#{aviso.new}" renderAsPopup="true"
											popupDateFormat="#{bundle.aon_date_pattern}">
										</aon:selectInputDate>
									</f:facet>
								</aon:column>



								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:div>
										<f:verbatim rendered="#{to!=aviso.to}">&#160;</f:verbatim>
										<aon:commandButton title="[#{bundle.aon_accept}]"
											rendered="#{to==aviso.to}"
											styleClass="aon-editDataTable-button aon-icon-accept"
											actionListener="#{aviso.onAccept}"
											accesskey="#{bundle.aon_key_save_line}" />
										<aon:commandButton title="[#{bundle.aon_cancel}]"
											styleClass="aon-editDataTable-button aon-icon-cancel"
											rendered="#{to==aviso.to}" actionListener="#{aviso.onCancel}"
											immediate="true" accesskey="#{bundle.aon_key_cancel_line}" />
										<aon:confirmButton id="remove-Porcentaje"
											title="[#{bundle.aon_remove}]"
											styleClass="aon-editDataTable-button aon-icon-delete"
											rendered="#{to==aviso.to}"
											confirmTitle="#{bundle.aon_confirm_title}"
											confirmMessage="#{bundle.aon_remove_confirm}"
											confirmActionListener="#{aviso.onRemove}" immediate="true"
											accesskey="#{bundle.aon_key_remove_line}" />
									</aon:div>
									<f:facet name="footer">
										<aon:div>
											<f:verbatim rendered="#{!aviso.new}">&#160;</f:verbatim>
											<aon:commandButton title="[#{bundle.aon_accept}]"
												styleClass="aon-editDataTable-button aon-icon-accept"
												rendered="#{aviso.new}" actionListener="#{aviso.onAccept}"
												accesskey="#{bundle.aon_key_save_line}" />
											<aon:confirmButton id="cancel-Porcentaje"
												title="[#{bundle.aon_cancel}]"
												styleClass="aon-editDataTable-button aon-icon-cancel"
												rendered="#{aviso.new}"
												confirmTitle="#{bundle.aon_confirm_title}"
												confirmMessage="#{bundle.aon_cancel_confirm}"
												confirmActionListener="#{aviso.onCancel}" immediate="true"
												accesskey="#{bundle.aon_key_cancel_line}" />
										</aon:div>
									</f:facet>
								</aon:column>

							</aon:editDataTable>
							<aon:dataScroller2 for="avisoData" showNote="true" />


						</rich:tab>

					</rich:tabPanel>

				</aon:div>
			</aon:div>
		</aon:form>

		<aon:lookupButtonPopup lookup="#{delegacionLookup}" />
		<aon:lookupButtonPopup lookup="#{empresarioLookup}" />
		<!--  <aon:lookupButtonPopup lookup="#{divisaLookup}" />-->
		<aon:lookupButtonPopup lookup="#{paisLookup}" />
		<aon:lookupButtonPopup lookup="#{documentoLookup}" />
		<aon:lookupButtonPopup lookup="#{tipoviaLookup}" />
		<aon:lookupButtonPopup lookup="#{provinciaLookup}" />

	</ui:define>
</ui:composition>

</body>
</html>
