<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="integralPresonasForm">

					<!-- 
					<ui:include	src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					-->
					<ui:include	src="/facelet/templates/formPrintToolbar.xhtml">
						<ui:param name="toolbarTitle" 
							value="#{menuBundle.principales_personas__integral_per}" />
						<ui:param name="controller"	value="#{persona}" />
						<aon:methodParam name="searchAction" value="integralTrab_search" />
				        <aon:methodParam name="saveAction" value="integralTrab_form" />
				        <aon:methodParam name="backAction" value="integralTrab_list" />
				        <ui:param name="skipResetButton" value="true" />
						<ui:param name="skipDeleteButton" value="true" />
						<ui:param name="skipSaveButton" value="true" />	
						<ui:param name="skipRemoveButton" value="true" />
							
						<ui:param name="reportKey" value="integralTrabajadoresDetail" />
					</ui:include>
					
					<!--	FIN HEADER & TOOLBAR	-->
					
					<aon:div id="datos1" styleClass="aon-scroll-area">
					<aon:panelGrid columns="6" dir="true" width="100%">
					
						<aon:outputLabel
							value="#{appBundle.aon_payroll_pricipales_personas_cdg}" />
						<aon:outputText value="#{persona.to.cdg}" />
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_clientes_numdoc}" />
						<aon:outputText value="#{persona.to.numdoc}" />
						
						<aon:outputLabel
							value="&#160;" />
						<aon:outputText value="&#160;" maxlength="4" />
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_pricipales_personas_apellido1}" />
						<aon:outputText value="#{persona.to.descripcion}" />
							
						<aon:outputLabel
							value="#{appBundle.aon_payroll_pricipales_personas_apellido2}" />
						<aon:outputText value="#{persona.to.apellido2}" />
													
						<aon:outputLabel
							value="#{appBundle.aon_payroll_pricipales_personas_nombre}" />
						<aon:outputText value="#{persona.to.nombre}" />
					</aon:panelGrid>
				</aon:div>



			<aon:div id="Trabajadors"
				styleClass="aon-scroll-area aon-scroll-area-clientes">
				<rich:tabPanel switchType="ajax" id="trabajadord">

					<rich:tab id="Trabajador" label="Trabajador">

						<aon:div styleClass="aon-scroll-area">
							<ui:include src="trabajador/grid.xhtml" />
							<!-- 
					<h:commandButton alt="[#{bundle.aon_reset}]" value="[Ir a mnto trabajador]"
						styleClass="aon-editDataTable-button aon-icon-rowSelector "
						reRender="integralPresonasData"
						action="trabajador_form" accesskey="#{bundle.aon_key_new_line}"/>
					-->

						</aon:div>
					</rich:tab>


				</rich:tabPanel>


			</aon:div>


			<aon:div id="integralPresonasData"
				styleClass="aon-scroll-area aon-scroll-area-clientes">

				<!-- <rich:tabPanel switchType="ajax" style="tabs" id="trabajadorTabs"> -->

				<rich:tabPanel switchType="ajax" id="trabajadorTabs"
					selectedTab="#{persona.tabName}"
					valueChangeListener="#{persona.changeTabValue}">

					<rich:tab id="tabTrabajo"
						label="#{appBundle.aon_payroll_principales_integralTra_tab1}">
						<aon:div id="trabajo">
							<ui:include src="trabajo/grid.xhtml" />
						</aon:div>
					</rich:tab>
					<rich:tab id="tabBoni"
						label="#{appBundle.aon_payroll_principales_integralTra_tab2}">
						<aon:div id="bonificaciones">
							<ui:include src="bonificaciones/grid.xhtml" />
						</aon:div>
					</rich:tab>
					<rich:tab id="tabPercep"
						label="#{appBundle.aon_payroll_principales_integralTra_tab3}">
						<aon:div id="percepciones">
							<ui:include src="percepciones/grid.xhtml" />
						</aon:div>
					</rich:tab>
					<rich:tab id="tabMinor"
						label="#{appBundle.aon_payroll_principales_integralTra_tab4}">
						<aon:div id="minoraciones">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_desc_trab}" />
							<ui:include src="minoraciones/descuentos/grid.xhtml" />
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_embargos_trab}" />
							<ui:include src="minoraciones/embargos/grid.xhtml" />
						</aon:div>
					</rich:tab>
					<rich:tab id="tabInci"
						label="#{appBundle.aon_payroll_principales_integralTra_tab5}">
						<aon:div id="incidencias">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_mnto_it}" />
							<ui:include src="incidencias/mntoit/grid.xhtml" />
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_otras_incid}" />
							<ui:include src="incidencias/otras/grid.xhtml" />
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_incid_it}" />
							<ui:include src="incidencias/incidenciasit/grid.xhtml" />
						</aon:div>
					</rich:tab>
					<!--  
					<rich:tab id="tabAvisos"
						label="#{appBundle.aon_payroll_principales_integralTra_tab6}">
						<aon:div id="avisos">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_avisos}" />
							<ui:include src="avisos/grid.xhtml" />
						</aon:div>
					</rich:tab>
					-->
					<rich:tab id="tabDivi"
						label="#{appBundle.aon_payroll_principales_integralTra_tab7}">
						<aon:div id="division">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_integralTra_percent_div_nom}" />
							<ui:include src="division/grid.xhtml" />
						</aon:div>
					</rich:tab>


				</rich:tabPanel>
			</aon:div>
		</aon:form>
				
				<aon:lookupButtonPopup lookup="#{empresaLookup}" />
				<aon:lookupButtonPopup lookup="#{provinciaLookup}" />
				<aon:lookupButtonPopup lookup="#{admonLookup}" />
				
			</ui:define>
		</ui:composition>

	</body>
</html>
