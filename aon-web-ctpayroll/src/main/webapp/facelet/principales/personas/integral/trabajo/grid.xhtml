<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div id="trabajoDataDiv">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{trabajo}" />
			<ui:param name="columnClasses" value="
			aon-editDataTable-dateColumn, aon-editDataTable-dateColumn,
			aon-editDataTable-numberColumn, aon-editDataTable-textColumn, 
			aon-editDataTable-numberColumn" />
			<!--  
			<ui:param name="showDataScroller" value="#{(!comunidad.new) and (comunidad.to != null)}" />			
			-->
			
			<ui:param name="skipSaveButton" value="#{true}" />
			<ui:param name="skipRemoveButton" value="#{true}" />
			<!-- <aon:methodParam name="resetAction" value="trabajo_form" /> -->
			<!-- <ui:param name="skipResetButton" value="#{trabajador.new or (trabajador.to == null)}" /> -->
			
			
			
			
			<ui:define name="columns">
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecha_alta}" />
					</f:facet>
					<aon:outputText value="#{to.id.fecini}" rendered="#{to!=trabajo.to}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:selectInputDate renderAsPopup="true" required="true"
						rendered="#{to==trabajo.to}"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{trabajo.to.id.fecini}" enableManualInput="true" />
					<f:facet name="footer">
						<aon:selectInputDate renderAsPopup="true" required="true"
							rendered="#{trabajo.new}"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{trabajo.to.id.fecini}" enableManualInput="true" />
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecha_baja}" />
					</f:facet>
					<aon:outputText value="#{to.fecfin}" rendered="#{to!=trabajo.to}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:selectInputDate renderAsPopup="true" required="true"
						rendered="#{to==trabajo.to}"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{trabajo.to.fecfin}" enableManualInput="true" />
					<f:facet name="footer">
						<aon:selectInputDate renderAsPopup="true" required="true"
							rendered="#{trabajo.new}"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{trabajo.to.fecfin}" enableManualInput="true" />
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_cod_trab}" />
					</f:facet>
					<aon:outputText value="#{to.descat}" rendered="#{to!=trabajo.to}" />
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{to==trabajo.to}" size="6"
						value="#{trabajo.to.descat}" maxlength="4" />
					<f:facet name="footer">
						<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{trabajo.new}" size="6"
							value="#{trabajo.to.descat}" maxlength="4" />
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_desc_act}" />
					</f:facet>
					<aon:outputText value="#{to.porcoti.cdg}" rendered="#{to!=trabajo.to}" />
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{to==trabajo.to}" size="40"
						value="#{trabajo.to.porcoti.cdg}" maxlength="60" />
					<f:facet name="footer">
						<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{trabajo.new}" size="40"
							value="#{trabajo.to.porcoti.cdg}" maxlength="60" />
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_cod_act}" />
					</f:facet>
					<aon:outputText value="#{to.indtp}" rendered="#{to!=trabajo.to}" />
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{to==trabajo.to}" size="5"
						value="#{trabajo.to.indtp}" maxlength="4" />
					<f:facet name="footer">
						<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{trabajo.new}" size="5"
							value="#{trabajo.to.indtp}" maxlength="4" />
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_cod_trab}" />
					</f:facet>
					<aon:outputText value="#{to.historico}" rendered="#{to!=trabajo.to}" />
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{to==trabajo.to}" size="6"
						value="#{trabajo.to.historico}" maxlength="4" />
					<f:facet name="footer">
						<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{trabajo.new}" size="6"
							value="#{trabajo.to.historico}" maxlength="4" />
					</f:facet>
				</aon:column>
				

				
			</ui:define>
		</ui:decorate>
					
	</aon:div>

</ui:composition>
