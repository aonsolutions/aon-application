<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">


	<aon:div id="tab2Data" styleClass="aon-scroll-area">

		<aon:panelGrid columns="4" dir="true" width="100%">

			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_fecini_contr}" />
			<aon:selectInputDate renderAsPopup="true" 
				popupDateFormat="#{appBundle.aon_date_pattern}"
				value="#{trabajo.to.fecinicont}" enableManualInput="true" />
	
			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_fecfin_contr}" />
			<aon:selectInputDate renderAsPopup="true" 
				popupDateFormat="#{appBundle.aon_date_pattern}"
				value="#{trabajo.to.fecfincont}" enableManualInput="true" />

			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_duracion_contr}" />
			<aon:inputText value="#{trabajo.to.diascont}" size="2" maxlength="2"/>

			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_autor}" />
			<aon:div styleClass="aon-lookup">
			
				<aon:lookupInputText id="tipaut_cdg" lookup="#{tipautLookup}"
					reRender="tipaut_descripcion" value="#{trabajo.to.tipaut.cdg}"
					size="5">
				</aon:lookupInputText>
				<aon:lookupButton id="tipaut_lookup"
					windowTitle="#{appBundle.aon_payroll_principales_trabajo_autor}"
					selectReRender="tipaut_cdg,tipaut_descripcion"
					lookup="#{tipautLookup}" minHeight="440"
					property="#{trabajo.to.tipaut}">
				</aon:lookupButton>
				<aon:inputText id="tipaut_descripcion"
					value="#{(trabajo.to.tipaut.descripcion!=null)?(trabajo.to.tipaut.descripcion):('')}"
					size="45" disabled="true" />
				
			</aon:div>

			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_fecha}" />
			<aon:selectInputDate renderAsPopup="true" 
				popupDateFormat="#{appBundle.aon_date_pattern}"
				value="#{trabajo.to.fecaut}" enableManualInput="true" />
 
			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_ent_banc}" />
			<aon:inputText value="#{trabajo.to.entidad.cdg}" />
			
			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_digit_control_cuenta}" />
			<aon:inputText value="#{trabajo.to.dc}" />

			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_suc_banc}" />
			<aon:inputText value="#{trabajo.to.sucursal.id.cdg}" />

			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_num_cuenta}" />
			<aon:inputText value="#{trabajo.to.numcta}" />

		

			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_num_aut_pluri}" />
			<aon:inputText value="#{trabajo.to.plunumaut}" />

			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_fec_aut_pluri}" />
			<aon:selectInputDate renderAsPopup="true" 
				popupDateFormat="#{appBundle.aon_date_pattern}"
				value="#{trabajo.to.plufecaut}" enableManualInput="true" />
			
			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_pluri_tope_min}" />
			<aon:inputText value="#{trabajo.to.pluprcmin}" />

			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_pluri_tope_max}" />
			<aon:inputText value="#{trabajo.to.pluprcmax}" />

<!-- 		
		
		

			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_coef_red_sala}" />
			<aon:inputText value="#{trabajo.to.coered}" />
		
			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_cant_coti_parcial}" />
			<aon:inputText value="#{trabajo.to.cantp}" />
		
			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_min_jornada_semana}" />
			<aon:inputText value="#{trabajo.to.semana}" />
		
			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_min_jornada_semana_parcial}" />
			<aon:inputText value="???" />
-->		
			<aon:outputLabel
				value="#{appBundle.aon_payroll_principales_trabajo_base_antig}" />
			<aon:inputText value="#{trabajo.to.baseant}" />
 
		</aon:panelGrid>
	</aon:div>


</ui:composition>
