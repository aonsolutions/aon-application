<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="percepForm">


			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_principales_personas_percep}" />
				<ui:param name="controller" value="#{percep}" />
				<ui:param name="reportKey" value="DelegacionList" />
			</ui:include>
			<aon:div id="clientes"
				styleClass="aon-scroll-area aon-scroll-area-principales">

				<aon:div id="percep" styleClass="aon-scroll-area">


					<aon:div styleClass="aon-scroll-area">
						<aon:panelGrid columns="4" dir="true" width="100%"
							style="margin-bottom=2px;">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_cdg}" />
							<aon:inputText value="#{percep.to.id.cdg}" required="true"
								size="10" maxlength="6" />


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep}" />
							<aon:inputText value="#{percep.to.id.numero}" required="true"
								size="10" maxlength="6" />


							<aon:outputLabel for="Trabajador_cdg"
								value="#{appBundle.aon_payroll_principales_personas_percep_trab}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText readonly="#{!percep.new}"
									required="#{true}" id="Trabajador_cdg"
									lookup="#{trabajadorLookup}"
									value="#{percep.to.trabajador.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Trabajador_lookup"
									windowTitle="#{appBundle.aon_payroll_principales_personas_percep_trab}"
									selectReRender="Trabajador_cdg" lookup="#{trabajadorLookup}"
									minHeight="440" property="#{percep.to.trabajador}">
								</aon:lookupButton>
							</aon:div>
						</aon:panelGrid>

					</aon:div>


		
						
		
					
						<aon:div styleClass="aon-scroll-area">
							<aon:panelGrid columns="4" dir="true" width="100%"
								style="margin-bottom=2px;">

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_percep_fecalt}" />
								<aon:selectInputDate renderAsPopup="true"
									popupDateFormat="#{appBundle.aon_date_pattern}"
									value="#{percep.to.trabajador.fecalt}" enableManualInput="true" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_percep_act}" />
								<aon:div>
									<aon:inputText size="10" maxlength="6"
										value="#{percep.to.trabajador.actividad.cdg}" />
									<aon:inputText
										value="#{percep.to.trabajador.actividad.descripcion}"
										size="60" maxlength="30" />
								</aon:div>

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_percep_trab}" />

								<aon:div>
									<aon:inputText value="#{percep.to.trabajador.persona.nombre}"
										size="20" maxlength="30" />

									<aon:inputText
										value="#{percep.to.trabajador.persona.descripcion}" size="20"
										maxlength="30" />

									<aon:inputText
										value="#{percep.to.trabajador.persona.apellido2}" size="20"
										maxlength="30" />
								</aon:div>

							</aon:panelGrid>


						</aon:div>
				
					<aon:div styleClass="aon-scroll-area">

						<aon:panelGrid columns="4" dir="true" width="100%"
							style="margin-bottom=2px;">


							<aon:outputLabel for="Percepcion_id_codcom"
								value="#{appBundle.aon_payroll_principales_personas_percep_cocom}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Percepcion_id_codcom"
									lookup="#{complementoLookup}" 
									reRender="Percepcion_complemento_description"
									value="#{percep.to.complemento.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Percepcion_id_codcom_lookup"
									windowTitle="#{appBundle.aon_payroll_auxiliares_convenios__aplic_comp}"
									selectReRender="Percepcion_complemento_description,Percepcion_id_codcom"
									lookup="#{complementoLookup}" minHeight="440"
									property="#{percep.to.complemento}">
								</aon:lookupButton>
								<aon:outputText id="Percepcion_complemento_description"
									value="#{(percep.to.complemento.description!=null)?(percep.to.complemento.description):('')}"
									size="34" disabled="true" />
							</aon:div>


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_mes}" />
							<aon:inputText value="#{percep.to.mes}" required="true" size="10"
								maxlength="6" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_import}" />
							<aon:inputText value="#{percep.to.importe}" required="true"
								size="10" maxlength="6" />


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_cal}" />
							<aon:inputText value="#{percep.to.calculo}" required="true"
								size="10" maxlength="6" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_tipo}" />
							<aon:inputText value="#{percep.to.tipcot}" required="true"
								size="10" maxlength="6" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_ilt}" />
							<aon:inputText value="#{percep.to.garilt}" required="true"
								size="10" maxlength="6" />


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_tip}" />
							
							<aon:selectOneMenu  id="tipcom"
								value="#{percep.to.tipcom}" >
								<f:selectItem value="#{null}" itemLabel="  " />
								<f:selectItems value="#{percep.listaComplementos}" />
							</aon:selectOneMenu>


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_uds}" />
							<aon:inputText value="#{percep.to.unidades}"
								size="10" maxlength="6" />


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_impuni}" />
							<aon:inputText value="#{percep.to.impuni}" 
								size="10" maxlength="6" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_desc}" />
							<aon:inputText value="#{percep.to.descom}" 
								size="50" maxlength="40" />



							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_descabre}" />
							<aon:inputText value="#{percep.to.desabr}" 
								size="50" maxlength="40" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_fechaini}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{percep.to.fecini}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_fechafin}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{percep.to.fecfin}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_fecharet}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{percep.to.fecret}" enableManualInput="true" />

							<aon:outputLabel for="Percepcion_id_codcom"
								value="#{appBundle.aon_payroll_principales_personas_percep_comp}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Percepcion_id_codcom1"
									lookup="#{complementoLookup}" 
									reRender="Percepcion_complemento1_description"
									value="#{percep.to.complemento1.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Percepcion_id_codcom1_lookup"
									windowTitle="#{appBundle.aon_payroll_principales_personas_percep_comp}"
									selectReRender="Percepcion_complemento1_description,Percepcion_id_codcom1"
									lookup="#{complementoLookup}" minHeight="440"
									property="#{percep.to.complemento1}">
								</aon:lookupButton>
								<aon:outputText id="Percepcion_complemento1_description"
									value="#{(percep.to.complemento1.description!=null)?(percep.to.complemento1.description):('')}"
									size="34" disabled="true" />
							</aon:div>
						</aon:panelGrid>
						
		

						<aon:panelGrid id="percep_right" columns="1" dir="true"
							width="100%" style="margin-bottom=2px;">
							<aon:panel>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_auxiliares_convenios__ind_comp}" />
								</f:facet>
								<aon:div styleClass="">
									<aon:selectOneRadio id="IndComplemento"
										value="#{percep.to.indcom}">
										<f:selectItems value="#{percep.listaIndiceComplemento}" />
									</aon:selectOneRadio>
								</aon:div>
							</aon:panel>


							<aon:panel>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_auxiliares_convenios__fijo_var}" />
								</f:facet>
								<aon:div styleClass="">
									<aon:selectOneRadio id="FijoVar" value="#{percep.to.fijovar}">
										<f:selectItems value="#{percep.listaFijoVariable}" />
									</aon:selectOneRadio>
								</aon:div>
							</aon:panel>

							<aon:panel>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_auxiliares_convenios__retrib}" />
								</f:facet>
								<aon:div styleClass="">
									<aon:selectOneRadio id="Retribucion"
										value="#{percep.to.dinesp}">
										<f:selectItems value="#{percep.listaRetribuciones}" />
									</aon:selectOneRadio>
								</aon:div>
							</aon:panel>
						</aon:panelGrid>


					</aon:div>

				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{trabajadorLookup}" />
		<aon:lookupButtonPopup lookup="#{complementoLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
