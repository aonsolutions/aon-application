<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="embargoForm">

					<ui:include	src="/facelet/templates/formPrintToolbar.xhtml">
						<ui:param name="toolbarTitle" value="#{menuBundle.principales_personas__embargo}" />
						<ui:param name="controller" value="#{embargo}" />
					</ui:include>

					<aon:div id="embargo" styleClass="aon-scroll-area aon-scroll-area-clientes">
					
						<aon:panel>
							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_pricipales_personas_embargos_persona}" />
							</f:facet>
							<aon:div>
							<aon:outputLabel
								value="#{appBundle.aon_payroll_cdg}: " />
							<aon:outputText	value="#{embargo.to.codper}" size="10" rendered="#{!embargo.new}" />
							<aon:inputText	value="#{embargo.to.codper}" size="10" rendered="#{embargo.new}" />
							
							<br />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_embargos_nombre}: " />	
							<aon:outputText	value="#{embargo.to.trabajador.persona.descripcion} " rendered="#{!embargo.new}" />
							<aon:outputText	value="#{embargo.to.trabajador.persona.apellido2}, " rendered="#{!embargo.new}" />
							<aon:outputText	value="#{embargo.to.trabajador.persona.nombre}" rendered="#{!embargo.new}" />
							</aon:div>
						</aon:panel>
						
						<aon:div id="datos"
								styleClass="aon-scroll-area">
								<aon:panelGrid columns="2" dir="true"
									width="100%" style="margin-bottom=2px;">

									<aon:outputLabel for="Trabajador_cdg"
										value="#{appBundle.aon_payroll_pricipales_personas_embargos_cdg}" />
									<aon:div styleClass="aon-lookup">
										<aon:lookupInputText readonly="#{!embargo.new}" required="#{true}"
											id="Trabajador_cdg" lookup="#{trabajadorLookup}"
											reRender="Trabajador_codnsz"
											value="#{embargo.to.trabajador.cdg}" size="5">
										</aon:lookupInputText>
										<aon:lookupButton rendered="#{embargo.new}"
											id="Trabajador_lookup"
											windowTitle="#{appBundle.aon_payroll_pricipales_personas_embargos_cdg}"
											selectReRender="Trabajador_cdg,Trabajador_codnsz"
											lookup="#{trabajadorLookup}" minHeight="440"
											property="#{embargo.to.trabajador}">
										</aon:lookupButton>
										<!--  
										<aon:inputText
											id="Trabajador_codnsz"
											value="#{(embargo.to.trabajador.codnsz!=null)?(embargo.to.trabajador.codnsz):('')}"
											size="55" disabled="true" />
										-->
									</aon:div>
									
									<aon:outputLabel
										value="#{appBundle.aon_payroll_pricipales_personas_embargos_comienzo}" />
									<aon:inputText id="Fecha" readonly="#{!embargo.new}" 
										required="#{true}" 
										value="#{embargo.to.id.fecha}" size="32" maxlength="10" >
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:inputText>

									<aon:outputLabel
										value="#{appBundle.aon_payroll_pricipales_personas_embargos_concepto}" />
									<aon:inputText id="Concepto" required="#{true}" readonly="#{!embargo.new}"
										value="#{embargo.to.concepto}" size="35" maxlength="30" />

									<aon:outputLabel 
										value="#{appBundle.aon_payroll_pricipales_personas_embargos_importe}" />
									<aon:inputText 
										value="#{embargo.to.importe}" size="15" maxlength="10" />

									<aon:outputLabel
										value="#{appBundle.aon_payroll_pricipales_personas_embargos_afecta}" />										
									<aon:selectOneRadio value="#{embargo.to.afecta}">
										<f:selectItems
											value="#{embargo.listaAfectados}" />
									</aon:selectOneRadio>
								
								</aon:panelGrid>
								
							</aon:div>
							
					</aon:div>
				</aon:form>

				<aon:lookupButtonPopup lookup="#{trabajadorLookup}" /> 
				
			</ui:define>
		</ui:composition>

	</body>
</html>
