<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>
		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">
			<ui:define name="content">
				<aon:form id="embargoForm">
					<ui:include
						src="/facelet/templates/formPrintToolbar.xhtml">
						<ui:param name="toolbarTitle" value="#{menuBundle.principales_personas__embargo}" />
						<ui:param name="controller" value="#{embargoBasic}" />
						<aon:methodParam name="backAction" value="embargoBasic_list" />
						<ui:param name="reportKey" value="embargoListDetail" />
						
					</ui:include>

					<aon:div id="embargoBasic" styleClass="aon-scroll-area aon-scroll-area-clientes">
					
						<aon:panel>
							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_pricipales_personas_embargos_persona}" />
							</f:facet>
							<aon:div>
							<aon:outputLabel value="#{appBundle.aon_payroll_cdg}: " />
							<aon:outputText	id="codper" value="#{embargoBasic.to.trabajador.persona.cdg}" size="10"  />
							
							<br />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_embargos_nombre}: " />	
							<aon:outputText	id="descripcion" value="#{embargoBasic.to.trabajador.persona.descripcion} "  />
							<aon:outputText id="apellido2" value="#{embargoBasic.to.trabajador.persona.apellido2}, "  />
							<aon:outputText	id="nombre" value="#{embargoBasic.to.trabajador.persona.nombre}"  />
							</aon:div>
						</aon:panel>
						
						<aon:div id="datos"
								styleClass="aon-scroll-area">
								<aon:panelGrid columns="2" dir="true"
									width="100%" style="margin-bottom=2px;">

									<aon:outputLabel for="Trabajador_cdg"
										value="#{appBundle.aon_payroll_pricipales_personas_embargos_cdg}" />
									<aon:div styleClass="aon-lookup">
										<aon:lookupInputText readonly="#{!embargoBasic.new}" required="#{true}"
											id="Trabajador_cdg" lookup="#{trabajadorLookup}"
											reRender="codper, descripcion, apellido2, nombre"
											value="#{embargoBasic.to.trabajador.cdg}" size="5">
										</aon:lookupInputText>
										<aon:lookupButton rendered="#{embargoBasic.new}"
											id="Trabajador_lookup"
											windowTitle="#{appBundle.aon_payroll_pricipales_personas_embargos_cdg}"
											selectReRender="Trabajador_cdg,Trabajador_codnsz, codper, descripcion, apellido2, nombre"
											lookup="#{trabajadorLookup}" minHeight="440"
											property="#{embargoBasic.to.trabajador}">
										</aon:lookupButton>
										
									</aon:div>
									
									<aon:outputLabel
										value="#{appBundle.aon_payroll_pricipales_personas_embargos_comienzo}" />
									<aon:selectInputDate value="#{embargoBasic.to.id.fecha}" id="FechaInicio"
										readonly="#{!embargoBasic.new}" required="true"
										renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
									</aon:selectInputDate>
									
									<aon:outputLabel
										value="#{appBundle.aon_payroll_pricipales_personas_embargos_concepto}" />
									<aon:inputText id="Concepto" required="#{true}" readonly="#{!embargoBasic.new}"
										value="#{embargoBasic.to.concepto}" size="35" maxlength="30" />

									<aon:outputLabel 
										value="#{appBundle.aon_payroll_pricipales_personas_embargos_importe}" />
									<aon:inputText 
										value="#{embargoBasic.to.importe}" size="15" maxlength="10" />

									<aon:outputLabel
										value="#{appBundle.aon_payroll_pricipales_personas_embargos_afecta}" />										
									<aon:selectOneRadio value="#{embargoBasic.to.afecta}" required="true">
										<f:selectItems
											value="#{embargoBasic.listaAfectados}" />
									</aon:selectOneRadio>
								
								</aon:panelGrid>
							</aon:div>
					</aon:div>
				</aon:form>
				<aon:lookupButtonPopup lookup="#{trabajadorLookup}" /> 
			</ui:define>
		</ui:composition>
	</body>
</html>
