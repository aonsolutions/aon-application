<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="nominaexForm">

					<!-- 
					<ui:include
						src="/facelet/templates/formPrintToolbar.xhtml">
					 -->
					<ui:include
						src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
						<ui:param name="toolbarTitle"
							value="#{menuBundle.resultados_recibos_salarios__nominaex}" />
						<ui:param name="controller" value="#{nominaex}" />
						<ui:param name="back-action" value="#{nominaex}" />
					</ui:include>

					<aon:div id="nominaex"
						styleClass="aon-scroll-area aon-scroll-area-clientes">
						<aon:panelGrid columns="6" dir="true"
							width="100%" style="margin-bottom=2px;">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_numero_paga}" />
							<aon:inputText id="numero"
								value="#{nominaex.to.id.numero}" size="5" maxlength="2"
								readonly="#{true}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_trabajador}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText
									readonly="#{!nominaex.new}" required="#{true}"
									id="Trabajador_cdg" lookup="#{trabajadorLookup}"
									reRender="Trabajador_codnsz"
									value="#{nominaex.to.emprper.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton
									rendered="#{nominaex.new}" id="Trabajador_lookup"
									windowTitle="#{appBundle.aon_payroll_resultados_salarios_nominaex_trabajador}"
									selectReRender="Trabajador_cdg,Trabajador_codnsz"
									lookup="#{trabajadorLookup}" minHeight="440"
									property="#{nominaex.to.emprper}" >
								</aon:lookupButton>
							</aon:div>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fecha_emision}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.to.fecemi}" enableManualInput="true" />
						</aon:panelGrid>

						<aon:panelGrid columns="4" dir="true"
							width="100%" style="margin-bottom=2px;">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_empresa}" />
							<aon:inputText value="#{nominaex.to.nomemp}"
								size="60" maxlength="60" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_nombre_trabajador}" />
							<aon:inputText value="#{nominaex.to.nomper}"
								size="60" maxlength="60" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_dir_empresa}" />
							<aon:inputText
								value="#{nominaex.to.direccion}" size="60" maxlength="60" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_categoria}" />
							<aon:inputText value="#{nominaex.to.descat}"
								size="30" maxlength="35" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_localidad}" />
							<aon:inputText
								value="#{nominaex.to.localidad}" size="60" maxlength="60" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_profesion}" />
							<aon:inputText
								value="#{nominaex.to.profesion}" size="60" maxlength="25" />
						</aon:panelGrid>

						<aon:panelGrid columns="6" dir="true"
							width="100%" style="margin-bottom=2px;">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_antiguedad}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.to.fecant}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_divisa}" />
							<aon:inputText
								value="#{nominaex.to.divisa.description}" size="5" readonly="#{true}"
								maxlength="25" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_matricula}" />
							<aon:inputText value="#{nominaex.to.nummat}"
								size="5" maxlength="2" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fecha_inicio_paga}" />
							<aon:selectInputDate renderAsPopup="true"
								required="#{true}" id="FechaInicioPaga"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.to.fecini}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_mes}" />
							<aon:inputText value="#{nominaex.to.mes}"
								size="5" maxlength="2" required="#{true}" id="Mes" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fecha_cobro}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.to.feccob}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fecha_fin_paga}" />
							<aon:selectInputDate renderAsPopup="true"
								id="FechaFinPaga"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								required="#{true}" value="#{nominaex.to.fecfin}"
								enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_anio}" />
							<aon:inputText value="#{nominaex.to.anio}"
								size="5" maxlength="2" required="#{true}" id="Anio" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fecha_cobro_real}" />
							<aon:selectInputDate renderAsPopup="true"
								required="#{true}" id="FechaCobreReal"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominaex.to.feccobreal}" enableManualInput="true" />
						</aon:panelGrid>

						<aon:panel>
							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_devengos}" />
							</f:facet>

							<aon:panelGrid columns="3" dir="true"
								width="100%" style="text-align=top;">
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_dev}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_concepto}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_importe}" />


								<aon:inputText
									value="#{nominaex.to.complemento.cdg}" size="2" maxlength="2" />
								<aon:inputText
									value="#{nominaex.to.descom}" size="40" maxlength="50" />
								<aon:inputText
									value="#{nominaex.to.importe}" size="15" maxlength="11" />

								<aon:outputLabel value=" " />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_total}" />
								<aon:inputText value="#{nominaex.total}"
									size="15" maxlength="11" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_fijoVar}" />
								<aon:selectOneRadio
									value="#{nominaex.to.fijovar}">
									<f:selectItems
										value="#{nominaex.listaFijovar}" />
								</aon:selectOneRadio>
							</aon:panelGrid>
						</aon:panel>

						<aon:panel>
							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_deducciones}" />
							</f:facet>
							<aon:panelGrid columns="4" dir="true"
								width="100%" style="text-align=top;">

								<aon:outputLabel value=" " />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_irpf}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_base_irpf}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_importe_irpf}" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_nominaex_retencion_cuenta}" />
								<aon:div>
									<aon:inputText
										value="#{nominaex.to.irpf}" size="6" maxlength="4" />
									<aon:outputLabel
										value="#{appBundle.aon_payroll_resultados_salarios_nominaex_s}" />
								</aon:div>
								<aon:inputText
									value="#{nominaex.baseIrpf}" size="6" maxlength="4" />
								<aon:inputText
									value="#{nominaex.to.impirpf}" size="15" maxlength="11" />
							</aon:panelGrid>

							<ui:include src="minoraciones/grid.xhtml" />
						</aon:panel>

						<aon:panelGrid columns="2" dir="true"
							style="margin-bottom=2px;">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_total_deducir}" />
							<aon:inputText
								value="#{nominaex.to.totalDeducir}" size="15" maxlength="11" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_nominaex_liquido_percibir}" />
							<aon:inputText
								value="#{nominaex.to.liquido}" size="15" maxlength="11" />
						</aon:panelGrid>
					</aon:div>
				</aon:form>

				<aon:lookupButtonPopup lookup="#{trabajadorLookup}" />
			</ui:define>
		</ui:composition>

	</body>
</html>
