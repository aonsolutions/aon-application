<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="calculoList">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.resultados_irpf__result_irpf}" />
				<ui:param name="controller" value="#{calculo}"/>
				<ui:param name="skipBackButton" value="false" />
				<aon:methodParam name="cancelAction" value="calculo_form"/>	
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="calculoData" value="#{calculo.model}" var="to" rows="20" 
					columnClasses="aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn, aon-editDataTable-textColumn">

					<aon:rowSelector action="calculo_form" actionListener="#{calculo.onSelect}" />
					
 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_irpf_calculo_trab}" />
						</f:facet>
						<aon:outputText value="#{to.id.cdg}"/>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_irpf_calculo_empsa}" />
						</f:facet>
						<aon:outputText value="#{to.empresa.descripcion}"/>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_irpf_calculo_anio}" />
						</f:facet>
						<aon:outputText value="#{to.id.anio}"/>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_irpf_calculo_mes}" />
						</f:facet>
						<aon:outputText value="#{to.id.mes}"/>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_irpf_calculo_dia}" />
						</f:facet>
						<aon:outputText value="#{to.id.dia}"/>
					</aon:column>
					
 				</aon:dataTable>

				<aon:dataScroller2 for="calculoData"  showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
