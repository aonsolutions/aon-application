<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="percepSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_resultados_minor}" />
				<ui:param name="controller" value="#{nomdto}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{nomdto.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="nomdto_list" />


					<aon:div id="clientes"
				styleClass="aon-scroll-area aon-scroll-area-search">

				<aon:div id="percep" styleClass="aon-scroll-area">

					<aon:panelGrid columns="4" dir="true" width="100%"
						style="margin-bottom=2px;">

						<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_minor_cdg}" />
						<aon:inputText id="Nomdto_id_cdg"
											valueChangeListener="#{nomdto.addExpression}" size="10" maxlength="6" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_minor_lin}" />
						<aon:inputText d="Nomdto_id_linea"
											valueChangeListener="#{nomdto.addExpression}" size="10"
							maxlength="6" />
							
							<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_minor_con}" />
						<aon:inputText d="Nomdto_concepto"
											valueChangeListener="#{nomdto.addExpression}" size="10" maxlength="6" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_minor_imp}" />
						<aon:inputText d="Nomdto_importe"
											valueChangeListener="#{nomdto.addExpression}" size="10"
							maxlength="6" />

					</aon:panelGrid>

				</aon:div>
			</aon:div>
				</ui:define>
			</ui:decorate>
		</aon:form>



	</ui:define>

</ui:composition>
