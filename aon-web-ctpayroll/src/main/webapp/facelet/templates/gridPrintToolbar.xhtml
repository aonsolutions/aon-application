<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >	
	    <ui:define name="additionalToolbarContent">
			<c:if test="#{(skipBackButton!=null) and (!skipBackButton)}">
				<aon:commandButton id="#{toolbarID}-back" 
					value="#{bundle.aon_back}" action="#{backAction}"
					styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
					accesskey="#{bundle.aon_key_cancel}" />
			</c:if>
			<c:if test="#{reportKey!=null}">
				<ui:include src="/facelet/templates/aon.ui.printbuttons.xhtml" />
			</c:if>
		</ui:define>				
	</ui:decorate>		
</ui:composition>
