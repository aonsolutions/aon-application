<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/facelet/templates/gridEx.xhtml" >
		<aon:valueParam name="dataTableId" default="#{controller.beanName}Data" />
		<aon:valueParam name="dataModel" default="#{controller.model}" />
		<aon:valueParam name="rows" default="#{controller.pageLimit}" />
		<aon:valueParam name="showDataTable" default="true" />
		<aon:valueParam name="showDataScroller" default="true" />
		<aon:valueParam name="showNote" default="false" />
		<aon:valueParam name="formNew" default="#{controller.new}" />
		<aon:valueParam name="formEdit" default="#{to==controller.to}" />		
		<aon:valueParam name="formList" default="#{to!=controller.to}" />
		
		<aon:methodParam name="saveActionListener" default="#{controller.onAccept}" type="actionListener" />
		<aon:methodParam name="saveAction" default="" />										

		<aon:methodParam name="saveActionListener" default="#{controller.onAccept}" type="actionListener" />
		<aon:methodParam name="saveAction" default="" />			
		<aon:methodParam name="cancelEditActionListener" default="#{controller.onCancel}" type="actionListener" />
		<aon:methodParam name="cancelEditAction" default="" />			
		<aon:methodParam name="removeActionListener" default="#{controller.onRemove}" type="actionListener" />
		<aon:methodParam name="removeAction" default="" />

		<aon:methodParam name="newSaveActionListener" default="#{controller.onAccept}" type="actionListener" />
		<aon:methodParam name="newSaveAction" default="" />			
		<aon:methodParam name="cancelNewActionListener" default="#{controller.onCancel}" type="actionListener" />
		<aon:methodParam name="cancelNewAction" default="" />
		
		<aon:methodParam name="editActionListener" default="" type="actionListener" />
		<aon:methodParam name="editAction" default="#{controller.beanName}_form" resolve="true" />					
		
		<aon:methodParam name="resetActionListener" default="#{controller.onReset}" type="actionListener" />
		<aon:methodParam name="resetAction" default="#{controller.beanName}_form" resolve="true" />

	</ui:include>
	
</ui:composition>
