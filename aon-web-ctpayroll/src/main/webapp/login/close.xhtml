<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html">
<f:view>
	<head>
		<script language="JavaScript">
			function Load() {
				document.getElementById('closeManager:accept').onclick();
				self.close();
			}
		</script>
	</head>
	<body id="aon-body" onload="Load()">
		<h:form id="closeManager">
			Session invalidated
			<h:commandLink id="accept" value="accept"
				actionListener="#{user.onLogout}" style="visibility: hidden"/>
		</h:form>
	</body>
</f:view>	
</html>
