<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{adminBundle.admin_backup}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_form}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="execute" 
						value="#{dbutilsBundle.dbutils_make_copy}"
						target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{dbDumper.onDump}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area" rendered="#{dbDumper.aonFile!=null}">
				<aon:div styleClass="aon-bold" style="margin-top: 10px;margin-bottom: 10px;">
					<aon:outputText value="El fichero de copia '#{dbDumper.aonFile.fileName}' se ha generado correctamente." />
				</aon:div>
				<aon:htmlCommandLink target="_blank"
					title="#{dbutilsBundle.download_file}"
					value="#{dbutilsBundle.download_file}"
					style="border-width: 0px 0px 0px 0px;"
					actionListener="#{dbDumper.onDownloadDisk}" 
					styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
			</aon:div>
			
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
