<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
		<ui:param name="searchController" value="#{supplierSearch}" />
	</aon:if>

	<ui:include src="/com/code/aon/ui/registry/facelet/registry/searchContent.xhtml" >
		<ui:param name="includeRegistryScope" value="#{true}"/>
	</ui:include>	
		
	<aon:if test="#{aonConfiguration.bean.supplier.showTariff}">
		<aon:outputLabel for="Supplier_tariff_id"
			value="#{bundle.report_tariff}" />
		<aon:selectOneMenu id="Supplier_tariff_id"
			value="#{configCollections.tariff}"
			valueChangeListener="#{controller.addIdEqualExpression}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{configCollections.purchaseTariffs}" />
		</aon:selectOneMenu>
	</aon:if>
	
	<aon:outputText value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox value="#{supplierSearch.supplierStatuses}">
		<f:selectItems value="#{supplierCollections.supplierStatuses}"/>
	</aon:selectManyCheckbox>							

</ui:composition>
