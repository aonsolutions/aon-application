<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:include src="/com/code/aon/ui/registry/facelet/registry/searchContent.xhtml">
		<ui:param name="controller" value="#{controller}" />
	</ui:include>
	
	<c:if test="#{supplier.showSegment}">	
		<aon:outputLabel for="Supplier_supplierSegment_id"
			value="#{bundle.aon_segment}" />
		<aon:selectOneMenu id="Supplier_supplierSegment_id"
			value="#{supplierCollections.supplierSegment}"
			valueChangeListener="#{controller.addIdEqualExpression}">
			<f:selectItem itemLabel="-" value="#{null}"/>		
			<f:selectItems value="#{supplierCollections.supplierSegments}" />
		</aon:selectOneMenu>
	</c:if>
		
	<aon:outputLabel for="Supplier_status"
		value="#{bundle.aon_status}" />
	<aon:selectOneMenu id="Supplier_status"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{supplierCollections.supplierStatuses}" />
	</aon:selectOneMenu>

</ui:composition>
