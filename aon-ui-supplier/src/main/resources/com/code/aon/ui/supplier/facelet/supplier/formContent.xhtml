<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/registry/facelet/registry/formContent.xhtml" >
		<ui:param name="includeRegistryScope" value="#{true}"/>
	</ui:include>

	<aon:outputLabel for="Supplier_status" value="#{bundle.aon_status}" />
	<aon:selectOneRadio id="Supplier_status" value="#{controller.to.status}">
		<f:selectItems value="#{supplierCollections.supplierStatuses}" />
	</aon:selectOneRadio>

	<aon:if test="#{aonConfiguration.bean.supplier.showTaxInfoData}">
		<aon:outputLabel for="Supplier_transaction" value="#{bundle.aon_transaction_type}" />
		<aon:selectOneMenu id="Supplier_transaction" value="#{controller.to.transaction}">
			<f:selectItems value="#{configCollections.invoiceTransactionTypes}" />
		</aon:selectOneMenu>

		<aon:outputText value="#{bundle.customer_taxes}" />
		<aon:div>
			<aon:selectBooleanCheckbox id="Supplier_vatAccrualPayment"
				value="#{controller.to.vatAccrualPayment}" />
			<aon:outputLabel for="Supplier_vatAccrualPayment" styleClass="aon-italic"
				value="#{bundle.aon_vat_accrual_payment}" />

			<aon:selectBooleanCheckbox id="Supplier_withholdingFarmer" styleClass="aon-margin-left"
				value="#{controller.to.withholdingFarmer}"
				valueChangeListener="#{controller.onWithholdingFarmerChanged}"
				reRender="Supplier_withholding" />
			<aon:outputLabel for="Supplier_withholdingFarmer" styleClass="aon-italic"
				value="#{bundle.registry_agrarian_special_regime_abbrv}" />

			<aon:selectBooleanCheckbox id="Supplier_withholding" styleClass="aon-margin-left" 
				value="#{controller.to.withholding}"
				valueChangeListener="#{controller.onWithholdingChanged}"
				reRender="Supplier_withholdingFarmer" />
			<aon:outputLabel for="Supplier_withholding" styleClass="aon-italic"
				value="#{bundle.aon_retention}" />
		</aon:div>
	</aon:if>

</ui:composition>
