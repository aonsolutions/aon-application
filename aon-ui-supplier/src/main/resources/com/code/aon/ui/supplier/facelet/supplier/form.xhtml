<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="supplierForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.aon_suppliers}" />
				<ui:param name="controller" value="#{supplier}" />
				<ui:param name="showMoreMenu" value="#{!supplier.nevv}" />
				<ui:define name="moreMenuContent">
					<ui:include src="/com/code/aon/ui/registry/facelet/registry/toolbarMoreMenu.xhtml">
						<ui:param name="controller" value="#{supplier}" />
						<ui:param name="showSegmentButton" value="#{aonConfiguration.bean.supplier.showSegment}" />
						<ui:param name="showAddInfoButton" value="#{aonConfiguration.bean.supplier.showAddInfo}" />
						<ui:param name="showProductButton" value="#{aonConfiguration.bean.supplier.showProduct}" />
						<ui:param name="showTaxButton" value="#{aonConfiguration.bean.supplier.showTax}" />
						
						<ui:param name="segmentController" value="#{supplierSegment}" /> 
						<ui:param name="addInfoController" value="#{supplierAddInfo}" /> 
						<ui:param name="rAttachController" value="#{supplierRAttach}" />
						<ui:param name="registryItemController" value="#{supplierItem}" />
						<ui:param name="registryTaxController" value="#{supplierTax}" />
					</ui:include>
					<ui:include src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{supplier.nevv}">
					<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/formNewContent.xhtml">
						<ui:param name="controller" value="#{supplier}"/>
					</ui:include>				
				</aon:if>							
				<aon:if test="#{!supplier.nevv}">
					<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto,
							aon-panelGrid-odd aon-width-120,
							aon-panelGrid-even aon-width-auto">
	
						<ui:include
							src="/com/code/aon/ui/supplier/facelet/supplier/formContent.xhtml">
							<ui:param name="controller" value="#{supplier}" />
						</ui:include>
					</aon:panelGrid>				

					<aon:panelGrid id="infoDataTable" styleClass="aon-margin-top"
						columns="2" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-auto">
						
						<aon:if test="#{aonConfiguration.bean.supplier.showTariff}">
							<aon:outputLabel for="Supplier_tariff_id"
								value="#{bundle.report_tariff}" />
							<aon:selectOneMenu id="Supplier_tariff_id"
								value="#{supplier.to.tariff}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{configCollections.purchaseTariffs}" />
							</aon:selectOneMenu>
						</aon:if>

						<aon:outputText value="#{bundle.aon_invoice_sales2}" />
						<aon:div>
							<aon:selectBooleanCheckbox id="Supplier_purchaseValuated"
								value="#{supplier.to.purchaseValuated}" />
							<aon:outputLabel for="Supplier_purchaseValuated" styleClass="aon-italic"
								value="#{bundle.supplier_printValuated}" />
						</aon:div>
				
						<aon:if test="#{!supplier.nevv and aonRole.accountingOperator and aonConfiguration.bean.supplier.showAccount}">				
							<aon:outputLabel for="Account_id" value="#{bundle.finance_account}" />
							<aon:panelGrid id="accountContainer" columns="2" columnClasses="none,none">
								<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
									<ui:param name="lookupTo" value="#{supplier.to.account}" />
									<ui:param name="lookupReRender" value="accountLookupButtons" />
								</ui:include>
								<aon:div id="accountLookupButtons">
									<aon:commandButton
										value="#{bundle.account_synchronize}"
										title="#{bundle.account_synchronize}"
										style="border: #808080 1px solid;"
										styleClass="aon-finding-toolbar-item aon-icon-refresh"
										rendered="#{supplier.accountSynchronizable}"
										actionListener="#{supplier.onAccountSynchronize}"
										reRender="accountContainer">
									</aon:commandButton>
									<aon:commandButton
										value="#{bundle.account_new_account}" 
										title="#{bundle.account_new_account}"
										style="border: #808080 1px solid;"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										rendered="#{supplier.to.account == null or supplier.to.account.id == null}"
										actionListener="#{supplier.onNewAccount}"
										reRender="accountContainer">
									</aon:commandButton>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGrid>

					<aon:panelTabSet id="supplierTab" selectedTab="#{supplier.selectedTab}">
						<aon:panelTab id="address" label="#{bundle.registry_address_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{supplierAddress}" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="media" label="#{bundle.aon_contacts}">
							<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{supplierMedia}" />
							</ui:include>
						</aon:panelTab>
 
 						<aon:if test="#{aonConfiguration.bean.supplier.showFinanceData}">
							<aon:panelTab id="finance"
								label="#{bundle.registry_finance_data_module}">
								<aon:panel>
									<f:facet name="header">
										<aon:outputText	value="#{bundle.registry_banks_module}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
										<ui:param name="controller" value="#{supplierRbank}" />
									</ui:include>
								</aon:panel>
								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{bundle.config_predef_paymethod}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
										<ui:param name="controller" value="#{supplierRPayMethod}" />
									</ui:include>
								</aon:panel>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.supplier.showSegment and supplierSegment.model.rowCount > 0}">
							<aon:panelTab id="segment"
								label="#{bundle.registry_segment_module}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/rsegment/tab_grid.xhtml">
									<ui:param name="controller" value="#{supplierSegment}" />
									<ui:param name="removeButtonReRender" value="supplierTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.supplier.showAddInfo and supplierAddInfo.model.rowCount > 0}">
							<aon:panelTab id="addInfo"
								label="#{bundle.aon_addInfo}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/raddinfo/tab_grid.xhtml">
									<ui:param name="controller" value="#{supplierAddInfo}" />
									<ui:param name="removeButtonReRender" value="supplierTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
						
						<aon:if test="#{aonRole.document and supplierRAttach.model.rowCount > 0}">
							<aon:panelTab id="documentManagement" label="#{bundle.aon_documents}">
								<ui:include src="/com/code/aon/ui/registry/facelet/documentManager/tab_grid.xhtml">
									<ui:param name="controller" value="#{supplierRAttach}" />
									<ui:param name="removeButtonReRender" value="supplierTab" />
								</ui:include>								
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.supplier.showProduct and supplierItem.model.rowCount > 0}">
							<aon:panelTab id="supplierItem" label="#{bundle.aon_role_product}">
								<ui:include src="/com/code/aon/ui/registry/facelet/ritem/tab_grid.xhtml" >
									<ui:param name="controller" value="#{supplierItem}" />
									<ui:param name="removeButtonReRender" value="supplierTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.supplier.showTax and supplierTax.model.rowCount > 0}">
							<aon:panelTab id="supplierTax" label="#{bundle.config_tax_module}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rtax/tab_grid.xhtml" >
									<ui:param name="controller" value="#{supplierTax}" />
									<ui:param name="removeButtonReRender" value="supplierTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
					</aon:panelTabSet>
				</aon:if>
			</aon:div>
		</aon:form>
		<aon:if test="#{aonRole.accountingOperator}">
			<aon:lookupButtonPopup lookup="#{accountLookup}" />
		</aon:if>
		<aon:if test="#{aonConfiguration.bean.supplier.showProduct}">
			<aon:lookupButtonPopup lookup="#{purchaseItemLookup}" />
		</aon:if>	
		<aon:if test="#{aonConfiguration.bean.rmedia.showSendEmail}">
			<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		</aon:if>
		<aon:if test="#{!supplier.nevv}">
			<aon:if test="#{aonConfiguration.bean.supplier.showSegment}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rsegment/newSegmentModal.xhtml">
					<ui:param name="controller" value="#{supplier}" />
					<ui:param name="segmentController" value="#{supplierSegment}" />
					<ui:param name="modalReRender" value="supplierTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.supplier.showAddInfo}">
				<ui:include src="/com/code/aon/ui/registry/facelet/raddinfo/newAddInfoModal.xhtml">
					<ui:param name="controller" value="#{supplier}" />
					<ui:param name="addInfoController" value="#{supplierAddInfo}" />
					<ui:param name="modalReRender" value="supplierTab" />
				</ui:include>
			</aon:if>
			<ui:include src="/com/code/aon/ui/registry/facelet/rattach/newAttachModal.xhtml">
				<ui:param name="controller" value="#{supplier}" />
				<ui:param name="attachmentController" value="#{supplierRAttach}" />
				<ui:param name="modalReRender" value="supplierTab" />
			</ui:include>
			<aon:if test="#{aonConfiguration.bean.supplier.showProduct}">
				<ui:include src="/com/code/aon/ui/registry/facelet/ritem/newItemModal.xhtml">
					<ui:param name="controller" value="#{supplier}" />
					<ui:param name="registryItemController" value="#{supplierItem}" />
					<ui:param name="modalReRender" value="supplierTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.supplier.showTax}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rtax/newTaxModal.xhtml">
					<ui:param name="controller" value="#{supplier}" />
					<ui:param name="registryTaxController" value="#{supplierTax}" />
					<ui:param name="modalReRender" value="supplierTab" />
				</ui:include>
			</aon:if>
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
				<ui:param name="auditableController" value="#{supplier}" />
			</ui:include>						
			<aon:if test="#{aonConfiguration.bean.customer.showFinanceData}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
					<ui:param name="bankAccountController" value="#{supplierRbank.accountHelper}" />
					<ui:param name="modalReRender" value="supplierTab" />
				</ui:include>
			</aon:if>						
		</aon:if>
		<aon:if test="#{supplier.nevv}">
			<aon:if test="#{aonConfiguration.bean.supplier.showFinanceData}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
					<ui:param name="bankAccountController" value="#{supplierForm.accountHelper}" />
					<ui:param name="modalReRender" value="Registry-PayMethodDiv" />
				</ui:include>
			</aon:if>
		</aon:if>
	</ui:define>
</ui:composition>
