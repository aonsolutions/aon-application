<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:div style="color:red; font-size: 1.2em; padding: 5px; text-align:center; border: solid red 1px; margin-bottom: 5px; font-weight: bold;">
			<aon:div>
				<aon:outputLabel value="MÓDULO OBSOLETO. Funcionalidad disponible en la opción 'Utilidades y chequeos contables'." />
			</aon:div>
		</aon:div>
		<aon:form id="accountCheckerForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.supplier_account_checker_module}" />
				<ui:param name="controller" value="#{supplierAccountChecker}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{supplierAccountChecker}" />
				<ui:define name="searchContent">
					<ui:param name="skipAfterSearch" value="#{true}" />
									
					<aon:outputLabel for="Supplier_registry_name"
						styleClass="aon-outputLabel aon-nowrap"
						value="#{bundle.aon_company_name}" />
					<aon:inputText id="Supplier_registry_name" size="40"
						valueChangeListener="#{supplierAccountChecker.addExpression}" />

					<aon:outputLabel for="Supplier_registry_alias"
						styleClass="aon-outputLabel aon-nowrap"
						value="#{bundle.aon_company_alias}" />
					<aon:inputText id="Supplier_registry_alias" size="40"
						valueChangeListener="#{supplierAccountChecker.addExpression}" />

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Supplier_showEmptyAccountsOnly"
							value="#{supplierAccountCheckerSearch.showEmptyAccountsOnly}" />
						<aon:outputLabel for="Supplier_showEmptyAccountsOnly" 
							value="#{bundle.supplier_account_checker_show_empty_accounts_only}" />
					</aon:div>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
