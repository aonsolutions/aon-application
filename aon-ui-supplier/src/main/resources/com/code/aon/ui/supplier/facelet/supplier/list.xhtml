<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form>
			<aon:if test="#{!app.standAlone}">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{bundle.aon_suppliers}" />
					<ui:param name="controller" value="#{supplier}" />
					<ui:define name="additionalToolbarContent">
						<aon:htmlCommandLink id="supplierReport-excel-report"
							value="&#160;" target="_new" rendered="#{!supplier.nevv}"
							action="#{report.onExecute}go" disabled="#{supplier.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-excel">
							<f:param name="reportKey" value="supplierReport" />
							<f:param name="outputFormat" value="MS Excel" />
						</aon:htmlCommandLink>
						<aon:htmlCommandLink id="supplierReport-report"
							value="#{bundle.aon_listing}" target="_new"
							rendered="#{!supplier.nevv}" action="#{report.onExecute}"
							disabled="#{supplier.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="supplierReport" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
						<aon:htmlCommandLink id="supplierDetailExcelReport-excel-report"
							value="#{bundle.aon_detailed_listing}" target="_new"
							rendered="#{!supplier.nevv}"
							actionListener="#{supplier.onDetailReport}"
							disabled="#{supplier.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-excel">
						</aon:htmlCommandLink>
					</ui:define>
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
						<ui:param name="controller" value="#{supplier}" />
						<ui:define name="columns">

							<ui:include
								src="/com/code/aon/ui/supplier/facelet/supplier/listBasic.xhtml" />

							<aon:column alias="Supplier.registry.alias"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_company_alias}" />
								</f:facet>
								<aon:outputText value="#{to.registry.alias}" />
							</aon:column>

							<aon:column alias="Supplier.status"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_status}" />
								</f:facet>
								<aon:outputText value="#{to.status}" />
							</aon:column>

						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:if>

			<aon:if test="#{app.standAlone}">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/appToolbar.xhtml">
					<ui:param name="controller" value="#{supplier}" />
					<ui:param name="filterController" value="#{supplier}" />
					<ui:param name="filterReRender" value="supplierListContainer" />
					<ui:param name="filterContainer" value="supplierFilterContainer" />
					<ui:param name="toolbarTitle" value="#{bundle.aon_suppliers}" />

				</ui:decorate>
				
				
						<aon:if test="#{aonConfiguration.bean.supplier.showProduct}">
							<aon:lookupButtonPopup lookup="#{purchaseItemLookup}" />
						</aon:if>
						
						
						
				<aon:div styleClass="aon-scroll-area"
					style="display: flex; flex-direction: row; ">

					<aon:div id="supplierListContainer"
						style="overflow: auto; height: calc(100vh - 175px); flex-grow : 4; scrollbar-width: none">
						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
							<ui:param name="controller" value="#{supplier}" />


							<ui:define name="columns">

								<ui:include
									src="/com/code/aon/ui/supplier/facelet/supplier/listBasic.xhtml" />

								<aon:column alias="Supplier.registry.alias"
									styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_company_alias}" />
									</f:facet>
									<aon:outputText value="#{to.registry.alias}" />
								</aon:column>

								<aon:column alias="Supplier.status"
									styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_status}" />
									</f:facet>
									<aon:outputText value="#{to.status}" />
								</aon:column>

							</ui:define>
						</ui:decorate>
					</aon:div>
                      
                      <aon:div id="supplierFilterContainer"
						style="overflow: auto; height: calc(100vh - 175px); flex-shrink : 20; display: none; scrollbar-width: none; border-left: 1px solid #ccc">
						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
							<ui:param name="controller" value="#{supplier}" />
							<ui:define name="searchContent">
								<ui:include
									src="/com/code/aon/ui/supplier/facelet/supplier/filterContent.xhtml">
									<ui:param name="searchController" value="#{supplierSearch}" />
								</ui:include>
							</ui:define>
						</ui:decorate>

					</aon:div>
                    
					

				</aon:div>
			</aon:if>

		</aon:form>
	</ui:define>
</ui:composition>
