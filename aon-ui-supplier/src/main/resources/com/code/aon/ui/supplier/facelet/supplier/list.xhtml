<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{supplierBundle.supplier_module}" />
				<ui:param name="controller" value="#{supplier}" />
			</ui:include>

			<aon:div id="supplierData" styleClass="aon-scroll-area">
				<aon:dataTable id="supplierDataList"
					value="#{supplier.model}" rows="20" var="to"
					rendered="#{supplier.model.rowCount > 0}">

					<aon:rowSelector action="supplier_form" 
						actionListener="#{supplier.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<h:outputText value="#{to.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_name}" />
						</f:facet>
						<aon:outputText value="#{to.registry.fullName}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_alias}" />
						</f:facet>
						<aon:outputText value="#{to.registry.alias}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}" />
					</aon:column>
				</aon:dataTable>
				<aon:dataScroller2 for="supplierDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
