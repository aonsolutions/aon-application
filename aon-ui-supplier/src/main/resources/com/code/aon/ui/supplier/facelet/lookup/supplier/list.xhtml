<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_id}" />
		</f:facet>
		<h:outputText value="#{to.id}" />
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_name}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{to.registry.fullName}"/>
		</aon:div>
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_company_alias}" />
		</f:facet>
		<aon:outputText value="#{to.registry.alias}" />
	</aon:column>

</ui:composition>
