<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-margin-bottom">
		<aon:panelGrid columns="2">
			<aon:outputLabel for="Absence_academicYear"
				value="#{academyBundle.academy_mark_evaluation}" />
			<aon:selectOneMenu id="Absence_academicYear"
				reRender="#{controller.beanName}Data"
				value="#{controller.evaluation}"
				valueChangeListener="#{controller.onEvaluationChange}">	
				<f:selectItems value="#{academyCollections.evaluations}" />
			</aon:selectOneMenu>			
		</aon:panelGrid>
	</aon:div>					

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="skipResetButton" value="#{true}" />
		<ui:define name="columns">
		
			<aon:column styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputText value="#{academyBundle.academy_alumn}" />
				</f:facet>
				<aon:outputText value="#{to.customer.registry.name}" />
			</aon:column>
			
			<rich:columns value="#{courseMark.alumnMarkHeaders}" var="column">
				<f:facet name="header">
					<aon:outputText title="#{column.description}" value="#{column.code}" />
				</f:facet>
				<aon:outputText value="#{to.values[column.position].mark}"
					rendered="#{formList}" />
				<aon:inputText size="3" rendered="#{formEdit}"
					value="#{courseMark.to.values[column.position].mark}" />
			</rich:columns>
			
			<aon:column styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputText value="#{academyBundle.academy_mark_average}" />
				</f:facet>
				<aon:outputText value="#{controller.averageMark}" />
			</aon:column>
			
		</ui:define>
	</ui:decorate>

</ui:composition>
