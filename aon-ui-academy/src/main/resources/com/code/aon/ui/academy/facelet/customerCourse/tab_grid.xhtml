<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="customerCourseDiv">
	
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarDescription" value="#{customerCourse.history ? bundle.aon_history : bundle.aon_list}" />
			<ui:param name="innerToolbar" value="true" />
			<ui:param name="toolbarID" value="#{controller.beanName}Toolbar" />
			<ui:define name="toolbarContent">
				<aon:commandButton id="customerCourse-save"
					rendered="#{!customerCourse.history}"
					value="#{bundle.aon_history}" reRender="customerCourseDiv"
					styleClass="aon-finding-toolbar-item aon-icon-accept" >
					<f:setPropertyActionListener
						target="#{customerCourse.history}" value="#{true}" />			
				</aon:commandButton>
				<aon:commandButton id="customerCourse-back"
					rendered="#{customerCourse.history}" immediate="true"
					value="#{bundle.aon_back}" reRender="customerCourseDiv"
					styleClass="aon-finding-toolbar-item aon-icon-cancel" >
					<f:setPropertyActionListener
						target="#{customerCourse.history}" value="#{false}" />
				</aon:commandButton>
			</ui:define>
		</ui:decorate>
				
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
			<ui:param name="skipResetButton" value="#{customerCourse.history}" />
			<ui:param name="skipLineEdition" value="#{customerCourse.history}" />
			<ui:define name="columns">
			
				<aon:column alias="CourseAlumn.course.code,CourseAlumn.course.description"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="Course_id"
							value="#{bundle.aon_group}" />
					</f:facet>				
					<aon:outputText value="#{to.course.code} #{to.course.description}" rendered="#{formList}" />
					<ui:include src="/com/code/aon/ui/academy/facelet/course/lookup.xhtml">
						<ui:param name="lookupTo" value="#{controller.to.course}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />									
						<ui:param name="lookupRendered" value="#{formEdit}" />
						<ui:param name="lookupControllerListener" value="#{controller.courseFilter}" />
					</ui:include>
					<f:facet name="footer">
						<ui:include src="/com/code/aon/ui/academy/facelet/course/lookup.xhtml">
							<ui:param name="lookupTo" value="#{controller.to.course}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />									
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupSuffix" value="-New" />
							<ui:param name="lookupControllerListener" value="#{controller.courseFilter}" />
						</ui:include>
					</f:facet>								
				</aon:column>
				
			</ui:define>
			
			<ui:define name="endFormListContent">
				<aon:goToButton controller="#{course}"
					onmouseover="disableRowSelector();" oncomplete="enableRowSelector();" onmouseout="enableRowSelector();"
					property="#{controller.selectedTO.course}" rendered="true" />
			</ui:define>
			
		</ui:decorate>
	</aon:div>
	
</ui:composition>
