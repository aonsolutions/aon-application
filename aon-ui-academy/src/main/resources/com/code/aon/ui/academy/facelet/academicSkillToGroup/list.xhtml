<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{academyBundle.academy_academic_skill_to_groups}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_listing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="accept"
						value="#{bundle.aon_accept}"
						rendered="#{!(empty academicSkillToGroup.checkList)}"
						action="course_list" actionListener="#{academicSkillToGroup.onAssign}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_accept}" >
					</aon:commandButton>				
					<aon:commandButton id="search"
						value="#{bundle.aon_search}"
						action="academicSkillToGroup_search" actionListener="#{academicSkillToGroup.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}" />
				</ui:define>
			</ui:decorate>			

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			

				<aon:panelGrid id="dataTable" columns="4"
					columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even,
						aon-panelGrid-odd aon-width-120,aon-panelGrid-even">

					<aon:outputLabel for="AcademicSkill_id"
						value="#{bundle.mark_subject}" />
					<aon:selectOneMenu id="AcademicSkill_id"
						value="#{academicSkillToGroup.academicSkill}">
						<f:selectItems value="#{academyCollections.academicSkills}" />
					</aon:selectOneMenu>					

					<h:outputLabel for="AcademicSkill_weight"
						value="#{bundle.warehouse_delivery_shipment_totalWeight}" />
					<aon:inputText id="AcademicSkill_weight"
						value="#{academicSkillToGroup.weight}" size="5" />
				</aon:panelGrid>
			
				<aon:div styleClass="aon-toolbar aon-margin-top"
					rendered="#{academicSkillToGroup.model.rowCount > 0}">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						ajaxSingle="true" reRender="courseDataDiv,aonToolbar"
						actionListener="#{academicSkillToGroup.checkAll}"/>	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						ajaxSingle="true" reRender="courseDataDiv,aonToolbar"
						actionListener="#{academicSkillToGroup.checkNone}" />				
				</aon:div>
					
				<aon:div id="courseDataDiv">					
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{academicSkillToGroup}" />
						<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
						<ui:param name="skipSelectButton" value="#{true}" />
						<ui:define name="columns">
						
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:selectBooleanCheckbox id="Included_Row_checked"
									value="#{academicSkillToGroup.rowChecked}"
									ajaxSingle="true" reRender="aonToolbar" />
							</aon:column>
	
							<ui:include
								src="/com/code/aon/ui/academy/facelet/course/listContent.xhtml" />

						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
