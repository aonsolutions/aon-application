<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="observationList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{academyBundle.academy_observation}" />
					<ui:param name="controller" value="#{observation}" />
				</ui:include>	

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
				
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{observation}" />
						<ui:define name="columns">
							<aon:column alias="Observation.id"
								styleClass="aon-editDataTable-numberColumn aon-width-80">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_id}" />
								</f:facet>
								<aon:outputText value="#{to.id}" />
								<f:facet name="footer">
									<aon:outputText value="&#160;" />
								</f:facet>
							</aon:column>

							<aon:column alias="Observation.description"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="Observation_description"
										value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}"
									rendered="#{formList}" />
								<aon:inputText id="Observation_description" required="true"
									rendered="#{formEdit}" size="100"
									value="#{controller.to.description}" maxlength="256" />
								<f:facet name="footer">
									<aon:inputText id="Observation_description-New" required="true"
										rendered="#{formNew}" size="100"
										value="#{controller.to.description}" maxlength="256" />
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
