<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="AlumnLoan_material"
		value="#{bundle.academy_loan_material}" />
	<aon:inputText id="AlumnLoan_material"
		value="#{controller.to.material}" required="true"
		size="16" maxlength="16" />
		
	<aon:outputLabel for="AlumnLoan_loanDate"
		value="#{bundle.aon_date}" />
	<aon:selectInputDate id="AlumnLoan_loanDate" 
		value="#{controller.to.loanDate}" required="true"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}"/>
	
	<aon:outputLabel for="AlumnLoan_endDate"
		value="#{bundle.aon_end_date}" />
	<aon:selectInputDate id="AlumnLoan_endDate" 
		value="#{controller.to.endDate}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}"/>

	<aon:outputLabel for="AlumnLoan_comments"
		value="#{bundle.aon_remark}" />
	<aon:inputText id="AlumnLoan_comments"
		value="#{controller.to.comments}"
		size="64" maxlength="64" />
	
</ui:composition>
