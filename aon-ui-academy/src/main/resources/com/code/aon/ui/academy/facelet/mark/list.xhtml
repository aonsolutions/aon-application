<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{academyBundle.academy_mark}" />
				<ui:param name="controller" value="#{mark}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="alumnLoan-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						rendered="#{alumnLoan.model.rowCount > 0}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="markList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="alumnLoan-report"
						value="#{bundle.aon_listing}"
						target="_blank" action="#{report.onExecute}"
						rendered="#{alumnLoan.model.rowCount > 0}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="markList" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
	
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{mark}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:define name="columns">
	
						<aon:column alias="Mark.subject.course.code"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_group}" />
							</f:facet>
							<aon:outputText value="#{to.subject.course.code} #{to.subject.course.description}" />
						</aon:column>
						
						<aon:column alias="Mark.alumn.customer.registry.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{academyBundle.academy_alumn}" />
							</f:facet>
							<aon:outputText value="#{to.alumn.customer.registry.name}" />
						</aon:column>
						
						<aon:column alias="Mark.subject.academicSkill.description"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{academyBundle.academy_academic_skill}" />
							</f:facet>
							<aon:outputText value="#{to.subject.academicSkill.description}" />
						</aon:column>

						<aon:column alias="Mark.evaluation"
							styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{academyBundle.academy_mark_evaluation}" />
							</f:facet>
							<aon:outputText value="#{to.evaluation}" />
						</aon:column>
						
						<aon:column alias="Mark.mark"
							styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{academyBundle.academy_mark_mark}" />
							</f:facet>
							<aon:outputText value="#{to.mark}" />
						</aon:column>
	
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
