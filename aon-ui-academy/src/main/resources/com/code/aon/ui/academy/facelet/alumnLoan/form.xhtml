<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="loanForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{academyBundle.academy_loans}" />
				<ui:param name="controller" value="#{alumnLoan}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{alumnLoan.to.customer}" />
						<ui:param name="lookupLabel" value="#{bundle.aon_alumn}"/>
						<ui:param name="idRequired" value="#{true}" />						
					</ui:include>
	
					<aon:outputLabel for="AlumnLoan_material"
						value="#{bundle.academy_loan_material}" />
					<aon:inputText id="AlumnLoan_material"
						value="#{alumnLoan.to.material}" required="true"
						size="16" maxlength="16" />
						
					<aon:outputLabel for="AlumnLoan_loanDate"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="AlumnLoan_loanDate" 
						value="#{alumnLoan.to.loanDate}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
					
					<aon:outputLabel for="AlumnLoan_endDate"
						value="#{bundle.aon_end_date}" />
					<aon:selectInputDate id="AlumnLoan_endDate" 
						value="#{alumnLoan.to.endDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
	
					<aon:outputLabel for="AlumnLoan_comments"
						value="#{bundle.aon_remark}" />
					<aon:inputText id="AlumnLoan_comments"
						value="#{alumnLoan.to.comments}"
						size="64" maxlength="64" />

				</aon:panelGrid>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>
</ui:composition>
