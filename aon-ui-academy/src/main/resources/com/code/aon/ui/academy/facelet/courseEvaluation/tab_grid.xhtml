<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="showDataScroller" value="false" />
		<ui:define name="columns">
		
			<aon:column alias="CourseEvaluation.qualitySkill.code"
				styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputLabel for="CourseEvaluation_qualitySkill_id"
						value="#{academyBundle.academy_course_evaluation_qualitySkill}" />
				</f:facet>
				<aon:outputText value="#{to.qualitySkill.code} #{to.qualitySkill.description}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="CourseEvaluation_qualitySkill_id"
					rendered="#{formEdit}" value="#{controller.to.qualitySkill}">
					<f:selectItems value="#{academyCollections.qualitySkills}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="CourseEvaluation_qualitySkill_id-New"
						rendered="#{formNew}" value="#{controller.to.qualitySkill}">
						<f:selectItems value="#{academyCollections.qualitySkills}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
		
			<aon:column alias="CourseEvaluation.evaluation"
				styleClass="aon-editDataTable-numberColumn aon-width-120">
				<f:facet name="header">
					<aon:outputLabel for="CourseEvaluation_evaluation"
						value="#{bundle.aon_value}" />
				</f:facet>
				<aon:outputText value="#{to.evaluation}" rendered="#{formList}" />
				<aon:inputText id="CourseEvaluation_evaluation"
					rendered="#{formEdit}" required="#{true}"
					size="10" value="#{courseEvaluation.to.evaluation}" />
				<f:facet name="footer">
					<aon:inputText id="CourseEvaluation_evaluation-New"
						rendered="#{formNew}" required="#{true}"
						size="10" value="#{courseEvaluation.to.evaluation}" />
				</f:facet>
			</aon:column>

			<aon:column alias="CourseEvaluation.quantity"
				styleClass="aon-editDataTable-numberColumn aon-width-120">
				<f:facet name="header">
					<aon:outputLabel for="CourseEvaluation_quantity"
						value="#{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}"  rendered="#{formList}" />
				<aon:inputText id="CourseEvaluation_quantity"
					rendered="#{formEdit}" required="#{true}"
					size="10" value="#{courseEvaluation.to.quantity}" />
				<f:facet name="footer">
					<aon:inputText id="CourseEvaluation_quantity-New"
						rendered="#{formNew}" required="#{true}"
						size="10" value="#{courseEvaluation.to.quantity}" />
				</f:facet>
			</aon:column>			
			
		</ui:define>
	</ui:decorate>

</ui:composition>
