<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-margin-bottom">
		<aon:panelGrid columns="2">
			<aon:outputLabel for="Absence_academicYear"
				value="#{academyBundle.academy_academic_year}" />
			<aon:selectOneMenu id="Absence_academicYear"
				reRender="#{controller.beanName}Data"
				value="#{customerAbsence.academicYear}"
				valueChangeListener="#{controller.onAcademicYearChange}">
				<f:selectItem itemLabel="-" value="#{null}" />		
				<f:selectItems value="#{academyCollections.academicYears}" />
			</aon:selectOneMenu>			
		</aon:panelGrid>
	</aon:div>					

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:define name="columns">
		
			<aon:column alias="Absence.courseAlumn.course.description"
				styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputLabel for="Absence_courseAlumn" value="#{academyBundle.academy_absence}" />
				</f:facet>
				<aon:outputText value="#{to.courseAlumn.course.description}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="Absence_courseAlumn" 
					rendered="#{formEdit}" value="#{controller.to.courseAlumn}">
					<f:selectItems value="#{controller.courseAlumns}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="Absence_courseAlumn-New" 
						rendered="#{formNew}" value="#{controller.to.courseAlumn}">
						<f:selectItems value="#{controller.courseAlumns}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column alias="Absence.evaluation"
				styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputLabel for="Absence_evaluation" value="#{academyBundle.academy_mark_evaluation}" />
				</f:facet>
				<aon:outputText value="#{to.evaluation}" rendered="#{formList}" />
				<rich:inputNumberSpinner id="Absence_evaluation"
					rendered="#{formEdit}" value="#{controller.to.evaluation}"
					enableManualInput="false" minValue="1" maxValue="12" inputSize="2" />
				<f:facet name="footer">
					<rich:inputNumberSpinner id="Absence_evaluation-New"
						rendered="#{formNew}" value="#{controller.to.evaluation}"
						enableManualInput="false" minValue="1" maxValue="12" inputSize="2" />
				</f:facet>
			</aon:column>			
			
			<aon:column alias="Absence.absenceDate"
				styleClass="aon-editDataTable-textColumn aon-width-120">
				<f:facet name="header">
					<aon:outputLabel for="Absence_absenceDate" value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.absenceDate}" rendered="#{formList}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
				<aon:selectInputDate id="Absence_absenceDate" 
					value="#{controller.to.absenceDate}" required="true"
					timeZone="#{timeZoneController.timeZone}" rendered="#{formEdit}"
					popupDateFormat="#{bundle.aon_date_pattern}" />
				<f:facet name="footer">
					<aon:selectInputDate id="Absence_absenceDate-New" 
						value="#{controller.to.absenceDate}" required="true"
						timeZone="#{timeZoneController.timeZone}" rendered="#{formNew}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
				</f:facet>
			</aon:column>
			
			<aon:column alias="Absence.comments"
				styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputLabel for="Absence_comments" value="#{bundle.aon_comment}" />
				</f:facet>
				<aon:outputText value="#{to.comments}" rendered="#{formList}" />
				<aon:inputText id="Absence_comments"
					rendered="#{formEdit}" size="40"
					value="#{controller.to.comments}" />
				<f:facet name="footer">
					<aon:inputText id="Absence_comments-New"
						rendered="#{formNew}" size="40"
						value="#{controller.to.comments}" />
				</f:facet>
			</aon:column>
			
		</ui:define>
	</ui:decorate>

</ui:composition>
