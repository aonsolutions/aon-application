<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:valueParam name="controller" default="#{lookup}" />

	<aon:outputLabel for="Course_code" value="#{bundle.aon_id}" />
	<aon:inputText id="Course_code"
		valueChangeListener="#{controller.addExpression}"
		size="16" maxlength="15" />

	<aon:outputLabel for="Course_academicYear_id"
		value="#{academyBundle.academy_academic_year}" />
	<aon:selectOneMenu id="Course_academicYear_id"
		value="#{academyCollections.academicYear}"
		valueChangeListener="#{controller.addIdEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{academyCollections.academicYears}" />
	</aon:selectOneMenu>					

	<c:if test="#{!hideDates}" >
		<aon:outputLabel value="#{bundle.aon_start_date}" />
		<aon:div>
			<aon:outputLabel for="Course_startDate-From"
				styleClass="aon-form-date-label aon-padding-right" 
				value="#{bundle.aon_date_from}:" />
			<aon:selectInputDate id="Course_startDate-From"
				valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
	
			<aon:outputLabel for="Course_startDate-To"
				styleClass="aon-form-date-label aon-padding-right" 
				value="#{bundle.aon_date_to}:" />
			<aon:selectInputDate id="Course_startDate-To"
				valueChangeListener="#{controller.addLessThanOrEqualExpression}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
		</aon:div>		

		<aon:outputLabel value="#{bundle.aon_end_date}" />
		<aon:div>
			<aon:outputLabel for="Course_endDate-From"
				styleClass="aon-form-date-label aon-padding-right" 
				value="#{bundle.aon_date_from}:" />
			<aon:selectInputDate id="Course_endDate-From"
				valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
	
			<aon:outputLabel for="Course_endDate-To"
				styleClass="aon-form-date-label aon-padding-right" 
				value="#{bundle.aon_date_to}:" />
			<aon:selectInputDate id="Course_endDate-To"
				valueChangeListener="#{controller.addLessThanOrEqualExpression}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
		</aon:div>		
	</c:if>
	
	<aon:outputLabel for="Course_courseSubject_id"
		value="#{academyBundle.academy_subject}" />
	<aon:selectOneMenu id="Course_courseSubject_id"
		value="#{academyCollections.courseSubject}"
		valueChangeListener="#{controller.addIdEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{academyCollections.courseSubjects}" />
	</aon:selectOneMenu>					

	<aon:outputLabel for="Course_courseLevel_id"
		value="#{academyBundle.academy_level}" />
	<aon:selectOneMenu id="Course_courseLevel_id"
		value="#{academyCollections.courseLevel}"
		valueChangeListener="#{controller.addIdEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{academyCollections.courseLevels}" />
	</aon:selectOneMenu>					
	
	<aon:outputLabel for="Course_workPlace_id"
		value="#{companyBundle.company_workplace}" />
	<aon:selectOneMenu id="Course_workPlace_id"
		value="#{companyCollections.workPlace}"
		valueChangeListener="#{controller.addIdEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
	</aon:selectOneMenu>					

	<c:if test="#{!hideStatus}" >
		<aon:outputLabel for="Course_status"
			value="#{bundle.aon_status}" />
		<aon:selectOneMenu id="Course_status"
			converter="aon.EnumConverter"
			valueChangeListener="#{controller.addExpression}" >
			<f:selectItem value="#{null}" itemLabel="-"/>
			<f:selectItems value="#{academyCollections.courseStatuses}" />
		</aon:selectOneMenu>
	</c:if>	
						
</ui:composition>
