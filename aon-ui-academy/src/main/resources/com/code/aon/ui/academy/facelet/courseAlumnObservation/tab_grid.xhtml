<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:param name="innerToolbar" value="true" />
		<ui:param name="toolbarID" value="#{controller.beanName}Toolbar" />
		<ui:define name="toolbarContent">
			<aon:selectOneMenu value="#{markPrinter.printOption}"
				styleClass="aon-form-selectOneMenu-field">
				<f:selectItems value="#{markPrinter.printOptions}" />
			</aon:selectOneMenu>
			
			<aon:htmlCommandLink id="alumnMarkList-report"
				value="#{bundle.aon_report}"
				target="_blank" action="#{report.onExecute}"
				styleClass="aon-finding-toolbar-item aon-icon-pdf"
				accesskey="#{bundle.aon_key_print}">
				<f:param name="reportKey" value="alumnMarkList" />
			</aon:htmlCommandLink>
		</ui:define>
	</ui:decorate>

	<aon:div styleClass="aon-margin-bottom">
		<aon:panelGrid columns="2">
			<aon:outputLabel for="CourseAlumnObsrvation_evaluation"
				value="#{academyBundle.academy_mark_evaluation}" />
			<aon:selectOneMenu id="CourseAlumnObsrvation_evaluation"
				reRender="evaluationObservationGrid"
				value="#{controller.evaluation}"
				valueChangeListener="#{controller.onEvaluationChanged}">	
				<f:selectItems value="#{academyCollections.evaluations}" />
			</aon:selectOneMenu>			
		</aon:panelGrid>
	</aon:div>					

	<h:panelGrid id="evaluationObservationGrid"
		styleClass="aon-width-all" columns="#{(controller.to != null)?2:1}"
		columnClasses="aon-vertical-align-top #{(controller.to != null)?'aon-width-400,aon-vertical-align-top':''}" >
		<aon:div>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
				<ui:define name="columns">
				
					<aon:column alias="CourseAlumn.customer.registry.name"
						styleClass="aon-editDataTable-textColumn" >
						<f:facet name="header">
							<aon:outputText value="#{academyBundle.academy_alumn}" />
						</f:facet>
						<aon:outputText value="#{to.customer.registry.name}"
							styleClass="#{(controller.to == to)?'aon-bold aon-italic':''}" />
					</aon:column>
					
				</ui:define>
			</ui:decorate>
		</aon:div>		
		<aon:div rendered="#{controller.to != null}">
				
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
				<ui:param name="controller" value="#{evaluationObservation}" />
				<ui:param name="showDataScroller" value="#{false}" />
				<ui:define name="columns">
					
					<aon:column alias="EvaluationObservation.comments"
						styleClass="aon-editDataTable-textColumn" >
						<f:facet name="header">
							<aon:outputLabel for="EvaluationObservation_comments"
								value="#{bundle.aon_remark}" />
						</f:facet>
						<aon:outputText value="#{to.comments}" rendered="#{formList}" >
							<aon:abbreviateConverter maxWidth="120" />
						</aon:outputText>
						<ui:include src="/com/code/aon/ui/academy/facelet/observation/lookup.xhtml">
							<ui:param name="lookupTo" value="#{controller.observation}" />
							<ui:param name="skipLabel" value="#{true}" />		
							<ui:param name="skipSuggestText" value="#{true}" />							
							<ui:param name="lookupRendered" value="#{formEdit}" />
							<ui:param name="lookupReRender" value="EvaluationObservation_comments" />
							<aon:methodParam name="lookupChangeListener"
								value="#{controller.onObservationChanged}" type="lookupChangeListener" />							
						</ui:include>
						<aon:inputTextarea id="EvaluationObservation_comments"
							rendered="#{formEdit}" cols="60" rows="4"
							value="#{controller.to.comments}" required="true" />
						<f:facet name="footer">
							<aon:div styleClass="aon-vertical-align-top" rendered="#{formNew}">
								<ui:include src="/com/code/aon/ui/academy/facelet/observation/lookup.xhtml">
									<ui:param name="lookupTo" value="#{controller.observation}" />
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="skipSuggestText" value="#{true}" />									
									<ui:param name="lookupSuffix" value="-New" />
									<ui:param name="lookupReRender" value="EvaluationObservation_comments-New" />
									<aon:methodParam name="lookupChangeListener"
										value="#{controller.onObservationChanged}" type="lookupChangeListener" />							
								</ui:include>
								<aon:inputTextarea id="EvaluationObservation_comments-New"
									rendered="#{formNew}" cols="60" rows="4"
									value="#{controller.to.comments}" required="true" />
							</aon:div>
						</f:facet>								
					</aon:column>
						
				</ui:define>
			</ui:decorate>
		</aon:div>		
	</h:panelGrid>

</ui:composition>
