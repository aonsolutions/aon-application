<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="qualificationList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{bundle.academy_qualification}" />
					<ui:param name="controller" value="#{qualification}" />
				</ui:include>	

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
				
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{qualification}" />
						<ui:define name="columns">
							<aon:column alias="Qualification.code"
								styleClass="aon-editDataTable-textColumn aon-width-150">
								<f:facet name="header">
									<aon:outputLabel for="Qualification_code"
										value="#{bundle.aon_id}" />
								</f:facet>
								<aon:outputText value="#{to.code}"
									rendered="#{formList}" />
								<aon:inputText id="Qualification_code" required="true"
									rendered="#{formEdit}" size="10"
									value="#{controller.to.code}" maxlength="5" />
								<f:facet name="footer">
									<aon:inputText id="Qualification_code-New" required="true"
										rendered="#{formNew}" size="10"
										value="#{controller.to.code}" maxlength="5" />
								</f:facet>
							</aon:column>

							<aon:column alias="Qualification.description"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="Qualification_description"
										value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}"
									rendered="#{formList}" />
								<aon:inputText id="Qualification_description"
									rendered="#{formEdit}" size="64"
									value="#{controller.to.description}" maxlength="64" />
								<f:facet name="footer">
									<aon:inputText id="Qualification_description-New"
										rendered="#{formNew}" size="64"
										value="#{controller.to.description}" maxlength="64" />
								</f:facet>
							</aon:column>

							<aon:column alias="Qualification.minValue"
								styleClass="aon-editDataTable-numberColumn aon-width-120">
								<f:facet name="header">
									<aon:outputLabel for="Qualification_minValue"
										value="#{bundle.aon_minimum}" />
								</f:facet>
								<aon:outputText value="#{to.minValue}"
									rendered="#{formList}" />
								<aon:inputText id="Qualification_minValue" required="true"
									rendered="#{formEdit}" size="10"
									value="#{controller.to.minValue}" >
									<f:validateDoubleRange minimum="0" maximum="100"/>
								</aon:inputText>
								<f:facet name="footer">
									<aon:inputText id="Qualification_minValue-New" required="true"
										rendered="#{formNew}" size="10"
										value="#{controller.to.minValue}" >
										<f:validateDoubleRange minimum="0" maximum="100"/>
									</aon:inputText>								
								</f:facet>
							</aon:column>

							<aon:column alias="Qualification.maxValue"
								styleClass="aon-editDataTable-numberColumn aon-width-120">
								<f:facet name="header">
									<aon:outputLabel for="Qualification_maxValue"
										value="#{bundle.aon_maximum}" />
								</f:facet>
								<aon:outputText value="#{to.maxValue}"
									rendered="#{formList}" />
								<aon:inputText id="Qualification_maxValue" required="true"
									rendered="#{formEdit}" size="10"
									value="#{controller.to.maxValue}" >
									<f:validateDoubleRange minimum="0" maximum="100"/>
								</aon:inputText>
								<f:facet name="footer">
									<aon:inputText id="Qualification_maxValue-New" required="true"
										rendered="#{formNew}" size="10"
										value="#{controller.to.maxValue}" >
										<f:validateDoubleRange minimum="0" maximum="100"/>
									</aon:inputText>								
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
