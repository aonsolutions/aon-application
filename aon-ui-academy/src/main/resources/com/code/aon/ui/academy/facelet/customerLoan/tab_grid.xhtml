<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="customerLoanDiv">
	
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarDescription" value="#{customerLoan.history ? bundle.aon_history : bundle.aon_list}" />
			<ui:param name="innerToolbar" value="true" />
			<ui:define name="toolbarContent">
				<aon:commandButton id="customerLoan-save"
					rendered="#{!customerLoan.history}"
					value="#{bundle.aon_history}" reRender="customerLoanDiv"
					styleClass="aon-finding-toolbar-item aon-icon-accept" >
					<f:setPropertyActionListener
						target="#{customerLoan.history}" value="#{true}" />			
				</aon:commandButton>
				<aon:commandButton id="customerLoan-back"
					rendered="#{customerLoan.history}" immediate="true"
					value="#{bundle.aon_back}" reRender="customerLoanDiv"
					styleClass="aon-finding-toolbar-item aon-icon-cancel" >
					<f:setPropertyActionListener
						target="#{customerLoan.history}" value="#{false}" />
				</aon:commandButton>
			</ui:define>
		</ui:decorate>
				
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
			<ui:param name="skipResetButton" value="#{customerLoan.history}" />
			<ui:param name="skipLineEdition" value="#{customerLoan.history}" />
			<ui:define name="columns">
			
				<aon:column alias="AlumnLoan.material"
					styleClass="aon-editDataTable-textColumn aon-width-150">
					<f:facet name="header">
						<aon:outputLabel for="AlumnLoan_material"
							value="#{academyBundle.academy_loan_material}" />
					</f:facet>				
					<aon:outputText value="#{to.material}" rendered="#{formList}" />
					<aon:inputText id="AlumnLoan_material" required="true"
						size="16" maxlength="16" rendered="#{formEdit}"
						value="#{controller.to.material}"/>
					<f:facet name="footer">
						<aon:inputText id="AlumnLoan_material-New" required="true"
							size="16" maxlength="16" rendered="#{formNew}"
							value="#{controller.to.material}"/>
					</f:facet>								
				</aon:column>
				
				<aon:column alias="AlumnLoan.loanDate"
					styleClass="aon-editDataTable-textColumn aon-width-130">
					<f:facet name="header">
						<aon:outputLabel for="AlumnLoan_loanDate" value="#{bundle.aon_date}" />
					</f:facet>
					<aon:outputText value="#{to.loanDate}" rendered="#{formList}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:selectInputDate id="AlumnLoan_loanDate" 
						value="#{controller.to.loanDate}" required="true"
						timeZone="#{timeZoneController.timeZone}" rendered="#{formEdit}"
						popupDateFormat="#{bundle.aon_date_pattern}" />							
					<f:facet name="footer">
						<aon:selectInputDate id="AlumnLoan_loanDate-New" 
							value="#{controller.to.loanDate}" required="true"
							timeZone="#{timeZoneController.timeZone}" rendered="#{formNew}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</f:facet>
				</aon:column>
				
				<aon:column alias="AlumnLoan.endDate"
					styleClass="aon-editDataTable-textColumn aon-width-130">
					<f:facet name="header">
						<aon:outputLabel for="AlumnLoan_endDate" value="#{bundle.aon_end_date}" />
					</f:facet>
					<aon:outputText value="#{to.endDate}" rendered="#{formList}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>			
					<aon:selectInputDate id="AlumnLoan_endDate" 
						value="#{controller.to.endDate}"
						timeZone="#{timeZoneController.timeZone}" rendered="#{formEdit}"
						popupDateFormat="#{bundle.aon_date_pattern}" />							
					<f:facet name="footer">
						<aon:selectInputDate id="AlumnLoan_endDate-New" 
							value="#{controller.to.endDate}"
							timeZone="#{timeZoneController.timeZone}" rendered="#{formNew}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</f:facet>
				</aon:column>
				
				<aon:column alias="AlumnLoan.comments"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="AlumnLoan_comments" value="#{bundle.aon_remark}" />
					</f:facet>
					<aon:outputText value="#{to.comments}" rendered="#{formList}" />
					<aon:inputText id="AlumnLoan_comments"
						size="64" maxlength="64" rendered="#{formEdit}"
						value="#{controller.to.comments}"/>
					<f:facet name="footer">
						<aon:inputText id="AlumnLoan_comments-New"
							size="64" maxlength="64" rendered="#{formNew}"
							value="#{controller.to.comments}"/>
					</f:facet>				
				</aon:column>
				
			</ui:define>
		</ui:decorate>
	</aon:div>
	
</ui:composition>
