<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-toolbar">
		<aon:htmlCommandLink id="courseEvaluationList-excel-report"
			value="&#160;" target="_blank" action="#{report.onExecute}"
			styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
			<f:param name="reportKey" value="courseEvaluationList" />
			<f:param name="outputFormat" value="MS Excel" />
		</aon:htmlCommandLink>
		<aon:htmlCommandLink id="courseEvaluationList-report"
			value="#{bundle.aon_listing}"
			target="_blank" action="#{report.onExecute}"
			styleClass="aon-finding-toolbar-item aon-icon-pdf"
			accesskey="#{bundle.aon_key_print}">
			<f:param name="reportKey" value="courseEvaluationList" />
		</aon:htmlCommandLink>
	</aon:div>

	<aon:panel>
		<f:facet name="header">
			<aon:outputText value="#{academyBundle.academy_course_evaluations}" />
		</f:facet>
		<ui:include src="/com/code/aon/ui/academy/facelet/courseEvaluation/tab_grid.xhtml">
			<ui:param name="controller" value="#{courseEvaluation}" />
		</ui:include>
	</aon:panel>
	<aon:panel>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_remark}" />
		</f:facet>
		<ui:include src="/com/code/aon/ui/academy/facelet/courseObservation/tab_grid.xhtml">
			<ui:param name="controller" value="#{courseObservation}" />
		</ui:include>
	</aon:panel>

</ui:composition>
