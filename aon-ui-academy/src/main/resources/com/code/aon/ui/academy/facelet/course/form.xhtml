<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="courseForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{academyBundle.academy_courses}" />
				<ui:param name="controller" value="#{course}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="6"
					columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even,
						aon-panelGrid-odd aon-width-120,aon-panelGrid-even,
						aon-panelGrid-odd aon-width-120,aon-panelGrid-even">

					<aon:outputLabel for="Course_code"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Course_code"
						value="#{course.to.code}" size="8" maxlength="5">
						<f:validateLength minimum="1" maximum="5" />
					</aon:inputText>

					<aon:outputLabel for="Course_workPlace"
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Course_workPlace"
						required="true" value="#{course.to.workPlace}" >
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Course_status"
						value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="Course_status"
						value="#{course.to.status}">
						<f:selectItems value="#{academyCollections.courseStatuses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Course_academicYear"
						value="#{academyBundle.academy_academic_year}" />
					<aon:selectOneMenu id="Course_academicYear"
						required="true" value="#{course.to.academicYear}">
						<f:selectItems value="#{academyCollections.academicYears}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Course_courseSubject"
						value="#{academyBundle.academy_subject}" />
					<aon:selectOneMenu id="Course_courseSubject"
						required="true" value="#{course.to.courseSubject}">
						<f:selectItems value="#{academyCollections.courseSubjects}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Course_courseLevel"
						value="#{academyBundle.academy_level}" />
					<aon:selectOneMenu id="Course_courseLevel"
						required="true" value="#{course.to.courseLevel}">
						<f:selectItems value="#{academyCollections.courseLevels}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Course_startDate"
						value="#{bundle.aon_start_date}" />
					<aon:selectInputDate id="Course_startDate" 
						value="#{course.to.startDate}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
							
					<aon:outputLabel for="Course_endDate"
						value="#{bundle.aon_end_date}" />
					<aon:selectInputDate id="Course_endDate" 
						value="#{course.to.endDate}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Course_alumnLimit"
						value="#{academyBundle.academy_limit}" />
					<aon:inputText id="Course_alumnLimit"
						required="true" value="#{course.to.alumnLimit}"
						size="5" maxlength="3"/>

				</aon:panelGrid>
				
				<aon:div styleClass="aon-margin-top">
					<aon:panelGrid columns="2">
						<aon:outputLabel for="Course_description"
							value="#{bundle.aon_description}" />
						<aon:inputText id="Course_description"
							value="#{course.to.description}"
							size="98" maxlength="64"/>
					</aon:panelGrid>					
				</aon:div>

				<aon:panelTabSet rendered="#{!course.new}" selectedTab="#{course.selectedTab}">
					<aon:panelTab id="schedule" label="#{academyBundle.academy_schedule_schedule}">
						<ui:include	src="/com/code/aon/ui/academy/facelet/courseSchedule/tab_grid.xhtml">
							<ui:param name="controller" value="#{courseSchedule}" />
						</ui:include>
					</aon:panelTab>
				</aon:panelTabSet>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
