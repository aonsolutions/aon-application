<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{academyBundle.academy_loans}" />
				<ui:param name="controller" value="#{alumnLoan}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
	
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{alumnLoan}" />
					<ui:define name="columns">
	
						<aon:column alias="AlumnLoan.code"
							styleClass="aon-editDataTable-textColumn aon-width-70">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>

						<aon:column alias="AlumnLoan.material"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{academyBundle.academy_loan_material}" />
							</f:facet>
							
							<aon:outputText value="#{to.material}" />
						</aon:column>
						
						<aon:column alias="AlumnLoan.loanDate"
							styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.loanDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>			
						</aon:column>
						
						<aon:column alias="AlumnLoan.endDate"
							styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_end_date}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>			
						</aon:column>
						
						<aon:column alias="AlumnLoan.customer.registry.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{academyBundle.academy_alumn}" />
							</f:facet>
							<aon:outputText value="#{to.customer.registry.name}" />
						</aon:column>
						
						<aon:column alias="AlumnLoan.comments"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_comments}" />
							</f:facet>
							<aon:outputText value="#{to.comments}" />
						</aon:column>
	
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
