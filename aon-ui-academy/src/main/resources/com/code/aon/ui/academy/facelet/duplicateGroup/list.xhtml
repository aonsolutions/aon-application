<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.academy_duplicate_groups}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_listing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="accept"
						value="#{bundle.aon_accept}"
						rendered="#{!(empty duplicateGroup.checkList)}"
						action="course_list" actionListener="#{duplicateGroup.onDuplicate}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_accept}" >
					</aon:commandButton>				
					<aon:commandButton id="search"
						value="#{bundle.aon_search}"
						action="duplicateGroup_search" actionListener="#{duplicateGroup.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}" />
				</ui:define>
			</ui:decorate>			

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">

					<aon:outputLabel for="AcademicYear_id"
						value="#{bundle.aon_reset} #{bundle.course_academic_year}" />
					<aon:selectOneMenu id="AcademicYear_id"
						value="#{duplicateGroup.academicYear}">
						<f:selectItems value="#{academyCollections.academicYears}" />
					</aon:selectOneMenu>	

					<aon:outputLabel for="Date_Increment"
						value="#{bundle.academy_course_dates_increment}" />
					<aon:selectOneMenu id="Date_Increment"
						value="#{duplicateGroup.dateIncrement}">
						<f:selectItem itemLabel="1 #{bundle.aon_month}" itemValue="1" />
						<f:selectItem itemLabel="2 #{bundle.aon_months}" itemValue="2" />
						<f:selectItem itemLabel="3 #{bundle.aon_months}" itemValue="3" />
						<f:selectItem itemLabel="4 #{bundle.aon_months}" itemValue="4" />
						<f:selectItem itemLabel="6 #{bundle.aon_months}" itemValue="6" />
						<f:selectItem itemLabel="1 #{bundle.aon_year}" itemValue="12" />
						<f:selectItem itemLabel="2 #{bundle.aon_years}" itemValue="24" />
					</aon:selectOneMenu>	

					<aon:outputLabel value="#{bundle.academy_course_transfer_data}" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Alumns"
							value="#{duplicateGroup.alumns}" />
						<aon:outputLabel for="Alumns"
							value="#{bundle.aon_alumns}"/>
						<f:verbatim>&#160;</f:verbatim>
						<f:verbatim>&#160;</f:verbatim>
						<aon:selectBooleanCheckbox id="Instructors"
							value="#{duplicateGroup.instructors}" />
						<aon:outputLabel for="Instructors"
							value="#{bundle.academy_teachers}"/>
						<f:verbatim>&#160;</f:verbatim>
						<f:verbatim>&#160;</f:verbatim>
						<aon:selectBooleanCheckbox id="Schedules"
							value="#{duplicateGroup.schedules}" />
						<aon:outputLabel for="Schedules"
							value="#{bundle.academy_schedule_schedules}"/>
						<f:verbatim>&#160;</f:verbatim>
						<f:verbatim>&#160;</f:verbatim>
						<aon:selectBooleanCheckbox id="Skills"
							value="#{duplicateGroup.skills}" />
						<aon:outputLabel for="Skills"
							value="#{bundle.academicSkill_academicSkills}" />
					</aon:div>

				</aon:panelGrid>
								
				<aon:div styleClass="aon-toolbar aon-margin-top"
					rendered="#{duplicateGroup.model.rowCount > 0}">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						ajaxSingle="true" reRender="courseDataDiv,aonToolbar"
						actionListener="#{duplicateGroup.checkAll}"/>	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						ajaxSingle="true" reRender="courseDataDiv,aonToolbar"
						actionListener="#{duplicateGroup.checkNone}" />				
				</aon:div>
					
				<aon:div id="courseDataDiv">					
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{duplicateGroup}" />
						<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
						<ui:param name="skipSelectButton" value="#{true}" />
						<ui:define name="columns">
						
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:selectBooleanCheckbox id="Included_Row_checked"
									value="#{duplicateGroup.rowChecked}"
									ajaxSingle="true" reRender="aonToolbar" />
							</aon:column>
	
							<ui:include
								src="/com/code/aon/ui/academy/facelet/course/listContent.xhtml" />

						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
