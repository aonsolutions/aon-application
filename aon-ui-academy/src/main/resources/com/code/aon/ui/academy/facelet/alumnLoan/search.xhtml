<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="loanForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{academyBundle.academy_loans}" />
				<ui:param name="controller" value="#{alumnLoan}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{alumnLoan}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="AlumnLoan_material"
						value="#{academyBundle.academy_loan_material}" />
					<aon:inputText id="AlumnLoan_material" size="25"
						onblur="toUpperCase(this);"  valueChangeListener="#{controller.addExpression}" />
	
					<aon:outputLabel for="AlumnLoan_comments"
						value="#{bundle.aon_remark}" />
					<aon:inputText id="AlumnLoan_comments" size="50"
						valueChangeListener="#{controller.addExpression}" />
	
					<aon:outputLabel value="#{bundle.aon_date}" />				
					<aon:div>
						<aon:outputLabel for="AlumnLoan_loanDate-From"
							styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="AlumnLoan_loanDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
				
						<aon:outputLabel for="AlumnLoan_loanDate-To"
							styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="AlumnLoan_loanDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>		
					
					<aon:outputLabel value="#{bundle.aon_end_date}" />				
					<aon:div id="AlumnLoan_endDateDiv">
						<aon:outputLabel for="AlumnLoan_endDate-From"
							styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="AlumnLoan_endDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
				
						<aon:outputLabel for="AlumnLoan_endDate-To"
							styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="AlumnLoan_endDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
	
						<aon:outputLabel for="AlumnLoan_notReturned"
							value="#{academyBundle.academy_loan_not_returned}" />
						<aon:selectBooleanCheckbox id="AlumnLoan_notReturned"
							value="#{alumnLoanSearch.notReturned}"/>
					</aon:div>					
									
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
