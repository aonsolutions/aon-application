<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="contactForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true" 				
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
								
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{groupwareBundle.aon_contact}" />
					</aon:div>						
		
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{bundle.aon_search}" />
					</aon:div>				
		
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="search" value="#{bundle.aon_accept}"
							action="contact_list" actionListener="#{contact.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							action="contact_list" actionListener="#{contact.onCancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="true" accesskey="#{bundle.aon_key_cancel}" />	
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="contact_form" actionListener="#{contact.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<!-- end toolbar navigation -->

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">		
			
					<aon:panelGrid columns="2" >

						<aon:outputLabel for="Contact_name"
							value="#{groupwareBundle.contact_name}" />
						<aon:inputText id="Contact_name" size="80"
							maxlength="64" valueChangeListener="#{contact.addExpression}" />

						<aon:outputLabel for="Contact_surname"
							value="#{groupwareBundle.contact_surname}" />
						<aon:inputText id="Contact_surname" size="80"
							maxlength="64" valueChangeListener="#{contact.addExpression}" />

						<aon:outputLabel for="Contact_organization"
							value="#{groupwareBundle.contact_organization}" />
						<aon:inputText id="Contact_organization" size="80"
							maxlength="64" valueChangeListener="#{contact.addExpression}" />

						<aon:outputLabel for="Contact_phone"
							value="#{groupwareBundle.contact_phone}" />
						<aon:inputText id="Contact_phone" size="15"
							maxlength="64" valueChangeListener="#{contact.addExpression}" />

						<aon:outputLabel for="Contact_cellularPhone"
							value="#{groupwareBundle.contact_cellular_phone}" />
						<aon:inputText id="Contact_cellularPhone" size="15"
							maxlength="64" valueChangeListener="#{contact.addExpression}" />

						<aon:outputLabel for="Contact_fax"
							value="#{groupwareBundle.contact_fax}" />
						<aon:inputText id="Contact_fax" size="15"
							maxlength="64" valueChangeListener="#{contact.addExpression}" />

						<aon:outputLabel for="Contact_email"
							value="#{groupwareBundle.contact_email}" />
						<aon:inputText id="Contact_email" size="40"
							maxlength="64" valueChangeListener="#{contact.addExpression}" />

						<aon:outputLabel for="Contact_address"
							value="#{groupwareBundle.contact_address}" />
						<aon:inputText id="Contact_address" size="80"
							maxlength="128" valueChangeListener="#{contact.addExpression}" />

						<aon:outputLabel for="Contact_postalCode"
							value="#{groupwareBundle.contact_postal_code}" />
						<aon:inputText id="Contact_postalCode" size="80"
							maxlength="128" valueChangeListener="#{contact.addExpression}" />

					</aon:panelGrid>

				</aon:div>
			</aon:div>


		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
