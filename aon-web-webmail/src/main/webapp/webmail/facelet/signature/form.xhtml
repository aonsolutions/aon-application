<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="signature">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_webmail_signature}"/>
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{signature.new?(bundle.aon_reset):(bundle.aon_editing)}" /> 						
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							action="signature_form"
							actionListener="#{signature.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<h:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{signature.to!=null or signature.new}"
							action="signature_form"
							actionListener="#{signature.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!signature.new}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{signature.onRemove}"
							confirmAction="signature_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<h:commandButton id="exit" value="#{bundle.aon_close}"
							action="signature_list" 
							actionListener="#{signature.onSearch}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}"/>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true"  width="100%">
	
							<aon:outputLabel for="Signature_name"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.aon_webmail_signature_name}" />
							<aon:inputText id="Signature_name"
								styleClass="aon-form-input-text aon-form-input-text-number"
								size="60" maxlength="45"
								value="#{signature.to.name}" />

							<aon:outputLabel for="Signature_signature"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.aon_webmail_signature_signature}" />
							<aon:div width="80%">
								<aon:inputRichText id="Signature_signature" 
									value="#{signature.to.signature}" />
							</aon:div>

							<aon:outputLabel for="Signature_active" 
								value="#{appBundle.aon_webmail_signature_active}" />
							<aon:selectOneRadio id="Signature_active" 
								value="#{signature.to.active}">
								<f:selectItems value="#{signature.activeTypes}" />
							</aon:selectOneRadio>
							
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
