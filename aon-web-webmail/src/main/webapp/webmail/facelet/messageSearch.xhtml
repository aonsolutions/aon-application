<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="webmailForm" styleClass="aon-form">
		
			<!--  barra de menu y titulo -->
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_webmail_main}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="Buscar" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<!-- 
						<aon:commandButton
							id="search"
							title="#{bundle.aon_search}"
							reRender="webmailForm"
							actionListener="#{search.searchMessagesCurrentFolder}"
							value="#{bundle.aon_search}"
							styleClass="aon-finding-toolbar-item aon-icon-accept">
						</aon:commandButton>
						-->								
						<aon:commandButton
							title="#{bundle.aon_back}"
							action="folder"
							actionListener="#{search.onExit}"
							value="#{bundle.aon_back}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel">
						</aon:commandButton>
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			
			<!-- fin de barra de menu y titulo -->
			
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
			
					<ui:define name="searchContent">	
						<ui:param name="searchReRender" value="webmailSearchResult" />			
						<aon:methodParam name="searchActionListener" value="#{search.searchMessagesCurrentFolder}" type="actionListener" />
						<aon:methodParam name="searchAction" />
				
						<aon:outputText value="" />
				        <aon:div styleClass="aon-italic" style="padding-bottom:0.5em;">
				        	<aon:outputText value="Buscar mensajes dentro de la carpeta " />
				        	<aon:outputText value="#{folder.folder.name}" styleClass="aon-bold"/>
				        	<aon:outputText value=" con los siguientes criterios: " />
				        </aon:div>
			           
						<aon:outputLabel for="SearchMail_from" 
							value="#{appBundle.aon_webmail_from}: " />
						<aon:inputText id="SearchMail_from"
							size="80"
							value="#{search.address_from}"/>
		
						<aon:outputLabel for="SearchMail_to" 
							value="#{appBundle.aon_webmail_to}: " />
						<aon:inputText id="SearchMail_to"
							size="80"
							value="#{search.address_cc}"/>
		
						<aon:outputLabel for="SearchMail_subject" 
							value="#{appBundle.aon_webmail_subject}: " />
						<aon:inputText id="SearchMail_subject"
							size="80"
							value="#{search.subject}"/>
		
						<aon:outputLabel for="SearchMail_bodyText" 
							value="#{appBundle.aon_webmail_content}: " />
						<aon:inputText id="SearchMail_bodyText"
							size="80"
							value="#{search.bodyText}"/>						
		        	
					</ui:define>
				</ui:decorate>
			<aon:div styleClass="aon-scroll-area" id="webmailForm">	
				<aon:div id="webmailSearchResult" layout="none">
					<aon:div rendered="#{search.resultSelected}">
						<aon:div rendered="#{!search.resultFound}" styleClass="aon-box aon-box-outstanding2">
							<aon:div styleClass="aon-icon aon-icon-info" style="padding-top:2px;padding-bottom:2px;font-weight:bold;">
								<aon:outputText value="#{appBundle.aon_webmail_search_none}"/>
							</aon:div>
						</aon:div>
						<aon:div rendered="#{search.resultFound}">
						
							<aon:dataTable id="messageDataTable" 
								value="#{search.sortableList.model}" var="to" rows="10" 
								cellpadding="0" cellspacing="0"
								columnClasses="aon-editDataTable-textColumn,
										aon-editDataTable-textColumn, aon-editDataTable-textColumn">
										
								<aon:rowSelector action="message"
									actionListener="#{search.changeSelectedMessage}" />							
																				
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_webmail_from}"/>
									</f:facet>
									<aon:outputText escape="false" converter="longString" value="#{to.sender}"/>
								</aon:column>
								
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_webmail_subject}"/>
									</f:facet>
									<aon:outputText value="#{to.subject}" />
								</aon:column>
										  
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_webmail_date}"/>
									</f:facet>
									<aon:outputText value="#{to.sentDate}"/>
								</aon:column>		  
							</aon:dataTable>
							
							<aon:dataScroller2 for="messageDataTable" />
	
						</aon:div>
					</aon:div>
		    	</aon:div>		
			</aon:div>		    
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
