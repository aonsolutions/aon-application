<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="emailList">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true" id="buttonsGrid"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_webmail_email}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{bundle.aon_listing}- #{bundle.aon_editing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}" reRender="emailDiv,buttonsGrid"
							actionListener="#{email.onReset}" rendered="#{!email.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:commandButton id="save" reRender="emailDiv,buttonsGrid"
							value="#{bundle.aon_save}" rendered="#{email.to!=null or email.new}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{email.onAccept}" 
							accesskey="#{bundle.aon_key_new}" />
						<aon:confirmButton id="cancelNew" reRender="emailDiv,buttonsGrid"
							value="#{bundle.aon_cancel}" rendered="#{email.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
							confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{email.onCancel}"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:commandButton id="cancelEdit" reRender="emailDiv,buttonsGrid"
							value="#{bundle.aon_cancel}" rendered="#{email.to!=null and (!email.new)}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
							actionListener="#{email.onCancel}"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove" reRender="emailDiv,buttonsGrid"
							value="#{bundle.aon_remove}" rendered="#{!email.checklistEmpty}"
							styleClass="aon-finding-toolbar-item aon-icon-delete" immediate="true"
							confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{email.onRemoveSelected}"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							action="folder" rendered="#{email.to==null}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"/>
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<!--  aon-region-body -->
 			<aon:div styleClass="aon-scroll-area" id="emailDiv">
				
				<aon:editDataTable id="emailData" var="to" rows="20"
					rendered="#{(email.model.rowCount > 0) or (email.new)}" value="#{email.model}"
					columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
							aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
							
					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:outputText value="#{bundle.aon_check}" />
							</aon:div>
						</f:facet>
						<aon:div layout="none">
							<aon:selectBooleanCheckbox rendered="#{to!=email.to}" reRender="buttonsGrid,emailDiv"
								value="#{email.rowChecked}"/>
							<aon:outputText value="&#160;" rendered="#{to==email.to}" />
						</aon:div>		 
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton alt="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset"
									actionListener="#{email.onReset}" value=""
									rendered="#{!email.new}" reRender="buttonsGrid"
									accesskey="#{bundle.aon_key_new_line}" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_webmail_email_alias}" />
						</f:facet>
						<aon:outputText value="#{to.name}" rendered="#{to!=email.to}"
							styleClass="aon-editDataTable-button" >
							<a4j:support reRender="emailDiv,buttonsGrid"
								actionListener="#{email.onSelect}" event="onclick" />
						</aon:outputText>
						<aon:inputText styleClass="aon-form-input-text " required="true"
							rendered="#{to==email.to}" size="35"
							value="#{email.to.name}" maxlength="32" />
						<f:facet name="footer">
							<aon:inputText styleClass="aon-form-input-text" required="true"
								rendered="#{email.new}" size="35"
								value="#{email.to.name}" maxlength="32" />
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_webmail_email_email}" />
						</f:facet>
						<aon:outputText value="#{to.email}" rendered="#{to!=email.to}"
							styleClass="aon-editDataTable-button">
							<a4j:support reRender="emailDiv,buttonsGrid"
								actionListener="#{email.onSelect}" event="onclick" />
						</aon:outputText>
						<aon:inputText styleClass="aon-form-input-text " required="true"
							rendered="#{to==email.to}" size="70"
							value="#{email.to.email}" maxlength="64" />
						<f:facet name="footer">
							<aon:inputText styleClass="aon-form-input-text" required="true"
								rendered="#{email.new}" size="70"
								value="#{email.to.email}" maxlength="64" />
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:div>
							<f:verbatim rendered="#{to!=email.to}">&#160;</f:verbatim>
							<aon:commandButton id="acceptEdit-email" title="[#{bundle.aon_accept}]" 
								rendered="#{to==email.to}" reRender="buttonsGrid"
								styleClass="aon-editDataTable-button aon-icon-accept"
								actionListener="#{email.onAccept}"
								accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								rendered="#{to==email.to}" reRender="buttonsGrid"
								actionListener="#{email.onCancel}" immediate="true"
								accesskey="#{bundle.aon_key_cancel_line}" />
							<aon:confirmButton id="rowRemove" title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								rendered="#{to==email.to}" reRender="buttonsGrid"
								confirmTitle="#{bundle.aon_confirm_title}" 
								confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{email.onRemove}" immediate="true"
								accesskey="#{bundle.aon_key_remove_line}" />								
						</aon:div>
						<f:facet name="footer">
							<aon:div>
								<f:verbatim rendered="#{!email.new}">&#160;</f:verbatim>
								<aon:commandButton title="[#{bundle.aon_accept}]" 
									styleClass="aon-editDataTable-button aon-icon-accept"
									rendered="#{email.new}" reRender="emailDiv,buttonsGrid"
									actionListener="#{email.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:confirmButton id="footerNewCancel" title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{email.new}" reRender="emailDiv,buttonsGrid"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_cancel_confirm}"
									confirmActionListener="#{email.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
							</aon:div>
						</f:facet>
					</aon:column>
					
				</aon:editDataTable>

				<aon:dataScroller rendered="#{!((email.model.rowCount==0) and (email.new))}"
					for="emailData" rowCount="#{email.model.rowCount}" showNote="true" />

			</aon:div>

		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
