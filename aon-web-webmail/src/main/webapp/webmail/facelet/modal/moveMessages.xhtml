<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition>

<style>
.bodyPanel_ {
	width:380px;
    height:350px;
    overflow:auto;
}
</style>


        <rich:modalPanel  id="msgMoveModalPanel"  
            height="380" width="380" zindex="2000">
            <f:facet name="header">
                <h:outputText value="#{appBundle.aon_webmail_move_message}" />
            </f:facet>
            <f:facet name="controls">
                <h:graphicImage value="/images/icefaces/popupclose.gif" style="cursor:pointer" onclick="Richfaces.hideModalPanel('msgMoveModalPanel')" />
            </f:facet>
			<rich:panel bodyClass="bodyPanel_">
				<rich:tree style="width:380px" 
						nodeSelectListener="#{tree.moveMessagesToFolder}"
						id="foldersTree_modal" 
		                ajaxSubmitSelection="true"  
		                switchType="server"
		                value="#{tree.treeNode}" 
		                var="item">
					<rich:treeNode>
						<aon:commandLink 
							onclick="Richfaces.hideModalPanel('msgMoveModalPanel')"
		                	value="#{item.name}"
		                	action="folder"
							rendered="#{!item.root}" />
					</rich:treeNode>
				</rich:tree>
			</rich:panel>	
        </rich:modalPanel>													

</ui:composition>

</body>
</html>
