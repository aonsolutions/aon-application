<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="emailList">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_webmail_spam}"/>: 
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_listing}- #{bundle.aon_editing}" /> 						
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="save"
							value="#{appBundle.aon_webmail_spam_save}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{spam.onSave}"
							reRender="mainData,listData"
							accesskey="#{appBundle.aon_webmail_spam_save}"/>
						
						<aon:commandButton id="load"
							value="#{appBundle.aon_webmail_spam_reload}" 
							styleClass="aon-finding-toolbar-item aon-icon-refresh"
							actionListener="#{spam.onLoad}"
							reRender="mainData,listData"
							accesskey="#{appBundle.aon_webmail_spam_reload}"/>
						<aon:commandButton
							id="addWhiteList" reRender="addBlackWhiteListWindow"
							value="#{appBundle.aon_webmail_add_white_list}" 
							styleClass="aon-finding-toolbar-item aon-icon-white-list"
							title="#{appBundle.aon_webmail_add_white_list}"
							actionListener="#{spam.openNewWhitePanelPopup}">
						</aon:commandButton>
						
						<aon:commandButton
							id="addBlackList" reRender="addBlackWhiteListWindow"
							value="#{appBundle.aon_webmail_add_black_list}" 
							styleClass="aon-finding-toolbar-item aon-icon-black-list"
							title="#{appBundle.aon_webmail_add_black_list}"
							actionListener="#{spam.openNewBlackPanelPopup}" >
						</aon:commandButton>
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							action="folder"
							accesskey="#{bundle.aon_key_cancel}" />		
						
					</aon:div>
				</aon:panelGrid>
			</aon:div>
					
			<aon:panelGroup>
				<aon:panelGrid id="mainData" columns="2" dir="true" style="margin:1em;"
					>

					<aon:outputLabel for="spam_score"
						value="#{appBundle.aon_webmail_spam_score}" />
					<aon:selectOneRadio id="spam_score" 
						value="#{spam.spamScoreType}">
						<f:selectItems value="#{spam.scoreTypes}" />
					</aon:selectOneRadio>
						
					<aon:outputLabel for="spam_rewrite"
						value="#{appBundle.aon_webmail_spam_rewrite}" />
					<aon:inputText id="spam_rewrite"
						size="45" maxlength="40"
						value="#{spam.rewrite_1}" />
						
				</aon:panelGrid>
			</aon:panelGroup>
						
					
			<aon:panelGrid id="listData" columns="2" cellpadding="0" cellspacing="10" styleClass="aon-panelGrid-formatting"
			columnClasses="aon-width-50percent,aon-width-50percent">
				<aon:div styleClass="aon-group">
					<aon:div styleClass="aon-group-title">
						<aon:outputText value="#{appBundle.aon_webmail_spam_white}"/>
					</aon:div>
					<aon:div styleClass="aon-group-body"> 
						<aon:div styleClass="aon-group-body-internal">
							<aon:panelGrid columns="2" cellpadding="0" cellspacing="0"
								styleClass="aon-box aon-box-outstanding2"
								columnClasses="aon-vertical-align-middle,aon-vertical-align-middle">
								<aon:selectBooleanCheckbox 
									styleClass="aon-float-left"
									value="#{spam.addContactsToWhite}" />
								<aon:outputLabel for="spam_score"
									escape="false" 
									styleClass="aon-icon-agenda aon-icon"
									value="#{appBundle.aon_webmail_add_contacts_to_white_list}" />
							</aon:panelGrid> 
	                    	<aon:dataTable id="whiteList" 
				                    	var="whiteTo" 
				                    	value="#{spam.whiteLst}" 
				                    	cellpadding="0" cellpacing="0"
				                    	columnClasses="aon-width-20,aon-editDataTable-textColumn"
				                    	>
	                        <aon:column>
	                            <f:facet name="header">
									<aon:div styleClass="aon-icon-trash">
		                                <aon:outputText value="&#160;"/>
									</aon:div>
	                            </f:facet>
								<aon:selectBooleanCheckbox 
									styleClass="aon-float-left"
									value="#{whiteTo.selected}">
								</aon:selectBooleanCheckbox>				                     
	                        </aon:column>
	                        
	                        <aon:column>
	                            <f:facet name="header">
									   <aon:outputText value="#{appBundle.aon_webmail_spam_accounts}"/>
							    </f:facet>
		                        <aon:outputText value="#{whiteTo.email}" styleClass="aon-bold" rendered="#{whiteTo.added and !whiteTo.selected}" />
		                        <aon:outputText value="#{whiteTo.email}" styleClass="aon-line-through"  rendered="#{whiteTo.selected}" />
		                        <aon:outputText value="#{whiteTo.email}" styleClass="aon-text-disabled" rendered="#{!whiteTo.added and !whiteTo.selected}" />
	                        </aon:column>
	                    </aon:dataTable>
					</aon:div>
				</aon:div>
			</aon:div>
			<aon:div styleClass="aon-group">
					<aon:div styleClass="aon-group-title">
						<aon:outputText value="#{appBundle.aon_webmail_spam_black}"/>
					</aon:div>
					<aon:div styleClass="aon-group-body"> 	
						<aon:div styleClass="aon-group-body-internal">
		                    <aon:dataTable id="spam" 
					                    	var="blackTo" 
					                    	value="#{spam.blackLst}" 
					                    	columns="2"
					                    	columnClasses="aon-width-20,aon-editDataTable-textColumn">
		                        <aon:column>
		                            <f:facet name="header">			                            	
											<aon:div styleClass="aon-icon-trash">
				                                <aon:outputText value="&#160;"/>
											</aon:div>											
		                            </f:facet>
									<aon:selectBooleanCheckbox 
										styleClass="aon-float-left"
										value="#{blackTo.selected}">
									</aon:selectBooleanCheckbox>
									
		                        </aon:column>
		                        <aon:column>
		                            <f:facet name="header">											
									   <aon:outputText value="#{appBundle.aon_webmail_spam_accounts}"/>
								    </f:facet>															
			                            <aon:outputText value="#{blackTo.email}" styleClass="aon-bold" rendered="#{blackTo.added and !blackTo.selected}" />
			                            <aon:outputText value="#{blackTo.email}" styleClass="aon-line-through" rendered="#{blackTo.selected}" />
			                            <aon:outputText value="#{blackTo.email}" styleClass="aon-text-disabled" rendered="#{!blackTo.added and !blackTo.selected}" />
		                        </aon:column>
							</aon:dataTable>
						</aon:div>
					</aon:div>
				</aon:div>
			</aon:panelGrid>
				
		</aon:form>

		<ui:include src="/webmail/facelet/modal/blackWhiteList.xhtml" />
		
	</ui:define>

</ui:composition>

</body>
</html>
