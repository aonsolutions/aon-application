<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition>

	<aon:div rendered="#{!login.logged}">
		<aon:div styleClass="aon-content-home">
			<aon:outputText value="#{login.error}" />
		</aon:div>		
	</aon:div>

	<aon:div id="noFolderSelected" rendered="#{!folder.folderSelected and login.logged}">
		<aon:div styleClass="aon-content-home">
			<aon:outputText value="NO FOLDER SELECTED" />
		</aon:div>		
	</aon:div>

	<aon:div id="folderSelected" rendered="#{folder.folderSelected and login.logged}" >

		<aon:div id="messageGrid">

			<ui:include src="/webmail/facelet/webmailButtons.xhtml" />	

		    <aon:div styleClass="aon-section-title">
				<aon:outputText value="#{folder.folder.name}"/>
         	</aon:div>
		
			<aon:div styleClass="aon-toolbar">
												
				<aon:commandButton
						id="selectButton"
						actionListener="#{folder.selectAllPageMessages}"
						reRender="messageGrid"
						styleClass="aon-icon-commandButton-disabled aon-icon-checkAll">
				</aon:commandButton>
				
				<aon:commandButton
						id="deselectButton"
						actionListener="#{folder.deselectAllPageMessages}"
						reRender="messageGrid"
						styleClass="aon-icon-commandButton-disabled aon-icon-checkNone">
				</aon:commandButton>
				
				<aon:confirmButton id="deleteButton_n"
					rendered="#{folder.folder.deleteableAllMessages}"
					title="#{appBundle.aon_webmail_deletemail}"
					confirmTitle="#{appBundle.aon_webmail_advice}" 
					confirmMessage="#{bundle.aon_remove_confirm}"
					accesskey="#{bundle.aon_key_remove}"
					confirmAction="folder"
					confirmActionListener="#{folder.deleteCheckedMessages}"
					value="#{appBundle.aon_webmail_deletemail}"
					styleClass="aon-icon-mailDelete aon-finding-toolbar-item" />
				<aon:commandButton
					rendered="#{!folder.folder.deleteableAllMessages}"
					title="#{appBundle.aon_webmail_deletemail}"
					action="folder"
					actionListener="#{folder.deleteCheckedMessages}"
					value="#{appBundle.aon_webmail_deletemail}"
					styleClass="aon-icon-mailDelete aon-finding-toolbar-item" >
				</aon:commandButton>								
			
				<aon:commandButton
					id="searchMail"
					title="#{appBundle.aon_webmail_search}"
					action="messageSearch"
					actionListener="#{search.init}"
					value="#{appBundle.aon_webmail_search}"
					styleClass="aon-icon-mailSearch aon-finding-toolbar-item" >
				</aon:commandButton>								
			
				<aon:confirmButton id="deleteAllButton"
					rendered="#{folder.folder.deleteableAllMessages}"
					title="#{appBundle.aon_webmail_deleteallmail}"
					confirmTitle="#{appBundle.aon_webmail_advice}" 
					confirmMessage="#{appBundle.aon_remove_all_confirm}"
					accesskey="#{bundle.aon_key_remove}"
					confirmAction="folder"
					confirmActionListener="#{folder.deleteAllMessages}"
					value="#{appBundle.aon_webmail_deleteallmail}"
					styleClass="aon-icon-mailDelete aon-finding-toolbar-item" />
		
				<!-- Move button  -->
				<aon:commandButton
						id="moveButton"
						title="#{appBundle.aon_webmail_movemail}"
						value="#{appBundle.aon_webmail_movemail}"
						styleClass="aon-finding-toolbar-item aon-icon-mail-move"
						onclick="javascript:Richfaces.showModalPanel('msgMoveModalPanel',{width:440, top:100})">
				</aon:commandButton>									

				<ui:include src="/webmail/facelet/modal/moveMessages.xhtml" />
				
			</aon:div>

			<aon:panelGroup 
				styleClass="aon-box aon-box-outstanding2" 
				rendered="#{folder.folder.messageCount==0}">
				<aon:outputText value="#{appBundle.aon_webmail_nomessages}"/>
			</aon:panelGroup>
			<aon:div style="width:98%">
				<aon:dataTable id="messageDataTable" 
					value="#{folder.folder.messageList}" 
					var="to" styleClass="aon-dataTable"
					rows="#{folder.pageObjectNumber}" 
					rowClasses="aon-dataTable-row-odd,aon-dataTable-row-even"
					columnClasses="aon-width-80,
							aon-editDataTable-textColumn,
							aon-editDataTable-textColumn,
							aon-editDataTable-textColumn">
					<aon:column id="folderCol">
						<f:facet name="header">
							<aon:outputText value="&nbsp;"/>
						</f:facet>
						<aon:selectBooleanCheckbox styleClass="aon-float-left"
							id="checkMessage"
							value="#{to.selected}"
							>
							<a4j:support 
								event="onclick"  
								reRender="messageDataTable" />
						</aon:selectBooleanCheckbox>
						<aon:panelGroup styleClass="aon-float-left">
							<aon:outputText rendered="#{!to.readed}" value="&#160;"  styleClass="aon-icon aon-icon-mailInbox" style="cursor: pointer;width:16px;" />
							<aon:outputText rendered="#{to.readed and !to.answered}" value="&#160;" styleClass="aon-icon aon-icon-mailInbox-read" style="cursor: pointer;width:16px;"/>
							<aon:outputText rendered="#{to.answered}" value="&#160;" styleClass="aon-icon aon-icon-mailInbox-answered" style="cursor: pointer;width:16px;"/>
						</aon:panelGroup>
						<aon:div styleClass="aon-float-left">
							<aon:graphicImage  
								value="/css/richCss/images/aon-icon/aon-icon-attach-file.png" 
								rendered="#{to.attachment}" />
						</aon:div>
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:commandLink action="folder" actionListener="#{folder.orderByFrom}" rendered="#{!folder.sentItemColumn}">
									<aon:outputText value="#{appBundle.aon_webmail_from}" />
								</aon:commandLink>
								<aon:commandLink action="folder" actionListener="#{folder.orderByTo}" rendered="#{folder.sentItemColumn}">
									<aon:outputText value="#{appBundle.aon_webmail_to}" />
								</aon:commandLink>
							</aon:div>
						</f:facet>
						<aon:div style="white-space:nowrap">
							<aon:commandLink action="message" actionListener="#{to.changeSelectedMessage}">
								<aon:outputText escape="false" title="#{to.senderEmail}" value="#{to.senderShort}" rendered="#{!folder.sentItemColumn and to.readed}"/>
								<aon:outputText escape="false" title="#{to.senderEmail}" value="#{to.senderShort}" rendered="#{!folder.sentItemColumn and !to.readed}" style="font-weight: bold" />
								<aon:outputText escape="false" title="#{to.recipientsToEmail}" value="#{to.recipientsToShort}" rendered="#{folder.sentItemColumn}"/>
							</aon:commandLink>
						</aon:div>
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:commandLink action="folder" actionListener="#{folder.orderBySubject}">
								<aon:outputText value="#{appBundle.aon_webmail_subject}"/>
							</aon:commandLink>
						</f:facet>
						<aon:commandLink action="message" actionListener="#{to.changeSelectedMessage}">
							<aon:outputText escape="false" value="#{to.subjectShort}" rendered="#{to.readed}"/>
							<aon:outputText escape="false" value="#{to.subjectShort}" rendered="#{!to.readed}" style="font-weight: bold" />
						</aon:commandLink>
					</aon:column>		  
					<aon:column>
						<f:facet name="header">
							<aon:commandLink action="folder" actionListener="#{folder.orderByDate}">
								<aon:outputText value="#{appBundle.aon_webmail_date}"/>
							</aon:commandLink>
						</f:facet>
						<aon:div style="white-space:nowrap">
						<aon:commandLink action="message" actionListener="#{to.changeSelectedMessage}">
							<aon:outputText value="#{to.sentDateString}" rendered="#{to.readed}" />
							<aon:outputText value="#{to.sentDateString}" rendered="#{!to.readed}" style="font-weight: bold"/>
						</aon:commandLink>
							</aon:div>
					</aon:column>		  
				</aon:dataTable>
			</aon:div>
			<aon:div styleClass="aon-dataScroller">
			<rich:datascroller
				id="messageDataScroller" 
				align="left"  for="messageDataTable" 
				maxPages="20"
				actionListener="#{folder.dataScrollActionListener}" />
			</aon:div>
		</aon:div>
	</aon:div>
	
</ui:composition>

</body>
</html>
