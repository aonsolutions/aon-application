<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"	
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	>
<body>

<ui:composition>

	<aon:div rendered="#{!login.logged}">
		<aon:div styleClass="aon-content-home">
			<aon:outputText value="#{login.error}" />
		</aon:div>
	</aon:div>

	<aon:div id="noFolderSelected"
		rendered="#{!folder.folderSelected and login.logged}">
		<aon:div styleClass="aon-content-home">
			<aon:outputText value="NO FOLDER SELECTED" />
		</aon:div>
	</aon:div>

	<aon:div id="folderSelected"
		rendered="#{folder.folderSelected and login.logged}">

		<aon:div id="messageGrid">

			<ui:include src="/webmail/facelet/webmailButtons.xhtml" />

			<aon:div styleClass="aon-section-title" >
				<aon:outputText value="#{folder.folder.name}" />
				<aon:outputText value=" #{folder.refreshNeeded}" style="display: none;" />
			</aon:div>

			<aon:div styleClass="aon-toolbar">

				<aon:commandButton id="selectButton"
					actionListener="#{folder.selectAllPageMessages}"
					reRender="messageGrid"
					styleClass="aon-icon-commandButton-disabled aon-icon-checkAll">
				</aon:commandButton>

				<aon:commandButton id="deselectButton"
					actionListener="#{folder.deselectAllPageMessages}"
					reRender="messageGrid"
					styleClass="aon-icon-commandButton-disabled aon-icon-checkNone aon-finding-toolbar-item">
				</aon:commandButton>

				<aon:commandButton id="newMailMessage"
					title="#{appBundle.aon_webmail_newmail}" action="messageNew"
					actionListener="#{message.createNewMessage}"
					value="#{appBundle.aon_webmail_newmail}"
					styleClass="aon-finding-toolbar-item aon-icon-newMail">
				</aon:commandButton>

				<aon:confirmButton id="deleteButton_n"
					rendered="#{folder.folder.deleteableAllMessages}"
					title="#{appBundle.aon_webmail_deletemail}"
					confirmTitle="#{appBundle.aon_webmail_advice}"
					confirmMessage="#{bundle.aon_remove_confirm}"
					accesskey="#{bundle.aon_key_remove}" confirmAction="folder"
					confirmActionListener="#{folder.deleteCheckedMessages}"
					value="#{appBundle.aon_webmail_deletemail}"
					styleClass="aon-icon-mailDelete aon-finding-toolbar-item" />
				<aon:commandButton
					rendered="#{!folder.folder.deleteableAllMessages}"
					title="#{appBundle.aon_webmail_deletemail}" action="folder"
					actionListener="#{folder.deleteCheckedMessages}"
					value="#{appBundle.aon_webmail_deletemail}"
					styleClass="aon-icon-mailDelete aon-finding-toolbar-item">
				</aon:commandButton>

				<aon:commandButton id="searchMail"
					title="#{appBundle.aon_webmail_search}" action="messageSearch"
					actionListener="#{search.init}"
					value="#{appBundle.aon_webmail_search}"
					styleClass="aon-icon-mailSearch aon-finding-toolbar-item">
				</aon:commandButton>

				<aon:confirmButton id="deleteAllButton"
					rendered="#{folder.folder.deleteableAllMessages}"
					title="#{appBundle.aon_webmail_deleteallmail}"
					confirmTitle="#{appBundle.aon_webmail_advice}"
					confirmMessage="#{appBundle.aon_remove_all_confirm}"
					accesskey="#{bundle.aon_key_remove}" confirmAction="folder"
					confirmActionListener="#{folder.deleteAllMessages}"
					value="#{appBundle.aon_webmail_deleteallmail}"
					styleClass="aon-icon-mailDelete aon-finding-toolbar-item" />

				<!-- Move button  -->
				<aon:commandButton id="moveButton"
					title="#{appBundle.aon_webmail_movemail}"
					value="#{appBundle.aon_webmail_movemail}"
					styleClass="aon-finding-toolbar-item aon-icon-mail-move">
					<rich:componentControl for="msgMoveModalPanel" operation="show"
						event="onclick" />
				</aon:commandButton>

				<ui:include src="/webmail/facelet/modal/moveMessages.xhtml" />

			</aon:div>

			<aon:div id="messagesDiv" layout="none">

				<aon:div styleClass="aon-box aon-box-outstanding2"
					rendered="#{folder.folder.messageCount==0}">
					<aon:outputText value="#{appBundle.aon_webmail_nomessages}" />
				</aon:div>
			
				<aon:div style="width:99%" rendered="#{folder.folder.messageCount>0}">
					
					<aon:dataTable id="messageDataTable" style="border-right:#ccc 1px solid;"
						value="#{folder.folder.model}" var="to"
						rows="#{folder.pageObjectNumber}"
						columnClasses="aon-width-80,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn">
								
						<aon:rowSelector 
							action="message" actionListener="#{folder.folder.changeSelectedMessage}" />							
								
						<aon:column id="folderCol">
							<f:facet name="header">
								<aon:outputText value="&nbsp;" />
							</f:facet>
							<aon:selectBooleanCheckbox styleClass="aon-float-left"
								id="checkMessage" value="#{to.selected}"
								onmouseover="disableRowSelector();" onmouseout="enableRowSelector();">
							</aon:selectBooleanCheckbox>
							<aon:div styleClass="aon-float-left">
	 							<rich:dragSupport dragIndicator="messageIndicator" dragType="MESSAGE" dragValue="#{to}" />
								<aon:outputText rendered="#{!to.readed}" value="&#160;"
									styleClass="aon-icon aon-icon-mailInbox"
									style="cursor: pointer;width:16px;" />
								<aon:outputText rendered="#{to.readed and !to.answered}"
									value="&#160;" styleClass="aon-icon aon-icon-mailInbox-read"
									style="cursor: pointer;width:16px;" />
								<aon:outputText rendered="#{to.answered}" value="&#160;"
									styleClass="aon-icon aon-icon-mailInbox-answered"
									style="cursor: pointer;width:16px;" />
							</aon:div>
							<aon:div styleClass="aon-float-left">
								<aon:graphicImage
									value="/aonResource/images/aon-icon/aon-icon-attach-file.png"
									rendered="#{to.attachment}" />
							</aon:div>
						</aon:column>
						<aon:column>
							<f:facet name="header">
								<aon:div>
									<aon:commandLink action="folder"
										actionListener="#{folder.orderByFrom}"
										rendered="#{!folder.sentItemColumn}">
										<aon:outputText value="#{appBundle.aon_webmail_from}" />
									</aon:commandLink>
									<aon:commandLink action="folder"
										actionListener="#{folder.orderByTo}"
										rendered="#{folder.sentItemColumn}">
										<aon:outputText value="#{appBundle.aon_webmail_to}" />
									</aon:commandLink>
								</aon:div>
							</f:facet>
							<aon:div style="white-space:nowrap">
								<aon:outputText escape="false" title="#{to.senderEmail}"
									value="#{to.senderShort}"
									rendered="#{!folder.sentItemColumn and to.readed}" />
								<aon:outputText escape="false" title="#{to.senderEmail}"
									value="#{to.senderShort}"
									rendered="#{!folder.sentItemColumn and !to.readed}"
									style="font-weight: bold" />
								<aon:outputText escape="false" title="#{to.recipientsToEmail}"
									value="#{to.recipientsToShort}"
									rendered="#{folder.sentItemColumn}" />
							</aon:div>
						</aon:column>
						<aon:column>
							<f:facet name="header">
								<aon:commandLink action="folder"
									actionListener="#{folder.orderBySubject}">
									<aon:outputText value="#{appBundle.aon_webmail_subject}" />
								</aon:commandLink>
							</f:facet>
							<aon:outputText escape="false" value="#{to.subjectShort}"
								rendered="#{to.readed}" />
							<aon:outputText escape="false" value="#{to.subjectShort}"
								rendered="#{!to.readed}" style="font-weight: bold" />
						</aon:column>
						<aon:column>
							<f:facet name="header">
								<aon:commandLink action="folder"
									actionListener="#{folder.orderByDate}">
									<aon:outputText value="#{appBundle.aon_webmail_date}" />
								</aon:commandLink>
							</f:facet>
							<aon:div style="white-space:nowrap">
								<aon:outputText value="#{to.sentDateString}"
									rendered="#{to.readed}" />
								<aon:outputText value="#{to.sentDateString}"
									rendered="#{!to.readed}" style="font-weight: bold" />
							</aon:div>
						</aon:column>
					</aon:dataTable>
					
					<aon:dataScroller rowCount="#{folder.folder.messageCount}"
						for="messageDataTable" page="#{folder.currentPage}" />
	
				</aon:div>
				
			</aon:div>

		</aon:div>
	</aon:div>

</ui:composition>

</body>
</html>
