<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/header.xhtml" >
		<ui:define name="afterVersionContent">
			<a4j:region>
				<h:form>		
		            <a4j:poll interval="300000" actionListener="#{webmail.poll}"
		            	enabled="#{webmail.logged}" status="aonStatus" />
				</h:form>
			</a4j:region>	
		</ui:define>
		<ui:param name="skipDBUpdate" value="true" />
	</ui:decorate>

</ui:composition>
