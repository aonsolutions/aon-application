<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputLabel for="Article_alias"
		value="#{appBundle.cms_alias}" />
	<aon:inputText id="Article_alias" size="50"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Article_details_title"
		value="#{appBundle.article_title}" />
	<aon:inputText id="Article_details_title" size="50"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Article_details_subtitle"
		value="#{appBundle.article_subtitle}" />
	<aon:inputText id="Article_details_subtitle" size="50"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Article_articleCategory_id"
		value="#{appBundle.article_category}"/>
	<aon:selectOneMenu id="Article_articleCategory_id"  
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="-"	itemValue="#{null}" />
		<f:selectItems value="#{collections.articleCategoryList}" />
	</aon:selectOneMenu>
	
	<aon:outputLabel for="Article_articleType"
		value="#{appBundle.article_type_}"/>
	<aon:selectOneMenu id="Article_articleType"   
		valueChangeListener="#{controller.addEqualExpression}">
		<aon:enumConverter enum="com.code.aon.cms.enumeration.ArticleType" />
		<f:selectItem itemLabel="-"	itemValue="#{null}" />
		<f:selectItems value="#{collections.articleTypes}" />
	</aon:selectOneMenu>					

	<aon:outputLabel value="#{appBundle.article_publishDate}" />
	<aon:div>
		<aon:outputLabel for="Article_publishDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Article_publishDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="Article_publishDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Article_publishDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>

	<aon:outputLabel value="#{appBundle.article_expireDate}" />
	<aon:div>
		<aon:outputLabel for="Article_expireDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Article_expireDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="Article_expireDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Article_expireDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>

	<aon:outputLabel for="Article_position"
		value="#{appBundle.article_position}" />
	<aon:inputText id="Article_position" size="10"
		valueChangeListener="#{controller.addExpression}" />
	
	<aon:outputLabel for="Article_active"
		value="#{appBundle.article_active}" />
	<aon:selectOneMenu id="Article_active"
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="-"	itemValue="#{null}" />
		<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
		<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
	</aon:selectOneMenu>											

</ui:composition>
