<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{articleDocument}" />
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-nowrap" >
				<f:facet name="header">
					<aon:outputLabel value="#{appBundle.cms_alias}"
						for="ArticleDocument_Alias" />
				</f:facet>
				<aon:outputText value="#{to.alias}" rendered="#{formList}" />
				<aon:inputText id="ArticleDocument_Alias" 
					value="#{controller.to.alias}" rendered="#{formEdit}" 
					maxlength="255" size="30" >
					<f:validator validatorId="AliasValidator" />
				</aon:inputText>		
				<f:facet name="footer">
					<aon:inputText id="ArticleDocument_Alias-New"
						value="#{controller.to.alias}" rendered="#{formNew}" 
						maxlength="255" size="30" >
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>		
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-nowrap" >
				<f:facet name="header">
					<aon:outputLabel value="#{appBundle.document_related_title}"
						for="ArticleDocument_Title" />
				</f:facet>
				<aon:outputText value="#{controller.i18nTitle}" rendered="#{formList}" />
				<aon:inputText id="ArticleDocument_Title"
					value="#{controller.toI18n.title}" rendered="#{formEdit}" 
					maxlength="128" size="30" />
				<f:facet name="footer">
					<aon:inputText id="ArticleDocument_Title-New" 
						value="#{controller.toI18n.title}" rendered="#{formNew}" 
						maxlength="128" size="30" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-nowrap" >
				<f:facet name="header">
					<aon:outputLabel value="#{appBundle.document_related}"
						for="ArticleDocument_File" />
				</f:facet>
				<aon:outputText value="#{controller.i18nFile}" />
				<f:facet name="footer">
					<aon:div id="attachFileNew">
						<a4j:region>
							<ui:include src="/facelet/content/utils/fileInput.xhtml" >
								<ui:param name="fileInputId" value="ArticleDocument_File" />
								<ui:param name="fileInputRendered" value="#{formNew}" />
								<ui:param name="onCompleteReRender" value="attachFileNew,ArticleDocument_Alias-New,ArticleDocument_Title-New" />
							</ui:include>
						</a4j:region>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-nowrap" >
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_description}"
						for="ArticleDocument_Description" />
				</f:facet>
				<aon:outputText value="#{controller.i18nDescription}" rendered="#{formList}" />
				<aon:inputTextarea id="ArticleDocument_Description"
					cols="30" rows="10" rendered="#{formEdit}"
					value="#{controller.toI18n.description}" />
				<f:facet name="footer">
					<aon:inputTextarea id="ArticleDocument_Description-New"
						cols="30" rows="10" rendered="#{formNew}"
						value="#{controller.toI18n.description}" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
