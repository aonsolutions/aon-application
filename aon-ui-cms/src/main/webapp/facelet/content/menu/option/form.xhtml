<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="menuOptionForm" partialSubmit="false">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar" 
				cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.menu_option}" />					
				</aon:div>		
			
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" rendered="#{menu_option.to!=null or menu_option.new}"
							actionListener="#{menu_option.onAccept}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:commandButton id="cancel"
							value="#{bundle.aon_cancel}" rendered="#{menu_option.to!=null or menu_option.new}" immediate="#{true}"
							actionListener="#{menu_option.onCancel}" action="menu_option_list"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!menu_option.new}" immediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{menu_option.onRemoveI18n}" confirmAction="menu_option_form"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search"
							value="#{bundle.aon_search}" immediate="true"
							action="menu_option_search" actionListener="#{menu_option.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-icon-search"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-search'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-search aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}"/>
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{menu_option.onReset}" rendered="#{!menu_option.new}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<aon:div styleClass="aon-content-subtitle-internal">
					<aon:outputText
						value="#{menu_option.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</aon:div>
			</aon:div>
			<aon:div id="aon-scroll-area" forceId="#{true}">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:panelGrid columns="2">
						<aon:panelGrid columns="2" dir="true" styleClass="aon-form-table"
							columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

							<aon:outputLabel for="MenuOption_alias" style="width:100px"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.menu_option_alias}" />
							<aon:inputText id="MenuOption_alias"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="32" maxlength="32"
								value="#{menu_option.to.alias}" />

							<aon:outputLabel for="MenuOptionDetail_label"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.menu_option_label}" />
							<aon:inputText id="MenuOptionDetail_label"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="50" maxlength="64"
								value="#{menu_option.toI18n.label}" />

							<aon:outputLabel for="MenuOption_type"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.menu_option_type}" />
							<aon:selectOneMenu id="MenuOption_type" 
								styleClass="aon-form-selectOneMenu-field"
								value="#{menu_option.to.type}" partialSubmit="true">
								<f:selectItems value="#{collections.pageTypes}" />
							</aon:selectOneMenu> 

							<aon:outputLabel for="MenuOption_level"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.menu_option_level}" rendered="#{menu_option.visibleLevel}"/>
							<aon:selectOneMenu id="MenuOption_level" rendered="#{menu_option.visibleLevel}" 
								styleClass="aon-form-selectOneMenu-field"
								value="#{menu_option.to.level}" partialSubmit="true">
								<f:selectItems value="#{menu_option.levels}" />
							</aon:selectOneMenu> 

							<aon:outputLabel for="MenuOption_ident"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.menu_option_ident}" rendered="#{menu_option.visibleIdent}"/>
							<aon:selectOneMenu id="MenuOption_ident" rendered="#{menu_option.visibleIdent}" 
								styleClass="aon-form-selectOneMenu-field"
								value="#{menu_option.to.ident}"
								 partialSubmit="true">
								<f:selectItems value="#{menu_option.idents}" />
							</aon:selectOneMenu> 

							<aon:outputLabel for="MenuOptionDetail_url"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.menu_option_url}" rendered="#{menu_option.visibleUrl}"/>
							<aon:inputText id="MenuOptionDetail_url" rendered="#{menu_option.visibleUrl}"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="100" maxlength="255"
								value="#{menu_option.toI18n.url}" />

						</aon:panelGrid>
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>
</ui:composition>

</body>
</html>
