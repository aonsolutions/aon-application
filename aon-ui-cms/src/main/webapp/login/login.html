<html>
	<head>
		<title>
			Autentificaci&oacute;n
		</title>
		<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
		<meta http-equiv="Expires" content="0" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Cache-Control" content="no-store" />
		<link href="./login/css/login-aon.css" rel="stylesheet" type="text/css"></link>
		<script type='text/javascript' src="./login/js/Login.js">
		</script>
	</head>
<body>
	<div class="aon-login">
		<div class="aon-login-box-internal">
			<div class="aon-login-title">
				XXXXXXXXXXXXXXXXXXXXXXXXXXXXX
			</div>
		</div>
		<div class="aon-login-box">
			<div class="aon-login-box-internal">
				<div class="aon-login-instruction">
					ZZ ZZZZZZZ ZZZZ ZZZZZZ ZZZZZZ ZZZZZZ
				</div>
				<div class="aon-login-form">
					<form name="loginForm" method="post"
						action="j_security_check" style="display: inline;">
						<div class="aon-login-form-group">
							<div>
								<span class="aon-form-input-text-label">
									Usuario:
								</span>
							</div>
							<div>
								<input type="text" name="j_username" class="aon-form-input-text" />
							</div>
						</div> 
						<div class="aon-login-form-group">
							<div>
								<span class="aon-form-input-text-label">
									Contraseña:
								</span>
							</div>
							<div>
								<input type="password" name="j_password"
									class="aon-form-input-text aon-form-input-text-password" />
								<input type="submit" value="" class="aon-login-button"/>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
