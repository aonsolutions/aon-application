<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
	
		<aon:form id="modulaPageForm">
		
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.modular_page}" />
				<ui:param name="controller" value="#{modularPage}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:param name="skipRemoveButton" value="#{!cms.roleEditor}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="generate_modular" reRender="aonStatus"
						value="#{appBundle.aon_generate}" immediate="true"
						actionListener="#{generator.onGenerateCurrentModular}"
						rendered="#{modularPage.to!=null and (!modularPage.new) and cms.roleEditor}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}">
						<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>		
		
			
			<aon:div id="mainForm" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true">
	
					<aon:outputLabel for="ModularPage_alias" style="width:100px"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="ModularPage_alias"
						required="true" size="32" maxlength="32"
						value="#{modularPage.to.alias}">
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>
						
					<aon:outputLabel for="ModularPage_label" 
						value="#{appBundle.cms_label}" />
					<aon:inputText id="ModularPage_label"
						required="true" size="64"
						value="#{modularPage.toI18n.label}" />

					<aon:outputLabel for="ModularPage_section"
						value="#{appBundle.cms_section}"/>
					<aon:selectOneMenu id="ModularPage_section"
						styleClass="aon-form-selectOneMenu-field"
						value="#{modularPage.to.section}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="ModularPage_type"
						value="#{bundle.aon_type}"/>
					<aon:selectOneMenu id="ModularPage_type"
						styleClass="aon-form-selectOneMenu-field"
						value="#{modularPage.to.modularType}">
						<f:selectItems value="#{collections.modularTypes}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
				<aon:div id="detail">
					<aon:div styleClass="aon-form-group"
						rendered="#{!modularPage.new and modularPage.toI18n.id != null}">
						<aon:div styleClass="aon-form-group-title">
							<aon:div styleClass="aon-form-group-title-internal">
								<aon:outputLabel for="modularPageOptionData" value="#{appBundle.modular_page_option}" />
							</aon:div>
						</aon:div>
						<aon:div rendered="#{modularPageOption.to==null}">
					
							<aon:div styleClass="aon-toolbar">
								<aon:div styleClass="aon-finding-toolbar-item-group">							
									<aon:commandButton id="reset_list"
										rendered="#{!modularPageOption.new and cms.roleEditor}"
										reRender="detail"
										value="#{bundle.aon_reset}"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}">
										<aon:actionListener method="#{modularPageOption.onReset}" />
									</aon:commandButton>
								</aon:div>		
							</aon:div>
						
							<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
								<ui:param name="controller" value="#{modularPageOption}" />
								<ui:param name="rowSelectorReRender" value="detail" />
								<ui:define name="columns">								
																				
									<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{appBundle.cms_alias}"/>
										</f:facet>
										<aon:outputText value="#{to.alias}" />
									</aon:column>
		
									<aon:column styleClass="aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{appBundle.cms_label}"/>
										</f:facet>
										<aon:outputText value="#{modularPageOption.i18nLabel}" >
											<aon:abbreviateConverter maxWidth="60" />
										</aon:outputText>									
									</aon:column>
		
									<aon:column styleClass="aon-editDataTable-iconColumn">
										<f:facet name="header">
											<aon:outputText value="#{appBundle.cms_active}" />
										</f:facet>
										<aon:div onmouseover="disableRowSelector();"
											onmouseout="enableRowSelector();" >																																	
											<aon:commandLink title="#{appBundle.cms_activate}" 
												actionListener="#{modularPageOption.onActivate}"
												reRender="#{dataTableId}"
												rendered="#{!to.active}">
												<aon:graphicImage alt="#{appBundle.cms_activate}"
													url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
											</aon:commandLink>
											<aon:commandLink title="#{appBundle.cms_deactivate}" 
												actionListener="#{modularPageOption.onDeactivate}" 
												reRender="#{dataTableId}"
												rendered="#{to.active}">
												<aon:graphicImage alt="#{appBundle.cms_deactivate}"
													url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
											</aon:commandLink>
										</aon:div>
									</aon:column>
		
									<aon:column styleClass="aon-width-80 aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{appBundle.cms_position}" />
										</f:facet>
										<aon:div onmouseover="disableRowSelector();"
											onmouseout="enableRowSelector();" >		
											<aon:commandLink id="moveUp" reRender="#{dataTableId}"
												title="#{appBundle.cms_move_up}" immediate="true"
												actionListener="#{modularPageOption.onMoveUp}" 
												styleClass="aon-margin-right"
												rendered="#{to.position != 0 and modularPageOption.to==null}">
												<aon:graphicImage alt="#{appBundle.cms_move_up}"
													url="#{aonResource.resolveLocal['/images/cms/up.gif']}" />
											</aon:commandLink>
											<aon:commandLink id="moveDown" reRender="#{dataTableId}"
												title="#{appBundle.cms_move_down}" immediate="true"
												actionListener="#{modularPageOption.onMoveDown}" 
												rendered="#{to.position &lt; (modularPageOption.model.rowCount - 1)  and modularPageOption.to==null}">
												<aon:graphicImage alt="#{appBundle.cms_move_down}"
													url="#{aonResource.resolveLocal['/images/cms/down.gif']}" />
											</aon:commandLink>
										</aon:div>
									</aon:column>
								</ui:define>
							</ui:decorate>

						</aon:div>
						
						<aon:div rendered="#{modularPageOption.new or modularPageOption.to != null}">

							<aon:div styleClass="aon-toolbar">
								<aon:div styleClass="aon-finding-toolbar-item-group">								
									<aon:commandButton id="reset_list_form"
										rendered="#{!modularPageOption.new and cms.roleEditor}"
										reRender="detail"
										value="#{bundle.aon_reset}"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}">
										<aon:actionListener method="#{modularPageOption.onReset}" />
									</aon:commandButton>
									<aon:commandButton id="save_list_form"
										value="#{bundle.aon_save}" 
										rendered="#{modularPageOption.to!=null or modularPageOption.new}"
										reRender="detail"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_save}">
										<aon:actionListener method="#{modularPageOption.accept}" />
									</aon:commandButton>
									<aon:commandButton id="cancel_list_form"
										value="#{bundle.aon_cancel}" 
										rendered="#{modularPageOption.to!=null or modularPageOption.new}" immediate="#{true}"
										reRender="detail"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}">
										<aon:actionListener method="#{modularPageOption.onCancel}" />
									</aon:commandButton>
									<aon:confirmButton id="remove_list_form"
										value="#{bundle.aon_remove}" 
										rendered="#{!modularPageOption.new and cms.roleEditor}" 
										immediate="true"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{modularPageOption.onRemove}" 
										reRender="detail"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
								</aon:div>
							</aon:div>
					
							<aon:div styleClass="aon-scroll-area">
								<aon:panelGrid id="sidebarOptionGrid" columns="2" dir="true">
	
									<aon:outputLabel for="ModularPageOption_alias"
										value="#{appBundle.cms_alias}" />
									<aon:inputText id="ModularPageOption_alias"
										required="true" size="32" maxlength="32"
										value="#{modularPageOption.to.alias}">
										<f:validator validatorId="AliasValidator" />
									</aon:inputText>
		
									<aon:outputLabel for="ModularPageOption_label"
										value="#{appBundle.cms_label}" />
									<aon:inputText id="ModularPageOption_label"
										required="true" size="50" maxlength="64"
										value="#{modularPageOption.toI18n.label}" />
		
									<aon:outputLabel for="ModularPageOption_type"
										value="#{bundle.aon_type}" />
									<aon:selectOneMenu id="ModularPageOption_type"  
										value="#{modularPageOption.to.type}" 
										required="true">
										<f:selectItems value="#{collections.modularPageOptionTypes}" />
										<a4j:support 
											event="onchange"  
											reRender="sidebarOptionGrid" />
									</aon:selectOneMenu> 
		
									<aon:outputLabel for="ModularPageOption_ident"
										value="#{appBundle.modular_page_option_ident}" 
										rendered="#{modularPageOption.visibleIdent}"/>
									<aon:selectOneMenu id="ModularPageOption_ident"
										rendered="#{modularPageOption.visibleIdent}" 
										value="#{modularPageOption.to.ident}">
										<f:selectItems value="#{modularPageOption.idents}" />
									</aon:selectOneMenu>
					
								</aon:panelGrid>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
			<ui:param name="logPanelTitle" value="#{menuBundle.cms_generate_pages}" />
		</ui:include>		
	</ui:define>

</ui:composition>

</body>
</html>
