<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
	
		<aon:form id="linkCategoryForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.link_category}" />
				<ui:param name="controller" value="#{linkCategory}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:param name="skipRemoveButton" value="#{!cms.roleEditor or controller.used}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="partial_generate" reRender="aonStatus"
						value="#{appBundle.aon_generate}" immediate="true"
						actionListener="#{generator.onGenerateCurrentLinkCategory}"
						rendered="#{linkCategory.to!=null and cms.roleEditor}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}">
						<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
					</aon:commandButton>					
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="LinkCategory_alias" style="width:100px"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="LinkCategory_alias"
						required="true" size="32" maxlength="32"
						value="#{linkCategory.to.alias}">
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>

					<aon:outputLabel for="LinkCategoryDetail_label"
						value="#{appBundle.cms_label}" />
					<aon:inputText id="LinkCategoryDetail_label"
						required="true" size="50" maxlength="64"
						value="#{linkCategory.toI18n.label}" />

					<aon:outputLabel for="LinkCategory_section"
						value="#{appBundle.cms_section}"/>
					<aon:selectOneMenu id="LinkCategory_section"  
						value="#{linkCategory.to.section}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="LinkCategory_position"
						value="#{appBundle.cms_position}"/>
					<aon:inputText id="LinkCategory_position"
						required="true" size="10" maxlength="8"
						value="#{linkCategory.to.position}" />
					
					<aon:outputLabel for="LinkCategory_active"
						value="#{appBundle.cms_active}"/>
					<aon:selectBooleanCheckbox id="LinkCategory_active" 
						value="#{linkCategory.to.active}" />
					
				</aon:panelGrid>
			</aon:div>
		
		</aon:form>
		<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
			<ui:param name="logPanelTitle" value="#{menuBundle.cms_generate_pages}" />
		</ui:include>		
	</ui:define>

</ui:composition>

</body>
</html>
