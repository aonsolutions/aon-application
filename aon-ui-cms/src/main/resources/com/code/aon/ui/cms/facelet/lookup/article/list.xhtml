<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{appBundle.cms_alias}" />
		</f:facet>
		<aon:outputText value="#{to.alias}"/>
	</aon:column>
	
	<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{appBundle.article_category}" />
		</f:facet>
		<aon:outputText value="#{to.articleCategory.alias}" />
	</aon:column>
	
	<aon:column styleClass="aon-width-80 aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{appBundle.article_publishDate}" />
		</f:facet>
		<aon:outputText value="#{to.publishDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>
	
	<aon:column styleClass="aon-width-80 aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{appBundle.article_expireDate}" />
		</f:facet>
		<aon:outputText value="#{to.expireDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

</ui:composition>
