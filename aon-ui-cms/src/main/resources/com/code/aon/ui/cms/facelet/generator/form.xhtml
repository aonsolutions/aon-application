<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="generatorForm">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_generate}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_editing}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="generate" reRender="aonStatus"
							value="#{appBundle.aon_generate}" immediate="true"
							actionListener="#{generatorApplication.onGenerate}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
						</aon:commandButton>
						<h:outputLink id="preview"
							value="#{generator.previewURL}" target="_blank"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance" > 
							<aon:outputText value="#{appBundle.cms_preview}"/>
						</h:outputLink>							
						<aon:commandButton id="publish_ok" reRender="aonStatus"
							value="#{appBundle.aon_publish}" immediate="true"
							actionListener="#{generator.onPublish}" 
							styleClass="aon-finding-toolbar-item aon-icon-file-upload">
							<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />							
						</aon:commandButton>
						<h:outputLink id="web_url" target="_blank"
							value="#{generator.webURL}" 
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance" >
							<aon:outputText value="#{appBundle.cms_view}"/>
						</h:outputLink>						
						<aon:commandButton id="home"
							value="#{bundle.aon_home}"
							action="home" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width:99%;">
				</aon:div>
			</aon:div>
			
		</aon:form>
		
		<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
			<ui:param name="logPanelTitle" value="#{menuBundle.cms_generate_pages}" />
		</ui:include>		

	</ui:define>
</ui:composition>

</body>
</html>
