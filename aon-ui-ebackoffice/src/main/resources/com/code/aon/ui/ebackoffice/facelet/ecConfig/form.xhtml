<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="configForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{ebackofficeBundle.aon_ebackoffice_ecconfig}" />
				<ui:param name="controller" value="#{ecconfig}" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSpin" value="true" />
				<ui:define name="beforeSpinToolbarContent">



				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">


				<aon:panel height="60"
					header="#{ebackofficeBundle.aon_ebackoffice_ecconfig_funtion_params}">

					<aon:panelTabSet switchType="ajax"
						selectedTab="#{ecconfig.selectedTab}">

						<aon:panelTab id="tab1"
							label="#{ebackofficeBundle.aon_ebackoffice_ecconfig_funtion}">

							<aon:panelGrid id="options" columns="2" style="width: 50%;">

								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_ecommerce_active}" />

								<aon:selectBooleanCheckbox
									value="#{ecconfig.to.ecommerceStatus}" />


								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_login}" />

								<aon:selectOneMenu value="#{ecconfig.to.showLogin}"
									style="width:130px">
									<f:selectItems value="#{ecconfig.loginTypes}" />
									<a4j:support event="onchange"
										actionListener="#{ecconfig.getLoginState}" reRender="options">
									</a4j:support>
								</aon:selectOneMenu>

								<aon:outputText rendered="#{ecconfig.ecParam}"
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_commerce}" />

								<aon:selectBooleanCheckbox disabled="#{ecconfig.login}" rendered="#{ecconfig.ecParam}"
									value="#{ecconfig.to.commerce}" />

								<aon:outputLabel for="Offer_series-New" rendered="#{ecconfig.ecParam}"
									value="#{bundle.aon_series}/#{bundle.aon_number}" />
								<aon:selectOneMenu id="Offer_series-New" rendered="#{ecconfig.ecParam}"
									value="#{ecconfig.to.series}" style="width:130px"
									valueChangeListener="#{offer.onSeriesChanged}">
									<f:selectItem itemLabel=" " itemValue="#{null}" />
									<f:selectItems value="#{configCollections.seriesIds}" />
								</aon:selectOneMenu>

								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_pricetype}" />

								<aon:selectOneMenu value="#{ecconfig.to.price}"
									style="width:130px">
									<f:selectItems value="#{ecconfig.priceTypes}" />
									<a4j:support event="onchange"
										actionListener="#{ecconfig.getShowPriceState}"
										reRender="options">
									</a4j:support>
								</aon:selectOneMenu>


								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_discount}" />

								<aon:selectOneMenu value="#{ecconfig.to.discount}"
									disabled="#{ecconfig.showPrice}" style="width:130px">
									<f:selectItems value="#{ecconfig.discountTypes}" />
								</aon:selectOneMenu>


								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_taxinprice}" />

								<aon:selectOneMenu value="#{ecconfig.to.taxInPrice}"
									disabled="#{ecconfig.showPrice}" style="width:130px">
									<f:selectItems value="#{ecconfig.taxPriceTypes}" />
								</aon:selectOneMenu>

								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_tariff}" />


								<aon:selectOneMenu value="#{ecconfig.to.tariff}"
									disabled="#{ecconfig.showPrice}" style="width:130px">
									<f:selectItem itemLabel=" " itemValue="#{null}" />
									<f:selectItems value="#{ecconfig.tariffs}" />
								</aon:selectOneMenu>
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_rowitems}" />

								<rich:inputNumberSpinner value="#{ecconfig.to.rowItems}"
									cycled="false" minValue="1" maxValue="3" style="width:130px">
								</rich:inputNumberSpinner>

								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_telephone}"
									style="width:130px" />
								<aon:inputText value="#{ecconfig.to.telephone}" maxlength="12"
									size="15" />

								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_email}"
									style="width:130px" />
								<aon:inputText value="#{ecconfig.to.email}" maxlength="40"
									size="30" />

								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_headercolor}" />
								<rich:colorPicker value="#{ecconfig.to.headerColor}">

								</rich:colorPicker>
							</aon:panelGrid>

						</aon:panelTab>

						<aon:panelTab id="tab2"
							label="#{ebackofficeBundle.aon_ebackoffice_ecconfig_design}">
							<aon:panelGrid id="Images" columns="2" style="width: 50%;">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_skin}" />

								<aon:selectOneMenu value="#{ecconfig.to.skin}">
									<f:selectItems value="#{ecconfig.skins}" />
								</aon:selectOneMenu>

								<!--		<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_headercolor}" /> 
						 	<rich:colorPicker  value="#{ecconfig.to.headerColor}"  >
							
								</rich:colorPicker> -->


								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_header}" />
								<aon:div id="header">
									<a4j:region>
										<aon:outputText
											value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_size2}" />
										<br />
										<c:if test="#{ecconfig.headerImage!=null}">
											<a4j:mediaOutput id="header_preview" element="img"
												cacheable="false" style="width:100px"
												value="#{ecconfig.headerImage.key}"
												createContent="#{ecconfig.paintHeader}" />

										</c:if>

										<c:if test="#{ecconfig.headerImage==null}">

											<h:graphicImage id="nophoto"
												style="width:100px; height: 100px;"
												value="/css/images/nophoto.gif" />

										</c:if>
										<h:panelGrid columns="2">
											<aon:fileUpload addControlLabel="Cambiar "
												stopControlLabel="#{bundle.aon_fileUpload_stop}"
												stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
												uploadControlLabel="#{bundle.aon_fileUpload_upload}"
												fileUploadListener="#{ecconfig.headerUploaded}"
												listWidth="0px" listHeight="0px" immediateUpload="true"
												autoclear="true">
												<f:facet name="label">
													<h:outputText value="Cambiar header" />
												</f:facet>
												<a4j:support event="onuploadcomplete" reRender="header" />
											</aon:fileUpload>

											<aon:commandButton value="borrar"
												styleClass=" aon-icon-remove" id="deleteImag1"
												actionListener="#{ecconfig.deleteHeader}" reRender="Images" />
										</h:panelGrid>
									</a4j:region>
								</aon:div>

								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_leftBanner}" />
								<aon:div id="leftBanner">
									<a4j:region>
									<aon:outputText
											value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_size1}" />
										<br />

										<c:if test="#{ecconfig.leftBanner!=null}">
											<a4j:mediaOutput id="bannerL_preview" element="img"
												cacheable="false" style="width:100px"
												value="#{ecconfig.leftBanner.key}"
												createContent="#{ecconfig.paintLeftBanner}" />

										</c:if>

										<c:if test="#{ecconfig.leftBanner==null}">

											<h:graphicImage id="nophoto2"
												style="width:100px; height: 100px;"
												value="/css/images/nophoto.gif" />

										</c:if>


										<h:panelGrid columns="2">
											<aon:fileUpload addControlLabel="Cambiar "
												stopControlLabel="#{bundle.aon_fileUpload_stop}"
												stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
												uploadControlLabel="#{bundle.aon_fileUpload_upload}"
												fileUploadListener="#{ecconfig.leftBannerUploaded}"
												listWidth="0px" listHeight="0px" immediateUpload="true"
												autoclear="true">
												<f:facet name="label">
													<h:outputText value="Cambiar header" />
												</f:facet>
												<a4j:support event="onuploadcomplete" reRender="leftBanner" />
											</aon:fileUpload>
											<aon:commandButton value="borrar"
												styleClass="aon-addImageButton"
												actionListener="#{ecconfig.deleteLeftBanner}"
												reRender="Images" />
										</h:panelGrid>
									</a4j:region>


								</aon:div>


								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_rightBanner}" />
								<aon:div id="rightBanner">
									<a4j:region>
								<aon:outputText
											value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_size1}" />
										<br />

										<c:if test="#{ecconfig.rightBanner!=null}">

											<a4j:mediaOutput id="bannerR_preview" element="img"
												cacheable="false" style="width:100px"
												value="#{ecconfig.rightBanner.key}"
												createContent="#{ecconfig.paintRightBanner}" />

										</c:if>

										<c:if test="#{ecconfig.rightBanner==null}">

											<h:graphicImage id="nophoto3"
												style="width:100px; height: 100px;"
												value="/css/images/nophoto.gif" />

										</c:if>


										<h:panelGrid columns="2">
											<aon:fileUpload addControlLabel="Cambiar "
												stopControlLabel="#{bundle.aon_fileUpload_stop}"
												stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
												uploadControlLabel="#{bundle.aon_fileUpload_upload}"
												fileUploadListener="#{ecconfig.rightBannerUploaded}"
												listWidth="0px" listHeight="0px" immediateUpload="true"
												autoclear="true">
												<f:facet name="label">
													<h:outputText value="Cambiar header" />
												</f:facet>
												<a4j:support event="onuploadcomplete" reRender="rightBanner" />
											</aon:fileUpload>
											<aon:commandButton value="borrar"
												styleClass=" aon-icon-remove" id="deleteImag3"
												actionListener="#{ecconfig.deleteRightBanner}"
												reRender="Images" />
										</h:panelGrid>
									</a4j:region>
								</aon:div>

								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_welcomeBanner}" />
								<aon:div id="welcomeBanner">
									<a4j:region>
										<c:if test="#{ecconfig.welcomeBanner!=null}">
											<a4j:mediaOutput id="bannerW_preview" element="img"
												cacheable="false" style="width:100px"
												value="#{ecconfig.welcomeBanner.key}"
												createContent="#{ecconfig.paintWelcomeBanner}" />
										</c:if>
										<c:if test="#{ecconfig.welcomeBanner==null}">

											<h:graphicImage id="nophoto4"
												style="width:100px; height: 100px;"
												value="/css/images/nophoto.gif" />

										</c:if>

										<h:panelGrid columns="2">
											<aon:fileUpload addControlLabel="Cambiar "
												stopControlLabel="#{bundle.aon_fileUpload_stop}"
												stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
												uploadControlLabel="#{bundle.aon_fileUpload_upload}"
												listWidth="0px"
												fileUploadListener="#{ecconfig.welcomeBannerUploaded}"
												listHeight="0px" immediateUpload="true" autoclear="true">
												<f:facet name="label">
													<h:outputText value="Cambiar header" />
												</f:facet>
												<a4j:support event="onuploadcomplete"
													reRender="welcomeBanner" />
											</aon:fileUpload>
											<aon:commandButton value="borrar"
												styleClass=" aon-icon-remove" id="deleteImag4"
												actionListener="#{ecconfig.deleteWelcomeBanner}"
												reRender="Images" />
										</h:panelGrid>
									</a4j:region>
								</aon:div>

							</aon:panelGrid>

						</aon:panelTab>


						<aon:panelTab id="tab3" style="height:300px" rendered="#{ecconfig.ecParam}"
							label="#{ebackofficeBundle.aon_ebackoffice_ecconfig_paymethod}">

							<aon:panel height="60" style="width: 50%;"
								header="#{ebackofficeBundle.aon_ebackoffice_ecconfig_paymethod}">
								<div align="right"><aon:commandButton
									value="Formas de pago" id="email" action="pmethod_list"
									styleClass="aon-finding-toolbar-item aon-icon-advanced-search">
								</aon:commandButton></div>

								<aon:panelGrid id="paymethods" columns="2" style="width: 50%;">



									<aon:outputText
										value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_paymethod_tarns}" />

									<aon:selectOneMenu value="#{ecconfig.to.bankTransfer}">
										<f:selectItem itemValue="#{null}" itemLabel=" " />
										<f:selectItems value="#{ecconfig.bankTransfers}" />
									</aon:selectOneMenu>

									<aon:outputText
										value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_paymethod_contra}" />

									<aon:selectOneMenu value="#{ecconfig.to.cashOnDelivery}">
										<f:selectItem itemValue="#{null}" itemLabel=" " />
										<f:selectItems value="#{ecconfig.cashOnDeliverys}" />
									</aon:selectOneMenu>

									<aon:outputText
										value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_paymethod_visa}" />

									<aon:selectOneMenu value="#{ecconfig.to.creditCard}">
										<f:selectItem itemValue="#{null}" itemLabel=" " />
										<f:selectItems value="#{ecconfig.creditCards}" />
									</aon:selectOneMenu>


									<aon:outputText
										value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_paymethod_paypal}" />

									<aon:selectOneMenu value="#{ecconfig.to.paypal}">
										<f:selectItem itemValue="#{null}" itemLabel=" " />
										<f:selectItems value="#{ecconfig.paypals}" />
									</aon:selectOneMenu>

									<aon:outputText
										value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_paymethod_giro}" />

									<aon:selectOneMenu value="#{ecconfig.to.bankDraft}">
										<f:selectItem itemValue="#{null}" itemLabel=" " />
										<f:selectItems value="#{ecconfig.bankDrafts}" />
									</aon:selectOneMenu>
								</aon:panelGrid>

							</aon:panel>

							<rich:spacer height="20">

							</rich:spacer>
							<aon:panel height="60" style="width: 50%;"
								header="#{ebackofficeBundle.aon_ebackoffice_ecconfig_shipping}">

								<aon:panelGrid columns="2" style="width: 50%;">

									<aon:outputText
										value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_shipping_costs}"
										style="width:130px" />
									<aon:inputText value="#{ecconfig.to.shippingCosts}" size="5">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:inputText>
									<aon:outputText
										value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_free_shipping}"
										style="width:130px" />
									<aon:inputText value="#{ecconfig.to.freeShipping}" size="5">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:inputText>
								</aon:panelGrid>

							</aon:panel>

						</aon:panelTab>


						<aon:panelTab id="tab4"
							label="#{ebackofficeBundle.aon_ebackoffice_ecconfig_note1}">
							<h:panelGrid columns="2">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_title}  "
									style="width:130px" />
								<aon:inputText value="#{ecconfig.to.noteTitle1}" maxlength="64"
									size="30" />
								<aon:outputLabel
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_richText}" />
								<aon:selectBooleanCheckbox id="richText"
									value="#{ecconfig.richTextEnabled}">
									<a4j:support ajaxSingle="true" event="onclick"
										reRender="editor" />
								</aon:selectBooleanCheckbox>
							</h:panelGrid>
							<rich:editor id="editor" height="280" width="640"
								viewMode="#{ecconfig.richTextEnabled?'source':'visual'}"
								language="#{facesContext.application.defaultLocale.language}"
								value="#{ecconfig.to.legalNote1}">
							</rich:editor>

						</aon:panelTab>

						<aon:panelTab id="tab5"
							label="#{ebackofficeBundle.aon_ebackoffice_ecconfig_note2}">

							<h:panelGrid columns="2">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_title}  "
									style="width:130px" />
								<aon:inputText value="#{ecconfig.to.noteTitle2}" maxlength="64"
									size="30" />
								<aon:outputLabel
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_richText}" />
								<aon:selectBooleanCheckbox id="richText2"
									value="#{ecconfig.richTextEnabled}">
									<a4j:support ajaxSingle="true" event="onclick"
										reRender="editor2" />
								</aon:selectBooleanCheckbox>
							</h:panelGrid>
							<rich:editor id="editor2" height="280" width="640"
								viewMode="#{ecconfig.richTextEnabled?'source':'visual'}"
								language="#{facesContext.application.defaultLocale.language}"
								value="#{ecconfig.to.legalNote2}">

							</rich:editor>
						</aon:panelTab>

						<aon:panelTab id="tab6"
							label="#{ebackofficeBundle.aon_ebackoffice_ecconfig_note3}">

							<h:panelGrid columns="2">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_title}  "
									style="width:130px" />
								<aon:inputText value="#{ecconfig.to.noteTitle3}" maxlength="64"
									size="30" />
								<aon:outputLabel
									value="#{ebackofficeBundle.aon_ebackoffice_ecconfig_richText}" />
								<aon:selectBooleanCheckbox id="richText3"
									value="#{ecconfig.richTextEnabled}">
									<a4j:support ajaxSingle="true" event="onclick"
										reRender="editor3" />
								</aon:selectBooleanCheckbox>
							</h:panelGrid>
							<rich:editor id="editor3" height="280" width="640"
								viewMode="#{ecconfig.richTextEnabled?'source':'visual'}"
								language="#{facesContext.application.defaultLocale.language}"
								value="#{ecconfig.to.legalNote3}">
							</rich:editor>
						</aon:panelTab>

						<aon:panelTab id="tab7"
							label="#{ebackofficeBundle.aon_ebackoffice_ecconfig_catalogues}">

							<aon:editDataTable id="activeCatalogues" var="to" rows="50"
								style="width:40%" value="#{eccatalogue.model}"
								columnClasses="aon-editDataTable-iconColumn,aon-editDataTable-textColumn,aon-editDataTable-numberColumn,aon-editDataTable-numberColumn,aon-editDataTable-iconColumn,aon-editDataTable-buttonsColumn">

								<aon:rowSelector toggleOnClick="#{eccatalogue.to == null}"
									actionListener="#{eccatalogue.onSelect}" />

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:commandButton id="Table-select"
										actionListener="#{eccatalogue.onSelect}"
										rendered="#{to!=eccatalogue.to}"
										styleClass="aon-editDataTable-button aon-icon-rowSelector" />

								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputLabel
											value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_catalogue}" />
									</f:facet>
									<aon:outputText value="#{to.catalogue.name}" size="40" />

								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputLabel
											value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_start}" />
									</f:facet>

									<aon:outputText value="#{to.catalogue.startDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>

								</aon:column>
								<aon:column>
									<f:facet name="header">
										<aon:outputLabel
											value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_ends}" />
									</f:facet>
									<aon:outputText value="#{to.catalogue.endDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>

								</aon:column>



								<aon:column>
									<f:facet name="header">
										<aon:outputText
											value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_visible}" />
									</f:facet>
									<aon:outputText value="&#160;" style="align:center;"
										styleClass="#{(to.visible)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}"
										rendered="#{to!=eccatalogue.to}" />
									<aon:selectBooleanCheckbox rendered="#{to==eccatalogue.to}"
										value="#{eccatalogue.to.visible}" />
