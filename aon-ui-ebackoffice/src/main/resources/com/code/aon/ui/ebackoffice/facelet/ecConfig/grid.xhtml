<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="ectargetGrid">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="MNTO" />
					<ui:param name="controller" value="#{ecconfig}" />

				</ui:include>

				<!-- region-body -->
				<aon:div styleClass="aon-scroll-area">

					<aon:editDataTable id="ecconfigData" var="to" rows="20"
						rendered="#{(ecconfig.model.rowCount > 0) or (ecconfig.new)}"
						value="#{ecconfig.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-width-150, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

						<aon:rowSelector toggleOnClick="#{ecconfig.to == null}"
							actionListener="#{ecconfig.onSelect}" />

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:commandButton id="balanceDetailTable-select"
								actionListener="#{ecconfig.onSelect}"
								rendered="#{to!=ecconfig.to}"
								styleClass="aon-editDataTable-button aon-icon-rowSelector" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{ecconfig.onReset}" value=""
										rendered="#{!ecconfig.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>


						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.id}" rendered="#{to!=ecconfig.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==ecconfig.to}" size="2" value="#{ecconfig.to.id}"
								maxlength="2" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true" 
									rendered="#{ecconfig.new}" size="2" value="#{ecconfig.to.id}"
									maxlength="2" />
							</f:facet>
						</aon:column>

					
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=ecconfig.to}">&#160;</f:verbatim>
								<aon:commandButton title="[#{bundle.aon_accept}]"
									rendered="#{to==ecconfig.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{ecconfig.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==ecconfig.to}"
									actionListener="#{ecconfig.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton id="remove-Porcentaje"
									title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==ecconfig.to}"
									confirmTitle="#{bundle.aon_confirm_title}"
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{ecconfig.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									
									<aon:commandButton title="[#{bundle.aon_accept}]"
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{ecconfig.new}"
										actionListener="#{ecconfig.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton id="cancel-Porcentaje"
										title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{ecconfig.new}"
										confirmTitle="#{bundle.aon_confirm_title}"
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{ecconfig.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>


					</aon:editDataTable>
					<aon:dataScroller2 for="ecconfigData" />
				</aon:div>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
	</ui:define>
</ui:composition>
