<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="favoriteForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.google_drive}" />
				<ui:param name="controller" value="#{googleDrive}" />

				<ui:param name="formNew" value="#{true}" />
				<ui:param name="skipEditTo" value="#{false}" />

			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">

					<aon:outputLabel for="File_description"
						value="#{bundle.aon_title}" />
					<aon:inputText id="File_description" maxlength="128" size="100"
						value="#{googleDrive.upload.description}" />

					<!-- <aon:outputLabel for="File_url" value="#{bundle.favorite_url}" />
					<aon:inputText id="Favorite_url" maxlength="128" size="100"
						value="#{googleDrive.upload.url}" />
					-->
					<!--  aon:outputLabel for="Favorite_favoriteCategory_id"
						value="#{bundle.aon_category}" />
					<aon:selectOneMenu id="Favorite_favoriteCategory_id"
						value="#{favorite.to.favoriteCategory}" required="#{true}">
						<f:selectItems value="#{groupWareCollections.favoriteCategories}" />
					</aon:selectOneMenu-->

					<aon:outputLabel for="attachFile"
						value="#{bundle.aon_fileupload_element}" />
					<aon:div id="#{googleDrive.beanName}_attachFileDiv">
						<a4j:region>
							<aon:fileUpload id="attachFile"
								fileUploadListener="#{googleDrive.fileUploaded}">
								<f:facet name="label">
									<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
								</f:facet>
								<a4j:support event="onuploadcomplete"
									reRender="#{googleDrive.beanName}_attachFileDiv" />
								<a4j:support event="onupload"
									oncomplete="showFileUploadProgress();" />
								<a4j:support event="onclear"
									oncomplete="hideFileUploadProgress();" />
							</aon:fileUpload>
							<rich:jQuery name="showFileUploadProgress" timing="onJScall"
								selector="#attachFile .rich-fileupload-list-overflow"
								query="height(70);" />
							<rich:jQuery name="hideFileUploadProgress" timing="onJScall"
								selector="#attachFile .rich-fileupload-list-overflow"
								query="height(0);" />
						</a4j:region>
					</aon:div>

				</aon:panelGrid>

			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
