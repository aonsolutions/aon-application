<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<meta name="gwt:property" content="locale=es_ES" />

	<aon:valueParam name="gwtDomain" default="#{domainSwitcher.domainId}" />
	<aon:valueParam name="gwtDomainName" default="#{domainSwitcher.domainNameURL}" />

	<script type="text/javascript">
        //<![CDATA[
        var search = "/#{module}.nocache.js";
        var scripts = document.getElementsByTagName("script");
        for (var i = 0; i < scripts.length; ++i) {
                var script = scripts[i];
                if (script.src != null && script.src.indexOf(search) != -1) {
                        var parent = script.parentNode;
                        parent.removeChild(script);
                        break;
                }
        }
        
        function getCurrentDomain() {
        	return #{gwtDomain};
        }
        function getCurrentDomainName() {
        	return "#{gwtDomainName}"
        }
        
        //]]>
    </script>


	<script type="text/javascript"
		src="#{module}/#{module}.nocache.js?silent=true" />

	<script type="text/javascript">
		//<![CDATA[ 
				#{module}.onInjectionDone('#{module}');
		//]]>
	</script>


</ui:composition>
