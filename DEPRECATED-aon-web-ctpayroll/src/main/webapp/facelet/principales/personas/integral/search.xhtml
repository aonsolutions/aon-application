<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"

<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

						value="#{appBundle.aon_payroll_pricipales_personas_apellido2}" />
					<aon:inputText id="Persona_apellido2" 
						valueChangeListener="#{persona.addExpression}"/>

						value="#{appBundle.aon_payroll_pricipales_personas_nombre}" />

						valueChangeListener="#{persona.addExpression}"/>

			 
		    	</ui:define>

	</ui:define>
