<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="trabajadorForm">

					<!-- 
						<ui:include
						src="/facelet/templates/formPrintToolbar.xhtml">
					-->
					<ui:include
						src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
						<ui:param name="toolbarTitle" 
							value="#{menuBundle.principales_personas__integral_per}" />
						<ui:param name="controller"	value="#{trabajador}" />
							
						<aon:methodParam name="backAction" value="integralTrab_form" />
						<aon:methodParam name="cancelAction" value="integralTrab_form" />
							
					</ui:include>
					
					<!--	FIN HEADER & TOOLBAR	-->
					
					<aon:div id="trabajadorData" styleClass="aon-scroll-area">
					
					<aon:panelGrid columns="2" dir="true" width="100%">
					
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_cod_persona}" />
						<aon:outputText value="#{trabajador.to.persona.cdg}"  disabled="#{true}" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_cod_trab}" />
						<aon:outputText value="#{trabajador.to.cdg}" disabled="#{true}" />
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_cod_trab_bbx}" />
						<aon:inputText value="#{trabajador.to.codnsz}" />

						<aon:outputLabel 
							value="#{appBundle.aon_payroll_principales_trabajador_fecalta}" />
						<aon:selectInputDate id="fecha_alta" renderAsPopup="true" required="#{true}"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{trabajador.to.fecalt}" enableManualInput="true" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_fecbaja}" />
						<aon:selectInputDate renderAsPopup="true"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{trabajador.to.fecbaj}" enableManualInput="true" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_datos_trab}" />
						<aon:div>
							<aon:outputText value="#{trabajador.to.persona.nombre} " />
							<aon:outputText value="#{trabajador.to.persona.descripcion} " />
							<aon:outputText value="#{trabajador.to.persona.apellido2}" />
						</aon:div>

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_empresa}" />
						<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="empresa_cdg" required="#{true}"  
							    lookupChangeListener="#{trabajador.onCompanyChanged}" ajaxSingle="false"
								lookup="#{empresaLookup}" reRender="empresa_descripcion,trabajadorForm"
								value="#{trabajador.to.empresa.cdg}" size="5">
							</aon:lookupInputText>
							<aon:lookupButton id="empresa_lookup" 
								windowTitle="#{appBundle.aon_payroll_principales_trabajador_empresa}"
								selectReRender="empresa_cdg,empresa_descripcion,trabajadorForm"
								lookupChangeListener="#{trabajador.onCompanyChanged}"
								lookup="#{empresaLookup}" minHeight="440"
								property="#{trabajador.to.empresa}" actionType="search" >
							</aon:lookupButton>
							<aon:inputText id="empresa_descripcion"
							 lookupChangeListener="#{trabajador.onCompanyChanged}"
								value="#{(trabajador.to.empresa.descripcion!=null)?(trabajador.to.empresa.descripcion):('')}"
								size="45" disabled="true" />
						</a4j:region>
						</aon:div>	
						

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_activ}" />
						<aon:div styleClass="aon-lookup">
							<aon:lookupInputText id="actividad_cdg" required="#{true}" controllerListener="#{empresaLookUpListener}"
								lookup="#{actividadLookup}" reRender="actividad_descripcion"
								value="#{trabajador.to.actividad.cdg}" size="5">
							</aon:lookupInputText>
							<aon:lookupButton id="actividad_lookup" controllerListener="#{empresaLookUpListener}"
								windowTitle="#{appBundle.aon_payroll_principales_trabajador_activ}"
								selectReRender="actividad_cdg,actividad_descripcion"
								lookup="#{actividadLookup}" minHeight="440"
								property="#{trabajador.to.actividad}">
							</aon:lookupButton>
							<aon:inputText id="actividad_descripcion"
								value="#{(trabajador.to.actividad.descripcion!=null)?(trabajador.to.actividad.descripcion):('')}"
								size="45" disabled="true" />
						</aon:div>

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_centro_trab}" />
						<aon:div styleClass="aon-lookup">
							
								<aon:lookupInputText id="domicilio_cdg" required="#{true}"
									lookup="#{domicilioLookup}" reRender="domicilio_descripcion"
									value="#{trabajador.domicilio.cdg}" size="5">
									<!-- 
									<a4j:support event="onchange" reRender="admon_lookup, provincia_lookup" >
										<aon:actionListener method="#{impresos11x.setDefaultAdmon}" />
										<aon:actionListener method="#{impresos11x.setDefaultProvincia}" />
									</a4j:support>
									 -->
								</aon:lookupInputText>
								<aon:lookupButton id="domicilio_lookup"
									windowTitle="#{appBundle.aon_payroll_principales_trabajador_centro_trab}"
									selectReRender="domicilio_cdg,domicilio_descripcion"
									lookup="#{domicilioLookup}" minHeight="440"
									property="#{trabajador.domicilio}">
								</aon:lookupButton>
								<aon:inputText id="domicilio_descripcion"
									value="#{(trabajador.domicilio.nomvia!=null)?(trabajador.domicilio.nomvia):('')}"
									size="45" disabled="true" />
						
						</aon:div>
							
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_centro_coste}" />
						<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="emprccos_cdg"  controllerListener="#{actividadLookUpListener}"
									lookup="#{emprccosLookup}" reRender="emprccos_descripcion"
									value="#{trabajador.to.emprccos.cdg}" size="5">
									<!-- 
									<a4j:support event="onchange" reRender="admon_lookup, provincia_lookup" >
										<aon:actionListener method="#{impresos11x.setDefaultAdmon}" />
										<aon:actionListener method="#{impresos11x.setDefaultProvincia}" />
									</a4j:support>
									 -->
								</aon:lookupInputText>
								<aon:lookupButton id="emprccos_lookup" controllerListener="#{actividadLookUpListener}"
									windowTitle="#{appBundle.aon_payroll_principales_trabajador_centro_coste}"
									selectReRender="emprccos_cdg,emprccos_descripcion"
									lookup="#{emprccosLookup}" minHeight="440"
									property="#{trabajador.to.emprccos}">
								</aon:lookupButton>
								<aon:inputText id="emprccos_descripcion"
									value="#{(trabajador.to.emprccos.descripcion!=null)?(trabajador.to.emprccos.descripcion):('')}"
									size="45" disabled="true" />
							
						</aon:div>

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_cuenta_coti}" />
						<aon:selectOneRadio id="cuenta_cotizacion" required="#{true}"
							value="#{trabajador.to.emprccc.id.tipccc}" >
							<f:selectItems value="#{emprccc.listatipos}" />
						</aon:selectOneRadio>
												
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_tipo_contr_agr}" />
						<aon:selectOneRadio value="#{trabajador.to.indagrario}" >
							<f:selectItems value="#{trabajador.listaIndiceAgrario}" />
						</aon:selectOneRadio>

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_artista}" />
						<aon:selectOneRadio value="#{trabajador.to.indgrupo}" >
							<f:selectItems value="#{trabajador.listaIndiceGrupo}" />
						</aon:selectOneRadio>

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_pariente_grado}" />
						<aon:selectBooleanCheckbox value="#{trabajador.to.pariente}" />
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_contr_temp}" />
						<aon:selectBooleanCheckbox value="#{trabajador.to.contrTemp}" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_mas65}" />
						<aon:selectBooleanCheckbox value="#{trabajador.to.mayor65}" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajador_insertado_fich_afi}" />
						<aon:selectBooleanCheckbox value="#{trabajador.to.afi}" />
						
					</aon:panelGrid>
				</aon:div>
				</aon:form>
				
				<aon:lookupButtonPopup lookup="#{empresaLookup}" />
				<aon:lookupButtonPopup lookup="#{actividadLookup}" />
				<aon:lookupButtonPopup lookup="#{domicilioLookup}" />
				<aon:lookupButtonPopup lookup="#{emprccosLookup}" />
				
			</ui:define>
		</ui:composition>
	</body>
</html>
