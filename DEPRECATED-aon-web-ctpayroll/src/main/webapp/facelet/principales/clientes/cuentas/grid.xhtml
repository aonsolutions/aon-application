<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
        xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">

<aon:div id="cuentasDataDiv">

	<aon:editDataTable id="cuentasData" var="to" rows="20"
						rendered="#{(cuenta.model.rowCount > 0) or (cuenta.new)}" value="#{cuenta.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
								
					<!-- 	<aon:rowSelector action="cuenta_form"
							actionListener="#{cuenta.onSelect}" /> -->
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							
								<aon:div>
									<h:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-rowSelector "
										actionListener="#{cuenta.onSelect}" action="cuenta_form"
										
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{cuenta.onReset}" action="cuenta_form"
										rendered="#{!cuenta.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_cuenta_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.cdg}"  />
							
						</aon:column>
						
						
						<aon:column  >
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_cuenta_entidad_nom}" />
							</f:facet>
							<aon:outputText value="#{to.entidad.description}"  />
							
						</aon:column>
						
						
								<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_cuenta_entidad}" />
							</f:facet>
							<aon:outputText value="#{to.entidad.cdg}"  />
							
						</aon:column>
						
								<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_cuenta_sucursal}" />
							</f:facet>
							<aon:outputText value="#{to.sucursal.id.cdg}"  />
							
						</aon:column>
						
								<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_cuenta_dc}" />
							</f:facet>
							<aon:outputText value="#{to.dc}"  />
							
						</aon:column>
						
								<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_cuenta_numcta}" />
							</f:facet>
							<aon:outputText value="#{to.numcta}"  />
							
						</aon:column>
						
						
						
						
						
					</aon:editDataTable>
					<aon:dataScroller2 for="cuentasData" showNote="true" />
	
</aon:div>

</ui:composition>
