<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

<aon:div id="tipcuentasasigDataDiv">

		
				<aon:editDataTable id="tipcuentasasigData" var="to" rows="5"
					
					
					value="#{tipcuenta.model}"
					columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

					 	<aon:rowSelector 
							actionListener="#{tipcuenta.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>

					
						<f:facet name="footer">

					<aon:commandButton alt="[#{bundle.aon_reset}]"	
						styleClass="aon-editDataTable-button aon-icon-reset"
						actionListener="#{tipcuenta.onReset}" />

				</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.cdg}" />

                 <f:facet name="footer">
          <aon:div rendered="#{tipcuenta.new}">
					
			<aon:div styleClass="aon-lookup">
				<aon:lookupInputText id="Cuenta_cdg" lookup="#{cuentaLookup}"
					reRender="Cuenta_description" value="#{tipcuenta.to.cuenta.cdg}"
					size="3">
				</aon:lookupInputText>
				<aon:lookupButton id="Cuenta_lookup"
					windowTitle="#{appBundle.aon_payroll_principales_tipodomcilio_domicilio}"
					selectReRender="Cuenta_cdg,Cuenta_description"
					lookup="#{cuentaLookup}" minHeight="440"
					property="#{tipcuenta.to.cuenta}">
				</aon:lookupButton>
			   <aon:inputText id="Cuenta_description"
					value="#{(tipcuenta.to.cuenta.entidad.description!=null)?(tipcuenta.to.cuenta.entidad.description):('')}"
					size="35" disabled="true" />
			</aon:div>
			</aon:div>

				</f:facet>

					</aon:column>


					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_cuenta_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.cuenta.cdg}" />

					</aon:column>


					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_cuenta_entidad_nom}" />
						</f:facet>
						<aon:outputText value="#{to.cuenta.entidad.cdg} #{to.cuenta.sucursal.id.cdg} #{to.cuenta.dc} #{to.cuenta.numcta}"   />

					</aon:column>


					
					
					<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_principales_clientes_ssbanco}" />
				</f:facet>

				<aon:outputText
					value="#{to.cuenta.entidad.description} #{to.cuenta.sucursal.domsuc}  #{to.cuenta.sucursal.munsuc}  #{to.cuenta.sucursal.cpsuc} "
					disabled="true" size="50" maxlength="20" />

			
			</aon:column>
				<rich:column   filterBy="#{to.tipcta}" filterEvent="onkeyup">
				<f:facet name="header">
					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_tipocuenta}" />
				</f:facet>
				<aon:outputText value="#{to.tipcta}" rendered="#{to!=tipcuenta.to}"
					disabled="true" size="50" maxlength="20" />


				<aon:selectOneMenu id="Tipoctas" value="#{tipcuenta.to.tipcta}"
					rendered="#{to==tipcuenta.to}">
					<f:selectItem value="#{null}" itemLabel=" -  " />
					<f:selectItems value="#{tipcuenta.listaTipos}" />
				</aon:selectOneMenu>

				<f:facet name="footer">

					<aon:selectOneMenu id="Tipoctas2" value="#{tipcuenta.to.tipcta}"
						rendered="#{tipcuenta.new}" >
						<f:selectItem value="#{null}" itemLabel=" -  " />
						<f:selectItems value="#{tipcuenta.listaTipos}" />
					</aon:selectOneMenu>
				
				</f:facet>
				
			</rich:column>
						
						<aon:column>

				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>

				<aon:commandButton title="[#{bundle.aon_accept}]"
							rendered="#{to==tipcuenta.to}"
							styleClass="aon-editDataTable-button aon-icon-accept"
							actionListener="#{tipcuenta.onAccept}" reRender="tabsInfo"
							accesskey="#{bundle.aon_key_save_line}" />
					<!--  	<aon:commandButton title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{to==tipcuenta.to}"
							actionListener="#{tipcuenta.onCancel}" immediate="true" reRender="datos"
							accesskey="#{bundle.aon_key_cancel_line}" /> -->
						<aon:confirmButton id="remove-Porcentaje"
							title="[#{bundle.aon_remove}]" reRender="tabsInfo"
							styleClass="aon-editDataTable-button aon-icon-delete"
							rendered="#{to==tipcuenta.to}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{tipcuenta.onRemove}" immediate="true"
							accesskey="#{bundle.aon_key_remove_line}" />
					</aon:column>
						<f:facet name="footer">
	
              	  <aon:commandButton id="asignardom" rendered="#{tipcuenta.new}"
				 	styleClass="aon-editDataTable-button aon-icon-accept"  reRender="tabsInfo"
					action="integral_form" actionListener="#{tipcuenta.onAccept}" />
			
 
					<aon:commandButton id="cancel-tipdomi"
						title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{tipcuenta.new}"						
						actionListener="#{tipcuenta.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
  
				</f:facet>
					
					
				</aon:editDataTable>
		<!-- 
				<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_tipocuenta_ver}    " />
				<aon:selectOneMenu id="TipoCta" valueChangeListener="#{tipcuenta.typeChanged}">
                <a4j:support event="onchange" reRender="typeChanged" />
					<f:selectItem value="#{null}" itemLabel=" -  " />
					<f:selectItems value="#{tipcuenta.listaTipos}" />
				</aon:selectOneMenu>
				 -->
		
			
	
		<aon:dataScroller2 for="tipcuentasasigData" showNote="true" />

	</aon:div>

</ui:composition>
