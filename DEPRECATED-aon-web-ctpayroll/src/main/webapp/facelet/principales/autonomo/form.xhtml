				,aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				,aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				,aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">

							<aon:rowSelector toggleOnClick="#{autbase.to == null}"
								actionListener="#{autbase.onSelect}" />


							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:outputText value="&#160;" />
								<f:facet name="footer">
									<aon:div>
										<aon:commandButton alt="[#{bundle.aon_reset}]"
											styleClass="aon-editDataTable-button aon-icon-reset"
											actionListener="#{autbase.onReset}" value=""
											rendered="#{!autbase.new}"
											accesskey="#{bundle.aon_key_new_line}" />
									</aon:div>

								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_principales_autonomos_fecini}" />
								</f:facet>
								<aon:outputText value="#{to.id.fecini}"
									rendered="#{to!=autbase.to}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:selectInputDate value="#{autbase.to.id.fecini}"
									inputSize="10" rendered="#{to==autbase.to}"
									disabled="#{to==autbase.to}" renderAsPopup="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
								<f:facet name="footer">
									<aon:selectInputDate value="#{autbase.to.id.fecini}"
										rendered="#{autbase.new}" inputSize="10" renderAsPopup="true"
										popupDateFormat="#{bundle.aon_date_pattern}">
									</aon:selectInputDate>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_principales_autonomos_fecfin}" />
								</f:facet>
								<aon:outputText value="#{to.fecfin}"
									rendered="#{to!=autbase.to}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:selectInputDate value="#{autbase.to.fecfin}"
									rendered="#{to==autbase.to}" inputSize="10"
									renderAsPopup="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
								<f:facet name="footer">
									<aon:selectInputDate value="#{autbase.to.fecfin}"
										rendered="#{autbase.new}" inputSize="10" renderAsPopup="true"
										popupDateFormat="#{bundle.aon_date_pattern}">
									</aon:selectInputDate>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_principales_autonomos_base}" />
								</f:facet>
								<aon:outputText value="#{to.base}" rendered="#{to!=autbase.to}">
									<f:convertNumber type="number" minFractionDigits="2"
										pattern="###,###.###" />
								</aon:outputText>

								<aon:inputText styleClass="aon-form-input-text " required="true"
									rendered="#{to==autbase.to}" size="5"
									value="#{autbase.to.base}" maxlength="10" />
								<f:facet name="footer">
									<aon:inputText styleClass="aon-form-input-text" required="true"
										rendered="#{autbase.new}" size="5" value="#{autbase.to.base}"
										maxlength="10" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_principales_autonomos_cuo}" />
								</f:facet>
								<aon:outputText value="#{to.cuota}" rendered="#{to!=autbase.to}">
									<f:convertNumber type="number" minFractionDigits="2"
										pattern="###,###.###" />
								</aon:outputText>
								<aon:inputText styleClass="aon-form-input-text " required="true"
									rendered="#{to==autbase.to}" size="5"
									value="#{autbase.to.cuota}" maxlength="10" />
								<f:facet name="footer">
									<aon:inputText styleClass="aon-form-input-text" required="true"
										rendered="#{autbase.new}" size="20" value="#{autbase.to.cuota}"
										maxlength="10" />
								</f:facet>
							</aon:column>









							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:div>
									<f:verbatim rendered="#{to!=autbase.to}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]"
										rendered="#{to==autbase.to}"
										styleClass="aon-editDataTable-button aon-icon-accept"
										actionListener="#{autbase.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:commandButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{to==autbase.to}"
										actionListener="#{autbase.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
									<aon:confirmButton id="remove-Porcentaje"
										title="[#{bundle.aon_remove}]"
										styleClass="aon-editDataTable-button aon-icon-delete"
										rendered="#{to==autbase.to}"
										confirmTitle="#{bundle.aon_confirm_title}"
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{autbase.onRemove}" immediate="true"
										accesskey="#{bundle.aon_key_remove_line}" />
								</aon:div>
								<f:facet name="footer">
									<aon:div>
										<f:verbatim rendered="#{!autbase.new}">&#160;</f:verbatim>
										<aon:commandButton title="[#{bundle.aon_accept}]"
											styleClass="aon-editDataTable-button aon-icon-accept"
											rendered="#{autbase.new}"
											actionListener="#{autbase.onAccept}"
											accesskey="#{bundle.aon_key_save_line}" />
										<aon:confirmButton id="cancel-Porcentaje"
											title="[#{bundle.aon_cancel}]"
											styleClass="aon-editDataTable-button aon-icon-cancel"
											rendered="#{autbase.new}"
											confirmTitle="#{bundle.aon_confirm_title}"
											confirmMessage="#{bundle.aon_cancel_confirm}"
											confirmActionListener="#{autbase.onCancel}" immediate="true"
											accesskey="#{bundle.aon_key_cancel_line}" />
									</aon:div>
								</f:facet>
							</aon:column>

						</aon:editDataTable>
					</aon:div>




				</rich:tab>


			</rich:tabPanel>
			</aon:div>


		</aon:form>
		<aon:lookupButtonPopup lookup="#{personaLookup}" />
		<aon:lookupButtonPopup lookup="#{mutuaLookup}" />
		<aon:lookupButtonPopup lookup="#{sucursalLookup}" />
		<aon:lookupButtonPopup lookup="#{entidadLookup}" />
		<aon:lookupButtonPopup lookup="#{paisLookup}" />
		<aon:lookupButtonPopup lookup="#{tipoviaLookup}" />
		<aon:lookupButtonPopup lookup="#{provinciaLookup}" />
	</ui:define>
</ui:composition>
