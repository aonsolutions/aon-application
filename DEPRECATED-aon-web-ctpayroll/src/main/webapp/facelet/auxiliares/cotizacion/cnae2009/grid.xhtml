<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="cnae2009Data" value="#{cnae2009.model}" 
			var="to" rows="0"
			rendered="#{(cnae2009.model.rowCount >= 0) or (cnae2009.new)}"
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{cnae2009.to == null}" actionListener="#{cnae2009.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{cnae2009.onReset}" value=""
							rendered="#{!cnae2009.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_fecini}" />
				</f:facet>
				<aon:outputText value="#{to.id.fecini}" rendered="#{to!=cnae2009.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{cnae2009.to.id.fecini}" id="FechaInicio"
					rendered="#{to==cnae2009.to}" disabled="#{to==cnae2009.to}" required="true"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{cnae2009.to.id.fecini}" id="FechaInicioNew"
						rendered="#{cnae2009.new}" required="true"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_fecfin}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}" rendered="#{to!=cnae2009.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{cnae2009.to.fecfin}" id="FechaFin"
					rendered="#{to==cnae2009.to}" required="true"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{cnae2009.to.fecfin}" id="FechaFinNew"
						rendered="#{cnae2009.new}" 
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pctit}" />
				</f:facet>
				<aon:outputText value="#{to.pctit}" rendered="#{to!=cnae2009.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<aon:inputText id="cnae2009_pctit_edit" styleClass="aon-form-input-text"
					rendered="#{to==cnae2009.to}" required="true"
					value="#{cnae2009.to.pctit}" maxlength="8" size="10" >
					<f:validator validatorId="porcentajeValidator" />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="cnae2009_pctit_new" styleClass="aon-form-input-text"  
						rendered="#{cnae2009.new}" required="true"
						value="#{cnae2009.to.pctit}" maxlength="8" size="10"  >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pctims}" />
				</f:facet>
				<aon:outputText value="#{to.pctims}" rendered="#{to!=cnae2009.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<aon:inputText id="cnae2009_pctims_edit" styleClass="aon-form-input-text"
					rendered="#{to==cnae2009.to}" required="true"
					value="#{cnae2009.to.pctims}" maxlength="8" size="10" >
					<f:validator validatorId="porcentajeValidator" />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="cnae2009_pctims_new" styleClass="aon-form-input-text"  
						rendered="#{cnae2009.new}" required="true"
						value="#{cnae2009.to.pctims}" maxlength="8" size="10"  >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pcttotal}" />
				</f:facet>
				<aon:outputText value="#{to.pcttotal}" rendered="#{to!=cnae2009.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<!-- aon:inputText id="cnae2009_pcttotal_edit" styleClass="aon-form-input-text"
					rendered="#{to==cnae2009.to}" required="true"
					value="#{cnae2009.to.pcttotal}" maxlength="8" size="10" >
					<f:validator validatorId="porcentajeValidator" />
				</aon:inputText-->
				<f:facet name="footer">
					<!-- aon:inputText id="cnae2009_pcttotal_new" styleClass="aon-form-input-text"  
						rendered="#{cnae2009.new}" required="true"
						value="#{cnae2009.to.pcttotal}" maxlength="8" size="10"  >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText-->
				</f:facet>
			</aon:column>

			

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=cnae2009.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==cnae2009.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{cnae2009.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==cnae2009.to}"
						actionListener="#{cnae2009.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-cnae2009" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==cnae2009.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{cnae2009.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!cnae2009.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{cnae2009.new}"
							actionListener="#{cnae2009.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-cnae2009" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{cnae2009.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{cnae2009.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
	</aon:div>

</ui:composition>
