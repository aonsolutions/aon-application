<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		
		<aon:editDataTable id="ocupacionesCnaeData" value="#{cnaeMaestro.ocupacionesModel}" 
			var="to" rows="0"
			
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-textColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				, aon-editDataTable-numberColumn
				, aon-editDataTable-buttonsColumn">
					
			<!--
			<aon:rowSelector toggleOnClick="#{cnaeMaestro.ocupacionesController.to == null}" 
				actionListener="#{cnaeMaestro.ocupacionesController.onSelect}" />
			-->

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{cnaeMaestro.onOcupacionAdd}" value=""
							rendered="#{!cnaeMaestro.ocupacionesController.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
				</f:facet>
				<aon:outputText value="#{to.id.cdg}" rendered="#{to!=cnaeMaestro.to}" />
				<f:facet name="footer">
					<!--  
					<aon:selectOneMenu value="#{null}" >	
						<f:selectItems value="#{cnaeMaestro.listaOcupaciones}"/>											
					</aon:selectOneMenu>
					-->
				</f:facet>
			</aon:column>
			 
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pctit}" />
				</f:facet>
				<aon:outputText value="#{to.pctit}" rendered="#{to!=cnaeMaestro.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				
				<f:facet name="footer">
					
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pctims}" />
				</f:facet>
				<aon:outputText value="#{to.pctims}" rendered="#{to!=cnaeMaestro.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				
				<f:facet name="footer">
					
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pcttotal}" />
				</f:facet>
				<aon:outputText value="#{to.pcttotal}" rendered="#{to!=cnaeMaestro.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				
				<f:facet name="footer">
					
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=cnaeMaestro.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							
							actionListener="cnaeMaestro.onOcupacionRemove"
							
							accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==cnaeMaestro.to}"
						actionListener="#{cnaeMaestro.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-ocupacion" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==cnaeMaestro.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{cnaeMaestro.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!cnaeMaestro.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							
							valueChangeListener="cnaeMaestro.onOcupacionRemove"
							
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-ocupacion" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{cnaeMaestro.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{cnaeMaestro.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
	</aon:div>

</ui:composition>
