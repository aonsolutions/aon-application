<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="porcentajeMaestroSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_cotizacion__porcoti}" />
				<ui:param name="controller" value="#{porcentajeMaestro}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{porcentajeMaestro.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="porcentajeMaestro_list" />				
				
					<aon:outputLabel for="PorcentajeMaestro_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="PorcentajeMaestro_cdg" size="60" maxlength="60"
						valueChangeListener="#{porcentajeMaestro.addExpression}" />

					<aon:outputLabel for="PorcentajeMaestro_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="PorcentajeMaestro_description" size="60" maxlength="60"
						valueChangeListener="#{porcentajeMaestro.addExpression}" />
						
					<aon:outputLabel for="PorcentajeMaestro_ordpct"
						value="#{appBundle.aon_payroll_order}" />
					<aon:inputText id="PorcentajeMaestro_ordpct" size="60" maxlength="60"
						valueChangeListener="#{porcentajeMaestro.addExpression}" />
						
					<aon:outputLabel for="PorcentajeMaestro_porcentajes_id_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="PorcentajeMaestro_porcentajes_id_cdg" size="10" maxlength="10"
						valueChangeListener="#{porcentajeMaestro.addExpression}" />
						
					<aon:outputLabel for="PorcentajeMaestro_porcentajes_id_fecini"
						value="#{appBundle.aon_payroll_cotizacion_fecini}" />
					<aon:selectInputDate id="PorcentajeMaestro_porcentajes_id_fecini"
						renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{porcentajeMaestro.searchFecini}" />
						
					<aon:outputLabel for="PorcentajeMaestro_porcentajes_id_fecfin"
						value="#{appBundle.aon_payroll_cotizacion_fecfin}" />
					<aon:selectInputDate id="PorcentajeMaestro_porcentajes_id_fecfin"
						renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{porcentajeMaestro.searchFecfin}" />
						
					<aon:outputLabel for="PorcentajeMaestro_porcentajes_pctemp"
						value="#{appBundle.aon_payroll_cotizacion_empresa}" />
					<aon:inputText id="PorcentajeMaestro_porcentajes_pctemp" size="60" maxlength="60"
						valueChangeListener="#{porcentajeMaestro.addExpression}" />
					
					<aon:outputLabel for="PorcentajeMaestro_porcentajes_pcttra"
						value="#{appBundle.aon_payroll_cotizacion_trabajador}" />
					<aon:inputText id="PorcentajeMaestro_porcentajes_pcttra" size="60" maxlength="60"
						valueChangeListener="#{porcentajeMaestro.addExpression}" />
						
					<aon:outputLabel for="PorcentajeMaestro_porcentajes_pcttot"
						value="#{appBundle.aon_payroll_cotizacion_total}" />
					<aon:inputText id="PorcentajeMaestro_porcentajes_pcttot" size="60" maxlength="60"
						valueChangeListener="#{porcentajeMaestro.addExpression}" />
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
