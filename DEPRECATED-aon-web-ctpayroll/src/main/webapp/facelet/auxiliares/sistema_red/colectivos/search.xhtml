<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="sistemaRedColectivosSearch">

		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_sistema_red__colectivos}" />
				<ui:param name="controller" value="#{sistemaRedColectivos}"/>
				<ui:param name="skipResetButton" value="true" />
				<aon:methodParam name="backAction" value="sistemaRedColectivos_form"/>
		     	</ui:include>
			<!-- end toolbar navigation -->
		

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{sistemaRedColectivos.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="sistemaRedColectivos_form" />				
				
					<aon:outputLabel for="Colectivos_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Colectivos_cdg" size="4" maxlength="4"
						valueChangeListener="#{sistemaRedColectivos.addExpression}" />

					<aon:outputLabel for="Colectivos_description"
						value="#{appBundle.aon_payroll_long_description}" />
					<aon:inputText id="Colectivos_description" size="60" maxlength="60"
						valueChangeListener="#{sistemaRedColectivos.addExpression}" />
						
					<aon:outputLabel for="Colectivos_descripcorta"
						value="#{appBundle.aon_payroll_short_description}" />
					<aon:inputText id="Colectivos_descripcorta" size="30" maxlength="30"
						valueChangeListener="#{sistemaRedColectivos.addExpression}" />
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
