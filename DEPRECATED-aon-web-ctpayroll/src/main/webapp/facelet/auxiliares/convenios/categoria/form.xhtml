<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="categoriaForm">
			
			<ui:include src="/facelet/templates/formPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_auxiliares_convenios__categoria}" />				
				<ui:param name="controller" value="#{categoria}"/>
				<!--  
				<ui:param name="reportKey" value="categoriaList"/>
				<ui:param name="reportKeyXls" value="categoriaListXls"/>
				-->
				<aon:methodParam name="backAction" value="convenio_form"/>
				<aon:methodParam name="cancelAction" value="convenio_form"/>
			</ui:include>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="categoria" columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel for="Categoria_convenio_description" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__convenio}"/>
					<aon:outputText id="Categoria_convenio_description"  size="15" maxlength="10" 
						value="#{convenio.to.description}" />
						
					<aon:outputLabel for="Categoria_nivel" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__categoria_nivel}"/>
					<aon:outputText id="Categoria_nivel" size="15" maxlength="10"
						value="#{nivel.to.id.cdg}" />
						
					<aon:outputLabel for="Categoria_id_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__categoria_categoria}"/>
					<aon:inputText id="Categoria_id_cdg" size="15" maxlength="10"
						value="#{categoria.to.id.cdg}" />
					  						
					<aon:outputLabel for="Categoria_description" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__categoria_descripcion}"/>
					<aon:inputText id="Categoria_description" size="40" maxlength="35"
						value="#{categoria.to.description}" />
						
					<aon:outputLabel for="Base_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__categoria_grupo}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Base_cdg"
							lookup="#{baseLookup}"
							reRender="Base_descripcion"
							value="#{categoria.to.base.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Base_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_convenios__categoria_grupo}"
							selectReRender="Base_cdg,Base_descripcion"
							lookup="#{baseLookup}" minHeight="440"
							property="#{categoria.to.base}">
						</aon:lookupButton>
						<aon:inputText id="Base_descripcion"
							value="#{(categoria.to.base.description!=null)?(categoria.to.base.description):('')}"
							size="34" disabled="true" />
					</aon:div>	
					 
					<aon:outputLabel for="Epigrafe_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__categoria_epigrafe}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Epigrafe_cdg"
							lookup="#{epigrafeLookup}"
							reRender="Epigrafe_description"
							value="#{categoria.to.epigrafe.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Epigrafe_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_convenios__categoria_epigrafe}"
							selectReRender="Epigrafe_cdg,Epigrafe_description"
							lookup="#{epigrafeLookup}" minHeight="440"
							property="#{categoria.to.epigrafe}">
						</aon:lookupButton>
						<aon:inputText id="Epigrafe_description"
							value="#{(categoria.to.epigrafe.description!=null)?(categoria.to.epigrafe.description):('')}"
							size="34" disabled="true" />
					</aon:div>		
					
				 	<aon:outputLabel for="Categoria_cno" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__categoria_cno}"/>
					<aon:inputText id="Categoria_cno" size="10" maxlength="4"
						value="#{categoria.to.cno}" />
					
					
				</aon:panelGrid>


				
			
			</aon:div>
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{baseLookup}" />
		<aon:lookupButtonPopup lookup="#{epigrafeLookup}" />
		
	</ui:define>
</ui:composition>

</body>
</html>
