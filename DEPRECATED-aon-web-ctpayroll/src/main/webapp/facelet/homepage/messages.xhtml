<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="aonMessagesContainer" ajaxRendered="true" styleClass="aon-popupWindow">
		<c:if test="#{facesContext.maximumSeverity != null}">	
			<aon:form>
				<rich:modalPanel id="messagesModalPanel" 
					rendered="#{facesContext.maximumSeverity != null}" 
					minWidth="400" height="200" top="190px" left="350"
					showWhenRendered="true">
	
					<f:facet name="header">
						<aon:div styleClass="aon-popupWindow-title">
							<aon:outputText value="#{bundle.aon_error_title}" />
						</aon:div>
					</f:facet>
					<f:facet name="controls">
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							reRender="aonMessagesContainer" immediate="true">
							<rich:componentControl for="messagesModalPanel" event="onclick"
								disableDefault="true" operation="hide" />
						</aon:commandButton>	
					</f:facet>				
	
					<aon:div id="aon-errors" styleClass="aon-popupWindow-content">
						<aon:messages />
					</aon:div>
	
				</rich:modalPanel>
			</aon:form>
		</c:if>
	</aon:div>

</ui:composition>
