<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="impresos190Form">

					<!-- 
						<ui:include
						src="/facelet/templates/formPrintToolbar.xhtml">
					-->
					<ui:include
						src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
						<ui:param name="toolbarTitle"
							value="#{appBundle.aon_payroll_resultados_irpf_impresos190_mnto_impresos}" />
						<ui:param name="controller"
							value="#{impresos190}" />
					</ui:include>
					
					<!--	FIN HEADER & TOOLBAR	-->

					<aon:div id="impresos190Data"
						styleClass="aon-scroll-area aon-scroll-area-clientes">

						<rich:tabPanel switchType="ajax" style="tabs">
							
							<rich:tab
								label="#{appBundle.aon_payroll_resultados_irpf_impresos190_tab1}" >
								<aon:div id="resumenDiv">									 
									<ui:include
										src="resumen/form.xhtml" />

								</aon:div>
							</rich:tab>
							<rich:tab disabled="#{impresos190.new}"
								label="#{appBundle.aon_payroll_resultados_irpf_impresos190_tab2}" >
								<aon:div id="interiorDiv">
									<ui:include
										src="interior/grid.xhtml" />
								</aon:div>
							</rich:tab>

						</rich:tabPanel>
					</aon:div>
				</aon:form>
				
				<aon:lookupButtonPopup lookup="#{empresaLookup}" />
				<aon:lookupButtonPopup lookup="#{provinciaLookup}" />
				<aon:lookupButtonPopup lookup="#{admonLookup}" />
				
			</ui:define>
		</ui:composition>

	</body>
</html>
