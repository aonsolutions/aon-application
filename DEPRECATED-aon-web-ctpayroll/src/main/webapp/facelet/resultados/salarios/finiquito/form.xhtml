<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="finiquitoForm">

					<!-- 
						<ui:include
						src="/facelet/templates/formPrintToolbar.xhtml">
					-->
					<ui:include
						src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
						<ui:param name="toolbarTitle"
							value="#{menuBundle.resultados_recibos_salarios__finiquitos}" />
						<ui:param name="controller"
							value="#{finiquito}" />

					</ui:include>
					
					<!--	FIN HEADER & TOOLBAR	-->

					<aon:div id="finiquitoData"
						styleClass="aon-scroll-area aon-scroll-area-clientes">
						
						<aon:panelGrid columns="4" dir="true"
							width="100%" style="margin-bottom=2px;">
					
							<aon:outputLabel
								value="#{appBundle.aon_payroll_cdg}" />
							<aon:inputText value="#{finiquito.to.cdg}"
								size="14" maxlength="10" readonly="#{true}"/>
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_causa_baja}" />
							<aon:inputText value="#{finiquito.to.causa}"
								size="35" maxlength="30" />
									
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_fecha_baja}" />
							<aon:selectInputDate id="fecha_baja" renderAsPopup="true" required="#{true}"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{finiquito.to.fecbaj}" enableManualInput="true" />
								 
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_trabajador}" />
							<aon:div styleClass="aon-lookup">
							
							<aon:outputText value=" LOOKUP trabajador"/>
							
							 <!--
								<aon:lookupInputText
									id="trabajador_cdg" 
									lookup="#{trabajadorLookup}"
									reRender="trabajador_descripcion"
									value="#{finiquito.to.emprper.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton
									id="trabajador_lookup"
									windowTitle="#{appBundle.aon_payroll_resultados_irpf_impresos190_empresa_nif}"
									selectReRender="trabajador_cdg,trabajador_descripcion"
									lookup="#{trabajadorLookup}" minHeight="440"
									property="#{emprper}">
								</aon:lookupButton>
								<aon:inputText
									id="trabajador_descripcion"
									value="#{(finiquito.to.emprper.persona.descripcion!=null)?(finiquito.to.emprper.persona.descripcion):('')}"
									size="45" disabled="true" />
							-->
							</aon:div>

							 
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_fecha_alta}" />
							<aon:outputText value="Fecha alta trabajador"/>

							<!--
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{finiquito.to.emprper.fecalt}" enableManualInput="true" />
							
							
							<aon:outputText value="#{finiquito.to.emprper.fecalt}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							-->
							
								
							
						</aon:panelGrid>
						
<!-- ********** PESTAINAS ********** -->
						<rich:tabPanel switchType="ajax" style="margin-bottom:5px;" >
							<rich:tab
								label="#{appBundle.aon_payroll_resultados_salarios_finiquito_tab1}" >
								<aon:div id="pagasExtraDiv">									 
									<ui:include
										src="pagasExtra/grid.xhtml" />
								</aon:div>
							</rich:tab>
							<rich:tab 
								label="#{appBundle.aon_payroll_resultados_salarios_finiquito_tab2}" >
								<aon:div id="indemnizacionesDiv">
									<ui:include
										src="indemnizaciones/grid.xhtml" />
								</aon:div>
							</rich:tab>
							<rich:tab 
								label="#{appBundle.aon_payroll_resultados_salarios_finiquito_tab3}" >
								<aon:div id="descuentosDiv">
									<ui:include
										src="descuentos/grid.xhtml" />
								</aon:div>
							</rich:tab>
						</rich:tabPanel>
<!-- ********** FIN PESTAINAS ********** -->

						
					    <aon:panelGrid id="form-info-right" border="1" columns="5"
					        style="float:right;" width="50%">
					        
					        <aon:outputLabel
								value="&#160;" />
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_grupo}" />
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_base}" />
			                <aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_percent}" />
			                <aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_importe}" />
				        <!--  -->
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_base_cg}" />
							<aon:inputText value="#{finiquito.to.codbas}"
								size="5" maxlength="2" />
							<aon:inputText value="#{finiquito.to.basecg}"
								size="13" maxlength="11" />
							<aon:inputText value="#{finiquito.to.prccg}"
								size="7" maxlength="5" />
							<aon:inputText value="#{finiquito.to.importecg}"
								size="13" maxlength="11" />
						<!--  -->
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_desemp_fp}" />
							<aon:outputLabel value="&#160;"  />
							<aon:inputText value="#{finiquito.to.baseacc}"
								size="13" maxlength="11" />
							<aon:inputText value="#{finiquito.to.prcacc}"
								size="7" maxlength="5" />
							<aon:inputText value="#{finiquito.to.importeacc}"
								size="13" maxlength="11" />
						<!--  -->
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_aporte_trab_ss}" />
							<aon:outputLabel value="&#160;"  />
							<aon:outputLabel value="&#160;"  />
							<aon:outputLabel value="&#160;"  />
							<aon:inputText value="--" disabled="#{true}"
								size="13" maxlength="11" />
						<!--  -->
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_ret_irpf}" />
							<aon:outputLabel value="&#160;"  />
							<aon:inputText value="#{finiquito.to.base}"
								size="13" maxlength="11" />
							<aon:inputText value="#{finiquito.to.irpf}"
								size="7" maxlength="5" />
							<aon:inputText value="#{finiquito.to.importeIrpf}"
								size="13" maxlength="11" />
						<!--  -->
							<aon:outputLabel
								value="#{appBundle.aon_payroll_resultados_salarios_finiquito_descuentos}" />
							<aon:outputLabel value="&#160;"  />
							<aon:outputLabel value="&#160;"  />
							<aon:outputLabel value="&#160;"  />
							<aon:inputText value="--" disabled="#{true}"
								size="13" maxlength="11" />
							
					    </aon:panelGrid>
						
					 
					    <h:panelGrid id="form-info-left" columns="5"
					        style="vertical-align:top;" width="47%">
					         <aon:panelGrid columns="2" >
				         
						        <aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_finiquito_sin_irpf}" />
								<aon:inputText value="#{finiquito.to.importesin}"
									size="13" maxlength="11" />
									
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_finiquito_importe_vacac}" />
								<aon:inputText value="#{finiquito.to.vacimporte}"
									size="13" maxlength="11" />
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_finiquito_total_conceptos}" />
								<aon:inputText value="#{finiquito.to.totalConceptos}"
									size="13" maxlength="11" />
								
								<aon:outputLabel value="&#160;"  />
								<aon:outputLabel value="&#160;"  />
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_finiquito_coste_ss}" />
								<aon:inputText value="#{finiquito.to.costessemp}"
									size="13" maxlength="11" />
					        </aon:panelGrid>
					        
					        <aon:div > 
					        <aon:panelGrid columns="4" style="margin-top:30;" >
						        									
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_finiquito_dias}" />
								<aon:inputText value="#{finiquito.to.diasvac}"
									size="5" maxlength="2" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_finiquito_fecha}" />
								<aon:selectInputDate renderAsPopup="true" inputSize="8"
									popupDateFormat="#{appBundle.aon_date_pattern}"
									value="#{finiquito.to.vacfecini}" enableManualInput="true" />
							</aon:panelGrid>
							
							 <aon:panelGrid columns="2" style="margin-top:40;">
						        	
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_finiquito_fec_cob_real}" />
								<aon:selectInputDate renderAsPopup="true" inputSize="8" id="fecha_cobro_real"
									popupDateFormat="#{appBundle.aon_date_pattern}" required="#{true}"
									value="#{finiquito.to.feccobreal}" enableManualInput="true" />
								
							</aon:panelGrid>
					        </aon:div>
					        
					    </h:panelGrid>
					 
						<rich:separator style="clear:both;margin:10px 0;"/>
						
						<aon:panelGrid border="1" columns="5"
					        style="float:right;" width="40%">
					        	<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_finiquito_divisa}" />
								<aon:inputText value="#{finiquito.to.divisa.description}"
									size="13" maxlength="11" readonly="#{true}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_salarios_finiquito_importe_percibir}" />
								<aon:inputText value="#{finiquito.to.liquido}"
									size="13" maxlength="11" />
					    </aon:panelGrid>

					</aon:div>
				</aon:form>
				
				<aon:lookupButtonPopup lookup="#{trabajadorLookup}" />
				<aon:lookupButtonPopup lookup="#{complementoLookup}" />
				
			</ui:define>
		</ui:composition>

	</body>
</html>
