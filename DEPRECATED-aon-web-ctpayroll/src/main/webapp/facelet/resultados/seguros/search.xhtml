<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

			</ui:include>

						styleClass="aon-scroll-area aon-scroll-area-nom">

							<aon:panelGrid columns="6" dir="true" width="100%"
								style="margin-bottom=2px;">


								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_tc2_act}" />
								<aon:div styleClass="aon-lookup">

										value="#{tc2.actividad.cdg}" size="5"></aon:lookupInputText>

										value="#{(tc2.to.codact.empresa.cliente.localidad!=null)?(tc2.to.codact.empresa.cliente.localidad):('')}"

						</aon:div>

									value="#{appBundle.aon_payroll_resultados_tc2_conv}" />

								<aon:outputLabel

							<aon:inputText id="tc2_imprime"
											valueChangeListener="#{tc2.addExpression}" size="50" maxlength="20" />

										maxlength="20" />

									<aon:outputLabel

											valueChangeListener="#{tc2.addExpression}"    size="50"
										maxlength="20" />

									<aon:outputLabel
										value="#{appBundle.aon_payroll_resultados_tc2_compap}" />
									<aon:inputText id="tc2_compAcc"

										maxlength="20" />

									<aon:outputLabel

									<aon:outputLabel

									<aon:inputText id="tc2_redInem"

									<aon:outputLabel
										value="#{appBundle.aon_payroll_resultados_tc2_compdesm}" />
									<aon:inputText id="tc2_XXXXXXXXX" disabled="true"
											valueChangeListener="#{tc2.addExpression}"  size="50"
										maxlength="20" />



								</aon:panelGrid>

							</aon:div>
						</aon:panel>

				</ui:define>

		<aon:lookupButtonPopup lookup="#{actividadLookup}" />
