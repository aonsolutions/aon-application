<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<script>
		function signPdf() {
			try {
				var _applet = document.getElementById('izenpeApplet');
				if (! _applet ) {
					return false;
				}
				var pdf64Element = document.getElementById('aonContent:passwordForm:pdf64Data');
				if (! pdf64Element ) {
					return false;
				}		
				var pdf64SignedElement = document.getElementById('aonContent:passwordForm:pdf64SignedData');
				if (! pdf64SignedElement ) {
					return false;
				}		
			
				_applet.clearInputs();					
				_applet.setOption("pdf-signature-llx", "305" );
				_applet.setOption("pdf-signature-lly", "745" );
				_applet.setOption("pdf-signature-urx", "405" );
				_applet.setOption("pdf-signature-ury", "795" );
				if (! _applet.setCryptoStoreAuto() ) {
					return false;										
				}										
				var pdf64Text = pdf64Element.value;
				if (!_applet.addInput("inline-binary",pdf64Text,"inline",null)) {
					return false;
				}
				if (_applet.sign("pdf-timestamped")) {
					pdf64SignedElement.value = _applet.getOutputContent(0, true);
				} else {
					return false;
				}
				return true;
			} catch(e) {
				alert( "Se ha producido un error inexperado: " + e );
			}
			return false;									
		}
	</script>
 
	<aon:div styleClass="aon-note" >
		<aon:div styleClass="aon-note-internal">
			<aon:panelGroup>
				<aon:outputText value="#{bundle.sign_smartCard_warning}" />
			</aon:panelGroup>
		</aon:div>
	</aon:div>

	<aon:div styleClass="aon-text-center" >
		<applet id="izenpeApplet" name="izenpeApplet" 
			code="izenpe.app.applet.AppletApplication.class"
			archive="#{aonResource.resolveCommon['/aon-ui-sign/izenpesigner-applet.jar']}" >
			<param name="boxmessage" value="Mensaje de Prueba" />
		</applet>									
	</aon:div>
	
	<aon:inputTextarea id="pdf64Data" style="display: none;"
		value="#{certificate.pdf64Data}" />
	
	<aon:inputTextarea id="pdf64SignedData" style="display: none;"
		value="#{certificate.pdf64SignedData}" />
	
</ui:composition>
