<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:methodParam name="signActionListener" default="#{signController.onSign}" type="actionListener" />
	<aon:methodParam name="cancelSignActionListener" default="#{signController.onCancelSign}" type="actionListener" />

	<aon:if test="#{company.EInvoice and aonRole.ESignature}">
		<aon:if test="#{!skipSignButton and !certificate.sessionCertificateStored}">
			<aon:menuItem id="sign"
				value="#{bundle.sign_sign}"
				actionListener="#{certificate.onShowSignWindow}"
				iconClass="aon-icon-sign"
				reRender="showSignWindow" >
				<f:setPropertyActionListener
					target="#{certificate.signerController}" value="#{signController}" />				
			</aon:menuItem>
		</aon:if>
		<aon:if test="#{!skipSignButton and certificate.sessionCertificateStored}">
			<aon:menuItem id="sign"
				value="#{bundle.sign_sign}"
				actionListener="#{signActionListener}"
				iconClass="aon-icon-sign"
				reRender="#{signButtonReRender}"
				onclick="Richfaces.showModalPanel('waitProccess')" 
	     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />									
		</aon:if>
		<aon:if test="#{!skipCancelSignButton}">
			<aon:menuItem id="cancel_sign"
				value="#{bundle.sign_cancel_sign}"
				actionListener="#{cancelSignActionListener}"
				iconClass="aon-icon-cancel-sign"
				onclick="Richfaces.showModalPanel('waitProccess')" 
	     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
	     </aon:if>
	</aon:if>

</ui:composition>
