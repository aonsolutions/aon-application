<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="configMenu">

			<aon:div styleClass="aon-scroll-area">

				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>

						<aon:panelGrid id="group_config_company"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-company aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{companyBundle.company_menu_group}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="company" action="company"
										actionListener="#{company.onLoad}"
										value="#{companyBundle.company_data_module}">
									</aon:commandLink>
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<c:if test="#{aonRole.admin}">
							<aon:panelGrid id="group_config_security"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-security aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_security}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="actionDenied" action="actionDenied"
											actionListener="#{actionDenied.onInit}"
											value="#{auditBundle.audit_option_denied_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="dbDumper" action="dbDumper_form"
											value="#{dbutilsBundle.dbutils_dumper_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>

						<aon:panelGrid id="group_configuration_data_sync"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-refresh aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.account_data_sync}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="account_exporter"
										action="account_exporter"
										value="#{accountBundle.account_exporter_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="account_importer"
										action="account_importer"
										actionListener="#{accountImporter.onInitialize}"
										value="#{accountBundle.account_importer_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="balance_exporter"
										action="balance_exporter"
										value="#{accountingBundle.accounting_balance_exporter_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="balance_importer"
										action="balance_importer"
										actionListener="#{balanceImporter.onInitialize}"
										value="#{accountingBundle.accounting_balance_importer_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="amortization_exporter"
										action="amortization_exporter"
										value="#{accountingBundle.accounting_amortizationType_exporter_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="amortization_importer"
										action="amortization_importer"
										actionListener="#{amortizationTypeImporter.onInitialize}"
										value="#{accountingBundle.accounting_amortizationType_importer_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
					</aon:panelGroup>

					<aon:panelGroup>

						<aon:panelGrid id="group_configuration_configuration"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-general aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_general}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="series" action="series"
										value="#{configBundle.config_series_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="tax" action="tax_list"
										value="#{configBundle.config_tax_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accPeriod" action="accPeriod"
										actionListener="#{accPeriod.onSearch}"
										value="#{accountingBundle.accounting_period_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="defaultParams" action="defaultParams"
										actionListener="#{accAppParams.onLoad}"
										value="#{accountingBundle.accounting_default_params_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_configuration_utilities"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-utilities aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_utilities}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="mbase_form" action="sqlScript_form"
										actionListener="#{sqlScript.onInitialize}"
										value="#{dbutilsBundle.dbutils_script_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
					</aon:panelGroup>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
