<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="reportsMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">
		
					<aon:panelGrid columns="1" styleClass="aon-width-all"
						columnClasses="aon-vertical-align-top aon-width-300">

						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-icon-sales aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.account_reports}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="account_statement" 
										action="account_statement_search" actionListener="#{trialBalance.onReset}"
										value="#{accountingBundle.accounting_statement_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="journal" 
										action="journal_search" actionListener="#{journalReport.onEditSearch}"
										value="#{accountingBundle.accounting_journal_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="ledger" 
										action="ledger_search" actionListener="#{ledgerReport.onEditSearch}"
										value="#{accountingBundle.accounting_ledger_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="trialBalance" 
										action="trialBalance_search" actionListener="#{trialBalance.onReset}"
										value="#{accountingBundle.accounting_trial_balance_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="profitAndLossReport" 
										action="profit_and_loss_search" actionListener="#{profitAndLossReport.onEditSearch}"
										value="#{accountingBundle.accounting_profit_and_loss_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="vat_report" 
										action="vat_report_search" actionListener="#{vatReport.onReset}"
										value="#{financeBundle.finance_vat_report_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="mod_347_report" 
										action="model_347_report_search" actionListener="#{model347Report.onReset}"
										value="#{financeBundle.finance_model_347_report_module}" />
								</aon:div>
							</aon:div>
						</h:panelGrid>
					</aon:panelGrid>
				</aon:componentGroup>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
