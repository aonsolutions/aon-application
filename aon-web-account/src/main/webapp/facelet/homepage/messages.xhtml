<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="aonMessagesContainer" ajaxRendered="true" layout="none" styleClass="aon-popupWindow">
		<aon:form rendered="#{facesContext.maximumSeverity != null}">
			<aon:panelGroup styleClass="aon-popup-panel aon-confirm-box">
		
				<rich:modalPanel minWidth="300" top="190px" left="350"
					id="messagesModalPanel" showWhenRendered="true">
	
					<f:facet name="header">
						<aon:div styleClass="aon-popupWindow-title">
							<aon:outputText value="MENSAJES" />
						</aon:div>
					</f:facet>
					<f:facet name="controls">
						<aon:commandButton type="button" 
							styleClass="aon-popupWindow-close"  immediate="true"							
							onclick="Richfaces.hideModalPanel('messagesModalPanel');">
						</aon:commandButton>	
					</f:facet>				
	
					<aon:div id="aon-errors" styleClass="aon-popupWindow-content">
						<aon:messages />
					</aon:div>
	
				</rich:modalPanel>
				
			</aon:panelGroup>
			
		</aon:form>
	</aon:div>

</ui:composition>
