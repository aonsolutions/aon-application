<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form>
		<aon:menuBar id="mainMenu"> 
			<aon:dropDownMenu value="#{appBundle.account_masters}">
				<aon:menuItem value="#{accountBundle.account_entry_module}" action="accountEntry_search"/>
				<aon:menuSeparator/>
				<aon:menuItem action="account_list" value="#{accountBundle.account_module}"/>
				<aon:menuItem action="autConcept" value="#{accountBundle.account_aut_concept_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem actionListener="#{customer.onEditSearch}" action="customer_search" value="#{customerBundle.customer_module}"/>
				<aon:menuItem actionListener="#{supplier.onEditSearch}" action="supplier_search" value="#{supplierBundle.supplier_module}"/>
				<aon:menuItem actionListener="#{creditor.onEditSearch}" action="creditor_search" value="#{financeBundle.finance_creditor_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem action="geotreeParent_list" value="#{geozoneBundle.geozone_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem action="payMethod" value="#{financeBundle.finance_pay_methods}"/>
			</aon:dropDownMenu>
 
			<aon:dropDownMenu value="#{appBundle.account_pred_entries}">
				<aon:menuItem actionListener="#{invoiceEntry.onReset}" action="account_invoice_entry" value="#{accountBundle.account_entry_invoice_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem actionListener="#{expenseEntry.onReset}" action="account_expense_entry" value="#{accountBundle.account_expense_entry_module}"/>
				<aon:menuItem actionListener="#{salaryEntry.onReset}" action="account_salary_entry" value="#{accountBundle.account_salary_entry_module}"/>
				<aon:menuItem actionListener="#{socialInsuranceEntry.onReset}" action="account_social_insurance_entry" value="#{accountBundle.account_social_insurance_entry_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem actionListener="#{loanEntry.onReset}" action="account_loan_entry" value="#{accountBundle.account_loan_entry_module}"/>
				<aon:menuItem actionListener="#{loanFeeEntry.onReset}" action="account_loan_fee_entry" value="#{accountBundle.account_loan_fee_entry_module}" />
				<aon:menuSeparator/>
				<aon:menuItem actionListener="#{leasingEntry.onReset}" action="account_leasing_entry" value="#{accountBundle.account_leasing_entry_module}"/>
				<aon:menuItem actionListener="#{leasingFeeEntry.onReset}" action="account_leasing_fee_entry" value="#{accountBundle.account_leasing_fee_entry_module}"/>
				<!--  
						****** Definicion de apuntes periodicos ******
				<aon:menuItem value="#{appBundle.account_periodic_entries}" disabled="true"/>
				-->
				<aon:menuSeparator/>
				<aon:menuGroup value="#{appBundle.account_end_period_entries}">
					<aon:menuItem action="accountOperatingEntry" value="#{accountBundle.account_operating_entry_module}"/>
					<aon:menuItem action="accountClosingEntry" value="#{accountBundle.account_closing_entry_module}" />
					<aon:menuItem action="accountOpeningEntry" value="#{accountBundle.account_opening_entry_module}" />
				</aon:menuGroup>
			</aon:dropDownMenu>
 
			<aon:dropDownMenu value="#{appBundle.account_reports}">
				<aon:menuItem actionListener="#{trialBalance.onReset}" action="account_statement_search" value="#{accountBundle.account_statement_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem actionListener="#{journalReport.onReset}" action="journal_search"	value="#{accountBundle.account_journal_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem actionListener="#{trialBalance.onReset}" action="trialBalance_search" value="#{accountBundle.account_trial_balance_module}" />
				<aon:menuItem actionListener="#{profitAndLossReport.onEditSearch}" action="profit_and_loss_search" value="#{accountBundle.account_profit_and_loss_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem action="vat_report_search" actionListener="#{vatReport.onReset}" value="#{financeBundle.finance_vat_report_module}"/>
				<!--  
						****** 347 - Operaciones con terceros ******
				<aon:menuItem disabled="true" value="#{appBundle.account_outsiders_operations}"/>
				 -->
				<aon:menuSeparator/>
				<aon:menuGroup value="#{appBundle.account_official_balances}">
					<aon:menuItem disabled="true" value="#{accountBundle.account_profit_and_loss_module}"/>
					<aon:menuItem disabled="true" value="#{accountBundle.account_balance_sheet_module}"/>
				</aon:menuGroup>
			</aon:dropDownMenu>
			
			<aon:dropDownMenu value="#{appBundle.account_fixed_assets}">
				<aon:menuItem action="amortization_list" value="#{accountBundle.account_amortization_form_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem disabled="true" value="#{appBundle.accoung_amortization_report}"/>
				<aon:menuItem disabled="true" value="#{appBundle.accoung_amortization_entries}"/>
				<aon:menuSeparator/>
				<aon:menuItem action="amortizationType_list" value="#{accountBundle.account_amortization_type_module}"/>				
			</aon:dropDownMenu>

			<aon:dropDownMenu value="#{appBundle.account_budget}">
				<aon:menuItem actionListener="#{budgetedProfitAndLossReport.onEditSearch}" action="budgeted_profit_and_loss_search" value="#{accountBundle.account_budgeted_balance_sheet_module}"/>
				<aon:menuItem disabled="true" value="#{accountBundle.account_compared_budgeted_balance_sheet_module}"/>
			</aon:dropDownMenu>
			<!-- 
			<aon:dropDownMenu value="#{appBundle.account_utilities}">
				<aon:menuItem disabled="true" value="#{appBundle.account_transfer}"/>
				<aon:menuItem disabled="true" value="#{appBundle.account_import_data}"/>
				<aon:menuItem disabled="true" value="#{appBundle.account_export_data}"/>
			</aon:dropDownMenu>
 			-->
			<aon:dropDownMenu value="#{appBundle.account_configuration}">
				<aon:menuItem action="company" actionListener="#{company.onLoad}" value="#{companyBundle.company_data_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem action="accPeriod" value="#{accountBundle.account_accPeriod_module}"/>
				<aon:menuItem action="defaultParams" actionListener="#{accAppParams.onLoad}" value="#{accountBundle.account_default_params_module}"/>
				<aon:menuItem action="series" value="#{configBundle.config_series_module}"/>
				<aon:menuItem action="tax" value="#{productBundle.product_tax_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem action="officialBalance_list" value="#{accountBundle.account_official_balance_configuration_module}"/>
				<aon:menuSeparator/>
				<aon:menuItem action="regenerateAccountSummary" value="#{accountBundle.account_regenerate_summary_module}"/>
			</aon:dropDownMenu>
		</aon:menuBar>
	</aon:form>
</ui:composition>
