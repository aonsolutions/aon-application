<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:div style="width:100%;text-align:center;margin-top: 20px;">
		<aon:form>
			<aon:div style="width:80%;text-align:left;">
				<aon:panelCollapsible label="#{appBundle.account_pred_entries}">
					<h:panelGrid columns="2" style="width:100%"
						styleClass="aon-text-left"
						columnClasses="aon-column-middle-width,aon-column-middle-width,aon-column-middle-width">

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
								<aon:outputText
									value="#{accountingBundle.accounting_entry_invoice_module}" />
								<h:commandLink immediate="true"
									actionListener="#{invoiceEntry.onReset}"
									action="account_invoice_entry">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
								<aon:outputText
									value="#{accountingBundle.accounting_expense_entry_module}" />

									actionListener="#{expenseEntry.onReset}"
									action="account_expense_entry">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
								<aon:outputText

						<aon:div>

								<aon:outputText
									value="#{accountingBundle.accounting_social_insurance_entry_module}" />

									actionListener="#{socialInsuranceEntry.onReset}"

									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
								<aon:outputText
									value="#{accountingBundle.accounting_loan_fee_entry_module}" />
								<h:commandLink immediate="true"
									actionListener="#{loanFeeEntry.onReset}"

									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
								<aon:outputText
									value="#{accountingBundle.accounting_leasing_fee_entry_module}" />
								<h:commandLink immediate="true"
									actionListener="#{leasingFeeEntry.onReset}"
									action="account_leasing_fee_entry">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>
					</h:panelGrid>
				</aon:panelCollapsible>

				<aon:panelCollapsible label="#{appBundle.account_masters}">
					<h:panelGrid styleClass="aon-text-left" columns="2"
						style="width:100%; margin-top: 20px;"
						columnClasses="aon-column-middle-width,aon-column-middle-width">
						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOption">
								<aon:outputText value="#{accountingBundle.accounting_entry_module}" />
								<h:commandLink immediate="true"
									actionListener="#{accountEntry.onReset}"
									action="accountEntry_form">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
								<h:commandLink immediate="true"
									actionListener="#{accountEntry.onEditSearch}"
									action="accountEntry_search">
									<aon:outputText value="[#{bundle.aon_search}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>

						<aon:div>

								<aon:outputText value="#{accountBundle.account_module}" />
								<h:commandLink immediate="true"
									actionListener="#{account.onReset}" action="account_form">
									<aon:outputText value="[#{bundle.aon_reset}]" />

								<h:commandLink immediate="true"
									actionListener="#{account.onEditSearch}"
									action="account_search">

							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOption">
								<aon:outputText value="#{supplierBundle.supplier_module}" />
								<h:commandLink immediate="true"
									actionListener="#{supplier.onReset}" action="supplier_form">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
								<h:commandLink immediate="true"
									actionListener="#{supplier.onEditSearch}"
									action="supplier_search">
									<aon:outputText value="[#{bundle.aon_search}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOption">
								<aon:outputText value="#{financeBundle.finance_creditor_module}" />
								<h:commandLink immediate="true"

									actionListener="#{creditor.onEditSearch}"
									action="creditor_search">
									<aon:outputText value="[#{bundle.aon_search}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>

					</h:panelGrid>
				</aon:panelCollapsible>

				<aon:panelCollapsible label="#{appBundle.account_reports}">
					<h:panelGrid styleClass="aon-text-left" columns="2"
						style="width:100%; margin-top: 20px;"
						columnClasses="aon-column-middle-width,aon-column-middle-width">
						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionReport">
								<aon:outputText
									value="#{accountingBundle.accounting_statement_module}" />
								<h:commandLink immediate="true"
									actionListener="#{trialBalance.onReset}"
									action="account_statement_search">
									<aon:outputText value="[#{bundle.aon_listing}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionReport">
								<aon:outputText
									value="#{accountingBundle.accounting_trial_balance_module}" />
								<h:commandLink immediate="true"
									actionListener="#{trialBalance.onReset}"
									action="trialBalance_search">
									<aon:outputText value="[#{bundle.aon_listing}]" />

									actionListener="#{profitAndLossReport.onEditSearch}"

								<h:commandLink immediate="true"
									actionListener="#{journalReport.onReset}"
									action="journal_search">
									<aon:outputText value="[#{bundle.aon_listing}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionReport">
								<aon:outputText value="#{financeBundle.finance_vat_report_module}" />
								<h:commandLink immediate="true"
									actionListener="#{vatReport.onReset}"
									action="vat_report_search">
									<aon:outputText value="[#{bundle.aon_listing}]" />
								</h:commandLink>
							</aon:div>
						</aon:div>

</ui:composition>
