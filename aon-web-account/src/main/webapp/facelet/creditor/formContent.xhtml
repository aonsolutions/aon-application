<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-scroll-area">
		<aon:panelGrid id="dataTable" columns="2">

			<aon:outputLabel for="Creditor_id" value="#{registryBundle.aon_id}" />
			<aon:inputText id="Creditor_id" value="#{creditorAlias.to.id}"
				required="#{true}" size="15" disabled="#{true}" />

			<aon:outputLabel for="Creditor_registry_document"
				value="#{registryBundle.aon_cif}" />
			<aon:inputText id="Creditor_registry_document"
				value="#{creditorAlias.to.registry.document}" size="16">
				<f:validateLength minimum="1" maximum="16" />
			</aon:inputText>

			<aon:outputLabel for="Creditor_registry_name"
				value="#{registryBundle.aon_name}" />
			<aon:inputText id="Creditor_registry_name"
				value="#{creditorAlias.to.registry.name}" size="64">
				<f:validateLength minimum="1" maximum="64" />
			</aon:inputText>

			<aon:outputLabel for="Creditor_registry_surname"
				value="#{registryBundle.aon_surname}" />
			<aon:inputText id="Creditor_registry_surname"
				value="#{creditorAlias.to.registry.surname}" size="64">
				<f:validateLength minimum="1" maximum="64" />
			</aon:inputText>

			<aon:outputLabel for="Creditor_registry_alias"
				value="#{registryBundle.aon_alias}" />
			<aon:inputText id="Creditor_registry_alias"
				value="#{creditorAlias.to.registry.alias}" size="32">
				<f:validateLength minimum="1" maximum="32" />
			</aon:inputText>

			<aon:outputLabel for="Creditor_scope_id"
				value="#{financeBundle.finance_creditor_scope}" />
			<aon:selectOneMenu id="Creditor_scope_id"
				value="#{creditorAlias.to.scope.id}">
				<f:selectItems value="#{configCollections.scopes}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="Creditor_status"
				value="#{registryBundle.aon_status}" />
			<aon:selectOneMenu id="Creditor_status"
				value="#{creditorAlias.to.status}">
				<f:selectItems value="#{financeCollections.creditorStatuses}" />
			</aon:selectOneMenu>
		</aon:panelGrid>
	</aon:div>
</ui:composition>
