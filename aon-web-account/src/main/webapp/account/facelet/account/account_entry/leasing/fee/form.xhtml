<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="accountLeasingFeeForm" styleClass="aon-form">

			<!-- start toolbar navigation -->
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">

						<h:commandButton id="save" value="#{bundle.aon_save}"
							accesskey="#{bundle.aon_key_save}"
							actionListener="#{accountLeasingFee.accept}" action="account_entry_form"
							styleClass="aon-content-toolbar-item"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							onmouseout="this.className='aon-content-toolbar-item'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'">
						</h:commandButton>
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							accesskey="#{bundle.aon_key_new}"
							actionListener="#{accountLeasingFee.onReset}" rendered="#{!accountLeasingFee.new}"
							styleClass="aon-content-toolbar-item"
							onmouseout="this.className='aon-content-toolbar-item'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'">
						</h:commandButton>
						<h:commandButton id="remove" value="#{bundle.aon_remove}"
							accesskey="#{bundle.aon_key_remove}" action="account_entry_search"
							actionListener="#{accountLeasingFee.onRemove}" rendered="#{!accountLeasingFee.new}"
							styleClass="aon-content-toolbar-item" immediate="true"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
							onmouseout="this.className='aon-content-toolbar-item'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'">
						</h:commandButton>
					</t:div>
				</t:div>
			</t:div>
			<!-- end toolbar navigation -->

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<!-- start of bag panel -->
					<!-- start of grid layout -->
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
						
						<h:outputLabel for="Account_invoice_series"
								styleClass="aon-form-input-text-label"
								value="#{accountBundle.aon_series_number}" />
						<h:panelGrid columns="2" cellpadding="0" cellspacing="0"> 
							<t:inputText id="Account_invoice_series"
								value="#{accountLeasingFee.header.series}" size="3" maxlength="3"
								styleClass="aon-form-input-text" forceId="#{true}" >
								<f:validateLength maximum="3" />
							</t:inputText>	
							<t:inputText id="Account_invoice_number"
								value="#{accountLeasingFee.header.number}" size="7" maxlength="7"
								styleClass="aon-form-input-text" forceId="#{true}">
								<f:validateLength maximum="7" />
							</t:inputText>	
						</h:panelGrid>
						
						<t:outputLabel for="Account_date"
							styleClass="aon-form-input-text-label"
							value="#{accountBundle.aon_date}" />						
						<t:inputCalendar id="Account_date"
							value="#{accountLeasingFee.header.leasingFeeDate}" size="8" required="true" 
							monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
							currentDayCellClass="currentDayCell" renderAsPopup="true"
							styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
							popupTodayString="#{bundle.aon_popup_today}"
							popupWeekString="#{bundle.aon_popup_week}" />
							
 						<t:outputLabel for="Leasing_Lookup_id" value="#{accountBundle.aon_leasing}" 
							styleClass="aon-form-input-text-label" />
						<t:div>
							<t:inputText id="Leasing_Lookup_id" forceId="#{true}"
								value="#{accountLeasingFee.header.leasing.id}"
								styleClass="aon-form-input-text" size="5"
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','leasingLookup','Leasing_Lookup_id','Leasing_id|Leasing_Lookup_id,Leasing_description|Leasing_Lookup_description,Leasing_supplierName|Leasing_Lookup_supplierName,Leasing_supplierDocument|Leasing_Lookup_supplierDocument');"/>
							<h:commandButton id="find_Leasing_Lookup_id"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								onclick="lookupSearchWindow(this, 'placeList', '#{leasingLookup.encodedSearchPagePath}','Leasing_id|Leasing_Lookup_id,Leasing_description|Leasing_Lookup_description,Leasing_supplierName|Leasing_Lookup_supplierName,Leasing_supplierDocument|Leasing_Lookup_supplierDocument');return false;" />	
							<t:inputText id="Leasing_Lookup_description"
								disabledOnClientSide="true" forceId="#{true}"
								value="#{accountLeasingFee.header.leasing.description}"
								styleClass="aon-form-input-text-disabled" size="40" />
						</t:div>
						
						<h:outputLabel for="Leasing_Lookup_supplierName"
							styleClass="aon-form-input-text-label"
							value="#{accountBundle.aon_leasing_supplier_name}" />
						<t:inputText id="Leasing_Lookup_supplierName"
							value="#{accountLeasingFee.header.leasing.supplierName}" size="60"
							styleClass="aon-form-input-text" forceId="#{true}" />

						<h:outputLabel for="Leasing_Lookup_supplierDocument"
							styleClass="aon-form-input-text-label"
							value="#{accountBundle.aon_leasing_supplier_document}" />
						<t:inputText id="Leasing_Lookup_supplierDocument"
							value="#{accountLeasingFee.header.leasing.supplierDocument}" size="12"
							styleClass="aon-form-input-text" forceId="#{true}" />
							
						<h:outputLabel for="Account_amortization"
							styleClass="aon-form-input-text-label"
							value="#{accountBundle.aon_leasing_amortization}" />
						<t:inputText id="Account_amortization"
							onchange="calculateFee();"
							value="#{accountLeasingFee.header.amortization}" size="7"
							styleClass="aon-form-input-text" forceId="#{true}" />

						<h:outputLabel for="Account_interest"
							styleClass="aon-form-input-text-label"
							value="#{accountBundle.aon_leasing_interest}" />
						<t:inputText id="Account_interest"
							onchange="calculateFee();"
							value="#{accountLeasingFee.header.interest}" size="7"
							styleClass="aon-form-input-text" forceId="#{true}" />

						<h:outputLabel for="Account_taxableBase"
							styleClass="aon-form-input-text-label"
							value="#{accountBundle.aon_leasing_taxableBase}" />
						<t:inputText id="Account_taxableBase"
							value="#{accountLeasingFee.header.taxableBase}" 
							disabledOnClientSide="#{true}" size="7"
							styleClass="aon-form-input-text-disabled" forceId="#{true}" />
<!-- 
						<h:outputLabel for="Account_invoiceTotal"
							styleClass="aon-form-input-text-label"
							value="#{accountBundle.aon_leasing_invoiceTotal}" />
						<t:inputText id="Account_invoiceTotal"
							value="#{accountLeasingFee.invoiceTotal}" 
							disabled="#{true}" size="7"
							styleClass="aon-form-input-text-disabled" forceId="#{true}" />
 -->
						<h:outputLabel for="RegistryBank_Lookup_id"
							styleClass="aon-form-input-text-label"
							value="#{accountBundle.aon_bank}" />
						<t:selectOneMenu id="RegistryBank_Lookup_id"
							styleClass="aon-form-selectOneMenu-field" required="true"
							value="#{accountLeasingFee.header.registryBank.id}" forceId="#{true}"
							onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','rBankLookup','RegistryBank_Lookup_id','RegistryBank_id|RegistryBank_Lookup_id,RegistryBank_bankAccount|RegistryBank_Lookup_bankAccount');"
							valueChangeListener="#{accountLeasingFee.onRBankChange}">
							<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
							<f:selectItems value="#{financeCollections.companyBanks}" />
						</t:selectOneMenu>

						<h:outputLabel for="RegistryBank_Lookup_bankAccount"
							styleClass="aon-form-input-text-label" value="#{financeBundle.aon_bank_account}" />
						<t:inputText id="RegistryBank_Lookup_bankAccount"
							styleClass="aon-form-input-text-disabled" forceId="#{true}"
							value="#{accountLeasingFee.header.registryBank.bankAccount}"
							disabledOnClientSide="true" size="35" />
							
						<h:outputLabel for="AccountEntry_securityLevel"
							value="#{accountBundle.aon_account_security_level}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:selectOneMenu id="AccountEntry_securityLevel"
							styleClass="aon-form-selectOneMenu-field"
							forceId="#{true}" value="#{accountLeasingFee.header.securityLevel}">
							<f:selectItems value="#{accountCollections.securityLevels}" />
						</h:selectOneMenu>

					</h:panelGrid>
					<!-- end of grid layout -->
					<!-- end of bag panel -->
					
					<t:div styleClass="aon-form-group">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="TaxesData"
								value="#{accountBundle.aon_details}" />
						</t:div>

						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="TaxesData" var="to" value="#{accountLeasingFee.details}"
								styleClass="aon-edit-table" headerClass="aon-edit-table-header"
								footerClass="aon-edit-table-footer" rows="20"
								rowOnMouseOver="selectRow( this )"
								rowOnMouseOut="unselectRow( this )" 
								rowOnClick="sendRow( this )"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body-icon,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-string
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,									
									aon-edit-table-body aon-edit-table-body-buttons"
								cellpadding="0" cellspacing="0">
								
								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:commandLink immediate="#{true}"
										styleClass="aon-table-row-selected"
										rendered="#{to!=accountLeasingFee.currentDetail}"
										actionListener="#{accountLeasingFee.onSelectDetail}" />
									<f:facet name="footer">
										<t:div>
											<t:commandButton value=""
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
												title="#{accountBundle.aon_newLine}"
												actionListener="#{accountLeasingFee.onNewDetail}"
												rendered="#{!accountLeasingFee.newDetail}"
												accesskey="#{bundle.aon_key_new_line}" />
										</t:div>
									</f:facet>
								</h:column>
								
								<h:column>
									<f:facet name="header">
										<t:outputText value="#{accountBundle.aon_taxable_base}" />
									</f:facet>
									<t:outputText id="Account_Taxable_Base"
										rendered="#{to!=accountLeasingFee.currentDetail}" 
										value="#{to.taxableBase}" forceId="#{true}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
									<t:inputText id="Item_price_new-New"
										rendered="#{to==accountLeasingFee.currentDetail}" forceId="#{true}"
										value="#{accountLeasingFee.currentDetail.taxableBase}" required="#{true}" />
									<f:facet name="footer">
										<t:div style="text-align:right;">
											<t:inputText id="Item_details_total"
												rendered="#{accountLeasingFee.newDetail}"
												value="#{accountLeasingFee.currentDetail.taxableBase}">
											</t:inputText>
										</t:div>
									</f:facet>
								</h:column>
								
								<h:column>
									<f:facet name="header">
										<h:outputText value="#{accountBundle.aon_vat}" />
									</f:facet>
									<h:outputText value="#{to.vat.name}" rendered="#{to!=accountLeasingFee.currentDetail}" />
									<h:selectOneMenu id="Account_Vat-Edit"
										styleClass="aon-form-selectOneMenu-field" 
										rendered="#{to==accountLeasingFee.currentDetail}" 
										value="#{accountLeasingFee.currentDetail.vat.id}"
										valueChangeListener="#{accountLeasingFee.onTaxChange}">
										<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
										<f:selectItems value="#{productCollections.vatTaxes}" />
									</h:selectOneMenu>
									<f:verbatim>&#160;</f:verbatim>
									<f:facet name="footer">
										<h:selectOneMenu id="Account_Vat-New"
											styleClass="aon-form-selectOneMenu-field" 
											rendered="#{accountLeasingFee.newDetail}" 
											value="#{accountLeasingFee.currentDetail.vat.id}"
											valueChangeListener="#{accountLeasingFee.onTaxChange}">
											<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
											<f:selectItems value="#{productCollections.vatTaxes}" />
										</h:selectOneMenu>
									</f:facet>
								</h:column>
								
								<h:column>
									<f:facet name="header">
										<t:outputText value="#{accountBundle.aon_vat_quota}" />
									</f:facet>
									<t:outputText
										rendered="#{!accountLeasingFee.newDetail}" 
										value="#{to.vatQuota}" forceId="#{true}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
								</h:column>
								
								<h:column>
									<f:facet name="header">
										<t:outputText value="#{accountBundle.aon_surcharge}" />
									</f:facet>
									<t:outputText
										rendered="#{!accountLeasingFee.newDetail}" 
										value="#{to.surcharge}" forceId="#{true}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
								</h:column>
								
								<h:column>
									<f:facet name="header">
										<t:outputText value="#{accountBundle.aon_total}" />
									</f:facet>
									<t:outputText
										rendered="#{!accountLeasingFee.newDetail}" 
										value="#{to.total}" forceId="#{true}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
								</h:column>
								
								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:div rendered="#{to==accountLeasingFee.currentDetail}">
										<t:commandButton title="#{bundle.aon_save}"
											actionListener="#{accountLeasingFee.onUpdateDetail}"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
											value="" accesskey="#{bundle.aon_key_save_line}" />
										<t:commandButton title="#{bundle.aon_cancel}"
											actionListener="#{accountLeasingFee.onCancelDetail}"
											immediate="#{true}"
											onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
											value="" accesskey="#{bundle.aon_key_cancel_line}" />
										<t:commandButton title="#{bundle.aon_remove}"
											actionListener="#{accountLeasingFee.onRemoveDetail}"
											immediate="#{true}"
											onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
											value="" accesskey="#{bundle.aon_key_remove_line}" />
									</t:div>
									<f:facet name="footer">
										<t:div>
											<t:div rendered="#{accountLeasingFee.newDetail}">
												<t:commandButton title="#{bundle.aon_save}"
													actionListener="#{accountLeasingFee.onAddDetail}"
													onclick="return (confirm('#{bundle.aon_accept_confirm}'));"
													styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
													value="" accesskey="#{bundle.aon_key_save_line}" />
												<t:commandButton title="#{bundle.aon_cancel}"
													actionListener="#{accountLeasingFee.onCancelDetail}"
													immediate="#{true}"
													onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
													styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
													value="" accesskey="#{bundle.aon_key_cancel_line}" />
											</t:div>
										</t:div>
									</f:facet>
								</h:column>
									
							</t:dataTable>	
						</t:div>
					</t:div>
					
				</t:div>
			</t:div>
		</h:form>
		<script>
			function calculateFee() {
				amortization = document.getElementById("Account_amortization").value;
				interest = document.getElementById("Account_interest").value;
				taxableBase = document.getElementById("Account_taxableBase").value;
				taxableBase = eval(amortization + "+" + interest);
				document.getElementById("Account_taxableBase").value = taxableBase;
				document.getElementById("Account_taxableBase").onchange();
			}
			calculateFee();
		</script>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
