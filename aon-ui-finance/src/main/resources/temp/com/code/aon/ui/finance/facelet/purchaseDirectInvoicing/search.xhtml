<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="purchaseDirectInvoicingSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_purchase_invoice_management_module}" />
				<ui:param name="controller" value="#{purchaseDirectInvoicing}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{purchaseDirectInvoicing}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="Invoice_referenceCode"
						value="#{financeBundle.finance_invoice_number}" />
					<aon:inputText id="Invoice_referenceCode"
						onblur="toUpperCase(this);"
						valueChangeListener="#{purchaseDirectInvoicing.addExpression}"
						size="25" maxlength="32"/>

					<aon:outputLabel for="Supplier_id"
						value="#{supplierBundle.supplier_supplier}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Supplier_id" lookup="#{supplierLookup}"
							reRender="Supplier_full_name"
							value="#{purchaseDirectInvoicingSearch.supplier.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{supplierBundle.supplier_selection}"
							selectReRender="Supplier_id,Supplier_full_name" actionType="search"
							lookup="#{supplierLookup}" minHeight="460" minWidth="650"
							property="#{purchaseDirectInvoicingSearch.supplier}">
						</aon:lookupButton>
						<aon:inputText id="Supplier_full_name"
							value="#{(purchaseDirectInvoicingSearch.supplier.registry.name!=null)?(purchaseDirectInvoicingSearch.supplier.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>

					<aon:outputLabel 
						value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Invoice_fromDate" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Invoice_fromDate"
							value="#{purchaseDirectInvoicingSearch.issueDateFrom}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="Invoice_toDate" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Invoice_toDate"
							value="#{purchaseDirectInvoicingSearch.issueDateTo}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>	
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />		
	</ui:define>
	
</ui:composition>
