<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="showInvoiceType" default="#{false}"/>
	<aon:valueParam name="currentUserScopes" default="#{configCollections.currentUserScopes}" />

	<aon:if test="#{showInvoiceType}">
		<aon:outputLabel for="Invoice_type"
			value="#{bundle.aon_type}" />
		<aon:selectOneMenu id="Invoice_type"
			actionListener="#{searchController.onResetRegistry}"
			reRender="invoiceSearch" ajaxSingle="false"
			value="#{searchController.defaultType}">
			<f:selectItem itemLabel="#{bundle.aon_sales}" itemValue="SALES" />
			<f:selectItem itemLabel="#{bundle.aon_purchases}" itemValue="PURCHASE" />
			<f:selectItem itemLabel="#{bundle.aon_expenses}" itemValue="EXPENSES" />
			<f:selectItem itemLabel="#{bundle.finance_undeductible_invoice_management_module}" itemValue="UNDEDUCTIBLE" />
		</aon:selectOneMenu>			
	</aon:if>							

	<aon:outputLabel for="Invoice_referenceCode"
		value="#{bundle.aon_invoice_number}" />
	<aon:inputText id="Invoice_referenceCode"
		valueChangeListener="#{controller.addExpression}"
		size="25" maxlength="25" />

	<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
		<ui:param name="lookupTo" value="#{searchController.registry}" />
		<ui:param name="lookupForRegistry" value="#{true}" />
		<ui:param name="lookupRendered" value="#{searchController.sales}" />
		<ui:param name="lookupSuffix" value="Invoice" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml">
		<ui:param name="lookupTo" value="#{searchController.seller}" />
		<ui:param name="lookupRendered" value="#{searchController.sales}" />
		<ui:param name="lookupSuffix" value="Invoice" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
		<ui:param name="lookupTo" value="#{searchController.registry}" />
		<ui:param name="lookupForRegistry" value="#{true}" />
		<ui:param name="lookupRendered" value="#{searchController.purchase}" />
		<ui:param name="lookupSuffix" value="Invoice" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<ui:include src="/com/code/aon/ui/finance/facelet/creditor/lookup.xhtml">
		<ui:param name="lookupTo" value="#{searchController.registry}" />
		<ui:param name="lookupForRegistry" value="#{true}" />
		<ui:param name="lookupRendered" value="#{searchController.expenses or searchController.undeductible}" />
		<ui:param name="lookupSuffix" value="Invoice" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>
	
	<ui:include src="/com/code/aon/ui/project/facelet/project/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{searchController.project}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<aon:outputLabel value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="Invoice_issueDate-From" styleClass="aon-form-date-label aon-padding-right" 
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Invoice_issueDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />

		<aon:outputLabel for="Invoice_issueDate-To" styleClass="aon-form-date-label aon-padding-right" 
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Invoice_issueDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />
	</aon:div>

	<aon:outputLabel value="#{bundle.aon_document_number}" />
	<aon:div>
		<aon:outputLabel for="Invoice_series-Document" rendered="#{searchController.sales}"
			styleClass="aon-form-date-label aon-margin-right" value="E-" />
		<aon:outputLabel for="Invoice_series-Document" rendered="#{searchController.purchase or searchController.expenses}"
			styleClass="aon-form-date-label aon-margin-right" value="R-" />
		<aon:outputLabel for="Invoice_series-Document" rendered="#{searchController.undeductible}"
			styleClass="aon-form-date-label aon-margin-right" value="G-" />

		<aon:inputText id="Invoice_series-Document"
			onblur="toUpperCase(this);"
			valueChangeListener="#{controller.addExpression}"
			size="6" maxlength="5" />
		<aon:outputLabel for="Invoice_number-Document"
			styleClass="aon-form-date-label aon-margin-right" value="-" />
		<aon:inputText id="Invoice_number-Document"
			valueChangeListener="#{controller.addExpression}"
			size="8" />
	</aon:div>

	<aon:outputLabel value="#{bundle.stat_total}" />
	<aon:inputText id="Invoice_total"
		valueChangeListener="#{controller.addExpression}"
		size="10" />

	<aon:if test="#{currentUserScopes[1] != null}">
		<aon:outputLabel for="Invoice_scope_id"
			value="#{bundle.aon_scope}" />
		<aon:selectOneMenu id="Invoice_scope_id"
			value="#{configCollections.scope}"
			valueChangeListener="#{controller.addIdEqualExpression}">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{currentUserScopes}" />
		</aon:selectOneMenu>
	</aon:if>					

	<aon:if test="#{!searchController.sales}">
		<aon:outputLabel for="Invoice_investment"
			value="#{bundle.accounting_investment}" />
		<aon:selectOneRadio id="Invoice_investment"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneRadio>				
	</aon:if>

	<aon:if test="#{aonRole.confidentiality}">
		<aon:outputLabel for="Invoice_securityLevel"
			value="#{bundle.aon_confidential}" />
		<aon:selectOneRadio id="Invoice_securityLevel"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
		</aon:selectOneRadio>				
	</aon:if>

	<aon:if test="#{company.EInvoice}">
		<aon:outputLabel for="Invoice_signed" value="#{bundle.finance_signed}" />
		<aon:selectOneRadio id="Invoice_signed"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneRadio>				
	</aon:if>

	<aon:if test="#{aonRole.accountingOperator and searchController.defaultStatus == null}">
		<aon:outputLabel for="Invoice_status" value="#{bundle.finance_invoice_recorded}" />
		<aon:selectOneRadio id="Invoice_status"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
		</aon:selectOneRadio>				
	</aon:if>

</ui:composition>
