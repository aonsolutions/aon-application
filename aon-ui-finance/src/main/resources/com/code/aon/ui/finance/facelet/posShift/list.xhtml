<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posShiftList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.report_posShift_list}" />
				<ui:param name="controller" value="#{posShift}" />
				<ui:param name="skipResetButton" value="#{!aonRole.auditor}" />

				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="posShift_list-excel"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						value="&#160;" target="_blank" 
						action="#{report.onExecute}">
						<f:param name="reportKey" value="posShiftList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="posShift_list"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="posShiftList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{posShift}" />
					<ui:define name="columns">
 
						<aon:column alias="PosShift.pos.workPlace.description" 
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.purchase_workplace}" />
							</f:facet>
							<aon:outputText value="#{to.pos.workPlace.description}" />
						</aon:column>

						<aon:if test="#{companyCollections.departmentsCount > 0}">
							<aon:column alias="PosShift.pos.department.name" 
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.purchase_department}" />
								</f:facet>
								<aon:outputText value="#{to.pos.department.name}" />
							</aon:column>
						</aon:if>

						<aon:column alias="PosShift.pos.name" 
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_pos}" />
							</f:facet>
							<aon:outputText value="#{to.pos.name}" />
						</aon:column>

						<aon:column alias="PosShift.shift"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_shift}" />
							</f:facet>
							<aon:outputText value="#{to.shift}" />
						</aon:column>

						<aon:column alias="PosShift.startTime"
							styleClass="aon-editDataTable-dateColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_opening}" />
							</f:facet>
							<aon:outputText value="#{to.startTime}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="PosShift.endTime"
							styleClass="aon-editDataTable-dateColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_closing}" />
							</f:facet>
							<aon:outputText value="#{to.endTime}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column 
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_imbalances}" />
							</f:facet>
							<aon:div>
								<aon:div style="display:inline; padding-left:2px;" rendered="#{!controller.countCashOk}">
									<aon:outputText value="&#160;" styleClass="aon-icon-cash"
										style="padding-left:12px" />
								</aon:div>
								<aon:div style="display:inline; padding-left:2px;" rendered="#{!controller.countCardOk}">
									<aon:outputText value="&#160;" styleClass="aon-icon-card"
										style="padding-left:12px" />
								</aon:div>
								<aon:div style="display:inline; padding-left:2px;" rendered="#{!controller.countChequeOk}">
									<aon:outputText value="&#160;" styleClass="aon-icon-cheque"
										style="padding-left:12px" />
								</aon:div>
								<aon:div style="display:inline; padding-left:2px;" rendered="#{!controller.countTransferOk}">
									<aon:outputText value="&#160;" styleClass="aon-icon-bank"
										style="padding-left:12px" />
								</aon:div>
							</aon:div>
						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
