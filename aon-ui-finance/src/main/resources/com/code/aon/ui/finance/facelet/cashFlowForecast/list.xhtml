<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.finance_cashflow_forecast_module}" />
				<ui:param name="controller" value="#{cashFlowForecast}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="cashFlowForecast-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="cashFlowForecastList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="cashFlowForecast-report"
						value="#{bundle.aon_listing}" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="cashFlowForecastList" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{cashFlowForecast}" />

					<ui:define name="columns">
					
						<aon:column alias="CashFlowForecast.description"
							styleClass="aon-editDataTable-textColumn aon-nowrap">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" style="font-size: 0.9em;"/>
						</aon:column>

						<aon:column alias="CashFlowForecast.startDate"
							styleClass="aon-editDataTable-dateColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date_from}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="CashFlowForecast.dueDate"
							styleClass="aon-editDataTable-dateColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date_to}" />
							</f:facet>
							<aon:outputText value="#{to.dueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="CashFlowForecast.amount"
							styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_amount}"/>
							</f:facet>
							<aon:outputText value="#{to.amount}" 
								style="color: #{to.payment?'red':'green'};">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="CashFlowForecast.paymentDay"
							styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="D" />
							</f:facet>
							<aon:outputText value="#{to.paymentDay}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="1" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.january)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="2" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.february)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="3" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.march)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="4" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.april)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="5" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.may)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="6" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.june)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="7" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.july)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>


						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="8" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.august)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="9" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.september)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="10" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.october)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="11" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.november)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="12" />
							</f:facet>
							<aon:outputText value="&#160;"
								style="margin: 0px; padding-top: 2px; padding-bottom: 2px;"
								styleClass="#{(to.december)?'aon-icon aon-icon-checked':'aon-icon'}"/>
						</aon:column>

						<aon:column alias="CashFlowForecast.registryBank.id"
							styleClass="aon-editDataTable-textColumn aon-nowrap">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_bank}" />
							</f:facet>
							<aon:outputText value="#{to.registryBank.fullName}" style="font-size: 0.9em;">
								<aon:abbreviateConverter maxWidth="40" />
							</aon:outputText>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
