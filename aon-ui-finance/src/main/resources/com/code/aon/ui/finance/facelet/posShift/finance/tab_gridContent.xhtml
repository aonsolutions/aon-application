<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:column styleClass="aon-editDataTable-dateColumn aon-width-70">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.invoice.issueDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_invoice_number}" />
		</f:facet>
		<aon:outputText value="#{to.invoice.referenceCode}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_customer}" />
		</f:facet>
		<aon:outputText value="#{to.invoice.registryName}" />
	</aon:column>

	<aon:if test="#{actionDenied.moduleEnabled['hotel']}">
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_source}" />
			</f:facet>
			<aon:outputText value="#{bundle.finance_direct}" rendered="#{to.invoice.project.id == null and !to.invoice.service and !to.invoice.advance}" />
			<aon:outputText value="#{bundle.aon_reservation}" rendered="#{to.invoice.project.id != null and !to.invoice.service and !to.invoice.advance}" />
			<aon:outputText value="#{bundle.finance_service}" rendered="#{to.invoice.service}" />
			<aon:outputText value="#{bundle.finance_money_advance}" rendered="#{to.invoice.advance}" />
			<aon:commandLink id="reservationLink" immediate="true"
				styleClass="aon-button-goto" style="padding-right: 20px;" 
				value="&#160;" title="#{bundle.aon_go}"
				rendered="#{to.invoice.project.id != null}" 
				action="reservation_form"
				actionListener="#{controller.onLoadReservation}"
				reRender="aonContent">
			</aon:commandLink>
		</aon:column>
	</aon:if>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_type}" />
		</f:facet>
		<aon:outputText value="#{bundle.finance_invoice}"
			rendered="#{!to.invoice.rectifier and !to.invoice.rectified}" />
		<aon:div rendered="#{to.invoice.rectifier}">
			<aon:outputText value="#{to.invoice.rectificationType}" />
			<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250">
				<aon:outputFormat value="#{bundle.finance_invoice_rectifier_message2}" styleClass="aon-bold aon-label-error">
					<f:param value="#{to.invoice.rectificationInvoice.referenceCode}" />
				</aon:outputFormat>
			</rich:toolTip>
		</aon:div>
		<aon:div rendered="#{to.invoice.rectified}">
			<aon:outputText value="#{to.invoice.rectificationType}" />
			<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250">
				<aon:outputFormat value="#{bundle.finance_invoice_rectified_message2}" styleClass="aon-bold">
					<f:param value="#{to.invoice.rectificationInvoicesString}" />
				</aon:outputFormat>
			</rich:toolTip>
		</aon:div>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.finance_payMethod}" />
		</f:facet>
		<aon:outputText value="#{controller.financePayMethod}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.finance_checking_finance_status_abbrv}" />
		</f:facet>
		<aon:outputText value="#{to.financeStatus}"/>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-numberColumn aon-width-70">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_total}" />
		</f:facet>
		<aon:outputText value="#{to.totalAmount}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
	</aon:column>

	<aon:column	styleClass="aon-editDataTable-textColumn aon-width-40 aon-vertical-align-top">
		<f:facet name="header">
			<aon:outputText value="&#160;" />
		</f:facet>
		<aon:if test="#{aonRole.financeOperator}">
			<aon:commandLink id="invoiceLink" immediate="true"
				styleClass="aon-button-goto" style="padding-right: 15px;" 
				value="&#160;" title="#{bundle.aon_go}"
				action="saleInvoice_form"
				actionListener="#{controller.onLoadInvoice}"
				reRender="aonContent">
			</aon:commandLink>
		</aon:if>
		<aon:if test="#{aonRole.admin}">
			<aon:confirmButton id="invoiceUnbind" immediate="true" 
				styleClass="aon-editDataTable-button aon-icon-delete aon-noborder"
				title="#{bundle.finance_pos_shift_unbind_invoice}"
				confirmTitle="#{bundle.aon_confirm_title}"
				confirmMessage="#{bundle.finance_pos_shift_unbind_invoice_confirm}"
				confirmActionListener="#{controller.onUnbindInvoice}" />
		</aon:if>
		<aon:if test="#{!aonRole.financeOperator}">
			<aon:htmlCommandLink id="invoiceReport" target="_blank"
				styleClass="aon-icon-pdf"
				value="&#160;&#160;&#160;&#160;&#160;&#160;" 
				title="#{bundle.aon_report}"
				action="#{saleInvoiceSigner.onReport}"
				actionListener="#{controller.onPrintInvoice}">
				<aon:actionListener method="#{printParams.onInit}" />
				<f:param name="reportKey" value="#{printParams.saleInvoiceParams.saleInvoiceTemplateValue}" />
				<f:setPropertyActionListener target="#{saleInvoiceSigner.reportKey}"
					value="#{printParams.saleInvoiceParams.saleInvoiceTemplateValue}" />
			</aon:htmlCommandLink>
		</aon:if>
	</aon:column>

</ui:composition>
