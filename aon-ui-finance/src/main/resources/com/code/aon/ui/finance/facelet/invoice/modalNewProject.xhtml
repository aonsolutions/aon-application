<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showNewProjectWindow">
		<aon:if test="#{invoiceController.showNewProjectWindow}">
			<rich:modalPanel id="newPprojectModalPanel"
				minWidth="950" minHeight="400" zindex="90"
				showWhenRendered="#{invoiceController.showNewProjectWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_project}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showNewProjectWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showNewProjectWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="newProjectForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="project-accept"
											value="#{bundle.aon_accept}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<aon:actionListener method="#{projectController.accept}"/>
											<aon:actionListener method="#{invoiceController.loadInvoiceProjects}"/>
											<rich:componentControl for="newProjectModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{invoiceController.showNewProjectWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="project-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showNewProjectWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{invoiceController.showNewProjectWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">
										
											<ui:include src="/com/code/aon/ui/project/facelet/project/form_content.xhtml" >
												<ui:param name="controller" value="#{projectController}" />
											</ui:include>
											
										</aon:panelGrid>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
