<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="prepaymentForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_prepayment_module}" />
				<ui:param name="controller" value="#{prepayment}" />
				<ui:param name="skipSaveButton" value="#{prepayment.paymentReadOnly and prepayment.chargeReadOnly}" />
				<ui:param name="skipRemoveButton" value="#{prepayment.paymentReadOnly or prepayment.chargeReadOnly}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" cellpadding="5" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-width-half aon-vertical-align-top,aon-width-half aon-vertical-align-top">
					<aon:div>
						<aon:div styleClass="aon-group">
							<aon:div styleClass="aon-group-title">
								<aon:outputText value="Pago del Suplido"/>
							</aon:div>
							<aon:div styleClass="aon-group-body"> 
								<aon:div styleClass="aon-group-body-internal">
									<aon:panelGrid columns="2" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">
			
										<aon:outputLabel for="Creditor_id" value="#{bundle.aon_creditor}" />
										<ui:include src="/com/code/aon/ui/finance/facelet/creditor/lookup.xhtml">
											<ui:param name="lookupTo" value="#{prepayment.to.creditor}" />
											<ui:param name="skipLabel" value="#{true}" />						
											<ui:param name="lookupRendered" value="#{prepayment.nevv}" />
											<ui:param name="lookupReRender" value="Prepayment_finance_payMethod,Prepayment_finance_bankAccount_div" />
											<ui:param name="idRequired" value="#{true}" />						
											<aon:methodParam name="lookupChangeListener"
												value="#{prepayment.onCreditorChanged}" type="lookupChangeListener" />
										</ui:include>
										<aon:outputText	value="#{prepayment.to.creditor.registry.fullName}"
											rendered="#{!prepayment.nevv}" />

										<aon:outputLabel for="Prepayment_finance_dueDate" value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Prepayment_finance_dueDate"
											value="#{prepayment.to.finance.dueDate}" required="true"
											rendered="#{!prepayment.paymentReadOnly}"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}" />
										<aon:outputText	value="#{prepayment.to.finance.dueDate}"
											rendered="#{prepayment.paymentReadOnly}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>

										<aon:outputLabel for="Prepayment_finance_concept" value="#{bundle.aon_concept}" />
										<aon:inputText id="Prepayment_finance_concept" 
											value="#{prepayment.to.finance.concept}" 
											rendered="#{!prepayment.paymentReadOnly}"
											size="45" maxlength="32" required="true" />
										<aon:outputText	value="#{prepayment.to.finance.concept}"
											rendered="#{prepayment.paymentReadOnly}" />
			
										<aon:outputLabel for="Prepayment_finance_amount" value="#{bundle.aon_amount}" />
										<aon:div>
											<aon:inputText id="Prepayment_finance_amount"
												value="#{prepayment.to.finance.amount}"
												rendered="#{!prepayment.paymentReadOnly}"
												size="10" maxlength="10" required="true" />
											<aon:outputText	value="#{prepayment.to.finance.amount}"
												rendered="#{prepayment.paymentReadOnly}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
											<aon:if test="#{aonRole.confidentiality}">
												<aon:selectBooleanCheckbox id="Prepayment_finance_securityLevel"
													styleClass="aon-margin-left"
													value="#{prepayment.to.finance.confidential}"
													rendered="#{!prepayment.paymentReadOnly}" />
												<aon:outputText styleClass="aon-italic aon-margin-right"
													value="#{bundle.aon_confidential}"
													rendered="#{!prepayment.paymentReadOnly}" />
												<aon:outputText styleClass="aon-icon aon-icon-confidential aon-margin-left"
													value="&#160;" title="#{bundle.aon_confidential}"
													rendered="#{prepayment.paymentReadOnly and prepayment.to.finance.confidential}" />
											</aon:if>
										</aon:div>

										<aon:outputLabel for="Prepayment_finance_payMethod" value="#{bundle.finance_payMethod}" />
										<aon:selectOneMenu id="Prepayment_finance_payMethod"
											value="#{prepayment.to.finance.payMethod}" required="true"
											rendered="#{!prepayment.paymentReadOnly}"
											valueChangeListener="#{prepayment.onPayMethodChanged}"
											reRender="Prepayment_finance_bankAccount_div" ajaxSingle="true">
											<f:selectItem itemLabel=" - " itemValue="#{null}" />
											<f:selectItems value="#{configCollections.payMethods}" />
										</aon:selectOneMenu>
										<aon:outputText	value="#{prepayment.to.finance.payMethod.name}"
											rendered="#{prepayment.paymentReadOnly}" />

										<aon:outputLabel value="#{bundle.aon_iban}" />
										<aon:div id="Prepayment_finance_bankAccount_div" styleClass="aon-nowrap"
											rendered="#{!prepayment.paymentReadOnly}">
											<aon:panelGroup id="Prepayment_finance_bankAccount" rendered="#{prepayment.showBankManualInput}">
												<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
													<ui:param name="bankAccountController" value="#{prepayment.accountHelper}" />
													<ui:param name="bankAccountPrefix" value="Prepayment" />
													<ui:param name="bankCodeChangeReRender" value="Prepayment_bankAlias,Prepayment_bic" />
												</ui:include>
 												<aon:commandLink id="BankAccount_hide_bank_manual"
													styleClass="aon-icon-edit-end-simple" style="margin-left: 5px; padding-right: 12px;"
													value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
													rendered="#{prepayment.showBankManualInput}"  
													actionListener="#{prepayment.onBankManualInput}"
													reRender="Prepayment_finance_bankAccount_div" ajaxSingle="true">
													<f:setPropertyActionListener target="#{prepayment.showBankManualInput}"
														value="#{false}" />
												</aon:commandLink>
											</aon:panelGroup>
											<aon:div>
												<aon:div style="margin-top:2px;" rendered="#{prepayment.showBankManualInput}">
													<aon:outputLabel for="Prepayment_bankAlias" styleClass="aon-margin-right"
														value="#{bundle.aon_bank}" />
													<aon:inputText id="Prepayment_bankAlias"
														value="#{prepayment.to.finance.bankAlias}" 
														required="true" size="25" maxlength="25" />
													<aon:outputLabel for="Prepayment_bic" styleClass="aon-margin-left aon-margin-right"
														value="#{bundle.aon_bic}" />
													<aon:inputText id="Prepayment_bic"
														value="#{prepayment.to.finance.bic}" validator="BICValidator" 
														required="true" size="12" maxlength="11">
													</aon:inputText>
												</aon:div>

												<aon:selectOneMenu id="Prepayment_registryBank"
													value="#{prepayment.registryBank}"
													rendered="#{!prepayment.showBankManualInput}"
													valueChangeListener="#{prepayment.onRBankChanged}"
													reRender="Prepayment_registryBank" ajaxSingle="true">
													<f:selectItem value="#{null}" />
													<aon:if test="#{prepayment.nevv or prepayment.registryBank.id == null or prepayment.registryBank.active}">
														<f:selectItems value="#{prepayment.activeBanks}" />
													</aon:if>
													<aon:if test="#{!prepayment.nevv and prepayment.registryBank.id != null and !prepayment.registryBank.active}">
														<f:selectItems value="#{prepayment.allBanks}" />
													</aon:if>
												</aon:selectOneMenu>
												<aon:commandLink id="BankAccount_show_bank_manual"
													styleClass="aon-icon-edit-add-simple" style="margin-left: 5px; padding-right: 12px;"
													value="&#160;" title="#{bundle.aon_edit}"
													rendered="#{!prepayment.showBankManualInput}"  
													actionListener="#{prepayment.onBankManualInput}"
													reRender="Prepayment_finance_bankAccount_div" ajaxSingle="true">
													<f:setPropertyActionListener target="#{prepayment.showBankManualInput}"
														value="#{true}" />
												</aon:commandLink>
											</aon:div>
										</aon:div>
										<aon:div styleClass="aon-nowrap" rendered="#{prepayment.paymentReadOnly}">
											<aon:outputText	value="#{prepayment.registryBank.alias}"
												rendered="#{prepayment.registryBank != null and prepayment.registryBank.alias != null}" />
											<aon:outputText	styleClass="aon-margin-left" 
												value="#{prepayment.to.finance.bankAccount}" />
										</aon:div>

										<aon:outputText value="#{bundle.aon_status}" 
											rendered="#{!prepayment.nevv}" />
										<aon:div rendered="#{!prepayment.nevv}">
											<aon:outputText value="#{prepayment.to.finance.financeStatus}" />
											<aon:commandLink id="Prepayment_finance_link" immediate="true"
												styleClass="aon-button-goto" style="padding-right: 12px;"
												value="&#160;" title="#{bundle.aon_go}" 
												actionListener="#{prepayment.onLoadFinance}"
												action="finance_form"
												reRender="aonContent" />
										</aon:div>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>

					<aon:div>
						<aon:div styleClass="aon-group">
							<aon:div styleClass="aon-group-title">
								<aon:outputText value="Cobro al Cliente"/>
							</aon:div>
							<aon:div styleClass="aon-group-body"> 	
								<aon:div styleClass="aon-group-body-internal">
									<aon:panelGrid columns="2" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">

										<aon:outputLabel for="Customer_id" value="#{bundle.aon_customer}" />
										<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
											<ui:param name="lookupTo" value="#{prepayment.to.customer}" />
											<ui:param name="skipLabel" value="#{true}" />						
											<ui:param name="lookupRendered" value="#{!prepayment.chargeReadOnly}" />
											<ui:param name="lookupReRender" value="CustomerFeeProjectDiv,CustomerFeeInvoicingGroupDiv" />
											<ui:param name="idRequired" value="#{true}" />						
											<aon:methodParam name="lookupChangeListener"
												value="#{prepayment.onCustomerChanged}" type="lookupChangeListener" />
										</ui:include>
										<aon:outputText	value="#{prepayment.to.customer.registry.fullName}"
											rendered="#{prepayment.chargeReadOnly}" />

										<aon:outputLabel for="Prepayment_customerFee_item" value="#{bundle.aon_product}" />
										<aon:selectOneMenu id="Prepayment_customerFee_item"
											value="#{prepayment.customerFee.item}" required="true"
											rendered="#{!prepayment.chargeReadOnly}"
											valueChangeListener="#{prepayment.onItemChanged}"
											reRender="Prepayment_customerFee_description">
											<f:selectItems value="#{productCollections.prepaymentItems}" />
										</aon:selectOneMenu>
										<aon:outputText	value="#{prepayment.invoiceDetail.item.fullName}"
											rendered="#{prepayment.chargeReadOnly}" />

										<aon:outputLabel for="Prepayment_customerFee_description" value="#{bundle.aon_description}" />
										<aon:panelGroup id="CustomerFeeDescriptionPanel" styleClass="aon-nowrap aon-vertical-align-top"
											rendered="#{!prepayment.chargeReadOnly}">
											<aon:inputTextarea id="Prepayment_customerFee_description"
												style="#{!prepayment.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}"
												value="#{prepayment.customerFee.description}"
												cols="75" rows="#{!prepayment.longDescription?1:5}"
												valueChangeListener="#{prepayment.onDescriptionChanged}"
												reRender="CustomerFeeDescriptionPanel">
												<f:validateLength maximum="1024" />
											</aon:inputTextarea>
											<aon:commandLink id="CustomerFee_description_short" immediate="true"
												value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
												styleClass="aon-icon-edit-end-simple" style="margin-left: 5px; padding-right: 12px;"
												rendered="#{prepayment.longDescription}"
												actionListener="#{prepayment.onShortDescription}" 
												reRender="CustomerFeeDescriptionPanel" ajaxSingle="true" />
											<aon:commandLink id="CustomerFee_description_long" immediate="true"
												value="&#160;" title="#{bundle.aon_edit}"
												styleClass="aon-icon-edit-add-simple" style="margin-left: 5px; padding-right: 12px;"
												rendered="#{!prepayment.longDescription}"
												actionListener="#{prepayment.onLongDescription}"
												reRender="CustomerFeeDescriptionPanel" ajaxSingle="true" />
										</aon:panelGroup>
										<aon:outputText	value="#{prepayment.invoiceDetail.description}"
											rendered="#{prepayment.chargeReadOnly}" />

										<aon:outputLabel for="Prepayment_customerFee_billingDateYear" value="#{bundle.finance_fee_billing_date_abrv}" />
										<aon:div styleClass="aon-nowrap">
											<aon:selectOneMenu value="#{prepayment.customerFee.billingDateMonth}"
												rendered="#{!prepayment.chargeReadOnly}">
												<f:selectItems value="#{commonCollections.months}" />
											</aon:selectOneMenu>
											<aon:inputText id="Prepayment_customerFee_billingDateYear" 
												value="#{prepayment.customerFee.billingDateYear}"
												required="true" size="3" maxlength="4"
												rendered="#{!prepayment.chargeReadOnly}" />
											<aon:outputText	value="#{prepayment.invoiceDetail.invoice.issueDate}"
												rendered="#{prepayment.chargeReadOnly}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>

											<aon:if test="#{aonRole.confidentiality}">
												<aon:selectBooleanCheckbox id="Prepayment_customerFee_securityLevel"
													styleClass="aon-margin-left"
													value="#{prepayment.customerFee.confidential}"
													rendered="#{!prepayment.chargeReadOnly}" />
												<aon:outputText styleClass="aon-italic aon-margin-right"
													value="#{bundle.aon_confidential}"
													rendered="#{!prepayment.chargeReadOnly}" />
												<aon:outputText styleClass="aon-icon aon-icon-confidential aon-margin-left" 
													value="&#160;" title="#{bundle.aon_confidential}"
													rendered="#{prepayment.chargeReadOnly and prepayment.invoiceDetail.invoice.confidential}" />
											</aon:if>
											<aon:outputLabel for="Prepayment_customerFee_finalDate" value="#{bundle.aon_date_to}"
													styleClass="aon-margin-right aon-bold" />
			
											<aon:selectInputDate id="Prepayment_customerFee_finalDate"
													value="#{prepayment.customerFee.finalDate}" 
													timeZone="#{timeZoneController.timeZone}"
													popupDateFormat="#{bundle.aon_date_pattern}" />
										</aon:div>

										<aon:outputLabel for="Prepayment_customerFee_project_id" value="#{bundle.aon_project}"
											rendered="#{!prepayment.chargeReadOnly or prepayment.invoiceDetail.project.id != null}" />
										<aon:div id="CustomerFeeProjectDiv" rendered="#{!prepayment.chargeReadOnly}">
											<aon:selectOneMenu id="Prepayment_customerFee_project_id"
												rendered="#{prepayment.customerFee.project.id == null}"
												value="#{prepayment.customerFee.project}">
												<f:selectItem itemLabel="-" value="#{null}" />
												<f:selectItems value="#{prepayment.projects}" />
											</aon:selectOneMenu>
											<aon:outputText styleClass="aon-bold"
												value="#{prepayment.customerFee.project.name}" 
												rendered="#{prepayment.customerFee.project.id != null}" />
											<aon:div layout="inline" styleClass="aon-margin-left">
												<aon:commandButton id="removeCustomerFeeProject" 
													value="&#160;" title="#{bundle.aon_remove}" 
													styleClass="aon-icon-commandButton aon-icon-delete"
													rendered="#{prepayment.customerFee.project.id != null}"
													actionListener="#{prepayment.removeProject}" 
													reRender="CustomerFeeProjectDiv" />
											</aon:div>
										</aon:div>
										<aon:outputText	value="#{prepayment.invoiceDetail.project.name}"
											rendered="#{prepayment.chargeReadOnly and prepayment.invoiceDetail.project.id != null}" />

										<aon:outputLabel for="InvoicingGroup_id" value="#{bundle.customer_invoicingGroup}"
											rendered="#{!prepayment.chargeReadOnly}" />
										<aon:outputLabel value="#{bundle.aon_holder}"
											rendered="#{prepayment.chargeReadOnly}" />
										<aon:div id="CustomerFeeInvoicingGroupDiv" rendered="#{!prepayment.chargeReadOnly}">
											<aon:if test="#{prepayment.customerFee.invoicingGroup.id == null or prepayment.invoicingGroupInMyScopes}">
												<ui:include src="/com/code/aon/ui/customer/facelet/invoicingGroup/lookup.xhtml">
													<ui:param name="lookupTo" value="#{prepayment.customerFee.invoicingGroup}" />
													<ui:param name="skipLabel" value="#{true}" />
												</ui:include>
											</aon:if>
											<aon:if test="#{prepayment.customerFee.invoicingGroup.id != null and !prepayment.invoicingGroupInMyScopes}">
												<aon:outputText	value="#{prepayment.customerFee.invoicingGroup.customer.registry.fullName}" />
											</aon:if>
										</aon:div>
										<aon:outputText	value="#{prepayment.invoiceDetail.invoice.registryName}"
											rendered="#{prepayment.chargeReadOnly}" />

										<aon:if test="#{companyCollections.currentUserWorkPlacesCount > 1}">
											<aon:outputLabel for="Prepayment_customerFee_workPlace" value="#{bundle.purchase_workplace}" />
											<aon:selectOneMenu id="Prepayment_customerFee_workPlace" 
												value="#{prepayment.customerFee.workPlace}"
												rendered="#{!prepayment.chargeReadOnly}">
												<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
											</aon:selectOneMenu>
											<aon:outputText	value="#{prepayment.invoiceDetail.workPlace.description}"
												rendered="#{prepayment.chargeReadOnly}" />
										</aon:if>

										<aon:outputText value="#{bundle.aon_status}"
											rendered="#{!prepayment.nevv}" />
										<aon:div rendered="#{!prepayment.nevv}">
											<aon:outputText value="#{bundle.aon_pending}" rendered="#{!prepayment.chargeReadOnly}" />
											<aon:commandLink id="Prepayment_customer_link" immediate="true"
												styleClass="aon-button-goto" style="padding-right: 12px;"
												value="&#160;" title="#{bundle.aon_go}"
												rendered="#{!prepayment.chargeReadOnly}"
												actionListener="#{prepayment.onLoadCustomer}"
												action="customer_form"
												reRender="aonContent" />
											<aon:outputText value="#{bundle.finance_invoiced}" rendered="#{prepayment.chargeReadOnly}" />
											<aon:commandLink id="Prepayment_invoice_link" immediate="true"
												styleClass="aon-button-goto" style="padding-right: 12px;"
												value="&#160;" title="#{bundle.aon_go}"
												rendered="#{prepayment.chargeReadOnly}"
												actionListener="#{prepayment.onLoadInvoice}"
												action="saleInvoice_form"
												reRender="aonContent" />
										</aon:div>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>

				</aon:panelGrid>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{invoicingGroupLookup}" />
		<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
			<ui:param name="bankAccountController" value="#{prepayment.accountHelper}" />
			<ui:param name="modalReRender" value="Prepayment_finance_bankAccount_div" />
		</ui:include>				
	</ui:define>
</ui:composition>
