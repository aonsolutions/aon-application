<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showRectificationWindow">
		<aon:if test="#{invoiceController.showRectificationWindow}">
			<rich:modalPanel id="rectificationModalPanel"
				minHeight="260" minWidth="680" zindex="90"
				showWhenRendered="#{invoiceController.showRectificationWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.finance_rectify}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showRectificationWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showRectificationWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="rectificationForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="rectification-accept"
										value="#{bundle.finance_rectify}"
										actionListener="#{invoiceController.onRectify}"
										action="#{invoiceController.rectificationRedirect}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="rectificationModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{invoiceController.showRectificationWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="rectification-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showRectificationWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{invoiceController.showRectificationWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 80%;">

										<aon:if test="#{invoiceController.to.sales}">
											<aon:outputLabel for="Invoice_rectification_number"
												value="#{bundle.aon_invoice_number}" />
											<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
												<ui:param name="sfc_seriesCodes" value="#{configCollections.rectificationSeriesIds}" />
												<ui:param name="sfc_seriesCodesLength" value="#{fn:length(sfc_seriesCodes)}" />										
												<ui:param name="sfc_aliasPreffix" value="Invoice_rectification" />
												<ui:param name="sfc_editable" value="#{true}" />
												<ui:param name="skipSeriesLabel" value="#{true}" />
												<ui:param name="sfc_seriesProperty" value="#{invoiceController.rectificationSeries}" />
												<ui:param name="sfc_numberProperty" value="#{invoiceController.rectificationNumber}" />
												<ui:param name="sfc_numberEditable" value="#{invoiceController.rectificationNumberEditable}" />
												<aon:methodParam name="sfc_onSeriesChanged" type="valueChangeListener"
													value="#{invoiceController.onRectificationSeriesChanged}" />	
												<aon:methodParam name="sfc_onNumberEditable" type="actionListener"
													value="#{invoiceController.onRectificationNumberEditable}" />
											</ui:include>
										</aon:if>
										<aon:if test="#{!invoiceController.to.sales}">
											<aon:outputLabel for="Invoice_rectification_referenceCode"
												value="#{bundle.aon_invoice_number}" />
											<aon:inputText id="Invoice_rectification_referenceCode" 
												value="#{invoiceController.rectificationReferenceCode}" 
												required="true" size="25" maxlength="32" />
										</aon:if>

										<aon:outputLabel for="Invoice_rectification_date"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Invoice_rectification_date" 
											value="#{invoiceController.rectificationDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-60" />

										<aon:outputLabel for="Invoice_rectification_cause"
											value="#{bundle.finance_cause}" />
										<aon:inputTextarea id="Invoice_rectification_cause" cols="70" rows="4"
											value="#{invoiceController.rectificationCause}" />

										<aon:if test="#{financeController.onePending}">
											<aon:outputLabel for="Invoice_rectification_settleFinance"
												value="#{invoiceController.to.sales ? bundle.finance_charges : bundle.finance_payments}" />
											<aon:div>
												<aon:outputText styleClass="aon-italic aon-margin-right"
													value="#{bundle.finance_invoice_settle_pending_finances}" />
												<aon:selectBooleanCheckbox id="Invoice_rectification_settleFinance"
													value="#{invoiceController.rectificationSettleFinance}" />
											</aon:div>
										</aon:if>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
