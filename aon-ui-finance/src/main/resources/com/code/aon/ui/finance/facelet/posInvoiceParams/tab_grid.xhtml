<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:param name="toolbarTitle" value="#{bundle.finance_posInvoice_params}" />
		<ui:param name="toolbarDescription" value="#{bundle.aon_edit}" />
		<ui:param name="toolbarID" value="aonToolbar-posInvoice_params" />
		
		<ui:define name="toolbarContent">
			<aon:commandButton id="posInvoice-save"
				title="#{bundle.aon_key_save_accelerator}"
				value="#{bundle.aon_save}" 
				actionListener="#{posInvoiceParams.onAccept}"
				styleClass="aon-finding-toolbar-item aon-icon-accept"
				accesskey="#{bundle.aon_key_save}" />
		</ui:define>				
	</ui:decorate>	
	
	<aon:div styleClass="aon-scroll-area">
		
		<aon:panelGrid  columns="2" style="width:100%"
			columnClasses="aon-panelGrid-odd aon-width-200,aon-panelGrid-even aon-width-auto">
			
			<aon:outputLabel for="posInvoice_print_pdf"
				value="#{bundle.finance_posInvoice_pdf}" />
			<aon:selectBooleanCheckbox id="posInvoice_print_pdf"
				value="#{posInvoiceParams.printPDF}" />
			
			<aon:outputLabel for="posInvoice_width"
				value="#{bundle.finance_posInvoice_width}" />
			<aon:inputText id="posInvoice_width" size="5"
				value="#{posInvoiceParams.width}"/>
			
			<aon:outputLabel for="posInvoice_printLogo"
				value="#{bundle.company_print_logo}" />
			<aon:selectBooleanCheckbox id="posInvoice_printLogo"
				value="#{posInvoiceParams.printLogo}" />
			
			<aon:outputLabel for="posInvoice_print_tradename"
				value="#{bundle.finance_print_tradename}" />
			<aon:selectBooleanCheckbox id="posInvoice_print_tradename"
				value="#{posInvoiceParams.printTradename}" />
			
			<aon:outputLabel for="posInvoice_print_dir_staff"
				value="#{bundle.registry_dir_staff}" />
			<aon:selectOneMenu id="posInvoice_print_dir_staff"
				value="#{posInvoiceParams.printDirStaff}" >
				<f:selectItems value="#{companyCollections.shortReportPrintOptions}" />
			</aon:selectOneMenu>
				
			<aon:outputLabel for="posInvoice_print_seller_name"
				value="#{bundle.finance_print_seller_name}" />
			<aon:selectOneMenu id="posInvoice_print_seller_name"
				value="#{posInvoiceParams.printSellerName}" >
				<f:selectItems value="#{companyCollections.shortReportPrintOptions}" />
			</aon:selectOneMenu>
				
			<aon:outputLabel for="posInvoice_print_domain"
				value="#{bundle.finance_print_domain}" />
			<aon:selectBooleanCheckbox id="posInvoice_print_domain"
				value="#{posInvoiceParams.printDomain}" />
				
			<aon:outputLabel for="posInvoice_print_discount"
				value="#{bundle.finance_print_discount}" />
			<aon:selectBooleanCheckbox id="posInvoice_print_discount"
				value="#{posInvoiceParams.printDiscount}" />
				
			<aon:outputLabel for="posInvoice_footer_text"
				value="#{bundle.company_invoice_footer_text}" />
			<aon:inputTextarea id="posInvoice_footer_text"
				cols="60" rows="6"
				value="#{posInvoiceParams.footerText}"/>
				
		</aon:panelGrid>

	</aon:div>
	
</ui:composition>
