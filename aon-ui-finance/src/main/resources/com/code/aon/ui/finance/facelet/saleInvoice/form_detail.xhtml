<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<c:if test="#{!saleInvoice.new}">

		<aon:panel styleClass="aon-margin-left aon-margin-right">
			<f:facet name="header">
				<aon:outputText value="#{financeBundle.finance_invoice_lines}" />
			</f:facet>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
				<ui:param name="controller" value="#{saleInvoiceDetail}" />
				<ui:param name="rows" value="0" />
				<ui:param name="showNote" value="false" />
				<ui:param name="showDataScroller" value="false" />
				<ui:param name="skipResetButton" value="#{saleInvoice.recorded}" />
				<ui:param name="skipLineEdition" value="#{saleInvoice.recorded}" />
				<ui:param name="newSaveButtonReRender" value="Invoice_total" />
				<ui:param name="saveButtonReRender" value="Invoice_total" />
				<ui:param name="removeButtonReRender" value="Invoice_total" />
				<ui:param name="focusOnAdd" value="InvoiceDetail_item_product_code-New" />
				<ui:param name="focusOnSelect" value="InvoiceDetail_item_product_code-Edit" />
				<ui:param name="columnClasses"
					value="aon-editDataTable-textColumn,
					aon-editDataTable-numberColumn aon-width-80,
					aon-editDataTable-numberColumn aon-width-80,
					aon-editDataTable-numberColumn aon-width-80,
					aon-editDataTable-numberColumn aon-width-80,
					aon-editDataTable-textColumn aon-width-150" />

				<ui:define name="columns">

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{productBundle.product_item}" />
						</f:facet>
						<aon:outputText value="#{to.description}"
							rendered="#{to!=controller.to}" />

						<aon:div styleClass="aon-lookup"
							rendered="#{to==saleInvoiceDetail.to}">
							<aon:lookupInputText id="InvoiceDetail_item_product_code-Edit"
								value="#{saleInvoiceDetail.to.item.product.code}"
								lookup="#{itemLookup}"
								lookupChangeListener="#{saleInvoiceDetail.onItemChanged}"
								reRender="InvoiceDetail_item_product_name-Edit,Item_price-Edit,Discount-Edit,Amount-Edit"
								required="true" size="10">
								<aon:joinProperty alias="Item_product_code"
									value="#{saleInvoiceDetail.to.item.product.code}" />
							</aon:lookupInputText>
							<aon:lookupButton windowTitle="#{productBundle.product_module}"
								actionType="search"
								lookupChangeListener="#{saleInvoiceDetail.onItemChanged}"
								selectReRender="InvoiceDetail_item_product_code-Edit,InvoiceDetail_item_product_name-Edit,Item_price-Edit,Discount-Edit,Amount-Edit"
								lookup="#{itemLookup}" minHeight="460" minWidth="650"
								property="#{saleInvoiceDetail.to.item}">
								<aon:joinProperty alias="Item_product_code"
									value="#{saleInvoiceDetail.to.item.product.code}" />
							</aon:lookupButton>
							<aon:inputText id="InvoiceDetail_item_product_name-Edit"
								value="#{saleInvoiceDetail.to.description}" disabled="true"
								size="40" />
						</aon:div>

						<f:facet name="footer">
							<aon:div styleClass="aon-lookup"
								rendered="#{saleInvoiceDetail.new}">
								<aon:lookupInputText id="InvoiceDetail_item_product_code-New"
									value="#{saleInvoiceDetail.to.item.product.code}"
									focus="Item_quantity-New" lookup="#{itemLookup}"
									lookupChangeListener="#{saleInvoiceDetail.onItemChanged}"
									reRender="InvoiceDetail_item_product_name-New,Item_price-New,Discount-New,Amount-New"
									required="true" size="10">
									<aon:joinProperty alias="Item_product_code"
										value="#{saleInvoiceDetail.to.item.product.code}" />
								</aon:lookupInputText>
								<aon:lookupButton windowTitle="#{productBundle.product_module}"
									actionType="search"
									lookupChangeListener="#{saleInvoiceDetail.onItemChanged}"
									selectReRender="InvoiceDetail_item_product_code-New,InvoiceDetail_item_product_name-New,Item_Lookup_price-New,Discount-New,Amount-New"
									lookup="#{itemLookup}" minHeight="460" minWidth="650"
									property="#{saleInvoiceDetail.to.item}">
								</aon:lookupButton>
								<aon:inputText id="InvoiceDetail_item_product_name-New"
									value="#{saleInvoiceDetail.to.description}" disabled="true"
									size="60" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_quantity}" />
						</f:facet>
						<aon:outputText value="#{to.quantity}"
							rendered="#{to!=controller.to}">
							<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
						</aon:outputText>
						<aon:inputText id="Item_quantity-Edit"
							valueChangeListener="#{controller.onQuantityChanged}"
							reRender="Item_price-Edit,Discount-Edit,Amount-Edit"
							rendered="#{to==controller.to}" value="#{controller.to.quantity}"
							required="true" size="7" />
						<f:facet name="footer">
							<aon:inputText id="Item_quantity-New"
								rendered="#{controller.new}" size="7"
								valueChangeListener="#{controller.onQuantityChanged}"
								reRender="Item_price-New,Discount-New,Amount-New"
								value="#{controller.to.quantity}" required="true"
								focus="Item_price-New" />
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_price}" />
						</f:facet>
						<aon:outputText value="#{to.price}"
							rendered="#{to!=controller.to}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText id="Item_price-Edit" size="7"
							reRender="Amount-Edit" rendered="#{to==controller.to}"
							value="#{controller.to.price}" required="true" />
						<f:facet name="footer">
							<aon:inputText id="Item_price-New" size="7" reRender="Amount-New"
								rendered="#{controller.new}" value="#{controller.to.price}"
								required="true" />
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_discount}" />
						</f:facet>
						<aon:outputText id="Discount" rendered="#{to!=controller.to}"
							value="#{to.discountExpression.discountExpr}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText id="Discount-Edit" rendered="#{to==controller.to}"
							reRender="Amount-Edit" size="7" required="true"
							value="#{controller.to.discountExpression.discountExpr}" />
						<f:facet name="footer">
							<aon:inputText id="Discount-New" rendered="#{controller.new}"
								size="7" reRender="Amount-New"
								value="#{controller.to.discountExpression.discountExpr}"
								required="true" />
						</f:facet>
					</aon:column>

					<aon:column width="60">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_amount}" />
						</f:facet>
						<aon:outputText rendered="#{to!=controller.to}"
							value="#{to.taxableBase}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText id="Amount-Edit" rendered="#{to==controller.to}"
							value="#{controller.taxableBase}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div style="text-align:right;">
								<aon:outputText id="Amount-New" rendered="#{controller.new}"
									value="#{controller.taxableBase}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{companyBundle.company_workplace_module}" />
						</f:facet>
						<aon:outputText id="InvoiceDetail_workPlace_id"
							rendered="#{to!=controller.to}"
							value="#{to.workPlace.description}" />
						<aon:selectOneMenu value="#{controller.to.workPlace}"
							rendered="#{to==feeInvoicingDetail.to}">
							<f:selectItems value="#{companyCollections.workPlaces}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu value="#{controller.to.workPlace}"
								rendered="#{controller.new}">
								<f:selectItems value="#{companyCollections.workPlaces}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>

				</ui:define>
			</ui:decorate>
		</aon:panel>
	</c:if>
</ui:composition>
