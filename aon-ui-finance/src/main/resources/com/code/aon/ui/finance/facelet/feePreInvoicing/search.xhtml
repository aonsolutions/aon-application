<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="preInvoicingForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{financeBundle.finance_pre_invoicing_module}" />
				<ui:param name="controller" value="#{preInvoicing}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="resetAction" value="" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="backAction" value="" />
				
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						actionListener="#{preInvoicing.onReport}"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="preInvoicing" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Customer_id"
						value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Customer_id" lookup="#{customerLookup}"
							reRender="Customer_full_name"
							value="#{preInvoicing.invoicingParams.customer.id}" size="5" />
						<aon:lookupButton
							windowTitle="#{customerBundle.customer_selection}"
							selectReRender="Customer_id,Customer_full_name"
							actionType="search" lookup="#{customerLookup}" minHeight="460"
							minWidth="650" property="#{preInvoicing.invoicingParams.customer}">
						</aon:lookupButton>
						<aon:inputText id="Customer_full_name"
							value="#{(preInvoicing.invoicingParams.customer.registry.name!=null)?(preInvoicing.invoicingParams.customer.registry.fullName):('')}"
							size="50" disabled="true" />
					</aon:div>

					<h:outputLabel value="#{bundle.aon_date}" />
					<h:panelGrid columns="4">
						<aon:outputLabel for="BillingDate_Month"
							value="#{bundle.aon_month}" />
						<aon:selectOneMenu id="BillingDate_Month"
							value="#{preInvoicing.invoicingParams.month}">
							<f:selectItems value="#{commonCollections.months}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="BillingDate_Year"
							value="#{bundle.aon_year}" />
						<aon:inputText id="BillingDate_Year" size="5"
							value="#{preInvoicing.invoicingParams.year}" />
					</h:panelGrid>

					<aon:outputLabel for="CustomerFee_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu id="CustomerFee_securityLevel"
						value="#{preInvoicing.invoicingParams.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="CustomerFee_WorkPlace"
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="CustomerFee_WorkPlace"
						value="#{preInvoicing.invoicingParams.workPlace}">
						<f:selectItem itemLabel="-" itemValue="#{null}" />
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>
</ui:composition>
