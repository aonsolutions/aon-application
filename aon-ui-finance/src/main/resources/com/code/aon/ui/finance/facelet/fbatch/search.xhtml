<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="fbatchSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_fbatch_module}" />
				<ui:param name="controller" value="#{fbatch}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{fbatch}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="Finance_payment"
						value="#{financeBundle.finance_fbatch_type}" />
					<aon:selectOneRadio id="Finance_payment" value="#{fBatchSearch.payment}">
						<f:selectItem itemLabel="#{financeBundle.finance_payment}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{financeBundle.finance_charge}" itemValue="#{false}" />
					</aon:selectOneRadio>
							
					<aon:outputLabel for="FinanceBatch_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="FinanceBatch_id"
						valueChangeListener="#{fbatch.addExpression}" size="20" />
							
					<aon:outputLabel for="FinanceBatch_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="FinanceBatch_description"
						valueChangeListener="#{fbatch.addExpression}" size="40" />
							
					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="FinanceBatch_issueDate-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="FinanceBatch_issueDate-From"
							value="#{fBatchSearch.issueDateFrom}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="FinanceBatch_issueDate-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="FinanceBatch_issueDate-To"
							value="#{fBatchSearch.issueDateTo}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
							
					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{financeBundle.finance_bank}" />
					<aon:selectOneMenu id="RegistryBank_Lookup_id"
						value="#{fBatchSearch.registryBank}"
						reRender="RegistryBank_Lookup_bankAccount">
						<f:selectItem itemLabel="-" value="#{null}"  />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="RegistryBank_Lookup_bankAccount"
						value="#{financeBundle.finance_bank_account}" />
					<aon:inputText id="RegistryBank_Lookup_bankAccount"
						value="#{financePayment.registryBank.bankAccount}"
						disabled="true" size="40" /> 							
 							
					<aon:outputLabel for="FinanceBatch_financeBatchType"
						value="#{financeBundle.finance_disk_type}" />
					<aon:selectOneMenu id="FinanceBatch_financeBatchType"
						valueChangeListener="#{fbatch.addEqualExpression}">
						<aon:enumConverter enum="com.code.aon.finance.enumeration.FinanceBatchType" />
						<f:selectItem itemLabel="-" itemValue=""/>
						<f:selectItems value="#{financeCollections.financeBatchTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="FinanceBatch_financeBatchStatus"
						value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="FinanceBatch_financeBatchStatus"
						valueChangeListener="#{fbatch.addEqualExpression}">
						<aon:enumConverter enum="com.code.aon.finance.enumeration.FinanceBatchStatus" />
						<f:selectItem itemLabel="-" itemValue=""/>
						<f:selectItems value="#{financeCollections.financeBatchStatus}" />
					</aon:selectOneMenu>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
	
</ui:composition>
