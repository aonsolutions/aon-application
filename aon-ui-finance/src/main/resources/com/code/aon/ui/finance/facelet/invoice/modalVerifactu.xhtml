<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showVerifactuWindow">
		<aon:if test="#{invoiceController.showVerifactuWindow}">
			<rich:modalPanel id="fiscalVerifactuModalPanel"
				minWidth="740" minHeight="450" zindex="90"
				showWhenRendered="#{invoiceController.showVerifactuWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Verifactu" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showVerifactuWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showVerifactuWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="verifactuForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="verifactuaccept"	
											value="Enviar"
											action="#{saleInvoice.verifactu}"
											styleClass="aon-finding-toolbar-item aon-icon-check-black"
											reRender="showCertVerifactuWindow">
											<f:setPropertyActionListener target="#{saleInvoice.showCertVerifactuWindow}"
												value="#{true}" />
										</aon:commandButton>
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panel>
											<f:facet name="header">
												<aon:outputText value="Envíos" />
											</f:facet>
											<aon:dataTable id="verifactuSendTable"  value="#{invoiceController.invoiceCommunicationHistory}" var="history">
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="Fecha" />
													</f:facet>
													<aon:outputText value="#{history.date}" />
												</aon:column>
												
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="Operación" />
													</f:facet>
													<aon:outputText value="#{history.operation.description}" />
												</aon:column>
												
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="Estado" />
													</f:facet>
													<aon:outputText value="#{history.status.description}" />

													<aon:outputLink id="verifactuDownloadRequest"
														title="Descargar Petición"
														target="_blank" value="#{history.requestUrl}" 
														styleClass="aon-editDataTable-button aon-icon-download aon-nowrap aon-margin-left">
												    </aon:outputLink>
													
													<aon:outputLink id="verifactuDownloadResponse"
														title="Descargar Respuesta"
														target="_blank" value="#{history.responseUrl}" 
														styleClass="aon-editDataTable-button aon-icon-download aon-nowrap aon-margin-left">
												    </aon:outputLink>

												</aon:column>
												
											</aon:dataTable>
										</aon:panel>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
