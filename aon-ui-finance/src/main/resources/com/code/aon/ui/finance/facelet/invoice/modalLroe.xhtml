<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showLroeWindow">
		<aon:if test="#{invoiceController.showLroeWindow}">
			<rich:modalPanel id="fiscalLroeModalPanel"
				minWidth="740" minHeight="450" zindex="90"
				showWhenRendered="#{invoiceController.showLroeWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="LROE" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showLroeWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showLroeWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="lroeForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="lroeaccept"	
											value="Enviar"
											action="#{saleInvoice.lroe}"
											styleClass="aon-finding-toolbar-item aon-icon-check-black"
											reRender="showCertTbaiWindow">
											<f:setPropertyActionListener target="#{saleInvoice.showCertTbaiWindow}"
												value="#{true}" />
										</aon:commandButton>
										<!-- <aon:commandButton id="lroeanular"	
											value="Anular"
											action="#{saleInvoice.anular}"
											styleClass="aon-finding-toolbar-item aon-icon-removed"
											reRender="showCertTbaiWindow">
											<f:setPropertyActionListener target="#{saleInvoice.showCertTbaiWindow}"
												value="#{true}" />
										</aon:commandButton> -->
										
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panel>
											<f:facet name="header">
												<aon:outputText value="Capitulo 1" />
											</f:facet>
											<aon:dataTable id="LroeChapter1Table"  value="#{invoiceController.lroe.chapter1.requests}" var="ch1">
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="Fecha" />
													</f:facet>
													<aon:outputText value="#{ch1.dataResponse.responseDate}" />
												</aon:column>
												
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="Operación" />
													</f:facet>
													<aon:outputText value="#{ch1.info.operacionStr}" />
												</aon:column>
												
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="Subcapítulo" />
													</f:facet>
													<aon:outputText value="#{ch1.info.subcapitulo}" />
												</aon:column>
												
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="" />
													</f:facet>
													<aon:outputText title="Estado"
														styleClass="aon-editDataTable-button aon-icon-check-black aon-nowrap aon-margin-left"
														value="&#160;"
														rendered="#{ch1.response.ok}" />
														
													<aon:outputText title="#{ch1.response.errorMessage}"
														styleClass="aon-editDataTable-button aon-icon-wrong aon-nowrap aon-margin-left"
														value="&#160;"
														rendered="#{ch1.response.error}" />

													<aon:outputLink id="lroeDownloadRequest"
														title="Descargar Petición"
														target="_blank" value="#{ch1.requestUrl}" 
														styleClass="aon-editDataTable-button aon-icon-download aon-nowrap aon-margin-left">
												    </aon:outputLink>
													
													<aon:outputLink id="lroeDownloadResponse"
														title="Descargar Respuesta"
														target="_blank" value="#{ch1.responseUrl}" 
														styleClass="aon-editDataTable-button aon-icon-download aon-nowrap aon-margin-left">
												    </aon:outputLink>

												</aon:column>
												
											</aon:dataTable>
										</aon:panel>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
