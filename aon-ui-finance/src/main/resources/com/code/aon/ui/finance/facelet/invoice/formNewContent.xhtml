<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
 	
	<aon:panelGrid columns="2" columnClasses="aon-vertical-align-top, aon-vertical-align-top">
	
		<aon:div styleClass="aon-width-700">
			<aon:div styleClass="aon-group">
				<aon:div styleClass="aon-group-title">
					<aon:outputText value="#{bundle.finance_invoice_data}"/>
				</aon:div>
				<aon:div styleClass="aon-group-body"> 
					<aon:div styleClass="aon-group-body-internal">
	
						<aon:panelGrid columns="2" columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-500">
	
							<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formBasicContent.xhtml">
								<ui:param name="invoiceController" value="#{invoiceController}" />
								<ui:param name="addressController" value="#{addressController}" />
								<ui:param name="detailController" value="#{detailController}" />
								<ui:param name="financeController" value="#{financeController}" />
								<ui:param name="formName" value="#{formName}" />
							</ui:include>
	
						</aon:panelGrid>
	
					</aon:div>
				</aon:div>
			</aon:div>
	
			<aon:div styleClass="aon-group">
				<aon:div styleClass="aon-group-title">
					<aon:outputText value="#{bundle.finance_invoice_lines}"/>
				</aon:div>
				<aon:div styleClass="aon-group-body"> 
					<aon:div styleClass="aon-group-body-internal">
	
						<aon:panelGrid columns="2" columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-500">
	
							<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formNewDetail.xhtml">
								<ui:param name="invoiceController" value="#{invoiceController}" />
								<ui:param name="addressController" value="#{addressController}" />
								<ui:param name="detailController" value="#{detailController}" />
								<ui:param name="financeController" value="#{financeController}" />
								<ui:param name="formName" value="#{formName}" />
							</ui:include>
	
							<aon:if test="#{detailController.to.item.id != null}">
								<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formNewFinance.xhtml">
									<ui:param name="invoiceController" value="#{invoiceController}" />
									<ui:param name="addressController" value="#{addressController}" />
									<ui:param name="detailController" value="#{detailController}" />
									<ui:param name="financeController" value="#{financeController}" />
									<ui:param name="formName" value="#{formName}" />
								</ui:include>
							</aon:if>
	
						</aon:panelGrid>
	
					</aon:div>
				</aon:div>
			</aon:div>
	
			<aon:panelCollapsible expanded="true" immediate="true" label="#{bundle.aon_additional_data}">
	
				<aon:panelGrid columns="2" styleClass="aon-group-body aon-nopadding aon-width-all aon-text-left" 
					columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-500">
	
					<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formCommonContent.xhtml">
						<ui:param name="invoiceController" value="#{invoiceController}" />
						<ui:param name="addressController" value="#{addressController}" />
						<ui:param name="detailController" value="#{detailController}" />
						<ui:param name="financeController" value="#{financeController}" />
						<ui:param name="formName" value="#{formName}" />
					</ui:include>
	
				</aon:panelGrid>
	
			</aon:panelCollapsible>
			<aon:if test="#{aonRole.sysAdmin}">
			<aon:if test="#{showAttachPanel}">
				<aon:panelCollapsible id="invoiceAttach-panel"
					expanded="true" immediate="true" label="#{bundle.webmail_attach_files}">
					<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formNewAttach.xhtml" />
					<aon:div rendered="#{invoiceController.invoiceAttachFile.size > 0}">
						<aon:outputText value="#{invoiceController.invoiceAttachFile.fileName}"/>
						<aon:div style="margin-left: 0.4em;"
							styleClass="rich-fileupload-button rich-fileupload-button-content">
							<a4j:commandButton ajaxSingle="true"
								action="#{invoiceController.clearInvoiceAttachUploadData}"
								reRender="invoiceAttach-panel, invoiceAttachPreview-panel"
								value="#{bundle.aon_clear}" title="#{bundle.aon_remove}"
								styleClass="aon-icon-commandButton aon-icon-close" />
						</aon:div>
					</aon:div>
				</aon:panelCollapsible>
			</aon:if>
			</aon:if>
	
		</aon:div>
		
		<aon:if test="#{aonRole.sysAdmin}">
		<aon:if test="#{showAttachPanel}">
			<aon:div id="invoiceAttachPreview-panel" styleClass="aon-width-all">
				<aon:div id="invoiceAttachPreview-group"
					styleClass="aon-group">
					<aon:div styleClass="aon-group-title">
						<aon:outputText value="#{bundle.aon_preview}"/>
					</aon:div>
					<aon:div styleClass="aon-group-body"> 
						<aon:div styleClass="aon-group-body-internal">
							<aon:div id="invoiceAttachPreview-content">
								<aon:div id="invoiceAttachPreview-image">
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:if>
		</aon:if>
			
	</aon:panelGrid>


</ui:composition>
