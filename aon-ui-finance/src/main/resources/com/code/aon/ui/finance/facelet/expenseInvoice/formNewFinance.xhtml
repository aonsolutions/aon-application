<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputLabel for="InvoiceFinance_generationMode" value="#{financeBundle.finance_finance}" />
	<aon:selectOneRadio id="InvoiceFinance_generationMode"
		value="#{expenseInvoice.financeGenerationMode}"
		valueChangeListener="#{expenseInvoice.onFinanceGenerationModeChanged}"
	 	ajaxSingle="true" reRender="expenseInvoiceForm">
		<f:selectItem itemLabel="#{financeBundle.finance_automatic}" itemValue="0" />
		<f:selectItem itemLabel="#{financeBundle.finance_manual}" itemValue="1" />
		<f:selectItem itemLabel="#{financeBundle.finance_not_generate}" itemValue="-1" />
	</aon:selectOneRadio>				

	<aon:outputLabel for="Finance_DueDate" value="#{financeBundle.finance_finance_date}"
		rendered="#{expenseInvoice.financeGenerationMode == 1}" />
	<aon:selectInputDate id="Finance_DueDate"
		value="#{expenseInvoiceFinance.to.dueDate}"
		inputSize="8" required="true"
		rendered="#{expenseInvoice.financeGenerationMode == 1}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}">
		<a4j:support ajaxSingle="true" event="oninputchange" />
		<a4j:support ajaxSingle="true" event="onchanged" />
	</aon:selectInputDate>

	<aon:outputLabel for="Finance_PayMethod" value="#{configBundle.config_pay_method}"
		rendered="#{expenseInvoice.financeGenerationMode == 1}" />
	<aon:selectOneMenu id="Finance_PayMethod"
		value="#{expenseInvoiceFinance.to.payMethod}"
		rendered="#{expenseInvoice.financeGenerationMode == 1}"
		valueChangeListener="#{expenseInvoiceFinance.onPayMethodChanged}"
		ajaxSingle="true" reRender="InvoiceFinance_bankAccount_div">
		<f:selectItems value="#{configCollections.payMethods}" />
	</aon:selectOneMenu>

	<aon:div rendered="#{expenseInvoice.financeGenerationMode == 1}">
		<aon:outputLabel for="Bank_id-Invoice" value="#{configBundle.config_bank}" />
		<aon:outputText value=" - #{configBundle.config_bank_account}" />
	</aon:div>
	<aon:div id="InvoiceFinance_bankAccount_div" styleClass="aon-nowrap" rendered="#{expenseInvoice.financeGenerationMode == 1}">
		<aon:panelGroup id="InvoiceFinance_bankAccount" rendered="#{expenseInvoiceFinance.showBankManualInput}">
			<ui:include src="/com/code/aon/ui/registry/facelet/rbank/lookup.xhtml">
				<ui:param name="lookupTo" value="#{expenseInvoiceFinance.to.bank}" />
				<ui:param name="skipLabel" value="#{true}" />
				<ui:param name="lookupSuffix" value="-Invoice" />
				<ui:param name="lookupReRender" value="InvoiceFinance_bankAccount" />
				<aon:methodParam name="lookupChangeListener"
					value="#{expenseInvoiceFinance.onBankChanged}" type="lookupChangeListener" />
			</ui:include>								
			<aon:inputText id="BankAccount_office"
				value="#{expenseInvoiceFinance.to.bankAccount.office}"
				size="3" maxlength="4">
				<f:validateLength minimum="4" maximum="4" />
				<a4j:support ajaxSingle="true" event="onchange"
					reRender="CreateBank_panel" />
			</aon:inputText>
			<aon:inputText id="BankAccount_control"
				value="#{expenseInvoiceFinance.to.bankAccount.control}"
				size="1" maxlength="2">
				<f:validateLength minimum="2" maximum="2" />
				<a4j:support ajaxSingle="true" event="onchange"
					reRender="CreateBank_panel" />
			</aon:inputText>
			<aon:inputText id="BankAccount_account"
				value="#{expenseInvoiceFinance.to.bankAccount.account}"
				size="8" maxlength="10">
				<f:validateLength minimum="10" maximum="10" />
				<a4j:support ajaxSingle="true" event="onchange" 
					reRender="CreateBank_panel" />
			</aon:inputText>
			<aon:panelGroup id="CreateBank_panel">
				<aon:commandButton id="CreateBank"
					value="&#160;" title="#{configBundle.config_bank_creation} #{expenseInvoice.to.registryName}"
					styleClass="aon-editDataTable-button aon-lookupButton-new"
					rendered="#{expenseInvoiceFinance.bankCreationEnabled}"
					onclick="if (!confirm('#{configBundle.config_bank_creation_confirm} #{expenseInvoice.to.registryName}?')) return false;"	
					actionListener="#{expenseInvoiceFinance.onAddRegistryBank}"
					ajaxSingle="true" reRender="InvoiceFinance_bankAccount" />
			</aon:panelGroup>
			<aon:commandLink id="BankAccount_hide_bank_manual"
				value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
				styleClass="aon-icon-edit-end-simple" style="margin-left: 5px; padding-right: 12px;"
				rendered="#{expenseInvoiceFinance.showBankManualInput}"  
				actionListener="#{expenseInvoiceFinance.onBankManualInput}"
				ajaxSingle="true" reRender="InvoiceFinance_bankAccount_div">
				<f:setPropertyActionListener target="#{expenseInvoiceFinance.showBankManualInput}"
					value="#{false}" />
			</aon:commandLink>
		</aon:panelGroup>
		<aon:div>
			<aon:selectOneMenu id="Finance_RegistryBank"
				value="#{expenseInvoiceFinance.registryBank}"
				rendered="#{!expenseInvoiceFinance.showBankManualInput}"
				valueChangeListener="#{expenseInvoiceFinance.onRBankChanged}"
				ajaxSingle="true" reRender="Finance_RegistryBank">
				<f:selectItem value="#{null}" />
				<f:selectItems value="#{expenseInvoiceFinance.activeBanks}" />
			</aon:selectOneMenu>
			<aon:commandLink id="BankAccount_show_bank_manual"
				value="&#160;" title="#{bundle.aon_edit}"
				styleClass="aon-icon-edit-add-simple" style="margin-left: 5px; padding-right: 12px;"
				rendered="#{!expenseInvoiceFinance.showBankManualInput}"  
				actionListener="#{expenseInvoiceFinance.onBankManualInput}"
				ajaxSingle="true" reRender="InvoiceFinance_bankAccount_div">
				<f:setPropertyActionListener target="#{expenseInvoiceFinance.showBankManualInput}"
					value="#{true}" />
			</aon:commandLink>
		</aon:div>
	</aon:div>

</ui:composition>
