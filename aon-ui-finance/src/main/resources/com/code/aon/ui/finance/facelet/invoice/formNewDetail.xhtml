<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{invoiceController.to.sales or invoiceController.to.purchase}">
		<aon:outputLabel for="Item_id" value="#{bundle.aon_product}" />
	</aon:if>
	<aon:if test="#{invoiceController.to.expense or invoiceController.to.undeductible}">
		<aon:outputLabel for="Item_id" value="#{bundle.aon_concept}" />
	</aon:if>
	<aon:div>
		<aon:if test="#{invoiceController.to.sales or invoiceController.to.purchase}">
			<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
				<ui:param name="lookupBean" value="#{(invoiceController.to.sales) ? saleItemLookup : purchaseItemLookup}" />
				<ui:param name="lookupTo" value="#{detailController.to.item}" />
				<ui:param name="skipLabel" value="#{true}" />
				<ui:param name="skipSuggestText" value="#{detailController.to.item != null and detailController.to.item.id != null}" />
				<ui:param name="lookupInputOnFocus" value="InvoiceDetail_description" />
				<ui:param name="lookupReRender"	value="#{formName}" />
				<ui:param name="lookupControllerListener" value="#{itemLookupNoWildCardListener}" />
				<aon:methodParam name="lookupChangeListener"
					value="#{detailController.onItemChanged}" type="lookupChangeListener" />
			</ui:include>
		</aon:if>
		<aon:if test="#{invoiceController.to.expense or invoiceController.to.undeductible}">
			<ui:include src="/com/code/aon/ui/product/facelet/expenseItem/lookup.xhtml">
				<ui:param name="lookupTo" value="#{detailController.to.item}" />
				<ui:param name="idRequired" value="#{true}" />
				<ui:param name="skipLabel" value="#{true}" />
				<ui:param name="skipSuggestText" value="#{detailController.to.item != null and detailController.to.item.id != null}" />
				<ui:param name="lookupInputOnFocus" value="InvoiceDetail_description" />
				<ui:param name="lookupReRender"	value="#{formName}" />
				<aon:methodParam name="lookupChangeListener"
					value="#{detailController.onItemChanged}" type="lookupChangeListener" />
			</ui:include>
		</aon:if>
		<aon:panelGroup id="invoiceDetailItemDescription" styleClass="aon-nowrap aon-vertical-align-top">
			<aon:if test="#{aonConfiguration.bean.product.showStock}">
				<aon:commandButton value="&#160;"
					title="#{bundle.product_info}"
					rendered="#{detailController.to.item != null and detailController.to.item.id != null and detailController.to.item.product.inventoriable}"
					styleClass="aon-icon aon-icon-edit-end aon-icon-info"
					actionListener="#{itemInfo.onShowPanel}"
					reRender="itemInfoContainer">
					<aon:set var="#{itemInfo.stockVisible}" value="#{true}" />
					<aon:set var="#{itemInfo.alternativesVisible}" value="#{true}" />
					<aon:set var="#{itemInfo.item}" value="#{detailController.to.item}" /> 
					<aon:set var="#{itemInfo.warehouse}" value="#{null}" /> 
					<aon:set var="#{itemInfo.rowStock}" value="#{detailController.rowStock}" /> 
					<aon:set var="#{itemInfo.componentId}" value="Item_id" />
					<aon:set var="#{itemInfo.alternativeMethod}" value="#{invoiceController.invoiceDetailControllerName}.onItemChanged" />
				</aon:commandButton>															
			</aon:if>
			<aon:inputTextarea id="InvoiceDetail_description"
				style="#{!detailController.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}"
				value="#{detailController.to.description}"
				cols="60" rows="#{!detailController.longDescription?1:5}"
				disabled="#{!detailController.longDescription}"
				rendered="#{detailController.to.item != null and detailController.to.item.id != null}"
				ajaxSingle="true">
				<f:validateLength maximum="1024" />
			</aon:inputTextarea>
			<aon:commandLink id="InvoiceDetail_description_short" immediate="true"
				value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
				styleClass="aon-icon-edit-end-simple" style="margin-left: 5px; padding-right: 12px;"
				rendered="#{detailController.longDescription and detailController.to.item.product.code != null}"
				actionListener="#{detailController.onShortDescription}" 
				reRender="invoiceDetailItemDescription" ajaxSingle="true" />
			<aon:commandLink id="InvoiceDetail_description_long" immediate="true"
				value="&#160;" title="#{bundle.aon_edit}"
				styleClass="aon-icon-edit-add-simple" style="margin-left: 5px; padding-right: 12px;"
				rendered="#{!detailController.longDescription and detailController.to.item.product.code != null}"
				actionListener="#{detailController.onLongDescription}"
				reRender="invoiceDetailItemDescription" ajaxSingle="true" />
		</aon:panelGroup>
	</aon:div>

	<aon:if test="#{invoiceController.to.sales or invoiceController.to.purchase}">
		<aon:outputLabel for="InvoiceDetail_quantity" value="#{bundle.aon_quantity}" />
		<aon:panelGrid id="InvoiceDetail_quantity-Grid" columns="5" 
			columnClasses="aon-width-110,aon-width-40,aon-width-70,aon-width-40,aon-width-70 aon-text-right">
			<aon:panelGroup styleClass="aon-vertical-align-top">
				<aon:inputText id="InvoiceDetail_quantity"
					value="#{detailController.to.quantity}"
					disabled="#{detailController.to.item.id == null}"
					valueChangeListener="#{detailController.onQuantityChanged}"
					reRender="InvoiceDetail_quantity-Grid,InvoiceDetail_price-Grid,InvoiceDetail_discount-Grid,InvoiceDetail_amount-Grid" ajaxSingle="true"
					required="true" size="5" focus="InvoiceDetail_price" />
				<aon:commandLink id="InvoiceDetail_quantity-packaged" immediate="true"
					styleClass="aon-icon-package" style="margin-left: 5px; padding-right: 12px;"
					value="&#160;" title="#{bundle.aon_to_specify} #{bundle.product_packaged}"
					rendered="#{detailController.to.item.product.packaged}"
					actionListener="#{detailController.onItemPackageShow}"
					reRender="showItemPackageWindow">
					<f:setPropertyActionListener target="#{detailController.showItemPackageWindow}"
						value="#{true}" />
				</aon:commandLink>
			</aon:panelGroup>
			<aon:div rendered="#{invoiceController.to.surcharge and detailController.to.item.id != null and !detailController.to.item.product.prepayment}">
				<aon:outputText styleClass="aon-italic" 
					value="#{bundle.aon_surcharge}" />
			</aon:div>
			<aon:div rendered="#{invoiceController.to.surcharge and detailController.to.item.id != null and !detailController.to.item.product.prepayment}">
				<aon:outputText styleClass="aon-margin-left aon-italic aon-bold" 
					value="#{detailController.to.surchargePercent}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText styleClass="aon-italic" 
					value="%" />
			</aon:div>
			<aon:div rendered="#{invoiceController.to.surcharge and detailController.to.item.id != null and !detailController.to.item.product.prepayment}">
				<aon:outputText styleClass="aon-italic" 
					value="#{bundle.aon_fee}:" />
			</aon:div>
			<aon:div rendered="#{invoiceController.to.surcharge and detailController.to.item.id != null and !detailController.to.item.product.prepayment}">
				<aon:outputText styleClass="aon-padding-right aon-italic aon-bold" 
					value="#{detailController.to.surchargeQuota}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
		</aon:panelGrid>

		<aon:outputLabel for="InvoiceDetail_price" value="#{bundle.aon_price}" />
		<aon:panelGrid id="InvoiceDetail_price-Grid" columns="5" 
			columnClasses="aon-width-110,aon-width-40,aon-width-70,aon-width-40,aon-width-70 aon-text-right">
			<aon:inputText id="InvoiceDetail_price"
				value="#{detailController.to.price}"
				disabled="#{detailController.to.item.id == null}"
				valueChangeListener="#{detailController.onPriceChanged}"
				reRender="InvoiceDetail_quantity-Grid,InvoiceDetail_price-Grid,InvoiceDetail_discount-Grid,InvoiceDetail_amount-Grid" ajaxSingle="true"
				required="true" size="5" focus="InvoiceDetail_discount" />
			<aon:div rendered="#{!invoiceController.to.vatFree and detailController.to.item.id != null and !detailController.to.item.product.prepayment}">
				<aon:outputText styleClass="aon-italic" 
					value="#{bundle.aon_vat}" />
			</aon:div>
			<aon:div rendered="#{!invoiceController.to.vatFree and detailController.to.item.id != null and !detailController.to.item.product.prepayment}">
				<aon:outputText styleClass="aon-margin-left aon-italic aon-bold" 
					value="#{detailController.to.vatPercent}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText styleClass="aon-italic" 
					value="%" />
			</aon:div>
			<aon:div rendered="#{!invoiceController.to.vatFree and detailController.to.item.id != null and !detailController.to.item.product.prepayment}">
				<aon:outputText styleClass="aon-italic" 
					value="#{bundle.aon_fee}:" />
			</aon:div>
			<aon:div rendered="#{!invoiceController.to.vatFree and detailController.to.item.id != null and !detailController.to.item.product.prepayment}">
				<aon:outputText styleClass="aon-padding-right aon-italic aon-bold" 
					value="#{detailController.to.vatQuota}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
		</aon:panelGrid>

		<aon:outputLabel for="InvoiceDetail_discount" value="#{bundle.aon_discount}" />
		<aon:panelGrid id="InvoiceDetail_discount-Grid" columns="5" 
			columnClasses="aon-width-110,aon-width-40,aon-width-70,aon-width-40,aon-width-70 aon-text-right">
			<aon:inputText id="InvoiceDetail_discount"
				value="#{detailController.to.discountExpression.discountExpr}"
				disabled="#{detailController.to.item.id == null}"
				valueChangeListener="#{detailController.onDiscountChanged}"
				reRender="InvoiceDetail_quantity-Grid,InvoiceDetail_price-Grid,InvoiceDetail_discount-Grid,InvoiceDetail_amount-Grid" ajaxSingle="true"
				required="true" size="5" />
			<aon:div rendered="#{!invoiceController.to.retentionFree and invoiceController.to.withholding and detailController.to.item.retention.id != null}">
				<aon:outputText styleClass="aon-italic" 
					value="#{bundle.aon_retention}" />
			</aon:div>
			<aon:div rendered="#{!invoiceController.to.retentionFree and invoiceController.to.withholding and detailController.to.item.retention.id != null}">
				<aon:outputText styleClass="aon-margin-left aon-italic aon-bold" 
					value="#{detailController.to.retentionPercent}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText styleClass="aon-italic" 
					value="%" />
			</aon:div>
			<aon:div rendered="#{!invoiceController.to.retentionFree and invoiceController.to.withholding and detailController.to.item.retention.id != null}">
				<aon:outputText styleClass="aon-italic" 
					value="#{bundle.aon_fee}:" />
			</aon:div>
			<aon:div rendered="#{!invoiceController.to.retentionFree and invoiceController.to.withholding and detailController.to.item.retention.id != null}">
				<aon:outputText styleClass="aon-padding-right aon-italic aon-bold" 
					value="#{detailController.to.retentionQuota}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
		</aon:panelGrid>

		<aon:outputLabel for="InvoiceDetail_amount" value="#{bundle.aon_amount}" />
		<aon:panelGrid id="InvoiceDetail_amount-Grid" columns="3" 
			columnClasses="aon-width-110,aon-width-150,aon-width-70 aon-text-right">
			<aon:outputText id="InvoiceDetail_amount" styleClass="aon-bold"
				value="#{detailController.taxableBase}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:outputText styleClass="aon-italic"
				value="#{bundle.aon_total} #{bundle.aon_tax_included}:"
				rendered="#{!invoiceController.taxFree and detailController.to.item.id != null}" />
			<aon:outputText styleClass="aon-padding-right aon-italic aon-bold" 
				value="#{detailController.total}"
				rendered="#{!invoiceController.taxFree and detailController.to.item.id != null}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:panelGrid>
	</aon:if>

	<aon:if test="#{invoiceController.to.expense}">
		<aon:outputLabel for="InvoiceDetail_taxableBase" value="#{bundle.aon_taxable_base}" />
		<aon:inputText id="InvoiceDetail_taxableBase"
			value="#{detailController.to.taxableBase}"
			valueChangeListener="#{detailController.onTaxableBaseChanged}"
			reRender="InvoiceDetailTaxQuota,InvoiceDetail_total" ajaxSingle="true" 
			required="true" size="5" focus="InvoiceDetail_vatQuota" />

		<aon:outputLabel for="InvoiceDetail_vatQuota" value="#{bundle.aon_vat}" />
		<aon:div id="InvoiceDetailTaxQuota">
			<aon:inputText id="InvoiceDetail_vatQuota"
				value="#{detailController.to.vatQuota}"
				disabled="#{detailController.to.item.vat.percentage == 0}"
				valueChangeListener="#{detailController.onVatQuotaChanged}"
				reRender="InvoiceDetail_vatPercent,InvoiceDetail_total" ajaxSingle="true" 
				required="true" size="5"
				focus="#{invoiceController.to.withholding ? 'InvoiceDetail_retentionQuota' : 'InvoiceDetail_total'}" />
			<aon:outputText id="InvoiceDetail_vatPercent"
				styleClass="aon-bold aon-padding-left"
				value="#{detailController.to.vatPercent}">
				<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
			</aon:outputText>
			<aon:outputText styleClass="aon-bold" style="padding-left: 3px;" value="%" />

			<aon:if test="#{invoiceController.to.withholding}">
				<aon:outputLabel for="InvoiceDetail_retentionQuota" value="#{bundle.aon_retention}"
					styleClass="aon-padding-left aon-padding-right" />
				<aon:inputText id="InvoiceDetail_retentionQuota"
					value="#{detailController.to.retentionQuota}"
					disabled="#{detailController.to.item.retention == null or detailController.to.item.retention.percentage == 0}"
					valueChangeListener="#{detailController.onRetentionQuotaChanged}"
					reRender="InvoiceDetail_retentionPercent,InvoiceDetail_total" ajaxSingle="true" 
					required="true" size="5" focus="InvoiceDetail_total" />
				<aon:outputText id="InvoiceDetail_retentionPercent"
					styleClass="aon-bold aon-padding-left"
					value="#{detailController.to.retentionPercent}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText styleClass="aon-bold" style="padding-left: 3px;" value="%" />
			</aon:if>
		</aon:div>

		<aon:outputLabel for="InvoiceDetail_total" value="#{bundle.aon_total}" />
		<aon:inputText id="InvoiceDetail_total"
			value="#{detailController.toInvoiceDetailTotal}"
			valueChangeListener="#{detailController.onTotalChanged}"
			reRender="InvoiceDetail_taxableBase,InvoiceDetailTaxQuota" ajaxSingle="true"  
			required="true" size="5" />
	</aon:if>

	<aon:if test="#{invoiceController.to.undeductible}">
		<aon:outputLabel for="InvoiceDetail_taxableBase" value="#{bundle.aon_amount}" />
		<aon:inputText id="InvoiceDetail_taxableBase"
			value="#{detailController.to.taxableBase}" ajaxSingle="true" 
			valueChangeListener="#{detailController.onTaxableBaseChanged}"
			required="true" size="5" />
	</aon:if>

	<aon:if test="#{companyCollections.currentUserWorkPlacesCount > 1}">
		<aon:outputLabel for="InvoiceDetail_workPlace" value="#{bundle.purchase_workplace}" />
		<aon:selectOneMenu id="InvoiceDetail_workPlace" required="true"
			value="#{detailController.to.workPlace}" ajaxSingle="true">
			<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
		</aon:selectOneMenu>
	</aon:if>

</ui:composition>
