<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showIncomeFilterWindow">
		<c:if test="#{purchaseInvoice.showIncomeFilterWindow}">
			<rich:modalPanel id="incomeFilterModalPanel" minHeight="400"
				minWidth="650" rendered="#{purchaseInvoice.showIncomeFilterWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_filter}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showIncomeFilterWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{purchaseInvoice.showIncomeFilterWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="incomeFilterForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="incomeFilter-search"
										value="#{bundle.aon_search}"
										reRender="showIncomeTransferWindow,showIncomeFilterWindow"
										actionListener="#{purchaseInvoice.onFilterTransferModel}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										onclick="Richfaces.showModalPanel('waitProccess')" 
					     				oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="incomeFilterModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{purchaseInvoice.showIncomeFilterWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="incomeFilter-clear"
										value="#{bundle.aon_clear}"
										reRender="showIncomeFilterWindow"
										styleClass="aon-finding-toolbar-item aon-icon-rubber" >
										<f:setPropertyActionListener
											target="#{purchaseInvoice.incomeTransferManager.filterParams}"
											value="#{null}" />
									</aon:commandButton>
									<aon:commandButton id="incomeFilter-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showIncomeFilterWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{purchaseInvoice.showIncomeFilterWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								
								<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
									<ui:param name="skipSearchButton" value="#{true}" />
									<ui:param name="skipFocusFirst" value="#{true}" />
									<ui:define name="searchContent">
										<aon:outputLabel for="IncomeTransfer_referenceCode" 
											value="#{bundle.aon_invoice_delivery}" />
										<aon:inputText id="IncomeTransfer_referenceCode" 
											value="#{purchaseInvoice.incomeTransferManager.filterParams.referenceCode}"
											size="25" maxlength="32" />
	
										<aon:outputText for="IncomeTransfer_date"
											value="#{bundle.aon_date}" />
										<aon:div>
											<aon:outputLabel for="IncomeTransfer_date-From"
												styleClass="aon-form-date-label aon-padding-right"
												value="#{bundle.aon_date_from}" />
											<aon:selectInputDate id="IncomeTransfer_date-From"
												value="#{purchaseInvoice.incomeTransferManager.filterParams.fromDate}"
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}"/>
											<aon:outputLabel for="IncomeTransfer_date-To"
												styleClass="aon-form-date-label aon-padding-right"
												value="#{bundle.aon_date_to}" />							
											<aon:selectInputDate id="IncomeTransfer_date-To"
												value="#{purchaseInvoice.incomeTransferManager.filterParams.toDate}"
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}"/>
										</aon:div>
									</ui:define>
								</ui:decorate>
								

							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
