<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_invoice_integrity_module}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener" value="#{invoiceIntegrity.onStart}" type="actionListener" />
					<aon:methodParam name="searchAction" value="invoiceIntegrity_search" />
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<aon:commandButton value="#{bundle.aon_accept}"
						title="#{bundle.aon_accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_accept}?')) return false;"
						actionListener="#{invoiceIntegrity.onUpdate}"/>
					<aon:commandButton id="back" value="#{bundle.aon_back}"
						accesskey="Q" title="#{bundle.aon_back}"
						actionListener="#{invoiceIntegrity.onPreview}"
						action="invoiceIntegrity_preview"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true" />
				</ui:define>
				
			</ui:decorate>

			<aon:div id="invoiceData" styleClass="aon-scroll-area">

				<aon:div id="closingMessagesContainer"
					style="background-color:#f6f5e3; border: solid green 1px; padding:5px; padding-left:50px; margin: 10px;; width: 90%;">
					<aon:div>
						<aon:outputText value="#{financeBundle.finance_integrity_msg}"/>
					</aon:div>
					<aon:div style="color:red;margin-top:10px;">
						<aon:outputText value="#{financeBundle.finance_integrity_warning}"/>
					</aon:div>
				</aon:div>

				<aon:dataTable id="invoiceList" value="#{invoiceIntegrity.breakDownModel}"
					rows="20" var="to" rendered="#{invoiceIntegrity.breakDownModel.rowCount > 0}">

					<aon:column styleClass="aon-editDataTable-iconColumn">
						<f:facet name="header">
							<aon:div>
								<aon:commandButton id="selectButton"
									value="&#160;" 
									actionListener="#{invoiceIntegrity.onCheckAll}"
									styleClass="aon-icon-checkAll aon-vertical-align-top" 
									onclick="Richfaces.showModalPanel('waitProccess')"
									oncomplete="Richfaces.hideModalPanel('waitProccess')" />
								<aon:commandButton id="deselectButton"
									actionListener="#{invoiceIntegrity.onUnCheckAll}"
									value="&#160;" 
									styleClass="aon-icon-checkNone aon-vertical-align-top"
									onclick="Richfaces.showModalPanel('waitProccess')"
									oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							</aon:div>
						</f:facet>
						<aon:selectBooleanCheckbox value="#{to.checked}"/>	
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_document}" />
						</f:facet>
						<aon:outputText value="#{to.documentCountry}" />
						<aon:outputText value=" - " />
						<aon:outputText value="#{to.documentType}" />
						<aon:outputText value=" - " />
						<aon:outputText value="#{to.document}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_document} (#{bundle.finance_invoice})" />
						</f:facet>
						<aon:outputText value="#{to.invoiceDocumentCountry}" style="#{to.sameDocumentCountry?'color:inherit;':'color:red'};"/>
						<aon:outputText value=" - " />
						<aon:outputText value="#{to.invoiceDocumentType}" style="#{to.sameDocumentType?'color:inherit;':'color:red'};"/>
						<aon:outputText value=" - " />
						<aon:outputText value="#{to.invoiceDocument}" style="#{to.sameDocument?'color:inherit;':'color:red'};"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name} (#{bundle.finance_invoice})" />
						</f:facet>
						<aon:outputText value="#{to.invoiceName}" style="#{to.sameName?'color:inherit;':'color:red'};"/>
					</aon:column>

				</aon:dataTable>
				
				<aon:dataScroller2 for="invoiceList" showNote="true" />
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
