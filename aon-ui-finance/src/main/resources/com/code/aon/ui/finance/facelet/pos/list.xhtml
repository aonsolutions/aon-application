<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_pos_definition_module}" />
				<ui:param name="controller" value="#{pos}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{pos}" />
					
					<ui:define name="columns">
 
						<aon:column alias="Pos.workPlace.description">
							<f:facet name="header">
								<aon:outputText value="#{bundle.purchase_workplace}" />
							</f:facet>
							<aon:outputText value="#{to.workPlace.description}" />
						</aon:column>

						<aon:if test="#{companyCollections.departmentsCount > 0}">
							<aon:column alias="Pos.department.name">
								<f:facet name="header">
									<aon:outputText value="#{bundle.purchase_department}" />
								</f:facet>
								<aon:outputText value="#{to.department.name}" />
							</aon:column>
						</aon:if>

						<aon:column alias="Pos.name">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_pos_name}" />
							</f:facet>
							<aon:outputText value="#{to.name}" />
						</aon:column>

						<aon:column alias="Pos.displayMode">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.displayMode}" />
						</aon:column>

						<aon:column alias="Pos.active">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{bundle.aon_active}" rendered="#{to.active}" />
							<aon:outputText value="#{bundle.aon_inactive}" rendered="#{!to.active}" />
						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
