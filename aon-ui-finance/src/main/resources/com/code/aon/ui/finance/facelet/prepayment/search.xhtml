<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="prepaymentSearch">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_prepayment_module}" />
				<ui:param name="controller" value="#{prepayment}" />
			</ui:include>
				
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{prepayment}" />
				<ui:param name="searchController" value="#{prepaymentSearch}" />
				<ui:define name="searchContent">

					<ui:include src="/com/code/aon/ui/finance/facelet/creditor/lookup.xhtml">
						<ui:param name="lookupTo" value="#{searchController.creditor}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{searchController.customer}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Prepayment_finance_dueDate-From" styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Prepayment_finance_dueDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
						<aon:outputLabel for="Prepayment_finance_dueDate-To" styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Prepayment_finance_dueDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>

					<aon:outputLabel value="#{bundle.aon_concept}" />
					<aon:inputText id="Prepayment_finance_concept" 
						valueChangeListener="#{controller.addExpression}"
						size="32" />

					<aon:outputLabel for="Prepayment_finance_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="Prepayment_finance_amount"
						valueChangeListener="#{controller.addExpression}"
						size="10" />

					<aon:outputLabel for="Prepayment_finance_financeStatus"
						value="#{bundle.finance_status_payment}" />
					<aon:selectOneRadio id="Prepayment_finance_financeStatus"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="#{bundle.aon_pending}" itemValue="0|2" />
						<f:selectItem itemLabel="#{bundle.aon_paid}" itemValue="!0" />
					</aon:selectOneRadio>							

					<aon:outputLabel for="Prepayment_collect"
						value="#{bundle.finance_status_charge}" />
					<aon:selectOneRadio id="Prepayment_collect"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="#{bundle.aon_pending}" itemValue="0" />
						<f:selectItem itemLabel="#{bundle.finance_invoiced}" itemValue="1" />
					</aon:selectOneRadio>							

				</ui:define>
			</ui:decorate>				
		</aon:form>
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		
	</ui:define>
</ui:composition>
