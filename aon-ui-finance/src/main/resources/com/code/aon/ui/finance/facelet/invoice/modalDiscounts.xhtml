<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showDiscountsWindow">
		<aon:if test="#{invoiceController.showDiscountsWindow}">
			<rich:modalPanel id="discountsModalPanel"
				minWidth="350" minHeight="200" zindex="90"
				showWhenRendered="#{invoiceController.showDiscountsWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.finance_invoice_apply_discounts}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showDiscountsWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showDiscountsWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="discountsForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="discounts-accept"
											value="#{bundle.aon_accept}"
											styleClass="aon-finding-toolbar-item aon-icon-accept"
											actionListener="#{invoiceController.onApplyDiscounts}"
											reRender="showDiscountsWindow,#{modalReRender}"
											onclick="Richfaces.showModalPanel('waitProccess')" 
								     		oncomplete="Richfaces.hideModalPanel('waitProccess')">
											<f:setPropertyActionListener
												target="#{invoiceController.showDiscountsWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="discounts-cancel" immediate="true"
											value="#{bundle.aon_cancel}"
											styleClass="aon-finding-toolbar-item aon-icon-cancel"
											reRender="showDiscountsWindow">
											<f:setPropertyActionListener
												target="#{invoiceController.showDiscountsWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>

									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

											<aon:outputLabel for="Invoice_discountExpression" value="#{bundle.aon_discount}" />
											<aon:inputText id="Invoice_discountExpression"
												value="#{invoiceController.discountExpression}" 
												required="true" size="5" />

										</aon:panelGrid>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
