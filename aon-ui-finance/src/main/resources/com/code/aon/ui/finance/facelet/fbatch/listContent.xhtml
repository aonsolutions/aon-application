<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html" >

	<aon:column alias="FinanceBatch.id"
		styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_id}" />
		</f:facet>
		<aon:outputText value="#{to.id}" />
	</aon:column>						

	<aon:column alias="FinanceBatch.description"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_description}" />
		</f:facet>
		<aon:outputText value="#{to.description}" />
	</aon:column>

	<aon:column alias="FinanceBatch.issueDate"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.issueDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="FinanceBatch.registryBank.bankAlias"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_bank}" />
		</f:facet>
		<aon:outputText value="#{to.registryBank.bankAlias}" />
	</aon:column>
	
	<aon:column alias="FinanceBatch.registryBank.bankAccount"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_bank_account}" />
		</f:facet>
		<aon:outputText value="#{to.registryBank.bankAccount}" />
	</aon:column>
	
	<aon:column alias="FinanceBatch.financeBatchStatus"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status}" />
		</f:facet>
		<aon:outputText value="#{to.financeBatchStatus}" />
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.finance_regs}" />
		</f:facet>
		<aon:outputText value="#{to.financeBatchTotalDetails}" >
			<f:convertNumber pattern="#{bundle.aon_integer_pattern}" />
		</aon:outputText>	
	</aon:column>

	<aon:column styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_amount}" />
		</f:facet>
		<aon:outputText value="#{to.financeBatchTotalAmount}" >
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>	
	</aon:column>

</ui:composition>
