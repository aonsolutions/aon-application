<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoiceList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_special_rectifier_invoice_module}" />
				<ui:param name="controller" value="#{rectifierInvoice}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener" value="#{rectifierInvoice.onReset}" type="actionListener" />
					<aon:methodParam name="searchAction" value="rectifierInvoice_search" />
				</ui:define>
	
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="rectify"
						value="#{bundle.finance_rectify}"
						styleClass="aon-finding-toolbar-item aon-icon-version"
						actionListener="#{rectifierInvoice.onRectificationShow}"
						reRender="showRectificationWindow">
					</aon:commandButton>
			</ui:define>
	
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:panel style="background-color:#f6f5e3;">
					<aon:outputText value="#{bundle.aon_customer}" />
					<aon:outputText value=":&#160;" />
					<aon:div style="display:inline;font-size: 1.1em;font-weight: bold;">
						<aon:outputText value="#{rectifierInvoice.customer.id}" />
					</aon:div>
					<aon:outputText value="&#160;-&#160;" />
					<aon:outputText value="#{rectifierInvoice.customer.registry.fullName}" />
				</aon:panel>

				<aon:dataTable id="rectifierInvoiceList" value="#{rectifierInvoice.model}" 
					style="margin-top: 1em;" var="to" rows="0">

					<aon:column styleClass="aon-editDataTable-iconColumn">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:selectBooleanCheckbox value="#{to.enabled}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_invoice_number}" />
						</f:facet>
						<aon:outputText value="#{to.invoice.documentNumber}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.invoice.issueDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_document}" />
						</f:facet>
						<aon:outputText value="#{to.invoice.registryDocument}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_name}" />
						</f:facet>
						<aon:outputText value="#{to.invoice.registryName}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.invoice.status}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_total}" />
						</f:facet>
						<aon:outputText value="#{to.invoiceTotal}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_pending}" />
						</f:facet>
						<aon:inputText id ="pending" value="#{to.pending}" size="8">
						</aon:inputText>
					</aon:column>
				</aon:dataTable>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalRectification.xhtml">
			<ui:param name="invoiceController" value="#{rectifierInvoice}" />
		</ui:include>
	</ui:define>

</ui:composition>
