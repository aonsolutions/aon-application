<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="feePrintList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_fee_print_module}" />
				<ui:param name="controller" value="#{feePrint}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="feePrintList-report"
						value="#{bundle.aon_listing}" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="feePrintList" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="feePrintList-excel-report"
						value="#{bundle.aon_listing}" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="feePrintList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="feePrintList-pdf-report" rendered="#{feePrintSearch.anual}"
						value="Por Concepto" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						actionListener="#{feePrint.onOrderCustomerFeeByItem}"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="feePrintListByConcept" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="feePrintListByCustomer" rendered="#{feePrintSearch.anual}"
						value="Por Cliente" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						actionListener="#{feePrint.onOrderCustomerFeeByCustomer}"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="feePrintListByCustomer" />
					</aon:htmlCommandLink>
				
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{feePrint}" />
					<ui:param name="skipSelectButton" value="true" />
					<ui:param name="rowSelectorToggleOnClick" value="false" />

					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_customer}" />
							</f:facet>
							<aon:outputText value="#{to.customer.registry.fullName}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.customer.status}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_concept}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_period}" />
							</f:facet>
							<aon:outputText value="#{to.period}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_quantity}" />
							</f:facet>
							<aon:outputText value="#{to.quantity}"> 
								<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_price}" />
							</f:facet>
							<aon:outputText value="#{to.price}"> 
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_discount}" />
							</f:facet>
							<aon:outputText value="#{to.discountExpression.discountExpr}" />
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_fee_billing_date2}" />
							</f:facet>
							<aon:outputText value="#{to.billingDateMonth}" />
							<aon:outputText value=" / #{to.billingDateYear}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date_to}" />
							</f:facet>
							<aon:outputText value="#{to.finalDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
					</ui:define>
				</ui:decorate>

			</aon:div>
			
		</aon:form>

	</ui:define>

</ui:composition>
