<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoicePrintList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_invoice_print_module}" />
				<ui:param name="controller" value="#{invoicePrint}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton value="&#160;" id="sendEmail"
						actionListener="#{invoicePrint.onInitSendEmail}"
						reRender="showNewMessageWindow-Invoice"
						styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border">
					</aon:commandButton>											
					<aon:htmlCommandLink id="invoicePrint-report"
						value="#{bundle.aon_invoices}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}"
						actionListener="#{companySaleInvoiceFooter.onSearch}">
						<f:param name="reportKey" value="#{company.invoicePrintTemplateValue}" />
						<f:setPropertyActionListener target="#{report.reportKey}"
							value="#{company.invoicePrintTemplateValue}" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="receipt-report"
						value="#{bundle.finance_receipts}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" >
						<f:param name="reportKey" value="receipt" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="facturae"
						value="#{bundle.finance_facturae}" target="_blank"
						actionListener="#{invoicePrint.downloadInvoiceZip}"
						styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="invoicePrintData" value="#{invoicePrint.model}" sortMode="multi"
					var="to" rows="20" rendered="#{invoicePrint.model.rowCount > 0}">


					<aon:column alias="Invoice.issueDate"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.issueDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column alias="Invoice.referenceCode"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_invoice_number}" />
						</f:facet>
						<aon:outputText value="#{to.referenceCode}" />
					</aon:column>

					<aon:column alias="Invoice.series, Invoice.number"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_document_number}" />
						</f:facet>
						<aon:outputText value="#{to.documentNumber}" />
					</aon:column>

					<aon:column alias="Invoice.registryName"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_customer}" />
						</f:facet>
						<aon:outputText value="#{to.registryName}" />
					</aon:column>

					<aon:column alias="Invoice.registryDocument"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.registryDocument}" />
					</aon:column>

					<aon:column alias="Invoice.status"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_total}" />
						</f:facet>
						<aon:outputText value="#{invoicePrint.invoiceTotalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<c:if test="#{company.EInvoice}">					
						<aon:column alias="Invoice.signed"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_signature}" />
							</f:facet>
							<aon:outputText value="&#160;" rendered="#{to.signed}"
								title="#{bundle.sign_signed}"
								styleClass="aon-icon aon-icon-signed" />
							<aon:outputText value="&#160;" rendered="#{!to.signed}"
								title="#{bundle.sign_sign_pending}"
								styleClass="aon-icon aon-icon-unsigned" />
						</aon:column>
					</c:if>

				</aon:dataTable>

				<aon:dataScroller2 for="invoicePrintData" showNote="true" />
			</aon:div>
			
		</aon:form>

		<c:if test="#{aonConfiguration.bean.invoice.showSendEmail}">
			<ui:decorate template="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" >
				<ui:param name="messageSuffix" value="-Invoice" />
				<ui:param name="skipSendButton" value="true" />
				<ui:param name="skipRecipients" value="true" />
				<ui:param name="skipAttachments" value="true" />
				<ui:param name="windowHeight" value="440" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="send"
						value="#{bundle.webmail_send}"
						styleClass="aon-icon-accept aon-finding-toolbar-item"
						actionListener="#{invoicePrint.onSendInvoicesByEmail}"
						reRender="#{sendButtonReRender}" >
						<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>
			
			<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
				<ui:param name="logPanelTitle" value="#{bundle.finance_invoice_send_email_title}" />
			</ui:include>		
			
		</c:if>
	</ui:define>

</ui:composition>
