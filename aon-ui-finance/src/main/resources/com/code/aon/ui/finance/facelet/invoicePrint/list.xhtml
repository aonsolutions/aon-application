<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoicePrintList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_invoice_print_module}" />
				<ui:param name="controller" value="#{invoicePrint}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton value="&#160;" id="sendEmail"
						actionListener="#{invoicePrint.onInitSendEmail}"
						reRender="showNewMessageWindow-Invoice"
						styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border">
					</aon:commandButton>											
					<aon:commandButton value="&#160;" id="downloadInvoicesZip"
						actionListener="#{invoicePrint.onStartInvoicesZip}"
						reRender="progressBarForm"
						styleClass="aon-finding-toolbar-item aon-icon-zip aon-finding-toolbar-item-no-border">
					</aon:commandButton>	
					<aon:if test="#{invoicePrint.printWord}">
						<aon:htmlCommandLink id="invoicePrint-reportWord"
							value="&#160;" target="_new" 
							action="#{report.onExecute}"
							styleClass="aon-finding-toolbar-item aon-icon-word aon-finding-toolbar-item-no-border"
							actionListener="#{printParams.onInit}">
							<f:param name="reportKey" value="#{printParams.saleInvoiceParams.saleInvoiceTemplateValue}" />
							<f:param name="outputFormat" value="DOCX" />
							<f:setPropertyActionListener target="#{report.reportKey}"
								value="#{printParams.saleInvoiceParams.invoicePrintTemplateValue}" />
						</aon:htmlCommandLink>
					</aon:if>															
					<aon:htmlCommandLink id="invoicePrint-report"
						value="#{bundle.aon_invoices}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}"
						actionListener="#{printParams.onInit}">
						<f:param name="reportKey" value="#{printParams.saleInvoiceParams.invoicePrintTemplateValue}" />
						<f:setPropertyActionListener target="#{report.reportKey}"
							value="#{printParams.saleInvoiceParams.invoicePrintTemplateValue}" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="receipt-report"
						value="#{bundle.finance_receipts}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" >
						<f:param name="reportKey" value="receipt" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="facturae"
						value="#{bundle.finance_facturae}" target="_blank"
						actionListener="#{invoicePrint.onDownloadFacturaeZip}"
						styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{invoicePrint}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:define name="columns">

						<aon:column alias="Invoice.issueDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.issueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column alias="Invoice.referenceCode"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_invoice_number}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>
	
						<aon:column alias="Invoice.series, Invoice.number"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_document_number}" />
							</f:facet>
							<aon:outputText value="#{to.documentNumber}" />
						</aon:column>
	
						<aon:column alias="Invoice.registryName"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_customer}" />
							</f:facet>
							<aon:outputText value="#{to.registryName}" />
						</aon:column>
	
						<aon:column alias="Invoice.registryDocument"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.registryDocument}" />
						</aon:column>
	
						<aon:column alias="Invoice.status"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{invoicePrint.invoiceTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
	
						<aon:if test="#{company.EInvoice}">					
							<aon:column alias="Invoice.signed"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_signature}" />
								</f:facet>
								<aon:outputText value="&#160;" rendered="#{to.signed}"
									title="#{bundle.sign_signed}"
									styleClass="aon-icon aon-icon-signed" />
								<aon:outputText value="&#160;" rendered="#{!to.signed}"
									title="#{bundle.sign_sign_pending}"
									styleClass="aon-icon aon-icon-unsigned" />
							</aon:column>
						</aon:if>
					</ui:define>
				</ui:decorate>
			</aon:div>
			
		</aon:form>

		<aon:if test="#{aonConfiguration.bean.invoice.showSendEmail}">
			<ui:decorate template="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" >
				<ui:param name="messageSuffix" value="-Invoice" />
				<ui:param name="skipSendButton" value="true" />
				<ui:param name="skipRecipients" value="true" />
				<ui:param name="skipAttachments" value="true" />
				<ui:param name="windowHeight" value="440" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="send"
						value="#{bundle.webmail_send}"
						styleClass="aon-icon-accept aon-finding-toolbar-item"
						actionListener="#{invoicePrint.onSendInvoicesByEmail}"
						reRender="#{sendButtonReRender}" >
						<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>
			
			<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
				<ui:param name="logPanelTitle" value="#{bundle.finance_invoice_send_email_title}" />
			</ui:include>		
			
		</aon:if>
		
		<aon:methodParam name="progressBarCloseActionListener"
			value="#{invoicePrint.onClosePanel}" type="actionListener" />
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/progressBar.xhtml">
			<ui:param name="progressLabel" value="#{bundle.finance_invoice_print}" />
			<ui:param name="progressBarBean" value="#{invoicePrint.progressionState}" />
			<ui:param name="progressBarSkipCloseButton" value="#{progressBarBean.progressionErrorMessage == null}"/>
			<ui:define name="progressBarFinishContent">
				<aon:htmlCommandLink id="downloadInvoicesZip"
					rendered="#{progressBarSkipCloseButton}"
					value="#{bundle.aon_fileupload_download}" target="_blank"
					styleClass="aon-commandButton"
					actionListener="#{invoicePrint.onDownloadInvoicesZip}" >
					<rich:componentControl for="progressBarPanel"
						disableDefault="true" event="onclick" operation="hide"/>					
				</aon:htmlCommandLink>
			</ui:define>
		</ui:decorate>
		
	</ui:define>

</ui:composition>
