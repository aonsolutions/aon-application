<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="integrityForm">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_invoice_integrity_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />
				
					<aon:outputText value="#{bundle.aon_date_select}" />
					<aon:div>
						<aon:outputLabel for="startDate"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="startDate" required="true"
							value="#{invoiceIntegrity.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>

						<aon:outputLabel for="endDate"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="endDate" required="true"
							value="#{invoiceIntegrity.endDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
					</aon:div>
					
					<aon:outputText value="" />
					<aon:div styleClass="aon-search-commandButton-left">
						<aon:div styleClass="aon-search-commandButton-right">
							<aon:commandButton id="SearchButton"   
								value="#{bundle.aon_search}"
								action="invoiceIntegrity_preview"
								actionListener="#{invoiceIntegrity.onPreview}"
								accesskey="#{bundle.aon_key_search}" />
						</aon:div>
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
