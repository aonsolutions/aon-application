<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="sepa_directDebit_list">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_sddMandate_module}" />
				<ui:param name="controller" value="#{sddMandate}" />
				<ui:param name="skipResetButton" value="#{true}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="sddMandate-sendEmail-all"
						value="&#160;" 
						actionListener="#{controller.onInitSendEmail}"
						rendered="#{!(empty controller.checkedCustomers)}"
						reRender="showNewMessageWindow-SddMandate"
						styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border">
					</aon:commandButton>	
					<aon:htmlCommandLink id="sddMandate-report-all"
						value="#{bundle.aon_listing}" target="_blank"
						rendered="#{!(empty controller.checkedCustomers)}"
						action="#{report.onExecute}" 
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="sddMandate" />
					</aon:htmlCommandLink>
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<f:facet name="header">
						<aon:panelGroup>
							<aon:outputText value="#{bundle.aon_apply_to_all}" />
						</aon:panelGroup>
					</f:facet>
				    <h:panelGrid columns="8">
						<aon:outputLabel for="sddMandate_sign_date" styleClass="aon-bold"
							value="#{bundle.finance_sddMandate_sign_date}: " />
						<aon:selectInputDate id="sddMandate_sign_date"
							value="#{sddMandate.signDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="sddMandate_reference-all" styleClass="aon-bold"
							value="#{bundle.aon_reference}: " />
						<aon:inputText id="sddMandate_reference-all"
							value="#{sddMandate.sameReferenceValue}" >
							<a4j:support event="onblur" reRender="sddMandate_reference-all" ajaxSingle="true" />
						</aon:inputText>
						
						<aon:outputLabel for="sddMandate_paymentType-all" styleClass="aon-bold"
							value="#{bundle.finance_sddMandate_paymentType}: " />
						<aon:selectOneRadio id="sddMandate_paymentType-all" 
							value="#{sddMandate.recurrentPayment}">
							<f:selectItem  itemValue="#{true}" 
								itemLabel="#{bundle.finance_sddMandate_recurrent}" />
							<f:selectItem itemValue="#{false}" 
								itemLabel="#{bundle.finance_sddMandate_oneOff}" />
						</aon:selectOneRadio>
				     		
						<aon:commandButton styleClass="aon-commandButton"
							value="#{bundle.aon_refresh}" 
							reRender="sepa_directDebit_list"
							actionListener="#{sddMandate.completeAllValues}"
							onclick="Richfaces.showModalPanel('waitProccess')" 
				     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
				     </h:panelGrid>
				</aon:panel>
				
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{sddMandate}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					
					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:panelGroup>
									<aon:commandButton styleClass="aon-icon-commandButton aon-icon-checkAll"
										title="#{bundle.aon_check_all}"
										value="&#160;"
										reRender="sepa_directDebit_list"
										actionListener="#{controller.checkAll}"
										ajaxSingle="true" 
										onclick="Richfaces.showModalPanel('waitProccess')" 
							     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
									<aon:commandButton styleClass="aon-icon-commandButton aon-icon-checkNone"
										title="#{bundle.aon_uncheck_all}"
										value="&#160;"
										reRender="sepa_directDebit_list"
										actionListener="#{controller.checkNone}"
										ajaxSingle="true" 
										onclick="Richfaces.showModalPanel('waitProccess')" 
							     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
								</aon:panelGroup>
							</f:facet>
							<aon:selectBooleanCheckbox id="Included_Row_checked"
								value="#{controller.rowChecked}" >
								<a4j:support event="onclick" 
									ajaxSingle="true"
									ignoreDumpResponses="true"
									limitToList="true"
									eventsQueue="sddMandateChecks"
									reRender="sepa_directDebit_list" />
							</aon:selectBooleanCheckbox>
							<f:facet name="footer">
								<aon:outputText value="#{controller.checkedCount}" />
							</f:facet>
						</aon:column>
						
						<ui:include src="/com/code/aon/ui/customer/facelet/customer/listExtended.xhtml" />
					
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:panelGroup>
									<aon:outputText value="#{bundle.aon_reference}" />
								</aon:panelGroup>
							</f:facet>
							<aon:inputText id="reference"
								disabled="#{!controller.rowChecked}"
								value="#{controller.referenceChanged}" >
								<a4j:support event="onblur" reRender="reference" ajaxSingle="true" />
							</aon:inputText>							
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_sddMandate_paymentType}"
									 styleClass="aon-margin-right" />
							</f:facet>
							<aon:panelGroup style="white-space:nowrap;">
								<aon:selectBooleanCheckbox id="recurrentPayment_Row_checked"
									disabled="#{!controller.rowChecked}"
									value="#{controller.recurrentPaymentChecked}"
									ajaxSingle="true" reRender="sepa_directDebit_list" />
								<aon:outputLabel for="recurrentPayment_Row_checked"
									value="#{bundle.finance_sddMandate_recurrent}"
									styleClass="aon-margin-right" />
								<aon:selectBooleanCheckbox id="oneOffPayment_Row_checked"
									disabled="#{!controller.rowChecked}"
									value="#{controller.oneOffPaymentChecked}"
									ajaxSingle="true" reRender="sepa_directDebit_list" />
								<aon:outputLabel for="oneOffPayment_Row_checked"
									value="#{bundle.finance_sddMandate_oneOff}" />
							</aon:panelGroup>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:panelGroup style="white-space:nowrap;">
								<aon:commandLink id="customerLink" immediate="true"
									styleClass="aon-button-goto" style="padding-right: 15px;"
									value="&#160;" title="#{bundle.aon_go}" 
									actionListener="#{controller.onLoadCustomer}"
									action="customer_form"
									reRender="aonContent" />
								<aon:commandButton id="sddMandate-email"
									title="#{bundle.webmail_send_email}"
									value="&#160;"
									rendered="#{controller.rowChecked and controller.customerEmailAvailable}"
									actionListener="#{controller.onSendByEmail}"
									styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border"
									reRender="sepa_directDebit_list, showNewMessageWindow" />
								<aon:htmlCommandLink id="sddMandate-report"
									title="#{bundle.aon_report}"
									value="&#160;" target="_blank"
									rendered="#{controller.rowChecked}"
									action="#{report.onExecute}" 
									styleClass="aon-finding-toolbar-item aon-icon-pdf aon-finding-toolbar-item-no-border"
									accesskey="#{bundle.aon_key_print}">
									<f:param name="reportKey" value="sddMandate" />
								</aon:htmlCommandLink>
							</aon:panelGroup>
						</aon:column>
						
					</ui:define>
				</ui:decorate>
				
			</aon:div>
		</aon:form>
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" >
			<ui:param name="addWaitProcessPoll" value="sepa_directDebit_list-WaitProcess" />
		</ui:include>
		
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" >
			<ui:param name="skipAttachButton" value="#{true}" />
		</ui:include>
		
		<aon:if test="#{aonConfiguration.bean.invoice.showSendEmail}">
			<ui:decorate template="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" >
				<ui:param name="messageSuffix" value="-SddMandate" />
				<ui:param name="skipSendButton" value="true" />
				<ui:param name="skipToEmail" value="true" />
				<ui:param name="skipAttachments" value="true" />
				<ui:param name="windowHeight" value="500" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="send"
						value="#{bundle.webmail_send}"
						styleClass="aon-icon-accept aon-finding-toolbar-item"
						actionListener="#{sddMandate.sendAllByEmail}"
						reRender="#{sendButtonReRender}" >
						<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>
			
			<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
				<ui:param name="logPanelTitle" value="#{bundle.finance_sddMandate_send_email_title}" />
				<ui:param name="closeButtonReRender" value="aonContent" />
			</ui:include>		
		</aon:if>
		
	</ui:define>
</ui:composition>
