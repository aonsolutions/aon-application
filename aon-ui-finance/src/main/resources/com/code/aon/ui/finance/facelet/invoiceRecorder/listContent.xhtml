<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="invoiceRecorderList">
	
			<ui:param name="controller" value="#{invoiceRecorder}" />
			<aon:if test="#{invoiceRecorderSearch.sales}">
				<ui:param name="toolbarTitle" value="#{bundle.finance_sale_invoice_recording_module}" />		
			</aon:if>
			<aon:if test="#{invoiceRecorderSearch.purchase}">
				<ui:param name="toolbarTitle" value="#{bundle.finance_purchase_invoice_recording_module}" />		
			</aon:if>
			<aon:if test="#{invoiceRecorderSearch.expenses}">
				<ui:param name="toolbarTitle" value="#{bundle.finance_expense_invoice_recording_module}" />		
			</aon:if>
			<aon:if test="#{invoiceRecorderSearch.undeductible}">
				<ui:param name="toolbarTitle" value="#{bundle.finance_undeductible_invoice_recording_module}" />		
			</aon:if>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="skipResetButton" value="true" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="filterButton"
						title="#{bundle.aon_show_filter}"
				        styleClass="aon-finding-toolbar-item aon-icon-filter"
				        onclick="document.querySelector('[id$=invoiceRecorderCommandContainer]').style.display = 'inline-table'; document.querySelector('[id$=filterButton]').style.display = 'none'; document.querySelector('[id$=noFilterButton]').style.display = 'inline'; 
				        		return false;"
				       	style="display:none;"/>
					<aon:commandButton id="noFilterButton"
						title="#{bundle.aon_hide_filter}"
					    styleClass="aon-finding-toolbar-item aon-icon-filter-off"
					    onclick="document.querySelector('[id$=invoiceRecorderCommandContainer]').style.display = 'none'; document.querySelector('[id$=filterButton]').style.display = 'inline'; document.querySelector('[id$=noFilterButton]').style.display = 'none'; 
			            		return false;"
			            style="display:inline;"/>
					<aon:commandButton id="record_selected"
						title="#{bundle.finance_record}"
						rendered="#{controller.model.rowCount > 0 and invoiceRecorderSearch.defaultStatus == 'PENDING'}"
						reRender="invoiceRecorderList"
						styleClass="aon-finding-toolbar-item aon-icon-done-all"
						actionListener="#{controller.onRecordSelected}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
					<aon:commandButton id="unrecord_selected"
						title="#{bundle.finance_unrecord}"
						rendered="#{controller.model.rowCount > 0 and invoiceRecorderSearch.defaultStatus != 'PENDING'}"
						reRender="invoiceRecorderList"
						styleClass="aon-finding-toolbar-item aon-icon-remove-done"
						actionListener="#{controller.onUnrecordSelected}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
				</ui:define>
	
			</ui:decorate>
	
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">   
					<aon:panel id="invoiceRecorderCommandContainer" styleClass="aon-group" style="width: -moz-available; !important;">
						<aon:panelGrid id="filterTable1" columns="2" style="padding: 0px !important; width: 100% !important;">
							<aon:div>	
								<aon:outputText value="#{bundle.aon_type}:" styleClass="aon-bold aon-margin-left" />									
								<aon:selectOneMenu id="filterType"
									value="#{invoiceRecorderSearch.defaultType}"
									styleClass="aon-margin-left" >
										<f:selectItem itemLabel="#{bundle.aon_sales}" itemValue="SALES" />
										<f:selectItem itemLabel="#{bundle.aon_purchases}" itemValue="PURCHASE" />
										<f:selectItem itemLabel="#{bundle.aon_expenses}" itemValue="EXPENSES" />
										<f:selectItem itemLabel="#{bundle.finance_undeductible_invoice_management_module}" itemValue="UNDEDUCTIBLE" />
									    <a4j:support event="onchange"
									    action="#{controller.afterSearchAction}"
										actionListener="#{controller.onSearchList}"
									    reRender="invoiceRecorderList"
									    onsubmit="Richfaces.showModalPanel('waitProccess')"
									    oncomplete="Richfaces.hideModalPanel('waitProccess')"/>
								</aon:selectOneMenu>
									
								<aon:outputLabel for="Invoice_status" value="#{bundle.aon_status}:" styleClass="aon-bold aon-margin-left" />
								<aon:selectOneMenu id="Invoice_status"
									value="#{invoiceRecorderSearch.defaultStatus}"
									styleClass="aon-margin-left" >
									<f:selectItem itemLabel="#{bundle.finance_not_recorded}" itemValue="PENDING" />
									<f:selectItem itemLabel="#{bundle.finance_invoice_recorded}" itemValue="SCORED" />
									<a4j:support event="onchange"
									    action="#{controller.afterSearchAction}"
										actionListener="#{controller.onSearchList}"
									    reRender="invoiceRecorderList"
									    onsubmit="Richfaces.showModalPanel('waitProccess')"
									    oncomplete="Richfaces.hideModalPanel('waitProccess')"/>
								</aon:selectOneMenu>
								
								<!-- <aon:outputLabel value="#{bundle.aon_date}:" styleClass="aon-bold aon-margin-left"/>
									<aon:outputLabel for="Invoice_issueDate-From" styleClass="aon-form-date-label aon-padding-right" 
										value="#{bundle.aon_date_from}:" />
									<aon:selectInputDate id="Invoice_issueDate-From"
										value="#{invoiceRecorderSearch.defaultDateFrom}"
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}"
   										onvaluechange="setTimeout(function() { document.getElementById(aonContent:invoiceRecorderList:dateForm:searchDateButton).click(); }, 100);" />
									<aon:outputLabel for="Invoice_issueDate-To" styleClass="aon-form-date-label aon-padding-right" 
										value="#{bundle.aon_date_to}:" />
									<aon:selectInputDate id="Invoice_issueDate-To"
										value="#{invoiceRecorderSearch.defaultDateTo}"
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}"
    									onchange="setTimeout(function() { document.getElementById(aonContent:invoiceRecorderList:dateForm:searchDateButton).click(); }, 100);" /> 								
									<aon:commandButton id="searchDateButton"
										styleClass="aon-finding-toolbar-item aon-icon-close"
										action="#{controller.afterSearchAction}"
										actionListener="#{controller.onSearchList}"
									    reRender="invoiceRecorderList"
									    onsubmit="Richfaces.showModalPanel('waitProccess')"
									    oncomplete="Richfaces.hideModalPanel('waitProccess')"/> -->
							</aon:div>
							<aon:div style="text-align: right;">
								<aon:commandButton id="InvoiceRecorder-close"
									styleClass="aon-finding-toolbar-item aon-icon-close"
									onclick="document.querySelector('[id$=invoiceRecorderCommandContainer]').style.display = 'none'; document.querySelector('[id$=filterButton]').style.display = 'inline'; document.querySelector('[id$=noFilterButton]').style.display = 'none'; return false;"/>
							</aon:div>
						</aon:panelGrid>
						<aon:panelGrid id="filterTable2" columns="1" style="padding: 0px !important;">
							<aon:div>	
								<aon:outputText value="#{bundle.aon_check}:" styleClass="aon-bold aon-margin-left" />									
									<aon:selectOneMenu id="filterSelectionCheckRadioAon"
										value="#{controller.checkOption}"
										styleClass="aon-margin-left" >
											<f:selectItem itemLabel="#{bundle.finance_none}" itemValue="InvoiceRecorder-checkNothing" />
										    <f:selectItem itemLabel="#{bundle.finance_all}" itemValue="InvoiceRecorder-checkAll" />
										    <f:selectItem itemLabel="#{bundle.finance_right}" itemValue="InvoiceRecorder-checkRight" />
										    <f:selectItem itemLabel="#{bundle.finance_warned}" itemValue="InvoiceRecorder-checkWarned" />
										    <f:selectItem itemLabel="#{bundle.finance_brokendown}" itemValue="InvoiceRecorder-checkBrokenDown" />
										    <f:selectItem itemLabel="#{bundle.finance_unbrokendown}" itemValue="InvoiceRecorder-checkUnBrokenDown" />
										    <f:selectItem itemLabel="#{bundle.finance_entry_visible}" itemValue="InvoiceRecorder-checkEntryVisible" />
										    <f:selectItem itemLabel="#{bundle.finance_entry_invisible}" itemValue="InvoiceRecorder-checkEntryInvisible"/>
										    <a4j:support event="onchange"
										    actionListener="#{controller.onCheckOption}"
										    reRender="invoiceRecorderList"
										    onsubmit="Richfaces.showModalPanel('waitProccess')"
										    oncomplete="Richfaces.hideModalPanel('waitProccess')"/>
									</aon:selectOneMenu>
							
									<aon:outputText value="#{bundle.finance_tobreakdown}:"
										styleClass="aon-bold aon-margin-left" />
									<aon:selectOneMenu id="filterSelectionShowBreakDownRadioAon"
										value="#{controller.showBreakDownOption}"
										styleClass="aon-margin-left" >
											<f:selectItem itemLabel="#{bundle.finance_none}" itemValue="InvoiceRecorder-showBreakDownNothing" />
										    <f:selectItem itemLabel="#{bundle.finance_all}" itemValue="InvoiceRecorder-showBreakDownAll" />
										    <f:selectItem itemLabel="#{bundle.finance_checked}" itemValue="InvoiceRecorder-showBreakDownChecked" />
										    <f:selectItem itemLabel="#{bundle.finance_unchecked}" itemValue="InvoiceRecorder-showBreakDownUnChecked" />
										    <f:selectItem itemLabel="#{bundle.finance_right}" itemValue="InvoiceRecorder-showBreakDownRight" />
										    <f:selectItem itemLabel="#{bundle.finance_incorrect}" itemValue="InvoiceRecorder-showBreakDownIncorrect" />
										    <f:selectItem itemLabel="#{bundle.finance_warned}" itemValue="InvoiceRecorder-showBreakDownWarned" />
										    <a4j:support event="onchange"
										    actionListener="#{controller.onShowBreakDownOption}"
										    reRender="invoiceRecorderList"
										    onsubmit="Richfaces.showModalPanel('waitProccess')"
										    oncomplete="Richfaces.hideModalPanel('waitProccess')"/>
									</aon:selectOneMenu>
										
									<aon:outputText value="#{bundle.finance_view_entry}:"
										styleClass="aon-bold aon-margin-left" />
									<aon:selectOneMenu id="filterSelectionShowAccountEntryRadioAon"
										value="#{controller.showAccountEntryOption}"
										styleClass="aon-margin-left" >
											<f:selectItem itemLabel="#{bundle.finance_none}" itemValue="InvoiceRecorder-showNothingAccountEntry" />
										    <f:selectItem itemLabel="#{bundle.finance_all}" itemValue="InvoiceRecorder-showAllAccountEntry" />
										    <f:selectItem itemLabel="#{bundle.finance_checked}" itemValue="InvoiceRecorder-showCheckedAccountEntry" />
										    <f:selectItem itemLabel="#{bundle.finance_unchecked}" itemValue="InvoiceRecorder-showUnCheckedAccountEntry" />
										    <f:selectItem itemLabel="#{bundle.finance_right}" itemValue="InvoiceRecorder-showRightAccountEntry" />
										    <f:selectItem itemLabel="#{bundle.finance_incorrect}" itemValue="InvoiceRecorder-showIncorrectAccountEntry" />
										    <f:selectItem itemLabel="#{bundle.finance_warned}" itemValue="InvoiceRecorder-showWarnedAccountEntry" />
										    <a4j:support event="onchange"
										    actionListener="#{controller.onShowAccountEntryOption}"
										    reRender="invoiceRecorderList"
										    onsubmit="Richfaces.showModalPanel('waitProccess')"
										    oncomplete="Richfaces.hideModalPanel('waitProccess')"/>
									</aon:selectOneMenu>
								</aon:div>
						</aon:panelGrid>
					</aon:panel>
	
				<aon:panelGrid id="invoiceRecorderPanel" columns="2" styleClass="aon-width-all" 
				columnClasses="aon-vertical-align-top ,aon-vertical-align-top ">
					<aon:div id="invoiceRecorderDataDiv" >
						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
							<ui:param name="skipSelectButton" value="#{true}" />
							<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
		
							<ui:define name="columns">
		
								<aon:column styleClass="aon-editDataTable-iconColumn">
									<aon:commandLink id="selectButton"
										styleClass="aon-table-row-link" value="&#160;"
										requestDelay="100" action="#{controller.invoiceView}"
										actionListener="#{controller.onLoadInvoice}"
										onkeyup="#{dataTableId}KeyUp(this)"
										onfocus="#{dataTableId}SelectRow(this)"
										onblur="#{dataTableId}DeselectRow(this)"
										focus="#{(focusOnSelect != null)?(focusOnSelect):''}"
										reRender="#{rowSelectorReRender}">
									</aon:commandLink>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-iconColumn">
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:selectBooleanCheckbox id="Included_Row_checked"
										value="#{to.checked}" rendered="#{to.recordable}" />
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-iconColumn">
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:div style="display:inline;cursor:pointer;"
										rendered="#{to.commentPresent}">
										<aon:outputText value="&#160;" styleClass="aon-icon-comment"
											style="padding-left:20px"
											rendered="#{to.commentPresent}" />
										<rich:toolTip value="#{to.invoice.comments}">
										</rich:toolTip>
									</aon:div>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-iconColumn">
									<f:facet name="header">
										<aon:outputText value="C" />
									</f:facet>
									<aon:div style="display:inline;cursor:pointer;"
										rendered="#{to.messagesPresent}">
										<aon:outputText value="&#160;" styleClass="aon-icon-exception"
											style="padding-left:20px" rendered="#{!to.recordable}" />
										<aon:outputText value="&#160;"
											styleClass="aon-icon-errorwarning" style="padding-left:20px"
											rendered="#{to.recordable}" />
										<rich:toolTip>
											<rich:dataList value="#{to.messages}" var="msg"
												style="margin-left: 15px;">
												<aon:outputText value="#{msg}" />
											</rich:dataList>
										</rich:toolTip>
									</aon:div>
								</aon:column>
		
								<aon:column alias="Invoice.referenceCode"
									styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_invoice_number}" />
									</f:facet>
									<aon:outputText value="#{to.invoice.referenceCode}" />
								</aon:column>
			
								<aon:column alias="Invoice.series,Invoice.number"
									styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_document_number}" />
									</f:facet>
									<aon:outputText value="#{to.invoice.documentNumber}" />
								</aon:column>
		
								<aon:column alias="Invoice.registryName"
									styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_customer}" />
									</f:facet>
									<aon:outputText value="#{to.invoice.registryName}" />
								</aon:column>
		
								<aon:column
									styleClass="aon-editDataTable-textColumn aon-width-100">
									<f:facet name="header">
										<aon:outputText value="#{bundle.account_account}" />
									</f:facet>
									<aon:outputText value="#{to.account.code}" />
								</aon:column>
		
								<aon:column alias="Invoice.issueDate"
									styleClass="aon-editDataTable-textColumn aon-width-80">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_date}" />
									</f:facet>
									<aon:outputText value="#{to.invoice.issueDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
								</aon:column>
		
								<aon:column alias="Invoice.taxDate"
									styleClass="aon-editDataTable-textColumn aon-width-80">
									<f:facet name="header">
										<aon:outputText value="#{bundle.finance_tax_date}" />
									</f:facet>
									<aon:outputText value="#{to.invoice.taxDate}"
										style="#{!to.dateEquals?'color:red':''}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
								</aon:column>
		
								<aon:column
									styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_total}" />
									</f:facet>
									<aon:outputText value="#{to.invoiceTotal}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-iconColumn">
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:div id="showInvoiceAttachButton" 
									rendered="#{to.invoice.attachmentAvailable or to.invoice.sales}" >
										<aon:commandButton title="#{bundle.finance_show}"
												reRender="invoiceAttachDiv"
												styleClass="aon-editDataTable-button aon-icon-pdf"
												actionListener="#{controller.onShowInvoiceAttach}"
										>
										</aon:commandButton>
									</aon:div>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-iconColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.account_entry}" />
									</f:facet>
									<aon:div id="showAccountEntry">
										<aon:commandLink value="#{bundle.aon_show}"
											reRender="#{dataTableId},showAccountEntry"
											rendered="#{!to.showAccountEntry}"
											actionListener="#{controller.onShowAccountEntry}" />
										<aon:commandLink value="#{bundle.finance_hide}"
											reRender="#{dataTableId},showAccountEntry"
											rendered="#{to.showAccountEntry}"
											actionListener="#{controller.onHideAccountEntry}" />
									</aon:div>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-iconColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.finance_breakdown}" />
									</f:facet>
									<aon:div id="showTaxBreakDowns">
										<aon:commandLink value="#{bundle.aon_show}"
											reRender="#{dataTableId},showTaxBreakDowns"
											rendered="#{!to.showTaxBreakDowns}"
											actionListener="#{controller.onShowTaxBreakDowns}" />
										<aon:commandLink value="#{bundle.finance_hide}"
											reRender="#{dataTableId},showTaxBreakDowns"
											rendered="#{to.showTaxBreakDowns}"
											actionListener="#{controller.onHideTaxBreakDowns}" />
									</aon:div>
								</aon:column>
		
									<rich:subTable id="TaxBreakDownsSubTable" value="#{to.taxBreakDowns}" var="taxBreakDown" rendered="#{to.showTaxBreakDowns}">
										<aon:column colspan="12"
											style="padding: 0px; border: none;background-color: #FBEDB6;">
											<aon:panelGrid columns="5" style="font-size: 0.9em; width: 100%;"
												cellpadding="0" cellspacing="0" border="0"
												columnClasses="aon-width-auto
												 				,aon-width-40 aon-editDataTable-textColumn aon-form-date-label aon-noborder
												 				,aon-width-70 aon-editDataTable-numberColumn aon-noborder
												 				,aon-width-70 aon-editDataTable-numberColumn aon-noborder
												 				,aon-width-70 aon-editDataTable-numberColumn aon-noborder">
		
												<aon:outputText value="&#160;" />
		
												<aon:outputText value="#{taxBreakDown.taxType}" />
		
												<aon:outputText value="#{taxBreakDown.base}">
													<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
												</aon:outputText>
		
												<aon:div>
													<aon:outputText value="#{taxBreakDown.taxPercent}">
														<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
													</aon:outputText>
													<aon:outputText value="%" />
												</aon:div>
		
												<aon:outputText value="#{taxBreakDown.taxQuota}">
													<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
												</aon:outputText>
		
												<aon:outputText value="&#160;"
													rendered="#{to.invoice.surcharge}" />
		
												<aon:outputText value="#{bundle.aon_surcharge}"
													rendered="#{to.invoice.surcharge}" />
		
												<aon:outputText value="#{taxBreakDown.base}"
													rendered="#{to.invoice.surcharge}">
													<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
												</aon:outputText>
		
												<aon:div rendered="#{to.invoice.surcharge}">
													<aon:outputText value="#{taxBreakDown.surchargePercent}">
														<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
													</aon:outputText>
													<aon:outputText value="%" />
												</aon:div>
		
												<aon:div rendered="#{to.invoice.surcharge}">
													<aon:outputText value="#{taxBreakDown.surchargeQuota}">
														<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
													</aon:outputText>
												</aon:div>
											</aon:panelGrid>
										</aon:column>
										<aon:column
											style="padding: 0px; border: none;background-color: #FBEDB6;">
											<aon:outputText value="&#160;" />
										</aon:column>
									</rich:subTable>
									<rich:subTable id="AccountEntryTable" value="#{to.details}" var="preAccountEntry" rendered="#{to.showAccountEntry}">
		
										<aon:column
											style="padding: 0px; border: none;background-color: #F2FDEC;font-size: 0.9em;">
										</aon:column>
	
										<aon:column colspan="3"
											style="padding: 0px; border: none;background-color: #F2FDEC;font-size: 0.9em;">
											<aon:div rendered="#{preAccountEntry.line == 1}">
												<aon:outputText value="#{bundle.account_account_entry}: " />
												<aon:outputText value="#{preAccountEntry.accountEntry.id}" />
											</aon:div>
										</aon:column>
	
										<aon:column
											style="padding: 0px; border: none;background-color: #F2FDEC;font-size: 0.9em;">
											<aon:div rendered="#{preAccountEntry.line == 1}">
												<aon:outputText value="#{bundle.aon_date}: " />
												<aon:outputText value="#{preAccountEntry.accountEntry.entryDate}">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
											</aon:div>
