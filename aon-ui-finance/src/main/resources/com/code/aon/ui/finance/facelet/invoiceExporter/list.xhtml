<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="invoiceExporterForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_invoiceExport_module}" />
				<ui:param name="controller" value="#{invoiceExporter}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="startDownloadExport"
						value="#{bundle.webmail_download}: #{exporter.configuration.type}"
						styleClass="aon-finding-toolbar-item aon-icon-mail-save" 
						disabled="#{empty invoiceExporter.checkList}" reRender="invoiceExporterToolbar,invoiceDataDiv"
						actionListener="#{invoiceExporter.onStart}" >
						<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
					</aon:commandButton>
					<aon:commandButton id="configurationExport"
						value="#{bundle.aon_configuration}"
						styleClass="aon-finding-toolbar-item aon-icon-config"
						action="exporter_form">
						<f:setPropertyActionListener value="invoiceExporter_list"
							target="#{exporter.backAction}" />						
					</aon:commandButton>
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-toolbar" rendered="#{invoiceExporter.model.rowCount > 0}">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						ajaxSingle="true" reRender="invoiceDataDiv,invoiceExporterToolbar"
						actionListener="#{invoiceExporter.checkAll}"/>	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						ajaxSingle="true" reRender="invoiceDataDiv,invoiceExporterToolbar"
						actionListener="#{invoiceExporter.checkNone}" />				
				</aon:div>
				<aon:div id="invoiceDataDiv">					
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{invoiceExporter}" />
						<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
						<ui:param name="skipSelectButton" value="#{true}" />
						<ui:define name="columns">
						
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:selectBooleanCheckbox id="Included_Row_checked"
									value="#{invoiceExporter.rowChecked}"
									ajaxSingle="true" reRender="invoiceExporterToolbar" />	
							</aon:column>

							<aon:column alias="Invoice.issueDate"
								styleClass="aon-editDataTable-textColumn aon-width-80">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_date}" />
								</f:facet>
								<aon:outputText value="#{to.issueDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:column>
		
							<aon:column alias="Invoice.referenceCode"
								styleClass="aon-editDataTable-textColumn aon-width-100">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_invoice_number}" />
								</f:facet>
								<aon:outputText value="#{to.referenceCode}" />
							</aon:column>
	
							<aon:column alias="Invoice.series,Invoice.number"
								styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-80">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_document_number}" />
								</f:facet>
								<aon:outputText value="#{to.documentNumber}" />
							</aon:column>
		
							<aon:column alias="Invoice.registryName"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.warehouse_stock_target}" />
								</f:facet>
								<aon:outputText value="#{to.registryName}" />
							</aon:column>

							<aon:column alias="Invoice.registryDocument" 
								styleClass="aon-editDataTable-textColumn aon-width-80">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_company_document}" />
								</f:facet>
								<aon:outputText value="#{to.registryDocument}" />
							</aon:column>

							<aon:column alias="Invoice.type"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_type}" />
								</f:facet>
								<aon:outputText value="#{to.type}" />
							</aon:column>
		
							<aon:column alias="Invoice.status"
								styleClass="aon-editDataTable-textColumn aon-width-80"
								style="font-size: 0.9em;">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_status}" />
								</f:facet>
								<aon:outputText value="#{to.status}" />
							</aon:column>
							
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_total}" />
								</f:facet>
								<aon:outputText value="#{to.total}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
							</aon:column>							
	
							<c:if test="#{company.EInvoice}">
								<aon:column alias="Invoice.signed"
									styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_signature}" />
									</f:facet>
									<aon:outputText value="&#160;" rendered="#{to.signed}"
										title="#{bundle.sign_signed}"
										styleClass="aon-icon aon-icon-signed" />
									<aon:outputText value="&#160;" rendered="#{!to.signed}"
										title="#{bundle.sign_sign_pending}"
										styleClass="aon-icon aon-icon-unsigned" />
								</aon:column>
							</c:if>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>

		<aon:methodParam name="closeLogPanelAtionListener" value="#{exporter.onFinish}" type="actionListener" />
		<ui:decorate template="/com/code/aon/faces/logPanel/modal.xhtml" >
			<ui:param name="logPanelTitle" value="#{bundle.finance_invoiceExport_module}" />			
			<ui:param name="pollInterval" value="5000" /> 
			<ui:define name="additionalLogPanelContent">
				<c:if test="#{exporter.finished}">
					<aon:div styleClass="aon-margin-bottom">
						<aon:htmlCommandLink id="downloadExport"
							value="#{bundle.aon_fileupload_download}" target="_blank"
							actionListener="#{exporter.onDownload}"
							style="border: none;"
							styleClass="aon-finding-toolbar-item aon-icon-mail-save" >
							<rich:componentControl for="logPanel" operation="hide" event="onclick" />
						</aon:htmlCommandLink>
					</aon:div>
				</c:if>
			</ui:define>
		</ui:decorate>	
		
	</ui:define>
</ui:composition>
