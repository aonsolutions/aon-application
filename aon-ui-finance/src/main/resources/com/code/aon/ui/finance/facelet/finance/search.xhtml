<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="financeSearch">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{(finance.payment) ? (bundle.finance_payment_module) : (bundle.finance_charge_module)}" />
				<ui:param name="controller" value="#{finance}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="corporateIdentityReceipt"
						value="#{bundle.warehouse_delivery_arrived}"
						title="#{bundle.registry_corporateIdentity_receipt}"
						styleClass="aon-finding-toolbar-item aon-icon-page"
						actionListener="#{corporateIdentity.onInit}"
						action="corporateIdentity_receipt">
						<f:setPropertyActionListener target="#{corporateIdentity.showBackButton}"
							value="#{true}" />
						<f:setPropertyActionListener target="#{corporateIdentity.backAction}"
							value="finance_search" />
					</aon:commandButton>
					<aon:if test="#{controller.payroll}">
						<aon:commandButton id="generateFinances-Popup"
							value="#{bundle.aon_generate}"
							title="#{bundle.aon_generate}"
							styleClass="aon-finding-toolbar-item aon-icon-open-popup"
							actionListener="#{controller.onGeneratePayrollFinancesShow}"
							action="finance_list">
							<f:setPropertyActionListener target="#{controller.showFinancePayrollWindow}"
								value="#{true}" />
						</aon:commandButton>
					</aon:if>
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{finance}" />
				<ui:param name="searchController" value="#{financeSearch}" />
				<ui:define name="searchContent">
					<ui:include src="/com/code/aon/ui/finance/facelet/finance/searchContent.xhtml" />
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<ui:include src="/com/code/aon/ui/finance/facelet/finance/modalPayroll.xhtml" />
	</ui:define>
</ui:composition>
