<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="bankStatementSearch">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_bank_statement_module}" />
				<ui:param name="controller" value="#{bankStatement}" />
				<ui:define name="beforeToolbarContent">
					<aon:methodParam name="resetAction" value="bankStatement_list" />
					<aon:methodParam name="resetActionListener" value="#{bankStatement.onFullReset}" type="actionListener" />
				</ui:define>
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="import-Popup"
						title="#{bundle.aon_import}"
						styleClass="aon-finding-toolbar-item rich-fileupload-ico-add"
						actionListener="#{controller.onImportFileShow}"
						action="bankStatement_list">
						<f:setPropertyActionListener target="#{controller.showImportFileWindow}"
							value="#{true}" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{bankStatement}" />
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">

				<!-- TODAS LAS BUSQUEDAS QUE SE HAGAN PARA ESTE CONTROLLER TIENEN QUE IR IMPLEMENTADAS EN EL SEARCHLISTENER, EXCEPTO ESTE CAMPO
						ESTO ES ASI PARA PODER CAMBIAR DE BANCO EN EL FORM EN CUALQUIER MOMENTO Y TE MANTENGA LOS CRITERIOS DE BUSQUEDA  -->
					<aon:outputLabel for="BankStatement_registryBank_id"
						value="#{bundle.aon_bank}" />
					<aon:div id="BankStatement_registryBank_id_div">
						<aon:selectOneMenu id="BankStatement_registryBank_id"
							value="#{controller.registryBank}"
							valueChangeListener="#{controller.addIdEqualExpression}">
							<aon:if test="#{controller.showInactiveBanks}">
								<f:selectItems value="#{companyCollections.allCompanyBanks}" />
							</aon:if>
							<aon:if test="#{!controller.showInactiveBanks}">
								<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
							</aon:if>
						</aon:selectOneMenu>
						<aon:selectBooleanCheckbox id="BankStatement_showInactiveBanks"
                            value="#{controller.showInactiveBanks}"
                            valueChangeListener="#{controller.onShowInactiveBanksChange}"
                            immediate="true"
                            reRender="BankStatement_registryBank_id_div"
                            styleClass="aon-margin-left" />
						<aon:outputText styleClass="aon-italic aon-margin-left"
							value="Mostrar bancos inactivos"/>
					</aon:div>

					<aon:outputLabel 
						value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="BankStatement_operationDate-From" 
							styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="BankStatement_operationDate-From"
							value="#{bankStatementSearch.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="BankStatement_operationDate-To" 
							styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="BankStatement_operationDate-To"
							value="#{bankStatementSearch.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>

					<aon:outputLabel for="BankStatement_payment"
						value="#{bundle.aon_type}" />
					<aon:selectOneRadio id="BankStatement_payment"
						value="#{bankStatementSearch.payment}">
						<f:selectItem itemLabel="#{bundle.aon_contact_category}" itemValue="true" />
						<f:selectItem itemLabel="#{bundle.finance_bank_statement_charge}" itemValue="false" />
					</aon:selectOneRadio>

					<aon:outputLabel for="BankStatement_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="BankStatement_amount"
						value="#{bankStatementSearch.amount}"
						size="12" />

					<aon:outputLabel for="BankStatement_description" 
						value="#{bundle.aon_concept}" />
					<aon:inputText id="BankStatement_description"
						value="#{bankStatementSearch.description}"
						size="50" />

					<aon:outputLabel for="BankStatement_comments" 
						value="#{bundle.aon_comment}" />
					<aon:inputText id="BankStatement_comments"
						value="#{bankStatementSearch.comments}"
						size="50" />

					<aon:outputLabel for="BankStatement_commonConcept"
						value="#{bundle.aon_operation}" />
					<aon:selectOneMenu id="BankStatement_commonConcept"
						value="#{bankStatementSearch.commonConcept}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{financeCollections.statementConcepts}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="BankStatement_lotNumber" 
						value="#{bundle.finance_bank_statement_lot}" />
					<aon:inputText id="BankStatement_lotNumber"
						value="#{bankStatementSearch.lotNumber}"
						size="5" />

					<aon:if test="#{aonRole.confidentiality}">
						<aon:outputLabel for="BankStatement_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneRadio id="BankStatement_securityLevel"
							value="#{bankStatementSearch.confidential}">
							<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
							<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
						</aon:selectOneRadio>				
					</aon:if>

					<aon:outputLabel for="BankStatement_status" 
						value="#{bundle.aon_status}"/>
					<aon:selectManyCheckbox id="BankStatement_status"
						value="#{bankStatementSearch.statementStatuses}">
						<f:selectItems value="#{financeCollections.statementStatuses}"/>
					</aon:selectManyCheckbox>							
	
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
