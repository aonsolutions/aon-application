<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="invoiceExporterForm">
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_invoiceExport_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_configuration}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="#{toolbarID}-save"
						title="#{bundle.aon_key_save_accelerator}"
						value="#{bundle.aon_save}"
						actionListener="#{invoiceExporter.onSaveConfiguration}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}" />
					<aon:commandButton id="#{toolbarID}-back"
						title="#{bundle.aon_key_cancel_accelerator}"
						value="#{bundle.aon_back}"
						rendered="#{invoiceExporter.configuration.configured}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						action="#{invoiceExporter.backAction}"
						accesskey="#{bundle.aon_key_cancel}" />				
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">

					<aon:outputLabel for="InvoiceExporter_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="InvoiceExporter_type"
						value="#{invoiceExporter.configuration.type}" required="true"
						reRender="invoiceExporterForm" ajaxSingle="false">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{financeCollections.invoiceExportTypes}" />
					</aon:selectOneMenu>

					<c:if test="#{(invoiceExporter.configuration.type == 'A3') or (invoiceExporter.configuration.type == 'GEYCE')}">
						<aon:outputLabel for="InvoiceExporter_enterpriseCode"
							value="#{bundle.aon_company_id}" />
						<aon:inputText id="InvoiceExporter_enterpriseCode"
							value="#{invoiceExporter.configuration.enterpriseCode}"
							size="10" maxlength="#{invoiceExporter.configuration.enterpriseCodeLength}"
							required="true" />
					</c:if> 
	
					<c:if test="#{invoiceExporter.configuration.type == 'GEYCE'}">
						<aon:outputLabel for="Geyce_journal_general"
							value="#{bundle.finance_journal_general}" />
						<aon:inputText id="Geyce_journal_general"
							size="2" maxlength="2" required="true"
							value="#{invoiceExporter.configuration.generalJournal}" />

						<aon:outputLabel for="Geyce_journal_purchases"
							value="#{bundle.finance_journal_purchases}" />
						<aon:inputText id="Geyce_journal_purchases"
							size="2" maxlength="2"
							value="#{invoiceExporter.configuration.purchaseJournal}" />

						<aon:outputLabel for="Geyce_journal_sales"
							value="#{bundle.finance_journal_sales}" />
						<aon:inputText id="Geyce_journal_sales"
							size="2" maxlength="2"
							value="#{invoiceExporter.configuration.salesJournal}" />
							
						<aon:outputLabel for="Geyce_journal_expenses"
							value="#{bundle.finance_journal_expenses}" />
						<aon:inputText id="Geyce_journal_expenses"
							size="2" maxlength="2"
							value="#{invoiceExporter.configuration.expensesJournal}" />
							
					</c:if>												
						
				</aon:panelGrid>

			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
