<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
		<aon:form id="customerForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_sddMandate_module}" />
				<ui:param name="controller" value="#{sddMandate}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>
		
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{sddMandate}" />
				<ui:param name="searchController" value="#{sddMandateSearch}" />
				<ui:define name="searchContent">
					<aon:outputText value="" />
					<aon:div styleClass="aon-search-content-width">
						<aon:panelCollapsible expanded="true" label="#{bundle.aon_customer}">
							<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
								<ui:include src="/com/code/aon/ui/registry/facelet/registry/searchContent.xhtml">
									<ui:param name="includeRegistryScope" value="#{true}"/>
								</ui:include>
									
								<aon:if test="#{company.EInvoice}">
									<aon:outputLabel for="Customer_EInvoice"
										value="#{bundle.customer_eInvoice}" />
									<aon:selectOneMenu id="Customer_EInvoice"
										valueChangeListener="#{controller.addExpression}">
										<f:selectItem itemLabel="-"	itemValue="#{null}" />
										<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
										<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
									</aon:selectOneMenu>								
								</aon:if>
								
								<aon:if test="#{aonConfiguration.bean.customer.showTariff}">
									<aon:outputLabel for="Customer_tariff_id"
										value="#{bundle.report_tariff}" />
									<aon:selectOneMenu id="Customer_tariff_id"
										value="#{configCollections.tariff}"
										valueChangeListener="#{controller.addIdEqualExpression}">
										<f:selectItem itemLabel="-" value="#{null}" />
										<f:selectItems value="#{configCollections.tariffs}" />
									</aon:selectOneMenu>
								</aon:if>	
								
								<ui:include src="/com/code/aon/ui/registry/facelet/registry/searchProjectContent.xhtml" />
								
								<aon:outputText value="#{bundle.aon_status}"/>
								<aon:selectManyCheckbox value="#{searchController.customerStatuses}">
									<f:selectItems value="#{customerCollections.customerStatuses}"/>
								</aon:selectManyCheckbox>
							</aon:panelGrid>
						</aon:panelCollapsible>
						
						<aon:panelCollapsible expanded="false" label="#{bundle.registry_address_module}">
							<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
								<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml">
									<ui:param name="searchController" value="#{sddMandateSearch}" />
								</ui:include>
							</aon:panelGrid>
						</aon:panelCollapsible>
				
						<aon:if test="#{aonConfiguration.bean.customer.showFinanceData}">
							<aon:panelCollapsible expanded="false" label="#{bundle.registry_finance_data_module}">
								<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
									<ui:include src="/com/code/aon/ui/registry/facelet/rpaymethod/searchContent.xhtml">
										<ui:param name="searchController" value="#{sddMandateSearch}" />
									</ui:include>
								</aon:panelGrid>
							</aon:panelCollapsible>
						</aon:if>
						
					</aon:div>		
				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>	

</ui:composition>
