<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showActivityWindow">
		<aon:if test="#{invoiceController.showActivityWindow}">
			<rich:modalPanel id="activityModalPanel" minHeight="200"
				minWidth="590" rendered="#{invoiceController.showActivityWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText 
							value="#{bundle.aon_activity}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showActivityWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showActivityWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="activityForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="activity-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{invoiceController.addInvoiceActivity}"
										onclick="Richfaces.showModalPanel('waitProccess')" 
							     		oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<aon:actionHotKey key="return" />
										<rich:componentControl for="activityModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{invoiceController.showActivityWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="activity-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_cancel}"
										actionListener="#{invoiceController.refresh}">
										<f:setPropertyActionListener
											target="#{invoiceController.showActivityWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

										<aon:outputLabel for="Activity_id" value="#{bundle.aon_activity}" />
										<aon:selectOneMenu id="Activity_id"
											value="#{invoiceController.to.activity}"
											actionListener="#{invoiceController.onActivityChanged}">
											<f:selectItem itemLabel="- #{bundle.aon_common_all} -" value="#{null}" />
											<f:selectItems value="#{companyCollections.companyActivities}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
