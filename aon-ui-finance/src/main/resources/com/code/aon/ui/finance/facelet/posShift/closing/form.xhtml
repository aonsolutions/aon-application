<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posClosingForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_posClosing_module}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="posClosing-closePos" 
						styleClass="aon-finding-toolbar-item #{(posClosing.posShift.closed) ? ('aon-icon-accept') : ('aon-icon-safeBox')}"
						value="#{(posClosing.posShift.closed) ? (bundle.aon_save) : (bundle.finance_pos_to_close)}"
						actionListener="#{posClosing.onConfirmClose}"
						reRender="aonContent"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
					<aon:htmlCommandLink id="posShift_report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.finance_count}"
						rendered="#{posClosing.posShift.closed}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="posShift" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-even aon-width-half aon-vertical-align-top aon-noborder,aon-width-half aon-vertical-align-top aon-noborder">

					<aon:panel>
						<f:facet name="header">
							<aon:outputLabel value="#{bundle.finance_pos_shift_data}" />
						</f:facet>
						<aon:panelGrid columns="2" styleClass="aon-width-all">

							<aon:outputLabel value="#{bundle.purchase_workplace}" />
							<aon:outputText styleClass="aon-bold"
								value="#{posClosing.posShift.pos.workPlace.description}" />

							<aon:outputLabel value="#{bundle.aon_module_pos}" />
							<aon:outputText styleClass="aon-bold"
								value="#{posClosing.posShift.pos.name}" />

							<aon:outputLabel value="#{bundle.report_shift}" />
							<aon:outputText styleClass="aon-bold"
								value="#{posClosing.posShift.shift}" />

							<aon:outputLabel value="#{bundle.report_opening}" />
							<aon:outputText styleClass="aon-bold"
								value="#{posClosing.posShift.startTime}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>

							<aon:outputLabel value="#{bundle.report_closing}" />
							<aon:outputText styleClass="aon-bold"
								value="#{posClosing.posShift.endTime}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>

							<aon:if test="#{posClosing.posShift.pos.invoiceable}">
								<aon:outputLabel value="#{bundle.aon_number} #{bundle.aon_of} #{bundle.aon_ticket}" 
									rendered="#{!posClosing.posShift.closed}" />
								<aon:div rendered="#{!posClosing.posShift.closed}">
									<aon:outputLabel for="PosClosing_fromTicket" 
										styleClass="aon-italic aon-margin-right" 
										value="#{bundle.aon_date_from}" />
									<aon:inputText id="PosClosing_fromTicket" value="#{posClosing.fromTicket}"
										size="10" maxlength="15" required="true" />

									<aon:outputLabel for="PosClosing_toTicket" 
										styleClass="aon-italic aon-margin-left aon-margin-right" 
										value="#{bundle.aon_date_to}" />
									<aon:inputText id="PosClosing_toTicket" value="#{posClosing.toTicket}"
										size="10" maxlength="15" required="true" />
								</aon:div>
							</aon:if>

							<aon:outputLabel for="PosShift_remarks" value="#{bundle.aon_remark}" />
							<aon:inputTextarea id="PosShift_remarks" 
								value="#{posClosing.posShift.remarks}" rows="4" cols="80" />

						</aon:panelGrid>
					</aon:panel>

					<aon:div>
						<aon:panel id="posShiftCountPanel">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.finance_total_count}" />
							</f:facet>
							<aon:panelGrid columns="3" styleClass="aon-width-all aon-margin-bottom"
								columnClasses="aon-panelGrid-even aon-width-auto aon-noborder,
									aon-panelGrid-even aon-width-160 aon-noborder,aon-width-200 aon-noborder">
								<aon:div>
									<aon:outputLabel styleClass="aon-margin-right aon-italic"
										value="#{bundle.finance_initial_amount}:" />
									<aon:outputText styleClass="aon-bold"
										value="#{posClosing.posShift.initialAmount}">
										<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
									</aon:outputText>
								</aon:div>

								<aon:div>
									<aon:outputLabel styleClass="aon-margin-right aon-italic"
										value="#{bundle.aon_total} #{bundle.report_cash_name}:" />
									<aon:outputText styleClass="aon-bold"
										value="#{posClosing.posShift.totalCountCashAmount + posClosing.posShift.initialAmount}">
										<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
									</aon:outputText>
								</aon:div>

								<aon:div>
									<aon:outputLabel styleClass="aon-margin-right aon-italic"
										value="#{bundle.report_bank_income}:" />
									<aon:outputText styleClass="aon-bold"
										value="#{posClosing.posShift.totalCountCashAmount > 0 ? posClosing.posShift.totalCountCashAmount : 0}">
										<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
									</aon:outputText>
								</aon:div>
							</aon:panelGrid>
							<ui:include src="/com/code/aon/ui/finance/facelet/posShift/posShiftCount.xhtml">
								<ui:param name="shiftController" value="#{posClosing}" />
								<ui:param name="readOnly" value="#{posClosing.posShift.closed}" />
								<ui:param name="countReRender" value="posShiftCountPanel" />
							</ui:include>
						</aon:panel>
					</aon:div>

				</aon:panelGrid>
			</aon:div>
	
		</aon:form>

		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/posShift/calculator/calculatorModal.xhtml">
			<ui:param name="controller" value="#{posClosing}" />								
			<ui:param name="cashCalculator" value="#{posClosing.calculator}" />
			<ui:param name="modalReRender" value="posClosingForm" />
			<ui:param name="calculatorReport" value="posClosingCashCount" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/posShift/closing/modalConfirm.xhtml">
			<ui:param name="controller" value="#{posClosing}" />
		</ui:include>

	</ui:define>
</ui:composition>
