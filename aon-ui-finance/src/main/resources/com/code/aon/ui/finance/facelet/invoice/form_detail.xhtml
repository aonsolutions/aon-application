<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<c:if test="#{!invoiceController.new}">
		<aon:div styleClass="aon-padding-top">
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_invoice_lines}" />
				</f:facet>
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="dataTableId" value="invoiceDetails" />
					<ui:param name="controller" value="#{detailController}" />
					<ui:param name="rows" value="0" />
					<ui:param name="showNote" value="false" />
					<ui:param name="showDataScroller" value="false" />
					<ui:param name="skipResetButton" value="#{invoiceController.readOnly}" />
					<ui:param name="skipLineEdition" value="#{true}" />
					<ui:param name="rowSelectorReRender" value="menuExt" />
					<ui:param name="resetButtonReRender" value="menuExt" />
					<ui:param name="newCancelButtonReRender" value="menuExt" />
					<ui:param name="cancelButtonReRender" value="menuExt" />
					<ui:param name="newSaveButtonReRender" value="menuExt,Invoice_total,financeContainer" />
					<ui:param name="saveButtonReRender" value="menuExt,Invoice_total,financeContainer" />
					<ui:param name="removeButtonReRender" value="menuExt,Invoice_total,financeContainer" />
					<ui:param name="focusOnAdd" value="Item_id-New" />
					<ui:param name="focusOnSelect" value="Item_id" />
					<ui:define name="beginFormListContent">
						<aon:commandLink id="#{dataTableId}-selectButton"
							styleClass="aon-table-row-link" value="&#160;"
							immediate="true" ajaxSingle="true" requestDelay="100"
							rendered="#{!invoiceController.readOnly and detailController.editable}"
							actionListener="#{detailController.onSelect}"
							onkeyup="#{dataTableId}KeyUp(this)"
							onfocus="#{dataTableId}SelectRow(this)"
							onblur="#{dataTableId}DeselectRow(this)"
							focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
						</aon:commandLink>
					</ui:define>
	
					<ui:define name="columns">
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_line" value="#{financeBundle.finance_invoice_detail_line}" />
							</f:facet>
							<aon:outputText value="#{to.line}"
								rendered="#{formList}" />
							<aon:inputText id="InvoiceDetail_line" 
								value="#{controller.to.line}" rendered="#{formEdit}"
								required="true" size="1" maxlength="3" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_line-New" 
									value="#{controller.to.line}" rendered="#{formNew}"
									required="true" size="1" maxlength="3" />
							</f:facet>
						</aon:column>
		
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel for="Item_id" value="#{productBundle.product_item}" />
							</f:facet>
							<aon:outputText value="#{to.description}" 
								rendered="#{formList}">
								<aon:abbreviateConverter maxWidth="64" />
							</aon:outputText>
							<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
								<ui:param name="lookupTo" value="#{controller.to.item}" />
								<ui:param name="idRequired" value="#{true}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="skipSuggestText" value="#{controller.to.item != null and controller.to.item.id != null}" />
								<ui:param name="lookupInputOnFocus" value="IncomeDetail_description" />
								<ui:param name="lookupRendered" value="#{formEdit}" />
								<ui:param name="lookupReRender" 
									value="invoiceDetailItemEdit,InvoiceDetail_quantity,InvoiceDetail_price,InvoiceDetail_discount,
											InvoiceDetail_amount" />
								<aon:methodParam name="lookupChangeListener"
									value="#{controller.onItemChanged}" type="lookupChangeListener" />
							</ui:include>
							<aon:panelGroup id="invoiceDetailItemEdit" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formEdit}">
								<aon:inputTextarea id="InvoiceDetail_description"
									value="#{controller.to.description}"
									rendered="#{controller.to.item != null and controller.to.item.id != null}"
									cols="60" rows="#{!controller.longDescription?1:5}"
									style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
									<f:validateLength maximum="1024" />
								</aon:inputTextarea>
								<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
									actionListener="#{controller.onShortDescription}" reRender="InvoiceDetail_description"
									rendered="#{controller.longDescription and controller.to.item.product.code != null}" />
								<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
									actionListener="#{controller.onLongDescription}" reRender="InvoiceDetail_description"
									rendered="#{!controller.longDescription and controller.to.item.product.code != null}" />
							</aon:panelGroup>
							<f:facet name="footer">
								<aon:div>
									<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
										<ui:param name="lookupTo" value="#{controller.to.item}" />
										<ui:param name="idRequired" value="#{true}" />
										<ui:param name="skipLabel" value="#{true}" />
										<ui:param name="skipSuggestText" value="#{controller.to.item != null and controller.to.item.id != null}" />
										<ui:param name="lookupInputOnFocus" value="IncomeDetail_description-New" />
										<ui:param name="lookupSuffix" value="-New" />
										<ui:param name="lookupRendered" value="#{formNew}" />
										<ui:param name="lookupReRender" 
											value="invoiceDetailItemNew,InvoiceDetail_quantity-New,InvoiceDetail_price-New,
													InvoiceDetail_discount-New,InvoiceDetail_amount_data" />
										<aon:methodParam name="lookupChangeListener"
											value="#{controller.onItemChanged}" type="lookupChangeListener" />
									</ui:include>
									<aon:panelGroup id="invoiceDetailItemNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
										<aon:inputTextarea id="InvoiceDetail_description-New"
											value="#{controller.to.description}"
											rendered="#{controller.to.item != null and controller.to.item.id != null}"
											cols="60" rows="#{!controller.longDescription?1:5}"
											style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
											<f:validateLength maximum="1024" />
										</aon:inputTextarea>
										<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
											actionListener="#{controller.onShortDescription}" reRender="InvoiceDetail_description-New"
											rendered="#{controller.longDescription and controller.to.item.product.code != null}" />
										<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
											actionListener="#{controller.onLongDescription}" reRender="InvoiceDetail_description-New"
											rendered="#{!controller.longDescription and controller.to.item.product.code != null}" />
									</aon:panelGroup>
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_quantity" value="#{bundle.aon_quantity}" />
							</f:facet>
							<aon:outputText value="#{to.quantity}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_quantity"
								value="#{controller.to.quantity}" rendered="#{formEdit}"
								valueChangeListener="#{controller.onQuantityChanged}"
								reRender="InvoiceDetail_price,InvoiceDetail_discount,InvoiceDetail_amount"
								required="true" size="5" focus="InvoiceDetail_price" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_quantity-New"
									value="#{controller.to.quantity}" rendered="#{formNew}"
									valueChangeListener="#{controller.onQuantityChanged}"
									reRender="InvoiceDetail_price-New,InvoiceDetail_discount-New,InvoiceDetail_amount-New"
									required="true" size="5" focus="InvoiceDetail_price-New" />
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_price" value="#{bundle.aon_price}" />
							</f:facet>
							<aon:outputText value="#{to.price}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_price"
								value="#{controller.to.price}" rendered="#{formEdit}"
								reRender="InvoiceDetail_amount" 
								required="true" size="5" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_price-New"
									value="#{controller.to.price}" rendered="#{formNew}"
									reRender="InvoiceDetail_amount-New"
									required="true" size="5" />
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_discount" value="#{bundle.aon_discount}" />
							</f:facet>
							<aon:outputText value="#{to.discountExpression.discountExpr}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_discount"
								value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
								reRender="InvoiceDetail_amount" 
								required="true" size="5" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_discount-New"
									value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}"
									reRender="InvoiceDetail_amount-New"
									required="true" size="5" />
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_amount" value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{to.taxableBase}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
							<aon:outputText id="InvoiceDetail_amount"
								value="#{controller.taxableBase}" rendered="#{formEdit}">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div style="text-align:right;">
									<aon:div id="InvoiceDetail_amount_data"	rendered="#{formNew}">
										<aon:div>
											<aon:outputText id="InvoiceDetail_amount-New"
												value="#{controller.taxableBase}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>
										</aon:div>
										<aon:div styleClass="aon-nowrap" rendered="#{!invoiceController.to.taxFree}">
											<aon:outputText style="font-size: 0.8em; font-style: italic;" 
												value="I.V.A. #{controller.vatPercent}%" />
										</aon:div>
										<aon:div styleClass="aon-nowrap" rendered="#{invoiceController.to.surcharge}">
											<aon:outputText style="font-size: 0.8em; font-style: italic;" styleClass="aon-nowrap"
												value="R.E. #{controller.surchargePercent}%" />
										</aon:div>
										<aon:div styleClass="aon-nowrap" rendered="#{invoiceController.to.withholding}">
											<aon:outputText style="font-size: 0.8em; font-style: italic;" styleClass="aon-nowrap"
												value="I.R.P.F. #{controller.retentionPercent}%" />
										</aon:div>
									</aon:div>
									
									<aon:outputText id="Invoice_taxableBase" 
										value="#{invoiceController.taxableBase}" rendered="#{!formNew}">
										<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>

						<c:if test="#{companyCollections.workPlacesCount > 1}">
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
								<f:facet name="header">
									<aon:outputLabel for="InvoiceDetail_workPlace" value="#{companyBundle.company_workplace}" />
								</f:facet>
								<aon:outputText
									rendered="#{formList}"
									value="#{to.workPlace.description}">
									<aon:abbreviateConverter maxWidth="32" />
								</aon:outputText>
								<aon:selectOneMenu id="InvoiceDetail_workPlace"
									value="#{controller.to.workPlace}"
									rendered="#{formEdit}">
									<f:selectItems value="#{companyCollections.workPlaces}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="InvoiceDetail_workPlace-New"
										value="#{controller.to.workPlace}"
										rendered="#{formNew}">
										<f:selectItems value="#{companyCollections.workPlaces}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
						</c:if>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
							<f:facet name="header">
								<aon:outputLabel value="INFO" />
							</f:facet>
							<aon:div rendered="#{!controller.editable}" 
								style="display:inline;cursor:pointer;">
								<aon:outputText value="&#160;"
									styleClass="aon-icon-transfer" style="padding-left:20px" />
								<rich:toolTip value="#{controller.lineSourceInfo}" />
							</aon:div>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:panel>
		</aon:div>
	</c:if>
</ui:composition>
