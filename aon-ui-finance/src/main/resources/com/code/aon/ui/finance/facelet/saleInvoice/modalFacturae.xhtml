<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFacturaeInfoWindow">
		<aon:if test="#{saleInvoice.showFacturaeInfoWindow}">
			<rich:modalPanel id="fiscalFacturaeInfoModalPanel"
				minWidth="400" minHeight="200" zindex="90"
				showWhenRendered="#{saleInvoice.showFacturaeInfoWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Información Facturae" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFacturaeInfoWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{saleInvoice.showFacturaeInfoWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="facturaeInfoForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="facturaeInfoAccept"	
											value="Guardar"
											action="#{saleInvoice.saveFacturaeInfo()}"
											styleClass="aon-finding-toolbar-item aon-icon-accept"/>
									</aon:div>
									
									<aon:panelGrid id="menuGrid" columns="2" dir="true">
										<aon:outputLabel for="Invoice_code_asignacion" 
											value="Código de Asignación" />
	
										<aon:inputText id="Invoice_code_asignacion" 
											style="margin-left: 3px;"
											value="#{invoiceController.codeAsignacion}" size="10" maxlength="10">
											<f:validateLength minimum="10" maximum="10" />
										</aon:inputText>
									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
