<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="bankConceptList">
			<aon:div layout="none">

				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{financeBundle.finance_bank_concept_module}" />
					<ui:param name="controller" value="#{bankConcept}" />
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">

					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{bankConcept}" />
						<ui:param name="columnClasses"
							value="aon-editDataTable-text,aon-editDataTable-text" />

						<ui:define name="columns">
							<aon:column alias="BankConcept_name" styleClass="aon-width-350">
								<f:facet name="header">
									<aon:outputLabel for="BankConcept_name" value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.name}"
									rendered="#{formList}" />
								<aon:inputText id="BankConcept_name" rendered="#{formEdit}"
									value="#{bankConcept.to.name}" required="true" 
									size="40" maxlength="32" />
								<f:facet name="footer">
									<aon:inputText id="BankConcept_name-New" rendered="#{formNew}"
										value="#{bankConcept.to.name}" required="true"
										size="40" maxlength="32" />
								</f:facet>
							</aon:column>

							<c:if test="#{aonRole.accountingOperator}">
								<aon:column styleClass="aon-width-auto">
									<f:facet name="header">
										<aon:outputLabel for="Account_id" value="#{financeBundle.finance_account}" />
									</f:facet>
									<aon:outputText value="#{bankConcept.account.fullDescription}" rendered="#{formList}" />
									<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
										<ui:param name="skipLabel" value="#{true}" />
										<ui:param name="lookupTo" value="#{bankConcept.to.account}" />
										<ui:param name="lookupRendered" value="#{formEdit}" />
									</ui:include>
									<f:facet name="footer">
										<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
											<ui:param name="skipLabel" value="#{true}" />
											<ui:param name="lookupTo" value="#{bankConcept.to.account}" />
											<ui:param name="lookupSuffix" value="New" />
											<ui:param name="lookupRendered" value="#{formNew}" />
										</ui:include>
									</f:facet>
	 							</aon:column>
							</c:if>
 						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{accountLookup}" />
	</ui:define>
</ui:composition>
