<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="bankConceptList">
			<aon:div ajaxRendered="true" layout="none">

				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{financeBundle.finance_bank_concept_module}" />
					<ui:param name="controller" value="#{bankConcept}" />
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">

					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{bankConcept}" />
						<ui:param name="columnClasses"
							value="aon-editDataTable-text,aon-editDataTable-text" />

						<ui:define name="columns">
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="BankConcept_name" value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.name}"
									rendered="#{formList}" />
								<aon:inputText id="BankConcept_name" rendered="#{formEdit}"
									value="#{bankConcept.to.name}" required="true" 
									size="40" maxlength="32" />
								<f:facet name="footer">
									<aon:inputText id="BankConcept_name-New" rendered="#{formNew}"
										value="#{bankConcept.to.name}" required="true"
										size="40" maxlength="32" />
								</f:facet>
							</aon:column>

							<c:if test="#{aonRole.accountingOperator}">
								<aon:column>
									<f:facet name="header">
										<aon:outputLabel for="BankConcept_account" value="#{financeBundle.finance_account}" />
									</f:facet>
									<aon:outputText value="#{bankConcept.account}"
										rendered="#{formList}" />
									<ui:include
										src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
										<ui:param name="wizard" value="#{accountWizard}" />
										<ui:param name="id" value="BankConcept_account" />
										<ui:param name="required" value="#{false}" />
										<ui:param name="size" value="12" />
										<ui:param name="maxlength" value="12" />
										<ui:param name="renderDescription" value="#{false}" />
										<ui:param name="renderedAttr" value="#{formEdit}" />
										<ui:param name="disabled" value="#{false}" />
										<ui:param name="reRenderAttr" value="none" />
										<ui:param name="entity" value="#{bankConcept.to.account}" />
										<ui:param name="ELExpression" value="bankConcept.to.account" />
									</ui:include>
									<f:facet name="footer">
										<ui:include
											src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
											<ui:param name="wizard" value="#{accountWizard}" />
											<ui:param name="id" value="BankConcept_account-New" />
											<ui:param name="required" value="#{false}" />
											<ui:param name="size" value="12" />
											<ui:param name="maxlength" value="12" />
											<ui:param name="renderDescription" value="#{false}" />
											<ui:param name="renderedAttr" value="#{formNew}" />
											<ui:param name="disabled" value="#{false}" />
											<ui:param name="reRenderAttr" value="none" />
											<ui:param name="entity" value="#{bankConcept.to.account}" />
											<ui:param name="ELExpression" value="bankConcept.to.account" />
										</ui:include>
									</f:facet>
	 							</aon:column>
							</c:if>
 						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
