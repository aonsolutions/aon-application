<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posFinanceSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_posFinance_module}" />
				<ui:param name="controller" value="#{posFinance}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{posFinance}" />
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="PosFinance_workPlace" value="#{bundle.purchase_workplace}" />
					<aon:selectOneMenu id="PosFinance_workPlace" 
						value="#{posFinanceSearch.workPlace}" required="true">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						<a4j:support event="onchange" reRender="PosFinance_pos" ignoreDupResponses="true" ajaxSingle="true" />
						<a4j:support event="oninputchanged" reRender="PosFinance_pos" ignoreDupResponses="true" ajaxSingle="true" />
					</aon:selectOneMenu>

					<aon:if test="#{companyCollections.departmentsCount > 0}">
						<aon:outputLabel value="#{bundle.purchase_department}" />
						<aon:selectOneMenu 
							value="#{posFinanceSearch.department}">
							<f:selectItem itemLabel=" - " itemValue="null" />
							<f:selectItems value="#{companyCollections.departments}" />
							<a4j:support event="onchange" reRender="PosFinance_pos" ignoreDupResponses="true" ajaxSingle="true" />
							<a4j:support event="oninputchanged" reRender="PosFinance_pos" ignoreDupResponses="true" ajaxSingle="true" />
						</aon:selectOneMenu>
					</aon:if>

					<aon:outputLabel value="#{bundle.aon_module_pos}" />
					<aon:selectOneMenu id="PosFinance_pos"
						value="#{posFinanceSearch.pos}" >
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{posFinanceSearch.workPlacePos}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.report_shift}" />
					<aon:selectOneMenu value="#{posFinanceSearch.shift}">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{financeCollections.shifts}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="PosFinance_dueDate-from"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="PosFinance_dueDate-from"
							valueChangeListener="#{posFinance.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="PosFinance_dueDate-to"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="PosFinance_dueDate-to"
							valueChangeListener="#{posFinance.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>

					<aon:outputLabel value="#{bundle.finance_payMethod}" />
					<aon:selectOneMenu value="#{posFinanceSearch.payMethod}">
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>

				</ui:define>
			</ui:decorate>				
		</aon:form>

	</ui:define>
</ui:composition>
