<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posFinanceSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_posFinance_module}" />
				<ui:param name="controller" value="#{posFinance}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{posFinance}" />
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="PosFinance_workPlace" value="#{bundle.purchase_workplace}" />
					<aon:selectOneMenu id="PosFinance_workPlace" 
						value="#{posFinanceSearch.workPlace}" required="true">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						<a4j:support event="onchange" reRender="PosFinance_pos,PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
						<a4j:support event="oninputchanged" reRender="PosFinance_pos,PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
					</aon:selectOneMenu>

					<aon:outputLabel for="PosFinance_payMethod" value="#{bundle.finance_payMethod}" />
					<aon:selectOneMenu id="PosFinance_payMethod"
						value="#{posFinanceSearch.payMethod}" required="true">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{configCollections.payMethods}" />
						<a4j:support event="onchange" reRender="PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
						<a4j:support event="oninputchanged" reRender="PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.finance_pos_shift_start}" />
					<aon:div>
						<aon:outputLabel for="PosFinance_fromDate"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="PosFinance_fromDate"
							value="#{posFinanceSearch.fromDate}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="onchanged" reRender="PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
							<a4j:support event="oninputchange" reRender="PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
						</aon:selectInputDate>

						<aon:outputLabel for="PosFinance_toDate"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="PosFinance_toDate"
							value="#{posFinanceSearch.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="onchanged" reRender="PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
							<a4j:support event="oninputchange" reRender="PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
						</aon:selectInputDate>
					</aon:div>

					<aon:outputLabel value="#{bundle.aon_module_pos}" />
					<aon:selectOneMenu id="PosFinance_pos"
						value="#{posFinanceSearch.pos}" >
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{posFinanceSearch.workPlacePos}" />
						<a4j:support event="onchange" reRender="PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
						<a4j:support event="oninputchanged" reRender="PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.report_shift}" />
					<aon:selectOneMenu value="#{posFinanceSearch.shift}">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{financeCollections.shifts}" />
						<a4j:support event="onchange" reRender="PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
						<a4j:support event="oninputchanged" reRender="PosFinance_posShifts" ignoreDupResponses="true" ajaxSingle="true" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.finance_pos_shift_list}" />
					<aon:selectManyListbox id="PosFinance_posShifts"
						style="width:300px;"
						value="#{posFinanceSearch.posShifts}" size="10">
						<f:selectItems value="#{posFinanceSearch.workPlacePosShift}" />
					</aon:selectManyListbox>

					<aon:outputText value="" />
					<aon:outputText value="* #{bundle.finance_pos_shift_pending_charge_message}" 
						styleClass="aon-italic aon-margin-left" style="font-size: 11px;" />

				</ui:define>

			</ui:decorate>

		</aon:form>

	</ui:define>
</ui:composition>
