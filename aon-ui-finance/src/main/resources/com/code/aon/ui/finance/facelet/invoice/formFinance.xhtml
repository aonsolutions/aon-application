<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="financeContainer">
		<aon:if test="#{detailController.model.rowCount > 0 or financeController.model.rowCount > 0}">
			<aon:panel>
				<aon:if test="#{!app.standAlone}">
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_checking}" />
					</f:facet>
				</aon:if>

				<aon:div styleClass="aon-bold aon-margin-bottom"
					rendered="#{!invoiceController.readOnly and financeController.advancedFinancesAvailable}">
					<aon:outputText styleClass="aon-icon-info" style="padding-left: 1.3em;"
						value="#{bundle.finance_advances_available}" />
					<aon:commandLink id="AdvanceFinances-import"
						value="#{bundle.aon_import}"
						styleClass="aon-label-info"
						style="margin-left:5px; text-decoration:underline;"
						actionListener="#{financeController.onImportAdvances}"
						reRender="#{dataTableId}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
				</aon:div>

				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="dataTableId" value="invoiceFinances" />
					<ui:param name="controller" value="#{financeController}" />
					<ui:param name="showNote" value="false" />
					<ui:param name="showDataScroller" value="false" />
					<ui:param name="skipResetButton" value="#{invoiceController.readOnly}" />
					<ui:param name="skipLineEdition" value="#{true}" />
					<ui:param name="skipRemoveButton" value="#{(invoiceController.readOnly and controller.model.rowCount > 1) or financeController.to.advance}" />
					<ui:param name="resetButtonReRender" value="aonContent" />
					<ui:param name="removeButtonReRender" value="menuExt,InvoiceReferenceCodeDiv" />
					<ui:param name="newSaveButtonReRender" value="menuExt,InvoiceReferenceCodeDiv" />
					<ui:define name="beginFormListContent">
						<aon:commandLink id="#{dataTableId}-selectButton"
							styleClass="aon-table-row-link" value="&#160;"
							immediate="true" ajaxSingle="true" requestDelay="100"
							rendered="#{financeController.modelToEditable}"
							actionListener="#{financeController.onSelect}"
							reRender="aonContent"
							onkeyup="#{dataTableId}KeyUp(this)"
							onfocus="#{dataTableId}SelectRow(this)"
							onblur="#{dataTableId}DeselectRow(this)"
							focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
						</aon:commandLink>
					</ui:define>

					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputLabel for="Finance_DueDate" value="#{bundle.finance_finance_date}" />
							</f:facet>
							<aon:outputText rendered="#{formList}" value="#{to.dueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate id="Finance_DueDate"
								value="#{controller.to.dueDate}" rendered="#{formEdit}"
								inputSize="8" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />
							<f:facet name="footer">
								<aon:selectInputDate id="Finance_DueDate-New"
									value="#{controller.to.dueDate}" rendered="#{formNew}" 
									inputSize="8" required="true"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}" />
							</f:facet>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputLabel for="Finance_PayMethod" value="#{bundle.finance_payMethod}" />
							</f:facet>
							<aon:outputText value="#{to.payMethod.name}"
								rendered="#{formList}" />
							<aon:selectOneMenu id="Finance_PayMethod"
								value="#{controller.to.payMethod}"
								rendered="#{formEdit}"
								valueChangeListener="#{controller.onPayMethodChanged}"
								reRender="InvoiceFinance_bankAccount_panel">
								<f:selectItem itemLabel=" - " itemValue="#{null}" />
								<f:selectItems value="#{configCollections.payMethods}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu id="Finance_PayMethod-New"
									value="#{controller.to.payMethod}"
									rendered="#{formNew}"
									valueChangeListener="#{controller.onPayMethodChanged}"
									reRender="InvoiceFinance_bankAccount_panel-New">
									<f:selectItem itemLabel=" - " itemValue="#{null}" />
									<f:selectItems value="#{configCollections.payMethods}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:div>
									<aon:outputLabel value="#{bundle.aon_bank_account}" />
								</aon:div>
							</f:facet>
							<aon:outputText value=" #{to.bankDescription}" rendered="#{formList}" />
							<aon:div id="InvoiceFinance_bankAccount_panel" styleClass="aon-nowrap" rendered="#{formEdit}">
								<aon:panelGroup id="InvoiceFinance_bankAccount" rendered="#{controller.showBankManualInput}">
									<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
										<ui:param name="bankAccountController" value="#{controller.accountHelper}" />
										<ui:param name="bankAccountPrefix" value="#{controller.beanName}" />
										<ui:param name="bankAccountReRender" value="createBankContainer" />
										<ui:param name="bankCodeChangeReRender" value="Finance_bankAlias,Finance_bic" />
									</ui:include>
									<aon:panelGroup id="createBankContainer">
										<aon:commandButton id="createBank" value=""
											reRender="InvoiceFinance_bankAccount"
											rendered="#{controller.bankCreationEnabled}"
											ajaxSingle="true"
											actionListener="#{controller.onAddRegistryBank}"
											onclick="if (!confirm('#{bundle.config_bank_creation_confirm} #{controller.to.registryName}?')) return false;"	
											styleClass="aon-editDataTable-button aon-lookupButton-new" />
									</aon:panelGroup>
									<aon:commandLink id="bankAccount_hide_manualInput" ajaxSingle="true"
										rendered="#{controller.showBankManualInput and controller.activeBanksCount>0}"  
										reRender="InvoiceFinance_bankAccount_panel"
										styleClass="aon-icon-edit-end aon-margin-left" style="padding-right: 20px;padding-top: 0px;"
										value="&#160;" title="#{bundle.aon_key_cancel_line_description}" >
										<f:setPropertyActionListener target="#{controller.showBankManualInput}"
											value="#{false}" />
									</aon:commandLink>
								</aon:panelGroup>
								<aon:div styleClass="aon-italic">
									<aon:div style="margin-top:2px; font-size:0.9em;" rendered="#{controller.showBankManualInput}">
										<aon:outputLabel for="Finance_bankAlias" styleClass="aon-margin-right"
											value="#{bundle.aon_bank}" />
										<aon:inputText id="Finance_bankAlias"
											value="#{controller.to.bankAlias}" 
											required="true" size="25" maxlength="25" />
										<aon:outputLabel for="Finance_bic" styleClass="aon-margin-left aon-margin-right"
											value="#{bundle.aon_bic}" />
										<aon:inputText id="Finance_bic"
											value="#{controller.to.bic}" validator="BICValidator" 
											required="true" size="12" maxlength="11">
										</aon:inputText>
									</aon:div>

									<aon:selectOneMenu id="Finance_RegistryBank"
										rendered="#{!controller.showBankManualInput}"
										reRender="InvoiceFinance_bankAccount"
										value="#{controller.registryBank}"
										valueChangeListener="#{controller.onRBankChanged}">
										<f:selectItem value="#{null}" />
										<aon:if test="#{controller.registryBank.id == null or controller.registryBank.active}">
											<f:selectItems value="#{controller.activeBanks}" />
										</aon:if>
										<aon:if test="#{controller.registryBank.id != null and !controller.registryBank.active}">
											<f:selectItems value="#{controller.allBanks}" />
										</aon:if>
									</aon:selectOneMenu>
									<aon:commandLink id="bankAccount_show_manualInput" ajaxSingle="true"
										rendered="#{!controller.showBankManualInput}"  
										reRender="InvoiceFinance_bankAccount_panel"
										styleClass="aon-icon-edit-add aon-margin-left" style="padding-right: 20px;padding-top: 0px;"
										value="&#160;" title="#{bundle.aon_edit}" >
										<f:setPropertyActionListener target="#{controller.showBankManualInput}"
											value="#{true}" />
									</aon:commandLink>
								</aon:div>
							</aon:div>
							<f:facet name="footer">
								<aon:div id="InvoiceFinance_bankAccount_panel-New" styleClass="aon-nowrap" rendered="#{formNew}">
									<aon:panelGroup id="InvoiceFinance_bankAccount-New" rendered="#{controller.showBankManualInput}">
										<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
											<ui:param name="bankAccountController" value="#{controller.accountHelper}" />
											<ui:param name="bankAccountPrefix" value="#{controller.beanName}" />
											<ui:param name="bankAccountSuffix" value="-New" />
											<ui:param name="bankAccountReRender" value="createBankContainer-New" />
											<ui:param name="bankCodeChangeReRender" value="Finance_bankAlias-New,Finance_bic-New" />
										</ui:include>
										<aon:panelGroup id="createBankContainer-New">
											<aon:commandButton id="createBank-New" value=""
												reRender="InvoiceFinance_bankAccount_panel-New"
												rendered="#{controller.bankCreationEnabled}"
												ajaxSingle="true"
												actionListener="#{controller.onAddRegistryBank}"
												onclick="if (!confirm('#{bundle.config_bank_creation_confirm} #{controller.to.registryName}?')) return false;"	
												styleClass="aon-editDataTable-button aon-lookupButton-new" />
										</aon:panelGroup>
										<aon:commandLink id="bankAccount_hide_manualInput-New" ajaxSingle="true"
											rendered="#{controller.showBankManualInput and controller.activeBanksCount>0}"  
											reRender="InvoiceFinance_bankAccount_panel-New"
											styleClass="aon-icon-edit-end aon-margin-left" style="padding-right: 20px;padding-top: 0px;"
											value="&#160;" title="#{bundle.aon_key_cancel_line_description}" >
											<f:setPropertyActionListener target="#{controller.showBankManualInput}"
												value="#{false}" />
										</aon:commandLink>
									</aon:panelGroup>	
									<aon:div styleClass="aon-italic">
										<aon:div style="margin-top:2px; font-size:0.9em;" rendered="#{controller.showBankManualInput}">
											<aon:outputLabel for="Finance_bankAlias-New" styleClass="aon-margin-right"
												value="#{bundle.aon_bank}" />
											<aon:inputText id="Finance_bankAlias-New"
												value="#{controller.to.bankAlias}" 
												required="true" size="25" maxlength="25" />
											<aon:outputLabel for="Finance_bic-New" styleClass="aon-margin-left aon-margin-right"
												value="#{bundle.aon_bic}" />
											<aon:inputText id="Finance_bic-New"
												value="#{controller.to.bic}" validator="BICValidator" 
												required="true" size="12" maxlength="11">											
											</aon:inputText>
										</aon:div>
										<aon:selectOneMenu id="Finance_RegistryBank-New"
											rendered="#{!controller.showBankManualInput}"
											reRender="InvoiceFinance_bankAccount_panel-New"
											value="#{controller.registryBank}"
											valueChangeListener="#{controller.onRBankChanged}">
											<f:selectItem value="#{null}" />
											<f:selectItems value="#{controller.activeBanks}" />
										</aon:selectOneMenu>
										<aon:commandLink id="bankAccount_show_manualInput-New" ajaxSingle="true"
											rendered="#{!controller.showBankManualInput}"  
											reRender="InvoiceFinance_bankAccount_panel-New"
											styleClass="aon-icon-edit-add aon-margin-left" style="padding-right: 20px;padding-top: 0px;"
											value="&#160;" title="#{bundle.aon_edit}" >
											<f:setPropertyActionListener target="#{controller.showBankManualInput}"
												value="#{true}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.financeStatus}" />
							<f:facet name="footer">
								<aon:outputText value="#{controller.to.financeStatus}" rendered="#{formNew}"/>
							</f:facet>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="Finance_amount" value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{to.amount}" rendered="#{formList or invoiceController.recorded}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="Finance_amount" rendered="#{formEdit and !invoiceController.recorded}"
								size="10" value="#{controller.to.amount}" />
							<f:facet name="footer">
								<aon:div style="text-align:right;">
									<aon:inputText id="Finance_amount-New" rendered="#{formNew}"
										size="10" value="#{controller.to.amount}" />
									<aon:outputText id="Finance_total" 
										value="#{invoiceController.toInvoiceFinanceTotal}" rendered="#{!formNew}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>

					</ui:define>

					<ui:define name="endFormListContent">
						<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
							<ui:param name="auditableTO" value="#{to}" />
						</ui:include>					
						<aon:commandLink id="finance_link" immediate="true"
							styleClass="aon-button-goto" style="padding-right: 10px;"
							value="&#160;" title="#{bundle.aon_go}" 
							actionListener="#{financeController.onLoadFinance}"
							action="finance_form"
							reRender="aonContent" />
						<aon:commandLink id="finance_exclude" immediate="true"
							styleClass="aon-icon-exclude" style="padding-right: 10px;"
							value="&#160;" title="#{bundle.finance_exclude_advance}" 
							rendered="#{!invoiceController.readOnly and formList and to.advance}"
							actionListener="#{financeController.onExcludeAdvance}"
							reRender="aonContent" />
					</ui:define>

				</ui:decorate>
			</aon:panel>
		</aon:if>
	</aon:div>
</ui:composition>
