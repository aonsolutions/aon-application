<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputText value="" />
	<aon:div styleClass="aon-search-content-width">
	
		<aon:panelCollapsible expanded="true" label="#{bundle.finance_invoice}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:include src="/com/code/aon/ui/finance/facelet/invoice/searchBasicContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>					

		<aon:panelCollapsible expanded="false" 
			label="#{(searchController.sales) ? bundle.registry_customer_data : 
					 (searchController.purchase) ? bundle.finance_invoice_supplier_data : bundle.finance_invoice_creditor_data}">
			<aon:panel style="text-align:left;">
				<f:facet name="header">
					<aon:outputLabel value="#{(searchController.sales) ? bundle.aon_customer : 
					 						  (searchController.purchase) ? bundle.aon_supplier : bundle.aon_creditor}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">		
					<aon:outputLabel for="#{searchController.preffix}alias"
						value="#{bundle.aon_company_alias}" />
					<aon:inputText id="#{searchController.preffix}alias" size="60"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Invoice_registryName"
						value="#{bundle.aon_company_name}" />
					<aon:inputText id="Invoice_registryName" size="60"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Invoice_registryDocument"
						value="#{bundle.aon_document}" />
					<aon:inputText id="Invoice_registryDocument" size="20"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Invoice_registryDocumentCountry"
						value="#{bundle.aon_document_country}" />
					<aon:selectOneMenu id="Invoice_registryDocumentCountry"
						converter="aon.EnumConverter"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{commonCollections.countryCodes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Invoice_registryDocumentType"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Invoice_registryDocumentType"
						converter="aon.EnumConverter"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{registryCollections.documentTypes}" />
					</aon:selectOneMenu>
					
					<aon:if test="#{searchController.sales and company.EInvoice}">
						<aon:outputLabel for="Invoice_registry_EInvoice"
							value="#{bundle.customer_eInvoice}" />
						<aon:selectOneRadio id="Invoice_registry_EInvoice"
							value="#{searchController.customerEInvoice}">
							<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
							<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
						</aon:selectOneRadio>				
					</aon:if>					
 				</aon:panelGrid>
			</aon:panel>
			<aon:panel style="text-align:left;">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.registry_address_module}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
			<aon:panel style="text-align:left;">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_contacts}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{bundle.finance_invoice_lines}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<aon:if test="#{searchController.sales or searchController.purchase}">
					<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
						<ui:param name="lookupBean" value="#{(searchController.sales) ? saleItemLookup : purchaseItemLookup}" />
						<ui:param name="lookupTo" value="#{searchController.item}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<ui:param name="lookupControllerListener" value="#{itemLookupNoWildCardListener}" />
					</ui:include>
				</aon:if>

				<aon:if test="#{!(searchController.sales or searchController.purchase)}">
					<ui:include src="/com/code/aon/ui/product/facelet/expenseItem/lookup.xhtml">
						<ui:param name="lookupTo" value="#{searchController.item}" />
					</ui:include>
				</aon:if>

				<aon:outputLabel for="Invoice_lines_description"
					value="#{bundle.aon_description}" />
				<aon:inputText id="Invoice_lines_description"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Invoice_lines_item_product_category_id"
					value="#{bundle.aon_category}" />
				<aon:selectOneMenu id="Invoice_lines_item_product_category_id"
					value="#{productCollections.category}"
					valueChangeListener="#{controller.addIdEqualExpression}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{productCollections.categories}" />
				</aon:selectOneMenu>

				<aon:outputLabel for="Invoice_lines_item_product_type"
					value="#{bundle.aon_type}" />
				<aon:selectOneMenu id="Invoice_lines_item_product_type"
					converter="aon.EnumConverter"
					valueChangeListener="#{controller.addEqualExpression}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{productCollections.commonProductTypes}" />
				</aon:selectOneMenu>

				<aon:outputLabel for="Invoice_lines_quantity"
					value="#{bundle.aon_quantity}" />
				<aon:inputText id="Invoice_lines_quantity"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Invoice_lines_price"
					value="#{bundle.aon_price}" />
				<aon:inputText id="Invoice_lines_price"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Invoice_lines_taxableBase"
					value="#{bundle.aon_amount}" />
				<aon:inputText id="Invoice_lines_taxableBase"
					valueChangeListener="#{controller.addExpression}" size="40" />
					
				<aon:outputLabel for="Invoice_lines_workPlace_id"
					value="#{bundle.purchase_workplace}" />
				<aon:selectOneMenu id="Invoice_lines_workPlace_id"
					value="#{companyCollections.workPlace}"
					valueChangeListener="#{controller.addIdEqualExpression}">
					<f:selectItem itemLabel="-" value="#{null}" />		
					<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
				</aon:selectOneMenu>
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{bundle.finance_checking}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<aon:outputLabel 
					value="#{bundle.finance_finance_date_abbrv}" />
				<aon:div>
					<aon:outputLabel for="Invoice_finances_dueDate-From" styleClass="aon-form-date-label aon-padding-right"
						value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Invoice_finances_dueDate-From"
						valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Invoice_finances_dueDate-To" styleClass="aon-form-date-label aon-padding-right"
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Invoice_finances_dueDate-To"
						valueChangeListener="#{controller.addLessThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</aon:div>
				
				<aon:outputLabel for="Invoice_finances_amount"
					value="#{bundle.aon_amount}" />
				<aon:inputText id="Invoice_finances_amount"
					valueChangeListener="#{controller.addExpression}"
					size="10" />
				
				<aon:outputLabel for="Invoice_finances_payMethod_id"
					value="#{bundle.finance_payMethod}" />
				<aon:div id="payMethodDiv">
					<a4j:repeat value="#{searchController.payMethods}" rowKeyVar="index" var="payMth">
						<aon:div styleClass="#{(index != 0)?'aon-padding-top':''}">
							<aon:selectOneMenu id="Invoice_finances_payMethod_id"
								value="#{searchController.payMethods[index]}">
								<f:selectItem itemLabel="-" itemValue="#{searchController.emptyPayMethod}"/>
								<f:selectItems value="#{configCollections.payMethods}" />
							 	<a4j:support event="onchange" reRender="payMethodDiv"/>
							</aon:selectOneMenu>
							<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus"
								actionListener="#{searchController.onRemovePayMethod}" reRender="payMethodDiv"
								rendered="#{payMth.id != null}">
								<f:param name="index" value="#{index}" />
							</aon:commandButton>
							<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add"
								actionListener="#{searchController.onAddPayMethod}" reRender="payMethodDiv"
								rendered="#{(payMth.id != null) and (index == (searchController.payMethodsSize-1))}"/>					
						</aon:div>						
					</a4j:repeat>
				</aon:div>

				<aon:outputText value="#{bundle.aon_status}"/>
				<aon:selectManyCheckbox value="#{searchController.financeStatuses}">
					<f:selectItems value="#{financeCollections.financeStatuses}"/>
				</aon:selectManyCheckbox>							
			</aon:panelGrid>
		</aon:panelCollapsible>
		
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/searchContent.xhtml"/>

	</aon:div>

</ui:composition>
