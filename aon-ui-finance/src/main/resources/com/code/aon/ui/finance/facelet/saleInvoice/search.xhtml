<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/finance/facelet/invoice/searchInvoice.xhtml">
		<ui:param name="toolbarTitle" value="#{bundle.finance_sale_invoice_management_module}" />
		<ui:param name="controller" value="#{saleInvoice}" />
		<ui:param name="searchController" value="#{saleInvoiceSearch}" />
		
		<ui:define name="additionalToolbarContent">
			<aon:if test="#{company.ediSupportEnabled}">
				<aon:commandButton id="saleInvoice-ediFtp"
					value="SERESNET"
					title="Recuperar del servidor FTP de Seresnet"
					styleClass="aon-finding-toolbar-item aon-icon-seresnet"
					actionListener="#{controller.ftpEdiDownloader.onShowFtpEdi}"
					action="saleInvoice_form"
					onclick="Richfaces.showModalPanel('waitProccess')" 
					oncomplete="Richfaces.hideModalPanel('waitProccess')">
					<f:setPropertyActionListener target="#{controller.ftpEdiDownloader.showEdiFtpWindow}"
						value="#{true}" />
				</aon:commandButton>
			</aon:if>
		</ui:define>
		<ui:define name="afterFormContent">
			<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml">
				<ui:param name="addWaitProcessPoll" value="#{true}" />
			</ui:include>
		</ui:define>
		
	</ui:decorate>

</ui:composition>
