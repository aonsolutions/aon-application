<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/finance/facelet/invoice/searchInvoice.xhtml">
		<ui:param name="toolbarTitle" value="#{bundle.finance_sale_invoice_management_module}" />
		<ui:param name="controller" value="#{saleInvoice}" />
		<ui:param name="searchController" value="#{saleInvoiceSearch}" />
		
		<ui:define name="additionalToolbarContent">
			<aon:if test="#{company.ediSupportEnabled}">
				<aon:commandButton id="import-Popup"
					value="#{bundle.aon_import} #{bundle.aon_edi}"
					title="#{bundle.aon_import}"
					styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
					actionListener="#{controller.udapaImporter.onImportFileShow}"
					action="saleInvoice_form">
					<f:setPropertyActionListener target="#{controller.udapaImporter.showImportFileWindow}"
						value="#{true}" />
				</aon:commandButton>
			</aon:if>
		</ui:define>
		
	</ui:decorate>

</ui:composition>
