<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posOpeningForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_posOpening_module}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="posOpening-openPos" 
						styleClass="aon-finding-toolbar-item #{(posOpening.posShift.id != null) ? ('aon-icon-accept') : ('aon-icon-open-safeBox')}"
						value="#{(posOpening.posShift.id != null) ? (bundle.aon_save) : (financeBundle.finance_pos_to_open)}"
						actionListener="#{posOpening.onAccept}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" styleClass="aon-width-400">

					<aon:outputLabel for="PosShit_pos_workPlace" value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="PosShit_pos_workPlace"
						value="#{posOpening.workPlace}"
						rendered="#{posOpening.posShift.id == null}">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						<a4j:support event="onchange" reRender="PosShift_pos,PosShift_shift" ignoreDupResponses="true" ajaxSingle="true" />
						<a4j:support event="oninputchanged" reRender="PosShift_pos,PosShift_shift" ignoreDupResponses="true" ajaxSingle="true" />
					</aon:selectOneMenu>
					<aon:outputText styleClass="aon-bold"
						value="#{posOpening.posShift.pos.workPlace.description}"
						rendered="#{posOpening.posShift.id != null}" />

					<c:if test="#{companyCollections.departmentsCount > 0}">
						<aon:outputLabel for="PosShift_pos_department" value="#{companyBundle.company_department}" />
						<aon:selectOneMenu id="PosShift_pos_department"
							value="#{posOpening.department}"
							rendered="#{posOpening.posShift.id == null}">
							<f:selectItem itemLabel=" - " itemValue="null" />
							<f:selectItems value="#{companyCollections.departments}" />
							<a4j:support event="onchange" reRender="PosShift_pos,PosShift_shift" ignoreDupResponses="true" ajaxSingle="true" />
							<a4j:support event="oninputchanged" reRender="PosShift_pos,PosShift_shift" ignoreDupResponses="true" ajaxSingle="true" />
						</aon:selectOneMenu>
						<aon:outputText styleClass="aon-bold"
							value="#{posOpening.posShift.pos.department.name}"
							rendered="#{posOpening.posShift.id != null}" />
					</c:if>

					<aon:outputLabel for="PosShift_pos" value="#{financeBundle.finance_pos}" />
					<aon:selectOneMenu id="PosShift_pos"
						value="#{posOpening.posShift.pos}" required="true" 
						rendered="#{posOpening.posShift.id == null}">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{posOpening.workPlacePos}" />
						<a4j:support event="onchange" reRender="PosShift_pos,PosShift_shift" ignoreDupResponses="true" ajaxSingle="true" />
						<a4j:support event="oninputchanged" reRender="PosShift_pos,PosShift_shift" ignoreDupResponses="true" ajaxSingle="true" />
					</aon:selectOneMenu>
					<aon:outputText styleClass="aon-bold"
						value="#{posOpening.posShift.pos.name}"
						rendered="#{posOpening.posShift.id != null}" />

					<aon:outputLabel for="PosShift_shift" value="#{financeBundle.finance_pos_shift}" />
					<aon:selectOneMenu id="PosShift_shift"
						value="#{posOpening.posShift.shift}" required="true" 
						rendered="#{posOpening.posShift.id == null}">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{posOpening.shifts}" />
					</aon:selectOneMenu>
					<aon:outputText styleClass="aon-bold"
						value="#{posOpening.posShift.shift}"
						rendered="#{posOpening.posShift.id != null}" />

					<aon:outputLabel for="PosShift_initialAmount" value="#{financeBundle.finance_initial_amount}" />
					<aon:div>
						<aon:inputText id="PosShift_initialAmount"
							value="#{posOpening.posShift.amount}"
							size="8" maxlength="8" 
							ajaxSingle="true">
							<f:validateDoubleRange minimum="0.0" />
						</aon:inputText>
						<aon:commandButton id="posShift-calculator" immediate="true"
							styleClass="aon-editDataTable-button aon-icon-calc aon-margin-left"
							value="&#160;"
							actionListener="#{posOpening.onShowCalculatorWindow}"
							reRender="showCalculatorWindow"
							ajaxSingle="true">
							<f:setPropertyActionListener target="#{posOpening.calculator.showCalculatorWindow}"
								value="#{true}" />
							<f:setPropertyActionListener target="#{posOpening.calculator.initialAmount}"
								value="#{posOpening.posShift.initialAmount}" />
							<f:setPropertyActionListener target="#{posOpening.calculator.recipient}"
								value="#{posOpening.posShift}" />
							<f:setPropertyActionListener target="#{posOpening.calculator.headerLabel}"
								value="#{financeBundle.finance_initial_amount}" />
							<f:setPropertyActionListener target="#{posOpening.calculator.footerLabel}"
								value="#{financeBundle.finance_difference}" />
						</aon:commandButton>
					</aon:div>

					<c:if test="#{posOpening.posShift.id != null}">
						<aon:outputLabel for="PosShift_starTime" value="#{financeBundle.finance_pos_opening}" />
						<aon:outputText id="PosShift_starTime"
							styleClass="aon-bold"
							value="#{posOpening.posShift.startTime}">
							<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</c:if>

				</aon:panelGrid>

			</aon:div>
		</aon:form>

		<ui:include src="/com/code/aon/ui/finance/facelet/posShift/calculator/calculatorModal.xhtml" >
			<ui:param name="controller" value="#{posOpening}" />
			<ui:param name="cashCalculator" value="#{posOpening.calculator}" />
			<ui:param name="modalReRender" value="posOpeningForm" />
		</ui:include>

	</ui:define>
</ui:composition>
