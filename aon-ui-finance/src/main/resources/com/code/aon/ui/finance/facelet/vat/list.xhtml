<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"

	<ui:define name="content">

				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">

					value="#{financeBundle.finance_vat_report_module}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener"
						value="#{vatReport.onReset}" type="actionListener" />
					<aon:methodParam name="searchAction" value="vat_report_search" />
				</ui:define>

				<ui:define name="additionalToolbarContent">
				</ui:define>
			</ui:decorate>

					style="text-align:center;border:solid #c4c4c4 1px;width: 1050px;">

						<aon:outputText value="#{bundle.aon_date_from}: "/>

								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:panelGroup>
					<aon:panelGroup rendered="#{vatReport.toDate != null}">
						<aon:outputText value="&#160;&#160;&#160;#{bundle.aon_date_to}: "/>

							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:panelGroup>
				</aon:div>
				
				<aon:outputText value="&#160;"/>

				<aon:panelGrid columns="4"
					columnClasses="aon-panelGrid2-header-first,
								   aon-panelGrid2-header,
								   aon-panelGrid2-header,
								   aon-panelGrid2-header">
					
					<aon:outputText value="&#160;"/>
					<aon:div styleClass="aon-panelGrid2-header-text">
						<aon:commandLink styleClass="aon-dataTable-link-noicon"
							actionListener="#{vatReport.onDetail}" 
							action="vat_report_detail">
							<aon:outputText value="#{vatReport.output}"/>

					<aon:div styleClass="aon-panelGrid2-header-text">

							<aon:outputText value="#{rep.base}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />

						<aon:column>

								action="vat_report_detail">
								<aon:outputText value="#{rep.percent} %" />

								<f:param name="vatReportType" value="#{vatReport.general}" />

							</aon:outputText>

						<aon:column>
							<aon:commandLink styleClass="aon-dataTable-link-noicon"
								actionListener="#{vatReport.onDetail}"

								<aon:outputText value="#{rep.percent} %" />

							</aon:outputText>
						</aon:column>
					</aon:dataTable>
					<!-- IVA SOPORTADO - RECARGO EQUIVALENCIA -->
					<aon:div style="background-color:#f2f2f2; height: 100%;">
						<aon:outputText value="&#160;"/>

					</aon:panelGrid>

						rendered="#{!(vatReport.result lt 0)}" 
						style="color:green;">
						<aon:outputText  value="#{vatReport.result}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText value="#{financeBundle.finance_vat_result_compensate}"/>
					</aon:panelGroup>
					
					<aon:panelGroup
						rendered="#{vatReport.result lt 0}" 
						style="color:red;">
						<aon:outputText value="#{vatReport.result * (-1)}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText value=" (#{financeBundle.finance_vat_result_pay_in})"/>
					</aon:panelGroup>
				</aon:div>

				<aon:panelGrid columns="4" style="margin-top: 1em;"
					columnClasses="aon-panelGrid2-header-first,
								   aon-panelGrid2-header,
								   aon-panelGrid2-header,
								   aon-panelGrid2-header">

					<!-- IVA INTRACOMUNITARIO -->
					<aon:div styleClass="aon-panelGrid2-header-text">
						<aon:commandLink styleClass="aon-dataTable-link-noicon"
							actionListener="#{vatReport.onDetail}" 
							action="vat_report_detail">
							<aon:outputText value="#{vatReport.intracommunity}"/>
							<f:param name="vatReportType" value="#{vatReport.intracommunity}"/>
						</aon:commandLink>

					<aon:dataTable var="rep" rows="0" rowClasses="none,none" style="width: 100%"
						columnClasses="aon-panelGrid2-odd,aon-panelGrid2-even,aon-panelGrid2-odd"

					</aon:panelGrid>
