<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinancePayrollWindow">
		<aon:if test="#{finance.showFinancePayrollWindow}">
			<rich:modalPanel id="financePayrollModalPanel" minHeight="240"
				minWidth="520" rendered="#{finance.showFinancePayrollWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_generate} #{bundle.payroll_finance_payment_module}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFinancePayrollWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{finance.showFinancePayrollWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="financePayrollForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="financePayroll-generate"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_generate}"
										actionListener="#{finance.onGeneratePayrollFinances}"
										reRender="showFinancePayrollWindow,financeList">
										<rich:componentControl for="financePayrollModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{finance.showFinancePayrollWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="financePayroll-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showFinancePayrollWindow">
										<f:setPropertyActionListener
											target="#{finance.showFinancePayrollWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

										<aon:outputLabel value="#{bundle.aon_period}" />
										<aon:div>
											<aon:outputLabel for="Finance_payrollMonth"
												styleClass="aon-margin-left aon-margin-right aon-italic"
												value="#{bundle.aon_month}" />
											<aon:selectOneMenu id="Finance_payrollMonth"
												value="#{finance.payrollMonth}" required="true">
												<f:selectItems value="#{commonCollections.months}" />
											</aon:selectOneMenu>

											<aon:outputLabel for="Finance_payrollYear"
												styleClass="aon-margin-left aon-margin-right aon-italic"
												value="#{bundle.aon_year}" />
											<aon:inputText id="Finance_payrollYear" size="5"
												value="#{finance.payrollYear}" required="true" />
										</aon:div>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
