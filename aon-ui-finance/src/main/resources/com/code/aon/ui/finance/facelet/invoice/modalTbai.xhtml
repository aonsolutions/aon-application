<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showTbaiWindow">
		<aon:if test="#{invoiceController.showTbaiWindow}">
			<rich:modalPanel id="fiscalTbaiModalPanel"
				minWidth="740" minHeight="450" zindex="90"
				showWhenRendered="#{invoiceController.showTbaiWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="TicketBAI" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showTbaiWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showTbaiWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="lroeForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="tbaiaccept"	
											value="Enviar"
											action="#{saleInvoice.tbai}"
											styleClass="aon-finding-toolbar-item aon-icon-check-black"
											reRender="showCertTbaiWindow">
											<f:setPropertyActionListener target="#{saleInvoice.showCertTbaiWindow}"
												value="#{true}" />
										</aon:commandButton>
										
										<!-- <aon:commandButton id="lroeanular"	
											value="Anular"
											action="#{saleInvoice.anular}"
											styleClass="aon-finding-toolbar-item aon-icon-removed"
											reRender="showCertTbaiWindow">
											<f:setPropertyActionListener target="#{saleInvoice.showCertTbaiWindow}"
												value="#{true}" />
										</aon:commandButton> -->
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panel>
											<f:facet name="header">
												<aon:outputText value="Envíos" />
											</f:facet>
											<aon:dataTable id="tbaiSendTable"  value="#{invoiceController.tbaiInfo.requests}" var="tb">
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="Fecha" />
													</f:facet>
													<aon:outputText value="#{tb.dataResponse.responseDate}" />
												</aon:column>
												
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="Operación" />
													</f:facet>
													<aon:outputText value="#{tb.operacion}" />
												</aon:column>
												
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="" />
													</f:facet>
													<aon:outputText title="Estado"
														styleClass="aon-editDataTable-button aon-icon-check-black aon-nowrap aon-margin-left"
														value="&#160;"
														rendered="#{tb.response.ok}" />
														
													<aon:outputText title="#{tb.response.validationDescription}"
														styleClass="aon-editDataTable-button aon-icon-wrong aon-nowrap aon-margin-left"
														value="&#160;"
														rendered="#{tb.response.error}" />

													<aon:outputLink id="tbaiDownloadRequest"
														title="Descargar Petición"
														target="_blank" value="#{tb.requestUrl}" 
														styleClass="aon-editDataTable-button aon-icon-download aon-nowrap aon-margin-left">
												    </aon:outputLink>
													
													<aon:outputLink id="tbaiDownloadResponse"
														title="Descargar Respuesta"
														target="_blank" value="#{tb.responseUrl}" 
														styleClass="aon-editDataTable-button aon-icon-download aon-nowrap aon-margin-left">
												    </aon:outputLink>

												</aon:column>
												
											</aon:dataTable>
										</aon:panel>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
