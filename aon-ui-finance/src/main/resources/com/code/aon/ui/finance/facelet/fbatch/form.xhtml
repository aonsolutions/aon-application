<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="financeBatchForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{(fbatch.payment)?
														(fbatch.payroll) ? (bundle.payroll_fbatch_payment_module) : (bundle.finance_fbatch_payment_module) :
														(bundle.finance_fbatch_charge_module)}" />
				<ui:param name="controller" value="#{fbatch}" />
				<ui:param name="skipSaveButton" value="#{fbatch.readOnly}" />
				<ui:param name="skipRemoveButton" value="#{fbatch.readOnly}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<ui:include
						src="/com/code/aon/ui/common/facelet/auditable/toolbarContent.xhtml" />										
					<aon:htmlCommandLink id="fBatch-excel-report"
						value="&#160;" target="_blank"
						action="#{report.onExecute}" rendered="#{!fbatch.nevv}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="fBatch" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>							
					<aon:htmlCommandLink id="fBatch-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}" rendered="#{!fbatch.nevv}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="fBatch" />
					</aon:htmlCommandLink>
					<aon:if test="#{(fbatch.to.financeBatchType != 'SEPA_19_14_CORE_XML') and (fbatch.to.financeBatchType != 'SEPA_19_14_COR1_XML')
							and (fbatch.to.financeBatchType != 'SEPA_58_ANTICIPO_XML') and (fbatch.to.financeBatchType != 'SEPA_58_COBRO_XML')  }" >
						<aon:commandButton id="aeb" value="#{bundle.finance_create_disk}"
							rendered="#{!fbatch.nevv and !fbatch.recorded and fbatch.diskMode and fbatch.filled and fbatch.to.registryBank.id != null}"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							reRender="progressBarForm"
							action="fbatch_form" actionListener="#{fbatch.onCreateDisk}" />
					</aon:if>	
					<aon:if test="#{(fbatch.to.financeBatchType == 'SEPA_19_14_CORE_XML') or (fbatch.to.financeBatchType == 'SEPA_19_14_COR1_XML')
							or (fbatch.to.financeBatchType == 'SEPA_58_ANTICIPO_XML') or (fbatch.to.financeBatchType == 'SEPA_58_COBRO_XML')}" >
						<aon:commandButton id="sepaCreateDisk" value="#{bundle.finance_create_disk}"
							rendered="#{!fbatch.nevv and !fbatch.recorded and fbatch.diskMode and fbatch.filled and fbatch.to.registryBank.id != null}"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							actionListener="#{fbatch.onShowSEPAWindow}"
							reRender="showSEPAWindow" />
				     </aon:if>	
					<aon:if test="#{aonRole.accountingOperator}">
						<aon:commandButton id="recordPopup" value="#{bundle.finance_record}"
							rendered="#{!fbatch.nevv and !fbatch.readOnly and (fbatch.done or !fbatch.diskMode)}"
							styleClass="aon-finding-toolbar-item aon-icon-task-assume"
							reRender="showFbatchRecordWindow">	
							<f:setPropertyActionListener target="#{fbatch.showFbatchRecordWindow}"
								value="#{true}" />
						</aon:commandButton>								
					</aon:if>
					<aon:if test="#{aonRole.accountingManager}">
						<aon:commandButton id="unrecord" value="#{bundle.finance_unrecord}"
							rendered="#{fbatch.recorded and !fbatch.inStatement}"
							styleClass="aon-finding-toolbar-item aon-icon-task-liberate"
							action="fbatch_form" actionListener="#{fbatch.onUnrecord}" >
				     		<ui:include
								src="/com/code/aon/ui/resources/facelet/shared/waitProcessSupport.xhtml" />				     		
				     	</aon:commandButton>
				     </aon:if>	
				</ui:define>				
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150
						,aon-panelGrid-even aon-width-auto
						,aon-panelGrid-odd aon-width-150
						,aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="FinanceBatch_id"
						value="#{bundle.aon_id}" />
					<aon:div> 
						<aon:inputText id="FinanceBatch_id" 
							value="#{fbatch.to.id}"
							disabled="true" size="10" />

						<aon:if test="#{aonRole.confidentiality}">
							<aon:selectBooleanCheckbox id="FinanceBatch_securityLevel"
							    styleClass="aon-margin-left"
								value="#{fbatch.to.confidential}"
								rendered="#{fbatch.nevv}" />
							<aon:outputText styleClass="aon-italic aon-margin-right"
								value="#{bundle.aon_confidential}"
								rendered="#{fbatch.nevv}" />
							<aon:outputText styleClass="aon-margin-left aon-icon aon-icon-confidential" 
								value="&#160;" title="#{bundle.aon_confidential}"
								rendered="#{!fbatch.nevv and fbatch.to.confidential}" />
						</aon:if>

						<aon:outputText styleClass="aon-margin-left"
							value="#{fbatch.to.financeBatchStatus}" />
						<aon:if test="#{aonRole.accountingOperator and fbatch.recorded}">
							<aon:commandLink immediate="true"
								styleClass="aon-button-goto"
								style="margin-left: 5px; padding-left: 17px;" 
								actionListener="#{fbatch.onViewAccountEntry}" 
								action="accountEntry_form"
								title="#{bundle.account_account_entry}: #{fbatch.accountEntryId}"
								alt="#{bundle.account_account_entry}: #{fbatch.accountEntryId}" />
						</aon:if>
					</aon:div>

					<aon:outputLabel for="FinanceBatch_issueDate"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="FinanceBatch_issueDate" 
						value="#{fbatch.to.issueDate}" required="true"
						disabled="#{fbatch.readOnly}" size="10"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="FinanceBatch_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="FinanceBatch_description"
						value="#{fbatch.to.description}" required="true"
						disabled="#{fbatch.readOnly}" size="40" maxlength="32" />

					<aon:outputLabel for="FinanceBatch_financeBatchType"
						value="#{bundle.finance_disk_type}" />
					<aon:selectOneMenu id="FinanceBatch_financeBatchType"
						value="#{fbatch.to.financeBatchType}"
						disabled="#{!fbatch.nevv}">
						<aon:if test="#{!fbatch.payroll}">
							<f:selectItems value="#{(fbatch.payment)?(financeCollections.financeBatchPaymentTypes):(financeCollections.financeBatchChargeTypes)}" />
						</aon:if>
						<aon:if test="#{fbatch.payroll}">
							<f:selectItems value="#{financeCollections.financeBatchPayrollTypes}" />
						</aon:if>								
					</aon:selectOneMenu>

					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{bundle.aon_bank}" />
					<aon:div>
						<aon:selectOneMenu id="RegistryBank_Lookup_id"
							value="#{fbatch.to.registryBank}"
							disabled="#{fbatch.readOnly}">
							<f:selectItem itemLabel="-" value="#{null}"  />
							<aon:if test="#{fbatch.nevv}">
								<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
							</aon:if>
							<aon:if test="#{!fbatch.nevv}">
								<f:selectItems value="#{companyCollections.allCompanyBanks}" />
							</aon:if>
						</aon:selectOneMenu>
						<aon:commandLink id="bankStatement_link" immediate="true"
							styleClass="aon-icon-commandButton aon-button-goto aon-bold aon-italic" style="padding-right: 20px;"
							value="#{bundle.finance_bank_statement_report}" title="#{bundle.finance_bank_statement_report}"
							rendered="#{fbatch.inStatement}"
							actionListener="#{fbatch.onLoadBankStatement}"
							action="bankStatement_list" />
					</aon:div>

					<aon:outputLabel for="FinanceBatch_totalAmount"
						value="#{bundle.stat_total}" />
					<aon:outputText id="FinanceBatch_totalAmount"
					 	styleClass="aon-bold"
						value="#{fbatch.to.financeBatchTotalAmount}"
						size="15">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>

				</aon:panelGrid>

				<aon:div id="fbatchPanelTabSet" >
					<aon:panelTabSet rendered="#{!fbatch.nevv}">
	
						<aon:if test="#{fBatchDetail.model.rowCount > 0}" >
							<aon:panelTab id="fBatchDetailTab" label="#{bundle.finance_included_finance}">
								<ui:include src="/com/code/aon/ui/finance/facelet/fbatch/formDetail.xhtml" />
							</aon:panelTab>
						</aon:if>
	
						<aon:if test="#{!fbatch.readOnly}" >
							<aon:panelTab id="financeTab" label="#{bundle.finance_not_batched_finances}">
								<ui:include src="/com/code/aon/ui/finance/facelet/fbatch/formFinance.xhtml" />
							</aon:panelTab>
						</aon:if>
	
					</aon:panelTabSet>
				</aon:div>
				
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/finance/facelet/finance/modalSearch.xhtml">
			<ui:param name="controller" value="#{financeList}" />
			<ui:param name="showType" value="false" />
			<ui:param name="payMethodSearchList" value="#{fbatch.searchPayMethods}" />
			<ui:param name="searchReRender" value="financeToolBarDiv,financeDataDiv" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/fbatch/modalRecord.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/fbatch/modalSEPA.xhtml" />
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml">
			<ui:param name="addWaitProcessPoll" value="#{true}" />
		</ui:include>
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/progressBar.xhtml">
			<ui:param name="progressLabel" value="#{bundle.finance_create_disk}" />
			<ui:param name="progressBarBean" value="#{fbatch.progressionState}" />
			<aon:methodParam name="progressBarCloseActionListener"
				default="#{fbatch.onClosePanel}" type="actionListener" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{fbatch}" />
		</ui:include>				
	</ui:define>
</ui:composition>
