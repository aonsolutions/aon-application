<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFbatchRecordWindow">
		<c:if test="#{fbatch.showFbatchRecordWindow}">
			<rich:modalPanel id="fbatchRecordModalPanel" minHeight="220"
				minWidth="460" rendered="#{fbatch.showFbatchRecordWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{financeBundle.finance_record}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFbatchRecordWindow" immediate="true">
							<f:setPropertyActionListener
								target="#{fbatch.showFbatchRecordWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="fbatchRecordFrom">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="fbatchRecord-record"
										value="#{financeBundle.finance_record}"
										reRender="showFbatchRecordWindow,financeBatchForm"
										actionListener="#{fbatch.onRecord}"
										styleClass="aon-finding-toolbar-item aon-icon-task-assume"
										onclick="Richfaces.showModalPanel('waitProccess')" 
							     		oncomplete="Richfaces.hideModalPanel('waitProccess')">	
										<f:setPropertyActionListener
											target="#{fbatch.showFbatchRecordWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="fbatchRecord-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showFbatchRecordWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{fbatch.showFbatchRecordWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="menuGrid" columns="2" dir="true">

										<aon:outputLabel for="FinanceBatch_recordDate"
											value="#{financeBundle.finance_record_date}" />
										<aon:selectInputDate id="FinanceBatch_recordDate" 
											value="#{fbatch.recordDate}"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"/>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
