<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="invoiceSignerList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_invoice_signing_module}" />
				<ui:param name="controller" value="#{invoiceSigner}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="sign"
						value="#{financeBundle.finance_sign_selected}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{invoiceSigner.onShowSignWindow}"
						disabled="#{invoiceSigner.selectionEmpty}"
						reRender="showSignWindow">
					</aon:commandButton>
					<aon:commandButton id="cancel_sign"
						value="#{financeBundle.finance_cancel_sign_selected}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						actionListener="#{invoiceSigner.onCancelSignSelected}"
						disabled="#{invoiceSigner.selectionEmpty}" >
					</aon:commandButton>
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:div styleClass="aon-toolbar" rendered="#{invoiceSigner.model.rowCount > 0}">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						ajaxSingle="true" reRender="invoiceSignerDataDiv, aonToolbar"
						actionListener="#{invoiceSigner.checkAll}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						ajaxSingle="true" reRender="invoiceSignerDataDiv, aonToolbar"
						actionListener="#{invoiceSigner.checkNone}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
				</aon:div>

				<aon:div id="invoiceSignerDataDiv">
					<aon:dataTable id="invoiceSignerData" value="#{invoiceSigner.model}"
						var="to" rows="20" rendered="#{invoiceSigner.model.rowCount > 0}"
						columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
							 aon-editDataTable-textColumn aon-width-150, aon-editDataTable-textColumn, aon-editDataTable-textColumn">

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:selectBooleanCheckbox id="Included_Row_checked"
								value="#{invoiceSigner.rowChecked}"
								ajaxSingle="true" reRender="aonToolbar" />	
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{customerBundle.customer_customer}" />
							</f:facet>
							<aon:outputText value="#{to.registryName}" />
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.issueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{financeBundle.finance_signature}" />
							</f:facet>
							<aon:graphicImage rendered="#{to.signed}"
								styleClass="aon-vertical-align-top aon-margin-left" title="#{financeBundle.finance_signed}"
								url="#{aonResource.resolve['/com/code/aon/ui/finance/facelet/invoiceSigner/signed.png']}"/>
							<aon:graphicImage rendered="#{!to.signed}"
								styleClass="aon-vertical-align-top aon-margin-left" alt="#{financeBundle.finance_sign_pending}"
								url="#{aonResource.resolve['/com/code/aon/ui/finance/facelet/invoiceSigner/not-signed.png']}"/>
						</aon:column>

					</aon:dataTable>
					<aon:dataScroller2 for="invoiceSignerData" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoiceSigner/modal.xhtml" >
			<ui:param name="signButtonreRender" value="invoiceSignerDataDiv,aonToolbar" />
			<aon:methodParam name="signActionListener" value="#{invoiceSigner.onSignSelected}" type="actionListener" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />		
	</ui:define>
</ui:composition>
