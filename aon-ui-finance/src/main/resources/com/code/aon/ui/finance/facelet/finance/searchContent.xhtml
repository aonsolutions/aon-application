<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputText value="" />
	<aon:div styleClass="aon-search-content-width">
	
		<aon:panelCollapsible expanded="true" label="#{bundle.finance_finance}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:include src="/com/code/aon/ui/finance/facelet/finance/searchBasicContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>					

		<aon:panelCollapsible expanded="false" 
			label="#{(!controller.payroll) ?
						(!controller.payment) ? (bundle.registry_customer_data) : (bundle.finance_invoice_supplier_creditor_data) :
						(bundle.payroll_salary_employee_data)}">
			<aon:panel style="text-align:left;">
				<f:facet name="header">
					<aon:outputLabel value="#{(!controller.payroll) ? 
												(!controller.payment) ? (bundle.aon_customer) : (bundle.finance_supplier_creditor) :
												(bundle.payroll_salary_employee_data)}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		

					<aon:outputLabel for="#{searchController.preffix}alias"
						value="#{bundle.aon_company_alias}" />
					<aon:inputText id="#{searchController.preffix}alias" size="60"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Finance_registryName"
						value="#{bundle.aon_company_name}" />
					<aon:inputText id="Finance_registryName" size="60"
						valueChangeListener="#{controller.addExpression}" />
						
					<ui:include src="/com/code/aon/ui/config/facelet/scope/searchContent.xhtml" />
					
					<aon:outputLabel for="Finance_registryDocument"
						value="#{bundle.aon_document}" />
					<aon:inputText id="Finance_registryDocument" size="20"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Finance_registryDocumentCountry"
						value="#{bundle.aon_document_country}" />
					<aon:selectOneMenu id="Finance_registryDocumentCountry"
						converter="aon.EnumConverter"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{commonCollections.countryCodes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Finance_registryDocumentType"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Finance_registryDocumentType"
						converter="aon.EnumConverter"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{registryCollections.documentTypes}" />
					</aon:selectOneMenu>
 				</aon:panelGrid>
			</aon:panel>
			<aon:panel style="text-align:left;">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.registry_address_module}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
			<aon:panel style="text-align:left;">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_contacts}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
		</aon:panelCollapsible>

	</aon:div>

</ui:composition>
