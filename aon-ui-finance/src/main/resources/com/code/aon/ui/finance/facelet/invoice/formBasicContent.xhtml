<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:outputLabel for="#{invoiceController.to.sales ? ('Invoice_number') : ('Invoice_referenceCode')}"
		value="#{bundle.aon_invoice_number}" />
	<aon:div>
		<aon:panelGrid columns="2" columnClasses="aon-width-220,aon-width-auto">
			<aon:if test="#{invoiceController.to.sales}">
				<ui:decorate template="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
					<ui:param name="controller" value="#{invoiceController}" />
					<ui:param name="sfc_div" value="InvoiceReferenceCodeDiv" />
					<ui:param name="skipSeriesLabel" value="#{true}" />
					<ui:param name="seriesChangedReRender" value="Invoice_securityLevel" />
					<ui:param name="sfc_seriesValid" value="#{invoiceController.seriesValid}" />
					<ui:param name="sfc_editable" value="#{!invoiceController.readOnly and financeController.allPending}" />								
					<ui:param name="sfc_numberReset" value="#{invoiceController.nevv}" />								
					<ui:define name="additionalSeriesContent">
						<aon:commandButton id="Invoice_NextNumber" immediate="#{true}"
							title="#{bundle.finance_invoice_find_next_number}"
							styleClass="aon-icon-commandButton aon-icon-ambito"
							rendered="#{sfc_editable}" value="&#160;"
							actionListener="#{invoiceController.onFindNextFreeNumber}"
							reRender="Invoice_number" ajaxSingle="true" process="Invoice_number">
						</aon:commandButton>															
					</ui:define>
				</ui:decorate>
			</aon:if>
			<aon:if test="#{!invoiceController.to.sales}">
				<aon:div id="InvoiceReferenceCodeDiv">
					<aon:inputText id="Invoice_referenceCode" 
						value="#{invoiceController.to.referenceCode}" 
						required="true" size="25" maxlength="32"
						rendered="#{!invoiceController.readOnly and financeController.allPending}" 
						valueChangeListener="#{invoiceController.onReferenceCodeChanged}"
						reRender="InvoiceReferenceCodeDiv" ajaxSingle="true" />
					<aon:outputText styleClass="aon-bold"
						value="#{invoiceController.to.referenceCode}"
						rendered="#{invoiceController.readOnly or !financeController.allPending}" />
				</aon:div>
			</aon:if>
			<aon:div>
				<aon:if test="#{!invoiceController.to.sales}">
					<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formInvestment.xhtml">
						<ui:param name="invoiceController" value="#{invoiceController}" />
					</ui:include>
				</aon:if>

				<aon:if test="#{aonRole.confidentiality}">
					<aon:selectBooleanCheckbox id="Invoice_securityLevel"
						value="#{invoiceController.to.confidential}" 
						rendered="#{!invoiceController.readOnly and financeController.allPending}"
						ajaxSingle="true" />
					<aon:outputText styleClass="aon-italic aon-margin-right"
						value="#{bundle.aon_confidential}"
						rendered="#{!invoiceController.readOnly and financeController.allPending}" />
					<aon:outputText styleClass="aon-icon aon-icon-confidential" 
						value="&#160;" title="#{bundle.aon_confidential}"
						rendered="#{(invoiceController.readOnly or !financeController.allPending) and invoiceController.to.confidential}" />
				</aon:if>

				<aon:if test="#{company.EInvoice}">
					<aon:outputText styleClass="aon-icon aon-icon-signed"
						value="&#160;" title="#{bundle.sign_signed}"
						rendered="#{!invoiceController.nevv and invoiceController.to.signed}" />
				</aon:if>						

				<aon:outputText value="#{invoiceController.to.status}"
					rendered="#{!invoiceController.nevv}" />
				<aon:if test="#{aonRole.accountingOperator and invoiceController.recorded and invoiceController.backAction != 'accountEntry_form'}">
					<aon:commandLink id="Invoice_accountEntry-view" immediate="true"
						styleClass="aon-button-goto" style="margin-left: 5px; padding-left: 17px;"
						title="#{bundle.account_account_entry}: #{invoiceController.accountEntryId}"
						actionListener="#{invoiceController.onViewAccountEntry}" 
						action="accountEntry_form" />
				</aon:if>
			</aon:div>
		</aon:panelGrid>
	</aon:div>

	<aon:outputLabel for="Invoice_issueDate"
		value="#{bundle.aon_date}" />
	<aon:selectInputDate id="Invoice_issueDate"
		value="#{invoiceController.to.issueDate}" required="true"
		disabled="#{invoiceController.readOnly}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}">
		<a4j:support event="oninputchange"
			actionListener="#{invoiceController.onDateChanged}"
			reRender="Invoice_taxDate" ajaxSingle="true" />
		<a4j:support event="onchanged"
			actionListener="#{invoiceController.onDateChanged}"
			reRender="Invoice_taxDate" ajaxSingle="true" />
	</aon:selectInputDate>

	<aon:if test="#{invoiceController.to.sales}">
		<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
			<ui:param name="lookupTo" value="#{invoiceController.to.registry}" />
			<ui:param name="lookupForRegistry" value="#{true}" />
			<ui:param name="lookupInputNameValue" value="#{invoiceController.to.registryName}" />
			<ui:param name="lookupDisabled" value="#{invoiceController.registryReadOnly or !financeController.allPending}" />
			<ui:param name="lookupInputNameDisabled" value="#{invoiceController.readOnly or !financeController.allPending}" />
			<ui:param name="lookupReRender" value="#{formName}" />
			<ui:param name="idRequired" value="#{true}" />						
			<ui:param name="skipSuggestText" 
				value="#{invoiceController.to.registry != null and invoiceController.to.registry.id != null}" />
			<aon:methodParam name="lookupChangeListener"
				value="#{invoiceController.onCustomerChanged}" type="lookupChangeListener" />
		</ui:include>
	</aon:if>
	<aon:if test="#{invoiceController.to.purchase}">
		<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
			<ui:param name="lookupTo" value="#{invoiceController.to.registry}" />
			<ui:param name="lookupForRegistry" value="#{true}" />
			<ui:param name="lookupInputNameValue" value="#{invoiceController.to.registryName}" />
			<ui:param name="lookupDisabled" value="#{invoiceController.registryReadOnly or !financeController.allPending}" />
			<ui:param name="lookupInputNameDisabled" value="#{invoiceController.readOnly or !financeController.allPending}" />
			<ui:param name="lookupReRender" value="#{formName}#{invoiceController.nevv?'-New':''}" />
			<ui:param name="idRequired" value="#{true}" />						
			<ui:param name="skipSuggestText" 
				value="#{invoiceController.to.registry != null and invoiceController.to.registry.id != null}" />
			<aon:methodParam name="lookupChangeListener"
				value="#{invoiceController.onSupplierChanged}" type="lookupChangeListener" />
		</ui:include>
	</aon:if>
	<aon:if test="#{invoiceController.to.expense or invoiceController.to.undeductible}">
		<ui:include src="/com/code/aon/ui/finance/facelet/creditor/lookup.xhtml">
			<ui:param name="lookupTo" value="#{invoiceController.to.registry}" />
			<ui:param name="lookupForRegistry" value="#{true}" />
			<ui:param name="lookupInputNameValue" value="#{invoiceController.to.registryName}" />
			<ui:param name="lookupDisabled" value="#{invoiceController.registryReadOnly or !financeController.allPending}" />
			<ui:param name="lookupInputNameDisabled" value="#{invoiceController.readOnly or !financeController.allPending}" />
			<ui:param name="lookupReRender" value="#{formName}#{invoiceController.nevv?'-New':''}" />
			<ui:param name="idRequired" value="#{true}" />						
			<ui:param name="skipSuggestText" 
				value="#{invoiceController.to.registry != null and invoiceController.to.registry.id != null}" />
			<aon:methodParam name="lookupChangeListener"
				value="#{invoiceController.onCreditorChanged}" type="lookupChangeListener" />
		</ui:include>
	</aon:if>

	<aon:if test="#{!invoiceController.nevv}">
		<aon:outputLabel for="Invoice_taxDate" 
			value="#{bundle.finance_tax_date}" />
		<aon:div>
			<aon:if test="#{aonRole.accountingOperator}">
				<aon:selectInputDate id="Invoice_taxDate"
					value="#{invoiceController.to.taxDate}" required="true" 
					disabled="#{invoiceController.readOnly}"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}"
					inputStyle="#{invoiceController.taxDateEquals?'':'background-color: #ff865e;'}">
					<a4j:support event="oninputchange"
						reRender="Invoice_taxDate" ajaxSingle="true" />
					<a4j:support event="onchanged"
						reRender="Invoice_taxDate" ajaxSingle="true" />
				</aon:selectInputDate>
			</aon:if>
			<aon:if test="#{!aonRole.accountingOperator}">
				<aon:outputText value="#{invoiceController.to.taxDate}" />
			</aon:if>
		</aon:div>
	</aon:if>

	<aon:outputLabel for="Invoice_registry_document"
		value="#{bundle.aon_company_document}" />
	<aon:panelGroup id="Invoice_registry_document_panel">
		<aon:selectOneMenu id="Invoice_registry_document_type" 
			value="#{invoiceController.to.registryDocumentType}"
			disabled="#{invoiceController.readOnly}"
			reRender="Invoice_registry_document_icon" ajaxSingle="true">
			<f:selectItems value="#{registryCollections.documentTypes}" />
		</aon:selectOneMenu>
		<aon:outputText styleClass="aon-margin-left aon-italic"
			value="#{bundle.aon_country}" />
		<aon:selectOneMenu id="Invoice_registry_document_country"
			styleClass="aon-margin-left"
			value="#{invoiceController.to.registryDocumentCountry}"
			disabled="#{invoiceController.readOnly}"
			reRender="Invoice_registry_document_icon" ajaxSingle="true">
			<f:selectItems value="#{commonCollections.countryCodes}" />
		</aon:selectOneMenu>
		<aon:inputText id="Invoice_registry_document" 
			style="margin-left: 3px;"
			value="#{invoiceController.to.registryDocument}" size="16" maxlength="16"
			disabled="#{invoiceController.readOnly}"
			reRender="Invoice_registry_document_icon" ajaxSingle="true" 
			onblur="toUpperCase(this);">
			<f:validateLength minimum="1" maximum="16" />
		</aon:inputText>
		<aon:panelGroup id="Invoice_registry_document_icon">
			<aon:outputText value="&#160;" 
				styleClass="aon-icon-question"
				style="padding-left: 15px;"
				rendered="#{!invoiceController.to.registryDocumentValidable}" />
			<aon:outputText value="&#160;" 
				styleClass="aon-icon-predetermine"
				style="padding-left: 15px;"
				rendered="#{invoiceController.to.registryDocumentValidable and invoiceController.to.validRegistryDocument}" />
			<aon:outputText value="&#160;"
				styleClass="aon-icon-exception"
				style="padding-left: 15px;"
				rendered="#{invoiceController.to.registryDocumentValidable and !invoiceController.to.validRegistryDocument}" />
		</aon:panelGroup>
	</aon:panelGroup>

	<aon:if test="#{!invoiceController.nevv}">
		<aon:outputLabel value="#{bundle.aon_document_number}" />
		<aon:outputText styleClass="aon-bold"
			value="#{invoiceController.to.documentNumber}" />
	</aon:if>

	<aon:outputLabel for="Invoice_registryAddress_id"
		value="#{bundle.aon_address}" />
	<aon:div id="InvoiceAddress">
		<aon:selectOneMenu id="Invoice_registryAddress_id"
			rendered="#{!invoiceController.readOnly and addressController.to.id == null and invoiceController.addressCount > 0}"
			value="#{invoiceController.to.registryAddress}"
			ajaxSingle="true">
			<f:selectItems value="#{invoiceController.addresses}" />
		</aon:selectOneMenu>
		<aon:outputLabel styleClass="aon-italic"
			value="#{bundle.registry_no_address_available}"
			rendered="#{addressController.to.id == null and ((invoiceController.readOnly and invoiceController.to.registryAddress.id == null) or (!invoiceController.readOnly and invoiceController.addressCount == 0))}" />
		<aon:outputText styleClass="aon-bold"
			value="#{invoiceController.address}" 
			rendered="#{addressController.to.id != null or (invoiceController.readOnly and invoiceController.to.registryAddress.id != null)}">
			<aon:abbreviateConverter maxWidth="30" />
		</aon:outputText>
		<aon:outputText styleClass="aon-margin-left aon-bold"
			value="#{invoiceController.location}"
			rendered="#{addressController.to.id != null or (invoiceController.readOnly and invoiceController.to.registryAddress.id != null)}">
			<aon:abbreviateConverter maxWidth="25" />
		</aon:outputText>
		<aon:div layout="inline" styleClass="aon-margin-left">
			<aon:commandButton id="invoiceAddressButton"
				value="#{bundle.registry_address_other}"
				styleClass="aon-icon-commandButton aon-icon-go aon-bold aon-italic"
				rendered="#{!invoiceController.nevv and !invoiceController.readOnly}"
				actionListener="#{invoiceController.onInvoiceAddressShow}"
				reRender="showInvoiceAddressWindow" ajaxSingle="true">
				<f:setPropertyActionListener target="#{invoiceController.showInvoiceAddressWindow}"
					value="#{true}" />								
			</aon:commandButton>
		</aon:div>
	</aon:div>

	<aon:if test="#{!invoiceController.nevv}">
		<aon:outputLabel for="Invoice_total" 
			value="#{bundle.aon_total}" />
		<aon:div>
			<aon:outputText id="Invoice_total" 
				styleClass="aon-bold"
				value="#{invoiceController.toInvoiceTotalPrice}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:outputLabel styleClass="aon-margin-left aon-italic"
				value="(#{bundle.aon_tax_included})" />
		</aon:div>
	</aon:if>

</ui:composition>
