<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showDetailsDiscountWindow">
		<c:if test="#{invoiceController.showDetailsDiscountWindow}">
			<rich:modalPanel id="detailsDiscountModalPanel"
				minWidth="350" minHeight="200" zindex="90"
				showWhenRendered="#{invoiceController.showDetailsDiscountWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{financeBundle.finance_purchase_invoice_details_discount}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showDetailsDiscountWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showDetailsDiscountWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="detailsDiscountForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="detailsDiscount-accept"
											value="#{bundle.aon_accept}"
											actionListener="#{invoiceController.applyDetailsDiscount}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<rich:componentControl for="detailsDiscountModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{invoiceController.showDetailsDiscountWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="detailsDiscount-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showDetailsDiscountWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{invoiceController.showDetailsDiscountWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">
										
											<aon:outputLabel for="InvoiceDetails_discount" value="#{bundle.aon_discount}" />
											<aon:inputText id="InvoiceDetails_discount"
												value="#{invoiceController.discountExpr}" 
												required="true" size="5" />
														
										</aon:panelGrid>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
