<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showSEPAWindow">
		<aon:if test="#{fbatch.showSEPAWindow}">
			<rich:modalPanel id="fbatchSEPAModalPanel" minHeight="240"
				minWidth="520" rendered="#{fbatch.showSEPAWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.finance_sepa_parameters}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showSEPAWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{fbatch.showSEPAWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="fbatchSEPAForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="fbatchSEPA-accept"
										value="#{bundle.aon_accept}"
										reRender="showSEPAWindow, showAebWaitingProcessWindow"
										actionListener="#{fbatch.onCreateDisk}"
										styleClass="aon-finding-toolbar-item aon-icon-accept" >
										<aon:actionListener method="#{fbatch.onClosePanel}"/>
									</aon:commandButton>
									<aon:commandButton id="fbatchSEPA-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showSEPAWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{fbatch.showSEPAWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid columns="2">

										<aon:outputLabel for="FinanceBatch_bankDate"
											value="#{bundle.aon_date_send_bank}" />
										<aon:selectInputDate id="FinanceBatch_bankDate" 
											value="#{fbatch.bankDate}"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-125" />

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
