<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<a4j:loadScript src="#{aonResource.resolveLocal['/com/code/aon/ui/finance/posInvoice.js']}"/>

	<aon:panelGroup id="showPrintTicketWindow">
		<c:if test="#{invoiceController.showPrintTicketWindow}">
			<rich:modalPanel id="printTicketModalPanel"
				minHeight="200" minWidth="420" zindex="90"
				showWhenRendered="#{invoiceController.showPrintTicketWindow}" >
				
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText 
							value="#{bundle.aon_report}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton id="printTicketCloseButton" type="button"
							styleClass="aon-popupWindow-close"
							reRender="showPrintTicketWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showPrintTicketWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="printTicketForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div styleClass="aon-popupWindow-content-internal">
						
							<aon:div styleClass="aon-note" >
								<aon:div styleClass="aon-note-internal">
									<aon:panelGroup>
										<aon:outputText id="printTicketStatus"
											value="#{bundle.finance_pos_loading_applet}" />
										<rich:jQuery name="changePrintTicketPrinting"
											selector="#printTicketStatus"
											timing="onJScall" query="text('#{bundle.finance_pos_printing_ticket}');" />													
										<rich:jQuery name="changePrintTicketEror"
											selector="#printTicketStatus"
											timing="onJScall" query="text('#{bundle.finance_pos_error_print_ticket}');" />													
									</aon:panelGroup>
								</aon:div>
							</aon:div>

							<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">

								<aon:div styleClass="aon-text-center" >
									<applet id="jzebra" name="jzebra"
										code="jzebra.PrintApplet.class" width="50px" height="50px"
										archive="#{aonResource.resolveCommon['/jzebra.jar']}">
											<!-- Optional, searches for printer with "zebra" in the name on load -->
											<!-- Note:  It is recommended to use applet.findPrinter() instead for ajax heavy applications -->
											<param name="printer" value="zebra" />
											<!-- Optional, these "cache_" params enable faster loading "caching" of the applet -->
											<param name="cache_option" value="plugin" />
											<!-- Change "cache_archive" to point to relative URL of jzebra.jar -->
											<param name="cache_archive" value="#{aonResource.resolveCommon['/jzebra.jar']}" />
											<!-- Change "cache_version" to reflect current jZebra version -->
											<param name="cache_version" value="1.4.8.0" />
									</applet>
								</aon:div>

								<aon:inputTextarea id="ticketData"
									style="display: none;" readonly="true"
									value="#{invoiceController.ticketText}" />

							</aon:div>

						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
