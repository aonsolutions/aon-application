<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="fbatchExporterForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.fbatch_account_export_module}" />
				<ui:param name="controller" value="#{fbatchExporter}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="startDownloadExport"
						value="#{bundle.webmail_download}: #{exporter.configuration.type.name}"
						styleClass="aon-finding-toolbar-item aon-icon-mail-save" 
						disabled="#{empty fbatchExporter.checkList}" reRender="fbatchExporterToolbar,financeDataDiv"
						actionListener="#{fbatchExporter.onStart}" >
						<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
					</aon:commandButton>
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:div styleClass="aon-margin-bottom">
					<aon:panelGrid id="menuGrid" columns="2"
						rendered="#{!fbatchExporter.recorded}" >
	
						<aon:outputLabel for="FinanceBatch_recordDate"
							value="#{bundle.finance_record_date}" />
						<aon:selectInputDate id="FinanceBatch_recordDate"
							required="true" 
							value="#{fbatchExporter.recordDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
	
					</aon:panelGrid>
				</aon:div>			
			
				<aon:div styleClass="aon-toolbar" rendered="#{fbatchExporter.model.rowCount > 0}">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						ajaxSingle="true" reRender="financeDataDiv,fbatchExporterToolbar"
						actionListener="#{fbatchExporter.checkAll}"/>	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						ajaxSingle="true" reRender="financeDataDiv,fbatchExporterToolbar"
						actionListener="#{fbatchExporter.checkNone}" />				
				</aon:div>
				<aon:div id="financeDataDiv">					
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{fbatchExporter}" />
						<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
						<ui:param name="skipSelectButton" value="#{true}" />
						<ui:define name="columns">
						
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:selectBooleanCheckbox id="Included_Row_checked"
									value="#{fbatchExporter.rowChecked}"
									ajaxSingle="true" reRender="fbatchExporterToolbar" />	
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-width-60">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_type}" />
								</f:facet>
								<aon:outputText value="#{(to.payment) ? (bundle.finance_payment) : (bundle.finance_charge)}" />
							</aon:column>
							
							<ui:include src="/com/code/aon/ui/finance/facelet/fbatch/listContent.xhtml" />

						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>

		<aon:methodParam name="closeLogPanelAtionListener" value="#{exporter.onFinish}" type="actionListener" />
		<ui:decorate template="/com/code/aon/faces/logPanel/modal.xhtml" >
			<ui:param name="logPanelTitle" value="#{bundle.fbatch_account_export_module}" />			
			<ui:param name="pollInterval" value="5000" /> 
			<ui:define name="additionalLogPanelContent">
				<aon:if test="#{exporter.finished and (!exporter.dataEmpty)}">
					<aon:div styleClass="aon-margin-bottom">
						<aon:htmlCommandLink id="downloadExport"
							value="#{bundle.aon_fileupload_download}" target="_blank"
							actionListener="#{exporter.onDownload}"
							style="border: none;"
							styleClass="aon-finding-toolbar-item aon-icon-mail-save" >
							<rich:componentControl for="logPanel" operation="hide" event="onclick" />
						</aon:htmlCommandLink>
					</aon:div>
				</aon:if>
			</ui:define>
		</ui:decorate>	
		
	</ui:define>
</ui:composition>
