<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="posShiftFinanceDataList" 
		value="#{posShift.financeModel}" var="to" rows="0"
		rendered="#{posShift.financeModel.rowCount > 0}">

		<ui:include	src="/com/code/aon/ui/finance/facelet/posShift/finance/tab_gridContent.xhtml">
			<ui:param name="controller" value="#{posShift}" />
		</ui:include>

	</aon:dataTable>

	<aon:commandButton id="invoiceBind" immediate="true"
		styleClass="aon-finding-toolbar-item aon-icon-reset" style="border: #808080 1px solid; margin-top: 0.7em;"
		value="#{financeBundle.finance_pos_shift_bind_invoice}"
		actionListener="#{posShift.onBindInvoiceShow}"
		reRender="showBindInvoiceWindow">
		<f:setPropertyActionListener target="#{posShift.showBindInvoiceWindow}"
			value="#{true}" />
	</aon:commandButton>

</ui:composition>
