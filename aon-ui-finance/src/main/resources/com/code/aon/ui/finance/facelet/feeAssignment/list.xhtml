<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="feeAssignmentList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_fee_assignment_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_listing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="feeAssignment-accept"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						value="#{bundle.aon_accept}"
						rendered="#{feeAssignment.checkedCount > 0}"
						actionListener="#{feeAssignment.onAssignFee}"
						accesskey="#{bundle.aon_key_accept}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
					<aon:commandButton id="feeAssignment-search" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						value="#{bundle.aon_search}"
						actionListener="#{feeAssignment.onEditSearch}" action="feeAssignment_search" 
						accesskey="#{bundle.aon_key_search}" />
				</ui:define>
			</ui:decorate>			

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" styleClass="aon-margin-bottom">

					<aon:outputLabel for="Item_id" value="#{bundle.aon_product}" />
					<aon:div styleClass="aon-nowrap">
						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
							<ui:param name="lookupBean" value="#{saleItemLookup}" />
							<ui:param name="lookupTo" value="#{feeAssignment.fee.item}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="skipSuggestText" value="#{feeAssignment.fee.item != null and feeAssignment.fee.item.id != null}" />
							<ui:param name="lookupInputSuggestSize" value="55" />
							<ui:param name="lookupInputOnFocus" value="CustomerFee_description" />
							<ui:param name="lookupReRender" value="customerFeeItemDescription,CustomerFee_price,CustomerFee_discount" />
							<ui:param name="lookupControllerListener" value="#{itemLookupNoWildCardListener}" />
							<aon:methodParam name="lookupChangeListener"
								value="#{feeAssignment.onItemChanged}" type="lookupChangeListener" />
						</ui:include>
						<aon:panelGroup id="customerFeeItemDescription" styleClass="aon-nowrap aon-vertical-align-top" >
							<aon:inputTextarea id="CustomerFee_description"
								style="#{!feeAssignment.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}"
								value="#{feeAssignment.fee.description}"
								cols="60" rows="#{!feeAssignment.longDescription?1:5}"
								rendered="#{feeAssignment.fee.item != null and feeAssignment.fee.item.id != null}">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
							<aon:commandLink id="CustomerFee_description_short" immediate="true"
								value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
								styleClass="aon-icon-edit-end-simple" style="margin-left: 5px; padding-right: 12px;"
								rendered="#{feeAssignment.longDescription and feeAssignment.fee.item.product.code != null}"
								actionListener="#{feeAssignment.onShortDescription}" 
								reRender="customerFeeItemDescription" ajaxSingle="true" />
							<aon:commandLink id="InvoiceDetail_description_long" immediate="true"
								value="&#160;" title="#{bundle.aon_edit}"
								styleClass="aon-icon-edit-add-simple" style="margin-left: 5px; padding-right: 12px;"
								rendered="#{!feeAssignment.longDescription and feeAssignment.fee.item.product.code != null}"
								actionListener="#{feeAssignment.onLongDescription}"
								reRender="customerFeeItemDescription" ajaxSingle="true" />
						</aon:panelGroup>
					</aon:div>

					<aon:outputLabel for="CustomerFee_quantity" value="#{bundle.aon_quantity}" />
					<aon:panelGrid columns="5" columnClasses="aon-width-150,aon-width-60,aon-width-100,aon-width-40,aon-width-auto">
						<aon:inputText id="CustomerFee_quantity" 
							value="#{feeAssignment.fee.quantity}" 
							required="true" size="2" />

						<aon:outputLabel for="CustomerFee_price" value="#{bundle.aon_price}"
							styleClass="aon-margin-right" />

						<aon:inputText id="CustomerFee_price"
							value="#{feeAssignment.fee.price}" 
							required="true" size="4" />

						<aon:outputLabel for="CustomerFee_discount" value="#{bundle.aon_discount_abrv}"
							styleClass="aon-margin-right" />

						<aon:inputText id="CustomerFee_discount"
							value="#{feeAssignment.fee.discountExpression.discountExpr}"  
							required="true" size="2" />
					</aon:panelGrid>

					<aon:outputLabel for="CustomerFee_initialDate" value="#{bundle.aon_date_from}" />
					<aon:panelGrid columns="3" columnClasses="aon-width-150,aon-width-60,aon-width-auto">
						<aon:selectInputDate id="CustomerFee_initialDate"
							value="#{feeAssignment.fee.initialDate}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="CustomerFee_finalDate" value="#{bundle.aon_date_to}"
							styleClass="aon-margin-right aon-bold" />

						<aon:selectInputDate id="CustomerFee_finalDate"
							value="#{feeAssignment.fee.finalDate}" 
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>

					<aon:outputLabel for="CustomerFee_billingDateYear" value="#{bundle.finance_fee_billing_date_abrv}" />
					<aon:panelGrid columns="3" columnClasses="aon-width-150,aon-width-60,aon-width-auto">
						<aon:div styleClass="aon-nowrap">
							<aon:selectOneMenu value="#{feeAssignment.fee.billingDateMonth}">
								<f:selectItems value="#{commonCollections.months}" />
							</aon:selectOneMenu>
							<aon:inputText id="CustomerFee_billingDateYear" 
								value="#{feeAssignment.fee.billingDateYear}"
								required="true" size="3" maxlength="4" />
						</aon:div>

						<aon:outputLabel for="CustomerFee_period" value="#{bundle.aon_period}"
							styleClass="aon-margin-right aon-bold" />

						<aon:selectOneMenu id="CustomerFee_period"
							value="#{feeAssignment.fee.period}" >
							<f:selectItems value="#{financeCollections.billingPeriods}" />
						</aon:selectOneMenu>
					</aon:panelGrid>

					<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml">
						<ui:param name="lookupTo" value="#{feeAssignment.fee.seller}" />
					</ui:include>

					<aon:if test="#{companyCollections.currentUserWorkPlacesCount > 1}">
						<aon:outputLabel for="CustomerFee_workPlace" value="#{bundle.purchase_workplace}" />
						<aon:selectOneMenu id="CustomerFee_workPlace" 
							value="#{feeAssignment.fee.workPlace}" >
							<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						</aon:selectOneMenu>
					</aon:if>

					<aon:outputLabel for="FeeAssignment_assignToInvoicingGroup" value="Asignar al Grupo de Facturacion" />
					<aon:panelGrid columns="3" columnClasses="aon-width-150,aon-width-60,aon-width-auto">
						<aon:selectBooleanCheckbox id="FeeAssignment_assignToInvoicingGroup"
							value="#{feeAssignment.assignToInvoicingGroup}" />

						<aon:if test="#{aonRole.confidentiality}">
							<aon:outputLabel for="CustomerFee_securityLevel" value="#{bundle.aon_confidential}"
								styleClass="aon-margin-right aon-bold" />
							<aon:selectBooleanCheckbox id="CustomerFee_securityLevel"
								value="#{feeAssignment.fee.confidential}" />
						</aon:if>
					</aon:panelGrid>

				</aon:panelGrid>

				<aon:div styleClass="aon-toolbar aon-margin-top"
					rendered="#{feeAssignment.model.rowCount > 0}">
					<aon:commandButton id="feeAssignment-checkAll"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						title="#{bundle.aon_check_all}"
						actionListener="#{feeAssignment.checkAll}"
						reRender="CustomerListDiv,aonToolbar" ajaxSingle="true" />	
					<aon:commandButton id="feeAssignment-checkNone"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						title="#{bundle.aon_uncheck_all}"
						actionListener="#{feeAssignment.checkNone}"
						reRender="CustomerListDiv,aonToolbar" ajaxSingle="true" />	
				</aon:div>

				<aon:div id="CustomerListDiv">					
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{feeAssignment}" />
						<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
						<ui:param name="skipSelectButton" value="#{true}" />
						<ui:define name="columns">

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:selectBooleanCheckbox id="Included_Row_checked"
									value="#{feeAssignment.rowChecked}"
									ajaxSingle="true" reRender="aonToolbar" />
							</aon:column>

							<ui:include	src="/com/code/aon/ui/customer/facelet/customer/listExtended.xhtml" />

						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
