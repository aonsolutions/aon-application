<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="posQuantityContainer">
		<aon:panel>
			<f:facet name="header">
				<aon:outputLabel for="InvoiceDetail_quantity"
					style="text-transform:uppercase;"
					value="#{bundle.aon_quantity}" />
			</f:facet>

			<aon:panelGrid styleClass="aon-width-all" columns="3"
				columnClasses="aon-text-left aon-width-100,aon-text-center aon-width-100,aon-text-right aon-width-auto">

				<aon:commandButton id="PosDetail-minusQuantity" immediate="true"
					styleClass="aon-medium-commandButton aon-width-100"
					value="#{bundle.aon_less2}"
					actionListener="#{detailController.onMinusQuantity}"
					reRender="InvoiceDetail_quantity" ajaxSingle="true" />
				<aon:inputText id="InvoiceDetail_quantity"
					value="#{detailController.to.quantity}" 
					required="true" size="5" maxlength="6"
					valueChangeListener="#{detailController.onQuantityChanged}"
					reRender="InvoiceDetail_discount,InvoiceDetail_price" ajaxSingle="true"
					focus="InvoiceDetail_discount" />
				<aon:commandButton id="PosDetail-plusQuantity" immediate="true"
					styleClass="aon-medium-commandButton aon-width-100"
					value="#{bundle.aon_more2}"
					actionListener="#{detailController.onPlusQuantity}"
					reRender="InvoiceDetail_quantity" ajaxSingle="true" />

			</aon:panelGrid>

		</aon:panel>
	</aon:div>
</ui:composition>
