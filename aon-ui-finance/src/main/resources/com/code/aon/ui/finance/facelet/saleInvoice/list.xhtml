<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="saleInvoiceForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_sale_invoice_management_module}" />
				<ui:param name="controller" value="#{saleInvoice}" />
<!-- 
					<t:commandButton id="salesInvoiceList" value="#{bundle.aon_listing}"
						forceId="#{true}"
						onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
						accesskey="#{bundle.aon_key_print}" />
 -->
			</ui:include>

			<aon:div id="saleInvoiceData" styleClass="aon-scroll-area">
				<aon:dataTable id="saleInvoiceDataList" value="#{saleInvoice.model}"
					rows="20" var="to" rendered="#{saleInvoice.model.rowCount > 0}">

					<aon:rowSelector action="saleInvoice_form"
						actionListener="#{saleInvoice.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
						</f:facet>
						<aon:outputText value="#{to.series} / #{to.number}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<h:outputText value="#{customerBundle.customer_customer}" />
						</f:facet>
						<aon:outputText value="#{to.registryName}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.issueDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}" />
					</aon:column>
<!-- 
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_total}" />
						</f:facet>
						<aon:outputText value="#{saleInvoice.invoiceTotalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
 -->
				</aon:dataTable>
				<aon:dataScroller2 for="saleInvoiceDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
