<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="saleInvoiceForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_sale_invoice_management_module}" />
				<ui:param name="controller" value="#{saleInvoice}" />

				<ui:define name="additionalToolbarContent">
					<h:commandLink value="&#160;" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="saleInvoiceList" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>							
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}" rendered="#{!fbatch.new}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="saleInvoiceList" />
					</h:commandLink>
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{saleInvoice}" />
					<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn, aon-editDataTable-numberColumn" />
					<ui:define name="columns">
						<aon:column>
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.issueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<h:outputText value="#{customerBundle.customer_customer}" />
							</f:facet>
							<aon:outputText value="#{to.registryName}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.registryDocument}" />
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{configBundle.config_pay_method}" />
							</f:facet>
							<aon:outputText value="#{saleInvoice.payMethod}">
								<aon:abbreviateConverter maxWidth="15" />
							</aon:outputText>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{financeBundle.finance_checking_finance_status_abbrv}" />
							</f:facet>
							<aon:outputText value="#{saleInvoice.financeStatus}" />
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{saleInvoice.invoiceTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>					
					</ui:define>
				</ui:decorate>			

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
