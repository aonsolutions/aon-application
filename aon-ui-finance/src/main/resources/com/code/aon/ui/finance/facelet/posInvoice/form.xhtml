<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	   <a4j:region>
	        <h:form>
	            <a4j:poll status="aonStatus" interval="300000" />
	        </h:form>
	    </a4j:region>

		<aon:form id="posInvoiceForm">
			<aon:div id="menuExt"> 
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{bundle.finance_pos_invoice_management_module}" />
					<ui:param name="controller" value="#{posInvoice}" />
					<ui:param name="skipFocusFirst" value="#{true}" />
					<ui:param name="skipResetButton" value="#{true}" />
					<ui:param name="skipSaveButton" value="#{true}" />
					<ui:param name="skipRemoveButton" value="#{true}" />
					<ui:param name="skipCancelButton" value="#{true}" />
					<ui:param name="skipSearchButton" value="#{true}" />
					<ui:param name="skipBackButton" value="#{true}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:outputText value="#{posInvoice.to.posShift.pos.workPlace.description}" styleClass="aon-margin-left aon-bold" />
						<aon:outputText value="-" styleClass="aon-margin-left aon-margin-right aon-bold" />
						<aon:outputText value="#{posInvoice.to.posShift.pos.name}" styleClass="aon-margin-right aon-bold" />

						<aon:commandButton id="invoiceRegistryData" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-edit-add-user"
							value="#{bundle.aon_customer}"
							ajaxSingle="true">
							<f:setPropertyActionListener target="#{posInvoice.showRegistryDataWindow}"
								value="#{true}" />
						</aon:commandButton>
					</ui:define>
				</ui:decorate>
			</aon:div>

			<rich:jQuery timing="onload"
				selector="#Item_id" query="focus()" />			

			<aon:div styleClass="aon-padding">
				<aon:panelGrid styleClass="aon-width-all" columns="2" cellspacing="2"
					columnClasses="aon-panelGrid-even aon-vertical-align-top aon-width-auto,
						aon-panelGrid-even aon-vertical-align-top aon-width-350">
					<aon:panelGroup>

						<aon:panelGrid id="posInvoiceDatatable" columns="5"
							styleClass="aon-width-all aon-margin-bottom"
							columnClasses="aon-italic aon-width-10,
								aon-italic aon-width-70,
								aon-message-big2 aon-width-auto,
								aon-italic aon-width-80,
								aon-message-big2 aon-width-160">

							<aon:if test="#{posInvoice.nevv}">
								<aon:outputText value="&#160;" />
								<aon:outputText value="&#160;" />
								<aon:outputText styleClass="aon-label-error"
									value="#{bundle.finance_pos_no_current_invoice}" />
							</aon:if>

							<aon:if test="#{!posInvoice.nevv}">
								<aon:outputText value="&#160;" />
								<aon:outputLabel value="#{bundle.aon_invoice_number}:" />
								<aon:panelGrid styleClass="aon-width-all" columns="2"
									columnClasses="aon-width-200,aon-width-auto">
									<aon:outputText value="#{posInvoice.to.referenceCode}" />
								</aon:panelGrid>

								<aon:outputLabel value="#{bundle.aon_date_time}:" />
								<aon:outputText value="#{(posInvoice.to.modificationDate != null) ? posInvoice.to.modificationDate : posInvoice.to.creationDate}">
									<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>

								<aon:if test="#{posInvoice.to.registryName != posInvoice.defaultCustomer.registry.name}">
									<aon:outputText value="&#160;" />
									<aon:outputLabel value="#{bundle.aon_customer}:" />
									<aon:div>
										<aon:outputText value="#{posInvoice.to.registryName}">
											<aon:abbreviateConverter maxWidth="30" />
										</aon:outputText>
										<rich:toolTip>
											<aon:outputText value="#{posInvoice.to.registryName}" />
										</rich:toolTip>
										<aon:commandLink id="invoiceAddressButton" immediate="true"
											value="&#160;" title="#{bundle.aon_edit} #{bundle.aon_address}"
											styleClass="aon-icon-edit-add-address" style="margin-left: 5px; padding-right: 12px;"
											actionListener="#{posInvoice.onInvoiceAddressShow}"
											reRender="showInvoiceAddressWindow">
											<f:setPropertyActionListener target="#{posInvoice.showInvoiceAddressWindow}"
												value="#{true}" />								
										</aon:commandLink>
									</aon:div>
									<aon:outputLabel value="#{bundle.aon_company_document}:" />
									<aon:outputText value="#{posInvoice.to.registryDocument}" />
								</aon:if>
<!-- 
								<aon:outputLabel value="#{bundle.finance_pos_seller_label}:" />
								<aon:div>
									<aon:if test="#{posInvoice.to.seller.registry.id != null}">
										<aon:outputText value="#{posInvoice.to.seller.registry.fullName}">
											<aon:abbreviateConverter maxWidth="20" />
										</aon:outputText>
										<rich:toolTip>
											<aon:outputText value="#{posInvoice.to.seller.registry.fullName}" />
										</rich:toolTip>
									</aon:if>
									<aon:commandLink id="invoiceSellerData" immediate="true"
										value="&#160;" title="#{bundle.aon_edit}"
										styleClass="aon-icon-edit-add-user" style="margin-left: 5px; padding-right: 12px;"
										ajaxSingle="true">
										<f:setPropertyActionListener target="#{posInvoice.showSellerDataWindow}"
											value="#{true}" />
									</aon:commandLink>
								</aon:div>
 -->

								<aon:if test="#{posInvoice.to.registryAddress.id != null or posInvoiceAddress.to.id != null}">
									<aon:outputText value="&#160;" />
									<aon:outputLabel value="#{bundle.aon_address}:" />
									<aon:div styleClass="aon-nowrap">
										<aon:outputText value="#{posInvoice.address}">
											<aon:abbreviateConverter maxWidth="30" />
										</aon:outputText>
										<rich:toolTip>
											<aon:outputText value="#{posInvoice.address}" />
										</rich:toolTip>
									</aon:div>
									<aon:outputLabel value="#{bundle.aon_city}:" />
									<aon:div styleClass="aon-nowrap">
										<aon:outputText value="#{posInvoice.location}">
											<aon:abbreviateConverter maxWidth="20" />
										</aon:outputText>
										<rich:toolTip>
											<aon:outputText value="#{posInvoice.location}" />
										</rich:toolTip>
									</aon:div>
								</aon:if>
							</aon:if>

						</aon:panelGrid>

						<aon:div id="PosInvoiceDetailWizard" styleClass="aon-margin-bottom">
							<aon:if test="#{posInvoice.posShift.pos.standard}">
								<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formWizardStandard.xhtml">
									<ui:param name="invoiceController" value="#{posInvoice}" />
									<ui:param name="detailController" value="#{posInvoiceDetail}" />
									<ui:param name="financeController" value="#{posInvoiceFinance}" />
								</ui:include>
							</aon:if>
							<aon:if test="#{posInvoice.posShift.pos.touchScreen}">
								<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formWizardTouchscreen.xhtml">
									<ui:param name="invoiceController" value="#{posInvoice}" />
									<ui:param name="detailController" value="#{posInvoiceDetail}" />
									<ui:param name="financeController" value="#{posInvoiceFinance}" />
								</ui:include>
							</aon:if>
 						</aon:div>

						<aon:if test="#{!posInvoice.nevv and posInvoiceDetail.rowCount > 0}">
							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formDetail.xhtml">
								<ui:param name="invoiceController" value="#{posInvoice}" />
								<ui:param name="detailController" value="#{posInvoiceDetail}" />
								<ui:param name="financeController" value="#{posInvoiceFinance}" />
							</ui:include>
						</aon:if>

						<aon:if test="#{posInvoice.suspendedInvoiceCount > 0}">
							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formSuspended.xhtml">
								<ui:param name="invoiceController" value="#{posInvoice}" />
							</ui:include>
						</aon:if>

					</aon:panelGroup>

					<aon:panelGroup>

						<aon:panelGrid styleClass="aon-width-all aon-margin-bottom" columns="3" cellspacing="5"
							columnClasses="aon-vertical-align-top,aon-vertical-align-top,aon-vertical-align-top">

							<aon:commandButton id="newTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="1 #{bundle.aon_reset}"
								title="Alt+{Mayús}+1"
								disabled="#{!posInvoice.nevv and !posInvoice.ticketFinished}"
								actionListener="#{posInvoice.onNewTicket}"
								reRender="posInvoiceForm" ajaxSingle="true"
								accesskey="1" />
							<aon:commandButton id="finishTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="2 #{bundle.finance_to_charge}"
								title="Alt+{Mayús}+2"
								disabled="#{posInvoice.nevv or posInvoiceDetail.rowCount == 0 or posInvoice.ticketFinished}"
								actionListener="#{posInvoice.onShowFinishTicket}"
								reRender="showFinishTicketWindow" ajaxSingle="true"
								accesskey="2">
								<f:setPropertyActionListener target="#{posInvoice.showFinishTicketWindow}"
									value="#{true}" />
							</aon:commandButton>				
							<aon:htmlCommandLink id="printTicketPDF" immediate="true" target="_new"
								styleClass="aon-big-commandButton aon-width-110"
								value="3 #{bundle.aon_report}"
								title="Alt+{Mayús}+3"
								disabled="#{posInvoice.nevv or !posInvoice.ticketFinished}"
								actionListener="#{posInvoiceParams.onInit}" 
								action="#{report.onExecute}" 
								accesskey="3">
								<f:param name="reportKey" value="posInvoice" /> 
							</aon:htmlCommandLink>
							<aon:commandButton id="parkTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="4 #{bundle.finance_pos_suspend}"
								title="Alt+{Mayús}+4"
								disabled="#{posInvoice.nevv or posInvoiceDetail.rowCount == 0 or posInvoice.ticketFinished}"
								actionListener="#{posInvoice.onSuspendTicket}"
								reRender="posInvoiceForm" ajaxSingle="true"
								accesskey="4" />
							<aon:commandButton id="recoverTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="5 #{bundle.finance_pos_recover}"
								title="Alt+{Mayús}+5"
								disabled="#{!posInvoice.nevv and !posInvoice.ticketFinished}"
								actionListener="#{posInvoice.onShowRecoverTicket}"
								reRender="showRecoverTicketWindow" ajaxSingle="true"
								accesskey="5">
								<f:setPropertyActionListener target="#{posInvoice.showRecoverTicketWindow}"
									value="#{true}" />
							</aon:commandButton>				
							<aon:htmlCommandLink id="printGiftReceiptPDF" immediate="true" target="_new"
								styleClass="aon-big-commandButton aon-width-110"
								value="6 #{bundle.finance_pos_gift_receipt}"
								title="Alt+{Mayús}+6"
								disabled="#{posInvoice.nevv or !posInvoice.ticketFinished}"
								actionListener="#{posInvoiceParams.onInit}" 
								action="#{report.onExecute}" 
								accesskey="6">
								<f:param name="reportKey" value="giftReceipt" /> 
							</aon:htmlCommandLink>  	
							<aon:confirmButton id="cancelTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="7 #{bundle.aon_cancel}"
								title="Alt+{Mayús}+7"
								disabled="#{posInvoice.nevv or posInvoiceFinance.rowCount > 0 or (posInvoiceDetail.rowCount > 0 and posInvoice.to.totalQuantity == 0)}"
								confirmTitle="#{bundle.aon_confirm_title}"
								confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{posInvoice.onCancelTicket}"
								reRender="posInvoiceForm" ajaxSingle="true"
								accesskey="7" />
							<aon:confirmButton id="cancelLine" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="8 #{bundle.finance_pos_cancel_line}"
								title="Alt+{Mayús}+8"
								disabled="#{posInvoice.nevv or posInvoiceFinance.rowCount > 0 or posInvoice.to.totalQuantity == 0}"
								confirmTitle="#{bundle.aon_confirm_title}"
								confirmMessage="#{bundle.finance_pos_cancel_line_confirm}"
								confirmActionListener="#{posInvoice.onCancelLine}"
								reRender="posInvoiceForm" ajaxSingle="true"
								accesskey="8" />
							<aon:confirmButton id="returnTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-110"
								value="9 #{bundle.aon_return}"
								title="Alt+{Mayús}+9"
								disabled="#{posInvoiceDetail.checkedCount == 0}"
								confirmTitle="#{bundle.aon_confirm_title}"
								confirmMessage="#{bundle.finance_return_confirm}"
								confirmActionListener="#{posInvoice.onReturnTicket}"
								reRender="posInvoiceForm" ajaxSingle="true"
								accesskey="9" />

						</aon:panelGrid>

						<aon:if test="#{posInvoice.posShift.pos.touchScreen}">
							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formQuantity.xhtml">
								<ui:param name="invoiceController" value="#{posInvoice}" />
								<ui:param name="detailController" value="#{posInvoiceDetail}" />
							</ui:include>
						</aon:if>

						<aon:if test="#{!posInvoice.nevv and posInvoiceDetail.rowCount > 0}">
							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formTotal.xhtml">
								<ui:param name="invoiceController" value="#{posInvoice}" />
							</ui:include>
						</aon:if>

						<aon:if test="#{!posInvoice.nevv and posInvoiceFinance.rowCount > 0}">
							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formFinance.xhtml">
								<ui:param name="financeController" value="#{posInvoiceFinance}" />
							</ui:include>
						</aon:if>

					</aon:panelGroup>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalRegistryData.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/seller/facelet/seller/modalSeller.xhtml">
			<ui:param name="controller" value="#{posInvoice}" />
			<ui:param name="parentReRender" value="posInvoiceForm" />
			<aon:methodParam name="parentActionListener" value="#{posInvoice.addInvoiceSeller}" type="actionListener" />
			<ui:param name="parentValue" value="#{posInvoice.to.seller}" />
			<ui:param name="sellerLabel" value="#{bundle.aon_module_commercial}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAddress.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
			<ui:param name="invoiceAddress" value="#{posInvoiceAddress}" />
			<ui:param name="addressReRender" value="posInvoiceDatatable" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/product/facelet/item/modalInfo.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/posInvoice/modalFinishTicket.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
			<ui:param name="financeController" value="#{posInvoiceFinance}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/posInvoice/modalRecoverTicket.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
		</ui:include>			
	</ui:define>
</ui:composition>
