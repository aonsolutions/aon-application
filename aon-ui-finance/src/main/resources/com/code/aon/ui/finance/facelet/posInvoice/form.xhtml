<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posInvoiceForm">
			<aon:div id="menuExt"> 
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{financeBundle.finance_pos_invoice_management_module}" />
					<ui:param name="controller" value="#{posInvoice}" />
					<ui:param name="skipFocusFirst" value="#{true}" />
					<ui:param name="skipResetButton" value="#{true}" />
					<ui:param name="skipSaveButton" value="#{true}" />
					<ui:param name="skipRemoveButton" value="#{true}" />
					<ui:param name="skipCancelButton" value="#{true}" />
					<ui:param name="skipSearchButton" value="#{true}" />
					<ui:param name="skipBackButton" value="#{true}" />
				</ui:decorate>
			</aon:div>
			
			<rich:jQuery timing="onload"
				selector="#Item_id" query="focus()" />			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="posInvoiceDatatable" columns="3"
					styleClass="aon-width-all aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-even aon-width-350">

					<aon:outputLabel value="#{financeBundle.finance_invoice_number}" />
					<aon:panelGrid columns="2" columnClasses="aon-width-450, aon-width-auto">
						<c:if test="#{!posInvoice.new}">
							<aon:div>
								<aon:outputText styleClass="aon-bold aon-margin-right"
									value="#{posInvoice.to.referenceCode}" />
								<aon:outputText id="Invoice_modificationDate" 
									styleClass="aon-bold aon-margin-left"
									value="#{(posInvoice.to.modificationDate != null) ? posInvoice.to.modificationDate : posInvoice.to.creationDate}">
									<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:div>
						</c:if>
						<c:if test="#{posInvoice.new}">
							<c:if test="#{posInvoice.to.pos.id == null}">
								<aon:div>
									<aon:outputText styleClass="aon-label-error"
										value="#{financeBundle.finance_pos_no_pos_selected}" />
								</aon:div>
							</c:if>
							<c:if test="#{posInvoice.to.pos.id != null}">
								<aon:div>
									<aon:outputText styleClass="aon-label-error"
										value="#{financeBundle.finance_pos_no_current_invoice}" />
								</aon:div>
							</c:if>
						</c:if>

						<c:if test="#{posInvoice.to.pos.id == null}">
							<aon:div>
								<aon:commandButton id="selectPos" immediate="true"
									styleClass="aon-commandButton"
									value="0 #{financeBundle.finance_pos_selection}" 
									title="Alt+{Mayús}+0"
									reRender="showPosSelectionWindow"
									accesskey="0">
									<f:setPropertyActionListener target="#{posInvoice.showPosSelectionWindow}"
										value="#{true}" />
								</aon:commandButton>
							</aon:div>
						</c:if>
						<c:if test="#{posInvoice.to.pos.id != null}">
							<aon:div>
								<aon:outputText styleClass="aon-bold"
									value="#{posInvoice.to.pos.name}" />
							</aon:div>
						</c:if>
					</aon:panelGrid>
					<aon:div style="text-align: center;">
						<aon:commandButton id="newTicket" immediate="true"
							styleClass="aon-commandButton" style="width: 105px; text-transform:uppercase; text-align: center; padding: 0px !important;"
							value="1 #{bundle.aon_reset}"
							title="Alt+{Mayús}+1"
							disabled="#{posInvoice.to.pos.id == null or (!posInvoice.new and posInvoice.pendingAmount != 0)}"
							actionListener="#{posInvoice.onNewTicket}"
							reRender="posInvoiceForm"
							accesskey="1" />
						<aon:commandButton id="finishTicket" immediate="true"
							styleClass="aon-commandButton" style="width: 105px; text-transform:uppercase; text-align: center; padding: 0px !important;"
							value="2 #{financeBundle.finance_to_charge}"
							title="Alt+{Mayús}+2"
							disabled="#{posInvoice.to.pos.id == null or posInvoice.new or posInvoice.pendingAmount == 0}"
							actionListener="#{posInvoice.onShowFinishTicket}"
							reRender="showFinishTicketWindow"
							accesskey="2">
							<f:setPropertyActionListener target="#{posInvoice.showFinishTicketWindow}"
								value="#{true}" />
						</aon:commandButton>				
						<aon:htmlCommandLink id="printTicket" immediate="true" target="_new"
							styleClass="aon-commandButton" style="width: 105px; text-transform:uppercase; text-align: center; padding: 0px !important; display: inline-block;"
							value="3 #{bundle.aon_report}"
							title="Alt+{Mayús}+3"
							disabled="#{posInvoice.to.pos.id == null or posInvoice.new or posInvoice.toInvoiceTotalPrice == 0 or posInvoice.pendingAmount != 0}"
							actionListener="#{posInvoiceParams.onInit}" 
							action="#{report.onExecute}" 
							accesskey="3">
							<f:param name="reportKey" value="posInvoice" /> 
						</aon:htmlCommandLink>  	
					</aon:div>

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{posInvoice.to.registry}" />
						<ui:param name="lookupForRegistry" value="#{true}" />
						<ui:param name="lookupInputNameValue" value="#{posInvoice.to.registryName}" />
						<ui:param name="lookupDisabled" value="#{posInvoice.registryReadOnly or posInvoiceFinance.model.rowCount > 0}" />
						<ui:param name="lookupInputNameDisabled" value="#{posInvoice.to.registry != null and posInvoice.to.registry.id != null}" />
						<ui:param name="idRequired" value="#{true}" />						
						<ui:param name="skipGoToButton" value="#{true}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<ui:param name="skipSuggestText" 
							value="#{posInvoice.to.registry != null and posInvoice.to.registry.id != null}" />
						<aon:methodParam name="lookupChangeListener" 
							value="#{posInvoice.onCustomerChanged}" type="lookupChangeListener" />
					</ui:include>
					<aon:div style="text-align: center;">
						<aon:commandButton id="parkTicket" immediate="true"
							styleClass="aon-commandButton" style="width: 105px; text-transform:uppercase; text-align: center; padding: 0px !important;"
							value="4 #{financeBundle.finance_pos_suspend}"
							title="Alt+{Mayús}+4"
							disabled="#{posInvoice.to.pos.id == null or posInvoice.new or posInvoice.pendingAmount == 0}"
							actionListener="#{posInvoice.onNewTicket}"
							reRender="posInvoiceForm"
							accesskey="4" />
<!-- 
							disabled="#{posInvoice.to.pos.id == null or posInvoice.new or posInvoice.pendingAmount == 0}"
 -->

						<aon:commandButton id="recoverTicket" immediate="true"
							styleClass="aon-commandButton" style="width: 105px; text-transform:uppercase; text-align: center; padding: 0px !important;"
							value="5 #{financeBundle.finance_pos_recover}"
							title="Alt+{Mayús}+5"
							disabled="true"
							reRender="showRecoverTicketWindow"
							accesskey="5">
							<f:setPropertyActionListener target="#{posInvoice.showRecoverTicketWindow}"
								value="#{true}" />
						</aon:commandButton>				
						<aon:htmlCommandLink id="printGiftReceipt" immediate="true" target="_new"
							styleClass="aon-commandButton" style="width: 105px; text-transform:uppercase; text-align: center; padding: 0px !important; display: inline-block;"
							value="6 #{financeBundle.finance_pos_gift_receipt}"
							title="Alt+{Mayús}+6"
							disabled="#{posInvoice.to.pos.id == null or posInvoice.new or posInvoice.toInvoiceTotalPrice == 0 or posInvoice.pendingAmount != 0}"
							actionListener="#{posInvoiceParams.onInit}" 
							action="#{report.onExecute}" 
							accesskey="6">
							<f:param name="reportKey" value="posInvoice" /> 
						</aon:htmlCommandLink>  	
					</aon:div>

					<aon:outputLabel for="Seller_id" value="#{financeBundle.finance_pos_seller_label}" />
					<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml">
						<ui:param name="lookupTo" value="#{posInvoice.to.seller}" />
						<ui:param name="lookupDisabled" value="#{posInvoice.registryReadOnly or posInvoiceFinance.model.rowCount > 0}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="skipGoToButton" value="#{true}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<aon:methodParam name="lookupChangeListener"
							value="#{posInvoice.onSellerChanged}" type="lookupChangeListener" />
					</ui:include>
					<aon:div style="text-align: center;">
						<aon:confirmButton id="cancelTicket" immediate="true"
							styleClass="aon-commandButton" style="width: 105px; text-transform:uppercase; text-align: center; padding: 0px !important;"
							value="7 #{bundle.aon_cancel}"
							title="Alt+{Mayús}+7"
							disabled="#{posInvoice.to.pos.id == null or posInvoice.new or posInvoice.pendingAmount == 0}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{posInvoice.onCancelTicket}"
							reRender="posInvoiceForm"
							accesskey="7" />
						<aon:confirmButton id="cancelLine" immediate="true"
							styleClass="aon-commandButton" style="width: 105px; text-transform:uppercase; text-align: center; padding: 0px !important;"
							value="8 #{financeBundle.finance_pos_cancel_line}"
							title="Alt+{Mayús}+8"
							disabled="#{posInvoice.to.pos.id == null or posInvoice.new or posInvoice.pendingAmount == 0}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{financeBundle.finance_pos_cancel_line_confirm}"
							confirmActionListener="#{posInvoice.onCancelLine}"
							reRender="posInvoiceForm"
							accesskey="8" />
						<aon:commandButton id="returnTicket" immediate="true"
							styleClass="aon-commandButton" style="width: 105px; text-transform:uppercase; text-align: center; padding: 0px !important;"
							value="9 #{financeBundle.finance_return}"
							title="Alt+{Mayús}+9"
							disabled="true"
							accesskey="9" />
					</aon:div>
				</aon:panelGrid>

				<aon:div id="PosInvoiceDetailWizard">
					<aon:panelGrid id="posInvoiceDetailDataTable" columns="5"
						styleClass="aon-width-all aon-margin-bottom aon-text-center"
						columnClasses="aon-panelGrid-search aon-width-auto,
							aon-panelGrid-search aon-width-140,
							aon-panelGrid-search aon-width-130,
							aon-panelGrid-search aon-width-110,
							aon-panelGrid-search aon-padding-right aon-width-110">

						<aon:outputLabel for="Item_id" value="#{productBundle.product_item}" />

						<aon:outputLabel for="InvoiceDetail_quantity" value="#{bundle.aon_quantity}" />

						<aon:outputLabel for="InvoiceDetail_discount" value="% #{bundle.aon_discount}" />

						<aon:outputLabel for="InvoiceDetail_price" value="#{bundle.aon_price}" />

						<aon:outputLabel value="&#160;" />

						<aon:div>
							<ui:include src="/com/code/aon/ui/product/facelet/item/lookupDetail.xhtml">
								<ui:param name="lookupTo" value="#{posInvoiceDetail.to.item}" />
								<ui:param name="idRequired" value="#{true}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="skipGoToButton" value="#{true}" />
								<ui:param name="skipNewButton" value="#{true}" />
								<ui:param name="lookupInputOnFocus" value="saveTicketDetail" />
								<ui:param name="lookupReRender"	value="PosInvoiceDetailWizard" />
								<aon:methodParam name="lookupChangeListener"
									value="#{posInvoiceDetail.onItemChanged}" type="lookupChangeListener" />
							</ui:include>
							<c:if test="#{aonConfiguration.bean.product.showStock}">
								<aon:commandButton 
									id="PosDetail-itemInfo" immediate="true" value="&#160;"
									title="#{productBundle.product_info}"
									rendered="#{posInvoiceDetail.to.item.id != null and posInvoiceDetail.to.item.product.inventoriable}"
									styleClass="aon-icon aon-icon-edit-end aon-icon-info"
									actionListener="#{itemInfo.onShowPanel}"
									reRender="itemInfoContainer">
									<aon:set var="#{itemInfo.stockVisible}" value="#{true}" />
									<aon:set var="#{itemInfo.alternativesVisible}" value="#{true}" />
									<aon:set var="#{itemInfo.item}" value="#{posInvoiceDetail.to.item}" /> 
									<aon:set var="#{itemInfo.warehouse}" value="#{null}" /> 
									<aon:set var="#{itemInfo.rowStock}" value="#{posInvoiceDetail.rowStock}" /> 
									<aon:set var="#{itemInfo.componentId}" value="Item_id" />
									<aon:set var="#{itemInfo.alternativeMethod}" value="posInvoiceDetail.onItemChanged" />
								</aon:commandButton>															
							</c:if>
						</aon:div>

						<aon:div>
							<aon:commandButton
								id="PosDetail-minusQuantity" immediate="true"
								styleClass="aon-editDataTable-button aon-margin-left aon-vertical-align-middle aon-search-minus"
								actionListener="#{posInvoiceDetail.onMinusQuantity}"
								reRender="InvoiceDetail_quantity" ajaxSingle="true" />
							<aon:inputText id="InvoiceDetail_quantity"
								value="#{posInvoiceDetail.to.quantity}" 
								required="true" size="5" maxlength="5"
								valueChangeListener="#{posInvoiceDetail.onQuantityChanged}"
								reRender="InvoiceDetail_discount,InvoiceDetail_price" ajaxSingle="true"
								focus="InvoiceDetail_discount" />
							<aon:commandButton
								id="PosDetail-plusQuantity" immediate="true"
								styleClass="aon-editDataTable-button aon-margin-left aon-vertical-align-middle aon-search-add"
								actionListener="#{posInvoiceDetail.onPlusQuantity}"
								reRender="InvoiceDetail_quantity" ajaxSingle="true" />
						</aon:div>

						<aon:inputText id="InvoiceDetail_discount"
							value="#{posInvoiceDetail.to.discountExpression.discountExpr}"
							required="true" size="5" maxlength="5"
							valueChangeListener="#{posInvoiceDetail.onDiscountChanged}"
							ajaxSingle="true" />

						<aon:outputText id="InvoiceDetail_price"
							styleClass="aon-bold"
							value="#{posInvoiceDetail.to.salesPrice}"
							required="true">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>

						<aon:div id="InvoiceDetail_buttons">
							<aon:commandButton id="saveTicketDetail"
								styleClass="aon-commandButton" style="width: 100px; text-transform:uppercase; text-align: center; padding: 0px !important;"
								value="#{bundle.aon_key_save_line_description}"
								title="#{bundle.aon_key_save_accelerator}"
								rendered="#{!posInvoice.new and posInvoiceDetail.to.item.id != null}"
								actionListener="#{posInvoiceDetail.onAccept}"
								accesskey="#{bundle.aon_key_save}" />
						</aon:div>
					</aon:panelGrid>
				</aon:div>

				<c:if test="#{posInvoiceDetail.model.rowCount > 0}">
					<aon:panelGrid columns="2" 
						styleClass="aon-width-all"
						columnClasses="aon-width-auto aon-padding-right aon-vertical-align-top, 
							aon-width-350 aon-padding-left aon-vertical-align-top">

						<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formDetail.xhtml">
							<ui:param name="detailController" value="#{posInvoiceDetail}" />
						</ui:include>

						<aon:div>
							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formTotal.xhtml">
								<ui:param name="invoiceController" value="#{posInvoice}" />
							</ui:include>

							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formFinance.xhtml">
								<ui:param name="financeController" value="#{posInvoiceFinance}" />
							</ui:include>
						</aon:div>
					</aon:panelGrid>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{itemDetailLookup}" />
		<aon:lookupButtonPopup lookup="#{productLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/posInvoice/modalPosSelection.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/product/facelet/item/modalInfo.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/posInvoice/modalFinishTicket.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
			<ui:param name="financeController" value="#{posInvoiceFinance}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/posInvoice/modalRecoverTicket.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
		</ui:include>
	</ui:define>
</ui:composition>
