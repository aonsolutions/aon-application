<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showRemarksWindow">
		<c:if test="#{controller.showRemarksWindow}">
			<rich:modalPanel id="remarksModalPanel"
				minWidth="740" minHeight="200" zindex="90"
				showWhenRendered="#{controller.showRemarksWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_remark}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showRemarksWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showRemarksWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="remarksForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="remarks-accept"
											value="#{bundle.aon_accept}"
											actionListener="#{controller.accept}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<rich:componentControl for="remarksModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showRemarksWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="remarks-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showRemarksWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{controller.showRemarksWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">
										
											<aon:div>
												<aon:outputLabel for="Finance_remarks"
													value="#{bundle.aon_remark}" />
												<aon:div>
													<aon:outputLabel styleClass="aon-form-date-label"
														value="(#{bundle.aon_remark_description})" />
												</aon:div>
											</aon:div>
											<aon:inputTextarea id="Finance_remarks" cols="80" rows="4"
												value="#{controller.to.remarks}" />
											
										</aon:panelGrid>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
