<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="invoiceDetailContainer" styleClass="aon-padding-top">
		<aon:if test="#{!invoiceController.nevv}">
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{bundle.finance_invoice_lines}" />
				</f:facet>
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="dataTableId" value="invoiceDetails" />
					<ui:param name="controller" value="#{detailController}" />
					<ui:param name="showNote" value="false" />
					<ui:param name="showDataScroller" value="false" />
					<ui:param name="skipResetButton" value="#{invoiceController.readOnly}" />
					<ui:param name="skipLineEdition" value="#{true}" />
					<ui:param name="rowSelectorReRender" value="menuExt" />
					<ui:param name="resetButtonReRender" value="menuExt" />
					<ui:param name="newCancelButtonReRender" value="menuExt" />
					<ui:param name="cancelButtonReRender" value="menuExt" />
					<ui:param name="newSaveButtonReRender" value="menuExt,Invoice_total,financeContainer" />
					<ui:param name="saveButtonReRender" value="menuExt,Invoice_total,financeContainer" />
					<ui:param name="removeButtonReRender" value="menuExt,Invoice_total,financeContainer" />
					<ui:param name="focusOnAdd" value="Item_id-New" />
					<ui:param name="focusOnSelect" value="Item_id" />
					<ui:define name="beginFormListContent">
						<aon:commandLink id="#{dataTableId}-selectButton"
							styleClass="aon-table-row-link" value="&#160;"
							immediate="true" ajaxSingle="true" requestDelay="100"
							rendered="#{!invoiceController.readOnly and detailController.editable}"
							actionListener="#{detailController.onSelect}"
							reRender="menuExt"
							onkeyup="#{dataTableId}KeyUp(this)"
							onfocus="#{dataTableId}SelectRow(this)"
							onblur="#{dataTableId}DeselectRow(this)"
							focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
						</aon:commandLink>
					</ui:define>
					
					<ui:define name="endFormListContent">
						<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
							<ui:param name="auditableTO" value="#{to}" />
						</ui:include>
					</ui:define>					

					<ui:define name="columns">
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_line" value="#{bundle.aon_line}" />
							</f:facet>
							<aon:outputText value="#{to.line}"
								rendered="#{formList}" />
							<aon:inputText id="InvoiceDetail_line" 
								value="#{controller.to.line}" rendered="#{formEdit}"
								required="true" size="1" maxlength="3" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_line-New" 
									value="#{controller.to.line}" rendered="#{formNew}"
									required="true" size="1" maxlength="3" />
							</f:facet>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel for="Item_id" value="#{bundle.aon_concept}" />
							</f:facet>
							<aon:outputText value="#{to.description}" 
								rendered="#{formList}">
								<aon:abbreviateConverter maxWidth="64" />
							</aon:outputText>
							<ui:include src="/com/code/aon/ui/product/facelet/expenseItem/lookup.xhtml">
								<ui:param name="lookupTo" value="#{controller.to.item}" />
								<ui:param name="idRequired" value="#{true}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="skipSuggestText" value="#{controller.to.item != null and controller.to.item.id != null}" />
								<ui:param name="lookupInputOnFocus" value="InvoiceDetail_description" />
								<ui:param name="lookupRendered" value="#{formEdit}" />
								<ui:param name="lookupReRender"	
									value="invoiceDetailItemEdit,InvoiceDetail_vatPercent,InvoiceDetail_vatQuota,InvoiceDetail_retentionPercent,
											InvoiceDetail_retentionQuota,InvoiceDetail_total" />
								<aon:methodParam name="lookupChangeListener"
									value="#{controller.onItemChanged}" type="lookupChangeListener" />
							</ui:include>
							<aon:panelGroup id="invoiceDetailItemEdit" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formEdit}">
								<aon:inputTextarea id="InvoiceDetail_description"
									style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}"
									value="#{controller.to.description}"
									cols="60" rows="#{!controller.longDescription?1:5}"
									rendered="#{controller.to.item != null and controller.to.item.id != null}"
									ajaxSingle="true">
									<f:validateLength maximum="1024" />
								</aon:inputTextarea>
								<aon:commandLink id="InvoiceDetail_description_short" immediate="true"
									value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
									styleClass="aon-icon-edit-end-simple aon-vertical-align-top" 
									style="margin-left: 5px; padding-right: 12px;"
									rendered="#{controller.longDescription and controller.to.item.product.code != null}"
									actionListener="#{controller.onShortDescription}" 
									reRender="invoiceDetailItemEdit" ajaxSingle="true" />
								<aon:commandLink id="InvoiceDetail_description_long" immediate="true"
									value="&#160;" title="#{bundle.aon_edit}"
									styleClass="aon-icon-edit-add-simple aon-vertical-align-top" 
									style="margin-left: 5px; padding-right: 12px;"
									rendered="#{!controller.longDescription and controller.to.item.product.code != null}"
									actionListener="#{controller.onLongDescription}"
									reRender="invoiceDetailItemEdit" ajaxSingle="true" />
							</aon:panelGroup>
							<f:facet name="footer">
								<aon:div>
									<ui:include src="/com/code/aon/ui/product/facelet/expenseItem/lookup.xhtml">
										<ui:param name="lookupTo" value="#{controller.to.item}" />
										<ui:param name="idRequired" value="#{true}" />
										<ui:param name="skipLabel" value="#{true}" />
										<ui:param name="skipSuggestText" value="#{controller.to.item != null and controller.to.item.id != null}" />
										<ui:param name="lookupInputOnFocus" value="InvoiceDetail_description-New" />
										<ui:param name="lookupSuffix" value="-New" />
										<ui:param name="lookupRendered" value="#{formNew}" />
										<ui:param name="lookupReRender"
											value="invoiceDetailItemNew,InvoiceDetail_vatPercent-New,InvoiceDetail_vatQuota-New,
													InvoiceDetail_retentionPercent-New,InvoiceDetail_retentionQuota-New,InvoiceDetail_total-New" />
										<aon:methodParam name="lookupChangeListener"
											value="#{controller.onItemChanged}" type="lookupChangeListener" />
									</ui:include>
									<aon:panelGroup id="invoiceDetailItemNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
										<aon:inputTextarea id="InvoiceDetail_description-New"
											style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}"
											value="#{controller.to.description}"
											cols="60" rows="#{!controller.longDescription?1:5}"
											rendered="#{controller.to.item != null and controller.to.item.id != null}"
											ajaxSingle="true">
											<f:validateLength maximum="1024" />
										</aon:inputTextarea>
										<aon:commandLink id="InvoiceDetail_description_short-New" immediate="true"
											value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
											styleClass="aon-icon-edit-end-simple aon-vertical-align-top" 
											style="margin-left: 5px; padding-right: 12px;"
											rendered="#{controller.longDescription and controller.to.item.product.code != null}"
											actionListener="#{controller.onShortDescription}" 
											reRender="invoiceDetailItemNew" ajaxSingle="true" />
										<aon:commandLink id="InvoiceDetail_description_long-New" immediate="true"
											value="&#160;" title="#{bundle.aon_edit}"
											styleClass="aon-icon-edit-add-simple aon-vertical-align-top" 
											style="margin-left: 5px; padding-right: 12px;"
											rendered="#{!controller.longDescription and controller.to.item.product.code != null}"
											actionListener="#{controller.onLongDescription}"
											reRender="invoiceDetailItemNew" ajaxSingle="true" />
									</aon:panelGroup>
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_taxableBase" value="#{bundle.aon_taxable_base}" />
							</f:facet>
							<aon:outputText value="#{to.taxableBase}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_taxableBase"
								value="#{controller.to.taxableBase}" rendered="#{formEdit}"
								valueChangeListener="#{controller.onTaxableBaseChanged}"
								ajaxSingle="true" reRender="InvoiceDetail_vatQuota,InvoiceDetail_retentionQuota,InvoiceDetail_total" 
								required="true" size="5" focus="InvoiceDetail_vatQuota" />
							<f:facet name="footer">
								<aon:div style="text-align:right;">
									<aon:inputText id="InvoiceDetail_taxableBase-New"
										value="#{controller.to.taxableBase}" rendered="#{formNew}"
										valueChangeListener="#{controller.onTaxableBaseChanged}"
										ajaxSingle="true" reRender="InvoiceDetail_vatQuota-New,InvoiceDetail_retentionQuota-New,InvoiceDetail_total-New" 
										required="true" size="5" focus="InvoiceDetail_vatQuota-New" />
									<aon:outputText id="InvoiceTotal_taxableBase" 
										value="#{invoiceController.taxableBase}" rendered="#{!formNew}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_vatPercent" value="#{bundle.aon_vat}" />
							</f:facet>
							<aon:outputText value="#{to.vatPercent}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
							</aon:outputText>
							<aon:outputText id="InvoiceDetail_vatPercent"
								value="#{controller.to.vatPercent}" rendered="#{formEdit}">
								<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:outputText id="InvoiceDetail_vatPercent-New"
									value="#{controller.to.vatPercent}" rendered="#{formNew}">
									<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
								</aon:outputText>
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_vatQuota" value="#{bundle.aon_vat_quota}" />
							</f:facet>
							<aon:outputText value="#{to.vatQuota}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_vatQuota"
								value="#{controller.to.vatQuota}" rendered="#{formEdit}"
								disabled="#{controller.to.item.vat.percentage == 0}"
								valueChangeListener="#{controller.onVatQuotaChanged}"
								ajaxSingle="true" reRender="InvoiceDetail_vatPercent,InvoiceDetail_total"
								required="true" size="5"
								focus="#{invoiceController.to.withholding ? 'InvoiceDetail_retentionQuota' : 'InvoiceDetail_total'}" />
							<f:facet name="footer">
								<aon:div style="text-align:right;">
									<aon:inputText id="InvoiceDetail_vatQuota-New"
										value="#{controller.to.vatQuota}" rendered="#{formNew}"
										disabled="#{controller.to.item.vat.percentage == 0}"
										valueChangeListener="#{controller.onVatQuotaChanged}"
										ajaxSingle="true" reRender="InvoiceDetail_vatPercent-New,InvoiceDetail_total-New"
										required="true" size="5" 
										focus="#{invoiceController.to.withholding ? 'InvoiceDetail_retentionQuota-New' : 'InvoiceDetail_total-New'}" />
									<aon:outputText id="InvoiceTotal_vatQuota" 
										value="#{invoiceController.vatQuota}" rendered="#{!formNew}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:if test="#{invoiceController.to.withholding}">
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
								<f:facet name="header">
									<aon:outputLabel for="InvoiceDetail_retentionPercent" value="#{bundle.aon_retention}" />
								</f:facet>
								<aon:outputText value="#{to.retentionPercent}"
									rendered="#{formList}">
									<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
								</aon:outputText>
								<aon:outputText id="InvoiceDetail_retentionPercent"
									value="#{controller.to.retentionPercent}" rendered="#{formEdit}">
									<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
								</aon:outputText>
								<f:facet name="footer">
									<aon:outputText id="InvoiceDetail_retentionPercent-New"
										value="#{controller.to.retentionPercent}" rendered="#{formNew}">
										<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
									</aon:outputText>
								</f:facet>
							</aon:column>
		
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
								<f:facet name="header">
									<aon:outputLabel for="InvoiceDetail_retentionQuota" value="#{bundle.aon_retention_quota}" />
								</f:facet>
								<aon:outputText value="#{to.retentionQuota}"
									rendered="#{formList}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
								<aon:inputText id="InvoiceDetail_retentionQuota"
									value="#{controller.to.retentionQuota}" rendered="#{formEdit}"
									disabled="#{controller.to.item.retention == null or controller.to.item.retention.percentage == 0}"
									valueChangeListener="#{controller.onRetentionQuotaChanged}"
									ajaxSingle="true" reRender="InvoiceDetail_retentionPercent,InvoiceDetail_total"
									required="true" size="5" focus="InvoiceDetail_total" />
								<f:facet name="footer">
									<aon:div style="text-align:right;">
										<aon:inputText id="InvoiceDetail_retentionQuota-New"
											value="#{controller.to.retentionQuota}" rendered="#{formNew}"
											disabled="#{controller.to.item.retention == null or controller.to.item.retention.percentage == 0}"
											valueChangeListener="#{controller.onRetentionQuotaChanged}"
											ajaxSingle="true" reRender="InvoiceDetail_retentionPercent-New,InvoiceDetail_total-New"
											required="true" size="5" focus="InvoiceDetail_total-New" />
										<aon:outputText id="InvoiceTotal_retentionQuota" 
											value="#{invoiceController.retentionQuota}" rendered="#{!formNew}">
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>
									</aon:div>
								</f:facet>
							</aon:column>
						</aon:if>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_total" value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{controller.invoiceDetailTotal}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_total"
								value="#{controller.toInvoiceDetailTotal}" rendered="#{formEdit}"
								valueChangeListener="#{controller.onTotalChanged}"
								ajaxSingle="true" reRender="InvoiceDetail_taxableBase,InvoiceDetail_vatQuota,InvoiceDetail_retentionQuota" 
								required="true" size="5" />
							<f:facet name="footer">
								<aon:div style="text-align:right;">
									<aon:inputText id="InvoiceDetail_total-New"
										value="#{controller.toInvoiceDetailTotal}" rendered="#{formNew}"
										valueChangeListener="#{controller.onTotalChanged}"
										ajaxSingle="true" reRender="InvoiceDetail_taxableBase-New,InvoiceDetail_vatQuota-New,InvoiceDetail_retentionQuota-New" 
										required="true" size="5" />
									<aon:outputText id="InvoiceTotal_total" 
										value="#{invoiceController.toInvoiceTotalPrice}" rendered="#{!formNew}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:if test="#{companyCollections.currentUserWorkPlacesCount > 1}">
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
								<f:facet name="header">
									<aon:outputLabel for="InvoiceDetail_workPlace" value="#{bundle.purchase_workplace}" />
								</f:facet>
								<aon:outputText
									rendered="#{formList}"
									value="#{to.workPlace.description}">
									<aon:abbreviateConverter maxWidth="32" />
								</aon:outputText>
								<aon:selectOneMenu id="InvoiceDetail_workPlace"
									value="#{controller.to.workPlace}"
									rendered="#{formEdit}">
									<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="InvoiceDetail_workPlace-New"
										value="#{controller.to.workPlace}"
										rendered="#{formNew}">
										<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
						</aon:if>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
							<f:facet name="header">
								<aon:outputLabel value="INFO" />
							</f:facet>
							<aon:commandButton id="invoiceDetailProject" value="&#160;"
								styleClass="#{(to.project != null and to.project.id == invoiceController.to.project.id) ? 
												('aon-icon-commandButton aon-icon-project-ok') : ('aon-icon-commandButton aon-icon-project-warn')}"
								rendered="#{to.project != null and to.project.id != null}"
								actionListener="#{controller.onInvoiceDetailSelect}" 
								reRender="showProjectWindow">
								<rich:toolTip value="#{projectLabel} #{to.project.name}" />
								<f:setPropertyActionListener target="#{invoiceController.showProjectWindow}"
									value="#{true}" />
								<f:setPropertyActionListener target="#{invoiceController.showDetailProjectWindow}"
									value="#{true}" />
							</aon:commandButton>
 						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:panel>
		</aon:if>
	</aon:div>
</ui:composition>
