<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showLinkWindow">
		<c:if test="#{bankStatement.showLinkWindow}">
			<rich:modalPanel id="linkModalPanel" minHeight="640"
				minWidth="820" rendered="#{bankStatement.showLinkWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{financeBundle.finance_bank_statement_check_manual}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showLinkWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{bankStatement.showLinkWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="linkForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="statementLinkToolbar" styleClass="aon-toolbar">
									<aon:panelGrid columns="3" style="width:100%;"
										columnClasses="aon-width-250,aon-italic aon-width-250,aon-italic aon-width-auto">
										<aon:commandButton id="link-back"
											value="#{bundle.aon_back}"
											reRender="showLinkWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-noborder aon-icon-cancel">
											<rich:componentControl for="linkModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{bankStatement.showLinkWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:div>
											<aon:outputText value="#{financeBundle.finance_checked_amount}: " />
											<aon:outputText value="#{linkManager.checkedAmount}"
												rendered="#{linkManager.currentStatement != null}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:div>
										<aon:div>
											<aon:outputText value="#{financeBundle.finance_pending_amount}: " />
											<aon:outputText value="#{linkManager.pendingAmount}"
												rendered="#{linkManager.currentStatement != null}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:div>
									</aon:panelGrid>
								</aon:div>

								<aon:div id="statementLinkHeader" rendered="#{linkManager.currentStatement != null}">
									<aon:panelGrid columns="4" style="width:100%;"
										columnClasses="aon-italic aon-bold aon-width-100,aon-italic aon-bold aon-width-100,
											aon-italic aon-bold aon-width-150,aon-italic aon-bold aon-italic aon-width-auto">
										<aon:outputText value="&#160;" />
										<aon:outputText value="#{linkManager.currentStatement.operationDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>
										<aon:outputText value="#{linkManager.currentStatement.commonConcept}" />
										<aon:outputText value="#{linkManager.currentStatement.description}">
											<aon:abbreviateConverter maxWidth="50" />
										</aon:outputText>
									</aon:panelGrid>
								</aon:div>

								<aon:div id="statementLinkCheckDiv" styleClass="aon-scroll-area">
									<aon:panelTabSet id="statementLinkTabSet" selectedTab="#{linkManager.selectedTab}">
										<aon:panelTab id="statementLinkTab" label="#{financeBundle.finance_checked_concepts}"
											rendered="#{bankStatementLink.model.rowCount > 0}">
											<aon:div styleClass="aon-toolbar">
												<aon:commandButton title="#{bundle.aon_check_all}"
													styleClass="aon-finding-toolbar-item aon-icon-checkAll"
													value="#{bundle.aon_check_all}"
													actionListener="#{bankStatementLink.checkAll}" reRender="statementLinkListDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
												<aon:commandButton title="#{bundle.aon_uncheck_all}"
													styleClass="aon-finding-toolbar-item aon-icon-checkNone"
													value="#{bundle.aon_uncheck_all}"
													actionListener="#{bankStatementLink.checkNone}" reRender="statementLinkListDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
												<aon:commandButton title="#{financeBundle.finance_cancel_checks}"
													styleClass="aon-finding-toolbar-item aon-icon-deleteFolder"
													value="#{financeBundle.finance_cancel_checks}"
													actionListener="#{linkManager.onRemoveLinks}" 
													reRender="statementLinkToolbar,statementLinkCheckDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
											</aon:div>

											<aon:div id="statementLinkListDiv">
												<aon:dataTable id="statementLinkData" value="#{bankStatementLink.model}"
													var="to" rows="10" rendered="#{bankStatementLink.model.rowCount > 0}">

													<aon:column styleClass="aon-editDataTable-iconColumn">
														<f:facet name="header">
															<aon:outputText value="&#160;" />
														</f:facet>
														<aon:selectBooleanCheckbox id="StatementLinkCheck"
															value="#{bankStatementLink.rowChecked}"
															valueChangeListener="#{bankStatementLink.rowSelected}" />	
			 										</aon:column>
			
													<aon:column styleClass="aon-editDataTable-textColumn">
														<f:facet name="header">
															<aon:outputText value="#{financeBundle.finance_finance_date_abbrv}" />
														</f:facet>
														<aon:outputText value="#{to.date}">
															<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
																timeZone="#{timeZoneController.timeZoneId}" />
														</aon:outputText>
													</aon:column>

													<c:if test="#{aonRole.confidentiality}">
														<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
															<f:facet name="header">
																<aon:outputText value="&#160;" title="#{bundle.aon_confidential}"
																	styleClass="aon-icon-confidential" style="padding-left:15px" />
															</f:facet>
															<aon:outputText value="&#160;"
																styleClass="#{to.confidential?'aon-icon-checked':'aon-icon-check'}" 
																style="padding-left:20px" />
														</aon:column>
													</c:if>

													<aon:column styleClass="aon-editDataTable-textColumn">
														<f:facet name="header">
															<aon:outputText value="#{bundle.aon_id}" />
														</f:facet>
														<aon:outputText value="#{to.concept}" />
													</aon:column>

													<aon:column styleClass="aon-editDataTable-textColumn">
														<f:facet name="header">
															<aon:outputText	value="#{bundle.aon_description}" />
														</f:facet>
														<aon:outputText value="#{to.description}">
															<aon:abbreviateConverter maxWidth="50" />
														</aon:outputText>
													</aon:column>

													<aon:column styleClass="aon-editDataTable-numberColumn">
														<f:facet name="header">
															<aon:outputText value="#{bundle.aon_amount}" />
														</f:facet>
														<aon:outputText value="#{to.amount}">
															<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
														</aon:outputText>
													</aon:column>

												</aon:dataTable>
					
												<aon:dataScroller2 for="statementLinkData" showNote="false" />
											</aon:div>
										</aon:panelTab>

										<aon:panelTab id="financeLinkTab" label="#{financeBundle.finance_unchecked_finances}"
											rendered="#{!linkManager.batchSource and !linkManager.batchLinked}">
											<aon:div styleClass="aon-toolbar">
												<aon:commandButton title="#{bundle.aon_check_all}"
													styleClass="aon-finding-toolbar-item aon-icon-checkAll"
													value="#{bundle.aon_check_all}"
													rendered="#{financeList.model.rowCount > 0 or financeTrackingList.model.rowCount > 0}"
													actionListener="#{linkManager.checkAllUnChecked}" 
													reRender="financeListDiv,trackingListDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
												<aon:commandButton title="#{bundle.aon_uncheck_all}"
													styleClass="aon-finding-toolbar-item aon-icon-checkNone"
													value="#{bundle.aon_uncheck_all}"
													rendered="#{financeList.model.rowCount > 0 or financeTrackingList.model.rowCount > 0}"
													actionListener="#{linkManager.checkNoneUnChecked}" 
													reRender="financeListDiv,trackingListDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
												<aon:commandButton title="#{financeBundle.finance_refine_search}"
													styleClass="aon-finding-toolbar-item aon-icon-search"
													value="#{financeBundle.finance_refine_search}"
													actionListener="#{linkManager.onEditSearchFinance}" 
													reRender="showFinanceSearchWindow">
													<f:setPropertyActionListener target="#{financeList.showFinanceSearchWindow}"
														value="#{true}" />
												</aon:commandButton>
												<aon:commandButton title="#{financeBundle.finance_check_selected}"
													styleClass="aon-finding-toolbar-item aon-icon-newFolder"
													value="#{financeBundle.finance_check_selected}"
													rendered="#{financeList.model.rowCount > 0 or financeTrackingList.model.rowCount > 0}"
													actionListener="#{linkManager.onAddLinks}" 
													reRender="statementLinkToolbar,statementLinkCheckDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
											</aon:div>

											<aon:div id="financeListDiv">
												<aon:panel rendered="#{financeList.model.rowCount > 0 or financeTrackingList.model.rowCount == 0}">
													<f:facet name="header">
														<aon:div>
															<aon:outputLabel for="financeData" 
																value="#{financeBundle.finance_unpaid_finances}"
																rendered="#{!linkManager.returnSource}" />
															<aon:outputLabel for="financeData" 
																value="#{financeBundle.finance_paid_finances}"
																rendered="#{linkManager.returnSource}" />
														</aon:div>
													</f:facet>

													<aon:dataTable id="financeData"	value="#{financeList.model}" 
														style="margin-top: 5px;" var="to" rendered="#{financeList.model.rowCount > 0}"
														rows="#{financeTrackingList.model.rowCount > 0 ? '5' : '10'}">

														<aon:column styleClass="aon-editDataTable-iconColumn">
															<f:facet name="header">
																<aon:outputText value="&#160;" />
															</f:facet>
															<aon:selectBooleanCheckbox id="FinanceCheck"
																value="#{financeList.rowChecked}"
																valueChangeListener="#{financeList.rowSelected}" />	
				 										</aon:column>
			
														<aon:column alias="Finance.dueDate" 
															styleClass="aon-editDataTable-textColumn">
															<f:facet name="header">
																<aon:outputText value="#{financeBundle.finance_finance_date_abbrv}" />
															</f:facet>
															<aon:outputText value="#{to.dueDate}">
																<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
																	timeZone="#{timeZoneController.timeZoneId}" />
															</aon:outputText>
														</aon:column>

														<c:if test="#{aonRole.confidentiality}">
															<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
																<f:facet name="header">
																	<aon:outputText value="&#160;" title="#{bundle.aon_confidential}"
																		styleClass="aon-icon-confidential" style="padding-left:15px" />
																</f:facet>
																<aon:outputText value="&#160;"
																	styleClass="#{to.confidential?'aon-icon-checked':'aon-icon-check'}" 
																	style="padding-left:20px" />
															</aon:column>
														</c:if>

														<aon:column alias="Finance.concept" 
															styleClass="aon-editDataTable-textColumn">
															<f:facet name="header">
																<aon:outputText value="#{financeBundle.finance_invoice_document_number}" />
															</f:facet>
															<aon:outputText value="#{to.concept}">
																<aon:abbreviateConverter maxWidth="20" />
															</aon:outputText>
															<rich:toolTip rendered="#{financeList.conceptLength > 20}">
																<aon:outputText value="#{to.concept}" />
															</rich:toolTip>
														</aon:column>

														<aon:column alias="Finance.registryName" 
															styleClass="aon-editDataTable-textColumn">
															<f:facet name="header">
																<aon:outputText	value="#{bundle.aon_name}" />
															</f:facet>
															<aon:outputText value="#{to.registryName}">
																<aon:abbreviateConverter maxWidth="45" />
															</aon:outputText>
															<rich:toolTip rendered="#{financeList.registryNameLength > 45}">
																<aon:outputText value="#{to.registryName}" />
															</rich:toolTip>
														</aon:column>

														<aon:column alias="Finance.amount" 
															styleClass="aon-editDataTable-numberColumn">
															<f:facet name="header">
																<aon:outputText value="#{bundle.aon_amount}" />
															</f:facet>
															<aon:outputText value="#{to.totalAmount}">
																<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
															</aon:outputText>
														</aon:column>

													</aon:dataTable>
					
													<aon:dataScroller2 for="financeData" showNote="true" />
												</aon:panel>
											</aon:div>

											<aon:div id="trackingListDiv" styleClass="aon-padding-top">
												<aon:panel rendered="#{financeTrackingList.model.rowCount > 0}">
													<f:facet name="header">
														<aon:div>
															<aon:outputLabel for="financeTrackingData" 
																value="#{financeBundle.finance_paid_finances}"
																rendered="#{!linkManager.returnSource}" />
															<aon:outputLabel for="financeTrackingData" 
																value="#{financeBundle.finance_returned_finances}"
																rendered="#{linkManager.returnSource}" />
														</aon:div>
													</f:facet>

													<aon:dataTable id="financeTrackingData" value="#{financeTrackingList.model}" 
														style="margin-top: 5px;" var="to" rendered="#{financeTrackingList.model.rowCount > 0}"
														rows="#{financeTrackingList.model.rowCount > 0 ? '5' : '10'}">

														<aon:column styleClass="aon-editDataTable-iconColumn">
															<f:facet name="header">
																<aon:outputText value="&#160;" />
															</f:facet>
															<aon:selectBooleanCheckbox id="FinanceTrackingCheck"
																value="#{financeTrackingList.rowChecked}"
																valueChangeListener="#{financeTrackingList.rowSelected}" />	
				 										</aon:column>
			
														<aon:column alias="FinanceTracking.trackingDate" 
															styleClass="aon-editDataTable-textColumn">
															<f:facet name="header">
																<aon:outputText value="#{financeBundle.finance_pay_date}" />
															</f:facet>
															<aon:outputText value="#{to.trackingDate}">
																<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
																	timeZone="#{timeZoneController.timeZoneId}" />
															</aon:outputText>
														</aon:column>

														<c:if test="#{aonRole.confidentiality}">
															<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
																<f:facet name="header">
																	<aon:outputText value="&#160;" title="#{bundle.aon_confidential}"
																		styleClass="aon-icon-confidential" style="padding-left:15px" />
																</f:facet>
																<aon:outputText value="&#160;"
																	styleClass="#{to.finance.confidential?'aon-icon-checked':'aon-icon-check'}" 
																	style="padding-left:20px" />
															</aon:column>
														</c:if>

														<aon:column alias="FinanceTracking.finance.concept"
															styleClass="aon-editDataTable-textColumn">
															<f:facet name="header">
																<aon:outputText value="#{financeBundle.finance_invoice_document_number}" />
															</f:facet>
															<aon:outputText value="#{to.finance.concept}">
																<aon:abbreviateConverter maxWidth="20" />
															</aon:outputText>
															<rich:toolTip rendered="#{financeTrackingList.conceptLength > 20}">
																<aon:outputText value="#{to.finance.concept}" />
															</rich:toolTip>
														</aon:column>

														<aon:column alias="FinanceTracking.finance.registryName"
															styleClass="aon-editDataTable-textColumn">
															<f:facet name="header">
																<aon:outputText	value="#{bundle.aon_name}" />
															</f:facet>
															<aon:outputText value="#{to.finance.registryName}">
																<aon:abbreviateConverter maxWidth="45" />
															</aon:outputText>
															<rich:toolTip rendered="#{financeTrackingList.registryNameLength > 45}">
																<aon:outputText value="#{to.finance.registryName}" />
															</rich:toolTip>
														</aon:column>

														<aon:column alias="FinanceTracking.amount"
															styleClass="aon-editDataTable-numberColumn">
															<f:facet name="header">
																<aon:outputText value="#{bundle.aon_amount}" />
															</f:facet>
															<aon:outputText value="#{to.amount}">
																<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
															</aon:outputText>
														</aon:column>

													</aon:dataTable>
					
													<aon:dataScroller2 for="financeTrackingData" showNote="false" />
												</aon:panel>
											</aon:div>
										</aon:panelTab>

										<aon:panelTab id="fbatchLinkTab" label="#{financeBundle.finance_unchecked_fbatches}"
											rendered="#{!linkManager.returnSource and !linkManager.batchLinked and !linkManager.trackingLinked}">
											<aon:div styleClass="aon-toolbar" rendered="#{fbatchList.model.rowCount > 0}">
												<aon:commandButton title="#{financeBundle.finance_check_selected}"
													styleClass="aon-finding-toolbar-item aon-icon-newFolder"
													value="#{financeBundle.finance_check_selected}"
													actionListener="#{linkManager.onAddLinks}" 
													reRender="statementLinkToolbar,statementLinkCheckDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
											</aon:div>
											<aon:div id="fbatchListDiv">
												<aon:dataTable id="fBatchData" value="#{fbatchList.model}"
													var="to" rows="10" rendered="#{fbatchList.model.rowCount > 0}">

													<aon:column styleClass="aon-editDataTable-iconColumn">
														<f:facet name="header">
															<aon:outputText value="&#160;" />
														</f:facet>
														<aon:selectBooleanCheckbox id="FinanceBatchCheck"
															value="#{fbatchList.rowChecked}"
															valueChangeListener="#{fbatchList.uniqueRowSelected}"
															ajaxSingle="true" reRender="fbatchListDiv" />	
			 										</aon:column>
			
													<aon:column alias="FinanceBatch.issueDate"
														 styleClass="aon-editDataTable-textColumn">
														<f:facet name="header">
															<aon:outputText value="#{bundle.aon_date}" />
														</f:facet>
														<aon:outputText value="#{to.issueDate}">
															<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
																timeZone="#{timeZoneController.timeZoneId}" />
														</aon:outputText>
													</aon:column>

													<c:if test="#{aonRole.confidentiality}">
														<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
															<f:facet name="header">
																<aon:outputText value="&#160;" title="#{bundle.aon_confidential}"
																	styleClass="aon-icon-confidential" style="padding-left:15px" />
															</f:facet>
															<aon:outputText value="&#160;"
																styleClass="#{to.confidential?'aon-icon-checked':'aon-icon-check'}" 
																style="padding-left:20px" />
														</aon:column>
													</c:if>

													<aon:column alias="FinanceBatch.id"
														 styleClass="aon-editDataTable-textColumn">
														<f:facet name="header">
															<aon:outputText value="#{bundle.aon_id}" />
														</f:facet>
														<aon:outputText value="#{to.id}" />
													</aon:column>

													<aon:column alias="FinanceBatch.description"
														 styleClass="aon-editDataTable-textColumn">
														<f:facet name="header">
															<aon:outputText	value="#{bundle.aon_description}" />
														</f:facet>
														<aon:outputText value="#{to.description}">
															<aon:abbreviateConverter maxWidth="50" />
														</aon:outputText>
														<rich:toolTip rendered="#{fbatchList.descriptionLength > 50}">
															<aon:outputText value="#{to.description}" />
														</rich:toolTip>
													</aon:column>

													<aon:column	styleClass="aon-editDataTable-numberColumn">
														<f:facet name="header">
															<aon:outputText value="#{bundle.aon_amount}" />
														</f:facet>
														<aon:outputText value="#{to.financeBatchTotalAmount}">
															<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
														</aon:outputText>
													</aon:column>

												</aon:dataTable>
					
												<aon:dataScroller2 for="fBatchData" showNote="true" />
											</aon:div>
										</aon:panelTab>

										<aon:panelTab id="otherConceptsLinkTab" label="#{financeBundle.finance_other_concepts}">
											<aon:div styleClass="aon-toolbar">
												<aon:commandButton title="#{financeBundle.finance_bank_statement_check}"
													styleClass="aon-finding-toolbar-item aon-icon-newFolder"
													value="#{financeBundle.finance_bank_statement_check}"
													actionListener="#{linkManager.onAddLinkOtherConcept}" 
													reRender="statementLinkToolbar,statementLinkCheckDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
											</aon:div>
											<aon:div id="otherConceptsListDiv">
												<aon:div>
													<aon:panelGrid columns="2" style="width:100%;"
														columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">
														<c:if test="#{aonRole.accountingOperator}">
															<aon:outputText value="#{financeBundle.finance_account} " />
															<ui:include	src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
																<ui:param name="wizard" value="#{accountWizard}" />
																<ui:param name="id" value="BankStatementLinkManager_account" />
																<ui:param name="required" value="#{false}" />
																<ui:param name="size" value="12" />
																<ui:param name="maxlength" value="12" />
																<ui:param name="renderDescription" value="#{true}" />
																<ui:param name="renderedAttr" value="#{true}" />
																<ui:param name="disabled" value="#{false}" />
																<ui:param name="entity" value="#{linkManager.account}" />
																<ui:param name="ELExpression" value="bankStatement.bankStatementLinkManager.account" />
															</ui:include>
														</c:if>
														<aon:outputText value="#{bundle.aon_concept} " />
														<aon:selectOneMenu value="#{linkManager.bankConcept}">
															<f:selectItems value="#{financeCollections.bankConcepts}" />
														</aon:selectOneMenu>
														<aon:outputText value="#{bundle.aon_amount} " />
														<aon:inputText value="#{linkManager.amount}" size="8" />
													</aon:panelGrid>
												</aon:div>
											</aon:div>
										</aon:panelTab>

										<aon:panelTab id="entryDetailLinkTab" label="#{financeBundle.finance_bind_account_entry}" 
											rendered="#{linkManager.entryDetailModel.rowCount > 0}">
											<aon:dataTable id="entryDetailData" value="#{linkManager.entryDetailModel}"
												var="to" rows="10" rendered="#{linkManager.entryDetailModel.rowCount > 0}">

												<aon:column styleClass="aon-editDataTable-iconColumn">
													<f:facet name="header">
														<aon:outputText value="&#160;" />
													</f:facet>
													<aon:commandButton id="addEntryDetail"
														value="&#160;" styleClass="aon-icon-attach-file aon-noborder"
														title="#{financeBundle.finance_bind}"
														actionListener="#{linkManager.onBindEntryDetail}"
														reRender="showLinkWindow"
														onclick="Richfaces.showModalPanel('waitProccess')" 
											     		oncomplete="Richfaces.hideModalPanel('waitProccess')">	
														<f:setPropertyActionListener target="#{bankStatement.showLinkWindow}"
															value="#{false}" />
													</aon:commandButton>
		 										</aon:column>
			
												<aon:column styleClass="aon-editDataTable-textColumn">
													<f:facet name="header">
														<aon:outputText value="#{financeBundle.finance_account_entry}" />
													</f:facet>
													<aon:outputText value="#{to.accountEntry.id}" />
												</aon:column>

												<aon:column styleClass="aon-editDataTable-textColumn">
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_date}" />
													</f:facet>
													<aon:outputText value="#{to.accountEntry.entryDate}">
														<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
															timeZone="#{timeZoneController.timeZoneId}" />
													</aon:outputText>
												</aon:column>

												<c:if test="#{aonRole.confidentiality}">
													<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
														<f:facet name="header">
															<aon:outputText value="&#160;" title="#{bundle.aon_confidential}"
																styleClass="aon-icon-confidential" style="padding-left:15px" />
														</f:facet>
														<aon:outputText value="&#160;"
															styleClass="#{to.accountEntry.confidential?'aon-icon-checked':'aon-icon-check'}" 
															style="padding-left:20px" />
													</aon:column>
												</c:if>

												<aon:column styleClass="aon-editDataTable-textColumn">
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_concept}" />
													</f:facet>
													<aon:outputText value="#{to.concept}" />
												</aon:column>

												<aon:column styleClass="aon-editDataTable-numberColumn">
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_amount}" />
													</f:facet>
													<aon:outputText value="#{to.credit + to.debit}">
														<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
													</aon:outputText>
												</aon:column>

												<aon:column styleClass="aon-editDataTable-textColumn">
													<f:facet name="header">
														<aon:outputText value="#{financeBundle.finance_balancing_account}" />
													</f:facet>
													<aon:outputText value="#{to.balancingAccount.id}" />
													<rich:toolTip direction="bottom-left">
														<aon:outputText value="#{to.balancingAccount.description}" />
													</rich:toolTip>
												</aon:column>

												<aon:column styleClass="aon-editDataTable-textColumn">
													<f:facet name="header">
														<aon:outputText value="#{financeBundle.finance_invoice_document_number}" />
													</f:facet>
													<aon:outputText value="#{to.documentNumber}" />
												</aon:column>

											</aon:dataTable>
										</aon:panelTab>

										<aon:panelTab id="commentsLinkTab" label="#{bundle.aon_comment}">
											<aon:div styleClass="aon-toolbar">
												<aon:commandButton title="#{bundle.aon_save}"
													styleClass="aon-finding-toolbar-item aon-icon-accept"
													value="#{bundle.aon_save}"
													actionListener="#{linkManager.onSaveComments}"
													reRender="commentsListDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
											</aon:div>
											<aon:div id="commentsListDiv">
												<aon:div>
													<aon:inputTextarea id="Invoice_comments" cols="100" rows="4"
														value="#{linkManager.comments}" />
												</aon:div>
											</aon:div>
										</aon:panelTab>
 									</aon:panelTabSet>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
				<ui:include src="/com/code/aon/ui/finance/facelet/finance/modalSearch.xhtml">
					<ui:param name="controller" value="#{bankStatement.bankStatementLinkManager}" />
					<ui:param name="showType" value="true" />
					<ui:param name="searchReRender" value="statementLinkCheckDiv" />
				</ui:include>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
