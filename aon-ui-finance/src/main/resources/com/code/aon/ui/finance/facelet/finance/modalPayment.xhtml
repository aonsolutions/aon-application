<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinancePaymentWindow">
		<aon:if test="#{finance.showFinancePaymentWindow}">
			<rich:modalPanel id="financePaymentModalPanel" minHeight="240"
				minWidth="580" rendered="#{finance.showFinancePaymentWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{(finance.payment) ? (bundle.finance_payment) : (bundle.finance_charge)}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFinancePaymentWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{finance.showFinancePaymentWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="financePaymentForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="financePayment-payment"
										value="#{(finance.payment) ? (bundle.finance_to_pay) : (bundle.finance_to_charge)}"
										reRender="showFinancePaymentWindow,financeForm"
										actionListener="#{finance.onFinancePayment}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="financePaymentModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{finance.showFinancePaymentWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="financePayment-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showFinancePaymentWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{finance.showFinancePaymentWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

										<aon:outputLabel for="Finance_paymentDate"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Finance_paymentDate" 
											value="#{finance.paymentDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-110" />

										<aon:outputLabel for="Finance_paymentAmount"
											value="#{bundle.aon_amount}" />
										<aon:inputText id="Finance_paymentAmount"
											value="#{finance.paymentAmount}"
											required="true" size="10" />

										<aon:outputLabel for="Finance_paymentRegistryBank"
											value="#{bundle.aon_bank}"
											rendered="#{finance.paymentRegistryBank != null}" />
										<aon:selectOneMenu id="Finance_paymentRegistryBank"
											value="#{finance.paymentRegistryBank}"
											rendered="#{finance.paymentRegistryBank != null}">
											<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
										</aon:selectOneMenu>
										<aon:outputLabel for="Finance_paymentPayMethodTypeDetail"
											value="#{bundle.aon_detail}"
											rendered="#{finance.paymentRegistryBank == null and finance.payMethodTypeDetailsSize > 1}" />
										<aon:selectOneMenu id="Finance_paymentPayMethodTypeDetail"
											value="#{finance.paymentPayMethodTypeDetail}"
											rendered="#{finance.paymentRegistryBank == null and finance.payMethodTypeDetailsSize > 1}">
											<f:selectItems value="#{finance.payMethodTypeDetailList}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="Finance_paymentPayMethod"
											value="#{bundle.finance_payMethod}"
											rendered="#{finance.to.payMethod != null and finance.to.payMethod.id != null}" />
										<aon:outputText id="Finance_paymentPayMethod"
										 	styleClass="aon-bold"
											value="#{finance.to.payMethod.name}"
											rendered="#{finance.to.payMethod != null and finance.to.payMethod.id != null}" />

										<aon:if test="#{aonRole.accountingOperator}">
											<aon:outputLabel for="Finance_record"
												value="#{bundle.finance_record}" />
											<aon:selectOneRadio id="Finance_record" 
												value="#{finance.paymentRecordable}">
												<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
												<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
											</aon:selectOneRadio>
										</aon:if>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
