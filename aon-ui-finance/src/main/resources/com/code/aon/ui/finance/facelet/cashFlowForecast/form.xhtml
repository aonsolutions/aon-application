<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="cashFlowForecastForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.finance_cashflow_forecast_module}" />
				<ui:param name="controller" value="#{cashFlowForecast}" />
			</ui:include>
			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" style="width: 100%;">

					<aon:outputLabel for="CashFlowForecast_payment" value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="CashFlowForecast_payment"
						value="#{cashFlowForecast.to.payment}">
						<f:selectItem itemLabel="#{bundle.finance_payment}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{bundle.finance_charge}" itemValue="#{false}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="CashFlowForecast_registryBank_id"
						value="#{bundle.aon_bank}" />
					<aon:selectOneMenu id="CashFlowForecast_registryBank_id"
						value="#{cashFlowForecast.to.registryBank}">
						<f:selectItem itemValue="#{null}" itemLabel=" - "/>
						<aon:if test="#{!cashFlowForecast.nevv}">
							<f:selectItems value="#{companyCollections.allCompanyBanks}" />
						</aon:if>
						<aon:if test="#{cashFlowForecast.nevv}">
							<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
						</aon:if>
					</aon:selectOneMenu>

					<aon:outputLabel for="CashFlowForecast_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="CashFlowForecast_description" size="32"
						value="#{cashFlowForecast.to.description}"/>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="CashFlowForecast_startDate-From"
							styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_next}:" />
						<aon:selectInputDate id="CashFlowForecast_startDate-From"
							value="#{cashFlowForecast.to.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="CashFlowForecast_startDate-To"
							styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="CashFlowForecast_startDate-To"
							value="#{cashFlowForecast.to.dueDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>

					<aon:outputLabel for="CashFlowForecast_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="CashFlowForecast_amount" size="10"
						value="#{cashFlowForecast.to.amount}" />

					<aon:outputLabel for="CashFlowForecast_paymentDay"
						value="#{bundle.finance_cashflow_payment_day}" />
					<aon:inputText id="CashFlowForecast_paymentDay" size="10"
						value="#{cashFlowForecast.to.paymentDay}" />
					
					<aon:outputText value="#{bundle.finance_cashflow_months}" />
					<aon:div id="monthsChecks">
						<h:panelGrid columns="6">
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_january" value="#{cashFlowForecast.to.january}"/>
								<aon:outputLabel for="CashFlowForecast_january" value="#{bundle.aon_january}" />
							</aon:panelGroup>	
							
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_february" value="#{cashFlowForecast.to.february}"/>
								<aon:outputLabel for="CashFlowForecast_february" value="#{bundle.aon_february}" />
							</aon:panelGroup>	
								
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_march" value="#{cashFlowForecast.to.march}"/>
								<aon:outputLabel for="CashFlowForecast_march" value="#{bundle.aon_march}" />
							</aon:panelGroup>	
								
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_april" value="#{cashFlowForecast.to.april}"/>
								<aon:outputLabel for="CashFlowForecast_april" value="#{bundle.aon_april}" />
							</aon:panelGroup>	
								
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_may" value="#{cashFlowForecast.to.may}"/>
								<aon:outputLabel for="CashFlowForecast_may" value="#{bundle.aon_may}" />
							</aon:panelGroup>	
	
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_june" value="#{cashFlowForecast.to.june}"/>
								<aon:outputLabel for="CashFlowForecast_june" value="#{bundle.aon_june}" />
							</aon:panelGroup>	
								
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_july" value="#{cashFlowForecast.to.july}"/>
								<aon:outputLabel for="CashFlowForecast_july" value="#{bundle.aon_july}" />
							</aon:panelGroup>	
								
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_august" value="#{cashFlowForecast.to.august}"/>
								<aon:outputLabel for="CashFlowForecast_august" value="#{bundle.aon_august}" />
							</aon:panelGroup>	
								
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_september" value="#{cashFlowForecast.to.september}"/>
								<aon:outputLabel for="CashFlowForecast_september" value="#{bundle.aon_september}" />
							</aon:panelGroup>	
								
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_october" value="#{cashFlowForecast.to.october}"/>
								<aon:outputLabel for="CashFlowForecast_october" value="#{bundle.aon_october}" />
							</aon:panelGroup>	
								
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_november" value="#{cashFlowForecast.to.november}"/>
								<aon:outputLabel for="CashFlowForecast_november" value="#{bundle.aon_november}" />
							</aon:panelGroup>	
								
							<aon:panelGroup styleClass="aon-nowrap">
								<aon:selectBooleanCheckbox id="CashFlowForecast_december" value="#{cashFlowForecast.to.december}"/>
								<aon:outputLabel for="CashFlowForecast_december" value="#{bundle.aon_december}" />
							</aon:panelGroup>	
						</h:panelGrid>
					</aon:div>
				</aon:panelGrid>
				

				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.finance_cashflow_help}" 
							styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>			
					
					<aon:panelGrid columns="2">
							<aon:outputLabel for="CashFlowForecast_startMonth"
								value="#{bundle.finance_cashflow_start_month}" />
							<aon:selectOneMenu id="CashFlowForecast_startMonth"
								value="#{cashFlowForecast.startMonth}">
								<f:selectItems value="#{commonCollections.months}" />
							</aon:selectOneMenu>
							
							<aon:outputLabel for="CashFlowForecast_billingPeriod"
								value="#{bundle.finance_cashflow_start_period}" />
							<aon:selectOneMenu id="CashFlowForecast_billingPeriod"
								value="#{cashFlowForecast.billingPeriod}">
								<f:selectItems value="#{financeCollections.billingPeriods}" />
							</aon:selectOneMenu>

							<aon:outputText value="" />
							<aon:div >
								<aon:commandButton value="#{bundle.aon_refresh}"
									reRender="monthsChecks"
									actionListener="#{cashFlowForecast.onUpdateChecks}"/>
							</aon:div>	
					</aon:panelGrid>
				</aon:div>		
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
