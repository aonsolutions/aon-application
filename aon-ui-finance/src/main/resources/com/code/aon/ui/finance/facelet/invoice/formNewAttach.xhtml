<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<style type="text/css">
		#filedrag {
			display: none;
		}
		.filedrag div {
			width: auto !important;
			height: auto !important;
		}
		.rich-fileupload-hidden {
			font-weight: bold;
			text-align: center;
			padding: 1em 0;
			margin: 1em 0;
			color: #555;
			border: 2px dashed #555;
			border-radius: 7px;
			cursor: default;
			opacity: 1 !important;
			font-size: 1em !important;
			position: relative !important;
			padding: 10px !important;
			width: 630px;
		}
		.rich-fileupload-hidden.hover {
			color: #f00;
			border-color: #f00;
			border-style: solid;
			box-shadow: inset 0 3px 4px #888;
		}
		.rich-fileupload-ico-add, .rich-fileupload-button, .rich-fileupload-button-light {
			background: none;
			background-image: none;
			background-color: transparent;
		} 
		.rich-fileupload-font {
			color: transparent !important;
		}
		.rich-fileupload-anc, .rich-fileupload-ico-stop {
			display: none !important;
		}
	</style>
	
	<script type="text/javascript">
	//<![CDATA[
		var filedrag = document.getElementById( obtainAbsoluteId( 'filedrag', "div" ) );
		var inputFile = document.getElementById( obtainAbsoluteId( 'invoiceAttach-upload', "div") + ':file' );
		var panel = document.getElementById( obtainAbsoluteId( 'invoiceAttachPreview-panel', "div" ) );
		var container = document.getElementById( obtainAbsoluteId( 'invoiceAttachPreview-content', "div" ) );
		
		window.addEventListener("resize", autoWidthContainer);
		
		if (window.File && window.FileList && window.FileReader) {
			var xhr = new XMLHttpRequest();
			if (xhr.upload)
				filedrag.style.display = "block";
		}
		
		function loadPdfPlugin(_pageNumber = 1, _zoomRatio = 1.0) {
			panel.style.display = "block";
 	 		filedrag.style.display = "none";
			autoWidthContainer();
		 	renderFile();
		}
		
		function renderFile() {
	 	 	if (file = inputFile.files[0]) {
		 		var pdfjsframe = document.getElementById( obtainAbsoluteId( 'invoiceAttachPreview-iframe', "iframe" ) );
	 	 		var PDFViewerApplication = pdfjsframe.contentWindow.PDFViewerApplication;
	 	 		var PDFJS = pdfjsframe.contentWindow.PDFJS;
	 	 		
	 	 	    var fileReader = new FileReader();
	 	 	    fileReader.onload = function webViewerChangeFileReaderOnload(evt) {
	 	 	      var buffer = evt.target.result;
	 	 	      PDFViewerApplication.open(new Uint8Array(buffer));
	 	 	    };
	 	 	    fileReader.readAsArrayBuffer(file);
	 	 	    PDFViewerApplication.setTitleUsingUrl(file.name);
	 	 	    var appConfig = PDFViewerApplication.appConfig;
	 	 	    disableButtons(appConfig);
	 	 	}
		}
		
		function disableButtons(appConfig) {
 	        appConfig.toolbar.presentationModeButton.classList.add('hidden');
 	        appConfig.toolbar.print.classList.add('hidden');
 	 	    appConfig.toolbar.download.setAttribute('hidden', 'true');
			appConfig.toolbar.viewBookmark.setAttribute('hidden', 'true');
 	 	    appConfig.toolbar.openFile.setAttribute('hidden', 'true'); 	        
 	        appConfig.secondaryToolbar.presentationModeButton.classList.add('hidden');
 	        appConfig.secondaryToolbar.printButton.classList.add('hidden');
 	 	    appConfig.secondaryToolbar.downloadButton.setAttribute('hidden', 'true');
 	 	    appConfig.secondaryToolbar.viewBookmarkButton.setAttribute('hidden', 'true');
 	        appConfig.secondaryToolbar.openFileButton.setAttribute('hidden', 'true');
		}
		
		function autoWidthContainer() {
			var width = window.innerWidth
			  || document.documentElement.clientWidth
			  || document.body.clientWidth;
			var height = window.innerHeight
			  || document.documentElement.clientHeight
			  || document.body.clientHeight;
		    container.style.width = (width-750) + "px";
		    container.style.height = (height-200) + 'px';
		}
		
		function obtainAbsoluteId(_elementId, _tagName) {
	 		var elements = document.getElementsByTagName(_tagName);
	 		for(i=0;i<elements.length;i++)
	 			if (elements[i].id.endsWith( _elementId ))
	 				return elements[i].id;
	 	}
	 	
	//]]>
 	</script>
	
	<aon:div id="filedrag" styleClass="filedrag">
		<aon:fileUpload id="invoiceAttach-upload" ajaxSingle="true"
			listWidth="100" acceptedTypes="pdf" 
			immediateUpload="#{true}" allowFlash="#{false}"
			fileUploadListener="#{invoiceController.invoiceAttachFileUploaded}"
			onadd="loadPdfPlugin();" onchange="loadPdfPlugin();">
			<a4j:support event="onuploadcomplete" immediate="true"
				reRender="invoiceAttachFile-panel" />
		</aon:fileUpload>
		<br/><br/><br/>
	</aon:div>
	
</ui:composition>
