<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<style type="text/css">
		.filedrag div {
			width: auto !important;
			height: auto !important;
		}
		.rich-fileupload-hidden {
			font-weight: bold;
			text-align: center;
			padding: 1em 0;
			margin: 1em 0;
			color: #555;
			border: 2px dashed #555;
			border-radius: 7px;
			cursor: default;
			opacity: 1 !important;
			font-size: 1em !important;
			position: relative !important;
			padding: 10px !important;
			width: 630px;
		}
		.rich-fileupload-hidden.hover {
			color: #f00;
			border-color: #f00;
			border-style: solid;
			box-shadow: inset 0 3px 4px #888;
		}
		.rich-fileupload-ico-add, .rich-fileupload-button, .rich-fileupload-button-light {
			background: none;
			background-image: none;
			background-color: transparent;
		} 
		.rich-fileupload-font {
			color: transparent !important;
		}
		.rich-fileupload-anc, .rich-fileupload-ico-stop {
			display: none !important;
		}
	</style>
	
	<a4j:loadScript src="https://mozilla.github.io/pdf.js/build/pdf.js"/>
	<script type="text/javascript">
	//<![CDATA[
		var sourceId = 'invoiceAttach-upload';
		var previewPanelId = 'invoiceAttachPreview-panel';
		var previewContentId = 'invoiceAttachPreview-content';		
		drawThumbnail(1, 1.0);
	 	function drawThumbnail(_pageNumber = 1, _zoomRatio = 1.0) {
	 	    var inputFile = document.getElementById( search(sourceId) + ':file' );
	 	 	if (file = inputFile.files[0]) {
	 	 	  fileReader = new FileReader();
	 	 	  fileReader.onload = function(ev) {
	 	 	    console.log(ev);
	 		    PDFJS.getDocument(fileReader.result).then(function(pdf){ 
	 		        pdf.getPage(_pageNumber).then(function (page) {
	 		            drawPage(page, _zoomRatio);
	 		        });
	 		    });
	 	 	  };
	 	 	  fileReader.readAsArrayBuffer(file);
	 	 	}
	 	}
		function drawPage(page, _zoomRatio) {
			var panel = document.getElementById( search(previewPanelId) );
			panel.style.display = "block";
			var scale = _zoomRatio;
		    var viewport = page.getViewport(scale);
		    var container = document.getElementById( search(previewContentId) );
		    while (container.lastChild) {
		    	container.removeChild(container.lastChild);
		    }
		    container.style.width = viewport.width + 'px';
		    container.style.height = viewport.height + 'px';
		    page.getOperatorList().then(function (opList) {
		        var svgGfx = new PDFJS.SVGGraphics(page.commonObjs, page.objs);
		        return svgGfx.getSVG(opList, viewport);
		      }).then(function (svg) {
		        container.appendChild(svg);
		      });
	 	}
	 	function search(_elementId) {
	 		var elements = document.getElementsByTagName("div");
	 		for(i=0;i<elements.length;i++){
	 			if (elements[i].id.endsWith( _elementId )) {
	 				return elements[i].id;
	 			}
	 		}
	 	}
	//]]>
 	</script>
	
	<aon:div id="filedrag" styleClass="filedrag">
		<aon:fileUpload id="invoiceAttach-upload" ajaxSingle="true"
			listWidth="100" acceptedTypes="pdf" 
			immediateUpload="#{true}" allowFlash="#{false}"
			fileUploadListener="#{invoiceController.invoiceAttachFileUploaded}"
			onadd="drawThumbnail();" onchange="drawThumbnail();">
			<a4j:support event="onuploadcomplete" immediate="true"
				reRender="invoiceAttach-panel" />
		</aon:fileUpload>
		<br/><br/><br/>
	</aon:div>
	
</ui:composition>
