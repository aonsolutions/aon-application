<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="fBatchDetailToolBarDiv" styleClass="aon-toolbar" rendered="#{!fbatch.readOnly}">
		<aon:commandButton title="#{bundle.aon_check_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkAll"
			value="#{bundle.aon_check_all}"
			actionListener="#{fBatchDetail.checkAll}" reRender="fBatchDetailToolBarDiv,fBatchDetailDataDiv" >
			<ui:include
				src="/com/code/aon/ui/resources/facelet/shared/waitProcessSupport.xhtml" />     		
     	</aon:commandButton>	
		<aon:commandButton title="#{bundle.aon_uncheck_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkNone"
			value="#{bundle.aon_uncheck_all}"
			actionListener="#{fBatchDetail.checkNone}" reRender="fBatchDetailToolBarDiv,fBatchDetailDataDiv" >
			<ui:include
				src="/com/code/aon/ui/resources/facelet/shared/waitProcessSupport.xhtml" />     		
     	</aon:commandButton>	
		<aon:commandButton title="#{bundle.finance_remove_batch}"
			styleClass="aon-finding-toolbar-item aon-icon-deleteFolder"
			value="#{bundle.finance_remove_batch}"
			rendered="#{fBatchDetail.checkedCount > 0}"
			actionListener="#{fbatch.onRemoveSelected}" reRender="financeBatchForm,fbatchPanelTabSet">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/shared/waitProcessSupport.xhtml" />     		
     	</aon:commandButton>	
	</aon:div>

	<aon:div id="fBatchDetailDataDiv">
	
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:param name="controller" value="#{fBatchDetail}" />
			<ui:param name="skipSelectButton" value="true" />
			<ui:param name="rowSelectorToggleOnClick" value="false" />

			<ui:define name="columns">			
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{!fbatch.readOnly ? fBatchDetail.checkedCount : ''}" />
					</f:facet>
					<aon:selectBooleanCheckbox id="Included_Row_checked"
						value="#{fBatchDetail.rowChecked}"
						rendered="#{!fbatch.readOnly}"
						valueChangeListener="#{fBatchDetail.rowSelected}"
						reRender="aonContent" />	
				</aon:column>
		
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_finance_date}" />
					</f:facet>
					<aon:outputText value="#{to.finance.dueDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>
				
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_document_number}" />
					</f:facet>
					<aon:outputText styleClass="aon-nowrap" 
						value="#{to.finance.documentNumber}" />
				</aon:column>
				
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_debtor}" />
					</f:facet>
					<aon:outputText value="#{to.finance.registryName}" />
				</aon:column>
		
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_payMethod}" />
					</f:facet>
					<aon:outputText value="#{to.finance.payMethod.name}"/>
				</aon:column>
		
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_bank_account}" />
					</f:facet>
					<aon:outputText value="#{to.finance.bankAccount}"/>
				</aon:column>
		
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_status}" />
					</f:facet>
					<aon:outputText value="#{to.status}"/>
				</aon:column>
		
				<aon:column styleClass="aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_amount}" />
					</f:facet>
					<aon:outputText value="#{to.amount}" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:column>
	
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:div>
						<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
							<ui:param name="auditableTO" value="#{to}" />
						</ui:include>															
						<aon:commandLink id="finance_link" immediate="true"
							styleClass="aon-button-goto" style="padding-right: 20px;"
							value="&#160;" title="#{bundle.aon_go}"
							actionListener="#{fBatchDetail.onLoadFinance}"
							action="finance_form" />
					</aon:div>
				</aon:column>
			</ui:define>
		</ui:decorate>
	</aon:div>
	
</ui:composition>
