<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

<aon:panelGroup id="showCertVerifactuAnularWindow">
		<aon:if test="#{saleInvoice.showCertVerifactuAnularWindow}">
			<rich:modalPanel id="fiscalCertVerifactuAnularModalPanel"
				minWidth="400" minHeight="200" zindex="90"
				showWhenRendered="#{saleInvoice.showCertVerifactuAnularWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Anular factura" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showCertVerifactuAnularWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{saleInvoice.showCertVerifactuAnularWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="certVerifactuAnularForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:90%; margin-left: auto; margin-right: auto;">
									<aon:div style="margin-top: 10px; width:90%; margin-left: auto; margin-right: auto; border: solid gray 1px; padding: 10px; font-weight: bold; background-color: LightPink; text-align: center;">
										<aon:outputText value="Tenga en cuenta que la anulación directa de una factura puede generar inconsistencias contables y fiscales. El proceso recomendado es emitir una factura rectificativa, que permite corregir o dejar sin efecto la factura original de forma legal y trazable, manteniendo la integridad del registro contable."></aon:outputText>
										<aon:outputText value="Al anular no se podrá reutilizar el número de factura. El número de la factura anulada se mantiene en el registro." style="display:block;margin-top: 10px;" />
										<aon:outputText value="(Este número no se recicla ni desaparece)" style="display:block;margin-top: 10px;" />
										<aon:outputText value="¿Desea continuar con la anulación directa de la factura?" style="display:block; margin-top: 10px;" />
									</aon:div>
									
									<aon:if test="#{saleInvoice.verifactu}">
										<aon:panelGrid id="menuGrid" columns="2" dir="true"
											styleClass="aon-width-all aon-margin-top"
											columnClasses="aon-panelGrid-odd aon-width-half aon-text-right aon-padding-right, aon-panelGrid-even aon-width-half">
			
											<aon:outputLabel for="keystore" value="Seleccione certificado" />
											<aon:selectOneMenu id="keystore" value="#{saleInvoice.certificate}" >
												<f:selectItems value="#{saleInvoice.digitalCertificates}" />
												<a4j:support event="onchange" reRender="showCertVerifactuAnularWindow" ajaxSingle="true" />
											</aon:selectOneMenu>
											
											<aon:outputLabel rendered="#{!saleInvoice.pass}" for="password" value="#{bundle.aon_login_passwd}" />
											<aon:inputSecret rendered="#{!saleInvoice.pass}" id="password" value="#{saleInvoice.password}" />
										</aon:panelGrid>
									</aon:if>
									
									<aon:div style="text-align: center; margin-top: 10px;">
										<aon:commandButton id="certVerifactuAnularAccept"	
											value="Anular Factura"
											action="#{saleInvoice.onAnular}"
											styleClass="aon-icon-commandButton aon-icon-send-cancel"
											style="margin-top: 20px;"
											onclick="Richfaces.showModalPanel('waitProccess')" 
											oncomplete="Richfaces.hideModalPanel('waitProccess')">
												<rich:componentControl for="fiscalCertVerifactuAnularModalPanel"
													event="onclick" operation="hide"/>		
												<f:setPropertyActionListener
													target="#{saleInvoice.showCertVerifactuAnularWindow}"
													value="#{false}" />
										</aon:commandButton>
									</aon:div>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
