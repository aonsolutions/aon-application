<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:panelGrid id="posInvoiceDetailItemDataTable" columns="2"
		styleClass="aon-width-all" style="background-color:#f6f5e3; border:#d8d37a 1px solid;"
		columnClasses="aon-vertical-align-top aon-width-half,aon-vertical-align-top aon-width-half">

		<aon:panel style="background-color:#f6f5e3; border:0px;">
			<f:facet name="header">
				<aon:outputText style="text-transform:uppercase;"
					value="#{bundle.registry_tag_module}" />
			</f:facet>
			<h:panelGrid columns="#{invoiceController.tagsNumCols}" cellspacing="0" cellspadding="0">

				<aon:if test="#{invoiceController.tagPage != 1 and invoiceController.tagsCount > invoiceController.tagsLimit}">
					<aon:commandButton styleClass="aon-big-commandButton aon-icon-big-arrow-full-left aon-width-100"
						value="&#160;" immediate="true"
						actionListener="#{invoiceController.onPreviousTagPage}"
						reRender="posInvoiceDetailItemDataTable" ajaxSingle="true" />
				</aon:if>
				<c:forEach items="#{invoiceController.pagedTags}" var="posInvoiceTag">
					<aon:commandButton styleClass="aon-big-commandButton aon-width-100"
						style="font-size:0.8em;"
						value="#{posInvoiceTag.shortName}" immediate="true"
						actionListener="#{invoiceController.onSelectTag}"
						reRender="posInvoiceDetailItemDataTable" ajaxSingle="true">
						<f:param name="selectedTag" value="#{posInvoiceTag.id}"/>
					</aon:commandButton>
				</c:forEach>
				<aon:if test="#{invoiceController.tagsCount > invoiceController.tagsLimit and 
								invoiceController.tagsCount > (invoiceController.tagPage * (invoiceController.tagsLimit - 2) + 1)}">
					<aon:commandButton styleClass="aon-big-commandButton aon-icon-big-arrow-full-right aon-width-100"
						value="&#160;" immediate="true"
						actionListener="#{invoiceController.onNextTagPage}"
						reRender="posInvoiceDetailItemDataTable" ajaxSingle="true" />
				</aon:if>

			</h:panelGrid>
		</aon:panel>

		<aon:panel style="background-color:#f6f5e3; border:0px;">
			<f:facet name="header">
				<aon:outputText style="text-transform:uppercase;"
					value="#{bundle.aon_role_product}" />
			</f:facet>
			<h:panelGrid columns="#{invoiceController.posShift.pos.numCols}" cellspacing="0" cellspadding="0">

				<aon:if test="#{invoiceController.selectedProductPage != 1 and invoiceController.selectedProductsCount > invoiceController.posShift.pos.limit}">
					<aon:commandButton styleClass="aon-big-commandButton aon-icon-big-arrow-full-left aon-width-100"
						value="&#160;" immediate="true"
						actionListener="#{invoiceController.onPreviousSelectedProductPage}"
						reRender="posInvoiceDetailItemDataTable" ajaxSingle="true" />
				</aon:if>
				<c:forEach items="#{invoiceController.pagedSelectedProducts}" var="posInvoiceSelectedProduct">
					<aon:commandButton styleClass="aon-big-commandButton aon-width-100"
						style="font-size:0.8em;"
						value="#{posInvoiceSelectedProduct.shortName}" immediate="true"
						disabled="#{invoiceController.nevv or invoiceController.recorded}"
						actionListener="#{invoiceController.onSelectProduct}"
						ajaxSingle="true">
						<f:param name="selectedProduct" value="#{posInvoiceSelectedProduct.id}"/>
					</aon:commandButton>
				</c:forEach>
				<aon:if test="#{invoiceController.selectedProductsCount > invoiceController.posShift.pos.limit and
								invoiceController.selectedProductsCount > (invoiceController.selectedProductPage * (invoiceController.posShift.pos.limit - 2) + 1)}">
					<aon:commandButton styleClass="aon-big-commandButton aon-icon-big-arrow-full-right aon-width-100"
						value="&#160;" immediate="true"
						actionListener="#{invoiceController.onNextSelectedProductPage}"
						reRender="posInvoiceDetailItemDataTable" ajaxSingle="true" />
				</aon:if>

			</h:panelGrid>
		</aon:panel>

	</aon:panelGrid>

</ui:composition>
