<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="CustomerFee_line" value="#{bundle.aon_line}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-150,aon-width-auto aon-italic">
		<aon:inputText id="CustomerFee_line" 
			value="#{controller.to.line}" 
			required="true" size="2" maxlength="3" />

		<aon:if test="#{aonRole.confidentiality}">
			<aon:div>
				<aon:selectBooleanCheckbox id="CustomerFee_securityLevel"
					value="#{controller.to.confidential}" />
				<aon:outputLabel for="CustomerFee_securityLevel" value="#{bundle.aon_confidential}" />
			</aon:div>
		</aon:if>
	</aon:panelGrid>

	<aon:outputLabel for="Item_id" value="#{bundle.aon_product}" />
	<aon:div styleClass="aon-nowrap">
		<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
			<ui:param name="lookupBean" value="#{saleItemLookup}" />
			<ui:param name="lookupTo" value="#{controller.to.item}" />
			<ui:param name="idRequired" value="#{true}" />
			<ui:param name="skipLabel" value="#{true}" />
			<ui:param name="skipSuggestText" value="#{controller.to.item != null and controller.to.item.id != null}" />
			<ui:param name="lookupInputSuggestSize" value="55" />
			<ui:param name="lookupInputOnFocus" value="CustomerFee_description" />
			<ui:param name="lookupReRender" value="showNew#{detailId}Window" />
			<ui:param name="lookupControllerListener" value="#{itemLookupNoWildCardListener}" />
			<aon:methodParam name="lookupChangeListener"
				value="#{controller.onItemChanged}" type="lookupChangeListener" />
		</ui:include>
		<aon:panelGroup id="customerFeeItemDescription" styleClass="aon-nowrap aon-vertical-align-top" >
			<aon:inputTextarea id="CustomerFee_description"
				style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}"
				value="#{controller.to.description}"
				cols="60" rows="#{!controller.longDescription?1:5}"
				rendered="#{controller.to.item != null and controller.to.item.id != null}">
				<f:validateLength maximum="1024" />
			</aon:inputTextarea>
			<aon:commandLink id="CustomerFee_description_short" immediate="true"
				value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
				styleClass="aon-icon-edit-end-simple" style="margin-left: 5px; padding-right: 12px;"
				rendered="#{controller.longDescription and controller.to.item.product.code != null}"
				actionListener="#{controller.onShortDescription}" 
				reRender="customerFeeItemDescription" ajaxSingle="true" />
			<aon:commandLink id="CustomerFee_description_long" immediate="true"
				value="&#160;" title="#{bundle.aon_edit}"
				styleClass="aon-icon-edit-add-simple" style="margin-left: 5px; padding-right: 12px;"
				rendered="#{!controller.longDescription and controller.to.item.product.code != null}"
				actionListener="#{controller.onLongDescription}"
				reRender="customerFeeItemDescription" ajaxSingle="true" />
		</aon:panelGroup>
	</aon:div>

	<aon:outputLabel for="CustomerFee_quantity" value="#{bundle.aon_quantity}" />
	<aon:panelGrid columns="5" columnClasses="aon-width-150,aon-width-60,aon-width-100,aon-width-50,aon-width-auto">
		<aon:inputText id="CustomerFee_quantity" 
			value="#{controller.to.quantity}" 
			required="true" size="2"
			valueChangeListener="#{controller.onQuantityChanged}"
			reRender="CustomerFee_price,CustomerFee_discount"
			focus="CustomerFee_price" />

		<aon:outputLabel for="CustomerFee_price" value="#{bundle.aon_price}"
			styleClass="aon-margin-right" />

		<aon:inputText id="CustomerFee_price"
			value="#{controller.to.price}" 
			required="true" size="4" />

		<aon:outputLabel for="CustomerFee_discount" value="#{bundle.aon_discount_abrv}"
			styleClass="aon-margin-right" />

		<aon:inputText id="CustomerFee_discount"
			value="#{controller.to.discountExpression.discountExpr}"  
			required="true" size="2" />
	</aon:panelGrid>

	<aon:outputLabel for="CustomerFee_initialDate" value="#{bundle.aon_date_from}" />
	<aon:panelGrid columns="3" columnClasses="aon-width-150,aon-width-60,aon-width-auto">
		<aon:selectInputDate id="CustomerFee_initialDate"
			value="#{controller.to.initialDate}" required="true"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />

		<aon:outputLabel for="CustomerFee_finalDate" value="#{bundle.aon_date_to}"
			styleClass="aon-margin-right aon-bold" />

		<aon:selectInputDate id="CustomerFee_finalDate"
			value="#{controller.to.finalDate}" 
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />
	</aon:panelGrid>

	<aon:outputLabel for="CustomerFee_billingDateYear" value="#{bundle.finance_fee_billing_date_abrv}" />
	<aon:panelGrid columns="3" columnClasses="aon-width-150,aon-width-60,aon-width-auto">
		<aon:div styleClass="aon-nowrap">
			<aon:selectOneMenu value="#{controller.to.billingDateMonth}">
				<f:selectItems value="#{commonCollections.months}" />
			</aon:selectOneMenu>
			<aon:inputText id="CustomerFee_billingDateYear" 
				value="#{controller.to.billingDateYear}"
				required="true" size="3" maxlength="4" />
		</aon:div>

		<aon:outputLabel for="CustomerFee_period" value="#{bundle.aon_period}"
			styleClass="aon-margin-right aon-bold" />

		<aon:selectOneMenu id="CustomerFee_period"
			value="#{controller.to.period}" >
			<f:selectItems value="#{financeCollections.billingPeriods}" />
		</aon:selectOneMenu>
	</aon:panelGrid>

	<aon:outputLabel for="CustomerFee_project_id" value="#{bundle.aon_project}" />
	<aon:div id="CustomerFeeProjectDiv">
		<aon:selectOneMenu id="CustomerFee_project_id"
			rendered="#{controller.to.project.id == null}"
			value="#{controller.to.project}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{controller.projects}" />
		</aon:selectOneMenu>
		<aon:outputText styleClass="aon-bold"
			value="#{controller.to.project.name}" 
			rendered="#{controller.to.project.id != null}" />
		<aon:div layout="inline" styleClass="aon-margin-left">
			<aon:commandButton id="removeCustomerFeeProject" 
				value="&#160;" title="#{bundle.aon_remove}" 
				styleClass="aon-icon-commandButton aon-icon-delete"
				rendered="#{controller.to.project.id != null}"
				actionListener="#{controller.removeProject}" 
				reRender="CustomerFeeProjectDiv" />
		</aon:div>
	</aon:div>

	<aon:if test="#{controller.to.invoicingGroup.id == null or controller.invoicingGroupInMyScopes}">
		<ui:include src="/com/code/aon/ui/customer/facelet/invoicingGroup/lookup.xhtml">
			<ui:param name="lookupTo" value="#{controller.to.invoicingGroup}" />
		</ui:include>
	</aon:if>
	<aon:if test="#{controller.to.invoicingGroup.id != null and !controller.invoicingGroupInMyScopes}">
		<aon:outputText	value="#{bundle.customer_invoicingGroup}" />
		<aon:outputText	value="#{controller.to.invoicingGroup.customer.registry.fullName}" />
	</aon:if>

	<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml">
		<ui:param name="lookupTo" value="#{controller.to.seller}" />
	</ui:include>

	<aon:if test="#{companyCollections.currentUserWorkPlacesCount > 1}">
		<aon:outputLabel for="CustomerFee_workPlace" value="#{bundle.purchase_workplace}" />
		<aon:selectOneMenu id="CustomerFee_workPlace" 
			value="#{controller.to.workPlace}" >
			<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
		</aon:selectOneMenu>
	</aon:if>

</ui:composition>
