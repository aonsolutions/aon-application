<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{customerFee}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="skipResetButton" value="#{true}" />
		<ui:param name="skipSaveButton" value="#{true}" />
		<ui:param name="skipCancelButton" value="#{true}" />
		<ui:param name="skipRemoveButton" value="#{true}" />
		<ui:define name="beginFormListContent">
			<aon:commandButton
				id="customerFee-edit"
				styleClass="aon-editDataTable-button aon-table-row-link"
				title="#{bundle.aon_edit}"
				rendered="#{(to.invoicingGroup.id == null or controller.modelInvoicingGroupInMyScopes) and !to.prepaymentFee}" 
				actionListener="#{controller.onSelect}"
				reRender="showNewFeeWindow"
				focus="Item_id">
				<f:setPropertyActionListener target="#{customer.showNewFeeWindow}" 
					value="#{true}" />
			</aon:commandButton>
			<aon:commandLink id="customerFee_prepayment_link" immediate="true"
				styleClass="aon-button-goto" style="padding-right: 12px;"
				value="&#160;" title="#{bundle.aon_go}"
				rendered="#{(to.invoicingGroup.id == null or controller.modelInvoicingGroupInMyScopes) and to.prepaymentFee}" 
				actionListener="#{controller.onLoadPrepayment}"
				action="prepayment_form"
				reRender="aonContent" />
		</ui:define>
		<ui:define name="beginFooterContent">
			<aon:commandButton
				id="customerFee-new" 
				styleClass="aon-editDataTable-button aon-icon-reset"
				title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
				actionListener="#{controller.onReset}"
				reRender="showNewFeeWindow"
 				accesskey="#{bundle.aon_key_new_line}" 
				focus="Item_id">
				<f:setPropertyActionListener target="#{customer.showNewFeeWindow}" 
					value="#{true}" />
			</aon:commandButton>							
		</ui:define>

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_line}" />
				</f:facet>
				<aon:outputText value="#{to.line}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_product}" />
				</f:facet>
				<aon:outputText value="#{to.description}">
					<aon:abbreviateConverter maxWidth="64" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_quantity_abrv}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText	value="#{to.price}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_discount_abrv}" />
				</f:facet>
				<aon:outputText value="#{to.discountExpression.discountExpr}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_date_from}" />
				</f:facet>
				<aon:outputText value="#{to.initialDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_date_to}" />
				</f:facet>
				<aon:outputText value="#{to.finalDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.finance_fee_billing_date_abrv}" />
				</f:facet>
				<aon:div styleClass="aon-nowrap">
					<aon:outputText value="#{to.billingDateMonth}" />
					<aon:outputText value="/#{to.billingDateYear}" />
				</aon:div>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_period}" />
				</f:facet>
				<aon:outputText value="#{to.period}" />
			</aon:column>

			<c:if test="#{aonRole.confidentiality}">
				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
					<f:facet name="header">
						<aon:outputText value="&#160;" title="#{bundle.aon_confidential}"
							styleClass="aon-icon-confidential" style="padding-left:15px" />
					</f:facet>
					<aon:outputText value="&#160;"
						styleClass="#{to.confidential?'aon-icon-checked':'aon-icon-check'}" 
						style="padding-left:20px" />
				</aon:column>
			</c:if>

		</ui:define>

		<ui:define name="endFormListContent">
			<aon:div>
				<aon:div style="display:inline" rendered="#{to.project.id != null}">
					<aon:outputText value="&#160;" styleClass="aon-icon-project-ok"
						style="padding-left:12px" />
					<rich:toolTip>
						<aon:outputText styleClass="aon-italic" value="#{bundle.aon_project}:" />
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{to.project.name}" />
					</rich:toolTip>
				</aon:div>
				<aon:div style="display:inline; padding-left:2px;" rendered="#{to.invoicingGroup.id != null}">
					<aon:outputText value="&#160;" styleClass="aon-icon-customer"
						style="padding-left:12px" />
					<rich:toolTip>
						<aon:outputText styleClass="aon-italic" value="#{bundle.customer_invoicingGroup}:" />
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{to.invoicingGroup.description}" />
					</rich:toolTip>
				</aon:div>
				<aon:div style="display:inline; padding-left:2px;" rendered="#{to.seller.id != null}">
					<aon:outputText value="&#160;" styleClass="aon-icon-commercial"
						style="padding-left:12px" />
					<rich:toolTip>
						<aon:outputText styleClass="aon-italic" value="#{bundle.aon_module_commercial}:" />
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{to.seller.registry.fullName}" />
					</rich:toolTip>
				</aon:div>
				<aon:div style="display:inline; padding-left:2px;" rendered="#{to.workPlace.id != null}">
					<aon:outputText value="&#160;" styleClass="aon-icon-company"
						style="padding-left:12px" />
					<rich:toolTip>
						<aon:outputText styleClass="aon-italic" value="#{bundle.purchase_workplace}:" />
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{to.workPlace.description}" />
					</rich:toolTip>
				</aon:div>
			</aon:div>
		</ui:define>

	</ui:decorate>

</ui:composition>
