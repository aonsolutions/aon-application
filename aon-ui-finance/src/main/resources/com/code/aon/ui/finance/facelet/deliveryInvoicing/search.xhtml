<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="deliveryInvoicingForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="deliveryInvoicingToolbar" />
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_delivery_invoicing_module}" />
				<ui:param name="toolbarDescription"	value="#{bundle.aon_search}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="deliveryInvoicing-clear"
						value="#{bundle.aon_clear}"
						type="reset" ajaxSingle="true"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
					<aon:commandButton id="deliveryInvoicing"
						value="#{financeBundle.finance_invoicing}"
						actionListener="#{deliveryInvoicing.onShowPanel}"
						styleClass="aon-finding-toolbar-item aon-icon-accept" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{financeBundle.finance_invoicing_criteria}" />
					</f:facet>
					<aon:panelGrid columns="2">
						<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
							<ui:param name="lookupTo" value="#{deliveryInvoicing.params.customer}" />
							<ui:param name="skipNewButton" value="#{true}" />
						</ui:include>

						<aon:outputLabel value="#{bundle.aon_period}" />
						<aon:panelGrid columns="4">
							<aon:outputLabel for="Invoicing_fromDate"
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate id="Invoicing_fromDate"
								value="#{deliveryInvoicing.params.fromDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />
	
							<aon:outputLabel for="Invoicing_toDate"
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate id="Invoicing_toDate"
								value="#{deliveryInvoicing.params.toDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />
						</aon:panelGrid>
	
						<aon:outputLabel for="Invoicing_series"
							value="#{financeBundle.finance_delivery_series}" />
						<aon:selectOneMenu id="Invoicing_series"
							value="#{deliveryInvoicing.params.series}">
							<f:selectItem itemLabel=" " value="#{null}"/>
							<f:selectItems value="#{configCollections.deliverySeries}" />
						</aon:selectOneMenu>
	
						<aon:outputLabel value="#{financeBundle.finance_delivery_number}" />
						<aon:panelGrid columns="4">
							<aon:outputLabel for="Invoicing_fromNumber"
								value="#{bundle.aon_date_from}" />
							<aon:inputText id="Invoicing_fromNumber"
								 styleClass="aon-margin-left"
								value="#{deliveryInvoicing.params.fromNumber}" size="7" />
	
							<aon:outputLabel for="Invoicing_toNumber"
								value="#{bundle.aon_date_to}" />
							<aon:inputText id="Invoicing_toNumber"
								 styleClass="aon-margin-left"
								value="#{deliveryInvoicing.params.toNumber}" size="7" />
						</aon:panelGrid>
	
						<c:if test="#{aonRole.confidentiality}">
							<aon:outputLabel for="Invoicing_Confidential"
								value="#{bundle.aon_confidential}" />
							<aon:selectOneRadio id="Invoicing_Confidential" 
								value="#{deliveryInvoicing.params.confidential}">
								<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
								<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
							</aon:selectOneRadio>
						</c:if>
	
						<aon:outputLabel for="Invoicing_WorkPlace"
							value="#{companyBundle.company_workplace}" />
						<aon:selectOneMenu id="Invoicing_WorkPlace"
							value="#{deliveryInvoicing.params.workPlace}">
							<f:selectItem itemLabel="-" itemValue="#{null}" />
							<f:selectItems value="#{companyCollections.workPlaces}" />
						</aon:selectOneMenu>
					</aon:panelGrid>
				</aon:panel>

				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{financeBundle.finance_invoice_data}" />
					</f:facet>
					<aon:panelGrid columns="2">
						<aon:outputLabel for="Invoice_series"
							value="#{bundle.aon_series}/#{bundle.aon_number}" />
						<aon:div>
							<aon:selectOneMenu id="Invoice_series"
								value="#{deliveryInvoicing.params.invoiceSeries}"
								valueChangeListener="#{deliveryInvoicing.onInvoiceSeriesChanged}"
								reRender="Invoice_number,Invoicing_Confidential">
								<f:selectItem itemLabel=" " value="#{null}"/>
								<f:selectItems value="#{configCollections.invoiceSeries}" />
							</aon:selectOneMenu>
							<aon:inputText id="Invoice_number" required="true"
								 styleClass="aon-margin-left"
								value="#{deliveryInvoicing.params.invoiceNumber}" size="7" />
						</aon:div>
	
						<aon:outputLabel for="Invoice_date"
							value="#{bundle.aon_date}" />
						<aon:selectInputDate id="Invoice_date"
							value="#{deliveryInvoicing.params.invoiceDate}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
	
						<c:if test="#{aonRole.accountingOperator}">
							<aon:outputLabel for="Invoice_record"
								value="#{financeBundle.finance_record}" />
							<aon:selectOneRadio id="Invoice_record" 
								value="#{deliveryInvoicing.params.invoiceRecordable}">
								<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
								<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
							</aon:selectOneRadio>
						</c:if>

						<aon:outputLabel for="Invoice_comments"
							value="#{bundle.aon_comment}" />
						<aon:inputTextarea id="Invoice_comments" cols="82" rows="5"
							value="#{deliveryInvoicing.params.invoiceComments}" />

					</aon:panelGrid>
				</aon:panel>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/progressBar.xhtml">
			<ui:param name="progressLabel" value="#{financeBundle.finance_delivery_invoicing_module}" />
			<ui:param name="progressBarBean" value="#{deliveryInvoicing}" />
			<ui:param name="panelVisible" value="#{deliveryInvoicing.progressionPanelVisible}"/>
			<ui:param name="initialMessage" value="#{financeBundle.finance_invoicing_initial}"/>
			<ui:param name="startMessage" value="#{financeBundle.finance_invoicing_start}"/>
			<ui:param name="completeMessage" value="#{financeBundle.finance_invoicing_complete}"/>
			<aon:methodParam name="startActionListener" default="#{deliveryInvoicing.onInvoice}" type="actionListener" />
			<aon:methodParam name="closeActionListener" default="#{deliveryInvoicing.onClosePanel}" type="actionListener" />
			<ui:param name="redirect" value="true" />
			<ui:param name="redirectMessage" value="#{financeBundle.finance_invoicing_wait}"/>
			<aon:methodParam name="redirectAction" default="#{deliveryInvoicing.invoice}"/>
		</ui:include>
	</ui:define>
</ui:composition>
