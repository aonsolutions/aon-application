<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="deliveryInvoicingForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="deliveryInvoicingToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.finance_delivery_invoicing_module}" />
				<ui:param name="toolbarDescription"	value="#{bundle.aon_search}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="deliveryInvoicing-clear"
						value="#{bundle.aon_clear}"
						type="reset" ajaxSingle="true"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
					<aon:commandButton id="deliveryInvoicing"
						reRender="progressBarForm"
						value="#{bundle.aon_key_invoice_description}"
						actionListener="#{deliveryInvoicing.onShowPanel}"
						styleClass="aon-finding-toolbar-item aon-icon-accept" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_invoicing_criteria}" />
					</f:facet>
					<aon:panelGrid columns="2">
						<ui:include src="/com/code/aon/ui/customer/facelet/invoicingGroup/lookup.xhtml">
							<ui:param name="lookupTo" value="#{deliveryInvoicing.params.invoicingGroup}" />
							<ui:param name="skipNewButton" value="#{true}" />
						</ui:include>

						<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
							<ui:param name="lookupTo" value="#{deliveryInvoicing.params.customer}" />
							<ui:param name="skipNewButton" value="#{true}" />
						</ui:include>

						<aon:outputLabel value="#{bundle.aon_period}" />
						<aon:panelGrid columns="4">
							<aon:outputLabel for="Invoicing_fromDate"
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate id="Invoicing_fromDate"
								value="#{deliveryInvoicing.params.fromDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />
	
							<aon:outputLabel for="Invoicing_toDate"
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate id="Invoicing_toDate"
								value="#{deliveryInvoicing.params.toDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />
						</aon:panelGrid>
	
						<aon:outputLabel for="Invoicing_series"
							value="#{bundle.finance_delivery_series}" />
						<aon:selectOneMenu id="Invoicing_series"
							value="#{deliveryInvoicing.params.series}">
							<f:selectItem itemLabel=" " value="#{null}"/>
							<f:selectItems value="#{configCollections.deliverySeries}" />
						</aon:selectOneMenu>
	
						<aon:outputLabel value="#{bundle.finance_delivery_number}" />
						<aon:panelGrid columns="4">
							<aon:outputLabel for="Invoicing_fromNumber"
								value="#{bundle.aon_date_from}" />
							<aon:inputText id="Invoicing_fromNumber"
								 styleClass="aon-margin-left"
								value="#{deliveryInvoicing.params.fromNumber}" size="7" />
	
							<aon:outputLabel for="Invoicing_toNumber"
								value="#{bundle.aon_date_to}" />
							<aon:inputText id="Invoicing_toNumber"
								 styleClass="aon-margin-left"
								value="#{deliveryInvoicing.params.toNumber}" size="7" />
						</aon:panelGrid>
	
						<aon:if test="#{aonRole.confidentiality}">
							<aon:outputLabel for="Invoicing_Confidential"
								value="#{bundle.aon_confidential}" />
							<aon:selectOneRadio id="Invoicing_Confidential" 
								value="#{deliveryInvoicing.params.confidential}">
								<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
								<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
							</aon:selectOneRadio>
						</aon:if>
	
						<aon:outputLabel for="Invoicing_WorkPlace"
							value="#{bundle.purchase_workplace}" />
						<aon:selectOneMenu id="Invoicing_WorkPlace"
							value="#{deliveryInvoicing.params.workPlace}">
							<f:selectItem itemLabel="-" itemValue="#{null}" />
							<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						</aon:selectOneMenu>
						
						<aon:outputLabel for="Invoicing_Customer_Segment" value="#{bundle.aon_segment}" />				
						<aon:div id="segmentDiv">
							<a4j:repeat value="#{deliveryInvoicing.params.segments}" rowKeyVar="index" var="segmentTo">
								<aon:div styleClass="#{(index != 0)?'aon-padding-top':''}">
									<aon:selectOneMenu id="Invoicing_Customer_Segment"
										value="#{deliveryInvoicing.params.segments[index]}">
										<f:selectItem itemLabel="-" itemValue="#{deliveryInvoicing.params.emptySegment}"/>
										<f:selectItems value="#{registryCollections.segments}" />
										<a4j:support event="onchange" reRender="segmentDiv"
											ajaxSingle="true"
											limitToList="true"/>
									</aon:selectOneMenu>
									<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
										actionListener="#{deliveryInvoicing.onRemoveSegment}" reRender="segmentDiv" value="&#160;"
										rendered="#{segmentTo.id != null}">
										<f:param name="index" value="#{index}" />
									</aon:commandButton>
									<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" ajaxSingle="true"
										actionListener="#{deliveryInvoicing.onAddSegment}" reRender="segmentDiv" value="&#160;"
										rendered="#{(segmentTo.id != null) and (index == (deliveryInvoicing.params.segmentsSize-1))}"/>					
								</aon:div>						
							</a4j:repeat>
						</aon:div>						
						
						
						
					</aon:panelGrid>
				</aon:panel>

				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_invoice_data}" />
					</f:facet>
					<aon:panelGrid columns="2">
					
						<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
							<ui:param name="controller" value="#{saleInvoice}" />
							<ui:param name="sfc_seriesCodes" value="#{configCollections.invoiceSeries}" />
							<ui:param name="seriesChangedReRender" value="Invoicing_Confidential" />
							<ui:param name="sfc_editable" value="#{true}" />
							<ui:param name="sfc_seriesProperty" value="#{deliveryInvoicing.params.invoiceSeries}" />
							<ui:param name="sfc_numberProperty" value="#{deliveryInvoicing.params.invoiceNumber}" />
							<aon:methodParam name="sfc_onSeriesChanged" type="valueChangeListener"
								value="#{deliveryInvoicing.onInvoiceSeriesChanged}" />	
							<aon:methodParam name="sfc_onNumberEditable" type="actionListener"
								value="#{deliveryInvoicing.onInvoiceNumberEditable}" />
						</ui:include>

						<aon:outputLabel for="Invoice_date"
							value="#{bundle.aon_date}" />
						<aon:selectInputDate id="Invoice_date"
							value="#{deliveryInvoicing.params.invoiceDate}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
	
						<aon:if test="#{aonRole.accountingOperator}">
							<aon:outputLabel for="Invoice_record"
								value="#{bundle.finance_record}" />
							<aon:selectOneRadio id="Invoice_record" 
								value="#{deliveryInvoicing.params.invoiceRecordable}">
								<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
								<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
							</aon:selectOneRadio>
						</aon:if>

						<aon:outputLabel for="Invoice_comments"
							value="#{bundle.aon_comment}" />
						<aon:inputTextarea id="Invoice_comments" cols="82" rows="5"
							value="#{deliveryInvoicing.params.invoiceComments}" />

					</aon:panelGrid>
				</aon:panel>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/progressBar.xhtml">
			<ui:param name="progressLabel" value="#{bundle.finance_delivery_invoicing_module}" />
			<ui:param name="progressBarBean" value="#{deliveryInvoicing.progressionState}" />
			<ui:param name="progressBarInitialMessage" value="#{bundle.finance_invoicing_initial}"/>
			<ui:param name="progressBarStartMessage" value="#{bundle.aon_confirm}"/>
			<ui:param name="progressBarCompleteMessage"
				value="#{(deliveryInvoicing.invoiceIds!=null)?bundle.finance_invoicing_complete:bundle.finance_invoicing_no_invoice}"/>
			<aon:methodParam name="progressBarStartActionListener"
				default="#{deliveryInvoicing.onInvoice}" type="actionListener" />
			<aon:methodParam name="progressBarCloseActionListener"
				default="#{deliveryInvoicing.onClosePanel}" type="actionListener" />
			<aon:methodParam name="progressBarCloseAction" default="#{deliveryInvoicing.invoiceAction}"/>
		</ui:include>
	</ui:define>
</ui:composition>
