<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showIncomeTransferWindow">
		<aon:if test="#{purchaseInvoice.showIncomeTransferWindow}">
			<rich:modalPanel id="incomeTransferModalPanel" minHeight="580"
				minWidth="760" rendered="#{purchaseInvoice.showIncomeTransferWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.config_series_deliveries}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showIncomeTransferWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{purchaseInvoice.showIncomeTransferWindow}"
								value="#{false}" />
							<f:setPropertyActionListener
								target="#{purchaseInvoice.incomeTransferManager}"
								value="#{null}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="incomeTransferForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%;">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar" rendered="#{!purchaseInvoice.readOnly}">
										<aon:commandButton id="incomeTransfer-selectAll"
											value="#{bundle.aon_check_all}"
											styleClass="aon-finding-toolbar-item aon-icon-plus-blue"
											actionListener="#{purchaseInvoice.incomeTransferManager.checkAllIncomes}" 
											reRender="incomeTransferForm" />	
										<aon:commandButton id="incomeTransfer-selectNone"
											value="#{bundle.aon_uncheck_all}"
											styleClass="aon-finding-toolbar-item aon-icon-minus-grey"
											actionListener="#{purchaseInvoice.incomeTransferManager.checkNoneIncomes}" 
											reRender="incomeTransferForm" />	
										<aon:commandButton id="incomeTransfer-filter"
											value="#{bundle.aon_filter}"
											styleClass="aon-finding-toolbar-item aon-icon-search"
											reRender="showIncomeFilterWindow" >
											<f:setPropertyActionListener target="#{purchaseInvoice.showIncomeFilterWindow}"
												value="#{true}" />
										</aon:commandButton>	
										<aon:commandButton id="incomeTransfer-accept"
											value="#{bundle.finance_invoice_to_transfer}"
											rendered="#{purchaseInvoice.incomeTransferManager.checkedIncomeCount > 0 or
													purchaseInvoice.incomeTransferManager.checkedRestoreInvoicedIncomeCount > 0}"
											reRender="showIncomeTransferWindow,purchaseInvoiceForm"
											actionListener="#{purchaseInvoice.onIncomeTransfer}"
											styleClass="aon-finding-toolbar-item aon-icon-accept"
											onclick="Richfaces.showModalPanel('waitProccess')" 
						     				oncomplete="Richfaces.hideModalPanel('waitProccess')">
											<rich:componentControl for="incomeTransferModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{purchaseInvoice.showIncomeTransferWindow}"
												value="#{false}" />
											<f:setPropertyActionListener
												target="#{purchaseInvoice.incomeTransferManager}"
												value="#{null}" />
										</aon:commandButton>
										<aon:commandButton id="incomeTransfer-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showIncomeTransferWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{purchaseInvoice.showIncomeTransferWindow}"
												value="#{false}" />
											<f:setPropertyActionListener
												target="#{purchaseInvoice.incomeTransferManager}"
												value="#{null}" />
										</aon:commandButton>
									</aon:div>
									<aon:div styleClass="aon-scroll-area">
										<aon:panelTabSet id="transferPanelTabSet" >
											<aon:panelTab id="availablesTab" 
												label="#{bundle.aon_availables} &#40;#{purchaseInvoice.incomeTransferManager.incomeListCount}&#41;"
												actionListener="#{purchaseInvoice.incomeTransferManager.onShowAvailables}"
												reRender="incomeTransferForm" >
												
												<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
													<ui:param name="controller" value="#{purchaseInvoice.incomeTransferManager}" />
													<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
													<ui:param name="skipSelectButton" value="#{true}" />
													<ui:param name="columnClasses" 
														value="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
																	aon-editDataTable-numberColumn, aon-editDataTable-iconColumn" />
													<ui:define name="columns">
														<ui:decorate template="/com/code/aon/ui/finance/facelet/purchaseInvoice/income/transfer_columns.xhtml">
															<ui:param name="reRender" value="incomeTransferData" />
															<ui:define name="beforeColumnContent">
																<aon:commandButton value="&#160;" immediate="true"
																	rendered="#{!purchaseInvoice.incomeTransferManager.invoicedIncome}"
																	styleClass="aon-finding-toolbar-item aon-icon-plus-blue aon-finding-toolbar-item-no-border"
																	actionListener="#{purchaseInvoice.incomeTransferManager.addIncomeRowSelected}"
																	reRender="incomeTransferForm" ajaxSingle="true" />
															</ui:define>
														</ui:decorate>
													</ui:define>
			
												</ui:decorate>
											</aon:panelTab>
											
											<aon:if test="#{purchaseInvoice.incomeTransferManager.incomeListCount > 0 or purchaseInvoice.incomeTransferManager.checkedIncomeCount > 0}">
												<aon:panelTab id="selectedTab" 
													label="#{bundle.aon_selected} &#40;#{purchaseInvoice.incomeTransferManager.checkedIncomeCount}&#41;"
													actionListener="#{purchaseInvoice.incomeTransferManager.onShowSelected}"
													reRender="incomeTransferForm" >	
														
													<aon:dataTable id="selectedIncomeList" var="to" rowKeyVar="toIndex" sortMode="multi"
														value="#{purchaseInvoice.incomeTransferManager.model}"
														columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
															aon-editDataTable-numberColumn, aon-editDataTable-iconColumn" >
															
														<aon:rowSelector id="selectedIncomeList-select" toggleOnClick="#{false}" />
														
														<ui:decorate template="/com/code/aon/ui/finance/facelet/purchaseInvoice/income/transfer_columns.xhtml">
															<ui:param name="reRender" value="selectedIncomeList" />
															<ui:define name="beforeColumnContent">
																<aon:commandButton value="&#160;" immediate="true"
																	styleClass="aon-finding-toolbar-item aon-icon-minus-grey aon-finding-toolbar-item-no-border"
																	actionListener="#{purchaseInvoice.incomeTransferManager.removeIncomeRowSelected}"
																	reRender="incomeTransferForm" ajaxSingle="true" />
															</ui:define>
														</ui:decorate>
																											
													</aon:dataTable>
													<aon:dataScroller for="selectedIncomeList" showNote="#{true}"
														rowCount="#{purchaseInvoice.incomeTransferManager.model.rowCount}" 
														page="#{purchaseInvoice.incomeTransferManager.page}" />
												
												</aon:panelTab>
											</aon:if>
											
											<aon:if test="#{purchaseInvoice.incomeTransferManager.invoicedIncomeCount > 0}">
												<aon:panelTab id="tansferedTab" 
													label="#{bundle.aon_transfered_to} #{bundle.aon_invoice_abbr} &#40;#{purchaseInvoice.incomeTransferManager.invoicedIncomeCount}&#41;"
													actionListener="#{purchaseInvoice.incomeTransferManager.onShowTransfered}"
													reRender="incomeTransferForm" >	
													<aon:dataTable id="transferedIncomeList" var="to" rowKeyVar="toIndex" sortMode="multi"
														value="#{purchaseInvoice.incomeTransferManager.model}"
														columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
															aon-editDataTable-numberColumn, aon-editDataTable-iconColumn" >
															
														<aon:rowSelector id="transferedIncomeList-select" toggleOnClick="#{false}" />
														
														<ui:decorate template="/com/code/aon/ui/finance/facelet/purchaseInvoice/income/transfer_columns.xhtml">
															<ui:param name="reRender" value="transferedIncomeList" />
															<ui:define name="beforeColumnContent">
																<aon:commandButton value="&#160;" immediate="true"
																	title="#{bundle.aon_no} #{bundle.aon_undo}"
																	rendered="#{purchaseInvoice.incomeTransferManager.restoredIncome}"
																	styleClass="aon-finding-toolbar-item aon-icon-refresh aon-finding-toolbar-item-no-border"
																	actionListener="#{purchaseInvoice.incomeTransferManager.restoreInvoicedIncome}"
																	reRender="incomeTransferForm" ajaxSingle="true" />
																<aon:commandButton value="&#160;" immediate="true"
																	title="#{bundle.aon_undo} #{bundle.aon_link_transfer}"
																	rendered="#{!purchaseInvoice.incomeTransferManager.restoredIncome}"
																	styleClass="aon-finding-toolbar-item aon-icon-delete aon-finding-toolbar-item-no-border"
																	actionListener="#{purchaseInvoice.incomeTransferManager.removeInvoicedIncome}"
																	reRender="incomeTransferForm" ajaxSingle="true" />
															</ui:define>
														</ui:decorate>
												
													</aon:dataTable>
													<aon:dataScroller for="transferedIncomeList" showNote="#{true}"
														rowCount="#{purchaseInvoice.incomeTransferManager.model.rowCount}" 
														page="#{purchaseInvoice.incomeTransferManager.page}" />
												
												</aon:panelTab>
											 </aon:if>
											
										</aon:panelTabSet>
										
										<aon:div id="detailDataContainer">
											<aon:panel rendered="#{purchaseInvoice.incomeTransferManager.detailListCount > 0}">
												<f:facet name="header">
													<aon:outputText value="#{bundle.warehouse_income_detail}" />
												</f:facet>
												<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
													<ui:param name="controller" value="#{purchaseInvoice.incomeTransferManager.detailState}" />
													<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
													<ui:param name="skipSelectButton" value="#{true}" />
													<ui:param name="showDataScroller" value="#{false}" />
													<ui:define name="columns">
		
														<aon:column styleClass="aon-editDataTable-textColumn">
															<f:facet name="header">
																<aon:outputText value="#{bundle.aon_product}" />
															</f:facet>
															<aon:outputText value="#{to.description}">
																<aon:abbreviateConverter maxWidth="50" />
															</aon:outputText>
														</aon:column>
		
														<aon:column styleClass="aon-editDataTable-numberColumn">
															<f:facet name="header">
																<aon:outputText value="#{bundle.aon_quantity}" />
															</f:facet>
															<aon:outputText value="#{(to.quantity)}">
																<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
															</aon:outputText>
														</aon:column>
		
														<aon:column styleClass="aon-editDataTable-numberColumn">
															<f:facet name="header">
																<aon:outputText value="#{bundle.aon_price}" />
															</f:facet>
															<aon:outputText value="#{(to.price)}">
																<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
															</aon:outputText>
														</aon:column>
		
														<aon:column styleClass="aon-editDataTable-numberColumn">
															<f:facet name="header">
																<aon:outputLabel value="#{bundle.aon_discount}" />
															</f:facet>
															<aon:outputText value="#{to.discountExpression.discountExpr}">
																<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
															</aon:outputText>
														</aon:column>
		
													</ui:define>
												</ui:decorate>
											</aon:panel>
										</aon:div>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
