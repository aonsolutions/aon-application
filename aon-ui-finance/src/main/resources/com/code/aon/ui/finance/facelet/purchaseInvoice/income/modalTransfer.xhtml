<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showIncomeTransferWindow">
		<aon:if test="#{purchaseInvoice.showIncomeTransferWindow}">
			<rich:modalPanel id="incomeTransferModalPanel" minHeight="580"
				minWidth="760" rendered="#{purchaseInvoice.showIncomeTransferWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.config_series_deliveries}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showIncomeTransferWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{purchaseInvoice.showIncomeTransferWindow}"
								value="#{false}" />
							<f:setPropertyActionListener
								target="#{purchaseInvoice.incomeTransferManager}"
								value="#{null}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="incomeTransferForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar" rendered="#{!purchaseInvoice.readOnly}">
									<aon:commandButton id="incomeTransfer-selectAll"
										value="#{bundle.aon_check_all}"
										rendered="#{purchaseInvoice.incomeTransferManager.model.rowCount > 0}"
										styleClass="aon-finding-toolbar-item aon-icon-checkAll"
										actionListener="#{purchaseInvoice.incomeTransferManager.checkAllIncomes}" 
										reRender="incomeTransferData" />	
									<aon:commandButton id="incomeTransfer-selectNone"
										value="#{bundle.aon_uncheck_all}"
										rendered="#{purchaseInvoice.incomeTransferManager.model.rowCount > 0}"
										styleClass="aon-finding-toolbar-item aon-icon-checkNone"
										actionListener="#{purchaseInvoice.incomeTransferManager.checkNoneIncomes}" 
										reRender="incomeTransferData" />	
									<aon:commandButton id="incomeTransfer-filter"
										value="#{bundle.aon_filter}"
										styleClass="aon-finding-toolbar-item aon-icon-search"
										reRender="showIncomeFilterWindow" >
										<f:setPropertyActionListener target="#{purchaseInvoice.showIncomeFilterWindow}"
											value="#{true}" />
									</aon:commandButton>	
									<aon:commandButton id="incomeTransfer-accept"
										value="#{bundle.finance_invoice_to_transfer}"
										rendered="#{purchaseInvoice.incomeTransferManager.model.rowCount > 0}"
										reRender="showIncomeTransferWindow,purchaseInvoiceForm"
										actionListener="#{purchaseInvoice.onIncomeTransfer}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										onclick="Richfaces.showModalPanel('waitProccess')" 
					     				oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="incomeTransferModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{purchaseInvoice.showIncomeTransferWindow}"
											value="#{false}" />
										<f:setPropertyActionListener
											target="#{purchaseInvoice.incomeTransferManager}"
											value="#{null}" />
									</aon:commandButton>
									<aon:commandButton id="incomeTransfer-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showIncomeTransferWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{purchaseInvoice.showIncomeTransferWindow}"
											value="#{false}" />
										<f:setPropertyActionListener
											target="#{purchaseInvoice.incomeTransferManager}"
											value="#{null}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
									<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
										<ui:param name="controller" value="#{purchaseInvoice.incomeTransferManager}" />
										<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
										<ui:param name="skipSelectButton" value="#{true}" />
										<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
																				aon-editDataTable-numberColumn, aon-editDataTable-iconColumn" />
										<ui:define name="columns">

											<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
												<f:facet name="header">
													<aon:outputText value="&#160;" />
												</f:facet>
												<aon:selectBooleanCheckbox id="IncomeCheck"
													value="#{purchaseInvoice.incomeTransferManager.incomeRowChecked}"
													rendered="#{!purchaseInvoice.readOnly}"
													valueChangeListener="#{purchaseInvoice.incomeTransferManager.incomeRowSelected}"
													reRender="detailDataContainer" ajaxSingle="true" />	
											</aon:column>

											<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
												</f:facet>
												<aon:outputText value="#{to.referenceCode}" />
											</aon:column>

											<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_date}" />
												</f:facet>
												<aon:outputText value="#{to.issueTime}">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
											</aon:column>

											<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_supplier}" />
												</f:facet>
												<aon:outputText value="#{to.supplier.registry.fullName}">
													<aon:abbreviateConverter maxWidth="50" />
												</aon:outputText>
											</aon:column>

											<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_total}" />
												</f:facet>
												<aon:outputText value="#{purchaseInvoice.incomeTransferManager.incomeTotalPrice}">
													<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
												</aon:outputText>
											</aon:column>

											<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
												<f:facet name="header">
													<aon:outputText value="&#160;" />
												</f:facet>
												<aon:commandButton value="&#160;" immediate="true"
													title="#{bundle.finance_invoice_see_delivery_details}"
													styleClass="aon-finding-toolbar-item aon-icon-tree-root aon-finding-toolbar-item-no-border"
													actionListener="#{purchaseInvoice.incomeTransferManager.onSelectIncome}"
													reRender="incomeTransferData,detailDataContainer" ajaxSingle="true">
												</aon:commandButton>															
											</aon:column>

										</ui:define>
									</ui:decorate>

									<aon:div id="detailDataContainer">
										<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
											<ui:param name="controller" value="#{purchaseInvoice.incomeTransferManager.detailState}" />
											<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
											<ui:param name="skipSelectButton" value="#{true}" />
											<ui:param name="showDataScroller" value="#{false}" />
											<ui:define name="columns">

												<aon:column styleClass="aon-editDataTable-textColumn">
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_product}" />
													</f:facet>
													<aon:outputText value="#{to.description}">
														<aon:abbreviateConverter maxWidth="50" />
													</aon:outputText>
												</aon:column>

												<aon:column styleClass="aon-editDataTable-numberColumn">
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_quantity}" />
													</f:facet>
													<aon:outputText value="#{(to.quantity)}">
														<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
													</aon:outputText>
												</aon:column>

												<aon:column styleClass="aon-editDataTable-numberColumn">
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_price}" />
													</f:facet>
													<aon:outputText value="#{(to.price)}">
														<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
													</aon:outputText>
												</aon:column>

												<aon:column styleClass="aon-editDataTable-numberColumn">
													<f:facet name="header">
														<aon:outputLabel value="#{bundle.aon_discount}" />
													</f:facet>
													<aon:outputText value="#{to.discountExpression.discountExpr}">
														<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
													</aon:outputText>
												</aon:column>

											</ui:define>
										</ui:decorate>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
