<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFiscalInformationWindow">
		<aon:if test="#{invoiceController.showFiscalInformationWindow}">
			<rich:modalPanel id="fiscalInformationModalPanel"
				minWidth="740" minHeight="450" zindex="90"
				showWhenRendered="#{invoiceController.showFiscalInformationWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.finance_fiscal_information}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFiscalInformationWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showFiscalInformationWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="fiscalInformationForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="fiscalInformation-accept"
											value="#{bundle.aon_accept}"
											rendered="#{!invoiceController.annulled}"
											actionListener="#{invoiceController.acceptInvoice}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<rich:componentControl for="fiscalInformationModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{invoiceController.showFiscalInformationWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="fiscalInformation-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showFiscalInformationWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{invoiceController.showFiscalInformationWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">
												
											<aon:outputLabel for="Invoice_taxDate" 
												value="#{bundle.finance_tax_date}" />
											<aon:selectInputDate id="Invoice_taxDate"
												value="#{invoiceController.to.taxDate}" required="true" 
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}">
											</aon:selectInputDate>
											
											<aon:outputLabel for="Invoice_transactionType" value="#{bundle.aon_transaction_type}" />
											<aon:selectOneMenu id="invoice_transactionType"
												disabled="true"
												value="#{invoiceController.to.transaction}">
												<f:selectItems value="#{configCollections.invoiceTransactionTypes}" />
											</aon:selectOneMenu>
											
											<aon:outputText value="#{bundle.asset_feature_module}" />
											<aon:div>
												<aon:selectBooleanCheckbox id="Invoice_service" value="#{invoiceController.to.service}" />
												<aon:outputLabel for="Invoice_service" styleClass="aon-italic aon-margin-right"
													value="#{bundle.finance_service_invoice}" />

												<aon:selectBooleanCheckbox id="Invoice_investment"
													value="#{invoiceController.to.investment}"/>
												<aon:outputLabel for="Invoice_investment" styleClass="aon-italic aon-margin-right"
													value="#{bundle.invoice_investment}"/>

												<aon:selectBooleanCheckbox id="Invoice_vatAccrualPayment"
													value="#{invoiceController.to.vatAccrualPayment}"/>
												<aon:outputLabel for="Invoice_vatAccrualPayment" styleClass="aon-italic aon-margin-right"
													value="#{bundle.aon_vat_accrual_payment}"/>
											</aon:div>
										</aon:panelGrid>
											
										<aon:panel>
											<f:facet name="header">
												<aon:outputText value="#{bundle.finance_tax_breakdown}" />
											</f:facet>
											
											<aon:dataTable id="TaxBreakDownsTable"  value="#{invoiceController.taxBreakDowns}" var="taxBreakDown">
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_type}" />
													</f:facet>
													<aon:outputText value="#{taxBreakDown.taxType}" />
												</aon:column>
																
												<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_taxable_base}" />
													</f:facet>
													<aon:outputText value="#{taxBreakDown.base}">
														<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
													</aon:outputText>
												</aon:column>
																
												<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
													<f:facet name="header">
														<aon:outputText value="%" />
													</f:facet>
													<aon:div>
														<aon:outputText value="#{taxBreakDown.taxPercent}">
															<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
														</aon:outputText>
														<aon:outputText value="%" />
													</aon:div>
												</aon:column>
																
												<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_fee}" />
													</f:facet>
													<aon:outputText value="#{taxBreakDown.taxQuota}">
														<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
													</aon:outputText>
												</aon:column>
															
												<aon:if test="#{invoiceController.to.surcharge}">	
													<aon:column>
														<f:facet name="header">
															<aon:outputText value="&#160;"/>
														</f:facet>
														<aon:outputText value="#{bundle.aon_surcharge}"
															rendered="#{taxBreakDown.surchargePercent != 0}"/>
													</aon:column>
																
													<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
														<f:facet name="header">
															<aon:outputText value="#{bundle.aon_taxable_base}" />
														</f:facet>
														<aon:outputText value="#{taxBreakDown.base}"
															rendered="#{taxBreakDown.surchargePercent != 0}">
															<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
														</aon:outputText>
													</aon:column>
	
													<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
														<f:facet name="header">
															<aon:outputText value="%" />
														</f:facet>
														<aon:div rendered="#{taxBreakDown.surchargePercent != 0}">
															<aon:outputText value="#{taxBreakDown.surchargePercent}">
																<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
															</aon:outputText>
															<aon:outputText value="%" />
														</aon:div>
													</aon:column>
	
													<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
														<f:facet name="header">
															<aon:outputText value="#{bundle.aon_fee}" />
														</f:facet>
														<aon:outputText value="#{taxBreakDown.surchargeQuota}"
															rendered="#{taxBreakDown.surchargePercent != 0}">
															<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
														</aon:outputText>
													</aon:column>
												</aon:if>
											</aon:dataTable>
											<aon:div style="width:100%;" styleClass="aon-text-right">
												<aon:panelGrid columns="2"
													styleClass="aon-margin-top  aon-width-all aon-noborder" 
													columnClasses="aon-panelGrid-even aon-width-auto aon-noborder aon-italic, aon-panelGrid-even aon-width-100 aon-text-right aon-noborder">
													
													<aon:outputText value="#{bundle.aon_taxable_base}:"/>
													<aon:outputText value="#{invoiceController.to.taxableBase}">
														<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
													</aon:outputText>
	
													<aon:outputText value="#{bundle.aon_vat_quota}:"/>
													<aon:outputText value="#{invoiceController.to.vatQuota}">
														<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
													</aon:outputText>
	
													<aon:if test="#{invoiceController.to.withholding}">
														<aon:outputText value="#{bundle.aon_retention_quota}:"/>
														<aon:outputText value="#{invoiceController.to.retentionQuota}">
															<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
														</aon:outputText>
													</aon:if>
	
													<aon:outputText value="#{bundle.aon_total}:"/>
													<aon:outputText value="#{invoiceController.to.total}" styleClass="aon-bold">
														<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
													</aon:outputText>
												</aon:panelGrid>
											</aon:div>
										</aon:panel>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
