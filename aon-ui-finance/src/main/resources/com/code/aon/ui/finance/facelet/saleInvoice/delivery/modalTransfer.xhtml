<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showDeliveryTransferWindow">
		<c:if test="#{saleInvoice.showDeliveryTransferWindow}">
			<rich:modalPanel id="deliveryTransferModalPanel" minHeight="580"
				minWidth="760" rendered="#{saleInvoice.showDeliveryTransferWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{financeBundle.finance_invoice_deliveries}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showDeliveryTransferWindow" immediate="true">
							<f:setPropertyActionListener
								target="#{saleInvoice.showDeliveryTransferWindow}"
								value="#{false}" />
							<f:setPropertyActionListener
								target="#{saleInvoice.deliveryTransferManager}"
								value="#{null}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="deliveryTransferForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar" rendered="#{!saleInvoice.readOnly}">
									<aon:commandButton id="deliveryTransfer-selectAll"
										value="#{bundle.aon_check_all}"
										rendered="#{saleInvoice.deliveryTransferManager.deliveryModel.rowCount > 0}"
										styleClass="aon-finding-toolbar-item aon-icon-checkAll"
										actionListener="#{saleInvoice.deliveryTransferManager.checkAllDeliveries}" 
										reRender="deliveryData" />	
									<aon:commandButton id="deliveryTransfer-selectNone"
										value="#{bundle.aon_uncheck_all}"
										rendered="#{saleInvoice.deliveryTransferManager.deliveryModel.rowCount > 0}"
										styleClass="aon-finding-toolbar-item aon-icon-checkNone"
										actionListener="#{saleInvoice.deliveryTransferManager.checkNoneDeliveries}" 
										reRender="deliveryData" />	
									<aon:commandButton id="deliveryTransfer-accept"
										value="#{financeBundle.finance_invoice_to_transfer}"
										rendered="#{saleInvoice.deliveryTransferManager.deliveryModel.rowCount > 0}"
										reRender="showDeliveryTransferWindow,invoiceDetails,menuExt"
										actionListener="#{saleInvoice.onDeliveryTransfer}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<f:setPropertyActionListener
											target="#{saleInvoice.showDeliveryTransferWindow}"
											value="#{false}" />
										<f:setPropertyActionListener
											target="#{saleInvoice.deliveryTransferManager}"
											value="#{null}" />
									</aon:commandButton>
									<aon:commandButton id="deliveryTransfer-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showDeliveryTransferWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{saleInvoice.showDeliveryTransferWindow}"
											value="#{false}" />
										<f:setPropertyActionListener
											target="#{saleInvoice.deliveryTransferManager}"
											value="#{null}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">

									<aon:dataTable id="deliveryData" value="#{saleInvoice.deliveryTransferManager.deliveryModel}"
										var="to" rows="10" rendered="#{saleInvoice.deliveryTransferManager.deliveryModel.rowCount > 0}"
										columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
											aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-iconColumn">

										<aon:column styleClass="#{saleInvoice.deliveryTransferManager.selectedDeliveryId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:selectBooleanCheckbox id="DeliveryCheck"
												value="#{saleInvoice.deliveryTransferManager.deliveryRowChecked}"
												rendered="#{!saleInvoice.readOnly}"
												valueChangeListener="#{saleInvoice.deliveryTransferManager.deliveryRowSelected}"
												reRender="detailDataContainer" ajaxSingle="true" />	
 										</aon:column>
			
										<aon:column styleClass="#{saleInvoice.deliveryTransferManager.selectedDeliveryId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
											</f:facet>
											<aon:outputText value="#{to.referenceCode}" />
										</aon:column>

										<aon:column styleClass="#{saleInvoice.deliveryTransferManager.selectedDeliveryId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_date}" />
											</f:facet>
											<aon:outputText value="#{to.issueTime}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>

										<aon:column styleClass="#{saleInvoice.deliveryTransferManager.selectedDeliveryId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<h:outputText value="#{customerBundle.customer_customer}" />
											</f:facet>
											<aon:outputText value="#{to.customer.registry.fullName}">
												<aon:abbreviateConverter maxWidth="50" />
											</aon:outputText>
										</aon:column>

										<aon:column styleClass="#{saleInvoice.deliveryTransferManager.selectedDeliveryId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_total}" />
											</f:facet>
											<aon:outputText value="#{saleInvoice.deliveryTransferManager.deliveryTotalPrice}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:column>

										<aon:column styleClass="#{saleInvoice.deliveryTransferManager.selectedDeliveryId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:commandButton value="&#160;" immediate="true"
												title="#{financeBundle.finance_invoice_see_delivery_details}"
												styleClass="aon-finding-toolbar-item aon-icon-tree-root aon-finding-toolbar-item-no-border"
												actionListener="#{saleInvoice.deliveryTransferManager.onSelectDelivery}"
												reRender="deliveryData,detailDataContainer" ajaxSingle="true">
											</aon:commandButton>															
 										</aon:column>
			
									</aon:dataTable>
					
									<aon:dataScroller2 for="deliveryData" showNote="true" />


									<aon:div id="detailDataContainer">
										<aon:dataTable id="detailData" value="#{saleInvoice.deliveryTransferManager.detailModel}"
											var="to" rows="0" rendered="#{saleInvoice.deliveryTransferManager.detailModel.rowCount > 0}"
											columnClasses="aon-editDataTable-textColumn, aon-editDataTable-numberColumn, 
												aon-editDataTable-numberColumn, aon-editDataTable-numberColumn">
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{productBundle.product_item}" />
												</f:facet>
												<aon:outputText value="#{to.item.product.code} - #{to.item.product.name}">
													<aon:abbreviateConverter maxWidth="50" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_quantity}" />
												</f:facet>
												<aon:outputText value="#{(to.quantity)}">
													<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_price}" />
												</f:facet>
												<aon:outputText value="#{(to.price)}">
													<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_discount}" />
												</f:facet>
												<aon:outputText value="#{to.discountExpression.discountExpr}">
													<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
												</aon:outputText>
											</aon:column>
	
										</aon:dataTable>
									</aon:div>
					
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
