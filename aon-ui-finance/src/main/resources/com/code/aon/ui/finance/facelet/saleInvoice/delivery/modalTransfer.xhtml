<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showDeliveryTransferWindow">
		<aon:if test="#{saleInvoice.showDeliveryTransferWindow}">
			<rich:modalPanel id="deliveryTransferModalPanel" minHeight="580"
				minWidth="760" rendered="#{saleInvoice.showDeliveryTransferWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.config_series_deliveries}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showDeliveryTransferWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{saleInvoice.showDeliveryTransferWindow}"
								value="#{false}" />
							<f:setPropertyActionListener
								target="#{saleInvoice.deliveryTransferManager}" 
								value="#{null}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="deliveryTransferForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%;">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar" rendered="#{!saleInvoice.readOnly}">
										<aon:commandButton id="deliveryTransfer-selectAll"
											value="#{bundle.aon_check_all}"
											styleClass="aon-finding-toolbar-item aon-icon-plus-blue"
											actionListener="#{saleInvoice.deliveryTransferManager.checkAllDeliveries}"
											reRender="deliveryTransferForm" />
										<aon:commandButton id="deliveryTransfer-selectNone"
											value="#{bundle.aon_uncheck_all}"
											styleClass="aon-finding-toolbar-item aon-icon-minus-grey"
											actionListener="#{saleInvoice.deliveryTransferManager.checkNoneDeliveries}"
											reRender="deliveryTransferForm" />
										<aon:commandButton id="deliveryTransfer-filter"
											value="#{bundle.aon_filter}"
											styleClass="aon-finding-toolbar-item aon-icon-search"
											reRender="showDeliveryFilterWindow">
											<f:setPropertyActionListener
												target="#{saleInvoice.showDeliveryFilterWindow}"
												value="#{true}" />
										</aon:commandButton>
										<aon:commandButton id="deliveryTransfer-accept"
											value="#{bundle.finance_invoice_to_transfer}"
											rendered="#{saleInvoice.deliveryTransferManager.checkedDeliveryCount > 0 or 
												saleInvoice.deliveryTransferManager.checkedRestoreInvoicedDeliveryCount > 0}"
											reRender="showDeliveryTransferWindow,saleInvoiceForm"
											actionListener="#{saleInvoice.onDeliveryTransfer}"
											styleClass="aon-finding-toolbar-item aon-icon-accept"
											onclick="Richfaces.showModalPanel('waitProccess')"
											oncomplete="Richfaces.hideModalPanel('waitProccess')">
											<rich:componentControl for="deliveryTransferModalPanel"
												event="onclick" operation="hide" />
											<f:setPropertyActionListener
												target="#{saleInvoice.showDeliveryTransferWindow}"
												value="#{false}" />
											<f:setPropertyActionListener
												target="#{saleInvoice.deliveryTransferManager}"
												value="#{null}" />
										</aon:commandButton>
										<aon:commandButton id="deliveryTransfer-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showDeliveryTransferWindow" immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{saleInvoice.showDeliveryTransferWindow}"
												value="#{false}" />
											<f:setPropertyActionListener
												target="#{saleInvoice.deliveryTransferManager}"
												value="#{null}" />
										</aon:commandButton>
									</aon:div>
									<aon:div styleClass="aon-scroll-area">
										<aon:panelTabSet id="transferPanelTabSet">
											<aon:panelTab id="availablesTab"
												label="#{bundle.aon_availables} &#40;#{saleInvoice.deliveryTransferManager.deliveryListCount}&#41;"
												actionListener="#{saleInvoice.deliveryTransferManager.onShowAvailables}"
												reRender="deliveryTransferForm">

												<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
													<ui:param name="controller" value="#{saleInvoice.deliveryTransferManager}" />
													<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
													<ui:param name="skipSelectButton" value="#{true}" />
													<ui:param name="columnClasses"
														value="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
																	aon-editDataTable-numberColumn, aon-editDataTable-iconColumn" />
													<ui:define name="columns">
														<ui:decorate template="/com/code/aon/ui/finance/facelet/saleInvoice/delivery/transfer_columns.xhtml">
															<ui:param name="reRender" value="deliveryTransferData" />
															<ui:define name="beforeColumnContent">
																<aon:commandButton value="&#160;" immediate="true"
																	rendered="#{!saleInvoice.deliveryTransferManager.invoicedDelivery}"
																	styleClass="aon-finding-toolbar-item aon-icon-plus-blue aon-finding-toolbar-item-no-border"
																	actionListener="#{saleInvoice.deliveryTransferManager.addDeliveryRowSelected}"
																	reRender="deliveryTransferForm" ajaxSingle="true" />
															</ui:define>
														</ui:decorate>
													</ui:define>

												</ui:decorate>
											</aon:panelTab>

											<aon:if test="#{saleInvoice.deliveryTransferManager.deliveryListCount > 0 or saleInvoice.deliveryTransferManager.checkedDeliveryCount > 0}">
												<aon:panelTab id="selectedTab"
													label="#{bundle.aon_selected} &#40;#{saleInvoice.deliveryTransferManager.checkedDeliveryCount}&#41;"
													actionListener="#{saleInvoice.deliveryTransferManager.onShowSelected}"
													reRender="deliveryTransferForm">

													<aon:dataTable id="selectedDeliveryList" var="to" rowKeyVar="toIndex" sortMode="multi"
														value="#{saleInvoice.deliveryTransferManager.model}"
														columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
														aon-editDataTable-numberColumn, aon-editDataTable-iconColumn">

														<aon:rowSelector id="selectedDeliveryList-select" toggleOnClick="#{false}" />

														<ui:decorate template="/com/code/aon/ui/finance/facelet/saleInvoice/delivery/transfer_columns.xhtml">
															<ui:param name="reRender" value="selectedDeliveryList" />
															<ui:define name="beforeColumnContent">
																<aon:commandButton value="&#160;" immediate="true"
																	styleClass="aon-finding-toolbar-item aon-icon-minus-grey aon-finding-toolbar-item-no-border"
																	actionListener="#{saleInvoice.deliveryTransferManager.removeDeliveryRowSelected}"
																	reRender="deliveryTransferForm" ajaxSingle="true" />
															</ui:define>
														</ui:decorate>

													</aon:dataTable>
													<aon:dataScroller for="selectedDeliveryList" showNote="#{true}"
														rowCount="#{saleInvoice.deliveryTransferManager.model.rowCount}"
														page="#{saleInvoice.deliveryTransferManager.page}" />
												
												</aon:panelTab>
											</aon:if>

											<aon:if test="#{saleInvoice.deliveryTransferManager.invoicedDeliveryCount > 0}">
												<aon:panelTab id="transferedTab"
													label="#{bundle.aon_transfered_to} #{bundle.aon_invoice_abbr} &#40;#{saleInvoice.deliveryTransferManager.invoicedDeliveryCount}&#41;"
													actionListener="#{saleInvoice.deliveryTransferManager.onShowTransfered}"
													reRender="deliveryTransferForm">
													<aon:dataTable id="transferedDeliveryList" var="to" rowKeyVar="toIndex" sortMode="multi"
														value="#{saleInvoice.deliveryTransferManager.model}"
														columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
															aon-editDataTable-numberColumn, aon-editDataTable-iconColumn">

														<aon:rowSelector id="transferedDeliveryList-select" toggleOnClick="#{false}" />

														<ui:decorate template="/com/code/aon/ui/finance/facelet/saleInvoice/delivery/transfer_columns.xhtml">
															<ui:param name="reRender" value="transferedDeliveryList" />
															<ui:define name="beforeColumnContent">
																<aon:commandButton value="&#160;" immediate="true"
																	title="#{bundle.aon_no} #{bundle.aon_undo}"
																	rendered="#{saleInvoice.deliveryTransferManager.restoredDelivery}"
																	styleClass="aon-finding-toolbar-item aon-icon-refresh aon-finding-toolbar-item-no-border"
																	actionListener="#{saleInvoice.deliveryTransferManager.restoreInvoicedDelivery}"
																	reRender="deliveryTransferForm" ajaxSingle="true" />
																<aon:commandButton value="&#160;" immediate="true"
																	title="#{bundle.aon_undo} #{bundle.aon_link_transfer}"
																	rendered="#{!saleInvoice.deliveryTransferManager.restoredDelivery}"
																	styleClass="aon-finding-toolbar-item aon-icon-delete aon-finding-toolbar-item-no-border"
																	actionListener="#{saleInvoice.deliveryTransferManager.removeInvoicedDelivery}"
																	reRender="deliveryTransferForm" ajaxSingle="true" />
															</ui:define>
														</ui:decorate>

													</aon:dataTable>
													<aon:dataScroller for="transferedDeliveryList" showNote="#{true}"
														rowCount="#{saleInvoice.deliveryTransferManager.model.rowCount}"
														page="#{saleInvoice.deliveryTransferManager.page}" />
														
												</aon:panelTab>
											</aon:if>

										</aon:panelTabSet>

										<aon:div id="detailDataContainer">
											<aon:panel rendered="#{saleInvoice.deliveryTransferManager.detailListCount > 0}">
												<f:facet name="header">
													<aon:outputText value="#{bundle.warehouse_delivery_detail}" />
												</f:facet>
												<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
													<ui:param name="controller" value="#{saleInvoice.deliveryTransferManager.detailState}" />
													<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
													<ui:param name="skipSelectButton" value="#{true}" />
													<ui:param name="showDataScroller" value="#{false}" />
													<ui:define name="columns">

														<aon:column styleClass="aon-editDataTable-textColumn">
															<f:facet name="header">
																<aon:outputText value="#{bundle.aon_product}" />
															</f:facet>
															<aon:outputText value="#{to.description}">
																<aon:abbreviateConverter maxWidth="50" />
															</aon:outputText>
														</aon:column>

														<aon:column styleClass="aon-editDataTable-numberColumn">
															<f:facet name="header">
																<aon:outputText value="#{bundle.aon_quantity}" />
															</f:facet>
															<aon:outputText value="#{(to.quantity)}">
																<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
															</aon:outputText>
														</aon:column>

														<aon:column styleClass="aon-editDataTable-numberColumn">
															<f:facet name="header">
																<aon:outputText value="#{bundle.aon_price}" />
															</f:facet>
															<aon:outputText value="#{(to.price)}">
																<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
															</aon:outputText>
														</aon:column>

														<aon:column styleClass="aon-editDataTable-numberColumn">
															<f:facet name="header">
																<aon:outputLabel value="#{bundle.aon_discount}" />
															</f:facet>
															<aon:outputText value="#{to.discountExpression.discountExpr}">
																<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
															</aon:outputText>
														</aon:column>

													</ui:define>
												</ui:decorate>
											</aon:panel>
										</aon:div>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
