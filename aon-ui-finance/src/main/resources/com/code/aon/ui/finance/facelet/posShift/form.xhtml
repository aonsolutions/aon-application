<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posShiftForm">

			<ui:param name="readOnly" value="#{!aonRole.financeOperator}" />

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.report_posShift_list}" />
				<ui:param name="controller" value="#{posShift}" />
				<ui:param name="skipSaveButton" value="#{readOnly}" />
				<ui:param name="skipRemoveButton" value="#{readOnly or posShift.financeModel.rowCount > 0}" />
				<ui:param name="skipResetButton" value="#{readOnly}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:htmlCommandLink id="posShift_report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.finance_count}"
						rendered="#{posShift.to.closed}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="posShift" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<ui:include
						src="/com/code/aon/ui/common/facelet/auditable/toolbarContent.xhtml" />											
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-even aon-width-half aon-vertical-align-top aon-noborder,aon-width-half aon-vertical-align-top aon-noborder">

					<aon:panel>
						<f:facet name="header">
							<aon:outputLabel value="#{bundle.finance_pos_shift_data}" />
						</f:facet>
						<aon:panelGrid columns="2" styleClass="aon-width-all">

							<aon:outputLabel for="PosShit_pos_workPlace" value="#{bundle.purchase_workplace}" />
							<aon:selectOneMenu id="PosShit_pos_workPlace"
								value="#{posShift.workPlace}"
								rendered="#{posShift.nevv}">
								<f:selectItem itemLabel=" - " itemValue="#{null}" />
								<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
								<a4j:support event="onchange" reRender="PosShift_pos" ignoreDupResponses="true" ajaxSingle="true" />
								<a4j:support event="oninputchanged" reRender="PosShift_pos" ignoreDupResponses="true" ajaxSingle="true" />
							</aon:selectOneMenu>
							<aon:outputText styleClass="aon-bold"
								value="#{posShift.to.pos.workPlace.description}"
								rendered="#{!posShift.nevv}" />

							<aon:outputLabel for="PosShift_pos" value="#{bundle.aon_module_pos}" />
							<aon:selectOneMenu id="PosShift_pos"
								value="#{posShift.to.pos}" required="true"
								rendered="#{posShift.nevv}"> 
								<f:selectItem itemLabel=" - " itemValue="#{null}" />
								<f:selectItems value="#{posShift.workPlacePos}" />
							</aon:selectOneMenu>
							<aon:outputText styleClass="aon-bold"
								value="#{posShift.to.pos.name}"
								rendered="#{!posShift.nevv}" />

							<aon:outputLabel for="PosShift_shift" value="#{bundle.report_shift}" />
							<aon:selectOneMenu id="PosShift_shift"
								value="#{posShift.to.shift}" required="true"
								rendered="#{!readOnly}">
								<f:selectItems value="#{financeCollections.shifts}" />
							</aon:selectOneMenu>
							<aon:outputText styleClass="aon-bold"
								value="#{posShift.to.shift}"
								rendered="#{readOnly}" />

							<aon:if test="#{!posShift.nevv}">
								<aon:outputLabel value="#{bundle.aon_login_user}" />
								<aon:outputText value="#{posShift.userName}" 
									styleClass="aon-bold" />
							</aon:if>

							<aon:outputLabel for="PosShift_startTime" value="#{bundle.report_opening}" />
							<aon:panelGrid columns="2" columnClasses="aon-width-150, aon-width-auto">
								<aon:selectInputDate id="PosShift_startTime"
									value="#{posShift.to.startTime}" required="true" 
									rendered="#{!readOnly}" 
									size="20" inputSize="18"
									renderAsPopup="true" enableManualInput="true"
									timeZone="#{timeZoneController.timeZone}" defaultTime="00:00:00"
									popupDateFormat="#{bundle.aon_timestamp_pattern}"
									onchanged="this.value = this.value.replace('ss','00');">
								</aon:selectInputDate>
								<aon:outputText styleClass="aon-bold"
									value="#{posShift.to.startTime}"
									rendered="#{readOnly}">
									<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:div>
									<aon:outputLabel for="PosShift_initialAmount" styleClass="aon-margin-right aon-italic"
										value="#{bundle.finance_initial_amount}:" />
									<aon:inputText id="PosShift_initialAmount"
										value="#{posShift.to.initialAmount}"
										size="8" maxlength="8" 
										rendered="#{!readOnly}"
										valueChangeListener="#{posShift.onInitialAmountChanged}">
										<f:validateDoubleRange minimum="0.0" />
										<a4j:support event="onchange" reRender="totalPosShiftCountPanel" ignoreDupResponses="true" ajaxSingle="true" />
										<a4j:support event="oninputchanged" reRender="totalPosShiftCountPanel" ignoreDupResponses="true" ajaxSingle="true" />
									</aon:inputText>
									<aon:commandButton id="posShift-calculator" immediate="true"
										styleClass="aon-editDataTable-button aon-icon-calc aon-margin-left"
										value="&#160;"
										rendered="#{!readOnly}"
										actionListener="#{posShift.onShowCalculatorWindow}"
										reRender="showCalculatorWindow"
										ajaxSingle="true">
										<f:setPropertyActionListener target="#{posShift.calculator.showCalculatorWindow}"
											value="#{true}" />
										<f:setPropertyActionListener target="#{posShift.calculator.initialAmount}"
											value="#{posShift.to.initialAmount}" />
										<f:setPropertyActionListener target="#{posShift.calculator.recipient}"
											value="#{posShift.to}" />
										<f:setPropertyActionListener target="#{posShift.calculator.headerLabel}"
											value="#{bundle.finance_initial_amount}" />
										<f:setPropertyActionListener target="#{posShift.calculator.footerLabel}"
											value="#{bundle.report_amount_difference}" />
									</aon:commandButton>
									<aon:outputText styleClass="aon-bold"
										value="#{posShift.to.initialAmount}"
										rendered="#{readOnly}">
										<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
									</aon:outputText>
								</aon:div>
							</aon:panelGrid>

							<aon:outputLabel for="PosShift_endTime" value="#{bundle.report_closing}" />
							<aon:selectInputDate id="PosShift_endTime"
								value="#{posShift.to.endTime}"
								rendered="#{!readOnly}" 
								size="20" inputSize="18" 
								renderAsPopup="true" enableManualInput="true"
								timeZone="#{timeZoneController.timeZone}" defaultTime="23:59:59"
								popupDateFormat="#{bundle.aon_timestamp_pattern}"
								onchanged="this.value = this.value.replace('ss','59');">
							</aon:selectInputDate>
							<aon:outputText styleClass="aon-bold"
								value="#{posShift.to.endTime}"
								rendered="#{readOnly}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>

							<aon:outputLabel for="PosShift_remarks" value="#{bundle.aon_remark}" />
							<aon:inputTextarea id="PosShift_remarks" 
								value="#{posShift.to.remarks}" rows="4" cols="80" 
								disabled="#{readOnly}" />

						</aon:panelGrid>
					</aon:panel>

					<aon:div>
						<aon:if test="#{!posShift.nevv}">
							<aon:panel id="totalPosShiftCountPanel">
								<f:facet name="header">
									<aon:outputLabel value="#{bundle.finance_total_count}" />
								</f:facet>
								<aon:panelGrid columns="3" styleClass="aon-width-all aon-margin-bottom"
									columnClasses="aon-panelGrid-even aon-width-auto aon-noborder,
										aon-panelGrid-even aon-width-200 aon-noborder,aon-width-180 aon-noborder">
									<aon:div>
										<aon:outputLabel styleClass="aon-margin-right aon-italic"
											value="#{bundle.finance_initial_amount}:" />
										<aon:outputText styleClass="aon-bold"
											value="#{posShift.to.initialAmount}">
											<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
										</aon:outputText>
									</aon:div>
	
									<aon:div>
										<aon:outputLabel styleClass="aon-margin-right aon-italic"
											value="#{bundle.aon_total} #{bundle.report_cash_name}:" />
										<aon:outputText styleClass="aon-bold"
											value="#{posShift.to.totalCountCashAmount + posShift.to.initialAmount}">
											<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
										</aon:outputText>
									</aon:div>
	
									<aon:div>
										<aon:outputLabel styleClass="aon-margin-right aon-italic"
											value="#{bundle.report_bank_income}:" />
										<aon:outputText styleClass="aon-bold"
											value="#{posShift.to.totalCountCashAmount > 0 ? posShift.to.totalCountCashAmount : 0}">
											<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
										</aon:outputText>
									</aon:div>
								</aon:panelGrid>

								<aon:if test="#{posShift.totalShiftCountModel.rowCount > 0}">
									<ui:include src="/com/code/aon/ui/finance/facelet/posShift/totalPosShiftCount.xhtml">
										<ui:param name="controller" value="#{posShift}" />
									</ui:include>
								</aon:if>
							</aon:panel>

							<aon:panel id="posShiftCountPanel">
								<f:facet name="header">
									<aon:outputLabel value="#{bundle.finance_pos_cash_count}" />
								</f:facet>
								<ui:include src="/com/code/aon/ui/finance/facelet/posShift/posShiftCount.xhtml">
									<ui:param name="shiftController" value="#{posShift}" />
									<ui:param name="readOnly" value="#{readOnly}" />
									<ui:param name="countReRender" value="totalPosShiftCountPanel" />
								</ui:include>
							</aon:panel>
						</aon:if>
					</aon:div>

				</aon:panelGrid>

				<aon:if test="#{!posShift.nevv and (!readOnly or posShift.financeModel.rowCount > 0)}">
					<aon:panel>
						<f:facet name="header">
							<aon:outputLabel value="#{bundle.aon_invoices}" />
						</f:facet>
						<ui:include src="/com/code/aon/ui/finance/facelet/posShift/finance/tab_grid.xhtml">
							<ui:param name="readOnly" value="#{readOnly}" />
						</ui:include>
					</aon:panel>
				</aon:if>
			</aon:div>

		</aon:form>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/posShift/calculator/calculatorModal.xhtml">
			<ui:param name="controller" value="#{posShift}" />
			<ui:param name="cashCalculator" value="#{posShift.calculator}" />
			<ui:param name="modalReRender" value="posShiftForm" />
			<ui:param name="calculatorReport" value="posShiftCashCount" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/posShift/finance/modalBindInvoice.xhtml">
			<ui:param name="controller" value="#{posShift}" />
		</ui:include>
		<ui:decorate template="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{posShift}" />
		</ui:decorate>
		
	</ui:define>
</ui:composition>
