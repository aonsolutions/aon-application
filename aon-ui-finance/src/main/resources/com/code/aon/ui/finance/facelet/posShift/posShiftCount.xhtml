<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:methodParam name="newSaveActionListener" value="#{shiftController.onAcceptCount}" type="actionListener" />
	<aon:methodParam name="saveActionListener" value="#{shiftController.onAcceptCount}" type="actionListener" />
	<aon:methodParam name="removeActionListener" value="#{shiftController.onRemoveCount}" type="actionListener" />
	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{posShiftCount}" />
		<ui:param name="showNote" value="false" />
		<ui:param name="showDataScroller" value="false" />
		<ui:param name="skipResetButton" value="#{readOnly}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="newSaveButtonReRender" value="#{countReRender}" />
		<ui:param name="saveButtonReRender" value="#{countReRender}" />
		<ui:param name="removeButtonReRender" value="#{countReRender}" />
		<ui:param name="focusOnAdd" value="PosShiftCount_payMethod-New" />
		<ui:param name="focusOnSelect" value="PosShiftCount_payMethod" />
		<ui:define name="beginFormListContent">
			<aon:commandLink id="posShiftCount-selectButton"
				styleClass="aon-table-row-link" value="&#160;"
				immediate="true" ajaxSingle="true" requestDelay="100"
				rendered="#{!readOnly}"
				actionListener="#{posShiftCount.onSelect}"
				focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
			</aon:commandLink>
		</ui:define>
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="PosShiftCount_payMethod" value="#{bundle.finance_payMethod}" />
				</f:facet>
				<aon:outputText value="#{to.payMethod.name}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="PosShiftCount_payMethod" 
					value="#{posShiftCount.to.payMethod}" required="true"
					rendered="#{formEdit}">
					<f:selectItem itemLabel=" - " itemValue="#{null}" />
					<f:selectItems value="#{configCollections.extendedDirectPayMethods}" />
					<a4j:support event="onchange" reRender="PosShiftCountAmountDiv" ignoreDupResponses="true" ajaxSingle="true" />
					<a4j:support event="oninputchanged" reRender="PosShiftCountAmountDiv" ignoreDupResponses="true" ajaxSingle="true" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="PosShiftCount_payMethod-New" 
						value="#{posShiftCount.to.payMethod}" required="true"
						rendered="#{formNew}">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{configCollections.extendedDirectPayMethods}" />
						<a4j:support event="onchange" reRender="PosShiftCountAmountDiv-New" ignoreDupResponses="true" ajaxSingle="true" />
						<a4j:support event="oninputchanged" reRender="PosShiftCountAmountDiv-New" ignoreDupResponses="true" ajaxSingle="true" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-200">
				<f:facet name="header">
					<aon:outputLabel for="PosShiftCount_amount" value="#{bundle.report_pos}" />
				</f:facet>
				<aon:outputText value="#{to.amount}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:div id="PosShiftCountAmountDiv" style="display:inline;" 
					rendered="#{formEdit}">
					<aon:inputText id="PosShiftCount_amount"
						value="#{posShiftCount.to.amount}" required="true"
						size="5" maxlength="8" />
					<aon:commandButton id="posShiftCount-calculator" immediate="true"
						styleClass="aon-editDataTable-button aon-icon-calc aon-margin-left"
						value="&#160;"
						rendered="#{posShiftCount.to.payMethod.type=='CASH_BASIS'}"
						actionListener="#{shiftController.onShowCalculatorWindow}"
						reRender="showCalculatorWindow"
						ajaxSingle="true">
						<f:setPropertyActionListener target="#{shiftController.calculator.showCalculatorWindow}"
							value="#{true}" />
						<f:setPropertyActionListener target="#{shiftController.calculator.initialAmount}"
							value="#{shiftController.to.initialAmount}" />
						<f:setPropertyActionListener target="#{shiftController.calculator.recipient}"
							value="#{posShiftCount.to}" />
						<f:setPropertyActionListener target="#{shiftController.calculator.headerLabel}"
							value="#{bundle.finance_pos_cash_count}" />
						<f:setPropertyActionListener target="#{shiftController.calculator.footerLabel}"
							value="#{bundle.report_bank_income}" />
					</aon:commandButton>
				</aon:div>
				<f:facet name="footer">
					<aon:div id="PosShiftCountAmountDiv-New" style="display:inline;" 
						rendered="#{formNew}">
						<aon:inputText id="PosShiftCount_amount-New"
							value="#{posShiftCount.to.amount}" required="true"
							size="5" maxlength="8" />
						<aon:commandButton id="posShiftCount-calculator-New" immediate="true"
							styleClass="aon-editDataTable-button aon-icon-calc aon-margin-left"
							value="&#160;"
							rendered="#{posShiftCount.to.payMethod.type=='CASH_BASIS'}"
							actionListener="#{shiftController.onShowCalculatorWindow}"
							reRender="showCalculatorWindow"
							ajaxSingle="true">
							<f:setPropertyActionListener target="#{shiftController.calculator.showCalculatorWindow}"
								value="#{true}" />
							<f:setPropertyActionListener target="#{shiftController.calculator.initialAmount}"
								value="#{shiftController.to.initialAmount}" />
							<f:setPropertyActionListener target="#{shiftController.calculator.recipient}"
								value="#{posShiftCount.to}" />
							<f:setPropertyActionListener target="#{shiftController.calculator.headerLabel}"
								value="#{bundle.finance_pos_cash_count}" />
							<f:setPropertyActionListener target="#{shiftController.calculator.footerLabel}"
								value="#{bundle.report_bank_income}" />
						</aon:commandButton>
					</aon:div>
				</f:facet>
			</aon:column>

		</ui:define>

		<ui:define name="endFormListContent">
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
				<ui:param name="auditableTO" value="#{to}" />
			</ui:include>
		</ui:define>
	</ui:decorate>	

</ui:composition>
