<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="fPaymentPrintList">

			<aon:methodParam name="searchAction" value="fPaymentPrint_search"/>
			<aon:methodParam name="searchActionListener" value="#{fPaymentPrint.onEditSearchPayment}"  type="actionListener"/>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_fPaymentPrint_module}" />
				<ui:param name="controller" value="#{finance}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="beforeToolbarContent">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						actionListener="#{fPaymentPrint.checkAll}" reRender="fPaymentPrintList"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						actionListener="#{fPaymentPrint.checkNone}" reRender="fPaymentPrintList"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
					<aon:htmlCommandLink id="fPaymentPrintList-report"
						value="#{bundle.aon_listing}" target="_blank" action="#{fPaymentPrint.onExecuteReport}"
						rendered="#{fPaymentPrint.checkedCount > 0}"
						reRender="aonContent"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
					</aon:htmlCommandLink>
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{finance}" />
					<ui:param name="skipSelectButton" value="true" />
					<ui:param name="rowSelectorToggleOnClick" value="false" />

					<ui:define name="columns">
					
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{fPaymentPrint.checkedCount}" />
							</f:facet>
							<aon:selectBooleanCheckbox id="Included_Row_checked"
								value="#{fPaymentPrint.rowChecked}"
								valueChangeListener="#{fPaymentPrint.rowSelected}"
								reRender="fPaymentPrintList" />	
						</aon:column>
				
						<aon:column alias="Finance.dueDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.dueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
		
						<aon:column alias="Finance.invoice&lt;referenceCode"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_invoice}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>
	
						<aon:column alias="Finance.concept"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_document_number}" />
							</f:facet>
							<aon:outputText value="#{to.concept}" />
						</aon:column>
	
						<aon:column alias="Finance.registryName"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText	value="#{(finance.payment) ? (bundle.aon_creditor) : (bundle.finance_debtor)}" />
							</f:facet>
							<aon:outputText value="#{to.registryName}" />
						</aon:column>
	
						<aon:column alias="Finance.registryDocument"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.registryDocument}" />
						</aon:column>
	
						<aon:column alias="Finance.financeStatus"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.financeStatus}" />
						</aon:column>
	
						<aon:column alias="Finance.payMethod.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_payMethod}" />
							</f:facet>
							<aon:outputText value="#{to.payMethod.name}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.totalAmount}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
					</ui:define>
				</ui:decorate>		
			
			</aon:div>
			
		</aon:form>
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />

	</ui:define>

</ui:composition>
