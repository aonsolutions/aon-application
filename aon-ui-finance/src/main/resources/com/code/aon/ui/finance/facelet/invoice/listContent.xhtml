<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoiceList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">

				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="invoiceList-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="#{reportName}" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="invoiceList-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}" 
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="#{reportName}" />
					</aon:htmlCommandLink>
					
					<aon:htmlCommandLink id="invoiceListExcel-report"
						value="Listado Excel"
						action="#{controller.onExcel}" 
						styleClass="aon-finding-toolbar-item aon-icon-beta-text"
						style="padding-left: 25px;"
						accesskey="#{bundle.aon_key_print}">
					</aon:htmlCommandLink>
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-width-all aon-text-right">
					<aon:selectBooleanCheckbox ajaxSingle="true"
						value="#{controller.showPaymentDataInListView}"
						reRender="invoiceList" />
					<aon:outputText styleClass="aon-margin-right"
						value="#{bundle.finance_invoice_show_payment_data}" />
					<aon:if test="#{!isUndeductible}">
						<aon:selectBooleanCheckbox ajaxSingle="true"
							value="#{controller.showTotalBreakdownInListView}"
							reRender="invoiceList" />
						<aon:outputText value="#{bundle.finance_tobreakdown} #{bundle.aon_total}" />
					</aon:if>
				</aon:div>
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:define name="columns">
						<aon:column alias="Invoice.issueDate"
							styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.issueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Invoice.referenceCode"
							styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_invoice_number}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>

						<aon:column alias="Invoice.series,Invoice.number"
							styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_document_number}" />
							</f:facet>
							<aon:outputText value="#{to.documentNumber}" />
						</aon:column>

						<aon:column alias="Invoice.registryName"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{registryLabel}" />
							</f:facet>
							<aon:outputText value="#{to.registryName}">
								<aon:abbreviateConverter maxWidth="40" />
							</aon:outputText>
						</aon:column>
	
						<aon:column alias="Invoice.registryDocument"
							styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.registryDocument}" />
						</aon:column>

						<aon:if test="#{controller.showPaymentDataInListView}">
							<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120"
								style="font-size: 0.9em;">
								<f:facet name="header">
									<aon:outputText value="#{bundle.finance_payMethod}" />
								</f:facet>
								<aon:outputText title="#{bundle.aon_paid}"
									styleClass="aon-editDataTable-button aon-icon-predetermine aon-nowrap"
									value="&#160;"
									rendered="#{to.financeContainer and to.allFinancePaid}" />
								<aon:outputText title="#{bundle.aon_pending}"
									styleClass="aon-editDataTable-button aon-icon-minus-grey aon-nowrap"
									value="&#160;"
									rendered="#{to.financeContainer and !to.allFinancePaid}" />
								<aon:outputText value="#{to.payMethod}">
									<aon:abbreviateConverter maxWidth="15" />
								</aon:outputText>
							</aon:column>
						</aon:if>

						<aon:if test="#{controller.showTotalBreakdownInListView}">
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
								<f:facet name="header">
									<aon:outputText value="#{bundle.product_item_base_abbr}" />
								</f:facet>
								<aon:outputText value="#{to.taxableBase}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
								<f:facet name="footer">
									<aon:div id="listTaxableBaseDiv" styleClass="aon-text-right">
										<aon:outputText	styleClass="aon-bold" 
											value="#{controller.listTaxableBase}"
											rendered="#{controller.listTaxableBase != null}">
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>
									</aon:div>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_vat}" />
								</f:facet>
								<aon:outputText value="#{to.vatQuota}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
								<f:facet name="footer">
									<aon:div id="listVatQuotaDiv" styleClass="aon-text-right">
										<aon:outputText	styleClass="aon-bold" 
											value="#{controller.listVatQuota}"
											rendered="#{controller.listVatQuota != null}">
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>
									</aon:div>
								</f:facet>
							</aon:column>

							<aon:if test="#{showRetention}">
								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_retention}" />
									</f:facet>
									<aon:outputText value="#{to.retentionQuota}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<f:facet name="footer">
										<aon:div id="listRetentionQuotaDiv" styleClass="aon-text-right">
											<aon:outputText	styleClass="aon-bold" 
												value="#{controller.listRetentionQuota}"
												rendered="#{controller.listRetentionQuota != null}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:div>
									</f:facet>
								</aon:column>
							</aon:if>
						</aon:if>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.total}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div id="listTotalDiv" styleClass="aon-text-right">
									<aon:commandLink id="showTotals" immediate="true" 
										styleClass="aon-dataTable-link aon-nowrap aon-bold"
										value="#{bundle.aon_total_sum}"
										rendered="#{controller.listTotal == null}"
										actionListener="#{controller.obtainListTotals}"									
										reRender="listTaxableBaseDiv,listVatQuotaDiv,listRetentionQuotaDiv,listTotalDiv" />
									<aon:outputText	styleClass="aon-bold" 
										value="#{controller.listTotal}"
										rendered="#{controller.listTotal != null}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-iconColumn aon-width-20 aon-text-center">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_record_abbrv}" />
							</f:facet>
							<aon:outputText title="#{bundle.finance_invoice_recorded}"
								styleClass="aon-editDataTable-button aon-icon-check-black aon-nowrap aon-margin-left"
								value="&#160;"
								rendered="#{to.recorded}" />
							<aon:outputText title="#{bundle.finance_not_recorded}"
								styleClass="aon-text-center"
								value="-"
								rendered="#{!to.recorded}" />
						</aon:column>

						<aon:if test="#{company.EInvoice}">
							<aon:column styleClass="aon-editDataTable-iconColumn aon-width-20">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_signature_abbrv}" />
								</f:facet>
								<aon:outputText title="#{bundle.sign_signed}"
									styleClass="aon-editDataTable-button aon-icon-signed aon-nowrap"
									value="&#160;"
									rendered="#{to.signed}" />
								<aon:outputText title="#{bundle.sign_sign_pending}"
									styleClass="aon-editDataTable-button aon-icon-unsigned aon-nowrap"
									value="&#160;"
									rendered="#{!to.signed}" />
							</aon:column>
						</aon:if>

						<aon:column styleClass="aon-editDataTable-iconColumn aon-width-20">
							<f:facet name="header">
								<aon:outputText value="D" />
							</f:facet>
							<aon:outputText title="#{bundle.aon_documents}"
								styleClass="aon-editDataTable-button aon-icon-payroll aon-nowrap"
								value="&#160;"
								rendered="#{to.attachmentAvailable}" />
						</aon:column>
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
