<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="invoiceDetailContainer" styleClass="aon-padding-top">
		<aon:if test="#{!invoiceController.nevv}">
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{bundle.finance_invoice_lines}" />
				</f:facet>
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="dataTableId" value="invoiceDetails" />
					<ui:param name="controller" value="#{detailController}" />
					<ui:param name="showNote" value="false" />
					<ui:param name="showDataScroller" value="false" />
					<ui:param name="skipResetButton" value="#{invoiceController.readOnly}" />
					<ui:param name="skipLineEdition" value="#{true}" />
					<ui:param name="rowSelectorReRender" value="menuExt" />
					<ui:param name="resetButtonReRender" value="aonContent" />
					<ui:param name="newCancelButtonReRender" value="menuExt" />
					<ui:param name="cancelButtonReRender" value="menuExt" />
					<ui:param name="newSaveButtonReRender" value="menuExt,Invoice_total,financeContainer" />
					<ui:param name="saveButtonReRender" value="menuExt,Invoice_total,financeContainer" />
					<ui:param name="removeButtonReRender" value="menuExt,Invoice_total,financeContainer" />
					<ui:param name="focusOnAdd" value="Item_id-New" />
					<ui:param name="focusOnSelect" value="Item_id" />
					<ui:define name="beginFormListContent">
						<aon:commandLink id="#{dataTableId}-selectButton"
							styleClass="aon-table-row-link" value="&#160;"
							immediate="true" ajaxSingle="true" requestDelay="100"
							rendered="#{!invoiceController.readOnly and (detailController.editable or to.sourceId &lt; 0)}"
							actionListener="#{detailController.onSelect}"
							reRender="aonContent"
							onkeyup="#{dataTableId}KeyUp(this)"
							onfocus="#{dataTableId}SelectRow(this)"
							onblur="#{dataTableId}DeselectRow(this)"
							focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
						</aon:commandLink>
					</ui:define>
					
					<ui:define name="endFormListContent">
						<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
							<ui:param name="auditableTO" value="#{to}" />
						</ui:include>
					</ui:define>
						
					<ui:define name="columns">
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_line" value="#{bundle.aon_line}" />
							</f:facet>
							<aon:outputText value="#{to.line}"
								rendered="#{formList}" />
							<aon:inputText id="InvoiceDetail_line" 
								value="#{controller.to.line}" rendered="#{formEdit}"
								required="true" size="1" maxlength="3" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_line-New" 
									value="#{controller.to.line}" rendered="#{formNew}"
									required="true" size="1" maxlength="3" />
							</f:facet>
						</aon:column>
		
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel for="Item_id" value="#{bundle.aon_product}" />
							</f:facet>
							<aon:outputText value="#{to.description}" 
								rendered="#{formList}">
								<aon:abbreviateConverter maxWidth="64" />
							</aon:outputText>
							<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
								<ui:param name="lookupBean" value="#{(invoiceController.to.sales) ? saleItemLookup : purchaseItemLookup}" />
								<ui:param name="lookupTo" value="#{controller.to.item}" />
								<ui:param name="idRequired" value="#{true}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="skipSuggestText" value="#{controller.to.item != null and controller.to.item.id != null}" />
								<ui:param name="lookupInputOnFocus" value="InvoiceDetail_description" />
								<ui:param name="lookupRendered" value="#{formEdit}" />
								<ui:param name="lookupReRender" 
									value="invoiceDetailItemEdit,invoiceDetailQuantityEdit,InvoiceDetail_price,InvoiceDetail_discount,InvoiceDetail_amount" />
								<aon:methodParam name="lookupChangeListener"
									value="#{controller.onItemChanged}" type="lookupChangeListener" />
							</ui:include>
							<aon:panelGroup id="invoiceDetailItemEdit" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formEdit}">
								<aon:inputTextarea id="InvoiceDetail_description"
									style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}"
									value="#{controller.to.description}"
									cols="60" rows="#{!controller.longDescription?1:5}"
									rendered="#{controller.to.item != null and controller.to.item.id != null}"
									ajaxSingle="true">
									<f:validateLength maximum="1024" />
								</aon:inputTextarea>
								<aon:commandLink id="InvoiceDetail_description_short" immediate="true"
									value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
									styleClass="aon-icon-edit-end-simple aon-vertical-align-top" 
									style="margin-left: 5px; padding-right: 12px;"
									rendered="#{controller.longDescription and controller.to.item.product.code != null}"
									actionListener="#{controller.onShortDescription}" 
									reRender="invoiceDetailItemEdit" ajaxSingle="true" />
								<aon:commandLink id="InvoiceDetail_description_long" immediate="true"
									value="&#160;" title="#{bundle.aon_edit}"
									styleClass="aon-icon-edit-add-simple aon-vertical-align-top" 
									style="margin-left: 5px; padding-right: 12px;"
									rendered="#{!controller.longDescription and controller.to.item.product.code != null}"
									actionListener="#{controller.onLongDescription}"
									reRender="invoiceDetailItemEdit" ajaxSingle="true" />
							</aon:panelGroup>
							<f:facet name="footer">
								<aon:div>
									<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
										<ui:param name="lookupBean" value="#{(invoiceController.to.sales) ? saleItemLookup : purchaseItemLookup}" />
										<ui:param name="lookupTo" value="#{controller.to.item}" />
										<ui:param name="idRequired" value="#{true}" />
										<ui:param name="skipLabel" value="#{true}" />
										<ui:param name="skipSuggestText" value="#{controller.to.item != null and controller.to.item.id != null}" />
										<ui:param name="lookupInputOnFocus" value="InvoiceDetail_description-New" />
										<ui:param name="lookupSuffix" value="-New" />
										<ui:param name="lookupRendered" value="#{formNew}" />
										<ui:param name="lookupReRender" 
											value="invoiceDetailItemNew,invoiceDetailQuantityNew,InvoiceDetail_price-New,InvoiceDetail_discount-New,
													InvoiceDetail_amount_data" />
										<aon:methodParam name="lookupChangeListener"
											value="#{controller.onItemChanged}" type="lookupChangeListener" />
									</ui:include>
									<aon:panelGroup id="invoiceDetailItemNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
										<aon:inputTextarea id="InvoiceDetail_description-New"
											style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}"
											value="#{controller.to.description}"
											cols="60" rows="#{!controller.longDescription?1:5}"
											rendered="#{controller.to.item != null and controller.to.item.id != null}"
											ajaxSingle="true">
											<f:validateLength maximum="1024" />
										</aon:inputTextarea>
										<aon:commandLink id="InvoiceDetail_description_short-New" immediate="true"
											value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
											styleClass="aon-icon-edit-end-simple aon-vertical-align-top" 
											style="margin-left: 5px; padding-right: 12px;"
											rendered="#{controller.longDescription and controller.to.item.product.code != null}"
											actionListener="#{controller.onShortDescription}" 
											reRender="invoiceDetailItemNew" ajaxSingle="true" />
										<aon:commandLink id="InvoiceDetail_description_long-New" immediate="true"
											value="&#160;" title="#{bundle.aon_edit}"
											styleClass="aon-icon-edit-add-simple aon-vertical-align-top" 
											style="margin-left: 5px; padding-right: 12px;"
											rendered="#{!controller.longDescription and controller.to.item.product.code != null}"
											actionListener="#{controller.onLongDescription}"
											reRender="invoiceDetailItemNew" ajaxSingle="true" />
										<aon:if test="#{domainSwitcher.betaDomain}">
											<aon:commandButton id="itemCompositionEdit" value="&#160;"
												title="#{bundle.aon_to_specify} #{bundle.product_composition}"
												styleClass="aon-icon-alternative aon-vertical-align-top"
												rendered="#{controller.to.item.product.composition}"
												actionListener="#{controller.onItemCompositionSelect}" 
												reRender="showItemCompositionWindow">
												<f:setPropertyActionListener target="#{controller.compositeHandler.showItemCompositionWindow}"
													value="#{true}" />								
											</aon:commandButton>
										</aon:if>
									</aon:panelGroup>
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_quantity" value="#{bundle.aon_quantity}" />
							</f:facet>
							<aon:outputText value="#{to.quantity}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
							</aon:outputText>
							<aon:panelGroup id="invoiceDetailQuantityEdit" styleClass="aon-nowrap aon-vertical-align-top" 
								rendered="#{formEdit and !controller.increaseDetail}">
								<aon:inputText id="InvoiceDetail_quantity"
									value="#{controller.to.quantity}" rendered="#{formEdit}"
									disabled="#{controller.increaseDetail}"
									valueChangeListener="#{controller.onQuantityChanged}"
									ajaxSingle="true" reRender="InvoiceDetail_price,InvoiceDetail_discount,InvoiceDetail_amount"
									required="true" size="4" focus="InvoiceDetail_price" />
								<aon:commandLink id="InvoiceDetail_quantity-packaged"
									styleClass="aon-finding-toolbar-item aon-noborder aon-icon-package"
									value="&#160;" title="#{bundle.aon_to_specify} #{bundle.product_packaged}"
									rendered="#{controller.to.item.product.packaged}"
									actionListener="#{controller.onItemPackageShow}"
									reRender="showItemPackageWindow">
									<f:setPropertyActionListener target="#{controller.showItemPackageWindow}"
										value="#{true}" />
								</aon:commandLink>
							</aon:panelGroup>
							<f:facet name="footer">
								<aon:div styleClass="aon-text-right">
									<aon:panelGroup id="invoiceDetailQuantityNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
										<aon:inputText id="InvoiceDetail_quantity-New"
											value="#{controller.to.quantity}" rendered="#{formNew}"
											disabled="#{controller.increaseDetail}"
											valueChangeListener="#{controller.onQuantityChanged}"
											ajaxSingle="true" reRender="InvoiceDetail_price-New,InvoiceDetail_discount-New,InvoiceDetail_amount-New"
											required="true" size="4" focus="InvoiceDetail_price-New" />
										<aon:commandLink id="InvoiceDetail_quantity-packaged-New"
											styleClass="aon-finding-toolbar-item aon-noborder aon-icon-package"
											value="&#160;" title="#{bundle.aon_to_specify} #{bundle.product_packaged}"
											rendered="#{controller.to.item.product.packaged}"
											actionListener="#{controller.onItemPackageShow}"
											reRender="showItemPackageWindow">
											<f:setPropertyActionListener target="#{controller.showItemPackageWindow}"
												value="#{true}" />
										</aon:commandLink>
									</aon:panelGroup>
									<aon:outputText id="Invoice_totalQuantity" 
										value="#{invoiceController.toInvoiceTotalQuantity}" rendered="#{!formNew}">
										<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_price" value="#{bundle.aon_price}" />
							</f:facet>
							<aon:outputText value="#{to.price}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_price"
								value="#{controller.to.price}" rendered="#{formEdit}"
								disabled="#{controller.increaseDetail}"
								reRender="InvoiceDetail_amount" 
								required="true" size="5" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_price-New"
									value="#{controller.to.price}" rendered="#{formNew}"
									disabled="#{controller.increaseDetail}"
									reRender="InvoiceDetail_amount-New"
									required="true" size="5" />
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_discount" value="#{bundle.aon_discount}" />
							</f:facet>
							<aon:outputText value="#{to.discountExpression.discountExpr}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_discount"
								value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
								reRender="InvoiceDetail_amount" 
								required="true" size="5" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_discount-New"
									value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}"
									reRender="InvoiceDetail_amount-New"
									required="true" size="5" />
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="InvoiceDetail_amount" value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{to.taxableBase}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
							<aon:outputText id="InvoiceDetail_amount"
								value="#{controller.taxableBase}" rendered="#{formEdit}">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div style="text-align:right;">
									<aon:div id="InvoiceDetail_amount_data"	rendered="#{formNew}">
										<aon:div>
											<aon:outputText id="InvoiceDetail_amount-New"
												value="#{controller.taxableBase}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>
										</aon:div>
										<aon:div styleClass="aon-nowrap" rendered="#{!invoiceController.to.vatFree}">
											<aon:outputText style="font-size: 0.8em; font-style: italic;" 
												value="I.V.A. #{controller.vatPercent}%" />
										</aon:div>
										<aon:div styleClass="aon-nowrap" rendered="#{!invoiceController.to.vatFree and invoiceController.to.surcharge}">
											<aon:outputText style="font-size: 0.8em; font-style: italic;" styleClass="aon-nowrap"
												value="R.E. #{controller.surchargePercent}%" />
										</aon:div>
										<aon:div styleClass="aon-nowrap" rendered="#{!invoiceController.to.retentionFree and invoiceController.to.withholding}">
											<aon:outputText style="font-size: 0.8em; font-style: italic;" styleClass="aon-nowrap"
												value="I.R.P.F. #{controller.retentionPercent}%" />
										</aon:div>
									</aon:div>
									
									<aon:outputText id="Invoice_taxableBase" 
										value="#{invoiceController.taxableBase}" rendered="#{!formNew}">
										<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:if test="#{companyCollections.currentUserWorkPlacesCount > 1}">
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
								<f:facet name="header">
									<aon:outputLabel for="InvoiceDetail_workPlace" value="#{bundle.purchase_workplace}" />
								</f:facet>
								<aon:outputText
									rendered="#{formList}"
									value="#{to.workPlace.description}">
									<aon:abbreviateConverter maxWidth="32" />
								</aon:outputText>
								<aon:selectOneMenu id="InvoiceDetail_workPlace"
									value="#{controller.to.workPlace}"
									rendered="#{formEdit}">
									<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="InvoiceDetail_workPlace-New"
										value="#{controller.to.workPlace}"
										rendered="#{formNew}">
										<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
						</aon:if>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
							<f:facet name="header">
								<aon:outputLabel value="INFO" />
							</f:facet>
							<aon:div styleClass="aon-nowrap">
								<aon:commandLink id="invoiceDetailSourceLink" immediate="true"
									styleClass="aon-button-goto" style="padding-right: 12px;"
									value="&#160;" title="#{bundle.aon_go}" 
									rendered="#{!controller.editable and to.sourceId > 0}" 
									actionListener="#{controller.onLoadSource}"
									action="#{controller.getSourceViewer}"
									reRender="aonContent" />
								<aon:outputText value="&#160;" 
									styleClass="aon-icon-wrong aon-padding"
									rendered="#{!controller.editable and to.sourceId &lt; 0}" />
								<rich:toolTip value="#{controller.lineSourceInfo}" />
								<aon:commandButton id="invoiceDetailProject" value="&#160;"
									styleClass="#{(to.project != null and to.project.id == invoiceController.to.project.id) ? 
													('aon-icon-commandButton aon-icon-project-ok') : ('aon-icon-commandButton aon-icon-project-warn')}"
									rendered="#{to.project.id != null}"
									actionListener="#{controller.onInvoiceDetailSelect}" 
									reRender="showProjectWindow">
									<rich:toolTip value="#{projectLabel} #{to.project.name}" />
									<f:setPropertyActionListener target="#{invoiceController.showProjectWindow}"
										value="#{true}" />								
									<f:setPropertyActionListener target="#{invoiceController.showDetailProjectWindow}"
										value="#{true}" />								
								</aon:commandButton>
								<aon:if test="#{invoiceController.to.sales}">
									<aon:commandButton id="invoiceDetailSeller" value="&#160;"
										styleClass="#{(to.seller != null and to.seller.id == invoiceController.to.seller.id) ? 
														('aon-icon-commandButton aon-icon-commercial-ok') : ('aon-icon-commandButton aon-icon-commercial-warn')}"
										rendered="#{to.seller.id != null}"
										actionListener="#{controller.onInvoiceDetailSelect}" 
										reRender="showSellerWindow">
										<rich:toolTip value="#{bundle.aon_module_commercial} #{to.seller.registry.fullName}" />
										<f:setPropertyActionListener target="#{invoiceController.showSellerWindow}"
											value="#{true}" />								
										<f:setPropertyActionListener target="#{invoiceController.showDetailSellerWindow}"
											value="#{true}" />								
									</aon:commandButton>
								</aon:if>
								<aon:if test="#{!invoiceController.to.sales}">
									<aon:commandButton id="invoiceDetailInvestAsset" value="&#160;"
										styleClass="#{(to.investAsset != null and to.investAsset.id == invoiceController.to.investAsset.id) ? 
														('aon-icon-commandButton aon-icon-invest-asset-ok') : ('aon-icon-commandButton aon-icon-invest-asset-warn')}"
										rendered="#{to.investAsset.id != null}"
										actionListener="#{controller.onInvoiceDetailSelect}" 
										reRender="showInvestAssetWindow">
										<rich:toolTip value="#{bundle.accounting_invest_asset} #{to.investAsset.description}" />
										<f:setPropertyActionListener target="#{invoiceController.showInvestAssetWindow}"
											value="#{!invoiceController.readOnly}" />
										<f:setPropertyActionListener target="#{invoiceController.showDetailInvestAssetWindow}"
											value="#{!invoiceController.readOnly}" />
									</aon:commandButton>
								</aon:if>
							</aon:div>
 						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:panel>
		</aon:if>
	</aon:div>
</ui:composition>
