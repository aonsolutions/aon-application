<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showInvoiceAddressWindow">
		<aon:if test="#{invoiceController.showInvoiceAddressWindow}">
			<rich:modalPanel id="invoiceAddressModalPanel" minHeight="260"
				minWidth="650" rendered="#{invoiceController.showInvoiceAddressWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.registry_addresses}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showInvoiceAddressWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showInvoiceAddressWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="invoiceAddressForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="invoiceAddress-save"
										value="#{bundle.aon_save}"
										reRender="showInvoiceAddressWindow,#{addressReRender}"
										actionListener="#{invoiceAddress.accept}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_save}">
										<rich:componentControl for="invoiceAddressModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{invoiceController.showInvoiceAddressWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="invoiceAddress-remove"
										value="#{bundle.aon_remove}"
										reRender="showInvoiceAddressWindow,#{addressReRender}"
										rendered="#{invoiceAddress.to.id != null}"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										actionListener="#{invoiceAddress.onRemove}"
										accesskey="#{bundle.aon_key_remove}">
										<f:setPropertyActionListener
											target="#{invoiceController.showInvoiceAddressWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="menuGrid" columns="2" dir="true">

										<aon:outputLabel for="InvoiceAddress_address"
											value="#{bundle.aon_address}" />
										<aon:div styleClass="aon-nowrap">
											<aon:selectOneMenu id="InvoiceAddress_streetType" required="true"
												value="#{invoiceAddress.to.streetType}">
												<f:selectItems value="#{registryCollections.streetTypes}" />
											</aon:selectOneMenu>
											<aon:inputText id="InvoiceAddress_address" style="margin-left: 2px;" required="true"
												value="#{invoiceAddress.to.address}" size="32" maxlength="45" />
											<aon:outputLabel for="InvoiceAddress_number" styleClass="aon-italic aon-margin-left"
												value="#{bundle.aon_number}" />
											<aon:inputText id="InvoiceAddress_number" style="margin-left: 5px;" required="true"
												value="#{invoiceAddress.to.number}" size="5" maxlength="8" />
										</aon:div>

										<aon:outputLabel for="InvoiceAddress_address2" 
											value="#{bundle.registry_address_detail}" />
										<aon:inputText id="InvoiceAddress_address2"
											value="#{invoiceAddress.to.address2}" size="50" maxlength="45" />

										<aon:outputLabel for="InvoiceAddress_zip"
											value="#{bundle.aon_postal_code}" />
										<aon:inputText id="InvoiceAddress_zip"
											value="#{invoiceAddress.to.zip}" size="12" maxlength="16" />

										<aon:outputLabel for="InvoiceAddress_city"
											value="#{bundle.registry_city}" />
										<aon:inputText id="InvoiceAddress_city" required="true"
											value="#{invoiceAddress.to.city}" size="50" maxlength="45" />

										<aon:outputLabel for="InvoiceAddress_province"
											value="#{bundle.aon_state}" />
										<aon:div>
											<aon:selectOneMenu id="InvoiceAddress_geozone_id" required="true"
												value="#{invoiceAddress.to.geozone}"
												rendered="#{invoiceAddress.nevv or (invoiceAddress.to.geozone != null and invoiceAddress.to.geozone.id != null)}">
												<f:selectItems value="#{geozoneCollections.geoTrees}" />
											</aon:selectOneMenu>
											<aon:inputText id="InvoiceAddress_province" required="true"
												value="#{invoiceAddress.to.province}" size="50" maxlength="45" 
												rendered="#{!invoiceAddress.nevv and (invoiceAddress.to.geozone == null or invoiceAddress.to.geozone.id == null)}" />
										</aon:div>
									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
