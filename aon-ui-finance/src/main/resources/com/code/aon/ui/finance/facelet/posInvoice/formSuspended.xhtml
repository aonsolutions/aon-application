<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="posSuspendedContainer">
		<aon:panel>
			<f:facet name="header">
				<aon:outputText style="text-transform:uppercase;"
					value="#{financeBundle.finance_pos_suspended_invoices}" />
			</f:facet>

			<a4j:repeat value="#{invoiceController.suspendedInvoiceList}" var="suspendedInvoice">
				<aon:commandLink styleClass="aon-medium-commandButton "
					value ="&#160;" immediate="true"
					actionListener="#{invoiceController.onRecoverSuspendedInvoice}"
					reRender="aonContent" ajaxSingle="true">
					<f:param name="suspendedInvoice" value="#{suspendedInvoice.id}"/>
					<aon:outputText value="#{(suspendedInvoice.modificationDate != null) ? suspendedInvoice.modificationDate : suspendedInvoice.creationDate}">
						<f:convertDateTime pattern="#{bundle.aon_time2_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:outputText styleClass="aon-margin-left"
						value="#{suspendedInvoice.registryName}">
						<aon:abbreviateConverter maxWidth="20" />
					</aon:outputText>
					<aon:outputText styleClass="aon-margin-left"
						value="#{suspendedInvoice.total}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:commandLink>
			</a4j:repeat>
		</aon:panel>
	</aon:div>
</ui:composition>
