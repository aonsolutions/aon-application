<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showSellerDataWindow">
		<c:if test="#{invoiceController.showSellerDataWindow}">
			<rich:modalPanel id="sellerDataModalPanel" minHeight="200"
				minWidth="590" rendered="#{invoiceController.showSellerDataWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText 
							value="#{bundle.finance_pos_seller_label}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showSellerDataWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showSellerDataWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="sellerDataForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="sellerData-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{invoiceController.accept}">
										<aon:actionHotKey key="return" />
										<rich:componentControl for="posSelectionModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{invoiceController.showSellerDataWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="sellerData-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_cancel}"
										actionListener="#{invoiceController.refresh}">
										<f:setPropertyActionListener
											target="#{invoiceController.showSellerDataWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

										<aon:outputLabel for="Seller_id" value="#{bundle.finance_pos_seller_label}" />
										<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml">
											<ui:param name="lookupTo" value="#{posInvoice.to.seller}" />
											<ui:param name="lookupInputSuggestSize" value="40" />
											<ui:param name="skipLabel" value="#{true}" />
											<ui:param name="skipGoToButton" value="#{true}" />
											<ui:param name="skipNewButton" value="#{true}" />
											<aon:methodParam name="lookupChangeListener"
												value="#{posInvoice.onSellerChanged}" type="lookupChangeListener" />
										</ui:include>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
