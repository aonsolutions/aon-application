<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:dataTable value="#{controller.totalShiftCountModel}" var="to" rows="0">

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputLabel value="#{configBundle.config_pay_method}" />
			</f:facet>
			<aon:outputText value="#{to.payMethod.name}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
			<f:facet name="header">
				<aon:outputLabel value="#{financeBundle.finance_cash}" />
			</f:facet>
			<aon:outputText value="#{to.countAmount}">
				<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
			<f:facet name="header">
				<aon:outputLabel value="#{financeBundle.finance_invoice_module}" />
			</f:facet>
			<aon:outputText value="#{to.financeAmount}">
				<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
			<f:facet name="header">
				<aon:outputLabel value="#{financeBundle.finance_difference}" />
			</f:facet>
			<aon:outputText value="#{to.countAmount - to.financeAmount}">
				<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
			</aon:outputText>
		</aon:column>

	</aon:dataTable>

</ui:composition>
