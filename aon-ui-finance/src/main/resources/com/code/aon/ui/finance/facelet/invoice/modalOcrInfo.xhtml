<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showOcrInformationWindow">
		<aon:if test="#{invoiceController.ocrProcess.showOcrInformationWindow}">
			<rich:modalPanel id="ocrInformationModalPanel"
				minWidth="350" minHeight="250" zindex="90"
				showWhenRendered="#{invoiceController.ocrProcess.showOcrInformationWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Datos obtenidos..." />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					
				</f:facet>
				<aon:form id="ocrInformationForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">
											
											<aon:outputLabel value="#{bundle.aon_invoice_number}" />	
											<aon:inputText value="#{invoiceController.ocrProcess.number}" 
												size="25" />
												
											<aon:outputLabel value="#{bundle.aon_document}" />	
											<aon:inputText value="#{invoiceController.ocrProcess.document}" 
												size="25" />
												
											<aon:outputLabel value="#{bundle.aon_date}" />
											<aon:selectInputDate value="#{invoiceController.ocrProcess.date}" 
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}">
											</aon:selectInputDate>
											
											<aon:outputLabel value="#{bundle.aon_total}" />	
											<aon:inputText value="#{invoiceController.ocrProcess.amount}" 
												size="10" />
											
										</aon:panelGrid>
										
										<aon:commandButton
											title="#{bundle.aon_key_accept_accelerator}"
											value="#{bundle.aon_accept}" 
											styleClass="aon-search-lookup-button"
											reRender="showOcrInformationWindow" 
											>
											<aon:actionHotKey key="return" />
											<aon:actionListener method="#{invoiceController.ocrProcess.onAccept}" />
											<f:setPropertyActionListener
												target="#{invoiceController.ocrProcess.showOcrInformationWindow}"
												value="#{false}" />
										</aon:commandButton>
										<!--  
											onclick="#{searchOnClick}" oncomplete="#{searchOnComplete}"
											requestDelay="100" accesskey="#{bundle.aon_key_search}" 
											action="#{searchAction}" actionListener="#{searchActionListener}"
											<aon:if test="#{!skipAfterSearch}" >
												<aon:actionListener method="#{afterSearchActionListener}" />
											</aon:if>
										<aon:commandButton type="button"
											styleClass="aon-popupWindow-close"
											reRender="showOcrInformationWindow" immediate="true">
											<aon:actionHotKey key="esc" />
											<f:setPropertyActionListener
												target="#{invoiceController.ocrProcess.showOcrInformationWindow}"
												value="#{false}" />
										</aon:commandButton>
										-->
										
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
