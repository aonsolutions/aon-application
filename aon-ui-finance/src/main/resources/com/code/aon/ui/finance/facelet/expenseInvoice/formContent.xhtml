<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:outputLabel for="Invoice_referenceCode"
		value="#{financeBundle.finance_invoice_number}" />
	<aon:div>
		<aon:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
			<aon:div id="invoiceReferenceCodeDiv">
				<aon:inputText id="Invoice_referenceCode" 
					value="#{expenseInvoice.to.referenceCode}"
					required="true" ajaxSingle="true" 
					rendered="#{!expenseInvoice.readOnly and expenseInvoiceFinance.allPending}" 
					size="25" maxlength="32" />
				<aon:outputText styleClass="aon-bold"
					value="#{expenseInvoice.to.referenceCode}"
					rendered="#{expenseInvoice.readOnly or !expenseInvoiceFinance.allPending}" />
			</aon:div>
			<aon:div>
				<ui:include src="/com/code/aon/ui/finance/facelet/invoice/investment.xhtml">
					<ui:param name="invoiceController" value="#{expenseInvoice}" />
				</ui:include>
				
				<c:if test="#{aonRole.confidentiality}">
					<aon:selectBooleanCheckbox id="Invoice_securityLevel"
						value="#{expenseInvoice.to.confidential}" ajaxSingle="true"
						rendered="#{!expenseInvoice.readOnly and expenseInvoiceFinance.allPending}" />
					<aon:outputText styleClass="aon-italic aon-margin-right"
						value="#{bundle.aon_confidential}"
						rendered="#{!expenseInvoice.readOnly and expenseInvoiceFinance.allPending}" />
					<aon:outputText styleClass="aon-icon aon-icon-confidential" 
						value="&#160;" title="#{bundle.aon_confidential}"
						rendered="#{(expenseInvoice.readOnly or !expenseInvoiceFinance.allPending) and expenseInvoice.to.confidential}" />
				</c:if>

				<c:if test="#{company.EInvoice}">
					<aon:outputText value="&#160;"
						rendered="#{!expenseInvoice.new and expenseInvoice.to.signed}"
						title="#{signBundle.sign_signed}"
						styleClass="aon-icon aon-icon-signed" />
				</c:if>						

				<aon:outputText value="#{expenseInvoice.to.status}"
					rendered="#{!expenseInvoice.new}" />
				<c:if test="#{aonRole.accountingOperator and expenseInvoice.recorded}">
					<aon:outputText styleClass="aon-italic aon-margin-left"
						value="(#{financeBundle.finance_account_entry}: " />
					<aon:outputText styleClass="aon-bold"
						value="#{expenseInvoice.accountEntryId}" />
					<aon:outputText styleClass="aon-italic" value=")" />
				</c:if>
			</aon:div>
		</aon:panelGrid>
	</aon:div>

	<aon:outputLabel for="Invoice_issueDate"
		value="#{bundle.aon_date}" />
	<aon:div>
		<aon:selectInputDate id="Invoice_issueDate"
			value="#{expenseInvoice.to.issueDate}" required="true"
			disabled="#{expenseInvoice.readOnly}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
			<c:if test="#{aonRole.accountingOperator}">
				<a4j:support ajaxSingle="true" event="oninputchange"
					actionListener="#{expenseInvoice.onDateChanged}"
					reRender="Invoice_taxDate"
					focus="Creditor_id" />
				<a4j:support ajaxSingle="true" event="onchanged"
					actionListener="#{expenseInvoice.onDateChanged}"
					reRender="Invoice_taxDate"
					focus="Creditor_id" />
			</c:if>
		</aon:selectInputDate>
	</aon:div>

	<ui:include src="/com/code/aon/ui/finance/facelet/creditor/lookup.xhtml">
		<ui:param name="lookupTo" value="#{expenseInvoice.to.registry}" />
		<ui:param name="lookupForRegistry" value="#{true}" />
		<ui:param name="lookupInputNameValue" value="#{expenseInvoice.to.registryName}" />
		<ui:param name="lookupDisabled" value="#{expenseInvoice.registryReadOnly or !expenseInvoiceFinance.allPending}" />
		<ui:param name="lookupInputNameDisabled" value="#{expenseInvoice.readOnly or !expenseInvoiceFinance.allPending}" />
		<ui:param name="lookupReRender" value="expenseInvoiceForm" />
		<ui:param name="idRequired" value="#{true}" />						
		<ui:param name="skipSuggestText" 
			value="#{expenseInvoice.to.registry != null and expenseInvoice.to.registry.id != null}" />
		<aon:methodParam name="lookupChangeListener"
			value="#{expenseInvoice.onCreditorChanged}" type="lookupChangeListener" />
	</ui:include>
	
	<aon:outputLabel for="Invoice_taxDate" 
		value="#{financeBundle.finance_tax_date}"
		rendered="#{!expenseInvoice.new}" />
	<aon:div rendered="#{!expenseInvoice.new}">
		<c:if test="#{aonRole.accountingOperator}">
			<aon:selectInputDate id="Invoice_taxDate"
				value="#{expenseInvoice.to.taxDate}" required="true" 
				disabled="#{expenseInvoice.readOnly}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}"
				inputStyle="#{expenseInvoice.taxDateEquals?'':'background-color: #ff865e;'}">
				<a4j:support ajaxSingle="true" event="oninputchange"
					reRender="Invoice_taxDate"
					focus="Creditor_id" />
				<a4j:support ajaxSingle="true" event="onchanged"
					reRender="Invoice_taxDate"
					focus="Creditor_id" />
			</aon:selectInputDate>
		</c:if>
		<c:if test="#{!aonRole.accountingOperator}">
			<aon:outputText value="#{expenseInvoice.to.taxDate}" />
		</c:if>
	</aon:div>

	<aon:outputLabel for="Creditor_registry_document"
		value="#{bundle.aon_company_document}" />
	<aon:panelGroup id="Creditor_lookup_document">
		<aon:selectOneMenu id="Creditor_registry_document_type" 
			disabled="#{expenseInvoice.readOnly}"
			value="#{expenseInvoice.to.registryDocumentType}"
			reRender="Creditor_document_icon">
			<f:selectItems value="#{registryCollections.documentTypes}" />
		</aon:selectOneMenu>
		<aon:outputText styleClass="aon-margin-left aon-italic"
			value="#{bundle.aon_country}" />
		<aon:selectOneMenu id="Creditor_registry_document_country"
			styleClass="aon-margin-left" disabled="#{expenseInvoice.readOnly}"
			value="#{expenseInvoice.to.registryDocumentCountry}"
			reRender="Creditor_document_icon">
			<f:selectItems value="#{commonCollections.countryCodes}" />
		</aon:selectOneMenu>
		<aon:inputText id="Creditor_registry_document" 
			style="margin-left: 3px;" disabled="#{expenseInvoice.readOnly}"
			value="#{expenseInvoice.to.registryDocument}" size="16" maxlength="16"
			reRender="Creditor_document_icon" 
			onblur="toUpperCase(this);">
			<f:validateLength minimum="1" maximum="16" />
			</aon:inputText>
		<aon:panelGroup id="Creditor_document_icon">
			<aon:outputText 
				rendered="#{!expenseInvoice.to.registryDocumentValidable}"
				styleClass="aon-icon-question"
				style="padding-left: 15px;"
				value="&#160;" />
			<aon:outputText 
				rendered="#{expenseInvoice.to.registryDocumentValidable and expenseInvoice.to.validRegistryDocument}"
				styleClass="aon-icon-predetermine"
				style="padding-left: 15px;"
				value="&#160;" />
			<aon:outputText 
				rendered="#{expenseInvoice.to.registryDocumentValidable and !expenseInvoice.to.validRegistryDocument}"
				styleClass="aon-icon-exception"
				style="padding-left: 15px;"
				value="&#160;" />
			</aon:panelGroup>
		</aon:panelGroup>
		
	<aon:outputLabel value="#{financeBundle.finance_invoice_document_number}"
		rendered="#{!expenseInvoice.new}" />
	<aon:outputText styleClass="aon-bold"
		value="#{expenseInvoice.to.documentNumber}"
		rendered="#{!expenseInvoice.new}" />

	<aon:outputLabel for="Invoice_registryAddress_id"
		value="#{registryBundle.registry_address}" />
	<aon:div id="InvoiceAddress">
		<aon:selectOneMenu id="Invoice_registryAddress_id"
			rendered="#{!expenseInvoice.readOnly and expenseInvoiceAddress.to.id == null and expenseInvoice.addressCount > 0}"
			value="#{expenseInvoice.to.registryAddress}">
			<f:selectItems value="#{expenseInvoice.addresses}" />
		</aon:selectOneMenu>
		<aon:outputLabel styleClass="aon-italic"
			value="#{registryBundle.registry_no_address_available}"
			rendered="#{expenseInvoiceAddress.to.id == null and ((expenseInvoice.readOnly and expenseInvoice.to.registryAddress.id == null) or (!expenseInvoice.readOnly and expenseInvoice.addressCount == 0))}" />
		<aon:outputText styleClass="aon-bold"
			value="#{expenseInvoice.address}" 
			rendered="#{expenseInvoiceAddress.to.id != null or (expenseInvoice.readOnly and expenseInvoice.to.registryAddress.id != null)}" />
		<aon:outputText styleClass="aon-margin-left aon-bold"
			value="#{expenseInvoice.location}"
			rendered="#{expenseInvoiceAddress.to.id != null or (expenseInvoice.readOnly and expenseInvoice.to.registryAddress.id != null)}" />
		<aon:div layout="inline" styleClass="aon-margin-left">
			<aon:commandButton id="invoiceAddressButton"
				value="#{registryBundle.registry_address_other}"
				styleClass="aon-icon-commandButton aon-icon-go aon-bold aon-italic"
				rendered="#{!expenseInvoice.new and !expenseInvoice.readOnly}"
				actionListener="#{expenseInvoice.onInvoiceAddressShow}"
				reRender="showInvoiceAddressWindow">
				<f:setPropertyActionListener target="#{expenseInvoice.showInvoiceAddressWindow}"
					value="#{true}" />								
			</aon:commandButton>
		</aon:div>
	</aon:div>

	<aon:outputLabel for="Invoice_total" 
		value="#{bundle.aon_total}"
		rendered="#{!expenseInvoice.new}" />
	<aon:div rendered="#{!expenseInvoice.new}">
		<aon:outputText id="Invoice_total" styleClass="aon-bold"
			value="#{expenseInvoice.toInvoiceTotalPrice}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
		<aon:outputLabel styleClass="aon-margin-left aon-italic"
			value="(#{bundle.aon_tax_included})" />
	</aon:div>

</ui:composition>
