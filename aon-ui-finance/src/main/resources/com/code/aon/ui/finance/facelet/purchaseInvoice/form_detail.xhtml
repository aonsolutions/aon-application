<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<c:if test="#{!purchaseInvoice.new}">
		<aon:div styleClass="aon-padding-top">
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_invoice_lines}" />
				</f:facet>
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="dataTableId" value="invoiceDetails" />
					<ui:param name="controller" value="#{purchaseInvoiceDetail}" />
					<ui:param name="rows" value="0" />
					<ui:param name="showNote" value="false" />
					<ui:param name="showDataScroller" value="false" />
					<ui:param name="skipResetButton" value="#{purchaseInvoice.readOnly}" />
					<ui:param name="skipLineEdition" value="#{purchaseInvoice.readOnly or !purchaseInvoiceDetail.editable}" />
					<ui:param name="rowSelectorReRender" value="menuExt" />
					<ui:param name="resetButtonReRender" value="menuExt" />
					<ui:param name="newCancelButtonReRender" value="menuExt" />
					<ui:param name="cancelButtonReRender" value="menuExt" />
					<ui:param name="newSaveButtonReRender" value="menuExt,Invoice_total" />
					<ui:param name="saveButtonReRender" value="menuExt,Invoice_total" />
					<ui:param name="removeButtonReRender" value="menuExt,Invoice_total" />
					<ui:param name="focusOnAdd" value="InvoiceDetail_item_product_code-New" />
					<ui:param name="focusOnSelect" value="InvoiceDetail_item_product_code" />
	
					<ui:define name="columns">
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
							<f:facet name="header">
								<aon:outputLabel value="#{financeBundle.finance_invoice_detail_line}" />
							</f:facet>
							<aon:outputText value="#{to.line}"
								rendered="#{formList}" />
							<aon:inputText id="InvoiceDetail_line" 
								value="#{controller.to.line}" rendered="#{formEdit}"
								required="true" size="2" maxlength="3" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_line-New" 
									value="#{controller.to.line}" rendered="#{formNew}"
									required="true" size="2" maxlength="3" />
							</f:facet>
						</aon:column>
		
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel value="#{productBundle.product_item}" />
							</f:facet>
							<aon:outputText value="#{to.description}" 
								rendered="#{formList}">
								<aon:abbreviateConverter maxWidth="64" />
							</aon:outputText>
							<aon:div id="invoiceDetailItemEdit" styleClass="aon-lookup" rendered="#{formEdit}">
								<a4j:region>
									<aon:lookupInputText id="InvoiceDetail_item_product_code"
										value="#{purchaseInvoiceDetail.to.item.product.code}"
										lookup="#{itemLookup}"
										lookupChangeListener="#{purchaseInvoiceDetail.onItemChanged}"
										reRender="invoiceDetailItemEdit,InvoiceDetail_price,InvoiceDetail_discount,InvoiceDetail_amount"
										ajaxSingle="false" required="true" size="10"
										onblur="toUpperCase(this);" focus="InvoiceDetail_item_product_name">
										<aon:joinProperty alias="Item_product_code"	value="#{purchaseInvoiceDetail.to.item.product.code}" />
									</aon:lookupInputText>
									<aon:lookupButton 
										windowTitle="#{productBundle.product_item_selection}"
										minHeight="460" minWidth="650"
										property="#{purchaseInvoiceDetail.to.item}" lookup="#{itemLookup}"
										lookupChangeListener="#{purchaseInvoiceDetail.onItemChanged}"
										selectReRender="invoiceDetailItemEdit,InvoiceDetail_price,InvoiceDetail_discount,InvoiceDetail_amount"
										actionType="search">
									</aon:lookupButton>
									<aon:lookupButton
										windowTitle="#{productBundle.product_item_new}"
										minHeight="360" minWidth="780"
										property="#{purchaseInvoiceDetail.to.item}" lookup="#{itemLookup}"
										lookupChangeListener="#{purchaseInvoiceDetail.onItemChanged}" 
										selectReRender="invoiceDetailItemEdit,InvoiceDetail_price,InvoiceDetail_discount,InvoiceDetail_amount"
										actionType="new">
									</aon:lookupButton>
									<aon:inputTextarea id="InvoiceDetail_item_product_name"
										value="#{purchaseInvoiceDetail.to.description}"
										cols="64" rows="#{!purchaseInvoiceDetail.longDescription?1:5}"
										style="#{!purchaseInvoiceDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
										<f:validateLength maximum="1024" />
									</aon:inputTextarea>
								</a4j:region>
								<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
									actionListener="#{purchaseInvoiceDetail.onShortDescription}" reRender="InvoiceDetail_item_product_name"
									rendered="#{purchaseInvoiceDetail.longDescription and purchaseInvoiceDetail.to.item.product.code != null}" />
								<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" immediate="true"
									actionListener="#{purchaseInvoiceDetail.onLongDescription}" reRender="InvoiceDetail_item_product_name"
									rendered="#{!purchaseInvoiceDetail.longDescription and purchaseInvoiceDetail.to.item.product.code != null}" />
							</aon:div>
							<f:facet name="footer">
								<aon:div id="invoiceDetailItemNew" styleClass="aon-lookup" rendered="#{formNew}">
									<a4j:region>
										<aon:lookupInputText id="InvoiceDetail_item_product_code-New"
											value="#{purchaseInvoiceDetail.to.item.product.code}"
											lookup="#{itemLookup}"
											lookupChangeListener="#{purchaseInvoiceDetail.onItemChanged}"
											reRender="invoiceDetailItemNew,InvoiceDetail_price-New,InvoiceDetail_discount-New,InvoiceDetail_amount-New"
											ajaxSingle="false" required="true" size="10"
											onblur="toUpperCase(this);" focus="InvoiceDetail_item_product_name-New">
											<aon:joinProperty alias="Item_product_code" value="#{purchaseInvoiceDetail.to.item.product.code}" />
										</aon:lookupInputText>
										<aon:lookupButton 
											windowTitle="#{productBundle.product_item_selection}"
											minHeight="460" minWidth="650"
											property="#{purchaseInvoiceDetail.to.item}"	lookup="#{itemLookup}" 
											lookupChangeListener="#{purchaseInvoiceDetail.onItemChanged}"
											selectReRender="invoiceDetailItemNew,InvoiceDetail_price-New,InvoiceDetail_discount-New,InvoiceDetail_amount-New"
											actionType="search">
										</aon:lookupButton>
										<aon:lookupButton
											windowTitle="#{productBundle.product_item_new}"
											minHeight="360" minWidth="780"
											property="#{purchaseInvoiceDetail.to.item}" lookup="#{itemLookup}"
											lookupChangeListener="#{purchaseInvoiceDetail.onItemChanged}" 
											selectReRender="invoiceDetailItemEditNew,InvoiceDetail_price-New,InvoiceDetail_discount-New,InvoiceDetail_amount-New"
											actionType="new">
										</aon:lookupButton>
										<aon:inputTextarea id="InvoiceDetail_item_product_name-New"
											value="#{purchaseInvoiceDetail.to.description}"
											cols="64" rows="#{!purchaseInvoiceDetail.longDescription?1:5}"
											style="#{!purchaseInvoiceDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
											<f:validateLength maximum="1024" />
										</aon:inputTextarea>
									</a4j:region>
									<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
										actionListener="#{purchaseInvoiceDetail.onShortDescription}" reRender="InvoiceDetail_item_product_name-New"
										rendered="#{purchaseInvoiceDetail.longDescription and purchaseInvoiceDetail.to.item.product.code != null}" />
									<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" immediate="true"
										actionListener="#{purchaseInvoiceDetail.onLongDescription}" reRender="InvoiceDetail_item_product_name-New"
										rendered="#{!purchaseInvoiceDetail.longDescription and purchaseInvoiceDetail.to.item.product.code != null}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_quantity}" />
							</f:facet>
							<aon:outputText value="#{to.quantity}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_quantity"
								value="#{controller.to.quantity}" rendered="#{formEdit}"
								valueChangeListener="#{controller.onQuantityChanged}"
								reRender="InvoiceDetail_price,InvoiceDetail_discount,InvoiceDetail_amount"
								required="true" size="7" focus="InvoiceDetail_price" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_quantity-New"
									value="#{controller.to.quantity}" rendered="#{formNew}"
									valueChangeListener="#{controller.onQuantityChanged}"
									reRender="InvoiceDetail_price-New,InvoiceDetail_discount-New,InvoiceDetail_amount-New"
									required="true" size="7" focus="InvoiceDetail_price-New" />
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_price}" />
							</f:facet>
							<aon:outputText value="#{to.price}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_price"
								value="#{controller.to.price}" rendered="#{formEdit}"
								reRender="InvoiceDetail_amount" 
								required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_price-New"
									value="#{controller.to.price}" rendered="#{formNew}"
									reRender="InvoiceDetail_amount-New"
									required="true" size="7" />
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_discount}" />
							</f:facet>
							<aon:outputText value="#{to.discountExpression.discountExpr}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="InvoiceDetail_discount"
								value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
								reRender="InvoiceDetail_amount" 
								required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="InvoiceDetail_discount-New"
									value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}"
									reRender="InvoiceDetail_amount-New"
									required="true" size="7" />
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{to.taxableBase}"
								rendered="#{formList}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:outputText id="InvoiceDetail_amount"
								value="#{controller.taxableBase}" rendered="#{formEdit}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div style="text-align:right;">
									<aon:outputText id="InvoiceDetail_amount-New"
										value="#{controller.taxableBase}" rendered="#{formNew}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:outputText id="Invoice_taxableBase" 
										value="#{purchaseInvoice.taxableBase}" rendered="#{!formNew}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputLabel value="#{companyBundle.company_workplace}" />
							</f:facet>
							<aon:outputText
								rendered="#{formList}"
								value="#{to.workPlace.description}">
								<aon:abbreviateConverter maxWidth="32" />
							</aon:outputText>
							<aon:selectOneMenu id="InvoiceDetail_workPlace"
								value="#{controller.to.workPlace}"
								rendered="#{formEdit}">
								<f:selectItems value="#{companyCollections.workPlaces}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu id="InvoiceDetail_workPlace-New"
									value="#{controller.to.workPlace}"
									rendered="#{formNew}">
									<f:selectItems value="#{companyCollections.workPlaces}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
							<f:facet name="header">
								<aon:outputLabel value="INFO" />
							</f:facet>
							<aon:div rendered="#{!controller.editable}" 
								style="display:inline;cursor:pointer;">
								<aon:outputText value="&#160;"
									styleClass="aon-icon-transfer" style="padding-left:20px" />
								<rich:toolTip value="#{controller.lineSourceInfo}" />
							</aon:div>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:panel>
		</aon:div>
	</c:if>
</ui:composition>
