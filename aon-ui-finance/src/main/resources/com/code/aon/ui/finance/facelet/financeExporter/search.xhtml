<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://ww.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="financeExporterForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_account_export_module}" />
				<ui:param name="controller" value="#{financeExporter}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{financeExporter}" />
				<ui:param name="searchController" value="#{financeSearch}" />
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">
					
					<ui:decorate template="/com/code/aon/ui/finance/facelet/finance/searchContent.xhtml" >
						<ui:define name="additionalFinanceSearchContent">

							<aon:outputLabel for="Finance_payment"
								value="#{bundle.aon_type}" />
							<aon:selectOneMenu id="Finance_payment"
								styleClass="aon-width-80"
								value="#{controller.payment}"
								reRender="financeExporterForm">
								<f:selectItem itemLabel="#{bundle.finance_charge}" itemValue="#{false}" />
								<f:selectItem itemLabel="#{bundle.finance_payment}" itemValue="#{true}" />
							</aon:selectOneMenu>										
						
						</ui:define>
					</ui:decorate>
										
				</ui:define>
			
			</ui:decorate>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />

	</ui:define>
	
</ui:composition>
