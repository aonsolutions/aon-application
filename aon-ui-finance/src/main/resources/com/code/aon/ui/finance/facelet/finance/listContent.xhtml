<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:valueParam name="financeRegistryLabel"
		default="#{(finance.payroll) ? 
					(bundle.payroll_salary_employee) : 
					(finance.payment) ? (bundle.aon_creditor) : (bundle.finance_debtor)}" />

	<aon:column alias="Finance.dueDate"
		styleClass="aon-editDataTable-textColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.finance_finance_date_abbrv}" />
		</f:facet>
		<aon:outputText value="#{to.dueDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Finance.invoice&lt;referenceCode"
		styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-130">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_document_number}" />
		</f:facet>
		<aon:outputText value="#{(to.invoice != null) ? to.referenceCode : to.concept}" />
	</aon:column>

	<aon:column alias="Finance.invoice&lt;issueDate"
		styleClass="aon-editDataTable-textColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.finance_invoice_date_abbrv}" />
		</f:facet>
		<aon:outputText value="#{to.invoice.issueDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Finance.registryName"
		styleClass="aon-editDataTable-textColumn aon-width-auto">
		<f:facet name="header">
			<aon:outputText	value="#{financeRegistryLabel}" />
		</f:facet>
		<aon:outputText value="#{to.registryName}">
			<aon:abbreviateConverter maxWidth="50" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Finance.registryDocument"
		styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_company_document}" />
		</f:facet>
		<aon:outputText value="#{to.registryDocument}" />
	</aon:column>

	<aon:column alias="Finance.payMethod.name"
		styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120">
		<f:facet name="header">
			<aon:outputText value="#{bundle.finance_payMethod}" />
		</f:facet>
		<aon:outputText value="#{to.payMethod.name}">
			<aon:abbreviateConverter maxWidth="20" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_total}" />
		</f:facet>
		<aon:outputText value="#{to.totalAmount}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
		<aon:if test="#{!skipTotalFinanceAmount}">
			<f:facet name="footer">
				<aon:div id="listTotalDiv" styleClass="aon-text-right">
					<aon:commandLink id="showTotals" immediate="true" 
						styleClass="aon-dataTable-link aon-nowrap aon-bold"
						value="#{bundle.aon_total_sum}"
						rendered="#{controller.listTotal == null}"
						actionListener="#{controller.obtainListTotals}"									
						reRender="listTotalDiv" />
					<aon:outputText	styleClass="aon-bold" 
						value="#{controller.listTotal}"
						rendered="#{controller.listTotal != null}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</f:facet>
		</aon:if>
	</aon:column>

	<aon:column alias="Finance.financeStatus"
		styleClass="aon-editDataTable-iconColumn aon-width-20 aon-text-center">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status_abrv}" />
		</f:facet>
		<aon:outputText title="#{bundle.aon_pending}"
			styleClass="aon-text-center"
			value="-"
			rendered="#{to.pending}" />
		<aon:outputText title="#{bundle.aon_batched}"
			styleClass="aon-editDataTable-button aon-icon-task-checked aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.batched}" />
		<aon:outputText title="#{bundle.aon_returned}"
			styleClass="aon-editDataTable-button aon-icon-exclude aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.returned}" />
		<aon:outputText title="#{bundle.aon_paid}"
			styleClass="aon-editDataTable-button aon-icon-check-black aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.paid}" />
		<aon:outputText title="#{bundle.finance_tracking_settled}"
			styleClass="aon-editDataTable-button aon-icon-close aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.settled}" />
	</aon:column>

</ui:composition>
