<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posFinanceList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_posFinance_module}" />
				<ui:param name="controller" value="#{posFinance}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						rendered="#{posFinance.model.rowCount > 0}"
						actionListener="#{posFinance.checkAll}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						rendered="#{posFinance.model.rowCount > 0}"
						actionListener="#{posFinance.checkNone}"
						onclick="Richfaces.showModalPanel('waitProccess')"
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
			     	<aon:commandButton title="#{bundle.finance_add_batch}"
						styleClass="aon-finding-toolbar-item aon-icon-newFolder"
						value="#{bundle.finance_to_batch}"
						rendered="#{posFinance.checkedCount > 0}"
						actionListener="#{posFinance.onFinanceBatchShow}" 
						reRender="showFinanceBatchWindow">
						<f:setPropertyActionListener target="#{posFinance.showFinanceBatchWindow}"
							value="#{true}" />
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom"
					rendered="#{posFinance.model.rowCount > 0}">
					<aon:outputText value="#{bundle.purchase_workplace}:" />
					<aon:outputText styleClass="aon-margin-left aon-margin-right aon-bold" 
						value="#{posFinanceSearch.workPlace.description}" />
					<aon:if test="#{posFinanceSearch.pos.id != null}">
						<aon:outputText value="#{bundle.aon_module_pos}:" />
						<aon:outputText styleClass="aon-margin-left aon-margin-right aon-bold" 
							value="#{posFinanceSearch.pos.name}" />
					</aon:if>
					<aon:if test="#{posFinanceSearch.shift != null}">
						<aon:outputText value="#{bundle.report_shift}:" />
						<aon:outputText styleClass="aon-margin-left aon-margin-right aon-bold" 
							value="#{posFinanceSearch.shift}" />
					</aon:if>
					<aon:outputText styleClass="aon-margin-left"
						value="#{bundle.finance_payMethod}:" />
					<aon:outputText styleClass="aon-margin-left aon-margin-right aon-bold" 
						value="#{posFinanceSearch.payMethod.name}" />
					<aon:outputText styleClass="aon-margin-left"
						value="#{bundle.finance_selected_amount}:" />
					<aon:outputText styleClass="aon-margin-left aon-margin-right aon-bold"
						value="#{posFinance.selectedAmount}" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:panel>

				<aon:div id="financeDataDiv">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{posFinance}" />
						<ui:param name="skipSelectButton" value="true" />
						<ui:param name="rowSelectorToggleOnClick" value="false" />

						<ui:define name="columns">

							<aon:column styleClass="aon-editDataTable-iconColumn">
								<f:facet name="header">
									<aon:outputText value="#{posFinance.checkedCount}" />
								</f:facet>
								<aon:selectBooleanCheckbox id="Included_Row_checked"
									value="#{posFinance.rowChecked}"
									valueChangeListener="#{posFinance.rowSelected}"	
									reRender="posFinanceList" />
							</aon:column>
	
							<aon:column alias="Finance.dueDate"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.finance_charge_date}" />
								</f:facet>
								<aon:outputText value="#{to.dueDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:column>
					
							<aon:if test="#{posFinanceSearch.pos.id == null}">
								<aon:column alias="Finance.invoice&lt;posShift.pos.name" 
									styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_module_pos}" />
									</f:facet>
									<aon:outputText value="#{to.invoice.posShift.pos.name}"/>
								</aon:column>
							</aon:if>
					
							<aon:if test="#{posFinanceSearch.shift == null}">
								<aon:column alias="Finance.invoice&lt;posShift.shift"
									styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.report_shift}" />
									</f:facet>
									<aon:outputText value="#{to.invoice.posShift.shift}"/>
								</aon:column>
							</aon:if>
					
							<aon:column alias="Finance.invoice&lt;referenceCode"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_invoice_number}" />
								</f:facet>
								<aon:outputText styleClass="aon-nowrap" 
									value="#{to.invoice.referenceCode}" />
							</aon:column>
	
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_customer}" />
								</f:facet>
								<aon:outputText value="#{to.invoice.registryName}" />
							</aon:column>
					
							<aon:if test="#{actionDenied.moduleEnabled['hotel']}">
								<aon:column styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_source}" />
									</f:facet>
									<aon:outputText value="#{bundle.finance_direct}" 
										rendered="#{to.invoice.project.id == null and !to.invoice.service and !to.invoice.advance}" />
									<aon:outputText value="#{bundle.aon_reservation}" 
										rendered="#{to.invoice.project.id != null and !to.invoice.service and !to.invoice.advance}" />
									<aon:outputText value="#{bundle.finance_service}" 
										rendered="#{to.invoice.service}" />
									<aon:outputText value="#{bundle.finance_money_advance}" 
										rendered="#{to.invoice.advance}" />
									<aon:commandLink id="reservationLink" immediate="true"
										styleClass="aon-button-goto" style="padding-right: 20px;" 
										value="&#160;" title="#{bundle.aon_go}"
										rendered="#{to.invoice.project.id != null}" 
										action="reservation_form"
										actionListener="#{posFinance.onLoadReservation}"
										reRender="aonContent">
									</aon:commandLink>
									<aon:outputText value="(#{posFinance.reservationCode})" 
										rendered="#{to.invoice.project.id != null and to.invoice.project.reservation}" />
								</aon:column>
							</aon:if>
	
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_type}" />
								</f:facet>
								<aon:outputText value="#{bundle.finance_invoice}"
									rendered="#{!to.invoice.rectifier and !to.invoice.rectified}" />
								<aon:div rendered="#{to.invoice.rectifier}">
									<aon:outputText value="#{to.invoice.rectificationType}" />
									<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250">
										<aon:outputFormat value="#{bundle.finance_invoice_rectifier_message2}" styleClass="aon-bold aon-label-error">
											<f:param value="#{to.invoice.rectificationInvoice.referenceCode}" />
										</aon:outputFormat>
									</rich:toolTip>
								</aon:div>
								<aon:div rendered="#{to.invoice.rectified}">
									<aon:outputText value="#{to.invoice.rectificationType}" />
									<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250">
										<aon:outputFormat value="#{bundle.finance_invoice_rectified_message2}" styleClass="aon-bold">
											<f:param value="#{to.invoice.rectificationInvoicesString}" />
										</aon:outputFormat>
									</rich:toolTip>
								</aon:div>
							</aon:column>
	
							<aon:column alias="Finance.amount"
								styleClass="aon-editDataTable-numberColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_amount}" />
								</f:facet>
								<aon:outputText value="#{to.totalAmount}" >
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
							</aon:column>
							
							<aon:column	styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:commandLink id="invoiceLink" immediate="true"
									styleClass="aon-button-goto" style="padding-right: 20px;" 
									value="&#160;" title="#{bundle.aon_go}"
									action="saleInvoice_form"
									actionListener="#{posFinance.onLoadInvoice}"
									reRender="aonContent">
								</aon:commandLink>
							</aon:column>
	
						</ui:define>
					</ui:decorate>					
				</aon:div>
				
			</aon:div>

		</aon:form>
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/posFinance/batchModal.xhtml">
			<ui:param name="controller" value="#{posFinance}" />
		</ui:include>
		
	</ui:define>
</ui:composition>
