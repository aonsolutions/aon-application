<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posShiftSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_posShift_module}" />
				<ui:param name="controller" value="#{posShift}" />
				<ui:param name="skipResetButton" value="#{!aonRole.auditor}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{posShift}" />
				<ui:define name="searchContent">

					<aon:outputLabel value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu 
						value="#{posShiftSearch.workPlace}">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						<a4j:support event="onchange" reRender="PosShift_pos" ignoreDupResponses="true" ajaxSingle="true" />
						<a4j:support event="oninputchanged" reRender="PosShift_pos" ignoreDupResponses="true" ajaxSingle="true" />
					</aon:selectOneMenu>

					<c:if test="#{companyCollections.departmentsCount > 0}">
						<aon:outputLabel value="#{companyBundle.company_department}" />
						<aon:selectOneMenu 
							value="#{posShiftSearch.department}">
							<f:selectItem itemLabel=" - " itemValue="null" />
							<f:selectItems value="#{companyCollections.departments}" />
							<a4j:support event="onchange" reRender="PosShift_pos" ignoreDupResponses="true" ajaxSingle="true" />
							<a4j:support event="oninputchanged" reRender="PosShift_pos" ignoreDupResponses="true" ajaxSingle="true" />
						</aon:selectOneMenu>
					</c:if>

					<aon:outputLabel value="#{financeBundle.finance_pos}" />
					<aon:selectOneMenu id="PosShift_pos"
						value="#{posShiftSearch.pos}" >
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{posShiftSearch.workPlacePos}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{financeBundle.finance_pos_shift}" />
					<aon:selectOneMenu id="PosShift_shift"
						converter="aon.EnumConverter"
						valueChangeListener="#{posShift.addExpression}" >
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{financeCollections.shifts}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{financeBundle.finance_pos_opening}" />
					<aon:div>
						<aon:outputLabel for="PosShift_startTime-From"
							styleClass="aon-italic aon-margin-left aon-margin-right" 
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="PosShift_startTime-From"
							value="#{posShiftSearch.startTimeFrom}" 
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="PosShift_startTime-To"
							styleClass="aon-italic aon-margin-left aon-margin-right" 
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="PosShift_startTime-To"
							value="#{posShiftSearch.startTimeTo}" 
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
					
					<aon:outputLabel value="#{financeBundle.finance_pos_closing}" />
					<aon:div>
						<aon:outputLabel for="PosShift_endTime-From"
							styleClass="aon-italic aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="PosShift_endTime-From"
							value="#{posShiftSearch.endTimeFrom}" 
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="PosShift_endTime-To"
							styleClass="aon-italic aon-margin-left aon-margin-right" 
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="PosShift_endTime-To"
							value="#{posShiftSearch.endTimeTo}" 
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>

				</ui:define>
			</ui:decorate>				

		</aon:form>
	</ui:define>
</ui:composition>
