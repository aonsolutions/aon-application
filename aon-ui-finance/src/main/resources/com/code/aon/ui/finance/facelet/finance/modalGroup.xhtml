<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinanceGroupWindow">
		<c:if test="#{finance.showFinanceGroupWindow}">
			<rich:modalPanel id="financeGroupModalPanel" minHeight="670"
				minWidth="900" rendered="#{finance.showFinanceGroupWindow}"
				showWhenRendered="true" zindex="100">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{financeBundle.finance_group_finances}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close" immediate="true"
							reRender="showFinanceGroupWindow,#{modalReRender}" >
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{finance.showFinanceGroupWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="financeGroupForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="financeGroup-back"
										value="#{bundle.aon_back}"
										reRender="showFinanceGroupWindow,#{modalReRender}"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{finance.showFinanceGroupWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>

								<aon:div id="fGroupPanelTabSet" >
									<aon:panelTabSet >
					
										<c:if test="#{financeGroupList.model.rowCount > 0}" >
											<aon:panelTab id="groupTab" label="#{financeBundle.finance_grouped_finances}">
												<aon:div id="fGroupDetailToolBarDiv" styleClass="aon-toolbar" >
													<aon:commandButton title="#{bundle.aon_check_all}"
														styleClass="aon-finding-toolbar-item aon-icon-checkAll"
														value="#{bundle.aon_check_all}"
														actionListener="#{financeGroupList.checkAll}" reRender="fGroupDetailToolBarDiv,fGroupDetailDataDiv"
														onclick="Richfaces.showModalPanel('waitProccess')" 
											     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
													<aon:commandButton title="#{bundle.aon_uncheck_all}"
														styleClass="aon-finding-toolbar-item aon-icon-checkNone"
														value="#{bundle.aon_uncheck_all}"
														actionListener="#{financeGroupList.checkNone}" reRender="fGroupDetailToolBarDiv,fGroupDetailDataDiv"
														onclick="Richfaces.showModalPanel('waitProccess')" 
											     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
													<aon:commandButton title="#{financeBundle.finance_remove_batch}"
														styleClass="aon-finding-toolbar-item aon-icon-deleteFolder"
														value="#{financeBundle.finance_remove_group}"
														rendered="#{financeGroupList.checkedCount > 0}"
														actionListener="#{finance.onUngroupSelected}" reRender="financeBatchForm,fGroupPanelTabSet"
														onclick="Richfaces.showModalPanel('waitProccess')" 
											     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
												</aon:div>
												<aon:div id="fGroupDetailDataDiv">
													<aon:dataTable id="fGroupDetailData" value="#{financeGroupList.model}"
														var="to" rows="20" rendered="#{financeGroupList.model.rowCount > 0}"
														columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
															aon-editDataTable-textColumn, aon-editDataTable-textColumn,
															aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
															aon-editDataTable-numberColumn">				
														
														<aon:column>
															<f:facet name="header">
																<aon:outputText value="#{financeGroupList.checkedCount}" />
															</f:facet>
															<aon:selectBooleanCheckbox id="Included_Row_checked"
																value="#{financeGroupList.rowChecked}"
																valueChangeListener="#{financeGroupList.rowSelected}"
																reRender="showFinanceGroupWindow" />	
														</aon:column>
												
														<aon:column>
															<f:facet name="header">
																<aon:outputText value="#{financeBundle.finance_finance_date}" />
															</f:facet>
															<aon:outputText value="#{to.dueDate}">
																<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
																	timeZone="#{timeZoneController.timeZoneId}" />
															</aon:outputText>
														</aon:column>
														
														<aon:column>
															<f:facet name="header">
																<aon:outputText value="#{financeBundle.finance_invoice_document_number}" />
															</f:facet>
															<aon:outputText styleClass="aon-nowrap" 
																value="#{to.documentNumber}" />
														</aon:column>
														
														<aon:column>
															<f:facet name="header">
																<aon:outputText value="#{configBundle.config_pay_method}" />
															</f:facet>
															<aon:outputText value="#{to.payMethod.name}"/>
														</aon:column>
												
														<aon:column>
															<f:facet name="header">
																<aon:outputText value="#{configBundle.config_bank_account}" />
															</f:facet>
															<aon:outputText value="#{to.bankAccount}"/>
														</aon:column>
												
														<aon:column>
															<f:facet name="header">
																<aon:outputText value="#{bundle.aon_status}" />
															</f:facet>
															<aon:outputText value="#{to.financeStatus}"/>
														</aon:column>
												
														<aon:column>
															<f:facet name="header">
																<aon:outputText value="#{bundle.aon_amount}" />
															</f:facet>
															<aon:outputText value="#{to.amount}" >
																<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
															</aon:outputText>
														</aon:column>
											
													</aon:dataTable>					
												
													<aon:dataScroller2 for="fGroupDetailData" showNote="true" />
												</aon:div>
											</aon:panelTab>
										</c:if>
					
										<aon:panelTab id="financeTab" label="#{financeBundle.finance_not_grouped_finances}">
											<aon:div id="financeToolBarDiv" styleClass="aon-toolbar">
												<aon:commandButton title="#{bundle.aon_check_all}"
													styleClass="aon-finding-toolbar-item aon-icon-checkAll"
													value="#{bundle.aon_check_all}"
													rendered="#{financeList.model.rowCount > 0}"
													actionListener="#{financeList.checkAll}" reRender="financeToolBarDiv,financeDataDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
												<aon:commandButton title="#{bundle.aon_uncheck_all}"
													styleClass="aon-finding-toolbar-item aon-icon-checkNone"
													value="#{bundle.aon_uncheck_all}"
													rendered="#{financeList.model.rowCount > 0}"
													actionListener="#{financeList.checkNone}" reRender="financeToolBarDiv,financeDataDiv"
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
												<aon:commandButton title="#{financeBundle.finance_add_batch}"
													styleClass="aon-finding-toolbar-item aon-icon-newFolder"
													value="#{financeBundle.finance_add_group}"
													rendered="#{financeList.checkedCount > 0}"
													actionListener="#{finance.onGroupSelected}" reRender="financeBatchForm,fGroupPanelTabSet"
													onclick="Richfaces.showModalPanel('waitProccess')" 
			     									oncomplete="Richfaces.hideModalPanel('waitProccess')" />
											</aon:div>								
											<aon:div id="financeDataDiv">
												<aon:dataTable id="financeData" value="#{financeList.model}"
													var="to" rows="20" rendered="#{financeList.model.rowCount > 0}"
													columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
														aon-editDataTable-textColumn, aon-editDataTable-textColumn,
														aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
														aon-editDataTable-numberColumn">
													
													<aon:column>
														<f:facet name="header">
															<aon:outputText value="#{financeList.checkedCount}" />
														</f:facet>
														<aon:selectBooleanCheckbox id="Included_Row_checked"
															value="#{financeList.rowChecked}"
															valueChangeListener="#{financeList.rowSelected}"
															reRender="showFinanceGroupWindow" />	
													</aon:column>
													
													<aon:column>
														<f:facet name="header">
															<aon:outputText value="#{financeBundle.finance_finance_date}" />
														</f:facet>
														<aon:outputText value="#{to.dueDate}">
															<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
																timeZone="#{timeZoneController.timeZoneId}" />
														</aon:outputText>
													</aon:column>
											
													<aon:column>
														<f:facet name="header">
															<aon:outputText value="#{financeBundle.finance_invoice_document_number}" />
														</f:facet>
														<aon:outputText styleClass="aon-nowrap" 
															value="#{to.documentNumber}" />
													</aon:column>
											
													<aon:column>
														<f:facet name="header">
															<aon:outputText value="#{configBundle.config_pay_method}" />
														</f:facet>
														<aon:outputText value="#{to.payMethod.name}" />
													</aon:column>
											
													<aon:column>
														<f:facet name="header">
															<aon:outputText value="#{configBundle.config_bank_account}" />
														</f:facet>
														<aon:outputText value="#{to.bankAccount}"/>
													</aon:column>
											
													<aon:column>
														<f:facet name="header">
															<aon:outputText value="#{bundle.aon_status}" />
														</f:facet>
														<aon:outputText value="#{to.financeStatus}"/>
													</aon:column>
											
													<aon:column>
														<f:facet name="header">
															<aon:outputText value="#{bundle.aon_amount}" />
														</f:facet>
														<aon:outputText value="#{to.totalAmount}" >
															<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
														</aon:outputText>
													</aon:column>
													
												</aon:dataTable>
												
												<aon:dataScroller2 for="financeData" showNote="true" />
											</aon:div>
										</aon:panelTab>
										
									</aon:panelTabSet>
								</aon:div>
									
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
