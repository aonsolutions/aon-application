<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="fbachList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{(fbatch.payment)?
														(fbatch.payroll) ? (bundle.payroll_fbatch_payment_module) : (bundle.finance_fbatch_payment_module) :
														(bundle.finance_fbatch_charge_module)}" />
				<ui:param name="controller" value="#{fbatch}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="fBatchList-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="fBatchList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>			
					<aon:htmlCommandLink id="fBatchList-report"
						value="#{bundle.aon_listing}" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="fBatchList" />
					</aon:htmlCommandLink>
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{fbatch}" />
					<ui:define name="columns">

						<ui:include
							src="/com/code/aon/ui/finance/facelet/fbatch/listContent.xhtml" />

					</ui:define>
				</ui:decorate>
						
			</aon:div>
			
		</aon:form>

	</ui:define>

</ui:composition>
