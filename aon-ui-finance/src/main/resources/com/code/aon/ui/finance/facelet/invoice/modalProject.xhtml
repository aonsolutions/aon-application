<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showInvoiceProjectWindow">
		<c:if test="#{controller.showInvoiceProjectWindow}">
			<rich:modalPanel id="invoiceProjectModalPanel" minHeight="150"
				minWidth="650" rendered="#{controller.showInvoiceProjectWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<c:if test="#{!aonConfiguration.bean.invoice.showTasData}">
							<aon:outputText value="#{projectBundle.project_module}" />
						</c:if>
						<c:if test="#{aonConfiguration.bean.invoice.showTasData}">
							<aon:outputText value="#{tasBundle.tas_projectTas_module}" />
						</c:if>
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showInvoiceProjectWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showInvoiceProjectWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="invoiceProjectFrom">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<c:if test="#{!controller.showInvoiceDetailProjectWindow}">
										<aon:commandButton id="invoiceProject-save"
											value="#{bundle.aon_save}"
											reRender="showInvoiceProjectWindow,#{parentForm}"
											actionListener="#{controller.addInvoiceProject}"
											styleClass="aon-finding-toolbar-item aon-icon-accept"
											accesskey="#{bundle.aon_key_save}">
											<rich:componentControl for="invoiceProjectModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showInvoiceProjectWindow}"
												value="#{false}" />
										</aon:commandButton>
									</c:if>
									<c:if test="#{controller.showInvoiceDetailProjectWindow}">
										<aon:commandButton id="invoiceProject-save"
											value="#{bundle.aon_save}"
											reRender="showInvoiceProjectWindow,invoiceDetails"
											actionListener="#{detailController.addInvoiceDetailProject}"
											styleClass="aon-finding-toolbar-item aon-icon-accept"
											accesskey="#{bundle.aon_key_save}">
											<rich:componentControl for="invoiceProjectModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showInvoiceProjectWindow}"
												value="#{false}" />
										</aon:commandButton>
									</c:if>
									<aon:commandButton id="invoiceProject-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showInvoiceProjectWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{controller.showInvoiceProjectWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="menuGrid" columns="2" dir="true">
										<c:if test="#{!aonConfiguration.bean.invoice.showTasData}">
											<aon:outputLabel for="Invoice_project_id"
												value="#{projectBundle.project_project}" />
										</c:if>
										<c:if test="#{aonConfiguration.bean.invoice.showTasData}">
											<aon:outputLabel for="InvoiceProject_project"
												value="#{tasBundle.tas_projectTas}" />
										</c:if>
										<c:if test="#{!controller.showInvoiceDetailProjectWindow}">
											<aon:selectOneMenu id="InvoiceProject_project"
												value="#{controller.to.project}">
												<f:selectItems value="#{controller.projects}" />
											</aon:selectOneMenu>
										</c:if>
										<c:if test="#{controller.showInvoiceDetailProjectWindow}">
											<aon:selectOneMenu id="InvoiceProject_project"
												value="#{detailController.invoiceDetail.project}">
												<f:selectItem itemLabel="-" value="#{null}" />
												<f:selectItems value="#{controller.projects}" />
											</aon:selectOneMenu>
										</c:if>
									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
