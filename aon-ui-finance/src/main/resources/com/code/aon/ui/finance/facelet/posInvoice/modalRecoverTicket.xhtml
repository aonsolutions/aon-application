<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showRecoverTicketWindow">
		<aon:if test="#{invoiceController.showRecoverTicketWindow}">
			<rich:modalPanel id="recoverTicketModalPanel" 
				minHeight="200" minWidth="420" zindex="90"
				showWhenRendered="#{invoiceController.showRecoverTicketWindow}">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText 
							value="#{bundle.finance_pos_recover}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showRecoverTicketWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showRecoverTicketWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="recoverTicketForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="recoverTicket-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{invoiceController.onRecoverTicket}">
										<aon:actionHotKey key="return" />
										<rich:componentControl for="posSelectionModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{invoiceController.showRecoverTicketWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="recoverTicket-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_cancel}">
										<f:setPropertyActionListener
											target="#{invoiceController.showRecoverTicketWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" style="width: 100%;">

										<aon:outputLabel for="Invoice_referenceCode"
											value="#{bundle.aon_invoice_number}" />
										<aon:inputText id="Invoice_referenceCode" 
											value="#{invoiceController.recoverReferenceCode}" 
											required="true" size="25" maxlength="32" />

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
