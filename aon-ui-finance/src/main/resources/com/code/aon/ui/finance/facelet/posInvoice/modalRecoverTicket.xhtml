<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showRecoverTicketWindow">
		<c:if test="#{invoiceController.showRecoverTicketWindow}">
			<rich:modalPanel id="recoverTicketModalPanel" minHeight="200"
				minWidth="420" rendered="#{invoiceController.showRecoverTicketWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText 
							value="#{financeBundle.finance_pos_seller_label}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showRecoverTicketWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showRecoverTicketWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="recoverTicketForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="recoverTicket-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{invoiceController.onRecoverTicket}">
										<aon:actionHotKey key="return" />
										<rich:componentControl for="posSelectionModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{invoiceController.showRecoverTicketWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="recoverTicket-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_cancel}">
										<f:setPropertyActionListener
											target="#{invoiceController.showRecoverTicketWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

										<aon:outputLabel for="Invoice_number" value="#{bundle.aon_invoice_number}" />
										<aon:div>
											<aon:selectOneMenu id="Invoice_series"
												value="#{invoiceController.recoverSeries}">
												<f:selectItems value="#{configCollections.posSeriesIds}" />
											</aon:selectOneMenu>
											<aon:outputText styleClass="aon-margin-left aon-margin-right aon-bold"
												value="/" />
											<aon:inputText id="Invoice_number" 
												value="#{invoiceController.recoverNumber}" 
												required="true" size="7" maxlength="10" />
										</aon:div>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
