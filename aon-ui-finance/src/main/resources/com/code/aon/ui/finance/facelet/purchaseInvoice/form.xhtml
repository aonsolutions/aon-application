<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="purchaseInvoiceForm">
			<aon:div id="menuExt">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.finance_purchase_invoice_management_module}" />
					<ui:param name="controller" value="#{purchaseInvoice}" />
					<ui:param name="skipFocusFirst" value="#{!purchaseInvoice.nevv}" />
					<ui:param name="skipSaveButton" value="#{purchaseInvoice.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{!purchaseInvoice.removable or !purchaseInvoiceFinance.allPending}" />
					<ui:param name="saveButtonReRender" value="purchaseInvoiceForm" />
					<ui:param name="showMoreMenu" value="#{!purchaseInvoice.nevv and purchaseInvoiceDetail.to == null}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:if test="#{aonConfiguration.bean.invoice.showSendEmail}">
							<aon:commandButton value="&#160;" id="email"
								actionListener="#{purchaseInvoice.onSendInvoiceByEmail}"
								rendered="#{purchaseInvoiceDetail.model.rowCount > 0 and purchaseInvoiceDetail.to == null}"
								styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border"
								reRender="showNewMessageWindow">
							</aon:commandButton>
						</aon:if>					
						<aon:if test="#{saleInvoice.printWord}">
							<aon:htmlCommandLink id="purchaseInvoice-reportWord"
								value="&#160;" target="_new" 
								rendered="#{!purchaseInvoice.accountSource and purchaseInvoiceDetail.model.rowCount > 0 and purchaseInvoiceDetail.to == null}"
								action="#{report.onExecute}"
								styleClass="aon-finding-toolbar-item aon-icon-word aon-finding-toolbar-item-no-border">
								<f:param name="reportKey" value="purchaseInvoice" />
								<f:param name="outputFormat" value="DOCX" />
							</aon:htmlCommandLink>
						</aon:if>
						<aon:if test="#{purchaseInvoice.hasInvoiceDoc()}">
							<aon:outputLink id="purchaseInvoice-downloadPdf"
								target="_blank" value="#{purchaseInvoice.invoiceDoc.url}" 
								styleClass="aon-finding-toolbar-item aon-icon-pdf">
						    </aon:outputLink>
						</aon:if>
						
						<aon:if test="#{!purchaseInvoice.hasInvoiceDoc()}">
							<aon:htmlCommandLink id="purchaseInvoice-report"
								value="#{bundle.finance_invoice}" target="_new" 
								rendered="#{!purchaseInvoice.accountSource and purchaseInvoiceDetail.model.rowCount > 0 and purchaseInvoiceDetail.to == null}"
								action="#{purchaseInvoiceSigner.onReport}"
								accesskey="#{bundle.aon_key_print}"
								styleClass="aon-finding-toolbar-item aon-icon-pdf">
								<f:param name="reportKey" value="purchaseInvoice" />
							</aon:htmlCommandLink>
						</aon:if>						

					</ui:define>
					<ui:define name="moreMenuContent">
						<aon:if test="#{aonConfiguration.bean.invoice.showWarehouseData}">
							<aon:menuItem id="incomeTransfer"
								value="#{bundle.config_series_deliveries}"
								immediate="#{true}" rendered="#{!purchaseInvoice.readOnly}"
								iconClass="aon-icon-sincronize"
								actionListener="#{purchaseInvoice.onIncomeTransferShow}"
								reRender="showIncomeTransferWindow">
								<f:setPropertyActionListener target="#{purchaseInvoice.showIncomeTransferWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="discounts"
							value="#{bundle.finance_invoice_apply_discounts}"
							rendered="#{!purchaseInvoice.readOnly}"
							iconClass="aon-icon-percentage"
							actionListener="#{purchaseInvoice.onApplyDiscountsShow}"
							reRender="aonContent">
							<f:setPropertyActionListener target="#{purchaseInvoice.showDiscountsWindow}"
								value="#{true}" />
							<f:setPropertyActionListener target="#{purchaseInvoice.discountExpression}"
								value="#{null}" />
						</aon:menuItem>
						<aon:menuItem id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							actionListener="#{purchaseInvoice.onGenerateFinances}"
							rendered="#{purchaseInvoice.toInvoiceTotalPrice != 0 and (!purchaseInvoice.recorded or purchaseInvoiceFinance.allPending)}"
							iconClass="aon-icon-tree"
							accesskey="#{bundle.aon_key_finance}">
							<f:setPropertyActionListener target="#{purchaseInvoice.backActionListener}"
								value="#{null}" />
							<f:setPropertyActionListener target="#{purchaseInvoice.backAction}"
								value="#{null}" />
						</aon:menuItem>
						<aon:menuItem id="rectify"
							value="#{bundle.finance_rectify}"
							rendered="#{!purchaseInvoice.rectifier and !purchaseInvoice.accountSource and purchaseInvoiceDetail.model.rowCount > 0}"
							iconClass="aon-icon-version"
							actionListener="#{purchaseInvoice.onRectificationShow}"
							reRender="showRectificationWindow">
							<f:setPropertyActionListener target="#{purchaseInvoice.showRectificationWindow}"
								value="#{true}" />
						</aon:menuItem>
						<aon:if test="#{aonRole.accountingOperator}">
							<aon:menuItem id="record"
								value="#{bundle.finance_record}"
								actionListener="#{purchaseInvoice.onRecordInvoice}"
								rendered="#{!purchaseInvoice.recorded and purchaseInvoiceDetail.model.rowCount > 0}"
								iconClass="aon-icon-task-assume"
								reRender="purchaseInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>
						<aon:if test="#{aonRole.accountingManager}">
							<aon:menuItem id="unrecord"
								value="#{bundle.finance_unrecord}"
								actionListener="#{purchaseInvoice.onUnrecordInvoice}"
								rendered="#{purchaseInvoice.recorded and !purchaseInvoice.accountSource}"
								iconClass="aon-icon-task-liberate"
								reRender="purchaseInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
					     </aon:if>
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signMenuItem.xhtml">
							<ui:param name="signController" value="#{purchaseInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{purchaseInvoice.signed or !certificate.signable or !purchaseInvoice.attachmentAvailable}" />
							<ui:param name="skipCancelSignButton" value="#{!purchaseInvoice.signed or !purchaseInvoice.attachmentAvailable}" />
							<ui:param name="signButtonReRender" value="purchaseInvoiceForm" />
						</ui:include>
						<aon:menuItem id="duplicate"
							value="#{bundle.aon_to_duplicate}"
							rendered="#{!purchaseInvoice.rectifier and !purchaseInvoice.accountSource and purchaseInvoiceDetail.model.rowCount > 0}"
							immediate="#{true}"
							iconClass="aon-icon-copy"
							actionListener="#{purchaseInvoice.onDuplicationShow}"
							reRender="showDuplicationWindow">
							<f:setPropertyActionListener target="#{purchaseInvoice.showDuplicationWindow}"
								value="#{true}" />
						</aon:menuItem>

						<rich:menuSeparator id="actionMenuSeparator" />

						<aon:if test="#{companyCollections.activeCompanyActivitiesCount > 1}">
							<aon:menuItem id="activities"
								value="#{bundle.aon_activity}"
								iconClass="aon-icon-activity"
								rendered="#{!purchaseInvoice.readOnly or purchaseInvoice.to.investAsset == null or purchaseInvoice.to.investAsset.id == null}"
								reRender="showActivityWindow">
								<f:setPropertyActionListener target="#{purchaseInvoice.showActivityWindow}" 
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						<aon:if test="#{purchaseInvoice.investAssets[0] != null}">
							<aon:menuItem id="investAssets"
								value="#{bundle.accounting_invest_asset}"
								iconClass="aon-icon-invest-asset"
								rendered="#{!purchaseInvoice.readOnly}"
								reRender="showInvestAssetWindow">
								<f:setPropertyActionListener target="#{purchaseInvoice.showInvestAssetWindow}" 
									value="#{true}" />							
								<f:setPropertyActionListener target="#{purchaseInvoice.showDetailInvestAssetWindow}"
									value="#{false}" />
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="projects"
							value="#{bundle.aon_project}"
							iconClass="aon-icon-statistics"
							reRender="showProjectWindow">
							<f:setPropertyActionListener target="#{purchaseInvoice.showProjectWindow}" 
								value="#{true}" />							
							<f:setPropertyActionListener target="#{purchaseInvoice.showDetailProjectWindow}"
								value="#{false}" />
						</aon:menuItem>
						<aon:menuItem id="documents"
							value="#{bundle.aon_documents}"
							iconClass="aon-icon-payroll"
							reRender="showDocumentWindow">
							<f:setPropertyActionListener target="#{purchaseInvoice.showDocumentWindow}"
								value="#{true}" />							
						</aon:menuItem>						
						<aon:menuItem id="comments"
							value="#{bundle.aon_comment}"
							iconClass="aon-icon-comments"
							reRender="showCommentsWindow">
							<f:setPropertyActionListener target="#{purchaseInvoice.showCommentsWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:menuItem id="remarks"
							value="#{bundle.aon_remark}"
							iconClass="aon-icon-notes"
							reRender="showRemarksWindow">
							<f:setPropertyActionListener target="#{purchaseInvoice.showRemarksWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:if test="#{aonRole.accountingOperator}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator1" />
							<aon:menuItem id="fiscalInformation"
								value="#{bundle.finance_fiscal_information}"
								iconClass="aon-icon-info"
								reRender="showFiscalInformationWindow">
								<f:setPropertyActionListener target="#{purchaseInvoice.showFiscalInformationWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>

						<ui:include src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />

					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{purchaseInvoice.nevv}">
					<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formNewContent.xhtml">
						<ui:param name="invoiceController" value="#{purchaseInvoice}" />
						<ui:param name="addressController" value="#{purchaseInvoiceAddress}" />
						<ui:param name="detailController" value="#{purchaseInvoiceDetail}" />
						<ui:param name="financeController" value="#{purchaseInvoiceFinance}" />
						<ui:param name="formName" value="purchaseInvoiceForm" />
						<ui:param name="showAttachPanel" value="true" />
					</ui:include>
				</aon:if>			
				<aon:if test="#{!purchaseInvoice.nevv}">
					<aon:panelGrid id="dataTable" columns="4"
						styleClass="aon-width-all aon-margin-bottom"
						columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-500,
							aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">

						<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formBasicContent.xhtml">
							<ui:param name="invoiceController" value="#{purchaseInvoice}" />
							<ui:param name="addressController" value="#{purchaseInvoiceAddress}" />
							<ui:param name="detailController" value="#{purchaseInvoiceDetail}" />
							<ui:param name="financeController" value="#{purchaseInvoiceFinance}" />
							<ui:param name="formName" value="purchaseInvoiceForm" />
						</ui:include>
					</aon:panelGrid>

					<aon:if test="#{!app.standAlone}">
						<aon:div styleClass="aon-margin-top">
							<aon:panelGrid columns="2" styleClass="aon-width-all"
								columnClasses="aon-panelGrid-odd aon-width-140,
									aon-panelGrid-even aon-width-auto">
	
								<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formCommonContent.xhtml">
									<ui:param name="invoiceController" value="#{purchaseInvoice}" />
									<ui:param name="addressController" value="#{purchaseInvoiceAddress}" />
									<ui:param name="detailController" value="#{purchaseInvoiceDetail}" />
									<ui:param name="financeController" value="#{purchaseInvoiceFinance}" />
									<ui:param name="formName" value="purchaseInvoiceForm" />
								</ui:include>
	
							</aon:panelGrid>
						</aon:div>
					</aon:if>
					
					<aon:if test="#{app.standAlone}">
						<aon:div rendered="#{purchaseInvoice.rectifier}">

							<aon:outputFormat styleClass="aon-bold aon-label-error"
								value="#{bundle.finance_invoice_rectifier_message2}">
								<f:param
									value="#{purchaseInvoice.to.rectificationInvoice.referenceCode}" />
							</aon:outputFormat>
							<aon:if test="#{purchaseInvoice.rectificationInvoiceNull}">

								<aon:commandLink id="Invoice_rectificationInvoiceAdd"
									immediate="true" styleClass="aon-icon-new"
									style="margin-left: 5px; padding-left: 20px;"
									title="Añadir Factura Rectificada"
									reRender="showAddRectificationInvoiceWindow">
									<f:setPropertyActionListener
										target="#{purchaseInvoice.showAddRectificationInvoiceWindow}"
										value="#{true}" />
								</aon:commandLink>
							</aon:if>
						</aon:div>
						<aon:div rendered="#{purchaseInvoice.rectified}">
							<aon:outputFormat styleClass="aon-bold aon-label-error"
								value="#{bundle.finance_invoice_rectified_message2}">
								<f:param
									value="#{purchaseInvoice.to.rectificationInvoicesString}" />
							</aon:outputFormat>
						</aon:div>
					</aon:if>
				</aon:if>

				<aon:if test="#{app.standAlone and !purchaseInvoice.nevv}">
	                <aon:panelTabSet id="purchaseInvoicePanelTab" selectedTab="purchaseInvoiceDetailTab">
	                        <aon:panelTab id="purchaseInvoiceDetailTab" 
	                                label="#{bundle.finance_invoice_lines}">
								<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formDetail.xhtml">
									<ui:param name="invoiceController" value="#{purchaseInvoice}" />
									<ui:param name="detailController" value="#{purchaseInvoiceDetail}" />
									<aon:if test="#{!aonConfiguration.bean.invoice.showTasData}">
										<ui:param name="projectLabel" value="#{bundle.aon_project}" />
									</aon:if>
									<aon:if test="#{aonConfiguration.bean.invoice.showTasData}">
										<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
									</aon:if>
								</ui:include>
	                        </aon:panelTab>
	                        <aon:panelTab id="purchaseInvoiceFinanceTab" 
	                                label="#{bundle.finance_checking}">
								<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formFinance.xhtml">
									<ui:param name="invoiceController" value="#{purchaseInvoice}" />
									<ui:param name="detailController" value="#{purchaseInvoiceDetail}" />
									<ui:param name="financeController" value="#{purchaseInvoiceFinance}" />
								</ui:include>
	                        </aon:panelTab>
	                        <aon:panelTab id="purchaseInvoiceCommonTab" 
	                                label="#{bundle.aon_additional_data}">
								<aon:div styleClass="aon-margin-top">
									<aon:panelGrid columns="2" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-140,
											aon-panelGrid-even aon-width-auto">
			
										<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formCommonContent.xhtml">
											<ui:param name="invoiceController" value="#{purchaseInvoice}" />
											<ui:param name="addressController" value="#{purchaseInvoiceAddress}" />
											<ui:param name="detailController" value="#{purchaseInvoiceDetail}" />
											<ui:param name="financeController" value="#{purchaseInvoiceFinance}" />
											<ui:param name="formName" value="purchaseInvoiceForm" />
										</ui:include>
			
									</aon:panelGrid>
								</aon:div>
	                        </aon:panelTab>
	                </aon:panelTabSet>
				</aon:if>
				
				<aon:if test="#{!app.standAlone}">
					<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formDetail.xhtml">
						<ui:param name="invoiceController" value="#{purchaseInvoice}" />
						<ui:param name="detailController" value="#{purchaseInvoiceDetail}" />
						<aon:if test="#{!aonConfiguration.bean.invoice.showTasData}">
							<ui:param name="projectLabel" value="#{bundle.aon_project}" />
						</aon:if>
						<aon:if test="#{aonConfiguration.bean.invoice.showTasData}">
							<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
						</aon:if>
					</ui:include>
	
					<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formFinance.xhtml">
						<ui:param name="invoiceController" value="#{purchaseInvoice}" />
						<ui:param name="detailController" value="#{purchaseInvoiceDetail}" />
						<ui:param name="financeController" value="#{purchaseInvoiceFinance}" />
					</ui:include>
				</aon:if>
				
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{purchaseItemLookup}" />
		<aon:lookupButtonPopup lookup="#{allItemLookup}" />
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAddress.xhtml">
			<ui:param name="invoiceController" value="#{purchaseInvoice}" />
			<ui:param name="invoiceAddress" value="#{purchaseInvoiceAddress}" />
			<ui:param name="addressReRender" value="InvoiceAddress" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalActivity.xhtml">
			<ui:param name="invoiceController" value="#{purchaseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/company/facelet/investAsset/modalInvestAsset.xhtml">
			<ui:param name="controller" value="#{purchaseInvoice}" />
			<ui:param name="parentReRender" value="purchaseInvoiceForm" />
			<aon:methodParam name="parentActionListener" value="#{purchaseInvoice.addInvoiceInvestAsset}" type="actionListener" />
			<ui:param name="parentValue" value="#{purchaseInvoice.to.investAsset}" />
			<ui:param name="detailReRender" value="invoiceDetails" />
			<aon:methodParam name="detailActionListener" value="#{purchaseInvoiceDetail.onInvoiceDetailSaveAndUpdate}" type="actionListener" />
			<ui:param name="detailValue" value="#{purchaseInvoiceDetail.invoiceDetail.investAsset}" />
			<ui:param name="investAssetLabel" value="#{bundle.accounting_invest_asset}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/project/facelet/project/modalProject.xhtml">
			<ui:param name="controller" value="#{purchaseInvoice}" />
			<ui:param name="parentReRender" value="purchaseInvoiceForm" />
			<aon:methodParam name="parentActionListener" value="#{purchaseInvoice.addInvoiceProject}" type="actionListener" />
			<ui:param name="parentValue" value="#{purchaseInvoice.to.project}" />
			<ui:param name="detailReRender" value="invoiceDetails" />
			<aon:methodParam name="detailActionListener" value="#{purchaseInvoiceDetail.onInvoiceDetailSave}" type="actionListener" />
			<ui:param name="detailValue" value="#{purchaseInvoiceDetail.invoiceDetail.project}" />
			<aon:if test="#{!aonConfiguration.bean.invoice.showTasData}">
				<ui:param name="projectLabel" value="#{bundle.aon_project}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.invoice.showTasData}">
				<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
			</aon:if>
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalRectification.xhtml">
			<ui:param name="invoiceController" value="#{purchaseInvoice}" />
			<ui:param name="financeController" value="#{purchaseInvoiceFinance}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalDuplication.xhtml">
			<ui:param name="invoiceController" value="#{purchaseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalDocuments.xhtml">
			<ui:param name="invoiceController" value="#{purchaseInvoice}" />
			<ui:param name="attachmentController" value="#{purchaseInvoiceAttach}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalComments.xhtml">
			<ui:param name="invoiceController" value="#{purchaseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalRemarks.xhtml">
			<ui:param name="invoiceController" value="#{purchaseInvoice}" />
		</ui:include>
		<aon:if test="#{aonConfiguration.bean.invoice.showWarehouseData}">
			<ui:include src="/com/code/aon/ui/finance/facelet/purchaseInvoice/income/modalTransfer.xhtml" />
			<ui:include src="/com/code/aon/ui/finance/facelet/purchaseInvoice/income/modalFilter.xhtml" />
		</aon:if>
		<aon:if test="#{aonConfiguration.bean.invoice.showSendEmail}">
			<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		</aon:if>
		<ui:include src="/com/code/aon/ui/sign/facelet/signer/modal.xhtml" >
			<ui:param name="signButtonreRender" value="purchaseInvoiceForm" />
			<aon:methodParam name="signActionListener" value="#{purchaseInvoiceSigner.onSign}" type="actionListener" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{purchaseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalFiscalInfo.xhtml">
			<ui:param name="invoiceController" value="#{purchaseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAmortization.xhtml">
			<ui:param name="invoiceController" value="#{purchaseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalDiscounts.xhtml">
			<ui:param name="invoiceController" value="#{purchaseInvoice}" />
