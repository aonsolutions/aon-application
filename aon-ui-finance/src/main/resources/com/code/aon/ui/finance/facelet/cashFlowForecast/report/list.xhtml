<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<aon:methodParam name="searchActionListener" default="#{cashFlowForecastReport.onReset}" type="actionListener" />
			<aon:methodParam name="searchAction" default="cashFlowForecastReport_search" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{financeBundle.finance_cashflow_forecast_report_module}" />
				<ui:param name="controller" value="#{cashFlowForecastReport}" />
				<ui:param name="skipResetButton" value="#{true}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="update" value="#{bundle.aon_refresh}"
						accesskey="Q" title="#{bundle.aon_refresh}"
						actionListener="#{cashFlowForecastReport.onRefresh}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh"
						immediate="true" />
					<aon:htmlCommandLink id="cashFlowForecastReport-excel-report"
						value="&#160;" target="_blank" action="#{cashFlowForecastReport.onExcelReport}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="cashFlowForecastReport-report"
						onclick="alert('No implementado. Prueba el listado a Excel'); return false;"
						value="#{bundle.aon_listing}" target="_blank" action="#{cashFlowForecastReport.onExcelReport}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="6" style="width: 100%; margin-top: 5px; margin-bottom: 5px;"
					columnClasses="aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-100
						,aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-100
						,aon-panelGrid-even aon-width-150
						,aon-panelGrid-even aon-width-auto">
					<aon:outputText value="#{financeBundle.finance_cashflow_to_date}"/>
					<aon:outputText value="#{cashFlowForecastReport.toDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>

					<aon:outputText value="#{financeBundle.finance_cashflow_from_date}"/>
					<aon:outputText value="#{cashFlowForecastReport.fromDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					
					<aon:div>
						<aon:outputText value="[#{bundle.aon_yes} "
							rendered="#{cashFlowForecastReport.returnedFinanceIncluded}"/> 
						<aon:outputText value="[#{bundle.aon_no} "
							rendered="#{!cashFlowForecastReport.returnedFinanceIncluded}"/> 
						<aon:outputText
							value="#{financeBundle.finance_cashflow_include_returned}]" />
					</aon:div>

					<aon:div>
						<aon:outputText value="[#{bundle.aon_yes} "
							rendered="#{cashFlowForecastReport.pendingFinanceIncluded}" />			
						<aon:outputText value="[#{bundle.aon_no} "
							rendered="#{!cashFlowForecastReport.pendingFinanceIncluded}" />			
						<aon:outputText
							value="#{financeBundle.finance_cashflow_include_pending}" />
						<aon:outputText value="#{cashFlowForecastReport.fromDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:outputText value="]" />
					</aon:div>
				</aon:panelGrid>
				
				<aon:div id="disabledBanks">
					<aon:panelGrid columns="2" style="width: 100%; margin-top: 5px; margin-bottom: 5px;"
						rendered="#{cashFlowForecastReport.anyBankDisabled}"
						columnClasses="aon-panelGrid-odd aon-width-auto aon-text-right,
									   aon-panelGrid-even aon-width-400">

						<aon:outputText value="#{financeBundle.finance_cashflow_enable_bank}" />

						<aon:div>
							<aon:selectOneMenu value="#{cashFlowForecastReport.bankToEnable}">
								<f:selectItems value="#{cashFlowForecastReport.disabledBankCollection}" />
							</aon:selectOneMenu>
							<aon:commandButton value="#{financeBundle.finance_show}"
								actionListener="#{cashFlowForecastReport.onEnableBank}"
								styleClass="aon-finding-toolbar-item aon-icon-refresh"/>
						</aon:div>
					</aon:panelGrid>
				</aon:div>			

				<aon:dataTable id="cashFlowForecastData" value="#{cashFlowForecastReport.model}" var="to">
					
					<f:facet name="header">
                        <rich:columnGroup>
                            <aon:column style="font-size: 1em;" styleClass="aon-width-100">
                                <aon:outputText value="#{bundle.aon_date}"/>
                            </aon:column>
                            <aon:column style="font-size: 1em;" styleClass="aon-width-25">
                                <aon:outputText value="T"/>
                            </aon:column>
                            <aon:column style="font-size: 1em;" styleClass="aon-width-auto">
								<aon:outputText value="#{bundle.aon_description}"/>
                            </aon:column>
                            <aon:column style="font-size: 1em;" styleClass="aon-width-100">
								<aon:outputText value="#{bundle.aon_amount}"/>
                            </aon:column>
                            <aon:column style="font-size: 1em;" styleClass="aon-width-100">
								<aon:outputText value="#{financeBundle.finance_balance}"/>
                            </aon:column>
							<c:forEach items="#{cashFlowForecastReport.banks}" var="col">
								<aon:column style="font-size: 1em;" styleClass="aon-width-200">
									<aon:commandLink 
										styleClass="aon-dataTable-link" reRender="cashFlowForecastData,disabledBanks"
										actionListener="#{cashFlowForecastReport.onDisableBank}"
										title="Eliminar Columna">
										<f:param name="bankId" value="#{col.id}"/>
										<aon:outputText value="#{col.description}" />
									</aon:commandLink>
								</aon:column>
							</c:forEach>
                        </rich:columnGroup>
                    </f:facet>
                    
					<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100"
							style="font-size: 0.9em;#{to.systemProperty?'background-color:inherit;font-weight:bold;':'font-weight:normal;'}
									#{to.disabled?'text-decoration: line-through; color: #BBB;':''}">

						<aon:outputText value="#{to.date}" rendered="#{!to.undated}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>
					
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-25 aon-nowrap"
							style="font-size: 0.9em;#{to.systemProperty?'background-color:inherit;font-weight:bold;':'font-weight:normal;'}
								  #{to.disabled?'text-decoration: line-through; color: #BBB;':''}">
						<aon:commandLink
							rendered="#{!to.systemProperty}"
							styleClass="aon-dataTable-link"
							actionListener="#{cashFlowForecastReport.onShow}"
							action="#{cashFlowForecastReport.showAction}"
							style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}"
							title="#{bundle.aon_detail}">
							<aon:outputText value="#{to.type}" />
						</aon:commandLink>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto aon-nowrap"
							style="font-size: 0.9em;#{to.systemProperty?'background-color:inherit;font-weight:bold;':'font-weight:normal;'}">
						<aon:commandLink ajaxSingle="true" reRender="cashFlowForecastData"
							styleClass="aon-dataTable-link"
							actionListener="#{cashFlowForecastReport.onSimulate}"
							style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}"
							title="#{to.disabled?(financeBundle.finance_enable):(financeBundle.finance_disable)}">
							<aon:outputText value="#{to.description}">
								<aon:abbreviateConverter maxWidth="40"/>
							</aon:outputText>
						</aon:commandLink>
					</aon:column>

					<aon:column	styleClass="aon-editDataTable-numberColumn aon-width-100"
						style="font-size: 0.9em;#{to.systemProperty?'background-color:inherit;font-weight:bold;':'font-weight:normal;'}
								#{to.amount &lt; 0?'color:inherit;':'color:blue;'} 
								#{to.systemProperty?'font-weight:bold;':'font-weight:normal;'}
								#{to.disabled?'text-decoration: line-through; color: #BBB;':''}">
						<aon:outputText value="#{to.amount}" rendered="#{to.amount != 0}"
							title="#{to.bankDescription}">
								<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>					

					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100"
							style="font-size: 0.9em;#{to.systemProperty?'background-color:inherit;font-weight:bold;':'font-weight:normal;'}
									#{to.total &lt; 0?'color:red;':'color:blue;'};font-weight:bold;
									#{to.disabled?'text-decoration: line-through; color: #BBB;':''}">
						<aon:outputText value="#{to.total}">
								<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<c:forEach items="#{cashFlowForecastReport.banks}" var="col" >
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100"
							style="font-size: 0.9em;
									#{to.systemProperty?'background-color:inherit;font-weight:bold;':'font-weight:normal;'}
									#{to.map[col.id].balance &lt; 0?'color:red;':'color:blue;'} 
									#{to.systemProperty?'font-weight:bold;':'font-weight:normal;'}
									#{to.disabled?'text-decoration: line-through; color: #BBB;':''}">
							<aon:outputText value="#{to.map[col.id].balance}">
									<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>					
					</c:forEach>

				</aon:dataTable>
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
