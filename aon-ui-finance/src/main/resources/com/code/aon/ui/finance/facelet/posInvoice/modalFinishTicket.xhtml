<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinishTicketWindow">
		<c:if test="#{invoiceController.showFinishTicketWindow}">
			<rich:modalPanel id="finishTicketModalPanel" minHeight="340"
				minWidth="640" rendered="#{invoiceController.showFinishTicketWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{financeBundle.finance_to_charge} #{financeBundle.finance_invoice}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFinishTicketWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showFinishTicketWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="finishTicketForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="finishTicket-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										title="#{bundle.aon_key_save_accelerator}"
										rendered="#{financeController.financesOk}"
										actionListener="#{invoiceController.onFinishTicket}"
										accesskey="#{bundle.aon_key_save}">
										<rich:componentControl for="finishTicketModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{invoiceController.showFinishTicketWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="finishTicket-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showFinishTicketWindow">
										<f:setPropertyActionListener
											target="#{invoiceController.showFinishTicketWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid columns="3" styleClass="aon-margin-bottom aon-noborder"
										columnClasses="aon-width-120,aon-width-200,aon-width-auto">

										<aon:outputText value="&#160;" />
										<aon:div>
											<aon:outputText value="#{financeBundle.finance_invoice_total}:" 
												styleClass="aon-bold aon-margin-right" style="text-transform:uppercase;" />
											<aon:outputText value="#{invoiceController.toInvoiceTotalPrice}" styleClass="aon-bold">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>
											<aon:outputText value=" €" styleClass="aon-bold" />
										</aon:div>
										<aon:div>
											<aon:outputText value="#{financeBundle.finance_pos_pending_amount}:"
												styleClass="aon-bold aon-margin-right" style="text-transform:uppercase;" />
											<aon:outputText value="#{invoiceController.pendingAmount}" styleClass="aon-bold">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>
											<aon:outputText value=" €" styleClass="aon-bold" />
										</aon:div>

									</aon:panelGrid>

									<aon:dataTable id="financeList"
										value="#{financeController.finances}" rowKeyVar="posFinanceKey" var="posFinanceTo">

										<aon:column styleClass="aon-panelGrid-odd aon-width-100 aon-editDataTable-textColumn">
											<aon:outputLabel for="PosFinance_payMethod" 
												value="#{configBundle.config_pay_method}" />
										</aon:column>

										<aon:column styleClass="aon-panelGrid-even aon-width-180 aon-editDataTable-textColumn">
											<aon:selectOneMenu id="PosFinance_payMethod"
												value="#{posFinanceTo.payMethod}" required="true"
												rendered="#{posFinanceTo == financeController.lastFinance}"
												reRender="finishTicketForm" ajaxSingle="true">
												<f:selectItem value="#{null}" />
												<c:if test="#{!financeController.financesCashAlready}">
													<f:selectItems value="#{configCollections.directPayMethods}" />
												</c:if>
												<c:if test="#{financeController.financesCashAlready}">
													<f:selectItems value="#{configCollections.cardPayMethods}" />
												</c:if>
											</aon:selectOneMenu>
											<aon:outputText value="#{posFinanceTo.payMethod.name}"
												rendered="#{posFinanceTo != financeController.lastFinance}" />
										</aon:column>

										<aon:column styleClass="aon-panelGrid-odd aon-width-80 aon-editDataTable-textColumn">
											<aon:outputLabel for="PosFinance_amount" 
												value="#{financeBundle.finance_pos_paid_amount}" />
										</aon:column>

										<aon:column styleClass="aon-panelGrid-even aon-width-auto aon-editDataTable-textColumn">
											<aon:div>
												<aon:inputText id="PosFinance_amount"
													value="#{posFinanceTo.amount}" 
													required="true" size="5" maxlength="7"
													reRender="finishTicketForm" ajaxSingle="true" />
												<aon:commandButton
													id="PosFinance-removeButton" immediate="true" title="#{bundle.aon_remove}"
													styleClass="aon-editDataTable-button aon-margin-left aon-vertical-align-middle aon-search-minus"
													rendered="#{posFinanceTo != financeController.firstFinance}"
													actionListener="#{financeController.onRemoveFinance}"
													reRender="finishTicketForm" ajaxSingle="true">
													<f:param name="posFinanceIndex" value="#{posFinanceKey}"/>
												</aon:commandButton>
												<aon:commandButton
													id="PosFinance-newButton" title="#{bundle.aon_reset}"
													styleClass="aon-editDataTable-button aon-margin-left aon-vertical-align-middle aon-search-add"
													rendered="#{posFinanceTo.payMethod != null and posFinanceTo == financeController.lastFinance}"
													actionListener="#{financeController.onNewFinance}"
													reRender="finishTicketForm" ajaxSingle="true" />
											</aon:div>
										</aon:column>

									</aon:dataTable>

									<aon:panelGrid columns="3" styleClass="aon-margin-top aon-noborder"
										columnClasses="aon-width-120,aon-width-200,aon-width-auto">

										<aon:outputText value="&#160;" />
										<aon:div>
											<aon:outputText value="#{financeBundle.finance_pos_total_cash}:"
												styleClass="aon-bold aon-margin-right" style="text-transform:uppercase;" />
											<aon:outputText value="#{financeController.financesCashAmount}" styleClass="aon-bold"
												style="#{(financeController.financesCashChange > financeController.financesCashAmount) ? 'color:red;' : ''}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>
											<aon:outputText value=" €" styleClass="aon-bold" />
										</aon:div>
										<aon:div>
											<aon:outputText value="#{financeBundle.finance_pos_total_card}:"
												styleClass="aon-bold aon-margin-right" style="text-transform:uppercase;" />
											<aon:outputText value="#{financeController.financesCardAmount}" styleClass="aon-bold"
												style="#{(financeController.financesCardAmount > invoiceController.pendingAmount) ? 'color:red;' : ''}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>
											<aon:outputText value=" €" styleClass="aon-bold" />
										</aon:div>

									</aon:panelGrid>

									<aon:panelGrid columns="3" styleClass="aon-margin-top aon-noborder"
										columnClasses="aon-width-120,aon-width-200,aon-width-auto">

										<aon:outputText value="&#160;" />
										<aon:div>
											<aon:outputText value="#{financeBundle.finance_pos_cash_change}:"
												styleClass="aon-bold aon-margin-right" style="text-transform:uppercase;" />
											<aon:outputText value="#{financeController.financesCashChange}" styleClass="aon-bold"
												style="#{(financeController.financesCashChange > financeController.financesCashAmount) ? 'color:red;' : ''}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>
											<aon:outputText value=" €" styleClass="aon-bold" />
										</aon:div>
										<aon:div>
											<aon:outputText value="#{financeBundle.finance_pos_total_finances}:"
												styleClass="aon-bold aon-margin-right" style="text-transform:uppercase;" />
											<aon:outputText value="#{financeController.financesAmount}" styleClass="aon-bold"
												style="#{(invoiceController.pendingAmount > financeController.financesAmount) ? 'color:red;' : ''}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>
											<aon:outputText value=" €" styleClass="aon-bold" />
										</aon:div>

									</aon:panelGrid>

								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
