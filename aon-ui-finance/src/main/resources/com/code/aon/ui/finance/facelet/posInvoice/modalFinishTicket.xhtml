<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinishTicketWindow">
		<c:if test="#{invoiceController.showFinishTicketWindow}">
			<rich:modalPanel id="finishTicketModalPanel" minHeight="260"
				minWidth="520" rendered="#{invoiceController.showFinishTicketWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{financeBundle.finance_pos_finish_ticket}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{financeController.onCancel}"
							reRender="showFinishTicketWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showFinishTicketWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="finishTicketForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="finishTicket-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{invoiceController.onFinishTicket}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="finishTicketModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{invoiceController.showFinishTicketWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="finishTicket-cancel"
										value="#{bundle.aon_cancel}"
										actionListener="#{financeController.onCancel}"
										reRender="showFinishTicketWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{invoiceController.showFinishTicketWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 80%;">

										<aon:outputLabel for="Finance_payMethod" value="#{configBundle.config_pay_method}" />
										<aon:selectOneMenu id="Finance_payMethod"
											value="#{financeController.to.payMethod}" required="true"
											valueChangeListener="#{financeController.onPayMethodChanged}"
											reRender="InvoiceFinance_changeAmount" ajaxSingle="true">
											<f:selectItems value="#{configCollections.directPayMethods}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="InvoiceFinance_pendingAmount" 
											value="#{financeBundle.finance_pos_pending_amount}" />
										<aon:outputText id="InvoiceFinance_pendingAmount"
											styleClass="aon-bold"
											value="#{invoiceController.pendingAmount}">
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>

										<aon:outputLabel for="InvoiceFinance_paidAmount" 
											value="#{financeBundle.finance_pos_paid_amount}" />
										<aon:inputText id="InvoiceFinance_paidAmount"
											value="#{financeController.paidAmount}" 
											size="5" maxlength="7"
											valueChangeListener="#{financeController.onPaidAmountChanged}"
											reRender="InvoiceFinance_changeAmount" ajaxSingle="true" />

										<aon:outputLabel for="InvoiceFinance_changeAmount" 
											value="#{financeBundle.finance_pos_change_amount}" />
										<aon:outputText id="InvoiceFinance_changeAmount"
											styleClass="aon-bold"
											value="#{financeController.changeAmount}">
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
