<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showCalculatorWindow">
		<c:if test="#{cashCalculator.showCalculatorWindow}">
			<rich:modalPanel id="calculatorModalPanel" 
				minHeight="560" minWidth="340"
				rendered="#{cashCalculator.showCalculatorWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{financeBundle.finance_calculator}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showCalculatorWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{cashCalculator.showCalculatorWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="calculatorForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="calculator-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{controller.onAcceptCalculatorWindow}"
										reRender="#{modalReRender}"
										ajaxSingle="true">
										<rich:componentControl for="calculatorModalPanel"
											event="onclick" operation="hide"/>
										<f:setPropertyActionListener target="#{cashCalculator.showCalculatorWindow}"
											value="#{false}" />
										<f:setPropertyActionListener target="#{cashCalculator.recipient.amount}"
											value="#{cashCalculator.total}" />
									</aon:commandButton>	
									<aon:commandButton id="calculator-back" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}">
										<rich:componentControl for="calculatorModalPanel"
											event="onclick" operation="hide"/>
										<f:setPropertyActionListener target="#{cashCalculator.showCalculatorWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:htmlCommandLink id="calculator-report"
										styleClass="aon-finding-toolbar-item aon-icon-pdf"
										value="#{bundle.aon_report}" title="#{bundle.aon_report}"
										action="#{report.onExecute}" target="_blank">
										<f:param name="reportKey" value="#{calculatorReport}" />
									</aon:htmlCommandLink>	
								</aon:div>

								<aon:div styleClass="aon-scroll-area">
									<aon:panel>
										<f:facet name="header">
											<aon:outputText value="#{cashCalculator.headerLabel}" />
										</f:facet>

										<aon:panelGrid columns="3" styleClass="aon-width-250"
											columnClasses="aon-panelGrid-odd aon-width-auto aon-text-right,aon-panelGrid-even aon-width-80,
												aon-panelGrid-even aon-width-70 aon-bold aon-text-right">

											<f:facet name="header">
												<rich:columnGroup>
													<rich:column styleClass="aon-panelGrid-odd">
														<aon:outputLabel value="&#160;" />
													</rich:column>
													<rich:column styleClass="aon-panelGrid-even">
														<aon:outputLabel styleClass="aon-italic"
															value="#{bundle.aon_quantity}" />
													</rich:column>
													<rich:column styleClass="aon-panelGrid-even">
														<aon:outputLabel styleClass="aon-italic"
															value="#{bundle.aon_amount}" />
													</rich:column>
												</rich:columnGroup>
											</f:facet>

											<aon:outputLabel for="amount0" value="0,01 €" />
											<aon:inputText id="amount0" 
												value="#{cashCalculator.amounts[0]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result0,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount1" />
											</aon:inputText>
											<aon:outputText id="result0"
												value="#{cashCalculator.amounts[0]*0.01}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount1" value="0,02 €" />
											<aon:inputText id="amount1" 
												value="#{cashCalculator.amounts[1]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result1,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount2" />
											</aon:inputText>
											<aon:outputText id="result1"
												value="#{cashCalculator.amounts[1]*0.02}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount2" value="0,05 €" />
											<aon:inputText id="amount2" 
												value="#{cashCalculator.amounts[2]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result2,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount3" />
											</aon:inputText>
											<aon:outputText id="result2"
												value="#{cashCalculator.amounts[2]*0.05}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount3" value="0,10 €" />
											<aon:inputText id="amount3" 
												value="#{cashCalculator.amounts[3]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result3,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount4" />
											</aon:inputText>
											<aon:outputText id="result3"
												value="#{cashCalculator.amounts[3]*0.1}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount4" value="0,20 €" />
											<aon:inputText id="amount4" 
												value="#{cashCalculator.amounts[4]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result4,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount5" />
											</aon:inputText>
											<aon:outputText id="result4"
												value="#{cashCalculator.amounts[4]*0.2}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount5" value="0,50 €" />
											<aon:inputText id="amount5" 
												value="#{cashCalculator.amounts[5]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result5,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount6" />
											</aon:inputText>
											<aon:outputText id="result5"
												value="#{cashCalculator.amounts[5]*0.5}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount6" value="1 €" />
											<aon:inputText id="amount6" 
												value="#{cashCalculator.amounts[6]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result6,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount7" />
											</aon:inputText>
											<aon:outputText id="result6"
												value="#{cashCalculator.amounts[6]*1}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount7" value="2 €" />
											<aon:inputText id="amount7" 
												value="#{cashCalculator.amounts[7]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result7,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount8" />
											</aon:inputText>
											<aon:outputText id="result7"
												value="#{cashCalculator.amounts[7]*2}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount8" value="5 €" />
											<aon:inputText id="amount8" 
												value="#{cashCalculator.amounts[8]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result8,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount9" />
											</aon:inputText>
											<aon:outputText id="result8"
												value="#{cashCalculator.amounts[8]*5}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount9" value="10 €" />
											<aon:inputText id="amount9" 
												value="#{cashCalculator.amounts[9]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result9,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount10" />
											</aon:inputText>
											<aon:outputText id="result9"
												value="#{cashCalculator.amounts[9]*10}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount10" value="20 €" />
											<aon:inputText id="amount10" 
												value="#{cashCalculator.amounts[10]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result10,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount11" />
											</aon:inputText>
											<aon:outputText id="result10"
												value="#{cashCalculator.amounts[10]*20}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount11" value="50 €" />
											<aon:inputText id="amount11" 
												value="#{cashCalculator.amounts[11]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result11,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount12" />
											</aon:inputText>
											<aon:outputText id="result11"
												value="#{cashCalculator.amounts[11]*50}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount12" value="100 €" />
											<aon:inputText id="amount12" 
												value="#{cashCalculator.amounts[12]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result12,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount13" />
											</aon:inputText>
											<aon:outputText id="result12"
												value="#{cashCalculator.amounts[12]*100}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount13" value="200 €" />
											<aon:inputText id="amount13" 
												value="#{cashCalculator.amounts[13]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result13,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount14" />
											</aon:inputText>
											<aon:outputText id="result13"
												value="#{cashCalculator.amounts[13]*200}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel for="amount14" value="500 €" />
											<aon:inputText id="amount14" 
												value="#{cashCalculator.amounts[14]}" required="true"
												size="8" maxlength="8">
												<a4j:support event="onchange" reRender="result14,calculatorTotal" ignoreDupResponses="true" 
													ajaxSingle="true" focus="amount0" />
											</aon:inputText>
											<aon:outputText id="result14"
												value="#{cashCalculator.amounts[14]*500}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

										</aon:panelGrid>

										<aon:panelGrid id="calculatorTotal" columns="2" styleClass="aon-width-250 aon-margin-top"
											columnClasses="aon-panelGrid-odd aon-width-auto,aon-panelGrid-even aon-width-70 aon-bold aon-text-right">

											<aon:outputLabel value="#{bundle.aon_total}" />
											<aon:outputText value="#{cashCalculator.total}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputText value="#{financeBundle.finance_initial_amount}" />
											<aon:outputText value="#{cashCalculator.initialAmount}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:outputLabel value="#{cashCalculator.footerLabel}" />
											<aon:outputText value="#{cashCalculator.total - cashCalculator.initialAmount}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

										</aon:panelGrid>

									</aon:panel>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
