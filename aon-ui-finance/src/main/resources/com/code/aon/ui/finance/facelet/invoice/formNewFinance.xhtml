<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputLabel for="InvoiceFinance_generationMode" value="#{bundle.finance_finance}" />
	<aon:selectOneRadio id="InvoiceFinance_generationMode"
		value="#{invoiceController.financeGenerationMode}"
		valueChangeListener="#{invoiceController.onFinanceGenerationModeChanged}"
	 	reRender="#{formName}" ajaxSingle="true">
		<f:selectItem itemLabel="#{bundle.finance_automatic}" itemValue="0" />
		<f:selectItem itemLabel="#{bundle.finance_manual}" itemValue="1" />
		<f:selectItem itemLabel="#{bundle.finance_not_generate}" itemValue="-1" />
	</aon:selectOneRadio>				

	<aon:outputLabel for="Finance_dueDate" value="#{bundle.finance_finance_date}"
		rendered="#{invoiceController.financeGenerationMode == 1}" />
	<aon:selectInputDate id="Finance_dueDate"
		value="#{financeController.to.dueDate}"
		inputSize="8" required="true"
		rendered="#{invoiceController.financeGenerationMode == 1}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}">
		<a4j:support event="oninputchange" ajaxSingle="true" />
		<a4j:support event="onchanged" ajaxSingle="true" />
	</aon:selectInputDate>

	<aon:outputLabel for="Finance_payMethod" value="#{bundle.finance_payMethod}"
		rendered="#{invoiceController.financeGenerationMode == 1}" />
	<aon:selectOneMenu id="Finance_payMethod"
		value="#{financeController.to.payMethod}" required="true"
		rendered="#{invoiceController.financeGenerationMode == 1}"
		valueChangeListener="#{financeController.onPayMethodChanged}"
		reRender="InvoiceFinance_bankAccount_div" ajaxSingle="true">
		<f:selectItems value="#{configCollections.payMethods}" />
	</aon:selectOneMenu>

	<aon:div rendered="#{invoiceController.financeGenerationMode == 1}">
		<aon:outputLabel value="#{bundle.aon_iban}" />
	</aon:div>
	<aon:div id="InvoiceFinance_bankAccount_div" styleClass="aon-nowrap" rendered="#{invoiceController.financeGenerationMode == 1}">
		<aon:panelGroup id="InvoiceFinance_bankAccount" rendered="#{financeController.showBankManualInput}">
			<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
				<ui:param name="bankAccountTo" value="#{financeController.to.bankAccount}" />
				<ui:param name="bankAccountPrefix" value="#{invoiceController.beanName}" />
				<ui:param name="bankAccountSuffix" value="-Invoice" />
				<ui:param name="bankAccountReRender" value="CreateBank_panel" />
			</ui:include>
			<aon:commandButton id="bankAccountData" value="&#160;"
				title="#{bundle.aon_bank_data}"
				styleClass="aon-icon-commandButton aon-icon-ambito aon-margin-left" style="margin-top: 2px;"
				actionListener="#{financeController.onBankAccountData}"
				reRender="Finance_bankAlias,Finance_bic" ajaxSingle="true">
			</aon:commandButton>
			<aon:panelGroup id="CreateBank_panel">
				<aon:commandButton id="CreateBank"
					value="&#160;" title="#{bundle.config_bank_creation} #{invoiceController.to.registryName}"
					styleClass="aon-editDataTable-button aon-lookupButton-new"
					rendered="#{financeController.bankCreationEnabled}"
					onclick="if (!confirm('#{bundle.config_bank_creation_confirm} #{invoiceController.to.registryName}?')) return false;"	
					actionListener="#{financeController.onAddRegistryBank}"
					reRender="InvoiceFinance_bankAccount" ajaxSingle="true" />
			</aon:panelGroup>
			<aon:commandLink id="BankAccount_hide_bank_manual"
				value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
				styleClass="aon-icon-edit-end-simple" style="margin-left: 5px; padding-right: 12px;"
				rendered="#{financeController.showBankManualInput}"  
				actionListener="#{financeController.onBankManualInput}"
				reRender="InvoiceFinance_bankAccount_div" ajaxSingle="true">
				<f:setPropertyActionListener target="#{financeController.showBankManualInput}"
					value="#{false}" />
			</aon:commandLink>
		</aon:panelGroup>
		<aon:div>
			<aon:div style="margin-top:2px;" rendered="#{financeController.showBankManualInput}">
				<aon:outputLabel for="Finance_bankAlias" styleClass="aon-margin-right"
					value="#{bundle.aon_bank}" />
				<aon:inputText id="Finance_bankAlias"
					value="#{financeController.to.bankAlias}" 
					required="true" size="25" maxlength="25" />
				<aon:outputLabel for="Finance_bic" styleClass="aon-margin-left aon-margin-right"
					value="#{bundle.aon_bic}" />
				<aon:inputText id="Finance_bic"
					value="#{financeController.to.bic}" 
					size="12" maxlength="11">
					<f:validateLength minimum="11" maximum="11" />
				</aon:inputText>
			</aon:div>

			<aon:selectOneMenu id="Finance_registryBank"
				value="#{financeController.registryBank}"
				rendered="#{!financeController.showBankManualInput}"
				valueChangeListener="#{financeController.onRBankChanged}"
				reRender="Finance_registryBank" ajaxSingle="true">
				<f:selectItem value="#{null}" />
				<f:selectItems value="#{financeController.activeBanks}" />
			</aon:selectOneMenu>
			<aon:commandLink id="BankAccount_show_bank_manual"
				value="&#160;" title="#{bundle.aon_edit}"
				styleClass="aon-icon-edit-add-simple" style="margin-left: 5px; padding-right: 12px;"
				rendered="#{!financeController.showBankManualInput}"  
				actionListener="#{financeController.onBankManualInput}"
				reRender="InvoiceFinance_bankAccount_div" ajaxSingle="true">
				<f:setPropertyActionListener target="#{financeController.showBankManualInput}"
					value="#{true}" />
			</aon:commandLink>
		</aon:div>
	</aon:div>

</ui:composition>
