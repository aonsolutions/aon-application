<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="invoiceExporterForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_invoiceExport_module}" />
				<ui:param name="controller" value="#{invoiceExporter}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{invoiceExporter}" />
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">
					
					<aon:outputLabel for="Invoice_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Invoice_type"
						converter="aon.EnumConverter"
						valueChangeListener="#{invoiceExporter.addEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{financeCollections.invoiceTypes}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Invoice_issueDate-From" styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Invoice_issueDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
				
						<aon:outputLabel for="Invoice_issueDate-To" styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Invoice_issueDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>
					
					<aon:outputLabel for="Invoice_referenceCode"
						value="#{bundle.aon_document_number}" />
					<aon:inputText id="Invoice_referenceCode"
						valueChangeListener="#{controller.addExpression}"
						size="40" maxlength="32" />
					
					<aon:outputLabel value="#{bundle.stat_total}" />
					<aon:inputText id="Invoice_total"
						valueChangeListener="#{controller.addExpression}"
						size="10" />
				
					<c:if test="#{aonRole.confidentiality}">
						<aon:outputLabel for="Invoice_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneRadio id="Invoice_securityLevel"
							valueChangeListener="#{controller.addExpression}">
							<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
							<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
						</aon:selectOneRadio>				
					</c:if>
				
					<c:if test="#{company.EInvoice}">
						<aon:outputLabel for="Invoice_signed" value="#{bundle.finance_signed}" />
						<aon:selectOneRadio id="Invoice_signed"
							valueChangeListener="#{controller.addExpression}">
							<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
							<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
						</aon:selectOneRadio>				
					</c:if>
					
				</ui:define>
			
			</ui:decorate>

		</aon:form>

	</ui:define>
	
</ui:composition>
