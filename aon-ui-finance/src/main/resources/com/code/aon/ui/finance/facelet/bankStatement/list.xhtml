<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="bankStatementList">
			<aon:div>
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{bundle.finance_bank_statement_module}" />
					<ui:param name="controller" value="#{bankStatement}" />
					<ui:param name="skipSearchButton" value="false" />

					<ui:define name="additionalToolbarContent">
						<aon:commandButton id="BankStatement-remove"
							value="#{bundle.aon_remove}"
							title="#{bundle.finance_remove_selected}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							rendered="#{!controller.nevv and controller.to == null}"
							actionListener="#{controller.onRemoveSelected}"
							reRender="#{dataTableId}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						<aon:commandButton id="BankStatement-back"
							title="#{bundle.aon_key_cancel_accelerator}"
							value="#{bundle.aon_back}" immediate="true"
							rendered="#{!formNew and controller.backActionListener != null}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{controller.onBackActionListener}"
							action="#{controller.backAction}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="BankStatement-import"
							value="#{bundle.aon_import}"
							title="#{bundle.aon_import}"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							rendered="#{!controller.nevv and controller.to == null}"
							actionListener="#{controller.onImportFileShow}"
							reRender="showImportFileWindow">
							<f:setPropertyActionListener target="#{controller.showImportFileWindow}"
								value="#{true}" />
						</aon:commandButton>
						<aon:commandButton id="BankStatement-checkAuto"
							value="#{bundle.finance_bank_statement_check_auto}"
							title="#{bundle.finance_bank_statement_check_auto}"
							styleClass="aon-finding-toolbar-item aon-icon-attach-file"
							rendered="#{!controller.nevv and controller.to == null}"
							actionListener="#{controller.onAutoCheckSelected}"
							reRender="#{dataTableId}">
							<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
						</aon:commandButton>
						<aon:htmlCommandLink id="bankStatementList-excel-report"
							value="&#160;" target="_blank" action="#{bankStatement.onExcelReport}"
							styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						</aon:htmlCommandLink>
						<aon:htmlCommandLink id="bankStatementList-report"
							value="#{bundle.aon_listing}" target="_blank" action="#{report.onExecute}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf"
							accesskey="#{bundle.aon_key_print}">
							<f:param name="reportKey" value="bankStatementList" />
						</aon:htmlCommandLink>
						<aon:if test="#{aonRole.accountingOperator}">
							<aon:commandButton id="BankStatement-record"
								value="#{bundle.finance_record}"
								title="#{bundle.finance_record_selected}"
								styleClass="aon-finding-toolbar-item aon-icon-task-assume"
								rendered="#{!controller.nevv and controller.to == null}"
								actionListener="#{controller.onRecordSelected}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>
						<aon:if test="#{aonRole.accountingManager}">
							<aon:commandButton id="BankStatement-unrecord"
								value="#{bundle.finance_unrecord}"
								title="#{bundle.finance_unrecord_selected}"
								styleClass="aon-finding-toolbar-item aon-icon-task-liberate"
								rendered="#{!controller.nevv and controller.to == null}"
								actionListener="#{controller.onUnrecordSelected}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>
 					</ui:define>
				</ui:decorate>

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
					<aon:div id="bankStatementCommandContainer"
						style="background-color:#f6f5e3; padding:5px; margin-bottom:5px;"
						rendered="#{!bankStatement.nevv and bankStatement.to == null}">
						<aon:div>
							<aon:outputText value="#{bundle.aon_see}:" styleClass="aon-bold" />
							<aon:commandLink id="BankStatement-seeAll"
								value="#{bundle.finance_all}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeAll}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-seePending"
								value="#{bundle.seller_stat_control_pending}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeePending}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-seeChecked"
								value="#{bundle.finance_list_checked}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeChecked}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-seeExact"
								value="#{bundle.finance_check_exact}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeExact}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-seeApproximate"
								value="#{bundle.finance_check_approximate}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeApproximate}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-seeAmbiguous"
								value="#{bundle.finance_check_ambiguous}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeAmbiguous}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-seeRecorded"
								value="#{bundle.finance_list_recorded}"
								style="padding-right:120px; margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeRecorded}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />

							<aon:if test="#{aonRole.accountingOperator}">
								<aon:outputText value="#{bundle.finance_check_selected}:" styleClass="aon-bold aon-margin-right" />
								<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
									<ui:param name="lookupTo" value="#{bankStatement.account}" />
								</ui:include>
								<aon:commandButton id="BankStatement-checkByAccount"
									value="#{bundle.finance_bank_statement_check}"
									styleClass="aon-finding-toolbar-item aon-icon-attach-file aon-noborder"
									actionListener="#{bankStatement.onCheckSelectedByAccount}"
									reRender="#{dataTableId}"
									onclick="Richfaces.showModalPanel('waitProccess')"
									oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							</aon:if>							
						</aon:div>
						<aon:div>
							<aon:outputText value="#{bundle.aon_check}:" styleClass="aon-bold" />
							<aon:commandLink id="BankStatement-selectPending"
								value="#{bundle.seller_stat_control_pending}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectPending}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-selectChecked"
								value="#{bundle.finance_list_checked}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectChecked}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-selectExact"
								value="#{bundle.finance_check_exact}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectExact}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-selectApproximate"
								value="#{bundle.finance_check_approximate}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectApproximate}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-selectAmbiguous"
								value="#{bundle.finance_check_ambiguous}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectAmbiguous}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-selectRecorded"
								value="#{bundle.finance_list_recorded}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectRecorded}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-selectCurrentPage"
								value="#{bundle.finance_list_current_page}"
								style="padding-right:32px; margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectCurrentPage}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />

							<aon:outputText value="#{bundle.finance_check_selected}:" styleClass="aon-bold" />
							<aon:selectOneMenu id="BankStatement_bankConcept"
								value="#{bankStatement.bankConcept}"
								styleClass="aon-margin-left">
								<f:selectItems value="#{financeCollections.bankConcepts}" />
							</aon:selectOneMenu>
							<aon:commandButton id="BankStatement-checkByConcept"
								value="#{bundle.finance_bank_statement_check}"
								styleClass="aon-finding-toolbar-item aon-icon-attach-file aon-noborder"
								actionListener="#{bankStatement.onCheckSelectedByConcept}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:div>
						<aon:div>
							<aon:outputText value="#{bundle.finance_tobreakdown}:" styleClass="aon-bold" />
							<aon:commandLink id="BankStatement-breakdownSelected"
								value="#{bundle.finance_checked}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onBreakdownSelected}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-breakdownCurrentPage"
								value="#{bundle.finance_list_current_page}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onBreakdownCurrentPage}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-breakdownNone"
								value="#{bundle.finance_none}"
								style="padding-right:308px; margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onBreakdownNone}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />

							<aon:outputText value="#{bundle.finance_cancel_checks}:" styleClass="aon-bold" />
							<aon:commandLink id="BankStatement-cancelAll"
								value="#{bundle.finance_all}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onCancelAll}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-cancelSelected"
								value="#{bundle.finance_checked}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onCancelSelected}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-cancelExact"
								value="#{bundle.finance_check_exact}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onCancelExact}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-cancelApproximate"
								value="#{bundle.finance_check_approximate}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onCancelApproximate}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink id="BankStatement-cancelAmbiguous"
								value="#{bundle.finance_check_ambiguous}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onCancelAmbiguous}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:div>
					</aon:div>

					<aon:div id="bankStatementDataContainer">
						<aon:panelGrid id="registryBankTable" columns="2" style="width:100%;"
							columnClasses="aon-panelGrid-odd aon-width-140
								,aon-panelGrid-even aon-width-auto">
							<aon:outputText value="#{bundle.aon_bank}" />
							<aon:selectOneMenu id="BankStatement_registryBank"
								value="#{bankStatement.registryBank}"
								valueChangeListener="#{bankStatement.onChangeBank}"
								reRender="bankStatementDataContainer"
								disabled="#{bankStatement.nevv or bankStatement.to != null}" 
								ajaxRendered="true">
								<f:selectItems value="#{companyCollections.allCompanyBanks}" />
							</aon:selectOneMenu>
						</aon:panelGrid>

						<aon:div styleClass="aon-padding-top">
							<aon:panel>
								<f:facet name="header">
									<aon:outputLabel for="bankStatementData" 
										value="#{bundle.finance_bank_statement_detail}" />
								</f:facet>

								<ui:decorate
									template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
									<ui:param name="controller" value="#{bankStatement}" />
									<ui:param name="forLines" value="#{false}" />
									<ui:param name="skipLineEdition" value="#{true}" />
									<ui:param name="skipRemoveButton" value="#{controller.to.recorded}" />
									<ui:param name="resetButtonReRender" value="aonContent" />
									<ui:param name="newSaveButtonReRender" value="aonContent" />
									<ui:param name="saveButtonReRender" value="aonContent" />
									<ui:param name="newCancelButtonReRender" value="aonContent" />
									<ui:param name="cancelButtonReRender" value="aonContent" />
									<ui:param name="removeButtonReRender" value="aonContent" />
									<ui:define name="beginFormListContent">
										<aon:commandLink id="BankStatement-selectButton"
											styleClass="aon-table-row-link" value="&#160;"
											immediate="true" ajaxSingle="true" requestDelay="100"
											rendered="#{!to.recorded}"
											actionListener="#{controller.onSelect}"
											reRender="aonContent"
											onkeyup="#{dataTableId}KeyUp(this)"
											onfocus="#{dataTableId}SelectRow(this)"
											onblur="#{dataTableId}DeselectRow(this)"
											focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
										</aon:commandLink>
									</ui:define>
									<ui:define name="columns">
										<aon:column styleClass="aon-editDataTable-iconColumn">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:selectBooleanCheckbox id="BankStatementCheck"
												value="#{controller.bankStatementRowChecked}"
												valueChangeListener="#{controller.bankStatementRowSelected}" />	
										</aon:column>

										<aon:column styleClass="aon-editDataTable-iconColumn">
											<f:facet name="header">
												<aon:outputText value="I" />
											</f:facet>
											<aon:div style="display:inline; cursor:pointer;"
												rendered="#{controller.errorMessage != null}">
												<aon:outputText value="&#160;" styleClass="aon-icon-exception"
													style="padding-left:12px" />
												<rich:toolTip>
													<aon:outputText value="#{controller.errorMessage}" />
												</rich:toolTip>
											</aon:div>
											<aon:div style="display:inline; cursor:pointer;"
												rendered="#{to.checked and controller.errorMessage == null}">
												<aon:outputText value="&#160;" styleClass="aon-icon-point-green"
													style="padding-left:12px" rendered="#{to.exact}"
													title="#{bundle.finance_check_exact_message}" />
												<aon:outputText value="&#160;" styleClass="aon-icon-point-light-green"
													style="padding-left:12px" rendered="#{to.approximate}"
													title="#{bundle.finance_check_approximate_message}" />
												<aon:outputText value="&#160;" styleClass="aon-icon-point-yellow"
													style="padding-left:12px" rendered="#{to.ambiguous}"
													title="#{bundle.finance_check_ambiguous_message}" />
												<aon:outputText value="&#160;" styleClass="aon-icon-point-orange"
													style="padding-left:12px" rendered="#{to.inexact}"
													title="#{bundle.finance_check_very_ambiguous_message}" />
												<rich:toolTip showEvent="onclick" hideEvent="onmouseout" hideDelay="2000" direction="top-right">
													<aon:commandButton id="BankStatement-toExact"
														value="&#160;" styleClass="aon-icon-point-green aon-noborder"
														rendered="#{!to.exact and controller.pendingAmount == 0}"
														actionListener="#{controller.onSetVeryHighReliability}"
														reRender="#{dataTableId}" />
													<aon:commandButton id="BankStatement-toApproximate"
														value="&#160;" styleClass="aon-icon-point-light-green aon-noborder"
														rendered="#{!to.approximate}"
														actionListener="#{controller.onSetHighReliability}"
														reRender="#{dataTableId}" />
													<aon:commandButton id="BankStatement-toAmbiguous"
														value="&#160;" styleClass="aon-icon-point-yellow aon-noborder"
														rendered="#{!to.ambiguous}"
														actionListener="#{controller.onSetMediumReliability}"
														reRender="#{dataTableId}" />
													<aon:commandButton id="BankStatement-toVeryAmbiguous"
														value="&#160;" styleClass="aon-icon-point-orange aon-noborder"
														rendered="#{!to.inexact}"
														actionListener="#{controller.onSetLowReliability}"
														reRender="#{dataTableId}" />
												</rich:toolTip>
											</aon:div>
										</aon:column>

										<aon:column alias="BankStatement.lotNumber"
											styleClass="aon-editDataTable-textColumn aon-width-40">
											<f:facet name="header">
												<aon:outputText value="#{bundle.finance_bank_statement_lot}" />
											</f:facet>
											<aon:outputText value="#{to.lotNumber}" />
											<f:facet name="footer">
												<aon:outputText value="#{controller.to.lotNumber}" />
											</f:facet>
										</aon:column>

										<aon:column alias="BankStatement.operationDate"
											styleClass="aon-editDataTable-textColumn aon-width-100">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_date}" />
											</f:facet>
											<aon:outputText value="#{to.operationDate}" 
												rendered="#{formList or !controller.to.pending}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
											<aon:selectInputDate id="BankStatement_operationDate" 
												value="#{controller.to.operationDate}" inputSize="7"
												rendered="#{formEdit and controller.to.pending}" required="true"
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}"/>
											<f:facet name="footer">
												<aon:selectInputDate id="BankStatement_operationDate-New" 
													value="#{controller.to.operationDate}" inputSize="7"
													rendered="#{formNew}" required="true"
													timeZone="#{timeZoneController.timeZone}"
													popupDateFormat="#{bundle.aon_date_pattern}"/>
											</f:facet>
										</aon:column>

										<aon:if test="#{aonRole.confidentiality}">
											<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
												<f:facet name="header">
													<aon:outputText value="&#160;" title="#{bundle.aon_confidential}"
														styleClass="aon-icon-confidential" style="padding-left:15px" />
												</f:facet>
												<aon:outputText value="&#160;"
													rendered="#{formList or controller.to.recorded}"
													styleClass="#{to.confidential?'aon-icon-checked':'aon-icon-check'}" 
													style="padding-left:20px" />
												<aon:selectBooleanCheckbox id="BankStatement_securityLevel"
													value="#{controller.to.confidential}" 
													rendered="#{formEdit and !controller.to.recorded}" />
												<f:facet name="footer">
													<aon:selectBooleanCheckbox id="BankStatement_securityLevel-New"
														value="#{controller.to.confidential}" 
														rendered="#{formNew}" />
												</f:facet>
											</aon:column>
										</aon:if>
 
										<aon:column alias="BankStatement.commonConcept"
											styleClass="aon-editDataTable-textColumn aon-width-120">
