<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="prepaymentList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_prepayment_module}" />
				<ui:param name="controller" value="#{prepayment}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{prepayment}" />
					
					<ui:define name="columns">
 
						<aon:column alias="Prepayment.finance.dueDate">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.finance.dueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Prepayment.creditor.registry.name">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_creditor}" />
							</f:facet>
							<aon:outputText value="#{to.creditor.registry.name}" />
						</aon:column>

						<aon:column alias="Prepayment.customer.registry.name">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_customer}" />
							</f:facet>
							<aon:outputText value="#{to.customer.registry.name}" />
						</aon:column>

						<aon:column alias="Prepayment.finance.concept">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_concept}" />
							</f:facet>
							<aon:outputText value="#{to.finance.concept}" />
						</aon:column>

						<aon:column alias="Prepayment.finance.financeStatus">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_status_payment}" />
							</f:facet>
							<aon:outputText value="#{to.finance.financeStatus}" />
						</aon:column>

						<aon:column alias="Prepayment.collect">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_status_charge}" />
							</f:facet>
							<aon:outputText value="#{bundle.aon_pending}" rendered="#{to.collectFee}" />
							<aon:outputText value="#{bundle.finance_invoiced}" rendered="#{to.collectInvoice}" />
						</aon:column>

						<aon:column alias="Prepayment.finance.amount">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{to.finance.amount}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
