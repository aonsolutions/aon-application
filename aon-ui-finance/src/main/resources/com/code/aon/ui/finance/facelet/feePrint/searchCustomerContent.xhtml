<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
 					
	<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{feePrintSearch.customer}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>
					
	<aon:outputLabel for="CustomerFee_customer_status"
		value="#{bundle.aon_status}" />
	<aon:selectOneMenu id="CustomerFee_customer_status"
		value="#{feePrintSearch.status}">						
		<f:selectItem itemLabel="-" value="#{null}"/> 
		<f:selectItems value="#{customerCollections.customerStatuses}" />
	</aon:selectOneMenu>

	<aon:if test="#{currentUserScopes[1] != null}">
		<aon:outputLabel for="CustomerFee_customer_scope_id"
			value="#{bundle.aon_scope}" />
			<aon:selectOneMenu id="CustomerFee_customer_scope_id"
				value="#{feePrintSearch.scope}">
				<f:selectItem itemLabel="-" value="#{null}"/> 
				<f:selectItems value="#{currentUserScopes}" />
		</aon:selectOneMenu>
	</aon:if>
	
</ui:composition>
