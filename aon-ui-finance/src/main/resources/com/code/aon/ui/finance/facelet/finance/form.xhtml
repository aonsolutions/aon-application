<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="financeForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{(finance.payment)?(bundle.finance_payment_module):(bundle.finance_charge_module)}" />
				<ui:param name="controller" value="#{finance}" />
				<ui:param name="skipSaveButton" value="#{!finance.nevv and !finance.pending and !finance.returned}" />
				<ui:param name="skipRemoveButton" value="#{finance.nevv or !finance.to.emptyInvoice or finance.grouped}" />
				<ui:param name="showMoreMenu" value="#{!finance.nevv}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="paymentPopup" 
						value="#{(finance.payment)?(bundle.finance_to_pay):(bundle.finance_to_charge)}"
						immediate="#{true}" rendered="#{!finance.nevv and (finance.pending or finance.returned)}"
						styleClass="aon-finding-toolbar-item aon-icon-pay"
						actionListener="#{finance.onFinancePaymentShow}"
						reRender="showFinancePaymentWindow">
						<f:setPropertyActionListener target="#{finance.showFinancePaymentWindow}"
							value="#{true}" />
					</aon:commandButton>
					<aon:commandButton id="returnPopup" 
						value="#{bundle.finance_to_return}"
						immediate="#{true}" rendered="#{!finance.nevv and finance.paid}"
						styleClass="aon-finding-toolbar-item aon-icon-return"
						actionListener="#{finance.onFinanceReturnShow}"
						reRender="showFinanceReturnWindow">
						<f:setPropertyActionListener target="#{finance.showFinanceReturnWindow}"
							value="#{true}" />
					</aon:commandButton>
					<aon:commandButton id="settle" 
						value="#{bundle.finance_to_settle}"
						immediate="#{true}" rendered="#{!finance.nevv and (finance.pending or finance.returned)}"
						styleClass="aon-finding-toolbar-item aon-icon-settle"
						actionListener="#{finance.onSettleFinance}" />
					<aon:commandButton id="fraction" 
						value="#{bundle.finance_to_fraction}"
						immediate="#{true}" rendered="#{!finance.nevv and (finance.pending or finance.returned)}"
						styleClass="aon-finding-toolbar-item aon-icon-fraction"
						actionListener="#{financeFraction.onFractionFinance}" action="finance_fraction" />
					<aon:commandButton id="email" 
						value="EMAIL"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-webmail2"
						actionListener="#{finance.onSendByEmail}" />
				</ui:define>				
				<ui:define name="moreMenuContent">
					<aon:menuItem id="remarks"
						value="#{bundle.aon_remark}"
						iconClass="aon-icon-notes"
						reRender="showRemarksWindow">
						<f:setPropertyActionListener target="#{finance.showRemarksWindow}"
							value="#{true}" />							
					</aon:menuItem>		
					<ui:include
						src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />					
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4"
					styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-140
						,aon-panelGrid-even aon-width-500
						,aon-panelGrid-odd aon-width-140
						,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel
						rendered="#{!finance.nevv and !finance.to.emptyInvoice}"  
						value="#{bundle.finance_invoice}" />
					<aon:outputLabel for="Finance_type"
						rendered="#{finance.nevv or finance.to.emptyInvoice}" 
						value="#{bundle.aon_type}" />
					<aon:div>
						<aon:panelGrid columns="2" columnClasses="aon-width-250,aon-width-auto">
							<aon:div rendered="#{!finance.nevv}" >
								<aon:div rendered="#{finance.to.emptyInvoice and !finance.financeGroup}">
									<aon:outputText value="#{bundle.finance_individual_finance}" />
								</aon:div>
								<aon:div rendered="#{finance.to.emptyInvoice and finance.financeGroup}">
									<aon:outputText value="#{bundle.finance_agrupation_finance}" />
								</aon:div>
								<aon:div>
									<aon:div rendered="#{!finance.to.emptyInvoice}"> 
										<aon:outputText styleClass="aon-bold"
											value="#{finance.to.referenceCode}"
											rendered="#{!finance.to.emptyInvoice}" />
										<aon:outputText styleClass="aon-italic aon-margin-left"
											value="(#{bundle.aon_date}: "
											rendered="#{!finance.to.emptyInvoice}" />
										<aon:outputText styleClass="aon-bold"
											value="#{finance.to.invoice.issueDate}"
											rendered="#{!finance.to.emptyInvoice}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>
										<aon:outputText styleClass="aon-italic"
											value=")"
											rendered="#{!finance.to.emptyInvoice}" />
										<aon:commandLink id="invoice_link" immediate="true"
											styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
											value="&#160;" title="#{bundle.aon_go}"
											rendered="#{!finance.to.emptyInvoice}"
											actionListener="#{finance.onLoadInvoice}"
											action="#{finance.getInvoiceViewer}" />
			 						</aon:div>
			 					</aon:div>
		 					</aon:div>
							<aon:div rendered="#{finance.nevv}">
								<aon:selectOneRadio id="Finance_type"
									value="#{finance.financeGroup}"
									reRender="Finance_amount-Panel, financeGroup-button">
									<f:selectItem itemLabel="#{bundle.finance_individual_finance}" itemValue="false" />
									<f:selectItem itemLabel="#{bundle.finance_agrupation_finance}" itemValue="true" />
								</aon:selectOneRadio>	
							</aon:div> 		
						
							<aon:div>
								<aon:selectBooleanCheckbox id="Finance_advance"
									value="#{finance.to.advance}"
									rendered="#{!finance.payment}"
									disabled="#{!finance.to.emptyInvoice or !finance.pending}" />
								<aon:outputText styleClass="aon-italic aon-margin-right"
									value="#{bundle.finance_advance}"
									rendered="#{!finance.payment}" />

								<aon:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Finance_securityLevel"
										value="#{finance.to.confidential}"
										rendered="#{finance.to.emptyInvoice and finance.pending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{finance.to.emptyInvoice and finance.pending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{(!finance.to.emptyInvoice or !finance.pending) and finance.to.confidential}" />
								</aon:if>
							</aon:div>
						</aon:panelGrid>
									
					</aon:div>					

					<aon:outputLabel for="Finance_dueDate"
						value="#{bundle.finance_finance_date}" />
					<aon:div>
						<aon:selectInputDate id="Finance_dueDate" 
							value="#{finance.to.dueDate}"
							disabled="#{!finance.pending and !finance.returned}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputText styleClass="aon-margin-left"
							value="#{finance.to.financeStatus}"
							rendered="#{!finance.nevv}" />
					</aon:div>

					<aon:outputLabel for="Finance_concept" 
						value="#{bundle.aon_document_number}" />
					<aon:div> 
						<aon:inputText id="Finance_concept"
							value="#{finance.to.concept}" 
							onblur="toUpperCase(this);"
							rendered="#{finance.to.emptyInvoice and finance.pending}"
							required="true" size="45" maxlength="32" />
						<aon:outputText styleClass="aon-bold"
							value="#{finance.to.documentNumber}"
							rendered="#{!finance.to.emptyInvoice or !finance.pending}" />
					</aon:div>
					
					<aon:outputLabel for="Finance_payMethod_id"
						value="#{bundle.finance_payMethod}" />
					<aon:selectOneMenu id="Finance_payMethod_id"
						value="#{finance.to.payMethod}"
						valueChangeListener="#{finance.onPayMethodChanged}"
						reRender="Finance_registryBank_id,Finance_bankAccount_panel"
						disabled="#{!finance.pending and !finance.returned}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>
					
					<aon:div rendered="#{!finance.to.payroll}">
						<aon:outputLabel for="Customer_id"
							value="#{bundle.finance_debtor}"
							rendered="#{!finance.to.payment}" />
						<aon:outputLabel for="Supplier_id"
							value="#{bundle.aon_creditor}"
							rendered="#{finance.to.payment and finance.purchase}" />
						<aon:outputLabel for="Creditor_id"
							value="#{bundle.aon_creditor}"
							rendered="#{finance.to.payment and !finance.purchase}" />
						<aon:selectOneRadio id="Finance_purchase"
							styleClass="aon-italic aon-normal" style="font-size: 11px;"
							value="#{finance.purchase}"
							rendered="#{finance.nevv and finance.to.payment}"
							valueChangeListener="#{finance.onPaymentTypeChanged}"
							reRender="paymentTypeDiv">
							<f:selectItem itemLabel="#{bundle.aon_expense}" itemValue="false" />
							<f:selectItem itemLabel="#{bundle.finance_purchase}" itemValue="true" />
						</aon:selectOneRadio>
					</aon:div>
					<aon:div rendered="#{finance.to.payroll}">
						<aon:outputLabel for="Person_id"
							value="#{bundle.payroll_salary_employee}" />
					</aon:div>
					<aon:div id="paymentTypeDiv" rendered="#{!finance.to.payroll}">
						<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
							<ui:param name="lookupTo" value="#{finance.to.registry}" />
							<ui:param name="lookupForRegistry" value="#{true}" />
							<ui:param name="lookupInputNameValue" value="#{finance.to.registryName}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupDisabled" value="#{!finance.nevv}" />
							<ui:param name="lookupRendered" value="#{!finance.to.payment}" />
							<ui:param name="lookupReRender" value="Finance_holder_document, Finance_amount-Panel, financeGroup-button" />
							<ui:param name="idRequired" value="#{true}" />						
							<ui:param name="skipSuggestText" value="#{finance.to.registry != null and finance.to.registry.id != null}" />
							<aon:methodParam name="lookupChangeListener"
								value="#{finance.registryData}" type="lookupChangeListener" />
						</ui:include>
						<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
							<ui:param name="lookupTo" value="#{finance.to.registry}" />
							<ui:param name="lookupForRegistry" value="#{true}" />
							<ui:param name="lookupInputNameValue" value="#{finance.to.registryName}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupDisabled" value="#{!finance.nevv}" />
							<ui:param name="lookupRendered" value="#{finance.to.payment and finance.purchase}" />
							<ui:param name="lookupReRender" value="Finance_holder_document, Finance_amount-Panel, financeGroup-button" />
							<ui:param name="idRequired" value="#{true}" />						
							<ui:param name="skipSuggestText" value="#{finance.to.registry != null and finance.to.registry.id != null}" />
							<aon:methodParam name="lookupChangeListener"
								value="#{finance.registryData}" type="lookupChangeListener" />
						</ui:include>
						<ui:include src="/com/code/aon/ui/finance/facelet/creditor/lookup.xhtml">
							<ui:param name="lookupTo" value="#{finance.to.registry}" />
							<ui:param name="lookupForRegistry" value="#{true}" />
							<ui:param name="lookupInputNameValue" value="#{finance.to.registryName}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupDisabled" value="#{!finance.nevv}" />
							<ui:param name="lookupRendered" value="#{finance.to.payment and !finance.purchase}" />
							<ui:param name="lookupReRender" value="Finance_holder_document, Finance_amount-Panel, financeGroup-button" />
							<ui:param name="idRequired" value="#{true}" />						
							<ui:param name="skipSuggestText" value="#{finance.to.registry != null and finance.to.registry.id != null}" />
							<aon:methodParam name="lookupChangeListener"
								value="#{finance.registryData}" type="lookupChangeListener" />
						</ui:include>
					</aon:div>
					<aon:div rendered="#{finance.to.payroll}">
						<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{finance.to.registry}" />
							<ui:param name="lookupForRegistry" value="#{true}" />
							<ui:param name="lookupInputNameValue" value="#{finance.to.registryName}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupDisabled" value="#{!finance.nevv}" />
							<ui:param name="lookupReRender" value="Finance_holder_document, Finance_amount-Panel, financeGroup-button" />
							<ui:param name="idRequired" value="#{true}" />						
							<ui:param name="skipSuggestText" value="#{finance.to.registry != null and finance.to.registry.id != null}" />
							<aon:methodParam name="lookupChangeListener"
								value="#{finance.registryData}" type="lookupChangeListener" />
						</ui:include>
					</aon:div>

					<aon:outputLabel for="Finance_amount"
						value="#{bundle.aon_amount}" />
					<aon:panelGroup id="Finance_amount-Panel">
						<aon:inputText id="Finance_amount"
							value="#{finance.to.amount}"
							disabled="#{!finance.to.emptyInvoice or (!finance.pending and !finance.returned) or finance.financeGroup or finance.to.prepayment}"
							required="true" size="10"
							ajaxSingle="true" reRender="Finance_total" />
						<aon:commandLink id="Finance_financeGroup_button"
							rendered="#{finance.financeGroup and finance.to.registry.id!=null and (finance.pending or finance.returned)}" 
							reRender="showFinanceGroupWindow" ajaxSingle="true"
							actionListener="#{finance.onShowFinanceGroupWindow}"
							styleClass="aon-icon-newFolder aon-margin-left" style="padding-right: 20px;"
							value="&#160;" title="#{bundle.finance_group_finances}" >
							<f:setPropertyActionListener target="#{finance.showFinanceGroupWindow}"
								value="#{true}" />
						</aon:commandLink>
							
						<aon:outputText styleClass="aon-italic aon-margin-left"
							value="(#{bundle.finance_total_regs}: " rendered="#{finance.financeGroup}" />
						<aon:outputText styleClass="aon-bold"
							value="#{financeGroupList.model.rowCount}"
							rendered="#{finance.financeGroup}" >
						</aon:outputText>
						<aon:outputText styleClass="aon-italic"
							value=")" rendered="#{finance.financeGroup}" />
					</aon:panelGroup>
					
					<aon:outputLabel for="Finance_registry_document"
						value="#{bundle.aon_company_document}" />
					<aon:panelGroup id="Finance_holder_document">
						<aon:selectOneMenu id="Finance_registry_document_type" 
							disabled="#{!finance.nevv}"
							value="#{finance.to.registryDocumentType}"
							reRender="Finance_holder_document_icon">
							<f:selectItems value="#{registryCollections.documentTypes}" />
						</aon:selectOneMenu>
						<aon:outputText styleClass="aon-margin-left aon-italic"
							value="#{bundle.aon_country}" />
						<aon:selectOneMenu id="Finance_registry_document_country"
							styleClass="aon-margin-left" disabled="#{!finance.nevv}"
							value="#{finance.to.registryDocumentCountry}"
							reRender="Finance_holder_document_icon">
							<f:selectItems value="#{commonCollections.countryCodes}" />
						</aon:selectOneMenu>
						<aon:inputText id="Finance_registry_document" 
							style="margin-left: 5px;" disabled="#{!finance.nevv}"
							value="#{finance.to.registryDocument}" size="16" maxlength="16"
							reRender="Finance_holder_document_icon" 
							onblur="toUpperCase(this);">
							<f:validateLength minimum="1" maximum="16" />
 						</aon:inputText>
						<aon:panelGroup id="Finance_holder_document_icon">
							<aon:outputText 
								rendered="#{!finance.to.registryDocumentValidable}"
								styleClass="aon-icon-question"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{finance.to.registryDocumentValidable and finance.to.validRegistryDocument}"
								styleClass="aon-icon-predetermine"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{finance.to.registryDocumentValidable and !finance.to.validRegistryDocument}"
								styleClass="aon-icon-exception"
								style="padding-left: 15px;"
								value="&#160;" />
	 					</aon:panelGroup>
 					</aon:panelGroup>
					  
					<aon:outputLabel for="Finance_expenses" 
						value="#{bundle.aon_expenses}" />
					<aon:inputText id="Finance_expenses"
						value="#{finance.to.expenses}"
						disabled="#{(!finance.pending and !finance.returned) or finance.to.prepayment}"
						required="true" size="10"
						ajaxSingle="true" reRender="Finance_total" />

					<aon:outputLabel value="#{bundle.aon_iban}" />
					<aon:div id="Finance_bankAccount_panel" styleClass="aon-nowrap">
						<aon:panelGroup id="Finance_bankAccount" rendered="#{finance.showBankManualInput}">
							<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
								<ui:param name="bankAccountController" value="#{finance.accountHelper}" />
								<ui:param name="bankAccountPrefix" value="Finance" />
								<ui:param name="bankAccountDisabled" value="#{!finance.pending and !finance.returned}" />
								<ui:param name="bankCodeChangeReRender" value="Finance_bankAlias,Finance_bic" />
							</ui:include>
							<aon:commandLink id="bankAccount_hide_manualInput" ajaxSingle="true"
								rendered="#{finance.showBankManualInput and (finance.pending or finance.returned)}"  
								reRender="Finance_bankAccount_panel"
								styleClass="aon-icon-edit-end aon-margin-left" style="padding-right: 20px;padding-top: 0px;"
								value="&#160;" title="#{bundle.aon_key_cancel_line_description}" >
								<f:setPropertyActionListener target="#{finance.showBankManualInput}"
									value="#{false}" />
							</aon:commandLink>
						</aon:panelGroup>
						<aon:div styleClass="aon-italic">
							<aon:div style="margin-top:2px; font-size:0.9em;" rendered="#{finance.showBankManualInput}">
								<aon:outputLabel for="Finance_bankAlias" styleClass="aon-margin-right"
									value="#{bundle.aon_bank}" />
								<aon:inputText id="Finance_bankAlias"
									value="#{finance.to.bankAlias}" 
									required="true" size="25" maxlength="25" />
								<aon:outputLabel for="Finance_bic" styleClass="aon-margin-left aon-margin-right"
									value="#{bundle.aon_bic}" />
								<aon:inputText id="Finance_bic"
									value="#{finance.to.bic}" validator="BICValidator" 
									required="true" size="12" maxlength="11">
								</aon:inputText>
							</aon:div>

							<aon:selectOneMenu id="Finance_registryBank_id"
								rendered="#{!finance.showBankManualInput}"
								value="#{finance.registryBank}" reRender="Finance_bankAccount"
								valueChangeListener="#{finance.onRegistryBankChanged}"
								disabled="#{!finance.pending and !finance.returned}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<aon:if test="#{finance.nevv or finance.registryBank.id == null or finance.registryBank.active}">
									<f:selectItems value="#{finance.activeBanks}" />
								</aon:if>
								<aon:if test="#{!finance.nevv and finance.registryBank.id != null and !finance.registryBank.active}">
									<f:selectItems value="#{finance.allBanks}" />
								</aon:if>
							</aon:selectOneMenu>
							<aon:commandLink id="bankAccount_show_manualInput" ajaxSingle="true"
								rendered="#{!finance.showBankManualInput and (finance.pending or finance.returned)}"  
								reRender="Finance_bankAccount_panel"
								styleClass="aon-icon-edit-add aon-margin-left" style="padding-right: 20px;padding-top: 0px;"
								value="&#160;" title="#{bundle.aon_edit}" >
								<f:setPropertyActionListener target="#{finance.showBankManualInput}"
									value="#{true}" />
							</aon:commandLink>
						</aon:div>
					</aon:div>
					
					<aon:outputLabel for="Finance_total"
						value="#{bundle.aon_total}" />
					<aon:outputText id="Finance_total" styleClass="aon-bold"
						value="#{finance.to.totalAmount}" size="15">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>	

				</aon:panelGrid>

				<aon:panelGrid columns="2"
					styleClass="aon-width-all aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-auto"
					rendered="#{!empty finance.to.remarks}">

					<aon:div>
						<aon:outputLabel for="Finance_remarks"
							value="#{bundle.aon_remark}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_remark_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Finance_remarks" cols="145" rows="2"
						value="#{finance.to.remarks}" />

				</aon:panelGrid>
					
				<aon:if test="#{!finance.nevv}">
					<aon:div styleClass="aon-padding-top">
						<aon:panel>
							<f:facet name="header">
								<aon:outputLabel for="financeTrackingData" value="#{bundle.aon_tracking}" />
							</f:facet>

							<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
								<ui:param name="controller" value="#{financeTracking}" />
								<ui:param name="skipSelectButton" value="true" />
								<ui:param name="rowSelectorToggleOnClick" value="false" />

								<ui:define name="columns">
									<aon:column styleClass="aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_date}" />
										</f:facet>
										<aon:outputText value="#{to.trackingDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>	
									</aon:column>
	
									<aon:column styleClass="aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_action}" />
										</f:facet>
										<aon:outputText value="#{to.type}" />
									</aon:column>
	
									<aon:column styleClass="aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_description}" />
										</f:facet>
										<aon:outputText value="#{financeTracking.trackingDescription}" />
									</aon:column>
	
									<aon:column styleClass="aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{bundle.finance_recorded}" />
										</f:facet>
										<aon:outputText value="#{(to.recordable)?((aonRole.accountingOperator)?(to.description):((to.recorded)?(bundle.aon_yes):(bundle.aon_no))):('---------')}" />
									</aon:column>
	
									<aon:column styleClass="aon-editDataTable-numberColumn">
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_amount}" />
										</f:facet>
										<aon:outputText value="#{to.amount}">
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>	
									</aon:column>
	
									<aon:column styleClass="aon-editDataTable-textColumn aon-width-40 aon-nowrap">
										<f:facet name="header">
											<aon:outputText value="&#160;" />
										</f:facet>
										<aon:div styleClass="aon-nowrap">
											<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
												<ui:param name="auditableTO" value="#{to}" />
											</ui:include>										
											<aon:if test="#{aonRole.accountingOperator}">
												<aon:commandButton id="record"
													title="#{bundle.finance_record}"
													immediate="true" rendered="#{to.recordable and !to.recorded and to.bankStatementLink == null}"
													actionListener="#{financeTracking.recordTracking}"
													styleClass="aon-editDataTable-button aon-icon-task-assume aon-nowrap"
													reRender="financeTrackingData" 
													onclick="Richfaces.showModalPanel('waitProccess')" 
										     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
											</aon:if>
											<aon:confirmButton id="undo"
												title="#{bundle.aon_undo}"
												immediate="true" rendered="#{financeTracking.undoable}"
												confirmTitle="#{bundle.aon_confirm_title}"
												confirmMessage="#{bundle.aon_remove_confirm}"
												confirmActionListener="#{financeTracking.undoTracking}"
												styleClass="aon-editDataTable-button aon-icon-delete aon-nowrap"
												accesskey="#{bundle.aon_key_remove_line}" />
											<aon:commandLink id="financeBatch_link" immediate="true"
												styleClass="aon-button-goto aon-nowrap" style="padding-right: 20px;"
												value="&#160;" title="#{bundle.aon_finance_batch}"
												rendered="#{to.batched}"
												actionListener="#{financeTracking.onLoadFinanceBatch}"
												action="fbatch_form" />
											<aon:commandLink id="bankStatement_link" immediate="true"
												styleClass="aon-button-goto aon-nowrap" style="padding-right: 20px;"
												value="&#160;" title="#{bundle.finance_bank_statement_report}"
												rendered="#{to.bankStatementLink != null}"
												actionListener="#{financeTracking.onLoadBankStatement}"
												action="bankStatement_list" />
											<aon:commandLink id="financeGroup_link" 
												styleClass="aon-button-goto aon-nowrap" style="padding-right: 20px;"
												value="&#160;" title="#{bundle.finance_agrupation_finance}"
												rendered="#{to.finance.financeGroup != null}"
												actionListener="#{financeTracking.onLoadFinanceGroup}"
												action="finance_form" />
										</aon:div>
									</aon:column>
								</ui:define>
							</ui:decorate>
						</aon:panel>
					</aon:div>
				</aon:if>
			</aon:div>
 		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{personLookup}" />

		<ui:include src="/com/code/aon/ui/finance/facelet/finance/modalReturn.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/finance/modalRemarks.xhtml">
			<ui:param name="controller" value="#{finance}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/finance/modalGroup.xhtml" >
			<ui:param name="modalReRender" value="Finance_amount-Panel,Finance_total" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />				
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{finance}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
			<ui:param name="bankAccountController" value="#{finance.accountHelper}" />
			<ui:param name="modalReRender" value="Finance_bankAccount_panel" />
		</ui:include>
	</ui:define>
</ui:composition>
