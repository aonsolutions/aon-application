<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="financeForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{(finance.payment)?(financeBundle.finance_payment_module):(financeBundle.finance_charge_module)}" />
				<ui:param name="controller" value="#{finance}" />
				<ui:param name="skipSaveButton" value="#{!finance.new and !finance.pending and !finance.returned}" />
				<ui:param name="skipRemoveButton" value="#{finance.new or !finance.to.emptyInvoice}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="paymentPopup" 
						value="#{(finance.payment)?(financeBundle.finance_to_pay):(financeBundle.finance_to_charge)}"
						immediate="#{true}" rendered="#{!finance.new and (finance.pending or finance.returned)}"
						styleClass="aon-finding-toolbar-item aon-icon-pay"
						actionListener="#{finance.onFinancePaymentShow}"
						reRender="showFinancePaymentWindow">
						<f:setPropertyActionListener target="#{finance.showFinancePaymentWindow}"
							value="#{true}" />
					</aon:commandButton>
					<aon:commandButton id="returnPopup" 
						value="#{financeBundle.finance_to_return}"
						immediate="#{true}" rendered="#{!finance.new and finance.paid}"
						styleClass="aon-finding-toolbar-item aon-icon-return"
						actionListener="#{finance.onFinanceReturnShow}"
						reRender="showFinanceReturnWindow">
						<f:setPropertyActionListener target="#{finance.showFinanceReturnWindow}"
							value="#{true}" />
					</aon:commandButton>
					<aon:commandButton id="settle" 
						value="#{financeBundle.finance_to_settle}"
						immediate="#{true}" rendered="#{!finance.new and (finance.pending or finance.returned)}"
						styleClass="aon-finding-toolbar-item aon-icon-settle"
						actionListener="#{finance.onSettleFinance}" />
					<aon:commandButton id="fraction" 
						value="#{financeBundle.finance_to_fraction}"
						immediate="#{true}" rendered="#{!finance.new and (finance.pending or finance.returned)}"
						styleClass="aon-finding-toolbar-item aon-icon-fraction"
						actionListener="#{financeFraction.onFractionFinance}" action="finance_fraction" />
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140
						,aon-panelGrid-even aon-width-500
						,aon-panelGrid-odd aon-width-140
						,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Finance_concept" 
						value="#{financeBundle.finance_invoice_document_number}" />
					<aon:div> 
						<aon:panelGrid columns="2" columnClasses="aon-width-250,aon-width-auto">
							<aon:div>
								<aon:inputText id="Finance_concept"
									value="#{finance.to.concept}" 
									onblur="toUpperCase(this);"
									rendered="#{finance.to.emptyInvoice and finance.pending}"
									required="true" size="45" maxlength="25" />
								<aon:outputText styleClass="aon-bold"
									value="#{finance.to.documentNumber}"
									rendered="#{!finance.to.emptyInvoice or !finance.pending}" />
							</aon:div>
							<aon:div>
								<c:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Finance_securityLevel"
										value="#{finance.to.confidential}"
										rendered="#{finance.to.emptyInvoice and finance.pending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{finance.to.emptyInvoice and finance.pending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{(!finance.to.emptyInvoice or !finance.pending) and finance.to.confidential}" />
								</c:if>

								<aon:outputText styleClass="aon-margin-left"
									value="#{finance.to.financeStatus}" />
							</aon:div>
						</aon:panelGrid>
					</aon:div>

					<aon:outputLabel value="#{financeBundle.finance_invoice}" />
					<aon:div>
						<aon:outputText value="#{finance.to.referenceCode}"
							rendered="#{finance.to.emptyInvoice}" />
						<aon:div rendered="#{!finance.to.emptyInvoice}"> 
							<aon:outputText value="#{finance.to.referenceCode}"
								rendered="#{!finance.to.emptyInvoice}" />
							<aon:outputText styleClass="aon-italic aon-margin-left"
								value="(#{bundle.aon_date}: "
								rendered="#{!finance.to.emptyInvoice}" />
							<aon:outputText styleClass="aon-bold"
								value="#{finance.to.invoice.issueDate}"
								rendered="#{!finance.to.emptyInvoice}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:outputText styleClass="aon-italic"
								value=")"
								rendered="#{!finance.to.emptyInvoice}" />
							<aon:commandLink id="invoice_link" immediate="true"
								styleClass="aon-icon-file-entrance aon-margin-left" style="padding-right: 20px;"
								value="&#160;" title="#{bundle.aon_go}"
								rendered="#{!finance.to.emptyInvoice}"
								actionListener="#{finance.onLoadInvoice}"
								action="#{finance.getInvoiceViewer}" />
 						</aon:div> 
					</aon:div> 

					<aon:outputLabel for="Customer_id"
						value="#{financeBundle.finance_debtor}"
						rendered="#{!finance.to.payment}" />
					<aon:div id="Customer_lookup" styleClass="aon-lookup" rendered="#{!finance.to.payment}">
						<a4j:region>
							<aon:lookupInputText id="Customer_id"
								value="#{finance.to.registry.id}"
								disabled="#{!finance.new}" size="5"
								lookupProperty="registry" lookup="#{customerLookup}"
								lookupChangeListener="#{finance.registryData}"
								reRender="Customer_full_name,Finance_holder_document"
								ajaxSingle="true" required="true" />
							<aon:lookupButton
								windowTitle="#{customerBundle.customer_selection}"
								disabled="#{!finance.new}" minHeight="460" minWidth="650" 
								property="#{finance.to.registry}" lookupProperty="registry" lookup="#{customerLookup}"
								lookupChangeListener="#{finance.registryData}"
								selectReRender="Customer_lookup,Finance_holder_document"
								actionType="search">
							</aon:lookupButton>
							<aon:lookupButton
								windowTitle="#{customerBundle.customer_new}"
								disabled="#{!finance.new}" minWidth="650" minHeight="650"
								property="#{finance.to.registry}" lookupProperty="registry" lookup="#{customerLookup}"
								lookupChangeListener="#{finance.registryData}"
								selectReRender="Customer_lookup,Finance_holder_document"
								actionType="new">
							</aon:lookupButton>
							<aon:inputText id="Customer_full_name"
								value="#{finance.to.registryName}"
								disabled="#{!finance.new}" size="50" />
						</a4j:region>
					</aon:div>
					<aon:div rendered="#{finance.to.payment}">
						<aon:outputLabel for="Supplier_id"
							value="#{financeBundle.finance_creditor}"
							rendered="#{finance.to.payment and finance.purchase}" />
						<aon:outputLabel for="Creditor_id"
							value="#{financeBundle.finance_creditor}"
							rendered="#{finance.to.payment and !finance.purchase}" />
						<aon:selectOneRadio id="Finance_purchase"
							styleClass="aon-italic aon-normal" style="font-size: 11px;"
							value="#{finance.purchase}"
							rendered="#{finance.new}"
							valueChangeListener="#{finance.onPaymentTypeChanged}"
							reRender="paymentTypeDiv">
							<f:selectItem itemLabel="#{financeBundle.finance_expense}" itemValue="false" />
							<f:selectItem itemLabel="#{financeBundle.finance_purchase}" itemValue="true" />
						</aon:selectOneRadio>				
					</aon:div>
					<aon:div id="paymentTypeDiv" rendered="#{finance.to.payment}">
						<aon:div id="Supplier_lookup" styleClass="aon-lookup" rendered="#{finance.to.payment and finance.purchase}">
							<a4j:region>
								<aon:lookupInputText id="Supplier_id"
									value="#{finance.to.registry.id}"
									disabled="#{!finance.new}" size="5"
									lookupProperty="registry" lookup="#{supplierLookup}"
									lookupChangeListener="#{finance.registryData}"
									reRender="Supplier_full_name,Finance_holder_document"
									ajaxSingle="true" required="true" />
								<aon:lookupButton
									windowTitle="#{supplierBundle.supplier_selection}"
									disabled="#{!finance.new}" minHeight="460" minWidth="650" 
									property="#{finance.to.registry}" lookupProperty="registry" lookup="#{supplierLookup}"
									lookupChangeListener="#{finance.registryData}"
									selectReRender="Supplier_lookup,Finance_holder_document"
									actionType="search">
								</aon:lookupButton>
								<aon:lookupButton
									windowTitle="#{supplierBundle.supplier_new}"
									disabled="#{!finance.new}" minWidth="650" minHeight="650"
									property="#{finance.to.registry}" lookupProperty="registry" lookup="#{supplierLookup}"
									lookupChangeListener="#{finance.registryData}"
									selectReRender="Supplier_lookup,Finance_holder_document"
									actionType="new">
								</aon:lookupButton>
								<aon:inputText id="Supplier_full_name"
									value="#{finance.to.registryName}"
									disabled="#{!finance.new}" size="50" />
							</a4j:region>
						</aon:div>
						<aon:div id="Creditor_lookup" styleClass="aon-lookup" rendered="#{finance.to.payment and !finance.purchase}">
							<a4j:region>
								<aon:lookupInputText id="Creditor_id"
									value="#{finance.to.registry.id}"
									disabled="#{!finance.new}" size="5"
									lookupProperty="registry" lookup="#{creditorLookup}"
									lookupChangeListener="#{finance.registryData}"
									reRender="Creditor_full_name,Finance_holder_document"
									ajaxSingle="true" required="true" />
								<aon:lookupButton
									windowTitle="#{financeBundle.finance_creditor_selection}"
									disabled="#{!finance.new}" minHeight="460" minWidth="650" 
									property="#{finance.to.registry}" lookupProperty="registry" lookup="#{creditorLookup}"
									lookupChangeListener="#{finance.registryData}"
									selectReRender="Creditor_lookup,Finance_holder_document"
									actionType="search">
								</aon:lookupButton>
								<aon:lookupButton
									windowTitle="#{financeBundle.finance_creditor_new}"
									disabled="#{!finance.new}" minWidth="650" minHeight="650"
									property="#{finance.to.registry}" lookupProperty="registry" lookup="#{creditorLookup}"
									lookupChangeListener="#{finance.registryData}"
									selectReRender="Creditor_lookup,Finance_holder_document"
									actionType="new">
								</aon:lookupButton>
								<aon:inputText id="Creditor_full_name"
									value="#{finance.to.registryName}"
									disabled="#{!finance.new}" size="50" />
							</a4j:region>
						</aon:div>
					</aon:div>

					<aon:outputLabel for="Finance_registry_document"
						value="#{bundle.aon_company_document}" />
					<aon:panelGroup id="Finance_holder_document">
						<aon:selectOneMenu id="Finance_registry_document_type" 
							disabled="#{!finance.new}"
							value="#{finance.to.registryDocumentType}"
							reRender="Finance_holder_document_icon">
							<f:selectItems value="#{registryCollections.documentTypes}" />
						</aon:selectOneMenu>
						<aon:outputText styleClass="aon-margin-left aon-italic"
							value="#{bundle.aon_country}" />
						<aon:selectOneMenu id="Finance_registry_document_country"
							styleClass="aon-margin-left" disabled="#{!finance.new}"
							value="#{finance.to.registryDocumentCountry}"
							reRender="Finance_holder_document_icon">
							<f:selectItems value="#{commonCollections.countryCodes}" />
						</aon:selectOneMenu>
						<aon:inputText id="Finance_registry_document" 
							style="margin-left: 5px;" disabled="#{!finance.new}"
							value="#{finance.to.registryDocument}" size="16" maxlength="16"
							reRender="Finance_holder_document_icon" 
							onblur="toUpperCase(this);">
							<f:validateLength minimum="1" maximum="16" />
 						</aon:inputText>
						<aon:panelGroup id="Finance_holder_document_icon">
							<aon:outputText 
								rendered="#{!finance.to.registryDocumentValidable}"
								styleClass="aon-icon-question"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{finance.to.registryDocumentValidable and finance.to.validRegistryDocument}"
								styleClass="aon-icon-predetermine"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{finance.to.registryDocumentValidable and !finance.to.validRegistryDocument}"
								styleClass="aon-icon-exception"
								style="padding-left: 15px;"
								value="&#160;" />
	 					</aon:panelGroup>
 					</aon:panelGroup>

					<aon:outputLabel for="Finance_payMethod_id"
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneMenu id="Finance_payMethod_id"
						value="#{finance.to.payMethod}"
						valueChangeListener="#{finance.onPayMethodChanged}"
						reRender="Finance_registryBank_id,Finance_bankAccount"
						disabled="#{!finance.pending and !finance.returned}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Finance_dueDate"
						value="#{financeBundle.finance_finance_date}" />
					<aon:selectInputDate id="Finance_dueDate" 
						value="#{finance.to.dueDate}"
						disabled="#{!finance.pending and !finance.returned}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Finance_bankAccount"
						value="#{configBundle.config_bank_account}" />
					<aon:div id="Finance_bankAccount" styleClass="aon-lookup">
						<aon:lookupInputText id="Finance_bank_code"
							value="#{finance.to.bank.code}"
							disabled="#{!finance.pending and !finance.returned}" size="5" maxlength="4"
							property="#{finance.to.bank}" lookup="#{bankLookup}"
							lookupChangeListener="#{finance.onBankChanged}"
							reRender="Finance_bankAccount">
							<aon:joinProperty alias="Bank_code"
								value="#{finance.to.bank.code}" />
						</aon:lookupInputText>
						<aon:lookupButton
							windowTitle="#{configBundle.config_bank_selection}"
							disabled="#{!finance.pending and !finance.returned}" minHeight="460" minWidth="650"
							property="#{finance.to.bank}" lookup="#{bankLookup}"
							lookupChangeListener="#{finance.onBankChanged}"
							selectReRender="Finance_bankAccount" actionType="search">
						</aon:lookupButton>
						<aon:inputText id="Finance_bank_name"
							value="#{finance.to.bank.name}"
							disabled="true" size="38" />
						<aon:inputText id="Finance_bankAccount_office"
							value="#{finance.to.bankAccount.office}"
							disabled="#{!finance.pending and !finance.returned}" size="3" maxlength="4">
							<f:validateLength minimum="4" maximum="4" />
						</aon:inputText>
						<aon:inputText id="Finance_bankAccount_control"
							value="#{finance.to.bankAccount.control}"
							disabled="#{!finance.pending and !finance.returned}" size="1" maxlength="2">
							<f:validateLength minimum="2" maximum="2" />
						</aon:inputText>
						<aon:inputText id="Finance_bankAccount_account"
							value="#{finance.to.bankAccount.account}"
							disabled="#{!finance.pending and !finance.returned}" size="10" maxlength="10">
							<f:validateLength minimum="10" maximum="10" />
						</aon:inputText>
					</aon:div>

					<aon:outputLabel for="Finance_amount"
						value="#{bundle.aon_amount}" />
					<aon:div>
						<aon:inputText id="Finance_amount"
							value="#{finance.to.amount}"
							disabled="#{!finance.to.emptyInvoice or (!finance.pending and !finance.returned)}"
							required="true" size="10"
							ajaxSingle="true" reRender="Finance_total" />
						<aon:outputLabel for="Finance_expenses" styleClass="aon-margin-left aon-margin-right aon-italic"
							value="#{financeBundle.finance_expenses}" />
						<aon:inputText id="Finance_expenses"
							value="#{finance.to.expenses}"
							disabled="#{!finance.pending and !finance.returned}"
							required="true" size="10"
							ajaxSingle="true" reRender="Finance_total" />
					</aon:div>

					<aon:outputLabel for="Finance_registryBank_id"
						value="&#160;" />
					<aon:selectOneMenu id="Finance_registryBank_id"
						value="#{registryCollections.registryBank}" reRender="Finance_bankAccount"
						valueChangeListener="#{finance.onRegistryBankChanged}"
						disabled="#{!finance.pending and !finance.returned}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{finance.banks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Finance_total"
						value="#{bundle.aon_total}" />
					<aon:outputText id="Finance_total" styleClass="aon-bold"
						value="#{finance.to.totalAmount}" size="15">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>	

				</aon:panelGrid>
					
				<c:if test="#{!finance.new}">
					<aon:div styleClass="aon-padding-top">
						<aon:panel>
							<f:facet name="header">
								<aon:outputLabel for="financeTrackingData" value="#{financeBundle.finance_tracking}" />
							</f:facet>

							<aon:dataTable id="financeTrackingData" value="#{financeTracking.model}"
								var="to" rows="20" rendered="#{financeTracking.model.rowCount > 0}">

								<aon:column styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_date}" />
									</f:facet>
									<aon:outputText value="#{to.trackingDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>	
								</aon:column>

								<aon:column styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.finance_tracking_action}" />
									</f:facet>
									<aon:outputText value="#{to.type}" />
								</aon:column>

								<aon:column styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_description}" />
									</f:facet>
									<aon:outputText value="#{financeTracking.trackingDescription}" />
								</aon:column>

								<aon:column styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.finance_recorded}" />
									</f:facet>
									<aon:outputText value="#{(to.recordable)?((aonRole.accountingOperator)?(to.description):((to.recorded)?(bundle.aon_yes):(bundle.aon_no))):('---------')}" />
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_amount}" />
									</f:facet>
									<aon:outputText value="#{to.amount}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>	
								</aon:column>

								<aon:column styleClass="aon-editDataTable-textColumn aon-width-40 aon-nowrap">
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:div>
										<c:if test="#{aonRole.accountingOperator}">
											<aon:commandButton id="record"
												title="#{financeBundle.finance_record}"
												immediate="true" rendered="#{to.recordable and !to.recorded and to.bankStatementLink == null}"
												actionListener="#{financeTracking.recordTracking}"
												styleClass="aon-editDataTable-button aon-icon-task-assume"
												reRender="financeTrackingData" 
												onclick="Richfaces.showModalPanel('waitProccess')" 
									     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
										</c:if>
										<aon:confirmButton id="undo"
											title="#{financeBundle.finance_tracking_undo}"
											immediate="true" rendered="#{financeTracking.undoable}" 
											confirmTitle="#{bundle.aon_confirm_title}"
											confirmMessage="#{bundle.aon_remove_confirm}"
											confirmActionListener="#{financeTracking.undoTracking}"
											styleClass="aon-editDataTable-button aon-icon-delete"
											accesskey="#{bundle.aon_key_remove_line}" />										
										<aon:commandLink id="bankStatement_link" immediate="true"
											styleClass="aon-icon-file-entrance" style="padding-right: 20px;"
											value="&#160;" title="#{financeBundle.finance_bank_statement_checked}"
											rendered="#{to.bankStatementLink != null}"
											actionListener="#{financeTracking.onLoadBankStatement}"
											action="bankStatement_list" />
									</aon:div>
								</aon:column>

							</aon:dataTable>
							<aon:dataScroller2 for="financeTrackingData" showNote="true" />
						</aon:panel>
					</aon:div>
				</c:if>
			</aon:div>
 		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<ui:include src="/com/code/aon/ui/finance/facelet/finance/modalPayment.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/finance/modalReturn.xhtml" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />				
	</ui:define>
</ui:composition>
