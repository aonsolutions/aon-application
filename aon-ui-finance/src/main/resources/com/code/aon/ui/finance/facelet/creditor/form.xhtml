<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="creditorForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_creditor_module}" />
				<ui:param name="controller" value="#{creditor}" />
				<ui:param name="showMoreMenu" value="#{!creditor.nevv}" />
				<ui:define name="moreMenuContent">
					<ui:include src="/com/code/aon/ui/registry/facelet/registry/toolbarMoreMenu.xhtml">
						<ui:param name="controller" value="#{creditor}" />
						<ui:param name="showSegmentButton" value="#{aonConfiguration.bean.creditor.showSegment}" />
						<ui:param name="showAddInfoButton" value="#{aonConfiguration.bean.creditor.showAddInfo}" />
						<ui:param name="showTaxButton" value="#{aonConfiguration.bean.creditor.showTax}" />

						<ui:param name="segmentController" value="#{creditorSegment}" /> 
						<ui:param name="addInfoController" value="#{creditorAddInfo}" /> 
						<ui:param name="rAttachController" value="#{creditorRAttach}" />
						<ui:param name="registryTaxController" value="#{creditorTax}" />
					</ui:include>
					<ui:include src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{creditor.nevv}">
					<ui:include src="/com/code/aon/ui/finance/facelet/creditor/formNewContent.xhtml">
						<ui:param name="controller" value="#{creditor}" />
					</ui:include>				
				</aon:if>							
				<aon:if test="#{!creditor.nevv}">			
					<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto,
							aon-panelGrid-odd aon-width-120,
							aon-panelGrid-even aon-width-auto">
	
						<ui:include 
							src="/com/code/aon/ui/finance/facelet/creditor/formContent.xhtml">
							<ui:param name="controller" value="#{creditor}" />
						</ui:include>
					</aon:panelGrid>
				
					<aon:panelGrid id="infoDataTable"
						styleClass="aon-margin-top aon-width-all" columns="2"
						columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-auto">
	
						<aon:if test="#{!creditor.nevv and aonRole.accountingOperator and aonConfiguration.bean.creditor.showAccount}">
							<aon:outputLabel for="Account_id" value="#{bundle.finance_account}" />
							<aon:panelGrid id="accountContainer" columns="2" columnClasses="none,none">
								<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
									<ui:param name="lookupTo" value="#{creditor.to.account}" />
									<ui:param name="lookupReRender" value="accountLookupButtons" />
								</ui:include>
								<aon:div id="accountLookupButtons">
									<aon:commandButton
										value="#{bundle.account_synchronize}"
										title="#{bundle.account_synchronize}"
										style="border: #808080 1px solid;"
										styleClass="aon-finding-toolbar-item aon-icon-refresh"
										rendered="#{creditor.accountSynchronizable}"
										actionListener="#{creditor.onAccountSynchronize}"
										reRender="accountContainer">
									</aon:commandButton>
									<aon:commandButton
										value="#{bundle.account_new_account}" 
										title="#{bundle.account_new_account}"
										style="border: #808080 1px solid;"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										rendered="#{creditor.to.account == null or creditor.to.account.id == null}"
										actionListener="#{creditor.onNewAccount}"
										reRender="accountContainer">
									</aon:commandButton>
								</aon:div>
							</aon:panelGrid>
						</aon:if>
					</aon:panelGrid>

					<aon:panelTabSet id="creditorTab" selectedTab="#{creditor.selectedTab}">
						<aon:panelTab id="address" label="#{bundle.registry_address_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{creditorAddress}" />
							</ui:include>
						</aon:panelTab>
	
						<aon:panelTab id="media" label="#{bundle.aon_contacts}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{creditorMedia}" />
							</ui:include>
						</aon:panelTab>
	
						<aon:if test="#{aonConfiguration.bean.creditor.showFinanceData}">
							<aon:panelTab id="finance"
								label="#{bundle.registry_finance_data_module}">
								<aon:panel>
									<f:facet name="header">
										<aon:outputText	value="#{bundle.registry_banks_module}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
										<ui:param name="controller" value="#{creditorRbank}" />
									</ui:include>
								</aon:panel>
								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{bundle.config_predef_paymethod}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
										<ui:param name="controller" value="#{creditorRPayMethod}" />
									</ui:include>
								</aon:panel>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.creditor.showSegment and creditorSegment.model.rowCount > 0}">
							<aon:panelTab id="segment"
								label="#{bundle.registry_segment_module}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/rsegment/tab_grid.xhtml">
									<ui:param name="controller" value="#{creditorSegment}" />
									<ui:param name="removeButtonReRender" value="creditorTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.creditor.showAddInfo and creditorAddInfo.model.rowCount > 0}">
							<aon:panelTab id="addInfo"
								label="#{bundle.aon_addInfo}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/raddinfo/tab_grid.xhtml">
									<ui:param name="controller" value="#{creditorAddInfo}" />
									<ui:param name="removeButtonReRender" value="creditorTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonRole.document and creditorRAttach.model.rowCount > 0}">
							<aon:panelTab id="documentManagement" label="#{bundle.aon_documents}">
								<ui:include src="/com/code/aon/ui/registry/facelet/documentManager/tab_grid.xhtml">
									<ui:param name="controller" value="#{creditorRAttach}" />
									<ui:param name="removeButtonReRender" value="creditorTab" />
								</ui:include>								
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.creditor.showTax and creditorTax.model.rowCount > 0}">
							<aon:panelTab id="creditorTax" label="#{bundle.config_tax_module}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rtax/tab_grid.xhtml" >
									<ui:param name="controller" value="#{creditorTax}" />
									<ui:param name="removeButtonReRender" value="creditorTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
					</aon:panelTabSet>
				</aon:if>
			</aon:div>
		</aon:form>
		<aon:if test="#{aonRole.accountingOperator}">
			<aon:lookupButtonPopup lookup="#{accountLookup}" />
		</aon:if>
		<aon:if test="#{aonConfiguration.bean.rmedia.showSendEmail}">
			<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		</aon:if>
		<aon:if test="#{!creditor.nevv}">
			<aon:if test="#{aonConfiguration.bean.creditor.showSegment}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rsegment/newSegmentModal.xhtml">
					<ui:param name="controller" value="#{creditor}" />
					<ui:param name="segmentController" value="#{creditorSegment}" />
					<ui:param name="modalReRender" value="creditorTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.creditor.showAddInfo}">
				<ui:include src="/com/code/aon/ui/registry/facelet/raddinfo/newAddInfoModal.xhtml">
					<ui:param name="controller" value="#{creditor}" />
					<ui:param name="addInfoController" value="#{creditorAddInfo}" />
					<ui:param name="modalReRender" value="creditorTab" />
				</ui:include>
			</aon:if>
			<ui:include src="/com/code/aon/ui/registry/facelet/rattach/newAttachModal.xhtml">
				<ui:param name="controller" value="#{creditor}" />
				<ui:param name="attachmentController" value="#{creditorRAttach}" />
				<ui:param name="modalReRender" value="creditorTab" />
			</ui:include>
			<aon:if test="#{aonConfiguration.bean.creditor.showTax}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rtax/newTaxModal.xhtml">
					<ui:param name="controller" value="#{creditor}" />
					<ui:param name="registryTaxController" value="#{creditorTax}" />
					<ui:param name="modalReRender" value="creditorTab" />
				</ui:include>
			</aon:if>
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
				<ui:param name="auditableController" value="#{creditor}" />
			</ui:include>				
			<aon:if test="#{aonConfiguration.bean.customer.showFinanceData}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
					<ui:param name="bankAccountController" value="#{creditorRbank.accountHelper}" />
					<ui:param name="modalReRender" value="creditorTab" />
				</ui:include>
			</aon:if>											
		</aon:if>
		<aon:if test="#{creditor.nevv}">
			<aon:if test="#{aonConfiguration.bean.customer.showFinanceData}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
					<ui:param name="bankAccountController" value="#{creditorForm.accountHelper}" />
					<ui:param name="modalReRender" value="Registry-PayMethodDiv" />
				</ui:include>		
			</aon:if>
		</aon:if>
	</ui:define>
</ui:composition>
