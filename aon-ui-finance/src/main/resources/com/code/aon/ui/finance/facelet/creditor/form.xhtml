<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="creditorForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{financeBundle.finance_creditor_module}" />
				<ui:param name="controller" value="#{creditor}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Creditor_id" value="#{bundle.aon_id}" />
					<aon:inputText id="Creditor_id" value="#{creditor.to.id}"
						required="true" size="15" disabled="true" />

					<aon:outputLabel for="Creditor_registry_document"
						value="#{financeBundle.finance_document}" />
					<aon:inputText id="Creditor_registry_document"
						value="#{creditor.to.registry.document}" size="16">
						<f:validateLength minimum="1" maximum="16" />
					</aon:inputText>

					<aon:outputLabel for="Creditor_registry_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="Creditor_registry_name"
						value="#{creditor.to.registry.name}" size="64">
						<f:validateLength minimum="1" maximum="64" />
					</aon:inputText>

					<aon:outputLabel for="Creditor_registry_surname"
						value="#{financeBundle.finance_surname}" />
					<aon:inputText id="Creditor_registry_surname"
						value="#{creditor.to.registry.surname}" size="64">
						<f:validateLength minimum="1" maximum="64" />
					</aon:inputText>

					<aon:outputLabel for="Creditor_registry_alias"
						value="#{financeBundle.finance_alias}" />
					<aon:inputText id="Creditor_registry_alias"
						value="#{creditor.to.registry.alias}" size="32">
						<f:validateLength minimum="1" maximum="32" />
					</aon:inputText>

					<aon:outputLabel for="Creditor_scope_id"
						value="#{financeBundle.finance_scope}" />
					<aon:selectOneMenu id="Creditor_scope_id"
						value="#{creditor.to.scope}">
						<f:selectItems value="#{configCollections.scopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Creditor_status" value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="Creditor_status"
						value="#{creditor.to.status}">
						<f:selectItems value="#{financeCollections.creditorStatuses}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
			<c:if test="#{!creditor.new}">
				<aon:panelTabSet id="creditorTab">

					<aon:panelTab id="creditor_address"
						label="#{registryBundle.registry_address_module}">
						<ui:include
							src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
							<ui:param name="controllerAlias" value="#{creditorAddress}" />
							<ui:param name="dataTableId" value="creditorAddressDataList" />
						</ui:include>
					</aon:panelTab>

					<aon:panelTab id="medias"
						label="#{registryBundle.registry_media_module}">
						<ui:include
							src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
							<ui:param name="controllerAlias" value="#{creditorMedia}" />
							<ui:param name="dataTableId" value="creditorMediaDataList" />
						</ui:include>
					</aon:panelTab>

					<aon:panelTab id="creditor_finance"
						label="#{financeBundle.finance_data_module}">
						<ui:include
							src="/com/code/aon/ui/finance/facelet/rbank/tab_grid.xhtml">
							<ui:param name="controllerAlias" value="#{creditorRbank}" />
							<ui:param name="dataTableId" value="creditorRbankData" />
						</ui:include>
					</aon:panelTab>
				</aon:panelTabSet>
			</c:if>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
	</ui:define>
</ui:composition>
