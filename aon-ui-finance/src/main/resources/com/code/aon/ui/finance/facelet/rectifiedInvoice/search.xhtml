<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoiceSearch">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_special_rectified_invoice_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:decorate>
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />
						
					<aon:outputLabel for="Customer_id"
						value="#{customerBundle.customer_customer}"/>
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Customer_id" lookup="#{customerLookup}"
							reRender="Customer_full_name" value="#{rectifiedInvoice.customer.id}" size="5" />
						<aon:lookupButton windowTitle="#{customerBundle.customer_selection}"
							selectReRender="Customer_id,Customer_full_name" actionType="search"
							lookup="#{customerLookup}" minHeight="460" minWidth="650"
							property="#{rectifiedInvoice.customer}">
						</aon:lookupButton>
						<aon:inputText id="Customer_full_name"
							value="#{(rectifiedInvoice.customer.registry.name!=null)?(rectifiedInvoice.customer.registry.fullName):('')}"
							size="50" disabled="true" />
					</aon:div>
					
					<aon:outputText value="#{bundle.aon_date_select}" />
					<aon:div>
						<aon:outputLabel for="date-From" styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="date-From" value="#{rectifiedInvoice.fromDate}"
							timeZone="#{timeZoneController.timeZone}" popupDateFormat="#{bundle.aon_date_pattern}" />
				
						<aon:outputLabel for="date-To" styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="date-To" value="#{rectifiedInvoice.toDate}"
							timeZone="#{timeZoneController.timeZone}" popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>
					
					<aon:outputText value="" />
					<aon:div styleClass="aon-search-commandButton-left">
						<aon:div styleClass="aon-search-commandButton-right">
							<aon:commandButton id="SearchButton"   
								value="#{bundle.aon_search}"
								action="rectifiedInvoice_list"
								actionListener="#{rectifiedInvoice.onSearch}"
								accesskey="#{bundle.aon_key_search}" />
						</aon:div>
					</aon:div>
				</ui:define>
			</ui:decorate>
			
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>

</ui:composition>
