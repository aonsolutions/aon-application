<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="feeAssignmentSearch">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_fee_assignment_module}" />
				<ui:param name="controller" value="#{feeAssignment}" />
				<ui:param name="skipResetButton" value="#{true}" />

				<ui:define name="additionalToolbarContent">
					<ui:include
						src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />
					<aon:commandLink id="customer-fee-import" value="#{bundle.aon_import}"
						onclick="fee()"
						styleClass="aon-finding-toolbar-item aon-icon-import-excel-trans">
					</aon:commandLink>
				</ui:define>
			</ui:decorate>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{feeAssignment}" />
				<ui:param name="skipAfterSearch" value="#{true}" />
				
				<ui:define name="searchContent">
					<ui:include src="/com/code/aon/ui/customer/facelet/customer/searchContent.xhtml" >
						<ui:param name="searchController" value="#{customerSearch}" />
					</ui:include>
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{questionLookup}" />
	</ui:define>
</ui:composition>
