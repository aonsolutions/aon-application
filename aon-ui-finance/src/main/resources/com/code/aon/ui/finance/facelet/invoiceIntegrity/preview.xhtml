<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_invoice_integrity_module}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener" value="#{invoiceIntegrity.onStart}" type="actionListener" />
					<aon:methodParam name="searchAction" value="invoiceIntegrity_search" />
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="update" value="#{accountingBundle.accounting_refresh}"
						accesskey="Q" title="#{accountingBundle.accounting_refresh}"
						actionListener="#{invoiceIntegrity.onPreview}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh"
						immediate="true" />
				</ui:define>
				
			</ui:decorate>

			<aon:div id="invoiceData" styleClass="aon-scroll-area">

				<aon:dataTable id="invoiceList" value="#{invoiceIntegrity.model}"
					rows="20" var="to" rendered="#{invoiceIntegrity.model.rowCount > 0}">

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_document}" />
						</f:facet>
						<aon:outputText value="#{to.documentCountry}" />
						<aon:outputText value=" - " />
						<aon:outputText value="#{to.documentType}" />
						<aon:outputText value=" - " />
						<aon:outputText value="#{to.document}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_integrity_number}" />
						</f:facet>
						<aon:outputText value="#{to.count}">
							<f:convertNumber pattern="#,##0" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandLink value="#{financeBundle.finance_breakdown}"
							actionListener="#{invoiceIntegrity.onSelect}"
							action="invoiceIntegrity_list"
							onmouseover="this.style.textDecoration='underline'"							
							onmouseout="this.style.textDecoration='inherit'">
						</aon:commandLink>
					</aon:column>

				</aon:dataTable>
				
				<aon:dataScroller2 for="invoiceList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
