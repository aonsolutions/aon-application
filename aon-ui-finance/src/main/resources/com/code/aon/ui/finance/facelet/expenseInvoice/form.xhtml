<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="expenseInvoiceForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{financeBundle.finance_expense_invoice_management_module}" />
					<ui:param name="controller" value="#{expenseInvoice}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{expenseInvoice.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{!expenseInvoice.removable or !expenseInvoiceFinance.allPending}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							actionListener="#{expenseInvoice.generateFinances}"
							rendered="#{expenseInvoiceDetail.model.rowCount > 0 and (!expenseInvoice.recorded or expenseInvoiceFinance.model.rowCount == 0)}"
							styleClass="aon-finding-toolbar-item aon-icon-tree"
							accesskey="#{bundle.aon_key_finance}" />
						<c:if test="#{aonRole.accountingOperator}">
							<aon:commandButton id="record"
								value="#{financeBundle.finance_record}"
								actionListener="#{expenseInvoice.onRecordInvoice}"
								rendered="#{expenseInvoiceDetail.model.rowCount > 0 and !expenseInvoice.recorded}"
								styleClass="aon-finding-toolbar-item aon-icon-task-assume"
								reRender="expenseInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandButton id="unrecord"
								value="#{financeBundle.finance_unrecord}"
								actionListener="#{expenseInvoice.onUnrecordInvoice}"
								rendered="#{expenseInvoice.recorded and !expenseInvoice.accountSource}"
								styleClass="aon-finding-toolbar-item aon-icon-task-liberate"
								reRender="expenseInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</c:if>
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signToolbar.xhtml">
							<ui:param name="signController" value="#{expenseInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{expenseInvoice.new or (!expenseInvoiceAttachment.attachmentAvailable) or expenseInvoice.to.signed or (!certificate.signable)}" />
							<ui:param name="skipCancelSignButton" value="#{expenseInvoice.new or (!expenseInvoiceAttachment.attachmentAvailable) or (!expenseInvoice.to.signed)}" />
							<ui:param name="signButtonReRender" value="expenseInvoiceForm,showNewMessageWindow" />
						</ui:include>							
					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Invoice_referenceCode"
						value="#{financeBundle.finance_invoice_number}" />
					<aon:div>
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<aon:div>
								<aon:inputText id="Invoice_referenceCode" 
									value="#{expenseInvoice.to.referenceCode}"
									rendered="#{!expenseInvoice.readOnly}" size="15" />
								<aon:outputText styleClass="aon-bold"
									value="#{expenseInvoice.to.referenceCode}"
									rendered="#{expenseInvoice.readOnly}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="Invoice_investment"
									value="#{expenseInvoice.to.investment}" 
									rendered="#{!expenseInvoice.readOnly}" />
								<aon:outputLabel for="Invoice_investment" styleClass="aon-italic aon-margin-right"
									value="#{financeBundle.finance_invoice_investment}"
									rendered="#{!expenseInvoice.readOnly or expenseInvoice.to.investment}" />

								<c:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Invoice_securityLevel"
										value="#{expenseInvoice.to.confidential}"
										rendered="#{!expenseInvoice.readOnly}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{!expenseInvoice.readOnly}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{expenseInvoice.readOnly and expenseInvoice.to.confidential}" />
								</c:if>

								<c:if test="#{company.EInvoice}">
									<aon:outputText value="&#160;"
										rendered="#{!expenseInvoice.new and expenseInvoice.to.signed}"
										title="#{signBundle.sign_signed}"
										styleClass="aon-icon aon-icon-signed" />
								</c:if>						

								<aon:outputText value="#{expenseInvoice.to.status}" />
								<c:if test="#{aonRole.accountingOperator and expenseInvoice.recorded}">
									<aon:outputText styleClass="aon-italic aon-margin-left"
										value="(#{financeBundle.finance_account_entry}: " />
									<aon:outputText styleClass="aon-bold"
										value="#{expenseInvoice.accountEntryId}" />
									<aon:outputText styleClass="aon-italic" value=")" />
								</c:if>
							</aon:div>
						</h:panelGrid>
					</aon:div>

					<aon:outputLabel for="Invoice_issueDate"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Invoice_issueDate"
						value="#{expenseInvoice.to.issueDate}" required="true"
						disabled="#{expenseInvoice.readOnly}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Creditor_id"
						value="#{financeBundle.finance_creditor}" />
					<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="Creditor_id"
								value="#{expenseInvoice.to.registry.id}"
								disabled="#{expenseInvoice.readOnly or !expenseInvoiceFinance.allPending}" size="5"
								lookupProperty="registry" lookup="#{creditorLookup}"
								lookupChangeListener="#{expenseInvoice.creditorData}"
								reRender="Creditor_full_name,Creditor_registry_document,InvoiceAddress"
								ajaxSingle="true" required="true" />
							<aon:lookupButton
								windowTitle="#{financeBundle.finance_creditor_selection}"
								disabled="#{expenseInvoice.readOnly or !expenseInvoiceFinance.allPending}" minHeight="460" minWidth="650" 
								property="#{expenseInvoice.to.registry}" lookupProperty="registry" lookup="#{creditorLookup}"
								lookupChangeListener="#{expenseInvoice.creditorData}"
								selectReRender="Creditor_id,Creditor_full_name,Creditor_registry_document,InvoiceAddress"
								actionType="search">
							</aon:lookupButton>
							<aon:lookupButton 
								windowTitle="#{financeBundle.finance_creditor_new}"
								disabled="#{expenseInvoice.readOnly or !expenseInvoiceFinance.allPending}" minWidth="650" minHeight="600"
								property="#{expenseInvoice.to.registry}" lookupProperty="registry" lookup="#{creditorLookup}"
								lookupChangeListener="#{expenseInvoice.creditorData}"
								selectReRender="Creditor_id,Creditor_full_name,Creditor_registry_document,InvoiceAddress"
								actionType="new">
							</aon:lookupButton>
							<aon:inputText id="Creditor_full_name" disabled="#{expenseInvoice.readOnly}"
								value="#{expenseInvoice.to.registryName}" size="60" />
						</a4j:region>
					</aon:div>

					<aon:outputLabel for="Creditor_registry_document"
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Creditor_registry_document"
						value="#{expenseInvoice.to.registryDocument}"
						disabled="#{expenseInvoice.readOnly}" size="10" />

					<aon:outputLabel for="Invoice_registryAddress_id"
						value="#{registryBundle.registry_address}" />
					<aon:div id="InvoiceAddress">
						<aon:selectOneMenu id="Invoice_registryAddress_id"
							rendered="#{(expenseInvoice.new or expenseInvoiceAddress.to.id == null) and expenseInvoice.addressCount > 0}"
							disabled="#{expenseInvoice.readOnly}"
							value="#{expenseInvoice.to.registryAddress.id}">
							<f:selectItems value="#{expenseInvoice.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel styleClass="aon-italic"
							value="#{registryBundle.registry_no_address_available}"
							rendered="#{(expenseInvoice.new or expenseInvoiceAddress.to.id == null) and expenseInvoice.addressCount == 0}" />
						<aon:inputText id="Invoice_registryAddress_address"
							rendered="#{!expenseInvoice.new and expenseInvoiceAddress.to.id != null}"
							value="#{expenseInvoice.address}" disabled="true" size="33" />
						<aon:inputText id="Invoice_registryAddress_city"
							rendered="#{!expenseInvoice.new and expenseInvoiceAddress.to.id != null}"
							value="#{expenseInvoice.city}" disabled="true" size="16" />
						<aon:div layout="inline" styleClass="aon-margin-left">
							<aon:commandButton id="popupButton"
								reRender="showInvoiceAddressWindow"
								rendered="#{!expenseInvoice.new and !expenseInvoice.readOnly}"
								actionListener="#{expenseInvoice.onInvoiceAddressShow}"
								styleClass="aon-icon-commandButton aon-icon-file-entrance"
								value="#{registryBundle.registry_address_other}" >
								<f:setPropertyActionListener target="#{expenseInvoice.showInvoiceAddressWindow}"
									value="#{true}" />								
							</aon:commandButton>
						</aon:div>
					</aon:div>
					 
					<aon:outputLabel for="Invoice_total" 
						value="#{bundle.aon_total}" />
					<aon:outputText id="Invoice_total" size="15" styleClass="aon-bold"
						value="#{expenseInvoice.toInvoiceTotalPrice}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>

				<aon:panelGrid columns="2" style="width: 100%;"
					styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Invoice_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="Invoice_comments" cols="150" rows="2"
						disabled="#{expenseInvoice.readOnly}"
						value="#{expenseInvoice.to.comments}" />

				</aon:panelGrid>

				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel value="#{financeBundle.finance_invoice_document_number}"
						rendered="#{!expenseInvoice.new}" />
					<aon:outputText styleClass="aon-bold"
						value="#{expenseInvoice.to.documentNumber}"
						rendered="#{!expenseInvoice.new}" />

					<aon:outputLabel for="Invoice_file" rendered="#{!expenseInvoice.new and !expenseInvoice.to.signed}"
						value="#{financeBundle.finance_invoice_file}" />
					<aon:div id="Invoice_fileDiv" rendered="#{!expenseInvoice.new and !expenseInvoice.to.signed}">
						<a4j:region>
							<h:panelGrid columns="#{expenseInvoiceAttachment.uploaded?3:1}">
								<aon:htmlCommandLink id="download" value="&#160;" target="_blank"
									immediate="true" rendered="#{expenseInvoiceAttachment.uploaded}"
									title="#{financeBundle.finance_download_disk}"
									actionListener="#{expenseInvoiceAttachment.downloadAttachment}"
									styleClass="aon-icon-commandButton aon-icon-file-download" />				
								<aon:commandButton id="removeFile" value="&#160;"
									actionListener="#{expenseInvoiceAttachment.removeAttachment}" 
									title="#{bundle.aon_fileUpload_remove}" reRender="Invoice_fileDiv"
									immediate="true" rendered="#{expenseInvoiceAttachment.uploaded}"
									styleClass="aon-icon-commandButton aon-icon-delete" />
								<aon:fileUpload id="Invoice_file"
									addControlLabel="#{bundle.aon_fileUpload_add}"
									stopControlLabel="#{bundle.aon_fileUpload_stop}"
									stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
									uploadControlLabel="#{bundle.aon_fileUpload_upload}"
									fileUploadListener="#{expenseInvoiceAttachment.fileUploaded}"
									listHeight="0px" immediateUpload="true" autoclear="true">
									<f:facet name="label">
										<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
									</f:facet>														
									<a4j:support event="onuploadcomplete" reRender="Invoice_fileDiv" />
								</aon:fileUpload>
							</h:panelGrid>							
						</a4j:region>
					</aon:div>	

				</aon:panelGrid>

				<ui:include	src="/com/code/aon/ui/finance/facelet/expenseInvoice/form_detail.xhtml">
					<ui:param name="invoiceController" value="#{expenseInvoice}" />
					<ui:param name="detailController" value="#{expenseInvoiceDetail}" />
				</ui:include>

				<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/form_finances.xhtml">
					<ui:param name="invoiceController" value="#{expenseInvoice}" />
					<ui:param name="detailController" value="#{expenseInvoiceDetail}" />
					<ui:param name="financeController" value="#{expenseInvoiceFinance}" />
				</ui:include>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAddress.xhtml">
			<ui:param name="invoiceController" value="#{expenseInvoice}" />
			<ui:param name="invoiceAddress" value="#{expenseInvoiceAddress}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/sign/facelet/signer/modal.xhtml" >
			<ui:param name="signButtonreRender" value="expenseInvoiceForm,showNewMessageWindow" />
			<aon:methodParam name="signActionListener" value="#{expenseInvoiceSigner.onSign}" type="actionListener" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
	</ui:define>
</ui:composition>
