<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="expenseInvoiceForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{financeBundle.finance_expense_invoice_management_module}" />
					<ui:param name="controller" value="#{expenseInvoice}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{expenseInvoice.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{!expenseInvoice.removable or !expenseInvoiceFinance.allPending}" />
					<ui:param name="saveButtonReRender" value="expenseInvoiceForm" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							actionListener="#{expenseInvoice.generateFinances}"
							rendered="#{expenseInvoiceDetail.model.rowCount > 0 and (!expenseInvoice.recorded or expenseInvoiceFinance.model.rowCount == 0)}"
							styleClass="aon-finding-toolbar-item aon-icon-tree"
							accesskey="#{bundle.aon_key_finance}">
							<f:setPropertyActionListener target="#{expenseInvoice.backActionListener}"
								value="#{null}" />
							<f:setPropertyActionListener target="#{expenseInvoice.backAction}"
								value="#{null}" />
						</aon:commandButton>
						<c:if test="#{aonRole.accountingOperator}">
							<aon:commandButton id="record"
								value="#{financeBundle.finance_record}"
								actionListener="#{expenseInvoice.onRecordInvoice}"
								rendered="#{expenseInvoiceDetail.model.rowCount > 0 and !expenseInvoice.recorded}"
								styleClass="aon-finding-toolbar-item aon-icon-task-assume"
								reRender="expenseInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandButton id="unrecord"
								value="#{financeBundle.finance_unrecord}"
								actionListener="#{expenseInvoice.onUnrecordInvoice}"
								rendered="#{expenseInvoice.recorded and !expenseInvoice.accountSource}"
								styleClass="aon-finding-toolbar-item aon-icon-task-liberate"
								reRender="expenseInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</c:if>
						<aon:htmlCommandLink id="expenseInvoice-report"
							value="#{financeBundle.finance_invoice}" target="_new" 
							rendered="#{!expenseInvoice.new and expenseInvoiceAttachment.attachmentAvailable}"
							action="#{expenseInvoiceSigner.onReport}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
						</aon:htmlCommandLink>						
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signToolbar.xhtml">
							<ui:param name="signController" value="#{expenseInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{expenseInvoice.new or (!expenseInvoiceAttachment.attachmentAvailable) or expenseInvoice.to.signed or (!certificate.signable)}" />
							<ui:param name="skipCancelSignButton" value="#{expenseInvoice.new or (!expenseInvoiceAttachment.attachmentAvailable) or (!expenseInvoice.to.signed)}" />
							<ui:param name="signButtonReRender" value="expenseInvoiceForm" />
						</ui:include>
					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					styleClass="aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Invoice_referenceCode"
						value="#{financeBundle.finance_invoice_number}" />
					<aon:div>
						<aon:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<aon:div id="invoiceReferenceCodeDiv">
								<aon:inputText id="Invoice_referenceCode" 
									value="#{expenseInvoice.to.referenceCode}"
									required="true"
									rendered="#{!expenseInvoice.readOnly and expenseInvoiceFinance.allPending}" 
									size="25" maxlength="32" />
								<aon:outputText styleClass="aon-bold"
									value="#{expenseInvoice.to.referenceCode}"
									rendered="#{expenseInvoice.readOnly or !expenseInvoiceFinance.allPending}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="Invoice_investment"
									value="#{expenseInvoice.to.investment}" 
									rendered="#{!expenseInvoice.readOnly}" />
								<aon:outputLabel for="Invoice_investment" styleClass="aon-italic aon-margin-right"
									value="#{financeBundle.finance_invoice_investment}"
									rendered="#{!expenseInvoice.readOnly or expenseInvoice.to.investment}" />

								<c:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Invoice_securityLevel"
										value="#{expenseInvoice.to.confidential}"
										rendered="#{!expenseInvoice.readOnly and expenseInvoiceFinance.allPending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{!expenseInvoice.readOnly and expenseInvoiceFinance.allPending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{(expenseInvoice.readOnly or !expenseInvoiceFinance.allPending) and expenseInvoice.to.confidential}" />
								</c:if>

								<c:if test="#{company.EInvoice}">
									<aon:outputText value="&#160;"
										rendered="#{!expenseInvoice.new and expenseInvoice.to.signed}"
										title="#{signBundle.sign_signed}"
										styleClass="aon-icon aon-icon-signed" />
								</c:if>						

								<aon:outputText value="#{expenseInvoice.to.status}" />
								<c:if test="#{aonRole.accountingOperator and expenseInvoice.recorded}">
									<aon:outputText styleClass="aon-italic aon-margin-left"
										value="(#{financeBundle.finance_account_entry}: " />
									<aon:outputText styleClass="aon-bold"
										value="#{expenseInvoice.accountEntryId}" />
									<aon:outputText styleClass="aon-italic" value=")" />
								</c:if>
							</aon:div>
						</aon:panelGrid>
					</aon:div>

					<aon:outputLabel for="Invoice_issueDate"
						value="#{bundle.aon_date}" />
					<aon:div>
						<aon:selectInputDate id="Invoice_issueDate"
							value="#{expenseInvoice.to.issueDate}" required="true"
							disabled="#{expenseInvoice.readOnly}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<c:if test="#{aonRole.accountingOperator}">
								<a4j:support ajaxSingle="true" event="oninputchange"
									actionListener="#{expenseInvoice.onDateChanged}"
									reRender="Invoice_taxDate"
									focus="Creditor_id" />
								<a4j:support ajaxSingle="true" event="onchanged"
									actionListener="#{expenseInvoice.onDateChanged}"
									reRender="Invoice_taxDate"
									focus="Creditor_id" />
							</c:if>
						</aon:selectInputDate>
						<c:if test="#{aonRole.accountingOperator}">
							<aon:outputLabel for="Invoice_taxDate" styleClass="aon-margin-left aon-margin-right aon-italic"
								value="#{financeBundle.finance_tax_date}" />
							<aon:selectInputDate id="Invoice_taxDate"
								value="#{expenseInvoice.to.taxDate}" required="true"
								disabled="#{expenseInvoice.readOnly}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"
								inputStyle="#{expenseInvoice.taxDateEquals?'':'background-color: #ff865e;'}">
								<a4j:support ajaxSingle="true" event="oninputchange"
									reRender="Invoice_taxDate"
									focus="Creditor_id" />
								<a4j:support ajaxSingle="true" event="onchanged"
									reRender="Invoice_taxDate"
									focus="Creditor_id" />
							</aon:selectInputDate>
						</c:if>
					</aon:div>

					<ui:include src="/com/code/aon/ui/finance/facelet/creditor/lookup.xhtml">
						<ui:param name="lookupTo" value="#{expenseInvoice.to.registry}" />
						<ui:param name="lookupForRegistry" value="#{true}" />
						<ui:param name="lookupInputNameValue" value="#{expenseInvoice.to.registryName}" />
						<ui:param name="lookupDisabled" value="#{expenseInvoice.registryReadOnly or !expenseInvoiceFinance.allPending}" />
						<ui:param name="lookupInputNameDisabled" value="#{expenseInvoice.readOnly or !expenseInvoiceFinance.allPending}" />
						<ui:param name="lookupReRender" value="Creditor_lookup_document,InvoiceAddress,InvoiceProject" />
						<ui:param name="idRequired" value="#{true}" />						
						<ui:param name="skipSuggestText" 
							value="#{expenseInvoice.to.registry != null and expenseInvoice.to.registry.id != null}" />
						<aon:methodParam name="lookupChangeListener"
							value="#{expenseInvoice.creditorData}" type="lookupChangeListener" />
					</ui:include>

					<aon:outputLabel for="Creditor_registry_document"
						value="#{bundle.aon_company_document}" />
					<aon:panelGroup id="Creditor_lookup_document">
						<aon:selectOneMenu id="Creditor_registry_document_type" 
							disabled="#{expenseInvoice.readOnly}"
							value="#{expenseInvoice.to.registryDocumentType}"
							reRender="Creditor_document_icon">
							<f:selectItems value="#{registryCollections.documentTypes}" />
						</aon:selectOneMenu>
						<aon:outputText styleClass="aon-margin-left aon-italic"
							value="#{bundle.aon_country}" />
						<aon:selectOneMenu id="Creditor_registry_document_country"
							styleClass="aon-margin-left" disabled="#{expenseInvoice.readOnly}"
							value="#{expenseInvoice.to.registryDocumentCountry}"
							reRender="Creditor_document_icon">
							<f:selectItems value="#{commonCollections.countryCodes}" />
						</aon:selectOneMenu>
						<aon:inputText id="Creditor_registry_document" 
							style="margin-left: 3px;" disabled="#{expenseInvoice.readOnly}"
							value="#{expenseInvoice.to.registryDocument}" size="16" maxlength="16"
							reRender="Creditor_document_icon" 
							onblur="toUpperCase(this);">
							<f:validateLength minimum="1" maximum="16" />
 						</aon:inputText>
						<aon:panelGroup id="Creditor_document_icon">
							<aon:outputText 
								rendered="#{!expenseInvoice.to.registryDocumentValidable}"
								styleClass="aon-icon-question"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{expenseInvoice.to.registryDocumentValidable and expenseInvoice.to.validRegistryDocument}"
								styleClass="aon-icon-predetermine"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{expenseInvoice.to.registryDocumentValidable and !expenseInvoice.to.validRegistryDocument}"
								styleClass="aon-icon-exception"
								style="padding-left: 15px;"
								value="&#160;" />
	 					</aon:panelGroup>
 					</aon:panelGroup>

					<aon:outputLabel for="Invoice_registryAddress_id"
						value="#{registryBundle.registry_address}" />
					<aon:div id="InvoiceAddress">
						<aon:selectOneMenu id="Invoice_registryAddress_id"
							rendered="#{!expenseInvoice.readOnly and expenseInvoiceAddress.to.id == null and expenseInvoice.addressCount > 0}"
							value="#{expenseInvoice.to.registryAddress}">
							<f:selectItems value="#{expenseInvoice.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel styleClass="aon-italic"
							value="#{registryBundle.registry_no_address_available}"
							rendered="#{expenseInvoiceAddress.to.id == null and ((expenseInvoice.readOnly and expenseInvoice.to.registryAddress.id == null) or (!expenseInvoice.readOnly and expenseInvoice.addressCount == 0))}" />
						<aon:outputText styleClass="aon-bold"
							value="#{expenseInvoice.address}" 
							rendered="#{expenseInvoiceAddress.to.id != null or (expenseInvoice.readOnly and expenseInvoice.to.registryAddress.id != null)}" />
						<aon:outputText styleClass="aon-margin-left aon-bold"
							value="(#{expenseInvoice.city})"
							rendered="#{expenseInvoiceAddress.to.id != null or (expenseInvoice.readOnly and expenseInvoice.to.registryAddress.id != null)}" />
						<aon:div layout="inline" styleClass="aon-margin-left">
							<aon:commandButton id="invoiceAddressButton"
								value="#{registryBundle.registry_address_other}"
								styleClass="aon-icon-commandButton aon-icon-go aon-bold aon-italic"
								rendered="#{!expenseInvoice.new and !expenseInvoice.readOnly}"
								actionListener="#{expenseInvoice.onInvoiceAddressShow}"
								reRender="showInvoiceAddressWindow">
								<f:setPropertyActionListener target="#{expenseInvoice.showInvoiceAddressWindow}"
									value="#{true}" />								
							</aon:commandButton>
						</aon:div>
					</aon:div>

					<aon:outputLabel for="Invoice_total" 
						value="#{bundle.aon_total}" />
					<aon:div>
						<aon:outputText id="Invoice_total" styleClass="aon-bold"
							value="#{expenseInvoice.toInvoiceTotalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputLabel styleClass="aon-margin-left aon-italic"
							value="(#{bundle.aon_tax_included})" />
					</aon:div>

				</aon:panelGrid>

				<aon:div id="InvoiceProject">
					<aon:panelGrid columns="2" style="width: 100%;"
						rendered="#{expenseInvoice.to.project.id != null or expenseInvoice.projectCount > 0}"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto">

						<c:if test="#{!aonConfiguration.bean.invoice.showTasData}">
							<aon:outputLabel for="Invoice_project_id"
								value="#{projectBundle.project_project}" />
						</c:if>
						<c:if test="#{aonConfiguration.bean.invoice.showTasData}">
							<aon:outputLabel for="Invoice_project_id"
								value="#{tasBundle.tas_projectTas}" />
						</c:if>
						<aon:div>
							<aon:selectOneMenu id="Invoice_project_id"
								rendered="#{!expenseInvoice.readOnly and expenseInvoice.to.project.id == null and expenseInvoice.projectCount > 0}"
								value="#{expenseInvoice.to.project}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{expenseInvoice.projects}" />
							</aon:selectOneMenu>
							<c:if test="#{!aonConfiguration.bean.invoice.showTasData}">
								<aon:outputLabel styleClass="aon-italic"
									value="#{projectBundle.project_no_project_linked}"
									rendered="#{expenseInvoice.readOnly and expenseInvoice.to.project.id == null and expenseInvoice.projectCount > 0}" />
							</c:if>
							<c:if test="#{aonConfiguration.bean.invoice.showTasData}">
								<aon:outputLabel styleClass="aon-italic"
									value="#{tasBundle.tas_no_projectTas_linked}"
									rendered="#{expenseInvoice.readOnly and expenseInvoice.to.project.id == null and expenseInvoice.projectCount > 0}" />
							</c:if>
							<aon:outputText styleClass="aon-bold"
								value="#{expenseInvoice.to.project.name}" 
								rendered="#{expenseInvoice.to.project.id != null}" />
							<aon:div layout="inline" styleClass="aon-margin-left">
								<aon:commandButton id="newInvoiceProject"
									value="&#160;" title="#{bundle.aon_reset}"
									styleClass="aon-icon-commandButton aon-icon-reset"
									rendered="#{expenseInvoice.readOnly and expenseInvoice.to.project.id == null and expenseInvoice.projectCount > 0}"
									reRender="showInvoiceProjectWindow">
									<f:setPropertyActionListener target="#{expenseInvoice.showInvoiceProjectWindow}"
										value="#{true}" />								
									<f:setPropertyActionListener target="#{expenseInvoice.showInvoiceDetailProjectWindow}"
										value="#{false}" />								
								</aon:commandButton>
								<aon:commandButton id="removeInvoiceProject" 
									value="&#160;" title="#{bundle.aon_remove}" 
									styleClass="aon-icon-commandButton aon-icon-delete"
									rendered="#{expenseInvoice.to.project.id != null}"
									actionListener="#{expenseInvoice.removeInvoiceProject}" 
									reRender="expenseInvoiceForm" />
							</aon:div>
						</aon:div>

					</aon:panelGrid>
				</aon:div>

				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:div>
						<aon:outputLabel for="Invoice_comments"
							value="#{bundle.aon_comment}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_comment_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Invoice_comments" cols="80" rows="3"
						disabled="#{expenseInvoice.readOnly}"
						value="#{expenseInvoice.to.comments}" />

					<aon:div>
						<aon:outputLabel for="Invoice_remarks"
							value="#{bundle.aon_remark}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_remark_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Invoice_remarks" cols="80" rows="3"
						disabled="#{expenseInvoice.readOnly}"
						value="#{expenseInvoice.to.remarks}" />

				</aon:panelGrid>

				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel value="#{financeBundle.finance_invoice_document_number}"
						rendered="#{!expenseInvoice.new}" />
					<aon:outputText styleClass="aon-bold"
						value="#{expenseInvoice.to.documentNumber}"
						rendered="#{!expenseInvoice.new}" />

					<aon:outputLabel for="Invoice_file" rendered="#{!expenseInvoice.new and !expenseInvoice.to.signed}"
						value="#{financeBundle.finance_invoice_file}" />
					<aon:div rendered="#{!expenseInvoice.new and !expenseInvoice.to.signed}">
						<a4j:region>
							<h:panelGrid id="Invoice_fileDiv" columns="#{expenseInvoiceAttachment.uploaded?2:1}">
								<aon:commandButton id="removeFile" value="&#160;"
									actionListener="#{expenseInvoiceAttachment.removeAttachment}" 
									title="#{bundle.aon_fileUpload_remove}" reRender="Invoice_fileDiv,expenseInvoiceToolbar"
									immediate="true" rendered="#{expenseInvoiceAttachment.uploaded}"
									styleClass="aon-icon-commandButton aon-icon-delete" />
								<aon:fileUpload id="Invoice_file"
									fileUploadListener="#{expenseInvoiceAttachment.fileUploaded}"
									ontyperejected="alert('#{financeBundle.finance_invoice_only_pdf}');"
									acceptedTypes="pdf">
									<f:facet name="label">
										<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
									</f:facet>														
									<a4j:support event="onuploadcomplete" reRender="Invoice_fileDiv,expenseInvoiceToolbar" />
								</aon:fileUpload>
							</h:panelGrid>							
						</a4j:region>
					</aon:div>	

				</aon:panelGrid>

				<ui:include	src="/com/code/aon/ui/finance/facelet/expenseInvoice/form_detail.xhtml">
					<ui:param name="invoiceController" value="#{expenseInvoice}" />
					<ui:param name="detailController" value="#{expenseInvoiceDetail}" />
					<c:if test="#{!aonConfiguration.bean.invoice.showTasData}">
						<ui:param name="projectLabel" value="#{projectBundle.project_project}" />
					</c:if>
					<c:if test="#{aonConfiguration.bean.invoice.showTasData}">
						<ui:param name="projectLabel" value="#{tasBundle.tas_projectTas}" />
					</c:if>
				</ui:include>

				<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/form_finances.xhtml">
					<ui:param name="invoiceController" value="#{expenseInvoice}" />
					<ui:param name="detailController" value="#{expenseInvoiceDetail}" />
					<ui:param name="financeController" value="#{expenseInvoiceFinance}" />
				</ui:include>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{expenseItemLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAddress.xhtml">
			<ui:param name="invoiceController" value="#{expenseInvoice}" />
			<ui:param name="invoiceAddress" value="#{expenseInvoiceAddress}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalProject.xhtml">
			<ui:param name="controller" value="#{expenseInvoice}" />
			<ui:param name="detailController" value="#{expenseInvoiceDetail}" />
			<ui:param name="parentForm" value="expenseInvoiceForm" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/sign/facelet/signer/modal.xhtml" >
			<ui:param name="signButtonreRender" value="expenseInvoiceForm" />
			<aon:methodParam name="signActionListener" value="#{expenseInvoiceSigner.onSign}" type="actionListener" />
		</ui:include>
	</ui:define>
</ui:composition>
