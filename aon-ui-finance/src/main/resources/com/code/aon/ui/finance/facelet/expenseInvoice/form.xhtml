<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="expenseInvoiceForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.finance_expense_invoice_management_module}" />
					<ui:param name="controller" value="#{expenseInvoice}" />
					<ui:param name="skipFocusFirst" value="#{!expenseInvoice.nevv}" />
					<ui:param name="skipSaveButton" value="#{expenseInvoice.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{!expenseInvoice.removable or !expenseInvoiceFinance.allPending}" />
					<ui:param name="saveButtonReRender" value="expenseInvoiceForm" />
					<ui:param name="showMoreMenu" value="#{!expenseInvoice.nevv and expenseInvoiceDetail.to == null}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:htmlCommandLink id="expenseInvoice-report"
							value="#{bundle.finance_invoice}" target="_new" 
							rendered="#{expenseInvoice.attachmentAvailable}"
							action="#{expenseInvoiceSigner.onReport}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
						</aon:htmlCommandLink>											
					</ui:define>
					<ui:define name="moreMenuContent">
						<aon:menuItem id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							actionListener="#{expenseInvoice.onGenerateFinances}"
							rendered="#{expenseInvoice.toInvoiceTotalPrice != 0 and (!expenseInvoice.recorded or expenseInvoiceFinance.allPending)}"
							iconClass="aon-icon-tree"
							accesskey="#{bundle.aon_key_finance}">
							<f:setPropertyActionListener target="#{expenseInvoice.backActionListener}"
								value="#{null}" />
							<f:setPropertyActionListener target="#{expenseInvoice.backAction}"
								value="#{null}" />
						</aon:menuItem>
						<aon:if test="#{aonRole.accountingOperator}">
							<aon:menuItem id="record"
								value="#{bundle.finance_record}"
								actionListener="#{expenseInvoice.onRecordInvoice}"
								rendered="#{!expenseInvoice.recorded and expenseInvoiceDetail.model.rowCount > 0}"
								iconClass="aon-icon-task-assume"
								reRender="expenseInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>
						<aon:if test="#{aonRole.accountingManager}">
							<aon:menuItem id="unrecord"
								value="#{bundle.finance_unrecord}"
								actionListener="#{expenseInvoice.onUnrecordInvoice}"
								rendered="#{expenseInvoice.recorded and !expenseInvoice.accountSource}"
								iconClass="aon-icon-task-liberate"
								reRender="expenseInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>					
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signMenuItem.xhtml">
							<ui:param name="signController" value="#{expenseInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{expenseInvoice.signed or !certificate.signable or !expenseInvoice.attachmentAvailable}" />
							<ui:param name="skipCancelSignButton" value="#{!expenseInvoice.signed or !expenseInvoice.attachmentAvailable}" />
							<ui:param name="signButtonReRender" value="expenseInvoiceForm" />
						</ui:include>

						<rich:menuSeparator id="actionMenuSeparator" />

						<aon:if test="#{companyCollections.activeCompanyActivitiesCount > 1}">
							<aon:menuItem id="activities"
								value="#{bundle.aon_activity}"
								iconClass="aon-icon-activity"
								reRender="showActivityWindow">
								<f:setPropertyActionListener target="#{expenseInvoice.showActivityWindow}" 
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="projects"
							value="#{bundle.aon_project}"
							iconClass="aon-icon-statistics"
							reRender="showProjectWindow">
							<f:setPropertyActionListener target="#{expenseInvoice.showProjectWindow}" 
								value="#{true}" />							
							<f:setPropertyActionListener target="#{expenseInvoice.showDetailProjectWindow}"
								value="#{false}" />
						</aon:menuItem>
						<aon:menuItem id="documents"
							value="#{bundle.aon_documents}"
							iconClass="aon-icon-payroll"
							reRender="showDocumentWindow">
							<f:setPropertyActionListener target="#{expenseInvoice.showDocumentWindow}"
								value="#{true}" />							
						</aon:menuItem>						
						<aon:menuItem id="comments"
							value="#{bundle.aon_comment}"
							iconClass="aon-icon-comments"
							reRender="showCommentsWindow">
							<f:setPropertyActionListener target="#{expenseInvoice.showCommentsWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:menuItem id="remarks"
							value="#{bundle.aon_remark}"
							iconClass="aon-icon-notes"
							reRender="showRemarksWindow">
							<f:setPropertyActionListener target="#{expenseInvoice.showRemarksWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:if test="#{aonRole.accountingOperator}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator1" />
							<aon:menuItem id="fiscalInformation"
								value="#{bundle.finance_fiscal_information}"
								iconClass="aon-icon-info"
								reRender="showFiscalInformationWindow">
								<f:setPropertyActionListener target="#{expenseInvoice.showFiscalInformationWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>

						<ui:include	src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />

					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{expenseInvoice.nevv}">
					<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formNewContent.xhtml">
						<ui:param name="invoiceController" value="#{expenseInvoice}" />
						<ui:param name="addressController" value="#{expenseInvoiceAddress}" />
						<ui:param name="detailController" value="#{expenseInvoiceDetail}" />
						<ui:param name="financeController" value="#{expenseInvoiceFinance}" />
						<ui:param name="formName" value="expenseInvoiceForm" />
					</ui:include>
				</aon:if>			
				<aon:if test="#{!expenseInvoice.nevv}">
					<aon:panelGrid id="dataTable" columns="4"
						styleClass="aon-width-all aon-margin-bottom"
						columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-500,
							aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">

						<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formBasicContent.xhtml">
							<ui:param name="invoiceController" value="#{expenseInvoice}" />
							<ui:param name="addressController" value="#{expenseInvoiceAddress}" />
							<ui:param name="detailController" value="#{expenseInvoiceDetail}" />
							<ui:param name="financeController" value="#{expenseInvoiceFinance}" />
							<ui:param name="formName" value="expenseInvoiceForm" />
						</ui:include>
					</aon:panelGrid>

					<aon:div styleClass="aon-margin-top">
						<aon:panelGrid columns="2" styleClass="aon-width-all"
							columnClasses="aon-panelGrid-odd aon-width-140,
								aon-panelGrid-even aon-width-auto">

							<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formCommonContent.xhtml">
								<ui:param name="invoiceController" value="#{expenseInvoice}" />
								<ui:param name="addressController" value="#{expenseInvoiceAddress}" />
								<ui:param name="detailController" value="#{expenseInvoiceDetail}" />
								<ui:param name="financeController" value="#{expenseInvoiceFinance}" />
								<ui:param name="formName" value="expenseInvoiceForm" />
							</ui:include>

						</aon:panelGrid>
					</aon:div>
				</aon:if>

				<ui:include	src="/com/code/aon/ui/finance/facelet/expenseInvoice/formDetail.xhtml">
					<ui:param name="invoiceController" value="#{expenseInvoice}" />
					<ui:param name="detailController" value="#{expenseInvoiceDetail}" />
					<aon:if test="#{!aonConfiguration.bean.invoice.showTasData}">
						<ui:param name="projectLabel" value="#{bundle.aon_project}" />
					</aon:if>
					<aon:if test="#{aonConfiguration.bean.invoice.showTasData}">
						<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
					</aon:if>
				</ui:include>

				<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formFinance.xhtml">
					<ui:param name="invoiceController" value="#{expenseInvoice}" />
					<ui:param name="detailController" value="#{expenseInvoiceDetail}" />
					<ui:param name="financeController" value="#{expenseInvoiceFinance}" />
				</ui:include>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{expenseItemLookup}" />
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAddress.xhtml">
			<ui:param name="invoiceController" value="#{expenseInvoice}" />
			<ui:param name="invoiceAddress" value="#{expenseInvoiceAddress}" />
			<ui:param name="addressReRender" value="InvoiceAddress" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalActivity.xhtml">
			<ui:param name="invoiceController" value="#{expenseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/project/facelet/project/modalProject.xhtml">
			<ui:param name="controller" value="#{expenseInvoice}" />
			<ui:param name="parentReRender" value="expenseInvoiceForm" />
			<aon:methodParam name="parentActionListener" value="#{expenseInvoice.addInvoiceProject}" type="actionListener" />
			<ui:param name="parentValue" value="#{expenseInvoice.to.project}" />
			<ui:param name="detailReRender" value="invoiceDetails" />
			<aon:methodParam name="detailActionListener" value="#{expenseInvoiceDetail.onInvoiceDetailSave}" type="actionListener" />
			<ui:param name="detailValue" value="#{expenseInvoiceDetail.invoiceDetail.project}" />
			<aon:if test="#{!aonConfiguration.bean.invoice.showTasData}">
				<ui:param name="projectLabel" value="#{bundle.aon_project}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.invoice.showTasData}">
				<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
			</aon:if>
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalDocuments.xhtml">
			<ui:param name="invoiceController" value="#{expenseInvoice}" />
			<ui:param name="attachmentController" value="#{expenseInvoiceAttach}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/sign/facelet/signer/modal.xhtml" >
			<ui:param name="signButtonreRender" value="expenseInvoiceForm" />
			<aon:methodParam name="signActionListener" value="#{expenseInvoiceSigner.onSign}" type="actionListener" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalComments.xhtml">
			<ui:param name="invoiceController" value="#{expenseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalRemarks.xhtml">
			<ui:param name="invoiceController" value="#{expenseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{expenseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalFiscalInfo.xhtml">
			<ui:param name="invoiceController" value="#{expenseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAmortization.xhtml">
			<ui:param name="invoiceController" value="#{expenseInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
			<ui:param name="bankAccountController" value="#{expenseInvoiceFinance.accountHelper}" />
			<ui:param name="modalReRender" value="financeContainer,InvoiceFinance_bankAccount_div" />
		</ui:include>
	</ui:define>
</ui:composition>
