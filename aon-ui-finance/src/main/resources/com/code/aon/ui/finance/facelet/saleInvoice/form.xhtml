<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="saleInvoiceForm">
			<aon:div id="menuExt">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.finance_sale_invoice_management_module}" />
					<ui:param name="controller" value="#{saleInvoice}" />
					<ui:param name="skipFocusFirst" value="#{!saleInvoice.nevv}" />
					<ui:param name="skipSaveButton" value="#{saleInvoice.tediReadOnly or saleInvoice.tbaiInvoice or saleInvoice.verifactuInvoice}" />
					<ui:param name="skipRemoveButton" value="#{!saleInvoice.removable or !saleInvoiceFinance.allPending or saleInvoice.tbaiInvoice or saleInvoice.verifactuInvoice}" />
					<ui:param name="saveButtonReRender" value="saleInvoiceForm" />
					<ui:param name="showMoreMenu" value="#{!saleInvoice.nevv and saleInvoiceDetail.to == null}" />
					<ui:param name="removeConfirmMessage" value="#{saleInvoice.removeConfirmMessage}" />
					<ui:define name="beforeSpinToolbarContent">
						<!-- ****************** IicketBAI ************************  --> 
						<aon:if test="#{saleInvoice.tbaiInvoice and !saleInvoice.recorded}">
							<aon:commandButton id="tbaiInvoiceRemove"	
								value="&#160;"
								title="Anular"
								action="#{saleInvoice.tbai}"
								onclick="#{saveOnClick}" 
								styleClass="aon-finding-toolbar-item aon-icon-delete"
								reRender="showCertTbaiAnularWindow">
									<f:setPropertyActionListener target="#{saleInvoice.showCertTbaiAnularWindow}"
										value="#{true}" />
							</aon:commandButton>
						</aon:if>
						<aon:if test="#{!saleInvoice.nevv and saleInvoice.tbai and !saleInvoice.tbaiInvoice and (saleInvoice.to.number le 0 or saleInvoice.uniqueNumberOfSeries)}"> 
							<aon:commandButton id="acceptTbai"	
								value="&#160;"
								title="Emitir"
								action="#{saleInvoice.tbai}"
								onclick="#{saveOnClick}" 
								styleClass="aon-finding-toolbar-item aon-icon-check-black"
								reRender="showCertTbaiWindow">
									<f:setPropertyActionListener target="#{saleInvoice.showCertTbaiWindow}"
										value="#{true}" />
							</aon:commandButton>
						</aon:if>
						<aon:if test="#{saleInvoice.tbaiInvoice and saleInvoice.araba}"> 
							<aon:outputLink 
								id="saleInvoice-tbaiUrlAraba"	
								target="_blank" 
								value="#{saleInvoice.tbaiUrl}"
								style="height: 12px;"
								styleClass="aon-finding-toolbar-item aon-icon-araba">
							</aon:outputLink>
						</aon:if>
						<aon:if test="#{saleInvoice.tbaiInvoice and saleInvoice.gipuzkoa}"> 
							<aon:outputLink 
								id="saleInvoice-tbaiUrlGipuzkoa"	
								target="_blank" 
								value="#{saleInvoice.tbaiUrl}"
								style="height: 12px;"
								styleClass="aon-finding-toolbar-item aon-icon-gipuzkoa">
							</aon:outputLink>
						</aon:if>
						<aon:if test="#{saleInvoice.tbaiInvoice and saleInvoice.bizkaia}"> 
							<aon:outputLink 
								id="saleInvoice-tbaiUrlBizkaia"	
								target="_blank" 
								value="#{saleInvoice.tbaiUrl}"
								style="height: 12px;"
								styleClass="aon-finding-toolbar-item aon-icon-bizkaia">
							</aon:outputLink>
						</aon:if>
						
						<!-- ****************** Verifactu ************************  --> 
						<aon:if test="#{saleInvoice.verifactuInvoice and !saleInvoice.recorded}">
							<aon:commandButton id="verifactuInvoiceRemove"	
								value="&#160;"
								title="Anular"
								action="#{saleInvoice.verifactu}"
								onclick="#{saveOnClick}" 
								styleClass="aon-finding-toolbar-item aon-icon-delete"
								reRender="showCertVerifactuAnularWindow">
									<f:setPropertyActionListener target="#{saleInvoice.showCertVerifactuAnularWindow}"
										value="#{true}" />
							</aon:commandButton>
						</aon:if>
						<aon:if test="#{saleInvoice.issueableToVerifactu}">
							<aon:commandButton id="acceptVerifactu"	
								value="&#160;"
								title="Emitir"
								action="#{saleInvoice.verifactu}"
								styleClass="aon-finding-toolbar-item aon-icon-check-black"
								onclick="#{saveOnClick}" 
								reRender="showCertVerifactuWindow">
									<f:setPropertyActionListener target="#{saleInvoice.showCertVerifactuWindow}"
										value="#{true}" />
							</aon:commandButton>
						</aon:if>
<!-- 
						<aon:if test="#{!saleInvoice.nevv and saleInvoice.verifactu and !saleInvoice.verifactuInvoice and (saleInvoice.to.number le 0 or saleInvoice.uniqueNumberOfSeries)}">
 -->						
						
						<!-- ****************** Common ************************  --> 
						<aon:if test="#{aonConfiguration.bean.invoice.showSendEmail}">
							<aon:commandButton value="&#160;" id="email"
								actionListener="#{saleInvoice.onSendInvoiceByEmail}"
								rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null}"
								styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border"
								reRender="showNewMessageWindow">
							</aon:commandButton>
						</aon:if>
						<aon:if test="#{saleInvoice.printWord}">
							<aon:htmlCommandLink id="saleInvoice-reportWord"
								value="&#160;" target="_new" 
								rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null}"
								action="#{report.onExecute}"
								styleClass="aon-finding-toolbar-item aon-icon-word aon-finding-toolbar-item-no-border"
								actionListener="#{printParams.onInit}">
								<f:param name="reportKey" value="#{printParams.saleInvoiceParams.saleInvoiceTemplateValue}" />
								<f:param name="outputFormat" value="DOCX" />
							</aon:htmlCommandLink>
						</aon:if>
						
						<aon:outputLink id="saleInvoice-downloadPdf"
							target="_blank" value="#{saleInvoice.downloadURL}" 
							rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null and (saleInvoice.tbai or saleInvoice.verifactu or printParams.saleInvoiceDefault) }"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
					    </aon:outputLink>
						<!-- 
						<aon:if test="#{saleInvoice.hasInvoiceDoc()}">
							<aon:outputLink id="saleInvoice-downloadPdf"
								target="_blank" value="#{saleInvoice.invoiceDoc.url}" 
								styleClass="aon-finding-toolbar-item aon-icon-pdf">
						    </aon:outputLink>
						</aon:if>
						
						<aon:if test="#{!saleInvoice.hasInvoiceDoc()}">
							<aon:outputLink id="saleInvoice-downloadPdf"
								target="_blank" value="#{saleInvoice.downloadURL}" 
								rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null and (saleInvoice.tbai or printParams.saleInvoiceDefault) }"
								styleClass="aon-finding-toolbar-item aon-icon-pdf">
						    </aon:outputLink>
						</aon:if>
		 				-->

						<aon:htmlCommandLink id="saleInvoice-report"
							value="#{bundle.finance_invoice}" target="_new" 
							rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null and !saleInvoice.tbai and !saleInvoice.verifactu and !printParams.saleInvoiceDefault}"
							action="#{saleInvoiceSigner.onReport}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf"
							actionListener="#{printParams.onInit}">
							<f:param name="reportKey" value="#{printParams.saleInvoiceParams.saleInvoiceTemplateValue}" />
						</aon:htmlCommandLink>
						
						<aon:htmlCommandLink id="saleInvoice-facturae"
							value="#{bundle.finance_facturae}" target="_blank" 
							rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null and saleInvoice.downloadFacturae}"
							action="#{saleInvoiceSigner.onDownloadFacturae}"
							styleClass="aon-finding-toolbar-item aon-icon-mail-save">
						</aon:htmlCommandLink>
						
						<aon:if test="#{company.ediSupportEnabled}">
							<aon:commandButton id="saleInvoice-downloadEdiFtp"
								value="SERES"
								title="Recuperar del servidor FTP de Seresnet"
								rendered="#{saleInvoice.nevv}"
								styleClass="aon-finding-toolbar-item aon-icon-seres"
								actionListener="#{saleInvoice.ftpEdiDownloader.onShowFtpEdi}"
								ajaxSingle="#{true}"
								action="saleInvoice_form"
								onclick="Richfaces.showModalPanel('waitProccess')" 
								oncomplete="Richfaces.hideModalPanel('waitProccess')">
								<f:setPropertyActionListener target="#{saleInvoice.ftpEdiDownloader.showEdiFtpWindow}"
									value="#{true}" />
							</aon:commandButton>
							<aon:commandButton id="saleInvoice-uploadEdiFtp"
								value="SERES"
								title="Enviar al servidor FTP de Seresnet"
								rendered="#{not saleInvoice.nevv}"
								styleClass="aon-finding-toolbar-item aon-icon-seres"
								actionListener="#{saleInvoice.ftpEdiUploader.onShowFtpEdi}">
								<f:setPropertyActionListener target="#{saleInvoice.ftpEdiUploader.showEdiFtpWindow}"
									value="#{true}" />
							</aon:commandButton>
						</aon:if>
					</ui:define>
					<ui:define name="moreMenuContent">
						<aon:if test="#{aonConfiguration.bean.invoice.showWarehouseData}">
							<aon:menuItem id="deliveryTransfer"
								value="#{bundle.config_series_deliveries}"
								immediate="#{true}" rendered="#{!saleInvoice.readOnly}"
								iconClass="aon-icon-sincronize"
								actionListener="#{saleInvoice.onDeliveryTransferShow}"
								reRender="showDeliveryTransferWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showDeliveryTransferWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							rendered="#{saleInvoice.toInvoiceTotalPrice != 0 and (!saleInvoice.recorded or saleInvoiceFinance.allPending)}"
							iconClass="aon-icon-tree"
							actionListener="#{saleInvoice.onGenerateFinances}"
							accesskey="#{bundle.aon_key_finance}">
							<f:setPropertyActionListener target="#{saleInvoice.backActionListener}"
								value="#{null}" />
							<f:setPropertyActionListener target="#{saleInvoice.backAction}"
								value="#{null}" />
						</aon:menuItem>
						<aon:menuItem id="rectify"
							value="#{bundle.finance_rectify}"
							rendered="#{saleInvoice.to.number > 0 and !saleInvoice.rectifier and !saleInvoice.accountSource and saleInvoiceDetail.model.rowCount > 0}"
							iconClass="aon-icon-version"
							actionListener="#{saleInvoice.onRectificationShow}"
							reRender="showRectificationWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showRectificationWindow}"
								value="#{true}" />
						</aon:menuItem>
						<aon:if test="#{aonRole.accountingOperator}">
							<aon:menuItem id="record"
								value="#{bundle.finance_record}"
								actionListener="#{saleInvoice.onRecordInvoice}"
								rendered="#{saleInvoice.to.number > 0 and !saleInvoice.recorded and saleInvoiceDetail.model.rowCount > 0}"
								iconClass="aon-icon-task-assume"
								reRender="saleInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>
						<aon:if test="#{aonRole.accountingManager}">
							<aon:menuItem id="unrecord"
								value="#{bundle.finance_unrecord}"
								actionListener="#{saleInvoice.onUnrecordInvoice}"
								rendered="#{saleInvoice.recorded and !saleInvoice.accountSource}"
								iconClass="aon-icon-task-liberate"
								reRender="saleInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signMenuItem.xhtml">
							<ui:param name="signController" value="#{saleInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{saleInvoice.signed or !certificate.signable}" />
							<ui:param name="skipCancelSignButton" value="#{!saleInvoice.signed}" />
							<ui:param name="signButtonReRender" value="saleInvoiceForm" />
						</ui:include>
						
						<aon:if test="#{saleInvoice.downloadFacturae}">
							<aon:menuItem id="Facturae_info"
								value="Información Facturae"
								iconClass="aon-icon-info"
								reRender="showFacturaeInfoWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showFacturaeInfoWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						
						<aon:menuItem id="duplicate"
							value="#{bundle.aon_to_duplicate}"
							rendered="#{!saleInvoice.rectifier and !saleInvoice.accountSource and saleInvoiceDetail.model.rowCount > 0}"
							immediate="#{true}"
							iconClass="aon-icon-copy"
							actionListener="#{saleInvoice.onDuplicationShow}"
							reRender="showDuplicationWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showDuplicationWindow}"
								value="#{true}" />
						</aon:menuItem>

						<rich:menuSeparator id="actionMenuSeparator" />

						<aon:if test="#{companyCollections.activeCompanyActivitiesCount > 1}">
							<aon:menuItem id="activities"
								value="#{bundle.aon_activity}"
								iconClass="aon-icon-activity"
								reRender="showActivityWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showActivityWindow}" 
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="projects"
							value="#{bundle.aon_project}"
							iconClass="aon-icon-statistics"
							reRender="showProjectWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showProjectWindow}" 
								value="#{true}" />							
							<f:setPropertyActionListener target="#{saleInvoice.showDetailProjectWindow}"
								value="#{false}" />
						</aon:menuItem>
						<aon:menuItem id="sellers"
							value="#{bundle.aon_module_commercial}"
							iconClass="aon-icon-commercial"
							reRender="showSellerWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showSellerWindow}" 
								value="#{true}" />							
							<f:setPropertyActionListener target="#{saleInvoice.showDetailSellerWindow}"
								value="#{false}" />
						</aon:menuItem>
						<aon:menuItem id="documents"
							value="#{bundle.aon_documents}"
							iconClass="aon-icon-payroll"
							actionListener="#{saleInvoiceAttach.onSearch}"
							reRender="showDocumentWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showDocumentWindow}"
								value="#{true}" />							
						</aon:menuItem>						
						<aon:menuItem id="comments"
							value="#{bundle.aon_comment}"
							iconClass="aon-icon-comments"
							reRender="showCommentsWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showCommentsWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:menuItem id="remarks"
							value="#{bundle.aon_remark}"
							iconClass="aon-icon-notes"
							reRender="showRemarksWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showRemarksWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:if test="#{aonRole.accountingOperator}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator1" />
							<aon:menuItem id="fiscalInformation"
								value="#{bundle.finance_fiscal_information}"
								iconClass="aon-icon-info"
								reRender="showFiscalInformationWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showFiscalInformationWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						<aon:if test="#{saleInvoice.tbaiLroe}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator2" />
							<aon:menuItem id="lroe"
								value="LROE"
								iconClass="aon-icon-bizkaia"
								reRender="showLroeWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showLroeWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						<aon:if test="#{saleInvoice.tbai and saleInvoice.araba}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator2" />
							<aon:menuItem id="ticket-bai-araba"
								value="Envíos TicketBAI"
								iconClass="aon-icon-araba"
								reRender="showTbaiWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showTbaiWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						<aon:if test="#{saleInvoice.tbai and saleInvoice.gipuzkoa}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator2" />
							<aon:menuItem id="ticket-bai-gipuzkoa"
								value="Envíos TicketBAI"
								iconClass="aon-icon-gipuzkoa"
								reRender="showTbaiWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showTbaiWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						<!-- 
						<aon:if test="#{saleInvoice.verifactu}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator2" />
							<aon:menuItem id="verifactu"
								value="Envíos VERI*FACTU"
								iconClass="aon-icon-aeat"
								reRender="showVerifactuWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showVerifactuWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						 -->
						<aon:if test="#{company.ediSupportEnabled}">
							<rich:menuSeparator />
							<aon:menuItem iconClass="aon-icon-file-download">
								<aon:htmlCommandLink id="saleInvoice-udapaEdi" style="font-size:1em"
									value="#{bundle.aon_edi}" target="_blank"
									title="#{bundle.webmail_download}"
									actionListener="#{saleInvoice.onExportUdapaEdiFile}">
								</aon:htmlCommandLink>
							</aon:menuItem>
							<aon:menuItem iconClass="aon-icon-file-download">
								<aon:htmlCommandLink id="saleInvoice-edi" style="font-size:1em"
									value="#{bundle.aon_edi} (CONNECT)" target="_blank"
									title="#{bundle.webmail_download}"
									actionListener="#{saleInvoice.onExportEdiFile}">
								</aon:htmlCommandLink>
							</aon:menuItem>
							<aon:menuItem id="saleInvoice-ediImport"
								value="#{bundle.aon_import} #{bundle.aon_edi}"
								iconClass="aon-icon-file-entrance"
								actionListener="#{saleInvoice.udapaImporter.onImportFileShow}"
								ajaxSingle="#{true}"
								action="salesInvoice_form">
								<f:setPropertyActionListener target="#{saleInvoice.udapaImporter.showImportFileWindow}"
									value="#{true}" />
							</aon:menuItem>
							<aon:menuItem id="ediImport-Popup"
								value="#{bundle.aon_import} #{bundle.aon_edi} (CONNECT)"
								iconClass="aon-icon-new-text"
								actionListener="#{saleInvoice.ediImporter.onImportFileShow}"
								ajaxSingle="#{true}"
								action="saleInvoice_form">
								<f:setPropertyActionListener target="#{saleInvoice.ediImporter.showImportFileWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
								
						<ui:include src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />

					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{saleInvoice.nevv}">
					<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formNewContent.xhtml">
						<ui:param name="invoiceController" value="#{saleInvoice}" />
						<ui:param name="addressController" value="#{saleInvoiceAddress}" />
						<ui:param name="detailController" value="#{saleInvoiceDetail}" />
						<ui:param name="financeController" value="#{saleInvoiceFinance}" />
						<ui:param name="formName" value="saleInvoiceForm" />
					</ui:include>
				</aon:if>			
				<aon:if test="#{!saleInvoice.nevv}">
					<!-- ************************* VERIFACTU INFO ************************* -->				
					<aon:if test="#{saleInvoice.verifactu}">
						<aon:panelGrid id="verifactuBlock" columns="5" 
						styleClass="aon-width-all aon-margin-top aon-margin-bottom"
						columnClasses="
							 aon-width-40
							,aon-width-100
							,aon-width-150
							,aon-width-auto">
							
							<aon:div styleClass="aon-icon-aeat" style="background-size: cover; background-position: center center; height: 30px;">
								<aon:outputText value="" style="padding-left: 20px;"/>
							</aon:div>
							
							<aon:div style="padding: 0px 5px; border: solid #3a85c3 0.5px; height: 30px; line-height: 30px; background-color: #3a85c3;">
								<aon:outputText value="Veri*Factu" styleClass="aon-bold" style="color: white; font-size: 1.5em;"/>
							</aon:div>
							 
							<aon:div style="padding: 0px 5px; height: 30px; line-height: 30px; text-align: center middle;">
								<aon:if test="#{saleInvoice.verifactuAccepted}">
									<aon:outputText value="#{saleInvoice.verifactuStatusDescription}"
										style="padding-left: 20px; margin-left: 5px;"
										styleClass="aon-bold aon-icon-point-green"
									/>
								</aon:if>
								<aon:if test="#{saleInvoice.verifactuAcceptedWithErrors}">
									<aon:outputText value="#{saleInvoice.verifactuStatusDescription}"
										style="padding-left: 20px; margin-left: 5px;"
										styleClass="aon-bold aon-icon-point-yellow"
									/>
								</aon:if>
								<aon:if test="#{saleInvoice.verifactuWrong}">
									<aon:outputText value="#{saleInvoice.verifactuStatusDescription}"
										style="padding-left: 20px; margin-left: 5px; color: red;"
										styleClass="aon-bold aon-icon-point-red"
									/>
								</aon:if>
								<aon:if test="#{saleInvoice.verifactuNoStatus}">
									<aon:outputText value="SIN ESTADO"
