<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="saleInvoiceForm">
			<aon:div id="menuExt">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.finance_sale_invoice_management_module}" />
					<ui:param name="controller" value="#{saleInvoice}" />
					<ui:param name="skipFocusFirst" value="#{!saleInvoice.nevv}" />
					<ui:param name="skipSaveButton" value="#{saleInvoice.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{!saleInvoice.removable or !saleInvoiceFinance.allPending}" />
					<ui:param name="saveButtonReRender" value="saleInvoiceForm" />
					<ui:param name="showMoreMenu" value="#{!saleInvoice.nevv and saleInvoiceDetail.to == null}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:if test="#{aonConfiguration.bean.invoice.showSendEmail}">
							<aon:commandButton value="&#160;" id="email"
								actionListener="#{saleInvoice.onSendInvoiceByEmail}"
								rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null}"
								styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border"
								style="width: 14px;" reRender="showNewMessageWindow">
							</aon:commandButton>
						</aon:if>
						<aon:if test="#{saleInvoice.printWord}">
							<aon:htmlCommandLink id="saleInvoice-reportWord"
								value="&#160;" target="_new" 
								rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null}"
								action="#{report.onExecute}"
								styleClass="aon-finding-toolbar-item aon-icon-word aon-finding-toolbar-item-no-border"
								actionListener="#{companySaleInvoiceFooter.onSearch}">
								<f:param name="reportKey" value="#{company.saleInvoiceTemplateValue}" />
								<f:param name="outputFormat" value="DOCX" />
							</aon:htmlCommandLink>
						</aon:if>
						<aon:htmlCommandLink id="saleInvoice-report"
							value="#{bundle.finance_invoice}" target="_new" 
							rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null}"
							action="#{saleInvoiceSigner.onReport}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf"
							actionListener="#{companySaleInvoiceFooter.onSearch}">
							<f:param name="reportKey" value="#{company.saleInvoiceTemplateValue}" />
						</aon:htmlCommandLink>
						<aon:htmlCommandLink id="saleInvoice-facturae"
							value="#{bundle.finance_facturae}" target="_blank" 
							rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null and saleInvoice.downloadFacturae}"
							action="#{saleInvoiceSigner.onDownloadFacturae}"
							styleClass="aon-finding-toolbar-item aon-icon-mail-save">
						</aon:htmlCommandLink>
						<aon:if test="#{company.ediSupportEnabled}">
							<aon:htmlCommandLink id="saleInvoice-edi"
								value="#{bundle.aon_edi}" target="_blank"
								rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null}"
								title="#{bundle.webmail_download}"
								disabled="#{empty saleInvoice.to.registryAddress.id}"
								actionListener="#{saleInvoice.onExportEdiFile}"
								onclick="if (#{empty saleInvoice.to.registryAddress.id}){ alert('No se puede continuar sin cumplimentar la direccion.'); return false;}"
								styleClass="aon-finding-toolbar-item aon-icon-file-download">
							</aon:htmlCommandLink>
							<aon:commandButton id="saleInvoice-ediImport"
								value="#{bundle.aon_import} #{bundle.aon_edi}"
								styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
								actionListener="#{saleInvoice.udapaImporter.onImportFileShow}"
								ajaxSingle="#{true}"
								action="salesInvoice_form">
								<f:setPropertyActionListener target="#{saleInvoice.udapaImporter.showImportFileWindow}"
									value="#{true}" />
							</aon:commandButton>
						</aon:if>
					</ui:define>
					<ui:define name="moreMenuContent">
						<aon:if test="#{aonConfiguration.bean.invoice.showWarehouseData}">
							<aon:menuItem id="deliveryTransfer"
								value="#{bundle.config_series_deliveries}"
								immediate="#{true}" rendered="#{!saleInvoice.readOnly}"
								iconClass="aon-icon-sincronize"
								actionListener="#{saleInvoice.onDeliveryTransferShow}"
								reRender="showDeliveryTransferWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showDeliveryTransferWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							rendered="#{saleInvoice.toInvoiceTotalPrice != 0 and (!saleInvoice.recorded or saleInvoiceFinance.allPending)}"
							iconClass="aon-icon-tree"
							actionListener="#{saleInvoice.onGenerateFinances}"
							accesskey="#{bundle.aon_key_finance}">
							<f:setPropertyActionListener target="#{saleInvoice.backActionListener}"
								value="#{null}" />
							<f:setPropertyActionListener target="#{saleInvoice.backAction}"
								value="#{null}" />
						</aon:menuItem>
						<aon:menuItem id="rectify"
							value="#{bundle.finance_rectify}"
							rendered="#{!saleInvoice.rectifier and !saleInvoice.accountSource and saleInvoiceDetail.model.rowCount > 0}"
							iconClass="aon-icon-version"
							actionListener="#{saleInvoice.onRectificationShow}"
							reRender="showRectificationWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showRectificationWindow}"
								value="#{true}" />
						</aon:menuItem>
						<aon:if test="#{aonRole.accountingOperator}">
							<aon:menuItem id="record"
								value="#{bundle.finance_record}"
								actionListener="#{saleInvoice.onRecordInvoice}"
								rendered="#{!saleInvoice.recorded and saleInvoiceDetail.model.rowCount > 0}"
								iconClass="aon-icon-task-assume"
								reRender="saleInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>
						<aon:if test="#{aonRole.accountingManager}">
							<aon:menuItem id="unrecord"
								value="#{bundle.finance_unrecord}"
								actionListener="#{saleInvoice.onUnrecordInvoice}"
								rendered="#{saleInvoice.recorded and !saleInvoice.accountSource}"
								iconClass="aon-icon-task-liberate"
								reRender="saleInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signMenuItem.xhtml">
							<ui:param name="signController" value="#{saleInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{saleInvoice.signed or !certificate.signable}" />
							<ui:param name="skipCancelSignButton" value="#{!saleInvoice.signed}" />
							<ui:param name="signButtonReRender" value="saleInvoiceForm" />
						</ui:include>
						
						<rich:menuSeparator id="actionMenuSeparator" />
						
						<aon:if test="#{companyCollections.activeCompanyActivitiesCount > 1}">
							<aon:menuItem id="activities"
								value="#{bundle.aon_activity}"
								iconClass="aon-icon-activity"
								reRender="showActivityWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showActivityWindow}" 
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="projects"
							value="#{bundle.aon_project}"
							iconClass="aon-icon-statistics"
							reRender="showProjectWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showProjectWindow}" 
								value="#{true}" />							
							<f:setPropertyActionListener target="#{saleInvoice.showDetailProjectWindow}"
								value="#{false}" />
						</aon:menuItem>
						<aon:menuItem id="sellers"
							value="#{bundle.aon_module_commercial}"
							iconClass="aon-icon-commercial"
							reRender="showSellerWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showSellerWindow}" 
								value="#{true}" />							
							<f:setPropertyActionListener target="#{saleInvoice.showDetailSellerWindow}"
								value="#{false}" />
						</aon:menuItem>
						<aon:menuItem id="documents"
							value="#{bundle.aon_documents}"
							iconClass="aon-icon-payroll"
							actionListener="#{saleInvoiceAttach.onSearch}"
							reRender="showDocumentWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showDocumentWindow}"
								value="#{true}" />							
						</aon:menuItem>						
						<aon:menuItem id="comments"
							value="#{bundle.aon_comment}"
							iconClass="aon-icon-comments"
							reRender="showCommentsWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showCommentsWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:menuItem id="remarks"
							value="#{bundle.aon_remark}"
							iconClass="aon-icon-notes"
							reRender="showRemarksWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showRemarksWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:if test="#{aonRole.accountingOperator}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator1" />
							<aon:menuItem id="fiscalInformation"
								value="#{bundle.finance_fiscal_information}"
								iconClass="aon-icon-info"
								reRender="showFiscalInformationWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showFiscalInformationWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
								
						<ui:include src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />

					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{saleInvoice.nevv}">
					<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formNewContent.xhtml">
						<ui:param name="invoiceController" value="#{saleInvoice}" />
						<ui:param name="addressController" value="#{saleInvoiceAddress}" />
						<ui:param name="detailController" value="#{saleInvoiceDetail}" />
						<ui:param name="financeController" value="#{saleInvoiceFinance}" />
						<ui:param name="formName" value="saleInvoiceForm" />
					</ui:include>
				</aon:if>			
				<aon:if test="#{!saleInvoice.nevv}">
					<aon:panelGrid id="dataTable" columns="4"
						styleClass="aon-width-all aon-margin-bottom"
						columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-500,
							aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">

						<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formBasicContent.xhtml">
							<ui:param name="invoiceController" value="#{saleInvoice}" />
							<ui:param name="addressController" value="#{saleInvoiceAddress}" />
							<ui:param name="detailController" value="#{saleInvoiceDetail}" />
							<ui:param name="financeController" value="#{saleInvoiceFinance}" />
							<ui:param name="formName" value="saleInvoiceForm" />
						</ui:include>
					</aon:panelGrid>

					<aon:div styleClass="aon-margin-top">
						<aon:panelGrid columns="2" styleClass="aon-width-all"
							columnClasses="aon-panelGrid-odd aon-width-140,
								aon-panelGrid-even aon-width-auto">

							<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formCommonContent.xhtml">
								<ui:param name="invoiceController" value="#{saleInvoice}" />
								<ui:param name="addressController" value="#{saleInvoiceAddress}" />
								<ui:param name="detailController" value="#{saleInvoiceDetail}" />
								<ui:param name="financeController" value="#{saleInvoiceFinance}" />
								<ui:param name="formName" value="saleInvoiceForm" />
							</ui:include>

						</aon:panelGrid>
					</aon:div>
				</aon:if>

				<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formDetail.xhtml">
					<ui:param name="invoiceController" value="#{saleInvoice}" />
					<ui:param name="detailController" value="#{saleInvoiceDetail}" />
					<aon:if test="#{!aonConfiguration.bean.invoice.showTasData}">
						<ui:param name="projectLabel" value="#{bundle.aon_project}" />
					</aon:if>
					<aon:if test="#{aonConfiguration.bean.invoice.showTasData}">
						<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
					</aon:if>
				</ui:include>

				<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formFinance.xhtml">
					<ui:param name="invoiceController" value="#{saleInvoice}" />
					<ui:param name="detailController" value="#{saleInvoiceDetail}" />
					<ui:param name="financeController" value="#{saleInvoiceFinance}" />
				</ui:include>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAddress.xhtml">
			<ui:param name="invoiceController" value="#{saleInvoice}" />
			<ui:param name="invoiceAddress" value="#{saleInvoiceAddress}" />
			<ui:param name="addressReRender" value="InvoiceAddress" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalActivity.xhtml">
			<ui:param name="invoiceController" value="#{saleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/project/facelet/project/modalProject.xhtml">
			<ui:param name="controller" value="#{saleInvoice}" />
			<ui:param name="parentReRender" value="saleInvoiceForm" />
			<aon:methodParam name="parentActionListener" value="#{saleInvoice.addInvoiceProject}" type="actionListener" />
			<ui:param name="parentValue" value="#{saleInvoice.to.project}" />
			<ui:param name="detailReRender" value="invoiceDetails" />
			<aon:methodParam name="detailActionListener" value="#{saleInvoiceDetail.onInvoiceDetailSave}" type="actionListener" />
			<ui:param name="detailValue" value="#{saleInvoiceDetail.invoiceDetail.project}" />
			<aon:if test="#{!aonConfiguration.bean.invoice.showTasData}">
				<ui:param name="projectLabel" value="#{bundle.aon_project}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.invoice.showTasData}">
				<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
			</aon:if>
		</ui:include>
		<ui:include src="/com/code/aon/ui/seller/facelet/seller/modalSeller.xhtml">
			<ui:param name="controller" value="#{saleInvoice}" />
			<ui:param name="parentReRender" value="saleInvoiceForm" />
			<aon:methodParam name="parentActionListener" value="#{saleInvoice.addInvoiceSeller}" type="actionListener" />
			<ui:param name="parentValue" value="#{saleInvoice.to.seller}" />
			<ui:param name="detailReRender" value="invoiceDetails" />
			<aon:methodParam name="detailActionListener" value="#{saleInvoiceDetail.onInvoiceDetailSave}" type="actionListener" />
			<ui:param name="detailValue" value="#{saleInvoiceDetail.invoiceDetail.seller}" />
			<ui:param name="sellerLabel" value="#{bundle.aon_module_commercial}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalRectification.xhtml">
			<ui:param name="invoiceController" value="#{saleInvoice}" />
			<ui:param name="financeController" value="#{saleInvoiceFinance}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalDocuments.xhtml">
			<ui:param name="invoiceController" value="#{saleInvoice}" />
			<ui:param name="attachmentController" value="#{saleInvoiceAttach}" />
		</ui:include>
		<aon:if test="#{aonConfiguration.bean.invoice.showWarehouseData}">
			<ui:include src="/com/code/aon/ui/finance/facelet/saleInvoice/delivery/modalTransfer.xhtml" />
			<ui:include src="/com/code/aon/ui/finance/facelet/saleInvoice/delivery/modalFilter.xhtml" />
		</aon:if>
		<aon:if test="#{aonConfiguration.bean.invoice.showSendEmail}">
			<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		</aon:if>
		<ui:include src="/com/code/aon/ui/sign/facelet/signer/modal.xhtml" >
			<ui:param name="signButtonreRender" value="saleInvoiceForm" />
			<aon:methodParam name="signActionListener" value="#{saleInvoiceSigner.onSign}" type="actionListener" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalComments.xhtml">
			<ui:param name="invoiceController" value="#{saleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalRemarks.xhtml">
			<ui:param name="invoiceController" value="#{saleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{saleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalFiscalInfo.xhtml">
			<ui:param name="invoiceController" value="#{saleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
			<ui:param name="bankAccountController" value="#{saleInvoiceFinance.accountHelper}" />
			<ui:param name="modalReRender" value="financeContainer" />
		</ui:include>				
		<ui:include src="/com/code/aon/ui/product/facelet/product/item/modalPackage.xhtml">
			<ui:param name="controller" value="#{saleInvoiceDetail}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/saleInvoice/modalImport.xhtml" />
		<aon:if test="#{company.ediSupportEnabled}">
			<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
				<ui:param name="logPanelTitle" value="#{bundle.aon_import} #{bundle.aon_edi}" />
				<ui:param name="closeButtonReRender" value="saleInvoiceForm" />
				<aon:valueParam name="pollInterval" value="3000" />
				<aon:methodParam name="closeLogPanelAtionListener"
					default="#{saleInvoice.udapaImporter.onImportFileHide}" type="actionListener" />
			</ui:include>
		</aon:if>
	</ui:define>
</ui:composition>
