<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="saleInvoiceForm">
			<aon:div id="menuExt">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.finance_sale_invoice_management_module}" />
					<ui:param name="controller" value="#{saleInvoice}" />
					<ui:param name="skipFocusFirst" value="#{!saleInvoice.new}" />
					<ui:param name="skipSaveButton" value="#{saleInvoice.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{!saleInvoice.removable or !saleInvoiceFinance.allPending}" />
					<ui:param name="saveButtonReRender" value="saleInvoiceForm" />
					<ui:param name="showMoreMenu" value="#{!saleInvoice.new and saleInvoiceDetail.to == null}" />
					<ui:define name="beforeSpinToolbarContent">
						<c:if test="#{aonConfiguration.bean.invoice.showSendEmail}">
							<aon:commandButton value="&#160;" id="email"
								actionListener="#{saleInvoice.onSendInvoiceByEmail}"
								rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null}"
								styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border"
								style="width: 14px;" reRender="showNewMessageWindow">
							</aon:commandButton>
						</c:if>
						<aon:htmlCommandLink id="saleInvoice-report"
							value="#{bundle.finance_invoice}" target="_new" 
							rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null}"
							action="#{saleInvoiceSigner.onReport}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf"
							actionListener="#{companySaleInvoiceFooter.onSearch}">
							<f:param name="reportKey" value="#{company.saleInvoiceTemplateValue}" />
							<f:setPropertyActionListener target="#{saleInvoiceSigner.reportKey}"
								value="#{company.saleInvoiceTemplateValue}" />
						</aon:htmlCommandLink>
					</ui:define>
					<ui:define name="moreMenuContent">
						<c:if test="#{aonConfiguration.bean.invoice.showWarehouseData}">
							<aon:menuItem id="deliveryTransfer"
								value="#{bundle.config_series_deliveries}"
								immediate="#{true}" rendered="#{!saleInvoice.readOnly}"
								iconClass="aon-icon-sincronize"
								actionListener="#{saleInvoice.onDeliveryTransferShow}"
								reRender="showDeliveryTransferWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showDeliveryTransferWindow}"
									value="#{true}" />
							</aon:menuItem>
						</c:if>
						<aon:menuItem id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							rendered="#{saleInvoice.toInvoiceTotalPrice != 0 and (!saleInvoice.recorded or saleInvoiceFinance.model.rowCount == 0)}"
							iconClass="aon-icon-tree"
							actionListener="#{saleInvoice.generateFinances}"
							accesskey="#{bundle.aon_key_finance}">
							<f:setPropertyActionListener target="#{saleInvoice.backActionListener}"
								value="#{null}" />
							<f:setPropertyActionListener target="#{saleInvoice.backAction}"
								value="#{null}" />
						</aon:menuItem>
						<aon:menuItem id="rectify"
							value="#{bundle.finance_rectify}"
							rendered="#{!saleInvoice.rectifier and !saleInvoice.accountSource and saleInvoiceDetail.model.rowCount > 0}"
							iconClass="aon-icon-version"
							actionListener="#{saleInvoice.onRectificationShow}"
							reRender="showRectificationWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showRectificationWindow}"
								value="#{true}" />
						</aon:menuItem>
						<c:if test="#{aonRole.accountingOperator}">
							<aon:menuItem id="record"
								value="#{bundle.finance_record}"
								actionListener="#{saleInvoice.onRecordInvoice}"
								rendered="#{!saleInvoice.recorded and saleInvoiceDetail.model.rowCount > 0}"
								iconClass="aon-icon-task-assume"
								reRender="saleInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</c:if>
						<c:if test="#{aonRole.accountingManager}">
							<aon:menuItem id="unrecord"
								value="#{bundle.finance_unrecord}"
								actionListener="#{saleInvoice.onUnrecordInvoice}"
								rendered="#{saleInvoice.recorded and !saleInvoice.accountSource}"
								iconClass="aon-icon-task-liberate"
								reRender="saleInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</c:if>
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signMenuItem.xhtml">
							<ui:param name="signController" value="#{saleInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{saleInvoice.signed or !certificate.signable}" />
							<ui:param name="skipCancelSignButton" value="#{!saleInvoice.signed}" />
							<ui:param name="signButtonReRender" value="saleInvoiceForm" />
						</ui:include>
						
						<rich:menuSeparator id="actionMenuSeparator" />
						
						<aon:menuItem id="newProject-button"
							value="#{(projectButtonLabel!=null)?(projectButtonLabel):(bundle.aon_project)}"
							iconClass="aon-icon-statistics"
							reRender="showNewProjectWindow"
							actionListener="#{project.onReset}">
							<f:setPropertyActionListener target="#{saleInvoice.showNewProjectWindow}" 
								value="#{true}" />							
							<f:setPropertyActionListener target="#{project.to.registry}" 
								value="#{saleInvoice.to.registry}" />							
						</aon:menuItem>
						<aon:menuItem id="documents"
							value="#{bundle.aon_documents}"
							iconClass="aon-icon-payroll"
							reRender="showDocumentWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showDocumentWindow}"
								value="#{true}" />							
						</aon:menuItem>						
						<aon:menuItem id="comments"
							value="#{bundle.aon_comment}"
							iconClass="aon-icon-notes"
							reRender="showCommentsWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showCommentsWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:menuItem id="remarks"
							value="#{bundle.aon_remark}"
							iconClass="aon-icon-notes"
							reRender="showRemarksWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showRemarksWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<c:if test="#{aonRole.accountingOperator}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator1" />
							<aon:menuItem id="fiscalInformation"
								value="#{bundle.finance_fiscal_information}"
								iconClass="aon-icon-info"
								reRender="showFiscalInformationWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showFiscalInformationWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</c:if>
								
						<rich:menuSeparator id="invoiceAddsMenuSeparator" />

						<aon:menuItem id="audit-info"
							value="#{bundle.aon_audit}"
							iconClass="aon-icon-audit"
							reRender="showAuditInfoWindow">
							<f:setPropertyActionListener target="#{saleInvoice.showAuditInfoWindow}"
								value="#{true}" />							
						</aon:menuItem>		
					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4"
					styleClass="aon-width-all aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Invoice_number"
						value="#{bundle.aon_invoice_number}" />
					<aon:div>
						<aon:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<aon:div id="InvoiceReferenceCodeDiv">
								<aon:selectOneMenu id="Invoice_series"
									value="#{saleInvoice.to.series}" 
									rendered="#{saleInvoice.seriesValid and !saleInvoice.readOnly and saleInvoiceFinance.model.rowCount == 0}"
									valueChangeListener="#{saleInvoice.onSeriesChanged}"
									reRender="Invoice_number,Invoice_securityLevel">
									<f:selectItem itemLabel=" " value="#{null}" />
									<f:selectItems value="#{saleInvoice.rectifier ? configCollections.rectificationSeriesIds : configCollections.invoiceSeriesIds}" />
								</aon:selectOneMenu>
								<aon:inputText id="Invoice_series-input"
									value="#{saleInvoice.to.series}" 
									rendered="#{!saleInvoice.seriesValid and !saleInvoice.readOnly and saleInvoiceFinance.model.rowCount == 0}"
									size="5" />
								<aon:inputText id="Invoice_number" styleClass="aon-margin-left"
									value="#{saleInvoice.to.number}" 
									rendered="#{!saleInvoice.readOnly and saleInvoiceFinance.model.rowCount == 0}"
									required="true" size="7" />
								<aon:commandButton value="&#160;"
									title="#{bundle.finance_invoice_find_next_number}"
									styleClass="aon-finding-toolbar-item aon-icon-ambito aon-finding-toolbar-item-no-border"
		 							style="aon-margin-left aon-margin-right" 
									rendered="#{!saleInvoice.readOnly and saleInvoiceFinance.model.rowCount == 0}"
									actionListener="#{saleInvoice.onFindNextFreeNumber}"
									reRender="Invoice_number" ajaxSingle="true" process="Invoice_number">
								</aon:commandButton>															
								<aon:outputText styleClass="aon-bold aon-margin-right"
									value="#{saleInvoice.to.referenceCode}"
									rendered="#{saleInvoice.readOnly or saleInvoiceFinance.model.rowCount > 0}" />
							</aon:div>
							<aon:div>
								<c:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Invoice_securityLevel"
										value="#{saleInvoice.to.confidential}"
										rendered="#{!saleInvoice.readOnly and saleInvoiceFinance.allPending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{!saleInvoice.readOnly and saleInvoiceFinance.allPending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{(saleInvoice.readOnly or !saleInvoiceFinance.allPending) and saleInvoice.to.confidential}" />
								</c:if>

								<c:if test="#{company.EInvoice}">
									<aon:outputText value="&#160;"
										rendered="#{!saleInvoice.new and saleInvoice.to.signed}"
										title="#{bundle.sign_signed}"
										styleClass="aon-icon aon-icon-signed" />
								</c:if>						

								<aon:outputText value="#{saleInvoice.to.status}" rendered="#{saleInvoice.recorded}"/>
								<c:if test="#{aonRole.accountingOperator and saleInvoice.recorded and saleInvoice.backAction != 'accountEntry_form'}">
									<aon:commandLink immediate="true"
											styleClass="aon-button-goto"
											style="margin-left: 5px; padding-left: 17px;" 
											actionListener="#{saleInvoice.onViewAccountEntry}" 
											action="accountEntry_form"
											title="#{bundle.account_account_entry}: #{saleInvoice.accountEntryId}"
											alt="#{bundle.account_account_entry}: #{saleInvoice.accountEntryId}" />
								</c:if>
							</aon:div>
						</aon:panelGrid>
					</aon:div>

					<aon:outputLabel for="Invoice_issueDate"
						value="#{bundle.aon_date}" />
					<aon:div>
						<aon:selectInputDate id="Invoice_issueDate"
							value="#{saleInvoice.to.issueDate}" required="true"
							disabled="#{saleInvoice.readOnly}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support ajaxSingle="true" event="oninputchange"
								actionListener="#{saleInvoice.onDateChanged}"
								reRender="Invoice_taxDate" />
							<a4j:support ajaxSingle="true" event="onchanged"
								actionListener="#{saleInvoice.onDateChanged}"
								reRender="Invoice_taxDate" />
						</aon:selectInputDate>
					</aon:div>

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{saleInvoice.to.registry}" />
						<ui:param name="lookupForRegistry" value="#{true}" />
						<ui:param name="lookupInputNameValue" value="#{saleInvoice.to.registryName}" />
						<ui:param name="lookupDisabled" value="#{saleInvoice.registryReadOnly or !saleInvoiceFinance.allPending}" />
						<ui:param name="lookupInputNameDisabled" value="#{saleInvoice.readOnly or !saleInvoiceFinance.allPending}" />
						<ui:param name="lookupReRender" value="Customer_lookup_document,InvoiceAddress,InvoiceProject" />
						<ui:param name="idRequired" value="#{true}" />						
						<ui:param name="skipSuggestText" 
							value="#{saleInvoice.to.registry != null and saleInvoice.to.registry.id != null}" />
						<aon:methodParam name="lookupChangeListener"
							value="#{saleInvoice.onCustomerChanged}" type="lookupChangeListener" />
					</ui:include>
					
					<aon:outputLabel for="Invoice_taxDate" 
						value="#{bundle.finance_tax_date}" />
					<c:if test="#{aonRole.accountingOperator}">
						<aon:selectInputDate id="Invoice_taxDate"
							value="#{saleInvoice.to.taxDate}" required="true" 
							disabled="#{saleInvoice.readOnly}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"
							inputStyle="#{saleInvoice.taxDateEquals?'':'background-color: #ff865e;'}">
							<a4j:support ajaxSingle="true" event="oninputchange"
								reRender="Invoice_taxDate" />
							<a4j:support ajaxSingle="true" event="onchanged"
								reRender="Invoice_taxDate" />
						</aon:selectInputDate>
					</c:if>
					<c:if test="#{!aonRole.accountingOperator}">
						<aon:outputText value="#{saleInvoice.to.taxDate}" />
					</c:if>

					<aon:outputLabel for="Customer_registry_document"
						value="#{bundle.aon_company_document}" />
					<aon:panelGroup id="Customer_lookup_document">
						<aon:selectOneMenu id="Customer_registry_document_type"
							disabled="#{saleInvoice.readOnly}" 
							value="#{saleInvoice.to.registryDocumentType}" 
							reRender="Customer_document_icon">
							<f:selectItems value="#{registryCollections.documentTypes}" />
						</aon:selectOneMenu>
						<aon:outputText styleClass="aon-margin-left aon-italic"
							value="#{bundle.aon_country}" />
						<aon:selectOneMenu id="Customer_registry_document_country"
							styleClass="aon-margin-left" disabled="#{saleInvoice.readOnly}"
							value="#{saleInvoice.to.registryDocumentCountry}"
							reRender="Customer_document_icon">
							<f:selectItems value="#{commonCollections.countryCodes}" />
						</aon:selectOneMenu>
						<aon:inputText id="Customer_registry_document" 
							style="margin-left: 3px;" disabled="#{saleInvoice.readOnly}"
							value="#{saleInvoice.to.registryDocument}" size="16" maxlength="16"
							reRender="Customer_document_icon" 
							onblur="toUpperCase(this);">
							<f:validateLength minimum="1" maximum="16" />
 						</aon:inputText>
						<aon:panelGroup id="Customer_document_icon">
							<aon:outputText 
								rendered="#{!saleInvoice.to.registryDocumentValidable}"
								styleClass="aon-icon-question"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{saleInvoice.to.registryDocumentValidable and saleInvoice.to.validRegistryDocument}"
								styleClass="aon-icon-predetermine"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{saleInvoice.to.registryDocumentValidable and !saleInvoice.to.validRegistryDocument}"
								styleClass="aon-icon-exception"
								style="padding-left: 15px;"
								value="&#160;" />
	 					</aon:panelGroup>
 					</aon:panelGroup>
 					
 					<aon:outputLabel value="#{bundle.aon_document_number}" />
					<aon:outputText styleClass="aon-bold"
						value="#{saleInvoice.to.documentNumber}" />

					<aon:outputLabel for="Invoice_registryAddress_id"
						value="#{bundle.aon_address}" />
					<aon:div id="InvoiceAddress">
						<aon:selectOneMenu id="Invoice_registryAddress_id"
							rendered="#{!saleInvoice.readOnly and saleInvoiceAddress.to.id == null and saleInvoice.addressCount > 0}"
							value="#{saleInvoice.to.registryAddress}">
							<f:selectItems value="#{saleInvoice.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel styleClass="aon-italic"
							value="#{bundle.registry_no_address_available}"
							rendered="#{saleInvoiceAddress.to.id == null and ((saleInvoice.readOnly and saleInvoice.to.registryAddress.id == null) or (!saleInvoice.readOnly and saleInvoice.addressCount == 0))}" />
						<aon:outputText styleClass="aon-bold"
							value="#{saleInvoice.address}" 
							rendered="#{saleInvoiceAddress.to.id != null or (saleInvoice.readOnly and saleInvoice.to.registryAddress.id != null)}">
							<aon:abbreviateConverter maxWidth="30" />
						</aon:outputText>
						<aon:outputText styleClass="aon-margin-left aon-bold"
							value="#{saleInvoice.location}"
							rendered="#{saleInvoiceAddress.to.id != null or (saleInvoice.readOnly and saleInvoice.to.registryAddress.id != null)}">
							<aon:abbreviateConverter maxWidth="25" />
						</aon:outputText>
						<aon:div layout="inline" styleClass="aon-margin-left">
							<aon:commandButton id="invoiceAddressButton"
								value="#{bundle.registry_address_other}"
								styleClass="aon-icon-commandButton aon-icon-go aon-bold aon-italic"
								rendered="#{!saleInvoice.new and !saleInvoice.readOnly}"
								actionListener="#{saleInvoice.onInvoiceAddressShow}"
								reRender="showInvoiceAddressWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showInvoiceAddressWindow}"
									value="#{true}" />								
							</aon:commandButton>
						</aon:div>
					</aon:div>

					<aon:outputLabel for="Invoice_total" 
						value="#{bundle.aon_total}" />
					<aon:div>
						<aon:outputText id="Invoice_total" styleClass="aon-bold"
							value="#{saleInvoice.toInvoiceTotalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputLabel styleClass="aon-margin-left aon-italic"
							value="(#{bundle.aon_tax_included})" />
					</aon:div>
				</aon:panelGrid>

				<aon:div id="InvoiceProject">
					<aon:panelGrid columns="2" style="width: 100%;"
						rendered="#{saleInvoice.to.project.id != null or saleInvoice.to.registry.id != null}"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto">

						<c:if test="#{!aonConfiguration.bean.invoice.showTasData}">
							<aon:outputLabel for="Invoice_project_id"
								value="#{bundle.aon_project}" />
						</c:if>
						<c:if test="#{aonConfiguration.bean.invoice.showTasData}">
							<aon:outputLabel for="Invoice_project_id"
								value="#{bundle.tas_project_tas}" />
						</c:if>
						<aon:div>
							<ui:include src="/com/code/aon/ui/project/facelet/project/lookup.xhtml" >
								<ui:param name="lookupTo" value="#{saleInvoice.to.project}" />
								<ui:param name="lookupRendered" value="#{!saleInvoice.readOnly}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="skipGoToButton" value="#{true}" />
							</ui:include>
							<c:if test="#{!aonConfiguration.bean.invoice.showTasData}">
								<aon:outputLabel styleClass="aon-italic"
									value="#{bundle.project_no_project_linked}"
									rendered="#{saleInvoice.readOnly and saleInvoice.to.project.id == null and saleInvoice.projectCount > 0}" />
							</c:if>
							<c:if test="#{aonConfiguration.bean.invoice.showTasData}">
								<aon:outputLabel styleClass="aon-italic"
									value="#{bundle.tas_no_projectTas_linked}"
									rendered="#{saleInvoice.readOnly and saleInvoice.to.project.id == null and saleInvoice.projectCount > 0}" />
							</c:if>
							<aon:outputText styleClass="aon-bold"
								value="#{saleInvoice.to.project.name}" 
								rendered="#{saleInvoice.readOnly and saleInvoice.to.project.id != null}" />
						</aon:div>

					</aon:panelGrid>
				</aon:div>

				<aon:panelGrid columns="4" style="width: 100%;"
					rendered="#{saleInvoice.to.seller.id != null or saleInvoice.to.posShift.id != null}"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml">
						<ui:param name="lookupTo" value="#{saleInvoice.to.seller}" />
						<ui:param name="lookupDisabled" value="#{saleInvoice.readOnly}" />
						<aon:methodParam name="lookupChangeListener"
							value="#{saleInvoice.onSellerChanged}" type="lookupChangeListener" />
					</ui:include>

					<aon:outputLabel value="#{bundle.aon_module_pos}" />
					<aon:div styleClass="aon-bold">
						<aon:outputText value="#{saleInvoice.to.posShift.pos.name}" />
						<c:if test="#{companyCollections.currentUserWorkPlacesCount > 1}">
							<aon:outputText value=" (#{saleInvoice.to.posShift.pos.workPlace.description})" />
						</c:if>
					</aon:div>

				</aon:panelGrid>

				<aon:panelGrid columns="2" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-auto">

					<aon:div rendered="#{!empty saleInvoice.to.comments or saleInvoice.to.vatAccrualPayment or saleInvoice.rectifier or saleInvoice.rectified}">
						<aon:outputLabel for="Invoice_comments"
							value="#{bundle.aon_comment}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_comment_description})" />
						</aon:div>
					</aon:div>
					<aon:div rendered="#{!empty saleInvoice.to.comments or saleInvoice.to.vatAccrualPayment or saleInvoice.rectifier or saleInvoice.rectified}">
						<aon:inputTextarea id="Invoice_comments" cols="145" rows="2"
							value="#{saleInvoice.to.comments}"
							rendered="#{!empty saleInvoice.to.comments}"
