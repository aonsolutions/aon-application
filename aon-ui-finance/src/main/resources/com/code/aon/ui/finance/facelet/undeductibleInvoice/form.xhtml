<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="undeductibleInvoiceForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{financeBundle.finance_undeductible_invoice_management_module}" />
					<ui:param name="controller" value="#{undeductibleInvoice}" />
					<ui:param name="skipFocusFirst" value="#{!undeductibleInvoice.new}" />
					<ui:param name="skipSaveButton" value="#{undeductibleInvoice.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{!undeductibleInvoice.removable or !undeductibleInvoiceFinance.allPending}" />
					<ui:param name="saveButtonReRender" value="undeductibleInvoiceForm" />
					<ui:param name="showMoreMenu" value="#{!undeductibleInvoice.new and undeductibleInvoiceDetail.to == null}" />
					<ui:define name="moreMenuContent">					
						<aon:menuItem id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							actionListener="#{undeductibleInvoice.generateFinances}"
							rendered="#{undeductibleInvoice.toInvoiceTotalPrice != 0 and (!undeductibleInvoice.recorded or undeductibleInvoiceFinance.model.rowCount == 0)}"
							iconClass="aon-icon-tree"
							accesskey="#{bundle.aon_key_finance}">
							<f:setPropertyActionListener target="#{undeductibleInvoice.backActionListener}"
								value="#{null}" />
							<f:setPropertyActionListener target="#{undeductibleInvoice.backAction}"
								value="#{null}" />
						</aon:menuItem>
						<c:if test="#{aonRole.accountingOperator}">
							<aon:menuItem id="record"
								value="#{financeBundle.finance_record}"
								actionListener="#{undeductibleInvoice.onRecordInvoice}"
								rendered="#{!undeductibleInvoice.recorded and undeductibleInvoiceDetail.model.rowCount > 0}"
								iconClass="aon-icon-task-assume"
								reRender="undeductibleInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</c:if>
						<c:if test="#{aonRole.accountingManager}">
							<aon:menuItem id="unrecord"
								value="#{financeBundle.finance_unrecord}"
								actionListener="#{undeductibleInvoice.onUnrecordInvoice}"
								rendered="#{undeductibleInvoice.recorded and !undeductibleInvoice.accountSource}"
								iconClass="aon-icon-task-liberate"
								reRender="undeductibleInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</c:if>
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signMenuItem.xhtml">
							<ui:param name="signController" value="#{undeductibleInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{undeductibleInvoice.signed or !certificate.signable or !undeductibleInvoice.attachmentAvailable}" />
							<ui:param name="skipCancelSignButton" value="#{!undeductibleInvoice.signed or !undeductibleInvoice.attachmentAvailable}" />
							<ui:param name="signButtonReRender" value="undeductibleInvoiceForm" />
						</ui:include>
						
						<rich:menuSeparator id="actionMenuSeparator" />
						
						<aon:menuItem id="newProject-button"
							value="#{(projectButtonLabel!=null)?(projectButtonLabel):(bundle.aon_project)}"
							iconClass="aon-icon-statistics"
							reRender="showNewProjectWindow"
							actionListener="#{project.onReset}">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showNewProjectWindow}" 
								value="#{true}" />							
							<f:setPropertyActionListener target="#{project.to.registry}" 
								value="#{undeductibleInvoice.to.registry}" />							
						</aon:menuItem>
						<aon:menuItem id="documents"
							value="#{bundle.aon_documents}"
							iconClass="aon-icon-payroll"
							reRender="showDocumentWindow">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showDocumentWindow}"
								value="#{true}" />							
						</aon:menuItem>						
						<aon:menuItem id="comments"
							value="#{bundle.aon_comment}"
							iconClass="aon-icon-notes"
							reRender="showCommentsWindow">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showCommentsWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:menuItem id="remarks"
							value="#{bundle.aon_remark}"
							iconClass="aon-icon-notes"
							reRender="showRemarksWindow">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showRemarksWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<c:if test="#{aonRole.accountingOperator}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator1" />
							<aon:menuItem id="fiscalInformation"
								value="#{financeBundle.finance_fiscal_information}"
								iconClass="aon-icon-info"
								reRender="showFiscalInformationWindow">
								<f:setPropertyActionListener target="#{undeductibleInvoice.showFiscalInformationWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</c:if>

						<rich:menuSeparator id="invoiceAddsMenuSeparator" />

						<aon:menuItem id="audit-info"
							value="#{bundle.aon_audit}"
							iconClass="aon-icon-audit"
							reRender="showAuditInfoWindow">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showAuditInfoWindow}"
								value="#{true}" />							
						</aon:menuItem>	
					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4"
					styleClass="aon-width-all aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Invoice_referenceCode"
						value="#{bundle.aon_invoice_number}" />
					<aon:div>
						<aon:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<aon:div id="InvoiceReferenceCodeDiv">
								<aon:inputText id="Invoice_referenceCode" 
									value="#{undeductibleInvoice.to.referenceCode}" required="true"
									size="25" maxlength="32"
									rendered="#{!undeductibleInvoice.readOnly and undeductibleInvoiceFinance.allPending}" 
									valueChangeListener="#{undeductibleInvoice.onReferenceCodeChanged}"
									reRender="InvoiceReferenceCodeDiv" ajaxSingle="true" />
								<aon:outputText styleClass="aon-bold"
									value="#{undeductibleInvoice.to.referenceCode}"
									rendered="#{undeductibleInvoice.readOnly or !undeductibleInvoiceFinance.allPending}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox id="Invoice_investment"
									value="#{undeductibleInvoice.to.investment}" 
									rendered="#{!undeductibleInvoice.readOnly}" />
								<aon:outputLabel for="Invoice_investment" styleClass="aon-italic aon-margin-right"
									value="#{bundle.invoice_investment}"
									rendered="#{!undeductibleInvoice.readOnly or undeductibleInvoice.to.investment}" />

								<c:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Invoice_securityLevel"
										value="#{undeductibleInvoice.to.confidential}"
										rendered="#{!undeductibleInvoice.readOnly and undeductibleInvoiceFinance.allPending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{!undeductibleInvoice.readOnly and undeductibleInvoiceFinance.allPending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{(undeductibleInvoice.readOnly or !undeductibleInvoiceFinance.allPending) and undeductibleInvoice.to.confidential}" />
								</c:if>

								<c:if test="#{company.EInvoice}">
									<aon:outputText value="&#160;"
										rendered="#{!undeductibleInvoice.new and undeductibleInvoice.to.signed}"
										title="#{signBundle.sign_signed}"
										styleClass="aon-icon aon-icon-signed" />
								</c:if>						

								<aon:outputText value="#{undeductibleInvoice.to.status}" />
								<c:if test="#{aonRole.accountingOperator and undeductibleInvoice.recorded}">
									<aon:outputText styleClass="aon-italic aon-margin-left"
										value="(#{bundle.account_account_entry}: " />
									<aon:outputText styleClass="aon-bold"
										value="#{undeductibleInvoice.accountEntryId}" />
									<aon:outputText styleClass="aon-italic" value=")" />
								</c:if>
							</aon:div>
						</aon:panelGrid>
					</aon:div>

					<aon:outputLabel for="Invoice_issueDate"
						value="#{bundle.aon_date}" />
					<aon:div>
						<aon:selectInputDate id="Invoice_issueDate"
							value="#{undeductibleInvoice.to.issueDate}" required="true"
							disabled="#{undeductibleInvoice.readOnly}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support ajaxSingle="true" event="oninputchange"
								actionListener="#{undeductibleInvoice.onDateChanged}"
								reRender="Invoice_taxDate"
								focus="Creditor_id" />
							<a4j:support ajaxSingle="true" event="onchanged"
								actionListener="#{undeductibleInvoice.onDateChanged}"
								reRender="Invoice_taxDate"
								focus="Creditor_id" />
						</aon:selectInputDate>
					</aon:div>
						
					<ui:include src="/com/code/aon/ui/finance/facelet/creditor/lookup.xhtml">
						<ui:param name="lookupTo" value="#{undeductibleInvoice.to.registry}" />
						<ui:param name="lookupForRegistry" value="#{true}" />
						<ui:param name="lookupInputNameValue" value="#{undeductibleInvoice.to.registryName}" />
						<ui:param name="lookupDisabled" value="#{undeductibleInvoice.registryReadOnly or !undeductibleInvoiceFinance.allPending}" />
						<ui:param name="lookupInputNameDisabled" value="#{undeductibleInvoice.readOnly or !undeductibleInvoiceFinance.allPending}" />
						<ui:param name="lookupReRender" value="Creditor_lookup_document,InvoiceAddress,InvoiceProject" />
						<ui:param name="idRequired" value="#{true}" />						
						<ui:param name="skipSuggestText" 
							value="#{undeductibleInvoice.to.registry != null and undeductibleInvoice.to.registry.id != null}" />
						<aon:methodParam name="lookupChangeListener"
							value="#{undeductibleInvoice.creditorData}" type="lookupChangeListener" />
					</ui:include>
					
					<aon:outputLabel for="Invoice_taxDate" 
						value="#{financeBundle.finance_tax_date}" />
					<c:if test="#{aonRole.accountingOperator}">
						<aon:selectInputDate id="Invoice_taxDate"
							value="#{undeductibleInvoice.to.taxDate}" required="true" 
							disabled="#{undeductibleInvoice.readOnly}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"
							inputStyle="#{undeductibleInvoice.taxDateEquals?'':'background-color: #ff865e;'}">
							<a4j:support ajaxSingle="true" event="oninputchange"
								reRender="Invoice_taxDate"
								focus="Creditor_id" />
							<a4j:support ajaxSingle="true" event="onchanged"
								reRender="Invoice_taxDate"
								focus="Creditor_id" />
						</aon:selectInputDate>
					</c:if>
					<c:if test="#{!aonRole.accountingOperator}">
						<aon:outputText value="#{undeductibleInvoice.to.taxDate}" />
					</c:if>

					<aon:outputLabel for="Creditor_registry_document"
						value="#{bundle.aon_company_document}" />
					<aon:panelGroup id="Creditor_lookup_document">
						<aon:selectOneMenu id="Creditor_registry_document_type" 
							disabled="#{undeductibleInvoice.readOnly}"
							value="#{undeductibleInvoice.to.registryDocumentType}"
							reRender="Creditor_document_icon">
							<f:selectItems value="#{registryCollections.documentTypes}" />
						</aon:selectOneMenu>
						<aon:outputText styleClass="aon-margin-left aon-italic"
							value="#{bundle.aon_country}" />
						<aon:selectOneMenu id="Creditor_registry_document_country"
							styleClass="aon-margin-left" disabled="#{undeductibleInvoice.readOnly}"
							value="#{undeductibleInvoice.to.registryDocumentCountry}"
							reRender="Creditor_document_icon">
							<f:selectItems value="#{commonCollections.countryCodes}" />
						</aon:selectOneMenu>
						<aon:inputText id="Creditor_registry_document" 
							style="margin-left: 3px;" disabled="#{undeductibleInvoice.readOnly}"
							value="#{undeductibleInvoice.to.registryDocument}" size="16" maxlength="16"
							reRender="Creditor_document_icon" 
							onblur="toUpperCase(this);">
							<f:validateLength minimum="1" maximum="16" />
 						</aon:inputText>
						<aon:panelGroup id="Creditor_document_icon">
							<aon:outputText 
								rendered="#{!undeductibleInvoice.to.registryDocumentValidable}"
								styleClass="aon-icon-question"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{undeductibleInvoice.to.registryDocumentValidable and undeductibleInvoice.to.validRegistryDocument}"
								styleClass="aon-icon-predetermine"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{undeductibleInvoice.to.registryDocumentValidable and !undeductibleInvoice.to.validRegistryDocument}"
								styleClass="aon-icon-exception"
								style="padding-left: 15px;"
								value="&#160;" />
						</aon:panelGroup>
 					</aon:panelGroup>

					<aon:outputLabel value="#{bundle.aon_document_number}" />
					<aon:outputText styleClass="aon-bold"
						value="#{undeductibleInvoice.to.documentNumber}" />

					<aon:outputLabel for="Invoice_registryAddress_id"
						value="#{bundle.aon_address}" />
					<aon:div id="InvoiceAddress">
						<aon:selectOneMenu id="Invoice_registryAddress_id"
							rendered="#{!undeductibleInvoice.readOnly and undeductibleInvoiceAddress.to.id == null and undeductibleInvoice.addressCount > 0}"
							value="#{undeductibleInvoice.to.registryAddress}">
							<f:selectItems value="#{undeductibleInvoice.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel styleClass="aon-italic"
							value="#{registryBundle.registry_no_address_available}"
							rendered="#{undeductibleInvoiceAddress.to.id == null and ((undeductibleInvoice.readOnly and undeductibleInvoice.to.registryAddress.id == null) or (!undeductibleInvoice.readOnly and undeductibleInvoice.addressCount == 0))}" />
						<aon:outputText styleClass="aon-bold"
							value="#{undeductibleInvoice.address}" 
							rendered="#{undeductibleInvoiceAddress.to.id != null or (undeductibleInvoice.readOnly and undeductibleInvoice.to.registryAddress.id != null)}">
							<aon:abbreviateConverter maxWidth="30" />
						</aon:outputText>
						<aon:outputText styleClass="aon-margin-left aon-bold"
							value="#{undeductibleInvoice.location}"
							rendered="#{undeductibleInvoiceAddress.to.id != null or (undeductibleInvoice.readOnly and undeductibleInvoice.to.registryAddress.id != null)}">
							<aon:abbreviateConverter maxWidth="25" />
						</aon:outputText>
						<aon:div layout="inline" styleClass="aon-margin-left">
							<aon:commandButton id="invoiceAddressButton"
								value="#{registryBundle.registry_address_other}"
								styleClass="aon-icon-commandButton aon-icon-go"
								rendered="#{!undeductibleInvoice.new and !undeductibleInvoice.readOnly}"
								actionListener="#{undeductibleInvoice.onInvoiceAddressShow}"
								reRender="showInvoiceAddressWindow">
								<f:setPropertyActionListener target="#{undeductibleInvoice.showInvoiceAddressWindow}"
									value="#{true}" />								
							</aon:commandButton>
						</aon:div>
					</aon:div>

					<aon:outputLabel for="Invoice_total" 
						value="#{bundle.aon_total}" />
					<aon:div>
						<aon:outputText id="Invoice_total" styleClass="aon-bold"
							value="#{undeductibleInvoice.toInvoiceTotalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputLabel styleClass="aon-margin-left aon-italic"
							value="(#{bundle.aon_tax_included})" />
					</aon:div>

				</aon:panelGrid>

				<aon:div id="InvoiceProject">
					<aon:panelGrid columns="2" style="width: 100%;"
						rendered="#{undeductibleInvoice.to.project.id != null or undeductibleInvoice.projectCount > 0}"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto">

						<c:if test="#{!aonConfiguration.bean.invoice.showTasData}">
							<aon:outputLabel for="Invoice_project_id"
								value="#{bundle.aon_project}" />
						</c:if>
						<c:if test="#{aonConfiguration.bean.invoice.showTasData}">
							<aon:outputLabel for="Invoice_project_id"
								value="#{bundle.tas_project_tas}" />
						</c:if>
						<aon:div>
							<aon:selectOneMenu id="Invoice_project_id"
								rendered="#{!undeductibleInvoice.readOnly and undeductibleInvoice.to.project.id == null and undeductibleInvoice.projectCount > 0}"
								value="#{undeductibleInvoice.to.project}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{undeductibleInvoice.projects}" />
							</aon:selectOneMenu>
							<c:if test="#{!aonConfiguration.bean.invoice.showTasData}">
								<aon:outputLabel styleClass="aon-italic"
									value="#{projectBundle.project_no_project_linked}"
									rendered="#{undeductibleInvoice.readOnly and undeductibleInvoice.to.project.id == null and undeductibleInvoice.projectCount > 0}" />
							</c:if>
							<c:if test="#{aonConfiguration.bean.invoice.showTasData}">
								<aon:outputLabel styleClass="aon-italic"
									value="#{tasBundle.tas_no_projectTas_linked}"
									rendered="#{undeductibleInvoice.readOnly and undeductibleInvoice.to.project.id == null and undeductibleInvoice.projectCount > 0}" />
							</c:if>
							<aon:outputText styleClass="aon-bold"
								value="#{undeductibleInvoice.to.project.name}" 
								rendered="#{undeductibleInvoice.to.project.id != null}" />
							<aon:div layout="inline" styleClass="aon-margin-left">
								<aon:commandButton id="newInvoiceProject"
									value="&#160;" title="#{bundle.aon_reset}"
									styleClass="aon-icon-commandButton aon-icon-reset"
									rendered="#{undeductibleInvoice.readOnly and undeductibleInvoice.to.project.id == null and undeductibleInvoice.projectCount > 0}"
									reRender="showProjectWindow">
									<f:setPropertyActionListener target="#{undeductibleInvoice.showProjectWindow}"
										value="#{true}" />								
									<f:setPropertyActionListener target="#{undeductibleInvoice.showDetailProjectWindow}"
										value="#{false}" />								
								</aon:commandButton>
								<aon:commandButton id="removeInvoiceProject" 
									value="&#160;" title="#{bundle.aon_remove}" 
									styleClass="aon-icon-commandButton aon-icon-delete"
									rendered="#{undeductibleInvoice.to.project.id != null}"
									actionListener="#{undeductibleInvoice.removeInvoiceProject}" 
									reRender="undeductibleInvoiceForm" />
							</aon:div>
						</aon:div>

					</aon:panelGrid>
				</aon:div>
				
				<aon:panelGrid columns="2" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-auto">

					<aon:div rendered="#{!empty undeductibleInvoice.to.comments}">
						<aon:outputLabel for="Invoice_comments"
							value="#{bundle.aon_comment}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_comment_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Invoice_comments" cols="145" rows="2"
						value="#{undeductibleInvoice.to.comments}"
						rendered="#{!empty undeductibleInvoice.to.comments}"
						disabled="#{undeductibleInvoice.readOnly}" />

					<aon:div rendered="#{!empty undeductibleInvoice.to.remarks}">
						<aon:outputLabel for="Invoice_remarks"
							value="#{bundle.aon_remark}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_remark_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Invoice_remarks" cols="145" rows="2"
						value="#{undeductibleInvoice.to.remarks}"
						rendered="#{!empty undeductibleInvoice.to.remarks}"
						disabled="#{undeductibleInvoice.readOnly}" />

				</aon:panelGrid>

				<ui:include	src="/com/code/aon/ui/finance/facelet/undeductibleInvoice/formDetail.xhtml">
					<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
					<ui:param name="detailController" value="#{undeductibleInvoiceDetail}" />
					<c:if test="#{!aonConfiguration.bean.invoice.showTasData}">
						<ui:param name="projectLabel" value="#{bundle.aon_project}" />
					</c:if>
					<c:if test="#{aonConfiguration.bean.invoice.showTasData}">
						<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
					</c:if>
				</ui:include>

				<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formFinance.xhtml">
					<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
					<ui:param name="detailController" value="#{undeductibleInvoiceDetail}" />
					<ui:param name="financeController" value="#{undeductibleInvoiceFinance}" />
				</ui:include>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{expenseItemLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
