<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="undeductibleInvoiceForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.finance_undeductible_invoice_management_module}" />
					<ui:param name="controller" value="#{undeductibleInvoice}" />
					<ui:param name="skipFocusFirst" value="#{!undeductibleInvoice.nevv}" />
					<ui:param name="skipSaveButton" value="#{undeductibleInvoice.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{!undeductibleInvoice.removable or !undeductibleInvoiceFinance.allPending}" />
					<ui:param name="saveButtonReRender" value="undeductibleInvoiceForm" />
					<ui:param name="showMoreMenu" value="#{!undeductibleInvoice.nevv and undeductibleInvoiceDetail.to == null}" />
					<ui:define name="moreMenuContent">
						<aon:menuItem id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							actionListener="#{undeductibleInvoice.onGenerateFinances}"
							rendered="#{undeductibleInvoice.toInvoiceTotalPrice != 0 and (!undeductibleInvoice.recorded or undeductibleInvoiceFinance.allPending)}"
							iconClass="aon-icon-tree"
							accesskey="#{bundle.aon_key_finance}">
							<f:setPropertyActionListener target="#{undeductibleInvoice.backActionListener}"
								value="#{null}" />
							<f:setPropertyActionListener target="#{undeductibleInvoice.backAction}"
								value="#{null}" />
						</aon:menuItem>
						<aon:menuItem id="rectify"
							value="#{bundle.finance_rectify}"
							rendered="#{!undeductibleInvoice.rectifier and !undeductibleInvoice.accountSource and undeductibleInvoiceDetail.model.rowCount > 0}"
							iconClass="aon-icon-version"
							actionListener="#{undeductibleInvoice.onRectificationShow}"
							reRender="showRectificationWindow">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showRectificationWindow}"
								value="#{true}" />
						</aon:menuItem>
						<aon:if test="#{aonRole.accountingOperator}">
							<aon:menuItem id="record"
								value="#{bundle.finance_record}"
								actionListener="#{undeductibleInvoice.onRecordInvoice}"
								rendered="#{!undeductibleInvoice.recorded and undeductibleInvoiceDetail.model.rowCount > 0}"
								iconClass="aon-icon-task-assume"
								reRender="undeductibleInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>
						<aon:if test="#{aonRole.accountingManager}">
							<aon:menuItem id="unrecord"
								value="#{bundle.finance_unrecord}"
								actionListener="#{undeductibleInvoice.onUnrecordInvoice}"
								rendered="#{undeductibleInvoice.recorded and !undeductibleInvoice.accountSource}"
								iconClass="aon-icon-task-liberate"
								reRender="undeductibleInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:if>
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signMenuItem.xhtml">
							<ui:param name="signController" value="#{undeductibleInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{undeductibleInvoice.signed or !certificate.signable or !undeductibleInvoice.attachmentAvailable}" />
							<ui:param name="skipCancelSignButton" value="#{!undeductibleInvoice.signed or !undeductibleInvoice.attachmentAvailable}" />
							<ui:param name="signButtonReRender" value="undeductibleInvoiceForm" />
						</ui:include>
						<aon:menuItem id="duplicate"
							value="#{bundle.aon_to_duplicate}"
							rendered="#{!undeductibleInvoice.rectifier and !undeductibleInvoice.accountSource and undeductibleInvoiceDetail.model.rowCount > 0}"
							immediate="#{true}"
							iconClass="aon-icon-copy"
							actionListener="#{undeductibleInvoice.onDuplicationShow}"
							reRender="showDuplicationWindow">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showDuplicationWindow}"
								value="#{true}" />
						</aon:menuItem>

						<rich:menuSeparator id="actionMenuSeparator" />

						<aon:if test="#{companyCollections.activeCompanyActivitiesCount > 1}">
							<aon:menuItem id="activities"
								value="#{bundle.aon_activity}"
								iconClass="aon-icon-activity"
								reRender="showActivityWindow">
								<f:setPropertyActionListener target="#{undeductibleInvoice.showActivityWindow}" 
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="projects"
							value="#{bundle.aon_project}"
							iconClass="aon-icon-statistics"
							reRender="showProjectWindow">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showProjectWindow}" 
								value="#{true}" />							
							<f:setPropertyActionListener target="#{undeductibleInvoice.showDetailProjectWindow}"
								value="#{false}" />
						</aon:menuItem>
						<aon:menuItem id="documents"
							value="#{bundle.aon_documents}"
							iconClass="aon-icon-payroll"
							reRender="showDocumentWindow">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showDocumentWindow}"
								value="#{true}" />							
						</aon:menuItem>						
						<aon:menuItem id="comments"
							value="#{bundle.aon_comment}"
							iconClass="aon-icon-comments"
							reRender="showCommentsWindow">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showCommentsWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:menuItem id="remarks"
							value="#{bundle.aon_remark}"
							iconClass="aon-icon-notes"
							reRender="showRemarksWindow">
							<f:setPropertyActionListener target="#{undeductibleInvoice.showRemarksWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:if test="#{aonRole.accountingOperator}">
							<rich:menuSeparator id="invoiceAddsMenuSeparator1" />
							<aon:menuItem id="fiscalInformation"
								value="#{bundle.finance_fiscal_information}"
								iconClass="aon-icon-info"
								reRender="showFiscalInformationWindow">
								<f:setPropertyActionListener target="#{undeductibleInvoice.showFiscalInformationWindow}"
									value="#{true}" />							
							</aon:menuItem>
						</aon:if>

						<ui:include	src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />

					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{undeductibleInvoice.nevv}">
					<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formNewContent.xhtml">
						<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
						<ui:param name="addressController" value="#{undeductibleInvoiceAddress}" />
						<ui:param name="detailController" value="#{undeductibleInvoiceDetail}" />
						<ui:param name="financeController" value="#{undeductibleInvoiceFinance}" />
						<ui:param name="formName" value="undeductibleInvoiceForm" />
					</ui:include>
				</aon:if>			
				<aon:if test="#{!undeductibleInvoice.nevv}">
					<aon:panelGrid id="dataTable" columns="4"
						styleClass="aon-width-all aon-margin-bottom"
						columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-500,
							aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">

						<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formBasicContent.xhtml">
							<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
							<ui:param name="addressController" value="#{undeductibleInvoiceAddress}" />
							<ui:param name="detailController" value="#{undeductibleInvoiceDetail}" />
							<ui:param name="financeController" value="#{undeductibleInvoiceFinance}" />
							<ui:param name="formName" value="undeductibleInvoiceForm" />
						</ui:include>
					</aon:panelGrid>

					<aon:div styleClass="aon-margin-top">
						<aon:panelGrid columns="2" styleClass="aon-width-all"
							columnClasses="aon-panelGrid-odd aon-width-140,
								aon-panelGrid-even aon-width-auto">

							<ui:include src="/com/code/aon/ui/finance/facelet/invoice/formCommonContent.xhtml">
								<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
								<ui:param name="addressController" value="#{undeductibleInvoiceAddress}" />
								<ui:param name="detailController" value="#{undeductibleInvoiceDetail}" />
								<ui:param name="financeController" value="#{undeductibleInvoiceFinance}" />
								<ui:param name="formName" value="undeductibleInvoiceForm" />
							</ui:include>

						</aon:panelGrid>
					</aon:div>
				</aon:if>

				<ui:include	src="/com/code/aon/ui/finance/facelet/undeductibleInvoice/formDetail.xhtml">
					<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
					<ui:param name="detailController" value="#{undeductibleInvoiceDetail}" />
					<aon:if test="#{!aonConfiguration.bean.invoice.showTasData}">
						<ui:param name="projectLabel" value="#{bundle.aon_project}" />
					</aon:if>
					<aon:if test="#{aonConfiguration.bean.invoice.showTasData}">
						<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
					</aon:if>
				</ui:include>

				<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/formFinance.xhtml">
					<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
					<ui:param name="detailController" value="#{undeductibleInvoiceDetail}" />
					<ui:param name="financeController" value="#{undeductibleInvoiceFinance}" />
				</ui:include>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{expenseItemLookup}" />
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAddress.xhtml">
			<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
			<ui:param name="invoiceAddress" value="#{undeductibleInvoiceAddress}" />
			<ui:param name="addressReRender" value="InvoiceAddress" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalActivity.xhtml">
			<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/project/facelet/project/modalProject.xhtml">
			<ui:param name="controller" value="#{undeductibleInvoice}" />
			<ui:param name="parentReRender" value="undeductibleInvoiceForm" />
			<aon:methodParam name="parentActionListener" value="#{undeductibleInvoice.addInvoiceProject}" type="actionListener" />
			<ui:param name="parentValue" value="#{undeductibleInvoice.to.project}" />
			<ui:param name="detailReRender" value="invoiceDetails" />
			<aon:methodParam name="detailActionListener" value="#{undeductibleInvoiceDetail.onInvoiceDetailSave}" type="actionListener" />
			<ui:param name="detailValue" value="#{undeductibleInvoiceDetail.invoiceDetail.project}" />
			<aon:if test="#{!aonConfiguration.bean.invoice.showTasData}">
				<ui:param name="projectLabel" value="#{bundle.aon_project}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.invoice.showTasData}">
				<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
			</aon:if>
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalRectification.xhtml">
			<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
			<ui:param name="financeController" value="#{undeductibleInvoiceFinance}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalDuplication.xhtml">
			<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalDocuments.xhtml">
			<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
			<ui:param name="attachmentController" value="#{undeductibleInvoiceAttach}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/sign/facelet/signer/modal.xhtml" >
			<ui:param name="signButtonreRender" value="undeductibleInvoiceForm" />
			<aon:methodParam name="signActionListener" value="#{undeductibleInvoiceSigner.onSign}" type="actionListener" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalComments.xhtml">
			<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalRemarks.xhtml">
			<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{undeductibleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalFiscalInfo.xhtml">
			<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
			<ui:param name="bankAccountController" value="#{undeductibleInvoiceFinance.accountHelper}" />
			<ui:param name="modalReRender" value="financeContainer" />
		</ui:include>		
	</ui:define>
</ui:composition>
