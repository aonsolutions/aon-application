<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
		  <aon:if test="#{!app.standAlone}">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_creditor_module}" />
				<ui:param name="controller" value="#{creditor}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="creditorReport-excel-report" value="&#160;" 
						target="_new" rendered="#{!creditor.nevv}"
						action="#{report.onExecute}"
						disabled="#{creditor.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="creditorReport" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="creditorReport-report" value="#{bundle.aon_listing}"
						target="_new" rendered="#{!creditor.nevv}"
						action="#{report.onExecute}"
						disabled="#{creditor.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="creditorReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="creditorDetailExcelReport-excel-report" 
						value="#{bundle.aon_detailed_listing}" 
						target="_new" rendered="#{!creditor.nevv}"
						actionListener="#{creditor.onDetailReport}"
						disabled="#{creditor.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{creditor}" />
					<ui:define name="columns">
				
						<ui:include 
							src="/com/code/aon/ui/finance/facelet/creditor/listBasic.xhtml" />

						<aon:column alias="Creditor.registry.alias"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_alias}" />
							</f:facet>
							<aon:outputText value="#{to.registry.alias}" />
						</aon:column>

						<aon:column alias="Creditor.status"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:div>
           </aon:if>
           
           <aon:if test="#{app.standAlone}">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/appToolbar.xhtml">
					<ui:param name="controller" value="#{product}" />
					<ui:param name="filterController" value="#{product}" />
					<ui:param name="filterReRender" value="supplierListContainer" />
					<ui:param name="filterContainer" value="supplierFilterContainer" />
					<ui:param name="toolbarTitle" value="#{bundle.aon_product}" />

				</ui:decorate>
				
				
						<aon:if test="#{aonConfiguration.bean.product.showProduct}">
							<aon:lookupButtonPopup lookup="#{purchaseItemLookup}" />
						</aon:if>
						
						
						
				<aon:div styleClass="aon-scroll-area"
					style="display: flex; flex-direction: row; ">

					<aon:div id="supplierListContainer"
						style="overflow: auto; height: calc(100vh - 175px); flex-grow : 4; scrollbar-width: none">
						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
							<ui:param name="controller" value="#{creditor}" />


							<ui:define name="columns">
	
						<ui:include 
							src="/com/code/aon/ui/finance/facelet/creditor/listBasic.xhtml" />

						<aon:column alias="Creditor.registry.alias"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_alias}" />
							</f:facet>
							<aon:outputText value="#{to.registry.alias}" />
						</aon:column>

						<aon:column alias="Creditor.status"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
	
					</ui:define>
						</ui:decorate>
					</aon:div>
                      
                      <aon:div id="supplierFilterContainer" styleClass="aonFilterPopup"
						style="display:none">
						<ui:decorate
							template="/com/code/aon/ui/finance/facelet/creditor/searchContent.xhtml">
							<ui:param name="controller" value="#{supplier}" />
							<ui:define name="searchContent">
								<ui:include
									src="/com/code/aon/ui/product/facelet/product/filterContent.xhtml">
									<ui:param name="searchController" value="#{supplierSearch}" />
								</ui:include>
							</ui:define>
						</ui:decorate>

					</aon:div>
                    
					

				</aon:div>
			</aon:if>
			
		</aon:form>
	</ui:define>
</ui:composition>
