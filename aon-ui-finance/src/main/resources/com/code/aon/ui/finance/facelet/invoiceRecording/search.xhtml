<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoiceRecordingSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_invoice_recording_module}" />
				<ui:param name="controller" value="#{invoiceRecording}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{invoiceRecording}" />
				<ui:define name="searchContent">
						
					<aon:outputLabel for="Invoice_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Invoice_type"
						reRender="aonSearchContent"
						value="#{invoiceRecordingSearch.context.invoiceType}">
						<f:selectItems value="#{invoiceRecording.invoiceTypes}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Invoice_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:inputText id="Invoice_series"
							onblur="toUpperCase(this);"
							valueChangeListener="#{invoiceRecording.addExpression}"
							size="5" maxlength="5">
						</aon:inputText>
						<aon:outputLabel for="Invoice_fromNumber"
							styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_from}:" />
						<aon:inputText id="Invoice_fromNumber" maxlength="10"
							value="#{invoiceRecordingSearch.context.fromNumber}" size="7" />
						<aon:outputLabel for="Invoice_toNumber"
							styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_to}:" />							
						<aon:inputText id="Invoice_toNumber" maxlength="10"
							value="#{invoiceRecordingSearch.context.toNumber}" size="7" />
					</aon:div>					
					
					<aon:outputLabel for="Customer_id"
						rendered="#{invoiceRecordingSearch.sales}"
						value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup" rendered="#{invoiceRecordingSearch.sales}">
						<aon:lookupInputText id="Customer_id" lookup="#{customerLookup}"
							reRender="Customer_full_name" lookupProperty="registry"
							value="#{invoiceRecordingSearch.context.registry.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{customerBundle.customer_selection}"
							selectReRender="Customer_id,Customer_full_name" actionType="search"
							lookup="#{customerLookup}" minHeight="460" minWidth="650"
							property="#{invoiceRecordingSearch.context.registry}" lookupProperty="registry">
						</aon:lookupButton>
						<aon:inputText id="Customer_full_name"
							value="#{(invoiceRecordingSearch.context.registry.name!=null)?(invoiceRecordingSearch.context.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>

					<aon:outputLabel for="Supplier_id"
						rendered="#{!invoiceRecordingSearch.sales}"
						value="#{supplierBundle.supplier_supplier}" />
					<aon:div styleClass="aon-lookup" rendered="#{!invoiceRecordingSearch.sales}">
						<aon:lookupInputText id="Supplier_id" lookup="#{supplierLookup}"
							reRender="Supplier_full_name" lookupProperty="registry"
							value="#{invoiceRecordingSearch.context.registry.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{supplierBundle.supplier_selection}"
							selectReRender="Supplier_id,Supplier_full_name" actionType="search"
							lookup="#{supplierLookup}" minHeight="460" minWidth="650"
							property="#{invoiceRecordingSearch.context.registry}" lookupProperty="registry">
						</aon:lookupButton>
						<aon:inputText id="Supplier_full_name"
							value="#{(invoiceRecordingSearch.context.registry.name!=null)?(invoiceRecordingSearch.context.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>
					
					<aon:outputLabel value="#{financeBundle.finance_invoice_date}" />
					<aon:div>
						<aon:outputLabel for="Invoicing_invoiceDateFrom" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Invoicing_invoiceDateFrom"
							value="#{invoiceRecordingSearch.context.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="Invoicing_invoiceDateTo" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Invoicing_invoiceDateTo"
							value="#{invoiceRecordingSearch.context.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
										
					<aon:outputLabel for="Invoice_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu id="Invoice_securityLevel"
						converter="aon.EnumConverter"
						valueChangeListener="#{invoiceRecording.addEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>

				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />		
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />		
	</ui:define>
	
</ui:composition>
