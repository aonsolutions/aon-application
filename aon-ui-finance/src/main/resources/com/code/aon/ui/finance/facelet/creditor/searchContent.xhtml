<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputText value="" />
	<aon:div style="width:550px;">
		<aon:panelCollapsible expanded="true" label="#{bundle.aon_creditor}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:include src="/com/code/aon/ui/finance/facelet/creditor/searchBasicContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>					
					
		<aon:panelCollapsible expanded="false" label="#{registryBundle.registry_address_module}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
				<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{bundle.aon_contacts}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
				<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>
				
		<c:if test="#{aonConfiguration.bean.creditor.showSegment}">
			<aon:panelCollapsible expanded="false" label="#{registryBundle.registry_segment_module}">
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/rsegment/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panelCollapsible>
		</c:if>

		<c:if test="#{aonRole.document}">
			<aon:panelCollapsible expanded="false" label="#{bundle.aon_documents}">
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/rattach/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panelCollapsible>
		</c:if>
						
	</aon:div>

</ui:composition>
