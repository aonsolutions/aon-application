<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="feeInvoicingForm">

			<aon:valueParam name="currentUserScopes" default="#{configCollections.currentUserScopes}" />

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="feeInvoicingToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.finance_fee_invoicing_module}" />
				<ui:param name="toolbarDescription"	value="#{bundle.aon_search}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="feeInvoicing-clear"
						value="#{bundle.aon_clear}"
						type="reset" ajaxSingle="true"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
					<aon:commandButton id="feeInvoicing"
						value="#{bundle.aon_key_invoice_description}"
						reRender="progressBarForm"
						actionListener="#{feeInvoicing.onShowPanel}"
						styleClass="aon-finding-toolbar-item aon-icon-accept" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_invoicing_criteria}" />
					</f:facet>
					<aon:panelGrid columns="2">
						<ui:include src="/com/code/aon/ui/customer/facelet/invoicingGroup/lookup.xhtml">
							<ui:param name="lookupTo" value="#{feeInvoicing.params.invoicingGroup}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="lookupInputSize" value="10"/>
						</ui:include>

						<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
							<ui:param name="lookupTo" value="#{feeInvoicing.params.customer}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="lookupInputSize" value="10"/>
						</ui:include>

						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
							<ui:param name="lookupBean" value="#{saleItemLookup}" />
							<ui:param name="lookupTo" value="#{feeInvoicing.params.item}" />
							<ui:param name="skipNewButton" value="#{true}" />
						</ui:include>

						<aon:outputLabel for="Item_product_category" 
							value="#{bundle.aon_category}" />
						<aon:selectOneMenu id="Item_product_category" value="#{feeInvoicing.params.category}">
							<f:selectItem itemLabel="-" itemValue="#{null}" />
							<f:selectItems value="#{productCollections.categories}" />
						</aon:selectOneMenu>

						<aon:outputLabel value="#{bundle.aon_period}" />
						<aon:panelGrid columns="4">
							<aon:outputLabel for="Invoicing_Month"
								value="#{bundle.aon_month}" />
							<aon:selectOneMenu id="Invoicing_Month"
								value="#{feeInvoicing.params.month}">
								<f:selectItems value="#{commonCollections.months}" />
							</aon:selectOneMenu>
	
							<aon:outputLabel for="Invoicing_Year"
								value="#{bundle.aon_year}" />
							<aon:inputText id="Invoicing_Year" size="5"
								value="#{feeInvoicing.params.year}" />
						</aon:panelGrid>
	
						<aon:if test="#{aonRole.confidentiality}">
							<aon:outputLabel for="Invoicing_Confidential"
								value="#{bundle.aon_confidential}" />
							<aon:selectOneRadio id="Invoicing_Confidential" 
								value="#{feeInvoicing.params.confidential}">
								<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
								<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
							</aon:selectOneRadio>
						</aon:if>
	
						<aon:outputLabel for="Invoicing_WorkPlace"
							value="#{bundle.purchase_workplace}" />
						<aon:selectOneMenu id="Invoicing_WorkPlace"
							value="#{feeInvoicing.params.workPlace}">
							<f:selectItem itemLabel="-" itemValue="#{null}" />
							<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						</aon:selectOneMenu>

						<aon:if test="#{currentUserScopes[1] != null}">
							<aon:outputLabel for="Invoicing_Customer_Scope"
								value="#{bundle.aon_scope}" />
							<aon:selectOneMenu id="Invoicing_Customer_Scope"
								value="#{feeInvoicing.params.scope}">
								<f:selectItem itemLabel="-" itemValue="#{null}" />
								<f:selectItems value="#{currentUserScopes}" />
							</aon:selectOneMenu>
						</aon:if>
					</aon:panelGrid>
				</aon:panel>

				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_invoice_data}" />
					</f:facet>
					<aon:panelGrid columns="2">

						<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
							<ui:param name="controller" value="#{saleInvoice}" />
							<ui:param name="sfc_seriesCodes" value="#{configCollections.invoiceSeries}" />
							<ui:param name="seriesChangedReRender" value="Invoicing_Confidential" />
							<ui:param name="sfc_editable" value="#{true}" />
							<ui:param name="sfc_seriesProperty" value="#{feeInvoicing.params.invoiceSeries}" />
							<ui:param name="sfc_numberProperty" value="#{feeInvoicing.params.invoiceNumber}" />
							<aon:methodParam name="sfc_onSeriesChanged" type="valueChangeListener"
								value="#{feeInvoicing.onInvoiceSeriesChanged}" />	
							<aon:methodParam name="sfc_onNumberEditable" type="actionListener"
								value="#{feeInvoicing.onInvoiceNumberEditable}" />
						</ui:include>
	
						<aon:outputLabel for="Invoice_date"
							value="#{bundle.aon_date}" />
						<aon:selectInputDate id="Invoice_date"
							value="#{feeInvoicing.params.invoiceDate}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
	
						<aon:if test="#{aonRole.accountingOperator}">
							<aon:outputLabel for="Invoice_record"
								value="#{bundle.finance_record}" />
							<aon:selectOneRadio id="Invoice_record" 
								value="#{feeInvoicing.params.invoiceRecordable}">
								<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
								<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
							</aon:selectOneRadio>
						</aon:if>

						<aon:outputLabel for="Invoice_comments"
							value="#{bundle.aon_comment}" />
						<aon:inputTextarea id="Invoice_comments" cols="82" rows="5"
							value="#{feeInvoicing.params.invoiceComments}" />

					</aon:panelGrid>
				</aon:panel>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{invoicingGroupLookup}" />
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/progressBar.xhtml">
			<ui:param name="progressLabel" value="#{bundle.finance_fee_invoicing_module}" />
			<ui:param name="progressBarBean" value="#{feeInvoicing.progressionState}" />
			<ui:param name="progressBarInitialMessage" value="#{bundle.finance_invoicing_initial}"/>
			<ui:param name="progressBarStartMessage" value="#{bundle.aon_confirm}"/>
			<ui:param name="progressBarCompleteMessage"
				value="#{(feeInvoicing.invoiceIds!=null)?bundle.finance_invoicing_complete:bundle.finance_invoicing_no_invoice}"/>
			<aon:methodParam name="progressBarStartActionListener"
				default="#{feeInvoicing.onInvoice}" type="actionListener" />
			<aon:methodParam name="progressBarCloseActionListener"
				default="#{feeInvoicing.onClosePanel}" type="actionListener" />
			<aon:methodParam name="progressBarCloseAction" default="#{feeInvoicing.invoiceAction}"/>
		</ui:include>
	</ui:define>
</ui:composition>
