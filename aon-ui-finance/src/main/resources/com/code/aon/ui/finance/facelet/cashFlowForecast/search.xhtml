<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="cashFlowForecastForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.finance_cashflow_forecast_module}" />
				<ui:param name="controller" value="#{cashFlowForecast}" />
			</ui:include>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{cashFlowForecast}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="CashFlowForecast_registryBank_id"
						value="#{bundle.aon_bank}" />
					<aon:selectOneMenu id="CashFlowForecast_registryBank_id"
						value="#{controller.params.registryBank}">
						<f:selectItem itemValue="#{null}" itemLabel=" - "/>
						<f:selectItems value="#{companyCollections.allCompanyBanks}" />
					</aon:selectOneMenu>
				
					<aon:outputLabel for="CashFlowForecast_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="CashFlowForecast_description" size="32"
						value="#{controller.params.description}" />

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="CashFlowForecast_startDate-From" 
							styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="CashFlowForecast_startDate-From"
							value="#{controller.params.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
				
						<aon:outputLabel for="CashFlowForecast_startDate-To" 
							styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="CashFlowForecast_startDate-To"
							value="#{controller.params.dueDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
