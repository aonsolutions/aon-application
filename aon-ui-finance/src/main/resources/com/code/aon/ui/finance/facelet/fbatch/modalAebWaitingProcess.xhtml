<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showAebWaitingProcessWindow">
		<aon:if test="#{fbatch.showAebWaitingProcessWindow}">
			<rich:modalPanel id="fbatchAebWaitingProcessModalPanel" minHeight="200"
				minWidth="350" rendered="#{fbatch.showAebWaitingProcessWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_advice}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showAebWaitingProcessWindow, financeBatchForm" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{fbatch.showAebWaitingProcessWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				
				<a4j:region>
					<h:form>
						<a4j:poll status="aonStatus" interval="3000"
							enabled="#{empty fbatch.aebOutput}"
							actionListener="#{fbatch.onReloadDisk}"
							reRender="showAebWaitingProcessWindow" />
					</h:form>
				</a4j:region>
				
				<aon:form id="fbatchAebWaitingProcessForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-scroll-area">
									<aon:if test="#{empty fbatch.aebOutput}">
										<aon:div styleClass="aon-margin-top aon-bold">
											<aon:outputText value="La tarea se está ejecutando." />
										</aon:div>
										<aon:div styleClass="aon-margin-top aon-bold">
											<aon:outputText
												value="Puede esperar o continuar con su trabajo. Podrá descargar el fichero cuando la tarea finalice." />
										</aon:div>
									</aon:if>
									<aon:if test="#{not empty fbatch.aebOutput}">
										<aon:outputText styleClass="aon-margin-top aon-bold"
											value="Fichero generado correctamente" />
										<aon:div styleClass="aon-margin-top">
											<aon:htmlCommandLink target="_blank"
												title="#{fbatch.diskOk?(bundle.finance_download_disk):(bundle.finance_download_error)}"
												value="#{fbatch.diskOk?(bundle.finance_download_disk):(bundle.finance_download_error)}"
												actionListener="#{fbatch.downloadDisk}" rendered="#{fbatch.aebOutput!=null}"
												styleClass="aon-commandButton aon-icon-mail-save"
												onclick="this.style.display='none';" />
										</aon:div>
									</aon:if>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
