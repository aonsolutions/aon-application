<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:panelGrid id="posInvoiceDetailItemDataTable" columns="3"
		styleClass="aon-width-all" style="background-color:#f6f5e3; border:#d8d37a 1px solid;"
		columnClasses="aon-padding-left aon-width-60,aon-width-auto,aon-padding-top aon-text-center aon-width-70">

		<aon:outputLabel for="Item_id" value="#{bundle.aon_product}:" />
		<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
			<ui:param name="lookupBean" value="#{saleItemLookup}" />
			<ui:param name="lookupTo" value="#{detailController.to.item}" />
			<ui:param name="idRequired" value="#{true}" />
			<ui:param name="skipLabel" value="#{true}" />
			<ui:param name="skipGoToButton" value="#{true}" />
			<ui:param name="skipNewButton" value="#{true}" />
			<ui:param name="lookupInputSuggestSize" value="40" />
			<ui:param name="lookupInputOnFocus" value="PosDetail-save" />
			<ui:param name="lookupReRender"	value="PosInvoiceDetailWizard" />
			<aon:methodParam name="lookupChangeListener"
				value="#{detailController.onItemChanged}" type="lookupChangeListener" />
		</ui:include>
		<aon:commandButton id="PosDetail-save"
			styleClass="aon-medium-commandButton aon-width-60"
			value="#{bundle.aon_key_save_description}"
			title="#{bundle.aon_key_save_accelerator}"
			disabled="#{invoiceController.nevv or invoiceController.recorded or invoiceController.ticketFinished or detailController.to.item.id == null}"
			actionListener="#{detailController.onAccept}"
			accesskey="#{bundle.aon_key_save}" />

		<aon:outputLabel for="InvoiceDetail_quantity"
			value="#{bundle.aon_quantity}:" />
		<aon:div styleClass="aon-nowrap">
			<aon:commandButton id="PosDetail-minusQuantity" immediate="true"
				styleClass="aon-medium-commandButton aon-width-30"
				value="-"
				actionListener="#{detailController.onMinusQuantity}"
				reRender="InvoiceDetail_quantity,InvoiceDetail_price,InvoiceDetail_discount" ajaxSingle="true" />
			<aon:inputText id="InvoiceDetail_quantity"
				styleClass="aon-margin-right"
				value="#{detailController.to.quantity}" 
				required="true" size="1" maxlength="5"
				valueChangeListener="#{detailController.onQuantityChanged}"
				reRender="InvoiceDetail_price,InvoiceDetail_discount" ajaxSingle="true"
				focus="#{posInvoice.posShift.pos.priceEditable ? 'InvoiceDetail_price' : 'InvoiceDetail_discount'}" />
			<aon:commandButton id="PosDetail-plusQuantity" immediate="true"
				styleClass="aon-medium-commandButton aon-width-30"
				value="+"
				actionListener="#{detailController.onPlusQuantity}"
				reRender="InvoiceDetail_quantity,InvoiceDetail_price,InvoiceDetail_discount" ajaxSingle="true" />
			<aon:outputLabel for="InvoiceDetail_price" styleClass="aon-margin-left aon-margin-right aon-input-required" 
				value="#{bundle.aon_price}:" />
			<aon:if test="#{posInvoice.posShift.pos.priceEditable}">
				<aon:inputText id="InvoiceDetail_price"
					value="#{detailController.to.salesPrice}"
					required="true" size="10" maxlength="8"
					valueChangeListener="#{detailController.onSalesPriceChanged}"
					ajaxSingle="true" />
			</aon:if>
			<aon:if test="#{!posInvoice.posShift.pos.priceEditable}">
				<aon:outputText id="InvoiceDetail_price" styleClass="aon-bold aon-margin-right"
					value="#{detailController.to.salesPrice}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:if>
			<aon:outputLabel for="InvoiceDetail_discount" styleClass="aon-margin-left aon-margin-right aon-input-required"
				value="#{bundle.aon_discount}:" />
			<aon:if test="#{posInvoice.posShift.pos.discountEditable}">
				<aon:inputText id="InvoiceDetail_discount"
					value="#{detailController.to.discountExpression.discountExpr}"
					required="true" size="3" maxlength="5"
					valueChangeListener="#{detailController.onDiscountChanged}"
					ajaxSingle="true" />
			</aon:if>
			<aon:if test="#{!posInvoice.posShift.pos.discountEditable}">
				<aon:outputText id="InvoiceDetail_discount" styleClass="aon-bold aon-margin-right"
					value="#{detailController.to.discountExpression.discountExpr}" />
			</aon:if>
			<aon:outputText styleClass="aon-bold aon-margin-right" value=" %" />
		</aon:div>
		<aon:commandButton id="PosDetail-itemInfo" immediate="true" 
			styleClass="aon-medium-commandButton aon-width-60"
			value="#{bundle.product_stock}"
			disabled="#{detailController.to.item.id == null or !detailController.to.item.product.inventoriable}"
			actionListener="#{itemInfo.onShowPanel}"
			reRender="itemInfoContainer">
			<aon:set var="#{itemInfo.stockVisible}" value="#{true}" />
			<aon:set var="#{itemInfo.alternativesVisible}" value="#{true}" />
			<aon:set var="#{itemInfo.item}" value="#{detailController.to.item}" /> 
			<aon:set var="#{itemInfo.warehouse}" value="#{null}" /> 
			<aon:set var="#{itemInfo.rowStock}" value="#{detailController.rowStock}" /> 
			<aon:set var="#{itemInfo.componentId}" value="Item_id" />
			<aon:set var="#{itemInfo.alternativeMethod}" value="detailController.onItemChanged" />
		</aon:commandButton>															

	</aon:panelGrid>

</ui:composition>
