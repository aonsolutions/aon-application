<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
		
	<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
		<f:facet name="header">
			<aon:outputText value="&#160;" />
		</f:facet>
		<ui:insert name="beforeColumnContent" />		
	</aon:column>

	<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
		</f:facet>
		<aon:outputText value="#{to.referenceCode}" />
	</aon:column>

	<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.issueTime}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_supplier}" />
		</f:facet>
		<aon:outputText value="#{to.supplier.registry.fullName}">
			<aon:abbreviateConverter maxWidth="50" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_total}" />
		</f:facet>
		<aon:outputText value="#{purchaseInvoice.incomeTransferManager.incomeTotalPrice}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="#{purchaseInvoice.incomeTransferManager.selectedIncomeId==to.id?'aon-highlight':''}">
		<f:facet name="header">
			<aon:outputText value="&#160;" />
		</f:facet>
		<aon:commandButton value="&#160;" immediate="true"
			title="#{bundle.finance_invoice_see_delivery_details}"
			styleClass="aon-finding-toolbar-item aon-icon-tree-root aon-finding-toolbar-item-no-border"
			actionListener="#{purchaseInvoice.incomeTransferManager.onSelectIncome}"
			reRender="#{reRender},detailDataContainer" ajaxSingle="true">
		</aon:commandButton>															
	</aon:column>
		
</ui:composition>
