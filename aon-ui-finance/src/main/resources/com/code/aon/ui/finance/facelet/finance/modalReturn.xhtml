<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinanceReturnWindow">
		<aon:if test="#{finance.showFinanceReturnWindow}">
			<rich:modalPanel id="financeReturnModalPanel" minHeight="240"
				minWidth="580" rendered="#{finance.showFinanceReturnWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_return}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFinanceReturnWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{finance.showFinanceReturnWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="financeReturnForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="financeReturn-return"
										value="#{bundle.finance_to_return}"
										reRender="showFinanceReturnWindow,financeForm"
										actionListener="#{finance.onFinanceReturn}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="financeReturnModalPanel"
											event="onclick" operation="hide"/>											
										<f:setPropertyActionListener
											target="#{finance.showFinanceReturnWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="financeReturn-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showFinanceReturnWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{finance.showFinanceReturnWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

										<aon:outputLabel for="Finance_returnDate"
											value="#{bundle.finance_return_date}" />
										<aon:selectInputDate id="Finance_returnDate" 
											value="#{finance.returnDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-110" />

										<aon:outputLabel for="Finance_returnExpenses"
											value="#{bundle.aon_expenses}" />
										<aon:inputText id="Finance_returnExpenses"
											value="#{finance.returnExpenses}"
											required="true" size="10" />

										<aon:outputLabel for="Finance_returnDeposit"
											value="#{bundle.finance_deposit}" />
										<aon:selectOneRadio id="Finance_returnDeposit"
											style="display:inline;" ajaxSingle="true"
											value="#{finance.returnDeposit}"
											valueChangeListener="#{finance.onDepositChanged}"
											reRender="menuGrid">
											<f:selectItem itemLabel="#{bundle.aon_bank}" itemValue="0" />
											<f:selectItem itemLabel="#{bundle.report_pos}" itemValue="1" />
											<f:selectItem itemLabel="#{bundle.aon_other}" itemValue="2" />
										</aon:selectOneRadio>

										<aon:outputLabel for="Finance_returnRegistryBank"
											value="#{bundle.aon_bank}"
											rendered="#{finance.returnDeposit == 0}" />
										<aon:selectOneMenu id="Finance_returnRegistryBank"
											value="#{finance.returnRegistryBank}"
											rendered="#{finance.returnDeposit == 0}">
											<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
										</aon:selectOneMenu>
										<aon:outputLabel for="Finance_returnPayMethodTypeDetail"
											value="#{bundle.aon_detail}"
											rendered="#{finance.returnDeposit > 0 and finance.payMethodTypeDetailsSize > 1}" />
										<aon:selectOneMenu id="Finance_returnPayMethodTypeDetail"
											value="#{finance.returnPayMethodTypeDetail}"
											rendered="#{finance.returnDeposit > 0 and finance.payMethodTypeDetailsSize > 1}">
											<f:selectItems value="#{finance.payMethodTypeDetailList}" />
										</aon:selectOneMenu>

										<aon:if test="#{aonRole.accountingOperator}">
											<aon:outputLabel for="Finance_record"
												value="#{bundle.finance_record}" />
											<aon:selectOneRadio id="Finance_record" ajaxSingle="true"
												value="#{finance.returnRecordable}">
												<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
												<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
											</aon:selectOneRadio>
										</aon:if>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
