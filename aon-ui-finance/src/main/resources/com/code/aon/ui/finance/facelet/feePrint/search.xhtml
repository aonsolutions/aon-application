<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="feePrintSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_fee_print_module}" />
				<ui:param name="controller" value="#{feePrint}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{feePrint}" />
				<ui:define name="searchContent">
						
					<aon:outputLabel for="CustomerFee_item_id"
						value="#{bundle.aon_concept}" />						
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="CustomerFee_item_id" 
							lookup="#{itemLookup}"
							reRender="CustomerFee_item_detail"
							value="#{feePrintSearch.item.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton
							windowTitle="#{appBundle.aon_lookup_item}" actionType="search"
							selectReRender="CustomerFee_item_id,CustomerFee_item_detail"
							lookup="#{itemLookup}" minHeight="460" minWidth="650"
							property="#{feePrintSearch.item}">
						</aon:lookupButton>
						<aon:inputText id="CustomerFee_item_detail"
							value="#{(feePrintSearch.item.product.name!=null)?(feePrintSearch.item.product.name):('')}"
							size="60" disabled="true" />
					</aon:div>
				
					<aon:outputLabel styleClass="aon-form-input-text-label"
						value="#{financeBundle.finance_fee_billing_date}" />
					<aon:div>
						<aon:selectOneMenu value="#{feePrintSearch.billingDateMonth}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{salesCollections.months}" />
						</aon:selectOneMenu>
						<aon:outputLabel for="BillingDate_Year-Edit" styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_year}" />
						<aon:inputText id="BillingDate_Year-Edit" 
							size="5" required="true"
							value="#{feePrintSearch.billingDateYear}" />
					</aon:div>
					
					<aon:outputLabel for="Customer_status"
						value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="Customer_status"
						converter="aon.EnumConverter"
						valueChangeListener="#{feePrint.addEqualExpression}">						
						<f:selectItem itemLabel="-" value="#{null}"/> 
						<f:selectItems value="#{customerCollections.customerStatuses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Customer_scope_id"
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Customer_scope_id"
						value="#{configCollections.scope}"
						valueChangeListener="#{finance.addDirectIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/> 
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>
				
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
	</ui:define>
	
</ui:composition>
