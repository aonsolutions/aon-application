<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showDocumentWindow">
		<aon:if test="#{invoiceController.showDocumentWindow}">
			<rich:modalPanel id="DocumentModalPanel"
				minWidth="740" minHeight="400" zindex="90"
				showWhenRendered="#{invoiceController.showDocumentWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_documents}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showDocumentWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showDocumentWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="DocumentForm">
					<aon:div styleClass="aon-width-all">
						<ui:decorate template="/com/code/aon/faces/attachment/grid.xhtml">
							<ui:param name="controller" value="#{attachmentController}" />
							<ui:param name="sortColumns" value="#{true}" />
							<ui:param name="skipResetButton" value="#{invoiceController.annulled}" />
							<ui:param name="removeButtonRendered" value="#{!invoiceController.annulled and ((to.type != 'INVOICE') or !invoiceController.to.signed)}" />
							
							<ui:define name="beginFormListContent" >
								<aon:outputText value="&#160;"
									rendered="#{invoiceController.to.signed and (to.type == 'INVOICE')}"
									title="#{bundle.sign_signed}"
									styleClass="aon-icon aon-icon-signed" />
							</ui:define>
							<ui:define name="additionalColumns" >
								<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.type"
									styleClass="aon-editDataTable-textColumn aon-width-100">
									<f:facet name="header">
										<aon:outputLabel for="#{controller.beanName}_type"
											value="#{bundle.aon_type}" />
									</f:facet>
									<aon:outputText value="#{to.type}" />
									<aon:outputText rendered="#{to.type == 'INVOICE'}" 
										styleClass="aon-uppercase"
										value=" (#{to.mimeType.extension})" />
									<f:facet name="footer">
										<aon:selectOneMenu id="#{controller.beanName}_type"
											rendered="#{formNew}" value="#{controller.to.type}">
											<f:selectItems value="#{invoiceController.invoiceAttachmentTypes}" />
										</aon:selectOneMenu>					
									</f:facet>
								</aon:column>								
								<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.attachDate"
									styleClass="aon-editDataTable-textColumn aon-width-120">
									<f:facet name="header">
										<aon:outputLabel for="#{controller.beanName}_attachDate"
											value="#{bundle.aon_date}" />
									</f:facet>
									<aon:outputText value="#{to.attachDate}" rendered="#{formList}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
									<aon:selectInputDate id="#{controller.beanName}_attachDate"
										popupDateFormat="#{bundle.aon_date_pattern}"
										rendered="#{formEdit}" value="#{controller.to.attachDate}" />
									<f:facet name="footer">
										<aon:selectInputDate id="#{controller.beanName}_attachDate-New"
											popupDateFormat="#{bundle.aon_date_pattern}"
											rendered="#{formNew}" value="#{controller.to.attachDate}" />
									</f:facet>
								</aon:column>								
							</ui:define>
						</ui:decorate>
					</aon:div>								
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
