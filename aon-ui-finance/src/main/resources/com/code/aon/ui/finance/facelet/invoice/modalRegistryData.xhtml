<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showRegistryDataWindow">
		<aon:if test="#{invoiceController.showRegistryDataWindow}">
			<rich:modalPanel id="registryDataModalPanel" minHeight="240"
				minWidth="620" rendered="#{invoiceController.showRegistryDataWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText 
							value="#{(invoiceController.to.sales) ? bundle.registry_customer_data :
									(invoiceController.to.purchase) ? bundle.finance_invoice_supplier_data : bundle.finance_invoice_creditor_data}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showRegistryDataWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showRegistryDataWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="registryDataForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="registryData-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{invoiceController.acceptInvoice}">
										<aon:actionHotKey key="return" />
										<rich:componentControl for="posSelectionModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{invoiceController.showRegistryDataWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="registryData-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_cancel}"
										actionListener="#{invoiceController.refresh}"
										reRender="showRegistryDataWindow">
										<f:setPropertyActionListener
											target="#{invoiceController.showRegistryDataWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

										<aon:if test="#{invoiceController.to.sales}">
											<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
												<ui:param name="lookupTo" value="#{invoiceController.to.registry}" />
												<ui:param name="lookupForRegistry" value="#{true}" />
												<ui:param name="lookupInputSuggestSize" value="40" />
												<ui:param name="lookupInputNameDisabled" value="#{true}" />
												<ui:param name="lookupReRender" value="registryDataForm" />
												<ui:param name="idRequired" value="#{true}" />						
												<ui:param name="skipGoToButton" value="#{true}" />
												<ui:param name="skipNewButton" value="#{true}" />
												<aon:methodParam name="lookupChangeListener" 
													value="#{invoiceController.onCustomerChanged}" type="lookupChangeListener" />
											</ui:include>
										</aon:if>

										<aon:outputLabel for="Invoice_registry_document"
											value="#{bundle.aon_company_document}" />
										<aon:panelGroup id="Invoice_registry_document_panel">
											<aon:selectOneMenu id="Invoice_registry_document_type" 
												value="#{invoiceController.to.registryDocumentType}"
												reRender="Invoice_registry_document_icon" ajaxSingle="true">
												<f:selectItems value="#{registryCollections.documentTypes}" />
											</aon:selectOneMenu>
											<aon:outputText styleClass="aon-margin-left aon-italic"
												value="#{bundle.aon_country}" />
											<aon:selectOneMenu id="Invoice_registry_document_country"
												styleClass="aon-margin-left"
												value="#{invoiceController.to.registryDocumentCountry}"
												reRender="Invoice_registry_document_icon" ajaxSingle="true">
												<f:selectItems value="#{commonCollections.countryCodes}" />
											</aon:selectOneMenu>
											<aon:inputText id="Invoice_registry_document" 
												style="margin-left: 3px;" 
												value="#{invoiceController.to.registryDocument}" 
												required="true" size="16" maxlength="16"
												reRender="Invoice_registry_document_icon" ajaxSingle="true" 
												onblur="toUpperCase(this);">
												<f:validateLength minimum="1" maximum="16" />
											</aon:inputText>
											<aon:panelGroup id="Invoice_registry_document_icon">
												<aon:outputText value="&#160;" 
													styleClass="aon-icon-question"
													style="padding-left: 15px;"
													rendered="#{!invoiceController.to.registryDocumentValidable}" />
												<aon:outputText value="&#160;" 
													styleClass="aon-icon-predetermine"
													style="padding-left: 15px;"
													rendered="#{invoiceController.to.registryDocumentValidable and invoiceController.to.validRegistryDocument}" />
												<aon:outputText value="&#160;"
													styleClass="aon-icon-exception"
													style="padding-left: 15px;"
													rendered="#{invoiceController.to.registryDocumentValidable and !invoiceController.to.validRegistryDocument}" />
											</aon:panelGroup>
										</aon:panelGroup>

										<aon:outputLabel for="Invoice_registry_name"
											value="#{bundle.aon_company_name}" />
										<aon:inputText id="Invoice_registry_name" 
											value="#{invoiceController.to.registryName}" 
											required="true" size="54" maxlength="128"
											onblur="toUpperCase(this);">
											<f:validateLength minimum="1" maximum="128" />
										</aon:inputText>

										<aon:if test="#{invoiceController.addressCount > 0}">
											<aon:outputLabel for="Invoice_registryAddress"
												value="#{bundle.aon_address}" />
											<aon:selectOneMenu id="Invoice_registryAddress"
												value="#{invoiceController.to.registryAddress}">
												<f:selectItems value="#{invoiceController.addresses}" />
											</aon:selectOneMenu>
										</aon:if>
									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
