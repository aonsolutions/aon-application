<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="financePaymentList">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_finance_payment_module}" />
				<ui:param name="toolbarDescription" value="#{financeBundle.finance_pending}" />
				<ui:param name="controller" value="#{financePayment}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					
				<aon:dataTable id="financePaymentData" value="#{financePayment.model}"
					var="to" rows="20" rendered="#{financePayment.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn
						aon-editDataTable-textColumn, aon-editDataTable-numberColumn">

					<aon:rowSelector action="financePayment_form" actionListener="#{financePayment.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
						</f:facet>
						<aon:outputText value="#{to.invoice.series} / #{to.invoice.number}" />
					</aon:column>
								
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.registry.surname}, " rendered="#{to.registry.surname != null and to.registry.surname != ''}"/>								
						<aon:outputText value="#{to.registry.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.dueDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_pay_method}" />
						</f:facet>
						<aon:outputText value="#{to.payMethod.name}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_amount}" />
						</f:facet>
						<aon:outputText value="#{to.totalAmount}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

				</aon:dataTable>
				
				<aon:dataScroller2 for="financePaymentData" showNote="true" />
			</aon:div>
		</aon:form>				

	</ui:define>
</ui:composition>
