<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_pos_definition_module}" />
				<ui:param name="controller" value="#{pos}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" styleClass="aon-width-half">

					<aon:outputLabel for="Pos_workPlace" value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Pos_workPlace"
						value="#{pos.to.workPlace}" required="true"
						valueChangeListener="#{pos.onWorkPlaceChanged}"
						reRender="posForm">
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
					</aon:selectOneMenu>

					<c:if test="#{companyCollections.departmentsCount > 0}">
						<aon:outputLabel for="Pos_department" value="#{companyBundle.company_department}" />
						<aon:selectOneMenu id="Pos_department"
							value="#{pos.to.department}">
							<f:selectItem itemLabel=" - " itemValue="null" />
							<f:selectItems value="#{companyCollections.departments}" />
						</aon:selectOneMenu>
					</c:if>

					<aon:outputLabel for="Pos_name" value="#{financeBundle.finance_pos_name}" />
					<aon:inputText id="Pos_name" 
						value="#{pos.to.name}" 
						size="32" maxlength="32" required="true" />

					<c:if test="#{pos.to.series != null or pos.workPlaceSeriesCount > 1}">
						<aon:outputLabel for="Pos_series" value="#{bundle.aon_series}" />
						<aon:div>
							<aon:selectOneMenu id="Pos_series"
								value="#{pos.to.series}"
								rendered="#{pos.to.series == null}">
								<f:selectItem itemLabel=" - " itemValue="" />
								<f:selectItems value="#{pos.workPlaceSeries}" />
							</aon:selectOneMenu>
							<aon:outputText styleClass="aon-bold aon-padding-right"
								value="#{pos.to.series}" 
								rendered="#{pos.to.series != null}" />
							<aon:commandLink id="remove_series" immediate="true"
								styleClass="aon-editDataTable-button aon-icon-delete" style="padding-right: 20px;"
								value="&#160;" title="#{bundle.aon_remove}"
								rendered="#{pos.to.series != null}"
								actionListener="#{pos.onDeleteSeries}"
								reRender="posForm" />
						</aon:div>
					</c:if>

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{pos.to.customer}" />
					</ui:include>

					<aon:outputLabel for="Pos_displayMode" value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Pos_displayMode"
						value="#{pos.to.displayMode}" required="true">
						<f:selectItems value="#{financeCollections.posDisplayModes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Pos_active" value="#{bundle.aon_status}" />
					<aon:selectOneRadio id="Pos_active"
						value="#{pos.to.active}" required="true">
						<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="#{false}" />
					</aon:selectOneRadio>

				</aon:panelGrid>

				<c:if test="#{!pos.new and pos.to.barRestaurant}">
					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{productBundle.product_catalogue_module}"/>
						</aon:div>
						<aon:div styleClass="aon-group-body"> 
							<aon:div styleClass="aon-group-body-internal">
								<ui:decorate
									template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
									<ui:param name="controller" value="#{posCatalogue}" />
									<ui:define name="columns">

										<aon:column alias="PosCatalogue.catalogue.name" 
											styleClass="aon-editDataTable-textColumn aon-width-150">
											<f:facet name="header">
												<aon:outputLabel for="PosCatalogue_catalogue" value="#{productBundle.product_catalogue}" />
											</f:facet>
											<aon:outputText value="#{to.catalogue.name}"
												rendered="#{formList}" />
											<aon:selectOneMenu id="PosCatalogue_catalogue"
												value="#{controller.to.catalogue}" rendered="#{formEdit}"
												required="true"
												valueChangeListener="#{controller.onCatalogueChanged}"
												reRender="PosCatalogue_catalogue_startDate,PosCatalogue_catalogue_endDate">
												<f:selectItems value="#{productCollections.catalogues}" />
											</aon:selectOneMenu>
											<f:facet name="footer">
												<aon:selectOneMenu id="PosCatalogue_catalogue-New"
													value="#{controller.to.catalogue}" rendered="#{formNew}"
													required="true"
													valueChangeListener="#{controller.onCatalogueChanged}"
													reRender="PosCatalogue_catalogue_startDate-New,PosCatalogue_catalogue_endDate-New">
													<f:selectItems value="#{productCollections.catalogues}" />
												</aon:selectOneMenu>
											</f:facet>
										</aon:column>

										<aon:column alias="PosCatalogue.catalogue.startDate" 
											styleClass="aon-editDataTable-textColumn aon-width-80">
											<f:facet name="header">
												<aon:outputLabel for="PosCatalogue_catalogue_startDate" value="#{bundle.aon_date_from}" />
											</f:facet>
											<aon:outputText id="PosCatalogue_catalogue_startDate"
												value="#{to.catalogue.startDate}"
												rendered="#{formList or formEdit}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
											<f:facet name="footer">
												<aon:outputText id="PosCatalogue_catalogue_startDate-New"
													value="#{controller.to.catalogue.startDate}"
													rendered="#{formNew}">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
											</f:facet>
										</aon:column>

										<aon:column alias="PosCatalogue.catalogue.endDate"
											styleClass="aon-editDataTable-textColumn aon-width-80">
											<f:facet name="header">
												<aon:outputLabel for="PosCatalogue_catalogue_endDate" value="#{bundle.aon_date_to}" />
											</f:facet>
											<aon:outputText id="PosCatalogue_catalogue_endDate"
												value="#{to.catalogue.endDate}"
												rendered="#{formList or formEdit}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
											<f:facet name="footer">
												<aon:outputText id="PosCatalogue_catalogue_endDate-New"
													value="#{controller.to.catalogue.endDate}"
													rendered="#{formNew}">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
											</f:facet>
										</aon:column>

									</ui:define>
								</ui:decorate>
							</aon:div>
						</aon:div>
					</aon:div>
				</c:if>

						<a4j:support event="onclick" reRender="posPanel" ignoreDumpResponses="true" ajaxSingle="true" />

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		
	</ui:define>
</ui:composition>
