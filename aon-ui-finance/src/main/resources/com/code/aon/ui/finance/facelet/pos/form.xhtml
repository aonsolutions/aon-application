<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.finance_pos_definition_module}" />
				<ui:param name="controller" value="#{pos}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="posPanel" columns="2" styleClass="aon-width-half">

					<aon:outputLabel for="Pos_workPlace" value="#{bundle.purchase_workplace}" />
					<aon:selectOneMenu id="Pos_workPlace"
						value="#{pos.to.workPlace}" required="true"
						valueChangeListener="#{pos.onWorkPlaceChanged}"
						reRender="posForm">
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
					</aon:selectOneMenu>

					<aon:if test="#{companyCollections.departmentsCount > 0}">
						<aon:outputLabel for="Pos_department" value="#{bundle.purchase_department}" />
						<aon:selectOneMenu id="Pos_department"
							value="#{pos.to.department}">
							<f:selectItem itemLabel=" - " itemValue="null" />
							<f:selectItems value="#{companyCollections.departments}" />
						</aon:selectOneMenu>
					</aon:if>

					<aon:outputLabel for="Pos_name" value="#{bundle.finance_pos_name}" />
					<aon:inputText id="Pos_name" 
						value="#{pos.to.name}" 
						size="32" maxlength="32" required="true" />

					<aon:if test="#{pos.to.series != null or pos.workPlaceSeriesCount > 1}">
						<aon:outputLabel for="Pos_series" value="#{bundle.aon_series}" />
						<aon:div>
							<aon:selectOneMenu id="Pos_series"
								value="#{pos.to.series}"
								rendered="#{pos.to.series == null}">
								<f:selectItem itemLabel=" - " itemValue="" />
								<f:selectItems value="#{pos.workPlaceSeries}" />
							</aon:selectOneMenu>
							<aon:outputText styleClass="aon-bold aon-padding-right"
								value="#{pos.to.series}" 
								rendered="#{pos.to.series != null}" />
							<aon:commandLink id="remove_series" immediate="true"
								styleClass="aon-editDataTable-button aon-icon-delete" style="padding-right: 20px;"
								value="&#160;" title="#{bundle.aon_remove}"
								rendered="#{pos.to.series != null}"
								actionListener="#{pos.onDeleteSeries}"
								reRender="posForm" />
						</aon:div>
					</aon:if>

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{pos.to.customer}" />
					</ui:include>

					<aon:outputLabel for="Pos_displayMode" value="#{bundle.aon_type}" />
					<aon:div id="DisplayModeDiv">
						<aon:selectOneMenu id="Pos_displayMode"
							value="#{pos.to.displayMode}" required="true"
							reRender="DisplayModeDiv" ajaxSingle="true">
							<f:selectItems value="#{financeCollections.posDisplayModes}" />
						</aon:selectOneMenu>
						<aon:selectBooleanCheckbox id="Pos_priceEditable"
							styleClass="aon-margin-left"
							value="#{pos.to.priceEditable}"
							rendered="#{pos.to.standard}" />
						<aon:outputLabel for="Pos_priceEditable" value="#{bundle.aon_price} #{bundle.aon_calendar_editable}"
							styleClass="aon-italic aon-bold"
							rendered="#{pos.to.standard}" />
						<aon:selectBooleanCheckbox id="Pos_discountEditable"
							styleClass="aon-margin-left"
							value="#{pos.to.discountEditable}"
							rendered="#{pos.to.standard}" />
						<aon:outputLabel for="Pos_discountEditable" value="#{bundle.aon_discount} #{bundle.aon_calendar_editable}"
							styleClass="aon-italic aon-bold"
							rendered="#{pos.to.standard}" />
						<aon:outputLabel for="Pos_numRows" value="#{bundle.aon_rows}"
							styleClass="aon-margin-left aon-margin-right aon-italic"
							rendered="#{pos.to.touchScreen}" />
						<aon:inputText id="Pos_numRows" 
							value="#{pos.to.numRows}" 
							size="1" maxlength="1" required="true"
							rendered="#{pos.to.touchScreen}">
							<f:validateDoubleRange minimum="3" />
						</aon:inputText>
						<aon:outputLabel for="Pos_numCols" value="#{bundle.aon_columns}"
							styleClass="aon-margin-left aon-margin-right aon-italic"
							rendered="#{pos.to.touchScreen}" />
						<aon:inputText id="Pos_numCols" 
							value="#{pos.to.numCols}" 
							size="1" maxlength="1" required="true"
							rendered="#{pos.to.touchScreen}">
							<f:validateDoubleRange minimum="3" />
						</aon:inputText>
					</aon:div>

					<aon:if test="#{actionDenied.moduleEnabled['hotel']}">
						<aon:outputLabel for="Pos_invoiceable" value="#{bundle.pms_invoiceable}" />
						<aon:selectOneRadio id="Pos_invoiceable" value="#{pos.to.invoiceable}" >
							<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
							<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
							<a4j:support event="onclick" reRender="posPanel" ignoreDumpResponses="true" ajaxSingle="true" />
						</aon:selectOneRadio>

						<aon:outputLabel for="Item_id" value="#{bundle.aon_product} #{bundle.finance_invoice}"
							rendered="#{pos.to.invoiceable}" />
						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
							<ui:param name="lookupBean" value="#{saleItemLookup}" />
							<ui:param name="lookupTo" value="#{pos.to.itemInvoice}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="lookupRendered" value="#{pos.to.invoiceable}" />
							<ui:param name="lookupControllerListener" value="#{itemLookupNoWildCardListener}" />
						</ui:include>
					</aon:if>

					<aon:outputLabel for="Pos_active" value="#{bundle.aon_status}" />
					<aon:selectOneRadio id="Pos_active"
						value="#{pos.to.active}" required="true">
						<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="#{false}" />
					</aon:selectOneRadio>

				</aon:panelGrid>

				<aon:if test="#{!pos.nevv and pos.to.touchScreen}">
					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{bundle.product_catalogue_module}"/>
						</aon:div>
						<aon:div styleClass="aon-group-body"> 
							<aon:div styleClass="aon-group-body-internal">
								<ui:decorate
									template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
									<ui:param name="controller" value="#{posCatalogue}" />
									<ui:define name="columns">

										<aon:column alias="PosCatalogue.catalogue.name" 
											styleClass="aon-editDataTable-textColumn aon-width-150">
											<f:facet name="header">
												<aon:outputLabel for="PosCatalogue_catalogue" value="#{bundle.product_catalogueItem_catalogue}" />
											</f:facet>
											<aon:outputText value="#{to.catalogue.name}"
												rendered="#{formList}" />
											<aon:selectOneMenu id="PosCatalogue_catalogue"
												value="#{controller.to.catalogue}" rendered="#{formEdit}"
												required="true"
												valueChangeListener="#{controller.onCatalogueChanged}"
												reRender="PosCatalogue_catalogue_startDate,PosCatalogue_catalogue_endDate">
												<f:selectItems value="#{configCollections.salesCatalogues}" />
											</aon:selectOneMenu>
											<f:facet name="footer">
												<aon:selectOneMenu id="PosCatalogue_catalogue-New"
													value="#{controller.to.catalogue}" rendered="#{formNew}"
													required="true"
													valueChangeListener="#{controller.onCatalogueChanged}"
													reRender="PosCatalogue_catalogue_startDate-New,PosCatalogue_catalogue_endDate-New">
													<f:selectItems value="#{configCollections.salesCatalogues}" />
												</aon:selectOneMenu>
											</f:facet>
										</aon:column>

										<aon:column alias="PosCatalogue.catalogue.startDate" 
											styleClass="aon-editDataTable-textColumn aon-width-80">
											<f:facet name="header">
												<aon:outputLabel for="PosCatalogue_catalogue_startDate" value="#{bundle.aon_date_from}" />
											</f:facet>
											<aon:outputText id="PosCatalogue_catalogue_startDate"
												value="#{to.catalogue.startDate}"
												rendered="#{formList or formEdit}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
											<f:facet name="footer">
												<aon:outputText id="PosCatalogue_catalogue_startDate-New"
													value="#{controller.to.catalogue.startDate}"
													rendered="#{formNew}">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
											</f:facet>
										</aon:column>

										<aon:column alias="PosCatalogue.catalogue.endDate"
											styleClass="aon-editDataTable-textColumn aon-width-80">
											<f:facet name="header">
												<aon:outputLabel for="PosCatalogue_catalogue_endDate" value="#{bundle.aon_date_to}" />
											</f:facet>
											<aon:outputText id="PosCatalogue_catalogue_endDate"
												value="#{to.catalogue.endDate}"
												rendered="#{formList or formEdit}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
											<f:facet name="footer">
												<aon:outputText id="PosCatalogue_catalogue_endDate-New"
													value="#{controller.to.catalogue.endDate}"
													rendered="#{formNew}">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
											</f:facet>
										</aon:column>

									</ui:define>
								</ui:decorate>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
		
	</ui:define>
</ui:composition>
