<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"	
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="warehouseMenu">
		
			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_projectTas"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-car aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{tasBundle.tas_projectTas_module}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="projectTas" 
										action="projectTas_search" actionListener="#{projectTas.onEditSearch}"
										value="#{tasBundle.tas_projectTas_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_commercial_commercial-Garage"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-offer aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_commercial}"/>
							</f:facet>						
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="offer-Garage" 
										action="offer_search" actionListener="#{offer.onEditSearch}"
										value="#{commercialBundle.commercial_offer_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="target-Garage" 
										action="target_search" actionListener="#{target.onEditSearch}"
										value="#{commercialBundle.commercial_target_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="seller-Garage" 
										action="seller_search" actionListener="#{seller.onEditSearch}"
										value="#{sellerBundle.seller_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="commercialTerm-Garage"
										action="commercialTerm" actionListener="#{commercialTerm.onSearch}" 
										value="#{commercialBundle.commercial_term_module}" />
								</aon:div>								
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

					<aon:panelGroup>
						<c:if test="#{aonRole.productOperator or aonRole.config}">
							<aon:panelGrid id="group_warehouse_general"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_general}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="make" 
											action="make_form" actionListener="#{make.onSearch}"
											value="#{tasBundle.tas_makes_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="model" 
											action="model_form" actionListener="#{model.onSearch}"
											value="#{tasBundle.tas_models_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="tasItem" 
											action="tasItem_search" actionListener="#{tasItem.onEditSearch}"
											value="#{tasBundle.tas_tasItem_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
						
						<c:if test="#{aonRole.statisticsOperator}">
							<aon:panelGrid id="group_sales_reports"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-statistics aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_reports}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="tasOwnerStat"
											actionListener="#{tasStat.onResetOwnerStat}"
											action="tasStat_search" 
											disabled="true"
											value="#{statBundle.stat_menu_tas_owner}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="tasItemStat"
											actionListener="#{tasStat.onResetTasItemStat}"
											disabled="true"
											action="tasStat_search" 
											value="#{statBundle.stat_menu_tas_tasItem}"/>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>							
						
						<c:if test="#{aonRole.config}">
							<aon:panelGrid id="group_audatex"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-audatex aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="Audatex"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="audabridgeParams" action="audabridgeParams"
											actionListener="#{audabridgeParams.onLoad}"
											value="#{audabridgeBundle.audabridge_parameters_module}" />
									</aon:div>
<!-- 									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="audabridgeOffer" action="audabridgeOffer"
											actionListener="#{audabridgeOffer.onReset}"
											value="#{audabridgeBundle.audabridge_offer_module}" />
									</aon:div>
 -->
								</aon:div>
							</aon:panelGrid>
						</c:if>
					</aon:panelGroup>
				</h:panelGrid>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
