<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"	
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="warehouseMenu">
		
			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<c:if test="#{aonRole.config}">
							<aon:panelGrid id="group_warehouse_warehouse"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-warehouse aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{warehouseBundle.warehouse_menu_group}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="warehouse" 
												action="warehouse" 
												value="#{warehouseBundle.warehouse_warehouse_module}" />
										</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
						
						<aon:panelGrid id="group_warehouse_stock"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-warehouse aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{warehouseBundle.warehouse_stock_module}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="stock" 
										action="stock_search" actionListener="#{stock.onEditSearch}"
										value="#{warehouseBundle.warehouse_stock_module}" />
								</aon:div>
								
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="stock_report_by_warehouse" 
										action="stock_report_search" actionListener="#{stockReport.onReportByWarehouse}"
										value="#{warehouseBundle.warehouse_stock_by_warehouse_module}" />
								</aon:div>
								
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="stock_report_by_item" 
										action="stock_report_search" actionListener="#{stockReport.onReportByItem}"
										value="#{warehouseBundle.warehouse_stock_by_item_module}" />
								</aon:div>
								
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="stock_report_by_warehouse_valued" 
										action="stock_report_search" actionListener="#{stockReport.onReportByWarehouseValued}"
										value="#{warehouseBundle.warehouse_stock_by_warehouse_valued_module}" />
								</aon:div>
								
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="stock_report_by_item_valued" 
										action="stock_report_search" actionListener="#{stockReport.onReportByItemValued}"
										value="#{warehouseBundle.warehouse_stock_by_item_valued_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="warehouseTransfer" 
										action="warehouseTransfer_search" actionListener="#{warehouseTransfer.onEditSearch}"
										value="#{warehouseBundle.warehouse_transfer_module}" />
								</aon:div>
								
								
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="orderProposal" 
										action="orderProposal_search" actionListener="#{orderProposal.onEditSearch}"
										value="#{warehouseBundle.warehouse_order_proposal_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_warehouse_inventory"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-warehouse aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{warehouseBundle.warehouse_inventory_module}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="inventory_close" 
										action="inventory_close" actionListener="#{inventory.onStartClosing}"
										value="#{warehouseBundle.warehouse_inventory_close_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="inventory" 
										action="inventory_search" actionListener="#{inventory.onEditSearch}"
										value="#{warehouseBundle.warehouse_inventory_closed_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

					</aon:panelGroup>

					<aon:panelGroup>
						<c:if test="#{aonRole.productOperator or aonRole.config}">
							<aon:panelGrid id="group_warehouse_general"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_general}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<c:if test="#{aonRole.productOperator}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="item-warehouse" 
												action="item_search" actionListener="#{item.onEditSearch}"
												value="#{productBundle.product_module}" />
										</aon:div>
									</c:if>
									<c:if test="#{aonRole.config}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="productCategory-warehouse" 
												action="productCategory-warehouse"
												value="#{productBundle.product_category_module}" />
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="brand-warehouse"
												action="brand"
												value="#{productBundle.product_brand_module}" />
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="tariff-warehouse" 
												action="tariff_list-warehouse" actionListener="#{tariff.onSearch}"
												value="#{productBundle.product_tariff_module}" />
										</aon:div>									
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="catalogue-warehouse" 
												action="catalogue_search-warehouse" actionListener="#{catalogue.onEditSearch}"
												value="#{productBundle.product_catalogue_module}" />
										</aon:div>
									</c:if>								
								</aon:div>
							</aon:panelGrid>
						</c:if>
					</aon:panelGroup>
				</h:panelGrid>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
