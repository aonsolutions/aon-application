version: 0.2

phases:
  install:
    #runtime-versions:
      # name: version
      # name: version
    commands:
      - echo Entered the install phase...
      - /usr/local/bin/docker-entrypoint.sh
  pre_build:
    commands:
      - echo Entered the pre_build phase...
      - echo Logging in to Amazon ECR... $AWS_ACCOUNT_ID
      - $(aws ecr get-login --no-include-email --region $AWS_DEFAULT_REGION)
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/aonsolutions
  build:
    commands:
      - echo Entered the build phase...
      - echo Building $TAG version...
      - echo Build started on `date`
      - mvn --fail-fast -DbuildNumber=666 -Dgwt.working=true clean install
      - echo Building $TAG Docker images...
      - docker build --no-cache -t aonsolutions/aon-application:$TAG .
      - docker build --no-cache -t aonsolutions/aon-db-up2date:$TAG ./aon-db-up2date
      - mysql < aon-htmlunit/src/test/resources/com/esferalia/aon/htmlunit/payroll/test-aonsolutions-org.sql
      - |
        docker run \
        -e DB_USER=dbuser \
        -e DB_PASSWD=serubd2000 \
        -e DB_HOST=$(ip addr show docker0 | grep -oP 'inet \K[0-9\.]+') \
        aonsolutions/aon-db-up2date:$TAG
      - |
        docker run \
        -d -p 8080:8080 \
        -e DB_USER=dbuser \
        -e DB_PASSWD=serubd2000 \
        -e DB_HOST=$(ip addr show docker0 | grep -oP 'inet \K[0-9\.]+') \
        aonsolutions/aon-application:$TAG
      - |
        mvn -B \
        --fail-at-end \
        -Dintegration.test.user=admin \
        -Dintegration.test.password=org \
        -Dintegration.test.payroll.url=http://payroll-test.aonsolutions.org:8080/ \
        -Dintegration.test.general.payroll.url=http://general-payroll-test.aonsolutions.org:8080/ \
        -Dintegration.test.agrarian.payroll.url=http://agrarian-payroll-test.aonsolutions.org:8080/ \
        -Dintegration.test.trainning.payroll.url=http://trainning-payroll-test.aonsolutions.org:8080/ \
        -Dintegration.test.home.payroll.url=http://home-payroll-test.aonsolutions.org:8080/ \
        -f aon-htmlunit/pom.xml integration-test
      - echo Building PRODUCTION version...
      - mvn -B --resume-from aon-js-payroll -DbuildNumber=666 -Drpm.release=false -DskipTests=true clean install
      - docker build --no-cache -t aonsolutions/aon-application:$TAG .
      - docker build --no-cache -t aonsolutions/aon-solutions:$TAG -f ./aon-solutions/Dockerfile .
      #- docker tag aonsolutions/aon-db-up2date:$TAG $REPOSITORY_URI/aon-db-up2date:$TAG
      - docker tag aonsolutions/aon-application:$TAG $REPOSITORY_URI/aon-application:$TAG
      - docker tag aonsolutions/aon-solutions:$TAG $REPOSITORY_URI/aon-solutions:$TAG
      #- mvn --fail-fast -DbuildNumber=666 -Daws.lambda=true -pl aon-in-payroll clean install
  post_build:
    commands:
      - echo Entered the post_build phase...
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      #- docker push $REPOSITORY_URI/aon-db-up2date:$TAG
      - docker push $REPOSITORY_URI/aon-application:$TAG
      - docker push $REPOSITORY_URI/aon-solutions:$TAG
      - |
        printf '[
        {"name":"JAKARTA","imageUri":"%s/aon-application:%s"}
        ]' $REPOSITORY_URI $TAG > jakartaimgdef.json
      - cat jakartaimgdef.json
      - |
        printf '[
        {"name":"JAKARTA-SOLUTIONS","imageUri":"%s/aon-solutions:%s"}
        ]' $REPOSITORY_URI $TAG > jakartasolutionsimgdef.json
      - cat jakartasolutionsimgdef.json
artifacts:
  files:
    - jakartaimgdef.json
    - jakartasolutionsimgdef.json
    # - location
