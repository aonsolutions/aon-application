<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition>

    <!-- panel popup code, modal type -->
    <ice:panelPopup id="checkinPopupDiv"
                    rendered="true"
                    visible="#{manager.menu.showCheckinModalPanel}"
                    modal="true"
                    styleClass="aon-popup-" 
                    style="width:43em;position:absolute;top:120px;left:20%;">


        <f:facet name="header">            
            <aon:div styleClass="aon-popup-title">  
        		<aon:panelGrid columns="2" cellpadding="0" cellspacing="0"
        			columnClasses="aon-vertical-align-middle,aon-vertical-align-middle">      		
					<h:graphicImage styleClass="aon-panelPopup-logo"
						url="#{aonConfiguration.applicationLogoContextRelativePath}"
						alt="#{appBundle.aon_application_title}" />				
	            	<ice:outputText styleClass="popupTitle" value="#{appBundle.aon_cdr_checkin_document}"/>
	            </aon:panelGrid>
	        </aon:div>
        </f:facet>

        <f:facet name="body">
            <ice:panelGrid cellpadding="0" cellspacing="0" styleClass="popupModalBody" >
				<aon:div style="margin:0.5em 0;border:#fff 3px solid;background-color:#ccc 1px solid;
							padding:5px;">
						<ice:inputFile styleClass="aon-inputFile"
					      progressListener="#{manager.documents.upload.progress}"
	                      actionListener="#{manager.documents.upload.action}"/>
	             		<ice:outputProgress id="proCheckin" value="#{manager.documents.upload.percent}"
	             		/>
	             </aon:div>

	              		
	            <ice:panelGrid columns="2" cellpadding="0" cellspacing="0" style="float:right">
	                <ice:commandButton id="acceptCheckin"
	                                   actionListener="#{manager.documents.checkin}"
	                                   value="Guardar" 
	                                   styleClass="aon-form-button"/>
	                <ice:commandButton id="closeCheckin"
	                                   actionListener="#{manager.onCloseModalPanel}"
	                                   value="Cerrar" 
	                                   styleClass="aon-form-button"/>
				</ice:panelGrid>

            </ice:panelGrid>
        </f:facet>

    </ice:panelPopup>

</ui:composition>

</body>
</html>
