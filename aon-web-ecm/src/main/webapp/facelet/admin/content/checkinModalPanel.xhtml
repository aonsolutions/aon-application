<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition>

	<aon:panelGrid columns="1" width="100%">
		<rich:modalPanel id="checkinModalPanel" top="100" left="200"
				minHeight="100" minWidth="100" height="200" width="550" zindex="1000">
			<f:facet name="header">
            	<h:outputText value="#{appBundle.aon_cdr_checkin_document}"/>
			</f:facet>
			<f:facet name="controls">
				<h:graphicImage
					value="/aonResource/images/aon-icon/aon-icon-popupWindow-close.gif"
					style="cursor:pointer"
					onclick="Richfaces.hideModalPanel('checkinModalPanel')" />
			</f:facet>
			<aon:form id="checkinModalPanelForm">
				<rich:fileUpload id="upload" reRender="table"
						addControlLabel="#{menuBundle.aon_ecm_add}" 
						stopControlLabel="#{menuBundle.aon_ecm_stop}" stopEntryControlLabel="#{menuBundle.aon_ecm_stop}"
						clearControlLabel="#{menuBundle.aon_ecm_clear}" clearAllControlLabel="#{menuBundle.aon_ecm_clearall}"
						uploadControlLabel="#{menuBundle.aon_ecm_uploading}"
						fileUploadListener="#{manager.documents.upload.listener}"
						maxFilesQuantity="#{manager.documents.upload.uploadsAvailable}"
						immediateUpload="true" listHeight="70px" listWidth="100%">
					<a4j:support event="onuploadcomplete" reRender="closeModalPanel" />
				</rich:fileUpload>

				<aon:div id="closeModalPanel" >
					<aon:div style="text-align:right;" rendered="#{manager.documents.upload.size>0}">
						<rich:spacer height="3"/>
						<br />
			            <aon:panelGrid columns="2" style="float:right">
							<a4j:commandButton value="#{menuBundle.aon_version_checkin}"
								reRender="checkinModalPanel, documentPanel" 
								actionListener="#{manager.onCheckin}"
								onclick="javascript:Richfaces.hideModalPanel('checkinModalPanel')"
								styleClass="aon-form-button" />

							<a4j:commandButton action="#{manager.documents.upload.clearUploadData}"
								reRender="checkinModalPanel" value="#{menuBundle.aon_ecm_close}"
								actionListener="#{manager.onCloseModalPanel}"
								onclick="javascript:Richfaces.hideModalPanel('checkinModalPanel')"
								styleClass="aon-form-button"/>
						</aon:panelGrid>
					</aon:div>
				</aon:div>

			</aon:form>
		</rich:modalPanel>
	</aon:panelGrid>

</ui:composition>

</body>
</html>
