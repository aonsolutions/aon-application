<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="es" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:c="http://java.sun.com/jstl/core"			
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-components">
<f:view>
<c:forEach items="#{aonConfiguration.applicationBundleList}" var="appBundle">
	<f:loadBundle basename="#{appBundle.value}" var="#{appBundle.key}" />
</c:forEach>
<head>
	<title><ui:insert name="title">Title</ui:insert></title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<meta http-equiv="Expires" content="0" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Cache-Control" content="no-store" />
	<link rel="stylesheet" type="text/css" href='#{facesContext.externalContext.requestContextPath}/xmlhttp/css/xp/xp.css' />
	<c:forEach items="#{aonConfiguration.styleSheets}" var="styleSheet">
		<link href="#{facesContext.externalContext.requestContextPath}#{styleSheet}" rel="stylesheet" type="text/css"></link>
	</c:forEach>
	<script type='text/javascript'
		src="#{facesContext.externalContext.requestContextPath}/js/Window.js">
		// nothing
	</script>
	<ui:insert name="head" />
</head>
<body class="aon-body" >
		<aon:div id="aon-content">		
			<ui:insert name="mainHeader" />
			<ui:include src="/facelet/homepage/messages.xhtml" />
			<ui:insert name="menu" />
			<ui:insert name="toolbar" />
			<ui:insert name="content" />
		</aon:div>	
</body>
</f:view>
</html>
