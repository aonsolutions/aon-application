<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">
		<aon:form id="usersForm" >
			
			<aon:div styleClass="aon-scroll-area" style="padding-top:0;">				

					<aon:div styleClass="aon-section-title" style="padding-top:0;">
						<aon:outputText value="#{menuBundle.aon_permissions}" />: <aon:outputLabel for="tree" value="#{menuBundle.aon_permissions_profiles}" />	
					</aon:div>

					<aon:div styleClass="aon-toolbar">
						<aon:commandButton id="synchButton" 
							styleClass="aon-finding-toolbar-item aon-icon-sincronize"
							actionListener="#{permissions.synchronize}"
				            value="#{menuBundle.aon_permissions_synch}" />
					</aon:div>

					<aon:dataTable id="profilesDataList" 
							value="#{permissions.model}" var="to" 
							styleClass="aon-dataTable" 
							rendered="#{permissions.model.rowCount > 0}">
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_cdr_name}" />
							</f:facet>
							<aon:outputText value="#{to.name}"/>
						</aon:column>
			
						<aon:column styleClass="aon-width-240">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_permission_label}" />
							</f:facet>
							<aon:div styleClass="aon-multiple-chekboxes">
					            <aon:selectManyCheckbox id="userData" 
					            		value="#{to.permissions}"
					            		partialSubmit="true"> 
					                <f:selectItems value="#{permissions.values}" />
					            </aon:selectManyCheckbox>
					         </aon:div>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_permission_user}" />
							</f:facet>
							<aon:outputText value="#{to.users}"/>
						</aon:column>
					</aon:dataTable>
						
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
