<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">
		<aon:form id="usersForm" >
			
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:div styleClass="aon-content-subtitle">
						<aon:outputText value="#{menuBundle.aon_permissions}" />	
					</aon:div>

					<aon:div styleClass="aon-section-toolbar">
						<aon:commandButton id="synchButton" 
							styleClass="aon-content-toolbar-item aon-icon-printer"
							actionListener="#{permissions.synchronize}"
				            value="#{menuBundle.aon_permissions_synch}" />
					</aon:div>

					<rich:panel style="padding:0" headerClass="outpanelHeader">
						<aon:div styleClass="aon-group">
							<aon:div styleClass="aon-group-title" id="aon-content-subtitle">
								<aon:outputLabel for="tree" value="#{menuBundle.aon_permissions_profiles}" />
							</aon:div>	
							<aon:dataTable id="profilesDataList" 
									value="#{permissions.model}" var="to" 
									styleClass="aon-dataTable" 
									rendered="#{permissions.model.rowCount > 0}">
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_cdr_name}" />
									</f:facet>
									<aon:outputText value="#{to.name}"/>
								</aon:column>
					
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_permission_label}" />
									</f:facet>
						            <aon:selectManyCheckbox id="userData" 
						            		value="#{to.permissions}"
						            		partialSubmit="true" 
						            		styleClass="selectManyCheckbox">
						                <f:selectItems value="#{permissions.values}" />
						            </aon:selectManyCheckbox>
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_permission_user}" />
									</f:facet>
									<aon:outputText value="#{to.users}"/>
								</aon:column>
							</aon:dataTable>
						</aon:div>	
				    </rich:panel>
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
