<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">
		<aon:form id="usersForm" >
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">
				
					<ui:include src="/facelet/permissions/toolbar.xhtml" />	
							
					<rich:panel style="padding:0" headerClass="outpanelHeader">
						<aon:div styleClass="aon-group">
							<aon:div styleClass="aon-group-title" id="aon-content-subtitle">
								<aon:outputLabel for="tree" value="#{menuBundle.aon_permissions_users}" />
							</aon:div>	

							<aon:div styleClass="aon-section-toolbar">
								<aon:commandButton id="acceptButton" styleClass="aon-content-toolbar-item aon-icon-new"
						            actionListener="#{users.onAccept}"
						            action="permissions_users_list"
						            value="#{menuBundle.aon_ecm_accept}" />
								<aon:commandButton id="deleteButton" styleClass="aon-content-toolbar-item aon-icon-delete"
						            actionListener="#{users.onDelete}"
						            action="permissions_users_list"
						            value="#{menuBundle.aon_ecm_delete}" />
								<aon:commandButton id="backButton" styleClass="aon-content-toolbar-item aon-icon-back"
						            action="permissions_users_list"
						            value="#{menuBundle.aon_ecm_back}" />
							</aon:div>

							<aon:div style="padding:0 1em;">

							</aon:div>	
						</aon:div>	
				    </rich:panel>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
