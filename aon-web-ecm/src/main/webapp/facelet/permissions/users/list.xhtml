<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">
		<aon:form id="usersForm" >
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">
				
					<ui:include src="/facelet/permissions/toolbar.xhtml" />	
							
					<rich:panel style="padding:0" headerClass="outpanelHeader">
						<aon:div styleClass="aon-group">
							<aon:div styleClass="aon-group-title" id="aon-content-subtitle">
								<aon:outputLabel for="tree" value="#{menuBundle.aon_permissions_users}" />
							</aon:div>	

							<aon:div styleClass="aon-section-toolbar">
								<aon:commandButton id="newButton" styleClass="aon-content-toolbar-item aon-icon-new"
						            actionListener="#{users.onNew}"
						            action="permissions_users_form"
						            value="#{menuBundle.aon_ecm_new}" />
							</aon:div>

							<aon:div style="padding:0 1em;">

								<aon:dataTable id="usersDataList" 
										value="#{users.model}" var="to" 
										styleClass="aon-dataTable" 
										rendered="#{users.model.rowCount > 0}">
									<aon:column>
										<aon:rowSelector selectionListener="#{users.selected}" />
										<f:facet name="header">
											<aon:outputText value="#{appBundle.aon_cdr_name}" />
										</f:facet>
										<aon:outputText value="#{to.name}"/>
									</aon:column>
						
									<aon:column>
										<f:facet name="header">
											<aon:outputText value="#{menuBundle.aon_permissions}" />
										</f:facet>
										<aon:outputText value="#{to.permissions}"/>
									</aon:column>
								</aon:dataTable>
							</aon:div>	
						</aon:div>	
				    </rich:panel>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
