<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">
<body>
<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">			
		<aon:div styleClass="aon-scroll-area" >
			<aon:form id="searchForm" >
				<rich:panel style="padding:0" headerClass="outpanelHeader">
			        <f:facet name="header">
						<aon:outputText value="#{menuBundle.aon_search_bycontent}" />
			        </f:facet>
			 		<aon:div styleClass="aon-section-toolbar">
						<aon:outputLabel for="document_content" value="#{appBundle.aon_search_label}" />
						<aon:inputText id="document_content" value="#{search.parameters.bycontent}" size="50" />					                
						<aon:commandButton id="searchButton" value="#{menuBundle.aon_ecm_search}" 
							reRender="searchForm" 
							actionListener="#{search.onExecute}"
							styleClass="aon-content-toolbar-item aon-icon-accept" />
					</aon:div>
					<ui:include src="/facelet/search/results.xhtml" />
				</rich:panel>
			</aon:form>
		</aon:div>		
	</ui:define>

</ui:composition>
</body>
</html>
