<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-components">

<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

<!--
<ui:define name="menu">
	<ui:include src="/facelet/homepage/menu.xhtml" />	
</ui:define>
-->

<ui:define name="content">			
	<aon:form id="searchForm" >
		<aon:div styleClass="aon-scroll-area" >
			<aon:div styleClass="aon-scroll-area-internal">   
		
				<aon:div styleClass="aon-content-subtitle">
					<aon:outputText value="#{menuBundle.aon_search_bycontent}" />	
				</aon:div>
		 
		 		<aon:div styleClass="aon-section-toolbar">
					<aon:commandButton id="searchButton" 
							actionListener="#{search.onExecute}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							value="#{menuBundle.aon_ecm_search}" />
					<aon:commandButton id="documentDownload"
						actionListener="#{search.documents.download}"					
						styleClass="aon-content-toolbar-item aon-icon-mail-save"
						rendered="#{search.menu.visible}"
						title="#{menuBundle.aon_admin_document_download}"
						value="#{menuBundle.aon_admin_document_download}" />
				</aon:div>
							
	    		<ice:panelBorder id="searchPage"
	                     styleClass="panelBorderDemoLayoutMain"
	                     renderCenter="true"
	                     renderNorth="true">
		    		 <f:facet name="north">
						<aon:div styleClass="aon-group" style="text-align:left;">
						    <aon:div styleClass="aon-group-title" id="aon-content-subtitle" forceId="#{true}">
										<aon:outputLabel for="document_content" value="#{appBundle.aon_search_label}" />
							</aon:div>			
							<aon:div style="padding:0 1em;">					
								<aon:inputText id="document_content"
										value="#{search.parameters.bycontent}" size="50" />					                
					        </aon:div>
						  </aon:div>	      			
		   			 </f:facet>
	
				    <f:facet name="center">		    
							<ui:include src="/facelet/search/results.xhtml" />					
				     </f:facet>
				</ice:panelBorder>

			</aon:div>	
		</aon:div>		
	</aon:form>

</ui:define>
</ui:composition>

</body>
</html>
