<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-ice-components">

<body>

<ui:composition>
	<aon:div>
		<aon:div styleClass="aon-section-title" rendered="#{search.documents.model.rowCount > 0}">
			<aon:outputText value="#{appBundle.aon_search_results}"/>
		</aon:div>
		<aon:dataTable id="searchDataList" value="#{search.documents.model}" var="to" 
			styleClass="aon-dataTable" rendered="#{search.documents.model.rowCount > 0}">
		
				<aon:column>
					<aon:rowSelector selectionListener="#{search.documents.documentSelected}" />
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_cdr_name}" />
					</f:facet>
					<aon:outputText value="#{to.name}"/>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_cdr_category}" />
					</f:facet>
					<aon:outputText value="#{to.category}"/>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_cdr_language}" />
					</f:facet>
					<aon:outputText value="#{to.language}"/>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_cdr_author}" />
					</f:facet>
					<aon:outputText value="#{to.author}"/>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_cdr_entrydate}" />
					</f:facet>
					<aon:outputText value="#{to.entryDate}">
	                    <f:convertDateTime pattern="MM/dd/yyyy"/>
	                </aon:outputText>
				</aon:column>
	
			</aon:dataTable>
	</aon:div>
</ui:composition>

</body>
</html>
