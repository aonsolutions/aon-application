<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>
<ui:composition>

	<aon:div styleClass="aon-separator"><aon:outputText value="&#160;" /></aon:div>

	<aon:div rendered="#{search.documents.model.rowCount > 0}">
		<aon:div styleClass="aon-section-title" >
			<aon:outputText value="#{appBundle.aon_search_results}"/>
		</aon:div>
		<aon:dataTable id="searchDataList" value="#{search.documents.model}" var="to" styleClass="aon-dataTable">
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="" />
				</f:facet>
				<h:commandLink id="documentDownload" value="."
						title="#{menuBundle.aon_admin_document_download}"
						actionListener="#{search.onDownloadSelectedDocument}"
						styleClass="aon-icon-commandButton aon-icon-file-download"
						target="_blank" />
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_cdr_name}" />
				</f:facet>
				<aon:outputText value="#{to.name}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_cdr_category}" />
				</f:facet>
				<aon:outputText value="#{to.category}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_cdr_language}" />
				</f:facet>
				<aon:outputText value="#{to.language}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_cdr_author}" />
				</f:facet>
				<aon:outputText value="#{to.userName}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_cdr_entrydate}" />
				</f:facet>
				<aon:outputText value="#{to.created}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </aon:outputText>
			</aon:column>
		</aon:dataTable>
	</aon:div>

</ui:composition>
</body>
</html>
