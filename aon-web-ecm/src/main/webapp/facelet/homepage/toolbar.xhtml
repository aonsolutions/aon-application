<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition>

	<aon:form>					
		<!-- toolbar declaration  -->
		<aon:div styleClass="aon-title-toolbar">
			<aon:div styleClass="aon-content-toolbar">
				<aon:panelGroup>
					<aon:commandButton
							id="ECMindex"
							title="#{menuBundle.aon_ecm_repository}"
							action="admin_repository"
							styleClass="aon-content-toolbar-item aon-icon-index"
							value="#{menuBundle.aon_ecm_repository}" />
					<aon:commandButton
							id="ECMSeach"
							title="#{menuBundle.aon_search_bycontent}"
							action="search_by_content"						
							styleClass="aon-content-toolbar-item aon-icon-search"
							value="#{menuBundle.aon_search_bycontent}" />
					<aon:commandButton
							id="ECMAdvanceSearch"
							title="#{menuBundle.aon_search_advanced}"
							action="advanced_search"						
							styleClass="aon-content-toolbar-item aon-icon-advanced-search"
							value="#{menuBundle.aon_search_advanced}" />
				</aon:panelGroup>
			</aon:div>
		</aon:div>
	</aon:form>

</ui:composition>

</body>
</html>
