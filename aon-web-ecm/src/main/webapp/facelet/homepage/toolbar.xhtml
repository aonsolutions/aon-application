<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>
<ui:composition>
	<aon:form>
		<aon:div styleClass="aon-toolbar">
			<h:panelGroup>
				<h:commandButton id="ECMindex"
						renderedOnUserRole="Manager"
						title="#{menuBundle.aon_ecm_repository}"
						action="admin_repository"
						styleClass="aon-finding-toolbar-item aon-icon-index"
						value="#{menuBundle.aon_ecm_repository}" />
				<h:commandButton id="ECMSeach"
						title="#{menuBundle.aon_search_bycontent}"
						action="search_by_content"
						actionListener="#{search.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						value="#{menuBundle.aon_search_bycontent}" />
				<h:commandButton id="ECMAdvanceSearch"
						title="#{menuBundle.aon_search_advanced}"
						action="advanced_search"
						actionListener="#{search.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-advanced-search"
						value="#{menuBundle.aon_search_advanced}" />
				<h:commandButton id="ECMPermissions"
						renderedOnUserRole="Manager"
						title="#{menuBundle.aon_permissions}"
						action="permissions_list"
						styleClass="aon-finding-toolbar-item aon-icon-user"
						value="#{menuBundle.aon_permissions}" />
			</h:panelGroup>
		</aon:div>
	</aon:form>
</ui:composition>
</body>
</html>
