<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:div id="aon-header" styleClass="aon-desktop-header">
		<aon:div styleClass="aon-connection-status">
			<aon:outputConnectionStatus styleClass="aon-connection-control"/>
		</aon:div>
		<aon:panelGrid columns="2" cellpadding="0" cellspacing="0" width="100%" dir="true">
			<aon:panelGroup>
				<aon:div styleClass="aon-logo">
					<h:graphicImage
						url="#{aonConfiguration.applicationLogoContextRelativePath}"
						alt="#{appBundle.aon_application_title}" />
				</aon:div>
				<aon:div styleClass="aon-applicationName">
					<aon:outputText value="#{appBundle.aon_application_title}" />
				</aon:div>
			</aon:panelGroup>

			<aon:panelGroup>
				<aon:panelGrid columns="2" cellpadding="0" cellspacing="0" width="100%">
					<aon:panelGroup 
						rendered="#{aonConfiguration.properties.middleHeader == null}">
						<aon:div styleClass="aon-header-userAdOnLeft">
							<h:outputText value="&#160;"/>
						</aon:div>
					</aon:panelGroup>

					<aon:panelGroup
						rendered="#{aonConfiguration.properties.middleHeader != null}">
						<aon:div styleClass="aon-header-userAdOnLeft">
							<h:outputText escape="false" value="#{aonConfiguration.properties.middleHeader}" />
						</aon:div>
					</aon:panelGroup>
					<aon:div style="text-align:right;">
						<aon:div styleClass="aon-desktop-header-tab">
							<aon:panelGrid columns="3" cellpadding="5" cellspacing="0">
								<aon:div style="white-space:nowrap;">
									<aon:outputText value="#{manager.userName}" />
								</aon:div>
							</aon:panelGrid>
						</aon:div>
						<h:outputText escape="false" value="#{aonConfiguration.properties.rightHeader}" />
					</aon:div>
				</aon:panelGrid>
			</aon:panelGroup>
		</aon:panelGrid>
	</aon:div>

	<aon:div styleClass="aon-header-bar">
		<aon:panelGrid columns="2" cellpadding="2" cellspacing="0" width="100%">
			<aon:div style="padding-left:1em;font-size:0.9em;color:#fff;">
				<aon:outputText value="#{manager.date}" style="color:#fff;"/>
			</aon:div>
			<aon:div style="text-align:right">
				<h:outputLink style="text-align:right;padding-right:1em;font-size:0.9em;font-weight:bold;" 
					onclick="parent.window.close();" target="_top">
					<aon:outputText value="#{appBundle.aon_application_close}" style="color:#fff;"/>
				</h:outputLink>
			</aon:div>
		</aon:panelGrid>
	</aon:div>

</ui:composition>

</body>
</html>
