# AFI LEAVE TYPE ENUMERATIONS
aon_enum_afi_leave_type_T_51=Départ volontaire/Démission - Démission du travailleur, cessation volontaire du travailleur pendant la période d'essai, résiliation de la relation de travail par la volonté du travailleur pour des motifs non inclus dans une autre clé spécifique, y compris ceux de l'article
aon_enum_afi_leave_type_T_50=ET.
aon_enum_afi_leave_type_T_53=Licenciement disciplinaire individuel - Résiliation du contrat par licenciement disciplinaire individuel réglementé par l'article 54 ET (fondé sur le manquement grave et fautif du travailleur).
aon_enum_afi_leave_type_T_54=Départ non volontaire pour d'autres causes : fin de contrat en situation d'IT du travailleur, fermeture légale de l'entreprise, licenciements découlant du décès ou de la retraite de l'employeur
aon_enum_afi_leave_type_T_55=Départ par fusion-absorption d'entreprise - Départ suite à des fusions, absorptions, scissions d'entreprises impliquant un changement de CCC.
aon_enum_afi_leave_type_T_56=Départ par décès
aon_enum_afi_leave_type_T_58=Départ par passage en situation de pensionné - Retraite et invalidité permanente
aon_enum_afi_leave_type_T_63=Départ par congé volontaire/forcé - Tout congé quelle qu'en soit la cause. (sauf congé maternité)
aon_enum_afi_leave_type_T_65=Départ par épuisement I.T.
aon_enum_afi_leave_type_T_67=Départ par chômage saisonnier - Uniquement Régime spécial des travailleurs de la mer
aon_enum_afi_leave_type_T_68=Départ par congé maternité/garde d'enfants
aon_enum_afi_leave_type_T_69=Départ par suspension temporaire ERE - Suspension de la relation de travail sans prestation ou allocation de chômage et sans qu'il existe un accord dans ERE par lequel l'entreprise acquiert l'obligation de maintien d'inscription et de cotisation pour le travailleur
aon_enum_afi_leave_type_T_73=Départ pour soins de proches
aon_enum_afi_leave_type_T_74=Départ pour autres causes de suspension - Accord mutuel des parties, causes de suspension valablement consignées dans le contrat, passage à l'exercice d'une charge publique représentative, privation de liberté du travailleur tant qu'il n'existe pas de jugement condamnatoire, suspension d'emploi et de salaire.
aon_enum_afi_leave_type_T_76=Départ par congé violence de genre - Uniquement fonctionnaires
aon_enum_afi_leave_type_T_77=Départ par licenciement collectif - Licenciements collectifs régis par l'article 51 ET, extinctions de contrat pour raisons économiques, techniques, organisationnelles ou de production, ainsi que les extinctions dues à la force majeure de l'article 51.7 ET, licenciements collectifs effectués lors d'une procédure de redressement judiciaire régis par l'article 64 de la Loi sur les Procédures Collectives.
aon_enum_afi_leave_type_T_80=Suspension pour violence de genre - Article 45.1.n ET
aon_enum_afi_leave_type_T_85=Départ pour non réussite de la période d'essai - Départ pour non réussite de la période d'essai du contrat dans les conditions établies à l'article 14 ET à l'initiative de l'employeur.
aon_enum_afi_leave_type_T_91=Départ par licenciement pour causes objectives entreprise - Extinction du contrat d'un ou plusieurs travailleurs, pour raisons économiques, techniques, organisationnelles ou de production, sans atteindre les seuils de l'article 51 ET pour lesquels on utilisera la Clé 77. (Article 52 lettre c) ET).
aon_enum_afi_leave_type_T_92=Départ par licenciement pour causes objectives travailleur - Extinctions de contrats pour inaptitude du travailleur (article 52 lettre a) ET), pour défaut d'adaptation aux modifications du poste de travail (article 52 lettre b) ET), ou pour absences (article 52 lettre d) ET).
aon_enum_afi_leave_type_T_93=Départ par fin de contrat temporaire ou à durée déterminée - Départs par fin de contrat sans qu'il y ait eu licenciement. Sont inclus les cas suivants : fin de contrat de chantier, fin de contrat temporaire par circonstances de la production, fin de contrat d'intérim
aon_enum_afi_leave_type_T_94=Départ par passage en inactivité fixes discontinus - Départs découlant de la cessation d'activité des travailleurs fixes discontinus à la fin de la période pour laquelle ils ont été appelés à exercer l'activité. Le départ doit être communiqué autant de fois que se terminent les appels effectués par l'employeur dans le cadre de la relation de travail établie.
aon_enum_afi_leave_type_T_99=Autres causes de départ - Uniquement utilisable pour les situations de garde légale et de changement de poste de travail.

