# AFI LEAVE TYPE ENUMERATIONS
aon_enum_afi_leave_type_T_51=Baixa voluntaria/Dimisión - Dimisión do traballador, cese voluntario do traballador durante o período de proba, rescisión da relación laboral por vontade do traballador por motivos non incluídos noutra chave específica, incluídos os do artigo
aon_enum_afi_leave_type_T_50=ET.
aon_enum_afi_leave_type_T_53=Baixa despedimento disciplinario individual - Baixa por extinción do contrato por despedimento individual disciplinario regulado no artigo 54 ET (baseado no incumprimento grave e culpable do traballador).
aon_enum_afi_leave_type_T_54=Baixa non voluntaria por outras causas Fin de contrato en situación de IT do traballador, peche legal da empresa, despedimentos derivados da morte ou xubilación do empresario
aon_enum_afi_leave_type_T_55=Baixa por fusión - absorción empresa - Baixa como consecuencia de fusións, absorcións, segregacións de empresas que impliquen cambio de CCC.
aon_enum_afi_leave_type_T_56=Baixa por falecemento
aon_enum_afi_leave_type_T_58=Baixa por pase á situación de pensionista - Xubilación e invalidez permanente
aon_enum_afi_leave_type_T_63=Baixa por excedencia voluntaria/forzosa - Calquera excedencia independentemente da causa que a orixine. (excepto excedencia maternal)
aon_enum_afi_leave_type_T_65=Baixa por esgotamento I.T.
aon_enum_afi_leave_type_T_67=Baixa por paro estacional - Só Réxime especial de traballadores do mar
aon_enum_afi_leave_type_T_68=Baixa por excedencia maternal/coidado de fillos
aon_enum_afi_leave_type_T_69=Baixa por suspensión temporal ERE - Suspensión da relación laboral sen prestación ou subsidio de desemprego e sen que exista acordo en ERE polo cal a empresa adquira a obrigación de mantemento de alta e cotización polo traballador
aon_enum_afi_leave_type_T_73=Baixa por coidado de familiares
aon_enum_afi_leave_type_T_74=Baixa por outras causas de suspensión - Mutuo acordo das partes, causas de suspensión consignadas válidamente no contrato, pase a exercicio de cargo público representativo, privación de liberdade do traballador mentres non existe sentenza condenatoria, suspensión de emprego e soldo.
aon_enum_afi_leave_type_T_76=Baixa por excedencia violencia de xénero - Só funcionarios
aon_enum_afi_leave_type_T_77=Baixa por despedimento colectivo - Despedimentos colectivos que se rexen polo artigo 51 do ET, extincións de contrato por causas económicas, técnicas, organizativas ou de producción, así como as extincións derivadas de forza maior do artigo 51.7 ET, despedimentos colectivos levados a cabo durante un proceso de concurso de acredores que se rexen polo artigo 64 da Lei Concursal.
aon_enum_afi_leave_type_T_80=Suspensión por violencia de xénero - Artigo 45.1.n do ET
aon_enum_afi_leave_type_T_85=Baixa por non superar o período de proba - Baixa por non superar o período de proba do contrato nos termos establecidos no artigo 14 ET con desistimento do empresario.
aon_enum_afi_leave_type_T_91=Baixa por despedimento por causas obxectivas empresa - Extinción do contrato dun ou máis traballadores, por causas económicas, técnicas, organizativas ou de producción, sen alcanzar os umbrais do artigo 51 ET para os que se utilizará a Chave 77. (Artigo 52 letra c) ET).
aon_enum_afi_leave_type_T_92=Baixa por despedimento por causas obxectivas traballador - Extincións de contratos por ineptitude do traballador (artigo 52 letra a) ET), por falta de adaptación ás modificacións do posto de traballo (artigo 52 letra b) ET), ou por faltas de asistencia (artigo 52 letra d) ET).
aon_enum_afi_leave_type_T_93=Baixa por fin contrato temporal ou de duración determinada - Baixas por finalización de contrato nas que non se produciu un despedimento. Incluiranse os seguintes supostos: fin de contrato de obra e servizo, fin de contrato eventual por circunstancias da producción, fin de contrato de interinidade
aon_enum_afi_leave_type_T_94=Baixa por pase a inactividade fixos discontinuos - Baixas derivadas do cese da actividade dos traballadores fixos discontinuos ao finalizar o período polo que foron chamados para exercer a actividade. A baixa debe comunicarse tantas veces como finalicen os chamamentos realizados polo empresario dentro da relación laboral establecida.
aon_enum_afi_leave_type_T_99=Outras causas de baixa - Só utilizable para situacións de garda legal e cambio de posto de traballo.

