payroll_mod145_header3=De conformitat amb el que disposa l'article 5 de la Llei Orgànica 15/1999, de 13 de desembre, de Protecció de Dades de Caràcter Personal, el perceptor tindrà dret a ser informat prèviament de l'existència d'un fitxer o tractament de dades de caràcter personal, de la finalitat de la recollida d'aquests i dels destinataris de la informació, de la identitat i adreça del responsable del tractament o, si és el cas, del seu representant, així com de la possibilitat d'exercitar els seus drets d'accés, rectificació o cancel·lació dels mateixos.
