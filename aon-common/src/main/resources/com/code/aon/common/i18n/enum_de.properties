# AFI LEAVE TYPE ENUMERATIONS
aon_enum_afi_leave_type_T_51=Freiwillige Kündigung/Rücktritt - Rücktritt des Arbeitnehmers, freiwillige Beendigung des Arbeitsverhältnisses während der Probezeit, Auflösung des Arbeitsverhältnisses auf Veranlassung des Arbeitnehmers aus Gründen, die nicht unter einen anderen spezifischen Schlüssel fallen, einschließlich Artikel
aon_enum_afi_leave_type_T_50=ET.
aon_enum_afi_leave_type_T_53=Abmeldung wegen fristloser Kündigung - Abmeldung durch Beendigung des Vertrags infolge individueller Disziplinarkündigung gemäß Artikel 54 ET (basierend auf schwerwiegenden und verschuldeten Pflichtverletzungen des Arbeitnehmers).
aon_enum_afi_leave_type_T_54=Unfreiwillige Abmeldung aus anderen Gründen: Vertragsende bei vorübergehender Arbeitsunfähigkeit des Arbeitnehmers, gesetzliche Betriebsschließung, Entlassungen infolge des Todes oder der Pensionierung des Arbeitgebers
aon_enum_afi_leave_type_T_55=Abmeldung durch Fusion/Übernahme eines Unternehmens - Abmeldung infolge von Fusionen, Übernahmen, Unternehmensabspaltungen, die eine Änderung der Beitragskontonummer bedingen.
aon_enum_afi_leave_type_T_56=Abmeldung wegen Todes
aon_enum_afi_leave_type_T_58=Abmeldung wegen Übergang in den Rentenstatus - Rente und dauernde Erwerbsminderung
aon_enum_afi_leave_type_T_63=Abmeldung wegen freiwilligen/erzwungenen Ruhestands - Jede Form des Sonderurlaubs unabhängig vom Grund (ausgenommen Mutterschaftsurlaub)
aon_enum_afi_leave_type_T_65=Abmeldung wegen Erschöpfung der vorübergehenden Arbeitsunfähigkeit
aon_enum_afi_leave_type_T_67=Abmeldung wegen saisonaler Arbeitslosigkeit - Nur Sonderregime für Seeleute
aon_enum_afi_leave_type_T_68=Abmeldung wegen Mutterschafts-/Elternzeit zur Kinderbetreuung
aon_enum_afi_leave_type_T_69=Abmeldung wegen vorübergehender ERE-Aussetzung - Aussetzung des Arbeitsverhältnisses ohne Arbeitslosengeld oder -unterstützung und ohne ERE-Vereinbarung, durch die das Unternehmen zur Aufrechterhaltung der Anmeldung und Beitragszahlung für den Arbeitnehmer verpflichtet wird
aon_enum_afi_leave_type_T_73=Abmeldung zur Pflege von Familienangehörigen
aon_enum_afi_leave_type_T_74=Abmeldung aus anderen Aussetzungsgründen - Gegenseitige Vereinbarung der Parteien, vertraglich gültig festgehaltene Aussetzungsgründe, Übernahme eines öffentlichen Wahlmandats, Freiheitsentzug des Arbeitnehmers ohne rechtskräftiges Urteil, Suspendierung von Beschäftigung und Gehalt.
aon_enum_afi_leave_type_T_76=Abmeldung wegen Sonderurlaub bei häuslicher Gewalt - Nur Beamte
aon_enum_afi_leave_type_T_77=Abmeldung wegen Massenentlassung - Massenentlassungen gemäß Artikel 51 ET, Vertragsauflösungen aus wirtschaftlichen, technischen, organisatorischen oder produktionsbedingten Gründen sowie Auflösungen infolge höherer Gewalt gemäß Artikel 51.7 ET, Massenentlassungen im Rahmen eines Insolvenzverfahrens gemäß Artikel 64 des Insolvenzgesetzes.
aon_enum_afi_leave_type_T_80=Aussetzung wegen häuslicher Gewalt - Artikel 45.1.n ET
aon_enum_afi_leave_type_T_85=Abmeldung wegen Nichtbestehen der Probezeit - Abmeldung wegen Nichtbestehen der Probezeit des Vertrags unter den in Artikel 14 ET festgelegten Bedingungen auf Initiative des Arbeitgebers.
aon_enum_afi_leave_type_T_91=Abmeldung wegen betriebsbedingter Kündigung - Beendigung des Vertrags eines oder mehrerer Arbeitnehmer aus wirtschaftlichen, technischen, organisatorischen oder produktionsbedingten Gründen, ohne die Schwellenwerte des Artikels 51 ET zu erreichen, für die Schlüssel 77 verwendet wird. (Artikel 52 Buchstabe c) ET).
aon_enum_afi_leave_type_T_92=Abmeldung wegen objektiver Kündigung auf Arbeitnehmerseite - Vertragsauflösungen wegen Unfähigkeit des Arbeitnehmers (Artikel 52 Buchstabe a) ET), wegen mangelnder Anpassung an Arbeitsplatzänderungen (Artikel 52 Buchstabe b) ET) oder wegen Fehlzeiten (Artikel 52 Buchstabe d) ET).
aon_enum_afi_leave_type_T_93=Abmeldung wegen Ablauf eines befristeten Vertrags - Abmeldungen wegen Vertragsablauf ohne Kündigung. Eingeschlossen sind folgende Fälle: Ende eines Werk- und Dienstvertrags, Ende eines Gelegenheitsvertrags wegen Produktionsumständen, Ende eines Vertretungsvertrags
aon_enum_afi_leave_type_T_94=Abmeldung zum Übergang in Inaktivität für Festangestellte mit diskontinuierlicher Beschäftigung - Abmeldungen infolge der Einstellung der Tätigkeit diskontinuierlicher Festangestellter am Ende des Zeitraums, für den sie zur Arbeit aufgerufen wurden. Die Abmeldung ist so oft zu übermitteln, wie Aufrufe des Arbeitgebers im Rahmen des bestehenden Arbeitsverhältnisses enden.
aon_enum_afi_leave_type_T_99=Sonstige Abmeldegründe - Nur verwendbar für Situationen der gesetzlichen Betreuung und Arbeitsplatzwechsel.

