# AFI LEAVE TYPE ENUMERATIONS
aon_enum_afi_leave_type_T_51=Baixa voluntària/Dimissió - Dimissió del treballador, cessament voluntari del treballador durant el període de prova, rescissió de la relació laboral per voluntat del treballador per motius no inclosos en cap altra clau específica, inclosos els de l'article
aon_enum_afi_leave_type_T_50=ET.
aon_enum_afi_leave_type_T_53=Baixa acomiadament disciplinari individual - Baixa per extinció del contracte per acomiadament individual disciplinari regulat a l'article 54 ET (basat en l'incompliment greu i culpable del treballador).
aon_enum_afi_leave_type_T_54=Baixa no voluntària per altres causes Fi de contracte en situació d'IT del treballador, tancament legal de l'empresa, acomiadaments derivats de la mort o jubilació de l'empresari
aon_enum_afi_leave_type_T_55=Baixa per fusió - absorció empresa - Baixa com a conseqüència de fusions, absorcions, segregacions d'empreses que impliquen canvi de CCC.
aon_enum_afi_leave_type_T_56=Baixa per defunció
aon_enum_afi_leave_type_T_58=Baixa per pas a la situació de pensionista - Jubilació i invalidesa permanent
aon_enum_afi_leave_type_T_63=Baixa per excedència voluntària/forçosa - Qualsevol excedència independentment de la causa que l'origini. (excepte excedència maternal)
aon_enum_afi_leave_type_T_65=Baixa per esgotament I.T.
aon_enum_afi_leave_type_T_67=Baixa per atur estacional - Només Règim especial de treballadors del mar
aon_enum_afi_leave_type_T_68=Baixa per excedència maternal/cura de fills
aon_enum_afi_leave_type_T_69=Baixa per suspensió temporal ERE - Suspensió de la relació laboral sense prestació o subsidi d'atur i sense que existeixi acord en ERE pel qual l'empresa adquireixi l'obligació de manteniment d'alta i cotització pel treballador
aon_enum_afi_leave_type_T_73=Baixa per cura de familiars
aon_enum_afi_leave_type_T_74=Baixa per altres causes de suspensió - Mutu acord de les parts, causes de suspensió consignades vàlidament en el contracte, pas a exercici de càrrec públic representatiu, privació de llibertat del treballador mentre no existeix sentència condemnatòria, suspensió d'ocupació i sou.
aon_enum_afi_leave_type_T_76=Baixa per excedència violència de gènere - Només funcionaris
aon_enum_afi_leave_type_T_77=Baixa per acomiadament col·lectiu - Acomiadaments col·lectius que es regeixen per l'article 51 de l'ET, extincions de contracte per causes econòmiques, tècniques, organitzatives o de producció, així com les extincions derivades de força major de l'article 51.7 ET, acomiadaments col·lectius duts a terme durant un procés de concurs de creditors que es regeixen per l'article 64 de la Llei Concursal.
aon_enum_afi_leave_type_T_80=Suspensió per violència de gènere - Article 45.1.n de l'ET
aon_enum_afi_leave_type_T_85=Baixa per no superar el període de prova - Baixa per no superar el període de prova del contracte en els termes establerts a l'article 14 ET amb desistiment de l'empresari.
aon_enum_afi_leave_type_T_91=Baixa per acomiadament per causes objectives empresa - Extinció del contracte d'un o més treballadors, per causes econòmiques, tècniques, organitzatives o de producció, sense assolir els llindars de l'article 51 ET pels quals s'utilitzarà la Clau 77. (Article 52 lletra c) ET).
aon_enum_afi_leave_type_T_92=Baixa per acomiadament per causes objectives treballador - Extincions de contractes per ineptitud del treballador (article 52 lletra a) ET), per falta d'adaptació a les modificacions del lloc de treball (article 52 lletra b) ET), o per faltes d'assistència (article 52 lletra d) ET).
aon_enum_afi_leave_type_T_93=Baixa per fi contracte temporal o de durada determinada - Baixes per finalització de contracte en les quals no s'ha produït un acomiadament. S'inclouran els supòsits següents: fi de contracte d'obra i servei, fi de contracte eventual per circumstàncies de la producció, fi de contracte d'interinitat
aon_enum_afi_leave_type_T_94=Baixa per pas a inactivitat fixos discontinus - Baixes derivades del cessament de l'activitat dels treballadors fixos discontinus en finalitzar el període pel qual van ser cridats per exercir l'activitat. La baixa s'ha de comunicar tantes vegades com finalitzin les crides realitzades per l'empresari dins de la relació laboral establerta.
aon_enum_afi_leave_type_T_99=Altres causes de baixa - Només utilitzable per a situacions de guarda legal i canvi de lloc de treball.

