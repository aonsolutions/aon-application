tas_footer_text_4=Aurrekonturik egin gabe konponketa egitea onartzen dut eta bere langileei nire ondasuna den ibilgailua errepideetatik beharrezkoak deritzoten frogak egiteko eramateko baimena ematen diet. Lanak ekin ordaindu beharko dira (ibilgailua entregatzerakoan). Konponketa honek hiru hilabeteko bermea du edo 2.000 Km., entrega datatik hasita. Konponketan agertzen diren ezkutatutako matxurak edo akatsak nire onarpena lortzeko aurkeztuko zaizkit. Berme aldian egindako konponketetan, bezeroak piezak ordainduko ditu, berme liburuan zehazten den bezala.
