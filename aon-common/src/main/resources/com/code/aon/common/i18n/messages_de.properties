tas_footer_text_3=Ich akzeptiere die Erstellung des Kostenvoranschlags und den Ausbau der dafür notwendigen Elemente und Baugruppen.
tas_footer_text_4=Ich akzeptiere die Durchführung der Reparatur ohne Erstellung eines Kostenvoranschlags und ermächtige die Mitarbeiter, das mir gehörende oben genannte Fahrzeug auf Straßen und Wegen zu fahren, um die erforderlichen Tests durchzuführen. Die Arbeiten werden gegen Barzahlung (bei Fahrzeugübergabe) abgerechnet. Diese Reparatur hat eine Garantiezeit von drei Monaten oder 2.000 km ab Lieferdatum. Verdeckte Mängel oder Defekte, die während der Reparatur auftreten können, werden mir zur Genehmigung vorgelegt. Bei Reparaturen innerhalb der Garantiezeit zahlt der Kunde die Teile gemäß den Angaben im Garantiebuch.
