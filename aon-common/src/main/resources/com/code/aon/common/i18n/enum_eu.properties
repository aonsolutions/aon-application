# AFI LEAVE TYPE ENUMERATIONS
aon_enum_afi_leave_type_T_51=Borondatezko baja/Dimisioa - Langileak lan-harremana berariaz hautsi duelako, probaldian borondatez utzi duelako edo beste gako espezifiko batean ez dauden arrazoiengatik langileak lan-harremana berariaz hautsi duelako, Estatutuaren artikuluan jasotakoak barne
aon_enum_afi_leave_type_T_50=ET.
aon_enum_afi_leave_type_T_53=Baja diziplina-kaleratzea banakoa - Langileak 54. artikuluan araututako banakako diziplina-kaleratzea dela eta kontratua deuseztatu delako (langileak egin duen bete-beharren ez-betetzea larria eta erruduna denean).
aon_enum_afi_leave_type_T_54=Borondatezkoa ez den baja beste arrazoiengatik - Kontratua amaitzen da IT egoeran dagoen langileagatik, enpresaren legezko itxieragatik edo enpresariaren heriotza edo jubilazioagatik eratortzen diren kaleratzeak
aon_enum_afi_leave_type_T_55=Baja bategite-xurgapenagatik - Baja, CCC aldaketa dakarren enpresa bategiteak, xurgapenak edo zatitzeak direla-eta
aon_enum_afi_leave_type_T_56=Baja heriotzagatik
aon_enum_afi_leave_type_T_58=Baja pentsiodun egoerara igarotzeagatik - Jubilazio eta ezintasun iraunkorra
aon_enum_afi_leave_type_T_63=Baja borondatezko/beharrezko eszedentzia - Edozein eszedentzia, sorrarazi duen arrazoiari erreparatu gabe (amatasun eszedentzia salbu)
aon_enum_afi_leave_type_T_65=Baja IT agortzeagatik
aon_enum_afi_leave_type_T_67=Baja sasoiko langabeziara - Itsasoko langileen araubide berezi soilik
aon_enum_afi_leave_type_T_68=Baja amatasun eszedentzia/semealaben zaintza
aon_enum_afi_leave_type_T_69=Baja ERE aldi baterako etendura - Lan-harremanaren etendura, langabezi prestaziorik edo subsidioric gabe, eta ERE akordiorik gabe zeinaren bidez enpresak langileak altan eta kotizatzen mantentzeko betebeharra bereganatzen duen
aon_enum_afi_leave_type_T_73=Baja familiakoen zaintzagatik
aon_enum_afi_leave_type_T_74=Baja etendurako beste arrazoiengatik - Aldeen arteko adostasun elkarrekikoa, kontratuan baliozkotasunez idatzitako etendura arrazoiak, kargu publiko ordezkatzailera igarotea, langileak epai kondenagabea dagoen bitartean askatasun galeragatik, enplegu eta soldataren etendura.
aon_enum_afi_leave_type_T_76=Baja genero-indarkeriako eszedentzia - Funtzionario soilik
aon_enum_afi_leave_type_T_77=Baja kolektibo kaleratzea - Kolektibo kaleratzeak, ETko 51. artikuluak arautzen dituena, arrazoi ekonomiko, tekniko, antolaketa edo ekoizpen kausa dela-eta kontratu iraungitzeak, baita ETko 51.7 artikuluko beharrezko kausa dela-eta iraungitzeak ere, harginegileen lehia prozesuan zehar egindako kaleratzeak, Konkurtso Legearen 64. artikuluak arautzen dituenak.
aon_enum_afi_leave_type_T_80=Genero-indarkeriagatiko etendura - ET 45.1.n artikulua
aon_enum_afi_leave_type_T_85=Baja probaldian gainditze ezagatik - Baja, ETko 14. artikuluan ezarritako terminoetan enpresariak atzera eginda kontratuaren probaldian gainditze ezagatik.
aon_enum_afi_leave_type_T_91=Baja enpresa arrazoien araberako kaleratzea - Langile baten edo gehiagoren kontratua deuseztatzea, arrazoi ekonomiko, tekniko, antolaketa edo ekoizpenengatik, C 77 Gakoa erabili behar diren ETko 51. artikuluko atalaseak lortu gabe. (ETko 52. artikulua c) letra).
aon_enum_afi_leave_type_T_92=Baja langile arrazoien araberako kaleratzea - Langilearen ezintasunagatik (ETko 52. artikulua a) letra), lanpostuaren aldaketarako egokitze ezagatik (ETko 52. artikulua b) letra) edo hutsegiteengatik (ETko 52. artikulua d) letra) kontratuak deuseztatzea.
aon_enum_afi_leave_type_T_93=Baja aldi baterako edo iraupena zehaztutako kontratuaren amaieragatik - Kaleratzea gertatu ez den kontratu amaieraren baxak. Hauek sartuko dira: obra eta zerbitzu kontratua, ekoizpen inguruabarrengatiko kontingente kontratu amaiera, interinitate kontratu amaiera
aon_enum_afi_leave_type_T_94=Baja etengabeko finkoen inaktibitatera - Aktibitate aldirako deitutako etengabeko finkoen jarduera uzteagatik eratortzen diren bajak. Baja enpresariak egindako deien aldiak amaitzen den bakoitzean jakinarazi beharko da ezarritako lan-harremanaren barruan.
aon_enum_afi_leave_type_T_99=Bajaren beste arrazoiak - Legezko zaintza egoeratan eta lanpostuz aldatzeetan soilik erabilgarri.

