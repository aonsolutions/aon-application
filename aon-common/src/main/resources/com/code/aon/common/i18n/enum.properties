# AFI LEAVE TYPE ENUMERATIONS
aon_enum_afi_leave_type_T_51=Baja voluntaria/Dimisión - Dimisión del trabajado, cese voluntario del trabajador durante el período de prueba, rescisión de la relación laboral por voluntad del trabajador por motivos no incluidos en otra clave específica, incluidos los del artículo
aon_enum_afi_leave_type_T_50=ET.
aon_enum_afi_leave_type_T_53=Baja despido disciplinario individual - Baja por extinción del contrato por despido individual disciplinario regulado en le artículo 54 ET (basado en le incumplimiento grave y culpable del trabajador).
aon_enum_afi_leave_type_T_54=Baja no voluntaria por otras causas Fin de contrato en situación de IT del trabajador, cierre legal de la empresa, despidos derivados de la muerte o jubilación del empresario
aon_enum_afi_leave_type_T_55=Baja por fusión - absorción empresa - Baja como consecuencia de fusiones, absorciones, segregaciones de empresas que implequen cambio de CCC.
aon_enum_afi_leave_type_T_56=Baja por fallecimiento
aon_enum_afi_leave_type_T_58=Baja por pase a la situación de pensionista - Jubilación e invalidez permanente
aon_enum_afi_leave_type_T_63=Baja por excedencia voluntaria/forzosa - Cualquier excedencia independientemente de la causa que la origine. (excepto excedencia maternal)
aon_enum_afi_leave_type_T_65=Baja por agotamiento I.T.
aon_enum_afi_leave_type_T_67=Baja por paro estacional - Sólo Régimen especial de trabajadores del mar
aon_enum_afi_leave_type_T_68=Baja por excedencia maternal/cuidado de hijos
aon_enum_afi_leave_type_T_69=Baja por suspensión temporal ERE - Suspensión de la relación laboral sin prestación o subsidio de desempleo y sin que exista acuerdo en ERE por el cual la empresa adquiera la obligación de mantenimiento de alta y cotización por el trabajador
aon_enum_afi_leave_type_T_73=Baja por cuidado de familiares
aon_enum_afi_leave_type_T_74=Baja por otras causas de suspensión - Mutuo acuerdo de las partes, causas de suspensión consignadas válidamente en el contrato, pase a ejercicio de cargo público representativo, privación de libertad del trabajador mientras no existe sentencia condenatoria, suspensión de empleo y sueldo.
aon_enum_afi_leave_type_T_76=Baja por excedencia violencia de género - Sólo funcionarios
aon_enum_afi_leave_type_T_77=Baja por despido colectivo - Despidos colectivos que se rigen por el rtículo 51 del ET, extinciones de contrato por causas económicas, técnicas, organizativas o deproducción, así como las extinciones derivadas de fuerza mayor del artículo 51.7 ET, despidos colectivos llevados a cabo durante un proceso de concurso de acreedores que se rigen por el artículo 64 de la Ley Concursal.
aon_enum_afi_leave_type_T_80=Suspensión por violencia de género - Artículo 45.1.n del ET
aon_enum_afi_leave_type_T_85=Baja por no superar el período de prueba - Baja por no superar el período de prueba del contrato en los términos establecidos en el artículo 14 ET con desistimiento del empresario.
aon_enum_afi_leave_type_T_91=Baja por despido por causas objetivas empresa - Extinción del contrato de uno o más trabajadores, por causas ecónomicas, técnicas, organizativas o de producción, sin alcanzar los umbrales del artículo 51 ET para los que se utilizará la Clave 77. (Artículo 52 letra c) ET).
aon_enum_afi_leave_type_T_92=Baja por despido por causas objetivas trabajador - Extinciónes de contratos por ineptitud del trabajador (artículo 52 letra a) ET), por falta deadaptación a las modificaciones del puesto de trabajo (artículo 52 letra b) ET), o por faltas deasistencia (artículo 52 letra d) ET).
aon_enum_afi_leave_type_T_93=Baja por fin contrato temporal o de duración determinada - Bajas por finalización de contrato en las que no se ha producido un despido. Se incluirán los siguientes supuestos: fin de contrato de obra y servicio, fin de contrato eventual por circustancias de la producción, fin de contrato de interinidad
aon_enum_afi_leave_type_T_94=Baja por pase a inactividad fijos discontinuos - Bajas derivadas del cese de la actividad de los trabajadores fijos discontinuos al finalizar el período por el que fueron llamados para ejercer la actividad. La baja debe de comunicarse tantas veces como finalicen los llamamientos realizados por el empresario dentro de la relación laboral establecida.
aon_enum_afi_leave_type_T_99=Otras causas de baja - Sólo utilizable para situaciones de guarda legal y cambio de puesto de trabajo.
		
