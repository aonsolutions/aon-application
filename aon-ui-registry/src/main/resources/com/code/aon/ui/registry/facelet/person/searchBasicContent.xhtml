<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
	</aon:if>

	<aon:outputLabel for="Person_firstSurname" value="#{bundle.payroll_mod145_perceptor10}" />
	<aon:inputText id="Person_firstSurname" size="40" valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Person_secondSurname"	value="#{bundle.registry_person_secondSurname}" />
	<aon:inputText id="Person_secondSurname" size="40" valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Person_name"	value="#{bundle.aon_name}" />
	<aon:inputText id="Person_name" size="40" valueChangeListener="#{controller.addExpression}" />
	
	<aon:outputLabel for="Person_registry_alias" value="#{bundle.aon_alias}" />
	<aon:inputText id="Person_registry_alias" size="40" valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Person_registry_document"	value="#{bundle.aon_document}" />
	<aon:inputText id="#{controller.pojoShortName}_registry_document" size="12"	valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Person_registry_id" value="#{bundle.aon_id}" />
	<aon:inputText id="#{controller.pojoShortName}_registry_id" size="12" valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Person_socialSecurityNumber"	value="#{bundle.registry_person_nss}" />
	<aon:inputText id="Person_socialSecurityNumber" size="20"	valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Person_gender" value="#{bundle.registry_person_gender}" />
	<aon:selectOneMenu id="Person_gender" converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{registryCollections.genders}" />
	</aon:selectOneMenu>
				
	<aon:outputLabel for="Person_maritalStatus"	value="#{bundle.registry_person_marital_status}" />
	<aon:selectOneMenu id="Person_maritalStatus" converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{registryCollections.maritalStatuses}" />
	</aon:selectOneMenu>
	
	<aon:if test="#{aonRole.confidentiality}">
		<aon:outputLabel for="Person_registry_securityLevel"
			value="#{bundle.aon_confidential}" />
		<aon:selectOneRadio id="Person_registry_securityLevel"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
		</aon:selectOneRadio>				
	</aon:if>

</ui:composition>
