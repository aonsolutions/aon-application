<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:outputLabel for="Seller_id" value="#{bundle.aon_module_commercial}" />
	<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{controller.to.seller}" />
		<ui:param name="skipLabel" value="#{true}" />
		<ui:param name="idRequired" value="#{true}" />
		<ui:param name="lookupInputSuggestSize" value="40" />
	</ui:include>

	<aon:outputLabel for="RegistrySeller_startDate" value="#{bundle.aon_start_date}" />
	<aon:selectInputDate id="RegistrySeller_startDate" 
		value="#{controller.to.startDate}" required="true"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}"/>

	<aon:outputLabel for="RegistrySeller_endDate" value="#{bundle.aon_end_date}" />
	<aon:selectInputDate id="RegistrySeller_endDate" 
		value="#{controller.to.endDate}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}"/>
		
	<aon:outputLabel for="RegistrySeller_status" value="#{bundle.aon_status}" />
	<aon:selectOneMenu id="RegistrySeller_status" 
		required="true" value="#{controller.to.status}">
		<f:selectItems value="#{registryCollections.registrySellerStatuses}" />
	</aon:selectOneMenu>
	
	<aon:outputLabel for="RegistrySeller_type" value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="RegistrySeller_type" 
		required="true" value="#{controller.to.type}">
		<f:selectItems value="#{registryCollections.registrySellerTypes}" />
	</aon:selectOneMenu>								
		
</ui:composition>
