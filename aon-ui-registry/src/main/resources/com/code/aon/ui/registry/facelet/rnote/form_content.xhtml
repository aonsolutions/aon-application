<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputText value="#{bundle.aon_description}" />
	<aon:inputText id="RegistryNote_description-Edit"
		maxlength="64" size="30"
		value="#{controller.to.description}" />

	<h:outputText value="#{bundle.aon_date}" />
	<aon:selectInputDate 
		popupDateFormat="#{bundle.aon_date_pattern}"
		value="#{controller.to.noteDate}" />

	<aon:outputText value="#{bundle.aon_confidential}" />
	<aon:selectBooleanCheckbox id="RegistryNote_securityLevel"
		value="#{controller.to.confidential}"  />

	<aon:outputText value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="RegistryNote_notetype-Edit"
		value="#{controller.to.notetype}" >
		<f:selectItems value="#{registryCollections.noteTypes}" />
	</aon:selectOneMenu>

	<aon:outputText value="#{registryBundle.registry_observation}" />
	<aon:inputTextarea id="RegistryNote_comments-Edit"
		value="#{controller.to.comments}"
		cols="50" rows="5" />

</ui:composition>
