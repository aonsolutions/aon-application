<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="#{searchController.preffix}addresses_streetType"
		value="#{registryBundle.registry_street_type}" />
	<aon:selectOneMenu id="#{searchController.preffix}addresses_streetType"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addExpression}" >
		<f:selectItem value="#{null}" itemLabel="-"/>
		<f:selectItems value="#{registryCollections.streetTypes}" />
	</aon:selectOneMenu>		
	<aon:outputLabel for="#{searchController.preffix}addresses_address"
		value="#{bundle.aon_address}" />
	<aon:inputText id="#{searchController.preffix}addresses_address" size="60"
		valueChangeListener="#{controller.addExpression}" />
	<aon:outputLabel for="#{searchController.preffix}addresses_number"
		value="#{bundle.aon_number}" />
	<aon:inputText id="#{searchController.preffix}addresses_number" size="12"
		valueChangeListener="#{controller.addExpression}" />
	<aon:outputLabel for="#{searchController.preffix}addresses_zip"
		value="#{bundle.aon_postal_code}" />
	<aon:inputText id="#{searchController.preffix}addresses_zip" size="12"
		valueChangeListener="#{controller.addExpression}" />
	<aon:outputLabel for="#{searchController.preffix}addresses_city"
		value="#{registryBundle.registry_city}" />
	<aon:inputText id="#{searchController.preffix}addresses_city" size="60"
		valueChangeListener="#{controller.addExpression}" />
	<aon:outputLabel for="#{searchController.preffix}addresses_geozone_id"
		value="#{bundle.aon_state}" />
	<aon:div id="geoZoneDiv">
		<a4j:region>
			<a4j:repeat value="#{searchController.geoZones}" rowKeyVar="index" var="geoZone">
				<aon:div styleClass="#{(index != 0)?'aon-padding-top':''}">
					<aon:selectOneMenu id="#{searchController.preffix}addresses_geozone_id"
						value="#{searchController.geoZones[index]}">
						<f:selectItem itemLabel="-" itemValue="#{searchController.emptyGeoZone}"/>
						<f:selectItems value="#{geozoneCollections.geoTrees}" />
						<a4j:support event="onchange" reRender="geoZoneDiv"/>
					</aon:selectOneMenu>
					<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
						actionListener="#{searchController.onRemoveGeoZone}" reRender="geoZoneDiv" value="&#160;"
						rendered="#{geoZone.id != null}">
						<f:param name="index" value="#{index}" />
					</aon:commandButton>
					<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" ajaxSingle="true"
						actionListener="#{searchController.onAddGeoZone}" reRender="geoZoneDiv" value="&#160;"
						rendered="#{(geoZone.id != null) and (index == (searchController.geoZonesSize-1))}"/>					
				</aon:div>						
			</a4j:repeat>
		</a4j:region>
	</aon:div>			

</ui:composition>
