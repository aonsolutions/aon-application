<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<c:if test="#{lookupForRegistry}">
		<aon:valueParam name="lookupProperty" default="registry"/>
		<aon:valueParam name="lookupInputSuggestValue" default="#{lookupTo.name}"/>
		<aon:valueParam name="lookupInputNameDisabled" default="#{lookupDisabled}"/>
	</c:if>
	<aon:valueParam name="lookupInputSuggestValue" default="#{lookupTo.registry.name}"/>

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/lookup.xhtml" >
		<aon:valueParam name="lookupInputSuggestExpression" default="#{lto.registry.name} (#{lto.id})"/>	

		<ui:define name="afterLookupContent">
			<c:if test="#{skipSuggestText}">
				<aon:inputText id="#{pojoName}_name#{lookupSuffix}"
					value="#{lookupInputNameValue}" 
					disabled="#{lookupInputNameDisabled}" size="#{lookupInputSuggestSize}"
					rendered="#{lookupInputNameValue != null}" />
			</c:if>
			<ui:insert name="afterLookupContent2"/>
		</ui:define>
	</ui:decorate>

</ui:composition>
