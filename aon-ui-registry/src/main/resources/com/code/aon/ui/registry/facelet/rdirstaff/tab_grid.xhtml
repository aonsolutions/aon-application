<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="columnClasses" value="aon-editDataTable-textColumn aon-width-100,aon-editDataTable-textColumn aon-width-auto,aon-width-80,aon-width-80,aon-width-80,aon-width-80,aon-editDataTable-numberColumn aon-width-80,aon-editDataTable-numberColumn aon-width-80,aon-editDataTable-numberColumn aon-width-100,aon-editDataTable-textColumn aon-width-100" />
		
		<ui:define name="columns">
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_company_document}" />
				</f:facet>
				<aon:outputText value="#{to.document}" rendered="#{formList}" />
				<aon:inputText id="Registry_Lookup_document-Edit" size="16"
					rendered="#{formEdit}" value="#{controller.to.document}" >
					<a4j:support event="onchange" ajaxSingle="true"
						reRender="Registry_full_name-Edit" focus="Registry_full_name-Edit"
						actionListener="#{controller.onDocumentChange}"/>
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="Registry_Lookup_document-New" size="16"
						rendered="#{formNew}" required="true"
						value="#{controller.to.document}"> 
						<a4j:support event="onchange" ajaxSingle="true"
							reRender="Registry_full_name-New" focus="Registry_full_name-New"
							actionListener="#{controller.onDocumentChange}"/>
					</aon:inputText>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.name}" rendered="#{formList}" />
				<aon:inputText id="Registry_full_name-Edit" rendered="#{formEdit}"
					size="40" value="#{controller.to.name}" />
				<f:facet name="footer">
					<aon:inputText id="Registry_full_name-New" rendered="#{formNew}"
						size="40" value="#{controller.to.name}" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_email}" />
				</f:facet>
				<aon:outputText value="#{to.chargeDescription}" rendered="#{formList}" />
				<aon:inputText rendered="#{formEdit}"
					size="40" value="#{controller.to.chargeDescription}" />
				<f:facet name="footer">
					<aon:inputText rendered="#{formNew}"
						size="40" value="#{controller.to.chargeDescription}" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.registry_dir_staff_is_representative}" />
				</f:facet>
				<aon:div rendered="#{formList}"
					styleClass="#{to.representative?'aon-text-center aon-icon-checked':'aon-text-center aon-icon-check'}">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:selectBooleanCheckbox id="RegistryDirStaff_representative-Edit"
					rendered="#{formEdit}" value="#{controller.to.representative}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox id="RegistryDirStaff_representative-New"
						rendered="#{formNew}" value="#{controller.to.representative}" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.registry_dir_staff_is_representative_labor}" />
				</f:facet>
				<aon:div rendered="#{formList}"
					styleClass="#{to.representativeLabor?'aon-text-center aon-icon-checked':'aon-text-center aon-icon-check'}">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:selectBooleanCheckbox id="RegistryDirStaff_representativeLabor-Edit"
					rendered="#{formEdit}" value="#{controller.to.representativeLabor}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox id="RegistryDirStaff_representativeLabor-New"
						rendered="#{formNew}" value="#{controller.to.representativeLabor}" />
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.registry_dir_staff_is_shareholder}" />
				</f:facet>
				<aon:div rendered="#{formList}"
					styleClass="#{to.shareHolder?'aon-text-center aon-icon-checked':'aon-text-center aon-icon-check'}">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:selectBooleanCheckbox id="RegistryDirStaff_shareHolder-Edit"
					rendered="#{formEdit}" value="#{controller.to.shareHolder}"
					valueChangeListener="#{controller.onChangeShareHolder}"
					reRender="RegistryDirStaff_shareNumber-Edit,RegistryDirStaff_percentShare-Edit,RegistryDirStaff_nominalValue-Edit" 
					ajaxSingle="true"/>
				<f:facet name="footer">
					<aon:selectBooleanCheckbox id="RegistryDirStaff_shareHolder-New"
						rendered="#{formNew}" value="#{controller.to.shareHolder}" 
						reRender="RegistryDirStaff_shareNumber-New,RegistryDirStaff_percentShare-New,RegistryDirStaff_nominalValue-New" 
						ajaxSingle="true"/>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText	value="#{bundle.registry_dir_staff_is_director}" />
				</f:facet>
				<aon:div rendered="#{formList}"
					styleClass="#{to.director?'aon-text-center aon-icon-checked':'aon-text-center aon-icon-check'}">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:selectBooleanCheckbox id="RegistryDirStaff_director-Edit"
					reRender="RegistryDirStaff_dueDate-Edit" ajaxSingle="true"
					rendered="#{formEdit}" value="#{controller.to.director}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox id="RegistryDirStaff_director-New"
						reRender="RegistryDirStaff_dueDate-New" ajaxSingle="true"
						rendered="#{formNew}" value="#{controller.to.director}" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.registry_dir_staff_percent_shares}" />
				</f:facet>
				<aon:outputText value="#{to.percentShare}" rendered="#{formList}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="RegistryDirStaff_percentShare-Edit"
					rendered="#{formEdit}" size="5"
					disabled="#{!controller.to.shareHolder}"
					value="#{controller.to.percentShare}" />
				<f:facet name="footer">
					<aon:div>
						<aon:div rendered="#{!formNew}"
							style="text-align:right; font-weight:normal; padding-right:2px;">
							<aon:outputText value="#{controller.totalPercentShare}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:div>
						<aon:inputText id="RegistryDirStaff_percentShare-New"
							rendered="#{formNew}" size="5"
							disabled="#{!controller.to.shareHolder}"
							value="#{controller.to.percentShare}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.registry_dir_staff_share_number}" />
				</f:facet>
				<aon:outputText value="#{to.shareNumber}" rendered="#{formList}" />
				<aon:inputText id="RegistryDirStaff_shareNumber-Edit"
					rendered="#{formEdit}" size="5"
					disabled="#{!controller.to.shareHolder}"
					value="#{controller.to.shareNumber}" />
				<f:facet name="footer">
					<aon:div>
						<aon:div rendered="#{!formNew}"
							style="text-align:right; font-weight:normal; padding-right:2px;">
							<aon:outputText value="#{controller.totalShareNumber}" />
						</aon:div>
						<aon:inputText id="RegistryDirStaff_shareNumber-New"
							rendered="#{formNew}" size="5"
							disabled="#{!controller.to.shareHolder}"
							value="#{controller.to.shareNumber}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.registry_dir_staff_nominal_value}" />
				</f:facet>
				<aon:outputText value="#{to.nominalValue}" rendered="#{formList}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="RegistryDirStaff_nominalValue-Edit"
					rendered="#{formEdit}" size="5"
					disabled="#{!controller.to.shareHolder}"
					value="#{controller.to.nominalValue}" />
				<f:facet name="footer">
					<aon:div>
						<aon:div rendered="#{!formNew}"
							style="text-align:right; font-weight:normal; padding-right:2px;">
							<aon:outputText value="#{controller.totalNominalValue}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:div>
						<aon:inputText id="RegistryDirStaff_nominalValue-New"
							rendered="#{formNew}" size="5"
							disabled="#{!controller.to.shareHolder}"
							value="#{controller.to.nominalValue}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.registry_dir_staff_date}" />
				</f:facet>
				<aon:outputText value="#{to.dueDate}"
					rendered="#{to.id!=controller.to.id}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="RegistryDirStaff_dueDate-Edit"
					value="#{controller.to.dueDate}" rendered="#{formEdit}"
					disabled="#{!controller.to.director}"
					inputSize="7" timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}" />
				<f:facet name="footer">
					<aon:selectInputDate id="RegistryDirStaff_dueDate-New"
						value="#{controller.to.dueDate}" rendered="#{formNew}"
						disabled="#{!controller.to.director}"
						inputSize="7" timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>
</ui:composition>
