<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="streetTypeList">

			<aon:div ajaxRendered="true" layout="none">
				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{bundle.registry_street_type}" />
					<ui:param name="controller" value="#{cnae}" />
					<ui:param name="skipResetButton" value="true" />
					<ui:param name="skipSearchButton" value="true" />
				</ui:include>			

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
					<aon:dataTable id="streetTypeList"
						cellpadding="0" cellspacing="0"
						value="#{employeeCollections.streetTypes}" var="to"
						style="width:200px;"
						columnClasses="aon-text-left,aon-text-right">
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel 
									value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.label}"  />
						</aon:column>
					</aon:dataTable>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
