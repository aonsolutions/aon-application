<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-130">
				<f:facet name="header">
					<aon:outputLabel for="RegistryTax_TaxType" value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.tax.type}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="RegistryTax_TaxType" rendered="#{formEdit}" 
					value="#{controller.taxType}" required="true"
					reRender="RegistryTax_Tax,RegistryTax_Surcharge">
					<f:selectItems value="#{configCollections.taxTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="RegistryTax_TaxType-New" rendered="#{formNew}"
						value="#{controller.taxType}" required="true"
						reRender="RegistryTax_Tax-New,RegistryTax_Surcharge-New">
						<f:selectItems value="#{configCollections.taxTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column	styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="RegistryTax_Tax" value="#{bundle.config_tax}" />
				</f:facet>
				<aon:outputText value="#{to.tax.name}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="RegistryTax_Tax" rendered="#{formEdit}"
					value="#{controller.to.tax}" required="true">
					<aon:if test="#{controller.vat}">
						<f:selectItems value="#{configCollections.vatTaxes}" />
					</aon:if>
					<aon:if test="#{controller.retention}">
						<f:selectItems value="#{configCollections.retentionTaxes}" />
					</aon:if>
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="RegistryTax_Tax-New" rendered="#{formNew}"
						value="#{controller.to.tax}" required="true">
						<aon:if test="#{controller.vat}">
							<f:selectItems value="#{configCollections.vatTaxes}" />
						</aon:if>
						<aon:if test="#{controller.retention}">
							<f:selectItems value="#{configCollections.retentionTaxes}" />
						</aon:if>
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column	styleClass="aon-editDataTable-textColumn aon-width-130">
				<f:facet name="header">
					<aon:outputLabel for="RegistryTax_StartDate" value="#{bundle.aon_date_from}" />
				</f:facet>
				<aon:outputText value="#{to.startDate}"
					rendered="#{formList}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="RegistryTax_StartDate" rendered="#{formEdit}"
					value="#{controller.to.startDate}" required="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}"/>
				<f:facet name="footer">
					<aon:selectInputDate id="RegistryTax_StartDate-New" rendered="#{formNew}"
						value="#{controller.to.startDate}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</f:facet>
			</aon:column>

			<aon:column	styleClass="aon-editDataTable-textColumn aon-width-130">
				<f:facet name="header">
					<aon:outputLabel for="RegistryTax_EndDate" value="#{bundle.aon_date_to}" />
				</f:facet>
				<aon:outputText value="#{to.endDate}"
					rendered="#{formList}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="RegistryTax_EndDate" rendered="#{formEdit}"
					value="#{controller.to.endDate}"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}"/>
				<f:facet name="footer">
					<aon:selectInputDate id="RegistryTax_EndDate-New" rendered="#{formNew}"
						value="#{controller.to.endDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel for="RegistryTax_Percentage" value="#{bundle.aon_percentage}" />
				</f:facet>
				<aon:outputText value="#{to.percentage}" rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText> 
				<aon:inputText id="RegistryTax_Percentage" rendered="#{formEdit}"
					value="#{controller.to.percentage}"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="RegistryTax_Percentage-New" rendered="#{formNew}"
						value="#{controller.to.percentage}"
						required="true" size="5" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel for="RegistryTax_Surcharge" value="#{bundle.aon_surcharge}" />
				</f:facet>
				<aon:outputText value="#{to.surcharge}" rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText> 
				<aon:inputText id="RegistryTax_Surcharge" rendered="#{formEdit}"
					value="#{controller.to.surcharge}"
					required="true" size="5"
					disabled="#{!controller.vat}" />
				<f:facet name="footer">
					<aon:inputText id="RegistryTax_Surcharge-New" rendered="#{formNew}"
						value="#{controller.to.surcharge}"
						required="true" size="5"
						disabled="#{!controller.vat}" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
