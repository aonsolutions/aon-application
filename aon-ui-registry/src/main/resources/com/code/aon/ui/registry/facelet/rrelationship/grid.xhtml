<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="columnClasses"
			value="aon-editDataTable-textColumn, 
					aon-editDataTable-dateColumn, aon-editDataTable-dateColumn, 
					aon-editDataTable-textColumn, aon-editDataTable-textColumn" />

		<ui:define name="columns">

			<aon:column>
				<f:facet name="header">
					<aon:outputText for="Registry_id"
						value="#{bundle.registry_relationed}" />
				</f:facet>
				<aon:outputText value="#{to.relatedRegistry.name}"
					rendered="#{formList}" />
				<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
					<ui:param name="lookupTo" value="#{controller.to.relatedRegistry}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
				</ui:include>
				<f:facet name="footer" >
					<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
						<ui:param name="lookupTo" value="#{controller.to.relatedRegistry}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="lookupSuffix" value="-New" />
					</ui:include>
				</f:facet>	
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<h:outputText value="#{bundle.aon_type}" />
				</f:facet>
				<h:outputText value="#{to.relationship.description}"
					rendered="#{to.id!=controller.to.id}" />
				<aon:selectOneMenu value="#{controller.to.relationship.id}"
					styleClass="aon-form-selectOneMenu-field"
					valueChangeListener="#{controller.onRelationshipChanged}"
					rendered="#{to==controller.to}">
					<f:selectItems value="#{registryCollections.relationships}" />
				</aon:selectOneMenu>
				<f:verbatim>&#160;</f:verbatim>
				<f:facet name="footer">
					<aon:selectOneMenu value="#{controller.to.relationship.id}"
						styleClass="aon-form-selectOneMenu-field"
						valueChangeListener="#{controller.onRelationshipChanged}"
						rendered="#{controller.new}">
						<f:selectItems value="#{registryCollections.relationships}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<h:outputText value="#{bundle.registry_observation}" />
				</f:facet>
				<aon:outputText value="#{to.comments}"
					rendered="#{to.id!=controller.to.id}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText rendered="#{to.id==controller.to.id}"
					styleClass="aon-form-input-text" size="64"
					value="#{controller.to.comments}" />
				<f:verbatim>&#160;</f:verbatim>
				<f:facet name="footer">
					<aon:inputText rendered="#{controller.new}"
						styleClass="aon-form-input-text" size="64"
						value="#{controller.to.comments}" />
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>
</ui:composition>
