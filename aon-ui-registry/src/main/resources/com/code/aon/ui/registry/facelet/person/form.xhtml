<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="personForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{registryBundle.registry_person_module}" />
				<ui:param name="controller" value="#{person}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="listData" columns="2" cellpadding="0" cellspacing="10" 
					styleClass="aon-panelGrid-formatting"
					columnClasses="aon-width-50percent,aon-width-50percent aon-vertical-align-top">

					<ui:include src="/com/code/aon/ui/registry/facelet/person/formContent.xhtml">
						<ui:param name="controller" value="#{person}" />
						<ui:param name="skipOtherDataPanel" value="true" />
					</ui:include>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<c:if test="#{aonConfiguration.bean.rmedia.showSendEmail}">
			<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		</c:if>
	</ui:define>
</ui:composition>
