<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="personForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{registryBundle.registry_person_module}" />
				<ui:param name="controller" value="#{person}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<c:if test="#{person.new}">
					<ui:include src="/com/code/aon/ui/registry/facelet/person/formNewContent.xhtml">
						<ui:param name="controller" value="#{person}" />
					</ui:include>				
				</c:if>							
				<c:if test="#{!person.new}">			
					<aon:panelGrid id="dataTable" columns="4" styleClass="aon-width-all"
						columnClasses="aon-panelGrid-odd aon-width-150,
							aon-panelGrid-even aon-width-auto,
							aon-panelGrid-odd aon-width-120,
							aon-panelGrid-even aon-width-auto">
	
						<ui:include 
							src="/com/code/aon/ui/registry/facelet/person/formContent.xhtml">
							<ui:param name="controller" value="#{person}" />
						</ui:include>
					</aon:panelGrid>

					<aon:panelTabSet selectedTab="#{person.selectedTab}">
						<aon:panelTab id="address" label="#{registryBundle.registry_address_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{personAddress}" />
							</ui:include>
						</aon:panelTab>
	
						<aon:panelTab id="media" label="#{registryBundle.registry_media_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{personMedia}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<c:if test="#{aonConfiguration.bean.rmedia.showSendEmail}">
			<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		</c:if>
	</ui:define>
</ui:composition>
