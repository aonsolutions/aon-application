<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/faces/attachment/grid.xhtml">
		<ui:define name="additionalColumns" >
			<c:if test="#{!skipScopeColumn}"> 
				<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.scope.description"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="#{controller.beanName}_scope"
							value="#{bundle.aon_scope}" />
					</f:facet>
					<aon:outputText value="#{to.scope.description}" rendered="#{formList}" />
					<aon:selectOneMenu id="#{controller.beanName}_scope" rendered="#{formEdit}"
						value="#{controller.to.scope}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu id="#{controller.beanName}_scope-New" rendered="#{formNew}"
							value="#{controller.to.scope}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{configCollections.currentUserScopes}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
			</c:if>
			<c:if test="#{!skipCategoryColumn}"> 
				<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.category.name"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="#{controller.beanName}_category"
							value="#{registryBundle.registry_category}" />
					</f:facet>
					<aon:outputText value="#{to.category.name}" rendered="#{formList}" />
					<aon:selectOneMenu id="#{controller.beanName}_category" rendered="#{formEdit}"
						value="#{controller.to.category}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{registryCollections.categories}" />
					</aon:selectOneMenu>									
					<f:facet name="footer">
						<aon:selectOneMenu id="#{controller.beanName}_category-New" rendered="#{formNew}"
							value="#{controller.to.category}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{registryCollections.categories}" />
						</aon:selectOneMenu>									
					</f:facet>
				</aon:column>
			</c:if>
		</ui:define>
	</ui:decorate>

</ui:composition>
