<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/faces/attachment/grid.xhtml">
		<ui:define name="additionalColumns">
			<aon:if test="#{(!skipConfidentialityColumn) and aonRole.confidentiality}">
				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
					<f:facet name="header">
						<aon:outputText value="&#160;" title="#{bundle.aon_confidential}"
							styleClass="aon-icon-confidential" style="padding-left:15px" />
					</f:facet>
					<aon:outputText value="&#160;"
						rendered="#{formList}"
						styleClass="#{to.confidential?'aon-icon-checked':'aon-icon-check'}" 
						style="padding-left:20px" />
					<aon:selectBooleanCheckbox id="#{controller.beanName}_securityLevel"
						value="#{controller.to.confidential}" rendered="#{formEdit}" />
					<f:facet name="footer">
						<aon:selectBooleanCheckbox id="#{controller.beanName}_securityLevel-New"
							value="#{controller.to.confidential}" rendered="#{formNew}" />
					</f:facet>
				</aon:column>
			</aon:if>		
			<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.attachDate"
				styleClass="aon-editDataTable-textColumn aon-width-120">
				<f:facet name="header">
					<aon:outputLabel for="#{controller.beanName}_attachDate"
						value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.attachDate}" rendered="#{formList}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="#{controller.beanName}_attachDate"
					popupDateFormat="#{bundle.aon_date_pattern}"
					rendered="#{formEdit}" value="#{controller.to.attachDate}" />
				<f:facet name="footer">
					<aon:selectInputDate id="#{controller.beanName}_attachDate-New"
						popupDateFormat="#{bundle.aon_date_pattern}"
						rendered="#{formNew}" value="#{controller.to.attachDate}" />
				</f:facet>
			</aon:column>		
			<aon:if test="#{!skipScopeColumn}"> 
				<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.scope&lt;description"
					styleClass="aon-editDataTable-textColumn aon-width-100">
					<f:facet name="header">
						<aon:outputLabel for="#{controller.beanName}_scope"
							value="#{bundle.aon_scope}" />
					</f:facet>
					<aon:outputText value="#{to.scope.description}" rendered="#{formList}" />
					<aon:selectOneMenu id="#{controller.beanName}_scope" rendered="#{formEdit}"
						value="#{controller.to.scope}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu id="#{controller.beanName}_scope-New" rendered="#{formNew}"
							value="#{controller.to.scope}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{configCollections.currentUserScopes}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
			</aon:if>
			<aon:if test="#{!skipCategoryColumn}"> 
				<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.category&lt;name"
					styleClass="aon-editDataTable-textColumn aon-width-100">
					<f:facet name="header">
						<aon:outputLabel for="#{controller.beanName}_category"
							value="#{bundle.aon_category}" />
					</f:facet>
					<aon:outputText value="#{to.category.name}" rendered="#{formList}" />
					<aon:selectOneMenu id="#{controller.beanName}_category" rendered="#{formEdit}"
						value="#{controller.to.category}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{registryCollections.categories}" />
					</aon:selectOneMenu>									
					<f:facet name="footer">
						<aon:selectOneMenu id="#{controller.beanName}_category-New" rendered="#{formNew}"
							value="#{controller.to.category}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{registryCollections.categories}" />
						</aon:selectOneMenu>									
					</f:facet>
				</aon:column>
			</aon:if>
		</ui:define>
		<ui:define name="additionalDataTableContent">
			<aon:if test="#{!skipFreeSpaceMessage}">		
				<aon:div styleClass="aon-margin-top" >
					<aon:outputText style="#{documentManager.freeSpaceStyle}"
						value="#{documentManager.freeSpaceMessage}" />
				</aon:div>
			</aon:if>								
		</ui:define>
	</ui:decorate>

</ui:composition>
