<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="#{controller.pojoShortName}_registry_name"
		styleClass="aon-outputLabel aon-nowrap"
		value="#{bundle.aon_company_name}" />
	<aon:inputText id="#{controller.pojoShortName}_registry_name" size="40"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="#{controller.pojoShortName}_registry_alias"
		styleClass="aon-outputLabel aon-nowrap"
		value="#{bundle.aon_company_alias}" />
	<aon:inputText id="#{controller.pojoShortName}_registry_alias" size="40"
		valueChangeListener="#{controller.addExpression}" />
	
	<aon:outputLabel for="#{controller.pojoShortName}_registry_nationality"
		value="#{bundle.registry_nationality}" />
	<aon:selectOneMenu id="#{controller.pojoShortName}_registry_nationality"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}" >
		<f:selectItem value="#{null}" itemLabel="-"/>
		<f:selectItems value="#{commonCollections.countries}" />
	</aon:selectOneMenu>
		
	<aon:outputLabel for="#{controller.pojoShortName}_registry_document"
		value="#{bundle.aon_document}" />
	<aon:inputText id="#{controller.pojoShortName}_registry_document" size="12"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel value="#{bundle.aon_document_country}"
		for="#{controller.pojoShortName}_registry_documentCountry" />
	<aon:selectOneMenu id="#{controller.pojoShortName}_registry_documentCountry"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}" >
		<f:selectItem value="#{null}" itemLabel="-"/>
		<f:selectItems value="#{commonCollections.countries}" />
	</aon:selectOneMenu>
	
	<aon:outputLabel value="#{bundle.aon_type}"
		for="#{controller.pojoShortName}_registry_documentType" />
	<aon:selectOneMenu id="#{controller.pojoShortName}_registry_documentType"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}" >
		<f:selectItem value="#{null}" itemLabel="-"/>
		<f:selectItems value="#{registryCollections.documentTypes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="#{controller.pojoShortName}_registry_id"
		value="#{bundle.aon_id}" />
	<aon:inputText id="#{controller.pojoShortName}_registry_id" size="12"
		valueChangeListener="#{controller.addExpression}" />

	<aon:if test="#{includeRegistryScope}">
		<ui:include src="/com/code/aon/ui/config/facelet/scope/searchContent.xhtml" />
	</aon:if>

	<aon:outputLabel value="#{bundle.aon_entity}"
		for="#{controller.pojoShortName}_registry_type" />
	<aon:selectOneMenu id="#{controller.pojoShortName}_registry_type"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}" >
		<f:selectItem value="#{null}" itemLabel="-"/>
		<f:selectItems value="#{registryCollections.registryTypes}" />
	</aon:selectOneMenu>

</ui:composition>
