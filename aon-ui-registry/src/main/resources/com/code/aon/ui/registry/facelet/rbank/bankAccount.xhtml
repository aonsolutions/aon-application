<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:valueParam name="renderBankAccount" default="#{true}" />

	<aon:panelGroup id="#{bankAccountPrefix}_BankAccountDiv#{bankAccountSuffix}" styleClass="aon-vertical-align-top"
		rendered="#{renderBankAccount}">
		<aon:selectOneMenu id="#{bankAccountPrefix}_BankAccount_country#{bankAccountSuffix}"
			styleClass="aon-vertical-align-middle"
			value="#{bankAccountTo.country}" required="true"
			disabled="#{bankAccountDisabled}">
			<f:selectItems value="#{commonCollections.countryCodes}" />
			<a4j:support event="onchange" focus="#{bankAccountPrefix}_BankAccount_check#{bankAccountSuffix}"
				reRender="#{bankAccountPrefix}_BankAccountDiv#{bankAccountSuffix}"
				ajaxSingle="true" />
		</aon:selectOneMenu>
		<aon:inputText id="#{bankAccountPrefix}_BankAccount_check#{bankAccountSuffix}"
			label="#{bundle.config_iban_check_digits}"
			value="#{bankAccountTo.check}"
			styleClass="aon-inputText aon-width-20 aon-vertical-align-middle"
			size="1" maxlength="2"
			disabled="#{bankAccountDisabled}"
			ajaxSingle="true">
			<f:validateLength minimum="2" maximum="2" />
			<a4j:support event="onchange" reRender="#{bankAccountReRender}" ajaxSingle="true" />
		</aon:inputText>
		<aon:inputText value="#{bankAccountTo.bban1}"
			label="#{bundle.aon_iban}"
			styleClass="aon-inputText aon-width-40 aon-vertical-align-middle"
			size="3" maxlength="4"
			disabled="#{bankAccountDisabled}"
			ajaxSingle="true">
			<a4j:support event="onchange" reRender="#{bankAccountReRender}" ajaxSingle="true" />
		</aon:inputText>
		<aon:inputText value="#{bankAccountTo.bban2}"
			styleClass="aon-inputText aon-width-40 aon-vertical-align-middle"
			size="3" maxlength="4"
			disabled="#{bankAccountDisabled}"
			ajaxSingle="true">
			<a4j:support event="onchange" reRender="#{bankAccountReRender}" ajaxSingle="true" />
		</aon:inputText>
		<aon:inputText value="#{bankAccountTo.bban3}"
			styleClass="aon-inputText aon-width-40 aon-vertical-align-middle"
			size="3" maxlength="4"
			disabled="#{bankAccountDisabled}"
			ajaxSingle="true">
			<a4j:support event="onchange" reRender="#{bankAccountReRender}" ajaxSingle="true" />
		</aon:inputText>
		<aon:if test="#{bankAccountTo.ibanLength > 16}">
			<aon:inputText value="#{bankAccountTo.bban4}"
				styleClass="aon-inputText aon-width-40 aon-vertical-align-middle"
				size="3" maxlength="4"
				disabled="#{bankAccountDisabled}"
				ajaxSingle="true">
				<a4j:support event="onchange" reRender="#{bankAccountReRender}" ajaxSingle="true" />
			</aon:inputText>
		</aon:if>
		<aon:if test="#{bankAccountTo.ibanLength > 20}">
			<aon:inputText value="#{bankAccountTo.bban5}"
				styleClass="aon-inputText aon-width-40 aon-vertical-align-middle"
				size="3" maxlength="4"
				disabled="#{bankAccountDisabled}"
				ajaxSingle="true">
				<a4j:support event="onchange" reRender="#{bankAccountReRender}" ajaxSingle="true" />
			</aon:inputText>
		</aon:if>
		<aon:if test="#{bankAccountTo.ibanLength > 24}">
			<aon:inputText value="#{bankAccountTo.bban6}"
				styleClass="aon-inputText aon-width-40 aon-vertical-align-middle"
				size="3" maxlength="4"
				ajaxSingle="true">
				<a4j:support event="onchange" reRender="#{bankAccountReRender}" ajaxSingle="true" />
			</aon:inputText>
		</aon:if>
		<aon:if test="#{bankAccountTo.ibanLength > 28}">
			<aon:inputText value="#{bankAccountTo.bban7}"
				styleClass="aon-inputText aon-width-40 aon-vertical-align-middle"
				size="3" maxlength="4"
				disabled="#{bankAccountDisabled}"
				ajaxSingle="true">
				<a4j:support event="onchange" reRender="#{bankAccountReRender}" ajaxSingle="true" />
			</aon:inputText>
		</aon:if>
		<aon:if test="#{bankAccountTo.ibanLength > 32}">
			<aon:inputText value="#{bankAccountTo.bban8}"
				styleClass="aon-inputText aon-width-40 aon-vertical-align-middle"
				size="1" maxlength="2"
				disabled="#{bankAccountDisabled}"
				ajaxSingle="true">
				<a4j:support event="onchange" reRender="#{bankAccountReRender}" ajaxSingle="true" />
			</aon:inputText>
		</aon:if>
	</aon:panelGroup>
					
</ui:composition>
