<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="corporateIdentityLabelForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.registry_corporateIdentity_label}" />
				<ui:param name="toolbarDescription" value="#{corporateIdentity.identityReport.company.fullName}" />
				<ui:define name="toolbarContent">
					<aon:htmlCommandLink id="export2pdf_label" value="PDF" title="PDF"
						action="#{report.onExecute}" target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">							
						<f:param name="reportKey" value="corporateIdentity_label" />
					</aon:htmlCommandLink>												
					<aon:commandButton id="remove" value="#{bundle.aon_clear}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						action="corporateIdentity_label" actionListener="#{corporateIdentity.onClear}" 
						immediate="true" accesskey="#{bundle.aon_key_remove}" />
					<aon:if test="#{corporateIdentity.showBackButton}">
						<aon:commandButton id="cancel" value="#{bundle.aon_back}"
							action="#{corporateIdentity.getBackAction}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="true"
							accesskey="#{bundle.aon_key_cancel}" />
					</aon:if>						 
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="label_para"
						value="#{bundle.webmail_to}" />
					<aon:inputText id="label_para" 
						size="85" 
						value="#{corporateIdentity.identityReport.label_to}" />

					<aon:outputLabel for="label_att"
						value="#{bundle.registry_corporateIdentity_label_att}" />
					<aon:inputText id="label_att" 
						size="85" 
						value="#{corporateIdentity.identityReport.label_att}" />
	
					<aon:outputLabel for="label_to_address"
						value="#{bundle.aon_address}" />
					<aon:inputText id="label_to_address" 
						size="85" 
						value="#{corporateIdentity.identityReport.label_to_address}">
					</aon:inputText>

					<aon:outputLabel for="label_to_address2"
						value="&#160;" />
					<aon:inputText id="label_to_address2" 
						size="85" 
						value="#{corporateIdentity.identityReport.label_to_address2}">
					</aon:inputText>

					<aon:outputLabel for="label_to_phone"
						value="#{bundle.registry_corporateIdentity_label_to_phone}" />
					<aon:inputText id="label_to_phone" 
						size="42" 
						value="#{corporateIdentity.identityReport.label_to_phone}">
					</aon:inputText>

					<aon:outputLabel for="label_to_fax"
						value="#{bundle.aon_fax}" />
					<aon:inputText id="label_to_fax" 
						size="42" 
						value="#{corporateIdentity.identityReport.label_to_fax}">
					</aon:inputText>

					<aon:outputLabel for="label_to_obs"
						value="#{bundle.aon_remark}" />
					<aon:inputTextarea id="label_to_obs"
						value="#{corporateIdentity.identityReport.label_to_obs}"
						style="width:90%"
						cols="80" rows="5"/>

					<aon:outputLabel for="label_to_bultos"
						value="#{bundle.registry_corporateIdentity_label_to_bultos}" />
					<aon:inputText id="label_to_bultos" 
						size="10" 
						value="#{corporateIdentity.identityReport.label_to_bultos}" />

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
