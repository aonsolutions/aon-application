<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="pojoName" default="#{controllerLookupListener.controller.pojoShortName}"/>

	<ui:include src="/com/code/aon/ui/registry/facelet/raddress/form.xhtml" >
		<ui:param name="registryAddress" value="#{controllerLookupListener.mainAddress}" />
	</ui:include>
	
	<aon:outputLabel for="#{pojoName}_telephone" value="#{registryBundle.registry_phone}" />
	<aon:inputText id="#{pojoName}_telephone" 
		value="#{controllerLookupListener.phone.value}" size="32" maxlength="64"/>
		
	<aon:outputLabel for="#{pojoName}_fax" value="#{registryBundle.registry_fax}" />
	<aon:inputText id="#{pojoName}_fax"
		value="#{controllerLookupListener.fax.value}" size="32" maxlength="64"/>
		
	<aon:outputLabel for="#{pojoName}_email" value="#{registryBundle.registry_email}" />
	<aon:inputText id="#{pojoName}_email" 
		value="#{controllerLookupListener.email.value}" size="64" maxlength="64" onblur="toLowerCase(this);" />

	<aon:outputLabel for="#{pojoName}_web" value="#{registryBundle.registry_web}" />
	<aon:inputText id="#{pojoName}_web"
		value="#{controllerLookupListener.web.value}" size="64" maxlength="64" onblur="toLowerCase(this);" />
			
</ui:composition>
