<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="corporateIdentityLetterForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{registryBundle.registry_corporateIdentity_letter}" />
				<ui:param name="toolbarDescription" value="#{corporateIdentity.identityReport.company.fullName}" />
				<ui:define name="toolbarContent">
					<aon:htmlCommandLink id="export2pdf_letter" value="PDF" title="PDF"
						action="#{report.onExecute}" target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">							
						<f:param name="reportKey" value="corporateIdentity_letter" />
					</aon:htmlCommandLink>						
					<aon:commandButton id="remove" value="#{bundle.aon_clear}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						action="corporateIdentity_letter" actionListener="#{corporateIdentity.onClear}" 
						immediate="true" accesskey="#{bundle.aon_key_remove}" />
					<aon:commandButton id="cancel" value="#{bundle.aon_back}"
						action="corporateIdentity_predefined"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						accesskey="#{bundle.aon_key_cancel}" /> 				
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">
					<aon:outputLabel for="letter_date"
						value="#{registryBundle.registry_corporateIdentity_date}" />
					<aon:inputText id="letter_date" size="120" 
						value="#{corporateIdentity.identityReport.letter_date}" />
	
					<aon:outputLabel for="letter_salutation"
						value="#{registryBundle.registry_corporateIdentity_salutation}" />
					<aon:inputText id="letter_salutation" size="120" 
						value="#{corporateIdentity.identityReport.letter_salutation}" />
	
					<aon:outputLabel for="letter_content"
						value="#{registryBundle.registry_corporateIdentity_content}" />
					<aon:inputTextarea id="letter_content"
						value="#{corporateIdentity.identityReport.letter_content}"
						cols="120" rows="25"/>
	
					<aon:outputLabel for="letter_goodbye"
						value="#{registryBundle.registry_corporateIdentity_goodbye}" />
					<aon:inputText id="letter_goodbye" size="120" 
						value="#{corporateIdentity.identityReport.letter_goodbye}" />
	
					<aon:outputLabel for="letter_signature"
						value="#{registryBundle.registry_corporateIdentity_signature}" />
					<aon:inputTextarea id="letter_signature"
						value="#{corporateIdentity.identityReport.letter_signature}"
						cols="120" rows="3"/>

					<aon:outputLabel for="letter_registry_data"
						value="#{registryBundle.registry_corporateIdentity_registry_data}" />
					<aon:selectBooleanCheckbox id="letter_registry_data" 
							value="#{corporateIdentity.identityReport.printRegistryData}">
					</aon:selectBooleanCheckbox>

				</aon:panelGrid>
			</aon:div>


		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
