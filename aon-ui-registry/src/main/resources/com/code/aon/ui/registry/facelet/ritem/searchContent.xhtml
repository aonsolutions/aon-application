<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{searchController.item}" />
		<ui:param name="lookupSuffix" value="-RegistryItem" />
		<ui:param name="skipNewButton" value="#{true}" />		
	</ui:include>
	
	<aon:if test="#{rItemController.saleType or rItemController.purchaseType}">
		<aon:outputLabel for="#{controller.pojoShortName}_items_code"
			value="#{bundle.product_item_customer_code}"
			rendered="#{rItemController.saleType}" />
		<aon:outputLabel for="#{controller.pojoShortName}_items_code"
			value="#{bundle.product_item_supplier_code}"
			rendered="#{rItemController.purchaseType}" />
		<aon:inputText id="#{controller.pojoShortName}_items_code"
			valueChangeListener="#{controller.addExpression}" size="25" />

		<aon:outputLabel for="#{controller.pojoShortName}_items_price"
			value="#{bundle.aon_price}" />
		<aon:inputText id="#{controller.pojoShortName}_items_price"
			valueChangeListener="#{controller.addExpression}" size="25" />
	</aon:if>

	<aon:if test="#{rItemController.commercialType}">
		<aon:outputLabel for="#{controller.pojoShortName}_items_status"
			value="#{bundle.aon_status}" />
		<aon:selectOneMenu id="#{controller.pojoShortName}_items_status"
			converter="aon.EnumConverter"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="-" value="#{null}"/>
			<f:selectItems value="#{registryCollections.registryItemStatuses}" />
		</aon:selectOneMenu>
	</aon:if>									

</ui:composition>
