<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="corporateIdentityAttachList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.aon_documents}" />
				<ui:param name="controller" value="#{corporateIdentityAttach}" />
				<ui:param name="skipResetButton" value="#{(!aonRole.documentManager) or (documentManager.freeSpace &lt; 1)}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{corporateIdentityAttach}" />
					<ui:param name="showNote" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{!aonRole.documentManager}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{aonRole.documentManager}" />
					<ui:define name="columns">
			
						<ui:include 
							src="/com/code/aon/ui/registry/facelet/corporateIdentity/listContent.xhtml" />
							
					</ui:define>
					<ui:define name="additionalDataTableContent" >
						<aon:div styleClass="aon-margin-top" >
							<aon:outputText style="#{documentManager.freeSpaceStyle}"
								value="#{documentManager.freeSpaceMessage}" />
						</aon:div>
					</ui:define>					
				</ui:decorate>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
