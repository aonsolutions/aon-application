<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="Project_projectType"
		value="#{bundle.project_project_type}" />
	<aon:selectOneMenu id="Project_projectType"
		reRender="Project_activityType"
		value="#{searchController.projectType}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{projectCollections.projectTypes}"/>
	</aon:selectOneMenu>

	<aon:outputLabel for="Project_activityType"
		value="#{bundle.project_activity_type}"/>
	<aon:selectOneMenu id="Project_activityType"
		value="#{searchController.activityType}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{searchController.availableActivityTypes}" />
	</aon:selectOneMenu>

</ui:composition>
