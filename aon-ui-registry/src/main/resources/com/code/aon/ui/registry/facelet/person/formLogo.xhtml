<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputLabel for="attach_file"
		value="#{bundle.registry_image}"/>
	<a4j:region>
		<h:panelGrid id="attachGrid" columns="2">
			<a4j:mediaOutput element="img" cacheable="false"
				style="width: 100px;" value="#{person.logoFile.key}"
				rendered="#{person.logoFile.size > 0}"
				createContent="#{person.createCurrentLogoContent}">
			</a4j:mediaOutput>
			<aon:fileUpload id="attach_file" listWidth="100"
				fileUploadListener="#{person.logoFileUploaded}" >
				<f:facet name="label">
					<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
				</f:facet>
				<a4j:support event="onuploadcomplete" reRender="attachGrid" />
			</aon:fileUpload>
		</h:panelGrid>
	</a4j:region>
	
</ui:composition>
