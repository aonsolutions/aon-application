<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="#{controller.pojoShortName}_documents_description"
		value="#{bundle.aon_description}" />
	<aon:inputText id="#{controller.pojoShortName}_documents_description" size="60"
		valueChangeListener="#{controller.addExpression}" />
		
	<aon:outputLabel for="#{controller.pojoShortName}_documents_category_id"
		value="#{bundle.aon_category}" />
	<aon:selectOneMenu id="#{controller.pojoShortName}_documents_category_id"
		value="#{registryCollections.category}"
		valueChangeListener="#{controller.addIdEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{registryCollections.categories}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="#{controller.pojoShortName}_documents_attachDate-From"
		value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="#{controller.pojoShortName}_documents_attachDate-From" styleClass="aon-form-date-label aon-padding-right"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="#{controller.pojoShortName}_documents_attachDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="#{controller.pojoShortName}_documents_attachDate-To" styleClass="aon-form-date-label aon-padding-right"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="#{controller.pojoShortName}_documents_attachDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
						
	<c:if test="#{aonRole.confidentiality}">
		<aon:outputLabel for="#{controller.pojoShortName}_documents_securityLevel"
			value="#{bundle.aon_confidential}" />
		<aon:selectOneRadio id="#{controller.pojoShortName}_documents_securityLevel" 
			valueChangeListener="#{controller.addExpression}" >
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
		</aon:selectOneRadio>
	</c:if>
		

</ui:composition>
