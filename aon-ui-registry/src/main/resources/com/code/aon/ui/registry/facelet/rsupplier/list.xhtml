<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core">

	<ui:include
		src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
		<ui:param name="toolbarID" value="ttpListToolbar" />		
		<ui:param name="toolbarTitle" value="#{bundle.registry_supplier_info}" />
		<ui:param name="skipSearchButton" value="true" />
		<aon:methodParam name="resetAction" value="" />
		<ui:param name="resetButtonReRender" value="registrySupplierContent" />		
	</ui:include>
	
	<aon:div styleClass="aon-scroll-area">
	
		<aon:methodParam name="rowSelectorAction" value="" />
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:param name="rowSelectorReRender" value="registrySupplierContent" />
			<ui:define name="columns">

				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText
							value="#{bundle.aon_supplier}" />
					</f:facet>
					<aon:outputText value="#{to.supplier.registry.fullName}" />
				</aon:column>

			</ui:define>
		</ui:decorate>
	</aon:div>
</ui:composition>
