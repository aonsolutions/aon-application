<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:include
		src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarID" value="ttpFormToolbar" />
		<ui:param name="toolbarTitle" value="#{registryBundle.registry_supplier_info}" />
		<ui:param name="skipSearchButton" value="true" />

		<aon:methodParam name="saveAction" value="" />
		<ui:param name="saveButtonReRender" value="registrySupplierContent" />
		<aon:methodParam name="cancelAction" value="" />
		<ui:param name="cancelButtonReRender" value="registrySupplierContent" />
		<aon:methodParam name="removeAction" value="" />
		<ui:param name="removeButtonReRender" value="#{(removeButtonReRender!=null)?(removeButtonReRender):('registrySupplierContent')}" />
		<aon:methodParam name="resetAction" value="" />
		<ui:param name="resetButtonReRender" value="registrySupplierContent" />
		<aon:methodParam name="backAction" value="" />
		<ui:param name="backButtonReRender" value="registrySupplierContent" />
	</ui:include>
	
	<aon:div styleClass="aon-scroll-area">
		<aon:panelGrid columns="4" style="width: 100%"
				columnClasses="aon-panelGrid-odd aon-width-150
							,aon-panelGrid-even aon-width-auto
							,aon-panelGrid-odd aon-width-150
							,aon-panelGrid-even aon-width-200">
			<ui:include src="/com/code/aon/ui/registry/facelet/rsupplier/form_content.xhtml" />
		</aon:panelGrid>

		<aon:div styleClass="aon-padding-top">
			<ui:include src="/com/code/aon/ui/registry/facelet/rsupplier/form_paymethod.xhtml" />
		</aon:div>

	</aon:div>
