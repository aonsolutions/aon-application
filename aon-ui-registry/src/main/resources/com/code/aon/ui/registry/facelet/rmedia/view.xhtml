<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:if test="#{controller.phone != null}" >
		<aon:outputText value="#{controller.phone.mediaType}" />
		<aon:outputText value="#{controller.phone.value}" />
	</aon:if>
	
	<aon:if test="#{controller.fax != null}" >
		<aon:outputText value="#{controller.fax.mediaType}" />
		<aon:outputText value="#{controller.fax.value}" />
	</aon:if>
	
	<aon:if test="#{controller.email != null}" >
		<aon:outputText value="#{controller.email.mediaType}" />
		<aon:outputText value="#{controller.email.value}" />
	</aon:if>
	
	<aon:if test="#{controller.web != null}" >
		<aon:outputText value="#{controller.web.mediaType}" />
		<aon:outputText value="#{controller.web.value}" size="64" />				
	</aon:if>	
						
</ui:composition>
