<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:valueParam name="renderBankLookup" default="#{true}"/>

	<aon:div styleClass="aon-lookup" rendered="#{renderBankLookup}" >
		<aon:lookupInputText id="RegistryBank_code#{bankSuffix}"
			label="#{configBundle.config_bank}"
			property="#{bankTo}" lookup="#{bankLookup}"
			reRender="RegistryBank_name#{bankSuffix}" 
			value="#{bankTo.code}" size="5" required="true">
			<aon:joinProperty alias="Bank_code" value="#{bankTo.code}" />
		</aon:lookupInputText>
		<aon:lookupButton 
			windowTitle="#{configBundle.config_bank_selection}"
			selectReRender="RegistryBank_code#{bankSuffix},RegistryBank_name#{bankSuffix}"
			actionType="search" lookup="#{bankLookup}" minHeight="460" minWidth="650"
			property="#{bankTo}">
		</aon:lookupButton>
		<aon:inputText id="RegistryBank_name#{bankSuffix}"
			value="#{bankTo.name}"
			size="50" disabled="true" />							
	</aon:div>

</ui:composition>
