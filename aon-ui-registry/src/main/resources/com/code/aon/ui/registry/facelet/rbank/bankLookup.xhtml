<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:valueParam name="renderBankLookup" default="#{true}"/>

	<aon:div styleClass="aon-lookup" rendered="#{renderBankLookup}" >
		<a4j:region>
			<aon:lookupInputText id="RegistryBank_code#{bankSuffix}"
				value="#{bankTo.code}" size="5" 
				property="#{bankTo}" lookup="#{bankLookup}"
				reRender="RegistryBank_name#{bankSuffix}" 
				ajaxSingle="true" required="true">
				<aon:joinProperty alias="Bank_code" value="#{bankTo.code}" />
			</aon:lookupInputText>
			<aon:lookupButton 
				windowTitle="#{configBundle.config_bank_selection}"
				minHeight="460" minWidth="650"
				property="#{bankTo}" lookup="#{bankLookup}"
				selectReRender="RegistryBank_code#{bankSuffix},RegistryBank_name#{bankSuffix}"
				actionType="search">
			</aon:lookupButton>
			<aon:inputText id="RegistryBank_name#{bankSuffix}"
				value="#{bankTo.name}"
				size="50" disabled="true" />
		</a4j:region>							
	</aon:div>

</ui:composition>
