<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">

		<ui:define name="columns">
			<aon:column width="300" styleClass="aon-nowrap aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="RegistryBank_code" value="#{configBundle.config_bank}" />
				</f:facet>
				<aon:outputText value="#{to.bank.name}" rendered="#{formList}" />
				<ui:include src="bankLookup.xhtml">
					<ui:param name="bankTo" value="#{controller.to.bank}" />
					<ui:param name="renderBankLookup" value="#{formEdit}" />
				</ui:include>
				<f:facet name="footer">
					<ui:include src="bankLookup.xhtml">
						<ui:param name="bankTo" value="#{controller.to.bank}" />
						<ui:param name="renderBankLookup" value="#{formNew}" />
						<ui:param name="bankSuffix" value="-New" />
					</ui:include>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{configBundle.config_bank_account}" />
				</f:facet>
				<aon:outputText value="#{to.bankAccount}" rendered="#{formList}" />
				<ui:include src="bankAccount.xhtml">
					<ui:param name="bankAccountTo" value="#{controller.to.bankAccount}" />
					<ui:param name="renderBankAccount" value="#{formEdit}" />
				</ui:include>
				<f:facet name="footer">
					<ui:include src="bankAccount.xhtml">
						<ui:param name="bankAccountTo" value="#{controller.to.bankAccount}" />
						<ui:param name="renderBankAccount" value="#{formNew}" />
					</ui:include>
				</f:facet>
			</aon:column>
			
			<c:if test="#{showSuffix}">
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel for="RegistryBank_suffix" value="#{configBundle.config_bank_sufix}" />
					</f:facet>
					<aon:outputText value="#{to.sufix}" rendered="#{formList}" />
					<aon:inputText id="RegistryBank_suffix"
						value="#{to.sufix}" rendered="#{formEdit}"
						size="5" maxlength="3" />
					<f:facet name="footer">
						<aon:inputText id="RegistryBank_suffix-New"
							value="#{controller.to.sufix}" rendered="#{formNew}"
							size="5" maxlength="3" />
					</f:facet>
				</aon:column>
			</c:if>

		</ui:define>
	</ui:decorate>

</ui:composition>
