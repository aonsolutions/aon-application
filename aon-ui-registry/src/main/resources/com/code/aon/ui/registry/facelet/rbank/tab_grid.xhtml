<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">

		<ui:define name="columns">
			<aon:column styleClass="aon-nowrap aon-editDataTable-textColumn aon-width-auto" >
				<f:facet name="header">
					<aon:outputLabel for="Bank_id" value="#{bundle.aon_bank}" />
				</f:facet>
				<aon:outputText value="#{to.bank.name}" rendered="#{formList}" />
				<ui:include src="lookup.xhtml" >
					<ui:param name="lookupTo" value="#{controller.to.bank}" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
				</ui:include>
				<f:facet name="footer" >
					<ui:include src="lookup.xhtml" >
						<ui:param name="lookupTo" value="#{controller.to.bank}" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="lookupSuffix" value="-New" />
					</ui:include>
				</f:facet>				
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150" >
				<f:facet name="header">
					<aon:outputLabel for="RegistryBank_alias" value="#{bundle.aon_alias}" />
				</f:facet>
				<aon:outputText value="#{to.alias}" rendered="#{formList}" />
				<aon:inputText id="RegistryBank_alias"
					value="#{to.alias}" rendered="#{formEdit}"
					size="15" maxlength="16" />
				<f:facet name="footer">
					<aon:inputText id="RegistryBank_alias-New"
						value="#{controller.to.alias}" rendered="#{formNew}"
						size="15" maxlength="16" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_bank_account}" />
				</f:facet>
				<aon:outputText value="#{to.bankAccount}" rendered="#{formList}" />
				<ui:include src="bankAccount.xhtml">
					<ui:param name="bankAccountTo" value="#{controller.to.bankAccount}" />
					<ui:param name="renderBankAccount" value="#{formEdit}" />
				</ui:include>
				<f:facet name="footer">
					<ui:include src="bankAccount.xhtml">
						<ui:param name="bankAccountTo" value="#{controller.to.bankAccount}" />
						<ui:param name="renderBankAccount" value="#{formNew}" />
					</ui:include>
				</f:facet>
			</aon:column>
			
			<c:if test="#{showSuffix}">
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
					<f:facet name="header">
						<aon:outputLabel for="RegistryBank_suffix" value="#{bundle.config_bank_sufix}" />
					</f:facet>
					<aon:outputText value="#{to.sufix}" rendered="#{formList}" />
					<aon:inputText id="RegistryBank_suffix"
						value="#{to.sufix}" rendered="#{formEdit}"
						size="5" maxlength="3" />
					<f:facet name="footer">
						<aon:inputText id="RegistryBank_suffix-New"
							value="#{controller.to.sufix}" rendered="#{formNew}"
							size="5" maxlength="3" />
					</f:facet>
				</aon:column>
				
				<c:if test="#{aonRole.accountingOperator}">	
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
						<f:facet name="header">
							<aon:outputLabel for="Account_id-rbank" value="#{bundle.account_account}" />
						</f:facet>
						<aon:div style="width: 90%;" rendered="#{formList}" ajaxRendered="true">
							<aon:outputText value="#{to.account.code}" />
							<rich:toolTip value="#{to.account.description}"
								hideEvent="onmouseout" showDelay="200">
							</rich:toolTip>
						</aon:div>
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{controller.to.account}" />
							<ui:param name="lookupSuffix" value="-rbank" />
							<ui:param name="lookupRendered" value="#{formEdit}" />
							<ui:param name="skipSuggestText" value="#{true}" />
						</ui:include>
						<f:facet name="footer">
							<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{controller.to.account}" />
							<ui:param name="lookupSuffix" value="-rbank-New" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="skipSuggestText" value="#{true}" />
							</ui:include>
						</f:facet>
					</aon:column>
				</c:if>
			</c:if>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel for="RegistryBank_active" value="#{bundle.aon_active}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="&#160;"
					styleClass="#{to.active?'aon-icon-checked':'aon-icon-check'}" 
					style="padding-left: 20px;background-position: 5px 2px;" />
				<aon:selectBooleanCheckbox id="RegistryBank_active"
					rendered="#{formEdit}" value="#{to.active}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox id="RegistryBank_active-New"
						rendered="#{formNew}" value="#{controller.to.active}">
					</aon:selectBooleanCheckbox>
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
