<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:valueParam name="showSuffix" default="#{false}"/>

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="skipLineEdition" value="#{!aonRole.financeOperator}" />

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="#{controller.beanName}_BankAccount_country" value="#{bundle.aon_iban}" />
				</f:facet>
				<aon:outputText value="#{to.bankAccount}" rendered="#{formList and aonRole.financeOperator}" />
				<aon:outputText value="#{to.bankAccount.maskedIban}" rendered="#{formList and !aonRole.financeOperator}" />
				<ui:include src="bankAccount.xhtml">
					<ui:param name="bankAccountController" value="#{controller.accountHelper}" />
					<ui:param name="renderBankAccount" value="#{formEdit}" />
					<ui:param name="bankAccountPrefix" value="#{controller.beanName}" />
					<ui:param name="bankCodeChangeReRender" value="RegistryBank_alias,RegistryBank_bic" />
				</ui:include>
				<f:facet name="footer">
					<aon:div>
						<ui:include src="bankAccount.xhtml">
							<ui:param name="bankAccountController" value="#{controller.accountHelper}" />
							<ui:param name="renderBankAccount" value="#{formNew}" />
							<ui:param name="bankAccountPrefix" value="#{controller.beanName}" />
							<ui:param name="bankAccountSuffix" value="-New" />
							<ui:param name="bankCodeChangeReRender" value="RegistryBank_alias-New,RegistryBank_bic-New" />
						</ui:include>
					</aon:div>															
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-180" >
				<f:facet name="header">
					<aon:outputLabel for="RegistryBank_alias" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.alias}" rendered="#{formList}" />
				<aon:inputText id="RegistryBank_alias"
					value="#{to.alias}" 
					size="25" maxlength="25" required="#{true}"
					rendered="#{formEdit}" />
				<f:facet name="footer">
					<aon:inputText id="RegistryBank_alias-New"
						value="#{controller.to.alias}" 
						size="25" maxlength="25" required="#{true}"
						rendered="#{formNew}" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-110">
				<f:facet name="header">
					<aon:outputLabel for="RegistryBank_bic" value="#{bundle.aon_bic}" />
				</f:facet>
				<aon:outputText value="#{to.bic}" rendered="#{formList}" />
				<aon:inputText id="RegistryBank_bic"
					value="#{to.bic}" validator="BICValidator"
					size="12" maxlength="11" required="#{true}"
					rendered="#{formEdit}">
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="RegistryBank_bic-New"
						value="#{controller.to.bic}" validator="BICValidator"
						size="12" maxlength="11" required="#{true}"
						rendered="#{formNew}">
					</aon:inputText>
				</f:facet>
			</aon:column>
			
			<aon:if test="#{showSuffix}">
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-50">
					<f:facet name="header">
						<aon:outputLabel for="RegistryBank_suffix" value="#{bundle.config_bank_sufix}" />
					</f:facet>
					<aon:outputText value="#{to.sufix}" rendered="#{formList}" />
					<aon:inputText id="RegistryBank_suffix"
						value="#{to.sufix}"
						size="3" maxlength="3" 
						rendered="#{formEdit}" />
					<f:facet name="footer">
						<aon:inputText id="RegistryBank_suffix-New"
							value="#{controller.to.sufix}"
							size="3" maxlength="3" 
							rendered="#{formNew}" />
					</f:facet>
				</aon:column>
				
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-50">
    				<f:facet name="header">
        				<aon:outputLabel for="RegistryBank_requisition" value="#{bundle.aon_requisition}" />
    				</f:facet>

    			<aon:outputText value="#{empty to.requisition ? 'no vinculado' : to.requisition}" rendered="#{formList}" />

    			<aon:inputText id="RegistryBank_requisition"
        			value="#{empty to.requisition ? 'no vinculado' : to.requisition}"
        			readonly="true" 
        			rendered="#{formEdit}" />

			    <f:facet name="footer">
			        <aon:inputText id="RegistryBank_requisition-new"
			            value="#{empty controller.to.requisition ? 'no vinculado' : controller.to.requisition}"
			            readonly="true" 
			            rendered="#{formNew}" />
			    </f:facet>
				</aon:column>

				
				<aon:if test="#{aonRole.accountingOperator}">	
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
						<f:facet name="header">
							<aon:outputLabel for="Account_id-rbank" value="#{bundle.account_account}" />
						</f:facet>
						<aon:div style="width: 90%;" rendered="#{formList}" ajaxRendered="true">
							<aon:outputText value="#{to.account.code}" />
							<rich:toolTip value="#{to.account.description}"
								hideEvent="onmouseout" showDelay="200">
							</rich:toolTip>
						</aon:div>
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{controller.to.account}" />
							<ui:param name="lookupSuffix" value="-rbank" />
							<ui:param name="lookupRendered" value="#{formEdit}" />
							<ui:param name="skipSuggestText" value="#{true}" />
						</ui:include>
						<f:facet name="footer">
							<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{controller.to.account}" />
							<ui:param name="lookupSuffix" value="-rbank-New" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="skipSuggestText" value="#{true}" />
							</ui:include>
						</f:facet>
					</aon:column>
				</aon:if>
			</aon:if>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-50">
				<f:facet name="header">
					<aon:outputLabel for="RegistryBank_active" value="#{bundle.aon_active}" />
				</f:facet>
				<aon:outputText value="&#160;"
					styleClass="#{to.active?'aon-icon-checked':'aon-icon-check'}" 
					style="padding-left: 20px;background-position: 5px 2px;"
					rendered="#{formList}" />
				<aon:selectBooleanCheckbox id="RegistryBank_active"
					value="#{to.active}"
					rendered="#{formEdit}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox id="RegistryBank_active-New"
						value="#{controller.to.active}"
						rendered="#{formNew}">
					</aon:selectBooleanCheckbox>
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
