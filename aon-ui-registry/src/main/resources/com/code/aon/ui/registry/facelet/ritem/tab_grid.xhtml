<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn"
				alias="RegistryItem.item.product.name">
				<f:facet name="header">
					<aon:outputLabel for="Item_id" value="#{bundle.aon_product}" />
				</f:facet>
				<aon:outputText value="#{to.item.product.name} #{to.item.detail}"
					rendered="#{formList}" />
					
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{controller.to.item}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
				</ui:include>
				<f:facet name="footer" >
					<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{controller.to.item}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="lookupSuffix" value="-New" />
					</ui:include>
				</f:facet>					

			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-120"
				alias="RegistryItem.status">
				<f:facet name="header">
					<aon:outputLabel for="RegistryItem_status" value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}" rendered="#{formList}" />
				<aon:selectOneMenu id="RegistryItem_status" rendered="#{formEdit}"
					required="true" value="#{to.status}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{registryCollections.registryItemStatuses}" />
				</aon:selectOneMenu>								
				<f:facet name="footer">
					<aon:selectOneMenu id="RegistryItem_status-New" rendered="#{formNew}"
						required="true" value="#{controller.to.status}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{registryCollections.registryItemStatuses}" />
					</aon:selectOneMenu>								
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
