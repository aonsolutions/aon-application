<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:define name="columns">

			<aon:if test="#{!controller.masterItem}">
				<aon:column styleClass="aon-editDataTable-textColumn"
					alias="RegistryItem.item.product.name">
					<f:facet name="header">
						<aon:outputLabel for="Item_id" value="#{bundle.aon_product}" />
					</f:facet>
					<aon:outputText value="#{to.item.product.name} #{to.item.detail}"
						rendered="#{formList}" />
					<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
						<ui:param name="lookupBean" value="#{(controller.commercialType or controller.saleType) ? saleItemLookup : purchaseItemLookup}" />
						<ui:param name="lookupTo" value="#{controller.to.item}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formEdit}" />
						<aon:if test="#{controller.purchaseType}">
							<ui:param name="lookupReRender"	value="RegistryItem_Priority" />
						</aon:if>
						<aon:methodParam name="lookupChangeListener"
							value="#{controller.onItemChanged}" type="lookupChangeListener" />
					</ui:include>
					<f:facet name="footer" >
						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
							<ui:param name="lookupBean" value="#{(controller.commercialType or controller.saleType) ? saleItemLookup : purchaseItemLookup}" />
							<ui:param name="lookupTo" value="#{controller.to.item}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupSuffix" value="-New" />
							<aon:if test="#{controller.purchaseType}">
								<ui:param name="lookupReRender"	value="RegistryItem_Priority-New" />
							</aon:if>
							<aon:methodParam name="lookupChangeListener"
								value="#{controller.onItemChanged}" type="lookupChangeListener" />
							</ui:include>
					</f:facet>					
				</aon:column>
			</aon:if>

			<aon:if test="#{controller.saleType or controller.purchaseType}">
				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
					<f:facet name="header">
						<aon:outputLabel for="RegistryItem_Priority" value="#{bundle.aon_priority}" />
					</f:facet>
					<aon:outputText value="#{to.priority}"
						rendered="#{formList}" />
					<aon:inputText id="RegistryItem_Priority" 
						value="#{controller.to.priority}" rendered="#{formEdit}"
						required="#{controller.purchaseType}" size="2" maxlength="3" />
					<f:facet name="footer">
						<aon:inputText id="RegistryItem_Priority-New" 
							value="#{controller.to.priority}" rendered="#{formNew}"
							required="#{controller.purchaseType}" size="2" maxlength="3" />
					</f:facet>
				</aon:column>

				<aon:if test="#{controller.masterItem}">
					<aon:if test="#{controller.saleType}">
						<aon:column	styleClass="aon-editDataTable-textColumn aon-width-auto aon-nowrap">
							<f:facet name="header">
								<aon:outputLabel for="Customer_id" value="#{bundle.aon_customer}" />
							</f:facet>
							<aon:outputText value="#{to.registry.fullName}"
								rendered="#{formList}" />
							<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
								<ui:param name="lookupTo" value="#{controller.to.registry}" />
								<ui:param name="lookupForRegistry" value="#{true}" />
								<ui:param name="idRequired" value="#{true}" />						
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupRendered" value="#{formEdit}" />
							</ui:include>
							<f:facet name="footer">
								<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
									<ui:param name="lookupTo" value="#{controller.to.registry}" />
									<ui:param name="lookupForRegistry" value="#{true}" />
									<ui:param name="idRequired" value="#{true}" />
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="lookupRendered" value="#{formNew}" />
									<ui:param name="lookupSuffix" value="-New" />
								</ui:include>
							</f:facet>
						</aon:column>
					</aon:if>
					<aon:if test="#{controller.purchaseType}">
						<aon:column	styleClass="aon-editDataTable-textColumn aon-width-auto aon-nowrap">
							<f:facet name="header">
								<aon:outputLabel for="Supplier_id" value="#{bundle.aon_supplier}" />
							</f:facet>
							<aon:outputText value="#{to.registry.fullName}"
								rendered="#{formList}" />
							<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
								<ui:param name="lookupTo" value="#{controller.to.registry}" />
								<ui:param name="lookupForRegistry" value="#{true}" />
								<ui:param name="idRequired" value="#{true}" />						
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupRendered" value="#{formEdit}" />
							</ui:include>
							<f:facet name="footer">
								<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
									<ui:param name="lookupTo" value="#{controller.to.registry}" />
									<ui:param name="lookupForRegistry" value="#{true}" />
									<ui:param name="idRequired" value="#{true}" />
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="lookupRendered" value="#{formNew}" />
									<ui:param name="lookupSuffix" value="-New" />
								</ui:include>
							</f:facet>
						</aon:column>
					</aon:if>
				</aon:if>

				<aon:column	styleClass="aon-editDataTable-textColumn aon-width-150 aon-nowrap"
					alias="RegistryItem.code">
					<f:facet name="header">
						<aon:if test="#{controller.saleType}">
							<aon:outputLabel for="RegistryItem_Code" value="#{bundle.product_item_customer_code}" />
						</aon:if>
						<aon:if test="#{controller.purchaseType}">
							<aon:outputLabel for="RegistryItem_Code" value="#{bundle.product_item_supplier_code}" />
						</aon:if>
					</f:facet>
					<aon:outputText value="#{to.code}" rendered="#{formList}" />
					<aon:inputText id="RegistryItem_Code"
						value="#{controller.to.code}" rendered="#{formEdit}" 
						size="15" maxlength="15" />
					<f:facet name="footer">
						<aon:inputText id="RegistryItem_Code-New"
							value="#{controller.to.code}" rendered="#{formNew}"
							size="15" maxlength="15" />
					</f:facet>
				</aon:column>

				<aon:column	styleClass="aon-editDataTable-numberColumn aon-width-80 aon-nowrap">
					<f:facet name="header">
						<aon:outputLabel for="RegistryItem_Price" value="#{bundle.aon_price}" />
					</f:facet>
					<aon:outputText value="#{to.price}" rendered="#{formList}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText> 
					<aon:inputText id="RegistryItem_Price"
						value="#{controller.to.price}" rendered="#{formEdit}" 
						required="true" size="5"/>
					<f:facet name="footer">
						<aon:inputText id="RegistryItem_Price-New"
							value="#{controller.to.price}" rendered="#{formNew}"
							required="true" size="5" />
					</f:facet>
				</aon:column>

				<aon:column	styleClass="aon-editDataTable-numberColumn aon-width-80 aon-nowrap">
					<f:facet name="header">
						<aon:outputLabel for="RegistryItem_Discount" value="#{bundle.aon_discount}" />
					</f:facet>
					<aon:outputText value="#{to.discountExpression.discountExpr}"
						rendered="#{formList}">
						<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
					</aon:outputText>
					<aon:inputText id="RegistryItem_Discount"
						value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
						required="true" size="5" />
					<f:facet name="footer">
						<aon:inputText id="RegistryItem_Discount-New"
							value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}"
							required="true" size="5" />
					</f:facet>
				</aon:column>
			</aon:if>

			<aon:if test="#{controller.purchaseType and companyCollections.currentUserWorkPlacesCount > 1}">
				<aon:column	styleClass="aon-editDataTable-textColumn aon-width-150 aon-nowrap">
					<f:facet name="header">
						<aon:outputLabel for="RegistryItem_WorkPlace" value="#{bundle.purchase_workplace}" />
					</f:facet>
					<aon:outputText value="#{to.workPlace.description}" rendered="#{formList}" />
					<aon:selectOneMenu id="RegistryItem_WorkPlace" rendered="#{formEdit}" 
						value="#{controller.to.workPlace}">
						<f:selectItem itemLabel=" - " itemValue="null" />
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu id="RegistryItem_workPlace-New" rendered="#{formNew}" 
							value="#{controller.to.workPlace}">
							<f:selectItem itemLabel=" - " itemValue="null" />
							<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
			</aon:if>
			
			<aon:if test="#{controller.commercialType}">
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-120"
					alias="RegistryItem.status">
					<f:facet name="header">
						<aon:outputLabel for="RegistryItem_status" value="#{bundle.aon_status}" />
					</f:facet>
					<aon:outputText value="#{to.status}" rendered="#{formList}" />
					<aon:selectOneMenu id="RegistryItem_status" rendered="#{formEdit}"
						required="true" value="#{to.status}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{registryCollections.registryItemStatuses}" />
					</aon:selectOneMenu>								
					<f:facet name="footer">
						<aon:selectOneMenu id="RegistryItem_status-New" rendered="#{formNew}"
							required="true" value="#{controller.to.status}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{registryCollections.registryItemStatuses}" />
						</aon:selectOneMenu>								
					</f:facet>
				</aon:column>
			</aon:if>

		</ui:define>
	</ui:decorate>

</ui:composition>
