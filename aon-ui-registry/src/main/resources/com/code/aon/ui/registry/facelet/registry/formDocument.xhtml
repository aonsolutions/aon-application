<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="pojoName" default="#{controller.pojoShortName}"/>
	<aon:valueParam name="registry" default="#{controller.to.registry}"/>

	<aon:outputLabel for="#{pojoName}_document" value="#{bundle.aon_document}" />
	<aon:panelGroup id="#{pojoName}DocumentPanel">
		<aon:outputText value="#{bundle.aon_document_country}" styleClass="aon-italic"/>
		<aon:selectOneMenu id="#{pojoName}_document_country" value="#{registry.documentCountry}"
			styleClass="aon-margin-left">
			<f:selectItem value="#{null}" itemLabel="-"/>
			<f:selectItems value="#{commonCollections.countryCodes}" />
			<a4j:support event="onchange" focus="#{pojoName}_document_type"
				actionListener="#{controller.onChangeDocument}"
				ajaxSingle="true" limitToList="true"
				reRender="#{pojoName}DocumentPanel"/>
		</aon:selectOneMenu>
		<aon:outputText value="#{bundle.aon_type}" styleClass="aon-margin-left aon-italic"/>
		<aon:selectOneMenu id="#{pojoName}_document_type" value="#{registry.documentType}"	styleClass="aon-margin-left">
			<f:selectItem value="#{null}" itemLabel="-"/>
			<f:selectItems value="#{registryCollections.documentTypes}" />
			<a4j:support event="onchange" focus="#{pojoName}_document"
				actionListener="#{controller.onChangeDocument}" 
				ajaxSingle="true" limitToList="true"
				reRender="#{pojoName}DocumentPanel"/>
		</aon:selectOneMenu>
		<aon:inputText id="#{pojoName}_document" maxlength="16" style="margin-left: 5px;"
			value="#{registry.document}" size="16">
			<f:validateLength minimum="1" maximum="16" />
			<a4j:support event="onchange" focus="#{pojoName}_name"
				actionListener="#{controller.onChangeDocument}" 
				ajaxSingle="true" limitToList="true"
				reRender="#{pojoName}DocumentPanel"/>
		</aon:inputText>
		<aon:outputText 
			rendered="#{!registry.documentValidable}"
			styleClass="aon-icon-info"
			style="padding-left: 15px;"
			value="&#160;" />
		<aon:outputText 
			rendered="#{registry.documentValidable and registry.validDocument}"
			styleClass="aon-icon-predetermine"
			style="padding-left: 15px;"
			value="&#160;" />
		<aon:outputText 
			rendered="#{registry.documentValidable and !registry.validDocument}"
			styleClass="aon-icon-exception"
			style="padding-left: 15px;"
			value="&#160;" />
	</aon:panelGroup>
			
</ui:composition>
