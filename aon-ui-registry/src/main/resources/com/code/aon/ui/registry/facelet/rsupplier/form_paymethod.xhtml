<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

		<aon:panel>
			<f:facet name="header">
				<aon:outputText value="#{bundle.finance_payMethod}" />
			</f:facet>
			<aon:panelGrid columns="8" styleClass="aon-width-all" style="font-size:0.9em;"
				rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
				columnClasses="aon-panelGrid-even aon-width-auto,
					aon-panelGrid-even aon-width-50,
					aon-panelGrid-even aon-width-70,
					aon-panelGrid-even aon-width-100,
					aon-panelGrid-even aon-width-70,
					aon-panelGrid-even aon-width-auto,
					aon-panelGrid-even aon-width-150,
					aon-panelGrid-even aon-width-100">

				<aon:outputLabel for="RegistrySupplier_payMethod" value="#{bundle.aon_type}"/>
				<aon:outputLabel for="RegistrySupplier_numberOfPayments" value="#{bundle.registry_number_of_payments}" />
				<aon:outputLabel for="RegistrySupplier_daysToFirstPayment" value="#{bundle.registry_days_to_first_payment}" />
				<aon:outputLabel for="RegistrySupplier_daysBetweenPayments" value="#{bundle.registry_days_between_payments}" />
				<aon:outputLabel for="RegistrySupplier_paymentDays" value="#{bundle.registry_payment_days}" />
				<aon:outputLabel value="#{bundle.aon_iban}" />
				<aon:outputLabel for="RegistrySupplier_bankAlias" value="#{bundle.aon_bank}" />
				<aon:outputLabel for="RegistrySupplier_bic" value="#{bundle.aon_bic}" />

				<aon:selectOneMenu id="RegistrySupplier_payMethod" 
					value="#{controller.to.payMethod}">
					<f:selectItems value="#{configCollections.payMethods}" />
				</aon:selectOneMenu>
				<aon:inputText id="RegistrySupplier_numberOfPayments"
					value="#{controller.to.numberOfPayments}" size="3" maxlength="2">
					<f:validateLongRange minimum="1" />
				</aon:inputText>	
				<aon:inputText id="RegistrySupplier_daysToFirstPayment"
					value="#{controller.to.daysToFirstPayment}"	size="3" maxlength="3">
					<f:validateLongRange minimum="0" />
				</aon:inputText>	
				<aon:inputText id="RegistrySupplier_daysBetweenPayments"
					value="#{controller.to.daysBetweenPayments}" size="3" maxlength="3">
					<f:validateLongRange minimum="0" />
				</aon:inputText>	
				<aon:inputText id="RegistrySupplier_paymentDays"
					value="#{controller.to.paymentDays}" size="5" />

				<aon:div>
					<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
						<ui:param name="bankAccountTo" value="#{controller.to.bankAccount}" />
						<ui:param name="bankAccountPrefix" value="RegistrySupplier" />
					</ui:include>
					<aon:commandButton id="bankAccountData" value="&#160;"
						title="#{bundle.aon_bank_data}"
						styleClass="aon-icon-commandButton aon-icon-ambito aon-margin-left" style="margin-top: 2px;"
						actionListener="#{controller.onBankAccountData}"
						reRender="RegistrySupplier_bankAlias,RegistrySupplier_bic" ajaxSingle="true">
					</aon:commandButton>
				</aon:div>
				<aon:inputText id="RegistrySupplier_bankAlias"
					value="#{controller.to.bankAlias}" 
					required="#{controller.to.bankAccount.validIbanLength}" size="25" maxlength="25" />
				<aon:inputText id="RegistrySupplier_bic"
					value="#{controller.to.bic}" validator="BICValidator" 
					required="#{controller.to.bankAccount.validIbanLength}" size="12" maxlength="11">
				</aon:inputText>

			</aon:panelGrid>
		</aon:panel>

</ui:composition>
