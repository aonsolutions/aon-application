<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

		<aon:panel>
			<f:facet name="header">
				<aon:outputText value="#{configBundle.config_pay_method}" />
			</f:facet>
			<aon:panelGrid columns="7" style="width:100%; font-size:0.9em;" 
				rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
				columnClasses="aon-panelGrid-even aon-width-200,
					aon-panelGrid-even aon-width-80,
					aon-panelGrid-even aon-width-100,
					aon-panelGrid-even aon-width-110,
					aon-panelGrid-even aon-width-100,
					aon-panelGrid-even aon-width-auto,
					aon-panelGrid-even aon-width-200">

				<aon:outputLabel for="RegistrySupplier_payMethod" 
					value="#{bundle.aon_type}"/>
				<aon:outputLabel for="RegistrySupplier_numberOfPayments"
					value="#{registryBundle.registry_number_of_payments}" />
				<aon:outputLabel for="RegistrySupplier_daysToFirstPayment"
					value="#{registryBundle.registry_days_to_first_payment}" />
				<aon:outputLabel for="RegistrySupplier_daysBetweenPayments"
					value="#{registryBundle.registry_days_between_payments}" />
				<aon:outputLabel for="RegistrySupplier_paymentDays"
					value="#{registryBundle.registry_payment_days}" />
				<aon:outputLabel for="Bank_id"
					value="#{configBundle.config_bank}" />
				<aon:outputLabel for="RegistrySupplier_bank_office"
					value="#{configBundle.config_bank_account}" />

				<aon:selectOneMenu id="RegistrySupplier_payMethod" 
					value="#{controller.to.payMethod}">
					<f:selectItems value="#{configCollections.payMethods}" />
				</aon:selectOneMenu>
				<aon:inputText id="RegistrySupplier_numberOfPayments"
					value="#{controller.to.numberOfPayments}" size="5" >
					<f:validateLongRange minimum="1" />
				</aon:inputText>	
				<aon:inputText id="RegistrySupplier_daysToFirstPayment"
					value="#{controller.to.daysToFirstPayment}"	size="5">
					<f:validateLongRange minimum="0" />
				</aon:inputText>	
				<aon:inputText id="RegistrySupplier_daysBetweenPayments"
					value="#{controller.to.daysBetweenPayments}" size="5">
					<f:validateLongRange minimum="0" />
				</aon:inputText>	
				<aon:inputText id="RegistrySupplier_paymentDays"
					value="#{controller.to.paymentDays}" size="5" />
				<ui:include src="/com/code/aon/ui/registry/facelet/rbank/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{controller.to.bank}" />
				</ui:include>						
				<aon:div>
					<aon:inputText id="RegistrySupplier_bank_office"
						value="#{controller.to.bankAccount.office}"
						size="4" maxlength="4">
						<f:validateLength minimum="4" maximum="4" />
					</aon:inputText>
					<aon:inputText id="RegistrySupplier_bank_control"
						value="#{controller.to.bankAccount.control}"
						size="2" maxlength="2">
						<f:validateLength minimum="2" maximum="2" />
					</aon:inputText>
					<aon:inputText id="RegistrySupplier_bank_account"
						value="#{controller.to.bankAccount.account}"
						size="10" maxlength="10">
						<f:validateLength minimum="10" maximum="10" />
					</aon:inputText>
				</aon:div>

			</aon:panelGrid>
		</aon:panel>

</ui:composition>
