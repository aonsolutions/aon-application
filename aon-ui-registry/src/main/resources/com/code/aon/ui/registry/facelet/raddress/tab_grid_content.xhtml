<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<aon:valueParam name="showMunicipality" default="#{false}"/>

	<aon:div style="width: 100%;">
		<aon:panelGrid columns="2" columnClasses="aon-panelGrid-even aon-italic,aon-panelGrid-even" align="center">
			<aon:outputLabel for="RegistryAddress_addressType" value="#{bundle.aon_type}" 
				rendered="#{controller.to.addressType != null}" />
			<aon:selectOneMenu id="RegistryAddress_addressType#{sufix}" styleClass="aon-margin-left aon-form-input-text"
				value="#{controller.to.addressType}" rendered="#{controller.to.addressType != null}"
				disabled="#{controller.to.mainAddress}" >
				<f:selectItems value="#{registryCollections.addressTypes}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="RegistryAddress_alias" value="#{bundle.aon_alias}"/>
			<aon:inputText id="RegistryAddress_alias#{sufix}" styleClass="aon-margin-left aon-form-input-text"
				value="#{controller.to.alias}" size="18" maxlength="15" />


			<aon:outputLabel for="RegistryAddress_address" value="#{bundle.aon_address}" styleClass="aon-italic"/>
			<aon:div>
				<aon:selectOneMenu id="RegistryAddress_streetType#{sufix}" styleClass="aon-margin-left aon-form-input-text"
					value="#{controller.to.streetType}">
					<f:selectItems value="#{registryCollections.streetTypes}" />
				</aon:selectOneMenu>
				<aon:inputText id="RegistryAddress_address#{sufix}" required="true" styleClass="aon-margin-left aon-form-input-text"
					value="#{controller.to.address}" size="40" maxlength="128" />
				<aon:outputLabel for="RegistryAddress_number" value="#{bundle.aon_number}" styleClass="aon-italic aon-margin-left"/>
				<aon:inputText id="RegistryAddress_number#{sufix}" styleClass="aon-margin-left aon-form-input-text"
					value="#{controller.to.number}" size="10" maxlength="5" />
			</aon:div>
			
			<aon:outputText value="#{bundle.registry_address_detail}" styleClass="aon-italic"/>
			<aon:div>
				<aon:inputText id="RegistryAddress_address2#{sufix}" styleClass="aon-margin-left aon-form-input-text"
					value="#{controller.to.address2}" size="30" maxlength="128" />
				<aon:inputText id="RegistryAddress_address3#{sufix}" styleClass="aon-margin-left aon-form-input-text"
					value="#{controller.to.address3}" size="30" maxlength="128" />
			</aon:div>

			<aon:outputLabel for="RegistryAddress_zip" value="#{bundle.aon_postal_code}" styleClass="aon-italic" />
			<aon:div>
				<aon:inputText id="RegistryAddress_zip#{sufix}"	required="true" styleClass="aon-margin-left aon-form-input-text"
					reRender="RegistryAddress_geozone#{sufix}, RegistryAddress_municipality#{sufix}"
					actionListener="#{controller.onLoadGeozone}"
					focus="#{showMunicipality?'RegistryAddress_municipality':'RegistryAddress_city'}#{sufix}"
					value="#{controller.to.zip}" size="8" maxlength="16" />
				<aon:outputLabel for="RegistryAddress_geozone" value="#{bundle.aon_state}" styleClass="aon-italic aon-margin-left"/>
				<aon:selectOneMenu id="RegistryAddress_geozone#{sufix}"	styleClass="aon-margin-left aon-form-input-text"
					value="#{controller.to.geozone}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{geozoneCollections.geoTrees}" />
					<a4j:support event="onchange" reRender="RegistryAddress_municipality#{sufix}" ajaxSingle="true" />
				</aon:selectOneMenu>
			</aon:div>
			
			<aon:if test="#{showMunicipality}">
				<aon:outputLabel for="RegistryAddress_municipality" value="#{bundle.registry_municipality}" styleClass="aon-italic"/>
				<aon:div>
					<aon:selectOneMenu id="RegistryAddress_municipality#{sufix}" styleClass="aon-margin-left aon-form-input-text"
						value="#{controller.to.municipalityCode}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{controller.municipalities}" />
					</aon:selectOneMenu>
					<aon:outputLabel for="RegistryAddress_city" value="#{bundle.registry_city}" styleClass="aon-italic aon-margin-left"/>
					<aon:inputText id="RegistryAddress_city#{sufix}" required="true" styleClass="aon-margin-left aon-form-input-text"
						value="#{controller.to.city}" size="20" maxlength="64" />
				</aon:div>
			</aon:if>
			<aon:if test="#{!showMunicipality}">
				<aon:outputLabel for="RegistryAddress_city" value="#{bundle.registry_city}" styleClass="aon-italic"/>
				<aon:inputText id="RegistryAddress_city#{sufix}" required="true" styleClass="aon-margin-left aon-form-input-text"
					value="#{controller.to.city}" size="20" maxlength="64" />
			</aon:if>
		</aon:panelGrid>
	</aon:div>

</ui:composition>
