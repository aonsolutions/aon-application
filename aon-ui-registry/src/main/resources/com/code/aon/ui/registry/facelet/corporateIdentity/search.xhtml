<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="corporateIdentityAttachSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{registryBundle.registry_corporate_documents}" />
				<ui:param name="controller" value="#{corporateIdentityAttach}" />
				<ui:param name="skipResetButton" value="#{!aonRole.admin}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{corporateIdentityAttach}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="RegistryAttachment_description"
						value="#{bundle.aon_name}" />
					<aon:inputText id="RegistryAttachment_description" size="80"
						valueChangeListener="#{controller.addExpression}" />
					
					<aon:outputLabel for="RegistryAttachment_category_id"
						value="#{registryBundle.registry_category}" />
					<aon:selectOneMenu id="RegistryAttachment_category_id"
						value="#{registryCollections.category}"
						valueChangeListener="#{controller.addCategoryEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{registryCollections.categories}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="RegistryAttachment_attachDate-From"
						value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="RegistryAttachment_attachDate-From" styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="RegistryAttachment_attachDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="RegistryAttachment_attachDate-To" styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="RegistryAttachment_attachDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
										
					<c:if test="#{aonRole.confidentiality}">
						<aon:outputLabel for="RegistryAttachment_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneRadio id="RegistryAttachment_securityLevel" 
							valueChangeListener="#{controller.addExpression}" >
							<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
							<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
						</aon:selectOneRadio>
					</c:if>
						
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
