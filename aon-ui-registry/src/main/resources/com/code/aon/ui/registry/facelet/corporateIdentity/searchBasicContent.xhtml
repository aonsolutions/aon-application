<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<c:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
		<ui:param name="searchController" value="#{corporateIdentitySearch}" />
	</c:if>

	<aon:outputLabel for="RegistryAttachment_description"
		value="#{bundle.aon_name}" />
	<aon:inputText id="RegistryAttachment_description" size="60"
		valueChangeListener="#{controller.addExpression}" />
	
	<aon:outputLabel for="RegistryAttachment_mimeType"
		value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="RegistryAttachment_mimeType"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{commonCollections.mimeTypes}" />
	</aon:selectOneMenu>		

	<ui:include 
		src="/com/code/aon/ui/config/facelet/tag/input.xhtml" />
		
	<ui:include
		src="/com/code/aon/ui/config/facelet/scope/searchContent.xhtml" />		
		
	<aon:outputLabel for="RegistryAttachment_category"
		value="#{bundle.aon_category}" />
	<aon:div id="categoryDiv">
		<a4j:region>
			<a4j:repeat value="#{searchController.categories}" rowKeyVar="index" var="raCategory">
				<aon:div styleClass="#{(index != 0)?'aon-padding-top':''}">
					<aon:selectOneMenu id="RegistryAttachment_category"
						value="#{searchController.categories[index]}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{registryCollections.categories}" />
						<a4j:support event="onchange" reRender="categoryDiv"/>
					</aon:selectOneMenu>
					<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" reRender="categoryDiv"
						actionListener="#{searchController.onRemoveCategory}" value="&#160;" immediate="true"
						rendered="#{raCategory.id != null}">
						<f:param name="index" value="#{index}" />
					</aon:commandButton>
					<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" reRender="categoryDiv"
						actionListener="#{searchController.onAddCategory}" value="&#160;" immediate="true"
						rendered="#{(raCategory.id != null) and (index == (searchController.categoriesSize-1))}"/>
				</aon:div>						
			</a4j:repeat>
		</a4j:region>
	</aon:div>			

	<aon:outputLabel for="RegistryAttachment_size-From"
		value="#{bundle.aon_size} (KB)" />
	<aon:div>
		<aon:outputLabel for="RegistryAttachment_size-From" styleClass="aon-form-date-label aon-padding-right"
			value="#{bundle.aon_date_from}:" />
		<aon:inputText id="RegistryAttachment_size-From" size="10"
			value="#{searchController.sizeFrom}" />

		<aon:outputLabel for="RegistryAttachment_size-To" styleClass="aon-form-date-label aon-padding-right"
			value="#{bundle.aon_date_to}:" />
		<aon:inputText id="RegistryAttachment_size-To" size="10"
			value="#{searchController.sizeTo}" />
	</aon:div>
		
	<aon:outputLabel for="RegistryAttachment_attachDate-From"
		value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="RegistryAttachment_attachDate-From" styleClass="aon-form-date-label aon-padding-right"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="RegistryAttachment_attachDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="RegistryAttachment_attachDate-To" styleClass="aon-form-date-label aon-padding-right"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="RegistryAttachment_attachDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
						
	<c:if test="#{aonRole.confidentiality}">
		<aon:outputLabel for="RegistryAttachment_securityLevel"
			value="#{bundle.aon_confidential}" />
		<aon:selectOneRadio id="RegistryAttachment_securityLevel" 
			valueChangeListener="#{controller.addExpression}" >
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
		</aon:selectOneRadio>
	</c:if>

</ui:composition>
