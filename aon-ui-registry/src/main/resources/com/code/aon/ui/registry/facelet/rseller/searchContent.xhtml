<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{searchController.registrySeller}" />
		<ui:param name="lookupForRegistry" value="#{true}" />
		<ui:param name="lookupSuffix" value="-RegistrySeller" />
		<ui:param name="skipNewButton" value="#{true}" />		
	</ui:include>

	<aon:outputText value="#{bundle.aon_start_date}" />
	<aon:div>
		<aon:outputLabel for="#{controller.pojoShortName}_sellers_startDate-From"
			styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="#{controller.pojoShortName}_sellers_startDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			popupDateFormat="#{bundle.aon_date_pattern}" />

		<aon:outputLabel for="#{controller.pojoShortName}_sellers_startDate-To"
			styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="#{controller.pojoShortName}_sellers_startDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			popupDateFormat="#{bundle.aon_date_pattern}" />
	</aon:div>			

	<aon:outputText value="#{bundle.aon_end_date}" />
	<aon:div>
		<aon:outputLabel for="#{controller.pojoShortName}_sellers_endDate-From"
			styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="#{controller.pojoShortName}_sellers_endDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			popupDateFormat="#{bundle.aon_date_pattern}" />

		<aon:outputLabel for="#{controller.pojoShortName}_sellers_endDate-To"
			styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="#{controller.pojoShortName}_sellers_endDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			popupDateFormat="#{bundle.aon_date_pattern}" />
	</aon:div>			
	
	<aon:outputLabel for="#{controller.pojoShortName}_sellers_status"
		value="#{bundle.aon_status}" />
	<aon:selectOneMenu id="#{controller.pojoShortName}_sellers_status"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{registryCollections.registrySellerStatuses}" />
	</aon:selectOneMenu>									

</ui:composition>
