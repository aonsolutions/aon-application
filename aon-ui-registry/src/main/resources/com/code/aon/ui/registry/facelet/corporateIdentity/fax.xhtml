<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="corporateIdentityFaxForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_fax}" />
				<ui:param name="toolbarDescription" value="#{corporateIdentity.identityReport.company.fullName}" />
				<ui:define name="toolbarContent">
					<aon:htmlCommandLink id="export2pdf_fax" value="PDF" title="PDF"
						action="#{report.onExecute}" target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">							
						<f:param name="reportKey" value="corporateIdentity_fax" />
					</aon:htmlCommandLink>
					<aon:commandButton id="remove" value="#{bundle.aon_clear}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						action="corporateIdentity_fax" actionListener="#{corporateIdentity.onClear}" 
						immediate="true" accesskey="#{bundle.aon_key_remove}" />
					<aon:if test="#{corporateIdentity.showBackButton}">						
						<aon:commandButton id="cancel" value="#{bundle.aon_back}"
							action="corporateIdentity_predefined"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="true"
							accesskey="#{bundle.aon_key_cancel}" />
					</aon:if> 
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4">

					<aon:outputLabel for="fax_to"
						value="#{bundle.registry_corporateIdentity_to}" />
					<aon:inputText id="fax_to" 
						size="50" 
						value="#{corporateIdentity.identityReport.fax_to}" />
	
					<aon:outputLabel for="fax_from"
						value="#{bundle.registry_corporateIdentity_from}" />
					<aon:inputText id="fax_from" 
						size="50" 
						value="#{corporateIdentity.identityReport.fax_from}" />

					<aon:outputLabel for="fax_number"
						value="#{bundle.registry_corporateIdentity_fax_number}" />
					<aon:inputText id="fax_number" 
						size="50" 
						value="#{corporateIdentity.identityReport.fax_number}" />
	
					<aon:outputLabel for="fax_page_number"
						value="#{bundle.registry_corporateIdentity_fax_page_number}" />
					<aon:inputText id="fax_page_number" 
						size="5" 
						value="#{corporateIdentity.identityReport.fax_page_number}" />

					<aon:outputLabel for="fax_phone_number"
						value="#{bundle.registry_corporateIdentity_fax_phone_number}" />
					<aon:inputText id="fax_phone_number" 
						size="50" 
						value="#{corporateIdentity.identityReport.fax_phone_number}" />
	
					<aon:outputLabel for="fax_date" 
						value="#{bundle.registry_corporateIdentity_date}" />
					<aon:selectInputDate id="fax_date" 
						value="#{corporateIdentity.identityReport.fax_date}"
						popupDateFormat="dd/MM/yyyy">
					</aon:selectInputDate>
	
				</aon:panelGrid>
				<aon:div styleClass="aon-scroll-area">
				</aon:div>
				<aon:panelGrid columns="2">

					<aon:outputLabel for="fax_subject"
						value="#{bundle.registry_corporateIdentity_subject}" />
					<aon:inputText id="fax_subject" 
						size="120" 
						value="#{corporateIdentity.identityReport.fax_subject}" />
		
					<aon:outputLabel for="fax_content"
						value="#{bundle.registry_corporateIdentity_content}" />
					<aon:inputTextarea id="fax_content"
						value="#{corporateIdentity.identityReport.fax_content}"
						cols="120" rows="25"/>

				</aon:panelGrid>
			</aon:div>
	
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
