<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/lookupAudit.xhtml" >
		<ui:param name="lookupBean" value="#{imageLookup}" />
		<ui:param name="controller" value="#{companyImages}" />
		<ui:param name="lookupLabel" value="#{registryBundle.registry_image}"/>
		<ui:param name="lookupInputSuggestValue" value="#{lookupTo.description}"/>
		<ui:param name="lookupInputSuggestExpression" value="#{lto.description} (#{lto.id})"/>		
		<ui:param name="searchButtonTitle" value="#{registryBundle.registry_image_selection}" />
		<ui:param name="skipNewButton" value="#{true}" />
		<ui:param name="skipGoToButton" value="#{true}" />
		<ui:param name="skipSuggestText" value="#{lookupTo.id != null}" />
		<ui:param name="lookupImageKey" value="#{lookupTo.imageKey}" />
		<ui:define name="afterLookupContent">
			<c:if test="#{lookupTo.id != null}">
				<a4j:mediaOutput element="img"
					value="#{lookupTo.id}"
					title="#{lookupTo.description}"
					style="vertical-align:top;height:100px;"
					createContent="#{companyImages.createContent}" />
			</c:if>
		</ui:define>		
	</ui:decorate>

</ui:composition>
