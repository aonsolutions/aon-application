<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="skipRemoveButton" value="#{controller.to.mainAddress}" />
	
		<ui:define name="beginFormListContent">
			<aon:outputText value="&#160;&#160;&#160;" title="#{bundle.aon_principal}"
				rendered="#{to.mainAddress}"
				styleClass="aon-icon-company" />
		</ui:define>
		
		<ui:define name="beginFormEditContent">
			<aon:outputText value="&#160;&#160;&#160;" title="#{bundle.aon_principal}"
				rendered="#{to.mainAddress}"
				styleClass="aon-icon-company" />
		</ui:define>
		
		<ui:define name="columns">
			<f:facet name="footer">
				<rich:columnGroup  rendered="#{formNew}">
					<aon:column>
					</aon:column>
					<rich:column colspan="5" style="padding-left: 50px;">
						<ui:include src="tab_grid_content.xhtml">
							<ui:param name="sufix" value="-New" />
						</ui:include>
					</rich:column>
					<aon:column>
					</aon:column>
				</rich:columnGroup>
			</f:facet>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top" colspan="5" rendered="#{formEdit}">
				<ui:include src="tab_grid_content.xhtml">
					<ui:param name="sufix" value="" />
				</ui:include>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top" rendered="#{formList}">
				<f:facet name="header">
					<aon:outputLabel for="RegistryAddress_address" value="#{bundle.aon_address}" />
				</f:facet>
				<aon:outputText value="#{to.fullAddress}" />					
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-40 aon-nowrap" rendered="#{formList}">
				<f:facet name="header">
					<aon:outputLabel for="RegistryAddress_zip" value="#{bundle.aon_postal_code}" />
				</f:facet>
				<aon:outputText value="#{to.zip}"/>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-150 aon-nowrap" rendered="#{formList}">
				<f:facet name="header">
					<aon:outputLabel for="RegistryAddress_city" value="#{bundle.registry_city}" />
				</f:facet>
				<aon:outputText value="#{to.city}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-150 aon-nowrap" rendered="#{formList}">
				<f:facet name="header">
					<aon:outputLabel for="RegistryAddress_geozone" value="#{bundle.aon_state}" />
				</f:facet>
				<aon:outputText value="#{to.geozone.name}"/>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-70 aon-nowrap" rendered="#{formList}">
				<f:facet name="header">
					<aon:outputLabel for="RegistryAddress_addressType" value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.addressType}" />
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
