<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">

		<ui:define name="columns">

			<c:if test="#{!skipTypeColumn}">								
				<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-80 aon-nowrap">
					<f:facet name="header">
						<aon:outputLabel for="RegistryAddress_addressType" value="#{bundle.aon_type}" />
					</f:facet>
					<aon:outputText value="#{to.addressType}"
						rendered="#{formList}" />
					<aon:selectOneMenu id="RegistryAddress_addressType"
						rendered="#{formEdit}" value="#{controller.to.addressType}">
						<f:selectItems value="#{registryCollections.addressTypes}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu id="RegistryAddress_addressType-New"
							rendered="#{formNew}" value="#{controller.to.addressType}">
							<f:selectItems value="#{registryCollections.addressTypes}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
			</c:if>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top">
				<f:facet name="header">
					<aon:outputLabel for="RegistryAddress_address" value="#{registryBundle.registry_address}" />
				</f:facet>
				<aon:outputText value="#{to.address} #{to.address2} #{to.address3}"
					rendered="#{formList}" />
				<aon:inputText id="RegistryAddress_address"
					value="#{controller.to.address}"
					style="display:block" rendered="#{formEdit}"
					required="true" size="40" />
				<aon:inputText value="#{controller.to.address2}"
					style="display:block" rendered="#{formEdit}" size="40" />
				<aon:inputText value="#{controller.to.address3}"
					style="display:block" rendered="#{formEdit}" size="40" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText id="RegistryAddress_address-New"
							value="#{controller.to.address}"
							style="display:block" rendered="#{formNew}"
							required="true" size="40" />
						<aon:inputText value="#{controller.to.address2}"
							style="display:block" rendered="#{formNew}" size="40" />
						<aon:inputText value="#{controller.to.address3}"
							style="display:block" rendered="#{formNew}" size="40" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-40 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="RegistryAddress_zip" value="#{registryBundle.registry_zip}" />
				</f:facet>
				<aon:outputText value="#{to.zip}" rendered="#{formList}" />
				<aon:inputText id="RegistryAddress_zip" 
					value="#{controller.to.zip}"
					rendered="#{formEdit}" required="true" size="8" />
				<f:facet name="footer">
					<aon:inputText id="RegistryAddress_zip-New"
						value="#{controller.to.zip}"
						rendered="#{formNew}" required="true" size="8" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-150 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="RegistryAddress_city" value="#{registryBundle.registry_city}" />
				</f:facet>
				<aon:outputText value="#{to.city}" rendered="#{formList}" />
				<aon:inputText id="RegistryAddress_city" 
					value="#{controller.to.city}"
					rendered="#{formEdit}" required="true" size="20" />
				<f:facet name="footer">
					<aon:inputText id="RegistryAddress_city-New"
						value="#{controller.to.city}" required="true"
						rendered="#{formNew}" size="20" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-150 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="RegistryAddress_geozone" value="#{registryBundle.registry_geozone}" />
				</f:facet>
				<aon:outputText value="#{to.geozone.name}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="RegistryAddress_geozone"
					value="#{controller.to.geozone}" rendered="#{formEdit}">
					<f:selectItems value="#{geozoneCollections.geoTrees}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="RegistryAddress_geozone-New"
						value="#{controller.to.geozone}" rendered="#{formNew}">
						<f:selectItems value="#{geozoneCollections.geoTrees}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
