<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="batchDocumentSearch">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{registryBundle.registry_batch_document}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_toolbar_search}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="clear"
						value="#{bundle.aon_clear}" 
						actionListener="#{corporateIdentityAttach.onClear}"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
					<aon:commandButton id="back"
						value="#{bundle.aon_back}"
						action="batchDocument_form"
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						accesskey="#{bundle.aon_key_cancel}" />						
				</ui:define>
			</ui:decorate>		
			
			<aon:div styleClass="aon-scroll-area">
			
				<aon:methodParam name="searchAction" value="batchDocument_list" />
				<ui:decorate template="/com/code/aon/ui/registry/facelet/corporateIdentity/searchContent.xhtml" >
					<ui:param name="controller" value="#{corporateIdentityAttach}" />
					<ui:param name="searchController" value="#{corporateIdentitySearch}" />
					<ui:define name="searchButtonContent">
						<aon:actionListener method="#{batchDocument.checkNone}" />
					</ui:define>			
				</ui:decorate>

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
