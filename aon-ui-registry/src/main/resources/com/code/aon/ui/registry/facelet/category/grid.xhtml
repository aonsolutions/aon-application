<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{category}" />
		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn"
				alias="Category.name">
				<f:facet name="header">
					<aon:outputLabel for="Category_name"
						value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.name}"
					rendered="#{formList}" />
				<aon:inputText id="Category_name" required="true"
					rendered="#{formEdit}" size="32"
					value="#{category.to.name}" maxlength="32" />
				<f:facet name="footer">
					<aon:inputText id="Category_name-New" required="true"
						rendered="#{formNew}" size="32"
						value="#{category.to.name}" maxlength="32" />
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
