<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="pojoName" default="#{controller.pojoShortName}"/>
	<aon:valueParam name="registryAddress" default="#{controller.mainAddress}"/>
	
	<aon:outputLabel for="#{pojoName}_address" value="#{registryBundle.registry_address}" />
	<aon:inputText id="#{pojoName}_address" required="#{addressRequired}"
		value="#{registryAddress.address}" maxlength="128" size="32" />
	<aon:div>
		<aon:selectOneMenu id="#{pojoName}_streetType" required="#{addressRequired}"
			label="#{registryBundle.registry_street_type}"
			value="#{registryAddress.streetType}">
			<f:selectItem value="#{null}" itemLabel="-"/>
			<f:selectItems value="#{registryCollections.streetTypes}" />
		</aon:selectOneMenu>
		<aon:inputText id="#{pojoName}_address" style="margin-left: 5px;" required="#{addressRequired}"
			value="#{registryAddress.address}" maxlength="128" size="32" />
		<aon:outputLabel for="#{pojoName}_number" styleClass="aon-italic aon-margin-left"
			value="#{bundle.aon_number}" />
		<aon:inputText id="#{pojoName}_number" style="margin-left: 5px;" required="#{addressRequired}"
			value="#{registryAddress.number}" maxlength="8" size="5" />
 	</aon:div>

	<aon:outputLabel for="#{pojoName}_address2" value="#{registryBundle.registry_address_detail}" />
	<aon:div>
		<aon:inputText id="#{pojoName}_address2" value="#{registryAddress.address2}" 
			style="display:block" maxlength="128" size="64" />
		<aon:inputText id="#{pojoName}_address3" value="#{registryAddress.address3}" 
			style="margin-top: 3px" maxlength="128" size="64" />
	</aon:div>

	<aon:outputLabel for="#{pojoName}_address_city" 
		value="#{registryBundle.registry_city}" />
	<aon:inputText id="#{pojoName}_address_city" 
		value="#{registryAddress.city}" size="64" maxlength="64"/>
		
	<aon:outputLabel for="#{pojoName}_address_zip" 
		value="#{registryBundle.registry_zip}" />
	<aon:inputText id="#{pojoName}_address_zip" 
		value="#{registryAddress.zip}" size="32" maxlength="16"/>
		
	<aon:outputLabel for="#{pojoName}_address_geozone" 
		value="#{registryBundle.registry_geozone}" />
	<aon:selectOneMenu id="#{pojoName}_address_geozone"
		value="#{registryAddress.geozone}">
		<f:selectItems value="#{geozoneCollections.geoTrees}" />
	</aon:selectOneMenu>
			
</ui:composition>
