<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="showMunicipality" default="#{false}" />
	<aon:valueParam name="pojoName" default="#{controller.pojoShortName}"/>
	<aon:valueParam name="registryAddress" default="#{controller.mainAddress}"/>
	
	<aon:outputLabel for="#{pojoName}_address" value="#{bundle.aon_address}" />
	<aon:div>
		<aon:selectOneMenu id="#{pojoName}_streetType" required="#{addressRequired}"
			label="#{bundle.registry_street_type}"
			value="#{registryAddress.streetType}">
			<f:selectItems value="#{registryCollections.streetTypes}" />
		</aon:selectOneMenu>
		<aon:inputText id="#{pojoName}_address" style="margin-left: 5px;" required="#{addressRequired}"
			value="#{registryAddress.address}" maxlength="128" size="32" />
		<aon:outputLabel for="#{pojoName}_number" styleClass="aon-italic aon-margin-left"
			value="#{bundle.aon_number}" />
		<aon:inputText id="#{pojoName}_number" style="margin-left: 5px;" required="#{addressRequired}"
			value="#{registryAddress.number}" maxlength="8" size="5" />
	</aon:div>

	<aon:outputLabel for="#{pojoName}_address2" value="#{bundle.registry_address_detail}" />
	<h:panelGrid columns="2" cellpadding="0" cellspacing="0">
		<aon:inputText id="#{pojoName}_address2" value="#{registryAddress.address2}" 
			style="display:inline" maxlength="128" size="32" />
		<aon:inputText id="#{pojoName}_address3" value="#{registryAddress.address3}" 
			style="margin-left: 5px" maxlength="128" size="37" />
	</h:panelGrid>

	<aon:outputLabel for="#{pojoName}_address_zip" 
		value="#{bundle.aon_postal_code}" />
	<aon:div>
		<aon:inputText id="#{pojoName}_address_zip" 
			size="16" maxlength="16"
			value="#{registryAddress.zip}" 
			reRender="#{pojoName}_address_geozone, #{pojoName}_address_municipality"
			focus="#{pojoName}#{showMunicipality?'_address_municipality':'_address_city'}"
			actionListener="#{controller.onLoadGeozone}" />
		<aon:outputLabel for="#{pojoName}_address_geozone" styleClass="aon-margin-left  aon-margin-right aon-italic" 
			value="#{bundle.aon_state}" />
		<aon:selectOneMenu id="#{pojoName}_address_geozone"
			value="#{registryAddress.geozone}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{geozoneCollections.geoTrees}" />
			<a4j:support event="onchange" reRender="#{pojoName}_address_municipality" ajaxSingle="true" />
		</aon:selectOneMenu>
	</aon:div>
		
	<aon:if test="#{showMunicipality}">
		<aon:outputLabel for="#{pojoName}_address_municipality" 
			value="#{bundle.registry_municipality}" />
		<aon:div>
			<aon:selectOneMenu id="#{pojoName}_address_municipality"
				required="#{true}"
				value="#{registryAddress.municipalityCode}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{controller.municipalities}" />
			</aon:selectOneMenu>
			<aon:outputLabel for="#{pojoName}_address_city" styleClass="aon-margin-left aon-margin-right aon-italic" 
				value="#{bundle.registry_city}" />
			<aon:inputText id="#{pojoName}_address_city" 
				value="#{registryAddress.city}" size="30" maxlength="64"/>
		</aon:div>
	</aon:if>
		
	<aon:if test="#{!showMunicipality}">
		<aon:outputLabel for="#{pojoName}_address_city" 
			value="#{bundle.registry_city}" />
		<aon:inputText id="#{pojoName}_address_city" 
			value="#{registryAddress.city}" size="64" maxlength="64"/>
	</aon:if>
			
</ui:composition>
