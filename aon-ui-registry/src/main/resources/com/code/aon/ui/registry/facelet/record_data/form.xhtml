<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:include
		src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarID" value="rdFormToolbar" />
		<ui:param name="toolbarTitle"
			value="#{registryBundle.registry_rd_module}" />
		<ui:param name="controller" value="#{controllerAlias}" />

		<aon:methodParam name="saveAction" value="force_refresh"
			resolve="false" />
		<aon:methodParam name="cancelAction" value="force_refresh"
			resolve="false" />
		<aon:methodParam name="removeAction" value="force_refresh"
			resolve="false" />
		<aon:methodParam name="searchAction" value="force_refresh"
			resolve="false" />
		<aon:methodParam name="resetAction" value="force_refresh"
			resolve="false" />
		<aon:methodParam name="backAction" value="force_refresh"
			resolve="false" />


	</ui:include>
	<aon:div styleClass="aon-scroll-area">
		<aon:panelGrid id="dataTable" columns="4">

			<aon:outputLabel for="RecordData_creationDate"
				value="#{registryBundle.registry_rd_creation_date}" />
			<aon:selectInputDate size="8" id="RecordData_creationDate"
				value="#{controllerAlias.to.creationDate}" enableManualInput="true"
				datePattern="dd/MM/yyyy" timeZone="#{timeZoneController.timeZone}" />

			<aon:outputLabel for="RecordData_description"
				value="#{bundle.aon_description}" />
			<aon:inputText id="RecordData_description"
				value="#{controllerAlias.to.description}" size="40" />

			<aon:outputLabel for="RecordData_notary"
				value="#{registryBundle.registry_rd_notary}" />
			<aon:inputText id="RecordData_notary" value="#{controllerAlias.to.notary}"
				size="40" />

			<aon:outputLabel for="RecordData_number"
				value="#{registryBundle.registry_rd_number}" />
			<aon:inputText id="RecordData_number" value="#{controllerAlias.to.number}"
				size="16" />

			<aon:outputLabel for="RecordData_recordDate"
				value="#{registryBundle.registry_rd_record_date}" />
			<aon:selectInputDate size="8" id="RecordData_recordDate"
				value="#{controllerAlias.to.recordDate}" enableManualInput="true"
				datePattern="dd/MM/yyyy" timeZone="#{timeZoneController.timeZone}" />

			<aon:outputLabel for="RecordData_volume"
				value="#{registryBundle.registry_rd_volume}" />
			<aon:inputText id="RecordData_volume" value="#{controllerAlias.to.volume}"
				size="16" />

			<aon:outputLabel for="RecordData_section"
				value="#{registryBundle.registry_rd_section}" />
			<aon:inputText id="RecordData_section"
				value="#{controllerAlias.to.section}" size="16" />

			<aon:outputLabel for="RecordData_page"
				value="#{registryBundle.registry_rd_page}" />
			<aon:inputText id="RecordData_page" value="#{controllerAlias.to.page}"
				size="16" />

			<aon:outputLabel for="RecordData_sheet"
				value="#{registryBundle.registry_rd_sheet}" />
			<aon:inputText id="RecordData_sheet" value="#{controllerAlias.to.sheet}"
				size="16" />

			<aon:outputLabel for="RecordData_registration"
				value="#{registryBundle.registry_rd_registration}" />
			<aon:inputText id="RecordData_registration"
				value="#{controllerAlias.to.registration}" size="16" />
		</aon:panelGrid>
	</aon:div>

</ui:composition>
