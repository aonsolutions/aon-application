<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:include
		src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarID" value="rdFormToolbar" />
		<ui:param name="toolbarTitle" value="#{registryBundle.registry_rd_module}" />
		<ui:param name="skipSearchButton" value="true" />

		<aon:methodParam name="saveAction" value="" />
		<ui:param name="saveButtonReRender" value="recordDataContent" />
		<aon:methodParam name="cancelAction" value="" />
		<ui:param name="cancelButtonReRender" value="recordDataContent" />
		<aon:methodParam name="removeAction" value="" />
		<ui:param name="removeButtonReRender" value="#{(removeButtonReRender!=null)?(removeButtonReRender):('recordDataContent')}" />
		<aon:methodParam name="resetAction" value="" />
		<ui:param name="resetButtonReRender" value="recordDataContent" />
		<aon:methodParam name="backAction" value="" />
		<ui:param name="backButtonReRender" value="recordDataContent" />

	</ui:include>
	
	<aon:div styleClass="aon-scroll-area">
		<aon:panelGrid id="recordDataTable" columns="4"
				style="width: 100%"
				columnClasses="aon-panelGrid-odd aon-width-150
							,aon-panelGrid-even aon-width-150
							,aon-panelGrid-odd aon-width-150
							,aon-panelGrid-even aon-width-auto">

			<ui:include src="/com/code/aon/ui/registry/facelet/record_data/form_content.xhtml" />
		
		</aon:panelGrid>

		<aon:div styleClass="aon-padding-top" id="recordDataGrid">
			<aon:panelGrid columns="2" style="width: 100%"
				columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
			
				<aon:outputLabel for="RecordData_file"
					value="#{bundle.aon_fileupload_element}" />
				<aon:div id="attachmentGrid">
					<a4j:region>
						<aon:commandLink styleClass="aon-icon aon-icon-delete"
							rendered="#{controller.attachAvailable}" reRender="attachmentGrid"
							actionListener="#{controller.onAttachRemove}"
							title="#{bundle.aon_fileupload_remove}">
							<aon:outputText value="&#160;" />
						</aon:commandLink>
						<a4j:htmlCommandLink target="_blank"
							rendered="#{controller.attachAvailable}"
							actionListener="#{controller.downloadAttachment}"
							styleClass="aon-icon aon-icon-mail-save"
							title="#{bundle.aon_fileupload_download}">
							<aon:outputText value="#{controller.attachDescription}" />
						</a4j:htmlCommandLink>									
						<aon:fileUpload id="RecordData_file"
							addControlLabel="#{bundle.aon_fileUpload_add}"
							stopControlLabel="#{bundle.aon_fileUpload_stop}"
							stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
							uploadControlLabel="#{bundle.aon_fileUpload_upload}"
							fileUploadListener="#{controller.fileUploaded}"
							immediateUpload="true" autoclear="true" listWidth="0px"
							listHeight="0px">
							<f:facet name="label">
								<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
							</f:facet>
							<a4j:support event="onuploadcomplete" reRender="attachmentGrid" />
						</aon:fileUpload>
					</a4j:region>				
				</aon:div>
			</aon:panelGrid>
		</aon:div>
	</aon:div>

</ui:composition>
