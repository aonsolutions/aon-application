<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="#{lookup.pojoShortName}_name"
		styleClass="aon-outputLabel aon-nowrap"
		value="#{bundle.aon_company_name}" />
	<aon:inputText id="#{lookup.pojoShortName}_name" size="40"
		valueChangeListener="#{lookup.addExpression}" />

	<aon:outputLabel for="#{lookup.pojoShortName}_alias"
		styleClass="aon-outputLabel aon-nowrap"
		value="#{bundle.aon_company_alias}" />
	<aon:inputText id="#{lookup.pojoShortName}_alias" size="40"
		valueChangeListener="#{lookup.addExpression}" />
	
	<aon:outputLabel for="#{lookup.pojoShortName}_nationality"
		value="#{registryBundle.registry_nationality}" />
	<aon:selectOneMenu id="#{lookup.pojoShortName}_nationality"
		converter="aon.EnumConverter"
		valueChangeListener="#{lookup.addExpression}" >
		<f:selectItem value="#{null}" itemLabel="-"/>
		<f:selectItems value="#{commonCollections.countries}" />
	</aon:selectOneMenu>
		
	<aon:outputLabel for="#{lookup.pojoShortName}_document"
		value="#{bundle.aon_document}" />
	<aon:inputText id="#{lookup.pojoShortName}_document" size="12"
		valueChangeListener="#{lookup.addExpression}" />

	<aon:outputLabel value="#{bundle.aon_document_country}"
		for="#{lookup.pojoShortName}_documentCountry" />
	<aon:selectOneMenu id="#{lookup.pojoShortName}_documentCountry"
		converter="aon.EnumConverter"
		valueChangeListener="#{lookup.addExpression}" >
		<f:selectItem value="#{null}" itemLabel="-"/>
		<f:selectItems value="#{commonCollections.countries}" />
	</aon:selectOneMenu>
	
	<aon:outputLabel value="#{bundle.aon_type}"
		for="#{lookup.pojoShortName}_documentType" />
	<aon:selectOneMenu id="#{lookup.pojoShortName}_documentType"
		converter="aon.EnumConverter"
		valueChangeListener="#{lookup.addExpression}" >
		<f:selectItem value="#{null}" itemLabel="-"/>
		<f:selectItems value="#{registryCollections.documentTypes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="#{lookup.pojoShortName}_id"
		value="#{bundle.aon_id}" />
	<aon:inputText id="#{lookup.pojoShortName}_id" size="12"
		valueChangeListener="#{lookup.addExpression}" />
	

</ui:composition>
