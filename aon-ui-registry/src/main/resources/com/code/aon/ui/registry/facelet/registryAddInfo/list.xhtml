<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="registryAddInfoList">
			<aon:div layout="none">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{bundle.pms_registry_add_info_module}" />
					<ui:param name="controller" value="#{registryAddInfo}" />
					<ui:param name="resetButtonReRender" value="registryAddInfoList" />
					<ui:define name="additionalToolbarContent">
						<aon:htmlCommandLink id="registryAddInfo-excel-report" value="&#160;" 
							target="_new" rendered="#{!registryAddInfo.nevv and registryAddInfo.rowCount > 0}"
							disabled="#{registryAddInfo.to != null}"
							action="#{report.onExecute}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-excel">
							<f:param name="reportKey" value="registryAddInfoReport" />
							<f:param name="outputFormat" value="MS Excel" />
						</aon:htmlCommandLink>
						<aon:htmlCommandLink id="registryAddInfo-report" value="#{bundle.aon_listing}"
							target="_new" rendered="#{!registryAddInfo.nevv and registryAddInfo.rowCount > 0}"
							disabled="#{registryAddInfo.to != null}"
							action="#{report.onExecute}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="registryAddInfoReport" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
					</ui:define>
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{registryAddInfo}" />
						<ui:param name="rowSelectorReRender" value="registryAddInfoList" />
						<ui:param name="resetButtonReRender" value="registryAddInfoList" />
						<ui:param name="newSaveButtonReRender" value="registryAddInfoList" />
						<ui:param name="saveButtonReRender" value="registryAddInfoList" />
						<ui:param name="newCancelButtonReRender" value="registryAddInfoList" />
						<ui:param name="cancelButtonReRender" value="registryAddInfoList" />
						<ui:param name="removeButtonReRender" value="registryAddInfoList" />
						<ui:define name="columns">

							<aon:column	alias="RegistryAddInfo.registry.name" 
								styleClass="aon-editDataTable-textColumn aon-width-auto">
								<f:facet name="header">
									<aon:outputLabel for="Customer_id" value="#{bundle.aon_customer}" />
								</f:facet>
								<aon:outputText value="#{to.registry.name}" />
								<f:facet name="footer">
									<aon:div>
										<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
											<ui:param name="lookupTo" value="#{controller.to.registry}" />
											<ui:param name="lookupForRegistry" value="#{true}" />
											<ui:param name="lookupRendered" value="#{formNew}" />
											<ui:param name="idRequired" value="#{true}" />						
											<ui:param name="skipLabel" value="#{true}" />
											<ui:param name="skipNewButton" value="#{true}" />
											<ui:param name="skipGoToButton" value="#{true}" />
											<ui:param name="skipSuggestText" value="#{false}" />
										</ui:include>
									</aon:div>
								</f:facet>
							</aon:column>

							<aon:column alias="RegistryAddInfo.attribute" 
								styleClass="aon-editDataTable-textColumn aon-width-180">
								<f:facet name="header">
									<aon:outputLabel for="RegistryAddInfo_attribute" value="#{bundle.aon_parameter}" />
								</f:facet>
								<aon:outputText value="#{to.attribute}" />
								<f:facet name="footer">
									<aon:selectOneMenu id="RegistryAddInfo_attribute" required="#{true}"
										rendered="#{formNew}" value="#{registryAddInfo.to.attribute}">
										<f:selectItems value="#{registryAddInfo.addInfoAttributes}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column alias="RegistryAddInfo.value" 
								styleClass="aon-editDataTable-textColumn aon-width-250">
								<f:facet name="header">
									<aon:outputLabel for="RegistryAddInfo_value" value="#{bundle.aon_value}" />
								</f:facet>
								<aon:outputText rendered="#{formList}"
									value="#{to.value}" />
								<aon:inputText id="RegistryAddInfo_value"
									rendered="#{formEdit}" size="32" maxlength="128" 
									value="#{registryAddInfo.to.value}" required="#{true}" />
								<f:facet name="footer">
									<aon:inputText id="RegistryAddInfo_value-New"
										rendered="#{formNew}" size="32" maxlength="128" 
										value="#{registryAddInfo.to.value}" required="#{true}" />
								</f:facet>
							</aon:column>

						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />

	</ui:define>

</ui:composition>
