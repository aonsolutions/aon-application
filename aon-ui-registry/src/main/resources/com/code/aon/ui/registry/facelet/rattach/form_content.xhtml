<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<aon:valueParam name="descriptionInputSize" default="40"/>
	
	<aon:outputLabel for="#{controller.beanName}_description" value="#{bundle.aon_description}" />
	<aon:div id="#{controller.beanName}_descriptionDiv">
		<aon:inputText id="#{controller.beanName}_description" required="true"
			value="#{controller.to.description}" maxlength="64" size="#{descriptionInputSize}" />
		<aon:div styleClass="aon-margin-top" rendered="#{controller.to.size &gt; 0}" >
			<aon:outputText styleClass="aon-italic" 
				value="#{controller.to.mimeType}" />			
			<aon:outputText styleClass="aon-margin-left aon-italic"
				value="#{controller.to.sizeToDisplay}" />
		</aon:div>			
	</aon:div>

	<aon:outputLabel for="attachFile"
		value="#{bundle.aon_fileupload_element}" />
	<aon:div id="#{controller.beanName}_attachFileDiv">													
		<a4j:region>
			<aon:fileUpload id="attachFile" 
				fileUploadListener="#{controller.fileUploaded}" >
				<f:facet name="label">
					<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
				</f:facet>														
				<a4j:support event="onuploadcomplete"
					reRender="#{controller.beanName}_attachFileDiv,#{controller.beanName}_descriptionDiv" />
				<a4j:support event="onupload"
					oncomplete="showFileUploadProgress();" />
				<a4j:support event="onclear"
					oncomplete="hideFileUploadProgress();" />
			</aon:fileUpload>
			<rich:jQuery name="showFileUploadProgress" timing="onJScall"
				selector="#attachFile .rich-fileupload-list-overflow" query="height(70);" />
			<rich:jQuery name="hideFileUploadProgress" timing="onJScall"
				selector="#attachFile .rich-fileupload-list-overflow" query="height(0);" />										
		</a4j:region>	
	</aon:div>

	<c:if test="#{aonRole.confidentiality}">
		<aon:outputText value="#{bundle.aon_confidential}" />
		<aon:selectBooleanCheckbox id="#{controller.beanName}_securityLevel"
			value="#{controller.to.confidential}" />
	</c:if>

	<aon:outputLabel for="#{controller.beanName}_attachDate"
		value="#{bundle.aon_date}" />
	<aon:selectInputDate id="#{controller.beanName}_attachDate"
		popupDateFormat="#{bundle.aon_date_pattern}"
		value="#{controller.to.attachDate}" />

	<c:if test="#{!skipScopeSelection}">	
		<aon:outputLabel for="#{controller.beanName}_scope"
			value="#{bundle.aon_scope}" />
		<aon:selectOneMenu id="#{controller.beanName}_scope" 
			value="#{controller.to.scope}">
			<f:selectItem itemLabel="-" value="#{null}"/>
			<f:selectItems value="#{configCollections.currentUserScopes}" />
		</aon:selectOneMenu>
	</c:if>
	
	<aon:outputLabel for="#{controller.beanName}_category"
		value="#{bundle.aon_category}" />
	<aon:selectOneMenu id="#{controller.beanName}_category" 
		value="#{controller.to.category}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{registryCollections.categories}" />
	</aon:selectOneMenu>						

</ui:composition>
