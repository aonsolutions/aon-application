<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<aon:outputLabel for="#{controller.beanName}_description" value="#{bundle.aon_description}" />
	<aon:inputText id="#{controller.beanName}_description" required="true"
		value="#{controller.to.description}" maxlength="64" size="25" />

	<aon:outputText value="#{bundle.aon_confidential}" />
	<aon:selectBooleanCheckbox id="#{controller.beanName}_securityLevel"
		value="#{controller.to.confidential}" />

	<aon:outputLabel for="#{controller.beanName}_attachDate"
		value="#{bundle.aon_date}" />
	<aon:selectInputDate id="#{controller.beanName}_attachDate"
		popupDateFormat="#{bundle.aon_date_pattern}"
		value="#{controller.to.attachDate}" />

	<aon:outputLabel for="#{controller.beanName}_scope"
		value="#{bundle.aon_scope}" />
	<aon:selectOneMenu id="#{controller.beanName}_scope" 
		value="#{controller.to.scope}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{configCollections.currentUserScopes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="#{controller.beanName}_category"
		value="#{registryBundle.registry_category}" />
	<aon:selectOneMenu id="#{controller.beanName}_category" 
		value="#{controller.to.category}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{registryCollections.categories}" />
	</aon:selectOneMenu>						
	
	<aon:outputText value="#{bundle.aon_fileupload_element}" />
	<aon:div id="#{controller.beanName}_attachFile">													
		<a4j:region>
			<aon:fileUpload 
				addControlLabel="#{bundle.aon_fileUpload_add}"
				stopControlLabel="#{bundle.aon_fileUpload_stop}"
				stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
				uploadControlLabel="#{bundle.aon_fileUpload_upload}"
				fileUploadListener="#{controller.fileUploaded}"
				listWidth="110px" >
				<f:facet name="label">
					<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
				</f:facet>														
				<a4j:support event="onuploadcomplete"
					reRender="#{controller.beanName}_attachFile,#{controller.beanName}_description" />
			</aon:fileUpload>
		</a4j:region>	
	</aon:div>
	
				

	<c:if test="#{!skipFreeSpaceMessage}">
		<ui:define name="additionalDataTableContent" >
			<aon:div styleClass="aon-margin-top" >
				<aon:outputText value="#{documentManager.freeSpaceMessage}" />
			</aon:div>				
		</ui:define>
	</c:if>

</ui:composition>
