<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="geotreeParentForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="toolbarTitle" value="#{geozoneBundle.geozone_module}" />
				<ui:param name="controller" value="#{geotreeParent}" />
				<ui:param name="skipResetButton" value="#{geotreeParent.to.child.system}" />
				<ui:param name="skipRemoveButton" value="#{geotreeParent.to.child.system}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140
						,aon-panelGrid-even aon-width-100
						,aon-panelGrid-odd aon-width-140
						,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="GeoTree_parent_child_code" 
						value="#{bundle.aon_id}" />
					<aon:inputText id="GeoTree_parent_child_code" 
						value="#{geotreeParent.to.child.code}"
						disabled="#{geotreeParent.to.child.system}" size="3" />

					<aon:outputLabel for="GeoTree_parent_child_name" 
						value="#{geozoneBundle.geozone_country}" />
					<aon:inputText id="GeoTree_parent_child_name" 
						value="#{geotreeParent.to.child.name}"
						required="#{true}" size="40" />

				</aon:panelGrid>

				<c:if test="#{!geotreeParent.new}">
					<aon:div styleClass="aon-padding-top">
						<aon:panel>
							<f:facet name="header">
								<aon:outputText value="#{geozoneBundle.geozone_provinces}"/>
							</f:facet>
							<ui:decorate
								template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
								<ui:param name="controller" value="#{geotreeChild}" />
								<ui:param name="skipResetButton" value="#{geotreeParent.to.child.system}" />
								<ui:param name="skipRemoveButton" value="#{geotreeChild.to.child.system}" />
								<ui:define name="columns">

									<aon:column alias="GeoTree.child.code"
										styleClass="aon-editDataTable-textColumn aon-width-100">
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_id}" />
										</f:facet>
										<aon:outputText value="#{to.child.code}"
											rendered="#{formList or geotreeChild.to.child.system}" />
										<aon:inputText value="#{geotreeChild.to.child.code}"
											rendered="#{formEdit and !geotreeChild.to.child.system}" 
											size="3" maxlength="3" />
										<f:facet name="footer">
											<aon:inputText value="#{geotreeChild.to.child.code}"
												rendered="#{formNew}" 
												size="3" maxlength="3" />
										</f:facet>
									</aon:column>

									<aon:column alias="GeoTree.child.name"
										styleClass="aon-editDataTable-textColumn aon-width-auto">
										<f:facet name="header">
											<aon:outputText value="#{geozoneBundle.geozone_province}" />
										</f:facet>
										<aon:outputText value="#{to.child.name}"
											rendered="#{formList}" />
										<aon:inputText value="#{geotreeChild.to.child.name}" 
											rendered="#{formEdit}" required="#{true}" 
											size="40" maxlength="32" />
										<f:facet name="footer">
											<aon:inputText value="#{geotreeChild.to.child.name}" 
												rendered="#{formNew}" required="#{true}" 
												size="40" maxlength="32" />
										</f:facet>
									</aon:column>

								</ui:define>
							</ui:decorate>
						</aon:panel>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
