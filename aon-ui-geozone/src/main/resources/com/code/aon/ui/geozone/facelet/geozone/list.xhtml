<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="geotreeParentList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="toolbarTitle" value="#{geozoneBundle.geozone_module}" />
				<ui:param name="controller" value="#{geotreeParent}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{geotreeParent}" />
					<ui:define name="columns">
			
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.child.code}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{geozoneBundle.geozone_country}" />
							</f:facet>
							<aon:outputText value="#{to.child.name}" />
						</aon:column>
					
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
