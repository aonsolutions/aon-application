<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/audit/facelet/shared/menu.xhtml">

	<ui:define name="menuContent">
		<aon:dropDownMenu id="auxiliary" value="#{appBundle.aon_auxiliary}"
			style="padding-left: 10px;padding-top: 5px;"
			rendered="#{aonRole.taskMonitor or aonRole.admin}">
			<aon:menuItem 
				icon="/css/images/menu_icons/task_dossier_type.gif"
				value="#{appBundle.aon_dossier_type}" action="dossierType_list" />
			<aon:menuItem id="activity_type"
				value="#{appBundle.aon_activity_type}"
				icon="/css/images/menu_icons/task_activity_types.gif"
				action="activity_type_standalone" />
			<aon:menuItem id="job_type" value="#{appBundle.aon_job_type}"
				icon="/css/images/menu_icons/task_job_type.gif" action="job_type" />
		</aon:dropDownMenu>
		<aon:dropDownMenu id="master" value="#{appBundle.aon_master}"
			style="padding-left: 10px;padding-top: 5px;"
			rendered="#{aonRole.taskMonitor}">
			<aon:menuItem id="customer" value="#{appBundle.aon_customer}"
				icon="/css/images/menu_icons/task_customer.gif"
				actionListener="#{customer.onEditSearch}" action="customer_search">
			</aon:menuItem>
			<aon:menuSeparator />
			<aon:menuItem id="task" value="#{appBundle.aon_task}"
				icon="/css/images/menu_icons/task_task.gif" action="task_list" />
		</aon:dropDownMenu>

		<aon:dropDownMenu id="process" value="#{appBundle.aon_process}"
			style="padding-left: 10px;padding-top: 5px;"
			rendered="#{aonRole.taskMonitor}">
			<aon:menuItem value="#{appBundle.aon_process}"
				icon="/css/images/menu_icons/task_process.gif" action="process_list"
				rendered="#{aonRole.taskMonitor}" />
			<aon:menuSeparator />
			<aon:menuItem value="#{appBundle.aon_process_transition_type}"
				icon="/css/images/menu_icons/aon_process_transition_type.gif"
				action="process_transition_type" rendered="#{aonRole.taskMonitor}" />
			<aon:menuSeparator />
			<aon:menuItem value="#{appBundle.aon_process_launcher}"
				icon="/css/images/icons/aon-launch-process.gif"
				action="#{processWizard.start}" rendered="#{aonRole.taskMonitor}" />
			<aon:menuSeparator />
			<aon:menuItem value="#{appBundle.aon_process_monitor}"
				icon="/css/images/icons/aon-process-monitor.gif"
				actionListener="#{campaign.onEditSearch}"
				action="campaign_search" 
				rendered="#{aonRole.taskMonitor}" />
		</aon:dropDownMenu>

		<aon:dropDownMenu id="timeManagement"
			style="padding-left: 10px;padding-top: 5px;"
			value="#{appBundle.aon_time_management}"
			rendered="#{aonRole.taskMonitor}">
			<aon:menuItem id="daily_tracking"
				icon="/css/images/menu_icons/task_daily_tracking.gif"
				value="#{appBundle.aon_daily_tracking}" action="dailyTracking_form"
				actionListener="#{dailyTracking.onLaunch}" />
			<aon:menuSeparator />
			<aon:menuItem id="daily_tracking_report"
				icon="/css/images/menu_icons/task_report.gif"
				value="#{appBundle.aon_daily_tracking_report}"
				actionListener="#{dailyTrackingReport.onResetReportSearch}"
				action="daily_tracking_report" />
		</aon:dropDownMenu>
		<aon:outputText value="&#160;" />
	</ui:define>
</ui:composition>
