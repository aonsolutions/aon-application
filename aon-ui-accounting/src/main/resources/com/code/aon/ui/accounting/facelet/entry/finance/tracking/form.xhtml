<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="financeTrackingEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_entry_finance_tracking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_reset}" />

				<ui:define name="toolbarContent">
					<aon:commandButton value="#{bundle.aon_search}"
						accesskey="#{bundle.aon_key_search}"
						title="#{bundle.aon_search} (ALT+#{bundle.aon_key_new})"
						actionListener="#{financeTrackingEntry.onTypeChanged}"
						rendered="#{financeTrackingEntry.payment == null}"
						styleClass="aon-finding-toolbar-item aon-icon-search" />
					<aon:commandButton
						value="#{accountingBundle.accounting_entry_generate}" 
						id="saveFinance" accesskey="#{bundle.aon_key_save}"
						title="#{accountingBundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{financeTrackingEntry.accept}"
						action="#{financeTrackingEntry.generate}"
						rendered="#{financeTrackingEntry.payment != null}"
						disabled="#{financeTrackingEntry.lines.rowCount == 0}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{accountingBundle.accounting_entry_generate}?')) return false;" />
					<aon:commandButton value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						title="#{bundle.aon_reset} (ALT+#{bundle.aon_key_new})"
						actionListener="#{financeTrackingEntry.onReset}"
						rendered="#{financeTrackingEntry.payment != null}"
						styleClass="aon-finding-toolbar-item aon-icon-reset" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_search" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:div id="financeTrackingEntryHeader" styleClass="aon-panelGrid-search">

					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{accountingBundle.accounting_finance_filter}"
							styleClass="aon-panelGrid-search-info-internal" />
					</aon:div>

					<aon:panelGrid id="financeTables" columns="2">
						<aon:outputLabel for="AccountEntry_type"
							value="#{bundle.aon_type}" />
						<aon:selectOneMenu id="AccountEntry_type"
							value="#{financeTrackingEntry.payment}"
							disabled="#{financeTrackingEntry.payment != null}">
							<f:selectItem itemLabel="" value="#{null}" />
							<f:selectItem itemLabel="#{bundle.finance_charge}" itemValue="#{false}" />
							<f:selectItem itemLabel="#{bundle.finance_payment}" itemValue="#{true}" />
						</aon:selectOneMenu>

						<c:if test="#{aonRole.confidentiality}">
							<aon:outputLabel for="AccountEntry_securityLevel" 
								value="#{bundle.aon_confidential}" />
							<aon:selectOneRadio id="AccountEntry_securityLevel"
								disabled="#{financeTrackingEntry.payment != null}"
								value="#{financeTrackingEntry.securityLevel}">
								<f:selectItems value="#{commonCollections.confidentialValues}" />	
							</aon:selectOneRadio>
						</c:if>
					</aon:panelGrid>
				</aon:div>
				
				<aon:panelGrid id="financeTablesData" columns="2" style="width: 100%;"
						styleClass="aon-margin-top"
						rendered="#{financeTrackingEntry.payment != null}"
						columnClasses="aon-panelGrid-odd aon-width-150
									  ,aon-panelGrid-even aon-width-auto">
					<aon:outputLabel for="AccountEntry_accountPeriod"
						value="#{bundle.aon_financial_year}" />
					<aon:selectOneMenu id="AccountEntry_accountPeriod"
						value="#{financeTrackingEntry.period}">
						<f:selectItems value="#{accountingCollections.enabledAccountPeriods}" />
						<a4j:support event="onchange" ajaxSingle="true" reRender="AccountEntry_accountPeriod"/>
					</aon:selectOneMenu>

				</aon:panelGrid>

				<aon:div id="financePanelTabSet">
					<aon:panelTabSet rendered="#{financeTrackingEntry.payment != null}">

						<c:if test="#{financeTrackingEntry.lines.rowCount > 0}">
							<aon:panelTab name="lines" label="#{accountingBundle.accounting_finance_record_list}">
								<ui:include src="/com/code/aon/ui/accounting/facelet/entry/finance/tracking/form_lines.xhtml" />
							</aon:panelTab>
						</c:if>
	
						<c:if test="#{financeTrackingEntry.finances.rowCount > 0}">
							<aon:panelTab name="finances" label="#{accountingBundle.accounting_finance_pending_list}">
								<ui:include src="/com/code/aon/ui/accounting/facelet/entry/finance/tracking/form_finances.xhtml" />
							</aon:panelTab>
						</c:if>

					</aon:panelTabSet>
				</aon:div>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
