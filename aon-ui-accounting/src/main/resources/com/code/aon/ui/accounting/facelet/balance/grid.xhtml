<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div style="margin-top: 10px;">
		<aon:editDataTable id="balanceDetailData" rendered="#{!balance.nevv}"
			value="#{balanceDetail.model}" var="to" rows="1000">

			<aon:column styleClass="aon-editDataTable-iconColumn">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:commandButton id="balanceDetailTable-select"
					actionListener="#{balanceDetail.onSelect}"
					rendered="#{to!=accountEntryDetail.to}"
					reRender="#{balanceDetailData}"
					styleClass="aon-editDataTable-button aon-icon-rowSelector" />
<!-- 				
					value="#{to.sortKey}"
 -->
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{balanceDetail.onReset}" value=""
							rendered="#{!balanceDetail.nevv}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>

				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-40">
				<f:facet name="header">
					<aon:outputText value="Orden" />
				</f:facet>
				<aon:outputText value="#{to.sortKey}"
					rendered="#{to!=balanceDetail.to}" />
				<aon:inputText required="true" 
					rendered="#{to==balanceDetail.to}" value="#{balanceDetail.to.sortKey}"
					maxlength="4" size="2" />
				<!-- 
				<aon:div styleClass="aon-nowrap" rendered="#{to!=balanceDetail.to}">
					<aon:graphicImage url="/css/images/aon-arrow-up.gif"
						title="#[#{to.sortKey}]"
						style="cursor:pointer" rendered="#{to.sortKey != 0}">
						<a4j:support event="onclick"
							actionListener="#{balanceDetail.onMoveUp}"
							reRender="balanceDetailData" />
					</aon:graphicImage>
					<aon:graphicImage url="/css/images/aon-arrow-down.gif"
						title="#[#{to.sortKey}]"
						style="cursor:pointer"
						rendered="#{to.sortKey &lt; (balanceDetail.model.rowCount-1)}">
						<a4j:support event="onclick"
							actionListener="#{balanceDetail.onMoveDown}"
							reRender="balanceDetailData" />
					</aon:graphicImage>
				</aon:div>
				 -->
				<f:facet name="footer">
					<aon:inputText required="true"
						rendered="#{balanceDetail.nevv}" value="#{balanceDetail.to.sortKey}"
						maxlength="4" size="2" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_id}" />
				</f:facet>
				<aon:outputText value="#{to.code}"
					rendered="#{to!=balanceDetail.to}" />
				<aon:inputText 
					rendered="#{to==balanceDetail.to}" value="#{balanceDetail.to.code}"
					maxlength="16" size="10" />
				<f:facet name="footer">
					<aon:inputText 
						rendered="#{balanceDetail.nevv}" value="#{balanceDetail.to.code}"
						maxlength="16" size="10" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-400">
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}"
					style="margin-left: #{(to.level-1)/2}em;#{to.title?'font-weight:bold;':''}#{to.internalCalculation?'font-style:italic;':''}"
					rendered="#{to!=balanceDetail.to}">
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<aon:inputText 
					rendered="#{to==balanceDetail.to}"
					value="#{balanceDetail.to.description}" maxlength="128" size="30" />
				<f:facet name="footer">
					<aon:inputText 
						rendered="#{balanceDetail.nevv}"
						value="#{balanceDetail.to.description}" maxlength="128" size="30" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.accounting_balance_detail_accounts}" />
				</f:facet>
				<aon:outputText value="#{to.accounts}"
					rendered="#{to!=balanceDetail.to}">
					<aon:abbreviateConverter maxWidth="50" />
				</aon:outputText>
				<h:inputTextarea styleClass="aon-form-input-text"
					rendered="#{to==balanceDetail.to}" cols="20" rows="3" 
					value="#{balanceDetail.to.accounts}" maxlength="100"  />
				<f:facet name="footer">
					<h:inputTextarea styleClass="aon-form-input-text"
						rendered="#{balanceDetail.nevv}" cols="20" rows="3"
						value="#{balanceDetail.to.accounts}" maxlength="100" />
				</f:facet>
			</aon:column>
<!-- 
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
				<f:facet name="header">
					<aon:outputText value="#{bundle.accounting_balance_sheet_notes}" />
				</f:facet>
				<aon:outputText value="#{to.notes}"
					rendered="#{to!=balanceDetail.to}">
					<aon:abbreviateConverter maxWidth="50" />
				</aon:outputText>
				<aon:inputText  rendered="#{to==balanceDetail.to}" 
					value="#{balanceDetail.to.notes}" maxlength="100"  />
				<f:facet name="footer">
					<aon:inputText rendered="#{balanceDetail.nevv}" 
						value="#{balanceDetail.to.notes}" maxlength="100"  />
				</f:facet>
			</aon:column>
 -->
			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-60">
				<f:facet name="header">
					<aon:div>
						<aon:outputText
							value="#{bundle.accounting_balance_detail_title2}">
							<aon:abbreviateConverter maxWidth="4" />
						</aon:outputText>
						<rich:toolTip
							value="#{bundle.accounting_balance_detail_title2}"
							hideEvent="onmouseout" showDelay="100">
						</rich:toolTip>
					</aon:div>
				</f:facet>
				<aon:outputText value="&#160;"
					styleClass="#{(to.title)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}"
					rendered="#{to!=balanceDetail.to}" />
				<aon:selectBooleanCheckbox rendered="#{to==balanceDetail.to}"
					value="#{balanceDetail.to.title}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox rendered="#{balanceDetail.nevv}"
						value="#{balanceDetail.to.title}" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-60">
				<f:facet name="header">
					<aon:div>
						<aon:outputText
							value="#{bundle.accounting_balance_detail_calculation2}">
							<aon:abbreviateConverter maxWidth="4" />
						</aon:outputText>
						<rich:toolTip
							value="#{bundle.accounting_balance_detail_calculation2}"
							hideEvent="onmouseout" showDelay="100">
						</rich:toolTip>
					</aon:div>
				</f:facet>
				<aon:outputText value="&#160;"
					styleClass="#{(to.internalCalculation)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}"
					rendered="#{to!=balanceDetail.to}" />
				<aon:selectBooleanCheckbox rendered="#{to==balanceDetail.to}"
					value="#{balanceDetail.to.internalCalculation}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox rendered="#{balanceDetail.nevv}"
						value="#{balanceDetail.to.internalCalculation}" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-60">
				<f:facet name="header">
					<aon:div>
						<aon:outputText
							value="#{bundle.accounting_balance_detail_visible2}">
							<aon:abbreviateConverter maxWidth="4" />
						</aon:outputText>
						<rich:toolTip
							value="#{bundle.accounting_balance_detail_visible2}"
							hideEvent="onmouseout" showDelay="100">
						</rich:toolTip>
					</aon:div>
				</f:facet>
				<aon:outputText value="&#160;"
					styleClass="#{(to.visible)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}"
					rendered="#{to!=balanceDetail.to}" />
				<aon:selectBooleanCheckbox rendered="#{to==balanceDetail.to}"
					value="#{balanceDetail.to.visible}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox rendered="#{balanceDetail.nevv}"
						value="#{balanceDetail.to.visible}" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-60">
				<f:facet name="header">
					<aon:div>
						<aon:outputText
							value="#{bundle.accounting_balance_detail_zeroflag2}">
							<aon:abbreviateConverter maxWidth="4" />
						</aon:outputText>
						<rich:toolTip
							value="#{bundle.accounting_balance_detail_zeroflag2}"
							hideEvent="onmouseout" showDelay="100">
						</rich:toolTip>
					</aon:div>
				</f:facet>
				<aon:outputText value="&#160;"
					styleClass="#{(to.zeroFlag)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}"
					rendered="#{to!=balanceDetail.to}" />
				<aon:selectBooleanCheckbox rendered="#{to==balanceDetail.to}"
					value="#{balanceDetail.to.zeroFlag}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox rendered="#{balanceDetail.nevv}"
						value="#{balanceDetail.to.zeroFlag}" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-60">
				<f:facet name="header">
					<aon:div>
						<aon:outputText
							value="#{bundle.accounting_balance_detail_creditnature2}">
							<aon:abbreviateConverter maxWidth="4" />
						</aon:outputText>
						<rich:toolTip
							value="#{bundle.accounting_balance_detail_creditnature2}"
							hideEvent="onmouseout" showDelay="100">
						</rich:toolTip>
					</aon:div>
				</f:facet>
				<aon:outputText value="&#160;" style="text-align:center;"
					styleClass="#{(to.creditNature)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}"
					rendered="#{to!=balanceDetail.to}" />
				<aon:selectBooleanCheckbox rendered="#{to==balanceDetail.to}"
					value="#{balanceDetail.to.creditNature}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox rendered="#{balanceDetail.nevv}"
						value="#{balanceDetail.to.creditNature}" />
				</f:facet>
			</aon:column>
 
			<aon:column styleClass="aon-editDataTable-buttonsColumn">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div styleClass="aon-nowrap" >
					<aon:outputText rendered="#{to!=balanceDetail.to}">&#160;</aon:outputText>
					<aon:commandButton title="[#{bundle.aon_accept}]"
						rendered="#{to==balanceDetail.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{balanceDetail.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==balanceDetail.to}"
						actionListener="#{balanceDetail.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje"
						title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==balanceDetail.to}"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{balanceDetail.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div styleClass="aon-nowrap">
						<aon:outputText rendered="#{!porcentaje.nevv}">&#160;</aon:outputText> 
						<aon:commandButton title="[#{bundle.aon_accept}]"
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{balanceDetail.nevv}"
							actionListener="#{balanceDetail.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje"
							title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{balanceDetail.nevv}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{balanceDetail.onCancel}"
							immediate="true" accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

		</aon:editDataTable>
		<aon:dataScroller for="balanceDetailData" showNote="true" page="#{balanceDetail.page}" />
	</aon:div>

</ui:composition>
