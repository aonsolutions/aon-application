<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="aonZipLoaderForm">

    		<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.aon_loader_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_form}" />

				<ui:define name="toolbarContent">
<!-- 				
						target="_blank"
 -->
					<aon:htmlCommandLink id="execute"  
						value="#{bundle.aon_loader_load}"
						actionListener="#{aonZipLoader.onLoad}"
						rendered="#{aonZipLoader.aonFile.size > 0}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"/>
				</ui:define>
			</ui:decorate>
			
			<aon:panelGrid columns="2" style="width:90%; margin:10px;">
				<aon:outputLabel for="attach_file" value="#{bundle.aon_fileupload_element}" />
				<a4j:region>
					<h:panelGrid id="attachGrid" columns="2">
						<aon:outputText rendered="#{aonZipLoader.aonFile.size > 0}"
							value="#{aonZipLoader.aonFile.fileName} - ( #{aonZipLoader.aonFile.size} bytes)" />
						<aon:fileUpload id="attach_file"
							addControlLabel="#{bundle.aon_fileUpload_add}"
							stopControlLabel="#{bundle.aon_fileUpload_stop}"
							stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
							uploadControlLabel="#{bundle.aon_fileUpload_upload}"
							fileUploadListener="#{aonZipLoader.fileUploaded}" immediateUpload="true"
							autoclear="true" listWidth="0px" listHeight="0px">
							<f:facet name="label">
								<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
							</f:facet>
							<a4j:support event="onuploadcomplete" reRender="attachGrid,aonToolbar,paramsGrid" />
						</aon:fileUpload>
					</h:panelGrid>
				</a4j:region>
			</aon:panelGrid>
			
			<aon:div id="paramsGrid">
				<aon:if test="#{aonZipLoader.aonFile.size > 0}">
					<aon:panelGrid  columns="2" style="width:90%; margin:10px;">
				
						<aon:div>
							<aon:outputLabel value="#{bundle.aon_login_passwd}" for="passwd"/>
							<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
								<aon:outputText value="#{bundle.admin_new_domain_passwd_help}" />
							</aon:div>
						</aon:div>
						<aon:inputSecret id="passwd" required="true" styleClass="aon-inputText"
							value="#{aonZipLoader.params.password}" size="20" maxlength="16" />

						<aon:outputText value ="&#160;"/>
						<aon:div>
							<aon:selectBooleanCheckbox id="aonZipLoader_documentValid"
								value="#{aonZipLoader.params.documentValidable}" />
							<aon:outputLabel
								for="aonZipLoader_documentValid"
								value="#{bundle.aon_loader_document}" />
						</aon:div>

						<aon:outputText value ="&#160;"/>
						<aon:div>
							<aon:selectBooleanCheckbox id="aonZipLoader_forceRegistryInsert"
								value="#{aonZipLoader.params.forceRegistryInsert}" />
							<aon:outputLabel
								for="aonZipLoader_forceRegistryInsert"
								value="#{bundle.aon_loader_forceRegistryInsert}" />
						</aon:div>

						<aon:outputText value ="&#160;"/>
						<aon:div>
							<aon:selectBooleanCheckbox id="aonZipLoader_ignoreExistingDomains"
								value="#{aonZipLoader.params.ignoreExistingDomains}" />
							<aon:outputLabel
								for="aonZipLoader_ignoreExistingDomains"
								value="Ignorar dominios existentes" />
						</aon:div>
						
	
						<aon:if test="#{aonRole.confidentiality}">
							<aon:outputText value ="&#160;"/>
							<aon:div>
								<aon:selectBooleanCheckbox id="aonZipLoader_securityLevel"
									value="#{aonZipLoader.params.confidential}" />
								<aon:outputLabel
									for="aonZipLoader_securityLevel"
									value="#{bundle.aon_confidential}" />
							</aon:div>
						</aon:if>
					</aon:panelGrid>
				</aon:if>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
