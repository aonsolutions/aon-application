<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_statement_module}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener" value="" type="actionListener" />
					<aon:methodParam name="searchAction" value="account_statement_search" />
				</ui:define>
				
				<ui:define name="additionalToolbarContent">

					<aon:commandButton id="update" value="#{accountingBundle.accounting_refresh}"
						accesskey="Q" title="#{accountingBundle.accounting_refresh}"
						actionListener="#{trialBalance.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh"
						immediate="true" />

					<aon:commandButton id="trialBalance-back"
						value="#{bundle.aon_back}"
						rendered="#{trialBalance.backAction != null}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						action="#{trialBalance.backAction}"
						accesskey="#{bundle.aon_key_cancel}" />
						
					<aon:htmlCommandLink id="trialBalance-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						title="#{bundle.aon_listing} MS Excel"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="trialBalance" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="trialBalance-word-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						title="#{bundle.aon_listing} MS Word 2007"
						styleClass="aon-finding-toolbar-item aon-icon-word aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="trialBalance" />
						<f:param name="outputFormat" value="DOCX" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="trialBalance-report"
						value="#{bundle.aon_listing}" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="trialBalance" />
					</aon:htmlCommandLink>
						
				</ui:define>
				
			</ui:decorate>

			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				
				<aon:div style="background-color:#f6f5e3; padding:5px; margin-bottom:5px;">
					<aon:outputText value="#{accountingBundle.accounting_params}:" styleClass="aon-bold"/>
					
					<aon:outputText value="#{accountingBundle.accounting_period}:" rendered="#{trialBalance.parameters.periodNotNull}" styleClass="aon-italic aon-margin-left" style="font-size: 0.9em;"/>
					<aon:outputText value="#{trialBalance.parameters.period.name}" rendered="#{trialBalance.parameters.periodNotNull}" styleClass="aon-margin-left"/>

					<aon:outputText value="#{bundle.aon_date_from}:" rendered="#{trialBalance.parameters.fromDate != null}" styleClass="aon-italic aon-margin-left" style="font-size: 0.9em;"/>
					<aon:outputText value="#{trialBalance.parameters.fromDate}" rendered="#{trialBalance.parameters.fromDate != null}" styleClass="aon-margin-left">
						<f:convertDateTime type="date" pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>

					<aon:outputText value="#{bundle.aon_date_to}:" rendered="#{trialBalance.parameters.toDate != null}" styleClass="aon-italic aon-margin-left" style="font-size: 0.9em;"/>
					<aon:outputText value="#{trialBalance.parameters.toDate}" rendered="#{trialBalance.parameters.toDate != null}" styleClass="aon-margin-left">
						<f:convertDateTime type="date" pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>

					<aon:outputText value="#{accountBundle.account_account}:" rendered="#{trialBalance.parameters.notEmptyAccountExpression}" styleClass="aon-italic aon-margin-left" style="font-size: 0.9em;"/>
					<aon:outputText value="#{trialBalance.parameters.accountExpression}" rendered="#{trialBalance.parameters.notEmptyAccountExpression}" styleClass="aon-margin-left"/>

					<aon:outputText value="#{bundle.aon_description}:" rendered="#{trialBalance.parameters.notEmptyAccountDescription}" styleClass="aon-italic aon-margin-left" style="font-size: 0.9em;"/>
					<aon:outputText value="#{trialBalance.parameters.accountDescription}" rendered="#{trialBalance.parameters.notEmptyAccountDescription}" styleClass="aon-margin-left"/>

					<aon:outputText value="#{bundle.aon_alias}:" rendered="#{trialBalance.parameters.notEmptyAccountAlias}" styleClass="aon-italic aon-margin-left" style="font-size: 0.9em;"/>
					<aon:outputText value="#{trialBalance.parameters.accountAlias}" rendered="#{trialBalance.parameters.notEmptyAccountAlias}" styleClass="aon-margin-left"/>
					
					<c:if test="#{aonRole.confidentiality}">
						<aon:outputText value="#{bundle.aon_confidential}:" rendered="#{trialBalance.parameters.securityLevel != null}" styleClass="aon-italic aon-margin-left" style="font-size: 0.9em;"/>
						<aon:outputText value="#{bundle.aon_yes}" rendered="#{trialBalance.parameters.securityLevel != null and trialBalance.parameters.confidential}" styleClass="aon-margin-left"/>
						<aon:outputText value="#{bundle.aon_no}" rendered="#{trialBalance.parameters.securityLevel != null and !trialBalance.parameters.confidential}" styleClass="aon-margin-left"/>
					</c:if>
				</aon:div>
				
				<aon:dataTable id="statementList" value="#{trialBalance.model}"
					style="font-size: 0.9em;"
					rows="#{trialBalance.parameters.rowsPerPage}" var="to"
					rendered="#{trialBalance.model.rowCount > 0}">

					<f:facet name="header">
						<rich:columnGroup>
							<aon:column styleClass="aon-dataTable-header" colspan="2">
								<aon:outputText value="&#160;" />
							</aon:column>
							<aon:column styleClass="aon-dataTable-header" colspan="2">
								<aon:outputText value="Saldos Iniciales" />
							</aon:column>
							<aon:column styleClass="aon-dataTable-header" colspan="2">
								<aon:outputText value="Saldos Periodo" />
							</aon:column>
							<aon:column styleClass="aon-dataTable-header" colspan="2">
								<aon:outputText value="Saldos Finales" />
							</aon:column>
						</rich:columnGroup>
					</f:facet>

					<aon:column styleClass="aon-width-100 #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.account_account}" />
						</f:facet>
						<aon:commandLink id="statement-search" 
							immediate="true" 
							style="margin-left: #{(to.level-1)/2}em;" 
							styleClass="aon-dataTable-link"
							actionListener="#{trialBalance.onStatement}"
							title="#{accountingBundle.accounting_statement_module}"
							action="account_statement_list">
							<aon:outputText value="#{to.code}" />
							<f:setPropertyActionListener 
								value="account_statement_account_list" 
								target="#{statement.backAction}" />
						</aon:commandLink>
					</aon:column>

					<aon:column styleClass="aon-width-auto #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.shortDescription}" style="font-size: 0.9em;"/>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{bundle.aon_total}" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-100 #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_debit_balance}" />
						</f:facet>
						<aon:outputText value="#{to.initialUnpaidBalance}" rendered="#{to.initialUnpaidBalance != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{trialBalance.summaryCollection.initialUnpaidBalance}"
									rendered="#{trialBalance.summaryCollection.initialUnpaidBalance != 0}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-100 #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_credit_balance}" />
						</f:facet>
						<aon:outputText value="#{to.initialCreditBalance}" rendered="#{to.initialCreditBalance != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{trialBalance.summaryCollection.initialCreditBalance}"
									rendered="#{trialBalance.summaryCollection.initialCreditBalance != 0}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-100 #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_debit}" />
						</f:facet>
						<aon:outputText value="#{to.debit}" rendered="#{to.debit != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{trialBalance.summaryCollection.debit}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-100 #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_credit}" />
						</f:facet>
						<aon:outputText value="#{to.credit}" rendered="#{to.credit != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText value="#{trialBalance.summaryCollection.credit}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-100 #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_debit_balance}" />
						</f:facet>
						<aon:outputText value="#{to.unpaidBalance}" rendered="#{to.unpaidBalance != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText
									rendered="#{trialBalance.summaryCollection.unpaidBalance != 0}" 
									value="#{trialBalance.summaryCollection.unpaidBalance}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-100 #{to.lastLevel?'':'aon-row-auxiliary'}">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_credit_balance}" />
						</f:facet>
						<aon:outputText value="#{to.creditBalance}" rendered="#{to.creditBalance != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-text-right">
								<aon:outputText
									rendered="#{trialBalance.summaryCollection.creditBalance != 0}" 
									value="#{trialBalance.summaryCollection.creditBalance}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

				</aon:dataTable>

				<aon:dataScroller2 for="statementList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
