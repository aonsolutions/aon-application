<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="invoiceEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_change_account}" />

				<ui:define name="toolbarContent">
					<aon:commandButton
						value="#{accountingBundle.accounting_change_account_button}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accountChange.onChangeAccounts}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{accountingBundle.accounting_change_account_button}?')){ return false;} else {Richfaces.showModalPanel('waitProccess')}"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel value="#{accountingBundle.accounting_change_account_origin}" />
					
					<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupTo" value="#{accountChange.initAccount}" />
						<ui:param name="idRequired" value="true" />				
					</ui:include>
						
					<aon:outputLabel
						value="#{accountingBundle.accounting_change_account_destiny}" />
					<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupSuffix" value="Destiny" />
						<ui:param name="lookupTo" value="#{accountChange.finalAccount}" />
						<ui:param name="idRequired" value="true" />				
					</ui:include>
				</aon:panelGrid>

				<aon:div id="loanContainer" style="margin-top: 10px;width: 100%;">
					<aon:panelCollapsible
						label="#{accountingBundle.accounting_account_change_parameters}">

						<aon:panelGrid columns="2" style="width: 100%;text-align:left;"
							columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
							<aon:outputLabel
								for="AccountEntryDetail_accountEntry_accountPeriod"
								value="#{bundle.aon_financial_year}" />
							<aon:selectOneMenu required="true"
								id="AccountEntryDetail_accountEntry_accountPeriod"
								value="#{accountChange.period}">
								<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
							</aon:selectOneMenu>

							<aon:outputLabel
								for="AccountEntryDetail_accountEntry_entryDate-From"
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate
								id="AccountEntryDetail_accountEntry_entryDate-From"
								value="#{accountChange.fromDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />

							<aon:outputLabel
								for="AccountEntryDetail_accountEntry_entryDate-To"
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate
								id="AccountEntryDetail_accountEntry_entryDate-To"
								value="#{accountChange.toDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />

							<c:if test="#{aonRole.confidentiality}">
								<aon:outputLabel for="AccountEntryDetail_accountEntry_securityLevel"
										value="#{bundle.aon_confidential}" />
								<aon:selectOneRadio id="AccountEntryDetail_accountEntry_securityLevel"
									value="#{accountChange.securityLevel}">
									<f:selectItems value="#{commonCollections.confidentialValues}" />
								</aon:selectOneRadio>				
							</c:if>

							<aon:outputLabel for="AccountEntryDetail_accountEntry_concept"
								value="#{bundle.aon_concept}" />
							<aon:inputText id="AccountEntryDetail_accountEntry_concept"
								value="#{accountChange.concept}" size="30" />

							<aon:outputLabel for="AccountEntryDetail_accountEntry_debit"
								value="#{bundle.account_debit}" />
							<aon:inputText id="AccountEntryDetail_accountEntry_debit"
								value="#{accountChange.debit}" size="15" />

							<aon:outputLabel for="AccountEntryDetail_accountEntry_credit"
								value="#{bundle.account_credit}" />
							<aon:inputText id="AccountEntryDetail_accountEntry_credit"
								value="#{accountChange.credit}" size="15" />

							<aon:outputLabel
								value="#{accountingBundle.accounting_balancing_account}" />
							<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupSuffix" value="BalancingAccount" />
								<ui:param name="lookupTo" value="#{accountChange.balancingAccount}" />
							</ui:include>
						</aon:panelGrid>
					</aon:panelCollapsible>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{accountLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
