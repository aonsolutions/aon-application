<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="invoiceEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_change_account}" />

				<ui:define name="toolbarContent">
					<aon:commandButton
						value="#{accountingBundle.accounting_change_account_button}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accountChange.onChangeAccounts}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{accountingBundle.accounting_change_account_button}?')){ return false;} else {Richfaces.showModalPanel('waitProccess')}"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
					<aon:outputLabel
						value="#{accountingBundle.accounting_change_account_origin}" />
					<ui:decorate
						template="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
						<ui:param name="wizard" value="#{accountWizard}" />
						<ui:param name="id" value="account" />
						<ui:param name="size" value="20" />
						<ui:param name="maxlength" value="100" />
						<ui:param name="renderDescription" value="#{true}" />
						<ui:param name="renderedAttr" value="#{true}" />
						<ui:param name="reRenderAttr" value="none" />
						<ui:param name="required" value="true" />
						<ui:param name="entity" value="#{accountChange.initAccount}" />
						<ui:param name="ELExpression" value="accountChange.initAccount" />
					</ui:decorate>

					<aon:outputLabel
						value="#{accountingBundle.accounting_change_account_destiny}" />
					<ui:decorate
						template="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
						<ui:param name="wizard" value="#{accountWizard}" />
						<ui:param name="id" value="finalAccount" />
						<ui:param name="size" value="20" />
						<ui:param name="maxlength" value="30" />
						<ui:param name="renderDescription" value="#{true}" />
						<ui:param name="renderedAttr" value="#{true}" />
						<ui:param name="reRenderAttr" value="none" />
						<ui:param name="required" value="true" />
						<ui:param name="entity" value="#{accountChange.finalAccount}" />
						<ui:param name="ELExpression" value="accountChange.finalAccount" />
					</ui:decorate>
				</aon:panelGrid>


				<aon:div id="loanContainer" style="margin-top: 10px;width: 100%;">
					<aon:panelCollapsible
						label="#{accountingBundle.accounting_account_change_parameters}">

						<aon:panelGrid columns="2" style="width: 100%;text-align:left;"
							columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
							<aon:outputLabel
								for="AccountEntryDetail_accountEntry_accountPeriod"
								value="#{accountingBundle.accounting_period}" />
							<aon:selectOneMenu required="true"
								id="AccountEntryDetail_accountEntry_accountPeriod"
								value="#{accountChange.period}">
								<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
							</aon:selectOneMenu>

							<aon:outputLabel
								for="AccountEntryDetail_accountEntry_entryDate-From"
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate
								id="AccountEntryDetail_accountEntry_entryDate-From"
								value="#{accountChange.fromDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />

							<aon:outputLabel
								for="AccountEntryDetail_accountEntry_entryDate-To"
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate
								id="AccountEntryDetail_accountEntry_entryDate-To"
								value="#{accountChange.toDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />

							<aon:outputLabel
								for="AccountEntryDetail_accountEntry_securityLevel"
								value="#{bundle.aon_security_level}" />
							<aon:selectOneMenu
								id="AccountEntryDetail_accountEntry_securityLevel"
								value="#{accountChange.securityLevel}">
								<f:selectItem itemValue="" itemLabel=" " />
								<f:selectItems value="#{commonCollections.securityLevels}" />
							</aon:selectOneMenu>

							<aon:outputLabel for="AccountEntryDetail_accountEntry_concept"
								value="#{bundle.aon_concept}" />
							<aon:inputText id="AccountEntryDetail_accountEntry_concept"
								value="#{accountChange.concept}" size="30" />

							<aon:outputLabel for="AccountEntryDetail_accountEntry_debit"
								value="#{accountingBundle.accounting_debit}" />
							<aon:inputText id="AccountEntryDetail_accountEntry_debit"
								value="#{accountChange.debit}" size="15" />

							<aon:outputLabel for="AccountEntryDetail_accountEntry_credit"
								value="#{accountingBundle.accounting_credit}" />
							<aon:inputText id="AccountEntryDetail_accountEntry_credit"
								value="#{accountChange.credit}" size="15" />

							<aon:outputLabel
								value="#{accountingBundle.accounting_balancing_account}" />
							<ui:decorate
								template="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
								<ui:param name="wizard" value="#{accountWizard}" />
								<ui:param name="id" value="balancingAccount" />
								<ui:param name="size" value="20" />
								<ui:param name="maxlength" value="30" />
								<ui:param name="renderDescription" value="#{true}" />
								<ui:param name="renderedAttr" value="#{true}" />
								<ui:param name="disabled" value="#{false}" />
								<ui:param name="reRenderAttr" value="none" />
								<ui:param name="required" value="false" />
								<ui:param name="entity"
									value="#{accountChange.balancingAccount}" />
								<ui:param name="ELExpression"
									value="accountChange.balancingAccount" />
							</ui:decorate>
						</aon:panelGrid>
					</aon:panelCollapsible>
				</aon:div>
			</aon:div>
		</aon:form>
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
