<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components" 
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core" 
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_en_period_entries_management}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{accountingBundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}" styleClass="aon-finding-toolbar-item aon-icon-accept"
						disabled="#{endPeriodEntries.disabled}"
						rendered="#{empty endPeriodEntries.outputMessages}"
						actionListener="#{endPeriodEntries.onAccept}"
						onclick="if (!confirm('#{accountingBundle.accounting_entry_generate}')) return false; else Richfaces.showModalPanel('waitProccess');"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
					<aon:commandButton id="back" value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_save}" styleClass="aon-finding-toolbar-item aon-icon-cancel"
						rendered="#{!empty endPeriodEntries.outputMessages}"
						actionListener="#{endPeriodEntries.onInit}"/>
					<aon:commandButton id="see" value="#{accountingBundle.accounting_entry_generated}"
						accesskey="#{bundle.aon_key_save}" styleClass="aon-finding-toolbar-item aon-icon-go"
						rendered="#{!empty endPeriodEntries.outputMessages}"
						actionListener="#{endPeriodEntries.onSeeEntries}"
						action="accountEntry_form" />
				</ui:define>
			</ui:decorate>

			<aon:div id="endPeriodData"  styleClass="aon-scroll-area">
			
				<aon:div id="outputMessagesContainer"
					style="background-color:#f6f5e3; border: solid green 1px; padding:5px; padding-left:50px; margin:15px; width: 90%;"
					rendered="#{!empty endPeriodEntries.outputMessages}">
 					<rich:dataList var="msg" value="#{endPeriodEntries.outputMessages}">
 						<aon:outputText value="#{msg}" escape="false"/> 
 					</rich:dataList>					
				</aon:div>

				<aon:panelGrid columns="2" style="width: 100%;" rendered="#{empty endPeriodEntries.outputMessages}"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
					
					<aon:outputLabel for="Period" value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu id="Period" value="#{endPeriodEntries.params.period}" required="true">
						<f:selectItem itemLabel="-" itemValue="#{null}" />
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
						<a4j:support event="onchange"
							actionListener="#{endPeriodEntries.onPeriodChanged}"
							onsubmit="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" 						 
							ajaxSingle="true" reRender="endPeriodData,save" />
					</aon:selectOneMenu>
				</aon:panelGrid>
				
				<aon:panelGrid columns="1" style="width: 100%; margin-top: 20px;"
					rendered="#{endPeriodEntries.params.period != null and empty endPeriodEntries.outputMessages}" 
					columnClasses="aon-panelGrid-even aon-width-auto">
					
					<aon:div id="messagesContainer"
						style="background-color:#f6f5e3; border: solid green 1px; padding:5px; padding-left:50px; margin:15px; width: 90%;"
						rendered="#{!empty endPeriodEntries.messages}">
	 					<rich:dataList var="msg" value="#{endPeriodEntries.messages}">
	 						<aon:outputText value="#{msg}" escape="false"/> 
	 					</rich:dataList>					
					</aon:div>
					
					<aon:div>
						<aon:div>
							<aon:selectBooleanCheckbox id="operatingEnabled"
								value="#{endPeriodEntries.params.operatingEntry}">
								<a4j:support event="onclick"
									actionListener="#{endPeriodEntries.onCheck}"
									onsubmit="Richfaces.showModalPanel('waitProccess')"
									oncomplete="Richfaces.hideModalPanel('waitProccess')" 						 
									ajaxSingle="true" reRender="endPeriodData,save" />
							</aon:selectBooleanCheckbox>
							<aon:outputLabel for="operatingEnabled" 
								value="#{accountingBundle.accounting_generate_operating_entry}" />
						</aon:div>
						<aon:div id="operatingMessagesContainer"
							style="background-color:#f6f5e3; border: solid green 1px; padding:5px; padding-left:50px; margin: 10px; width: 90%;"
							rendered="#{!empty endPeriodEntries.operatingMessages}">
		 					<rich:dataList var="msg" value="#{endPeriodEntries.operatingMessages}">
		 						<aon:outputText value="#{msg}" escape="false"/> 
		 					</rich:dataList>					
						</aon:div>
						<aon:div rendered="#{!endPeriodEntries.disabled}">
							<aon:panelGrid columns="2" style="width: 75%; margin: 10px;"
								rendered="#{endPeriodEntries.params.operatingEntry}"
								columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
								
									<aon:outputLabel for="Operating_date" value="#{bundle.aon_date}" />
									<aon:selectInputDate id="Operating_date" required="true" 
										value="#{endPeriodEntries.params.operatingDate}" 
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}" />
				
									<aon:outputLabel for="Operating_Concept" value="#{bundle.aon_concept}" />
									<aon:inputText id="Operating_Concept"  required="true" 
										value="#{endPeriodEntries.params.operatingConcept}" 
										maxlength="32" size="40" />
							</aon:panelGrid>
						</aon:div>
					</aon:div>
					
					<aon:div>
						<aon:div>
							<aon:selectBooleanCheckbox id="closingEnabled"
								value="#{endPeriodEntries.params.closingEntry}">
								<a4j:support event="onclick"
									actionListener="#{endPeriodEntries.onCheck}"
									onsubmit="Richfaces.showModalPanel('waitProccess')"
									oncomplete="Richfaces.hideModalPanel('waitProccess')" 						 
									ajaxSingle="true" reRender="endPeriodData,save" />
							</aon:selectBooleanCheckbox>
							<aon:outputLabel for="closingEnabled" 
								value="#{accountingBundle.accounting_generate_closing_entry}" />
						</aon:div>
						<aon:div id="closingMessagesContainer"
							style="background-color:#f6f5e3; border: solid green 1px; padding:5px; padding-left:50px; margin: 10px;; width: 90%;"
							rendered="#{!empty endPeriodEntries.closingMessages}">
		 					<rich:dataList var="msg" value="#{endPeriodEntries.closingMessages}">
		 						<aon:outputText value="#{msg}" escape="false"/> 
		 					</rich:dataList>					
						</aon:div>
						<aon:div rendered="#{!endPeriodEntries.disabled}">
							<aon:panelGrid columns="2" style="width: 75%; margin: 10px;"
								rendered="#{endPeriodEntries.params.closingEntry}"
								columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
								
									<aon:outputLabel for="Closing_date" value="#{bundle.aon_date}" />
									<aon:selectInputDate id="Closing_date" required="true" 
										value="#{endPeriodEntries.params.operatingDate}" 
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}" />
				
									<aon:outputLabel for="Closing_Concept" value="#{bundle.aon_concept}" />
									<aon:inputText id="Closing_Concept" required="true" 
										value="#{endPeriodEntries.params.closingConcept}" 
										maxlength="32" size="40" />
							</aon:panelGrid>
						</aon:div>
						
						<aon:div rendered="#{endPeriodEntries.params.closingEntry}" style="padding-left: 5px;">
							<aon:selectBooleanCheckbox id="openingEnabled"
								value="#{endPeriodEntries.params.openingEntry}">
								<a4j:support event="onclick"
									actionListener="#{endPeriodEntries.onCheck}"
									onsubmit="Richfaces.showModalPanel('waitProccess')"
									oncomplete="Richfaces.hideModalPanel('waitProccess')" 						 
									ajaxSingle="true" reRender="endPeriodData,save" />
							</aon:selectBooleanCheckbox>
							<aon:outputLabel for="openingEnabled" 
								value="#{accountingBundle.accounting_generate_opening_entry}" />
						</aon:div>
						
						<aon:div id="openingMessagesContainer"
							style="background-color:#f6f5e3; border: solid green 1px; padding:5px; padding-left:50px; margin: 10px;; width: 90%;"
							rendered="#{!empty endPeriodEntries.openingMessages}">
		 					<rich:dataList var="msg" value="#{endPeriodEntries.openingMessages}">
		 						<aon:outputText value="#{msg}" escape="false"/> 
		 					</rich:dataList>					
						</aon:div>
						
						<aon:div rendered="#{!endPeriodEntries.disabled}">
							<aon:panelGrid columns="2" style="width: 75%; margin: 10px;"
								rendered="#{endPeriodEntries.params.openingEntry}"
								columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
								
									<aon:outputText value="#{accountingBundle.accounting_opening_period}" />
									<aon:div>
										<aon:outputText value="#{endPeriodEntries.params.openingPeriod.id}" />
										<aon:outputText value="(#{accountingBundle.accounting_opening_period_creation})"
											rendered="#{endPeriodEntries.params.openingPeriodCreationEnabled}" 
											styleClass="aon-italic aon-padding-left"/>
									</aon:div>

									<aon:outputLabel for="Opening_date" value="#{bundle.aon_date}" />
									<aon:selectInputDate id="Opening_date" required="true" 
										value="#{endPeriodEntries.params.openingDate}" 
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}" />
				
									<aon:outputLabel for="Opening_Concept" value="#{bundle.aon_concept}" />
									<aon:inputText id="Opening_Concept" required="true" 
										value="#{endPeriodEntries.params.openingConcept}" 
										maxlength="32" size="40" />
							</aon:panelGrid>
						</aon:div>
					</aon:div>
					
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
