<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="balanceForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.accounting_loan_module}" />
				<ui:param name="controller" value="#{loan}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
				
					<aon:outputLabel for="Loan_id"
						value="#{bundle.aon_id}" />
					<aon:div>
						<aon:inputText id="Loan_id"
							disabled="true"
							value="#{loan.to.id}" size="5" />
						<c:if test="#{aonRole.confidentiality}">
							<aon:selectBooleanCheckbox id="Loan_securityLevel"
								styleClass="aon-margin-left"
								value="#{loan.to.confidential}"/>
							<aon:outputLabel for="Loan_securityLevel" 
								styleClass="aon-italic aon-margin-right"
								value="#{bundle.aon_confidential}" />
						</c:if>
					</aon:div>

					<aon:outputLabel for="Loan_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Loan_description"
						value="#{loan.to.description}" size="60" />

					<aon:outputLabel for="Loan_date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Loan_date" required="true"
						value="#{loan.to.loanDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="Loan_term"
						value="#{bundle.accounting_term}" />
					<aon:div>
						<aon:inputText id="Loan_term" value="#{loan.to.term}" size="8"/>
						<aon:outputText value="#{bundle.accounting_term_months}"
							styleClass="aon-italic aon-margin-left" />						
					</aon:div>

					<aon:outputLabel for="Loan_recurrence"
						value="#{bundle.accounting_recurrence}" />
					<aon:inputText id="Loan_recurrence"
						value="#{loan.to.recurrence}" size="5">
						<f:validateLongRange />
					</aon:inputText>

					<aon:outputLabel for="Loan_pay_day"
						value="#{bundle.finance_cashflow_payment_day}" />
					<aon:inputText id="Loan_pay_day"
						value="#{loan.to.payDay}" size="5">
						<f:validateLongRange />
					</aon:inputText>

					<aon:outputLabel for="Loan_interest"
						value="#{bundle.accounting_interest}" />
					<aon:inputText id="Loan_interest"
						value="#{loan.to.interest}" size="60" />

					<aon:outputLabel for="Loan_review"
						value="#{bundle.accounting_review}" />
					<aon:inputText id="Loan_review"
						value="#{loan.to.review}" size="60" />

					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{bundle.aon_bank}" />
					<aon:selectOneMenu id="RegistryBank_Lookup_id" required="true"
						value="#{loan.to.registryBank}">
						<f:selectItem value="#{null}" itemLabel="-" />
						<c:if test="#{loan.new}">
							<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
						</c:if>
						<c:if test="#{!loan.new}">
							<f:selectItems value="#{companyCollections.allCompanyBanks}" />
						</c:if>
					</aon:selectOneMenu>

					<aon:outputLabel for="Loan_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="Loan_amount"
						value="#{loan.to.amount}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Loan_expenses"
						value="#{bundle.aon_expenses}" />
					<aon:inputText id="Loan_expenses"
						value="#{loan.to.expenses}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Loan_fee_amount"
						value="#{bundle.accounting_fee_amount}" />
					<aon:inputText id="Loan_fee_amount"
						value="#{loan.to.feeAmount}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Loan_status"
						value="#{bundle.aon_status}" />
					<aon:selectOneRadio id="Loan_status"
						value="#{loan.to.status}">
						<f:selectItems value="#{accountingCollections.loanStatuses}" />
					</aon:selectOneRadio>
					
					<aon:outputLabel for="Account_id" value="#{bundle.account_account}" />
					
					<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{loan.to.account}" />
						<ui:param name="idRequired" value="true" />				
					</ui:include>
					
				</aon:panelGrid>
									
				<aon:panelGrid columns="2" style="margin-top: 10px; width: 100%;" 
					rendered="#{!loan.new and loan.relatedAccount != null}"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
				
					<aon:outputText value="#{bundle.account_account}" />
					<aon:commandLink id="onAccountStatement-search" 
						immediate="#{true}" 
						styleClass="aon-dataTable-link"
						actionListener="#{loan.onAccountStatement}"
						title="#{bundle.accounting_statement_module}"
						action="accountStatement_list">
							<aon:outputText value="#{loan.relatedAccount.fullDescription}" />
					</aon:commandLink>

					<aon:outputText value="#{bundle.accounting_outstanding_balance}" />
					<aon:outputText value="#{loan.outstandingBalance}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
					
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{accountLookup}" />
	</ui:define>
</ui:composition>
