<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.accounting_profit_and_loss_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="skipClearButton" value="true" />
				
				<ui:define name="beforeToolbarContent">
					<aon:commandButton id="#{toolbarID}-clear"
							value="#{bundle.aon_clear}"
							actionListener="#{profitAndLossReport.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />

					<aon:outputLabel for="reportDate"
						value="#{bundle.finance_report_date}" />
					<aon:selectInputDate id="reportDate"
						value="#{profitAndLossReport.parameters.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{bundle.aon_financial_year}" />
					<aon:selectOneMenu id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{profitAndLossReport.parameters.period}">
						<a4j:support event="onchange"
							actionListener="#{profitAndLossReport.onPeriodChanged}" 
							reRender="AccountEntryDetail_accountEntry_entryDate-From,profitAndLossReport-search,SearchWarning,Account_exclude_operating"
							ajaxSingle="true" />
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_date_select}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-From"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate
							id="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{profitAndLossReport.parameters.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="oninputchange" reRender="profitAndLossReport-search,SearchWarning" ajaxSingle="true" />
							<a4j:support event="onchanged" reRender="profitAndLossReport-search,SearchWarning" ajaxSingle="true" />
						</aon:selectInputDate>

						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-To"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate
							id="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{profitAndLossReport.parameters.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="oninputchange" reRender="profitAndLossReport-search,SearchWarning" ajaxSingle="true" />
							<a4j:support event="onchanged" reRender="profitAndLossReport-search,SearchWarning" ajaxSingle="true" />
						</aon:selectInputDate>

					</aon:panelGrid>

					<aon:if test="#{profitAndLossReport.anyAccountCostCenterAvailable}">
						<aon:outputLabel for="Account_CostCenter"
								value="#{bundle.account_cost_center}" />
				 		<rich:listShuttle sourceValue="#{profitAndLossReport.accountCostCenters}"
				            targetValue="#{profitAndLossReport.parameters.accountCostCenters}" 
				            var="costCenters" listsHeight="100"
				            sourceListWidth="250" targetListWidth="250" 
				            sourceCaptionLabel="Centros de Costo Disponibles"
				            targetCaptionLabel="Centros de Costo Seleccionados"
				            orderControlsVisible="false"
							copyAllControlLabel="#{bundle.aon_copyAll}"
	                        copyControlLabel="#{bundle.aon_copy}"
	                        removeControlLabel="#{bundle.aon_remove}"
	                        removeAllControlLabel="#{bundle.aon_removeAll}"> 
				            <rich:column>
				                <h:outputText value="#{costCenters}"></h:outputText>
				            </rich:column>
				        </rich:listShuttle>
					</aon:if>
        
					<aon:if test="#{aonRole.confidentiality}">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneRadio
							id="AccountEntryDetail_accountEntry_securityLevel"
							value="#{profitAndLossReport.parameters.securityLevel}">
							<f:selectItems value="#{commonCollections.confidentialValues}" />
							<f:selectItem itemValue="" itemLabel="#{bundle.aon_all}" />
						</aon:selectOneRadio>
					</aon:if>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_exclude_operating"
							value="#{profitAndLossReport.parameters.excludeOperatingEntry}" />
						<aon:outputLabel for="Account_exclude_operating"
							value="#{bundle.accounting_exclude_operating_entry}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_zero_sum"
							value="#{profitAndLossReport.parameters.noTouchedAccountVisible}" />
						<aon:outputLabel for="Account_zero_sum"
							value="#{bundle.accounting_no_touched_account}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_balanced_acounts"
							value="#{profitAndLossReport.parameters.excludeBalancedAccounts}" />
						<aon:outputLabel for="Account_balanced_acounts"
							value="#{bundle.accounting_exclude_balanced_acounts}" />
					</aon:div>

					<aon:outputLabel for="Account_level"
						value="#{bundle.accounting_level}" />
					<aon:div>
						<aon:selectOneRadio id="Account_level"
							value="#{profitAndLossReport.parameters.accountLevel}">
							<f:selectItem itemLabel="1" itemValue="1" itemDisabled="true"/>
							<f:selectItem itemLabel="2"  itemValue="2" itemDisabled="true"/>
							<f:selectItem itemLabel="3" itemValue="3" />
							<f:selectItem itemLabel="4" itemValue="4" />
							<f:selectItem itemLabel="5" itemValue="5" />
						</aon:selectOneRadio>
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_show_cover"
							value="#{profitAndLossReport.parameters.coverVisible}" />
						<aon:outputLabel for="Account_show_cover"
							value="#{bundle.accounting_show_cover}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_continue_counter"
							reRender="Account_page_counter"
							value="#{profitAndLossReport.parameters.counterVisible}" />
						<aon:outputLabel for="Account_continue_counter"
							value="#{bundle.accounting_continue_counter}" />
						<aon:inputText id="Account_page_counter"
							styleClass="aon-margin-left"
							disabled="#{!profitAndLossReport.parameters.counterVisible}"
							value="#{profitAndLossReport.parameters.pageCounter}" size="6"/>
					</aon:div>

					<aon:outputText value="" />
					<aon:div id="SearchWarning">
						<aon:outputText value="#{bundle.accounting_statement_warning}"
							style="color:red;" styleClass="aon-bold" 	
							rendered="#{!profitAndLossReport.dateValid}"/>
					</aon:div>
					
					<aon:outputText value="" />
					<aon:div >
						<aon:commandButton id="profitAndLossReport-search"   
							value="#{bundle.aon_search}"
							styleClass="aon-search-lookup-button"
							action="profit_and_loss_list"
							actionListener="#{profitAndLossReport.calculateSummaryCollections}"
							disabled="#{!profitAndLossReport.dateValid}"
							reRender="#{searchReRender}"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionHotKey key="return" />
						</aon:commandButton>
					</aon:div>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
