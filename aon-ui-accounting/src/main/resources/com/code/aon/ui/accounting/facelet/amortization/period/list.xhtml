<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_period_amortization_module}" />
				<ui:param name="controller" value="#{periodAmortization}" />
				
				<ui:define name="additionalToolbarContent">
					<h:outputLink value="#"
						title="#{bundle.aon_listing}"
						onclick="window.print();"
						styleClass="aon-finding-toolbar-item aon-icon-printer">
						<aon:outputText value="#{bundle.aon_listing}" />
					</h:outputLink>
					<aon:commandButton actionListener="#{periodAmortization.onRecord}"
						title="#{accountingBundle.accounting_record}"
						value="#{accountingBundle.accounting_record}"
						onclick="if (!confirm('#{accountingBundle.accounting_record}?')) return false;"
						styleClass="aon-finding-toolbar-item aon-icon-task-assume" />
					<aon:commandButton actionListener="#{periodAmortization.onUnrecord}"
						title="#{accountingBundle.accounting_unrecord}"
						value="#{accountingBundle.accounting_unrecord}"
						onclick="if (!confirm('#{accountingBundle.accounting_unrecord}?')) return false;"
						styleClass="aon-finding-toolbar-item aon-icon-task-liberate" />
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable id="amortizationDataList"
					value="#{periodAmortization.calculatedModel}" rows="20" var="to"
					rendered="#{periodAmortization.model.rowCount > 0}">

					<f:facet name="footer">
						<rich:columnGroup>
							<aon:column styleClass="aon-dataTable-footer" colspan="4">
								<aon:outputText value="&#160;" />
							</aon:column>
							<aon:column
								styleClass="aon-dataTable-footer aon-italic aon-editDataTable-numberColumn">
								<aon:outputText value="#{periodAmortization.totalAmount}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:column>
							<aon:column styleClass="aon-dataTable-footer" colspan="4">
								<aon:outputText value="&#160;" />
							</aon:column>
							<aon:column
								styleClass="aon-dataTable-footer aon-italic aon-editDataTable-numberColumn">
								<aon:outputText value="#{periodAmortization.totalAllocation}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:column>
							<aon:column
								styleClass="aon-dataTable-footer aon-italic aon-editDataTable-numberColumn">
								<aon:outputText value="#{periodAmortization.totalAccumulated}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:column>
							<aon:column
								styleClass="aon-dataTable-footer aon-italic aon-editDataTable-numberColumn">
								<aon:outputText value="#{periodAmortization.totalPending}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:column>
						</rich:columnGroup>
					</f:facet>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:selectBooleanCheckbox value="#{to.checked}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_recorded}" />
						</f:facet>
						<aon:outputText value="#{to.status}" rendered="#{!to.scored}"/>
						<h:commandLink immediate="true" styleClass="aon-dataTable-link"
							rendered="#{to.scored}"
							title="#{accountingBundle.accounting_lookup_account_entry}"
							actionListener="#{periodAmortization.onAccountEntry}"
							action="accountEntry_form">
							<aon:outputText 
								value="#{to.accountEntry.accountPeriod}/#{to.accountEntry.id}" />
						</h:commandLink>
						
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText
								value="#{accountingBundle.accounting_fixed_asset_account}" />
						</f:facet>
						<aon:outputText
							value="#{to.amortization.fixedAssetAccount.fullDescription}">
							<aon:abbreviateConverter maxWidth="50" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date_from}" />
						</f:facet>
						<aon:outputText value="#{to.amortization.initialDate}">
							<f:convertDateTime type="date"
								pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_amount}" />
						</f:facet>
						<aon:outputText value="#{to.amortization.amount}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText
								value="#{accountingBundle.accounting_coefficient}" />
						</f:facet>
						<aon:outputText value="#{to.amortization.percentage}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:outputText value="% (" />
						<aon:outputText value="#{to.amortization.years}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:outputText value=")" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date_from}" />
						</f:facet>
						<aon:outputText value="#{to.fromDate}">
							<f:convertDateTime type="date"
								pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date_to}" />
						</f:facet>
						<aon:outputText value="#{to.toDate}">
							<f:convertDateTime type="date"
								pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_percentage}" />
						</f:facet>
						<aon:outputText value="#{to.coefficient}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:outputText value="%" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_allocation}" />
						</f:facet>
						<aon:outputText value="#{to.allocation}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText
								value="#{accountingBundle.accounting_accumulated}" />
						</f:facet>
						<aon:outputText value="#{to.accumulated}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_pending}" />
						</f:facet>
						<aon:outputText value="#{to.pending}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>
				<aon:dataScroller2 for="amortizationDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
