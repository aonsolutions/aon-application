<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:div styleClass="aon-scroll-area" >
			<aon:dataTable value="#{accountCheck.emptyAccountEntryModel}" var="to" 
				style="text-align: left;" rows="10" id="emptyAccountEntryCheck" >
					<f:facet name="header">
						<aon:outputText value="#{accountingBundle.accounting_check_empty_accountEntry}" />
					</f:facet>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_id}" />
					</f:facet>
					<aon:outputText value="#{to.id}"/>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_date}: " />
					</f:facet>
					<aon:outputText value="#{to.entryDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_security_level}: " />
					</f:facet>
					<aon:outputText value="#{to.securityLevel}"/>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_type}: " />
					</f:facet>
					<aon:outputText value="#{to.type}"/>
				</aon:column>
				
			</aon:dataTable>
			<aon:dataScroller2 for="emptyAccountEntryCheck" showNote="true" />
	</aon:div>
</ui:composition>
