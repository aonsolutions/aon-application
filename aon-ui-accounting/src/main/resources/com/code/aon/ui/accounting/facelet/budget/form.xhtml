<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_account_budget_module}" />
				<ui:param name="controller" value="#{accountBudget}" />
				<ui:param name="controller" value="#{accountBudget}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="budgetDetailList-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}" action="#{report.onExecute}"
						rendered="#{!accountBudget.new}">
						<f:param name="reportKey" value="budgetDetailList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2" style="width: 100%;">

					<aon:outputLabel for="accountId"
						value="#{accountBundle.account_account}" />
					<ui:decorate
						template="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
						<ui:param name="wizard" value="#{accountWizard}" />
						<ui:param name="id" value="accountId" />
						<ui:param name="renderDescription" value="true" />
						<ui:param name="renderedAttr" value="true" />
						<ui:param name="disabled" value="#{!accountBudget.new}" />
						<ui:param name="reRenderAttr" value="none" />
						<ui:param name="required" value="true" />
						<ui:param name="entity" value="#{accountBudget.to.account}" />
						<ui:param name="ELExpression" value="accountBudget.to.account" />
					</ui:decorate>

					<aon:outputLabel for="AccountBudget_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu id="AccountBudget_accountPeriod"
						rendered="#{accountBudget.new}"
						value="#{accountBudget.to.period}">
						<f:selectItems value="#{accountingCollections.activeAccountPeriodKeys}" />
					</aon:selectOneMenu>
					<aon:outputText styleClass="aon-bold"
						rendered="#{!accountBudget.new}"
						value="#{accountBudget.to.period}" />
					
					<aon:outputLabel for="AccountBudget_debit" 
						value="#{accountingBundle.accounting_debit}"
						rendered="#{accountBudget.new}"/>
					<aon:inputText id="AccountBudget_debit" value="#{accountBudget.debit}"
						size="10" rendered="#{accountBudget.new}">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="AccountBudget_credit" 
						value="#{accountingBundle.accounting_credit}"
						rendered="#{accountBudget.new}"/>
					<aon:inputText id="AccountBudget_credit" value="#{accountBudget.credit}"
						size="10" rendered="#{accountBudget.new}">
						<f:validateDoubleRange />
					</aon:inputText>
		
				</aon:panelGrid>
			</aon:div>
					
			<aon:div id="valuesTable" styleClass="aon-scroll-area" style="width:400px"
				rendered="#{!accountBudget.new}">
				<ui:include	src="form_lines.xhtml" />
			</aon:div>
 			
		</aon:form>
	</ui:define>
</ui:composition>
