<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_regenerate_journal_counter_module}" />
				<ui:param name="toolbarDescription" value="" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="regenerate"
						value="#{accountingBundle.accounting_regenerate}"
						accesskey="#{bundle.aon_key_search}"
						actionListener="#{accountJournalRegenerator.regenerateJournalCounter}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
					<h:commandButton type="reset" id="clear"
						value="#{bundle.aon_clear}"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountJournalRegenerator.period}">
						<f:selectItems value="#{accountingCollections.accountPeriods}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_securityLevel"
						value="#{accountJournalRegenerator.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<ui:include src="/facelet/shared/wait.xhtml">
			<ui:param name="progressLabel"
				value="#{accountingBundle.accounting_regenerate_journal_counter_module} ..." />
			<ui:param name="progressBarBean" value="#{accountJournalRegenerator}" />
		</ui:include>
	</ui:define>
</ui:composition>
