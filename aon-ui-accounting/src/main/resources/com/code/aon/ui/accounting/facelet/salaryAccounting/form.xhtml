<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salaryAccountingForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle" value="#{bundle.accounting_salary_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_reset}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="salaryRecord" 
						value="#{bundle.finance_record}"
						accesskey="#{bundle.aon_key_save}"
						title="#{bundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{salaryAccounting.onAccept}"
						action="#{salaryAccounting.accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept" />
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{salaryAccounting.enterprise}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<ui:param name="skipGoToButton" value="#{true}" />
					</ui:include>

					<aon:outputLabel for="SalaryAccounting_fromDate"
						value="#{bundle.aon_start_date}" />
					<aon:selectInputDate id="SalaryAccounting_fromDate"
						required="true"
						value="#{salaryAccounting.fromDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>

					<aon:outputLabel for="SalaryAccounting_toDate"
						value="#{bundle.aon_end_date}" />
					<aon:selectInputDate id="SalaryAccounting_toDate"
						required="true"
						value="#{salaryAccounting.toDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
					
					<aon:outputLabel for="SalaryAccounting_concept"
						styleClass="aon-outputLabel aon-input-required"
						value="#{bundle.aon_concept}" />
					<rich:comboBox id="SalaryAccounting_concept"
						suggestionValues="#{accountingCollections.conceptsDescriptions}"
						value="#{salaryAccounting.concept}" required="true"
						maxlength="32" width="130"
						directInputSuggestions="true"
						label="#{bundle.aon_concept}"
						inputClass="aon-inputText"
						buttonDisabledStyle="display:none;"
						buttonInactiveStyle="display:none;"
						buttonStyle="display:none;">
					</rich:comboBox>
					
					<aon:outputLabel for="SalaryAccounting__registryBank"
						value="#{bundle.aon_bank_account}" />
					<aon:selectOneMenu id="SalaryAccounting__registryBank"
						value="#{salaryAccounting.registryBank}">
						<f:selectItem itemLabel="#{bundle.accounting_pending_salary}" value="#{null}" />
						<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</aon:div>
		</aon:form>
 		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
