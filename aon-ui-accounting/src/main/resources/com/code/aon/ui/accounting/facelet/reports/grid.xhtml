<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="reportAttachList">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
				<ui:param name="toolbarId" value="reportAttachToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.accounting_reports_module}" />
				<ui:param name="controller" value="#{reportAttach}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/faces/attachment/grid.xhtml">
					<ui:param name="controller" value="#{reportAttach}" />
					<ui:param name="skipCategoryColumn" value="#{true}" />

					<ui:param name="resetButtonReRender" value="reportAttachToolbar" />
					<ui:param name="rowSelectorReRender" value="reportAttachToolbar" />
					<ui:param name="newSaveButtonReRender" value="reportAttachToolbar" />
					<ui:param name="newCancelButtonReRender" value="reportAttachToolbar" />
					<ui:param name="saveButtonReRender" value="reportAttachToolbar" />
					<ui:param name="cancelButtonReRender" value="reportAttachToolbar" />
					<ui:param name="removeButtonReRender" value="reportAttachToolbar" />

					<ui:define name="additionalColumns">

						<aon:column
							alias="#{controller.pojoShortName}.registryAttachmentType"
							styleClass="aon-editDataTable-textColumn aon-width-120">
							<f:facet name="header">
								<aon:outputLabel for="#{controller.beanName}_type"
									value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.registryAttachmentType}"
								rendered="#{formList}" />
							<aon:selectOneMenu required="true" id="#{controller.beanName}_type"
								value="#{controller.to.registryAttachmentType}" rendered="#{formEdit}">
								<f:selectItem itemValue="#{null}" itemLabel="-"/>
								<f:selectItems value="#{accountingCollections.templateTypes}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu required="true" id="#{controller.beanName}_type-New"
									value="#{controller.to.registryAttachmentType}" rendered="#{formNew}">
									<f:selectItem itemValue="#{null}" itemLabel="-"/>
									<f:selectItems value="#{accountingCollections.templateTypes}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>

						<aon:if test="#{aonRole.confidentiality}">
							<aon:column
								styleClass="aon-editDataTable-numberColumn aon-width-20">
								<f:facet name="header">
									<aon:outputText value="&#160;"
										title="#{bundle.aon_confidential}"
										styleClass="aon-icon-confidential" style="padding-left:15px" />
								</f:facet>
								<aon:outputText value="&#160;" rendered="#{formList}"
									styleClass="#{to.confidential?'aon-icon-checked':'aon-icon-check'}"
									style="padding-left:20px" />
								<aon:selectBooleanCheckbox
									id="#{controller.beanName}_securityLevel"
									value="#{controller.to.confidential}" rendered="#{formEdit}" />
								<f:facet name="footer">
									<aon:selectBooleanCheckbox
										id="#{controller.beanName}_securityLevel-New"
										value="#{controller.to.confidential}" rendered="#{formNew}" />
								</f:facet>
							</aon:column>
						</aon:if>

						<aon:column alias="#{controller.pojoShortName}.attachDate"
							styleClass="aon-editDataTable-textColumn aon-width-120">
							<f:facet name="header">
								<aon:outputLabel for="#{controller.beanName}_attachDate"
									value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.attachDate}" rendered="#{formList}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate id="#{controller.beanName}_attachDate"
								popupDateFormat="#{bundle.aon_date_pattern}"
								rendered="#{formEdit}" value="#{controller.to.attachDate}" />
							<f:facet name="footer">
								<aon:selectInputDate id="#{controller.beanName}_attachDate-New"
									popupDateFormat="#{bundle.aon_date_pattern}"
									rendered="#{formNew}" value="#{controller.to.attachDate}" />
							</f:facet>
						</aon:column>
					</ui:define>

					<ui:define name="additionalDataTableContent">
						<aon:div styleClass="aon-margin-top">
							<aon:outputText style="#{documentManager.freeSpaceStyle}"
								value="#{documentManager.freeSpaceMessage}" />
						</aon:div>
					</ui:define>

				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
