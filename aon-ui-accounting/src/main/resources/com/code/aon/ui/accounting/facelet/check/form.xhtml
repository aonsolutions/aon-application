<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="checkForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_check_balance_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_form}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="execute" 
						value="EJECUTAR"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"
						actionListener="#{accountCheck.onExecute}"
						action="check_list" 
						/>
				</ui:define>
			</ui:decorate>
			
		<aon:div>
			
			<aon:panel style="width:50%; margin:20px 2.5%;">
				<f:facet name="header">
					<aon:outputText value="CHEQUEO DE APUNTES" />
		        </f:facet>

				<aon:outputLabel for="accountPeriod"
					value="#{accountingBundle.accounting_period}" />
				<aon:selectOneMenu reRender="SearchButton" ajaxSingle="true" required="true"
					id="accountPeriod" value="#{accountCheck.period}">
					<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
					<f:selectItems value="#{accountingCollections.accountPeriods}" />
				</aon:selectOneMenu>
			
				<aon:panelGrid columns="2" style="width:90%; margin:10px auto;">
					<aon:selectBooleanCheckbox id="emptyAccountEntry"
						 value="#{accountCheck.emptyAccountEntryCheck}"/>
					<aon:outputLabel for="emptyAccountEntry"
						value="#{accountingBundle.accounting_check_empty_accountEntry}" />
						
			        <aon:selectBooleanCheckbox id="unbalancedAccount"
						 value="#{accountCheck.unbalancedAccountEntryCheck}"/>
					<aon:outputLabel for="unbalancedAccount"
						value="#{accountingBundle.accounting_check_unbalanced_accounEntry}" />
				</aon:panelGrid>
					
			</aon:panel>
			
			<aon:panel style="width:50%; margin:20px 2.5%;">
				<f:facet name="header">
					<aon:outputText value="CHEQUEO DE CUENTAS" />
		        </f:facet>

				<aon:panelGrid columns="2" style="width:90%; margin:10px auto;">
			        <aon:selectBooleanCheckbox id="entryEnabled"
						 value="#{accountCheck.accountEntryEnabledCheck}"/>
			        <aon:outputLabel for="entryEnabled"
						value="#{accountingBundle.accounting_check_accountEntry_enabled}" />
					
			        <aon:selectBooleanCheckbox id="parentEntry"
						 value="#{accountCheck.parentEntryCheck}"/>
			        <aon:outputLabel for="parentEntry"
						value="#{accountingBundle.accounting_check_parentEntry}" />
			    </aon:panelGrid>
			
			</aon:panel>
		</aon:div>

		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>

</ui:composition>
