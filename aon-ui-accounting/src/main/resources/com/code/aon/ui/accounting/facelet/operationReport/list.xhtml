<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountEntryReportList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.account_expenses_incomes_report}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener"
						value="#{operationReport.onReset}" type="actionListener" />
					<aon:methodParam name="searchAction" value="operationReport_search" />
				</ui:define>
				
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="operationReport-excel-report"
						value="&#160;" target="_blank" action="#{operationReport.onExcel}"
						title="#{bundle.aon_listing} MS Excel"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="operationReport-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}" action="#{report.onExecute}">
						<f:param name="reportKey" value="operationReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{operationReport.detailState}" />
					<ui:param name="skipSelectButton" value="true" />
					<ui:param name="rowSelectorToggleOnClick" value="false" />
 			
					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-50" style="font-size: 0.9em;vertical-align: top;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" rendered="#{!to.repeated}"/>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-70" style="font-size: 0.9em;vertical-align: top;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.entryDate}" rendered="#{!to.repeated}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-width-auto" style="font-size: 0.9em;vertical-align: top;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_concept}" />
							</f:facet>
							<aon:outputText value="#{to.account}">
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-width-200" style="font-size: 0.9em;vertical-align: top;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_concept}" />
							</f:facet>
							<aon:outputText value="#{to.concept}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;vertical-align: top;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{to.balance}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-width-100" style="font-size: 0.9em;vertical-align: top;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.account_document_number}" />
							</f:facet>
							<aon:outputText value="#{to.documentNumber}" rendered="#{!to.repeated}"/>
						</aon:column>
						
						<aon:column styleClass="aon-width-300" style="font-size: 0.9em;vertical-align: top;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_supplier}/#{bundle.aon_creditor}" />
							</f:facet>
							<aon:outputText value="#{to.invoiceRegistry}" rendered="#{!to.repeated}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>
						
						<aon:column styleClass="aon-width-200">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_type}" />
							</f:facet>
							
							<aon:dataTable value="#{to.taxes}" var="tot" styleClass="aon-noborder"
								style="background-color:inherit;"
								rowClasses="aon-noborder,aon-noborder"
								columnClasses="aon-noborder
												,aon-noborder
												,aon-noborder
												,aon-noborder">
								<aon:column styleClass="aon-width-30" style="font-size: 0.9em;vertical-align: top;">
									<aon:outputText value="#{tot.taxType}" />
								</aon:column>
						
								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;vertical-align: top;">
									<aon:outputText value="#{tot.base}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:column>
								
								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-50" style="font-size: 0.9em;vertical-align: top;">
									<aon:outputText value="#{tot.percentage}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
									<c:if test="#{not empty tot.surchargePercentage and tot.surchargePercentage!=0}">
										<aon:outputText value="+"/>
										<aon:outputText value="#{tot.surchargePercentage}">
											<f:convertNumber pattern="#,##0.00" />
										</aon:outputText>
									</c:if>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;vertical-align: top;">
									<aon:outputText value="#{tot.quota}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;vertical-align: top;">
									<aon:outputText value="#{tot.surchargeQuota}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;vertical-align: top;">
									<aon:outputText value="#{tot.quota + tot.surchargeQuota}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:column>
							</aon:dataTable>
						</aon:column>

					</ui:define>
					
				</ui:decorate>
 			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
