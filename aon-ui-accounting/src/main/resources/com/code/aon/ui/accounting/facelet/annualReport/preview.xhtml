<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:c="http://java.sun.com/jstl/core"			
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
<f:view>
<head>
	<title></title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="Expires" content="0" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Cache-Control" content="no-store" />
	<c:forEach items="#{aonConfiguration.styleSheets}" var="styleSheet">
		<a4j:loadStyle src="#{styleSheet}"/>
	</c:forEach>

	<!-- Necesario si se pone el LoadScriptStrategy a ALL -->
	<a4j:loadScript src="#{aonResource.resolve['/com/code/aon/faces/component/richfaces/rowSelector/rowSelector.js']}"/>
	
	<a4j:loadScript src="#{aonResource.resolveLocal['/js/richFaces.js']}"/>
	<link rel="shortcut icon" type="image/x-icon" href="#{facesContext.externalContext.requestContextPath}/#{aonResource.resolve['/images/favicon.ico']}" />
</head>
<body>
	<aon:div styleClass="aon-margin-top" style="width: 95%; padding-left:20px;">
		 <c:forEach var="to" items="${annualReportDetail.model.wrappedData}">
				<h:outputText value="#{to.beforeContent}" escape="false"/>
				<c:if test="#{to.content != null}">
					<aon:div style="#{to.cssStyle}">
						<h:outputText value="#{to.contentResolved}" escape="false"/>
					</aon:div>
				</c:if>
				<h:outputText value="#{to.afterContent}" escape="false"/>
		 </c:forEach>
	</aon:div>
</body>
</f:view>
</html>
