<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="amortizationForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.accounting_period_amortization_module}" />
				<ui:param name="controller" value="#{periodAmortization}" />
				
				<ui:param name="skipResetButton" value="true" />				
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{periodAmortization.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="periodAmortization_list" />				
					<ui:param name="skipAfterSearch" value="true" />
					
					<aon:outputLabel for="Amortization_period"
						value="#{bundle.aon_financial_year}" />
					<aon:selectOneMenu id="Amortization_period" required="true" 
						value="#{periodAmortization.period}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
						<a4j:support event="onchange" actionListener="#{periodAmortization.onPeriodChanged}" 
							reRender="date-search" ajaxSingle="true" />
					</aon:selectOneMenu>

					<aon:outputText value="#{bundle.aon_date_select}" />
					<aon:div id="date-search">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-From"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate
							id="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{periodAmortization.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
				
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-To"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate
							id="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{periodAmortization.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>
					
					<aon:outputText value="#{bundle.aon_status}" />
					<aon:div id="statuc-div">
						<aon:selectBooleanCheckbox id="pendingStatus" value="#{periodAmortization.pendingStatus}"/>
						<aon:outputLabel for="pendingStatus" value="Pendientes" />
						
						<aon:selectBooleanCheckbox id="scoredStatus" value="#{periodAmortization.scoredStatus}"/>
						<aon:outputLabel for="scoredStatus" value="Contabilizados" />
						
						<aon:selectBooleanCheckbox id="blockedStatus" value="#{periodAmortization.blockedStatus}"/>
						<aon:outputLabel for="blockedStatus" value="Bloqueados" />
					
					</aon:div>
								
					<aon:outputLabel for="Amortization_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Amortization_Detail_Amortizationi_Description" size="50"
						value="#{periodAmortization.description}" />
								
					<aon:outputText value="#{bundle.accounting_fixed_asset_account}" />
					<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupTo" value="#{periodAmortization.fixedAssetAccount}" />
						<ui:param name="idRequired" value="false" />
						<ui:param name="lookupSuffix" value="fixedAsset" />
					</ui:include>
					
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{accountLookup}" />		
	</ui:define>
</ui:composition>
