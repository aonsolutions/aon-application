# CLIENTES
CustomerLoaderFactory=Clientes
CustomerLoaderFactory_id=Identificador único del cliente. Este dato no se carga en la base de datos. Es válido para, cuando se cargue más de una entidad, referirse a este cliente. Por ejemplo si aparte de CLI se carga FRA, la columna idTitular de FRA tendría el mismo valor para una factura de ventas de este cliente. 
CustomerLoaderFactory_razonSocial=Razón social o nombre del cliente.
CustomerLoaderFactory_alias=Alias del cliente. Dato informativo de la ficha de cliente.
CustomerLoaderFactory_tipoDocumento=Tipo del documento identificativo del cliente.
CustomerLoaderFactory_paisDocumento=Pais de expedición del documento. Será un valor válido según el código estándar <a href="http://es.wikipedia.org/wiki/ISO_3166-1" target="_blank">ISO 3166-1</a>.
CustomerLoaderFactory_documento=Documento identificativo del cliente (número de DNI, NIF, etc ...)
CustomerLoaderFactory_nacionalidad=Nacionalidad del cliente. Será un valor válido según el código estándar <a href="http://es.wikipedia.org/wiki/ISO_3166-1" target="_blank">ISO 3166-1</a>.
CustomerLoaderFactory_cuenta=Código de cuenta contable. <b>Obligatoriamente debe tener nueve caracteres numéricos.</b>
CustomerLoaderFactory_re=Inscrito en el régimen de recargo de equivalencia.
CustomerLoaderFactory_transaccion=Tipo de transacción. 
CustomerLoaderFactory_retencion=Indica si se ha de aplicar retención (I.R.P.F.) al cliente.
CustomerLoaderFactory_facturarAlbaranesAgrupados=Cuando se facturen albaranes, si se deben agrupar en una única factura.
CustomerLoaderFactory_tipoVia=Abreviatura del tipo de vía. <a href="#tipo_via"> Consulte anexo.</a>
CustomerLoaderFactory_direccion=Nombre de la calle, via, plaza, etc ...
CustomerLoaderFactory_numero=Número de la calle, via, plaza, etc ...
CustomerLoaderFactory_direccion2=Complementos de la dirección.
CustomerLoaderFactory_direccion3=Complementos de la dirección.
CustomerLoaderFactory_cp=Código postal.
CustomerLoaderFactory_ciudad=Ciudad.
CustomerLoaderFactory_provincia=Código de provincia.
CustomerLoaderFactory_nombreProvincia=Nombre de la provincia.
CustomerLoaderFactory_pais=Pais. Será un valor válido según el código estándar <a href="http://es.wikipedia.org/wiki/ISO_3166-1" target="_blank">ISO 3166-1</a>.
CustomerLoaderFactory_telefono1=Primer teléfono.
CustomerLoaderFactory_telefono2=Segundo teléfono.
CustomerLoaderFactory_fax=Fax.
CustomerLoaderFactory_email=Dirección de correo electrónico.
CustomerLoaderFactory_web=Dirección de la página web.
CustomerLoaderFactory_banco=Nombre del banco del cliente.
CustomerLoaderFactory_cuentaBanco=IBAN completo sin formato, o bien CCC sin formato o en formato "XXXX.XXXX.XX.XXXXXXXXXX".
CustomerLoaderFactory_formaPago=Forma de Pago.
CustomerLoaderFactory_numeroVtos=Número de vencimientos, para la generación automática de vencimientos.
CustomerLoaderFactory_diasAlPrimerVto=Dias al primer vencimiento, para la generación automática de vencimientos.
CustomerLoaderFactory_diasEntreVtos=Dias entre vencimientos, para la generación automática de vencimientos.
CustomerLoaderFactory_diasPago=Dias de pago, para la generación automática de vencimientos. Formato "XX XX XX".
CustomerLoaderFactory_segmento=Segmento, para realizar la segmentación de clientes.

