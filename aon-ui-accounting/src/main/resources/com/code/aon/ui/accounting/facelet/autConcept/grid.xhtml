<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="autConceptList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_aut_concept_module}" />
					<ui:param name="controller" value="#{autConcept}" />
				</ui:include>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{autConcept}" />
						<ui:param name="columnClasses" value="aon-editDataTable-text" />

						<ui:define name="columns">
							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}"
									id="autConcept_description-LABEL"
									rendered="#{to.id!=autConcept.to.id}" />
								<aon:inputText rendered="#{to.id==autConcept.to.id}" size="32"
									value="#{autConcept.to.description}" required="true" />

								<f:facet name="footer">
									<aon:div id="autConcept_description-NEW-DIV">
										<aon:inputText rendered="#{autConcept.new}" size="32"
											value="#{autConcept.to.description}" required="true" />
									</aon:div>
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
