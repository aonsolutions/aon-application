<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:editDataTable id="AmortizationDetailsList" var="to" rows="0"
		value="#{amortizationDetail.model}">

		<f:facet name="header">
			<rich:columnGroup>
				<aon:column styleClass="aon-dataTable-header" colspan="4">
					<aon:outputText value="&#160;" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header" colspan="3">
					<aon:outputText
						value="#{accountingBundle.accounting_account_amortization}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header" colspan="3">
					<aon:outputText
						value="#{accountingBundle.accounting_fiscal_amortization}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="&#160;" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="&#160;" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="&#160;" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="&#160;" />
				</aon:column>
			</rich:columnGroup>
		</f:facet>

		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton actionListener="#{amortizationDetail.onSelect}"
				rendered="#{to!=amortizationDetail.to}"
				styleClass="aon-editDataTable-button aon-icon-rowSelector" />
			<f:facet name="footer">
					<aon:commandButton id="amortizationDetail-reset"
						title="#{bundle.aon_reset}" 
						actionListener="#{amortizationDetail.onReset}" 
						rendered="#{!amortizationDetail.new}"
						styleClass="aon-editDataTable-button aon-icon-reset"/>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputLabel for="AmortizationDetail_fromDate" value="#{bundle.aon_date_from}" />
			</f:facet>
			<aon:outputText value="#{to.fromDate}">
				<f:convertDateTime type="date" pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
			<f:facet name="footer">
				<aon:div styleClass="aon-nowrap">
					<aon:selectInputDate id="AmortizationDetail_fromDate"
						rendered="#{amortizationDetail.new}" required="true"
						value="#{amortizationDetail.to.fromDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputLabel for="AmortizationDetail_toDate" value="#{bundle.aon_date_to}" />
			</f:facet>
			<aon:outputText value="#{to.toDate}">
				<f:convertDateTime type="date" pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
			<f:facet name="footer">
				<aon:div styleClass="aon-nowrap">
					<aon:selectInputDate id="AmortizationDetail_toDate"
						rendered="#{amortizationDetail.new}" required="true"
						value="#{amortizationDetail.to.toDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="%" />
			</f:facet>
			<aon:outputText value="#{to.coefficient}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
			<aon:outputText value="%" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputLabel for="AmortizationDetail_allocation" value="#{bundle.accounting_amortization_dotacion}" />
			</f:facet>
			<aon:inputText id="AmortizationDetail_allocation"
				rendered="#{amortizationDetail.to == to and to.updatable}"
				required="true" value="#{to.allocation}" size="8">
			</aon:inputText>
			<aon:outputText
				rendered="#{amortizationDetail.to != to or !to.updatable}"
				value="#{to.allocation}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
			<f:facet name="footer">
				<aon:inputText id="AmortizationDetail_allocation-New"
					rendered="#{amortizationDetail.new}"
					required="true" value="#{amortizationDetail.to.allocation}" size="8">
				</aon:inputText>
			</f:facet>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.account_accumulated}" />
			</f:facet>
			<aon:outputText value="#{to.accumulated}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_pending}" />
			</f:facet>
			<aon:outputText value="#{to.pending}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputLabel for="AmortizationDetail_fiscalAllocation" value="#{bundle.accounting_amortization_dotacion}" />
			</f:facet>
			<aon:inputText id="AmortizationDetail_fiscalAllocation"
				rendered="#{amortizationDetail.to == to}"
				required="true" value="#{to.fiscalAllocation}" size="8">
			</aon:inputText>
			<aon:outputText rendered="#{amortizationDetail.to != to}"
				value="#{to.fiscalAllocation}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
			<f:facet name="footer">
				<aon:inputText id="AmortizationDetail_fiscalAllocation-New"
					rendered="#{amortizationDetail.new}"
					required="true" value="#{amortizationDetail.to.fiscalAllocation}" size="8">
				</aon:inputText>
			</f:facet>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.account_accumulated}" />
			</f:facet>
			<aon:outputText value="#{to.fiscalAccumulated}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_pending}" />
			</f:facet>
			<aon:outputText value="#{to.fiscalPending}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.accounting_tax_adjust}" />
			</f:facet>
			<aon:outputText value="#{to.taxAdjust}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_status}" />
			</f:facet>
			<aon:outputText value="#{to.status}"
				rendered="#{amortizationDetail.to != to or to.scored}" />
			<aon:selectOneMenu
				rendered="#{amortizationDetail.to == to and !to.scored}"
				value="#{to.status}">
				<f:selectItem itemLabel="#{bundle.aon_pending}"
					itemValue="#{amortizationDetail.pendingStatus}" />
				<f:selectItem itemLabel="#{bundle.aon_blocked}"
					itemValue="#{amortizationDetail.blockedStatus}" />
			</aon:selectOneMenu>

		</aon:column>

		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.account_account_entry}" />
			</f:facet>
			<aon:commandButton actionListener="#{amortizationDetail.onUnrecord}"
				title="#{accountingBundle.accounting_unrecord}"
				rendered="#{amortizationDetail.to == to and to.scored}"
				reRender="amortizationForm"
				onclick="if (!confirm('#{accountingBundle.accounting_unrecord}?')) return false;"
				styleClass="aon-editDataTable-button aon-icon-task-liberate" />
			<aon:commandButton actionListener="#{amortizationDetail.onRecord}"
				title="#{accountingBundle.accounting_record}"
				rendered="#{amortizationDetail.to == to and !to.scored}"
				reRender="amortizationForm"
				onclick="if (!confirm('#{accountingBundle.accounting_record}?')) return false;"
				styleClass="aon-editDataTable-button aon-icon-task-assume" />
			<aon:commandLink id="accountEntry-search" 
				immediate="true" styleClass="aon-dataTable-link"
				rendered="#{amortizationDetail.to != to and to.scored}"
				title="#{accountingBundle.accounting_lookup_account_entry}"
				actionListener="#{amortizationDetail.onAccountEntry}"
				action="accountEntry_form"
				reRender="aonContent">
				<aon:outputText value="#{accounting.accounting_account_entry}" />
			</aon:commandLink>
		</aon:column>

		<aon:column
			styleClass="aon-editDataTable-buttonsColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:div>
				<aon:outputText value="&#160;" />
				<aon:commandButton id="amortizationDetailTable-save"
					title="#{bundle.aon_accept} (ALT+#{bundle.aon_key_save_line})"
					actionListener="#{amortizationDetail.onAccept}"
					rendered="#{to==amortizationDetail.to}"
					reRender="amortizationForm"
					styleClass="aon-editDataTable-button aon-icon-accept"
					focus="accountId" accesskey="#{bundle.aon_key_save_line}" />
				<aon:commandButton id="amortizationDetailTable-cancel"
					title="#{bundle.aon_cancel} (ALT+#{bundle.aon_key_cancel_line})"
					actionListener="#{amortizationDetail.onCancel}" immediate="true"
					rendered="#{to==amortizationDetail.to}"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					accesskey="#{bundle.aon_key_cancel_line}" />
				<aon:commandButton id="amortizationDetailTable-remove"
					title="#{bundle.aon_remove} (ALT+#{bundle.aon_key_remove_line})"
					immediate="true" rendered="#{to==amortizationDetail.to and to.updatable}"
					reRender="amortizationForm"
					onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
					actionListener="#{amortizationDetail.onRemove}"
					styleClass="aon-editDataTable-button aon-icon-delete"
					accesskey="#{bundle.aon_key_remove_line}" />
			</aon:div>
			<f:facet name="footer">
				<aon:div styleClass="aon-nowrap">
					<aon:commandButton id="amortizationDetailTable-save-New"
						title="#{bundle.aon_accept} (ALT+#{bundle.aon_key_save_line})"
						actionListener="#{amortizationDetail.onAccept}"
						rendered="#{amortizationDetail.new}"
						reRender="amortizationForm"
						styleClass="aon-editDataTable-button aon-icon-accept"
						focus="accountId" accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton id="amortizationDetailTable-cancel-New"
						title="#{bundle.aon_cancel} (ALT+#{bundle.aon_key_cancel_line})"
						actionListener="#{amortizationDetail.onCancel}" immediate="true"
						rendered="#{amortizationDetail.new}"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel_line}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</aon:editDataTable>
	
</ui:composition>
