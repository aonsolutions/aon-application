<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:editDataTable id="AmortizationDetailsList" var="to" rows="0"
		value="#{amortizationDetail.calculatedModel}">

		<f:facet name="header">
			<rich:columnGroup>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="&#160;" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="#{bundle.aon_date_from}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="#{bundle.aon_date_to}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="#{bundle.aon_percentage}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header" colspan="3">
					<aon:outputText
						value="#{accountingBundle.accounting_account_amortization}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header" colspan="3">
					<aon:outputText
						value="#{accountingBundle.accounting_fiscal_amortization}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="#{accountingBundle.accounting_tax_adjust}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="#{bundle.aon_status}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText
						value="#{accountingBundle.accounting_account_entry}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="&#160;" />
				</aon:column>
			</rich:columnGroup>
		</f:facet>

		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton actionListener="#{amortizationDetail.onSelect}"
				rendered="#{to!=amortizationDetail.to}"
				styleClass="aon-editDataTable-button aon-icon-rowSelector" />
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="#{to.fromDate}">
				<f:convertDateTime type="date" pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="#{to.toDate}">
				<f:convertDateTime type="date" pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="#{to.coefficient}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
			<aon:outputText value="%" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_allocation}" />
			</f:facet>
			<aon:inputText
				rendered="#{amortizationDetail.to == to and to.updatable}"
				required="true" value="#{to.allocation}" size="8">
			</aon:inputText>
			<aon:outputText
				rendered="#{amortizationDetail.to != to or !to.updatable}"
				value="#{to.allocation}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_accumulated}" />
			</f:facet>
			<aon:outputText value="#{to.accumulated}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_pending}" />
			</f:facet>
			<aon:outputText value="#{to.pending}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_allocation}" />
			</f:facet>
			<aon:inputText rendered="#{amortizationDetail.to == to}"
				required="true" value="#{to.fiscalAllocation}" size="8">
			</aon:inputText>
			<aon:outputText rendered="#{amortizationDetail.to != to}"
				value="#{to.fiscalAllocation}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_accumulated}" />
			</f:facet>
			<aon:outputText value="#{to.fiscalAccumulated}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_pending}" />
			</f:facet>
			<aon:outputText value="#{to.fiscalPending}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="#{to.taxAdjust}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="#{to.status}"
				rendered="#{amortizationDetail.to != to or to.scored}" />
			<aon:selectOneMenu
				rendered="#{amortizationDetail.to == to and !to.scored}"
				value="#{to.status}">
				<f:selectItem itemLabel="#{accountingBundle.accounting_pending}"
					itemValue="#{amortizationDetail.pendingStatus}" />
				<f:selectItem itemLabel="#{accountingBundle.accounting_blocked}"
					itemValue="#{amortizationDetail.blockedStatus}" />
			</aon:selectOneMenu>

		</aon:column>

		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton actionListener="#{amortizationDetail.onUnrecord}"
				title="#{accountingBundle.accounting_unrecord}"
				rendered="#{amortizationDetail.to == to and to.scored}"
				onclick="if (!confirm('#{accountingBundle.accounting_unrecord}?')) return false;"
				styleClass="aon-editDataTable-button aon-icon-task-liberate" />
			<aon:commandButton actionListener="#{amortizationDetail.onRecord}"
				title="#{accountingBundle.accounting_record}"
				rendered="#{amortizationDetail.to == to and !to.scored}"
				onclick="if (!confirm('#{accountingBundle.accounting_record}?')) return false;"
				styleClass="aon-editDataTable-button aon-icon-task-assume" />
			<h:commandLink immediate="true" styleClass="aon-dataTable-link"
				rendered="#{amortizationDetail.to != to and to.scored}"
				title="#{accountingBundle.accounting_lookup_account_entry}"
				actionListener="#{amortizationDetail.onAccountEntry}"
				action="accountEntry_form">
				<aon:outputText 
					value="#{to.accountEntry.accountPeriod}/#{to.accountEntry.id}" />
			</h:commandLink>
		</aon:column>

		<aon:column
			styleClass="aon-editDataTable-buttonsColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:div>
				<aon:outputText value="&#160;" />
				<aon:commandButton id="amortizationDetailTable-save"
					title="#{bundle.aon_accept} (ALT+#{bundle.aon_key_save_line})"
					actionListener="#{amortizationDetail.onAccept}"
					rendered="#{to==amortizationDetail.to}"
					reRender="amortizationToolbar,AmortizationData"
					styleClass="aon-editDataTable-button aon-icon-accept"
					focus="accountId" accesskey="#{bundle.aon_key_save_line}" />
				<aon:commandButton id="amortizationDetailTable-cancel"
					title="#{bundle.aon_cancel} (ALT+#{bundle.aon_key_cancel_line})"
					actionListener="#{amortizationDetail.onCancel}" immediate="true"
					rendered="#{to==amortizationDetail.to}"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					accesskey="#{bundle.aon_key_cancel_line}" />
				<aon:commandButton id="amortizationDetailTable-remove"
					title="#{bundle.aon_remove} (ALT+#{bundle.aon_key_remove_line})"
					immediate="true" rendered="#{to==amortizationDetail.to}"
					onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
					actionListener="#{amortizationDetail.onRemove}"
					styleClass="aon-editDataTable-button aon-icon-delete"
					accesskey="#{bundle.aon_key_remove_line}" />
			</aon:div>
		</aon:column>
	</aon:editDataTable>
	
</ui:composition>
