<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
		<ui:define name="searchContent">
			<ui:param name="skipSearchButton" value="true" />

			<aon:outputLabel for="reportDate"
				value="#{accountingBundle.accounting_report_date}" />
			<aon:selectInputDate id="reportDate"
				value="#{trialBalance.parameters.date}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />

			<aon:outputLabel for="accountPeriod"
				value="#{accountingBundle.accounting_period}" />
			<aon:selectOneMenu id="accountPeriod" ajaxSingle="true"
				reRender="entryDate-From,entryDate-To,SearchButton,SearchWarning"
				valueChangeListener="#{trialBalance.onPeriodChanged}"
				value="#{trialBalance.parameters.period}">
				<f:selectItem itemLabel="-" itemValue="" />
				<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="Account_id"
				value="#{accountBundle.account_account}" />
			<aon:div id="links">
				<aon:inputText id="Account_id"
					value="#{trialBalance.parameters.accountExpression}" size="14" />
				<aon:commandLink value="#{accountingBundle.accounting_treasury}" reRender="Account_id" tabindex="1000"
					styleClass="aon-margin-left aon-dataTable-link-simple aon-italic">
					<a4j:actionparam value="57*" assignTo="#{trialBalance.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink value="#{accountingBundle.accounting_banks}" reRender="Account_id" tabindex="1001"  
					styleClass="aon-dataTable-link-simple aon-italic" >
					<a4j:actionparam value="572*" assignTo="#{trialBalance.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink value="#{accountingBundle.accounting_cash}" reRender="Account_id" tabindex="1002"  
					styleClass="aon-dataTable-link-simple aon-italic" >
					<a4j:actionparam value="570*" assignTo="#{trialBalance.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink value="#{accountingBundle.accounting_publicAdmon}" reRender="Account_id" tabindex="1003"  
					styleClass="aon-dataTable-link-simple aon-italic">
					<a4j:actionparam value="47*" assignTo="#{trialBalance.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink value="#{accountingBundle.accounting_customer}" reRender="Account_id" tabindex="1004"  
					styleClass="aon-dataTable-link-simple aon-italic" >
					<a4j:actionparam value="430*" assignTo="#{trialBalance.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink value="#{accountingBundle.accounting_supplier}" reRender="Account_id" tabindex="1005"  
					styleClass="aon-dataTable-link-simple aon-italic">
					<a4j:actionparam value="400*" assignTo="#{trialBalance.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink value="#{accountingBundle.accounting_creditor}" reRender="Account_id" tabindex="1006"  
					styleClass="aon-dataTable-link-simple aon-italic">
					<a4j:actionparam value="410*" assignTo="#{trialBalance.parameters.accountExpression}"/>
				</aon:commandLink>
			</aon:div>

			<aon:outputLabel for="Account_Description"
				value="#{bundle.aon_description}" />
			<aon:inputText id="Account_Description" size="50"
				value="#{trialBalance.parameters.accountDescription}" />

			<aon:outputLabel for="Account_Alias" value="#{bundle.aon_alias}" />
			<aon:inputText id="Account_Alias"
				value="#{trialBalance.parameters.accountAlias}" size="30" />

			<aon:outputText value="#{bundle.aon_date_select}" />
			<aon:div>
				<aon:selectOneMenu
					id="AccountEntryDetail_accountEntry_quarter"
					value="#{trialBalance.parameters.quarter}"
					valueChangeListener="#{trialBalance.onQuarterChanged}"
					reRender="entryDate-From,entryDate-To" ajaxSingle="true">
					<f:selectItem itemValue="#{null}" itemLabel="-" />
					<f:selectItems value="#{accountingCollections.quarters}" />
				</aon:selectOneMenu>

				<aon:outputLabel
					for="entryDate-From"
					styleClass="aon-form-date-label aon-margin-left aon-margin-right"
					value="#{bundle.aon_date_from}" />
				<aon:selectInputDate id="entryDate-From"
					value="#{trialBalance.parameters.fromDate}"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
					<a4j:support event="oninputchange"
						reRender="SearchButton,SearchWarning" ajaxSingle="true" />
					<a4j:support event="onchanged"
						reRender="SearchButton,SearchWarning" ajaxSingle="true" />
				</aon:selectInputDate>

				<aon:outputLabel for="entryDate-To"
					styleClass="aon-form-date-label aon-margin-left aon-margin-right"
					value="#{bundle.aon_date_to}" />
				<aon:selectInputDate id="entryDate-To"
					value="#{trialBalance.parameters.toDate}"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
					<a4j:support event="oninputchange"
						reRender="SearchButton,SearchWarning" ajaxSingle="true" />
					<a4j:support event="onchanged"
						reRender="SearchButton,SearchWarning" ajaxSingle="true" />
				</aon:selectInputDate>
			</aon:div>

			<c:if test="#{aonRole.confidentiality}">
				<aon:outputLabel for="securityLevel"
					value="#{bundle.aon_confidential}" />
				<aon:selectOneRadio id="securityLevel"
					value="#{trialBalance.parameters.securityLevel}">
					<f:selectItems value="#{commonCollections.confidentialValues}" />
				</aon:selectOneRadio>
			</c:if>

			<aon:outputLabel for="Account_level"
				value="#{accountingBundle.accounting_level}" />
			<aon:div>
				<aon:selectOneRadio id="Account_level" ajaxSingle="true"
					reRender="AccountEntryDetail_rowsPerPage_label, AccountEntryDetail_rowsPerPage"
					value="#{trialBalance.parameters.accountLevel}">
					<f:selectItem itemLabel="1" itemValue="1" />
					<f:selectItem itemLabel="2" itemValue="2" />
					<f:selectItem itemLabel="3" itemValue="3" />
					<f:selectItem itemLabel="4" itemValue="4" />
					<f:selectItem itemLabel="5" itemValue="5" />
				</aon:selectOneRadio>
			</aon:div>

			<aon:outputText value="&#160;" />
			<aon:div>
				<aon:selectBooleanCheckbox id="Account_zero_sum"
					value="#{trialBalance.parameters.noTouchedAccountVisible}" />
				<aon:outputLabel for="Account_zero_sum"
					value="#{accountingBundle.accounting_no_touched_account}" />
			</aon:div>

			<aon:outputText value="" />
			<aon:div id="SearchWarning">
				<aon:outputText
					value="#{accountingBundle.accounting_statement_warning}"
					style="color:red;" styleClass="aon-bold"
					rendered="#{!trialBalance.dateValid}" />
			</aon:div>

			<aon:outputText value="" />
			<aon:div styleClass="aon-search-commandButton-left">
				<aon:div styleClass="aon-search-commandButton-right">
					<aon:commandButton id="SearchButton" value="#{bundle.aon_search}"
						action="account_statement_account_list"
						actionListener="#{trialBalance.onSearch}"
						disabled="#{!trialBalance.dateValid}" reRender="#{searchReRender}"
						accesskey="#{bundle.aon_key_search}">
						<aon:actionHotKey key="return" />
					</aon:commandButton>
				</aon:div>
			</aon:div>

		</ui:define>
	</ui:decorate>
</ui:composition>
