<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="balanceForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_balance_menu}" />
				<ui:param name="controller" value="#{balance}" />
				
				<ui:param name="skipRemoveButton" value="#{!balance.new and !balance.to.removable}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="defaults" value="CARGAR VALORES DEFECTO"
						actionListener="#{balance.onLoadDefaults}"
						onclick="if (!confirm('Desea borrar el balance seleccionado y cargar los valores por defecto del mismo?')){ return false;} else {Richfaces.showModalPanel('waitProccess')}"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"
						rendered="#{!balance.new and !balance.to.removable}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh"
						immediate="true" />
				</ui:define>
				
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="&#160;" target="_blank"
						action="#{report.onExecute}"
						title="#{bundle.aon_listing} MS Excel"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="balanceDetailList" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="balanceDetailList" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" dir="true" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-150,
								   aon-panelGrid-even aon-width-auto,
								   aon-panelGrid-odd aon-width-150,
								   aon-panelGrid-even aon-width-auto"
					
					style="margin-bottom=2px;">
					<aon:outputLabel for="Balance_Id" 
						value="#{accountingBundle.accounting_balance_cdg}" />
					<aon:inputText id="Balance_Id" value="#{balance.to.id}" disabled="true" size="10"
						maxlength="8" />

					<aon:outputLabel for="Balance_Name"
						value="#{accountingBundle.accounting_balance_name}" />
					<aon:inputText id="Balance_Name"
						value="#{balance.to.name}" required="true" size="60"
						maxlength="64">
					</aon:inputText>
					
					<aon:outputLabel for="Balance_Type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Balance_Type"
						value="#{balance.to.type}"
						disabled="#{!balance.new and !balance.to.removable}">
						<f:selectItems value="#{accountingCollections.balanceTypes}" />
					</aon:selectOneMenu>
					
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:outputText value="&#160;" />
						<aon:outputText value="PRE-CONFIGURADO" rendered="#{!balance.new and !balance.to.removable}"/>
					</aon:div>

				</aon:panelGrid>
				<ui:include src="grid.xhtml" />
			</aon:div>
		</aon:form>
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
