<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="balanceForm">


			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_balance_sheet}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener" value="#{balanceSheet.onBack}" type="actionListener" />
					<aon:methodParam name="searchAction" value="balance_sheet_search" />
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="officialBalance-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						title="#{bundle.aon_listing} MS Excel"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="officialBalance" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="officialBalance-word-report" 
						value="&#160;" target="_blank" action="#{report.onExecute}"
						title="#{bundle.aon_listing} MS Word 2007"
						styleClass="aon-finding-toolbar-item aon-icon-word aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="officialBalance" />
						<f:param name="outputFormat" value="DOCX" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="officialBalance-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="officialBalance" />
					</aon:htmlCommandLink>

				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="balanceDetailData"
					value="#{balanceSheet.balanceModel}" var="to" rows="150"
					columnClasses="aon-editDataTable-textColumn,
								   aon-editDataTable-numberColumn,
								   aon-editDataTable-numberColumn">

					<f:facet name="header">
						<rich:columnGroup>
							<rich:column colspan="4">
								<aon:outputText
									value="#{balanceSheet.balance.name} (#{balanceSheet.parameters.period.name})" />
							</rich:column>
						</rich:columnGroup>
					</f:facet>

					<rich:columnGroup rendered="#{to.title}">
						<rich:column colspan="4"
							style="font-weight:bold;background-color: #555555; color: white;text-align: center; font-size: 1.2em;">
							<aon:outputText 
								style="padding-left: #{to.level * 15}px;"
								value="#{to.detail.description}&#160;" />
						</rich:column>
					</rich:columnGroup>

					<aon:column rendered="#{!to.title}">
						<aon:outputText 
							style="padding-left: #{to.level * 15}px;#{to.detail.title?'font-weight:bold;':''}"
							value="#{to.detail.description}&#160;" />
						<aon:div rendered="#{balanceSheet.flagAccounts}">
							<aon:outputText 
								style="font-size: 0.9em;font-style: italic;margin-left: 50px;"
								value="#{to.detail.accounts}&#160;" />
						</aon:div>
					</aon:column>

					<aon:column rendered="#{!to.title}">
						<f:facet name="header">
							<aon:outputText value="#{balanceSheet.parameters.period.name}" />
						</f:facet>
						<aon:div rendered="#{to.amount != null}">
							<aon:outputText value="#{to.amount}"
								style="padding-right: 10px; padding-left: #{to.level * 15}px;#{to.detail.title?'font-weight:bold;':''}" 
								rendered="#{to.detail.internalCalculation}">
								<f:convertNumber pattern="#,##0.00;(#,##0.00)" />
							</aon:outputText>
							<aon:commandLink id="statement-search"  
								immediate="#{true}"
								rendered="#{!to.detail.internalCalculation}"
								styleClass="aon-dataTable-link"
								actionListener="#{balanceSheet.onAccountStatement}"
								style="padding-left: #{to.level * 15}px;#{to.detail.title?'font-weight:bold;':''}"
								title="#{accountingBundle.accounting_statement_module}"
								action="accountStatement_account_list">
								<aon:outputText value="#{to.amount}">
									<f:convertNumber pattern="#,##0.00;(#,##0.00)" />
								</aon:outputText>
							</aon:commandLink>
						</aon:div>
					</aon:column>

					<aon:column rendered="#{!to.title and balanceSheet.parameters.previousPeriodVisible}">
						<f:facet name="header">
							<aon:outputText value="#{balanceSheet.previousPeriod.name}" />
						</f:facet>
						<aon:div rendered="#{to.previousAmount != null}">
							<aon:outputText value="#{to.previousAmount}"
								style="padding-right: 10px; padding-left: #{to.level * 15}px;#{to.detail.title?'font-weight:bold;':''}" 
								rendered="#{to.detail.internalCalculation}">
								<f:convertNumber pattern="#,##0.00;(#,##0.00)" />
							</aon:outputText>
							<aon:commandLink id="statementPrevious-search" 
								immediate="#{true}"
								rendered="#{!to.detail.internalCalculation}"
								styleClass="aon-dataTable-link"
								actionListener="#{balanceSheet.onAccountPreviousStatement}"
								style="padding-left: #{to.level * 15}px;#{to.detail.title?'font-weight:bold;':''}"
								title="#{accountingBundle.accounting_statement_module}"
								action="accountStatement_account_list">
								<aon:outputText value="#{to.previousAmount}">
									<f:convertNumber pattern="#,##0.00;(#,##0.00)" />
								</aon:outputText>
							</aon:commandLink>
						</aon:div>
					</aon:column>
				</aon:dataTable>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
