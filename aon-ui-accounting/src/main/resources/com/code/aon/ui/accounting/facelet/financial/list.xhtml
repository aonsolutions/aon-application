<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_financial_statements}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener"
						value="#{financialStatement.onReset}" type="actionListener" />
					<aon:methodParam name="searchAction"
						value="financialStatement_search" />
				</ui:define>
			</ui:decorate>

			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				<aon:dataTable id="financialStatementList"
					value="#{financialStatement.managers}" var="manager">

					<f:facet name="header">
						<rich:columnGroup>
							<aon:column styleClass="aon-dataTable-header" colspan="3">
								<aon:outputText
									value="#{accountingBundle.accounting_financial_statements_month}" />
								<aon:outputText value="&#160;" />
								<aon:outputText value="#{financialStatement.financialMonth}" />
								<aon:outputText value="/" />
								<aon:outputText value="#{financialStatement.financialYear}" />
							</aon:column>
						</rich:columnGroup>
					</f:facet>

					<aon:column styleClass="aon-bold" colspan="3">
						<aon:outputText value="#{manager.label}" />
					</aon:column>

					<rich:subTable value="#{manager.model}" var="to">
						<aon:column>
							<h:commandLink ajaxSingle="true" rendered="#{to.code != null}"
								styleClass="aon-dataTable-link"
								actionListener="#{manager.onAccountStatement}"
								title="#{accountingBundle.accounting_statement_module}"
								action="account_statement_list">
								<aon:outputText value="#{to.code}"
									style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}"
								 />
							</h:commandLink>
						</aon:column>

						<aon:column>
							<aon:outputText value="#{to.description}" style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}"/>
						</aon:column>
						
						<aon:column styleClass="aon-text-right">
							<aon:commandLink ajaxSingle="true" reRender="accountEntryData"
								styleClass="aon-dataTable-link-simple"
								actionListener="#{manager.onDisable}"
								title="#{to.disabled?'Tener en cuenta':'No tener en cuenta'}">
								<aon:outputText value="#{to.amount}" style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:commandLink>
						</aon:column>
					</rich:subTable>

					<aon:column styleClass="aon-text-right aon-bold" colspan="2">
						<aon:outputText value="#{bundle.aon_total}&#160;#{manager.label}" />
					</aon:column>

					<aon:column styleClass="aon-text-right aon-bold">
						<aon:outputText value="#{manager.total}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<f:facet name="footer">
						<rich:columnGroup>
							<aon:column styleClass="aon-text-right aon-bold" colspan="2">
								<aon:outputText
									value="#{accountingBundle.accounting_financial_statement_total}" />
							</aon:column>
							<aon:column styleClass="aon-text-right aon-bold">
								<aon:outputText value="#{financialStatement.total}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:column>
						</rich:columnGroup>
					</f:facet>
				</aon:dataTable>
			</aon:div>


		</aon:form>
	</ui:define>
</ui:composition>
