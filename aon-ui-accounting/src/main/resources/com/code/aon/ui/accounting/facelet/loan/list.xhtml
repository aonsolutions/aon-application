<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountEntryReportList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_loan_module}" />
				<ui:param name="controller" value="#{loan}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:div rendered="#{loan.model.rowCount > 0}">
					<aon:dataTable id="loanList" value="#{loan.model}" rows="20"
						var="to"
						columnClasses="aon-editDataTable-numberColumn
							,aon-editDataTable-textColumn
							,aon-editDataTable-textColumn
							,aon-editDataTable-textColumn">

						<aon:rowSelector action="loan_form"
							actionListener="#{loan.onSelect}" />

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.loanDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{configBundle.config_bank}" />
							</f:facet>
							<aon:outputText value="#{to.registryBank.fullName}" />
						</aon:column>
						
					</aon:dataTable>
				</aon:div>
				<aon:dataScroller2 for="loanList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
