<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.accounting_amortization_form_module}" />
				<ui:param name="controller" value="#{amortization}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="amortizationList-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_report}" target="_blank"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="amortizationList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="amortizationForm-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.accounting_print_form}" target="_blank"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="amortizationFormFromList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="amortizationForm-excelReport"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						value="#{bundle.accounting_print_form}" target="_blank"
						action="#{amortization.onExcelReport}">
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{amortization}" />

					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-80" alias="Amortization.initialDate">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date_from}" />
							</f:facet>
							<aon:outputText value="#{to.initialDate}">
								<f:convertDateTime type="date"
									pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" alias="Amortization.description">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-300" alias="Amortization.fixedAssetAccount.description">
							<f:facet name="header">
								<aon:outputLabel for="fixedAccountId" value="#{bundle.accounting_fixed_asset_account}" />
							</f:facet>
							<aon:outputText value="#{to.fixedAssetAccount.fullDescription}">
								<aon:abbreviateConverter maxWidth="35" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-80" alias="Amortization.deadline">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date_to}" />
							</f:facet>
	
							<aon:outputText value="#{to.deadline}">
								<f:convertDateTime type="date"
									pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-150" alias="Amortization.comments">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_comment}" />
							</f:facet>
							<aon:outputText value="#{to.comments}" >
								<aon:abbreviateConverter maxWidth="20" />
							</aon:outputText>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
