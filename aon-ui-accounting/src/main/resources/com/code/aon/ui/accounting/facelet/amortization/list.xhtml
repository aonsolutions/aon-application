<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_amortization_form_module}" />
				<ui:param name="controller" value="#{amortization}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="amortizationList-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_report}" target="_blank"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="amortizationList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
									
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable id="amortizationDataList"
					value="#{amortization.model}" rows="20" var="to"
					rendered="#{amortization.model.rowCount > 0}">

					<aon:rowSelector action="amortization_form"
						actionListener="#{amortization.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date_from}" />
						</f:facet>
						<aon:outputText value="#{to.initialDate}">
							<f:convertDateTime type="date"
								pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date_to}" />
						</f:facet>

						<aon:outputText value="#{to.deadline}">
							<f:convertDateTime type="date"
								pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_comment}" />
						</f:facet>
						<aon:outputText value="#{to.comments}" />
					</aon:column>
				</aon:dataTable>
				<aon:dataScroller2 for="amortizationDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
