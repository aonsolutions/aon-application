<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"	
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.account_expenses_incomes_report}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="skipAfterSearch" value="true" />
				<ui:define name="searchContent">
				
					<aon:methodParam name="searchActionListener"
						value="#{operationReport.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="operationReport_list" />

					<aon:outputLabel for="Account_expenses"
						value="#{bundle.aon_type}" />
					<aon:selectOneRadio value="#{operationReport.params.expenses}" 
						id="Account_expenses">
						<f:selectItem itemValue="#{true}" itemLabel="Compras y Gastos" />
						<f:selectItem itemValue="#{false}" itemLabel="Ventas e Ingresos" />
					</aon:selectOneRadio>
					

					<aon:outputLabel for="reportDate"
						value="#{bundle.finance_report_date}" />
					<aon:selectInputDate id="reportDate"
						value="#{operationReport.params.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{bundle.aon_financial_year}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{operationReport.params.period}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate 
							id="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{operationReport.params.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate 
							id="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{operationReport.params.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:panelGrid>

					<aon:if test="#{aonRole.confidentiality}">
	 					<aon:outputLabel
							for="AccountEntryDetail_accountEntry_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneRadio value="#{operationReport.params.securityLevel}" 
							id="AccountEntryDetail_accountEntry_securityLevel">
							<f:selectItems value="#{commonCollections.confidentialValues}" />
							<f:selectItem itemValue="" itemLabel="#{bundle.aon_all} " />
						</aon:selectOneRadio>
					</aon:if>
					
					<aon:outputLabel for="Tax_type"
						value="Tipo de Impuesto" />
					<aon:div id="Tax_type">
						<aon:selectBooleanCheckbox id="Tax_type_iva"
							value="#{operationReport.params.iva}"/>
						<aon:outputLabel for="Tax_type_iva"
							value="IVA" />
						<aon:selectBooleanCheckbox id="Tax_type_irpf"
							value="#{operationReport.params.irpf}" 
							itemLabel="IRPF"/>
						<aon:outputLabel for="Tax_type_irpf"
							value="IRPF" />
					</aon:div> 
					
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_continue_counter"
							reRender="Account_page_counter"
							value="#{ledgerReport.counterVisible}" />
						<aon:outputLabel for="Account_continue_counter"
							value="#{bundle.accounting_continue_counter}" />
						<aon:inputText id="Account_page_counter"
							styleClass="aon-margin-left"
							disabled="#{!ledgerReport.counterVisible}"
							value="#{ledgerReport.pageCounter}" size="6"/>
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
