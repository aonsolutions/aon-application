<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accPeriodList">
			<aon:div ajaxRendered="true" layout="none">
				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{bundle.accounting_period_module}" />
					<ui:param name="controller" value="#{accPeriod}" />
				</ui:include>
				
				<aon:div styleClass="aon-scroll-area">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{accPeriod}" />
						<ui:param name="skipLineEdition" value="#{true}" />
						<ui:define name="beginFormListContent">
							<aon:commandLink id="#{dataTableId}-selectButton"
								styleClass="aon-table-row-link" value="&#160;"
								immediate="true" ajaxSingle="true" requestDelay="100"
								actionListener="#{accPeriod.onSelect}"
								onkeyup="#{dataTableId}KeyUp(this)"
								onfocus="#{dataTableId}SelectRow(this)"
								onblur="#{dataTableId}DeselectRow(this)"
								focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
							</aon:commandLink>
						</ui:define>
						<ui:define name="columns">
							<aon:column	alias="Period.name" 
								styleClass="aon-editDataTable-textColumn aon-width-auto">
								<f:facet name="header">
									<aon:outputLabel for="Period_name" value="#{bundle.aon_name}" />
								</f:facet>
	
								<aon:outputText value="#{to.name}" 
									rendered="#{formList}" />
								<aon:inputText rendered="#{formEdit}" required="true"
									disabled="true" id="Period_name" maxlength="10" size="10" 
									value="#{accPeriod.to.name}"/>
								<f:facet name="footer">
									<aon:inputText id="Period_name-New"  rendered="#{formNew}"
										maxlength="10" size="10" required="true"
										value="#{accPeriod.to.name}" />
								</f:facet>
							</aon:column>
	
							<aon:column	alias="Period.initiationDate" 
								styleClass="aon-editDataTable-textColumn aon-width-120">
								<f:facet name="header">
									<aon:outputLabel for="Period_initiationDate" value="#{bundle.aon_date_from}" />
								</f:facet>
	
								<aon:outputText value="#{to.initiationDate}" rendered="#{formList}">
									<f:convertDateTime type="date" pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:selectInputDate required="true"
									id="Period_initiationDate"
									rendered="#{formEdit}"
									value="#{accPeriod.to.initiationDate}"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}" />
	
								<f:facet name="footer">
									<aon:selectInputDate required="true"
										id="Period_initiationDate-New" rendered="#{formNew}"
										value="#{accPeriod.to.initiationDate}"
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}" />
								</f:facet>
							</aon:column>
	
							<aon:column	alias="Period.deadline" 
								styleClass="aon-editDataTable-textColumn aon-width-120">
								<f:facet name="header">
									<aon:outputLabel for="Period_deadline" value="#{bundle.aon_date_to}" />
								</f:facet>
	
								<aon:outputText value="#{to.deadline}" rendered="#{formList}">
									<f:convertDateTime type="date"
										pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:selectInputDate required="true" id="Period_deadline"
									rendered="#{formEdit}"
									value="#{accPeriod.to.deadline}"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}" />
								<f:facet name="footer">
									<aon:selectInputDate required="true" id="Period_deadline-New"
										rendered="#{formNew}" value="#{accPeriod.to.deadline}"
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}" />
								</f:facet>
							</aon:column>
	
							<aon:column	alias="Period.status" 
								styleClass="aon-editDataTable-textColumn aon-width-100">
								<f:facet name="header">
									<aon:outputLabel for="Period_status" value="#{bundle.aon_status}" />
								</f:facet>
								<aon:outputText value="#{to.status}" rendered="#{formList}"/>
								<aon:selectOneMenu id="Period_status"
									rendered="#{formEdit}" value="#{accPeriod.to.status}">
									<f:selectItems value="#{accountingCollections.accountPeriodStatuses}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="Period_status-New" rendered="#{formNew}"
										value="#{accPeriod.to.status}">
										<f:selectItems value="#{accountingCollections.accountPeriodStatuses}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
	
						</ui:define>
	
						<ui:define name="endFormListContent">
							<aon:div>
								<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
									<ui:param name="auditableTO" value="#{to}" />
								</ui:include>
							</aon:div>
						</ui:define>
	
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{tax}" />
		</ui:include>
	</ui:define>
</ui:composition>
