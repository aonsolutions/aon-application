<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
		
				<ui:param name="toolbarID" value="toolbarID" />
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_loan_fee_entry_module}" />
				<ui:param name="toolbarDescription"
					value="#{bundle.aon_reset}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save"
						value="#{accountingBundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}"
						title="#{accountingBundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{loanFeeEntry.onAccept}" action="#{loanFeeEntry.accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						disabled="#{loanFeeEntry.entry.loan == null or loanFeeEntry.entry.loan.id == null or loanFeeEntry.relatedAccount == null or loanFeeEntry.relatedAccount.id == null}"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_search" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />

				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width: 70%;">

					<aon:outputLabel for="AccountEntry_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu id="AccountEntry_accountPeriod"
						value="#{loanFeeEntry.entry.feePeriod}">
						<f:selectItems value="#{accountingCollections.enabledAccountPeriods}" />
						<a4j:support event="onchange" ajaxSingle="true" reRender="AccountEntry_accountPeriod"/>
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_date" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Account_date" required="true"
						value="#{loanFeeEntry.entry.feeDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="Loan_Lookup_id"
						value="#{accountingBundle.accounting_loan}" />
					<aon:selectOneMenu id="Loan_Lookup_id" required="true"
						reRender="loanContainer,toolbarID" ajaxSingle="true"
						value="#{loanFeeEntry.entry.loan}">
						<f:selectItem itemValue="" itemLabel="-" />
						<f:selectItems value="#{accountingCollections.activeLoans}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_description"
						value="#{bundle.aon_concept}" />
					<rich:comboBox id="Account_concept"
						suggestionValues="#{accountingCollections.conceptsDescriptions}"
						value="#{loanFeeEntry.entry.description}" required="true"
						maxlength="32" width="200" 
						directInputSuggestions="true"
						inputStyle="font-family: arial,lucida Grande, Trebuchet MS,sans-serif;font-size:1em;"
						buttonDisabledStyle="display:none;"
						buttonInactiveStyle="display:none;"
						buttonStyle="display:none;"/>

					<aon:outputLabel for="Account_amortization"
						value="#{accountingBundle.accounting_amortization}" />
					<aon:inputText id="Account_amortization" required="true"
						focus="Account_interest" reRender="Account_fee,loanFeeAmount"
						value="#{loanFeeEntry.entry.amortization}" size="10" />

					<aon:outputLabel for="Account_interest"
						value="#{accountingBundle.accounting_interest}" />
					<aon:div>
					<aon:inputText id="Account_interest" required="true"
						focus="Account_expenses" reRender="Account_fee,loanFeeAmount"
						value="#{loanFeeEntry.entry.interest}" size="10" />
						<aon:selectOneMenu id="Account_interest_account" 
							value="#{loanFeeEntry.entry.interestAccount}"
							style="width: 380px; margin-left: 10px;">
							<f:selectItems value="#{accountCollections.debtInterestAccounts}" />
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputLabel for="Account_expenses"
						value="#{accountingBundle.accounting_expenses}"/>
					<aon:div>
						<aon:inputText id="Account_expenses" required="true"
							focus="save" reRender="Account_fee,loanFeeAmount"
							value="#{loanFeeEntry.entry.expenses}" size="10" />
						<aon:selectOneMenu id="Account_expenses_account" 
							value="#{loanFeeEntry.entry.expensesAccount}"
							style="width: 380px; margin-left: 10px;">
							<f:selectItems value="#{accountCollections.expensesAccounts}" />
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputLabel for="Account_fee" value="#{bundle.aon_fee}" />
					<aon:inputText id="Account_fee" value="#{loanFeeEntry.entry.fee}"
						disabled="true" size="10">
						<f:convertNumber pattern="#,##0.00" />
					</aon:inputText>
				</aon:panelGrid>
 
				<aon:div id="loanContainer" style="margin-top: 10px;width: 70%;">
					<c:if test="#{loanFeeEntry.entry.loan != null}">
						<aon:panelCollapsible label="#{accountingBundle.accounting_loan_data}">
							<aon:panelGrid columns="2" style="width: 100%; text-align: left;"
								columnClasses="aon-panelGrid-odd aon-width-150
									,aon-panelGrid-even aon-width-auto">
								<aon:outputText value="#{bundle.aon_date}" />
								<aon:div>
									<aon:outputText value="#{loanFeeEntry.entry.loan.loanDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
	
									<c:if test="#{aonRole.confidentiality and loanFeeEntry.entry.loan.confidential}">
										<aon:outputText styleClass="aon-icon aon-icon-confidential"
											style="margin-left: 30px;" 
											title="#{bundle.aon_confidential}"/>
										<aon:outputText styleClass="aon-italic aon-margin-right"
											value="#{bundle.aon_confidential}" />
									</c:if>
								</aon:div>
								
	
								<aon:outputText value="#{bundle.aon_description}" />
								<aon:outputText value="#{loanFeeEntry.entry.loan.description}" />
	
								<aon:outputText value="#{accountBundle.account_account}" />
								<aon:div>
									<aon:commandLink id="loanFeeEntryStatement-search" 
										immediate="#{true}"
										styleClass="aon-dataTable-link"
										rendered="#{loanFeeEntry.relatedAccount != null and loanFeeEntry.relatedAccount.id != null}"
										actionListener="#{loanFeeEntry.onAccountStatement}"
										title="#{accountingBundle.accounting_statement_module}"
										action="accountStatement_list">
											<aon:outputText value="#{loanFeeEntry.relatedAccount.fullDescription}" />
									</aon:commandLink>
									<aon:outputText value="Prestamo sin cuenta contable asignada"
										style="color:red; font-weight: bold;" 
										rendered="#{loanFeeEntry.relatedAccount == null and loanFeeEntry.relatedAccount.id == null}"/>
								</aon:div>
	
								<aon:outputText value="#{accountingBundle.accounting_term}" />
								<aon:outputText
									value="#{loanFeeEntry.entry.loan.term} #{accountingBundle.accounting_term_months}" />
	
								<aon:outputText value="#{accountingBundle.accounting_interest}" />
								<aon:outputText value="#{loanFeeEntry.entry.loan.interest}" />
	
								<aon:outputText value="#{accountingBundle.accounting_review}" />
								<aon:outputText value="#{loanFeeEntry.entry.loan.review}" />
	
								<aon:outputText value="#{configBundle.config_bank}" />
								<aon:outputText
									value="#{loanFeeEntry.entry.loan.registryBank.fullName}" />
	
								<aon:outputText value="#{bundle.aon_amount}" />
								<aon:outputText
									value="#{loanFeeEntry.entry.loan.amount}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
	
								<aon:outputText value="#{accountingBundle.accounting_expenses}" />
								<aon:outputText value="#{loanFeeEntry.entry.loan.expenses}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
	
								<aon:outputText value="#{accountingBundle.accounting_fee_amount}" />
								<aon:outputText id="loanFeeAmount" value="#{loanFeeEntry.entry.loan.feeAmount}"
									style="color:#{loanFeeEntry.entry.sameAmount?'black;':'red;'}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
	
								<aon:outputText value="#{accountingBundle.accounting_outstanding_balance}" />
								<aon:outputText value="#{loanFeeEntry.outstandingBalance}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:panelGrid>
						</aon:panelCollapsible>
					</c:if>
				</aon:div>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
