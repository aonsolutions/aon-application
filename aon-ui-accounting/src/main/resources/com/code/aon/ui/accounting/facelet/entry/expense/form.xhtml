<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="expenseEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_expense_entry_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_reset}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save" 
						value="#{accountingBundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}"
						title="#{accountingBundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{expenseEntry.onAccept}"
						action="#{expenseEntry.accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{accountingBundle.accounting_entry_generate}?')) return false;" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}" immediate="true"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_search" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="AccountEntry_accountPeriod"
						value="#{bundle.aon_financial_year}" />
					<aon:div>
						<aon:selectOneMenu id="AccountEntry_accountPeriod"
							value="#{expenseEntry.entry.period}">
							<f:selectItems
								value="#{accountingCollections.enabledAccountPeriods}" />
							<a4j:support event="onchange" ajaxSingle="true"
								reRender="AccountEntry_accountPeriod" />
						</aon:selectOneMenu>
						<c:if test="#{aonRole.confidentiality}">
							<aon:selectBooleanCheckbox id="AccountEntry_securityLevel"
								styleClass="aon-margin-left"
								value="#{expenseEntry.entry.confidential}"/>
							<aon:outputText styleClass="aon-italic aon-margin-right"
								value="#{bundle.aon_confidential}" />
						</c:if>
					</aon:div>

					<aon:outputLabel for="AccountEntry_date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="AccountEntry_date" required="true"
						value="#{expenseEntry.entry.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="AccountEntry_deposit"
						value="#{financeBundle.finance_deposit}" />
					<aon:selectOneRadio id="AccountEntry_deposit"
						style="display:inline;" ajaxSingle="true"
						value="#{expenseEntry.entry.deposit}"
						reRender="entryContainer">
						<f:selectItem itemLabel="#{bundle.aon_bank}" itemValue="0" />
						<f:selectItem itemLabel="#{bundle.report_pos}" itemValue="1" />
					</aon:selectOneRadio>

					<aon:outputLabel for="AccountEntry_registryBank"
						value="#{bundle.aon_bank}"
						rendered="#{expenseEntry.entry.deposit == 0}" />
					<aon:selectOneMenu id="AccountEntry_registryBank"
						value="#{expenseEntry.entry.registryBank}"
						rendered="#{expenseEntry.entry.deposit == 0}">
						<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="AccountEntry_payMethodTypeDetail"
						value="#{bundle.report_pos}"
						rendered="#{expenseEntry.entry.deposit == 1 and expenseEntry.payMethodTypeDetailsSize > 0}" />
					<aon:selectOneMenu id="AccountEntry_payMethodTypeDetail"
						value="#{expenseEntry.entry.payMethodTypeDetail}"
						rendered="#{expenseEntry.entry.deposit == 1 and expenseEntry.payMethodTypeDetailsSize > 0}">
						<f:selectItems value="#{configCollections.payMethodTypeDetails}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="AccountEntry_concept"
						value="#{bundle.aon_concept}" />
					<rich:comboBox id="AccountEntry_concept"
						suggestionValues="#{accountingCollections.conceptsDescriptions}"
						value="#{expenseEntry.entry.concept}" required="true"
						maxlength="32" width="200" 
						directInputSuggestions="true"
						inputStyle="font-family: arial,lucida Grande, Trebuchet MS,sans-serif;font-size:1em;"
						buttonDisabledStyle="display:none;"
						buttonInactiveStyle="display:none;"
						buttonStyle="display:none;"/>
					
					<aon:outputLabel for="AccountEntry_account"
						value="#{bundle.account_account}" />
					<aon:selectOneMenu id="AccountEntry_account" required="true"
						value="#{expenseEntry.entry.account}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{accountCollections.expensesAccounts}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="AccountEntry_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="AccountEntry_amount"
						value="#{expenseEntry.entry.amount}" size="15"	/>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
