<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle"
					value="#{bundle.report_opening}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />

				<ui:define name="toolbarContent">

					<aon:commandButton id="save" value="#{bundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{endPeriodEntries.onOpeningEntry}"
						action="#{endPeriodEntries.navigate}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false; else Richfaces.showModalPanel('waitProccess');"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"/>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Opening_Period_Previous"
						value="#{bundle.accounting_previous_period}" />
					<aon:selectOneMenu id="Opening_Period_Previous"
						value="#{endPeriodEntries.previousPeriod}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{accountingCollections.closedAccountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Opening_Period"
						value="#{bundle.accounting_opening_period}" />
					<aon:selectOneMenu id="Opening_Period"
						value="#{endPeriodEntries.period}">
						<f:selectItems value="#{accountingCollections.enabledAccountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Opening_date"
						value="#{bundle.accounting_opening_date}" />
					<aon:selectInputDate id="Opening_date"
						value="#{endPeriodEntries.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Opening_Concept"
						value="#{bundle.aon_concept}" />
					<rich:comboBox id="Opening_Concept"
						suggestionValues="#{accountingCollections.conceptsDescriptions}"
						value="#{endPeriodEntries.concept}" required="true"
						maxlength="32" width="200" 
						directInputSuggestions="true"
						inputStyle="font-family: arial,lucida Grande, Trebuchet MS,sans-serif;font-size:1em;"
						buttonDisabledStyle="display:none;"
						buttonInactiveStyle="display:none;"
						buttonStyle="display:none;"/>

					<aon:if test="#{aonRole.confidentiality}">
						<aon:outputLabel for="Opening_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneMenu id="Opening_securityLevel"
							value="#{endPeriodEntries.securityLevel}">
							<f:selectItems value="#{commonCollections.confidentialValues}" />
						</aon:selectOneMenu>
					</aon:if>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
