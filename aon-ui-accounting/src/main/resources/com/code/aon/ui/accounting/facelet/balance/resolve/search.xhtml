<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_balance_sheet}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="skipClearButton" value="true" />
				
				<ui:define name="beforeToolbarContent">
					<aon:commandButton id="#{toolbarID}-clear"
							value="#{bundle.aon_clear}"
							actionListener="#{balanceSheetResolver.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />

					<aon:outputLabel for="balanceSheetResolver_balance"
						value="#{accountingBundle.accounting_balance}" />
					<aon:selectOneMenu id="balanceSheetResolver_balance"
						required="true"
						value="#{balanceSheetResolver.balance}">
						<f:selectItem value="#{null}" itemLabel=" " />
						<f:selectItems value="#{balanceSheetResolver.balances}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="balanceSheetResolver_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu required="true" id="balanceSheetResolver_accountPeriod"
						value="#{balanceSheetResolver.parameters.period}">
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
					</aon:selectOneMenu>
 
					<aon:outputLabel for="balanceSheetResolver_entryDate-From"
						value="#{bundle.aon_date_from}" />
					<aon:panelGrid columns="3">
						<aon:selectInputDate id="balanceSheetResolver_entryDate-From"
							value="#{balanceSheetResolver.parameters.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="balanceSheetResolver_entryDate-To"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="balanceSheetResolver_entryDate-To"
							value="#{balanceSheetResolver.parameters.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Show_Previous_Period"
							value="#{balanceSheetResolver.parameters.previousPeriodVisible}"/>
						<aon:outputLabel for="Show_Previous_Period"
							value="#{accountingBundle.accounting_show_previous_period}" />
					</aon:div>

					<c:if test="#{aonRole.confidentiality}">
						<aon:outputLabel for="balanceSheetResolver_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneRadio id="balanceSheetResolver_securityLevel"
							value="#{balanceSheetResolver.parameters.securityLevel}">
							<f:selectItems value="#{commonCollections.confidentialValues}" />
							<f:selectItem itemValue="" itemLabel="#{bundle.aon_all}" />
						</aon:selectOneRadio>
					</c:if>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_show_cover"
							value="#{balanceSheetResolver.parameters.coverVisible}" />
						<aon:outputLabel for="Account_show_cover"
							value="#{accountingBundle.accounting_show_cover}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_continue_counter"
							reRender="Account_page_counter"
							value="#{balanceSheetResolver.parameters.counterVisible}" />
						<aon:outputLabel for="Account_continue_counter"
							value="#{accountingBundle.accounting_continue_counter}" />
						<aon:inputText id="Account_page_counter"
							styleClass="aon-margin-left"
							disabled="#{!balanceSheetResolver.parameters.counterVisible}"
							value="#{balanceSheetResolver.parameters.pageCounter}" size="6"/>
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:commandButton id="balanceSheetResolver-report"
							value="#{accountingBundle.accounting_balance_sheet_show}" 
							actionListener="#{balanceSheetResolver.onBalance}"
							action="balanceSheetResolver_list"
							styleClass="aon-search-lookup-button"
							style="border: 1px solid black; background-color: #eeeeee;">
							<aon:actionHotKey key="return" />
						</aon:commandButton>
<!-- 
						<aon:htmlCommandLink id="balanceSheetResolver-reportPDF"
							value="#{accountingBundle.accounting_balance_sheet_show}" 
							target="_blank" 
							action="#{balanceSheetResolver.onPDFBalance}"
							styleClass="aon-search-lookup-button aon-icon-pdf"
							style="border: 1px solid black; background-color: #eeeeee;">
							<aon:actionHotKey key="return" />
						</aon:htmlCommandLink>
 -->
					</aon:div>
				</ui:define>
			</ui:decorate>

		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
