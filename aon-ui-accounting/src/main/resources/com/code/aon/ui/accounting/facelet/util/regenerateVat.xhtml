<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="checkForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle"
					value="#{bundle.accounting_regenerate_vat_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_form}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="clean" value="#{bundle.aon_clear}"
						styleClass="aon-finding-toolbar-item aon-icon-rubber"
						immediate="true"
						actionListener="#{vatRegenerator.onEditSearch}" />
					<aon:commandButton id="validate" value="#{bundle.aon_login_validate}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"
						actionListener="#{vatRegenerator.validate}" />
					<aon:commandButton id="execute" value="#{bundle.aon_execute}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh"
						rendered="#{vatRegenerator.params.valid}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"
						actionListener="#{vatRegenerator.regenerate}" />
				</ui:define>
			</ui:decorate>

			<aon:div style="width:100%;"> 
				<aon:div styleClass="aon-margin-top aon-border aon-text-center" style="width:90%; margin:10px auto;"
					rendered="#{vatRegenerator.validated}">

					<aon:div>
						<aon:outputText value="#{bundle.account_invoice_update}" />
						<aon:outputText value="&#160;" />
						<aon:outputText value="#{vatRegenerator.params.count}" styleClass="aon-weight-bold"/>
					</aon:div>
					<aon:div rendered="#{!vatRegenerator.params.valid}">
						<aon:outputText style="color:red;" styleClass="aon-weight-bold aon-margin-top" 
							value="#{bundle.account_invoice_update_error}" />
					</aon:div>
				</aon:div>				

				<aon:panelGrid columns="2" style="width:90%; margin:10px auto;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{bundle.aon_financial_year}" />
					<aon:selectOneMenu
						disabled="#{vatRegenerator.validated}"
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{vatRegenerator.params.period}">
						<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
					</aon:selectOneMenu>

					<c:if test="#{aonRole.confidentiality}">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneMenu
							id="AccountEntryDetail_accountEntry_securityLevel"
							disabled="#{vatRegenerator.validated}"
							value="#{vatRegenerator.params.securityLevel}">
							<f:selectItems value="#{commonCollections.confidentialValues}" />
						</aon:selectOneMenu>
					</c:if>

					<aon:outputText value="#{bundle.aon_document_number}" />
					<aon:panelGrid columns="3">
						<aon:div>
							<aon:selectOneMenu id="from_series"
								disabled="#{vatRegenerator.validated}"
								value="#{vatRegenerator.params.fromSeries}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{configCollections.invoiceSeries}" />
							</aon:selectOneMenu>
							<aon:inputText id="From_Number" value="#{vatRegenerator.params.fromNumber}" size="10"
								disabled="#{vatRegenerator.validated}"
								style="margin-left: 0.5em;"/>
						</aon:div>
						<aon:outputLabel for="entryDate-To" value="#{bundle.aon_date_to}" />
						<aon:div>
							<aon:selectOneMenu id="to_series"
								disabled="#{vatRegenerator.validated}"
								value="#{vatRegenerator.params.toSeries}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{configCollections.invoiceSeries}" />
							</aon:selectOneMenu>
							<aon:inputText id="To_Number" value="#{vatRegenerator.params.toNumber}" size="10"
								disabled="#{vatRegenerator.validated}"
								style="margin-left: 0.5em;"/>
						</aon:div>
					</aon:panelGrid>
					
					<aon:outputText value="&#160;"/>
					<aon:div>
						<aon:selectBooleanCheckbox value="#{vatRegenerator.params.investment}" />
						<aon:outputText value="#{bundle.accounting_investment}" />
					</aon:div>

					<aon:outputText value="&#160;"/>
					<aon:outputText value="&#160;"/>

					<aon:outputLabel for="AccountEntryDetail_input_series"
						value="#{bundle.account_invoices_series}" />
					<aon:selectOneMenu id="AccountEntryDetail_input_series"
						disabled="#{vatRegenerator.validated}"
						value="#{vatRegenerator.params.series}">
						<f:selectItems value="#{configCollections.invoiceSeries}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="AccountEntryDetail_first_number"
						value="#{bundle.account_first_number}" />
					<aon:inputText id="AccountEntryDetail_first_number" size="10" required="true"
						disabled="#{vatRegenerator.validated}"
						value="#{vatRegenerator.params.firstNumber}" />
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>

</ui:composition>
