<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="salePanelWindow">
		<c:if test="#{amortization.salePanelVisible}">
			<rich:modalPanel id="saleModalPanel" minHeight="240"
				minWidth="520" rendered="#{amortization.salePanelVisible}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.accounting_fixed_asset_sale}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="salePanelWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{amortization.salePanelVisible}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="amortizationSaleForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="amortization_sale"
										value="#{bundle.aon_accept}"
										reRender="salePanelWindow,amortizationForm"
										actionListener="#{amortization.onSale}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="saleModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{amortization.salePanelVisible}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="amortizationSale-cancel"
										value="#{bundle.aon_cancel}"
										reRender="salePanelWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{amortization.salePanelVisible}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 80%;">

										<aon:outputLabel for="Amortization_deadline"
											value="#{bundle.accounting_cancellation_date}" />
										<aon:selectInputDate id="Amortization_deadline"
											value="#{amortization.to.deadline}"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"/>
					
										<aon:outputLabel for="Amortization_saleAmount"
											value="#{bundle.accounting_sale_amount}" />
										<aon:inputText id="Amortization_saleAmount"
											value="#{amortization.to.saleAmount}" size="15" />
									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
