<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="profitAndLossList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_budgeted_balance_sheet_module}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener"
						value="#{budgetedProfitAndLossReport.onEditSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="budgeted_profit_and_loss_search" />
				</ui:define>
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="&#160;" target="_blank"
						action="#{report.onExecute}"
						title="#{bundle.aon_listing} MS Excel"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="budgetedProfitAndLoss" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_listing}" action="#{report.onExecute}">
						<f:param name="reportKey" value="budgetedProfitAndLoss" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div id="accountData" styleClass="aon-scroll-area">
			
				<aon:div style="margin-bottom:0.75em;">
					<aon:panelGrid columns="6" style="width:100%;"
						columnClasses="
						 aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-100
						,aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-100
						,aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-auto">
						<aon:outputLabel value="#{accountingBundle.accounting_period}" />
						<aon:outputText styleClass="aon-bold"
							value="#{budgetedProfitAndLossReport.parameters.period.id}" />

						<aon:outputLabel
							value="#{bundle.aon_date_from}" />
						<aon:outputText 
							value="#{budgetedProfitAndLossReport.parameters.fromDate}"
							timeZone="#{timeZoneController.timeZone}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
						</aon:outputText>
	
						<aon:outputLabel
							value="#{bundle.aon_date_to}" />
						<aon:outputText 
							value="#{budgetedProfitAndLossReport.parameters.toDate}"
							timeZone="#{timeZoneController.timeZone}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
						</aon:outputText>

					</aon:panelGrid>
				</aon:div>

				<aon:dataTable value="#{budgetedProfitAndLossReport.controller}"
					var="controller">

					<f:facet name="header">
						<rich:columnGroup>
							<aon:column styleClass="aon-dataTable-header">
								<aon:outputText value="#{accountBundle.account_account}" />
							</aon:column>
							<aon:column styleClass="aon-dataTable-header">
								<aon:outputText value="#{bundle.aon_description}" />
							</aon:column>
							<aon:column styleClass="aon-dataTable-header">
								<aon:outputText value="#{accountingBundle.accounting_debit_balance}" />
							</aon:column>
							<aon:column styleClass="aon-dataTable-header">
								<aon:outputText value="#{accountingBundle.accounting_credit_balance}" />
							</aon:column>
						</rich:columnGroup>
					</f:facet>

					<rich:subTable value="#{controller.grossMargin.sortedSummaryList}"
						var="to">
						<aon:column styleClass="aon-width-100">
							<aon:commandLink immediate="true"
								title="#{accountingBundle.accounting_statement_module}"
								styleClass="aon-dataTable-link" action="account_statement_list">
								<f:setPropertyActionListener value="#{to.id}"
									target="#{budgetedProfitAndLossReport.accountStatement}" />
								<aon:actionListener method="#{budgetedProfitAndLossReport.onStatement}" />
								<aon:outputText value="#{to.id}" />
								<f:setPropertyActionListener value="budgeted_profit_and_loss_list"
									target="#{statement.backAction}" />
							</aon:commandLink>
						</aon:column>

						<aon:column>
							<aon:outputText value="#{to.description}" />
						</aon:column>

						<aon:column
							styleClass="aon-editDataTable-numberColumn aon-width-150">
							<aon:outputText value="#{to.unpaidBalance}" rendered="#{to.unpaidBalance != 0}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column
							styleClass="aon-editDataTable-numberColumn aon-width-150">
							<aon:outputText value="#{to.creditBalance}" rendered="#{to.creditBalance != 0}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>
					</rich:subTable>

					<aon:column colspan="2" styleClass="aon-text-right">
						<aon:outputText value="#{accountingBundle.accounting_gross_margin}" />
					</aon:column>
					<aon:column styleClass="aon-text-right">
						<aon:outputText value="#{controller.grossMargin.unpaidBalance}" rendered="#{controller.grossMargin.unpaidBalance != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>
					<aon:column styleClass="aon-text-right">
						<aon:outputText value="#{controller.grossMargin.creditBalance}" rendered="#{controller.grossMargin.creditBalance != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<rich:subTable value="#{controller.totalExpenses.sortedSummaryList}"
						var="to">
						<aon:column>
							<aon:commandLink immediate="true"
								title="#{accountingBundle.accounting_statement_module}"
								styleClass="aon-dataTable-link" action="account_statement_list">
								<f:setPropertyActionListener value="#{to.id}"
									target="#{budgetedProfitAndLossReport.accountStatement}" />
								<aon:actionListener method="#{budgetedProfitAndLossReport.onStatement}" />
								<aon:outputText value="#{to.id}" />
								<f:setPropertyActionListener value="budgeted_profit_and_loss_list"
									target="#{statement.backAction}" />
							</aon:commandLink>
						</aon:column>

						<aon:column>
							<aon:outputText value="#{to.description}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn">
							<aon:outputText value="#{to.unpaidBalance}" rendered="#{to.unpaidBalance != 0}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn">
							<aon:outputText value="#{to.creditBalance}" rendered="#{to.creditBalance != 0}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

					</rich:subTable>

					<aon:column colspan="2" styleClass="aon-text-right">
						<aon:outputText value="#{accountingBundle.accounting_total_expenses}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<aon:outputText value="#{controller.totalExpenses.unpaidBalance}" rendered="#{controller.totalExpenses.unpaidBalance != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<aon:outputText value="#{controller.totalExpenses.creditBalance}" rendered="#{controller.totalExpenses.creditBalance != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column breakBefore="true" colspan="2" styleClass="aon-text-right">
						<aon:outputText value="#{accountingBundle.accounting_total_result}" />
						<aon:outputText
							value=" ( #{accountingBundle.accounting_total_result_profit} )"
							rendered="#{budgetedProfitAndLossReport.totalResult gt 0}" />
						<aon:outputText
							value=" ( #{accountingBundle.accounting_total_result_loss} )"
							rendered="#{budgetedProfitAndLossReport.totalResult lt 0}" />
						<aon:outputText
							value=" ( #{accountingBundle.accounting_total_result_null} )"
							rendered="#{budgetedProfitAndLossReport.totalResult == 0}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<aon:outputText value="#{budgetedProfitAndLossReport.totalResult * (-1)}"
							rendered="#{budgetedProfitAndLossReport.totalResult lt 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<aon:outputText value="#{budgetedProfitAndLossReport.totalResult}"
							rendered="#{budgetedProfitAndLossReport.totalResult gt 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
