<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.accounting_book_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />

					<aon:outputLabel for="accountPeriod" value="#{bundle.aon_financial_year}" />
					<aon:selectOneMenu id="accountPeriod" value="#{accountingBook.period}" reRender="journal,buttonContainer" ajaxSingle="true"
						valueChangeListener="#{accountingBook.onChangePeriod}">
						<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputText value="" />
					<aon:div>
						<aon:selectBooleanCheckbox id="coverEnabled"
							reRender="coverData" 
							value="#{accountingBook.coverEnabled}"/>
						<aon:outputLabel for="coverEnabled" value="#{bundle.accounting_coverEnabled}" />
						<aon:div id="coverData" styleClass="aon-margin-left">
							<aon:inputText value="#{accountingBook.coverTitle}" rendered="#{accountingBook.coverEnabled}" size="70"/>
							<aon:div styleClass="aon-margin-top" rendered="#{accountingBook.coverEnabled}">
								<aon:inputText value="#{accountingBook.coverSubTitle}" size="70"/>
							</aon:div>
						</aon:div>
					</aon:div>

					<aon:outputText value="" />
					<aon:div id="journal">

						<aon:commandLink id="accountingBookRegenerate" 
							styleClass="aon-margin-left aon-margin-top aon-bold" style="color:red; text-decoration: underline;"
							value="#{bundle.accounting_regenerate_journal_counter_module}" 
							actionListener="#{accountingBook.onRegenerate}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')"
							rendered="#{accountingBook.journalEnabled and !accountingBook.journalCorrect}">
						</aon:commandLink>
					</aon:div>
					
					<aon:outputText value="" />
					<aon:div id="bookDiv">
						<aon:dataTable value="#{accountingBook.model}" var="to" styleClass="aon-width-all" rows="0">
						
							<aon:column
								style="#{to.mergeable?'background-color:#FFFF99;':''}" 
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="Book_order" value="#{bundle.aon_order}"/>
								</f:facet>
									
								<aon:div styleClass="aon-nowrap" rendered="#{!to.mergeable or (to.mergeable and accountingBook.numberVisible)}">
<!-- 								
<aon:outputText value="#{to.order}" styleClass="aon-italic"/>
<aon:outputText value="#{to.mergeOrder}" styleClass="aon-italic"/>
 -->
									<aon:commandButton
										id="moveUp"
										value="&#160;" 
										title="&#160;"
										actionListener="#{accountingBook.onMoveUp}"
										rendered="#{to.order != 1}" 
										reRender="bookDiv"
										styleClass="aon-editDataTable-button aon-icon-up"/>
									<aon:commandButton
										id="moveDown"
										value="&#160;" 
										title="&#160;"
										actionListener="#{accountingBook.onMoveDown}"
										rendered="#{!accountingBook.maxOrder}" 
										reRender="bookDiv"
										styleClass="aon-editDataTable-button aon-icon-down"/>
								</aon:div>
									
								<f:facet name="footer">
									<aon:div>
										<aon:commandButton
											id="newBook" 
											title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
											actionListener="#{accountingBook.onNewBook}"
											rendered="#{!formNew}" 
											reRender="bookDiv"
											styleClass="aon-editDataTable-button aon-icon-reset"
											accesskey="#{bundle.aon_key_new_line}"/>
									</aon:div>
								</f:facet>
							</aon:column>
							
							<aon:column
								style="#{to.mergeable?'background-color:#FFFF99;':''}" 
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="Book_type" value="#{bundle.aon_type}"/>
								</f:facet>
								<aon:selectOneMenu id="Book_type" reRender="bookDescription" 
									value="#{to.bookType}">
									<f:selectItem itemValue="#{null}" itemLabel=" - " />
									<f:selectItems value="#{accountingBook.bookTypes}" />
								</aon:selectOneMenu>
							</aon:column>
							
							<aon:column
								style="#{to.mergeable?'background-color:#FFFF99;':''}" 
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="Book_mergeOrder" value="PDF"/>
								</f:facet>
								<aon:div styleClass="aon-nowrap" rendered="#{to.mergeable}">
									<aon:commandButton
										id="pdfMoveUp"
										value="&#160;" 
										title="&#160;"
										actionListener="#{accountingBook.onPDFMoveUp}"
										rendered="#{to.mergeOrder != 1}" 
										reRender="bookDiv"
										styleClass="aon-editDataTable-button aon-icon-up"/>
									<aon:commandButton
										id="pdfMoveDown"
										value="&#160;" 
										title="&#160;"
										actionListener="#{accountingBook.onPDFMoveDown}"
										rendered="#{!accountingBook.maxMergeOrder}" 
										reRender="bookDiv"
										styleClass="aon-editDataTable-button aon-icon-down"/>
								</aon:div>
							</aon:column>

							<aon:column 
								style="#{to.mergeable?'background-color:#FFFF99;':''}"
								styleClass="aon-editDataTable-iconColumn aon-text-center">
								<f:facet name="header">
									<aon:outputLabel for="Book_mergeable"
										styleClass="aon-icon-question"
										title="Marque, si desea incluir el listado en un unico PDF"
										style="margin-top:2px; padding-left: 16px;" 
										value="&#160;"/>
								</f:facet>
								<aon:selectBooleanCheckbox id="Book_mergeable"
									value="#{to.mergeable}">
									<a4j:support event="onclick"
										actionListener="#{accountingBook.onMergebleChanged}"
										reRender="bookDiv" />
								</aon:selectBooleanCheckbox>
							</aon:column>

							<aon:column 
								style="#{to.mergeable?'background-color:#FFFF99;':''}"
								styleClass="aon-editDataTable-textColumn aon-text-center">
								<f:facet name="header">
									<aon:outputLabel for="Book_number" value="#{bundle.aon_number}"/>
								</f:facet>
								<aon:inputText id="Book_number" rendered="#{accountingBook.numberVisible}" 
									value="#{to.number}" size="3"/>
							</aon:column>

							<aon:column 
								style="#{to.mergeable?'background-color:#FFFF99;':''}"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_description}"/>
								</f:facet>
								<aon:div id="bookDescription">
									<aon:inputText id="Book_description" 
										rendered="#{!to.balanceReport and !to.profitAndLossReport and !to.other}" 
										value="#{to.description}" size="50"/>
									
									<aon:selectOneMenu id="Book_balance" value="#{to.balance}" 
										style="width: 416px;" rendered="#{to.balanceReport}">
										<f:selectItem itemValue="#{null}" itemLabel=" - " />
										<f:selectItems value="#{accountingBook.balances}" />
									</aon:selectOneMenu>
	
									<aon:selectOneMenu id="Book_profitAndLossBalance" value="#{to.balance}" 
										style="width: 416px;" rendered="#{to.profitAndLossReport}">
										<f:selectItem itemValue="#{null}" itemLabel=" - " />
										<f:selectItems value="#{accountingBook.profitAndLossBalances}" />
									</aon:selectOneMenu>
									
									<aon:selectOneMenu id="Book_otherReport" value="#{to.attachId}"
										style="width: 416px;" rendered="#{to.other}">
										<f:selectItem itemValue="#{null}" itemLabel=" - "/>
										<f:selectItems value="#{accountingCollections.reportAttachments}" />
									</aon:selectOneMenu>
									
								</aon:div>
							</aon:column>
							
							<aon:column style="#{to.mergeable?'background-color:#FFFF99;':''}">
								<aon:confirmButton
									id="removeBook" title="#{bundle.aon_remove} (#{bundle.aon_key_remove_line_accelerator})"
									immediate="true"  
									reRender="bookDiv"
									confirmTitle="#{bundle.aon_confirm_title}"
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{accountingBook.onRemoveBook}"
									styleClass="aon-editDataTable-button aon-icon-delete"
									accesskey="#{bundle.aon_key_remove_line}" />
							</aon:column>

							
							
						</aon:dataTable>
					</aon:div>

					<aon:outputText value="" />
					<aon:div id="buttonContainer" styleClass="aon-margin-top">
						<aon:commandButton id="book-validate"
							styleClass="aon-search-lookup-button"
							value="#{bundle.aon_login_validate}" 
							actionListener="#{accountingBook.onValidate}"
							reRender="buttonContainer"
							disabled="#{accountingBook.valid}">
						</aon:commandButton>
						
						<aon:commandButton id="book-generate"
							styleClass="aon-search-lookup-button"
							style="cursor:pointer;" 
							value="#{bundle.aon_generate}" 
							actionListener="#{accountingBook.onGenerate}"
							reRender="showBookWindow"
							rendered="#{accountingBook.valid}">
							<f:setPropertyActionListener
								target="#{accountingBook.showBookWindow}"
								value="#{true}" />
						</aon:commandButton>

						<aon:htmlCommandLink id="book-report"
							styleClass="aon-search-lookup-button"
							style="border-right: 1px solid black;" 
							value="Descargar" 
							target="_blank"
							actionListener="#{accountingBook.downloadDisk}"
							rendered="#{accountingBook.bookFile}">
						</aon:htmlCommandLink>

<!-- 
						<aon:htmlCommandLink id="book-report"
							styleClass="aon-search-lookup-button"
							style="border-right: 1px solid black;" 
							value="#{bundle.aon_generate}" 
							target="frameTarget"
							actionListener="#{accountingBook.onCreate}"
							rendered="#{accountingBook.valid}"
							reRender="showBookWindow">
						</aon:htmlCommandLink>
	 -->					
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/accounting/facelet/book/modalBookWaitingProcess.xhtml" />
		
	</ui:define>
</ui:composition>
