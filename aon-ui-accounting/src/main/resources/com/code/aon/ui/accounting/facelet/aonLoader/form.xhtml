<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="aonLoaderForm">
    		<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.aon_loader_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_form}" />

				<ui:define name="toolbarContent">
					<aon:if test="#{aonLoader.customLoaderEnabled}">
						<aon:selectOneMenu value="#{aonLoader.selectedCustomLoader}" >
							<f:selectItem itemLabel="Standard" itemValue="#{null}" />
							<f:selectItems value="#{aonLoader.customLoaderTypes}" />
							<a4j:support event="onchange" reRender="aonLoaderForm" actionListener="#{aonLoader.onClear}" />
						</aon:selectOneMenu>
					</aon:if>
					<aon:commandButton id="execute"
						value="#{bundle.aon_loader_load}"
						actionListener="#{aonLoader.onShowPanel}"
						rendered="#{aonLoader.aonFile.size > 0}"
						reRender="showLoadMessageWindow"
						styleClass="aon-finding-toolbar-item aon-icon-accept"/>
					<aon:if test="#{empty aonLoader.selectedCustomLoader}">
						<aon:htmlCommandLink  id="help" target="_blank" 
							value="#{bundle.aon_help}"
							actionListener="#{aonLoader.onHelp}"
							styleClass="aon-finding-toolbar-item aon-icon-menu-help"/>
					</aon:if>
				</ui:define>
			</ui:decorate>
			
			<aon:if test="#{aonRole.sysAdmin}">
				<aon:panel style="width:90%; margin:10px;">
					<f:facet name="header">
						<aon:outputText value="Carga de datos personalizada" />
					</f:facet>
					<aon:panelGrid  columns="2" style="padding:10px;">
						<aon:outputText value="OPPIDUM" />
						<aon:commandButton value="No habilitado" title="#{bundle.aon_enable}"
							rendered="#{!aonLoader.oppidumLoaderEnabled}"
							reRender="aonLoaderForm"
							styleClass="aon-finding-toolbar-item aon-noborder aon-icon-check"
							actionListener="#{aonLoader.onEnableOppidum}" />
						<aon:commandButton value="Habilitado" title="#{bundle.aon_enable}"
							rendered="#{aonLoader.oppidumLoaderEnabled}"
							reRender="aonLoaderForm"
							styleClass="aon-finding-toolbar-item aon-noborder aon-icon-checked"
							actionListener="#{aonLoader.onDisableOppidum}" />
					</aon:panelGrid>
				</aon:panel>
			</aon:if>

			<aon:panelGrid columns="2" style="width:90%; margin:10px;">
				<aon:outputLabel for="attach_file" value="#{bundle.aon_fileupload_element}" />
				<a4j:region>
					<h:panelGrid id="attachGrid" columns="2">
						<aon:outputText rendered="#{aonLoader.aonFile.size > 0}"
							value="#{aonLoader.aonFile.fileName} - ( #{aonLoader.aonFile.size} bytes)" />

						<aon:fileUpload id="attach_file"
							addControlLabel="#{bundle.aon_fileUpload_add}"
							stopControlLabel="#{bundle.aon_fileUpload_stop}"
							stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
							uploadControlLabel="#{bundle.aon_fileUpload_upload}"
							fileUploadListener="#{aonLoader.fileUploaded}" immediateUpload="true"
							autoclear="true" listWidth="0px" listHeight="0px">
							<f:facet name="label">
								<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
							</f:facet>
							<a4j:support event="onuploadcomplete" reRender="attachGrid,aonToolbar,paramsGrid" />
						</aon:fileUpload>

					</h:panelGrid>
				</a4j:region>
			</aon:panelGrid>
			
			<aon:div id="paramsGrid">
				<aon:if test="#{aonLoader.aonFile.size > 0}">
					<aon:panelGrid  columns="2" style="width:90%; margin:10px;">
				
						<aon:outputLabel for="aonLoader_workPlace" value="#{bundle.purchase_workplace}" />
						<aon:selectOneMenu id="aonLoader_workPlace" value="#{aonLoader.params.workPlace}">
							<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						</aon:selectOneMenu>
	
						<aon:outputLabel for="aonLoader_scope_id" value="#{bundle.aon_scope}" />
						<aon:selectOneMenu id="aonLoader_scope_id" value="#{aonLoader.params.scope}" required="true">
							<f:selectItems value="#{configCollections.currentUserScopes}" />
						</aon:selectOneMenu>
		
						<aon:outputLabel for="aonLoader_product_category" value="#{bundle.aon_category}" />
						<aon:selectOneMenu id="aonLoader_product_category" value="#{aonLoader.params.category}" >
							<f:selectItems value="#{productCollections.categories}" />
						</aon:selectOneMenu>
	
						<aon:outputLabel for="aonLoader_accountPeriod" value="#{bundle.aon_financial_year}" />
						<aon:selectOneMenu id="aonLoader_accountPeriod" 
							value="#{aonLoader.params.accountPeriod}">
							<f:selectItems value="#{accountingCollections.enabledAccountPeriods}" />
						</aon:selectOneMenu>
						
						
						<aon:outputText value ="&#160;"/>
						<aon:div>
							<aon:selectBooleanCheckbox id="aonLoader_documentValid"
								value="#{aonLoader.params.documentValidable}" />
							<aon:outputLabel
								for="aonLoader_documentValid"
								value="#{bundle.aon_loader_document}" />
						</aon:div>

						<aon:outputText value ="&#160;"/>
						<aon:div>
							<aon:selectBooleanCheckbox id="aonLoader_forceRegistryInsert"
								value="#{aonLoader.params.forceRegistryInsert}" />
							<aon:outputLabel
								for="aonLoader_forceRegistryInsert"
								value="#{bundle.aon_loader_forceRegistryInsert}" />
						</aon:div>
						
						<aon:outputText value ="&#160;"/>
						<aon:div>
							<aon:selectBooleanCheckbox id="aonLoader_updateAccountDescription"
								value="#{aonLoader.params.updateAccountDescription}" />
							<aon:outputLabel
								for="aonLoader_updateAccountDescription"
								value="En caso de que la cuenta contable que se intenta cargar exista, modificar la descripción con la del fichero." />
						</aon:div>
	
						<aon:if test="#{aonRole.confidentiality}">
							<aon:outputText value ="&#160;"/>
							<aon:div>
								<aon:selectBooleanCheckbox id="aonLoader_securityLevel"
									value="#{aonLoader.params.confidential}" />
								<aon:outputLabel
									for="aonLoader_securityLevel"
									value="#{bundle.aon_confidential}" />
							</aon:div>
						</aon:if>
					</aon:panelGrid>
				</aon:if>
			</aon:div>
		</aon:form>
		
		<aon:panelGroup id="showLoadMessageWindow">
			<aon:if test="#{aonLoader.progressionPanelVisible}">
				<aon:valueParam name="windowHeight" default="50" />
				<rich:modalPanel id="showNewMessageModalPanel" domElementAttachment="parent"
					showWhenRendered="#{aonLoader.progressionPanelVisible}"
					minHeight="70" height="#{windowHeight}" width="250" >
					
					<f:facet name="header">
						<aon:div styleClass="aon-popupWindow-title">
							<aon:outputText value="Confirme, por favor." />
						</aon:div>
					</f:facet>
					
					<f:facet name="controls">
						<aon:form>
							<aon:commandButton type="button" styleClass="aon-popupWindow-close"
								actionListener="#{aonLoader.onStart}"
								immediate="true">
								<rich:componentControl for="showLoadMessageWindow" operation="hide"
									event="onclick" />
							</aon:commandButton>
						</aon:form>
					</f:facet>				
					<aon:form>	
						<aon:commandButton id="launch"
							value="Pulse para Comenzar la carga"
							styleClass="aon-icon-accept"
							disabled="#{!aonLoader.loadPressed}"
							style="padding-left: 15px;"
							actionListener="#{aonLoader.onLoad}"
							reRender="paramsGrid">
							<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
						</aon:commandButton>
					</aon:form>
				</rich:modalPanel>
				<ui:param name="closeButtonReRender" value="showLoadMessageWindow" />
				<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
					<ui:param name="logPanelTitle" value="#{bundle.aon_loader_module}" />
					<ui:param name="pollInterval" value="2000" />
				</ui:include>		
			</aon:if>
		</aon:panelGroup>
		
	</ui:define>
</ui:composition>
