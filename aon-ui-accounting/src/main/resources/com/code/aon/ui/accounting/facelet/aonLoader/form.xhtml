<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

	 	<a4j:region>
        	<h:form>
            	<a4j:poll id="poll" interval="500" enabled="#{aonLoader.enablePolling}" 
            		reRender="poll,execute,messagesContainer" focus="scrollTo"/>
        	</h:form>
    	</a4j:region>

		<aon:form id="aonLoaderForm">

    		<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{accountingBundle.aon_loader_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_form}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="execute" 
						value="#{accountingBundle.aon_loader_load}"
						actionListener="#{aonLoader.onLoad}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						rendered="#{aonLoader.aonFile.size > 0}"
						disabled="#{aonLoader.enablePolling}"
						reRender="poll,execute,paramsGrid"
						focus="scrollTo"
						onclick="if (!confirm('Se va a cargar  el contenido del archivo. Desea continuar?')) return false;"/>
					<aon:htmlCommandLink  id="help" target="_new" 
						value="#{bundle.aon_help}"
						actionListener="#{aonLoader.onHelp}"
						styleClass="aon-finding-toolbar-item aon-icon-menu-help"/>
				</ui:define>
			</ui:decorate>

			<aon:panelGrid columns="2" style="width:90%; margin:10px;">
				<aon:outputLabel for="attach_file" value="#{bundle.aon_fileupload_element}" />
				<a4j:region>
					<h:panelGrid id="attachGrid" columns="2">
						<aon:outputText rendered="#{aonLoader.aonFile.size > 0}"
							value="#{aonLoader.aonFile.fileName} - ( #{aonLoader.aonFile.size} bytes)" />
						<aon:fileUpload id="attach_file"
							addControlLabel="#{bundle.aon_fileUpload_add}"
							stopControlLabel="#{bundle.aon_fileUpload_stop}"
							stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
							uploadControlLabel="#{bundle.aon_fileUpload_upload}"
							fileUploadListener="#{aonLoader.fileUploaded}" immediateUpload="true"
							autoclear="true" listWidth="0px" listHeight="0px">
							<f:facet name="label">
								<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
							</f:facet>
							<a4j:support event="onuploadcomplete" reRender="attachGrid,aonToolbar,paramsGrid" />
						</aon:fileUpload>
					</h:panelGrid>
				</a4j:region>
			</aon:panelGrid>
			
			<aon:div id="paramsGrid">
				<c:if test="#{aonLoader.aonFile.size > 0}">
					<aon:panelGrid  columns="2" style="width:90%; margin:10px;">
				
						<aon:outputLabel for="aonLoader_workPlace" value="#{companyBundle.company_workplace}" />
						<aon:selectOneMenu id="aonLoader_workPlace" value="#{aonLoader.params.workPlace}" required="true">
							<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						</aon:selectOneMenu>
	
						<aon:outputLabel for="aonLoader_scope_id" value="#{bundle.aon_scope}" />
						<aon:selectOneMenu id="aonLoader_scope_id" value="#{aonLoader.params.scope}" required="true">
							<f:selectItems value="#{configCollections.currentUserScopes}" />
						</aon:selectOneMenu>
		
						<aon:outputLabel for="aonLoader_product_category" value="#{productBundle.product_category}" />
						<aon:selectOneMenu id="aonLoader_product_category" value="#{aonLoader.params.category}" required="true">
							<f:selectItems value="#{productCollections.categories}" />
						</aon:selectOneMenu>
	
						<aon:outputLabel for="aonLoader_accountPeriod" value="#{accountingBundle.accounting_period}" />
						<aon:selectOneMenu id="aonLoader_accountPeriod" required="true"
							value="#{aonLoader.params.accountPeriod}">
							<f:selectItems value="#{accountingCollections.enabledAccountPeriods}" />
						</aon:selectOneMenu>
	
						<c:if test="#{aonRole.confidentiality}">
							<aon:outputText value ="&#160;"/>
							<aon:div>
								<aon:selectBooleanCheckbox id="aonLoader_securityLevel"
									value="#{aonLoader.params.confidential}" />
								<aon:outputLabel
									for="aonLoader_securityLevel"
									value="#{bundle.aon_confidential}" />
							</aon:div>
						</c:if>
					</aon:panelGrid>
	
					<aon:div id="messagesContainer" rendered="#{aonLoader.enablePolling or aonLoader.logString != null}"  
							style="height:300px;
								   overflow: auto; 
								   background-color:#444444; 
								   color: #DDDDDD;
								   font-family: Monospace;
								   margin: 10px; 
								   padding: 10px;">
						<aon:outputText value ="#{aonLoader.logString}" escape="false"/>
						<aon:inputText id="scrollTo" value="&#160;" size="1" style="border: solid white 0px; background-color:#444444; "/>
						<aon:outputText value ="Procesando ...." rendered="#{aonLoader.enablePolling}"/>
					</aon:div>
				</c:if>
			</aon:div>

		</aon:form>
		
<!-- 		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
 -->
	</ui:define>

</ui:composition>
