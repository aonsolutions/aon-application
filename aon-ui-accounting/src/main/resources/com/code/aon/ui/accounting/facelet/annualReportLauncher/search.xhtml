<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_annual_report_launcher_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />

				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="annualReportLauncher-report"
						value="#{bundle.aon_listing}" target="_blank" 
						actionListener="#{annualReportLauncher.onExecutePDF}"
						title="#{bundle.aon_listing}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="annualReportLauncher-report-html"
						value="#{bundle.aon_listing}" target="_blank" 
						actionListener="#{annualReportLauncher.onExecute}"
						action="annualReport_preview"
						title="#{bundle.aon_listing}"
						styleClass="aon-finding-toolbar-item aon-icon-report"
						accesskey="#{bundle.aon_key_print}">
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />

					<aon:outputLabel for="annualReportLauncher_annualReport"
						value="#{accountingBundle.accounting_annual_report_launcher_module}" />
					<aon:selectOneMenu id="annualReportLauncher_annualReport"
						required="true" value="#{annualReportLauncher.annualReport}">
						<f:selectItem value="#{null}" itemLabel=" " />
						<f:selectItems value="#{accountingCollections.annualReports}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="annualReportLauncher_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu required="true" id="annualReportLauncher_accountPeriod"
						value="#{annualReportLauncher.params.period}">
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
					</aon:selectOneMenu>
<!--  
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_exclude_operating"
							value="#{annualReportLauncher.params.excludeOperatingEntry}" />
						<aon:outputLabel for="Account_exclude_operating"
							value="#{accountingBundle.accounting_exclude_operating_entry}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_exclude_closing"
							value="#{annualReportLauncher.params.excludeClosingEntry}" />
						<aon:outputLabel for="Account_exclude_closing"
							value="#{accountingBundle.accounting_exclude_closing_entry}" />
					</aon:div>
 -->
					<c:if test="#{aonRole.confidentiality}">
						<aon:outputLabel for="annualReportLauncher_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneRadio id="annualReportLauncher_securityLevel"
							value="#{annualReportLauncher.params.securityLevel}">
							<f:selectItems value="#{commonCollections.confidentialValues}" />
							<f:selectItem itemValue="" itemLabel="#{bundle.aon_all}" />
						</aon:selectOneRadio>
					</c:if>

					<aon:outputText value="&#160;" />
					<aon:outputText value="&#160;" />
				</ui:define>
			</ui:decorate>

		</aon:form>
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
