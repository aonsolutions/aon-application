<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="addInvoicePanelWindow">
		<c:if test="#{amortization.addInvoicePanelVisible}">
			<rich:modalPanel id="addInvoiceModalPanel" minHeight="450"
				minWidth="750" rendered="#{amortization.addInvoicePanelVisible}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{accountingBundle.accounting_amortization_link_invoices} '#{amortization.to.description}'" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="addInvoicePanelWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{amortization.addInvoicePanelVisible}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="amortizationaddInvoiceForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="amortization_addInvoice"
										value="#{bundle.aon_accept}"
										actionListener="#{amortization.onAddInvoice}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<f:setPropertyActionListener
											target="#{amortization.addInvoicePanelVisible}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="amortizationaddInvoice-cancel"
										value="#{bundle.aon_cancel}"
										reRender="addInvoicePanelWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{amortization.addInvoicePanelVisible}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:dataTable value="#{amortization.investmentInvoices}" var="addInv">
									
										<aon:column styleClass="aon-editDataTable-textColumn">
											<aon:selectBooleanCheckbox id="Checked_Invoice_Amortization"
												value="#{amortization.checkedInvestmentInvoice}" />
										</aon:column>

										<aon:column styleClass="aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_date}" />
											</f:facet>
											<aon:outputText value="#{addInv.issueDate}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>
				
										<aon:column styleClass="aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_document_number}" />
											</f:facet>
											<aon:outputText value="#{addInv.documentNumber}" />
										</aon:column>
									
										<aon:column styleClass="aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_company_name}" />
											</f:facet>
											<aon:outputText value="#{addInv.registryName}">
												<aon:abbreviateConverter maxWidth="50" />
											</aon:outputText>
										</aon:column>
					
										<aon:column styleClass="aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_status}" />
											</f:facet>
											<aon:outputText value="#{addInv.status}" />
										</aon:column>
					
										<aon:column styleClass="aon-editDataTable-numberColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_total}" />
											</f:facet>
											<aon:outputText value="#{addInv.total}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:column>
									</aon:dataTable>								
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
