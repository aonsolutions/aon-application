<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="socialInsuranceEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle"
					value="#{bundle.accounting_social_insurance_entry_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_reset}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save"
						value="#{bundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}"
						title="#{bundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{socialInsuranceEntry.onAccept}"
						action="#{socialInsuranceEntry.accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.accounting_entry_generate}?')) return false;" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_search"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width: 100%"
					columnClasses="aon-panelGrid-odd aon-width-200,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="AccountEntry_accountPeriod"
						value="#{bundle.aon_financial_year}" />
					<aon:div>
						<aon:selectOneMenu id="AccountEntry_accountPeriod"
							value="#{socialInsuranceEntry.entry.period}">
							<f:selectItems
								value="#{accountingCollections.enabledAccountPeriods}" />
							<a4j:support event="onchange" ajaxSingle="true"
								reRender="AccountEntry_accountPeriod,Account_salaryEntry" />
						</aon:selectOneMenu>
						<aon:if test="#{aonRole.confidentiality}">
							<aon:selectBooleanCheckbox id="AccountEntry_securityLevel"
								styleClass="aon-margin-left"
								disabled="#{socialInsuranceEntry.entry.paymentAdjustable}"
								value="#{socialInsuranceEntry.entry.confidential}">
								<a4j:support
									 event="onchange" ajaxSingle="true" limitToList="true"
									 actionListener="#{socialInsuranceEntry.onResetBalance}" />
							</aon:selectBooleanCheckbox>
							<aon:outputText styleClass="aon-italic aon-margin-right"
								value="#{bundle.aon_confidential}" />
						</aon:if>
					</aon:div>

					<aon:outputLabel for="Account_date" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Account_date" required="true"
						value="#{socialInsuranceEntry.entry.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" ajaxSingle="true"
						reRender="Account_salaryEntry">
					</aon:selectInputDate>

					<aon:outputLabel for="Account_registryBank"
						value="#{bundle.aon_bank}" />
					<aon:selectOneMenu id="Account_registryBank"
						value="#{socialInsuranceEntry.entry.registryBank}">
						<f:selectItem
							itemLabel="#{bundle.accounting_def_cash_acc}"
							value="#{null}" />
						<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_concept"
						value="#{bundle.aon_concept}" />
					<rich:comboBox id="Account_concept"
						suggestionValues="#{accountingCollections.conceptsDescriptions}"
						value="#{socialInsuranceEntry.entry.concept}" required="true"
						maxlength="32" width="200" directInputSuggestions="true"
						inputStyle="font-family: arial,lucida Grande, Trebuchet MS,sans-serif;font-size:1em;"
						buttonDisabledStyle="display:none;"
						buttonInactiveStyle="display:none;" buttonStyle="display:none;" />

					<aon:outputLabel for="Account_amount" value="#{bundle.aon_amount}" />
					<aon:inputText id="Account_amount" reRender="Account_total"
						value="#{socialInsuranceEntry.entry.amount}" size="15"
						ajaxSingle="true" focus="Account_recharge" />

					<aon:outputLabel for="Account_recharge"
						value="#{bundle.fiscal_extra_charge}" />
					<aon:div>
						<aon:inputText id="Account_recharge" reRender="Account_total"
							value="#{socialInsuranceEntry.entry.recharge}" size="15"
							ajaxSingle="true" focus="Account_recharge_account" />
						<aon:selectOneMenu id="Account_recharge_account"
							value="#{socialInsuranceEntry.entry.rechargeAccount}"
							style="width: 380px; margin-left: 10px;">
							<f:selectItems value="#{accountCollections.expensesAccounts}" />
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputLabel for="Account_total"
						value="#{bundle.aon_total}" />
					<aon:inputText id="Account_total"
						value="#{socialInsuranceEntry.entry.total}" size="15"
						disabled="true" />

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_paymentAdjustable"
							ajaxSingle="true"
							reRender="Account_month,Account_year,AccountEntryDetail_accountEntry_entryDate-From,AccountEntryDetail_accountEntry_entryDate-To,StatementContainer,AccountEntry_securityLevel"
							value="#{socialInsuranceEntry.entry.paymentAdjustable}" />
						<aon:outputLabel for="Account_paymentAdjustable"
							value="#{bundle.accounting_payment_adjustable}" />
					</aon:div>

					<aon:outputLabel for="Account_month"
						value="#{bundle.accounting_payment_adjust_month}" />
					<aon:div>
						<aon:selectOneMenu id="Account_month" required="true"
							disabled="#{!socialInsuranceEntry.entry.paymentAdjustable}"
							value="#{socialInsuranceEntry.entry.month}">
							<a4j:support event="onchange"
								actionListener="#{socialInsuranceEntry.onChangeMonth}"
								ajaxSingle="true"
								reRender="StatementContainer,AccountEntryDetail_accountEntry_entryDate-From,AccountEntryDetail_accountEntry_entryDate-To"/>
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{commonCollections.months}" />
						</aon:selectOneMenu>
						<aon:selectOneMenu id="Account_year" style="margin-left: 20px;"
							disabled="#{!socialInsuranceEntry.entry.paymentAdjustable}"
							required="true" value="#{socialInsuranceEntry.entry.year}">
							<a4j:support event="onchange"
								actionListener="#{socialInsuranceEntry.onChangePeriod}"
								ajaxSingle="true"
								reRender="StatementContainer,AccountEntryDetail_accountEntry_entryDate-From,AccountEntryDetail_accountEntry_entryDate-To"/>
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
						</aon:selectOneMenu>

						<aon:outputText value="#{bundle.aon_date_from}" styleClass="aon-margin-left aon-italic"/>
						<aon:selectInputDate 
							id="AccountEntryDetail_accountEntry_entryDate-From"
							required="true" value="#{socialInsuranceEntry.entry.fromDate}"
							disabled="#{!socialInsuranceEntry.entry.paymentAdjustable}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="oninputchange" actionListener="#{socialInsuranceEntry.onResetBalance}" reRender="StatementContainer" ajaxSingle="true" />
							<a4j:support event="onchanged" actionListener="#{socialInsuranceEntry.onResetBalance}" reRender="StatementContainer" ajaxSingle="true" />
						</aon:selectInputDate>
						<aon:outputText value="#{bundle.aon_date_to}" styleClass="aon-italic"/>
						<aon:selectInputDate 
							id="AccountEntryDetail_accountEntry_entryDate-To"
							required="true" value="#{socialInsuranceEntry.entry.toDate}"
							disabled="#{!socialInsuranceEntry.entry.paymentAdjustable}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="oninputchange" actionListener="#{socialInsuranceEntry.onResetBalance}" reRender="StatementContainer" ajaxSingle="true" />
							<a4j:support event="onchanged" actionListener="#{socialInsuranceEntry.onResetBalance}" reRender="StatementContainer" ajaxSingle="true" />
						</aon:selectInputDate>
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div id="StatementContainer">
						<aon:if test="#{!socialInsuranceEntry.paymentAdjustDisabled}">
							<aon:outputText
								value="#{socialInsuranceEntry.socialInsuranceAccount.fullDescription}" />
							<aon:outputText styleClass="aon-italic"
								value="&#160;#{bundle.account_debit_balance}:&#160;" />
							<aon:outputText styleClass="aon-bold"
								value="#{socialInsuranceEntry.socialInsuranceBalance.unpaidBalance}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
							<aon:outputText styleClass="aon-italic"
								value="&#160;#{bundle.account_credit_balance}:&#160;" />
							<aon:outputText styleClass="aon-bold"
								value="#{socialInsuranceEntry.socialInsuranceBalance.creditBalance}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>

							<aon:editDataTable id="entryDetailTable" var="to"
								style="margin-top: 10px;"
								value="#{socialInsuranceEntry.socialInsuranceDetailModel}" rows="100">

								<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto aon-nowrap">
									<aon:selectBooleanCheckbox value="#{to.disabled}">
										<a4j:support
											 event="onchange" ajaxSingle="true" limitToList="true"
											 reRender="StatementContainer"
											 actionListener="#{socialInsuranceEntry.onDisable}"/>
									</aon:selectBooleanCheckbox>
								</aon:column>

								<aon:column
									styleClass="aon-editDataTable-textColumn aon-width-auto aon-nowrap">
									<aon:div styleClass="aon-nowrap" style="width: 90%;">
										<aon:outputText value="#{to.detail.account.id}" />
										<aon:panelGroup styleClass="aon-italic"
											style="font-size: 0.8em; margin-left: 10px;">
											<aon:outputText value="#{to.detail.account.description}">
												<aon:abbreviateConverter maxWidth="50" />
											</aon:outputText>
										</aon:panelGroup>
									</aon:div>
								</aon:column>

								<aon:column
									styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-150">
									<f:facet name="entry">
										<aon:outputText value="#{bundle.aon_concept}" />
									</f:facet>
									<aon:outputText value="#{to.detail.concept}" styleClass="aon-nowrap" />
								</aon:column>

								<aon:column
									styleClass="aon-editDataTable-numberColumn aon-width-80">
									<aon:outputText value="#{to.detail.debit}" style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:column>

								<aon:column
									styleClass="aon-editDataTable-numberColumn aon-width-80">
									<aon:outputText value="#{to.detail.credit}"
										style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:column>

								<aon:column
									styleClass="aon-editDataTable-textColumn aon-width-150">
									<aon:div ajaxRendered="true" style="width: 90%;">
										<aon:outputText value="#{to.detail.balancingAccount.id}" />
										<rich:toolTip value="#{to.detail.balancingAccount.description}"
											hideEvent="onmouseout" showDelay="200">
										</rich:toolTip>
									</aon:div>
								</aon:column>
							</aon:editDataTable>
							
						</aon:if>
					</aon:div>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
