<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountingFinanceCheckerForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.accounting_finance_checker_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-search"
						title="#{bundle.aon_key_cancel_accelerator}" immediate="true"
						value="#{bundle.aon_back}" 
						action="accountingFinanceChecker_list" 
						actionListener="#{accountingFinanceChecker.onBack}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panel style="background-color:#f6f5e3; padding: 0px; margin-bottom: 5px;">
					<aon:div style="text-align:left; padding: 0px; margin: 0px;">
						<h:panelGrid columns="2" styleClass="aon-width-all"
							columnClasses="aon-width-250,aon-width-auto">
							<aon:div>
								<aon:div styleClass="aon-margin-bottom">
									<aon:outputText styleClass="aon-italic aon-margin-right" value="#{bundle.finance_show} " />
									<aon:commandLink value="Todo"
										style="margin-left: 5px; text-decoration: underline;"
										actionListener="#{accountingFinanceChecker.onStrippedStatementAll}"/>
									<aon:commandLink value="Descruadres"
										style="margin-left: 5px; text-decoration: underline;"
										actionListener="#{accountingFinanceChecker.onStrippedStatementUnsettled}"/>
									<aon:commandLink value="Cuadrados"
										style="margin-left: 5px; text-decoration: underline;"
										actionListener="#{accountingFinanceChecker.onStrippedStatementSettled}"/>
								</aon:div>
							</aon:div>
							<aon:div>
								<aon:outputText 
									value="#{accountingFinanceChecker.selectedAccountCode} - #{accountingFinanceChecker.selectedAccountDescription}"
									style="padding-left: 20px; font-size: 1.2em; font-weight: bold"/>
							</aon:div> 
						</h:panelGrid>
					</aon:div>
				</aon:panel>

				<aon:dataTable id="accountingFinanceCheckerData"
					value="#{accountingFinanceChecker.strippedModel}" var="to" rows="0"
					columnClasses="aon-editDataTable-iconColumn,
								   aon-editDataTable-iconColumn,
								   aon-editDataTable-iconColumn,
								   aon-editDataTable-textColumn aon-width-auto,
								   aon-editDataTable-numberColumn aon-width-120,
								   aon-editDataTable-numberColumn aon-width-120,
								   aon-editDataTable-numberColumn aon-width-120,
								   aon-editDataTable-numberColumn aon-width-120,
								   aon-editDataTable-numberColumn aon-width-120,
								   aon-editDataTable-iconColumn">

			<aon:rowSelector id="accountingFinanceCheckerData-select"
				toggleOnClick="false"/>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandLink id="stripped_invoices-search"
							immediate="#{true}"
							title="#{bundle.finance_invoice}"
							styleClass="aon-icon-invoice"
							style="padding-left: 18px;"
							value="&#160;"
							action="#{accountingFinanceChecker.strippedStatementShowInvoices}">
						</aon:commandLink>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandLink id="stripped_finances-search"
							immediate="#{true}"
							styleClass="aon-icon-treasury"
							style="padding-left: 18px;"
							title="#{bundle.finance_checking}"
							actionListener="#{accountingFinanceChecker.onStrippedStatementShowFinances}"
							value="&#160;"
							action="finance_form">
						</aon:commandLink>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandLink id="stripped_entries-search"
							immediate="#{true}"
							styleClass="aon-icon-accounting"
							style="padding-left: 18px;"
							value="&#160;"
							title="#{bundle.accounting_entry_generated}"
							actionListener="#{accountingFinanceChecker.onStrippedStatementShowEntries}"
							action="accountEntry_form">
						</aon:commandLink>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_document_number}" />
						</f:facet>
						<aon:outputText value="#{to.documentNumber}"/>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.account_debit}" />
						</f:facet>
						<aon:outputText value="#{to.debit}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.account_credit}" />
						</f:facet>
						<aon:outputText value="#{to.credit}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>
					
					<aon:column style="#{to.settled?'':'color:red;'}">
						<f:facet name="header">
							<aon:outputText value="#{bundle.account_debit_balance}" />
						</f:facet>
						<aon:outputText
							rendered="#{to.debitBalance != 0}" 
							value="#{to.debitBalance}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column style="#{to.settled?'':'color:red;'}">
						<f:facet name="header">
							<aon:outputText value="#{bundle.account_credit_balance}" />
						</f:facet>
						<aon:outputText
							rendered="#{to.creditBalance != 0}" 
							value="#{to.creditBalance}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.accounting_fin_balance}" />
						</f:facet>
						<aon:outputText value="#{to.financeAmount}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column style="#{to.settled?'':'color:red;'}">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText 
							rendered="#{to.settled}" 
							value="&#160;"  
							styleClass="aon-icon-checked" 
							style="padding-left: 18px; margin-top: 10px;"/>	
					</aon:column>
				</aon:dataTable>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
