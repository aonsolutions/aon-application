<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.accounting_reports_launcher_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />

				<ui:define name="additionalToolbarContent">
					<aon:panelGroup id="ReportButonsContainer">
						<aon:htmlCommandLink id="reportsLauncher-report-html"
							value="#{bundle.aon_listing}" target="_blank" 
							actionListener="#{reportsLauncher.onExecute}"
							rendered="#{reportsLauncher.reportEnabled}"
							title="#{bundle.aon_listing}"
							styleClass="aon-finding-toolbar-item aon-icon-report"
							accesskey="#{bundle.aon_key_print}">
						</aon:htmlCommandLink>
						<aon:htmlCommandLink id="reportsLauncher-report"
							value="#{bundle.aon_listing}" target="_blank" 
							actionListener="#{reportsLauncher.onExecutePDF}"
							rendered="#{reportsLauncher.pdfEnabled}"
							title="#{bundle.aon_listing}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf"
							accesskey="#{bundle.aon_key_print}">
						</aon:htmlCommandLink>
						<aon:htmlCommandLink id="validate-report-html"
							value="#{bundle.aon_login_validate}" target="_blank" 
							actionListener="#{reportsLauncher.onValidate}"
							rendered="#{reportsLauncher.aonFile.size > 0 and reportsLauncher.pdfEnabled}"
							title="#{bundle.aon_login_validate}"
							styleClass="aon-finding-toolbar-item aon-icon-version-chekin"
							accesskey="#{bundle.aon_key_print}">
						</aon:htmlCommandLink>
					</aon:panelGroup>
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />

					<aon:outputLabel for="reportsLauncher_accountPeriod"
						value="#{bundle.aon_financial_year}" />
					<aon:selectOneMenu required="true" id="reportsLauncher_accountPeriod"
						value="#{reportsLauncher.params.period}">
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_useDefaultTemplate"
							value="#{reportsLauncher.useDefaultTemplate}">
							<a4j:support event="onchange" reRender="aonContent" ajaxSingle="true" actionListener="#{reportsLauncher.onChangeUseDefaultTemplate}" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="Account_useDefaultTemplate"
							value="#{bundle.accounting_launcher_default_template}" />
						<aon:outputText value="&#160;" />
						<aon:htmlCommandLink id="reportsLauncher-download-report-html"
							rendered="#{reportsLauncher.useDefaultTemplate}"
							value="[#{bundle.accounting_launcher_default_template_download}]" 
							target="_blank" style="text-decoration: underline;"
							actionListener="#{reportsLauncher.onDefaultTemplate}"
							title="#{bundle.aon_listing}"
							accesskey="#{bundle.aon_key_print}">
						</aon:htmlCommandLink>
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_useAttachedTemplate"
							value="#{reportsLauncher.useAttachedTemplate}">
							<a4j:support event="onchange" reRender="aonContent" ajaxSingle="true" actionListener="#{reportsLauncher.onChangeUseAttachedTemplate}" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="Account_useAttachedTemplate"
							value="#{bundle.accounting_launcher_attached_template}" />
						<aon:outputText value="&#160;" />
						<aon:selectOneMenu required="true" id="reportsLauncher_reportTemplate"
							rendered="#{reportsLauncher.useAttachedTemplate}"
							value="#{reportsLauncher.reportTemplate}">
							<f:selectItem itemValue="#{null}" itemLabel="-"/>
							<f:selectItems value="#{accountingCollections.reportTemplates}" />
							<a4j:support event="onchange" reRender="aonContent" ajaxSingle="true" actionListener="#{reportsLauncher.onChangeReportTemplate}" />
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_useLoadedTemplate"
							value="#{reportsLauncher.useLoadedTemplate}">
							<a4j:support event="onchange" reRender="aonContent" ajaxSingle="true" actionListener="#{reportsLauncher.onChangeUseLoadedTemplate}" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="Account_useLoadedTemplate"
							value="#{bundle.accounting_launcher_load_template}" />
						<aon:outputText value="&#160;" />
						<a4j:region rendered="#{reportsLauncher.useLoadedTemplate}">
							<h:panelGrid id="attachGrid" columns="2" >
								<aon:outputText rendered="#{reportsLauncher.aonFile.size > 0}"
									value="#{reportsLauncher.aonFile.fileName} - ( #{reportsLauncher.aonFile.size} bytes)" />
								<aon:div>
									<aon:fileUpload id="attach_file"
										addControlLabel="#{bundle.aon_fileUpload_add}"
										stopControlLabel="#{bundle.aon_fileUpload_stop}"
										stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
										uploadControlLabel="#{bundle.aon_fileUpload_upload}"
										fileUploadListener="#{reportsLauncher.fileUploaded}" immediateUpload="true"
										autoclear="true" listWidth="0px" listHeight="0px">
										<f:facet name="label">
											<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
										</f:facet>
										<a4j:support event="onuploadcomplete" reRender="attachGrid,ReportButonsContainer,aonMessagesContainer" />
									</aon:fileUpload>
									<aon:outputText value="#{reportsLauncher.message}" style="margin-left: 10px; color:red"/>
								</aon:div>
							</h:panelGrid>
						</a4j:region>
					</aon:div>


					
					<aon:outputText value="&#160;" />
					<aon:outputText value="&#160;" />
				</ui:define>
			</ui:decorate>

		</aon:form>
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
