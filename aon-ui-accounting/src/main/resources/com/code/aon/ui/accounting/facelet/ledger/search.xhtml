<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"	
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_ledger_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{ledgerReport.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="ledger_list" />

					<aon:outputLabel for="reportDate"
						value="#{accountingBundle.accounting_report_date}" />
					<aon:selectInputDate id="reportDate"
						value="#{ledgerReport.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{ledgerReport.period}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate 
							id="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{ledgerReport.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate 
							id="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{ledgerReport.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:panelGrid>

					<aon:outputLabel for="Account_id"
						value="#{accountBundle.account_account}" />
					<aon:inputText id="Account_id" value="#{ledgerReport.account}"
						size="14" />
					
					<c:if test="#{aonRole.confidentiality}">
	 					<aon:outputLabel
							for="AccountEntryDetail_accountEntry_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneRadio value="#{ledgerReport.securityLevel}" 
							id="AccountEntryDetail_accountEntry_securityLevel">
							<f:selectItems value="#{commonCollections.confidentialValues}" />
							<f:selectItem itemValue="" itemLabel="#{bundle.aon_all} " />
						</aon:selectOneRadio>
					</c:if>
					
					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_order"
						value="#{accountingBundle.accounting_show_order}" />
					<aon:selectOneMenu value="#{ledgerReport.order}" 
						id="AccountEntryDetail_accountEntry_order">
						<f:selectItem itemLabel="#{accountingBundle.accounting_show_entry_date}" itemValue="1" />
						<f:selectItem itemLabel="#{accountingBundle.accounting_show_entry_id}" itemValue="2" />
						<f:selectItem itemLabel="#{accountingBundle.accounting_show_entry_journal}" itemValue="3" />
					</aon:selectOneMenu>
					
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_show_cover"
							value="#{ledgerReport.coverVisible}" />
						<aon:outputLabel for="Account_show_cover"
							value="#{accountingBundle.accounting_show_cover}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_continue_counter"
							reRender="Account_page_counter"
							value="#{ledgerReport.counterVisible}" />
						<aon:outputLabel for="Account_continue_counter"
							value="#{accountingBundle.accounting_continue_counter}" />
						<aon:inputText id="Account_page_counter"
							styleClass="aon-margin-left"
							disabled="#{!ledgerReport.counterVisible}"
							value="#{ledgerReport.pageCounter}" size="6"/>
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
