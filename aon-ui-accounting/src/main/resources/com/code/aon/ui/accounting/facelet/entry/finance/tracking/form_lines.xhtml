<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-toolbar" rendered="#{financeTrackingEntry.lines.rowCount > 0}">
	
		<aon:commandButton title="#{bundle.aon_check_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkAll"
			value="#{bundle.aon_check_all}"
			actionListener="#{financeTrackingEntry.checkAllLines}" reRender="lineDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
		<aon:commandButton title="#{bundle.aon_uncheck_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkNone"
			value="#{bundle.aon_uncheck_all}"
			actionListener="#{financeTrackingEntry.checkNoneLines}" reRender="lineDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
		<aon:commandButton title="#{bundle.accounting_finance_remove_record_list}"
			styleClass="aon-finding-toolbar-item aon-icon-newFolder"
			value="#{bundle.accounting_finance_remove_record_list}"
			actionListener="#{financeTrackingEntry.onRemoveSelected}" 
			reRender="financeTrackingEntryForm,financePanelTabSet"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
	</aon:div>

	<aon:div id="lineDataDiv">
		<aon:dataTable id="lineData" value="#{financeTrackingEntry.lines}" sortMode="multi"
			var="to" rows="20" rendered="#{financeTrackingEntry.lines.rowCount > 0}"
			columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
				aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
				aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn">				
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:selectBooleanCheckbox id="Checked_Lines"
					value="#{financeTrackingEntry.rowCheckedLines}"
					valueChangeListener="#{financeTrackingEntry.rowSelectedLines}"/>	
			</aon:column>

			<aon:column sortBy="#{to.trackingDate}"
				sortOrder="#{financeTrackingEntry.order['FinanceTracking_trackingDate']}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.trackingDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column sortBy="#{to.finance.referenceCode}"
				sortOrder="#{financeTrackingEntry.order['FinanceTracking_finance_invoice_referenceCode']}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.finance_invoice}" />
				</f:facet>
				<aon:outputText value="#{to.finance.referenceCode}" />
			</aon:column>
			
			<aon:column sortBy="#{to.finance.concept}"
				sortOrder="#{financeTrackingEntry.order['FinanceTracking_finance_concept']}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_document_number}" />
				</f:facet>
				<h:outputText value="#{to.finance.concept}" />
			</aon:column>

			<aon:column sortBy="#{to.finance.registryName}"
				sortOrder="#{financeTrackingEntry.order['FinanceTracking_finance_registryName']}">
				<f:facet name="header">
					<aon:outputText value="#{(finance.payment) ? (bundle.aon_creditor) : (bundle.finance_debtor)}" />
				</f:facet>
				<aon:outputText value="#{to.finance.registryName}" />
			</aon:column>
	
			<aon:column sortBy="#{to.type}"
				sortOrder="#{financeTrackingEntry.order['FinanceTracking_type']}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.type}"/>
			</aon:column>
	
			<aon:column sortBy="#{to.finance.payMethod.name}"
				sortOrder="#{financeTrackingEntry.order['FinanceTracking_finance_payMethod_name']}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.finance_payMethod}" />
				</f:facet>
				<aon:outputText value="#{to.finance.payMethod.name}" />
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.finance_deposit}" />
				</f:facet>
				<aon:outputText value="#{to.registryBank.fullName}" rendered="#{to.registryBank != null}"/>
				<aon:outputText value="#{to.payMethodTypeDetail.description}" rendered="#{to.payMethodTypeDetail != null}"/>
			</aon:column>
	
			<aon:column sortBy="#{to.finance.totalAmount}"
				sortOrder="#{financeTrackingEntry.order['FinanceTracking_finance_totalAmount']}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText value="#{to.finance.totalAmount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
			
		</aon:dataTable>
		
		<aon:dataScroller2 for="lineData" showNote="false" />
	</aon:div>
	
</ui:composition>
