<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountList">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_amortization_type_module}" />
				<ui:param name="controller" value="#{amortizationType}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable id="amortizationTypeDataList"
					value="#{amortizationType.model}" rows="20" var="to"
					rendered="#{amortizationType.model.rowCount > 0}">

					<aon:rowSelector action="amortizationType_form"
						actionListener="#{amortizationType.onSelect}" />

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-300" alias="AmortizationType.description">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}" />
					</aon:column>
					
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" alias="AmortizationType.fixedAssetAccount">
						<f:facet name="header">
							<aon:outputLabel value="&#160;" />
						</f:facet>
						
						<aon:div styleClass="aon-nowrap">
							<aon:outputText value="#{to.fixedAssetAccount}" />
							<aon:outputText value=" - " />
							<aon:outputText value="#{to.fixedAssetAccountDescription}" />
						</aon:div>
						
						<aon:div styleClass="aon-nowrap">
							<aon:outputText value="#{to.accumulatedAccount}" />
							<aon:outputText value=" - " />
							<aon:outputText value="#{to.accumulatedAccountDescription}" />
						</aon:div>

						<aon:div styleClass="aon-nowrap">
							<aon:outputText value="#{to.allocationAccount}"/>
							<aon:outputText value=" - " />
							<aon:outputText value="#{to.allocationAccountDescription}" />
						</aon:div>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-80" alias="AmortizationType.percentage">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_percentage}" />
						</f:facet>
						<aon:outputText value="#{to.percentage}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:outputText value="%" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_years}" />
						</f:facet>
						<aon:outputText value="#{to.years}" />
					</aon:column>


				</aon:dataTable>
				<aon:dataScroller2 for="amortizationTypeDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
