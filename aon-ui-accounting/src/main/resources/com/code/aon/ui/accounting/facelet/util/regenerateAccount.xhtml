<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:div style="color:red; font-size: 1.2em; padding: 5px; text-align:center; border: solid red 1px; margin-bottom: 5px; font-weight: bold;">
			<aon:div>
				<aon:outputLabel value="MÓDULO OBSOLETO. Funcionalidad disponible en la opción 'Utilidades y chequeos contables'." />
			</aon:div>
		</aon:div>

		<aon:form id="checkForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.accounting_regenerate_account_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_form}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="execute" 
						value="EJECUTAR"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"
						actionListener="#{accountRegenerator.regenerateAccount}"
						/>
				</ui:define>
			</ui:decorate>
			
		<aon:div>
			<aon:panelGrid columns="2" style="width:90%; margin:10px auto;"
				columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{bundle.aon_financial_year}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountRegenerator.period}">
						<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
					</aon:selectOneMenu>
					
					<aon:if test="#{aonRole.confidentiality}">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneMenu
							id="AccountEntryDetail_accountEntry_securityLevel"
							value="#{accountRegenerator.securityLevel}">
							<f:selectItem itemValue="#{null}" itemLabel=" -- "/>
							<f:selectItems value="#{commonCollections.confidentialValues}" />
						</aon:selectOneMenu>
					</aon:if>
	
				<aon:outputText value="&#160;" />
				<aon:outputText value="&#160;" />

				<aon:outputText value="Procesos" />
				<aon:div>
					<aon:div>
						<aon:selectBooleanCheckbox value="#{accountRegenerator.journal}" />
						<aon:outputText value="#{bundle.accounting_regenerate_journal_counter_module}" />
					</aon:div>
					<aon:div>
						<aon:selectBooleanCheckbox value="#{accountRegenerator.helper}" />
						<aon:outputText value="#{bundle.accounting_regenerate_helper_module}" />
					</aon:div>
				</aon:div>
			</aon:panelGrid>
		</aon:div>
		</aon:form>
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>

</ui:composition>
