<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

		<aon:panelGrid id="AmortizationDataLeft" columns="2" style="width: 100%;"
			columnClasses="aon-panelGrid-odd aon-width-200
						,aon-panelGrid-even aon-width-auto">
						
			<aon:outputLabel for="Amortization_id" value="#{bundle.aon_id}" />
			<aon:div>
				<aon:inputText id="Amortization_id" value="#{amortization.to.id}"
					size="5" disabled="true" />
				<aon:if test="#{aonRole.confidentiality}">
					<aon:selectBooleanCheckbox id="Amortization_securityLevel"
						styleClass="aon-margin-left"
						value="#{amortization.to.confidential}"/>
					<aon:outputLabel for="Amortization" 
						value="#{bundle.aon_confidential}" />
				</aon:if>
			</aon:div>
			
			<aon:outputLabel for="Amortization_initial_date"
				value="#{bundle.accounting_initial_use_date}" />
			<aon:selectInputDate required="true"
				disabled="#{!amortization.updatable}"
				id="Amortization_initial_date"
				value="#{amortization.to.initialDate}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}"/>

			<aon:outputLabel for="Amortization_amount"
				value="#{bundle.aon_amount}" />
			<aon:inputText id="Amortization_amount" required="true"
				disabled="#{!amortization.updatable}"
				value="#{amortization.to.amount}" size="15" />
				
			<aon:outputLabel for="Amortization_amortizationPeriod"
				value="#{bundle.aon_period}" />
			<aon:selectOneMenu id="Amortization_amortizationPeriod" required="true"
				value="#{amortization.to.feePeriod}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems
					value="#{accountingCollections.amortizationPeriods}" />
			</aon:selectOneMenu>
	
			<aon:outputText value="#{bundle.accounting_amortization_coef}" />
			<aon:panelGroup id="percentage">
				<aon:outputText rendered="#{!amortization.nevv}" 
					value="#{amortization.to.percentage}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:outputText rendered="#{amortization.nevv}" 
					value="#{amortization.to.amortizationType.percentage}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:outputText value="%" />
			</aon:panelGroup>

			<aon:outputText
				rendered="#{amortization.to.deadline != null}"
				value="#{bundle.accounting_cancellation_date}" />
			<aon:outputText value="#{amortization.to.deadline}" rendered="#{amortization.to.deadline != null}">
				<f:convertDateTime type="date"
					pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:panelGrid>

		<aon:panelGrid id="AmortizationDataRight" columns="2" style="width: 100%;"
			columnClasses="aon-panelGrid-odd aon-width-200
						,aon-panelGrid-even aon-width-auto">

			<aon:outputLabel for="Amortization_description"
				value="#{bundle.aon_description}" />
			<aon:inputText id="Amortization_description"
				value="#{amortization.to.description}" required="true" size="50">
				<f:validateLength maximum="64" />
			</aon:inputText>
	
			<aon:if test="#{amortization.nevv}">
				<aon:outputLabel for="Amortization_amortizationType"
					value="#{bundle.accounting_amortization_type}" />
				<aon:selectOneMenu id="Amortization_amortizationType"
					required="true"
					value="#{amortization.to.amortizationType}"
					reRender="fixedAssetAccount,accumulatedAccount,allocationAccount,percentage,AmortizationDetails"
					ajaxSingle="true">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{accountingCollections.amortizationTypes}" />
				</aon:selectOneMenu>
			</aon:if>
			
			<aon:if test="#{!amortization.nevv}">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="&#160;"/>
			</aon:if>
	
			<aon:outputText value="#{bundle.accounting_fixed_asset_account}" />
			<aon:panelGroup id="fixedAssetAccount" styleClass="aon-nowrap">
				<aon:outputText rendered="#{!amortization.nevv}"
					value="#{amortization.to.fixedAssetAccount.fullDescription}" />
				<aon:selectOneMenu id="Amortization_fixedAssetAccount"
					rendered="#{amortization.nevv and amortization.to.amortizationType != null}"
					value="#{amortization.to.fixedAssetAccount}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{amortization.fixedAssetAccounts}" />
				</aon:selectOneMenu>
				<aon:outputText rendered="#{!amortization.nevv and amortization.to.amortizationType == null}" value="&#160;" />
				<aon:commandButton
					value="&#160;"
					title="#{bundle.account_synchronize}"
					style="border: none;width:10px;"
					styleClass="aon-finding-toolbar-item aon-icon-transfer"
					onclick="if (!confirm('#{bundle.account_synchronize}?')){ return false;}"
					rendered="#{amortization.fixedAssetAccountSynchronizable}"
					reRender="AmortizationData"
					actionListener="#{amortization.onFixedAssetAccountSynchronize}">
				</aon:commandButton>
			</aon:panelGroup>
				
	
			<aon:outputText
				value="#{bundle.accounting_accumulated_account}" />
			<aon:panelGroup id="accumulatedAccount" styleClass="aon-nowrap">
				<aon:outputText rendered="#{!amortization.nevv}"
					value="#{amortization.to.accumulatedAccount.fullDescription}" />
				<aon:selectOneMenu id="Amortization_accumulatedAccount"
					rendered="#{amortization.nevv and amortization.to.amortizationType != null}"
					value="#{amortization.to.accumulatedAccount}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{amortization.accumulatedAccounts}" />
				</aon:selectOneMenu>
				<aon:outputText rendered="#{!amortization.nevv and amortization.to.amortizationType == null}" value="&#160;" />
				<aon:commandButton
					value="&#160;"
					title="#{bundle.account_synchronize}"
					onclick="if (!confirm('#{bundle.account_synchronize}?')){ return false;}"
					style="border: none;width:10px;"
					styleClass="aon-finding-toolbar-item aon-icon-transfer"
					rendered="#{amortization.accumulatedAccountSynchronizable}"
					reRender="AmortizationData"
					actionListener="#{amortization.onAccumulatedAccountSynchronize}">
				</aon:commandButton>
			</aon:panelGroup>
	
	
	
			<aon:outputText
				value="#{bundle.accounting_amortization_alloc_account}" />
			<aon:panelGroup id="allocationAccount" styleClass="aon-nowrap">
				<aon:outputText rendered="#{!amortization.nevv}"
					value="#{amortization.to.allocationAccount.fullDescription}" />
				<aon:selectOneMenu id="Amortization_allocationAccount"
					rendered="#{amortization.nevv and amortization.to.amortizationType != null}"
					value="#{amortization.to.allocationAccount}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{amortization.allocationAccounts}" />
				</aon:selectOneMenu>
				<aon:outputText rendered="#{!amortization.nevv and amortization.to.amortizationType == null}" value="&#160;" />
				<aon:commandButton
					value="&#160;"
					title="#{bundle.account_synchronize}"
					onclick="if (!confirm('#{bundle.account_synchronize}?')){ return false;}"
					style="border: none;width:10px;"
					styleClass="aon-finding-toolbar-item aon-icon-transfer"
					rendered="#{amortization.allocationAccountSynchronizable}"
					reRender="AmortizationData"
					actionListener="#{amortization.onAllocationAccountSynchronize}">
				</aon:commandButton>
			</aon:panelGroup>
			
			<aon:outputText
				rendered="#{amortization.to.deadline != null}"
				value="#{bundle.accounting_sale_amount}" />
			<aon:outputText value="#{amortization.to.saleAmount}" rendered="#{amortization.to.deadline != null}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:panelGrid>
		
</ui:composition>
