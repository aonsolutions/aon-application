<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="entryLoaderForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="XXX Carga de Apuntes  XXX" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_form}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="execute" 
						value="XXX Cargar XXX"
						actionListener="#{entryLoader.onLoad}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						rendered="#{entryLoader.aonFile.size > 0}"
						onclick="if (!confirm('Se va a cargar  el contenido del archivo. Desea continuar?')) return false;Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
				</ui:define>
			</ui:decorate>

			<aon:panelGrid columns="2" style="width:90%; margin:10px;">
				<aon:outputLabel for="attach_file" value="#{bundle.aon_fileupload_element}" />
				<a4j:region>
					<h:panelGrid id="attachGrid" columns="2">
						<aon:outputText rendered="#{entryLoader.aonFile.size > 0}"
							value="#{entryLoader.aonFile.fileName} - ( #{entryLoader.aonFile.size} bytes)" />
						<aon:fileUpload id="attach_file"
							addControlLabel="#{bundle.aon_fileUpload_add}"
							stopControlLabel="#{bundle.aon_fileUpload_stop}"
							stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
							uploadControlLabel="#{bundle.aon_fileUpload_upload}"
							fileUploadListener="#{entryLoader.fileUploaded}" immediateUpload="true"
							autoclear="true" listWidth="0px" listHeight="0px">
							<f:facet name="label">
								<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
							</f:facet>
							<a4j:support event="onuploadcomplete" reRender="attachGrid,aonToolbar,paramsGrid" />
						</aon:fileUpload>
					</h:panelGrid>
				</a4j:region>
			</aon:panelGrid>
			
			<aon:div id="paramsGrid">
				<aon:panelGrid  columns="2" style="width:90%; margin:10px;" rendered="#{entryLoader.aonFile.size > 0}">
			
					<aon:outputLabel for="entryLoader_period" value="#{bundle.aon_financial_year}" />
					<aon:selectOneMenu id="entryLoader_period" value="#{entryLoader.period}" required="true">
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="entryLoader_scope_id" value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="entryLoader_scope_id" value="#{entryLoader.scope}" required="true">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<c:if test="#{aonRole.confidentiality}">
						<aon:outputText value ="&#160;"/>
						<aon:div>
							<aon:selectBooleanCheckbox id="entryLoader_securityLevel"
								value="#{entryLoader.confidential}" />
							<aon:outputLabel
								for="entryLoader_securityLevel"
								value="#{bundle.aon_confidential}" />
						</aon:div>
					</c:if>
				</aon:panelGrid>
			</aon:div>

		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>

</ui:composition>
