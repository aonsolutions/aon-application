<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

<ui:define name="content">
	<aon:form id="costCenterList">
		<aon:div ajaxRendered="true" layout="none">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.accounting_cost_center_module}" />
				<ui:param name="controller" value="#{costCenter}" />
			</ui:include>
			
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="controller" value="#{costCenter}" />
					<ui:define name="columns">
						<aon:column	alias="ApplicationParameter.value">
							<f:facet name="header">
								<aon:outputLabel for="CostCenter_value" value="#{bundle.aon_name}" />
							</f:facet>

							<aon:outputText value="#{to.value}" rendered="#{formList}" />
							<aon:inputText rendered="#{formEdit}" required="true"
								id="CostCenter_value" maxlength="64" size="64" 
								value="#{costCenter.to.value}"/>
							<f:facet name="footer">
								<aon:inputText id="CostCenter_value-New"  rendered="#{formNew}"
									maxlength="64" size="64" required="true"
									value="#{costCenter.to.value}" />
							</f:facet>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:div>
	</aon:form>
</ui:define>
</ui:composition>
