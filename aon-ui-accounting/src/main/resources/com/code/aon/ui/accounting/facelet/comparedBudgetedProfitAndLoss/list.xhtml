<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="profitAndLossList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_compared_budgeted_balance_sheet_module}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener"
						value="#{budgetedProfitAndLossComparison.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="compared_budgeted_profit_and_loss_search" />
				</ui:define>
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="&#160;" target="_blank"
						action="#{report.onExecute}"
						title="#{bundle.aon_listing} MS Excel"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="profitAndLossComparison" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink value="&#160;" target="_blank"
						action="#{report.onExecute}"
						title="#{bundle.aon_listing} MS Word 2007"
						styleClass="aon-finding-toolbar-item aon-icon-word aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="profitAndLossComparison" />
						<f:param name="outputFormat" value="DOCX" />
					</h:commandLink>
					<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_listing}" action="#{report.onExecute}">
						<f:param name="reportKey" value="profitAndLossComparison" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
					
				  	<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{accountingBundle.account_comp_account}" actionListener="#{budgetedProfitAndLossComparison.onComparissonList}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="profitAndLossComparisonGraph" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="8" style="width:100%;"
						columnClasses="
						 aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-100
						,aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-100
						,aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-100
						,aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-auto">
					<aon:outputLabel for="reportDate"
						value="#{accountingBundle.accounting_report_date}" />
					<aon:outputText
						value="#{budgetedProfitAndLossComparison.parameters.date}"
						timeZone="#{timeZoneController.timeZone}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
					</aon:outputText>
					
					<aon:outputLabel 
						value="#{accountingBundle.accounting_period}" />
					<aon:outputText styleClass="aon-bold"
						value="#{budgetedProfitAndLossComparison.parameters.period.id}" />
					
					<aon:outputLabel
						value="#{bundle.aon_date_from}" />
					<aon:outputText 
						value="#{budgetedProfitAndLossComparison.parameters.fromDate}"
						timeZone="#{timeZoneController.timeZone}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
					</aon:outputText>

					<aon:outputLabel
						value="#{bundle.aon_date_to}" />
					<aon:outputText 
						value="#{budgetedProfitAndLossComparison.parameters.toDate}"
						timeZone="#{timeZoneController.timeZone}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
					</aon:outputText>
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable value="#{budgetedProfitAndLossComparison.list}"
					var="to" >
					<aon:column
						styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.account_account}"/>
						</f:facet>
						<aon:outputText value="#{to.id}"/>
					</aon:column>
					<aon:column styleClass="aon-editDataTable-textColumn">
					    <f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}"/>
						</f:facet>
						<aon:outputText value="#{to.description}" 
							style="#{(to.id==null)?('font-weight:bold;float:right'):('')}" />
					</aon:column>
					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-150">
					    <f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_accumulated}"/>
						</f:facet>
						<aon:outputText value="#{to.accumulated}" rendered="#{to.accumulated != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>
					<aon:column
						styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_budgeted}"/>
						</f:facet>
						<aon:outputText value="#{to.budgeted}" rendered="#{to.budgeted != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>
					<aon:column
						styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_difference}"/>
						</f:facet>
						<aon:outputText value="#{to.difference}" rendered="#{to.difference != 0}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>
					<aon:column
						styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_percent}"/>
						</f:facet>
						<aon:outputText value="#{to.percent}" rendered="#{to.percent != 0}">
							<f:convertNumber pattern="#,##0.00 %" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
