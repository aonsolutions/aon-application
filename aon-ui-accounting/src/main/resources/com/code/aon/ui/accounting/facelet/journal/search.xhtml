<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_journal_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{journalReport.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="journal_list" />

					<aon:outputLabel for="reportDate"
						value="#{accountingBundle.accounting_report_date}" />
					<aon:selectInputDate id="reportDate"
						value="#{journalReport.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{journalReport.period}">
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate 
							id="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{journalReport.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate 
							id="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{journalReport.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:panelGrid>

					<c:if test="#{aonRole.confidentiality}">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneMenu value="#{journalReport.securityLevel}" 
							id="AccountEntryDetail_accountEntry_securityLevel">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{commonCollections.confidentialValues}" />
						</aon:selectOneMenu>
					</c:if>

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_journal"
						value="#{accountingBundle.accounting_show_order}" />
					<aon:div id="orderContainer">
						<aon:selectOneMenu value="#{journalReport.order}"
							id="AccountEntryDetail_accountEntry_journal">
							<a4j:support event="onchange" actionListener="#{journalReport.onChangeOrder}" reRender="orderContainer" />
							<f:selectItem itemLabel="#{accountingBundle.accounting_show_entry_id}" itemValue="0" />
							<f:selectItem itemLabel="#{accountingBundle.accounting_show_entry_date}" itemValue="1" />
							<f:selectItem itemLabel="#{accountingBundle.accounting_show_entry_journal}" itemValue="2" />
						</aon:selectOneMenu>
						<aon:commandLink styleClass="aon-margin-left aon-bold" style="color:red; text-decoration: underline;"
							value="#{accountingBundle.accounting_regenerate_journal_counter_module}" 
							actionListener="#{journalReport.onRegenerate}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')"
							rendered="#{journalReport.journal and !journalReport.journalCorrect}">
						</aon:commandLink>
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_show_cover"
							value="#{journalReport.coverVisible}" />
						<aon:outputLabel for="Account_show_cover"
							value="#{accountingBundle.accounting_show_cover}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_continue_counter"
							reRender="Account_page_counter"
							value="#{journalReport.counterVisible}" />
						<aon:outputLabel for="Account_continue_counter"
							value="#{accountingBundle.accounting_continue_counter}" />
						<aon:inputText id="Account_page_counter"
							styleClass="aon-margin-left"
							disabled="#{!journalReport.counterVisible}"
							value="#{journalReport.pageCounter}" size="6"/>
					</aon:div>


				</ui:define>
			</ui:decorate>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
