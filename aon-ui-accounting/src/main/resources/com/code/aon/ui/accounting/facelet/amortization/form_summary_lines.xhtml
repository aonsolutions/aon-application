<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:editDataTable id="AmortizationDetailSummaryList" var="to" rows="0"
		value="#{amortizationDetail.summaryModel}">

		<f:facet name="header">
			<rich:columnGroup>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="&#160;" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="#{bundle.aon_date_from}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="#{bundle.aon_date_to}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="#{bundle.aon_percentage}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header" colspan="3">
					<aon:outputText
						value="#{accountingBundle.accounting_account_amortization}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header" colspan="3">
					<aon:outputText
						value="#{accountingBundle.accounting_fiscal_amortization}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="#{accountingBundle.accounting_tax_adjust}" />
				</aon:column>
				<aon:column styleClass="aon-dataTable-header">
					<aon:outputText value="&#160;" />
				</aon:column>
			</rich:columnGroup>
		</f:facet>

		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton actionListener="#{amortizationDetail.onAnnualSelect}"
				rendered="#{to!=amortizationDetail.annualSummary}"
				styleClass="aon-editDataTable-button aon-icon-rowSelector" />
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="#{to.fromDate}">
				<f:convertDateTime type="date" pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="#{to.toDate}">
				<f:convertDateTime type="date" pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="#{to.coefficient}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
			<aon:outputText value="%" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_allocation}" />
			</f:facet>
			<aon:outputText value="#{to.allocation}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_accumulated}" />
			</f:facet>
			<aon:outputText value="#{to.accumulated}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_pending}" />
			</f:facet>
			<aon:outputText value="#{to.pending}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_allocation}" />
			</f:facet>
			<aon:inputText rendered="#{amortizationDetail.annualSummary == to}"
				required="true" value="#{to.fiscalAllocation}" size="8">
			</aon:inputText>
			<aon:outputText rendered="#{amortizationDetail.annualSummary != to}"
				value="#{to.fiscalAllocation}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_accumulated}" />
			</f:facet>
			<aon:outputText value="#{to.fiscalAccumulated}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{accountingBundle.accounting_pending}" />
			</f:facet>
			<aon:outputText value="#{to.fiscalPending}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="#{to.taxAdjust}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>


		<aon:column
			styleClass="aon-editDataTable-buttonsColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:div>
				<aon:outputText value="&#160;" />
				<aon:commandButton id="amortizationDetailTable-save"
					title="#{bundle.aon_accept} (ALT+#{bundle.aon_key_save_line})"
					actionListener="#{amortizationDetail.onAnnualUpdate}"
					rendered="#{to==amortizationDetail.annualSummary}"
					reRender="amortizationForm"
					styleClass="aon-editDataTable-button aon-icon-accept"
					focus="accountId" accesskey="#{bundle.aon_key_save_line}" />
				<aon:commandButton id="amortizationDetailTable-cancel"
					title="#{bundle.aon_cancel} (ALT+#{bundle.aon_key_cancel_line})"
					actionListener="#{amortizationDetail.onAnnualCancel}" immediate="true"
					rendered="#{to==amortizationDetail.annualSummary}"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					accesskey="#{bundle.aon_key_cancel_line}" />
			</aon:div>
		</aon:column>
	</aon:editDataTable>
	
</ui:composition>
