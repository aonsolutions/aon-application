<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountingFinanceCheckerForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.accounting_finance_checker_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-search"
						title="#{bundle.aon_key_cancel_accelerator}" immediate="true"
						value="#{bundle.aon_back}" 
						action="accountingFinanceChecker_list" 
						actionListener="#{accountingFinanceChecker.onBack}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panel style="background-color:#f6f5e3; padding: 0px; margin-bottom: 5px;">
					<aon:div style="text-align:left; padding: 0px; margin: 0px;">
						<h:panelGrid columns="2" styleClass="aon-width-all"
							columnClasses="aon-width-250,aon-width-auto">
							<aon:div>
								<aon:outputText 
									value="#{accountingFinanceChecker.selectedAccountCode} - #{accountingFinanceChecker.selectedAccountDescription}"
									style="padding-left: 20px; font-size: 1.2em; font-weight: bold"/>
								<aon:outputText 
									value="#{bundle.registry_stat_unpayed_finances}"
									style="padding-left: 1em; font-size: 1.2em; font-weight: bold"/>
								<aon:outputText 
									value="#{accountingFinanceChecker.params.deadline}"
									style="padding-left: 1em; font-size: 1.2em; font-weight: bold">
									<f:convertDateTime type="date"
										pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:div> 
						</h:panelGrid>
					</aon:div>
				</aon:panel>
			
				<aon:dataTable id="accountingFinanceCheckerData"
					value="#{accountingFinanceChecker.financesModel}" var="to" rows="0"
					columnClasses="aon-editDataTable-iconColumn,
								   aon-editDataTable-numberColumn aon-width-120,
								   aon-editDataTable-textColumn aon-width-auto,
								   aon-editDataTable-numberColumn aon-width-120,
								   aon-editDataTable-numberColumn aon-width-120">

					<aon:rowSelector id="accountingFinanceCheckerData-select"
						toggleOnClick="false"/>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandLink id="stripped_invoices-search"
							immediate="#{true}"
							title="#{bundle.finance_invoice}"
							styleClass="aon-icon-invoice"
							style="padding-left: 18px;"
							value="&#160;"
							action="#{accountingFinanceChecker.financeShowInvoices}">
						</aon:commandLink>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_document_number}" />
						</f:facet>
						<aon:outputText value="#{to.documentNumber}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_holder}" />
						</f:facet>
						<aon:outputText value="#{to.registryName}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status} Actual" />
						</f:facet>
						<aon:outputText value="#{to.financeStatusEnum}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_amount}" />
						</f:facet>
						<aon:outputText value="#{to.finBalance}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
