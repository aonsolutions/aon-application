<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:outputLabel for="reportDate"
		value="#{bundle.finance_report_date}" />
	<aon:selectInputDate id="reportDate"
		value="#{controller.parameters.date}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}"/>

	<aon:outputLabel
		for="AccountEntryDetail_accountEntry_accountPeriod"
		value="#{bundle.aon_financial_year}" />
	<aon:selectOneMenu id="AccountEntryDetail_accountEntry_accountPeriod"
		value="#{controller.parameters.period}">
		<a4j:support event="onchange"
			actionListener="#{controller.onPeriodChanged}" 
			reRender="AccountEntryDetail_accountEntry_entryDate-From,AccountEntryDetail_accountEntry_entryDate-To,balance-search,SearchWarning,excludeOptions"
			ajaxSingle="true" />
		
		<f:selectItem itemLabel="-" itemValue="" />
		<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
	</aon:selectOneMenu>
	<c:if test="#{!isOfficialBalance}">
		<aon:outputLabel for="Account_id"
			value="#{bundle.account_account}" />
			<aon:div id="links">
				<aon:inputText id="Account_id" value="#{controller.parameters.accountExpression}" size="14" />
				<aon:commandLink id="treasury-search" 
					value="#{bundle.aon_module_finance}" reRender="Account_id" tabindex="1000"
					styleClass="aon-margin-left aon-dataTable-link-simple aon-italic">
					<a4j:actionparam value="57*" assignTo="#{controller.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink id="banks-search" 
					value="#{bundle.aon_banks}" reRender="Account_id" tabindex="1001"  
					styleClass="aon-dataTable-link-simple aon-italic" >
					<a4j:actionparam value="572*" assignTo="#{controller.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink id="cash-search" 
					value="#{bundle.report_pos}" reRender="Account_id" tabindex="1002"  
					styleClass="aon-dataTable-link-simple aon-italic" >
					<a4j:actionparam value="570*" assignTo="#{controller.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink id="publicAdmon-search" 
					value="#{bundle.accounting_publicAdmon}" reRender="Account_id" tabindex="1003"  
					styleClass="aon-dataTable-link-simple aon-italic">
					<a4j:actionparam value="47*" assignTo="#{controller.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink id="customer-search"
					value="#{bundle.customer_finance_checking}" reRender="Account_id" tabindex="1004"  
					styleClass="aon-dataTable-link-simple aon-italic" >
					<a4j:actionparam value="430*" assignTo="#{controller.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink id="supplier-search" 
					value="#{bundle.aon_suppliers}" reRender="Account_id" tabindex="1005"  
					styleClass="aon-dataTable-link-simple aon-italic">
					<a4j:actionparam value="400*" assignTo="#{controller.parameters.accountExpression}"/>
				</aon:commandLink>
				<aon:commandLink id="creditor-search" 
					value="#{bundle.finance_creditor_module}" reRender="Account_id" tabindex="1006"  
					styleClass="aon-dataTable-link-simple aon-italic">
					<a4j:actionparam value="410*" assignTo="#{controller.parameters.accountExpression}"/>
				</aon:commandLink>
			</aon:div>
	
		<aon:outputLabel for="Account_Description"
			value="#{bundle.aon_description}" />
		<aon:inputText id="Account_Description" 
			value="#{controller.parameters.accountDescription}"
			size="50">
		</aon:inputText>
	
		<aon:outputLabel for="Account_Alias"
			value="#{bundle.aon_alias}" />
		<aon:inputText id="Account_Alias" 
			value="#{controller.parameters.accountAlias}"
			size="30">
		</aon:inputText>
	</c:if>
	
	<aon:outputText value="#{bundle.aon_date_select}" />
	<aon:div>
		<aon:selectOneMenu
			id="AccountEntryDetail_accountEntry_quarter"
			value="#{controller.parameters.quarter}"
			valueChangeListener="#{controller.onQuarterChanged}"
			reRender="AccountEntryDetail_accountEntry_entryDate-From,AccountEntryDetail_accountEntry_entryDate-To" 
			ajaxSingle="true">
			<f:selectItem itemValue="#{null}" itemLabel="-" />
			<f:selectItems value="#{accountingCollections.quarters}" />
		</aon:selectOneMenu>

		<aon:outputLabel
			for="AccountEntryDetail_accountEntry_entryDate-From"
			styleClass="aon-form-date-label aon-margin-left aon-margin-right"
			value="#{bundle.aon_date_from}" />
		<aon:selectInputDate
			id="AccountEntryDetail_accountEntry_entryDate-From"
			value="#{controller.parameters.fromDate}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
			<a4j:support event="oninputchange" reRender="balance-search,SearchWarning" ajaxSingle="true" />
			<a4j:support event="onchanged" reRender="balance-search,SearchWarning" ajaxSingle="true" />
		</aon:selectInputDate>

		<aon:outputLabel
			for="AccountEntryDetail_accountEntry_entryDate-To"
			styleClass="aon-form-date-label aon-margin-left aon-margin-right"
			value="#{bundle.aon_date_to}" />
		<aon:selectInputDate
			id="AccountEntryDetail_accountEntry_entryDate-To"
			value="#{controller.parameters.toDate}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
			<a4j:support event="oninputchange" reRender="balance-search,SearchWarning" ajaxSingle="true" />
			<a4j:support event="onchanged" reRender="balance-search,SearchWarning" ajaxSingle="true" />
		</aon:selectInputDate>
	</aon:div>

	<c:if test="#{aonRole.confidentiality}">
		<aon:outputLabel
			for="AccountEntryDetail_accountEntry_securityLevel"
			value="#{bundle.aon_confidential}" />
		<aon:selectOneRadio
			id="AccountEntryDetail_accountEntry_securityLevel"
			value="#{controller.parameters.securityLevel}">
			<f:selectItems value="#{commonCollections.confidentialValues}" />
		</aon:selectOneRadio>
	</c:if>

	<aon:outputText value="&#160;" />
	<aon:div id="excludeOptions">
		<aon:div rendered="#{controller.parameters.period != null and controller.parameters.period.id != null}">
			<aon:selectBooleanCheckbox id="Account_exclude_operating"
				value="#{controller.parameters.excludeOperatingEntry}" />
			<aon:outputLabel for="Account_exclude_operating"
				value="#{bundle.accounting_exclude_operating_entry}" />
		</aon:div>
		<aon:div rendered="#{controller.parameters.period != null and controller.parameters.period.id != null}">
			<aon:selectBooleanCheckbox id="Account_exclude_closing"
				value="#{controller.parameters.excludeClosingEntry}" />
			<aon:outputLabel for="Account_exclude_closing"
				value="#{bundle.accounting_exclude_closing_entry}" />
		</aon:div>
	</aon:div>

	<c:if test="#{!isOfficialBalance}">
		<aon:outputText value="&#160;" />
		<aon:div>
			<aon:selectBooleanCheckbox id="Account_balanced_acounts"
				value="#{controller.parameters.excludeBalancedAccounts}" />
			<aon:outputLabel for="Account_balanced_acounts"
				value="#{bundle.accounting_exclude_balanced_acounts}" />
		</aon:div>
	
		<aon:outputText value="&#160;" />
		<aon:div id ="Account_lower_level_Container">
			<aon:selectBooleanCheckbox id="Account_lower_level"
				ajaxSingle="true" reRender="accountLevelVisibility"
				value="#{controller.parameters.lowerLevelVisible}" />
			<aon:outputLabel for="Account_lower_level"
				value="#{bundle.accounting_lower_level}" />
			<aon:div id="accountLevelVisibility">
				<aon:outputLabel for="Account_fromLevel"
					rendered="#{controller.parameters.lowerLevelVisible}"
					style="margin-left: 10px;"
					styleClass="aon-bold"
					value="#{bundle.aon_date_from} #{bundle.accounting_level}" />
				<aon:selectOneRadio id="Account_fromLevel"
					style="display:inline;"
					rendered="#{controller.parameters.lowerLevelVisible}"
					ajaxSingle="true" required="true"
					value="#{controller.parameters.fromAccountLevel}">
					<f:selectItem itemLabel="1" itemValue="1" itemDisabled="#{!(controller.parameters.accountLevel > 1)}"/>
					<f:selectItem itemLabel="2" itemValue="2" itemDisabled="#{!(controller.parameters.accountLevel > 2)}"/>
					<f:selectItem itemLabel="3" itemValue="3" itemDisabled="#{!(controller.parameters.accountLevel > 3)}"/>
					<f:selectItem itemLabel="4" itemValue="4" itemDisabled="#{!(controller.parameters.accountLevel > 4)}"/>
				</aon:selectOneRadio>
			</aon:div>
		</aon:div>
	</c:if>

	<aon:outputText value="&#160;" />
	<aon:div>
		<aon:selectBooleanCheckbox id="Account_zero_sum"
			value="#{controller.parameters.noTouchedAccountVisible}" />
		<aon:outputLabel for="Account_zero_sum"
			value="#{bundle.accounting_no_touched_account}" />
	</aon:div>


	<aon:outputLabel for="Account_level"
		value="#{bundle.accounting_level}" />
	<aon:div>
		<aon:selectOneRadio id="Account_level"
			ajaxSingle="true"
			reRender="AccountEntryDetail_rowsPerPage_label, AccountEntryDetail_rowsPerPage,accountLevelVisibility"
			value="#{controller.parameters.accountLevel}">
			<f:selectItem itemLabel="1" itemValue="1" />
			<f:selectItem itemLabel="2" itemValue="2" />
			<f:selectItem itemLabel="3" itemValue="3" />
			<f:selectItem itemLabel="4" itemValue="4" />
			<f:selectItem itemLabel="5" itemValue="5" />
		</aon:selectOneRadio>
	</aon:div>

	<aon:outputLabel id="AccountEntryDetail_rowsPerPage_label"
		for="AccountEntryDetail_rowsPerPage"
		value="#{bundle.accounting_lines_to_show}" />
	<aon:selectOneMenu id="AccountEntryDetail_rowsPerPage"
		value="#{controller.parameters.rowsPerPage}"
		disabled="#{controller.parameters.accountLevel == 5}">
		<f:selectItem itemLabel="10" itemValue="10" />
		<f:selectItem itemLabel="20" itemValue="20" />
		<f:selectItem itemLabel="30" itemValue="30" />
		<f:selectItem itemLabel="40" itemValue="40" />
		<f:selectItem itemLabel="#{bundle.aon_common_all}" itemValue="0" />
	</aon:selectOneMenu>

	<aon:outputText value="&#160;" />
	<aon:div>
		<aon:selectBooleanCheckbox id="Account_show_cover"
			value="#{controller.parameters.coverVisible}" />
		<aon:outputLabel for="Account_show_cover"
			value="#{bundle.accounting_show_cover}" />
	</aon:div>

	<aon:outputText value="&#160;" />
	<aon:div>
		<aon:selectBooleanCheckbox id="Account_continue_counter"
			reRender="Account_page_counter"
			value="#{controller.parameters.counterVisible}" />
		<aon:outputLabel for="Account_continue_counter"
			value="#{bundle.accounting_continue_counter}" />
		<aon:inputText id="Account_page_counter"
			styleClass="aon-margin-left"
			disabled="#{!controller.parameters.counterVisible}"
			value="#{controller.parameters.pageCounter}" size="6"/>
	</aon:div>

	<aon:outputText value="" />
	<aon:div id="SearchWarning">
		<aon:outputText value="#{bundle.accounting_statement_warning}"
			style="color:red;" styleClass="aon-bold" 	
			rendered="#{!controller.dateValid}"/>
	</aon:div>
	
	<aon:outputText value="" />
	<aon:div>
		<aon:commandButton id="balance-search"
			styleClass="aon-search-lookup-button"   
			value="#{bundle.aon_search}"
			action="#{action}"
			actionListener="#{controller.onSearch}"
			disabled="#{!controller.dateValid}"
			reRender="#{searchReRender}"
			accesskey="#{bundle.aon_key_search}">
			<aon:actionHotKey key="return" />
		</aon:commandButton>
	</aon:div>
</ui:composition>
