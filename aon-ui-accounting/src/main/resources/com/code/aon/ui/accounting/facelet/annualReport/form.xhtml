<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="annualReportForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_annual_report_module}" />
				<ui:param name="controller" value="#{annualReport}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<h:commandLink id="annualReportDetail-report"
						value="#{bundle.aon_listing}" target="_blank" 
						actionListener="#{annualReportDetail.onExecutePDF}"
						rendered="#{!annualReport.new}"
						title="#{bundle.aon_listing}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
					</h:commandLink>
					<h:commandLink id="annualReportDetail-report-html"
						value="#{bundle.aon_listing}" target="_blank" 
						actionListener="#{annualReportDetail.onExecute}"
						rendered="#{!annualReport.new}"
						action="annualReport_preview"
						title="#{bundle.aon_listing}"
						styleClass="aon-finding-toolbar-item aon-icon-report"
						accesskey="#{bundle.aon_key_print}">
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" dir="true" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-150,
								   aon-panelGrid-even aon-width-auto,
								   aon-panelGrid-odd aon-width-150,
								   aon-panelGrid-even aon-width-auto"
					
					style="margin-bottom=2px;">
					<aon:outputLabel for="AnnualReport_Id" value="#{bundle.aon_id}" />
					<aon:inputText id="AnnualReport_Id" value="#{annualReport.to.id}" disabled="true" size="10"/>

					<aon:outputLabel for="AnnualReport_Name" value="#{bundle.aon_name}" />
					<aon:inputText id="AnnualReport_Name" value="#{annualReport.to.name}" required="true" 
							size="60" maxlength="64">
					</aon:inputText>
				</aon:panelGrid>
				<ui:include src="grid.xhtml" />
			</aon:div>
		</aon:form>
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
