<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="linesContainer" style="width: 99%;">
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
			<ui:param name="controller" value="#{accountEntryDetail}" />
			<ui:param name="columnClasses" value="
				 aon-editDataTable-textColumn aon-width-150 
				,aon-editDataTable-textColumn aon-nowrap
				,aon-editDataTable-textColumn aon-nowrap aon-width-150 
				,aon-editDataTable-numberColumn aon-width-80 
				,aon-editDataTable-numberColumn aon-width-80 
				,aon-editDataTable-textColumn aon-width-150" />

			<ui:define name="columns">

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{accountBundle.account_account}" />
					</f:facet>
					<aon:outputText value="#{to.account.id}"
						rendered="#{to!=accountEntryDetail.to}" />
					<aon:div rendered="#{to==accountEntryDetail.to}">
						<aon:lookupInputText id="Account_Lookup_id-Edit"
							lookup="#{accountLookup}" required="true"
							reRender="Account_Lookup_description-Edit"
							value="#{accountEntryDetail.to.account.id}" size="14" />
						<aon:lookupButton id="Account_Lookup-Edit"
							windowTitle="#{accountBundle.account_selection}"
							selectReRender="Account_Lookup_id-Edit,Account_Lookup_description-Edit"
							lookup="#{accountLookup}" minHeight="440"
							property="#{accountEntryDetail.to.account}">
						</aon:lookupButton>
					</aon:div>
					<f:facet name="footer">
						<aon:div rendered="#{accountEntryDetail.new}">
							<aon:lookupInputText id="Account_Lookup_id-New"
								lookup="#{accountLookup}" required="true"
								reRender="Account_Lookup_description-New"
								value="#{accountEntryDetail.to.account.id}" size="14" />
							<aon:lookupButton id="Account_Lookup-New"
								windowTitle="#{accountBundle.account_selection}"
								selectReRender="Account_Lookup_id-New,Account_Lookup_description-New"
								lookup="#{accountLookup}" minHeight="440"
								property="#{accountEntryDetail.to.account}">
							</aon:lookupButton>
						</aon:div>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_description}" />
					</f:facet>
					<aon:outputText id="Account_Lookup_description-Edit"
						value="#{to.account.description}">
						<aon:abbreviateConverter maxWidth="35" />
					</aon:outputText>
					<f:facet name="footer">
						<aon:outputText id="Account_Lookup_description-New"
							rendered="#{accountEntryDetail.new}"
							value="#{accountEntryDetail.to.account.description}">
							<aon:abbreviateConverter maxWidth="35" />
						</aon:outputText>	
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_concept}" />
					</f:facet>
					<aon:outputText value="#{to.concept}"
						rendered="#{to!=accountEntryDetail.to}" />
					<aon:inputText id="AccountEntryDetail_concept-Edit"
						value="#{accountEntryDetail.to.concept}"
						rendered="#{to==accountEntryDetail.to}" required="true" size="20" />
					<f:facet name="footer">
						<aon:inputText id="AccountEntryDetail_concept-New"
							value="#{accountEntryDetail.to.concept}"
							rendered="#{accountEntryDetail.new}" required="true" size="20" />
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{accountingBundle.accounting_debit}" />
					</f:facet>
					<aon:outputText value="#{to.debit}"
						rendered="#{to!=accountEntryDetail.to}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
					<aon:inputText value="#{accountEntryDetail.to.debit}"
						rendered="#{to==accountEntryDetail.to}" required="true" size="10">
						<f:validateDoubleRange />
					</aon:inputText>
					<f:facet name="footer">
						<aon:div style="text-align:right; font-weight:bold;">
							<aon:outputText value="#{accountEntry.totalDebit}"
								rendered="#{!accountEntryDetail.new}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
							<aon:inputText value="#{accountEntryDetail.to.debit}"
								rendered="#{accountEntryDetail.new}" required="true" size="10">
								<f:validateDoubleRange />
							</aon:inputText>
						</aon:div>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{accountingBundle.accounting_credit}" />
					</f:facet>
					<aon:outputText value="#{to.credit}"
						rendered="#{to!=accountEntryDetail.to}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
					<aon:inputText value="#{accountEntryDetail.to.credit}"
						rendered="#{to==accountEntryDetail.to}" required="true" size="10">
						<f:validateDoubleRange />
					</aon:inputText>
					<f:facet name="footer">
						<aon:div style="text-align:right; font-weight:bold;">
							<aon:outputText value="#{accountEntry.totalCredit}"
								rendered="#{!accountEntryDetail.new}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
							<aon:inputText value="#{accountEntryDetail.to.credit}"
								rendered="#{accountEntryDetail.new}" required="true" size="10">
								<f:validateDoubleRange />
							</aon:inputText>
						</aon:div>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{accountingBundle.accounting_balancing_account}" />
					</f:facet>
					<aon:outputText value="#{to.balancingAccount.id}"
						rendered="#{to!=accountEntryDetail.to}" />
					<aon:div rendered="#{to==accountEntryDetail.to}">
						<aon:lookupInputText id="Account_Lookup_id-Balancing-Edit"
							lookup="#{accountLookup}" required="true"
							value="#{accountEntryDetail.to.balancingAccount.id}" size="14" />
						<aon:lookupButton id="Account_Lookup-Balancing-Edit"
							windowTitle="#{accountBundle.account_selection}"
							selectReRender="Account_Lookup_id-Balancing-Edit"
							lookup="#{accountLookup}" minHeight="440"
							property="#{accountEntryDetail.to.balancingAccount}">
						</aon:lookupButton>
					</aon:div>
					<f:facet name="footer">
						<aon:div rendered="#{accountEntryDetail.new}">
							<aon:lookupInputText id="Account_Lookup_id-Balancing-New"
								lookup="#{accountLookup}" required="true"
								value="#{accountEntryDetail.to.balancingAccount.id}" size="14" />
							<aon:lookupButton id="Account_Lookup-Balancing-New"
								windowTitle="#{accountBundle.account_selection}"
								selectReRender="Account_Lookup_id-Balancing-New"
								lookup="#{accountLookup}" minHeight="440"
								property="#{accountEntryDetail.to.balancingAccount}">
							</aon:lookupButton>
						</aon:div>
					</f:facet>
				</aon:column>
			</ui:define>
		</ui:decorate>
	</aon:div>
</ui:composition>
