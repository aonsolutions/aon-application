<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="linesContainer" style="width: 99%;" >
		<aon:div rendered="#{!accountEntry.nevv}" >

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
				<ui:param name="controller" value="#{accountEntryDetail}" />
				<ui:param name="showDataScroller" value="#{!accountEntryDetail.nevv}" />
				<ui:param name="dataTableFooterClass" value="aon-dataTable-footerClass" />
				<ui:param name="skipSelectRow" value="true" />
				<ui:param name="skipLineEdition" value="true" />
				<ui:param name="skipEditButtons" value="true" />
				<ui:define name="columns">

					<aon:if test="#{accountEntry.updatable}">
						<aon:column id="entryDetailTable-selectColumn"
							styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:commandButton id="entryDetailTable-select"
								title="#{bundle.aon_update}" 
								actionListener="#{accountEntryDetail.onSelect}"
								rendered="#{to!=accountEntryDetail.to}"
								reRender="#{resetButtonReRender}"
								styleClass="aon-editDataTable-button aon-icon-rowSelector"
								focus="Account_Id" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton id="entryDetailTable-reset"
										title="#{bundle.aon_reset} (ALT+#{bundle.aon_key_new_line})" 
										actionListener="#{accountEntryDetail.onReset}" 
										rendered="#{!accountEntryDetail.nevv and (!accountEntry.to.invoiceEntry or !exporter.configuration.configured)}"
										styleClass="aon-editDataTable-button aon-icon-reset"
										accesskey="#{bundle.aon_key_new_line}"
										focus="Account_Id-NEW" />
								</aon:div>
							</f:facet>
						</aon:column>
					</aon:if>
	
					<f:facet name="footer">
						<rich:columnGroup
							 rendered="#{accountEntryDetail.nevv}">
							<aon:column colspan="#{accountEntry.updatable?'3':'2'}">
								<aon:outputText value="&#160;" />
							</aon:column>
							<aon:column>
								<aon:div styleClass="aon-italic aon-bold aon-text-right">
									<aon:outputText value="#{accountEntry.totalDebit}"
										style="#{accountEntry.balanced?'color:green':'color:red'}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:div>
							</aon:column>
							<aon:column>
								<aon:div styleClass="aon-italic aon-bold aon-text-right">
									<aon:outputText value="#{accountEntry.totalCredit}"
										style="#{accountEntry.balanced?'color:green':'color:red'}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:div>
							</aon:column>
							<aon:column colspan="2">
								<aon:outputText value="&#160;" />
							</aon:column>
						</rich:columnGroup>
					</f:facet>
	
					<aon:column
						styleClass="aon-editDataTable-textColumn aon-width-auto aon-nowrap">
						<f:facet name="header">
							<aon:outputLabel for="Account_id" value="#{bundle.account_account}" />
						</f:facet>
	
						<aon:div style="width: 90%;"
							rendered="#{to!=accountEntryDetail.to or !accountEntryDetail.updatable}" styleClass="aon-nowrap">
	
							<aon:commandLink id="accountStatement-search" 
								immediate="#{true}"
								styleClass="aon-dataTable-link"
								rendered="#{accountEntry.statementAvailable}"
								actionListener="#{accountEntryDetail.onAccountStatement}"
								title="#{bundle.accounting_statement_module}"
								action="accountStatement_list"
								reRender="aonContent">
									<aon:outputText value="#{to.account.code}" />
							</aon:commandLink>
							<aon:outputText rendered="#{!accountEntry.statementAvailable}" value="#{to.account.code}" />
							<aon:panelGroup styleClass="aon-italic"
								style="font-size: 0.8em; margin-left: 10px;">
								<aon:outputText value="#{to.account.description}">
									<aon:abbreviateConverter maxWidth="50" />
								</aon:outputText>
							</aon:panelGroup>
						</aon:div>
	
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupTo" value="#{accountEntryDetail.to.account}" />
							<ui:param name="lookupRendered" value="#{to==accountEntryDetail.to and accountEntryDetail.updatable}" />
							<ui:param name="idRequired" value="true" />				
							<ui:param name="lookupInputOnFocus" value="AccountEntryDetail_concept-Edit" />
						</ui:include>
						<f:facet name="footer">
							<aon:div styleClass="aon-nowrap">
								<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="lookupSuffix" value="-New" />
									<ui:param name="lookupTo" value="#{accountEntryDetail.to.account}" />
									<ui:param name="lookupRendered" value="#{accountEntryDetail.nevv}" />
									<ui:param name="idRequired" value="true" />
									<ui:param name="lookupInputOnFocus" value="AccountEntryDetail_concept-New" />				
								</ui:include>
							</aon:div>
						</f:facet>
					</aon:column>
	
					<aon:column
						styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-150">
						<f:facet name="header">
							<aon:outputLabel for="AccountEntryDetail_concept" value="#{bundle.aon_concept}" />
						</f:facet>
						<aon:outputText value="#{to.concept}" styleClass="aon-nowrap"
							rendered="#{to!=accountEntryDetail.to or !accountEntryDetail.updatable}" />
						<aon:inputText id="AccountEntryDetail_concept"
							value="#{accountEntryDetail.to.concept}"
							rendered="#{to==accountEntryDetail.to and accountEntryDetail.updatable}" 
							required="true" size="15" maxlength="32"/>
						<f:facet name="footer">
							<aon:div>
								<aon:inputText id="AccountEntryDetail_concept-New"
									value="#{accountEntryDetail.to.concept}"
									rendered="#{accountEntryDetail.nevv}" 
									required="true" size="15" maxlength="32" />
			
								<a4j:region>
									<rich:suggestionbox for="AccountEntryDetail_concept-New"
										suggestionAction="#{accountingCollections.getConceptsDescriptions}" var="result"
										minChars="3" immediate="true" limitToList="true" ajaxSingle="true"
										eventsQueue="AccountEntryDetail_concept-New-Sug" ignoreDupResponses="true"
										requestDelay="100" width="200" height="100"
										nothingLabel="#{bundle.aon_search_no_results}">
										<aon:column>
											<aon:outputText value="#{result}" />
										</aon:column>
										<a4j:support event="onselect" limitToList="true" 
											reRender="AccountEntryDetail_concept-New"
											focus="AccountEntryDetail_concept-New">
											<f:setPropertyActionListener target="#{accountEntryDetail.to.concept}" value="#{result}" />
										</a4j:support>
										
									</rich:suggestionbox>
								</a4j:region>						
							</aon:div>
						</f:facet>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="AccountEntryDetail_debit" value="#{bundle.account_debit}" />
						</f:facet>
						<aon:outputText value="#{to.debit}"
							rendered="#{to!=accountEntryDetail.to or !accountEntryDetail.updatable}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:inputText id="AccountEntryDetail_debit" value="#{accountEntryDetail.to.debit}"
							rendered="#{to==accountEntryDetail.to and accountEntryDetail.updatable}" 
							required="true" size="8">
							<f:validateDoubleRange />
							<a4j:support event="onchange" ajaxSingle="true"
								eventsQueue="debitChange" ignoreDupResponses="true"
								reRender="AccountEntryDetail_debit,AccountEntryDetail_credit" focus="AccountEntryDetail_credit"/>
							<a4j:support event="onkeyup"
								onsubmit="if(event.keyCode != 120) return false;"
								eventsQueue="debitKeyUp" ignoreDupResponses="true"
								reRender="AccountEntryDetail_debit,AccountEntryDetail_credit"
								requestDelay="100"
								actionListener="#{accountEntryDetail.onBalanceDebit}">
							</a4j:support>
						</aon:inputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-italic"
								style="text-align:right; font-weight:bold;">
								<aon:inputText id="AccountEntryDetail_debit-NEW" value="#{accountEntryDetail.to.debit}"
									rendered="#{accountEntryDetail.nevv}" required="true" size="8">
									<f:validateDoubleRange />
									<a4j:support event="onchange" ajaxSingle="true"
										eventsQueue="debitChange" ignoreDupResponses="true"
										reRender="AccountEntryDetail_debit-NEW,AccountEntryDetail_credit-NEW" focus="AccountEntryDetail_credit-NEW" />
								</aon:inputText>
								<aon:outputText value="#{accountEntry.totalDebit}"
									style="#{accountEntry.balanced?'color:green':'color:red'}"
									rendered="#{!accountEntryDetail.nevv}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="AccountEntryDetail_credit" value="#{bundle.account_credit}" />
						</f:facet>
						<aon:outputText value="#{to.credit}"
							rendered="#{to!=accountEntryDetail.to or !accountEntryDetail.updatable}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:inputText id="AccountEntryDetail_credit" value="#{accountEntryDetail.to.credit}"
							rendered="#{to==accountEntryDetail.to and accountEntryDetail.updatable}"
							required="true" size="8">
							<f:validateDoubleRange />
							<a4j:support event="onchange" ajaxSingle="true"
								eventsQueue="creditChange" ignoreDupResponses="true"
								reRender="AccountEntryDetail_debit,AccountEntryDetail_credit" focus="Account_idBalancingAccount" />
							<a4j:support event="onkeyup"
								onsubmit="if(event.keyCode != 120) return false;"
								eventsQueue="debitKeyUp" ignoreDupResponses="true"
								requestDelay="100"
								reRender="AccountEntryDetail_debit,AccountEntryDetail_credit"
								actionListener="#{accountEntryDetail.onBalanceCredit}">
							</a4j:support>
						</aon:inputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-italic"
								style="text-align:right; font-weight:bold;">
								<aon:inputText id="AccountEntryDetail_credit-NEW" value="#{accountEntryDetail.to.credit}"
									rendered="#{accountEntryDetail.nevv}" required="true" size="8">
									<f:validateDoubleRange />
									<a4j:support event="onchange" ajaxSingle="true"
										eventsQueue="creditChange" ignoreDupResponses="true"
										reRender="AccountEntryDetail_debit-NEW,AccountEntryDetail_credit-NEW" 
										focus="Account_idBalancingAccount-NEW" />
								</aon:inputText>
								<aon:outputText value="#{accountEntry.totalCredit}"
									style="#{accountEntry.balanced?'color:green':'color:red'}"
									rendered="#{!accountEntryDetail.nevv}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-150 aon-nowrap">
						<f:facet name="header">
							<aon:outputLabel for="Account_idBalancingAccount"
								value="#{bundle.finance_balancing_account}" />
						</f:facet>
	
						<aon:div style="width: 90%;" rendered="#{to!=accountEntryDetail.to}" ajaxRendered="true">
							<aon:outputText value="#{to.balancingAccount.code}" />
							<rich:toolTip value="#{to.balancingAccount.description}"
								hideEvent="onmouseout" showDelay="200">
							</rich:toolTip>
						</aon:div>
	 
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupSuffix" value="BalancingAccount" />
							<ui:param name="lookupTo" value="#{accountEntryDetail.to.balancingAccount}" />
							<ui:param name="lookupRendered" value="#{to==accountEntryDetail.to}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="skipGoToButton" value="#{true}" />
							<ui:param name="skipSuggestText" value="#{true}" />
							<ui:param name="lookupInputOnFocus" value="AccountEntryDetail_documentNumber-Edit" />
						</ui:include>
	 					<f:facet name="footer">
							<aon:div styleClass="aon-nowrap">
								<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="lookupSuffix" value="BalancingAccount-NEW" />
									<ui:param name="lookupTo" value="#{accountEntryDetail.to.balancingAccount}" />
									<ui:param name="lookupRendered" value="#{accountEntryDetail.nevv}" />
									<ui:param name="skipNewButton" value="#{true}" />
									<ui:param name="skipGoToButton" value="#{true}" />
									<ui:param name="skipSuggestText" value="#{true}" />
									<ui:param name="lookupInputOnFocus" value="AccountEntryDetail_documentNumber-New" />
								</ui:include>
							</aon:div>
						</f:facet>
					</aon:column>
	
					<aon:column
						styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-100">
						<f:facet name="header">
							<aon:outputLabel for="AccountEntryDetail_documentNumber"
								 value="#{bundle.account_document_number}" />
						</f:facet>
						<aon:outputText value="#{to.documentNumber}" styleClass="aon-nowrap"
							rendered="#{to!=accountEntryDetail.to or !accountEntryDetail.updatable}" />
						<aon:inputText id="AccountEntryDetail_documentNumber"
							value="#{accountEntryDetail.to.documentNumber}"
							rendered="#{to==accountEntryDetail.to and accountEntryDetail.updatable}" 
							required="false" size="10" maxlength="32"/>
						<f:facet name="footer">
							<aon:inputText id="AccountEntryDetail_documentNumber-New"
								value="#{accountEntryDetail.to.documentNumber}"
								rendered="#{accountEntryDetail.nevv}" 
								required="false" size="10" maxlength="32"/>
						</f:facet>
					</aon:column>
	
					<aon:column
						styleClass="aon-editDataTable-buttonsColumn aon-vertical-align-top">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:div>
								<aon:div rendered="#{formList}" layout="none">
									<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
										<ui:param name="auditableTO" value="#{to}" />
									</ui:include>
								</aon:div>						
								<aon:outputText value="&#160;" />
								<aon:commandButton id="entryDetailTable-save"
									title="#{bundle.aon_accept} (ALT+#{bundle.aon_key_save_line})"
									actionListener="#{accountEntryDetail.onAccept}"
									rendered="#{to==accountEntryDetail.to}"
									reRender="accountEntryDetailDataDiv"
									styleClass="aon-editDataTable-button aon-icon-accept"
									focus="accountId" accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton id="entryDetailTable-cancel"
									title="#{bundle.aon_cancel} (ALT+#{bundle.aon_key_cancel_line})"
									actionListener="#{accountEntryDetail.onCancel}" immediate="true"
									rendered="#{to==accountEntryDetail.to}"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:commandButton id="entryDetailTable-remove"
									title="#{bundle.aon_remove} (ALT+#{bundle.aon_key_remove_line})"
									immediate="true" 
									rendered="#{to==accountEntryDetail.to and accountEntryDetail.updatable}"
									reRender="accountEntryDetailDataDiv"
									onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
									actionListener="#{accountEntryDetail.onRemove}"
									styleClass="aon-editDataTable-button aon-icon-delete"
									accesskey="#{bundle.aon_key_remove_line}" />
								<aon:if test="#{!accountEntryDetail.nevv}">
									<rich:jQuery timing="onload" selector="#Account_ClearButton" query="focus()"/>
								</aon:if>
						</aon:div>
						<f:facet name="footer">
							<aon:div styleClass="aon-nowrap">
								<aon:outputText value="&#160;" />
								<aon:commandButton id="entryDetailTable-new-save"
									title="#{bundle.aon_save} (ALT+#{bundle.aon_key_save_line})"
									actionListener="#{accountEntryDetail.onAccept}"
									rendered="#{accountEntryDetail.nevv}"
									reRender="accountEntryDetailDataDiv"
									styleClass="aon-editDataTable-button aon-icon-accept"
									onclick="disabled=true"								
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton id="entryDetailTable-new-cancel"
									title="#{bundle.aon_cancel} (ALT+#{bundle.aon_key_cancel_line})"
									rendered="#{accountEntryDetail.nevv}" immediate="true"
									confirmTitle="#{bundle.aon_confirm_title}"
									onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
									actionListener="#{accountEntryDetail.onCancel}"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									accesskey="#{bundle.aon_key_cancel_line}" />
	
								<aon:if test="#{accountEntryDetail.nevv and accountEntryDetail.to.account.id ==null}">
									<rich:jQuery timing="onload" selector="#Account_id-New" query="focus()"/>
								</aon:if>
								<aon:if test="#{accountEntryDetail.nevv and accountEntryDetail.to.account.id !=null}">
									<rich:jQuery timing="onload" selector="#Account_ClearButton-New" query="focus()"/>
								</aon:if>
								
							</aon:div>
						</f:facet>
					</aon:column>
				</ui:define>
			</ui:decorate>
		</aon:div>
	</aon:div>
</ui:composition>
