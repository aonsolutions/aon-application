<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.accounting_finance_checker_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="skipClearButton" value="true" />
				
				<ui:define name="beforeToolbarContent">
					<aon:commandButton id="#{toolbarID}-clear"
							value="#{bundle.aon_clear}"
							actionListener="#{accountingFinanceChecker.onStart}"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
				</ui:define>
			</ui:decorate>
			
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />

					<aon:outputLabel for="accountingFinanceChecker_deadline"
						value="#{bundle.accounting_finance_checker_date}" />
					<aon:selectInputDate id="accountingFinanceChecker_deadline"
						value="#{accountingFinanceChecker.params.deadline}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Show_Creditors"
							value="#{accountingFinanceChecker.params.creditorsEnabled}" />
						<aon:outputLabel for="Show_Creditors"
							value="#{bundle.accounting_show_creditors}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Show_Suppliers"
							value="#{accountingFinanceChecker.params.suppliersEnabled}" />
						<aon:outputLabel for="Show_Suppliers"
							value="#{bundle.accounting_show_suppliers}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Show_Customers"
							value="#{accountingFinanceChecker.params.customersEnabled}" />
						<aon:outputLabel for="Show_Customers"
							value="#{bundle.accounting_show_customers}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:commandButton id="accountingFinanceChecker-search"
							styleClass="aon-search-lookup-button"
							value="#{bundle.aon_search}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')"
							actionListener="#{accountingFinanceChecker.onSearch}"
							action="accountingFinanceChecker_list">
							<aon:actionHotKey key="return" />
						</aon:commandButton>
					</aon:div>
				</ui:define>
			</ui:decorate>

		</aon:form>
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
