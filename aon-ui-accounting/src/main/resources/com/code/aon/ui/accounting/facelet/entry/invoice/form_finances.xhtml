<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:if test="#{invoiceEntry.registryFilled}">
		<aon:panel>
			<f:facet name="header">
				<aon:outputText value="#{bundle.finance_checking}" />
			</f:facet>
			<aon:editDataTable id="FinancesData" var="financeTo" rows="0"
				value="#{invoiceEntry.finances}"
				columnClasses="aon-editDataTable-iconColumn, 
						aon-width-100  aon-editDataTable-textColumn,
						aon-width-200  aon-editDataTable-textColumn,
						aon-width-auto aon-editDataTable-textColumn,
						aon-width-80 aon-editDataTable-textColumn, 
						aon-width-100  aon-editDataTable-numberColumn,
						aon-editDataTable-buttonsColumn">
	
				<aon:rowSelector immediate="true"
					rendered="#{financeTo!=invoiceEntry.currentFinance}"				
					actionListener="#{invoiceEntry.onSelectFinance}" />
	
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<f:facet name="footer">
						<aon:div>
							<aon:commandButton id="newFinance" value=""
								reRender="FinancesData"
								styleClass="aon-editDataTable-button aon-icon-new"
								title="#{bundle.aon_key_new_line}"
								actionListener="#{invoiceEntry.onNewFinance}"
								rendered="#{!invoiceEntry.newFinance}"
								focus="Account_Finance_DueDate"
								accesskey="#{bundle.aon_key_new_line}" />
						</aon:div>
					</f:facet>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.aon_date}"
							for="Account_Finance_DueDate" />
					</f:facet>
					<aon:outputText rendered="#{financeTo!=invoiceEntry.currentFinance}"
						value="#{financeTo.dueDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:selectInputDate id="Account_Finance_DueDate"
						rendered="#{financeTo==invoiceEntry.currentFinance}"
						value="#{invoiceEntry.currentFinance.dueDate}" inputSize="8"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
					<f:facet name="footer">
						<aon:selectInputDate id="Account_Finance_DueDate-New"
							rendered="#{invoiceEntry.newFinance}"
							value="#{invoiceEntry.currentFinance.dueDate}" inputSize="8"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</f:facet>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel for="Account_Finance_PayMethod"
							value="#{bundle.finance_payMethod}" />
					</f:facet>
					<aon:outputText value="#{financeTo.payMethod.name}"
						rendered="#{financeTo!=invoiceEntry.currentFinance}" />
					<aon:selectOneMenu id="Account_Finance_PayMethod"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{financeTo==invoiceEntry.currentFinance}"
						valueChangeListener="#{invoiceEntry.onPayMethodChanged}"
						reRender="AccountFinance_bankAccount_panel"
						value="#{invoiceEntry.currentFinance.payMethod}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu id="Account_Finance_PayMethod-New"
							styleClass="aon-form-selectOneMenu-field"
							rendered="#{invoiceEntry.newFinance}"
							valueChangeListener="#{invoiceEntry.onPayMethodChanged}"
							reRender="AccountFinance_bankAccount_panel-New"
							value="#{invoiceEntry.currentFinance.payMethod}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{configCollections.payMethods}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
	
				<aon:column styleClass="aon-nowrap">
					<f:facet name="header">
						<aon:div>
							<aon:outputLabel value="#{bundle.aon_bank_account}" />
						</aon:div>
					</f:facet>
					<aon:outputText value="#{financeTo.bankDescription}"
						rendered="#{financeTo!=invoiceEntry.currentFinance}" />
					<aon:div id="AccountFinance_bankAccount_panel" styleClass="aon-nowrap" rendered="#{financeTo==invoiceEntry.currentFinance}">
						<aon:panelGroup id="AccountFinance_bankAccount" rendered="#{invoiceEntry.showBankManualInput}">
							<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
								<ui:param name="bankAccountController" value="#{invoiceEntry.accountHelper}" />
								<ui:param name="bankAccountPrefix" value="AccountFinance" />
								<ui:param name="bankCodeChangeReRender" value="AccountFinance_bankAlias,AccountFinance_bic" />
							</ui:include>
							<aon:commandLink id="bankAccount_hide_manualInput" ajaxSingle="true"
								rendered="#{invoiceEntry.showBankManualInput and invoiceEntry.allBanksCount>0}"  
								reRender="AccountFinance_bankAccount_panel"
								styleClass="aon-icon-edit-end aon-margin-left" style="padding-right: 20px;padding-top: 0px;"
								value="&#160;" title="#{bundle.aon_key_cancel_line_description}" >
								<f:setPropertyActionListener target="#{invoiceEntry.showBankManualInput}"
									value="#{false}" />
							</aon:commandLink>
						</aon:panelGroup>
						<aon:div styleClass="aon-italic">
							<aon:div style="margin-top:2px; font-size:0.9em;" rendered="#{invoiceEntry.showBankManualInput}">
								<aon:outputLabel for="AccountFinance_bankAlias" styleClass="aon-margin-right"
									value="#{bundle.aon_bank}" />
								<aon:inputText id="AccountFinance_bankAlias"
									value="#{invoiceEntry.currentFinance.bankAlias}" 
									required="true" size="25" maxlength="25" />
								<aon:outputLabel for="AccountFinance_bic" styleClass="aon-margin-left aon-margin-right"
									value="#{bundle.aon_bic}" />
								<aon:inputText id="AccountFinance_bic"
									value="#{invoiceEntry.currentFinance.bic}" validator="BICValidator" 
									required="true" size="12" maxlength="11">
								</aon:inputText>
							</aon:div>

							<aon:selectOneMenu id="AccountFinance_RegistryBank"
								rendered="#{!invoiceEntry.showBankManualInput}"
								reRender="AccountFinance_bankAccount_panel"
								value="#{invoiceEntry.currentBank}"
								valueChangeListener="#{invoiceEntry.onRBankChanged}">
								<f:selectItem value="#{null}" />
								<f:selectItems value="#{invoiceEntry.allBanks}" />
							</aon:selectOneMenu>
							<aon:commandLink id="bankAccount_show_manualInput" ajaxSingle="true"
								rendered="#{!invoiceEntry.showBankManualInput}"  
								reRender="AccountFinance_bankAccount_panel"
								styleClass="aon-icon-edit-add aon-margin-left" style="padding-right: 20px;padding-top: 0px;"
								value="&#160;" title="#{bundle.aon_edit}" >
								<f:setPropertyActionListener target="#{invoiceEntry.showBankManualInput}"
									value="#{true}" />
							</aon:commandLink>
						</aon:div>
					</aon:div>
					<f:facet name="footer">
						<aon:div id="AccountFinance_bankAccount_panel-New" styleClass="aon-nowrap" rendered="#{invoiceEntry.newFinance}">
							<aon:panelGroup id="AccountFinance_bankAccount-New" rendered="#{invoiceEntry.showBankManualInput}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
									<ui:param name="bankAccountController" value="#{invoiceEntry.accountHelper}" />
									<ui:param name="bankAccountPrefix" value="AccountFinance" />
									<ui:param name="bankAccountSuffix" value="-New" />
									<ui:param name="bankCodeChangeReRender" value="AccountFinance_bankAlias-New,AccountFinance_bic-New" />
								</ui:include>
								<aon:commandLink id="bankAccount_hide_manualInput-New" ajaxSingle="true"
									rendered="#{invoiceEntry.showBankManualInput and invoiceEntry.allBanksCount>0}"  
									reRender="AccountFinance_bankAccount_panel-New"
									styleClass="aon-icon-edit-end aon-margin-left" style="padding-right: 20px;padding-top: 0px;"
									value="&#160;" title="#{bundle.aon_key_cancel_line_description}" >
									<f:setPropertyActionListener target="#{invoiceEntry.showBankManualInput}"
										value="#{false}" />
								</aon:commandLink>
							</aon:panelGroup>
							<aon:div styleClass="aon-italic">
								<aon:div style="margin-top:2px; font-size:0.9em;" rendered="#{invoiceEntry.showBankManualInput}">
									<aon:outputLabel for="AccountFinance_bankAlias-New" styleClass="aon-margin-right"
										value="#{bundle.aon_bank}" />
									<aon:inputText id="AccountFinance_bankAlias-New"
										value="#{invoiceEntry.currentFinance.bankAlias}" 
										required="true" size="25" maxlength="25" />
									<aon:outputLabel for="AccountFinance_bic-New" styleClass="aon-margin-left aon-margin-right"
										value="#{bundle.aon_bic}" />
									<aon:inputText id="AccountFinance_bic-New"
										value="#{invoiceEntry.currentFinance.bic}" validator="BICValidator" 
										required="true" size="12" maxlength="11">
									</aon:inputText>
								</aon:div>

								<aon:selectOneMenu id="AccountFinance_RegistryBank-New"
									rendered="#{!invoiceEntry.showBankManualInput}"
									reRender="AccountFinance_bankAccount_panel-New"
									value="#{invoiceEntry.currentBank}"
									valueChangeListener="#{invoiceEntry.onRBankChanged}">
									<f:selectItem value="#{null}" />
									<f:selectItems value="#{invoiceEntry.allBanks}" />
								</aon:selectOneMenu>
								<aon:commandLink id="bankAccount_show_manualInput-New" ajaxSingle="true"
									rendered="#{!invoiceEntry.showBankManualInput}"  
									reRender="AccountFinance_bankAccount_panel-New"
									styleClass="aon-icon-edit-add aon-margin-left" style="padding-right: 20px;padding-top: 0px;"
									value="&#160;" title="#{bundle.aon_edit}" >
									<f:setPropertyActionListener target="#{invoiceEntry.showBankManualInput}"
										value="#{true}" />
								</aon:commandLink>
							</aon:div>
						</aon:div>
					</f:facet>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_status}" />
					</f:facet>
					<aon:outputText value="#{financeTo.financeStatus}" />
					<f:facet name="footer">
						<aon:outputText value="#{invoiceEntry.currentFinance.financeStatus}" 
							rendered="#{invoiceEntry.newFinance}"/>
					</f:facet>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel for="Account_Finance_Amount"
							value="#{bundle.aon_amount}" />
					</f:facet>
					<aon:outputText rendered="#{financeTo!=invoiceEntry.currentFinance}"
						value="#{financeTo.amount}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
					<aon:inputText id="Account_Finance_Amount" size="8"
						rendered="#{financeTo==invoiceEntry.currentFinance}"
						value="#{invoiceEntry.currentFinance.amount}" required="true" />
					<f:facet name="footer">
						<aon:div style="text-align:right;">
							<aon:inputText id="Account_Finance_Amount-New" size="8"
								rendered="#{invoiceEntry.newFinance}"
								value="#{invoiceEntry.currentFinance.amount}">
							</aon:inputText>
							<aon:outputText id="financesTotal" rendered="#{!invoiceEntry.newFinance}"
								style="#{invoiceEntry.settled?'':'color:red;font-weight:bold;'}" 
								value="#{invoiceEntry.financeTotal}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:div>
					</f:facet>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<aon:div rendered="#{financeTo==invoiceEntry.currentFinance}">
						<aon:commandButton title="#{bundle.aon_save}"
							reRender="FinancesData,aonToolbar"
							actionListener="#{invoiceEntry.onUpdateFinance}"
							styleClass="aon-editDataTable-button aon-icon-accept" value=""
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:commandButton title="#{bundle.aon_cancel}"
							reRender="FinancesData,aonToolbar"
							actionListener="#{invoiceEntry.onCancelFinance}" immediate="true"
							onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
							styleClass="aon-editDataTable-button aon-icon-cancel" value=""
							accesskey="#{bundle.aon_key_cancel_line}" />
						<aon:commandButton title="#{bundle.aon_remove}"
							reRender="FinancesData,aonToolbar"
							actionListener="#{invoiceEntry.onRemoveFinance}" immediate="true"
							onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
							styleClass="aon-editDataTable-button aon-icon-delete" value=""
							accesskey="#{bundle.aon_key_remove_line}" />
					</aon:div>
					<f:facet name="footer">
						<aon:div>
							<aon:div rendered="#{invoiceEntry.newFinance}">
								<aon:commandButton title="#{bundle.aon_save}"
									reRender="FinancesData,aonToolbar" focus="saveInvoice"
									actionListener="#{invoiceEntry.onAddFinance}"
									styleClass="aon-editDataTable-button aon-icon-accept" value=""
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="#{bundle.aon_cancel}"
									actionListener="#{invoiceEntry.onCancelFinance}"
									reRender="FinancesData,aonToolbar" immediate="true"
									styleClass="aon-editDataTable-button aon-icon-cancel" value=""
									accesskey="#{bundle.aon_key_cancel_line}" />
							</aon:div>
						</aon:div>
					</f:facet>
				</aon:column>
			</aon:editDataTable>
		</aon:panel>
	</aon:if>
</ui:composition>
