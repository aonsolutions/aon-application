<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:panel>
		<f:facet name="header">
			<aon:outputText value="#{financeBundle.finance_finances}" />
		</f:facet>
		<aon:editDataTable id="FinancesData" var="financeTo" rows="0"
			value="#{invoiceEntry.finances}"
			columnClasses="aon-editDataTable-iconColumn, 
					aon-editDataTable-textColumn,
					aon-editDataTable-textColumn,
					aon-editDataTable-textColumn,
					aon-editDataTable-numberColumn,
					aon-editDataTable-buttonsColumn">

			<aon:rowSelector immediate="true"
				rendered="#{financeTo!=invoiceEntry.currentFinance}"
				disabled="#{!invoiceEntry.accountSource}"
				actionListener="#{invoiceEntry.onSelectFinance}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton id="newFinance" value=""
							reRender="FinancesData"
							styleClass="aon-editDataTable-button aon-icon-new"
							title="#{accountBundle.aon_newLine}"
							disabled="#{!invoiceEntry.accountSource}"
							actionListener="#{invoiceEntry.onNewFinance}"
							rendered="#{!invoiceEntry.newFinance}"
							focus="Account_Finance_DueDate"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_date}"
						for="Account_Finance_DueDate" />
				</f:facet>
				<aon:outputText rendered="#{financeTo!=invoiceEntry.currentFinance}"
					value="#{financeTo.dueDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="Account_Finance_DueDate"
					rendered="#{financeTo==invoiceEntry.currentFinance}"
					value="#{invoiceEntry.currentFinance.dueDate}" inputSize="10"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}" />
				<f:facet name="footer">
					<aon:selectInputDate id="Account_Finance_DueDate-New"
						rendered="#{invoiceEntry.newFinance}"
						value="#{invoiceEntry.currentFinance.dueDate}" inputSize="10"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="Account_Finance_PayMethod"
						value="#{configBundle.config_pay_method}" />
				</f:facet>
				<aon:outputText value="#{financeTo.payMethod.name}"
					rendered="#{financeTo!=invoiceEntry.currentFinance}" />
				<aon:selectOneMenu id="Account_Finance_PayMethod"
					styleClass="aon-form-selectOneMenu-field"
					rendered="#{financeTo==invoiceEntry.currentFinance}"
					valueChangeListener="#{invoiceEntry.onPayMethodChanged}"
					reRender="Account_Finance_RegistryBank"
					value="#{invoiceEntry.currentFinance.payMethod}">
					<f:selectItem value="#{nullItem.value}" />
					<f:selectItems value="#{configCollections.payMethods}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="Account_Finance_PayMethod-New"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{invoiceEntry.newFinance}"
						valueChangeListener="#{invoiceEntry.onPayMethodChanged}"
						reRender="Account_Finance_RegistryBank-New"	
						value="#{invoiceEntry.currentFinance.payMethod}">
						<f:selectItem value="#{nullItem.value}" />
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column width="300">
				<f:facet name="header">
					<aon:outputLabel for="Account_Finance_RegistryBank"
						value="#{configBundle.config_bank}" />
				</f:facet>

				<aon:outputText value="#{financeTo.bank.name}"
					rendered="#{financeTo!=invoiceEntry.currentFinance}" />
				<aon:div
					rendered="#{financeTo==invoiceEntry.currentFinance and invoiceEntry.sales}">
					<aon:selectOneMenu id="Account_Finance_RegistryBank"
						value="#{invoiceEntry.currentFinance.bank}"
						valueChangeListener="#{invoiceEntry.onBankChanged}">
						<f:selectItem value="#{nullItem.value}" />
						<f:selectItems value="#{invoiceEntry.banks}" />
					</aon:selectOneMenu>
					<aon:commandLink styleClass="aon-lookupButton-new"
						reRender="Account_Finance_RegistryBank" />
				</aon:div>

				<f:facet name="footer">
					<aon:div rendered="#{invoiceEntry.newFinance}">
						<aon:selectOneMenu id="Account_Finance_RegistryBank-New"
							value="#{invoiceEntry.currentFinance.bank}"
							valueChangeListener="#{invoiceEntry.onBankChanged}"
							reRender="BankAccount-New">
							<f:selectItem value="#{nullItem.value}" />
							<f:selectItems value="#{invoiceEntry.banks}" />
						</aon:selectOneMenu>
						<aon:commandLink styleClass="aon-lookupButton-new"
							reRender="Account_Finance_RegistryBank" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{configBundle.config_bank_account}" />
				</f:facet>
				<aon:outputText rendered="#{financeTo!=invoiceEntry.currentFinance}"
					value="#{financeTo.bankAccount}">
				</aon:outputText>
				<aon:div style="text-align:right;"
					rendered="#{financeTo==invoiceEntry.currentFinance}">

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="Account_Finance_Amount"
						value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText rendered="#{financeTo!=invoiceEntry.currentFinance}"
					value="#{financeTo.amount}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="Account_Finance_Amount" size="10"
					rendered="#{financeTo==invoiceEntry.currentFinance}"
					value="#{invoiceEntry.currentFinance.amount}" required="true" />
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:inputText id="Account_Finance_Amount-New" size="10"
							rendered="#{invoiceEntry.newFinance}"
							value="#{invoiceEntry.currentFinance.amount}">
						</aon:inputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div rendered="#{financeTo==invoiceEntry.currentFinance}">
					<aon:commandButton title="#{bundle.aon_save}"
						reRender="FinancesData,aonToolbar"
						actionListener="#{invoiceEntry.onUpdateFinance}"
						styleClass="aon-editDataTable-button aon-icon-accept" value=""
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="#{bundle.aon_cancel}"
						reRender="FinancesData,aonToolbar"
						actionListener="#{invoiceEntry.onCancelFinance}" immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
						styleClass="aon-editDataTable-button aon-icon-cancel" value=""
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:commandButton title="#{bundle.aon_remove}"
						reRender="FinancesData,aonToolbar"
						actionListener="#{invoiceEntry.onRemoveFinance}" immediate="true"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
						styleClass="aon-editDataTable-button aon-icon-delete" value=""
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<aon:div rendered="#{invoiceEntry.newFinance}">
							<aon:commandButton title="#{bundle.aon_save}"
								reRender="FinancesData,aonToolbar" focus="saveInvoice"
								actionListener="#{invoiceEntry.onAddFinance}"
								onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
								styleClass="aon-editDataTable-button aon-icon-accept" value=""
								accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{invoiceEntry.onCancelFinance}"
								reRender="FinancesData,aonToolbar" immediate="true"
								onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
								styleClass="aon-editDataTable-button aon-icon-cancel" value=""
								accesskey="#{bundle.aon_key_cancel_line}" />
						</aon:div>
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>
	</aon:panel>
</ui:composition>
