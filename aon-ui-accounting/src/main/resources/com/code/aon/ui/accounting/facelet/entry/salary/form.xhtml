<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salaryEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle" value="#{bundle.aon_salaries}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_reset}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save" 
						value="#{bundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}"
						title="#{bundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{salaryEntry.onAccept}"
						action="#{salaryEntry.accept}"
						disabled="#{salaryEntry.entry.accruedTotal == 0}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.accounting_entry_generate}?')) return false;" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})" 
						action="accountEntry_search"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"/>
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="3"
					styleClass="aon-panelGrid aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-200,
					               aon-panelGrid-even aon-width-160,
								   aon-panelGrid-even aon-width-auto,"
					>

					<aon:outputLabel for="AccountEntry_accountPeriod"
						value="#{bundle.aon_financial_year}" />
					<aon:div>
						<aon:selectOneMenu id="AccountEntry_accountPeriod" 
							value="#{salaryEntry.entry.period}">
							<f:selectItems value="#{accountingCollections.enabledAccountPeriods}" />
<!-- 							
							<a4j:support event="onchange" 
								actionListener="#{salaryEntry.onRefresh}" 
								reRender="entryContainer,save"
								focus="date"/>
 -->
						</aon:selectOneMenu>

						<aon:if test="#{aonRole.confidentiality}">
							<aon:selectBooleanCheckbox id="AccountEntry_securityLevel"
								styleClass="aon-margin-left"
								value="#{salaryEntry.entry.confidential}"/>
							<aon:outputText styleClass="aon-italic aon-margin-right"
								value="#{bundle.aon_confidential}" />
						</aon:if>
					</aon:div>
					<aon:outputText value="&#160;CCC" />

					<aon:outputLabel for="date" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="date" required="true"
						value="#{salaryEntry.entry.date}" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
<!-- 							
						<a4j:support event="oninputchange"
							actionListener="#{salaryEntry.onRefresh}"
							reRender="entryContainer,save"
							focus="Account_concept"/>
						<a4j:support event="onchanged"
							actionListener="#{salaryEntry.onRefresh}"
							reRender="entryContainer,save"
							focus="Account_concept"/>
 -->
					</aon:selectInputDate>
					<aon:outputText value="&#160;" />
					
					<aon:outputLabel for="Account_concept"
						styleClass="aon-outputLabel aon-input-required"
						value="#{bundle.aon_concept}" />
					<rich:comboBox id="Account_concept"
						suggestionValues="#{accountingCollections.conceptsDescriptions}"
						value="#{salaryEntry.entry.concept}" required="true"
						maxlength="32"  width="130"
						directInputSuggestions="true"
						label="#{bundle.aon_concept}"
						inputClass="aon-inputText"
						buttonDisabledStyle="display:none;"
						buttonInactiveStyle="display:none;"
						buttonStyle="display:none;">
						<a4j:support event="onchange" 
							actionListener="#{salaryEntry.onRefresh}" 
							reRender="entryContainer,save" 
							focus="Account_gross_salary_monetary"/>
					</rich:comboBox>
					<aon:outputText value="&#160;" />

					<aon:outputLabel for="Account_gross_salary_monetary"
						value="#{bundle.accounting_gross_salary_monetary}" />
					<aon:inputText id="Account_gross_salary_monetary" required="true"
						styleClass="aon-inputText aon-margin-right"
						value="#{salaryEntry.entry.grossSalaryMonetary}" size="15"
						>
						<a4j:support event="onchange" 
							actionListener="#{salaryEntry.onRefresh}" 
							reRender="entryContainer,save"
							focus="Account_gross_salary_in_kind"/>
					</aon:inputText>
					<aon:div>
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="skipLabel" value="#{false}" />
							<ui:param name="lookupSuffix" value="GrossSalaryMonetary" />
							<ui:param name="lookupTo" value="#{salaryEntry.salaryAccount}" />
							<ui:param name="lookupReRender" value="entryContainer,save" />
						</ui:include>
						
						<aon:commandButton
							title="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							alt="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							styleClass="aon-icon-refresh aon-noborder aon-margin-left"
							value="&#160;"
							actionListener="#{salaryEntry.onSameSalaryAccount}"
							immediate="true" 
							rendered="#{salaryEntry.salaryAccountUpdatable}"
							reRender="entryContainer,save"
							onclick="if (!confirm('Desea fijar el valor introducido como valor por defecto en par&#225;metros contables?')){return false;}" 
							/>		
 					</aon:div>

					<aon:outputLabel for="Account_gross_salary_in_kind"
						value="#{bundle.accounting_gross_salary_in_kind}" />
					<aon:inputText id="Account_gross_salary_in_kind" required="true"
						styleClass="aon-inputText aon-margin-right"
						value="#{salaryEntry.entry.grossSalaryInKind}" size="15"
						>
						<a4j:support event="onchange" 
							actionListener="#{salaryEntry.onRefresh}" 
							reRender="entryContainer,save" 
							focus="Account_Allowance"/>
					</aon:inputText>
					<aon:div>
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="skipLabel" value="#{false}" />
							<ui:param name="lookupSuffix" value="GrossSalaryInKind" />
							<ui:param name="lookupTo" value="#{salaryEntry.salaryInKindAccount}" />
							<ui:param name="lookupReRender" value="entryContainer,save" />
						</ui:include>
						
						<aon:commandButton
							title="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							alt="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							styleClass="aon-icon-refresh aon-noborder aon-margin-left"
							value="&#160;"
							actionListener="#{salaryEntry.onSameSalaryInKindAccount}"
							immediate="true" 
							rendered="#{salaryEntry.salaryInKindAccountUpdatable}"
							reRender="entryContainer,save"
							onclick="if (!confirm('Desea fijar el valor introducido como valor por defecto en par&#225;metros contables?')){return false;}" 
							/>		
 					</aon:div>

					<aon:outputLabel for="Account_Allowance"
						value="#{bundle.accounting_allowance}" />
					<aon:inputText id="Account_Allowance" required="true"
						styleClass="aon-inputText aon-margin-right"
						value="#{salaryEntry.entry.allowance}" size="15"
						>
						<a4j:support event="onchange" 
							actionListener="#{salaryEntry.onRefresh}" 
							reRender="entryContainer,save"
							focus="Account_Compensation"/>
					</aon:inputText>
					<aon:div>
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="skipLabel" value="#{false}" />
							<ui:param name="lookupSuffix" value="Allowance" />
							<ui:param name="lookupTo" value="#{salaryEntry.allowanceAccount}" />
							<ui:param name="lookupReRender" value="entryContainer,save" />
						</ui:include>
						
						<aon:commandButton
							title="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							alt="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							styleClass="aon-icon-refresh aon-noborder aon-margin-left"
							value="&#160;"
							actionListener="#{salaryEntry.onSameAllowanceAccount}"
							immediate="true" 
							rendered="#{salaryEntry.allowanceAccountUpdatable}"
							reRender="entryContainer,save"
							onclick="if (!confirm('Desea fijar el valor introducido como valor por defecto en par&#225;metros contables?')){return false;}" 
							/>		
 					</aon:div>

					<aon:outputLabel for="Account_Compensation"
						value="#{bundle.accounting_compensation}" />
					<aon:inputText id="Account_Compensation" required="true"
						styleClass="aon-inputText aon-margin-right"
						value="#{salaryEntry.entry.compensation}" size="15"
						>
						<a4j:support event="onchange" 
							actionListener="#{salaryEntry.onRefresh}" 
							reRender="entryContainer,save"
							focus="Account_retention"/>
					</aon:inputText>
					<aon:div>
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="skipLabel" value="#{false}" />
							<ui:param name="lookupSuffix" value="Compensation" />
							<ui:param name="lookupTo" value="#{salaryEntry.compensationAccount}" />
							<ui:param name="lookupReRender" value="entryContainer,save" />
						</ui:include>
						
						<aon:commandButton
							title="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							alt="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							styleClass="aon-icon-refresh aon-noborder aon-margin-left"
							value="&#160;"
							actionListener="#{salaryEntry.onSameCompensationAccount}"
							immediate="true" 
							rendered="#{salaryEntry.compensationAccountUpdatable}"
							reRender="entryContainer,save"
							onclick="if (!confirm('Desea fijar el valor introducido como valor por defecto en par&#225;metros contables?')){return false;}" 
							/>		
					</aon:div>

					<aon:outputLabel for="Account_accrued_total"
						value="#{bundle.payroll_total_payment}" />
					<aon:inputText id="Account_accrued_total" disabled="true" 
						styleClass="aon-inputText"
						value="#{salaryEntry.entry.accruedTotal}" size="15">
					</aon:inputText>
					<aon:outputText value="&#160;" />

					<aon:outputLabel for="Account_retention"
						value="#{bundle.aon_retention}" />
					<aon:inputText id="Account_retention" required="true"
						styleClass="aon-inputText aon-margin-right"
						value="#{salaryEntry.entry.retention}" size="15"
						>
						<a4j:support event="onchange" 
							actionListener="#{salaryEntry.onRefresh}" 
							reRender="entryContainer,save"
							focus="Account_retention_in_kind"/>
					</aon:inputText>
					<aon:div>
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="skipLabel" value="#{false}" />
							<ui:param name="lookupSuffix" value="Retention" />
							<ui:param name="lookupTo" value="#{salaryEntry.salaryChargedRetAccount}" />
							<ui:param name="lookupReRender" value="entryContainer,save" />
						</ui:include>
						
						<aon:commandButton
							title="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							alt="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							styleClass="aon-icon-refresh aon-noborder aon-margin-left"
							value="&#160;"
							actionListener="#{salaryEntry.onSameSalaryChargedRetAccount}"
							immediate="true" 
							rendered="#{salaryEntry.salaryChargedRetAccountUpdatable}"
							reRender="entryContainer,save"
							onclick="if (!confirm('Desea fijar el valor introducido como valor por defecto en par&#225;metros contables?')){return false;}" 
							/>		
						
					</aon:div>

					<aon:outputLabel for="Account_retention_in_kind"
						value="#{bundle.aon_retention_in_kind}" />
					<aon:inputText id="Account_retention_in_kind" required="true"
						styleClass="aon-inputText aon-margin-right"
						value="#{salaryEntry.entry.retentionInKind}" size="15"
						>
						<a4j:support event="onchange" 
							actionListener="#{salaryEntry.onRefresh}" 
							reRender="entryContainer,save"
							focus="Account_employee_social_insurance1"/>
					</aon:inputText>
					<aon:div>
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="skipLabel" value="#{false}" />
							<ui:param name="lookupSuffix" value="RetentionInKind" />
							<ui:param name="lookupTo" value="#{salaryEntry.salaryChargedRetInKindAccount}" />
							<ui:param name="lookupReRender" value="entryContainer,save" />
						</ui:include>
						
						<aon:commandButton
							title="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							alt="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							styleClass="aon-icon-refresh aon-noborder aon-margin-left"
							value="&#160;"
							actionListener="#{salaryEntry.onSameSalaryChargedRetInKindAccount}"
							immediate="true" 
							rendered="#{salaryEntry.salaryChargedRetInKindAccountUpdatable}"
							reRender="entryContainer,save"
							onclick="if (!confirm('Desea fijar el valor introducido como valor por defecto en par&#225;metros contables?')){return false;}" 
							/>		
						
					</aon:div>

					<aon:outputLabel for="Account_employee_social_insurance1"
						value="#{bundle.accounting_employee_social_insurance}" />
					<aon:div styleClass="aon-nowrap">								
						<aon:inputText id="Account_employee_social_insurance" disabled="true" 
							styleClass="aon-inputText  aon-margin-right"
							value="#{salaryEntry.entry.employeeSocialInsurance}" size="15"/>
						<aon:outputText value="=" style="font-size: 1.2em; font-weight: bold;" styleClass="aon-margin-right"/>
					</aon:div>
					<aon:div>								
						<aon:inputText id="Account_employee_social_insurance1" required="true"
							styleClass="aon-inputText aon-margin-right"
							value="#{salaryEntry.entry.employeeSocialInsurance1}" size="10"
							>
							<a4j:support event="onchange" 
								actionListener="#{salaryEntry.onRefresh}" 
								reRender="entryContainer,save"
								focus="Account_employee_social_insurance2"/>
						</aon:inputText>
	
						<aon:outputText value="+" style="font-size: 1.2em; font-weight: bold;" styleClass="aon-margin-right"/>	
						<aon:inputText id="Account_employee_social_insurance2" required="true"
							styleClass="aon-inputText aon-margin-right"
							value="#{salaryEntry.entry.employeeSocialInsurance2}" size="10"
							>
							<a4j:support event="onchange" 
								actionListener="#{salaryEntry.onRefresh}" 
								reRender="entryContainer,save"
								focus="Account_employee_social_insurance3"/>
						</aon:inputText>

						<aon:outputText value="+" style="font-size: 1.2em; font-weight: bold;" styleClass="aon-margin-right"/>	
						<aon:inputText id="Account_employee_social_insurance3" required="true"
							styleClass="aon-inputText aon-margin-right"
							value="#{salaryEntry.entry.employeeSocialInsurance3}" size="10"
							>
							<a4j:support event="onchange" 
								actionListener="#{salaryEntry.onRefresh}" 
								reRender="entryContainer,save"
								focus="Account_employee_social_insurance4"/>
						</aon:inputText>

						<aon:outputText value="+" style="font-size: 1.2em; font-weight: bold;" styleClass="aon-margin-right"/>	
						<aon:inputText id="Account_employee_social_insurance4" required="true"
							styleClass="aon-inputText aon-margin-right"
							value="#{salaryEntry.entry.employeeSocialInsurance4}" size="10"
							>
							<a4j:support event="onchange" 
								actionListener="#{salaryEntry.onRefresh}" 
								reRender="entryContainer,save"
								focus="Account_registryBank"/>
						</aon:inputText>
					</aon:div>
							
					<aon:outputText value="&#160;"/>
					<aon:outputText value="&#160;"/>
					<aon:div>
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="skipLabel" value="#{false}" />
							<ui:param name="lookupSuffix" value="socialInsurance" />
							<ui:param name="lookupTo" value="#{salaryEntry.socialInsuranceAccount}" />
							<ui:param name="lookupReRender" value="entryContainer,save" />
						</ui:include>

						<aon:commandButton
							title="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							alt="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							styleClass="aon-icon-refresh aon-noborder aon-margin-left"
							value="&#160;"
							actionListener="#{salaryEntry.onSameSocialInsuranceAccount}"
							immediate="true" 
							rendered="#{salaryEntry.socialInsuranceAccountUpdatable}"
							reRender="entryContainer,save"
							onclick="if (!confirm('Desea fijar el valor introducido como valor por defecto en par&#225;metros contables?')){return false;}" 
						/>		
					</aon:div>

					<aon:outputLabel for="Account_net_salary"
						value="#{bundle.accounting_net_salary}" />
					<aon:inputText id="Account_net_salary" disabled="true"
						styleClass="aon-inputText aon-margin-right" 
						value="#{salaryEntry.entry.netSalary}" size="15"/>
					<aon:div>
						<aon:selectOneMenu id="Account_registryBank"
							value="#{salaryEntry.entry.registryBank}">
							<f:selectItem itemLabel="#{bundle.accounting_pending_salary}" value="#{null}" />
							<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
							<a4j:support event="onchange"  
								reRender="entryContainer,save"
								actionListener="#{salaryEntry.onChangeBank}"
								focus="Account_company_social_insurance"/>
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputLabel for="Account_company_social_insurance"
						value="#{bundle.accounting_company_social_insurance}" />
					<aon:inputText id="Account_company_social_insurance" required="true"
						styleClass="aon-inputText aon-margin-right"
						value="#{salaryEntry.entry.companySocialInsurance}" size="15">
						<a4j:support event="onchange" 
							actionListener="#{salaryEntry.onRefresh}" 
							reRender="entryContainer,save"/>
					</aon:inputText>
					<aon:div>
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
							<ui:param name="skipLabel" value="#{false}" />
							<ui:param name="lookupSuffix" value="CompanySocIns" />
							<ui:param name="lookupTo" value="#{salaryEntry.companySocInsAccount}" />
							<ui:param name="lookupReRender" value="entryContainer,save" />
						</ui:include>

						<aon:commandButton
							title="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							alt="Pulse para fijar el valor introducido como valor por defecto en par&#225;metros contables."
							styleClass="aon-icon-refresh aon-noborder aon-margin-left"
							value="&#160;"
							actionListener="#{salaryEntry.onSameCompanySocInsAccount}"
							immediate="true" 
							rendered="#{salaryEntry.companySocInsAccountUpdatable}"
							reRender="entryContainer,save"
							onclick="if (!confirm('Desea fijar el valor introducido como valor por defecto en par&#225;metros contables?')){return false;}"
							
							
							/>		
					</aon:div>
				</aon:panelGrid>
								
				<aon:if test="#{salaryEntry.model != null}">
					<aon:div id="previewEntry" styleClass="aon-width-all aon-margin-top aon-margin-bottom"
						style="margin-right: 20px;">
						<h:dataTable value="#{salaryEntry.model}" var="detail" rows="0"
							styleClass="aon-editDataTable aon-width-all"
							style="background-color: #F2FDEC;"
							columnClasses="aon-editDataTable-textColumn aon-width-auto,
										   aon-editDataTable-textColumn aon-width-150,
										   aon-editDataTable-numberColumn aon-width-80,
										   aon-editDataTable-numberColumn aon-width-80">
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{bundle.account_account}" />
									</f:facet>
									<aon:outputText value="#{detail.account.fullDescription}" />
									<f:facet name="footer">
										<aon:outputText value="&#160;" />
									</f:facet>
								</aon:column>
	
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_concept}" />
									</f:facet>
									<aon:outputText value="#{detail.concept}" />
									<f:facet name="footer">
										<aon:outputText value="&#160;" />
									</f:facet>
								</aon:column>
	
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{bundle.account_debit}" />
									</f:facet>
									<aon:outputText value="#{detail.debit}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
									<f:facet name="footer">
										<aon:div styleClass="aon-text-right aon-bold">
											<aon:outputText value="#{salaryEntry.totalDebit}">
												<f:convertNumber pattern="#,##0.00" />
											</aon:outputText>
										</aon:div>
									</f:facet>
								</aon:column>
	
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{bundle.account_credit}" />
									</f:facet>
									<aon:outputText value="#{detail.credit}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
									<f:facet name="footer">
										<aon:div styleClass="aon-text-right aon-bold">
											<aon:outputText value="#{salaryEntry.totalCredit}">
												<f:convertNumber pattern="#,##0.00" />
											</aon:outputText>
										</aon:div>
									</f:facet>
								</aon:column>
						</h:dataTable>
					</aon:div>
				</aon:if>
			</aon:div>
		</aon:form>
 		<aon:lookupButtonPopup lookup="#{accountLookup}" />
	</ui:define>
</ui:composition>
