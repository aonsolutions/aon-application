<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salaryEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle" value="#{bundle.aon_salaries}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_reset}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save" 
						value="#{bundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}"
						title="#{bundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{salaryEntry.onAccept}"
						action="#{salaryEntry.accept}"
						disabled="#{salaryEntry.entry.grossSalary == 0}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.accounting_entry_generate}?')) return false;" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})" 
						action="accountEntry_search"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"/>
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="AccountEntry_accountPeriod"
						value="#{bundle.aon_financial_year}" />
					<aon:div>
						<aon:selectOneMenu id="AccountEntry_accountPeriod"
							value="#{salaryEntry.entry.period}">
							<f:selectItems value="#{accountingCollections.enabledAccountPeriods}" />
							<a4j:support event="onchange" ajaxSingle="true" reRender="AccountEntry_accountPeriod" focus="date"/>
						</aon:selectOneMenu>

						<c:if test="#{aonRole.confidentiality}">
							<aon:selectBooleanCheckbox id="AccountEntry_securityLevel"
								styleClass="aon-margin-left"
								value="#{salaryEntry.entry.confidential}"/>
							<aon:outputText styleClass="aon-italic aon-margin-right"
								value="#{bundle.aon_confidential}" />
						</c:if>
					</aon:div>

					<aon:outputLabel for="date" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="date" required="true"
						value="#{salaryEntry.entry.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="Account_registryBank"
						value="#{bundle.aon_bank}" />
					<aon:selectOneMenu id="Account_registryBank"
						value="#{salaryEntry.entry.registryBank}">
						<f:selectItem itemLabel="#{bundle.accounting_pending_salary}" value="#{null}" />
						<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_concept"
						styleClass="aon-outputLabel aon-input-required"
						value="#{bundle.aon_concept}" />
					<rich:comboBox id="Account_concept"
						suggestionValues="#{accountingCollections.conceptsDescriptions}"
						value="#{salaryEntry.entry.concept}" required="true"
						maxlength="32" width="200" 
						directInputSuggestions="true"
						label="#{bundle.aon_concept}"
						inputStyle="font-family: arial,lucida Grande, Trebuchet MS,sans-serif;font-size:1em;"
						buttonDisabledStyle="display:none;"
						buttonInactiveStyle="display:none;"
						buttonStyle="display:none;"/>

					<aon:outputLabel for="Account_gross_salary"
						value="#{bundle.accounting_gross_salary}" />
					<aon:inputText id="Account_gross_salary" required="true"
						value="#{salaryEntry.entry.grossSalary}" size="15"
						ajaxSingle="true" reRender="save,Account_net_salary,Account_employee_social_insurance,Account_accrued_total"
						focus="Account_Allowance" />

					<aon:outputLabel for="Account_Allowance"
						value="#{bundle.accounting_allowance}" />
					<aon:inputText id="Account_Allowance" required="true"
						value="#{salaryEntry.entry.allowance}" size="15"
						ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance,Account_accrued_total"
						focus="Account_Compensation" />

					<aon:outputLabel for="Account_Compensation"
						value="#{bundle.accounting_compensation}" />
					<aon:inputText id="Account_Compensation" required="true"
						value="#{salaryEntry.entry.compensation}" size="15"
						ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance,Account_accrued_total"
						focus="Account_retention" />

					<aon:outputLabel for="Account_accrued_total"
						value="#{bundle.payroll_total_payment}" />
					<aon:inputText id="Account_accrued_total" disabled="true" styleClass="aon-bold"
						value="#{salaryEntry.entry.accruedTotal}" size="15"/>

					<aon:outputLabel for="Account_retention"
						value="#{bundle.aon_retention}" />
					<aon:inputText id="Account_retention" required="true"
						value="#{salaryEntry.entry.retention}" size="15"
						ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance" 
						focus="Account_employee_social_insurance1"/>

					<aon:outputLabel for="Account_employee_social_insurance1"
						value="#{bundle.accounting_employee_social_insurance}" />
					<aon:div>
						<aon:inputText id="Account_employee_social_insurance" disabled="true" styleClass="aon-bold"
							value="#{salaryEntry.entry.employeeSocialInsurance}" size="15"/>
						<aon:outputText value="=" styleClass="aon-margin-left aon-margin-right" />
						<aon:inputText id="Account_employee_social_insurance1" required="true"
							value="#{salaryEntry.entry.employeeSocialInsurance1}" size="10"
							ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance" 
							focus="Account_employee_social_insurance2"/>
						<aon:outputText value="+" styleClass="aon-margin-left aon-margin-right" />
						<aon:inputText id="Account_employee_social_insurance2" required="true"
							value="#{salaryEntry.entry.employeeSocialInsurance2}" size="10"
							ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance" 
							focus="Account_employee_social_insurance3"/>
						<aon:outputText value="+" styleClass="aon-margin-left aon-margin-right" />
						<aon:inputText id="Account_employee_social_insurance3" required="true"
							value="#{salaryEntry.entry.employeeSocialInsurance3}" size="10"
							ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance" 
							focus="Account_employee_social_insurance4"/>
						<aon:outputText value="+" styleClass="aon-margin-left aon-margin-right" />
						<aon:inputText id="Account_employee_social_insurance4" required="true"
							value="#{salaryEntry.entry.employeeSocialInsurance4}" size="10"
							ajaxSingle="true" reRender="Account_net_salary,Account_employee_social_insurance" 
							focus="Account_company_social_insurance"/>
					</aon:div>

					<aon:outputLabel for="Account_net_salary"
						value="#{bundle.accounting_net_salary}" />
					<aon:inputText id="Account_net_salary" disabled="true" styleClass="aon-bold"
						value="#{salaryEntry.entry.netSalary}" size="15"/>

					<aon:outputLabel for="Account_company_social_insurance"
						value="#{bundle.accounting_company_social_insurance}" />
					<aon:inputText id="Account_company_social_insurance" required="true"
						value="#{salaryEntry.entry.companySocialInsurance}" size="15" />
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
