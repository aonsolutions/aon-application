<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.accounting_entry_module}" />
				<ui:param name="controller" value="#{accountEntry}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="back" value="#{bundle.aon_back}"
						accesskey="K" title="#{bundle.aon_back} Alt+K"
						action="#{accountEntry.backAction}"
						rendered="#{accountEntry.backActionEnabled}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:methodParam name="rowSelectorAction" value="#{accountEntry.onNavigate}" />
				<aon:methodParam name="rowSelectorActionListener" value="#{accountEntry.onSelectEntry}" type="actionListener" />
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{accountEntry}" />
			
					<ui:define name="columns">

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_financial_year}" />
							</f:facet>
							<aon:outputText value="#{to.accountPeriod.name}" />
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.entryDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.type}" />
						</aon:column>
						
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
