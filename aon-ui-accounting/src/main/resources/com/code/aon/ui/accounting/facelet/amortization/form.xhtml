<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="amortizationForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarID" value="amortizationToolbar" />
				<ui:param name="toolbarTitle"
					value="#{bundle.accounting_amortization_form_module}" />
				<ui:param name="controller" value="#{amortization}" />
				
				<ui:param name="skipRemoveButton" value="#{!amortization.updatable}" />				
				
				<ui:define name="beforeSpinToolbarContent">

					<aon:commandButton id="calculate" 
						value="#{bundle.accounting_calculate}"
						rendered="#{!amortization.nevv and amortization.to != null}"
						reRender="amortizationForm"
						onclick="if (!confirm('#{bundle.accounting_fixed_asset_calculate}')){ return false;} else {Richfaces.showModalPanel('waitProccess')}"
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" 
						actionListener="#{amortization.onCalculate}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh">
					</aon:commandButton>

					<aon:commandButton id="salePopup" 
						value="#{bundle.accounting_sale}"
						immediate="#{true}"
						rendered="#{!amortization.nevv and amortization.to != null}"
						styleClass="aon-finding-toolbar-item aon-icon-payment"
						reRender="salePanelWindow,amortizationToolbar">
						<f:setPropertyActionListener target="#{amortization.salePanelVisible}"
							value="#{true}" />
					</aon:commandButton>
					
					<aon:htmlCommandLink id="amortizationFormAnnual-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.accounting_annual_summary}" target="_blank"
						rendered="#{!amortization.to.yearly}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="amortizationFormAnnual" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>

					<aon:htmlCommandLink id="amortizationAForm-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_report}" target="_blank"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="amortizationForm" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<h:panelGrid id="AmortizationData" columns="2" style="width: 100%;"
					columnClasses="aon-width-400,aon-width-auto">

					<ui:include src="/com/code/aon/ui/accounting/facelet/amortization/formContent.xhtml" />

				</h:panelGrid>

				<aon:panelGrid columns="2" style="width: 100%;margin-top:2px;"
					columnClasses="aon-panelGrid-odd aon-width-200,aon-panelGrid-even">
					
					<aon:outputLabel for="Invoice_investAsset"
						value="#{bundle.accounting_invest_asset}" />
					<aon:selectOneMenu id="Amortization_investAsset"
						value="#{amortization.to.investAsset}" ajaxSingle="true">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{amortization.investAssets}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Amortization_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputText id="Amortization_comments"
						value="#{amortization.to.comments}" size="120" />
						
					<aon:outputText value="#{bundle.accounting_amortization_linked_invoices}" />
					<aon:div>
						<aon:commandButton id="addAmortizationInvoice" 
							value="&#160;"
							styleClass="aon-icon-reset aon-noborder"
							rendered="#{!inv.invoice.recorded}"
 							reRender="addInvoicePanelWindow">
							<f:setPropertyActionListener target="#{amortization.addInvoicePanelVisible}" value="#{true}" />
						</aon:commandButton>

						<a4j:repeat value="#{amortization.invoices}" var="inv">
							<aon:commandLink id="showAmortizationInvoice" 
								alt="#{bundle.aon_remove}"
								title="#{bundle.aon_remove}"
								value="&#160;" style="white-space: nowrap;"
								disabled="#{amortization.invoiceNavigationDisabled}"
								action="#{amortization.showInvoice}">
								<aon:outputText value="[" styleClass="aon-margin-left"/>
								<aon:outputText value="#{inv.invoice.type}"/>
								<aon:outputText value="-"/>
								<aon:outputText value="#{inv.invoice.documentNumber}"/>
								<aon:outputText value="]"/>
								<f:setPropertyActionListener 
									target="#{amortization.invoiceId}"
									value="#{inv.id}" />
							</aon:commandLink>
<!-- 								
								rendered="#{!inv.invoice.recorded}"
 -->
							<aon:commandButton id="removeAmortizationInvoice" 
								value="&#160;" style="margin-left: 2px;"
								styleClass="aon-icon-wrong aon-noborder"
								onclick="if (!confirm('#{bundle.aon_remove}?')){ return false;}">
								<f:setPropertyActionListener 
									target="#{amortization.invoiceId}"
									value="#{inv.id}" />
								<aon:actionListener method="#{amortization.onRemoveInvoice}" />
							</aon:commandButton>
						</a4j:repeat>
					</aon:div>
					
				</aon:panelGrid>

				<aon:panelTabSet id="amortizationTab" selectedTab="#{amortization.selectedTab}" rendered="#{!amortization.nevv}">
					<aon:panelTab id="YearSummary" label="#{bundle.accounting_annual_summary}" rendered="#{!amortization.to.yearly}">
						<ui:include src="/com/code/aon/ui/accounting/facelet/amortization/form_summary_lines.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="AmortizationDetails" label="#{bundle.accounting_amortization_details}">
						<ui:include src="/com/code/aon/ui/accounting/facelet/amortization/form_lines.xhtml" />
					</aon:panelTab>
				</aon:panelTabSet>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{accountLookup}" />		
		<ui:include src="modalSale.xhtml" />
		<ui:include src="modalAddInvoice.xhtml" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
	</ui:define>
</ui:composition>
