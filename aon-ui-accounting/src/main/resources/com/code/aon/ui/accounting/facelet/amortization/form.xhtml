<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="amortizationForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarID" value="amortizationToolbar" />
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_amortization_form_module}" />
				<ui:param name="controller" value="#{amortization}" />
				
				<ui:param name="skipRemoveButton" value="#{!amortization.updatable}" />				
				
				<ui:define name="beforeSpinToolbarContent">

					<aon:commandButton id="calculate" 
						value="#{accountingBundle.accounting_calculate}"
						rendered="#{!amortization.new and amortization.to != null}"
						reRender="amortizationForm"
						onclick="if (!confirm('#{accountingBundle.accounting_fixed_asset_calculate}')){ return false;} else {Richfaces.showModalPanel('waitProccess')}"
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" 
						actionListener="#{amortization.onCalculate}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh">
					</aon:commandButton>

					<aon:commandButton id="salePopup" 
						value="#{accountingBundle.accounting_sale}"
						immediate="#{true}"
						rendered="#{!amortization.new and amortization.to != null}"
						styleClass="aon-finding-toolbar-item aon-icon-payment"
						reRender="salePanelWindow,amortizationToolbar">
						<f:setPropertyActionListener target="#{amortization.salePanelVisible}"
							value="#{true}" />
					</aon:commandButton>
					
					<aon:htmlCommandLink id="amortizationFormAnnual-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{accountingBundle.accounting_annual_summary}" target="_blank"
						rendered="#{!amortization.to.yearly}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="amortizationFormAnnual" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>

					<aon:htmlCommandLink id="amortizationAForm-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_report}" target="_blank"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="amortizationForm" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="AmortizationData" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-200,aon-panelGrid-odd aon-width-150,aon-panelGrid-even">

					<aon:outputLabel for="Amortization_id" value="#{bundle.aon_id}" />
					<aon:div>
					<aon:inputText id="Amortization_id" value="#{amortization.to.id}"
						size="5" disabled="true" />
						<c:if test="#{aonRole.confidentiality}">
							<aon:selectBooleanCheckbox id="Amortization_securityLevel"
								styleClass="aon-margin-left"
								value="#{amortization.to.confidential}"/>
							<aon:outputLabel for="Amortization" 
								value="#{bundle.aon_confidential}" />
						</c:if>
					</aon:div>

					<aon:outputLabel for="Amortization_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Amortization_description"
						value="#{amortization.to.description}" required="true" size="70">
						<f:validateLength maximum="64" />
					</aon:inputText>

					<aon:outputLabel for="Amortization_initial_date"
						value="#{accountingBundle.accounting_initial_use_date}" />
					<aon:selectInputDate required="true"
						disabled="#{!amortization.updatable}"
						id="Amortization_initial_date"
						value="#{amortization.to.initialDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Amortization_amortizationType"
						value="#{accountingBundle.accounting_amortization_type}" />
					<aon:selectOneMenu id="Amortization_amortizationType"
						disabled="#{!amortization.new}"
						value="#{amortization.to.amortizationType}"
						reRender="fixedAssetAccount,accumulatedAccount,allocationAccount,percentage,AmortizationDetails"
						ajaxSingle="true">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{accountingCollections.amortizationTypes}" />
					</aon:selectOneMenu>


					<aon:outputLabel for="Amortization_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="Amortization_amount" required="true"
						disabled="#{!amortization.updatable}"
						value="#{amortization.to.amount}" size="15" />

					<aon:outputText
						value="#{accountingBundle.accounting_fixed_asset_account}" />
					<aon:panelGroup id="fixedAssetAccount" styleClass="aon-nowrap">
						<aon:outputText rendered="#{!amortization.updatable}"
							value="#{amortization.to.fixedAssetAccount.fullDescription}" />
						<aon:selectOneMenu id="Amortization_fixedAssetAccount"
							rendered="#{(!amortization.new and amortization.updatable) or (amortization.new and amortization.to.amortizationType.id != null)}"
							value="#{amortization.to.fixedAssetAccount}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{amortization.fixedAssetAccounts}" />
						</aon:selectOneMenu>
						<aon:outputText rendered="#{amortization.new and amortization.to.amortizationType.id == null}"
							value="&#160;" />
						<aon:commandButton
							value="&#160;"
							title="#{accountBundle.account_synchronize}"
							style="border: none;width:10px;"
							styleClass="aon-finding-toolbar-item aon-icon-transfer"
							onclick="if (!confirm('#{accountBundle.account_synchronize}?')){ return false;}"
							rendered="#{amortization.fixedAssetAccountSynchronizable}"
							reRender="AmortizationData"
							actionListener="#{amortization.onFixedAssetAccountSynchronize}">
						</aon:commandButton>
					</aon:panelGroup>
						

					<aon:outputLabel for="Amortization_amortizationPeriod"
						value="#{accountingBundle.accounting_amortization_period}" />
					<aon:selectOneMenu id="Amortization_amortizationPeriod" required="true"
						value="#{amortization.to.feePeriod}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems
							value="#{accountingCollections.amortizationPeriods}" />
					</aon:selectOneMenu>

					<aon:outputText
						value="#{accountingBundle.accounting_accumulated_account}" />
					<aon:panelGroup id="accumulatedAccount" styleClass="aon-nowrap">
						<aon:outputText rendered="#{!amortization.updatable}"
							value="#{amortization.to.accumulatedAccount.fullDescription}" />
						<aon:selectOneMenu id="Amortization_accumulatedAccount"
							rendered="#{(!amortization.new and amortization.updatable) or (amortization.new and amortization.to.amortizationType.id != null)}"
							value="#{amortization.to.accumulatedAccount}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{amortization.accumulatedAccounts}" />
						</aon:selectOneMenu>
						<aon:outputText rendered="#{amortization.new and amortization.to.amortizationType.id == null}"
							value="&#160;" />
						<aon:commandButton
							value="&#160;"
							title="#{accountBundle.account_synchronize}"
							onclick="if (!confirm('#{accountBundle.account_synchronize}?')){ return false;}"
							style="border: none;width:10px;"
							styleClass="aon-finding-toolbar-item aon-icon-transfer"
							rendered="#{amortization.accumulatedAccountSynchronizable}"
							reRender="AmortizationData"
							actionListener="#{amortization.onAccumulatedAccountSynchronize}">
						</aon:commandButton>
					</aon:panelGroup>


					<aon:outputText value="#{accountingBundle.accounting_coefficient}" />
					<aon:panelGroup id="percentage">
						<aon:outputText rendered="#{!amortization.new}" 
							value="#{amortization.to.percentage}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:outputText rendered="#{amortization.new}" 
							value="#{amortization.to.amortizationType.percentage}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:outputText value="%" />
					</aon:panelGroup>

					<aon:outputText
						value="#{accountingBundle.accounting_allocation_account}" />
					<aon:panelGroup id="allocationAccount" styleClass="aon-nowrap">
						<aon:outputText rendered="#{!amortization.updatable}"
							value="#{amortization.to.allocationAccount.fullDescription}" />
 						<aon:selectOneMenu id="Amortization_allocationAccount"
							rendered="#{(!amortization.new and amortization.updatable) or (amortization.new and amortization.to.amortizationType.id != null)}"
							value="#{amortization.to.allocationAccount}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{amortization.allocationAccounts}" />
						</aon:selectOneMenu>
						<aon:outputText rendered="#{amortization.new and amortization.to.amortizationType.id == null}"
							value="&#160;" />
						<aon:commandButton
							value="&#160;"
							title="#{accountBundle.account_synchronize}"
							onclick="if (!confirm('#{accountBundle.account_synchronize}?')){ return false;}"
							style="border: none;width:10px;"
							styleClass="aon-finding-toolbar-item aon-icon-transfer"
							rendered="#{amortization.allocationAccountSynchronizable}"
							reRender="AmortizationData"
							actionListener="#{amortization.onAllocationAccountSynchronize}">
						</aon:commandButton>
					</aon:panelGroup>

					<aon:outputText
						rendered="#{amortization.to.deadline != null}"
						value="#{accountingBundle.accounting_cancellation_date}" />
					<aon:outputText value="#{amortization.to.deadline}" rendered="#{amortization.to.deadline != null}">
						<f:convertDateTime type="date"
							pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>

					<aon:outputText
						rendered="#{amortization.to.deadline != null}"
						value="#{accountingBundle.accounting_sale_amount}" />
					<aon:outputText value="#{amortization.to.saleAmount}" rendered="#{amortization.to.deadline != null}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
				</aon:panelGrid>

				<aon:panelGrid columns="2" style="width: 100%;margin-top:2px;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even">
					<aon:outputLabel for="Amortization_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputText id="Amortization_comments"
						value="#{amortization.to.comments}" size="145" />
				</aon:panelGrid>

				<aon:panelTabSet id="amortizationTab" selectedTab="#{amortization.selectedTab}" rendered="#{!amortization.new}">
					<aon:panelTab id="YearSummary" label="#{accountingBundle.accounting_annual_summary}" rendered="#{!amortization.to.yearly}">
						<ui:include src="/com/code/aon/ui/accounting/facelet/amortization/form_summary_lines.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="AmortizationDetails" label="#{accountingBundle.accounting_amortization_details}">
						<ui:include src="/com/code/aon/ui/accounting/facelet/amortization/form_lines.xhtml" />
					</aon:panelTab>
				</aon:panelTabSet>
			</aon:div>
		</aon:form>
		<ui:include src="modalSale.xhtml" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
