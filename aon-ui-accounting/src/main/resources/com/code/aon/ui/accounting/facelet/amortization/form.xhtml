<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="amortizationForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarID" value="amortizationToolbar" />
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_amortization_form_module}" />
				<ui:param name="controller" value="#{amortization}" />
				
				<ui:param name="skipRemoveButton" value="#{!amortization.updatable}" />				
				
				<ui:define name="beforeSpinToolbarContent">

					<aon:commandButton id="calculate" 
						value="#{accountingBundle.accounting_calculate}"
						rendered="#{!amortization.new and amortization.to != null}"
						reRender="amortizationForm"
						onclick="if (!confirm('#{accountingBundle.accounting_fixed_asset_calculate}')){ return false;} else {Richfaces.showModalPanel('waitProccess')}"
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" 
						actionListener="#{amortization.onCalculate}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh">
					</aon:commandButton>

					<aon:commandButton id="salePopup" 
						value="#{accountingBundle.accounting_sale}"
						immediate="#{true}"
						rendered="#{!amortization.new and amortization.to != null}"
						styleClass="aon-finding-toolbar-item aon-icon-payment"
						reRender="salePanelWindow,amortizationToolbar">
						<f:setPropertyActionListener target="#{amortization.salePanelVisible}"
							value="#{true}" />
					</aon:commandButton>
					
					<aon:htmlCommandLink id="amortizationFormAnnual-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{accountingBundle.accounting_annual_summary}" target="_blank"
						rendered="#{!amortization.to.yearly}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="amortizationFormAnnual" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>

					<aon:htmlCommandLink id="amortizationAForm-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_report}" target="_blank"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="amortizationForm" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<h:panelGrid id="AmortizationData" columns="2" style="width: 100%;"
					columnClasses="aon-width-400,aon-width-auto">

					<ui:include src="/com/code/aon/ui/accounting/facelet/amortization/formContent.xhtml" />

				</h:panelGrid>

				<aon:panelGrid columns="2" style="width: 100%;margin-top:2px;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even">
					<aon:outputLabel for="Amortization_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputText id="Amortization_comments"
						value="#{amortization.to.comments}" size="145" />
				</aon:panelGrid>

				<aon:panelTabSet id="amortizationTab" selectedTab="#{amortization.selectedTab}" rendered="#{!amortization.new}">
					<aon:panelTab id="YearSummary" label="#{accountingBundle.accounting_annual_summary}" rendered="#{!amortization.to.yearly}">
						<ui:include src="/com/code/aon/ui/accounting/facelet/amortization/form_summary_lines.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="AmortizationDetails" label="#{accountingBundle.accounting_amortization_details}">
						<ui:include src="/com/code/aon/ui/accounting/facelet/amortization/form_lines.xhtml" />
					</aon:panelTab>
				</aon:panelTabSet>
			</aon:div>
		</aon:form>
		<ui:include src="modalSale.xhtml" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
