<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showElaborationWindow">
		<aon:if test="#{sales.showElaborationWindow}">
			<rich:modalPanel id="ediElaborationPanel" minHeight="650"
				minWidth="800" rendered="#{sales.showElaborationWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.warehouse_manufacturing_order}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showElaborationWindow, salesForm" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{sales.showElaborationWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="elaborationForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="elaboration-accept"
										value="#{bundle.warehouse_manufacture} #{bundle.aon_all}"
										actionListener="#{sales.elaborationProcess.onFullExecute}"
										reRender="showElaborationWindow, salesForm"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										onclick="Richfaces.showModalPanel('waitProccess')" 
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="elaborationModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{sales.showElaborationWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="elaboration-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showElaborationWindow, salesForm"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{sales.showElaborationWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">
										<aon:outputLabel for="Sales_elaborationDate"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Sales_elaborationDate"
											value="#{sales.elaborationProcess.date}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="bottom-right"
											verticalOffset="-100" />

										<aon:outputLabel for="Sales_elaborationWarehouse" 
											value="#{bundle.aon_module_warehouse}" />
										<aon:selectOneMenu id="Sales_elaborationWarehouse" 
											value="#{sales.elaborationProcess.warehouse}">
											<f:selectItems value="#{warehouseCollections.warehouses}" />
										</aon:selectOneMenu>
									</aon:panelGrid>
									
									<aon:div styleClass="aon-margin-top">
									
										<aon:dataTable id="linesDataTable" var="to" rows="10" 
											value="#{sales.elaborationProcess.model}"
											rendered="#{sales.elaborationProcess.model.rowCount > 0}">
	
											<aon:column styleClass="aon-editDataTable-iconColumn">
												<f:facet name="header">
													<aon:outputText value="&#160;" />
												</f:facet>
												<aon:div>
													<aon:commandButton id="elaborateButton"
														value="&#160;"
														title="#{bundle.warehouse_manufacture}"
														rendered="#{sales.elaborationProcess.rowLineElaborable}"
														actionListener="#{sales.elaborationProcess.onExecute}"
														reRender="showElaborationWindow"
														styleClass=" aon-finding-toolbar-item aon-noborder aon-icon-file-entrance" />
												</aon:div>
											</aon:column>
											
											<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_line}" />
												</f:facet>
												<aon:outputText value="#{to.line}" />
											</aon:column>
											
											<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_product}" />
												</f:facet>
												<aon:div id="customerName">
													<aon:outputText value="#{to.description}" />
												</aon:div>
											</aon:column>
											
											<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_quantity}" />
												</f:facet>
												<aon:outputText value="#{to.quantity}">
													<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
												</aon:outputText>
											</aon:column>
											
											<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_reference}" />
												</f:facet>
												<aon:outputText value="#{sales.elaborationProcess.rowReferenceCode}" />
											</aon:column>
											
											<aon:column alias="Sales.status"
												styleClass="aon-editDataTable-iconColumn aon-width-20 aon-text-center">
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_status_abrv}" />
												</f:facet>
												<aon:outputText value="#{sales.elaborationProcess.rowStatus}" />
											</aon:column>
											
										</aon:dataTable>
										
										<aon:dataScroller for="linesDataTable" showNote="true" pageSize="10"
											rowCount="#{sales.elaborationProcess.model.rowCount}" />
									
									</aon:div> 
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
