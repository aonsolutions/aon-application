<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salesSearch">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.sales_module}" />
				<ui:param name="controller" value="#{sales}" />
				<ui:define name="additionalToolbarContent">
					<aon:if test="#{sales.udapaIngenetEnabled}">
						<aon:commandButton id="import-Popup"
							value="#{bundle.aon_import}"
							title="#{bundle.aon_import}"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							actionListener="#{controller.udapaImporter.onImportFileShow}"
							action="sales_form">
							<f:setPropertyActionListener target="#{controller.udapaImporter.showImportFileWindow}"
								value="#{true}" />
						</aon:commandButton>
					</aon:if>
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{sales}" />
				<ui:define name="searchContent">
					<ui:include src="/com/code/aon/ui/sales/facelet/sales/searchContent.xhtml" >
						<ui:param name="searchController" value="#{salesSearch}" />
					</ui:include>
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />		
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		<aon:if test="#{aonConfiguration.bean.product.showSuppliers}">
			<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		</aon:if>
	</ui:define>
</ui:composition>
