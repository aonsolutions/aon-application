<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:column alias="Sales.series,Sales.number"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
		</f:facet>
		<aon:outputText value="#{to.referenceCode}" />
	</aon:column>

	<aon:column alias="Sales.issueDate"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.issueDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Sales.customer.registry.name"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_customer}" />
		</f:facet>
		<aon:outputText title="#{to.customer.registry.fullName}"
			value="#{to.customer.registry.fullName}">
			<aon:abbreviateConverter maxWidth="50" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Sales.seller.registry.name"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_module_commercial}" />
		</f:facet>
		<aon:outputText title="#{to.seller.registry.fullName}"
			value="#{to.seller.registry.alias}" >
			<aon:abbreviateConverter maxWidth="50" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Sales.purchaseReference"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.sales_purchase_reference}" />
		</f:facet>
		<aon:outputText value="#{to.purchaseReference}" />
	</aon:column>

	<aon:column alias="Sales.status"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status}" />
		</f:facet>
		<aon:outputText value="#{to.status}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_total}" />
		</f:facet>
		<aon:outputText value="#{controller.salesTotalPrice}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
		<f:facet name="footer">
			<aon:div id="totalAmountContainer" style="float:right">
				<aon:commandLink immediate="true" 
					reRender="totalAmountContainer"
					value="#{bundle.sales_show_total_amount}"
					styleClass="aon-dataTable-link aon-nowrap"
					onclick="this.disabled=true"
					rendered="#{controller.salesTotalAmount == null}"
					actionListener="#{controller.getSelectionTotalAmount}"/>									
				<aon:outputText	rendered="#{controller.salesTotalAmount != null}"
					style="text-align:right" value="#{controller.salesTotalAmount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
		</f:facet>
	</aon:column>
	
</ui:composition>
