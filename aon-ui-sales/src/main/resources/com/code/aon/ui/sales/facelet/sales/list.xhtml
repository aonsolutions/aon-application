<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salesList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{salesBundle.sales_module}" />
				<ui:param name="controller" value="#{sales}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="salesList2-excel-report" value="&#160;" 
						target="_new" rendered="#{!delivery.new}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="salesList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="salesList2-report" value="#{bundle.aon_listing}"
						target="_new" rendered="#{!sales.new}"
						action="#{report.onExecute}" 
						disabled="#{salesDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="salesList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="salesDetailledList-excel-report" value="&#160;"
						target="_new" rendered="#{!delivery.new}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="salesDetailledList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="salesDetailledList-report" value="#{bundle.aon_detailed_listing}"
						target="_new" rendered="#{!sales.new}"
						action="#{report.onExecute}" 
						disabled="#{salesDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="salesDetailledList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				<!-- 	<h:commandLink id="salesDetailledListNew" value="#{bundle.aon_detailed_listing}"
						target="_new" rendered="#{!sales.new}"
						action="#{report.onExecute}" 
						disabled="#{salesDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="salesDetailledListNew" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink> -->
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{sales}" />
					<ui:define name="columns">
						<aon:column alias="Sales.series,Sales.number"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>

						<aon:column alias="Sales.issueDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.issueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Sales.customer.registry.surname,Sales.customer.registry.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<h:outputText value="#{customerBundle.customer_customer}" />
							</f:facet>
							<aon:outputText value="#{to.customer.registry.fullName}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Sales.customer.registry.document"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.customer.registry.document}" />
						</aon:column>
		
						<aon:column alias="Sales.status"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{sales.salesTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
