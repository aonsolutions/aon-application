<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salesList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.sales_module}" />
				<ui:param name="controller" value="#{sales}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="salesList2-excel-report" value="&#160;" 
						target="_new" rendered="#{!delivery.nevv}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="salesList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="salesList2-report" value="#{bundle.aon_listing}"
						target="_new" rendered="#{!sales.nevv}"
						action="#{report.onExecute}" 
						disabled="#{salesDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="salesList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="salesDetailledList-excel-report" value="&#160;"
						target="_new" rendered="#{!delivery.nevv}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="salesDetailledList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="salesDetailledList-report" value="#{bundle.aon_detailed_listing}"
						target="_new" rendered="#{!sales.nevv}"
						action="#{report.onExecute}" 
						disabled="#{salesDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="salesDetailledList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{sales}" />
					<ui:define name="columns">

						<ui:include src="/com/code/aon/ui/sales/facelet/sales/list_content.xhtml">
							<ui:param name="controller" value="#{sales}" />
						</ui:include>

					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
