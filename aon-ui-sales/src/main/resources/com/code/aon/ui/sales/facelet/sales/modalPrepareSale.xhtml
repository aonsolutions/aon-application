<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showPrepareSaleWindow">
		<aon:if test="#{sales.showPrepareSaleWindow}">
			<rich:modalPanel id="prepareSalePanel" minHeight="400"
				minWidth="800" rendered="#{sales.showPrepareSaleWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.prepare_sale}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{sales.onCancelPrepareSale}"
							reRender="showPrepareSaleWindow, salesForm" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{sales.showPrepareSaleWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="prepareSaleForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="prepareSale-accept"	
											value="#{bundle.prepare_sale}"
											actionListener="#{sales.onPrepareSale}"
											styleClass="aon-finding-toolbar-item aon-icon-accept"
											reRender="showPrepareSaleWindow, salesForm">
											<f:setPropertyActionListener target="#{sales.showPrepareSaleWindow}"
												value="#{false}" />
									</aon:commandButton>

									<aon:commandButton id="prepareSale-cancel"
										value="#{bundle.aon_cancel}"
										actionListener="#{sales.onCancelPrepareSale}"
										reRender="showPrepareSaleWindow, salesForm"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{sales.showPrepareSaleWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="menuGrid" columns="4" dir="true" style="width: 100%;">
										<aon:outputLabel for="Sales_chargeDate"
											value="Fecha Carga" />
										<aon:selectInputDate id="Sales_chargeDate"
											value="#{sales.prepareSaleProcess.chargeDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="bottom-right"
											verticalOffset="-100" />

										<aon:outputLabel for="Sales_Delivery"
											value="Albarán" />
										<aon:div>
											<aon:selectOneMenu id="Sales_delivery" 
												value="#{sales.prepareSaleProcess.delivery}">
												<f:selectItem itemLabel=" - " itemValue="#{null}" />
												<f:selectItems value="#{sales.deliveries}" />
											</aon:selectOneMenu>
											
											<aon:selectBooleanCheckbox id="Sales_newDelivery" styleClass="aon-margin-left"
												value="#{sales.prepareSaleProcess.newDelivery}" />
											<aon:outputLabel for="Sales_newDelivery" styleClass="aon-italic"
												value="Crear Nuevo Albarán" />
										</aon:div>
										
										<aon:outputLabel for="Sales_deliveryDate"
											value="Fecha Entrega" />
										<aon:selectInputDate id="Sales_deliveryDate"
											value="#{sales.to.deliveryDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="bottom-right"
											verticalOffset="-100" />

										<aon:outputLabel for="Sales_carrier"
											value="#{bundle.warehouse_delivery_carrier}" />
										<aon:selectOneMenu id="Sales_carrier" 
											value="#{sales.prepareSaleProcess.carrier}">
											<f:selectItem itemLabel=" - " itemValue="#{null}" />
											<f:selectItems value="#{carrierCollections.carriers}" />
										</aon:selectOneMenu>
										
									</aon:panelGrid>
									<aon:div>
										<aon:selectBooleanCheckbox id="Sales_includePackingList" styleClass="aon-margin-left"
											value="#{sales.prepareSaleProcess.includePackingList}" 
											reRender="packingListDiv" immediate="true"
											/>
										<aon:outputLabel for="Sales_includePackingList" styleClass="aon-italic"
											value="Incluir Packing List" />
									</aon:div>
									<aon:div id="packingListDiv" styleClass="aon-padding-top">
										<aon:if test="#{sales.prepareSaleProcess.includePackingList}">
												
									<aon:panelGrid id="packingListMenuGrid" columns="4" dir="true" style="width: 100%;" >
										<aon:outputLabel for="Sales_PackingList"
											value="Packing List" />
										<aon:div>
											<aon:selectOneMenu id="Sales_PackingList" 
												disabled="#{sales.prepareSaleProcess.newPackingList}"
												value="#{sales.prepareSaleProcess.packingList}">
												<f:selectItem itemLabel=" - " itemValue="#{null}" />
												<f:selectItems value="#{sales.packingLists}" />
											</aon:selectOneMenu>
											
											<aon:selectBooleanCheckbox id="Sales_newPackingList" styleClass="aon-margin-left"
												value="#{sales.prepareSaleProcess.newPackingList}" reRender="packingListDiv" immediate="true" />
											<aon:outputLabel for="Sales_newPackingList" styleClass="aon-italic"
												value="Crear Nuevo Packing List" />
										</aon:div>
										
										<aon:outputLabel for="Sales_numberPlate"
											value="Matricula" />
										<aon:inputText id="Sales_numberPlate"  
											disabled="#{!sales.prepareSaleProcess.newPackingList}"
											size="20" maxlength="128"
											value="#{sales.prepareSaleProcess.numberPlate}" />
											
										<aon:outputLabel for="Sales_driverName"
											value="Nombre Conductor" />
										<aon:inputText id="Sales_driverName"  
											disabled="#{!sales.prepareSaleProcess.newPackingList}"
											size="20" maxlength="128"
											value="#{sales.prepareSaleProcess.driverName}" />
											
										<aon:outputLabel for="Sales_driverDocument"
											value="Documento Conductor" />
										<aon:inputText id="Sales_driverDocument"  
											disabled="#{!sales.prepareSaleProcess.newPackingList}"
											size="20" maxlength="128"
											value="#{sales.prepareSaleProcess.driverDocument}" />
									</aon:panelGrid>	
									</aon:if>
									</aon:div>
									
									<!-- Seleccionar detalles ... -->
									
									<aon:div>
										<aon:selectBooleanCheckbox id="Sales_partialPreparation" styleClass="aon-margin-left"
											value="#{sales.prepareSaleProcess.partialPreparation}" 
											reRender="partialPreparationDiv" immediate="true"
											/>
										<aon:outputLabel for="Sales_partialPreparation" styleClass="aon-italic"
											value="Preparación Parcial" />
									</aon:div>					
									
									<aon:div id="partialPreparationDiv"  styleClass="aon-margin-top">
									
										<aon:dataTable id="linesDataTable" var="to" rows="10" 
											value="#{sales.prepareSaleProcess.model}"
											rendered="#{sales.prepareSaleProcess.partialPreparation}">
	
											<aon:column styleClass="aon-editDataTable-iconColumn">
												<f:facet name="header">
													<aon:outputText value="&#160;" />
												</f:facet>
												<aon:div>
													<aon:selectBooleanCheckbox id="Sales_partialPreparationCheckbox#{to.id}" styleClass="aon-margin-left"
															actionListener="#{sales.prepareSaleProcess.rowSelectedDetail(to.id)}"
															
													/>
												</aon:div>
											</aon:column>
											
											<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_line}" />
												</f:facet>
												<aon:outputText value="#{to.line}" />
											</aon:column>
											
											<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_product}" />
												</f:facet>
												<aon:div id="customerName">
													<aon:outputText value="#{to.description}" />
												</aon:div>
											</aon:column>
											
											<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_quantity}" />
												</f:facet>
												<aon:outputText value="#{to.quantity}">
													<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
												</aon:outputText>
											</aon:column>
											
										</aon:dataTable>
										
<!-- 										<aon:dataScroller for="linesDataTable" showNote="true" pageSize="10"
											rowCount="#{sales.elaborationProcess.model.rowCount}" /> -->
									
									</aon:div> 
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
