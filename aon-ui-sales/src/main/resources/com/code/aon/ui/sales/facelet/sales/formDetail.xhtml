<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="dataTableId" value="salesDetails" />
		<ui:param name="controller" value="#{salesDetail}" />
		<ui:param name="rows" value="0" />
		<ui:param name="showNote" value="false" />
		<ui:param name="showDataScroller" value="false" />
		<ui:param name="skipResetButton" value="#{!sales.pending}" />
		<ui:param name="skipLineEdition" value="#{!sales.pending or !salesDetail.pending}" />
		<ui:param name="skipSaveButton" value="#{salesDetail.offerSource}" />
		<ui:param name="rowSelectorReRender" value="menuExt" />
		<ui:param name="resetButtonReRender" value="menuExt" />
		<ui:param name="newCancelButtonReRender" value="menuExt" />
		<ui:param name="cancelButtonReRender" value="menuExt" />
		<ui:param name="newSaveButtonReRender" value="menuExt,headerData,Sales_total" />
		<ui:param name="saveButtonReRender" value="menuExt,headerData,Sales_total" />
		<ui:param name="removeButtonReRender" value="menuExt,headerData,Sales_total" />
		<ui:param name="focusOnAdd" value="Item_id-New" />
		<ui:param name="focusOnSelect" value="Item_id" />
	
		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel for="SalesDetail_line" value="#{salesBundle.sales_detail_line}" />
				</f:facet>
				<aon:outputText value="#{to.line}"
					rendered="#{formList}" />
				<aon:inputText id="SalesDetail_line" 
					value="#{controller.to.line}" rendered="#{formEdit}"
					required="true" size="1" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText id="SalesDetail_line-New" 
						value="#{controller.to.line}" rendered="#{formNew}"
						required="true" size="1" maxlength="3" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="Item_id" value="#{productBundle.product_item}" />
				</f:facet>
				<aon:outputText value="#{to.description}"
					rendered="#{formList}">
					<aon:abbreviateConverter maxWidth="64" />
				</aon:outputText>
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupTo" value="#{salesDetail.to.item}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="skipSuggestText" value="#{salesDetail.to.item != null and salesDetail.to.item.id != null}" />
					<ui:param name="lookupInputOnFocus" value="SalesDetail_description" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<ui:param name="lookupReRender" 
						value="salesDetailItemEdit,SalesDetail_quantity,SalesDetail_price,SalesDetail_discount,SalesDetail_amount" />
					<aon:methodParam name="lookupChangeListener"
						value="#{salesDetail.onItemChanged}" type="lookupChangeListener" />
				</ui:include>
				<aon:panelGroup id="salesDetailItemEdit" style="vertical-align:top;" rendered="#{formEdit}">
					<c:if test="#{aonConfiguration.bean.product.showStock}">
						<aon:commandButton value="&#160;"
							title="#{productBundle.product_info}"
							rendered="#{salesDetail.to.item != null and salesDetail.to.item.id != null and salesDetail.to.item.product.inventoriable}"
							styleClass="aon-finding-toolbar-item aon-icon-info aon-finding-toolbar-item-no-border"
							actionListener="#{itemInfo.onShowPanel}"
							reRender="itemInfoContainer">
							<aon:set var="#{itemInfo.stockVisible}" value="#{true}" />
							<aon:set var="#{itemInfo.alternativesVisible}" value="#{true}" />
							<aon:set var="#{itemInfo.item}" value="#{salesDetail.to.item}" /> 
							<aon:set var="#{itemInfo.warehouse}" value="#{null}" /> 
							<aon:set var="#{itemInfo.componentId}" value="SalesDetail_description" />
							<aon:set var="#{itemInfo.alternativeMethod}" value="salesDetail.onItemChanged" />
						</aon:commandButton>															
					</c:if>
					<aon:inputTextarea id="SalesDetail_description" 
						value="#{salesDetail.to.description}"
						rendered="#{salesDetail.to.item != null and salesDetail.to.item.id != null}"
						cols="60" rows="#{!salesDetail.longDescription?1:5}"
						style="#{!salesDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
						<f:validateLength maximum="1024" />
					</aon:inputTextarea>
					<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
						actionListener="#{salesDetail.onShortDescription}" reRender="SalesDetail_description"
						rendered="#{salesDetail.longDescription and salesDetail.to.item.product.code != null}" />
					<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
						actionListener="#{salesDetail.onLongDescription}" reRender="SalesDetail_description"
						rendered="#{!salesDetail.longDescription and salesDetail.to.item.product.code != null}" />
				</aon:panelGroup>
				<f:facet name="footer" >
					<aon:div>
						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{salesDetail.to.item}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="skipSuggestText" value="#{salesDetail.to.item != null and salesDetail.to.item.id != null}" />
							<ui:param name="lookupInputOnFocus" value="SalesDetail_description-New" />
							<ui:param name="lookupSuffix" value="-New" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupReRender" 
								value="salesDetailItemNew,SalesDetail_quantity-New,SalesDetail_price-New,SalesDetail_discount-New,SalesDetail_amount-New" />
							<aon:methodParam name="lookupChangeListener"
								value="#{salesDetail.onItemChanged}" type="lookupChangeListener" />
						</ui:include>
						<aon:panelGroup id="salesDetailItemNew" style="vertical-align:top;" rendered="#{formNew}">
							<c:if test="#{aonConfiguration.bean.product.showStock}">
								<aon:commandButton value="&#160;"
									title="#{productBundle.product_info}"
									rendered="#{salesDetail.to.item != null and salesDetail.to.item.id != null and salesDetail.to.item.product.inventoriable}"
									styleClass="aon-finding-toolbar-item aon-icon-info aon-finding-toolbar-item-no-border"
									actionListener="#{itemInfo.onShowPanel}"
									reRender="itemInfoContainer">
									<aon:set var="#{itemInfo.stockVisible}" value="#{true}" />
									<aon:set var="#{itemInfo.alternativesVisible}" value="#{true}" />
									<aon:set var="#{itemInfo.item}" value="#{salesDetail.to.item}" /> 
									<aon:set var="#{itemInfo.warehouse}" value="#{null}" /> 
									<aon:set var="#{itemInfo.componentId}" value="SalesDetail_description-New" />
									<aon:set var="#{itemInfo.alternativeMethod}" value="salesDetail.onItemChanged" />
								</aon:commandButton>															
							</c:if>
							<aon:inputTextarea id="SalesDetail_description-New"
								value="#{salesDetail.to.description}"
								rendered="#{salesDetail.to.item != null and salesDetail.to.item.id != null}"
								cols="60" rows="#{!salesDetail.longDescription?1:5}"
								style="#{!salesDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
							<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
								actionListener="#{salesDetail.onShortDescription}" reRender="SalesDetail_description-New"
								rendered="#{salesDetail.longDescription and salesDetail.to.item.product.code != null}" />
							<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
								actionListener="#{salesDetail.onLongDescription}" reRender="SalesDetail_description-New"
								rendered="#{!salesDetail.longDescription and salesDetail.to.item.product.code != null}" />
						</aon:panelGroup>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="SalesDetail_quantity" value="#{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
				<aon:inputText id="SalesDetail_quantity" 
					value="#{controller.to.quantity}" rendered="#{formEdit}"
					valueChangeListener="#{controller.onQuantityChanged}" 
					reRender="SalesDetail_price,SalesDetail_discount,SalesDetail_amount" 
					required="true" size="5" focus="SalesDetail_price" />
				<f:facet name="footer">
					<aon:inputText id="SalesDetail_quantity-New" 
						value="#{controller.to.quantity}" rendered="#{formNew}" 
						valueChangeListener="#{controller.onQuantityChanged}" 
						reRender="SalesDetail_price-New,SalesDetail_discount-New,SalesDetail_amount-New" 
						required="true" size="5" focus="SalesDetail_price-New" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="SalesDetail_price" value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:inputText id="SalesDetail_price" 
					value="#{controller.to.price}" rendered="#{formEdit}" 
					reRender="SalesDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="SalesDetail_price-New" 
						value="#{controller.to.price}" rendered="#{formNew}" 
						reRender="SalesDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="SalesDetail_discount" value="#{bundle.aon_discount}" />
				</f:facet>
				<aon:outputText value="#{to.discountExpression.discountExpr}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:inputText id="SalesDetail_discount" 
					value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
					reRender="SalesDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="SalesDetail_discount-New" 
						value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}" 
						reRender="SalesDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="SalesDetail_amount" value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText value="#{controller.modelAmount}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:outputText id="SalesDetail_amount" 
					value="#{controller.amount}" rendered="#{formEdit}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:outputText id="SalesDetail_amount-New" 
							value="#{controller.amount}" rendered="#{formNew}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText id="Sales_taxableBase" 
							value="#{sales.taxableBase}" rendered="#{!formNew}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
				<f:facet name="header">
					<aon:outputLabel value="INFO" />
				</f:facet>
				<aon:div rendered="#{to.offerDetail != null and to.offerDetail.id != null}" 
					style="display:inline;cursor:pointer;">
					<aon:outputText value="&#160;"
						styleClass="aon-icon-transfer" style="padding-left:20px" />
					<rich:toolTip value="#{controller.lineSourceInfo}" />
				</aon:div>
				<aon:div rendered="#{!controller.pending}" 
					style="display:inline;cursor:pointer;">
					<aon:outputText value="&#160;"
						styleClass="#{controller.settled ? 'aon-icon-predetermine' : 'aon-icon-predetermine2'}" 
						style="padding-left:20px" />
					<rich:toolTip value="#{controller.lineStatusInfo}" />
				</aon:div>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
