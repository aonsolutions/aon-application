<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{salesDetail}" />
		<ui:param name="showNote" value="false" />
		<ui:param name="showDataScroller" value="false" />
		<ui:param name="skipResetButton" value="#{!sales.pending}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="rowSelectorReRender" value="menuExt" />
		<ui:param name="resetButtonReRender" value="menuExt" />
		<ui:param name="newCancelButtonReRender" value="menuExt" />
		<ui:param name="cancelButtonReRender" value="menuExt" />
		<ui:param name="newSaveButtonReRender" value="menuExt,Sales_total" />
		<ui:param name="saveButtonReRender" value="menuExt,Sales_deliveryDate,Sales_total" />
		<ui:param name="removeButtonReRender" value="menuExt,Sales_total" />
		<ui:param name="focusOnAdd" value="Item_id-New" />
		<ui:param name="focusOnSelect" value="Item_id" />
		<ui:define name="beginFormListContent">
			<aon:commandLink id="#{dataTableId}-selectButton"
				styleClass="aon-table-row-link" value="&#160;"
				immediate="true" ajaxSingle="true" requestDelay="100"
				rendered="#{sales.pending}"
				actionListener="#{salesDetail.onSelect}"
				onkeyup="#{dataTableId}KeyUp(this)"
				onfocus="#{dataTableId}SelectRow(this)"
				onblur="#{dataTableId}DeselectRow(this)"
				focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
			</aon:commandLink>
		</ui:define>

		<ui:define name="endFormListContent" >
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
				<ui:param name="auditableTO" value="#{to}" />
			</ui:include>
			<aon:commandButton id="salesDetailDeliveryDate" value="&#160;"
				styleClass="#{(to.deliveryDate != null and to.deliveryDate == sales.to.deliveryDate) ? 
								('aon-icon-commandButton aon-icon-calendar-green') : ('aon-icon-commandButton aon-icon-calendar-red')}"
				rendered="#{to.deliveryDate != null}"
				actionListener="#{controller.onSalesDetailSelect}" 
				reRender="showDeliveryDateWindow">
				<rich:toolTip>
					<aon:outputText value="#{bundle.aon_delivery_date}:"
						styleClass="aon-margin-right" />
					<aon:outputText value="#{to.deliveryDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</rich:toolTip>
				<f:setPropertyActionListener target="#{controller.showDeliveryDateWindow}"
					value="#{true}" />								
			</aon:commandButton>
			<aon:commandButton id="salesDetailCarrier" value="&#160;"
				styleClass="#{(to.carrier != null and to.carrier.id == sales.to.carrier.id) ? 
								('aon-icon-commandButton aon-icon-carrier') : ('aon-icon-commandButton aon-icon-carrier-error')}"
				rendered="#{to.carrier.id != null}"
				actionListener="#{controller.onSalesDetailSelect}" 
				reRender="showCarrierWindow">
				<rich:toolTip>
					<aon:outputText value="#{bundle.warehouse_delivery_carrier}:"
						styleClass="aon-margin-right" />
					<aon:outputText value="#{to.carrier.registry.fullName}" />
				</rich:toolTip>
				<f:setPropertyActionListener target="#{controller.showCarrierWindow}"
					value="#{true}" />								
			</aon:commandButton>
		</ui:define>

		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel for="SalesDetail_line" value="#{bundle.aon_line}" />
				</f:facet>
				<aon:outputText value="#{to.line}"
					rendered="#{formList}" />
				<aon:inputText id="SalesDetail_line" 
					value="#{controller.to.line}" rendered="#{formEdit}"
					required="true" size="1" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText id="SalesDetail_line-New" 
						value="#{controller.to.line}" rendered="#{formNew}"
						required="true" size="1" maxlength="3" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="Item_id" value="#{bundle.aon_product}" />
				</f:facet>
				<aon:outputText value="#{to.description}"
					rendered="#{formList}">
					<aon:abbreviateConverter maxWidth="64" />
				</aon:outputText>
				<aon:commandLink id="SalesDetail_serialNumber" immediate="true"
					value="&#160;" title="#{bundle.aon_to_specify} #{to.item.product.lotable ? bundle.aon_lot_number : bundle.aon_serial_number}"
					styleClass="aon-icon-version" style="margin-left: 5px; padding-right: 12px;"
					rendered="#{formList and to.item.wildCard}"
					actionListener="#{salesDetail.onAssignSerialNumberShow}" 
					reRender="showSerialNumberWindow" ajaxSingle="true"
					onclick="if(#{salesDetail.elaborated}){alert('En elaboracion');return false;}">
					<f:setPropertyActionListener target="#{salesDetail.showSerialNumberWindow}"
						value="#{true}" />
					<f:setPropertyActionListener target="#{controller.createSerialNumbers}"
						value="#{false}" />
				</aon:commandLink>
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupBean" value="#{saleItemLookup}" />
					<ui:param name="lookupTo" value="#{salesDetail.to.item}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="skipSuggestText" value="#{salesDetail.to.item != null and salesDetail.to.item.id != null}" />
					<ui:param name="lookupInputOnFocus" value="SalesDetail_description" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<ui:param name="lookupDisabled" value="#{!controller.editable or !controller.to.pending}" />
					<ui:param name="lookupReRender" 
						value="salesDetailItemEdit,salesDetailQuantityEdit,SalesDetail_price,SalesDetail_discount,SalesDetail_amount" />
					<ui:param name="lookupControllerListener" value="#{itemLookupWildCardListener}" />
					<aon:methodParam name="lookupChangeListener"
						value="#{salesDetail.onItemChanged}" type="lookupChangeListener" />
				</ui:include>
				<aon:panelGroup id="salesDetailItemEdit" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formEdit}">
					<aon:if test="#{aonConfiguration.bean.product.showStock}">
						<aon:commandLink id="SalesDetail_itemInfo"
							value="&#160;" title="#{bundle.product_info}"
							styleClass="aon-icon-info" style="margin-left: 5px; padding-right: 12px; padding-top: 1px;"
							rendered="#{salesDetail.to.item != null and salesDetail.to.item.id != null and salesDetail.to.item.product.inventoriable}"
							actionListener="#{itemInfo.onShowPanel}"
							reRender="itemInfoContainer">
							<aon:set var="#{itemInfo.stockVisible}" value="#{true}" />
							<aon:set var="#{itemInfo.alternativesVisible}" value="#{true}" />
							<aon:set var="#{itemInfo.item}" value="#{salesDetail.to.item}" /> 
							<aon:set var="#{itemInfo.warehouse}" value="#{null}" /> 
							<aon:set var="#{itemInfo.componentId}" value="Item_id" />
							<aon:set var="#{itemInfo.alternativeMethod}" value="salesDetail.onItemChanged" />
						</aon:commandLink>															
					</aon:if>
					<aon:inputTextarea id="SalesDetail_description" 
						value="#{salesDetail.to.description}"
						rendered="#{salesDetail.to.item != null and salesDetail.to.item.id != null}"
						cols="60" rows="#{!salesDetail.longDescription?1:5}"
						style="#{!salesDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
						<f:validateLength maximum="1024" />
					</aon:inputTextarea>
					<aon:commandLink id="SalesDetail_description_short" immediate="true"
						value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
						styleClass="aon-icon-edit-end-simple aon-vertical-align-top" 
						style="margin-left: 5px; padding-right: 12px;"
						rendered="#{salesDetail.longDescription and salesDetail.to.item.product.code != null}"
						actionListener="#{salesDetail.onShortDescription}" 
						reRender="salesDetailItemEdit" ajaxSingle="true" />
					<aon:commandLink id="SalesDetail_description_long" immediate="true"
						value="&#160;" title="#{bundle.aon_edit}"
						styleClass="aon-icon-edit-add-simple aon-vertical-align-top" 
						style="margin-left: 5px; padding-right: 12px;"
						rendered="#{!salesDetail.longDescription and salesDetail.to.item.product.code != null}"
						actionListener="#{salesDetail.onLongDescription}"
						reRender="salesDetailItemEdit" ajaxSingle="true" />
				</aon:panelGroup>
				<f:facet name="footer">
					<aon:div>
						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
							<ui:param name="lookupBean" value="#{saleItemLookup}" />
							<ui:param name="lookupTo" value="#{salesDetail.to.item}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="skipSuggestText" value="#{salesDetail.to.item != null and salesDetail.to.item.id != null}" />
							<ui:param name="lookupInputOnFocus" value="SalesDetail_description-New" />
							<ui:param name="lookupSuffix" value="-New" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupReRender" 
								value="salesDetailItemNew,salesDetailQuantityNew,SalesDetail_price-New,SalesDetail_discount-New,
										SalesDetail_amount-New" />
							<ui:param name="lookupControllerListener" value="#{itemLookupWildCardListener}" />
							<aon:methodParam name="lookupChangeListener"
								value="#{salesDetail.onItemChanged}" type="lookupChangeListener" />
						</ui:include>
						<aon:panelGroup id="salesDetailItemNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
							<aon:if test="#{aonConfiguration.bean.product.showStock}">
								<aon:commandLink id="SalesDetail_itemInfo-New"
									value="&#160;" title="#{bundle.product_info}"
									styleClass="aon-icon-info aon-vertical-align-top" 
									style="margin-left: 5px; padding-right: 12px; padding-top: 1px;"
									rendered="#{salesDetail.to.item != null and salesDetail.to.item.id != null and salesDetail.to.item.product.inventoriable}"
									actionListener="#{itemInfo.onShowPanel}"
									reRender="itemInfoContainer">
									<aon:set var="#{itemInfo.stockVisible}" value="#{true}" />
									<aon:set var="#{itemInfo.alternativesVisible}" value="#{true}" />
									<aon:set var="#{itemInfo.item}" value="#{salesDetail.to.item}" /> 
									<aon:set var="#{itemInfo.warehouse}" value="#{null}" /> 
									<aon:set var="#{itemInfo.componentId}" value="Item_id-New" />
									<aon:set var="#{itemInfo.alternativeMethod}" value="salesDetail.onItemChanged" />
								</aon:commandLink>															
							</aon:if>
							<aon:inputTextarea id="SalesDetail_description-New"
								value="#{salesDetail.to.description}"
								rendered="#{salesDetail.to.item != null and salesDetail.to.item.id != null}"
								cols="60" rows="#{!salesDetail.longDescription?1:5}"
								style="#{!salesDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
							<aon:commandLink id="SalesDetail_description_short-New" immediate="true"
								value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
								styleClass="aon-icon-edit-end-simple aon-vertical-align-top" 
								style="margin-left: 5px; padding-right: 12px;"
								rendered="#{salesDetail.longDescription and salesDetail.to.item.product.code != null}"
								actionListener="#{salesDetail.onShortDescription}" 
								reRender="salesDetailItemNew" ajaxSingle="true" />
							<aon:commandLink id="SalesDetail_description_long-New" immediate="true"
								value="&#160;" title="#{bundle.aon_edit}"
								styleClass="aon-icon-edit-add-simple aon-vertical-align-top" 
								style="margin-left: 5px; padding-right: 12px;"
								rendered="#{!salesDetail.longDescription and salesDetail.to.item.product.code != null}"
								actionListener="#{salesDetail.onLongDescription}"
								reRender="salesDetailItemNew" ajaxSingle="true" />
							<aon:if test="#{domainSwitcher.alphaDomain}">
								<aon:commandButton id="itemCompositionEdit" value="&#160;"
									title="#{bundle.aon_to_specify} #{bundle.product_composition}"
									styleClass="aon-icon-version aon-vertical-align-top"
									rendered="#{controller.to.item.product.composition}"
									reRender="showItemCompositionWindow">
									<f:setPropertyActionListener target="#{controller.compositeHandler.showItemCompositionWindow}"
										value="#{true}" />								
								</aon:commandButton>
							</aon:if>
						</aon:panelGroup>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="SalesDetail_quantity" value="#{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}"
					rendered="#{formList or !controller.modelEditable}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
				<aon:panelGroup id="salesDetailQuantityEdit" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formEdit and controller.editable}">
					<aon:inputText id="SalesDetail_quantity" 
						value="#{controller.to.quantity}" rendered="#{formEdit and controller.editable}"
						valueChangeListener="#{controller.onQuantityChanged}" 
						reRender="SalesDetail_pendingQuantity,SalesDetail_price,SalesDetail_discount,SalesDetail_amount" 
						required="true" size="4" focus="SalesDetail_price" />
					<aon:commandLink id="SalesDetail_quantity-packaged"
						styleClass="aon-finding-toolbar-item aon-noborder aon-icon-package"
						value="&#160;" title="#{bundle.aon_to_specify} #{bundle.product_packaged}"
						rendered="#{controller.to.item.product.packaged}"
						actionListener="#{controller.onItemPackageShow}"
						reRender="showItemPackageWindow">
						<f:setPropertyActionListener target="#{salesDetail.showItemPackageWindow}"
							value="#{true}" />
					</aon:commandLink>
				</aon:panelGroup>
				<f:facet name="footer">
					<aon:div styleClass="aon-text-right">
						<aon:panelGroup id="salesDetailQuantityNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
							<aon:inputText id="SalesDetail_quantity-New" 
								value="#{controller.to.quantity}" rendered="#{formNew}" 
								valueChangeListener="#{controller.onQuantityChanged}" 
								reRender="SalesDetail_price-New,SalesDetail_discount-New,SalesDetail_amount-New" 
								required="true" size="4" focus="SalesDetail_price-New" />
							<aon:commandLink id="SalesDetail_quantity-packaged-New"
								styleClass="aon-finding-toolbar-item aon-noborder aon-icon-package"
								value="&#160;" title="#{bundle.aon_to_specify} #{bundle.product_packaged}"
								rendered="#{controller.to.item.product.packaged}"
								actionListener="#{controller.onItemPackageShow}"
								reRender="showItemPackageWindow">
								<f:setPropertyActionListener target="#{salesDetail.showItemPackageWindow}"
									value="#{true}" />
							</aon:commandLink>
						</aon:panelGroup>
						<aon:outputText id="Sales_totalDetailQuantity" 
							value="#{sales.totalDetailQuantity}" rendered="#{!formNew}">
							<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_pending}" />
				</f:facet>
				<aon:outputText id="SalesDetail_pendingQuantity" 
					value="#{to.pendingQuantity}"
					rendered="#{formEdit or formList}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="SalesDetail_price" value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:inputText id="SalesDetail_price" 
					value="#{controller.to.price}" rendered="#{formEdit}" 
					reRender="SalesDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="SalesDetail_price-New" 
						value="#{controller.to.price}" rendered="#{formNew}" 
						reRender="SalesDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="SalesDetail_discount" value="#{bundle.aon_discount}" />
				</f:facet>
				<aon:outputText value="#{to.discountExpression.discountExpr}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:inputText id="SalesDetail_discount" 
					value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
					reRender="SalesDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="SalesDetail_discount-New" 
						value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}" 
						reRender="SalesDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="SalesDetail_amount" value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText value="#{controller.modelAmount}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:outputText id="SalesDetail_amount" 
					value="#{controller.amount}" rendered="#{formEdit}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:outputText id="SalesDetail_amount-New" 
							value="#{controller.amount}" rendered="#{formNew}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText id="Sales_taxableBase" 
							value="#{sales.taxableBase}" rendered="#{!formNew}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
				<f:facet name="header">
					<aon:outputLabel value="INFO" />
				</f:facet>
				<aon:commandLink id="salesDetailSourceLink" immediate="true"
					styleClass="aon-button-goto" style="padding-right: 20px;"
					value="&#160;" title="#{bundle.aon_go}" 
					rendered="#{to.offerDetail != null and to.offerDetail.id != null}" 
					actionListener="#{controller.onLoadOffer}"
					action="offer_form"
					reRender="aonContent">
					<rich:toolTip value="#{controller.lineSourceInfo}" />
				</aon:commandLink>
				<aon:commandLink id="salesDetailDeliveryLink" immediate="true"
					styleClass="#{controller.settled ? 'aon-icon-predetermine' : 'aon-icon-predetermine2'}"
					style="padding-right: 20px;" 
					value="&#160;" title="#{bundle.aon_go}" 
					rendered="#{!controller.pending}" 
					actionListener="#{controller.onLoadDelivery}"
					action="delivery_form"
					reRender="aonContent">
					<rich:toolTip value="#{controller.lineStatusInfo}" />
				</aon:commandLink>
				<aon:commandLink id="salesDetailPurchaseLink" immediate="true"
					styleClass="aon-button-goto"
					style="padding-right: 20px;" 
					value="&#160;" title="#{bundle.aon_go}" 
					rendered="#{controller.purchased}"
					actionListener="#{controller.onLoadPurchase}"
					action="purchase_form"
					reRender="aonContent">
					<rich:toolTip value="#{controller.linePurchaseInfo}" />
				</aon:commandLink>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
