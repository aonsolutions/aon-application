<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salesForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.sales_module}" />
					<ui:param name="controller" value="#{sales}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{!sales.pending}" />
					<ui:param name="skipRemoveButton" value="#{!sales.pending or sales.inDelivery}" />
					<ui:param name="showMoreMenu" value="#{!sales.nevv}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton value="&#160;" id="email"
							title="#{bundle.webmail_send_email}"
							actionListener="#{sales.onSendByEmail}"
							rendered="#{salesDetail.model.rowCount > 0 and salesDetail.to == null}"
							styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border">
						</aon:commandButton>									
						<aon:htmlCommandLink id="sales-report" value="#{bundle.aon_invoice_sales}"
							target="_new" rendered="#{!sales.nevv and salesDetail.model.rowCount > 0}"
							action="#{report.onExecute}"
							disabled="#{salesDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="sales" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
						<aon:if test="#{company.ediSupportEnabled}">
							<aon:commandButton id="sales-ediFtp"
								value="SERESNET"
								title="Recuperar del servidor FTP de Seresnet"
								styleClass="aon-finding-toolbar-item aon-icon-seresnet"
								actionListener="#{controller.ftpEdiDownloader.onShowFtpEdi}"
								ajaxSingle="#{true}"
								action="sales_form"
								onclick="Richfaces.showModalPanel('waitProccess')" 
								oncomplete="Richfaces.hideModalPanel('waitProccess')">
								<f:setPropertyActionListener target="#{sales.ftpEdiDownloader.showEdiFtpWindow}"
									value="#{true}" />
							</aon:commandButton>
						</aon:if>
					</ui:define>
					<ui:define name="moreMenuContent">
						<aon:if test="#{aonRole.warehouseOperator}">
							<aon:menuItem id="delivery"
								value="#{bundle.aon_invoice_delivery}"
								immediate="#{true}" rendered="#{sales.pending and salesDetail.model.rowCount > 0}"
								iconClass="aon-icon-open-popup" 
								actionListener="#{sales.onDeliveryShow}"
								reRender="showDeliveryWindow">
								<f:setPropertyActionListener target="#{sales.showDeliveryWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:if test="#{aonRole.warehouseOperator}">
							<aon:menuItem id="manufacture"
								value="#{bundle.warehouse_manufacturing_order}"
								immediate="#{true}" rendered="#{sales.manufacturable}"
								disabled="#{!sales.manufacturePending}"
								iconClass="aon-icon-task"
								actionListener="#{sales.onManufacture}"
								action="sales_form"
								onclick="if (!confirm('#{bundle.aon_confirm_title}')) {return false;} else {Richfaces.showModalPanel('waitProccess');}"
								oncomplete="Richfaces.hideModalPanel('waitProccess')"/>
						</aon:if>
						<aon:menuItem id="purchaseGeneration"
							value="#{bundle.sales_to_purchase}"
							immediate="#{true}" 
							rendered="#{sales.pending and !sales.inDelivery and salesDetail.model.rowCount > 0}"
							iconClass="aon-icon-transfer"
							actionListener="#{sales.onPurchaseGenerationShow}"
							reRender="showPurchaseWindow">
							<f:setPropertyActionListener target="#{sales.showPurchaseWindow}"
								value="#{true}" />
						</aon:menuItem>
						<aon:if test="#{aonRole.financeOperator}">
							<aon:menuItem id="invoice"
								value="#{bundle.aon_key_invoice_description}"
								immediate="#{true}" rendered="#{sales.pending and !sales.inDelivery and salesDetail.model.rowCount > 0}"
								iconClass="aon-icon-favorite"
								actionListener="#{sales.onInvoiceShow}"
								reRender="showInvoiceWindow">
								<f:setPropertyActionListener target="#{sales.showInvoiceWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="salesReturnRequest"
							value="#{bundle.sales_return_request}"
							rendered="#{!sales.nevv}"
							iconClass="aon-icon-alternative"
							action="sales_form"
							actionListener="#{sales.onReturnRequest}" 
							onclick="if (!confirm('#{bundle.aon_confirm_title}')) { return false;}" />
						<aon:menuItem id="salesShipment"
							value="#{bundle.carrier_shipment}"
							rendered="#{!sales.nevv and sales.pending}"
							iconClass="aon-icon-rename"
							reRender="showShipmentWindow">
							<f:setPropertyActionListener target="#{sales.showShipmentWindow}"
								value="#{true}" />
						</aon:menuItem>
						<aon:if test="#{company.ediSupportEnabled}">
							<rich:menuSeparator />
							<aon:menuItem id="import-Popup"
								value="#{bundle.aon_import} #{bundle.aon_edi}"
								iconClass="aon-icon-file-entrance"
								actionListener="#{sales.udapaImporter.onImportFileShow}"
								ajaxSingle="#{true}"
								action="sales_form">
								<f:setPropertyActionListener target="#{sales.udapaImporter.showImportFileWindow}"
									value="#{true}" />
							</aon:menuItem >
							<aon:menuItem id="ediImport-Popup"
								value="#{bundle.aon_import} #{bundle.aon_edi} (CONNECT)"
								iconClass="aon-icon-new-text"
								actionListener="#{sales.ediImporter.onImportFileShow}"
								ajaxSingle="#{true}"
								action="sales_form">
								<f:setPropertyActionListener target="#{sales.ediImporter.showImportFileWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<ui:include
							src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					styleClass="aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Sales_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
								<ui:param name="controller" value="#{sales}" />
								<ui:param name="seriesChangedReRender" value="Sales_securityLevel" />
								<ui:param name="skipSeriesLabel" value="#{true}" />
							</ui:include>
							<aon:div>
								<aon:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Sales_securityLevel"
										value="#{sales.to.confidential}"
										rendered="#{sales.pending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{sales.pending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{!sales.pending and sales.to.confidential}" />
								</aon:if>

								<aon:outputText id="sales-itemReturn"
									rendered="#{sales.to.itemReturn}"
									title="#{bundle.aon_return}"
									value="&#160;"
									styleClass="aon-icon-alternative aon-margin-left aon-padding-left aon-padding-right" />
								
								<aon:outputText id="sales-purchaseGenerated"
									rendered="#{sales.to.purchaseGenerated}"
									title="#{bundle.sales_purchase_generation_done}"
									value="&#160;"
									styleClass="aon-icon-transfer aon-margin-left aon-padding-left aon-padding-right" />
								
								<aon:outputText styleClass="aon-margin-left aon-margin-right"
									value="#{sales.to.status}" />
								<aon:outputText styleClass="aon-italic aon-margin-left"
									value="(#{bundle.finance_invoice}: "
									rendered="#{sales.invoiced}" />
								<aon:outputText styleClass="aon-bold"
									value="#{sales.invoiceCode}"
									rendered="#{sales.invoiced}" />
								<aon:outputText styleClass="aon-italic" value=")"
									rendered="#{sales.invoiced}" />
								<aon:commandLink id="invoice_link" immediate="true"
									styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
									value="&#160;" title="#{bundle.aon_go}"
									rendered="#{sales.invoiced}"
									actionListener="#{sales.onLoadInvoice}"
									action="saleInvoice_form" />

								<aon:commandButton id="toPending" value="&#160;"
									actionListener="#{sales.onPending}" 
									title="#{bundle.sales_to_pending}"
									immediate="true" rendered="#{sales.closed}"
									styleClass="aon-icon-commandButton aon-icon-refresh aon-margin-left" />
								<aon:commandButton id="close" value="&#160;"
									actionListener="#{sales.onClose}"
									title="#{bundle.sales_to_close}"
									immediate="true" rendered="#{sales.pending and salesDetail.model.rowCount > 0}"
									styleClass="aon-icon-commandButton aon-icon-point-red" />
								<aon:commandButton id="block" value="&#160;"
									actionListener="#{sales.onBlock}"
									title="#{bundle.sales_to_block}"
									immediate="true" rendered="#{!sales.nevv and sales.pending}"
									styleClass="aon-icon-commandButton aon-icon-lock">
								</aon:commandButton>										
								<aon:commandButton id="unblock" value="&#160;"
									actionListener="#{sales.onUnblock}"
									title="#{bundle.sales_to_unblock}"
									immediate="true" rendered="#{sales.blocked}"
									styleClass="aon-icon-commandButton aon-icon-unlock aon-margin-left">
								</aon:commandButton>										
							</aon:div>
						</h:panelGrid>
 					</aon:div>

					<aon:outputLabel for="Sales_issueDate" 
						value="#{bundle.aon_date}" />
 					<aon:div>
						<aon:selectInputDate id="Sales_issueDate"
							value="#{sales.to.issueDate}" 
							required="true" disabled="#{!sales.pending}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="Sales_documentType"
							styleClass="aon-margin-left aon-italic"
							rendered="#{sales.nevv}"
							value="#{bundle.aon_type}: " />
						<aon:selectOneMenu id="Sales_documentType"
							rendered="#{sales.nevv}"
							value="#{sales.to.documentType}">
							<f:selectItems value="#{salesCollections.basicSalesTypes}" />
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputLabel for="Sales_purchaseReference" 
						value="#{bundle.sales_purchase_reference} " />
					<aon:div id="purchaseReference-div" style="display:inline;">
						<aon:inputText id="Sales_purchaseReference"
							value="#{sales.to.purchaseReference}"
							disabled="#{!sales.pending}"
							size="35" maxlength="32" >
							<a4j:support event="onchange" ajaxSingle="#{true}"
								reRender="purchaseReference-div" />
						</aon:inputText>
						<aon:outputText id="sales-existPurchaseReference"
							rendered="#{sales.existPurchaseReference}"
							title="#{bundle.sales_purchase_reference_previously_used}"
							value="&#160;&#160;&#160;"
							styleClass="aon-icon-warning aon-margin-left aon-padding-left" />
					</aon:div>

					<aon:outputLabel for="Sales_deliveryDate" 
						value="#{bundle.aon_delivery_date}" />
					<aon:selectInputDate id="Sales_deliveryDate"
						value="#{sales.to.deliveryDate}" 
						disabled="#{!sales.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{sales.to.customer}" />
						<ui:param name="lookupDisabled" value="#{!sales.pending or sales.customerReadOnly}" />
						<ui:param name="lookupReRender" 
							value="Customer_registry_document,SalesAddress,SalesProject,Sales_scope,SalesSellerDiv,Sales_defaultPayMethod,payMethodDiv" />
						<ui:param name="idRequired" value="#{true}" />						
						<aon:methodParam name="lookupChangeListener"
							value="#{sales.customerData}" type="lookupChangeListener" />
					</ui:include>

					<aon:outputLabel for="Customer_registry_document" 
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Customer_registry_document" 
						value="#{sales.to.customer.registry.document}"
						disabled="true" size="10" />

					<aon:outputLabel for="Sales_address"
						value="#{bundle.aon_address}" />
					<aon:div id="SalesAddress">
						<aon:selectOneMenu id="Sales_address" 
							value="#{sales.to.shippingAddress}" rendered="#{sales.addressCount > 0}"
							disabled="#{!sales.pending}">
							<f:selectItems value="#{sales.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{bundle.registry_no_address_available}"
							rendered="#{sales.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Sales_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Sales_scope" 
						value="#{sales.to.scope}"
						disabled="true">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Seller_id" 
						value="#{bundle.aon_module_commercial}" />
					<aon:div id="SalesSellerDiv">
						<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml">
							<ui:param name="lookupTo" value="#{sales.to.seller}" />
							<ui:param name="lookupDisabled" value="#{!sales.pending}" />
							<ui:param name="skipLabel" value="#{true}" />
							<aon:methodParam name="lookupChangeListener"
								value="#{sales.sellerData}" type="lookupChangeListener" />
						</ui:include>
					</aon:div>

					<aon:outputLabel for="Sales_workPlace" 
						value="#{bundle.purchase_workplace}" />
					<aon:selectOneMenu id="Sales_workPlace" 
						value="#{sales.to.workPlace}"
						disabled="#{!sales.pending}"
						valueChangeListener="#{sales.onWorkPlaceChanged}" 
						reRender="Sales_scope">
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Sales_defaultPayMethod" 
						value="#{bundle.finance_payMethod}" />
					<aon:selectOneRadio id="Sales_defaultPayMethod" 
						value="#{sales.defaultPayMethod}"
						disabled="#{!sales.pending}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{bundle.aon_habitual}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{bundle.aon_to_specify}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Sales_total" 
						value="#{bundle.aon_total}" />
					<aon:div>
						<aon:outputText id="Sales_total" styleClass="aon-bold"
							value="#{sales.totalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputLabel styleClass="aon-margin-left aon-italic"
							value="(#{bundle.aon_tax_included})" />
					</aon:div>

				</aon:panelGrid>

				<aon:div id="SalesProject">
					<aon:panelGrid columns="2" style="width: 100%;"
						rendered="#{sales.to.project.id != null or (sales.pending and sales.projectCount > 0)}"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto">

						<aon:if test="#{!aonConfiguration.bean.sales.showTasData}">
							<aon:outputLabel for="Sales_project"
								value="#{bundle.aon_project}" />
						</aon:if>
						<aon:if test="#{aonConfiguration.bean.sales.showTasData}">
							<aon:outputLabel for="Sales_project"
								value="#{bundle.tas_project_tas}" />
						</aon:if>
						<aon:div>
							<aon:selectOneMenu id="Sales_project"
								rendered="#{sales.pending and sales.to.project.id == null and sales.projectCount > 0}"
								value="#{sales.to.project}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{sales.projects}" />
							</aon:selectOneMenu>
							<aon:outputText styleClass="aon-bold"
								value="#{sales.to.project.name}" 
								rendered="#{sales.to.project.id != null}" />
							<aon:div layout="inline" styleClass="aon-margin-left">
								<aon:commandButton id="removeSalesProject" 
									value="&#160;" title="#{bundle.aon_remove}" 
									styleClass="aon-icon-commandButton aon-icon-delete"
									rendered="#{sales.pending and sales.to.project.id != null}"
									actionListener="#{sales.removeSalesProject}" 
									reRender="salesForm" />
							</aon:div>
						</aon:div>

					</aon:panelGrid>
				</aon:div>

				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:div>
						<aon:outputLabel for="Sales_comments"
							value="#{bundle.aon_comment}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_comment_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Sales_comments" cols="80" rows="3"
						disabled="#{!sales.pending}"
						value="#{sales.to.comments}" />

					<aon:div>
						<aon:outputLabel for="Sales_remarks"
							value="#{bundle.aon_remark}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_remark_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Sales_remarks" cols="80" rows="3"
						disabled="#{!sales.pending}"
						value="#{sales.to.remarks}" />

				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:if test="#{sales.defaultPayMethod != null and !sales.defaultPayMethod}">
						<aon:panel>
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_payMethod}" />
							</f:facet>
							<aon:panelGrid columns="8" styleClass="aon-width-all" style="font-size:0.9em;"
								rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
								columnClasses="aon-panelGrid-even aon-width-auto,
									aon-panelGrid-even aon-width-50,
									aon-panelGrid-even aon-width-70,
									aon-panelGrid-even aon-width-100,
									aon-panelGrid-even aon-width-70,
									aon-panelGrid-even aon-width-auto,
									aon-panelGrid-even aon-width-150,
									aon-panelGrid-even aon-width-100">

								<aon:outputLabel for="Sales_payMethod" value="#{bundle.aon_type}"/>
								<aon:outputLabel for="Sales_numberOfPayments" value="#{bundle.registry_number_of_payments}" />
								<aon:outputLabel for="Sales_daysToFirstPayment" value="#{bundle.registry_days_to_first_payment}" />
								<aon:outputLabel for="Sales_daysBetweenPayments" value="#{bundle.registry_days_between_payments}" />
								<aon:outputLabel for="Sales_paymentDays" value="#{bundle.registry_payment_days}" />
								<aon:outputLabel value="#{bundle.aon_iban}" />
								<aon:outputLabel for="Sales_bankAlias" value="#{bundle.aon_bank}" />
								<aon:outputLabel for="Sales_bic" value="#{bundle.aon_bic}" />

								<aon:selectOneMenu id="Sales_payMethod" 
									value="#{sales.to.payMethod}"
									disabled="#{!sales.pending}">
									<f:selectItems value="#{configCollections.payMethods}" />
								</aon:selectOneMenu>
								<aon:inputText id="Sales_numberOfPayments"
									value="#{sales.to.numberOfPayments}"
									disabled="#{!sales.pending}" size="3" maxlength="2">
									<f:validateLongRange minimum="1" />
								</aon:inputText>	
								<aon:inputText id="Sales_daysToFirstPayment"
									value="#{sales.to.daysToFirstPayment}"
									disabled="#{!sales.pending}" size="3" maxlength="3">
									<f:validateLongRange minimum="0" />
								</aon:inputText>	
								<aon:inputText id="Sales_daysBetweenPayments"
									value="#{sales.to.daysBetweenPayments}"
									disabled="#{!sales.pending}" size="3" maxlength="3">
									<f:validateLongRange minimum="0" />
								</aon:inputText>	
								<aon:inputText id="Sales_paymentDays"
									value="#{sales.to.paymentDays}" 
									disabled="#{!sales.pending}" size="5" />

								<aon:div>
									<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
										<ui:param name="bankAccountController" value="#{sales.accountHelper}" />
										<ui:param name="bankAccountPrefix" value="Sales" />
										<ui:param name="bankAccountDisabled" value="#{!sales.pending}" />
										<ui:param name="bankCodeChangeReRender" value="Sales_bankAlias,Sales_bic" />
									</ui:include>
								</aon:div>
								<aon:inputText id="Sales_bankAlias"
									value="#{sales.to.bankAlias}" 
									disabled="#{!sales.pending}" 
									required="#{sales.to.bankAccount.validIbanLength}" size="25" maxlength="25" />
								<aon:inputText id="Sales_bic"
									value="#{sales.to.bic}" 
									disabled="#{!sales.pending}" validator="BICValidator"
									required="#{sales.to.bankAccount.validIbanLength}" size="12" maxlength="11">
								</aon:inputText>

							</aon:panelGrid>
						</aon:panel>
					</aon:if>
				</aon:div>

				<aon:if test="#{!sales.nevv}">
					<aon:panelTabSet id="salesPanelTab" selectedTab="#{sales.selectedTab}">
						<aon:panelTab id="salesDetailTab" 
							label="#{bundle.sales_detail}">
