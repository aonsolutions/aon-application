<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salesForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{salesBundle.sales_module}" />
					<ui:param name="controller" value="#{sales}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{!sales.pending}" />
					<ui:param name="skipRemoveButton" value="#{!sales.pending}" />
					<ui:define name="beforeSpinToolbarContent">
						<c:if test="#{aonRole.warehouseOperator}">
							<aon:commandButton id="delivery"
								value="#{salesBundle.sales_to_delivery}"
								immediate="#{true}" rendered="#{sales.pending and salesDetail.model.rowCount > 0}"
								styleClass="aon-finding-toolbar-item aon-icon-open-popup" 
								actionListener="#{sales.onDeliveryShow}"
								reRender="showDeliveryWindow">
								<f:setPropertyActionListener target="#{sales.showDeliveryWindow}"
									value="#{true}" />
							</aon:commandButton>
						</c:if>
						<c:if test="#{aonRole.financeOperator}">
							<aon:commandButton id="invoice"
								value="#{salesBundle.sales_to_invoice}"
								immediate="#{true}" rendered="#{sales.pending and salesDetail.model.rowCount > 0}"
								styleClass="aon-finding-toolbar-item aon-icon-favorite"
								actionListener="#{sales.onInvoiceShow}"
								reRender="showInvoiceWindow">
								<f:setPropertyActionListener target="#{sales.showInvoiceWindow}"
									value="#{true}" />
							</aon:commandButton>
						</c:if>
						<aon:commandButton value="&#160;" id="email"
							title="#{webmailBundle.webmail_send_email}"
							actionListener="#{sales.onSendByEmail}"
							rendered="#{salesDetail.model.rowCount > 0 and salesDetail.to == null}"
							styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border">
						</aon:commandButton>									
						<aon:htmlCommandLink id="sales-report" value="#{salesBundle.sales_sales}"
							target="_new" rendered="#{!sales.new and salesDetail.model.rowCount > 0}"
							action="#{report.onExecute}"
							disabled="#{salesDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="sales" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					styleClass="aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Sales_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div is="headerData">
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<aon:div>
								<aon:selectOneMenu id="Sales_series" 
									value="#{sales.to.series}" rendered="#{sales.new}"
									valueChangeListener="#{sales.onSeriesChanged}" 
									reRender="Sales_number,Sales_securityLevel">
									<f:selectItem itemLabel=" " itemValue="#{null}" />
									<f:selectItems value="#{configCollections.salesSeriesIds}" />
								</aon:selectOneMenu>
								<aon:inputText id="Sales_number" styleClass="aon-margin-left" 
									value="#{sales.to.number}" rendered="#{sales.new}" 
									required="true" size="7" />
								<aon:outputText styleClass="aon-bold aon-margin-right"
									value="#{sales.to.referenceCode}"
									rendered="#{!sales.new}" />
							</aon:div>
							<aon:div>
								<c:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Sales_securityLevel"
										value="#{sales.to.confidential}"
										rendered="#{sales.pending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{sales.pending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{!sales.pending and sales.to.confidential}" />
								</c:if>

								<aon:outputText styleClass="aon-margin-left aon-margin-right"
									value="#{sales.to.status}" />
								<aon:commandButton id="block" value="&#160;"
									actionListener="#{sales.onBlock}"
									title="#{salesBundle.sales_to_block}"
									immediate="true" rendered="#{!sales.new and sales.pending}"
									styleClass="aon-icon-commandButton aon-icon-lock">
								</aon:commandButton>										
								<aon:commandButton id="unblock" value="&#160;"
									actionListener="#{sales.onUnblock}"
									title="#{salesBundle.sales_to_unblock}"
									immediate="true" rendered="#{sales.blocked}"
									styleClass="aon-icon-commandButton aon-icon-unlock aon-margin-left">
								</aon:commandButton>										
							</aon:div>
						</h:panelGrid>
 					</aon:div>

					<aon:outputLabel for="Sales_issueDate" 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Sales_issueDate"
						value="#{sales.to.issueDate}" 
						required="true" disabled="#{!sales.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{sales.to.customer}" />
						<ui:param name="lookupDisabled" value="#{!sales.pending}" />
						<ui:param name="lookupReRender" 
							value="Customer_registry_document,SalesAddress,Sales_scope,Sales_defaultPayMethod,payMethodDiv" />
						<ui:param name="idRequired" value="#{true}" />						
						<aon:methodParam name="lookupChangeListener"
							value="#{sales.customerData}" type="lookupChangeListener" />
					</ui:include>

					<aon:outputLabel for="Customer_registry_document" 
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Customer_registry_document" 
						value="#{sales.to.customer.registry.document}"
						disabled="true" size="10" />

					<aon:outputLabel for="Sales_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="SalesAddress">
						<aon:selectOneMenu id="Sales_address" 
							value="#{sales.to.shippingAddress}" rendered="#{sales.addressCount > 0}"
							disabled="#{!sales.pending}">
							<f:selectItems value="#{sales.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{registryBundle.registry_no_address_available}"
							rendered="#{sales.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Sales_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Sales_scope" 
						value="#{sales.to.scope}"
						disabled="#{!sales.pending}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml">
						<ui:param name="lookupTo" value="#{sales.to.seller}" />
						<ui:param name="lookupDisabled" value="#{!sales.pending}" />
						<aon:methodParam name="lookupChangeListener"
							value="#{sales.sellerData}" type="lookupChangeListener" />
					</ui:include>

					<aon:outputLabel for="Sales_workPlace" 
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Sales_workPlace" 
						value="#{sales.to.workPlace}"
						disabled="#{!sales.pending}">
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Sales_defaultPayMethod" 
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneRadio id="Sales_defaultPayMethod" 
						value="#{sales.defaultPayMethod}"
						disabled="#{!sales.pending}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{salesBundle.sales_habitual}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{salesBundle.sales_to_specify}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Sales_total" 
						value="#{bundle.aon_total}" />
					<aon:outputText id="Sales_total" styleClass="aon-bold"
						value="#{sales.totalPrice}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>

				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:div>
						<aon:outputLabel for="Sales_comments"
							value="#{bundle.aon_comment}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_comment_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Sales_comments" cols="80" rows="3"
						disabled="#{!sales.pending}"
						value="#{sales.to.comments}" />

					<aon:div>
						<aon:outputLabel for="Sales_remarks"
							value="#{bundle.aon_remark}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_remark_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Sales_remarks" cols="80" rows="3"
						disabled="#{!sales.pending}"
						value="#{sales.to.remarks}" />

				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:panel rendered="#{sales.defaultPayMethod != null and !sales.defaultPayMethod}">
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_pay_method}" />
						</f:facet>
						<aon:panelGrid columns="7" style="width:100%; font-size:0.9em;"
							rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
							columnClasses="aon-panelGrid-even aon-width-200,
								aon-panelGrid-even aon-width-80,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-110,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-auto,
								aon-panelGrid-even aon-width-200">

							<aon:outputText value="#{bundle.aon_type}"/>
							<aon:outputText value="#{registryBundle.registry_number_of_payments}" />
							<aon:outputText value="#{registryBundle.registry_days_to_first_payment}" />
							<aon:outputText value="#{registryBundle.registry_days_between_payments}" />
							<aon:outputText value="#{registryBundle.registry_payment_days}" />
							<aon:outputText value="#{configBundle.config_bank}" />
							<aon:outputText value="#{configBundle.config_bank_account}" />

							<aon:selectOneMenu id="Sales_payMethod" 
								value="#{sales.to.payMethod}"
								disabled="#{!sales.pending}">
								<f:selectItems value="#{configCollections.payMethods}" />
							</aon:selectOneMenu>
							<aon:inputText id="Sales_numberOfPayments"
								value="#{sales.to.numberOfPayments}"
								disabled="#{!sales.pending}" size="5" >
								<f:validateLongRange minimum="1" />
							</aon:inputText>	
							<aon:inputText id="Sales_daysToFirstPayment"
								value="#{sales.to.daysToFirstPayment}"
								disabled="#{!sales.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Sales_daysBetweenPayments"
								value="#{sales.to.daysBetweenPayments}"
								disabled="#{!sales.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Sales_paymentDays"
								value="#{sales.to.paymentDays}" 
								disabled="#{!sales.pending}" size="5" />
							<ui:include src="/com/code/aon/ui/registry/facelet/rbank/lookup.xhtml">
								<ui:param name="lookupTo" value="#{sales.to.bank}" />
								<ui:param name="lookupDisabled" value="#{!sales.pending}" />
							</ui:include>								
							<aon:div>
								<aon:inputText id="Sales_bank_office"
									value="#{sales.to.bankAccount.office}"
									disabled="#{!sales.pending}" size="4" maxlength="4">
									<f:validateLength minimum="4" maximum="4" />
								</aon:inputText>
								<aon:inputText id="Sales_bank_control"
									value="#{sales.to.bankAccount.control}"
									disabled="#{!sales.pending}" size="2" maxlength="2">
									<f:validateLength minimum="2" maximum="2" />
								</aon:inputText>
								<aon:inputText id="Sales_bank_account"
									value="#{sales.to.bankAccount.account}"
									disabled="#{!sales.pending}" size="10" maxlength="10">
									<f:validateLength minimum="10" maximum="10" />
								</aon:inputText>
							</aon:div>

						</aon:panelGrid>
					</aon:panel>
				</aon:div>

				<aon:div styleClass="aon-padding-top">
					<aon:panel rendered="#{!sales.new}">
						<f:facet name="header">
							<aon:outputText value="#{salesBundle.sales_detail}" />
						</f:facet>
						<ui:include src="/com/code/aon/ui/sales/facelet/sales/formDetail.xhtml" />
					</aon:panel>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
		<ui:include src="/com/code/aon/ui/sales/facelet/sales/modalDelivery.xhtml" />
		<ui:include src="/com/code/aon/ui/sales/facelet/sales/modalInvoice.xhtml" />
		<ui:include src="/com/code/aon/ui/product/facelet/item/modalInfo.xhtml" />
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
	</ui:define>
</ui:composition>
