<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showEdiFtpWindow">
		<aon:if test="#{sales.ftpEdiImporter.showEdiFtpWindow}">
			<rich:modalPanel id="ediFtpModalPanel" minHeight="450"
				minWidth="520" rendered="#{sales.ftpEdiImporter.showEdiFtpWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Recuperar del servidor FTP de Seres" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showEdiFtpWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{sales.ftpEdiImporter.showEdiFtpWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="ediFtpForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="ediFtp-accept"
										value="Recuperar"
										actionListener="#{sales.ftpEdiImporter.onRetrieveFtpEdi}"
										reRender="showEdiFtpWindow"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										onclick="Richfaces.showModalPanel('waitProccess')" 
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
									</aon:commandButton>
									<aon:commandButton id="ediFtp-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showEdiFtpWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{sales.ftpEdiImporter.showEdiFtpWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid columns="2" dir="true" style="width: 100%;">
										<aon:outputLabel for="EdiFtp_remotePath"
											value="Directorio remoto FTP" />
										<aon:inputText id="EdiFtp_remotePath"
											value="#{sales.ftpEdiImporter.ftpRemotePath}"
											size="30" />
									</aon:panelGrid>
										
									<aon:panel>
										<f:facet name="header">
											<aon:outputText value="Datos de acceso" />
										</f:facet>
										<aon:panelGrid columns="4" dir="true" style="width: 100%;">
											<aon:outputLabel for="EdiFtp_username"
												value="Usuario" />
											<aon:inputText id="EdiFtp_username"
												value="#{sales.ftpEdiImporter.user}" />
											
											<aon:outputLabel for="EdiFtp_password"
												value="Contraseña" />
											<aon:inputSecret id="EdiFtp_password"
												value="#{sales.ftpEdiImporter.password}" />
										</aon:panelGrid>
									</aon:panel>
									
									<aon:dataTable id="ftpOrdersData" value="#{sales.ftpEdiImporter.unreadSalesModel}"
										var="to" rows="10" rendered="#{sales.ftpEdiImporter.unreadSalesModel.rowCount > 0}">

										<aon:column styleClass="aon-editDataTable-iconColumn">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:commandButton id="ftpSales-import"
												value="&#160;" styleClass="aon-icon-file-entrance aon-noborder"
												title="Importar"
												actionListener="#{sales.ftpEdiImporter.onImportFile}"
												reRender="showEdiFtpWindow, salesForm" />
										</aon:column>
	
										<aon:column styleClass="aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_name}" />
											</f:facet>
											<aon:outputText value="#{to.name}" />
										</aon:column>
	
										<aon:column styleClass="aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_date}" />
											</f:facet>
											<aon:outputText value="#{to.modificationDate}">
												<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>
										
										<aon:column styleClass="aon-editDataTable-iconColumn">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:htmlCommandLink id="ftpSales-download" 
												value="&#160;" target="_blank"
												title="#{bundle.webmail_download}"
												actionListener="#{sales.ftpEdiImporter.onDownloadFile}"
												styleClass="aon-finding-toolbar-item aon-icon-file-download">
											</aon:htmlCommandLink>
										</aon:column>
									</aon:dataTable>
									
									<aon:dataScroller for="ftpOrdersData" showNote="true" pageSize="10"
										rowCount="#{sales.ftpEdiImporter.unreadSalesModel.rowCount}" />
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
