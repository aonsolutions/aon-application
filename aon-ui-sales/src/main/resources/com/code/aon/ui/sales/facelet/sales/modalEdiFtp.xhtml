<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showEdiFtpWindow">
		<aon:if test="#{sales.ftpEdiDownloader.showEdiFtpWindow}">
			<rich:modalPanel id="ediFtpModalPanel" minHeight="650"
				minWidth="800" rendered="#{sales.ftpEdiDownloader.showEdiFtpWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Servidor FTP de Seres: Gestionar pedidos" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showEdiFtpWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{sales.ftpEdiDownloader.showEdiFtpWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="ediFtpForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<ui:decorate
									template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
									<ui:param name="toolbarTitle" value="Seresnet" />
									<ui:param name="toolbarDescription" value="FTP" />
									<ui:param name="innerToolbar" value="true" />
									<ui:define name="toolbarContent">
										<aon:commandButton id="ediFtp-accept"
											value="Actualizar"
											actionListener="#{sales.ftpEdiDownloader.onRetrieveFtpEdi}"
											reRender="showEdiFtpWindow"
											styleClass="aon-finding-toolbar-item aon-icon-sincronize"
											onclick="Richfaces.showModalPanel('waitProccess')" 
											oncomplete="Richfaces.hideModalPanel('waitProccess')">
										</aon:commandButton>
										<aon:dropDownMenu value="#{bundle.aon_import}"
											style="display:inline-block;font-size:0.8em;margin-right:4px;">
											<f:facet name="label">
												<aon:panelGroup>
													<aon:outputText value="#{bundle.aon_import}" />
													<aon:graphicImage style="vertical-align:middle;"
														value="#{aonResource.resolve['/images/aon-icon/aon-icon-dropDown.gif']}" />
												</aon:panelGroup>
											</f:facet>
											<aon:menuItem id="import-Popup"
												value="#{bundle.aon_import} #{bundle.aon_edi}"
												iconClass="aon-icon-file-entrance"
												actionListener="#{sales.udapaImporter.onImportFileShow}"
												reRender="salesForm, showEdiFtpWindow, showUdapaImportFileWindow"
												ajaxSingle="#{true}">
												<f:setPropertyActionListener target="#{sales.udapaImporter.showImportFileWindow}"
													value="#{true}" />
												<f:setPropertyActionListener target="#{sales.ftpEdiDownloader.showEdiFtpWindow}"
													value="#{false}" />
											</aon:menuItem >
											<aon:menuItem id="ediImport-Popup"
												value="#{bundle.aon_import} #{bundle.aon_edi} (CONNECT)"
												iconClass="aon-icon-new-text"
												actionListener="#{sales.ediImporter.onImportFileShow}"
												reRender="salesForm, showEdiFtpWindow, showImportFileWindow"
												ajaxSingle="#{true}">
												<f:setPropertyActionListener target="#{sales.ediImporter.showImportFileWindow}"
													value="#{true}" />
												<f:setPropertyActionListener target="#{sales.ftpEdiDownloader.showEdiFtpWindow}"
													value="#{false}" />
											</aon:menuItem>
										</aon:dropDownMenu>
										<aon:commandButton id="ediFtp-showSettings"
											value="&#160;" ajaxSingle="#{true}"
											title="Mostrar opciones de configuracion"
											rendered="#{!sales.ftpEdiDownloader.showFtpServerConnectionData}"
											actionListener="#{sales.ftpEdiDownloader.onShowFtpServerConnectionData}"
											reRender="showEdiFtpWindow"
											styleClass="aon-finding-toolbar-item aon-noborder aon-icon-config"
											style="font-size:1em;font-weight:bold;float:right;">
										</aon:commandButton>
										<aon:commandButton id="ediFtp-hideSettings"
											value="&#160;" ajaxSingle="#{true}"
											title="Ocultar opciones de configuracion"
											rendered="#{sales.ftpEdiDownloader.showFtpServerConnectionData}"
											actionListener="#{sales.ftpEdiDownloader.onShowFtpServerConnectionData}"
											reRender="showEdiFtpWindow"
											styleClass="aon-finding-toolbar-item aon-noborder aon-icon-config"
											style="font-size:1em;font-weight:bold;float:right;">
										</aon:commandButton>
									</ui:define>
								</ui:decorate>
								
								<aon:div styleClass="aon-scroll-area">
									<aon:if test="#{sales.ftpEdiDownloader.showFtpServerConnectionData}">
										<aon:panelGrid columns="2" dir="true" style="width: 100%;">
											<aon:outputLabel for="EdiFtp_serverName"
												value="Nombre servidor" />
											<aon:inputText id="EdiFtp_serverName"
												value="#{sales.ftpEdiDownloader.server}"
												size="30"
												required="#{true}" />
												
											<aon:outputLabel for="EdiFtp_remotePath"
												value="Directorio remoto FTP" />
											<aon:div>
												<aon:inputText id="EdiFtp_remotePath"
													value="#{sales.ftpEdiDownloader.remotePath}"
													size="30"
													required="#{true}" />
												<aon:commandButton id="ediFtp-folderTree"
													value="&#160;"
													title="Mostrar estructura de directorios"
													actionListener="#{sales.ftpEdiDownloader.onShowFtpDirectoryTree}"
													reRender="showEdiFtpWindow"
													styleClass="aon-finding-toolbar-item aon-noborder aon-icon-tree-root"
													onclick="Richfaces.showModalPanel('waitProccess')" 
													oncomplete="Richfaces.hideModalPanel('waitProccess')" />
											</aon:div>
										</aon:panelGrid>
											
										<aon:panel rendered="#{sales.ftpEdiDownloader.remoteDirectoryModel.rowCount > 0}">
											<f:facet name="header">
												<aon:outputText value="Estructura remota de directorios" />
											</f:facet>
											<aon:dataTable id="ftpDirectoryTree" var="to" rows="100" 
												value="#{sales.ftpEdiDownloader.remoteDirectoryModel}"
												rendered="#{sales.ftpEdiDownloader.remoteDirectoryModel.rowCount > 0}">
												<aon:column styleClass="aon-editDataTable-iconColumn">
													<aon:commandButton id="ftpSales-import"
														value="&#160;" styleClass="aon-icon-commandButton aon-icon-rowSelector"
														title="#{bundle.aon_check}"
														actionListener="#{sales.ftpEdiDownloader.onSelectFtpDirectory}"
														reRender="showEdiFtpWindow" />
												</aon:column>
												<aon:column styleClass="aon-editDataTable-textColumn">
													<aon:outputText value="#{to}" />
												</aon:column>
											</aon:dataTable>
										</aon:panel>
										
										<aon:panel>
											<f:facet name="header">
												<aon:outputText value="Datos de acceso" />
											</f:facet>
											<aon:panelGrid columns="4" dir="true" style="width: 100%;">
												<aon:outputLabel for="EdiFtp_username"
													value="Usuario" />
												<aon:inputText id="EdiFtp_username"
													value="#{sales.ftpEdiDownloader.user}"
													required="#{true}" />
												
												<aon:outputLabel for="EdiFtp_password"
													value="Contraseña" />
												<aon:inputSecret id="EdiFtp_password"
													value="#{sales.ftpEdiDownloader.password}"
													redisplay="true"
													required="#{true}" />
											</aon:panelGrid>
										</aon:panel>
									</aon:if>
									
									<aon:panel styleClass="aon-panelGrid-search">
										<f:facet name="header">
											<aon:outputText value="Opciones adicionales" />
										</f:facet>
										<aon:panelGrid columns="2" dir="true" style="width: 100%;">
											<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
												<ui:param name="controller" value="#{sales}" />
												<ui:param name="skipSeriesLabel" value="#{false}" />
											</ui:include>
											
											<aon:outputLabel for="EdiFtp_date"
												value="#{bundle.aon_date}" />
											<aon:selectInputDate id="EdiFtp_date"
												value="#{sales.ftpEdiDownloader.date}"
												required="#{true}"
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}"/>
																				
											<aon:outputText value="&#160;" />
											<aon:div>
												<aon:selectBooleanCheckbox id="EdiFtp_deleteOnComplete"
													value="#{sales.ftpEdiDownloader.deleteOnComplete}"/>
												<aon:outputLabel for="EdiFtp_deleteOnComplete"
													value="Borrar del servidor remoto tras importar" />
											</aon:div>
											
											<aon:outputText value="&#160;" />
											<aon:div>
												<aon:selectBooleanCheckbox id="EdiFtp_testing"
													value="#{sales.ftpEdiDownloader.testing}"/>
												<aon:outputLabel for="EdiFtp_testing"
													value="Modo TEST (se comprueba la integridad pero no se guarda)" />
											</aon:div>
										</aon:panelGrid>
										
									</aon:panel>
									
									<aon:div styleClass="aon-margin-top">
										<aon:dataTable id="ftpOrdersData" var="to" rows="10" 
											value="#{sales.ftpEdiDownloader.unreadSalesModel}"
											rendered="#{sales.ftpEdiDownloader.unreadSalesModel.rowCount > 0}">
	
											<aon:column styleClass="aon-editDataTable-iconColumn">
												<f:facet name="header">
													<aon:outputText value="&#160;" />
												</f:facet>
												<aon:commandButton id="ftpSales-import"
													value="&#160;"
													title="#{bundle.aon_import}"
													actionListener="#{sales.ftpEdiDownloader.onImportFile}"
													reRender="showEdiFtpWindow, salesForm"
													styleClass=" aon-finding-toolbar-item aon-noborder aon-icon-file-entrance" >
													<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
												</aon:commandButton>
											</aon:column>
										
											<aon:column styleClass="aon-editDataTable-textColumn">
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_name}" />
												</f:facet>
												<aon:outputText value="#{to.customerName}" />
											</aon:column>
											
											<aon:column styleClass="aon-editDataTable-textColumn">
												<f:facet name="header">
													<aon:outputText value="EDI PTO ENTREGA" />
												</f:facet>
												<aon:outputText value="#{to.customerCode}" />
											</aon:column>
											
											<aon:column styleClass="aon-editDataTable-textColumn">
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_address}" />
												</f:facet>
												<aon:outputText value="#{to.deliveryAddress}" />
											</aon:column>
		
											<aon:column styleClass="aon-editDataTable-buttonsColumn">
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_date}" />
												</f:facet>
												<aon:outputText value="#{to.chargeDate}">
													<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
											</aon:column>
											
											<aon:column styleClass="aon-editDataTable-iconColumn">
												<f:facet name="header">
													<aon:outputText value="&#160;" />
												</f:facet>
												<aon:htmlCommandLink id="ftpSales-download" 
													value="&#160;" target="_blank"
													title="#{bundle.webmail_download}"
													actionListener="#{sales.ftpEdiDownloader.onDownloadFile}"
													styleClass="aon-finding-toolbar-item aon-noborder aon-icon-file-download">
												</aon:htmlCommandLink>
												<aon:commandButton id="ftpSales-deleteFile"
													value="&#160;" title="#{bundle.aon_remove}"
													reRender="ftpOrdersData, showEdiFtpWindow, salesForm"
													onclick="if(!confirm('#{bundle.aon_remove_confirm}')) return false;"
													actionListener="#{sales.ftpEdiDownloader.onDeleteFile}"
													styleClass="aon-finding-toolbar-item aon-noborder aon-icon-rubber">
												</aon:commandButton>
											</aon:column>
										</aon:dataTable>
										
										<aon:dataScroller for="ftpOrdersData" showNote="true" pageSize="10"
											rowCount="#{sales.ftpEdiDownloader.unreadSalesModel.rowCount}" />
									</aon:div> 
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
