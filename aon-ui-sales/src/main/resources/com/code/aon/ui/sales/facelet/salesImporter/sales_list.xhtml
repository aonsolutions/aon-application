<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:dataTable var="to" value="#{dataModel}" rows="0">
		<aon:rowSelector toggleOnClick="#{false}" />
		<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandLink id="sales_link" immediate="true"
				styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
				value="&#160;" title="#{bundle.aon_go}"
				rendered="#{showGoToButton}"
				actionListener="#{salesImporter.onLoadSales}"
				action="sales_form" />
			<c:if test="#{!showSalesData}">
				<aon:outputText id="sales-isRepeated"
					rendered="#{to.repeated}"
					title="Existen pedidos con la misma referencia"
					value="&#160;&#160;"
					styleClass="aon-icon-warning aon-padding-left" />
			</c:if>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_id}" />
			</f:facet>
			<aon:outputText value="#{to.purchaseReference}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_date}" />
			</f:facet>
			<aon:outputText value="#{to.issueDate}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.pms_seller}" />
			</f:facet>
			<aon:outputText value="#{to.seller.registry.fullName}" />
		</aon:column>
		<c:if test="#{!showSalesData}">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputText	value="#{bundle.aon_customer}" />
				</f:facet>
				<aon:div>
					<aon:outputText value="&#160;"
						title="Nuevo cliente" 
						styleClass="aon-icon-info aon-padding-left"
						rendered="#{to.newCustomer}" />
					<aon:outputText value="#{to.customerName}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div style="widht: 100%; text-align: right;">
						<aon:outputText value="#{bundle.aon_total}:" />
						<aon:outputText value="&#160;" />
						<aon:outputText value="#{dataModel.rowCount}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</c:if>
		<c:if test="#{showSalesData}">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputText	value="#{bundle.aon_customer}" />
				</f:facet>
				<aon:outputText value="#{to.customer.registry.fullName}" />
				<f:facet name="footer">
					<aon:div style="widht: 100%; text-align: right;">
						<aon:outputText value="#{bundle.aon_total}:" />
						<aon:outputText value="&#160;" />
						<aon:outputText value="#{dataModel.rowCount}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</c:if>
	</aon:dataTable>
		
</ui:composition>
