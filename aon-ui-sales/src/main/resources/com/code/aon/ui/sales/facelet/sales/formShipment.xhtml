<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:valueParam name="displayVertically" default="#{false}" />
	
	<aon:panelGrid columns="#{displayVertically?1:2}" 
		columnClasses="aon-noborder aon-vertical-align-top, aon-noborder aon-padding-left aon-vertical-align-top">
	
		<aon:panelGrid columns="2" style="width:600px;">
			<c:if test="#{carrierCollections.carriersCount>0}">
				<aon:outputLabel for="Sales_carrier"
					value="#{carrierBundle.carrier_carrier}" />
				<aon:selectOneMenu id="Sales_carrier" 
					value="#{sales.to.carrier}">
					<f:selectItem itemLabel=" - " itemValue="#{null}" />
					<f:selectItems value="#{carrierCollections.carriers}" />
				</aon:selectOneMenu>
					
				<aon:outputText value="&#160;" />
				<aon:outputText value="&#160;" />
			</c:if>
				
			<aon:outputLabel for="Sales_shippingContact"
				value="#{carrierBundle.carrier_shipment_to}" />
			<aon:inputText id="Sales_shippingContact"  
				size="64" maxlength="128"
				value="#{sales.to.shippingContact}" />
			
			<aon:outputLabel for="Sales_shippingPeriod"
				value="#{carrierBundle.carrier_shipment_schedule}" />
			<aon:selectOneMenu id="Sales_shippingPeriod" 
				value="#{sales.to.shippingPeriod}">
				<f:selectItem itemLabel=" - " itemValue="#{null}" />
				<f:selectItems value="#{carrierCollections.shipmentPeriods}" />
			</aon:selectOneMenu>
		</aon:panelGrid>
		
		<aon:panel id="alternativeShippingAddressPanel" style="width:600px;">
			<f:facet name="header">
				<aon:div style="display:inline;">
					<aon:selectBooleanCheckbox id="shippingAlternativeAddressSelect" 
						value="#{sales.shippingAlternativeAddress}" >
						<a4j:support event="onclick" 
							ajaxSingle="true"
							ignoreDumpResponses="true"
							limitToList="true"
							eventsQueue="shippingAlternativeAddress"
							reRender="alternativeShippingAddressPanel" />
					</aon:selectBooleanCheckbox>
					<aon:outputLabel for="shippingAlternativeAddressSelect" value="#{carrierBundle.carrier_shipment_alternativeAddress}" />
				</aon:div>
			</f:facet>
		
			<aon:panelGrid columns="2" rendered="#{sales.shippingAlternativeAddress}"  
				styleClass="aon-width-all">
					
				<aon:outputLabel for="Sales_shippingAlternativeRecipient" 
					value="#{carrierBundle.carrier_shipment_recipient}" />
				<aon:inputText id="Sales_shippingAlternativeRecipient" 
					value="#{sales.to.shippingAlternativeRecipient}" size="64" maxlength="64"/>
		
				<aon:outputLabel for="Sales_shippingAlternativeAddress" value="#{registryBundle.registry_address}" />
				<aon:inputText id="Sales_shippingAlternativeAddress" maxlength="128" size="80"
					value="#{sales.to.shippingAlternativeAddress}" />
				
				<aon:outputLabel for="Sales_shippingAlternativeAddress2" value="#{registryBundle.registry_address_detail}" />
				<aon:inputText id="Sales_shippingAlternativeAddress2" maxlength="128" size="80"
					value="#{sales.to.shippingAlternativeAddress2}" />
				
				<aon:outputLabel for="Sales_shippingAlternativeZip" 
					value="#{registryBundle.registry_zip}" />
				<aon:inputText id="Sales_shippingAlternativeZip" 
					value="#{sales.to.shippingAlternativeZip}" size="16" maxlength="16"/>
					
				<aon:outputLabel for="Sales_shippingAlternativeCity" 
					value="#{registryBundle.registry_city}" />
				<aon:inputText id="Sales_shippingAlternativeCity" 
					value="#{sales.to.shippingAlternativeCity}" size="64" maxlength="64"/>
					
				<aon:outputLabel for="Sales_shippingAlternativePhone" 
					value="#{registryBundle.registry_phone}" />
				<aon:inputText id="Sales_shippingAlternativePhone"
					value="#{sales.to.shippingAlternativePhone}" />
			
			</aon:panelGrid>
			
		</aon:panel>
		
	</aon:panelGrid>
		
</ui:composition>
