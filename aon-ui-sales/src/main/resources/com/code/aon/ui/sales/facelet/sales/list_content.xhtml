<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:column alias="Sales.issueDate"
		styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.issueDate}"
			styleClass="#{(itemReturnInRed and to.itemReturn) ? ('aon-label-error') : ('')}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>
	
	<aon:column alias="Sales.deliveryDate"
		styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_delivery_date}" />
		</f:facet>
		<aon:outputText value="#{to.deliveryDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Sales.series,Sales.number"
		styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120">
		<f:facet name="header">
			<h:outputText value="#{bundle.aon_order_number}" />
		</f:facet>
		<aon:outputText value="#{to.referenceCode}"
			styleClass="#{(itemReturnInRed and to.itemReturn) ? ('aon-label-error') : ('')}" />
	</aon:column>

	<aon:column alias="Sales.customer.registry.name"
		styleClass="aon-editDataTable-textColumn aon-width-auto">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_customer}" />
		</f:facet>
		<aon:outputText title="#{to.customer.registry.fullName}"
			value="#{to.customer.registry.fullName}"
			styleClass="#{(itemReturnInRed and to.itemReturn) ? ('aon-label-error') : ('')}">
			<aon:abbreviateConverter maxWidth="50" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Sales.seller.registry.name"
		styleClass="aon-editDataTable-textColumn aon-width-150">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_module_commercial}" />
		</f:facet>
		<aon:outputText title="#{to.seller.registry.fullName}"
			value="#{(!empty to.seller.registry.alias) ? to.seller.registry.alias : to.seller.registry.fullName}"
			styleClass="#{(itemReturnInRed and to.itemReturn) ? ('aon-label-error') : ('')}">
			<aon:abbreviateConverter maxWidth="30" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Sales.purchaseReference"
		styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120">
		<f:facet name="header">
			<aon:outputText value="#{bundle.sales_purchase_reference}" />
		</f:facet>
		<aon:outputText value="#{to.purchaseReference}"
			styleClass="#{(itemReturnInRed and to.itemReturn) ? ('aon-label-error') : ('')}" />
	</aon:column>
	
	<aon:column alias="Sales.scope&lt;description"
		styleClass="aon-editDataTable-textColumn aon-width-130">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_scope}" />
		</f:facet>
		<aon:outputText value="#{to.scope.description}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_total}" />
		</f:facet>
		<aon:outputText value="#{controller.salesTotalPrice}"
			styleClass="#{(itemReturnInRed and to.itemReturn) ? ('aon-label-error') : ('')}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
		<f:facet name="footer">
			<aon:div id="listTotalDiv" styleClass="aon-text-right"
				rendered="#{controller.rowCount &lt; 500}">
				<aon:commandLink id="showTotals" immediate="true" 
					styleClass="aon-dataTable-link aon-nowrap aon-bold"
					value="#{bundle.aon_total_sum}"
					rendered="#{controller.listTotal == null}"
					actionListener="#{controller.obtainListTotals}"									
					reRender="listTotalDiv" />
				<aon:outputText	styleClass="aon-bold" 
					value="#{controller.listTotal}"
					rendered="#{controller.listTotal != null}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
		</f:facet>
	</aon:column>
	
	<aon:column alias="Sales.status"
		styleClass="aon-editDataTable-iconColumn aon-width-20 aon-text-center">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status_abrv}" />
		</f:facet>
		<aon:outputText title="#{bundle.aon_pending}"
			styleClass="aon-text-center"
			value="-"
			rendered="#{to.pending}" />
		<aon:outputText title="#{bundle.aon_served}"
			styleClass="aon-editDataTable-button aon-icon-task-checked aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.served}" />
		<aon:outputText title="#{bundle.aon_closed}"
			styleClass="aon-editDataTable-button aon-icon-point-red aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.closed}" />
		<aon:outputText title="#{bundle.aon_blocked}"
			styleClass="aon-editDataTable-button aon-icon-lock aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.blocked}" />
		<aon:outputText title="#{bundle.finance_invoiced}"
			styleClass="aon-editDataTable-button aon-icon-check-black aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.invoiced}" />
	</aon:column>

</ui:composition>
