<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="orderServerList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.sales_orderServer_module}" />
				<ui:param name="controller" value="#{orderServer}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						actionListener="#{orderServer.checkAll}" reRender="orderServerList"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						actionListener="#{orderServer.checkNone}" reRender="orderServerList"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
					<aon:commandButton id="delivery"
						value="#{bundle.sales_serve}"
						actionListener="#{orderServer.onDeliveryShow}"
						rendered="#{orderServer.checkedCount > 0}"
						styleClass="aon-finding-toolbar-item aon-icon-open-popup aon-finding-toolbar-item-no-border"
						reRender="showDeliveryWindow">
						<f:setPropertyActionListener target="#{orderServer.showDeliveryWindow}" value="#{true}" />
					</aon:commandButton>									
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{orderServer}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<aon:selectBooleanCheckbox value="#{controller.rowChecked}"
								valueChangeListener="#{controller.rowSelected}" >
								<a4j:support event="onclick" reRender="orderServerList" />
							</aon:selectBooleanCheckbox>
						</aon:column>
						<ui:include src="/com/code/aon/ui/sales/facelet/sales/listColumns.xhtml" >
							<ui:param name="itemReturnInRed" value="#{true}" />
						</ui:include>
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/sales/facelet/orderServer/modalDelivery.xhtml" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
