<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showDeliveryWindow">
		<aon:if test="#{sales.showDeliveryWindow}">
			<rich:modalPanel id="deliveryModalPanel" minHeight="240"
				minWidth="520" rendered="#{sales.showDeliveryWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_invoice_delivery}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showDeliveryWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{sales.showDeliveryWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="deliveryForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="delivery-accept"
										value="#{bundle.aon_invoice_delivery}"
										actionListener="#{sales.onDelivery}"
										action="delivery_form"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="deliveryModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{sales.showDeliveryWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="delivery-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showDeliveryWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{sales.showDeliveryWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 80%;">

										<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
											<ui:param name="controller" value="#{delivery}" />
											<ui:param name="sfc_aliasPreffix" value="Sales_delivery" />
											<ui:param name="sfc_editable" value="#{true}" />
											<ui:param name="sfc_seriesProperty" value="#{sales.deliverySeries}" />
											<ui:param name="sfc_numberProperty" value="#{sales.deliveryNumber}" />
											<aon:methodParam name="sfc_onSeriesChanged" type="valueChangeListener"
												value="#{sales.onDeliverySeriesChanged}" />	
											<aon:methodParam name="sfc_onNumberEditable" type="actionListener"
												value="#{sales.onDeliveryNumberEditable}" />
										</ui:include>

										<aon:outputLabel for="Sales_deliveryDate"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Sales_deliveryDate"
											value="#{sales.deliveryDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-100" />

										<aon:outputLabel for="Sales_deliveryWarehouse" 
											value="#{bundle.aon_module_warehouse}" />
										<aon:selectOneMenu id="Sales_deliveryWarehouse" 
											value="#{sales.deliveryWarehouse}">
											<f:selectItems value="#{warehouseCollections.warehouses}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
