<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="Seller_id" value="#{bundle.aon_id}" />
	<aon:inputText id="Seller_id" size="60"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Seller_registry_document"
		value="#{bundle.aon_company_document}" />
	<aon:inputText id="Seller_registry_document" size="60"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Seller_registry_name"
		value="#{bundle.aon_company_name}" />
	<aon:inputText id="Seller_registry_name" size="60"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Seller_registry_surname"
		value="#{registryBundle.registry_surname}" />
	<aon:inputText id="Seller_registry_surname" size="60"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Seller_registry_alias"
		value="#{bundle.aon_company_alias}" />
	<aon:inputText id="Seller_registry_alias" size="60"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Seller_description"
		value="#{bundle.aon_description}" />
	<aon:inputText id="Seller_description" size="60"
		valueChangeListener="#{controller.addExpression}" />
		
	<aon:outputLabel for="Seller_status"
		value="#{bundle.aon_status}" />
	<aon:selectOneMenu id="Seller_status"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{salesCollections.sellerStatuses}" />
	</aon:selectOneMenu>		

</ui:composition>
