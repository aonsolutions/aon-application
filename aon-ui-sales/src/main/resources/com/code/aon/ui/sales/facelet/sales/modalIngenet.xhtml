<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showIngenetWindow">
		<aon:if test="#{sales.ingenetHandler.showIngenetWindow}">
			<rich:modalPanel id="ingenetModalPanel" minHeight="200"
				minWidth="400" rendered="#{sales.ingenetHandler.showIngenetWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Info. Ingenet" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showIngenetWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{sales.ingenetHandler.showIngenetWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="ingenetForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
							 	<aon:if test="#{!sales.ingenetHandler.enabled}">
							 		<aon:panelGrid id="responseDate" columns="2" dir="true" styleClass="aon-width-all aon-margin-bottom">
										<aon:outputText value="#{bundle.aon_status}" />
										<aon:outputText value="No disponible para Ingenet" />
									
										<aon:outputLabel for="Ingenet_date" 
											value="#{bundle.aon_availability_date}" />
										<aon:selectInputDate id="Ingenet_date"
											value="#{sales.ingenetHandler.responseDate}" 
											required="true" disabled="#{true}"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"/>
									</aon:panelGrid>
										
									<aon:div styleClass="aon-width-all aon-margin-top aon-text-center">
										<aon:commandButton id="enableIngenet-button"
											styleClass="aon-commandButton"
											value="Habilitar"
											rendered="#{sales.pending}"
											actionListener="#{sales.ingenetHandler.onEnable}"
											reRender="salesForm, showIngenetWindow" />
									</aon:div>
							 	</aon:if>
							 	<aon:if test="#{sales.ingenetHandler.enabled}">
							 		<aon:panelGrid id="responseDate" columns="2" dir="true" styleClass="aon-width-all">
										<aon:outputText value="#{bundle.aon_status}" />
										<aon:div>
											<aon:outputText value="Pedido disponible"
												rendered="#{sales.ingenetHandler.enabled}" />
											<aon:outputText value="Pedido recuperado y REABIERTO"
												rendered="#{sales.ingenetHandler.reopened}" />
									 		<aon:outputText value="Pedido recuperado"
												rendered="#{sales.ingenetHandler.retrieved}" />
											<aon:outputText value="Pedido cerrado"
												rendered="#{sales.ingenetHandler.closed}" />
										</aon:div>
							 		</aon:panelGrid>
							 	</aon:if>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
