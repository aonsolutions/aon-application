<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="currentUserScopes" default="#{configCollections.currentUserScopes}" />

	<ui:include src="/com/code/aon/ui/config/facelet/series/search.xhtml" />

	<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
		<ui:param name="lookupTo" value="#{searchController.customer}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml">
		<ui:param name="lookupTo" value="#{searchController.seller}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>
	
	<ui:include src="/com/code/aon/ui/project/facelet/project/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{searchController.project}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<aon:outputLabel value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="Sales_issueDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Sales_issueDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="Sales_issueDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Sales_issueDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
							
	<aon:outputLabel for="Sales_purchaseReference"
		value="#{bundle.sales_purchase_reference}" />
	<aon:div>
		<aon:inputText id="Sales_purchaseReference"
			valueChangeListener="#{controller.addExpression}"
			size="30">
		</aon:inputText>
		<aon:outputLabel for="Sales_purchaseGenerated" styleClass="aon-form-date-label"
			value="#{bundle.purchase_module}" />
		<aon:selectOneMenu id="Sales_purchaseGenerated"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel=" - " itemValue="#{null}" />
			<f:selectItem itemLabel="#{bundle.aon_generated}" itemValue="#{true}" />
			<f:selectItem itemLabel="#{bundle.aon_no} #{bundle.aon_generated}" itemValue="#{false}" />
		</aon:selectOneMenu>
	</aon:div>
	
	<aon:outputLabel for="Sales_documentType"
		value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="Sales_documentType"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{salesCollections.documentTypes}" />
	</aon:selectOneMenu>
						
	<aon:outputLabel for="Sales_workPlace_id"
		value="#{bundle.purchase_workplace}" />
	<aon:selectOneMenu id="Sales_workPlace_id"
		value="#{companyCollections.workPlace}"
		valueChangeListener="#{controller.addIdEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
	</aon:selectOneMenu>					

	<aon:if test="#{currentUserScopes[1] != null}">
		<aon:outputLabel for="Sales_scope_id"
			value="#{bundle.aon_scope}" />
		<aon:selectOneMenu id="Sales_scope_id"
			value="#{configCollections.scope}"
			valueChangeListener="#{controller.addIdEqualExpression}">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{currentUserScopes}" />
		</aon:selectOneMenu>
	</aon:if>					

	<aon:if test="#{aonRole.confidentiality}">
		<aon:outputLabel for="Sales_securityLevel"
			value="#{bundle.aon_confidential}" />
		<aon:selectOneRadio id="Sales_securityLevel"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
		</aon:selectOneRadio>				
	</aon:if>

	<aon:outputText value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox value="#{searchController.salesStatuses}">
		<f:selectItems value="#{salesCollections.salesStatuses}"/>
	</aon:selectManyCheckbox>							

</ui:composition>
