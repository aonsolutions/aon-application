<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/config/facelet/series/search.xhtml" />

	<aon:outputLabel for="Sales_customer_id"
		value="#{customerBundle.customer_customer}" />
	<aon:div styleClass="aon-lookup">
		<aon:lookupInputText id="Sales_customer_id"  
			value="#{searchController.customer.id}"
			lookup="#{customerLookup}"
			reRender="Sales_customer_full_name"
			size="5" />
		<aon:lookupButton 
			windowTitle="#{customerBundle.customer_selection}" 
			minHeight="460" minWidth="650" 
			property="#{searchController.customer}" lookup="#{customerLookup}" 
			selectReRender="Sales_customer_id,Sales_customer_full_name" 
			actionType="search">
		</aon:lookupButton>
		<aon:inputText id="Sales_customer_full_name"
			value="#{(searchController.customer.registry.fullName!=null)?(searchController.customer.registry.fullName):('')}"
			disabled="true" size="50" />							
	</aon:div>

	<aon:outputLabel value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="Sales_issueDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Sales_issueDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="Sales_issueDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Sales_issueDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
							
	<c:if test="#{aonRole.confidentiality}">
		<aon:outputLabel for="Sales_securityLevel"
			value="#{bundle.aon_confidential}" />
		<aon:selectOneRadio id="Sales_securityLevel"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
		</aon:selectOneRadio>				
	</c:if>

	<aon:outputLabel for="Sales_documentType"
		value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="Sales_documentType"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{salesCollections.documentTypes}" />
	</aon:selectOneMenu>
						
	<aon:outputLabel for="Sales_workPlace_id"
		value="#{companyBundle.company_workplace}" />
	<aon:selectOneMenu id="Sales_workPlace_id"
		value="#{companyCollections.workPlace}"
		valueChangeListener="#{controller.addIdEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{companyCollections.workPlaces}" />
	</aon:selectOneMenu>					

	<aon:outputText value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox value="#{searchController.salesStatuses}">
		<f:selectItems value="#{salesCollections.salesStatuses}"/>
	</aon:selectManyCheckbox>							

</ui:composition>
