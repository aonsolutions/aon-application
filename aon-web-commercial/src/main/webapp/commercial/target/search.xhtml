<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="targetSearch">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_targets}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="search" value="#{bundle.aon_accept}"
							action="target_list" actionListener="#{target.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							action="target_list" actionListener="#{target.onCancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset" ajaxSingle="true"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="target_form" actionListener="#{target.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<!-- end toolbar navigation -->

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">
					<aon:div styleClass="aon-panelGrid-search">
						<aon:div styleClass="aon-panelGrid-search-info">
							<aon:outputText value="#{bundle.aon_search_info}" />
						</aon:div>
						<aon:panelGrid columns="2">
	
							<aon:outputLabel for="Target_id"
								value="#{registryBundle.aon_id}" />
							<aon:inputText id="Target_id" size="60"
								valueChangeListener="#{target.addExpression}" />
	
							<aon:outputLabel for="Target_registry_document"
								value="#{registryBundle.aon_nif}" />
							<aon:inputText id="Target_registry_document" size="60"
								valueChangeListener="#{target.addExpression}" onblur="toUpperCase(this);" />
	
							<aon:outputLabel for="Target_registry_name"
								value="#{registryBundle.aon_name}" />
							<aon:inputText id="Target_registry_name" size="60"
								valueChangeListener="#{target.addExpression}" />
	
							<aon:outputLabel for="Target_registry_surname"
								value="#{registryBundle.aon_surname}" />
							<aon:inputText id="Target_registry_surname" size="60"
								valueChangeListener="#{target.addExpression}" />
	
							<aon:outputLabel for="Target_registry_alias"
								value="#{registryBundle.aon_alias}" />
							<aon:inputText id="Target_registry_alias" size="60"
								valueChangeListener="#{target.addExpression}" onblur="toUpperCase(this);" />
	
						</aon:panelGrid>
					</aon:div>
				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
