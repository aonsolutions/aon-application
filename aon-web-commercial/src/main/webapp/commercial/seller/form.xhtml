<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="sellerForm">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.aon_sellers}" />
				<ui:param name="controller" value="#{seller}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid id="menuGrid" columns="2" dir="true">

					<ui:include src="/commercial/registry/formContent.xhtml">
						<ui:param name="controller" value="#{seller}"/>
					</ui:include>

					<aon:outputLabel for="Seller_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Seller_description" maxlength="20"
						value="#{seller.to.description}" size="64">
					</aon:inputText>						

				</aon:panelGrid>

				<aon:div styleClass="aon-form-group" rendered="#{!seller.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="sellerAddressData" value="#{registryBundle.aon_address}" />
						</aon:div>
					</aon:div>
					<ui:include src="/commercial/registry/address/grid.xhtml" >
						<ui:param name="controller" value="#{sellerAddress}"/>
					</ui:include>
				</aon:div>

				<aon:div styleClass="aon-form-group" rendered="#{!seller.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="sellerMediaData" value="#{registryBundle.aon_media}" />
						</aon:div>
					</aon:div>
					<ui:include src="/commercial/registry/media/grid.xhtml" >					
						<ui:param name="controller" value="#{sellerMedia}"/>
					</ui:include>
				</aon:div>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
