<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:outputLabel for="Registry_id"
		rendered="#{!controller.new}" value="#{registryBundle.aon_id}" />
	<aon:inputText id="Registry_id" value="#{controller.to.id}"
		rendered="#{!controller.new}" size="15" disabled="true" />

	<aon:outputLabel for="Registry_document"
		value="#{registryBundle.aon_nif}" />
	<aon:inputText id="Registry_document" maxlength="16"
		value="#{controller.to.registry.document}" size="16" onblur="toUpperCase(this);">
	</aon:inputText>

	<aon:outputLabel for="Registry_name"
		value="#{registryBundle.aon_name}" />
	<aon:inputText id="Registry_name" maxlength="64"
		value="#{controller.to.registry.name}" size="64">
	</aon:inputText>

	<aon:outputLabel for="Registry_surname"
		value="#{registryBundle.aon_surname}" />
	<aon:inputText id="Registry_surname" maxlength="64"
		value="#{controller.to.registry.surname}" size="64">
	</aon:inputText>

	<aon:outputLabel for="Registry_alias"
		value="#{registryBundle.aon_alias}" />
	<aon:inputText id="Registry_alias" maxlength="32"
		value="#{controller.to.registry.alias}" size="32" onblur="toUpperCase(this);">
	</aon:inputText>

</ui:composition>
