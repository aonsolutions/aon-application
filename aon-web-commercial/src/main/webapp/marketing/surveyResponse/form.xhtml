<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="surveyResponseForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{marketingBundle.aon_marketing_surveis}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{surveyResponse.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!surveyResponse.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{surveyResponse.onRemove}"
							confirmAction="surveyResponse_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!surveyResponse.new}" immediate="true"
							action="surveyResponse_search" actionListener="#{surveyResponse.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />														
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							rendered="#{!surveyResponse.new}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{surveyResponse.onCancel}"
							action="surveyResponse_list"
							accesskey="#{bundle.aon_key_cancel}" />
							
						<aon:spin controller="#{surveyResponse}" action="surveyResponse_form" rendered="#{!surveyResponse.new}" />
							
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid id="menuGrid" columns="2" dir="true">

					<aon:outputLabel for="SurveyResponse_id"
						value="#{bundle.aon_id}" />
					<aon:outputText id="SurveyResponse_id" 
						value="#{surveyResponse.to.id}" />

					<aon:outputLabel for="SurveyResponse_survey_id" 
						value="#{marketingBundle.aon_marketing_survey}" />
					<aon:outputText id="SurveyResponse_survey_id"
						value="#{surveyResponse.to.survey.id} (#{surveyResponse.to.survey.description})" />
						
					<aon:outputLabel for="SurveyResponse_target_id"
						value="#{appBundle.aon_commercial_tracking_target}" />
					<aon:outputText id="SurveyResponse_target_id"
						value="#{surveyResponse.to.target.registry.fullName}" />						

					<aon:outputLabel for="SurveyResponse_user_id"
						value="#{bundle.aon_login_user}" />
					<aon:outputText id="SurveyResponse_user_id"
						value="#{surveyResponse.to.user.name}" />						

					<aon:outputLabel for="SurveyResponse_date"
						value="#{bundle.aon_date}" />
					<aon:outputText id="SurveyResponse_date" value="#{surveyResponse.to.date}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>					

					<aon:outputLabel for="SurveyResponse_creationDate"
						value="#{marketingBundle.aon_creationDate}" />
					<aon:outputText id="SurveyResponse_creationDate" value="#{surveyResponse.to.creationDate}" >
						<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>					

				</aon:panelGrid>

				<aon:div styleClass="aon-form-group" rendered="#{!surveyResponse.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="surveyResponseDetailData" value="#{marketingBundle.aon_marketing_responses}" />
						</aon:div>
					</aon:div>
					<ui:include src="/marketing/surveyResponse/detail/list.xhtml" />
				</aon:div>

			</aon:div>
		</aon:form>	
	</ui:define>
</ui:composition>

</body>
</html>
