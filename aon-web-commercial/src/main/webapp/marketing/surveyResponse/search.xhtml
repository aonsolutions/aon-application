<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="surveyResponseSearch">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.aon_marketing_survey_responses}" />
				<ui:param name="controller" value="#{survey}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{surveyResponse.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="surveyResponse_list" />		
					
					<aon:outputLabel for="SurveyResponse_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="SurveyResponse_id" size="60"
						valueChangeListener="#{surveyResponse.addExpression}" />		
			
				</ui:define>			
			</ui:decorate>
							 
		</aon:form>
	</ui:define>
		
</ui:composition>
