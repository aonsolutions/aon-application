<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:outputText value="#{valueHolder.text}"
		rendered="#{(!valueHolder.notFilled) and (valueHolder.question.type == 'TEXT')}"/>

	<aon:outputText value="#{valueHolder.number}"
		rendered="#{(!valueHolder.notFilled) and (valueHolder.question.type == 'NUMBER')}"/>

	<aon:outputText value="&#160;"
		styleClass="#{(valueHolder.boolean)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}"
		rendered="#{(!valueHolder.notFilled) and (valueHolder.question.type == 'BOOLEAN')}"/>

	<aon:outputText value="#{valueHolder.date}"
		rendered="#{(!valueHolder.notFilled) and (valueHolder.question.type == 'DATE')}">
		<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
			timeZone="#{timeZoneController.timeZoneId}" />
	</aon:outputText>

	<aon:outputText value="#{marketingBundle.aon_not_responsed}"
		rendered="#{valueHolder.notFilled}" />

</ui:composition>
