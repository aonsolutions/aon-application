<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<aon:editDataTable id="surveyQuestionData" var="to"
			value="#{surveyQuestion.model}" rows="20" rowIndexVar="rowIndex"
			columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-numberColumn aon-width-80,
				aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{surveyQuestion.to == null}"
				actionListener="#{surveyQuestion.onSelect}" />
				
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{surveyQuestion.onReset}" value=""
							rendered="#{!surveyQuestion.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{marketingBundle.aon_survey_question_position}" />
				</f:facet>
				<aon:outputText value="#{to.position}"
					rendered="#{to!=surveyQuestion.to}" />
				<aon:inputText rendered="#{to==surveyQuestion.to}"
					value="#{surveyQuestion.to.position}"
					size="5" required="true" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText rendered="#{surveyQuestion.new}"
						value="#{surveyQuestion.to.position}"
						required="true" size="5" maxlength="10" />
				</f:facet>
			</aon:column>
						
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{marketingBundle.aon_marketing_question}" />
				</f:facet>
				<aon:outputText value="#{to.question.text}"
					rendered="#{to!=surveyQuestion.to}" />
				<aon:div styleClass="aon-lookup" rendered="#{to==surveyQuestion.to}">
					<aon:lookupInputText
						lookup="#{questionLookup}" required="true"
						reRender="SurveyQuestion_question_detail"
						value="#{surveyQuestion.to.question.id}" size="5">
					</aon:lookupInputText>
					<aon:lookupButton windowTitle="#{marketingBundle.aon_lookup_question}" 
						selectReRender="surveyQuestionData"
						lookup="#{questionLookup}" minHeight="460" minWidth="650"
						property="#{surveyQuestion.to.question}">
					</aon:lookupButton>
					<aon:inputText id="SurveyQuestion_question_detail"
						value="#{surveyQuestion.to.question.text}"
						size="80" disabled="true" />
				</aon:div>
				<f:facet name="footer">
					<aon:div styleClass="aon-lookup" rendered="#{surveyQuestion.new}">
						<aon:lookupInputText id="SurveyQuestion_question_id-New"
							lookup="#{questionLookup}" required="true"
							reRender="SurveyQuestion_question_detail-New"
							value="#{surveyQuestion.to.question.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton windowTitle="#{marketingBundle.aon_lookup_question}" 
							selectReRender="SurveyQuestion_question_id-New,SurveyQuestion_question_detail-New"
							lookup="#{questionLookup}" minHeight="460" minWidth="650"
							property="#{surveyQuestion.to.question}">
						</aon:lookupButton>
						<aon:inputText id="SurveyQuestion_question_detail-New"
							value="#{surveyQuestion.to.question.text}"
							size="80" disabled="true" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=surveyQuestion.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						actionListener="#{surveyQuestion.onAccept}" 
						rendered="#{to==surveyQuestion.to}" value=""
						reRender="surveyQuestionDataScroller"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton id="cancelEdit-surveyQuestion" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==surveyQuestion.to}"
						actionListener="#{surveyQuestion.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="cancelRemove-surveyQuestion" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==surveyQuestion.to}" reRender="surveyQuestionDataScroller"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{surveyQuestion.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!surveyQuestion.new}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{surveyQuestion.onAccept}"
							rendered="#{surveyQuestion.new}" value=""
							reRender="surveyQuestionDataScroller"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancelNew-surveyQuestion" title="#{bundle.aon_cancel}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{surveyQuestion.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{surveyQuestion.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>

		<aon:div id="surveyQuestionDataScroller" layout="none">
			<aon:dataScroller2 for="surveyQuestionData" showNote="false" />
		</aon:div>

	</aon:div>
</ui:composition>
