<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="surveyList">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.aon_marketing_surveis}" />
				<ui:param name="controller" value="#{survey}" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="surveyData" value="#{survey.model}"
					var="to" rows="20" rendered="#{survey.model.rowCount > 0}"
					columnClasses="aon-editDataTable-numberColumn aon-width-70, aon-editDataTable-textColumn aon-width-150,
						aon-editDataTable-textColumn, aon-editDataTable-iconColumn">

					<aon:rowSelector action="survey_form" actionListener="#{survey.onSelect}" />
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}"/>
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.creationDate}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>					
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}"/>
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{marketingBundle.aon_active}" />
						</f:facet>
						<aon:outputText
							styleClass="#{(to.active)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}" 
							value="&#160;" />
					</aon:column>
 
				</aon:dataTable>

				<aon:dataScroller2 for="surveyData" showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
