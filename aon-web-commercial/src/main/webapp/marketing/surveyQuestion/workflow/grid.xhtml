<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:form id="surveyWorkflowForm">
		<aon:panelGroup id="surveyWorkflowWindow">
			<c:if test="#{surveyQuestion.showSurveyWorkflowWindow}">
				<rich:modalPanel id="surveyWorkflowModalPanel"
					rendered="#{surveyQuestion.showSurveyWorkflowWindow}" showWhenRendered="true"
					minHeight="390" height="390" width="650" top="50">
					<f:facet name="header">
						<aon:div styleClass="aon-popupWindow-title">
							<aon:outputText value="#{marketingBundle.aon_survey_workflows}" />
						</aon:div>
					</f:facet>
					<f:facet name="controls">
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							immediate="true">
							<f:setPropertyActionListener target="#{surveyQuestion.showSurveyWorkflowWindow}"
								value="#{false}" />
							<rich:componentControl for="surveyWorkflowModalPanel" operation="hide"
								event="onclick" />
						</aon:commandButton>
					</f:facet>

					<aon:div>

						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
							<ui:param name="controller" value="#{surveyWorkflow}" />
							<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
							<ui:define name="columns">

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_value}" />
									</f:facet>
									<f:facet name="footer">
									</f:facet>
								</aon:column>								
											
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{marketingBundle.aon_survey_workflow_next_question}" />
									</f:facet>
									<aon:outputText value="#{to.nextSurveyQuestion.text}"
										rendered="#{to!=controller.to}" >
										<aon:abbreviateConverter maxWidth="80" />
									</aon:outputText>		
									<aon:selectOneMenu rendered="#{to==controller.to}"
										required="true" value="#{controller.to.nextSurveyQuestion.id}">
										<f:selectItem value="#{null}" itemLabel="    " />
										<f:selectItems value="#{surveyQuestion.questions}" />
									</aon:selectOneMenu>								
									<f:facet name="footer">
										<aon:selectOneMenu rendered="#{controller.new}"
											required="true" value="#{controller.to.nextSurveyQuestion.id}">
											<f:selectItem value="#{null}" itemLabel="    " />
											<f:selectItems value="#{surveyQuestion.questions}" />
										</aon:selectOneMenu>								
									</f:facet>
								</aon:column>								
																			
							</ui:define>
						</ui:decorate>

					</aon:div>
					
				</rich:modalPanel>
			</c:if>
		</aon:panelGroup>
	</aon:form>
	
</ui:composition>
