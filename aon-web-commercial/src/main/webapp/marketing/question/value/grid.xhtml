<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<aon:editDataTable id="questionValueData" var="to" rows="20"
			value="#{questionValue.model}"
			columnClasses="aon-editDataTable-iconColumn,aon-width-60, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{questionValue.to == null}"
				actionListener="#{questionValue.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{questionValue.onReset}" value=""
							rendered="#{!questionValue.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.aon_id}" />
				</f:facet>
				<aon:outputText value="#{to.id}" />
				<f:facet name="footer">
					<aon:outputText value="&#160;" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.aon_value}" />
				</f:facet>
				<aon:div layout="none" rendered="#{to!=questionValue.to}">
					<ui:include src="/marketing/outputValue.xhtml" >
						<ui:param name="valueHolder" value="#{to}" />
					</ui:include>
				</aon:div>
				<aon:div layout="none" rendered="#{to==questionValue.to}">
					<ui:include src="/marketing/inputValue.xhtml" >
						<ui:param name="valueHolder" value="#{questionValue.to}" />
					</ui:include>
				</aon:div>				
				<f:facet name="footer">
					<aon:div layout="none" rendered="#{questionValue.new}">
						<ui:include src="/marketing/inputValue.xhtml" >
							<ui:param name="valueHolder" value="#{questionValue.to}" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=questionValue.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]"
						actionListener="#{questionValue.onAccept}"
						rendered="#{to==questionValue.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==questionValue.to}"
						actionListener="#{questionValue.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton title="[#{bundle.aon_remove}]" id="removeInline"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==questionValue.to}"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{questionValue.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!questionValue.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]"
							actionListener="#{questionValue.onAccept}"
							rendered="#{questionValue.new}"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton title="[#{bundle.aon_cancel}]" id="cancelNewInline"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{questionValue.new}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{questionValue.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>

	</aon:div>
</ui:composition>
