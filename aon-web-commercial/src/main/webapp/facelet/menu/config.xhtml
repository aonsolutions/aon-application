<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="configMenu">
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_config_company"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-config aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{companyBundle.company_menu_group}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="company" 
										action="company" actionListener="#{company.onLoad}"
										value="#{companyBundle.company_data_module}">
									</aon:commandLink>
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_config_general"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-general">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_general}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="mailAccountChange"
										action="mailAccount_list" actionListener="#{mailAccount.onSearch}"
										value="#{webmailBundle.webmail_mailAccount}" />						
								</aon:div>																
							</aon:div>
						</aon:panelGrid>							

					</aon:panelGroup>
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
