<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form id="chooseForm">
		<aon:div id="chooseContainer">
			<c:if test="#{task.finishPanelVisible}">
				<rich:modalPanel id="choosePanel" top="100" left="100"
					showWhenRendered="true" minHeight="100" minWidth="100" height="300"
					width="600" zindex="1000">
					<f:facet name="header">
						<aon:div styleClass="aon-popupWindow-title">
							<h:outputText value="#{groupwareBundle.groupware_task_finish}" />
						</aon:div>
					</f:facet>
					<f:facet name="controls">
						<aon:commandButton type="button" immediate="true"
							styleClass="aon-popupWindow-close" reRender="chooseContainer">
							<f:setPropertyActionListener value="#{false}" target="#{task.finishPanelVisible}" />
						</aon:commandButton>
					</f:facet>
					<aon:div>
						<aon:div styleClass="aon-finding-title-toolbar" style="width: 100%;">
							<aon:panelGrid columns="1" dir="true" columnClasses="aon-finding-toolbar">
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton value="#{groupwareBundle.groupware_task_finish}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										actionListener="#{task.onFinishTransitionTask}"
										action="task_list" />
								</aon:div>
							</aon:panelGrid>
						</aon:div>
						<h:panelGrid columns="1" dir="true" style="width: 100%;" styleClass="aon-margin-top" 
							columnClasses="aon-panelGrid-even aon-width-all">
							
							<aon:div id="optionDetail" style="width: 100%;  background-color:#f6f5e3;">
								<aon:div columns="1" dir="true" style="width: 100%;">
									<aon:div>
										<aon:panelGroup rendered="#{task.transitionSelected.processDetail != null}">
											<aon:outputText value="#{groupwareBundle.groupware_process_next_process}" styleClass="aon-form-date-label"/>
											<aon:outputText value="#{task.transitionSelected.processDetail.description}" styleClass="aon-bold aon-margin-left"/>
										</aon:panelGroup>
										<aon:outputText value="&#160;"/>
									</aon:div>
	
									<aon:div>
										<aon:panelGroup rendered="#{task.transitionSelected.processDetail != null}">
											<aon:outputText value="#{groupwareBundle.groupware_send_group}" styleClass="aon-form-date-label"/>
											<aon:outputText value="#{task.transitionSelected.processDetail.workgroup.description}" styleClass="aon-bold aon-margin-left"/>
										</aon:panelGroup>
										<aon:outputText value="&#160;"/>
									</aon:div>
								</aon:div>
							</aon:div>
							
							<aon:selectOneRadio id="task_transitionSelected" reRender="optionDetail"
								ajaxSingle="true"
								value="#{task.transitionSelected}" layout="pageDirection">
								<f:selectItems value="#{task.transitions}" />
							</aon:selectOneRadio>
							
						</h:panelGrid>
					</aon:div>
				</rich:modalPanel>
			</c:if>
		</aon:div>
	</aon:form>
</ui:composition>
