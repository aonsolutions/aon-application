<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="dailyTrackingForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarID" value="toolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.aon_daily_tracking_module}" />
				<ui:param name="controller" value="#{dailyTracking}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{dailyTracking.beanName}Toolbar-search" 
						title="#{bundle.aon_key_search_accelerator}"
						value="#{bundle.aon_search}" reRender="#{searchButtonReRender}"
						rendered="#{dailyTracking.nevv}" immediate="true"
						action="#{searchAction}" actionListener="#{dailyTracking.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}" />
					
					<aon:selectBooleanCheckbox id="monitor" value="#{dailyTracking.monitor}"
						rendered="#{aonRole.taskMonitor}">
						<a4j:support event="onclick" ajaxSingle="true" reRender="dailyTrackingForm" />
					</aon:selectBooleanCheckbox>
					<aon:outputLabel for="monitor" value="Monitor" rendered="#{aonRole.taskMonitor}" />
					
					<aon:selectBooleanCheckbox id="tracking_minutesModeEnabled"
						value="#{dailyTracking.minuteModeEnabled}" ajaxSingle="true" 
						styleClass="aon-margin-left"
						reRender="DailyTracking_trackingDuration_Container" />
					<aon:outputLabel for="tracking_minutesModeEnabled" 
						value="#{bundle.groupware_minutes_mode}"/>
				</ui:define>

			</ui:decorate>				

			<aon:div styleClass="aon-scroll-area">
				
				<aon:panelGrid id="dataTable" columns="2">
 
					<aon:outputLabel for="DailyTracking_user" rendered="#{dailyTracking.monitor}" value="#{bundle.aon_login_user}" />
					<aon:outputText rendered="#{!dailyTracking.monitor}" value="#{bundle.aon_login_user}" />

					<aon:panelGroup>
						<aon:outputText rendered="#{!dailyTracking.monitor}" value="#{dailyTracking.to.taskHolder.registry.fullName}"/>
						<aon:panelGroup id="taskHolderWarning">
							<aon:selectOneMenu id="DailyTracking_user"
								rendered="#{dailyTracking.monitor}"
								reRender="taskHolderWarning"
								value="#{dailyTracking.to.taskHolder}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{groupWareCollections.taskHolders}" />
							</aon:selectOneMenu>
							<aon:outputText
								style="color:red; margin: 1em; padding: 1em; font-weight: bold;" 
								rendered="#{dailyTracking.to.taskHolder.id != null and dailyTracking.to.taskHolder.costProfile.id == null}" 
								value="Sin perfil de coste asignado." />					
						</aon:panelGroup>
					</aon:panelGroup>
					


					<aon:outputLabel for="DailyTracking_trackingDate" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="DailyTracking_trackingDate"
						value="#{dailyTracking.to.trackingDate}" required="#{true}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>

					<aon:outputLabel for="DailyTracking_project" value="#{bundle.aon_project}"/>
					<aon:panelGrid columns="2"
						columnClasses="aon-panelGrid-even aon-italic aon-width-100,aon-panelGrid-even aon-width-auto">
															
						<aon:outputLabel for="Registry_id" value="#{bundle.project_assigned}"/>
						<aon:div id="registrySelectDiv">
							<aon:div styleClass="aon-margin-right" layout="inline">
								<aon:selectOneMenu value="#{dailyTracking.registryType}">
									<f:selectItem itemValue="#{0}" itemLabel="#{bundle.customer_finance_checking}"/>
									<f:selectItem itemValue="#{1}" itemLabel="#{bundle.aon_company}"/>
									<f:selectItem itemValue="#{2}" itemLabel="#{bundle.aon_general}"/>
									<a4j:support event="onchange"
										actionListener="#{dailyTracking.onRegistryTypeChanged}"
										reRender="registrySelectDiv" ajaxSingle="true" />
								</aon:selectOneMenu>
							</aon:div>
							<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
								<ui:param name="lookupTo" value="#{dailyTracking.to.registry}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="skipInputText" value="#{true}" />
								<ui:param name="lookupRendered" value="#{(dailyTracking.registryType == 1) or (dailyTracking.registryType == 2)}" />
								<ui:param name="lookupDisabled" value="#{dailyTracking.registryType == 1}" />
								<ui:param name="lookupReRender" value="registrySelectDiv,DailyTracking_project, DailyTracking_activityType" />
								<aon:methodParam name="lookupChangeListener"
									value="#{dailyTracking.onRegistryChanged}" type="lookupChangeListener" />
							</ui:include>
							<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
								<ui:param name="lookupTo" value="#{dailyTracking.customer}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="skipInputText" value="#{true}" />
								<ui:param name="lookupRendered" value="#{dailyTracking.registryType == 0}" />
								<ui:param name="lookupReRender" value="DailyTracking_project, DailyTracking_activityType" />
								<aon:methodParam name="lookupChangeListener"
									value="#{dailyTracking.onCustomerChanged}" type="lookupChangeListener" />
							</ui:include>							
						</aon:div>
									
						<aon:outputLabel for="DailyTracking_project" value="#{bundle.aon_name}"/>
						<aon:selectOneMenu id="DailyTracking_project" value="#{dailyTracking.to.project}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{dailyTracking.projects}" />
							<a4j:support event="onchange"
								actionListener="#{dailyTracking.onChangeProject}"
								reRender="registrySelectDiv, DailyTracking_project, DailyTracking_activityType"
								ajaxSingle="true" />
						</aon:selectOneMenu>
						
						<aon:outputLabel for="DailyTracking_activityType" value="#{bundle.project_activity_type}"/>
						<aon:selectOneMenu id="DailyTracking_activityType"
							value="#{dailyTracking.to.activityType}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{dailyTracking.activityTypes}" />
						</aon:selectOneMenu>
					</aon:panelGrid>
					
					<aon:outputLabel for="DailyTracking_jobType"
						value="#{bundle.groupware_job_type}"/>
					<aon:selectOneMenu id="DailyTracking_jobType" required="true"
						value="#{dailyTracking.to.jobType}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{groupWareCollections.jobTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="DailyTracking_trackingDuration"
						value="#{bundle.aon_duration}"/>
					<aon:div id="DailyTracking_trackingDuration_Container">
						<aon:inputText id="DailyTracking_trackingDuration"
							rendered="#{!dailyTracking.minuteModeEnabled}"
							value="#{dailyTracking.to.trackingDuration}" required="#{true}" size="5" />
						<aon:div rendered="#{dailyTracking.minuteModeEnabled}">
							<aon:outputLabel for="DailyTracking_trackingDurationHours"
								value="Horas" styleClass="italic"/>
							<aon:inputText id="DailyTracking_trackingDurationHours" style="margin-left: 5px;"
								value="#{dailyTracking.to.hours}" required="#{true}" size="5" />
							<aon:outputLabel for="DailyTracking_trackingDurationMinutes" 
								value="Minutos" styleClass="aon-margin-left italic"/>
							<aon:inputText id="DailyTracking_trackingDurationMinutes" style="margin-left: 5px;"
								value="#{dailyTracking.to.minutes}" required="#{true}" size="5" />
						</aon:div>
					</aon:div>
						

					<aon:outputLabel for="DailyTracking_cost" 
						rendered="#{dailyTracking.monitor and !dailyTracking.nevv}"
						value="#{bundle.aon_cost}"/>
					<aon:inputText id="DailyTracking_cost" 
						rendered="#{dailyTracking.monitor and !dailyTracking.nevv}"
						value="#{dailyTracking.to.cost}" size="15" />

					<aon:outputLabel for="DailyTracking_comments"
						value="#{bundle.aon_comment}"/>
					<aon:inputTextarea id="DailyTracking_comments"
						value="#{dailyTracking.to.comments}" cols="68" rows="5" />
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
 	</ui:define>
</ui:composition>
