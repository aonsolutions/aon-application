<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelGrid columns="2">

		<aon:outputLabel for="Notice_date"
			value="#{bundle.aon_date}" />

		<aon:selectInputDate id="Notice_date" 
			inputSize="18" value="#{controller.to.date}"
			popupDateFormat="#{bundle.aon_timestamp2_pattern}">
		</aon:selectInputDate>
		
		<aon:outputLabel for="Notice_workGroup_id"
			value="#{bundle.aon_group}" />
		<aon:selectOneMenu id="Notice_workGroup_id" focus="Notice_recipient_id"
			validator="#{controller.workGroupCheck}"
			value="#{controller.to.workGroup.id}" reRender="Notice_workGroup_id,Notice_recipient_id, Notice_sendEmail"
			valueChangeListener="#{controller.workGroupChange}" >
			<aon:if test="#{controller.to.workGroup.id == controller.selectOneValue}">
				<f:selectItem itemLabel="#{bundle.groupware_select_one}" itemValue="#{controller.selectOneValue}"/>
			</aon:if>
			<aon:if test="#{controller.workGroupCount &gt; 1}">
				<f:selectItem itemLabel="#{bundle.finance_all}" value="#{null}"/>
			</aon:if>
			<f:selectItems value="#{controller.workGroups}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="Notice_recipient_id" 
			value="#{bundle.purchase_shipping_recipient}" />
		<aon:selectOneMenu id="Notice_recipient_id"
			disabled="#{!controller.recipientSelectable}" focus="Notice_source"
			value="#{controller.to.recipient}" reRender="Notice_recipient_id,Notice_sendEmail"
			valueChangeListener="#{controller.recipientChange}">
			<aon:if test="#{!controller.recipientSelectable}">
				<f:selectItem itemLabel="#{bundle.groupware_select_one}" itemValue="#{controller.selectOneValue}"/>
			</aon:if>
			<aon:if test="#{controller.recipientSelectable}">						
				<f:selectItem itemLabel="#{bundle.finance_all}" value="#{null}"/>
				<f:selectItems value="#{controller.users}" />
			</aon:if>
		</aon:selectOneMenu>

		<aon:outputLabel for="Notice_source"
			value="#{bundle.aon_of}" />
		<aon:inputText id="Notice_source"
			maxlength="64" size="100"
			value="#{controller.to.source}" />

		<aon:if test="#{!skipShowNoticeCompany}">
			<aon:outputLabel for="Notice_company"
				value="#{bundle.aon_company}" />
			<aon:inputText id="Notice_company"
				maxlength="64" size="100"
				value="#{controller.to.company}" />
		</aon:if>
		
		<ui:insert name="customerLookup" />
		
		<aon:outputLabel for="Notice_phone"
			value="#{bundle.notice_phone}" />
		<aon:inputText id="Notice_phone"
			maxlength="16" size="20"
			value="#{controller.to.phone}" />
			
		<aon:outputLabel for="Notice_status" 
			value="#{bundle.aon_status}" />
		<aon:selectOneMenu id="Notice_status"
			value="#{controller.to.status}">
			<f:selectItems value="#{groupWareCollections.noticeStatuses}" />
		</aon:selectOneMenu>
			
		<aon:if test="#{!skipShowNoticeType}">
			<aon:outputLabel for="Notice_type" 
				value="#{bundle.aon_type}" />
			<aon:selectOneMenu id="Notice_type"
				value="#{controller.to.type}">
				<f:selectItems value="#{groupWareCollections.noticeTypes}" />
			</aon:selectOneMenu>
		</aon:if>

		<aon:outputLabel for="Notice_priority" 
			value="#{bundle.aon_priority}" />
		<aon:selectOneMenu id="Notice_priority"
			value="#{controller.to.priority}">
			<f:selectItems value="#{groupWareCollections.priorities}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="Notice_subject"
			value="#{bundle.aon_subject}" />
		<aon:inputTextarea id="Notice_subject"
			value="#{controller.to.subject}" cols="100" rows="7" />	

		<aon:if test="#{!skipShowSendMail}">
			<aon:outputLabel for="Notice_sendEmail" value="#{bundle.notice_send_email}" rendered="#{controller.nevv}"/>
			<aon:div id="Notice_sendEmail" style="vertical-align:top" rendered="#{controller.nevv}">
				<aon:selectBooleanCheckbox id="Notice_sendEmail_checkbox"
					value="#{controller.sendMail}" style="vertical-align:top" reRender="Notice_sendEmail" />
				<aon:inputTextarea id="Notice_sendEmail_list" value="#{controller.mailList}" cols="97" rows="4" rendered="#{controller.sendMail}"/>	
			</aon:div>
		</aon:if>

	</aon:panelGrid>
					
</ui:composition>
