<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components" >

	<aon:valueParam name="alarmDescriptionWidth" default="120" />
	<aon:valueParam name="useDatePattern" default="#{true}" />

	<aon:panelCollapsible expanded="true" label="#{alarmListTitle}">

		<aon:dataTable
			value="#{alarmListModel}" var="to" columns="3"
			columnClasses="aon-table-portlet-column" rowClasses="aon-table-portlet-row"
			styleClass="aon-width-all aon-table-portlet" >

			<aon:rowSelector action="alarm_form"
				actionListener="#{alarmListRowSelectorActionListener}"/>	
										
			<aon:column styleClass="aon-width-30">
				<h:graphicImage rendered="#{to.call}"
					url="#{aonResource.resolve['/images/aon-icon/aon-icon-call.png']}" />
				<h:graphicImage rendered="#{to.visit}"
					url="#{aonResource.resolve['/images/aon-icon/aon-icon-visit.png']}" />
				<h:graphicImage rendered="#{to.message}"
					url="#{aonResource.resolve['/images/aon-icon/aon-icon-message.png']}" />
				<h:graphicImage rendered="#{to.communication or to.commercialTracking or to.office}"
					url="#{aonResource.resolve['/images/aon-icon/aon-icon-info.png']}" />
				<h:graphicImage rendered="#{to.highPriority}"
					url="#{aonResource.resolve['/images/aon-icon/aon-icon-high-prty.png']}" />
				<h:graphicImage rendered="#{to.mediumPriority}"
					url="#{aonResource.resolve['/images/aon-icon/aon-icon-medium-prty.png']}" />
				<h:graphicImage rendered="#{to.lowPriority}"
					url="#{aonResource.resolve['/images/aon-icon/aon-icon-low-prty.png']}" />
				<h:graphicImage rendered="#{to.fromTask}"
					url="#{aonResource.resolve['/images/aon-icon/aon-icon-task-assume.png']}" />
				<h:graphicImage rendered="#{to.fromExternal}"
					url="#{aonResource.resolve['/images/aon-icon/aon-icon-esferalia.png']}" />
			</aon:column>
			
			<aon:column styleClass="aon-width-70 #{to.pending?'aon-input-required aon-italic':''}">
				<aon:outputText value="#{to.alarmDate}">
					<f:convertDateTime timeZone="#{timeZoneController.timeZoneId}"
						pattern="#{(useDatePattern)?(bundle.aon_date_pattern):(bundle.aon_time_pattern)}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-nowrap #{to.pending?'aon-input-required aon-italic':''}">
				<aon:outputText value="#{to.description}">
					<aon:abbreviateConverter maxWidth="#{alarmDescriptionWidth}" />
				</aon:outputText>
			</aon:column>

		</aon:dataTable>

	</aon:panelCollapsible>

</ui:composition>
