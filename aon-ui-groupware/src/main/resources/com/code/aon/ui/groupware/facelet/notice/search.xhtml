<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="noticeSearch">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{groupwareBundle.aon_notice}" />
				<ui:param name="controller" value="#{notice}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{notice}" />
				<ui:define name="searchContent">
						
					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Notice_date-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Notice_date-From"
							valueChangeListener="#{notice.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="Notice_date-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Notice_date-To"
							valueChangeListener="#{notice.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
									
					<aon:outputLabel for="Notice_source"
						value="#{groupwareBundle.notice_source}" />
					<aon:inputText id="Notice_source" size="60"
						valueChangeListener="#{notice.addExpression}" />

					<aon:outputLabel for="Notice_company"
						value="#{groupwareBundle.notice_company}" />
					<aon:inputText id="Notice_company" size="60"
						valueChangeListener="#{notice.addExpression}" />

					<aon:outputLabel for="Notice_phone"
						value="#{groupwareBundle.notice_phone}" />
					<aon:inputText id="Notice_phone" size="20"
						valueChangeListener="#{notice.addExpression}" />
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
</ui:composition>
