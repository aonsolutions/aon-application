<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="campaignForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.groupware_campaign_monitor}" />
				<ui:param name="controller" value="#{campaign}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipRemoveButton" value="#{campaign.to.deleted or campaign.to.finished}" />
					
				<ui:define name="beforeSpinToolbarContent">
						<aon:htmlCommandLink id="campaignMonitorReport-report"
							target="_blank" value="#{bundle.aon_report}"
							styleClass="aon-finding-toolbar-item aon-icon-printer"
							action="#{report.onExecute}">
							<f:param name="reportKey" value="campaignMonitorReport" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
						
						<aon:commandButton
							title="#{bundle.groupware_campaign_exclude_project}"
							styleClass="aon-finding-toolbar-item aon-icon-deleteFolder"
							value="#{bundle.groupware_campaign_exclude_project}"
							actionListener="#{campaignProject.onRemoveCampaignProject}"
							rendered="#{campaign.to.inProgress}" />
							
						<aon:commandButton value="#{bundle.groupware_campaign_add_project}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							rendered="#{campaign.to.inProgress}"
							title="#{bundle.groupware_campaign_add_project}"
							actionListener="#{addCampaignProject.showAddPanel}"
							reRender="addPanelContainer"/>
							
						<aon:commandButton id="finishCampaign"
							value="#{bundle.groupware_campaign_finish}"
							onclick="if(confirm('#{bundle.groupware_campaign_finish}?')){Richfaces.showModalPanel('waitProccess');}else{ return false; }"
							oncomplete="Richfaces.hideModalPanel('waitProccess')"
							styleClass="aon-finding-toolbar-item aon-icon-task-finish"
							actionListener="#{campaign.onFinishCampaign}"
							action="campaign_list"
							rendered="#{campaign.to.inProgress}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" width="100%" columns="4"
					columnClasses="aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-auto
						,aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Campaign_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Campaign_description"
						value="#{campaign.to.description}" required="#{true}" size="60"
						disabled="#{!campaign.to.pending and !campaign.to.inProgress}" />

					<aon:outputLabel for="Campaign_status" value="#{bundle.aon_status}"/>
					<aon:selectOneMenu id="Campaign_status" value="#{campaign.to.status}"
						ajaxSingle="true" reRender="Campaign_process">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{groupWareCollections.campaignStatuses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Campaign_process" value="#{bundle.aon_process}" />
					<aon:selectOneMenu id="Campaign_process" value="#{campaign.to.process}"
						disabled="#{!campaign.to.pending}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{groupWareCollections.processes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Campaign_startDate"
						value="#{bundle.aon_start_date}" />
					<aon:selectInputDate id="Campaign_startDate"
						value="#{campaign.to.startDate}" required="#{true}"
						disabled="#{!campaign.to.pending}" renderAsPopup="true"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>

					<aon:outputLabel for="Campaign_workGroup"
						value="#{bundle.aon_supervisor}" />
					<aon:selectOneMenu id="Campaign_workGroup"
						value="#{campaign.to.workGroup}"
						disabled="#{!campaign.to.pending and !campaign.to.inProgress}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.workgroups}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Campaign_endDate"
						value="#{bundle.aon_end_date}" />
					<aon:selectInputDate id="Campaign_endDate"
						value="#{campaign.to.endDate}" required="#{true}"
						disabled="#{!campaign.to.pending and !campaign.to.inProgress}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</aon:panelGrid>
 
				<aon:div style="width: 100%;">
					<h:panelGrid columns="7" styleClass="aon-text-center"
						style="width: 100%;"
						columnClasses="aon-width-auto,aon-width-100,aon-width-100,aon-width-100,aon-width-100,aon-width-100,aon-width-100,">
						<aon:div />
						<aon:div style="border: solid 1px black;width: 100%;background-color: #DD4545;color: white;">
							<aon:outputText value="0% - 19% " />
						</aon:div>
						<aon:div style="border: solid 1px black;width: 100%;background-color: #DD8B45;color: black;">
							<aon:outputText value="20% - 39% " />
						</aon:div>
						<aon:div style="border: solid 1px black;width: 100%;background-color: #D8B645;color: black;">
							<aon:outputText value="40% - 59% " />
						</aon:div>
						<aon:div style="border: solid 1px black;width: 100%;background-color: #D6D845;color: black;">
							<aon:outputText value="60% - 79% " />
						</aon:div>
						<aon:div style="border: solid 1px black;width: 100%;background-color: #ACD845;color: black;">
							<aon:outputText value="80% - 99% " />
						</aon:div>
						<aon:div style="border: solid 1px black;width: 100%;background-color: #70D845;color: black;">
							<aon:outputText value="100% " />
						</aon:div>
					</h:panelGrid>
				</aon:div>

				<aon:div id="CampaignProjectDataListContainer" style="width: 100%;">
					<aon:dataTable id="CampaignProjectDataList" var="to"
						value="#{campaignProject.extendedModel}" rendered="#{!campaign.to.pending}">
	
						<aon:column styleClass="aon-icon-column aon-width-30">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:commandButton immediate="true" value="&#160;"
								styleClass="aon-icon-commandButton aon-icon-rowSelector"
								action="campaign_project_history"
								actionListener="#{processTask.onSearchTasks}" />
						</aon:column>
	
						<aon:column styleClass="aon-icon-column aon-width-30">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:selectBooleanCheckbox value="#{campaignProject.rowChecked}"
								rendered="#{to.processDetail != null}" />
						</aon:column>
	
						<aon:column alias="CampaignProject.project.registry.name" styleClass="aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_project}" />
							</f:facet>
							<aon:outputText value="#{to.project}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="C" />
							</f:facet>
							<aon:div style="display:inline;cursor:pointer;"
								rendered="#{to.task.commentsNotEmpty}">
								<aon:outputText value="&#160;" 
									style="padding-left:15px;" styleClass="aon-icon-comment"/>
								<rich:toolTip value="#{to.task.comments}" showEvent="onclick"
									style="width: 400px;"
									hideDelay="2000">
									<f:facet name="defaultContent">
										<aon:outputText value="#{bundle.aon_in_progress}" />
									</f:facet>
								</rich:toolTip>
							</aon:div>
						</aon:column>
 	
						<aon:column styleClass="aon-width-200"
							rendered="#{campaign.to.inProgress}">
							<f:facet name="header">
								<aon:outputText value="#{bundle.groupware_current_action}" />
							</f:facet>
							<rich:inplaceSelect value="#{to.processDetail}"
								styleClass="aon-inplace-select" showControls="true"
								defaultLabel="........." layout="block" selectWidth="165"
								listWidth="165" id="inplaceSelect">
								<f:facet name="controls">
									<aon:div>
										<aon:commandButton style="margin-left: 5px;" value="&#160;"
											alt="#{bundle.groupware_change_current_action}"
											title="#{bundle.groupware_change_current_action}"
											onmousedown="#{rich:component('inplaceSelect')}.save();"
											onclick="return false"
											styleClass="aon-icon-commandButton aon-icon-accept" />
										<aon:commandButton alt="#{bundle.aon_cancel}" value="&#160;"
											title="#{bundle.aon_cancel}"
											onmousedown="#{rich:component('inplaceSelect')}.cancel();"
											onclick="return false"
											styleClass="aon-icon-commandButton aon-icon-cancel" />
									</aon:div>
								</f:facet>
								<f:selectItems value="#{campaignProject.processDetailList}" />
								<a4j:support event="onviewactivated"
									actionListener="#{campaignProject.onChangeProcessDetail}"
									reRender="CampaignProjectDataList" />
							</rich:inplaceSelect>
						</aon:column>
	
						<aon:column styleClass="aon-width-150">
							<f:facet name="header">
								<aon:outputText value="Usr - Grp" />
							</f:facet>
							<aon:outputText value="#{to.assigned}">
								<aon:abbreviateConverter maxWidth="15" />
							</aon:outputText>
						</aon:column>
 	
						<aon:column styleClass="aon-editDataTable-text aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_start_date}" />
							</f:facet>
							<aon:outputText value="#{to.task.startDate}"
								style="#{to.task.expired?'color:red;':''}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-text aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.groupware_due_date}" />
							</f:facet>
							<aon:outputText value="#{to.task.dueDate}"
								style="#{to.task.expired?'color:red;':''}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
						<aon:column styleClass="aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_percentage}" />
							</f:facet>
							<aon:div styleClass="aon-nowrap"
								style="border:solid black 1px; background-color: rgb(#{to.color.red},#{to.color.green},#{to.color.blue}); width: #{to.processDetailPercent}%">
								<aon:div styleClass="aon-nowrap aon-bold"
									style="margin-left: 5px;color: #{to.processDetailPercent==0?'red':'black'};">
									<aon:outputText value="#{to.processDetailPercent}">
										<f:convertNumber pattern="##0" />
									</aon:outputText>
									<aon:outputText value="%" />
								</aon:div>
							</aon:div>
						</aon:column>
					</aon:dataTable>
					<aon:dataScroller for="CampaignProjectDataList" showNote="false"
						rowCount="#{campaignProject.extendedModel.rowCount}" />
				</aon:div>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />

		<aon:div id="addPanelContainer">
			<c:if test="#{addCampaignProject.addPanelVisible}">
				<ui:include src="/com/code/aon/ui/groupware/facelet/campaign/addProject.xhtml" />
			</c:if>
		</aon:div>

	</ui:define>
</ui:composition>
