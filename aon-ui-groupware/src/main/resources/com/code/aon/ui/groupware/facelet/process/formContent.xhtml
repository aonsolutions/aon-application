<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarTitle" value="#{bundle.aon_processes}" />
		<ui:param name="controller" value="#{process}" />
	</ui:decorate>

	<aon:div id="fieldContainer" styleClass="aon-scroll-area" style="height: 100%;">
		<aon:panelGrid columns="4" dir="true" style="width: 100%;"
			columnClasses="
				 aon-panelGrid-odd aon-width-100
				,aon-panelGrid-even aon-width-150
				,aon-panelGrid-odd aon-width-100
				,aon-panelGrid-even aon-width-auto">

			<aon:outputLabel for="Process_id" value="#{bundle.aon_id}" />
			<aon:div>
				<aon:inputText id="Process_id" disabled="true"
					value="#{process.to.id}" size="10" />
				<aon:selectBooleanCheckbox id="Process_active"
					styleClass="aon-margin-left" value="#{process.to.active}" />
				<aon:outputLabel for="Process_active" value="#{bundle.aon_active}" />
			</aon:div>


			<aon:outputLabel for="Process_description"
				value="#{bundle.aon_description}" />
			<aon:inputText id="Process_description" required="true"
				value="#{process.to.description}" size="35" maxlength="30">
				<f:validateLength maximum="30" />
			</aon:inputText>

		</aon:panelGrid>
	</aon:div>
</ui:composition>
