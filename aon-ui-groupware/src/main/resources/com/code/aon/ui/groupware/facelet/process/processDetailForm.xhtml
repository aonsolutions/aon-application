<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarTitle" value="#{bundle.groupware_process_detail}" />
		<ui:param name="controller" value="#{processDetail}" />
		<ui:param name="skipSearchButton" value="#{true}" />
	</ui:decorate>

	<aon:div ajaxRenderer="true" styleClass="aon-scroll-area">
		<aon:panelGrid columns="2" dir="true" style="width: 100%;"
			columnClasses="aon-panelGrid-odd aon-width-150
				,aon-panelGrid-even aon-width-auto">

			<aon:outputLabel for="ProcessDetail_id" value="#{bundle.aon_id}" />
			<aon:div>
				<aon:inputText id="ProcessDetail_id" disabled="true"
					value="#{processDetail.to.id}" size="10" />
				<aon:selectBooleanCheckbox id="processDetail_active"
					styleClass="aon-margin-left" value="#{processDetail.to.active}" />
				<aon:outputLabel for="processDetail_active" value="#{bundle.aon_active}" />
			</aon:div>
			
			<aon:outputLabel for="processDetail_position"
						value="#{bundle.aon_position}" />
			<aon:inputText id="processDetail_position" required="true" 
				value="#{processDetail.to.position}"
				maxlength="5" size="8" />

			<aon:outputLabel for="processDetail_description"
				value="#{bundle.aon_description}" />
			<aon:inputText id="processDetail_description" required="true"
				value="#{processDetail.to.description}" size="64" maxlength="64">
				<f:validateLength maximum="64" />
			</aon:inputText>

			<aon:outputLabel for="processDetail_workgroup"
				value="#{bundle.aon_group}" />
			<aon:selectOneMenu id="processDetail_workgroup" value="#{processDetail.to.workgroup}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{configCollections.workgroups}" />
			</aon:selectOneMenu>


			<aon:outputLabel for="processDetail_days"
				value="#{bundle.aon_days}"/>
			<aon:div>
				<aon:inputText id="processDetail_days" required="true" 
					value="#{processDetail.to.days}"				
					maxlength="5" size="8" />
				<aon:selectOneMenu id ="processDetail_dateReference"
					styleClass="aon-margin-left" 
					value="#{processDetail.to.dateReference}">
					<f:selectItems value="#{groupWareCollections.dateReferences}" />
				</aon:selectOneMenu>
			</aon:div>
			

			<aon:outputLabel for="processDetail_alertDays"
						value="#{bundle.groupware_alert_beforehand}" />
			<aon:inputText id="processDetail_alertDays" required="true" 
				value="#{processDetail.to.alertDays}"
				maxlength="5" size="8" />

			<aon:outputLabel for="processDetail_priority" value="#{bundle.aon_priority}" />
			<aon:selectOneMenu id="processDetail_priority" 
				value="#{processDetail.to.priority}">
				<f:selectItems value="#{groupWareCollections.priorities}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel for="processDetail_comments" value="#{bundle.aon_comment}" />
			<aon:inputTextarea id="processDetail_comments"
				value="#{processDetail.to.comments}" cols="60" rows="5" />

		</aon:panelGrid>
		
		<aon:div styleClass="aon-form-group" rendered="#{!processDetail.nevv}">
			<aon:div styleClass="aon-form-group-title">
				<aon:outputText value="#{bundle.groupware_process_transition_types}" />
			</aon:div>
			<aon:div styleClass="aon-form-group-body">
				<ui:include src="/com/code/aon/ui/groupware/facelet/process/processDetailTransition.xhtml" />
			</aon:div>
		</aon:div>
		
	</aon:div>
</ui:composition>
