<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="taskHolderList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarID" value="toolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.groupware_taskHolders}" />
				<ui:param name="controller" value="#{taskHolder}" />
			</ui:decorate>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">

				<ui:param name="controller" value="#{taskHolder}" />

				<ui:define name="searchContent">

					<aon:outputLabel for="TaskHolder_registry_name" value="#{bundle.aon_name}" />
					<aon:inputText id="TaskHolder_registry_name" size="60" valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="TaskHolder_registry_alias" value="#{bundle.aon_alias}" />
					<aon:inputText id="TaskHolder_registry_alias" size="40" valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="TaskHolder_active" value="#{bundle.aon_active}"/>
					<aon:selectOneMenu id="TaskHolder_active"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="#{true}"/>
						<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="#{false}"/>
					</aon:selectOneMenu>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
