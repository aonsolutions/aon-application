<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="jobTypeList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{bundle.groupware_cost_profiles}" />
					<ui:param name="controller" value="#{costProfile}" />
				</ui:include>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{costProfile}" />
						
						<ui:define name="columns">
							
							<aon:column alias="CostProfile.description" styleClass="aon-editDataTable-textColumn aon-width-auto">
								<f:facet name="header">
									<aon:outputLabel for="CostProfile_description" value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}" rendered="#{formList}" />
								<aon:inputText id="CostProfile_description" rendered="#{formEdit}" size="40" 
									value="#{controller.to.description}" required="true" />
								<f:facet name="footer">
									<aon:inputText id="CostProfile_description-New" rendered="#{formNew}"
										value="#{controller.to.description}" required="#{true}" size="40" />
								</f:facet>
							</aon:column>
							
							<aon:column alias="CostProfile.cost" styleClass="aon-editDataTable-numberColumn aon-width-150">
								<f:facet name="header">
									<aon:outputLabel for="CostProfile_cost" value="#{bundle.aon_cost}" />
								</f:facet>
								<aon:outputText value="#{to.cost}" rendered="#{formList}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
								<aon:inputText id="CostProfile_cost" rendered="#{formEdit}" size="20" 
									value="#{controller.to.cost}" required="true" />
								<f:facet name="footer">
									<aon:inputText id="CostProfile_cost-New" rendered="#{formNew}"
										value="#{controller.to.cost}" required="#{true}" size="20" />
								</f:facet>
							</aon:column>
							
							
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
