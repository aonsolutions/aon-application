<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/com/code/aon/ui/groupware/facelet/processLauncher/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{groupwareBundle.groupware_process_wizard_step3}"/>
	</ui:define>
	
	<ui:define name="step_content">
		<aon:panelGrid columns="4" dir="true" style="width: 90%;"
			columnClasses="aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-250
						,aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-auto">
						
			<aon:outputLabel for="wzd_process" value="#{bundle.aon_process}" />
			<aon:outputText value="#{processWizard.process.description}" />

			<aon:outputLabel for="Campaign_description" value="#{bundle.aon_description}" />
			<aon:outputText value="#{processWizard.description}" />

			<aon:outputLabel for="Campaign_startDate" value="#{bundle.aon_start_date}" />
			<aon:outputText value="#{processWizard.startDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>

			<aon:outputLabel for="Campaign_endDate" value="#{bundle.aon_end_date}" />
			<aon:outputText value="#{processWizard.endDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>

			<aon:outputLabel for="Campaign_workGroup" value="#{bundle.aon_supervisor}" />
			<aon:outputText value="#{processWizard.workGroup.description}" />

			<aon:outputText value="#{groupwareBundle.groupware_campaign_type}" />
			<aon:outputText value="#{processWizard.type.description}" />
		</aon:panelGrid>
		
		<aon:div id="projectsTable" style="margin-top: 5px;width: 90%;">
			<aon:dataTable id="projectDataList" value="#{processWizard.projectsModel}" var="to">

				<aon:column styleClass="aon-width-40">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:outputText value="&#160;"
						style="padding-left: 20px;"
					    styleClass="aon-icon-new-page"
					    title="#{groupwareBundle.groupware_process_wizard_new_project_added}"
					    alt="#{groupwareBundle.groupware_process_wizard_new_project_added}"
						rendered="#{to.project.id==null}" />
					<aon:outputText value="&#160;"
						style="padding-left: 20px;"
					    styleClass="aon-icon-page"
					    title="#{groupwareBundle.groupware_process_wizard_project_added}"
					    alt="#{groupwareBundle.groupware_process_wizard_project_added}"
						rendered="#{to.project.id!=null}" />
				</aon:column>

				<aon:column styleClass="aon-width-200">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_project}" />
					</f:facet>
					<aon:outputText value="#{to.project.name}" />
				</aon:column>
				
				<aon:column styleClass="aon-width-auto">
					<f:facet name="header">
						<aon:outputText value="#{projectBundle.project_assigned}" />
					</f:facet>
					<aon:outputText value="#{to.project.registry.fullName}" />
				</aon:column>
				
				<aon:column styleClass="aon-width-150">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_type}" />
					</f:facet>
					<aon:outputText value="#{to.project.projectType.description}" />
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
				</aon:column>

			</aon:dataTable>
			<aon:dataScroller for="projectDataList"
				rowCount="#{processWizard.projectsModel.rowCount}" showNote="true" />
		</aon:div>
	</ui:define> 
</ui:composition>
