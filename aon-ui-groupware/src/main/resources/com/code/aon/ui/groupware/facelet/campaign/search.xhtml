<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="campaignList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarID" value="toolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.groupware_campaign_monitor}" />
				<ui:param name="controller" value="#{campaign}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:decorate>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">

				<ui:param name="controller" value="#{campaign}" />

				<ui:define name="searchContent">

					<aon:outputLabel for="Campaign_description" value="#{bundle.aon_description}" />
					<aon:inputText id="Campaign_description" size="60" valueChangeListener="#{campaign.addExpression}" />

					<aon:outputLabel for="Campaign_campaignType_id"
						value="#{bundle.groupware_campaign_type}" />
					<aon:selectOneMenu id="Campaign_campaignType_id"
						value="#{campaignSearchListener.campaignType}"
						valueChangeListener="#{controller.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{groupWareCollections.campaignTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Campaign_process_id" value="#{bundle.aon_process}" />
					<aon:selectOneMenu id="Campaign_process_id"
						value="#{campaignSearchListener.process}"
						valueChangeListener="#{controller.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{groupWareCollections.processes}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{bundle.aon_status}"/>
					<aon:div>
						<aon:selectBooleanCheckbox id="st0" value="#{campaignSearchListener.statusPending}" />
						<aon:outputLabel for="st0" value="#{bundle.aon_pending}" />
						<aon:selectBooleanCheckbox id="st1" value="#{campaignSearchListener.statusInProgress}" />
						<aon:outputLabel for="st1" value="#{bundle.groupware_in_progress}" />
						<aon:selectBooleanCheckbox id="st2" value="#{campaignSearchListener.statusFinished}" />
						<aon:outputLabel for="st2" value="#{bundle.groupware_finished}" />
						<aon:selectBooleanCheckbox id="st3" value="#{campaignSearchListener.statusDeleted}" />
						<aon:outputLabel for="st3" value="#{bundle.groupware_deleted}" />
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
