<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="alarmForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle"
					value="#{groupwareBundle.aon_alarm}" />
				<ui:param name="toolbarDescription"
					value="#{alarm.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="cancel"
						value="#{(alarm.returnToList)? bundle.aon_list : bundle.aon_back}"
						action="#{alarm.backAction}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:commandButton id="alarm_delay" value="#{groupwareBundle.alarm_delay}"
						styleClass="aon-finding-toolbar-item aon-icon-alarms-postpone"
						action="#{alarm.backAction}" actionListener="#{alarm.onDelayAlarm}"/>	
					<aon:commandButton id="alarm_finish" value="#{groupwareBundle.alarm_finish}"
						styleClass="aon-finding-toolbar-item aon-icon-alarms-finish"
						action="#{alarm.backAction}" actionListener="#{alarm.onFinishAlarm}"/>	
				</ui:define>				
			</ui:decorate>		

			<aon:div styleClass="aon-scroll-area">
			
				<ui:include src="/com/code/aon/ui/groupware/facelet/alarm/formContent.xhtml" />

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
