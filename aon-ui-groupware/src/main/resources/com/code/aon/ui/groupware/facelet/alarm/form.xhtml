<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="alarmForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_alarm}" />
				<ui:param name="controller" value="#{alarm}" />
				<ui:param name="skipRemoveButton" value="#{true}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipSpin" value="#{true}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="alarm_finish" value="#{bundle.alarm_finish}"
						styleClass="aon-finding-toolbar-item aon-icon-alarms-finish"
						action="#{alarm.backAction}" actionListener="#{alarm.onFinishAlarm}"/>	
				</ui:define>				
			</ui:decorate>		

			<aon:div styleClass="aon-scroll-area">
			
				<ui:include src="/com/code/aon/ui/groupware/facelet/alarm/formContent.xhtml" />

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
