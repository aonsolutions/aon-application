<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="favoriteList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{groupwareBundle.aon_favorite}" />
				<ui:param name="controller" value="#{favorite}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="favorite_category" value="#{groupwareBundle.aon_favorite_category}"
						immediate="true" action="favorite_category"
						styleClass="aon-finding-toolbar-item aon-icon-category"/>
				</ui:define>				
			</ui:decorate>		
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable id="favoriteDataList" value="#{favorite.model}"
					var="to" rows="20" rendered="#{favorite.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn
									aon-editDataTable-textColumn, aon-editDataTable-iconColumn">

					<aon:rowSelector action="favorite_form" actionListener="#{favorite.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.favorite_favorite_category}" />
						</f:facet>
						<aon:outputText value="#{to.favoriteCategory.description}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{groupwareBundle.favorite_url}" />
						</f:facet>
						<aon:outputText value="#{to.url}"/>
					</aon:column>

					<aon:column style="text-align:center">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandLink actionListener="#{favorite.onSelectUrl}" onclick="window.open('#{to.url}');">
							<aon:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon/aon-icon-file-entrance.png']}" style="border:0px;margin:2px;" alt="Abrir URL"/>
						</aon:commandLink>
					</aon:column>

				</aon:dataTable>

				<aon:dataScroller for="favoriteDataList" rowCount="#{favorite.model.rowCount}" showNote="true" />

			</aon:div>

		</aon:form>
		
	</ui:define>

</ui:composition>
