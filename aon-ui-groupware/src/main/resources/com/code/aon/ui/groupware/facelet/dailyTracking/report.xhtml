<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="dailyTrackingForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true" columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{bundle.aon_reports}: " />
						<aon:outputText value="#{bundle.aon_daily_tracking_module}" />
					</aon:div>
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_editing}" />
					</aon:div>
					<aon:div id="toolbar" styleClass="aon-finding-toolbar-item-group">

						<aon:htmlCommandLink 
							actionListener="#{dailyTrackingReport.onResetReportSearch}"
							value="#{bundle.aon_clear}" 
							onclick="return confirm('#{bundle.aon_clear}&#160;#{bundle.aon_search_header}?');"
							styleClass="aon-finding-toolbar-item aon-icon-rubber">
						</aon:htmlCommandLink>

						<aon:htmlCommandLink action="#{dailyTrackingReport.onReport}"
							value="#{bundle.aon_report}" target="_blank"
							styleClass="aon-finding-toolbar-item aon-icon-printer">
						</aon:htmlCommandLink>

						<aon:selectBooleanCheckbox id="monitor" value="#{dailyTrackingReport.monitor}"
							rendered="#{aonRole.taskMonitor}">
							<a4j:support event="onclick" ajaxSingle="true" reRender="dailyTrackingForm" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="monitor" value="Monitor" rendered="#{aonRole.taskMonitor}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="workgroup"
						rendered="#{dailyTrackingReport.monitor}" 
						value="#{bundle.aon_group}" />
					<aon:selectOneMenu id="workgroup"
						rendered="#{dailyTrackingReport.monitor}"
						disabled="#{dailyTrackingReport.params.taskHolder != null}"
						reRender="workgroup,user"
						value="#{dailyTrackingReport.params.workGroup}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.workgroups}" />
						<a4j:support event="onchange" reRender="user" ajaxSingle="true" />
					</aon:selectOneMenu>

					<aon:outputText
						rendered="#{dailyTrackingReport.monitor}" 
						value="#{bundle.aon_login_user}" />
					<aon:div id="user" rendered="#{dailyTrackingReport.monitor}">
						<aon:selectOneMenu 
							rendered="#{dailyTrackingReport.params.workGroup == null}"
							value="#{dailyTrackingReport.params.taskHolder}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{groupWareCollections.taskHolders}" />
							<a4j:support event="onchange" reRender="workgroup" ajaxSingle="true" />
						</aon:selectOneMenu>
						<aon:selectOneMenu
							rendered="#{dailyTrackingReport.params.workGroup != null}"
							value="#{dailyTrackingReport.params.taskHolder}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{dailyTrackingReport.taskHolderWorkgroups}" />
							<a4j:support event="onchange" reRender="workgroup" ajaxSingle="true" />
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputLabel value="#{bundle.aon_date}"/>
					<aon:div>
						<aon:outputLabel for="dateFrom" 
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}"/>
						<aon:selectInputDate id="dateFrom"
							value="#{dailyTrackingReport.params.fromDate}" renderAsPopup="true"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="dateTo"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
						 	value="#{bundle.aon_date_to}"/>
						<aon:selectInputDate id="dateTo"
							value="#{dailyTrackingReport.params.toDate}" renderAsPopup="true"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>

					<aon:outputLabel for="jobType"
						value="#{bundle.groupware_job_type}"/>
					<aon:selectOneMenu id="jobType"
						reRender="jobType"
						value="#{dailyTrackingReport.params.jobType}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{groupWareCollections.jobTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="DailyTracking_project" value="#{bundle.aon_project}"/>
					<aon:panelGrid columns="2"
						columnClasses="aon-panelGrid-even aon-italic aon-width-100,aon-panelGrid-even aon-width-auto">
					
						<aon:outputLabel for="Registry_id" value="#{bundle.project_assigned}"/>
						<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
							<ui:param name="lookupTo" value="#{dailyTrackingReport.params.registry}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupReRender" value="DailyTracking_project, DailyTracking_activityType" />
							<aon:methodParam name="lookupChangeListener"
								value="#{dailyTrackingReport.onRegistryChanged}" type="lookupChangeListener" />
						</ui:include>
						
						<aon:outputLabel for="DailyTracking_project" value="#{bundle.aon_name}"/>
						<aon:selectOneMenu id="DailyTracking_project" value="#{dailyTrackingReport.params.project}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{dailyTrackingReport.projects}" />
							<a4j:support event="onchange"
								actionListener="#{dailyTrackingReport.onChangeProject}"
								reRender="lookupRegistry, DailyTracking_project, DailyTracking_activityType"
								ajaxSingle="true" />
						</aon:selectOneMenu>
						
						<aon:outputLabel for="DailyTracking_activityType" value="#{bundle.project_activity_type}"/>
						<aon:selectOneMenu id="DailyTracking_activityType"
							value="#{dailyTrackingReport.params.activityType}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{dailyTrackingReport.activityTypes}" />
						</aon:selectOneMenu>
					</aon:panelGrid>

					<aon:outputLabel for="project_type" value="#{bundle.project_project_type}"/>
					<aon:selectOneMenu id="project_type"
						value="#{dailyTrackingReport.params.projectType}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{projectCollections.projectTypes}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="reportType" value="#{bundle.aon_listing}"/>
					<aon:div>
						<aon:selectOneMenu id="reportType" 
							value="#{dailyTrackingReport.params.reportType}">
							<f:selectItems value="#{groupWareCollections.dailyTrackingReportTypes}" />
						</aon:selectOneMenu>
					</aon:div>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
	</ui:define>
</ui:composition>
