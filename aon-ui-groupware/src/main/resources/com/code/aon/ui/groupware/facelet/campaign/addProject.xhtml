<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<aon:form>
	<rich:modalPanel id="addPanel" top="50" left="100" showWhenRendered="true" 
		minHeight="100" minWidth="100" height="700" width="750" zindex="10">
		
		<f:facet name="header">
			<aon:div styleClass="aon-popupWindow-title">
				<aon:outputText value="#{groupwareBundle.groupware_campaign_add_project}" />
			</aon:div>
		</f:facet>
		<f:facet name="controls">
			<aon:commandButton type="button" styleClass="aon-popupWindow-close"
				reRender="addPanelContainer"
				actionListener="#{addCampaignProject.hideAddPanel}">
			</aon:commandButton>
		</f:facet>
		<aon:div styleClass="aon-scroll-area" style="width: 90%;">
				<aon:div styleClass="aon-finding-title-toolbar">
					<aon:panelGrid columns="1" dir="true"
						columnClasses="aon-finding-toolbar">

						<aon:div styleClass="aon-finding-toolbar-item-group">
							<aon:commandButton value="#{groupwareBundle.groupware_add_projects_to_campaign}"
								actionListener="#{addCampaignProject.onAddCampaignProjects}"
								immediate="true" styleClass="aon-finding-toolbar-item aon-icon-accept"
								reRender="addPanelContainer,CampaignProjectDataListContainer" />
						</aon:div>
					</aon:panelGrid>
				</aon:div>
				
				<aon:panelGrid columns="2" dir="true" style="width: 100%;margin-top: 5px;">
				
					<aon:outputLabel for="DailyTracking_project" value="#{bundle.aon_project}"/>
					<aon:panelGrid columns="2"
						columnClasses="aon-panelGrid-even aon-italic aon-width-100,aon-panelGrid-even aon-width-auto">
					
						<aon:outputLabel for="Registry_id" value="#{projectBundle.project_assigned}"/>
						<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
							<ui:param name="lookupTo" value="#{addCampaignProject.registry}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupInputSuggestSize" value="45" />
							<ui:param name="lookupReRender" value="addCampaignProject_project" />
							<aon:methodParam name="lookupChangeListener" value="#{addCampaignProject.registryChanged}" type="lookupChangeListener" />
						</ui:include>
						
						<aon:outputLabel for="addCampaignProject_project" value="#{bundle.aon_name}"/>
						<aon:selectOneMenu id="addCampaignProject_project"
							value="#{addCampaignProject.project}"
							reRender="registryIdExContainer,addCampaignProject_project"
							valueChangeListener="#{addCampaignProject.projectChanged}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{addCampaignProject.availableProjects}" />
						</aon:selectOneMenu>
					</aon:panelGrid>

					<aon:outputLabel for="addCampaignProject_type" value="#{projectBundle.project_project_type}"/>
					<aon:selectOneMenu id="addCampaignProject_type"
						reRender="addCampaignProject_type"
						value="#{addCampaignProject.projectType}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{projectCollections.projectTypes}" />
					</aon:selectOneMenu>
				
					<aon:outputLabel for="addCampaignProject_activityType" value="#{projectBundle.project_activity_type}"/>
					<aon:selectOneMenu id="addCampaignProject_activityType"
						reRender="addCampaignProject_activityType"
						value="#{addCampaignProject.activityType}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{projectCollections.activityTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="addCampaignProject_projectName" value="#{bundle.aon_project}" />
					<aon:div>
						<aon:inputText id="addCampaignProject_projectName" size="25"
							reRender="addCampaignProject_projectName"
							value="#{addCampaignProject.projectName}" maxlength="64" />
						<aon:commandButton value="#{groupwareBundle.groupware_add_project_list}"
							actionListener="#{addCampaignProject.addExistingProject}"
							focus="Registry_id" immediate="true"
							styleClass="aon-commandButton aon-icon-reset"
							reRender="projectsTable" />
					</aon:div>
				</aon:panelGrid>

				<aon:div id="projectsTable" style="margin-top: 5px;width: 100%;">

					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{addCampaignProject}" />
						<ui:param name="skipSelectButton" value="true" />
						<ui:param name="rowSelectorToggleOnClick" value="false" />

						<ui:define name="columns">
	
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_project}" />
								</f:facet>
								<aon:outputText value="#{to.project.name}" />
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{projectBundle.project_assigned}" />
								</f:facet>
								<aon:outputText value="#{to.project.registry.fullName}" />
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_type}" />
								</f:facet>
								<aon:outputText value="#{to.project.projectType.description}" />
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:commandButton title="#{bundle.aon_remove}"
									actionListener="#{addCampaignProject.removeProject}"
									immediate="true" reRender="projectsTable"
									onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
									styleClass="aon-editDataTable-button aon-icon-delete" />
							</aon:column>
						</ui:define>
					</ui:decorate>
<!-- 
					<aon:dataTable id="projectDataList" limit="20"
						value="#{addCampaignProject.model}" var="to">
					</aon:dataTable>
					<aon:dataScroller2 for="projectDataList" showNote="true" />
 -->
				</aon:div>
		</aon:div>
	</rich:modalPanel>
	</aon:form>
	<aon:lookupButtonPopup lookup="#{registryLookup}" />
</ui:composition>
