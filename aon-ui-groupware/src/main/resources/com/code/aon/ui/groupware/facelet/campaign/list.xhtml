<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="campaignList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.groupware_campaign_monitor}" />
				<ui:param name="controller" value="#{campaign}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="rowSelectorToggleOnClick" value="#{true}" />
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{campaign}" />
					<ui:define name="columns">

						<aon:column alias="Campaign.status" styleClass="aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							
							<aon:outputText value="#{to.status}" rendered="#{to.pending}"
								style="padding-left:20px;" />
							<aon:outputText value="#{to.status}" rendered="#{to.inProgress}"
								style="padding-left:20px;" styleClass="aon-icon-point-green" />
							<aon:outputText value="#{to.status}" rendered="#{to.deleted}"
								style="padding-left:20px;"  styleClass="aon-icon-point-red" />
							<aon:outputText value="#{to.status}" rendered="#{to.finished}"
								style="padding-left:20px;"  styleClass="aon-icon-predetermine" />
						</aon:column>

						<aon:column alias="Campaign.startDate" styleClass="aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_start_date}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Campaign.endDate" styleClass="aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_end_date}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Campaign.description" styleClass="aon-width-250">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>

						<aon:column alias="Campaign.process.description" styleClass="aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_process}" />
							</f:facet>
							<aon:outputText value="#{to.process.description}" />
						</aon:column>
					
						<aon:column alias="Campaign.workGroup.description" styleClass="aon-width-200">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_supervisor}" />
							</f:facet>
							<aon:outputText value="#{to.workGroup.description}" />
						</aon:column>

						<aon:column alias="Project.manual" styleClass="aon-editDataTable-textColumn aon-width-60">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{bundle.finance_manual}" rendered="#{to.manual}" />
							<aon:outputText value="#{bundle.groupware_automatic}" rendered="#{!to.manual}" />
						</aon:column>							

						<aon:column styleClass="aon-width-20">
							<f:facet name="header">
								<aon:outputText value="B" />
							</f:facet>
							
							<aon:div
								rendered="#{!to.deleted and !to.finished}" 
								onmouseover="disableRowSelector();" 
								onmouseup="disableRowSelector();"
								onmouseout="enableRowSelector();">
								<aon:confirmButton id="CampaignList-removeButton"
									title="Borrar"
									styleClass="aon-icon aon-icon-delete"
									style="border:none;"
									value="&#160;"
									immediate="true" ajaxSingle="true" requestDelay="100" 
									confirmActionListener="#{rowSelectorActionListener}"
									confirmAction="#{campaign.campaignRemoveAction}"
									confirmTitle="#{bundle.aon_confirm_title}"
									confirmMessage="#{bundle.aon_remove_confirm}"
								/>
							</aon:div>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
