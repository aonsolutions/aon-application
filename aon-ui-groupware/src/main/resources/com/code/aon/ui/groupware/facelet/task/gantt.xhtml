<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="ganttForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="toolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.groupware_gantt_diagram}"/>
				<ui:param name="controller" value="#{gantt}" />
				<ui:define name="additionalToolbarContent">
						<aon:selectBooleanCheckbox id="monitor" value="#{gantt.monitor}" 
						rendered="#{aonRole.taskMonitor}">
							<a4j:support event="onclick" reRender="toolbar,ganttForm" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="monitor" value="Monitor" rendered="#{aonRole.taskMonitor}"/>
				</ui:define>
			</ui:decorate>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">

				<ui:param name="controller" value="#{gantt}" />
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:param name="skipSearchButton" value="#{true}" />/>
				
				<ui:define name="searchContent">

					<aon:outputLabel value="#{bundle.aon_start_date}" />
					<aon:div>
						<aon:outputLabel for="Gantt_startDate-From"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="Gantt_startDate-From"
							value="#{gantt.fromStartDate}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true" />

						<aon:outputLabel for="Gantt_startDate-To"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="Gantt_startDate-To"
							value="#{gantt.toStartDate}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true" />
					</aon:div>

					<aon:outputLabel value="#{bundle.groupware_due_date}" />
					<aon:div>
						<aon:outputLabel for="Gantt_dueDate-From"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="Gantt_dueDate-From"
							value="#{gantt.fromDueDate}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
						
						<aon:outputLabel for="Gantt_dueDate-To"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="Gantt_dueDate-To"
							value="#{gantt.toDueDate}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
					</aon:div>

					<aon:outputText value="#{bundle.aon_login_user}" />
					<aon:div>
						<aon:selectOneMenu rendered="#{gantt.monitor}"
							value="#{gantt.taskHolder}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{groupWareCollections.taskHolders}" />
							<a4j:support event="onchange" reRender="workgroup" ajaxSingle="true" />
						</aon:selectOneMenu>
						<aon:selectBooleanCheckbox styleClass="aon-margin-left" 
							id="gt" value="#{gantt.groupTasksVisible}" />
						<aon:outputLabel for="gt" value="#{bundle.groupware_group_tasks}" />
					</aon:div>

					<aon:outputLabel for="Gantt_project" value="#{bundle.aon_project}"/>
					<aon:panelGrid columns="2"
						columnClasses="aon-panelGrid-even aon-italic aon-width-100,aon-panelGrid-even aon-width-auto">
					
						<aon:outputLabel for="Registry_id" value="#{bundle.project_assigned}"/>
						<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
							<ui:param name="lookupTo" value="#{gantt.registry}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="skipSearchButton" value="#{false}" />/>
							<ui:param name="lookupInputSuggestSize" value="40" />/>
							<ui:param name="lookupReRender" value="Gantt_project" />
							<aon:methodParam name="lookupChangeListener"
								value="#{gantt.onRegistryChanged}" type="lookupChangeListener" />
						</ui:include>
						
						<aon:outputLabel for="Gantt_project" value="#{bundle.aon_name}"/>
						<aon:selectOneMenu id="Gantt_project" value="#{gantt.project}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{gantt.projects}" />
							<a4j:support event="onchange"
								actionListener="#{gantt.onChangeProject}"
								reRender="lookupRegistry, Gantt_project"
								ajaxSingle="true" />
						</aon:selectOneMenu>
					</aon:panelGrid>


					<aon:outputText value="#{bundle.aon_status}"/>
					<aon:div>
						<aon:selectBooleanCheckbox id="st0" value="#{gantt.statusPending}" />
						<aon:outputLabel for="st0" value="#{bundle.aon_pending}" />
						
						<aon:selectBooleanCheckbox id="st1" value="#{gantt.statusInProgress}" />
						<aon:outputLabel for="st1" value="#{bundle.groupware_in_progress}" />
						
						<aon:selectBooleanCheckbox id="st2" value="#{gantt.statusFinished}" />
						<aon:outputLabel for="st2" value="#{bundle.groupware_finished}" />
						
						<aon:commandButton
							style="margin-left: 20px; padding: 5px 0px 0px 20px !important;background-position: 5px 2px;"
							styleClass="aon-commandButton aon-icon-statistics"
							value="#{bundle.aon_see}"
							actionListener="#{gantt.onShowDiagram}">
							<aon:actionHotKey key="return" />
						</aon:commandButton>
					</aon:div>
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-width-all aon-text-center">
				<a4j:mediaOutput
					rendered="#{gantt.diagramVisible}"
					element="img" cacheable="false" session="false"
					createContent="#{gantt.paintGanttChart}" 
					mimeType="image/jpeg">
					<!-- Se agrega este param para que no cachee el resultado -->
					<f:param name="value" value="#{gantt.lastModified}" />
				</a4j:mediaOutput>
			</aon:div>
			
		</aon:form>
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
	</ui:define>
</ui:composition>
