<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{taskHolderWorkgroup}" />

		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto"
				alias="TaskHolderWorkgroup.workGroup.description" >
				<f:facet name="header">
					<aon:outputLabel for="TaskHolderWorkgroup_workGroup" value="#{bundle.aon_group}" />
				</f:facet>
				
				<aon:outputText value="#{to.workGroup.description}" rendered="#{formList}" />
				<aon:outputText styleClass="aon-margin-left" value="#{to.workGroup.status}"
					style="color:red"	
					rendered="#{formList and !to.workGroupActive}"/>
					
				<aon:selectOneMenu id="TaskHolderWorkgroup_workGroup"
					rendered="#{formEdit}" value="#{controller.to.workGroup}">
					<f:selectItems value="#{taskHolderWorkgroup.workgroups}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="TaskHolderWorkgroup_workGroup-New"
						rendered="#{formNew}" value="#{controller.to.workGroup}">
						<f:selectItems value="#{taskHolderWorkgroup.workgroups}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
			
		</ui:define>
	</ui:decorate>

</ui:composition>
