<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/com/code/aon/ui/groupware/facelet/processLauncher/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{groupwareBundle.groupware_process_wizard_step2}" />
	</ui:define>

	<ui:define name="step_content">

		<aon:panelGrid columns="4" dir="true" style="width: 90%;"
			columnClasses="aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-250
						,aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-auto">
						
			<aon:outputText value="#{bundle.aon_process}" />
			<aon:outputText value="#{processWizard.process.description}" />

			<aon:outputText value="#{bundle.aon_description}" />
			<aon:outputText value="#{processWizard.description}" />

			<aon:outputText value="#{bundle.aon_start_date}" />
			<aon:outputText value="#{processWizard.startDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>

			<aon:outputText value="#{bundle.aon_end_date}" />
			<aon:outputText value="#{processWizard.endDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>

			<aon:outputText value="#{bundle.aon_supervisor}" />
			<aon:outputText value="#{processWizard.workGroup.description}" />

			<aon:outputText value="#{groupwareBundle.groupware_campaign_type}" />
			<aon:outputText value="#{processWizard.type.description}" />
		</aon:panelGrid>
		
		<aon:panelTabSet id="projectTab">
			<aon:panelTab id="existingProject" label="#{groupwareBundle.groupware_process_wizard_add_project}" immediate="true">

				<aon:div id="existingContainer">
					<aon:panelGrid columns="2" dir="true" style="margin: 5px;width: 95%;">
	
						<aon:outputText value="#{bundle.aon_project}"/>
						<aon:panelGrid columns="2" style="width: 95%;"
							columnClasses="aon-panelGrid-even aon-italic aon-width-100,aon-panelGrid-even aon-width-auto">
							
							<aon:outputLabel for="Registry_id" value="#{projectBundle.project_assigned}"/>
							<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
								<ui:param name="lookupTo" value="#{processWizard.registry}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupInputSuggestSize" value="45" />
								<ui:param name="lookupReRender" value="processWizard_project" />
								<aon:methodParam name="lookupChangeListener" value="#{processWizard.registryChanged}" type="lookupChangeListener" />
							</ui:include>
							
							<aon:outputLabel for="processWizard_project" value="#{bundle.aon_name}"/>
							<aon:selectOneMenu id="processWizard_project"
								value="#{processWizard.project}"
								reRender="registryIdExContainer,processWizard_project"
								valueChangeListener="#{processWizard.projectChanged}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{processWizard.availableProjects}" />
							</aon:selectOneMenu>
						</aon:panelGrid>

						<aon:outputLabel for="processWizard_type" value="#{projectBundle.project_project_type}"/>
						<aon:selectOneMenu id="processWizard_type"
							reRender="processWizard_activityType"
							value="#{processWizard.projectType}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{projectCollections.projectTypes}" />
						</aon:selectOneMenu>
				
						<aon:outputLabel for="processWizard_activityType" value="#{projectBundle.project_activity_type}"/>
						<aon:selectOneMenu id="processWizard_activityType"
							value="#{processWizard.activityType}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{processWizard.availableActivityTypes}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="processWizard_projectName" value="#{bundle.aon_project}" />
						<aon:div>
							<aon:inputText id="processWizard_projectName" size="40"
								value="#{processWizard.projectName}" maxlength="64" />
							<aon:commandButton value="#{groupwareBundle.groupware_add_project_list}"
								actionListener="#{processWizard.addExistingProject}"
								focus="Registry_id" 
								styleClass="aon-commandButton aon-margin-left"
								reRender="existingContainer, projectsTable" />
						</aon:div>

					</aon:panelGrid>
				</aon:div>
		 	</aon:panelTab>

			<aon:panelTab id="newProject" label="#{groupwareBundle.groupware_process_wizard_add_new_project}" immediate="true">

				<aon:div id="newContainer">
					<aon:panelGrid columns="2" dir="true" style="margin: 5px;width: 95%;">
	
						<aon:outputLabel for="Registry_id-New" value="#{projectBundle.project_assigned}"/>
						<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
							<ui:param name="lookupTo" value="#{processWizard.registry}" />
							<ui:param name="lookupSuffix" value="-New" />
							<ui:param name="skipLabel" value="#{true}" />
							<aon:methodParam name="lookupChangeListener" value="#{processWizard.registryChanged}" type="lookupChangeListener" />
						</ui:include>
							
						<aon:outputLabel for="processWizard_type-New" value="#{projectBundle.project_project_type}"/>
						<aon:selectOneMenu id="processWizard_type-New"
							value="#{processWizard.projectType}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{projectCollections.projectTypes}" />
						</aon:selectOneMenu>
	
						<aon:outputLabel for="processWizard_projectName-New" value="#{bundle.aon_project}" />
						<aon:inputText id="processWizard_projectName-New" size="40"
							value="#{processWizard.projectName}" maxlength="64" />
							
						<aon:outputText value="&#160;" />
						<aon:commandButton value="#{groupwareBundle.groupware_process_wizard_add_project}"
							actionListener="#{processWizard.addNewProject}"
							focus="Customer_IdNew"
							styleClass="aon-commandButton aon-icon-new"
							reRender="newContainer, projectsTable" />
					</aon:panelGrid>
				</aon:div>
		 	</aon:panelTab>
		</aon:panelTabSet>
 
		<aon:div id="projectsTable" style="margin-top: 5px;width: 90%;">
			<aon:dataTable id="projectDataList"
				value="#{processWizard.projectsModel}" var="to">
				
				<aon:column styleClass="aon-width-40">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:outputText value="&#160;"
						style="padding-left: 20px;"
					    styleClass="aon-icon-new-page"
					    title="#{groupwareBundle.groupware_process_wizard_new_project_added}"
					    alt="#{groupwareBundle.groupware_process_wizard_new_project_added}"
						rendered="#{to.project.id==null}" />
					<aon:outputText value="&#160;"
						style="padding-left: 20px;"
					    styleClass="aon-icon-page"
					    title="#{groupwareBundle.groupware_process_wizard_project_added}"
					    alt="#{groupwareBundle.groupware_process_wizard_project_added}"
						rendered="#{to.project.id!=null}" />
				</aon:column>

				<aon:column styleClass="aon-width-200">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_project}" />
					</f:facet>
					<aon:outputText value="#{to.project.name}" />
				</aon:column>
				
				<aon:column styleClass="aon-width-auto">
					<f:facet name="header">
						<aon:outputText value="#{projectBundle.project_assigned}" />
					</f:facet>
					<aon:outputText value="#{to.project.registry.fullName}" />
				</aon:column>
				
				<aon:column styleClass="aon-width-150">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_type}" />
					</f:facet>
					<aon:outputText value="#{to.project.projectType.description}" />
				</aon:column>
				
				<aon:column styleClass="aon-width-40">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:commandButton title="#{bundle.aon_remove}"
						actionListener="#{processWizard.removeProject}"
						immediate="#{true}" reRender="projectsTable"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
						styleClass="aon-editDataTable-button aon-icon-delete" />
				</aon:column>

			</aon:dataTable>
			<aon:dataScroller2 for="projectDataList" showNote="true" />
		</aon:div>
	</ui:define>
	
	<ui:define name="after_form">
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
	</ui:define>
</ui:composition>
