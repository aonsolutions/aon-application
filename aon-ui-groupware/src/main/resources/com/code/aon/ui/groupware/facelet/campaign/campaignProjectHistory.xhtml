<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">


	<ui:define name="content">
		<aon:form id="processTaskForm" styleClass="aon-form">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{groupwareBundle.groupware_campaign_monitor} >> #{groupwareBundle.groupware_task_view}" />
				<ui:param name="controller" value="#{processTask}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="cancel" value="#{bundle.aon_back}"
						actionListener="#{processTask.onCancel}"
						action="campaign_form" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>
		
			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="dataTable" columns="2" style="width: 90%;">
					<aon:outputText value="#{groupwareBundle.groupware_campaign}" />
					<aon:outputText value="#{campaign.to.description}"/>

					<aon:outputText value="#{projectBundle.project_project}" />
					<aon:div>
						<aon:outputText value="#{processTask.campaignProjectExtended.campaignProject.project.name}"/>
						<aon:outputText value=" - "/>
						<aon:outputText value="#{processTask.campaignProjectExtended.campaignProject.project.registry.fullName}" />						
					</aon:div>
				</aon:panelGrid>


				<aon:div styleClass="aon-form-group">
					<aon:div styleClass="aon-form-group-title">
						<aon:outputText value="#{groupwareBundle.groupware_task_details}" />
					</aon:div>
					<aon:div styleClass="aon-form-group-body">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{processTask}" />
						<ui:define name="columns">
								<aon:column alias="ProcessTask.task.description" styleClass="aon-width-200">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_description}" />
									</f:facet>
									<aon:outputText value="#{to.task.description}" />
								</aon:column>
	
								<aon:column styleClass="aon-editDataTable-iconColumn">
									<f:facet name="header">
										<aon:outputText value="C" />
									</f:facet>
									<aon:div style="display:inline;cursor:pointer;"
										rendered="#{to.task.commentsNotEmpty}">
										<aon:outputText value="&#160;" style="padding-left:15px;"
											styleClass="aon-icon-comment" />
										<rich:toolTip value="#{to.task.comments}" showEvent="onclick"
											style="width: 400px;" hideDelay="2000">
											<f:facet name="defaultContent">
												<aon:outputText value="#{bundle.aon_in_progress}" />
											</f:facet>
										</rich:toolTip>
									</aon:div>
								</aon:column>
	
								<aon:column alias="ProcessTask.task.startDate" styleClass="aon-width-80"> 
									<f:facet name="header">
										<aon:outputText value="#{groupwareBundle.groupware_initial_date}" />
									</f:facet>
									<aon:outputText value="#{to.task.startDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
								</aon:column>
	
								<aon:column alias="ProcessTask.task.endDate" styleClass="aon-width-80">
									<f:facet name="header">
										<aon:outputText value="#{groupwareBundle.groupware_final_date}" />
									</f:facet>
									<aon:outputText value="#{to.task.endDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
								</aon:column>
	
								<aon:column alias="ProcessTask.task.dueDate" styleClass="aon-width-80">
									<f:facet name="header">
										<aon:outputText value="#{groupwareBundle.groupware_due_date}" />
									</f:facet>
									<aon:outputText value="#{to.task.dueDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
								</aon:column>
	
								<aon:column alias="ProcessTask.task.status" styleClass="aon-width-40">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_status}" />
									</f:facet>
									<aon:div id="task_status">
										<aon:outputText value="&#160;" rendered="#{to.task.pending}"
											alt="#{bundle.aon_pending}" title="#{bundle.aon_pending}"/>
										<aon:outputText value="&#160;" rendered="#{to.task.inProgress}"
											alt="#{groupwareBundle.groupware_in_progress}" title="#{groupwareBundle.groupware_in_progress}"
											style="padding-left:15px;" styleClass="aon-icon-point-green" />
										<aon:outputText value="&#160;" rendered="#{to.task.deleted}"
											alt="#{groupwareBundle.groupware_deleted}" title="#{groupwareBundle.groupware_deleted}"
											style="padding-left:15px;"  styleClass="aon-icon-point-red" />
										<aon:outputText value="&#160;" rendered="#{to.task.finished}"
											alt="#{groupwareBundle.groupware_finished}" title="#{groupwareBundle.groupware_finished}"
											style="padding-left:15px;"  styleClass="aon-icon-predetermine" />
									</aon:div>
								</aon:column>
	
								<aon:column styleClass="aon-width-200">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_group}" />
									</f:facet>
									<aon:outputText value="#{to.task.workGroup.description}" />
								</aon:column>
	
								<aon:column styleClass="aon-width-auto">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_login_user}" />
									</f:facet>
									<aon:outputText value="#{to.task.taskHolder.registry.fullName}" />
								</aon:column>
						</ui:define>
					</ui:decorate>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
