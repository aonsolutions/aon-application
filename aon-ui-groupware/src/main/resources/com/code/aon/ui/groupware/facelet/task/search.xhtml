<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="taskForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarID" value="toolbar" />
				<ui:param name="toolbarTitle" value="#{groupwareBundle.groupware_task_inbox}"/>
				<ui:param name="controller" value="#{task}" />
				<ui:define name="additionalToolbarContent">
						<aon:selectBooleanCheckbox id="monitor" value="#{task.monitor}" 
						rendered="#{aonRole.taskMonitor}">
							<a4j:support event="onclick" reRender="toolbar,taskForm" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="monitor" value="Monitor" rendered="#{aonRole.taskMonitor}"/>
				</ui:define>
			</ui:decorate>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">

				<ui:param name="controller" value="#{task}" />
				<ui:param name="skipAfterSearch" value="#{true}" />

				<ui:define name="searchContent">

					<aon:outputLabel for="Task_description" value="#{bundle.aon_description}" />
					<aon:inputText id="Task_description" size="60"
						valueChangeListener="#{controller.addExpression}" />
					
					<aon:outputLabel value="#{groupwareBundle.groupware_initial_date}" />
					<aon:div>
						<aon:outputLabel for="Task_startDate-From"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="Task_startDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true" />

						<aon:outputLabel for="Task_startDate-To"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="Task_startDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true" />
					</aon:div>

					<aon:outputLabel value="#{groupwareBundle.groupware_final_date}" />
					<aon:div>
						<aon:outputLabel for="Task_endDate-From"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="Task_endDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>

						<aon:outputLabel for="Task_endDate-To"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="Task_endDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
					</aon:div>

					<aon:outputLabel value="#{groupwareBundle.groupware_due_date}" />
					<aon:div>
						<aon:outputLabel for="Task_dueDate-From"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="Task_dueDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
						
						<aon:outputLabel for="Task_dueDate-To"
							styleClass="aon-form-date-label aon-margin-left aon-margin-right"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="Task_dueDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
					</aon:div>

					<aon:outputLabel for="workgroup" rendered="#{task.monitor}" 
						value="#{groupwareBundle.groupware_group}" />
					<aon:selectOneMenu id="workgroup" rendered="#{task.monitor}"
						disabled="#{taskSearchControllerListener.taskHolder != null}"
						reRender="workgroup,user"
						value="#{taskSearchControllerListener.workGroup}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.workgroups}" />
						<a4j:support event="onchange" reRender="user" ajaxSingle="true" />
					</aon:selectOneMenu>

					<aon:outputText rendered="#{task.monitor}" 
						value="#{groupwareBundle.groupware_user}" />
					<aon:div id="user" rendered="#{task.monitor}">
						<aon:selectOneMenu rendered="#{taskSearchControllerListener.workGroup == null}"
							value="#{taskSearchControllerListener.taskHolder}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{groupWareCollections.taskHolders}" />
							<a4j:support event="onchange" reRender="workgroup" ajaxSingle="true" />
						</aon:selectOneMenu>
						<aon:selectOneMenu rendered="#{taskSearchControllerListener.workGroup != null}"
							value="#{taskSearchControllerListener.taskHolder}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{taskSearchControllerListener.taskHolderWorkgroups}" />
							<a4j:support event="onchange" reRender="workgroup" ajaxSingle="true" />
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputLabel for="Task_project" value="#{projectBundle.project_project}"/>
					<aon:panelGrid columns="2"
						columnClasses="aon-panelGrid-even aon-italic aon-width-100,aon-panelGrid-even aon-width-auto">
					
						<aon:outputLabel for="Registry_id" value="#{projectBundle.project_assigned}"/>
						<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
							<ui:param name="lookupTo" value="#{taskSearchControllerListener.registry}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupReRender" value="Task_project, Task_activityType" />
							<aon:methodParam name="lookupChangeListener"
								value="#{taskSearchControllerListener.onRegistryChanged}" type="lookupChangeListener" />
						</ui:include>
						
						<aon:outputLabel for="Task_project" value="#{bundle.aon_name}"/>
						<aon:selectOneMenu id="Task_project" value="#{taskSearchControllerListener.project}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{taskSearchControllerListener.projects}" />
							<a4j:support event="onchange"
								actionListener="#{taskSearchControllerListener.onChangeProject}"
								reRender="lookupRegistry, Task_project, Task_activityType"
								ajaxSingle="true" />
						</aon:selectOneMenu>
						
						<aon:outputLabel for="Task_activityType" value="#{projectBundle.project_activity_type}"/>
						<aon:selectOneMenu id="Task_activityType"
							value="#{taskSearchControllerListener.activityType}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{taskSearchControllerListener.activityTypes}" />
						</aon:selectOneMenu>
					</aon:panelGrid>

					<aon:outputText value=""/>
					<aon:div>
						<aon:selectBooleanCheckbox id="Task_source" value="#{taskSearchControllerListener.processTask}" />
						<aon:outputLabel for="Task_source" value="#{groupwareBundle.groupware_task_source}" />
					</aon:div>

					<aon:outputText value="#{bundle.aon_status}"/>
					<aon:div>
						<aon:selectBooleanCheckbox id="st0" value="#{taskSearchControllerListener.statusPending}" />
						<aon:outputLabel for="st0" value="#{groupwareBundle.groupware_pending}" />
						
						<aon:selectBooleanCheckbox id="st1" value="#{taskSearchControllerListener.statusInProgress}" />
						<aon:outputLabel for="st1" value="#{groupwareBundle.groupware_in_progress}" />
						
						<aon:selectBooleanCheckbox id="st2" value="#{taskSearchControllerListener.statusFinished}" />
						<aon:outputLabel for="st2" value="#{groupwareBundle.groupware_finished}" />
						
						<aon:selectBooleanCheckbox id="st3" value="#{taskSearchControllerListener.statusDeleted}" />
						<aon:outputLabel for="st3" value="#{groupwareBundle.groupware_deleted}" />
					</aon:div>
					
					<aon:outputText value="#{groupwareBundle.alarm_priority}"/>
					<aon:div>
						<aon:selectBooleanCheckbox id="pr0" value="#{taskSearchControllerListener.highPriority}" />
						<aon:outputLabel for="pr0" value="#{groupwareBundle.groupware_high}" />
						
						<aon:selectBooleanCheckbox id="pr1" value="#{taskSearchControllerListener.normalPriority}" />
						<aon:outputLabel for="pr1" value="#{groupwareBundle.groupware_normal}" />
						
						<aon:selectBooleanCheckbox id="pr2" value="#{taskSearchControllerListener.lowPriority}" />
						<aon:outputLabel for="pr2" value="#{groupwareBundle.groupware_low}" />
						
						<aon:selectBooleanCheckbox id="pr3" value="#{taskSearchControllerListener.nonePriority}" />
						<aon:outputLabel for="pr3" value="#{groupwareBundle.groupware_none}" />
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
	</ui:define>
</ui:composition>
