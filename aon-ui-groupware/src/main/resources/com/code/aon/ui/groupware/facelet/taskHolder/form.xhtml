<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="taskHolderForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{groupwareBundle.groupware_taskHolders}" />
				<ui:param name="controller" value="#{taskHolder}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" width="100%" columns="2">
					
					<ui:include src="/com/code/aon/ui/registry/facelet/registry/formContent.xhtml">
						<ui:param name="skipId" value="#{true}" />
						<ui:param name="skipRegistryType" value="#{true}" />
						<ui:param name="controller" value="#{taskHolder}" />
					</ui:include>					
					
					<aon:outputLabel for="TaskHolder_user" value="#{groupwareBundle.groupware_access_user}"/>
					<aon:selectOneMenu id="TaskHolder_user"
						value="#{taskHolder.to.user}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{taskHolder.users}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="TaskHolder_costProfile" value="#{groupwareBundle.groupware_cost_profile}"/>
					<aon:selectOneMenu id="TaskHolder_costProfile"
						value="#{taskHolder.to.costProfile}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{groupWareCollections.costProfiles}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="TaskHolder_type" value="#{bundle.aon_type}"/>
					<aon:selectOneMenu id="TaskHolder_type"
						value="#{taskHolder.to.type}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{groupWareCollections.taskHolderTypes}" />
					</aon:selectOneMenu>

					<aon:outputText value="&#160;"/>
					<aon:div>
						<aon:selectBooleanCheckbox id="TaskHolder_active"
							styleClass="aon-margin-left" value="#{taskHolder.to.active}" />
						<aon:outputLabel for="TaskHolder_active" value="#{bundle.aon_active}" />
					</aon:div>

				</aon:panelGrid>
				
				<c:if test="#{!taskHolder.new}">
					<aon:div styleClass="aon-margin-top">
						<ui:include src="/com/code/aon/ui/groupware/facelet/taskHolder/workgroups.xhtml" />
					</aon:div>
				</c:if>
				
 			</aon:div>
 		</aon:form>
	</ui:define>
	<aon:lookupButtonPopup lookup="#{registryLookup}" />
</ui:composition>
