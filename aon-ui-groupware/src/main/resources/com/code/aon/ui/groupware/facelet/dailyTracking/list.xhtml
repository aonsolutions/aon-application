<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="dailyTrackingForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarID" value="toolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.aon_daily_tracking_module}" />
				<ui:param name="controller" value="#{dailyTracking}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:selectBooleanCheckbox id="monitor" value="#{dailyTracking.monitor}"
						rendered="#{aonRole.taskMonitor}">
						<a4j:support event="onclick" ajaxSingle="true" reRender="dailyTrackingForm" />
					</aon:selectBooleanCheckbox>
					<aon:outputLabel for="monitor" value="Monitor" rendered="#{aonRole.taskMonitor}" />
				</ui:define>>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{dailyTracking}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-text" alias="DailyTracking.trackingDate">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.trackingDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-iconColumn" alias="DailyTracking.comments">
							<f:facet name="header">
								<aon:outputText value="C" />
							</f:facet>
							<aon:div onmouseout="enableRowSelector();"
								onmouseover="disableRowSelector();" 
								onmouseup="disableRowSelector();"
								style="display:inline;cursor:pointer;"
								rendered="#{to.comments != null and to.comments!=''	}">
								<aon:outputText value="&#160;" 
									style="padding-left:15px;" styleClass="aon-icon-comment"/>
								<rich:toolTip value="#{to.comments}" showEvent="onclick"
									hideDelay="2000">
									<f:facet name="defaultContent">
										<aon:outputText value="#{bundle.finance_invoicing_wait}" />
									</f:facet>
								</rich:toolTip>
							</aon:div>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-text" alias="DailyTracking.taskHolder.registry.name"
							rendered="#{dailyTracking.monitor}">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_login_user}" />
							</f:facet>
							<aon:outputText value="#{to.taskHolder.registry.fullName}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-text" alias="DailyTracking.project&lt;name">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_project}" />
							</f:facet>
							<aon:outputText value="#{to.project.name}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-text" alias="DailyTracking.activityType&lt;description">
							<f:facet name="header">
								<aon:outputText
									value="#{bundle.project_activity_type}" />
							</f:facet>
							<aon:outputText value="#{to.activityType.description}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-text" alias="DailyTracking.jobType.description">
							<f:facet name="header">
								<aon:outputText
									value="#{bundle.groupware_job_type}" />
							</f:facet>
							<aon:outputText value="#{to.jobType.description}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-text" alias="DailyTracking.registry.name">
							<f:facet name="header">
								<aon:outputText value="#{bundle.project_assigned}" />
							</f:facet>
							<aon:outputText value="#{to.registry.fullName}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-number" alias="DailyTracking.trackingDuration">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_duration}" />
							</f:facet>
							<aon:outputText value="#{to.trackingDuration}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
