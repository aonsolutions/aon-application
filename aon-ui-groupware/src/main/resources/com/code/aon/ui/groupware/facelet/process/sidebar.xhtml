<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

		<aon:div id="detailContainer" style="width: 90%; height: 100%; margin-left: 20px;">
		
			<aon:dataTable var="to" value="#{processDetail.model}" >
				<aon:column styleClass="aon-editDataTable-iconColumn aon-width-30">
					<f:facet name="header">
						<aon:outputText value="&#160;" />	
					</f:facet>
					<aon:commandButton ajaxSingle="true"
						styleClass="aon-icon-commandButton aon-icon-rowSelector"
						actionListener="#{processDetail.onSelect}">
					</aon:commandButton>
					<f:facet name="footer">
						<aon:commandButton value="&#160;"
							styleClass="aon-editDataTable-button aon-icon-new"
							style="padding:0px;margin:0px;padding-left:5px;"
							actionListener="#{processDetail.onReset}"
							rendered="#{!processDetail.new}"
							accesskey="#{bundle.aon_key_new_line}">
						</aon:commandButton>
					</f:facet>
				</aon:column>
				
				<aon:column styleClass="aon-editDataTable-iconColumn">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:div styleClass="aon-nowrap">
						<aon:commandButton value="&#160;"
							styleClass="aon-editDataTable-button aon-icon-up"
							style="padding:0px;margin:0px;padding-left:5px;"
							actionListener="#{processDetail.onMoveUp}">
						</aon:commandButton>
						<aon:commandButton value="&#160;"
							styleClass="aon-editDataTable-button aon-icon-down"
							style="padding:0px;margin:0px;padding-left:5px;"
							disabled="#{to.position == (processDetail.model.rowCount+1)}"
							actionListener="#{processDetail.onMoveDown}">
						</aon:commandButton>
					</aon:div>
					<f:facet name="footer">
						<aon:outputText value="&#160;" />
					</f:facet>
				</aon:column>

				<aon:column styleClass="aon-width-auto">
					<f:facet name="header">
						<aon:outputText value="#{groupwareBundle.groupware_process_details}" />	
					</f:facet>
					<aon:div styleClass="aon-nowrap" 
						style="#{to.id == processDetail.to.id?'font-weight:bold;':''}#{to.active?'':'text-decoration:line-through'}">
							   
						<aon:outputText value="#{to.position}" />
						<aon:outputText value=" - " />
						<aon:outputText value="#{to.description}" >
							<aon:abbreviateConverter maxWidth="30" />
						</aon:outputText>
					</aon:div>					
				</aon:column>
			</aon:dataTable>
				
		</aon:div>

</ui:composition>
