<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="taskForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarID" value="toolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.groupware_task_inbox}"/>
				<ui:param name="controller" value="#{task}" />
				<ui:param name="skipSaveButton" value="#{true}" />
				<ui:param name="skipRemoveButton" value="#{true}" />
				<ui:param name="skipResetButton" value="#{task.parentDomain}" />
				
				<ui:define name="beforeToolbarContent">
					<aon:commandButton id="toolbar-save"
						value="#{bundle.aon_save}" 
						rendered="#{task.to!=null or task.nevv}"
						disabled="#{task.to.finished or task.to.deleted}"
						actionListener="#{task.saveTask}" 
						action="task_list"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}" />
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						rendered="#{!task.nevv}"
						disabled="#{task.to.sourceProcess or task.to.finished or task.to.deleted}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
						actionListener="#{task.onRemove}" action="task_list"
						accesskey="#{bundle.aon_key_remove}" />
				</ui:define>

				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="startTask" value="#{bundle.groupware_task_start}"
						actionListener="#{task.onStartTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-start"
						rendered="#{!task.monitor and !task.nevv and task.myTask and task.to.pending}" />
					<aon:commandButton id="stopTask" value="#{bundle.groupware_task_stop}"
						actionListener="#{task.onStopTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-stop"
						rendered="#{!task.monitor and task.myTask and task.to.inProgress}" />
					<aon:commandButton id="reopenTask" value="#{bundle.groupware_task_reopen}"
						actionListener="#{task.onReopenTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-reopen"
						rendered="#{(task.monitor or task.myTask) and !task.to.sourceProcess and task.to.finished}" />
					<aon:commandButton id="assumeTask" value="#{bundle.groupware_task_assume}"
						actionListener="#{task.onAssumeTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-assume"
						rendered="#{!task.monitor and !task.nevv and task.to.unassigned}" />
					<aon:commandButton id="releaseTask" value="#{bundle.groupware_task_release}"
						actionListener="#{task.onReleaseTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-liberate"
						rendered="#{!task.monitor and !task.nevv and task.myTask and !task.to.finished and !task.to.deleted and !task.to.inProgress}" />
					<aon:commandButton id="finishTask" value="#{bundle.groupware_task_finish}" 
						actionListener="#{task.onFinishTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-finish"
						rendered="#{!task.monitor and !task.nevv and !task.to.finished and !task.to.deleted}" />
					<ui:include	src="/com/code/aon/ui/common/facelet/auditable/toolbarContent.xhtml" />	
				</ui:define>
				
				<ui:define name="additionalToolbarContent">
					<aon:selectBooleanCheckbox id="monitor" value="#{task.monitor}"
						rendered="#{!task.parentDomain and aonRole.taskMonitor}">
						<a4j:support event="onclick" reRender="toolbar,taskForm" ajaxSingle="true"/>
					</aon:selectBooleanCheckbox>
					<aon:outputLabel for="monitor" value="Monitor"
						rendered="#{!task.parentDomain and aonRole.taskMonitor}" />
				</ui:define>
			</ui:decorate>

			<aon:div id="fieldContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true" style="width: 90%;">
					<aon:outputLabel for="Task_descripcion"
						value="#{bundle.aon_description}" />
					<aon:div>
						<aon:inputText id="Task_descripcion" required="true" size="60"
							maxlength="128" value="#{task.to.description}"
							disabled="#{!task.monitor and !task.nevv}" />
						<aon:outputText value="#{task.to.source}"
							style="margin-left: 50px;" 
							/>		
					</aon:div>
					
					<aon:outputText value=""
						rendered="#{task.to.processCommentsNotEmpty}"/>
					<aon:panel style="background-color:#f6f5e3; padding: 0px; margin-bottom: 5px;"
						rendered="#{task.to.processCommentsNotEmpty}">
						<aon:outputText value="#{task.to.processComments}"
							style="margin-left: 50px;" 
							/>		
					</aon:panel>
						
					<aon:outputLabel for="Task_startDate"
						value="#{bundle.aon_start_date}" />
					<aon:selectInputDate id="Task_startDate"
						value="#{task.to.startDate}" renderAsPopup="true"
						enableManualInput="true"
						popupDateFormat="#{bundle.aon_date_pattern}"
						disabled="#{!task.nevv and !task.monitor}">
					</aon:selectInputDate>

					<aon:outputLabel for="Task_endDate"
						value="#{bundle.aon_end_date}"
						rendered="#{task.to.finished or task.to.deleted}" />
					<aon:selectInputDate id="Task_endDate" value="#{task.to.endDate}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}"
						enableManualInput="true" disabled="true"
						rendered="#{task.to.finished or task.to.deleted}">
					</aon:selectInputDate>

					<aon:outputLabel for="Task_dueDate"
						value="#{bundle.groupware_due_date}" />
					<aon:selectInputDate id="Task_dueDate" required="true"
						renderAsPopup="true" value="#{task.to.dueDate}"
						enableManualInput="true"
						popupDateFormat="#{bundle.aon_date_pattern}"
						disabled="#{!task.monitor and !task.nevv and !task.to.finished and !task.to.deleted}">
					</aon:selectInputDate>

					<aon:outputLabel for="Task_priority"
						rendered="#{task.monitor or task.nevv}"
						value="#{bundle.aon_priority}" />
					<aon:selectOneMenu id="Task_priority" value="#{task.to.priority}"
						rendered="#{task.monitor or task.nevv}">
						<f:selectItems value="#{groupWareCollections.priorities}" />
					</aon:selectOneMenu>
					<aon:outputText value="#{bundle.aon_priority}"
						rendered="#{!task.monitor and !task.nevv}" />
					<aon:inputText value="#{task.to.priority}" size="10"
						disabled="true" rendered="#{!task.monitor and !task.nevv}" />

					<aon:outputLabel for="Task_period"
						rendered="#{!task.to.sourceProcess}"
						value="#{bundle.groupware_task_period}" />
					<aon:selectOneMenu id="Task_period" value="#{task.to.repeatPeriod}"
						rendered="#{!task.to.sourceProcess}">
						<f:selectItems value="#{groupWareCollections.taskPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Task_status" value="#{bundle.aon_status}"
						rendered="#{!task.nevv}" />
					<aon:inputText id="Task_status" value="#{task.to.status}" size="60"
						disabled="true" rendered="#{!task.nevv}" />

					<aon:outputLabel for="Task_workgroup"
						 value="#{bundle.aon_group}" />
					<aon:outputText rendered="#{task.parentDomain}" 
						value="#{task.to.workGroup.description}"/>
					<aon:div id="workgroup" rendered="#{!task.parentDomain}">						
						<aon:selectOneMenu id="Task_workgroup"
							disabled="#{!task.monitor and !task.nevv}"
							reRender="workgroup,user"
							value="#{task.to.workGroup}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{task.workgroups}" />
							<a4j:support event="onchange" reRender="user" ajaxSingle="true" />
						</aon:selectOneMenu>
						<aon:selectBooleanCheckbox id="allMembers"
							value="#{task.allMembers}" rendered="#{task.nevv}">
							<a4j:support event="onclick"
								actionListener="#{task.allMembersChanged}" ajaxSingle="true"
								reRender="user" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="allMembers"
							value="#{bundle.groupware_task_all_members}" rendered="#{task.nevv}" />
					</aon:div>

					<aon:outputText value="#{bundle.aon_login_user}" />
					<aon:outputText rendered="#{task.parentDomain}" 
						value="#{task.to.taskHolder.user.name}"/>
					<aon:div id="user" rendered="#{!task.parentDomain}">
						<aon:selectOneMenu
							disabled="#{task.allMembers or (!task.monitor and !task.nevv)}" 
							rendered="#{task.to.workGroup.id == null}"
							value="#{task.to.taskHolder}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{groupWareCollections.taskHolders}" />
							<a4j:support event="onchange" reRender="workgroup" ajaxSingle="true" />
						</aon:selectOneMenu>
						<aon:selectOneMenu disabled="#{task.allMembers or (!task.monitor and !task.nevv)}"
							rendered="#{task.to.workGroup.id != null}"
							value="#{task.to.taskHolder}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{task.taskHolderWorkgroups}" />
							<a4j:support event="onchange" reRender="workgroup" ajaxSingle="true" />
						</aon:selectOneMenu>
					</aon:div>
					

					<aon:outputLabel for="Task_project" value="#{bundle.aon_project}"/>
					<aon:panelGrid columns="2" styleClass="aon-width-all"
						columnClasses="aon-panelGrid-even aon-italic aon-width-100,aon-panelGrid-even aon-width-auto">
					
						<aon:outputLabel for="Registry_id" value="#{bundle.project_assigned}"/>
						<aon:div>
							<aon:outputText rendered="#{task.parentDomain}" value="#{task.to.registry.fullName}"/>
							<aon:div rendered="#{!task.parentDomain}">
								<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
									<ui:param name="lookupTo" value="#{task.to.registry}" />
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="lookupReRender" value="Task_project, Task_activityType" />
									<aon:methodParam name="lookupChangeListener"
										value="#{task.onRegistryChanged}" type="lookupChangeListener" />
								</ui:include>
							</aon:div>
						</aon:div>
						
						<aon:outputText value="#{bundle.aon_name}"/>
						<aon:div>
							<aon:outputText rendered="#{task.parentDomain}" value="#{task.to.project.name}"/>
							<aon:selectOneMenu id="Task_project" value="#{task.to.project}"
								rendered="#{!task.parentDomain}"
								disabled="#{!task.monitor and !task.nevv}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{task.projects}" />
								<a4j:support event="onchange"
									actionListener="#{task.onChangeProject}"
									reRender="lookupRegistry, Task_project, Task_activityType"
									ajaxSingle="true" />
							</aon:selectOneMenu>
						</aon:div>
						
						<aon:outputLabel for="Task_activityType" value="#{bundle.project_activity_type}"/>
						<aon:div>
							<aon:outputText rendered="#{task.parentDomain}" value="#{task.to.activityType.description}"/>
							<aon:selectOneMenu id="Task_activityType"
								rendered="#{!task.parentDomain}"
								value="#{task.to.activityType}"
								disabled="#{!task.monitor and !task.nevv}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{task.activityTypes}" />
							</aon:selectOneMenu>
						</aon:div>
					</aon:panelGrid>

					<aon:outputLabel for="Task_sender"
						value="#{bundle.aon_sender}"
						rendered="#{task.to.sourceAssigned or task.monitor}" />
					<aon:inputText id="Task_sender" size="60"
						value="#{task.to.sender.registry.fullName}"
						rendered="#{task.to.sourceAssigned or task.monitor}"
						maxlength="50" disabled="true" />
						
					<aon:outputLabel for="Task_percent"
						value="#{bundle.aon_percentage}" rendered="#{!task.nevv}" />
					<rich:inputNumberSlider id="Task_percent"
						value="#{task.to.percent}" minValue="0" maxValue="100"
						inputPosition="left" showToolTip="false" rendered="#{!task.nevv}" />

					<aon:outputLabel for="Task_comments" value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="Task_comments" value="#{task.to.comments}"
						cols="120" rows="10"
						disabled="#{task.to.finished or task.to.deleted}" />
						
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		
		<ui:include src="/com/code/aon/ui/groupware/facelet/task/finishTaskPanel.xhtml" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
		
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{task}" />
		</ui:include>
	</ui:define>
</ui:composition>
