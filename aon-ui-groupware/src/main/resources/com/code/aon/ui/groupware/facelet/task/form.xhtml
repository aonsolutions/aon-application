<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="taskForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarID" value="toolbar" />
				<ui:param name="toolbarTitle" value="#{groupwareBundle.groupware_task_inbox}"/>
				<ui:param name="controller" value="#{task}" />
				<ui:param name="skipSaveButton" value="#{true}" />
				<ui:param name="skipRemoveButton" value="#{true}" />
				
				<ui:define name="beforeToolbarContent">
					<aon:commandButton id="toolbar-save"
						value="#{bundle.aon_save}" 
						rendered="#{task.to!=null or task.new}"
						disabled="#{task.to.finished or task.to.deleted}"
						actionListener="#{task.saveTask}" 
						action="task_list"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}" />
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						rendered="#{!task.new}"
						disabled="#{task.to.sourceProcess or task.to.finished or task.to.deleted}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
						actionListener="#{task.onRemove}" action="task_list"
						accesskey="#{bundle.aon_key_remove}" />
				</ui:define>

				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="startTask" value="#{groupwareBundle.groupware_task_start}"
						actionListener="#{task.onStartTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-start"
						rendered="#{!task.monitor and !task.new and task.myTask and task.to.pending}" />
					<aon:commandButton id="stopTask" value="#{groupwareBundle.groupware_task_stop}"
						actionListener="#{task.onStopTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-stop"
						rendered="#{!task.monitor and task.myTask and task.to.inProgress}" />
					<aon:commandButton id="reopenTask" value="#{groupwareBundle.groupware_task_reopen}"
						actionListener="#{task.onReopenTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-reopen"
						rendered="#{(task.monitor or task.myTask) and !task.to.sourceProcess and task.to.finished}" />
					<aon:commandButton id="assumeTask" value="#{groupwareBundle.groupware_task_assume}"
						actionListener="#{task.onAssumeTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-assume"
						rendered="#{!task.monitor and !task.new and task.to.unassigned}" />
					<aon:commandButton id="releaseTask" value="#{groupwareBundle.groupware_task_release}"
						actionListener="#{task.onReleaseTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-liberate"
						rendered="#{!task.monitor and !task.new and task.myTask and !task.to.finished and !task.to.deleted and !task.to.inProgress}" />
					<aon:commandButton id="finishTask" value="#{groupwareBundle.groupware_task_finish}" 
						actionListener="#{task.onFinishTask}"
						styleClass="aon-finding-toolbar-item aon-icon-task-finish"
						rendered="#{!task.monitor and !task.new and !task.to.finished and !task.to.deleted}" />
				</ui:define>
				<ui:define name="additionalToolbarContent">
					<aon:selectBooleanCheckbox id="monitor" value="#{task.monitor}"
						rendered="#{aonRole.taskMonitor}">
						<a4j:support event="onclick" reRender="toolbar,taskForm" ajaxSingle="true"/>
					</aon:selectBooleanCheckbox>
					<aon:outputLabel for="monitor" value="Monitor"
						rendered="#{aonRole.taskMonitor}" />
				</ui:define>
			</ui:decorate>

			<aon:div id="fieldContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true" style="width: 90%;">
					<aon:outputLabel for="Task_descripcion"
						value="#{bundle.aon_description}" />
					<aon:div>
						<aon:inputText id="Task_descripcion" required="true" size="60"
							maxlength="128" value="#{task.to.description}"
							disabled="#{!task.monitor and !task.new}" />
						<aon:outputText value="#{task.to.source}"
							style="margin-left: 50px;" 
							/>		
					</aon:div>
					
					<aon:outputLabel for="Task_startDate"
						value="#{groupwareBundle.groupware_initial_date}" />
					<aon:selectInputDate id="Task_startDate"
						value="#{task.to.startDate}" renderAsPopup="true"
						enableManualInput="true"
						popupDateFormat="#{bundle.aon_date_pattern}"
						disabled="#{!task.new and !task.monitor}">
					</aon:selectInputDate>

					<aon:outputLabel for="Task_endDate"
						value="#{groupwareBundle.groupware_final_date}"
						rendered="#{task.to.finished or task.to.deleted}" />
					<aon:selectInputDate id="Task_endDate" value="#{task.to.endDate}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}"
						enableManualInput="true" disabled="true"
						rendered="#{task.to.finished or task.to.deleted}">
					</aon:selectInputDate>

					<aon:outputLabel for="Task_dueDate"
						value="#{groupwareBundle.groupware_due_date}" />
					<aon:selectInputDate id="Task_dueDate" required="true"
						renderAsPopup="true" value="#{task.to.dueDate}"
						enableManualInput="true"
						popupDateFormat="#{bundle.aon_date_pattern}"
						disabled="#{!task.monitor and !task.new and !task.to.finished and !task.to.deleted}">
					</aon:selectInputDate>

					<aon:outputLabel for="Task_priority"
						rendered="#{task.monitor or task.new}"
						value="#{groupwareBundle.alarm_priority}" />
					<aon:selectOneMenu id="Task_priority" value="#{task.to.priority}"
						rendered="#{task.monitor or task.new}">
						<f:selectItems value="#{groupWareCollections.priorities}" />
					</aon:selectOneMenu>
					<aon:outputText value="#{groupwareBundle.alarm_priority}"
						rendered="#{!task.monitor and !task.new}" />
					<aon:inputText value="#{task.to.priority}" size="10"
						disabled="true" rendered="#{!task.monitor and !task.new}" />

					<aon:outputLabel for="Task_period"
						rendered="#{!task.to.sourceProcess}"
						value="#{groupwareBundle.groupware_task_period}" />
					<aon:selectOneMenu id="Task_period" value="#{task.to.repeatPeriod}"
						rendered="#{!task.to.sourceProcess}">
						<f:selectItems value="#{groupWareCollections.taskPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Task_status" value="#{bundle.aon_status}"
						rendered="#{!task.new}" />
					<aon:inputText id="Task_status" value="#{task.to.status}" size="60"
						disabled="true" rendered="#{!task.new}" />

					<aon:outputLabel for="Task_workgroup"
						 value="#{groupwareBundle.groupware_group}" />
					<aon:div id="workgroup">						
						<aon:selectOneMenu id="Task_workgroup"
							disabled="#{!task.monitor and !task.new}"
							reRender="workgroup,user"
							value="#{task.to.workGroup}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{task.workgroups}" />
							<a4j:support event="onchange" reRender="user" ajaxSingle="true" />
						</aon:selectOneMenu>
						<aon:selectBooleanCheckbox id="allMembers"
							value="#{task.allMembers}" rendered="#{task.new}">
							<a4j:support event="onclick"
								actionListener="#{task.allMembersChanged}" ajaxSingle="true"
								reRender="user" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="allMembers"
							value="#{groupwareBundle.groupware_task_all_members}" rendered="#{task.new}" />
					</aon:div>

					<aon:outputText  
						value="#{groupwareBundle.groupware_user}" />
					<aon:div id="user">
						<aon:selectOneMenu
							disabled="#{task.allMembers or (!task.monitor and !task.new)}" 
							rendered="#{task.to.workGroup.id == null}"
							value="#{task.to.taskHolder}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{groupWareCollections.taskHolders}" />
							<a4j:support event="onchange" reRender="workgroup" ajaxSingle="true" />
						</aon:selectOneMenu>
						<aon:selectOneMenu disabled="#{task.allMembers or (!task.monitor and !task.new)}"
							rendered="#{task.to.workGroup.id != null}"
							value="#{task.to.taskHolder}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{task.taskHolderWorkgroups}" />
							<a4j:support event="onchange" reRender="workgroup" ajaxSingle="true" />
						</aon:selectOneMenu>
					</aon:div>
					

					<aon:outputLabel for="Task_project" value="#{projectBundle.project_project}"/>
					<aon:panelGrid columns="2"
						columnClasses="aon-panelGrid-even aon-italic aon-width-100,aon-panelGrid-even aon-width-auto">
					
						<aon:outputLabel for="Registry_id" value="#{projectBundle.project_assigned}"/>
						<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
							<ui:param name="lookupTo" value="#{task.to.registry}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupReRender" value="Task_project, Task_activityType" />
							<aon:methodParam name="lookupChangeListener"
								value="#{task.onRegistryChanged}" type="lookupChangeListener" />
						</ui:include>
						
						<aon:outputText value="#{bundle.aon_name}"/>
						<aon:selectOneMenu id="Task_project" value="#{task.to.project}"
							disabled="#{task.allMembers or (!task.monitor and !task.new)}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{task.projects}" />
							<a4j:support event="onchange"
								actionListener="#{task.onChangeProject}"
								reRender="lookupRegistry, Task_project, Task_activityType"
								ajaxSingle="true" />
						</aon:selectOneMenu>
						
						<aon:outputLabel for="Task_activityType" value="#{projectBundle.project_activity_type}"/>
						<aon:selectOneMenu id="Task_activityType"
							value="#{task.to.activityType}"
							disabled="#{task.allMembers or (!task.monitor and !task.new)}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{task.activityTypes}" />
						</aon:selectOneMenu>
					</aon:panelGrid>

					<aon:outputLabel for="Task_sender"
						value="#{groupwareBundle.groupware_task_sender}"
						rendered="#{task.to.sourceAssigned or task.monitor}" />
					<aon:inputText id="Task_sender" size="60"
						value="#{task.to.sender.registry.fullName}"
						rendered="#{task.to.sourceAssigned or task.monitor}"
						maxlength="50" disabled="true" />
						
					<aon:outputLabel for="Task_percent"
						value="#{bundle.aon_percentage}" rendered="#{!task.new}" />
					<rich:inputNumberSlider id="Task_percent"
						value="#{task.to.percent}" minValue="0" maxValue="100"
						inputPosition="left" showToolTip="false" rendered="#{!task.new}" />

					<aon:outputLabel for="Task_comments" value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="Task_comments" value="#{task.to.comments}"
						cols="120" rows="10"
						disabled="#{task.to.finished or task.to.deleted}" />
						
<!-- 					
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox value="#{task.richEditor}">
							<a4j:support event="onclick"
								reRender="comments_label,comments_input" ajaxSingle="true" />
						</aon:selectBooleanCheckbox>
						<aon:outputText value="#{projectBundle.aon_rich_editor}" />
					</aon:div>
					<aon:div id="comments_input">
						rendered="#{!task.richEditor}"
						<aon:inputTextarea id="Task_comments" value="#{task.to.comments}"
							rendered="#{!task.richEditor}" cols="120" rows="10"
							disabled="#{task.to.finished or task.to.deleted}" />
						<rich:editor id="messageEditor"
							rendered="#{task.richEditor}"
							disabled="#{task.to.finished or task.to.deleted}" 
							value="#{task.to.comments}" 
							height="400" configuration="tinyMCE"
							language="#{facesContext.application.defaultLocale.language}" />	
					</aon:div>
 -->
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		
		<ui:include src="/com/code/aon/ui/groupware/facelet/task/finishTaskPanel.xhtml" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
	</ui:define>
</ui:composition>
