<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
    xmlns:rich="http://richfaces.org/rich">

	<aon:dataTable id="dailyTrackingDataList" value="#{projectStat.dailyTrackingPage.list}" 
		rows="#{projectStat.dailyTrackingPage.pageSize}" var="to">

		<aon:column  styleClass="aon-editDataTable-dateColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date}" />
			</f:facet>
			<aon:outputText value="#{to.trackingDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="C" />
			</f:facet>
			<aon:div style="display:inline;cursor:pointer;"
				rendered="#{to.comments != null and to.comments!=''	}">
				<aon:outputText value="&#160;" 
					style="padding-left:15px;" styleClass="aon-icon-comment"/>
				<rich:toolTip value="#{to.comments}" showEvent="onclick"
					hideDelay="2000">
					<f:facet name="defaultContent">
						<aon:outputText value="#{bundle.finance_invoicing_wait}" />
					</f:facet>
				</rich:toolTip>
			</aon:div>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_login_user}" />
			</f:facet>
			<aon:outputText value="#{to.taskHolderName}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText
					value="#{bundle.groupware_job_type}" />
			</f:facet>
			<aon:outputText value="#{to.jobDescription}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.project_assigned}" />
			</f:facet>
			<aon:outputText value="#{to.registryName}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText
					value="#{bundle.aon_duration}" />
			</f:facet>
			<aon:outputText value="#{to.trackingDuration}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_cost}" />
			</f:facet>
			<aon:outputText value="#{to.cost}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_total}" />
			</f:facet>
			<aon:outputText value="#{to.amount}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:column>
	</aon:dataTable>

	<h:panelGrid columns="3" styleClass="aon-width-all" 
		columnClasses="aon-width-100,aon-width-auto,aon-width-100">
		<aon:div>
			<aon:commandLink value="#{bundle.aon_previous}"
				styleClass="aon-icon-previous"
				style="padding-left: 20px;" 
				rendered="#{projectStat.dailyTrackingPage.previousAvailable}"
				actionListener="#{projectStat.onPreviousDailyTrackingList}" 
				/>
			<aon:outputText value="&#160;"/>
		</aon:div>
			
		<aon:outputText value="&#160;"/>
		
		<aon:div>
			<aon:commandLink value="#{bundle.aon_next}"
				styleClass="aon-icon-next aon-padding-left" 
				style="padding-left: 20px;" 
				rendered="#{projectStat.dailyTrackingPage.nextAvailable}"
				actionListener="#{projectStat.onNextDailyTrackingList}" 
				/>
			<aon:outputText value="&#160;"/>
		</aon:div>
				
	</h:panelGrid>

	
</ui:composition>
