<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="contentForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{statBundle.stat_menu_tas_stat}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="skipClearButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-clear"
							value="#{bundle.aon_clear}"
							actionListener="#{tasStat.onClean}"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
				</ui:define>
				
			</ui:decorate>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="skipAfterSearch" value="#{true}" />
			
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{tasStat.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="tasStat_list" />

					<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{tasStat.params.target}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>

					<ui:include src="/com/code/aon/ui/tas/facelet/tasItem/lookup.xhtml">
						<ui:param name="lookupTo" value="#{tasStat.params.tasItem}" />
						<ui:param name="lookupReRender"	value="contentForm" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>

					<ui:include src="/com/code/aon/ui/tas/facelet/model/lookup.xhtml">
						<ui:param name="lookupTo" value="#{tasStat.params.tasItem.model}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<ui:param name="lookupDisabled" value="#{tasStat.params.tasItem.id != null}" />
					</ui:include>
				
					<aon:outputLabel for="TasItem_publicCode"
						value="#{bundle.tas_publicCode}" />
					<aon:inputText id="TasItem_publicCode" size="20"
						disabled="#{tasStat.params.tasItem.id != null}"
						value="#{tasStat.params.tasItem.publicCode}"/>
				
					<aon:outputLabel for="TasItem_privateCode"
						value="#{bundle.tas_privateCode}" />
					<aon:inputText id="TasItem_privateCode" size="20"
						disabled="#{tasStat.params.tasItem.id != null}"
						value="#{tasStat.params.tasItem.privateCode}" />
				
					<aon:outputLabel for="TasItem_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="TasItem_description" size="50"
						disabled="#{tasStat.params.tasItem.id != null}"
						value="#{tasStat.params.tasItem.description}" />
				
					<aon:outputLabel for="TasItem_addInfo"
						value="#{tasBundle.tas_add_info}" />
					<aon:inputText id="TasItem_addInfo" size="50"
						disabled="#{tasStat.params.tasItem.id != null}"
						value="#{tasStat.params.tasItem.addInfo}" />
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
		<aon:lookupButtonPopup lookup="#{tasItemLookup}" />
		<aon:lookupButtonPopup lookup="#{modelLookup}" />
	</ui:define>
</ui:composition>
