<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="commercialTrackingList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{statBundle.seller_stat_control}" />
				<ui:define name="beforeToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="commercial_activity_view"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:htmlCommandLink id="export2excel" value="XLS"
						title="Listado Xls"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="activityList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="export2csv" value="CSV" title="CSV"
						styleClass="aon-finding-toolbar-item aon-icon-csv"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="activityList" />
						<f:param name="outputFormat" value="CSV" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="graph" value="PDF" title="Listado Pdf"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="activityList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="4">

					<c:if test="#{commercialStat.controlType==0}">
						<aon:outputText value="#{statBundle.stat_seller}" />
						<aon:outputText value="#{commercialStat.seller.registry.fullName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==1}">
						<aon:outputText value="#{statBundle.stat_target}" />
						<aon:outputText value="#{commercialStat.target.registry.fullName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==2}">
						<aon:outputText value="#{statBundle.stat_product}" />
						<aon:outputText value="#{commercialStat.product.name}"></aon:outputText>

					</c:if>

					<aon:outputText value="#{statBundle.stat_period}" />
					<aon:div style="text-align:center;font-weight:bold ">
						<aon:outputText value="#{commercialStat.params.fromDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:outputText value="-" />
						<aon:outputText value="#{commercialStat.params.toDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:div>
				</aon:panelGrid>
				<aon:div styleClass="aon-scroll-area">
					<aon:dataTable id="commercialTrackingData"
						value="#{commercialStat.visitsModel}" var="to" rows="20"
						rendered="#{commercialTracking.model.rowCount > 0}"
						columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn">

						<!--<aon:rowSelector action="commercialTracking_form"
							actionListener="#{commercialTracking.onSelect}" />  -->

						<aon:column
							styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:commandButton id="go" action="commercialTracking_form"
								actionListener="#{commercialStat.onActivitySelect}"
								styleClass="aon-table-row-link" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<c:if test="#{commercialStat.controlType==1}">
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{sellerBundle.seller_seller}" />
								</f:facet>
								<aon:outputText value="#{to.seller.registry.fullName}" />
							</aon:column>
						</c:if>
						<c:if test="#{commercialStat.controlType==0}">
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{commercialBundle.commercial_target}" />
								</f:facet>
								<aon:outputText value="#{to.project.target.registry.fullName}" />
							</aon:column>
						</c:if>

						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{commercialBundle.commercial_tracking_activity}" />
							</f:facet>
							<aon:outputText value="#{to.activity.name}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{statBundle.seller_activity_comment}" />
							</f:facet>
							
							<aon:div>
							<aon:outputText value="#{to.comments}"  >
							<aon:abbreviateConverter maxWidth="25" />
							</aon:outputText>
								<rich:toolTip followMouse="true" direction="top-right"
									styleClass="tooltip">
									<span style="white-space: nowrap"> 
									  <h:outputText value="#{to.comments}" styleClass="tooltipData" />
									</span>
								</rich:toolTip>
							</aon:div>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>

					</aon:dataTable>

					<aon:dataScroller2 for="commercialTrackingData" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
</body>
</html>
