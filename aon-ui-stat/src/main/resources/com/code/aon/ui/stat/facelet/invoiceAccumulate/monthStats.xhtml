<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:methodParam name="backAction" value="sales_stats_year" />
		<aon:methodParam name="goAction" value="sales_stats_day" />
		<aon:methodParam name="goMethod" value="#{stat.onMonthSelect}"
			type="actionListener" />
		<aon:methodParam name="backMethod" value="#{stat.onRegistryYearBackAction}" type="actionListener" />
		<aon:methodParam name="customerFacelet"	value="customer_stat_list_month" />
		<aon:methodParam name="lastColumnAction" value="#{stat.onCustomerStats}" type="actionListener" />
		<c:if test="#{stat.invoiceType==1}">
			<ui:param name="lastColumnName"
				value="#{statBundle.stat_show_clients}" />
			<ui:param name="windowTitle"
				value="#{statBundle.stat_menu_acumulado}" />
		</c:if>
		<c:if test="#{stat.invoiceType==0}">
			<ui:param name="lastColumnName"
				value="#{statBundle.stat_show_suppliers}" />
			<ui:param name="windowTitle"
				value="#{statBundle.stat_menu_acumulado2}" />
		</c:if>
		<ui:decorate
			template="/com/code/aon/ui/stat/facelet/generic/statList.xhtml">
			<ui:param name="statController" value="#{stat}" />
			<ui:param name="clickable" value="#{true}" />
			<ui:param name="statModel" value="#{stat.monthStatModel}" />
			<ui:param name="categoryLabel" value="#{statBundle.stat_month}" />
			<ui:param name="paramName" value="month" />
			<ui:param name="showLastColumn" value="true" />
			<ui:param name="reportKeyParam" value="monthStatsList" />
			<ui:param name="reportGraphKeyParam" value="monthStatsGraph" />


			<ui:define name="extendedHeader">
				<aon:div>
					<rich:inputNumberSpinner inputSize="4" value="#{stat.currentYear}"
						maxValue="3000">
						<a4j:support event="onchange" ajaxSingle="true"
							reRender="statContainer">
							<aon:actionListener method="#{stat.onYearChanged}" />
						</a4j:support>
					</rich:inputNumberSpinner>
				</aon:div>
			</ui:define>

		</ui:decorate>

	</ui:define>
</ui:composition>
