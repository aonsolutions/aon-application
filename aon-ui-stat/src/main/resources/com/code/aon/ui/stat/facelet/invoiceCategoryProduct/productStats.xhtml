<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:methodParam name="goAction" value="category_product_stats" />
	<aon:methodParam name="goMethod" value="#{stat.onNoAction}"	type="actionListener" />
	<aon:methodParam name="backAction" value="category_stats_year" />
	<aon:methodParam name="backMethod" value="#{stat.onCategoryStats}"	type="actionListener" />
	<aon:methodParam name="lastColumnAction" value="#{stat.onProductRegistryStats}" type="actionListener" />
	<aon:methodParam  name="customerFacelet" value="category_customer_list" />	
	<ui:param name="showProductCountColumn" value="true" />
	<ui:param name="showLastColumn" value="true" />
	<c:if test="#{stat.invoiceType==1}">
		<ui:param name="lastColumnName" value="#{statBundle.stat_show_clients}" />
		<ui:param name="windowTitle" value="#{statBundle.stat_menu_category}" />
		<ui:param name="categoryLabel" value="#{bundle.aon_product}" />
	</c:if>
	<c:if test="#{stat.invoiceType==0}">
		<ui:param name="lastColumnName" value="#{statBundle.stat_show_suppliers}" />
		<ui:param name="windowTitle" value="#{statBundle.stat_menu_category}" />
		<ui:param name="categoryLabel" value="#{bundle.aon_product}" />
	</c:if>
	<c:if test="#{stat.invoiceType==2}">
		<ui:param name="lastColumnName" value="#{statBundle.stat_show_creditors}" />
		<ui:param name="windowTitle" value="#{statBundle.stat_menu_category_expense}" />
		<ui:param name="categoryLabel" value="#{bundle.aon_expense}" />
	</c:if>
	<ui:decorate template="/com/code/aon/ui/stat/facelet/generic/statList.xhtml">
		<ui:param name="statController" value="#{stat}" />
		<ui:param name="statModel" value="#{stat.monthStatModel}" />
		<ui:param name="clickable" value="#{false}" />
		<ui:param name="paramName" value="product" />
		<ui:param name="reportKeyParam" value="monthStatsList" />
		<ui:param name="reportGraphKeyParam" value="productStatsGraph" />
	</ui:decorate>

</ui:composition>
