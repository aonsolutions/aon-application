<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<aon:if test="#{commercialStat.controlType==0}">
					<ui:param name="toolbarTitle"
						value="#{bundle.seller_stat_control_seller}" />
				</aon:if>
				<aon:if test="#{commercialStat.controlType==1}">
					<ui:param name="toolbarTitle"
						value="#{bundle.seller_stat_control_target}" />
				</aon:if>
				<aon:if test="#{commercialStat.controlType==2}">
					<ui:param name="toolbarTitle"
						value="#{bundle.seller_stat_control_product}" />
				</aon:if>
				<aon:if test="#{commercialStat.controlType==3}">
					<ui:param name="toolbarTitle"
						value="#{bundle.seller_stat_control_category}" />
				</aon:if>
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<aon:if test="#{commercialStat.controlType==0}">
				<aon:methodParam name="searchActionListener"
					value="#{commercialStat.onSummary}" type="actionListener" />
			</aon:if>
			<aon:if test="#{commercialStat.controlType==1}">
				<aon:methodParam name="searchActionListener"
					value="#{commercialStat.onTargetSummary}" type="actionListener" />
			</aon:if>
			<aon:if test="#{commercialStat.controlType==2}">
				<aon:methodParam name="searchActionListener"
					value="#{commercialStat.onProductSummary}" type="actionListener" />
			</aon:if>
			
			<aon:if test="#{commercialStat.controlType==3}">
				<aon:methodParam name="searchActionListener"
					value="#{commercialStat.onCategorySummary}" type="actionListener" />
			</aon:if>
			<aon:methodParam name="searchAction" value="commercial_seller_view" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="entryDate-From"
						value="#{bundle.aon_date_from}" />
					<aon:panelGrid columns="3">
						<aon:selectInputDate id="entryDate-From"
							value="#{commercialStat.params.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="entryDate-To" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="entryDate-To"
							value="#{commercialStat.params.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>

					<aon:outputLabel 
						value="#{bundle.aon_zero_lines}" />
					<aon:selectBooleanCheckbox id="zeroLines"
						value="#{commercialStat.showZeroLines}">
					</aon:selectBooleanCheckbox>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
