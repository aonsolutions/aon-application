<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:form id="monthStat">
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
			<ui:param name="skipResetButton" value="true" />
			<ui:param name="toolbarTitle" value="#{windowTitle}" />
			<ui:param name="skipSearchButton" value="true" />
			<ui:define name="additionalToolbarContent">
				<aon:commandButton immediate="true" value="#{bundle.aon_back}"
					action="#{backAction}"
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					accesskey="#{bundle.aon_key_cancel}">
					<aon:actionListener method="#{backMethod}" />
				</aon:commandButton>
					<!--  
					actionListener="#{stat.onReset}" action="#{backAction}"
					-->
				<aon:htmlCommandLink id="export2pdf" value="PDF" title="listado PDF"
					styleClass="aon-finding-toolbar-item aon-icon-pdf aon-finding-toolbar-item-no-border"
					action="#{report.onExecute}" target="_blank">
					<f:param name="reportKey" value="#{reportKeyParam}" />
				</aon:htmlCommandLink>
				<aon:htmlCommandLink id="export2excel" value="XLS"
					title="Listado Xls"
					styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
					action="#{report.onExecute}" target="_blank">
					<f:param name="reportKey" value="#{reportKeyParam}" />
					<f:param name="outputFormat" value="MS Excel" />
				</aon:htmlCommandLink>
				<aon:htmlCommandLink id="export2csv" value="CSV" title="CSV"
					styleClass="aon-finding-toolbar-item aon-icon-csv"
					action="#{report.onExecute}" target="_blank">
					<f:param name="reportKey" value="#{reportKeyParam}" />
					<f:param name="outputFormat" value="CSV" />
				</aon:htmlCommandLink>
				<aon:htmlCommandLink id="graph" value="#{statBundle.stat_graph}"
					title="#{statBundle.stat_graph}"
					styleClass="aon-finding-toolbar-item aon-icon-statistics"
					action="#{report.onExecute}" target="_blank">
					<f:param name="reportKey" value="#{reportGraphKeyParam}" />
					<f:param name="outputFormat" value="PDF" />
				</aon:htmlCommandLink>
			</ui:define>
		</ui:decorate>
		<rich:spacer />
		<aon:div id="statContainer" styleClass="aon-scroll-area">
			<aon:editDataTable id="yearsStats" value="#{statModel}" rows="20"
				columnClasses="aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn,aon-editDataTable-numberColumn"
				var="to">

				<f:facet name="header">
					<aon:div>
						<h:panelGrid columns="3" style="align:center">
							<aon:div>
								<aon:outputText value="#{windowTitle}" />
							</aon:div>
							<aon:div>
								<aon:outputText value="(" />
								<aon:outputText value="#{stat.params.fromDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:outputText value="-" />
								<aon:outputText value="#{stat.params.toDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:outputText value=")" />
								<c:if test="#{stat.params.workPlace!=null and stat.params.workPlace.id!=null}">
									<aon:outputText value="&#160;(" />
									<aon:outputText value="#{stat.params.workPlace.description}" />
									<aon:outputText value=")" />
								</c:if>
							</aon:div>
							<ui:insert name="extendedHeader" />
						</h:panelGrid>
					</aon:div>
				</f:facet>
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{categoryLabel}" />
					</f:facet>

					<c:if test="#{clickable}">
						<aon:commandLink styleClass="aon-dataTable-link"
							value="#{to.name}" action="#{goAction}"
							actionListener="#{goMethod}"
							reRender="aonContent">
							<f:param name="#{paramName}" value="#{to.key}" />
						</aon:commandLink>
					</c:if>

					<c:if test="#{!clickable}">
						<aon:outputText value="#{to.name}">
							<f:param name="#{paramName}" value="#{to.key}" />
						</aon:outputText>
					</c:if>

					<f:facet name="footer">
						<aon:outputText value="#{statBundle.report_totals}">
						</aon:outputText>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<c:if test="#{stat.invoiceType==1}">
							<aon:outputText value="#{statBundle.stat_sales_amount}" />
						</c:if>
						<c:if test="#{stat.invoiceType==0}">
							<aon:outputText value="#{statBundle.stat_purchases_amount}" />
						</c:if>
						<c:if test="#{stat.invoiceType==2}">
							<aon:outputText value="#{statBundle.stat_expenses_amount}" />
						</c:if>
					</f:facet>
					<aon:outputText value="#{to.amount}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>

					<f:facet name="footer">
						<aon:outputText value="#{stat.totalAmount}" style="float:right">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{statBundle.stat_invoices}" />
					</f:facet>
					<aon:outputText value="#{to.numInvoice}">
						<f:convertNumber maxFractionDigits="0" />
					</aon:outputText>

					<f:facet name="footer">
						<aon:outputText value="#{stat.numInvoices}" style="float:right">
							<f:convertNumber type="number" maxFractionDigits="0"></f:convertNumber>
						</aon:outputText>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{statBundle.stat_average}" />
					</f:facet>
					<aon:outputText value="#{to.averageAmount}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>

					<f:facet name="footer">
						<aon:outputText value="#{stat.promAmount}" style="float:right">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</f:facet>
				</aon:column>

				<aon:column rendered="#{showLastColumn}">
					<f:facet name="header">
						<aon:outputText value="#{lastColumnName}" />
					</f:facet>
					<aon:commandLink styleClass="aon-dataTable-link"
						value="#{lastColumnName}" action="#{customerFacelet}"
						actionListener="#{lastColumnAction}"
						reRender="aonContent">
						<f:param name="#{paramName}" value="#{to.key}" />
					</aon:commandLink>
				</aon:column>

			</aon:editDataTable>
			<aon:dataScroller2 for="yearsStats" showNote="true" />
		</aon:div>
	</aon:form>
</ui:composition>
