<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

	<aon:form id="monthStat">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
			<ui:param name="skipResetButton" value="true" />
			<ui:param name="toolbarTitle" value="#{windowTitle}" />
			<ui:param name="skipSearchButton" value="true" />
			<ui:define name="additionalToolbarContent">
				<aon:commandButton immediate="true" value="Volver"
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					action="#{backAction}"
					accesskey="#{bundle.aon_key_cancel}">
					<aon:actionListener method="#{backMethod}" />
				</aon:commandButton>
				<aon:htmlCommandLink id="export2pdf-report" value="PDF" title="Listado Pdf"
					styleClass="aon-finding-toolbar-item aon-icon-pdf"
					action="#{report.onExecute}" target="_blank">
					<f:param name="reportKey" value="#{reportKeyParam}" />
				</aon:htmlCommandLink>
				<aon:htmlCommandLink id="export2excel-report" value="XLS"
					title="Listado Xls"
					styleClass="aon-finding-toolbar-item aon-icon-excel"
					action="#{report.onExecute}" target="_blank">
					<f:param name="reportKey" value="#{reportKeyParam}" />
					<f:param name="outputFormat" value="MS Excel" />
				</aon:htmlCommandLink>
				<aon:htmlCommandLink id="export2csv-report" value="CSV" title="CSV"
					styleClass="aon-finding-toolbar-item aon-icon-csv"
					action="#{report.onExecute}" target="_blank">
					<f:param name="reportKey" value="#{reportKeyParam}" />
					<f:param name="outputFormat" value="CSV" />
				</aon:htmlCommandLink>
				<aon:htmlCommandLink id="graph-report" value="#{bundle.stat_graph}"
					title="#{bundle.stat_graph}"
					styleClass="aon-finding-toolbar-item aon-icon-statistics"
					action="#{report.onExecute}" target="_blank">
					<f:param name="reportKey" value="#{reportGraphKeyParam}" />
					<f:param name="outputFormat" value="PDF" />
				</aon:htmlCommandLink>
			</ui:define>
		</ui:decorate>
		<rich:spacer />
		<aon:div id="statContainer" styleClass="aon-scroll-area">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
				<ui:param name="controller" value="#{statModel}" />
				<ui:param name="skipSelectButton" value="true" />
				<ui:param name="rowSelectorToggleOnClick" value="false" />
		
				<ui:define name="columns">

					<f:facet name="header">
						<aon:div>
							<h:panelGrid columns="3" style="align:center">
								<aon:div>
									<aon:outputText value="#{windowTitle}" />
								</aon:div>
								<aon:div>
									<aon:outputText value="("/>
									<aon:outputText value="#{commercialStat.params.fromDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
									<aon:outputText value="-"/>
									<aon:outputText value="#{commercialStat.params.toDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
									<aon:outputText value=")"/>
								</aon:div>
								<ui:insert name="extendedHeader" />
							</h:panelGrid>
						</aon:div>
					</f:facet>
					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{categoryLabel}" />
						</f:facet>
	
						<aon:if test="#{clickable}">
							<aon:commandLink styleClass="aon-dataTable-link"
								value="#{to.name}" action="#{goAction}"
								actionListener="#{goMethod}"
								reRender="aonContent">
								<f:param name="#{paramName}" value="#{to.key}" />
							</aon:commandLink>
						</aon:if>
	
						<aon:if test="#{!clickable}">
							<aon:outputText value="#{to.name}">
								<f:param name="#{paramName}" value="#{to.key}" />
							</aon:outputText>
						</aon:if>
	
						<f:facet name="footer">
						 	<aon:outputText value="#{bundle.report_totals}"> 
							</aon:outputText>
						</f:facet>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.stat_offer_amount2}" />
						</f:facet>
						<aon:outputText value="#{to.amount}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
	
						<f:facet name="footer">
							<aon:outputText value="#{commercialStat.totalAmount}" style="float:right">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</f:facet>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.stat_offers}" />
						</f:facet>
						<aon:outputText value="#{to.numInvoice}">
							<f:convertNumber maxFractionDigits="0" />
						</aon:outputText>
	
						<f:facet name="footer">
							<aon:outputText value="#{commercialStat.numInvoices}" style="float:right">
								<f:convertNumber type="number" maxFractionDigits="0"></f:convertNumber>
							</aon:outputText>
						</f:facet>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.stat_average}" />
						</f:facet>
						<aon:outputText value="#{to.averageAmount}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
	
						<f:facet name="footer">
							<aon:outputText value="#{commercialStat.promAmount}" style="float:right">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</f:facet>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-textColumn"
						rendered="#{showLastColumn}">
						<f:facet name="header">
							<aon:outputText value="#{lastColumnName}" />
						</f:facet>
						<aon:commandLink styleClass="aon-dataTable-link"
							value="#{lastColumnName}" action="#{offerFacelet}"
							actionListener="#{lastColumnAction}"
							reRender="aonContent">
							<f:param name="#{paramName}" value="#{to.key}" />
						</aon:commandLink>
					</aon:column>
				
				</ui:define>
			</ui:decorate>
		</aon:div>
	</aon:form>
	</ui:define>
</ui:composition>
