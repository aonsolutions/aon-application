<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="offer" value="#{registryStat.pendingOfferModel}"
		rows="20"
		columnClasses="aon-editDataTable-textColumn, aon-editDataTable-dateColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,aon-editDataTable-numberColumn"
		var="to">
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date}" />
			</f:facet>
			<aon:outputText value="#{to.issueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>
		<aon:column>
			<f:facet name="header">
				<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
			</f:facet>
			<aon:outputText value="#{to.referenceCode}" />
		</aon:column>
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.seller_stat_name}" />
			</f:facet>
			<aon:outputText value="#{to.seller.registry.name}" />
		</aon:column>
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_workplace}" />
			</f:facet>
			<aon:outputText value="#{to.workPlace.description}" />
		</aon:column>
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_total}" />
			</f:facet>
			<aon:outputText value="#{registryStat.offerTotalPrice}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
				<aon:column
			styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:htmlCommandLink id="invoicePrint-report" title="Ver Presupuesto"
				value="&#160;&#160;&#160;&#160;&#160;&#160;" target="_blank"
				action="#{report.onExecute}"
				actionListener="#{registryStat.onOfferPdf}"
				styleClass="aon-icon-pdf">
				<f:param name="reportKey" value="offer" />
			</aon:htmlCommandLink>
		</aon:column>

	</aon:dataTable>


	<aon:dataScroller2 for="offer" showNote="true" />
</ui:composition>
