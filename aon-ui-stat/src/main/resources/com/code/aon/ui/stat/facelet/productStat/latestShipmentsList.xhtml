<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
		<ui:param name="controller" value="#{productStat.latestShipmentsState}" />
		<ui:param name="skipSelectButton" value="true" />
		<ui:param name="rowSelectorToggleOnClick" value="false" />

		<ui:define name="columns">

			<aon:column	styleClass="aon-editDataTable-dateColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.invoice.issueDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_customer}" />
				</f:facet>
				<aon:outputText value="#{to.invoice.registry.name}" />
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_invoice_number}" />
				</f:facet>
				<aon:div>
					<aon:outputText value="#{to.invoice.referenceCode}" />
					<aon:commandLink id="invoice_link" immediate="true"
						styleClass="aon-button-goto aon-margin-left" style="padding-right: 10px;"
						value="&#160;" title="#{bundle.aon_go}"
						rendered="#{not empty to.invoice.id}"
						actionListener="#{productStat.onLoadInvoice}"
						action="#{productStat.getInvoiceAction}" />
				</aon:div>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_discount}" />
				</f:facet>
				<aon:outputText value="#{to.discountExpression.discountExpr}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText value="#{to.taxableBase}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
