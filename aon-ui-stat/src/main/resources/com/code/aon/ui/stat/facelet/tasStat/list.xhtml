<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="contentForm">

			<aon:methodParam name="searchActionListener" default="#{tasStat.onClean}" type="actionListener" />
			<aon:methodParam name="searchAction" default="tasStat_search"/>				

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{statBundle.stat_menu_tas_stat}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{tasStat}" />
					<ui:param name="dataTableId" value="ownerDataTable" />
					<ui:param name="dataModel" value="#{tasStat.headerModel}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					
					<ui:param name="rows" value="20" />
					
					<ui:define name="columns">
					
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<aon:commandLink id="tasSelection" 
								styleClass="aon-table-row-link aon-icon-car"
								title="#{statBundle.stat_menu_tas_tasItem} (#{to.publicCode} - #{to.make} #{to.model} )" 
								value="&#160;"
								immediate="true" ajaxSingle="true" requestDelay="100"
								action="tasStat_tasItem_form"
								actionListener="#{tasStat.onSelectTas}">
							</aon:commandLink>
						</aon:column>

						<aon:column styleClass="aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.tas_publicCode}" />	
							</f:facet> 
							<aon:outputText value="#{to.publicCode}" />
						</aon:column>
									
						<aon:column styleClass="aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.tas_make}" />	
							</f:facet> 
							<aon:outputText value="#{to.make}" />
						</aon:column>
		
						<aon:column styleClass="aon-width-300">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_model}" />	
							</f:facet> 
							<aon:outputText value="#{to.model}" />
						</aon:column>
<!-- 
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<aon:commandLink id="ownerSelection" 
								styleClass="aon-table-row-link aon-icon-customer"
								title="#{statBundle.stat_menu_tas_owner} (#{to.name})" 
								value="&#160;"
								immediate="true" ajaxSingle="true" requestDelay="100"
								action="tasStat_owner_form"
								actionListener="#{tasStat.onSelectOwner}">
							</aon:commandLink>
						</aon:column>
 -->
						<aon:column styleClass="aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_document}" />	
							</f:facet>
							<aon:outputText value="#{to.document}" />
						</aon:column>
		
						<aon:column styleClass="aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_target}" />	
							</f:facet> 
							<aon:outputText value="#{to.name}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
