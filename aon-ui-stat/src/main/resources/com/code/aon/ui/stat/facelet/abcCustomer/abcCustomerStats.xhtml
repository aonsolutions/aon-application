<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:methodParam name="backAction" value="abc_stats_search" />
		<aon:methodParam name="goAction" value="abc_customer_stats" />
		<!--  <aon:methodParam name="goMethod" value="#{stat.onAbcCustomerSelect}" type="actionListener" />
			<aon:methodParam name="backMethod" value="" type="actionListener" />
			-->
		<aon:methodParam name="goMethod" value="#{stat.onNoAction}"
			type="actionListener" />
		<aon:methodParam name="backMethod" value="" type="actionListener" />

		<ui:include src="/com/code/aon/ui/stat/facelet/generic/statList.xhtml">
			<ui:param name="statController" value="#{stat}" />
			<ui:param name="statModel" value="#{stat.abcStatModel}" />
			<ui:param name="clickable" value="#{false}" />
			<ui:param name="paramName" value="customer" />
			<ui:param name="reportKeyParam" value="abcStatsList" />
			<ui:param name="reportGraphKeyParam" value="abcStatsGraph" />
			<c:if test="#{stat.invoiceType==1}">
				<ui:param name="categoryLabel" value="#{statBundle.stat_customer}" />
				<ui:param name="windowTitle" value="#{statBundle.stat_abc_customer}" />
			</c:if>
			<c:if test="#{stat.invoiceType==0}">
				<ui:param name="categoryLabel" value="#{statBundle.stat_supplier}" />
				<ui:param name="windowTitle" value="#{statBundle.stat_abc_supplier}" />
			</c:if>
		</ui:include>

	</ui:define>
</ui:composition>
