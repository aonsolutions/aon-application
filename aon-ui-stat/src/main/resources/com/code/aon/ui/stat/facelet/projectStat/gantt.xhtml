<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-width-all aon-text-center">
		<a4j:mediaOutput element="img" cacheable="false" session="false"
					    createContent="#{projectStat.paintGanttChart}" 
					    mimeType="image/jpeg">
					    <!-- Se agrega este param para que no cachee el resultado -->
					    <f:param name="value" value="#{projectStat.lastModified}" />
					</a4j:mediaOutput>
	</aon:div>
</ui:composition>
