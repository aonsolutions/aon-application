<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{statBundle.stat_menu_summary}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_search}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{stat.onSummaryStats}" type="actionListener" />
					<aon:methodParam name="searchAction" value="summary_stats_year" />

					<aon:outputText value="#{bundle.aon_period}" />
			 		<h:panelGrid columns="4">
						<aon:outputLabel
						styleClass="aon-italic aon-margin-right" 
							value="#{bundle.aon_month}" />
						<rich:inputNumberSpinner id="spin1" inputSize="2"
							value="#{stat.summaryMonth}" maxValue="12" minValue="1" />

						<aon:outputLabel
							styleClass="aon-italic aon-margin-right aon-margin-left" 
							value="#{bundle.aon_year}" />
						<rich:inputNumberSpinner inputSize="4" value="#{stat.currentYear}"
							maxValue="3000" />

					</h:panelGrid>
					
					<aon:outputLabel for="stat_WorkPlace"
						value="#{bundle.purchase_workplace}" />
					<aon:selectOneMenu id="stat_WorkPlace"
						value="#{stat.params.workPlace}">
						<f:selectItem itemLabel="-" itemValue="#{null}" />
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
					</aon:selectOneMenu>
					
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
