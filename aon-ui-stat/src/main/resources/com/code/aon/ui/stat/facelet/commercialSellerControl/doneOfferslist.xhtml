<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
		<ui:param name="controller" value="#{commercialStat.doneOffersState}" />
		<ui:param name="skipSelectButton" value="true" />
		<ui:param name="rowSelectorToggleOnClick" value="false" />

		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
				</f:facet>
				<aon:outputText value="#{to.offer.referenceCode}" />
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.offer.issueDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<h:outputText value="#{bundle.aon_target}" />
				</f:facet>
				<aon:outputText value="#{to.offer.target.registry.fullName}">
					<aon:abbreviateConverter maxWidth="50" />
				</aon:outputText>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<h:outputText value="#{bundle.aon_company_document}" />
				</f:facet>
				<aon:outputText value="#{to.offer.target.registry.document}" />
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.offer.status}" />
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_total}" />
				</f:facet>
				<aon:outputText value="#{commercialStat.doneOfferTotalPrice}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
			<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:htmlCommandLink id="invoiceList-report"
					value="&#160;&#160;&#160;&#160;&#160;&#160;" title="Pdf"
					actionListener="#{commercialStat.onDoneOfferPdf}"
					styleClass="aon-icon-pdf" action="#{report.onExecute}"
					target="_blank">
					<f:param name="reportKey" value="offer" />
				</aon:htmlCommandLink>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
