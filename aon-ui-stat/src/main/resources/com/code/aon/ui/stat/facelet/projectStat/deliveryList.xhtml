<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="deliveryDataList" value="#{projectStat.deliveryPage.list}" 
		rows="#{projectStat.deliveryPage.pageSize}" var="to">

		<aon:column  styleClass="aon-editDataTable-dateColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.type}" />
		</aon:column>

		<aon:column  styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date}" />
			</f:facet>
			<aon:outputText value="#{to.issueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column  styleClass="aon-editDataTable-dateColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText value="Referencia" />
			</f:facet>
			<aon:outputText value="#{to.reference}" />
		</aon:column>


		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_supplier} / #{bundle.aon_customer}" />
			</f:facet>
			<aon:outputText value="#{to.registryName}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="Total" />
			</f:facet>
			<aon:outputText value="#{to.total}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
	</aon:dataTable>
	
	<h:panelGrid columns="3" styleClass="aon-width-all" 
		columnClasses="aon-width-100,aon-width-auto,aon-width-100">
		<aon:div>
			<aon:commandLink value="#{bundle.aon_previous}"
				styleClass="aon-icon-previous"
				style="padding-left: 20px;" 
				rendered="#{projectStat.deliveryPage.previousAvailable}"
				actionListener="#{projectStat.onPreviousCostInvoiceList}" 
				/>
			<aon:outputText value="&#160;"/>
		</aon:div>
			
		<aon:outputText value="&#160;"/>
		
		<aon:div>
			<aon:commandLink value="#{bundle.aon_next}"
				styleClass="aon-icon-next aon-padding-left" 
				style="padding-left: 20px;" 
				rendered="#{projectStat.deliveryPage.nextAvailable}"
				actionListener="#{projectStat.onNextCostInvoiceList}" 
				/>
			<aon:outputText value="&#160;"/>
		</aon:div>
				
	</h:panelGrid>
	
</ui:composition>
