<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
	
		<aon:form id="invoiceList">
			<aon:if test="#{stat.invoiceType==0}">
				<ui:param name="toolbarTitle" value="#{bundle.finance_purchase_invoice_management_module}" />
			</aon:if>
			<aon:if test="#{stat.invoiceType==1}">
				<ui:param name="toolbarTitle" value="#{bundle.finance_sale_invoice_management_module}" />
			</aon:if>
			<aon:if test="#{stat.invoiceType==2}">
				<ui:param name="toolbarTitle" value="#{bundle.finance_expense_invoice_management_module}" />
			</aon:if>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="#{stat.getInvoiceBackAction}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel" />
					<aon:htmlCommandLink id="invoiceList-report" value="PDF"
						title="Listado Pdf"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="invoiceList" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="invoiceList-excel-report" value="XLS"
						title="Listado Xls"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="invoiceList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="invoiceList-cvs-report" value="CSV"
						title="CSV" styleClass="aon-finding-toolbar-item aon-icon-csv"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="invoiceList" />
						<f:param name="outputFormat" value="CSV" />
					</aon:htmlCommandLink>
				</ui:define>

			</ui:decorate>
	
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{stat.invoicesState}" />
					<ui:param name="skipSelectButton" value="true" />
					<ui:param name="rowSelectorToggleOnClick" value="false" />
			
					<ui:define name="columns">
				
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.issueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:if test="#{stat.invoiceType==1}">
									<aon:outputText value="#{bundle.aon_customer}" />
								</aon:if>
								<aon:if test="#{stat.invoiceType==0}">
									<aon:outputText value="#{bundle.aon_supplier}" />
								</aon:if>
								<aon:if test="#{stat.invoiceType==2}">
									<aon:outputText value="#{bundle.aon_creditor}" />
								</aon:if>
							</f:facet>
							<aon:outputText value="#{to.registryName}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.registryDocument}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{stat.invoiceTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
						
						<aon:column	styleClass="aon-editDataTable-textColumn aon-width-60 aon-vertical-align-top">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:htmlCommandLink id="invoicePrint-report" title="#{bundle.aon_report}"
								value="&#160;&#160;&#160;&#160;&#160;&#160;" target="_blank"
								action="#{report.onExecute}"
								actionListener="#{stat.onInvoicePdf}" styleClass="aon-icon-pdf">
								<aon:actionListener method="#{printParams.onInit}" />
								<f:setPropertyActionListener target="#{report.reportKey}"
									value="#{printParams.saleInvoiceParams.invoicePrintTemplateValue}" />
							</aon:htmlCommandLink>
						</aon:column>
						
					</ui:define>
				</ui:decorate>
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
