<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="invoiceList">
			<c:if test="#{stat.invoiceType==1}">
				<ui:param name="toolbarTitle"
					value="#{statBundle.stat_finance_sale_invoice}" />
			</c:if>
			<c:if test="#{stat.invoiceType==0}">
				<ui:param name="toolbarTitle"
					value="#{statBundle.stat_finance_purchase_invoice}" />
			</c:if>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="additionalToolbarContent">
					<h:commandButton value="#{bundle.aon_back}"
						action="#{stat.getInvoiceBackAction}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel">

					</h:commandButton>
					<!--<h:commandLink value="&#160;" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="saleInvoiceList" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}" rendered="#{!fbatch.new}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="saleInvoiceList" />
					</h:commandLink> -->
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:editDataTable id="invoices" value="#{stat.invoicesModel}"
					rows="20"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn,aon-editDataTable-numberColumn"
					var="to">

					<aon:column>
						<f:facet name="header">
							<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
						</f:facet>
						<aon:outputText value="#{to.referenceCode}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.issueDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<c:if test="#{stat.invoiceType==1}">
								<aon:outputText value="#{statBundle.stat_customer}" />
							</c:if>
							<c:if test="#{stat.invoiceType==0}">
								<aon:outputText value="#{statBundle.stat_supplier}" />
							</c:if>
						</f:facet>
						<aon:outputText value="#{to.registryName}">
							<aon:abbreviateConverter maxWidth="50" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<h:outputText value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.registryDocument}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}" />
					</aon:column>

					<!--  	<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{configBundle.config_pay_method}" />
							</f:facet>
							<aon:outputText value="#{invoicePrint.payMethod}">
								<aon:abbreviateConverter maxWidth="15" />
							</aon:outputText>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{financeBundle.finance_checking_finance_status_abbrv}" />
							</f:facet>
							<aon:outputText value="#{invoicePrint.financeStatus}" />
						</aon:column>-->

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_total}" />
						</f:facet>
						<aon:outputText value="#{stat.invoiceTotalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
				</aon:editDataTable>
				<aon:dataScroller2 for="invoices" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
