<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="sellerViewList">

			<aon:if test="#{commercialStat.controlType==0}">
				<ui:param name="toolbarTitle"
					value="#{bundle.seller_stat_control_seller}" />
			</aon:if>
			<aon:if test="#{commercialStat.controlType==1}">
				<ui:param name="toolbarTitle"
					value="#{bundle.seller_stat_control_target}" />
			</aon:if>
			<aon:if test="#{commercialStat.controlType==2}">
				<ui:param name="toolbarTitle"
					value="#{bundle.seller_stat_control_product}" />
			</aon:if>
			<aon:if test="#{commercialStat.controlType==3}">
				<ui:param name="toolbarTitle"
					value="#{bundle.seller_stat_control_category}" />
			</aon:if>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:define name="beforeToolbarContent">
		       	<aon:if test="#{commercialStat.controlType==0 || commercialStat.controlType==1}">
						<aon:commandButton value="#{bundle.aon_back}"
						action="commercial_search_view"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:htmlCommandLink id="excel" value="XLS"
						title="Listado Xls"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="controlList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="csv" value="CSV" title="CSV"
						styleClass="aon-finding-toolbar-item aon-icon-csv"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="controlList" />
						<f:param name="outputFormat" value="CSV" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="graphic" value="PDF" title="Listado Pdf"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="controlList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
			       </aon:if>
			       
			      	<aon:if test="#{commercialStat.controlType==2 || commercialStat.controlType==3}">
						<aon:commandButton value="#{bundle.aon_back}"
						action="commercial_search_view"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:htmlCommandLink id="export2excel" value="XLS"
						title="Listado Xls"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="controlList2" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="export2csv" value="CSV" title="CSV"
						styleClass="aon-finding-toolbar-item aon-icon-csv"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="controlList2" />
						<f:param name="outputFormat" value="CSV" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="graph" value="PDF" title="Listado Pdf"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="controlList2" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
			       </aon:if>
				</ui:define>
			</ui:decorate>
			<br />

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{commercialStat.summaryState}" />
					<ui:param name="skipSelectButton" value="true" />
					<ui:param name="rowSelectorToggleOnClick" value="false" />
	
					<ui:define name="columns">

						<f:facet name="header">
	
							<rich:columnGroup>
	
								<rich:column colspan="12">
									<h:panelGrid columns="3">
										<aon:div>
											<aon:if test="#{commercialStat.controlType==0}">
												<aon:outputText
													value="#{bundle.seller_stat_control_seller}" />
											</aon:if>
											<aon:if test="#{commercialStat.controlType==1}">
												<aon:outputText
													value="#{bundle.seller_stat_control_target}" />
											</aon:if>
											<aon:if test="#{commercialStat.controlType==2}">
												<aon:outputText
													value="#{bundle.seller_stat_control_product}" />
											</aon:if>
											<aon:if test="#{commercialStat.controlType==3}">
												<aon:outputText
													value="#{bundle.seller_stat_control_category}" />
											</aon:if>
										</aon:div>
										<aon:div>
											<aon:outputText value="(" />
											<aon:outputText value="#{commercialStat.params.fromDate}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
											<aon:outputText value="-" />
											<aon:outputText value="#{commercialStat.params.toDate}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
											<aon:outputText value=")" />
										</aon:div>
										<ui:insert name="extendedHeader" />
									</h:panelGrid>
	
	
								</rich:column>
	
	
								<rich:column breakBefore="true" colspan="1">
									<rich:spacer />
								</rich:column>

								<rich:column
									rendered="#{commercialStat.controlType==0}"
									colspan="4">
									<aon:outputText value="OPERACIONES COMERCIALES" />
								</rich:column>
	
								<rich:column
									rendered="#{commercialStat.showCommercialActivities}"
									colspan="2">
									<aon:outputText value="#{bundle.seller_stat_control_vis}" />
								</rich:column>
								<rich:column colspan="4">
									<aon:outputText value="#{bundle.aon_invoice_offers}" />
								</rich:column>
	
								<rich:column colspan="1">
	
								</rich:column>
	
	
							</rich:columnGroup>
						</f:facet>
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:if test="#{commercialStat.controlType==0}">
									<aon:outputText value="#{bundle.seller_stat_name}" />
								</aon:if>
								<aon:if test="#{commercialStat.controlType==1}">
									<aon:outputText value="#{bundle.aon_target}" />
								</aon:if>
								<aon:if test="#{commercialStat.controlType==2}">
									<aon:outputText value="#{bundle.aon_product}" />
								</aon:if>
								<aon:if test="#{commercialStat.controlType==3}">
									<aon:outputText value="#{bundle.aon_category}" />
								</aon:if>
							</f:facet>
							<aon:outputText value="#{to.name}" />
							<f:facet name="footer">
								<aon:outputText value="#{bundle.report_totals}">
								</aon:outputText>
							</f:facet>
						</aon:column>
						
						
						<aon:column styleClass="aon-editDataTable-numberColumn"
							rendered="#{commercialStat.controlType==0}">
							<f:facet name="header">
								<aon:outputText value="Pendientes" />
							</f:facet>
	
							<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onSellerActivities}"
									action="commercial_activity_view" value="#{to.numOpPending}"
									reRender="aonContent" />
							
							<f:facet name="footer">
								<aon:outputText value="#{commercialStat.numOpPendingTot}"
									style="float:right" />
							</f:facet>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-numberColumn"
							rendered="#{commercialStat.controlType==0}">
							<f:facet name="header">
								<aon:outputText value="Aprobadas" />
							</f:facet>
	
							<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onSellerActivities}"
									action="commercial_activity_view" value="#{to.numOpAccepted}"
									reRender="aonContent" />
							
							<f:facet name="footer">
								<aon:outputText value="#{commercialStat.numOpAcceptedTot}"
									style="float:right" />
							</f:facet>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-numberColumn"
							rendered="#{commercialStat.controlType==0}">
							<f:facet name="header">
								<aon:outputText value="Rechazadas" />
							</f:facet>
	
							
							<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onSellerActivities}"
									action="commercial_activity_view" value="#{to.numOpRefused}"
									reRender="aonContent" />
	
							<f:facet name="footer">
								<aon:outputText value="#{commercialStat.numOpRefusedTot}"
									style="float:right" />
							</f:facet>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-numberColumn"
							rendered="#{commercialStat.controlType==0}">
							<f:facet name="header">
								<aon:outputText value="Cerradas" />
							</f:facet>
	
							<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onSellerActivities}"
									action="commercial_activity_view" value="#{to.numOpClosed}"
									reRender="aonContent" />
		
							<f:facet name="footer">
								<aon:outputText value="#{commercialStat.numOpClosedTot}"
									style="float:right" />
							</f:facet>
						</aon:column>
						
						
						<aon:column styleClass="aon-editDataTable-numberColumn"
							rendered="#{commercialStat.showCommercialActivities}">
							<f:facet name="header">
								<aon:outputText value="#{bundle.seller_stat_control_donef}" />
							</f:facet>
	
							<aon:if test="#{commercialStat.controlType==0}">
								<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onSellerActivities}"
									action="commercial_activity_view" value="#{to.numVisits}"
									reRender="aonContent" />
							</aon:if>
							<aon:if test="#{commercialStat.controlType==1}">
								<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onTargetActivities}"
									action="commercial_activity_view" value="#{to.numVisits}"
									reRender="aonContent" />
							</aon:if>
	
							<f:facet name="footer">
								<aon:outputText value="#{commercialStat.numVisitsTot}"
									style="float:right" />
							</f:facet>
						</aon:column>
						<aon:column styleClass="aon-editDataTable-numberColumn"
							rendered="#{commercialStat.showCommercialActivities}">
							<f:facet name="header">
								<aon:outputText value="#{bundle.seller_stat_control_pending}" />
							</f:facet>
							<aon:if test="#{commercialStat.controlType==0}">
								<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onPendingSellerActivities}"
									action="commercial_activity_view" value="#{to.numPendingVisits}"
									reRender="aonContent" />
							</aon:if>
							<aon:if test="#{commercialStat.controlType==1}">
								<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onPendingTargetActivities}"
									action="commercial_activity_view" value="#{to.numPendingVisits}"
									reRender="aonContent" />
							</aon:if>
	
							<f:facet name="footer">
								<aon:outputText value="#{commercialStat.numPendingVisitsTot}"
									style="float:right" />
							</f:facet>
						</aon:column>
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.seller_stat_control_done}" />
							</f:facet>
							<aon:outputText value="#{to.numOffers}" />
							<f:facet name="footer">
								<aon:outputText value="#{commercialStat.numOffersTot}"
									style="float:right" />
							</f:facet>
						</aon:column>
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.seller_stat_control_pending}" />
							</f:facet>
							<aon:outputText value="#{to.numPendingOffers}" />
							<f:facet name="footer">
								<aon:outputText value="#{commercialStat.numPendingOffersTot}"
									style="float:right" />
							</f:facet>
						</aon:column>
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.seller_stat_control_closed}" />
							</f:facet>
							<aon:outputText value="#{to.numAprovedOffers}" />
							<f:facet name="footer">
								<aon:outputText value="#{commercialStat.numAprovedOffersTot}"
									style="float:right" />
							</f:facet>
						</aon:column>
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.seller_stat_control_lost}" />
							</f:facet>
							<aon:outputText value="#{to.numLostOffers}" />
							<f:facet name="footer">
								<aon:outputText value="#{commercialStat.numLostOffersTot}"
									style="float:right" />
							</f:facet>
						</aon:column>
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
	
							</f:facet>
	
							<aon:if test="#{commercialStat.controlType==0}">
								<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onSellerDetail}"
									action="commercial_seller_stat"
									value="#{bundle.stat_show_detail}"
									reRender="aonContent" />
							</aon:if>
							<aon:if test="#{commercialStat.controlType==1}">
								<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onTargetDetail}"
									action="commercial_seller_stat"
									value="#{bundle.stat_show_detail}"
									reRender="aonContent" />
							</aon:if>
							<aon:if test="#{commercialStat.controlType==2}">
								<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onProductDetail}"
									action="commercial_seller_stat"
									value="#{bundle.stat_show_detail}"
									reRender="aonContent" />
							</aon:if>
							<aon:if test="#{commercialStat.controlType==3}">
								<aon:commandLink styleClass="aon-dataTable-link"
									actionListener="#{commercialStat.onCategoryDetail}"
									action="commercial_seller_stat"
									value="#{bundle.stat_show_detail}"
									reRender="aonContent" />
							</aon:if>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
