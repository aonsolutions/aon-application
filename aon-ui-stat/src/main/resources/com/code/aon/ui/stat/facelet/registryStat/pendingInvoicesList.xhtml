<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="pending" value="#{registryStat.pendingInvoiceModel}"
		rows="20"
		columnClasses="aon-editDataTable-dateColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,aon-editDataTable-numberColumn"
		var="to">

		<aon:column 
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date}" />
			</f:facet>
			<h:outputText value="#{to.issueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</h:outputText>
		</aon:column>
		<aon:column
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_invoice_number}" />
			</f:facet>
			<h:outputText value="#{to.referenceCode}" />
		</aon:column>
		<aon:column 
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_status}" />
			</f:facet>
			<aon:outputText value="#{to.status}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText
					value="#{bundle.finance_status_charge}" />
			</f:facet>
			<aon:outputText value="#{registryStat.financeStatus}" />
		</aon:column>
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_total}" />
			</f:facet>
			<aon:outputText value="#{registryStat.pendingInvoicesTotalPrice}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		<aon:column
			styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:htmlCommandLink id="invoicePrint-report" title="Ver Factura"
				value="&#160;&#160;&#160;&#160;&#160;&#160;" target="_blank"
				action="#{report.onExecute}"
				actionListener="#{registryStat.onInvoicePdf}"
				styleClass="aon-icon-pdf">
				<f:param name="reportKey" value="invoicePrint" />
			</aon:htmlCommandLink>
		</aon:column>
	</aon:dataTable>
	<aon:dataScroller2 for="pending" showNote="true" />
</ui:composition>
