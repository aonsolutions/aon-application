<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
		<ui:param name="controller" value="#{registryStat.pendingInvoiceState}" />
		<ui:param name="skipSelectButton" value="true" />
		<ui:param name="rowSelectorToggleOnClick" value="false" />

		<ui:define name="columns">

			<aon:column	styleClass="aon-editDataTable-dateColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<h:outputText value="#{to.issueDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</h:outputText>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_invoice_number}" />
				</f:facet>
				<h:outputText value="#{to.referenceCode}" />
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}" />
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText
						value="#{bundle.finance_status_charge}" />
				</f:facet>
				<aon:outputText value="#{registryStat.financeStatus}" />
			</aon:column>
			
			<aon:column	styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_total}" />
				</f:facet>
				<aon:outputText value="#{registryStat.pendingInvoicesTotalPrice}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:htmlCommandLink id="invoicePrint-report" title="Ver Factura"
					value="&#160;&#160;&#160;&#160;&#160;&#160;" target="_blank"
					action="#{report.onExecute}"
					actionListener="#{registryStat.onInvoicePdf}"
					styleClass="aon-icon-pdf">
					<aon:actionListener method="#{printParams.onInit}" />
					<f:setPropertyActionListener target="#{report.reportKey}"
						value="#{printParams.saleInvoiceParams.invoicePrintTemplateValue}" />
				</aon:htmlCommandLink>
			</aon:column>
			
		</ui:define>
	</ui:decorate>
	
</ui:composition>
