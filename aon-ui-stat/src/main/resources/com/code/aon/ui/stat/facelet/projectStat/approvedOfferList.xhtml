<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="approvedOfferDataList" value="#{projectStat.approvedOfferPage.list}" 
		rows="#{projectStat.approvedOfferPage.pageSize}" var="to">

		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date}" />
			</f:facet>
			<h:outputText value="#{to.issueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</h:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
			<f:facet name="header">
				<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
			</f:facet>
			<aon:commandLink styleClass="aon-dataTable-link"
				actionListener="#{projectStat.onOffer}" 
				action="offer_form">
				<aon:outputText value="#{to.reference}" />
				<f:param name="offerId" value="#{to.id}"/>
			</aon:commandLink>
			
			
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.seller_stat_name}" />
			</f:facet>
			<aon:outputText value="#{to.sellerName}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_workplace}" />
			</f:facet>
			<aon:outputText value="#{to.workplaceName}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_total}" />
			</f:facet>
			<aon:outputText value="#{to.projectTaxableBase}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
	</aon:dataTable>

	<h:panelGrid columns="3" styleClass="aon-width-all" 
		columnClasses="aon-width-100,aon-width-auto,aon-width-100">
		<aon:div>
			<aon:commandLink value="#{bundle.aon_previous}"
				styleClass="aon-icon-previous"
				style="padding-left: 20px;" 
				rendered="#{projectStat.approvedOfferPage.previousAvailable}"
				actionListener="#{projectStat.onPreviousApprovedOfferList}" 
				/>
			<aon:outputText value="&#160;"/>
		</aon:div>
			
		<aon:outputText value="&#160;"/>
		
		<aon:div>
			<aon:commandLink value="#{bundle.aon_next}"
				styleClass="aon-icon-next aon-padding-left" 
				style="padding-left: 20px;" 
				rendered="#{projectStat.approvedOfferPage.nextAvailable}"
				actionListener="#{projectStat.onNextApprovedOfferList}" 
				/>
			<aon:outputText value="&#160;"/>
		</aon:div>
				
	</h:panelGrid>
	
</ui:composition>
