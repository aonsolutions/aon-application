<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="costInvoiceDataList" value="#{projectStat.costInvoicePage.list}" 
		rows="#{projectStat.costInvoicePage.pageSize}" var="to">

		<aon:column  styleClass="aon-editDataTable-dateColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.invoiceType}" />
		</aon:column>

		<aon:column  styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date}" />
			</f:facet>
			<aon:outputText value="#{to.issueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText value="#{statBundle.stat_invoice_number}" />
			</f:facet>
			
			<aon:commandLink styleClass="aon-dataTable-link"
				actionListener="#{projectStat.onInvoice}" 
				action="#{projectStat.invoiceAction}">
				<aon:outputText value="#{to.reference}" />
				<f:param name="invoiceId" value="#{to.id}"/>
				<f:param name="invoiceType" value="#{to.type}"/>
			</aon:commandLink>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{statBundle.stat_supplier} / #{statBundle.stat_creditor}" />
			</f:facet>
			<aon:outputText value="#{to.registryName}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{statBundle.stat_tb_total}" />
			</f:facet>
			<aon:outputText value="#{to.invoiceTotal}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{statBundle.stat_tb_invoice}" />
			</f:facet>
			<aon:outputText value="#{to.invoiceTaxableBase}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{statBundle.stat_tb_project}" />
			</f:facet>
			<aon:outputText value="#{to.projectTaxableBase}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
	</aon:dataTable>
	
	<h:panelGrid columns="3" styleClass="aon-width-all" 
		columnClasses="aon-width-100,aon-width-auto,aon-width-100">
		<aon:div>
			<aon:commandLink value="#{bundle.aon_previous}"
				styleClass="aon-icon-previous"
				style="padding-left: 20px;" 
				rendered="#{projectStat.costInvoicePage.previousAvailable}"
				actionListener="#{projectStat.onPreviousCostInvoiceList}" 
				/>
			<aon:outputText value="&#160;"/>
		</aon:div>
			
		<aon:outputText value="&#160;"/>
		
		<aon:div>
			<aon:commandLink value="#{bundle.aon_next}"
				styleClass="aon-icon-next aon-padding-left" 
				style="padding-left: 20px;" 
				rendered="#{projectStat.costInvoicePage.nextAvailable}"
				actionListener="#{projectStat.onNextCostInvoiceList}" 
				/>
			<aon:outputText value="&#160;"/>
		</aon:div>
				
	</h:panelGrid>
	
</ui:composition>
