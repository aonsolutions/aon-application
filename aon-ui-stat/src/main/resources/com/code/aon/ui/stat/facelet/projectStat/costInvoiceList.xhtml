<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="costInvoiceDataList" value="#{projectStat.costInvoiceModel}"
		rows="20" var="to"
		columnClasses="aon-editDataTable-dateColumn,aon-editDataTable-textColumn, 
						aon-editDataTable-textColumn,aon-editDataTable-textColumn,
						aon-editDataTable-numberColumn">

		<aon:column  styleClass="aon-editDataTable-dateColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.type}" />
		</aon:column>

		<aon:column  styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date}" />
			</f:facet>
			<aon:outputText value="#{to.issueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText value="#{statBundle.stat_invoice_number}" />
			</f:facet>
			<aon:outputText value="#{to.referenceCode}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{statBundle.stat_supplier} / #{statBundle.stat_creditor}" />
			</f:facet>
			<aon:outputText value="#{to.registryName}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText
					value="#{statBundle.stat_invoice_status}" />
			</f:facet>
			<aon:outputText value="#{projectStat.costInvoiceFinanceStatus}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_total}" />
			</f:facet>
			<aon:outputText value="#{to.total}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

	</aon:dataTable>
	<aon:dataScroller2 for="costInvoiceDataList" showNote="true" />
</ui:composition>
