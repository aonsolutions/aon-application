<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="offerList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="toolbarTitle"
					value="#{bundle.commercial_offer_module}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="#{commercialStat.getOfferBackAction}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<c:if test="#{commercialStat.controlType==0}">
						<aon:outputText value="#{bundle.seller_stat_name}" />
						<aon:outputText value="#{commercialStat.sellerName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==1}">
						<aon:outputText value="#{bundle.aon_target}" />
						<aon:outputText value="#{commercialStat.targetName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==2}">
						<aon:outputText value="#{bundle.aon_product}" />
						<aon:outputText value="#{commercialStat.productName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==3}">
						<aon:outputText value="#{bundle.aon_category}" />
						<aon:outputText value="#{commercialStat.categoryName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==4}">
						<aon:outputText value="#{bundle.stat_geozone}" />
						<aon:outputText value="#{commercialStat.zoneName}"></aon:outputText>
					</c:if>

					<aon:outputText value="#{bundle.aon_period}" />
					<aon:div style="text-align:center;font-weight:bold ">
						<aon:outputText value="#{commercialStat.params.fromDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:outputText value="-" />
						<aon:outputText value="#{commercialStat.params.toDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:div>
				</aon:panelGrid>
				<br />

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="dataTableId" value="offers" />
					<ui:param name="dataModel" value="#{commercialStat.offersModel}" />
					<ui:param name="rows" value="20" />
					<ui:param name="skipSelectButton" value="true" />
					<ui:param name="rowSelectorToggleOnClick" value="false" />
			
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.issueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_target}" />
							</f:facet>
							<aon:outputText value="#{to.target.registry.fullName}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.target.registry.document}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{commercialStat.offerTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:htmlCommandLink id="invoiceList-report"
								value="&#160;&#160;&#160;&#160;&#160;&#160;" title="Pdf"
								actionListener="#{commercialStat.onOfferPdf}"
								styleClass="aon-icon-pdf" action="#{report.onExecute}"
								target="_blank">
								<f:param name="reportKey" value="offer" />
							</aon:htmlCommandLink>
						</aon:column>
						
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
