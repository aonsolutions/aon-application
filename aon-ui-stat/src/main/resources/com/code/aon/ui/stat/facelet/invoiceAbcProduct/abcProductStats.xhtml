<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
        
	<ui:include src="/com/code/aon/ui/stat/facelet/generic/statList.xhtml">
		<ui:param name="statController" value="#{stat}" />
		<ui:param name="statModel" value="#{stat.abcStatState}" />
		<ui:param name="clickable" value="#{true}" />
		<aon:methodParam name="backAction" value="abc_stats_searchProduct"/>
		<aon:methodParam name="backMethod" value="#{stat.onReset}" type="actionListener" />
		<c:if test="#{stat.invoiceType==1}">
			<ui:param name="windowTitle" value="#{bundle.stat_abc_product}" />
			<ui:param name="lastColumnName" value="#{bundle.stat_show_clients}" />
			<ui:param name="categoryLabel" value="#{bundle.aon_product}" />
		</c:if>
		<c:if test="#{stat.invoiceType==0}">
			<ui:param name="windowTitle" value="#{bundle.stat_abc_product}" />
			<ui:param name="lastColumnName" value="#{bundle.stat_show_suppliers}" />
			<ui:param name="categoryLabel" value="#{bundle.aon_product}" />
		</c:if>
		<c:if test="#{stat.invoiceType==2}">
			<ui:param name="windowTitle" value="#{bundle.stat_abc_expense}" />
			<ui:param name="lastColumnName" value="#{bundle.stat_show_creditors}" />
			<ui:param name="categoryLabel" value="#{bundle.aon_expense}" />
		</c:if>		
		<aon:methodParam name="goAction" value="invoice_list"/>
		<aon:methodParam name="goMethod" value="#{stat.onProductInvoiceList}" type="actionListener" />
		<ui:param name="paramName" value="product" />
	    <ui:param name="showProductCountColumn" value="true" />
	    <ui:param name="showLastColumn" value="false" />
	    <aon:methodParam name="lastColumnAction" value="#{stat.onProductRegistryStats}" type="actionListener" />
		<aon:methodParam  name="customerFacelet" value="customer_stat_list" />				
		<ui:param name="reportKeyParam" value="abcStatsList" />
		<ui:param name="reportGraphKeyParam" value="abcStatsGraph" />
	</ui:include>		      	
		
</ui:composition>
