<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="sellerViewList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{statBundle.seller_stat_control}" />
				<ui:define name="beforeToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="commercial_seller_view"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:htmlCommandLink id="export2excel" value="XLS"
						title="Listado Xls"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="activityView" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="export2csv" value="CSV" title="CSV"
						styleClass="aon-finding-toolbar-item aon-icon-csv"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="activityView" />
						<f:param name="outputFormat" value="CSV" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="graph" value="PDF" title="Listado Pdf"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="activityView" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>

				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">


				<aon:panelGrid columns="4">

					<c:if test="#{commercialStat.controlType==0}">
						<aon:outputText value="#{bundle.seller_stat_name}" />
						<aon:outputText value="#{commercialStat.seller.registry.fullName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==1}">
						<aon:outputText value="#{bundle.aon_target}" />
						<aon:outputText value="#{commercialStat.target.registry.fullName}"></aon:outputText>

					</c:if>
				
					<aon:outputText value="#{bundle.aon_period}" />
					<aon:div style="text-align:center;font-weight:bold ">
						<aon:outputText value="#{commercialStat.params.fromDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:outputText value="-" />
						<aon:outputText value="#{commercialStat.params.toDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:div>
				</aon:panelGrid>

				<aon:div styleClass="aon-scroll-area">
					<aon:editDataTable id="activityView"
						value="#{commercialStat.activityModel}" rows="20"
						columnClasses="aon-editDataTable-textColumn,aon-editDataTable-numberColumn,aon-editDataTable-numberColumn,  aon-editDataTable-numberColumn, aon-editDataTable-numberColumn,aon-editDataTable-numberColumn,aon-editDataTable-numberColumn,aon-editDataTable-textColumn"
						var="to">

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="actividad" />
							</f:facet>
							<aon:outputText value="#{to.name}" />

						</aon:column>
						<aon:column>
							<f:facet name="header">
								<c:if test="#{commercialStat.commercialActivityStatus}">
									<aon:outputText value="#{bundle.seller_stat_control_donef}" />
								</c:if>
								<c:if test="#{!commercialStat.commercialActivityStatus}">
									<aon:outputText
										value="#{bundle.seller_stat_control_pending}" />
								</c:if>

							</f:facet>
							<c:if test="#{commercialStat.controlType==0}">
							<aon:commandLink styleClass="aon-dataTable-link"
								actionListener="#{commercialStat.onActivityList}"
								action="commercial_activity_list" value="#{to.numVisits}"
								reRender="aonContent" />
						</c:if>
						<c:if test="#{commercialStat.controlType==1}">
							<aon:commandLink styleClass="aon-dataTable-link"
								actionListener="#{commercialStat.onTargetActivityList}"
								action="commercial_activity_list" value="#{to.numVisits}"
								reRender="aonContent" />
						</c:if>
						

						</aon:column>

					</aon:editDataTable>

					<aon:dataScroller2 for="activityView" showNote="true" />

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
