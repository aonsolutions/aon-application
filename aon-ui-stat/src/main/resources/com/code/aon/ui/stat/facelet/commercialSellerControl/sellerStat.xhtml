<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml"
	xmlns:a4j="http://richfaces.org/a4j">
	<ui:define name="content">
		<aon:form id="records">
			<c:if test="#{commercialStat.controlType==0}">
				<ui:param name="toolbarTitle"
					value="#{bundle.seller_stat_control_seller}" />
			</c:if>
			<c:if test="#{commercialStat.controlType==1}">
				<ui:param name="toolbarTitle"
					value="#{bundle.seller_stat_control_target}" />
			</c:if>
			<c:if test="#{commercialStat.controlType==2}">
				<ui:param name="toolbarTitle"
					value="#{bundle.seller_stat_control_product}" />
			</c:if>
			<c:if test="#{commercialStat.controlType==3}">
				<ui:param name="toolbarTitle"
					value="#{bundle.seller_stat_control_category}" />
			</c:if>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:define name="beforeToolbarContent">
					<c:if test="#{commercialStat.controlType==0}">
						<aon:commandButton value="#{bundle.seller_stat_control}"
							action="commercial_seller_view"
							actionListener="#{commercialStat.onSummary}"
							styleClass="aon-finding-toolbar-item aon-icon-task" />
					</c:if>
					<c:if test="#{commercialStat.controlType==1}">
						<aon:commandButton value="#{bundle.seller_stat_control}"
							action="commercial_seller_view"
							actionListener="#{commercialStat.onTargetSummary}"
							styleClass="aon-finding-toolbar-item aon-icon-task" />
					</c:if>
					<c:if test="#{commercialStat.controlType==2}">
						<aon:commandButton value="#{bundle.seller_stat_control}"
							action="commercial_seller_view"
							actionListener="#{commercialStat.onProductSummary}"
							styleClass="aon-finding-toolbar-item aon-icon-task" />
					</c:if>
					<c:if test="#{commercialStat.controlType==3}">
						<aon:commandButton value="#{bundle.seller_stat_control}"
							action="commercial_seller_view"
							actionListener="#{commercialStat.onCategorySummary}"
							styleClass="aon-finding-toolbar-item aon-icon-task" />
					</c:if>
					


				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">


				<aon:panelGrid columns="4">

					<c:if test="#{commercialStat.controlType==0}">
						<aon:outputText value="#{bundle.seller_stat_name}" />
						<aon:outputText value="#{commercialStat.seller.registry.fullName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==1}">
						<aon:outputText value="#{bundle.aon_target}" />
						<aon:outputText value="#{commercialStat.target.registry.fullName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==2}">
						<aon:outputText value="#{bundle.aon_product}" />
						<aon:outputText value="#{commercialStat.product.name}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==3}">
						<aon:outputText value="#{bundle.aon_category}" />
						<aon:outputText value="#{commercialStat.productCategory.name}"></aon:outputText>

					</c:if>

					<aon:outputText value="#{bundle.aon_period}" />
					<aon:div style="text-align:center;font-weight:bold ">
						<aon:outputText value="#{commercialStat.params.fromDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:outputText value="-" />
						<aon:outputText value="#{commercialStat.params.toDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:div>
				</aon:panelGrid>

				<aon:div>
					<h:panelGrid columns="2">

						<aon:div>
							<aon:panel rendered="#{commercialStat.showCommercialActivities}"
								style="height:100px;width:250px;"
								header="#{bundle.seller_stat_control_vis}">
								<aon:panelGrid columns="2">
									<aon:outputLabel value="#{bundle.seller_stat_control_done}" />
									<aon:outputText value="#{commercialStat.numVisits}" size="30"
										disabled="true" />
									<aon:outputLabel
										value="#{bundle.seller_stat_control_pending}" />
									<aon:outputText value="#{commercialStat.numPendingVisits}"
										size="30" disabled="true" />
								</aon:panelGrid>
							</aon:panel>
						</aon:div>
						<aon:div>
							<aon:panel style="height:100px;width:250px;"
								header="#{bundle.aon_invoice_offers}">
								<aon:panelGrid columns="2">
									<aon:outputLabel value="#{bundle.seller_stat_control_done}" />
									<aon:outputText value="#{commercialStat.numOffers}" size="30"
										disabled="true" />
									<aon:outputLabel
										value="#{bundle.seller_stat_control_pending}" />
									<aon:outputText value="#{commercialStat.numPendingOffers}"
										size="30" disabled="true" />
									<aon:outputLabel
										value="#{bundle.seller_stat_control_closed}" />
									<aon:outputText value="#{commercialStat.numAprovedOffers}"
										size="30" disabled="true" />
									<aon:outputLabel value="#{bundle.seller_stat_control_lost}" />
									<aon:outputText value="#{commercialStat.numLostOffers}"
										size="30" disabled="true" />

								</aon:panelGrid>
							</aon:panel>
						</aon:div>
					</h:panelGrid>
				</aon:div>

				<aon:panelTabSet switchType="client">
					<aon:panelTab id="tab1"
						rendered="#{commercialStat.showCommercialActivities}"
						label="#{bundle.seller_stat_control_vis} #{bundle.seller_stat_control_donef}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/visitsList.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab2"
						rendered="#{commercialStat.showCommercialActivities}"
						label="#{bundle.seller_stat_control_vis}  #{bundle.seller_stat_control_pending}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/pendingVisitsList.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab3"
						label="#{bundle.seller_stat_control_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/doneOfferslist.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab4"
						label="#{bundle.seller_stat_control_pending_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/pendingOfferslist.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab5"
						label="#{bundle.seller_stat_control_closed_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/closedOfferslist.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab6"
						label="#{bundle.seller_stat_control_lost_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/lostOfferslist.xhtml" />
					</aon:panelTab>
				</aon:panelTabSet>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
