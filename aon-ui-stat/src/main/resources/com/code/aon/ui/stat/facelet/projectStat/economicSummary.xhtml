<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<h:panelGrid id="economicDataContainer" columns="2" styleClass="aon-width-all"
		columnClasses="aon-width-half aon-vertical-align-top
				 	  ,aon-width-half aon-vertical-align-top">

		<aon:div styleClass="aon-width-all aon-text-center">
			<div id="pie_chart_div" style="width: 100%; height: 200px;">
			</div>
<!-- 			
			<a4j:mediaOutput element="img" cacheable="false" session="false"
				createContent="#{projectStat.paintPieChart}" mimeType="image/jpeg">
				<f:param name="value" value="#{projectStat.lastModified}" />
			</a4j:mediaOutput>
-->
		</aon:div>

		<aon:div styleClass="aon-width-all">
			<aon:panelGrid columns="2" styleClass="aon-width-all"
				columnClasses="aon-panelGrid-odd aon-width-half aon-text-right
							  ,aon-panelGrid-even aon-width-half aon-text-right">
	
				<aon:outputText value="#{bundle.stat_offer_amount2}" />
				<aon:outputText value="#{projectStat.totalOffered}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				
				<aon:outputText value="&#160;" />
				<aon:outputText value="&#160;" />
	
				<aon:outputText value="#{bundle.stat_income_amount}" />
				<aon:outputText value="#{projectStat.totalSales}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
	
				<aon:outputText value="#{bundle.stat_cost_amount}" />
				<aon:outputText value="#{projectStat.totalCosts}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
	
				<aon:outputText value="#{bundle.aon_result}" />
				<aon:outputText value="#{projectStat.totalResult}"
					styleClass="aon-bold"
					style="#{projectStat.totalResult lt -0?'color:red;':'color:blue;'}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:panelGrid>			
	
			<aon:panelGrid columns="2" styleClass="aon-width-all aon-margin-top"
				columnClasses="aon-panelGrid-odd aon-width-half aon-text-right
							  ,aon-panelGrid-even aon-width-half aon-text-right">
				<f:facet name="header">
					<aon:outputText value="Desglose de Costos" />	
				</f:facet>
				<aon:outputText value="#{bundle.stat_invoice_cost_amount}" />
				<aon:outputText value="#{projectStat.totalInvoiceCosts}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
	
				<aon:outputText value="#{bundle.tas_labour}" />
				<aon:outputText value="#{projectStat.totalDailyTracking}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				
				<aon:outputText value="Albaranes de Compra" />
				<aon:outputText value="#{projectStat.totalIncome}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:panelGrid>
		</aon:div>

		<aon:panelGrid columns="2" styleClass="aon-width-all"
			columnClasses="aon-panelGrid-odd aon-width-half aon-text-right
						  ,aon-panelGrid-even aon-width-half aon-text-right">

			<aon:outputText value="% Diferencia s/Presupuesto" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalSales * 100 / projectStat.totalOffered}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>

			<aon:outputText value="&#160;" />
			<aon:outputText value="&#160;" />

			<aon:outputText value="% Beneficio s/ Ingresos" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalResult * 100 / projectStat.totalSales}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>

			<aon:outputText value="% Beneficio s/ Costos" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalResult * 100 / projectStat.totalCosts}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>

			<aon:outputText value="&#160;" />
			<aon:outputText value="&#160;" />

			<aon:outputText value="% Mano de obra s/ Ingresos" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalDailyTracking * 100 / projectStat.totalSales}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>

			<aon:outputText value="% Gastos y Compras s/ Ingresos" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalInvoiceCosts * 100 / projectStat.totalSales}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>
			
			<aon:outputText value="% Costo s/ Ingresos" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalCosts * 100 / projectStat.totalSales}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>
		</aon:panelGrid>
		
		<aon:div styleClass="aon-width-all aon-text-center">
			<div id="bar_chart_div" style="width: 100%; height: 200px;"></div>
<!-- 			
			<a4j:mediaOutput element="img" cacheable="false" session="false"
				createContent="#{projectStat.paintBarChart}" mimeType="image/jpeg">
				<f:param name="value" value="#{projectStat.lastModified}" />
			</a4j:mediaOutput>
 -->
		</aon:div>
	</h:panelGrid>

	<script type="text/javascript" src="https://www.google.com/jsapi"></script>
	<script type="text/javascript">
		google.load("visualization", "1", {callback : drawCharts ,packages:["corechart"]});
		function drawCharts(){
			var whatever = Array.prototype.reduce;
			try {
				Array.prototype.reduce=function(fun){var len=this.length&#62;&#62;&#62;0;if(typeof fun!="function")throw new TypeError;if(len==0&#38;&#38;arguments.length==1)throw new TypeError;var i=0;if(arguments.length&#62;=2)var rv=arguments[1];else{do{if(i in this){var rv=this[i++];break}if(++i&#62;=len)throw new TypeError;}while(true)}for(;i&#60;len;i++)if(i in this)rv=fun.call(undefined,rv,this[i],i,this);return rv};
				var data = google.visualization.arrayToDataTable([
					['', ''],
					['#{bundle.stat_income_amount}'		 , #{projectStat.totalSales}],
					['#{bundle.stat_invoice_cost_amount}', #{projectStat.totalInvoiceCosts}],
					['#{bundle.tas_labour}'      , #{projectStat.totalDailyTracking}]
				]);
				var options = {
					tooltip: {isHtml: true},
					colors:['#669966','#980000','#6699FF' ]
				};
				var chart = new google.visualization.PieChart(document.getElementById('pie_chart_div'));
				chart.draw(data, options);
				
				
				data = google.visualization.arrayToDataTable([
				  ['TITLE',
				   	'#{bundle.stat_offer_amount2}',
				   	'#{bundle.stat_income_amount}',
				   	'#{bundle.stat_invoice_cost_amount}',
				   	'#{bundle.tas_labour}',
				   	'#{bundle.aon_result}'],
				  ['',    
				  	#{projectStat.totalOffered},
				  	#{projectStat.totalSales},
				  	#{projectStat.totalInvoiceCosts},
				  	#{projectStat.totalDailyTracking},
				  	#{projectStat.totalResult}]  
				]);
				options = {
					legend: {position: 'bottom'},
					tooltip: {isHtml: true},
					colors:['#99FF33','#669966','#980000','#6699FF', '#{projectStat.totalResult lt 0?'red':'green'}']
				};
				 chart = new google.visualization.BarChart(document.getElementById('bar_chart_div'));
				chart.draw(data, options);
			} finally {
				Array.prototype.reduce = whatever;			
			}
		}
   </script>
</ui:composition>
