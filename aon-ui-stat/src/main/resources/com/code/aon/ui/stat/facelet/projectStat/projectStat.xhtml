<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="records">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.stat_project_info}" />
				<ui:define name="beforeToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="#{projectStat.backAction}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" styleClass="aon-width-all" 
					columnClasses="aon-panelGrid-odd aon-width-120
									,aon-panelGrid-even aon-width-auto
									,aon-panelGrid-odd  aon-width-120
									,aon-panelGrid-even aon-width-300">
					
					
					<aon:outputText value="#{bundle.aon_project}" />
					<aon:outputText value="#{projectStat.project.name}" />

					<aon:outputText value="#{bundle.aon_alias}" />
					<aon:outputText value="#{projectStat.project.alias}" />
					
					<aon:outputText value="#{bundle.project_assigned}" />
					<aon:outputText value="#{projectStat.project.registry.fullName}" />
					
					<aon:outputText value="#{bundle.project_project_type}" />
					<aon:outputText value="#{projectStat.project.projectType.description}" />
				</aon:panelGrid>

	
				<aon:div styleClass="aon-panelGrid-search" id="economicDataFilterPanel">
					<aon:div styleClass="aon-margin-top">
						<aon:outputLabel for="Stat_fromDate" styleClass="aon-form-date-label" 
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Stat_fromDate" styleClass="aon-margin-left"
							value="#{projectStat.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
						<aon:outputLabel for="Stat_toDate" styleClass="aon-form-date-label aon-margin-left" 
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Stat_toDate" styleClass="aon-margin-left"
							value="#{projectStat.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
						<aon:commandButton value="#{bundle.aon_filter}" 
							actionListener="#{projectStat.onRefresh}" 
							/>
					</aon:div>
				</aon:div>

				<aon:panelTabSet id="projectHistoryTabSet" selectedTab="#{projectStat.selectedTab}">
					<aon:panelTab id="chartTab" label="#{bundle.stat_economic_summary}">
						<aon:if test="#{projectStat.selectedTab == 'chartTab' or projectStat.selectedTab == null}">
							<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/economicSummary.xhtml" />
						</aon:if>
					</aon:panelTab>
					<aon:panelTab id="approvedOffersTab" label="#{bundle.stat_offer_amount2}">
						<aon:if test="#{projectStat.selectedTab == 'approvedOffersTab'}">
							<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/approvedOfferList.xhtml" />
						</aon:if>
					</aon:panelTab>
					<aon:panelTab id="saleInvoiceTab" label="#{bundle.stat_income_amount}">
						<aon:if test="#{projectStat.selectedTab == 'saleInvoiceTab'}">
							<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/saleInvoiceList.xhtml" />
						</aon:if>
					</aon:panelTab>
					<aon:panelTab id="costInvoiceTab" label="#{bundle.stat_invoice_cost_amount}">
						<aon:if test="#{projectStat.selectedTab == 'costInvoiceTab'}">
							<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/costInvoiceList.xhtml" />
						</aon:if>
					</aon:panelTab>
					<aon:panelTab id="deliveryTab" label="#{bundle.stat_alb_delivery_amount}">
						<aon:if test="#{projectStat.selectedTab == 'deliveryTab'}">
							<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/deliveryList.xhtml" />
						</aon:if>
					</aon:panelTab>
					<aon:panelTab id="dailyTrackingTab" label="#{bundle.tas_labour}">
						<aon:if test="#{projectStat.selectedTab == 'dailyTrackingTab'}">
							<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/dailyTrackingList.xhtml" />
						</aon:if>
					</aon:panelTab>
					<aon:panelTab id="ganttTab" label="Gantt">
						<aon:if test="#{projectStat.selectedTab == 'ganttTab'}">
							<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/gantt.xhtml" />
						</aon:if>
					</aon:panelTab>
				</aon:panelTabSet>

 			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
