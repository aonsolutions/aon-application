	<ui:define name="content">
		<aon:form id="records">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="Informacion del Proyecto" />
				<ui:define name="beforeToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="projectCommercial_form"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-group">
					<aon:div styleClass="aon-group-title">
						<aon:outputText value="Datos Proyecto"/>
					</aon:div>
					<aon:div styleClass="aon-group-body"> 
						<aon:div styleClass="aon-group-body-internal">
							<aon:panelGrid columns="2" styleClass="aon-width-all"
								columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">
								<aon:outputLabel value="Proyecto" />
								<aon:outputText value="#{projectStat.project.name}" />
								<aon:outputLabel value="Cliente" />
								<aon:outputText value="#{projectStat.project.registry.fullName}" />
							</aon:panelGrid>
						</aon:div>
					</aon:div>
				</aon:div>

				<aon:div styleClass="aon-group">
					<aon:div styleClass="aon-group-title">
						<aon:outputText value="Resumen Economico"/>
					</aon:div>
					<aon:div styleClass="aon-group-body"> 
						<aon:div styleClass="aon-group-body-internal">
							<aon:panelGrid columns="2" styleClass="aon-width-all"
								columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">
								<aon:outputLabel value="Total Presupuestado" />
								<aon:outputText value="#{projectStat.totalOffered}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
								<aon:outputLabel value="Total Ingresos" />
								<aon:outputText value="#{projectStat.totalSales}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
								<aon:outputLabel value="Total Costos" />
								<aon:outputText value="#{projectStat.totalCosts}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
								<aon:outputLabel value="Resultado" />
								<aon:outputText value="#{projectStat.totalResult}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:panelGrid>
						</aon:div>
					</aon:div>
				</aon:div>
