<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml"
	xmlns:a4j="http://richfaces.org/a4j">
	<ui:define name="content">
		<aon:form id="records">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="Informacion del Proyecto" />
				<ui:define name="beforeToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="#{projectStat.backAction}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-group">
					<aon:div styleClass="aon-group-title">
						<aon:outputText value="Datos Proyecto"/>
					</aon:div>
					<aon:div styleClass="aon-group-body"> 
						<aon:div styleClass="aon-group-body-internal">
							<aon:panelGrid columns="2" styleClass="aon-width-all"
								columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">
								<aon:outputLabel value="Proyecto" />
								<aon:outputText value="#{projectStat.project.name}" />
								<aon:outputLabel value="Cliente" />
								<aon:outputText value="#{projectStat.project.registry.fullName}" />
							</aon:panelGrid>
						</aon:div>
					</aon:div>
				</aon:div>

				<aon:div styleClass="aon-group">
					<aon:div styleClass="aon-group-title">
						<aon:outputText value="Resumen Economico"/>
					</aon:div>
					<aon:div styleClass="aon-group-body"> 
						<aon:div styleClass="aon-group-body-internal">
							<aon:panelGrid columns="2" styleClass="aon-width-all"
								columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">
								<aon:outputLabel value="Total Presupuestado" />
								<aon:outputText value="#{projectStat.totalOffered}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
								<aon:outputLabel value="Total Ingresos" />
								<aon:outputText value="#{projectStat.totalSales}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
								<aon:outputLabel value="Total Costos" />
								<aon:outputText value="#{projectStat.totalCosts}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
								<aon:outputLabel value="Resultado" />
								<aon:outputText value="#{projectStat.totalResult}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:panelGrid>
						</aon:div>
					</aon:div>
				</aon:div>

				<aon:panelTabSet id="projectHistoryTabSet">
					<aon:panelTab id="approvedOffersTab" label="Presupuestos">
						<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/approvedOfferList.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="saleInvoiceTab" label="Ingresos">
						<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/saleInvoiceList.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="costInvoiceTab" label="Costes">
						<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/costInvoiceList.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="manodeobraTab" label="Mano de Obra">
						<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/labourList.xhtml" />
					</aon:panelTab>
				</aon:panelTabSet>

 			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
