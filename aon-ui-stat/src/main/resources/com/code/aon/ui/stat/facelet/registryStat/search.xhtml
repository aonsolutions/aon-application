<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{statBundle.stat_menu_summary}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{registryStat.onRegistryStats}" type="actionListener" />
					<aon:methodParam name="searchAction" value="registry_stats" />

					<aon:panelGrid columns="2"
						columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
						<aon:outputLabel for="Customer_id"
							value="#{customerBundle.customer_customer}" />
						<aon:div styleClass="aon-lookup">

							<aon:lookupInputText id="Customer_id" lookup="#{customerLookup}"
								reRender="Customer_full_name" lookupProperty="registry"
								value="#{registryStat.registry.id}" size="5" />
							<aon:lookupButton
								windowTitle="#{customerBundle.customer_selection}"
								selectReRender="Customer_id,Customer_full_name"
								actionType="search" lookup="#{customerLookup}" minHeight="460"
								minWidth="650" property="#{registryStat.registry}"
								lookupProperty="registry">
							</aon:lookupButton>
							<aon:inputText id="Customer_full_name"
								value="#{(registryStat.registry.name!=null)?(registryStat.registry.fullName):('')}"
								size="50" disabled="true" />
						</aon:div>
					</aon:panelGrid>

				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>
</ui:composition>
