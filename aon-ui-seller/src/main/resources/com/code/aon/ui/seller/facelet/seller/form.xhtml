<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="sellerForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{sellerBundle.seller_module}" />
				<ui:param name="controller" value="#{seller}" />
				
				<ui:param name="showMoreMenu" value="#{true}" />
				
				<ui:define name="moreMenuContent">
					<ui:include src="/com/code/aon/ui/registry/facelet/registry/toolbarMoreMenu.xhtml">
						<ui:param name="controller" value="#{seller}" />
						<ui:param name="showFeeButton" value="#{false}" />
						<ui:param name="showProjectButton" value="#{false}" />
						<ui:param name="showNotesButton" value="#{false}" />
						<ui:param name="showRelationshipButton" value="#{false}" />
						<ui:param name="showRecordDataButton" value="#{false}" />
						<ui:param name="showSegmentButton" value="#{false}" />
						<ui:param name="showAddInfoButton" value="#{true}" />
						<ui:param name="showDirStaffButton" value="#{false}" />
						<ui:param name="showDocumentButton" value="#{documentManager.show}" />
						
						<ui:param name="feeController" value="#{null}" />
						<ui:param name="projectController" value="#{null}" />
						<ui:param name="notesController" value="#{null}" /> 
						<ui:param name="relationshipController" value="#{null}" /> 
						<ui:param name="recordDataController" value="#{null}" /> 
						<ui:param name="segmentController" value="#{null}" /> 
						<ui:param name="addInfoController" value="#{sellerAddInfo}" /> 
						<ui:param name="dirStaffController" value="#{null}" /> 
						<ui:param name="rAttachController" value="#{sellerRAttach}" />
					</ui:include>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<c:if test="#{seller.new}">
					<ui:include src="/com/code/aon/ui/seller/facelet/seller/formNewContent.xhtml">
						<ui:param name="controller" value="#{seller}" />
					</ui:include>								
				</c:if>
				<c:if test="#{!seller.new}">
					<aon:panelGrid id="menuGrid" columns="2" 	
						columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-500">
	
						<ui:include src="/com/code/aon/ui/seller/facelet/seller/formContent.xhtml">
							<ui:param name="controller" value="#{seller}" />
						</ui:include>
	
					</aon:panelGrid>

					<aon:panelTabSet id="sellerTab" selectedTab="#{seller.selectedTab}">

						<aon:panelTab id="sellerAddress" label="#{registryBundle.registry_address_module}">
							<ui:include src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{sellerAddress}" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="sellerMedia" label="#{registryBundle.registry_media_module}">
							<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{sellerMedia}" />
							</ui:include>
						</aon:panelTab>

						<c:if test="#{sellerAddInfo.model.rowCount > 0}">
							<aon:panelTab id="addInfo" label="#{registryBundle.registry_addInfo}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/raddinfo/tab_grid.xhtml">
									<ui:param name="controller" value="#{sellerAddInfo}" />
									<ui:param name="removeButtonReRender" value="sellerTab" />
								</ui:include>
							</aon:panelTab>
						</c:if>

						<c:if test="#{documentManager.show and sellerRAttach.model.rowCount > 0}">
							<aon:panelTab id="documentManagement"
								label="#{bundle.aon_documents}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rattach/tab_grid.xhtml">
									<ui:param name="controller" value="#{sellerRAttach}" />
									<ui:param name="sortColumns" value="#{true}" />
									<ui:param name="removeButtonReRender" value="sellerTab" />
								</ui:include>								
							</aon:panelTab>
						</c:if>

					</aon:panelTabSet>
				</c:if>

			</aon:div>
		</aon:form>
		<c:if test="#{aonConfiguration.bean.rmedia.showSendEmail}">
			<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		</c:if>		
		<c:if test="#{!seller.new}">
			<ui:include src="/com/code/aon/ui/registry/facelet/raddinfo/newAddInfoModal.xhtml">
				<ui:param name="controller" value="#{seller}" />
				<ui:param name="addInfoController" value="#{sellerAddInfo}" />
				<ui:param name="modalReRender" value="sellerTab" />
			</ui:include>
			<ui:include src="/com/code/aon/ui/registry/facelet/rattach/newAttachModal.xhtml">
				<ui:param name="controller" value="#{seller}" />
				<ui:param name="attachmentController" value="#{sellerRAttach}" />
				<ui:param name="modalReRender" value="sellerTab" />
			</ui:include>
		</c:if>
	</ui:define>
</ui:composition>

</body>
</html>
