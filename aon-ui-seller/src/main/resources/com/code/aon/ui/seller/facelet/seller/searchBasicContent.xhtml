<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
		<ui:param name="searchController" value="#{sellerSearch}" />
	</aon:if>

	<ui:include src="/com/code/aon/ui/registry/facelet/registry/searchContent.xhtml" >
		<ui:param name="includeRegistryScope" value="#{true}"/>
	</ui:include>	

	<aon:outputText value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox value="#{sellerSearch.sellerStatuses}">
		<f:selectItems value="#{sellerCollections.sellerStatuses}"/>
	</aon:selectManyCheckbox>							

</ui:composition>
