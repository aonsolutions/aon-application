<html>

<head>
    <meta charset="UTF-8">
    <title>Tedi Parser</title>
    <link rel="icon" image="image/png" href="https://tedi.center/assets/tedi-favicon.png">
    <script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
    <!--script src="https://www.google.com/recaptcha/api.js" async defer></script-->
    <script src="dist/tedi.js"></script>
    <script src="dist/vendors~pdfjsWorker.lib.js"></script>

    <script type="text/javascript">
        // Loaded via <script> tag, create shortcut to access PDF.js exports.
        var pdfjsLib = window['pdfjs-dist/build/pdf'];

        // The workerSrc property shall be specified.
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://mozilla.github.io/pdf.js/build/pdf.worker.js';

        // getElementById
        function $id(id) {
            return document.getElementById(id);
        }

        //
        // output information
        function output(msg) {
            var m = $id("messages");
            m.innerHTML = msg + m.innerHTML;
        }

        // file drag hover
        function fileDragHover(e) {
            e.stopPropagation();
            e.preventDefault();
            e.target.className = (e.type == "dragover" ? "hover" : "");
            $id('filedrag').style.border = "2px dashed blue";
        }

        // file drag out 
        function fileDragOut() {
            $id('filedrag').style.border = "1px dashed #555";
        }

        // file selection
        function fileSelectHandler(e) {
            e.preventDefault();
            fileUpload();
        }

        // file selection
        function fileDropHandler(e) {
            // cancel event and hover styling
            fileDragHover(e);

            $id('filedrag').style.border = "1px dashed #555";

            // fetch FileList object
            $id('fileselect').files = e.target.files || e.dataTransfer.files;

            fileUpload();
        }

        function fileDragClick() {
            fileselect = $id('fileselect')
            fileselect.click();
        }

        // JSON Loader
        function loadJSON(jsonobj) {
            // jsonobj = JSON.parse(data);
            var prettyJSON = JSON.stringify(jsonobj, null, '    ');
            $id('json-response').innerHTML = prettyPrint(jsonobj); // prettyJSON;
        }

        function fileUpload() {
            let fileselect = $id('fileselect');
            let files  = fileselect.files;
            for (let index = 0; index < files.length; index++) {
                const file = files[index];
                const reader = new FileReader();
                reader.onload = (function(f) { 
                    return function(e) { 
                        tedi.parse(e.target.result,
                        ( err, invoice) => {
                            if ( err ) {
                                alert(err)
                            } else {
                                load(invoice);
                                display();
                                loadJSON(invoice);
                            }
                        }
                        );
                        // tedi.parse(e.target.result, f.type)
                        // .then((invoice) => {
                        //     load(invoice);
                        //     display();
                        //     loadJSON(invoice);
                        // }).catch( err => alert(err))
                        // ;
                    }; 
                })(file);
                reader.readAsDataURL(file);
            }            
        }

        function display () {
            // 
            $id("viewer").style.display = "initial";
            $id("json-data").style.display = "initial";
            $id("invoice-data").style.display = "initial";
            $id("uploader").style.display = "none";

            // "Reboot" Button
            // Set Refresh button listener  || Cursor = Pointer | Enable
            $id("reload").style.cursor = "pointer";
            $id("reload").disabled = false;

            $id('reload').addEventListener("click", function() {
                location.reload();
            });

            // Show JSON listener || Some styles 
            // $id("print-json").addEventListener("click", function() {

            //     // Data visible 
            //     $id('json-data').style.display =
            //         "initial"; // OR initial / inherit(father properties)

            //     // Change Button name 
            //     if ($id('print-json').innerText == "Ver JSON") {
            //         $id('print-json').innerText = "Ocultar JSON";
            //     } else {

            //         // Hide data
            //         $id('print-json').innerText = "Ver JSON";
            //         $id('json-data').style.display = "none";
            //     }
            // });

            show();
        }

        // 
        function __fileUpload() {
            let upload = $id('upload');
            let formData = new FormData(upload);
            let request = new XMLHttpRequest();

            request.onload = function(e) {
                loadJSON(this.responseText);
                invoices = JSON.parse(this.responseText);
                invoice = invoices[0];
                load(invoice);
            }

            request.onreadystatechange = function() {
                if (request.readyState == 4 && request.status == 200) {

                    // 
                    $id("viewer").style.display = "initial";
                    $id("invoice-data").style.display = "initial";
                    $id("json-data").style.display = "initial";
                    $id("uploader").style.display = "none";

                    // "Reboot" Button
                    // Set Refresh button listener  || Cursor = Pointer | Enable
                    $id("reload").style.cursor = "pointer";
                    $id("reload").disabled = false;

                    $id('reload').addEventListener("click", function() {
                        location.reload();
                    });

                    // Show JSON listener || Some styles 
                    $id("print-json").addEventListener("click", function() {

                        // Data visible 
                        $id('json-data').style.display =
                            "initial"; // OR initial / inherit(father properties)

                        // Change Button name 
                        if ($id('print-json').innerText == "Ver JSON") {
                            $id('print-json').innerText = "Ocultar JSON";
                        } else {

                            // Hide data
                            $id('print-json').innerText = "Ver JSON";
                            $id('json-data').style.display = "none";
                        }
                    });

                    show();
                }
            };
            request.open('POST', 'https://europe-west1-tedi-snapshot.cloudfunctions.net/parse/invoice');
            request.send(formData);
        }

        function load(invoice) {
            $id('reference').innerText = invoice.reference || '';
            $id('total').innerText = invoice.total;
            $id('data').innerText = invoice.date && new Date(invoice.date).toLocaleString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }) || '';
            $id('name').innerHTML = encode(invoice.sender && invoice.sender.name || invoice.rname);
            $id('document').innerText = invoice.sender && invoice.sender.document || invoice.rdocument;
            $id('address').innerHTML = invoice.sender && invoice.sender.address && (invoice.sender.address.address + ' ' + invoice.sender.address
                    .postal_code + ' ' + invoice.sender.address.city + '(' + invoice.sender.address.province + ')') ||
                '';
            for (var i = 0; i < invoice.taxes.length; i++) {
                $id('base' + i).innerText = invoice.taxes[i].base;
                $id('tax' + i).innerText = invoice.taxes[i].tax + ' (' + (invoice.taxes[i].percent || (invoice.taxes[i]
                    .quota / invoice.taxes[i].base * 100)).toFixed(2) + ' %) ' + invoice.taxes[i].quota;
            }
        }

        function encode ( str ){
            return str &&  str.replace(/[\u00A0-\u9999<>\&]/gim, function(i) {
                return '&#'+i.charCodeAt(0)+';';
            });
        };
        //
        // initialize
        function init() {

            var fileselect = $id("fileselect"),
                filedrag = $id("filedrag"),
                submitdiv = $id("submitdiv");

            // file select
            fileselect.addEventListener("change", fileSelectHandler, false);

            // is XHR2 available?
            var xhr = new XMLHttpRequest();
            if (xhr.upload) {

                // file drop
                filedrag.addEventListener("dragover", fileDragHover, false);
                filedrag.addEventListener("dragleave", fileDragOut, false);
                filedrag.addEventListener("drop", fileDropHandler, false);
                filedrag.style.display = "block";

                filedrag.addEventListener("click", fileDragClick, false);

                // remove submit button
                submitdiv.style.display = "none";
            }
        }

        function show() {
            let file = $id('fileselect').files[0];


            if (!file.type.match(/(image\W)(\w+)/)) {
                // Using DocumentInitParameters object to load binary data.
                var loadingTask = pdfjsLib.getDocument({
                    url: URL.createObjectURL(file)
                });
                
                loadingTask.promise.then(function(pdf) {
                    console.log('PDF loaded');

                    // Fetch the first page
                    var pageNumber = 1;
                    pdf.getPage(pageNumber).then(function(page) {
                        console.log('Page loaded');

                        var viewport = page.getViewport({
                            scale: 1.5
                        });

                        // Prepare canvas using PDF page dimensions
                        var canvas = $id('the-canvas');
                        var context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        
                        var scale = canvas.width / viewport.width;
                        //var scaledViewport = page.getViewport({ scale: scale, });
                        //canvas.height = scaledViewport.height;
                        //canvas.width = scaledViewport.width;

                        // Render PDF page into canvas context
                        var renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };
                        var renderTask = page.render(renderContext);
                        renderTask.promise.then(function() {
                            console.log('Page rendered');
                        });
                    });
                }, function(reason) {
                    // PDF loading error
                    console.error(reason);
                });
                console.log(file.name);

            } else {
                $id("the-canvas").style.display = "none";
                $id('the-img').src = URL.createObjectURL(file);
            }
        }

        function replacer (match, pIndent, pKey, pVal, pEnd) {
            var key = '<span class=json-key>';
            var val = '<span class=json-value>';
            var str = '<span class=json-string>';
            var r = pIndent || '';
            if (pKey)
                r = r + key + pKey.replace(/[": ]/g, '') + '</span>: ';
            if (pVal)
                r = r + (pVal[0] == '"' ? str : val) + pVal + '</span>';
            return r + (pEnd || '');
        }
        
        function prettyPrint (obj) {
            var jsonLine = /^( *)("[\w]+": )?("[^"]*"|[\w.+-]*)?([,[{])?$/mg;
            return JSON.stringify(obj, null, 3)
                .replace(/&/g, '&amp;').replace(/\\"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(jsonLine, replacer);
        }
 
        
    </script>
