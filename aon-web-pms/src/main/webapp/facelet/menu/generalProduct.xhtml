<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<c:if test="#{aonRole.productOperator or aonRole.config}">
	
		<aon:methodParam name="generalProduct_item_search" value="item_search-#{category}" resolve="true" />	
	
		<ui:decorate template="/facelet/menu/general.xhtml" >
			<ui:define name="beforeContent">
				<c:if test="#{aonRole.productOperator}">
					<aon:div styleClass="aon-direct-access-list-element">
						<aon:commandLink id="item_search-#{category}" 
							action="#{generalProduct_item_search}"
							actionListener="#{item.onEditSearch}"
							value="#{productBundle.product_module}" />
					</aon:div>
					<aon:div styleClass="aon-direct-access-list-element">
						<aon:commandLink id="catalogue-#{category}" 
							action="catalogue_search-sales" actionListener="#{catalogue.onEditSearch}"
							value="#{productBundle.product_catalogue_module}" />
					</aon:div>
				</c:if>		
			</ui:define>
		</ui:decorate>
	</c:if>

</ui:composition>
