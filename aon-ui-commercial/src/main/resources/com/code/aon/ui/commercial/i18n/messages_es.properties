aon_footer_text_2=, quien no se hace responsable de los objetos depositados en el veh\u00EDculo. Acepto la realizaci\u00F3n de la reparaci\u00F3n y autorizo a sus empleados a conducir el veh\u00EDculo de mi propiedad arriba consignado, por las calles o carreteras para efectuar las pruebas que estimen necesarias. Los trabajos se abonar\u00E1n al contado (a la entrega del veh\u00EDculo). Esta reparaci\u00F3n tiene tres meses de garant\u00EDa o 2.000 Kms., a partir de la fecha de entrega. Las aver\u00EDas o defectos ocultos que eventualmente puedan aparecer durante la reparaci\u00F3n del veh\u00EDculo, me ser\u00E1n expuestas para que otorgue mi conformidad. En las reparaciones dentro del periodo de garant\u00EDa, el cliente pagar\u00E1 las piezas, como se especifica en el libro de garant\u00EDa. 
