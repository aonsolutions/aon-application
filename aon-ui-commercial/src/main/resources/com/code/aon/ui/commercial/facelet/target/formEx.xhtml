<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="targetForm">
			<aon:methodParam name="removeAction" value="#{target.backAction}" />

			<ui:insert name="formToolbarContent" />

			<aon:methodParam name="removeAction" value="" />

			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{target.nevv}">
					<ui:include src="/com/code/aon/ui/commercial/facelet/target/formNewContent.xhtml">
						<ui:param name="controller" value="#{target}"/>
					</ui:include>				
				</aon:if>			
				<aon:if test="#{!target.nevv}">
					<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto,
							aon-panelGrid-odd aon-width-120,
							aon-panelGrid-even aon-width-auto">
	
						<ui:include 
							src="/com/code/aon/ui/commercial/facelet/target/formContent.xhtml">
							<ui:param name="controller" value="#{target}"/>
						</ui:include>
					</aon:panelGrid>
				
					<aon:panelGrid id="infoDataTable"
						styleClass="aon-margin-top aon-width-all" columns="2"
						columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-auto">
	
						<aon:if test="#{aonConfiguration.bean.target.showTariff}">
							<aon:outputLabel for="Target_tariff_id"
								value="#{bundle.report_tariff}" />
							<aon:selectOneMenu id="Target_tariff_id"
								value="#{target.to.tariff}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{configCollections.salesTariffs}" />
							</aon:selectOneMenu>
						</aon:if>

						<aon:outputLabel for="Observation"
							value="#{bundle.registry_observation}" />
						<aon:inputTextarea id="Observation" cols="120" rows="3"
							value="#{targetObservation.observation.comments}" />

					</aon:panelGrid>

					<aon:panelTabSet id="targetTab" selectedTab="#{target.selectedTab}">

						<aon:panelTab id="targetAddress" label="#{bundle.registry_address_module}">
							<ui:include src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{targetAddress}" />
							</ui:include>
						</aon:panelTab>
						
						<aon:panelTab id="targetMedia" label="#{bundle.aon_contacts}">
							<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{targetMedia}" />
							</ui:include>
						</aon:panelTab>

						<aon:if test="#{aonConfiguration.bean.target.showFinanceData}">
							<aon:panelTab id="finance" label="#{bundle.registry_finance_data_module}">
								<aon:panel>
									<f:facet name="header">
										<aon:outputText
											value="#{bundle.registry_banks_module}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
										<ui:param name="controller" value="#{targetRbank}" />
									</ui:include>
								</aon:panel>
								<aon:panel>
									<f:facet name="header">
										<aon:outputText	value="#{bundle.config_predef_paymethod}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
										<ui:param name="controller" value="#{targetRPayMethod}" />
									</ui:include>
								</aon:panel>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.target.showNote and targetNote.model.rowCount > 0}">
							<aon:panelTab id="targetNote" label="#{bundle.aon_notes}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/rnote/grid.xhtml">
									<ui:param name="controller" value="#{targetNote}" />
									<ui:param name="removeButtonReRender" value="targetTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{targetSegment.model.rowCount > 0}">
							<aon:panelTab id="targetSegment" label="#{bundle.registry_segment_module}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rsegment/tab_grid.xhtml">
									<ui:param name="controller" value="#{targetSegment}" />
									<ui:param name="removeButtonReRender" value="targetTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
 
						<aon:if test="#{aonConfiguration.bean.target.showDirStaff and targetDirStaff.model.rowCount > 0}">
							<aon:panelTab id="dirStaff" label="#{bundle.registry_dir_staff}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/rdirstaff/tab_grid.xhtml">
									<ui:param name="controller" value="#{targetDirStaff}" />
									<ui:param name="removeButtonReRender" value="targetTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
						
						<aon:if test="#{aonConfiguration.bean.target.showAddInfo and targetAddInfo.model.rowCount > 0}">
							<aon:panelTab id="addInfo" label="#{bundle.aon_addInfo}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/raddinfo/tab_grid.xhtml">
									<ui:param name="controller" value="#{targetAddInfo}" />
									<ui:param name="removeButtonReRender" value="targetTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
						
						<aon:if test="#{aonConfiguration.bean.target.showProduct and targetItem.model.rowCount > 0}">
							<aon:panelTab id="targetItem" label="#{bundle.aon_role_product}">
								<ui:include src="/com/code/aon/ui/registry/facelet/ritem/tab_grid.xhtml" >
									<ui:param name="controller" value="#{targetItem}" />
									<ui:param name="removeButtonReRender" value="targetTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.target.showSeller and targetSeller.model.rowCount > 0}">
							<aon:panelTab id="targetSeller" label="#{bundle.aon_module_commercial}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rseller/tab_grid.xhtml" >
									<ui:param name="controller" value="#{targetSeller}" />
									<ui:param name="removeButtonReRender" value="targetTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.target.showProject and targetProjectCommercial.model.rowCount > 0}">
							<aon:panelTab id="targetProjectCommercial" label="#{bundle.commercial_target_operation_module}">
								<ui:include src="/com/code/aon/ui/commercial/facelet/targetProjectCommercial/grid.xhtml" >
									<ui:param name="removeButtonReRender" value="targetTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.target.showProfile and targetProfile.model.rowCount > 0}">
							<aon:panelTab id="targetProfile" label="#{bundle.registry_profile}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rprofile/tab_grid.xhtml" >
									<ui:param name="controller" value="#{targetProfile}" />
									<ui:param name="removeButtonReRender" value="targetTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
						
						<aon:if test="#{aonConfiguration.bean.target.showSupplier and targetSupplier.model.rowCount > 0}">
							<aon:panelTab id="targetSupplier" label="#{bundle.registry_supplier_info}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rsupplier/tab_include.xhtml">
									<ui:param name="controller" value="#{targetSupplier}" />
									<ui:param name="removeButtonReRender" value="targetTab" />
								</ui:include>
 							</aon:panelTab>
						</aon:if>
						
						<aon:if test="#{aonRole.document and targetRAttach.model.rowCount > 0}">
							<aon:panelTab id="documentManagement" label="#{bundle.aon_documents}">
								<ui:include src="/com/code/aon/ui/registry/facelet/documentManager/tab_grid.xhtml">
									<ui:param name="controller" value="#{targetRAttach}" />
									<ui:param name="removeButtonReRender" value="targetTab" />
								</ui:include>								
							</aon:panelTab>
						</aon:if>
												
					</aon:panelTabSet>
				</aon:if>
			</aon:div>
		</aon:form>
		<aon:if test="#{!target.nevv}">
			<aon:if test="#{aonConfiguration.bean.target.showProduct}">
				<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
			</aon:if>	
			<aon:if test="#{aonConfiguration.bean.target.showSeller}">
				<aon:lookupButtonPopup lookup="#{sellerLookup}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.target.showProfile}">
				<aon:lookupButtonPopup lookup="#{questionLookup}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.rmedia.showSendEmail}">
				<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
			</aon:if>					
			<aon:if test="#{aonConfiguration.bean.target.showSupplier}">
				<aon:lookupButtonPopup lookup="#{supplierLookup}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.target.showProject}">
				<aon:lookupButtonPopup lookup="#{targetLookup}" />
			</aon:if>
			
			
			<aon:if test="#{aonConfiguration.bean.target.showNote}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rnote/newNoteModal.xhtml">
					<ui:param name="controller" value="#{target}" />
					<ui:param name="noteController" value="#{targetNote}" />
					<ui:param name="modalReRender" value="targetTab" />
				</ui:include>
			</aon:if>
			<ui:include src="/com/code/aon/ui/registry/facelet/rsegment/newSegmentModal.xhtml">
				<ui:param name="controller" value="#{target}" />
				<ui:param name="segmentController" value="#{targetSegment}" />
				<ui:param name="modalReRender" value="targetTab" />
			</ui:include>
			<aon:if test="#{aonConfiguration.bean.target.showAddInfo}">
				<ui:include src="/com/code/aon/ui/registry/facelet/raddinfo/newAddInfoModal.xhtml">
					<ui:param name="controller" value="#{target}" />
					<ui:param name="addInfoController" value="#{targetAddInfo}" />
					<ui:param name="modalReRender" value="targetTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.target.showDirStaff}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rdirstaff/newDirStaffModal.xhtml">
					<ui:param name="controller" value="#{target}" />
					<ui:param name="dirStaffController" value="#{targetDirStaff}" />
					<ui:param name="modalReRender" value="targetTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.target.showProduct}">
				<ui:include src="/com/code/aon/ui/registry/facelet/ritem/newItemModal.xhtml">
					<ui:param name="controller" value="#{target}" />
					<ui:param name="registryItemController" value="#{targetItem}" />
					<ui:param name="modalReRender" value="targetTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.target.showProject}">
				<ui:include src="/com/code/aon/ui/commercial/facelet/projectCommercial/newProjectCommercialModal.xhtml">
					<ui:param name="controller" value="#{target}" />
					<ui:param name="projectCommercialController" value="#{targetProjectCommercial}" />
					<ui:param name="modalReRender" value="targetTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.target.showProfile}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rprofile/newProfileModal.xhtml">
					<ui:param name="controller" value="#{target}" />
					<ui:param name="registryProfileController" value="#{targetProfile}" />
					<ui:param name="modalReRender" value="targetTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.target.showSupplier}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rsupplier/newSupplierModal.xhtml">
					<ui:param name="controller" value="#{target}" />
					<ui:param name="registrySupplierController" value="#{targetSupplier}" />
					<ui:param name="modalReRender" value="targetTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.target.showSeller}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rseller/newSellerModal.xhtml">
					<ui:param name="controller" value="#{target}" />
					<ui:param name="registrySellerController" value="#{targetSeller}" />
					<ui:param name="modalReRender" value="targetTab" />
				</ui:include>
			</aon:if>
			<ui:include src="/com/code/aon/ui/registry/facelet/rattach/newAttachModal.xhtml">
				<ui:param name="controller" value="#{target}" />
				<ui:param name="attachmentController" value="#{targetRAttach}" />
				<ui:param name="modalReRender" value="targetTab" />
			</ui:include>
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
				<ui:param name="auditableController" value="#{target}" />
			</ui:include>						
			<aon:if test="#{aonConfiguration.bean.customer.showFinanceData}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
					<ui:param name="bankAccountController" value="#{targetRbank.accountHelper}" />
					<ui:param name="modalReRender" value="targetTab" />
				</ui:include>
			</aon:if>						
			<aon:if test="#{aonConfiguration.bean.target.showSupplier}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
					<ui:param name="bankAccountController" value="#{targetSupplier.accountHelper}" />
					<ui:param name="bankAccountWindowSuffix" value="-RSupplier" />
					<ui:param name="modalReRender" value="RegistrySupplier_payMethodPanel" />
				</ui:include>
			</aon:if>
		</aon:if>
		<aon:if test="#{target.nevv}">
			<aon:if test="#{aonConfiguration.bean.customer.showFinanceData}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
					<ui:param name="bankAccountController" value="#{targetForm.accountHelper}" />
					<ui:param name="modalReRender" value="Registry-PayMethodDiv" />
				</ui:include>				
			</aon:if>	
		</aon:if>
	</ui:define>
</ui:composition>
