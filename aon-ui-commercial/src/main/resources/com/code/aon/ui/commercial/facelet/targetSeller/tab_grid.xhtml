<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{targetSeller}" />
		
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="Seller_id" value="#{salesBundle.sales_seller}" />
				</f:facet>
				<aon:outputText value="#{to.seller.registry.name}"
					rendered="#{formList}" />
					
				<ui:include src="/com/code/aon/ui/sales/facelet/seller/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{targetSeller.to.seller}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupInputSuggestSize" value="40" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
				</ui:include>
				<f:facet name="footer" >
					<ui:include src="/com/code/aon/ui/sales/facelet/seller/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{targetSeller.to.seller}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupInputSuggestSize" value="40" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="lookupSuffix" value="-New" />
					</ui:include>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="TargetSeller_startDate" value="#{bundle.aon_start_date}" />
				</f:facet>
				<aon:outputText value="#{to.startDate}"	rendered="#{formList}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="TargetSeller_startDate" rendered="#{formEdit}"
					value="#{controller.to.startDate}" required="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}"/>
				<f:facet name="footer">
					<aon:selectInputDate id="TargetSeller_startDate-New" rendered="#{formNew}"
						value="#{controller.to.startDate}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="TargetSeller_endDate" value="#{bundle.aon_end_date}" />
				</f:facet>
				<aon:outputText value="#{to.endDate}" rendered="#{formList}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="TargetSeller_endDate" rendered="#{formEdit}"
					value="#{controller.to.endDate}"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}"/>
				<f:facet name="footer">
					<aon:selectInputDate id="TargetSeller_endDate-New" rendered="#{formNew}"
						value="#{controller.to.endDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</f:facet>
			</aon:column>
					
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="TargetSeller_status" value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="TargetSeller_status" rendered="#{formEdit}"
					required="true" value="#{controller.to.status}">
					<f:selectItem value="#{null}" itemLabel="    " />
					<f:selectItems value="#{commercialCollections.targetSellerStatuses}" />
				</aon:selectOneMenu>								
				<f:facet name="footer">
					<aon:selectOneMenu id="TargetSeller_status-New" rendered="#{formNew}"
						required="true" value="#{controller.to.status}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{commercialCollections.targetSellerStatuses}" />
					</aon:selectOneMenu>								
				</f:facet>
			</aon:column>
			
		</ui:define>
	</ui:decorate>
		
</ui:composition>
