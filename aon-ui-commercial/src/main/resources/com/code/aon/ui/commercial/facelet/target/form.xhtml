<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="targetForm">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{target.bundle.commercial_target_module}" />
				<ui:param name="controller" value="#{target}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true">

					<ui:include src="/com/code/aon/ui/commercial/facelet/target/formContent.xhtml">
						<ui:param name="controller" value="#{target}"/>
					</ui:include>

				</aon:panelGrid>

				<c:if test="#{!target.new}">
					<aon:panelTabSet selectedTab="#{target.selectedTab}">

						<aon:panelTab id="targetAddress" label="#{registryBundle.registry_address_module}">
							<ui:include src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{targetAddress}" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="targetMedia" label="#{registryBundle.registry_media_module}">
							<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{targetMedia}" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="targetSegment" label="#{commercialBundle.commercial_target_segment_module}">
							<ui:include src="/com/code/aon/ui/commercial/facelet/targetSegment/tab_grid.xhtml" />
						</aon:panelTab>

						<c:if test="#{target.showProduct}">
							<aon:panelTab id="targetItem" label="#{productBundle.product_module}">
								<ui:include src="/com/code/aon/ui/commercial/facelet/targetItem/tab_grid.xhtml" />
							</aon:panelTab>
						</c:if>

						<c:if test="#{target.showSeller}">
							<aon:panelTab id="targetSeller" label="#{salesBundle.sales_seller}">
								<ui:include src="/com/code/aon/ui/commercial/facelet/targetSeller/tab_grid.xhtml" />
							</aon:panelTab>
						</c:if>

						<c:if test="#{target.showCommercialTracking}">
							<aon:panelTab id="targetTracking" label="#{commercialBundle.commercial_target_tracking_module}">
								<ui:include src="/com/code/aon/ui/commercial/facelet/targetTracking/tab_list.xhtml" />
							</aon:panelTab>
						</c:if>

						<c:if test="#{target.showProfile}">
							<aon:panelTab id="targetProfile" label="#{marketingBundle.marketing_target_profile}">
								<ui:include src="/com/code/aon/ui/marketing/facelet/targetProfile/tab_grid.xhtml" />
							</aon:panelTab>
						</c:if>
						<c:if test="#{aonConfiguration.bean.commercial.showEcommerceTab}">
							<aon:panelTab id="ecommerceTarget"
								label="#{commercialBundle.commercial_target_ecommerce}">
								<ui:include
									src="/com/code/aon/ui/ebackoffice/facelet/ecTarget/tab_grid.xhtml" />
							</aon:panelTab>
						</c:if>
						
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<c:if test="#{target.showProduct}">
			<aon:lookupButtonPopup lookup="#{itemLookup}" />
		</c:if>	
		<c:if test="#{target.showSeller}">
			<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		</c:if>
		<c:if test="#{target.showProfile}">
			<aon:lookupButtonPopup lookup="#{questionLookup}" />
		</c:if>	
	</ui:define>
</ui:composition>

</body>
</html>
