<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="commissionCalculationForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{commercialBundle.commercial_commission_calculation_module}" />
				<ui:param name="controller" value="#{commissionCalculation}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="resetAction" value="" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="backAction" value="" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="commissionCalculation"
						value="#{commercialBundle.commercial_commission_calculate}"
						actionListener="#{commissionCalculation.onCalculate}" action="offerDetailCommission_list"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_invoicing_criteria}" />
				</f:facet>
				<aon:panelGrid columns="2">
				
					<ui:include src="/com/code/aon/ui/sales/facelet/sales/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{commissionCalculation.seller}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>

					<aon:outputLabel value="#{bundle.aon_period}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel for="Calculation_fromDate"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="Calculation_fromDate"
							value="#{commissionCalculation.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="Calculation_toDate"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="Calculation_toDate"
							value="#{commissionCalculation.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>

					<aon:outputLabel for="Calculation_series"
						value="#{bundle.aon_series}" />
					<aon:selectOneMenu id="Calculation_series"
						value="#{commissionCalculation.series}">
						<f:selectItem itemLabel=" " value="#{null}"/>
						<f:selectItems value="#{configCollections.offerSeries}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_number}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel for="Calculation_fromNumber"
							value="#{bundle.aon_date_from}" />
						<aon:inputText id="Calculation_fromNumber"
							 styleClass="aon-margin-left"
							value="#{commissionCalculation.fromNumber}" size="7" />

						<aon:outputLabel for="Calculation_toNumber"
							value="#{bundle.aon_date_to}" />
						<aon:inputText id="Calculation_toNumber"
							 styleClass="aon-margin-left"
							value="#{commissionCalculation.toNumber}" size="7" />
					</aon:panelGrid>

					<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{commissionCalculation.target}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>

					<c:if test="#{aonRole.confidentiality}">
						<aon:outputLabel for="Calculation_Confidential"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneRadio id="Calculation_Confidential" 
							value="#{commissionCalculation.confidential}">
							<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
							<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
						</aon:selectOneRadio>
					</c:if>

					<aon:outputLabel for="Calculation_WorkPlace"
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Calculation_WorkPlace"
						value="#{commissionCalculation.workPlace}">
						<f:selectItem itemLabel="-" itemValue="#{null}" />
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>
 				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
