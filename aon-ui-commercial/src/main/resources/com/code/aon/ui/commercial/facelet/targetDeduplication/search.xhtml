<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="targetDeduplicationSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.commercial_target_deduplication_module}" />
				<ui:param name="controller" value="#{target}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipBackButton" value="#{true}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">

					<aon:methodParam name="searchActionListener" value="#{targetDeduplication.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="targetDeduplication_list" />

					<ui:decorate template="/com/code/aon/ui/commercial/facelet/target/searchContent.xhtml">
						<ui:param name="controller" value="#{target}"/>
						<ui:param name="searchController" value="#{targetSearch}" />
						<ui:define name="beforeTargetSearchContent">

							<aon:outputLabel for="Deduplication_type"
								value="#{bundle.aon_search_param}" />
							<aon:selectOneMenu id="Deduplication_type" required="true"
								value="#{targetDeduplication.type}" >
								<f:selectItem value="#{null}" itemLabel="-"/>
								<f:selectItems value="#{commercialCollections.deduplicationTypes}" />
							</aon:selectOneMenu>
	
						</ui:define>
					</ui:decorate>
					
				</ui:define>
			</ui:decorate>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />			
		<aon:lookupButtonPopup lookup="#{questionLookup}" />
		<aon:lookupButtonPopup lookup="#{campaignActionLookup}" />
	</ui:define>
</ui:composition>
