<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include	src="/com/code/aon/ui/registry/facelet/registry/formContent.xhtml" />

	<aon:outputLabel for="Target_scope_id" value="#{bundle.aon_scope}" />
	<aon:div>
		<aon:selectOneMenu id="Target_scope_id" value="#{controller.to.scope}">
			<f:selectItems value="#{configCollections.currentUserScopes}" />
		</aon:selectOneMenu>
		<aon:outputLabel for="Target_advertising" styleClass="aon-italic aon-margin-left aon-margin-right"
			value="#{commercialBundle.commercial_target_advertising}" />
		<aon:selectOneMenu id="Target_advertising" value="#{controller.to.advertising}"
			required="true">
			<f:selectItem itemLabel="-" value="#{null}"/>
			<f:selectItems value="#{commercialCollections.advertisings}" />
		</aon:selectOneMenu>
	</aon:div>

	<aon:outputLabel for="Target_status" value="#{bundle.aon_status}" />
	<aon:selectOneRadio id="Target_status" value="#{controller.to.status}">
		<f:selectItems value="#{commercialCollections.targetStatuses}" />
	</aon:selectOneRadio>

	<c:if test="#{aonConfiguration.bean.target.showTaxInfoData}">
		<aon:outputLabel for="Target_transaction" value="#{commercialBundle.commercial_target_transaction_type}" />
		<aon:selectOneRadio id="Target_transaction" value="#{controller.to.transaction}">
			<f:selectItems value="#{configCollections.invoiceTransactionTypes}" />
		</aon:selectOneRadio>

		<aon:outputText value="#{commercialBundle.commercial_target_taxes}" />
		<aon:div>
			<aon:selectBooleanCheckbox id="Target_surcharge" styleClass="aon-margin-left"
				value="#{controller.to.surcharge}" />
			<aon:outputLabel for="Target_surcharge" styleClass="aon-italic"
				value="#{bundle.aon_surcharge}" />
			<aon:selectBooleanCheckbox id="Target_withholding" styleClass="aon-margin-left"
				value="#{controller.to.withholding}" />
			<aon:outputLabel for="Target_withholding" styleClass="aon-italic"
				value="#{bundle.aon_retention}" />
		</aon:div>
	</c:if>
	
	<c:if test="#{aonConfiguration.bean.target.showTariff}">
		<aon:outputLabel for="Target_tariff_id"
			value="#{productBundle.product_tariff}" />
		<aon:selectOneMenu id="Target_tariff_id"
			value="#{controller.to.tariff}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{configCollections.tariffs}" />
		</aon:selectOneMenu>
	</c:if>

	<c:if test="#{!controller.new and aonConfiguration.bean.target.showSearchOnlyCustomers}">
		<aon:outputLabel for="Target_customer"
			value="#{commercialBundle.commercial_target_customer}" />
		<aon:div id="TargetCustomerDiv">
			<aon:outputText id="Target_customer" 
				value="#{controller.to.customer ? bundle.aon_yes : bundle.aon_no}" />
			<aon:commandLink id="customer_link" immediate="true"
				styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
				value="&#160;" title="#{bundle.aon_go}"
				rendered="#{controller.to.customer}"
				actionListener="#{controller.onLoadCustomer}"
				action="customer_form" />
			<aon:commandButton
				value="#{commercialBundle.commercial_target_create_customer}" 
				title="#{commercialBundle.commercial_target_create_customer}"
				style="border: #808080 1px solid;"
				styleClass="aon-finding-toolbar-item aon-icon-reset"
				rendered="#{!controller.to.customer}"
				actionListener="#{controller.onCreateCustomer}"
				reRender="TargetCustomerDiv">
			</aon:commandButton>
		</aon:div>
	</c:if>

</ui:composition>
