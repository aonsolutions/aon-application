<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:methodParam name="lookupChangeListener"
		value="#{offerDetail.onItemChanged}" type="lookupChangeListener" />		

	<ui:decorate template="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
		<ui:param name="lookupBean" value="#{saleItemLookup}" />
		<ui:param name="lookupTo" value="#{offerDetail.to.item}" />
		<ui:param name="skipLabel" value="#{true}" />
		<ui:param name="skipSuggestText" value="#{offerDetail.to.item != null and offerDetail.to.item.id != null}" />

		<ui:define name="searchButtonContent">
			<f:setPropertyActionListener target="#{itemSearch.supplierParam}"
				value="#{offer.to.supplier}" />
		</ui:define>

	</ui:decorate>	

</ui:composition>
