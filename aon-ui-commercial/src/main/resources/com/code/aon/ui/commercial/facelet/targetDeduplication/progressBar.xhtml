<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:form id="progressBarForm">
		<rich:modalPanel id="progressBarWindow" minWidth="220"
			showWhenRendered="#{targetDeduplication.showProgressBarWindow and (controller.maxProgressValue > 0)}" >
			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="#{bundle.commercial_target_deduplication_module}" />
				</aon:div>
			</f:facet>

			<aon:div id="progressPanel" styleClass="aon-scroll-area aon-width-220">
				<rich:progressBar 
					value="#{controller.progressValuePercent}"
					label="#{controller.progressValuePercent} %"
					enabled="#{controller.enabledProgressBar}" interval="2000"
					minValue="-1" maxValue="100" 
					reRender="progressDiv"
					reRenderAfterComplete="progressPanel">
				</rich:progressBar>
				<aon:div id="progressDiv">
					<h:panelGrid columns="2" styleClass="aon-margin-top aon-bold">
						<aon:outputText value="#{bundle.commercial_target_module}: "/>										
						<aon:outputText value="#{controller.progressValue} / #{controller.maxProgressValue}"/>
						<aon:outputText value="#{bundle.aon_duplicates}: "/>
						<aon:outputText value="#{controller.numberOfDuplicates}"/>
					</h:panelGrid>
					<aon:div styleClass="aon-text-center">
						<aon:div styleClass="aon-margin-top">
							<c:if test="#{controller.enabledProgressBar}">
								<aon:commandButton 
									value="#{bundle.aon_fileUpload_stop}"
									action="targetDeduplication_list" 
									actionListener="#{controller.onStopSearch}" >
								</aon:commandButton>
							</c:if>
							<c:if test="#{!controller.enabledProgressBar}">
								<aon:commandButton 
									value="#{bundle.aon_close}" 
									action="targetDeduplication_list"
									actionListener="#{targetDeduplication.onCloseProgressBarWindow}" />
							</c:if>
						</aon:div>
					</aon:div>
				</aon:div>
			</aon:div>
		</rich:modalPanel>
	</aon:form>

</ui:composition>
