<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="offerList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{commercialBundle.commercial_expense_control_module}" />
				<ui:param name="controller" value="#{expenseAccount}" />
				<ui:define name="additionalToolbarContent">
					<h:commandLink id="expenseAccountExcel" value="&#160;"
						target="_blank" action="#{report.onExecute}"
						rendered="#{!expenseAccount.new}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="expenseAccountList" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink id="expenseAccountWord" value="&#160;"
						target="_blank" action="#{report.onExecute}"
						rendered="#{!expenseAccount.new}"
						styleClass="aon-finding-toolbar-item aon-icon-word aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="expenseAccountList" />
						<f:param name="outputFormat" value="DOCX" />
					</h:commandLink>
					<h:commandLink id="expenseAccountPDF" target="_blank"
						action="#{report.onExecute}" rendered="#{!expenseAccount.new}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="expenseAccountList" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{expenseAccount}" />
					<ui:param name="columnClasses"
						value="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn,aon-editDataTable-numberColumn" />

					<ui:define name="columns">
						<aon:column>
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.registry.fullName}" />
						</aon:column>
						<aon:column>
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.type}" />
						</aon:column>
						<aon:column>
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
							<aon:column>
						<f:facet name="header">
								<h:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText  
							value="#{expenseAccount.expenseTotalAmount}" rendered="#{!formNew}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						</aon:column>
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
