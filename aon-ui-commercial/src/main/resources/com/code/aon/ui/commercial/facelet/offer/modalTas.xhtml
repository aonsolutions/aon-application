<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showProjectTasWindow">
		<aon:if test="#{offer.showProjectTasWindow}">
			<rich:modalPanel id="projectTasModalPanel"
				minHeight="240" minWidth="740" zindex="90"
				showWhenRendered="#{offer.showProjectTasWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.commercial_offer_to_projectTas}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showProjectTasWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{offer.showProjectTasWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="projectTasForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="projectTas-accept"
										value="#{bundle.commercial_offer_to_projectTas}"
										actionListener="#{offer.onProjectTas}"
										action="projectTas_form"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="projectTasModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{offer.showProjectTasWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="projectTas-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showProjectTasWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{offer.showProjectTasWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" style="width: 80%;">

										<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
											<ui:param name="controller" value="#{projectTas}" />
											<ui:param name="sfc_aliasPreffix" value="Offer_projectTas" />
											<ui:param name="sfc_editable" value="#{true}" />
											<ui:param name="sfc_seriesProperty" value="#{offer.projectTasSeries}" />
											<ui:param name="sfc_numberProperty" value="#{offer.projectTasNumber}" />
											<aon:methodParam name="sfc_onSeriesChanged" type="valueChangeListener"
												value="#{offer.onProjectTasSeriesChanged}" />	
											<aon:methodParam name="sfc_onNumberEditable" type="actionListener"
												value="#{offer.onProjectTasNumberEditable}" />
										</ui:include>

										<aon:outputLabel for="Offer_projectTasDate"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Offer_projectTasDate" 
											value="#{offer.projectTasDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-100" />

										<ui:include src="/com/code/aon/ui/tas/facelet/tasItem/lookup.xhtml">
											<ui:param name="lookupTo" value="#{offer.projectTasItem}" />
											<ui:param name="lookupReRender" value="projectTasForm" />
											<ui:param name="idRequired" value="#{true}" />
										</ui:include>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
				<aon:lookupButtonPopup lookup="#{tasItemLookup}" />
				<aon:lookupButtonPopup lookup="#{modelLookup}" />
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
