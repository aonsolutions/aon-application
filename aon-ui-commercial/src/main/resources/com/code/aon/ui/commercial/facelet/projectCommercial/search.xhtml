<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
		<ui:include
			src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />
		<aon:form id="projectCommercialSearch">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.commercial_operation_module}" />
				<ui:param name="controller" value="#{projectCommercial}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:if test="#{domainSwitcher.betaUser or customer.ceconsulting}">
						<aon:commandLink id="projectCommercial-import" value="#{bundle.aon_import}"
							onclick="projectCommercial()"
							styleClass="aon-finding-toolbar-item aon-icon-import-excel-trans">
						</aon:commandLink>
					</aon:if>
				</ui:define>
			</ui:decorate>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{projectCommercial}" />
				<ui:define name="searchContent">
				
					<ui:include
						src="/com/code/aon/ui/commercial/facelet/projectCommercial/searchContent.xhtml" />

				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{targetLookup}" />		
	</ui:define>
		
</ui:composition>
