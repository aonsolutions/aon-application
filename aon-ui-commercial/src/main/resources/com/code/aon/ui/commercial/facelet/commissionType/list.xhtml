<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="commissionTypeList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="toolbarTitle" value="#{bundle.commercial_commission_type_module}" />
				<ui:param name="controller" value="#{commissionType}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{commissionType}" />
					<ui:define name="columns">

						<aon:column alias="CommissionType.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.config_commission_type}" />
							</f:facet>
							<aon:outputText value="#{to.name}" />
						</aon:column>
						
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
