<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="targetDeduplicationList">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.commercial_target_deduplication_module}" />
				<ui:param name="controller" value="#{targetDeduplication}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<aon:methodParam name="searchAction" value="targetDeduplication_search" />
			</ui:include>			

			<!--  aon-region-body -->
			<aon:div id="targetDeduplicationDiv" styleClass="aon-scroll-area">
			
				<aon:methodParam name="rowSelectorActionListener"
					value="#{targetDeduplication.onSelectEntry}" type="actionListener" />
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{targetDeduplication}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:param name="rowSelectorReRender" value="targetDeduplicationDiv" />
					<ui:define name="columns">
					
						<aon:column styleClass="aon-editDataTable-textColumn" colspan="5">
							<f:facet name="header">
								<aon:outputText value="#{targetDeduplication.type.name}" />
							</f:facet>
							<aon:outputText value="#{to.value}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_duplicates}" />
							</f:facet>
							<aon:outputText value="#{to.size}" />
						</aon:column>
						
						<rich:subTable rendered="#{to.checked}"
							value="#{controller.registryModel}" var="entry"
							rowClasses="aon-subTable-column-yellow">

							<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-subTable-column">
								<aon:outputText value="#{entry.registry.fullName}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-subTable-column aon-width-140">
								<aon:outputText value="#{entry.registry.document}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-subTable-column">
								<aon:outputText value="#{entry.registry.defaultAddress.fullAddress}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-subTable-column">
								<aon:outputText value="#{entry.telephones}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-subTable-column">
								<aon:outputText value="#{entry.registry.emails}" />
							</aon:column>

							<aon:column style="height: 18px;" styleClass="aon-editDataTable-textColumn aon-italic aon-subTable-column">
								<aon:commandLink id="goToTarget" immediate="true"
									styleClass="aon-button-goto" style="padding-right: 20px;padding-top: 2px;" 
									value="&#160;" title="#{bundle.aon_go}"
									action="target_form"
									actionListener="#{targetDeduplication.onGoToTarget}" />
								<aon:commandButton id="activateTarget"
									title="#{bundle.aon_activate}" reRender="targetDeduplicationDiv"							
									actionListener="#{targetDeduplication.onActivateTarget}"
									rendered="#{!entry.active}" ajaxSingle="true"
									styleClass="aon-editDataTable-button aon-icon-removed" />
								<aon:commandButton id="deactivateTarget"
									title="#{bundle.aon_deactivate}" reRender="targetDeduplicationDiv"								
									actionListener="#{targetDeduplication.onDeactivateTarget}"
									rendered="#{entry.active}" ajaxSingle="true"
									styleClass="aon-editDataTable-button aon-icon-accept" />
								<aon:confirmButton id="removeTarget" immediate="true"
									value="&#160;" reRender="targetDeduplicationDiv"
									styleClass="aon-editDataTable-button aon-icon-delete"
									confirmTitle="#{bundle.aon_confirm_title}"
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{targetDeduplication.onRemoveTarget}" />
							</aon:column>
						</rich:subTable>						
					
					</ui:define>
				</ui:decorate>

			</aon:div>
	
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
