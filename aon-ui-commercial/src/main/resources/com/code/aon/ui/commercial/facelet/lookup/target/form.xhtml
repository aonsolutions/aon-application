<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/commercial/facelet/target/formContent.xhtml">
		<ui:param name="controller" value="#{lookup}"/>
	</ui:include>

	<aon:outputLabel for="Company_address" 
		value="#{registryBundle.registry_address}" />
	<aon:div>
		<aon:div>
			<aon:inputText id="Company_address"
				value="#{targetLookupListener.mainAddress.address}" size="64" maxlength="128"/>
		</aon:div>
		<aon:div>
			<aon:inputText id="Company_address2"
				value="#{targetLookupListener.mainAddress.address2}" size="64" maxlength="128"/>
		</aon:div>
		<aon:div>
			<aon:inputText id="Company_address3"
				value="#{targetLookupListener.mainAddress.address3}" size="64" maxlength="128"/>		
		</aon:div>
	</aon:div>
	<aon:outputLabel for="Company_address_city" 
		value="#{registryBundle.registry_city}" />
	<aon:inputText id="Company_address_city" 
		value="#{targetLookupListener.mainAddress.city}" size="64" maxlength="64"/>
		
	<aon:outputLabel for="Company_address_zip" 
		value="#{registryBundle.registry_zip}" />
	<aon:inputText id="Company_address_zip" 
		value="#{targetLookupListener.mainAddress.zip}" size="32" maxlength="16"/>
		
	<aon:outputLabel for="Company_address_geozone" 
		value="#{registryBundle.registry_geozone}" />
	<aon:selectOneMenu id="Company_address_geozone"
		value="#{targetLookupListener.mainAddress.geozone}">
		<f:selectItems value="#{geozoneCollections.geoTrees}" />
	</aon:selectOneMenu>
	
	<aon:outputLabel for="Company_telephone" 
		value="#{registryBundle.registry_phone}" />
	<aon:inputText id="Company_telephone" 
		value="#{targetLookupListener.phone.value}" size="32" maxlength="64"/>
		
	<aon:outputLabel 
		for="Company_fax" 
		value="#{registryBundle.registry_fax}" />
	<aon:inputText  id="Company_fax"
		value="#{targetLookupListener.fax.value}" size="32" maxlength="64"/>
		
	<aon:outputLabel 
		for="Company_email" 
		value="#{registryBundle.registry_email}" />
	<aon:inputText id="Company_email" 
		value="#{targetLookupListener.email.value}" size="64" maxlength="64" onblur="toLowerCase(this);" />
		
	<aon:outputLabel for="Company_web" 
		value="#{registryBundle.registry_web}" />
	<aon:inputText id="Company_web" 
		value="#{targetLookupListener.web.value}" size="64" maxlength="64" onblur="toLowerCase(this);" />

</ui:composition>
