<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputLabel for="Project_name"
		value="#{bundle.aon_name}" />
	<aon:inputText id="Project_name" size="60"
		valueChangeListener="#{controller.addExpression}" />
		
	<aon:outputLabel for="Project_source"
		value="#{commercialBundle.commercial_project_source}" />
	<aon:selectOneMenu id="Project_source"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{commercialCollections.projectSources}" />
	</aon:selectOneMenu>					
		
	<aon:outputText value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="Project_date-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Project_date-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>

		<aon:outputLabel for="Project_date-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Project_date-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>
	</aon:div>						
			
	<ui:include src="/com/code/aon/ui/sales/facelet/seller/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{projectSearch.seller}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{projectSearch.target}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>
	
	<aon:outputLabel for="Project_comments"
		value="#{bundle.aon_comment}" />
	<aon:inputText id="Project_comments" size="60"
		valueChangeListener="#{controller.addExpression}" />					

	<aon:outputLabel for="Project_status"
		value="#{bundle.aon_status}" />
	<aon:selectOneMenu id="Project_status"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{commercialCollections.projectStatuses}" />
	</aon:selectOneMenu>					
	
	<aon:outputLabel for="Project_probability"
		value="#{commercialBundle.commercial_project_probability}" />
	<aon:inputText id="Project_probability" size="60"
		valueChangeListener="#{controller.addExpression}" />					

</ui:composition>
