<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputText value="" />
	<aon:div styleClass="aon-search-content-width">
		<aon:panelCollapsible expanded="true" label="#{bundle.aon_general}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:insert name="beforeTargetSearchContent"/>
				<ui:include src="/com/code/aon/ui/commercial/facelet/target/searchBasicContent.xhtml" />
				<aon:if test="#{aonConfiguration.bean.target.showSearchOnlyCustomers}">
					<aon:outputLabel for="Target_customer"
						value="#{bundle.aon_customer}" />
					<h:panelGrid id="targetCustomerGrid" columns="2">	
						<aon:selectOneMenu id="Target_customer" 
							reRender="targetCustomerGrid"
							value="#{searchController.customer}">
							<f:selectItem value="#{null}" itemLabel="" />
							<f:selectItem itemValue="#{true}" itemLabel="#{bundle.aon_yes}" />
							<f:selectItem itemValue="#{false}" itemLabel="#{bundle.aon_no}" />
						</aon:selectOneMenu>
						<aon:selectManyCheckbox rendered="#{searchController.customer}"
							value="#{searchController.customerStatuses}">
							<f:selectItems value="#{customerCollections.customerStatuses}"/>
						</aon:selectManyCheckbox>		
					</h:panelGrid>					
				</aon:if>					
				<ui:insert name="additionalTargetSearchContent"/>				
			</aon:panelGrid>
		</aon:panelCollapsible>					

		<aon:panelCollapsible expanded="false" label="#{bundle.registry_address_module}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
				<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{bundle.aon_contacts}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
				<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{bundle.registry_segment_module}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
				<ui:include src="/com/code/aon/ui/registry/facelet/rsegment/searchContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:if test="#{aonConfiguration.bean.target.showProduct}">						
			<aon:panelCollapsible expanded="false" label="#{bundle.aon_role_product}" >					
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
					<ui:include src="/com/code/aon/ui/registry/facelet/ritem/searchContent.xhtml">
						<ui:param name="rItemController" value="#{targetItem}" />
					</ui:include>					
				</aon:panelGrid>
			</aon:panelCollapsible>
		</aon:if>

		<aon:if test="#{aonConfiguration.bean.target.showSeller}">						
			<aon:panelCollapsible expanded="false" label="#{bundle.aon_module_commercial}">
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">					
					<ui:include src="/com/code/aon/ui/registry/facelet/rseller/searchContent.xhtml" />					
				</aon:panelGrid>
			</aon:panelCollapsible>
		</aon:if>

		<aon:if test="#{aonConfiguration.bean.target.showProfile}">	
			<aon:panelCollapsible expanded="false" label="#{bundle.registry_profile}">
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">
					<ui:include src="/com/code/aon/ui/registry/facelet/rprofile/searchContent.xhtml" />					
				</aon:panelGrid>
			</aon:panelCollapsible>
		</aon:if>

		<aon:if test="#{aonRole.document}">
			<aon:panelCollapsible expanded="false" label="#{bundle.aon_documents}">
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/rattach/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panelCollapsible>
		</aon:if>

		<ui:include src="/com/code/aon/ui/common/facelet/auditable/searchContent.xhtml" />

	</aon:div>

</ui:composition>
