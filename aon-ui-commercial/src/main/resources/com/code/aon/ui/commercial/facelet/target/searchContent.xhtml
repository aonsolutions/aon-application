<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputText value="" />
	<aon:div styleClass="aon-width-600">
		<aon:panelCollapsible expanded="true" label="#{bundle.aon_general}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:include src="/com/code/aon/ui/commercial/facelet/target/searchBasicContent.xhtml" />
				<c:if test="#{aonConfiguration.bean.target.showSearchOnlyCustomers}">
					<aon:outputLabel for="Target_customer"
						value="#{commercialBundle.commercial_target_customer}" />
					<aon:selectOneMenu id="Target_customer" 
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem value="#{null}" itemLabel="" />
						<f:selectItem itemValue="#{true}" itemLabel="#{bundle.aon_yes}" />
						<f:selectItem itemValue="#{false}" itemLabel="#{bundle.aon_no}" />
					</aon:selectOneMenu>
				</c:if>									
			</aon:panelGrid>
		</aon:panelCollapsible>					
					
		<aon:panelCollapsible expanded="false" label="#{registryBundle.registry_address_module}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
				<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml">
					<ui:param name="searchController" value="#{targetSearch}" />
				</ui:include>
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{registryBundle.registry_media_module}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
				<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml">
					<ui:param name="searchController" value="#{targetSearch}" />
				</ui:include>
			</aon:panelGrid>
		</aon:panelCollapsible>
				
		<aon:panelCollapsible expanded="false" label="#{registryBundle.registry_segment_module}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
				<ui:include src="/com/code/aon/ui/registry/facelet/rsegment/searchContent.xhtml">
					<ui:param name="searchController" value="#{targetSearch}" />
				</ui:include>
			</aon:panelGrid>
		</aon:panelCollapsible>

		<c:if test="#{aonConfiguration.bean.target.showProduct}">						
			<aon:panelCollapsible expanded="false" label="#{productBundle.product_module}" >					
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">					
					<aon:outputLabel for="Target_items_item_product_code"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Target_items_item_product_code"
						size="20" valueChangeListener="#{controller.addExpression}" />
					
					<aon:outputLabel for="Target_items_item_product_name"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Target_items_item_product_name"
						size="60" valueChangeListener="#{controller.addExpression}" />
					 
					<aon:outputLabel for="Target_items_item_product_category_id"
						value="#{productBundle.product_category}" />
					<aon:selectOneMenu id="Target_items_item_product_category_id"
						value="#{productCollections.category}"
						valueChangeListener="#{controller.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{productCollections.categories}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Target_items_item_status"
						value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="Target_items_item_status"
						converter="aon.EnumConverter"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{productCollections.productStatuses}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:panelCollapsible>
		</c:if>
						
		<c:if test="#{aonConfiguration.bean.target.showSeller}">						
			<aon:panelCollapsible expanded="false" label="#{sellerBundle.seller_seller}">
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">					
					<aon:outputLabel for="Target_sellers_seller_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Target_sellers_seller_id" size="60"
						valueChangeListener="#{controller.addExpression}" />
				
					<aon:outputLabel for="Target_sellers_seller_registry_document"
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Target_sellers_seller_registry_document" size="60"
						valueChangeListener="#{controller.addExpression}" />
				
					<aon:outputLabel for="Target_sellers_seller_registry_name"
						value="#{bundle.aon_company_name}" />
					<aon:inputText id="Target_sellers_seller_registry_name" size="60"
						valueChangeListener="#{controller.addExpression}" />
				
					<aon:outputLabel for="Target_sellers_seller_registry_alias"
						value="#{bundle.aon_company_alias}" />
					<aon:inputText id="Target_sellers_seller_registry_alias" size="60"
						valueChangeListener="#{controller.addExpression}" />
				</aon:panelGrid>
			</aon:panelCollapsible>
		</c:if>

		<c:if test="#{aonConfiguration.bean.target.showCommercialTracking}">
			<aon:panelCollapsible expanded="false" label="#{commercialBundle.commercial_target_tracking_module}">
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
					<aon:outputText value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Target_trackings_date-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Target_trackings_date-From"
							valueChangeListener="#{target.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
			
						<aon:outputLabel for="Target_trackings_date-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Target_trackings_date-To"
							valueChangeListener="#{target.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
			
					<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{targetSearch.seller}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>
					
					<aon:outputLabel for="Target_trackings_activity_id"
						value="#{commercialBundle.commercial_tracking_activity}" />
					<aon:selectOneMenu id="Target_trackings_activity_id" 
						value="#{targetSearch.activity}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{commercialCollections.activities}" />
					</aon:selectOneMenu>
	
					<aon:outputText value="#{bundle.aon_status}"/>
					<aon:selectManyCheckbox value="#{targetSearch.trackingStatuses}">
						<f:selectItems value="#{commercialCollections.commercialTrackingStatuses}"/>
					</aon:selectManyCheckbox>							
	
					<aon:outputLabel for="Target_trackings_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputText id="Target_trackings_comments" size="60"
						valueChangeListener="#{controller.addExpression}" />													
				</aon:panelGrid>
			</aon:panelCollapsible>
		</c:if>

		<c:if test="#{aonConfiguration.bean.target.showProfile}">	
			<aon:panelCollapsible expanded="false" label="#{commercialBundle.commercial_target_profile}">
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">
					<aon:outputText value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Target_profiles_lastUpdate-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Target_profiles_lastUpdate-From"
							valueChangeListener="#{target.addGreaterThanOrEqualExpression}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
			
						<aon:outputLabel for="Target_profiles_lastUpdate-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Target_profiles_lastUpdate-To"
							valueChangeListener="#{target.addLessThanOrEqualExpression}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
					</aon:div>					

					<ui:include src="/com/code/aon/ui/commercial/facelet/question/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{targetSearch.question}" />
						<ui:param name="lookupControllerListener" value="#{target.questionListener}" />
						<ui:param name="lookupReRender" value="targetProfileValueId" />
						<aon:methodParam name="lookupChangeListener"
							value="#{targetSearch.questionChanged}" type="lookupChangeListener" />														
					</ui:include>
					
					<aon:div styleClass="aon-padding-top">				
						<aon:outputText value="#{bundle.aon_value}" />
					</aon:div>
					<aon:div id="targetProfileValueId">
						<aon:div rendered="#{targetSearch.questionResolved}">
							<ui:include src="/com/code/aon/ui/commercial/facelet/valueHolder/inputValueEx.xhtml" >
								<ui:param name="inputId" value="TargetProfile_value" />
								<ui:param name="valueHolder" value="#{targetSearch.questionValue}" />
								<ui:param name="questionValueId" value="#{targetSearch.questionValueId}" />
								<ui:param name="questionValues" value="#{targetSearch.questionValues}" />
							</ui:include>
						</aon:div>								
					</aon:div>
				</aon:panelGrid>
			</aon:panelCollapsible>
		</c:if>

		<c:if test="#{aonConfiguration.bean.target.showEcommerceTab}">						
			<aon:panelCollapsible expanded="false" label="#{commercialBundle.commercial_target_ecommerce}">
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">					
					<aon:outputLabel 
						value="#{commercialBundle.commercial_offer_user}" />
					<aon:inputText size="60"
						value="#{targetSearch.userName}" />
				</aon:panelGrid>
			</aon:panelCollapsible>
		</c:if>		
		
		<c:if test="#{aonRole.document}">
			<aon:panelCollapsible expanded="false" label="#{bundle.aon_documents}">
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/rattach/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panelCollapsible>
		</c:if>
				
	</aon:div>

</ui:composition>
