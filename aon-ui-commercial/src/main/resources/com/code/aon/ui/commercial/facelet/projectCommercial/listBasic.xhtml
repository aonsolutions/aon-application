<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:column styleClass="aon-editDataTable-dateColumn aon-width-80"
		alias="ProjectCommercial.project.date">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.project.date}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
			timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>	
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-200"
		alias="ProjectCommercial.project.name">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_name}" />
		</f:facet>
		<aon:outputText value="#{to.project.name}"/>
	</aon:column>

	<c:if test="#{!skipTarget}">
		<aon:column styleClass="aon-editDataTable-textColumn"
			alias="ProjectCommercial.target.registry.name">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_target}" />
			</f:facet>
			<aon:outputText value="#{to.target.registry.fullName}"/>
		</aon:column>
	</c:if>

</ui:composition>
