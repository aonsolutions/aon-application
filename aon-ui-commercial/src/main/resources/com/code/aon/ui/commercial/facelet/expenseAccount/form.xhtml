<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="expenseAccountForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{commercialBundle.commercial_expense_control_module}" />
				<ui:param name="controller" value="#{expenseAccount}" />
				<ui:define name="beforeSpinToolbarContent">
					<h:commandLink id="expenseAccountExcel" value="&#160;"
						target="_blank" action="#{report.onExecute}"
						rendered="#{!expenseAccount.new}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="expenseAccountForm" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink id="expenseAccountWord" value="&#160;"
						target="_blank" action="#{report.onExecute}"
						rendered="#{!expenseAccount.new}"
						styleClass="aon-finding-toolbar-item aon-icon-word aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="expenseAccountForm" />
						<f:param name="outputFormat" value="DOCX" />
					</h:commandLink>
					<h:commandLink id="expenseAccountPDF" target="_blank"
						action="#{report.onExecute}" rendered="#{!expenseAccount.new}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="expenseAccountForm" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width: 50%;">
					<aon:outputLabel value="#{bundle.aon_description}" />
					<aon:inputText size="50" value="#{expenseAccount.to.description}"
						maxlength="40" />
					<aon:outputLabel for="Seller_id"
						value="#{salesBundle.sales_seller}" />
					<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="Seller_id"
								value="#{expenseAccount.to.registry.id}" size="5"
								lookupProperty="registry" lookup="#{sellerLookup}"
								reRender="Seller_full_name" ajaxSingle="true" />
							<aon:lookupButton
								windowTitle="#{salesBundle.sales_seller_selection}"
								minHeight="460" minWidth="650"
								property="#{expenseAccount.to.registry}"
								lookupProperty="registry" lookup="#{sellerLookup}"
								selectReRender="Seller_id,Seller_full_name" actionType="search">
							</aon:lookupButton>
							<aon:lookupButton windowTitle="#{salesBundle.sales_seller_new}"
								minHeight="520" minWidth="650"
								property="#{expenseAccount.to.registry}"
								lookupProperty="registry" lookup="#{sellerLookup}"
								selectReRender="Seller_id,Seller_full_name" actionType="new">
							</aon:lookupButton>
							<aon:inputText id="Seller_full_name"
								value="#{(expenseAccount.to.registry.fullName!=null)?(expenseAccount.to.registry.fullName):('')}"
								disabled="true" size="60" />
						</a4j:region>
					</aon:div>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:selectInputDate id="expenseAccount_issueDate"
						value="#{expenseAccount.to.issueDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel value="#{bundle.aon_type}" />
					<aon:selectOneRadio id="expenseAccount_type"
						value="#{expenseAccount.to.type}">
						<f:selectItems value="#{commercialCollections.expenseHolderTypes}" />
					</aon:selectOneRadio>

					<aon:outputLabel value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="expenseAccount_status"
						value="#{expenseAccount.to.status}">
						<f:selectItems
							value="#{commercialCollections.expenseAccountStatuses}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="expenseAccount_comments" cols="150" rows="2"
						value="#{expenseAccount.to.comments}" />

				</aon:panelGrid>
				<c:if test="#{!expenseAccount.new}">
					<aon:panelTabSet>

						<aon:panelTab id="offerDetail"
							label="#{commercialBundle.commercial_expenses_name2}">
							<ui:include src="grid.xhtml" />
						</aon:panelTab>

					</aon:panelTabSet>
				</c:if>


			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{expenseLookup}" />

	</ui:define>
</ui:composition>
