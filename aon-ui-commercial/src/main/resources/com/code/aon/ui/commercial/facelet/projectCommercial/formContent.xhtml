<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputLabel for="ProjectCommercial_id"
		rendered="#{!controller.nevv}" value="#{bundle.aon_id}" />
	<aon:inputText id="ProjectCommercial_id" value="#{controller.to.id}"
		rendered="#{!controller.nevv}" size="15" disabled="true" />
		
	<aon:outputLabel for="ProjectCommercial_project_name"
		value="#{bundle.aon_name}" />
	<aon:inputText id="ProjectCommercial_project_name" required="true"
		value="#{controller.to.project.name}" size="60" maxlength="64" />
	
	<aon:outputLabel for="ProjectCommercial_source"
		value="#{bundle.aon_source}" />
	<aon:div>
		<aon:selectOneMenu id="ProjectCommercial_source"
			value="#{controller.to.source}" required="true">
			<f:selectItem itemLabel="-" value="#{null}"/>
			<f:selectItems value="#{commercialCollections.projectSources}" />
		</aon:selectOneMenu>
		<aon:outputLabel for="ProjectCommercial_projectType" styleClass="aon-margin-left" 
			value="#{bundle.project_project_type}"/>
		<aon:selectOneMenu id="ProjectCommercial_projectType" styleClass="aon-margin-left"
			value="#{controller.to.project.projectType}">
			<f:selectItem itemLabel="-" value="#{null}"/>
			<f:selectItems value="#{projectCollections.projectTypes}" />
		</aon:selectOneMenu>
	</aon:div>
						
	<aon:outputLabel for="ProjectCommercial_project_date"
		value="#{bundle.aon_date}" />
	<aon:selectInputDate id="ProjectCommercial_project_date" 
		value="#{controller.to.project.date}" required="true"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}">
	</aon:selectInputDate>

	<aon:if test="#{!skipTarget}">
		<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{controller.to.target}" />
			<ui:param name="idRequired" value="#{true}" />
		</ui:include>
	</aon:if>
	
	<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{controller.to.seller}" />
	</ui:include>

	<aon:outputLabel for="ProjectCommercial_comments"
		value="#{bundle.aon_comment}" />
	<aon:inputTextarea id="ProjectCommercial_comments" 
		value="#{controller.to.comments}" cols="80" rows="4" >
		<f:validateLength maximum="65536"/>
	</aon:inputTextarea>
	
	<aon:outputLabel for="ProjectCommercial_status"
		value="#{bundle.aon_status}" />
	<h:panelGrid columns="2" id="ProjectCommercial_statusDiv">
		<aon:selectOneMenu id="ProjectCommercial_status"
			reRender="ProjectCommercial_statusDiv"
			value="#{controller.to.status}">
			<f:selectItems value="#{commercialCollections.projectStatuses}" />
		</aon:selectOneMenu>
		<aon:div styleClass="aon-margin-left"
			rendered="#{controller.to.status  != 'PENDING'}" >
			<aon:selectInputDate id="ProjectCommercial_statusDate" 
				value="#{controller.to.statusDate}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}">
			</aon:selectInputDate>
		</aon:div>						
	</h:panelGrid>					
	
	<aon:outputLabel for="ProjectCommercial_probability"
		value="#{bundle.commercial_project_probability}" />
	<rich:inputNumberSlider id="ProjectCommercial_probability"
		value="#{controller.to.probability}"
		minValue="0" maxValue="100" step="1"/>											

</ui:composition>
