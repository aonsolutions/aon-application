<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputText value="" />
	<aon:div styleClass="aon-search-content-width">

		<aon:panelCollapsible expanded="true" label="#{bundle.aon_invoice_offer}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:include src="/com/code/aon/ui/commercial/facelet/offer/searchBasicContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{bundle.commercial_offer_detail}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
			
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupBean" value="#{saleItemLookup}" />
					<ui:param name="lookupTo" value="#{searchController.item}" />
					<ui:param name="skipNewButton" value="#{true}" />
				</ui:include>

				<aon:outputLabel for="Offer_lines_item_product_category_id"
					value="#{bundle.aon_category}" />
				<aon:selectOneMenu id="Offer_lines_item_product_category_id"
					value="#{productCollections.category}"
					valueChangeListener="#{controller.addIdEqualExpression}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{productCollections.categories}" />
				</aon:selectOneMenu>

				<aon:outputLabel for="Offer_lines_item_product_type"
					value="#{bundle.aon_type}" />
				<aon:selectOneMenu id="Offer_lines_item_product_type"
					converter="aon.EnumConverter"
					valueChangeListener="#{controller.addEqualExpression}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{productCollections.commonProductTypes}" />
				</aon:selectOneMenu>

				<aon:outputLabel for="Offer_lines_quantity"
					value="#{bundle.aon_quantity}" />
				<aon:inputText id="Offer_lines_quantity"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Offer_lines_price"
					value="#{bundle.aon_price}" />
				<aon:inputText id="Offer_lines_price"
					valueChangeListener="#{controller.addExpression}" size="40" />

			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{bundle.registry_customer_data}" >
			<aon:panel style="text-align:right;">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.registry_address_module}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
			<aon:panel style="text-align:right;">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_contacts}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
		</aon:panelCollapsible>

		<ui:include src="/com/code/aon/ui/common/facelet/auditable/searchContent.xhtml" />

	</aon:div>

</ui:composition>
