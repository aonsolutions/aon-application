<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/config/facelet/series/search.xhtml" />

	<c:if test="#{!skipLookups}">
		<ui:include src="/com/code/aon/ui/sales/facelet/sales/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{offerSearch.seller}" />
			<ui:param name="skipNewButton" value="#{true}" />
		</ui:include>

		<c:if test="#{aonConfiguration.bean.offer.showSeller}">
			<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{offerSearch.target}" />
				<ui:param name="skipNewButton" value="#{true}" />
			</ui:include>	
		</c:if>
	</c:if>

	<aon:outputLabel value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="Offer_issueDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Offer_issueDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="Offer_issueDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Offer_issueDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
							
	<aon:outputLabel for="Offer_type"
		value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="Offer_type"
		value="#{offerSearch.offerType}"
		converter="aon.EnumConverter"
		reRender="offerSearch">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{commercialCollections.offerTypes}" />
	</aon:selectOneMenu>

	<c:if test="#{(!skipLookups) and offerSearch.dealership}">
		<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{offerSearch.supplier}" />
			<ui:param name="lookupLabel" value="#{commercialBundle.commercial_offer_dealered}"/>
			<ui:param name="skipNewButton" value="#{true}" />
		</ui:include>	
	</c:if>

	<aon:outputLabel for="Offer_workPlace_id"
		value="#{companyBundle.company_workplace}" />
	<aon:selectOneMenu id="Offer_workPlace_id"
		value="#{companyCollections.workPlace}"
		valueChangeListener="#{controller.addIdEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{companyCollections.workPlaces}" />
	</aon:selectOneMenu>					

	<c:if test="#{aonRole.confidentiality}">
		<aon:outputLabel for="Offer_securityLevel"
			value="#{bundle.aon_confidential}" />
		<aon:selectOneRadio id="Offer_securityLevel"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
		</aon:selectOneRadio>				
	</c:if>

	<c:if test="#{company.EInvoice}">
		<aon:outputLabel for="Offer_signed" value="#{commercialBundle.commercial_offer_signed}" />
		<aon:selectOneRadio id="Offer_signed"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneRadio>				
	</c:if>

	<aon:outputText value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox value="#{offerSearch.offerStatuses}">
		<f:selectItems value="#{commercialCollections.offerStatuses}"/>
	</aon:selectManyCheckbox>							
	
</ui:composition>
