<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="offerSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.commercial_offer_module}" />
				<ui:param name="controller" value="#{offer}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{offer}" />
				<ui:define name="searchContent">
					<ui:include src="/com/code/aon/ui/commercial/facelet/offer/searchContent.xhtml">
						<ui:param name="searchController" value="#{offerSearch}" />
					</ui:include>
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
		<aon:if test="#{aonConfiguration.bean.offer.showSeller}">
			<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		</aon:if>
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />		
	</ui:define>
</ui:composition>
