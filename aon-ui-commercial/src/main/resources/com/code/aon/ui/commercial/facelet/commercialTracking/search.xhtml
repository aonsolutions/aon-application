<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="commercialTrackingSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_tracking_module}" />
				<ui:param name="controller" value="#{commercialTracking}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{commercialTracking}" />			
				<ui:define name="searchContent">

					<ui:include src="/com/code/aon/ui/commercial/facelet/projectCommercial/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{commercialTrackingSearch.project}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>
			
					<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{commercialTrackingSearch.seller}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>
				
					<aon:outputText value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="CommercialTracking_date-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="CommercialTracking_date-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
			
						<aon:outputLabel for="CommercialTracking_date-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="CommercialTracking_date-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
					</aon:div>

					<aon:outputLabel for="CommercialTracking_activity_id"
						value="#{bundle.aon_activity}" />
					<aon:selectOneMenu id="CommercialTracking_activity_id"
						value="#{commercialCollections.activity}" 
						valueChangeListener="#{controller.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{commercialCollections.activities}" />
					</aon:selectOneMenu>
				
					<aon:outputLabel for="CommercialTracking_status"
						value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="CommercialTracking_status"
						converter="aon.EnumConverter"
						valueChangeListener="#{controller.addEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{commercialCollections.commercialTrackingStatuses}" />
					</aon:selectOneMenu>					
					
					<aon:outputLabel for="CommercialTracking_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputText id="CommercialTracking_comments" size="75"
						valueChangeListener="#{controller.addExpression}" />
						
					<aon:outputLabel for="CommercialTracking_location"
						value="#{commercialBundle.commercial_tracking_location}" />
					<aon:inputText id="CommercialTracking_location" size="75"
						valueChangeListener="#{controller.addExpression}" />						

				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{projectCommercialLookup}" />
		<aon:lookupButtonPopup lookup="#{targetLookup}" />		
	</ui:define>
		
</ui:composition>
