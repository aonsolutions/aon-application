<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="commercialTrackingForm">
		
			<aon:methodParam name="removeAction" value="#{commercialTracking.backAction}" />
			<aon:methodParam name="saveAction" value="#{commercialTracking.saveAction}" />
			<aon:methodParam name="saveActionListener" value="#{commercialTracking.accepAndSurvey}" type="actionListener" />
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.commercial_tracking_module}" />
				<ui:param name="controller" value="#{commercialTracking}" />
				<ui:define name="beforeSpinToolbarContent" >				
					<aon:commandButton id="viewAlarm"
						rendered="#{!formNew and commercialTracking.hasAlarm}"
						value="#{bundle.groupware_alarm_view}"
						action="alarm_form" immediate="true"
						actionListener="#{commercialTracking.onSelectAlarm}"
						styleClass="aon-finding-toolbar-item aon-icon-alarm-pending" />
					<aon:if test="#{aonConfiguration.bean.alarm.showNew}">
						<aon:commandButton id="alarm"
							rendered="#{!formNew}"
							value="#{bundle.groupware_alarm_new}"
							reRender="newAlarmWindow" immediate="true"
							actionListener="#{commercialTracking.onNewAlarm}"
							styleClass="aon-finding-toolbar-item aon-icon-alarms" />
					</aon:if>
				</ui:define>
			</ui:decorate>

			<aon:div rendered="#{!commercialTracking.nevv}"
				styleClass="aon-float-right aon-margin-right aon-margin-top aon-margin-bottom">
				<aon:commandButton
					rendered="#{commercialTracking.previous != null}" immediate="true"
					actionListener="#{commercialTracking.onPreviousAction}"
					value="#{bundle.commercial_tracking_action_previous}" ajaxSingle="true"
					styleClass="aon-icon-commandButton aon-icon-mailPrevious">
				</aon:commandButton>
	
				<aon:commandButton
					rendered="#{commercialTracking.to.next.id != null}" immediate="true"
					actionListener="#{commercialTracking.onNextAction}"
					value="#{bundle.commercial_tracking_action_next}" ajaxSingle="true"
					styleClass="aon-icon-commandButton aon-icon-mailNext">
				</aon:commandButton>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<ui:include src="/com/code/aon/ui/commercial/facelet/commercialTracking/formContent.xhtml">
					<ui:param name="skipProjectData" value="#{false}" />
				</ui:include>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{projectCommercialLookup}" />		
		<aon:lookupButtonPopup lookup="#{projectLookup}" />		
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{offerLookup}" />
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
		<aon:if test="#{aonConfiguration.bean.alarm.showNew}">
			<ui:include src="/com/code/aon/ui/groupware/facelet/alarm/newAlarm.xhtml" />
		</aon:if>
	</ui:define>
</ui:composition>

</body>
</html>
