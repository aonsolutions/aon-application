<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="commercialTrackingForm">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_tracking_module}" />
				<ui:param name="controller" value="#{commercialTracking}" />
			</ui:include>

			<aon:div rendered="#{!commercialTracking.new}"
				styleClass="aon-float-right aon-margin-right aon-margin-top aon-margin-bottom">
				<aon:commandButton
					rendered="#{commercialTracking.previous != null}" immediate="true"
					actionListener="#{commercialTracking.onPreviousAction}"
					value="#{commercialBundle.commercial_tracking_action_previous}" ajaxSingle="true"
					styleClass="aon-icon-commandButton aon-icon-mailPrevious">
				</aon:commandButton>
	
				<aon:commandButton
					rendered="#{commercialTracking.to.next.id != null}" immediate="true"
					actionListener="#{commercialTracking.onNextAction}"
					value="#{commercialBundle.commercial_tracking_action_next}" ajaxSingle="true"
					styleClass="aon-icon-commandButton aon-icon-mailNext">
				</aon:commandButton>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-170,aon-panelGrid-even">

					<aon:outputLabel for="CommercialTracking_date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="CommercialTracking_date" 
						value="#{commercialTracking.to.date}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>

					<aon:outputLabel for="CommercialTracking_seller_id" 
						value="#{salesBundle.sales_seller}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="CommercialTracking_seller_id"
							lookup="#{sellerLookup}" required="true"
							reRender="CommercialTracking_seller_name"
							value="#{commercialTracking.to.seller.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="CommercialTracking_seller_lookup"
							windowTitle="#{salesBundle.sales_seller_selection}"
							selectReRender="CommercialTracking_seller_id,CommercialTracking_seller_name"
							lookup="#{sellerLookup}" minHeight="440"
							property="#{commercialTracking.to.seller}">
						</aon:lookupButton>
						<aon:lookupButton 
							windowTitle="#{salesBundle.sales_seller_new}"
							minHeight="520" minWidth="650"
							property="#{commercialTracking.to.seller}" lookup="#{sellerLookup}"
							selectReRender="CommercialTracking_seller_id,CommercialTracking_seller_name"
							actionType="new">
						</aon:lookupButton>																				
						<aon:inputText id="CommercialTracking_seller_name"
							value="#{(commercialTracking.to.seller.registry.name!=null)?(commercialTracking.to.seller.registry.fullName):('')}"
							size="80" disabled="true" />
					</aon:div>

					<aon:outputLabel for="CommercialTracking_target_id"
						value="#{commercialBundle.commercial_target}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="CommercialTracking_target_id"
							lookup="#{targetLookup}" required="true"
							reRender="CommercialTracking_target_name"
							value="#{commercialTracking.to.target.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="CommercialTracking_target_lookup"
							windowTitle="#{commercialBundle.commercial_target_selection}" actionType="search"
							selectReRender="CommercialTracking_target_id,CommercialTracking_target_name"
							lookup="#{targetLookup}" minHeight="460" minWidth="650"
							property="#{commercialTracking.to.target}">
						</aon:lookupButton>
						<aon:lookupButton id="CommercialTracking_target_add"
							windowTitle="#{commercialBundle.commercial_target_new}"
							selectReRender="CommercialTracking_target_id,CommercialTracking_target_name"
							lookup="#{targetLookup}" actionType="new" minWidth="650" minHeight="490"
							property="#{commercialTracking.to.target}">
						</aon:lookupButton>
						<aon:inputText id="CommercialTracking_target_name"
							value="#{(commercialTracking.to.target.registry.name!=null)?(commercialTracking.to.target.registry.fullName):('')}"
							size="80" disabled="true" />
					</aon:div>

					<aon:outputLabel for="CommercialTracking_activity_id"
						value="#{commercialBundle.commercial_tracking_activity}" />
					<h:panelGrid columns="3" id="CommercialTracking_activity_offer">						
						<aon:selectOneMenu id="CommercialTracking_activity_id"
							required="true" value="#{commercialTracking.to.activity}">
							<f:selectItem value="#{null}" itemLabel="    " />
							<f:selectItems value="#{commercialCollections.activities}" />
						</aon:selectOneMenu>
						<aon:div styleClass="aon-margin-left">							
							<aon:selectBooleanCheckbox id="CommercialTracking_offer_check"
								reRender="CommercialTracking_activity_offer" 
								valueChangeListener="#{commercialTracking.offerChanged}"
								value="#{commercialTracking.offerChecked}">
							</aon:selectBooleanCheckbox>
							<aon:outputLabel for="CommercialTracking_offer_check"
								value="#{commercialBundle.commercial_offer}" />
						</aon:div>							
						<aon:div rendered="#{commercialTracking.offerChecked}"
							styleClass="aon-lookup aon-margin-left">
							<aon:inputText id="CommercialTracking_offer_detail"
								value="#{commercialTracking.to.offer.referenceCode}"
								size="20" disabled="true" />
							<aon:lookupButton id="CommercialTracking_offer_lookup"
								windowTitle="#{commercialBundle.commercial_offer_selection}" actionType="search"
								controllerListener="#{commercialTracking.offerFilter}"
								selectReRender="CommercialTracking_activity_offer"
								lookup="#{offerLookup}" minHeight="500" minWidth="680"
								property="#{commercialTracking.to.offer}">
							</aon:lookupButton>
							<aon:commandButton
								rendered="#{commercialTracking.to.offer.id != null}"
								actionListener="#{commercialTracking.onSelectOffer}"
								value="&#160;" action="offer_form"
								styleClass="aon-finding-toolbar-item aon-icon-file-entrance aon-finding-toolbar-item-no-border">
							</aon:commandButton>							
						</aon:div>																			
					</h:panelGrid>

					<aon:outputLabel for="CommercialTracking_status"
						value="#{bundle.aon_status}" />
					<h:panelGrid columns="2" id="CommercialTracking_statusDiv">
						<aon:selectOneRadio id="CommercialTracking_status"
							reRender="CommercialTracking_statusDiv"
							valueChangeListener="#{commercialTracking.statusChanged}"
							value="#{commercialTracking.to.status}">
							<f:selectItems
								value="#{commercialCollections.commercialTrackingStatuses}" />
						</aon:selectOneRadio>
						<aon:div styleClass="aon-margin-left"
							rendered="#{commercialTracking.to.status  == 'CLOSED'}" >
							<aon:selectInputDate id="CommercialTracking_endDate" 
								value="#{commercialTracking.to.endDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}">
							</aon:selectInputDate>
						</aon:div>						
					</h:panelGrid>

					<aon:outputLabel for="CommercialTracking_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="CommercialTracking_comments"
						value="#{commercialTracking.to.comments}" cols="51" rows="4" />

					<aon:outputLabel for="CommercialTracking_next_id"
						value="#{commercialBundle.commercial_tracking_next_action}" />
						
					<aon:div>					
						<aon:selectBooleanCheckbox id="CommercialTracking_next_id"
							reRender="next_action" 
							valueChangeListener="#{commercialTracking.nextActionChanged}"
							value="#{commercialTracking.nextAction}">
						</aon:selectBooleanCheckbox>
						<aon:div id="next_action">
							<aon:panelGrid rendered="#{commercialTracking.nextAction}" columns="2">

								<aon:outputLabel for="CommercialTracking_next_date"
									value="#{bundle.aon_date}" />
								<aon:selectInputDate id="CommercialTracking_next_date"
									value="#{commercialTracking.next.date}" required="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>

								<aon:outputLabel for="CommercialTracking_next_activity_id"
									value="#{commercialBundle.commercial_tracking_activity}" />
								<aon:selectOneMenu id="CommercialTracking_next_activity_id"
									required="true" value="#{commercialTracking.next.activity}">
									<f:selectItem value="#{null}" itemLabel="    " />
									<f:selectItems value="#{commercialCollections.activities}" />
								</aon:selectOneMenu>

								<aon:outputLabel for="CommercialTracking_next_comments"
									value="#{bundle.aon_comment}" />
								<aon:inputTextarea id="CommercialTracking_next_comments"
									value="#{commercialTracking.next.comments}" cols="51"
									rows="4" />

							</aon:panelGrid>
						</aon:div>
					</aon:div>
				</aon:panelGrid>

						
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
		<aon:lookupButtonPopup lookup="#{offerLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
