<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="offerForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.commercial_offer_module}" />
					<ui:param name="controller" value="#{offer}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{offer.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{offer.readOnly}" />
					<ui:param name="showMoreMenu" value="#{!offer.nevv and offerDetail.to == null}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton value="&#160;" id="email"
							title="#{bundle.webmail_send_email}"
							rendered="#{!offer.nevv and offerDetail.model.rowCount > 0}" immediate="#{true}" 
							actionListener="#{offer.onShowEmailOptionWindow}"
							reRender="showEmailOptionWindow"
							styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border">
							<f:setPropertyActionListener target="#{offer.showEmailOptionWindow}"
								value="#{true}" />
						</aon:commandButton>
						<aon:htmlCommandLink id="offer-report" value="#{bundle.aon_invoice_offer}"
							target="_blank" action="#{offerSigner.onReport}"
							rendered="#{!offer.nevv and offerDetail.model.rowCount > 0}" disabled="#{offerDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="#{offer.reportTemplate}" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
					</ui:define>
					<ui:define name="moreMenuContent">
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signMenuItem.xhtml">
							<ui:param name="signController" value="#{offerSigner}" />
							<ui:param name="skipSignButton" value="#{offer.nevv or offer.to.signed or (!certificate.signable)}" />
							<ui:param name="skipCancelSignButton" value="#{offer.nevv or (!offer.to.signed)}" />
							<ui:param name="signButtonReRender" value="offerForm,showNewMessageWindow" />
						</ui:include>
						
						<rich:menuSeparator id="actionMenuSeparator" />
					
						<aon:if test="#{aonConfiguration.bean.offer.showTasData}">
							<aon:menuItem id="projectTas"
								value=" O.R."
								immediate="#{true}" rendered="#{offer.pending and offerDetail.model.rowCount > 0}"
								iconClass="aon-icon-car"
								actionListener="#{offer.onProjectTasShow}"
								reRender="showProjectTasWindow">
								<f:setPropertyActionListener target="#{offer.showProjectTasWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:if test="#{aonConfiguration.bean.offer.showSalesOrder and aonRole.saleOperator and !actionDenied.skip['sales']}">
							<aon:menuItem id="sales"
								value="#{bundle.aon_invoice_sales}"
								immediate="#{true}" rendered="#{(offer.pending or offer.approved) and offer.linesPending}"
								iconClass="aon-icon-open-popup" 
								actionListener="#{offer.onSalesShow}"
								reRender="showSalesWindow">
								<f:setPropertyActionListener target="#{offer.showSalesWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:if test="#{aonConfiguration.bean.offer.showInvoicing and aonRole.financeOperator}">
							<aon:menuItem id="invoice"
								value="#{bundle.aon_key_invoice_description}"
								immediate="#{true}" rendered="#{(offer.pending or offer.approved) and offer.linesPending and !offer.linesSold}"
								iconClass="aon-icon-favorite"
								actionListener="#{offer.onInvoiceShow}"
								reRender="showInvoiceWindow">
								<f:setPropertyActionListener target="#{offer.showInvoiceWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="duplicate"
							value="#{bundle.aon_to_duplicate}"
							immediate="#{true}"
							iconClass="aon-icon-copy"
							actionListener="#{offer.onOfferCopyShow}"
							reRender="showOfferCopyWindow">
							<f:setPropertyActionListener target="#{offer.showOfferCopyWindow}"
								value="#{true}" />
						</aon:menuItem>
						<ui:include
							src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					styleClass="aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Offer_number"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<ui:decorate template="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
								<ui:param name="controller" value="#{offer}" />
								<ui:param name="seriesChangedReRender" value="Offer_securityLevel" />
								<ui:param name="skipSeriesLabel" value="#{true}" />
								<ui:define name="additionalSeriesContent">
									<aon:confirmButton id="version" value="&#160;"
										title="#{bundle.commercial_offer_new_version}"
										immediate="true" rendered="#{!offer.nevv and !(offer.approved or offer.invoiced)}"
										styleClass="aon-icon-commandButton aon-icon-version"
										confirmTitle="#{bundle.aon_confirm_title}"
										confirmMessage="#{bundle.commercial_offer_confirm_new_version}"
										confirmActionListener="#{offer.onVersion}" />
								</ui:define>
							</ui:decorate>
							<aon:div>
								<aon:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Offer_securityLevel"
										value="#{offer.to.confidential}"
										rendered="#{!offer.readOnly}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{!offer.readOnly}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{offer.readOnly and offer.to.confidential}" />
								</aon:if>

								<aon:if test="#{company.EInvoice}">
									<aon:outputText value="&#160;"
										rendered="#{!offer.nevv and offer.to.signed}"
										title="#{bundle.sign_signed}"
										styleClass="aon-icon aon-icon-signed" />
								</aon:if>

								<aon:outputText styleClass="aon-margin-right"
									value="#{offer.to.status}" />
								<aon:outputText styleClass="aon-italic"
									value="(#{bundle.finance_invoice}: "
									rendered="#{offer.invoiced}" />
								<aon:outputText styleClass="aon-bold"
									value="#{offer.invoiceCode}"
									rendered="#{offer.invoiced}" />
								<aon:outputText styleClass="aon-italic" value=")"
									rendered="#{offer.invoiced}" />
								<aon:commandLink id="invoice_link" immediate="true"
									styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
									value="&#160;" title="#{bundle.aon_go}"
									rendered="#{offer.invoiced}"
									actionListener="#{offer.onLoadInvoice}"
									action="saleInvoice_form" />
							
								<aon:commandButton id="toPending" value="&#160;"
									actionListener="#{offer.onPending}" 
									title="#{bundle.commercial_offer_to_pending}"
									immediate="true" rendered="#{offer.refused or (offer.approved and !offer.linesSold)}"
									styleClass="aon-icon-commandButton aon-icon-refresh aon-margin-left" />
								<aon:commandButton id="approve" value="&#160;"
									actionListener="#{offer.onApprove}" 
									title="#{bundle.commercial_offer_to_approve}"
									immediate="true" rendered="#{offer.pending and offerDetail.model.rowCount > 0}"
									styleClass="aon-icon-commandButton aon-icon-point-green aon-margin-left" />
								<aon:commandButton id="refuse" value="&#160;"
									actionListener="#{offer.onRefuse}"
									title="#{bundle.commercial_offer_to_refuse}"
									immediate="true" rendered="#{offer.pending and offerDetail.model.rowCount > 0}"
									styleClass="aon-icon-commandButton aon-icon-point-red" />
								<aon:commandButton id="block" value="&#160;"
									actionListener="#{offer.onBlock}"
									title="#{bundle.commercial_offer_to_block}"
									immediate="true" rendered="#{!offer.nevv and !(offer.blocked or offer.invoiced)}"
									styleClass="aon-icon-commandButton aon-icon-lock">
								</aon:commandButton>										
								<aon:commandButton id="unblock" value="&#160;"
									actionListener="#{offer.onUnblock}"
									title="#{bundle.commercial_offer_to_unblock}"
									immediate="true" rendered="#{offer.blocked}"
									styleClass="aon-icon-commandButton aon-icon-unlock aon-margin-left">
								</aon:commandButton>
								
								<aon:if test="#{not empty offer.documentOnlineSignParam}">
									<aon:outputText value="&#160;&#160;&#160;&#160;&#160;&#160;"
										rendered="#{!offer.nevv and offer.to.externalReference != null}"
										title="#{offer.documentOnlineSignParam.value}"
										style="padding-left: 45px;"
										styleClass="aon-evicertia aon-margin-left" />
								</aon:if>
								
							</aon:div>
						</h:panelGrid>
 					</aon:div>

					<aon:outputLabel for="Offer_issueDate" 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Offer_issueDate"
						value="#{offer.to.issueDate}" 
						required="true" disabled="#{offer.readOnly}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{offer.to.target}" />
						<ui:param name="lookupDisabled" value="#{offer.targetReadOnly}" />
						<ui:param name="lookupReRender" 
							value="Target_registry_document,OfferAddress,OfferProject,lookupSeller,Offer_defaultPayMethod,payMethodDiv" />
						<ui:param name="idRequired" value="#{true}" />						
						<aon:methodParam name="lookupChangeListener"
							value="#{offer.targetData}" type="lookupChangeListener" />
					</ui:include>

					<aon:outputLabel for="Target_registry_document" 
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Target_registry_document" 
						value="#{offer.to.target.registry.document}"
						disabled="true" size="10" />

					<aon:outputLabel for="Offer_address"
						value="#{bundle.aon_address}" />
					<aon:div id="OfferAddress">
						<aon:selectOneMenu id="Offer_address" 
							value="#{offer.to.address}"	rendered="#{offer.addressCount > 0}"
							disabled="#{offer.readOnly}">
							<f:selectItems value="#{offer.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{bundle.registry_no_address_available}"
							rendered="#{offer.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Offer_type" 
						value="#{bundle.aon_type}" />
					<aon:div>
						<aon:selectOneMenu id="Offer_type" 
							value="#{offer.to.type}"
							disabled="#{offer.readOnly}"
							reRender="offerForm">
							<f:selectItems value="#{commercialCollections.offerTypes}" />
						</aon:selectOneMenu>
						<aon:outputText styleClass="aon-bold aon-margin-left"
							value="#{offer.to.externalReference}"
							rendered="#{!offer.nevv and offer.to.otherOffer}" />
					</aon:div>

					<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{offer.to.supplier}" />
						<ui:param name="lookupDisabled" value="#{offer.readOnly}" />
						<ui:param name="lookupRendered" value="#{offer.dealership}" />
						<ui:param name="lookupReRender" value="Supplier_registry_document,Offer_defaultPayMethod,payMethodDiv" />				
						<ui:param name="idRequired" value="#{true}" />						
						<aon:methodParam name="lookupChangeListener"
							value="#{offer.supplierData}" type="lookupChangeListener" />
					</ui:include>
					
					<aon:outputLabel for="Supplier_registry_document" 
						value="#{bundle.aon_company_document}"
						rendered="#{offer.dealership}" />
					<aon:inputText id="Supplier_registry_document" 
						value="#{offer.to.supplier.registry.document}"
						rendered="#{offer.dealership}"
						disabled="true" size="10" />

					<aon:if test="#{aonConfiguration.bean.offer.showSeller}">
						<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{offer.to.seller}" />
							<ui:param name="lookupDisabled" value="#{offer.readOnly}" />
							<aon:methodParam name="lookupChangeListener"
								value="#{offer.sellerData}" type="lookupChangeListener" />
						</ui:include>
					</aon:if>

					<aon:outputLabel for="Offer_workPlace" 
						value="#{bundle.purchase_workplace}" />
					<aon:div>
						<aon:selectOneMenu id="Offer_workPlace" 
							value="#{offer.to.workPlace}"
							disabled="#{offer.readOnly}"
							valueChangeListener="#{offer.onWorkPlaceChanged}" 
							reRender="Offer_scope">
							<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						</aon:selectOneMenu>
						<aon:outputLabel for="Offer_scope" 
							styleClass="aon-margin-left aon-italic"
							value="#{bundle.aon_scope}:" />
						<aon:outputText id="Offer_scope" 
							styleClass="aon-margin-left aon-bold"
							value="#{offer.to.scope.description}" />
					</aon:div>

					<aon:outputLabel for="Offer_defaultPayMethod" 
						value="#{bundle.finance_payMethod}" />
					<aon:selectOneRadio id="Offer_defaultPayMethod" 
						value="#{offer.defaultPayMethod}"
						disabled="#{offer.readOnly}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{bundle.aon_habitual}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{bundle.aon_to_specify}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Offer_total" 
						value="#{bundle.aon_total}" />
					<aon:div>
						<aon:outputText id="Offer_total" styleClass="aon-bold" 
							value="#{offer.totalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputLabel styleClass="aon-margin-left aon-italic"
							value="(#{bundle.aon_tax_included})" />
					</aon:div>
 
				</aon:panelGrid>

				<aon:div id="OfferProject">
					<aon:panelGrid columns="2" style="width: 100%;"
						rendered="#{offer.to.project.id != null or (!offer.readOnly and offer.projectCount > 0)}"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto">

						<aon:if test="#{!aonConfiguration.bean.offer.showTasData}">
							<aon:outputLabel for="Offer_project"
								value="#{bundle.aon_project}" />
						</aon:if>
						<aon:if test="#{aonConfiguration.bean.offer.showTasData}">
							<aon:outputLabel for="Offer_project"
								value="#{bundle.tas_project_tas}" />
						</aon:if>
						<aon:div>
							<aon:selectOneMenu id="Offer_project"
								rendered="#{!offer.readOnly and offer.to.project.id == null and offer.projectCount > 0}"
								value="#{offer.to.project}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{offer.projects}" />
							</aon:selectOneMenu>
							<aon:outputText styleClass="aon-bold"
								value="#{offer.to.project.name}" 
								rendered="#{offer.to.project.id != null}" />
							<aon:div layout="inline" styleClass="aon-margin-left">
								<aon:commandButton id="removeOfferProject" 
									value="&#160;" title="#{bundle.aon_remove}" 
									styleClass="aon-icon-commandButton aon-icon-delete"
									rendered="#{!offer.readOnly and offer.to.project.id != null}"
									actionListener="#{offer.removeOfferProject}" 
									reRender="offerForm" />
							</aon:div>
						</aon:div>

					</aon:panelGrid>
				</aon:div>

				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:div>
						<aon:outputLabel for="Offer_comments"
							value="#{bundle.aon_comment}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_comment_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Offer_comments" cols="80" rows="3"
						disabled="#{offer.readOnly}"
						value="#{offer.to.comments}" />

					<aon:div>
						<aon:outputLabel for="Offer_remarks"
							value="#{bundle.aon_remark}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_remark_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Offer_remarks" cols="80" rows="3"
						disabled="#{offer.readOnly}"
						value="#{offer.to.remarks}" />

				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:if test="#{offer.defaultPayMethod != null and !offer.defaultPayMethod}">
						<aon:panel>
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_payMethod}" />
							</f:facet>
							<aon:panelGrid columns="8" styleClass="aon-width-all" style="font-size:0.9em;"
								rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
								columnClasses="aon-panelGrid-even aon-width-auto,
									aon-panelGrid-even aon-width-50,
									aon-panelGrid-even aon-width-70,
									aon-panelGrid-even aon-width-100,
									aon-panelGrid-even aon-width-70,
									aon-panelGrid-even aon-width-auto,
									aon-panelGrid-even aon-width-150,
									aon-panelGrid-even aon-width-100">

								<aon:outputLabel for="Offer_payMethod" value="#{bundle.aon_type}"/>
								<aon:outputLabel for="Offer_numberOfPayments" value="#{bundle.registry_number_of_payments}" />
								<aon:outputLabel for="Offer_daysToFirstPayment" value="#{bundle.registry_days_to_first_payment}" />
								<aon:outputLabel for="Offer_daysBetweenPayments" value="#{bundle.registry_days_between_payments}" />
								<aon:outputLabel for="Offer_paymentDays" value="#{bundle.registry_payment_days}" />
								<aon:outputLabel value="#{bundle.aon_iban}" />
								<aon:outputLabel for="Offer_bankAlias" value="#{bundle.aon_bank}" />
								<aon:outputLabel for="Offer_bic" value="#{bundle.aon_bic}" />

								<aon:selectOneMenu id="Offer_payMethod" 
									value="#{offer.to.payMethod}"
									disabled="#{offer.readOnly}">
									<f:selectItems value="#{configCollections.payMethods}" />
								</aon:selectOneMenu>
								<aon:inputText id="Offer_numberOfPayments"
									value="#{offer.to.numberOfPayments}"
									disabled="#{offer.readOnly}" size="3" maxlength="2">
									<f:validateLongRange minimum="1" />
								</aon:inputText>	
								<aon:inputText id="Offer_daysToFirstPayment"
									value="#{offer.to.daysToFirstPayment}"
									disabled="#{offer.readOnly}" size="3" maxlength="3">
									<f:validateLongRange minimum="0" />
								</aon:inputText>	
								<aon:inputText id="Offer_daysBetweenPayments"
									value="#{offer.to.daysBetweenPayments}"
									disabled="#{offer.readOnly}" size="3" maxlength="3">
									<f:validateLongRange minimum="0" />
								</aon:inputText>	
								<aon:inputText id="Offer_paymentDays"
									value="#{offer.to.paymentDays}" 
									disabled="#{offer.readOnly}" size="5" />

								<aon:div>
									<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
										<ui:param name="bankAccountController" value="#{offer.accountHelper}" />
										<ui:param name="bankAccountPrefix" value="Offer" />
										<ui:param name="bankAccountDisabled" value="#{offer.readOnly}" />
										<ui:param name="bankCodeChangeReRender" value="Offer_bankAlias,Offer_bic" />
									</ui:include>
								</aon:div>
								<aon:inputText id="Offer_bankAlias"
									value="#{offer.to.bankAlias}" 
									disabled="#{offer.readOnly}" 
									required="#{offer.to.bankAccount.validIbanLength}" size="25" maxlength="25" />
								<aon:inputText id="Offer_bic"
									value="#{offer.to.bic}" validator="BICValidator"
									disabled="#{offer.readOnly}" 
									required="#{offer.to.bankAccount.validIbanLength}" size="12" maxlength="11">
								</aon:inputText>

						</aon:panelGrid>
					</aon:panel>
				</aon:if>
				</aon:div>

				<aon:if test="#{!offer.nevv}">
					<aon:panelTabSet selectedTab="#{offer.selectedTab}">

						<aon:panelTab id="offerDetail" label="#{bundle.commercial_offer_detail}">
							<ui:include src="/com/code/aon/ui/commercial/facelet/offer/formDetail.xhtml" />
						</aon:panelTab>

						<aon:panelTab id="offerAttachment" label="#{bundle.commercial_offer_attachment}">
							<ui:include src="/com/code/aon/faces/attachment/grid.xhtml">
								<ui:param name="controller" value="#{offerAttachment}" />
								<ui:param name="skipResetButton" value="#{offer.readOnly}" />
								<ui:param name="skipLineEdition" value="#{offer.readOnly}" />									
							</ui:include>
						</aon:panelTab>
					
						<aon:panelTab id="offerTermGeneral" label="#{bundle.commercial_offer_term_general}">
							<ui:include src="/com/code/aon/ui/commercial/facelet/offer/formTerm.xhtml" >
								<ui:param name="controller" value="#{offerTermGeneral}" />
							</ui:include>
						</aon:panelTab>
