<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<c:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
	</c:if>

	<aon:outputLabel for="ProjectCommercial_project_name"
		value="#{bundle.aon_name}" />
	<aon:inputText id="ProjectCommercial_project_name" size="60"
		valueChangeListener="#{controller.addExpression}" />
		
	<aon:outputLabel for="ProjectCommercial_source"
		value="#{bundle.aon_source}" />
	<aon:selectOneMenu id="ProjectCommercial_source"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{commercialCollections.projectSources}" />
	</aon:selectOneMenu>					
		
	<aon:outputText value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="ProjectCommercial_project_date-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="ProjectCommercial_project_date-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>

		<aon:outputLabel for="ProjectCommercial_project_date-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="ProjectCommercial_project_date-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>
	</aon:div>						
			
	<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{projectCommercialSearch.seller}" />
		<ui:param name="lookupSuffix" value="_ProjectCommercial" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{projectCommercialSearch.target}" />
		<ui:param name="lookupSuffix" value="_ProjectCommercial" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>
	
	<aon:outputLabel for="ProjectCommercial_comments"
		value="#{bundle.aon_comment}" />
	<aon:inputText id="ProjectCommercial_comments" size="60"
		valueChangeListener="#{controller.addExpression}" />					

	<aon:outputLabel for="ProjectCommercial_status"
		value="#{bundle.aon_status}" />
	<aon:selectOneMenu id="ProjectCommercial_status"
		converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{commercialCollections.projectStatuses}" />
	</aon:selectOneMenu>					
	
	<aon:outputLabel for="ProjectCommercial_probability"
		value="#{bundle.commercial_project_probability}" />
	<aon:inputText id="ProjectCommercial_probability" size="60"
		valueChangeListener="#{controller.addExpression}" />					

</ui:composition>
