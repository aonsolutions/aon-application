<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showOfferCopyWindow">
		<aon:if test="#{offer.showOfferCopyWindow}">
			<rich:modalPanel id="offerCopyModalPanel" 
				minWidth="740" minHeight="240" zindex="90"
				showWhenRendered="#{offer.showOfferCopyWindow}">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.commercial_offer_duplicate}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showOfferCopyWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{offer.showOfferCopyWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="offerCopyForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="offerCopy-accept"
										value="#{bundle.aon_to_duplicate}"
										actionListener="#{offer.onCopy}"
										action="offer_form"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="offerCopyModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{offer.showOfferCopyWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="offerCopy-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showOfferCopyWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{offer.showOfferCopyWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" style="width: 80%;">

										<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
											<ui:param name="controller" value="#{offer}" />
											<ui:param name="sfc_aliasPreffix" value="Offer_offer" />
											<ui:param name="sfc_editable" value="#{true}" />
											<ui:param name="sfc_seriesProperty" value="#{offer.offerSeries}" />
											<ui:param name="sfc_numberProperty" value="#{offer.offerNumber}" />
											<aon:methodParam name="sfc_onSeriesChanged" type="valueChangeListener"
												value="#{offer.onOfferCopySeriesChanged}" />	
											<aon:methodParam name="sfc_onNumberEditable" type="actionListener"
												value="#{offer.onOfferNumberEditable}" />
										</ui:include>

										<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
											<ui:param name="lookupTo" value="#{offer.offerTarget}" />
											<ui:param name="skipNewButton" value="#{true}" />
											<ui:param name="idRequired" value="#{true}" />
											<ui:param name="lookupSuffix" value="-Copy" />
											<aon:methodParam name="lookupChangeListener"
												value="#{offer.offerCopyTargetData}" type="lookupChangeListener" />
										</ui:include>

										<aon:outputLabel for="Offer_offerDate"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Offer_offerDate" 
											value="#{offer.offerDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-100" />

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
