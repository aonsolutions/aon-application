<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include
		src="/com/code/aon/ui/commercial/facelet/project/listBasic.xhtml" />

	<aon:column styleClass="aon-editDataTable-textColumn"
		alias="Project.seller.registry.name">
		<f:facet name="header">
			<aon:outputText value="#{salesBundle.sales_seller}" />
		</f:facet>
		<aon:outputText value="#{to.seller.registry.fullName}"/>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-80"
		alias="Project.status">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status}" />
		</f:facet>
		<aon:outputText value="#{to.status}"/>
	</aon:column>	
						
</ui:composition>
