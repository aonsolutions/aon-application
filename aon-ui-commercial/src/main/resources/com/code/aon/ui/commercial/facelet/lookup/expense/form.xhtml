<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGrid columns="2" dir="true">

		<aon:outputLabel for="Expense_description"
			value="#{bundle.aon_description}" />
		<aon:inputText id="Expense_decription" required="true"
			value="#{lookup.to.description}" size="40" maxlength="64" />
			
		<aon:outputLabel for="Expense_unitPrice"
			value="#{bundle.aon_price}" />
		<aon:inputText id="Expense_unitPrice" required="true"
			value="#{lookup.to.unitPrice}" size="40" maxlength="64" />

	</aon:panelGrid>

</ui:composition>
