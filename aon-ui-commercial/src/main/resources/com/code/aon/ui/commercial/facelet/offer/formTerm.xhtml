<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<c:if test="#{offer.selectedTab == controller.beanName}">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="skipResetButton" value="#{offer.readOnly}" />
			<ui:param name="skipLineEdition" value="#{offer.readOnly}" />	
			<ui:define name="columns">
	
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-300">
					<f:facet name="header">
						<aon:outputLabel for="OfferTerm_name" value="#{bundle.aon_name}" />
					</f:facet>
					<aon:outputText value="#{to.name}" rendered="#{formList}" />
					<aon:div styleClass="aon-lookup" rendered="#{formEdit}">
						<aon:inputText id="OfferTerm_name"
							value="#{controller.to.name}" required="true"
							size="40" maxlength="64" />
						<aon:lookupButton
							windowTitle="#{commercialBundle.commercial_commercialTerm_selection}"
							selectReRender="OfferTerm_name,OfferTerm_description"
							lookup="#{commercialTermLookup}"
							lookupChangeListener="#{controller.onTermChanged}"
							controllerListener="#{controller.lookupListener}"
							property="#{controller.commercialTerm}">
						</aon:lookupButton>
						<aon:lookupButton 
							windowTitle="#{commercialBundle.commercial_commercialTerm_new}"
							selectReRender="OfferTerm_name,OfferTerm_description"
							lookup="#{commercialTermLookup}" minHeight="220" minWidth="520"
							lookupChangeListener="#{controller.onTermChanged}"
							controllerListener="#{controller.lookupListener}"
							property="#{controller.commercialTerm}" actionType="new">
						</aon:lookupButton>																								
					</aon:div>
					<f:facet name="footer">
						<aon:div styleClass="aon-lookup" rendered="#{formNew}">
							<aon:inputText id="OfferTerm_name-New"
								value="#{controller.to.name}" required="true"
								size="40" maxlength="64" />
							<aon:lookupButton
								windowTitle="#{commercialBundle.commercial_commercialTerm_selection}"
								selectReRender="OfferTerm_name-New,OfferTerm_description-New"
								lookup="#{commercialTermLookup}"
								lookupChangeListener="#{controller.onTermChanged}"
								controllerListener="#{controller.lookupListener}"
								property="#{controller.commercialTerm}">
							</aon:lookupButton>
							<aon:lookupButton 
								windowTitle="#{commercialBundle.commercial_commercialTerm_new}"
								selectReRender="OfferTerm_name-New,OfferTerm_description-New"
								lookup="#{commercialTermLookup}" minHeight="220" minWidth="520"
								lookupChangeListener="#{controller.onTermChanged}"
								controllerListener="#{controller.lookupListener}"
								property="#{controller.commercialTerm}" actionType="new">
							</aon:lookupButton>						
						</aon:div>
					</f:facet>
				</aon:column>
	
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="OfferTerm_description"
							value="#{bundle.aon_description}" />
					</f:facet>
					<aon:outputText value="#{to.description}" rendered="#{formList}" >
						<aon:abbreviateConverter maxWidth="80" />
					</aon:outputText>
					<aon:inputTextarea id="OfferTerm_description" required="true"
						rendered="#{formEdit}" rows="4" cols="40"
						value="#{controller.to.description}"  />
					<f:facet name="footer">
						<aon:inputTextarea id="OfferTerm_description-New" required="true"
							rendered="#{formNew}" rows="4" cols="40"
							value="#{controller.to.description}"  />
					</f:facet>
				</aon:column>
	
			</ui:define>
		</ui:decorate>
	</c:if>

</ui:composition>
