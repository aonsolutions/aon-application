<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
				<f:facet name="header">
					<aon:outputLabel for="OfferTerm_name" value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.name}" rendered="#{formList}" />
				<aon:inputText id="OfferTerm_name" required="true"
					rendered="#{formEdit}" size="64" maxlength="64"
					value="#{controller.to.name}" />
				<f:facet name="footer">
					<aon:inputText id="OfferTerm_name-New" required="true"
						rendered="#{formNew}" size="64" maxlength="64"
						value="#{controller.to.name}"  />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="OfferTerm_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{formList}" />
				<aon:inputTextarea id="OfferTerm_description"
					value="#{controller.to.description}" required="true"
					rendered="#{formEdit}" cols="64" rows="5" />
				<f:facet name="footer">
					<aon:inputTextarea id="OfferTerm_description-New"
						value="#{controller.to.description}" required="true"
						rendered="#{formNew}" cols="64" rows="5" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
