<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<c:if test="#{offer.selectedTab == controller.beanName}">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="skipResetButton" value="#{offer.readOnly}" />
			<ui:param name="skipLineEdition" value="#{offer.readOnly}" />
			<ui:param name="newSaveButtonReRender" value="menuExt,Invoice_total,financeContainer" />
			<ui:param name="saveButtonReRender" value="offerForm" />
			<ui:param name="removeButtonReRender" value="offerForm" />	
			<ui:define name="columns">
			
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.aon_line}" /> 
					</f:facet>
					<aon:outputText value="#{to.line}" rendered="#{formList}" />
					<aon:inputText id="OfferTerm_line"
						value="#{controller.to.line}" rendered="#{formEdit}"
						required="true" size="1" maxlength="3" />
					<f:facet name="footer">
						<aon:inputText id="OfferTerm_line-New"
							value="#{controller.to.line}" rendered="#{formNew}"
							required="true" size="1" maxlength="3" />
					</f:facet>
				</aon:column>
	
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-300">
					<f:facet name="header">
						<aon:outputLabel for="OfferTerm_name" value="#{bundle.aon_name}" />
					</f:facet>
					<aon:outputText value="#{to.name}" rendered="#{formList}" />
					<ui:include src="/com/code/aon/ui/commercial/facelet/commercialTerm/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{controller.commercialTerm}" />
						<ui:param name="lookupControllerListener" value="#{controller.lookupListener}"/>
						<ui:param name="lookupRendered" value="#{formEdit}" />
						<ui:param name="lookupReRender" value="OfferTerm_description" />
						<ui:param name="skipLabel" value="#{true}" />
						<aon:methodParam name="lookupChangeListener"
							value="#{controller.onTermChanged}" type="lookupChangeListener" />							
					</ui:include>
					<f:facet name="footer" >
						<ui:include src="/com/code/aon/ui/commercial/facelet/commercialTerm/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{controller.commercialTerm}" />
							<ui:param name="lookupControllerListener" value="#{controller.lookupListener}"/>
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupReRender" value="OfferTerm_description-New" />
							<ui:param name="lookupSuffix" value="-New" />
							<ui:param name="skipLabel" value="#{true}" />
							<aon:methodParam name="lookupChangeListener"
								value="#{controller.onTermChanged}" type="lookupChangeListener" />							
						</ui:include>
					</f:facet>						
				</aon:column>
	
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="OfferTerm_description"
							value="#{bundle.aon_description}" />
					</f:facet>
					<aon:outputText value="#{to.description}" rendered="#{formList}" >
						<aon:abbreviateConverter maxWidth="80" />
					</aon:outputText>
					<aon:inputTextarea id="OfferTerm_description" required="true"
						rendered="#{formEdit}" rows="4" cols="40"
						value="#{controller.to.description}"  />
					<f:facet name="footer">
						<aon:inputTextarea id="OfferTerm_description-New" required="true"
							rendered="#{formNew}" rows="4" cols="40"
							value="#{controller.to.description}"  />
					</f:facet>
				</aon:column>
	
			</ui:define>
		</ui:decorate>
	</c:if>

</ui:composition>
