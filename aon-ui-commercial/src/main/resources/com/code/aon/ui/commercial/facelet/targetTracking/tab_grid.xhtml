<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{targetTracking}" />
		
		<ui:define name="columns">
		
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-120">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.date}"
					rendered="#{formList}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>	
				<aon:selectInputDate id="CommercialTracking_date" 
					rendered="#{formEdit}"
					value="#{controller.to.date}" required="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>								
				<f:facet name="footer">
					<aon:selectInputDate id="CommercialTracking_date-New" 
						rendered="#{formNew}"
						value="#{controller.to.date}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>								
				</f:facet>
			</aon:column>
		
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="Seller_id" value="#{salesBundle.sales_seller}" />
				</f:facet>
				<aon:outputText value="#{to.seller.registry.fullName}" rendered="#{formList}"/>
				<ui:include src="/com/code/aon/ui/sales/facelet/sales/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{targetTracking.to.seller}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupInputSize" value="40" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
				</ui:include>
				<f:facet name="footer" >
					<ui:include src="/com/code/aon/ui/sales/facelet/sales/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{targetTracking.to.seller}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupInputSize" value="40" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="lookupSuffix" value="-New" />
					</ui:include>
				</f:facet>
			</aon:column>
		
			<aon:column styleClass="aon-editDataTable-textColumn  aon-width-150">
				<f:facet name="header">
					<aon:outputText value="#{commercialBundle.commercial_tracking_activity}" />
				</f:facet>
				<aon:outputText value="#{to.activity.name}" rendered="#{formList}"/>
				<aon:selectOneMenu id="CommercialTracking_activity_id"
					rendered="#{formEdit}"
					required="true" value="#{controller.to.activity}">
					<f:selectItem value="#{null}" itemLabel="    " />
					<f:selectItems value="#{commercialCollections.activities}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="CommercialTracking_activity_id-New"
						rendered="#{formNew}"
						required="true" value="#{controller.to.activity}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{commercialCollections.activities}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
		
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}" rendered="#{formList}"/>
				<aon:selectOneMenu id="CommercialTracking_status"
					rendered="#{formEdit}"
					reRender="CommercialTracking_statusDiv"
					value="#{controller.to.status}">
					<f:selectItems
						value="#{commercialCollections.commercialTrackingStatuses}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="CommercialTracking_status-New"
						rendered="#{formNew}"
						reRender="CommercialTracking_statusDiv"
						value="#{controller.to.status}">
						<f:selectItems
							value="#{commercialCollections.commercialTrackingStatuses}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_comment}" />
				</f:facet>
				<aon:outputText value="#{to.comments}" rendered="#{formList}" >
					<aon:abbreviateConverter maxWidth="50" />
				</aon:outputText>
				<aon:inputTextarea id="CommercialTracking_comments"
					rendered="#{formEdit}"
					value="#{controller.to.comments}" cols="51" rows="4" />
				<f:facet name="footer">
					<aon:inputTextarea id="CommercialTracking_comments-New"
						rendered="#{formNew}"
						value="#{controller.to.comments}" cols="51" rows="4" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
