<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showEmailOptionWindow">
		<aon:if test="#{offer.showEmailOptionWindow}">
			<rich:modalPanel id="emailOptionModalPanel" 
				minHeight="#{(offer.includeEmailSddMandateReport or (offer.documentOnlineSign and not offer.documentOnlineSigner.collapsed))?'450':'200'}"
				minWidth="#{(offer.includeEmailSddMandateReport or (offer.documentOnlineSign and not offer.documentOnlineSigner.collapsed))?'550':'320'}"
				rendered="#{offer.showEmailOptionWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.webmail_attach_file}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showEmailOptionWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{offer.showEmailOptionWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="emailOptionForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="emailOption-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{offer.onSendEmail}"
										reRender="showEmailOptionWindow, showNewMessageWindow"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="emailOptionModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{offer.showEmailOptionWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 0.5em;">

								    <aon:panelGrid columns="1" styleClass="aon-width-all"
								    	columnClasses="aon-panelGrid-even">
									    <aon:div>
									        <aon:selectBooleanCheckbox id="includeEmailOfferReport"
												value="#{offer.includeEmailOfferReport}" />
									    	<aon:outputLabel for="includeEmailOfferReport"
												value="#{bundle.commercial_offer_email_include_offer}" />
									    </aon:div>
									    
									    <aon:div>
									        <aon:selectBooleanCheckbox id="includeEmailOfferAttach"
												value="#{offer.includeEmailOfferAttach}" />
									    	<aon:outputLabel for="includeEmailOfferAttach"
												value="#{bundle.commercial_offer_email_include_attach}" />
										</aon:div>
	
									    <aon:div>
					                        <aon:selectBooleanCheckbox id="includeEmailSddMandateReport"
												value="#{offer.includeEmailSddMandateReport}" >
												<a4j:support event="onclick" ajaxSingle="true"
													reRender="emailOptionModalPanel" />
											</aon:selectBooleanCheckbox>
											<aon:outputLabel for="includeEmailSddMandateReport"
												value="#{bundle.commercial_offer_email_include_sddMandate}" />
									    </aon:div>
									    	
									    <aon:div rendered="#{not empty offer.documentOnlineSignParam}">
					                        <aon:selectBooleanCheckbox id="documentOnlineSign" title="#{offer.documentOnlineSignParam.value}"
												value="#{offer.documentOnlineSign}" >
												<a4j:support event="onclick" reRender="emailOptionModalPanel" />
											</aon:selectBooleanCheckbox>
											<aon:outputLabel for="documentOnlineSign" title="#{offer.documentOnlineSignParam.value}"
												value="Solicitar firma online [#{offer.documentOnlineSignParam.value}]" />
											<aon:commandButton id="documentOnlineSigner-showSettings"
												value="&#160;" 
												title="Mostrar opciones de configuracion"
												rendered="#{offer.documentOnlineSign and offer.documentOnlineSigner.collapsed}"
												actionListener="#{offer.documentOnlineSigner.onCollapse}"
												reRender="emailOptionModalPanel"
												styleClass="aon-finding-toolbar-item aon-noborder aon-icon-config">
											</aon:commandButton>
											<aon:commandButton id="documentOnlineSigner-hideSettings"
												value="&#160;" 
												title="Ocultar opciones de configuracion"
												rendered="#{offer.documentOnlineSign and not offer.documentOnlineSigner.collapsed}"
												actionListener="#{offer.documentOnlineSigner.onUncollapse}"
												reRender="emailOptionModalPanel"
												styleClass="aon-finding-toolbar-item aon-noborder aon-icon-config">
											</aon:commandButton>
									    </aon:div>
								    </aon:panelGrid>
									    
									<aon:panel rendered="#{offer.includeEmailSddMandateReport}">
										<f:facet name="header">
											<aon:panelGroup>
												<aon:outputText value="#{bundle.finance_sddMandate_module}" />
											</aon:panelGroup>
										</f:facet>
									    <aon:panelGrid columns="2" style="width: 100%;">
											<aon:outputLabel for="sddMandate_sign_date" 
												value="#{bundle.finance_sddMandate_sign_date}" />
											<aon:selectInputDate id="sddMandate_sign_date"
												disabled="#{!offer.includeEmailSddMandateReport}"
												value="#{offer.sddMandate.signDate}"
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}" />
					
											<aon:outputLabel for="sddMandate_reference-all"
												value="#{bundle.aon_reference}" />
											<aon:inputText id="sddMandate_reference-all"
												disabled="#{!offer.includeEmailSddMandateReport}"
												value="#{offer.sddMandate.reference}" />
											
											<aon:outputLabel for="sddMandate_paymentType-all"
												value="#{bundle.finance_sddMandate_paymentType}" />
											<aon:selectOneMenu id="sddMandate_paymentType-all" layout="pageDirection"
												disabled="#{!offer.includeEmailSddMandateReport}"
												value="#{offer.sddMandate.paymentType}">
												<f:selectItem  itemValue="#{null}" 
													itemLabel="#{bundle.aon_unknown}" />
												<f:selectItem  itemValue="#{true}" 
													itemLabel="#{bundle.finance_sddMandate_recurrent}" />
												<f:selectItem itemValue="#{false}" 
													itemLabel="#{bundle.finance_sddMandate_oneOff}" />
											</aon:selectOneMenu>
									     </aon:panelGrid>
									</aon:panel>
									
									<aon:panel rendered="#{offer.documentOnlineSign and not offer.documentOnlineSigner.collapsed}">
										<f:facet name="header">
											<aon:panelGroup>
												<aon:outputText value="#{offer.documentOnlineSignParam.value}" />
											</aon:panelGroup>
										</f:facet>
									    <aon:panelGrid columns="2" style="width: 100%;">
											<aon:outputLabel for="documentOnlineSign_username"
												value="#{bundle.aon_login_user}" />
											<aon:inputText id="documentOnlineSign_username"
												value="#{offer.documentOnlineSigner.username}" />
												
											<aon:outputLabel for="documentOnlineSign_password"
												value="#{bundle.aon_login_passwd}" />
											<aon:inputText id="documentOnlineSign_password"
												value="#{offer.documentOnlineSigner.password}" />
												
											<aon:outputLabel for="documentOnlineSign_signingType"
												value="Tipo de firma" />
											<aon:selectOneMenu id="documentOnlineSign_signType" layout="pageDirection"
												value="#{offer.documentOnlineSigner.signingType}">
												<f:selectItem itemValue="#{0}" 
													itemLabel="Challenge" />
												<f:selectItem itemValue="#{1}" 
													itemLabel="EmailPin" />
												<f:selectItem itemValue="#{2}" 
													itemLabel="Handwriting" />
												<f:selectItem itemValue="#{3}" 
													itemLabel="MobilePin" />
												<f:selectItem itemValue="#{4}" 
													itemLabel="Password" />
												<f:selectItem itemValue="#{5}" 
													itemLabel="WebClick" />
											</aon:selectOneMenu>
											
											<aon:outputLabel for="documentOnlineSign_notifyCommercial"
												value="Notificar al comercial" />
 											<aon:selectBooleanCheckbox id="documentOnlineSign_notifyCommercial"
												value="#{offer.documentOnlineSigner.notifyCommercial}" />
 											
											<aon:outputLabel for="documentOnlineSign_test" title="Entorno de pruebas o produccion"
												value="Test" />
 											<aon:selectBooleanCheckbox id="documentOnlineSign_test" title="Entorno de pruebas o produccion"
												value="#{offer.documentOnlineSigner.testing}" >
												<a4j:support event="onclick" reRender="documentOnlineSign_url"
													actionListener="#{offer.documentOnlineSigner.onUpdateUrl}" />
											</aon:selectBooleanCheckbox>
												
											<aon:outputLabel for="documentOnlineSign_url"
												value="URL" />
											<aon:inputText id="documentOnlineSign_url" size="45" disabled="true"
												value="#{offer.documentOnlineSigner.url}" />
									     </aon:panelGrid>
									</aon:panel>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
