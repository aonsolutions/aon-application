<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="questionSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_question_module}" />
				<ui:param name="controller" value="#{question}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{question}" />
				<ui:define name="searchContent">
					
					<aon:outputLabel for="Question_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Question_id" size="60"
						valueChangeListener="#{controller.addExpression}" />		
			
					<aon:outputLabel for="Question_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Question_type"
						converter="aon.EnumConverter" 
						valueChangeListener="#{controller.addEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{commercialCollections.questionTypes}" />
					</aon:selectOneMenu>		
					
					<aon:outputLabel for="Question_text"
						value="#{commercialBundle.commercial_question}" />
					<aon:inputText id="Question_text" size="60"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Question_alias"
						value="#{commercialBundle.commercial_question_label}" />
					<aon:inputText id="Question_alias" size="60"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Question_argument"
						value="#{commercialBundle.commercial_question_argument}" />
					<aon:inputText id="Question_argument" size="60"
						valueChangeListener="#{controller.addExpression}" />
				
					<aon:outputLabel for="Question_active"				
						value="#{bundle.aon_status}"/>
					<aon:selectOneMenu id="Question_active"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="#{true}"/>
						<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="#{false}"/>
					</aon:selectOneMenu>
				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
	</ui:define>
		
</ui:composition>
