<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:methodParam name="rowSelectorActionListener" value="#{projectCommercialTracking.onSelectTracking}" type="actionListener" />
	<aon:methodParam name="rowSelectorAction" value="commercialTracking_form" />

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{projectCommercialTracking}" />
		<ui:param name="rowSelectorReRender" value="aonContent" />
		<ui:param name="skipResetButton" value="true" />
		<ui:define name="beginFooterContent">
			<aon:commandButton id="tracking-new" title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
				styleClass="aon-editDataTable-button aon-icon-reset"
				rendered="#{!formNew}" 
				reRender="showNewTrackingWindow"
				actionListener="#{projectCommercialTracking.onResetTracking}"
				accesskey="#{bundle.aon_key_new_line}" 
				focus="#{(focusOnAdd != null)?(focusOnAdd):''}">
				<f:setPropertyActionListener target="#{projectCommercial.showNewTrackingWindow}" value="#{true}" />
			</aon:commandButton>							
		</ui:define>
		<ui:define name="endFormListContent">
			<aon:outputText value="&#160;"
				rendered="#{controller.currentHasAlarm}"
				title="#{groupwareBundle.aon_alarm}"
				styleClass="aon-icon2 aon-icon-alarm" />														
		</ui:define>
		<ui:define name="columns">

			<ui:include	src="/com/code/aon/ui/commercial/facelet/commercialTracking/listContent.xhtml" >
				<ui:param name="skipTarget" value="#{true}" />
			</ui:include>

		</ui:define>
	</ui:decorate>

</ui:composition>
