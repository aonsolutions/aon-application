<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="targetList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_target_module}" />
				<ui:param name="controller" value="#{target}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="targetList-excel-report"
						value="&#160;" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="#{target.listReportKey}" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>	
					<aon:htmlCommandLink id="targetList-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="#{target.listReportKey}" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="targetListDetailExcel-excel-report" 
						value="#{bundle.aon_detailed_listing}" 
						target="_new" 
						actionListener="#{target.onDetailReport}"
						disabled="#{target.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
					</aon:htmlCommandLink>
				</ui:define>				
			</ui:decorate>		
			
			<ui:include src="/com/code/aon/ui/commercial/facelet/target/listContent.xhtml" />

		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
