<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="projectCommercialForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.commercial_operation_module}" />
				<ui:param name="controller" value="#{projectCommercial}" />
				<ui:define name="beforeSpinToolbarContent">
					<c:if test="#{!projectCommercial.nevv}">
						<aon:commandButton id="ProjectHistory" 
							action="project_stats" actionListener="#{projectCommercial.onProjectHistory}"
							value="#{bundle.aon_history}"
							styleClass="aon-finding-toolbar-item aon-icon-info" />
					</c:if>		
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-170,aon-panelGrid-even">

					<ui:include src="/com/code/aon/ui/commercial/facelet/projectCommercial/formContent.xhtml">
						<ui:param name="controller" value="#{projectCommercial}"/>
					</ui:include>				

				</aon:panelGrid>

				<c:if test="#{!projectCommercial.nevv}">
					<aon:panelTabSet id="projectCommercialTab" selectedTab="#{projectCommercial.selectedTab}">
						<aon:panelTab id="tracking" label="#{bundle.commercial_tracking_module}">
							<ui:include src="/com/code/aon/ui/commercial/facelet/projectCommercialTracking/grid.xhtml" />
						</aon:panelTab>

						<aon:panelTab id="documents" label="#{bundle.aon_documents}">
							<ui:include	src="/com/code/aon/ui/project/facelet/projectAttachment/tab_grid.xhtml" >
								<ui:param name="controller" value="#{projectCommercialAttach}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{targetLookup}" />

		<ui:include	src="/com/code/aon/ui/commercial/facelet/projectCommercialTracking/newTrackingModal.xhtml" >
			<ui:param name="skipProjectData" value="#{true}" />
		</ui:include>
	</ui:define>
</ui:composition>

</body>
</html>
