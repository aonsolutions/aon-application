<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showInvoiceWindow">
		<aon:if test="#{offer.showInvoiceWindow}">
			<rich:modalPanel id="invoiceModalPanel" minHeight="240"
				minWidth="520" rendered="#{offer.showInvoiceWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_key_invoice_description}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showInvoiceWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{offer.showInvoiceWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="invoiceForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="invoice-accept"
										value="#{bundle.aon_key_invoice_description}"
										actionListener="#{offer.onInvoice}"
										action="saleInvoice_form"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="invoiceModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{offer.showInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="invoice-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showInvoiceWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{offer.showInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" style="width: 80%;">

										<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
											<ui:param name="controller" value="#{saleInvoice}" />
											<ui:param name="sfc_aliasPreffix" value="Offer_invoice" />
											<ui:param name="sfc_editable" value="#{true}" />
											<ui:param name="sfc_seriesProperty" value="#{offer.invoiceSeries}" />
											<ui:param name="sfc_numberProperty" value="#{offer.invoiceNumber}" />
											<aon:methodParam name="sfc_onSeriesChanged" type="valueChangeListener"
												value="#{offer.onInvoiceSeriesChanged}" />	
											<aon:methodParam name="sfc_onNumberEditable" type="actionListener"
												value="#{offer.onInvoiceNumberEditable}" />
										</ui:include>

										<aon:outputLabel for="Offer_invoiceDate"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Offer_invoiceDate" 
											value="#{offer.invoiceDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-100" />

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
