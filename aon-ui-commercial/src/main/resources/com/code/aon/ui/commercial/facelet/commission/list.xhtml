<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="commissionList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.commercial_commission_module}" />
				<ui:param name="controller" value="#{commission}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{commission}" />
					<ui:define name="columns">

						<aon:column alias="Commission.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.name}" />
						</aon:column>
	
						<aon:column alias="Commission.startDate"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_start_date}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column alias="Commission.endDate"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_end_date}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
