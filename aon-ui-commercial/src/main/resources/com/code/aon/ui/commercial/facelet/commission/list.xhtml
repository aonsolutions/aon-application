<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="commissionList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_commission_module}" />
				<ui:param name="controller" value="#{commission}" />
			</ui:include>

			<aon:div id="commissionData" styleClass="aon-scroll-area">
				<aon:dataTable id="commissionDataList" value="#{commission.model}"
					rows="20" var="to" rendered="#{commission.model.rowCount > 0}">

					<aon:rowSelector action="commission_form" 
						actionListener="#{commission.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_start_date}" />
						</f:facet>
						<aon:outputText value="#{to.startDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_end_date}" />
						</f:facet>
						<aon:outputText value="#{to.endDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

				</aon:dataTable>
				<aon:dataScroller2 for="commissionDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
