<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:column styleClass="aon-editDataTable-dateColumn aon-width-120"
		alias="CommercialTracking.date">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.date}" >
			<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
			timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>	
	</aon:column>
		
	<aon:column styleClass="aon-editDataTable-textColumn"
		alias="CommercialTracking.seller.registry.name">
		<f:facet name="header">
			<aon:outputText value="#{salesBundle.sales_seller}" />
		</f:facet>
		<aon:outputText value="#{to.seller.registry.fullName}"/>
	</aon:column>

	<c:if test="#{!skipTarget}">
		<aon:column styleClass="aon-editDataTable-textColumn"
			alias="CommercialTracking.target.registry.name">
			<f:facet name="header">
				<aon:outputText value="#{commercialBundle.commercial_target}" />
			</f:facet>
			<aon:outputText value="#{to.project.target.registry.fullName}"/>
		</aon:column>
	</c:if>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-350"
		alias="CommercialTracking.comments">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_comment}" />
		</f:facet>
		<aon:outputText value="#{to.comments}"/>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn"
		alias="CommercialTracking.activity.name">
		<f:facet name="header">
			<aon:outputText value="#{commercialBundle.commercial_tracking_activity}" />
		</f:facet>
		<aon:outputText value="#{to.activity.name}"/>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-80"
		alias="CommercialTracking.status">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status}" />
		</f:facet>
		<aon:outputText value="#{to.status}"/>
	</aon:column>

</ui:composition>
