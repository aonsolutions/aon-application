<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="targetSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{target.bundle.commercial_target_module}" />
				<ui:param name="controller" value="#{target}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{target}" />
				<ui:define name="searchContent">

					<ui:include src="/com/code/aon/ui/commercial/facelet/target/searchContent.xhtml">
						<ui:param name="controller" value="#{target}"/>
					</ui:include>
					
				</ui:define>
			</ui:decorate>

		</aon:form>
		<c:if test="#{aonConfiguration.bean.target.showSeller}">
			<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		</c:if>
		<c:if test="#{aonConfiguration.bean.target.showProfile}">
			<aon:lookupButtonPopup lookup="#{questionLookup}" />
		</c:if>	
	</ui:define>
</ui:composition>
