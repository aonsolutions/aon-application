<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="offerList">

			<ui:include	src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.commercial_offer_module}" />
				<ui:param name="controller" value="#{offer}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{offer}" />
					<ui:define name="columns">

						<ui:include
							src="/com/code/aon/ui/commercial/facelet/offer/listBasic.xhtml" />
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{offer.offerTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div style="float:right">
									<aon:outputText style="text-align:right" value="#{offer.offersTotalAmount}" >
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>
						
						<c:if test="#{company.EInvoice}">
							<aon:column alias="Offer.signed"
								styleClass="aon-text-center">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_signature}" />
								</f:facet>
								<aon:outputText value="&#160;" rendered="#{to.signed}"
									title="#{bundle.sign_signed}"
									styleClass="aon-icon aon-icon-signed" />
								<aon:outputText value="&#160;" rendered="#{!to.signed}"
									title="#{bundle.sign_sign_pending}"
									styleClass="aon-icon aon-icon-unsigned" />
							</aon:column>
						</c:if>						
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
