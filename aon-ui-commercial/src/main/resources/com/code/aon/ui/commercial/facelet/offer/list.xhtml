<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="offerList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.commercial_offer_module}" />
				<ui:param name="controller" value="#{offer}" />
				<ui:define name="additionalToolbarContent">
					<ui:include src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />
					<aon:commandLink id="offer-export"  value="&#160;" 
							onclick="offerx('#{offerExport.statusesStr}', '#{offerExport.target}', '#{offerExport.seller}', '#{offerExport.supplier}', '#{offerExport.project}'
									, '#{offerExport.type}','#{offerExport.serie}','#{offerExport.fromNumber}', '#{offerExport.toNumber}', '#{offerExport.fromDateStr}', '#{offerExport.toDateStr}'
									, '#{companyCollections.workPlace}', '#{configCollections.scope}', '#{offerExport.confidential}', '#{offerExport.signed}')"
							styleClass="aon-finding-toolbar-item aon-icon-excel">
					</aon:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{offer}" />
					<ui:define name="columns">

						<ui:include	src="/com/code/aon/ui/commercial/facelet/offer/listBasic.xhtml" />

						<aon:column alias="Offer.seller.registry.name"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_commercial}" />
							</f:facet>
							<aon:outputText title="#{to.seller.registry.fullName}"
								value="#{(!empty to.seller.registry.alias) ? to.seller.registry.alias : to.seller.registry.fullName}">
								<aon:abbreviateConverter maxWidth="30" />
							</aon:outputText>
						</aon:column>
						
						<aon:column alias="Offer.scope&lt;description"
							styleClass="aon-editDataTable-textColumn aon-width-130">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_scope}" />
							</f:facet>
							<aon:outputText value="#{to.scope.description}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{offer.offerTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div id="listTotalDiv" styleClass="aon-text-right"
									rendered="#{controller.rowCount &lt; 500}">
									<aon:commandLink id="showTotals" immediate="true" 
										styleClass="aon-dataTable-link aon-nowrap aon-bold"
										value="#{bundle.aon_total_sum}"
										rendered="#{controller.listTotal == null}"
										actionListener="#{controller.obtainListTotals}"									
										reRender="listTotalDiv" />
									<aon:outputText	styleClass="aon-bold" 
										value="#{controller.listTotal}"
										rendered="#{controller.listTotal != null}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column alias="Offer.status"
							styleClass="aon-editDataTable-iconColumn aon-width-20 aon-text-center">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status_abrv}" />
							</f:facet>
							<aon:outputText title="#{bundle.aon_pending}"
								styleClass="aon-text-center"
								value="-"
								rendered="#{to.pending}" />
							<aon:outputText title="#{bundle.aon_approved}"
								styleClass="aon-editDataTable-button aon-icon-task-checked aon-nowrap aon-margin-left"
								value="&#160;"
								rendered="#{to.approved}" />
							<aon:outputText title="#{bundle.aon_refused}"
								styleClass="aon-editDataTable-button aon-icon-point-red aon-nowrap aon-margin-left"
								value="&#160;"
								rendered="#{to.refused}" />
							<aon:outputText title="#{bundle.aon_blocked}"
								styleClass="aon-editDataTable-button aon-icon-lock aon-nowrap aon-margin-left"
								value="&#160;"
								rendered="#{to.blocked}" />
							<aon:outputText title="#{bundle.finance_invoiced}"
								styleClass="aon-editDataTable-button aon-icon-check-black aon-nowrap aon-margin-left"
								value="&#160;"
								rendered="#{to.invoiced}" />
						</aon:column>

						<aon:if test="#{company.EInvoice}">
							<aon:column alias="Offer.signed"
								styleClass="aon-editDataTable-iconColumn aon-width-20 aon-text-center">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_signature_abbrv}" />
								</f:facet>
								<aon:outputText title="#{bundle.sign_signed}"
									styleClass="aon-editDataTable-button aon-icon-signed aon-nowrap"
									value="&#160;"
									rendered="#{to.signed}" />
								<aon:outputText title="#{bundle.sign_sign_pending}"
									styleClass="aon-editDataTable-button aon-icon-unsigned aon-nowrap"
									value="&#160;"
									rendered="#{!to.signed}" />
							</aon:column>
						</aon:if>						
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
