<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{fiscalBundle.fiscal_retention_report_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				

				<ui:define name="toolbarActions">
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-back" 
						value="#{bundle.aon_back}"
						action="retention_report_list" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						accesskey="#{bundle.aon_key_cancel}" />			

					<aon:htmlCommandLink id="retentionBook-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="retentionBook" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>							
					<aon:htmlCommandLink id="retentionBook-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="retentionBook" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				<aon:dataTable id="retentionReportList" value="#{retentionReport.detailModel}"
					rows="20" var="to" rendered="#{retentionReport.detailModel.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-numberColumn,
								aon-editDataTable-numberColumn,
								aon-editDataTable-numberColumn">
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_tax_date}" />
						</f:facet>
						<aon:outputText value="#{to.date}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_invoice_order}" />
						</f:facet>
						<aon:outputText value="#{to.documentNumber}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_invoice_number}" />
						</f:facet>
						<aon:outputText value="#{to.reference}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.invoiceDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.document}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_taxable_base}" />
						</f:facet>
						<aon:outputText value="#{to.base}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="%" />
						</f:facet>
						<aon:outputText value="#{to.percent}">
							<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_quota}" />
						</f:facet>
						<aon:outputText value="#{to.quota}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="retentionReportList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
