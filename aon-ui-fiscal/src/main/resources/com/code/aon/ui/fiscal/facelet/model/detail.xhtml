<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<c:if test="#{!controller.new}">
		<aon:div id="detailContainer" styleClass="aon-width-all aon-margin-top">
			<aon:dataTable value="#{controller.declaration.keys}" var="key">
			
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" style="font-size: 0.9em;">
					<f:facet name="header">
						<aon:outputText value="&#160;"/>	
					</f:facet>
					<aon:div style="margin-left: #{key.level}em;#{(key.title and key.level==0)?'font-weight: bold;':''}">
						<aon:outputText value="#{key}" rendered="#{!key.descriptionEnabled}"/>
						<aon:outputText value="#{controller.declaration.map[key].description}" 
							rendered="#{key.descriptionEnabled}"/>
						<aon:outputText value="&#160;"/>
					</aon:div>
					
					
				</aon:column>
				
				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
					<f:facet name="header">
						<aon:outputText value="#{fiscalBundle.fiscal_vatTax_accumulated}" />	
					</f:facet>
					<aon:div rendered="#{!key.title and !key.total}">
						<aon:outputText value="#{controller.declaration.map[key].accumulatedAmount}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:div>
				</aon:column>
				<c:if test="#{controller.difEnabled}">
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_vatTax_declared}" />
						</f:facet>
						<aon:div rendered="#{key.difEnabled}">
							<aon:outputText value="#{controller.declaration.map[key].declaredAmount}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:div>
					</aon:column>
				</c:if>

				<c:if test="#{controller.difEnabled}">
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_vatTax_result}" />
						</f:facet>
						<aon:div rendered="#{key.difEnabled}">
							<aon:outputText value="#{controller.declaration.map[key].resultAmount}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:div>
					</aon:column>
				</c:if>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
					<f:facet name="header">
						<aon:outputText value="#{fiscalBundle.fiscal_vatTax_adjusts}" />
					</f:facet>
					<aon:div rendered="#{!key.title and !key.total}">
						<aon:outputText value="#{controller.declaration.map[key].adjustAmount}" 
							rendered="#{!controller.declaration.header.pending}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText value="#{controller.declaration.map[key].adjustAmount}" 
							rendered="#{controller.declaration.header.pending}" 
							required="true" size="8" />
					</aon:div>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
					<f:facet name="header">
						<aon:outputText value="#{fiscalBundle.fiscal_vatTax_to_declare}" />
					</f:facet>
					<aon:div rendered="#{!key.title}">
						<aon:outputText value="#{controller.declaration.map[key].amount}"
							style="#{(key.total)?(key.level==0?'font-weight: bold':'font-style:italic'):''};">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:div>
				</aon:column>

			</aon:dataTable>
		</aon:div>
	</c:if>
</ui:composition>
