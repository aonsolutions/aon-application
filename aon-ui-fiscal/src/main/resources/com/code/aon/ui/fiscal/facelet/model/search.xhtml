<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form id="FiscalModelForm" styleClass="aon-form">
		<ui:include
			src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{moduleLabel}" />
			<ui:param name="controller" value="#{controller}" />
		</ui:include>
		
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
			<ui:param name="controller" value="#{controller}" />

			<ui:define name="searchContent">
				<aon:outputLabel for="FiscalModel_year" value="#{bundle.aon_year}" />
				<aon:inputText id="FiscalModel_year" size="5"
					valueChangeListener="#{controller.addExpression}" />

				<aon:outputLabel for="FiscalModel_period"
					value="#{bundle.aon_period}" />
				<aon:selectOneMenu id="FiscalModel_period"
					valueChangeListener="#{controller.addEqualExpression}"
					converter="aon.EnumConverter">
					<f:selectItem itemLabel="-" value="#{null}" />
					<aon:if test="#{quarterPeriods}">
						<f:selectItems value="#{fiscalCollections.quarterPeriods}" />
					</aon:if>
					<aon:if test="#{!quarterPeriods}">
						<f:selectItems value="#{fiscalCollections.periods}" />	
					</aon:if>
				</aon:selectOneMenu>

				<aon:outputLabel for="FiscalModel_status"
					value="#{bundle.aon_status}" />
				<aon:selectOneRadio id="FiscalModel_status"
					valueChangeListener="#{controller.addEqualExpression}"
					converter="aon.EnumConverter">
					<f:selectItem value="#{null}" itemLabel="#{bundle.aon_all}" />
					<f:selectItems value="#{fiscalCollections.fiscalModelStatuses}" />
				</aon:selectOneRadio>
			</ui:define>
			
		</ui:decorate>
	</aon:form>
</ui:composition>
