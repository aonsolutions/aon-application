<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<style type="text/css">
			#fiscalMatrix td {
				text-align: center; 
			}
			.monthCell {
				border: solid #BBB 1px;
				width: 40px; 
				font-weight: bold;
			}
			.domainCell {
				font-weight: bold;
				margin-top:5px;
				font-size: 1.1em;
				padding-left: 10px;
				text-aling: left;
			}
			.admonCell {
				width: 40px;
				border: solid #BBB 1px;
			}
			.modelCell {
				border: solid #BBB 1px;
				width: 60px; 
				font-weight: bold;
				font-size: 1.1em;
				white-space: nowrap;
			}
			.dataCell {
				border: solid #BBB 1px;
			}
		</style>	
	
	
		<aon:form>
			<aon:div style="margin:15px 5px;text-align:center;padding: 5px;border: solid #CCC 1px; white-space: nowrap;">
				<h:panelGrid columns="2" styleClass="aon-width-all aon-nowrap"
					columnClasses="aon-width-auto, aon-text-right"
					>
					<aon:div style="white-space: nowrap;">
						<aon:outputLabel for="fiscalMatrix_fiscalYear" value="Ejercicio"/>
						<aon:selectOneMenu id="fiscalMatrix_fiscalYear"
							style="margin-right: 5px;margin-left: 5px;"
							value="#{fiscalMatrix.params.year}">
							<a4j:support event="onchange"
								actionListener="#{fiscalMatrix.onRefresh}" 
								reRender="matrixContainer"
								ajaxSingle="true" />
							<f:selectItem itemLabel="2012" itemValue="2012" />
							<f:selectItem itemLabel="2013" itemValue="2013" />
							<f:selectItem itemLabel="2014" itemValue="2014" />
							<f:selectItem itemLabel="2015" itemValue="2015" />
							<f:selectItem itemLabel="2016" itemValue="2016" />
							<f:selectItem itemLabel="2017" itemValue="2017" />
							<f:selectItem itemLabel="2018" itemValue="2018" />
							<f:selectItem itemLabel="2019" itemValue="2019" />
							<f:selectItem itemLabel="2020" itemValue="2020" />
							<f:selectItem itemLabel="2021" itemValue="2021" />
							<f:selectItem itemLabel="2022" itemValue="2022" />
							<f:selectItem itemLabel="2023" itemValue="2023" />
							<f:selectItem itemLabel="2024" itemValue="2024" />
						</aon:selectOneMenu>
		
						<aon:outputLabel for="fiscalMatrix_model" value="Modelo"/>
						<aon:selectOneMenu id="fiscalMatrix_model"
							style="margin-right: 5px;margin-left: 5px;"
							value="#{fiscalMatrix.params.model}">
							<a4j:support event="onchange"
								actionListener="#{fiscalMatrix.onRefresh}" 
								reRender="matrixContainer"
								ajaxSingle="true" />
							<f:selectItem itemLabel="#{bundle.aon_all}" itemValue="#{null}" />
							<f:selectItems value="#{fiscalMatrix.models}" />
						</aon:selectOneMenu>
		
						<aon:panelGroup style="margin-left: 5px;">
							<aon:selectBooleanCheckbox id="controller_showOnlyConfiguratedModels"
								value="Solo configurados">
								<a4j:support event="onchange"
									actionListener="#{fiscalMatrix.onRefresh}" 
									reRender="matrixContainer"
									ajaxSingle="true" />
							</aon:selectBooleanCheckbox>
							<aon:outputLabel for="controller_showOnlyConfiguratedModels" styleClass="aon-italic"
								value="Solo configurados" />
						</aon:panelGroup>
					</aon:div>
					
					<aon:panelGroup style="margin-left: 5px;">
						<aon:outputText  style="margin-left: 5px;background-color: #ccffcc; padding:4px;border: solid #BBB 1px;;white-space: nowrap;"
							value="&#8212; EN CURSO"/>
						<aon:outputText  style="margin-left: 5px;background-color: #b8dc6f; padding:4px;border: solid #BBB 1px;;white-space: nowrap;"
							value="&#10004; FINALIZADO"/>
						<aon:outputText  style="margin-left: 5px;background-color: #3EC946; padding:4px;border: solid #BBB 1px;;white-space: nowrap;"
							value="&#10004; PRESENTADO"/>
						<aon:outputText  style="margin-left: 5px;background-color: #ff8080; padding:4px;border: solid #BBB 1px;;white-space: nowrap;"
							value="&#8226; BLOQUEADO"/>
						<aon:outputText  style="margin-left: 5px;background-color: #FFC2B2; padding:4px;border: solid #BBB 1px;white-space: nowrap;"
							value="&#8226; NO REALIZADO"/>
					</aon:panelGroup>				
				</h:panelGrid>
			</aon:div>
		</aon:form>
		<aon:div id="matrixContainer">
		<table id="fiscalMatrix" style="margin-left: auto; margin-right: auto; margin-bottom: 20px; border-collapse: collapse;"
			cellpadding="0" cellspacing="0">
				<tr>
					<ui:fragment rendered="#{empty fiscalMatrix.list}">
						<td>
							<aon:outputText value="No se encontraron resultados"/>
						</td>
					</ui:fragment>
					<ui:fragment rendered="#{not empty fiscalMatrix.list}">
						<td></td>
						<td></td>
						<td></td>
						<td></td>
						<td class="monthCell">E</td><td class="monthCell">F</td><td class="monthCell">M</td>
						<td class="monthCell">A</td><td class="monthCell">M</td><td class="monthCell">J</td>
						<td class="monthCell">X</td><td class="monthCell">A</td><td class="monthCell">S</td>
						<td class="monthCell">O</td><td class="monthCell">N</td><td class="monthCell">D</td>
					</ui:fragment>
				</tr>
			<ui:repeat var="modelConfig" value="#{fiscalMatrix.list}">
				<tr>
					<ui:fragment rendered="#{modelConfig.domainName != null and fiscalMatrix.domainNameInOneRow}">
						<tr>
							<td colspan="15">
								<aon:outputText value="&#160;"/>
							</td>
						</tr>
						<tr>
							<td class="domainCell" colspan="15">
								<aon:outputText value="#{modelConfig.domainName}"/>
							</td>
						</tr>
					</ui:fragment>
					
					<td>
						<ui:fragment rendered="#{!fiscalMatrix.domainNameInOneRow}">
							<aon:outputText value="#{modelConfig.document} - #{modelConfig.name}"
								rendered="#{modelConfig.nameEnabled}" 
								style="margin-right: 5px;font-style: italic; font-weight: normal;"/>
						</ui:fragment>
					</td>
					<td style="text-align: right; padding-right: 5px;font-weight: bold;">
						<ui:fragment rendered="#{!fiscalMatrix.domainNameInOneRow}">
							<aon:outputText value="#{modelConfig.domainName}"/>
						</ui:fragment>
						<aon:outputText value="&#160;"/>	
					</td>
					
					<td class="admonCell">
						<aon:outputText value=""
							style="padding-left: 16px;"
							rendered="#{modelConfig.administration != null}"
							styleClass="#{modelConfig.administrationStyle} aon-nowrap"
							/>
						<aon:outputText value="?"
							rendered="#{modelConfig.administration == null}"/>
					</td>
					<td class="modelCell">
						<aon:outputText value="#{modelConfig.model.name}"/>
					</td>
						<ui:repeat var="status" value="#{modelConfig.statusList}">
							<td class="dataCell" colspan="#{12 / modelConfig.numberOfStatuses}" 
								style="background-color: #{status.missing?'#FFC2B2':(status.pending?'#ccffcc':(status.sent?'#3EC946':(status.blocked?'#ff8080':'#b8dc6f')))};">
								<aon:div rendered="#{status.missing}">
									<aon:outputText value="&#8226;"/>	
								</aon:div>
								<aon:div rendered="#{status.pending}">
									<aon:outputText value="-"/>	
								</aon:div>
								<aon:div rendered="#{status.finished}">
									<aon:outputText value="&#10004;"/>	
								</aon:div>
								<aon:div rendered="#{status.sent}">
									<aon:outputText value="&#8594;"/>	
								</aon:div>
								<aon:div rendered="#{status.blocked}">
									<aon:outputText value="&#8594;"/>	
								</aon:div>
							</td>
						</ui:repeat>
				</tr>
			</ui:repeat>
		</table>
		</aon:div>		
	</ui:define>

</ui:composition>
