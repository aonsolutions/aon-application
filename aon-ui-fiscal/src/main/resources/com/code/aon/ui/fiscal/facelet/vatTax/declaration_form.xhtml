<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarTitle" value="Resultado" />
		<ui:param name="controller" value="#{vatTaxDeclaration}" />
		
		<ui:param name="skipSearchButton" value="true" />
	</ui:decorate>

	<aon:div styleClass="aon-scroll-area">

		<aon:panelGrid id="VatTaxDeclarationGrid" columns="3" dir="true" width="100%"
			columnClasses="aon-panelGrid-odd aon-width-300
						  ,aon-panelGrid-even aon-text-right aon-width-150
			              ,aon-panelGrid-even aon-width-auto">


			<aon:outputText value="&#160;" />
			<aon:div styleClass="aon-text-left">
				<aon:selectBooleanCheckbox id="VatTaxDeclaration_wihout_activity" styleClass="aon-margin-left"
					value="#{vatTaxDeclaration.to.withoutActivity}"/>
				<aon:outputLabel for="VatTaxDeclaration_wihout_activity" styleClass="aon-italic"
					value="#{bundle.fiscal_wihout_activity}" />
			</aon:div>
			<aon:div styleClass="aon-text-left">
				<aon:div styleClass="aon-text-left">
					<aon:selectOneMenu id="VatTax_Declaration_status" value="#{vatTaxDeclaration.to.status}" required="true">
						<f:selectItems value="#{fiscalCollections.vatTaxDeclarationStatuses}" />
					</aon:selectOneMenu>
					<aon:commandButton id="gen-disk"
						value="#{bundle.finance_create_disk}"
						actionListener="#{vatTaxDeclaration.onCreateDisk}"
						rendered="#{!vatTaxDeclaration.nevv and !vatTaxDeclaration.to.generated}"
						styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
						style="border-width: 0px 0px 0px 0px;margin-left: 10px;" reRender="VatTaxDeclarationGrid"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:htmlCommandLink target="_blank" id="downloadFile303"
						title="#{vatTaxDeclaration.diskOk?(bundle.finance_download_disk):(bundle.finance_download_error)}"
						value="#{vatTaxDeclaration.diskOk?(bundle.finance_download_disk):(bundle.finance_download_error)}"
						style="border-width: 0px 0px 0px 0px; font-weight: normal;"
						actionListener="#{vatTaxDeclaration.downloadDisk}"
						rendered="#{!vatTaxDeclaration.nevv and vatTaxDeclaration.fileOutput!=null}"
						styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
					<aon:htmlCommandLink target="_blank" id="reportDraftAeat"
						title="Validar/Imprimir via AEAT (Borrador)" 
						value="Validar/Imprimir via AEAT (Borrador)"
						style="border-width: 0px 0px 0px 0px; font-weight: normal;padding-left: 18px;"
						styleClass="aon-finding-toolbar-item aon-icon-aeat aon-nowrap"
						rendered="#{!vatTaxDeclaration.nevv and vatTaxDeclaration.fileOutput!=null and vatTaxDeclaration.aeatDraftReportEnabled}" 
						action="#{vatTaxDeclaration.onAEATPrint}" />
				</aon:div>
				<aon:div styleClass="aon-text-left" style="margin-left: 338px;margin-top: 5px;">
					<h:outputLink target="_blank" id="predeclarationAeat"
						title="Predeclaraci&#243;n via AEAT (Papel)"
						value="#{vatTaxDeclaration.predeclarationURL}" 
						style="border-width: 0px 0px 0px 0px; font-weight: normal; padding-left: 18px;"
						styleClass="aon-finding-toolbar-item aon-icon-aeat aon-nowrap"
						rendered="#{!vatTaxDeclaration.nevv and vatTaxDeclaration.fileOutput!=null and vatTaxDeclaration.aeatDraftReportEnabled and vatTax.to.year > 2016}">
						<aon:outputLabel for="predeclarationAeat"
							value="Predeclaraci&#243;n via AEAT (Papel)" />
					</h:outputLink>
				</aon:div>
			</aon:div>			

			<aon:outputLabel for="VatTaxDeclaration_administration"
				value="#{bundle.aon_administration}" />
			<aon:div styleClass="aon-text-left">				
				<aon:selectOneMenu id="VatTaxDeclaration_administration" value="#{vatTaxDeclaration.to.administration}" 
					required="true" reRender="VatTaxDeclarationGrid">
					<f:selectItems value="#{configCollections.administrations}" />
				</aon:selectOneMenu>
			</aon:div>
			<aon:div rendered="#{vatTaxDeclaration.additionalDataEnabled}" styleClass="aon-text-left">
				<aon:outputLabel value="#{bundle.fiscal_model_303_act_msg}" />
				<aon:commandButton id="additionalData"
					value="#{vatTaxDeclaration.additionalDataDefined?'Ver ':'Crear '} #{bundle.aon_additional_data}"
					actionListener="#{vatTaxDeclaration.onAdditionalData}"
					styleClass="aon-finding-toolbar-item aon-icon-info"
					style="border-width: 0px 0px 0px 0px;margin-left: 10px;" />
				<aon:if test ="#{vatTaxDeclaration.additionalDataDefined}">
					<aon:commandButton id="deleteAdditionalData"
						value="Borrar #{bundle.aon_additional_data}"
						actionListener="#{vatTaxDeclaration.onRemoveAdditionalData}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						style="border-width: 0px 0px 0px 0px;margin-left: 10px;" />
				</aon:if>
			
				
			</aon:div>
			<aon:outputText value="&#160;" rendered="#{!vatTaxDeclaration.additionalDataEnabled}"/>

			<aon:outputText value="#{bundle.fiscal_operations_volume}" rendered="#{vatTax.to.anual}"/>
			<aon:outputText value="#{vatTaxDeclaration.to.operationsVolume}" styleClass="aon-bold" rendered="#{vatTax.to.anual}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}"/>
			</aon:outputText>
			<aon:outputText value="&#160;" rendered="#{vatTax.to.anual}"/>

			<aon:outputLabel for="VatTaxDeclaration_percent" value="#{bundle.fiscal_administration_percent}" />
			<aon:inputText id="VatTaxDeclaration_percent" size="8" value="#{vatTaxDeclaration.to.percent}"
				required="true">
				<a4j:support event="onchange" reRender="VatTaxDeclarationGrid" limitToList="true"
					actionListener="#{vatTaxDeclaration.calculate}" focus="VatTaxDeclaration_previousYearCompesateQuota"/>
			</aon:inputText>
			<aon:outputText value="&#160;" />

			<aon:outputText value="#{bundle.fiscal_administration_quota}" />
			<aon:outputText value="#{vatTaxDeclaration.to.quota}" styleClass="aon-bold">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:outputText value="&#160;" />

			<aon:outputLabel for="VatTaxDeclaration_previousYearCompesateQuota" value="#{bundle.fiscal_prev_year_compesate_quota2}" />
			<aon:inputText id="VatTaxDeclaration_previousYearCompesateQuota" size="8" value="#{vatTaxDeclaration.to.previousYearCompensateQuota}"
				required="true">
				<a4j:support event="onchange" reRender="VatTaxDeclarationGrid" limitToList="true"
					actionListener="#{vatTaxDeclaration.calculate}"
					focus="#{vatTax.to.anual?'VatTaxDeclaration_doneDeposits':'VatTaxDeclaration_extraCharge'}"/>
			</aon:inputText>
			<aon:outputText value="&#160;" />

			<aon:outputText value="#{bundle.fiscal_difference}" rendered="#{vatTax.to.anual}"/>
			<aon:outputText value="#{vatTaxDeclaration.to.difference}" styleClass="aon-bold" rendered="#{vatTax.to.anual}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:outputText value="&#160;" rendered="#{vatTax.to.anual}"/>

			<aon:outputLabel for="VatTaxDeclaration_doneDeposits" value="#{bundle.fiscal_done_deposits}" rendered="#{vatTax.to.anual}"/>
			<aon:inputText id="VatTaxDeclaration_doneDeposits" size="8" value="#{vatTaxDeclaration.to.doneDeposits}"
				required="true" rendered="#{vatTax.to.anual}">
				<a4j:support event="onchange" reRender="VatTaxDeclarationGrid" limitToList="true"
					actionListener="#{vatTaxDeclaration.calculate}" focus="VatTaxDeclaration_doneRefunds"/>
			</aon:inputText>
			<aon:outputText value="&#160;" rendered="#{vatTax.to.anual}"/>

			<aon:outputLabel for="VatTaxDeclaration_doneRefunds" value="#{bundle.fiscal_done_refunds}" rendered="#{vatTax.to.anual}"/>
			<aon:inputText id="VatTaxDeclaration_doneRefunds" size="8" value="#{vatTaxDeclaration.to.doneRefunds}"
				required="true" rendered="#{vatTax.to.anual}">
				<a4j:support event="onchange" reRender="VatTaxDeclarationGrid" limitToList="true"
					actionListener="#{vatTaxDeclaration.calculate}" focus="VatTaxDeclaration_extraCharge"/>
			</aon:inputText>
			<aon:outputText value="&#160;" rendered="#{vatTax.to.anual}"/>

			<aon:outputText value="#{bundle.fiscal_result}" />
			<aon:outputText value="#{vatTaxDeclaration.to.result}" styleClass="aon-bold">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:outputText value="&#160;" />
			
			<aon:div rendered="#{vatTaxDeclaration.to.compensateEnabled}">
				<aon:outputText value="#{bundle.fiscal_compensate}"/>
				<aon:commandLink value="(#{bundle.fiscal_pay_back})" styleClass="aon-italic aon-normal"
					style="text-decoration: underline; cursor: pointer; margin-left: 20px;"
					reRender="VatTaxDeclarationGrid" limitToList="true" actionListener="#{vatTaxDeclaration.changeCompensate}"/>
			</aon:div>
			<aon:outputText value="#{vatTaxDeclaration.to.compensate}" rendered="#{vatTaxDeclaration.to.compensateEnabled}"
				styleClass="aon-bold">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:outputText value="&#160;" rendered="#{vatTaxDeclaration.to.compensateEnabled}"/>

			<aon:div rendered="#{vatTaxDeclaration.to.payBackEnabled}">
				<aon:outputText value="#{bundle.fiscal_pay_back}"/>
				<aon:commandLink value="(#{bundle.fiscal_compensate})" styleClass="aon-italic aon-normal"
					style="text-decoration: underline; cursor: pointer; margin-left: 20px;"
					event="onclick" reRender="VatTaxDeclarationGrid" limitToList="true" actionListener="#{vatTaxDeclaration.changeCompensate}" />
			</aon:div>
			<aon:outputText value="#{vatTaxDeclaration.to.payBack}" rendered="#{vatTaxDeclaration.to.payBackEnabled}"
				styleClass="aon-bold">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:outputText value="&#160;" rendered="#{vatTaxDeclaration.to.payBackEnabled}"/>

			<aon:outputText value="#{bundle.fiscal_deposit}" rendered="#{vatTaxDeclaration.to.depositEnabled}"/>
			<aon:outputText value="#{vatTaxDeclaration.to.deposit}" rendered="#{vatTaxDeclaration.to.depositEnabled}"
				styleClass="aon-bold">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:outputText value="&#160;" rendered="#{vatTaxDeclaration.to.depositEnabled}"/>

			<aon:outputLabel for="VatTaxDeclaration_previousDeposit" value="#{bundle.fiscal_previous_deposit}" rendered="#{vatTax.to.extraDeclaration}"/>
			<aon:inputText id="VatTaxDeclaration_previousDeposit" size="8" value="#{vatTaxDeclaration.to.previousDeposit}"
				required="true" rendered="#{vatTax.to.extraDeclaration}">
				<a4j:support event="onchange" reRender="VatTaxDeclarationGrid" limitToList="true"
					actionListener="#{vatTaxDeclaration.calculate}" focus="VatTaxDeclaration_previousPayBack"/>
			</aon:inputText>
			<aon:outputText value="&#160;" rendered="#{vatTax.to.extraDeclaration}"/>

			<aon:outputLabel for="VatTaxDeclaration_previousPayBack" value="#{bundle.fiscal_previous_pay_back}" rendered="#{vatTax.to.extraDeclaration}"/>
			<aon:inputText id="VatTaxDeclaration_previousPayBack" size="8" value="#{vatTaxDeclaration.to.previousPayBack}"
				required="true" rendered="#{vatTax.to.extraDeclaration}">
				<a4j:support event="onchange" reRender="VatTaxDeclarationGrid" limitToList="true"
					actionListener="#{vatTaxDeclaration.calculate}" focus="VatTaxDeclaration_extraCharge"/>
			</aon:inputText>
			<aon:outputText value="&#160;" rendered="#{vatTax.to.extraDeclaration}"/>

			<aon:outputLabel for="VatTaxDeclaration_extraCharge" value="#{bundle.fiscal_extra_charge}" rendered="#{vatTaxDeclaration.to.depositEnabled}"/>
			<aon:inputText id="VatTaxDeclaration_extraCharge" size="8" value="#{vatTaxDeclaration.to.extraCharge}"
				required="true" rendered="#{vatTaxDeclaration.to.depositEnabled}">
				<a4j:support event="onchange" reRender="VatTaxDeclarationGrid" limitToList="true"
					actionListener="#{vatTaxDeclaration.calculate}" focus="VatTaxDeclaration_delayInterest"/>
			</aon:inputText>
			<aon:outputText value="&#160;" rendered="#{vatTaxDeclaration.to.depositEnabled}"/>
			
			<aon:outputLabel for="VatTaxDeclaration_delayInterest" value="#{bundle.fiscal_delay_interest}" rendered="#{vatTaxDeclaration.to.depositEnabled}"/>
			<aon:inputText id="VatTaxDeclaration_delayInterest" size="8" value="#{vatTaxDeclaration.to.delayInterest}"
				required="true" rendered="#{vatTaxDeclaration.to.depositEnabled}">
				<a4j:support event="onchange" reRender="VatTaxDeclarationGrid" limitToList="true"
					actionListener="#{vatTaxDeclaration.calculate}"/>
			</aon:inputText>
			<aon:outputText value="&#160;" rendered="#{vatTaxDeclaration.to.depositEnabled}"/>

			<aon:outputText value="#{bundle.fiscal_total_tax_debt}" rendered="#{vatTaxDeclaration.to.depositEnabled}"/>
			<aon:outputText value="#{vatTaxDeclaration.to.totalTaxDebt}"
				styleClass="aon-bold" rendered="#{vatTaxDeclaration.to.depositEnabled}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:outputText value="&#160;" rendered="#{vatTaxDeclaration.to.depositEnabled}"/>
		</aon:panelGrid>
					
		<aon:panelGrid columns="2" dir="true" width="100%" styleClass="aon-margin-top"
			columnClasses="aon-panelGrid-odd aon-width-300
			              ,aon-panelGrid-even aon-width-auto">
			              
			<aon:outputLabel for="VatTaxDeclaration_registryBank_id" value="#{bundle.aon_bank_account}" />
			<aon:selectOneMenu id="VatTaxDeclaration_registryBank_id"
				value="#{vatTaxDeclaration.to.registryBank}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{companyCollections.allCompanyBanks}" />
			</aon:selectOneMenu>
		</aon:panelGrid>			
	</aon:div>
</ui:composition>
