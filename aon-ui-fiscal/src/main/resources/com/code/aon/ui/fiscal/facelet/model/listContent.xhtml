<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form id="fiscalModelForm">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{moduleLabel}" />
			<ui:param name="controller" value="#{controller}" />
		</ui:decorate>
	
		<aon:div styleClass="aon-scroll-area">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
				<ui:param name="controller" value="#{controller}" />
	
				<ui:define name="columns">
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_year}" />
						</f:facet>
						<aon:outputText value="#{to.year}" />
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_period}" />
						</f:facet>
						<aon:outputText value="#{to.period}" />
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-iconColumn aon-text-center">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="&#160;"
							style="padding-left: 16px;"
							styleClass="#{to.pending?'aon-icon-edit-add-simple':'aon-icon-accept'}"/>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_administration}" />
						</f:facet>
						<aon:outputText value="#{to.administration}" />
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-50">
						<f:facet name="header">
							<aon:outputText value="#{bundle.fiscal_replacement_abbr}" />
						</f:facet>
						<aon:div styleClass="#{to.replacement?'aon-icon-checked':'aon-icon-check'}">
							<aon:outputText value="&#160;" />
						</aon:div>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-iconColumn aon-text-center">
						<f:facet name="header">
							<aon:outputText value="C" />
						</f:facet>
						<aon:div style="display:inline;cursor:pointer;"
							rendered="#{to.comments != null and to.comments != ''}">
							<aon:outputText value="&#160;" 
								style="padding-left:15px;" styleClass="aon-icon-comment"/>
							<rich:toolTip value="#{to.comments}" 
								showEvent="onmouseover"
								style="width: 400px;">
								<f:facet name="defaultContent">
									<aon:outputText value="#{bundle.aon_in_progress}" />
								</f:facet>
							</rich:toolTip>
						</aon:div>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_document}" />
						</f:facet>
						<aon:outputText value="#{to.document}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_document}" />
						</f:facet>
						<aon:outputText value="#{to.surname}" />
						<aon:outputText value="&#160;" />
						<aon:outputText value="#{to.name}" />
					</aon:column>
					
				</ui:define>
			</ui:decorate>
		</aon:div>
	
	</aon:form>

</ui:composition>
