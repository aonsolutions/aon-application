<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="vatTaxForm" styleClass="aon-form">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{fiscalBundle.fiscal_professional_retention_module}" />
				<ui:param name="controller" value="#{profRetention}" />
			</ui:include>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{profRetention}" />

				<ui:define name="searchContent">
					<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml">
						<ui:param name="lookupTo" value="#{controller.enterprise}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>
				
					<aon:outputText value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="ProfessionalRetention_paymentDate-From" styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="ProfessionalRetention_paymentDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
				
						<aon:outputLabel for="ProfessionalRetention_paymentDate-To" styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="ProfessionalRetention_paymentDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>

					<aon:outputLabel for="ProfessionalRetention_name" value="#{bundle.aon_company_name}" />
					<aon:inputText id="ProfessionalRetention_name" size="60" valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="ProfessionalRetention_document" value="#{bundle.aon_document}" />
					<aon:div>
						<aon:selectOneMenu id="ProfessionalRetention_documentCountry" converter="aon.EnumConverter" valueChangeListener="#{controller.addExpression}">
							<f:selectItem itemLabel="-" value="#{null}" />		
							<f:selectItems value="#{commonCollections.countryCodes}" />
						</aon:selectOneMenu>
						<aon:selectOneMenu id="ProfessionalRetention_documentType" 
							styleClass="aon-margin-left" converter="aon.EnumConverter" 
							valueChangeListener="#{controller.addExpression}">
							<f:selectItem itemLabel="-" value="#{null}" />		
							<f:selectItems value="#{registryCollections.documentTypes}" />
						</aon:selectOneMenu>
						<aon:inputText id="ProfessionalRetention_document" size="20" styleClass="aon-inputText aon-margin-left"  
							valueChangeListener="#{controller.addExpression}" />
					</aon:div>

					<aon:outputLabel for="ProfessionalRetention_concept" value="#{bundle.aon_concept}" />
					<aon:inputText id="ProfessionalRetention_concept" size="60" valueChangeListener="#{controller.addExpression}" />
				</ui:define>
				
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
