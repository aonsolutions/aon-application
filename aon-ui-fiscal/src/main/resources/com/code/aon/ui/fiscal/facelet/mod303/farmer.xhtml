<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<aon:div styleClass="aon-width-all aon-text-center"
		style="border: dotted #CCC 1px;">
		<aon:outputText value="#{controller.selectedActivity}"
			style="margin-top: 5px;font-weight: bold;" />
	</aon:div>
	
	<aon:panelGrid columns="2" styleClass="aon-panelGrid aon-width-all aon-margin-top"
		columnClasses="aon-panelGrid-odd aon-width-auto 
			,aon-panelGrid-even aon-width-150 aon-text-right">
			
		<aon:outputText value="#{controller.modV1Key}" />
		<aon:outputText value="#{controller.modV1.amount}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>

		<aon:outputText value="#{controller.modV2Key}" />
		<aon:outputText value="#{controller.modV2.amount}">
			<f:convertNumber pattern="#,##0.00000" />
		</aon:outputText>

		<aon:outputText value="#{controller.modV3Key}" />
		<aon:outputText value="#{controller.modV3.amount}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>

		<aon:outputText value="#{controller.modV4Key}" />
		<aon:outputText value="#{controller.modV4.amount}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
		
		<aon:outputText value="#{controller.modV5Key}" />
		<aon:div>
			<aon:outputText value="#{controller.modV5.amount}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:outputText value="&#160;(Modif.)" rendered="#{controller.modV5.adjustAmount != 0}" style="color:red;"/>
		</aon:div>
			
	</aon:panelGrid>
</ui:composition>
