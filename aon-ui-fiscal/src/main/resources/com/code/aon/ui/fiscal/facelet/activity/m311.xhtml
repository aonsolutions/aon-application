<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:dataTable id="m311InfoTable" value="#{fiscalActivity.m311Model}" var="info" rows="0" 
		styleClass="aon-margin-top aon-width-all">
	
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
	 		<aon:div>
	 			<aon:outputText value="#{info.infoKey.value}" style="font-size: 0.8em; margin-right: 1em;" />
		 		<aon:outputText style="#{info.title?'font-weight: bold;':''}" 
		 			value="#{info.infoKey}" />
	 		</aon:div>
		</aon:column>
	 			
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
			<aon:div rendered="#{!info.title}">
				<aon:inputText id="m311InfoKey_#{info.infoKey}" 
					value="#{info.doubleValue}" size="8"
					required="#{info.required}"
					rendered="#{!info.calculated}">
					<a4j:support event="onchange" ajaxSingle="true"
						actionListener="#{fiscalActivity.onChangeM311}"
						reRender="m311InfoTable"/>
				</aon:inputText>
					
				<aon:outputText  value="#{info.doubleValue}"
					rendered="#{info.calculated}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />					
				</aon:outputText>
			</aon:div>
				
	 	</aon:column>
	</aon:dataTable>
	
</ui:composition>
