<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml"
	xmlns:rich="http://richfaces.org/rich">

	<ui:define name="content">
		<aon:form>

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.fiscal_model_349_module}" />
				<ui:param name="controller" value="#{mod349}" />
			</ui:include>

			<aon:div style="color:red; font-size: 1.2em; padding: 5px; text-align:center; border: solid red 1px; margin-bottom: 5px; margin-top: 5px; font-weight: bold;">
				<aon:div>
					<aon:outputLabel value="A partir del ejercicio 2018, utilice el nuevo módulo del 349" />
				</aon:div>
			</aon:div>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{mod349}" />
				<ui:define name="searchContent">
				
					<aon:outputLabel for="Mod349_year" value="#{bundle.aon_year}" />
					<aon:inputText id="Mod349_year" size="5" valueChangeListener="#{mod349.addExpression}" />

					<aon:outputLabel for="Mod349_period"
						value="#{bundle.finance_vat_period}" />
					<aon:selectOneMenu id="Mod349_period"
						valueChangeListener="#{controller.addEqualExpression}"
						converter="aon.EnumConverter">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{fiscalCollections.periods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Mod349_status"
						value="#{bundle.aon_status}" />
					<aon:selectOneRadio id="Mod349_status"
						valueChangeListener="#{controller.addEqualExpression}"
						converter="aon.EnumConverter">
						<f:selectItem value="#{null}" itemLabel="#{bundle.aon_all}" />
						<f:selectItems value="#{fiscalCollections.mod349Statuses}" />
					</aon:selectOneRadio>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
