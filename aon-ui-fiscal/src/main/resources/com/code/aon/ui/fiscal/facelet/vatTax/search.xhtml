<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="vatTaxForm" styleClass="aon-form">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.fiscal_vat_tax_module2}" />
				<ui:param name="controller" value="#{vatTax}" />
			</ui:include>
			<aon:div style="color:red; font-size: 1.2em; padding: 5px; text-align:center; border: solid red 1px; margin-bottom: 5px; margin-top: 5px; font-weight: bold;">
				<aon:div>
					<aon:outputLabel value="A partir del ejercicio 2018, utilice el nuevo módulo de IVA" />
				</aon:div>
				<aon:div>
					<aon:outputLabel value="Los datos introducidos en este programa, no se tendrán en cuenta" />
				</aon:div>
			</aon:div>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{vatTax}" />

				<ui:define name="searchContent">
					<aon:outputLabel for="VatTax_year" value="#{bundle.aon_year}" />
					<aon:inputText id="VatTax_year" size="5"
						valueChangeListener="#{vatTax.addExpression}" />

					<aon:outputLabel for="VatTax_period"
						value="#{bundle.finance_vat_period}" />
					<aon:selectOneMenu id="VatTax_period"
						valueChangeListener="#{controller.addEqualExpression}"
						converter="aon.EnumConverter">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{fiscalCollections.periods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="VatTax_status"
						value="#{bundle.aon_status}" />
					<aon:selectOneRadio id="VatTax_status"
						valueChangeListener="#{controller.addEqualExpression}"
						converter="aon.EnumConverter">
						<f:selectItem value="#{null}" itemLabel="#{bundle.aon_all}" />
						<f:selectItems value="#{fiscalCollections.vatTaxStatuses}" />
					</aon:selectOneRadio>
				</ui:define>
				
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
