<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="withholdingForm" styleClass="aon-form">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.fiscal_withholding_module}" />
				<ui:param name="controller" value="#{withholdingReport}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipBackButton" value="#{true}" />
			</ui:include>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{withholdingReport}" />
				<ui:param name="skipAfterSearch" value="true" />
				
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{withholdingReport.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="withholdingReport_list" />

					
					<!--  Condicionar al mono empresa -->
					<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml">
						<ui:param name="lookupTo" value="#{withholdingReport.params.enterprise}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>
				
					<aon:outputLabel for="Withholding_year" value="#{bundle.aon_year}" />
					<aon:inputText id="Withholding_year" size="5" required="true"
						value="#{withholdingReport.params.year}" />

					<aon:outputLabel for="Withholding_period" value="#{bundle.aon_period}" />
					<aon:selectOneMenu id="Withholding_period" value="#{withholdingReport.params.period}" required="true">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{fiscalCollections.periods}" />
					</aon:selectOneMenu>

				</ui:define>
				
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
