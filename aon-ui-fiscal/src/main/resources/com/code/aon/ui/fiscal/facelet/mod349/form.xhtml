<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="mod349Form">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.fiscal_model_349_module}" />
				<ui:param name="controller" value="#{mod349}" />
				<ui:param name="skipRemoveButton" value="#{mod349.to.finished}" />

				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="#{toolbarID}-finish"
						value="#{bundle.aon_finalice}"
						actionListener="#{mod349.onFinish}"
						rendered="#{!mod349.nevv and !mod349.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-lock"
						onclick="if (!confirm('#{bundle.aon_finalice}?')) return false;"/>
					<aon:commandButton id="#{toolbarID}-reopen"
						value="#{bundle.fiscal_reopen}"
						actionListener="#{mod349.onReopen}"
						rendered="#{!mod349.nevv and mod349.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-unlock"
						onclick="if (!confirm('#{bundle.fiscal_reopen}?')) return false;"/>
					<!-- 
					<aon:htmlCommandLink id="mod349List-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="mod349List" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>							
					<aon:htmlCommandLink id="mod349List-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="mod349List" />
					</aon:htmlCommandLink>
					 -->
				</ui:define>
			</ui:decorate>

			<aon:div style="color:red; font-size: 1.2em; padding: 5px; text-align:center; border: solid red 1px; margin-bottom: 5px; margin-top: 5px; font-weight: bold;">
				<aon:div>
					<aon:outputLabel value="A partir del ejercicio 2018, utilice el nuevo módulo del 349" />
				</aon:div>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="panel1" columns="10" dir="true" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-100
								  ,aon-panelGrid-even aon-width-80
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-100
								  ,aon-panelGrid-even aon-width-150
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-100
								  ,aon-panelGrid-even aon-width-auto
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-100">

					<aon:outputLabel for="mod349_year" value="#{bundle.aon_year}" />
					<aon:inputText id="mod349_year" size="5" value="#{mod349.to.year}"
						required="true" disabled="#{mod349.to.finished}"/>
	
					<aon:outputLabel for="mod349_period"
						value="#{bundle.aon_period}" />
					<aon:selectOneMenu id="mod349_period" value="#{mod349.to.period}"
						required="true" disabled="#{mod349.to.finished}">
						<f:selectItems value="#{fiscalCollections.periods}" />
					</aon:selectOneMenu>

					<aon:div>
						<aon:selectBooleanCheckbox id="mod349_replacement"
							disabled="#{mod349.to.finished}"
							value="#{mod349.to.replacement}"/>
						<aon:outputLabel for="mod349_replacement" styleClass="aon-italic"
							value="#{bundle.aon_replacement}" />
						<aon:panelGroup rendered="#{mod349.to.replacement}" styleClass="aon-italic">
							<aon:outputText value=" (" />
							<aon:outputText value="#{mod349.to.replacedNumber}" />
							<aon:outputText value=")" />
						</aon:panelGroup>
					</aon:div>

					<aon:outputText value="#{bundle.aon_status}" />
					<aon:div style="padding-left: 16px;" styleClass="aon-nowrap;#{mod349.to.finished?'aon-icon-lock':'aon-icon-unlock'}">
						<aon:outputText value="#{mod349.to.status}" />
					</aon:div>
	
					<aon:div>
						<aon:if test="#{aonRole.confidentiality}">
							<aon:selectBooleanCheckbox id="mod349_securityLevel"
								value="#{mod349.to.confidential}" rendered="#{!mod349.to.finished}"/>
							<aon:outputLabel for="mod349_securityLevel" styleClass="aon-italic"
								value="#{bundle.aon_confidential}" rendered="#{!mod349.to.finished}"/>
							<aon:outputText styleClass="aon-icon aon-icon-confidential"
								value="&#160;" title="#{bundle.aon_confidential}"
								rendered="#{mod349.to.finished and mod349.to.confidential}" />
						</aon:if>
					</aon:div>
					
					<aon:outputText value="#{bundle.aon_number}" />
					<aon:outputText value="#{mod349.to.number}" />
					
				</aon:panelGrid>
				
				<aon:panelGrid id="panel2" columns="3" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-100
								,aon-panelGrid-even aon-width-400
								,aon-panelGrid-even aon-width-auto">
					
					<aon:outputLabel for="mod349_administration"
						value="#{bundle.aon_administration}" />
					<aon:selectOneMenu id="mod349_administration" value="#{mod349.to.administration}"
						required="true" disabled="#{mod349.to.finished}">
						<f:selectItems value="#{configCollections.administrations}" />
					</aon:selectOneMenu>
					<aon:outputText value="&#160;" />

					<aon:outputLabel for="mod349_comments" value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="mod349_comments" cols="80" rows="2" value="#{mod349.to.comments}"/>

					<aon:div>
						<aon:commandButton id="gen-disk"
							value="#{bundle.finance_create_disk}"
							actionListener="#{mod349.onCreateDisk}"
							rendered="#{!mod349.nevv and mod349.to.finished and mod349.fileOutput==null}"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							style="border-width: 0px 0px 0px 0px;" reRender="panel2"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:htmlCommandLink target="_blank"
							title="#{mod349.diskOk?(bundle.finance_download_disk):(bundle.finance_download_error)}"
							value="#{mod349.diskOk?(bundle.finance_download_disk):(bundle.finance_download_error)}"
							style="border-width: 0px 0px 0px 0px;"
							actionListener="#{mod349.downloadDisk}"
							rendered="#{!mod349.nevv and mod349.fileOutput!=null}"
							styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
					</aon:div>
										
				</aon:panelGrid>

				<aon:if test="#{mod349.nevv}">

					<aon:div styleClass="aon-panelGrid-search">
						<aon:div styleClass="aon-panelGrid-search-info">
							<aon:outputText value="#{bundle.fiscal_mod347_import_info}" 
									styleClass="aon-panelGrid-search-info-internal"/>
						</aon:div>
						
						<aon:panelGrid id="searchContentID" columns="4">
							
							<aon:div>
								<aon:selectBooleanCheckbox id="mod349_generateLines" value="#{mod349.to.generateLines}"
									reRender="searchContentID" />
								<aon:outputLabel for="mod349_generateLines" value="#{bundle.fiscal_mod347_generate_lines}" />
							</aon:div>
							<aon:outputText value="&#160;" />
							<aon:outputText value="&#160;" />
							<aon:outputText value="&#160;" />
							
							<aon:if test="#{mod349.to.generateLines}">
								<aon:outputText value="&#160;" />
								<aon:div>
									<aon:selectBooleanCheckbox id="mod349_taxDateEnabled"  
										value="#{mod349.params.taxDateEnabled}"/>
									<aon:outputLabel for="mod349_taxDateEnabled" value="#{bundle.fiscal_mod347_generate_from_tax_date}" />
								</aon:div>
								<aon:outputText value="&#160;" />									
								<aon:outputText value="&#160;" />
								
								<aon:outputText value="&#160;" />
								<aon:div>
									<aon:div>
										<aon:selectBooleanCheckbox id="mod349_groupedByNIF"  
											value="#{mod349.params.groupedByNIF}"/>
										<aon:outputLabel for="mod349_groupedByNIF" value="#{bundle.fiscal_mod347_grouped_by_nif}" />
									</aon:div>
									<aon:div>
										<aon:outputText style="margin-left: 20px;" 
											value="#{bundle.fiscal_mod347_grouped_by_nif_bis}" />
									</aon:div>
								</aon:div>
								<aon:outputText value="&#160;" />									
								<aon:outputText value="&#160;" />
							</aon:if>
						</aon:panelGrid>
					</aon:div>
				</aon:if>
				
				<aon:if test="#{!mod349.nevv}">
					<ui:include src="/com/code/aon/ui/fiscal/facelet/mod349/detail.xhtml" />
				</aon:if>
				
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
