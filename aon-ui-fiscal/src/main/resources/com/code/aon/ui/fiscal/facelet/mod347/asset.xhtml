<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">


		<c:if test="#{!mod347.new}">
	
		<aon:div styleClass="aon-margin-top">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
				<ui:param name="controller" value="#{mod347DetailAsset}" />
				<ui:param name="skipLineEdition" value="#{mod347.to.finished}" />
				<ui:param name="skipResetButton" value="#{mod347.to.finished}" />

				<ui:define name="columns">

					<aon:column alias="Mod347Detail.document" 
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-textColumn aon-width-70">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_document" value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.document}" rendered="#{formList}"/>
						<aon:inputText id="mod347_detail_document" value="#{controller.to.document}"
							rendered="#{formEdit}" size="9" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_document-NEW" value="#{controller.to.document}"
								rendered="#{formNew}" size="9" required="true"/>
						</f:facet>
					</aon:column>

					<aon:column	alias="Mod347Detail.name"
						style="font-size: 0.8em;" 
						styleClass="aon-editDataTable-textColumn aon-width-200">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_name" value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" rendered="#{formList}"/>
						<aon:inputText id="mod347_detail_name" value="#{controller.to.name}"
							rendered="#{formEdit}" size="30" maxLength="40" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_name-NEW" value="#{controller.to.name}"
								rendered="#{formNew}" size="30" maxLength="40" required="true"/>
						</f:facet>
					</aon:column>

					<aon:column	alias="Mod347Detail.amount" 
						style="font-size: 0.9em;"
						styleClass="aon-editDataTable-numberColumn aon-bold aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_amount" value="#{bundle.aon_amount}" />
						</f:facet>
						<aon:outputText value="#{to.amount}" rendered="#{formList}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText id="mod347_detail_amount" value="#{controller.to.amount}"
							rendered="#{formEdit}" size="8" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_amount-NEW" value="#{controller.to.amount}"
								rendered="#{formNew}" size="8" required="true"/>
						</f:facet>
					</aon:column>
					
					<aon:column	alias="Mod347Detail.assetLocation"
						style="font-size: 0.8em; text-align: center;" 
						styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_assetLocation" value="Loc. Inmueble" />
						</f:facet>
						<aon:outputText value="#{to.assetLocation}" rendered="#{formList}"/>
							<aon:selectOneMenu id="mod347_assetLocation" value="#{controller.to.assetLocation}"
								rendered="#{formEdit}" required="true">
								<f:selectItems value="#{mod347DetailAsset.assetLocations}" />
							</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu id="mod347_assetLocation-NEW" value="#{controller.to.assetLocation}"
								rendered="#{formNew}" required="true">
								<f:selectItems value="#{mod347DetailAsset.assetLocations}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>

					<aon:column	alias="Mod347Detail.cadasdralReference"
						style="font-size: 0.8em;" 
						styleClass="aon-editDataTable-textColumn aon-width-150">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_cadasdralReference" value="Ref. Castastral" />
						</f:facet>
						<aon:outputText value="#{to.cadasdralReference}" rendered="#{formList}"/>
						<aon:inputText id="mod347_detail_cadasdralReference" value="#{controller.to.cadasdralReference}"
							rendered="#{formEdit}" size="20" maxLength="25" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_cadasdralReference-NEW" value="#{controller.to.cadasdralReference}"
								rendered="#{formNew}" size="20" maxLength="25" required="true"/>
						</f:facet>
					</aon:column>

					<aon:column
						style="font-size: 0.8em;" 
						styleClass="aon-editDataTable-textColumn aon-width-auto">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_address}" />
						</f:facet>
						<aon:outputText value="#{to.address}" rendered="#{formList}"/>
						<aon:div rendered="#{formEdit}">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/mod347/address.xhtml">
									<ui:param name="suffix" value="" />
							</ui:include>		
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{formNew}">
								<ui:include src="/com/code/aon/ui/fiscal/facelet/mod347/address.xhtml">
									<ui:param name="suffix" value="-New" />
								</ui:include>
							</aon:div>
						</f:facet>
					</aon:column>
				</ui:define>
			</ui:decorate>
		</aon:div>
	</c:if>
</ui:composition>
