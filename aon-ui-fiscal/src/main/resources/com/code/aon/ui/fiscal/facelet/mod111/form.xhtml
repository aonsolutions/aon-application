<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:if test="#{customize.snapshotVersion}">
			<aon:div styleClass="aon-panelGrid-search aon-margin-bottom aon-text-center">	
				<aon:outputText value="PROGRAMA OBSOLETO" style="color:red; font-weight: bold; font-size: 14px;"/>
				<aon:form>
				<aon:commandLink 
					style="margin-left: 10px;"
					id="gwt_mod111" 
					action="gwt_mod111" 
					value="[Pruebe el nuevo]">
				</aon:commandLink>
				</aon:form>
			</aon:div>
		</aon:if>

			<ui:decorate template="/com/code/aon/ui/fiscal/facelet/model/formContent.xhtml">
				<ui:param name="moduleLabel" value="#{bundle.fiscal_model_111_module_abbr}" />
				<ui:param name="controller" value="#{mod111}" />
				<ui:param name="skipDetail" value="#{false}" />
				<ui:param name="quarterPeriods" value="#{false}" />
				
				<ui:define name="extraHeader">
					<aon:if test="#{mod111.nevv}">
						<aon:div styleClass="aon-panelGrid-search aon-margin-bottom">
							<aon:div styleClass="aon-panelGrid-search-info">
								<aon:outputText value="#{bundle.fiscal_mod111_import_info}" 
										styleClass="aon-panelGrid-search-info-internal"/>
							</aon:div>
							
							<aon:panelGrid id="searchContentID" columns="2">
								
								<aon:outputText value="&#160;" />
								<aon:div>
									<aon:selectOneRadio id="mod111_readAccount" layout="pageDirection"
										ajaxSingle="true" reRender="receiverCountContainer"
										value="#{mod111.to.readRetentionFromAccount}">
										<f:selectItem itemValue="false" itemLabel="#{bundle.fiscal_mod111_import_salary}" />
										<f:selectItem itemValue="true" itemLabel="#{bundle.fiscal_mod111_import_entry}" />
									</aon:selectOneRadio>
									<aon:div id="receiverCountContainer">
										<aon:div  style="margin-left: 25px;" rendered="#{mod111.to.readRetentionFromAccount}">
											<aon:div>
												<aon:outputLabel for="mod111_input_imports"
													styleClass="aon-margin-left" 
													value="#{bundle.fiscal_model111_receiver_count}" />
												<aon:inputText id="mod111_input_imports"
													value="#{mod111.to.receiverCount}" size="5" />
											</aon:div>
											<aon:div>
												<aon:outputLabel for="mod111_input_importsInKind"
													styleClass="aon-margin-left" 
													value="#{bundle.fiscal_model111_receiver_in_kind_count}" />
												<aon:inputText id="mod111_input_importsInKind"
													 value="#{mod111.to.receiverInKindCount}" size="5" />
											</aon:div>
											<aon:div
												styleClass="aon-italic" 
												style="margin-top: 5px; margin-left: 5px;margin-right: 50px; padding: 5px; border: solid red 1px;">
												<aon:outputText value="#{mod111.infoMessage}"/>
											</aon:div>
										</aon:div>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:div>
					</aon:if>
				</ui:define>
			</ui:decorate>
	</ui:define>
</ui:composition>
