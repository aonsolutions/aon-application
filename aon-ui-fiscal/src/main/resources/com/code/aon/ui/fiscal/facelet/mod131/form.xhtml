<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

			<ui:decorate template="/com/code/aon/ui/fiscal/facelet/model/formContent.xhtml">
				<ui:param name="moduleLabel" value="#{bundle.fiscal_model_131_module_abbr}" />
				<ui:param name="controller" value="#{mod131}" />
				<ui:param name="quarterPeriods" value="#{true}" />
				<ui:param name="skipDetail" value="#{true}" />
				<ui:param name="skipHeader" value="#{true}" />
				
				<ui:define name="customDetail">
					<c:if test="#{!controller.nevv}">
					
						<ui:include src="/com/code/aon/ui/fiscal/facelet/mod131/activitiesGrid.xhtml"/>
						
						<aon:div id="detailContainer" styleClass="aon-width-all aon-margin-top">
							<aon:dataTable value="#{controller.declaration.notActivityKeys}" var="key">
								<ui:include src="/com/code/aon/ui/fiscal/facelet/model/detailContent.xhtml"/>
							</aon:dataTable>
						</aon:div>
					</c:if>
				</ui:define>
			</ui:decorate>
	</ui:define>
</ui:composition>
