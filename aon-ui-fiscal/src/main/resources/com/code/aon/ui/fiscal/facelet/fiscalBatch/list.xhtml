<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="mod347List">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{registryBundle.registry_batch_document}" />
				<ui:param name="controller" value="#{fiscalBatch}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{fiscalBatch}" />

					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-100" alias="FiscalBatch.date">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-150" alias="FiscalBatch.administration">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_administration}" />
							</f:facet>
							<aon:outputText value="#{to.administration}" />
						</aon:column>

						<aon:column	styleClass="aon-editDataTable-textColumn aon-width-80" alias="FiscalBatch.year">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_year}" />
							</f:facet>
							<aon:outputText value="#{to.year}" />
						</aon:column>

						<aon:column	styleClass="aon-editDataTable-textColumn aon-width-80" alias="FiscalBatch.period">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_period}" />
							</f:facet>
							<aon:outputText value="#{to.period}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-150" alias="FiscalBatch.type">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_model}" />
							</f:facet>
							<aon:outputText value="#{to.type}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" alias="FiscalBatch.comment">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_comment}" />
							</f:facet>
							<aon:outputText value="#{to.comments}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
