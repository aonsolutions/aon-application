<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.fiscal_invoice_report}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">

				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />

					<aon:outputLabel for="reportDate"
						value="#{bundle.finance_report_date}" />
					<aon:panelGrid columns="1">
						<aon:selectInputDate id="reportDate"
							value="#{invoiceReport.params.date}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>
					
					<aon:outputLabel for="invoiceDate-From"
						value="#{bundle.finance_invoice_date}" />
					<aon:panelGrid columns="3">
						<aon:selectInputDate id="invoiceDate-From"
							value="#{invoiceReport.params.fromInvoiceDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="entryDate-To" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="invoiceDate-To"
							value="#{invoiceReport.params.toInvoiceDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>

					<aon:outputLabel for="entryDate-From"
						value="#{bundle.finance_tax_date}" />
					<aon:panelGrid columns="3">
						<aon:selectInputDate id="entryDate-From"
							value="#{invoiceReport.params.fromTaxDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
						<aon:outputLabel for="entryDate-To" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="entryDate-To"
							value="#{invoiceReport.params.toTaxDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>

					<aon:if test="#{aonRole.confidentiality}">
						<aon:outputLabel for="AccountEntry_securityLevel"
							value="#{bundle.aon_security_level}" />
						<aon:selectOneMenu id="AccountEntry_securityLevel"
							value="#{invoiceReport.params.securityLevel}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{commonCollections.securityLevels}" />
						</aon:selectOneMenu>
					</aon:if>

					<aon:outputText value="" />
					<aon:outputText value="" />
					
					<aon:outputText value="" />
					<aon:div>
						<aon:htmlCommandLink id="vatBook-excel-report"
							value="#{bundle.aon_search}" target="_blank" 
							action="#{invoiceReport.onExcelReport}"
							styleClass="aon-search-lookup-button"
							style="border: 1px solid black; background-color: #eeeeee;"
							>
						</aon:htmlCommandLink>
					</aon:div>	

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
