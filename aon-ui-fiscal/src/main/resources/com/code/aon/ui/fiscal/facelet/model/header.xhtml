<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:panelGrid id="panelIdentification" columns="2" dir="true" width="100%"
		styleClass="aon-margin-bottom"
		columnClasses="aon-panelGrid-odd aon-width-150
					  ,aon-panelGrid-even aon-width-auto">

		<aon:if test="#{controller.multiDeclarationEnabled}">
			<aon:outputLabel for="controller_previous" value="Seleccione datos previos" />
			<aon:selectOneMenu id="controller_previous" value="#{controller.previousDeclarationDocument}">
				<f:selectItems value="#{controller.previousDeclarationDocuments}" />
				<a4j:support ajaxSingle="true" event="onchange"
					actionListener="#{controller.onSelectPreviousDeclarationDocument}"
					reRender="panelIdentification"/>
			</aon:selectOneMenu>
			
			<aon:outputText value="&#160;" />
			<aon:outputText value="&#160;" />
		</aon:if>

		<aon:outputLabel for="controller_document" value="#{bundle.aon_company_document}" />
		<aon:div id="documentContainer">
			<aon:inputText id="controller_document" size="10" maxlength="9" required="true"
				value="#{controller.to.document}" disabled="#{controller.declaration.header.readOnly}">
			</aon:inputText>
			<aon:panelGroup rendered="#{controller.participationPercentEnabled and controller.nevv}" style="margin-left: 5px;">
				<aon:outputLabel for="controller_participation" value="#{bundle.fiscal_model_particiapation_percent}" />
				<aon:inputText id="controller_participation" size="5" maxlength="6" 
					required="true" style="margin-left: 5px;" value="#{controller.to.participationPercent}" 
					disabled="#{controller.declaration.header.readOnly}">
				</aon:inputText>
			</aon:panelGroup>
		</aon:div>
		
		<aon:outputLabel for="controller_name" value="#{bundle.aon_name}" />
		<aon:inputText id="controller_name" size="45" maxlength="45" required="true" 
			value="#{controller.to.name}" disabled="#{controller.declaration.header.readOnly}">
		</aon:inputText>

		<aon:outputLabel for="controller_surname" value="#{bundle.aon_surname}" />
		<aon:inputText id="controller_surname" size="30" maxlength="30" 
			value="#{controller.to.surname}" disabled="#{controller.declaration.header.readOnly}">
		</aon:inputText>
		
		<aon:outputLabel for="controller_phone" value="#{bundle.aon_phone}" />
		<aon:inputText id="controller_phone" size="9" maxlength="9" 
			value="#{controller.to.phone}" disabled="#{controller.declaration.header.readOnly}">
		</aon:inputText>
					  
		<aon:outputText value="#{bundle.aon_address}" />
		<aon:div>
			<aon:outputText value="#{bundle.fiscal_streetInitial}" 
				styleClass="aon-italic"/>
			<aon:inputText id="controller_streetInitial" size="2" maxlength="2"
				style="margin-left: 5px;" disabled="#{controller.declaration.header.readOnly}"
				value="#{controller.to.streetInitial}">
			</aon:inputText>
			
			<aon:outputText value="#{bundle.fiscal_streetName}" 
				styleClass="aon-margin-left aon-italic"/>
			<aon:inputText id="controller_streetName" size="17" maxlength="17" 
				style="margin-left: 5px;" disabled="#{controller.declaration.header.readOnly}" 
				value="#{controller.to.streetName}">
			</aon:inputText>

			<aon:outputText value="#{bundle.fiscal_streetNumber}" 
				styleClass="aon-margin-left aon-italic"/>
			<aon:inputText id="controller_streetNumber" size="4" maxlength="4" 
				style="margin-left: 5px;" disabled="#{controller.declaration.header.readOnly}" 
				value="#{controller.to.streetNumber}">
			</aon:inputText>

			<aon:outputText value="#{bundle.fiscal_streetStair}" 
				styleClass="aon-margin-left aon-italic"/>
			<aon:inputText id="controller_streetStair" size="2" maxlength="2" 
				style="margin-left: 5px;" disabled="#{controller.declaration.header.readOnly}" 
				value="#{controller.to.streetStair}">
			</aon:inputText>

			<aon:outputText value="#{bundle.fiscal_streetFloor}" 
				styleClass="aon-margin-left aon-italic"/>
			<aon:inputText id="controller_streetFloor" size="2" maxlength="2" 
				style="margin-left: 5px;" disabled="#{controller.declaration.header.readOnly}" 
				value="#{controller.to.streetFloor}">
			</aon:inputText>

			<aon:outputText value="#{bundle.fiscal_streetDoor}" 
				styleClass="aon-margin-left aon-italic"/>
			<aon:inputText id="controller_streetDoor" size="2" maxlength="2" 
				style="margin-left: 5px;" disabled="#{controller.declaration.header.readOnly}" 
				value="#{controller.to.streetDoor}">
			</aon:inputText>
		</aon:div>
		
		<aon:outputLabel for="controller_town" value="#{bundle.aon_city}"/>
		<aon:inputText id="controller_town" size="21" maxlength="20" 
			disabled="#{controller.declaration.header.readOnly}" 
			value="#{controller.to.town}">
		</aon:inputText>

		<aon:outputLabel for="controller_town" value="#{bundle.aon_state}"/>
		<aon:inputText id="controller_province" size="18" maxlength="15" 
			disabled="#{controller.declaration.header.readOnly}" 
			value="#{controller.to.province}">
		</aon:inputText>

		<aon:outputLabel for="controller_zip" value="#{bundle.aon_postal_code}"/>
		<aon:inputText id="controller_zip" size="5" maxlength="5" 
			disabled="#{controller.declaration.header.readOnly}" 
			value="#{controller.to.zip}">
		</aon:inputText>
		
		<aon:outputLabel for="controller_contactPerson" value="#{bundle.fiscal_contact_person}"/>
		<aon:inputText id="controller_contactPerson" size="50" maxlength="100" 
			disabled="#{controller.declaration.header.readOnly}" 
			value="#{controller.to.contactPerson}">
		</aon:inputText>
	
		<aon:outputLabel for="controller_contactPhone" value="#{bundle.fiscal_contact_phone}"/>
		<aon:inputText id="controller_contactPhone" size="9" maxlength="9" 
			disabled="#{controller.declaration.header.readOnly}" 
			value="#{controller.to.contactPhone}">
		</aon:inputText>

		<aon:outputLabel for="controller_contactCellular" value="#{bundle.fiscal_contact_cellular}"/>
		<aon:inputText id="controller_contactCellular" size="9" maxlength="9" 
			disabled="#{controller.declaration.header.readOnly}"
			value="#{controller.to.contactCellular}">
		</aon:inputText>
		
		<aon:outputLabel for="controller_contactEmail" value="#{bundle.fiscal_contact_email}"/>
		<aon:inputText id="controller_contactEmail" size="50" maxlength="50" 
			disabled="#{controller.declaration.header.readOnly}"
			value="#{controller.to.contactEmail}">
		</aon:inputText>
		
		<aon:outputLabel for="administration_code"
			rendered="#{controller.to.fromCommonTerritory}" 
			value="#{bundle.fiscal_administration_code}" />
		<aon:inputText id="administration_code" size="6" maxlength="5"
			rendered="#{controller.to.fromCommonTerritory}"
			disabled="#{controller.declaration.header.readOnly}"
			value="#{controller.to.admonAeat}">
		</aon:inputText>
		
	</aon:panelGrid>
</ui:composition>
