<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<c:if test="#{!mod349.nevv}">
	
		<aon:div styleClass="aon-margin-top">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
				<ui:param name="controller" value="#{mod349Detail}" />
				<ui:param name="skipLineEdition" value="#{mod349.to.finished}" />
				<ui:param name="skipResetButton" value="#{mod349.to.finished}" />

				<ui:define name="columns">

					<aon:column alias="Mod349Detail.type"
						 styleClass="aon-editDataTable-textColumn aon-width-50">
						<f:facet name="header">
							<aon:outputLabel for="mod349_detail_type" value="C" />
						</f:facet>
						<aon:outputText value="#{to.type.value}" rendered="#{formList}"/>
						<aon:selectOneMenu id="mod349_detail_type" value="#{controller.to.type}" required="true" rendered="#{formEdit}">
							<f:selectItems value="#{fiscalCollections.mod349Types}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu id="mod349_detail_type-NEW" value="#{controller.to.type}" required="true" rendered="#{formNew}">
								<f:selectItems value="#{fiscalCollections.mod349Types}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>

					<aon:column alias="Mod349Detail.country"  
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-textColumn aon-width-120">
						<f:facet name="header">
							<aon:outputLabel for="mod349_detail_country" value="#{bundle.aon_country}" />
						</f:facet>
						<aon:outputText value="#{to.country}" rendered="#{formList}"/>
						<aon:selectOneMenu id="mod349_detail_country" rendered="#{formEdit}" value="#{controller.to.country}" >
							<f:selectItem value="#{null}" itemLabel="-"/>
							<f:selectItems value="#{commonCollections.europeanUnionCountries}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu id="mod349_detail_country-NEW" rendered="#{formNew}" value="#{controller.to.country}" >
								<f:selectItem value="#{null}" itemLabel="-"/>
								<f:selectItems value="#{commonCollections.europeanUnionCountries}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>

					<aon:column alias="Mod349Detail.document" 
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-textColumn aon-width-100">
						<f:facet name="header">
							<aon:outputLabel for="mod349_detail_document" value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.document}" rendered="#{formList}"/>
						<aon:inputText id="mod349_detail_document" value="#{controller.to.document}"
							rendered="#{formEdit}" size="15" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod349_detail_document-NEW" value="#{controller.to.document}"
								rendered="#{formNew}" size="15" required="true"/>
						</f:facet>
					</aon:column>

					<aon:column	alias="Mod349Detail.name"
						style="font-size: 0.8em;" 
						styleClass="aon-editDataTable-textColumn aon-width-auto">
						<f:facet name="header">
							<aon:outputLabel for="mod349_detail_name" value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" rendered="#{formList}"/>
						<aon:inputText id="mod349_detail_name" value="#{controller.to.name}"
							rendered="#{formEdit}" size="40" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod349_detail_name-NEW" value="#{controller.to.name}"
								rendered="#{formNew}" size="40" required="true"/>
						</f:facet>
					</aon:column>

					<aon:column	 
						style="font-size: 0.9em;"
						styleClass="aon-editDataTable-numberColumn aon-bold aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{bundle.fiscal_vatTax_accumulated}" />
						</f:facet>
						<aon:outputText value="#{to.accumulated}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<f:facet name="footer">
						</f:facet>
					</aon:column>

					<aon:column 
						style="font-size: 0.9em;"
						styleClass="aon-editDataTable-numberColumn aon-bold aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{bundle.fiscal_vatTax_declared}" />
						</f:facet>
						<aon:outputText value="#{to.declared}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<f:facet name="footer">
						</f:facet>
					</aon:column>

					<aon:column 
						style="font-size: 0.9em;"
						styleClass="aon-editDataTable-numberColumn aon-bold aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod349_detail_amount" value="#{bundle.fiscal_vatTax_to_declare}" />
						</f:facet>
						<aon:outputText value="#{to.amount}" rendered="#{formList}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText id="mod349_detail_amount" value="#{controller.to.amount}"
							rendered="#{formEdit}" size="12" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod349_detail_amount-NEW" value="#{controller.to.amount}"
								rendered="#{formNew}" size="12" required="true"/>
						</f:facet>
					</aon:column>
					
				</ui:define>
			</ui:decorate>
		</aon:div>
	</c:if>
</ui:composition>
