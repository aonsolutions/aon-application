<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.finance_vat_report_module}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener" value="" type="actionListener" />
					<aon:methodParam name="searchAction" value="vat_report_search" />
				</ui:define>

				<ui:define name="additionalToolbarContent">
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-panelGrid2-total-text" 
					style="text-align:center;border:solid #c4c4c4 1px;width: 1050px;">
					<aon:panelGroup rendered="#{vatReport.fromDate != null}">
						<aon:outputText value="#{bundle.aon_date_from}: "/>
						<aon:outputText value="#{vatReport.fromDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:panelGroup>
					<aon:panelGroup rendered="#{vatReport.toDate != null}">
						<aon:outputText value="&#160;&#160;&#160;#{bundle.aon_date_to}: "/>
						<aon:outputText value="#{vatReport.toDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:panelGroup>
				</aon:div>
				
				<ui:include src="listBlock.xhtml">
					<ui:param name="blockType" value="#{vatReport.general}"/>
					<ui:param name="showBlockHeader" value="#{true}"/>
					<ui:param name="showBlockTotal" value="#{true}"/>
				</ui:include>

				<ui:include src="listBlock.xhtml">
					<ui:param name="blockType" value="#{vatReport.surcharge}"/>
					<ui:param name="showBlockHeader" value="#{false}"/>
					<ui:param name="showBlockTotal" value="#{true}"/>
				</ui:include>
					
				<ui:include src="listBlock.xhtml">
					<ui:param name="blockType" value="#{vatReport.intracommunity}"/>
					<ui:param name="showBlockHeader" value="#{false}"/>
					<ui:param name="showBlockTotal" value="#{true}"/>
				</ui:include>

				<ui:include src="listBlock.xhtml">
					<ui:param name="blockType" value="#{vatReport.extracommunity}"/>
					<ui:param name="showBlockHeader" value="#{false}"/>
					<ui:param name="showBlockTotal" value="#{true}"/>
				</ui:include>

				<ui:include src="listBlock.xhtml">
					<ui:param name="blockType" value="#{vatReport.otherISP}"/>
					<ui:param name="showBlockHeader" value="#{false}"/>
					<ui:param name="showBlockTotal" value="#{true}"/>
				</ui:include>

				<ui:include src="listBlock.xhtml">
					<ui:param name="blockType" value="#{vatReport.canCeuMel}"/>
					<ui:param name="showBlockHeader" value="#{false}"/>
					<ui:param name="showBlockTotal" value="#{true}"/>
				</ui:include>

				<aon:panelGrid columns="4" style="margin-top: 1em;"
					columnClasses="aon-panelGrid2-header-first,
								   aon-panelGrid2-header,
								   aon-panelGrid2-header,
								   aon-panelGrid2-header">
					<aon:div styleClass="aon-panelGrid2-header-text">
						<aon:outputText value="&#160;"/>
					</aon:div>
					<!-- TOTAL IVA REPERCUTIDO -->
					<aon:panelGrid columns="3" style="width: 100%"
						columnClasses="aon-panelGrid2-odd aon-panelGrid2-total-text,aon-panelGrid2-even aon-panelGrid2-total-text,aon-panelGrid2-odd aon-panelGrid2-total-text">				
						<aon:outputText value="#{vatReport.summary[vatReport.output].base}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
						<aon:outputText value="&#160;"/>
						<aon:outputText value="#{vatReport.summary[vatReport.output].quota}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
					</aon:panelGrid>
					<!-- TOTAL IVA SOPORTADO -->
					<aon:panelGrid columns="3" style="width: 100%"
						columnClasses="aon-panelGrid2-odd aon-panelGrid2-total-text,aon-panelGrid2-even aon-panelGrid2-total-text,aon-panelGrid2-odd aon-panelGrid2-total-text">				
						<aon:outputText value="#{vatReport.summary[vatReport.input].base}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
						<aon:outputText value="&#160;"/>
						<aon:outputText value="#{vatReport.summary[vatReport.input].quota}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
					</aon:panelGrid>
					<!-- TOTAL IVA INVERSION -->
					<aon:panelGrid columns="3" style="width: 100%"
						columnClasses="aon-panelGrid2-odd aon-panelGrid2-total-text,aon-panelGrid2-even aon-panelGrid2-total-text,aon-panelGrid2-odd aon-panelGrid2-total-text">				
						<aon:outputText value="#{vatReport.summary[vatReport.investment].base}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
						<aon:outputText value="&#160;"/>
						<aon:outputText value="#{vatReport.summary[vatReport.investment].quota}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
					</aon:panelGrid>
				</aon:panelGrid>
				
				<aon:div styleClass="aon-panelGrid2-total-text"  
					style="text-align:center;border:solid #c4c4c4 1px; margin-top: 1em;width: 1050px;">
					<aon:outputText value="#{bundle.finance_vat_result}"/>
					<aon:panelGroup
						rendered="#{!(vatReport.result lt 0)}" 
						style="color:red;">
						<aon:outputText  value="#{vatReport.result}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText value="&#160;"/>
						<aon:outputText value="(#{bundle.fiscal_deposit})"/>
					</aon:panelGroup>
					
					<aon:panelGroup
						rendered="#{vatReport.result lt 0}" 
						style="color:green;">
						<aon:outputText value="#{vatReport.result * (-1)}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputText value="&#160;"/>
						<aon:outputText value="#{bundle.finance_vat_result_compensate}"/>
						
					</aon:panelGroup>
				</aon:div>
				
			</aon:div>

			
		</aon:form>
			
	</ui:define>
</ui:composition>
