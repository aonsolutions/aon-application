<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:form id="DeclarationForm">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{moduleLabel}" />
			<ui:param name="controller" value="#{controller}" />
			<ui:param name="skipRemoveButton" value="#{controller.to.readOnly}" />
			
			<ui:define name="beforeSpinToolbarContent">
			
				<aon:commandButton id="#{toolbarID}-finish"
					value="#{fiscalBundle.fiscal_finish}"
					actionListener="#{controller.onShowFinalizePanel}"
					reRender="DeclarationForm,finalizeContainer"
					rendered="#{!controller.new and controller.to.pending}"
					styleClass="aon-finding-toolbar-item aon-icon-lock" />

				<aon:commandButton id="#{toolbarID}-reopen"
					value="#{fiscalBundle.fiscal_reopen}"
					actionListener="#{controller.onReopen}"
					rendered="#{!controller.new and controller.to.finished}"
					styleClass="aon-finding-toolbar-item aon-icon-unlock"
					onclick="if (!confirm('#{fiscalBundle.fiscal_reopen}?')) return false;"/>

				<aon:commandButton id="#{toolbarID}-recalculate"
					value="#{fiscalBundle.fiscal_recalculate}"
					actionListener="#{controller.onRecalculate}"
					accesskey="W" title="ALT+W [+May]" 
					rendered="#{!controller.new and !controller.to.readOnly}"
					styleClass="aon-finding-toolbar-item aon-icon-refresh" />
					
				<aon:htmlCommandLink id="#{toolbarID}-report"
					value="#{bundle.aon_listing}" target="_blank"
					action="#{report.onExecute}"
					rendered="#{!controller.new}"
					styleClass="aon-finding-toolbar-item aon-icon-pdf"
					accesskey="#{bundle.aon_key_print}">
					<f:param name="reportKey" value="#{controller.beanName}Report" />
				</aon:htmlCommandLink>
			</ui:define>
		</ui:decorate>

		<aon:div styleClass="aon-scroll-area">

			<aon:panelGrid id="panel1" columns="9" dir="true" width="100%"
				columnClasses="aon-panelGrid-odd aon-width-80
							  ,aon-panelGrid-even aon-width-80
							  ,aon-panelGrid-odd aon-width-80
							  ,aon-panelGrid-even aon-width-80
							  ,aon-panelGrid-odd aon-width-80
							  ,aon-panelGrid-even aon-width-auto
							  ,aon-panelGrid-odd aon-width-80
							  ,aon-panelGrid-even aon-width-100
							  ,aon-panelGrid-even aon-width-100">

				<aon:outputLabel for="controller_year" value="#{bundle.aon_year}" />
				<aon:inputText id="controller_year" size="5" value="#{controller.declaration.header.year}"
					required="true" disabled="#{!controller.new}"/>

				<aon:outputLabel for="controller_period"
					value="#{fiscalBundle.fiscal_period}" />
				<aon:selectOneMenu id="controller_period" value="#{controller.declaration.header.period}"
					required="true" disabled="#{!controller.new}">
					<c:if test="#{quarterPeriods}">
						<f:selectItems value="#{fiscalCollections.quarterPeriods}" />
					</c:if>
					<c:if test="#{!quarterPeriods}">
						<f:selectItems value="#{fiscalCollections.periods}" />	
					</c:if>
				</aon:selectOneMenu>

				<aon:outputLabel for="controller_administration"
					value="#{fiscalBundle.fiscal_administration}" />
				<aon:selectOneMenu id="controller_administration" value="#{controller.declaration.header.administration}"
					required="true" disabled="#{!controller.new}">
					<f:selectItems value="#{configCollections.administrations}" />
				</aon:selectOneMenu>

				<aon:outputText value="#{bundle.aon_status}" />
				<aon:div
					styleClass="aon-nowrap;#{controller.declaration.header.readOnly?'aon-icon-lock':'aon-icon-unlock'}"
					style="padding-left: 16px;">
					<aon:div>
						<aon:outputText value="#{controller.declaration.header.status}" />
					</aon:div>
				</aon:div>


				<c:if test="#{aonRole.confidentiality}">
					<aon:div>
						<aon:selectBooleanCheckbox id="controller_securityLevel"
							value="#{controller.declaration.header.confidential}" rendered="#{!controller.declaration.header.readOnly}"/>
						<aon:outputLabel for="controller_securityLevel" styleClass="aon-italic"
							value="#{bundle.aon_confidential}" rendered="#{!controller.declaration.header.readOnly}"/>
						<aon:outputText styleClass="aon-icon aon-icon-confidential"
							value="&#160;" title="#{bundle.aon_confidential}"
							rendered="#{controller.declaration.header.readOnly and controller.declaration.header.confidential}" />
					</aon:div>
				</c:if>
			</aon:panelGrid>
			
			<c:if test="#{!controller.new and controller.declaration.header.finished}">
				
				<aon:panelGrid id="payPanel" columns="2" style="width: 100%;" styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-auto">
				
					<aon:outputText value="#{fiscalBundle.fiscal_deposit}"
						rendered="#{!controller.declaration.toDeduct and !controller.declaration.negative}" />
					<aon:outputText value="#{fiscalBundle.fiscal_deduct}" 
						rendered="#{controller.declaration.toDeduct}" />
					<aon:outputText value="#{fiscalBundle.fiscal_negative}" 
						rendered="#{controller.declaration.negative}" />
					
					<aon:div>
						<aon:outputText styleClass="aon-bold aon-margin-left"
							value="#{controller.declaration.result}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>									

						<aon:outputText styleClass="aon-margin-left"
							value="#{controller.to.finance.payMethod.name}">
						</aon:outputText>
															
						<aon:outputText styleClass="aon-margin-left"
							value="#{controller.to.finance.bank.name}">
						</aon:outputText>

						<aon:outputText styleClass="aon-margin-left"
							value="#{controller.to.finance.bankAccount}">
						</aon:outputText>
					</aon:div>		
				</aon:panelGrid>

			</c:if>
			
			<aon:panelGrid id="panel2" columns="4" style="width: 100%;" styleClass="aon-margin-top"
				columnClasses="aon-panelGrid-odd aon-width-80
							,aon-panelGrid-even aon-width-500
							,aon-panelGrid-even aon-width-100
							,aon-panelGrid-even aon-width-auto">
				
				<aon:outputLabel for="controller_comments" value="#{bundle.aon_comment}" />
				<aon:inputTextarea id="controller_comments" cols="80" rows="2" value="#{controller.declaration.header.comments}"/>

				<aon:div>
					<aon:div>
						<aon:selectBooleanCheckbox id="controller_replacement"
							disabled="#{controller.declaration.header.readOnly}"
							value="#{controller.declaration.header.replacement}"/>
						<aon:outputLabel for="controller_replacement" styleClass="aon-italic"
							value="#{fiscalBundle.fiscal_replacement}" />
					</aon:div>
					<aon:div rendered="#{controller.declaration.withoutActivityDeclarationAvailable}">
						<aon:selectBooleanCheckbox id="controller_withoutActivity"
							disabled="#{controller.declaration.header.readOnly}"
							value="#{controller.declaration.header.withoutActivity}"/>
						<aon:outputLabel for="controller_withoutActivity" styleClass="aon-italic"
							value="#{fiscalBundle.fiscal_without_activity}" />
					</aon:div>
				</aon:div>
				
				<aon:div>
					<aon:commandButton id="gen-disk"
						value="#{financeBundle.finance_create_disk}"
						actionListener="#{controller.onCreateDisk}"
						rendered="#{!controller.new and controller.declaration.header.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
						style="border-width: 0px 0px 0px 0px;" reRender="panel2"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:htmlCommandLink target="_blank"
						title="#{controller.diskOk?(financeBundle.finance_download_disk):(financeBundle.finance_download_error)}"
						value="#{controller.diskOk?(financeBundle.finance_download_disk):(financeBundle.finance_download_error)}"
						style="border-width: 0px 0px 0px 0px;"
						actionListener="#{controller.downloadDisk}"
						rendered="#{!controller.new and controller.fileOutput!=null}"
						styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
				</aon:div>
			</aon:panelGrid>
			
			<c:if test="#{!skipDetail}">
				<ui:include src="/com/code/aon/ui/fiscal/facelet/model/detail.xhtml">
					<ui:param name="controller" value="#{controller}" />
				</ui:include>
			</c:if>
			<c:if test="#{skipDetail}">
				<ui:insert name="customDetail" />
			</c:if>
		</aon:div>
		
	</aon:form>
	
	<ui:include src="/com/code/aon/ui/fiscal/facelet/model/finalizePanel.xhtml">
		<ui:param name="controller" value="#{controller}" />
	</ui:include>	
	<aon:lookupButtonPopup lookup="#{creditorLookup}" />
</ui:composition>
