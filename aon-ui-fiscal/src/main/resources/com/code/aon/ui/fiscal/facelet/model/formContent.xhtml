<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:form id="DeclarationForm">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{moduleLabel}" />
			<ui:param name="controller" value="#{controller}" />
			<ui:param name="skipRemoveButton" value="#{controller.to.readOnly}" />
			
			<ui:define name="beforeSpinToolbarContent">
			
				<aon:commandButton id="#{toolbarID}-finish"
					value="#{bundle.aon_finalice}"
					actionListener="#{controller.onShowFinalizePanel}"
					reRender="DeclarationForm,finalizeContainer"
					rendered="#{!controller.new and controller.to.pending}"
					styleClass="aon-finding-toolbar-item aon-icon-lock" />

				<aon:commandButton id="#{toolbarID}-reopen"
					value="#{bundle.fiscal_reopen}"
					actionListener="#{controller.onReopen}"
					rendered="#{!controller.new and controller.to.finished}"
					styleClass="aon-finding-toolbar-item aon-icon-unlock"
					onclick="if (!confirm('#{bundle.fiscal_reopen}?')) return false;"/>

				<aon:commandButton id="#{toolbarID}-recalculate"
					value="#{bundle.fiscal_recalculate}"
					actionListener="#{controller.onRecalculate}"
					accesskey="W" title="ALT+W [+May]" 
					rendered="#{!controller.new and !controller.to.readOnly}"
					styleClass="aon-finding-toolbar-item aon-icon-refresh" />
					
				<aon:htmlCommandLink id="#{toolbarID}-report"
					value="#{bundle.aon_listing}" target="_blank"
					action="#{report.onExecute}"
					rendered="#{!controller.new}"
					styleClass="aon-finding-toolbar-item aon-icon-pdf"
					accesskey="#{bundle.aon_key_print}">
					<f:param name="reportKey" value="#{controller.beanName}Report" />
				</aon:htmlCommandLink>
				
				<c:if test="#{!controller.new and controller.to.finished and !controller.to.model111 and controller.scriptPresent}">
					<aon:htmlCommandLink id="#{toolbarID}-reportAeat"
						value="AEAT OFICIAL"  
						action="#{controller.aeatReport}"
						rendered="#{controller.aeatOfficialReportEnabled}"
						styleClass="aon-finding-toolbar-item aon-icon-aeat"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="#{controller.beanName}Report" />
					</aon:htmlCommandLink>
					
					<aon:htmlCommandLink id="#{toolbarID}-reportDraftAeat"
						value="AEAT BORRADOR" target="_blank"
						action="#{controller.aeatReport}"
						rendered="#{controller.aeatDraftReportEnabled}"
						styleClass="aon-finding-toolbar-item aon-icon-aeat"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="#{controller.beanName}Report" />
					</aon:htmlCommandLink>
				</c:if>
				
				<aon:commandButton id="audit-info"
					value="#{bundle.aon_audit}"
					styleClass="aon-finding-toolbar-item aon-icon-audit"
					rendered="#{!controller.new}"
					reRender="showAuditInfoWindow">
					<f:setPropertyActionListener target="#{controller.showAuditInfoWindow}"
						value="#{true}" />							
				</aon:commandButton>		
			</ui:define>
		</ui:decorate>

		<aon:div styleClass="aon-scroll-area">

			<ui:insert name="extraHeader" />
			
			<aon:panelGrid id="panelMain" columns="7" dir="true" width="100%"
				columnClasses="aon-panelGrid-odd aon-width-100
							  ,aon-panelGrid-even aon-width-180
							  ,aon-panelGrid-odd aon-width-80
							  ,aon-panelGrid-even aon-width-auto
							  ,aon-panelGrid-odd aon-width-80
							  ,aon-panelGrid-even aon-width-80
							  ,aon-panelGrid-even aon-width-100">

				<aon:outputLabel for="controller_year" value="#{bundle.aon_year} / #{bundle.aon_period}" />
				<aon:div>
					<aon:inputText id="controller_year" size="5" value="#{controller.declaration.header.year}"
						required="true" disabled="#{!controller.new}"/>
					<aon:selectOneMenu id="controller_period" value="#{controller.declaration.header.period}"
						style="margin-left: 3px;"
						required="true" disabled="#{!controller.new}">
						<c:if test="#{quarterPeriods}">
							<f:selectItems value="#{fiscalCollections.quarterPeriods}" />
						</c:if>
						<c:if test="#{!quarterPeriods}">
							<f:selectItems value="#{fiscalCollections.periods}" />	
						</c:if>
					</aon:selectOneMenu>
				</aon:div>

				<aon:outputLabel for="controller_administration"
					value="#{bundle.aon_administration}" />
				<aon:div id="administrationContainer">
					<aon:selectOneMenu id="controller_administration" value="#{controller.declaration.header.administration}"
						reRender="panelIdentification" ajaxSingle="true"
						required="true" disabled="#{!controller.new}">
						<f:selectItems value="#{configCollections.administrations}" />
					</aon:selectOneMenu>
				</aon:div>
				

				<aon:outputText value="#{bundle.aon_status}" />
				<aon:div
					styleClass="aon-nowrap;#{controller.declaration.header.readOnly?'aon-icon-lock':'aon-icon-unlock'}"
					style="padding-left: 16px;">
					<aon:div>
						<aon:outputText value="#{controller.declaration.header.status}" />
					</aon:div>
				</aon:div>


				<c:if test="#{aonRole.confidentiality}">
					<aon:div>
						<aon:selectBooleanCheckbox id="controller_securityLevel"
							value="#{controller.declaration.header.confidential}" 
							rendered="#{!controller.declaration.header.readOnly}"/>
						<aon:outputLabel for="controller_securityLevel" styleClass="aon-italic"
							value="#{bundle.aon_confidential}" rendered="#{!controller.declaration.header.readOnly}"/>
						<aon:outputText styleClass="aon-icon aon-icon-confidential"
							value="&#160;" title="#{bundle.aon_confidential}"
							rendered="#{controller.declaration.header.readOnly and controller.declaration.header.confidential}" />
					</aon:div>
				</c:if>
			</aon:panelGrid>
			
			<c:if test="#{!controller.new and controller.declaration.header.finished}">
				
				<aon:panelGrid id="panelFinance" columns="3" style="width: 100%;" styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-70
								,aon-panelGrid-even aon-width-auto
								,aon-panelGrid-even aon-width-300">
				
					<aon:outputText value="#{bundle.fiscal_deposit}"
						rendered="#{!controller.declaration.toDeduct and !controller.declaration.negative and !controller.declaration.compensate and !controller.declaration.payback}" />
					<aon:outputText value="#{bundle.fiscal_deduct}" 
						rendered="#{controller.declaration.toDeduct}" />
					<aon:outputText value="#{bundle.fiscal_negative}" 
						rendered="#{controller.declaration.negative}" />
					<aon:outputText value="#{bundle.fiscal_compensate}" 
						rendered="#{controller.declaration.compensate}" />
					<aon:outputText value="#{bundle.fiscal_pay_back}" 
						rendered="#{controller.declaration.payback}" />
					
					<aon:div>
						<aon:commandLink
							rendered="#{controller.to.finance.id != null}"
							styleClass="aon-dataTable-link"
							action="finance_form"
							actionListener="#{controller.onLoadFinance}">
							<aon:outputText styleClass="aon-bold aon-margin-left"
								value="#{controller.declaration.result}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>									
	
							<aon:outputText styleClass="aon-margin-left"
								value="#{controller.to.finance.payMethod.name}">
							</aon:outputText>
																
							<aon:outputText styleClass="aon-margin-left"
								value="#{controller.to.finance.bankAlias}">
							</aon:outputText>
	
							<aon:outputText styleClass="aon-margin-left"
								value="#{controller.to.finance.bankAccount}">
							</aon:outputText>
						</aon:commandLink>
						<aon:div rendered="#{controller.to.finance.id == null}">
							<aon:outputText styleClass="aon-bold aon-margin-left"
								value="#{controller.declaration.result}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>									
 	
							<aon:outputText styleClass="aon-margin-left"
								value="#{controller.to.finance.payMethod.name}">
							</aon:outputText>
																
							<aon:outputText styleClass="aon-margin-left"
								value="#{controller.to.finance.bankAlias}">
							</aon:outputText>
	
							<aon:outputText styleClass="aon-margin-left"
								value="#{controller.to.finance.bankAccount}">
							</aon:outputText>
							
						</aon:div>
					</aon:div>
					
					<aon:div>
						<h:outputLink target="_blank"
							value="#{controller.aeatWebPage}"
							style="border-width: 0px 0px 0px 0px;"
							rendered="#{!controller.new and controller.to.finished and controller.aeatWebPage != null}"
							styleClass="aon-finding-toolbar-item aon-icon-aeat">
							<aon:outputText value="#{bundle.fiscal_electronic_presentation}"/>
						</h:outputLink>
					</aon:div>
				</aon:panelGrid>

			</c:if>
			
			<aon:panelGrid id="panelComments" columns="4" style="width: 100%;" styleClass="aon-margin-top"
				columnClasses="aon-panelGrid-odd aon-width-70
							,aon-panelGrid-even aon-width-auto
							,aon-panelGrid-even aon-width-100
							,aon-panelGrid-even aon-width-300">
				
				<aon:outputLabel for="controller_comments" value="#{bundle.aon_comment}" />
				<aon:inputTextarea id="controller_comments" cols="80" rows="1" value="#{controller.declaration.header.comments}"/>

				<aon:div>
					<aon:div>
						<aon:selectBooleanCheckbox id="controller_replacement"
							disabled="#{controller.declaration.header.readOnly}"
							value="#{controller.declaration.header.replacement}"/>
						<aon:outputLabel for="controller_replacement" styleClass="aon-italic"
							value="#{bundle.aon_replacement}" />
					</aon:div>
					<aon:div rendered="#{controller.declaration.withoutActivityDeclarationAvailable}">
						<aon:selectBooleanCheckbox id="controller_withoutActivity"
							disabled="#{controller.declaration.header.readOnly}"
							value="#{controller.declaration.header.withoutActivity}"/>
						<aon:outputLabel for="controller_withoutActivity" styleClass="aon-italic"
							value="#{bundle.fiscal_without_activity}" />
					</aon:div>
				</aon:div>
				
				<aon:div>
					<aon:div>
						<aon:commandButton id="gen-disk"
							value="#{bundle.finance_create_disk}"
							actionListener="#{controller.onCreateDisk}"
							rendered="#{!controller.new and controller.declaration.header.finished}"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							style="border-width: 0px 0px 0px 0px;" reRender="panelComments"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:htmlCommandLink target="_blank"
							title="#{controller.diskOk?(bundle.finance_download_disk):(bundle.finance_download_error)}"
							value="#{controller.diskOk?(bundle.finance_download_disk):(bundle.finance_download_error)}"
							style="border-width: 0px 0px 0px 0px;"
							actionListener="#{controller.downloadDisk}"
							rendered="#{!controller.new and controller.fileOutput!=null}"
							styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
					</aon:div>
				</aon:div>
			</aon:panelGrid>
			
			<aon:panelTabSet selectedTab="#{controller.selectedTab}" immediate="true">
				<aon:panelTab id="#{controller.dataTabName}" label="#{bundle.fiscal_identification_data}">
					<ui:include src="/com/code/aon/ui/fiscal/facelet/model/header.xhtml" />
				</aon:panelTab>
				
				<c:if test="#{!controller.new}">
					<aon:panelTab id="#{controller.liquidationTabName}" label="#{bundle.fiscal_liquidation}">
						<c:if test="#{!skipDetail}">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/model/detail.xhtml">
								<ui:param name="controller" value="#{controller}" />
							</ui:include>
						</c:if>
						<c:if test="#{skipDetail}">
							<ui:insert name="customDetail" />
						</c:if>
					</aon:panelTab>
				</c:if>
			</aon:panelTabSet>
		</aon:div>
	</aon:form>
	
	<ui:include src="/com/code/aon/ui/fiscal/facelet/model/finalizePanel.xhtml">
		<ui:param name="controller" value="#{controller}" />
	</ui:include>	
	<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
		<ui:param name="auditableController" value="#{controller}" />
	</ui:include>
	<aon:lookupButtonPopup lookup="#{creditorLookup}" />
	
	<ui:insert name="afterAll" />
</ui:composition>
