<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="mod347Form">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.fiscal_model_347_module}" />
				<ui:param name="controller" value="#{mod347}" />
				<ui:param name="skipRemoveButton" value="#{mod347.to.finished}" />

				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="#{toolbarID}-finish"
						value="#{bundle.aon_finalice}"
						actionListener="#{mod347.onFinish}"
						rendered="#{!mod347.nevv and !mod347.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-lock"
						onclick="if (!confirm('#{bundle.aon_finalice}?')) return false;"/>
					<aon:commandButton id="#{toolbarID}-reopen"
						value="#{bundle.fiscal_reopen}"
						actionListener="#{mod347.onReopen}"
						rendered="#{!mod347.nevv and mod347.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-unlock"
						onclick="if (!confirm('#{bundle.fiscal_reopen}?')) return false;"/>
					<aon:htmlCommandLink id="mod347List-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="mod347List" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>							
					<aon:htmlCommandLink id="mod347List-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="mod347List" />
					</aon:htmlCommandLink>
<!--					
					<aon:htmlCommandLink id="#{toolbarID}-reportAeat"
						value="AEAT BORRADOR"  
						action="#{mod347.aeatReport}"
						rendered="#{!mod347.nevv and mod347.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-aeat"
						accesskey="#{bundle.aon_key_print}">
					</aon:htmlCommandLink>
-->					
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="panel1" columns="10" dir="true" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-80
								  ,aon-panelGrid-even aon-width-100
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-150
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-100
								  ,aon-panelGrid-even aon-width-auto
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-100">

					<aon:outputLabel for="mod347_year" value="#{bundle.aon_year}" />
					<aon:inputText id="mod347_year" size="5" value="#{mod347.to.year}"
						required="true" disabled="#{mod347.to.finished}"/>
	
					<aon:div>
						<aon:selectBooleanCheckbox id="mod347_replacement"
							disabled="#{mod347.to.finished}"
							value="#{mod347.to.replacement}"/>
						<aon:outputLabel for="mod347_replacement" styleClass="aon-italic"
							value="#{bundle.aon_replacement}" />
						<aon:panelGroup rendered="#{mod347.to.replacement}" styleClass="aon-italic">
							<aon:outputText value=" (" />
							<aon:outputText value="#{mod347.to.replacedNumber}" />
							<aon:outputText value=")" />
						</aon:panelGroup>
					</aon:div>

					<aon:outputLabel for="mod347_administration"
						value="#{bundle.aon_administration}" />
					<aon:selectOneMenu id="mod347_administration" value="#{mod347.to.administration}"
						required="true" disabled="#{mod347.to.finished}">
						<f:selectItems value="#{configCollections.administrations}" />
					</aon:selectOneMenu>
	
					<aon:outputText value="#{bundle.aon_status}" />
					<aon:div style="padding-left: 16px;" styleClass="aon-nowrap;#{mod347.to.finished?'aon-icon-lock':'aon-icon-unlock'}">
						<aon:outputText value="#{mod347.to.status}" />
					</aon:div>
	
					<aon:div>
						<aon:if test="#{aonRole.confidentiality}">
							<aon:selectBooleanCheckbox id="mod347_securityLevel"
								value="#{mod347.to.confidential}" rendered="#{!mod347.to.finished}"/>
							<aon:outputLabel for="mod347_securityLevel" styleClass="aon-italic"
								value="#{bundle.aon_confidential}" rendered="#{!mod347.to.finished}"/>
							<aon:outputText styleClass="aon-icon aon-icon-confidential"
								value="&#160;" title="#{bundle.aon_confidential}"
								rendered="#{mod347.to.finished and mod347.to.confidential}" />
						</aon:if>
					</aon:div>
					
					<aon:outputText value="#{bundle.aon_number}" />
					<aon:outputText value="#{mod347.to.number}" />
					
				</aon:panelGrid>
				
				<aon:panelGrid id="panel2" columns="3" style="width: 100%;" styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-400
								,aon-panelGrid-even aon-width-auto">
					
					<aon:outputLabel for="mod347_comments" value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="mod347_comments" cols="80" rows="2" value="#{mod347.to.comments}"/>

					<aon:div>
						<aon:commandButton id="gen-disk"
							value="#{bundle.finance_create_disk}"
							actionListener="#{mod347.onCreateDisk}"
							rendered="#{!mod347.nevv and mod347.to.finished and mod347.fileOutput==null}"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							style="border-width: 0px 0px 0px 0px;" reRender="panel2"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:htmlCommandLink target="_blank"
							title="#{mod347.diskOk?(bundle.finance_download_disk):(bundle.finance_download_error)}"
							value="#{mod347.diskOk?(bundle.finance_download_disk):(bundle.finance_download_error)}"
							style="border-width: 0px 0px 0px 0px;"
							actionListener="#{mod347.downloadDisk}"
							rendered="#{!mod347.nevv and mod347.fileOutput!=null}"
							styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
					</aon:div>
										
				</aon:panelGrid>

				<aon:if test="#{mod347.nevv}">

					<aon:div styleClass="aon-panelGrid-search">
						<aon:div styleClass="aon-panelGrid-search-info">
							<aon:outputText value="#{bundle.fiscal_mod347_import_info}" 
									styleClass="aon-panelGrid-search-info-internal"/>
						</aon:div>
						
						<aon:panelGrid id="searchContentID" columns="4">
							
							<aon:div>
								<aon:selectBooleanCheckbox id="mod347_generateLines" value="#{mod347.to.generateLines}"
									reRender="searchContentID" />
								<aon:outputLabel for="mod347_generateLines" value="#{bundle.fiscal_mod347_generate_lines}" />
							</aon:div>
							<aon:outputText value="&#160;" />
							<aon:outputText value="&#160;" />
							<aon:outputText value="&#160;" />
							
							<aon:if test="#{mod347.to.generateLines}">
								<aon:outputText value="&#160;" />
								<aon:div>
									<aon:selectBooleanCheckbox id="mod347_taxDateEnabled"  
										value="#{mod347.params.taxDateEnabled}"/>
									<aon:outputLabel for="mod347_taxDateEnabled" value="#{bundle.fiscal_mod347_generate_from_tax_date}" />
								</aon:div>
								<aon:outputText value="&#160;" />									
								<aon:outputText value="&#160;" />
								
								<aon:outputText value="&#160;" />
								<aon:div>
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_groupedByNIF"  
											value="#{mod347.params.groupedByNIF}"/>
										<aon:outputLabel for="mod347_groupedByNIF" value="#{bundle.fiscal_mod347_grouped_by_nif}" />
									</aon:div>
									<aon:div>
										<aon:outputText style="margin-left: 20px;" 
											value="#{bundle.fiscal_mod347_grouped_by_nif_bis}" />
									</aon:div>
								</aon:div>
								<aon:outputText value="&#160;" />									
								<aon:outputText value="&#160;" />
																	

								<aon:outputLabel for="mod347_minimum" value="#{bundle.fiscal_mod347_minimum_amount}" />
								<aon:inputText id="mod347_minimum" size="10" value="#{mod347.to.minimumAmount}"
									required="true" />
								<aon:outputText value="&#160;" />									
								<aon:outputText value="&#160;" />									

								<aon:outputText value="&#160;" />									
								<aon:outputText value="&#160;" />
								<aon:outputText value="&#160;" />									
								<aon:outputText value="&#160;" />
								
								<aon:outputText value="#{bundle.fiscal_mod347_output_invoices}" />
								<aon:div>
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_exports"  
											value="#{mod347.params.excludeExports}"/>
										<aon:outputLabel for="mod347_output_exports" value="#{bundle.fiscal_mod347_output_exports}" />
									</aon:div>							
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_output_intracommunitary_deliveries"  
											value="#{mod347.params.excludeIntracommunitaryDeliveries}"/>
										<aon:outputLabel for="mod347_output_intracommunitary_deliveries" value="#{bundle.fiscal_mod347_output_intracommunitary_deliveries}" />
									</aon:div>							
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_output_extracommunitary_services"  
											value="#{mod347.params.excludeOutputExtracommunitaryServices}"/>
										<aon:outputLabel for="mod347_output_extracommunitary_services" value="#{bundle.fiscal_mod347_output_extracommunitary_services}" />
									</aon:div>							
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_output_intracommunitary_services"  
											value="#{mod347.params.excludeOutputIntracommunitaryServices}"/>
										<aon:outputLabel for="mod347_output_intracommunitary_services" value="#{bundle.fiscal_mod347_output_intracommunitary_services}" />
									</aon:div>							
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_output_national_zero_excluded"  
											value="#{mod347.params.excludeOutputNationalZero}"/>
										<aon:outputLabel for="mod347_output_national_zero_excluded" value="#{bundle.fiscal_mod347_output_national_zero_excluded}" />
									</aon:div>							
								</aon:div>							
	
								<aon:outputText value="#{bundle.fiscal_mod347_input_invoices}" />
								<aon:div>
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_input_imports"  
											value="#{mod347.params.excludeImports}"/>
										<aon:outputLabel for="mod347_input_imports" value="#{bundle.fiscal_mod347_input_imports}" />
									</aon:div>							
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_input_intracommunitary_adquisitions"  
											value="#{mod347.params.excludeIntracommunitaryAdquisitions}"/>
										<aon:outputLabel for="mod347_input_intracommunitary_adquisitions" value="#{bundle.fiscal_mod347_input_intracommunitary_adquisitions}" />
									</aon:div>							
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_input_extracommunitary_services"  
											value="#{mod347.params.excludeInputExtracommunitaryServices}"/>
										<aon:outputLabel for="mod347_input_extracommunitary_services" value="#{bundle.fiscal_mod347_input_extracommunitary_services}" />
									</aon:div>							
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_input_intracommunitary_services"  
											value="#{mod347.params.excludeInputIntracommunitaryServices}"/>
										<aon:outputLabel for="mod347_input_intracommunitary_services" value="#{bundle.fiscal_mod347_input_intracommunitary_services}" />
									</aon:div>							
									<aon:div>
										<aon:selectBooleanCheckbox id="mod347_input_national_zero_excluded"  
											value="#{mod347.params.excludeInputNationalZero}"/>
										<aon:outputLabel for="mod347_input_national_zero_excluded" value="#{bundle.fiscal_mod347_input_national_zero_excluded}" />
									</aon:div>							
								</aon:div>							
							</aon:if>
						</aon:panelGrid>
					</aon:div>
				</aon:if>
				
				<aon:if test="#{!mod347.nevv}">

					<aon:panelTabSet selectedTab="#{vatTax.selectedTab}">
						<aon:panelTab id="detailTab" label="Declarados">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/mod347/detail.xhtml" />
						</aon:panelTab>

						<aon:panelTab id="assetTab" label="Inmuebles">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/mod347/asset.xhtml" />
						</aon:panelTab>
					</aon:panelTabSet>
				</aon:if>
				
			</aon:div>
		</aon:form>
		
		<ui:include src="/com/code/aon/ui/fiscal/facelet/mod347/extraInfo.xhtml" />		
		
	</ui:define>

</ui:composition>
