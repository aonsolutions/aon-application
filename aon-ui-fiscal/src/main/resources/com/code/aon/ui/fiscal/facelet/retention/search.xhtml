<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.fiscal_retention_report_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="skipClearButton" value="true" />
				
				<ui:define name="beforeToolbarContent">
					<aon:commandButton id="#{toolbarID}-clear"
							value="#{bundle.aon_clear}"
							actionListener="#{retentionReport.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
				</ui:define>
			</ui:decorate>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="skipAfterSearch" value="true" />
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{retentionReport.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="retention_report_list" />

					<aon:outputLabel for="reportDate"
						value="#{bundle.finance_report_date}" />
					<aon:panelGrid columns="1">
						<aon:selectInputDate id="reportDate" value="#{retentionReport.params.date}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>

					<aon:outputText value="&#160;"/>
					<aon:div styleClass="aon-margin-top aon-margin-bottom">
						<aon:selectBooleanCheckbox id="report_toCustomer"
							value="#{retentionReport.params.toCustomer}" />
						<aon:outputLabel for="report_toCustomer" styleClass="aon-bold"
							value="#{bundle.fiscal_sales_retention}" />
					</aon:div>

					<aon:outputLabel for="report_year"
						value="#{bundle.aon_period}" />
					<aon:panelGrid columns="2">
						<aon:inputText id="report_year" 
							value="#{retentionReport.year}" size="5"
							reRender="invoiceDate-From,invoiceDate-To"
							valueChangeListener="#{retentionReport.onYearChanged}"
							focus="report_period"
							maxlength="4" />

						<aon:selectOneMenu id="report_period"
							valueChangeListener="#{retentionReport.onPeriodChanged}"
							reRender="invoiceDate-From,invoiceDate-To"
							value="#{retentionReport.period}">
							<f:selectItems value="#{fiscalCollections.periods}" />
						</aon:selectOneMenu>
					</aon:panelGrid>

					<aon:outputLabel for="invoiceDate-From"
						value="#{bundle.finance_invoice_date}" />
					<aon:panelGrid columns="4">
						<aon:selectInputDate id="invoiceDate-From"
							value="#{retentionReport.params.fromInvoiceDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="invoiceDate-To" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="invoiceDate-To"
							value="#{retentionReport.params.toInvoiceDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
							
						<aon:panelGroup>
							<aon:selectBooleanCheckbox id="retention_taxDateEnabled"  
								value="#{retentionReport.params.taxDateEnabled}"/>
							<aon:outputLabel for="retention_taxDateEnabled" value="#{bundle.fiscal_mod347_generate_from_tax_date}" />
						</aon:panelGroup>
					</aon:panelGrid>

					<aon:outputLabel for="invoiceDate-From"
						value="#{bundle.aon_document_number}" />
					<aon:panelGrid columns="3">
						<aon:div>
							<aon:inputText id="From_Series" value="#{retentionReport.params.fromSeries}" size="4"/>
							<aon:inputText id="From_Number" value="#{retentionReport.params.fromNumber}" size="10"
								style="margin-left: 0.5em;"/>
						</aon:div>
						<aon:outputText value="#{bundle.aon_date_to}" />
						<aon:div>
							<aon:inputText id="To_Series" value="#{retentionReport.params.toSeries}" size="4"/>
							<aon:inputText id="To_Number" value="#{retentionReport.params.toNumber}" size="10"
								style="margin-left: 0.5em;"/>
						</aon:div>
					</aon:panelGrid>

					<aon:if test="#{aonRole.confidentiality}">
						<aon:outputLabel for="retention_securityLevel"
							value="#{bundle.aon_confidential}" />
						<aon:selectOneRadio id="retention_securityLevel"
							value="#{retentionReport.params.securityLevel}">
							<f:selectItems value="#{commonCollections.confidentialValues}" />
							<f:selectItem itemValue="" itemLabel="#{bundle.aon_all}" />
						</aon:selectOneRadio>
					</aon:if>

					<aon:outputLabel for="report_order"
						value="#{bundle.finance_invoice_order_by}" />
					<aon:selectOneMenu id="report_order" value="#{retentionReport.order}" style="margin-left: 0.5em;">
						<f:selectItems value="#{fiscalCollections.invoiceReportOrders}" />
					</aon:selectOneMenu>


				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
