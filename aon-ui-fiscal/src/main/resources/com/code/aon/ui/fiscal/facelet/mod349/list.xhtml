<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="mod349List">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.fiscal_model_349_module}" />
				<ui:param name="controller" value="#{mod349}" />
			</ui:decorate>

			<aon:div style="color:red; font-size: 1.2em; padding: 5px; text-align:center; border: solid red 1px; margin-bottom: 5px; margin-top: 5px; font-weight: bold;">
				<aon:div>
					<aon:outputLabel value="A partir del ejercicio 2018, utilice el nuevo módulo del 349" />
				</aon:div>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{mod349}" />

					<ui:define name="columns">

						<aon:column	styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_year}" />
							</f:facet>
							<aon:outputText value="#{to.year}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_period}" />
							</f:facet>
							<aon:outputText value="#{to.period}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_administration}" />
							</f:facet>
							<aon:outputText value="#{to.administration}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_number}" />
							</f:facet>
							<aon:outputText value="#{to.number}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-50">
							<f:facet name="header">
								<aon:outputText value="#{bundle.fiscal_replacement_abbr}" />
							</f:facet>
							<aon:div styleClass="#{to.replacement?'aon-icon-checked':'aon-icon-check'}">
								<aon:outputText value="&#160;" />
							</aon:div>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-50">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_comment}" />
							</f:facet>
							<aon:outputText value="#{to.comments}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
