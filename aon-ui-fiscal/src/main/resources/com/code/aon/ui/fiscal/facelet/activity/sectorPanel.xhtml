<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">
 
	<aon:div id="sectorDataContainer">
		<c:if test="#{fiscalActivity.sectorPanelVisible}">
			<rich:modalPanel id="sectorPanel" minHeight="600"
					minWidth="650" rendered="#{fiscalActivity.sectorPanelVisible}"
					showWhenRendered="true" zindex="90">
					<f:facet name="header">
						<aon:div styleClass="aon-popupWindow-title">
							<aon:outputText value="#{bundle.fiscal_sector}" />
						</aon:div>
					</f:facet>
					<f:facet name="controls">
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							actionListener="#{fiscalActivity.onHideSectors}"
							reRender="sectorDataContainer" immediate="true">
							<aon:actionHotKey key="esc" />
						</aon:commandButton>
					</f:facet>
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div styleClass="aon-popupWindow-content-internal">
							
							<aon:methodParam name="rowSelectorActionListener" value="#{fiscalActivity.onSelectSector}" type="actionListener"/>
							<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
								<ui:param name="controller" value="#{fiscalActivity}" />
								<ui:param name="dataTableId" value="fiscalActivitySectors" />
								<ui:param name="dataModel" value="#{fiscalActivity.sectors}" />
								<ui:param name="rows" value="20" />
								<ui:define name="columns">
								<aon:column styleClass="aon-editDataTable-TextColumn aon-width-150">
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:outputText value="#{to.sector}" />
								</aon:column>

								<aon:column styleClass="aon-editDataTable-TextColumn aon-width-auto}">
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:outputText value="#{to.description}" />
								</aon:column>
								</ui:define>
							</ui:decorate>
						</aon:div>
					</aon:div>
				</rich:modalPanel>
			</c:if>
	</aon:div>

</ui:composition>
