<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml"
	xmlns:rich="http://richfaces.org/rich">

	<ui:define name="content">
		<aon:form>

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.fiscal_model_340_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />

					<aon:outputLabel for="reportDate"
						value="#{bundle.finance_report_date}" />
					<aon:selectInputDate id="reportDate" 
						inputStyle="margin-left: 0.5em;"
						value="#{mod340.params.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="Vat_Year"
						value="#{bundle.aon_year}" />
					<rich:inputNumberSpinner cycled="false"	
							id="Vat_Year" style="margin-left: 0.5em;" 
							value="#{mod340.params.year}" inputSize="5"
							maxValue="2021"
							minValue="2000"
							maxlength="4">
					</rich:inputNumberSpinner>

					<aon:outputLabel for="Vat_period"
						value="#{bundle.aon_period}" />
					<aon:selectOneMenu id="Vat_period" style="margin-left: 5px;"
						value="#{mod340.params.period}">
						<f:selectItems value="#{fiscalCollections.periods}" />
					</aon:selectOneMenu>
					
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="mod340_replacement"
							value="#{mod340.params.replacement}"/>
						<aon:outputLabel for="mod340_replacement" styleClass="aon-italic"
							value="#{bundle.aon_replacement}" />
						<aon:outputLabel for="Vat_prevNumber" styleClass="aon-italic aon-margin-left"
							value="#{bundle.fiscal_mod340_prev_number}" />
						<aon:inputText id="Vat_prevNumber" value="#{mod340.params.previousNumber}" maxlength="13"/>
					</aon:div>

					<aon:outputLabel for="Vat_declaration"
						value="#{bundle.fiscal_mod340_vat_declaration}" />
					<aon:inputText id="Vat_declaration" value="#{mod340.params.vatDeclarationNumber}" 
						maxlength="16"/>

					<aon:outputLabel for="Model_340_administration" value="#{bundle.aon_output_format}" />
					<aon:selectOneMenu id="Model_340_administration" style="margin-left: 5px;"
						value="#{mod340.params.administration}">
						<f:selectItems value="#{configCollections.administrations}" />
					</aon:selectOneMenu>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="mod340_taxDateEnabled"  
							value="#{mod340.params.taxDateEnabled}"/>
						<aon:outputLabel for="mod340_taxDateEnabled" value="#{bundle.fiscal_mod347_generate_from_tax_date}" />
					</aon:div>

					<aon:outputText value="" />
					<aon:outputText value="" />
					
					<aon:outputText value="" />
					<aon:div>
						<aon:htmlCommandLink id="mod340-report" 
							value="#{bundle.aon_generate}" 
							target="_blank" actionListener="#{mod340.onCreateDisk}"
							styleClass="aon-search-lookup-button">
						</aon:htmlCommandLink>
					</aon:div>	
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
