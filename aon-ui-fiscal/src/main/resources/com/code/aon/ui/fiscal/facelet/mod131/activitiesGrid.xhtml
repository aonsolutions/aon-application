<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
		
	<aon:div id="activitiesContainer" styleClass="aon-width-all aon-margin-top" style="font-size: 0.9em;">

		<aon:outputText value="#{controller.declaration.h1}" styleClass="aon-bold"/>
	
		<aon:panelGrid columns ="4" styleClass="aon-width-all"
			columnClasses="aon-panelGrid-even aon-with-auto
						,aon-panelGrid-even aon-width-80 aon-text-right
						,aon-panelGrid-even aon-width-80 aon-text-right
						,aon-panelGrid-even aon-width-80 aon-text-right">

			<aon:outputText value="#{bundle.fiscal_epigraph}" styleClass="aon-italic aon-bold"/>
			<aon:outputText value="#{bundle.fiscal_base_abbrv}" styleClass="aon-italic aon-bold"/>
			<aon:outputText value="#{bundle.aon_percentage}" styleClass="aon-italic aon-bold"/>
			<aon:outputText value="#{bundle.aon_result}" styleClass="aon-italic aon-bold"/>
			
			<c:forEach items="#{controller.declaration.activityKeys}" var="key">
				<c:if test="#{key.ac01 or key.ac02}">
					<aon:outputText value="&#160;"/>						
				</c:if>
				
				<c:if test="#{key.descriptionEnabled}">
					<aon:outputText value="#{controller.declaration.map[key].description}"/>
				</c:if>
			
				<c:if test="#{!key.descriptionEnabled}">
					<aon:outputText value="#{controller.declaration.map[key].amount}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</c:if>
			  		 
			</c:forEach>
		</aon:panelGrid>
	</aon:div>
	
	
</ui:composition>
