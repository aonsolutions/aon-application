<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:dataTable id="vatTaxList" value="#{vatTax.vatTaxModel}"
		style="width: 100%;" styleClass="aon-margin-top"
		rows="0" var="to" rendered="#{vatTax.vatTaxModel.rowCount > 0}">

			<f:facet name="header">
				<rich:columnGroup>
					<aon:column styleClass="aon-dataTable-header" colspan="2">
						<aon:outputText value="&#160;"/>
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" colspan="2">
						<aon:outputText value="ACUMULADO" />
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" colspan="2">
						<aon:outputText value="DECLARADO" />
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" colspan="2">
						<aon:outputText value="RESULTADO" />
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" colspan="2">
						<aon:outputText value="AJUSTES" />
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" colspan="2">
						<aon:outputText value="A DECLARAR" />
					</aon:column>
				</rich:columnGroup>
			</f:facet>
			
         		<aon:column styleClass="aon-editDataTable-textColumn aon-width-300" style="font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.key.value}" style="margin-right: 5px;font-size: 0.8em;"/>
			<aon:outputText value="#{to.key}" rendered="#{!to.descriptionDisabled}"
				style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}"/>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40" style="font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="%" />
			</f:facet>
			<aon:div rendered="#{to.key.percentVisible}">
				<aon:outputText value="#{to.percent}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="%" />
			</aon:div>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
			</f:facet>
			<aon:outputText value="#{to.taxableBaseAccumulated}" rendered="#{to.key.taxableBaseVisible}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_fee}" />
			</f:facet>
			<aon:outputText value="&#160;" rendered="#{!to.key.quotaVisible}"/>  
			
			<aon:outputText value="#{to.quotaAccumulated}" rendered="#{to.key.quotaVisible}"  
				style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
			</f:facet>
			<aon:commandLink actionListener="#{vatTax.onShowDeclared}"
				reRender="declaredDataContainer"
				tabindex="50000" 
				onmouseover="this.style.textDecoration='underline';"
				onmouseout="this.style.textDecoration='inherit';">
				<aon:outputText value="#{to.taxableBaseDeclared}" rendered="#{to.key.taxableBaseVisible}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
   			</aon:commandLink>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_fee}" />
			</f:facet>
			<aon:commandLink actionListener="#{vatTax.onShowDeclared}"
				reRender="declaredDataContainer" 
				tabindex="50000" 
				onmouseover="this.style.textDecoration='underline';"
				onmouseout="this.style.textDecoration='inherit';">
				<aon:outputText value="#{to.quotaDeclared}" rendered="#{to.key.quotaVisible}"   
					style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
   			</aon:commandLink>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
			</f:facet>
			<aon:outputText value="#{to.taxableBaseResult}" rendered="#{to.key.taxableBaseVisible}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_fee}" />
			</f:facet>
			<aon:outputText value="#{to.quotaResult}" rendered="#{to.key.quotaVisible}"   
				style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
			</f:facet>
			<aon:outputText value="#{to.taxableBaseAdjust}" rendered="#{to.key.taxableBaseVisible and (to.key.total or to.key.subtotal or vatTax.to.finished)}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:inputText id="taxableBaseAdjust" value="#{to.taxableBaseAdjust}" 
			rendered="#{to.key.taxableBaseVisible and !to.key.total and !to.key.subtotal and !vatTax.to.finished}" 
				required="true" size="8">
				<a4j:support event="onchange"
					ajaxSingle="true" limitToList="true"
					actionListener="#{vatTax.onChangeTaxableBaseAdjust}"
					focus="quotaAdjust"
					reRender="quotaAdjust"/>
			</aon:inputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_fee}" />
			</f:facet>
			<aon:outputText id="ajusteQuota" value="#{to.quotaAdjust}"
				rendered="#{to.key.quotaVisible and (to.key.total or to.key.subtotal or vatTax.to.finished)}"   
				style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:inputText id="quotaAdjust" value="#{to.quotaAdjust}" 
				rendered="#{to.key.quotaVisible and !to.key.total and !to.key.subtotal and !vatTax.to.finished}" 
				required="true" size="8">
				<a4j:support event="onchange"	
					rendered="#{to.key.taxableBaseVisible}"
					ajaxSingle="true" limitToList="true"
					actionListener="#{vatTax.onChangeQuotaAdjust}"
					reRender="taxableBaseAdjust"/>
			</aon:inputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
			</f:facet>
			<aon:outputText value="#{to.taxableBase}" rendered="#{to.key.taxableBaseVisible}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;"> 
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_fee}" />
			</f:facet>
			<aon:outputText value="#{to.quota}" rendered="#{to.key.quotaVisible}"   
				style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
	</aon:dataTable>
	
	<ui:include src="/com/code/aon/ui/fiscal/facelet/vatTax/declaredPanel.xhtml" />
	
</ui:composition>
