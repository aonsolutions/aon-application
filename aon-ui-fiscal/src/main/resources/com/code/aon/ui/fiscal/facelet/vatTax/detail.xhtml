<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:dataTable id="vatTaxList" value="#{vatTax.vatTaxModel}"
		style="width: 100%;" styleClass="aon-margin-top"
		rows="0" var="to" rendered="#{vatTax.vatTaxModel.rowCount > 0}">

			<f:facet name="header">
				<rich:columnGroup>
					<aon:column styleClass="aon-dataTable-header" colspan="2">
						<aon:outputText value="&#160;"/>
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" colspan="2" 
						rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
						<aon:outputText value="#{fiscalBundle.fiscal_vatTax_accumulated}" />
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" colspan="2" 
						rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
						<aon:outputText value="#{fiscalBundle.fiscal_vatTax_declared}" />
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" colspan="2" 
						rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
						<aon:outputText value="#{bundle.fiscal_result}" />
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" colspan="2" 
						rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
						<aon:outputText value="#{fiscalBundle.fiscal_vatTax_adjusts}" />
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" colspan="2">
						<aon:outputText value="#{fiscalBundle.fiscal_vatTax_to_declare}" />
					</aon:column>
					<aon:column styleClass="aon-dataTable-header" rendered="#{!vatTax.to.finished}">
						<aon:outputText value="&#160;"/>
					</aon:column>
				</rich:columnGroup>
			</f:facet>
			
   		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" style="font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_type}" />
			</f:facet>
			
			<aon:outputText value="#{to.key.value}" style="margin-right: 5px;font-size: 0.6em;"/>
			<aon:outputText value="#{to.key}" rendered="#{!to.descriptionDisabled}"
				style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}"/>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton
						id="vatTaxList-reset" title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						actionListener="#{vatTax.onNewDetail}"
						rendered="#{!vatTax.detailNew and !vatTax.to.finished}"
						styleClass="aon-editDataTable-button aon-icon-reset"
						accesskey="#{bundle.aon_key_new_line}" 
						focus="VatTaxDetail_key"/>

					<aon:selectOneMenu id="VatTaxDetail_key" value="#{vatTax.newDetail.key}" 
						reRender="percentDiv,quotaDiv,taxableBaseDiv"
						rendered="#{vatTax.detailNew}"
						required="true">
						<f:selectItem itemValue="#{null}" itemLabel="-"/>
						<f:selectItems value="#{vatTax.availableKeys}" />
					</aon:selectOneMenu>
					
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40" style="font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="%" />
			</f:facet>
			<aon:div rendered="#{to.key.percentVisible}">
				<aon:outputText value="#{to.percent}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				
				<aon:outputText value="%" />
			</aon:div>
			<f:facet name="footer">
				<aon:div id="percentDiv">
					<aon:inputText id="newPercent" value="#{vatTax.newDetail.percent}"
						rendered="#{vatTax.detailNew and vatTax.newDetail.key != null and vatTax.newDetail.key.percentVisible}" 
						required="true" size="4">
					</aon:inputText>
				</aon:div>
			</f:facet>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;"
			rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
			<f:facet name="header">
				<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
			</f:facet>
			
			<aon:htmlCommandLink id="Accummulated_list_taxableBase" rendered="#{to.key.taxableBaseVisible}"
				title="Click para ver desglose por facturas en formato Excel"
				action="#{vatTax.onListAccummulated}" target="_blank" 
				onmouseover="this.style.textDecoration='underline';"
				onmouseout="this.style.textDecoration='inherit';">
				<aon:outputText value="#{to.taxableBaseAccumulated}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
   			</aon:htmlCommandLink>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;"
			rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_fee}" />
			</f:facet>
			<aon:outputText value="&#160;" rendered="#{!to.key.quotaVisible}"/>  
			
			<aon:htmlCommandLink id="Accummulated_list_quota" rendered="#{to.key.quotaVisible}"
				title="Click para ver desglose por facturas en formato Excel"
				action="#{vatTax.onListAccummulated}" target="_blank" 
				onmouseover="this.style.textDecoration='underline';"
				onmouseout="this.style.textDecoration='inherit';">
				<aon:outputText value="#{to.quotaAccumulated}"   
					style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
   			</aon:htmlCommandLink>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;"
			rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
			<f:facet name="header">
				<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
			</f:facet>
			<aon:commandLink actionListener="#{vatTax.onShowDeclared}"
				reRender="declaredDataContainer"
				tabindex="50000" 
				onmouseover="this.style.textDecoration='underline';"
				onmouseout="this.style.textDecoration='inherit';">
				<aon:outputText value="#{to.taxableBaseDeclared}" rendered="#{to.key.taxableBaseVisible}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
   			</aon:commandLink>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;"
			rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_fee}" />
			</f:facet>
			<aon:commandLink actionListener="#{vatTax.onShowDeclared}"
				reRender="declaredDataContainer" 
				tabindex="50000" 
				onmouseover="this.style.textDecoration='underline';"
				onmouseout="this.style.textDecoration='inherit';">
				<aon:outputText value="#{to.quotaDeclared}" rendered="#{to.key.quotaVisible}"   
					style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
   			</aon:commandLink>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;"
			rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
			<f:facet name="header">
				<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
			</f:facet>
			<aon:outputText value="#{to.taxableBaseResult}" rendered="#{to.key.taxableBaseVisible}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;"
			rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_fee}" />
			</f:facet>
			<aon:outputText value="#{to.quotaResult}" rendered="#{to.key.quotaVisible}"   
				style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;"
			rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
			<f:facet name="header">
				<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
			</f:facet>
			<aon:outputText id="taxableBaseAdjust" value="#{to.taxableBaseAdjust}" rendered="#{to.key.taxableBaseVisible}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;"
			rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_fee}" />
			</f:facet>
			<aon:outputText id="quotaAdjust" value="#{to.quotaAdjust}"
				rendered="#{to.key.quotaVisible}"   
				style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
			<f:facet name="header">
				<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
			</f:facet>
			<aon:outputText value="#{to.taxableBase}" 
				rendered="#{to.key.quotaVisible and (to.key.total or to.key.subtotal or vatTax.to.finished)}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:inputText id="taxableBase" value="#{to.taxableBase}" 
				disabled="#{vatTax.detailNew}"
				rendered="#{to.key.taxableBaseVisible and !to.key.total and !to.key.subtotal and !vatTax.to.finished}" 
				required="true" size="8">
				<a4j:support event="onchange"
					ajaxSingle="true" limitToList="true"
					actionListener="#{vatTax.onChangeTaxableBaseAdjust}"
					focus="quota"
					reRender="vatTaxList"/>
			</aon:inputText>
			<f:facet name="footer">
				<aon:div id="taxableBaseDiv">
					<aon:inputText id="newTaxableBase" value="#{vatTax.newDetail.taxableBase}"
						rendered="#{vatTax.detailNew and vatTax.newDetail.key != null}" 
						required="true" size="8">
					<a4j:support event="onchange"
						limitToList="true"
						actionListener="#{vatTax.onChangeNewTaxableBase}"
						focus="newQuota"
						reRender="newQuota"/>
					</aon:inputText>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;"> 
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_fee}" />
			</f:facet>
			<aon:outputText value="#{to.quota}" 
				rendered="#{to.key.quotaVisible and (to.key.total or to.key.subtotal or vatTax.to.finished)}"   
				style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:inputText id="quota" value="#{to.quota}" 
				disabled="#{vatTax.detailNew}"
				rendered="#{to.key.quotaVisible and !to.key.total and !to.key.subtotal and !vatTax.to.finished}" 
				required="true" size="8">
				<a4j:support event="onchange"	
					ajaxSingle="true" limitToList="true"
					actionListener="#{vatTax.onChangeQuotaAdjust}"
					reRender="vatTaxList"/>
			</aon:inputText>
			<f:facet name="footer">
				<aon:div id="quotaDiv">
					<aon:inputText id="newQuota" value="#{vatTax.newDetail.quota}"
						rendered="#{vatTax.detailNew and vatTax.newDetail.key != null and vatTax.newDetail.key.quotaVisible}" 
						required="true" size="8">
						<a4j:support event="onchange"	
							rendered="#{vatTax.newDetail.key.taxableBaseVisible}"
							limitToList="true"
							actionListener="#{vatTax.onChangeNewQuota}"
							reRender="newTaxableBase"/>
					</aon:inputText>
				</aon:div>
			</f:facet>
		</aon:column>
		
		<aon:column rendered="#{!vatTax.to.finished}"
			 styleClass="aon-dataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			
			<aon:confirmButton
				id="dataTableList-remove" title="#{bundle.aon_remove} (#{bundle.aon_key_remove_line_accelerator})"
				immediate="true"
				reRender="vatTaxContainer"
				rendered="#{(to.key.taxableBaseVisible or to.key.quotaVisible) and !to.key.total and !to.key.subtotal and !vatTax.to.finished and !vatTax.detailNew}"
				confirmTitle="#{bundle.aon_confirm_title}"
				confirmMessage="#{bundle.aon_remove_confirm}"
				confirmActionListener="#{vatTax.onRemoveDetail}"
				styleClass="aon-editDataTable-button aon-icon-delete"
				accesskey="#{bundle.aon_key_remove_line}" />
	
			<f:facet name="footer">
				<aon:div styleClass="aon-nowrap">
					<aon:commandButton
						id="dataTableList-save" title="#{bundle.aon_save} (#{bundle.aon_key_save_line_accelerator})"
						actionListener="#{vatTax.onSaveNewDetail}"
						reRender="vatTaxContainer"
						rendered="#{vatTax.detailNew}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:confirmButton
						id="dataTableList-new-cancel" title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
						reRender="vatTaxContainer"
						rendered="#{vatTax.detailNew}"
						immediate="true"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_cancel_confirm}"
						confirmActionListener="#{vatTax.onCancelNewDetail}"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel_line}" />
				</aon:div>
					
			</f:facet>
		</aon:column>
	</aon:dataTable>
	
	<ui:include src="/com/code/aon/ui/fiscal/facelet/vatTax/declaredPanel.xhtml" />
	
</ui:composition>
