<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:div id="extraInfoContainer#{suffix}">
		<aon:panelGrid columns="2" dir="true" width="100%">

			<aon:outputLabel for="mod347_assetStreetType" value="#{bundle.fiscal_streetInitial}" />
			<aon:inputText id="mod347_assetStreetType#{suffix}" value="#{mod347DetailAsset.to.assetStreetType}" size="4"/>
			
			<aon:outputLabel for="mod347_assetStreet" value="#{bundle.fiscal_streetName}" />
			<aon:inputText id="mod347_assetStreet#{suffix}" value="#{mod347DetailAsset.to.assetStreet}" size="20" maxLength="50"/>
			
			
			<aon:outputText value="#{bundle.fiscal_streetNumber}" />
			<aon:div>
				<aon:inputText id="mod347_assetStreetNumberType#{suffix}" value="#{mod347DetailAsset.to.assetStreetNumberType}" size="3"/> 
				<aon:inputText id="mod347_assetStreetNumber#{suffix}" value="#{mod347DetailAsset.to.assetStreetNumber}" size="5"/>
				<aon:inputText id="mod347_assetStreetNumberSuffix#{suffix}" value="#{mod347DetailAsset.to.assetStreetNumberSuffix}" size="3"/>
			</aon:div> 
			
			<aon:outputLabel for="mod347_assetStreetBlock" value="#{bundle.fiscal_streetBlock}" />
			<aon:inputText id="mod347_assetStreetBlock#{suffix}" value="#{mod347DetailAsset.to.assetStreetBlock}" size="3"/>
			
			<aon:outputLabel for="mod347_assetStreetHall" value="#{bundle.fiscal_streetHall}" />
			<aon:inputText id="mod347_assetStreetHall#{suffix}" value="#{mod347DetailAsset.to.assetStreetHall}" size="3"/>
			
			<aon:outputLabel for="mod347_assetStreetStair" value="#{bundle.fiscal_streetStair}" />
			<aon:inputText id="mod347_assetStreetStair#{suffix}" value="#{mod347DetailAsset.to.assetStreetStair}" size="3"/> 
			
			<aon:outputLabel for="mod347_assetStreetFloor" value="#{bundle.fiscal_streetFloor}" />
			<aon:inputText id="mod347_assetStreetFloor#{suffix}" value="#{mod347DetailAsset.to.assetStreetFloor}" size="3"/>
			
			<aon:outputLabel for="mod347_assetStreetDoor" value="#{bundle.fiscal_streetDoor}" />
			<aon:inputText id="mod347_assetStreetDoor#{suffix}" value="#{mod347DetailAsset.to.assetStreetDoor}" size="3"/>
			
			<aon:outputLabel for="mod347_assetStreetComplement" value="#{bundle.fiscal_streetComplement}" />
			<aon:inputText id="mod347_assetStreetComplement#{suffix}" value="#{mod347DetailAsset.to.assetStreetComplement}" size="20" maxLength="40"/> 
			
			<aon:outputLabel for="mod347_assetStreetCity" value="#{bundle.aon_city}" />
			<aon:inputText id="mod347_assetStreetCity#{suffix}" value="#{mod347DetailAsset.to.assetStreetCity}" size="20" maxLength="30"/>
			
			<aon:outputLabel for="mod347_assetStreetTown" value="#{bundle.registry_municipality}" />
			<aon:inputText id="mod347_assetStreetTown#{suffix}" value="#{mod347DetailAsset.to.assetStreetTown}" size="20" maxLength="30"/>
			
			<aon:outputLabel for="mod347_assetStreetTownCode" value="#{bundle.registry_municipality_code}" />
			<aon:inputText id="mod347_assetStreetTownCode#{suffix}" value="#{mod347DetailAsset.to.assetStreetTownCode}" size="5"/>
			
			<aon:outputLabel for="mod347_assetStreetProvince" value="#{bundle.aon_state}" />
			<aon:selectOneMenu id="mod347_assetStreetProvince#{suffix}" value="#{mod347DetailAsset.to.assetStreetProvince}" >
				<f:selectItem value="#{null}" itemLabel="-"/>
				<f:selectItems value="#{mod347DetailAsset.provinces}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel for="mod347_assetStreetZip" value="#{bundle.registry_zip}" />
			<aon:inputText id="mod347_assetStreetZip#{suffix}" value="#{mod347DetailAsset.to.assetStreetZip}" size="5"/>
			
		</aon:panelGrid>
	</aon:div>
</ui:composition>
