<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:dataTable value="#{modulesModel}" var="module" rows="0">
	
		<aon:column  styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText  value="#{bundle.aon_description}" />		
			</f:facet>
	 		<aon:div>
	 			<aon:outputText value="#{module.infoKey.value}" style="font-size: 0.8em; margin-right: 1em;" />
		 		<aon:outputText value="#{module.infoKey}" />
	 		</aon:div>
		</aon:column>
		
		<aon:column  styleClass="aon-editDataTable-numberColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText  value="#{bundle.aon_units}" />		
			</f:facet>
			<aon:inputText id="#{prefix}Key_unit" 
				value="#{module.doubleValue}" size="8"
				disabled="#{module.infoKey.detailed}"
				required="#{module.infoKey.required}">
				<a4j:support event="onchange" ajaxSingle="true"
					actionListener="#{changeActionListener}"
					reRender="#{prefix}Module_base,#{onChangereRender}"/>
			</aon:inputText>
		</aon:column>

		<aon:column  styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText  value="&#160;" />		
			</f:facet>
				<aon:outputText rendered="#{!module.infoKey.detailed}" value="&#160;" />
				<aon:commandButton ajaxSingle="true"
					actionListener="#{showDetailPanelActionListener}"
					rendered="#{module.infoKey.detailed}"
					styleClass="aon-icon-commandButton aon-icon-index"
					value="&#160;">
				</aon:commandButton>
		</aon:column>
		
		<aon:column  styleClass="aon-editDataTable-textColumn aon-width-200">
			<f:facet name="header">
				<aon:outputText  value="#{bundle.aon_units}" />		
			</f:facet>
			<aon:outputText  value="#{module.unit}" />
		</aon:column>
		

		<aon:column  styleClass="aon-editDataTable-numberColumn aon-width-100 aon-italic">
			<f:facet name="header">
				<aon:outputText  value="#{fiscalBundle.fiscal_factor}" />		
			</f:facet>
			<aon:outputText  value="#{module.factor}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />					
			</aon:outputText>			
		</aon:column>
		
		<aon:column  styleClass="aon-editDataTable-numberColumn aon-width-150 aon-bold">
			<f:facet name="header">
				<aon:outputText  value="#{fiscalBundle.fiscal_base}" />		
			</f:facet>
				<aon:outputText  id="#{prefix}Module_base" value="#{module.base}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />					
				</aon:outputText>			
		</aon:column>
		
	</aon:dataTable>
 		
</ui:composition>
