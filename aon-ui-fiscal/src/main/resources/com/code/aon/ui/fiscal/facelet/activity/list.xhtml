<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="fiscalActivityForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.fiscal_activities_modules}" />
				<ui:param name="controller" value="#{fiscalActivity}" />
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">
				<aon:div style="color:red; font-size: 1.2em; padding: 5px; text-align:center; border: solid red 1px; margin-bottom: 5px; font-weight: bold;">
					<aon:div>
						<aon:outputLabel value="A partir del ejercicio 2018, las datos de actividades se introducen directamente en los modelos fiscales." />
					</aon:div>
					<aon:div>
						<aon:outputLabel value="Los datos introducidos en este programa, no se tendrán en cuenta" />
					</aon:div>
				</aon:div>

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{fiscalActivity}" />

					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-100" alias="FiscalActivity.year">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_year}" />
							</f:facet>
							<aon:outputText value="#{to.year}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-150" alias="FiscalActivity.epigraph">
							<f:facet name="header">
								<aon:outputText value="#{bundle.fiscal_epigraph}" />
							</f:facet>
							<aon:outputText value="#{to.epigraph}" />
						</aon:column>

						<aon:column	styleClass="aon-editDataTable-textColumn aon-width-auto" alias="FiscalActivity.description">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
			
		</aon:form>
	</ui:define>

</ui:composition>
