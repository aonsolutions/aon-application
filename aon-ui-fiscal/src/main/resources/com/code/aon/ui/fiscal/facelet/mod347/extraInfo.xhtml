<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:div id="extraInfoContainer">
		<aon:if test="#{mod347Detail.extraInfoPanelVisible}">
			<rich:modalPanel id="finalizePanel" minHeight="450" minWidth="780"
				showWhenRendered="#{mod347Detail.extraInfoPanelVisible}" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Declarado" />
					</aon:div>
				</f:facet>
				
				<f:facet name="controls">
					<aon:form id="finalizePanelCloseForm">
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{mod347Detail.onCancelExtraInfoPanel}"
							immediate="true">
							<aon:actionHotKey key="esc" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:div styleClass="aon-popupWindow-content">
					<aon:form id="extraInfoForm">
						<aon:div styleClass="aon-width-all">
							<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="saveExtraInfo"
										value="#{bundle.aon_save}"
										reRender="mod347DetailData,extraInfoContainer"
										actionListener="#{mod347Detail.onAcceptExtraInfoPanel}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"/>
									<aon:commandButton id="cancelExtraInfo"
										value="#{bundle.aon_cancel}"
										reRender="mod347DetailData,extraInfoContainer"
										actionListener="#{mod347Detail.onCancelExtraInfoPanel}"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"/>
									<aon:commandButton id="removeExtraInfo"
										value="#{bundle.aon_remove}"
										reRender="mod347DetailData,extraInfoContainer"
										actionListener="#{mod347Detail.onRemoveExtraInfoPanel}"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										onclick="if (!confirm('#{bundle.aon_remove}?')) return false;"/>
							</aon:div>
						</aon:div>
						
						<aon:div>
							<h:panelGrid columns="3" styleClass="aon-width-all" style="border: solid #DDD 1px;"
								columnClasses="aon-width-100,aon-width-250,aon-width-auto">
								<aon:outputLabel for="mod347_detail_document" value="#{bundle.aon_company_document}" />
								<aon:outputLabel for="mod347_operatorNif" value="#{bundle.fiscal_model_347_operatorNif}" />	
								<aon:outputLabel for="mod347_detail_name" value="#{bundle.aon_name}" />
											
								<aon:inputText id="mod347_detail_document" value="#{mod347Detail.to.document}"
									ajaxSingle="true" 
									reRender="mod347_operatorNif" size="9"/>
								<aon:div id="mod347_operatorNif">
									<aon:selectOneMenu id="mod347_detail_intracommunityCountry"
										disabled="#{mod347Detail.to.document != null and mod347Detail.to.document != ''}" 
										value="#{mod347Detail.to.intracommunityCountry}">
										<f:selectItem value="#{null}" itemLabel="-"/>
										<f:selectItems value="#{commonCollections.europeanUnionCountries}" />
									</aon:selectOneMenu>
									<aon:inputText id="mod347_intracommunityDocument" 
										disabled="#{mod347Detail.to.document != null and mod347Detail.to.document != ''}"
										value="#{mod347Detail.to.intracommunityDocument}" size="15" maxlength="15"/>
								</aon:div>
									
								<aon:inputText id="mod347_detail_name" value="#{mod347Detail.to.name}" size="40"/>
							</h:panelGrid>
						</aon:div>
						
						<aon:div style="margin-top: 5px;">
							<h:panelGrid columns="3" styleClass="aon-width-all" style="border: solid #DDD 1px;" 
								columnClasses="aon-width-auto,aon-width-100,aon-width-200">
								<aon:outputLabel for="mod347_detail_type" value="#{bundle.aon_key}" />
								<aon:outputLabel for="mod347_detail_province" value="#{bundle.aon_state}" />
								<aon:outputLabel for="mod347_detail_country" value="#{bundle.aon_country}" />
									
								<aon:selectOneMenu id="mod347_detail_type" value="#{mod347Detail.to.type}"
									reRender="extraInfoForm" 
									style="width: 400px;">
									<f:selectItems value="#{fiscalCollections.mod347Types}" />
								</aon:selectOneMenu>
								<aon:selectOneMenu id="mod347_detail_province" value="#{mod347Detail.to.province}">
									<f:selectItem value="#{null}" itemLabel="-"/>
									<f:selectItems value="#{commonCollections.provinces}" />
								</aon:selectOneMenu>
								<aon:selectOneMenu id="mod347_detail_country" value="#{mod347Detail.to.country}">
									<f:selectItem value="#{null}" itemLabel="-"/>
									<f:selectItems value="#{commonCollections.countries}" />
								</aon:selectOneMenu>
							</h:panelGrid>
						</aon:div>
						
						<aon:div style="margin-top: 5px;">
							<h:panelGrid columns="2" styleClass="aon-width-all" style="border: solid #DDD 1px;" 
								columnClasses="aon-width-250,aon-width-auto">
								<aon:div>
									<aon:selectBooleanCheckbox id="mod347_insurance_operation"
										value="#{mod347Detail.to.insuranceOperation}"/>
									<aon:outputLabel for="mod347_insurance_operation"
										styleClass="aon-italic aon-margin-right"
										value="#{bundle.fiscal_model_347_insurance_operation}" />
								</aon:div>
								<aon:div>
									<aon:selectBooleanCheckbox id="mod347_business_premise_rental"
										value="#{mod347Detail.to.businessPremiseRental}"/>
									<aon:outputLabel for="mod347_business_premise_rental"
										styleClass="aon-italic aon-margin-right"
										value="#{bundle.fiscal_model_347_business_premise_rental}" />
								</aon:div>
							</h:panelGrid>
						</aon:div>
						
						<aon:div style="margin-top: 5px;">
							<h:panelGrid columns="2" styleClass="aon-width-all" style="border: solid #DDD 1px;" 
								columnClasses="aon-width-250,aon-width-auto">
								<aon:div>				
									<aon:selectBooleanCheckbox id="mod347_isp" value="#{mod347Detail.to.isp}"/>
									<aon:outputLabel for="mod347_isp" value="#{bundle.fiscal_model_347_isp}" />						
								</aon:div>
								<aon:div>
									<aon:selectBooleanCheckbox id="mod347_depositRegime" value="#{mod347Detail.to.depositRegime}"/>
									<aon:outputLabel for="mod347_depositRegime" value="#{bundle.fiscal_model_347_depositRegime}" />
								</aon:div>
							</h:panelGrid>
						</aon:div>						


						<aon:div style="margin-top: 5px;">
							<h:panelGrid id="amountsTable" columns="6" styleClass="aon-width-all" style="border: solid #DDD 1px;"
								columnClasses="aon-width-auto
											,aon-width-100 aon-text-right
											,aon-width-100 aon-text-right
											,aon-width-100 aon-text-right
											,aon-width-100 aon-text-right
											,aon-width-100 aon-text-right">
								<aon:outputText value="&#160;"/>
								<aon:outputLabel for="mod347_detail_firstQuarterAmount"  value="#{bundle.fiscal_model_347_asset_first_quarter}" />
								<aon:outputLabel for="mod347_detail_secondQuarterAmount" value="#{bundle.fiscal_model_347_asset_second_quarter}" />
								<aon:outputLabel for="mod347_detail_thirdQuarterAmount"  value="#{bundle.fiscal_model_347_asset_third_quarter}" />
								<aon:outputLabel for="mod347_detail_fourthQuarterAmount" value="#{bundle.fiscal_model_347_asset_fourth_quarter}" />
								<aon:outputLabel for="mod347_detail_amount" value="#{bundle.aon_amount}" />

								<aon:outputText value="#{bundle.fiscal_model_347_amount}"/>
								<aon:inputText id="mod347_detail_firstQuarterAmount"
									disabled="#{mod347Detail.to.vatAccrual}" 
									value="#{mod347Detail.to.firstQuarterAmount}"
									size="12">
									<a4j:support event="onchange" actionListener="#{mod347Detail.onChangeAssetAmount}"
									 	reRender="mod347_detail_amount" ajaxSingle="true"
									 	focus="mod347_detail_secondQuarterAmount"/>
								</aon:inputText>
								
								<aon:inputText id="mod347_detail_secondQuarterAmount" 
									disabled="#{mod347Detail.to.vatAccrual}"
									value="#{mod347Detail.to.secondQuarterAmount}"
									size="12">
									<a4j:support event="onchange" actionListener="#{mod347Detail.onChangeAssetAmount}"
									 	reRender="mod347_detail_amount" ajaxSingle="true"
									 	focus="mod347_detail_thirdQuarterAmount"/>
								</aon:inputText>
								<aon:inputText id="mod347_detail_thirdQuarterAmount" 
									disabled="#{mod347Detail.to.vatAccrual}"
									value="#{mod347Detail.to.thirdQuarterAmount}"
									size="12">
									<a4j:support event="onchange" actionListener="#{mod347Detail.onChangeAssetAmount}"
									 	reRender="mod347_detail_amount" ajaxSingle="true"
									 	focus="mod347_detail_fourthQuarterAmount"/>
								</aon:inputText>
								<aon:inputText id="mod347_detail_fourthQuarterAmount" 
									disabled="#{mod347Detail.to.vatAccrual}"
									value="#{mod347Detail.to.fourthQuarterAmount}"
									size="12">
									<a4j:support event="onchange" actionListener="#{mod347Detail.onChangeAssetAmount}"
									 	reRender="mod347_detail_amount" ajaxSingle="true" />
								</aon:inputText>
								<aon:inputText id="mod347_detail_amount" value="#{mod347Detail.to.amount}"
									disabled="#{!mod347Detail.to.vatAccrual}"
									size="12"/>
							</h:panelGrid>						
								
						</aon:div>
						
						<aon:div style="margin-top: 10px;">
							<h:panelGrid columns="6" styleClass="aon-width-all" style="border: solid #DDD 1px;" 
								columnClasses="aon-width-auto
											,aon-width-100 aon-text-right
											,aon-width-100 aon-text-right
											,aon-width-100 aon-text-right
											,aon-width-100 aon-text-right
											,aon-width-100 aon-text-right">
								<aon:outputText value="&#160;"/>
								<aon:outputLabel for="mod347_asset_first_quarter"  value="#{bundle.fiscal_model_347_asset_first_quarter}" />
								<aon:outputLabel for="mod347_asset_second_quarter" value="#{bundle.fiscal_model_347_asset_second_quarter}" />
								<aon:outputLabel for="mod347_asset_third_quarter"  value="#{bundle.fiscal_model_347_asset_third_quarter}" />
								<aon:outputLabel for="mod347_asset_fourth_quarter" value="#{bundle.fiscal_model_347_asset_fourth_quarter}" />
								<aon:outputLabel for="mod347_asset_amount" value="#{bundle.aon_amount}" />
						
								<aon:outputText value="#{bundle.fiscal_model_347_asset_amount}"/>
								<aon:inputText id="mod347_asset_first_quarter" 
									value="#{mod347Detail.to.assetFirstQuarterAmount}"
									disabled="#{mod347Detail.to.typeA or mod347Detail.to.typeD or mod347Detail.to.typeE or mod347Detail.to.typeG}"
									size="12">
									<a4j:support event="onchange" actionListener="#{mod347Detail.onChangeAssetAmount}"
									 	reRender="mod347_asset_amount" ajaxSingle="true"
									 	focus="mod347_asset_second_quarter"/>
								</aon:inputText>
	 							<aon:inputText id="mod347_asset_second_quarter" 
									value="#{mod347Detail.to.assetSecondQuarterAmount}"
									disabled="#{mod347Detail.to.typeA or mod347Detail.to.typeD or mod347Detail.to.typeE or mod347Detail.to.typeG}"
									size="12">
									<a4j:support event="onchange" actionListener="#{mod347Detail.onChangeAssetAmount}"
									 	reRender="mod347_asset_amount" ajaxSingle="true"
									 	focus="mod347_asset_third_quarter"/>
								</aon:inputText>
	 							<aon:inputText id="mod347_asset_third_quarter" 
									value="#{mod347Detail.to.assetThirdQuarterAmount}"
									disabled="#{mod347Detail.to.typeA or mod347Detail.to.typeD or mod347Detail.to.typeE or mod347Detail.to.typeG}"
									size="12">
									<a4j:support event="onchange" actionListener="#{mod347Detail.onChangeAssetAmount}"
									 	reRender="mod347_asset_amount" ajaxSingle="true"
									 	focus="mod347_asset_fourth_quarter"/>
								</aon:inputText>
	 							<aon:inputText id="mod347_asset_fourth_quarter" 
									value="#{mod347Detail.to.assetFourthQuarterAmount}"
									disabled="#{mod347Detail.to.typeA or mod347Detail.to.typeD or mod347Detail.to.typeE or mod347Detail.to.typeG}"
									size="12">
									<a4j:support event="onchange" actionListener="#{mod347Detail.onChangeAssetAmount}"
									 	reRender="mod347_asset_amount" ajaxSingle="true"
									 	focus="mod347_cash_amount"/>
								</aon:inputText>
								<aon:inputText id="mod347_asset_amount"
									disabled="#{mod347Detail.to.typeA or mod347Detail.to.typeD or mod347Detail.to.typeE or mod347Detail.to.typeG}"
									readonly="true" 
									value="#{mod347Detail.to.assetAmount}"
									size="12"/>
							</h:panelGrid>
						</aon:div>

						<aon:div style="margin-top: 5px;">
							<h:panelGrid columns="3" styleClass="aon-width-all" style="border: solid #DDD 1px;"
								columnClasses="aon-width-250,aon-width-150, aon-width-auto">
								<aon:outputLabel for="mod347_cash_amount" 
									value="#{bundle.fiscal_model_347_cash_amount}" />
								<aon:inputText id="mod347_cash_amount" 
									value="#{mod347Detail.to.cashAmount}"
									reRender="mod347_cash_year" ajaxSingle="true"
									disabled="#{!mod347Detail.to.typeC}"
									size="12"/>
								<aon:div>					
									<aon:selectBooleanCheckbox id="mod347_vatAccrual" value="#{mod347Detail.to.vatAccrual}" 
										ajaxSingle="true" reRender="amountsTable"/>
									<aon:outputLabel for="mod347_vatAccrual" value="#{bundle.fiscal_model_347_vatAccrual}" />
								</aon:div>
									
								<aon:outputLabel for="mod347_cash_year" 
									value="#{bundle.fiscal_model_347_cash_year}" />
								<aon:inputText id="mod347_cash_year"
									disabled="#{!mod347Detail.to.typeC and mod347Detail.to.cashAmount == 0}" 
									value="#{mod347Detail.to.cashYear}"
									size="5"/>
								<aon:div>					
									<aon:outputLabel for="mod347_vatAccrualAmount" styleClass="aon-margin-right" 
										value="#{bundle.fiscal_model_347_vatAccrualAmount}" />
									<aon:inputText id="mod347_vatAccrualAmount"  
										value="#{mod347Detail.to.vatAccrualAmount}" size="12" />
								</aon:div>
							</h:panelGrid>
						</aon:div>
						
						<aon:div style="margin-top: 5px;">
							<h:panelGrid columns="2" columnClasses="aon-width-200,aon-width-auto">

							 	
							</h:panelGrid>
						</aon:div>							
					</aon:form>
				</aon:div>
			</rich:modalPanel>
		</aon:if>
	</aon:div>
</ui:composition>
