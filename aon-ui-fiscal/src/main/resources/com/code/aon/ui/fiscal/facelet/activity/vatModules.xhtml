<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/fiscal/facelet/activity/modules.xhtml" >
		<ui:param name="modulesModel" value="#{fiscalActivity.vatModules}" />
		<ui:param name="prefix" value="vat" />
		<ui:param name="onChangereRender" value="vatInfoTable" />
		<aon:methodParam name="changeActionListener" value="#{fiscalActivity.onChangeVatModule}" type="actionListener"/>
		<aon:methodParam name="showDetailPanelActionListener" value="#{fiscalActivity.onShowVATDetailPanel}" type="actionListener"/>
	</ui:include>		

	<aon:dataTable id="vatInfoTable" value="#{fiscalActivity.vatInfo}" var="info" rows="0" 
		styleClass="aon-margin-top aon-width-all">
	
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
	 		<aon:div>
	 			<aon:outputText value="#{info.infoKey.value}" style="font-size: 0.8em; margin-right: 1em;" />
		 		<aon:outputText style="#{info.title?'font-weight: bold;':''}" 
		 			value="#{info.infoKey}" />
	 		</aon:div>
		</aon:column>
	 			
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
			<aon:div rendered="#{!info.title}">
				<aon:inputText id="vatInfoKey_#{info.infoKey}" 
					value="#{info.doubleValue}" size="8"
					required="#{info.required}"
					rendered="#{!info.calculated}"/>
					
				<aon:outputText  value="#{info.doubleValue}"
					rendered="#{info.calculated}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />					
				</aon:outputText>
			</aon:div>
				
	 	</aon:column>
	</aon:dataTable>
	
</ui:composition>
