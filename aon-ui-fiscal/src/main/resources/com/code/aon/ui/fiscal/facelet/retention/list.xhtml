<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="retentionReportListForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{fiscalBundle.fiscal_retention_report}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />


				<ui:define name="toolbarActions">
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-back"
						value="#{bundle.aon_back}" action="retentionReport_search"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true" accesskey="#{bundle.aon_key_cancel}" />

					<aon:htmlCommandLink id="vatBook-excel-report" value="&#160;"
						target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="retentionList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="vatBook-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="retentionList" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div id="retentionReportData" styleClass="aon-scroll-area">
				<aon:dataTable id="retentionReportList"
					value="#{retentionReport.retentionModel}" rows="20" var="to"
					rendered="#{retentionReport.retentionModel.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-numberColumn,
								aon-editDataTable-numberColumn,
								aon-editDataTable-numberColumn,
								aon-editDataTable-numberColumn,
								aon-editDataTable-numberColumn,
								aon-editDataTable-numberColumn">
					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_tax_date}" />
						</f:facet>
						<h:outputText value="#{to.taxDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</h:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_invoice_order}" />
						</f:facet>
						<h:outputText value="#{to.documentNumber}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_invoice_number}" />
						</f:facet>
						<h:outputText value="#{to.referenceCode}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<h:outputText value="#{to.taxDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</h:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<h:outputText value="#{customerBundle.customer_customer}" />
						</f:facet>
						<aon:outputText value="#{to.registryName}">
							<aon:abbreviateConverter maxWidth="50" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<h:outputText value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.registryDocument}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_taxable_base}" />
						</f:facet>
						<aon:outputText value="#{retentionReport.invoiceTaxableBase}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>


					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.aon_surcharge_ivare}" />
						</f:facet>
						<aon:outputText value="#{retentionReport.invoiceTotalVat}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.invoice_list_report_irpf_percent}" />
						</f:facet>
						<aon:outputText value="#{retentionReport.invoiceRetentionPercent}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="IRPF" />
						</f:facet>
						<aon:outputText value="#{retentionReport.invoiceTotalRetention}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_total}" />
						</f:facet>
						<aon:outputText value="#{retentionReport.invoiceTotalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>


				</aon:dataTable>

				<aon:dataScroller2 for="retentionReportList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
