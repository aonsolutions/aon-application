<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.fiscal_retention_report_module}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener" value="#{retentionReport.onResetModel}" type="actionListener" />
					<aon:methodParam name="searchAction" value="retention_report_search" />
				</ui:define>

				<ui:define name="additionalToolbarContent">
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-panelGrid2-total-text"
					style="text-align:center;border:solid #c4c4c4 1px;width: 100%">
					<aon:panelGroup rendered="#{retentionReport.params.fromInvoiceDate != null}">
						<aon:outputText value="#{bundle.aon_date_from}: " />
						<aon:outputText value="#{retentionReport.params.fromInvoiceDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:panelGroup>
					<aon:panelGroup rendered="#{retentionReport.params.toInvoiceDate != null}">
						<aon:outputText value="&#160;&#160;&#160;#{bundle.aon_date_to}: " />
						<aon:outputText value="#{retentionReport.params.toInvoiceDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:panelGroup>
				</aon:div>

				<aon:outputText value="&#160;" />

				<aon:dataTable var="to" rows="0"
					rowClasses="none,none" 
					style="width: 100%" value="#{retentionReport.model}">

					<aon:column styleClass="aon-editDataTable-iconColumn">
						<aon:div styleClass="aon-bold" style="#{to.first?'margin-top: 20px;':''}">
							<aon:commandLink id="selectButton"
								styleClass="aon-table-row-link" value="&#160;"
								requestDelay="100" actionListener="#{retentionReport.onDetail}" 
								action="retention_report_detail">
							</aon:commandLink>
						</aon:div>
					</aon:column>
					
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
						<f:facet name="header">
							<aon:outputText value="#{bundle.fiscal_withholding_type}"/>	
						</f:facet>
						<aon:div styleClass="#{to.total?'aon-bold':''}" style="#{to.first?'margin-top: 20px;':''}">
							<aon:outputText value="#{bundle.aon_total} " rendered="#{to.total}"/>
							<aon:outputText value="#{to.withholdingType}" rendered="#{!to.withholdingHidden or to.total}"/>
						</aon:div>
					</aon:column>
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_taxable_base}"/>	
						</f:facet>
						<aon:div styleClass="#{to.total?'aon-bold':''}" style="#{to.first?'margin-top: 20px;':''}">
							<aon:outputText value="#{to.base}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:div>
					</aon:column>
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="%"/>	
						</f:facet>
						<aon:div styleClass="#{to.total?'aon-bold':''}" style="#{to.first?'margin-top: 20px;':''}">
								<aon:outputText rendered="#{!to.total}" value="#{to.percent} %" />
						</aon:div>
					</aon:column>
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
						<f:facet name="header">
							<aon:outputText value="#{bundle.fiscal_quota}"/>	
						</f:facet>
						<aon:div styleClass="#{to.total?'aon-bold':''}" style="#{to.first?'margin-top: 20px;':''}">
							<aon:outputText value="#{to.quota}" styleClass="#{to.total?'aon-bold':''}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:div>							
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
						<aon:outputText value="&#160;"/>
					</aon:column>
				</aon:dataTable>
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
