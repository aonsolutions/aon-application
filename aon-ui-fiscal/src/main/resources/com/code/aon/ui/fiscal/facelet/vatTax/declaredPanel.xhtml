<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">
 
	<aon:div id="declaredDataContainer">
		<c:if test="#{vatTax.declaredPanelVisible}">
			<rich:modalPanel id="declaredPanel" minHeight="240"
					minWidth="520" rendered="#{vatTax.declaredPanelVisible}"
					showWhenRendered="true" zindex="90">
					<f:facet name="header">
						<aon:div styleClass="aon-popupWindow-title">
							<aon:outputText value="#{fiscalBundle.fiscal_vatTax_declared_info}" />
						</aon:div>
					</f:facet>
					<f:facet name="controls">
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							actionListener="#{vatTax.onHideDeclared}"
							reRender="declaredDataContainer" immediate="true">
							<aon:actionHotKey key="esc" />
						</aon:commandButton>
					</f:facet>
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div styleClass="aon-popupWindow-content-internal">
							
							<aon:dataTable id="vatTaxDeclaredList" value="#{vatTax.declaredModel}"
								style="width: 100%;" styleClass="aon-margin-top"
								rows="0" var="dec" >

								<aon:column styleClass="aon-editDataTable-TextColumn aon-width-auto #{dec.vatTax.replaced?'aon-line-through':''}">
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.finance_vat_period}" />
									</f:facet>
									<aon:outputText value="#{dec.vatTax.period}" />
									<aon:outputLabel for="VatTax_replacement" styleClass="aon-italic"
										rendered="#{dec.vatTax.replacement}"
										value=" (#{bundle.aon_replacement})" />
									<f:facet name="footer">
										<aon:outputText value="#{vatTax.detail.key}" />
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80 #{dec.vatTax.replaced?'aon-line-through':''}" 
									style="background-color:#f6f5e3;font-size: 0.9em;">
									<f:facet name="header">
										<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
									</f:facet>
									<aon:outputText value="#{dec.taxableBase}" rendered="#{dec.key.taxableBaseVisible}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<f:facet name="footer">
										<aon:div styleClass="aon-text-right">		
											<aon:outputText value="#{vatTax.detail.taxableBaseDeclared}" rendered="#{vatTax.detail.key.taxableBaseVisible}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:div>		
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40 #{dec.vatTax.replaced?'aon-line-through':''}">
									<f:facet name="header">
										<aon:outputText value="%" />
									</f:facet>
									<aon:div rendered="#{dec.key.percentVisible}">
										<aon:outputText value="#{dec.percent}" >
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>
										<aon:outputText value="%" />
									</aon:div>
									<f:facet name="footer">
										<aon:div rendered="#{vatTax.detail.key.percentVisible}">
											<aon:outputText value="#{vatTax.detail.percent}" >
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
											<aon:outputText value="%" />
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80 #{dec.vatTax.replaced?'aon-line-through':''}" 
									style="background-color:#f6f5e3;font-size: 0.9em;">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_fee}" />
									</f:facet>
									<aon:outputText value="&#160;" rendered="#{!dec.key.quotaVisible}"/>  
									<aon:outputText value="#{dec.quota}" rendered="#{dec.key.quotaVisible}"  
										style="#{dec.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{dec.key.total?'font-size: 1.1em;':''}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<f:facet name="footer">
										<aon:div styleClass="aon-text-right">		
											<aon:outputText value="&#160;" rendered="#{!vatTax.detail.key.quotaVisible}"/>  
											<aon:outputText value="#{vatTax.detail.quotaDeclared}" rendered="#{vatTax.detail.key.quotaVisible}"  
												style="#{vatTax.detail.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{vatTax.detail.key.total?'font-size: 1.1em;':''}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:div>
									</f:facet>
								</aon:column>
								
							</aon:dataTable>							
						</aon:div>
					</aon:div>
				</rich:modalPanel>
			</c:if>
	</aon:div>

</ui:composition>
