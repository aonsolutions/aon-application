<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">
 
	<aon:div id="moduleDetailDataContainer">
		<c:if test="#{fiscalActivity.detailPanelVisible}">
			<rich:modalPanel id="moduleDetailPanel" minHeight="400"
					minWidth="800" rendered="#{fiscalActivity.detailPanelVisible}"
					showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.fiscal_module_detail}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
				</f:facet>
				<aon:div styleClass="aon-popupWindow-content">
					
					<aon:dataTable value="#{fiscalActivity.modulesDetailModel}" var="module" rows="0"
						styleClass="aon-margin-top aon-width-all">
					
						<aon:column  styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText  value="#{bundle.aon_description}" />		
							</f:facet>
					 		<aon:div>
					 			<aon:outputText value="#{module.infoKey.value}" style="font-size: 0.8em; margin-right: 1em;" />
						 		<aon:outputText value="#{module.infoKey}" />
					 		</aon:div>
							<f:facet name="footer">
						 		<aon:div styleClass="aon-text-right aon-bold">
							 		<aon:outputText value="#{fiscalActivity.infoToDetail.infoKey}" />
							 	</aon:div>
							</f:facet>
						</aon:column>
						
						<aon:column  styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText  value="&#160;" />		
							</f:facet>
							<aon:inputText id="detail_amount" 
								value="#{module.doubleValue}" size="8"
								rendered="#{!module.infoKey.choice}"
								required="#{module.infoKey.required}">
								<a4j:support event="onchange" ajaxSingle="true"
									actionListener="#{fiscalActivity.onChangeDetailModule}"
									reRender="detail_amount,infoDetailAmount"/>
							</aon:inputText>
							<aon:selectOneMenu id="detail_amount-SELECT" 
								value="#{module.value}"
								required="#{module.infoKey.required}" 
								rendered="#{module.infoKey.choice}">
								<f:selectItems value="#{fiscalActivity.keyChoices[module.infoKey]}" />
								<a4j:support event="onchange" ajaxSingle="true"
									actionListener="#{fiscalActivity.onChangeDetailModule}"
									reRender="detail_amount,infoDetailAmount"/>
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:div styleClass="aon-text-right aon-bold">
									<aon:outputText id="infoDetailAmount" value="#{fiscalActivity.infoToDetail.doubleValue}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />					
									</aon:outputText>
								</aon:div>			
							</f:facet>
						</aon:column>
					</aon:dataTable>
					
					<aon:div styleClass="aon-margin-top aon-text-center">
						<aon:commandButton type="button"
							value="#{bundle.aon_accept}" 
							styleClass="aon-icon-accept aon-search-lookup-button"
							actionListener="#{fiscalActivity.onHideDetailPanel}"
							reRender="moduleDetailDataContainer,activityTab" 
							immediate="true">
							<aon:actionHotKey key="esc" />
						</aon:commandButton>
					</aon:div>					
					
				</aon:div>
			</rich:modalPanel>
		</c:if>
	</aon:div>

</ui:composition>
