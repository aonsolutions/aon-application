<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<aon:div styleClass="aon-width-all aon-text-center"
		style="border: dotted #CCC 1px;">
		<aon:outputText value="#{controller.selectedActivity}"
			style="margin-top: 5px;font-weight: bold;" />
	</aon:div>
	<aon:div id="modulesGridContainer">
		<aon:panelGrid  columns="3" styleClass="aon-panelGrid aon-width-all aon-margin-top"
			columnClasses="aon-panelGrid-odd aon-width-auto 
				,aon-panelGrid-even aon-width-100 aon-text-right
				,aon-panelGrid-even aon-width-150 aon-text-right">
	
			<aon:if test="#{controller.modUnit1 != null}">
				<aon:outputText value="#{controller.modUnit1.description}" />
				<aon:outputText value="#{controller.modUnit1.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{controller.modAmount1.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:if>
	
			<aon:if test="#{controller.modUnit2 != null}">
				<aon:outputText value="#{controller.modUnit2.description}" />
				<aon:outputText value="#{controller.modUnit2.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{controller.modAmount2.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:if>
		
			<aon:if test="#{controller.modUnit3 != null}">
				<aon:outputText value="#{controller.modUnit3.description}" />
				<aon:outputText value="#{controller.modUnit3.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{controller.modAmount3.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:if>
		
			<aon:if test="#{controller.modUnit4 != null}">
				<aon:outputText value="#{controller.modUnit4.description}" />
				<aon:outputText value="#{controller.modUnit4.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{controller.modAmount4.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:if>
		
			<aon:if test="#{controller.modUnit5 != null}">
				<aon:outputText value="#{controller.modUnit5.description}" />
				<aon:outputText value="#{controller.modUnit5.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{controller.modAmount5.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:if>
	
			<aon:if test="#{controller.modUnit6 != null}">
				<aon:outputText value="#{controller.modUnit6.description}" />
				<aon:outputText value="#{controller.modUnit6.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{controller.modAmount6.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:if>
	
			<aon:if test="#{controller.modUnit7 != null}">
				<aon:outputText value="#{controller.modUnit7.description}" />
				<aon:outputText value="#{controller.modUnit7.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{controller.modAmount7.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:if>
	
		</aon:panelGrid>
		<aon:panelGrid columns="2" styleClass="aon-panelGrid aon-width-all aon-margin-top"
			columnClasses="aon-panelGrid-odd aon-width-auto 
				,aon-panelGrid-even aon-width-150 aon-text-right">
				
			<aon:outputText value="#{controller.modCKey}" />
			<aon:outputText value="#{controller.modC.amount}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
	
			<aon:outputText value="#{controller.modDKey}" />
			<aon:outputText value="#{controller.modD.amount}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
	
			<aon:if test="#{!controller.declaration.lastPeriod}">
				<aon:outputText value="#{controller.modZKey}" />
				<aon:outputText value="#{controller.modZ.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				
				<aon:if test="#{controller.modZD != null}">
					
					<aon:div>
						<aon:outputText value="#{controller.modZDKey}" />
						<aon:div styleClass="aon-italic"
							rendered="#{controller.modZ.amount != 0}" 
							style="font-weight: normal; padding-left: 20px;">
							<aon:outputText value="#{controller.modZAKey}" />
							<aon:outputText value="&#160;:&#160;" />
							<aon:outputText value="#{controller.modZA.accumulatedAmount}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:div>
					</aon:div>
					<aon:inputText value="#{controller.modZD.accumulatedAmount}"
						 required="true" size="8">
						 <a4j:support event="onchange" reRender="modulesGridContainer"
						 	ajaxSingle="true" actionListener="#{controller.onChangeZD}"/>
					</aon:inputText>
				</aon:if>
		
				<aon:outputText value="#{controller.modEKey}" />
				<aon:outputText value="#{controller.modE.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				
				
				<aon:outputText value="#{controller.modFKey}" />
				<aon:div>
					<aon:outputText value="#{controller.modF.amount}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:outputText value="&#160;(Modif.)" rendered="#{controller.modF.adjustAmount != 0}" style="color:red;"/>
				</aon:div>
			</aon:if>
			<aon:if test="#{controller.declaration.lastPeriod}">
				<aon:outputText value="#{controller.modGKey}" />
				<aon:inputText value="#{controller.modG.accumulatedAmount}"
					 required="true" size="8">
					 <a4j:support event="onchange" reRender="modulesGridContainer"
					 	ajaxSingle="true" actionListener="#{controller.onChangeHD}"/>
				</aon:inputText>
			
				<aon:outputText value="#{controller.modHKey}" />
				<aon:outputText value="#{controller.modH.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				
				<aon:if test="#{controller.modHD != null}">
					<aon:div>
						<aon:outputText value="#{controller.modHDKey}" />
						<aon:div styleClass="aon-italic"
							rendered="#{controller.modH.amount != 0}" 
							style="font-weight: normal; padding-left: 20px;">
							<aon:outputText value="#{controller.modHAKey}" />
							<aon:outputText value="&#160;:&#160;" />
							<aon:outputText value="#{controller.modHA.accumulatedAmount}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:div>
					</aon:div>
					<aon:inputText value="#{controller.modHD.accumulatedAmount}"
						 required="true" size="8">
						 <a4j:support event="onchange" reRender="modulesGridContainer"
						 	ajaxSingle="true" actionListener="#{controller.onChangeHD}"/>
					</aon:inputText>
				</aon:if>

				<aon:outputText value="#{controller.modIKey}" />
				<aon:outputText value="#{controller.modI.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>

				<aon:outputText value="#{controller.modJKey}" />
				<aon:inputText value="#{controller.modJ.accumulatedAmount}"
					 required="true" size="8">
					 <a4j:support event="onchange" reRender="modulesGridContainer"
					 	ajaxSingle="true" actionListener="#{controller.onChangeHD}"/>
				</aon:inputText>

				<aon:outputText value="#{controller.modKKey}" />
				<aon:inputText value="#{controller.modK.accumulatedAmount}"
					 required="true" size="8">
					 <a4j:support event="onchange" reRender="modulesGridContainer"
					 	ajaxSingle="true" actionListener="#{controller.onChangeHD}"/>
				</aon:inputText>

				<aon:outputText value="#{controller.modLKey}" />
				<aon:outputText value="#{controller.modL.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>

				<aon:outputText value="#{controller.modMKey}" />
				<aon:outputText value="#{controller.modM.amount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:if>
				
		</aon:panelGrid>
	</aon:div>
	
</ui:composition>
