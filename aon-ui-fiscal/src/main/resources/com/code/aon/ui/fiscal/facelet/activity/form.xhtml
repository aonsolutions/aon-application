<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="fiscalActivityForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.fiscal_activities_modules}" />
				<ui:param name="controller" value="#{fiscalActivity}" />
				<ui:param name="skipSaveButton" value="#{fiscalActivity.to.epigraph == null}" />
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:div style="color:red; font-size: 1.2em; padding: 5px; text-align:center; border: solid red 1px; margin-bottom: 5px; font-weight: bold;">
					<aon:div>
						<aon:outputLabel value="A partir del ejercicio 2018, las datos de actividades se introducen directamente en los modelos fiscales." />
					</aon:div>
					<aon:div>
						<aon:outputLabel value="Los datos introducidos en este programa, no se tendrán en cuenta" />
					</aon:div>
				</aon:div>

				<aon:panelGrid id="epigraphTable" columns="2" dir="true" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-100
								  ,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="FiscalActivity_year"
						value="#{bundle.aon_year}" />
					<aon:inputText id="FiscalActivity_year" size="5" maxlength="4"
						ajaxSingle="true" reRender="FiscalActivity_year"
						disabled="#{!fiscalActivity.nevv}"
						focus="'#{'FiscalActivity_sector'}"
						value="#{fiscalActivity.to.year}" required="true" />
				
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="FiscalActivity_farmer" value="#{fiscalActivity.to.farmer}"
							disabled="#{!fiscalActivity.nevv and fiscalActivity.to.epigraph != null}">
							<a4j:support event="onchange" ajaxSingle="true"
								reRender="epigraphTable"
								actionListener="#{fiscalActivity.onClearSector}"/>
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="FiscalActivity_farmer" value="#{bundle.fiscal_farmer_activity}" />
					</aon:div>
					
					<aon:if test="#{fiscalActivity.nevv}">
						<aon:outputLabel for="FiscalActivity_sector"
							value="#{bundle.fiscal_sector}" />
						<aon:div id="epigraphContainer">
							<aon:inputText id="FiscalActivity_sector" size="60"
								disabled="#{fiscalActivity.to.epigraph != null}"
								value="#{fiscalActivity.to.sector.description}" required="true"/>
							<aon:commandButton value="&#160;" immediate="true" 
								title="#{bunble.aon_search}" alt="#{bunble.aon_search}"
								rendered="#{fiscalActivity.to.epigraph == null}"
								actionListener="#{fiscalActivity.onShowSectors}"
								reRender="sectorDataContainer"
								styleClass="aon-lookupButton" />
							<aon:commandButton value="&#160;" immediate="true" 
								title="#{bunble.aon_remove}" alt="#{bunble.aon_remove}"
								rendered="#{fiscalActivity.to.epigraph != null}"
								actionListener="#{fiscalActivity.onClearSector}"
								styleClass="aon-lookupButton-clear" />
							<rich:suggestionbox id="FiscalActivity_sectorSuggestion" for="FiscalActivity_sector" 
								suggestionAction="#{fiscalActivity.getSectors}" var="sector"
								minChars="3" width="500" 
								nothingLabel="#{bundle.aon_search_no_results}">
								<aon:column>
									<h:outputText value="#{sector.sector}" />
								</aon:column>
								<aon:column>
									<h:outputText value="#{sector.description}" />
								</aon:column>
								<a4j:support event="onselect" limitToList="true" ajaxSingle="true"
									reRender="epigraphTable">
									<f:setPropertyActionListener target="#{fiscalActivity.to.sector}" 
										value="#{sector}" />
									<aon:actionListener method="#{fiscalActivity.onSectorSelected}" />									
								</a4j:support>
							</rich:suggestionbox>
						</aon:div>
						
						<aon:if test="#{fiscalActivity.to.sector != null}">
							<aon:if test="#{fiscalActivity.to.epigraph == null}">
								<aon:outputText value="#{bundle.fiscal_epigraph}" />
								<aon:div styleClass="aon-padding">
									<aon:div styleClass="aon-margin-bottom">
										<aon:outputText value="Seleccione un epigrafe de la siguiente lista" styleClass="aon-italic" />
									</aon:div>
									<aon:methodParam name="rowSelectorActionListener" value="#{fiscalActivity.onSelectEpigraph}" type="actionListener"/>
									<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
										<ui:param name="controller" value="#{fiscalActivity}" />
										<ui:param name="dataTableId" value="fiscalActivityEpigraphs" />
										<ui:param name="dataModel" value="#{fiscalActivity.epigraphs}" />
										<ui:param name="rows" value="0" />
										<ui:param name="showDataScroller" value="false" />
										<ui:define name="columns">
											<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
												<aon:outputText value="#{to.code}" />
											</aon:column>
											<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
												<aon:outputText value="#{to.description}" />
											</aon:column>
										</ui:define>
									</ui:decorate>
									<aon:outputText value="&#160;" />
								</aon:div>
							</aon:if>
						</aon:if>
					</aon:if>
					<aon:if test="#{fiscalActivity.to.epigraph != null}">
						<aon:outputText value="#{bundle.fiscal_epigraph}" />
						<aon:outputText value="#{fiscalActivity.to.epigraph} - #{fiscalActivity.to.description}"
							styleClass="aon-bold" style="font-size: 1.2em;"/>
					
					
						<aon:outputLabel for="FiscalActivity_activity"
							value="#{bundle.aon_activity}" />
						<aon:div>
							<aon:selectOneMenu id="FiscalActivity_activity"
								value="#{fiscalActivity.to.activity}" ajaxSingle="true">
								<f:selectItem itemLabel="- -" value="#{null}" />
								<f:selectItems value="#{companyCollections.companyActivities}" />
							</aon:selectOneMenu>
							<aon:outputLabel styleClass="aon-italic aon-margin-left" 
								value="Actividad definida en configuraci&#243;n global de la empresa, la que se vincula a facturas, apuntes, etc ..."/>	
							<aon:outputLabel styleClass="aon-italic aon-margin-left" 
								value="Si tiene m&#225;s de una actividad, importante para discriminar los ingresos/gastos por actividad."/>	
						</aon:div>
					</aon:if>
					
				</aon:panelGrid>
				
				<aon:panelTabSet id="activityTab" selectedTab="#{fiscalActivity.selectedTab}" >
					
					<aon:if test="#{fiscalActivity.info.rowCount > 0}">
						<aon:panelTab id="InfoTab" label="#{bundle.fiscal_epigraph_addinfo}">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/activity/info.xhtml" />		
						</aon:panelTab>
					</aon:if>
					
					<aon:if test="#{fiscalActivity.irpfModules.rowCount > 0}">
						<aon:panelTab id="irpfTab" label="#{bundle.fiscal_irpf_modules}">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/activity/irpfModules.xhtml" />		
						</aon:panelTab>
					</aon:if>
					
					<aon:if test="#{fiscalActivity.vatModules.rowCount > 0}">
						<aon:panelTab id="vatTab" label="#{bundle.fiscal_vat_modules}">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/activity/vatModules.xhtml" />		
						</aon:panelTab>
					</aon:if>
				</aon:panelTabSet>
			</aon:div>
			
			<ui:include src="/com/code/aon/ui/fiscal/facelet/activity/sectorPanel.xhtml" />
			<ui:include src="/com/code/aon/ui/fiscal/facelet/activity/moduleDetailPanel.xhtml" />
		</aon:form>
	</ui:define>

</ui:composition>
