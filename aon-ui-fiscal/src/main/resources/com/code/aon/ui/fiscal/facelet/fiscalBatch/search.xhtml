<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml"
	xmlns:rich="http://richfaces.org/rich">

	<ui:define name="content">
		<aon:form>

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.registry_batch_document}" />
				<ui:param name="controller" value="#{fiscalBatch}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{fiscalBatch}" />
				<ui:define name="searchContent">
				
					<aon:outputLabel for="FiscalBatch_administration"
						value="#{bundle.aon_administration}" />
					<aon:selectOneMenu id="FiscalBatch_administration"
						valueChangeListener="#{controller.addEqualExpression}"
						converter="aon.EnumConverter">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.administrations}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="FiscalBatch_type"
						value="#{bundle.aon_model}" />
					<aon:selectOneMenu id="FiscalBatch_type"
						valueChangeListener="#{controller.addEqualExpression}"
						converter="aon.EnumConverter">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{fiscalCollections.fiscalBatchTypes}" />
					</aon:selectOneMenu>
					

					<aon:outputLabel for="FiscalBatch_year" value="#{bundle.aon_year}" />
					<aon:inputText id="FiscalBatch_year" size="5" valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="FiscalBatch_period"
						value="#{bundle.aon_period}" />
					<aon:selectOneMenu id="FiscalBatch_period"
						valueChangeListener="#{controller.addEqualExpression}"
						converter="aon.EnumConverter">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{fiscalCollections.periods}" />
					</aon:selectOneMenu>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
