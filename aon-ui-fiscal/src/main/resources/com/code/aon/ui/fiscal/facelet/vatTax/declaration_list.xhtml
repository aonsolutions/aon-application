<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
		<ui:param name="toolbarTitle" value="Resultado" />
		<ui:param name="controller" value="#{vatTaxDeclaration}" />
		
		<ui:param name="skipSearchButton" value="true" />
	</ui:decorate>

	<aon:div styleClass="aon-scroll-area">
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
			<ui:param name="controller" value="#{vatTaxDeclaration}" />

			<ui:define name="columns">
				<aon:column  styleClass="aon-editDataTable-textColumn aon-width-80">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_administration}" />
					</f:facet>
					<aon:outputText value="#{to.administration}" />
				</aon:column>
				
				<aon:column  styleClass="aon-editDataTable-numberColumn aon-width-50">
					<f:facet name="header">
						<aon:outputText value="%" />
					</f:facet>
					<aon:outputText value="#{to.percent}" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:column>

				<aon:column  styleClass="aon-editDataTable-numberColumn aon-width-200">
					<f:facet name="header">
						<aon:outputText value="#{fiscalBundle.fiscal_total_tax_debt}" />
					</f:facet>
					<aon:outputText value="#{to.totalTaxDebt}" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:column>

				<aon:column  styleClass="aon-editDataTable-textColumn aon-width-70 aon-nowrap">
					<aon:outputText value="#{fiscalBundle.fiscal_compensate}" rendered="#{to.compensateEnabled}"/>
					<aon:outputText value="#{fiscalBundle.fiscal_pay_back}" rendered="#{to.payBackEnabled}"/>
					<aon:outputText value="#{fiscalBundle.fiscal_deposit}" rendered="#{to.depositEnabled}"/>
				</aon:column>

				<aon:column  styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputText value="#{configBundle.config_bank_account}" />
					</f:facet>
					<aon:outputText value="#{to.registryBank.fullName}">
<!-- 
						<aon:abbreviateConverter maxWidth="50" />
 -->
					</aon:outputText>
				</aon:column>

				<aon:column  styleClass="aon-editDataTable-textColumn aon-width-80">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_status}" />
					</f:facet>
					<aon:outputText value="#{to.status}" />
				</aon:column>
			</ui:define>
		</ui:decorate>
	</aon:div>

</ui:composition>
