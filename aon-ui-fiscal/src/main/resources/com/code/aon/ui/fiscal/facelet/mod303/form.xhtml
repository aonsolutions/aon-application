<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<ui:decorate template="/com/code/aon/ui/fiscal/facelet/model/formContent.xhtml">
			<ui:param name="moduleLabel" value="#{bundle.fiscal_model_310_module}" />
			<ui:param name="controller" value="#{mod303}" />
			<ui:param name="quarterPeriods" value="#{true}" />
			<ui:param name="skipDetail" value="#{false}" />
			
			<ui:define name="afterTab">
				<aon:if test="#{controller.extraTabVisible}">
					<aon:if test="#{controller.to.year lt 2017}">	
						<aon:panelTab id="extraTab" label="#{bundle.fiscal_model_347_extra_info}">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/mod303/extraInfo.xhtml" >
								<ui:param name="controller" value="#{controller}" />
							</ui:include>
						</aon:panelTab>
					</aon:if>
					<aon:if test="#{controller.to.year gt 2016}">	
						<aon:panelTab id="extraTab2017" label="#{bundle.fiscal_model_347_extra_info}">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/mod303/extraInfo2017.xhtml" >
								<ui:param name="controller" value="#{controller}" />
							</ui:include>
						</aon:panelTab>
					</aon:if>
				</aon:if>
			</ui:define>	
			
			<ui:define name="afterAll">
				<aon:div id="activityContainer">
					<aon:if test="#{controller.modulesPanelVisible}">
						<rich:modalPanel id="finalizePanel" minHeight="500" minWidth="700"
							showWhenRendered="#{controller.modulesPanelVisible}" zindex="90">
							<f:facet name="header">
								<aon:div styleClass="aon-popupWindow-title">
									<aon:outputText value="#{controller.selectedActivity}" />
								</aon:div>
							</f:facet>
							<f:facet name="controls">
								<aon:form id="finalizePanelCloseForm">
									<aon:commandButton type="button"
										styleClass="aon-popupWindow-close"
										actionListener="#{controller.onHideActivityPanel}"
										immediate="true">
										<aon:actionHotKey key="esc" />
									</aon:commandButton>
								</aon:form>
							</f:facet>
							<aon:div styleClass="aon-popupWindow-content">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:form>
											<aon:commandButton id="finishModulesFiscalModel"
												value="#{bundle.aon_accept}"
												actionListener="#{controller.onAcceptModules}"
												styleClass="aon-finding-toolbar-item aon-icon-lock"/>
										</aon:form>
									</aon:div>
								</aon:div>
								<aon:form id="finalizeForm">
									<ui:include
										src="/com/code/aon/ui/fiscal/facelet/mod303/modules.xhtml" />
								</aon:form>
							</aon:div>
						</rich:modalPanel>
					</aon:if>
					<aon:if test="#{controller.farmerPanelVisible}">
						<rich:modalPanel id="farmerFinalizePanel" minHeight="450" minWidth="700"
							showWhenRendered="#{controller.farmerPanelVisible}" zindex="90">
							<f:facet name="header">
								<aon:div styleClass="aon-popupWindow-title">
									<aon:outputText value="#{controller.selectedActivity}" />
								</aon:div>
							</f:facet>
							<f:facet name="controls">
								<aon:form id="farmerFinalizePanelCloseForm">
									<aon:commandButton type="button"
										styleClass="aon-popupWindow-close"
										actionListener="#{controller.onHideActivityPanel}"
										immediate="true">
										<aon:actionHotKey key="esc" />
									</aon:commandButton>
								</aon:form>
							</f:facet>
							<aon:div styleClass="aon-popupWindow-content">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:form>
											<aon:commandButton id="finishFarmerFiscalModel"
												value="#{bundle.aon_accept}"
												actionListener="#{controller.onAcceptModules}"
												styleClass="aon-finding-toolbar-item aon-icon-lock"/>
										</aon:form>
									</aon:div>
								</aon:div>
								<aon:form id="finalizeForm">
									<ui:include
										src="/com/code/aon/ui/fiscal/facelet/mod303/farmer.xhtml" />
								</aon:form>
							</aon:div>
						</rich:modalPanel>
					</aon:if>
				</aon:div>
				
				<aon:div id="epigraphContainer">
					<aon:if test="#{controller.epigraphPanelVisible}">
						<rich:modalPanel id="epigraphPanel" minHeight="450" minWidth="700"
							showWhenRendered="#{controller.epigraphPanelVisible}" zindex="90">
							<f:facet name="header">
								<aon:div styleClass="aon-popupWindow-title">
									<aon:outputText value="&#160;" />
								</aon:div>
							</f:facet>
							<f:facet name="controls">
								<aon:form id="finalizeEpigraphPanelCloseForm">
									<aon:commandButton type="button"
										styleClass="aon-popupWindow-close"
										actionListener="#{controller.onHideEpigraphPanel}"
										immediate="true">
										<aon:actionHotKey key="esc" />
									</aon:commandButton>
								</aon:form>
							</f:facet>
							<aon:div styleClass="aon-popupWindow-content">
								<aon:div style="height: 400px; overflow:auto;">
									<aon:form id="finalizeEpigraphForm">
										<aon:methodParam name="rowSelectorActionListener" value="#{controller.onSelectEpigraph}" type="actionListener"/>
										<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
											<ui:param name="controller" value="#{controller}" />
											<ui:param name="dataTableId" value="epigraphTable" />
											<ui:param name="dataModel" value="#{controller.epigraphModel}" />
											<ui:param name="rows" value="0" />
											<ui:param name="showDataScroller" value="false" />
											
											<ui:define name="columns">
												<aon:column styleClass="aon-editDataTable-TextColumn aon-width-150">
													<f:facet name="header">
														<aon:outputText value="&#160;" />
													</f:facet>
													<aon:outputText value="#{to.epigraph}" />
												</aon:column>
				
												<aon:column styleClass="aon-editDataTable-TextColumn aon-width-auto}">
													<f:facet name="header">
														<aon:outputText value="&#160;" />
													</f:facet>
													<aon:outputText value="#{to.literal}" />
												</aon:column>
											</ui:define>
										</ui:decorate>
										
									</aon:form>
								</aon:div>
							</aon:div>
						</rich:modalPanel>
					</aon:if>
				</aon:div>
				
			</ui:define>
		</ui:decorate>

	</ui:define>
</ui:composition>
