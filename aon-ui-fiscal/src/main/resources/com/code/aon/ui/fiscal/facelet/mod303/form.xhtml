<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<ui:decorate template="/com/code/aon/ui/fiscal/facelet/model/formContent.xhtml">
			<ui:param name="moduleLabel" value="#{bundle.fiscal_model_303_module}" />
			<ui:param name="controller" value="#{mod303}" />
			<ui:param name="quarterPeriods" value="#{true}" />
			
			<ui:define name="afterAll">
				<aon:div id="activityContainer">
					<c:if test="#{controller.modulesPanelVisible}">
						<rich:modalPanel id="finalizePanel" minHeight="450" minWidth="700"
							showWhenRendered="#{controller.modulesPanelVisible}" zindex="90">
							<f:facet name="header">
								<aon:div styleClass="aon-popupWindow-title">
									<aon:outputText value="#{controller.selectedActivity}" />
								</aon:div>
							</f:facet>
							<f:facet name="controls">
								<aon:form id="finalizePanelCloseForm">
									<aon:commandButton type="button"
										styleClass="aon-popupWindow-close"
										actionListener="#{controller.onHideActivityPanel}"
										immediate="true">
										<aon:actionHotKey key="esc" />
									</aon:commandButton>
								</aon:form>
							</f:facet>
							<aon:div styleClass="aon-popupWindow-content">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:form>
											<aon:commandButton id="finishModulesFiscalModel"
												value="#{bundle.aon_accept}"
												actionListener="#{controller.onAcceptModules}"
												styleClass="aon-finding-toolbar-item aon-icon-lock"/>
										</aon:form>
									</aon:div>
								</aon:div>
								<aon:form id="finalizeForm">
									<ui:include
										src="/com/code/aon/ui/fiscal/facelet/mod303/modules.xhtml" />
								</aon:form>
							</aon:div>
						</rich:modalPanel>
					</c:if>
					<c:if test="#{controller.farmerPanelVisible}">
						<rich:modalPanel id="farmerFinalizePanel" minHeight="450" minWidth="700"
							showWhenRendered="#{controller.farmerPanelVisible}" zindex="90">
							<f:facet name="header">
								<aon:div styleClass="aon-popupWindow-title">
									<aon:outputText value="#{controller.selectedActivity}" />
								</aon:div>
							</f:facet>
							<f:facet name="controls">
								<aon:form id="farmerFinalizePanelCloseForm">
									<aon:commandButton type="button"
										styleClass="aon-popupWindow-close"
										actionListener="#{controller.onHideActivityPanel}"
										immediate="true">
										<aon:actionHotKey key="esc" />
									</aon:commandButton>
								</aon:form>
							</f:facet>
							<aon:div styleClass="aon-popupWindow-content">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:form>
											<aon:commandButton id="finishFarmerFiscalModel"
												value="#{bundle.aon_accept}"
												actionListener="#{controller.onAcceptModules}"
												styleClass="aon-finding-toolbar-item aon-icon-lock"/>
										</aon:form>
									</aon:div>
								</aon:div>
								<aon:form id="finalizeForm">
									<ui:include
										src="/com/code/aon/ui/fiscal/facelet/mod303/farmer.xhtml" />
								</aon:form>
							</aon:div>
						</rich:modalPanel>
					</c:if>
				</aon:div>
			</ui:define>
		</ui:decorate>

	</ui:define>
</ui:composition>
