<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">


		<aon:if test="#{!mod347.nevv}">
	
		<aon:div styleClass="aon-margin-top">
			
			<aon:methodParam name="resetActionListener" value="#{mod347Detail.onNewExtraInfoPanel}" type="actionListener"/>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">

				<ui:param name="controller" value="#{mod347Detail}" />
				<ui:param name="skipLineEdition" value="true" />
				<ui:param name="skipEditButtons" value="true" />
				<ui:param name="skipResetButton" value="#{mod347.to.finished}" />
				<ui:param name="resetButtonReRender" value="extraInfoContainer" />
				
				
				<ui:define name="beginFormListContent">
					<aon:commandButton id="detail-select"
						immediate="true" value="&#160;"
						styleClass="aon-icon-commandButton aon-icon-rowSelector"
						style="padding:0px;margin:0px;padding-left:10px;"
						actionListener="#{mod347Detail.onShowExtraInfoPanel}"
						limitToList="true"
						reRender="extraInfoContainer"/>
				</ui:define>

				<ui:define name="columns">
					<aon:column alias="Mod347Detail.type"
						 styleClass="aon-editDataTable-textColumn aon-width-30">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_type" value="C" />
						</f:facet>
						<aon:outputText value="#{to.type.value}"/>
					</aon:column>

					<aon:column alias="Mod347Detail.document" 
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-textColumn aon-width-70">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:div style="#{!to.documentValid?'color:red':''}">
							<aon:outputText value="#{to.document}" rendered="#{to.document != null}"/>
							<aon:outputText value="#{to.operatorNif}" rendered="#{to.operatorNif != null}"/>
						</aon:div>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText value="&#160;" rendered="#{to.businessPremiseRental}" 
							style="padding-left: 15px;"
							alt="#{bundle.fiscal_model_347_business_premise_rental}"
							title="#{bundle.fiscal_model_347_business_premise_rental}"
							styleClass="aon-editDataTable-button aon-icon-home"/>
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>

					<aon:column	alias="Mod347Detail.name"
						style="font-size: 0.8em;" 
						styleClass="aon-editDataTable-textColumn aon-width-auto">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}"/>
					</aon:column>

					<aon:column alias="Mod347Detail.province" 
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_state}" />
						</f:facet>
						<aon:outputText value="#{to.province}"/>
					</aon:column>

					<aon:column alias="Mod347Detail.country"  
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_country}" />
						</f:facet>
						<aon:outputText value="#{to.country}"/>
					</aon:column>

					<aon:column	alias="Mod347Detail.amount" 
						style="font-size: 0.9em;"
						styleClass="aon-editDataTable-numberColumn aon-bold aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_amount" value="#{bundle.aon_amount}" />
						</f:facet>
						<aon:outputText value="#{to.amount}" rendered="#{formList}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column	alias="Mod347Detail.firstQuarterAmount"
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_firstQuarterAmount" value="Trim. 1" />
						</f:facet>
						<aon:outputText value="#{to.firstQuarterAmount}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
					
					<aon:column	alias="Mod347Detail.secondQuarterAmount"
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_secondQuarterAmount" value="Trim. 2" />
						</f:facet>
						<aon:outputText value="#{to.secondQuarterAmount}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
					
					<aon:column	alias="Mod347Detail.thirdQuarterAmount"
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_thirdQuarterAmount" value="Trim. 3" />
						</f:facet>
						<aon:outputText value="#{to.thirdQuarterAmount}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
					
					<aon:column	alias="Mod347Detail.fourthQuarterAmount"
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_fourthQuarterAmount" value="Trim. 4" />
						</f:facet>
						<aon:outputText value="#{to.fourthQuarterAmount}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
					
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
						<f:facet name="header">
							<aon:outputText value="C.C." />
						</f:facet>
						<aon:outputText value="X" rendered="#{to.vatAccrual}" 
							style="padding-left: 15px;"
							alt="#{bundle.fiscal_model_347_business_premise_rental}"
							title="#{bundle.fiscal_model_347_business_premise_rental}"/>
					</aon:column>
					
					<aon:column	alias="Mod347Detail.vatAccrualAmount"
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_vatAccrualAmount" value="Imp.Cr.Caja" />
						</f:facet>
						<aon:outputText value="#{to.vatAccrualAmount}" rendered="#{to.vatAccrual}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
						<f:facet name="header">
							<aon:outputText value="I.S.P." />
						</f:facet>
						<aon:outputText value="X" rendered="#{to.isp}" 
							style="padding-left: 15px;"
							alt="#{bundle.fiscal_model_347_business_premise_rental}"
							title="#{bundle.fiscal_model_347_business_premise_rental}"/>
					</aon:column>
				</ui:define>
				
			</ui:decorate>
		</aon:div>
	</aon:if>
</ui:composition>
