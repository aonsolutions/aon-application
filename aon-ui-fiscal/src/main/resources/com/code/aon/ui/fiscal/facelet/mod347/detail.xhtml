<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">


		<c:if test="#{!mod347.nevv}">
	
		<aon:div styleClass="aon-margin-top">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
				<ui:param name="controller" value="#{mod347Detail}" />
				<!-- 
				<ui:param name="skipLineEdition" value="#{mod347.to.finished}" />
				 -->
				 <ui:param name="skipLineEdition" value="true" />
				<ui:param name="skipResetButton" value="#{mod347.to.finished}" />
				
				
				<ui:define name="beginFormListContent">
					<aon:commandButton id="detail-select"
						immediate="true" value="&#160;"
						rendered="#{!mod347.to.finished}"
						styleClass="aon-icon-commandButton aon-icon-rowSelector"
						style="padding:0px;margin:0px;padding-left:10px;"
						actionListener="#{mod347Detail.onSelect}">
					</aon:commandButton>					
				</ui:define>

				<ui:define name="columns">

					<aon:column alias="Mod347Detail.type"
						 styleClass="aon-editDataTable-textColumn aon-width-30">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_type" value="C" />
						</f:facet>
						<aon:outputText value="#{to.type.value}" rendered="#{formList}"/>
						<aon:selectOneMenu id="mod347_detail_type" value="#{controller.to.type}" required="true" rendered="#{formEdit}">
							<f:selectItems value="#{fiscalCollections.mod347Types}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu id="mod347_detail_type-NEW" value="#{controller.to.type}" required="true" rendered="#{formNew}">
								<f:selectItems value="#{fiscalCollections.mod347Types}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>

					<aon:column alias="Mod347Detail.document" 
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-textColumn aon-width-70">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_document" value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.document}" rendered="#{formList}"/>
						<aon:inputText id="mod347_detail_document" value="#{controller.to.document}"
							rendered="#{formEdit}" size="9" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_document-NEW" value="#{controller.to.document}"
								rendered="#{formNew}" size="9" required="true"/>
						</f:facet>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
							<aon:commandButton id="#{dataTableId}-extraInfo" 
								title="#{bundle.fiscal_model_347_extra_info}"
								actionListener="#{mod347Detail.onShowExtraInfoPanel}"
								limitToList="true"
								reRender="extraInfoContainer"
								rendered="#{!mod347.to.finished}"
								styleClass="aon-editDataTable-button aon-icon-info"
								accesskey="#{bundle.aon_key_save_line}" />
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText value="&#160;" rendered="#{to.businessPremiseRental}" 
							style="padding-left: 15px;"
							alt="#{bundle.fiscal_model_347_business_premise_rental}"
							title="#{bundle.fiscal_model_347_business_premise_rental}"
							styleClass="aon-editDataTable-button aon-icon-home"/>
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>

					<aon:column	alias="Mod347Detail.name"
						style="font-size: 0.8em;" 
						styleClass="aon-editDataTable-textColumn aon-width-auto">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_name" value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" rendered="#{formList}"/>
						<aon:inputText id="mod347_detail_name" value="#{controller.to.name}"
							rendered="#{formEdit}" size="40" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_name-NEW" value="#{controller.to.name}"
								rendered="#{formNew}" size="40" required="true"/>
						</f:facet>
					</aon:column>

					<aon:column alias="Mod347Detail.province" 
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_province" value="#{bundle.aon_state}" />
						</f:facet>
						<aon:outputText value="#{to.province}" rendered="#{formList}"/>
						<aon:selectOneMenu id="mod347_detail_province" rendered="#{formEdit}" value="#{controller.to.province}" >
							<f:selectItem value="#{null}" itemLabel="-"/>
							<f:selectItems value="#{commonCollections.provinces}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu id="mod347_detail_province-NEW" rendered="#{formNew}" value="#{controller.to.province}" >
								<f:selectItem value="#{null}" itemLabel="-"/>
								<f:selectItems value="#{commonCollections.provinces}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>

					<aon:column alias="Mod347Detail.country"  
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_country" value="#{bundle.aon_country}" />
						</f:facet>
						<aon:outputText value="#{to.country}" rendered="#{formList}"/>
						<aon:selectOneMenu id="mod347_detail_country" rendered="#{formEdit}" value="#{controller.to.country}" >
							<f:selectItem value="#{null}" itemLabel="-"/>
							<f:selectItems value="#{commonCollections.countries}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu id="mod347_detail_country-NEW" rendered="#{formNew}" value="#{controller.to.country}" >
								<f:selectItem value="#{null}" itemLabel="-"/>
								<f:selectItems value="#{commonCollections.countries}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>

					<aon:column	alias="Mod347Detail.amount" 
						style="font-size: 0.9em;"
						styleClass="aon-editDataTable-numberColumn aon-bold aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_amount" value="#{bundle.aon_amount}" />
						</f:facet>
						<aon:outputText value="#{to.amount}" rendered="#{formList}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText id="mod347_detail_amount" value="#{controller.to.amount}"
							rendered="#{formEdit}" size="8" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_amount-NEW" value="#{controller.to.amount}"
								rendered="#{formNew}" size="8" required="true"/>
						</f:facet>
					</aon:column>

					<aon:column	alias="Mod347Detail.firstQuarterAmount"
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_firstQuarterAmount" value="Trim. 1" />
						</f:facet>
						<aon:outputText value="#{to.firstQuarterAmount}" rendered="#{formList}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText id="mod347_detail_firstQuarterAmount" value="#{controller.to.firstQuarterAmount}"
							rendered="#{formEdit}" size="8" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_firstQuarterAmount-NEW" value="#{controller.to.firstQuarterAmount}"
								rendered="#{formNew}" size="8" required="true"/>
						</f:facet>
					</aon:column>
					
					<aon:column	alias="Mod347Detail.secondQuarterAmount"
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_secondQuarterAmount" value="Trim. 2" />
						</f:facet>
						<aon:outputText value="#{to.secondQuarterAmount}" rendered="#{formList}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText id="mod347_detail_secondQuarterAmount" value="#{controller.to.secondQuarterAmount}"
							rendered="#{formEdit}" size="8" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_secondQuarterAmount-NEW" value="#{controller.to.secondQuarterAmount}"
								rendered="#{formNew}" size="8" required="true"/>
						</f:facet>
					</aon:column>
					<aon:column	alias="Mod347Detail.thirdQuarterAmount"
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_thirdQuarterAmount" value="Trim. 3" />
						</f:facet>
						<aon:outputText value="#{to.thirdQuarterAmount}" rendered="#{formList}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText id="mod347_detail_thirdQuarterAmount" value="#{controller.to.thirdQuarterAmount}"
							rendered="#{formEdit}" size="8" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_thirdQuarterAmount-NEW" value="#{controller.to.thirdQuarterAmount}"
								rendered="#{formNew}" size="8" required="true"/>
						</f:facet>
					</aon:column>
					
					<aon:column	alias="Mod347Detail.fourthQuarterAmount"
						style="font-size: 0.8em;"
						styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputLabel for="mod347_detail_fourthQuarterAmount" value="Trim. 4" />
						</f:facet>
						<aon:outputText value="#{to.fourthQuarterAmount}" rendered="#{formList}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText id="mod347_detail_fourthQuarterAmount" value="#{controller.to.fourthQuarterAmount}"
							rendered="#{formEdit}" size="8" required="true"/>
						<f:facet name="footer">
							<aon:inputText id="mod347_detail_fourthQuarterAmount-NEW" value="#{controller.to.fourthQuarterAmount}"
								rendered="#{formNew}" size="8" required="true"/>
						</f:facet>
					</aon:column>

					
				</ui:define>
			</ui:decorate>
		</aon:div>
	</c:if>
</ui:composition>
