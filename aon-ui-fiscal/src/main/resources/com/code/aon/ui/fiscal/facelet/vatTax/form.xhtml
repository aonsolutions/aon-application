<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="vatTaxForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.fiscal_vat_tax_module2}" />
				<ui:param name="controller" value="#{vatTax}" />
				<ui:param name="skipRemoveButton" value="#{vatTax.to.finished}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="#{toolbarID}-finish"
						value="#{bundle.aon_finalice}"
						actionListener="#{vatTax.onFinish}"
						rendered="#{!vatTax.nevv and !vatTax.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-lock"
						onclick="if (!confirm('#{bundle.aon_finalice}?')) return false;"/>
					<aon:commandButton id="#{toolbarID}-reopen"
						value="#{bundle.fiscal_reopen}"
						actionListener="#{vatTax.onReopen}"
						rendered="#{!vatTax.nevv and vatTax.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-unlock"
						onclick="if (!confirm('#{bundle.fiscal_reopen}?')) return false;"/>

					<aon:commandButton id="#{toolbarID}-recalculate"
						value="#{bundle.fiscal_recalculate}"
						actionListener="#{vatTax.onRecalculate}"
						accesskey="W" title="ALT+W [+May]" 
						rendered="#{!vatTax.nevv and !vatTax.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh" />

					<aon:htmlCommandLink id="#{toolbarID}-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="vatTaxReport" />
					</aon:htmlCommandLink>
					
				</ui:define>
			</ui:decorate>

			<aon:div style="color:red; font-size: 1.2em; padding: 5px; text-align:center; border: solid red 1px; margin-bottom: 5px; margin-top: 5px; font-weight: bold;">
				<aon:div>
					<aon:outputLabel value="A partir del ejercicio 2018, utilice el nuevo módulo de IVA" />
				</aon:div>
				<aon:div>
					<aon:outputLabel value="Los datos introducidos en este programa, no se tendrán en cuenta" />
				</aon:div>
			</aon:div>

			<aon:div id="vatTaxContainer" styleClass="aon-scroll-area">

				<aon:panelGrid id="menuGrid" columns="10" dir="true" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-70
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-100
								  ,aon-panelGrid-odd aon-width-70
								  ,aon-panelGrid-even aon-width-70
								  ,aon-panelGrid-odd aon-width-70
								  ,aon-panelGrid-even aon-width-100
								  ,aon-panelGrid-even aon-width-100
								  ,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="VatTax_year" value="#{bundle.aon_year}" />
					<aon:inputText id="VatTax_year" size="5" value="#{vatTax.to.year}"
						required="true" disabled="#{vatTax.to.finished or vatTax.detailNew}"/>

					<aon:outputLabel for="VatTax_period"
						value="#{bundle.finance_vat_period}" />
					<aon:selectOneMenu id="VatTax_period" value="#{vatTax.to.period}"
						required="true" disabled="#{vatTax.to.finished or vatTax.detailNew}">
						<f:selectItems value="#{fiscalCollections.periods}" />
						<a4j:support event="onchange" 
							rendered="#{vatTax.nevv}"
							actionListener="#{vatTax.onChangePeriod}"
							reRender="VatTax_prorata,lastPeriodDiv"
						/>
					</aon:selectOneMenu>

					<aon:outputLabel for="VatTax_prorata" value="#{bundle.aon_prorata_percent}" />
					<aon:inputText id="VatTax_prorata" size="5" value="#{vatTax.to.prorata}"
						required="true" disabled="#{vatTax.to.finished or vatTax.detailNew}"/>

					<aon:outputText value="#{bundle.aon_status}" />
					<aon:div styleClass="#{vatTax.to.finished?'aon-icon-lock':'aon-icon-unlock'}"
						style="padding-left: 16px;">
						<aon:outputText value="#{vatTax.to.status}" />
					</aon:div>
					

					<aon:div>
						<aon:if test="#{aonRole.confidentiality}">
							<aon:selectBooleanCheckbox id="VatTax_securityLevel" disabled="#{vatTax.detailNew}"
								value="#{vatTax.to.confidential}" rendered="#{!vatTax.to.finished}"/>
							<aon:outputLabel for="VatTax_securityLevel" styleClass="aon-italic"
								value="#{bundle.aon_confidential}" rendered="#{!vatTax.to.finished}"/>
							<aon:outputText styleClass="aon-icon aon-icon-confidential"
								value="&#160;" title="#{bundle.aon_confidential}"
								rendered="#{vatTax.to.finished and vatTax.to.confidential}" />
						</aon:if>
					</aon:div>

					<aon:div id="adjustContainer" styleClass="aon-text-center">
						<aon:div rendered="#{!vatTax.params.mod303AvailableByDifferenceDisabled}">
							<aon:div>
								<aon:outputText
									value="#{bundle.fiscal_tax_provious_adjust}"
									style="color:red" 
									rendered="#{vatTax.anyPreviousAdjust}" />
							</aon:div>
								
							<aon:div>
								<aon:commandLink
									onmouseover="this.style.textDecoration='underline';"
									onmouseout="this.style.textDecoration='inherit';"
									actionListener="#{vatTax.onAdjustCopy}"
									onclick="if (!confirm('#{bundle.fiscal_adjust_copy}')) return false;"
									rendered="#{!vatTax.to.finished and vatTax.anyPreviousAdjust}">
									<aon:outputText value="#{bundle.fiscal_copy} "/>								
									<aon:outputText value="#{vatTax.previousPeriod}"/>
								</aon:commandLink>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:panelGrid>
				
				<aon:panelGrid columns="3" style="width: 100%;" styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-80
								,aon-panelGrid-even aon-width-500
								,aon-panelGrid-even aon-width-auto">
					
					<aon:outputLabel for="VatTax_comments" value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="VatTax_comments" cols="50" rows="2" value="#{vatTax.to.comments}"
						disabled="#{vatTax.detailNew}"/>

					<aon:div>
						<aon:div id="VatTax_replacement_box">
<!-- 						
							<aon:selectBooleanCheckbox id="VatTax_replacement"
								disabled="#{vatTax.to.finished or vatTax.detailNew or vatTax.to.complementary}"
								reRender="VatTax_replacement_box"
								ajaxSingle="true"
								value="#{vatTax.to.replacement}"/>
							<aon:outputLabel for="VatTax_replacement" styleClass="aon-italic"
								value="#{bundle.aon_replacement}" />
 -->
							<aon:selectBooleanCheckbox id="VatTax_complementary"
								disabled="#{vatTax.to.finished or vatTax.detailNew}"
								reRender="VatTax_replacement_box"
								ajaxSingle="true"
								value="#{vatTax.to.complementary}"/>
							<aon:outputLabel for="VatTax_complementary" styleClass="aon-italic"
								value="Complementaria" />

							<aon:panelGroup rendered="#{vatTax.to.complementary}" styleClass="aon-italic aon-margin-left">		
								<aon:outputLabel for="VatTax_number" styleClass="aon-margin-left aon-margin-right" 
									value="Número justificante anterior: " />
								<aon:inputText id="VatTax_number" size="13" maxlength="13" value="#{vatTax.to.replacedNumber}"
									required="true" 
									disabled="#{vatTax.to.finished or vatTax.detailNew}"/>
							</aon:panelGroup>
						</aon:div>

						<aon:div>
							<aon:selectBooleanCheckbox id="VatTax_tax_refund_registry"
								disabled="#{vatTax.to.finished or vatTax.detailNew}"
								value="#{vatTax.to.taxRefundRegistry}"/>
							<aon:outputLabel for="VatTax_tax_refund_registry" styleClass="aon-italic"
								value="#{bundle.fiscal_tax_refund_registry}" />
						</aon:div>
					</aon:div>
				</aon:panelGrid>
				
				<aon:if test="#{vatTax.nevv}">
					<aon:div id="lastPeriodDiv">
						<aon:div rendered="#{vatTax.to.year >= 2015 and vatTax.lastPeriod}"
							style="margin-top: 5px; margin-bottom: 5px; border: solid red 1px; padding: 10px;">
							<aon:outputText style="color: red; font-weight: bold;" value="AVISO:&#160;" />
							<aon:outputText style="color: red;" 
								value="Si se encuentra acogido al régimen especial del criterio de caja y/o es destinatario de operaciones afectadas por el mismo, se tendrán en cuenta las facturas con vencimientos pendientes del ejercicio #{vatTax.to.year - 1}" />
						</aon:div>
					</aon:div>

					<aon:div styleClass="aon-panelGrid-search">
						<aon:div styleClass="aon-panelGrid-search-info">
							<aon:outputText value="#{bundle.fiscal_vat_tax_import_info}" 
									styleClass="aon-panelGrid-search-info-internal"/>
						</aon:div>
						
						<aon:panelGrid id="searchContentID" columns="2">
							<aon:outputText value="&#160;" />
							<aon:div>
								<aon:selectBooleanCheckbox id="vatTax_scoredInvoices" value="#{vatTax.scoredInvoices}"/>
								<aon:outputLabel for="vatTax_scoredInvoices" value="#{bundle.fiscal_vatTax_scored_invoices}" />
							</aon:div>
						</aon:panelGrid>
					</aon:div>
				</aon:if>

				<aon:if test="#{!vatTax.nevv}">
					<aon:panelTabSet selectedTab="#{vatTax.selectedTab}">
						<aon:panelTab id="detailTab" label="LIQUIDACION">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/vatTax/detail.xhtml" />
						</aon:panelTab>

						<aon:panelTab id="payTab" label="RESULTADO" rendered="#{vatTax.to.finished}">
							<aon:if test="#{!vatTaxDeclaration.nevv and vatTaxDeclaration.to == null}">
								<ui:include src="/com/code/aon/ui/fiscal/facelet/vatTax/declaration_list.xhtml" />
							</aon:if>
							<aon:if test="#{vatTaxDeclaration.nevv or vatTaxDeclaration.to != null}">
								<ui:include src="/com/code/aon/ui/fiscal/facelet/vatTax/declaration_form.xhtml" />
							</aon:if>
						</aon:panelTab>
					</aon:panelTabSet>
				</aon:if>
				
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/fiscal/facelet/vatTax/additionalInfo.xhtml" />
	</ui:define>
</ui:composition>
