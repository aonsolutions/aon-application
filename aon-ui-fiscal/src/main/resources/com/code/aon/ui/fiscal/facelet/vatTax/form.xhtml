<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="vatTaxForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{fiscalBundle.fiscal_vat_tax_module}" />
				<ui:param name="controller" value="#{vatTax}" />
				<ui:param name="skipRemoveButton" value="#{vatTax.to.finished}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="#{toolbarID}-finish"
						value="#{fiscalBundle.fiscal_finish}"
						actionListener="#{vatTax.onFinish}"
						rendered="#{!vatTax.new and !vatTax.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-lock"
						onclick="if (!confirm('#{fiscalBundle.fiscal_finish}?')) return false;"/>
					<aon:commandButton id="#{toolbarID}-reopen"
						value="#{fiscalBundle.fiscal_reopen}"
						actionListener="#{vatTax.onReopen}"
						rendered="#{!vatTax.new and vatTax.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-unlock"
						onclick="if (!confirm('#{fiscalBundle.fiscal_reopen}?')) return false;"/>

					<aon:commandButton id="#{toolbarID}-recalculate"
						value="#{fiscalBundle.fiscal_recalculate}"
						actionListener="#{vatTax.onRecalculate}"
						accesskey="W" title="ALT+W [+May]" 
						rendered="#{!vatTax.new and !vatTax.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh" />

					<aon:htmlCommandLink id="#{toolbarID}-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="vatTaxReport" />
					</aon:htmlCommandLink>
					
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="menuGrid" columns="7" dir="true" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-100
								  ,aon-panelGrid-even aon-width-80
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-100
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-100
								  ,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="VatTax_year" value="#{bundle.aon_year}" />
					<aon:inputText id="VatTax_year" size="5" value="#{vatTax.to.year}"
						required="true" disabled="#{vatTax.to.finished}"/>

					<aon:outputLabel for="VatTax_period"
						value="#{financeBundle.finance_vat_period}" />
					<aon:selectOneMenu id="VatTax_period" value="#{vatTax.to.period}"
						required="true" disabled="#{vatTax.to.finished}">
						<f:selectItems value="#{fiscalCollections.periods}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{bundle.aon_status}" />
					<aon:div styleClass="#{vatTax.to.finished?'aon-icon-lock':'aon-icon-unlock'}"
						style="padding-left: 16px;">
						<aon:outputText value="#{vatTax.to.status}" />
					</aon:div>
					

					<c:if test="#{aonRole.confidentiality}">
						<aon:div>
							<aon:selectBooleanCheckbox id="VatTax_securityLevel"
								value="#{vatTax.to.confidential}" rendered="#{!vatTax.to.finished}"/>
							<aon:outputLabel for="VatTax_securityLevel" styleClass="aon-italic"
								value="#{bundle.aon_confidential}" rendered="#{!vatTax.to.finished}"/>
							<aon:outputText styleClass="aon-icon aon-icon-confidential"
								value="&#160;" title="#{bundle.aon_confidential}"
								rendered="#{vatTax.to.finished and vatTax.to.confidential}" />
						</aon:div>
					</c:if>
				</aon:panelGrid>
				
				<aon:panelGrid columns="3" style="width: 100%;" styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-100
								,aon-panelGrid-even aon-width-500
								,aon-panelGrid-even aon-width-auto">
					
					<aon:outputLabel for="VatTax_comments" value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="VatTax_comments" cols="80" rows="2" value="#{vatTax.to.comments}"/>

					<aon:div>
<!-- 
						<aon:div>
							<aon:selectBooleanCheckbox id="VatTax_complementary"
								disabled="#{vatTax.to.finished}"
								value="#{vatTax.to.complementary}"/>
							<aon:outputLabel for="VatTax_complementary" styleClass="aon-italic"
								value="#{fiscalBundle.fiscal_complementary}" />
							<aon:panelGroup rendered="#{!vatTax.new and vatTax.to.complementary}" styleClass="aon-italic aon-margin-left">		
								<aon:outputText styleClass="aon-margin-left" value="#{bundle.aon_number}" />
								<aon:outputText value=":" />
								<aon:outputText styleClass="aon-margin-left" value="#{vatTax.to.number}" />
							</aon:panelGroup>
						</aon:div>
 -->					
						<aon:div>
							<aon:selectBooleanCheckbox id="VatTax_replacement"
								disabled="#{vatTax.to.finished}"
								value="#{vatTax.to.replacement}"/>
							<aon:outputLabel for="VatTax_replacement" styleClass="aon-italic"
								value="#{fiscalBundle.fiscal_replacement}" />
							<aon:panelGroup rendered="#{!vatTax.new and vatTax.to.replacement}" styleClass="aon-italic aon-margin-left">		
								<aon:outputText styleClass="aon-margin-left" value="#{bundle.aon_number}" />
								<aon:outputText value=":" />
								<aon:outputText styleClass="aon-margin-left" value="#{vatTax.to.number}" />
							</aon:panelGroup>
						</aon:div>

						<aon:div>
							<aon:selectBooleanCheckbox id="VatTax_tax_refund_registry"
								disabled="#{vatTax.to.finished}"
								value="#{vatTax.to.taxRefundRegistry}"/>
							<aon:outputLabel for="VatTax_tax_refund_registry" styleClass="aon-italic"
								value="#{fiscalBundle.fiscal_tax_refund_registry}" />
						</aon:div>
					</aon:div>
				</aon:panelGrid>
				
				<c:if test="#{!vatTax.new}">
					<aon:panelTabSet selectedTab="#{vatTax.selectedTab}">
						<aon:panelTab id="detailTab" label="LIQUIDACION">
							<ui:include src="/com/code/aon/ui/fiscal/facelet/vatTax/detail.xhtml" />
						</aon:panelTab>

						<aon:panelTab id="payTab" label="RESULTADO" rendered="#{vatTax.to.finished}">
							<c:if test="#{!vatTaxDeclaration.new and vatTaxDeclaration.to == null}">
								<ui:include src="/com/code/aon/ui/fiscal/facelet/vatTax/declaration_list.xhtml" />
							</c:if>
							<c:if test="#{vatTaxDeclaration.new or vatTaxDeclaration.to != null}">
								<ui:include src="/com/code/aon/ui/fiscal/facelet/vatTax/declaration_form.xhtml" />
							</c:if>
						</aon:panelTab>
					</aon:panelTabSet>
				</c:if>
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
