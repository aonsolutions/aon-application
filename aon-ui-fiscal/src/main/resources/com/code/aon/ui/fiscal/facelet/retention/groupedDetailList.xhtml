<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.fiscal_retention_report_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				

				<ui:define name="toolbarActions">
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-back" 
						value="#{bundle.aon_back}"
						action="retention_report_detail" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						accesskey="#{bundle.aon_key_cancel}" />	
					<aon:htmlCommandLink id="retentionBook-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="retentionBookGrouped" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>							
					<aon:htmlCommandLink id="retentionBook-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="retentionBookGrouped" />
					</aon:htmlCommandLink>		
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				<aon:dataTable id="retentionReportList" value="#{retentionReport.groupedModel}"
					rows="20" var="to" rendered="#{retentionReport.groupedModel.rowCount > 0}">
					
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.document}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_taxable_base}" />
						</f:facet>
						<aon:outputText value="#{to.base}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
						<f:facet name="header">
							<aon:outputText value="#{bundle.fiscal_quota}" />
						</f:facet>
						<aon:outputText value="#{to.quota}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="retentionReportList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
