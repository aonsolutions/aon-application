<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.finance_vat_report_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				

				<ui:define name="toolbarActions">
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-back" 
						value="#{bundle.aon_back}"
						action="vat_report_list" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						accesskey="#{bundle.aon_key_cancel}" />			

					<aon:htmlCommandLink id="vatBook-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="vatBook" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>							
					<aon:htmlCommandLink id="vatBook-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="vatBook" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{vatReport}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">
			
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="#{to.nature}" style="#{to.vatAccrualPayment?'color:blue;':''}"/>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_tax_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}" style="#{to.vatAccrualPayment?'color:blue;':''}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_document_number}" />
							</f:facet>
							<aon:outputText value="#{to.documentNumber}" style="#{to.vatAccrualPayment?'color:blue;':''}"/>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_invoice_number}" />
							</f:facet>
							<aon:commandLink id="vatReport-invoice"
								style="#{to.vatAccrualPayment?'color:blue;':''}" 
								immediate="#{true}"
								styleClass="aon-dataTable-link"
								actionListener="#{vatReport.onShowInvoice}"
								action="#{vatReport.getInvoiceViewer}"
								title="#{bundle.aon_go}">
								<aon:outputText value="#{to.reference}" />
							</aon:commandLink>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.invoiceDate}" style="#{to.vatAccrualPayment?'color:blue;':''}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.document}" style="#{to.vatAccrualPayment?'color:blue;':''}"/>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_name}" />
							</f:facet>
							<aon:outputText value="#{to.name}" style="#{to.vatAccrualPayment?'color:blue;':''}"/>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_taxable_base}" />
							</f:facet>
							
							<aon:outputText value="#{to.base}" style="#{to.vatAccrualPayment?'color:blue;':''}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="%" />
							</f:facet>
							<aon:outputText value="#{to.percent}" style="#{to.vatAccrualPayment?'color:blue;':''}">
								<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_vat_quota}" />
							</f:facet>
							<aon:outputText value="#{to.vatQuota}" style="#{to.vatAccrualPayment?'color:blue;':''}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_surcharge}" />
							</f:facet>
							<aon:outputText value="#{to.surcharge}" style="#{to.vatAccrualPayment?'color:blue;':''}">
								<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_surcharge_quota}" />
							</f:facet>
							<aon:outputText value="#{to.surchargeQuota}" style="#{to.vatAccrualPayment?'color:blue;':''}">
								<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.total}" style="#{to.vatAccrualPayment?'color:blue;':''}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
						
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
