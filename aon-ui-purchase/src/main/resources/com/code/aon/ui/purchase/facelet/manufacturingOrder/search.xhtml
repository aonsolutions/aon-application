<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="manufacturingOrderSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.warehouse_manufacturing_order}" />
				<ui:param name="controller" value="#{manufacturingOrder}" />
			</ui:include>
			
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{manufacturingOrder}" />
				<ui:define name="searchContent">
					<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/searchContent.xhtml" >
						<ui:param name="searchController" value="#{manufacturingOrderSearch}" />
						<ui:param name="skipSupplierLookup" value="#{true}" />
						<ui:param name="skipDocumentType" value="#{true}" />
						<ui:param name="skipEmailCommunication" value="#{true}" />
						<ui:param name="mainPanelTitle" value="#{bundle.warehouse_manufacturing_order}" />
						<ui:param name="detailPanelTitle" value="#{bundle.aon_detail}" />
					</ui:include>					
				</ui:define>
			</ui:decorate>
			
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
	</ui:define>
</ui:composition>
