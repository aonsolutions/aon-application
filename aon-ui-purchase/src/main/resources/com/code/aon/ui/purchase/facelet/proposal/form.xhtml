<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		
		<aon:form style="display:none">
			<aon:commandButton id="proposalDetailRefreshButton" reRender="proposalDetailList"
				actionListener="#{proposalDetail.onRefresh}" />
			<script type="text/javascript">
            	//<![CDATA[
					refreshProposalDetail = function(){
						#{rich:element('proposalDetailRefreshButton')}.click();	
					}
            	//]]>
			</script>
		</aon:form>
	
		<aon:form id="proposalForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.purchase_proposal_module}" />
				<ui:param name="controller" value="#{proposal}" />
				<ui:param name="skipRemoveButton" value="#{proposal.transferProcessed and !proposal.to.itemReturn}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="showTransferWindow-button"
						value="#{bundle.purchase_proposal_transfer_to}"
						reRender="showTransferWindow"
						rendered="#{proposal.transferPending}"
						actionListener="#{proposal.onShowTransferWindow}"
						immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-sincronize">
						<f:setPropertyActionListener
							target="#{proposal.showTransferWindow}"
							value="#{true}" />
					</aon:commandButton>
					<ui:include
						src="/com/code/aon/ui/common/facelet/auditable/toolbarContent.xhtml" />											
					<aon:htmlCommandLink id="purchaseProposal-report" value="#{bundle.purchase_proposal}"
						target="_new" rendered="#{!proposal.nevv and proposalDetail.model.rowCount > 0}"
						action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-noborder aon-icon-pdf">
						<f:param name="reportKey" value="purchaseProposal" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:if test="#{aonRole.purchaseOperator}">
						<aon:htmlCommandLink id="purchaseProposal_valued-report" value="#{bundle.purchase_valued_report}"
							target="_new" rendered="#{!proposal.nevv and proposalDetail.model.rowCount > 0}"
							action="#{purchaseReport.onExecute}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:setPropertyActionListener target="#{purchaseReport.valued}" value="#{true}" />
							<f:param name="reportKey" value="purchaseProposal" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
					</aon:if>
					<aon:if test="#{!proposal.nevv}">
						<ui:include
							src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />
						<aon:commandLink id="proposal-import" value="#{bundle.aon_import}"
							onclick="proposal('#{proposal.to.id}','#{proposal.to.workPlace.id}')"
							styleClass="aon-finding-toolbar-item aon-icon-import-excel-trans">
						</aon:commandLink>
						<aon:commandLink id="proposal-export" value="#{bundle.account_export}"
							onclick="proposalx('#{proposal.to.id}')"
							styleClass="aon-finding-toolbar-item aon-icon-export-excel-trans">
						</aon:commandLink>
					</aon:if>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area" id="proposalDetailList">

				<aon:panelGrid id="proposalPanel" columns="2" >
				
					<aon:outputText value="#{bundle.aon_id}" 
						rendered="#{!proposal.nevv}" />
					<aon:div rendered="#{!proposal.nevv}">
						<aon:inputText value="#{proposal.to.id}" size="5" disabled="#{true}" styleClass="aon-margin-right" />
						
						<aon:outputText value="(" rendered="#{proposal.to.itemReturn}" />
						<aon:outputText value="#{bundle.aon_return}"
							 rendered="#{proposal.to.itemReturn}" />
						<aon:outputText value=")" rendered="#{proposal.to.itemReturn}" />
						
						<aon:outputText value="#{proposal.to.transferStatus}" styleClass="aon-margin-left aon-bold" 
							rendered="#{proposal.transferProcessed or proposal.transferPending}" />
						
						<aon:commandButton id="undoTransfer" value="&#160;"
							styleClass="aon-icon-commandButton aon-icon-rubber aon-margin-left"
							title="#{bundle.purchase_proposal_transfer_undo}"  
							actionListener="#{proposal.onUndoTransfer}"
							reRender="proposalPanel"
							rendered="#{proposal.to.pending and proposal.to.transferProposal.pending and proposal.to.itemReturn}" />
						
					</aon:div>
					
					<aon:outputText value="#{bundle.aon_type}" 
						rendered="#{proposal.nevv}" />
					<aon:selectOneRadio value="#{proposal.proposalType}" 
						required="true" rendered="#{proposal.nevv}" >
						<f:selectItems value="#{proposal.proposalTypes}" />
					</aon:selectOneRadio>
						
						
					<aon:outputText value="#{bundle.purchase_issueDate}" />
					<aon:div>
						<aon:outputText value="#{proposal.to.issueDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:div styleClass="aon-margin-left" style="display:inline;" >
							<aon:outputText value="(" rendered="#{!proposal.nevv}" />
							<aon:outputText value="#{proposal.to.status}" rendered="#{!proposal.nevv}" />
							<aon:outputText value=")" rendered="#{!proposal.nevv}" />
						</aon:div>
					</aon:div>

					<aon:outputLabel for="Proposal_workPlace" 
						value="#{bundle.purchase_workplace}" />
					<aon:div>
						<aon:outputText	value="#{proposal.to.workPlace.description}" styleClass="aon-bold"
							rendered="#{!proposal.nevv}" />
						<aon:selectOneMenu id="Proposal_workPlace" 
							value="#{proposal.to.workPlace}"
							required="true" 
							rendered="#{proposal.nevv}" >
							<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
							<a4j:support event="onchange" reRender="Proposal_warehouse" ignoreDupResponses="true" ajaxSingle="true" />
							<a4j:support event="oninputchanged" reRender="Proposal_warehouse" ignoreDupResponses="true" ajaxSingle="true" />
						</aon:selectOneMenu>
					</aon:div>
			
					<aon:outputLabel for="Proposal_warehouse" 
						value="#{bundle.aon_module_warehouse}" />
					<aon:div>
						<aon:outputText	value="#{proposal.to.warehouse.name}" styleClass="aon-bold"
							rendered="#{!proposal.nevv}" />
						<aon:selectOneMenu id="Proposal_warehouse" 
							required="true" 
							value="#{proposal.to.warehouse}"
							rendered="#{proposal.nevv}" >
							<f:selectItems value="#{proposal.warehouses}" />
						</aon:selectOneMenu>
					</aon:div>	

					<aon:outputLabel for="Proposal_remarks" value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="Proposal_remarks" disabled="#{proposal.processed}"
						value="#{proposal.to.remarks}" cols="80" rows="4"  />
				
				</aon:panelGrid>
				
				<br />
				
				<aon:if test="#{!proposal.nevv}">
					<ui:include	src="/com/code/aon/ui/purchase/facelet/proposal/detail/tab_grid.xhtml">
						<ui:param name="controller" value="#{proposalDetail}" />
					</ui:include>
				</aon:if>
				
			</aon:div>
			
		</aon:form>
		
		<aon:if test="#{!proposal.nevv}">
			<aon:lookupButtonPopup lookup="#{purchaseItemLookup}" />
			<ui:include src="/com/code/aon/ui/purchase/facelet/proposal/modalTransfer.xhtml" />
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
				<ui:param name="auditableController" value="#{proposal}" />
			</ui:include>
		</aon:if>					
		
	</ui:define>
</ui:composition>
