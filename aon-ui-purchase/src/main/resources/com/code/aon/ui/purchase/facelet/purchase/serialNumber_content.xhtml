<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGrid id="serialNumberGrid" columns="2" dir="true" styleClass="aon-width-all">

		<aon:outputLabel value="#{bundle.aon_product}" />
		<aon:outputText styleClass="aon-bold"
			value="#{controller.serializableItem.product.name}" />

		<aon:if test="#{controller.serializableItem.product.lotable}">
			<aon:outputLabel for="PurchaseDetail_serialQuantity"
				value="#{bundle.aon_quantity}" />
			<aon:div>
				<aon:inputText id="PurchaseDetail_serialQuantity" 
					value="#{controller.serializableQuantity}"
					required="true" size="5" />
				<aon:if test="#{allowQuantityChange}">
					<aon:commandButton id="PurchaseDetail_serialQuantity-change"
						styleClass="aon-finding-toolbar-item aon-noborder aon-icon-drop-down"
						value="&#160;"
						actionListener="#{controller.onChangeSerialQuantity}"
						reRender="serialNumberGrid" />
				</aon:if>
			</aon:div>
		</aon:if>

		<aon:outputLabel for="PurchaseDetail_serialDate"
			value="#{controller.serializableItem.product.lotable ? bundle.aon_lot_date : bundle.aon_serial_date}" />
		<aon:selectInputDate id="PurchaseDetail_serialDate" 
			value="#{controller.serialDate}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />

		<aon:outputLabel for="PurchaseDetail_serialNumber"
			value="#{controller.serializableItem.product.lotable ? bundle.aon_lot_number : bundle.aon_serial_number}" />
		<aon:div>
			<aon:inputText id="PurchaseDetail_serialNumber"
				value="#{controller.serialNumber}" 
				size="40" maxlength="32"
				converter="aon.TrimStringConverter" />
			<aon:commandButton id="PurchaseDetail_serialNumber-add"
				styleClass="aon-finding-toolbar-item aon-search-add"
				value="&#160;"
				actionListener="#{controller.onAddSerialNumber}"
				reRender="serialNumberGrid" />
			<aon:commandButton id="PurchaseDetail_serialNumber-remove"
				styleClass="aon-finding-toolbar-item aon-search-minus"
				value="&#160;"
				actionListener="#{controller.onRemoveSerialNumber}"
				reRender="serialNumberGrid">
			</aon:commandButton>
		</aon:div>

		<aon:outputLabel for="PurchaseDetail_serialNumbers"
			value="#{bundle.aon_list}" />
		<aon:selectManyListbox id="PurchaseDetail_serialNumbers"
			style="width:280px;"
			value="#{controller.selectedBreakdown}" size="12">
			<f:selectItems value="#{controller.serialNumbers}" />
		</aon:selectManyListbox>

	</aon:panelGrid>
	
</ui:composition>
