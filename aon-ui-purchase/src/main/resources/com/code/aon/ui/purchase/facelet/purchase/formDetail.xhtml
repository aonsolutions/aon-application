<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{purchaseDetail}" />
		<ui:param name="showNote" value="false" />
		<ui:param name="showDataScroller" value="false" />
		<ui:param name="skipResetButton" value="#{!purchase.pending}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="rowSelectorReRender" value="menuExt" />
		<ui:param name="resetButtonReRender" value="menuExt" />
		<ui:param name="newCancelButtonReRender" value="menuExt" />
		<ui:param name="cancelButtonReRender" value="menuExt" />
		<ui:param name="newSaveButtonReRender" value="menuExt,Purchase_deliveryDate,Purchase_total" />
		<ui:param name="saveButtonReRender" value="menuExt,Purchase_total" />
		<ui:param name="removeButtonReRender" value="menuExt,Purchase_total" />
		<ui:param name="focusOnAdd" value="Item_id-New" />
		<ui:param name="focusOnSelect" value="Item_id" />
		<ui:define name="beginFormListContent">
			<aon:commandLink id="#{dataTableId}-selectButton"
				styleClass="aon-table-row-link" value="&#160;"
				immediate="true" ajaxSingle="true" requestDelay="100"
				rendered="#{purchase.pending}"
				actionListener="#{controller.onSelect}"
				onkeyup="#{dataTableId}KeyUp(this)"
				onfocus="#{dataTableId}SelectRow(this)"
				onblur="#{dataTableId}DeselectRow(this)"
				focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
			</aon:commandLink>
		</ui:define>
		
		<ui:define name="endFormListContent" >
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
				<ui:param name="auditableTO" value="#{to}" />
			</ui:include>
			<aon:commandButton id="purchaseDetailDeliveryDate" value="&#160;"
				styleClass="#{(to.deliveryDate != null and to.deliveryDate == purchase.to.deliveryDate) ? 
								('aon-icon-commandButton aon-icon-calendar-green') : ('aon-icon-commandButton aon-icon-calendar-red')}"
				rendered="#{to.deliveryDate != null}"
				actionListener="#{controller.onPurchaseDetailSelect}" 
				reRender="showDeliveryDateWindow">
				<rich:toolTip>
					<aon:outputText value="#{bundle.aon_delivery_date}:"
						styleClass="aon-margin-right" />
					<aon:outputText value="#{to.deliveryDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</rich:toolTip>
				<f:setPropertyActionListener target="#{controller.showDeliveryDateWindow}"
					value="#{true}" />								
			</aon:commandButton>
			<aon:commandButton id="purchaseDetailCarrier" value="&#160;"
				styleClass="#{(to.carrier != null and to.carrier.id == purchase.to.carrier.id) ? 
								('aon-icon-commandButton aon-icon-carrier') : ('aon-icon-commandButton aon-icon-carrier-error')}"
				rendered="#{to.carrier.id != null}"
				actionListener="#{controller.onPurchaseDetailSelect}" 
				reRender="showCarrierWindow">
				<rich:toolTip>
					<aon:outputText value="#{bundle.warehouse_delivery_carrier}:"
						styleClass="aon-margin-right" />
					<aon:outputText value="#{to.carrier.registry.fullName}" />
				</rich:toolTip>
				<f:setPropertyActionListener target="#{controller.showCarrierWindow}"
					value="#{true}" />								
			</aon:commandButton>
		</ui:define>		

		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel for="PurchaseDetail_line" value="#{bundle.aon_line}" />
				</f:facet>
				<aon:outputText value="#{to.line}"
					rendered="#{formList}" />
				<aon:inputText id="PurchaseDetail_line" 
					value="#{controller.to.line}" rendered="#{formEdit}"
					required="true" size="1" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText id="PurchaseDetail_line-New" 
						value="#{controller.to.line}" rendered="#{formNew}"
						required="true" size="1" maxlength="3" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="Item_id" value="#{bundle.aon_product}" />
				</f:facet>
				<aon:outputText value="#{to.description}"
					rendered="#{formList}">
					<aon:abbreviateConverter maxWidth="64" />
				</aon:outputText>
				<c:if test="#{!skipSerialNumberButton}">
					<aon:commandLink id="PurchaseDetail_serialNumber" immediate="true"
						value="&#160;" title="#{bundle.aon_to_specify} #{to.item.product.lotable ? bundle.aon_lot_number : bundle.aon_serial_number}"
						styleClass="aon-icon-version" style="margin-left: 5px; padding-right: 12px;"
						rendered="#{formList and to.item.wildCard}"
						actionListener="#{controller.onAssignSerialNumberShow}" 
						reRender="showSerialNumberWindow" ajaxSingle="true">
						<f:setPropertyActionListener target="#{controller.showSerialNumberWindow}"
							value="#{true}" />
					</aon:commandLink>
				</c:if>
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupBean" value="#{manufactureOrder ? saleItemLookup : purchaseItemLookup}" />
					<ui:param name="lookupTo" value="#{controller.to.item}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="skipSuggestText" value="#{controller.to.item != null and controller.to.item.id != null}" />
					<ui:param name="lookupInputOnFocus" value="PurchaseDetail_description" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<ui:param name="lookupDisabled" value="#{!controller.to.pending or itemLookupDisabled}" />
					<ui:param name="lookupReRender" 
						value="purchaseDetailItemEdit,purchaseDetailQuantityEdit,PurchaseDetail_price,PurchaseDetail_discount,PurchaseDetail_amount" />
					<ui:param name="lookupControllerListener" value="#{itemLookupWildCardListener}" />
					<aon:methodParam name="lookupChangeListener"
						value="#{controller.onItemChanged}" type="lookupChangeListener" />
				</ui:include>
				<aon:panelGroup id="purchaseDetailItemEdit" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formEdit}">
					<aon:inputTextarea id="PurchaseDetail_description" 
						value="#{controller.to.description}"
						rendered="#{controller.to.item != null and controller.to.item.id != null}"
						cols="60" rows="#{!controller.longDescription?1:5}"
						style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
						<f:validateLength maximum="1024" />
					</aon:inputTextarea>
					<aon:commandLink id="PurchaseDetail_description_short" immediate="true"
						value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
						styleClass="aon-icon-edit-end-simple aon-vertical-align-top" 
						style="margin-left: 5px; padding-right: 12px;"
						rendered="#{controller.longDescription and controller.to.item.product.code != null}"
						actionListener="#{controller.onShortDescription}" 
						reRender="purchaseDetailItemEdit" ajaxSingle="true" />
					<aon:commandLink id="PurchaseDetail_description_long" immediate="true"
						value="&#160;" title="#{bundle.aon_edit}"
						styleClass="aon-icon-edit-add-simple aon-vertical-align-top" 
						style="margin-left: 5px; padding-right: 12px;"
						rendered="#{!controller.longDescription and controller.to.item.product.code != null}"
						actionListener="#{controller.onLongDescription}"
						reRender="purchaseDetailItemEdit" ajaxSingle="true" />
				</aon:panelGroup>
				<f:facet name="footer">
					<aon:div>
						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
							<ui:param name="lookupBean" value="#{manufactureOrder ? saleItemLookup : purchaseItemLookup}" />
							<ui:param name="lookupTo" value="#{controller.to.item}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="skipSuggestText" value="#{controller.to.item != null and controller.to.item.id != null}" />
							<ui:param name="lookupInputOnFocus" value="PurchaseDetail_description-New" />
							<ui:param name="lookupSuffix" value="-New" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupReRender" 
								value="purchaseDetailItemNew,purchaseDetailQuantityNew,PurchaseDetail_price-New,PurchaseDetail_discount-New,
										PurchaseDetail_amount-New" />
							<ui:param name="lookupControllerListener" value="#{itemLookupWildCardListener}" />
							<aon:methodParam name="lookupChangeListener"
								value="#{controller.onItemChanged}" type="lookupChangeListener" />
						</ui:include>
						<aon:panelGroup id="purchaseDetailItemNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
							<aon:inputTextarea id="PurchaseDetail_description-New"
								value="#{controller.to.description}"
								rendered="#{controller.to.item != null and controller.to.item.id != null}"
								cols="60" rows="#{!controller.longDescription?1:5}"
								style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
							<aon:commandLink id="PurchaseDetail_description_short-New" immediate="true"
								value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
								styleClass="aon-icon-edit-end-simple aon-vertical-align-top" 
								style="margin-left: 5px; padding-right: 12px;"
								rendered="#{controller.longDescription and controller.to.item.product.code != null}"
								actionListener="#{controller.onShortDescription}" 
								reRender="purchaseDetailItemNew" ajaxSingle="true" />
							<aon:commandLink id="PurchaseDetail_description_long-New" immediate="true"
								value="&#160;" title="#{bundle.aon_edit}"
								styleClass="aon-icon-edit-add-simple aon-vertical-align-top" 
								style="margin-left: 5px; padding-right: 12px;"
								rendered="#{!controller.longDescription and controller.to.item.product.code != null}"
								actionListener="#{controller.onLongDescription}"
								reRender="purchaseDetailItemNew" ajaxSingle="true" />
							<aon:if test="#{domainSwitcher.betaDomain}">
								<aon:commandButton id="itemCompositionEdit" value="&#160;"
									title="#{bundle.aon_to_specify} #{bundle.product_composition}"
									styleClass="aon-icon-alternative aon-vertical-align-top"
									rendered="#{controller.to.item.product.composition}"
									actionListener="#{controller.onItemCompositionSelect}" 
									reRender="showItemCompositionWindow">
									<f:setPropertyActionListener target="#{controller.compositeHandler.showItemCompositionWindow}"
										value="#{true}" />								
								</aon:commandButton>
							</aon:if>
						</aon:panelGroup>
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="PurchaseDetail_quantity" value="#{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
				<aon:panelGroup id="purchaseDetailQuantityEdit" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formEdit}">
					<aon:inputText id="PurchaseDetail_quantity" 
						value="#{controller.to.quantity}" rendered="#{formEdit}"
						reRender="PurchaseDetail_pendingQuantity,PurchaseDetail_amount" 
						required="true" size="4" />
					<aon:commandLink id="PurchaseDetail_quantity-packaged"
						styleClass="aon-finding-toolbar-item aon-noborder aon-icon-package"
						value="&#160;" title="#{bundle.aon_to_specify} #{bundle.product_packaged}"
						rendered="#{controller.to.item.product.packaged}"
						actionListener="#{controller.onItemPackageShow}"
						reRender="showItemPackageWindow">
						<f:setPropertyActionListener target="#{purchaseDetail.showItemPackageWindow}"
							value="#{true}" />
					</aon:commandLink>
				</aon:panelGroup>
				<f:facet name="footer">
					<aon:panelGroup id="purchaseDetailQuantityNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
						<aon:inputText id="PurchaseDetail_quantity-New" 
							value="#{controller.to.quantity}" rendered="#{formNew}" 
							reRender="PurchaseDetail_amount-New" 
							required="true" size="4" />
						<aon:commandLink id="PurchaseDetail_quantity-packaged-New"
							styleClass="aon-finding-toolbar-item aon-noborder aon-icon-package"
							value="&#160;" title="#{bundle.aon_to_specify} #{bundle.product_packaged}"
							rendered="#{controller.to.item.product.packaged}"
							actionListener="#{controller.onItemPackageShow}"
							reRender="showItemPackageWindow">
							<f:setPropertyActionListener target="#{purchaseDetail.showItemPackageWindow}"
								value="#{true}" />
						</aon:commandLink>
						<aon:outputText id="Purchase_totalDetailQuantity" 
							value="#{purchase.totalDetailQuantity}" rendered="#{!formNew}">
							<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
						</aon:outputText>
					</aon:panelGroup>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_pending}" />
				</f:facet>
				<aon:outputText id="PurchaseDetail_pendingQuantity" 
					value="#{to.pendingQuantity}"
					rendered="#{formEdit or formList}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="PurchaseDetail_price" value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:inputText id="PurchaseDetail_price" 
					value="#{controller.to.price}" rendered="#{formEdit}" 
					reRender="PurchaseDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="PurchaseDetail_price-New" 
						value="#{controller.to.price}" rendered="#{formNew}" 
						reRender="PurchaseDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="PurchaseDetail_discount" value="#{bundle.aon_discount}" />
				</f:facet>
				<aon:outputText value="#{to.discountExpression.discountExpr}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:inputText id="PurchaseDetail_discount" 
					value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
					reRender="PurchaseDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="PurchaseDetail_discount-New" 
						value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}" 
						reRender="PurchaseDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="PurchaseDetail_amount" value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText value="#{controller.modelAmount}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:outputText id="PurchaseDetail_amount" 
					value="#{controller.amount}" rendered="#{formEdit}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:outputText id="PurchaseDetail_amount-New" 
							value="#{controller.amount}" rendered="#{formNew}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText id="Purchase_taxableBase" 
							value="#{purchase.taxableBase}" rendered="#{!formNew}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
				<f:facet name="header">
					<aon:outputLabel value="INFO" />
				</f:facet>
				<aon:commandLink id="purchaseDetailSalesLink" immediate="true"
					styleClass="aon-button-goto"
					style="padding-right: 20px;" 
					value="&#160;" title="#{bundle.aon_go}" 
					rendered="#{controller.salesSource}"
					actionListener="#{controller.onLoadSales}"
					action="sales_form"
					reRender="aonContent">
					<rich:toolTip value="#{controller.lineSalesInfo}" />
				</aon:commandLink>
				<aon:commandLink id="purchaseDetailPurchaseLink" immediate="true"
					styleClass="aon-button-goto"
					style="padding-right: 20px;" 
					value="&#160;" title="#{bundle.aon_go}" 
					rendered="#{controller.purchaseSource}"
					actionListener="#{controller.onLoadPurchase}"
					action="purchase_form"
					reRender="aonContent">
					<rich:toolTip value="#{controller.linePurchaseInfo}" />
				</aon:commandLink>
				
				<c:if test="#{!skipIncomeLink}">
					<aon:commandLink id="purchaseDetailIncomeLink" immediate="true"
						styleClass="#{controller.settled ? 'aon-icon-predetermine' : 'aon-icon-predetermine2'}"
						style="padding-right: 20px;" 
						value="&#160;" title="#{bundle.aon_go}" 
						rendered="#{!controller.pending}" 
						actionListener="#{controller.onLoadIncome}"
						action="income_form"
						reRender="aonContent">
						<rich:toolTip value="#{controller.lineStatusInfo}" direction="top-left" />
					</aon:commandLink>
				</c:if>
				<aon:commandButton id="purchaseDetailProject" value="&#160;"
					styleClass="#{(to.project != null and to.project.id == purchase.to.project.id) ? 
									('aon-icon-commandButton aon-icon-project-ok') : ('aon-icon-commandButton aon-icon-project-warn')}"
					rendered="#{to.project != null and to.project.id != null}"
					actionListener="#{controller.onPurchaseDetailProjectShow}" 
					reRender="showProjectWindow">
					<rich:toolTip value="#{projectLabel} #{to.project.name}" />
					<f:setPropertyActionListener target="#{purchase.showProjectWindow}"
						value="#{purchase.pending}" />								
					<f:setPropertyActionListener target="#{purchase.showDetailProjectWindow}"
						value="#{purchase.pending}" />								
				</aon:commandButton>
				<aon:commandLink id="purchaseDetailProposalLink" immediate="true"
					styleClass="aon-button-goto"
					style="padding-right: 20px;" 
					value="&#160;" title="#{bundle.aon_go}"
					rendered="#{to.proposalDetail!=null and to.proposalDetail.id!=null}" 
					actionListener="#{controller.onLoadProposal}"
					action="proposal_form"
					reRender="aonContent">
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250" >
						<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-120, aon-noborder aon-bold aon-text-left">
							<f:facet name="header">
								<aon:outputText value="#{bundle.offer_order_request_title}" />
							</f:facet>
							
							<aon:outputText value="#{bundle.purchase_issueDate}" />
							<aon:div>
								<aon:outputText value="#{to.proposalDetail.proposal.issueDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:div styleClass="aon-margin-left" style="display:inline;" >
									<aon:outputText value="(" />
									<aon:outputText value="#{to.proposalDetail.proposal.status}" />
									<aon:outputText value=")" />
								</aon:div>
							</aon:div>
		
							<aon:outputText value="#{bundle.purchase_workplace}" />
							<aon:outputText	value="#{to.proposalDetail.proposal.workPlace.description}"  />
							
							<aon:outputText value="#{bundle.purchase_department}" />
							<aon:outputText	value="#{to.proposalDetail.proposal.department.name}" />
						
							<aon:outputText value="#{bundle.aon_comment}" />
							<aon:outputText value="#{to.proposalDetail.proposal.remarks}"  />
							
						</aon:panelGrid>
					</rich:toolTip>
				</aon:commandLink>
				
				<aon:commandButton id="purchaseDetailCarrierPacking" value="&#160;"
					styleClass="aon-icon-commandButton aon-icon-rename"
					rendered="#{to.carrierPacking != null}"
					title="#{bundle.carrier_shipment}"
					actionListener="#{controller.onPurchaseDetailProjectShow}" 
					reRender="showShipmentWindow">
					<f:setPropertyActionListener target="#{purchase.showShipmentWindow}"
						value="#{true}" />								
				</aon:commandButton>
				
				<ui:insert name="afterInfoColumnContent"/>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
