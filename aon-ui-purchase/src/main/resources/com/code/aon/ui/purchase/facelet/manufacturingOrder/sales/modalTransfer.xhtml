<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showManufacturingOrderSalesTransferWindow">
		<aon:if test="#{manufacturingOrder.showSalesTransferWindow}">
			<rich:modalPanel id="manufacturingOrderSalesTransferModalPanel" minHeight="580"
				minWidth="760" rendered="#{manufacturingOrder.showSalesTransferWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_sales}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showManufacturingOrderSalesTransferWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{manufacturingOrder.showSalesTransferWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="manufacturingOrderSalesTransferForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="manufacturingOrderSalesTransfer-selectAll"
										value="#{bundle.aon_check_all}"
										rendered="#{manufacturingOrder.salesTransferManager.salesModel.rowCount > 0}"
										styleClass="aon-finding-toolbar-item aon-icon-checkAll"
										actionListener="#{manufacturingOrder.salesTransferManager.checkAllSales}" 
										reRender="salesData,detailDataContainer" />
									<aon:commandButton id="manufacturingOrderSalesTransfer-selectNone"
										value="#{bundle.aon_uncheck_all}"
										rendered="#{manufacturingOrder.salesTransferManager.salesModel.rowCount > 0}"
										styleClass="aon-finding-toolbar-item aon-icon-checkNone"
										actionListener="#{manufacturingOrder.salesTransferManager.checkNoneSales}" 
										reRender="salesData,detailDataContainer" />	
									<aon:commandButton id="manufacturingOrderSalesTransfer-accept"
										value="#{bundle.aon_transfer}"
										rendered="#{manufacturingOrder.salesTransferManager.salesModel.rowCount > 0}"
										reRender="showSalesTransferWindow,manufacturingOrderForm"
										actionListener="#{manufacturingOrder.onSalesTransfer}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="manufacturingOrderSalesTransferModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{manufacturingOrder.showSalesTransferWindow}"
											value="#{false}" />
										<f:setPropertyActionListener
											target="#{manufacturingOrder.salesTransferManager}"
											value="#{null}" />
									</aon:commandButton>
									<aon:commandButton id="manufacturingOrderSalesTransfer-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showManufacturingOrderSalesTransferWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{manufacturingOrder.showSalesTransferWindow}"
											value="#{false}" />
										<f:setPropertyActionListener
											target="#{manufacturingOrder.salesTransferManager}"
											value="#{null}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
								
									<aon:dataTable id="salesData" value="#{manufacturingOrder.salesTransferManager.salesModel}"
										var="to" rows="10" rendered="#{manufacturingOrder.salesTransferManager.salesModel.rowCount > 0}"
										columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
											aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-iconColumn">

										<aon:column styleClass="#{manufacturingOrder.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:selectBooleanCheckbox id="SalesCheck"
												value="#{manufacturingOrder.salesTransferManager.salesRowChecked}"
												valueChangeListener="#{manufacturingOrder.salesTransferManager.salesRowSelected}"
												reRender="detailDataContainer" ajaxSingle="true" />	
										</aon:column>
			
										<aon:column styleClass="#{manufacturingOrder.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
											</f:facet>
											<aon:outputText value="#{to.referenceCode}" />
										</aon:column>

										<aon:column styleClass="#{manufacturingOrder.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_date}" />
											</f:facet>
											<aon:outputText value="#{to.issueDate}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>

										<aon:column styleClass="#{manufacturingOrder.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<h:outputText value="#{bundle.aon_customer}" />
											</f:facet>
											<aon:outputText value="#{to.customer.registry.fullName}">
												<aon:abbreviateConverter maxWidth="50" />
											</aon:outputText>
										</aon:column>

										<aon:column styleClass="#{manufacturingOrder.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_total}" />
											</f:facet>
											<aon:outputText value="#{manufacturingOrder.salesTransferManager.salesTotalPrice}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:column>

										<aon:column styleClass="#{manufacturingOrder.salesTransferManager.selectedSalesId==to.id?'aon-highlight':''}">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:commandButton value="&#160;" immediate="true"
												title="#{bundle.warehouse_delivery_see_sales_details}"
												styleClass="aon-finding-toolbar-item aon-icon-tree-root aon-finding-toolbar-item-no-border"
												actionListener="#{manufacturingOrder.salesTransferManager.onSelectSales}"
												reRender="salesData,detailDataContainer" ajaxSingle="true">
											</aon:commandButton>															
										</aon:column>
									</aon:dataTable>
					
									<aon:dataScroller for="salesData" showNote="true" pageSize="10"
										rowCount="#{manufacturingOrder.salesTransferManager.salesModel.rowCount}" />

									<aon:div id="detailDataContainer">
										<aon:dataTable id="detailData" value="#{manufacturingOrder.salesTransferManager.detailModel}"
											var="to" rows="0" rendered="#{manufacturingOrder.salesTransferManager.detailModel.rowCount > 0}"
											columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
												aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, 
												aon-editDataTable-numberColumn, aon-editDataTable-numberColumn">
	
											<aon:column>
												<f:facet name="header">
													<aon:outputText value="&#160;" />
												</f:facet>
												<aon:selectBooleanCheckbox id="DetailCheck"
													value="#{manufacturingOrder.salesTransferManager.detailRowChecked}"
													disabled="#{!to.item.product.manufactured}"
													valueChangeListener="#{manufacturingOrder.salesTransferManager.detailRowSelected}"
													reRender="salesData,transfered" ajaxSingle="true" />	
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_product}" />
												</f:facet>
												<aon:outputText value="#{to.description}">
													<aon:abbreviateConverter maxWidth="50" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_price}" />
												</f:facet>
												<aon:outputText value="#{(to.price)}">
													<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<aon:outputLabel value="#{bundle.aon_discount}" />
												</f:facet>
												<aon:outputText value="#{to.discountExpression.discountExpr}">
													<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_pending}" />
												</f:facet>
												<aon:outputText value="#{(to.pendingQuantity)}">
													<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
												</aon:outputText>
											</aon:column>
	
											<aon:column>
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_transfer}" />
												</f:facet>
												<aon:inputText id="transfered"
													value="#{to.transfered}" size="4"
													disabled="#{!to.item.product.manufactured}"
													valueChangeListener="#{manufacturingOrder.salesTransferManager.onTransferedChanged}"
													reRender="salesData,detailDataContainer" ajaxSingle="true" />	
											</aon:column>
	
										</aon:dataTable>
									</aon:div>
								
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
