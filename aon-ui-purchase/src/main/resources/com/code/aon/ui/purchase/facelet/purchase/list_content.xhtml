<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:column alias="Purchase.issueDate"
		styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.issueDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>
	
	<aon:column alias="Purchase.deliveryDate"
		styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_delivery_date}" />
		</f:facet>
		<aon:outputText value="#{to.deliveryDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>
	
	<aon:column alias="Purchase.series,Purchase.number"
		styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120">
		<f:facet name="header">
			<h:outputText value="#{bundle.aon_order_number}" />
		</f:facet>
		<aon:outputText value="#{to.referenceCode}" />
	</aon:column>

	<aon:if test="#{!skipSupplierColumn}">
		<aon:column alias="Purchase.supplier.registry.name"
			styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<h:outputText value="#{bundle.aon_supplier}" />
			</f:facet>
			<aon:outputText value="#{to.supplier.registry.fullName}">
				<aon:abbreviateConverter maxWidth="50" />
			</aon:outputText>
		</aon:column>
	
		<aon:column alias="Purchase.supplier.registry.document"
			styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120">
			<f:facet name="header">
				<h:outputText value="#{bundle.aon_company_document}" />
			</f:facet>
			<aon:outputText value="#{to.supplier.registry.document}" />
		</aon:column>
	</aon:if>

	<aon:if test="#{companyCollections.workPlacesCount > 1}">
		<aon:column alias="Purchase.workPlace.description" 
			styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120">
			<f:facet name="header">
				<aon:outputText value="#{bundle.purchase_workplace}" />
			</f:facet>
			<aon:outputText value="#{to.workPlace.description}" />
		</aon:column>
	</aon:if>

	<aon:if test="#{aonRole.purchaseOperator}">
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_total}" />
			</f:facet>
			<aon:outputText value="#{controller.purchaseTotalPrice}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
			<aon:if test="#{!purchaseReadOnly}">
				<f:facet name="footer">
					<aon:div id="listTotalDiv" styleClass="aon-text-right">
						<aon:commandLink id="showTotals" immediate="true" 
							styleClass="aon-dataTable-link aon-nowrap aon-bold"
							value="#{bundle.aon_total_sum}"
							rendered="#{controller.listTotal == null}"
							actionListener="#{controller.obtainListTotals}"									
							reRender="listTotalDiv" />
						<aon:outputText	styleClass="aon-bold" 
							value="#{controller.listTotal}"
							rendered="#{controller.listTotal != null}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:if>
		</aon:column>
	</aon:if>

	<aon:column alias="Purchase.status"
		styleClass="aon-editDataTable-iconColumn aon-width-20 aon-text-center">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status_abrv}" />
		</f:facet>
		<aon:outputText title="#{bundle.aon_pending}"
			styleClass="aon-text-center"
			value="-"
			rendered="#{to.pending}" />
		<aon:outputText title="#{bundle.aon_served}"
			styleClass="aon-editDataTable-button aon-icon-task-checked aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.served}" />
		<aon:outputText title="#{bundle.aon_closed}"
			styleClass="aon-editDataTable-button aon-icon-point-red aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.closed}" />
		<aon:outputText title="#{bundle.aon_blocked}"
			styleClass="aon-editDataTable-button aon-icon-lock aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.blocked}" />
		<aon:outputText title="#{bundle.finance_invoiced}"
			styleClass="aon-editDataTable-button aon-icon-check-black aon-nowrap aon-margin-left"
			value="&#160;"
			rendered="#{to.invoiced}" />
	</aon:column>

	<aon:if test="#{!skipEmailCommunicationColumn}">
		<aon:column alias="Purchase.emailCommunication"
			styleClass="aon-editDataTable-iconColumn aon-width-20">
			<f:facet name="header">
				<aon:outputText value="email" />
			</f:facet>
			<aon:div>
				<aon:outputText value="&#160;" style="padding-left: 15px;"
					styleClass="aon-icon-check" rendered="#{!to.emailCommunication}" />
				<aon:outputText value="&#160;" style="padding-left: 15px;"
					styleClass="aon-icon-checked" rendered="#{to.emailCommunication}" />
			</aon:div>
		</aon:column>
	</aon:if>

</ui:composition>
