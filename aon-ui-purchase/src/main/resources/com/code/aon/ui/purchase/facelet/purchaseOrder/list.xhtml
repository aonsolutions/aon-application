<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
    xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="proposalList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{purchaseBundle.purchase_purchaseOrder_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_listing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="purchaseOrder-back" 
						title="#{bundle.aon_key_cancel_accelerator}"
						value="#{bundle.aon_back}"
						action="purchaseOrder_grid" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:commandButton id="purchaseOrder_accept"
						title="#{bundle.aon_key_save_accelerator}"
						value="#{bundle.aon_save}" 
						action="purchasePrint_list" 
						styleClass="aon-finding-toolbar-item aon-icon-accept" >
						<aon:actionListener method="#{purchasePrint.onEditSearch}" />
						<aon:actionListener method="#{purchaseOrder.onPurchaseAccept}" />
						<aon:actionListener method="#{purchasePrint.onSearch}" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>
 
			<aon:div styleClass="aon-scroll-area">
			
				<c:forEach items="#{purchaseOrder.purchaseGroupList}" var="to" >
				
					<aon:panelCollapsible expanded="false">
					
						<f:facet name="header">
						
							<aon:div >
								<h:panelGrid columns="4" 
									columnClasses="aon-width-250, aon-width-400, aon-width-200, aon-width-200 " >
	
									<aon:outputText value="#{to.supplier.registry.fullName}" />
									<aon:div >
										<aon:outputText value="#{to.workPlace.description}" />
										<aon:outputText value=" (#{to.department.name})" />
									</aon:div>
									<aon:div >
										<aon:outputText value="#{bundle.aon_quantity}: " />
										<aon:outputText value="#{to.detailCount}" />
									</aon:div>
									<aon:div >
										<aon:outputText value="#{bundle.aon_total}: " />
										<aon:outputText value="#{to.totalAmount}" >
											<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
										</aon:outputText>
									</aon:div>
								</h:panelGrid>
							</aon:div>
	
						</f:facet>
						
						<aon:dataTable var="detail" id="purchaseOrderDataList_#{to.groupIndex}"
							value="#{to.detailList}" >
							
							<aon:column styleClass="aon-editDataTable-iconColumn aon-width-100">
								<f:facet name="header">
									<aon:div layout="none">
										<aon:commandLink id="selectButton"
											value="&#160;" style="padding-right: 16px;"
											styleClass="aon-icon-checkAll aon-vertical-align-top"
											actionListener="#{to.onCheckAll}" 
											reRender="purchaseOrderDataList_#{to.groupIndex}"/>
										<aon:commandLink id="unselectButton"
											value="&#160;" style="padding-right: 16px;"
											styleClass="aon-icon-checkNone aon-vertical-align-top"
											actionListener="#{to.onUncheckAll}" 
											reRender="purchaseOrderDataList_#{to.groupIndex}"/>
									</aon:div>
								</f:facet>
								<aon:selectBooleanCheckbox value="#{detail.checked}"
									rendered="#{to.groupIndex == detail.groupIndex}" />
							</aon:column>
							
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{productBundle.product_item}" />
								</f:facet>
								<aon:outputText value=" #{detail.proposalDetail.item.product.name}"
									rendered="#{to.groupIndex == detail.groupIndex}" />
							</aon:column>
							
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_quantity}" />
								</f:facet>
								<aon:outputText value="#{detail.proposalDetail.quantity}"
									rendered="#{to.groupIndex == detail.groupIndex}" >
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
							</aon:column>
							
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
								<f:facet name="header">
									<aon:outputLabel value="#{bundle.aon_price}" />
								</f:facet>
								<aon:outputText value="#{detail.proposalDetail.item.price}" 
									rendered="#{to.groupIndex == detail.groupIndex}" >
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:column>
							
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
								<f:facet name="header">
									<aon:outputLabel value="#{bundle.aon_total}" />
								</f:facet>
								<aon:outputText value="#{detail.proposalDetail.quantity * detail.proposalDetail.item.price}" 
									rendered="#{to.groupIndex == detail.groupIndex}" >
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:column>
							
						</aon:dataTable>
						
					</aon:panelCollapsible>
				
				</c:forEach>
			
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
