<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="manufacturingOrderForm">
			
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{bundle.warehouse_manufacturing_order}" />
					<ui:param name="controller" value="#{manufacturingOrder}" />
					<ui:param name="showMoreMenu" value="#{!manufacturingOrder.nevv and !purchaseReadOnly and (aonRole.warehouseOperator or aonRole.financeOperator)}" />
					
					<ui:define name="beforeSpinToolbarContent">
						<aon:htmlCommandLink id="manufacturingOrder-report" value="#{bundle.aon_form}"
							target="_new" rendered="#{!manufacturingOrder.nevv and manufacturingOrderDetail.model.rowCount > 0}"
							action="#{report.onExecute}"
							disabled="#{manufacturingOrderDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="manufacturingOrder" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
					</ui:define>
					<ui:define name="moreMenuContent">
						<aon:menuItem id="salesTransfer"
							value="#{bundle.sales_module}"
							immediate="#{true}" rendered="#{manufacturingOrder.pending}"
							iconClass="aon-icon-sincronize"
							actionListener="#{manufacturingOrder.onSalesTransferShow}"
							reRender="showManufacturingOrderSalesTransferWindow">
							<f:setPropertyActionListener target="#{manufacturingOrder.showSalesTransferWindow}"
								value="#{true}" />
						</aon:menuItem>
						<rich:menuSeparator id="actionMenuSeparator" />
						<aon:menuItem id="comments"
							value="#{bundle.aon_comment}"
							iconClass="aon-icon-comments"
							reRender="showCommentsWindow">
							<f:setPropertyActionListener target="#{manufacturingOrder.showCommentsWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:menuItem id="remarks"
							value="#{bundle.aon_remark}"
							iconClass="aon-icon-notes"
							reRender="showRemarksWindow">
							<f:setPropertyActionListener target="#{manufacturingOrder.showRemarksWindow}"
								value="#{true}" />							
						</aon:menuItem>
						<ui:include
							src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />
					</ui:define>
					
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" style="width: 100%;"
					styleClass="aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div id="purchaseStatusDiv" >
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
						
							<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
								<ui:param name="controller" value="#{manufacturingOrder}" />
								<ui:param name="seriesChangedReRender" value="Purchase_securityLevel" />
								<ui:param name="skipSeriesLabel" value="#{true}" />
							</ui:include>
							<aon:div>
								<aon:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Purchase_securityLevel"
										value="#{manufacturingOrder.to.confidential}"
										rendered="#{manufacturingOrder.pending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{manufacturingOrder.pending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{!manufacturingOrder.pending and manufacturingOrder.to.confidential}" />
								</aon:if>
								
								<aon:outputText styleClass="aon-margin-left aon-margin-right"
									value="#{manufacturingOrder.to.status}" />
								<aon:outputText styleClass="aon-italic aon-margin-left"
									value="(#{bundle.finance_invoice}: "
									rendered="#{manufacturingOrder.invoiced}" />
								<aon:outputText styleClass="aon-bold"
									value="#{manufacturingOrder.invoiceCode}"
									rendered="#{manufacturingOrder.invoiced}" />
								<aon:outputText styleClass="aon-italic" value=")"
									rendered="#{manufacturingOrder.invoiced}" />
								<aon:commandLink id="invoice_link" immediate="true"
									styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
									value="&#160;" title="#{bundle.aon_go}"
									rendered="#{manufacturingOrder.invoiced}"
									actionListener="#{manufacturingOrder.onLoadInvoice}"
									action="purchaseInvoice_form" />

								<aon:commandButton id="toPending" value="&#160;"
									actionListener="#{manufacturingOrder.onPending}" 
									title="#{bundle.sales_to_pending}"
									immediate="true" rendered="#{manufacturingOrder.closed}"
									styleClass="aon-icon-commandButton aon-icon-refresh aon-margin-left" />
									
								<aon:commandButton id="block" value="&#160;"
									actionListener="#{manufacturingOrder.onBlock}"
									title="#{bundle.sales_to_block}"
									immediate="true" rendered="#{!manufacturingOrder.nevv and manufacturingOrder.pending}"
									styleClass="aon-icon-commandButton aon-icon-lock">
								</aon:commandButton>										
								<aon:commandButton id="unblock" value="&#160;"
									actionListener="#{manufacturingOrder.onUnblock}"
									title="#{bundle.sales_to_unblock}"
									immediate="true" rendered="#{manufacturingOrder.blocked}"
									styleClass="aon-icon-commandButton aon-icon-unlock aon-margin-left">
								</aon:commandButton>										
							</aon:div>
						</h:panelGrid>
 					</aon:div>

					<aon:outputLabel for="Purchase_issueDate" 
						value="#{bundle.aon_date}" />
					<aon:div>
						<aon:selectInputDate id="Purchase_issueDate"
							value="#{manufacturingOrder.to.issueDate}" 
							required="true" disabled="#{!manufacturingOrder.pending}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="Purchase_documentType"
							styleClass="aon-margin-left aon-italic"
							rendered="#{manufacturingOrder.nevv}"
							value="#{bundle.aon_type}: " />
						<aon:outputText id="Purchase_documentType"
							rendered="#{manufacturingOrder.nevv}"
							value="#{manufacturingOrder.to.documentType}" />
						<aon:outputLabel for="Purchase_purchaseReference" 
							styleClass="aon-margin-left aon-italic"
							value="#{bundle.sales_purchase_reference}: " />
						<aon:inputText id="Purchase_purchaseReference"
							value="#{manufacturingOrder.to.purchaseReference}"
							disabled="#{!manufacturingOrder.pending}" 
							size="30" maxlength="32" />
					</aon:div>
						
					<aon:outputLabel for="Purchase_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Purchase_scope" 
						value="#{manufacturingOrder.to.scope}"
						disabled="true">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Purchase_workPlace" 
						value="#{bundle.purchase_workplace}" />
					<aon:selectOneMenu id="Purchase_workPlace" 
						value="#{manufacturingOrder.to.workPlace}"
						disabled="#{!manufacturingOrder.pending}" required="#{true}"
						valueChangeListener="#{manufacturingOrder.onWorkPlaceChanged}" 
						reRender="Purchase_scope,Purchase_warehouse">
						<c:if test="#{fn:length(companyCollections.currentUserWorkPlaces) != 1}" >
							<f:selectItem itemLabel=" - " itemValue="#{null}" />
						</c:if>						
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Purchase_warehouse" 
						value="#{bundle.aon_module_warehouse}" />
					<aon:selectOneMenu id="Purchase_warehouse"
						disabled="#{!manufacturingOrder.pending}" 
						value="#{manufacturingOrder.to.warehouse}">
						<c:if test="#{fn:length(manufacturingOrder.warehouses) != 1}" >
							<f:selectItem itemLabel=" - " itemValue="#{null}" />
						</c:if>
						<f:selectItems value="#{manufacturingOrder.warehouses}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Purchase_total" 
						value="#{bundle.aon_total}" />
					<aon:div>
						<aon:outputText id="Purchase_total" styleClass="aon-bold"
							value="#{manufacturingOrder.totalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputLabel styleClass="aon-margin-left aon-italic"
							value="(#{bundle.aon_tax_included})" />
					</aon:div>

				</aon:panelGrid>
				
				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:div rendered="#{!empty manufacturingOrder.to.comments}">
						<aon:outputLabel for="Purchase_comments"
							value="#{bundle.aon_comment}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_comment_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Purchase_comments" cols="80" rows="3"
						disabled="#{!manufacturingOrder.pending}"
						rendered="#{!empty manufacturingOrder.to.comments}"
						value="#{manufacturingOrder.to.comments}" />

					<aon:div rendered="#{!empty manufacturingOrder.to.remarks}">
						<aon:outputLabel for="Purchase_remarks"
							value="#{bundle.aon_remark}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_remark_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Purchase_remarks" cols="80" rows="3"
						disabled="#{!manufacturingOrder.pending}"
						rendered="#{!empty manufacturingOrder.to.remarks}"
						value="#{manufacturingOrder.to.remarks}" />

				</aon:panelGrid>
				
				<aon:if test="#{!manufacturingOrder.nevv}">
					<aon:panelTabSet id="manufacturingOrderPanelTab">
						<aon:panelTab label="#{bundle.aon_detail}">
							<ui:decorate template="/com/code/aon/ui/purchase/facelet/purchase/formDetail.xhtml">
								<ui:param name="purchase" value="#{manufacturingOrder}" />
								<ui:param name="purchaseDetail" value="#{manufacturingOrderDetail}" />
								<ui:param name="projectLabel" value="#{bundle.aon_project}" />
								<ui:param name="manufactureOrder" value="#{true}" />
								<ui:param name="skipSerialNumberButton" value="#{true}" />
								<ui:param name="skipIncomeLink" value="#{true}" />
								<ui:param name="itemLookupDisabled" value="#{true}" />
								<ui:param name="lookupControllerListener" value="#{manufacturingOrderDetail.productFilter}" />
								<ui:define name="afterInfoColumnContent">
									<aon:commandLink id="manufacturedIncomeLink" immediate="true"
										styleClass="aon-icon-predetermine"
										style="padding-right: 20px;" 
										value="&#160;" title="#{bundle.aon_closed}. #{bundle.aon_go}."
										rendered="#{!manufacturingOrderDetail.pending}" 
										actionListener="#{manufacturingOrderDetail.onLoadManufacturedIncome}"
										action="income_form"
										reRender="aonContent">
									</aon:commandLink>
									<aon:commandButton id="purchaseDetailCloseButton" value="&#160;"
										title="#{bundle.aon_close}"
										styleClass="aon-icon-commandButton aon-icon-point-red"
										rendered="#{!formEdit and manufacturingOrderDetail.closeableLine}"
										actionListener="#{manufacturingOrderDetail.onLineCloseShow}" 
										reRender="showLineCloseWindow">
										<f:setPropertyActionListener target="#{manufacturingOrderDetail.showLineCloseWindow}"
											value="#{true}" />								
									</aon:commandButton>
								</ui:define>
							</ui:decorate>
						</aon:panelTab>
						<aon:panelTab label="#{bundle.report_print_of} #{bundle.registry_tag_module}"
							actionListener="#{manufacturingOrder.onItemTagPrintShow}">
							<ui:decorate template="/com/code/aon/ui/product/facelet/itemTagPrint/list_content.xhtml" >
								<ui:param name="innerToolbar" value="#{true}" />
								<ui:param name="skipSearchButton" value="#{true}" />
							</ui:decorate>
						</aon:panelTab>
					</aon:panelTabSet>
				</aon:if>
				
			</aon:div>
			
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
		<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/modalSerialNumber.xhtml" >
			<ui:param name="controller" value="#{manufacturingOrderDetail}" />
		</ui:include>
		
		<ui:include src="/com/code/aon/ui/purchase/facelet/manufacturingOrder/sales/modalTransfer.xhtml" />
		
		<ui:include src="/com/code/aon/ui/purchase/facelet/manufacturingOrder/warehouse/modalTransfer.xhtml" />
		
		<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/modalRemarks.xhtml">
			<ui:param name="controller" value="#{manufacturingOrder}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/modalComments.xhtml">
			<ui:param name="controller" value="#{manufacturingOrder}" />
		</ui:include>
		
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{manufacturingOrder}" />
		</ui:include>
		
	</ui:define>
</ui:composition>
