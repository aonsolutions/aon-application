<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="currentUserScopes" default="#{configCollections.currentUserScopes}" />

	<ui:include src="/com/code/aon/ui/config/facelet/series/search.xhtml" />

	<aon:if test="#{!skipSupplierLookup}">
		<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
			<ui:param name="lookupTo" value="#{searchController.supplier}" />
			<ui:param name="skipNewButton" value="#{true}" />
		</ui:include>
	</aon:if>
	
	<ui:include src="/com/code/aon/ui/project/facelet/project/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{searchController.project}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<aon:outputLabel value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="Purchase_issueDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="Purchase_issueDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="Purchase_issueDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="Purchase_issueDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
	
	<aon:outputLabel for="Purchase_purchaseReference"
		value="#{bundle.sales_purchase_reference}" />
	<aon:inputText id="Purchase_purchaseReference"
		valueChangeListener="#{controller.addExpression}"
		size="30">
	</aon:inputText>
							
	<aon:if test="#{!skipDocumentType}">
		<aon:outputLabel for="Purchase_documentType"
			value="#{bundle.aon_type}" />
		<aon:selectOneMenu id="Purchase_documentType"
			converter="aon.EnumConverter"
			valueChangeListener="#{controller.addEqualExpression}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{purchaseCollections.documentTypes}" />
		</aon:selectOneMenu>
	</aon:if>
	
	<aon:outputLabel for="Purchase_workPlace_id"
		value="#{bundle.purchase_workplace}" />
	<aon:selectOneMenu id="Purchase_workPlace_id"
		value="#{searchController.workPlace}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
	</aon:selectOneMenu>			

	<aon:if test="#{currentUserScopes[1] != null}">
		<aon:outputLabel for="Purchase_scope_id"
			value="#{bundle.aon_scope}" />
		<aon:selectOneMenu id="Purchase_scope_id"
			value="#{configCollections.scope}"
			valueChangeListener="#{controller.addIdEqualExpression}">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{currentUserScopes}" />
		</aon:selectOneMenu>
	</aon:if>					

	<aon:if test="#{aonRole.confidentiality}">
		<aon:outputLabel for="Purchase_securityLevel"
			value="#{bundle.aon_confidential}" />
		<aon:selectOneRadio id="Purchase_securityLevel"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="1" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="0" />
		</aon:selectOneRadio>				
	</aon:if>

	<aon:outputText value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox value="#{searchController.purchaseStatuses}">
		<f:selectItems value="#{purchaseCollections.purchaseStatuses}"/>
	</aon:selectManyCheckbox>							
	
	<aon:if test="#{!skipEmailCommunication}">
		<aon:outputLabel for="Purchase_emailCommunication" 
			value="#{bundle.purchase_emailSend}" />
		<aon:selectManyCheckbox id="Purchase_emailCommunication"
			value="#{searchController.emailCommunication}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectManyCheckbox>
	</aon:if>
								

</ui:composition>
