<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="skipResetButton" value="#{true}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="skipResetButton" value="#{true}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		
		<ui:define name="columns">
		
			<aon:column styleClass="aon-editDataTable-iconColumn">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:commandLink id="ProposalDetail-selectButton"
					styleClass="aon-table-row-link" value="&#160;"
					immediate="true" ajaxSingle="true" requestDelay="100"
					rendered="#{to.pending}"
					actionListener="#{proposalDetail.onSelect}"
					onkeyup="#{dataTableId}KeyUp(this)"
					onfocus="#{dataTableId}SelectRow(this)"
					onblur="#{dataTableId}DeselectRow(this)"
					focus="#{(focusOnSelect != null)?(focusOnSelect):''}" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton
							id="ProposalDetail-resetButton" title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
							styleClass="aon-editDataTable-button aon-icon-reset"
							rendered="#{!proposal.processed}" 
							actionListener="#{proposalDetail.onReset}"
							accesskey="#{bundle.aon_key_new_line}" 
							focus="#{(focusOnAdd != null)?(focusOnAdd):''}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel for="ProposalDetail_item" value="#{productBundle.product_item}" />
				</f:facet>
				<aon:outputText value="#{to.item.product.code} - #{to.item.product.name}" rendered="#{formList}" />
				<aon:selectOneMenu id="ProposalDetail_item" rendered="#{formEdit}" 
					value="#{to.item}" required="true">
					<f:selectItem itemLabel=" - " itemValue="null" />
					<f:selectItems value="#{proposal.departmentsItems}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="ProposalDetail_item-New" rendered="#{formNew}" 
						value="#{proposalDetail.to.item}" required="true">
						<f:selectItem itemLabel=" - " itemValue="null" />
						<f:selectItems value="#{proposal.departmentsItems}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel for="ProposalDetail_quantity" value="#{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}" rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:inputText id="ProposalDetail_quantity" rendered="#{formEdit}"
					value="#{to.quantity}" required="true">
					<f:validateDoubleRange minimum="0.0" />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="ProposalDetail_quantity-New" rendered="#{formNew}"
						value="#{controller.to.quantity}" required="true">
						<f:validateDoubleRange minimum="0.0" />
					</aon:inputText>
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText value="#{to.item.price}" rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<f:facet name="footer">
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_total}" />
				</f:facet>
				<aon:outputText value="#{to.quantity * to.item.price}" rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<f:facet name="footer">
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}" />
			</aon:column>
			
		</ui:define>

	</ui:decorate>

</ui:composition>
