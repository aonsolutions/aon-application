<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showShipmentWindow">
		<aon:if test="#{purchase.showShipmentWindow}">
			<rich:modalPanel id="shipmentModalPanel" minHeight="400"
				minWidth="650" rendered="#{purchase.showShipmentWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.carrier_shipment}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showShipmentWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{purchase.showShipmentWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="shipmentForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="shipment-accept"
										value="#{purchase.shippingDataDefined?bundle.aon_save:bundle.aon_accept}"
										actionListener="#{purchase.accept}"
										reRender="showShipmentWindow, purchasePanelTab"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_save}">
										<rich:componentControl for="shipmentModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{purchase.showShipmentWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="shipment-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showShipmentWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{purchase.showShipmentWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 0em;">
									<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/formShipment.xhtml" >
										<ui:param name="displayVertically" value="#{true}" />
									</ui:include>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
