<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showTransferWindow">
		<c:if test="#{proposal.showTransferWindow}">
			<rich:modalPanel id="transferModalPanel" minHeight="220"
				minWidth="500" rendered="#{proposal.showTransferWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{purchaseBundle.purchase_proposal_transfer_to}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showTransferWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<rich:componentControl for="invoiceModalPanel"
								event="onclick" operation="hide"/>
							<f:setPropertyActionListener
								target="#{proposal.showTransferWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="invoiceForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="proposal-transfer-accept"
										value="#{bundle.aon_transfer}"
										actionListener="#{proposal.onTransfer}"
										reRender="proposalForm, showTransferWindow"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<f:setPropertyActionListener
											target="#{proposal.showTransferWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="proposal-transfer-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showTransferWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{proposal.showTransferWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 80%;">

										<aon:outputLabel for="Proposal_workPlace-destination" value="#{companyBundle.company_workplace}" />
										<aon:selectOneMenu id="Proposal_workPlace-destination" required="true" 
											value="#{proposal.destinationWorkPlace}" >
											<f:selectItem itemLabel=" - " itemValue="#{null}" />
											<f:selectItems value="#{proposal.destinationWorkPlaces}" />
											<a4j:support event="onchange" reRender="Proposal_department-destination"
												actionListener="#{proposal.onChangeDestinationWorkPlace}" 
												ignoreDupResponses="true" ajaxSingle="true" />
											<a4j:support event="oninputchanged" reRender="Proposal_department-destination" 
												actionListener="#{proposal.onChangeDestinationWorkPlace}" 
												ignoreDupResponses="true" ajaxSingle="true" />
										</aon:selectOneMenu>
							
										<aon:outputLabel for="Proposal_department-destination" value="#{companyBundle.company_department}" />
										<aon:selectOneMenu id="Proposal_department-destination" required="true"
											disabled="#{proposal.destinationDepartment!=null}"
											value="#{proposal.destinationDepartment}" >
											<f:selectItem itemLabel=" - " itemValue="#{null}" />
											<f:selectItems value="#{proposal.destinationDepartments}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
