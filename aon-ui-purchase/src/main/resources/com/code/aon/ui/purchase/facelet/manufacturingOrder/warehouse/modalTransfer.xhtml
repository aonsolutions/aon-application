<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showLineCloseWindow">
		<aon:if test="#{manufacturingOrderDetail.showLineCloseWindow}">
			<rich:modalPanel id="lineCloseModalPanel" minHeight="580"
				minWidth="760" rendered="#{manufacturingOrderDetail.showLineCloseWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_close} #{bundle.warehouse_manufacture_module}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showLineCloseWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{manufacturingOrderDetail.showLineCloseWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="lineCloseForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								
								<aon:div rendered="#{empty manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.id or 
											!manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.item.wildCard}">
									
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="manufacturingOrderDetail_close-accept"
											value="#{bundle.aon_accept}"
											reRender="showLineCloseWindow,manufacturingOrderForm"
											actionListener="#{manufacturingOrderDetail.onCloseLines}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<rich:componentControl for="lineCloseModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{manufacturingOrderDetail.showLineCloseWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="manufacturingOrderDetail_close-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showLineCloseWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{manufacturingOrderDetail.showLineCloseWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area">
								
										<aon:panelGrid columns="4" style="width: 100%; margin-bottom: 15px;"
											rendered="#{manufacturingOrderDetail.manufacturingOrderManager.detailModel.rowCount > 0}">
											<aon:outputLabel for="manufacturingOrderTransfer_number" value="#{bundle.aon_series}/#{bundle.aon_number}" />
											<aon:div id="manufacturingOrderTransfer_seriesNumberDiv">
												<aon:if test="#{(manufacturingOrderDetail.manufacturingOrderManager.seriesListLength > 0)}">
													<aon:selectOneMenu id="manufacturingOrderTransfer_number-Series" 
														value="#{manufacturingOrderDetail.manufacturingOrderManager.series}" required="#{true}"
														disabled="#{false}"
														valueChangeListener="#{manufacturingOrderDetail.manufacturingOrderManager.onSeriesChanged}"
														reRender="manufacturingOrderTransfer_number-Series,manufacturingOrderTransfer_numberDiv#{(seriesChangedReRender != null)?',':''}#{seriesChangedReRender}">
														<f:selectItems value="#{manufacturingOrderDetail.manufacturingOrderManager.seriesCodes}" />
													</aon:selectOneMenu>
												</aon:if>
												
												<aon:div id="manufacturingOrderTransfer_numberDiv"
													layout="inline" styleClass="aon-margin-left">
													<aon:if test="#{manufacturingOrderDetail.manufacturingOrderManager.numberEditable or (manufacturingOrderDetail.manufacturingOrderManager.number != 0)}">
														<aon:inputText id="manufacturingOrderTransfer_number"
															value="#{manufacturingOrderDetail.manufacturingOrderManager.number}"
															required="true" size="6" maxlength="10"
															disabled="#{!manufacturingOrderDetail.manufacturingOrderManager.numberEditable or false}"
															reRender="manufacturingOrderTransfer_number" />
													</aon:if>
													<aon:if test="#{!manufacturingOrderDetail.manufacturingOrderManager.numberEditable and (manufacturingOrderDetail.manufacturingOrderManager.number == 0)}">
														<aon:inputText id="manufacturingOrderTransfer_number"
															value=" &lt;Auto&gt;"
															size="6" maxlength="10" disabled="true" />
													</aon:if>
												</aon:div>
												<aon:commandLink styleClass="aon-icon-edit-end-simple aon-margin-right"
												 	style="margin-left: 5px; padding-right: 12px;"
													value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
													reRender="manufacturingOrderTransfer_seriesNumberDiv"
													rendered="#{manufacturingOrderDetail.manufacturingOrderManager.numberEditable}" ajaxSingle="true" >
													<aon:if test="#{true}">
														<f:setPropertyActionListener
															target="#{manufacturingOrderDetail.manufacturingOrderManager.number}" value="#{0}" />
													</aon:if>
													<f:setPropertyActionListener
														target="#{manufacturingOrderDetail.manufacturingOrderManager.numberEditable}" value="#{false}" />
												</aon:commandLink>
												<aon:commandLink styleClass="aon-icon-edit-add-simple aon-margin-right"
												 	style="margin-left: 5px; padding-right: 12px;"
													value="&#160;" title="#{bundle.aon_edit}"
													reRender="manufacturingOrderTransfer_seriesNumberDiv"
													focus="manufacturingOrderTransfer_number"
													rendered="#{!manufacturingOrderDetail.manufacturingOrderManager.numberEditable}" ajaxSingle="true" >
													<f:setPropertyActionListener
														target="#{manufacturingOrderDetail.manufacturingOrderManager.numberEditable}" value="#{true}" />
													<aon:actionListener method="#{manufacturingOrderDetail.manufacturingOrderManager.onNumberEditable}" />							
												</aon:commandLink>
											</aon:div>
						
											<aon:outputLabel for="WarehouseTransfer_issueTime" value="#{bundle.aon_date}" />
											<aon:selectInputDate id="WarehouseTransfer_issueTime"
												value="#{manufacturingOrderDetail.manufacturingOrderManager.issueTime}" required="true" 
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}"/>
										</aon:panelGrid>
										
										<aon:dataTable id="detailData" value="#{manufacturingOrderDetail.manufacturingOrderManager.detailModel}"
											var="to" rows="10" rendered="#{manufacturingOrderDetail.manufacturingOrderManager.detailModel.rowCount > 0}"
											columnClasses="aon-editDataTable-textColumn, aon-editDataTable-numberColumn, 
												aon-editDataTable-numberColumn, aon-editDataTable-iconColumn, aon-editDataTable-iconColumn">
	
											<aon:column styleClass="#{manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.id==to.detail.id?'aon-highlight':''}">
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_product}" />
												</f:facet>
												<aon:outputText value="#{to.detail.description}" />
											</aon:column>
											
											<aon:column styleClass="#{manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.id==to.detail.id?'aon-highlight':''}">
												<f:facet name="header">
													<h:outputText value="#{bundle.aon_pending}" />
												</f:facet>
												<aon:outputText value="#{to.detail.pendingQuantity}">
													<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
												</aon:outputText>
											</aon:column>
											
											<aon:column styleClass="#{manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.id==to.detail.id?'aon-highlight':''}">
												<f:facet name="header">
													<aon:outputLabel for="detailData_total" value="#{bundle.aon_total}" />
												</f:facet>
												<aon:inputText id="detailData_total" value="#{to.totalQuantity}" size="5"
													disabled="#{!manufacturingOrderDetail.closeableTransfer}">
													<f:validateDoubleRange minimum="0.0" />
													<a4j:support event="onblur" ajaxSingle="true"
														reRender="detailData, compositeDataContainer" 
														actionListener="#{manufacturingOrderDetail.onChangeDetailProductQuantity}"
														 />
												</aon:inputText>
											</aon:column>
											
											<aon:column styleClass="#{manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.id==to.detail.id?'aon-highlight':''}">
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_finalice}" title="#{bundle.aon_finalice}" >
														<aon:abbreviateConverter maxWidth="6" />
													</aon:outputText>
												</f:facet>
												<aon:div rendered="#{manufacturingOrderDetail.manufacturingOrderManager.transferedLessThanPending}">
													<aon:commandButton value="&#160;" immediate="true"
														title="#{bundle.aon_finalice}"
														rendered="#{!manufacturingOrderDetail.manufacturingOrderManager.forceCloseRowChecked}"
														styleClass="aon-finding-toolbar-item aon-icon-checked aon-finding-toolbar-item-no-border"
														actionListener="#{manufacturingOrderDetail.manufacturingOrderManager.forceCloseRowSelected}"
														reRender="detailData,compositeDataContainer" ajaxSingle="true">
													</aon:commandButton>															
													<aon:commandButton value="&#160;" immediate="true"
														title="#{bundle.aon_no} #{bundle.aon_finalice}"
														rendered="#{manufacturingOrderDetail.manufacturingOrderManager.forceCloseRowChecked}"
														styleClass="aon-finding-toolbar-item aon-icon-check aon-finding-toolbar-item-no-border"
														actionListener="#{manufacturingOrderDetail.manufacturingOrderManager.forceCloseRowSelected}"
														reRender="detailData,compositeDataContainer" ajaxSingle="true">
													</aon:commandButton>															
												</aon:div>
												<aon:commandButton value="&#160;" immediate="true"
													title="#{bundle.aon_to_specify} #{to.detail.item.product.lotable ? bundle.aon_lot_number : bundle.aon_serial_number}"
													rendered="#{!manufacturingOrderDetail.closeableTransfer and to.detail.item.wildCard}"
													styleClass="aon-finding-toolbar-item aon-icon-version aon-finding-toolbar-item-no-border"
													actionListener="#{manufacturingOrderDetail.onSelectCloseDetail}"
													reRender="lineCloseForm, detailData, compositeDataContainer" ajaxSingle="true">
												</aon:commandButton>
											</aon:column>
											
											<aon:column styleClass="#{manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.id==to.detail.id?'aon-highlight':''}">
												<f:facet name="header">
													<aon:outputText value="&#160;" />
												</f:facet>
												<aon:commandButton value="&#160;" immediate="true"
													title="#{bundle.aon_see}"
													rendered="#{manufacturingOrderDetail.closeableTransfer}"
													styleClass="aon-finding-toolbar-item aon-icon-tree-root aon-finding-toolbar-item-no-border"
													actionListener="#{manufacturingOrderDetail.onSelectCloseDetail}"
													reRender="lineCloseForm, detailData, compositeDataContainer" ajaxSingle="true">
												</aon:commandButton>
												<aon:outputText value="&#160;"
													rendered="#{!manufacturingOrderDetail.closeableTransfer}"
													styleClass="aon-finding-toolbar-item aon-icon-errorwarning aon-finding-toolbar-item-no-border" />															
											</aon:column>
										</aon:dataTable>
					
										<aon:dataScroller for="detailData" showNote="true" pageSize="10"
											rowCount="#{manufacturingOrderDetail.manufacturingOrderManager.detailModel.rowCount}" />

										<rich:spacer />
											
										<aon:panel id="compositeDataContainer"
											rendered="#{!manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.item.wildCard and
												not empty manufacturingOrderDetail.manufacturingOrderManager.selectedDetail}">
											<f:facet name="header">
												<aon:outputText value="#{bundle.product_composition}" />
											</f:facet>
											
											<aon:dataTable id="compositeData" value="#{manufacturingOrderDetail.manufacturingOrderManager.compositeModel}"
												var="to" rows="0" rendered="#{manufacturingOrderDetail.manufacturingOrderManager.compositeModel.rowCount > 0}"
												columnClasses="aon-editDataTable-textColumn, aon-editDataTable-numberColumn, 
													aon-editDataTable-numberColumn, aon-editDataTable-iconColumn">
												
												<aon:column>
													<f:facet name="header">
														<h:outputText value="#{bundle.aon_product}" />
													</f:facet>
													<aon:outputText value="#{to.composition.description}">
														<aon:abbreviateConverter maxWidth="50" />
													</aon:outputText>
												</aon:column>
												
												<aon:column>
													<f:facet name="header">
														<h:outputText value="#{bundle.aon_quantity}" />
													</f:facet>
													<aon:outputText value="#{(manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.totalQuantity)*(to.composition.quantity)}">
														<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
													</aon:outputText>
												</aon:column>
												
												<aon:column>
													<f:facet name="header">
														<aon:outputLabel for="compositeData_total" value="#{bundle.aon_total}" />
													</f:facet>
													<aon:div>
														<aon:inputText id="compositeData_total" value="#{to.totalQuantity}" size="5" >
															<f:validateDoubleRange minimum="0.0" />
															<a4j:support event="onblur" reRender="compositeDataContainer" ajaxSingle="true" />
														</aon:inputText>
													</aon:div>
												</aon:column>
												
												<aon:column>
													<f:facet name="header">
														<aon:outputText value="&#160;" />
													</f:facet>
													<aon:outputText value="&#160;"
														rendered="#{(manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.totalQuantity)*(to.composition.quantity) != to.totalQuantity}"
														styleClass="aon-finding-toolbar-item aon-icon-warning aon-finding-toolbar-item-no-border" />
												</aon:column>
												
											</aon:dataTable>
											<aon:dataScroller for="compositeData" showNote="true" pageSize="10"
												rowCount="#{manufacturingOrderDetail.manufacturingOrderManager.compositeModel.rowCount}" />
										</aon:panel>
									</aon:div>
									
								</aon:div>
									
								<aon:panel id="serialNumberDataContainer"
									rendered="#{not empty manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.id and 
										manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.item.wildCard}">
									<f:facet name="header">
										<aon:panelGroup>
											<aon:outputText value="#{bundle.aon_to_specify}" />
											<aon:outputText value="&#160;" />
											<aon:outputText value="#{manufacturingOrderDetail.manufacturingOrderManager.selectedDetail.detail.item.product.lotable ? bundle.aon_lot_number : bundle.aon_serial_number}" />
										</aon:panelGroup>
									</f:facet>
									
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="serialNumber-accept"
											value="#{bundle.aon_accept}"
											actionListener="#{manufacturingOrderDetail.onAssignSerialNumber}"
											action="purchaseForm"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
										</aon:commandButton>
										<aon:commandButton id="serialNumber-cancel"
											value="#{bundle.aon_back}"
											actionListener="#{manufacturingOrderDetail.onCancelAssignSerialNumber}"
											action="purchaseForm"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
										</aon:commandButton>
									</aon:div>
									
									<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/serialNumber_content.xhtml" >
										<ui:param name="controller" value="#{manufacturingOrderDetail}" />
									</ui:include>
									
								</aon:panel>
								
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
