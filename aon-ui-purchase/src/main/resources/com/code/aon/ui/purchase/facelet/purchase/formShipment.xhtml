<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:valueParam name="displayVertically" default="#{false}" />
	
	<aon:panelGrid columns="#{displayVertically?1:2}" 
		columnClasses="aon-noborder aon-vertical-align-top, aon-noborder aon-padding-left aon-vertical-align-top">
	
		<aon:panelGrid columns="2" style="width:600px;">
			<c:if test="#{carrierCollections.carriersCount>0}">
				<aon:outputLabel for="Purchase_carrier"
					value="#{bundle.warehouse_delivery_carrier}" />
				<aon:selectOneMenu id="Purchase_carrier" 
					value="#{purchase.to.carrier}">
					<f:selectItem itemLabel=" - " itemValue="#{null}" />
					<f:selectItems value="#{carrierCollections.carriers}" />
				</aon:selectOneMenu>
					
				<aon:outputText value="&#160;" />
				<aon:outputText value="&#160;" />
			</c:if>
				
			<aon:outputLabel for="Purchase_shippingContact"
				value="#{bundle.purchase_shipping_contact}" />
			<aon:inputText id="Purchase_shippingContact"  
				size="64" maxlength="128"
				value="#{purchase.to.shippingContact}" />
			
			<aon:outputLabel for="Purchase_shippingPeriod"
				value="#{bundle.aon_calendar_schedule}" />
			<aon:selectOneMenu id="Purchase_shippingPeriod" 
				value="#{purchase.to.shippingPeriod}">
				<f:selectItem itemLabel=" - " itemValue="#{null}" />
				<f:selectItems value="#{carrierCollections.shipmentPeriods}" />
			</aon:selectOneMenu>
		</aon:panelGrid>
		
		<aon:panel id="alternativeShippingAddressPanel" style="width:600px;">
			<f:facet name="header">
				<aon:div style="display:inline;">
					<aon:selectBooleanCheckbox id="shippingAlternativeAddressSelect" 
						value="#{purchase.shippingAlternativeAddress}" >
						<a4j:support event="onclick" 
							ajaxSingle="true"
							ignoreDumpResponses="true"
							limitToList="true"
							eventsQueue="shippingAlternativeAddress"
							reRender="alternativeShippingAddressPanel" />
					</aon:selectBooleanCheckbox>
					<aon:outputLabel for="shippingAlternativeAddressSelect" value="#{bundle.carrier_shipment_alternativeAddress}" />
				</aon:div>
			</f:facet>
			<aon:panelGrid columns="2" rendered="#{purchase.shippingAlternativeAddress}"  
				styleClass="aon-width-all">
					
				<aon:outputLabel for="Purchase_shippingAlternativeRecipient" 
					value="#{bundle.purchase_shipping_recipient}" />
				<aon:inputText id="Purchase_shippingAlternativeRecipient" 
					value="#{purchase.to.shippingAlternativeRecipient}" size="64" maxlength="64"/>
		
				<aon:outputLabel for="Purchase_shippingAlternativeAddress" value="#{bundle.aon_address}" />
				<aon:inputText id="Purchase_shippingAlternativeAddress" maxlength="128" size="80"
					value="#{purchase.to.shippingAlternativeAddress}" />
				
				<aon:outputLabel for="Purchase_shippingAlternativeAddress2" value="#{bundle.registry_address_detail}" />
				<aon:inputText id="Purchase_shippingAlternativeAddress2" maxlength="128" size="80"
					value="#{purchase.to.shippingAlternativeAddress2}" />
				
				<aon:outputLabel for="Purchase_shippingAlternativeZip" 
					value="#{bundle.aon_postal_code}" />
				<aon:inputText id="Purchase_shippingAlternativeZip" 
					value="#{purchase.to.shippingAlternativeZip}" size="16" maxlength="16"/>
					
				<aon:outputLabel for="Purchase_shippingAlternativeCity" 
					value="#{bundle.registry_city}" />
				<aon:inputText id="Purchase_shippingAlternativeCity" 
					value="#{purchase.to.shippingAlternativeCity}" size="64" maxlength="64"/>
					
				<aon:outputLabel for="Purchase_shippingAlternativePhone" 
					value="#{bundle.aon_phone}" />
				<aon:inputText id="Purchase_shippingAlternativePhone"
					value="#{purchase.to.shippingAlternativePhone}" />
			</aon:panelGrid>
		</aon:panel>
		
	</aon:panelGrid>

</ui:composition>
