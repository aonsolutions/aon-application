<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputText value="" />
	<aon:div styleClass="aon-search-content-width">
	
		<aon:panelCollapsible expanded="true" label="#{(mainPanelTitle!=null)?mainPanelTitle:(bundle.aon_invoice_sales)}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/searchBasicContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>					

		<aon:panelCollapsible expanded="false" label="#{(detailPanelTitle!=null)?detailPanelTitle:(bundle.sales_detail)}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
			
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupBean" value="#{manufactureOrder ? saleItemLookup : purchaseItemLookup}" />
					<ui:param name="lookupTo" value="#{searchController.item}" />
					<ui:param name="skipNewButton" value="#{true}" />
				</ui:include>

				<aon:outputLabel for="Purchase_lines_quantity"
					value="#{bundle.aon_quantity}" />
				<aon:inputText id="Purchase_lines_quantity"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Purchase_lines_price"
					value="#{bundle.aon_price}" />
				<aon:inputText id="Purchase_lines_price"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Purchase_lines_taxableBase"
					value="#{bundle.aon_amount}" />
				<aon:inputText id="Purchase_lines_taxableBase"
					valueChangeListener="#{controller.addExpression}" size="40" />
				
				<aon:outputLabel value="#{bundle.aon_delivery_date}" />
				<aon:div>
					<aon:outputLabel for="Purchase_lines_deliveryDate-From" 
						styleClass="aon-form-date-label aon-padding-right"
						value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Purchase_lines_deliveryDate-From"
						valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Purchase_lines_deliveryDate-To" 
						styleClass="aon-form-date-label aon-padding-right"
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Purchase_lines_deliveryDate-To"
						valueChangeListener="#{controller.addLessThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</aon:div>
												
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:if test="#{!skipSupplierLookup}">
			<aon:panelCollapsible expanded="false" label="#{bundle.finance_invoice_supplier_data}" >
				<aon:panel style="text-align:right;">
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.registry_address_module}" />
					</f:facet>
					<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
						<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml" />
					</aon:panelGrid>
				</aon:panel>
				<aon:panel style="text-align:right;">
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.aon_contacts}" />
					</f:facet>
					<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
						<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml" />
					</aon:panelGrid>
				</aon:panel>
			</aon:panelCollapsible>
		</aon:if>
		
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/searchContent.xhtml" />

	</aon:div>

</ui:composition>
