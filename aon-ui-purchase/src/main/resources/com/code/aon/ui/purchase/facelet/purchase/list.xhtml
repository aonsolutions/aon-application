<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/com/code/aon/ui/purchase/facelet/purchase/purchaseContent.xhtml">

	<ui:define name="contentEx">
		<aon:form id="purchaseList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="controller" value="#{purchase}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="purchaseList-excel-report" value="&#160;" 
						target="_new" rendered="#{!delivery.new}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="purchaseList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="purchaseList-report" value="#{bundle.aon_listing}"
						target="_new" rendered="#{!purchase.new}"
						action="#{report.onExecute}" 
						disabled="#{purchaseDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="purchaseList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="purchaseDetailledList-excel-report" value="&#160;"
						target="_new" rendered="#{!delivery.new}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="purchaseDetailledList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="purchaseDetailledList-report" value="#{bundle.aon_detailed_listing}"
						target="_new" rendered="#{!purchase.new}"
						action="#{report.onExecute}" 
						disabled="#{purchaseDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="purchaseDetailledList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{purchase}" />
					<ui:define name="columns">
					
						<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/list_content.xhtml" >
							<ui:param name="controller" value="#{purchase}" />
						</ui:include>
					
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
