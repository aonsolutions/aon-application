<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
				
	<aon:column alias="Proposal.id"
		styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_id}" />
		</f:facet>
		<aon:outputText value="#{to.id}"/>
	</aon:column>

	<aon:column alias="Proposal.issueDate"
		styleClass="aon-editDataTable-dateColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.purchase_issueDate}" />
		</f:facet>
		<aon:outputText value="#{to.issueDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Proposal.department.name" 
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.purchase_department}" />
		</f:facet>
		<aon:outputText value="#{to.department.name}" />
	</aon:column>

	<aon:column alias="Proposal.workPlace.name" 
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.purchase_workplace}" />
		</f:facet>
		<aon:outputText value="#{to.workPlace.description}" />
	</aon:column>

	<aon:column alias="Proposal.remarks" 
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_comment}" />
		</f:facet>
		<aon:outputText value="#{to.remarks}" />
	</aon:column>

	<aon:column alias="Proposal.status" 
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status}" />
		</f:facet>
		<aon:outputText value="#{to.status}" />
	</aon:column>
	
</ui:composition>
