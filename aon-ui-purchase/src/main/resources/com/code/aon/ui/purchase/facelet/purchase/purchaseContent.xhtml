<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<c:if test="#{facesContext.viewRoot.attributes['aon.richfaces.selectedMenu']=='menu_hotel'}">
			<ui:param name="purchaseReadOnly" value="#{true}" />
			<ui:param name="toolbarTitle" value="#{bundle.purchase_check_module}" />	
		</c:if>											
		
		<c:if test="#{!purchaseReadOnly}">
			<ui:param name="toolbarTitle" value="#{bundle.purchase_module2}" />
		</c:if>
		
		<aon:componentGroup
			family="javax.faces.Command"
			rendered="#{!aonRole.guest and purchaseReadOnly}"
			method="#{aonRole.renderedCommand}">
			<ui:insert name="contentEx" />
		</aon:componentGroup>
		
	</ui:define>	

</ui:composition>
