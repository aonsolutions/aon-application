<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	template="/com/code/aon/ui/purchase/facelet/purchase/purchaseContent.xhtml">

	<ui:define name="contentEx">
		<aon:form id="purchaseForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="controller" value="#{purchase}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{!purchase.pending}" />
					<ui:param name="skipRemoveButton" value="#{!purchase.pending or purchase.inIncome}" />
					<ui:param name="saveButtonReRender" value="purchaseForm" />
					<ui:param name="showMoreMenu" value="#{!purchaseReadOnly and (aonRole.warehouseOperator or aonRole.financeOperator)}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton value="&#160;" id="email"
							title="#{bundle.webmail_send_email}" ajaxSingle="true" immediate="true"
							actionListener="#{purchase.onShowEmailMessage}" reRender="showNewMessageWindow-Purchase"
							rendered="#{purchaseDetail.model.rowCount > 0 and purchaseDetail.to == null}"
							styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border">
						</aon:commandButton>									
						<aon:htmlCommandLink id="purchaseForm-report" value="#{bundle.aon_invoice_sales}"
							target="_new" rendered="#{!purchase.nevv and purchaseDetail.model.rowCount > 0}"
							action="#{purchaseReport.onExecute}"
							disabled="#{purchaseDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-noborder aon-icon-pdf">
							<f:setPropertyActionListener target="#{purchaseReport.valued}" value="#{false}" />
							<f:param name="reportKey" value="purchaseForm" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
						<aon:if test="#{aonRole.purchaseOperator and !purchaseReadOnly}">
							<aon:htmlCommandLink id="purchaseForm_valued-report" value="#{bundle.purchase_valued_report}"
								target="_new" rendered="#{!purchase.nevv and purchaseDetail.model.rowCount > 0}"
								action="#{purchaseReport.onExecute}"
								accesskey="#{bundle.aon_key_print}"
								styleClass="aon-finding-toolbar-item aon-icon-pdf">
								<f:setPropertyActionListener target="#{purchaseReport.valued}" value="#{true}" />
								<f:param name="reportKey" value="purchaseForm" />
								<f:param name="outputFormat" value="PDF" />
							</aon:htmlCommandLink>
						</aon:if>
					</ui:define>
					<ui:define name="moreMenuContent">
						<aon:if test="#{aonRole.warehouseOperator}">
							<aon:menuItem id="income"
								value="#{bundle.aon_invoice_delivery}"
								immediate="#{true}" rendered="#{purchase.pending and purchaseDetail.model.rowCount > 0}"
								iconClass="aon-icon-open-popup" 
								actionListener="#{purchase.onIncomeShow}"
								reRender="showIncomeWindow">
								<f:setPropertyActionListener target="#{purchase.showIncomeWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:if test="#{aonRole.financeOperator}">
							<aon:menuItem id="invoice"
								value="#{bundle.aon_key_invoice_description}"
								immediate="#{true}" rendered="#{purchase.pending and !purchase.inIncome and purchaseDetail.model.rowCount > 0}"
								iconClass="aon-icon-favorite"
								actionListener="#{purchase.onInvoiceShow}"
								reRender="showInvoiceWindow">
								<f:setPropertyActionListener target="#{purchase.showInvoiceWindow}"
									value="#{true}" />
							</aon:menuItem>
						</aon:if>
						<aon:menuItem id="purchaseReturnRequest"
							value="#{bundle.purchase_return_request}"
							rendered="#{!purchase.nevv and !purchase.to.itemReturn}"
							iconClass="aon-icon-alternative"
							action="purchase_form"
							actionListener="#{purchase.onReturnRequest}" 
							onclick="if (!confirm('#{bundle.aon_confirm_title}')) { return false;}" />
						<aon:menuItem id="purchaseShipment"
							value="#{bundle.carrier_shipment}"
							rendered="#{!purchase.nevv and purchase.pending}"
							iconClass="aon-icon-rename"
							reRender="showShipmentWindow">
							<f:setPropertyActionListener target="#{purchase.showShipmentWindow}"
								value="#{true}" />
						</aon:menuItem>
						<rich:menuSeparator id="actionMenuSeparator" />
						<aon:menuItem id="comments"
							value="#{bundle.aon_comment}"
							iconClass="aon-icon-comments"
							reRender="showCommentsWindow">
							<f:setPropertyActionListener target="#{purchase.showCommentsWindow}"
								value="#{true}" />							
						</aon:menuItem>		
						<aon:menuItem id="remarks"
							value="#{bundle.aon_remark}"
							iconClass="aon-icon-notes"
							reRender="showRemarksWindow">
							<f:setPropertyActionListener target="#{purchase.showRemarksWindow}"
								value="#{true}" />							
						</aon:menuItem>
						<ui:include
							src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />						
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" style="width: 100%;"
					styleClass="aon-margin-bottom"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Purchase_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div id="purchaseStatusDiv" >
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
						
							<ui:include src="/com/code/aon/ui/config/facelet/series/formContent.xhtml">
								<ui:param name="controller" value="#{purchase}" />
								<ui:param name="seriesChangedReRender" value="Purchase_securityLevel" />
								<ui:param name="skipSeriesLabel" value="#{true}" />
							</ui:include>
							<aon:div>
								<aon:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Purchase_securityLevel"
										value="#{purchase.to.confidential}"
										rendered="#{purchase.pending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{purchase.pending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{!purchase.pending and purchase.to.confidential}" />
								</aon:if>
								
								<aon:outputText id="purchase-itemReturn"
									rendered="#{purchase.to.itemReturn}"
									title="#{bundle.aon_return}"
									value="&#160;"
									styleClass="aon-icon-alternative aon-margin-left aon-padding-left aon-padding-right" />
								
								<aon:outputText id="purchase-emailCommunication"
									rendered="#{purchase.to.emailCommunication}"
									title="#{bundle.purchase_emailCommunication}"
									value="&#160;"
									styleClass="aon-icon-mailForward aon-margin-left aon-padding-left aon-padding-right" />
									
								<aon:outputText styleClass="aon-margin-left aon-margin-right"
									value="#{purchase.to.status}" />
								<aon:outputText styleClass="aon-italic aon-margin-left"
									value="(#{bundle.finance_invoice}: "
									rendered="#{purchase.invoiced}" />
								<aon:outputText styleClass="aon-bold"
									value="#{purchase.invoiceCode}"
									rendered="#{purchase.invoiced}" />
								<aon:outputText styleClass="aon-italic" value=")"
									rendered="#{purchase.invoiced}" />
								<aon:commandLink id="invoice_link" immediate="true"
									styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
									value="&#160;" title="#{bundle.aon_go}"
									rendered="#{purchase.invoiced}"
									actionListener="#{purchase.onLoadInvoice}"
									action="purchaseInvoice_form" />

								<aon:commandButton id="toPending" value="&#160;"
									actionListener="#{purchase.onPending}" 
									title="#{bundle.sales_to_pending}"
									immediate="true" rendered="#{purchase.closed}"
									styleClass="aon-icon-commandButton aon-icon-refresh aon-margin-left" />
								<aon:commandButton id="close" value="&#160;"
									actionListener="#{purchase.onClose}"
									title="#{bundle.sales_to_close}"
									immediate="true" rendered="#{purchase.pending and purchaseDetail.model.rowCount > 0}"
									styleClass="aon-icon-commandButton aon-icon-point-red" />
								<aon:commandButton id="block" value="&#160;"
									actionListener="#{purchase.onBlock}"
									title="#{bundle.sales_to_block}"
									immediate="true" rendered="#{!purchase.nevv and purchase.pending}"
									styleClass="aon-icon-commandButton aon-icon-lock">
								</aon:commandButton>										
								<aon:commandButton id="unblock" value="&#160;"
									actionListener="#{purchase.onUnblock}"
									title="#{bundle.sales_to_unblock}"
									immediate="true" rendered="#{purchase.blocked}"
									styleClass="aon-icon-commandButton aon-icon-unlock aon-margin-left">
								</aon:commandButton>										
							</aon:div>
						</h:panelGrid>
 					</aon:div>

					<aon:outputLabel for="Purchase_issueDate" 
						value="#{bundle.aon_date}" />
					<aon:div>
						<aon:selectInputDate id="Purchase_issueDate"
							value="#{purchase.to.issueDate}" 
							required="true" disabled="#{!purchase.pending}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="Purchase_documentType"
							styleClass="aon-margin-left aon-italic"
							rendered="#{purchase.nevv}"
							value="#{bundle.aon_type}: " />
						<aon:selectOneMenu id="Purchase_documentType"
							rendered="#{purchase.nevv}"
							value="#{purchase.to.documentType}">
							<f:selectItems value="#{purchaseCollections.documentTypes}" />
						</aon:selectOneMenu>
						<aon:outputLabel for="Purchase_purchaseReference" 
							styleClass="aon-margin-left aon-italic"
							value="#{bundle.sales_purchase_reference}: " />
						<aon:inputText id="Purchase_purchaseReference"
							value="#{purchase.to.purchaseReference}"
							disabled="#{!purchase.pending}"
							size="30" maxlength="32" />
					</aon:div>
						
					<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
						<ui:param name="lookupTo" value="#{purchase.to.supplier}" />
						<ui:param name="lookupDisabled" value="#{!purchase.pending}" />
						<ui:param name="lookupReRender" value="PurchaseAddress,PurchaseProject,Purchase_scope,Purchase_defaultPayMethod,payMethodDiv" />
						<ui:param name="idRequired" value="#{true}" />						
						<aon:methodParam name="lookupChangeListener"
							value="#{purchase.supplierData}" type="lookupChangeListener" />
					</ui:include>
					
					<aon:outputLabel for="Purchase_deliveryDate" 
						value="#{bundle.aon_date} entrega" />
					<aon:selectInputDate id="Purchase_deliveryDate"
						value="#{purchase.linesDeliveryDate}" 
						disabled="#{!purchase.pending || purchase.nevv || purchaseDetail.model.rowCount eq 0}"						
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Purchase_address"
						value="#{bundle.aon_address}" />
					<aon:div id="PurchaseAddress">
						<aon:selectOneMenu id="Purchase_address" 
							value="#{purchase.to.registryAddress}" rendered="#{purchase.addressCount > 0}"
							disabled="#{!purchase.pending}">
							<f:selectItems value="#{purchase.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{bundle.registry_no_address_available}"
							rendered="#{purchase.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Purchase_workPlace" 
						value="#{bundle.purchase_workplace}" />
					<aon:selectOneMenu id="Purchase_workPlace" 
						value="#{purchase.to.workPlace}"
						disabled="#{!purchase.pending}" required="#{true}"
						valueChangeListener="#{purchase.onWorkPlaceChanged}" 
						reRender="Purchase_scope,Purchase_warehouse">
						<c:if test="#{fn:length(companyCollections.currentUserWorkPlaces) != 1}" >
							<f:selectItem itemLabel=" - " itemValue="#{null}" />
						</c:if>						
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Purchase_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Purchase_scope" 
						value="#{purchase.to.scope}"
						disabled="true">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Purchase_warehouse" 
						value="#{bundle.aon_module_warehouse}" />
					<aon:selectOneMenu id="Purchase_warehouse"
						disabled="#{!purchase.pending}" 
						value="#{purchase.to.warehouse}">
						<c:if test="#{fn:length(purchase.warehouses) != 1}" >
							<f:selectItem itemLabel=" - " itemValue="#{null}" />
						</c:if>
						<f:selectItems value="#{purchase.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Purchase_defaultPayMethod" 
						value="#{bundle.finance_payMethod}" />
					<aon:selectOneRadio id="Purchase_defaultPayMethod" 
						value="#{purchase.defaultPayMethod}"
						disabled="#{!purchase.pending}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{bundle.aon_habitual}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{bundle.aon_to_specify}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Purchase_total" 
						value="#{bundle.aon_total}" />
					<aon:div>
						<aon:outputText id="Purchase_total" styleClass="aon-bold"
							value="#{purchase.totalPrice}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:outputLabel styleClass="aon-margin-left aon-italic"
							value="(#{bundle.aon_tax_included})" />
					</aon:div>

				</aon:panelGrid>

				<aon:div id="PurchaseProject">
					<aon:panelGrid columns="2" style="width: 100%;"
						rendered="#{purchase.to.project.id != null or (purchase.pending and purchase.to.supplier.id != null)}"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto">

						<aon:if test="#{!aonConfiguration.bean.purchase.showTasData}">
							<aon:outputLabel for="Purchase_project"
								value="#{bundle.aon_project}" />
						</aon:if>
						<aon:if test="#{aonConfiguration.bean.purchase.showTasData}">
							<aon:outputLabel for="Purchase_project"
								value="#{bundle.tas_project_tas}" />
						</aon:if>
						<aon:div>
							<ui:include src="/com/code/aon/ui/project/facelet/project/lookup.xhtml" >
								<ui:param name="lookupTo" value="#{purchase.to.project}" />
								<ui:param name="lookupRendered" value="#{purchase.pending}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="skipGoToButton" value="#{true}" />
							</ui:include>
						</aon:div>

					</aon:panelGrid>
				</aon:div>

				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140,
						aon-panelGrid-even aon-width-500,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<aon:div rendered="#{!empty purchase.to.comments}">
						<aon:outputLabel for="Purchase_comments"
							value="#{bundle.aon_comment}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_comment_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Purchase_comments" cols="80" rows="3"
						disabled="#{!purchase.pending}"
						rendered="#{!empty purchase.to.comments}"
						value="#{purchase.to.comments}" />

					<aon:div rendered="#{!empty purchase.to.remarks}">
						<aon:outputLabel for="Purchase_remarks"
							value="#{bundle.aon_remark}" />
						<aon:div>
							<aon:outputLabel styleClass="aon-form-date-label"
								value="(#{bundle.aon_remark_description})" />
						</aon:div>
					</aon:div>
					<aon:inputTextarea id="Purchase_remarks" cols="80" rows="3"
						disabled="#{!purchase.pending}"
						rendered="#{!empty purchase.to.remarks}"
						value="#{purchase.to.remarks}" />

				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:if test="#{purchase.defaultPayMethod != null and !purchase.defaultPayMethod}">
						<aon:panel>
							<f:facet name="header">
								<aon:outputText value="#{bundle.finance_payMethod}" />
							</f:facet>
							<aon:panelGrid columns="8" styleClass="aon-width-all" style="font-size:0.9em;"
								rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
								columnClasses="aon-panelGrid-even aon-width-auto,
									aon-panelGrid-even aon-width-50,
									aon-panelGrid-even aon-width-70,
									aon-panelGrid-even aon-width-100,
									aon-panelGrid-even aon-width-70,
									aon-panelGrid-even aon-width-auto,
									aon-panelGrid-even aon-width-150,
									aon-panelGrid-even aon-width-100">

								<aon:outputLabel for="Purchase_payMethod" value="#{bundle.aon_type}"/>
								<aon:outputLabel for="Purchase_numberOfPayments" value="#{bundle.registry_number_of_payments}" />
								<aon:outputLabel for="Purchase_daysToFirstPayment" value="#{bundle.registry_days_to_first_payment}" />
								<aon:outputLabel for="Purchase_daysBetweenPayments" value="#{bundle.registry_days_between_payments}" />
								<aon:outputLabel for="Purchase_paymentDays" value="#{bundle.registry_payment_days}" />
								<aon:outputLabel value="#{bundle.aon_iban}" />
								<aon:outputLabel for="Purchase_bankAlias" value="#{bundle.aon_bank}" />
								<aon:outputLabel for="Purchase_bic" value="#{bundle.aon_bic}" />

								<aon:selectOneMenu id="Purchase_payMethod" 
									value="#{purchase.to.payMethod}"
									disabled="#{!purchase.pending}">
									<f:selectItems value="#{configCollections.payMethods}" />
								</aon:selectOneMenu>
								<aon:inputText id="Purchase_numberOfPayments"
									value="#{purchase.to.numberOfPayments}"
									disabled="#{!purchase.pending}" size="3" maxlength="2">
									<f:validateLongRange minimum="1" />
								</aon:inputText>	
								<aon:inputText id="Purchase_daysToFirstPayment"
									value="#{purchase.to.daysToFirstPayment}"
									disabled="#{!purchase.pending}" size="3" maxlength="3">
									<f:validateLongRange minimum="0" />
								</aon:inputText>	
								<aon:inputText id="Purchase_daysBetweenPayments"
									value="#{purchase.to.daysBetweenPayments}"
									disabled="#{!purchase.pending}" size="3" maxlength="3">
									<f:validateLongRange minimum="0" />
								</aon:inputText>	
								<aon:inputText id="Purchase_paymentDays"
									value="#{purchase.to.paymentDays}" 
									disabled="#{!purchase.pending}" size="5" />

								<aon:div>
									<ui:include src="/com/code/aon/ui/registry/facelet/rbank/bankAccount.xhtml">
										<ui:param name="bankAccountController" value="#{purchase.accountHelper}" />
										<ui:param name="bankAccountPrefix" value="Purchase" />
										<ui:param name="bankAccountDisabled" value="#{!purchase.pending}" />
										<ui:param name="bankCodeChangeReRender" value="Purchase_bankAlias,Purchase_bic" />
									</ui:include>
								</aon:div>
								<aon:inputText id="Purchase_bankAlias"
									value="#{purchase.to.bankAlias}" 
									disabled="#{!purchase.pending}" 
									required="#{purchase.to.bankAccount.validIbanLength}" size="25" maxlength="25" />
								<aon:inputText id="Purchase_bic"
									value="#{purchase.to.bic}" validator="BICValidator"
									disabled="#{!purchase.pending}" 
									required="#{purchase.to.bankAccount.validIbanLength}" size="12" maxlength="11">
								</aon:inputText>

							</aon:panelGrid>
						</aon:panel>
					</aon:if>
				</aon:div>
				
				<aon:if test="#{!purchase.nevv}">
					<aon:panelTabSet id="purchasePanelTab">
						<aon:panelTab label="#{bundle.sales_detail}">
							<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/formDetail.xhtml">
								<aon:if test="#{!aonConfiguration.bean.purchase.showTasData}">
									<ui:param name="projectLabel" value="#{bundle.aon_project}" />
								</aon:if>
								<aon:if test="#{aonConfiguration.bean.purchase.showTasData}">
									<ui:param name="projectLabel" value="#{bundle.tas_project_tas}" />
								</aon:if>
							</ui:include>
						</aon:panelTab>
						<aon:if test="#{purchase.shippingDataDefined}">
							<aon:panelTab id="purchaseShipmentTab" 
								label="#{bundle.carrier_shipment}">
								<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/formShipment.xhtml" />
							</aon:panelTab>
						</aon:if>
					</aon:panelTabSet>
				</aon:if>
				
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{purchaseItemLookup}" />
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
		<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/modalIncome.xhtml" />
		<ui:include src="/com/code/aon/ui/purchase/facelet/purchase/modalInvoice.xhtml" />
