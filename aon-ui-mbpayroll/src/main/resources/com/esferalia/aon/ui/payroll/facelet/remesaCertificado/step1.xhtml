<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/remesaCertificado/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.remesaCertificado_step1}" />
	</ui:define>

	<ui:define name="step_content">
		
		<aon:div styleClass="aon-scroll-area">
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/remesaCertificado/remesaHeader.xhtml" />
		</aon:div>
		
		<aon:div styleClass="aon-scroll-area">
			<aon:dataTable id="remesaDetailData" value="#{remesaCertificadoWizard.detailList}"
				var="to" rows="20" 
				columnClasses="
				aon-editDataTable-numberColumn, 
				aon-editDataTable-textColumn, 
				aon-editDataTable-dateColumn,
				aon-editDataTable-textColumn">
<!--  
				<aon:rowSelector action="remesaCertificadoWizard_step2"
					actionListener="#{remesaCertificadoWizard.onSelect}" />
-->

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.payroll_cdg}" />
					</f:facet>
					<aon:outputText value="#{to.id}" />
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.payroll_nombre}" />
					</f:facet>
					<aon:outputText value="#{to.empleado.persona.fullName}" >
						<aon:abbreviateConverter maxWidth="50" />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.payroll_fecha_baja}" />
					</f:facet>
					<aon:outputText value="#{to.fechaBaja}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.payroll_causa_suspension}" />
					</f:facet>
					<aon:outputText value="#{to.causaSuspension}" />
				</aon:column>

			</aon:dataTable>
<!--  
			<aon:dataScroller2 for="remesaData" showNote="true" />
-->

		</aon:div>
	</ui:define>

</ui:composition>
