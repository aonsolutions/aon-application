<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panel>
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_datos_contrato}" />
		</f:facet>
		<aon:dataTable id="contratosData"
			value="#{salaryModificationWizard.empleosModel}" var="to" rows="20"
			columnClasses="
						aon-editDataTable-dateColumn,
						aon-editDataTable-textColumn aon-width-auto,
						aon-editDataTable-dateColumn">

			<aon:rowSelector actionListener="#{salaryModificationWizard.onSelectContrato}"
				immediate="true" reRender="contratosData, percepcionesList" />

<!--  
			<aon:column style="#{to == salaryModificationWizard.contratoEmpleado?'background-color: #CAFFCA;':''}">
				<f:facet name="header">
				</f:facet>
				<aon:selectBooleanCheckbox id="checkMessage" value="#{to.selected}"
					style="cursor: default;" styleClass="aon-vertical-align-middle">
					<a4j:support event="onclick"
						ajaxSingle="true"
						reRender="checkMessage"
						limitToList="true" />
				</aon:selectBooleanCheckbox>
			</aon:column>
-->

			<aon:column style="#{to == salaryModificationWizard.contratoEmpleado?'background-color: #CAFFCA;':''}">
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_fecha_ini}" />
				</f:facet>
				<aon:outputText value="#{to.empleado.fechaInicio}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>

			<aon:column style="#{to == salaryModificationWizard.contratoEmpleado?'background-color: #CAFFCA;':''}">
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_empresa}" />
				</f:facet>
				<aon:outputText value="#{to.empleado.actividad.empresa.name}" >
					<aon:abbreviateConverter maxWidth="50" />
				</aon:outputText>
			</aon:column>
<!-- 
			<aon:column style="#{to == parteITWizard.parteITEmpleado?'background-color: #CAFFCA;':''}">
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_fecha_fin}" />
				</f:facet>
				<aon:outputText value="#{to.empleado.fechaFin}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
 -->
			<aon:column style="#{to == salaryModificationWizard.contratoEmpleado?'background-color: #CAFFCA;':''}"
				styleClass="aon-nowrap">
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_fecha_baja}" />
				</f:facet>
				<aon:outputText value="#{to.fechaBaja}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>

		</aon:dataTable>
	</aon:panel>

</ui:composition>
