<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/remesaCertificado/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.remesaCertificado_step1}" />
	</ui:define>

	<ui:define name="step_content">
	
		<aon:dataTable id="remesasData" value="#{remesaCertificadoWizard.selectedModel}"
			var="to" rows="20" 
			columnClasses="
			aon-editDataTable-textColumn, 
			aon-editDataTable-textColumn, 
			aon-editDataTable-dateColumn">
			
			<aon:rowSelector 
				actionListener="#{remesaCertificadoWizard.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_empresa}" />
				</f:facet>
				<aon:outputText value="#{to.remesa.empresa.name}" />
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_fecha}" />
				</f:facet>
				<aon:outputText value="#{to.remesa.fecha}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_estado}" />
				</f:facet>
				<aon:outputText value="#{to.remesa.estado}"  />
			</aon:column>
			
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/remesaCertificado/listaEmpleadosRemesa.xhtml" />
			
		</aon:dataTable>		
	
	</ui:define>
	<ui:define name="after_form">
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>

</ui:composition>
