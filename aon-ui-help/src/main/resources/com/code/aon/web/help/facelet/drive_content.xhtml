<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">

	<style>
.breadcrumb {
	/* background: dodgerblue;*/
	width: 100%;
	height: 2rem;
	display: flex;
	justify-content: flex-start;
	align-items: center;
	padding: 0 1rem;
	color: #ccc;
	border-bottom: 1px solid #f1f1f1;
}

.breadcrumb .link {
	font-size: .8rem;
	font-weight: 900;
	cursor: pointer;
	color: #bbb;
	transition: .15s;
}

.breadcrumb .link:hover {
	color: #163776;
}

.breadcrumb form {
	display: flex;
	justify-content: center;
	align-items: center;
}

.breadcrumb separator {
	font .size: 1.35rem;
}

#aonContent {
	height: calc(100% - 90px);
}

#sidebar {
	background: rgba(0, 0, 0, .015);
	width: 20rem;
	border-right: 1px solid #f1f1f1;
}

#help-viewer {
	width: calc(100% - 20rem);
	height: 100%;
	position: relative;
}

#help-viewer .list {
	overflow-y: auto;
	height: calc(100% - 2rem);
}

.list {
	padding: 0 .2rem;
}

.list form {
	width: 100%;
}

.list-item {
	border-bottom: revert !important;
	border-top: 1px solid #f1f1f1;
}

.list .list-item {
	height: 3rem;
	border-bottom: 1px solid #f1f1f1;
	display: flex;
	justify-content: flex-start;
	align-items: center;
	padding: 1rem 2rem;
	transition: background-color .25s;
	border-radius: .25rem;
	font-weight: normal;
	color: #606060;
	font-size: 1.05rem;
	cursor: pointer;
}

.list .list-item:hover {
	background-color: #f6f6f6;
	color: #163776;
}

.list .list-item>.button {
	height: 100%;
	background-size: 3rem;
	padding: 0;
	padding-left: 4.5rem;
	display: flex;
	align-items: center;
	font-size: 1.25rem;
	background-position: left center;
}

.list .list-item>.button:hover {
	transform: none;
}

.list .list-item .icon {
	margin-right: .45rem;
	background-size: unset !important;
	min-width: 1.40rem;
	min-height: 1.40rem;
	border-radius: 100%;
	padding: .2rem;
	cursor: pointer;
	color: ##606060;
	transition: color .15s, transform .15s;
	font-size: 1.60rem;
}

.list .list-item .aon-module {
	margin-right: .7rem;
}

.list .list-item .icon.file {
	color: #163776;
	/*transform: scale(1.1);*/
}

* {
	scroll-behavior: smooth;
}

.aon-button-conecta {
	padding-top: 4px;
	padding-bottom: 4px;
	padding-right: 36px;
	display: inline-block;
	background: url(#{ aonResource.resolve [ '/images/apps/aon-portal.svg' ]
}
)


 


scroll


 


right


 


center


 


no-repeat




;
background-size




:




32px




;
}
</style>
	<script>
		function displayVideo(elem) {
			if (elem) {
				ifrmContainer = elem.parentElement
						.querySelector(".ifrmContainer");
				if (ifrmContainer) {
					ifrmContainer.style.display = ifrmContainer.style.display === "none" ? "flex"
							: "none";
					ifrm = ifrmContainer.querySelector("iframe");
					if (ifrm) {
						ifrmSrc = ifrm.src;
						ifrm.src = ifrmSrc;
					}
				}
			}
		}

		function displayVideoVimeo(link) {
			var container = link.parentElement.querySelector(".ifrmContainer");
			if (container) {
				container.style.display = container.style.display === "none" ? "block"
						: "none";
			}
		}
	</script>

	<aon:form id="driveContentForm">

		<ui:include src="./breadcrumb.xhtml" />

		<aon:div id="driveContent">

			<ui:fragment rendered="#{vimeo.showDrive}">

				<aon:div styleClass="box-column list">
					<c:forEach items="#{help.content}" var="file">

						<!-- FOLDER -->
						<aon:if test="${file.isFolder() and !file.isFaqFolder()}">
							<aon:commandLink styleClass="list-item" reRender="driveContent">
								<f:setPropertyActionListener target="#{vimeo.showVimeo}"
									value="#{false}" />
								<f:setPropertyActionListener target="#{help.file}"
									value="#{file}" />

								<aon:outputText rendered="${!help.isHome()}"
									value="drive_file_move" styleClass="icon material-icons" />

								<!-- AON ICONS -->
								<aon:outputText
									rendered="${help.isHome() and !help.isAonModule(file)}"
									value="" styleClass="icon aon-module aon-button" />
								<aon:outputText rendered="${help.isPayroll(file)}" value=""
									styleClass="icon aon-module aon-button-payroll" />
								<aon:outputText rendered="${help.isConfig(file)}" value=""
									styleClass="icon aon-module aon-button-tools" />
								<aon:outputText rendered="${help.isManagement(file)}" value=""
									styleClass="icon aon-module aon-button" />
								<aon:outputText rendered="${help.isAccounting(file)}" value=""
									styleClass="icon aon-module aon-button-account" />
								<aon:outputText rendered="${help.isConecta(file)}" value=""
									styleClass="icon aon-module aon-button-conecta" />
								<aon:outputText rendered="${help.isFiscal(file)}" value=""
									styleClass="icon aon-module aon-button-fiscal" />

								<aon:outputText value="#{file.name}" />

							</aon:commandLink>
						</aon:if>

						<!-- PDF -->
						<aon:if test="${file.isPDF()}">
							<a
								href="./html/pdfjs/viewer.html?encoded=true&amp;newtoolbar=true&amp;file=#{help.getFileServletUrl(file)}"
								class="list-item" target="_blank"> <aon:outputText
									value="description" styleClass="icon file material-icons" /> <aon:outputText
									value="#{file.name}" />
							</a>
						</aon:if>

						<!-- VIDEO -->
						<aon:if test="${file.isVideo()}">
							<aon:div>
								<aon:div styleClass="list-item"
									onclick="javascript:displayVideo(this);return;">
									<aon:outputText value="smart_display"
										styleClass="icon file material-icons" />
									<aon:outputText value="#{file.name}" />
								</aon:div>
								<aon:div styleClass="ifrmContainer"
									style="display:none; justify-content:center; width: 100%; margin-bottom: 10px;">
									<iframe
										src="https://drive.google.com/file/d/#{file.getId()}/preview"
										style="min-width: 680px;" width="50%" height="480"
										frameBorder="0" allow="autoplay"
										allowfullscreen="allowfullscreen"></iframe>
									<!-- <iframe src="./html/video.html##{help.getFileServletUrl(file)}" style="min-width:680px;" width="50%" height="480"></iframe> -->
								</aon:div>
							</aon:div>
						</aon:if>
					</c:forEach>
				</aon:div>

			</ui:fragment>

			<!--  VIMEO -->
			<div id="vimeoContainer" rendered="#{vimeo.showVimeo}">
				<!-- <ui:include src="./vimeo_content.xhtml" /> -->
				<aon:form id="vimeoContentForm">

					<aon:div id="vimeoContent">

						<ui:fragment rendered="#{vimeo.showVimeo}">

							<aon:div styleClass="box-column list">
								<c:forEach items="#{vimeo.mainItems}" var="vimeoItem">

									<!-- folder -->
									<aon:if test="#{vimeoItem.getRawType() == 'folder'}">
									
										<aon:commandLink styleClass="list-item" reRender="driveContent">
	
											<f:setPropertyActionListener target="#{vimeo.selectedItem}"
												value="#{vimeoItem}" />
												
											<f:setPropertyActionListener target="#{vimeo.mainItems}"
												value="#{vimeo.getItemsFromFolder(vimeoItem.getFolder())}" />
												
											<f:setPropertyActionListener target="#{vimeo.showDrive}"
												value="#{false}" />
																			
											<aon:outputText value="smart_display"
													styleClass="icon file material-icons" />
											<aon:outputText value="#{vimeoItem.getFolder().getName()}" />
										
										</aon:commandLink>
										
									</aon:if>
									
									<!-- video -->
									<ui:fragment rendered="#{vimeoItem.getRawType() == 'video'}">
										<aon:div>
											<aon:div styleClass="list-item"
												onclick="displayVideoVimeo(this);return;">
												<aon:outputText value="smart_display"
													styleClass="icon file material-icons" />
												<aon:outputText value="#{vimeoItem.getVideo().getName()}" />
												<div class="ifrmContainer"
													style="display: none; justify-content: center; width: 100%; margin-bottom: 10px;">
													<iframe src="#{vimeoItem.getVideo().getLink()}"
														style="min-width: 680px;" width="50%" height="480"
														frameBorder="0" allow="autoplay"
														allowfullscreen="allowfullscreen"></iframe>
												</div>
											</aon:div>
										</aon:div>
									</ui:fragment>


								</c:forEach>
							</aon:div>

						</ui:fragment>

					</aon:div>
				</aon:form>
			</div>


		</aon:div>
	</aon:form>

</ui:composition>
