	<script type="text/javascript">
			function showSearchResults(){
				if ( #{rich:element('smartFilter')}.value ) {
					#{rich:element('smartFilterTablePanel')}.style.display='block';
				}
			}
			function hideSearchResults(){
				setTimeout(function() {
					if ( document.activeElement != #{rich:element('smartFilterTablePanel')} )
						#{rich:element('smartFilterTablePanel')}.style.display='none';
				}, 500);
			}
			function escSearchResults(e){
				if ( e.which === 27 ) {
					#{rich:element('smartFilterTablePanel')}.style.display='none';
					e.stopPropagation();
      				e.preventDefault();  
      				e.returnValue = false;
      				e.cancelBubble = true;
      				return false;
				}
			}
	</script>
