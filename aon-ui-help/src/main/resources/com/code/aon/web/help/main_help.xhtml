<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<style>
		.div-horizontal-center {
			display: flex;
			justify-content: center;
			position: relative;
			width: 100%;
		}
		
		.box-column {
			display: flex;
			flex-direction: column;
		}
		
		.box-row {
			display: flex;
			flex-direction: row;
		}
		
		.list {
			padding: 0 .2rem;
		}
		
		.list form {
			width: 100%;
		}
		
		.list .list-item {
			height: 3rem;
			border-bottom: 1px solid #f1f1f1;
			display: flex;
			justify-content: flex-start;
			align-items: center;
			padding: 1rem 2rem;
			transition: background-color .25s;
			border-radius: .25rem;
			font-weight: normal;
			color: #606060;
			font-size: 1.05rem;
			cursor: pointer;
		
		}
		
		.list .list-item:hover {
			background-color: #f6f6f6;
			color: #163776;
		}
		
		.list .list-item>.button {
			height: 100%;
			background-size: 3rem;
			padding: 0;
			padding-left: 4.5rem;
			display: flex;
			align-items: center;
			font-size: 1.25rem;
			background-position: left center;
		}
		
		.list .list-item>.button:hover {
			transform: none;
		}
		
		.list .list-item .icon {
			margin-right: .45rem;
			background-size: unset !important;
			min-width: 1.40rem;
			min-height: 1.40rem;
			border-radius: 100%;
			padding: .2rem;
			cursor: pointer;
			color: ##606060;
			transition: color .15s, transform .15s;
			font-size: 1.60rem;
		}
		
		.list .list-item .aon-module {
			margin-right: .7rem;
		}
		
		
		.list .list-item .icon.file {
			color: #163776;
			/*transform: scale(1.1);*/
		}
		
		* {
			scroll-behavior: smooth;
		}
		
		.breadcrumb {
			/* background: dodgerblue;*/
			width: 100%;
			height: 2rem;
			display: flex;
			justify-content: flex-start;
			align-items: center;
			padding: 0 1rem;
			color: #ccc;
			border-bottom: 1px solid #f1f1f1;
		}
		
		.breadcrumb .link {
			font-size: .8rem;
			font-weight: 900;
			cursor: pointer;
			color: #bbb;
			transition: .15s;
		}
		
		.breadcrumb .link:hover {
			color: #163776;
		}
		
		.breadcrumb form {
			display: flex;
			justify-content: center;
			align-items: center;
		}
		
		.breadcrumb separator {
			font .size: 1.35rem;
		}
		
		/*#aonContent {
			height: calc(100% - 90px);
		}*/
		
		#sidebar {
			background: rgba(0,0,0,.015);
			width: 20rem;
			border-right: 1px solid #f1f1f1;
		}
		
		#help-viewer {
			width: calc(100% - 20rem);
			height: 100%;
			position: relative;
		}
		
		#help-viewer .list { 
			overflow-y: auto;
			height: calc(100% - 2rem);
		}
		
		body {
			width: 100%;
			height: 100%;
		}
		
	</style>
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"></link>
	<a4j:loadStyle src="#{aonResource.resolve['/aon-richCss.css']}"/>
	<a4j:loadStyle src="#{aonResource.resolveLocal['/css/aio.css']}"/>
	
	<ui:include src="./facelet/header_help.xhtml" />	
	<ui:insert name="menu">
		<ui:include src="./facelet/menu_help.xhtml" /> 
	</ui:insert>

	<aon:div styleClass="box-row" id="aonContent">
		<aon:div id="sidebar">
			<ui:include src="./facelet/sidemenu.xhtml" />	
		</aon:div>
		
		<aon:div id="help-viewer" styleCass="div-horizontal-center box-column">			
			<aon:if test="#{!help.notificationsEnabled}">				
			<ui:include src="./facelet/drive_content.xhtml" />
			</aon:if>
			<aon:if test="#{help.notificationsEnabled}">
			<ui:include src="./facelet/notifications.xhtml" />				
			</aon:if>
		</aon:div>
		
		
		<aon:if test="#{help.getCurrentFaqs().size() > 0}">
				<ui:include src="./facelet/faqs.xhtml" />
		</aon:if>	
	</aon:div>
</ui:composition>
