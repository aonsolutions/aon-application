<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

<style>
	.menu-panel-categoryNews {
		display: flex;
		padding-bottom: 1em;
		width: 95%;
		margin-left: auto;
		margin-right: auto;
		flex-direction: column;
		justify-content: center;
	}
	
	.nyuusuKaado {
		border: 1px solid #f1f1f1;
		padding-top: 2.5em;
		padding-bottom: 2.5em;
		padding-left: 2.5%;
		padding-right: 2.5%;
		padding-left: 2.5%;
		display: flex;
		flex-direction: row;
		flex-wrap: no-wrap;
	}
	
	.nyuusuKaado:hover {
		box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
	}
	
	.newsHead {
		width: 100%;
		display: flex;
		flex-direction: row;
	}
	
	.newsTitle {
		width: 100%;
		font-size: 1.2em;
		color: black;
	}
	
	.newsDateContainer {
		font-size: 12px;
		color: lightslategray;
	}
	
	.newsDate {
		margin-top: 2em;
		align-self: center;
		color: #606060;
	}
	
	.newsDescriptionContainer {
		width: 100%;
		color: #606060;
	}
	
	.newsDescription {
		margin-top: .5em;
		margin-bottom: .5em;
		font-size: 1.1em;
		color: #002349;
	}
	
	.newsContent {
		font-size: 1em;
	}
	
	.newsContent ul, .newsContent ol {
		margin: revert-layer !important;
		padding: revert-layer !important;
	}
	
	@media screen and (max-width: 1300px) {
		.imageContainer {
			width: 25%;
		}
	}
	@media screen and (min-width: 1301px) {
		.imageContainer {
			width: 20%;
		}
	}
	
	.imageContainer {
		margin-right: 2em;
		position: relative;
		/* height: 100%; */
		display: flex;
		flex-direction: column;
		justify-content: flex-start;
		align-content: center;
		align-items: center;
	}
	
	.contentContainer {
		width: 75%;
	}
	
	.contentContainer img {
		max-width: 100%;
		height: auto;
	}
	
	/*IMAGE*/
	.newsImgDiv {
		height: 140px;
		box-sizing: border-box;
		min-width: 0px;
		width: 100%;
		display: block;
		background-repeat: no-repeat;
		background-position: center;
		background-size: cover;
	}
	
	.imgChannelName {
		display: flex;
		justify-content: center;
		align-items: center;
		font-size: 1.2m;
		margin-top: .75em;
		font-weight: bold;
		color: #002469;
	}
	
	.fiscalImage {
		background-image: url(#{ aonResource.resolve [ '/images/apps/aon-fiscal.svg' ]});
		background-size: revert;
	}
	.laboralImage {
		background-image: url(#{ aonResource.resolve [ '/images/apps/aon-payroll.svg' ]});
		background-size: revert;
	
	
	}
	.conectaImage {
		background-image: url(#{ aonResource.resolve [ '/images/apps/aon-portal.svg' ]});
		background-size: revert;
	}
	.contabilidadImage {
		background-image: url(#{ aonResource.resolve [ '/images/apps/aon-accounting.svg' ]});
		background-size: revert;
	}
	.configImage {
		background-image: url(#{ aonResource.resolve [ '/images/apps/aon-tools.svg' ]});
		background-size: revert;
	}
	.otherImage {
		background-image: url(#{ aonResource.resolve [ '/images/aon-icon-logo.svg' ]});
		background-size: revert;
	}
	.channelMenu {
		display: flex;
		flex-direction: row;
		justify-content: start;
		margin: 1em;
	}
	
	.channelItem {
		display: flex;
		justify-content: center;
		align-items: center;
		text-align: center;
		font-size: 14px;
		padding: 0 1em;
	}
	
	.channelMenu .channelItem:not(:last-of-type) {
		border-right: 1px solid gray;
	}
	
	.selectedChannel .aon-outputText{
		font-weight: bold !important;
		color: #002469 !important;
	}
	
	.categoryLabel {
		margin-right: 5px;
		font-weight: normal;
		color: black;
	}

</style>

	<aon:form id="newsForm" >
	<aon:div id="newsContent" >
		<div class="channelMenu">
			<div class="channelItem #{help.currentNewsCategory == null || help.currentNewsCategory.isEmpty() ? 'selectedChannel' : ''}">
					<aon:commandLink reRender="newsContent"  >
						<aon:outputText value="TODO"/>
						<f:setPropertyActionListener target="#{help.currentNewsCategory}"
							value="#{null}" />
					</aon:commandLink>
			</div>
			<c:forEach items="#{help.getNews().keySet()}" var="categoryName">
	
				<div class="channelItem #{help.currentNewsCategory.equals(categoryName) ? 'selectedChannel' : ''}">
	
						<aon:commandLink reRender="newsContent" >
							<aon:outputText value="#{categoryName}" />
							<f:setPropertyActionListener target="#{help.currentNewsCategory}"
								value="#{categoryName}" />
						</aon:commandLink>
				</div>
	
			</c:forEach>
		</div>
	
		<div class="menu-panel-categoryNews">
			<c:forEach items="#{help.getNewsByCategory(help.currentNewsCategory)}" var="news">
	
				<aon:div styleClass="nyuusuKaado">
					<aon:div styleClass="imageContainer">
						<aon:div
							styleClass="newsImgDiv #{help.categoryImgClass(news, help.getNewsCategoryName(news))}"
							style="#{help.getNewsImgStyle(news)}">
						</aon:div>
						<c:if test="#{help.currentNewsCategory == null || help.currentNewsCategory.isEmpty()}">
							<aon:div styleClass="imgChannelName">
							<h:outputText value="#{help.getNewsCategoryName(news)}"></h:outputText>
							</aon:div>
						</c:if>
						
						<aon:div styleClass="newsDateContainer">
							<aon:div styleClass="newsDate">
								<aon:outputText value="#{help.formatDate(news)}" />
							</aon:div>
						</aon:div>
					</aon:div>
					<aon:div styleClass="contentContainer">
						<aon:div styleClass="menu-panel-news">
							<aon:div styleClass="newsHead">
								<aon:div styleClass="newsTitle">
									<aon:outputText value="#{news.getTitle()}"
										style="font-weight: bold; text-transform: uppercase;" />
								</aon:div>
	
							</aon:div>
							<aon:div styleClass="newsDescriptionContainer">
								<aon:div styleClass="newsDescription">
									<aon:outputText value="#{news.getDescription().orElse('')}"
										escape="true" />
								</aon:div>
							</aon:div>
							<aon:div styleClass="newsContent">
								<aon:outputText value="#{news.getContent()}" escape="false" />
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
	
			</c:forEach>
		</div>
	</aon:div>
	</aon:form>







</ui:composition>
