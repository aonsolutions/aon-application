<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
	<style>
#faqs {
	padding: 0rem 1rem;
	width: 20rem;
	border-left: 1px solid #f1f1f1;
	display: flex;
	flex-direction: column; 
}

.box-row {
	display: flex;
}

#faqs #title-row {
	align-items: center;
}

#faqs #title-row .material-icons {
	margin-right: .5rem;
}

#faqs #title-row h1 {
	font-weight: normal;
}

#faqs .faq {
	padding: .5rem 1rem;
	border-radius: .25rem;
	cursor: pointer;
	margin: 0.1rem;
	transition: color .25s;
	display: block;
}

#faqs .faq:hover {
	color: #163776;
}

</style>

	<script>
		function togglePanel(id) {

			console.log("toggle pressed");

			const panel = document.querySelector(".menu-panel#" + id + "");
			const icon = document.querySelector(".menu-panel#" + id
					+ " .menu-panel-title .material-icons");
			const content = document.querySelector(".menu-panel#" + id
					+ " .menu-panel-options");

			if (panel.dataset.opened === "true") {
				icon.style.transform = "rotate(0deg)";
				content.style.display = "block";
				panel.dataset.opened = false;
				console.log("closing")
			} else {
				icon.style.transform = "rotate(180deg)";
				content.style.display = "none";
				panel.dataset.opened = true;
				console.log("opening")
			}

		}
	</script>
	<aon:div id="faqs">
		<aon:div styleClass="box-row" id="title-row">
			<aon:outputText value="quiz" styleClass="material-icons" />
			<h1>FAQs</h1>
		</aon:div>

		<aon:div>
			<aon:if test="#{help.getCurrentFaqs().size() == 0}">
				<p>No se encuentran FAQs en este apartado.</p>
			</aon:if>
		
			<c:forEach items="#{help.getCurrentFaqs()}" var="file">
				<a class="faq" href="./html/pdfjs/viewer.html?encoded=true&amp;newtoolbar=true&amp;file=#{help.getFileServletUrl(file)}" target="_blank"> 
					#{file.extensionlessName}	
				</a>
			</c:forEach>
		</aon:div>

	</aon:div>
</ui:composition>
