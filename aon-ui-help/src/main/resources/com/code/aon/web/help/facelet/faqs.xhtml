<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
	<style>
#aonContent\:faqs {
	padding: 0rem 1rem;
	width: 20rem;
	border-left: 1px solid #f1f1f1;
	display: flex;
	flex-direction: column; 
}

.box-row {
	display: flex;
}

#aonContent\:faqs #aonContent\:title-row {
	align-items: center;
}

#aonContent\:faqs #aonContent\:title-row .material-icons {
	margin-right: .5rem;
}

#aonContent\:faqs #aonContent\:title-row h1 {
	font-weight: normal;
}

#aonContent\:faqs .faq {
	padding: .5rem 1rem;
	border-radius: .25rem;
	cursor: pointer;
	margin: 0.1rem;
	transition: color .25s;
	display: block;
}

#aonContent\:faqs .faq:hover {
	color: #163776;
}

</style>

	<aon:div id="faqs">
		<aon:div styleClass="box-row" id="title-row">
			<aon:outputText value="quiz" styleClass="material-icons" />
			<h1>FAQs</h1>
		</aon:div>

		<aon:div>
			<aon:if test="#{help.getCurrentFaqs().size() == 0}">
				<p>No se encuentran FAQs en este apartado.</p>
			</aon:if>
		
			<c:forEach items="#{help.getCurrentFaqs()}" var="file">
				<a class="faq" href="./html/pdfjs/viewer.html?encoded=true&amp;newtoolbar=true&amp;file=#{help.getFileServletUrl(file)}" target="_blank"> 
					#{file.extensionlessName}	
				</a>
			</c:forEach>
		</aon:div>

	</aon:div>
</ui:composition>
