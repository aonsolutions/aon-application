<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">
	<style>
#sidemenu {
	padding: 0rem 1rem;
}

.menu-panel {
	border-bottom: 1px solid #f1f1f1;
}

.menu-panel .menu-panel-options .menu-panel-option, .menu-panel .menu-panel-title
	{
	display: flex;
	align-items: center;
}

.menu-panel .menu-panel-title {
	font-size: 1rem;
	padding: .5rem 0rem;
	user-select: none;
	cursor: pointer;
}

.menu-panel .menu-panel-title .material-icons {
	font-size: 1.8rem;
}

.menu-panel .menu-panel-options :not(a).menu-panel-option {
	user-select: none;
}

.menu-panel .menu-panel-options .menu-panel-option {
	padding: .75rem 2rem;
	font-size: .9rem;
	transition: background .5s;
	border-radius: .15rem;
	cursor: pointer;
}

.menu-panel .menu-panel-options .menu-panel-option:hover {
	background: rgba(0, 0, 0, .035);
}

.menu-panel .menu-panel-options .menu-panel-option .material-icons {
	margin-right: .5rem;
}
</style>

	<script>
		function togglePanel(id) {

			console.log("toggle pressed");

			const panel = document.querySelector(".menu-panel#" + id + "");
			const icon = document.querySelector(".menu-panel#" + id
					+ " .menu-panel-title .material-icons");
			const content = document.querySelector(".menu-panel#" + id
					+ " .menu-panel-options");

			if (panel.dataset.opened === "true") {
				icon.style.transform = "rotate(0deg)";
				content.style.display = "block";
				panel.dataset.opened = false;
				console.log("closing")
			} else {
				icon.style.transform = "rotate(180deg)";
				content.style.display = "none";
				panel.dataset.opened = true;
				console.log("opening")
			}

		}
	</script>
	<aon:div id="sidemenu">

		<!-- HELP / CONTENT -->
		<aon:div styleClass="menu-panel" id="info">
			<aon:div styleClass="menu-panel-title" onclick="togglePanel('info')">
				<aon:outputText value="expand_more" styleClass="material-icons" />
				<aon:outputText value="Ayuda/Contenidos" />
			</aon:div>

			<aon:div styleClass="menu-panel-options">
					<aon:form>
						<aon:div styleClass="menu-panel-option">
							<aon:commandLink>
								<aon:outputText value="school" styleClass="material-icons" />
								<aon:outputText value="Índice contenidos" />
								<f:setPropertyActionListener target="#{help.file}"
								value="#{help.homeFile}" />
							</aon:commandLink>
						</aon:div>
					</aon:form>
					
					
			<aon:form>
				<aon:div styleClass="menu-panel-option">
					<aon:commandLink id="linksButton" reRender="linksWindowPanel">
						<aon:outputText value="link" styleClass="material-icons" />
					<aon:outputText value="Enlaces de interés" />
						<f:setPropertyActionListener target="#{help.linksEnabled}" value="#{true}" />
					</aon:commandLink>
				</aon:div>
			</aon:form>
				<!-- <aon:div styleClass="menu-panel-option">
					<aon:outputText value="link" styleClass="material-icons" />
					<aon:outputText value="Enlaces de interés" />
				</aon:div> -->
				
			</aon:div>
		</aon:div>
		
	
		<!-- SUPPORT / CAU -->
		<aon:div styleClass="menu-panel" id="support">
			<aon:div styleClass="menu-panel-title"
				onclick="togglePanel('support')">
				<aon:outputText value="expand_more" styleClass="material-icons" />
				<aon:outputText value="Soporte / CAU" />
			</aon:div>
			<aon:div styleClass="menu-panel-options">
				
				<aon:form>
					<aon:div styleClass="menu-panel-option">
						<aon:commandLink action="portal_cau_messenger">
							<aon:outputText value="support_agent" styleClass="material-icons" />
							<aon:outputText value="Incidencias" />
						</aon:commandLink>
					</aon:div>
				</aon:form>

				<aon:form rendered="#{!desktop.state.supportEnabled and (!domainSwitcher.adminDomain or (domainSwitcher.adminDomain and desktop.state.adminRole))}">
					<aon:div styleClass="menu-panel-option">
						<aon:commandLink id="enableSupport" reRender="support"
								actionListener="#{desktop.onEnableSupport}">
							<aon:outputText value="cast" styleClass="material-icons" />
							<aon:outputText value="Activar soporte" />
						</aon:commandLink>
					</aon:div>
				</aon:form>
				<aon:form rendered="#{desktop.state.supportEnabled and (!domainSwitcher.adminDomain or (domainSwitcher.adminDomain and desktop.state.adminRole))}">
					<aon:div styleClass="menu-panel-option">
						<aon:commandLink id="disableSupport" reRender="support"
								actionListener="#{desktop.onDisableSupport}">
							<aon:outputText value="cast_connected" styleClass="material-icons" />
							<aon:outputText value="Desactivar soporte" />
						</aon:commandLink>
					</aon:div>
				</aon:form>
				
			</aon:div>
		</aon:div>
	
	
		<!-- INFORMATION -->
		<aon:div styleClass="menu-panel" id="contact">
			<aon:div styleClass="menu-panel-title"
				onclick="togglePanel('contact')">
				<aon:outputText value="expand_more" styleClass="material-icons" />
				<aon:outputText value="INFORMACIÓN" />
			</aon:div>
			
			<aon:div styleClass="menu-panel-options">
			
			<aon:form>
				<aon:div styleClass="menu-panel-option">
					<aon:commandLink id="notificationButton" reRender="notificationWindowPanel">
						<aon:outputText value="rss_feed" styleClass="material-icons" />
						<aon:outputText value="Notificaciones" />
						<f:setPropertyActionListener target="#{help.notificationsEnabled}" value="#{true}" />
					</aon:commandLink>
				</aon:div>
			</aon:form>
			
<!-- 				<a class="menu-panel-option" href="tel:945121010"> <aon:outputText
						value="phone" styleClass="material-icons" /> <aon:outputText
						value="Atención telefónica" />
				</a>
	
				<a class="menu-panel-option" href="mailto:soporte@aonsolutions.es"
					target="_blank"> <aon:outputText value="email"
						styleClass="material-icons" /> <aon:outputText
						value="Contacto vía email" />
				</a> -->
				<aon:form>
					<aon:div styleClass="menu-panel-option">
						<aon:commandLink id="about" reRender="aboutWindowPanel"
								rendered="#{!aonConfiguration.properties.hideMenuAbout}">
							<aon:outputText value="info" styleClass="material-icons" />
							<aon:outputText value="Acerca de ..." />
							<f:setPropertyActionListener target="#{aonConfiguration.properties.showAbout}" value="#{true}" />
						</aon:commandLink>
					</aon:div>
				</aon:form>
			</aon:div>
		</aon:div>
	</aon:div>


</ui:composition>
