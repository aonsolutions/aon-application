<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:div styleClass="box-column list">
		<ui:repeat value="#{vimeo.videos.orElse(null)}" var="video">
			<aon:div styleClass="list-item"
				onclick="window.open('#{video.getLink()}', '_blank');">
				<aon:outputText value="smart_display"
					styleClass="icon file material-icons" />
				<aon:outputText value="#{vimeo.getVideoName(video)}" />
			</aon:div>
		</ui:repeat>
	</aon:div>

</ui:composition>
