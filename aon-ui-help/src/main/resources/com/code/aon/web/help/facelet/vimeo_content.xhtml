<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

	<script>
		function toggleVideos(containerId) {
			var videoContainer = document.getElementById(containerId);
			if (videoContainer) {
				videoContainer.style.display = videoContainer.style.display === "none" ? "block"
						: "none";
			}
		}

		function displayVideo(link) {
			var container = link.parentElement.querySelector(".ifrmContainer");
			if (container) {
				container.style.display = container.style.display === "none" ? "block"
						: "none";
			}
		}
	</script>

	<aon:form id="vimeoContentForm">

		<aon:div id="vimeoContent">

			<aon:div styleClass="box-column list">
					
				<ui:fragment rendered="#{vimeo.showVimeo}">
				
					<ui:repeat value="#{vimeo.mainItems}" var="vimeoItem">
				
						<!-- folder -->
						<ui:fragment rendered="#{vimeoItem.getRawType() == 'folder'}">
							<aon:commandLink styleClass="list-item" reRender="vimeoContent">
								<f:setPropertyActionListener target="#{vimeo.selectedFolder}"
									value="#{vimeoItem.getFolder()}" />
	
								<aon:outputText value="smart_display"
									styleClass="icon file material-icons" />
								<aon:outputText value="#{vimeoItem.getFolder().getName()}" />
							</aon:commandLink>
						</ui:fragment>
	
	
						<!-- video -->
						<ui:fragment rendered="#{vimeoItem.getRawType() == 'video'}">
								<aon:div styleClass="list-item"
									onclick="displayVideo(this);return;">
									<aon:outputText value="smart_display"
										styleClass="icon file material-icons" />
									<aon:outputText value="#{vimeoItem.getVideo().getName()}" />
									<div class="ifrmContainer"
										style="display: none; justify-content: center; width: 100%; margin-bottom: 10px;">
										<iframe src="#{vimeoItem.getVideo().getLink()}"
											style="min-width: 680px;" width="50%" height="480"
											frameBorder="0" allow="autoplay"
											allowfullscreen="allowfullscreen"></iframe>
									</div>
								</aon:div>
						</ui:fragment>
						
					</ui:repeat>
					
					</ui:fragment>
				
			</aon:div>
		</aon:div>
	</aon:form>
</ui:composition>
