<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{accountManagerSupplier}" />
		<ui:param name="columnClasses" value="aon-editDataTable-textColumn" />
		<ui:define name="columns">
			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="Supplier_id"
						value="#{supplierBundle.supplier_supplier}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.accountDescription}" />
				<aon:div styleClass="aon-lookup" rendered="#{formEdit}">
					<a4j:region>
						<aon:lookupInputText id="Supplier_id"
							value="#{accountManagerSupplier.to.supplier.registry.id}" size="5"
							lookupProperty="registry" lookup="#{supplierLookup}"
							lookupChangeListener="#{accountManagerSupplier.supplierChanged}"
							reRender="Supplier_full_name" ajaxSingle="true" required="true" />
						<aon:lookupButton
							windowTitle="#{supplierBundle.supplier_selection}"
							minHeight="460" minWidth="650"
							property="#{accountManagerSupplier.to.supplier.registry}"
							lookupProperty="registry" lookup="#{supplierLookup}"
							lookupChangeListener="#{accountManagerSupplier.supplierChanged}"
							selectReRender="Supplier_id,Supplier_full_name"
							actionType="search">
						</aon:lookupButton>
						<aon:lookupButton windowTitle="#{supplierBundle.supplier_new}"
							minWidth="650" minHeight="600"
							property="#{accountManagerSupplier.to.supplier.registry}"
							lookupProperty="registry" lookup="#{supplierLookup}"
							selectReRender="Supplier_id,Supplier_full_name" actionType="new">
						</aon:lookupButton>
						<aon:inputText id="Supplier_full_name"
							value="#{accountManagerSupplier.to.accountDescription}" disabled="true"
							size="60" />
					</a4j:region>
				</aon:div>
				<f:facet name="footer">
				<aon:div styleClass="aon-lookup" rendered="#{formNew}">
					<a4j:region>
						<aon:lookupInputText id="Supplier_id-New"
							value="#{accountManagerSupplier.to.supplier.registry.id}" size="5"
							lookupProperty="registry" lookup="#{supplierLookup}"
							lookupChangeListener="#{accountManagerSupplier.supplierChanged}"
							reRender="Supplier_full_name-New" ajaxSingle="true" required="true" />
						<aon:lookupButton
							windowTitle="#{supplierBundle.supplier_selection}"
							minHeight="460" minWidth="650"
							property="#{accountManagerSupplier.to.supplier.registry}"
							lookupProperty="registry" lookup="#{supplierLookup}"
							lookupChangeListener="#{accountManagerSupplier.supplierChanged}"							
							selectReRender="Supplier_id-New,Supplier_full_name-New"
							actionType="search">
						</aon:lookupButton>
						<aon:lookupButton windowTitle="#{supplierBundle.supplier_new}"
							minWidth="650" minHeight="600"
							property="#{accountManagerSupplier.to.supplier.registry}"
							lookupProperty="registry" lookup="#{supplierLookup}"
							selectReRender="Supplier_id-New,Supplier_full_name-New"
							actionType="new">
						</aon:lookupButton>
						<aon:inputText id="Supplier_full_name-New"
							value="#{accountManagerSupplier.to.accountDescription}" disabled="true"
							size="60" />
					</a4j:region>
				</aon:div>
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
