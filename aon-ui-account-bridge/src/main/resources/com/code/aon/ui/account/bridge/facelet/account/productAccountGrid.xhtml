<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{accountManagerProduct}" />
		<ui:param name="columnClasses"
			value="aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
		<ui:param name="newCancelButtonReRender"
			value="accountManagerProductDiv" />
		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="Item_id" value="#{productBundle.product_item}" />
				</f:facet>
				<aon:outputText value="#{to.accountDescription}" rendered="#{formList}" />
				<ui:decorate template="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupTo" value="#{accountManagerProduct.to.product}" />
					<ui:param name="lookupForProduct" value="#{true}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<aon:methodParam name="lookupChangeListener" value="#{accountManagerProduct.itemChanged}" type="lookupChangeListener" />
				</ui:decorate>
				<f:facet name="footer">
					<ui:decorate template="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
						<ui:param name="lookupForProduct" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupTo" value="#{accountManagerProduct.to.product}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="lookupSuffix" value="-New" />
						<aon:methodParam name="lookupChangeListener" value="#{accountManagerProduct.itemChanged}" type="lookupChangeListener" />
					</ui:decorate>
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
