<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div styleClass="aon-scroll-area">
		<aon:panelGrid id="itemDetail" columns="2"
			columnClasses="detailImageColumn, detailInfoColumn">
			<aon:div id="item-detail-image" styleClass="item-detail-image">
				<h:graphicImage
					style="width:70px; height: 70px;"
					rendered="#{shopItem.item.thumbnail == null}" 
					value="/css/images/nophoto.gif" />
				<a4j:mediaOutput element="img" cacheable="false"
					value="#{shopItem.item.id}" style="width:70px; height: 70px;"
					createContent="#{shopItem.paintThumbnail}" />
			</aon:div>
			<aon:panelGrid columns="2">
				<aon:outputLabel value="#{bundle.aon_name}" />
				<aon:outputText value="#{shopItem.item.product.name}" />

				<aon:outputLabel value="#{bundle.aon_id}" />
				<aon:outputText value="#{shopItem.item.product.code}" />

				<aon:outputLabel value="#{productBundle.product_brand}" />
				<aon:outputText value="#{shopItem.item.product.brand}" />

				<aon:outputLabel value="#{productBundle.product_category}" />
				<aon:outputText value="#{shopItem.item.product.category.name}" />

				<aon:outputLabel value="#{bundle.aon_price}" />
				<aon:outputText value="#{shopItem.item.price}">
					<f:convertNumber pattern="#,##0.00"/>
				</aon:outputText>

				<aon:outputLabel value="#{bundle.aon_description}" />
				<aon:outputText value="#{shopItem.item.description}" />
			</aon:panelGrid>
		</aon:panelGrid>

			</rich:dataGrid>
		</aon:panel>
 -->
	</aon:div>

</ui:composition>
