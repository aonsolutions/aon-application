<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="userLoginForm">

			<aon:div styleClass="menu" />
			
			<aon:div styleClass="back-button" >
				<aon:commandButton id="aonToolbar-back" value="#{bundle.aon_back}"
					action="shop_form"
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					immediate="true" accesskey="#{bundle.aon_key_cancel}" />
			</aon:div>
				
			<aon:panelGrid columns="2" columnClasses="registryColumn, registryColumn">
				<aon:div styleClass="user-login-box">
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{ecommerceBundle.aon_ecommerce_user_identification}" />
						</f:facet>
						<aon:div style="padding-bottom:20px;">
							<aon:outputText value="#{bundle.aon_login_label}" />
						</aon:div>
						<aon:panelGrid columns="2" dir="true">
							<aon:outputLabel for="Login" value="#{ecommerceBundle.aon_ecommerce_user_name}" />
							<aon:inputText id="Login" required="false" 
								value="#{userLogin.login}" />
	
							<aon:outputLabel for="Password" value="#{ecommerceBundle.aon_ecommerce_user_passwd}" />
							<aon:inputSecret id="Password" required="false"
								value="#{userLogin.password}" />
	
							<aon:commandLink id="login-request-buttom" 
								value="#{ecommerceBundle.aon_ecommerce_login_request}"
								style="color:#000;"
								styleClass="aon-icon-login-request">
								<aon:actionListener method="#{userLogin.onLoginRequest}" />
							</aon:commandLink>
							<aon:commandButton id="login-buttom" 
								value="#{bundle.aon_accept}"
								action="paymethod_form"
								styleClass="aon-finding-toolbar-item aon-icon-accept">
								<aon:actionListener method="#{userLogin.onLogin}" />
							</aon:commandButton>
						</aon:panelGrid>
					</aon:panel>
				</aon:div>
	
				<aon:div styleClass="new-user-registry">
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{ecommerceBundle.aon_ecommerce_user_registry}" />
						</f:facet>
						<aon:div style="padding-bottom:20px;">
							<aon:outputText value="#{ecommerceBundle.aon_ecommerce_new_login_request}" />
						</aon:div>
						<aon:div>
							<aon:commandButton id="newUser-buttom" value="#{ecommerceBundle.aon_ecommerce_user_new}"
								action="new_registry_form"
								styleClass="aon-finding-toolbar-item aon-icon-new-user">
								<aon:actionListener method="#{shoppingCart.onResetTarget}" />
							</aon:commandButton>
						</aon:div>
	
					</aon:panel>
				</aon:div>
				
			</aon:panelGrid>
		</aon:form>
	</ui:define>
</ui:composition>
