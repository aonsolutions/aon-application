<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<rich:dataGrid id="productGrid" value="#{shopItems.model}" var="attach" 
		columns="3" elements="6">
         <aon:panel style="width:200px;height:200px;">
             <f:facet name="header">
                 <aon:outputText value="#{attach.product.code}" />
             </f:facet>
             
             <aon:outputText value="#{attach.product.name}" />
             <aon:commandButton value="+ info -i18n-"
				action="shopItem_grid"
				accesskey="#{bundle.aon_key_accept}"
				styleClass="aon-finding-toolbar-item aon-icon-info" >
				<aon:actionListener method="#{shopItems.onSelect}" />
			</aon:commandButton>
<!--  
             <h:panelGrid columns="2">
                 <h:outputText value="mimetype -i18n-" styleClass="label"></h:outputText>
                 <h:outputText value="#{attach.mimetype}" />
                 <h:outputText value="description -i18n-" styleClass="label"></h:outputText>
                 <aon:outputText value="#{attach.product.name}" />
                 <h:outputText value="data -i18n-" styleClass="label"></h:outputText>
                 <h:outputText value="#{attach.type}" />
                 <h:outputText value="type -i18n-" styleClass="label"></h:outputText>
                 <h:outputText value="#{attach.type}" />
             </h:panelGrid>
-->
         </aon:panel>
     </rich:dataGrid>

	<aon:dataScroller for="productGrid"
		rowCount="#{shopItems.model.rowCount}" showNote="true" />
</ui:composition>
