<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

		<aon:div styleClass="aon-scroll-area">
			<aon:dataTable id="cartList" value="#{shoppingCart.model}" rows="20"
				var="to" style="width:100%"
				columnClasses="
				aon-editDataTable-numberColumn,aon-editDataTable-textColumn,
				aon-editDataTable-numberColumn,aon-editDataTable-numberColumn,
				aon-editDataTable-numberColumn">

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_id}" />
					</f:facet>
					<aon:outputText value="#{to.item.id}" />
				</aon:column>
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_name}" />
					</f:facet>
					<aon:outputText value="#{to.item.product.name}" />
				</aon:column>
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{ecommerceBundle.aon_ecommerce_quantity}" />
					</f:facet>
					<aon:outputText value="#{to.quantity}" size="2" maxlength="3" >
						<f:convertNumber pattern="#,##0" />
					</aon:outputText>
				</aon:column>
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{ecommerceBundle.aon_ecommerce_price}" />
					</f:facet>
					<aon:outputText value="#{to.item.price}" >
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
				</aon:column>
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{ecommerceBundle.aon_ecommerce_amount}" />
					</f:facet>
					<aon:outputText value="#{to.total}" />
					<f:facet name="footer">
						<aon:outputText value="#{shoppingCart.total} &#160; (#{ecommerceBundle.aon_ecommerce_vat_included})" >
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</f:facet>
				</aon:column>
			</aon:dataTable>

		</aon:div>

</ui:composition>
