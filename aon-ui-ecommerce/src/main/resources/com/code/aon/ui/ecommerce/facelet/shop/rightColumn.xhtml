<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	
		<!--  
						<aon:panelGrid id="productSearchPanel" columns="1"
							style="width=100%;">
							<aon:outputLabel for="Item_product_name"
								value="#{bundle.aon_search}" />
						</aon:panelGrid>
							-->
		<aon:div id="search-box">
			<aon:inputText id="Item_product_name"
				value="#{shopItemsSearch.search}" size="25" maxLength="64" />
			<aon:commandLink id="search_bottom" value="&#160;"
				styleClass="aon-icon-commandButton-right aon-icon-search"
				title="#{bundle.aon_search}" accesskey="#{bundle.aon_key_accept}"
				reRender="itemContent">
				<aon:outputText value="&#160;" />
				<aon:actionListener method="#{shopItemsSearch.onSearch}" />
			</aon:commandLink>
		</aon:div>

		<rich:spacer height="20" />

		<aon:div id="login-box">
			<aon:panelGrid columns="2" dir="true" rendered="#{shop.logged}">
				<aon:outputLabel for="User" value="Bienvenido -i18n-" />
				<aon:outputText id="User" value="#{userLogin.login}" size="5" />
			</aon:panelGrid>

			<aon:panelGrid columns="2" dir="true" rendered="#{! shop.logged}">
				<aon:outputLabel for="Login" value="login -i18n-" />
				<aon:inputText id="Login" value="#{userLogin.login}" size="5" />

				<aon:outputLabel for="Password" value="password -i18n-" />
				<aon:inputText id="Password" value="#{userLogin.password}" size="5" />
			</aon:panelGrid>

			<aon:commandButton id="login-buttom" 
				value="Aceptar -i18n-"
				action="shop_form"
				rendered="#{! shop.logged}"
				styleClass="aon-finding-toolbar-item aon-icon-accept">
				<!--  
				-->
				<aon:actionListener method="#{userLogin.onLogin}" />
			</aon:commandButton>
		</aon:div>

		<rich:spacer height="20" />

		<aon:div id="list-info-box">
			<aon:panelGrid columns="2" dir="true">
				<aon:commandButton id="lateral-view" rendered="true"
					value="VIEW CART -i18-" action="shop_from" immediate="true"
					styleClass="aon-finding-toolbar-item aon-icon-new">
					<aon:actionListener method="#{shop.onViewCart}" />
				</aon:commandButton>
				<aon:outputText value="&#160;" />
	
				<aon:outputLabel for="cart_quantity" value="CANTIDAD -i18n-" />
				<aon:outputText id="cart_quantity" value="#{shoppingCart.quantity}" />
	
				<aon:outputLabel for="cart_total" value="TOTAL -i18n-" />
				<aon:outputText id="cart_total" value="#{shoppingCart.total}" />
			</aon:panelGrid>
		</aon:div>
		


</ui:composition>
