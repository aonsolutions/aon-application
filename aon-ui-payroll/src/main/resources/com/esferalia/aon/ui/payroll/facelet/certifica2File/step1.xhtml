<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/certifica2File/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.certifica2File_step1}" />
	</ui:define>

	<ui:define name="step_content">

		<aon:div styleClass="aon-scroll-area" id="remesaData">
			<aon:dataTable id="remesaDataTable" value="#{certifica2FileWizard.model}"
				var="to" rows="20" 
				columnClasses="
				aon-editDataTable-iconColumn, 
				aon-editDataTable-textColumn, 
				aon-editDataTable-textColumn">
					
					<aon:column>
					<f:facet name="header">
						<aon:div layout="none">
							<aon:commandButton id="selectButton" 
								actionListener="#{certifica2FileWizard.onSelectAll}"
								reRender="remesaData"
								onclick="if (!confirm('Desea marcar #{certifica2FileWizard.model.rowCount} filas?')) {return false;}"
								value="&#160;" style="margin-right: 0px;"
								styleClass="aon-editDataTable-button aon-icon-checkAll aon-vertical-align-top" />
							<aon:commandButton id="deselectButton" 	
								actionListener="#{certifica2FileWizard.onDeselectAll}"
								reRender="remesaData"
								onclick="if (!confirm('Desea desmarcar #{certifica2FileWizard.model.rowCount} filas?')) {return false;}"
								value="&#160;" style="margin-right: 0px;"
								styleClass="aon-editDataTable-button aon-icon-checkNone aon-vertical-align-top" />
						</aon:div>
					</f:facet>
					<aon:selectBooleanCheckbox id="checkMessage" value="#{to.selected}"
						style="cursor: default;" styleClass="aon-vertical-align-middle">
						<a4j:support event="onclick"
							reRender="checkMessage"  />
					</aon:selectBooleanCheckbox>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.payroll_enterprise}" />
					</f:facet>
					<aon:outputText value="#{to.certificate.enterprise.registry.name}" >
						<aon:abbreviateConverter maxWidth="50" />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_date}" />
					</f:facet>
					<aon:outputText value="#{to.certificate.date}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.certifica2File_batch_status}" />
					</f:facet>
					<aon:outputText value="#{to.certificate.status}" />
				</aon:column>
			</aon:dataTable>
			<aon:dataScroller2 for="remesaDataTable" showNote="true" />

		</aon:div>
	</ui:define>

</ui:composition>
