<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="embargoModalContainer">
		<c:if test="#{controller.modalPanelVisible}">
			<rich:modalPanel id="embargoModalPanel" minHeight="600"
				minWidth="900" showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{payrollBundle.payroll_salary_embargos_tab}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{controller.onCancel}"
							reRender="embargoModalContainer,#{container}" immediate="true">
							<aon:actionHotKey key="esc" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="embargoModalForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="embargoSave"
											value="#{bundle.aon_accept}"
											reRender="embargoModalContainer,#{container}"
											actionListener="#{controller.onSave}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
										</aon:commandButton>
										<aon:commandButton id="embargoCancel"
											value="#{bundle.aon_cancel}"
											reRender="embargoModalContainer,#{container}"
											actionListener="#{controller.onCancel}"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
										</aon:commandButton>
										<aon:commandButton id="embargoRemove"
											value="#{bundle.aon_remove}"
											rendered="#{!controller.new}"
											reRender="embargoModalContainer,#{container}"
											actionListener="#{controller.onRemove}"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-delete"
											onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;">
										</aon:commandButton>
									</aon:div>

									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panelGrid id="paymentMenuGrid" columns="2" dir="true" style="width: 80%;">
											<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/embargo/formContent.xhtml">
												<ui:param name="controller" value="#{controller}" />
											</ui:include>
										</aon:panelGrid>
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" rendered="#{!controller.new}">
										<aon:panelGrid columns="1" style="width: 100%; margin-top:10px;"
											columnClasses="aon-panelGrid-even  aon-width-auto">
											<aon:div>
												<aon:outputText value="&#160;" style="padding-left:15px;" styleClass="aon-icon-search"/>
												<aon:outputText value="#{payrollBundle.payroll_salary_embargos_detail}" 
													styleClass="aon-bold"/>
											</aon:div>
										</aon:panelGrid>
										<ui:include 
											src="/com/esferalia/aon/ui/payroll/facelet/salary/embargo/list_detail.xhtml" />
									</aon:div>

								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>
</ui:composition>
