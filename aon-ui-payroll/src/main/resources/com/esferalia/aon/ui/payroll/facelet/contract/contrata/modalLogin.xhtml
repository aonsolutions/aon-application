<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showContrataLoginWindow">
		<c:if test="#{contractContrata.showContrataLoginWindow}">
			<rich:modalPanel id="contrataLoginModalPanel" minHeight="180"
				minWidth="450" rendered="#{contractContrata.showContrataLoginWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_login}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showContrataLoginWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{contractContrata.showContrataLoginWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="contrataLoginForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="contrataCommunicationLogin-accept"
										value="#{bundle.aon_accept}"
										reRender="showContrataLoginWindow,contrataResponseContainer,contrataData,contractForm"
										rendered="#{!contractContrata.communicationResponseReceived}"
										actionListener="#{contractContrata.onSendContrataFile}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										onclick="Richfaces.showModalPanel('waitProccess')" 
		     							oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="contrataLoginModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{contractContrata.showContrataLoginWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="contrataQueryLogin-accept"
										value="#{bundle.aon_accept}"
										reRender="showContrataLoginWindow,contrataResponseContainer,contrataData,contractForm"
										rendered="#{contractContrata.communicationResponseReceived}"
										actionListener="#{contractContrata.onContrataDataQuery}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										onclick="Richfaces.showModalPanel('waitProccess')" 
		     							oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="contrataLoginModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{contractContrata.showContrataLoginWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="contataLogin-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showContrataLoginWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{contractContrata.showContrataLoginWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
							
								<c:if test="#{contractContrata.contrataTestEnv}">
									<aon:div style="color: red; font-weight:bold; width: 100%; text-align: center; margin-bottom: -1em;">
										<aon:outputText value="ENTORNO TEST ACTIVADO" />
									</aon:div>
								</c:if>
								
								<aon:div style="margin-top: 2em;">
								
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">
										
										<aon:panelGroup>
											<aon:outputLabel for="contrata-user" 
												value="#{payrollBundle.payroll_contract_contrata_user}" />
											<br />
											<aon:outputText value="#{payrollBundle.payroll_contract_contrata_user2}" />
										</aon:panelGroup>	
										<aon:inputText id="contrata-user" 
											required="#{true}" style="width: 100%;" 
											value="#{contractContrata.user}" />
										
										<aon:outputLabel for="contrata-passwd" 
											value="#{payrollBundle.payroll_contract_contrata_passwd}" />
										<aon:div id="contrata-passwd-div">
											<aon:inputSecret id="contrata-passwd" 
												required="#{true}" style="width: 100%;"
												rendered="#{!contractContrata.contrataPasswdVisible}"
												value="#{contractContrata.passwd}" />	
											<aon:inputText id="contrata-passwd-visible" 
												required="#{true}" style="width: 100%;"
												rendered="#{contractContrata.contrataPasswdVisible}"
												value="#{contractContrata.passwd}" />
											<!--  
											<aon:div style="padding-top: 5px;">
												<aon:selectBooleanCheckbox id="show-contrata-passwd" 
													value="#{contractContrata.contrataPasswdVisible}" >
													<a4j:support event="onclick"
														ignoreDumpResponses="true"
														limitToList="true"
														eventsQueue="loginConfirmation"	
														reRender="contrata-passwd-div" />
												</aon:selectBooleanCheckbox>
												<aon:outputLabel for="show-contrata-passwd"
													styleClass="aon-italic" 
													value="Mostrar contraseña" />
											</aon:div>
											-->
										</aon:div>

									</aon:panelGrid>

									<aon:div style="padding-top: 5px;">
										<aon:selectBooleanCheckbox id="Contrata_login_remember"
											value="#{contractContrata.contrataLoginRemember}" />
										<aon:outputLabel for="Contrata_login_remember"
											styleClass="aon-italic" 
											value="Recordar los datos identificativos" />
									</aon:div>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
				
				
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
