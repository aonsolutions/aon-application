<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
    	<a4j:region>
        	<h:form>
            	<a4j:poll id="poll" interval="500" enabled="#{contractContrata.pollEnabled}" 
            		reRender="poll,contrata-sepe-comunication,contrata-sepe-dataQuery,contrataResponseContainer" />
        	</h:form>
    	</a4j:region>
    	
		<aon:form id="contrataForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_contract_contrataData}" />
				<ui:param name="toolbarDescription" value="#{contractContrata.new?bundle.aon_reset:bundle.aon_editing}" />
				<ui:define name="toolbarContent">
				
					<aon:commandButton id="contrata-save"
						value="#{contractContrata.new?bundle.aon_accept:bundle.aon_save}"
						actionListener="#{contractContrata.onAccept}"
						action="contrata_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept" />
					<aon:commandButton id="contrata-cancel"
						immediate="true"
						value="#{contractContrata.new?bundle.aon_cancel:bundle.aon_back}"
						action="#{contractContrata.backAction}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel" />

					<aon:commandButton id="contrata-sepe-comunication"
						value="Comunicar al S.E.P.E."
						rendered="#{!contractContrata.new}"
						reRender="showContrataLoginWindow"
						styleClass="aon-finding-toolbar-item aon-icon-sincronize" >
						<f:setPropertyActionListener
							target="#{contractContrata.showContrataLoginWindow}"
							value="#{true}" />
					</aon:commandButton>
					
				</ui:define>				
			</ui:decorate>
		
			<aon:div id="contrataResponseContainer">
				<c:if test="#{contractContrata.xmlResult != null}" >
					<aon:div styleClass="aon-scroll-area" style="width:800px;">	
						
						<aon:panel style="width: 100%;">
							<f:facet name="header">
								<aon:outputText value="Respuesta obtenida del S.E.P.E. (ENTORNO DE PRUEBAS)" />
							</f:facet>
							<aon:outputText value="#{contractContrata.xmlResult}" escape="false" />
						</aon:panel>
						
					</aon:div>
				</c:if>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area" style="width:800px;">	
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/contrata/form_content.xhtml" />
			</aon:div>
					
		</aon:form>

		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />		

		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/contrata/modalLogin.xhtml" />		
		
	</ui:define>

</ui:composition>
