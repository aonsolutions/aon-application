<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="trabajadorList">
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="trabajadorData" value="#{parteITWizard.model}"
					var="to" rows="20" rendered="#{parteITWizard.model.rowCount > 0}"
					columnClasses="
					aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn">

					<aon:rowSelector action="parteITWizard_step3"
						actionListener="#{parteITWizard.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_documento}" />
						</f:facet>
						<aon:outputText value="#{to.persona.numdoc}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_nombre}" />
						</f:facet>
						<aon:outputText value="#{to.persona.descripcion} #{to.persona.apellido2}, #{to.persona.nombre}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_numss}" />
						</f:facet>
						<aon:outputText value="#{to.persona.numss}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_empresa}" />
						</f:facet>
						<aon:outputText value="#{to.empresa.descripcion}" />
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="trabajadorData" showNote="true" />
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
