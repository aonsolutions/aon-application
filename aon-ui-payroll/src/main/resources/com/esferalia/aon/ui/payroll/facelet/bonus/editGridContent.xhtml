<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<aon:dataTable id="ContractBonusTable" var="to" value="#{controller.model}" rows="0">
		<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton id="ContractBonus-select"
				title="#{bundle.aon_update}" 
				actionListener="#{controller.onEdit}"
				reRender="#{controller.beanName}ModalContainer"
				styleClass="aon-editDataTable-button aon-icon-rowSelector"
				focus="accountId" />
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton
						id="ContractBonus-reset" 
						title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						actionListener="#{controller.onReset}"
						reRender="#{controller.beanName}ModalContainer"
						styleClass="aon-editDataTable-button aon-icon-reset"
						accesskey="#{bundle.aon_key_new_line}"/>
				</aon:div>
			</f:facet>
		</aon:column>

		<c:if test="#{!skipStartDateColumn}">
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-120">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_start_date}" />
				</f:facet>
				<aon:outputText value="#{to.startDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
		</c:if>
		
		<c:if test="#{!skipEndDateColumn}">
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-120">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_end_date}" />
				</f:facet>
				<aon:outputText value="#{to.endDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
			</aon:column>
		</c:if>

<!--  
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.type}" />
		</aon:column>
-->		
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_amount}" />
			</f:facet>
			<aon:outputText value="#{to.expression}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_description}" />
			</f:facet>
			<aon:outputText value="#{(to.description!=null)?(to.description):(to.bonusConcept.description)}" />
		</aon:column>
	</aon:dataTable>
	
</ui:composition>
