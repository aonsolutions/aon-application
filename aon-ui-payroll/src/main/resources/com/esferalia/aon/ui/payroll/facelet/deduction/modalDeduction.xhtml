<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/esferalia/aon/ui/payroll/facelet/variables/modalGeneric.xhtml">
		<ui:param name="controller" value="#{controller}" />
		<ui:param name="popupWindowTitle" value="#{bundle.payroll_salary_deduction}" />
		
		<ui:define name="gridContent" >
			<aon:panelGrid id="#{controller.beanName}MenuGrid" columns="2" dir="true" style="width: 80%;">
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/formContent.xhtml">
					<ui:param name="controller" value="#{controller}" />
					<ui:param name="containerID" value="#{controller.beanName}MenuGrid" />
					<ui:param name="skipCurrentMonth" value="#{true}" />
					<aon:valueParam name="skipResult" default="#{controller.new}" />
				</ui:include>
			</aon:panelGrid>
		</ui:define>
		
		<ui:define name="afterModalContent" >
			<aon:lookupButtonPopup lookup="#{deductionConceptLookup}" />
		</ui:define>

	</ui:decorate>

</ui:composition>
