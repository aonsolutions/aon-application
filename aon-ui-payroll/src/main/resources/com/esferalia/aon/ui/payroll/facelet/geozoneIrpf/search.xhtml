<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="geozoneIrpfSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_geozoneIrpf_module}" />
				<ui:param name="controller" value="#{geozoneIrpf}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>
			
			<aon:methodParam name="searchAction" value="geozoneIrpf_list" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{geozoneIrpf}" />
				<ui:define name="searchContent">
					
					<aon:outputLabel for="GeozoneIrpf_administration"
						value="#{configBundle.config_administration}" />
					<aon:selectOneMenu id="GeozoneIrpf_administration"
						value="#{geozoneIrpf.administration}" >
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{geozoneIrpf.administrationList}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="GeozoneIrpf_year"
						value="#{payrollBundle.payroll_geozoneIrpf_financial_year}" />
					<rich:inputNumberSpinner id="GeozoneIrpf_year" 
						value="#{geozoneIrpf.year}"
		   				inputSize="4" minValue="2009" maxValue="2020">
		   			</rich:inputNumberSpinner>

				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>
</ui:composition>
