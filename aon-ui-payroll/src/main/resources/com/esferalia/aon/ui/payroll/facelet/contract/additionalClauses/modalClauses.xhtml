<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showContractClausesWindow">
		<c:if test="#{contractClauses.showContractClausesWindow}">
			<rich:modalPanel id="contractClausesModalPanel" minHeight="600"
				minWidth="725" showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.payroll_contract_additional_clauses}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showContractClausesWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{contractClauses.showContractClausesWindow}" value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="contractClausesModalForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="contractClausesSave"
											value="#{bundle.aon_save}"
											reRender="showContractClausesWindow, #{saveReRender}"
											actionListener="#{contractClauses.accept}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<f:setPropertyActionListener
												target="#{contractClauses.showContractClausesWindow}" value="#{false}" />
										</aon:commandButton>
									</aon:div>

									<aon:div id="clausesModalContent" style="width:710px;">
		
										<aon:panel rendered="#{contractClauses.existEnterpriseClauses}">
											<aon:selectBooleanCheckbox id="Enterprise_contractClauses"
												value="#{contractClauses.useEnterpriseClauses}" >
												<a4j:support event="onclick" reRender="clausesModalContent" />
											</aon:selectBooleanCheckbox>
											<aon:outputLabel for="Enterprise_contractClauses" styleClass="aon-margin-right"
												value="#{bundle.payroll_contract_additional_clauses_enterprise}" />
										</aon:panel>
										 
										<aon:div>
											<c:if test="#{!contractClauses.useEnterpriseClauses}">
												<aon:panel>
													<f:facet name="header">
														<aon:outputText value="#{bundle.payroll_contract_custom_clauses}" />
													</f:facet>
													<aon:inputTextarea 
														rendered="#{!contractClauses.useEnterpriseClauses}" 
														value="#{contractClauses.customClauses}"
														cols="133" rows="30"/>
												</aon:panel>
											</c:if>
										
											<c:if test="#{contractClauses.useEnterpriseClauses}">
												<aon:panelGrid columns="2" styleClass="aon-width-all" >
													<aon:outputLabel value="#{bundle.aon_document}" />
													<aon:selectOneMenu value="#{contractClauses.selectedEnterpriseClause}"
														disabled="#{!contractClauses.useEnterpriseClauses}" >
														<f:selectItems value="#{contractClauses.clausesList}" />
													</aon:selectOneMenu>
												</aon:panelGrid>
											</c:if>
										</aon:div>
										
									</aon:div>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>
</ui:composition>
