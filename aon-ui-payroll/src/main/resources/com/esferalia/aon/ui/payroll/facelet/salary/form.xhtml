<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salaryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_salary_module}" />
				<ui:param name="controller" value="#{salary}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				<ui:param name="skipSaveButton" value="true" />
				
				<ui:define name="beforeSpinToolbarContent">
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salary/buttons.xhtml" />
				</ui:define>
			</ui:decorate>

			<aon:div style="width: 840px; margin-top: 10px;">
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salary/formEditContent.xhtml" >
					<ui:param name="controller" value="#{salary}" />
				</ui:include>
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/payment/gridContent.xhtml" >
					<ui:param name="controller" value="#{salary.to.payments}" />
					<ui:param name="totalPayment" value="#{salary.to.totalPayment}" />
				</ui:include>
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/gridContent.xhtml" >
					<ui:param name="controller" value="#{salary.to.deductions}" />
					<ui:param name="embargo" value="#{salary.embargo}" />
					<ui:param name="totalDeduction" value="#{salary.to.totalDeduction}" />
				</ui:include>
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salary/formBases.xhtml" >
					<ui:param name="salaryTO" value="#{salary.to}" />
				</ui:include>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
	</ui:define>
</ui:composition>
