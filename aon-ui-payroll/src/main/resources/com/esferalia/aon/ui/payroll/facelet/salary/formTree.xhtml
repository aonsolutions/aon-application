<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/esferalia/aon/ui/payroll/facelet/enterpriseTree/treeTemplate.xhtml">

	<ui:define name="content">
	
		<aon:form id="salaryForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_salary_module}" />
				<ui:param name="toolbarDescription" value="&#160;" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="person"
						value="#{registryBundle.registry_person}"
						action="person_form" actionListener="#{enterpriseTree.onEditPerson}"
						styleClass="aon-finding-toolbar-item aon-icon-contact" >
						<f:setPropertyActionListener
							target="#{person.backAction}" value="contract_formTree" />
						<f:setPropertyActionListener
							target="#{person.backActionListener}" value="person.onBack" />													
					</aon:commandButton>
					<aon:commandButton id="contract"
						value="#{payrollBundle.payroll_contract}"
						action="contract_form" actionListener="#{contract.onEdit}"
						styleClass="aon-finding-toolbar-item aon-icon-category" >
						<f:setPropertyActionListener
							target="#{contract.backAction}" value="contract_formTree" />
						<f:setPropertyActionListener
							target="#{contract.backActionListener}" value="contract.onBack" />													
					</aon:commandButton>
					<c:if test="#{salary.model.rowCount > 0}" >
						<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salary/buttons.xhtml" />
					</c:if>
					<aon:htmlCommandLink id="calendarReport_list"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{calendarBundle.aon_calendar_calendar}"
						rendered="#{contract.to.calendar.id!=null}"
						action="#{report.onExecute}">
						<aon:actionListener method="#{contract.onLoadCalendar}" />						
						<aon:actionListener method="#{calendarPrint.onLoad}" />						
						<f:param name="reportKey" value="calendarReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
					<aon:spin id="enterpriseSpin" controller="#{salary}" />
				</ui:define>				
			</ui:decorate>		

			<aon:div styleClass="aon-scroll-area">
				
				<c:if test="#{salary.model.rowCount == 0}" >
					<aon:outputText value="#{payrollBundle.payroll_salary_no_salary_exist}" 
						styleClass="aon-bold aon-italic"/>
				</c:if>
				
				<c:if test="#{salary.model.rowCount > 0}" >
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salary/formSalary.xhtml" >
						<ui:param name="controller" value="#{salary}" />
					</ui:include>
				</c:if>

			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
	</ui:define>
</ui:composition>
