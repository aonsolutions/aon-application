<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/esferalia/aon/ui/payroll/facelet/enterpriseTree/treeTemplate.xhtml">

	<ui:define name="content">
	
		<aon:form id="contractDataForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_contract_variables}" />
				<ui:param name="toolbarDescription" value="&#160;" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="current"
						value="En curso"
						actionListener="#{contractData.onSearchCurrent}"
						styleClass="aon-finding-toolbar-item aon-icon-category" >
					</aon:commandButton>
					<aon:commandButton id="history"
						value="Historico"
						actionListener="#{contractData.onSearchAll}"
						styleClass="aon-finding-toolbar-item aon-icon-category" >
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>	
		
			<aon:div id="dataGrid" styleClass="aon-scroll-area">
				<ui:decorate	
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="controller" value="#{contractData}" />
					<ui:define name="columns">
				
						<ui:include 
							src="/com/esferalia/aon/ui/payroll/facelet/contract/data/list_content.xhtml" >
							<ui:param name="controller" value="#{contractData}" />
						</ui:include>
							
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
		
	</ui:define>
</ui:composition>
