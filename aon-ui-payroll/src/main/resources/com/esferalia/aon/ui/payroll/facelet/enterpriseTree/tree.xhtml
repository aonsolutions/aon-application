<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:form id="enterpriseTreeForm"  >
		<rich:tree id="enterpriseTree"
			
			selectedClass="aon-tree-node-active"
			highlightedClass="aon-tree-node-highlighted"			
			adviseNodeSelected="#{enterpriseTree.adviseNodeSelected}" 
			adviseNodeOpened="#{enterpriseTree.adviseNodeOpened}"
			componentState="#{enterpriseTree.state}"
			nodeSelectListener="#{enterpriseTree.processSelection}"
			value="#{enterpriseTree.rootNode}" var="enterpriseNode" >

			<rich:treeNode styleClass="aon-width-all" 
				icon="#{enterpriseNode.type.icon}"
				onclick="storeTreeOffset();"
				iconLeaf="#{enterpriseNode.type.icon}" >
				<a4j:support event="onselected" reRender="aonContent"
					action="#{enterpriseNode.type.action}" />
				<aon:outputText style="font-size: 0.8em;"
					value="#{enterpriseNode.label}" >
					<aon:abbreviateConverter maxWidth="45" />
				</aon:outputText>
				<aon:outputText style="font-size: 0.8em;"
					rendered="#{enterpriseNode.count>0}"
					value=" (#{enterpriseNode.count})" >
				</aon:outputText>
			</rich:treeNode>
		</rich:tree>
	</aon:form>	
	
</ui:composition>
