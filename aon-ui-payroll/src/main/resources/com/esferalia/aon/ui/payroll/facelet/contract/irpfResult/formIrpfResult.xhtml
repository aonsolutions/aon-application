<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div style="margin-top: 10px;">
		<aon:panelGrid columns="3" style="margin:1em 0 0 1em;"
			columnClasses="aon-noborder, aon-border, aon-border">
			<aon:outputText value="Agencia Tributaria" styleClass="aon-bold"/>
			<aon:outputText value="CÁLCULO DE RETENCIONES - IRPF 2011" styleClass="aon-bold"/>
			<aon:outputText value="#{controller.to.effectiveDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:panelGrid>
	</aon:div>
	
	<aon:div style="margin-top: 10px;">
		<aon:panelGrid columns="1" style="margin:1em 0 0 1em;"
			columnClasses="aon-noborder">
			<aon:outputText value="La Agencia tributaria le comunica que, en relación con el perceptor que más abajo se indica y de acuerdo con los datos que
asimismo se relacionan, los resultados del cálculo efectuado son los siguientes:" styleClass="aon-bold"/>
		</aon:panelGrid>
	</aon:div>	
			
	<aon:div style="margin-top: 10px;">
		<aon:panelGrid columns="3" style="margin:1em 0 0 1em;"
			columnClasses="aon-noborder, aon-noborder, aon-border">
			
			<aon:outputText value="BASE PARA CALCULAR EL TIPO DE RETENCIÓN" />
			<aon:outputText value="&nbsp;" />
			<aon:outputText value="#{controller.to.baseIrpf}" >
				
			</aon:outputText>
			
			
		</aon:panelGrid>
	</aon:div>	

</ui:composition>
