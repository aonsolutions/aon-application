<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
		
		<ui:define name="columns">
			
			<c:if test="#{!skipPersonColumn}">
				<aon:column alias="Contract.person.registry.fullName"
					styleClass="aon-editDataTable-textColumn aon-nowrap">
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.employee_name}" />
					</f:facet>
					<aon:outputText value="#{to.person.registry.fullName}" />
				</aon:column>
			</c:if>
			
			<c:if test="#{aonConfiguration.bean.salary.showEnterpriseColumn and !skipEnterpriseColumn}">
				<aon:column alias="Contract.workPlace.enterprise.registry.fullName" styleClass="aon-editDataTable-textColumn aon-nowrap">
					<f:facet name="header">
						<aon:outputText value="#{companyBundle.company_enterprise}" />
					</f:facet>
					<aon:outputText value="#{to.workPlace.enterprise.registry.fullName}" />
				</aon:column>
			</c:if>
			
			<c:if test="#{!skipStartDateColumn}">
				<aon:column alias="Contract.startDate" styleClass="aon-editDataTable-dateColumn aon-nowrap">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_start_date}" />
					</f:facet>
					<aon:outputText value="#{to.startDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>		
				</aon:column>
			</c:if>
			
			<aon:column alias="Contract.endDate" styleClass="aon-editDataTable-dateColumn aon-nowrap">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_end_date}" />
				</f:facet>
				<aon:outputText value="#{to.endDate}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
			</aon:column>
	
		</ui:define>
	</ui:decorate>

</ui:composition>
