<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showEnterpriseSearchWindow">
		<c:if test="#{controller.showEnterpriseSearchWindow}">
			<rich:modalPanel id="enterpriseSearchModalPanel" minHeight="280"
				minWidth="650" rendered="#{controller.showEnterpriseSearchWindow}"
				showWhenRendered="true" zindex="100">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{payrollBundle.payroll_refine_search}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showListSearchWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showEnterpriseSearchWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="listSearchForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="listSearch-search"
										value="#{bundle.aon_search}"
										reRender="availableListContent"
										actionListener="#{controller.params.enterpriseFilter.onSearchAvailableEnterprises}"
										styleClass="aon-finding-toolbar-item aon-icon-search">
										<rich:componentControl for="enterpriseSearchModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showEnterpriseSearchWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="listSearch-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showEnterpriseSearchWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{controller.showEnterpriseSearchWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">
									
									<aon:outputLabel for="Enterprise_registry_name"
										styleClass="aon-outputLabel aon-nowrap"
										value="#{bundle.aon_company_name}" />
									<aon:inputText id="Enterprise_registry_name" size="40"
										value="#{controller.params.enterpriseFilter.name}" />
								
									<aon:outputLabel for="Enterprise_registry_alias"
										styleClass="aon-outputLabel aon-nowrap"
										value="#{bundle.aon_company_alias}" />
									<aon:inputText id="Enterprise_registry_alias" size="40"
										value="#{controller.params.enterpriseFilter.alias}" />
										
									<aon:outputLabel for="Enterprise_registry_document"
										value="#{bundle.aon_document}" />
									<aon:inputText id="Enterprise_registry_document" size="12"
										value="#{controller.params.enterpriseFilter.document}" />

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
				
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
