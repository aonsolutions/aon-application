<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<c:if test="#{!payrollAppParams.skipPayrollData}" >
		<aon:div styleClass="aon-group">
			<aon:div styleClass="aon-group-title">
				<aon:outputText value="#{bundle.aon_salaries}"/>
			</aon:div>
			<aon:div styleClass="aon-group-body"> 
				<aon:div styleClass="aon-group-body-internal">
					<aon:panelGrid columns="2">
						<aon:outputLabel for="salary_model"
							value="#{bundle.company_enterprise_params_salary_model}" />
						<aon:selectOneMenu id="salary_model"
							value="#{payrollAppParams.parameters['PAY_REPORT_salary_PAY'].value}">
							<f:selectItems value="#{companyCollections.salaryTemplates}" />
						</aon:selectOneMenu>
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:div>
	</c:if>
	
	<aon:div styleClass="aon-group">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{bundle.payroll_contract_newContractData}"/>
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
				<aon:panelGrid columns="2" columnClasses="aon-vertical-align-top,aon-vertical-align-top">

					<aon:panelGrid columns="2">
						<aon:outputLabel for="contract_default_code" 
							value="#{bundle.payroll_contract_contract_code}" />
						<aon:selectOneMenu id="contract_default_code"
							value="#{payrollAppParams.parameters['PAY_default_contractCode_PAY'].value}" >
							<f:selectItem itemValue="#{null}" itemLabel="-" />
							<f:selectItems value="#{payrollCollections.tc2List}" />
						</aon:selectOneMenu>
					</aon:panelGrid>
						
				</aon:panelGrid>	
			</aon:div>
		</aon:div>
	</aon:div>
	
	<ui:include src="/com/esferalia/aon/ui/sepe/facelet/params/form_content.xhtml" />

</ui:composition>
