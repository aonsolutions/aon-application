	<aon:div styleClass="aon-group" style="width: 700px;">
		<aon:div styleClass="aon-group-title">
			<aon:panelGroup>
				<aon:outputText value="&#160;" styleClass="aon-icon2 aon-icon-winsuite"/>
				<aon:outputText value="Sistema RED"/>
			</aon:panelGroup>
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
			
				<aon:panelGrid id="Winsuite-authorizationKey" 
					columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-auto">
					
					<aon:outputLabel for="authorizationKey" 
						value="Clave autorizacion" />
					
					<aon:if test="#{payrollAppParams.winsuiteAuthorizationDefined or (!payrollAppParams.winsuiteAuthorizationDefined and !payrollAppParams.parentWinsuiteAuthorizationDefined)}">
						<aon:inputText id="authorizationKey" size="10" maxlength="8"
							value="#{payrollAppParams.parameters['PAY_authorization_key_PAY'].value}" >
							<f:validateLength maximum="8" />
						</aon:inputText>
					</aon:if>						
					<aon:if test="#{!payrollAppParams.winsuiteAuthorizationDefined and payrollAppParams.parentWinsuiteAuthorizationDefined}">
						<aon:div>
							<aon:outputText value="DATOS DEFINIDOS EN EL ENTORNO" styleClass="aon-bold" />
							<aon:commandButton ajaxSingle="#{true}"
								value="&#160;&#160;&#160;"
								title="#{bundle.admin_overload}"
								styleClass="aon-icon-commandButton aon-icon-edit aon-margin-left"
								actionListener="#{payrollAppParams.onRedefineWinsuiteAuthorization}" 
								reRender="Winsuite-authorizationKey" />
						</aon:div>
					</aon:if>
					
					<aon:outputLabel for="ssContactEmail" 
						value="Email de contacto" />
					<aon:inputText id="ssContactEmail" size="30" 
						value="#{payrollAppParams.parameters['PAY_ss_contact_email_PAY'].value}" >
					</aon:inputText>
						
				</aon:panelGrid>
				
				<aon:if test="#{!domainSwitcher.domainManagementAvailable}">
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="Seguros sociales"/>
						</f:facet>
						<aon:panelGrid columns="2" styleClass="aon-width-all"
							columnClasses="aon-panelGrid-odd aon-width-200, aon-panelGrid-even aon-width-auto">
							
							<aon:if test="#{!domainSwitcher.domainManagementAvailable}">
								<aon:outputLabel for="mutual" 
									value="#{bundle.payroll_mutual_at_ep}" />
								<aon:selectOneMenu id="mutual"
									value="#{payrollAppParams.parameters['PAY_ss_mutual_PAY'].value}" >
									<f:selectItem itemValue="#{null}" itemLabel="-" />
									<f:selectItems value="#{payrollCollections.mutualList}" />
								</aon:selectOneMenu>
									
								<aon:outputLabel for="ss_payment_bankAccount" 
									value="#{bundle.aon_bank_account} (Pago de cuotas)" />
								<aon:selectOneMenu id="ss_payment_bankAccount" 
									value="#{payrollAppParams.ssPaymentBankAccount}">
									<f:selectItem itemLabel="Pago electrónico" value="#{null}" />
									<f:selectItems value="#{companyCollections.allCompanyBanks}" />
								</aon:selectOneMenu>
							</aon:if>
							
						</aon:panelGrid>	
					</aon:panel>
				</aon:if>
