<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="irpfDataList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.payroll_model_145_module}" />
				<ui:param name="controller" value="#{irpfData}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{irpfData}" />
					
					<ui:define name="columns">
					
						<aon:column alias="IrpfData.contract.person.firstSurname,IrpfData.contract.person.registry.name" 
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.registry_person}" />
							</f:facet>
							<aon:div styleClass="aon-nowrap aon-width-all">
								<aon:div style="display:inline;">
									<aon:outputText value="#{to.contract.person.fullName}"/>
								</aon:div>
							</aon:div>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-300">
							<f:facet name="header">
								<aon:outputText value="#{bundle.payroll_contract_contract_type}" />
							</f:facet>
							<aon:outputText value="#{irpfData.rowContractCode}"
								title="#{irpfData.rowContractCode}" >
								<aon:abbreviateConverter maxWidth="40" />
							</aon:outputText>
						</aon:column>
						
						<aon:column alias="IrpfData.contract.startDate" 
							styleClass="aon-editDataTable-dateColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_start_date} contr." />
							</f:facet>
							<aon:outputText value="#{to.contract.startDate}" styleClass="aon-margin-left">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
						<aon:column alias="IrpfData.contract.endDate" 
							styleClass="aon-editDataTable-dateColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_end_date} contr." />
							</f:facet>
							<aon:outputText value="#{to.contract.endDate}" styleClass="aon-margin-left">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>		
						</aon:column>
						
						<aon:column alias="IrpfData.startDate" 
							styleClass="aon-editDataTable-dateColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.payroll_irpfData_validity} #{bundle.aon_date_from}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>		
						</aon:column>
					
						<aon:column alias="IrpfData.endDate" 
							styleClass="aon-editDataTable-dateColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.payroll_irpfData_validity} #{bundle.aon_date_to}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>		
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
						</aon:column>
						
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
