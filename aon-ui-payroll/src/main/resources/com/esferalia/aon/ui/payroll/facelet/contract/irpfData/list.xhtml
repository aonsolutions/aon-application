<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="irpfDataList">

			<aon:methodParam name="searchAction" value="irpfData_search" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.payroll_model_145_module}" />
				<ui:param name="controller" value="#{contract}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:methodParam name="rowSelectorAction" value="irpfData_form" />
				<aon:methodParam name="rowSelectorActionListener" value="#{irpfData.onSelectContract}" type="actionListener" />
				
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{contract}" />
					
					<ui:define name="columns">
					
						<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/listBasic.xhtml" >
							<ui:param name="skipEnterpriseColumn" value="true" />
						</ui:include>
						
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
