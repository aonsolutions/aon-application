<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/com/esferalia/aon/ui/payroll/facelet/agreement/treeTemplate.xhtml">

		<ui:define name="treeContent">
			<aon:form id="agreementForm">
				<c:if test="#{agreementTree.agreementSelected}">
					<ui:include src="agreementTreeContent.xhtml"/>
				</c:if>
				<c:if test="#{agreementTree.agreementLevelSelected}">
					<ui:include src="agreementLevelTreeContent.xhtml"/>
				</c:if>
			</aon:form>
			
			<ui:decorate template="/com/esferalia/aon/ui/payroll/facelet/payment/modalPayment.xhtml">
				<ui:param name="controller" value="#{agreementPayment}" />
				<ui:param name="skipCurrentMonth" value="#{true}" />
				<ui:param name="skipSearchOption" value="#{false}" />
				<ui:param name="contextDisabled" value="#{true}" />
				<ui:param name="container" value="agreementPaymentGrid" />
				
				<ui:define name="afterFormContent">
					<c:if test="#{agreementPayment.salaryExtra}" >
						<ui:include src="/com/esferalia/aon/ui/payroll/facelet/agreement/extra/form_content.xhtml" >
							<ui:param name="to" value="#{agreementPayment.agreementExtra}" />
						</ui:include>
					</c:if>
				</ui:define>
				
			</ui:decorate>
			
		</ui:define>

</ui:composition>
