<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:if test="#{fanBatch.nevv}" >
		<ui:decorate template="/com/esferalia/aon/ui/payroll/facelet/batch/fan/form_new.xhtml" />
	</aon:if>
	
	<aon:if test="#{!fanBatch.nevv}" >
		<ui:decorate template="/com/esferalia/aon/ui/payroll/facelet/batch/form.xhtml">
			<ui:param name="toolbarTitle" value="#{bundle.payroll_fanBatchWizard_module}" />
			<ui:param name="controller" value="#{fanBatch}" />
			<ui:param name="controllerDetail" value="#{fanBatchDetail}" />
			<ui:param name="controllerAttach" value="#{fanBatchAttach}" />
			
			<ui:define name="moreToolbarContent" >
				<aon:if test="#{domainSwitcher.domainManagementAvailable or controller.editableSelectedTo}" >
					<aon:htmlCommandLink id="quote-excel-report"
						rendered="#{fanBatch.recorded}"
						value="#{bundle.aon_listing}"
						target="_blank" action="#{fanBatch.onQuoteExcelReport}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
					</aon:htmlCommandLink>
				</aon:if>
			</ui:define>
			
			<ui:define name="batchContent" >
				<aon:panelGrid id="info-panel" columns="4" styleClass="aon-width-all"
					columnClasses="
					aon-panelGrid-odd aon-width-100, aon-panelGrid-even aon-width-250,
					aon-panelGrid-odd aon-width-100, aon-panelGrid-even aon-width-auto
					" >
					<aon:outputLabel value="#{bundle.aon_period}" />
					<aon:div>
						<h:panelGrid columns="2" rendered="#{!fanBatch.recorded}">
							<aon:selectOneMenu id="FanBatch_month" value="#{fanBatch.to.month}" >
								<f:selectItems value="#{commonCollections.months}"  />
							</aon:selectOneMenu>
							<rich:inputNumberSpinner id="FanBatch_year" value="#{fanBatch.to.year}"
				   				inputSize="4" minValue="2009" maxValue="2020">
				   			</rich:inputNumberSpinner>
						</h:panelGrid>
						<aon:outputText value="#{fanBatch.to.date}" rendered="#{fanBatch.recorded}" >
							<f:convertDateTime pattern="MMMMM yyyy"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:div>
					
					<aon:outputLabel value="#{bundle.aon_type}" />
					<aon:div>
						<aon:selectOneMenu id="FanBatch_liquidationType" value="#{fanBatch.to.liquidationType}"
							rendered="#{!fanBatch.recorded}" >
							<f:selectItems value="#{payrollCollections.liquidationTypes}"  />
						</aon:selectOneMenu>
						<aon:outputText value="#{fanBatch.to.liquidationType.value} - "
							rendered="#{fanBatch.recorded}" />
						<aon:outputText value="#{fanBatch.to.liquidationType}"
							rendered="#{fanBatch.recorded}" />
					</aon:div>
				</aon:panelGrid>
			
				<aon:if test="#{domainSwitcher.domainManagementAvailable or controller.editableSelectedTo}" >
					<aon:panelGrid id="actions-panel" columns="2" styleClass="aon-width-all"
						columnClasses="
						aon-panelGrid-odd aon-width-100, aon-panelGrid-even aon-width-auto,
						" >
						<aon:outputText value="#{bundle.finance_disk}" />
						<aon:div>
							<aon:commandButton id="fan-create-button" value="#{bundle.payroll_create_disk}"
								rendered="#{fanBatch.nevv or (!fanBatch.recorded and fanBatchDetail.model.rowCount > 0)}"
								reRender="batchForm"
								styleClass="aon-commandButton"
								actionListener="#{fanBatch.onCreateDisk}"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />						
	
							<aon:outputText value="Generado el "
								rendered="#{fanBatch.recorded}" />
							<aon:outputText value="#{fanBatch.to.outcomeFileDate}"
								rendered="#{fanBatch.recorded}"
								styleClass="aon-bold aon-margin-right" >
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							
							<aon:htmlCommandLink id="fan-download" target="_blank"
								value="&#160;" title="#{bundle.aon_fileupload_download}"
								rendered="#{fanBatch.recorded}"
								actionListener="#{fanBatch.onDownloadFile}"
								styleClass="aon-icon-commandButton aon-icon-mail-save aon-margin-left" >
							</aon:htmlCommandLink>
							<aon:commandButton id="fan-remove" 
								value="&#160;" title="#{bundle.aon_remove}" 
								rendered="#{fanBatch.recorded}"
								actionListener="#{fanBatch.onRemoveFile}"
								styleClass="aon-icon-commandButton aon-icon-delete aon-margin-left" />
							<aon:if test="#{aonRole.sysAdmin}">
								<aon:fileUpload id="attach_file" listWidth="100"
									fileUploadListener="#{fanBatch.fanFileUploaded}" >
									<f:facet name="label">
										<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
									</f:facet>
									<a4j:support event="onuploadcomplete" reRender="dataTable" />
								</aon:fileUpload>
							</aon:if>
						</aon:div>
					</aon:panelGrid>
				</aon:if>
			</ui:define>
			
			<ui:define name="batchedTabContent" >
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/fan/formDetail.xhtml" />
			</ui:define>
			
			<ui:define name="noBatchedTabContent" >
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/fan/formNoBatched.xhtml" />
			</ui:define>
			
			<ui:define name="documentTabContent" >
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/formDocument.xhtml" >
					<ui:param name="controllerAttach" value="#{fanBatchAttach}" />
				</ui:include>
			</ui:define>
			
			<ui:define name="afterFormContent" >
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/fan/modalSearch.xhtml">
					<ui:param name="controller" value="#{fanList}" />
					<ui:param name="searchReRender" value="listToolBarDiv, listDataDiv" />
				</ui:include>
			</ui:define>
			
		</ui:decorate>
	</aon:if>

</ui:composition>
