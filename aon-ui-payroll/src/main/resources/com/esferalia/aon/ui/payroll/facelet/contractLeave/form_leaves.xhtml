<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="contractLeaveDataList" 
		rendered="#{contractLeave.leaveModel.rowCount > 0}" 
		value="#{contractLeave.leaveModel}" var="leave" rows="20" >
		
		<aon:rowSelector actionListener="#{contractLeave.onSelectLeave}" />
		
		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="&#160;" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-50">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_id}" />
			</f:facet>
			<aon:outputText value="#{leave.id}">
				<aon:abbreviateConverter maxWidth="40" />
			</aon:outputText>
		</aon:column>
	
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_contractLeave_type}" />
			</f:facet>
			<aon:outputText value="#{leave.type}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_description}" />
			</f:facet>
			<aon:outputText value="#{leave.description}">
				<aon:abbreviateConverter maxWidth="40" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date_from}" />
			</f:facet>
			<aon:outputText value="#{leave.startDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date_to}" />
			</f:facet>
			<aon:outputText value="#{leave.endDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_contractLeave_dailyCgcBase}" />
			</f:facet>
			<aon:outputText value="#{leave.dailyCgcBase}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_contractLeave_dailyCgpBase}" />
			</f:facet>
			<aon:outputText value="#{leave.dailyCgpBase}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_contractLeave_dailyRegBase}" />
			</f:facet>
			<aon:outputText value="#{leave.dailyRegBase}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-50">
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_contractLeave_relapse}" />
			</f:facet>
			<aon:outputText value="#{leave.parent.id}" />
		</aon:column>
		
		<ui:include 
			src="/com/esferalia/aon/ui/payroll/facelet/contractLeave/leaveDetail_list.xhtml" />

	</aon:dataTable>

	<aon:dataScroller2 for="contractLeaveDataList"
		showNote="#{contractLeave.contract.id!=null}" />
		
</ui:composition>
