<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="contractTypeList">

			<aon:div ajaxRendered="true" layout="none">
			
				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{payrollBundle.employee_contractType_module}" />
					<ui:param name="controller" value="#{contractType}" />
				</ui:include>			

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">

					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{contractType}" />
						<ui:define name="columns">
						
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="ContractType_description"
										value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}"
									rendered="#{formList}" />
								<aon:inputText id="ContractType_description" required="true"
									rendered="#{formEdit}" size="32"
									value="#{controller.to.description}" maxlength="64" />
								<f:facet name="footer">
									<aon:inputText id="ContractType_description-New" required="true"
										rendered="#{formNew}" size="32"
										value="#{controller.to.description}" maxlength="64" />
								</f:facet>
							</aon:column>
							
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="ContractType_cccType"
										value="#{bundle.aon_type}" />
								</f:facet>
								<aon:outputText value="#{to.CCCType}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="ContractType_cccType" required="true"
									value="#{controller.to.CCCType}" rendered="#{formEdit}">
									<f:selectItems value="#{companyCollections.CCCTypes}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="ContractType_cccType-New" required="true"
										value="#{controller.to.CCCType}" rendered="#{formNew}">
										<f:selectItems value="#{companyCollections.CCCTypes}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="ContractType_duration"
										value="#{payrollBundle.employee_contractType_duration}" />
								</f:facet>
								<aon:outputText value="#{to.duration}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="ContractType_duration" required="true"
									value="#{controller.to.duration}" rendered="#{formEdit}">
									<f:selectItems value="#{employeeCollections.contractDurations}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="ContractType_duration-New" required="true"
										value="#{controller.to.duration}" rendered="#{formNew}">
										<f:selectItems value="#{employeeCollections.contractDurations}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="ContractType_workingDay"
										value="#{payrollBundle.employee_contractType_workingDay}" />
								</f:facet>
								<aon:outputText value="#{to.workingDay}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="ContractType_workingDay" required="true"
									value="#{controller.to.workingDay}" rendered="#{formEdit}">
									<f:selectItems value="#{employeeCollections.contractWorkingDays}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="ContractType_workingDay-New" required="true"
										value="#{controller.to.workingDay}" rendered="#{formNew}">
										<f:selectItems value="#{employeeCollections.contractWorkingDays}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
										
						</ui:define>
					</ui:decorate>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
