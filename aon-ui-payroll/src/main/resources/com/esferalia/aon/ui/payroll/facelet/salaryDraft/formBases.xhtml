<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">



	<aon:div style="margin-left: 5px;background-color:#f6f5e3;">
		
		<aon:panelGrid columns="2" style="width: 100%;margin-right:10px;"
			styleClass="aon-border"
			columnClasses="aon-noborder aon-padding-left aon-width-auto aon-vertical-align-bottom
						  ,aon-noborder aon-padding-right aon-width-150 aon-vertical-align-bottom aon-text-right aon-bold">
		
			<aon:div style="margin-left: 10px;">
				<aon:outputText value="1. #{payrollBundle.payroll_salary_bases_common}" styleClass="aon-bold"/>
			</aon:div>
			<aon:outputText value="&#160;"/>
			<aon:div style="margin-left: 20px; border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="#{payrollBundle.payroll_salary_bases_common_remuneration}" />
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{controller.to.salary.remuneration}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>

			<aon:div style="margin-left: 20px; border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="#{payrollBundle.payroll_salary_bases_common_extraPayProration}" />
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{controller.to.salary.extraPayProration}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>

			<aon:div style="border-bottom: solid #CCCCCC 1px; text-align: right;">
				<aon:outputText value="#{bundle.aon_total}" />
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{controller.to.salary.commonBase}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>


			<aon:div style="margin-left: 10px; border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="2. #{payrollBundle.payroll_salary_bases_professional}" styleClass="aon-bold"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{controller.to.salary.professionalBase}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>

			<aon:div style="margin-left: 10px; border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="3. #{payrollBundle.payroll_salary_bases_overtime}" styleClass="aon-bold"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{controller.to.salary.overtimeBase}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>

			<aon:div style="margin-left: 10px; border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="4. #{payrollBundle.payroll_salary_bases_irpf}" styleClass="aon-bold"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{controller.to.salary.irpfBase}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
			
		</aon:panelGrid>		
	</aon:div>

</ui:composition>
