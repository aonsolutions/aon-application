<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="streetTypeList">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.payroll_contract_mode_module}" />
			</ui:include>			

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<aon:dataTable id="contractModelList" value="#{contractModel.model}" var="to">
					
					<aon:rowSelector id="contractCodelList-select"  
						reRender="contractModelList"
						actionListener="#{contractModel.onSelectModel}" />
					
					<aon:column styleClass="aon-editDataTable-iconColumn aon-width-50">
						<aon:htmlCommandLink styleClass="aon-icon-pdf" style="padding-left: 15px;" 
							title="#{bundle.download_file}"
							target="_blank" value="&#160;"
							rendered="#{contractModel.pdfEnabled}"
							actionListener="#{contractModel.onDownloadContract}">
						</aon:htmlCommandLink>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
						<f:facet name="header">
							<aon:outputLabel 
								value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to}"/>
					</aon:column>
					
					<rich:subTable rendered="#{contractModel.selectedModel == to}"
						style="background-color: #FBEDB6;"
						value="#{contractModel.optionModel}"
						var="option" >
						<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto" style="background-color: #FBEDB6;">
						</aon:column>
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" style="background-color: #FBEDB6;">
							<aon:outputText value="#{option}" />
						</aon:column>
					</rich:subTable>
					
				</aon:dataTable>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
