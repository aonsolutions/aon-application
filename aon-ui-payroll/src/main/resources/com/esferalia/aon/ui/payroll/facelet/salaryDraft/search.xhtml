<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salaryDraftSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<aon:methodParam name="backAction" value="salaryDraft_list" />
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_salaryDraft_module}" />
				<ui:param name="controller" value="#{salaryDraft}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{salaryDraft}" />
				<ui:define name="searchContent">
				
					<aon:outputLabel for="Person_id"
						value="#{registryBundle.registry_person}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Person_id" lookup="#{personLookup}"
							reRender="Person_full_name"
							value="#{salaryDraftSearch.person.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{registryBundle.registry_person_selection}"
							selectReRender="Person_id,Person_full_name" actionType="search"
							lookup="#{personLookup}" minHeight="460" minWidth="650"
							property="#{salaryDraftSearch.person}">
						</aon:lookupButton>
						<aon:inputText id="Person_full_name"
							value="#{(salaryDraftSearch.person.registry.fullName!=null)?(salaryDraftSearch.person.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>

					<c:if test="#{aonConfiguration.bean.salaryDraft.showEnterpriseInSearch}">
						<aon:outputLabel for="Enterprise_id"
							value="#{companyBundle.company_enterprise}" />
						<aon:div styleClass="aon-lookup">
							<aon:lookupInputText id="Enterprise_id" lookup="#{enterpriseLookup}"
								reRender="Enterprise_full_name"
								value="#{salaryDraftSearch.enterprise.id}" size="5" />
							<aon:lookupButton 
								windowTitle="#{companyBundle.company_enterprise_selection}"
								selectReRender="Enterprise_id,Enterprise_full_name" actionType="search"
								lookup="#{enterpriseLookup}" minHeight="460" minWidth="650"
								property="#{salaryDraftSearch.enterprise}">
							</aon:lookupButton>
							<aon:inputText id="Enterprise_full_name"
								value="#{(salaryDraftSearch.enterprise.registry.fullName!=null)?(salaryDraftSearch.enterprise.registry.fullName):('')}"
								size="50" disabled="true" />							
						</aon:div>
					</c:if>
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
