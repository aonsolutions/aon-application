<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showContractSalaryInfoWindow">
		<c:if test="#{contract.showContractSalaryInfoWindow}">
			<rich:modalPanel id="salaryInfoModalPanel" 
				height="600" width="1000"
				showWhenRendered="true" zindex="90"
				style="overflow:auto;"
				>
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="SALARY INFO" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showContractSalaryInfoWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{contract.showContractSalaryInfoWindow}" value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="salaryInfoModalForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									
<aon:panel styleClass="aon-panelGrid-search" id="filterPanel" style="padding:5px;">
		<aon:panelGrid columns="5" 
			columnClasses="aon-panelGrid-odd aon-width-auto,
				aon-panelGrid-even aon-width-auto,aon-panelGrid-even aon-width-auto">
			<aon:outputText value="#{bundle.aon_period}:" />
			<aon:selectOneMenu value="#{contract.salaryInfoHandler.filterMonth}">
				<f:selectItems value="#{commonCollections.months}" />
				<a4j:support 
					event="onchange"
					actionListener="#{contract.salaryInfoHandler.onLoad}"
					reRender="filterPanel, contractDataPanel, contractPaymentPanel, contractDeductionPanel"
					eventsQueue="salaryInfoFilterKeyUp"
					requestDelay="200"
					ajaxSingle="true"
					ignoreDupResponses="true"
					limitToList="true"/>
			</aon:selectOneMenu>
			<rich:inputNumberSpinner value="#{contract.salaryInfoHandler.filterYear}"
				inputSize="4" minValue="2000" maxValue="2100">
				<a4j:support 
					event="onchange"
					actionListener="#{contract.salaryInfoHandler.onLoad}"
					reRender="filterPanel, contractDataPanel, contractPaymentPanel, contractDeductionPanel"
					eventsQueue="salaryInfoFilterKeyUp"
					requestDelay="200"
					ajaxSingle="true"
					ignoreDupResponses="true"
					limitToList="true"/>
			</rich:inputNumberSpinner>
	</aon:panelGrid>
</aon:panel>	
									
<aon:panel id="contractDataPanel">
	<f:facet name="header">
		<aon:outputText value="#{bundle.payroll_contract}" />
	</f:facet>
	<aon:dataTable id="contractDataTable" var="to" value="#{contract.salaryInfoHandler.contractDataModel}" rows="0">
		<aon:rowSelector id="contractDataTable-rowSelect" toggleOnClick="#{false}" />
		<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton id="contractDataTable-select"
				title="#{bundle.aon_selectMsg}" 
				reRender="contractDataTable"
				rendered="#{contract.salaryInfoHandler.selectedData.id != to.id}"
				actionListener="#{contract.salaryInfoHandler.onSelectData}"
				styleClass="aon-editDataTable-button #{contract.salaryInfoHandler.dataTrackingCount>0?'aon-icon-drop-down':'aon-icon-rowSelector'}"/>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_name}" />
			</f:facet>
			<aon:outputText value="#{to.name}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_value}" />
			</f:facet>
			<aon:outputText value="#{to.expression}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_start_date}" />
			</f:facet>
			<aon:outputText value="#{to.startDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_end_date}" />
			</f:facet>
			<aon:outputText value="#{to.endDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>		
		</aon:column>
		<aon:column styleClass="aon-editDataTable-buttonsColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:confirmButton id="contractDataTable-remove"
				title="#{bundle.aon_remove}" 
				immediate="true" reRender="contractDataTable"
				rendered="#{contract.salaryInfoHandler.selectedData.id==to.id}"
				confirmTitle="#{bundle.aon_confirm_title}"
				confirmMessage="#{bundle.aon_remove_confirm}"
				confirmActionListener="#{contract.salaryInfoHandler.onRemoveData}"
				styleClass="aon-editDataTable-button aon-icon-delete" />
			<aon:commandButton id="contractDataTable-cancel"
				title="#{bundle.aon_cancel}" 
				reRender="contractDataTable"
				rendered="#{contract.salaryInfoHandler.selectedData.id==to.id}"
				actionListener="#{contract.salaryInfoHandler.onCancelData}"
				styleClass="aon-editDataTable-button aon-icon-cancel" />
		</aon:column>
		<rich:subTable rendered="#{contract.salaryInfoHandler.selectedData.id == to.id}"
			style="background-color: #FBEDB6;"
			value="#{contract.salaryInfoHandler.dataTrackingModel}"
			var="detail" >
			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto" style="background-color: #FBEDB6;">
			</aon:column>
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" style="background-color: #FBEDB6;">
				<aon:outputText value="#{detail.name}" />
			</aon:column>
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" style="background-color: #FBEDB6;">
				<aon:outputText value="#{detail.expression}" />
			</aon:column>
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100" style="background-color: #FBEDB6;">
				<aon:outputText value="#{detail.startDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100" style="background-color: #FBEDB6;">
				<aon:outputText value="#{detail.endDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
			</aon:column>
			<aon:column styleClass="aon-editDataTable-buttonsColumn" style="background-color: #FBEDB6;">
			</aon:column>
		</rich:subTable>
	</aon:dataTable>
</aon:panel>
									
<aon:panel id="contractPaymentPanel">
	<f:facet name="header">
		<aon:outputText value="#{bundle.payroll_salary_payments_tab}" />
	</f:facet>
	<aon:dataTable id="contractPaymentTable" var="to" value="#{contract.salaryInfoHandler.paymentModel}" rows="0">
		<aon:rowSelector id="contractPaymentTable-rowSelect" toggleOnClick="#{false}" />
		<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton id="contractPaymentTable-select"
				title="#{bundle.aon_selectMsg}" 
				reRender="contractPaymentTable"
				rendered="#{contract.salaryInfoHandler.selectedPayment.id != to.id}"
				actionListener="#{contract.salaryInfoHandler.onSelectPayment}"
				styleClass="aon-editDataTable-button #{contract.salaryInfoHandler.paymentTrackingCount>0?'aon-icon-drop-down':'aon-icon-rowSelector'}"/>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.salaryType}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_concept}" />
			</f:facet>
			<aon:outputText value="#{to.paymentConcept.code}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_description}" />
			</f:facet>
			<aon:div>
				<aon:outputText rendered="#{not empty to.description}" 
					value="#{to.description}" />
				<aon:outputText rendered="#{empty to.description}" 
					value="#{to.paymentConcept.description}" />
			</aon:div>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_start_date}" />
			</f:facet>
			<aon:outputText value="#{to.startDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_end_date}" />
			</f:facet>
			<aon:outputText value="#{to.endDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>		
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_salary_payment_month}" />
			</f:facet>
			<aon:outputText value="#{to.month}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_value}" />
			</f:facet>
			<aon:div>
				<aon:outputText value="#{contract.salaryInfoHandler.resolvedPayment}" />
				<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
					<aon:div>
						<aon:outputText value="#{to.expression}"
							rendered="#{to.expression!=null}" />
						<aon:outputText value="#{to.paymentConcept.expression}"
							rendered="#{to.expression==null}" />
					</aon:div>
				</rich:toolTip>
			</aon:div>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="Cot." />
			</f:facet>
			<aon:div styleClass="#{(contract.salaryInfoHandler.paymentQuote)?'aon-icon-checked':'aon-icon-check'}">
				<aon:outputText value="&#160;" />
				<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
					<aon:div>
						<aon:outputText value="#{contract.salaryInfoHandler.paymentQuoteValue}"
							styleClass="aon-bold aon-margin-right" />
						<aon:outputText value="#{to.quoteExpression}"
							rendered="#{to.quoteExpression!=null}" />
						<aon:outputText value="#{to.paymentConcept.quoteExpression}"
							rendered="#{to.quoteExpression==null}" />
					</aon:div>
				</rich:toolTip>
			</aon:div>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="Trib." />
			</f:facet>
			<aon:div styleClass="#{(contract.salaryInfoHandler.paymentIrpf)?'aon-icon-checked':'aon-icon-check'}">
				<aon:outputText value="&#160;" />
				<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
					<aon:div>
						<aon:outputText value="#{contract.salaryInfoHandler.paymentIrpfValue}"
							styleClass="aon-bold aon-margin-right" />
						<aon:outputText value="#{to.irpfExpression}"
							rendered="#{to.irpfExpression!=null}" />
						<aon:outputText value="#{to.paymentConcept.irpfExpression}"
							rendered="#{to.irpfExpression==null}" />
					</aon:div>
				</rich:toolTip>
			</aon:div>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-buttonsColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:confirmButton id="contractPaymentTable-remove"
				title="#{bundle.aon_remove}" 
				immediate="true" reRender="contractPaymentTable"
				rendered="#{contract.salaryInfoHandler.selectedPayment.id == to.id}"
				confirmTitle="#{bundle.aon_confirm_title}"
				confirmMessage="#{bundle.aon_remove_confirm}"
				confirmActionListener="#{contract.salaryInfoHandler.onRemovePayment}"
				styleClass="aon-editDataTable-button aon-icon-delete" />
			<aon:commandButton id="contractPaymentTable-cancel"
				title="#{bundle.aon_cancel}" 
				reRender="contractPaymentTable"
				rendered="#{contract.salaryInfoHandler.selectedPayment.id == to.id}"
				actionListener="#{contract.salaryInfoHandler.onCancelPayment}"
				styleClass="aon-editDataTable-button aon-icon-cancel" />
		</aon:column>
		<rich:subTable rendered="#{contract.salaryInfoHandler.selectedPayment.id == to.id}"
			value="#{contract.salaryInfoHandler.selectedPayment}"
			var="detail" >
			<rich:column colspan="11" styleClass="aon-width-all aon-noborder"
				style="background-color: #F2F2F2;" >
				<h:panelGrid columns="2" style="font-size: 0.9em; width: 100%;" 
					cellpadding="0" cellspacing="0" border="0"
					columnClasses="aon-width-70 aon-noborder,aon-noborder" >
					<aon:outputText value="#{bundle.aon_value}:" />
					<aon:outputText value="#{detail.expression}" />
				</h:panelGrid>
			</rich:column> 
		</rich:subTable>
		<rich:subTable rendered="#{contract.salaryInfoHandler.selectedPayment.id == to.id}"
			value="#{contract.salaryInfoHandler.paymentTrackingModel}"
			var="detail" >
			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto" style="background-color: #FBEDB6;">
			</aon:column>
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-70" style="background-color: #FBEDB6;">
				<aon:outputText value="#{detail.salaryType}" />
			</aon:column>
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-70" style="background-color: #FBEDB6;">
				<aon:outputText value="#{detail.paymentConcept.code}" />
			</aon:column>
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" style="background-color: #FBEDB6;">
				<aon:div>
					<aon:outputText rendered="#{not empty to.description}" 
						value="#{detail.description}" />
					<aon:outputText rendered="#{empty to.description}" 
						value="#{detail.paymentConcept.description}" />
				</aon:div>
			</aon:column>
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100" style="background-color: #FBEDB6;">
				<aon:outputText value="#{detail.startDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100" style="background-color: #FBEDB6;">
				<aon:outputText value="#{detail.endDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
			</aon:column>
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-100" style="background-color: #FBEDB6;">
				<aon:outputText value="#{detail.month}" />
			</aon:column>
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-70" style="background-color: #FBEDB6;">
				<aon:outputText title="#{detail.expression}"
					value="#{contract.salaryInfoHandler.resolvedPayment}" />
			</aon:column>
			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto" style="background-color: #FBEDB6;">
				<aon:div styleClass="#{(not empty detail.quoteExpression)?'aon-icon-checked':'aon-icon-check'}">
					<aon:outputText value="&#160;" />
				</aon:div>
			</aon:column>
			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto" style="background-color: #FBEDB6;">
				<aon:div styleClass="#{(not empty detail.irpfExpression)?'aon-icon-checked':'aon-icon-check'}">
					<aon:outputText value="&#160;" />
				</aon:div>
			</aon:column>
			<aon:column styleClass="aon-editDataTable-buttonsColumn" style="background-color: #FBEDB6;">
			</aon:column>
		</rich:subTable>
	</aon:dataTable>
</aon:panel>

<aon:panel id="contractDeductionPanel">
	<f:facet name="header">
		<aon:outputText value="#{bundle.payroll_salary_deductions_tab}" />
	</f:facet>
	<aon:dataTable id="contractDeductionTable" var="to" value="#{contract.salaryInfoHandler.deductionModel}" rows="0">
		<aon:rowSelector id="contractDeductionTable-rowSelect" toggleOnClick="#{false}" />
		<aon:column styleClass="aon-editDataTable-iconColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton id="contractDeductionTable-select"
				title="#{bundle.aon_selectMsg}" 
				reRender="contractDeductionTable"
				rendered="#{contract.salaryInfoHandler.selectedDeduction.id != to.id}"
				actionListener="#{contract.salaryInfoHandler.onSelectDeduction}"
				styleClass="aon-editDataTable-button aon-icon-rowSelector" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-160">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.type}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_concept}" />
			</f:facet>
			<aon:outputText value="#{to.deductionConcept.code}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_description}" />
			</f:facet>
			<aon:outputText value="#{to.fullDescription}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_start_date}" />
			</f:facet>
			<aon:outputText value="#{to.startDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_end_date}" />
			</f:facet>
			<aon:outputText value="#{to.endDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>		
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_salary_payment_month}" />
			</f:facet>
			<aon:outputText value="#{to.month}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_value}" />
			</f:facet>
			<aon:outputText title="#{to.expression}"
				value="#{contract.salaryInfoHandler.resolvedDeduction}" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-buttonsColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:confirmButton id="contractDeductionTable-remove"
				title="#{bundle.aon_remove}" 
				immediate="true" reRender="contractDeductionTable"
				rendered="#{contract.salaryInfoHandler.selectedDeduction.id == to.id}"
				confirmTitle="#{bundle.aon_confirm_title}"
				confirmMessage="#{bundle.aon_remove_confirm}"
				confirmActionListener="#{contract.salaryInfoHandler.onRemoveDeduction}"
				styleClass="aon-editDataTable-button aon-icon-delete" />
			<aon:commandButton id="contractDeductionTable-cancel"
				title="#{bundle.aon_cancel}" 
				reRender="contractDeductionTable"
				rendered="#{contract.salaryInfoHandler.selectedDeduction.id == to.id}"
				actionListener="#{contract.salaryInfoHandler.onCancelDeduction}"
				styleClass="aon-editDataTable-button aon-icon-cancel" />
		</aon:column>
	</aon:dataTable>
</aon:panel>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>
</ui:composition>
