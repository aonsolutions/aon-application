<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/contractBatch/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.contractBatch_step0}" />
	</ui:define>

	<ui:define name="step_content">
		<aon:methodParam name="searchAction" value="contractBatchWizard_step1" />
		<aon:methodParam name="searchActionListener" value="#{contractBatchWizard.onNext}" type="actionListener" />
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
			<ui:param name="controller" value="#{contract}" />
			<ui:define name="searchContent">
			
				<aon:outputLabel for="Person_id"
					value="#{registryBundle.registry_person}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="Person_id" lookup="#{personLookup}"
						reRender="Person_full_name"
						value="#{contractSearch.person.id}" size="5" />
					<aon:lookupButton 
						windowTitle="#{registryBundle.registry_person_selection}"
						selectReRender="Person_id,Person_full_name" actionType="search"
						lookup="#{personLookup}" minHeight="460" minWidth="650"
						property="#{contractSearch.person}">
					</aon:lookupButton>
					<aon:inputText id="Person_full_name"
						value="#{(contractSearch.person.registry.fullName!=null)?(contractSearch.person.registry.fullName):('')}"
						size="50" disabled="true" />							
				</aon:div>

				<aon:outputLabel for="Enterprise_id"
					value="#{companyBundle.company_enterprise}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="Enterprise_id" lookup="#{enterpriseLookup}"
						reRender="Enterprise_full_name"
						value="#{contractSearch.enterprise.id}" size="5" />
					<aon:lookupButton 
						windowTitle="#{companyBundle.company_enterprise_selection}"
						selectReRender="Enterprise_id,Enterprise_full_name" actionType="search"
						lookup="#{enterpriseLookup}" minHeight="460" minWidth="650"
						property="#{contractSearch.enterprise}">
					</aon:lookupButton>
					<aon:inputText id="Enterprise_full_name"
						value="#{(contractSearch.enterprise.registry.fullName!=null)?(contractSearch.enterprise.registry.fullName):('')}"
						size="50" disabled="true" />							
				</aon:div>
									
				<aon:outputLabel for="ContractType_id"
					value="#{payrollBundle.employee_contractType}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="ContractType_id" lookup="#{contractTypeLookup}"
						reRender="ContractType_detail"
						value="#{contractSearch.contractType.id}" size="5" />
					<aon:lookupButton 
						windowTitle="#{payrollBundle.employee_contractType_selection}"
						selectReRender="ContractType_id,ContractType_detail"
						lookup="#{contractTypeLookup}" minHeight="460" minWidth="650"
						property="#{contractSearch.contractType}">
					</aon:lookupButton>
					<aon:inputText id="ContractType_detail"
						value="#{contractSearch.contractType.description}"
						size="50" disabled="true" />							
				</aon:div>					
								
				<aon:outputLabel value="#{bundle.aon_start_date}" />
				<aon:div>
					<aon:outputLabel for="Contract_startDate-From" styleClass="aon-form-date-label"
						value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Contract_startDate-From"
						valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				
					<aon:outputLabel for="Contract_startDate-To" styleClass="aon-form-date-label"
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Contract_startDate-To"
						valueChangeListener="#{controller.addLessThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</aon:div>
			
				<aon:outputLabel value="#{bundle.aon_end_date}" />
				<aon:div>
					<aon:outputLabel for="Contract_endDate-From" styleClass="aon-form-date-label"
						value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Contract_endDate-From"
						valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				
					<aon:outputLabel for="Contract_endDate-To" styleClass="aon-form-date-label"
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Contract_endDate-To"
						valueChangeListener="#{controller.addLessThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</aon:div>
				
			</ui:define>
		</ui:decorate>
	</ui:define>
	<ui:define name="after_form">
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		<aon:lookupButtonPopup lookup="#{contractTypeLookup}" />
	</ui:define>

</ui:composition>
