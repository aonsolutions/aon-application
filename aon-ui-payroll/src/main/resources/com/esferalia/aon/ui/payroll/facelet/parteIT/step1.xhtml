<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/parteIT/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.parteIT_step1}"/>
	</ui:define>

	<ui:define name="step_content">
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="empleadoData" value="#{parteITWizard.empleadoModel}"
					var="to" rows="20" rendered="#{parteITWizard.empleadoModel.rowCount > 0}"
					columnClasses="
					aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn">

					<aon:rowSelector action="parteITWizard_step2"
						actionListener="#{parteITWizard.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_documento}" />
						</f:facet>
						<aon:outputText value="#{to.id} - #{to.registry.document.value}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_nombre}" />
						</f:facet>
						<aon:outputText value="#{to.fullName}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_numss}" />
						</f:facet>
						<aon:outputText value="#{to.numSS}" />
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="empleadoData" showNote="true" />
			</aon:div>

	</ui:define>

</ui:composition>
