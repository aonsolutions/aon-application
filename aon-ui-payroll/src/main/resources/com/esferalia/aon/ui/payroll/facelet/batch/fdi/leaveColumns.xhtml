<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">
			
	<aon:column styleClass="aon-editDataTable-iconColumn">
		<f:facet name="header">
			<aon:outputText value="&#160;" />
		</f:facet>
		<aon:outputText value="B" title="Baja" 
			rendered="#{to.contractLeaveDetail.type=='LEAVE'}"/>
		<aon:outputText value="A" title="Alta"
			rendered="#{to.contractLeaveDetail.type=='DISCHARGE'}"/>
		<aon:outputText value="C" title="Confirmacion"
			rendered="#{to.contractLeaveDetail.type=='CONFIRM'}"/>
	</aon:column>

	<aon:if test="#{showEnterpriseColumn}"> 
		<aon:column style="font-size: 0.8em;" styleClass="aon-editDataTable-textColumn aon-width-auto, aon-nowrap">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_company}" />
			</f:facet>
			<aon:outputText value="#{to.contractLeaveDetail.contractLeave.contract.workPlace.enterprise.registry.fullName}">
				<aon:abbreviateConverter maxWidth="50" />
			</aon:outputText>
		</aon:column>
	</aon:if>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_document}" />
		</f:facet>
		<aon:outputText value="#{to.contractLeaveDetail.contractLeave.contract.person.registry.document}" />
	</aon:column>

	<aon:column style="font-size: 0.8em;" styleClass="aon-editDataTable-textColumn aon-width-auto, aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{bundle.payroll_salary_employee}" />
		</f:facet>
		<aon:outputText value="#{to.contractLeaveDetail.contractLeave.contract.person.registry.fullName}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-dateColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.payroll_leaveBatch_leave_date}" />
		</f:facet>
		<aon:outputText value="#{to.contractLeaveDetail.contractLeave.startDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-dateColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.payroll_leaveBatch_discharge_date}" />
		</f:facet>
		<aon:outputText value="#{to.contractLeaveDetail.contractLeave.endDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-numberColumn aon-width-50">
		<f:facet name="header">
			<aon:outputText value="#{bundle.payroll_leaveBatch_parent_increment}" />
		</f:facet>
		<aon:outputText rendered="#{to.contractLeaveDetail.confirm}"
			value="#{to.contractLeaveDetail.confirmOrder}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-dateColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.payroll_leaveBatch_confirm_date}" />
		</f:facet>
		<aon:outputText rendered="#{to.contractLeaveDetail.confirm}"
			value="#{to.contractLeaveDetail.date}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column  styleClass="aon-editDataTable-textColumn aon-width-150, aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{bundle.payroll_contractLeave_type}" />
		</f:facet>
		<aon:outputText value="#{to.contractLeaveDetail.contractLeave.type}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-iconColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.payroll_contractLeave_relapse}" />
		</f:facet>
		<aon:div>
			<aon:outputText value="&#160;" style="padding-left: 15px;"
				styleClass="aon-icon-check" rendered="#{to.contractLeaveDetail.contractLeave.parent.id==null}" />
			<aon:outputText value="&#160;" style="padding-left: 15px;"
				styleClass="aon-icon-checked" rendered="#{to.contractLeaveDetail.contractLeave.parent.id!=null}" />
			<aon:div style="display: inline;" rendered="#{to.contractLeaveDetail.contractLeave.parent.id!=null}">
				<aon:outputText	value="&#160;" styleClass="aon-margin-left aon-icon-commandButton aon-icon-info" />
				<rich:toolTip showEvent="onclick" hideEvent="onmouseout" direction="auto">
					<f:facet name="header">
						<aon:outputText value="#{bundle.payroll_contractLeave_previous_leave}" />
					</f:facet>
					<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-70, aon-noborder aon-bold aon-text-left">
						<aon:outputText value="#{bundle.aon_period}" styleClass="aon-margin-left" />
						<aon:div>
							<aon:outputText value="#{bundle.aon_date_from}" styleClass="aon-italic" />
							<aon:outputText value="#{to.contractLeaveDetail.contractLeave.parent.startDate}" styleClass="aon-margin-left">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:outputText value="#{bundle.aon_date_to}" styleClass="aon-margin-left aon-italic" />
							<aon:outputText value="#{to.contractLeaveDetail.contractLeave.parent.endDate}" styleClass="aon-margin-left">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:div>
						<aon:outputText value="#{bundle.payroll_contractLeave_type}" styleClass="aon-margin-left" />
						<aon:outputText value="#{to.contractLeaveDetail.contractLeave.parent.type}" />
						<aon:outputText value="#{bundle.aon_description}" styleClass="aon-margin-left" />
						<aon:outputText value="#{to.contractLeaveDetail.contractLeave.parent.description}" />
					</aon:panelGrid>
				</rich:toolTip>
			</aon:div>
		</aon:div>
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status}" />
		</f:facet>
		<aon:outputText value="#{to.contractLeaveDetail.status}"  />
	</aon:column>

	
</ui:composition>
