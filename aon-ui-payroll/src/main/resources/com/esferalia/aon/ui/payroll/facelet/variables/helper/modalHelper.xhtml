<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="variableHelperModalContainer#{helperSuffix}">
		<aon:if test="#{controller.handler.modalHelperPanelVisible}">
			<rich:modalPanel id="variableHelperModalPanel" minHeight="650"
				minWidth="900" showWhenRendered="true" zindex="100">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.payroll_variable_helper}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{controller.handler.onCancelVariableHelp}"
							reRender="variableHelperModalContainer#{helperSuffix},#{container}" immediate="true">
							<aon:actionHotKey key="esc" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="variableHelperModalForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									
									<aon:div styleClass="aon-panelGrid-search">
										<aon:div styleClass="aon-panelGrid-search-info">
											<aon:outputText value="#{bundle.aon_filter}" styleClass="aon-panelGrid-search-info-internal"/>
										</aon:div>
										<aon:panelGrid columns="1">
											<aon:selectManyCheckbox id="variablefilter_type" layout="lineDirection"
												value="#{controller.handler.variableScopeFilter}" >
												<f:selectItems value="#{controller.handler.filterVariableScopes}" />
												<a4j:support 
													event="onclick"
													reRender="variableHelperContainer"
													actionListener="#{controller.handler.onEmptyVariableHelperModel}"
													eventsQueue="variableFilterKeyUp"
													requestDelay="500"
													ajaxSingle="true"
													ignoreDupResponses="true"
													limitToList="true"/>
											</aon:selectManyCheckbox>
											<aon:inputText id="variableFilter_suggestText" size="150" value="#{controller.handler.filter}">
												<a4j:support 
													event="onkeyup"
													reRender="variableHelperContainer"
													actionListener="#{controller.handler.onEmptyVariableHelperModel}"
													eventsQueue="variableFilterKeyUp"
													requestDelay="500"
													ajaxSingle="true"
													ignoreDupResponses="true"
													limitToList="true"/>
											</aon:inputText>
										</aon:panelGrid>	
									</aon:div>
									
									<aon:div id="variableHelperContainer">
										<aon:editDataTable id="variableHelperList"
											rendered="#{controller.handler.variableHelperModel.rowCount > 0}"
											value="#{controller.handler.variableHelperModel}" var="to" rows="20" >
											<aon:rowSelector toggleOnClick="#{true}" 
												reRender="variableHelperModalContainer#{helperSuffix},#{container}"
												actionListener="#{controller.handler.onSelectVariableHelp}" />
											<aon:column styleClass="aon-editDataTable-textColumn">
												<f:facet name="header">
													<aon:outputLabel 
														value="#{bundle.aon_value}" />
												</f:facet>
												<aon:outputText value="#{to.name}" />
											</aon:column>  
											<aon:column styleClass="aon-editDataTable-textColumn">
												<f:facet name="header">
													<aon:outputLabel 
														value="#{bundle.aon_description}" />
												</f:facet>
												<aon:outputText value="#{to.description}" />
											</aon:column>  
										</aon:editDataTable>
										<aon:dataScroller for="variableHelperList" showNote="false" />
									</aon:div>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
				
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>
</ui:composition>
