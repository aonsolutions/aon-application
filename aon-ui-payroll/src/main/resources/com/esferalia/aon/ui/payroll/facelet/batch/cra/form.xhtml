<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:if test="#{craBatch.nevv}" >
		<ui:decorate template="/com/esferalia/aon/ui/payroll/facelet/batch/cra/form_new.xhtml" />
	</aon:if>
	
	<aon:if test="#{!craBatch.nevv}" >
		<ui:decorate template="/com/esferalia/aon/ui/payroll/facelet/batch/form.xhtml">
			<ui:param name="toolbarTitle" value="#{bundle.payroll_craBatch_module}" />
			<ui:param name="controller" value="#{craBatch}" />
			<ui:param name="controllerDetail" value="#{craBatchDetail}" />
			<ui:param name="controllerAttach" value="#{craBatchAttach}" />
			
			<ui:define name="moreToolbarContent" >
				
			</ui:define>
			
			<ui:define name="batchContent" >
				<aon:panelGrid id="info-panel" columns="2" styleClass="aon-width-all"
					columnClasses="
					aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-auto
					" >
					<aon:outputLabel value="#{bundle.fanBatch_liquidation_period}" />
					<aon:div>
						<h:panelGrid columns="2" rendered="#{!craBatch.recorded}">
							<aon:selectOneMenu id="craBatch_month" value="#{craBatch.to.month}" >
								<f:selectItems value="#{commonCollections.months}"  />
							</aon:selectOneMenu>
							<rich:inputNumberSpinner id="craBatch_year" value="#{craBatch.to.year}"
				   				inputSize="4" minValue="2009" maxValue="2020">
				   			</rich:inputNumberSpinner>
						</h:panelGrid>
						<aon:outputText value="#{craBatch.to.date}" rendered="#{craBatch.recorded}" >
							<f:convertDateTime pattern="MMMMM yyyy"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:div>
					
				</aon:panelGrid>
			
				<aon:panelGrid id="actions-panel" columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-auto" >
					<aon:outputText value="#{bundle.finance_disk} CRA" />
					<aon:div>
						<aon:outputText value="Generado el "
							rendered="#{craBatch.recorded}"
							styleClass="aon-bold" />
						<aon:outputText value="#{craBatch.to.outcomeFileDate}"
							rendered="#{craBatch.recorded}"
							styleClass="aon-bold aon-margin-right" >
							<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						
						<aon:if test="#{domainSwitcher.domainManagementAvailable or controller.editableSelectedTo}" >
							<aon:htmlCommandLink id="cra-download" target="_blank"
								value="&#160;" title="#{bundle.aon_fileupload_download}"
								rendered="#{craBatch.recorded}"
								actionListener="#{craBatch.onDownloadFile}"
								styleClass="aon-icon-commandButton aon-icon-mail-save aon-margin-left" >
							</aon:htmlCommandLink>
							<aon:commandButton id="cra-remove" 
								value="&#160;" title="#{bundle.aon_remove}" 
								rendered="#{craBatch.recorded}"
								actionListener="#{craBatch.onRemoveFile}"
								styleClass="aon-icon-commandButton aon-icon-delete aon-margin-left" />
							<aon:if test="#{aonRole.sysAdmin}">
								<aon:fileUpload id="attach_file" listWidth="100"
									fileUploadListener="#{craBatch.craFileUploaded}" >
									<f:facet name="label">
										<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
									</f:facet>
									<a4j:support event="onuploadcomplete" reRender="dataTable" />
								</aon:fileUpload>
							</aon:if>
							<aon:commandButton id="cra-create-button" value="#{bundle.payroll_create_disk}"
								rendered="#{craBatch.nevv or (!craBatch.recorded and craBatchDetail.model.rowCount > 0)}"
								reRender="batchForm"
								styleClass="aon-icon-commandButton aon-icon-accept"
								actionListener="#{craBatch.onCreateDisk}"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />						
						</aon:if>
					</aon:div>
				</aon:panelGrid>
			</ui:define>
			
			<ui:define name="batchedTabContent" >
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/cra/formDetail.xhtml" />
			</ui:define>
			
			<ui:define name="noBatchedTabContent" >
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/cra/formNoBatched.xhtml" />
			</ui:define>
			
			<ui:define name="documentTabContent" >
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/formDocument.xhtml" >
					<ui:param name="controllerAttach" value="#{craBatchAttach}" />
				</ui:include>
			</ui:define>
			
			<ui:define name="afterFormContent" >
				
			</ui:define>
			
		</ui:decorate>
	</aon:if>

</ui:composition>
