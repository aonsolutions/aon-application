<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
	
<!--  
	<c:if test="#{!aonRole.sysAdmin}" >
		<aon:outputLabel value="#{bundle.aon_concept}" />
		<aon:outputText value="#{controller.to.bonusConcept.description}" />
	</c:if>
	<c:if test="#{aonRole.sysAdmin}" >
-->	
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/bonusConcept/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{controller.to.bonusConcept}" />
			<ui:param name="skipNewButton" value="#{true}" />
			<ui:param name="idRequired" value="#{true}" />
		</ui:include>
<!--  
	</c:if>
-->

	<aon:outputLabel for="ContractBonus_startDate" value="#{bundle.aon_start_date}" />
	<aon:selectInputDate id="ContractBonus_startDate" value="#{controller.to.startDate}" required="true"
		timeZone="#{timeZoneController.timeZone}" popupDateFormat="#{bundle.aon_date_pattern}"/>
	
	<aon:outputLabel for="ContractBonus_endDate" value="#{bundle.aon_end_date}" />
	<aon:selectInputDate id="ContractBonus_endDate" value="#{controller.to.endDate}"
		timeZone="#{timeZoneController.timeZone}" popupDateFormat="#{bundle.aon_date_pattern}"/>

	<aon:outputLabel for="ContractBonus_description" value="#{bundle.aon_description}" />
	<aon:inputText id="ContractBonus_description" size="64" maxlength="64" 
		value="#{controller.to.description}" />
	
	<c:if test="#{!aonRole.sysAdmin}">
		<aon:outputLabel for="ContractBonus_expression2" value="#{payrollBundle.payroll_salary_expression}" />
		<aon:outputText id="ContractBonus_expression2" size="64" 
			value="#{(controller.to.expression!=null and controller.to.expression!='')?(controller.to.expression):(controller.to.bonusConcept.expression)}" />
	</c:if>

	<c:if test="#{aonRole.sysAdmin}">
		<aon:outputLabel for="ContractBonus_expression" value="#{payrollBundle.payroll_salary_expression}"  />
		<aon:inputTextarea id="ContractBonus_expression" cols="64" rows="2" maxlength="128"
			value="#{controller.to.expression}" required="true">
			<f:validateLength maximum="128"/>
			<a4j:region>
				<rich:suggestionbox id="ContractBonus_expression_suggestion"
					for="ContractBonus_expression"
					onselect="suggestionBoxActive=false;"
					suggestionAction="#{controller.expressionContext}" var="exp"
					similarityGroupingId=""
					tokens=" +-/*%()"
					fetchValue="#{exp.name}"
					immediate="true" limitToList="true" ajaxSingle="true"
					eventsQueue="ContractBonus_expressionSug" ignoreDupResponses="true"
					requestDelay="100" width="500" height="200"
					nothingLabel="#{bundle.aon_search_no_results}">
					<aon:column>
						<aon:outputText value="#{exp.name}" styleClass="aon-bold"/>
						<aon:outputText value=" (#{exp.expression})"/>
					</aon:column>
				</rich:suggestionbox>
			</a4j:region>
		</aon:inputTextarea>
	</c:if>
	
	<c:if test="#{!skipResult}">
		<aon:outputLabel for="ContractBonus_result" value="#{payrollBundle.payroll_result}" />
		<h:panelGrid columns="4">
			<aon:outputText value="#{(controller.result!=null)?(controller.result):('Imposible evaluar la expresion')}" 
				style="color:#{(controller.result!=null)?('black'):('red')};" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
	
			<aon:outputText styleClass="aon-italic aon-margin-left aon-margin-right" 
				value="#{payrollBundle.payroll_on}" />
		
			<aon:selectOneMenu value="#{controller.month}">
				<f:selectItems value="#{commonCollections.months}"  />
				<a4j:support event="onchange" actionListener="#{controller.onReloadExpression}" reRender="#{controller.beanName}ModalForm" ajaxSingle="true"/>
			</aon:selectOneMenu>
	
			<rich:inputNumberSpinner value="#{controller.year}" inputSize="4" 
				minValue="2000" maxValue="2100">
			  <a4j:support event="onchange" actionListener="#{controller.onReloadExpression}" reRender="#{controller.beanName}ModalForm" ajaxSingle="true"/>
			  <a4j:support event="oninputkeydown" actionListener="#{controller.onReloadExpression}" reRender="#{controller.beanName}ModalForm" ajaxSingle="true"/>
			  <a4j:support event="oninputkeyup" actionListener="#{controller.onReloadExpression}" reRender="#{controller.beanName}ModalForm" ajaxSingle="true" />
			</rich:inputNumberSpinner>
		</h:panelGrid>
	</c:if>

</ui:composition>
