<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"	
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

  
	 	<a4j:region>
        	<h:form>
            	<a4j:poll id="poll" interval="500" enabled="#{irpfLauncher.pollEnabled}" 
            		reRender="poll,launchIrpfs,messagesContainer" />
        	</h:form>
    	</a4j:region>
    	
		<aon:form id="irpfLauncherForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{title}" />
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
			
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{payrollBundle.payroll_launch_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>			
			
					<aon:panelGrid id="irpfLauncherLaunchContent" columns="4">
		
						<aon:outputLabel for="date" styleClass="aon-italic aon-margin-right"
							value="#{bundle.aon_date}:" />
						<aon:selectInputDate id="date"
							value="#{irpfLauncher.params.date}" required="true"
							inputSize="10" renderAsPopup="true" enableManualInput="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
						<aon:outputText value="&#160;" />
						<aon:div>
							<ui:insert name="addOnsFirstRow"/>
						</aon:div>
						
						
						<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{irpfLauncher.params.person}" />
							<ui:param name="skipNewButton" value="#{true}" />
						</ui:include>
						<aon:outputText value="&#160;" />
						<aon:div>
							<ui:insert name="addOnsSecondRow"/>
						</aon:div>
						
						<aon:outputText value="&#160;" />
						<aon:div >
							<ui:insert name="launchButton"/>	 
						</aon:div>
						<aon:outputText value="&#160;" />
						<aon:outputText value="&#160;" />
	 				</aon:panelGrid>
				</aon:div>
				
				<aon:div id="messagesContainer" >
					<c:if test="#{irpfLauncher.messages != null}">
					
						<aon:div style="margin-left: 50px; margin-top: 10px;">		
							<!--aon:htmlCommandLink target="_blank"
								title="DESCARGAR LOG"
								value="DESCARGAR LOG"
								style="border-width: 0px 0px 0px 0px;"
								actionListener="#{irpfLauncher.downloadDisk}"
								rendered="#{!irpfLauncher.emptyLog}"
								styleClass="aon-finding-toolbar-item aon-icon-mail-save" /-->
								<aon:outputText value="&#160;" />
						</aon:div>
						
						<aon:div  id="console" 
							style="background-color: #EEEEEE; border: solid #ccc 1px; height:400px; overflow-y: scroll;">
							<ul style="padding:1em 0em 1em 0em ;" >
								<ui:repeat var="message" value="#{irpfLauncher.messages}">
								<li>
									<ui:insert name="messageRow"/>
								</li>
								</ui:repeat>
							</ul>
							<aon:graphicImage
							styleClass="aon-margin-left aon-margin-top" 
							url="/css/images/processing.gif" 
							rendered="#{irpfLauncher.pollEnabled}"/>
						</aon:div>
						
						
						<script type="text/javascript">
							var objControl=document.getElementById("aonContent:irpfLauncherForm:console");
							objControl.scrollTop = objControl.scrollHeight;
						</script>					
					</c:if>
				</aon:div>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
</ui:composition>
