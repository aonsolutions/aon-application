<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
		
	<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{controller.person}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>
	
	<aon:outputLabel for="Contract_workPlace"  
		value="#{bundle.purchase_workplace}" />
	<aon:selectOneMenu id="Contract_workPlace"
		value="#{contractSearch.workPlace}" >
		<f:selectItem itemLabel=" - " itemValue="#{null}"  />
		<f:selectItems value="#{contractSearch.workPlaces}"  />
	</aon:selectOneMenu>
	
	<aon:outputLabel value="#{bundle.aon_start_date}" />
	<aon:div>
		<aon:outputLabel for="Contract_startDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}: " />
		<aon:selectInputDate id="Contract_startDate-From"
			value="#{controller.startDateFrom}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	
		<aon:outputLabel for="Contract_startDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}: " />
		<aon:selectInputDate id="Contract_startDate-To"
			value="#{controller.startDateTo}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
	
	<aon:outputLabel value="#{bundle.aon_end_date}" />
	<aon:div>
		<aon:outputLabel for="Contract_endDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}: " />
		<aon:selectInputDate id="Contract_endDate-From"
			value="#{controller.endDateFrom}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	
		<aon:outputLabel for="Contract_endDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}: " />
		<aon:selectInputDate id="Contract_endDate-To"
			value="#{controller.endDateTo}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
	
	<aon:outputLabel value="#{bundle.aon_modification_date}" />
	<aon:div>
		<aon:outputLabel for="Contract_modificationDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}: " />
		<aon:selectInputDate id="Contract_modificationDate-From"
			value="#{controller.modificationDateFrom}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	
		<aon:outputLabel for="Contract_modificationDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}: " />
		<aon:selectInputDate id="Contract_modificationDate-To"
			value="#{controller.modificationDateTo}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>

	<aon:outputText value="" />
	<aon:commandButton id="detailSearch"
		value="#{bundle.aon_search}" status="aonStatus"
		reRender="#{searchReRender}"
		actionListener="#{controller.onSearch}"
		requestDelay="100"
		styleClass="aon-icon-rubber aon-search-lookup-button">
	</aon:commandButton>
	
</ui:composition>
