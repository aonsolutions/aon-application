<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jstl/core">
		
	<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{controller.person}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>
	
	<c:if test="#{fn:length(contractSearch.workPlaces) gt 1}">
		<aon:outputLabel for="Contract_workPlace"  
			value="#{bundle.purchase_workplace}" />
		<aon:selectOneMenu id="Contract_workPlace"
			value="#{contractSearch.workPlace}" >
			<f:selectItem itemLabel=" - " itemValue="#{null}"  />
			<f:selectItems value="#{contractSearch.workPlaces}"  />
		</aon:selectOneMenu>
	</c:if>
	
	<!--  
	<aon:outputLabel for="Contract_action"  
		value="#{bundle.aon_action}" />
	<aon:selectOneMenu id="Contract_action"
		value="#{controller.action}" >
		<f:selectItem itemLabel=" - " itemValue="#{null}"  />
		<f:selectItems value="#{controller.actions}"  />
	</aon:selectOneMenu>
	-->
	
	<aon:outputLabel value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="Contract_date-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}: " />
		<aon:selectInputDate id="Contract_date-From"
			value="#{controller.dateFrom}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	
		<aon:outputLabel for="Contract_date-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}: " />
		<aon:selectInputDate id="Contract_date-To"
			value="#{controller.dateTo}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>
	

	<aon:outputText value="" />
	<aon:commandButton id="detailSearch"
		value="#{bundle.aon_search}" status="aonStatus"
		reRender="#{searchReRender}"
		actionListener="#{controller.onSearch}"
		requestDelay="100"
		styleClass="aon-icon-rubber aon-search-lookup-button">
	</aon:commandButton>
	
</ui:composition>
