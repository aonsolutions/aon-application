<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="paymentModalContainer">
		<c:if test="#{controller.modalPanelVisible}">
			<rich:modalPanel id="paymentModalPanel" minHeight="450"
				minWidth="600" showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{payrollBundle.payroll_salary_payment}" />
					</aon:div>
				</f:facet>
				<aon:form id="paymentModalForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="paymentSave"
											value="#{bundle.aon_accept}"
											reRender="paymentModalContainer,#{container}"
											actionListener="#{controller.onSave}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
										</aon:commandButton>
										<aon:commandButton id="paymentCancel"
											value="#{bundle.aon_cancel}"
											reRender="paymentModalContainer,#{container}"
											actionListener="#{controller.onCancel}"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
										</aon:commandButton>
										<aon:commandButton id="paymentRemove"
											value="#{bundle.aon_remove}"
											reRender="paymentModalContainer,#{container}"
											actionListener="#{controller.onRemove}"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-delete"
											onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;">
										</aon:commandButton>
									</aon:div>
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panelGrid id="paymentMenuGrid" columns="2" dir="true" style="width: 80%;">
											<ui:include src="/com/esferalia/aon/ui/payroll/facelet/payment/formContent.xhtml">
												<ui:param name="controller" value="#{controller}" />
												<ui:param name="containerID" value="paymentMenuGrid" />
												<ui:param name="skipCurrentMonth" value="#{skipCurrentMonth}" />
												<ui:param name="contextDisabled" value="#{contextDisabled}" />
											</ui:include>
										</aon:panelGrid>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>
</ui:composition>
