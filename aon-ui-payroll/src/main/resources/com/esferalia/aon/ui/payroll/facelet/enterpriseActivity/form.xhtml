<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="skipSearchButton" value="true" />

		<aon:methodParam name="saveAction" value="" />
		<ui:param name="saveButtonReRender" value="#{controller.beanName}Content" />
		<aon:methodParam name="cancelAction" value="" />
		<ui:param name="cancelButtonReRender" value="#{controller.beanName}Content" />
		<aon:methodParam name="removeAction" value="" />
		<ui:param name="removeButtonReRender" value="#{controller.beanName}Content" />
		<aon:methodParam name="resetAction" value="" />
		<ui:param name="resetButtonReRender" value="#{controller.beanName}Content" />
		<aon:methodParam name="backAction" value="" />
		<ui:param name="backButtonReRender" value="#{controller.beanName}Content" />

	</ui:include>

	<aon:div styleClass="aon-scroll-area">	
		<aon:panelGrid id="dataTable" columns="2" >
	
			<aon:outputLabel for="EnterpriseActivity_description"
				value="#{bundle.aon_description}" />
			<aon:inputText id="EnterpriseActivity_description" size="32"
				maxlength="32" value="#{enterpriseActivity.to.description}"
				required="true" />
		
			<aon:if test="#{actionDenied.manager.renderPayrollConfig}">
				<aon:outputLabel for="EnterpriseActivity_quoteRegime"
					value="#{bundle.payroll_activity_quoteRegime}" />
				<aon:selectOneMenu id="EnterpriseActivity_quoteRegime" required="true"
					value="#{enterpriseActivity.to.type}"
					rendered="#{enterpriseActivity.nevv}">
					<f:selectItems value="#{payrollCollections.availableSsRegimes}" />
				</aon:selectOneMenu>
				<aon:outputText value="#{enterpriseActivity.to.type}" styleClass="aon-bold"
					rendered="#{!enterpriseActivity.nevv}" />
			</aon:if>
			
			<ui:include src="/com/code/aon/ui/config/facelet/cnae2009/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{enterpriseActivity.to.cnae2009}" />
				<ui:param name="idRequired" value="#{true}" />
			</ui:include>				

			<aon:outputLabel for="EnterpriseActivity_principal"
				value="#{bundle.aon_activity_principal}" />
			<aon:selectOneRadio id="EnterpriseActivity_principal" required="true"
				value="#{enterpriseActivity.to.principal}">
				<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
				<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
			</aon:selectOneRadio>
			
		</aon:panelGrid>
		
		<aon:if test="#{actionDenied.manager.renderPayrollConfig}">

			<aon:div>
				<aon:div styleClass="aon-form-group" rendered="#{!enterpriseActivity.nevv}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="enterpriseCCCData" value="#{bundle.company_enterprise_ccc}" />
						</aon:div>
					</aon:div>
					
					<ui:include	src="/com/esferalia/aon/ui/payroll/facelet/enterpriseCCC/tab_grid.xhtml" >
						<ui:param name="controller" value="#{enterpriseCCC}" />
					</ui:include>
				</aon:div>
			</aon:div>
		
		</aon:if>
	</aon:div>

</ui:composition>
