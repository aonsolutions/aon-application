<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form  id="trainingCenterForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.payroll_trainingCenter_module}" />
				<ui:param name="controller" value="#{trainingCenter}" />
			</ui:include>
			
			<aon:panelGrid id="listData" columns="2" cellspacing="10" styleClass="aon-panelGrid-formatting"
				columnClasses="aon-width-half-plus aon-vertical-align-top,aon-width-half-minus aon-vertical-align-top">
				<aon:div styleClass="aon-group">
					<aon:div styleClass="aon-group-title">
						<aon:outputText value="#{bundle.payroll_trainingCenter}"/>
					</aon:div>
					<aon:div styleClass="aon-group-body"> 
						<aon:div styleClass="aon-group-body-internal">
							<aon:panelGrid id="dataTable" columns="2" style="width: 100%;"
								columnClasses="aon-panelGrid-odd aon-width-200 ,aon-panelGrid-even aon-width-auto">
								
								<aon:outputLabel for="trainingCenter_code" value="#{bundle.aon_id}" />
								<aon:inputText id="trainingCenter_code" size="16" maxlength="16" 
									value="#{trainingCenter.to.code}" />
								
								<aon:outputLabel for="TrainingCenter_name" value="#{bundle.aon_name}" />
								<aon:inputText id="TrainingCenter_name" value="#{trainingCenter.to.registry.name}"
									required="true" maxlength="64" size="64" >
									<f:validateLength minimum="1" maximum="64" />
								</aon:inputText>
							
								<aon:outputLabel for="TrainingCenter_alias"
									value="#{bundle.aon_company_alias}" />
								<aon:inputText id="TrainingCenter_alias" value="#{trainingCenter.to.registry.alias}"
									size="32" maxlength="32" >
									<f:validateLength minimum="1" maximum="32" />
								</aon:inputText>
							
								<ui:include src="/com/code/aon/ui/registry/facelet/registry/formDocument.xhtml" >
									<ui:param name="controller" value="#{trainingCenter}" />
									<ui:param name="registry" value="#{trainingCenter.to.registry}" />
								</ui:include>	
							
								<aon:outputLabel for="TrainingCenter_address"
									value="#{bundle.aon_address}" />
								<aon:div>
									<aon:selectOneMenu id="TrainingCenter_streetType" required="true"
										label="#{bundle.registry_street_type}"
										value="#{trainingCenter.mainAddress.streetType}">
										<f:selectItems value="#{registryCollections.streetTypes}" />
									</aon:selectOneMenu>
									<aon:inputText id="TrainingCenter_address" required="true"
										style="margin-left: 5px;" value="#{trainingCenter.mainAddress.address}"
										valueChangeListener="#{trainingCenter.addressChanged}" maxlength="128" size="32" />
									<aon:outputLabel for="TrainingCenter_number" styleClass="aon-italic aon-margin-left"
										value="#{bundle.aon_number}" />
									<aon:inputText id="TrainingCenter_number" required="true"
										style="margin-left: 5px;" value="#{trainingCenter.mainAddress.number}"
										valueChangeListener="#{trainingCenter.addressChanged}" maxlength="12" size="5" />
								</aon:div>
							
								<aon:outputLabel for="TrainingCenter_address2" value="#{bundle.registry_address_detail}" />
								<aon:div>
									<aon:inputText id="TrainingCenter_address2"
										value="#{trainingCenter.mainAddress.address2}"
										valueChangeListener="#{trainingCenter.addressChanged}" maxlength="128" size="32" />
									<aon:inputText id="TrainingCenter_address3"
										style="margin-left: 5px;" value="#{trainingCenter.mainAddress.address3}"
										valueChangeListener="#{trainingCenter.addressChanged}" maxlength="128" size="37" />
								</aon:div>
							
								<aon:outputLabel for="TrainingCenter_address_city"
									value="#{bundle.registry_city}" />
								<aon:inputText id="TrainingCenter_address_city"
									value="#{trainingCenter.mainAddress.city}" maxlength="64"
									valueChangeListener="#{trainingCenter.addressChanged}" size="30" />
							
								<aon:outputLabel for="TrainingCenter_address_zip"
									value="#{bundle.aon_postal_code}" />
								<aon:inputText id="TrainingCenter_address_zip"
									value="#{trainingCenter.mainAddress.zip}" maxlength="16"
									valueChangeListener="#{trainingCenter.addressChanged}" size="16" />
							
								<aon:outputLabel for="TrainingCenter_address_geozone"
									value="#{bundle.aon_state}" />
								<aon:selectOneMenu id="TrainingCenter_address_geozone"
									value="#{trainingCenter.mainAddress.geozone}"
									styleClass="aon-form-selectOneMenu-field"
									valueChangeListener="#{trainingCenter.addressChanged}">
									<f:selectItems value="#{geozoneCollections.geoTrees}" />
								</aon:selectOneMenu>
							
								<aon:outputLabel for="TrainingCenter_telephone"
									value="#{bundle.aon_phone}" />
								<aon:inputText id="TrainingCenter_telephone" value="#{trainingCenter.phone.value}"
									valueChangeListener="#{trainingCenter.phoneChanged}" maxlength="64" size="15" />
							
								<aon:outputLabel for="TrainingCenter_fax"
									value="#{bundle.aon_fax}" />
								<aon:inputText id="TrainingCenter_fax" value="#{trainingCenter.fax.value}"
									valueChangeListener="#{trainingCenter.faxChanged}" maxlength="64" size="15" />
							
								<aon:outputLabel for="TrainingCenter_email"
									value="#{bundle.registry_email}" />
								<aon:inputText id="TrainingCenter_email" value="#{trainingCenter.email.value}"
									onblur="toLowerCase(this);" maxlength="64"
									valueChangeListener="#{trainingCenter.emailChanged}" size="45" />
							
								<aon:outputLabel for="TrainingCenter_web"
									value="#{bundle.aon_web}" />
								<aon:inputText id="TrainingCenter_web" value="#{trainingCenter.web.value}"
									onblur="toLowerCase(this);" maxlength="64"
									valueChangeListener="#{trainingCenter.webChanged}" size="45" />
								
							</aon:panelGrid>
						</aon:div>
					</aon:div>
				</aon:div>
				<aon:div>
					
					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{bundle.company_logo_and_signature}"/>
						</aon:div>
						<aon:div styleClass="aon-group-body"> 
							<aon:div styleClass="aon-group-body-internal">
								<aon:panelGrid columns="4" style="width:100%">
									<aon:outputLabel for="attach_file"
										value="#{bundle.company_logo}" />
									<a4j:region>
										<h:panelGrid id="attachGrid" columns="2">
											<a4j:mediaOutput element="img" cacheable="false"
												style="width: 100px;" value="#{trainingCenter.logoFile.key}"
												rendered="#{trainingCenter.logoFile.size > 0}"
												createContent="#{trainingCenter.createCurrentLogoContent}">
											</a4j:mediaOutput>
											<aon:fileUpload id="attach_file" listWidth="100"
												fileUploadListener="#{trainingCenter.logoFileUploaded}" >
												<f:facet name="label">
													<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
												</f:facet>
												<a4j:support event="onuploadcomplete" reRender="attachGrid" />
											</aon:fileUpload>
										</h:panelGrid>
									</a4j:region>
									<aon:outputLabel for="signatureAttach_file"
										value="#{bundle.aon_signature}" />
									<a4j:region>
										<h:panelGrid id="signatureAttachGrid" columns="2">
											<a4j:mediaOutput element="img" cacheable="false"
												style="width: 100px;" value="#{trainingCenter.signatureFile.key}"
												rendered="#{trainingCenter.signatureFile.size > 0}"
												createContent="#{trainingCenter.createCurrentSignatureContent}">
											</a4j:mediaOutput>
											<aon:fileUpload id="signatureAttach_file" listWidth="100"
												fileUploadListener="#{trainingCenter.signatureFileUploaded}" >
												<f:facet name="label">
													<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
												</f:facet>
												<a4j:support event="onuploadcomplete" reRender="signatureAttachGrid" />
											</aon:fileUpload>
										</h:panelGrid>
									</a4j:region>
								</aon:panelGrid>
							</aon:div>
						</aon:div>
					</aon:div>
					
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-scroll-area">
				
				<c:if test="#{!trainingCenter.new}">
					<aon:panelTabSet >
					
						<aon:panelTab id="trainingCourse" label="#{bundle.payroll_trainingCourse_module}">
							<ui:include	src="/com/esferalia/aon/ui/payroll/facelet/trainingCenter/course/tab_grid.xhtml" >
								<ui:param name="controller" value="#{trainingCourse}" />
							</ui:include>
						</aon:panelTab>
						
						<aon:panelTab id="address" label="#{bundle.registry_address_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{trainingCenterAddress}" />
							</ui:include>
						</aon:panelTab>
						
						<aon:panelTab id="dirStaff" label="#{bundle.registry_dir_staff}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/rdirstaff/tab_grid.xhtml">
								<ui:param name="controller" value="#{trainingCenterDirStaff}" />
							</ui:include>
						</aon:panelTab>
						
					</aon:panelTabSet>
				</c:if>
				
			</aon:div>

		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{cnoLookup}" />
		
	</ui:define>
</ui:composition>
