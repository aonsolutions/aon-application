<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showContrataWindow">
		<c:if test="#{contract.showContrataWindow}">
			<rich:modalPanel id="ContrataModalPanel" 
				rendered="#{contract.showContrataWindow}" showWhenRendered="true"
				minWidth="800" minHeight="700" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{payrollBundle.payroll_contract_contrataData}" />
					</aon:div>
				</f:facet>
				
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showContrataWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{contract.showContrataWindow}" value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				
				<aon:form id="contrataForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div styleClass="aon-popupWindow-content-internal">
							
							<aon:div styleClass="aon-toolbar">
								<aon:commandButton id="contrata-accept"
									value="#{bundle.aon_accept}"
									actionListener="#{contract.onAcceptContrata}"
									action="contract_form"
									styleClass="aon-finding-toolbar-item aon-icon-accept">
									<rich:componentControl for="contrataPanel"
										event="onclick" reRender="contrataForm" operation="hide"/>																					
									<f:setPropertyActionListener 
										target="#{contract.showContrataWindow}"
										value="#{false}" />
								</aon:commandButton>
								<aon:commandButton id="contrata-cancel"
									value="#{bundle.aon_cancel}"
									reRender="showContrataWindow"
									immediate="true"
									styleClass="aon-finding-toolbar-item aon-icon-cancel">
									<f:setPropertyActionListener
										target="#{contract.showContrataWindow}"
										value="#{false}" />
								</aon:commandButton>
							</aon:div>
						
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/contrata/form_content.xhtml" />
							
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
