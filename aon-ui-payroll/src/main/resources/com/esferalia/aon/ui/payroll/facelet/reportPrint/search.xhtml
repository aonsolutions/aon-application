<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="reportPrintSearch">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="Listado de costes" />
				<ui:param name="controller" value="#{reportPrint}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipClearButton" value="#{true}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="salaryPrint-clear"
						value="#{bundle.aon_clear}"
						type="reset" ajaxSingle="true"
						actionListener="#{reportPrint.onClearFilter}"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
						
						
					<aon:htmlCommandLink id="salaryExpense_report-excel" 
						value="&#160;"
						actionListener="#{enterprise.onSelectFirst}"
						styleClass="aon-finding-toolbar-item aon-finding-toolbar-item-no-border aon-icon-excel" target="_blank"
						action="#{report.onExecute}">
						<f:setPropertyActionListener
							target="#{salaryExpense.startDate}" value="#{reportPrint.fromDate}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.endDate}" value="#{reportPrint.toDate}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.salaryTypes}" value="#{reportPrint.salaryTypes}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.person}" value="#{reportPrint.person}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.groupByPerson}" value="#{reportPrint.groupByEmployee}" />
						<f:param name="reportKey" value="#{reportPrint.groupByEmployee?'salaryExpenseMonthlyReport':'salaryExpenseReport'}" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="salaryExpense_report" 
						value="Listado"
						actionListener="#{enterprise.onSelectFirst}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						action="#{report.onExecute}">
						<f:setPropertyActionListener
							target="#{salaryExpense.startDate}" value="#{reportPrint.fromDate}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.endDate}" value="#{reportPrint.toDate}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.salaryTypes}" value="#{reportPrint.salaryTypes}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.person}" value="#{reportPrint.person}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.groupByPerson}" value="#{reportPrint.groupByEmployee}" />
						<f:param name="reportKey" value="#{reportPrint.groupByEmployee?'salaryExpenseMonthlyReport':'salaryExpenseReport'}" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>

					<aon:htmlCommandLink id="salaryExpense-detailed_report-excel" 
						value="&#160;"
						actionListener="#{enterprise.onSelectFirst}"
						styleClass="aon-finding-toolbar-item aon-finding-toolbar-item-no-border aon-icon-excel" target="_blank"
						action="#{report.onExecute}">
						<f:setPropertyActionListener
							target="#{salaryExpense.startDate}" value="#{reportPrint.fromDate}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.endDate}" value="#{reportPrint.toDate}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.salaryTypes}" value="#{reportPrint.salaryTypes}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.person}" value="#{reportPrint.person}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.groupByPerson}" value="#{reportPrint.groupByEmployee}" />
						<f:param name="reportKey" value="#{reportPrint.groupByEmployee?'salaryExpenseMonthlyDetailed':'salaryExpenseDetailed'}" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="salaryExpense-detailed_report" 
						value="Listado detallado"
						actionListener="#{enterprise.onSelectFirst}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						action="#{report.onExecute}">
						<f:setPropertyActionListener
							target="#{salaryExpense.startDate}" value="#{reportPrint.fromDate}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.endDate}" value="#{reportPrint.toDate}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.salaryTypes}" value="#{reportPrint.salaryTypes}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.person}" value="#{reportPrint.person}" />
						<f:setPropertyActionListener
							target="#{salaryExpense.groupByPerson}" value="#{reportPrint.groupByEmployee}" />
						<f:param name="reportKey" value="#{reportPrint.groupByEmployee?'salaryExpenseMonthlyDetailed':'salaryExpenseDetailed'}" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
						
				</ui:define>			
			</ui:decorate>
			
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{salaryPrint}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:define name="searchContent">
					
					<aon:if test="#{domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}">
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{reportPrint.enterprise}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="skipGoToButton" value="#{true}" />
							<ui:param name="skipInputText" value="#{true}" />
							<ui:param name="lookupReRender" value="reportPrintSearch" />
							<aon:methodParam name="lookupChangeListener" 
								value="#{reportPrint.onChangeEnterprise}" type="lookupChangeListener" />
						</ui:include>
					</aon:if>

					<aon:if test="#{!domainSwitcher.parentDomain or !domainSwitcher.domainManagementAvailable}">
						<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{reportPrint.person}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="skipGoToButton" value="#{true}" />
							<ui:param name="skipSearchButton" value="#{false}" />
						</ui:include>
					</aon:if>
						
					<aon:outputLabel value="#{bundle.payroll_salary_period}" />
					<h:panelGrid columns="6" >
						<aon:selectOneMenu id="reportPrint_month" value="#{reportPrint.month}"
							disabled="#{reportPrint.betweenDatesEnabled}" >
							<f:selectItems value="#{commonCollections.months}"  />
							<a4j:support event="onchange" reRender="reportPrintSearch" ajaxSingle="#{true}"
								actionListener="#{reportPrint.onChangePeriod}" />
						</aon:selectOneMenu>
						<rich:inputNumberSpinner id="reportPrint_year" value="#{reportPrint.year}"
							disabled="#{reportPrint.betweenDatesEnabled}"
			   				inputSize="4" minValue="2013" maxValue="2021">
							<a4j:support event="onchange" reRender="reportPrintSearch" ajaxSingle="#{true}"
								actionListener="#{reportPrint.onChangePeriod}" />
			   			</rich:inputNumberSpinner>
					</h:panelGrid>
					
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="reportPrint_period_betweenDates" 
							value="#{reportPrint.betweenDatesEnabled}" >
							<a4j:support event="onchange" reRender="reportPrintSearch" ajaxSingle="#{true}"
								actionListener="#{reportPrint.onChangePeriod}" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="reportPrint_period_betweenDates" value="entre fechas" />
						<aon:panel style="background-color: transparent; padding-top: 10px; margin: 0;">
							<aon:div>
								<aon:outputLabel value="#{bundle.aon_date_from}" styleClass="aon-italic, aon-margin-right"/>
								<aon:selectInputDate id="reportPrint_fromDate"
									disabled="#{!reportPrint.betweenDatesEnabled}"
									value="#{reportPrint.fromDate}"
									inputSize="10" renderAsPopup="true" enableManualInput="true"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}" >
									<a4j:support event="onchanged" reRender="reportPrintSearch" ajaxSingle="#{true}"/>
								</aon:selectInputDate>
								<aon:outputLabel value="#{bundle.aon_date_to}" styleClass="aon-italic, aon-margin-right"/>
								<aon:selectInputDate id="reportPrint_toDate"
									disabled="#{!reportPrint.betweenDatesEnabled}"
									value="#{reportPrint.toDate}"
									inputSize="10" renderAsPopup="true" enableManualInput="true"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}" >
									<a4j:support event="onchanged" reRender="reportPrintSearch" ajaxSingle="#{true}"/>
								</aon:selectInputDate>
							</aon:div>
						</aon:panel>
					</aon:div>
					
					<aon:outputLabel for="Salary_type"
						value="#{bundle.aon_type}" />
					<aon:selectManyCheckbox id="Salary_type"
						value="#{reportPrint.salaryTypes}" reRender="reportPrintSearch">
						<f:selectItem itemLabel="Nómina" itemValue="SALARY" />
						<f:selectItem itemLabel="Extra" itemValue="EXTRA" />
						<f:selectItem itemLabel="Atraso" itemValue="DELAY" />
						<f:selectItem itemLabel="Finiquito" itemValue="SETTLE" />
					</aon:selectManyCheckbox>
						
					<!--  
					<aon:if test="#{salaryPrint.showWorkPlaces}">
						<aon:outputLabel for="reportPrint_contract_workPlace_id"
							value="#{bundle.payroll_workplace}" />
						<aon:selectOneMenu id="reportPrint_contract_workPlace_id"
							value="#{reportPrint.workPlace}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{reportPrint.availableWorkPlaces}" />
							<a4j:support event="onchange" reRender="reportPrintSearch" ajaxSingle="#{true}"
								actionListener="#{reportPrint.onChangeWorkplace}" />
						</aon:selectOneMenu>		
					</aon:if>
					-->
						
					<!--  
					<aon:if test="#{reportPrint.showCCCs}">
						<aon:outputLabel for="reportPrint_contract_enterpriseCCC_id"
							value="#{bundle.company_enterprise_ccc}" />
						<aon:selectOneMenu id="reportPrint_contract_enterpriseCCC_id"
							value="#{reportPrint.enterpriseCCC}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{reportPrint.availableCCCs}" />
						</aon:selectOneMenu>		
					</aon:if>
					-->
					
					<aon:outputLabel for="reportPrint_groupOption" value="Agrupar por" />
					<aon:selectOneMenu id="reportPrint_groupOption" value="#{reportPrint.groupByEmployee}">
						<f:selectItem itemLabel="Empleados" itemValue="#{true}" />
						<f:selectItem itemLabel="Periodo" itemValue="#{false}" />
						<a4j:support event="onchange" reRender="reportPrintSearch" ajaxSingle="#{true}" />
					</aon:selectOneMenu>		
					
					
				</ui:define>
			</ui:decorate>
			
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		
	</ui:define>
</ui:composition>
