							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="skipGoToButton" value="#{true}" />
							<ui:param name="skipInputText" value="#{true}" />

								value="#{reportPrint.onChangeEnterprise}" type="lookupChangeListener" />
						</ui:include>
					</aon:if>

						</aon:selectOneMenu>
						<aon:selectOneMenu id="reportPrint_year" value="#{reportPrint.year}"

								actionListener="#{reportPrint.onChangePeriod}" />
						</aon:selectOneMenu>
					</h:panelGrid>

								</aon:selectInputDate>
								<aon:outputLabel value="#{bundle.aon_date_to}" styleClass="aon-italic, aon-margin-right"/>

									disabled="#{!reportPrint.betweenDatesEnabled}"
									value="#{reportPrint.toDate}"
									inputSize="10" renderAsPopup="true" enableManualInput="true"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}" >

						<f:selectItem itemLabel="Extra" itemValue="EXTRA" />
						<f:selectItem itemLabel="Atraso" itemValue="DELAY" />
						<f:selectItem itemLabel="Finiquito" itemValue="SETTLE" />
