<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="enterpriseForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{companyBundle.company_enterprise_module}" />
				<ui:param name="controller" value="#{enterprise}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{enterprise}" />
				<ui:define name="searchContent">

					<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{enterpriseSearchEx.enterprise}" />
						<ui:param name="lookupSuffix" value="-Integral" />						
						<ui:param name="skipGoToButton" value="#{true}" />
						<ui:param name="skipClearButton" value="#{true}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<ui:param name="lookupReRender" value="aonContent" />
						<aon:methodParam name="lookupAction" value="enterprise_formTree" />								
						<aon:methodParam name="lookupChangeListener" 
							value="#{enterpriseSearchEx.onEnterpriseChanged}" type="lookupChangeListener" />						
					</ui:include>	
					
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/enterpriseTree/searchContent.xhtml" />
					
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		<aon:lookupButtonPopup lookup="#{contractLookup}" />
		<aon:lookupButtonPopup lookup="#{personLookup}" />
	</ui:define>
</ui:composition>
