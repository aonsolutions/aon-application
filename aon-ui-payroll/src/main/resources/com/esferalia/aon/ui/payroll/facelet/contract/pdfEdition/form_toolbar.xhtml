		<ui:param name="toolbarTitle" value="Vista previa de" />
		
		<ui:define name="beforeToolbarContent">
			<aon:selectOneMenu value="#{contractPdf.documentType}">
				<f:selectItem itemLabel="" itemValue="#{null}"/>
				<f:selectItems value="#{contractPdf.availableDocumentList}"/>
			</aon:selectOneMenu>
		</ui:define>
		
		<ui:define name="toolbarContent">
		
			<aon:commandButton id="contract-refresh"
				value="#{contractPdf.documentType==null?bundle.aon_loader_load:bundle.sepe_reload}"
				reRender="#{toolbarReRender}"
				action="contractPdfEdition_form"
				actionListener="#{contractPdf.onChangeContractDocument}"
				styleClass="aon-finding-toolbar-item aon-icon-refresh" />
		
			<aon:if test="#{!contractPdf.readOnly}">
				<aon:commandButton id="accept"
					value="#{contractPdf.nevv?bundle.aon_accept:bundle.aon_save}"
					actionListener="#{contractPdf.onDocumentSave}"
					styleClass="aon-finding-toolbar-item aon-icon-accept" />	
			</aon:if>
			
			<aon:commandButton id="cancel" immediate="true"
				value="#{bundle.aon_back}"
				action="#{contractPdf.backAction}"
				styleClass="aon-finding-toolbar-item aon-icon-cancel" />

			<!--

			<aon:if test="#{not empty contractPdf.documentType}">

					title="#{bundle.payroll_draft_download}"
					rendered="#{!contractPdf.nevv}"
					actionListener="#{contractPdf.onDownloadPdf}"
					styleClass="aon-finding-toolbar-item aon-icon-pdf" />
					
				<aon:div style="display:inline; width:100%;">
					<aon:outputText value="#{bundle.aon_page}:"
						styleClass="aon-margin-left" />
					<ui:include 
						src="/com/esferalia/aon/ui/payroll/facelet/contract/pdfEdition/page_spinner.xhtml" />
					
					<aon:outputText value="#{bundle.aon_size}:"

					<ui:include

				</aon:div>
