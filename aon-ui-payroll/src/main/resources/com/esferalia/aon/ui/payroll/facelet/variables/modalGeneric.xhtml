<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="#{controller.beanName}ModalContainer">
		<c:if test="#{controller.modalPanelVisible}">
			<rich:modalPanel id="#{controller.beanName}ModalPanel" minHeight="600"
				minWidth="900" showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{popupWindowTitle}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{controller.onCancel}"
							reRender="#{controller.beanName}ModalContainer,#{container}" immediate="true">
							<aon:actionHotKey key="esc" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="#{controller.beanName}ModalForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="#{controller.beanName}Save"
											value="#{bundle.aon_accept}"
											reRender="#{controller.beanName}ModalContainer,#{container}"
											actionListener="#{controller.onSave}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
										</aon:commandButton>
										<aon:commandButton id="#{controller.beanName}Cancel"
											value="#{bundle.aon_cancel}"
											reRender="#{controller.beanName}ModalContainer,#{container}"
											actionListener="#{controller.onCancel}"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
										</aon:commandButton>
										<aon:commandButton id="#{controller.beanName}Remove"
											value="#{bundle.aon_remove}"
											reRender="#{controller.beanName}ModalContainer,#{container}"
											actionListener="#{controller.onRemove}"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-delete"
											onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;">
										</aon:commandButton>
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<ui:insert name="gridContent"/>
									</aon:div>
									
									<ui:include 
										src="/com/esferalia/aon/ui/payroll/facelet/variables/data/grid.xhtml" >
										<ui:param name="controller" value="#{controller}" />
									</ui:include>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<ui:insert name="afterVariablesContent"/>
									</aon:div>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
				
				<ui:insert name="afterModalContent"/>
				
				<c:if test="#{!skipModalHelper}">
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/variables/helper/modalHelper.xhtml">
					<ui:param name="controller" value="#{controller}" />
					<ui:param name="container" value="#{controller.beanName}VarContainer" />
				</ui:include>
				</c:if>
				
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>
	
				
</ui:composition>
