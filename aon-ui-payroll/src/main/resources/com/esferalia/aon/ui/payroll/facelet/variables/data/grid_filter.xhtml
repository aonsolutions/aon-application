<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:div styleClass="aon-group aon-panelGrid-search">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{bundle.payroll_data_filter}" styleClass="aon-bold" />
		</aon:div>
		<aon:div styleClass="aon-group-body" >	
			
			<aon:panelGrid columns="3" 
				columnClasses="aon-panelGrid-odd aon-width-100, aon-panelGrid-even aon-width-300, aon-panelGrid-even aon-width-auto">
				
				<aon:selectOneRadio value="#{controller.variableFilter.searchCurrentVariables}" style="display:inline;">
					<f:selectItem itemLabel="#{bundle.payroll_current}" itemValue="#{true}" />
					<f:selectItem itemLabel="#{bundle.payroll_historyc}" itemValue="#{false}" />
					<a4j:support event="onclick" reRender="#{controller.beanName}VarContainer" ignoreDupResponses="true" >
						<aon:actionListener method="#{controller.variableFilter.onChangeSearchCurrent}" />
						<aon:actionListener method="#{controller.reloadData}" />
					</a4j:support>
				</aon:selectOneRadio>
				
				<aon:div styleClass="aon-nowrap">
					<aon:outputLabel styleClass="aon-italic aon-margin-left aon-margin-right"
						value="#{bundle.aon_end_date}:" />
					<aon:selectOneMenu 
						styleClass="aon-margin-right"
						disabled="#{controller.variableFilter.searchCurrentVariables}"
						value="#{controller.variableFilter.inactiveLastPeriod}" >
						<f:selectItems value="#{payrollCollections.inactiveLastPeriods}" />
						<a4j:support event="onchange" reRender="#{controller.beanName}VarContainer" ignoreDupResponses="true" >
							<aon:actionListener method="#{controller.variableFilter.onChangeLastPeriod}" />
							<aon:actionListener method="#{controller.reloadData}" />
						</a4j:support>
					</aon:selectOneMenu>
					<aon:selectInputDate  
						disabled="#{!(!controller.variableFilter.searchCurrentVariables and controller.variableFilter.inactiveLastPeriod=='MANUAL')}"
						value="#{controller.variableFilter.inactiveDate}"
						inputSize="10" renderAsPopup="true" enableManualInput="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
						<a4j:support event="onchanged" reRender="#{controller.beanName}VarContainer" ignoreDupResponses="true">
							<aon:actionListener method="#{controller.reloadData}" />
						</a4j:support>
					</aon:selectInputDate>
				</aon:div>
				
				<aon:selectOneMenu 
					styleClass="aon-margin-right"
					value="#{controller.variableFilter.selectedVariableFilter}" >
					<f:selectItem itemLabel=" - " value="#{null}" />
					<f:selectItems value="#{controller.variableFilter.availableVariables}" />
					<a4j:support event="onchange" reRender="#{controller.beanName}VarContainer" ignoreDupResponses="true" >
						<aon:actionListener method="#{controller.reloadData}" />
					</a4j:support>
				</aon:selectOneMenu>
			
			</aon:panelGrid>
			
		</aon:div>
	</aon:div> 
		
</ui:composition>
