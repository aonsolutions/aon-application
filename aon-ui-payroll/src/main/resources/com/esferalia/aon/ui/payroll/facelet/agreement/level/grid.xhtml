<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<aon:div styleClass="aon-scroll-area">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{agreementLevel}" />
			
			<ui:define name="columns">
				<aon:column alias="AgreementLevel.description" 
					styleClass="aon-editDataTable-textColumn aon-width-400">
					<f:facet name="header">
						<aon:outputLabel for="AgreementLevel_description"
							value="#{bundle.payroll_agreementLevel}" />		
					</f:facet>
					<aon:outputText value="#{to.description}"
						rendered="#{formList}" />
					<aon:inputText id="AgreementLevel_description" 
						rendered="#{formEdit}" required="true"
						value="#{controller.to.description}" 
						size="64" maxlength="64" />
					<f:facet name="footer">
						<aon:inputText id="AgreementLevel_description-New" 
							rendered="#{formNew}" required="true"
							value="#{controller.to.description}" 
							size="64" maxlength="64" />
					</f:facet>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputLabel for="AgreementLevel_categories"
							value="#{bundle.aon_categories}" />		
					</f:facet>
					<aon:panelGroup rendered="#{formList or formEdit}">
						<aon:outputText value="#{agreementLevel.categories}" />
						<aon:commandButton id="createBank" value="&#160;"
							rendered="#{formEdit}"
							reRender="categoryModalContainer"
							actionListener="#{agreementLevel.onEditCategoryList}"
							styleClass="aon-editDataTable-button aon-icon-edit-add" />
					</aon:panelGroup>
					<f:facet name="footer">
						<aon:div>
							<aon:inputText id="AgreementLevel_categories-New" 
								rendered="#{formNew}" 
								value="#{agreementLevel.categories}" 
								size="128" />
							<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
								<aon:outputText value="Indique los nombres de las categorias separados por comas." />
							</rich:toolTip>
						</aon:div>
					</f:facet>
				</aon:column>
			</ui:define>

		</ui:decorate>
	</aon:div>

</ui:composition>
