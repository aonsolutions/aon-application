<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="craBatchSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.payroll_craBatch_module}" />
				<ui:param name="controller" value="#{craBatch}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{craBatch}" />
				<ui:define name="searchContent">
				
					<aon:outputLabel value="#{bundle.fanBatch_liquidation_period}" />
					<aon:div>
						<aon:outputLabel for="CraBatch_date-from" styleClass="aon-form-date-label aon-margin-right"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="CraBatch_date-from"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					
						<aon:outputLabel for="CraBatch_date-to" styleClass="aon-form-date-label aon-margin-right"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="CraBatch_date-to"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
					
					<aon:outputLabel for="CraBatch_status" value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="CraBatch_status" converter="aon.EnumConverter"
						valueChangeListener="#{controller.addEqualExpression}" >
						<f:selectItem itemLabel=" - " value="#{null}" />
						<f:selectItems value="#{payrollCollections.fileStatus}" />
					</aon:selectOneMenu>
										
				</ui:define>
			</ui:decorate>
		</aon:form>
		
	</ui:define>
	
</ui:composition>
