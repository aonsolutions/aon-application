<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:dataTable id="ContractBonusTable" var="to" value="#{controller.undefinedVariablesModel}" rows="0">
			
		<aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_name}" />
			</f:facet>
			<aon:outputText value="#{to.name}"  />
		</aon:column>
				
		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton
				id="ContractData-add" 
				title="#{payrollBundle.payroll_contract_define_variable_button_title}"
				actionListener="#{controller.onAddUndefinedVariable}"
				reRender="#{saveReRender}"
				styleClass="aon-editDataTable-button aon-icon-reset"
				accesskey="#{bundle.aon_key_new_line}"/>
		</aon:column>
	
	</aon:dataTable>

</ui:composition>
