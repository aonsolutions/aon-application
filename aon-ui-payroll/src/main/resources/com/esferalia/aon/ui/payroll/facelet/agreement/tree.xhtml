<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:form id="agreementTreeForm">	
		<aon:div style="height: 500px;scroll: auto;background-color: #F0F0F0; padding: 5px; border: solid #B8B8B8 1px;">
			<rich:tree id="agreementTree"
				styleClass="aon-width-200" style="overflow:hidden;"
				selectedClass="aon-tree-node-active"
				
				highlightedClass="aon-tree-node-highlighted"			
				adviseNodeSelected="#{agreementTree.adviseNodeSelected}" 
				adviseNodeOpened="#{agreementTree.adviseNodeOpened}"
				componentState="#{agreementTree.state}"
				nodeSelectListener="#{agreementTree.processSelection}" 
				value="#{agreementTree.rootNode}" var="agreementNode" >
				
				<rich:treeNode styleClass="aon-width-all"
					icon="#{agreementNode.type.icon}"
					iconLeaf="#{agreementNode.type.icon}" >
					<a4j:support event="onselected" 
						actionListener="#{agreementNode.actionListener}" 
						reRender="agreementTreePanel"/>
					<aon:outputText style="font-size: 0.8em;"
						value="#{agreementNode.label}" >
						<aon:abbreviateConverter maxWidth="25" />
					</aon:outputText>
				</rich:treeNode>
			</rich:tree>
		</aon:div>
	</aon:form>	
	
</ui:composition>
