<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components" >

	<aon:column styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputLabel for="IrpfDataDescendients_birthYear"
				value="#{bundle.payroll_irpfData_birthYear}" />
		</f:facet>
		<aon:outputText value="#{to.birthYear}" 
			rendered="#{formList}" />
		<rich:inputNumberSpinner id="IrpfDataDescendients_birthYear" required="true"
			rendered="#{formEdit}" 
			value="#{to.birthYear}" 
			inputSize="4" minValue="1950" maxValue="#{irpfData.currentYear}" />
		<f:facet name="footer">
			<rich:inputNumberSpinner id="IrpfDataDescendients_birthYear-New" required="true"
				rendered="#{formNew}" 
				value="#{controller.to.birthYear}" 
				inputSize="4" minValue="1950" maxValue="#{irpfData.currentYear}" />
		</f:facet>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputLabel for="IrpfDataDescendients_adoptionYear"
				value="#{bundle.payroll_irpfData_adoptionYear}" />
		</f:facet>
		<aon:outputText value="#{to.adoptionYear}" 
			rendered="#{formList}" />
		<rich:inputNumberSpinner id="IrpfDataDescendients_adoptionYear"
			rendered="#{formEdit}" 
			value="#{to.adoptionYear}" 
			inputSize="4" minValue="1950" maxValue="#{irpfData.currentYear}" />
		<f:facet name="footer">
			<rich:inputNumberSpinner id="IrpfDataDescendients_adoptionYear-New"
				rendered="#{formNew}" 
				value="#{controller.to.adoptionYear}" 
				inputSize="4" minValue="1950" maxValue="#{irpfData.currentYear}" />
		</f:facet>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputLabel for="IrpfDataDescendients_disabilityLevel"
				value="#{bundle.payroll_irpfData_disabilityLevel}" />
		</f:facet>
		<aon:outputText value="#{to.disabilityLevel}" 
			rendered="#{formList}" />
		<aon:selectOneMenu id="IrpfDataDescendients_disabilityLevel" rendered="#{formEdit}"
			value="#{to.disabilityLevel}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{payrollCollections.disabilityLevels}" />
		</aon:selectOneMenu>
		<f:facet name="footer">
			<aon:selectOneMenu id="IrpfDataDescendients_disabilityLevel-New" rendered="#{formNew}"
				value="#{controller.to.disabilityLevel}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{payrollCollections.disabilityLevels}" />
			</aon:selectOneMenu>
		</f:facet>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-iconColumn aon-text-center">
		<f:facet name="header">
			<aon:outputLabel for="IrpfDataDescendients_dependence"
				value="#{bundle.payroll_irpfData_dependence}" />
		</f:facet>
		<aon:outputText value="&#160;" style="padding-left: 15px;" rendered="#{formList}"
			styleClass="#{to.dependence?'aon-icon-checked':'aon-icon-check'}"/>
		<aon:selectBooleanCheckbox id="IrpfDataDescendients_dependence" rendered="#{formEdit}" value="#{to.dependence}"/>
		<f:facet name="footer">
			<aon:selectBooleanCheckbox id="IrpfDataDescendients_dependence-New" rendered="#{formNew}" value="#{controller.to.dependence}"/>
		</f:facet>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-iconColumn aon-text-center">
		<f:facet name="header">
			<aon:outputLabel for="IrpfDataDescendients_uniqueParent"
				value="#{bundle.payroll_irpfData_uniqueParent}" />
		</f:facet>
		<aon:outputText value="&#160;" style="padding-left: 15px;" rendered="#{formList}"
			styleClass="#{to.uniqueParent?'aon-icon-checked':'aon-icon-check'}"/>
		<aon:selectBooleanCheckbox id="IrpfDataDescendients_uniqueParent" rendered="#{formEdit}" value="#{to.uniqueParent}"/>
		<f:facet name="footer">
			<aon:selectBooleanCheckbox id="IrpfDataDescendients_uniqueParent-New" rendered="#{formNew}" value="#{controller.to.uniqueParent}"/>
		</f:facet>
	</aon:column>



</ui:composition>
