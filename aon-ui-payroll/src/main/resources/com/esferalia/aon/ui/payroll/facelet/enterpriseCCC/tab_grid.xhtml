<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		
		<ui:define name="beginFormListContent">
			<aon:outputText  title="No existe ningún centro de trabajo en la provincia indicada en esta cuenta."
				rendered="#{!controller.validGeozone}"
				styleClass="aon-icon-exception"
				style="padding-left: 15px;"
				value="&#160;" />
		</ui:define>
		
		<ui:define name="columns">
		
			<aon:column alias="EnterpriseCCC.type"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="EnterpriseCCC_type"
						value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.type}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="EnterpriseCCC_type" required="true"
					value="#{controller.to.type}" rendered="#{formEdit}">
					<f:selectItem itemLabel=" - " itemValue="#{null}" />
					<f:selectItems value="#{controller.CCCTypes}" />
					<a4j:support event="onchange" ajaxSingle="true"
						reRender="EnterpriseCCC_SSNumberPanel, EnterpriseCCC_geozone" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="EnterpriseCCC_type-New" required="true"
						value="#{controller.to.type}" rendered="#{formNew}">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{controller.CCCTypes}" />
						<a4j:support event="onchange" ajaxSingle="true"
							reRender="EnterpriseCCC_SSNumberPanel-New, EnterpriseCCC_geozone-New" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
		
			<aon:column alias="EnterpriseCCC.ccc"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="EnterpriseCCC_ccc" value="#{bundle.aon_value}" />
				</f:facet>
				<aon:panelGroup rendered="#{formList}">
					<aon:outputText value="#{controller.quoteRegimeCode}" />
					<aon:outputText value="#{to.ccc}" />
					<aon:outputText value="&#160;"
						rendered="#{controller.validSSNumber}"
						styleClass="aon-icon-predetermine"
						style="padding-left: 15px;" />
					<aon:outputText value="&#160;"
						rendered="#{not empty to.ccc and !controller.validSSNumber}"
						styleClass="aon-icon-exception"
						style="padding-left: 15px;" />
				</aon:panelGroup>
				<aon:panelGroup id="EnterpriseCCC_SSNumberPanel" rendered="#{formEdit}">
					<aon:outputText value="#{controller.quoteRegimeCode}" />
					<aon:inputText id="EnterpriseCCC_ccc" value="#{to.ccc}"
						required="true" maxlength="11" size="12" >
						<f:validateLength minimum="1" maximum="11" />
						<a4j:support event="onchange"
							actionListener="#{controller.onChangeCcc}" 
							reRender="EnterpriseCCC_SSNumberPanel, EnterpriseCCC_geozone" 
							ajaxSingle="true" />
					</aon:inputText>
					<aon:outputText value="&#160;"
						rendered="#{controller.validSSNumber}"
						styleClass="aon-icon-predetermine"
						style="padding-left: 15px;" />
					<aon:outputText value="&#160;"
						rendered="#{not empty to.ccc and !controller.validSSNumber}"
						styleClass="aon-icon-exception"
						style="padding-left: 15px;" />
				</aon:panelGroup>
				<f:facet name="footer">
					<aon:panelGroup id="EnterpriseCCC_SSNumberPanel-New" rendered="#{formNew}">
						<aon:outputText value="#{controller.quoteRegimeCode}" />
						<aon:inputText id="EnterpriseCCC_ccc-New" value="#{controller.to.ccc}"
							required="true" maxlength="11" size="12" >
							<f:validateLength minimum="1" maximum="11" />
							<a4j:support event="onchange"
								actionListener="#{controller.onChangeCcc}" 
								reRender="EnterpriseCCC_SSNumberPanel-New, EnterpriseCCC_geozone-New" 
								ajaxSingle="true" />
						</aon:inputText>
						<aon:outputText value="&#160;"
							rendered="#{controller.validSSNumber}"
							styleClass="aon-icon-predetermine"
							style="padding-left: 15px;" />
						<aon:outputText value="&#160;"
							rendered="#{not empty controller.to.ccc and !controller.validSSNumber}"
							styleClass="aon-icon-exception"
							style="padding-left: 15px;" />
					</aon:panelGroup>
				</f:facet>
			</aon:column>
			
			<aon:column alias="EntepriseCCC.geozone"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="EntepriseCCC_geozone" value="#{bundle.aon_state}" />
				</f:facet>
				<aon:outputText value="#{to.geozone.name}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="EnterpriseCCC_geozone"
					value="#{controller.to.geozone}" rendered="#{formEdit}">
					<f:selectItems value="#{geozoneCollections.geoTrees}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="EnterpriseCCC_geozone-New"
						value="#{controller.to.geozone}" rendered="#{formNew}">
						<f:selectItems value="#{geozoneCollections.geoTrees}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>						
			
		</ui:define>
		
	</ui:decorate>
</ui:composition>
