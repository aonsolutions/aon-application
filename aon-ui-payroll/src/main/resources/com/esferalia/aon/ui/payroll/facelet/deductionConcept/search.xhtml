<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="deductionConceptSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_deductionConcept_module}" />
				<ui:param name="controller" value="#{deductionConcept}" />
			</ui:include>
			
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{deductionConcept}" />
				<ui:define name="searchContent">
					<aon:outputLabel for="DeductionConcept_code"
						value="#{bundle.aon_id}" />
					<aon:inputText id="DeductionConcept_code" size="5" maxlength="5"
						valueChangeListener="#{deductionConcept.addExpression}" />

					<aon:outputLabel for="DeductionConcept_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="DeductionConcept_description" size="64" maxlength="64"
						valueChangeListener="#{deductionConcept.addExpression}" />
						
					<aon:outputLabel for="DeductionConcept_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="DeductionConcept_type" 
						converter="aon.EnumConverter"
						valueChangeListener="#{deductionConcept.addEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{payrollCollections.deductionTypes}" />
					</aon:selectOneMenu>	
						
				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>
</ui:composition>
