<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
		<aon:form id="irpfDataContractSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.payroll_model_145_module}" />
				<ui:param name="controller" value="#{irpfData}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{irpfData}" />
				<ui:define name="searchContent">
					
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{irpfDataSearch.contract}" />
					</ui:include>
					
					<aon:outputLabel value="#{bundle.aon_start_date}" />
					<aon:div>
						<aon:outputLabel for="IrpfData_startDate-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="IrpfData_startDate-From"
							valueChangeListener="#{irpfData.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					
						<aon:outputLabel for="IrpfData_startDate-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="IrpfData_startDate-To"
							valueChangeListener="#{irpfData.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
				
					<aon:outputLabel value="#{bundle.aon_end_date}" />
					<aon:div id="IrpfData_endDate">
						<aon:outputLabel for="IrpfData_endDate-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="IrpfData_endDate-From"
							disabled="#{irpfDataSearch.activeContract}"
							value="#{irpfDataSearch.endDateFrom}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					
						<aon:outputLabel for="IrpfData_endDate-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="IrpfData_endDate-To"
							disabled="#{irpfDataSearch.activeContract}"
							value="#{irpfDataSearch.endDateTo}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
					
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="IrpfData_activeContract"
							reRender="IrpfData_endDate"
							value="#{irpfDataSearch.activeContract}" >
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="IrpfData_activeContract"
							value="#{bundle.payroll_current}" />
					</aon:div>
					
				</ui:define>
			</ui:decorate>
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{contractLookup}" />
		
	</ui:define>
</ui:composition>
