<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	
	<!--  DATOS PERSONALES DEL PERCEPTOR -->
	
	<aon:div styleClass="aon-border-left aon-border-top aon-border-right aon-margin-top aon-text-center irpf_background"  >
		<aon:outputText value="DATOS PERSONALES DEL PERCEPTOR  NIF: #{irpf.document}" />
	</aon:div>
	<aon:panelGrid styleClass="aon-border aon-padding-left aon-padding-bottom irpf_background"
				columns="2" style="width: 100%;"
				columnClasses="aon-noborder aon-width-half
							  ,aon-noborder aon-width-half">
							  
		<aon:panelGrid styleClass="aon-padding-left "
					columns="3" style="width: 100%;"
					columnClasses="aon-noborder aon-vertical-align-bottom
								  ,aon-noborder aon-vertical-align-bottom
								  ,aon-noborder aon-width-150  aon-text-center aon-padding-left aon-padding-top aon-padding-right aon-vertical-align-bottom">
	
			<aon:div styleClass="irpf_bottom_border"  >
				<aon:outputText value="Año de nacimiento " />
			</aon:div>
			<aon:div styleClass="irpf_bottom_border" >
				<aon:outputText value="&#160;" />
			</aon:div>
			<ui:include src="#{propertyEditor}" >
				<ui:param name="property" value="birthYear" />
			</ui:include>
	
			<aon:div styleClass="irpf_bottom_border"  >
				<aon:outputText value="Situación familiar" />
			</aon:div>
			<aon:div styleClass="irpf_bottom_border" >
				<aon:outputText value="&#160;" />
			</aon:div>
			<ui:include src="#{propertyEditor}" >
				<ui:param name="constant" value="3" />
			</ui:include>
	
			<aon:div styleClass="irpf_bottom_border"  >
				<aon:outputText value="Discapacidad" />
			</aon:div>
			<aon:div styleClass="irpf_bottom_border" >
				<aon:outputText value="&#160;" />
			</aon:div>
			<ui:include src="#{propertyEditor}" >
				<ui:param name="constant" value="NO" />
			</ui:include>
	
			<aon:div styleClass="irpf_bottom_border"  >
				<aon:outputText value="Situación laboral" />
			</aon:div>
			<aon:div styleClass="irpf_bottom_border" >
				<aon:outputText value="&#160;" />
			</aon:div>
			<ui:include src="#{propertyEditor}" >
				<ui:param name="constant" value="ACTIVO" />
			</ui:include>
	
		</aon:panelGrid>
		
		<aon:panelGrid styleClass="aon-padding-left "
					columns="3" style="width: 100%;"
					columnClasses="aon-noborder aon-vertical-align-bottom
								  ,aon-noborder aon-vertical-align-bottom
								  ,aon-noborder aon-width-150  aon-text-center aon-padding-left aon-padding-top aon-padding-right aon-vertical-align-bottom">
			<aon:div styleClass="irpf_bottom_border"  >
				<aon:outputText value="Tipo de contrato o relación" />
			</aon:div>
			<aon:div styleClass="irpf_bottom_border" >
				<aon:outputText value="&#160;" />
			</aon:div>
			<aon:div styleClass="aon-border" >
				<aon:outputText value="#{'GENERAL'}" />
			</aon:div> 
	
			<aon:div styleClass="irpf_bottom_border"  >
				<aon:outputText value="Movilidad geográfica" />
			</aon:div>
			<aon:div styleClass="irpf_bottom_border" >
				<aon:outputText value="&#160;" />
			</aon:div>
			<ui:include src="#{propertyEditor}" >
				<ui:param name="constant" value="NO" />
			</ui:include> 
	
			<aon:div styleClass="irpf_bottom_border"  >
				<aon:outputText value="Prolongación activad laboral " />
			</aon:div>
			<aon:div styleClass="irpf_bottom_border" >
				<aon:outputText value="&#160;" />
			</aon:div>
			<ui:include src="#{propertyEditor}" >
				<ui:param name="constant" value="NO" />
			</ui:include> 
	
			<aon:div styleClass="irpf_bottom_border"  >
				<aon:outputText value="Residente en Ceuta o Melilla" />
			</aon:div>
			<aon:div styleClass="irpf_bottom_border" >
				<aon:outputText value="&#160;" />
			</aon:div>
			<ui:include src="#{propertyEditor}" >
				<ui:param name="constant" value="NO" />
			</ui:include> 
	
		</aon:panelGrid>
	
	</aon:panelGrid>


</ui:composition>
