<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/esferalia/aon/ui/payroll/facelet/enterpriseTree/treeTemplate.xhtml">

	<ui:define name="header">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_economic_data}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
			<ui:define name="toolbarContent">
				
			</ui:define>				
		</ui:decorate>	
	</ui:define>

	<ui:define name="content">
			
		<aon:div id="contractMainDataForm" >
		
			<aon:div styleClass="aon-panelGrid-search"  
				style="margin-bottom:10px; padding:10px 0 10px 10px;">
				<aon:panelGrid columns="3" 
						columnClasses="aon-panelGrid-odd aon-width-100
									,aon-panelGrid-even aon-width-auto
									,aon-panelGrid-even aon-width-auto">
					
				<aon:outputText value="#{payrollBundle.payroll_data_filter}" styleClass="aon-bold" />
				
				<aon:selectOneRadio value="#{enterpriseTree.searchCurrent}" style="display:inline;">
					<f:selectItem itemLabel="#{payrollBundle.payroll_current}" itemValue="#{true}" />
					<f:selectItem itemLabel="#{payrollBundle.payroll_historyc}" itemValue="#{false}" />
					<a4j:support event="onclick" reRender="contractMainDataForm" ignoreDupResponses="true" >
						<aon:actionListener method="#{enterpriseTree.reloadTreeMainData}" />
					</a4j:support>
				</aon:selectOneRadio>
				
				<aon:panelGroup >
					<aon:outputLabel styleClass="aon-italic aon-margin-left aon-margin-right"
						value="#{bundle.aon_end_date}:" />
					<aon:selectOneMenu 
						styleClass="aon-margin-right"
						disabled="#{enterpriseTree.searchCurrent}"
						value="#{enterpriseTree.inactiveLastPeriod}" >
						<f:selectItems value="#{payrollCollections.inactiveLastPeriods}" />
						<a4j:support event="onchange" reRender="contractMainDataForm" ignoreDupResponses="true" >
							<aon:actionListener method="#{enterpriseTree.onChangeLastPeriod}" />
							<aon:actionListener method="#{enterpriseTree.reloadTreeMainData}" />
						</a4j:support>
					</aon:selectOneMenu>
					<aon:selectInputDate  
						disabled="#{!(!enterpriseTree.searchCurrent and enterpriseTree.inactiveLastPeriod=='MANUAL')}"
						value="#{enterpriseTree.inactiveDate}"
						inputSize="10" renderAsPopup="true" enableManualInput="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
						<a4j:support event="onchanged" reRender="contractMainDataForm" ignoreDupResponses="true">
							<aon:actionListener method="#{enterpriseTree.reloadTreeMainData}" />
						</a4j:support>
					</aon:selectInputDate>
				</aon:panelGroup>
				
				</aon:panelGrid>
	
			</aon:div>	
			
			<rich:simpleTogglePanel opened="#{contractPayment.paymentsModel.rowCount > 0}" 
		        switchType="client"
		        style="margin-top:5px;"
				label="#{payrollBundle.payroll_salary_payments_tab}">
				<aon:div id="paymentGrid" >
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/payment/editGridContent.xhtml" >
						<ui:param name="controller" value="#{contractPayment}" />
					</ui:include>
				</aon:div>       
		    </rich:simpleTogglePanel>   
	
			<rich:simpleTogglePanel opened="#{contractDeduction.model.rowCount > 0}"
				switchType="client"
		        style="margin-top:5px;"
		        label="#{payrollBundle.payroll_salary_deductions_tab}" >
				<aon:div id="deductionGrid" >
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/editGridContent.xhtml" >
						<ui:param name="controller" value="#{contractDeduction}" />
					</ui:include>
				</aon:div>
			</rich:simpleTogglePanel>
						
			<rich:simpleTogglePanel opened="#{contractBonus.model.rowCount > 0}" 
				switchType="client"
		        style="margin-top:5px;"
		        label="#{payrollBundle.payroll_salary_bonus_tab}">
				<aon:div id="bonusGrid" >
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/bonus/editGridContent.xhtml" >
						<ui:param name="controller" value="#{contractBonus}" />
					</ui:include>
				</aon:div>
			</rich:simpleTogglePanel>
		
			<rich:simpleTogglePanel opened="#{contractEmbargo.model.rowCount > 0}"
				switchType="client"
		        style="margin-top:5px;"
		        label="#{payrollBundle.payroll_salary_embargos_tab}">
				<aon:div id="embargoGrid" >
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/embargo/listContent.xhtml">
						<ui:param name="controller" value="#{contractEmbargo}" />
					</ui:include>
				</aon:div>
			</rich:simpleTogglePanel>
		
		</aon:div>
	</ui:define>

	<ui:define name="additionalContent">
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/payment/modalPayment.xhtml">
			<ui:param name="controller" value="#{contractPayment}" />
			<ui:param name="skipCurrentMonth" value="#{true}" />
			<ui:param name="contextDisabled" value="#{true}" />
			<ui:param name="container" value="paymentGrid" />
		</ui:include>
		
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/modalDeduction.xhtml">
			<ui:param name="controller" value="#{contractDeduction}" />
			<ui:param name="skipCurrentMonth" value="#{true}" />
			<ui:param name="contextDisabled" value="#{true}" />
			<ui:param name="container" value="deductionGrid" />
		</ui:include>
		
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/bonus/modalBonus.xhtml">
			<ui:param name="controller" value="#{contractBonus}" />
			<ui:param name="skipCurrentMonth" value="#{true}" />
			<ui:param name="contextDisabled" value="#{true}" />
			<ui:param name="container" value="bonusGrid" />
		</ui:include>
		
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/embargo/modalEmbargo.xhtml">
			<ui:param name="controller" value="#{contractEmbargo}" />
			<ui:param name="container" value="embargoGrid" />
		</ui:include>
	</ui:define>
		
</ui:composition>
