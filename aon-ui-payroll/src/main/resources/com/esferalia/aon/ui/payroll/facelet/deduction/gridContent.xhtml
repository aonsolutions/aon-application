<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<aon:div styleClass="aon-margin-top aon-border" 
		style="margin-left: 5px;background-color:#f6f5e3;">
		
		<aon:panelGrid columns="1" style="width: 100%;margin-right:10px;"
			columnClasses="aon-noborder aon-padding-left aon-width-auto">
			
			<aon:outputText value="&#160;II. #{bundle.payroll_salary_deductions2}&#160;" 
				styleClass="aon-bold" style="position: relative; top: -8px; margin-left: 5px; background-color: white;"/>

			<aon:div style="margin-left: 10px;">
				<aon:outputText value="1. #{bundle.payroll_salary_deduction_12}" styleClass="aon-bold"/>
			</aon:div>
		</aon:panelGrid>

		<aon:panelGrid columns="3" style="width: 100%;margin-right:10px;"
			columnClasses="aon-noborder aon-padding-left aon-width-auto
						  ,aon-noborder aon-padding-right aon-width-250 aon-text-right
						  ,aon-noborder aon-padding-right aon-width-100 aon-text-right aon-bold">
			
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/listContent.xhtml" >
				<ui:param name="deductions" value="#{sortedSalaryDeductions.items['COMMON_CONTINGENCY']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/listContent.xhtml" >
				<ui:param name="deductions" value="#{sortedSalaryDeductions.items['UNEMPLOYMENT']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/listContent.xhtml" >
				<ui:param name="deductions" value="#{sortedSalaryDeductions.items['JOB_TRAINING']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/listContent.xhtml" >
				<ui:param name="deductions" value="#{sortedSalaryDeductions.items['STRUCTURAL_OVERTIME']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/listContent.xhtml" >
				<ui:param name="deductions" value="#{sortedSalaryDeductions.items['NON_STRUCTURAL_OVERTIME']}" />
			</ui:include>


			<aon:div style="margin-left: 20px;">
				<aon:outputText value="&#160;"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px; text-align: right;">
				<aon:outputText value="#{bundle.payroll_salary_total_contribution}" />
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{socialSecurityContributions}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>



			<c:forEach var="irpf" items="#{sortedSalaryDeductions.items['IRPF'].list}" >
				<c:set var="irpfTotal" value="#{irpfTotal + irpf.amount}" />
				<c:set var="irpfDescription" value="#{irpf.description}" />
			</c:forEach>
			
			<aon:div style="margin-left: 10px; border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="2. #{bundle.payroll_salary_deduction_22}" styleClass="aon-bold"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{irpfDescription}"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{irpfTotal}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>

			<aon:div style="margin-left: 10px; border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="3. #{bundle.payroll_salary_deduction_32}" styleClass="aon-bold"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
			</aon:div>
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/listContent.xhtml" >
				<ui:param name="hide" value="#{true}" />
				<ui:param name="deductions" value="#{sortedSalaryDeductions.items['ADVANCE_PAYMENT']}" />
			</ui:include>

			<aon:div style="margin-left: 10px; border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="4. #{bundle.payroll_salary_deduction_42}" styleClass="aon-bold"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
			</aon:div>
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/listContent.xhtml" >
				<ui:param name="hide" value="#{true}" />
				<ui:param name="deductions" value="#{sortedSalaryDeductions.items['IN_KIND']}" />
			</ui:include>

			<aon:div style="margin-left: 10px; border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="5. #{bundle.payroll_salary_deduction_52}" styleClass="aon-bold"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
			</aon:div>
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
			</aon:div>
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/listContent.xhtml" >
				<ui:param name="hide" value="#{true}" />
				<ui:param name="deductions" value="#{sortedSalaryDeductions.items['OTHER']}" />
			</ui:include>

			<aon:outputText value="&#160;"/>
			<aon:div style="width: 100%;text-align: right; ">
				<aon:outputText value="B. #{bundle.payroll_salary_totalDeduction2}" styleClass="aon-bold"/>
			</aon:div>
			<aon:div style="">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{totalDeduction}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
		</aon:panelGrid>		
	</aon:div>
</ui:composition>
