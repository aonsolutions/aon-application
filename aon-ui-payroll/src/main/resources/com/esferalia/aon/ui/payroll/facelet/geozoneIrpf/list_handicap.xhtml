<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:dataTable id="GeozoneIrpfHandicapTable" var="to" value="#{geozoneIrpf.handicapModel}" rows="50">

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText 
					value="#{bundle.aon_date_from}" />
			</f:facet>
			<aon:outputText value="#{to.fromAmount}"  >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText
					value="#{bundle.aon_date_to}" />
			</f:facet>
			<aon:outputText value="#{to.toAmount==null?'>':to.toAmount}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="A" />
			</f:facet>
			<aon:outputText value="#{to.handicap[0].percent}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="B" />
			</f:facet>
			<aon:outputText value="#{to.handicap[1].percent}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="C" />
			</f:facet>
			<aon:outputText value="#{to.handicap[2].percent}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

	</aon:dataTable>

</ui:composition>
