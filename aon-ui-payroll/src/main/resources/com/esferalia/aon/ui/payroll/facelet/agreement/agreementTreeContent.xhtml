<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:methodParam name="saveAction" value="agreement_tree" />
	<aon:methodParam name="removeAction" value="agreement_list" />
	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_agreement_module}" />
		<ui:param name="controller" value="#{agreement}" />
		<ui:param name="skipSearchButton" value="true" />
		<ui:param name="skipResetButton" value="true" />
		<ui:param name="skipBackButton" value="true" />
		<ui:param name="skipSpin" value="true" />
	</ui:decorate>
	<aon:div styleClass="aon-scroll-area">
		<aon:panelGrid columns="2" dir="true" width="100%" style="aon-margin-bottom">

			<aon:outputLabel value="#{bundle.aon_id}" />
			<aon:outputText value="#{agreement.to.id}" />

			<aon:outputLabel for="Agreement_description"
				value="#{bundle.aon_description}" />
			<aon:inputText id="Agreement_description"
				value="#{agreement.to.description}" size="64" maxlength="64" />
		</aon:panelGrid>
		
		<c:if test="#{!agreement.new}">
			<aon:panelTabSet>
				<aon:panelTab id="group" label="#{payrollBundle.payroll_agreementLevel_module}">

					<aon:editDataTable id="agreementLevelGrid" var="to" value="#{agreementLevel.model}" rows="0">
						<aon:rowSelector id="agreementLevelGrid-select" toggleOnClick="#{agreementLevel.to == null}"
							actionListener="#{agreementLevel.onSelect}" 
							reRender="agreementForm,agreementTree"/>
				
							<aon:column id="agreementLevelGrid-selectColumn" 
								styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<f:facet name="footer">
									<aon:div>
										<aon:commandButton
											id="agreementLevelGrid-reset" title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
											actionListener="#{agreementLevel.onReset}"
											rendered="#{!agreementLevel.new and agreementLevel.to == null}" 
											reRender="#{agreementLevelGrid}"
											styleClass="aon-editDataTable-button aon-icon-reset"
											accesskey="#{bundle.aon_key_new_line}"/>
				
									</aon:div>
								</f:facet>
							</aon:column>
							
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}"/>
								<f:facet name="footer">
									<aon:inputText id="AgreementLevel_description-New"
										value="#{agreementLevel.to.description}"
										rendered="#{agreementLevel.new}" required="true" maxlength="64" size="64" />
								</f:facet>
							</aon:column>
			
							<aon:column styleClass="aon-editDataTable-buttonsColumn aon-vertical-align-top">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:outputText value="&#160;" />
								<f:facet name="footer">
									<aon:div>
										<aon:outputText rendered="#{!agreementLevel.new}" value="&#160;" />
										<aon:commandButton
											id="agreementLevelGrid-new-save" 
											title="#{bundle.aon_save} (#{bundle.aon_key_save_line_accelerator})"
											actionListener="#{agreementLevel.accept}"
											rendered="#{agreementLevel.new}"
											reRender="agreementForm,agreementTree"
											styleClass="aon-editDataTable-button aon-icon-accept"
											accesskey="#{bundle.aon_key_save_line}" />
										<aon:confirmButton
											id="agreementLevelGrid-new-cancel" title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
											rendered="#{agreementLevel.new}" reRender="agreementLevelGrid"
											immediate="true"
											confirmTitle="#{bundle.aon_confirm_title}"
											confirmMessage="#{bundle.aon_cancel_confirm}"
											confirmActionListener="#{agreementLevel.onCancel}"
											styleClass="aon-editDataTable-button aon-icon-cancel"
											accesskey="#{bundle.aon_key_cancel_line}" />
									</aon:div>
								</f:facet>
							</aon:column>
						</aon:editDataTable>
				</aon:panelTab>
			</aon:panelTabSet>								
		</c:if>
	</aon:div>
</ui:composition>
