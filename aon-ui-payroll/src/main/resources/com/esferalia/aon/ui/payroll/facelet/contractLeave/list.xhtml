<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.payroll_contractLeave_module}" />
				<ui:param name="controller" value="#{contractLeave}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{contractLeave}" />
					
					<ui:define name="columns">
						
						<aon:column alias="ContractLeave.id"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>

						<aon:column alias="ContractLeave.contract.person.firstSurname,ContractLeave.contract.person.registry.name"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.payroll_salary_employee}" />
							</f:facet>
							<aon:outputText value="#{to.contract.person.registry.fullName}">
								<aon:abbreviateConverter maxWidth="40" />
							</aon:outputText>
						</aon:column>
						
						<aon:column alias="ContractLeave.startDate" 
							styleClass="aon-editDataTable-dateColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.payroll_leaveBatch_leave_date}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>		
						</aon:column>
					
						<aon:column alias="ContractLeave.dischargeCause"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.payroll_contractLeave_leaveCause}" />
							</f:facet>
							<aon:outputText value="#{to.type}" />
						</aon:column>
						
						<aon:column alias="ContractLeave.description"
							styleClass="aon-editDataTable-textColumn aon-width-250">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_remark}" />
							</f:facet>
							<aon:outputText value="#{to.description}">
								<aon:abbreviateConverter maxWidth="30" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="ContractLeave.endDate" 
							styleClass="aon-editDataTable-dateColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.payroll_leaveBatch_discharge_date}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>		
						</aon:column>
						
						<aon:column alias="ContractLeave.dischargeCause"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.payroll_contractLeave_dischargeCause}" />
							</f:facet>
							<aon:outputText value="#{to.dischargeCause}" />
						</aon:column>
						
					</ui:define>
					
				</ui:decorate>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
