<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<aon:methodParam name="searchAction" value="contractLeave_search" />
			<aon:methodParam name="rowSelectorAction" value="contractLeave_form" />
			<aon:methodParam name="rowSelectorActionListener" default="#{contractLeave.onSelectContract}" type="actionListener" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.payroll_contractLeave_module}" />
				<ui:param name="controller" value="#{contract}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:methodParam name="rowSelectorAction" value="contractLeave_form" />
				<aon:methodParam name="rowSelectorActionListener" value="#{contractLeave.onSelectContract}" type="actionListener" />
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{contract}" />
					
					<ui:define name="columns">
						
						<aon:column alias="Contract.person.firstSurname,Contract.person.registry.name"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.payroll_salary_employee}" />
							</f:facet>
							<aon:outputText value="#{to.person.registry.fullName}">
								<aon:abbreviateConverter maxWidth="40" />
							</aon:outputText>
						</aon:column>
						
						<aon:column alias="Contract.startDate" styleClass="aon-editDataTable-dateColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_start_date}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>		
						</aon:column>
					
						<aon:column alias="Contract.endDate" styleClass="aon-editDataTable-dateColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_end_date}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>		
						</aon:column>
						
						<aon:column alias="Contract.workPlace.enterprise.registry.name"
							styleClass="aon-editDataTable-textColumn aon-width-250">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company}" />
							</f:facet>
							<aon:outputText value="#{to.workPlace.enterprise.registry.fullName}">
								<aon:abbreviateConverter maxWidth="30" />
							</aon:outputText>
						</aon:column>
						
						<aon:column alias="Contract.workPlace.description"
							styleClass="aon-editDataTable-textColumn aon-width-250">
							<f:facet name="header">
								<aon:outputText value="#{bundle.payroll_workplace}" />
							</f:facet>
							<aon:outputText value="#{to.workPlace.description}">
								<aon:abbreviateConverter maxWidth="30" />
							</aon:outputText>
						</aon:column>
						
					</ui:define>
					
				</ui:decorate>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
