<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="contractLeaveForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.payroll_contractLeave_module}" />
				<ui:param name="controller" value="#{contractLeave}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" style="width:100%;"
					columnClasses="aon-panelGrid-odd aon-width-140, aon-panelGrid-even aon-width-500,
							aon-panelGrid-odd aon-width-140, aon-panelGrid-even aon-width-auto">
				
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{contractLeave.to.contract}" />
						<ui:param name="lookupReRender" value="ContractLeave_relapse_div,ContractLeave_bases_div" />
						<ui:param name="lookupControllerListener" value="#{contractLeave.contractFilter}" />
						<aon:methodParam name="lookupChangeListener" 
							value="#{contractLeave.onContractChange}" type="lookupChangeListener" />
					</ui:include>
					
					<aon:outputLabel for="ContractLeave_relapse"
						value="#{bundle.aon_id}" />
					<aon:div id="ContractLeave_relapse_div">
						<aon:inputText id="ContractLeave_id"
							size="4" disabled="#{true}"
							value="#{contractLeave.to.id}" />		
						<aon:outputLabel for="ContractLeave_relapse"
							styleClass="aon-italic aon-padding"
							value="#{bundle.payroll_contractLeave_relapse}" />
						<aon:selectOneMenu id="ContractLeave_relapse"
							value="#{contractLeave.to.parent.id}">
							<f:selectItem itemLabel="No" value="#{null}" itemValue ="#{null}" />
							<f:selectItems value="#{contractLeave.relapseITList}" />
							<a4j:support event="onchange" reRender="report_panel" ajaxSingle="true" />
						</aon:selectOneMenu>
					</aon:div>
					
					<aon:outputText 
						value="#{bundle.payroll_contractLeave_bases}" />
					<aon:div id="ContractLeave_bases_div">
						<aon:outputLabel for="ContractLeave_dailyCgcBase" 
							value="#{bundle.payroll_contractLeave_dailyCgc}:" 
							styleClass="aon-italic" />
						<aon:inputText id="ContractLeave_dailyCgcBase" 
							value="#{contractLeave.to.dailyCgcBase}" 
							size="7" >
							<f:validateDoubleRange />
						</aon:inputText>
						
						<aon:outputLabel for="ContractLeave_dailyCgpBase" 
							value="#{bundle.payroll_contractLeave_dailyCgp}:"  
							styleClass="aon-italic aon-margin-left" />
						<aon:inputText id="ContractLeave_dailyCgpBase" 
							value="#{contractLeave.to.dailyCgpBase}" 
							size="7" >
							<f:validateDoubleRange />
						</aon:inputText>
						
						<aon:outputLabel for="ContractLeave_dailyRegBase" 
							value="#{bundle.payroll_contractLeave_dailyReg}:"  
							styleClass="aon-italic aon-margin-left" />
						<aon:inputText id="ContractLeave_dailyRegBase" 
							value="#{contractLeave.to.dailyRegBase}" 
							size="7" >
							<f:validateDoubleRange />
						</aon:inputText>
						
						<aon:div rendered="#{!contractLeave.new}" style="display:inline;">
							<aon:outputText value="#{bundle.payroll_leaveBatch_leave_days}: "  
								styleClass="aon-italic aon-bold aon-margin-left" />
							<aon:outputText value="#{contractLeave.itDays}" 
								styleClass="aon-bold" />
							<aon:outputText value=" (a "
								rendered="#{empty contractLeave.to.endDate}" />
							<aon:outputText value="#{contractLeave.todayDate}"
								rendered="#{empty contractLeave.to.endDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>	
							<aon:outputText value=")"
								rendered="#{empty contractLeave.to.endDate}" />
						</aon:div>
						
					</aon:div>
					
					<aon:outputLabel for="ContractLeave_description"
						value="#{bundle.aon_remark}" />
					<aon:inputText id="ContractLeave_description"
						size="60" maxlength="64"
						value="#{contractLeave.to.description}" />	
					
				</aon:panelGrid>
				
				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{bundle.payroll_contractLeave_report_leave}" />
					</f:facet>
					<aon:panelGrid columns="4" style="width:100%;"
						columnClasses="aon-panelGrid-odd aon-width-130, aon-panelGrid-even aon-width-500,
							aon-panelGrid-odd aon-width-140, aon-panelGrid-even aon-width-auto">
				
						<aon:outputLabel for="ContractLeave_startDate"
							value="#{bundle.payroll_leaveBatch_leave_date}" />
						<aon:selectInputDate id="ContractLeave_startDate" required="true" 
							value="#{contractLeave.to.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
						
						<aon:outputLabel for="ContractLeaveDetail_collegeNumber-leave"
							value="#{bundle.payroll_contractLeave_collegeNumber}" />
						<aon:div id="ContractLeaveDetail_collegeNumber-leave-div">
							<aon:inputText id="ContractLeaveDetail_collegeNumber-leave"
								value="#{contractLeave.leave.collegeNumber}" maxlength="8">
								<a4j:support event="onchange" reRender="ContractLeaveDetail_collegeNumber-leave-div" />
							</aon:inputText>
							<aon:outputText value="&#160;" 
								rendered="#{contractLeave.validLeaveCollegeNumber and contractLeave.validLeaveCollegeNumber!=null}"
								styleClass="aon-icon-predetermine" style="padding-left: 15px;" />
							<aon:outputText value="&#160;" 
								rendered="#{!contractLeave.validLeaveCollegeNumber and contractLeave.validLeaveCollegeNumber!=null}"
								styleClass="aon-icon-exception" style="padding-left: 15px;" />
						</aon:div>
						
						<aon:outputLabel for="ContractLeave_type"
							value="#{bundle.payroll_contractLeave_leaveCause}" />
						<aon:selectOneMenu id="ContractLeave_type" 
							value="#{contractLeave.to.type}">
							<f:selectItem itemLabel=" - " itemValue="#{null}" />
							<f:selectItems value="#{payrollCollections.leaveTypes}" />
						</aon:selectOneMenu>
					
						<aon:outputLabel for="ContractLeaveDetail_cias-leave"
							value="#{bundle.payroll_contractLeave_cias}" />
						<aon:div id="ContractLeaveDetail_cias-leave-div">
							<aon:inputText id="ContractLeaveDetail_cias-leave"
								value="#{contractLeave.leave.cias}" maxlength="11">
								<a4j:support event="onchange" reRender="ContractLeaveDetail_cias-leave-div" />
							</aon:inputText>
							<aon:outputText value="&#160;" 
								rendered="#{contractLeave.validLeaveCias and contractLeave.validLeaveCias!=null}"
								styleClass="aon-icon-predetermine" style="padding-left: 15px;" />
							<aon:outputText value="&#160;" 
								rendered="#{!contractLeave.validLeaveCias and contractLeave.validLeaveCias!=null}"
								styleClass="aon-icon-exception" style="padding-left: 15px;" />
						</aon:div>
						
					</aon:panelGrid>
					
				</aon:panel>
				
				<aon:panel rendered="#{!contractLeave.new}">
					<f:facet name="header">
						<aon:outputText value="#{bundle.payroll_contractLeave_report_discharge}" />
					</f:facet>
					<aon:panelGrid columns="4" style="width:100%;" id="dischargePanel"
						columnClasses="aon-panelGrid-odd aon-width-130, aon-panelGrid-even aon-width-500,
							aon-panelGrid-odd aon-width-140, aon-panelGrid-even aon-width-auto">
						
						<aon:outputLabel for="ContractLeave_endDate"
							value="#{bundle.payroll_leaveBatch_discharge_date}" />
						<aon:selectInputDate id="ContractLeave_endDate"  
							value="#{contractLeave.to.endDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" >
							<a4j:support event="onchanged" reRender="dischargePanel" />
						</aon:selectInputDate>
						
						<aon:outputLabel for="ContractLeaveDetail_collegeNumber-discharge"
							value="#{bundle.payroll_contractLeave_collegeNumber}" />
						<aon:div id="ContractLeaveDetail_collegeNumber-discharge-div">
							<aon:inputText id="ContractLeaveDetail_collegeNumber-discharge"
								disabled="#{empty contractLeave.to.endDate}"
								value="#{contractLeave.discharge.collegeNumber}" maxlength="8">
								<a4j:support event="onchange" reRender="dischargePanel" />
							</aon:inputText>
							<aon:outputText value="&#160;" 
								rendered="#{contractLeave.validDischargeCollegeNumber and contractLeave.validDischargeCollegeNumber!=null}"
								styleClass="aon-icon-predetermine" style="padding-left: 15px;" />
							<aon:outputText value="&#160;" 
								rendered="#{!contractLeave.validDischargeCollegeNumber and contractLeave.validDischargeCollegeNumber!=null}"
								styleClass="aon-icon-exception" style="padding-left: 15px;" />
						</aon:div>
					
						<aon:outputLabel for="ContractLeave_dischargeCause"
							value="#{bundle.payroll_contractLeave_dischargeCause}" />
						<aon:selectOneMenu id="ContractLeave_dischargeCause"
							value="#{contractLeave.to.dischargeCause}">
							<f:selectItem itemLabel=" - " itemValue="#{null}" />
							<f:selectItems value="#{payrollCollections.dischargeCauses}" />
						</aon:selectOneMenu>
					
						<aon:outputLabel for="ContractLeaveDetail_cias-discharge"
							value="#{bundle.payroll_contractLeave_cias}" />
						<aon:div id="ContractLeaveDetail_cias-discharge-div">
							<aon:inputText id="ContractLeaveDetail_cias-discharge"
								disabled="#{empty contractLeave.to.endDate}"
								value="#{contractLeave.discharge.cias}" maxlength="11">
								<a4j:support event="onchange" reRender="ContractLeaveDetail_cias-discharge-div" />
							</aon:inputText>
							<aon:outputText value="&#160;" 
								rendered="#{contractLeave.validDischargeCias and contractLeave.validDischargeCias!=null}"
								styleClass="aon-icon-predetermine" style="padding-left: 15px;" />
							<aon:outputText value="&#160;" 
								rendered="#{!contractLeave.validDischargeCias and contractLeave.validDischargeCias!=null}"
								styleClass="aon-icon-exception" style="padding-left: 15px;" />
						</aon:div>
							
					</aon:panelGrid>
				</aon:panel>
				
				<aon:panel id="confirmReport-panel" 
					rendered="#{!contractLeave.new}">
					<f:facet name="header">
						<aon:outputText value="#{bundle.payroll_contractLeave_report_confirm}" />
					</f:facet>
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contractLeave/confirm_grid.xhtml" />
				</aon:panel>
					
			</aon:div>
				
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{contractLookup}" />
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		
	</ui:define>
</ui:composition>
