<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="contractLeaveForm">
			<aon:methodParam name="removeAction" default="contractLeave_form" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_contractLeave_module}" />
				<ui:param name="controller" value="#{contractLeave}" />
				<ui:param name="skipSpin" value="true" />
<!--  
				<ui:param name="saveButtonReRender" value="form_leaves" />
-->
			</ui:decorate>
					
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width:100%;" 
					columnClasses="
					aon-panelGrid-even aon-noborder aon-vertical-align-top aon-width-auto, 
					aon-panelGrid-even aon-noborder aon-vertical-align-top aon-width-500">
				
					<aon:panelGrid columns="2" id="form_header" style="width:100%;">
						<ui:include 
							src="/com/esferalia/aon/ui/payroll/facelet/contractLeave/form_header.xhtml" />
					</aon:panelGrid>

					<aon:panelGrid columns="2" id="report_panel" style="width:100%;">
						<ui:include 
							src="/com/esferalia/aon/ui/payroll/facelet/contractLeave/form_report.xhtml" />
					</aon:panelGrid>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area" id="form_leaves">
				<ui:include 
					src="/com/esferalia/aon/ui/payroll/facelet/contractLeave/form_leaves.xhtml" />
			</aon:div>				
				
		</aon:form>
	</ui:define>
</ui:composition>
