<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="contractLeaveForm">
			<aon:methodParam name="removeAction" default="contractLeave_form" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_contractLeave_module}" />
				<ui:param name="controller" value="#{contractLeave}" />
				<ui:param name="skipSpin" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="skipCancelButton" value="#{contractLeave.backAction==null}" />
			</ui:decorate>
					
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width:100%;" 
					columnClasses="
					aon-panelGrid-even aon-noborder aon-vertical-align-top aon-width-auto, 
					aon-panelGrid-even aon-noborder aon-vertical-align-top aon-width-500">
				
					<aon:panelGrid columns="2" id="form_header" style="width:100%;">
						<ui:include 
							src="/com/esferalia/aon/ui/payroll/facelet/contractLeave/form_header.xhtml" >
							<ui:param name="controller" value="#{contractLeave}" />
						</ui:include>
					</aon:panelGrid>

					<aon:panelGrid columns="2" id="report_panel" style="width:100%;">
						<c:if test="#{contractLeave.contract.id!=null}">
							<ui:include 
								src="/com/esferalia/aon/ui/payroll/facelet/contractLeave/form_report.xhtml" />
						</c:if>
					</aon:panelGrid>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area" id="form_leaves">
				<c:if test="#{contractLeave.leaveModel!=null}">
					<ui:include 
						src="/com/esferalia/aon/ui/payroll/facelet/contractLeave/form_leaves.xhtml" />
				</c:if>
			</aon:div>				
				
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{contractLookup}" />
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		
	</ui:define>
</ui:composition>
