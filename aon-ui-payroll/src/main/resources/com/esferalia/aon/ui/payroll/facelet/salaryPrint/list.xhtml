<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="salaryPrintList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.payroll_salaryPrint_module}" />
				<ui:param name="controller" value="#{salaryPrint}" />
				<ui:param name="skipResetButton" value="#{true}" />
				
				
				<ui:define name="additionalToolbarContent">
					<aon:div style="display:inline-block; width: 30px;"
						rendered="#{!salaryPrint.selectionEmpty}" >
						<rich:dropDownMenu id="emailDropDown" event="onmouseover"
							style="width: 25px;"
							submitMode="none" direction="bottom-right"
							jointPoint="bl" hideDelay="150">
							<f:facet name="label"> 
								<aon:outputText value="&#160;" 
									styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border" />
			                </f:facet>
			                <rich:menuItem submitMode="none">
		                        <aon:selectBooleanCheckbox id="includeEnterpriseCost"
									value="#{salaryPrint.includeEnterpriseCost}" />
								<aon:outputLabel for="includeEnterpriseCost"
									value="#{bundle.payroll_salaryPrint_include_enterprise_cost}" />
		                    </rich:menuItem>
			                <rich:menuItem submitMode="none"
			                	rendered="#{salaryPrint.containsPartialTime}">
		                        <aon:selectBooleanCheckbox id="includeTPhours"
									value="#{salaryPrint.includeTPhours}" />
								<aon:outputLabel for="includeTPhours"
									value="#{bundle.payroll_salaryPrint_include_tp_hours}" />
		                    </rich:menuItem>
			                <rich:menuItem submitMode="none">
								<aon:commandButton id="email"
									value="#{bundle.webmail_send_email}" 
									actionListener="#{salaryPrint.onSendByEmail}"
									styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border"
									reRender="emailDropDown, showNewMessageWindow" />
			                </rich:menuItem>
						</rich:dropDownMenu>
					</aon:div>
					<aon:htmlCommandLink id="quote-excel-report"
						rendered="#{!salaryPrint.selectionEmpty}"
						value="&#160;"
						target="_blank" action="#{salaryPrint.onQuoteExcelReport}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="salary-report"
						rendered="#{!salaryPrint.selectionEmpty and salaryPrint.containsSalary}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_salaries}"
						action="#{salaryPrint.onPrint}" >
						<f:param name="reportType" value="SALARY" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="extra-report"
						rendered="#{!salaryPrint.selectionEmpty and salaryPrint.containsExtra}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="Extras"
						action="#{salaryPrint.onPrint}" >
						<f:param name="reportType" value="EXTRA" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="settle-report"
						rendered="#{!salaryPrint.selectionEmpty and salaryPrint.containsSettle}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="Finiquitos"
						action="#{salaryPrint.onPrint}" >
						<f:param name="reportType" value="SETTLE" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="delay-report"
						rendered="#{!salaryPrint.selectionEmpty and salaryPrint.containsDelay}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="Atrasos"
						action="#{salaryPrint.onPrint}" >
						<f:param name="reportType" value="DELAY" />
					</aon:htmlCommandLink>
						
					<aon:dropDownMenu value="#{bundle.aon_more2}"
						rendered="#{!salaryPrint.selectionEmpty}"
						style="display:inline-block;font-size:0.8em;margin-right:4px;" >
						<f:facet name="label">
							<aon:panelGroup>
			            		<aon:outputText value="#{bundle.aon_other}s" /> 
			                    <aon:graphicImage style="vertical-align:middle;"
			                    	value="#{aonResource.resolve['/images/aon-icon/aon-icon-dropDown.gif']}" />
							</aon:panelGroup>
			            </f:facet>			
						<aon:menuItem  rendered="#{!salaryPrint.selectionEmpty}"
							iconClass="aon-icon-pdf">
							<aon:htmlCommandLink id="salaryExpense_report" target="_blank"
								rendered="#{!salaryPrint.selectionEmpty}"
								value="Costes de empresa"
								actionListener="#{enterprise.onSelectFirst}"
								action="#{report.onExecute}">
								<f:setPropertyActionListener
									target="#{salaryExpense.enterprise}" value="#{salaryPrint.enterprise}" />
								<f:setPropertyActionListener
									target="#{salaryExpense.startDate}" value="#{salaryPrint.fromDate}" />
								<f:setPropertyActionListener
									target="#{salaryExpense.endDate}" value="#{salaryPrint.toDate}" />
								<f:param name="reportKey" value="#{salaryExpense.reportKey}" />
								<f:param name="outputFormat" value="PDF" />
							</aon:htmlCommandLink>	
			 			</aon:menuItem>
						<aon:menuItem rendered="#{!salaryPrint.selectionEmpty and salaryPrint.containsPartialTime}"
							iconClass="aon-icon-pdf">
							<aon:htmlCommandLink id="contractMonthlyHours_report" target="_blank"
								rendered="#{!salaryPrint.selectionEmpty and salaryPrint.containsPartialTime}"
								value="HORAS T.P."
								action="#{salaryPrint.onExecuteTPContractHoursReport}">
								<f:param name="reportKey" value="contractMonthlyHours" />
								<f:param name="outputFormat" value="PDF" />
							</aon:htmlCommandLink>	
			 			</aon:menuItem>
					</aon:dropDownMenu>	
						
				</ui:define>				
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				
				<aon:div id="salaryPrintDataDiv">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{salaryPrint}" />
						<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
						<ui:param name="skipSelectButton" value="#{true}" />
						<ui:define name="columns">

							<aon:column styleClass="aon-editDataTable-iconColumn">
								<f:facet name="header">
									<aon:panelGroup>
										<aon:commandButton styleClass="aon-icon-commandButton aon-icon-checkAll"
											title="#{bundle.aon_check_all}"
											value="&#160;"
											reRender="salaryPrintList"
											actionListener="#{salaryPrint.checkAll}"
											ajaxSingle="true" 
											onclick="Richfaces.showModalPanel('waitProccess')" 
								     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
										<aon:commandButton styleClass="aon-icon-commandButton aon-icon-checkNone"
											title="#{bundle.aon_uncheck_all}"
											value="&#160;"
											reRender="salaryPrintList"
											actionListener="#{salaryPrint.checkNone}"
											ajaxSingle="true" 
											onclick="Richfaces.showModalPanel('waitProccess')" 
								     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
									</aon:panelGroup>
								</f:facet>
								<aon:selectBooleanCheckbox
										value="#{salaryPrint.rowChecked}" >
									<a4j:support event="onclick" reRender="salaryPrintList" ajaxSingle="true" />
								</aon:selectBooleanCheckbox>
							</aon:column>
							
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryPrint/listContent.xhtml" />

						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>

		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" >
			<ui:param name="addWaitProcessPoll" value="salaryPrint_list-WaitProcess" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" >
			<ui:param name="skipAttachButton" value="#{true}" />
		</ui:include>	

	</ui:define>
</ui:composition>
