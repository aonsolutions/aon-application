<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form  id="paymentConceptForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_paymentConcept_module}" />
				<ui:param name="controller" value="#{paymentConcept}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2" >
					
					<aon:outputLabel for="PaymentConcept_code"
						value="#{bundle.aon_id}" />
					<aon:inputText id="PaymentConcept_code" size="5" maxlength="5"
						value="#{paymentConcept.to.code}" />

					<aon:outputLabel for="PaymentConcept_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="PaymentConcept_type" 
						value="#{paymentConcept.to.type}" converter="aon.EnumConverter" >
						<f:selectItems value="#{payrollCollections.paymentTypes}" />
					</aon:selectOneMenu>	

					<aon:outputLabel for="PaymentConcept_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="PaymentConcept_description" size="64" maxlength="64"
						value="#{paymentConcept.to.description}" />
						
					<aon:outputText value="&#160;"/>
					<aon:panelGroup>
						<aon:selectBooleanCheckbox id="PaymentConcept_decorateDescription" value="#{paymentConcept.to.descriptionDecorable}" />
						<aon:outputLabel for="PaymentConcept_decorateDescription" value="#{payrollBundle.payroll_salary_show_expression}" />
					</aon:panelGroup>

					<aon:outputLabel for="PaymentConcept_expression"
						value="#{payrollBundle.payroll_salary_expression}" />
					<aon:inputTextarea id="PaymentConcept_expression" cols="60" rows="5" maxlength="128"
						value="#{paymentConcept.to.expression}">
						<f:validateLength maximum="128"/>
						<a4j:region>
							<rich:suggestionbox id="PaymentConcept_expression_suggestion"
								for="PaymentConcept_expression"
								onselect="suggestionBoxActive=false;"
								suggestionAction="#{paymentConcept.expressionContext}" var="exp"
								similarityGroupingId=""
								tokens=" +-/*%(){}[]"
								fetchValue="#{exp}"
								immediate="true" limitToList="true" ajaxSingle="true"
								eventsQueue="PaymentConcept_expressionSug" ignoreDupResponses="true"
								requestDelay="100" width="500" height="100"
								nothingLabel="#{bundle.aon_search_no_results}">
								<aon:column>
									<aon:outputText value="#{exp}" styleClass="aon-bold"/>
								</aon:column>
							</rich:suggestionbox>
						</a4j:region>
					</aon:inputTextarea>

					<aon:outputLabel for="PaymentConcept_irpf_expression"
						value="#{payrollBundle.payroll_salary_irpf_expression}" />
					<aon:div id="PaymentConcept_taxation">
						<aon:selectOneMenu id="PaymentConcept_irpf_taxation"  
							value="#{paymentConcept.taxation}">
							<f:selectItems value="#{payrollCollections.taxationTypes}" />
							<a4j:support event="onchange" reRender="PaymentConcept_taxation" ajaxSingle="true" />
						</aon:selectOneMenu>
						<br />
						<aon:inputTextarea id="PaymentConcept_irpf_expression" cols="60" rows="5" maxlength="128"
							rendered="#{paymentConcept.taxation=='MANUAL'}"
							value="#{paymentConcept.to.irpfExpression}">
							<f:validateLength maximum="128"/>
							<a4j:region>
								<rich:suggestionbox id="PaymentConcept_irpf_expression_suggestion"
									for="PaymentConcept_irpf_expression"
									onselect="suggestionBoxActive=false;"
									suggestionAction="#{paymentConcept.expressionContext}" var="exp"
									similarityGroupingId=""
									tokens=" +-/*%(){}[]"
									fetchValue="#{exp}"
									immediate="true" limitToList="true" ajaxSingle="true"
									eventsQueue="PaymentConcept_irpf_expressionSug" ignoreDupResponses="true"
									requestDelay="100" width="500" height="100"
									nothingLabel="#{bundle.aon_search_no_results}">
									<aon:column>
										<aon:outputText value="#{exp}" styleClass="aon-bold"/>
									</aon:column>
								</rich:suggestionbox>
							</a4j:region>
						</aon:inputTextarea>
					</aon:div>

					<aon:outputLabel for="PaymentConcept_quote_expression"
						value="#{payrollBundle.payroll_salary_quote_expression}" />
					<aon:div id="PaymentConcept_quote">
						<aon:selectOneMenu id="PaymentConcept_quote_quote"  
							value="#{paymentConcept.quote}">
							<f:selectItems value="#{payrollCollections.quoteTypes}" />
							<a4j:support event="onchange" reRender="PaymentConcept_quote" ajaxSingle="true" />
						</aon:selectOneMenu>
						<br />
						<aon:inputTextarea id="PaymentConcept_quote_expression" cols="60" rows="5" maxlength="128"
							rendered="#{paymentConcept.quote=='MANUAL'}"
							value="#{paymentConcept.to.quoteExpression}">
							<f:validateLength maximum="128"/>
							<a4j:region>
								<rich:suggestionbox id="PaymentConcept_quote_expression_suggestion"
									for="PaymentConcept_quote_expression"
									onselect="suggestionBoxActive=false;"
									suggestionAction="#{paymentConcept.expressionContext}" var="exp"
									similarityGroupingId=""
									tokens=" +-/*%(){}[]"
									fetchValue="#{exp}"
									immediate="true" limitToList="true" ajaxSingle="true"
									eventsQueue="PaymentConcept_quote_expressionSug" ignoreDupResponses="true"
									requestDelay="100" width="500" height="100"
									nothingLabel="#{bundle.aon_search_no_results}">
									<aon:column>
										<aon:outputText value="#{exp}" styleClass="aon-bold"/>
									</aon:column>
								</rich:suggestionbox>
							</a4j:region>
						</aon:inputTextarea>
					</aon:div>

				</aon:panelGrid>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
