<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="leaveBatchForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_leaveBatchWizard_module}" />
				<ui:param name="controller" value="#{leaveBatch}" />
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid id="dataTable" columns="2" style="width: 50%;"
					columnClasses="
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="LeaveBatch_id"
						value="#{bundle.aon_id}" />
					<aon:outputText id="LeaveBatch_id" 
						value="#{leaveBatch.to.id}"
						disabled="true" size="10" />

					<aon:outputLabel for="LeaveBatch_date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="LeaveBatch_date" 
						value="#{leaveBatch.to.date}" required="true"
						size="10"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					
				</aon:panelGrid>

				<aon:div id="leaveBatchPanelTabSet" >
					<aon:panelTabSet rendered="#{!leaveBatch.new}">
	
<!--  
						<c:if test="#{!fbatch.readOnly}" >
						</c:if>
-->
						<c:if test="#{leaveBatchDetail.model.rowCount > 0}" >
							<aon:panelTab id="leaveBatchDetailTab" label="#{payrollBundle.payroll_included_parteit}">
								<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/fdi/formDetail.xhtml" />
							</aon:panelTab>
						</c:if>
	
						<aon:panelTab id="leaveTab" label="#{payrollBundle.payroll_not_batched_parteit}">
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/fdi/formLeave.xhtml" />
						</aon:panelTab>
	
						<c:if test="#{leaveBatchAttach.model.rowCount > 0}" >
							<aon:panelTab id="documentTab" label="#{payrollBundle.payroll_tracing}">
								<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/fdi/formDocument.xhtml" />
							</aon:panelTab>
						</c:if>
	
					</aon:panelTabSet>
				</aon:div>
				
			</aon:div>
		</aon:form>
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/fdi/modalSearch.xhtml">
			<ui:param name="controller" value="#{leaveList}" />
			<ui:param name="searchReRender" value="leaveToolBarDiv,leaveDataDiv" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
