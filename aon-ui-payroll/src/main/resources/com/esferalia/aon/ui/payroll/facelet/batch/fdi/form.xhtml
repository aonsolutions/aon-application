<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:if test="#{leaveBatch.nevv}" >
		<ui:decorate template="/com/esferalia/aon/ui/payroll/facelet/batch/fdi/form_new.xhtml" />
	</aon:if>
	
	<aon:if test="#{!leaveBatch.nevv}" >
		<ui:decorate template="/com/esferalia/aon/ui/payroll/facelet/batch/form.xhtml">
			<ui:param name="toolbarTitle" value="#{bundle.payroll_leaveBatchWizard_module}" />
			<ui:param name="controller" value="#{leaveBatch}" />
			<ui:param name="controllerDetail" value="#{leaveBatchDetail}" />
			<ui:param name="controllerAttach" value="#{leaveBatchAttach}" />
			
			<ui:define name="batchContent" >
				<aon:panelGrid id="info-panel" columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-auto">
	
	
					<aon:outputLabel for="LeaveBatch_date" value="#{bundle.aon_date}" />
					<aon:div>
						<aon:selectInputDate id="LeaveBatch_date" rendered="#{!leaveBatch.recorded}"
							value="#{leaveBatch.to.date}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputText value="#{leaveBatch.to.date}" rendered="#{leaveBatch.recorded}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:div>	
					
					<aon:if test="#{domainSwitcher.domainManagementAvailable or controller.editableSelectedTo}" >
						<aon:outputText value="#{bundle.finance_disk} FDI" />
						<aon:div>
							<aon:commandButton id="fdi-create-button" value="#{bundle.payroll_create_disk}"
								rendered="#{leaveBatch.nevv or (!leaveBatch.recorded and leaveBatchDetail.model.rowCount > 0)}"
								reRender="batchForm"
								styleClass="aon-icon-commandButton aon-icon-accept"
								actionListener="#{leaveBatch.onCreateDisk}"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />						
	
							<aon:outputText value="Generado el "
								rendered="#{leaveBatch.recorded}"
								styleClass="aon-bold" />
							<aon:outputText value="#{leaveBatch.to.outcomeFileDate}"
								rendered="#{leaveBatch.recorded}"
								styleClass="aon-bold aon-margin-right" >
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							
							<aon:htmlCommandLink id="fdi-download" target="_blank"
								value="&#160;" title="#{bundle.aon_fileupload_download}"
								rendered="#{leaveBatch.recorded}"
								actionListener="#{leaveBatch.onDownloadFile}"
								styleClass="aon-icon-commandButton aon-icon-mail-save aon-margin-left" >
							</aon:htmlCommandLink>
							<aon:commandButton id="fdi-remove" 
								value="&#160;" title="#{bundle.aon_remove}" 
								rendered="#{leaveBatch.recorded}"
								actionListener="#{leaveBatch.onRemoveFile}"
								styleClass="aon-icon-commandButton aon-icon-delete aon-margin-left" />
							<aon:if test="#{aonRole.sysAdmin}">
								<aon:fileUpload id="attach_file" listWidth="100"
									fileUploadListener="#{leaveBatch.fanFileUploaded}" >
									<f:facet name="label">
										<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
									</f:facet>
									<a4j:support event="onuploadcomplete" reRender="dataTable" />
								</aon:fileUpload>
							</aon:if>
						</aon:div>
					</aon:if>
					
				</aon:panelGrid>
			</ui:define>
			
			<ui:define name="batchedTabContent" >
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/fdi/formDetail.xhtml" />
			</ui:define>
			
			<ui:define name="noBatchedTabContent" >
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/fdi/formNoBatched.xhtml" />
			</ui:define>
			
			<ui:define name="documentTabContent" >
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/batch/formDocument.xhtml" >
					<ui:param name="controllerAttach" value="#{leaveBatchAttach}" />
				</ui:include>
			</ui:define>
			
			<ui:define name="afterFormContent" >
				<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
				<aon:lookupButtonPopup lookup="#{personLookup}" />
				
			</ui:define>
			
		</ui:decorate>
	</aon:if>

</ui:composition>
