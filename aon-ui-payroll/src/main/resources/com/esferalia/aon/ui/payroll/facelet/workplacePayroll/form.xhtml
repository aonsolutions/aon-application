<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGrid columns="2" 
		columnClasses="
		aon-noborder aon-padding-left aon-width-auto aon-vertical-align-top,
		aon-noborder aon-padding-left aon-width-auto aon-vertical-align-top">
		<aon:panelGrid columns="2" style="width: 50%;">
			
			<aon:outputLabel for="WorkPlace_description" value="#{bundle.aon_description}" />
			<aon:inputText id="WorkPlace_description#{sufix}"  
				value="#{payrollWorkPlace.to.workPlace.description}" 
				required="true" size="40" maxlength="64" />
			
			<aon:outputLabel for="WorkPlace_address_id" value="#{bundle.aon_address}" />
			<aon:selectOneMenu id="WorkPlace_address_id#{sufix}" 
				value="#{payrollWorkPlace.to.workPlace.address}" 
				required="true">
				<f:selectItems value="#{companyCollections.companyAddresses}" />
			</aon:selectOneMenu>
		
			<aon:outputLabel for="WorkPlace_economicAgreement" value="#{bundle.config_administration}" />
			<aon:selectOneMenu id="WorkPlace_economicAgreement#{sufix}" required="true"
				value="#{payrollWorkPlace.to.workPlace.economicAgreement}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{configCollections.administrations}" />
			</aon:selectOneMenu>	
				
			<aon:outputLabel for="WorkPlace_scope" value="#{bundle.aon_scope}" />
			<aon:selectOneMenu id="WorkPlace_scope#{sufix}" 
				value="#{controller.to.workPlace.scope}">
				<f:selectItems value="#{configCollections.currentUserScopes}" />
			</aon:selectOneMenu>
		
			<aon:outputLabel for="WorkPlace_active" value="#{bundle.aon_active}" />
			<aon:selectBooleanCheckbox id="WorkPlace_active#{sufix}" styleClass="aon-margin-left"
				value="#{controller.to.workPlace.active}"  />
							
		</aon:panelGrid>
		
		<ui:include	src="/com/esferalia/aon/ui/payroll/facelet/workplacePayroll/tab_form.xhtml" >
			<ui:param name="controller" value="#{payrollWorkPlace}" />
			<ui:param name="lookupSufix" value="#{sufix}" />
		</ui:include>
	
	</aon:panelGrid>

</ui:composition>
