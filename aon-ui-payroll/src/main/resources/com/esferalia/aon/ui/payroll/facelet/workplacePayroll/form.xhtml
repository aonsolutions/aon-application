<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include
		src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="showDescription" value="false" />
		<ui:param name="skipSearchButton" value="true" />
		<ui:param name="innerToolbar" value="true" />

		<aon:methodParam name="saveAction" value="" />
		<ui:param name="saveButtonReRender" value="#{controller.beanName}Content" />
		<aon:methodParam name="cancelAction" value="" />
		<ui:param name="cancelButtonReRender" value="#{controller.beanName}Content" />
		<aon:methodParam name="removeAction" value="" />
		<ui:param name="removeButtonReRender" value="#{controller.beanName}Content" />
		<aon:methodParam name="resetAction" value="" />
		<ui:param name="resetButtonReRender" value="#{controller.beanName}Content" />
		<aon:methodParam name="backAction" value="" />
		<ui:param name="backButtonReRender" value="#{controller.beanName}Content" />
		
		<ui:param name="controller" value="#{payrollWorkPlace}" />

	</ui:include>

	<aon:div styleClass="aon-scroll-area">
		<aon:panelGrid columns="2" style="width: 100%;"
			columnClasses="
			aon-noborder aon-padding-left aon-width-auto aon-vertical-align-top,
			aon-noborder aon-padding-left aon-width-auto aon-vertical-align-top">
			<aon:panelGrid id="dataTable" columns="2" style="width: 50%;">
				
				<aon:outputLabel for="WorkPlace_description" value="#{bundle.aon_description}" />
				<aon:inputText id="WorkPlace_description"  
					value="#{payrollWorkPlace.to.description}" 
					required="true" size="40" maxlength="64" />
				
				<aon:outputLabel for="WorkPlace_address_id" value="#{companyBundle.company_workplace_address}" />
				<aon:selectOneMenu id="WorkPlace_address_id" 
					value="#{payrollWorkPlace.to.address}" 
					required="true">
						<f:selectItems value="#{enterprise.addresses}" />
				</aon:selectOneMenu>
			
				<aon:outputText for="WorkPlace_economicAgreement" value="#{configBundle.config_administration}" />
				<aon:selectOneMenu id="WorkPlace_economicAgreement"
					value="#{payrollWorkPlace.to.economicAgreement}" >
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{configCollections.administrations}" />
				</aon:selectOneMenu>	
			
				<aon:outputLabel for="WorkPlace_active" value="#{bundle.aon_active}" />
				<aon:selectBooleanCheckbox id="WorkPlace_active" styleClass="aon-margin-left"
					value="#{controller.to.active}"  />
								
			</aon:panelGrid>
			
			<ui:include	src="/com/esferalia/aon/ui/payroll/facelet/workplacePayroll/tab_form.xhtml" >
				<ui:param name="controller" value="#{payrollWorkPlace}" />
			</ui:include>
		
		</aon:panelGrid>
		
	</aon:div>

</ui:composition>
