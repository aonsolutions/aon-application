<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="showPayrollData" default="#{false}" />

	<aon:panelGrid columns="2" style="width: 90%;"
		columnClasses="
		aon-noborder aon-padding-left aon-width-auto aon-vertical-align-top aon-width-150,
		aon-noborder aon-padding-left aon-width-auto aon-vertical-align-top">
			
		<aon:outputLabel for="WorkPlace_description" value="#{bundle.aon_description}" />
		<aon:inputText id="WorkPlace_description"  
			value="#{payrollWorkPlace.to.workPlace.description}" 
			required="true" size="40" maxlength="64" />
		
		<aon:outputLabel for="WorkPlace_address_id" value="#{bundle.aon_address}" />
		<aon:selectOneMenu id="WorkPlace_address_id" 
			value="#{payrollWorkPlace.to.workPlace.address}" 
			required="true">
			<f:selectItems value="#{companyCollections.companyAddresses}" />
		</aon:selectOneMenu>
	
		<aon:outputLabel for="WorkPlace_economicAgreement" value="#{bundle.config_administration}" />
		<aon:selectOneMenu id="WorkPlace_economicAgreement" required="true"
			value="#{payrollWorkPlace.to.workPlace.economicAgreement}" >
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{configCollections.administrations}" />
		</aon:selectOneMenu>	
			
		<aon:outputLabel for="WorkPlace_scope" value="#{bundle.aon_scope}" />
		<aon:selectOneMenu id="WorkPlace_scope" 
			value="#{payrollWorkPlace.to.workPlace.scope}">
			<f:selectItems value="#{configCollections.currentUserScopes}" />
		</aon:selectOneMenu>
	
		<aon:outputLabel for="WorkPlace_active" value="#{bundle.aon_active}" />
		<aon:selectBooleanCheckbox id="WorkPlace_active" styleClass="aon-margin-left"
			value="#{payrollWorkPlace.to.workPlace.active}"  />
							
		<aon:if test="#{actionDenied.manager.renderPayrollConfig}">
			<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{payrollWorkPlace.to.calendar}" />
				<ui:param name="skipNewButton" value="#{true}" />
				<ui:param name="lookupInputSuggestSize" value="40" />
				<ui:param name="lookupSuffix" value="-PayrollWorkPlace" />
			</ui:include>	
			
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/agreement/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{payrollWorkPlace.to.agreement}" />
				<ui:param name="skipNewButton" value="#{true}" />
				<ui:param name="lookupInputSuggestSize" value="40" />
				<ui:param name="lookupSuffix" value="-PayrollWorkPlace" />
			</ui:include>	
			
			<aon:outputLabel for="PayrollWorkPlace_enterpriseActivity" 
				value="#{bundle.aon_activity}"/>
			<aon:selectOneMenu id="PayrollWorkPlace_enterpriseActivity"
				value="#{payrollWorkPlace.to.enterpriseActivity}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{enterprisePayroll.activities}" />
			</aon:selectOneMenu>
		</aon:if>	
	</aon:panelGrid>

</ui:composition>
