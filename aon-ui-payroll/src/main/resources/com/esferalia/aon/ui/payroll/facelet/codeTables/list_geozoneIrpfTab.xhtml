<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
						
	<aon:panelTab id="geozoneIrpf" label="#{bundle.payroll_geozoneIrpf_module}"
		actionListener="#{geozoneIrpf.onInitialize}">
		<aon:div styleClass="aon-panelGrid-search aon-margin-bottom">
			<aon:div styleClass="aon-panelGrid-search-info">
				<aon:outputText value="#{bundle.aon_filter}" styleClass="aon-panelGrid-search-info-internal"/>
			</aon:div>
			<aon:panelGrid columns="4">
				
				<aon:outputText value="#{bundle.config_administration}" />
				<aon:selectOneRadio value="#{geozoneIrpf.administration}" >
					<f:selectItems value="#{geozoneIrpf.administrationList}" />
					<a4j:support 
						event="onchange"
						actionListener="#{geozoneIrpf.onReloadModel}"
						reRender="geozoneIrpfTabset"
						eventsQueue="geozoneIrpfFilterKeyUp"
						requestDelay="500"
						ajaxSingle="true"
						ignoreDupResponses="true"
						limitToList="true"/>
				</aon:selectOneRadio>
				
				<aon:outputText value="#{bundle.aon_year}" styleClass="aon-margin-left"/>
				<rich:inputNumberSpinner value="#{geozoneIrpf.year}"
	   				inputSize="4" minValue="2009" maxValue="2021">
					<a4j:support 
						event="onchange"
						actionListener="#{geozoneIrpf.onReloadModel}"
						reRender="geozoneIrpfTabset"
						eventsQueue="geozoneIrpfFilterKeyUp"
						requestDelay="500"
						ajaxSingle="true"
						ignoreDupResponses="true"
						limitToList="true"/>
	   			</rich:inputNumberSpinner>
			</aon:panelGrid>	
		</aon:div>
	
		<aon:panelTabSet id="geozoneIrpfTabset" >
			<aon:panelTab label="#{bundle.payroll_geozoneIrpf_descendant}">
				<ui:include
					src="/com/esferalia/aon/ui/payroll/facelet/codeTables/geozoneIrpf/list_descendants.xhtml" />
			</aon:panelTab>
			<aon:panelTab label="#{bundle.payroll_geozoneIrpf_handicap_level}">
				<ui:include
					src="/com/esferalia/aon/ui/payroll/facelet/codeTables/geozoneIrpf/list_handicap.xhtml" />
			</aon:panelTab>
		</aon:panelTabSet>
	</aon:panelTab>
						
</ui:composition>
