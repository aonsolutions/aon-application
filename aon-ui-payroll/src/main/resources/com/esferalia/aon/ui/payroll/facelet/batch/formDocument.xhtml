<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="batchAttachDiv">
		<ui:decorate template="/com/code/aon/faces/attachment/grid.xhtml">
			<ui:param name="controller" value="#{controllerAttach}" />
			<ui:param name="removeButtonReRender" value="batchForm" />

			<ui:define name="additionalColumns" >
			
				<aon:column sortable="#{sortColumns}" alias="#{controllerAttach.pojoShortName}.attachmentType"
					styleClass="aon-editDataTable-textColumn aon-width-100">
					<f:facet name="header">
						<aon:outputLabel for="#{controllerAttach.beanName}_attachmentType"
							value="#{bundle.aon_type}" />
					</f:facet>
					<aon:outputText value="#{to.attachmentType}" rendered="#{formList}" />
					<aon:selectOneMenu id="#{controllerAttach.beanName}_attachmentType" rendered="#{formEdit}"
						value="#{controllerAttach.to.attachmentType}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{batchAttachTypes}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu id="#{controllerAttach.beanName}_attachmentType-New" rendered="#{formNew}"
							value="#{controllerAttach.to.attachmentType}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{batchAttachTypes}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
				
				<aon:column sortable="#{sortColumns}" alias="#{controllerAttach.pojoShortName}.attachDate"
					styleClass="aon-editDataTable-textColumn aon-width-120">
					<f:facet name="header">
						<aon:outputLabel for="#{controllerAttach.beanName}_scope"
							value="#{bundle.aon_date}" />
					</f:facet>
					<aon:outputText value="#{to.attachDate}" rendered="#{formList}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:selectInputDate id="#{controllerAttach.beanName}_attachDate"
						popupDateFormat="#{bundle.aon_date_pattern}"
						rendered="#{formEdit}" value="#{controllerAttach.to.attachDate}" />
					<f:facet name="footer">
						<aon:selectInputDate id="#{controllerAttach.beanName}_attachDate-New"
							popupDateFormat="#{bundle.aon_date_pattern}"
							rendered="#{formNew}" value="#{controllerAttach.to.attachDate}" />
					</f:facet>
				</aon:column>		
				<c:if test="#{!skipScopeColumn}"> 
					<aon:column sortable="#{sortColumns}" alias="#{controllerAttach.pojoShortName}.scope.description"
						styleClass="aon-editDataTable-textColumn aon-width-100">
						<f:facet name="header">
							<aon:outputLabel for="#{controllerAttach.beanName}_scope"
								value="#{bundle.aon_scope}" />
						</f:facet>
						<aon:outputText value="#{to.scope.description}" rendered="#{formList}" />
						<aon:selectOneMenu id="#{controllerAttach.beanName}_scope" rendered="#{formEdit}"
							value="#{controllerAttach.to.scope}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{configCollections.currentUserScopes}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu id="#{controllerAttach.beanName}_scope-New" rendered="#{formNew}"
								value="#{controllerAttach.to.scope}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{configCollections.currentUserScopes}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>
				</c:if>
			</ui:define>
			<ui:define name="additionalDataTableContent" >
				<aon:div styleClass="aon-margin-top" >
					<aon:outputText style="#{documentManager.freeSpaceStyle}"
						value="#{documentManager.freeSpaceMessage}" />
				</aon:div>				
			</ui:define>
		</ui:decorate>
	</aon:div>
	
</ui:composition>
