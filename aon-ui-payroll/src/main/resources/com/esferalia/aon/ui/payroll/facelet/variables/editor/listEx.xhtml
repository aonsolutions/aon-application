<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:div>
		
			<aon:outputText rendered="#{formList and variableType=='DOUBLE'}" value="#{data.expression}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		
			<aon:outputText rendered="#{formList and variableType=='INTEGER'}" value="#{data.expression}" />
		
			<aon:outputText value="&#160;"  
				styleClass="#{(data.expression)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}"
				style="padding-bottom: 5px;"
				rendered="#{formList and variableType=='BOOLEAN'}"/>
		
			<aon:outputText rendered="#{formList and variableType=='STRING'}" styleClass="aon-italic" 
				value="#{data.expression}" />
		
			<aon:outputText rendered="#{formList and variableType=='EXPRESSION'}" value="#{data.expression}" />
		
			<aon:outputText rendered="#{formList and variableType=='TABLE'}" value="#{data.expression}" />
		
			<aon:outputText rendered="#{formList and variableType=='DROP'}" value="#{data.expression}" />
		
			<aon:outputText rendered="#{formList and variableType=='CNO_DROP'}" value="#{data.variableEnum}" />
		
			<aon:outputText rendered="#{formList and variableType=='TC2_DROP'}" value="#{data.variableEnum}" />
		
			<aon:outputText rendered="#{formList and variableType=='QUOTE_GROUP_DROP'}" value="#{data.variableEnum}" />
		
			<aon:outputText rendered="#{formList and variableType=='UNKNOWN' or variableType==null}" value="#{data.expression}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>

	</aon:div>

</ui:composition>
