<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<a4j:loadStyle src="#{aonResource.resolveLocal['/css/tree.css']}"/>
	<a4j:loadScript src="#{aonResource.resolveLocal['/js/tree.js']}"/>
	
	<ui:include src="/com/code/aon/ui/resources/facelet/shared/messages.xhtml" />
	
	<ui:include src="/facelet/homepage/menu.xhtml" />

	<rich:jQuery timing="onload"
		selector="body" query="addClass('aon-overflow-hidden')" />	
		
	<aon:componentGroup
		family="javax.faces.Command"
		rendered="#{aonRole.guest}"
		method="#{aonRole.renderedCommand}"
		>
		
		<aon:div styleClass="treeLeftContent aon-background-shadow">
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/enterpriseTree/tree.xhtml" />
		</aon:div>
		
		<aon:div styleClass="treeMainContent">
			<aon:div>
				<ui:insert name="header" />
				<ui:insert name="content" />
			</aon:div>
		</aon:div>

	</aon:componentGroup>
	
	<script>
		jQuery(document).ready(function() {
			goToTreeOffset();
		});
	</script>

</ui:composition>
