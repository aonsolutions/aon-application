<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<a4j:loadScript src="#{aonResource.resolveLocal['/js/tree.js']}"/>
	<a4j:loadStyle src="#{aonResource.resolveLocal['/css/splitter.css']}"/>
	<a4j:loadScript src="#{aonResource.resolveLocal['/js/splitter.js']}"/>
	
	<ui:include src="/com/code/aon/ui/resources/facelet/shared/messages.xhtml" />
	
	<ui:include src="/facelet/homepage/menu.xhtml" />

	<rich:jQuery timing="onload"
		selector="body" query="addClass('aon-overflow-hidden')" />	
		
	<aon:componentGroup
		family="javax.faces.Command"
		rendered="#{aonRole.guest}"
		method="#{aonRole.renderedCommand}"
		>
		
		<aon:div styleClass="treeContentDiv">
			<aon:div styleClass="treeLeftContent">
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/enterpriseTree/tree.xhtml" />
			</aon:div>
			
			<aon:div styleClass="treeRightContent">
				<ui:insert name="header" />
				<ui:insert name="content" />
			</aon:div>
		</aon:div>

	</aon:componentGroup>
	
	<script>
		jQuery().ready(function() {
			jQuery('.treeContentDiv').splitter({
				splitVertical: true,
				anchorToWindow: true,
				resizeToWidth: true,
				sizeLeft: getSplitterPosition(),
				minLeft: 150,
				minRight: 600
			});
			goToTreeOffset();
		});
		jQuery('.treeLeftContent').resize(function() {
			setSplitterPosition( jQuery(this).width() );
		});
	</script>

</ui:composition>
