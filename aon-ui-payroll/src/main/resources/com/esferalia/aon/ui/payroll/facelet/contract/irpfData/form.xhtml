<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="irpfDataForm">
		
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_irpfData_module}" />
					<ui:param name="controller" value="#{irpfData}" />
					<ui:param name="skipSpin" value="false" />
					<ui:param name="skipFocusFirst" value="true" />
					
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton 
							value="#{payrollBundle.payroll_irpfData_update_irpf}"
							styleClass="aon-finding-toolbar-item aon-icon-sincronize"
							rendered="#{!irpfData.new and irpfData.irpfChanged}"
							actionListener="#{irpfData.onIpdateIrpf}"
							reRender="aonContent" />
						<aon:htmlCommandLink id="mod145_list"
							styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
							value="#{payrollBundle.payroll_irpfData_mod145}"
							rendered="#{!irpfData.new}"
							action="#{report.onExecute}">
							<!--  
							<aon:actionListener method="#{enterpriseTree.onLoadWorkPlaceCalendar}" />						
							<aon:actionListener method="#{calendarPrint.onLoad}" />						
							-->
							<f:param name="reportKey" value="mod145Report" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>	
					</ui:define>
					
				</ui:decorate>
			</aon:div>	

			<aon:div ajaxRendered="true" layout="none">

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area" >
					<aon:panelGrid columns="4" dir="true" width="100%">
						
						<aon:outputLabel value="#{registryBundle.registry_person}" />
						<aon:outputText value="#{contract.to.person.registry.fullName}" />
						
						<aon:outputLabel value="#{payrollBundle.payroll_irpfData_anual_retribution}" />
						<aon:outputText value="#{irpfData.params.grossSalary}" />

						<aon:outputLabel value="#{payrollBundle.payroll_enterprise}" />
						<aon:outputText value="#{contract.to.workPlace.enterprise.registry.fullName}" />

						<aon:outputLabel value="#{payrollBundle.payroll_irpfData_current_irpf}" />
						<aon:outputText value="#{irpfData.params.currentIrpf}" />
						
						<aon:outputLabel value="#{payrollBundle.payroll_irpfData_date}" />
						<aon:div>
							<aon:outputLabel value="#{bundle.aon_start_date}:" styleClass="aon-italic aon-bold"/>
							<aon:outputText value="#{irpfData.to.startDate}" style="margin-left: 5px;">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							
							<aon:outputLabel value="#{bundle.aon_end_date}:" styleClass="aon-italic aon-bold aon-margin-left"/>
							<aon:outputText value="#{irpfData.to.endDate}" style="margin-left: 5px;">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:div>

						<aon:outputLabel value="#{payrollBundle.payroll_irpfData_calculated_irpf}" />
						<aon:outputText value="#{irpfData.params.newIrpf}" />
						
					</aon:panelGrid>
				</aon:div>
				
				<aon:panelTabSet>
					<aon:panelTab label="#{payrollBundle.payroll_irpfData_general_data}">
						<ui:include 
							src="/com/esferalia/aon/ui/payroll/facelet/contract/irpfData/form_person.xhtml" />
						<ui:include 
							src="/com/esferalia/aon/ui/payroll/facelet/contract/irpfData/form_economic.xhtml" />
					</aon:panelTab>
					<aon:panelTab label="#{payrollBundle.payroll_irpfData_regularization_data}">
						<ui:include 
							src="/com/esferalia/aon/ui/payroll/facelet/contract/irpfData/form_regularization.xhtml" />
					</aon:panelTab>
				</aon:panelTabSet>

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
