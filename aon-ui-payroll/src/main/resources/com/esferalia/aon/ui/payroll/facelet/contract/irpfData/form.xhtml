<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="irpfDataForm">
		
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_irpfData_module}" />
					<ui:param name="controller" value="#{irpfData}" />
					<ui:param name="skipSpin" value="false" />
					<ui:param name="skipFocusFirst" value="true" />
					
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton 
							value="#{payrollBundle.payroll_irpfData_update_irpf}"
							styleClass="aon-finding-toolbar-item aon-icon-sincronize"
							rendered="#{irpfData.irpfChanged}"
							actionListener="#{irpfData.onIpdateIrpf}"
							reRender="aonContent" />
					</ui:define>
					
				</ui:decorate>
			</aon:div>	

			<aon:div ajaxRendered="true" layout="none">

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area" >
					<aon:panelGrid columns="4" dir="true" width="100%">
						
						<aon:outputLabel value="#{registryBundle.registry_person}" />
						<aon:outputText value="#{contract.to.person.registry.fullName}" />
						
						<aon:outputLabel value="#{payrollBundle.payroll_irpfData_anual_retribution}" />
						<aon:outputText value="#{irpfData.params.grossSalary}" />

						<aon:outputLabel value="#{payrollBundle.payroll_enterprise}" />
						<aon:outputText value="#{contract.to.workPlace.enterprise.registry.fullName}" />

						<aon:outputLabel value="#{payrollBundle.payroll_irpfData_current_irpf}" />
						<aon:outputText value="#{irpfData.params.currentIrpf}" />
						
						<aon:outputLabel value="#{payrollBundle.payroll_irpfData_date}" />
						<aon:div>
							<aon:outputLabel value="#{bundle.aon_start_date}:" styleClass="aon-italic aon-bold"/>
							<aon:outputText value="#{irpfData.to.startDate}" style="margin-left: 5px;">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							
							<aon:outputLabel value="#{bundle.aon_end_date}:" styleClass="aon-italic aon-bold aon-margin-left"/>
							<aon:outputText value="#{irpfData.to.endDate}" style="margin-left: 5px;">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:div>

						<aon:outputLabel value="#{payrollBundle.payroll_irpfData_calculated_irpf}" />
						<aon:outputText value="#{irpfData.params.newIrpf}" />
						
					</aon:panelGrid>
				</aon:div>
					
				<aon:div styleClass="aon-scroll-area" id="irpfDataContent">
					<aon:panelGrid columns="2"  width="100%"
						columnClasses="aon-panelGrid-odd aon-width-150,	aon-panelGrid-even aon-width-auto">
				
						<aon:outputLabel for="irpfData_fiscal_exclusion"
							value="#{payrollBundle.payroll_irpfData_fiscal_exclusion}" />
						<aon:selectBooleanCheckbox id="irpfData_fiscal_exclusion" 
							value="#{irpfData.to.fiscalExclusion}"/> 
						
						<aon:outputLabel for="irpfData_familySituation" value="#{payrollBundle.payroll_irpfData_familySituation}" />
						<aon:selectOneRadio id="irpfData_familySituation" layout="pageDirection" 
							value="#{irpfData.to.familySituation}" >
							<f:selectItems value="#{payrollCollections.familySituations}"  />
							<a4j:support event="onchange" reRender="irpfDataContent" ajaxSingle="true" />
							<a4j:support event="onclick" reRender="irpfDataContent" ajaxSingle="true" />
						</aon:selectOneRadio>
						
						<aon:outputLabel for="irpfData_spouseDocument" value="#{payrollBundle.payroll_irpfData_spouseDocument}" 
							rendered="#{irpfData.to.familySituation=='MARRIED'}"/>
						<aon:panelGroup id="irpfDataDocumentPanel"
							rendered="#{irpfData.to.familySituation=='MARRIED'}" required="true">
							<aon:inputText id="irpfData_document" style="margin-left: 3px;" required="true"
								value="#{irpfData.to.spouseDocument}" size="16" maxlength="16">
								<f:validateLength minimum="1" maximum="16" />
								<a4j:support onsubmit="toUpperCase(this);"
									event="onchange" 
									reRender="irpfDataDocumentPanel" 
									ajaxSingle="true" />
							</aon:inputText>
							<aon:outputText 
								rendered="#{irpfData.to.spouseDocument==null}"
								styleClass="aon-icon-question"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{irpfData.validNIF}"
								styleClass="aon-icon-predetermine"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{irpfData.to.spouseDocument!=null and !irpfData.validNIF}"
								styleClass="aon-icon-exception"
								style="padding-left: 15px;"
								value="&#160;" />
						</aon:panelGroup>
						
						<aon:outputLabel for="irpfData_disabilityLevel" value="#{payrollBundle.payroll_irpfData_disabilityLevel}" />
						<aon:selectOneMenu id="irpfData_disabilityLevel" value="#{irpfData.disabilityLevel}">
							<f:selectItem value="#{null}" itemLabel=" - " />
							<f:selectItems value="#{payrollCollections.disabilityLevels}" />
							<a4j:support event="onchange" reRender="irpfDataContent" ajaxSingle="true" />
						</aon:selectOneMenu>
				
						<aon:outputLabel for="irpfData_dependence"
							rendered="#{irpfData.disabilityLevel=='GT_EQ_33_LT_65'}" 
							value="#{payrollBundle.payroll_irpfData_dependence}" />
						<aon:selectBooleanCheckbox id="irpfData_dependence" 
							rendered="#{irpfData.disabilityLevel=='GT_EQ_33_LT_65'}" 
							value="#{irpfData.to.dependence}"/> 

						<aon:outputLabel for="irpfData_movingDate" value="#{payrollBundle.payroll_irpfData_movingDate}" />
						<aon:selectInputDate id="irpfData_movingDate" 
							value="#{irpfData.to.movingDate}" 
							inputSize="10" renderAsPopup="true" enableManualInput="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>

						<aon:outputLabel for="irpfData_labourProlongation" value="#{payrollBundle.payroll_irpfData_labourProlongation}" />
						<aon:selectBooleanCheckbox id="irpfData_labourProlongation" value="#{irpfData.to.labourProlongation}"/>

						<aon:outputLabel for="irpfData_descendientCount" value="#{payrollBundle.payroll_irpfData_descendientCount}" />
						<rich:inputNumberSpinner id="irpfData_descendientCount" 
							disabled="#{irpfData.descendientLinesCount>0}"
							value="#{irpfData.to.descendientCount}" 
							inputSize="2" minValue="0" maxValue="20" />
						
					</aon:panelGrid>
				</aon:div>

			</aon:div>
		</aon:form>

		<aon:form>
			<aon:div styleClass="aon-scroll-area">
				<c:if test="#{!irpfData.new}" >
						
						
						
						
						
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_irpfData_descendients}" />
						</f:facet>
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
							<ui:param name="controller" value="#{irpfDataDescendients}" />
							<ui:param name="saveButtonReRender" value="irpfDataForm" />
							<ui:param name="removeButtonReRender" value="irpfDataForm" />
							<ui:define name="columns">
								<ui:include 
									src="/com/esferalia/aon/ui/payroll/facelet/contract/irpfData/descendients/gridContent.xhtml" />
							</ui:define>
						</ui:decorate>
					</aon:panel>
										
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_irpfData_ascendants}" />
						</f:facet>
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
							<ui:param name="controller" value="#{irpfDataAscendants}" />
							<ui:param name="saveButtonReRender" value="irpfDataForm" />
							<ui:param name="removeButtonReRender" value="irpfDataForm" />
							<ui:define name="columns">
								<ui:include 
									src="/com/esferalia/aon/ui/payroll/facelet/contract/irpfData/ascendants/gridContent.xhtml" />
							</ui:define>
						</ui:decorate>
					</aon:panel>
						
				</c:if>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
