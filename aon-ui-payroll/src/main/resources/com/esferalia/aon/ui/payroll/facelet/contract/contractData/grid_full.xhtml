<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{contractData}" />
		<ui:define name="columns">
	
		<aon:column alias="ContractData.name" 
			styleClass="aon-editDataTable-textColumn aon-width-70 aon-nowrap">
			<f:facet name="header">
				<aon:outputLabel for="ContractData_name" value="#{bundle.aon_name}" />
			</f:facet>
			<aon:outputText value="#{to.name}" rendered="#{formList}"/>
			<aon:inputText id="ContractData_name" rendered="#{formEdit}"
				value="#{controller.to.name}"/>	
			<f:facet name="footer">
				<aon:inputText id="ContractData_name-New" rendered="#{formNew}"
					value="#{controller.to.name}"/>
			</f:facet>
		</aon:column>
	
		<aon:column alias="ContractData.expression" 
			styleClass="aon-editDataTable-textColumn aon-width-70 aon-nowrap">
			<f:facet name="header">
				<aon:outputLabel for="ContractData_expression" value="#{bundle.aon_value}" />
			</f:facet>
			<aon:outputText value="#{to.expression}" rendered="#{formList}"/>
			<aon:inputText id="ContractData_expression" rendered="#{formEdit}"
				value="#{controller.to.expression}"/>
			<f:facet name="footer">
				<aon:inputText id="ContractData_expression-New" rendered="#{formNew}"
					value="#{controller.to.expression}"/>
			</f:facet>
		</aon:column>
		
		<aon:column alias="ContractData.startDate"
			styleClass="aon-editDataTable-dateColumn aon-width-120">
			<f:facet name="header">
				<aon:outputLabel for="ContractData_startDate" value="#{bundle.aon_start_date}" />
			</f:facet>
			<aon:outputText value="#{to.startDate}" rendered="#{formList}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
			<aon:selectInputDate id="ContractData_startDate" rendered="#{formEdit}"
				required="#{true}"
				value="#{controller.to.startDate}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}"/>
			<f:facet name="footer">
				<aon:selectInputDate id="ContractData_startDate-New" rendered="#{formNew}"
					required="#{true}"
					value="#{controller.to.startDate}"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}"/>
			</f:facet>
		</aon:column>
		
		<aon:column alias="ContractData.endDate"
			styleClass="aon-editDataTable-dateColumn aon-width-120">
			<f:facet name="header">
				<aon:outputLabel for="ContractData_endDate" value="#{bundle.aon_end_date}" />
			</f:facet>
			<aon:outputText value="#{to.endDate}" rendered="#{formList}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
			<aon:selectInputDate id="ContractData_endDate" rendered="#{formEdit}"
				value="#{controller.to.endDate}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}"/>
			<f:facet name="footer">
				<aon:selectInputDate id="ContractData_endDate-New" rendered="#{formNew}"
					value="#{controller.to.endDate}"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}"/>
			</f:facet>
		</aon:column>
		
	</ui:define>
	
</ui:decorate>
	
</ui:composition>
