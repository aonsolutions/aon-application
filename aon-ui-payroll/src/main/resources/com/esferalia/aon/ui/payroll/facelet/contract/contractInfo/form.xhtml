<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	
	<c:if test="#{empty contract.params.contractModelOption}">
		<aon:div style="border:1px #000 solid; text-align:center; padding:10px; color:blue;">
			<aon:outputText value="Seleccione la modalidad del contrato para poder introducir los datos" />
		</aon:div>
	</c:if>
	
	<a4j:repeat var="to" value="#{controller.contractFieldList}">
		<aon:panelGrid columns="2" styleClass="aon-width-all"
			columnClasses="aon-panelGrid-odd aon-width-300, aon-panelGrid-even aon-width-auto" >
		
			<aon:outputText value="#{to.name}" />
			<aon:inputText value="#{to.expression}" maxlength="128" size="64" />
			
		</aon:panelGrid>
	</a4j:repeat>
	
</ui:composition>
