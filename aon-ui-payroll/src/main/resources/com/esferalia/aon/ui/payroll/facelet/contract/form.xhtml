<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="contractForm">

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formToolbar.xhtml" />
			
			<aon:div styleClass="aon-scroll-area">		
				<aon:if test="#{contract.nevv}" >
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formContent.xhtml" />
				</aon:if>
			
				<aon:if test="#{!contract.nevv}" >
				
					<aon:panelGrid id="contract-panelGrib" columns="4" styleClass="aon-width-all"
						columnClasses="
						aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-200,
						aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-auto
						" >
						
						<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formPersonContent.xhtml" />
						
						<!--  
						<aon:outputLabel value="#{bundle.payroll_contract_sepe_communicationId}" />
						<aon:outputText disabled="#{true}"
							value="#{contract.sepeCommunicationId}" />
													
						<aon:outputLabel value="#{bundle.payroll_contract_sepe_status}" />
						<aon:outputText disabled="#{true}"
							value="#{contract.to.sepeStatus}" />
						-->
						
						<aon:outputText value="&#160;" />
						<aon:outputText value="&#160;" />
						
						<aon:outputText value="#{bundle.aon_status}" />
						<aon:div>
							<aon:panelGrid columns="2" columnClasses="aon-panelGrid-even aon-noborder, aon-panelGrid-even aon-noborder">
								<rich:dropDownMenu id="ssStatusDropDown" event="onclick"
									submitMode="none" direction="bottom-left"
									jointPoint="br" hideDelay="300">
									<f:facet name="label"> 
										<aon:outputText value="#{contract.params.ssStatus}" 
											styleClass="aon-icon-commandButton aon-icon-winsuite aon-padding-left aon-margin-right" />
					                </f:facet>
					                <rich:menuItem submitMode="none">
				                        <aon:selectOneMenu value="#{contract.params.ssStatus}" layout="pageDirection">
											<f:selectItems value="#{contract.ssStatuses}" />
											<a4j:support event="onchange" ajaxSingle="true" reRender="ssStatusDropDown" />
										</aon:selectOneMenu>
				                    </rich:menuItem>
								</rich:dropDownMenu>
								<rich:dropDownMenu id="sepeStatusDropDown" event="onclick"
									submitMode="none" direction="bottom-left"
									jointPoint="br" hideDelay="300">
									<f:facet name="label"> 
										<aon:outputText value="#{contract.params.sepeStatus}" 
											styleClass="aon-icon-commandButton aon-icon-sepe aon-padding-left aon-margin-right" />
					                </f:facet>
					                <rich:menuItem submitMode="none" id="sepeStatusDropDownOptionsItem">
				                        <aon:selectOneMenu value="#{contract.params.sepeStatus}" focus="sepeManualId" layout="pageDirection">
											<f:selectItems value="#{contract.sepeStatuses}" />
											<a4j:support event="onchange" ajaxSingle="true" reRender="sepeStatusDropDown" />
											<a4j:support event="onblur" ajaxSingle="true" reRender="sepeStatusDropDown" />
										</aon:selectOneMenu>
				                    </rich:menuItem>
								</rich:dropDownMenu>
							</aon:panelGrid>
					
						</aon:div>
							
					</aon:panelGrid>
				
					<aon:panelTabSet id="contract-panelTab" selectedTab="#{contract.selectedTab}" 
						switchType="ajax" immediate="true">
						
						<aon:panelTab id="mainData" label="#{bundle.payroll_contract_general_data}" >
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formContent.xhtml" >
								<ui:param name="readOnly" value="#{contract.readOnly}" />
							</ui:include>
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/bonus/panel_list.xhtml" >
								<ui:param name="removeButtonReRender" value="contract-panelTab" />
							</ui:include>
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/embargo/panel_list.xhtml" >
								<ui:param name="removeButtonReRender" value="contract-panelTab" />
							</ui:include>
						</aon:panelTab>
						
						<aon:if test="#{!contract.params.retaQuote}">

							<aon:if test="#{!contract.internship}" >
							
								<aon:panelTab id="contract-contrataData" label="#{bundle.sepe_contrata_contract_specific_data}"
									actionListener="#{contract.onContractSepeShow}" >
									<aon:if test="#{not empty contractContrata.handler}">
										<aon:div style="width:920px;">
											<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formOccupation.xhtml" />
											<br />
											<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/contract/form_otherData.xhtml" >
												<ui:param name="controller" value="#{contractContrata}" />
											</ui:include>
											<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/contract/form_specificData.xhtml" />
										</aon:div>		
									</aon:if>
								</aon:panelTab>
								<aon:if test="#{contract.extendedContract}">
									<aon:panelTab id="extension-contrataData" label="Datos Prórroga"
										actionListener="#{contract.onExtension1SepeShow}" >
										<aon:if test="#{not empty extensionContrata.handler}">
											<aon:div style="width:920px;">
												<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/extension/form_content.xhtml" >
													<ui:param name="controller" value="#{extensionContrata}" />
												</ui:include>
											</aon:div>
										</aon:if>
									</aon:panelTab>
								</aon:if>
								<aon:if test="#{contract.extendedContract and contract.extensionCount>1}">
									<aon:panelTab id="extension2-contrataData" label="Datos 2ª Prórroga"
										actionListener="#{contract.onExtension2SepeShow}" >
										<aon:if test="#{not empty extensionContrata.handler}">
											<aon:div style="width:920px;">
												<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/extension/form_content.xhtml" >
													<ui:param name="controller" value="#{extensionContrata}" />
													<ui:param name="suffix" value="#{contract.extensionCount}" />
												</ui:include>
											</aon:div>
										</aon:if>
									</aon:panelTab>
								</aon:if>
								<aon:if test="#{contract.transformedContract}">
									<aon:panelTab id="transform-contrataData" label="Datos Transformación"
										actionListener="#{contract.onTransformSepeShow}" >
										<aon:if test="#{not empty transformContrata.handler}">
											<aon:div style="width:920px;">
												<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/transform/form_content.xhtml" >
													<ui:param name="controller" value="#{transformContrata}" />
												</ui:include>
												<br />
												<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/transform/form_otherData.xhtml" >
													<ui:param name="controller" value="#{transformContrata}" />
												</ui:include>
												<br />
												<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/transform/form_specificData.xhtml" />
											</aon:div>
										</aon:if>
									</aon:panelTab>
								</aon:if>
		
								<aon:panelTab id="documentOtherData" label="#{bundle.aon_addInfo}"
									actionListener="#{contractDocumentInfo.onLoadContractFields}" ajaxSingle="#{true}">
									<aon:div style="width:850px;">
										<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/contractInfo/formContent.xhtml" >
											<ui:param name="controller" value="#{contractDocumentInfo}" />
										</ui:include>
									</aon:div>
								</aon:panelTab>
								
							</aon:if>
							
							<aon:if test="#{true}">
								<aon:panelTab id="additionalClausesData" label="#{bundle.payroll_contract_additional_clauses}">
									<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/additionalClauses/formContent.xhtml" >
										<ui:param name="controller" value="#{contractClause}" />
									</ui:include>
								</aon:panelTab>
							</aon:if>
							
						</aon:if>

						<aon:panelTab id="attachData" label="#{bundle.aon_documents}">
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/document/grid.xhtml" />
						</aon:panelTab>

						<aon:if test="#{sepeAppParams.developmentMode or aonRole.sysAdmin}">
							<aon:panelTab id="contractInfo" label="INFO">
								<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/contractInfo/grid_full.xhtml" />
							</aon:panelTab>
						</aon:if>
						
					</aon:panelTabSet>
					
				</aon:if>
			</aon:div>
			
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{agreementLookup}" />
		<aon:lookupButtonPopup lookup="#{cnoLookup}" />
		<aon:lookupButtonPopup lookup="#{trainingCenterLookup}" />
		<aon:lookupButtonPopup lookup="#{trainingCourseLookup}" />
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/embargo/modalEmbargo.xhtml" >
			<ui:param name="controller" value="#{contractEmbargo}" />
			<ui:param name="reRender" value="contract-panelTab" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/workdayDuration/modalWorkdayHours.xhtml" >
			<ui:param name="reRender" value="contract-panelTab" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/bonus/modalBonus.xhtml" >
			<ui:param name="reRender" value="contract-panelTab" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/salaryInfo/modalSalaryInfo.xhtml" />
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/additionalClauses/modalAvailableClauses.xhtml" >
			<ui:param name="saveReRender" value="additionalClausesData" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/document/modalGeneration.xhtml" />
		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/extension/modalExtension.xhtml" >
			<ui:param name="reRender" value="contractForm" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/transform/modalTransform.xhtml" >
			<ui:param name="reRender" value="contractForm" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/contrata/modalCommunication.xhtml" >
			<ui:param name="controller" value="#{contract}" />
			<aon:if test="#{contract.transformedContract}">
				<ui:param name="contrata" value="#{transformContrata}" />
			</aon:if>
			<aon:if test="#{contract.extendedContract}">
				<ui:param name="contrata" value="#{extensionContrata}" />
			</aon:if>
			<aon:if test="#{!contract.transformedContract and !contract.extendedContract}">
				<ui:param name="contrata" value="#{contractContrata}" />
			</aon:if>
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/certificados/modalCommunication.xhtml" >
			<ui:param name="controller" value="#{contract}" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/enumLookup/modalSearch.xhtml" />
		
	</ui:define>
</ui:composition>
