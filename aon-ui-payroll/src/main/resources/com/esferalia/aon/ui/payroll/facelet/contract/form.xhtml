<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="contractForm">

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formToolbar.xhtml" />
			
			<aon:div styleClass="aon-scroll-area">		
				<c:if test="#{contract.new}" >
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formContent.xhtml" />
				</c:if>
			
				<c:if test="#{!contract.new}" >
				
					<aon:panel style="width: 850px;">
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_person_data}" />
						</f:facet>
						<aon:panelGrid columns="4" styleClass="aon-width-all" >
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formPersonContent.xhtml" />
						</aon:panelGrid>
					</aon:panel>
				
					<aon:panelTabSet switchType="ajax" immediate="true">
						
						<aon:panelTab id="mainData" label="Datos Generales" >
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formContent.xhtml" />
						</aon:panelTab>

						<aon:panelTab id="contrataData" label="Datos Contrat@" 
							actionListener="#{contractContrata.onContrataDataShow}">
							<c:if test="#{contractContrata.enabledContrataEdition}">
								<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/contrata/form_toolbar.xhtml" />
								<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/contrata/form_content.xhtml" />
							</c:if>
							<c:if test="#{!contractContrata.enabledContrataEdition}">
								<aon:outputText style="color:red;padding-left:18px;" styleClass="aon-icon-wrong"
									value="Tipo de contrato sin implementación para comunicaciones con Contrat@." />
							</c:if>
						</aon:panelTab>

						<aon:panelTab id="attachData" label="Documentos">
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/document/gridContent.xhtml" />
						</aon:panelTab>
						
					</aon:panelTabSet>
					
					
					<!--  
					<aon:panelGrid columns="2" 
						columnClasses="aon-panelGrid-even aon-noborder aon-vertical-align-top, aon-panelGrid-even aon-noborder aon-vertical-align-top" >
						<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formContent.xhtml" />
						<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formPersonContent.xhtml" />
					</aon:panelGrid>
					
					<br />
					
					<aon:panelCollapsible id="variablesPanel" expanded="true" actionListener="#{contract.onShowVariables}" >
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_contract_data_variables}" style="padding-left:18px;" styleClass="aon-icon-search"/>
						</f:facet>
						<ui:include src="/com/esferalia/aon/ui/payroll/facelet/variables/data/grid.xhtml" >
							<ui:param name="controller" value="#{contract}" />
							<ui:param name="showVariableFilter" value="true" />
						</ui:include>
					</aon:panelCollapsible>

					<c:if test="#{!contract.skipPayrollData}" >
						<aon:panelCollapsible id="paymentsPanel" expanded="false" actionListener="#{contract.onShowPayments}" >
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.payroll_salary_payments_tab}" style="padding-left:18px;" styleClass="aon-icon-fraction"/>
							</f:facet>
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/payment/editGridContent.xhtml" >
								<ui:param name="controller" value="#{contractPayment}" />
							</ui:include>
						</aon:panelCollapsible>
	
						<aon:panelCollapsible id="deductionsPanel" expanded="false" actionListener="#{contract.onShowDeductions}" >
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.payroll_salary_deductions_tab}" style="padding-left:18px;" styleClass="aon-icon-settle"/>
							</f:facet>
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/editGridContent.xhtml" >
								<ui:param name="controller" value="#{contractDeduction}" />
							</ui:include>
						</aon:panelCollapsible>
	
						<aon:panelCollapsible id="bonusPanel" expanded="false" actionListener="#{contract.onShowBonus}" >
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.payroll_salary_bonus_tab}" style="padding-left:18px;" styleClass="aon-icon-pay"/>
							</f:facet>
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/bonus/editGridContent.xhtml" >
								<ui:param name="controller" value="#{contractBonus}" />
							</ui:include>
						</aon:panelCollapsible>
	
						<aon:panelCollapsible id="embargosPanel" expanded="false" actionListener="#{contract.onShowEmbargos}" >
							<f:facet name="header">
								<aon:outputText value="#{payrollBundle.payroll_salary_embargos_tab}" style="padding-left:18px;" styleClass="aon-icon-return"/>
							</f:facet>
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/embargo/listContent.xhtml">
								<ui:param name="controller" value="#{contractEmbargo}" />
							</ui:include>
						</aon:panelCollapsible>
					</c:if>

					<aon:panelCollapsible expanded="false" actionListener="#{contract.onShowDocuments}" >
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_documents}" style="padding-left:18px;" styleClass="aon-icon-attach-file"/>
						</f:facet>
						<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/document/gridContent.xhtml" />
					</aon:panelCollapsible>
					-->

				</c:if>
			</aon:div>
			
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<aon:lookupButtonPopup lookup="#{agreementLookup}" />
		<aon:lookupButtonPopup lookup="#{cnoLookup}" />
		<aon:lookupButtonPopup lookup="#{trainingCenterLookup}" />
		<aon:lookupButtonPopup lookup="#{trainingCourseLookup}" />
		
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/variables/helper/modalHelper.xhtml">
			<ui:param name="controller" value="#{contract}" />
			<ui:param name="container" value="variablesPanel" />
		</ui:include>
		
		<c:if test="#{!contract.skipPayrollData}" >
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/payment/modalPayment.xhtml">
				<ui:param name="controller" value="#{contractPayment}" />
				<ui:param name="skipCurrentMonth" value="#{true}" />
				<ui:param name="contextDisabled" value="#{true}" />
				<ui:param name="container" value="paymentsPanel" />
			</ui:include>
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/deduction/modalDeduction.xhtml">
				<ui:param name="controller" value="#{contractDeduction}" />
				<ui:param name="skipCurrentMonth" value="#{true}" />
				<ui:param name="contextDisabled" value="#{true}" />
				<ui:param name="container" value="deductionsPanel" />
			</ui:include>
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/bonus/modalBonus.xhtml">
				<ui:param name="controller" value="#{contractBonus}" />
				<ui:param name="skipCurrentMonth" value="#{true}" />
				<ui:param name="contextDisabled" value="#{true}" />
				<ui:param name="container" value="bonusPanel" />
			</ui:include>
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/embargo/modalEmbargo.xhtml">
				<ui:param name="controller" value="#{contractEmbargo}" />
				<ui:param name="container" value="embargosPanel" />
			</ui:include>
		</c:if>
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/contrata/modalLogin.xhtml" />
		
	</ui:define>
</ui:composition>
