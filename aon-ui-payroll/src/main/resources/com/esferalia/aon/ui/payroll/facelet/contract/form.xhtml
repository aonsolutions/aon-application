<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="contractForm">

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formToolbar.xhtml" />
			
			<aon:div styleClass="aon-scroll-area">		
				<c:if test="#{contract.new}" >
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formContent.xhtml" />
				</c:if>
			
				<c:if test="#{!contract.new}" >
				
					<aon:panelGrid columns="4" styleClass="aon-width-all" >
						<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formPersonContent.xhtml" />
						
						<aon:outputLabel value="#{payrollBundle.payroll_contract_sepe_communicationId}" />
						<aon:outputText disabled="#{true}"
							value="#{contract.sepeCommunicationId}" />
													
						<aon:outputLabel value="#{payrollBundle.payroll_contract_sepe_status}" />
						<aon:outputText disabled="#{true}"
							value="#{contract.to.sepeStatus}" />
							
					</aon:panelGrid>
				
					<aon:panelTabSet id="contract-panelTab" selectedTab="#{contract.selectedTab}" 
						switchType="ajax" immediate="true">
						
						<aon:panelTab id="mainData" label="#{payrollBundle.payroll_contract_general_data}" >
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formContent.xhtml" />
						</aon:panelTab>

						<aon:panelTab id="contrataData" label="#{sepeBundle.sepe_contrata_contract_specific_data}" 
							actionListener="#{contractContrata.onContrataDataShow}">
							<c:if test="#{contractContrata.enabledContrataEdition}">
								<aon:div style="width:850px;">
									<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/contract/form_otherData.xhtml" />
									<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/contract/form_specificData.xhtml" />
								</aon:div>		
							</c:if>
							<c:if test="#{!contractContrata.enabledContrataEdition}">
								<aon:outputText style="color:red;padding-left:18px;" styleClass="aon-icon-wrong"
									value="Tipo de contrato sin implementación para comunicaciones con Contrat@." />
							</c:if>
						</aon:panelTab>

						<aon:panelTab id="additionalClausesData" label="#{payrollBundle.payroll_contract_additional_clauses}"
							actionListener="#{contractClauses.onAdditionalClausesShow}">
							<c:if test="#{not empty contract.to.model}">
								<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/additionalClauses/form.xhtml" />
							</c:if>
						</aon:panelTab>

						<aon:panelTab id="attachData"  
							label="#{payrollBundle.payroll_documents}">
							<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/document/grid.xhtml" />
						</aon:panelTab>
						
					</aon:panelTabSet>
					
				</c:if>
			</aon:div>
			
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<aon:lookupButtonPopup lookup="#{agreementLookup}" />
		<aon:lookupButtonPopup lookup="#{cnoLookup}" />
		<aon:lookupButtonPopup lookup="#{trainingCenterLookup}" />
		<aon:lookupButtonPopup lookup="#{trainingCourseLookup}" />
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />

		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/contrata/extension/modalExtension.xhtml" />

		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/modalLogin.xhtml" >
			<ui:param name="controller" value="#{contractContrata}" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/modalCommunication.xhtml" >
			<ui:param name="controller" value="#{contractContrata}" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/communication/modalBatch.xhtml" >
			<ui:param name="controller" value="#{contractContrata}" />
		</ui:include>
		
		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/certificados/modalLogin.xhtml" >
			<ui:param name="controller" value="#{contractCertificados}" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/certificados/modalCommunication.xhtml" >
			<ui:param name="controller" value="#{contractCertificados}" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/certificados/modalGeneration.xhtml" >
			<ui:param name="controller" value="#{contractCertificados}" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/sepe/facelet/certificados/modalBatch.xhtml" >
			<ui:param name="controller" value="#{contractCertificados}" />
		</ui:include>
		
	</ui:define>
</ui:composition>
