<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="contractForm">

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formToolbar.xhtml" />
			
			<c:if test="#{!contract.new}" >
				<aon:div styleClass="aon-scroll-area">		
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/gridContent.xhtml" />
				</aon:div>
			</c:if>
			<c:if test="#{contract.new}" >
				<aon:div styleClass="aon-scroll-area">		
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/formNewContent.xhtml" />
				</aon:div>
			</c:if>
			
		</aon:form>
		<ui:insert name="contractDetail" />
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
