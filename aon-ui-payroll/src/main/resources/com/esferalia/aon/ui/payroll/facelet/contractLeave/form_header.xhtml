	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

		</ui:include>
	</c:if>
	<c:if test="#{controller.treeOutcome}">

	<aon:outputText value="#{bundle.aon_name}" />
	<aon:outputText value="#{controller.contract.person.registry.fullName}" />
	
	<aon:outputLabel value="#{bundle.aon_document}" />
	<aon:outputText rendered="#{controller.contract.id==null}" value="&#160;" />
	<aon:div rendered="#{controller.contract.id!=null}">
		<aon:outputText value="#{controller.contract.person.registry.documentType}" />
		<aon:outputText value="#{controller.contract.person.registry.document}" style="margin-left: 3px;"/>
		<aon:outputText value="#{bundle.aon_document_country}" styleClass="aon-italic aon-margin-left"/>
		<aon:outputText value="#{controller.contract.person.registry.documentCountry}" styleClass="aon-margin-left"/>
	</aon:div>
	
	<aon:outputText value="#{bundle.aon_period}"/>
	<aon:outputText rendered="#{controller.contract.id==null}" value="&#160;" />
	<aon:div rendered="#{controller.contract.id!=null}">
		<aon:outputLabel styleClass="aon-italic aon-margin-right aon-margin-left"
			value="#{bundle.aon_start_date}:" />
		<aon:outputText value="#{controller.contract.startDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<aon:outputLabel styleClass="aon-italic aon-margin-right aon-margin-left"
			rendered="#{controller.contract.endDate!=null}"
			value="#{bundle.aon_end_date}:" />
		<aon:outputText value="#{controller.contract.endDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:div>
			
	<aon:outputText value="#{bundle.payroll_salary_ss_number}" />
	<aon:outputText value="#{controller.contract.person.socialSecurityNumber}" />
	
	<aon:outputText value="#{bundle.aon_company}" />
	<aon:outputText value="#{controller.contract.workPlace.enterprise.registry.fullName}" />
	
	<aon:outputText value="#{bundle.payroll_workplace}" />
	<aon:outputText value="#{controller.contract.workPlace.description}" />
	
	<aon:outputText value="#{bundle.aon_activity}" />
	<aon:div>
		<aon:outputText value="#{controller.contract.activity.description}" />
		<aon:outputText value=" - " rendered="#{controller.contract.id!=null}" />
		<aon:outputText value="(" rendered="#{controller.contract.id!=null}" />
		<aon:outputText value="#{controller.contract.activity.cnae2009.code}" />
		<aon:outputText value=") " rendered="#{controller.contract.id!=null}" />
		<aon:outputText value="#{controller.contract.activity.cnae2009.title}" />
	</aon:div>
	
	<aon:outputText value="#{bundle.company_enterprise_ccc}" />
	<aon:outputText value="#{controller.contract.enterpriseCCC.ccc}" />
	
</ui:composition>
