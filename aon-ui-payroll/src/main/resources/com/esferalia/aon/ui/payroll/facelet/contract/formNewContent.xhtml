<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components" >
	
	<aon:div id="contract_new_panel">

		<aon:panelGrid columns="2" style="width: 80%;" >
			
			<ui:decorate template="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{contract.to.person}" />
<!--  
				<ui:param name="skipNewButton" value="#{true}" />
-->				
				<ui:param name="idRequired" value="#{true}" />
				<ui:param name="lookupDisabled" value="#{false}" />
			</ui:decorate>
			
			<aon:outputLabel for="ssRegime"
				value="#{payrollBundle.payroll_contract_regime}" />
			<aon:selectOneMenu id="ssRegime" required="true"
				value="#{contract.to.regimeType}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{payrollCollections.ssRegimes}" />
			</aon:selectOneMenu>

			<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{contract.enterprise}" />
				<ui:param name="skipNewButton" value="#{true}" />
				<ui:param name="lookupReRender" value="workPlace,enterpriseActivities,enterpriseCCCs" />
				<ui:param name="idRequired" value="#{true}" />
				<aon:methodParam name="lookupChangeListener" 
					value="#{contract.onEnterpriseChanged}" type="lookupChangeListener" />
			</ui:include>
			
			<aon:outputLabel for="workPlace" styleClass="aon-italic aon-margin-left"
				style="font-size: 0.9em" value="#{companyBundle.company_workplace}" />
			<aon:selectOneMenu id="workPlace" required="true"
				disabled="#{contract.enterprise==null or contract.enterprise.id==null}"
				value="#{contract.to.workPlace}" >
				<f:selectItems value="#{contract.workPlaces}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel for="enterpriseActivities" value="#{companyBundle.company_activity}" 
				style="font-size: 0.9em" styleClass="aon-italic aon-margin-left"/>
			<aon:selectOneMenu id="enterpriseActivities"
				disabled="#{contract.enterprise==null or contract.enterprise.id==null}"
				value="#{contract.to.activity}" >
				<f:selectItems value="#{contract.activities}" />
				<a4j:support event="onchange" actionListener="#{contract.onActivityChanged}" ajaxSingle="true" reRender="enterpriseCCCs"/>
			</aon:selectOneMenu>

			<aon:outputLabel for="enterpriseCCCs" value="#{companyBundle.company_enterprise_ccc}"
				style="font-size: 0.9em" styleClass="aon-italic aon-margin-left"/>
			<aon:selectOneMenu id="enterpriseCCCs"
				disabled="#{contract.to.activity==null or contract.to.activity.id==null}"
				value="#{contract.to.enterpriseCCC}" >
				<f:selectItems value="#{contract.enterpriseCCCs}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel value="#{payrollBundle.payroll_contract_period}"/>
			<aon:div>
				<aon:outputLabel for="startDate" styleClass="aon-italic aon-margin-right"
					value="#{bundle.aon_start_date}:" />
				<aon:selectInputDate id="startDate" 
					value="#{contract.to.startDate}" required="true"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
					<a4j:support event="oninputchange" reRender="seniorityDateContainer" ajaxSingle="true"/>
					<a4j:support event="onchanged" reRender="seniorityDateContainer" ajaxSingle="true"/>
				</aon:selectInputDate>
				<aon:outputLabel for="endDate" styleClass="aon-italic aon-margin-right"
					value="#{bundle.aon_end_date}:" />
				<aon:selectInputDate id="endDate" 
					value="#{contract.to.endDate}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
			</aon:div>
			
			<aon:outputLabel value="#{payrollBundle.payroll_salary_seniority_date}"
				style="font-size: 0.9em" styleClass="aon-italic aon-margin-left"/>
			<aon:panelGroup id="seniorityDateContainer">
				<aon:selectInputDate id="seniorityDate"
					value="#{contract.to.seniorityDate}" required="true"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
					<a4j:support event="oninputchange" reRender="seniorityDateContainer" ajaxSingle="true"/>
					<a4j:support event="onchanged" reRender="seniorityDateContainer" ajaxSingle="true"/>
				</aon:selectInputDate>
				<aon:outputText value="&#160;&#160;&#160;&#160;&#160;"
					styleClass="aon-icon-info"
					rendered="#{contract.to.seniorityDateDifferent}" />
			</aon:panelGroup>

			<aon:outputLabel for="Contract_contractDuration" value="#{payrollBundle.payroll_contract_contract_type}" />
			<aon:selectOneRadio id="Contract_contractDuration" value="#{contract.contractDuration}">
				<f:selectItems value="#{payrollCollections.contractDurations}" />
			</aon:selectOneRadio>
			
			<aon:outputLabel for="Contract_contractWorkingDay" value="#{payrollBundle.payroll_contract_work_time}" />
			<aon:selectOneRadio id="Contract_contractWorkingDay" value="#{contract.contractWorkingDay}">
				<f:selectItems value="#{payrollCollections.contractWorkingDays}" />
			</aon:selectOneRadio>

			<aon:outputLabel for="Contract_tc2Code"
				value="#{payrollBundle.payroll_contract_contract_code}" />
			<aon:selectOneMenu id="Contract_tc2Code" required="true"
				value="#{contract.tc2Code}">
				<f:selectItems value="#{payrollCollections.tc2List}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="registration" value="#{payrollBundle.payroll_salary_registration}" />

			</aon:inputText>
