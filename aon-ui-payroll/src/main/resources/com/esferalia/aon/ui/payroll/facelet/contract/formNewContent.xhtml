<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components" >
	
	<aon:div id="contract_new_panel">

		<aon:panelGrid columns="2" style="width: 80%;" >
			
			<aon:outputLabel for="Enterprise_id"
				value="#{companyBundle.company_enterprise}" />
			<aon:div styleClass="aon-lookup" >
				<aon:lookupInputText id="Enterprise_id" 
					lookup="#{enterpriseLookup}" lookupChangeListener="#{contract.onEnterpriseChanged}"
					reRender="Enterprise_full_name,contract_new_panel"
					value="#{contract.enterprise.id}" size="5" />
				<aon:lookupButton 
					windowTitle="#{companyBundle.company_enterprise_selection}"
					selectReRender="Enterprise_id,Enterprise_full_name,contract_new_panel"
					lookup="#{enterpriseLookup}" lookupChangeListener="#{contract.onEnterpriseChanged}"
					minHeight="460" minWidth="650" actionType="search"
					property="#{contract.enterprise}">
				</aon:lookupButton>
				<aon:inputText id="Enterprise_full_name" 
					value="#{(contract.enterprise.registry.fullName!=null)?(contract.enterprise.registry.fullName):('')}"
					size="50" disabled="true" />							
			</aon:div>
			
			<aon:outputLabel for="workPlace"
				styleClass="aon-italic aon-margin-left"
				value="#{companyBundle.company_workplace}" />
			<aon:selectOneMenu id="workPlace"
				disabled="#{contract.enterprise==null or contract.enterprise.id==null}"
				value="#{contract.to.workPlace}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{contract.workPlaces}" />
				<a4j:support event="onchange" reRender="contract_new_panel" >
					<aon:actionListener method="#{contract.onWorkPlaceChanged}" />
				</a4j:support>
			</aon:selectOneMenu>
			
			<aon:outputText value="#{companyBundle.company_enterprise_ccc}" style="font-size: 0.9em" styleClass="aon-italic aon-margin-left"/>
			<aon:selectOneMenu id="enterpriseCCCs"
				disabled="#{contract.enterprise==null or contract.enterprise.id==null}"
				value="#{contract.to.enterpriseCCC}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{contract.enterpriseCCCs}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel for="Person_id"
				value="#{registryBundle.registry_person}" />
			<aon:div styleClass="aon-lookup">
				<aon:lookupInputText id="Person_id" lookup="#{personLookup}"
					reRender="Person_full_name"
					value="#{contract.to.person.id}" size="5" />
				<aon:lookupButton 
					windowTitle="#{registryBundle.registry_person_selection}"
					selectReRender="Person_id,Person_full_name" actionType="search"
					lookup="#{personLookup}" minHeight="460" minWidth="650"
					property="#{contract.to.person}">
				</aon:lookupButton>
				<aon:inputText id="Person_full_name"
					value="#{(contract.to.person.registry.fullName!=null)?(contract.to.person.registry.fullName):('')}"
					size="50" disabled="true" />							
			</aon:div>
			
			<aon:outputText value="#{payrollBundle.employee_contract_autonomous}" />
			<aon:selectBooleanCheckbox disabled="true" 
				value="#{contract.autonomous}" />
			
			<aon:outputLabel 
				value="#{payrollBundle.employee_contract_period}" />
			<aon:div>
				<aon:outputLabel for="startDate" styleClass="aon-italic aon-margin-right"
					value="#{bundle.aon_start_date}:" />
				<aon:selectInputDate id="startDate" 
					value="#{contract.to.startDate}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<aon:outputLabel for="endDate" styleClass="aon-italic aon-margin-right"
					value="#{bundle.aon_end_date}:" />
				<aon:selectInputDate id="endDate" 
					value="#{contract.to.endDate}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
			</aon:div>
			
				
				
			<aon:outputLabel for="contractOption"
				value="#{payrollBundle.employee_contract_contract_option}" />
			<aon:selectOneMenu id="contractOption"
				value="#{contract.contractOption}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{employeeCollections.contractOptions}" />
				<a4j:support event="onchange" reRender="contractType, contractCode" />
			</aon:selectOneMenu>

			<aon:outputLabel for="contractType"
				styleClass="aon-italic aon-margin-left"
				value="#{payrollBundle.employee_contract_contract_type}" />
			<aon:selectOneMenu id="contractType"
				disabled="#{contract.contractOption==null}"
				value="#{contract.contractType}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{contract.contractTypes}" />
				<a4j:support event="onchange" reRender="contractCode" />
			</aon:selectOneMenu>

			<aon:outputLabel for="contractCode"
				styleClass="aon-italic aon-margin-left"
				value="#{payrollBundle.employee_contract_work_time}" />
			<aon:selectOneMenu id="contractCode"
				disabled="#{contract.contractType.codes==null}"
				value="#{contract.contractData.code}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{contract.contractCodes}" />
				<a4j:support event="onchange" reRender="description" >
					<aon:actionListener method="#{contract.onChangeContractCode}" />
				</a4j:support>
			</aon:selectOneMenu>
			
			<aon:outputLabel for="description"
				value="#{bundle.aon_description}" />
			<aon:inputText id="description" size="64" maxlength="64"
				value="#{contract.contractData.description}" />
			
			<aon:outputLabel for="quote_group"
				value="#{payrollBundle.employee_contract_quote_group}" />
			<aon:selectOneMenu id="quote_group"
				value="#{contract.contractData.quoteGroup}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{employeeCollections.quoteGroups}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel for="category"
				value="#{payrollBundle.employee_contract_category}" />
			<aon:inputText id="category" size="40" maxlength="64"
				value="#{contract.contractData.category}" />
				
			<aon:outputLabel for="irpf"
				value="#{payrollBundle.employee_contract_irpf_percent}" />
			<aon:inputText id="irpf" size="10" 
				value="#{contract.irpf}" >
				<f:validateDoubleRange />
			</aon:inputText>
			
			<aon:outputLabel
				value="#{payrollBundle.employee_file_attach}" />
			<aon:panelGrid columns="2" style="width:100%;"
				columnClasses="
				aon-panelGrid-even aon-noborder aon-width-100,
				aon-panelGrid-even aon-noborder aon-width-auto" >
				
				<aon:fileUpload 
					addControlLabel="#{bundle.aon_fileUpload_add}"
					stopControlLabel="#{bundle.aon_fileUpload_stop}"
					stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
					uploadControlLabel="#{bundle.aon_fileUpload_upload}"
					fileUploadListener="#{contract.fileUploaded}"
					immediateUpload="true" autoclear="true"
					listWidth="0px" listHeight="0px">
					<f:facet name="label">
						<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
					</f:facet>
					<a4j:support event="onuploadcomplete" reRender="contract_new_panel" >
						<aon:actionListener method="#{contract.onFileUploaded}" />
					</a4j:support>
				</aon:fileUpload>
				
				<aon:outputText value="#{contract.aonFile.fileName}"
					rendered="#{contract.aonFile.size > 0}" />
			</aon:panelGrid>
			
			<aon:outputLabel for="Contract_conditions"
				value="#{payrollBundle.employee_contract_conditions}" />
			<aon:inputTextarea id="Contract_conditions"
				value="#{contract.contractData.conditions}" cols="60" rows="5">
				<f:validateLength maximum="64" />
			</aon:inputTextarea>
			
		</aon:panelGrid>
		
	</aon:div>
	
</ui:composition>
