<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
					
	<aon:div id="economicGrid">

		<aon:panelGrid columns="2" width="100%">

			<aon:outputLabel for="irpfData_annualRemuneration"
				value="#{payrollBundle.payroll_irpfData_annualRemuneration}" />
			<aon:inputText id="irpfData_annualRemuneration" 
				value="#{irpfData.to.annualRemuneration}" maxlength="18" size="25">
				<f:validateDoubleRange />
			</aon:inputText>

			<aon:outputLabel for="irpfData_irregular18_2Reduction"
				value="#{payrollBundle.payroll_irpfData_irregular18_2Reduction}" />
			<aon:inputText id="irpfData_irregular18_2Reduction" 
				value="#{irpfData.to.irregular18_2Reduction}" maxlength="18" size="25">
				<f:validateDoubleRange />
			</aon:inputText>

			<aon:outputLabel for="irpfData_irregular18_3Reduction"
				value="#{payrollBundle.payroll_irpfData_irregular18_3Reduction}" />
			<aon:inputText id="irpfData_irregular18_3Reduction" 
				value="#{irpfData.to.irregular18_3Reduction}" maxlength="18" size="25">
				<f:validateDoubleRange />
			</aon:inputText>

			<aon:outputLabel for="irpfData_deducciblesExpenses"
				value="#{payrollBundle.payroll_irpfData_deducciblesExpenses}" />
			<aon:inputText id="irpfData_deducciblesExpenses" 
				value="#{irpfData.to.deducciblesExpenses}" maxlength="18" size="25">
				<f:validateDoubleRange />
			</aon:inputText>

<!--  
			<aon:outputLabel for="irpfData_ceuta_melilla_data"
				value="#{payrollBundle.payroll_irpfData_ceuta_melilla_data}" />
			<aon:inputText id="irpfData_ceuta_melilla_data" 
				value="#{irpfData.to.annualRemuneration}" maxlength="18" size="25">
				<f:validateDoubleRange />
			</aon:inputText>
-->

			<aon:outputLabel for="irpfData_spousalSupport"
				value="#{payrollBundle.payroll_irpfData_spousalSupport}" />
			<aon:inputText id="irpfData_spousalSupport" 
				value="#{irpfData.to.spousalSupport}" maxlength="18" size="25">
				<f:validateDoubleRange />
			</aon:inputText>

			<aon:outputLabel for="irpfData_foodAnnuity"
				value="#{payrollBundle.payroll_irpfData_foodAnnuity}" />
			<aon:inputText id="irpfData_foodAnnuity" 
				value="#{irpfData.to.foodAnnuity}" maxlength="18" size="25">
				<f:validateDoubleRange />
			</aon:inputText>

		</aon:panelGrid>

		<br />
		
		<aon:panel>
			<f:facet name="header">
				<aon:outputText value="#{payrollBundle.payroll_irpfData_deductHomeLoan}" />
			</f:facet>
			<aon:selectOneRadio id="irpfData_deductHomeLoan" layout="pageDirection" 
				value="#{irpfData.to.deductHomeLoan}" >
				<f:selectItem itemLabel="#{payrollBundle.payroll_irpfData_deductHomeLoan_check1}" itemValue="#{irpfData.deductHomeLoanAfter}"  />
				<f:selectItem itemLabel="#{payrollBundle.payroll_irpfData_deductHomeLoan_check2}" itemValue="#{irpfData.deductHomeLoanBefore}"  />
			</aon:selectOneRadio>
		</aon:panel>
		
	</aon:div>

</ui:composition>
