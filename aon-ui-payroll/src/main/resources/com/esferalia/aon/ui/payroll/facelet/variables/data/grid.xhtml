<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:div id="#{controller.beanName}VarContainer"  
		rendered="#{controller.handler.variablesModel!=null}">

		<c:if test="#{showVariableFilter}" >
			<aon:div styleClass="aon-panelGrid-search" 
				style="width: 100%; margin-bottom:10px; padding:10px 0 10px 10px; ">
				<aon:panelGrid columns="3" 
					columnClasses="aon-panelGrid-odd aon-width-100
								,aon-panelGrid-even aon-width-auto
								,aon-panelGrid-even aon-width-auto">
					
					<aon:outputText value="#{payrollBundle.payroll_data_filter}" styleClass="aon-bold" />
					
					<aon:selectOneRadio value="#{controller.handler.searchCurrentVariables}" style="display:inline;">
						<f:selectItem itemLabel="#{payrollBundle.payroll_current}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{payrollBundle.payroll_historyc}" itemValue="#{false}" />
						<a4j:support event="onclick" reRender="#{controller.beanName}VarContainer" ignoreDupResponses="true" >
							<aon:actionListener method="#{controller.handler.reloadData}" />
						</a4j:support>
					</aon:selectOneRadio>
					
					<aon:panelGroup >
						<aon:outputLabel styleClass="aon-italic aon-margin-left aon-margin-right"
							value="#{bundle.aon_end_date}:" />
						<aon:selectOneMenu 
							styleClass="aon-margin-right"
							disabled="#{controller.handler.searchCurrentVariables}"
							value="#{controller.handler.inactiveLastPeriod}" >
							<f:selectItems value="#{payrollCollections.inactiveLastPeriods}" />
							<a4j:support event="onchange" reRender="#{controller.beanName}VarContainer" ignoreDupResponses="true" >
								<aon:actionListener method="#{controller.handler.onChangeLastPeriod}" />
								<aon:actionListener method="#{controller.handler.reloadData}" />
							</a4j:support>
						</aon:selectOneMenu>
						<aon:selectInputDate  
							disabled="#{!(!controller.handler.searchCurrentVariables and controller.handler.inactiveLastPeriod=='MANUAL')}"
							value="#{controller.handler.inactiveDate}"
							inputSize="10" renderAsPopup="true" enableManualInput="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="onchanged" reRender="#{controller.beanName}VarContainer" ignoreDupResponses="true">
								<aon:actionListener method="#{controller.handler.reloadData}" />
							</a4j:support>
						</aon:selectInputDate>
						<aon:selectOneMenu 
							styleClass="aon-margin-right"
							disabled="#{controller.handler.searchCurrentVariables}"
							value="#{controller.handler.variableFilter}" >
							<f:selectItem itemLabel=" - " value="#{null}" />
							<f:selectItems value="#{controller.handler.variablesFilterList}" />
							<a4j:support event="onchange" reRender="#{controller.beanName}VarContainer" ignoreDupResponses="true" >
								<aon:actionListener method="#{controller.handler.reloadData}" />
							</a4j:support>
						</aon:selectOneMenu>
					</aon:panelGroup>
				
				</aon:panelGrid>
				
			</aon:div>	
		</c:if>
	
		<aon:panelGrid columns="1" style="width: 100%; margin-top:10px;"
			columnClasses="aon-panelGrid-even  aon-width-auto">
			<aon:div>
				<aon:outputText value="&#160;" style="padding-left:15px;" styleClass="aon-icon-search"/>
				<aon:outputText value="#{payrollBundle.payroll_contract_variables}" 
					styleClass="aon-bold"/>
			</aon:div>
		</aon:panelGrid>	
		
		<aon:editDataTable id="#{controller.beanName}VariablesList"
			value="#{controller.handler.variablesModel}" var="to" rows="20" >
			
			<aon:rowSelector toggleOnClick="#{controller.handler.data == null}"
				actionListener="#{controller.handler.onSelectVariable}" reRender="#{controller.beanName}VarContainer"/>
			
			<aon:column 
				styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;&#160;"
					title="#{bundle.aon_update}" 
					rendered="#{to.id!=null}"
					styleClass="aon-editDataTable-button aon-icon-rowSelector" />
				<aon:outputText value="&#160;&#160;"
					title="#{payrollBundle.payroll_overwrite}" 
					rendered="#{to.id==null}"
					styleClass="aon-editDataTable-button aon-icon-go" />
				<f:facet name="footer">
					<aon:commandButton
						id="#{controller.beanName}-reset" 
						rendered="#{!controller.handler.new}"
						title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						actionListener="#{controller.handler.onResetVariable}"
						reRender="#{controller.beanName}VarContainer"
						styleClass="aon-editDataTable-button aon-icon-reset"
						accesskey="#{bundle.aon_key_new_line}"/>
				</f:facet>
			</aon:column>
			
			<ui:include 
				src="/com/esferalia/aon/ui/payroll/facelet/variables/data/grid_content.xhtml" >
				<ui:param name="controller" value="#{controller}" />
				<aon:valueParam name="formList" value="#{to!=controller.handler.data}" />
				<aon:valueParam name="formEdit" value="#{to==controller.handler.data}" />
				<aon:valueParam name="formNew" value="#{to==null and controller.handler.new}" />
			</ui:include>
			
			<aon:column styleClass="aon-editDataTable-buttonsColumn aon-vertical-align-top">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div rendered="#{to!=controller.handler.data}" layout="none">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:div rendered="#{to==controller.handler.data}">			
					<aon:commandButton id="paymentVarSave"
						title="#{bundle.aon_save} (#{bundle.aon_key_save_line_accelerator})"
						reRender="#{container}"
						actionListener="#{controller.handler.onSaveVariable}"
						styleClass="aon-editDataTable-button aon-icon-accept" />
					<aon:commandButton id="paymentVarCancel"
						title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
						reRender="#{container}"
						actionListener="#{controller.handler.onCancelVariable}"
						immediate="true"
						styleClass="aon-editDataTable-button aon-icon-cancel" />
					<aon:commandButton id="paymentVarRemove"
						title="#{bundle.aon_remove} (#{bundle.aon_key_remove_line_accelerator})"
						rendered="#{controller.handler.data.id!=null}"
						reRender="#{container}"
						actionListener="#{controller.handler.onRemoveVariable}"
						styleClass="aon-editDataTable-button aon-icon-delete"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;" />
				</aon:div>
				<f:facet name="footer">
					<aon:div >			
						<aon:commandButton id="paymentVarSave-New"
							title="#{bundle.aon_save} (#{bundle.aon_key_save_line_accelerator})"
							rendered="#{to==null and controller.handler.new}"
							reRender="#{container}"
							actionListener="#{controller.handler.onSaveVariable}"
							styleClass="aon-editDataTable-button aon-icon-accept" />
						<aon:commandButton id="paymentVarCancel-New"
							title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
							rendered="#{to==null and controller.handler.new}"
							reRender="#{container}"
							actionListener="#{controller.handler.onCancelVariable}"
							immediate="true"
							styleClass="aon-editDataTable-button aon-icon-cancel" />
					</aon:div>
					<!--  
					<aon:div>
						<ui:insert name="beforeNewLineButtons"/>

						<aon:outputText rendered="#{!formNew}" value="&#160;" />
						<c:if test="#{!skipSaveButton}">		
							<aon:commandButton
								id="#{dataTableId}-new-save" title="#{bundle.aon_save} (#{bundle.aon_key_save_line_accelerator})"
								action="#{newSaveAction}" actionListener="#{newSaveActionListener}"
								rendered="#{newSaveButtonRendered}"
								reRender="#{dataTableId}Div#{(newSaveButtonReRender != null)?',':''}#{newSaveButtonReRender}"
								styleClass="aon-editDataTable-button aon-icon-accept"
								accesskey="#{bundle.aon_key_save_line}" />
						</c:if>
						<c:if test="#{!skipCancelButton}">
							<aon:confirmButton
								id="#{dataTableId}-new-cancel" title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
								rendered="#{formNew}" reRender="#{newCancelButtonReRender}"
								immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}"
								confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{cancelEditActionListener}"
								confirmAction="#{cancelEditAction}"					
								styleClass="aon-editDataTable-button aon-icon-cancel"
								accesskey="#{bundle.aon_key_cancel_line}" />
						</c:if>
					</aon:div>
					-->
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
		<aon:dataScroller2 for="#{controller.beanName}VariablesList" showNote="false" />
		
		<c:if test="#{controller.handler.undefinedVariablesModel!=null}" >
			<ui:include 
				src="/com/esferalia/aon/ui/payroll/facelet/variables/data/grid_undefined.xhtml" >
				<ui:param name="controller" value="#{controller}" />
				<aon:valueParam name="formList" value="true" />
				<aon:valueParam name="saveReRender" value="#{controller.beanName}VarContainer" />
			</ui:include>
		</c:if>
		
	</aon:div>

</ui:composition>
