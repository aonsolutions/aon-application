<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:div id="#{controller.beanName}VarContainer"  
		rendered="#{controller.handler.variablesModel!=null}">

		<c:if test="#{showVariableFilter}" >
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/variables/data/grid_filter.xhtml" >
				<ui:param name="controller" value="#{controller.handler}" />
			</ui:include>
		</c:if>
		
		<aon:editDataTable id="#{controller.beanName}VariablesList"
			value="#{controller.handler.variablesModel}" var="to" rows="20" >
			
			<aon:rowSelector toggleOnClick="#{controller.handler.data == null and controller.handler.editableSelectedTo}"
				actionListener="#{controller.handler.onSelectVariable}" reRender="#{controller.beanName}VarContainer"/>
			
			<aon:column styleClass="aon-editDataTable-iconColumn">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<c:if test="#{controller.handler.editableSelectedTo}" >
					<aon:outputText value="&#160;&#160;"
						title="#{bundle.aon_update}" 
						rendered="#{to.id!=null}"
						styleClass="aon-editDataTable-button aon-icon-rowSelector" />
					<aon:outputText value="&#160;&#160;"
						title="#{bundle.payroll_overwrite}" 
						rendered="#{to.id==null}"
						styleClass="aon-editDataTable-button aon-icon-go" />
				</c:if>
				<f:facet name="footer">
					<aon:commandButton
						id="#{controller.beanName}-reset" 
						rendered="#{!controller.handler.nevv}"
						title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						actionListener="#{controller.handler.onResetVariable}"
						reRender="#{controller.beanName}VarContainer"
						styleClass="aon-editDataTable-button aon-icon-reset"
						accesskey="#{bundle.aon_key_new_line}"/>
				</f:facet>
			</aon:column>
			
			<ui:include 
				src="/com/esferalia/aon/ui/payroll/facelet/variables/data/grid_content.xhtml" >
				<ui:param name="controller" value="#{controller}" />
				<aon:valueParam name="formList" value="#{to!=controller.handler.data}" />
				<aon:valueParam name="formEdit" value="#{to==controller.handler.data}" />
				<aon:valueParam name="formNew" value="#{to==null and controller.handler.nevv}" />
				<aon:valueParam name="container" value="#{controller.beanName}VarContainer" />
				
			</ui:include>
			
			<aon:column styleClass="aon-editDataTable-buttonsColumn">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div rendered="#{to!=controller.handler.data}" layout="none">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:div rendered="#{to==controller.handler.data}">			
					<aon:commandButton id="paymentVarSave"
						title="#{bundle.aon_save} (#{bundle.aon_key_save_line_accelerator})"
						reRender="#{controller.beanName}VarContainer, #{container}"
						actionListener="#{controller.handler.onSaveVariable}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton id="paymentVarCancel"
						title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
						reRender="#{controller.beanName}VarContainer, #{container}"
						actionListener="#{controller.handler.onCancelVariable}"
						immediate="true"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:commandButton id="paymentVarRemove"
						title="#{bundle.aon_remove} (#{bundle.aon_key_remove_line_accelerator})"
						rendered="#{controller.handler.data.id!=null}"
						reRender="#{controller.beanName}VarContainer, #{container}"
						actionListener="#{controller.handler.onRemoveVariable}"
						styleClass="aon-editDataTable-button aon-icon-delete"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
							accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div >			
						<aon:commandButton id="paymentVarSave-New"
							title="#{bundle.aon_save} (#{bundle.aon_key_save_line_accelerator})"
							rendered="#{to==null and controller.handler.nevv}"
							reRender="#{controller.beanName}VarContainer, #{container}"
							actionListener="#{controller.handler.onSaveVariable}"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:commandButton id="paymentVarCancel-New"
							title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
							rendered="#{to==null and controller.handler.nevv}"
							reRender="#{controller.beanName}VarContainer, #{container}"
							actionListener="#{controller.handler.onCancelVariable}"
							immediate="true"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
		<aon:dataScroller for="#{controller.beanName}VariablesList" showNote="false" />
		
		<c:if test="#{controller.handler.undefinedVariablesModel.rowCount>0}" >
			<ui:include 
				src="/com/esferalia/aon/ui/payroll/facelet/variables/data/grid_undefined.xhtml" >
				<ui:param name="controller" value="#{controller}" />
				<aon:valueParam name="formList" value="true" />
				<aon:valueParam name="saveReRender" value="#{controller.beanName}VarContainer" />
			</ui:include>
		</c:if>
		
	</aon:div>

</ui:composition>
