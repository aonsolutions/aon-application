<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<aon:panelGrid columns="2" dir="true" style="width: 100%;">
		<aon:outputLabel for="AgreementExtra_startDate_month" value="#{bundle.aon_start_date}" />
		<aon:div>
		<!--  
		-->
			<aon:inputText id="startDate"
				size="20" maxlength="32"
				value="#{to.startDate}" required="true" />
			<aon:selectOneMenu id="AgreementExtra_startDate_month" value="#{to.startDateMonth}">
				<f:selectItems value="#{commonCollections.months}"  />
			<!--  
				<a4j:support event="onchange" actionListener="#{controller.onChangeMonth}" reRender="salaryDraftForm" ajaxSingle="true"/>
			-->
			</aon:selectOneMenu>
			<aon:outputText styleClass="aon-italic " value="#{payrollBundle.payroll_previuos_year}" />
			<aon:selectBooleanCheckbox value="#{to.startDatePrevious}" />
		</aon:div>
		
		<aon:outputLabel for="AgreementExtra_endDate_month" value="#{bundle.aon_end_date}" />
		<aon:div>
		<!--  
		-->
			<aon:inputText id="endDate"
				size="20" maxlength="32"
				value="#{to.endDate}" required="true" />
			<aon:selectOneMenu id="AgreementExtra_endDate_month" value="#{to.endDateMonth}">
				<f:selectItems value="#{commonCollections.months}"  />
			<!--  
				<a4j:support event="onchange" actionListener="#{controller.onChangeMonth}" reRender="salaryDraftForm" ajaxSingle="true"/>
			-->
			</aon:selectOneMenu>
			<aon:outputText styleClass="aon-italic " value="#{payrollBundle.payroll_previuos_year}" />
			<aon:selectBooleanCheckbox value="#{to.endDatePrevious}" />
		</aon:div>
		
		<aon:outputLabel for="issueDate" value="#{payrollBundle.payroll_salary_issue_date}" />
		<aon:inputText id="issueDate"
			size="20" maxlength="32"
			value="#{to.issueDate}" required="true" />
			
	</aon:panelGrid>
	
</ui:composition>
