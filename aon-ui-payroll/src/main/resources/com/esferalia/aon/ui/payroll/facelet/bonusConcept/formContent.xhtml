<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGrid id="dataTable" columns="2">

		<aon:outputLabel for="BonusConcept_id" value="#{bundle.aon_id}" />
		<aon:outputText id="BonusConcept_id" size="5" maxlength="5"
			value="#{bonusConcept.to.id}" />

		<aon:outputLabel for="BonusConcept_type" value="#{bundle.aon_type}" />
		<aon:selectOneMenu id="BonusConcept_type"
			value="#{bonusConcept.to.type}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{payrollCollections.bonusTypes}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="BonusConcept_description"
			value="#{bundle.aon_description}" />
		<aon:inputTextarea id="BonusConcept_description" cols="60" rows="5"
			maxlength="256" value="#{bonusConcept.to.description}">
			<f:validateLength maximum="256" />
		</aon:inputTextarea>

		<aon:outputLabel for="BonusConcept_expression"
			value="#{payrollBundle.payroll_salary_expression}" />

		<ui:include
			src="/com/esferalia/aon/ui/payroll/facelet/expression/formExpression.xhtml">
			<ui:param name="expression" value="expression" />
			<ui:param name="expressionValid" value="expressionValid" />
			<ui:param name="expressionErrorMessage"
				value="expressionErrorMessage" />
			<ui:param name="controller" value="#{bonusConcept}" />
		</ui:include>
		<!--  aon:inputTextarea id="BonusConcept_expression" cols="60" rows="10" maxlength="512"
						value="#{bonusConcept.to.expression}">
						<f:validateLength maximum="512"/>
					</aon:inputTextarea-->

	</aon:panelGrid>


</ui:composition>
