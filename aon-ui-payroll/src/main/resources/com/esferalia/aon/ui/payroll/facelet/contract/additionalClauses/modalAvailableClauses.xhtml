<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showAvailableClauses">
		<c:if test="#{contractClause.showAvailableClauses}">
			<rich:modalPanel id="showAvailableClausesModalPanel" minHeight="300"
				minWidth="725" showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.payroll_contract_additional_clauses}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showAvailableClauses" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{contractClause.showAvailableClauses}" value="#{false}" />
							<aon:actionHotKey key="esc" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="showAvailableClausesModalForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									
									<aon:div id="showAvailableClausesModalContent" style="width:710px;">
		
										<aon:dataTable value="#{contractClause.availableClausesModel}" var="to" >
											<aon:rowSelector actionListener="#{contractClause.onSaveSelectedClause}"/>
											<aon:column>
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_name}" />
												</f:facet>
												<aon:outputText value="#{to.name}" />
											</aon:column>
											<aon:column>
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_description}" />
												</f:facet>
												<aon:div>
													<aon:outputText value="#{to.description}" >
														<aon:abbreviateConverter maxWidth="80" />
													</aon:outputText>
													<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
														<aon:outputText value="#{to.description}" />
													</rich:toolTip>
												</aon:div>
											</aon:column>			
										</aon:dataTable>
										
									</aon:div>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>
</ui:composition>
