<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<ui:decorate template="/com/code/aon/faces/attachment/grid.xhtml">
		<ui:param name="controller" value="#{contractAttach}" />

		<ui:define name="beginFormListContent" >
			<aon:div rendered="#{to.pdfType}" 
				onmouseover="disableRowSelector();"
				onmouseout="enableRowSelector();"
				onmouseup="disableRowSelector();">
				<aon:selectBooleanCheckbox id="Included_Row_checked"
					value="#{controller.rowChecked}"
					valueChangeListener="#{controller.rowSelected}" >
					<a4j:support event="onclick" 
						ajaxSingle="true"
						ignoreDumpResponses="true"
						limitToList="true"
						eventsQueue="attachList"
						reRender="#{checkReRender}" />
				</aon:selectBooleanCheckbox>
			</aon:div>
		</ui:define>
		
		<ui:define name="additionalColumns" >
			<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.attachmentType"
				styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel for="#{controller.beanName}_attachmentType"
						value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.attachmentType}" rendered="#{formList}" />
				<aon:selectOneMenu id="#{controller.beanName}_attachmentType" rendered="#{formEdit}"
					value="#{controller.to.attachmentType}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{payrollCollections.contractAttachTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="#{controller.beanName}_attachmentType-New" rendered="#{formNew}"
						value="#{controller.to.attachmentType}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{payrollCollections.contractAttachTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
			<c:if test="#{aonRole.confidentiality}">
				<aon:column styleClass="aon-editDataTable-iconColumn aon-width-40">
					<f:facet name="header">
						<aon:outputText value="&#160;" title="#{bundle.aon_confidential}"
							styleClass="aon-icon-confidential" style="padding-left:15px" />
					</f:facet>
					<aon:outputText value="&#160;"
						rendered="#{formList}"
						styleClass="#{to.confidential?'aon-icon-checked':'aon-icon-check'}" 
						style="padding-left:20px" />
					<aon:selectBooleanCheckbox id="#{controller.beanName}_securityLevel"
						value="#{controller.to.confidential}" rendered="#{formEdit}" />
					<f:facet name="footer">
						<aon:selectBooleanCheckbox id="#{controller.beanName}_securityLevel-New"
							value="#{controller.to.confidential}" rendered="#{formNew}" />
					</f:facet>
				</aon:column>
			</c:if>		
			<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.attachDate"
				styleClass="aon-editDataTable-dateColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="#{controller.beanName}_scope"
						value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.attachDate}" rendered="#{formList}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="#{controller.beanName}_attachDate"
					popupDateFormat="#{bundle.aon_date_pattern}"
					rendered="#{formEdit}" value="#{controller.to.attachDate}" />
				<f:facet name="footer">
					<aon:selectInputDate id="#{controller.beanName}_attachDate-New"
						popupDateFormat="#{bundle.aon_date_pattern}"
						rendered="#{formNew}" value="#{controller.to.attachDate}" />
				</f:facet>
			</aon:column>		
			<c:if test="#{!skipScopeColumn}"> 
				<aon:column sortable="#{sortColumns}" alias="#{controller.pojoShortName}.scope.description"
					styleClass="aon-editDataTable-textColumn aon-width-120">
					<f:facet name="header">
						<aon:outputLabel for="#{controller.beanName}_scope"
							value="#{bundle.aon_scope}" />
					</f:facet>
					<aon:outputText value="#{to.scope.description}" rendered="#{formList}" />
					<aon:selectOneMenu id="#{controller.beanName}_scope" rendered="#{formEdit}"
						value="#{controller.to.scope}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu id="#{controller.beanName}_scope-New" rendered="#{formNew}"
							value="#{controller.to.scope}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{configCollections.currentUserScopes}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
			</c:if>
		</ui:define>
		<ui:define name="additionalDataTableContent" >
			<aon:div styleClass="aon-margin-top" >
				<aon:outputText style="#{documentManager.freeSpaceStyle}"
					value="#{documentManager.freeSpaceMessage}" />
			</aon:div>				
		</ui:define>
	</ui:decorate>
		
</ui:composition>
