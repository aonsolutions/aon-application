<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<aon:dataTable id="ContractEmbargoTable" var="to" value="#{controller.model}" rows="0">
		<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton id="ContractEmbargo-select"
				title="#{bundle.aon_update}" 
				actionListener="#{controller.onEdit}"
				reRender="embargoModalContainer"
				styleClass="aon-editDataTable-button aon-icon-rowSelector"/>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton
						id="ContractEmbargo-reset" 
						title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						actionListener="#{controller.onReset}"
						reRender="embargoModalContainer"
						styleClass="aon-editDataTable-button aon-icon-reset"
						accesskey="#{bundle.aon_key_new_line}"/>
				</aon:div>
			</f:facet>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-100 aon-nowrap">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.embargableType}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_start_date}" />
			</f:facet>
			<aon:outputText value="#{to.startDate}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_end_date}" />
			</f:facet>
			<aon:outputText value="#{to.endDate}"
				rendered="#{to.endDate!=null}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
			<aon:outputText value="#{controller.estimatedEndDate}"
				rendered="#{to.endDate==null}" styleClass="aon-italic" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
			<aon:outputText value="&#63;" style="color: red"
				rendered="#{to.endDate==null}" styleClass="aon-italic" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_amount}" />
			</f:facet>
			<aon:outputText value="#{to.amount}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText	value="#{payrollBundle.payroll_salary_embargos_solded}" />
			</f:facet>
			<aon:outputText value="#{controller.embargedAmount}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText	value="#{payrollBundle.payroll_salary_embargos_pending}" />
			</f:facet>
			<aon:outputText value="#{controller.pendingAmount}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_description}" />
			</f:facet>
			<aon:outputText value="#{to.description}"  />
		</aon:column>

	</aon:dataTable>
	
</ui:composition>
