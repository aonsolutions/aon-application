<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="irpfDraftSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<aon:methodParam name="backAction" value="salaryDraft_list" />
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_irpfDraft_module}" />
				<ui:param name="controller" value="#{irpfDraft}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{irpfDraft}" />
				<ui:define name="searchContent">

					<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{irpfDraftSearch.person}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>

					<c:if test="#{aonConfiguration.bean.irpfDraft.showEnterpriseInSearch}">
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{irpfDraftSearch.enterprise}" />
							<ui:param name="skipNewButton" value="#{true}" />
						</ui:include>
					</c:if>
					
				</ui:define>

			</ui:decorate>
		</aon:form>

		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		
	</ui:define>
</ui:composition>
