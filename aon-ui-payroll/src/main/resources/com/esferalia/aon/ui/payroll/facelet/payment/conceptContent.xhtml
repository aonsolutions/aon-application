<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<c:choose>
		<c:when test="#{overrideEnabled and editEnabled}">
			<aon:panelGrid id="#{conceptContentID}"
				columnClasses="aon-noborder aon-vertical-align-top, aon-panelGrid-even aon-noborder aon-vertical-align-top"
				columns="2">

				<ui:insert name="editor" />

				<aon:commandButton id="#{conceptContentID}-override-button"
					title="#{bundle.payroll_variable_manual_edit_cancel}"
					value="&#160;" ajaxSingle="true" rendered="#{inheritEnabled}"
					reRender="#{reRender}"
					actionListener="#{overrideActionListener}"
					styleClass="aon-icon-commandButton aon-icon-cancel" />

			</aon:panelGrid>
		</c:when>
		<c:otherwise>
			<aon:panelGrid id ="#{conceptContentID}"
				columnClasses="aon-noborder aon-vertical-align-top, aon-panelGrid-even aon-noborder aon-vertical-align-top"
				columns="2">

				<aon:outputText value="#{inheritValue}" />

				<aon:commandButton id="#{conceptContentID}-inherit-button"
					title="#{bundle.payroll_variable_manual_edit}"
					value="&#160;" ajaxSingle="true" rendered="#{editEnabled}"
					reRender="#{reRender}"
					actionListener="#{inheritActionListener}"
					styleClass="aon-icon-commandButton aon-icon-edit" />

			</aon:panelGrid>
		</c:otherwise>
	</c:choose>






</ui:composition>
