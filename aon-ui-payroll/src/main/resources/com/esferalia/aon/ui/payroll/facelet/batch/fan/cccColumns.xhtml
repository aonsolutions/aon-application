<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:if test="#{showEnterpriseColumn}">
		<aon:column alias="FanBatchDetail.ccc.activity.enterprise.registry.name"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_company}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.ccc.activity.enterprise.registry.fullName}"/>
			</aon:div>
		</aon:column>
	</aon:if>
	
	<aon:column alias="FanBatchDetail.ccc.ccc"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.company_enterprise_ccc}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{to.ccc.fullCcc}"/>
			<aon:outputText value="&#160;("/>
			<aon:outputText value="#{to.ccc.activity.type}"/>
			<aon:outputText value=")"/>
		</aon:div>
	</aon:column>
	
	<aon:column alias="FanBatchDetail.ccc.type"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_type}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{to.ccc.type}"/>
		</aon:div>
	</aon:column>

	<aon:column alias="FanBatchDetail.ccc.activity.description"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_activity}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{to.ccc.activity.description}"/>
		</aon:div>
	</aon:column>

	<aon:column alias="FanBatchDetail.geozone"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_state}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{to.ccc.geozone.name}"/>
		</aon:div>
	</aon:column>

</ui:composition>
