<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
						
	<aon:panelTab id="quote" label="Bases y tipos de cotización"
		actionListener="#{quoteValues.onInitialize}">
		<aon:div styleClass="aon-panelGrid-search aon-margin-bottom">
			<aon:div styleClass="aon-panelGrid-search-info">
				<aon:outputText value="#{bundle.aon_filter}" styleClass="aon-panelGrid-search-info-internal"/>
			</aon:div>
			<aon:panelGrid columns="4">
				<aon:selectOneMenu value="#{quoteValues.regimeType}" >  
					<f:selectItem itemLabel="Régimen General de la Seguridad Social" itemValue="GENERAL" />
				    <f:selectItem itemLabel="Sistema Especial para Trabajadores por Cuenta Ajena Agrarios" itemValue="AGRICULTURAL" />
				    <f:selectItem itemLabel="Sistema Especial para Empleados de Hogar" itemValue="HOME_EMPLOYEE" />
				    <a4j:support  event="onchange" 
						actionListener="#{quoteValues.onReloadModel}"
						reRender="quoteValuesContainer" />
				</aon:selectOneMenu>
				<aon:outputText value="&#160;" />
				<aon:outputText value="#{bundle.aon_year}" />
				<rich:inputNumberSpinner value="#{quoteValues.year}"
	   				inputSize="4" minValue="2000" maxValue="2021">
					<a4j:support 
						event="onchange"
						actionListener="#{quoteValues.onReloadModel}"
						reRender="quoteValuesContainer"
						eventsQueue="quoteValuesFilterKeyUp"
						requestDelay="500"
						ajaxSingle="true"
						ignoreDupResponses="true"
						limitToList="true"/>
	   			</rich:inputNumberSpinner>
			</aon:panelGrid>	
		</aon:div>
		

		<aon:div id="quoteValuesContainer">
			<c:if test="#{quoteValues.regimeType=='GENERAL'}">
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/codeTables/regimeBasesTypes/form_general.xhtml" />
			</c:if>
			<c:if test="#{quoteValues.regimeType=='HOME_EMPLOYEE'}">
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/codeTables/regimeBasesTypes/form_homeEmployees.xhtml" />
			</c:if>
			<c:if test="#{quoteValues.regimeType=='AGRICULTURAL'}">
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/codeTables/regimeBasesTypes/form_agricultural.xhtml" />
			</c:if>
		</aon:div>

	</aon:panelTab>
						
</ui:composition>
