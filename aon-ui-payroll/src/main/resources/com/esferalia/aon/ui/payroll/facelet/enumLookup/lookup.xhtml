<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<aon:outputText value="#{lookupLabel}"
		rendered="#{lookupRendered==null or lookupRendered}" />
	<aon:div id="#{enumName}enumLookup#{lookupSuffix}" styleClass="aon-lookup"
		rendered="#{lookupRendered==null or lookupRendered}" >
		<aon:inputText value="#{ssEnumLookup.code}"
			rendered="#{lookupTo==null}" size="5">
			<a4j:support event="onchange" reRender="#{enumName}enumLookup#{lookupSuffix}"
				actionListener="#{ssEnumLookup.loadEnumByCode}" />
			<a4j:support event="onblur" reRender="#{enumName}enumLookup#{lookupSuffix}"
				actionListener="#{ssEnumLookup.loadEnumByCode}" />
		</aon:inputText>
		<aon:inputText value="#{lookupTo.code}"
			disabled="#{true}"
			rendered="#{lookupTo!=null}" size="5" />
		
		<aon:commandButton id="#{enumName}_SearchButton#{lookupSuffix}"
			rendered="#{lookupTo==null}" ajaxSingle="true"
			reRender="#{enumName}enumLookup, showEnumLookupWindow"
			styleClass="aon-lookupButton" >
			<f:setPropertyActionListener
				target="#{ssEnumLookup.enumName}" value="#{enumName}" />
			<aon:actionListener method="#{ssEnumLookup.onSearch}"/>
		</aon:commandButton>
			
		<aon:commandButton id="#{enumName}_ClearButton#{lookupSuffix}"
			rendered="#{lookupTo!=null}" ajaxSingle="true"
			reRender="#{enumName}enumLookup"
			focus="#{enumName}_id"
			styleClass="aon-lookupButton-clear" >
			<f:setPropertyActionListener
				target="#{lookupTo}" value="#{null}" />
			<aon:actionListener method="#{ssEnumLookup.clear}" 
				reRender="#{enumName}enumLookup" />
		</aon:commandButton>
		
		<aon:div style="display: inline;">
			<aon:inputText id="#{enumName}lookup-description#{lookupSuffix}" 
				value="#{ssEnumLookup.description}" rendered="#{lookupTo==null}" size="64">
				<aon:abbreviateConverter maxWidth="64" />
				<a4j:support event="onfocus" >
					<f:setPropertyActionListener target="#{ssEnumLookup.enumName}" value="#{enumName}" />
				</a4j:support>
			</aon:inputText>
			<rich:suggestionbox for="#{enumName}lookup-description#{lookupSuffix}" tokens=",[]"
                fetchValue="#{lto.description}" 
                minChars="3" rows="5"
                width="300" height="150" border="1" 
                usingSuggestObjects="true"
                suggestionAction="#{ssEnumLookup.autocomplete}" var="lto"
                nothingLabel="#{bundle.aon_search_no_results}" >
                <h:column>
                    <h:outputText value="#{lto.code}" />
                </h:column>
                <h:column>
                    <h:outputText value="#{lto.description}" />
                </h:column>
				<a4j:support event="onselect" ajaxSingle="true" 
					reRender="#{enumName}enumLookup"  >
					<f:setPropertyActionListener value="#{lto}" target="#{lookupTo}" />
				</a4j:support>			
            </rich:suggestionbox>
			<aon:if test="#{fn:length(lookupTo.description) > 64}">
				<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
					<aon:outputText value="#{lookupTo.description}" />
				</rich:toolTip>
			</aon:if>
			<aon:inputText  
				value="#{lookupTo.description}" rendered="#{lookupTo!=null}" disabled="#{true}" size="64">
				<aon:abbreviateConverter maxWidth="64" />
			</aon:inputText>
		</aon:div>
		
	</aon:div>

</ui:composition>
