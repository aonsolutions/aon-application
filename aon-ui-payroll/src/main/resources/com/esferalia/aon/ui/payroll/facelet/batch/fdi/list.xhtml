<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="leaveBatchList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.payroll_leaveBatchWizard_module}" />
				<ui:param name="controller" value="#{leaveBatch}" />
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{leaveBatch}" />
					
					<ui:param name="skipEditSelectedTo"
						value="#{!domainSwitcher.domainManagementAvailable and !controller.editableSelectedTo}" />
					
					<ui:define name="columns">

						<aon:column alias="LeaveBatch.id"
							styleClass="aon-editDataTable-numberColumn aon-width-50">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>
						
						<aon:column alias="LeaveBatch.date"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date} #{bundle.aon_finance_batch}" />
							</f:facet>
							<aon:outputText value="#{to.date}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
						<aon:column alias="LeaveBatch.outcomeFileDate"
							styleClass="aon-editDataTable-dateColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date} #{bundle.finance_disk}" />
							</f:facet>
							<aon:outputText value="#{to.outcomeFileDate}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
						<aon:column alias="LeaveBatch.status"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}"/>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
						</aon:column>
	
					</ui:define>
				</ui:decorate>
						
			</aon:div>
			
		</aon:form>

	</ui:define>

</ui:composition>
