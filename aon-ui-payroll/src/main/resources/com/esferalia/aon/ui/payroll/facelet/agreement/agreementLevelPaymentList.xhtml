<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:methodParam name="resetAction" value="" />
	<ui:include
		src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
		<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_agreementLevel_payment}" />
		<ui:param name="controller" value="#{agreementPayment}" />
		<ui:param name="skipSearchButton" value="true" />
	</ui:include>

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
		<ui:param name="controller" value="#{agreementPayment}" />
		
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
				<f:facet name="header">
					<aon:outputText	value="#{payrollBundle.payroll_agreementLevel_type}" />
				</f:facet>
				<aon:outputText value="#{to.salaryType}" />
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_start_date}" />
				</f:facet>
				<aon:outputText value="#{to.startDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_end_date}" />
				</f:facet>
				<aon:outputText value="#{to.endDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_salary_payment_month}" />
				</f:facet>
				<aon:outputText value="#{to.month}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
				<f:facet name="header">
					<aon:outputText	value="#{bundle.aon_concept}" />
				</f:facet>
				<aon:outputText value="#{to.paymentConcept.code}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.paymentConcept.description}" />
				<aon:outputText value="#{to.description}" rendered="#{to.paymentConcept.description == null}"/>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
