<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showLauncherConfirmWindow">
		<c:if test="#{salaryLauncher.showLauncherConfirmWindow}">
			<rich:modalPanel id="launcherModalPanel" 
				height="200" width="350" resizeable="false" 
				rendered="#{salaryLauncher.showLauncherConfirmWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_confirm_title}" />
					</aon:div>
				</f:facet>
				<aon:form id="salaryLauncherFrom">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								
								<aon:div styleClass="salaryLauncherModalContent" >
								
									<aon:outputText rendered="#{!salaryLauncher.existSalariesToOverride}" 
										value="&#191;Continuar con el lanzamiento de nominas&#63;" />
									<aon:outputText rendered="#{salaryLauncher.existSalariesToOverride}"
										styleClass="aon-bold" style="color:red;"
										value="Existen #{salaryLauncher.existingSalariesSize} nomina(s) segun los criterios de busqueda establecidos." />
									<aon:outputText rendered="#{salaryLauncher.existSalariesToOverride}"
										styleClass="aon-bold" style="color:red;"
										value="Si continua se sobreescribiran todas las nominas existentes." />
									<aon:outputText rendered="#{salaryLauncher.existSalariesToOverride}"
										styleClass="aon-bold" style="color:red;"
										value="&#191;Desea continuar con la emision de las nominas &#63;" />
									
									<aon:div style="width:100%; margin-top:20px; text-align:center;">
										<aon:commandButton id="launchSalaries"
											value="#{bundle.aon_accept}" 
											styleClass="aon-search-lookup-button"
											disabled="#{salaryLauncher.pollEnabled}"
											reRender="poll,launchSalaries,messagesContainer"
											actionListener="#{salaryLauncher.onExecute}">
											<rich:componentControl for="launcherModalPanel" event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener target="#{salaryLauncher.showLauncherConfirmWindow}"
												value="#{false}" />
								     	</aon:commandButton>
								     	<aon:commandButton id="back"
											title="#{bundle.aon_key_cancel_accelerator}"
											value="#{bundle.aon_cancel}" immediate="true"
											styleClass="aon-search-lookup-button"
											accesskey="#{bundle.aon_key_cancel}" >
											<rich:componentControl for="launcherModalPanel" event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener target="#{salaryLauncher.showLauncherConfirmWindow}"
												value="#{false}" />
										</aon:commandButton>	
									</aon:div>
									
								</aon:div>
									
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
