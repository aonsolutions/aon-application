<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components" >

	<aon:panelGrid columns="2" id="contract_panel" 
		columnClasses="aon-panelGrid-odd aon-width-180, aon-panelGrid-even aon-width-auto" >
			
		<c:if test="#{contract.new}" >
			<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{contract.to.person}" />
				<ui:param name="idRequired" value="#{true}" />
				<ui:param name="lookupDisabled" value="#{false}" />
			</ui:include>
		</c:if>

		<aon:outputLabel for="workPlace" 
			value="#{bundle.purchase_workplace}" />
		<aon:selectOneMenu id="workPlace" required="true"
			disabled="#{contract.enterprise==null or contract.enterprise.id==null}"
			value="#{contract.to.workPlace}" >
			<f:selectItems value="#{contract.workPlaces}" />
			<a4j:support event="onchange" actionListener="#{contract.onWorkPlaceChanged}" ajaxSingle="true" reRender="contract_panel" />
		</aon:selectOneMenu>
		
		<aon:outputLabel for="enterpriseActivities" value="#{bundle.aon_activity}" 
			style="font-size: 0.9em" styleClass="aon-italic aon-margin-left"/>
		<aon:selectOneMenu id="enterpriseActivities" required="true"
			disabled="#{contract.to.workPlace.id==null}"
			value="#{contract.to.activity}" >
			<f:selectItems value="#{contract.activities}" />
			<a4j:support event="onchange" actionListener="#{contract.onActivityChanged}" ajaxSingle="true" reRender="enterpriseCCCs"/>
		</aon:selectOneMenu>

		<aon:outputLabel for="enterpriseCCCs" value="#{bundle.company_enterprise_ccc}"
			style="font-size: 0.9em" styleClass="aon-italic aon-margin-left"/>
		<aon:selectOneMenu id="enterpriseCCCs" required="true"
			disabled="#{contract.to.activity.id==null}"
			value="#{contract.to.enterpriseCCC}" >
			<f:selectItems value="#{contract.enterpriseCCCs}" />
		</aon:selectOneMenu>
		
		<aon:outputLabel for="Contract_contractCode"
			value="#{bundle.payroll_contract_contract_code}" />
		<aon:selectOneMenu id="Contract_contractCode" required="true" 
			rendered="#{!contract.transformedContract}"
			value="#{contract.params.contractCode}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{payrollCollections.contractCodes}" />
			<a4j:support event="onchange" reRender="Contract_contractModelDiv" />
		</aon:selectOneMenu>
		<aon:panelGroup rendered="#{contract.transformedContract}">
			<aon:outputText value="#{contract.params.contractCode.value}" />
			<aon:outputText value=" - " />
			<aon:outputText value="#{contract.params.contractCode}" />
		</aon:panelGroup>
		
		<aon:outputLabel for="Contract_contractModel"
			value="#{bundle.payroll_contract_contract_model}" />
		<aon:div id="Contract_contractModelDiv">
			<aon:selectOneMenu id="Contract_contractModel" 
				disabled="#{contract.params.contractTransformCode!=null}"
				value="#{contract.to.model}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{contract.contractModel}" />
			</aon:selectOneMenu>
		</aon:div>
		
		<aon:outputLabel for="Contract_startDate" value="#{bundle.aon_start_date}" />
		<aon:div>
			<aon:selectInputDate id="Contract_startDate" 
				value="#{contract.to.startDate}" required="true" 
				inputSize="10" renderAsPopup="true" enableManualInput="true"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}">
				<a4j:support event="oninputchange" reRender="seniorityDateContainer" ajaxSingle="true"/>
				<a4j:support event="onchanged" reRender="seniorityDateContainer" ajaxSingle="true"/>
			</aon:selectInputDate>
			<aon:outputLabel for="Contract_seniorityDate" 
				styleClass="aon-italic aon-margin-right" style="font-size: 0.9em" 
				value="#{bundle.payroll_salary_seniority_date2}" />
			<aon:panelGroup id="seniorityDateContainer">
				<aon:selectInputDate id="Contract_seniorityDate"
					value="#{contract.to.seniorityDate}" required="true" 
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
					<a4j:support event="oninputchange" reRender="seniorityDateContainer" ajaxSingle="true"/>
					<a4j:support event="onchanged" reRender="seniorityDateContainer" ajaxSingle="true"/>
				</aon:selectInputDate>
				<aon:outputText value="&#160;&#160;&#160;&#160;&#160;"
					title="#{bundle.payroll_salary_start_date_seniority_date_difference}"
					styleClass="aon-icon-info"
					rendered="#{contract.to.seniorityDateDifferent}" />
			</aon:panelGroup>
		</aon:div>
		
		<aon:outputLabel for="Contract_endDate" value="#{bundle.aon_end_date}" />
		<aon:selectInputDate id="Contract_endDate" 
			required="#{false}"
			value="#{contract.to.endDate}"
			inputSize="10" renderAsPopup="true" enableManualInput="true"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>
		
		<c:if test="#{actionDenied.moduleEnabled['payroll']}">
			<aon:outputLabel  
				value="#{bundle.payroll_agreementLevel_category_level}" />
			<aon:panelGrid id="agreementLevelCategory-content" columns="2" 
				columnClasses="aon-panelGrid-even aon-noborder aon-italic, aon-panelGrid-even aon-noborder" >
	
				<aon:methodParam name="lookupChangeListener" value="#{contract.onChangeAgreement}" type="lookupChangeListener" />
				<ui:decorate template="/com/esferalia/aon/ui/payroll/facelet/agreement/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{contract.agreement}" />
					<ui:param name="skipInputText" value="#{true}" />
					<ui:param name="skipNewButton" value="#{true}" />
					<ui:param name="lookupInputSuggestSize" value="30" />
					<ui:param name="lookupReRender" value="agreementLevelCategory-content" />
					<ui:define name="afterLookupContent">
						<aon:outputText id="agreementLevelCategory-info" 
							value="&#160;&#160;&#160;&#160;&#160;"
							title="#{bundle.payroll_contract_no_category_selected}"
							styleClass="aon-icon-info"
							rendered="#{contract.agreement.id!=null and contract.to.agreementLevelCategory.id==null}" />
					</ui:define>
				</ui:decorate>
	
				<aon:outputLabel for="agreementLevelCategory" 
					value="#{bundle.aon_category}" />
				<aon:panelGroup>
					<aon:selectOneMenu id="agreementLevelCategory" styleClass="aon-margin-left"
						value="#{contract.to.agreementLevelCategory}" >
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{contract.agreementLevelCategories}" />
					</aon:selectOneMenu>
					<aon:outputLabel for="agreementLevelCategory-alias" styleClass="aon-margin-left aon-margin-right" 
						value="#{bundle.payroll_display_as}" />
					<aon:inputText id="agreementLevelCategory-alias" maxlength="64"
						value="#{contract.to.categoryDescription}" />
				</aon:panelGroup>
			</aon:panelGrid>
		
			<aon:outputLabel for="quote_group"
				value="#{bundle.payroll_contract_quote_group}" />
			<aon:selectOneMenu id="quote_group"  
				value="#{contract.params.quoteGroup}" >
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{payrollCollections.quoteGroups}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel value="#{bundle.report_occupation}"
				for="occupationType"/>
			<aon:selectOneMenu id="occupationType" 
				value="#{contract.params.occupationType}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{payrollCollections.occupationTypes}" />
			</aon:selectOneMenu>
		</c:if>
		
		<c:if test="#{!contract.trainingContract}" >
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/cno/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{contract.params.cno}" />
				<ui:param name="skipNewButton" value="#{true}" />
				<ui:param name="lookupDisabled" value="#{false}" />
				<ui:param name="lookupReRender" value="Contract_categoryDescription, trainingCenter, trainingCourse" />
			</ui:include>
		</c:if>
		
		<c:if test="#{contract.trainingContract}" >
			<aon:outputLabel for="contract_subsidized" value="#{bundle.payroll_contract_subsidized}" />
			<aon:selectBooleanCheckbox id="contract_subsidized" value="#{contract.params.subsidized}" />
		
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/trainingCenter/course/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{contract.params.trainingCourse}" />
				<ui:param name="skipNewButton" value="#{true}" />
			</ui:include>
			
			<aon:outputText value="#{bundle.payroll_trainingCourse_trainingCalendar}" />
			<aon:div>
				<aon:outputLabel for="trainingStartDate" 
					styleClass="aon-italic aon-margin-right" style="font-size: 0.9em" 
					value="#{bundle.aon_start_date}" />
				<aon:selectInputDate id="trainingStartDate" 
					value="#{contract.params.trainingStartDate}" required="#{contract.params.trainingCourse.id!=null}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}" />
				<aon:outputLabel for="trainingEndDate" 
					styleClass="aon-italic aon-margin-right" style="font-size: 0.9em" 
					value="#{bundle.aon_end_date}" />
				<aon:selectInputDate id="trainingEndDate"
					value="#{contract.params.trainingEndDate}" required="#{contract.params.trainingCourse.id!=null}"  
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}" />
			</aon:div>
			
			<aon:outputLabel for="Contract_workSchedule"  
				value="Horario del trabajo efectivo" />
			<aon:inputText id="Contract_workSchedule" maxlength="80" size="96"
				value="#{contract.params.workSchedule}" />

			<aon:outputLabel for="Contract_trainingSchedule"  
				value="Horario de la actividad formativa" />
			<aon:inputText id="Contract_trainingSchedule" maxlength="25" size="32"
				value="#{contract.params.trainingSchedule}" />
		</c:if>
		
		<c:if test="#{not empty contract.params.bonus.id}" >
			<aon:outputText value="#{bundle.sepe_contrata_contract_bonus}" />
			<aon:div>
				<aon:outputText value="#{contract.params.bonus.fullDescription}" />
				<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
					<f:facet name="header">
						<aon:outputText value="#{bundle.sepe_contrata_contract_bonus}" />
					</f:facet>
					<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-70, aon-noborder aon-bold aon-text-left">
						<aon:outputText value="#{bundle.aon_description}" styleClass="aon-margin-right" />
						<aon:outputText value="#{contract.params.bonus.fullDescription}" />
						
						<aon:outputText value="#{bundle.aon_period}" styleClass="aon-margin-right" />
						<aon:div>
							<aon:outputText value="#{bundle.aon_start_date}:" styleClass="aon-italic" />
							<aon:outputText value="#{contract.params.bonus.startDate}" styleClass="aon-margin-left">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:outputText value="#{bundle.aon_end_date}:" styleClass="aon-margin-left aon-italic" />
							<aon:outputText value="#{contract.params.bonus.endDate}" styleClass="aon-margin-left">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:div>
					</aon:panelGrid>
				</rich:toolTip>
				<aon:commandButton id="removeContractBonus" 
					value="&#160;" title="#{bundle.aon_remove}" 
					styleClass="aon-icon-commandButton aon-icon-delete"
					actionListener="#{contract.onRemoveBonus}" 
					reRender="contract_panel" />
			</aon:div>
		</c:if>
		
	</aon:panelGrid>

</ui:composition>
