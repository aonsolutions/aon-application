<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components" >

	<aon:panelGrid columns="3" style="width: 100%;"
		columnClasses="aon-panelGrid-odd aon-width-250
					  ,aon-panelGrid-even aon-width-auto
					  ,aon-panelGrid-even aon-width-150">
	
		<aon:outputText value="#{companyBundle.company_enterprise}" />
		<aon:div>
			<aon:outputText value="#{contract.to.workPlace.enterprise.registry.document}" />
			<aon:outputText value=" - " />	
			<aon:outputText value="#{contract.to.workPlace.enterprise.registry.fullName}" styleClass="aon-bold"/>
		</aon:div>
		<aon:htmlCommandLink target="_blank" 
			disabled="#{contract.to.document==null}"
			title="#{(contract.to.document!=null)?('pdf'):('disabled')}"
			actionListener="#{contract.onDownloadSelected}"
			styleClass="aon-editDataTable-button #{(contract.to.document!=null)?('aon-icon-pdf'):('aon-icon-pdf-disabled')}"
			style="padding-left: 20px;"
			value="#{contract.contractData.code.value}" />

		<aon:outputText value="#{companyBundle.company_workplace}" style="font-size: 0.9em" styleClass="aon-italic aon-margin-left"/>
		<aon:outputText value="#{contract.to.workPlace.description}" style="margin-left: 50px;"/>
		<aon:div>
			<aon:outputText value="#{contract.to.status}" style="padding-left: 20px;" styleClass="aon-icon-point-orange" rendered="#{contract.to.pending}"/>	
			<aon:outputText value="#{contract.to.status}" style="padding-left: 20px;" styleClass="aon-icon-point-green"  rendered="#{contract.to.processed}"/>
			<aon:outputText value="#{contract.to.status}" style="padding-left: 20px;" styleClass="aon-icon-point-yellow" rendered="#{contract.to.blocked}"/>
		</aon:div>
			
		<aon:outputText value="#{companyBundle.company_enterprise_ccc}" style="font-size: 0.9em" styleClass="aon-italic aon-margin-left"/>
		<aon:outputText value="#{contract.to.enterpriseCCC.ccc}"  style="margin-left: 50px;"/>
		<aon:outputText value="&#160;" />
						
		<aon:outputText value="#{registryBundle.registry_person}" />
		<aon:div> 
			<aon:outputText value="#{contract.to.person.registry.document}" />
			<aon:outputText value=" - " />
			<aon:outputText value="#{contract.to.person.fullName}" styleClass="aon-bold"/>
		</aon:div>	
		<aon:outputText value="&#160;" />

		<aon:outputText value="#{payrollBundle.employee_salary_ss_number}" style="font-size: 0.9em" styleClass="aon-italic aon-margin-left"/>
		<aon:outputText value="#{contract.to.person.socialSecurityNumber}"  style="margin-left: 50px;"/>
		<aon:outputText value="&#160;" />
		
		<aon:outputText value="#{bundle.aon_start_date}" />
		<aon:outputText value="#{contract.to.startDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
		<aon:outputText value="&#160;" />
		
		<aon:outputText value="#{bundle.aon_end_date}" />
		<aon:outputText value="#{contract.to.endDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
		<aon:outputText value="&#160;" />
	</aon:panelGrid>

	<aon:panelGrid columns="4" style="width: 100%; margin-top:10px;"
		columnClasses="aon-panelGrid-even aon-width-150
					  ,aon-panelGrid-even aon-width-150
					  ,aon-panelGrid-even aon-width-150
					  ,aon-panelGrid-even aon-width-auto">
	
		<aon:div>
			<aon:outputText value="&#160;" style="padding-left:15px;" styleClass="aon-icon-search"/>
			<aon:commandLink 
				actionListener="#{contract.onShowDetails}"
				action="contractData_list"
				styleClass="aon-dataTable-link"
				value="Detalle de Contrato" />
		</aon:div>	

		<aon:div>
			<aon:outputText value="&#160;" style="padding-left:15px;" styleClass="aon-icon-fraction"/>
			<aon:commandLink 
				actionListener="#{contract.onShowPayments}"
				styleClass="aon-dataTable-link"
				action="contractPayment_list"
				value="Percepciones" />
		</aon:div>	

		<aon:div>
			<aon:outputText value="&#160;" style="padding-left:15px;" styleClass="aon-icon-settle"/>
			<aon:commandLink 
				actionListener="#{contract.onShowDeductions}"
				styleClass="aon-dataTable-link"
				action="contractDeduction_list"
				value="Deducciones" />
		</aon:div>	

		<aon:outputText value="&#160;" />

	</aon:panelGrid>



</ui:composition>
