<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="mod145Form">
		
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_mod145_module}" />
					<ui:param name="controller" value="#{mod145}" />
					<ui:param name="skipRemoveButton" value="true" />
					<ui:param name="skipSearchButton" value="true" />
					<ui:param name="skipSpin" value="false" />
					<ui:param name="skipFocusFirst" value="true" />
<!--  
					<ui:param name="skipResetButton" value="true" />
					<ui:param name="skipSaveButton" value="true" />
-->					

					<ui:define name="toolbarActions">
						<aon:methodParam name="backAction" value="mod145_list" />
						<aon:methodParam name="saveAction" value="mod145_form" />
					</ui:define>
					
<!--  
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton id="multiple_tracking"
							value="#{payrollBundle.payroll_multiple_tracking}"
							immediate="#{true}" 
							styleClass="aon-finding-toolbar-item aon-icon-open-popup" 
							actionListener="#{contractCalendarEvent.onMultipleTrackingShow}"
							reRender="showMultipleTrackingWindow">
							<f:setPropertyActionListener target="#{contractCalendarEvent.showMultipleTrackingWindow}"
								value="#{true}" />
						</aon:commandButton>
					</ui:define>

					<ui:define name="additionalToolbarContent">
						<aon:commandButton id="multiple_tracking"
							value="#{payrollBundle.payroll_multiple_tracking}"
							immediate="#{true}" 
							styleClass="aon-finding-toolbar-item aon-icon-open-popup" 
							actionListener="#{contractTracking.onMultipleTrackingShow}"
							reRender="showMultipleTrackingWindow">
							<f:setPropertyActionListener target="#{contractTracking.showMultipleTrackingWindow}"
								value="#{true}" />
						</aon:commandButton>
					</ui:define>
-->					
					
				</ui:decorate>
			</aon:div>	

			<aon:div ajaxRendered="true" layout="none">

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area" id="mod145Contect">
					<aon:panelGrid columns="8" dir="true" width="100%">
						
						<aon:outputLabel value="#{registryBundle.registry_person}" />
						<aon:outputText value="#{contract.to.person.registry.fullName}" />

						<aon:outputLabel value="#{payrollBundle.payroll_enterprise}" />
						<aon:outputText value="#{contract.to.workPlace.enterprise.registry.fullName}" />

						<aon:outputLabel value="#{bundle.aon_start_date}" />
						<aon:outputText value="#{contract.to.startDate}" style="margin-left: 5px;">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>

						<aon:outputLabel value="#{bundle.aon_end_date}" />
						<aon:outputText value="#{contract.to.endDate}" style="margin-left: 5px;">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:panelGrid>
					
					<aon:panelGrid columns="2"  width="100%"
						columnClasses="aon-panelGrid-odd aon-width-150,	aon-panelGrid-even aon-width-auto">
						
						<aon:outputLabel for="mod145_familySituation" value="#{payrollBundle.payroll_mod145_familySituation}" />
						<aon:selectOneRadio id="mod145_familySituation" layout="pageDirection" 
							value="#{mod145.to.familySituation}" >
							<f:selectItems value="#{payrollCollections.familySituations}"  />
							<a4j:support event="onchange" reRender="mod145Contect" inmediate="true" />
							<a4j:support event="onclick" reRender="mod145Contect" inmediate="true" />
						</aon:selectOneRadio>
						
						<aon:outputLabel for="mod145_spouseDocument" value="#{payrollBundle.payroll_mod145_spouseDocument}" 
							rendered="#{mod145.to.familySituation=='MARRIED'}"/>
						<aon:inputText id="mod145_spouseDocument" 
							ajaxSingle="true"
							value="#{mod145.to.spouseDocument}"
							rendered="#{mod145.to.familySituation=='MARRIED'}" required="true"
							size="10" maxlength="10" />
						
						<aon:outputLabel for="mod145_disabilityLevel" value="#{payrollBundle.payroll_mod145_disabilityLevel}" />
						<aon:selectOneMenu id="mod145_disabilityLevel" value="#{mod145.to.disabilityLevel}">
							<f:selectItem value="#{null}" itemLabel=" - " />
							<f:selectItems value="#{payrollCollections.disabilityLevels}" />
						</aon:selectOneMenu>
				
						<aon:outputLabel for="mod145_dependence" value="#{payrollBundle.payroll_mod145_dependence}" />
						<aon:selectBooleanCheckbox id="mod145_dependence" value="#{mod145.to.dependence}"/> 

						<aon:outputLabel for="mod145_movingDate" value="#{payrollBundle.payroll_mod145_movingDate}" />
						<aon:selectInputDate id="mod145_movingDate" 
							value="#{mod145.to.movingDate}" 
							inputSize="10" renderAsPopup="true" enableManualInput="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>

						<aon:outputLabel for="mod145_labourProlongation" value="#{payrollBundle.payroll_mod145_labourProlongation}" />
						<aon:selectBooleanCheckbox id="mod145_labourProlongation" value="#{mod145.to.labourProlongation}"/>

						<aon:outputLabel for="mod145_descendientCount" value="#{payrollBundle.payroll_mod145_descendientCount}" />
						<aon:inputText id="mod145_descendientCount" 
							ajaxSingle="true"
							disabled="#{!mod145.new and mod145.to.descendientCount==null}"
							value="#{mod145.descendientCount}"
							size="2" maxlength="2" />
						
					</aon:panelGrid>
				</aon:div>

			</aon:div>
		</aon:form>

		<aon:form>
			<aon:div styleClass="aon-scroll-area">
				<c:if test="#{!mod145.new}" >
						
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_mod145_descendients}" />
						</f:facet>
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
							<ui:param name="controller" value="#{mod145Descendients}" />
							<ui:define name="columns">
								<ui:include 
									src="/com/esferalia/aon/ui/payroll/facelet/contract/mod145/descendients/gridContent.xhtml" />
							</ui:define>
						</ui:decorate>
					</aon:panel>
										
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_mod145_ascendants}" />
						</f:facet>
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
							<ui:param name="controller" value="#{mod145Ascendants}" />
							<ui:define name="columns">
								<ui:include 
									src="/com/esferalia/aon/ui/payroll/facelet/contract/mod145/ascendants/gridContent.xhtml" />
							</ui:define>
						</ui:decorate>
					</aon:panel>
						
				</c:if>
			</aon:div>
		</aon:form>


	</ui:define>

</ui:composition>
