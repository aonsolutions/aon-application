<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="paymentUpdateSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_payment_update_module}" />
				<ui:param name="controller" value="#{paymentUpdate}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{paymentUpdate}" />
				<ui:define name="searchContent">
					<c:if test="#{aonConfiguration.bean.paymentUpdate.showEnterpriseInSearch}">				
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{paymentUpdate.enterprise}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="idRequired" value="#{true}" />
						</ui:include>
					</c:if>
					
					<aon:outputText value="#{bundle.aon_date}"/>
					<h:panelGrid columns="2">
						<aon:selectOneMenu id="PaymentUpdate_month" value="#{paymentUpdate.month}" required="true">
							<f:selectItems value="#{commonCollections.months}"  />
						</aon:selectOneMenu>
			   			<rich:inputNumberSpinner id="PaymentUpdate_year" value="#{paymentUpdate.year}" 
			   				inputSize="4" minValue="2009" maxValue="2020" required="true"/>
					</h:panelGrid>
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
