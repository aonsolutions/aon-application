<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panel>
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_datos_remesa_certificado}" />
		</f:facet>
		<aon:panelGrid columns="8" dir="true" width="100%">

			<aon:outputText value="#{payrollBundle.payroll_empresa}" />
			<aon:outputText
				value="#{certificateFileGenerationWizard.batch.enterprise.registry.name}" />

			<aon:outputText value="#{payrollBundle.payroll_fecha}" />
			<aon:outputText value="#{certificateFileGenerationWizard.batch.date}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
			
			<aon:outputText value="#{payrollBundle.payroll_estado}" />
			<aon:outputText value="#{certificateFileGenerationWizard.batch.status}" />

		</aon:panelGrid>
	</aon:panel>

</ui:composition>
