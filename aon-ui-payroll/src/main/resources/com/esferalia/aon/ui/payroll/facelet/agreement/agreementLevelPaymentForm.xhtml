<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:methodParam name="resetAction" value="agreement_level_form" />
	<aon:methodParam name="saveAction" value="agreement_level_form" />
	<aon:methodParam name="removeAction" value="agreement_level_form" />
	<aon:methodParam name="cancelAction" value="agreement_level_form" />
	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarTitle"
			value="#{payrollBundle.payroll_agreementLevel_payment}" />
		<ui:param name="controller" value="#{agreementLevelPayment}" />
		<ui:param name="skipSearchButton" value="true" />
	</ui:decorate>

	<aon:panelGrid id="dataTable" columns="2" styleClass="aon-margin-top">
	
		<aon:outputLabel for="AgreementLevelPayment_startDate" value="#{bundle.aon_start_date}" />
		<aon:selectInputDate id="AgreementLevelPayment_startDate" value="#{agreementLevelPayment.to.startDate}" required="true"
			timeZone="#{timeZoneController.timeZone}" popupDateFormat="#{bundle.aon_date_pattern}"/>
		
		<aon:outputLabel for="AgreementLevelPayment_endDate" value="#{bundle.aon_end_date}" />
		<aon:selectInputDate id="AgreementLevelPayment_endDate" value="#{agreementLevelPayment.to.endDate}"
			timeZone="#{timeZoneController.timeZone}" popupDateFormat="#{bundle.aon_date_pattern}"/>
	
		<aon:outputLabel value="#{bundle.aon_concept}" />
		<aon:div styleClass="aon-lookup">
			<aon:lookupInputText id="PaymentConcept_code" lookup="#{paymentConceptLookup}"
				reRender="PaymentConcept_description"
				property="#{agreementLevelPayment.to.paymentConcept}" 
				value="#{agreementLevelPayment.to.paymentConcept.code}" size="5" >
				<aon:joinProperty alias="PaymentConcept_code"
					value="#{agreementLevelPayment.to.paymentConcept.code}" />
			</aon:lookupInputText>
			<aon:lookupButton 
				windowTitle="#{registryBundle.registry_person_selection}"
				selectReRender="PaymentConcept_code,PaymentConcept_description" actionType="search"
				lookup="#{paymentConceptLookup}" minHeight="460" minWidth="650"
				property="#{agreementLevelPayment.to.paymentConcept}">
			</aon:lookupButton>
			<aon:inputText id="PaymentConcept_description"
				value="#{(agreementLevelPayment.to.paymentConcept.description!=null)?(agreementLevelPayment.to.paymentConcept.description):('')}"
				size="50" disabled="true" />
		</aon:div>

		<aon:outputLabel for="AgreementLevelPayment_description"
			value="#{bundle.aon_description}" />
		<aon:inputText id="AgreementLevelPayment_description" size="64"
			maxlength="64" value="#{agreementLevelPayment.to.description}" />

		<aon:outputText value="&#160;" />
		<aon:panelGroup>
			<aon:selectBooleanCheckbox id="AgreementLevelPayment_decorateDescription"
				value="#{agreementLevelPayment.to.descriptionDecorable}" />
			<aon:outputLabel for="AgreementLevelPayment_decorateDescription"
				value="#{payrollBundle.payroll_salary_show_expression}" />
		</aon:panelGroup>

		<aon:outputLabel for="AgreementLevelPayment_salaryType" value="#{bundle.aon_type}" />
		<aon:selectOneRadio id="AgreementLevelPayment_salaryType" value="#{agreementLevelPayment.to.salaryType}">
			<f:selectItems value="#{payrollCollections.salaryTypes}" />
		</aon:selectOneRadio>

		<aon:outputLabel for="AgreementLevelPayment_month" value="#{payrollBundle.payroll_salary_payment_month}" />
		<aon:selectOneMenu id="AgreementLevelPayment_month" value="#{agreementLevelPayment.to.month}">
			<f:selectItem value="#{null}" itemLabel=" - " />
			<f:selectItems value="#{commonCollections.months}"  />
		</aon:selectOneMenu>

		<c:if test="#{aonRole.sisAdmin}">
			<aon:outputLabel for="AgreementLevelPayment_expression"
				value="#{payrollBundle.payroll_salary_expression}" />
			<aon:inputTextarea id="AgreementLevelPayment_expression" cols="60" rows="3"
				maxlength="128" value="#{agreementLevelPayment.to.expression}">
				<f:validateLength maximum="128" />
				<a4j:region>
					<rich:suggestionbox id="AgreementLevelPayment_expression_suggestion"
						for="AgreementLevelPayment_expression"
						onselect="suggestionBoxActive=false;"
						suggestionAction="#{agreementLevelPayment.expressionContext}" var="exp"
						similarityGroupingId="" tokens=" +-/*%(){}[]" fetchValue="#{exp}"
						immediate="true" limitToList="true" ajaxSingle="true"
						eventsQueue="AgreementLevelPayment_expressionSug"
						ignoreDupResponses="true" requestDelay="100" width="500"
						height="100" nothingLabel="#{bundle.aon_search_no_results}">
						<aon:column>
							<aon:outputText value="#{exp}" styleClass="aon-bold" />
						</aon:column>
					</rich:suggestionbox>
				</a4j:region>
			</aon:inputTextarea>
	
			<aon:outputLabel for="AgreementLevelPayment_irpf_expression"
				value="#{payrollBundle.payroll_salary_irpf_expression}" />
			<aon:inputTextarea id="AgreementLevelPayment_irpf_expression" cols="60"
				rows="3" maxlength="128" value="#{agreementLevelPayment.to.irpfExpression}">
				<f:validateLength maximum="128" />
				<a4j:region>
					<rich:suggestionbox id="AgreementLevelPayment_irpf_expression_suggestion"
						for="AgreementLevelPayment_irpf_expression"
						onselect="suggestionBoxActive=false;"
						suggestionAction="#{agreementLevelPayment.expressionContext}" var="exp"
						similarityGroupingId="" tokens=" +-/*%(){}[]" fetchValue="#{exp}"
						immediate="true" limitToList="true" ajaxSingle="true"
						eventsQueue="AgreementLevelPayment_irpf_expressionSug"
						ignoreDupResponses="true" requestDelay="100" width="500"
						height="100" nothingLabel="#{bundle.aon_search_no_results}">
						<aon:column>
							<aon:outputText value="#{exp}" styleClass="aon-bold" />
						</aon:column>
					</rich:suggestionbox>
				</a4j:region>
			</aon:inputTextarea>
	
			<aon:outputLabel for="AgreementLevelPayment_quote_expression"
				value="#{payrollBundle.payroll_salary_quote_expression}" />
			<aon:inputTextarea id="AgreementLevelPayment_quote_expression" cols="60"
				rows="3" maxlength="128" value="#{agreementLevelPayment.to.quoteExpression}">
				<f:validateLength maximum="128" />
				<a4j:region>
					<rich:suggestionbox id="AgreementLevelPayment_quote_expression_suggestion"
						for="AgreementLevelPayment_quote_expression"
						onselect="suggestionBoxActive=false;"
						suggestionAction="#{agreementLevelPayment.expressionContext}" var="exp"
						similarityGroupingId="" tokens=" +-/*%(){}[]" fetchValue="#{exp}"
						immediate="true" limitToList="true" ajaxSingle="true"
						eventsQueue="AgreementLevelPayment_quote_expressionSug"
						ignoreDupResponses="true" requestDelay="100" width="500"
						height="100" nothingLabel="#{bundle.aon_search_no_results}">
						<aon:column>
							<aon:outputText value="#{exp}" styleClass="aon-bold" />
						</aon:column>
					</rich:suggestionbox>
				</a4j:region>
			</aon:inputTextarea>
		</c:if>

	</aon:panelGrid>


</ui:composition>
