<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<c:if test="#{aonConfiguration.bean.salary.showIssueDateColumn and !skipIssueDateColumn}">
		<aon:column alias="Salary.issueDate"
			styleClass="aon-editDataTable-dateColumn aon-width-130">
			<f:facet name="header">
				<aon:outputText value="#{payrollBundle.payroll_salary_issue_date}" />
			</f:facet>
			<aon:outputText value="#{to.month}" />
			<aon:outputText value="/" />
			<aon:outputText value="#{to.issueYear}" />
		</aon:column>
	</c:if>

	<aon:column alias="Salary.type" styleClass="aon-editDataTable-textColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_type}" />
		</f:facet>
		<aon:outputText value="#{to.type}" />
	</aon:column>

	<c:if test="#{aonConfiguration.bean.salary.showPersonColumn and !skipPersonColumn}">
		<aon:column alias="Salary.contract.person.registry.fullName"
			styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{payrollBundle.payroll_employee_name}" />
			</f:facet>
			<aon:outputText value="#{to.employeeName}">
				<aon:abbreviateConverter maxWidth="40" />
			</aon:outputText>
		</aon:column>
	</c:if>
	
	<c:if test="#{aonConfiguration.bean.salary.showEnterpriseColumn and !skipEnterpriseColumn}">
		<aon:column alias="Salary.contract.workPlace.enterprise.registry.fullName"
			styleClass="aon-editDataTable-textColumn aon-width-250">
			<f:facet name="header">
				<aon:outputText value="#{companyBundle.company_enterprise}" />
			</f:facet>
			<aon:outputText value="#{to.enterpriseName}">
				<aon:abbreviateConverter maxWidth="30" />
			</aon:outputText>
		</aon:column>
	</c:if>

	<aon:column alias="Salary.totalPayment" styleClass="aon-editDataTable-numberColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_salary_totalPayment_abbr}" />
		</f:facet>
		<aon:outputText value="#{to.totalPayment}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Salary.totalDeduction" styleClass="aon-editDataTable-numberColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_salary_totalDeduction_abbr}" />
		</f:facet>
		<aon:outputText value="#{to.totalDeduction}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Salary.totalLiquid" styleClass="aon-editDataTable-numberColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_salary_totalLiquid_abbr}" />
		</f:facet>
		<aon:outputText value="#{to.totalLiquid}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
	</aon:column>
