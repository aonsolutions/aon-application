<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >

		<aon:div styleClass="aon-bold aon-text-center aon-margin-left aon-margin-right">
			<aon:outputText value="#{payrollBundle.payroll_salary_description}" styleClass="aon-underline"/>
		</aon:div>
		
		<aon:panelGrid columns="2" style="width: 100%"
			columnClasses="aon-panelGrid-even aon-noborder aon-width-half aon-nopadding  
			              ,aon-panelGrid-even aon-noborder aon-width-half aon-nopadding ">

			<aon:outputText value="&#160;#{payrollBundle.payroll_enterprise}:&#160;" 
				styleClass="aon-italic" style="position: relative; top: 8px; margin-left: 5px; background-color: white; font-size: 0.9em;"/>
			<aon:outputText value="&#160;#{payrollBundle.payroll_employee_name}:&#160;" 
				styleClass="aon-italic" style="position: relative; top: 8px; margin-left: 5px; background-color: white;  font-size: 0.9em;"/>

			<aon:div style="background-color: #F6F6F6;" styleClass="aon-border aon-padding aon-margin-right">
				<aon:div styleClass="aon-bold">
					<aon:outputText value="#{salary.enterpriseName}"/>
				</aon:div>
				<aon:div styleClass="aon-italic">
					<aon:outputText value="#{companyBundle.company_workplace_address}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.contract.workPlace.address.fullAddress}"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.contract.workPlace.address.zip}"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.contract.workPlace.address.city}"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.contract.workPlace.address.geozone.name}"/>
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{bundle.aon_company_document}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" 
						value="#{salary.enterpriseDocument}" />
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_ccc}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.ccc}" />
				</aon:div>
			</aon:div>

			<aon:div style="background-color: #F6F6F6;" styleClass="aon-border aon-padding">
				<aon:div styleClass="aon-bold">
					<aon:outputText value="#{salary.employeeName}"/>
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{bundle.aon_person_document}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.employeeDocument}" />
					<aon:outputText styleClass="aon-margin-left aon-italic" value="#{payrollBundle.payroll_salary_registration}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.registration}" />
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_ss_number}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.socialSecurityNumber}" />
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_category}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.category}" />
				</aon:div>
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_group_category}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.quoteGroup}"/>
					<aon:outputText styleClass="aon-margin-left aon-italic" value="#{payrollBundle.payroll_salary_seniority_date}:"/>
					<aon:outputText styleClass="aon-margin-left aon-bold" value="#{salary.seniorityDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:div>
			</aon:div>
	
		</aon:panelGrid>
</ui:composition>
