<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >

		<aon:panelGrid columns="2" style="background-color: #F6F6F6; width: 100%;"
			columnClasses="aon-panelGrid-even aon-vertical-align-top aon-noborder
			              ,aon-panelGrid-even aon-vertical-align-top aon-noborder">

			<aon:panel style="background-color: #F6F6F6;">
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_enterprise}" />
				</f:facet>	

				<aon:div styleClass="aon-padding">
					<aon:div styleClass="aon-bold">
						<aon:outputText value="#{controller.salary.enterpriseName}"/>
					</aon:div>
					<aon:div styleClass="aon-italic">
						<aon:outputText value="#{companyBundle.company_workplace_address}:"/>
					</aon:div>
					<aon:div styleClass="aon-bold">
						<aon:outputText styleClass="aon-margin-left" value="#{controller.salary.enterpriseAddress}"/>
					</aon:div>
					<aon:div>
						<aon:outputText styleClass="aon-italic" value="#{bundle.aon_company_document}:"/>
						<aon:outputText styleClass="aon-margin-left aon-bold" 
							value="#{controller.salary.enterpriseDocument}" />
					</aon:div>
					<aon:div>
						<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_ccc}:"/>
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.salary.ccc}" />
					</aon:div>
				</aon:div>
			</aon:panel>

			<aon:panel style="background-color: #F6F6F6;">
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_employee_name}" />
				</f:facet>	
				<aon:div styleClass="aon-padding aon-nowrap">
					<aon:div styleClass="aon-bold">
						<aon:outputText value="#{controller.salary.employeeName}"/>
					</aon:div>
					<aon:div>
						<aon:outputText styleClass="aon-italic" value="#{bundle.aon_person_document}:"/>
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.salary.employeeDocument}" />
						<aon:outputText styleClass="aon-margin-left aon-italic" value="#{payrollBundle.payroll_salary_registration}:"/>
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.salary.registration}" />
					</aon:div>
					<aon:div>
						<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_ss_number}:"/>
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.salary.socialSecurityNumber}" />
					</aon:div>
					<aon:div>
						<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_category}:"/>
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.salary.category}" />
					</aon:div>
					<aon:div>
						<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_group_category}:"/>
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.salary.quoteGroup}"/>
						<aon:outputText styleClass="aon-margin-left aon-italic" value="#{payrollBundle.payroll_salary_seniority_date}:"/>
						<aon:outputText styleClass="aon-margin-left aon-bold" value="#{controller.salary.seniorityDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:div>
				</aon:div>
			</aon:panel>
	
		</aon:panelGrid>
		
		<aon:div styleClass="aon-margin-top aon-text-right" style="width: 100%;">
			<h:panelGrid columns="5" style="width: 100%;" >
				<aon:div>
					<aon:outputText value="#{bundle.aon_type}" styleClass="aon-italic" />
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:selectOneMenu value="#{controller.salaryType}">
						<f:selectItems value="#{controller.salaryDraftTypes}" />
						<a4j:support event="onchange" actionListener="#{controller.onReloadDraft}" reRender="salaryDraftForm" ajaxSingle="true"/>
					</aon:selectOneMenu>
				</aon:div>
				
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_simulation_date}"/>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:selectOneMenu id="Contract_month" value="#{controller.month}">
						<f:selectItems value="#{controller.draftMonths}"  />
						<a4j:support event="onchange" actionListener="#{controller.onReloadDraft}" reRender="salaryDraftForm" ajaxSingle="true"/>
					</aon:selectOneMenu>
				</aon:div>

	   			<rich:inputNumberSpinner id="Contract_year" value="#{controller.year}" inputSize="4" minValue="2009" maxValue="2020">
	   			  <a4j:support event="onchange" actionListener="#{controller.onReloadDraft}" reRender="salaryDraftForm" ajaxSingle="true"/>
	   			  <a4j:support event="oninputkeydown" actionListener="#{controller.onReloadDraft}" reRender="salaryDraftForm" ajaxSingle="true" focus="Contract_year"/>
	   			  <a4j:support event="oninputkeyup" actionListener="#{controller.onReloadDraft}" reRender="salaryDraftForm" ajaxSingle="true" focus="Contract_year"/>
	   			</rich:inputNumberSpinner>

				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_period}"/>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_period_from}"/>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText value="#{controller.salary.startDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>		
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_period_to}"/>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText value="#{controller.salary.endDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>		
				</aon:div>
				
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-margin-left aon-italic" value="#{payrollBundle.payroll_salary_days}:"/>
					<aon:outputText styleClass="aon-margin-left aon-margin-right aon-bold" value="#{controller.salary.timeUnits}"/>
				</aon:div>
			</h:panelGrid>
			
<!-- 			
			<aon:selectInputDate value="#{controller.issueDate}"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
				<a4j:support event="oninputchange" actionListener="#{controller.onChangeDates}" reRender="salaryDraftForm"/>
				<a4j:support event="onchanged" actionListener="#{controller.onChangeDates}" reRender="salaryDraftForm"/>
			</aon:selectInputDate>
 -->
		</aon:div>
			<c:if test="#{!salaryDraft.validSalaryDraftPeriod}">
			<aon:div styleClass="aon-panelGrid-search" style="width: 100%; margin-top:10px;">
					<aon:outputText value="&#160;" style="padding-left:15px;" styleClass="aon-icon-exception"/>
					<aon:outputText value="#{payrollBundle.payroll_contract_undefined_variables}" styleClass="aon-bold"/>
					<br />
					<br />
					<br />
					<br />
					<br />
					<br />
					<aon:outputText value="&#160;"/>
					<aon:outputText value="&#160;"/>
					<aon:outputText value="&#160;"/>
					<aon:outputText value="&#160;"/>
					<aon:outputText value="&#160;"/>
					<aon:outputText value="&#160;"/>
					<aon:outputText value="&#160;"/>
					
					
			</aon:div>	
		</c:if>

</ui:composition>
