<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:div id="contractModelFields">
		<aon:if test="#{empty contract.params.contractModelOption}">
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="Seleccione la modalidad del contrato para poder introducir los datos" />
				</f:facet>
				<aon:div style="display: inline-block;">
					<aon:selectOneMenu value="#{contract.params.contractModelOption}"
						valueChangeListener="#{contract.onChangeModel}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{contract.contractModel}" />
					</aon:selectOneMenu>
					<aon:div styleClass="aon-margin-top aon-text-right">
						<aon:commandButton value="continuar"
							reRender="contractModelFields"
							actionListener="#{controller.onSaveContractModel}">
							<aon:actionListener method="#{controller.onLoadContractFields}" />
						</aon:commandButton>
					</aon:div>
				</aon:div>
			</aon:panel>
		</aon:if>
		
		<aon:if test="#{not empty contract.params.contractModelOption}">
			<a4j:repeat var="to" value="#{controller.contractFieldList}">
				<aon:panelGrid columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-350, aon-panelGrid-even aon-width-auto" >
				
					<aon:outputText value="#{to.name}" />
					<aon:inputText value="#{to.expression}"
						maxlength="128" size="64"
						rendered="#{!to.check}" />
					<aon:selectBooleanCheckbox value="#{to.expression}"
						rendered="#{to.check and !to.composite}" />
					<aon:selectOneMenu value="#{to.expression}"
						rendered="#{to.check and to.composite}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{to.compositeList}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</a4j:repeat>
		</aon:if>
	</aon:div>
	
</ui:composition>
