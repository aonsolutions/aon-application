<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
	

	<c:set var="value" value="#{empty property ? constant : irpf[property]}" /> 
	<c:set var="other" value="#{empty property ? null : irpf.other[property]}" /> 
	<c:set var="compare" value="#{ (irpf.other != null) }" />
	
	<c:choose>
		<c:when test="#{ value.class.name == 'java.lang.Double'}" >
			
			<c:if test="#{ compare }" >
				<aon:panelGrid columns="3" styleClass="aon-width-all " 
					columnClasses="aon-border aon-padding-right aon-text-right  aon-width-half
					, aon-noborder 
					, aon-border aon-padding-right aon-text-right aon-width-half">	
					<aon:outputText value="#{value}" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:outputText value="&#160;"/>
					<aon:outputText value="#{other }" styleClass="#{other != value ? 'aon-label-error' : '' }" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:panelGrid>
			</c:if> 

			<c:if test="#{ !compare }" >
				<aon:div styleClass="aon-border aon-padding-right aon-text-right " >
					<aon:outputText value="#{value}" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div> 
			</c:if> 

		</c:when>
		<c:when test="#{property == 'effectiveDate'}" >
			<aon:selectInputDate id="date"
				value="#{irpf.date}" required="true"
				inputSize="10" renderAsPopup="true" enableManualInput="true"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}">
				<a4j:support event="onchanged" actionListener="#{irpf.onReloadDraft}" reRender="irpfDraftContent, #{irpf.beanName}Toolbar" ajaxSingle="true"/>
				<a4j:support event="oninputchange" actionListener="#{irpf.onReloadDraft}" reRender="irpfDraftContent, #{irpf.beanName}Toolbar" ajaxSingle="true"/>
			</aon:selectInputDate>
		</c:when>		
		<c:when test="#{value.class.name == 'java.util.Date'}" >
			<aon:div styleClass="aon-border" >
				<aon:outputText value="#{value}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:div> 
		
		</c:when>
		<c:when test="#{value.class.name == 'com.esferalia.aon.payroll.enumeration.IrpfRegularizationReason'}" > 
			<c:if test="#{ compare }" >
				<aon:panelGrid columns="3" styleClass="aon-width-all " 
					columnClasses="aon-border  aon-width-half
					, aon-noborder
					, aon-border aon-width-half">	
					<aon:outputText value="#{value.causa}" />
					<aon:outputText value="&#160;"/>
					<aon:outputText value="#{other.causa}" styleClass="#{other != value ? 'aon-label-error' : '' }"  />
				</aon:panelGrid>
			</c:if>
			<c:if test="#{ !compare }" >
				<aon:div styleClass="aon-border" >
					<aon:outputText value="#{value.causa}" />
				</aon:div> 
			</c:if>
		</c:when>
		<c:otherwise>
			<c:if test="#{ compare }" >
				<aon:panelGrid columns="3" styleClass="aon-width-all " 
					columnClasses="aon-border  aon-width-half
					, aon-noborder
					, aon-border aon-width-half">	
					<aon:outputText value="#{value}" />
					<aon:outputText value="&#160;"/>
					<aon:outputText value="#{empty other ? '?' : other }" styleClass="#{other != value ? 'aon-label-error' : '' }"  />
				</aon:panelGrid>
			</c:if>
			<c:if test="#{ !compare }" >
				<aon:div styleClass="aon-border" >
					<aon:outputText value="#{value}" />
				</aon:div> 
			</c:if>
		</c:otherwise>
	</c:choose>
	

</ui:composition>
