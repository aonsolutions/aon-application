<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:fmt="http://java.sun.com/jstl/fmt">
		<c:if test="#{empty notitle}">
			<aon:div style="margin-left: 20px;">
				<aon:outputText value="&#160;"/>
			</aon:div>
		</c:if>
			
			<c:forEach
			step="1"
			begin="0"
			varStatus="status"
			var="displayItem"
			items="#{items.collection}" 
			>
				<c:if test="#{displayItem.difference ge 0.01}" >
				<aon:div styleClass="aon-label-error" style="border-bottom: solid #CCCCCC 1px;">
				
					<aon:outputText value="&#160;"/>
					<aon:outputText >
						${empty displayItem.oldAmount ? '?' : displayItem.oldAmount }
					</aon:outputText>
				</aon:div>
				</c:if>
				<c:if test="#{displayItem.difference lt 0.01}" >
				<aon:div  style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText >
						${empty displayItem.oldAmount ? '?' : displayItem.oldAmount }
					</aon:outputText>
				</aon:div>
				</c:if>
				
			</c:forEach>
			
			
</ui:composition>
