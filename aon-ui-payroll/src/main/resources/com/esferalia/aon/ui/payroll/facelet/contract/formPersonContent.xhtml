<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components" >
		
		<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{contract.to.person}" />
			<ui:param name="lookupDisabled" value="#{true}" />
			<ui:param name="skipInputText" value="#{true}" />
			<ui:param name="skipNewButton" value="#{true}" />
			<ui:param name="lookupInputSuggestSize" value="40" />
			<ui:param name="goToBackActionListener" value="contract.onPersonBack"/>
		</ui:include>
		
		
		<aon:outputText value="#{bundle.aon_document}" />
		<aon:div>
			<aon:outputText value="#{contract.to.person.registry.documentType}"/>
			<aon:outputText value=" ("/>
			<aon:outputText value="#{contract.to.person.registry.documentCountry.value}"/>
			<aon:outputText value=") - "/>
			<aon:outputText value="#{contract.to.person.registry.document}"/>
			<!-- ONLY FOR DEVELOPMENT  
			<aon:outputText value="&#160;(" />
			<aon:outputText value="#{contract.to.id}" />
			<aon:outputText value=")" />
			-->
		</aon:div>
		
		<aon:outputText value="#{bundle.registry_person_birthDate}" />
		<aon:div>
			<aon:outputText value="#{contract.to.person.birthDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText> 
			<aon:outputText value="&#160;(" rendered="#{contract.to.person.age!=null}"/>
			<aon:outputText value="#{contract.to.person.age}" rendered="#{contract.to.person.age!=null}"/>
			<aon:outputText value="&#160;#{bundle.aon_years}" rendered="#{contract.to.person.age!=null}"/>
			<aon:outputText value=")" rendered="#{contract.to.person.age!=null}"/>
		</aon:div>
		
		<aon:outputText value="#{bundle.registry_nationality}" />
		<aon:outputText value="#{contract.to.person.registry.nationality}" />
		
		<aon:outputText value="#{bundle.registry_person_nss}" />
		<aon:outputText value="#{contract.to.person.socialSecurityNumber}"/>

		<aon:outputText value="#{bundle.aon_address}" />
		<aon:outputText value="#{contract.to.person.registry.defaultAddress.fullAddress}"/>

</ui:composition>
