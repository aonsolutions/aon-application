<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components" >

	<aon:panelGrid columns="2" styleClass="aon-panelGrid-even"
		columnClasses="aon-panelGrid-odd aon-bold, aon-panelGrid-even" >
		
		<aon:outputText value="#{payrollBundle.payroll_enterprise}" />
		<aon:inputText disabled="#{true}" size="32" 
			value="#{contract.to.workPlace.enterprise.registry.fullName}"/>
		
		<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{contract.to.person}" />
			<ui:param name="lookupDisabled" value="#{true}" />
			<ui:param name="skipInputText" value="#{true}" />
			<ui:param name="skipNewButton" value="#{true}" />
			<ui:param name="lookupInputSuggestSize" value="40" />
			<ui:param name="goToBackActionListener" value="contract.onPersonBack"/>
		</ui:include>
		
		<aon:outputText value="#{bundle.aon_document}" />
		<aon:inputText disabled="#{true}" size="12"
			value="#{contract.to.person.registry.document}"/>
		
		<aon:outputText value="#{registryBundle.registry_person_birthDate}" />
		<aon:div>
			<aon:selectInputDate disabled="#{true}" 
				value="#{contract.to.person.birthDate}" 
				inputSize="10" 
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
			<aon:outputText value="&#160;(" rendered="#{contract.to.person.age!=null}"/>
			<aon:outputText value="#{contract.to.person.age}" rendered="#{contract.to.person.age!=null}"/>
			<aon:outputText value="&#160;#{bundle.aon_years}" rendered="#{contract.to.person.age!=null}"/>
			<aon:outputText value=")" rendered="#{contract.to.person.age!=null}"/>
		</aon:div>
		
		<aon:outputText value="#{registryBundle.registry_nationality}" />
		<aon:selectOneMenu disabled="#{true}"
			value="#{contract.to.person.registry.nationality}" >
			<f:selectItem value="#{null}" itemLabel="-"/>
			<f:selectItems value="#{commonCollections.countries}" />
		</aon:selectOneMenu>	
		
		<aon:outputText value="#{registryBundle.registry_person_nss}" />
		<aon:inputText disabled="#{true}" size="13"
			value="#{contract.to.person.socialSecurityNumber}"/>

		<aon:outputText value="#{registryBundle.registry_address}" />
		<aon:inputText disabled="#{true}" size="32"
			value="#{contract.to.person.registry.defaultAddress.fullAddress}"/>
		
	</aon:panelGrid>

</ui:composition>
