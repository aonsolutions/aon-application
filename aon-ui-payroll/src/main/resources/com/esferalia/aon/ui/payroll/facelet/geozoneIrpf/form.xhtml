<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="geozoneIrpfForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
		
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{bundle.payroll_geozoneIrpf_module}" />
					</aon:div>
		
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_reset}" />
					</aon:div>
		
					<aon:div id="toolbar" styleClass="aon-finding-toolbar-item-group">
					
						<aon:commandButton id="geozoneIrpf-search" 
							title="#{bundle.aon_key_search_accelerator}"
							value="#{bundle.aon_search}" 
							immediate="true"
							action="geozoneIrpf_search" 
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" >
							<aon:actionListener method="#{geozoneIrpf.onInitialize}" />
						</aon:commandButton>
						
						<aon:commandButton id="geozoneIrpf-cancel" 
							title="#{bundle.aon_key_cancel_accelerator}"
							value="#{bundle.aon_list}"
							reRender="aonContent"
							inmediate="true"
							action="geozoneIrpf_list"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}" />
						
					</aon:div>
					
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panel>
					<h:panelGrid columns="4">
						<aon:outputText styleClass="aon-margin-right aon-bold" 
							value="#{bundle.payroll_geozoneIrpf_irpf_of}" />
						<aon:outputText styleClass="aon-margin-right"
							value="#{geozoneIrpf.selectedIrpf.geozoneName}" />
						<aon:outputText styleClass="aon-margin-right aon-bold"
							value="#{bundle.aon_year}" />
						<aon:outputText 
							value="#{geozoneIrpf.selectedIrpf.year}" />
					</h:panelGrid>
				</aon:panel>
			
				<aon:panelTabSet>
					<aon:panelTab label="#{bundle.payroll_geozoneIrpf_descendant}">
						<ui:include
							src="/com/esferalia/aon/ui/payroll/facelet/geozoneIrpf/list_descendants.xhtml" />
					</aon:panelTab>
					<aon:panelTab label="#{bundle.payroll_geozoneIrpf_handicap_level}">
						<ui:include
							src="/com/esferalia/aon/ui/payroll/facelet/geozoneIrpf/list_handicap.xhtml" />
					</aon:panelTab>
				</aon:panelTabSet>
			</aon:div>
						
		</aon:form>
	</ui:define>
</ui:composition>
