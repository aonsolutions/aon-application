<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="geozoneIrpfForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_geozoneIrpf_module}" />
				<ui:param name="controller" value="#{geozoneIrpf}" />
				<ui:param name="skipSaveButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="8" >
				
					<aon:outputText value="#{bundle.aon_name}" />
					<aon:outputText value="#{geozoneIrpf.to.geozone.name}"  />
				
					<aon:outputText value="#{payrollBundle.payroll_irpfData_anual_retribution}" />
					<aon:outputText value="#{geozoneIrpf.to.amount}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				
					<aon:outputText value="#{bundle.aon_start_date}" />
					<aon:outputText value="#{geozoneIrpf.to.startDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>		
				
					<aon:outputText value="#{bundle.aon_end_date}" />
					<aon:outputText value="#{geozoneIrpf.to.endDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>		
							

				</aon:panelGrid>
				
			</aon:div>
				
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width:100%;" 
					columnClasses="
					aon-panelGrid-even aon-noborder aon-vertical-align-top aon-width-auto, 
					aon-panelGrid-even aon-noborder aon-vertical-align-top aon-width-auto">
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_geozoneIrpf_descendant}" />
						</f:facet>
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
							<ui:param name="controller" value="#{geozoneIrpfDescendant}" />
							<ui:param name="skipSelectButton" value="true" />
							<ui:define name="columns">
								<ui:include 
									src="/com/esferalia/aon/ui/payroll/facelet/geozoneIrpf/descendant/listContent.xhtml" />
							</ui:define>
						</ui:decorate>
					</aon:panel>
										
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_irpfData_disability}" />
						</f:facet>
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
							<ui:param name="controller" value="#{geozoneIrpfHandicap}" />
							<ui:param name="skipSelectButton" value="true" />
							<ui:define name="columns">
								<ui:include 
									src="/com/esferalia/aon/ui/payroll/facelet/geozoneIrpf/handicap/listContent.xhtml" />
							</ui:define>
						</ui:decorate>
					</aon:panel>
				</aon:panelGrid>
<!--  
-->				
			</aon:div>
						
		</aon:form>
	</ui:define>
</ui:composition>
