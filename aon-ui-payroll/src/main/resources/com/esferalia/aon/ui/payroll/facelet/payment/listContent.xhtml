<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
		<c:if test="#{empty notitle}">
			<aon:div style="margin-left: 20px;">
				<aon:outputText value="#{empty title ? payments.name : title }" />
			</aon:div>
			<aon:outputText value="&#160;"/>
			<aon:outputText value="&#160;"/>
		</c:if>
			
			<c:forEach  var="payment" items="#{payments.collection}">
				<aon:div style="margin-left: 30px; border-bottom: solid #CCCCCC 1px;">
					<aon:outputText>
						#{payment.description}
					</aon:outputText>
				</aon:div>
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
				</aon:div>
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText >
						${payment.amount}
					</aon:outputText>
				</aon:div>
			</c:forEach>
			
</ui:composition>
