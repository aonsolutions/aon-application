<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<aon:dataTable id="ContractPaymentTable" var="to" value="#{controller.paymentsModel}" rows="0">
		<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton id="ContractPayment-select"
				title="#{(controller.contractScope)?(bundle.aon_update):(payrollBundle.payroll_overwrite)}" 
				actionListener="#{controller.onEdit}"
				reRender="#{controller.beanName}ModalContainer"
				styleClass="aon-editDataTable-button #{(controller.contractScope)?('aon-icon-rowSelector'):('aon-icon-go')}"/>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton
						id="ContractPayment-reset" 
						title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						actionListener="#{controller.onReset}"
						reRender="#{controller.beanName}ModalContainer"
						styleClass="aon-editDataTable-button aon-icon-reset"
						accesskey="#{bundle.aon_key_new_line}"/>
				</aon:div>
			</f:facet>
		</aon:column>
		
		<c:if test="#{!skipScopeColumn}">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
				<f:facet name="header">
					<aon:outputText	value="#{bundle.aon_scope}" />
				</f:facet>
				<aon:outputText value="#{to.scope}" />
			</aon:column>
		</c:if>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.salaryType}" />
		</aon:column>

		<c:if test="#{!skipStartDateColumn}">
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-120">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_start_date}" />
				</f:facet>
				<aon:outputText value="#{to.startDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
		</c:if>
		
		<c:if test="#{!skipEndDateColumn}">
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-120">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_end_date}" />
				</f:facet>
				<aon:outputText value="#{to.endDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
			</aon:column>
		</c:if>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{payrollBundle.payroll_salary_payment_month}" />
			</f:facet>
			<aon:outputText value="#{to.month}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_concept}" />
			</f:facet>
			<aon:outputText value="#{to.paymentConcept.code}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_description}" />
			</f:facet>
			<aon:outputText value="#{(to.description!=null)?(to.description):(to.paymentConcept.description)}" />
		</aon:column>
 
	</aon:dataTable>
	
</ui:composition>
