<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<c:if test="#{showSearchOption}" >
		<aon:panelGrid columns="1" style="width: 100%;"
			columnClasses="aon-panelGrid-even  aon-width-auto">
			<aon:selectOneRadio value="#{contractPayment.searchCurrent}">
				<f:selectItem itemLabel="#{bundle.payroll_current}" itemValue="#{true}" />
				<f:selectItem itemLabel="#{bundle.payroll_historyc}" itemValue="#{false}" />
				<a4j:support event="onclick" reRender="contractPaymentTable" >
					<aon:actionListener method="#{contractPayment.initialize}" />
				</a4j:support>
			</aon:selectOneRadio>
		</aon:panelGrid>
	</c:if>
	
	<aon:dataTable id="contractPaymentTable" var="to" value="#{controller.paymentsModel}" rows="0">
		<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton id="ContractPayment-select"
				title="#{(controller.readOnly)?(bundle.payroll_overwrite):(bundle.aon_update)}" 
				actionListener="#{controller.onEdit}"
				reRender="#{controller.beanName}ModalContainer"
				styleClass="aon-editDataTable-button #{(controller.readOnly)?('aon-icon-go'):('aon-icon-rowSelector')}"/>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton
						id="ContractPayment-reset" 
						title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						actionListener="#{controller.onReset}"
						reRender="#{controller.beanName}ModalContainer"
						styleClass="aon-editDataTable-button aon-icon-reset"
						accesskey="#{bundle.aon_key_new_line}"/>
				</aon:div>
			</f:facet>
		</aon:column>
		
		<c:if test="#{!skipScopeColumn}">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
				<f:facet name="header">
					<aon:outputText	value="#{bundle.aon_scope}" />
				</f:facet>
				<aon:outputText value="#{to.scope}" />
			</aon:column>
		</c:if>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.salaryType}" />
		</aon:column>

		<c:if test="#{!skipStartDateColumn}">
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-120">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_start_date}" />
				</f:facet>
				<aon:outputText value="#{to.startDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
		</c:if>
		
		<c:if test="#{!skipEndDateColumn}">
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-120">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_end_date}" />
				</f:facet>
				<aon:outputText value="#{to.endDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
			</aon:column>
		</c:if>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_salary_payment_month}" />
			</f:facet>
			<aon:outputText value="#{to.month}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
			<f:facet name="header">
				<aon:outputText	value="#{bundle.aon_concept}" />
			</f:facet>
			<aon:outputText value="#{to.paymentConcept.code}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_description}" />
			</f:facet>
			<aon:outputText value="#{to.fullDescription}" />
		</aon:column>
 
	</aon:dataTable>
	
</ui:composition>
