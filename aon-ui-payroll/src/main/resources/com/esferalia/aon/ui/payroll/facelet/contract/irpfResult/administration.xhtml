<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div  >
		<c:choose>
			<c:when test="#{administration == 'ALAVA'}">
				<aon:outputText value="Araba/Álava" />
			</c:when>
			<c:when test="#{administration == 'BIZKAIA'}">
				<aon:outputText value="Bizkaia" />
			</c:when>
			<c:when test="#{administration == 'GIPUZKOA'}">
				<aon:outputText 
				style="background: #ffffff url(#{aonResource.resolve['/com/esferalia/aon/ui/payroll/images/gipuzkoa.png']} ) no-repeat left center; padding: 16px 0px 16px 32px; "
				value="Gipuzkoa" />
			</c:when>
			<c:when test="#{administration == 'NAVARRA'}">
				<aon:outputText value="Navarra" />
			</c:when>
			<c:otherwise>
				<aon:outputText  
				style="background: #ffffff url(#{aonResource.resolve['/com/esferalia/aon/ui/payroll/images/aeat.png']} ) no-repeat left center; padding: 16px 0px 16px 32px; " 
				value="Agencia Tributaria" />
			</c:otherwise>
		</c:choose>
	</aon:div>

</ui:composition>
