<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="paymentConceptSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_paymentConcept_module}" />
				<ui:param name="controller" value="#{paymentConcept}" />
			</ui:include>
			
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{paymentConcept}" />
				<ui:define name="searchContent">
					<aon:outputLabel for="PaymentConcept_code"
						value="#{bundle.aon_id}" />
					<aon:inputText id="PaymentConcept_code" size="5" maxlength="5"
						valueChangeListener="#{paymentConcept.addExpression}" />

					<aon:outputLabel for="PaymentConcept_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="PaymentConcept_description" size="64" maxlength="64"
						valueChangeListener="#{paymentConcept.addExpression}" />
						
				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>
</ui:composition>
