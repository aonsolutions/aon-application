<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html" >

	<aon:methodParam name="resetAction" value="" />
	
	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">	
		<ui:param name="skipSearchButton" value="true" />
		<ui:param name="resetButtonReRender" value="#{controller.beanName}Content" />		
	</ui:include>

	<aon:methodParam name="rowSelectorAction" value="" />
	
	<aon:div styleClass="aon-scroll-area">	
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:param name="controller" value="#{enterpriseActivity}" />
			<ui:param name="rowSelectorReRender" value="#{controller.beanName}Content" />
			
			<ui:define name="columns">
			
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_description}" />
					</f:facet>
					<aon:outputText value="#{to.description}" />
				</aon:column>
				
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.company_cnae2009_module}" />
					</f:facet>
					<aon:outputText value="#{to.cnae2009.title}"  />
				</aon:column>
		
				<aon:column styleClass="aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_activity_principal}" />
					</f:facet>
					<aon:outputText styleClass="#{to.principal ? ('aon-icon-checked') : ('aon-icon-check')} aon-padding-left" 
						value="&#160;" />
				</aon:column>
		
			</ui:define>
		</ui:decorate>
	</aon:div>

</ui:composition>
