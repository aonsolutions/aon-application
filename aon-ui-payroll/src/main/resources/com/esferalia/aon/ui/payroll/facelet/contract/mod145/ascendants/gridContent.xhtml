<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components" >

	<aon:column styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputLabel for="Mod145Ascendants_birthYear"
				value="#{payrollBundle.payroll_mod145_birthYear}" />
		</f:facet>
		<aon:outputText value="#{to.birthYear}" 
			rendered="#{formList}" />
		<rich:inputNumberSpinner id="Mod145Ascendants_birthYear" required="true"
			rendered="#{formEdit}" 
			value="#{to.birthYear}" 
			inputSize="4" minValue="1900" maxValue="2020" />
		<f:facet name="footer">
			<rich:inputNumberSpinner id="Mod145Ascendants_birthYear-New" required="true"
				rendered="#{formNew}" 
				value="#{controller.to.birthYear}" 
				inputSize="4" minValue="1900" maxValue="2020" />
		</f:facet>
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputLabel for="Mod145Ascendants_disabilityLevel"
				value="#{payrollBundle.payroll_mod145_disabilityLevel}" />
		</f:facet>
		<aon:outputText value="#{to.disabilityLevel}" 
			rendered="#{formList}" />
		<aon:selectOneMenu id="Mod145Ascendants_disabilityLevel" rendered="#{formEdit}" 
			value="#{to.disabilityLevel}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{payrollCollections.disabilityLevels}" />
		</aon:selectOneMenu>
		<f:facet name="footer">
			<aon:selectOneMenu id="Mod145Ascendants_disabilityLevel-New" rendered="#{formNew}"
				value="#{controller.to.disabilityLevel}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{payrollCollections.disabilityLevels}" />
			</aon:selectOneMenu>
		</f:facet>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputLabel for="Mod145Ascendants_dependence"
				value="#{payrollBundle.payroll_mod145_dependence}" />
		</f:facet>
		<aon:outputText value="&#160;" style="padding-left: 15px;" rendered="#{formList}"
			styleClass="#{to.dependence?'aon-icon-checked':'aon-icon-check'}"/>
		<aon:selectBooleanCheckbox id="Mod145Ascendants_dependence" rendered="#{formEdit}" value="#{to.dependence}"/>
		<f:facet name="footer">
			<aon:selectBooleanCheckbox id="Mod145Ascendants_dependence-New" rendered="#{formNew}" value="#{controller.to.dependence}"/>
		</f:facet>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputLabel for="Mod145Ascendants_anotherDescendient"
				value="#{payrollBundle.payroll_mod145_anotherDescendient}" />
		</f:facet>
		<aon:outputText value="&#160;" style="padding-left: 15px;" rendered="#{formList}"
			styleClass="#{to.anotherDescendient?'aon-icon-checked':'aon-icon-check'}"/>
		<aon:selectBooleanCheckbox id="Mod145Ascendants_anotherDescendient" rendered="#{formEdit}" value="#{to.anotherDescendient}"/>
		<f:facet name="footer">
			<aon:selectBooleanCheckbox id="Mod145Ascendants_anotherDescendient-New" rendered="#{formNew}" value="#{controller.to.anotherDescendient}"/>
		</f:facet>
	</aon:column>

</ui:composition>
