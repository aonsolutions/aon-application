<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:dataTable id="GeozoneIrpfDescendantsTable" var="to" value="#{geozoneIrpf.descendantModel}" rows="50">
	
		<aon:rowSelector id="GeozoneIrpfDescendantsList-select" style="cursor:default;" 
			toggleOnClick="#{false}" />

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText 
					value="#{bundle.aon_date_from}" />
			</f:facet>
			<aon:outputText value="#{to.fromAmount}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText
					value="#{bundle.aon_date_to}" />
			</f:facet>
			<aon:outputText value="#{to.toAmount==null?'>':(to.toAmount-0.01)}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="0" />
			</f:facet>
			<aon:outputText value="#{to.descendants[0].percent}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="1" />
			</f:facet>
			<aon:outputText value="#{to.descendants[1].percent}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="2" />
			</f:facet>
			<aon:outputText value="#{to.descendants[2].percent}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="3" />
			</f:facet>
			<aon:outputText value="#{to.descendants[3].percent}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="4" />
			</f:facet>
			<aon:outputText value="#{to.descendants[4].percent}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="5" />
			</f:facet>
			<aon:outputText value="#{to.descendants[5].percent}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="6+" />
			</f:facet>
			<aon:outputText value="#{to.descendants[6].percent}" >
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
				
	</aon:dataTable>

</ui:composition>
