<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html" >

	<aon:panelGrid id="dataTable" columns="2" >
		<aon:outputLabel for="PaymentConcept_code"
			value="#{bundle.aon_id}" />
		<aon:inputText id="PaymentConcept_code" size="5" maxlength="5"
			value="#{lookup.to.code}" />
	
		<aon:outputLabel for="PaymentConcept_type"
			value="#{bundle.aon_type}" />
		<aon:selectOneMenu id="PaymentConcept_type" 
			value="#{lookup.to.type}" converter="aon.EnumConverter" >
			<f:selectItems value="#{payrollCollections.paymentTypes}" />
		</aon:selectOneMenu>	
	
		<aon:outputLabel for="PaymentConcept_description"
			value="#{bundle.aon_description}" />
		<aon:inputText id="PaymentConcept_description" size="64" maxlength="64"
			value="#{lookup.to.description}" />
			
		<aon:outputText value="&#160;"/>
		<aon:panelGroup>
			<aon:selectBooleanCheckbox id="PaymentConcept_decorateDescription" value="#{lookup.to.descriptionDecorable}" />
			<aon:outputLabel for="PaymentConcept_decorateDescription" value="#{payrollBundle.payroll_salary_show_expression}" />
		</aon:panelGroup>
	
		<aon:outputLabel for="PaymentConcept_expression"
			value="#{payrollBundle.payroll_salary_expression}" />
		<aon:inputTextarea id="PaymentConcept_expression" cols="60" rows="5" maxlength="128"
			value="#{lookup.to.expression}">
			<f:validateLength maximum="128"/>
		</aon:inputTextarea>
	
		<aon:outputLabel for="PaymentConcept_irpf_expression"
			value="#{payrollBundle.payroll_salary_irpf_expression}" />
		<aon:div id="PaymentConcept_taxation">
			<aon:selectOneMenu id="PaymentConcept_irpf_taxation"  
				value="#{lookup.to.taxation}">
				<f:selectItems value="#{payrollCollections.taxationTypes}" />
				<a4j:support event="onchange" reRender="PaymentConcept_taxation" ajaxSingle="true" />
			</aon:selectOneMenu>
			<br />
			<aon:inputTextarea id="PaymentConcept_irpf_expression" cols="60" rows="5" maxlength="128"
				rendered="#{lookup.to.taxation=='MANUAL'}"
				value="#{lookup.to.irpfExpression}">
				<f:validateLength maximum="128"/>
			</aon:inputTextarea>
		</aon:div>
	
		<aon:outputLabel for="PaymentConcept_quote_expression"
			value="#{payrollBundle.payroll_salary_quote_expression}" />
		<aon:div id="PaymentConcept_quote">
			<aon:selectOneMenu id="PaymentConcept_quote_quote"  
				value="#{lookup.to.quote}">
				<f:selectItems value="#{payrollCollections.quoteTypes}" />
				<a4j:support event="onchange" reRender="PaymentConcept_quote" ajaxSingle="true" />
			</aon:selectOneMenu>
			<br />
			<aon:inputTextarea id="PaymentConcept_quote_expression" cols="60" rows="5" maxlength="128"
				rendered="#{lookup.to.quote=='MANUAL'}"
				value="#{lookup.to.quoteExpression}">
				<f:validateLength maximum="128"/>
			</aon:inputTextarea>
		</aon:div>
	</aon:panelGrid>
		
</ui:composition>
