	xmlns:f="http://java.sun.com/jsf/core"

	xmlns:c="http://java.sun.com/jstl/core"

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:param name="innerToolbar" value="#{true}" />
		<ui:param name="toolbarID" value="aonToolbar-contractPdfField" />
		<ui:define name="toolbarContent">
		<aon:commandButton id="contractPdfField-save"
			value="#{bundle.aon_save}" 
			actionListener="#{controller.onSaveDomainFields}"
			styleClass="aon-finding-toolbar-item aon-icon-accept" />
		</ui:define>
	</ui:decorate>

	<aon:panelTabSet switchType="ajax">
						
		<aon:panelTab label="Indefinido" >
			<a4j:repeat var="to" value="#{controller.indefiniteFieldList}">
				<aon:panelGrid columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-350, aon-panelGrid-even aon-width-auto" >
				
					<aon:outputText value="#{to.name}" />
					<aon:inputText value="#{to.expression}"
						maxlength="128" size="64"
						rendered="#{!to.check}" />
					<aon:selectBooleanCheckbox value="#{to.expression}"
						rendered="#{to.check and !to.composite}" />
					<aon:selectOneMenu value="#{to.expression}"
						rendered="#{to.check and to.composite}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{to.compositeList}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</a4j:repeat>
		</aon:panelTab>
		<aon:panelTab label="Temporal" >
			<a4j:repeat var="to" value="#{controller.temporaryFieldList}">
				<aon:panelGrid columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-350, aon-panelGrid-even aon-width-auto" >
				
					<aon:outputText value="#{to.name}" />
					<aon:inputText value="#{to.expression}"
						maxlength="128" size="64"
						rendered="#{!to.check}" />
					<aon:selectBooleanCheckbox value="#{to.expression}"
						rendered="#{to.check and !to.composite}" />
					<aon:selectOneMenu value="#{to.expression}"
						rendered="#{to.check and to.composite}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{to.compositeList}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</a4j:repeat>
		</aon:panelTab>
		<aon:panelTab label="Formacion" >
			<a4j:repeat var="to" value="#{controller.learningFieldList}">
				<aon:panelGrid columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-350, aon-panelGrid-even aon-width-auto" >
				
					<aon:outputText value="#{to.name}" />
					<aon:inputText value="#{to.expression}"
						maxlength="128" size="64"
						rendered="#{!to.check}" />
					<aon:selectBooleanCheckbox value="#{to.expression}"
						rendered="#{to.check and !to.composite}" />
					<aon:selectOneMenu value="#{to.expression}"
						rendered="#{to.check and to.composite}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{to.compositeList}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</a4j:repeat>
		</aon:panelTab>
		<aon:panelTab label="Practicas" >
			<a4j:repeat var="to" value="#{controller.practiceFieldList}">
				<aon:panelGrid columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-350, aon-panelGrid-even aon-width-auto" >
				
					<aon:outputText value="#{to.name}" />
					<aon:inputText value="#{to.expression}"
						maxlength="128" size="64"
						rendered="#{!to.check}" />
					<aon:selectBooleanCheckbox value="#{to.expression}"
						rendered="#{to.check and !to.composite}" />
					<aon:selectOneMenu value="#{to.expression}"
						rendered="#{to.check and to.composite}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{to.compositeList}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</a4j:repeat>
		</aon:panelTab>
	
	</aon:panelTabSet>
