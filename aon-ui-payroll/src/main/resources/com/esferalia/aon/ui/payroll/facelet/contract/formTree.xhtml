<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/esferalia/aon/ui/payroll/facelet/enterpriseTree/treeTemplate.xhtml">

	<ui:define name="content">
	
		<aon:form id="contractForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_contract_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="Contract-Save"
						value="#{bundle.aon_accept}"
						reRender="dataGrid"
						styleClass="aon-finding-toolbar-item aon-icon-accept">
						<aon:actionListener method="#{contract.accept}" />
						<aon:actionListener method="#{contract.onShowVariables}" />
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>	
		
			<aon:div id="contractMainGrid" styleClass="aon-scroll-area">
				<ui:include 
					src="/com/esferalia/aon/ui/payroll/facelet/contract/formContent.xhtml" >
					<ui:param name="controller" value="#{contract}" />
				</ui:include>
			</aon:div>
		
			<ui:param name="controller" value="#{contract}" />
			<aon:div id="dataGrid" styleClass="aon-scroll-area">
				
				<aon:div id="#{controller.beanName}VarContainer" 
					rendered="#{!controller.new and controller.variablesModel!=null}">
					<aon:panelGrid columns="1" style="width: 100%; margin-top:10px;"
						columnClasses="aon-panelGrid-even  aon-width-auto">
						<aon:div>
							<aon:outputText value="&#160;" style="padding-left:15px;" styleClass="aon-icon-search"/>
							<aon:outputText value="#{payrollBundle.payroll_contract_variables}" 
								styleClass="aon-bold"/>
						</aon:div>
					</aon:panelGrid>	
					
					<c:if test="#{controller.data==null}" >
						<aon:editDataTable id="#{controller.beanName}VariablesList"
							value="#{controller.variablesModel}" var="to" rows="20" >
							
							<aon:column 
								styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:commandButton 
									rendered="#{to.id!=null}"
									title="#{bundle.aon_update}" 
									actionListener="#{controller.onSelectVariable}"
									reRender="#{controller.beanName}VarContainer"
									styleClass="aon-editDataTable-button aon-icon-rowSelector" />
								<aon:commandButton 
									rendered="#{to.id==null}"
									title="#{payrollBundle.payroll_overwrite}" 
									actionListener="#{controller.onSelectVariable}"
									reRender="#{controller.beanName}VarContainer"
									styleClass="aon-editDataTable-button aon-icon-go" />
								<f:facet name="footer">
									<aon:commandButton
										title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
										actionListener="#{controller.onResetVariable}"
										reRender="#{controller.beanName}VarContainer"
										styleClass="aon-editDataTable-button aon-icon-reset"
										accesskey="#{bundle.aon_key_new_line}"/>
								</f:facet>
							</aon:column>
							
							<ui:include 
								src="/com/esferalia/aon/ui/payroll/facelet/variables/data/list_content.xhtml" >
								<ui:param name="controller" value="#{controller}" />
								<aon:valueParam name="formList" value="true" />
							</ui:include>
							
						</aon:editDataTable>
						<aon:dataScroller2 for="#{controller.beanName}VariablesList" showNote="false" />
						
						<c:if test="#{controller.undefinedVariablesModel!=null}" >
							<ui:include 
								src="/com/esferalia/aon/ui/payroll/facelet/variables/data/grid_undefined.xhtml" >
								<ui:param name="controller" value="#{controller}" />
								<aon:valueParam name="formList" value="true" />
								<aon:valueParam name="saveReRender" value="#{controller.beanName}VarContainer" />
							</ui:include>
						</c:if>
					</c:if>
								
					<c:if test="#{controller.data!=null}" >
						<ui:include 
							src="/com/esferalia/aon/ui/payroll/facelet/variables/data/formContent.xhtml" >
							<ui:param name="controller" value="#{controller}" />
							<aon:valueParam name="container" value="#{controller.beanName}VarContainer" />
						</ui:include>
					</c:if>
					
				</aon:div>

			</aon:div>
		
		</aon:form>
	</ui:define>
</ui:composition>
