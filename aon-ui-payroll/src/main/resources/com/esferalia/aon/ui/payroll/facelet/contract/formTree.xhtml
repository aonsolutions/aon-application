<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/esferalia/aon/ui/payroll/facelet/enterpriseTree/treeTemplate.xhtml">

	<ui:define name="content">
	
		<aon:form id="contractForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_contract_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="Contract-Save"
						value="#{bundle.aon_accept}"
						reRender="dataGrid"
						styleClass="aon-finding-toolbar-item aon-icon-accept">
						<aon:actionListener method="#{contract.accept}" />
						<aon:actionListener method="#{contract.onShowVariables}" />
					</aon:commandButton>
					<aon:commandButton id="IRPF-calculator"
						value="#{payrollBundle.payroll_contract_irpf_data}"
						action="irpfData_form"
						styleClass="aon-finding-toolbar-item aon-icon-aeat">
						<aon:actionListener method="#{contract.onShowIrpfData}" />
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>	
		
			<aon:div id="contractMainGrid" styleClass="aon-scroll-area">
				<ui:include 
					src="/com/esferalia/aon/ui/payroll/facelet/contract/formContent.xhtml" >
					<ui:param name="controller" value="#{contract}" />
				</ui:include>
			</aon:div>
		
			<aon:div id="dataGrid" styleClass="aon-scroll-area">
				
				<aon:div styleClass="aon-panelGrid-search" 
					style="width: 100%; margin-bottom:10px; padding:10px 0 10px 10px;">
						
					<aon:outputText value="#{payrollBundle.payroll_data_filter}" styleClass="aon-bold" />
					
					<aon:selectOneRadio value="#{contract.searchCurrent}" style="display:inline;">
						<f:selectItem itemLabel="#{payrollBundle.payroll_current}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{payrollBundle.payroll_historyc}" itemValue="#{false}" />
						<a4j:support event="onclick" reRender="dataGrid" ignoreDupResponses="true" >
							<aon:actionListener method="#{contract.reloadData}" />
						</a4j:support>
					</aon:selectOneRadio>
					
					<aon:outputLabel styleClass="aon-italic aon-margin-left aon-margin-right"
						value="#{bundle.aon_end_date}:" />
					<aon:selectInputDate  
						disabled="#{contract.searchCurrent}"
						value="#{contract.inactiveDate}"
						inputSize="10" renderAsPopup="true" enableManualInput="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
						<a4j:support event="onchange" reRender="dataGrid" ignoreDupResponses="true">
							<aon:actionListener method="#{contract.reloadData}" />
						</a4j:support>
					</aon:selectInputDate>
					<aon:selectOneMenu 
						disabled="#{contract.searchCurrent}"
						value="#{contract.inactiveLastPeriod}" >
						<f:selectItems value="#{payrollCollections.inactiveLastPeriods}" />
						<a4j:support event="onchange" reRender="dataGrid" ignoreDupResponses="true" >
							<aon:actionListener method="#{contract.onChangeLastPeriod}" />
							<aon:actionListener method="#{contract.reloadData}" />
						</a4j:support>
					</aon:selectOneMenu>
	
				</aon:div>	
				
				<ui:include 
					src="/com/esferalia/aon/ui/payroll/facelet/variables/data/grid.xhtml" >
					<ui:param name="controller" value="#{contract}" />
				</ui:include>
				
			</aon:div>
		
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{agreementLookup}" />
		
	</ui:define>
</ui:composition>
