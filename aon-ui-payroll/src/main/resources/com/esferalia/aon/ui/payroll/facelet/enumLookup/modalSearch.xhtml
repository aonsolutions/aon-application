<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showEnumLookupWindow">
		<c:if test="#{ssEnumLookup.showEnumLookupWindow}">
			<rich:modalPanel id="enumLookupModalPanel" minHeight="600"
				minWidth="850" showWhenRendered="true" zindex="90"
				style="overflow:auto;">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_key_search_description}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showEnumLookupWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{ssEnumLookup.showEnumLookupWindow}" value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="enumLookupModalForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									
									<aon:div styleClass="aon-panelGrid-search aon-margin-bottom">
										<aon:div styleClass="aon-panelGrid-search-info">
											<aon:outputText value="#{bundle.aon_filter}" styleClass="aon-panelGrid-search-info-internal"/>
										</aon:div>
										<aon:panelGrid columns="1">
											<aon:inputText id="payrollCodeTablesFilter" size="150" value="#{ssEnumLookup.codesFilter}">
												<a4j:support 
													event="onkeyup"
													actionListener="#{ssEnumLookup.onInitSSCodesModels}"
													reRender="enumLookupModalForm"
													eventsQueue="payrollCodeTablesFilterKeyUp"
													requestDelay="500"
													ajaxSingle="true"
													ignoreDupResponses="true"
													limitToList="true"/>
											</aon:inputText>
										</aon:panelGrid>	
									</aon:div>
								
									<aon:dataTable id="ssCodeList" value="#{ssEnumLookup.codesModel}" var="to">
					
										<aon:rowSelector id="ssCodelList-select" 
											reRender="showEnumLookupWindow, contract-panelTab"
											actionListener="#{ssEnumLookup.onSelect}" />
										
										<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
											<f:facet name="header">
												<aon:outputLabel value="#{bundle.aon_name}" />
											</f:facet>
											<aon:outputText value="#{to.code}"  />
										</aon:column>
					
										<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
											<f:facet name="header">
												<aon:outputLabel 
													value="#{bundle.aon_description}" />
											</f:facet>
											<aon:outputText value="#{to.description}"/>
										</aon:column>
										
									</aon:dataTable>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
				
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>
</ui:composition>
