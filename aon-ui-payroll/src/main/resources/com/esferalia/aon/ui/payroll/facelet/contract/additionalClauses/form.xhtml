<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:div id="clausesContent" style="width:850px;">
		
		<aon:panel rendered="#{contractClauses.existEnterpriseClauses}">
			<aon:selectBooleanCheckbox id="Enterprise_contractClauses"
				value="#{contractClauses.useEnterpriseClauses}" >
				<a4j:support event="onclick" reRender="clausesContent" />
			</aon:selectBooleanCheckbox>
			<aon:outputLabel for="Enterprise_contractClauses" styleClass="aon-margin-right"
				value="#{bundle.payroll_contract_additional_clauses_enterprise}" />
		</aon:panel>
		 
		<aon:div>
			<c:if test="#{!contractClauses.useEnterpriseClauses}">
				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{bundle.payroll_contract_custom_clauses}" />
					</f:facet>
					<aon:inputTextarea 
						rendered="#{!contractClauses.useEnterpriseClauses}" 
						value="#{contractClauses.customClauses}"
						cols="145" rows="30"/>
				</aon:panel>
			</c:if>
			<c:if test="#{contractClauses.useEnterpriseClauses}">
				<aon:panelGrid columns="2" styleClass="aon-width-all" >
					<aon:outputLabel value="#{bundle.aon_document}" />
					<aon:selectOneMenu value="#{contractClauses.selectedEnterpriseClause}"
						disabled="#{!contractClauses.useEnterpriseClauses}" >
						<f:selectItems value="#{contractClauses.clausesList}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</c:if>
		</aon:div>
		
	</aon:div>
	
</ui:composition>
