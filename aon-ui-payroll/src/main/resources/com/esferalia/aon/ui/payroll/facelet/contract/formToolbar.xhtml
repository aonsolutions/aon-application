<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components" >

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_contract_module}" />
		<ui:param name="controller" value="#{contract}" />
		<ui:param name="skipRemoveButton" value="#{contract.to.status!='PENDING'}" />
		<ui:param name="showMoreMenu" value="#{!contract.new}" />
		
		<ui:define name="beforeSpinToolbarContent">
			
		</ui:define>
		
		<ui:define name="additionalToolbarContent">
			<aon:div style="float:right;margin-right:0;">
				<aon:outputText value="VISTA" 
					styleClass="aon-finding-toolbar-item"/>
				<aon:commandButton id="viewMode-form" 
					value="&#160;" title="Modo formulario"
					disabled="true"
					styleClass="aon-finding-toolbar-item aon-finding-toolbar-item-no-border aon-icon-category"/>
				<aon:commandButton id="viewMode-graph" 
					value="&#160;" title="Modo grafico"
					disabled="true"
					styleClass="aon-finding-toolbar-item aon-finding-toolbar-item-no-border aon-icon-page"/>
			</aon:div>
		</ui:define>
		
		<ui:define name="moreMenuContent">
			<c:if test="#{!contract.skipPayrollData}" >
				<aon:menuItem 
					value="#{payrollBundle.payroll_contractCalendarEvent}"
					iconClass="aon-icon-daily-tracking"
					rendered="#{!contract.new}"
					action="contractCalendarEvent_form" >
					<f:setPropertyActionListener
						target="#{contractCalendarEvent.backActionListener}" value="contractCalendarEvent.onBack" />
					<f:setPropertyActionListener
						target="#{contractCalendarEvent.forceBackAction}" value="true" />
					<f:setPropertyActionListener
						target="#{contractCalendarEvent.backAction}" value="contract_form" />
				</aon:menuItem>
				<aon:menuItem id="contract_leave"
					value="#{payrollBundle.payroll_contractLeave_module}"
					action="contractLeave_form"
					iconClass="aon-icon-copy">
					<f:setPropertyActionListener
						target="#{contractLeave.treeOutcome}" value="#{true}" />
					<f:setPropertyActionListener
						target="#{contractLeave.contractEditable}" value="#{false}" />
					<aon:actionListener method="#{contract.onShowContractLeave}" />
					<f:setPropertyActionListener
						target="#{contractLeave.backAction}" value="contract_form" />
				</aon:menuItem>
				<aon:menuItem id="settle"
					value="#{payrollBundle.payroll_settle_module}"
					action="settle_form"
					rendered="#{contract.to.endDate==null}"
					iconClass="aon-icon-black-list">
					<f:setPropertyActionListener
						target="#{settle.backAction}" value="contract_form" />
					<aon:actionListener method="#{contract.onShowSettle}" />
				</aon:menuItem>
				<aon:menuItem id="IRPF-calculator"
					value="#{payrollBundle.payroll_contract_irpf_data}"
					action="irpfData_form"
					iconClass="aon-icon-aeat">
					<aon:actionListener method="#{contract.onShowIrpfData}" />
					<f:setPropertyActionListener
						target="#{irpfData.backAction}" value="contract_form" />
				</aon:menuItem>
			</c:if>
			
			<aon:menuItem id="document-issue" 
				value="#{payrollBundle.payroll_contract_generate_document}"
				rendered="#{!contract.new and contract.to.pending}"
				reRender="contract-panelTab"
				actionListener="#{contract.onGenerateDocument}"
				iconClass="aon-icon-new-page"
				onclick="Richfaces.showModalPanel('waitProccess')" 
 				oncomplete="Richfaces.hideModalPanel('waitProccess')" />

			<!--  
			<aon:menuItem id="document-extension" 
				value="Prorroga"
				disabled="true"
				iconClass="aon-icon-attach-file" />
			-->
			
			<rich:menuGroup 
				value="Editar documentos"
				iconClass="aon-menuGroup-styleClass">
				<aon:menuItem id="documentDraft-edition" 
					action="contractPdfEdition_form" ajaxSingle="true"
					rendered="#{not empty contract.to.model and not contract.existSignedContractDocument}"
					value="Contrato"
					title="Edicion manual del documento del contrato"
					iconClass="aon-icon-page" >
					<f:setPropertyActionListener
						target="#{contractPdf.documentType}" value="#{contractPdf.contractPdfType}" />
					<f:setPropertyActionListener
						target="#{contractPdf.backAction}" value="contract_form" />
					<aon:actionListener method="#{contractPdf.onContractDocumentShow}" />
				</aon:menuItem>
				<aon:menuItem id="basicCopyDraft-edition"
					action="contractPdfEdition_form" ajaxSingle="true" 
					rendered="#{not empty contract.to.model and not contract.existSignedBasicCopyDocument}"
					value="Copia Basica"
					title="Edicion manual del documento de la copia basica"
					iconClass="aon-icon-page" >
					<f:setPropertyActionListener
						target="#{contractPdf.documentType}" value="#{contractPdf.basicCopyPdfType}" />
					<f:setPropertyActionListener
						target="#{contractPdf.backAction}" value="contract_form" />
					<aon:actionListener method="#{contractPdf.onContractDocumentShow}" />
				</aon:menuItem>
				<!--  
				<aon:menuItem id="annex1Draft-edition"
					action="contractPdfEdition_form" ajaxSingle="true" 
					rendered="#{not empty contract.to.model and not contract.existDocument}"
					value="Anexo I"
					title="Anexo I. Acuerdo para la actividad formativa en contrato para la formación y  el aprendizaje en los supuestos que exista título de FP, certficado de profesionalidad y centro disponible."
					siconClass="aon-icon-page" >
					<f:setPropertyActionListener
						target="#{contractPdf.documentType}" value="#{contract.annexPdfType}" />
					<f:setPropertyActionListener
						target="#{contractPdf.backAction}" value="contract_form" />
					<aon:actionListener method="#{contract.onContractDocumentShow}" />
				</aon:menuItem>
				-->
				<aon:menuItem id="annex2Draft-edition"
					action="contractPdfEdition_form" ajaxSingle="true"
					rendered="#{contract.trainingContract and contract.trainingCourseDefined}" 
					value="Anexo II"
					title="Anexo II. Acuerdo para la actividad formativa en contrato para la formación y el aprendizaje en los supuestos en que no exista título de FP, certificado de profesionalidad o centro disponible."
					iconClass="aon-icon-page" >
					<f:setPropertyActionListener
						target="#{contractPdf.documentType}" value="#{contractPdf.annexIIPdfType}" />
					<f:setPropertyActionListener
						target="#{contractPdf.backAction}" value="contract_form" />
					<aon:actionListener method="#{contractPdf.onContractDocumentShow}" />
				</aon:menuItem>                
				<!--  
				<aon:menuItem id="extensionDraft-edition"
					action="contractPdfEdition_form" ajaxSingle="true"
					rendered="#{true}" 
					value="Prorroga"
					iconClass="aon-icon-page" >
					<f:setPropertyActionListener
						target="#{contractPdf.documentType}" value="#{contractPdf.extensionPdfType}" />
					<f:setPropertyActionListener
						target="#{contractPdf.backAction}" value="contract_form" />
					<aon:actionListener method="#{contractPdf.onContractDocumentShow}" />
				</aon:menuItem>                
				-->
			</rich:menuGroup>

			<rich:menuGroup value="Contrat@" iconClass="aon-icon-contrata">
				<aon:menuItem id="contrata-sepe-comunication2"
					value="Comunicar datos de contrato"
					disabled="#{!contractContrata.communicationAvailable or contractContrata.communicationResponseReceived}"
					reRender="showContrataLoginWindow,contrataResponseContainer,contrataData,contractForm"
					actionListener="#{contractContrata.onSendContrataFile}"
					onclick="Richfaces.showModalPanel('waitProccess')" 
	 				oncomplete="Richfaces.hideModalPanel('waitProccess')"
					iconClass="aon-icon-sincronize" />
				<aon:menuItem id="contrata-sepe-dataQuery2"
					value="Consultar estado del contrato"
					disabled="#{!contractContrata.communicationResponseReceived}"
					reRender="showContrataLoginWindow,contrataResponseContainer,contrataData,contractForm"
					actionListener="#{contractContrata.onContrataDataQuery}"
					onclick="Richfaces.showModalPanel('waitProccess')" 
	 				oncomplete="Richfaces.hideModalPanel('waitProccess')"
					iconClass="aon-icon-sincronize" />
				<aon:menuItem id="contrata-sepe-showLog"
					value="Historial de comunicaciones"
					disabled="#{!contractContrata.communicationResponseReceived}"
					reRender="showCommunicationLogWindow"
					actionListener="#{contractContrata.onContrataLogShow}"
					iconClass="aon-icon-info" >
					<f:setPropertyActionListener
						target="#{contractContrata.showCommunicationLogWindow}" value="#{true}" />
				</aon:menuItem>
				
				<!--  
				<aon:menuItem id="contrata-contractXml-download" 
					value="XML contrato"
					iconClass="aon-icon-mail-save" >
					<aon:htmlCommandLink id="contractXmldownload" target="_blank"
						actionListener="#{contractContrata.onDownloadContrataXml}"
		     			style="line-height:16px;margin-right:0;">
					</aon:htmlCommandLink>	
				</aon:menuItem>
				-->
				
			</rich:menuGroup>

		</ui:define>

	</ui:decorate>
	
</ui:composition>
