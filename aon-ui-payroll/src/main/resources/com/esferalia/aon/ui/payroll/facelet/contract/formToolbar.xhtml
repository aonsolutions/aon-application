<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components" >

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarTitle" value="#{bundle.payroll_contract_module}" />
		<ui:param name="controller" value="#{contract}" />
		<ui:param name="skipRemoveButton" value="#{!contract.removable}" />
		<ui:param name="showMoreMenu" value="#{!contract.nevv}" />
		
		<ui:define name="beforeSpinToolbarContent">
		
			<aon:htmlCommandLink id="contractSuspensionNotice_letter"
				styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
				rendered="#{contract.to.endDate!=null and contract.params.settleAdvanceNoticeDate!=null}"
				value="Carta aviso fin contrato"
				action="#{report.onExecute}">
				<f:param name="reportKey" value="contractSuspensionNotice" />
				<f:param name="outputFormat" value="PDF" />
			</aon:htmlCommandLink>	
			
		</ui:define>
<!--  
		<ui:define name="additionalToolbarContent">
			<aon:div style="float:right;margin-right:0;">
				<aon:outputText value="VISTA" 
					styleClass="aon-finding-toolbar-item"/>
				<aon:commandButton id="viewMode-form" 
					value="&#160;" title="Modo formulario"
					disabled="true"
					styleClass="aon-finding-toolbar-item aon-finding-toolbar-item-no-border aon-icon-category"/>
				<aon:commandButton id="viewMode-graph" 
					value="&#160;" title="Modo grafico"
					disabled="true"
					styleClass="aon-finding-toolbar-item aon-finding-toolbar-item-no-border aon-icon-page"/>
			</aon:div>
		</ui:define>
-->		
		
		<ui:define name="moreMenuContent">

<aon:if test="#{!contract.params.retaQuote}">
			<aon:menuItem id="document-issue" 
				value="#{bundle.payroll_contract_generate_document}"
				rendered="#{!contract.nevv}"
				reRender="showDocumentGenerationWindow"
				actionListener="#{contractPdf.onDocumentGenerationShow}"
				iconClass="aon-icon-new-page">
				<f:setPropertyActionListener
					target="#{contractPdf.showDocumentGenerationWindow}" value="#{true}" />
 			</aon:menuItem>
			
			<aon:if test="#{sepeAppParams.developmentMode or aonRole.sysAdmin}">

				<aon:menuItem id="document-preview" 
					value="Vista Previa"
					action="contractPdfEdition_form" ajaxSingle="true"
					iconClass="aon-icon-page" >
					<f:setPropertyActionListener
						target="#{contractPdf.documentType}" value="#{null}" />
					<f:setPropertyActionListener
						target="#{contractPdf.backAction}" value="contract_form" />
					<aon:actionListener method="#{contractPdf.onContractDocumentPreview}" />
	 			</aon:menuItem>
	 			
				<rich:menuGroup 
					value="Editar documentos"
					iconClass="aon-menuGroup-styleClass">
					<aon:menuItem id="documentDraft-edition" 
						action="contractPdfEdition_form" ajaxSingle="true"
						rendered="#{not empty contract.params.contractModelOption and not contract.existSignedContractDocument}"
						value="Contrato"
						title="Edicion manual del documento del contrato"
						iconClass="aon-icon-page" >
						<f:setPropertyActionListener
							target="#{contractPdf.documentType}" value="#{contractPdf.contractPdfType}" />
						<f:setPropertyActionListener
							target="#{contractPdf.backAction}" value="contract_form" />
						<aon:actionListener method="#{contractPdf.onContractDocumentShow}" />
					</aon:menuItem>
					<aon:menuItem id="basicCopyDraft-edition"
						action="contractPdfEdition_form" ajaxSingle="true" 
						rendered="#{not empty contract.params.contractModelOption and not contract.existSignedBasicCopyDocument}"
						value="Copia Basica"
						title="Edicion manual del documento de la copia basica"
						iconClass="aon-icon-page" >
						<f:setPropertyActionListener
							target="#{contractPdf.documentType}" value="#{contractPdf.basicCopyPdfType}" />
						<f:setPropertyActionListener
							target="#{contractPdf.backAction}" value="contract_form" />
						<aon:actionListener method="#{contractPdf.onContractDocumentShow}" />
					</aon:menuItem>
					<!--  
					<aon:menuItem id="annex1Draft-edition"
						action="contractPdfEdition_form" ajaxSingle="true" 
						rendered="#{not empty contract.to.model and not contract.existDocument}"
						value="Anexo I"
						title="Anexo I. Acuerdo para la actividad formativa en contrato para la formación y  el aprendizaje en los supuestos que exista título de FP, certficado de profesionalidad y centro disponible."
						siconClass="aon-icon-page" >
						<f:setPropertyActionListener
							target="#{contractPdf.documentType}" value="#{contract.annexPdfType}" />
						<f:setPropertyActionListener
							target="#{contractPdf.backAction}" value="contract_form" />
						<aon:actionListener method="#{contract.onContractDocumentShow}" />
					</aon:menuItem>
					-->
					<aon:menuItem id="annex2Draft-edition"
						action="contractPdfEdition_form" ajaxSingle="true"
						rendered="#{contract.trainingContract and contract.trainingCourseDefined}" 
						value="Anexo II"
						title="Anexo II. Acuerdo para la actividad formativa en contrato para la formación y el aprendizaje en los supuestos en que no exista título de FP, certificado de profesionalidad o centro disponible."
						iconClass="aon-icon-page" >
						<f:setPropertyActionListener
							target="#{contractPdf.documentType}" value="#{contractPdf.annexIIPdfType}" />
						<f:setPropertyActionListener
							target="#{contractPdf.backAction}" value="contract_form" />
						<aon:actionListener method="#{contractPdf.onContractDocumentShow}" />
					</aon:menuItem>                
					<aon:menuItem id="extensionDraft-edition"
						action="contractPdfEdition_form" ajaxSingle="true"
						rendered="#{contract.extensibleContract}"
						value="Prorroga"
						iconClass="aon-icon-page" >
						<f:setPropertyActionListener
							target="#{contractPdf.documentType}" value="#{contractPdf.extensionPdfType}" />
						<f:setPropertyActionListener
							target="#{contractPdf.backAction}" value="contract_form" />
						<aon:actionListener method="#{contractPdf.onContractDocumentShow}" />
					</aon:menuItem>                
					<aon:menuItem id="enterpriseCertificateDraft-edition"
						action="contractPdfEdition_form" ajaxSingle="true"
						value="Certificado empresa"
						iconClass="aon-icon-page" >
						<f:setPropertyActionListener
							target="#{contractPdf.documentType}" value="#{contractPdf.enterpriseCertificatePdfType}" />
						<f:setPropertyActionListener
							target="#{contractPdf.backAction}" value="contract_form" />
						<aon:actionListener method="#{contractPdf.onContractDocumentShow}" />
					</aon:menuItem>                
				</rich:menuGroup>
			</aon:if>
			
			<rich:menuSeparator id="documentsSeparator" />
			
			<aon:menuItem id="document-extension" 
				value="Prorrogar"
				rendered="#{contract.extensibleContract}"
				reRender="showExtensionContrataWindow"
				actionListener="#{contract.onContrataExtensionShow}"
				iconClass="aon-icon-attach-file" >
				<f:setPropertyActionListener
					target="#{extensionContrata.showExtensionContrataWindow}" value="#{true}" />
			</aon:menuItem>
			<aon:menuItem id="document-transform" 
				value="Transformar a ind."
				rendered="#{contract.transformableContract}"
				reRender="showTransformContrataWindow"
				actionListener="#{contract.onContrataTransformShow}"
				iconClass="aon-icon-copy" >
				<f:setPropertyActionListener
					target="#{transformContrata.showTransformContrataWindow}" value="#{true}" />
			</aon:menuItem>
			
			<rich:menuSeparator id="actionsSeparator"
				rendered="#{contract.extensibleContract or contract.transformableContract}" />
			
			<aon:menuItem id="contractContrata-communication-log"
				value="#{bundle.aon_module_contrata}"
				ajaxSingle="true"
				reRender="showContrataCommunicationWindow"
				actionListener="#{contract.onSepeCommunicationShow}"
				iconClass="aon-icon-sepe-contrata" >
				<f:setPropertyActionListener
					target="#{contract.showCommunicationWindow}" value="#{true}" />
			</aon:menuItem>
			
			<aon:if test="#{actionDenied.moduleEnabled['payroll']}">
				<aon:menuItem id="certificados-communication-log"
					value="#{bundle.sepe_certificados}"
					disabled="#{empty contract.to.endDate}"
					rendered="#{true}" ajaxSingle="true"
					reRender="showCertificadosCommunicationWindow"
					actionListener="#{contract.onCertificadosCommunicationShow}"
					iconClass="aon-icon-sepe-certificados" >
					<f:setPropertyActionListener
						target="#{contract.showCommunicationWindow}" value="#{true}" />
				</aon:menuItem>
			</aon:if>
</aon:if>			
			
			<aon:if test="#{actionDenied.moduleEnabled['payroll']}">
				<rich:menuSeparator id="payrollSeparator" />
				<aon:menuItem id="contract-bonus" 
					value="#{bundle.payroll_salary_bonus_tab}"
					reRender="showContractBonusWindow"
					actionListener="#{contract.onShowBonusWindow}"
					iconClass="aon-icon-fraction" >
					<f:setPropertyActionListener
						target="#{contract.showContractBonusWindow}" value="#{true}" />
				</aon:menuItem>
				<aon:menuItem id="contract-embargo" 
					value="#{bundle.payroll_salary_embargos_tab}"
					reRender="showContractEmbargoWindow"
					actionListener="#{contract.onShowEmbargoWindow}"
					iconClass="aon-icon-settle" >
					<f:setPropertyActionListener
						target="#{contract.showContractEmbargoWindow}" value="#{true}" />
				</aon:menuItem>
				<aon:menuItem id="contract-salary-info" 
					value="Datos de cálculo"
					reRender="showContractSalaryInfoWindow"
					actionListener="#{contract.onShowSalaryInfoWindow}"
					iconClass="aon-icon-tree" >
					<f:setPropertyActionListener
						target="#{contract.showContractSalaryInfoWindow}" value="#{true}" />
				</aon:menuItem>				
			</aon:if>
			
		</ui:define>

	</ui:decorate>
	
</ui:composition>
