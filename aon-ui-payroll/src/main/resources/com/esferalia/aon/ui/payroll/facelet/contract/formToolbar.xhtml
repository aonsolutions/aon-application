<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components" >

	<c:if test="#{!contract.new}" >
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_contract_module}" />
			<ui:param name="controller" value="#{contract}" />
			<ui:param name="skipSaveButton" value="true" />
			<ui:param name="skipRemoveButton" value="#{contract.to.status!='PENDING'}" />
			<ui:define name="beforeSpinToolbarContent">
				<aon:commandButton 
					value="#{payrollBundle.payroll_contractCalendarEvent}"
					styleClass="aon-finding-toolbar-item aon-icon-calendar-exception"
					rendered="#{!contract.new}"
					action="contractCalendarEvent_form" />
				
				<aon:commandButton id="contrata"
					value="#{payrollBundle.payroll_contract_contrataData}"
					action="contrata_form" 
					rendered="#{!contract.new}"
					actionListener="#{contract.onShowContrataData}"
					styleClass="aon-finding-toolbar-item aon-icon-contrata" >
					<f:setPropertyActionListener
						target="#{contract.contrataBackAction}" value="contract_form" />
				</aon:commandButton>
				
					
			</ui:define>
		</ui:decorate>
	</c:if>
	<c:if test="#{contract.new}" >
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_contract_module}" />
			<ui:param name="controller" value="#{contract}" />
			<ui:param name="skipRemoveButton" value="true" />
		</ui:decorate>
	</c:if>

</ui:composition>
