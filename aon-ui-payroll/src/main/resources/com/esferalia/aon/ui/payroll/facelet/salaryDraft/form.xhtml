<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salaryDraftForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{employeeBundle.employee_salaryDraft_module}" />
				<ui:param name="controller" value="#{salaryDraft}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSaveButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:htmlCommandLink id="currentSalary-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{employeeBundle.employee_salary_draft}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="currentSalaryDraftReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>
			 
			<aon:div ajaxRendered="true">
				<aon:div style="width: 840px; margin-top: 10px;">
					<ui:include src="/com/code/aon/ui/employee/facelet/salaryDraft/formContent.xhtml" >
						<ui:param name="controller" value="#{salaryDraft}" />
					</ui:include>
				</aon:div>
				<c:if test="#{!salaryDraft.new}">
					<aon:div>
						<aon:panelTabSet>
							<aon:panelTab id="paymentsTab" label="#{employeeBundle.employee_salary_payment}">
								<aon:div style="width: 840px; margin-top: 10px;">
									<ui:include src="/com/code/aon/ui/employee/facelet/payment/gridContent.xhtml" >
										<ui:param name="controller" value="#{salaryDraft.salary.payments}" />
										<ui:param name="totalPayment" value="#{salaryDraft.salary.totalPayment}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
							<c:if test="#{aonConfiguration.bean.payroll.showPaymentEditionTab}">
								<aon:panelTab id="paymentsEditTab" label="#{bundle.aon_edit}">
									<aon:div style="width: 840px; margin-top: 10px;">
										<ui:include src="/com/code/aon/ui/employee/facelet/payment/editGridContent.xhtml" >
											<ui:param name="controller" value="#{salaryDraftPayment}" />
											<ui:param name="skipStartDateColumn" value="#{true}" />
											<ui:param name="skipEndDateColumn" value="#{true}" />
										</ui:include>
									</aon:div>
								</aon:panelTab>
							</c:if>								
						</aon:panelTabSet>
						<aon:panelTabSet>
							<aon:panelTab id="deductionsTab" label="#{employeeBundle.employee_salary_deduction}">
								<aon:div style="width: 840px; margin-top: 10px;">
									<ui:include src="/com/code/aon/ui/employee/facelet/deduction/gridContent.xhtml" >
										<ui:param name="controller" value="#{salaryDraft.salary.deductions}" />
										<ui:param name="totalDeduction" value="#{salaryDraft.salary.totalDeduction}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
							<c:if test="#{aonConfiguration.bean.payroll.showDeductionEditionTab}">
								<aon:panelTab id="deductionsEditTab" label="#{bundle.aon_edit}">
									<aon:div style="width: 840px; margin-top: 10px;">
										<ui:include src="/com/code/aon/ui/employee/facelet/deduction/editGridContent.xhtml" >
											<ui:param name="controller" value="#{salaryDraftDeduction}" />
												<ui:param name="skipStartDateColumn" value="#{true}" />
												<ui:param name="skipEndDateColumn" value="#{true}" />
										</ui:include>
									</aon:div>
								</aon:panelTab>
							</c:if>
						</aon:panelTabSet>
						<aon:div style="width: 840px; margin-top: 10px;">
							<ui:include src="/com/code/aon/ui/employee/facelet/salary/formBases.xhtml" >
								<ui:param name="salaryTO" value="#{salaryDraft.salary}" />
							</ui:include>
						</aon:div>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/employee/facelet/payment/modalPayment.xhtml">
			<ui:param name="controller" value="#{salaryDraftPayment}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/employee/facelet/deduction/modalDeduction.xhtml">
			<ui:param name="controller" value="#{salaryDraftDeduction}" />
		</ui:include>
	</ui:define>
</ui:composition>
