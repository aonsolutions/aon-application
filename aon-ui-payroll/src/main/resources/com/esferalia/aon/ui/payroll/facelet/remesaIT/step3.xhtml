<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/remesaIT/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.remesaIT_step2}" />
	</ui:define>

	<ui:define name="step_content">
		<h:commandLink target="_blank"
			title="#{remesaITWizard.diskOk?(payrollBundle.download_disk):(payrollBundle.download_error)}"
			value="#{remesaITWizard.diskOk?(payrollBundle.download_disk):(payrollBundle.download_error)}"
			style="border-width: 0px 0px 0px 0px;"
			actionListener="#{remesaITWizard.onDownloadDisk}" 
			rendered="#{remesaITWizard.fileOutput!=null}"
			styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
	</ui:define>

</ui:composition>
