<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/remesaIT/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.remesaIT_step2}" />
	</ui:define>

	<ui:define name="step_content">
		<aon:panel>
			<f:facet name="header">
				<aon:outputText value="#{payrollBundle.payroll_remesa}" />
			</f:facet>
			<aon:panelGrid columns="2"
				columnClasses="aon-panelGrid-odd aon-width-100, 
				aon-panelGrid-even aon-width-auto">
				
					<aon:outputText value="#{bundle.aon_id}" />
					<aon:outputText value="#{remesaITWizard.remesaINSS.id}" />

					<aon:outputText value="#{payrollBundle.payroll_fecha}" />
					<aon:outputText value="#{remesaITWizard.remesaINSS.fecha}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>

					<aon:outputText value="#{payrollBundle.payroll_hora}" />
					<aon:outputText value="#{remesaITWizard.remesaINSS.hora}" >
						<f:convertDateTime pattern="#{bundle.aon_time_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
			</aon:panelGrid>
		
		</aon:panel>
		
		<aon:div id="remesaITListContainer" layout="none">
		<aon:panel>
			<f:facet name="header">
				<aon:outputText value="#{payrollBundle.payroll_remesa_parte_it}" />
			</f:facet>
			<aon:dataTable id="remesaITList" var="to" rows="20" width="auto"
				value="#{remesaITWizard.selectedModel}"
				columnClasses="
						aon-editDataTable-iconColumn, 
						aon-editDataTable-textColumn aon-width-50,
						aon-editDataTable-textColumn aon-width-auto,
						aon-editDataTable-textColumn aon-width-100,
						aon-editDataTable-textColumn aon-width-auto,
						aon-editDataTable-textColumn aon-width-80, 
						aon-editDataTable-textColumn aon-width-80, 
						aon-editDataTable-textColumn aon-width-50,
						aon-editDataTable-textColumn aon-width-80,
						aon-editDataTable-textColumn aon-width-150, 
						aon-editDataTable-iconColumn">

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:commandButton id="deselectButton"
						actionListener="#{remesaITWizard.onRemoveSelected}"
						reRender="remesaITListContainer"
						styleClass="aon-editDataTable-button aon-icon-delete" />
				</aon:column>

				<ui:include
					src="/com/esferalia/aon/ui/payroll/facelet/remesaIT/columns.xhtml" />

			</aon:dataTable>

			<aon:dataScroller2 for="remesaITList" showNote="true" />
		</aon:panel>
		</aon:div>
	</ui:define>

</ui:composition>
