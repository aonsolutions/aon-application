<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
						
	<aon:panelTab id="cnaeRate" label="Tarifas de IT e IMS"
		actionListener="#{cnaeRate.onInitialize}">
		<aon:div styleClass="aon-panelGrid-search aon-margin-bottom">
			<aon:div styleClass="aon-panelGrid-search-info">
				<aon:outputText value="#{bundle.aon_filter}" styleClass="aon-panelGrid-search-info-internal"/>
			</aon:div>
			<aon:panelGrid columns="3">
				<aon:inputText id="cnaeRateFilter" size="150" value="#{cnaeRate.filter}">
					<a4j:support 
						event="onkeyup"
						actionListener="#{cnaeRate.onReloadModel}"
						reRender="cnaeRateTable"
						eventsQueue="cnaeRateFilterKeyUp"
						requestDelay="500"
						ajaxSingle="true"
						ignoreDupResponses="true"
						limitToList="true"/>
				</aon:inputText>
				
				<aon:outputText value="#{bundle.aon_year}" />
				<rich:inputNumberSpinner value="#{cnaeRate.year}"
	   				inputSize="4" minValue="2010" maxValue="#{cnaeRate.currentYear}" cycled="false">
					<a4j:support 
						event="onchange"
						actionListener="#{cnaeRate.onReloadModel}"
						reRender="cnaeRateTable, occupationTable"
						eventsQueue="cnaeRateFilterKeyUp"
						requestDelay="500"
						ajaxSingle="true"
						ignoreDupResponses="true"
						limitToList="true"/>
	   			</rich:inputNumberSpinner>
			</aon:panelGrid>	
		</aon:div>
		
		<aon:panel id="occupationTable" style="width: 750px; margin-top: 20px;">
			<aon:panelGrid columns="4" styleClass="aon-width-all"
				columnClasses="aon-panelGrid-even aon-text-center aon-nopadding aon-width-80,
									aon-panelGrid-even aon-nopadding aon-width-auto,
									aon-panelGrid-even aon-text-center aon-nopadding aon-width-120,
									aon-panelGrid-even aon-text-center aon-nopadding aon-width-120">
				<f:facet name="header">
					<aon:outputText value="Tipos aplicables a ocupaciones y situaciones en todas las actividades " />
				</f:facet>
	
				<aon:div style="background-color: #f0f0f0;">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:div style="background-color: #f0f0f0;">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:div style="background-color: #f0f0f0;">
					<aon:outputText value="IT" />
				</aon:div>
				<aon:div style="background-color: #f0f0f0;">
					<aon:outputText value="IMS" />
				</aon:div>
				
				<aon:outputText value="a" />
				<aon:outputText value="Personal en trabajos exclusivos de oficina." />
				<aon:outputText value="#{cnaeRate.itValues['a']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{cnaeRate.imsValues['a']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				
				<aon:outputText value="b" />
				<aon:outputText value="Representantes de Comercio." />
				<aon:outputText value="#{cnaeRate.itValues['b']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{cnaeRate.imsValues['b']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				
				<aon:outputText value="d" />
				<aon:outputText value="Personal de oficios en instalaciones y reparaciones en edificios, obras y trabajos de construcción en general." />
				<aon:outputText value="#{cnaeRate.itValues['d']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{cnaeRate.imsValues['d']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				
				<aon:outputText value="e" />
				<aon:outputText value="&#160;" />
				<aon:outputText value="#{cnaeRate.itValues['e']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{cnaeRate.imsValues['e']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				
				<aon:outputText value="f" />
				<aon:outputText value="Conductores de vehículo automóvil de transporte de mercancías que tenga una capacidad de carga útil superior a 3,5 Tm." />
				<aon:outputText value="#{cnaeRate.itValues['f']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{cnaeRate.imsValues['f']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				
				<aon:outputText value="g" />
				<aon:outputText value="Personal de limpieza en general. Limpieza de edificios y de todo tipo de establecimientos. Limpieza de calles." />
				<aon:outputText value="#{cnaeRate.itValues['g']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{cnaeRate.imsValues['g']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				
				<aon:outputText value="h" />
				<aon:outputText value="Vigilantes, guardas, guardas jurados y personal de seguridad. " />
				<aon:outputText value="#{cnaeRate.itValues['h']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:outputText value="#{cnaeRate.imsValues['h']}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:panelGrid>
		</aon:panel>
	
		<aon:dataTable id="cnaeRateTable" value="#{cnaeRate.model}" var="to">

			<aon:rowSelector id="cnaeRateList-select" toggleOnClick="#{false}" />
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_id}" />
				</f:facet>
				<aon:outputText value="#{to.cnae2009.code}"  />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.cnae2009.title}"  />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputText value="IT" />
				</f:facet>
				<aon:outputText value="#{to.itAmount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputText value="IMS" />
				</f:facet>
				<aon:outputText value="#{to.imsAmount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
			
			
		</aon:dataTable>
	</aon:panelTab>
						
</ui:composition>
