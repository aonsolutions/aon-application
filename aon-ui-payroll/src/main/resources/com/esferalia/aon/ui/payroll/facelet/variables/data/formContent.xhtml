<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components" >
	
	<aon:div styleClass="aon-toolbar">
		<aon:commandButton id="paymentVarSave"
			value="#{bundle.aon_accept}"
			reRender="#{container}"
			actionListener="#{controller.onSaveVariable}"
			styleClass="aon-finding-toolbar-item aon-icon-accept" />
		<aon:commandButton id="paymentVarCancel"
			value="#{bundle.aon_cancel}"
			reRender="#{container}"
			actionListener="#{controller.onCancelVariable}"
			immediate="true"
			styleClass="aon-finding-toolbar-item aon-icon-cancel" />
		<aon:commandButton id="paymentVarRemove"
			value="#{bundle.aon_remove}"
			rendered="#{controller.data.id!=null}"
			reRender="#{container}"
			actionListener="#{controller.onRemoveVariable}"
			styleClass="aon-finding-toolbar-item aon-icon-delete"
			onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;" />
	</aon:div>

	<aon:panelGrid columns="2" style="width: 100%;" id="variablePanel"
		columnClasses="aon-panelGrid-odd aon-width-100 ,aon-panelGrid-even aon-width-auto">
		
		<aon:outputLabel for="#{controller.beanName}_name" 
			value="#{bundle.aon_name}" />
		<aon:div>
			<aon:inputText id="#{controller.beanName}_name" required="true" 
				value="#{controller.data.name}" maxlength="128" size="32" 
				disabled="#{controller.data.id!=null}" />
			<aon:commandButton id="variableHelpName-select"
				title="#{payrollBundle.payroll_variable_helper}" ajaxSingle="true"
				value="&#160;"
				rendered="#{controller.data.id==null}"
				actionListener="#{controller.onShowVariableNameHelp}"
				reRender="variableHelperModalContainer"
				styleClass="aon-icon-commandButton aon-icon-question"/>
		</aon:div>

		<aon:outputLabel for="#{controller.beanName}_expression_#{controller.data.variable.type}"
			value="#{payrollBundle.payroll_salary_expression}" />
		<aon:div>
			<ui:include 
				src="/com/esferalia/aon/ui/payroll/facelet/variables/editor/grid.xhtml" >
				<ui:param name="controller" value="#{controller}" />
				<ui:param name="data" value="#{controller.data}" />
				<ui:param name="formEdit" value="true" />
			</ui:include>
			<aon:commandButton id="variableHelpValue-select"
				title="#{payrollBundle.payroll_variable_helper}" ajaxSingle="true"
				value="&#160;"
				rendered="#{controller.data.variable==null or controller.data.variable.type=='STRING' or controller.data.variable.type=='UNKNOWN'}"
				actionListener="#{controller.onShowVariableExpressionHelp}"
				reRender="variableHelperModalContainer"
				styleClass="aon-icon-commandButton aon-icon-question"/>
<!--  
-->			
		</aon:div>
		
		<aon:outputLabel for="#{controller.beanName}_startDate" 
			value="#{bundle.aon_start_date}" />
		<aon:selectInputDate id="#{controller.beanName}_startDate" 
			value="#{controller.data.startDate}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="#{controller.beanName}_endDate" 
			value="#{bundle.aon_end_date}" />
		<aon:selectInputDate id="#{controller.beanName}_endDate" 
			value="#{controller.data.endDate}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
		
	</aon:panelGrid>

</ui:composition>
