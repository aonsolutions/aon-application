<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:panelGrid columns="2" style="width: 50%; margin-top:10px;"
		columnClasses="aon-panelGrid-odd aon-width-auto, aon-panelGrid-even aon-width-20">
		
		<f:facet name="header">
			<aon:div styleClass="aon-panelGrid-even">
				<aon:outputText value="&#160;" style="padding-left:15px;" styleClass="aon-icon-exception"/>
				<aon:outputText value="#{payrollBundle.payroll_contract_undefined_variables}" styleClass="aon-bold"/>
			</aon:div>
		</f:facet>
		
		<c:forEach items="#{controller.undefinedVariablesModel.wrappedData}" var="to">
			<aon:outputText value="#{to.name}"  />
			<aon:commandButton
				id="ContractData-add" 
				title="#{payrollBundle.payroll_contract_define_variable_button_title}"
				actionListener="#{controller.onAddUndefinedVariable}"
				reRender="#{saveReRender}"
				styleClass="aon-editDataTable-button aon-icon-reset"
				accesskey="#{bundle.aon_key_new_line}"/>
		</c:forEach>
		
	</aon:panelGrid>	

</ui:composition>
