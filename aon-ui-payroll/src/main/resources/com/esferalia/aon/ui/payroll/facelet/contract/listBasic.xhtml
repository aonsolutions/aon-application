<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{!skipNameColumn}">
		<aon:column alias="Contract.person.firstSurname,Contract.person.registry.name" 
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.registry_person}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.person.fullName}"/>
			</aon:div>
		</aon:column>
	</aon:if>

	<aon:if test="#{!skipContractCodeColumn}">
		<aon:column 
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.payroll_contract_contract_type}" />
			</f:facet>
			<aon:outputText value="[COOP.] "
				rendered="#{contract.rowCooperativePartnerQuote}" />
			<aon:outputText value="#{contract.rowContractCode}"
				rendered="#{!contract.rowContractRetaQuote}" />
			<aon:outputText value="[RETA] #{bundle.payroll_contract_reta}"
				rendered="#{contract.rowContractRetaQuote}" />
			<aon:outputText value="Becario"
				rendered="#{contract.rowContractInternship}" />
		</aon:column>
	</aon:if>

	<aon:if test="#{!skipNssColumn}">
		<aon:column alias="Contract.person.socialSecurityNumber" 
			styleClass="aon-editDataTable-textColumn aon-width-100">
			<f:facet name="header">
				<aon:outputText value="#{bundle.registry_person_nss}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.person.socialSecurityNumber}"/>
			</aon:div>
		</aon:column>
	</aon:if>

	<aon:column alias="Contract.startDate" 
		styleClass="aon-editDataTable-dateColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_start_date}" />
		</f:facet>
		<aon:outputText value="#{to.startDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
	</aon:column>

	<aon:column alias="Contract.endDate" 
		styleClass="aon-editDataTable-dateColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_end_date}" />
		</f:facet>
		<aon:outputText value="#{to.endDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
	</aon:column>

	<aon:if test="#{!skipWorkPlaceColumn}">
		<aon:column alias="Contract.workPlace.description" 
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.purchase_workplace}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.workPlace.description}"/>
			</aon:div>
		</aon:column>
	</aon:if>

	<aon:if test="#{!skipEnterpriseColumn}">		
		<aon:column alias="Contract.workPlace.enterprise.registry.name"	
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_company}" />
			</f:facet>
			<aon:div styleClass="aon-nowrap">
				<aon:outputText value="#{to.workPlace.enterprise.registry.fullName}"/>
			</aon:div>
		</aon:column>
	</aon:if>
	
	<aon:column 
		styleClass="aon-editDataTable-textColumn aon-width-70">
		<f:facet name="header">
			<aon:outputText value="&#160;"
				title="Estado (Seguridad Social)"
				styleClass="aon-icon-winsuite aon-padding-left aon-padding-right" />
		</f:facet>
		<aon:outputText value="#{contract.modelSsStatus}"/>
	</aon:column>
	<aon:column 
		styleClass="aon-editDataTable-textColumn aon-width-70">
		<f:facet name="header">
			<aon:outputText value="&#160;"
				title="Estado (S.E.P.E.)"
				styleClass="aon-icon-sepe aon-padding-left aon-padding-right" />
		</f:facet>
		<aon:outputText value="#{contract.modelSepeStatus}"/>
	</aon:column>

</ui:composition>
