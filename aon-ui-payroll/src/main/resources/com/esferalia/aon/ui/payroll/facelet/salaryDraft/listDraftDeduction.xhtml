<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >

	<c:set var="total" value="#{0.00}" />
	
	<c:if test="#{  ( deductions.count == 0 ) and (empty hide) }" >
		<aon:div style="border-bottom: solid #CCCCCC 1px;">
			<aon:outputText value="&#160;"/>
		</aon:div>
	</c:if>			
	
	<c:if test="#{deductions.count == 1}" >
		<aon:div styleClass="#{deductions.list[0].difference >= 0.01 ? 'aon-label-error' : ''}" style="border-bottom: solid #CCCCCC 1px;">
			<aon:outputText value="&#160;"/>
			<aon:outputText value="#{deductions.list[0].oldAmount}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:div>
		<c:set var="total" value="#{total + costs[0].oldAmount}" />
	</c:if>			
	
	<c:if test="#{deductions.count > 1}" >
		<aon:div>
		</aon:div>
		<c:set var="subTotal" value="#{0.00}" />
		<c:set var="oldSubTotal" value="#{0.00}" />
		<c:forEach var="deduction" items="#{deductions.list}">
		
			<aon:div styleClass="#{deduction.difference >= 0.01 ? 'aon-label-error' : ''}" style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{empty deduction.oldAmount ? '?' : deduction.oldAmount }">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
			<c:set var="total" value="#{total + deduction.oldAmount}" />
			<c:set var="subTotal" value="#{subTotal + deduction.aAmount}" />
			<c:set var="oldSubTotal" value="#{oldSubTotal + deduction.oldAmount}" />
		</c:forEach>
		<aon:div style="border-bottom: solid #CCCCCC 1px;">
			<aon:outputText value="&#160;"/>
			<aon:outputText value="#{oldSubTotal}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:div>
	</c:if>		
		

</ui:composition>
