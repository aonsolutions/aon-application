<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salarySearch">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.payroll_salaryPrint_module}" />
				<ui:param name="controller" value="#{salaryPrint}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipClearButton" value="#{true}" />
				<ui:define name="beforeToolbarContent">
					<aon:commandButton id="salaryPrint-clear"
						value="#{bundle.aon_clear}"
						type="reset" ajaxSingle="true"
						actionListener="#{salaryPrint.onClearFilter}"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
				</ui:define>			
			</ui:decorate>
			
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{salaryPrint}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:define name="searchContent">
					
					<aon:if test="#{domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}">
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{salaryPrint.enterprise}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="skipGoToButton" value="#{true}" />
							<ui:param name="skipSearchButton" value="#{false}" />
							<ui:param name="lookupReRender" value="salarySearch" />
							<aon:methodParam name="lookupChangeListener" 
								value="#{salaryPrint.onChangeEnterprise}" type="lookupChangeListener" />
						</ui:include>
					</aon:if>
						
					<aon:outputLabel value="#{bundle.payroll_salary_period}" />
					<h:panelGrid columns="6" >
						<aon:selectOneMenu id="Salary_month" value="#{salaryPrint.month}"
							disabled="#{salaryPrint.betweenDatesEnabled}" >
							<f:selectItems value="#{commonCollections.months}"  />
							<a4j:support event="onchange" reRender="salarySearch" ajaxSingle="#{true}"
								actionListener="#{salaryPrint.onChangePeriod}" />
						</aon:selectOneMenu>
						<rich:inputNumberSpinner id="FanBatch_year" value="#{salaryPrint.year}"
							disabled="#{salaryPrint.betweenDatesEnabled}"
			   				inputSize="4" minValue="2013" maxValue="2021">
							<a4j:support event="onchange" reRender="salarySearch" ajaxSingle="#{true}"
								actionListener="#{salaryPrint.onChangePeriod}" />
			   			</rich:inputNumberSpinner>
					</h:panelGrid>
					
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Salary_period_betweenDates" 
							value="#{salaryPrint.betweenDatesEnabled}" >
							<a4j:support event="onchange" reRender="salarySearch" ajaxSingle="#{true}"
								actionListener="#{salaryPrint.onChangePeriod}" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="Salary_period_betweenDates" value="entre fechas" />
						<aon:panel style="background-color: transparent; padding-top: 10px; margin: 0;">
							<aon:div>
								<aon:outputLabel value="#{bundle.aon_date_from}" styleClass="aon-italic, aon-margin-right"/>
								<aon:selectInputDate id="Salary_fromDate"
									disabled="#{!salaryPrint.betweenDatesEnabled}"
									value="#{salaryPrint.fromDate}"
									inputSize="10" renderAsPopup="true" enableManualInput="true"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}" >
									<a4j:support event="onchanged" reRender="salarySearch" ajaxSingle="#{true}"/>
								</aon:selectInputDate>
								<aon:outputLabel value="#{bundle.aon_date_to}" styleClass="aon-italic, aon-margin-right"/>
								<aon:selectInputDate id="Salary_toDate"
									disabled="#{!salaryPrint.betweenDatesEnabled}"
									value="#{salaryPrint.toDate}"
									inputSize="10" renderAsPopup="true" enableManualInput="true"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}" >
									<a4j:support event="onchanged" reRender="salarySearch" ajaxSingle="#{true}"/>
								</aon:selectInputDate>
							</aon:div>
						</aon:panel>
					</aon:div>
						
					<aon:outputLabel for="Salary_type"
						value="#{bundle.aon_type}" />
					<aon:selectManyCheckbox id="Salary_type"
						value="#{salaryPrint.types}" reRender="salarySearch">
						<f:selectItem itemLabel="Nómina" itemValue="SALARY" />
						<f:selectItem itemLabel="Extra" itemValue="EXTRA" />
						<f:selectItem itemLabel="Finiquito" itemValue="SETTLE" />
					</aon:selectManyCheckbox>
						
					<aon:if test="#{salaryPrint.showWorkPlaces}">
						<aon:outputLabel for="Salary_contract_workPlace_id"
							value="#{bundle.payroll_workplace}" />
						<aon:selectOneMenu id="Salary_contract_workPlace_id"
							value="#{salaryPrint.workPlace}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{salaryPrint.availableWorkPlaces}" />
							<a4j:support event="onchange" reRender="salarySearch" ajaxSingle="#{true}"
								actionListener="#{salaryPrint.onChangeWorkplace}" />
						</aon:selectOneMenu>		
						<!-- add more and minus buttons -->	
					</aon:if>
						
					<aon:if test="#{salaryPrint.showCCCs}">
						<aon:outputLabel for="Salary_contract_enterpriseCCC_id"
							value="#{bundle.company_enterprise_ccc}" />
						<aon:selectOneMenu id="Salary_contract_enterpriseCCC_id"
							value="#{salaryPrint.enterpriseCCC}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{salaryPrint.availableCCCs}" />
						</aon:selectOneMenu>		
						<!-- add more and minus buttons -->	
					</aon:if>
					
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{salaryPrint.contract}" />
						<!--  
						<ui:param name="lookupControllerListener" value="#{contractLeave.contractFilter}" />
						-->
						<ui:param name="skipGoToButton" value="#{true}" />
						<ui:param name="skipSearchButton" value="#{false}" />
					</ui:include>
					
					<aon:outputText value="" />
					<aon:div >
						<aon:commandButton id="salaryPrint-searchButton"
							title="#{bundle.aon_key_search_accelerator}"
							value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
							action="salaryPrint_list" actionListener="#{salaryPrint.onSearch}"
							requestDelay="100" accesskey="#{bundle.aon_key_search}" >
							<aon:actionHotKey key="return" />
						</aon:commandButton> 
					</aon:div>	
					
				</ui:define>
			</ui:decorate>
			
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		<aon:lookupButtonPopup lookup="#{contractLookup}" />
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		
	</ui:define>
</ui:composition>
