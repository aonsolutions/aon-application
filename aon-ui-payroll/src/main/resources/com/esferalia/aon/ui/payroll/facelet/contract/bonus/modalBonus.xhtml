<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showContractBonusWindow">
		<c:if test="#{contract.showContractBonusWindow}">
			<rich:modalPanel id="bonusModalPanel" minHeight="400"
				minWidth="600" showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.sepe_contrata_contract_bonus}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showContractBonusWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{contract.showContractBonusWindow}" value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="bonusModalForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="bonusSave"
											value="#{bundle.aon_accept}"
											reRender="showContractBonusWindow, #{reRender}"
											actionListener="#{contract.onSaveBonus}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<f:setPropertyActionListener
												target="#{contract.showContractBonusWindow}" value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="bonusCancel"
											value="#{bundle.aon_cancel}"
											reRender="showContractBonusWindow, #{reRender}"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{contract.showContractBonusWindow}" value="#{false}" />
										</aon:commandButton>
									</aon:div>

									<aon:panelGrid id="bonusModalContent" columns="2" style="width: 100%;">
										<ui:include src="/com/esferalia/aon/ui/payroll/facelet/bonusConcept/lookup.xhtml" >
											<ui:param name="lookupTo" value="#{contract.params.bonus.bonusConcept}" />
											<ui:param name="skipNewButton" value="#{true}" />
											<ui:param name="idRequired" value="#{true}" />
										</ui:include>
								
										<aon:outputLabel for="ContractBonus_startDate" value="#{bundle.aon_start_date}" />
										<aon:selectInputDate id="ContractBonus_startDate" value="#{contract.params.bonus.startDate}" required="true"
											timeZone="#{timeZoneController.timeZone}" popupDateFormat="#{bundle.aon_date_pattern}"/>
										
										<aon:outputLabel for="ContractBonus_endDate" value="#{bundle.aon_end_date}" />
										<aon:selectInputDate id="ContractBonus_endDate" value="#{contract.params.bonus.endDate}"
											timeZone="#{timeZoneController.timeZone}" popupDateFormat="#{bundle.aon_date_pattern}"/>
									</aon:panelGrid>
									
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
				
				<aon:lookupButtonPopup lookup="#{bonusConceptLookup}" />
				
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>
</ui:composition>
