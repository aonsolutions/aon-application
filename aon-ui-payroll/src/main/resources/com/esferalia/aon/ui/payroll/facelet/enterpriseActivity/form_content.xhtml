<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGrid id="dataTable" columns="2" >
		<aon:outputLabel for="EnterpriseActivity_description"
			value="#{bundle.aon_description}" />
		<aon:inputText id="EnterpriseActivity_description" size="32"
			maxlength="32" value="#{controller.to.description}"
			required="true" />
	
		<ui:include src="/com/code/aon/ui/config/facelet/cnae2009/lookup.xhtml">
			<ui:param name="lookupTo" value="#{controller.to.cnae2009}" />
			<ui:param name="idRequired" value="#{true}" />
		</ui:include>				

		<aon:if test="#{!skipFiscalInfo}">
			<ui:include src="/com/code/aon/ui/config/facelet/iae/lookup.xhtml">
				<ui:param name="lookupTo" value="#{controller.to.iae}" />
				<ui:param name="idRequired" value="#{true}" />
			</ui:include>				

			<aon:outputLabel for="EnterpriseActivity_vatRegime"
				value="#{bundle.fiscal_vat_regime}" />
			<aon:div>
				<aon:selectOneMenu id="EnterpriseActivity_vatRegime"
					value="#{controller.to.vatRegime}">
					<f:selectItem itemLabel="-" value="#{null}" />		
					<f:selectItems value="#{fiscalCollections.vatRegimes}" />
				</aon:selectOneMenu>
				<aon:selectBooleanCheckbox id="EnterpriseActivity_surcharge"
					styleClass="aon-margin-left"
					value="#{controller.to.surcharge}" />
				<aon:outputLabel for="EnterpriseActivity_surcharge" styleClass="aon-italic"
					value="#{bundle.aon_surcharge_full}" />
			</aon:div>

			<aon:outputLabel for="EnterpriseActivity_retentionRegime"
				value="#{bundle.fiscal_retention_regime}" />
			<aon:selectOneMenu id="EnterpriseActivity_retentionRegime"
				value="#{controller.to.retentionRegime}">
				<f:selectItem itemLabel="-" value="#{null}" />		
				<f:selectItems value="#{fiscalCollections.retentionRegimes}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="EnterpriseActivity_startDate" value="#{bundle.accounting_initial_date}" />
			<aon:selectInputDate id="EnterpriseActivity_startDate"
				value="#{controller.to.startDate}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />

			<aon:outputLabel for="EnterpriseActivity_endDate" value="#{bundle.accounting_cancellation_date}" />
			<aon:selectInputDate id="EnterpriseActivity_endDate"
				value="#{controller.to.endDate}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
		</aon:if>

		<aon:if test="#{actionDenied.manager.renderPayrollConfig}">
			<aon:outputLabel for="EnterpriseActivity_quoteRegime"
				value="#{bundle.payroll_activity_quoteRegime}" />
			<aon:selectOneMenu id="EnterpriseActivity_quoteRegime" required="#{controller.nevv}"
				value="#{controller.to.type}"
				rendered="#{controller.nevv}">
				<f:selectItems value="#{payrollCollections.availableSsRegimes}" />
			</aon:selectOneMenu>
			<aon:outputText value="#{controller.to.type}" styleClass="aon-bold"
				rendered="#{!controller.nevv}" />
		</aon:if>
		
		<aon:outputLabel for="EnterpriseActivity_principal"
			value="#{bundle.aon_activity_principal}" />
		<aon:selectOneRadio id="EnterpriseActivity_principal" required="true"
			value="#{controller.to.principal}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
		</aon:selectOneRadio>
		
	</aon:panelGrid>

</ui:composition>
