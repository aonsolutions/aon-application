<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

				
	<aon:outputLabel for="Person_id"
		value="#{registryBundle.registry_person}" />
	<aon:div styleClass="aon-lookup">
		<aon:lookupInputText id="Person_id" lookup="#{personLookup}"
			reRender="Person_full_name"
			value="#{salarySearch.person.id}" size="5" />
		<aon:lookupButton 
			windowTitle="#{registryBundle.registry_person_selection}"
			selectReRender="Person_id,Person_full_name" actionType="search"
			lookup="#{personLookup}" minHeight="460" minWidth="650"
			property="#{salarySearch.person}">
		</aon:lookupButton>
		<aon:inputText id="Person_full_name"
			value="#{(salarySearch.person.registry.fullName!=null)?(salarySearch.person.registry.fullName):('')}"
			size="50" disabled="true" />							
	</aon:div>

	<aon:outputLabel for="Enterprise_id"
		value="#{companyBundle.company_enterprise}" />
	<aon:div styleClass="aon-lookup">
		<aon:lookupInputText id="Enterprise_id" lookup="#{enterpriseLookup}"
			reRender="Enterprise_full_name"
			value="#{salarySearch.enterprise.id}" size="5" />
		<aon:lookupButton 
			windowTitle="#{companyBundle.company_enterprise_selection}"
			selectReRender="Enterprise_id,Enterprise_full_name" actionType="search"
			lookup="#{enterpriseLookup}" minHeight="460" minWidth="650"
			property="#{salarySearch.enterprise}">
		</aon:lookupButton>
		<aon:inputText id="Enterprise_full_name"
			value="#{(salarySearch.enterprise.registry.fullName!=null)?(salarySearch.enterprise.registry.fullName):('')}"
			size="50" disabled="true" />							
	</aon:div>

	<aon:outputLabel for="Salary_startDate"
		value="#{bundle.aon_start_date}" />
	<aon:selectInputDate id="Salary_startDate"
		valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}"/>

	<aon:outputLabel for="Salary_endDate"
		value="#{bundle.aon_end_date}" />
	<aon:selectInputDate id="Salary_endDate"
		valueChangeListener="#{controller.addLessThanOrEqualExpression}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}"/>
