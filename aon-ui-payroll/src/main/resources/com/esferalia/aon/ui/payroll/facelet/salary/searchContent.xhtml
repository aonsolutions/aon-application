<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{salarySearch.person}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<aon:outputLabel for="Salary_startDate"
		value="#{bundle.aon_start_date}" />
	<aon:selectInputDate id="Salary_startDate"
		value="#{salarySearch.startDate}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}"/>

	<aon:outputLabel for="Salary_endDate"
		value="#{bundle.aon_end_date}" />
	<aon:selectInputDate id="Salary_endDate"
		value="#{salarySearch.endDate}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}"/>

	<c:if test="#{showSalaryType}">
		<aon:outputLabel for="Salary_type" value="#{bundle.aon_type}" />
		<aon:selectOneMenu id="Salary_type" converter="aon.EnumConverter"
			valueChangeListener="#{controller.addEqualExpression}" >
			<f:selectItem itemLabel="#{bundle.aon_common_all}" value="#{null}" />
			<f:selectItems value="#{payrollCollections.salaryTypes}" />
		</aon:selectOneMenu>
	</c:if>		
				
</ui:composition>
