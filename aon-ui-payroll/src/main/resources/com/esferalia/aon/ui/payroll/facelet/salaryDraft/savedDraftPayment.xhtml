<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<aon:panelGrid columns="2" style="width: 1000px;"
		columnClasses="aon-noborder, aon-noborder">
	
	<aon:div styleClass="aon-width-all aon-text-center aon-bold aon-italic" style="text-transform:uppercase;">
		<aon:outputText value="#{payrollBundle.payroll_salary_draft}"/>
	</aon:div>
	<aon:div styleClass="aon-width-all aon-text-center aon-bold aon-italic" style="text-transform:uppercase;">
		<aon:outputText value="#{payrollBundle.payroll_salary}"/>
	</aon:div>
	
	<aon:div style="width: 840px; margin-top: 10px;">
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/payment/gridContent.xhtml" >
			<ui:param name="controller" value="#{controller}" />
			<ui:param name="totalPayment" value="#{totalPayment}" />
		</ui:include>
	</aon:div>
	
	<aon:div styleClass="aon-margin-top" 
		style="width: 155px; margin-top: 20px; margin-left: 5px;background-color: #F6F6F6;">
		
		<aon:panelGrid columns="1" style="width: 100%;margin-right:10px;"
			styleClass="aon-border"
			columnClasses="aon-noborder aon-padding-right aon-width-150 aon-text-right aon-bold">
			
			<aon:outputText value="&#160;I. #{payrollBundle.payroll_salary_payments}&#160;" 
				styleClass="aon-bold" style="position: relative; top: -8px; margin-left: 5px; background-color: white;"/>

			<aon:outputText value="&#160;"/>
			
			<aon:outputText value="&#160;"/>
		
			<c:forEach items="#{payments.baseSalary}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>
			
			<aon:outputText value="&#160;"/>
		
			<c:forEach items="#{payments.salarySupplements}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>
			
			<c:forEach items="#{payments.overtimeHours}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>
			
			<c:forEach items="#{payments.specialBonuses}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>
			
			<c:forEach items="#{payments.salaryInKind}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>
			
			<aon:outputText value="&#160;"/>
			
			<aon:outputText value="&#160;"/>

			<c:forEach items="#{payments.compensationOrPrepaidExpenses}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}" 
						value="#{to.textValue}"
						styleClass="#{to.style}" />
					<aon:outputText rendered="#{to.showAmount}"
						value="#{to.doubleValue}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>
			
			<c:forEach items="#{payments.specialSecurityBenefits}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>
			
			<c:forEach items="#{payments.movingCompensation}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>

			<c:forEach items="#{payments.otherNonWages}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}" 
						value="#{to.textValue}"
						styleClass="#{to.style}" />
					<aon:outputText rendered="#{to.showAmount}"
						value="#{to.doubleValue}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText rendered="#{!payments.totalPayment.showAmount}" 
					value="#{payments.totalPayment.textValue}"
					styleClass="#{payments.totalPayment.style}" />
				<aon:outputText rendered="#{payments.totalPayment.showAmount}"
					value="#{payments.totalPayment.doubleValue}"
					styleClass="#{payments.totalPayment.style}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
		
		</aon:panelGrid>		
	</aon:div>

	</aon:panelGrid>
</ui:composition>
