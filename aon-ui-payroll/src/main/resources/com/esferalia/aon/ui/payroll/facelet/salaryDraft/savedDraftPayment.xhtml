<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<aon:div  styleClass="aon-border aon-margin-top" style="background-color: #F6F6F6;">
		
		<aon:panelGrid columns="1" style="width: 100%;margin-right:10px;"
			columnClasses="aon-noborder aon-padding-right aon-text-right aon-bold">
			
			<aon:outputText value="&#160;&#160;" 
				styleClass="aon-bold aon-padding-left aon-text-left " style="position: relative; top: -8px;  margin-left: 5px; "/>

			<aon:outputText value="&#160;"/>
			
			<aon:outputText value="&#160;"/>
		
			<c:forEach items="#{payments.baseSalary}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>
			
			<aon:outputText value="&#160;"/>
		
			<c:forEach items="#{payments.salarySupplements}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}"

						rendered="#{to.showAmount}"
						styleClass="#{to.style}">

			</c:forEach>

			<aon:outputText value="&#160;"/>
			
			<c:forEach items="#{payments.overtimeHours}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>
			
			<c:forEach items="#{payments.specialBonuses}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>
			
			<c:forEach items="#{payments.salaryInKind}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>
			
			<aon:outputText value="&#160;"/>
			
			<aon:outputText value="&#160;"/>

			<c:forEach items="#{payments.compensationOrPrepaidExpenses}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}" 
						value="#{to.textValue}"
						styleClass="#{to.style}" />
					<aon:outputText rendered="#{to.showAmount}"
						value="#{to.doubleValue}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>
			
			<c:forEach items="#{payments.specialSecurityBenefits}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>
			
			<c:forEach items="#{payments.movingCompensation}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}"
						styleClass="#{to.style}" 
						value="#{to.textValue}"/>
					<aon:outputText value="#{to.doubleValue}"
						rendered="#{to.showAmount}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />

				</aon:div>
			</c:forEach>

			<aon:outputText value="&#160;"/>

			<c:forEach items="#{payments.otherNonWages}" var="to">
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText rendered="#{!to.showAmount}" 
						value="#{to.textValue}"
						styleClass="#{to.style}" />
					<aon:outputText rendered="#{to.showAmount}"
						value="#{to.doubleValue}"
						styleClass="#{to.style}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
			</c:forEach>

			<aon:div style="">
				<aon:outputText value="&#160;"/>
				<aon:outputText rendered="#{!payments.totalPayment.showAmount}" 
					value="#{payments.totalPayment.textValue}"
					styleClass="#{payments.totalPayment.style}" />
				<aon:outputText rendered="#{payments.totalPayment.showAmount}"
					value="#{payments.totalPayment.doubleValue}"
					styleClass="#{payments.totalPayment.style}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
		
		</aon:panelGrid>		
	</aon:div>

</ui:composition>
