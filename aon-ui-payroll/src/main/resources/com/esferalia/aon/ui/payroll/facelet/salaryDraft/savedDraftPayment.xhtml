<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<ui:define name="paymentsTemplate" >
			<c:if test="#{empty notitle}">
				<aon:div style="margin-left: 20px;">
					<aon:outputText value="&#160;"/>
				</aon:div>
			</c:if>
			<c:forEach items="#{payments.collection}" var="payment">
				<aon:div styleClass="#{ ( payment.difference  > 0.01 )  ? 'aon-label-error': '' }" style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<c:if test="#{payment.oldAmount != null }" >
						<aon:outputText value="#{payment.oldAmount}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</c:if>
					<c:if test="#{payment.oldAmount == null }" >
						<aon:outputText value="?" />
					</c:if>
				</aon:div>
			</c:forEach>
	</ui:define>
	
	<aon:div styleClass="aon-margin-top aon-border" 
		style="background-color:#F6F6F6;;">
		
		<aon:panelGrid columns="1" style="width: 100%;margin-right:10px;"
			columnClasses="aon-noborder aon-padding-left aon-width-auto">
			
			<aon:outputText value="&#160;&#160;" 
				styleClass="aon-bold" style="position: relative; top: -8px; margin-left: 5px; "/>
			<aon:outputText value="&#160;"/>

		</aon:panelGrid>

		<aon:panelGrid columns="1" style="width: 100%;margin-right:10px;"
			columnClasses="aon-noborder aon-padding-right aon-text-right aon-bold">
			
			<aon:div style="margin-left: 10px;">
				<aon:outputText value="&#160;"/>
			</aon:div>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftItem.xhtml" >
				<ui:param name="items" value="#{sortedSalaryPayments.payments['BASE_SALARY']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftItem.xhtml" >
				<ui:param name="items" value="#{sortedSalaryPayments.payments['SALARY_SUPPLEMENTS']}" />
			</ui:include>
			

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftItem.xhtml" >
				<ui:param name="title" value="#{payrollBundle.payroll_salary_overtime_hours}" />
				<ui:param name="items" value="#{sortedSalaryPayments.payments['STRUCTURAL_HOURS']}" />
			</ui:include> 	
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftItem.xhtml" >
				<ui:param name="notitle" value="true" />
				<ui:param name="items" value="#{sortedSalaryPayments.payments['NON_STRUCTURAL_HOURS']}" />
			</ui:include> 	

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftItem.xhtml" >
				<ui:param name="items" value="#{sortedSalaryPayments.payments['SPECIAL_BONUSES']}" />
			</ui:include>
			
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftItem.xhtml" >
				<ui:param name="items" value="#{sortedSalaryPayments.payments['SALARY_IN_KIND']}" />
			</ui:include>

			<aon:div style="margin-left: 10px;">
				<aon:outputText value="&#160;" styleClass="aon-bold"/>
			</aon:div>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftItem.xhtml" >
				<ui:param name="items" value="#{sortedSalaryPayments.payments['COMPENSATION_OR_PREPAID_EXPENSES']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftItem.xhtml" >
				<ui:param name="items" value="#{sortedSalaryPayments.payments['SOCIAL_SECURITY_BENEFITS']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftItem.xhtml" >
				<ui:param name="items" value="#{sortedSalaryPayments.payments['MOVING_COMPENSATION']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftItem.xhtml" >
				<ui:param name="items" value="#{sortedSalaryPayments.payments['OTHER_NON_WAGE']}" />
			</ui:include>

			<aon:div style="">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{totalPayment}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>

		</aon:panelGrid>		

	</aon:div>

</ui:composition>
