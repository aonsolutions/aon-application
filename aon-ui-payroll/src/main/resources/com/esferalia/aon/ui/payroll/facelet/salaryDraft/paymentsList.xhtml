<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<aon:dataTable id="ContractPaymentTable" var="to" value="#{salaryDraft.paymentsModel}" rows="0">

		<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton id="ContractPayment-select"
				title="#{bundle.aon_update}" 
				actionListener="#{controller.onEdit}"
				reRender="paymentModalContainer"
				styleClass="aon-editDataTable-button aon-icon-rowSelector"/>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton
						id="ContractPayment-reset" 
						title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						actionListener="#{controller.onReset}"
						reRender="paymentModalContainer"
						styleClass="aon-editDataTable-button aon-icon-reset"
						accesskey="#{bundle.aon_key_new_line}"/>
				</aon:div>
			</f:facet>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-250">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.type}"/>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_description}" />
			</f:facet>
			<aon:outputText value="#{to.fullDescription}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.expression}"/>
		</aon:column>
		
	</aon:dataTable>
	
</ui:composition>
