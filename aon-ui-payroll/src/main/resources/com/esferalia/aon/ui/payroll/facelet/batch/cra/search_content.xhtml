<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
		
	<aon:outputLabel for="EnterpriseCCC_type" value="#{bundle.company_enterprise_ccc}" />
	<aon:selectOneMenu id="EnterpriseCCC_type" converter="aon.EnumConverter"
		valueChangeListener="#{controller.addEqualExpression}" >  
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{payrollCollections.CCCTypes}" />
	</aon:selectOneMenu>
	
	<aon:outputLabel for="EnterpriseCCC_geozone" value="#{bundle.aon_state}" />
	<aon:selectOneMenu id="EnterpriseCCC_geozone" value="#{controller.geozone}" >
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{geozoneCollections.geoTrees}" />
	</aon:selectOneMenu>
	
	<aon:outputText value="&#160;" />
	<aon:commandButton id="detailSearch"
		value="#{bundle.aon_search}" status="aonStatus"
		reRender="#{searchReRender}"
		actionListener="#{controller.onSearch}"
		requestDelay="100"
		styleClass="aon-icon-rubber aon-search-lookup-button">
	</aon:commandButton>
	
</ui:composition>
