<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.payroll_contract_module}" />
				<ui:param name="controller" value="#{contract}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="contractList-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="contractList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="contractList_report"
						value="#{bundle.aon_listing}" target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="contractList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/listContent.xhtml">
					<ui:param name="skipWorkPlaceColumn" value="true" />
					<ui:param name="skipEnterpriseColumn" value="true" />
				</ui:include>
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
