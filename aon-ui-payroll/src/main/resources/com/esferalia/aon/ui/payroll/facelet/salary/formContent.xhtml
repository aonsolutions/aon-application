<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >

	<aon:div >
		<aon:panelGrid columns="6" style="width:100%">
			<aon:outputText value="#{bundle.aon_start_date}" />
			<aon:outputText value="#{controller.to.startDate}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>		
	
			<aon:outputText value="#{payrollBundle.payroll_salary_totalPayment}" />
			<aon:outputText value="#{controller.to.totalPayment}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
	
			<aon:outputText value="#{payrollBundle.payroll_salary_totalLiquid}" />
			<aon:outputText value="#{controller.to.totalLiquid}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
	
			<aon:outputText value="#{bundle.aon_end_date}" />
			<aon:outputText value="#{controller.to.endDate}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>		
	
			<aon:outputText value="#{payrollBundle.payroll_salary_totalDeduction}" />
			<aon:outputText value="#{controller.to.totalDeduction}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:panelGrid>
	</aon:div>

</ui:composition>
