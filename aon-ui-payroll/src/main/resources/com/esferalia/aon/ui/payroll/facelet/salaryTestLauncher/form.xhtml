<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"	
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	 	<a4j:region>
        	<h:form>
            	<a4j:poll id="poll" interval="500" enabled="#{salaryTestLauncher.pollEnabled}" 
            		reRender="poll,launchSalaries,messagesContainer" />
        	</h:form>
    	</a4j:region>
    	
		<aon:form id="salaryTestLauncherForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_salary_test_launcher_module}" />
			</ui:decorate>
			
			<aon:div styleClass="aon-panelGrid-search">
				<aon:div styleClass="aon-panelGrid-search-info">
					<aon:outputText value="#{payrollBundle.payroll_launch_info}" styleClass="aon-panelGrid-search-info-internal"/>
				</aon:div>			
		
				<aon:panelGrid id="salaryTestLauncherLaunchContent" columns="6">
	
					<aon:outputLabel for="Month" value="#{bundle.aon_month}" />
					<h:panelGrid columns="3">
						<aon:selectOneMenu id="Month" value="#{salaryTestLauncher.params.issueMonth}">
							<f:selectItems value="#{commonCollections.months}"  />
						</aon:selectOneMenu>
						<aon:outputText value="&#160;" />
			   			<rich:inputNumberSpinner id="Year" value="#{salaryTestLauncher.params.issueYear}" inputSize="4" minValue="2009" maxValue="2020" />
					</h:panelGrid>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox value="#{salaryTestLauncher.saveLog}" />
						<aon:outputText value="#{payrollBundle.payroll_launch_saveLog}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox value="#{salaryTestLauncher.testTotalPayment}" />
						<aon:outputText value="#{payrollBundle.payroll_launch_testTotalPayment}" />
					</aon:div>

					<aon:outputLabel for="Person_id" value="#{registryBundle.registry_person}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Person_id" lookup="#{personLookup}"
							reRender="Person_full_name"
							value="#{salaryTestLauncher.params.person.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{registryBundle.registry_person_selection}"
							selectReRender="Person_id,Person_full_name" actionType="search"
							lookup="#{personLookup}" minHeight="460" minWidth="650"
							property="#{salaryTestLauncher.params.person}">
						</aon:lookupButton>
						<aon:inputText id="Person_full_name"
							value="#{(salaryTestLauncher.params.person.registry.fullName!=null)?(salaryTestLauncher.params.person.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox value="#{salaryTestLauncher.debugEnabled}" />
						<aon:outputText value="#{payrollBundle.payroll_launch_debugEnabled}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox value="#{salaryTestLauncher.testBaseIRPF}" />
						<aon:outputText value="#{payrollBundle.payroll_launch_testBaseIRPF}" />
					</aon:div>

					<aon:outputLabel for="Enterprise_id"
						value="#{companyBundle.company_enterprise}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Enterprise_id" lookup="#{enterpriseLookup}"
							reRender="Enterprise_full_name"
							value="#{salaryTestLauncher.params.enterprise.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{companyBundle.company_enterprise_selection}"
							selectReRender="Enterprise_id,Enterprise_full_name" actionType="search"
							lookup="#{enterpriseLookup}" minHeight="460" minWidth="650"
							property="#{salaryTestLauncher.params.enterprise}">
						</aon:lookupButton>
						<aon:inputText id="Enterprise_full_name"
							value="#{(salaryTestLauncher.params.enterprise.registry.fullName!=null)?(salaryTestLauncher.params.enterprise.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>
					

<!-- 
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox value="#{salaryTestLauncher.refreshEnabled}" />
						<aon:outputText value="#{payrollBundle.payroll_launch_refreshEnabled}" />
					</aon:div>
 -->
	
					<aon:outputText value="&#160;" />
					<aon:outputText value="&#160;" />

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox value="#{salaryTestLauncher.testBaseCGC}" />
						<aon:outputText value="#{payrollBundle.payroll_launch_testBaseCGC}" />
					</aon:div>
					
					
					<aon:outputText value="&#160;" />
					<aon:div >
						<aon:commandButton id="launchSalaries"
							value="#{payrollBundle.payroll_launch}" 
							styleClass="aon-search-lookup-button"
							disabled="#{salaryTestLauncher.pollEnabled}"
							reRender="poll,launchSalaries,messagesContainer"
							actionListener="#{salaryTestLauncher.onExecute}">
				     	</aon:commandButton>
					</aon:div>
					<aon:outputText value="&#160;" />
					<aon:outputText value="&#160;" />
 				</aon:panelGrid>
			</aon:div>
			
			<aon:div id="messagesContainer" >
				<c:if test="#{salaryTestLauncher.messages != null}">
					
					<aon:div style="margin-left: 50px; margin-top: 10px;">		
						<aon:htmlCommandLink target="_blank"
							title="DESCARGAR LOG"
							value="DESCARGAR LOG"
							style="border-width: 0px 0px 0px 0px;"
							actionListener="#{salaryTestLauncher.downloadDisk}"
							rendered="#{!salaryTestLauncher.emptyLog}"
							styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
					</aon:div>
						
					<aon:div  styleClass="aon-margin-left aon-margin-top aon-margin-bottom aon-margin-right"
						style="background-color: #EEEEEE; border: solid black 1px; height:400px; overflow-y: scroll;">
						<aon:outputText value="#{salaryTestLauncher.style}" escape="false"/>
						<ul>
						<ui:repeat var="message" value="#{salaryTestLauncher.messages}">
							<li>
								<aon:commandLink  
									rendered="#{message.link and message.contractId!=null}"
									style="display: inline; "
									action="salaryDraft_form" >
									<aon:outputText value="#{message.msg}" escape="false" />
									<f:setPropertyActionListener value="#{message.contractId}" 
										target="#{salaryTestLauncher.contractId}" />
									<aon:actionListener method="#{salaryTestLauncher.onSalaryDraft}" />
						     	</aon:commandLink>	
								<aon:outputText value="#{message.msg}" escape="false" 
									rendered="#{!(message.link and message.contractId!=null)}"/>
							</li>
						</ui:repeat>
						</ul>
						<aon:graphicImage
							styleClass="aon-margin-left aon-margin-top" 
							url="/css/images/processing.gif" 
							rendered="#{salaryTestLauncher.pollEnabled}"/>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
