<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/esferalia/aon/ui/payroll/facelet/enterpriseTree/treeTemplate.xhtml">

	<ui:define name="header">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_irpfResult_module}" />
			<ui:param name="toolbarDescription" value="&#160;" />
			<ui:define name="toolbarContent">
				<c:if test="#{salary.model.rowCount > 0}" >
					<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/irpfResult/buttons.xhtml" />
				</c:if>
				<aon:spin id="enterpriseSpin" controller="#{irpfResult}" />
			</ui:define>				
		</ui:decorate>		
	</ui:define>
		
	<ui:define name="content">
		<c:if test="#{irpfResult.model.rowCount == 0}" >
			<aon:outputText value="#{payrollBundle.payroll_irpf_no_irpf_exist}" 
				styleClass="aon-bold aon-italic"/>
		</c:if>
		
		<c:if test="#{irpfResult.model.rowCount > 0}" >
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/irpfResult/formIrpfResult.xhtml" >
				<ui:param name="irpf" value="#{irpfResult}" />
				<ui:param name="propertyEditor" value="/com/esferalia/aon/ui/payroll/facelet/contract/irpfResult/defaultPropertyEditor.xhtml" />
			</ui:include>
		</c:if>
	</ui:define>
	
	<ui:define name="additionalContent">
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
	</ui:define>

</ui:composition>
