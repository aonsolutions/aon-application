<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<a4j:support
		event="onclick" reRender="waitProcess_poll" ajaxSingle="true"
		actionListener="#{logPanel.onShowWindow}" 
		oncomplete="javascript:Richfaces.showModalPanel('waitProccess');" />
	<a4j:support 
		event="oncomplete" reRender="waitProcess_poll" ajaxSingle="true"
		oncomplete="javascript:Richfaces.hideModalPanel('waitProccess');" />
	<aon:actionListener method="#{logPanel.onCloseWindow}" />

</ui:composition>
