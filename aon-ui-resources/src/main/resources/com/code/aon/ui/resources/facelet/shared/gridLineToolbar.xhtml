<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:column>
		<f:facet name="header">
			<aon:outputText value=" " />
		</f:facet>
		<aon:commandButton title="#{bundle.aon_accept} (#{bundle.aon_key_save_line_accelerator})"
			actionListener="#{controller.onAccept}"
			reRender="#{reRenderAttr}"
			onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
			styleClass="aon-editDataTable-button aon-icon-accept"
			rendered="#{to.id==controller.to.id}"
			accesskey="#{bundle.aon_key_save_line}" />
		<aon:commandButton title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
			actionListener="#{controller.onCancel}" immediate="#{true}"
			reRender="#{reRenderAttr}"
			onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
			styleClass="aon-editDataTable-button aon-icon-cancel"
			accesskey="#{bundle.aon_key_cancel_line}"
			rendered="#{to.id==controller.to.id}" />
		<f:facet name="footer">
			<aon:div>
				<aon:commandButton title="#{bundle.aon_accept} (#{bundle.aon_key_save_line_accelerator})"
					actionListener="#{controller.onAccept}"
					onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
					reRender="#{reRenderAttr}"
					styleClass="aon-editDataTable-button aon-icon-accept" value=""
					accesskey="#{bundle.aon_key_save_line}"
					rendered="#{controller.new}" />
				<aon:commandButton title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
					actionListener="#{controller.onCancel}" immediate="#{true}"
					reRender="#{reRenderAttr}"
					onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
					styleClass="aon-editDataTable-button aon-icon-cancel" value=""
					accesskey="#{bundle.aon_key_cancel_line}"
					rendered="#{controller.new}" />
			</aon:div>
		</f:facet>
	</aon:column>
</ui:composition>
