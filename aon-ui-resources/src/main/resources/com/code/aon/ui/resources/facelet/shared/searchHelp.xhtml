<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<rich:modalPanel id="searchHelp" height="380" width="320">

		<f:facet name="header">
			<aon:div styleClass="aon-popupWindow-title">
				<aon:outputText value="#{bundle.aon_help}" />
			</aon:div>
		</f:facet>
		
		<f:facet name="controls">
			<aon:commandButton requestDelay="100"
				reRender="aonStatus" immediate="true" ajaxSingle="true"
				type="button" styleClass="aon-popupWindow-close" >
				<aon:actionHotKey key="esc" />					
				<rich:componentControl for="searchHelp" event="onclick"
					disableDefault="true" operation="hide"/>								
			</aon:commandButton>	
		</f:facet>

		<aon:div styleClass="aon-icon-big-info aon-message-big">
				<aon:outputText value="#{bundle.aon_meta_characters}"/>
		</aon:div>

		
		<aon:panelGrid columns="2">

			<aon:outputText value="#{bundle.aon_meta_igual}" />
			<aon:outputText value="#{bundle.aon_meta_igual_description}" />

			<aon:outputText value="#{bundle.aon_meta_mayor}" />
			<aon:outputText value="#{bundle.aon_meta_mayor_description}" />

			<aon:outputText value="#{bundle.aon_meta_menor}" />
			<aon:outputText value="#{bundle.aon_meta_menor_description}" />

			<aon:outputText value="#{bundle.aon_meta_mayor_igual}" />
			<aon:outputText value="#{bundle.aon_meta_mayor_igual_description}" />

			<aon:outputText value="#{bundle.aon_meta_menor_igual}" />
			<aon:outputText value="#{bundle.aon_meta_menor_igual_description}" />

			<aon:outputText value="#{bundle.aon_meta_diferente}" />
			<aon:outputText value="#{bundle.aon_meta_diferente_description}" />

			<aon:outputText value="#{bundle.aon_meta_entre}" />
			<aon:outputText value="#{bundle.aon_meta_entre_description}" />

			<aon:outputText value="#{bundle.aon_meta_o}" />
			<aon:outputText value="#{bundle.aon_meta_o_description}" />

			<aon:outputText value="#{bundle.aon_meta_y}" />
			<aon:outputText value="#{bundle.aon_meta_y_description}" />

			<aon:outputText value="#{bundle.aon_meta_asterisco}" />
			<aon:outputText value="#{bundle.aon_meta_asterisco_description}" />

			<aon:outputText value="#{bundle.aon_meta_interrogacion}" />
			<aon:outputText value="#{bundle.aon_meta_interrogacion_description}" />

			<aon:outputText value="#{bundle.aon_meta_null}" />
			<aon:outputText value="#{bundle.aon_meta_null_description}" />

			<aon:outputText value="#{bundle.aon_meta_notnull}" />
			<aon:outputText value="#{bundle.aon_meta_notnull_description}" />
				
		</aon:panelGrid>
			
	</rich:modalPanel>
	
</ui:composition>
