	<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<c:if test="#{!aonConfiguration.properties.hideMenuBar}">
		<aon:form>
			<aon:menuBar id="mainMenu">
				<ui:insert name="beforeMenuContent"/>
				<ui:insert name="menuContent"/>		
				<ui:insert name="afterMenuContent"/>		
				<rich:toolBarGroup style="padding-right: 6px;padding-left: 6px"
					location="right" itemSeparator="line">
					<ui:insert name="beforeRightMenuContent"/>
					<h:outputLink target="_top"
						title="#{bundle.aon_home}"
						styleClass="aon-icon-home"
						value="${facesContext.externalContext.requestContextPath}">
						<h:outputText value="&#160;" />
					</h:outputLink>			
					<aon:dropDownMenu>
		                <f:facet name="label"> 
	                        <aon:graphicImage title="#{bundle.aon_help}"
	                        	value="#{aonResource.resolve['/images/aon-main-menu/aon-icon-help.png']}" />
		                </f:facet>						
						<c:if test="#{webMap != null}">
							<aon:menuItem id="webMap" action="webMap"
								value="#{bundle.aon_web_map}" />
						</c:if>
						<aon:menuItem id="about"
							value="#{bundle.aon_about}" />
					</aon:dropDownMenu>						
				</rich:toolBarGroup>	 		
	 		</aon:menuBar>
		</aon:form>
	</c:if>
 </ui:composition>
