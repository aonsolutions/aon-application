<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{!aonConfiguration.properties.hideMenuBar}">
		<aon:form id="mainMenuForm">
			<aon:menuBar id="mainMenu">
				<ui:insert name="beforeMenuContent"/>
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{selectedMenu.updateCommands}">	
					<aon:componentGroupMethod
						family="javax.faces.Command"
						rendered="#{aonConfiguration.bean.actionDenied.modulesEnabled}"
						method="#{actionDenied.renderedModule}" />
					<ui:insert name="menuContent"/>
				</aon:componentGroup>		
				<ui:insert name="afterMenuContent"/>		
				<rich:toolBarGroup id="rightMenuContent"
					style="padding-right: 5px;padding-left: 5px"
					location="right" itemSeparator="line">
					<aon:componentGroup
						family="javax.faces.Command,org.richfaces.DropDownMenu"
						method="#{selectedMenu.updateCommandsToReset}">		
						<aon:componentGroupMethod
							family="org.richfaces.DropDownMenu"
							method="#{actionDenied.renderedMenuItem}" />
						<aon:if test="#{aonConfiguration.bean.alarm.showPending}">
							<aon:commandLink id="pendingAlarms"
								title="#{alarm.pendingAlarmTitle}"
								value="(#{alarm.pendingCount})"
								rendered="#{alarm.pendingCount &gt; 0}"
								action="alarm_list" actionListener="#{alarm.onInit}" 
								style="padding-right: 5px;padding-left: 18px"
								styleClass="aon-bold aon-menu-icon aon-icon-alarm-pending" />					
						</aon:if>
						<aon:if test="#{company.helpdeskEnabled}">
							<aon:commandLink id="menu-quickIssue" 
								action="gwt_office"
								title="C.A.U." value="&#160;"
								styleClass="aon-menu-icon aon-icon-helpdesk" />
						</aon:if>
						<aon:commandLink id="showEmailWindow" 
							styleClass="aon-menu-icon aon-icon-email"
							title="#{bundle.webmail_send_email}" 
							ajaxSingle="true" reRender="showNewMessageWindow"
							rendered="#{(!aonConfiguration.properties.hideMenuEmail) and (mailConfig.mailAccountCount &gt; 0)}"
							value="&#160;" actionListener="#{webmailMessage.onSendEmail}" >
						</aon:commandLink>
						<ui:insert name="beforeRightMenuContent"/>								
						<aon:commandLink id="home" action="home"
							rendered="#{!aonConfiguration.properties.hideMenuHome}"
							title="#{bundle.aon_home}"
							styleClass="aon-menu-icon aon-icon-home"
							value="&#160;" />
						<aon:dropDownMenu>
			                <f:facet name="label"> 
		                        <aon:graphicImage title="#{bundle.aon_help}"
		                        	value="#{aonResource.resolve['/images/aon-main-menu/aon-icon-help.png']}" />
			                </f:facet>		
			                <aon:if test="#{aonConfiguration.bean.alarm.showList}">
		                		<aon:menuItem id="alarm"
									value="#{bundle.aon_alarm}"
									action="alarm_list" actionListener="#{alarm.onInit}" 
									iconClass="aon-icon-alarm" />
							</aon:if>	
			                <ui:insert name="beforeHelpMenuContent"/>
			                <aon:menuGroup
			                	rendered="#{!aonConfiguration.properties.hideMenuChooseLanguage}"
			                	value="#{bundle.aon_chooseLocale}">
		                		<aon:menuItem id="spanishLanguage" reRender="aonHeader,aonContent"
		                			value="#{aonConfiguration.locales[0].displayName}"
									iconClass="#{aonConfiguration.locales[0].iconClass}" 
									actionListener="#{aonConfiguration.locales[0].onChangeLanguage}" />
		                		<aon:menuItem id="englishLanguage" reRender="aonHeader,aonContent"
		                			value="#{aonConfiguration.locales[1].displayName}"
									iconClass="#{aonConfiguration.locales[1].iconClass}" 
									actionListener="#{aonConfiguration.locales[1].onChangeLanguage}" />
			                </aon:menuGroup>		                
							<aon:menuItem submitMode="none" reRender="aonStatus"
								rendered="#{!aonConfiguration.properties.hideMenuHelp}"
								iconClass="aon-icon-menu-help">
								<h:outputLink style="font-size:1em;"
									value="#{aonConfiguration.helpURL}"
									target="_blank" >
									<aon:outputText value="#{bundle.aon_help}" />
								</h:outputLink>
							</aon:menuItem>
							<aon:menuItem id="about" reRender="aboutWindowPanel"
								rendered="#{!aonConfiguration.properties.hideMenuAbout}"
								iconClass="aon-icon-about"
								value="#{bundle.aon_about}" >
								<f:setPropertyActionListener target="#{aonConfiguration.properties.showAbout}" value="#{true}" />
							</aon:menuItem>
						</aon:dropDownMenu>
					</aon:componentGroup>						
				</rich:toolBarGroup>	 		
	 		</aon:menuBar>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/about.xhtml" />
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />				
	</aon:if>
 </ui:composition>
