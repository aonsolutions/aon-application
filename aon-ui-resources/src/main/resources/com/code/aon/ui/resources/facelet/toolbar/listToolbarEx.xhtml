<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:valueParam name="showMoreMenu" default="#{false}"/>

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:define name="toolbarContent">
			<aon:if test="#{!skipSearchButton}">
				<aon:commandButton id="#{toolbarID}-search"
					title="#{bundle.aon_search} [#{bundle.aon_key_search_accelerator}]" immediate="true"
					value="#{bundle.aon_search}" reRender="#{searchButtonReRender}"
					action="#{searchAction}" actionListener="#{searchActionListener}"
					styleClass="aon-finding-toolbar-item aon-icon-search"
					accesskey="#{bundle.aon_key_search}" />
			</aon:if>
			<aon:if test="#{!skipResetButton}">								
				<aon:commandButton id="#{toolbarID}-reset"
					title="#{resetLabel} [#{bundle.aon_key_new_accelerator}]" immediate="true"
					value="#{resetLabel}" reRender="#{resetButtonReRender}"
					action="#{resetAction}" actionListener="#{resetActionListener}"
					styleClass="aon-finding-toolbar-item aon-icon-reset"
					accesskey="#{bundle.aon_key_new}" />
			</aon:if>	
			
			<ui:insert name="beforeSpinToolbarContent"/>
			
			<aon:if test="#{showMoreMenu}">
				
 				<aon:if test="#{app.standAlone}">
					
					<aon:dropDownMenu 
						value="#{bundle.aon_more2}"
						styleClass="aon-finding-toolbar-item aon-dropDownMenu"
					 >
						<f:facet name="label">
							<aon:panelGroup>
								<aon:outputText styleClass="material-symbols-outlined" value="more_vert" /> 
							</aon:panelGroup>	
						</f:facet>
						<ui:insert name="moreMenuContent"/>
						<aon:ifDefined name="additionalToolbarContent">
							<rich:menuSeparator id="historyMenuSeparator" />		
							<aon:insertMenuItems name="additionalToolbarContent"/>
						</aon:ifDefined>
					</aon:dropDownMenu>
					
				</aon:if>	

				<aon:if test="#{!app.standAlone}">
				
					<aon:dropDownMenu value="#{bundle.aon_more2}"
					 	style="display:inline-block;font-size:0.8em;margin-right:4px;" >
			             <f:facet name="label">
			             	<aon:panelGroup>
			             		<aon:outputText value="#{bundle.aon_more2}" /> 
			                     <aon:graphicImage style="vertical-align:middle;"
			                     	value="#{aonResource.resolve['/images/aon-icon/aon-icon-dropDown.gif']}" />
			                    </aon:panelGroup>
			             </f:facet>			
			             <ui:insert name="moreMenuContent"/>		                
					</aon:dropDownMenu>
				
				</aon:if>			
			
			</aon:if>
			<aon:if test="#{!showMoreMenu and app.standAlone }">
				<aon:ifDefined name="additionalToolbarContent">
					<aon:dropDownMenu 
						value="#{bundle.aon_more2}"
						styleClass="aon-finding-toolbar-item aon-dropDownMenu"
					 >
						<f:facet name="label">
							<aon:panelGroup>
								<aon:outputText styleClass="material-symbols-outlined" value="more_vert" /> 
							</aon:panelGroup>	
						</f:facet>
						<aon:insertMenuItems name="additionalToolbarContent"/>
					</aon:dropDownMenu>
				</aon:ifDefined>
			</aon:if>

			<aon:if test="#{showFilterWidget}">
				<script type="text/javascript">
	           	//<![CDATA[
		         function moveAtEndFilterInput() {
					let filterInput = #{rich:element(toolbarID.concat('-filter-input'))};
					filterInput.focus();
					filterInput.setSelectionRange(filterInput.value.length, filterInput.value.length);
		         }
         		//]]>
				</script>
				<aon:div id="#{toolbarID}-filter" styleClass="aon-finding-filter-toolbar" >					 
					<aon:inputText 
					id="#{toolbarID}-filter-input"
					placeholder="#{bundle.aon_filter}..."
					valueChangeListener="#{filterChangeListener}"
					styleClass="aon-finding-filter-input aon-inputText aon-icon-search"  
					>
						<a4j:support 
						event="onkeyup"
						requestDelay="500"
						ajaxSingle="true"
						limitToList="true"
						reRender="aonContent"
						ignoreDupResponses="true"
						eventsQueue="#{toolbarID}FilterKeyUp"
						oncomplete="javascript:moveAtEndFilterInput()"
						onsubmit="if (window.event.which == 27 || window.event.which == 38 || window.event.which == 40) {return false;}"
						>
							<aon:actionListener method="#{filterActionListener}" />
						</a4j:support> 
					</aon:inputText>												
 				</aon:div>												
 			</aon:if>	
			
				
		</ui:define>
	</ui:decorate>
	
</ui:composition>
