<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbarEx.xhtml" >
		<aon:valueParam name="toolbarDescription" default="#{bundle.aon_editing}" />
		<aon:valueParam name="toolbarID" default="#{controller.beanName}Toolbar" />	
		<aon:valueParam name="formNew" default="#{controller.nevv}" />
		<aon:valueParam name="formEdit" default="#{controller.to != null}" />
		<aon:valueParam name="skipSearchButton" default="true" />
	    <aon:methodParam name="searchActionListener" default="#{controller.onEditSearch}" type="actionListener" />
		<aon:methodParam name="searchAction" default="#{controller.beanName}_search" resolve="true" />						
		<aon:methodParam name="resetActionListener" default="#{controller.onReset}" type="actionListener" />
		<aon:methodParam name="resetAction" default="" />											
		<aon:methodParam name="saveActionListener" default="#{controller.onAccept}" type="actionListener" />
		<aon:methodParam name="saveAction" default="" />			
		<aon:methodParam name="cancelNewActionListener" default="#{controller.onCancel}" type="actionListener" />
		<aon:methodParam name="cancelNewAction" default="" />			
		<aon:methodParam name="removeActionListener" default="#{controller.onRemove}" type="actionListener" />
		<aon:methodParam name="removeAction" default="" />
		<aon:methodParam name="cancelEditActionListener" default="#{controller.onCancel}" type="actionListener" />
		<aon:methodParam name="cancelEditAction" default="" />			
		<aon:valueParam name="showFilterWidget" default="#{app.standAlone}" />
	    <aon:methodParam name="filterActionListener" default="#{controller.onSearch}" type="actionListener" />
	    <aon:methodParam name="filterChangeListener" default="#{controller.addFilterExpression}" type="valueChangeListener" />
	</ui:include>
	
</ui:composition>
