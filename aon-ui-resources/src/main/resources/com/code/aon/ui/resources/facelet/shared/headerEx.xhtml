<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="aonHeader" styleClass="aon-header">
		<aon:panelGrid columns="2" width="100%"
			columnClasses="aon-header-name,aon-header-info">
			<aon:div style="margin-top: 15px">
				<aon:outputConnectionStatus id="aonStatus" layout="block"
					startStyle="#{customize.statusStartStyle}"
					startStyleClass="aon-outputConnectionStatus-start"
					stopStyle="#{customize.statusStopStyle}"
					stopStyleClass="aon-outputConnectionStatus-stop"
					onstart="resetStatusError();" />
				<aon:div id="status_error"
					style="#{customize.statusFailedStyle} display: none;"
					styleClass="aon-outputConnectionStatus-failed" />
				<aon:outputText value=" / #{appBundle.aon_application_title}"
					style="#{customize.fontStyle}" styleClass="aon-header-title" />
			</aon:div>

			<aon:div styleClass="aon-nowrap aon-padding-left" rendered="#{loggedUser.logged}"
				style="border-left:1px solid #ccc;color:#999;">
				<ui:insert name="userInfoContent" /> 
			</aon:div>
		</aon:panelGrid>

		<aon:div styleClass="aon-header-additionalInfo">
			<c:if test="#{!aonConfiguration.properties.hideHeaderLinks}">
				<aon:div styleClass="aon-float-right">
					<aon:div styleClass="aon-header-menu-item">
						<ui:insert name="beforeLogoutContent" />
						<aon:form prependId="false">			
							<aon:commandLink id="logout"
								style="#{customize.fontStyle}" styleClass="aon-logout"
								title="#{bundle.aon_login_user_logout}"
								value="#{bundle.aon_login_user_logout}"
								action="logout"
								actionListener="#{aonConfiguration.logout}" >
							</aon:commandLink>							 
						</aon:form>
					</aon:div>
				</aon:div>
			</c:if>
			<c:if test="#{!aonConfiguration.properties.hideApplicationVersion}">
				<aon:outputFormat value="#{bundle.aon_version}"
					styleClass="aon-version-label"
					rendered="#{customize.applicationVersion != null}" >
					<f:param value="#{customize.applicationVersion}" />
				</aon:outputFormat>
			</c:if>				
			<ui:insert name="afterVersionContent" />
		</aon:div>
	</aon:div>
</ui:composition>
