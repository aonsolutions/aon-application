<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/resources/facelet/shared/listEx.xhtml" >
		<aon:valueParam name="dataTableId" default="#{controller.beanName}Data" />
		<aon:valueParam name="dataModel" default="#{controller.model}" />
		<aon:valueParam name="rows" default="#{controller.pageLimit}" />
		<aon:valueParam name="showDataTable" default="#{dataModel.rowCount > 0}" />
		<aon:valueParam name="showDataScroller" default="true" />
		<aon:valueParam name="showNote" default="true" />
		<aon:valueParam name="sortMode" default="multi" />
		
		<aon:valueParam name="rowSelectorReRender" default="aonContent" />
		<aon:valueParam name="rowSelectorToggleOnClick" default="#{true}" />
		<aon:valueParam name="rowSelectorImmediate" default="#{true}" />
		<aon:methodParam name="rowSelectorAction" default="#{controller.beanName}_form" resolve="true" />
		<aon:methodParam name="rowSelectorActionListener" default="#{controller.onSelect}" type="actionListener" />
	</ui:include>
	
</ui:composition>
