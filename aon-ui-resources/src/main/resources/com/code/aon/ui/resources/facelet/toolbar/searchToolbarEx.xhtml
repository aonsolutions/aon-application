<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:define name="toolbarContent">
			<aon:if test="#{!skipClearButton}">
				<aon:commandButton id="#{toolbarID}-clear"
					value="#{bundle.aon_clear}"
					type="reset" ajaxSingle="true"
					styleClass="aon-finding-toolbar-item aon-icon-rubber" />
			</aon:if>
			<aon:if test="#{!skipResetButton}">
				<aon:commandButton id="#{toolbarID}-reset"
					title="#{bundle.aon_key_new_accelerator}"
					value="#{resetLabel}"
					action="#{resetAction}" actionListener="#{resetActionListener}"
					styleClass="aon-finding-toolbar-item aon-icon-reset"
					accesskey="#{bundle.aon_key_new}">
					<f:setPropertyActionListener target="#{controller.backAction}"
						value="#{controller.beanName}_search" />
				</aon:commandButton>
			</aon:if>
			<aon:if test="#{!skipBackButton}">
				<aon:commandButton id="#{toolbarID}-back" 
					title="#{bundle.aon_key_cancel_accelerator}"
					value="#{bundle.aon_list}"
					action="#{backAction}" actionListener="#{controller.restoreBackupCriteria}"
					styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
					accesskey="#{bundle.aon_key_cancel}">
					<aon:actionListener method="#{backActionListener}" />
				</aon:commandButton>
			</aon:if>
		</ui:define>
	</ui:decorate>
	
</ui:composition>
