<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:define name="toolbarContent">
			<aon:if test="#{!skipResetButton}">								
				<aon:commandButton id="#{toolbarID}-reset"
					title="#{bundle.aon_key_new_accelerator}"
					value="#{bundle.aon_reset}" rendered="#{!formNew}" 
					action="#{resetAction}" actionListener="#{resetActionListener}"
					styleClass="aon-finding-toolbar-item aon-icon-reset"
					accesskey="#{bundle.aon_key_new}" />
			</aon:if>				
			<aon:if test="#{!skipSaveButton}">		
				<aon:commandButton id="#{toolbarID}-save"
					title="#{bundle.aon_key_save_accelerator}"
					value="#{bundle.aon_save}" rendered="#{formEdit or formNew}"
					action="#{saveAction}" actionListener="#{saveActionListener}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" />
			</aon:if>
			<aon:confirmButton id="#{toolbarID}-cancel" 
				title="#{bundle.aon_key_cancel_accelerator}"
				value="#{bundle.aon_cancel}" 
				rendered="#{formNew}" immediate="true" 
				styleClass="aon-finding-toolbar-item aon-icon-cancel"
				confirmTitle="#{bundle.aon_confirm_title}"
				confirmMessage="#{bundle.aon_cancel_confirm}"
				confirmActionListener="#{cancelNewActionListener}"
				confirmAction="#{cancelNewAction}"
				accesskey="#{bundle.aon_key_cancel}" />
			<aon:if test="#{!skipRemoveButton}">				
				<aon:confirmButton id="#{toolbarID}-remove" 
					title="#{bundle.aon_key_remove_accelerator}"
					value="#{bundle.aon_remove}" 
					rendered="#{formEdit and (!formNew)}" immediate="true"
					styleClass="aon-finding-toolbar-item aon-icon-delete"
					confirmTitle="#{bundle.aon_confirm_title}"
					confirmMessage="#{bundle.aon_remove_confirm}"
					confirmActionListener="#{removeActionListener}"
					confirmAction="#{removeAction}"
					accesskey="#{bundle.aon_key_remove}" />
			</aon:if>
			<aon:if test="#{!skipSearchButton}">			
				<aon:commandButton id="#{toolbarID}-search"
					title="#{bundle.aon_key_search_accelerator}"
					value="#{bundle.aon_search}"
					rendered="#{!formNew}" immediate="true"
					action="#{searchAction}" actionListener="#{searchActionListener}"
					styleClass="aon-finding-toolbar-item aon-icon-search"
					accesskey="#{bundle.aon_key_search}" />
			</aon:if>														
			<aon:commandButton id="#{toolbarID}-new-cancel" 
				title="#{bundle.aon_key_cancel_accelerator}"
				value="#{bundle.aon_cancel}"
				rendered="#{formEdit and (!formNew)}" immediate="true"
				styleClass="aon-finding-toolbar-item aon-icon-cancel"
				actionListener="#{cancelEditActionListener}"
				action="#{cancelEditAction}"
				accesskey="#{bundle.aon_key_cancel}" />
				
			<aon:if test="#{showFilterWidget}">
				<script type="text/javascript">
	           	//<![CDATA[
		         function moveAtEndFilterInput() {
					let filterInput = #{rich:element(toolbarID.concat('-filter-input'))};
					filterInput.focus();
					filterInput.setSelectionRange(filterInput.value.length, filterInput.value.length);
		         }
         		//]]>
				</script>
				<aon:div id="#{toolbarID}-filter" styleClass="aon-finding-filter-toolbar" >					 
					<aon:inputText 
					id="#{toolbarID}-filter-input"
					placeholder="#{bundle.aon_filter}..."
					valueChangeListener="#{filterChangeListener}"
					styleClass="aon-finding-filter-input aon-inputText aon-icon-search"  
					>
						<a4j:support 
						event="onkeyup"
						requestDelay="500"
						ajaxSingle="true"
						limitToList="true"
						reRender="aonContent"
						ignoreDupResponses="true"
						eventsQueue="#{toolbarID}FilterKeyUp"
						oncomplete="javascript:moveAtEndFilterInput()"
						onsubmit="if (window.event.which == 27 || window.event.which == 38 || window.event.which == 40) {return false;}"
						>
							<aon:actionListener method="#{filterActionListener}" />
						</a4j:support> 
					</aon:inputText>												
 				</aon:div>												
 			</aon:if>	

		</ui:define>
	</ui:decorate>
	
</ui:composition>
