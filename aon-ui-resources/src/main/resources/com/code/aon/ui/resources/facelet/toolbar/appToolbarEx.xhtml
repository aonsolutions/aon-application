<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<script type="text/javascript" > 
		//<![CDATA[
		function onClickFilter(el) {
			var style = #{rich:element(filterContainer)}.style;
			var filterIcon = #{rich:element('filterIcon')};
			if ( style.display == 'none' ) {
				style.display = 'flex';
				filterIcon.innerText = 'filter_list_off';
			} else {
				style.display = 'none';
				filterIcon.innerText = 'filter_list';
			}
				
		}
		
		//]]>
	</script>

	<aon:valueParam name="showMoreMenu" default="#{false}"/>

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:define name="toolbarContent">
			<aon:if test="#{!skipResetButton}">								
				<aon:commandLink 
					immediate="true"
					id="#{toolbarID}-reset"
					action="#{resetAction}" 
					reRender="#{resetButtonReRender}"
					accesskey="#{bundle.aon_key_new}" 
					actionListener="#{resetActionListener}"
					title="#{bundle.aon_key_new_accelerator}" 
					styleClass="aon-finding-toolbar-item button round"
					>
						<aon:outputText styleClass="material-symbols-outlined" value="add" />
						<aon:outputText value="#{resetLabel}" />

					</aon:commandLink>
			</aon:if>	
			
			<ui:insert name="beforeSpinToolbarContent"/>
			
			<aon:if test="#{showMoreMenu}">
				<aon:dropDownMenu value="#{bundle.aon_more2}"
				 	style="display:inline-block;font-size:0.8em;margin-right:4px;" >
		             <f:facet name="label">
		             	<aon:panelGroup>
		             		<aon:outputText value="#{bundle.aon_more2}" /> 
		                     <aon:graphicImage style="vertical-align:middle;"
		                     	value="#{aonResource.resolve['/images/aon-icon/aon-icon-dropDown.gif']}" />
		                    </aon:panelGroup>
		             </f:facet>			
		             <ui:insert name="moreMenuContent"/>		                
				</aon:dropDownMenu>			
			</aon:if>	
			<aon:if test="#{!skipSearchButton}">
				<!--  
				<aon:commandLink 
					immediate="true"
					style="float : right;"
					id="#{toolbarID}-search"
					action="#{searchAction}" 
					reRender="#{searchButtonReRender}"
					accesskey="#{bundle.aon_key_search}" 
					actionListener="#{searchActionListener}"
					title="#{bundle.aon_key_search_accelerator}" 
					styleClass="aon-finding-toolbar-item button"
					>
						<aon:outputText styleClass="material-symbols-outlined" value="filter_list" />
						<aon:outputText value="#{bundle.aon_search}" />
				</aon:commandLink>
				-->
							
				<aon:div style="float : right; display: flex; align-items: center;" >
<!--
 					<aon:inputText 
						size="30"
						id="#{controller.pojoShortName}_registry_name-filter" 
						styleClass="aon-finding-toolbar-item button"
						valueChangeListener="#{controller.addExpression}" />
 -->						
					<aon:inputText 
						size="30"
						id="smartFilterInputText" 
						value="#{filterController.smartFilter}"
						style="text-transform : none;"
						styleClass="aon-finding-toolbar-item button" >
						
						<a4j:support 
						event="onkeyup"
						ajaxSingle="true"
						limitToList="true"						
						requestDelay="500"
						ignoreDupResponses="true"
						reRender="#{filterReRender}"
						eventsQueue="#{toolbarID}FilterKeyUp" 
						onsubmit="if (window.event.which == 27 || window.event.which == 38 || window.event.which == 40) {return false;}"
						>
							<f:setPropertyActionListener target="#{filterController.onSmartFilter}" value="#{true}" />
						</a4j:support>
					
					</aon:inputText>

					<rich:jQuery 
						timing="immediate"
						selector="#smartFilterInputText"
						query="setAttribute('placeholder', 'Buscar en mis clientes') " />
					<script type="text/javascript" > 
						//<![CDATA[
							#{rich:element('smartFilterInputText')}.setAttribute('placeholder', 'Buscar en mis clientes');
						//]]>
					</script>

					<aon:commandLink 
						reRender="none"
						immediate="true"
						id="filterShowButton"
						accesskey="#{bundle.aon_key_search}" 
						title="#{bundle.aon_key_search_accelerator}" 
						styleClass="aon-finding-toolbar-item button"
						onclick="javascript:onClickFilter(this)"
						>
							<aon:outputText id="filterIcon" styleClass="material-symbols-outlined" value="filter_list" />
							<aon:outputText value="#{bundle.aon_search}" />
					</aon:commandLink>
				</aon:div>
				
			</aon:if>
		</ui:define>
	</ui:decorate>
	
</ui:composition>
