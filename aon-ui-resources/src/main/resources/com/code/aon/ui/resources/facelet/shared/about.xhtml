	<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGroup id="aboutWindowPanel" styleClass="aon-popupWindow">
		<c:if test="#{aonConfiguration.properties.showAbout}">
			<aon:form>
				<rich:modalPanel 
					id="aboutWindow"
					showWhenRendered="#{aonConfiguration.properties.showAbout}"
					minWidth="420" height="260">
	
					<f:facet name="header">
						<aon:div styleClass="aon-popupWindow-title">
							<aon:outputText value="#{bundle.aon_about}"/>
						</aon:div>
					</f:facet>
					<f:facet name="controls">
						<aon:commandButton requestDelay="100"
							reRender="aboutWindowPanel" immediate="true" ajaxSingle="true"
							type="button" styleClass="aon-popupWindow-close" >
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener target="#{aonConfiguration.properties.showAbout}" value="#{false}" />						
							<rich:componentControl for="aboutWindow" event="onclick"
								disableDefault="true" operation="hide"/>								
						</aon:commandButton>	
					</f:facet>
	
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div>
								<aon:graphicImage value="#{customize.headerLogo}" />	
								<c:if test="#{customize.applicationTitle != null}" >						
									<c:if test="#{customize.separator != null}">					
										<aon:outputText value="#{customize.separator}"
											style="margin-left: 5px;#{customize.fontStyle}"
											styleClass="aon-header-title-without-image" />
									</c:if>
									<aon:outputText value="#{customize.applicationTitle}"
										style="margin-left: 5px;#{customize.fontStyle}"
										styleClass="aon-header-title-without-image" />
								</c:if>							
							</aon:div>
							<h:panelGrid styleClass="aon-margin-top" columnClasses="aon-version-label">
								<c:if test="#{customize.applicationVersion != null}" >						
									<aon:outputFormat style="color: #000;" value="#{bundle.aon_about_version}" >
										<f:param value="#{customize.applicationVersion}" />
									</aon:outputFormat>
								</c:if>					
								<c:if test="#{customize.buildDate != null}" >				
									<aon:outputFormat style="color: #000;" value="#{bundle.aon_about_date}" >
										<f:param value="#{customize.buildDate}" />
									</aon:outputFormat>
								</c:if>
								<c:if test="#{customize.buildNumber != null}" >								
									<aon:outputFormat style="color: #000;" value="#{bundle.aon_build}" >
										<f:param value="#{customize.buildNumber}" />
									</aon:outputFormat>
								</c:if>									
								<c:if test="#{customize.buildRevision != null}" >									
									<aon:outputFormat style="color: #000;" value="#{bundle.aon_revision}" >
										<f:param value="#{customize.buildRevision}" />
									</aon:outputFormat>
								</c:if>									
								<aon:outputFormat style="color: #000;" value="#{bundle.aon_db_version}"
									rendered="#{dbUptodate.currentVersion != null}" >
									<f:param value="#{dbUptodate.currentVersion}" />
								</aon:outputFormat>
								<aon:outputFormat style="color: #000;" value="#{bundle.aon_session_id}" >
									<f:param value="#{aonConfiguration.sessionId}" />
								</aon:outputFormat>									
							</h:panelGrid>	
							<aon:div styleClass="aon-footer-box">
								<ui:include src="/com/code/aon/ui/resources/facelet/shared/trademark.xhtml" />
							</aon:div>		
						</aon:div>		
					</aon:div>		
				</rich:modalPanel>
			</aon:form>	
		</c:if>
	</aon:panelGroup>

 </ui:composition>
