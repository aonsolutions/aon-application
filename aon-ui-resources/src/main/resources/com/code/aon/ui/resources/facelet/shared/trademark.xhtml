<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{!customize.hideTrademark}">
	    <aon:if test="#{customize.customized}">
	    	<aon:outputText value="#{bundle.aon_powered_by} " />
	    </aon:if>
		<aon:outputLink target="_blank" value="#{bundle.aon_solutions_url}" >
			<aon:outputText value="#{bundle.aon_solutions}" />
	    </aon:outputLink>
	    <aon:if test="#{!customize.customized}">
			<aon:outputText value=" #{bundle.aon_trademark}" />
			<aon:outputText styleClass="aon-footer-company-label"
				value="#{bundle.aon_solutions_ltd}" />
		</aon:if>
	</aon:if>
 </ui:composition>
