	<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGroup id="newIssueWindowPanel" styleClass="aon-popupWindow">
		
		<rich:modalPanel id="newIssueWindow"
			showWhenRendered="#{quickIssue.showNewissueWindow}"
			minWidth="750" height="450">

			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="Nueva incidencia -i18n-"/>
				</aon:div>
			</f:facet>
			<f:facet name="controls">
				<aon:form>
					<aon:commandButton requestDelay="100"
						reRender="aboutWindowPanel" immediate="true" ajaxSingle="true"
						type="button" styleClass="aon-popupWindow-close" >
						<aon:actionHotKey key="esc" />
						<f:setPropertyActionListener target="#{quickIssue.showNewissueWindow}" value="#{false}" />						
						<rich:componentControl for="newIssueWindow" event="onclick"
							disableDefault="true" operation="hide"/>								
					</aon:commandButton>	
				</aon:form>
			</f:facet>

			<aon:div styleClass="aon-popupWindow-content">
				<aon:div styleClass="aon-popupWindow-content-internal">
						
					<aon:if test="#{quickIssue.showNewissueWindow}">
					
					<aon:form>
						
						<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
							<ui:param name="innerToolbar" value="#{true}" />
							<ui:param name="showTitle" value="#{false}" />
							<ui:param name="showDescription" value="#{false}" />
							<ui:param name="toolbarTitle" value="#{bundle.aon_notice}" />
							<ui:param name="controller" value="#{quickIssue}" />
							<ui:param name="skipCancelButton" value="#{true}" />
							<ui:param name="skipBackButton" value="#{true}" />
						</ui:decorate>
			
						<aon:div styleClass="aon-scroll-area">
							
							<ui:decorate template="/com/code/aon/ui/groupware/facelet/notice/form_content.xhtml" >
								<ui:param name="controller" value="#{quickIssue}" />
								<ui:param name="skipShowNoticeType" value="#{true}" />
								<ui:param name="skipShowSendMail" value="#{true}" />
								<!--  
								<ui:param name="skipShowNoticeCompany" value="#{true}" />
								<ui:define name="customerLookup">
									<aon:outputLabel for="Notice_company"
										value="#{bundle.aon_customer}" />
									<aon:inputText id="Notice_company"
										maxlength="64" size="100"
										value="#{quickIssue.to.company}" />
								</ui:define>
								-->
							</ui:decorate>
				
						</aon:div>
						
					</aon:form>
					
					</aon:if>
							
				</aon:div>		
			</aon:div>		
		</rich:modalPanel>
		
	</aon:panelGroup>

 </ui:composition>
