<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="showMoreMenu" default="#{false}"/>

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:define name="toolbarContent">
			<aon:outputText value="&#160;" rendered="#{skipEditTo}"
				title="#{bundle.aon_inherited_row}"
				styleClass="aon-icon16 aon-icon-shield" />																
			<aon:if test="#{!skipSaveButton and !skipEditTo}">		
				<aon:commandButton id="#{toolbarID}-save"
					title="#{bundle.aon_key_save_accelerator}"
					value="#{bundle.aon_save}" reRender="#{saveButtonReRender}"
					action="#{saveAction}"
					actionListener="#{saveActionListener}"
					onclick="#{saveOnClick}" oncomplete="#{saveOnComplete}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" />
			</aon:if>
			<aon:if test="#{!skipCancelButton}">			
				<aon:confirmButton id="#{toolbarID}-cancel"
					title="#{bundle.aon_key_cancel_accelerator}"
					value="#{bundle.aon_cancel}" reRender="#{cancelButtonReRender}"
					rendered="#{formNew}" immediate="true" 
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					confirmTitle="#{bundle.aon_confirm_title}"
					confirmMessage="#{bundle.aon_cancel_confirm}"
					confirmActionListener="#{cancelActionListener}"
					confirmAction="#{cancelAction}"
					accesskey="#{bundle.aon_key_cancel}" />
			</aon:if>								
			<aon:if test="#{!skipRemoveButton and !skipEditTo}">				
				<aon:confirmButton id="#{toolbarID}-remove"
					title="#{bundle.aon_key_remove_accelerator}"
					value="#{bundle.aon_remove}" reRender="#{removeButtonReRender}"
					rendered="#{!formNew}" immediate="true"
					styleClass="aon-finding-toolbar-item aon-icon-delete"
					confirmTitle="#{removeConfirmTitle}"
					confirmMessage="#{removeConfirmMessage}"
					confirmActionListener="#{removeActionListener}"
					confirmAction="#{removeAction}"
					confirmOnClick="#{removeOnClick}"
					confirmOnComplete="#{removeOnComplete}"
					accesskey="#{bundle.aon_key_remove}" />
			</aon:if>
			<aon:if test="#{!skipSearchButton}">			
				<aon:commandButton id="#{toolbarID}-search" 
					title="#{bundle.aon_key_search_accelerator}"
					value="#{bundle.aon_search}" reRender="#{searchButtonReRender}"
					rendered="#{!formNew and controller.backAction == null}" immediate="true"
					action="#{searchAction}" actionListener="#{searchActionListener}"
					styleClass="aon-finding-toolbar-item aon-icon-search"
					accesskey="#{bundle.aon_key_search}" />
			</aon:if>
			<aon:if test="#{!skipResetButton}">								
				<aon:commandButton id="#{toolbarID}-reset"
					title="#{bundle.aon_key_new_accelerator}"
					value="#{resetLabel}" reRender="#{resetButtonReRender}"
					rendered="#{!formNew and controller.backAction == null}"
					action="#{resetAction}" actionListener="#{resetActionListener}"
					styleClass="aon-finding-toolbar-item aon-icon-reset"
					accesskey="#{bundle.aon_key_new}" />
			</aon:if>															
			<aon:if test="#{!skipBackButton}">								
				<aon:commandButton id="#{toolbarID}-back"
					title="#{bundle.aon_key_cancel_accelerator}"
					value="#{controller.backAction == null ? bundle.aon_list : bundle.aon_back}" reRender="#{backButtonReRender}"
					rendered="#{!formNew}" immediate="true"
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					actionListener="#{backActionListener}"
					action="#{backAction}"
					accesskey="#{bundle.aon_key_cancel}" />
			</aon:if>															
				
			<ui:insert name="beforeSpinToolbarContent"/>
			
			<aon:if test="#{showMoreMenu}">
				<aon:dropDownMenu value="#{bundle.aon_more2}"
				 	style="display:inline-block;font-size:0.8em;margin-right:4px;" >
		             <f:facet name="label">
		             	<aon:panelGroup>
		             		<aon:outputText value="#{bundle.aon_more2}" /> 
		                     <aon:graphicImage style="vertical-align:middle;"
		                     	value="#{aonResource.resolve['/images/aon-icon/aon-icon-dropDown.gif']}" />
		                    </aon:panelGroup>
		             </f:facet>			
		             <ui:insert name="moreMenuContent"/>		                
				</aon:dropDownMenu>			
			</aon:if>				
				
			<aon:if test="#{(!skipSpin) and (controller != null)}">
				<aon:spin id="#{controller.beanName}Spin" controller="#{controller}"
					action="#{saveAction}" rendered="#{!formNew}"
					style="float:right;margin-right:0;" />
			</aon:if>
			
			<aon:if test="#{!skipFocusFirst}">
				<rich:jQuery timing="onload"
					selector=":input:visible:enabled:not(:button):not(.aon-skip-focus):first"
					query="focus()" />
			</aon:if>								
		</ui:define>
	</ui:decorate>
	
</ui:composition>
