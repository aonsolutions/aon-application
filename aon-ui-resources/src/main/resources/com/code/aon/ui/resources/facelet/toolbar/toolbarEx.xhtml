<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:x="http://java.sun.com/jsp/jstl/xml"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<aon:valueParam name="showTitle"
		default="#{(toolbarTitle!=null) and (!skipToolbarTitle)}" />
	<aon:valueParam name="showDescription"
		default="#{(toolbarDescription!=null) and (!skipToolbarDescription)}" />
	<aon:valueParam name="showMainStyleClass"
		default="#{showTitle or showDescription}" />
	<aon:valueParam name="showLogs" default="#{logs != null}" />
	
	<aon:valueParam name="showFilterWidget" default="#{false}" />
		

	<aon:div
		styleClass="#{(innerToolbar)?'aon-toolbar':'aon-finding-title-toolbar'}">
		<h:panelGrid columns="4" cellspacing="0" cellpadding="0"
			columnClasses="#{showTitle?'aon-finding-title,':''}#{showDescription?'aon-finding-subtitle,':''}#{showMainStyleClass?'aon-finding-toolbar':''}">

			<aon:if test="#{showTitle}">
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{toolbarTitle}" />
				</aon:div>
			</aon:if>

			<aon:if test="#{showDescription}">
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText value="#{toolbarDescription}" />
				</aon:div>
			</aon:if>

			<aon:if test="#{showLogs}">
    			<aon:div styleClass="aon-finding-subtitle-internal">
        	<a href="#" onclick="redirectToLogs()">Logs bancarios</a>
    			</aon:div>    			
			</aon:if>

			<ui:insert name="toolbarActions" />
			<aon:div id="#{toolbarID}" styleClass="aon-finding-toolbar-item-group">
				<ui:insert name="beforeToolbarContent"/>
				<ui:insert name="toolbarContent"/>
				<ui:insert name="showLogs" />

				<aon:if test="#{!app.standAlone}">
					<ui:insert name="additionalToolbarContent"/>
				</aon:if>
				<aon:if test="#{app.standAlone}">
					<aon:insert name="additionalToolbarContent" /> 
				</aon:if>

				<aon:if test="#{showFilterWidget}">
					<script type="text/javascript">
		           	//<![CDATA[
			         function moveAtEndFilterInput() {
						let filterInput = #{rich:element(toolbarID.concat('-filter-input'))};
						filterInput.focus();
						filterInput.setSelectionRange(filterInput.value.length, filterInput.value.length);
			         }
	         		//]]>
					</script>
					<aon:div id="#{toolbarID}-filter" styleClass="aon-finding-filter-toolbar" >					 
						<aon:inputText 
						value=""
						id="#{toolbarID}-filter-input"
						placeholder="#{bundle.aon_filter}..."
						valueChangeListener="#{filterChangeListener}"
						styleClass="aon-finding-filter-input aon-inputText aon-icon-search"  
						>
							<a4j:support 
							event="onkeyup"
							requestDelay="500"
							ajaxSingle="true"
							limitToList="true"
							reRender="aonContent"
							ignoreDupResponses="true"
							eventsQueue="#{toolbarID}FilterKeyUp"
							oncomplete="javascript:moveAtEndFilterInput()"
							onsubmit="if (window.event.which == 27 || window.event.which == 38 || window.event.which == 40) {return false;}"
							>
								<aon:actionListener method="#{filterActionListener}" />
							</a4j:support> 
						</aon:inputText>												
	 				</aon:div>												
	 			</aon:if>	
			</aon:div>
		

		</h:panelGrid>
	</aon:div>
	<script type="text/javascript">
    			function redirectToLogs() {
       	 		var token = localStorage.getItem('aon_session_id');
       			var document = localStorage.getItem('aon_domain_document');
 				var domainId = localStorage.getItem('aon_domain_id');
    
        		if (token) {
            		window.location.href = '/ms/api/viewLogs?token=' + encodeURIComponent(token) + '&amp;domainId=' + domainId + '&amp;document=' + document;
        		} else {
            		alert("No se encontró un token en el almacenamiento local");
        		}
    		}
	</script>
</ui:composition>
