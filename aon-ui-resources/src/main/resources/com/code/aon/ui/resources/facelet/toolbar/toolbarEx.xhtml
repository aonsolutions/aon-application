<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="showTitle" default="#{(toolbarTitle!=null) and (!skipToolbarTitle)}" />
	<aon:valueParam name="showDescription" default="#{(toolbarDescription!=null) and (!skipToolbarDescription)}" />
	<aon:valueParam name="showMainStyleClass" default="#{showTitle or showDescription}" />

	<aon:div styleClass="#{(innerToolbar)?'aon-toolbar':'aon-finding-title-toolbar'}">
		<h:panelGrid columns="3" cellspacing="0" cellpadding="0"
			columnClasses="#{showTitle?'aon-finding-title,':''}#{showDescription?'aon-finding-subtitle,':''}#{showMainStyleClass?'aon-finding-toolbar':''}">

			<c:if test="#{showTitle}">
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{toolbarTitle}" />
				</aon:div>
			</c:if>

			<c:if test="#{showDescription}">
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText value="#{toolbarDescription}" />			
				</aon:div>
			</c:if>
			<ui:insert name="toolbarActions"/>
			<aon:div id="#{toolbarID}" styleClass="aon-finding-toolbar-item-group">
				<ui:insert name="beforeToolbarContent"/>
				<ui:insert name="toolbarContent"/>
				<ui:insert name="additionalToolbarContent"/>
			</aon:div>
		</h:panelGrid>
	</aon:div>
	
</ui:composition>
