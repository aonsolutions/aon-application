<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGrid columns="2" styleClass="aon-width-500">
		<aon:outputLabel for="Contact_displayName"
			value="#{bundle.aon_displayName}" />
		<aon:inputText id="Contact_displayName"
			maxlength="128" size="77" required="#{displayNameRequired}"
			value="#{controller.to.displayName}" />

		<aon:outputLabel for="Contact_outlookName"
			value="#{bundle.aon_name}" />
		<aon:inputText id="Contact_outlookName"
			maxlength="128" size="95"
			value="#{controller.to.outlookName}" />

		<aon:outputLabel for="Contact_surname"
			value="#{bundle.aon_surname}" />
		<aon:inputText id="Contact_surname"
			maxlength="128" size="95"
			value="#{controller.to.surname}" />

		<aon:outputLabel for="Contact_address"
			value="#{bundle.aon_address}" />
		<aon:inputText id="Contact_address"
			maxlength="128" size="95"
			value="#{controller.to.address}" />

		<aon:outputLabel for="Contact_postal_code"
			value="#{bundle.aon_postal_code}" />
		<aon:panelGrid id="contactAddress" columns="5" dir="true" 
			columnClasses="aon-text-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left">
			<aon:inputText id="Contact_postal_code"
				maxlength="40" size="11"
				value="#{controller.to.postalCode}" />

			<aon:outputLabel for="Contact_outlookCity"
				value="#{bundle.aon_city}" />
			<aon:inputText id="Contact_outlookCity"
				maxlength="128" size="22"
				value="#{controller.to.outlookCity}" />

			<aon:outputLabel for="Contact_state"
				value="#{bundle.aon_state}" />
			<aon:inputText id="Contact_state"
				maxlength="128" size="22"
				value="#{controller.to.state}" />
		</aon:panelGrid>
		
		<aon:outputLabel for="Contact_country"
			value="#{bundle.aon_country}" />
		<aon:inputText id="Contact_country"
			maxlength="128" size="77"
			value="#{controller.to.country}" />
		
		<aon:outputLabel for="Contact_phone"
			value="#{bundle.aon_phone}" />
		<aon:panelGrid id="contactPhone" columns="5" dir="true" 
			columnClasses="aon-text-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left">
			<aon:inputText id="Contact_phone"
				maxlength="128" size="16"
				value="#{controller.to.phone}" />

			<aon:outputLabel for="Contact_cellularPhone"
				value="#{bundle.aon_cellular}" />
			<aon:inputText id="Contact_cellularPhone"
				maxlength="128" size="16"
				value="#{controller.to.cellularPhone}" />

			<aon:outputLabel for="Contact_fax"
				value="#{bundle.aon_fax}" />
			<aon:inputText id="Contact_fax"
				maxlength="128" size="16"
				value="#{controller.to.fax}" />

		</aon:panelGrid>

		<aon:outputLabel for="Contact_email"
			value="#{bundle.aon_email}" />
		<aon:inputText id="Contact_email"
			maxlength="256" size="95"
			value="#{controller.to.email}" />

		<aon:outputLabel for="Contact_note" 
			value="#{bundle.aon_note}" />
		<aon:inputTextarea id="Contact_note"
			value="#{controller.to.note}" cols="98" rows="7" >
			<f:validateLength maximum="2048" />
		</aon:inputTextarea>
	</aon:panelGrid>

</ui:composition>
