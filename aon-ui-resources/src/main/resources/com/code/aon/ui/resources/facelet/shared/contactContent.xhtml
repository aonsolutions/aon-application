<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:valueParam name="preffix" default="Contact" />

	<aon:panelGrid columns="2" styleClass="aon-width-500">
		<aon:outputLabel for="#{preffix}_displayName"
			value="#{bundle.aon_displayName}" />
		<aon:inputText id="#{preffix}_displayName"
			maxlength="128" size="77" required="#{displayNameRequired}"
			value="#{controller.to.displayName}" />

		<c:if test="#{!skipFullName}">
			<ui:include src="/com/code/aon/ui/resources/facelet/shared/fullNameContent.xhtml" />
		</c:if>

		<aon:outputLabel for="#{preffix}_address"
			value="#{bundle.aon_address}" />
		<aon:inputText id="#{preffix}_address"
			maxlength="128" size="95"
			value="#{controller.to.address}" />

		<aon:outputLabel for="#{preffix}_postal_code"
			value="#{bundle.aon_postal_code}" />
		<aon:panelGrid columns="5"
			columnClasses="aon-text-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left">
			<aon:inputText id="#{preffix}_postal_code"
				maxlength="40" size="11"
				value="#{controller.to.postalCode}" />

			<aon:outputLabel for="#{preffix}_outlookCity"
				value="#{bundle.aon_city}" />
			<aon:inputText id="#{preffix}_outlookCity"
				maxlength="128" size="22"
				value="#{controller.to.outlookCity}" />

			<aon:outputLabel for="#{preffix}_state"
				value="#{bundle.aon_state}" />
			<aon:inputText id="#{preffix}_state"
				maxlength="128" size="22"
				value="#{controller.to.state}" />
		</aon:panelGrid>
		
		<aon:outputLabel for="#{preffix}_country"
			value="#{bundle.aon_country}" />
		<aon:inputText id="#{preffix}_country"
			maxlength="128" size="77"
			value="#{controller.to.country}" />
		
		<aon:outputLabel for="#{preffix}_phone"
			value="#{bundle.aon_phone}" />
		<aon:panelGrid columns="5" 
			columnClasses="aon-text-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left">
			<aon:inputText id="#{preffix}_phone"
				maxlength="128" size="16"
				value="#{controller.to.phone}" />

			<aon:outputLabel for="#{preffix}_cellularPhone"
				value="#{bundle.aon_cellular}" />
			<aon:inputText id="#{preffix}_cellularPhone"
				maxlength="128" size="16"
				value="#{controller.to.cellularPhone}" />

			<aon:outputLabel for="#{preffix}_fax"
				value="#{bundle.aon_fax}" />
			<aon:inputText id="#{preffix}_fax"
				maxlength="128" size="16"
				value="#{controller.to.fax}" />

		</aon:panelGrid>

		<aon:outputLabel for="#{preffix}_email"
			value="#{bundle.aon_email}" />
		<aon:inputText id="#{preffix}_email"
			maxlength="256" size="95"
			value="#{controller.to.email}" />

		<aon:outputLabel for="#{preffix}_note" 
			value="#{bundle.aon_remark}" />
		<aon:inputTextarea id="#{preffix}_note"
			value="#{controller.to.note}" cols="98" rows="7" >
			<f:validateLength maximum="2048" />
		</aon:inputTextarea>
	</aon:panelGrid>

</ui:composition>
