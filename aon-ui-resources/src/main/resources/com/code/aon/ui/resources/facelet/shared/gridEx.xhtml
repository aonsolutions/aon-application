<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:editDataTable id="#{dataTableId}" var="to"
		value="#{dataModel}" rows="#{rows}"
		columnClasses="none, #{columnClasses}, none">

		<aon:rowSelector id="#{dataTableId}-select" toggleOnClick="#{controller.to == null}"
			actionListener="#{controller.onSelect}" />

		<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="&#160;" />
			<f:facet name="footer">
				<aon:div>
					<c:if test="#{!skipResetButton}">								
						<aon:commandButton id="#{dataTableId}-reset"
							alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{controller.onReset}" value=""
							rendered="#{!formNew}"
							accesskey="#{bundle.aon_key_new_line}" />
					</c:if>
				</aon:div>
			</f:facet>
		</aon:column>

		<ui:insert name="columns"/>
		
		<aon:column styleClass="aon-editDataTable-buttonsColumn aon-vertical-align-top">
			<f:facet name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			<aon:div>
				<f:verbatim rendered="#{formList}">&#160;</f:verbatim>
				<c:if test="#{!skipSaveButton}">		
					<aon:commandButton id="#{dataTableId}-save" 
						title="[#{bundle.aon_accept}]"
						actionListener="#{controller.onAccept}"
						rendered="#{formEdit}" value=""
						reRender="#{dataTableId}DataScroller"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
				</c:if>
				<aon:commandButton id="#{dataTableId}-cancel"
					title="[#{bundle.aon_cancel}]"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					rendered="#{formEdit}"
					actionListener="#{controller.onCancel}" immediate="true"
					accesskey="#{bundle.aon_key_cancel_line}" />
				<c:if test="#{!skipRemoveButton}">				
					<aon:confirmButton id="#{dataTableId}-remove"
						title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{formEdit}" reRender="#{dataTableId}DataScroller"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{controller.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</c:if>
			</aon:div>
			<f:facet name="footer">
				<aon:div>
					<f:verbatim rendered="#{!formNew}">&#160;</f:verbatim>
					<c:if test="#{!skipSaveButton}">		
						<aon:commandButton id="#{dataTableId}-new-save"
							title="#{bundle.aon_save}"
							actionListener="#{controller.onAccept}"
							rendered="#{formNew}" value=""
							reRender="#{dataTableId}DataScroller"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
					</c:if>
					<aon:confirmButton id="#{dataTableId}-new-cancel"
						title="#{bundle.aon_cancel}"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{formNew}"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_cancel_confirm}"
						confirmActionListener="#{controller.onCancel}"
						immediate="true" accesskey="#{bundle.aon_key_cancel_line}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</aon:editDataTable>
	
	<aon:div id="#{dataTableId}DataScroller" layout="none" rendered="#{showDataScroller}">
		<aon:dataScroller2 for="#{dataTableId}" showNote="#{showNote}" />
	</aon:div>

</ui:composition>
