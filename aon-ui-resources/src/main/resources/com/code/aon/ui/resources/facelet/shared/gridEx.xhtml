<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div id="#{dataTableId}Div">

		<aon:editDataTable id="#{dataTableId}" var="to" sortMode="#{sortMode}"
			value="#{dataModel}" rows="#{rows}" rendered="#{showDataTable}"
			columnClasses=", #{columnClasses}," footerClass="#{dataTableFooterClass}">
	
			<aon:rowSelector id="#{dataTableId}-select" 
				toggleOnClick="#{(controller.to == null) and !skipEditSelectedTo and !skipLineEdition}"
				action="#{rowSelectorAction}" immediate="#{rowSelectorImmediate}"
				actionListener="#{rowSelectorActionListener}" reRender="#{rowSelectorReRender}"
				focus="#{(focusOnSelect != null)?(focusOnSelect):''}"/>
	
			<aon:if test="#{!skipSelectRow}">
				<aon:column id="#{dataTableId}-selectColumn" 
					styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:div rendered="#{formList}" layout="none">
						<aon:outputText value="&#160;" rendered="#{skipEditSelectedTo}"
							title="#{bundle.aon_inherited_row}"
							styleClass="aon-icon16 aon-icon-shield" />														
						<ui:insert name="beginFormListContent"/>
					</aon:div>					
					<aon:div rendered="#{formEdit}" layout="none">
						<ui:insert name="beginFormEditContent"/>
					</aon:div>
					<f:facet name="footer">
						<aon:div layout="none">
							<ui:insert name="beginFooterContent"/>
							<aon:if test="#{!skipResetButton}">
								<aon:commandButton
									id="#{dataTableId}-reset" title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
									action="#{resetAction}" actionListener="#{resetActionListener}"
									rendered="#{!formNew}" reRender="#{resetButtonReRender}"
									styleClass="aon-editDataTable-button aon-icon-reset"
									accesskey="#{bundle.aon_key_new_line}" 
									focus="#{(focusOnAdd != null)?(focusOnAdd):''}"/>
							</aon:if>
						</aon:div>
					</f:facet>
				</aon:column>
			</aon:if>
	
			<ui:insert name="columns"/>
			
			<aon:if test="#{!skipEditButtons}">			
				<aon:column styleClass="aon-editDataTable-buttonsColumn aon-vertical-align-top">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:div rendered="#{formList}" layout="none">
						<ui:insert name="endFormListContent"/>				
					</aon:div>
					<aon:div rendered="#{formEdit}" layout="none">			
						<ui:insert name="beforeEditLineButtons"/>
	
						<aon:if test="#{!skipSaveButton}">		
							<aon:commandButton
								id="#{dataTableId}-save" title="#{bundle.aon_save} (#{bundle.aon_key_save_line_accelerator})"
								action="#{saveAction}" actionListener="#{saveActionListener}"
								reRender="#{dataTableId}Div#{(saveButtonReRender != null)?',':''}#{saveButtonReRender}"
								styleClass="aon-editDataTable-button aon-icon-accept"
								accesskey="#{bundle.aon_key_save_line}" />
						</aon:if>
						<aon:if test="#{!skipCancelButton}">
							<aon:commandButton
								id="#{dataTableId}-cancel" title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
								action="#{cancelEditAction}" actionListener="#{cancelEditActionListener}"
								immediate="true" reRender="#{cancelButtonReRender}"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								accesskey="#{bundle.aon_key_cancel_line}" />
						</aon:if>
						<aon:if test="#{!skipRemoveButton}">				
							<aon:confirmButton
								id="#{dataTableId}-remove" title="#{bundle.aon_remove} (#{bundle.aon_key_remove_line_accelerator})"
								immediate="true"  rendered="#{removeButtonRendered}"
								reRender="#{dataTableId}Div#{(removeButtonReRender != null)?',':''}#{removeButtonReRender}"
								confirmTitle="#{bundle.aon_confirm_title}"
								confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{removeActionListener}"
								confirmAction="#{removeAction}"
								styleClass="aon-editDataTable-button aon-icon-delete"
								accesskey="#{bundle.aon_key_remove_line}" />
						</aon:if>

						<ui:insert name="afterEditLineButtons"/>
					</aon:div>
					<f:facet name="footer">
						<aon:div layout="none">
							<ui:insert name="beforeNewLineButtons"/>
	
							<aon:outputText rendered="#{!formNew}" value="&#160;" />
							<aon:if test="#{!skipSaveButton}">		
								<aon:commandButton
									id="#{dataTableId}-new-save" title="#{bundle.aon_save} (#{bundle.aon_key_save_line_accelerator})"
									action="#{newSaveAction}" actionListener="#{newSaveActionListener}"
									rendered="#{newSaveButtonRendered}"
									reRender="#{dataTableId}Div#{(newSaveButtonReRender != null)?',':''}#{newSaveButtonReRender}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									accesskey="#{bundle.aon_key_save_line}" />
							</aon:if>
							<aon:if test="#{!skipCancelButton}">
								<aon:confirmButton
									id="#{dataTableId}-new-cancel" title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
									rendered="#{formNew}" reRender="#{newCancelButtonReRender}"
									immediate="true"
									confirmTitle="#{bundle.aon_confirm_title}"
									confirmMessage="#{bundle.aon_cancel_confirm}"
									confirmActionListener="#{cancelEditActionListener}"
									confirmAction="#{cancelEditAction}"					
									styleClass="aon-editDataTable-button aon-icon-cancel"
									accesskey="#{bundle.aon_key_cancel_line}" />
							</aon:if>

							<ui:insert name="afterNewLineButtons"/>
						</aon:div>
					</f:facet>
				</aon:column>
			</aon:if>
		</aon:editDataTable>
		
		<ui:insert name="additionalDataTableContent"/>

		<aon:if test="#{showDataScroller}">
			<aon:aonScroller for="#{dataTableId}" showNote="#{showNote}"
				rowCount="#{dataModel.rowCount}" page="#{controller.page}" pageSize="#{rows}" />
		</aon:if>	

	</aon:div>

</ui:composition>
