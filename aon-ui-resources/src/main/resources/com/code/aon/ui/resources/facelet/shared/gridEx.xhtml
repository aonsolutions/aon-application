<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:editDataTable id="#{dataTableId}" var="to"
		value="#{dataModel}" rows="#{rows}"
		columnClasses="aon-editDataTable-iconColumn aon-vertical-align-top,
			#{columnClasses}, aon-editDataTable-buttonsColumn aon-vertical-align-top">

		<aon:rowSelector toggleOnClick="#{controller.to == null}"
			actionListener="#{controller.onSelect}" />

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="&#160;" />
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton alt="[#{bundle.aon_reset}]"
						styleClass="aon-editDataTable-button aon-icon-reset"
						actionListener="#{controller.onReset}" value=""
						rendered="#{!controller.new}"
						accesskey="#{bundle.aon_key_new_line}" />
				</aon:div>
			</f:facet>
		</aon:column>

		<ui:insert name="columns"/>
		
		<aon:column>
			<f:facet name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			<aon:div>
				<f:verbatim rendered="#{to!=controller.to}">&#160;</f:verbatim>
				<aon:commandButton title="[#{bundle.aon_accept}]"
					actionListener="#{controller.onAccept}"
					rendered="#{to==controller.to}" value=""
					reRender="#{dataTableId}DataScroller"
					styleClass="aon-editDataTable-button aon-icon-accept"
					accesskey="#{bundle.aon_key_save_line}" />
				<aon:commandButton 
					title="[#{bundle.aon_cancel}]"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					rendered="#{to==controller.to}"
					actionListener="#{controller.onCancel}" immediate="true"
					accesskey="#{bundle.aon_key_cancel_line}" />
				<aon:confirmButton id="#{dataTableId}-CancelRemove"
					title="[#{bundle.aon_remove}]"
					styleClass="aon-editDataTable-button aon-icon-delete"
					rendered="#{to==controller.to}" reRender="#{dataTableId}DataScroller"
					confirmTitle="#{bundle.aon_confirm_title}"
					confirmMessage="#{bundle.aon_remove_confirm}"
					confirmActionListener="#{controller.onRemove}" immediate="true"
					accesskey="#{bundle.aon_key_remove_line}" />
			</aon:div>
			<f:facet name="footer">
				<aon:div>
					<f:verbatim rendered="#{!controller.new}">&#160;</f:verbatim>
					<aon:commandButton title="#{bundle.aon_save}"
						actionListener="#{controller.onAccept}"
						rendered="#{controller.new}" value=""
						reRender="#{dataTableId}DataScroller"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:confirmButton id="#{dataTableId}-CancelNew"
						title="#{bundle.aon_cancel}"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{controller.new}"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_cancel_confirm}"
						confirmActionListener="#{controller.onCancel}"
						immediate="true" accesskey="#{bundle.aon_key_cancel_line}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</aon:editDataTable>
	
	<aon:div id="#{dataTableId}DataScroller" layout="none" rendered="#{showDataScroller}">
		<aon:dataScroller2 for="#{dataTableId}" showNote="#{showNote}" />
	</aon:div>

</ui:composition>
