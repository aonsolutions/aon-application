<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:c="http://java.sun.com/jstl/core"			
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
<f:view locale="#{aonConfiguration.locale}">
<head>
	<title><ui:insert name="title">AON SOLUTIONS</ui:insert></title>
	<meta http-equiv="X-UA-Compatible" content="IE=EmulateIE8"/>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

	<c:forEach items="#{aonConfiguration.styleSheets}" var="styleSheet">
		<a4j:loadStyle src="#{styleSheet}"/>
	</c:forEach>

	<!-- Necesario si se pone el LoadScriptStrategy a ALL -->
	<a4j:loadScript src="#{aonResource.resolve['/com/code/aon/faces/component/richfaces/rowSelector/rowSelector.js']}"/>
	<a4j:loadScript src="#{aonResource.resolve['/com/code/aon/ui/resources/js/richFaces.js']}"/>
	
	<ui:insert name="additionalHeadContent"/>
	
	<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
	
	<link rel="shortcut icon" type="image/x-icon" href="#{customize.favicon}" />
 	<ui:insert name="head" />
</head>
<body onbeforeunload="$('logout').onclick();">
	<table style="width: 100%;" >
		<thead><tr><th colspan="2" style="padding: 0px;"><ui:insert name="mainHeader" /></th></tr></thead>
		<tbody>
			<tr>
				<td style="padding: 0px;" ><ui:insert name="mainLeftBar"/></td>
				<td style="padding: 0px;"><ui:insert name="mainContent"/></td>
			</tr>
		</tbody>
		<tfoot><tr><td colspan="2" style="padding: 0px;"><ui:insert name="mainFooter" /></td></tr></tfoot>
	</table>
	<ui:include src="/com/code/aon/ui/resources/facelet/shared/sessionExpired.xhtml" />
</body>
</f:view>
</html>
