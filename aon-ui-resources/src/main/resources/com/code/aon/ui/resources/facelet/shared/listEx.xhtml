<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<aon:valueParam name="skipEditSelectedTo" default="#{false}" />
	<aon:valueParam name="showAonPaginator" default="#{false}" />

	<aon:dataTable id="#{dataTableId}" var="to" rowKeyVar="toIndex" sortMode="#{sortMode}"
		value="#{dataModel}" rows="#{rows}" rendered="#{showDataTable}"
		columnClasses=", #{columnClasses}" sytle="#{dataTableStyle}">

		<aon:rowSelector id="#{dataTableId}-select" reRender="#{rowSelectorReRender}"
			actionListener="#{rowSelectorActionListener}" action="#{rowSelectorAction}"
			toggleOnClick="#{rowSelectorToggleOnClick and !skipEditSelectedTo}" immediate="#{rowSelectorImmediate}"
			focus="#{(focusOnSelect != null)?(focusOnSelect):''}"/>

		<aon:if test="#{!skipSelectButton}">
			<aon:column styleClass="aon-editDataTable-iconColumn">
				<aon:commandLink id="#{dataTableId}-selectButton" 
					styleClass="aon-icon16 #{(skipEditSelectedTo)?('aon-icon-shield'):('aon-icon-rowSelector')}"
					title="#{(skipEditSelectedTo)?(bundle.aon_inherited_row):(bundle.aon_selectMsg)}"
					value="&#160;" immediate="true" ajaxSingle="true" requestDelay="100"
					action="#{rowSelectorAction}"
					disabled="#{skipEditSelectedTo}" disabledStyleClass=""
					actionListener="#{rowSelectorActionListener}"
					onkeyup="#{dataTableId}KeyUp(this)"
					onfocus="disableRowSelector();#{dataTableId}SelectRow(this)"
					onblur="enableRowSelector();#{dataTableId}DeselectRow(this)"
					onmouseover="disableRowSelector();"
					onmouseout="enableRowSelector();"				
					focus="#{(focusOnSelect != null)?(focusOnSelect):''}"
					rendered="#{selectButtonRendered}" reRender="#{rowSelectorReRender}" >
				</aon:commandLink>
				<f:facet name="footer">
					<ui:insert name="selectFooterContent"/>
				</f:facet>
			</aon:column>
		</aon:if>

		<ui:insert name="columns"/>

	</aon:dataTable>
	
	<aon:if test="#{!skipFocusFirst}">
		<rich:jQuery selector="##{dataTableId} .aon-table-row-link:first" timing="onload"
			query="focus().addClass('keyup-patch').parent().parent().addClass('aon-table-row-hover')" />
	</aon:if>

	<aon:if test="#{!skipSelectButton}">
		<rich:jQuery name="#{dataTableId}FocusFirst" selector="##{dataTableId} a:first"
			timing="onJScall" query="focus()" />		
		<rich:jQuery name="#{dataTableId}SelectRow" timing="onJScall"
			query="addClass('keyup-patch').parent().parent().addClass('aon-table-row-hover')" />		
		<rich:jQuery name="#{dataTableId}DeselectRow" timing="onJScall"
			query="removeClass('keyup-patch').parent().parent().removeClass('aon-table-row-hover')" />		
		<rich:jQuery name="#{dataTableId}KeyUp" timing="onJScall"
			query="keyup(function (event) {
					if ( (event.keyCode == 40) || (event.keyCode == 38) ) {
						var jthis = jQuery(this);
						if ( jthis.hasClass('keyup-patch') ) {
					        var list = jthis.parents('.aon-dataTable').find('.aon-table-row-link');
					        var i = list.index(this);					
						    if (event.keyCode == 40) {
						        if ((i+1) &lt; list.size() ) {
						        	list.get(i+1).focus();
						        	jthis.removeClass('keyup-patch');
						        	event.preventDefault();
						        }
						    } else if (event.keyCode == 38) {
						        if (i &gt; 0 ) {
						        	list.get(i-1).focus();
	        					    jthis.removeClass('keyup-patch');
	        					    event.preventDefault();
						        }
						    }
						}
					}
	    		})" />
	</aon:if>

	<ui:insert name="additionalDataTableContent"/>

	<aon:if test="#{showDataScroller}">
		<aon:dataScroller for="#{dataTableId}" showNote="#{showNote}" oncomplete="#{dataTableId}FocusFirst();"
			rowCount="#{dataModel.rowCount}" page="#{controller.page}" pageSize="#{rows}" />
	</aon:if>	
	
	<aon:if test="#{showAonPaginator}">
	
		<aon:div style="display:flex; margin: 1rem .5rem; align-items:flex-end;">
									
			<div class="aon-paginator-item">
				<aon:outputText styleClass="aon-paginator-icon" style="background: url(#{aonResource.resolve['/images/a.svg']})" ></aon:outputText>	
				<aon:outputText styleClass="aon-paginator-number" value="&lt;"> </aon:outputText>
			</div>	

			
			<c:forEach  items="#{dataModel.wrappedData}" var="page" begin="#{controller.page &gt; 5 ? controller.page - 4 : 1}" end="#{controller.page &gt; 5 ? controller.page + 4 : 10}" step="1" varStatus="loop">
				<aon:if test="#{loop.index == controller.page}">
				
					<aon:commandLink styleClass="aon-paginator-item selected" reRender="aonContent" id="button#{loop.index}">
						<aon:outputText styleClass="aon-paginator-icon o" style="background: url(#{aonResource.resolve['/images/o.svg']})" ></aon:outputText>
						<aon:outputText styleClass="aon-paginator-number" value="${controller.page}"></aon:outputText>
						<f:setPropertyActionListener target="#{controller.page}" value="${loop.index}" />		
					</aon:commandLink>			
				
				</aon:if>
				
				 <aon:if test="#{loop.index != controller.page}" id="button#{loop.index}"> 
				
					<aon:commandLink styleClass="aon-paginator-item" reRender="aonContent">
						<aon:outputText styleClass="aon-paginator-icon o" style="background: url(#{aonResource.resolve['/images/o.svg']})" ></aon:outputText>
						<aon:outputText  styleClass="aon-paginator-number" value="${loop.index}"></aon:outputText>
						<f:setPropertyActionListener target="#{controller.page}" value="${loop.index}" />
					</aon:commandLink>		
				
				</aon:if>
			
			</c:forEach>
			
			<div class="aon-paginator-item">
				<aon:outputText styleClass="aon-paginator-icon" style="background: url(#{aonResource.resolve['/images/n.svg']})" ></aon:outputText>
				<aon:outputText styleClass="aon-paginator-number" value="&gt;"> </aon:outputText>
			</div>	
					
			<aon:outputText styleClass="aon-paginator-number" style="position: absolute; right: 2rem;  align-self: center;" value="Página #{controller.page} - #{dataModel.rowCount} Resultados"> </aon:outputText>
			
		</aon:div>
	</aon:if>	

</ui:composition>
