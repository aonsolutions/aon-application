<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html">

		<aon:div style="display:inline;" rendered="#{!controller.new}" styleClass="aon-spin-control">
			<aon:commandButton id="first" value="" reRender="#{reRenderAttrs}"
				actionListener="#{controller.onSelectFirst}"
				disabled="#{controller.inFirst}"
				styleClass="aon-spin-button aon-spin-button-first"/>
			<aon:commandButton id="previous" value="" reRender="#{reRenderAttrs}"
				actionListener="#{controller.onSelectPrevious}"
				disabled="#{controller.inFirst}"
				styleClass="aon-spin-button aon-spin-button-previous" />
			<aon:outputText
				value="#{controller.selectedIndex+1} - #{controller.model.rowCount} XX" />
			<aon:commandButton id="next" value="" reRender="#{reRenderAttrs}"
				actionListener="#{controller.onSelectNext}"
				disabled="#{controller.inLast}"
				styleClass="aon-spin-button aon-spin-button-next">
			</aon:commandButton>
			<aon:commandButton id="last" value="" reRender="#{reRenderAttrs}"
				actionListener="#{controller.onSelectLast}"
				disabled="#{controller.inLast}"
				styleClass="aon-spin-button aon-spin-button-last" />
		</aon:div>
		<a4j:support event="onkeyup"
			onsubmit="if(event.keyCode != 39) return false;"
			eventsQueue="SpinNext" ignoreDupResponses="true"
			requestDelay="100" actionListener="#{controller.onSelectNext}"
			immediate="true" reRender="#{reRenderAttrs}">
		</a4j:support>

</ui:composition>
