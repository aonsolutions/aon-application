    <!-- Scripts -->

    <script>

        var datosHistorial = {
            historial: [
                {
                    id: '1',
                    fecha: '25/09/2020',
                    hora: '08:01:02',
                    tipoMarcaje: 'Marcaje sin incidencia',
                    nota: 'Todo correcto',
                    marcaje: 'Entrada',
                },
                {
                    id: '2',
                    fecha: '25/09/2020',
                    hora: '14:01:02',
                    tipoMarcaje: 'Marcaje sin incidencia',
                    nota: 'Todo correcto',
                    marcaje: 'Salida',
                },
            ],
        };

        jQuery(function () {
            cargarHistorial();
        });

        function cargarHistorial() {
            var historial = datosHistorial['historial'];
            var hijo = "";

            // var value;
            for (i in historial) {
                // value = Number.parseInt(i) + 1;
                hijo = hijo + "<tr>";
                hijo = hijo + "<td>" + historial[i]['id'] + "</td>";
                hijo = hijo + "<td>" + historial[i]['fecha'] + "</td>";
                hijo = hijo + "<td>" + historial[i]['hora'] + "</td>";
                hijo = hijo + "<td>" + historial[i]['tipoMarcaje'] + "</td>";
                hijo = hijo + "<td>" + historial[i]['nota'] + "</td>";
                hijo = hijo + "<td>" + historial[i]['marcaje'] + "</td>";
                hijo = hijo + "</tr>";
            }

            $("#tablaMarcajes").empty()
            $(hijo).appendTo("#tablaMarcajes");
        }



        (function ($) {
            $.fn.serializeFormJSON = function () {
                var o = {};
                var a = this.serializeArray();
                $.each(a, function () {
                    if (o[this.name]) {
                        if (!o[this.name].push) {
                            o[this.name] = [o[this.name]];
                        }
                        o[this.name].push(this.value || '');
                    } else {
                        o[this.name] = this.value || '';
                    }
                });
                return o;
            };
        })(jQuery);


        $('#actualizar').on('click', function (e) {
            var mes = $('#mes').val();
            console.log(mes);
            alert(mes);
            cargarHistorial();
        })
    </script>
