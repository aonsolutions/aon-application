<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/com/code/aon/ui/audit/facelet/shared/menu.xhtml">

	<ui:define name="menuContent">
		<aon:commandLink id="integral" 
			action="#{enterprise.initialAction}" 
			value="#{appBundle.menu_integral}"
			styleClass="aon-top-menu-item aon-icon-payroll">
			<aon:actionListener method="#{enterprise.onTreeViewSelect}" />
			<aon:actionListener method="#{enterprise.onEditSearch}" />
		</aon:commandLink>
		<aon:commandLink id="main"
			value="#{appBundle.menu_main}"
			action="menu_main" immediate="true"
			styleClass="aon-top-menu-item aon-icon-general" />
		<aon:commandLink id="wizard"
			value="#{appBundle.menu_wizard}"
			action="menu_wizard" immediate="true"
			styleClass="aon-top-menu-item aon-icon-utilities" />
		<c:if test="#{aonRole.config}">
			<aon:commandLink id="config"
				value="#{bundle.aon_configuration}"
				action="menu_config" immediate="true"
				styleClass="aon-top-menu-item aon-icon-config" />
		</c:if>
		<rich:jQuery timing="onload"
			selector="body" query="removeClass('aon-overflow-hidden')" />				
	</ui:define>
	
 </ui:composition>
