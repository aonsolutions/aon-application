<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="procesosMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGrid id="group_procesos_procesos"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-master aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.menu_procesos}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="parteITWizard" 
									action="parteITWizard_step0"
									actionListener="#{parteITWizard.onStart}"
									value="#{payrollBundle.parteIT_module}" />
							</aon:div>
						</aon:div>
						
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="remesaITWizard" 
									action="remesaITWizard_step0"
									actionListener="#{remesaITWizard.onStart}"
									value="#{payrollBundle.remesaIT_module}" />
							</aon:div>
						</aon:div>
						
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="FDIRegenerationWizard" 
									action="FDIRegenerationWizard_step0"
									actionListener="#{remesaITWizard.onStart}"
									value="#{payrollBundle.FDIRegeneration_module}" />
							</aon:div>
						</aon:div>
						
					</aon:panelGrid>
				</h:panelGrid>
					
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
