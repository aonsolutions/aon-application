<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">
		<aon:form id="wizardMenu">
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">
						
					<aon:panelGrid id="red_wizard"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-winsuite aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.red_menu_group}" />
						</f:facet>					
						<aon:div styleClass="aon-direct-access-list">
								
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="leaveBatchWizard" 
									action="leaveBatchWizard_step0"
									actionListener="#{leaveBatchWizard.onStart}"
									value="#{payrollBundle.payroll_leaveBatchWizard_module}" />
							</aon:div>
						
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="contractBatchWizard" 
									action="contractBatchWizard_step0"
									actionListener="#{contractBatchWizard.onStart}"
									value="#{payrollBundle.payroll_contractBatchWizard_module}" />
							</aon:div>
							
						</aon:div>
					</aon:panelGrid>
					
					<aon:panelGrid id="contrata_wizard"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-contrata aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.contrata_menu_group}" />
						</f:facet>					
						<aon:div styleClass="aon-direct-access-list">
														
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="contractGenerationWizard" 
									action="contractGenerationWizard_search"
									value="#{payrollBundle.payroll_contractGenerationWizard_module}" >
									<aon:actionListener method="#{contractGenerationWizard.onEditSearch}" />
									<aon:actionListener method="#{contractGenerationWizard.onStart}" />
								</aon:commandLink>
							</aon:div>
							
						</aon:div>
					</aon:panelGrid>
					
					<aon:panelGrid id="certificate_wizard"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-redtrabaja aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.certificate_menu_group}" />
						</f:facet>					
						<aon:div styleClass="aon-direct-access-list">

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="certifica2BatchWizard"
									action="certifica2BatchWizard_step0"
									value="#{payrollBundle.certifica2BatchWizard_module}" >
									<aon:actionListener method="#{certifica2BatchWizard.onStart}" />
									<aon:actionListener method="#{contract.onEditSearch}" />
								</aon:commandLink>
							</aon:div>
							
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="certifica2FileWizard"
									action="certifica2FileWizard_step0"
									actionListener="#{certifica2FileWizard.onStart}"
									value="#{payrollBundle.certifica2FileWizard_module}" />
							</aon:div>
								
						</aon:div>
					</aon:panelGrid>

					<aon:panelGrid id="launcher_wizard"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-reservation aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{payrollBundle.payroll_salary_launchers}" />
						</f:facet>					
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="salaryLauncher"
									action="salaryLauncher_form"
									actionListener="#{salaryLauncher.onStart}"
									value="#{payrollBundle.payroll_salary_launcher_module}">
								</aon:commandLink>
							</aon:div>
							
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="salaryTestLauncher"
									action="salaryTestLauncher_form"
									actionListener="#{salaryTestLauncher.onStart}"
									value="#{payrollBundle.payroll_salary_test_launcher_module}">
								</aon:commandLink>
							</aon:div>

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="salaryRemover"
									action="salaryRemover_search"
									value="#{payrollBundle.payroll_salary_remover_module}">
									<aon:actionListener method="#{salary.onEditSearch}" />
									<aon:actionListener method="#{salaryRemover.onInitialize}" />
								</aon:commandLink>
							</aon:div>
							
						</aon:div>
					</aon:panelGrid>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
