<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="otrpercSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_principales_personas_otrperc}" />
				<ui:param name="controller" value="#{otrperc}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{otrperc.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="otrperc_list" />

					<aon:div id="otrperc" styleClass="aon-scroll-area">


						<aon:div>
							<aon:panelGrid columns="4" dir="true" width="100%"
								style="margin-bottom=2px;">



								<aon:outputLabel for="Otrperc_cdg"
									value="#{appBundle.aon_payroll_principales_personas_otrperc_num}" />
								<aon:inputText id="Otrperc_cdg"
									valueChangeListener="#{otrperc.addExpression}" size="10"
									maxlength="6" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_per}" />
								<aon:div styleClass="aon-lookup">
									<aon:lookupInputText id="Persona_cdg" lookup="#{personaLookup}"
										reRender="Persona_description" value="#{otrperc.persona.cdg}"
										size="5">
									</aon:lookupInputText>
									<aon:lookupButton id="Persona_lookup"
										windowTitle="#{appBundle.aon_payroll_auxiliares_tipos__tipovia}"
										selectReRender="Persona_cdg,Persona_description"
										lookup="#{personaLookup}" minHeight="440"
										property="#{otrperc.persona}">
									</aon:lookupButton>
								</aon:div>

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_emp}" />
								<aon:div styleClass="aon-lookup">
									<aon:lookupInputText id="Empre_cdg" lookup="#{empresaLookup}"
										reRender="Empr_description" value="#{otrperc.empresa.cdg}"
										size="5">
									</aon:lookupInputText>
									<aon:lookupButton id="Empre_lookup"
										windowTitle="#{appBundle.aon_payroll_principales_tipocuenta_empresa}"
										selectReRender="Empre_cdg,Empre_description"
										lookup="#{empresaLookup}" minHeight="440"
										property="#{otrperc.empresa}">
									</aon:lookupButton>
									<aon:inputText id="Empre_description"
										value="#{(otrperc.empresa.descripcion!=null)?(otrperc.empresa.descripcion):('')}"
										size="40" disabled="true" />
								</aon:div>

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_nom}" />
								<aon:inputText id="Otrperc_persona_nombre"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_ape1}" />
								<aon:inputText id="Otrperc_persona_descripcion"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_ape2}" />
								<aon:inputText id="Otrperc_persona_apellido2"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />
							</aon:panelGrid>
						</aon:div>

						<aon:div>
							<aon:panelGrid columns="4" dir="true" width="100%">
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_fecha}" />
								<aon:selectInputDate renderAsPopup="true"
									popupDateFormat="#{appBundle.aon_date_pattern}"
									value="#{otrperc.fecha}" enableManualInput="true" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_concep}" />
								<aon:inputText id="Otrperc_concepto"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />


								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_claveper}" />

								<aon:selectOneMenu id="Otrperc_clave"
									valueChangeListener="#{otrperc.addExpression}">
									<aon:enumConverter
										enum="com.code.aon.payroll.enumeration.Claveper" />
									<f:selectItem value="#{null}" itemLabel="    " />
									<f:selectItems value="#{otrperc.listaClaves}" />
								</aon:selectOneMenu>

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_subclave}" />
								<aon:inputText id="Otrperc_subclave"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_imp}" />
								<aon:inputText id="Otrperc_importe"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_base}" />
								<aon:inputText id="Otrperc_base"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />


								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_porcen}" />
								<aon:inputText id="Otrperc_prcret"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_ret}" />
								<aon:inputText id="Otrperc_retencion"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />



								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_apor}" />
								<aon:inputText id="Otrperc_aportaSs"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />


								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_anio}" />
								<aon:inputText id="Otrperc_anio"
									valueChangeListener="#{otrperc.addExpression}" size="60"
									maxlength="20" />

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_nat}" />
								<aon:selectOneRadio layout="pageDirection" id="Otrperc_natret"
									valueChangeListener="#{otrperc.addExpression}">

									<aon:enumConverter
										enum="com.code.aon.payroll.enumeration.Retribuciones" />
									<f:selectItems value="#{otrperc.listaRetribuciones}" />
								</aon:selectOneRadio>


								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_personas_otrperc_ingresocuenta}" />
								<aon:selectOneRadio layout="pageDirection" id="Otrperc_ingreso"
									valueChangeListener="#{otrperc.addExpression}">
									<aon:enumConverter
										enum="com.code.aon.payroll.enumeration.Ingreso" />
									<f:selectItems value="#{otrperc.listaIngreso}" />
								</aon:selectOneRadio>



							</aon:panelGrid>
						</aon:div>
					</aon:div>
				</ui:define>
			</ui:decorate>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{personaLookup}" />
		<aon:lookupButtonPopup lookup="#{empresaLookup}" />


	</ui:define>

</ui:composition>
