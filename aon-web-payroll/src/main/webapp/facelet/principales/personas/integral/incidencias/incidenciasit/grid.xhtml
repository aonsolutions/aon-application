<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div id="nominaitDataDiv">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{nominait}" />
			<ui:param name="columnClasses" value="
			aon-editDataTable-dateColumn, aon-editDataTable-dateColumn,
			aon-editDataTable-dateColumn,
			aon-editDataTable-textColumn, aon-editDataTable-numberColumn" />
			<!--  
			<ui:param name="showDataScroller" value="#{(!comunidad.new) and (comunidad.to != null)}" />			
			-->
			
			<ui:param name="skipSaveButton" value="#{true}" />
			<ui:param name="skipRemoveButton" value="#{true}" />
			<!-- <aon:methodParam name="resetAction" value="nominait_form" /> -->
			<!-- <ui:param name="skipResetButton" value="#{trabajador.new or (trabajador.to == null)}" /> -->
			
			
			
			<ui:define name="columns">
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecini_inci}" />
					</f:facet>
					<aon:outputText value="#{to.id.feciniit}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecini_inci_nomina}" />
					</f:facet>
					<aon:outputText value="#{to.id.fecini}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecfin_inci_anual}" />
					</f:facet>
					<aon:outputText value="#{to.fecfin}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_tipo_it}" />
					</f:facet>
					<aon:outputText value="#{to.tipoit}" />
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_dias_it}" />
					</f:facet>
					<aon:outputText value="#{to.diasit}" />
				</aon:column>
								
			</ui:define>
		</ui:decorate>
					
	</aon:div>

</ui:composition>
