<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div id="trabajadorDataDiv">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{trabajador}" />
			<ui:param name="columnClasses" value="
			aon-editDataTable-dateColumn, aon-editDataTable-dateColumn,
			aon-editDataTable-numberColumn, aon-editDataTable-textColumn, 
			aon-editDataTable-numberColumn" />
			<!--  
			<ui:param name="showDataScroller" value="#{(!comunidad.new) and (comunidad.to != null)}" />			
			-->
			
			<ui:param name="skipSaveButton" value="#{true}" />
			<ui:param name="skipRemoveButton" value="#{true}" />
			<ui:param name="rowSelectorReRender" value="trabajadorTabs" />
			<ui:param name="cancelButtonReRender" value="trabajadorTabs" />
			
			<!-- <aon:methodParam name="resetAction" value="trabajador_form" /> -->
			<!-- <ui:param name="skipResetButton" value="#{trabajador.new or (trabajador.to == null)}" /> -->
			
			<!-- 
			<ui:param name="skipLineEdition" value="#{true}" /> 
			<aon:rowSelector actionListener="#{trabajador.onSelect}"  />
			
			
			<aon:column id="trabajador-selectColumn" 
				styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<h:commandButton
							id="trabajador-reset" title="#{bundle.aon_reset}"
							action="#{trabajador_form}" actionListener="#{trabajador.onReset}"
							rendered="#{!trabajador.new}" 
							styleClass="aon-editDataTable-button aon-icon-reset"
							accesskey="#{bundle.aon_key_new_line}" />

					</aon:div>
				</f:facet>
			</aon:column>
			 -->
				 
				
			<ui:define name="columns">
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecha_alta}" />
					</f:facet>
					<aon:outputText value="#{to.fecalt}" rendered="#{to!=trabajador.to}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:selectInputDate renderAsPopup="true" required="true"
						rendered="#{to==trabajador.to}"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{trabajador.to.fecalt}" enableManualInput="true" />
					<f:facet name="footer">
						<aon:selectInputDate renderAsPopup="true" required="true"
							rendered="#{trabajador.new}"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{trabajador.to.fecalt}" enableManualInput="true" />
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecha_baja}" />
					</f:facet>
					<aon:outputText value="#{to.fecbaj}" rendered="#{to!=trabajador.to}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:selectInputDate renderAsPopup="true" required="true"
						rendered="#{to==trabajador.to}"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{trabajador.to.fecbaj}" enableManualInput="true" />
					<f:facet name="footer">
						<aon:selectInputDate renderAsPopup="true" required="true"
							rendered="#{trabajador.new}"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{trabajador.to.fecbaj}" enableManualInput="true" />
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_cod_trab}" />
					</f:facet>
					<aon:outputText value="#{to.cdg}" rendered="#{to!=trabajador.to}" />
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{to==trabajador.to}" size="6"
						value="#{trabajador.to.cdg}" maxlength="4" />
					<f:facet name="footer">
						<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{trabajador.new}" size="6"
							value="#{trabajador.to.cdg}" maxlength="4" />
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_desc_act}" />
					</f:facet>
					<aon:outputText value="#{to.actividad.descripcion}" rendered="#{to!=trabajador.to}" />
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{to==trabajador.to}" size="40"
						value="#{trabajador.to.actividad.descripcion}" maxlength="60" />
					<f:facet name="footer">
						<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{trabajador.new}" size="40"
							value="#{trabajador.to.actividad.descripcion}" maxlength="60" />
					</f:facet>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_cod_act}" />
					</f:facet>
					<aon:outputText value="#{to.actividad.cdg}" rendered="#{to!=trabajador.to}" />
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{to==trabajador.to}" size="5"
						value="#{trabajador.to.actividad.cdg}" maxlength="4" />
					<f:facet name="footer">
						<aon:inputText styleClass="aon-form-input-text" required="true"
							rendered="#{trabajador.new}" size="5"
							value="#{trabajador.to.actividad.cdg}" maxlength="4" />
					</f:facet>
				</aon:column>
				

				
			</ui:define>
		</ui:decorate>
					
	</aon:div>

</ui:composition>
