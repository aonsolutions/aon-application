					<aon:div id="empresaData" styleClass="aon-scroll-area aon-scroll-area-principales">

						<aon:div id="datos1" styleClass="aon-scroll-area">
							<aon:panelGrid columns="4" dir="true" width="100%">

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_cdg_descripcion}" />
								<aon:div>
									<aon:inputText value="#{empresa.to.cdg}" 
										size="4" maxlength="4" readonly="#{true}" disabled="#{true}" />
									<rich:spacer />
									<aon:inputText value="#{empresa.to.descripcion}" id="NombreEmpresa" 
										size="60" maxlength="40" required="#{true}" />
								</aon:div>

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_alias}" />
								<aon:inputText
									value="#{empresa.to.alias}" size="40" maxlength="60" />

								<aon:outputLabel for="Cliente_cdg"
									value="#{appBundle.aon_payroll_principales_empresa_cliente}" />
								<aon:div>
									<!-- aon:outputText
										value="#{empresa.to.cliente.descripcion}" size="40" /-->
									<aon:div styleClass="aon-lookup">
										<aon:lookupInputText id="Cliente_cdg" rendered="#{true}"
											lookup="#{clienteLookup}" reRender="Cliente_descripcion"
											value="#{empresa.to.cliente.cdg}" size="5">
										</aon:lookupInputText>
										<aon:lookupButton id="Cliente_lookup"
											windowTitle="#{appBundle.aon_payroll_principales_empresa_cliente}"
											selectReRender="Cliente_cdg,Cliente_descripcion"
											lookup="#{clienteLookup}" minHeight="440"
											property="#{empresa.to.cliente}">
										</aon:lookupButton>
										<aon:inputText id="Cliente_descripcion"
											value="#{(empresa.to.cliente.descripcion!=null)?(empresa.to.cliente.descripcion):('')}"
											size="45" disabled="true" />
									</aon:div>
								</aon:div>
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_feccon}" />
								<aon:selectInputDate value="#{empresa.to.feccon}"
									renderAsPopup="true" enableManualInput="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
												

							</aon:panelGrid>
						</aon:div>
						<rich:spacer />

						<aon:div id="datos2"
							styleClass="aon-scroll-area">

							<aon:panelGrid columns="4" dir="true"
								width="100%">
 
								<aon:outputLabel for="Documento_cdg"
									value="#{appBundle.aon_payroll_principales_empresa_tipdoc}" />
								<aon:div styleClass="aon-lookup">
									<aon:lookupInputText id="Documento_cdg"
										lookup="#{documentoLookup}" reRender="Documento_description"
										value="#{empresa.to.tipdoc.cdg}" size="5" required="#{true}">
									</aon:lookupInputText>
									<aon:lookupButton id="Documento_lookup"
										windowTitle="#{appBundle.aon_payroll_principales_empresa_tipdoc}"
										selectReRender="Documento_cdg,Documento_description"
										lookup="#{documentoLookup}" minHeight="440"
										property="#{empresa.to.tipdoc}">
									</aon:lookupButton>
									<aon:inputText id="Documento_description"
										value="#{(empresa.to.tipdoc.description!=null)?(empresa.to.tipdoc.description):('')}"
										size="60" disabled="true" />
								</aon:div>
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_numdoc}" />
								<aon:inputText id="NumeroDocumento"
									value="#{empresa.to.numdoc}" size="10" maxlength="10" required="#{true}" />

								<aon:outputLabel for="Divisa_cdg"
									value="#{appBundle.aon_payroll_principales_divisa}" />
								<aon:div styleClass="aon-lookup">
									<aon:lookupInputText id="Divisa_cdg"

									</aon:lookupInputText>

										windowTitle="#{appBundle.aon_payroll_principales_divisa}"

										lookup="#{divisaLookup}" minHeight="440"
										property="#{empresa.to.divisa}">
									</aon:lookupButton>

										value="#{(empresa.to.divisa.description!=null)?(empresa.to.divisa.description):('')}"
										size="60" disabled="true" />
								</aon:div>

								<aon:outputLabel for="Pais_cdg"
									value="#{appBundle.aon_payroll_principales_pais}" />

									<aon:lookupInputText id="Pais_cdg"
										lookup="#{paisLookup}" reRender="Pais_description"
										value="#{empresa.to.pais.cdg}" size="5">
									</aon:lookupInputText>
									<aon:lookupButton id="Pais_lookup"
										windowTitle="#{appBundle.aon_payroll_principales_pais}"
										selectReRender="Pais_cdg,Pais_description"
										lookup="#{paisLookup}" minHeight="440"
										property="#{empresa.to.pais}">
									</aon:lookupButton>
									<aon:inputText id="Pais_description"
										value="#{(empresa.to.pais.descripcion!=null)?(empresa.to.pais.descripcion):('')}"
										size="60" disabled="true" />
								</aon:div>


							</aon:panelGrid>
						</aon:div>

						<aon:div id="datos3"
							styleClass="aon-scroll-area">
							<aon:panelGrid columns="4" dir="true"
								width="100%" style="margin-bottom=2px;">
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_representante}" />
								<aon:inputText
									value="#{empresa.to.representante}" size="40" maxlength="60" />
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_cargo}" />
								<aon:inputText
									value="#{empresa.to.cargo}" size="40" maxlength="60" />
									
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_fecnac}" />

									renderAsPopup="true" enableManualInput="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
									
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_edad}" />
								<aon:outputText
									value="#{empresa.edad}" size="5"  />
									
								<aon:outputLabel for="Documento1_cdg"
									value="#{appBundle.aon_payroll_principales_empresa_tipdoc}" />

										value="#{(empresa.to.tipdoc1.description!=null)?(empresa.to.tipdoc1.description):('')}"

									value="#{appBundle.aon_payroll_principales_empresa_numdoc}" />

									value="#{empresa.to.nrodocrep}" size="10" maxlength="10" />

								<aon:outputLabel for="Pais1_cdg"
									value="#{appBundle.aon_payroll_principales_pais}" />

									<aon:lookupInputText id="Pais1_cdg"
										lookup="#{paisLookup}" reRender="Pais1_description"
										value="#{empresa.to.pais1.cdg}" size="5">
									</aon:lookupInputText>
									<aon:lookupButton id="Pais1_lookup"
										windowTitle="#{appBundle.aon_payroll_principales_pais}"
										selectReRender="Pais1_cdg,Pais1_description"
										lookup="#{paisLookup}" minHeight="440"
										property="#{empresa.to.pais1}">
									</aon:lookupButton>
									<aon:inputText id="Pais1_description"
										value="#{(empresa.to.pais1.descripcion!=null)?(empresa.to.pais1.descripcion):('')}"
										size="60" disabled="true" />
								</aon:div>
									
							</aon:panelGrid>

						</aon:div>

						<aon:div id="datos4"
							styleClass="aon-scroll-area">
							<aon:panelGrid columns="4" dir="true"
								width="100%" style="margin-bottom=2px;">
								
								<aon:outputLabel for="Admon_cdg"
									value="#{appBundle.aon_payroll_principales_empresa_admon}" />

								<aon:outputLabel for="Tipempr_cdg"
									value="#{appBundle.aon_payroll_principales_empresa_tipempr}" />

									<aon:lookupInputText id="Tipempr_cdg"

								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_datreg}" />

									value="#{empresa.to.datreg}" size="40" maxlength="50" />
							
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_genero}" />
								<aon:selectOneRadio 
									value="#{empresa.to.sexo}">
									<f:selectItems
										value="#{empresa.listaSexo}" />
								</aon:selectOneRadio>
								
								
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_ini_rel}" />
								<aon:selectInputDate value="#{empresa.to.fecini}"
									renderAsPopup="true" enableManualInput="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_con_cliente}" />
								<aon:selectInputDate value="#{empresa.to.cliente.fecini}" 
									disabled="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_fin_rel}" />
								<aon:selectInputDate value="#{empresa.to.fecfin}"
									renderAsPopup="true" enableManualInput="true" 
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_con_cliente}" />
								<aon:selectInputDate value="#{empresa.to.cliente.fecfin}" 
									disabled="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>							
								
								
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_empresa_obsnif}" />
								<aon:inputTextarea
									value="#{empresa.to.obsnif}" cols="60" rows="5" size="1" />
								
							</aon:panelGrid>
							
						</aon:div>
						
						<aon:div id="datos5"
							styleClass="aon-scroll-area">
							<aon:panelGrid columns="5" dir="true"
								width="100%" style="margin-bottom=2px;text-align: top;"
								columnClasses="none,none,none,none,none">
								
								<aon:panel style="height: 100%">
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_payroll_principales_empresa_servicios}"/>
									</f:facet>
									<aon:selectBooleanCheckbox
										value="#{empresa.to.indcal}" /> 
									<aon:outputLabel
										value="#{appBundle.aon_payroll_principales_empresa_indcal}" />
									<br />
									<aon:selectBooleanCheckbox
										value="#{empresa.to.indnom}" /> 
									<aon:outputLabel
										value="#{appBundle.aon_payroll_principales_empresa_indnom}" />
									<br />
									<aon:selectBooleanCheckbox
										value="#{empresa.to.indcoste}" /> 
									<aon:outputLabel
										value="#{appBundle.aon_payroll_principales_empresa_indcoste}" />
								</aon:panel>
								
								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_payroll_principales_empresa_indirpf}"/>
									</f:facet>
									<aon:selectOneRadio layout="pageDirection"
										value="#{empresa.to.indirpf}">
										<f:selectItems
											value="#{empresa.listaIndicadoresIrpf}" />
									</aon:selectOneRadio>
								</aon:panel>
								

								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_payroll_principales_empresa_concierto}"/>
									</f:facet>
									<aon:selectOneRadio layout="pageDirection"
										value="#{empresa.to.cecon}">
										<f:selectItems
											value="#{empresa.listaConciertos}" />
									</aon:selectOneRadio>
								</aon:panel>

								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_payroll_principales_clientes_envioss}"/>
									</f:facet>
									<aon:selectOneRadio layout="pageDirection"
										value="#{empresa.to.envioss}">
										<f:selectItems
											value="#{empresa.listaEnvioss}" />
									</aon:selectOneRadio>
								</aon:panel>

								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_payroll_principales_empresa_impuestos}"/>
									</f:facet>
									<aon:selectOneRadio layout="pageDirection"
										value="#{empresa.to.modimpuesto}">
										<f:selectItems
											value="#{empresa.listaPagoImpuestos}" />
									</aon:selectOneRadio>
								</aon:panel>

				<aon:lookupButtonPopup lookup="#{clienteLookup}" />
				<aon:lookupButtonPopup lookup="#{documentoLookup}" />
				<aon:lookupButtonPopup lookup="#{divisaLookup}" />
				<aon:lookupButtonPopup lookup="#{paisLookup}" />
				<aon:lookupButtonPopup lookup="#{admonLookup}" />
				<aon:lookupButtonPopup lookup="#{empresarioLookup}" />

			</ui:define>
