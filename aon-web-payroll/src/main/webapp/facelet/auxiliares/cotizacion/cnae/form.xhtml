<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="cnaeForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.auxiliares_cotizacion__cnae}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{porcentajeMaestro.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="cotizacion_cnae"
							actionListener="#{cnaeMaestro.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{cnaeMaestro.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{cnaeMaestro.onCancel}"
							confirmAction="cotizacion_cnae_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!cnaeMaestro.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{cnaeMaestro.onRemove}"
							confirmAction="cotizacion_cnae_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!cnaeMaestro.new}"
							action="cotizacion_cnae" 
							actionListener="#{cnaeMaestro.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!cnaeMaestro.new}" immediate="true"
							action="cotizacion_cnae_search" actionListener="#{cnaeMaestro.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />														

						<aon:spin controller="#{cnaeMaestro}" action="cotizacion_cnae" rendered="#{!cnaeMaestro.new}" />
						<!--  
						<ui:include src="/facelet/templates/aon.ui.printbuttons.xhtml">
							<ui:param name="manager" value="#{cnaeMaestro}"/>
							<ui:param name="reportKey" value="cnaeCotizacion"/>
						</ui:include>
						-->
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="cnaeMaestro"  columns="2" dir="true" width="50%" style="margin-bottom=2px;">
						<aon:outputLabel for="CnaeMaestro_cdg" value="#{appBundle.aon_payroll_cdg}" />
						<aon:inputText id="CnaeMaestro_cdg" value="#{cnaeMaestro.to.cdg}" disabled="#{!cnaeMaestro.new}" 
							required="true" size="15" maxlength="10" />
						
						<aon:outputLabel value="#{appBundle.aon_payroll_cotizacion_ocupacion}" />	
						<aon:inputText id="CnaeMaestro_ocupacion" value="#{cnaeMaestro.to.ocupacion}" 
							size="30" maxlength="25" >
						</aon:inputText>
						
						<aon:outputLabel for="CnaeMaestro_description" value="#{appBundle.aon_payroll_description}" />
						<aon:inputText id="CnaeMaestro_description" value="#{cnaeMaestro.to.description}" 
							size="30" maxlength="50" >
						</aon:inputText>
					
					
				</aon:panelGrid>
				
				<aon:panelGrid id="cnaeMaestroOcupaciones"  columns="1" width="50%">
					<aon:outputLabel value="#{appBundle.aon_payroll_cotizacion_ocupacion}" />
					
					<ui:include src="ocupacion/grid.xhtml" />
					
				</aon:panelGrid>
	
				<ui:include src="grid.xhtml" rendered="#{!cnaeMaestro.new}" />
						
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
