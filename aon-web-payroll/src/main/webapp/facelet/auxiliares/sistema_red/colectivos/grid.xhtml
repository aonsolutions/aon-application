<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>
<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="documentoGrid">
	
			<aon:div ajaxRendered="true" layout="none">
	
				<aon:div styleClass="aon-finding-title-toolbar">
					<aon:panelGrid columns="3" dir="true"
						columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
	
						<aon:div styleClass="aon-finding-title-internal">
							<aon:outputText value="#{appBundle.payroll_colectivos_label}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{appBundle.payroll_crud_label}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-toolbar-item-group">
							<aon:commandButton id="reset" value="#{bundle.aon_reset}"
								actionListener="#{sistemaRedColectivos.onReset}" rendered="#{!sistemaRedColectivos.new}"
								styleClass="aon-finding-toolbar-item aon-icon-reset"
								accesskey="#{bundle.aon_key_new}"/>
							<aon:commandButton id="save"
								value="#{bundle.aon_save}" rendered="#{sistemaRedColectivos.to!=null or sistemaRedColectivos.new}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								actionListener="#{sistemaRedColectivos.onAccept}" 
								accesskey="#{bundle.aon_key_new}" />
							<aon:confirmButton id="cancelNew"
								value="#{bundle.aon_cancel}" rendered="#{sistemaRedColectivos.new}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{sistemaRedColectivos.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:commandButton id="cancelEdit"
								value="#{bundle.aon_cancel}" rendered="#{sistemaRedColectivos.to!=null and (!sistemaRedColectivos.new)}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								actionListener="#{sistemaRedColectivos.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:confirmButton id="remove"
								value="#{bundle.aon_remove}" rendered="#{sistemaRedColectivos.to!=null and !sistemaRedColectivos.new}"
								styleClass="aon-finding-toolbar-item aon-icon-delete" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{sistemaRedColectivos.onRemove}"
								accesskey="#{bundle.aon_key_remove}"/>
							<h:commandLink id="export2pdf" value="."
									title="#{appBundle.payroll_export_label} #{appBundle.payroll_to} #{appBundle.payroll_pdf_label}"
									styleClass="aon-finding-toolbar-item aon-icon-pdf"
									action="#{report.onExecute}" rendered="#{!sistemaRedColectivos.new}" 
									target="_blank">
								<f:param name="reportKey" value="sistemaRedColectivosList" />
							</h:commandLink>
							<h:commandLink id="export2excel" value="."
									title="#{appBundle.payroll_export_label} #{appBundle.payroll_to} #{appBundle.payroll_excel_label}"
									styleClass="aon-finding-toolbar-item aon-icon-excel"
									action="#{report.onExecute}" rendered="#{!sistemaRedColectivos.new}" 
									target="_blank">
								<f:param name="reportKey" value="sistemaRedColectivosList" />
								<f:param name="outputFormat" value="MS Excel" />
							</h:commandLink>
							<h:commandLink id="export2csv" value="."
									title="#{appBundle.payroll_export_label} #{appBundle.payroll_to} #{appBundle.payroll_csv_label}"
									styleClass="aon-finding-toolbar-item aon-icon-excel"
									action="#{report.onExecute}" rendered="#{!sistemaRedColectivos.new}" 
									target="_blank">
								<f:param name="reportKey" value="sistemaRedColectivosList" />
								<f:param name="outputFormat" value="CSV" />
							</h:commandLink>
						</aon:div>
					</aon:panelGrid>
				</aon:div>
	
				<!-- region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<aon:editDataTable id="colectivosData" var="to" rows="0"
						rendered="#{(sistemaRedColectivos.model.rowCount > 0) or (sistemaRedColectivos.new)}" value="#{sistemaRedColectivos.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-numberColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
								
						<aon:rowSelector toggleOnClick="#{sistemaRedColectivos.to == null}"
							actionListener="#{sistemaRedColectivos.onSelect}" />
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{sistemaRedColectivos.onReset}" value=""
										rendered="#{!sistemaRedColectivos.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.payroll_cdg_label}" />
							</f:facet>
							<aon:outputText value="#{to.cdg}" rendered="#{to!=sistemaRedColectivos.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==sistemaRedColectivos.to}" size="2"
								value="#{sistemaRedColectivos.to.cdg}" maxlength="1" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{sistemaRedColectivos.new}" size="2"
									value="#{sistemaRedColectivos.to.cdg}" maxlength="1" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.payroll_description_label}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{to!=sistemaRedColectivos.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==sistemaRedColectivos.to}" size="60"
								value="#{sistemaRedColectivos.to.description}" maxlength="45" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{sistemaRedColectivos.new}" size="60"
									value="#{sistemaRedColectivos.to.description}" maxlength="45" />
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.payroll_short_description_label}" />
							</f:facet>
							<aon:outputText value="#{to.descripcorta}" rendered="#{to!=sistemaRedColectivos.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==sistemaRedColectivos.to}" size="60"
								value="#{sistemaRedColectivos.to.descripcorta}" maxlength="45" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{sistemaRedColectivos.new}" size="60"
									value="#{sistemaRedColectivos.to.descripcorta}" maxlength="45" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=sistemaRedColectivos.to}">&#160;</f:verbatim>
								<aon:commandButton id="acceptEdit-Scope" title="[#{bundle.aon_accept}]" 
									rendered="#{to==sistemaRedColectivos.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{sistemaRedColectivos.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==sistemaRedColectivos.to}"
									actionListener="#{sistemaRedColectivos.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==sistemaRedColectivos.to}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{sistemaRedColectivos.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />								
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!sistemaRedColectivos.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]" 
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{sistemaRedColectivos.new}"
										actionListener="#{sistemaRedColectivos.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{sistemaRedColectivos.new}"
										confirmTitle="#{bundle.aon_confirm_title}" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{sistemaRedColectivos.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
						
					</aon:editDataTable>
					<aon:dataScroller for="colectivosData" rowCount="#{sistemaRedColectivos.model.rowCount}" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
</body>
</html>
