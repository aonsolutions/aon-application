<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="categoriaSearch">
			 
			 <ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_auxiliares_convenios__percepciones}" />
				<ui:param name="controller" value="#{percniv}" />
			</ui:include>
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{percniv.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="percniv_list" />				
				
			
					<aon:outputLabel for="Percniv_convenio_description" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__convenio}"/>
					<aon:inputText id="Percniv_convenio_description"  size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />
					
					<aon:outputLabel for="Percniv_nivel_id_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__categoria_nivel}"/>
					<aon:inputText id="Percniv_nivel_id_cdg" size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />
					
					<aon:outputLabel for="Percniv_id_codcom" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__complemento}"/>
					<aon:inputText id="Percniv_id_codcom" size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />
					  
					<aon:outputLabel for="Percniv_descom" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__desc_comp}"/>
					<aon:inputText id="Percniv_descom" size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />
					
					<aon:outputLabel for="Percniv_desabr" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__short_desc_comp}"/>
					<aon:inputText id="Percniv_desabr" size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />
					
					<aon:outputLabel for="Percniv_tipcom" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__tip_comp}"/>
					<aon:selectOneMenu id="Percniv_tipcom" 
						valueChangeListener="#{percniv.addEqualExpression}" >	
						<aon:enumConverter enum="com.code.aon.payroll.enumeration.TipoComplemento" />	
						<f:selectItem value="#{null}" itemLabel="  " />											
						<f:selectItems value="#{complemento.listaComplementos}"/>
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Percniv_tipcot" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__tip_coti}"/>	
					<aon:selectOneMenu id="Percniv_tipcot" 
						valueChangeListener="#{percniv.addEqualExpression}" >	
						<aon:enumConverter enum="com.code.aon.payroll.enumeration.TipoCotizaciones" />
						<f:selectItem value="#{null}" itemLabel="  " />
						<f:selectItems value="#{complemento.listaCotizaciones}" />
					</aon:selectOneMenu>					

					<aon:outputLabel for="Percniv_calculo" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__calculo}"/>
					<aon:inputText id="Percniv_calculo" size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />
						
					<aon:outputLabel for="Percniv_mes" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__mes}"/>
					<aon:inputText id="Percniv_mes" size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />
					
					<aon:outputLabel for="Percniv_unidades" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__unid_comp}"/>
					<aon:inputText id="Percniv_unidades" size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />	
					
					<aon:outputLabel for="Percniv_impuni" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__importe_unit}"/>
					<aon:inputText id="Percniv_impuni" size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />
						
					<aon:outputLabel for="Percniv_importe" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__importe_comp}"/>
					<aon:inputText id="Percniv_importe" size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />
						
					<aon:outputLabel for="Percniv_garilt" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__ilt}"/>
					<aon:inputText id="Percniv_garilt" size="35" maxlength="35" 
						valueChangeListener="#{percniv.addExpression}" />
					
					<aon:outputLabel for="Complemento_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__aplic_comp}"/>
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Complemento_cdg"
							lookup="#{complementoLookup}"
							reRender="Complemento_description"
							value="#{percniv.complemento.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Complemento_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_convenios__aplic_comp}"
							selectReRender="Complemento_cdg,Complemento_description"
							lookup="#{complementoLookup}" minHeight="440"
							property="#{percniv.complemento}">
						</aon:lookupButton>
						<aon:inputText id="Complemento_description"
							value="#{(percniv.complemento.description!=null)?(percniv.complemento.description):('')}"
							size="34" disabled="true" />
					</aon:div>		
					
					
					<aon:outputText value=" "/>
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__ind_comp}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="Percniv_indcom" 
								valueChangeListener="#{percniv.addEqualExpression}" >	
					    		<aon:enumConverter enum="com.code.aon.payroll.enumeration.IndiceComplemento" />	
								<f:selectItems value="#{complemento.listaIndiceComplemento}"  />											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>
					
					<aon:outputText value="" />
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__redondeo}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="Percniv_redext" 
								valueChangeListener="#{percniv.addEqualExpression}" >	
					    		<aon:enumConverter enum="com.code.aon.payroll.enumeration.PagaExtra" />	
								<f:selectItems value="#{percniv.listaPagaExtra}"/>											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>					
					
					<aon:outputText value="" />
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__fijo_var}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="Percniv_fijovar" 
								valueChangeListener="#{percniv.addEqualExpression}" >	
					    		<aon:enumConverter enum="com.code.aon.payroll.enumeration.FijoVariable" />
								<f:selectItems value="#{complemento.listaFijoVariable}"/>											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>
					
					<aon:outputText value="" />
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__retrib}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="Percniv_dinesp" 
								valueChangeListener="#{percniv.addEqualExpression}" >	
					    		<aon:enumConverter enum="com.code.aon.payroll.enumeration.Retribuciones" />	
								<f:selectItems value="#{complemento.listaRetribuciones}"/>											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>
					
					
					
					
					
				</ui:define>
			</ui:decorate>

		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{complementoLookup}" />
		
	</ui:define>
		
</ui:composition>
