<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="percepcionForm">
			
			<ui:include src="/facelet/templates/formPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_auxiliares_convenios__percepciones}" />				
				<ui:param name="controller" value="#{percepcion}"/>
				<ui:param name="reportKey" value="percepcionList"/>
				<ui:param name="reportKeyXls" value="percepcionListXls"/>
				<aon:methodParam name="backAction" value="convenio_form"/>
				<aon:methodParam name="cancelAction" value="convenio_form"/>
			</ui:include>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="percepcion_left" columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel for="Percepcion_convenio_description" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__convenio}"/>
					<aon:outputText id="Percepcion_convenio_description"  size="35" maxlength="35" 
						value="#{percepcion.to.convenio.description}" />
					
					<aon:outputLabel for="Percepcion_nivel" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__categoria_nivel}"/>
					<aon:outputText id="Percepcion_nivel" size="2" maxlength="2"
						value="#{percepcion.to.nivel.id.cdg}" />
					
					<aon:outputLabel for="Percepcion_id_codcom" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__complemento}"/>
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Percepcion_id_codcom"
							lookup="#{complementoLookup}" required="true"
							reRender="Percepcion_complemento_description,
								Percepcion_descom,Percepcion_desabr,Percepcion_tip_comp,Percepcion_tip_coti,
								IndComplemento,PagaExtra,FijoVar,Retribucion"
							value="#{percepcion.to.complemento1.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Percepcion_id_codcom_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_convenios__aplic_comp}"
							selectReRender="Percepcion_id_codcom,Percepcion_complemento_description,
								Percepcion_descom,Percepcion_desabr,Percepcion_tip_comp,Percepcion_tip_coti,
								IndComplemento,PagaExtra,FijoVar,Retribucion"
							lookup="#{complementoLookup}" minHeight="440"
							property="#{percepcion.to.complemento1}">
						</aon:lookupButton>
						<aon:outputText id="Percepcion_complemento_description"
							value="#{(percepcion.to.complemento1.description!=null)?(percepcion.to.complemento1.description):('')}"
							size="34" disabled="true" />
					</aon:div>		
					  
					<aon:outputLabel for="Percepcion_descom" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__desc_comp}"/>
					<aon:inputText id="Percepcion_descom" size="60" maxlength="50"
						value="#{percepcion.to.descom}" />
					
					<aon:outputLabel for="Percepcion_desabr" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__short_desc_comp}"/>
					<aon:inputText id="Percepcion_desabr" size="20" maxlength="15"
						value="#{percepcion.to.desabr}" />
					
					<aon:outputLabel for="Percepcion_tip_comp" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__tip_comp}"/>
					<aon:selectOneMenu id="Percepcion_tip_comp" value="#{percepcion.to.tipcom}" required="true">	
						<f:selectItem value="#{null}" itemLabel="  " />											
						<f:selectItems value="#{complemento.listaComplementos}"/>
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Percepcion_tip_coti" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__tip_coti}"/>	
					<aon:selectOneMenu id="Percepcion_tip_coti" value="#{percepcion.to.tipcot}" >
						<f:selectItem value="#{null}" itemLabel="  " />
						<f:selectItems value="#{complemento.listaCotizaciones}" />
					</aon:selectOneMenu>					

					<aon:outputLabel for="Percepcion_calculo" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__calculo}"/>
					<aon:inputText id="Percepcion_calculo" size="2" maxlength="1"
						value="#{percepcion.to.calculo}" required="true"/>
						
					<aon:outputLabel for="Percepcion_mes" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__mes}"/>
					<aon:inputText id="Percepcion_mes" size="3" maxlength="2"
						value="#{percepcion.to.mes}" />
					
					<aon:outputLabel for="Percepcion_unidades" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__unid_comp}"/>
					<aon:inputText id="Percepcion_unidades" size="11" maxlength="8"
						value="#{percepcion.to.unidades}"  >
						<a4j:support event="onkeyup" reRender="Percepcion_importe,Percepcion_impuni" ajaxSingle="true"/>
					</aon:inputText>	
					
					<aon:outputLabel for="Percepcion_impuni" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__importe_unit}"/>
					<aon:inputText id="Percepcion_impuni" size="15" maxlength="11"
						value="#{percepcion.to.impuni}" valueChangeListener="#{percepcion.impuniChange}" 
						readonly="#{(percepcion.to.unidades!=0)?(false):(true)}" >
						<a4j:support event="onkeyup" reRender="Percepcion_importe" ajaxSingle="true"/>
					</aon:inputText>
						
					<aon:outputLabel for="Percepcion_importe" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__importe_comp}"/>
					<aon:inputText id="Percepcion_importe" size="15" maxlength="11"
						value="#{percepcion.to.importe}" readonly="#{(percepcion.to.unidades==0)?(false):(true)}" />
						
					<aon:outputLabel for="Percepcion_garilt" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__ilt}"/>
					<aon:inputText id="Percepcion_garilt" size="8" maxlength="5"
						value="#{percepcion.to.garilt}" />
					
					<aon:outputLabel for="Complemento_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__aplic_comp}"/>
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Complemento_cdg"
							lookup="#{complementoLookup}"
							reRender="Complemento_description"
							value="#{percepcion.to.complemento.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Complemento_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_convenios__aplic_comp}"
							selectReRender="Complemento_cdg,Complemento_description"
							lookup="#{complementoLookup}" minHeight="440"
							property="#{percepcion.to.complemento}">
						</aon:lookupButton>
						<aon:inputText id="Complemento_description"
							value="#{(percepcion.to.complemento.description!=null)?(percepcion.to.complemento.description):('')}"
							size="34" disabled="true" />
					</aon:div>		
					
				</aon:panelGrid>
				
				<aon:panelGrid id="percepcion_right" columns="1" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__ind_comp}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="IndComplemento" value="#{percepcion.to.indcom}" >	
								<f:selectItems value="#{complemento.listaIndiceComplemento}"  />	
								<a4j:support event="onclick" reRender="PagaExtra" />										
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>
					
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__redondeo}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="PagaExtra" value="#{percepcion.to.redext}" 
								disabled="#{percepcion.to.disableRedondeo}">	
								<f:selectItems value="#{percepcion.listaPagaExtra}"/>											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>					
					
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__fijo_var}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="FijoVar" value="#{percepcion.to.fijovar}" >	
								<f:selectItems value="#{complemento.listaFijoVariable}"/>											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>
					
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__retrib}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="Retribucion" value="#{percepcion.to.dinesp}" required="true">	
								<f:selectItems value="#{complemento.listaRetribuciones}"/>											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>
				</aon:panelGrid>
				
				


				
			
			</aon:div>
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{complementoLookup}" />
		
	</ui:define>
</ui:composition>

</body>
</html>
