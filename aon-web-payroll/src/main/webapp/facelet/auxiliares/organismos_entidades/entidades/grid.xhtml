<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="sucursalData" value="#{sucursal.model}" 
			var="to" rows="20"
			rendered="#{(sucursal.model.rowCount > 0) or (sucursal.new)}" 
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-textColumn
				,aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{sucursal.to == null}" actionListener="#{sucursal.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{sucursal.onReset}" value=""
							rendered="#{!sucursal.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
					
				</f:facet>
			</aon:column>
			
			
			    <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__entidad_cod}" />
				</f:facet>
				<aon:outputText value="#{to.id.cdg}" rendered="#{to!=sucursal.to}" />				
			
				<aon:inputText  styleClass="aon-form-input-text"
					rendered="#{to==sucursal.to}" 
					value="#{sucursal.to.id.cdg}" maxlength="20" size="20"  />
				<f:facet name="footer">
					<aon:inputText  styleClass="aon-form-input-text"  
						rendered="#{sucursal.new}" 
						value="#{sucursal.to.id.cdg}" maxlength="20" size="20"  />
				</f:facet>
					</aon:column>
				
			
	          <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__entidad_dom}" />
				</f:facet>
				<aon:outputText value="#{to.domsuc}" rendered="#{to!=sucursal.to}" />
					
			
				<aon:inputText  styleClass="aon-form-input-text"
					rendered="#{to==sucursal.to}" 
					value="#{sucursal.to.domsuc}" maxlength="20" size="20"  />
				<f:facet name="footer">
					<aon:inputText  styleClass="aon-form-input-text"  
						rendered="#{sucursal.new}" 
						value="#{sucursal.to.domsuc}" maxlength="20" size="20"  />
				</f:facet>
					</aon:column>
				
		      <aon:column>
				 <f:facet name="header">
				 	<aon:outputText value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__entidad_mun}" />
				 </f:facet>
				 <aon:outputText value="#{to.munsuc}" rendered="#{to!=sucursal.to}" />
					
			
				 <aon:inputText  styleClass="aon-form-input-text"
					rendered="#{to==sucursal.to}" 
					value="#{sucursal.to.munsuc}" maxlength="20" size="20"  />
				<f:facet name="footer">
					<aon:inputText  styleClass="aon-form-input-text"  
						rendered="#{sucursal.new}" 
						value="#{sucursal.to.munsuc}" maxlength="20" size="20"  />
				</f:facet>
					</aon:column>
				
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__entidad_codpos}" />
				</f:facet>
				<aon:outputText value="#{to.cpsuc}" rendered="#{to!=sucursal.to}" />
					
			
				<aon:inputText styleClass="aon-form-input-text"
					rendered="#{to==sucursal.to}" 
					value="#{sucursal.to.cpsuc}" maxlength="20" size="20"  />
				<f:facet name="footer">
					<aon:inputText  styleClass="aon-form-input-text"  
						rendered="#{sucursal.new}" 
						value="#{sucursal.to.cpsuc}" maxlength="20" size="20"  />
				</f:facet>
			</aon:column>
			
			

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=sucursal.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==sucursal.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{sucursal.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==sucursal.to}"
						actionListener="#{sucursal.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==sucursal.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{sucursal.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!sucursal.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{sucursal.new}"
							actionListener="#{sucursal.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{sucursal.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{sucursal.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
			<aon:dataScroller2 for="sucursalData"  />
	</aon:div>

</ui:composition>
