<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="campaignForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_campaign}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.gbp_searching}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{campaign.onCancel}"
							action="campaign_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="campaign_list"
							actionListener="#{campaign.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" 
							value="#{bundle.aon_reset}" action="campaign_form"
							actionListener="#{campaign.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="Campaign_code"
						value="#{appBundle.gbp_campaign_code}" />
					<aon:inputText id="Campaign_code"
						size="16" maxlength="16" 
						valueChangeListener="#{campaign.addExpression}" />

					<aon:outputLabel for="Campaign_name"
						value="#{appBundle.gbp_campaign_name}" />
					<aon:inputText id="Campaign_name"
						size="64" maxlength="64"
						valueChangeListener="#{campaign.addExpression}" />

					<aon:outputLabel for="Campaign_status"
						value="#{appBundle.gbp_campaign_status}" />
					<aon:selectOneMenu id="Campaign_status"
						converter="campaignStatusConverter"
						valueChangeListener="#{campaign.addStatusExpression}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{GBPCollections.campaignStatus}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
