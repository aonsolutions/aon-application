<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="campaignForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_campaign}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{campaign.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{campaign.to!=null or campaign.new}"
							reRender="gridToolbar,campaignTab"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{campaign.accept}" />
						</aon:commandButton>
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{campaign.to!=null or campaign.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							action="campaign_list" immediate="#{true}"
							actionListener="#{campaign.onCancel}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!campaign.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{campaign.onRemove}"
							confirmAction="campaign_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="campaign_search"
							actionListener="#{campaign.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" reRender="gridToolbar,campaignGrid"
							value="#{bundle.aon_reset}" actionListener="#{campaign.onReset}"
							rendered="#{!campaign.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<t:commandButton id="campaign_to" value="#{appBundle.gbp_print}"
							immediate="true" forceId="true" 
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.jsf');return false;"
							styleClass="aon-finding-toolbar-item aon-icon-printer"
							accesskey="#{bundle.aon_key_print}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="campaignGrid" columns="2" dir="true">

					<aon:outputLabel for="Campaign_code"
						value="#{appBundle.gbp_campaign_code}" />
					<aon:inputText id="Campaign_code" required="true" size="16"
						maxlength="16" value="#{campaign.to.code}" />

					<aon:outputLabel for="Campaign_name"
						value="#{appBundle.gbp_campaign_name}" />
					<aon:inputText id="Campaign_name" size="64" maxlength="64"
						value="#{campaign.to.name}" />

					<aon:outputLabel for="Campaign_status"
						value="#{appBundle.gbp_campaign_status}" />
					<aon:selectOneMenu id="Campaign_status"
						value="#{campaign.to.status}">
						<f:selectItems value="#{GBPCollections.campaignStatus}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Campaign_startDate"
						value="#{appBundle.gbp_campaign_start_date}" />
					<aon:selectInputDate id="Campaign_startDate"
						value="#{campaign.to.startDate}" required="true"
						datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
						inputSize="15" />

					<aon:outputLabel for="Campaign_endDate"
						value="#{appBundle.gbp_campaign_end_date}" />
					<aon:selectInputDate id="Campaign_endDate"
						value="#{campaign.to.endDate}"
						datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
						inputSize="15" />

					<aon:outputLabel for="Campaign_budget"
						value="#{appBundle.gbp_campaign_budget}" />
					<aon:inputText id="Campaign_budget" size="16" maxlength="16"
						value="#{campaign.to.budget}" />

					<aon:outputLabel for="Campaign_offerDueDate"
						value="#{appBundle.gbp_campaign_offer_due_date}" />
					<aon:selectInputDate id="Campaign_offerDueDate"
						value="#{campaign.to.offerDueDate}"
						datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
						inputSize="15" />

					<aon:outputLabel for="Campaign_internalCustomer_id"
						value="#{appBundle.gbp_campaign_internal_customer}" />
					<aon:selectOneMenu id="Campaign_internalCustomer_id"
						required="true"
						value="#{campaign.to.internalCustomer.id}">
						<f:selectItems value="#{GBPCollections.internalCustomers}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Campaign_area_id"
						value="#{appBundle.gbp_campaign_area}" />
					<aon:selectOneMenu id="Campaign_area_id"
						value="#{campaign.to.area.id}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{GBPCollections.areasByGroup}" />
					</aon:selectOneMenu>

				</aon:panelGrid>

				<aon:div id="campaignTab">
					<aon:panelTabSet rendered="#{!campaign.new}">

						<aon:panelTab id="campaign" label="#{appBundle.gbp_campaign_suppliers}">
							<ui:include src="/facelet/campaign/supplier/list.xhtml" />
						</aon:panelTab>

					</aon:panelTabSet>
				</aon:div>
			</aon:div>	
		</aon:form>
		<aon:form id="placeList" target="list" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
