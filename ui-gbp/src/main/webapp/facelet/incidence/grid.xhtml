<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<h:dataTable id="#{dataTable}" value="#{controllerAlias.model}" var="to"
		rows="20" styleClass="dr-table rich-table aon-editDataTable"
		headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
		footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
		rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
		cellpadding="0" cellspacing="0"
		columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="&#160;" rendered="#{to==controllerAlias.to}" />
			<aon:commandButton rendered="#{to!=controllerAlias.to}"
				styleClass="aon-editDataTable-button aon-icon-rowSelector"
				actionListener="#{controllerAlias.onSelect}" value="" immediate="true"
				reRender="#{dataTable}">
			</aon:commandButton>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton id="reset"
						title="[#{bundle.aon_reset}]"
						styleClass="aon-editDataTable-button aon-icon-reset" value=""
						immediate="true" reRender="#{dataTable}"
						rendered="#{!controllerAlias.new}" actionListener="#{controllerAlias.onReset}"
						accesskey="#{bundle.aon_key_new_line}">
					</aon:commandButton>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_incidence_date}" />
			</f:facet>
			<aon:outputText value="#{to.incidenceDate}" rendered="#{to!=controllerAlias.to}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>		
			<aon:selectInputDate value="#{controllerAlias.to.incidenceDate}"
				inputSize="15" datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
				rendered="#{to==controllerAlias.to}"/>
			<f:facet name="footer">
				<aon:div>
					<aon:selectInputDate value="#{controllerAlias.to.incidenceDate}"
						inputSize="15" datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
						rendered="#{controllerAlias.new}"/>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_incidence_type}" />
			</f:facet>
			<aon:outputText value="#{to.incidenceType.description}" rendered="#{to!=controllerAlias.to}" />
			<aon:selectOneMenu value="#{controllerAlias.to.incidenceType.id}"
				rendered="#{to==controllerAlias.to}">
				<f:selectItems value="#{GBPCollections.incidenceTypes}" />
			</aon:selectOneMenu>
			<f:facet name="footer">
				<aon:div>
					<aon:selectOneMenu value="#{controllerAlias.to.incidenceType.id}"
						rendered="#{controllerAlias.new}">
						<f:selectItems value="#{GBPCollections.incidenceTypes}" />
					</aon:selectOneMenu>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_incidence_description}" />
			</f:facet>
			<aon:outputText value="#{to.description}" rendered="#{to!=controllerAlias.to}" />
			<aon:inputText value="#{to.description}"
				rendered="#{to==controllerAlias.to}" size="40" maxlength="64" />
			<f:facet name="footer">
				<aon:div>
					<aon:inputText value="#{controllerAlias.to.description}"
						rendered="#{controllerAlias.new}" size="40" maxlength="64" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_incidence_detail}" />
			</f:facet>
			<aon:outputText value="#{to.shortDetail}" rendered="#{to!=controllerAlias.to}" />
			<aon:inputTextarea value="#{to.detail}"
				rendered="#{to==controllerAlias.to}" cols="50" rows="5" />
			<f:facet name="footer">
				<aon:div>
					<aon:inputTextarea value="#{controllerAlias.to.detail}"
						rendered="#{controllerAlias.new}" cols="50" rows="5" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<f:verbatim rendered="#{to!=controllerAlias.to}">&#160;</f:verbatim>
			<aon:div rendered="#{to==controllerAlias.to}">
				<aon:commandButton id="lineAccept" title="[#{bundle.aon_accept}]"
					styleClass="aon-editDataTable-button aon-icon-accept"
					reRender="#{dataTable},#{parentGrid}"
					actionListener="#{controllerAlias.onAccept}" />
				<aon:commandButton id="lineCancel" title="[#{bundle.aon_cancel}]"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					reRender="#{dataTable}" immediate="true"
					actionListener="#{controllerAlias.onCancel}" />
				<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
					styleClass="aon-editDataTable-button aon-icon-delete"
					reRender="#{dataTable},#{parentGrid}" immediate="true"
					actionListener="#{controllerAlias.onRemove}" />
			</aon:div>
			<f:facet name="footer">
				<aon:div rendered="#{controllerAlias.new}">
					<f:verbatim rendered="#{!controllerAlias.new}">&#160;</f:verbatim>
					<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
						styleClass="aon-editDataTable-button aon-icon-accept"
						reRender="#{dataTable},#{parentGrid}"
						actionListener="#{controllerAlias.onAccept}" />
					<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						reRender="#{dataTable},#{parentGrid}" immediate="true"
						actionListener="#{controllerAlias.onCancel}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</h:dataTable>

	<aon:dataScroller dataTable="#{dataTable}" model="#{controllerAlias.model}" />

</ui:composition>

</body>
</html>
