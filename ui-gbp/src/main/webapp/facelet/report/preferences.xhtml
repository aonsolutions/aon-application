<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.formWindow.xhtml">

	<ui:define name="content">

		<aon:form id="preferencesForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.gbp_report}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandButton id="accept" value="#{bundle.aon_accept}"
							action="#{report.onExecute}" onclick="viewDialog.show();"
							styleClass="aon-finding-toolbar-item aon-icon-printer"
							accesskey="#{bundle.aon_key_accept}" />
						<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
							action="#{report.onCancel}"
							onclick="window.close();return false;"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="frontProofGrid" columns="2" dir="true">

					<h:outputLabel for="outputFormat"
						value="#{bundle.aon_output_format}"
						styleClass="aon-form-input-text-label" />
					<h:selectOneMenu id="outputFormat" value="#{report.outputFormat}"
						styleClass="aon-form-selectOneMenu-field">
						<f:selectItems value="#{report.outputFormats}" />
					</h:selectOneMenu>

				</aon:panelGrid>
				
				<t:inputText id="reportKey" value="#{report.reportKey}" size="18"
					forceId="#{true}" style="display:none"
					styleClass="aon-form-input-text" />
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
