<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="bankForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_bank}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{bundle.aon_editing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{bank.to!=null or bank.new}"
							reRender="gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{bank.accept}"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{bank.to!=null or bank.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}" action="bank_list"
							actionListener="#{bank.onCancel}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!bank.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{bank.onRemove}"
							confirmAction="bank_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" 
							reRender="gridToolbar,bankGrid" value="#{bundle.aon_reset}"
							actionListener="#{bank.onReset}" rendered="#{!bank.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="bankGrid" columns="2" dir="true">

					<aon:outputLabel for="Bank_name"
						value="#{appBundle.gbp_bank_name}" />
					<aon:inputText id="Bank_name" required="true" size="64"
						maxlength="64" value="#{bank.to.name}" />

					<aon:outputLabel for="Bank_document"
						value="#{appBundle.gbp_bank_document}" />
					<aon:inputText id="Bank_document" required="true" size="10"
						maxlength="9" value="#{bank.to.document}" />

					<aon:outputLabel for="Bank_address"
						value="#{appBundle.gbp_bank_address}" />
					<aon:inputText id="Bank_address" size="128"
						maxlength="128" value="#{bank.to.address}" />

					<aon:outputLabel for="Bank_registralData"
						value="#{appBundle.gbp_bank_registralData}" />
					<aon:inputTextarea id="Bank_registralData"
						cols="90" rows="10" 
						value="#{bank.to.registralData}"/>

					<aon:outputLabel for="Bank_web"
						value="#{appBundle.gbp_bank_web}" />
					<aon:inputText id="Bank_web" size="128"
						maxlength="128" value="#{bank.to.web}" />

				</aon:panelGrid>

			</aon:div>	
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
