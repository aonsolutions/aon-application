<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="offerList">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid columns="3" dir="true" 
			columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{menuBundle.gbp_offer}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.gbp_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						action="offer_search" actionListener="#{offer.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}"/>
					<t:commandButton id="offers" value="#{appBundle.gbp_print}"
						immediate="true" forceId="true" 
						onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.jsf');return false;"
						styleClass="aon-finding-toolbar-item aon-icon-printer"
						accesskey="#{bundle.aon_key_print}" />
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">					
			<aon:dataTable id="offerDataList" 
				value="#{offer.model}" var="to" rows="20"
				columnClasses="aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left,
							   aon-width-auto aon-text-right,
							   aon-width-auto aon-text-left">
							   
					<aon:rowSelector action="offer_form" actionListener="#{offer.onSelect}" />
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_offer_campaign_code}" />
						</f:facet>
						<aon:outputText value="#{to.campaign.code} #{to.campaign.name}"/>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-iconColumn">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_offer_signature_signatures}" />
						</f:facet>
						<aon:div style="display:inline;cursor:pointer;">
							<aon:graphicImage url="/css/richCss/images/aon-icon/aon-task-comment.gif" />
		                    <rich:toolTip direction="top-right" mode="ajax" hideDelay="1000"
		                        styleClass="tooltip" layout="block">
								<aon:outputText value="#{offerSignature.signatures}" />
		                    </rich:toolTip>
						</aon:div>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_offer_supplier}" />
						</f:facet>
						<aon:outputText value="#{to.supplier.name}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_offer_offer_date}" />
						</f:facet>
						<aon:outputText value="#{to.offerDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>						
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_offer_price}" />
						</f:facet>
						<aon:outputText value="#{to.price}">
							<f:convertNumber pattern="#,##0.000" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_offer_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}"/>
					</aon:column>

				</aon:dataTable>
						
				<aon:dataScroller dataTable="offerDataList"
					model="#{offer.model}" showNote="true" />					
				
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
