<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="supplierForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_supplier}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.gbp_searching}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							action="supplier_list"
							actionListener="#{supplier.onCancel}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="supplier_list"
							actionListener="#{supplier.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" 
							value="#{bundle.aon_reset}" action="supplier_form"
							actionListener="#{supplier.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="Supplier_document"
						value="#{appBundle.gbp_supplier_document}" />
					<aon:inputText id="Supplier_document"
						size="16" maxlenght="16"
						valueChangeListener="#{supplier.addExpression}" />

					<aon:outputLabel for="Supplier_name"
						value="#{appBundle.gbp_supplier_name}" />
					<aon:inputText id="Supplier_name"
						size="64" maxlength="64"
						valueChangeListener="#{supplier.addExpression}" />

					<aon:outputLabel for="Supplier_city"
						value="#{appBundle.gbp_supplier_city}" />
					<aon:inputText id="Supplier_city" 
						size="64" maxlength="64"
						valueChangeListener="#{supplier.addExpression}" />
						
					<aon:outputLabel for="Supplier_geozone_id"
						value="#{appBundle.gbp_supplier_geozone}" />
					<aon:selectOneMenu id="Supplier_geozone_id"
						valueChangeListener="#{supplier.addExpression}" >
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{GBPCollections.geozones}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Supplier_supplierType_id"
						value="#{appBundle.gbp_supplier_supplierType}" />
					<aon:selectOneMenu id="Supplier_supplierType_id"
						valueChangeListener="#{supplier.addExpression}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{GBPCollections.supplierTypes}" />
					</aon:selectOneMenu>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
