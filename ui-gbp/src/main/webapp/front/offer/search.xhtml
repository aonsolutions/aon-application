<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/front/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="frontOfferForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_front_offer}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.gbp_searching}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							action="front_offer_list"
							actionListener="#{frontOffer.onCancel}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="front_offer_list"
							actionListener="#{frontOffer.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset"
							value="#{bundle.aon_reset}" rendered="#{!frontOffer.new}" 
							actionListener="#{frontOffer.onReset}"
							action="front_offer_form"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="Offer_campaign_code"
						value="#{appBundle.gbp_offer_campaign_code}" />
					<aon:inputText id="Offer_campaign_code"
						size="16" maxlenght="16"
						valueChangeListener="#{frontOffer.addExpression}" />

					<aon:outputLabel for="Offer_offerDate"
						value="#{appBundle.gbp_proforma_invoice_invoice_date}" />
					<aon:div>
						<aon:outputLabel for="Offer_offerDate_from"
							value="#{appBundle.gbp_from}" />
						<aon:selectInputDate id="Offer_offerDate_from"
							valueChangeListener="#{frontOffer.addFromDateExpression}"
							datePattern="#{bundle.aon_date_pattern}"
							enableManualInput="true" inputSize="15" />
						<aon:outputLabel for="Offer_offerDate_to"
							value="#{appBundle.gbp_to}" />
						<aon:selectInputDate id="Offer_offerDate_to"
							valueChangeListener="#{frontOffer.addToDateExpression}"
							datePattern="#{bundle.aon_date_pattern}"
							enableManualInput="true" inputSize="15" />
					</aon:div>

					<aon:outputLabel for="Offer_status"
						value="#{appBundle.gbp_offer_status}" />
					<aon:selectOneMenu id="Offer_status"
						converter="offerStatusConverter"
						valueChangeListener="#{frontOffer.addStatusExpression}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{GBPCollections.offerStatus}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
