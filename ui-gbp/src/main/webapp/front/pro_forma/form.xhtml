<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/front/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="frontProFormaForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_front_pro_forma}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{bundle.aon_editing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:confirmButton id="save" value="#{bundle.aon_save}"
							rendered="#{frontProForma.to!=null or frontProForma.new}"
							reRender="gridToolbar,frontProFormaGrid" 
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_save_confirm}"
							confirmActionListener="#{frontProForma.accept}"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{frontProForma.to!=null or frontProForma.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{frontProForma.onCancel}"
							confirmAction="front_pro_forma_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="discard" value="#{appBundle.gbp_discard}"
							rendered="#{!frontProForma.new and !frontProForma.discarded}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{appBundle.gbp_discard_confirm}"
							confirmActionListener="#{frontProForma.onDiscard}"
							confirmAction="front_pro_forma_list"/>
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="front_pro_forma_search"
							actionListener="#{frontProForma.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" reRender="gridToolbar,frontProFormaGrid,frontProFormaTab"
							value="#{bundle.aon_reset}" actionListener="#{frontProForma.onReset}"
							rendered="#{!frontProForma.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="frontProFormaGrid" columns="2" dir="true">

					<aon:outputLabel for="ProFormaInvoice_campaign_code"
						value="#{appBundle.gbp_proforma_invoice_campaign_code}" />
					<aon:selectOneMenu id="ProFormaInvoice_campaign_code-New"
						required="true" rendered="#{frontProForma.new}"
						value="#{frontProForma.to.campaign.id}"
						valueChangeListener="#{frontProForma.campaignChanged}">
						<f:selectItems value="#{FrontGBPCollections.pendingCampaigns}" />
					</aon:selectOneMenu>
					<aon:inputText id="ProFormaInvoice_campaign_code"
						rendered="#{!frontProForma.new}" size="16"
						disabled="true" styleClass="aon-inputText-disabled"
						maxlength="16" value="#{frontProForma.to.campaign.code}" />

					<aon:outputLabel for="ProFormaInvoice_number"
						value="#{appBundle.gbp_proforma_invoice_number}" />
					<aon:inputText id="ProFormaInvoice_number" 
						size="16" maxlength="16"
						value="#{frontProForma.to.number}" />

					<aon:outputLabel for="ProFormaInvoice_invoiceDate"
						rendered="#{!frontProForma.new}"
						value="#{appBundle.gbp_proforma_invoice_invoice_date}" />
					<aon:inputText id="ProFormaInvoice_invoiceDate" 
						size="16" maxlength="16" rendered="#{!frontProForma.new}"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{frontProForma.to.invoiceDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:inputText>	

					<aon:outputLabel for="ProFormaInvoice_amount"
						value="#{appBundle.gbp_proforma_invoice_amount}" />
					<aon:inputText id="ProFormaInvoice_amount" 
						size="16" maxlength="16"
						value="#{frontProForma.to.amount}" />

					<aon:outputLabel for="ProFormaInvoice_status"
						rendered="#{!frontProForma.new}"
						value="#{appBundle.gbp_proforma_invoice_status}" />
					<aon:selectOneMenu id="ProFormaInvoice_status" rendered="#{!frontProForma.new}"
						value="#{frontProForma.to.status}" disabled="true">
						<f:selectItems value="#{GBPCollections.proformaInvoiceStatus}" />
					</aon:selectOneMenu>

				</aon:panelGrid>

				<aon:div id="frontProFormaTab" rendered="#{frontProFormaIncidence.model.rowCount > 0}">
					<aon:panelTabSet>

						<aon:panelTab id="incidences" label="#{appBundle.gbp_incidences}">
							<ui:include src="/front/incidence/grid.xhtml">
								<ui:param name="controllerAlias" value="#{frontProFormaIncidence}" />
								<ui:param name="dataTable" value="frontProFormaIncidenceDataTable" />
								<ui:param name="parentGrid" value="frontProFormaGrid" />
							</ui:include>
						</aon:panelTab>

					</aon:panelTabSet>
				</aon:div>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
