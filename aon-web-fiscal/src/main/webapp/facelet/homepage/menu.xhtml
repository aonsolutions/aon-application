<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/com/code/aon/ui/audit/facelet/shared/menu.xhtml">

	<ui:define name="menuContent">
		<c:if test="#{aonRole.financeOperator}">
			<aon:commandLink id="management"
				value="#{appBundle.menu_management}"
				action="menu_management" immediate="true"
				styleClass="aon-top-menu-item aon-icon-prices" />
		</c:if>
		<c:if test="#{aonRole.accountingOperator}">
			<aon:commandLink id="accounting"
				value="#{appBundle.menu_accounting}"
				action="menu_accounting" immediate="true"
				styleClass="aon-top-menu-item aon-icon-accounting" />
			<aon:commandLink id="fiscal"
				value="#{appBundle.menu_fiscal}"
				action="menu_fiscal" immediate="true"
				styleClass="aon-top-menu-item aon-icon-treasury" />
		</c:if>
		<c:if test="#{aonRole.config}">
			<aon:commandLink id="config"
				value="#{bundle.aon_configuration}"
				action="menu_config" immediate="true"
				styleClass="aon-top-menu-item aon-icon-config" />
		</c:if>
	</ui:define>
 </ui:composition>
