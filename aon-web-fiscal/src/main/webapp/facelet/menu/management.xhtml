<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="managementMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>

						<aon:panelGrid id="group_management_holder"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-customer aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_holder}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="customer"
										action="customer_search" actionListener="#{customer.onEditSearch}"
										value="#{customerBundle.customer_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="supplier" 
										action="supplier_search" actionListener="#{supplier.onEditSearch}"
										value="#{supplierBundle.supplier_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="creditor" 
										action="creditor_search" actionListener="#{creditor.onEditSearch}"
										value="#{financeBundle.finance_creditor_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_management_invoices"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-invoice aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_invoices}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="saleInvoiceManagement"
										action="saleInvoice_search" actionListener="#{saleInvoice.onEditSearch}"
										value="#{financeBundle.finance_sale_invoice_management_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="purchaseInvoiceManagement"
										action="purchaseInvoice_search"	actionListener="#{purchaseInvoice.onEditSearch}"
										value="#{financeBundle.finance_purchase_invoice_management_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="expenseInvoiceManagement"
										action="expenseInvoice_search" actionListener="#{expenseInvoice.onEditSearch}"
										value="#{financeBundle.finance_expense_invoice_management_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="undeductibleInvoiceManagement"
										action="undeductibleInvoice_search" actionListener="#{undeductibleInvoice.onEditSearch}"
										value="#{financeBundle.finance_undeductible_invoice_management_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="rectifiedInvoiceManagement"
										action="rectifiedInvoice_search" actionListener="#{rectifiedInvoice.onReset}"
										value="#{financeBundle.finance_special_rectified_invoice_module}" />
								</aon:div>
								
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_management_treasury"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-treasury aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_treasury}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="aon_finance_charge" 
										action="finance_search-Charge" actionListener="#{finance.onEditSearchCharge}"
										value="#{financeBundle.finance_charge_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="fbatchCharge" 
										action="fbatch_search-Charge"
										actionListener="#{fbatch.onEditSearchCharge}"
										value="#{financeBundle.finance_fbatch_charge_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="financePayment-purchase"
										action="finance_search-Payment" actionListener="#{finance.onEditSearchPayment}"
										value="#{financeBundle.finance_payment_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="fbatchPayment" 
										action="fbatch_search-Payment"
										actionListener="#{fbatch.onEditSearchPayment}"
										value="#{financeBundle.finance_fbatch_payment_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

					</aon:panelGroup>

					<aon:panelGroup>

						<c:if test="#{aonRole.config}">
							<aon:panelGrid id="group_general_management"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_general}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseItem" 
											action="item_search-Purchase" actionListener="#{item.onEditSearch}"
											value="#{productBundle.product_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseItem" 
											action="expenseItem" 
											value="#{productBundle.product_expense_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="productCategory-management" 
											action="productCategory"
											value="#{productBundle.product_category_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="geotreeParent-management" 
											action="geotreeParent_list"	actionListener="#{geotreeParent.onSearch}"
											value="#{geozoneBundle.geozone_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="payMethod-management" 
											action="payMethod"
											value="#{configBundle.config_paymethod_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="bank-management" 
											action="bank"
											value="#{configBundle.config_bank_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>

						<aon:panelGrid id="group_management_bank_statement"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-statement aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{financeBundle.finance_statement_menu}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="bankConcept"
										action="bankConcept" 
										value="#{financeBundle.finance_bank_concept_module}" />
								</aon:div>							
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="bankStatement"
										value="#{financeBundle.finance_bank_statement_module}"
										rendered="#{bankStatement.availableRegistryBanks > 0}"
										actionListener="#{bankStatement.onEditSearch}"
										action="bankStatement_search" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_management_forecast"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-forecast aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{financeBundle.finance_forecast_menu}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="cashFlowForecast"
										value="#{financeBundle.finance_cashflow_forecast_module}"
										rendered="#{cashFlowForecast.availableRegistryBanks > 0}"
										actionListener="#{cashFlowForecast.onEditSearch}"
										action="cashFlowForecast_search" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="cashFlowForecastReport"
										value="#{financeBundle.finance_cashflow_forecast_report_module}"
										rendered="#{cashFlowForecast.availableRegistryBanks > 0}"
										actionListener="#{cashFlowForecastReport.onEditSearch}"
										action="cashFlowForecastReport_search" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

					</aon:panelGroup>
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
