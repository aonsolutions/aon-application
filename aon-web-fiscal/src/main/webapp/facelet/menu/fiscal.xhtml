<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="fiscalMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid columns="2" styleClass="aon-width-all" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>

						<aon:panelGrid id="group_fiscal_tax_statement"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-product aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{fiscalBundle.fiscal_tax_statement}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="vatTax" 
										action="vatTax_search" actionListener="#{vatTax.onEditSearch}"
										value="#{fiscalBundle.fiscal_vat_tax_module}" />
								</aon:div>
	
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="renting" 
										action="renting_search" actionListener="#{renting.onEditSearch}"
										value="#{fiscalBundle.fiscal_renting_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
	
						<aon:panelGrid id="group_fiscal_information_statement"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-product aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{fiscalBundle.fiscal_information_statement}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="mod347_report" 
										action="mod347_list" actionListener="#{mod347.onEditSearch}"
										value="#{fiscalBundle.fiscal_mod347_module}" />
								</aon:div>
	
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="mod_340_report" 
										action="model340_search" actionListener="#{model340.onReset}"
										value="#{fiscalBundle.fiscal_model_340_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_fiscal_reports"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-payroll aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{accountingBundle.menu_reports_annual}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="report_template"
										action="reportAttach_form"
										actionListener="#{reportAttach.onSearch}"
										value="#{accountingBundle.accounting_reports_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="report_launcher"
										action="reports_launcher"
										actionListener="#{reportsLauncher.onReset}"
										value="#{accountingBundle.accounting_reports_launcher_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_fiscal_mercantile_registry"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-transfer aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{fiscalBundle.fiscal_mercantile_registry}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accountingBook_report"
										action="accountingBook_search"
										actionListener="#{accountingBook.onReset}"
										value="#{accountingBundle.accounting_book_module}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accountDeposit_report"
										onclick="alert('Opción no disponible  en esta versión.');"
										value="#{fiscalBundle.fiscal_account_deposit_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>


						<aon:panelGrid id="group_fiscal_accounting_entry_generation"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-account-entry aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{fiscalBundle.fiscal_accounting_entry_generation}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="saleInvoiceRecorder"
										value="#{financeBundle.finance_sale_invoice_recording_module}"
										actionListener="#{saleInvoiceRecorder.onEditSearch}"
										action="saleInvoiceRecorder_search" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="purchaseInvoiceRecorder"
										value="#{financeBundle.finance_purchase_invoice_recording_module}"
										actionListener="#{purchaseInvoiceRecorder.onEditSearch}"
										action="purchaseInvoiceRecorder_search" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="expenseInvoiceRecorder"
										value="#{financeBundle.finance_expense_invoice_recording_module}"
										actionListener="#{expenseInvoiceRecorder.onEditSearch}"
										action="expenseInvoiceRecorder_search" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="undeductibleInvoiceRecorder"
										value="#{financeBundle.finance_undeductible_invoice_recording_module}"
										actionListener="#{undeductibleInvoiceRecorder.onEditSearch}"
										action="undeductibleInvoiceRecorder_search" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

					</aon:panelGroup>
					
					<aon:panelGroup>
						
						<aon:panelGrid id="group_fiscal_configuration"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-config aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_configuration}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accPeriod" action="accPeriod"
										actionListener="#{accPeriod.onSearch}"
										value="#{accountingBundle.accounting_period_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="defaultParams" action="defaultParams"
										actionListener="#{accAppParams.onLoad}"
										value="#{accountingBundle.accounting_default_params_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="fiscalParams" action="fiscalParams"
										actionListener="#{fiscalParams.onLoad}"
										value="#{fiscalBundle.fiscal_parameters_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_fiscal_utilities"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-utilities aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_utilities}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accountManager"
										action="accountManager_list"
										value="#{accountBridgeBundle.account_relationships_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accountChange"
										action="accountChange_form"
										actionListener="#{accountChange.onReset}"
										value="#{accountingBundle.accounting_change_account}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="regenerateAccount"
										action="regenerateAccount"
										value="#{accountingBundle.accounting_regenerate_account_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="regenerateVat"
										action="regenerateVat" actionListener="#{vatRegenerator.onEditSearch}"
										value="#{accountingBundle.accounting_regenerate_vat_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accountCheck" action="check_form"
										actionListener="#{accountCheck.onInitialize}"
										value="#{accountingBundle.accounting_check_balance_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="customerAccountChecker"
										action="customerAccountChecker_search"
										actionListener="#{customerAccountChecker.onEditSearch}"
										value="#{accountBridgeBundle.account_customer_checker_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="supplierAccountChecker"
										action="supplierAccountChecker_search"
										actionListener="#{supplierAccountChecker.onEditSearch}"
										value="#{accountBridgeBundle.account_supplier_checker_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="creditorAccountChecker"
										action="creditorAccountChecker_search"
										actionListener="#{creditorAccountChecker.onEditSearch}"
										value="#{accountBridgeBundle.account_creditor_checker_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="invoiceIntegrity"
										action="invoiceIntegrity_search"
										actionListener="#{invoiceIntegrity.onStart}"
										value="#{financeBundle.finance_invoice_integrity_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_data_sync"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-refresh aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{fiscalBundle.fiscal_data_sync}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="account_exporter"
										action="account_exporter"
										value="#{accountBundle.account_exporter_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="account_importer"
										action="account_importer"
										actionListener="#{accountImporter.onInitialize}"
										value="#{accountBundle.account_importer_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="balance_exporter"
										action="balance_exporter"
										value="#{accountingBundle.accounting_balance_exporter_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="balance_importer"
										action="balance_importer"
										actionListener="#{balanceImporter.onInitialize}"
										value="#{accountingBundle.accounting_balance_importer_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="amortization_exporter"
										action="amortization_exporter"
										value="#{accountingBundle.accounting_amortizationType_exporter_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="amortization_importer"
										action="amortization_importer"
										actionListener="#{amortizationTypeImporter.onInitialize}"
										value="#{accountingBundle.accounting_amortizationType_importer_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

					</aon:panelGroup>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
