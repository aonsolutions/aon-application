<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="fiscalMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid columns="2" styleClass="aon-width-all" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">


					<aon:panelGrid id="group_fiscal_vat"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-product aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_vat}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="fiscal_vat_report" 
									action="vat_report_search" actionListener="#{vatReport.onReset}"
									value="#{financeBundle.finance_vat_report_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="mod_347_report" 
									action="model347_search" actionListener="#{model347.onReset}"
									value="#{fiscalBundle.fiscal_model_347_module}" />
							</aon:div>

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="mod_340_report" 
									action="model340_search" actionListener="#{model340.onReset}"
									value="#{fiscalBundle.fiscal_model_340_module}" />
							</aon:div>

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="vatTax" 
									action="vatTax_search" actionListener="#{vatTax.onEditSearch}"
									value="#{fiscalBundle.fiscal_vat_tax_module}" />
							</aon:div>
							
						</aon:div>
					</aon:panelGrid>

					<aon:panelGrid id="group_fiscal_retention"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-product aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_retention}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">

								<aon:commandLink id="renting" 
									action="renting_search" actionListener="#{renting.onEditSearch}"
									value="#{fiscalBundle.fiscal_renting_module}" />

							</aon:div>
						</aon:div>
					</aon:panelGrid>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
