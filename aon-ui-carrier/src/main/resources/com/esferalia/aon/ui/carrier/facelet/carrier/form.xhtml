<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="carrierForm">
			
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.carrier_carrier_module}" />
				<ui:param name="controller" value="#{carrier}" />
			</ui:include>
			
			<aon:div styleClass="aon-scroll-area">

					<aon:panelGrid id="dataTable" columns="4" styleClass="aon-width-all"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto,
							aon-panelGrid-odd aon-width-120,
							aon-panelGrid-even aon-width-auto">
	
						<ui:include src="/com/code/aon/ui/registry/facelet/registry/formContent.xhtml" >
							<ui:param name="controller" value="#{carrier}" />
							<ui:param name="includeRegistryScope" value="#{true}"/>
						</ui:include>
					</aon:panelGrid>

				<aon:if test="#{!carrier.nevv}">
					<aon:panelTabSet id="carrierTabs" >
						<aon:panelTab id="address" label="#{bundle.registry_address_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{carrierAddress}" />
							</ui:include>
						</aon:panelTab>
	
						<aon:panelTab id="media" label="#{bundle.aon_contacts}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{carrierMedia}" />
							</ui:include>
						</aon:panelTab>
	
						<aon:panelTab id="finance" label="#{bundle.registry_finance_data_module}">
							<aon:panel>
								<f:facet name="header">
									<aon:outputText	value="#{bundle.registry_banks_module}" />
								</f:facet>
								<ui:include
									src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
									<ui:param name="controller" value="#{carrierRbank}" />
								</ui:include>
							</aon:panel>
							<aon:panel>
								<f:facet name="header">
									<aon:outputText	value="#{bundle.config_predef_paymethod}" />
								</f:facet>
								<ui:include
									src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
									<ui:param name="controller" value="#{carrierRPayMethod}" />
								</ui:include>
							</aon:panel>
						</aon:panelTab>
						
					</aon:panelTabSet>
				</aon:if>
				
			</aon:div>
			
		</aon:form>
		
 	</ui:define>
</ui:composition>
