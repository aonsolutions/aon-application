<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="carrierList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.carrier_carrier_module}" />
				<ui:param name="controller" value="#{carrier}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="carrierReport-excel-report" value="&#160;" 
						target="_new" rendered="#{!carrier.nevv}"
						action="#{report.onExecute}"
						disabled="#{carrier.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="carrierReport" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="carrierReport-report" value="#{bundle.aon_listing}"
						target="_new" rendered="#{!carrier.nevv}"
						action="#{report.onExecute}"
						disabled="#{carrier.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="carrierReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="carrierDetailExcelReport-excel-report" 
						value="#{bundle.aon_detailed_listing}" 
						target="_new" rendered="#{!carrier.nevv}"
						actionListener="#{carrier.onDetailReport}"
						disabled="#{carrier.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
					</aon:htmlCommandLink>
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{carrier}" />
					
					<ui:define name="columns">
					
						<aon:column alias="Carrier.id"
							styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>
					
						<aon:column alias="Carrier.registry.document"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_document}" />
							</f:facet>
							<aon:outputText value="#{to.registry.document}" />
						</aon:column>
					
						<aon:column alias="Carrier.registry.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_name}" />
							</f:facet>
							<aon:div styleClass="aon-nowrap">
								<aon:outputText value="#{to.registry.fullName}"/>
							</aon:div>
						</aon:column>
					
						<aon:column alias="Carrier.alias"
							styleClass="aon-editDataTable-textColumn" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_alias}" />
							</f:facet>
							<aon:outputText value="#{to.registry.alias}" />
						</aon:column>
						
						<!--  
						<aon:column alias="Carrier.status"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
						-->
						
					</ui:define>
				</ui:decorate>

			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
