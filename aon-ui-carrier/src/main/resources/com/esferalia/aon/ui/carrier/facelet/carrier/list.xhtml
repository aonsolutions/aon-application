<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="carrierList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{carrierBundle.carrier_carrier_module}" />
				<ui:param name="controller" value="#{carrier}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{carrier}" />
					
					<ui:define name="columns">
					
						<aon:column alias="Carrier.id"
							styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>
					
						<aon:column alias="Carrier.registry.document"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_document}" />
							</f:facet>
							<aon:outputText value="#{to.registry.document}" />
						</aon:column>
					
						<aon:column alias="Carrier.registry.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_name}" />
							</f:facet>
							<aon:div styleClass="aon-nowrap">
								<aon:outputText value="#{to.registry.fullName}"/>
							</aon:div>
						</aon:column>
					
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-120"
							alias="Carrier.name">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_name}" />
							</f:facet>
							<aon:outputText value="#{to.registry.name}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-120"
							alias="Carrier.alias">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_alias}" />
							</f:facet>
							<aon:outputText value="#{to.registry.alias}" />
						</aon:column>
						
					</ui:define>
				</ui:decorate>

			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
