<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="carrierSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.carrier_carrier_module}" />
				<ui:param name="controller" value="#{carrier}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{carrier}" />
				<ui:define name="searchContent">
				
					<aon:outputText value="" />
					<aon:div styleClass="aon-search-content-width">
					
						<aon:panelCollapsible expanded="true" label="#{bundle.warehouse_delivery_carrier}">
							<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
								<ui:include src="/com/code/aon/ui/registry/facelet/registry/searchContent.xhtml">
									<ui:param name="controller" value="#{carrier}" />
									<ui:param name="searchController" value="#{carrierSearch}" />
									<ui:param name="includeRegistryScope" value="#{true}"/>
								</ui:include>
							</aon:panelGrid>
						</aon:panelCollapsible>					
									
						<aon:panelCollapsible expanded="false" label="#{bundle.registry_address_module}" >
							<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
								<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml">
									<ui:param name="controller" value="#{carrier}" />
									<ui:param name="searchController" value="#{carrierSearch}" />
								</ui:include>
							</aon:panelGrid>
						</aon:panelCollapsible>
				
						<aon:panelCollapsible expanded="false" label="#{bundle.aon_contacts}" >
							<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
								<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml">
									<ui:param name="controller" value="#{carrier}" />
									<ui:param name="searchController" value="#{carrierSearch}" />
								</ui:include>
							</aon:panelGrid>
						</aon:panelCollapsible>
					</aon:div>
						
				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>
</ui:composition>
