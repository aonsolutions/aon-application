<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salaryForm">
			<aon:methodParam name="saveActionListener" value="#{enterpriseDocument.masiveUpload}" type="actionListener" />
			<aon:methodParam name="cancelAction" value="home" />		
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.document_massive_upload}" />
				<ui:param name="controller" value="#{enterpriseDocument}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">
				
					<aon:outputLabel for="EDocument_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="EDocument_name" required="true"
						value="#{enterpriseDocument.to.name}" maxlength="64" size="45" />
 
					<aon:outputLabel for="EDocument_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="EDocument_description" required="true"
						value="#{enterpriseDocument.to.description}" maxlength="128" size="45" />

					<aon:outputLabel for="EDocument_categories"
						value="#{registryBundle.registry_category}" />
					<aon:selectManyCheckbox id="EDocument_categories"
						value="#{enterpriseDocument.to.categories}">
						<f:selectItems value="#{enterpriseDocument.categories}"/>
					</aon:selectManyCheckbox>		
					
					<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{enterpriseDocument.enterprise}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<ui:param name="idRequired" value="#{true}" />
						<aon:methodParam name="lookupChangeListener" 
							value="#{enterpriseDocument.onEnterpriseChanged}" type="lookupChangeListener" />
					</ui:include>
					
					<aon:outputLabel for="EDocument_file"
						value="#{bundle.aon_fileupload_element}" />
					<aon:div id="EDocument_attachFile">
						<a4j:region>
							<aon:fileUpload id="EDocument_file"
								fileUploadListener="#{enterpriseDocument.fileUploaded}" >
								<f:facet name="label">
									<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
								</f:facet>																										
								<a4j:support event="onuploadcomplete"
									reRender="EDocument_attachFile,EDocument_name" />
								<a4j:support event="onupload"
									oncomplete="showFileUploadProgress();" />
								<a4j:support event="onclear"
									oncomplete="hideFileUploadProgress();" />
							</aon:fileUpload>
							<rich:jQuery name="showFileUploadProgress" timing="onJScall"
								selector="#EDocument_file .rich-fileupload-list-overflow" query="height(70);" />
							<rich:jQuery name="hideFileUploadProgress" timing="onJScall"
								selector="#EDocument_file .rich-fileupload-list-overflow" query="height(0);" />							
						</a4j:region>
					</aon:div>

				</aon:panelGrid>
			
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
