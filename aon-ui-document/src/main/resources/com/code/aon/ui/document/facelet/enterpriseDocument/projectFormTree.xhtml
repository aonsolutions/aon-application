<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/document/facelet/enterpriseTree/treeTemplate.xhtml">

	<ui:define name="header">
		<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{projectBundle.project_projects}" />
			<ui:param name="toolbarDescription" value="&#160;" />
		</ui:include>
	</ui:define>

	<ui:define name="content">
		<aon:div styleClass="aon-scroll-area">
			<aon:panelGrid columns="2" >
		
					<aon:outputText value="#{bundle.aon_id}" />
					<aon:outputText value="#{project.to.id}" />
		
					<aon:outputText value="#{bundle.aon_active}" />
					<aon:outputText value="&#160;" style="background-position: 5px 2px;"
						styleClass="#{(project.to.active)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'} aon-padding-bottom" />

					<aon:outputText value="#{bundle.aon_name}" />
					<aon:outputText value="#{project.to.name}" />

					<aon:outputText value="#{bundle.aon_alias}" />
					<aon:outputText value="#{project.to.alias}" />

					<aon:outputText value="#{bundle.aon_date}" />
					<aon:outputText value="#{project.to.date}">
						<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>

					<aon:outputText value="#{projectBundle.project_assigned}" />
					<aon:outputText value="#{project.to.registry.fullName}" />

					<c:if test="#{(project.to.projectType != null) and (project.to.projectType.id != null)}">
						<aon:outputText value="#{projectBundle.project_project_type}" />
						<aon:outputText value="#{project.to.projectType.description}" />
					</c:if>
		
			</aon:panelGrid>
	
		</aon:div>
	</ui:define>
	
</ui:composition>
