<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="enterpriseDocumentList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_documents}" />
				<ui:param name="controller" value="#{enterpriseDocument}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:decorate>

		<aon:div styleClass="aon-scroll-area">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
				<ui:param name="controller" value="#{enterpriseDocument}" />
				<ui:define name="columns">
				
					<aon:column sortable="true" alias="cm:name"
						styleClass="aon-editDataTable-textColumn aon-width-200 aon-nowrap">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>
	 
					<aon:column sortable="true" alias="cm:description"
						styleClass="aon-editDataTable-textColumn aon-width-300 aon-nowrap">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}" />
					</aon:column>
	 
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-200 aon-nowrap">
						<f:facet name="header">
							<aon:outputText value="#{registryBundle.registry_category}" />
						</f:facet>
						<aon:outputText value="#{to.categoryList}" />
					</aon:column>

					<aon:column sortable="true" alias="cm:created"
						styleClass="aon-editDataTable-textColumn aon-width-120">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.created}">
							<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>		
				 
					<aon:column
						styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-nowrap aon-width-120">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_fileupload_element}" />
						</f:facet>
						<aon:htmlCommandLink id="download" target="_blank"
							onmouseover="disableRowSelector();" onmouseout="enableRowSelector();"
							actionListener="#{edcontroller.downloadAttachment}"
							styleClass="aon-icon aon-icon-mail-save"
							style="line-height:16px;margin-right:0;"
							title="#{bundle.aon_fileupload_download}">
							<f:param name="uuid" value="#{to.id.uuid}" />
							<f:param name="path" value="#{to.id.path}" />
							<aon:outputText value="&#160;" />
						</aon:htmlCommandLink>					
					</aon:column>

				</ui:define>
			</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
