<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:valueParam name="edcontroller" default="#{enterpriseDocument}"/>

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{enterpriseDocument}" />
		<ui:define name="columns">

			<aon:column sortable="#{sortColumns}" alias="#{edcontroller.pojoShortName}.name"
				styleClass="aon-editDataTable-textColumn aon-width-300 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="EDocument_name" value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.name}" rendered="#{formList}" />
				<aon:inputText id="EDocument_name" required="true"
					value="#{edcontroller.to.name}" maxlength="64"
					rendered="#{formEdit}" size="45" />
				<f:facet name="footer">
					<aon:inputText id="EDocument_name-New" required="true"
						value="#{edcontroller.to.name}" maxlength="64"
						rendered="#{formNew}" size="45" />
				</f:facet>
			</aon:column>
 
			<aon:column sortable="#{sortColumns}" alias="#{edcontroller.pojoShortName}.description"
				styleClass="aon-editDataTable-textColumn aon-width-300 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="EDocument_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{formList}" />
				<aon:inputText id="EDocument_description" required="true"
					value="#{edcontroller.to.description}" maxlength="128"
					rendered="#{formEdit}" size="45" />
				<f:facet name="footer">
					<aon:inputText id="EDocument_description-New" required="true"
						value="#{edcontroller.to.description}" maxlength="128"
						rendered="#{formNew}" size="45" />
				</f:facet>
			</aon:column>
 
			<aon:column sortable="#{sortColumns}" alias="#{edcontroller.pojoShortName}.created"
				styleClass="aon-editDataTable-textColumn aon-width-120">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.created}">
					<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>		
			 
			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-nowrap aon-width-120">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_fileupload_element}" />
				</f:facet>
				<aon:htmlCommandLink id="download" target="_blank"
					onmouseover="disableRowSelector();" onmouseout="enableRowSelector();"
					actionListener="#{edcontroller.downloadAttachment}"
					styleClass="aon-icon aon-icon-mail-save"
					style="line-height:16px;margin-right:0;"
					title="#{bundle.aon_fileupload_download}">
					<f:param name="uuid" value="#{to.id.uuid}" />
					<f:param name="path" value="#{to.id.path}" />
					<aon:outputText value="&#160;" />
				</aon:htmlCommandLink>					
				<f:facet name="footer">
					<aon:div id="EDocument_attachFileNew">
						<a4j:region>
							<aon:fileUpload rendered="#{formNew}"
								addControlLabel="#{bundle.aon_fileUpload_add}"
								stopControlLabel="#{bundle.aon_fileUpload_stop}"
								stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
								uploadControlLabel="#{bundle.aon_fileUpload_upload}"
								fileUploadListener="#{edcontroller.fileUploaded}"
								listWidth="110px" >
								<f:facet name="label">
									<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
								</f:facet>																										
								<a4j:support event="onuploadcomplete"
									reRender="EDocument_attachFileNew,EDocument_name-New" />
							</aon:fileUpload>
						</a4j:region>
					</aon:div>
				</f:facet>														
			</aon:column>

		</ui:define>

	</ui:decorate>

</ui:composition>
