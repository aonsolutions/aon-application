<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/document/facelet/enterpriseDocumentTree/treeTemplate.xhtml">

	<ui:define name="header">
		<aon:methodParam name="saveAction" value="enterpriseDocument_formTree" />
		<aon:methodParam name="cancelAction" value="enterprise_formTree" />
		<aon:methodParam name="removeAction" value="enterprise_formTree" />
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{documentBundle.document_document}" />
			<ui:param name="controller" value="#{enterpriseDocument}" />
			<ui:param name="skipBackButton" value="#{true}" />
			<ui:param name="skipResetButton" value="true" />
			<ui:param name="skipSearchButton" value="#{true}" />
			
			<ui:define name="beforeSpinToolbarContent">
				<aon:htmlCommandLink id="download"
					rendered="#{!formNew}" target="_blank"
					actionListener="#{enterpriseDocument.downloadAttachment}"
					styleClass="aon-finding-toolbar-item aon-icon-mail-save"
					value="#{bundle.aon_fileupload_download}"
					title="#{bundle.aon_fileupload_download}">
					<f:param name="uuid" value="#{enterpriseDocument.to.id.uuid}" />
					<f:param name="path" value="#{enterpriseDocument.to.id.path}" />
					<aon:outputText value="&#160;" />
				</aon:htmlCommandLink>	
				<aon:commandButton id="addBatch"
					value="#{documentBundle.document_add_batch}"
					immediate="true"
					reRender="enterpriseDocumentToolbar"
					rendered="#{manager.mainEnterprise and (!batchDocument.inBatch)}"
					actionListener="#{batchDocument.onAddToBatch}"
					styleClass="aon-finding-toolbar-item aon-icon-new" />			
			</ui:define>	
		</ui:decorate>	
	</ui:define>

	<ui:define name="content">
		<ui:include src="/com/code/aon/ui/document/facelet/enterpriseDocument/formContent.xhtml" />	
	</ui:define>
	
	<ui:define name="additionalContent">
		<aon:lookupButtonPopup lookup="#{projectLookup}" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />			
	</ui:define>
	
</ui:composition>
