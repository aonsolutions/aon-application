<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
	
	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{alfrescoCategory}" />
		<ui:define name="columns">
			<aon:column alias="cm:name"
				styleClass="aon-editDataTable-textColumn aon-width-250">
				<f:facet name="header">
					<aon:outputLabel for="AlfrescoCategory_name"
						value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.name}"
					rendered="#{formList}" />
				<aon:inputText id="AlfrescoCategory_name" required="true"
					rendered="#{formEdit}" size="32"
					value="#{controller.to.name}" maxlength="32" />
				<f:facet name="footer">
					<aon:inputText id="AlfrescoCategory_name-New" required="true"
						rendered="#{formNew}" size="32"
						value="#{controller.to.name}" maxlength="32" />
				</f:facet>
			</aon:column>
	
			<aon:column alias="cm:description"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="AlfrescoCategory_description"
						value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}"
					rendered="#{formList}" />
				<aon:inputText id="AlfrescoCategory_description"
					rendered="#{formEdit}" size="32"
					value="#{controller.to.description}" maxlength="64" />
				<f:facet name="footer">
					<aon:inputText id="AlfrescoCategory_description-New"
						rendered="#{formNew}" size="32"
						value="#{controller.to.description}" maxlength="64" />
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
