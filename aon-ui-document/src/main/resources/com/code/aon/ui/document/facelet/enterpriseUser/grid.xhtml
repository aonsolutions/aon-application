<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
		<aon:form id="enterpriseUserList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{documentBundle.document_users}" />
					<ui:param name="toolbarDescription" value="#{enterprise.to.registry.name}" />
					<ui:param name="controller" value="#{enterpriseUser}" />
					<ui:param name="skipResetButton" value="#{!manager.administrator}" />
					<ui:param name="skipRemoveButton" value="#{enterpriseUser.administrator}" />
					<ui:define name="additionalToolbarContent">
						<aon:commandButton id="back"
							title="#{bundle.aon_key_cancel_accelerator}"
							value="#{bundle.aon_back}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							action="enterprise_formTree" rendered="#{enterpriseUser.to == null}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="changePassword"
							value="#{documentBundle.document_change_password}"
							actionListener="#{enterpriseUser.onShowChangePasswordWindow}"
							reRender="showChangePasswordWindow"
							rendered="#{(!enterpriseUser.new) and (enterpriseUser.to != null)}"
							styleClass="aon-finding-toolbar-item aon-icon-utilities">
						</aon:commandButton>
					</ui:define>					
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{enterpriseUser}" />
						<ui:param name="skipLineEdition" value="#{!manager.administrator}" />
						<ui:param name="skipResetButton" value="#{!manager.administrator}" />
						<ui:param name="skipRemoveButton" value="#{true}" />
						<ui:define name="columns">
				
							<aon:column alias="EnterpriseUser.login"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="EnterpriseUser_login" value="#{bundle.aon_login_user}" />
								</f:facet>
								<aon:outputText value="#{to.login}" />
								<f:facet name="footer">
									<aon:inputText id="EnterpriseUser_login" rendered="#{formNew}"
										size="20" maxlength="16" required="true" 
										validator="#{enterpriseUser.idCheck}"
										value="#{controller.to.login}" />
								</f:facet>
							</aon:column>

							<aon:column alias="EnterpriseUser.name"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="EnterpriseUser_name" value="#{bundle.aon_name}" />
								</f:facet>
								<aon:outputText value="#{to.name}" rendered="#{formList}" />
								<aon:inputText id="EnterpriseUser_name" rendered="#{formEdit}"
									size="40" maxlength="64" required="true" 
									value="#{controller.to.name}" />
								<f:facet name="footer">
									<aon:inputText id="EnterpriseUser_name-New" rendered="#{formNew}"
										size="40" maxlength="64" required="true" 
										value="#{controller.to.name}" />
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="EnterpriseUser_scope" value="#{configBundle.config_scope}" />
								</f:facet>
								<aon:outputText value="#{controller.currentScopeList}" rendered="#{formList}" />
								<ui:include src="/com/code/aon/ui/document/facelet/alfrescoGroup/template.xhtml" >
									<ui:param name="scopeId" value="EnterpriseUser_scope" />
									<ui:param name="scopeRendered" value="#{formEdit}" />
								</ui:include>
								<f:facet name="footer">
									<ui:include src="/com/code/aon/ui/document/facelet/alfrescoGroup/template.xhtml" >
										<ui:param name="scopeId" value="EnterpriseUser_scope-New" />
										<ui:param name="scopeRendered" value="#{formNew}" />
									</ui:include>
								</f:facet>
							</aon:column>
														
							<aon:column alias="EnterpriseUser.active"
								styleClass="aon-width-100">
								<f:facet name="header">
									<aon:outputLabel for="EnterpriseUser_active" value="#{bundle.aon_active}" />
								</f:facet>
								<aon:div rendered="#{formList}" styleClass="#{to.active?'aon-icon-checked':'aon-icon-check'}">
									<aon:outputText value="&#160;" />
								</aon:div>
								<aon:selectBooleanCheckbox id="EnterpriseUser_active" styleClass="aon-margin-left"
									value="#{controller.to.active}" rendered="#{formEdit}" />
								<f:facet name="footer">
									<aon:selectBooleanCheckbox id="EnterpriseUser_active-New" styleClass="aon-margin-left"
										value="#{controller.to.active}" rendered="#{formNew}" />
								</f:facet>
							</aon:column>							
														
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
			
		</aon:form>
		
		<ui:include src="/com/code/aon/ui/document/facelet/enterpriseUser/changePassword.xhtml" />
		
	</ui:define>

</ui:composition>
