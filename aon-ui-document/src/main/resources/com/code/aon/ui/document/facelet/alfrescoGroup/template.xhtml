<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="#{scopeId}Div" rendered="#{scopeRendered}">
		<a4j:region>
			<a4j:repeat value="#{alfrescoGroup.selectScopes}" rowKeyVar="index" var="scope">
				<aon:div styleClass="#{(index != 0)?'aon-padding-top':''}">
					<aon:selectOneMenu id="#{scopeId}"
						value="#{alfrescoGroup.selectScopes[index]}">
						<f:selectItem itemLabel="-" itemValue="#{null}"/>
						<f:selectItems value="#{alfrescoGroup.scopes}" />
						<a4j:support event="onchange" reRender="#{scopeId}Div"/>
					</aon:selectOneMenu>
					<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
						actionListener="#{alfrescoGroup.onRemoveScope}" reRender="#{scopeId}Div"
						value="&#160;" rendered="#{scope != null}">
						<f:param name="index" value="#{index}" />
					</aon:commandButton>
					<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" ajaxSingle="true"
						actionListener="#{alfrescoGroup.onAddScope}" reRender="#{scopeId}Div" value="&#160;"
						rendered="#{(scope != null) and (index == (alfrescoGroup.selectScopesSize-1))}"/>					
				</aon:div>						
			</a4j:repeat>
		</a4j:region>
	</aon:div>							

</ui:composition>
