<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="enterpriseDocumentForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_documents}" />
				<ui:param name="controller" value="#{enterpriseDocument}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{enterpriseDocument}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="cm_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="cm_name" size="40"
						valueChangeListener="#{controller.addExpression}" />
				
					<aon:outputLabel for="cm_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="cm_description" size="40"
						valueChangeListener="#{controller.addExpression}" />
						
					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="cm_created-From" styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="cm_created-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
				
						<aon:outputLabel for="cm_created-To" styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="cm_created-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>						
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
