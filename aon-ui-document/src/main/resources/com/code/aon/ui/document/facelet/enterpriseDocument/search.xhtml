<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="enterpriseDocumentForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_documents}" />
				<ui:param name="controller" value="#{enterpriseDocument}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{enterpriseDocument}" />
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="cm_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="cm_name" size="60"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="cm_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="cm_description" size="60"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="cm_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="cm_type"
						value="#{enterpriseDocumentSearch.type}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{enterpriseDocument.mimeTypes}" />
					</aon:selectOneMenu>					

					<aon:outputLabel for="cm_text"
						value="#{bundle.aon_content}" />
					<aon:inputText id="cm_text" size="60"
						value="#{enterpriseDocumentSearch.text}" />
					
					<aon:outputLabel for="cm_category"
						value="#{registryBundle.registry_category}" />
					<aon:selectManyCheckbox id="cm_category"
						value="#{enterpriseDocumentSearch.selectedCategories}">
						<f:selectItems value="#{enterpriseDocument.categories}"/>
					</aon:selectManyCheckbox>								
												
					<c:if test="#{manager.mainEnterprise}" >
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{enterpriseDocumentSearch.enterprise}" />
							<ui:param name="skipNewButton" value="#{true}" />
						</ui:include>
					</c:if>
							
					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="cm_created-From" styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="cm_created-From"
							value="#{enterpriseDocumentSearch.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
				
						<aon:outputLabel for="cm_created-To" styleClass="aon-form-date-label aon-padding-right" 
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="cm_created-To"
							value="#{enterpriseDocumentSearch.endDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>		
									
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
