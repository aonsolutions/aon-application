<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="enterpriseDocumentForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_documents}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_toolbar_search}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="clear"
						value="#{bundle.aon_clear}" immediate="true" 
						actionListener="#{enterpriseDocument.onClear}"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
					<aon:commandButton id="search"
						title="#{bundle.aon_key_search_accelerator}"
						value="#{bundle.aon_search}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						actionListener="#{enterpriseDocument.onSearch}"
						requestDelay="100" accesskey="#{bundle.aon_key_search}" >
						<aon:actionHotKey key="return" />
					</aon:commandButton> 
				</ui:define>
			</ui:decorate>		
			
			<aon:div styleClass="aon-scroll-area">
				<a4j:region>
					<aon:panelCollapsible 
						headerClass="aon-panelGrid-search-info" 
						bodyClass="aon-panelGrid-search"				
						value="#{enterpriseDocumentSearch.showOpened}" >
						<f:facet name="header" >
							<aon:div>
								<aon:outputText value="#{bundle.aon_search_info}" />
								<h:outputLink style="font-size:1em;font-weight:bold;float:right;" value="#" >
									<aon:outputText value="[?]" styleClass="aon-margin-right" />
									<rich:componentControl for="searchHelp" event="onclick" operation="show"/>													
								</h:outputLink>
							</aon:div>										
						</f:facet>
						<aon:panelGrid columns="2">		
							<ui:include src="/com/code/aon/ui/document/facelet/enterpriseDocument/searchContent.xhtml" />
						</aon:panelGrid>
					</aon:panelCollapsible>
				</a4j:region>
				
				<c:if test="#{enterpriseDocumentSearch.showList}">
					<ui:include
						src="/com/code/aon/ui/document/facelet/enterpriseDocument/listContent.xhtml" />
				</c:if>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
