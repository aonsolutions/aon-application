<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="enterpriseDocumentForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_documents}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_toolbar_search}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="clear"
						value="#{bundle.aon_clear}" immediate="true" 
						actionListener="#{enterpriseDocument.onClear}"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
				</ui:define>
			</ui:decorate>		

			<aon:methodParam name="searchAction" value="enterpriseDocument_search" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{enterpriseDocument}" />
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">

					<aon:outputText value="" />
					<aon:div styleClass="aon-width-600">
						<aon:panelCollapsible label="#{bundle.aon_general}"
							opened="#{!enterpriseDocumentSearch.showList}" >
							<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
								<ui:include src="/com/code/aon/ui/document/facelet/enterpriseDocument/searchContent.xhtml" />
							</aon:panelGrid>
						</aon:panelCollapsible>
					</aon:div>
									
				</ui:define>
				<ui:define name="additionalSearchContent" >
					<c:if test="#{enterpriseDocumentSearch.showList}">
						<aon:div styleClass="aon-margin-top">
							<ui:include
								src="/com/code/aon/ui/document/facelet/enterpriseDocument/listContent.xhtml" />
						</aon:div>
					</c:if>
				</ui:define>				
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
