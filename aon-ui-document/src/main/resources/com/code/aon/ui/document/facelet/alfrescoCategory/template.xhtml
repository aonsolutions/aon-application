<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

	<aon:valueParam name="categoryId" default="cm_category" />
	<aon:valueParam name="categoryRendered" default="#{true}" />

	<aon:div id="#{categoryId}Div" rendered="#{categoryRendered}">
		<a4j:region>
			<a4j:repeat value="#{enterpriseDocumentSearch.categories}" rowKeyVar="index" var="ac">
				<aon:div styleClass="#{(index != 0)?'aon-padding-top':''}">
					<aon:selectOneMenu id="#{categoryId}"
						required="#{categoryRequired and (enterpriseDocumentSearch.categoriesSize &lt; 2)}"
						value="#{enterpriseDocumentSearch.categories[index]}">
						<f:selectItem itemLabel="-" itemValue="#{enterpriseDocumentSearch.emptyCategory}"/>
						<f:selectItems value="#{alfrescoCategory.categories}" />
						<a4j:support event="onchange" reRender="#{categoryId}Div"/>
					</aon:selectOneMenu>
					<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
						actionListener="#{enterpriseDocumentSearch.onRemoveCategory}" reRender="#{categoryId}Div"
						value="&#160;" rendered="#{ac.id != null}">
						<f:param name="index" value="#{index}" />
					</aon:commandButton>
					<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" ajaxSingle="true"
						actionListener="#{enterpriseDocumentSearch.onAddCategory}" reRender="#{categoryId}Div" value="&#160;"
						rendered="#{(ac.id != null) and (index == (enterpriseDocumentSearch.categoriesSize-1))}"/>					
				</aon:div>						
			</a4j:repeat>
		</a4j:region>
	</aon:div>							

</ui:composition>
