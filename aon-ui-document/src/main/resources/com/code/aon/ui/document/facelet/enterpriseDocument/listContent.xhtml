<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:column alias="cm:name"
		styleClass="aon-editDataTable-textColumn aon-width-200 aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_name}" />
		</f:facet>
		<aon:outputText value="#{to.name}" >
			<aon:abbreviateConverter maxWidth="40" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="cm:description"
		styleClass="aon-editDataTable-textColumn aon-width-300 aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_description}" />
		</f:facet>
		<aon:outputText value="#{to.description}">
			<aon:abbreviateConverter maxWidth="50" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-160">
		<f:facet name="header">
			<aon:outputText value="#{registryBundle.registry_category}" />
		</f:facet>
		<aon:outputText value="#{to.categoryList}" />
	</aon:column>

	<c:if test="#{manager.mainEnterprise}" >
		<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap">
			<f:facet name="header">
				<aon:outputText value="#{companyBundle.company_enterprise}" />
			</f:facet>
			<aon:outputText value="#{to.enterprise.registry.fullName}" />
		</aon:column>
	</c:if>
						
	<aon:column alias="cm:created"
		styleClass="aon-editDataTable-textColumn aon-width-130">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.createdDate}">
			<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>		
 
	<aon:column
		styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-70">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_fileupload_element}" />
		</f:facet>
		<aon:htmlCommandLink id="download" target="_blank"
			onmouseover="disableRowSelector();" onmouseout="enableRowSelector();"
			actionListener="#{controller.downloadAttachment}"
			styleClass="aon-icon aon-icon-mail-save"
			style="line-height:16px;margin-right:0;"
			title="#{bundle.aon_fileupload_download}">
			<f:param name="uuid" value="#{to.id.uuid}" />
			<f:param name="path" value="#{to.id.path}" />
			<aon:outputText value="&#160;" />
		</aon:htmlCommandLink>					
	</aon:column>

</ui:composition>
