<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/document/facelet/enterpriseTree/treeTemplate.xhtml">

	<ui:define name="header">
		<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{registryBundle.registry_category}" />
			<ui:param name="toolbarDescription" value="&#160;" />
		</ui:include>
	</ui:define>

	<ui:define name="content">
		<aon:div styleClass="aon-scroll-area">
			<aon:panelGrid columns="2" >
		
				<aon:outputText value="#{bundle.aon_name}" />
				<aon:outputText value="#{alfrescoCategory.to.name}" />
	
				<aon:outputText value="#{bundle.aon_description}" />
				<aon:outputText value="#{alfrescoCategory.to.description}" />
		
			</aon:panelGrid>
	
		</aon:div>
	</ui:define>
	
</ui:composition>
