<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/com/code/aon/ui/audit/facelet/shared/menu.xhtml">

	<ui:define name="menuContent">
		<c:if test="#{aonRole.config}">
			<aon:commandLink id="management"
				value="#{appBundle.menu_management}"
				action="menu_management" immediate="true"
				styleClass="aon-top-menu-item aon-icon-prices" />
			<aon:commandLink id="groupware"
				value="#{appBundle.menu_groupware}"
				action="menu_groupware" immediate="true"
				styleClass="aon-top-menu-item aon-icon-contactGroup" />
			<aon:commandLink id="config"
				value="#{bundle.aon_configuration}"
				action="menu_config" immediate="true"
				styleClass="aon-top-menu-item aon-icon-config" />
		</c:if>
	</ui:define>
 </ui:composition>
