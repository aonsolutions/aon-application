<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
		xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="clientesForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_principales_integral}" />
				<ui:param name="controller" value="#{cliente}" />
				<aon:methodParam name="searchAction" value="integral_search" />
				<aon:methodParam name="backAction" value="integral_list" />
		        <ui:param name="skipResetButton" value="true" />
				<ui:param name="skipDeleteButton" value="true" />
				<ui:param name="skipSaveButton" value="true" />	
			    <ui:param name="skipRemoveButton" value="true" />	
				
			</ui:include>


			<aon:div id="clientes"
				styleClass="aon-scroll-area aon-scroll-area-principales">


				<aon:div id="datos1" styleClass="aon-scroll-area">
					<aon:panelGrid columns="4" dir="true" width="100%">


						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_clientes_cod}" />
						<aon:outputText value="#{cliente.to.cdg}" maxlength="4" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_clientes_nom}" />
						<aon:outputText value="#{cliente.to.descripcion}" size="60"
							maxlength="40" />
							
							<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_clientes_numdoc}" />
						<aon:outputText value="#{cliente.to.numdoc}" size="60"
							maxlength="20" />
							

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_clientes_alias}" />
						<aon:outputText value="#{cliente.to.alias}" size="60"
							maxlength="20" />
							
									<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_clientes_inirel}" />
						<aon:selectInputDate renderAsPopup="true" disabled="true"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{cliente.to.fecini}" enableManualInput="true" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_clientes_finrel}" />
						<aon:selectInputDate renderAsPopup="true" disabled="true"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{cliente.to.fecfin}" enableManualInput="true" />
							

						<aon:outputLabel for="Dele_cdg"
							value="#{appBundle.aon_payroll_principales_clientes_deleg}" />
						<aon:div styleClass="aon-lookup"> 
							<!--  <aon:lookupInputText id="Del_cdg" lookup="#{delegacionLookup}" disabled="true"
								reRender="Del_description" value="#{cliente.to.delegacion.cdg}"
								size="5">
							</aon:lookupInputText>
							<aon:lookupButton id="Del_lookup" disabled="true"
								windowTitle="#{appBundle.aon_payroll_principales_clientes_deleg}"
								selectReRender="Del_cdg,Del_description"
								lookup="#{delegacionLookup}" minHeight="440"
								property="#{cliente.to.delegacion}">
							</aon:lookupButton>-->
							<aon:outputText id="Del_description"
								value="#{(cliente.to.delegacion.descripcion!=null)?(cliente.to.delegacion.descripcion):('')}"
								size="34" disabled="true" />
						</aon:div>

						
				

					</aon:panelGrid>
				</aon:div>
				<rich:spacer />

				
					<rich:tabPanel switchType="ajax" >

					<rich:tab
						label="Empresas">
						<aon:div id="empreDiv">
					<ui:include src="grid.xhtml" rendered="#{!cliente.new}" />
				</aon:div>
					</rich:tab>
	              </rich:tabPanel>
				
				
				<rich:tabPanel switchType="ajax" >

					<rich:tab
						label="Actividades">
						<aon:div id="actiDiv">

							<ui:include src="actividad/grid.xhtml"
								rendered="#{to==empresa.to}" />
						</aon:div>
					</rich:tab>
	              </rich:tabPanel>


					<aon:div id="tabsInfo">
						<rich:tabPanel switchType="ajax" style="tabs">

							<rich:tab
								label="#{appBundle.aon_payroll_principales_domicilio_domiasin}">

								<aon:div>
									<ui:include src="domicilio/grid2.xhtml"
										rendered="#{!cliente.new}" />

								</aon:div>

							</rich:tab>

							<rich:tab
								label="#{appBundle.aon_payroll_principales_cuentasasign}">

								<aon:div id="cuenta">

									<ui:include src="cuenta/grid2.xhtml" rendered="#{!cliente.new}" />
								</aon:div>
							</rich:tab>



							<!--  		
				
						
						<rich:tab
							label="#{appBundle.aon_payroll_principales_cuentasbancarias}">
							<aon:actionListener method="#{tipcuenta.onReset}" />
							<aon:div id="cuentaDiv">

								<ui:include src="cuenta/grid.xhtml" rendered="#{!cliente.new}" />
							</aon:div>
						</rich:tab>
				-->
						</rich:tabPanel>

					</aon:div>
			</aon:div>
		</aon:form>

		<aon:lookupButtonPopup lookup="#{delegacionLookup}" />
		<aon:lookupButtonPopup lookup="#{empresarioLookup}" />
		<aon:lookupButtonPopup lookup="#{paisLookup}" />
		<aon:lookupButtonPopup lookup="#{documentoLookup}" />
		<aon:lookupButtonPopup lookup="#{tipoviaLookup}" />
		<aon:lookupButtonPopup lookup="#{provinciaLookup}" />
		<aon:lookupButtonPopup lookup="#{empresaLookup}" />
		<aon:lookupButtonPopup lookup="#{actividadLookup}" />
		<aon:lookupButtonPopup lookup="#{domicilioLookup}" />
		<aon:lookupButtonPopup lookup="#{cuentaLookup}" />
		<aon:lookupButtonPopup lookup="#{clienteLookup}" />

	</ui:define>
</ui:composition>

</body>
</html>
