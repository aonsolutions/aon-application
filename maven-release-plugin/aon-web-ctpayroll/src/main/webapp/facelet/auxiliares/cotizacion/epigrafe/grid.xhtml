<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="epigrafeData" value="#{epigrafe.model}" 
			var="to" rows="0"
			rendered="#{(epigrafe.model.rowCount > 0) or (epigrafe.new)}" 
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-textColumn
				,aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{epigrafe.to == null}" actionListener="#{epigrafe.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{epigrafe.onReset}" value=""
							rendered="#{!epigrafe.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
					
				</f:facet>
			</aon:column>
			
			
			

				
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_fecini}" />
				</f:facet>
				<aon:outputText value="#{to.id.fecini}" rendered="#{to!=epigrafe.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{epigrafe.to.id.fecini}"
					rendered="#{to==epigrafe.to}" inputSize="10"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{epigrafe.to.id.fecini}"
						rendered="#{epigrafe.new}" inputSize="10"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_fecfin}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}" rendered="#{to!=epigrafe.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{epigrafe.to.fecfin}"
					rendered="#{to==epigrafe.to}" inputSize="10"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{epigrafe.to.fecfin}"
						rendered="#{epigrafe.new}" inputSize="10"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_epigrafes_indiIT}" />
				</f:facet>
			     	<aon:outputText value="#{to.indit}" rendered="#{to!=epigrafe.to}" />
			
				    <aon:selectOneMenu  styleClass="aon-form-input-text"  rendered="#{to==epigrafe.to}"
					  id="Epigrafsup"  value="#{epigrafe.to.indit}" >				
						<f:selectItems value="#{epigrafe.listaEpigrafes}" />
						</aon:selectOneMenu>
						
				<f:facet name="footer">
					<aon:selectOneMenu  styleClass="aon-form-input-text"  
						rendered="#{epigrafe.new}"  id="Epigrafesnew" value="#{epigrafe.to.indit}" >	
						<f:selectItems value="#{epigrafe.listaEpigrafes}"/>
						</aon:selectOneMenu>
				</f:facet>
			</aon:column>
			
	          <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_epigrafes_impIT}" />
				</f:facet>
				<aon:outputText value="#{to.canit}" rendered="#{to!=epigrafe.to}" >
								<f:convertNumber type="number"  minFractionDigits="2" pattern="###,###.###" />
								</aon:outputText>
					
			
				<aon:inputText  styleClass="aon-form-input-text"
					rendered="#{to==epigrafe.to}" 
					value="#{epigrafe.to.canit}" maxlength="20" size="20"  />
				<f:facet name="footer">
					<aon:inputText  styleClass="aon-form-input-text"  
						rendered="#{epigrafe.new}" 
						value="#{epigrafe.to.canit}" maxlength="20" size="20"  />
				</f:facet>
					</aon:column>
				
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_epigrafes_indIMS}" />
				</f:facet>
				
				  <aon:outputText value="#{to.indipm}" rendered="#{to!=epigrafe.to}" />
				
				 	    <aon:selectOneMenu  styleClass="aon-form-input-text"  rendered="#{to==epigrafe.to}"
					  id="Epigrafesu" value="#{epigrafe.to.indipm}" >
						<f:selectItems value="#{epigrafe.listaEpigrafes}" />
						</aon:selectOneMenu>
			
				<f:facet name="footer">
					<aon:selectOneMenu  styleClass="aon-form-input-text"  
						rendered="#{epigrafe.new}"  id="Epigrafesne" value="#{epigrafe.to.indipm}" >	
						<f:selectItems value="#{epigrafe.listaEpigrafes}"/>
						</aon:selectOneMenu>
				</f:facet>
			</aon:column>
			
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_epigrafes_impIMS}" />
				</f:facet>
				<aon:outputText value="#{to.canipm}" rendered="#{to!=epigrafe.to}" >
								<f:convertNumber type="number"  minFractionDigits="2" pattern="###,###.###" />
								</aon:outputText>
					
			
				<aon:inputText styleClass="aon-form-input-text"
					rendered="#{to==epigrafe.to}" 
					value="#{epigrafe.to.canipm}" maxlength="20" size="20"  />
				<f:facet name="footer">
					<aon:inputText  styleClass="aon-form-input-text"  
						rendered="#{epigrafe.new}" 
						value="#{epigrafe.to.canipm}" maxlength="20" size="20"  />
				</f:facet>
			</aon:column>
			
			

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=epigrafe.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==epigrafe.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{epigrafe.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==epigrafe.to}"
						actionListener="#{epigrafe.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==epigrafe.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{epigrafe.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!epigrafe.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{epigrafe.new}"
							actionListener="#{epigrafe.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{epigrafe.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{epigrafe.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
	</aon:div>

</ui:composition>
