<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="mailAccountProcessGrid">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.webmail_mailAccount_process}" />
				<ui:param name="toolbarDescription" value="&#160;" />
			</ui:include>			

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
					<ui:param name="controller" value="#{mailProcess}" />
					<ui:define name="columns">
					
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputLabel for="MailProcess_type"
									value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.type.name}" rendered="#{formList}" />
							<aon:selectOneMenu id="MailProcess_type" rendered="#{formEdit}"
								required="true" value="#{controller.type}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{mailProcess.mailProcessTypes}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu id="MailProcess_type-New" rendered="#{formNew}"
									required="true" value="#{controller.type}">
									<f:selectItem itemLabel="-" value="#{null}"/>
									<f:selectItems value="#{mailProcess.mailProcessTypes}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputLabel for="MailProcess_mailAccount"
									value="#{bundle.webmail_mailAccount_full}" />
							</f:facet>
							<aon:outputText value="#{to.mailAccount.displayName}" rendered="#{formList}" />
							<aon:selectOneMenu id="MailProcess_mailAccount" rendered="#{formEdit}"
								required="true" value="#{controller.mailAccount}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{mailProcess.mailAccounts}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu id="MailProcess_mailAccount-New" rendered="#{formNew}"
									required="true" value="#{controller.mailAccount}">
									<f:selectItem itemLabel="-" value="#{null}"/>
									<f:selectItems value="#{mailProcess.mailAccounts}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputLabel for="Template_id"
									value="#{bundle.marketing_mail_template}" />
							</f:facet>
							<aon:outputText value="#{to.template.name}" rendered="#{formList}" />
						 	<ui:include src="/com/code/aon/ui/marketing/facelet/marketingTemplate/lookup.xhtml" >
								<ui:param name="lookupTo" value="#{controller.template}" />
								<ui:param name="idRequired" value="#{true}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupRendered" value="#{formEdit}" />
							</ui:include>
							<f:facet name="footer" >
								<ui:include src="/com/code/aon/ui/marketing/facelet/marketingTemplate/lookup.xhtml" >
									<ui:param name="lookupTo" value="#{controller.template}" />
									<ui:param name="idRequired" value="#{true}" />
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="lookupRendered" value="#{formNew}" />
									<ui:param name="lookupSuffix" value="-New" />
								</ui:include>
							</f:facet>	
						
						</aon:column>							
						
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputLabel for="MailProcess_priority"
									value="Prioridad" />
							</f:facet>
							<aon:outputText value="#{to.priorityName}" rendered="#{formList}" />
							<aon:selectOneMenu id="MailProcess_priority" rendered="#{formEdit}"
								required="true" value="#{controller.priority}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{mailProcess.uses}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu id="MailProcess_priority-New" rendered="#{formNew}"
									required="true" value="#{controller.priority}" >
									<f:selectItem itemLabel="-" value="#{null}"/>
									<f:selectItems value="#{mailProcess.uses}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>
						
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{marketingTemplateLookup}" />
	</ui:define>

</ui:composition>

</body>
</html>
