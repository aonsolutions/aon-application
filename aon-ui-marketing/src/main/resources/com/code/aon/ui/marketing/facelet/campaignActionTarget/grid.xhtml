<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{campaignActionTarget}" />
			<ui:define name="columns">

				<aon:column alias="ActionTarget.target.registry.name"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="Target_id" value="#{target.bundle.commercial_target}" />
					</f:facet>
					<aon:outputText value="#{to.target.registry.fullName}"
						rendered="#{formList}" />
						
					<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{controller.to.target}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formEdit}" />
						<ui:param name="lookupInputSuggestSize" value="40"/>
					</ui:include>
					<f:facet name="footer" >
						<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{controller.to.target}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupInputSuggestSize" value="40"/>
							<ui:param name="lookupSuffix" value="-New" />
						</ui:include>
					</f:facet>	
				</aon:column>
				
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="ActionTarget_comments"
							value="#{marketingBundle.marketing_comments}" />
					</f:facet>				
					<aon:outputText value="#{to.comments}"
						rendered="#{formList}" />
					<aon:inputTextarea id="ActionTarget_comments"
						value="#{controller.to.comments}"
						rows="2" cols="40" rendered="#{formEdit}" />					
					<f:facet name="footer">
						<aon:inputTextarea id="ActionTarget_comments-New"
							value="#{controller.to.comments}"
							rows="2" cols="40" rendered="#{formNew}" />					
					</f:facet>
				</aon:column>					
				
				<aon:column alias="ActionTarget.status"
					styleClass="aon-editDataTable-textColumn aon-width-80">
					<f:facet name="header">
						<aon:outputLabel for="ActionTarget_status" value="#{bundle.aon_status}" />
					</f:facet>
					<aon:outputText value="#{to.status}"
						rendered="#{formList}" />
					<aon:selectOneMenu id="ActionTarget_status" rendered="#{formEdit}"
						value="#{controller.to.status}">
						<f:selectItems value="#{marketingCollections.actionTargetStatuses}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu id="ActionTarget_status-New" rendered="#{formNew}"
							value="#{controller.to.status}">
							<f:selectItems value="#{marketingCollections.actionTargetStatuses}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>		
				
				<c:if test="#{aonConfiguration.bean.campaign.showSurvey}" >
					<aon:column styleClass="aon-text-center aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{marketingBundle.marketing_survey_response}" />
						</f:facet>
						<aon:commandButton style="border:0;" reRender="aonContent" value="&#160;"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							action="surveyResponse_action_form" actionListener="#{surveyResponse.onSelectSurveyResponse}"
							onmouseover="disableRowSelector();" oncomplete="enableRowSelector();" onmouseout="enableRowSelector();"
							rendered="#{to.surveyResponse.id != null}" immediate="true">
							<f:param name="surveyResponseId" value="#{to.surveyResponse.id}" />
						</aon:commandButton>
					</aon:column>
				</c:if>		

			</ui:define>
		</ui:decorate>

	</aon:div>
</ui:composition>
