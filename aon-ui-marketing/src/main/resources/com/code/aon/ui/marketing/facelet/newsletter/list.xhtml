<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="newsletterList">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_newsletter_module}" />
				<ui:param name="controller" value="#{newsletter}" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{newsletter}" />
					<ui:define name="columns">
					
						<ui:include
							src="/com/code/aon/ui/marketing/facelet/newsletter/listBasic.xhtml" />
							
						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="Newsletter.layout" >
							<f:facet name="header">
								<aon:outputText value="#{marketingBundle.marketing_newsletter_layout}" />
							</f:facet>
							<aon:outputText value="#{to.layout}"/>
						</aon:column>

					</ui:define>
				</ui:decorate> 

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
