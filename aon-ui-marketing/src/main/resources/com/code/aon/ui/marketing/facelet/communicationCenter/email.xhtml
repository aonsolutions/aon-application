<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:methodParam name="sendCancelAction" value="communicationCenter" />
	<ui:decorate template="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNew.xhtml" >
		<ui:param name="skipSendButton" value="#{true}"/>
		<ui:param name="skipRecipients" value="#{true}"/>
		<ui:param name="skipSaveDraftButton" value="#{true}"/>
		<ui:define name="additionalToolbarContent">
			<aon:commandButton id="send" reRender="aonStatus"
				value="#{bundle.webmail_send}"
				styleClass="aon-icon-accept aon-finding-toolbar-item"
				actionListener="#{emailCommunication.send}" >
				<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
			</aon:commandButton>
		</ui:define>
	</ui:decorate>

	<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
		<ui:param name="logPanelTitle" value="#{bundle.webmail_sending}" />
		<ui:param name="closeButtonReRender" value="aonContent"/>
		<aon:methodParam name="closeButtonAction" value="communicationCenter" />
	</ui:include>		
	
</ui:composition>
