<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="campaignActionForm">		
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >		
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_template_module}" />
				<ui:param name="controller" value="#{marketingTemplate}" />
				<ui:define name="beforeSpinToolbarContent" >
					<aon:commandButton id="sendEmail"
						reRender="showNewMessageWindow" immediate="true"
						value="#{webmailBundle.webmail_send}"
						actionListener="#{marketingTemplate.onSendEmail}"
						styleClass="aon-finding-toolbar-item aon-icon-webmail2" />	
				</ui:define>				
			</ui:decorate>				

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Template_id"
						rendered="#{!marketingTemplate.new}" value="#{bundle.aon_id}" />
					<aon:inputText id="Template_id" value="#{marketingTemplate.to.id}" required="true"
						rendered="#{!marketingTemplate.new}" size="15" disabled="true" />

					<aon:outputLabel for="Template_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="Template_name" required="true"
						value="#{marketingTemplate.to.name}" size="60" maxlength="64" />
						
					<aon:outputLabel for="Template_subject"
						value="#{bundle.aon_subject}" />
					<aon:inputText id="Template_subject" 
						value="#{marketingTemplate.to.subject}" size="60" maxlength="128" />						
										
					<aon:outputLabel for="Template_creationDate"
						value="#{marketingBundle.marketing_creationDate}" />
					<aon:selectInputDate id="Template_creationDate" required="true"
						value="#{marketingTemplate.to.creationDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				
					<aon:outputLabel for="Template_scope_id"
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Template_scope_id" required="true"
						value="#{marketingTemplate.to.scope}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>
								
					<aon:outputLabel for="Template_active"
						value="#{bundle.aon_active}" />
					<aon:selectBooleanCheckbox id="Template_active" required="true"
						value="#{marketingTemplate.to.active}" />
						
					<aon:outputLabel for="Template_width"
						value="#{marketingBundle.marketing_newsletter_width}" />
					<aon:inputText id="Template_width" 
						value="#{marketingTemplate.to.width}" size="16" maxlength="16" />																		
						
					<aon:outputLabel for="Template_backgroundColor"
						value="#{marketingBundle.marketing_newsletter_backgroundColor}" />
					<aon:div>
						<rich:colorPicker id="Template_backgroundColor"
							value="#{marketingTemplate.to.backgroundColor}" colorMode="hex" />
						<aon:div layout="inline" styleClass="aon-margin-left">
							<aon:commandButton id="backgroundColorClear"
								value="&#160;" title="#{bundle.aon_clear}"
								actionListener="#{marketingTemplate.onClearBackgroundColor}"
								styleClass="aon-icon-commandButton aon-icon-delete"
								reRender="Template_backgroundColor">
							</aon:commandButton>
						</aon:div>
					</aon:div>

					<aon:outputLabel for="Template_titleColor"
						value="#{marketingBundle.marketing_newsletter_titleColor}" />
					<aon:div>						
						<rich:colorPicker id="Template_titleColor"
							value="#{marketingTemplate.to.titleColor}" colorMode="hex" />				
						<aon:div layout="inline" styleClass="aon-margin-left">
							<aon:commandButton id="titleColorClear"
								value="&#160;" title="#{bundle.aon_clear}"
								actionListener="#{marketingTemplate.onClearTitleColor}"
								styleClass="aon-icon-commandButton aon-icon-delete"
								reRender="Template_titleColor">
							</aon:commandButton>
						</aon:div>
					</aon:div>
						
					<ui:include src="/com/code/aon/ui/marketing/facelet/htmlTemplate/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{marketingTemplate.to.headerTemplate}" />
						<ui:param name="lookupLabel" value="#{marketingBundle.marketing_newsletter_headerTemplate}" />
						<ui:param name="lookupSuffix" value="-header" />
					</ui:include>					

					<ui:include src="/com/code/aon/ui/marketing/facelet/htmlTemplate/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{marketingTemplate.to.footerTemplate}" />
						<ui:param name="lookupLabel" value="#{marketingBundle.marketing_newsletter_footerTemplate}" />
						<ui:param name="lookupSuffix" value="-footer" />
					</ui:include>					
												
				</aon:panelGrid>
				
			</aon:div>
		</aon:form>	

		<aon:lookupButtonPopup lookup="#{htmlTemplateLookup}" />
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />

	</ui:define>
</ui:composition>
