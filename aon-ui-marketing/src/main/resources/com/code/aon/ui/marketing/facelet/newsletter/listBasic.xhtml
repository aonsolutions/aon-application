<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
					
	<aon:column styleClass="aon-editDataTable-textColumn"
		alias="Newsletter.name" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_name}" />
		</f:facet>
		<aon:outputText value="#{to.name}"/>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-150"
		alias="Newsletter.date" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.date}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
			timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>					
	</aon:column>
					
</ui:composition>
