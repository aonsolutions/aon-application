<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">


	<aon:panelGroup id="surveyWorkflowWindow">
		<c:if test="#{surveyQuestion.showSurveyWorkflowWindow}">
			<rich:modalPanel id="surveyWorkflowModalPanel"
				rendered="#{surveyQuestion.showSurveyWorkflowWindow}"
				showWhenRendered="true" minHeight="390" height="390" width="680"
				top="50">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{marketingBundle.marketing_survey_workflows}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							actionListener="#{surveyQuestion.onCancel}" immediate="true" reRender="surveyQuestionData">
							<f:setPropertyActionListener
								target="#{surveyQuestion.showSurveyWorkflowWindow}"
								value="#{false}" />
							<rich:componentControl for="surveyWorkflowModalPanel"
								operation="hide" event="oncomplete" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="questionWorkflow">
					<aon:div>
						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
							<ui:param name="controller" value="#{surveyWorkflow}" />
							<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
							<ui:define name="columns">
	
								<aon:column>
									<f:facet name="header">
										<aon:outputLabel for="SurveyWorkflow_value" value="#{bundle.aon_value}" />
									</f:facet>
									<aon:div layout="none" rendered="#{formList and (to.questionValue.id != null)}">
										<ui:include src="/com/code/aon/ui/marketing/facelet/util/outputValue.xhtml">
											<ui:param name="valueHolder" value="#{to.questionValue}" />
										</ui:include>
									</aon:div>
									<aon:div layout="none" rendered="#{formList and (to.questionValue.id == null)}">
										<ui:include src="/com/code/aon/ui/marketing/facelet/util/outputValue.xhtml">
											<ui:param name="valueHolder" value="#{to}" />
										</ui:include>
									</aon:div>
									<aon:div layout="none" rendered="#{formEdit and (!(empty surveyQuestion.questionValues))}">
										<aon:selectOneMenu id="SurveyWorkflow_value-Collection" required="true"
											value="#{controller.to.questionValue.id}">
											<f:selectItems value="#{surveyQuestion.questionValues}" />
										</aon:selectOneMenu>
									</aon:div>
									<aon:div layout="none" rendered="#{formEdit and (empty surveyQuestion.questionValues)}">
										<ui:include src="/com/code/aon/ui/marketing/facelet/util/inputValue.xhtml">
											<ui:param name="inputId" value="SurveyWorkflow_value" />
											<ui:param name="valueHolder" value="#{controller.to}" />
										</ui:include>
									</aon:div>
									<f:facet name="footer">
										<aon:div layout="none" rendered="#{formNew}">
											<c:if test="#{!(empty surveyQuestion.questionValues)}">
												<aon:selectOneMenu id="SurveyWorkflow_value-Collection-New"
													required="true" value="#{controller.to.questionValue.id}">
													<f:selectItems value="#{surveyQuestion.questionValues}" />
												</aon:selectOneMenu>
											</c:if>
											<c:if test="#{empty surveyQuestion.questionValues}">
												<ui:include src="/com/code/aon/ui/marketing/facelet/util/inputValue.xhtml">
													<ui:param name="inputId" value="SurveyWorkflow_value-New" />
													<ui:param name="valueHolder" value="#{controller.to}" />
												</ui:include>
											</c:if>
										</aon:div>
									</f:facet>
								</aon:column>
	
								<aon:column>
									<f:facet name="header">
										<aon:outputLabel for="SurveyWorkflow_nextSurveyQuestion"
											value="#{marketingBundle.marketing_survey_workflow_next_question}" />
									</f:facet>
									<aon:outputText value="#{to.nextSurveyQuestion.question.text}"
										rendered="#{formList}">
										<aon:abbreviateConverter maxWidth="40" />
									</aon:outputText>
									<aon:selectOneMenu id="SurveyWorkflow_nextSurveyQuestion" rendered="#{formEdit}"
										required="true" value="#{surveyWorkflow.to.nextSurveyQuestion.id}">
										<f:selectItem value="#{null}" itemLabel="    " />
										<f:selectItems value="#{surveyQuestion.questions}" />
									</aon:selectOneMenu>
									<f:facet name="footer">
										<aon:selectOneMenu id="SurveyWorkflow_nextSurveyQuestion-New"
											rendered="#{formNew}" required="true"
											value="#{controller.to.nextSurveyQuestion.id}">
											<f:selectItem value="#{null}" itemLabel="    " />
											<f:selectItems value="#{surveyQuestion.questions}" />
										</aon:selectOneMenu>
									</f:facet>
								</aon:column>
	
							</ui:define>
						</ui:decorate>
					</aon:div>						
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
