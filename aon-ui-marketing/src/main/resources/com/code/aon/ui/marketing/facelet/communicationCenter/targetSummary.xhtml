<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputText value="#{bundle.aon_company_document}" />
	<aon:outputText value="#{communicationCenter.target.registry.document}" />

	<aon:outputText value="#{bundle.aon_company_name}" />
	<aon:outputText value="#{communicationCenter.target.registry.fullName}" />

	<aon:outputText value="#{bundle.aon_company_alias}"
		rendered="#{communicationCenter.renderTargetAlias}" />
	<aon:outputText value="#{communicationCenter.target.registry.alias}"
		rendered="#{communicationCenter.renderTargetAlias}" />
		
	<c:if test="#{communicationCenter.mainAddress != null}">
		<aon:outputText value="#{registryBundle.registry_address}" />
		<aon:outputText value="#{communicationCenter.fullAddress}" /> 
		
		<aon:outputText value="#{registryBundle.registry_city}" 
			rendered="#{communicationCenter.mainAddress.city != null}" />
		<aon:outputText value="#{communicationCenter.mainAddress.city}"
			rendered="#{communicationCenter.mainAddress.city != null}" />
			
		<aon:outputText value="#{registryBundle.registry_zip}"
			rendered="#{communicationCenter.mainAddress.zip != null}" />
		<aon:outputText value="#{communicationCenter.mainAddress.zip}"
			rendered="#{communicationCenter.mainAddress.zip != null}" />
			
		<aon:outputText value="#{registryBundle.registry_geozone}"
			rendered="#{communicationCenter.mainAddress.geozone != null}" />
		<aon:outputText value="#{communicationCenter.mainAddress.geozone.name}"
			rendered="#{communicationCenter.mainAddress.geozone != null}" />
	</c:if>

	<aon:outputText value="#{registryBundle.registry_phone}"
		rendered="#{communicationCenter.phone != null}" />								
	<aon:outputText value="#{communicationCenter.phone.value}"
		rendered="#{communicationCenter.phone != null}" />

	<aon:outputText value="#{registryBundle.registry_cellular}"
		rendered="#{communicationCenter.cellular != null}" />								
	<aon:outputText value="#{communicationCenter.cellular.value}"
		rendered="#{communicationCenter.cellular != null}" />

	<aon:outputText value="#{registryBundle.registry_fax}"
		rendered="#{communicationCenter.fax != null}" />								
	<aon:outputText value="#{communicationCenter.fax.value}"
		rendered="#{communicationCenter.fax != null}" />

	<aon:outputText value="#{registryBundle.registry_email}"
		rendered="#{communicationCenter.email != null}" />								
	<aon:outputText value="#{communicationCenter.email.value}"
		rendered="#{communicationCenter.email != null}" />

	<aon:outputText value="#{registryBundle.registry_web}"
		rendered="#{communicationCenter.web != null}" />								
	<aon:outputText value="#{communicationCenter.web.value}"
		rendered="#{communicationCenter.web != null}" />	
									
</ui:composition>
