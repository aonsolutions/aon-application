<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<a4j:region>
		<aon:panelCollapsible id="campaignActionTargetSearchDiv"
			label="#{bundle.aon_search_info}"
			headerClass="aon-panelGrid-search-info" 
			bodyClass="aon-panelGrid-search"				
			value="#{campaignActionTargetSearch.showFilterPanel}" >

			<aon:panelGrid columns="4">		

				<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{campaignActionTargetSearch.to.target}" />
					<ui:param name="lookupSuffix" value="-Filter" />
					<ui:param name="skipNewButton" value="#{true}" />
				</ui:include>
									
				<aon:outputLabel for="ActionTarget_status"
					value="#{bundle.aon_type}" />
				<aon:selectOneMenu id="ActionTarget_status"
					value="#{campaignActionTargetSearch.to.status}"
					valueChangeListener="#{campaignActionTarget.addExpression}">
					<f:selectItem itemLabel="-" value="#{null}" />		
					<f:selectItems value="#{marketingCollections.actionTargetStatuses}" />
				</aon:selectOneMenu>					
				
				<ui:include src="/com/code/aon/ui/config/facelet/user/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{campaignActionTargetSearch.to.user}" />
					<ui:param name="lookupSuffix" value="-Filter" />
				</ui:include>									
				
				<aon:outputLabel for="ActionTarget_comments"
					value="#{bundle.aon_comment}" />
				<aon:inputText id="ActionTarget_comments"
					value="#{campaignActionTargetSearch.to.comments}" size="40" />
					
				<aon:outputText value="" />
				<aon:commandButton id="search"
					title="#{bundle.aon_key_search_accelerator}"
					value="#{bundle.aon_search}" status="aonStatus"
					styleClass="aon-icon-rubber aon-search-lookup-button"
					actionListener="#{campaignActionTargetSearch.onFilter}"
					requestDelay="100" accesskey="#{bundle.aon_key_search}" >
				</aon:commandButton> 

			</aon:panelGrid>
		</aon:panelCollapsible>
	</a4j:region>

</ui:composition>
