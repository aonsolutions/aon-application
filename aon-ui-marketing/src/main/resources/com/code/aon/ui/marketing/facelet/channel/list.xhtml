<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="channelList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.marketing_channel_module}" />
				<ui:param name="controller" value="#{channel}" />
	
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="back" value="#{bundle.aon_back}"
						accesskey="K" title="#{bundle.aon_back}"
						action="#{channel.externalBackAction}"
						rendered="#{channel.backActionEnabled}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true" />

						
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{channel}" />
					<ui:define name="columns">
					
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-200"
							alias="Category.name" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_title}" />
							</f:facet>
							<aon:outputText value="#{to.name}"/>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="Category.description" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}">
								<aon:abbreviateConverter maxWidth="100" />
							</aon:outputText>
						</aon:column>						
					
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-150"
							alias="Category.url" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.marketing_news_url}" />
							</f:facet>
							<aon:outputText value="#{to.url}"/>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-140"
							alias="Category.scope&lt;description">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_scope}" />
							</f:facet>
							<aon:outputText value="#{to.scope.description}" />
						</aon:column>												

						<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_document_download_url}" />
							</f:facet>
							<aon:outputLink target="_blank"
								value="#{channel.currentDownloadURL}"
								onmouseover="disableRowSelector();"
								onmouseup="disableRowSelector();"
								onmouseout="enableRowSelector();" >
								<aon:outputText value="#{channel.currentDownloadURL}" />
						    </aon:outputLink>
						</aon:column>
					
					</ui:define>
				</ui:decorate> 

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
