<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="targetSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.commercial_target_module}" />
				<ui:param name="controller" value="#{target}" />
				<aon:methodParam name="backAction" value="campaignAction_form"/>				
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{target.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="campaignActionTarget_list" />

					<ui:decorate template="/com/code/aon/ui/commercial/facelet/target/searchContent.xhtml">
						<ui:param name="controller" value="#{target}"/>
						<ui:param name="searchController" value="#{targetSearch}" />
						<ui:define name="additionalTargetSearchContent">

							<ui:include src="/com/code/aon/ui/marketing/facelet/campaignAction/lookup.xhtml" >
								<ui:param name="lookupTo" value="#{targetSearch.action}" />
								<ui:param name="lookupInputSuggestSize" value="60"/>
								<ui:param name="lookupControllerListener" value="#{campaignActionTarget.actionFilter}" />
							</ui:include>					

						</ui:define>
					</ui:decorate>
					
				</ui:define>
			</ui:decorate>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />			
		<aon:lookupButtonPopup lookup="#{questionLookup}" />
		<aon:lookupButtonPopup lookup="#{campaignActionLookup}" />
		<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
	</ui:define>
</ui:composition>
