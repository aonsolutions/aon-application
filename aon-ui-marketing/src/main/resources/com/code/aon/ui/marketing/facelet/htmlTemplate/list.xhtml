<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="htmlTemplateList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_html_template_module}" />
				<ui:param name="controller" value="#{htmlTemplate}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{htmlTemplate}" />
					<ui:define name="columns">
			
						<aon:column alias="RegistryAttachment.description"
							styleClass="aon-editDataTable-textColumn aon-nowrap">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>
						
						<aon:column alias="RegistryAttachment.scope&lt;description"
							styleClass="aon-editDataTable-textColumn aon-width-140">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_scope}" />
							</f:facet>
							<aon:outputText value="#{to.scope.description}" />
						</aon:column>						
					
						<aon:column alias="RegistryAttachment.attachDate"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.attachDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="RegistryAttachment.size"
							styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_size}" />
							</f:facet>
							<aon:outputText value="#{to.sizeToDisplay}" />
						</aon:column>					
							
					</ui:define>
				</ui:decorate>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
