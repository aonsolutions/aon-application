<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
					
	<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap"
		alias="News.title" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_title}" />
		</f:facet>
		<aon:outputText value="#{to.title}">
			<aon:abbreviateConverter maxWidth="100" />
		</aon:outputText>								
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-120"
		alias="News.type" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_type}" />
		</f:facet>
		<aon:outputText value="#{to.type}"/>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-120"
		alias="News.initDate" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.initDate}" >
			<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
			timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>					
	</aon:column>	
					
</ui:composition>
