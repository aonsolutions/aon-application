<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="marketingCampaignSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_campaign_module}" />
				<ui:param name="controller" value="#{marketingCampaign}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{marketingCampaign}" />
				<ui:define name="searchContent">
					
					<aon:outputLabel for="MarketingCampaign_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="MarketingCampaign_id" size="60"
						valueChangeListener="#{marketingCampaign.addExpression}" />		
			
					<aon:outputLabel for="MarketingCampaign_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="MarketingCampaign_description" size="60"
						valueChangeListener="#{marketingCampaign.addExpression}" />
				
					<aon:outputLabel for="MarketingCampaign_active"				
						value="#{bundle.aon_status}"/>
					<aon:selectOneMenu id="MarketingCampaign_active"
						valueChangeListener="#{marketingCampaign.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="#{true}"/>
						<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="#{false}"/>
					</aon:selectOneMenu>

				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
	</ui:define>
		
</ui:composition>
