<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="rssForm">
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.marketing_news_rss}" />
				<ui:param name="toolbarDescription" value="&#160;" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="publishRSS" reRender="aonStatus"
						value="#{bundle.marketing_news_upload_rss}"
						actionListener="#{rss.onPublish}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-accept" >
						<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
					</aon:commandButton>								
				</ui:define>
			</ui:decorate>			

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">

					<aon:outputLabel for="RSS_category"
						value="#{bundle.marketing_news_channel}" />
					<aon:selectOneMenu id="RSS_category" 
						reRender="RSS_downloadURL"
						value="#{rss.category}">
						<f:selectItem itemLabel="#{bundle.marketing_channel_all}" value="#{null}"/>
						<f:selectItems value="#{marketingCollections.channels}" />
					</aon:selectOneMenu>												

					<aon:outputText value="#{bundle.aon_document_download_url}" />
					<aon:outputLink id="RSS_downloadURL"
						target="_blank" value="#{rss.downloadURL}" >
						<aon:outputText value="#{rss.downloadURL}" />
				    </aon:outputLink>
						
				</aon:panelGrid>
			
			</aon:div>
			
		</aon:form>
		<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
			<ui:param name="logPanelTitle" value="#{bundle.publisher_publish}" />
		</ui:include>		
	</ui:define>
</ui:composition>

</body>
</html>
