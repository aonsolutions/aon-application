<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="htmlTemplateForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.marketing_html_template_module}" />
				<ui:param name="controller" value="#{htmlTemplate}" />
				<ui:define name="beforeSpinToolbarContent" >
					<aon:commandButton id="variables"
						reRender="showVariableWindow" immediate="true"
						value="Variables" actionListener="#{htmlTemplate.onVariablesInfo}"
						styleClass="aon-finding-toolbar-item aon-icon-info" />	
				</ui:define>	
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="dataTable" columns="2" >
				
					<aon:outputLabel for="RegistryAttachment_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="RegistryAttachment_description" required="true"
						value="#{htmlTemplate.to.description}" maxlength="64" size="40" />

					<aon:outputLabel for="RegistryAttachment_attachDate"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="RegistryAttachment_attachDate"
						popupDateFormat="#{bundle.aon_date_pattern}"
						value="#{htmlTemplate.to.attachDate}" />

					<aon:outputLabel for="RegistryAttachment_scope"
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="RegistryAttachment_scope" 
						value="#{htmlTemplate.to.scope}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="RegistryAttachment_data"
						value="#{bundle.aon_template}" />
					<aon:inputRichText id="RegistryAttachment_data" required="true"
						value="#{htmlTemplate.aonFile.data}"
						converter="aon.ByteArrayConverter"
						height="500" width="700"
						configuration="tinyMCE" />	
				</aon:panelGrid>
			</aon:div>
		</aon:form>

		<ui:include src="/com/code/aon/ui/marketing/facelet/htmlTemplate/variableModal.xhtml" />
	</ui:define>
</ui:composition>
