<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="newsForm">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_news_module}" />
				<ui:param name="controller" value="#{news}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">

					<aon:outputLabel for="News_id"
						rendered="#{!news.new}" value="#{bundle.aon_id}" />
					<aon:inputText id="News_id" value="#{news.to.id}" required="true"
						rendered="#{!news.new}" size="15" disabled="true" />

					<aon:outputLabel for="News_title"
						value="#{marketingBundle.marketing_news_title}" />
					<aon:inputText id="News_title" required="true"
						value="#{news.to.title}" size="60" maxlength="128" />
						
					<aon:outputLabel for="News_category"
						value="#{marketingBundle.marketing_news_channel}" />
					<aon:selectOneMenu id="News_category" required="true"
						value="#{news.to.category}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{marketingCollections.channels}" />
					</aon:selectOneMenu>												

					<aon:outputLabel for="News_scope_id"
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="News_scope_id" required="true"
						value="#{news.to.scope}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="News_description"
						value="#{bundle.aon_description}" />
					<aon:inputTextarea id="News_description" required="true"
						value="#{news.to.description}" cols="60" rows="4" >
						<f:validateLength  maximum="1024"/>
					</aon:inputTextarea>						

					<aon:outputLabel id="News_url-label" for="News_url"
						styleClass="#{news.to.rss?'aon-input-required':'aon-outputLabel'}"
						value="#{marketingBundle.marketing_news_url}" />
					<aon:inputText id="News_url" required="#{news.to.rss}"
						value="#{news.to.url}" size="80" maxlength="256" />
						
					<ui:include src="/com/code/aon/ui/registry/facelet/corporateIdentity/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{news.to.registryAttachment}" />
						<ui:param name="lookupLabel" value="#{marketingBundle.marketing_news_image}" />
						<ui:param name="lookupControllerListener" value="#{newsletter.imageFilter}" />
					</ui:include>
						
					<aon:outputLabel for="News_initDate"
						value="#{bundle.aon_start_date}" />
					<aon:selectInputDate id="News_initDate"
						value="#{news.to.initDate}" timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>		

					<aon:outputLabel for="News_endDate"
						value="#{bundle.aon_end_date}" />
					<aon:selectInputDate id="News_endDate"
						value="#{news.to.endDate}" timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>		

					<aon:outputLabel for="News_rss"
						value="#{marketingBundle.marketing_news_publish_rss}" />
					<aon:selectBooleanCheckbox id="News_rss" 
						reRender="News_url-label,News_url"
						value="#{news.to.rss}" />

					<aon:outputLabel for="News_active"
						value="#{bundle.aon_active}" />
					<aon:selectBooleanCheckbox id="News_active" 
						value="#{news.to.active}" />

					<aon:outputLabel for="News_content"
						value="#{bundle.aon_content}" />
					<aon:inputRichText id="News_content" required="true"
						value="#{news.to.content}"
						height="500" width="700"
						configuration="tinyMCE" >	
						<f:param name="theme_advanced_buttons2_add" value="|,code"/>
					</aon:inputRichText>
						
				</aon:panelGrid>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{documentLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
