<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="newsForm">
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >		
				<ui:param name="toolbarTitle" value="#{news.label}" />
				<ui:param name="controller" value="#{news}" />
				<ui:define name="beforeSpinToolbarContent" >
					<aon:commandButton id="sendEmail"
						reRender="showNewMessageWindow" immediate="true"
						value="#{bundle.webmail_send}" rendered="#{!news.nevv}"
						actionListener="#{news.onSendEmail}"
						styleClass="aon-finding-toolbar-item aon-icon-webmail2" />	
				</ui:define>				
			</ui:decorate>	

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">

					<aon:outputLabel for="News_title"
						value="#{(news.to.type  == 'NEWS')?bundle.aon_title:bundle.aon_subject}" />
					<aon:inputText id="News_title" required="true"
						value="#{news.to.title}" size="60" maxlength="128" />
					<aon:if test="#{news.to.type  == 'NEWS'}" >						
						<aon:outputLabel for="News_category"
							value="#{bundle.marketing_news_channel}" />
						<aon:div>
							<aon:selectOneMenu id="News_category" required="true"
								value="#{news.to.category}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{marketingCollections.channels}" />
							</aon:selectOneMenu>
							<aon:commandLink id="channel_link" immediate="true"
									styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
									value="&#160;" title="#{bundle.aon_go}"
									actionListener="#{news.onViewChannel}"
									action="channel_list" />
						</aon:div>
					</aon:if>												

					<aon:outputLabel for="News_scope_id"
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="News_scope_id" required="true"
						value="#{news.to.scope}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>
					
					<aon:if test="#{news.to.type  == 'NEWS'}" >
						<aon:outputLabel for="News_description"
							value="#{bundle.aon_description}" />
						<aon:inputTextarea id="News_description" required="true"
							value="#{news.to.description}" cols="60" rows="4" >
							<f:validateLength  maximum="1024"/>
						</aon:inputTextarea>						
	
						<aon:outputText rendered="#{!news.nevv}"
							value="#{bundle.aon_document_download_url}" />
						<aon:outputLink rendered="#{!news.nevv}" 
							target="_blank" value="#{news.downloadURL}" >
							<aon:outputText value="#{news.downloadURL}" />
					    </aon:outputLink>
							
						<ui:include src="/com/code/aon/ui/registry/facelet/corporateIdentity/lookupImage.xhtml" >
							<ui:param name="lookupTo" value="#{news.to.registryAttachment}" />
							<ui:param name="lookupControllerListener" value="#{newsletter.imageFilter}" />
						</ui:include>
					</aon:if>
					
					<aon:if test="#{news.to.type  == 'MESSAGE'}" >
						<ui:include src="/com/code/aon/ui/registry/facelet/corporateIdentity/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{news.to.registryAttachment}" />
						</ui:include>					
					</aon:if>
					
					<ui:include src="/com/code/aon/ui/marketing/facelet/marketingTemplate/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{news.to.template}" />
					</ui:include>										
						
					<aon:outputLabel for="News_initDate"
						value="#{bundle.aon_start_date}" />
					<aon:selectInputDate id="News_initDate" inputSize="16"
						value="#{news.to.initDate}" timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_timestamp2_pattern}">
					</aon:selectInputDate>		

					<aon:if test="#{news.to.type  == 'NEWS'}" >
						<aon:outputLabel for="News_endDate"
							value="#{bundle.aon_end_date}" />
						<aon:selectInputDate id="News_endDate" inputSize="16"
							value="#{news.to.endDate}" timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_timestamp2_pattern}">
						</aon:selectInputDate>		
	
						<aon:outputLabel for="News_rss"
							value="#{bundle.marketing_news_publish_rss}" />
						<aon:selectBooleanCheckbox id="News_rss" 
							reRender="News_url-label,News_url"
							value="#{news.to.rss}" />
					</aon:if>

					<aon:outputLabel for="News_active"
						value="#{bundle.aon_active}" />
					<aon:selectBooleanCheckbox id="News_active" 
						value="#{news.to.active}" />

					<aon:outputLabel for="News_content"
						value="#{bundle.aon_content}" />
					<aon:inputRichText id="News_content" required="true"
						value="#{news.to.content}"
						height="500" width="700"
						configuration="tinyMCE" />	
						
				</aon:panelGrid>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{imageLookup}" />
		<aon:lookupButtonPopup lookup="#{documentLookup}" />
		<aon:lookupButtonPopup lookup="#{marketingTemplateLookup}" />
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
	</ui:define>
</ui:composition>

</body>
</html>
