<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="targetList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_target_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_listing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="accept" value="#{bundle.aon_accept}"
						action="campaignAction_form" actionListener="#{campaignActionTarget.onAcceptTargets}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_accept}" />				
					<aon:commandButton value="#{bundle.aon_search}"
						action="campaignActionTarget_search" actionListener="#{target.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}" />
					<aon:commandButton value="#{bundle.aon_back}"
						action="campaignAction_form" actionListener="#{target.onCancel}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						accesskey="#{bundle.aon_key_cancel}" />			
				</ui:define>
			</ui:decorate>			

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<aon:div styleClass="aon-toolbar" rendered="#{target.model.rowCount > 0}">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						ajaxSingle="true" reRender="targetDataDiv,aonToolbar"
						actionListener="#{target.checkAll}"/>	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						ajaxSingle="true" reRender="targetDataDiv,aonToolbar"
						actionListener="#{target.checkNone}" />				
				</aon:div>
					
				<aon:div id="targetDataDiv">					
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{target}" />
						<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
						<ui:param name="skipSelectButton" value="#{true}" />
						<ui:define name="columns">
						
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:selectBooleanCheckbox id="Included_Row_checked"
									value="#{target.rowChecked}"
									ajaxSingle="true" reRender="aonToolbar" />	
							</aon:column>
	
							<ui:include
								src="/com/code/aon/ui/commercial/facelet/target/listBasic.xhtml" />
				
							<aon:column alias="#{controller.aliasPreffix}.registry.alias"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_company_alias}" />
								</f:facet>
								<aon:outputText value="#{to.registry.alias}" />
							</aon:column>
				
							<aon:column alias="#{controller.aliasPreffix}.advertising"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{commercialBundle.commercial_target_advertising}" />
								</f:facet>
								<aon:outputText value="#{to.advertising}"/>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
	
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
