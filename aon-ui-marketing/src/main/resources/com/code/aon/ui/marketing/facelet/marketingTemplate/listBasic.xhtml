<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
					
	<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60"
		alias="Template.id" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_id}" />
		</f:facet>
		<aon:outputText value="#{to.id}"/>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn"
		alias="Template.name" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_name}" />
		</f:facet>
		<aon:outputText value="#{to.name}"/>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn"
		alias="Template.subject" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_subject}" />
		</f:facet>
		<aon:outputText value="#{to.subject}"/>
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-textColumn aon-width-100"
		alias="Template.creationDate" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.marketing_creationDate}" />
		</f:facet>
		<aon:outputText value="#{to.creationDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
			timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>					
	</aon:column>
					
</ui:composition>
