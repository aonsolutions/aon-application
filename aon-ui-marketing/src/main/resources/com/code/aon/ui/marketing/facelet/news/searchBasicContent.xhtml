<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
		<ui:param name="searchController" value="#{scopeSearch}" />
	</aon:if>
					
	<aon:outputLabel for="News_title"
		value="#{bundle.aon_title}" />
	<aon:inputText id="News_title" size="60"
		valueChangeListener="#{controller.addExpression}" />
			
	<ui:include
		src="/com/code/aon/ui/config/facelet/scope/searchContent.xhtml" />		
			
	<aon:if test="#{news.type  == 'NEWS'}" >			
		<aon:outputLabel for="News_category_id"
			value="#{bundle.marketing_news_channel}" />
		<aon:selectOneMenu id="News_category_id"
			value="#{marketingCollections.category}" 
			valueChangeListener="#{controller.addIdEqualExpression}">
			<f:selectItem itemLabel="-" value="#{null}"/>
			<f:selectItems value="#{marketingCollections.channels}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="News_description"
			value="#{bundle.aon_description}" />
		<aon:inputText id="News_description" size="60"
			valueChangeListener="#{controller.addExpression}" />

		<aon:outputLabel for="News_url"
			value="#{bundle.marketing_news_url}" />
		<aon:inputText id="News_url" size="60"
			valueChangeListener="#{controller.addExpression}" />			
	</aon:if>					

	<aon:outputLabel for="News_content"
		value="#{bundle.aon_content}" />
	<aon:inputText id="News_content" size="60"
		valueChangeListener="#{controller.addExpression}" />
		
	<aon:outputText value="#{bundle.aon_start_date}" />
	<aon:div>
		<aon:outputLabel for="News_initDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="News_initDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>

		<aon:outputLabel for="News_initDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="News_initDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>
	</aon:div>						
					
	<aon:if test="#{news.type  == 'NEWS'}" >
		<aon:outputText value="#{bundle.aon_end_date}" />
		<aon:div>
			<aon:outputLabel for="News_endDate-From" styleClass="aon-form-date-label"
				value="#{bundle.aon_date_from}:" />
			<aon:selectInputDate id="News_endDate-From"
				valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}">
			</aon:selectInputDate>
	
			<aon:outputLabel for="News_endDate-To" styleClass="aon-form-date-label"
				value="#{bundle.aon_date_to}:" />
			<aon:selectInputDate id="News_endDate-To"
				valueChangeListener="#{controller.addLessThanOrEqualExpression}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}">
			</aon:selectInputDate>
		</aon:div>
	</aon:if>						

	<aon:if test="#{news.type  == 'NEWS'}" >
		<aon:outputLabel for="News_rss"				
			value="#{bundle.marketing_news_publish_rss}"/>
		<aon:selectOneMenu id="News_rss"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="-" value="#{null}"/>
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneMenu>
	</aon:if>
	
	<aon:outputLabel for="News_active"				
		value="#{bundle.aon_active}"/>
	<aon:selectOneMenu id="News_active"
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
		<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
	</aon:selectOneMenu>

</ui:composition>
