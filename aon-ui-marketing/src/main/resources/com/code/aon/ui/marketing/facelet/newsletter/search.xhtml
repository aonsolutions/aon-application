<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="newsletterSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_newsletter_module}" />
				<ui:param name="controller" value="#{newsletter}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{newsletter}" />
				<ui:define name="searchContent">
					
					<aon:outputLabel for="Newsletter_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="Newsletter_name" size="80"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Newsletter_subject"
						value="#{bundle.aon_subject}" />
					<aon:inputText id="Newsletter_subject" size="80"
						valueChangeListener="#{controller.addExpression}" />
						
					<aon:outputLabel for="Newsletter_url"
						value="#{marketingBundle.marketing_news_url}" />
					<aon:inputText id="Newsletter_url" size="80"
						valueChangeListener="#{controller.addExpression}" />		
						
					<aon:outputText value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Newsletter_date-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Newsletter_date-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
				
						<aon:outputLabel for="Newsletter_date-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Newsletter_date-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
					</aon:div>													
												
					<aon:outputLabel for="Newsletter_layout"
						value="#{marketingBundle.marketing_newsletter_layout}" />
					<aon:selectOneMenu id="Newsletter_layout"
						converter="aon.EnumConverter"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{marketingCollections.newsletterLayouts}" />		
					</aon:selectOneMenu>	
													
					<aon:outputLabel for="Newsletter_highlightFirst"				
						value="#{marketingBundle.marketing_newsletter_highlightFirst}"/>
					<aon:selectOneMenu id="Newsletter_highlightFirst"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
					</aon:selectOneMenu>
													
					<aon:outputLabel for="Newsletter_active"				
						value="#{bundle.aon_active}"/>
					<aon:selectOneMenu id="Newsletter_active"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
					</aon:selectOneMenu>
														
				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
	</ui:define>
		
</ui:composition>
