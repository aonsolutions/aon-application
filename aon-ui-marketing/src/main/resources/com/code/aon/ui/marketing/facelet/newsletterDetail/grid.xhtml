<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{newsletterDetail}" />
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="News_id"
						value="#{bundle.marketing_news}" />
				</f:facet>
				<aon:outputText value="#{to.news.title}"
					rendered="#{formList}" />
				<ui:include src="/com/code/aon/ui/marketing/facelet/news/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{controller.to.news}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<ui:param name="lookupControllerListener" value="#{newsletter.newsFilter}" />
				</ui:include>
				<f:facet name="footer" >
					<ui:include src="/com/code/aon/ui/marketing/facelet/news/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{controller.to.news}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="lookupSuffix" value="-New" />
						<ui:param name="lookupControllerListener" value="#{newsletter.newsFilter}" />
					</ui:include>
				</f:facet>	
			</aon:column>
			
			<aon:column styleClass="aon-width-70">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_position}" />
				</f:facet>
				<aon:div onmouseover="disableRowSelector();" onmouseup="disableRowSelector();"
					onmouseout="enableRowSelector();">				
					<aon:commandButton id="movePageUp"
						title="#{bundle.aon_up}"								
						actionListener="#{controller.onMoveUp}"
						rendered="#{to.position != 0}" ajaxSingle="true"
						styleClass="aon-editDataTable-button aon-icon-up" />
					<aon:commandButton id="movePageDown"
						title="#{bundle.aon_down}"								
						actionListener="#{controller.onMoveDown}"
						rendered="#{to.position &lt; (controller.model.rowCount - 1)}" ajaxSingle="true"
						styleClass="aon-editDataTable-button aon-icon-down" />
				</aon:div>
			</aon:column>			

		</ui:define>
	</ui:decorate>

</ui:composition>
