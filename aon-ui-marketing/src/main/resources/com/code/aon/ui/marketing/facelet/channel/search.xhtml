<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="channelSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.marketing_channel_module}" />
				<ui:param name="controller" value="#{channel}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{channel}" />
				<ui:define name="searchContent">
					
					<aon:outputLabel for="Category_name"
						value="#{bundle.aon_title}" />
					<aon:inputText id="Category_name" size="80"
						valueChangeListener="#{controller.addExpression}" />
			
					<aon:outputLabel for="Category_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Category_description" size="80"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Category_url"
						value="#{bundle.marketing_news_url}" />
					<aon:inputText id="Category_url" size="80"
						valueChangeListener="#{controller.addExpression}" />	
						
					<ui:include src="/com/code/aon/ui/config/facelet/scope/searchContent.xhtml" >
						<ui:param name="searchController" value="#{scopeSearch}" />
					</ui:include>						

				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
	</ui:define>
		
</ui:composition>
