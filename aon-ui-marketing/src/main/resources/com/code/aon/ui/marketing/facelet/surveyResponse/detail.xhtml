<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<aon:div styleClass="aon-scroll-area">
	
		<aon:dataTable id="surveyResponseDetailData" value="#{surveyResponseDetail.model}"
			var="to" rows="20" rendered="#{surveyResponseDetail.model.rowCount > 0}"
			columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn">
		
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{marketingBundle.marketing_question}" />
				</f:facet>
				<aon:outputText value="#{to.question.text}"/>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.question.type}"/>
			</aon:column>
		
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{marketingBundle.marketing_response}" />
				</f:facet>
				<ui:include src="/com/code/aon/ui/marketing/facelet/util/outputValue.xhtml" >
					<ui:param name="valueHolder" value="#{to}" />
				</ui:include>
			</aon:column>
		
		</aon:dataTable>
		
		<aon:dataScroller2 for="surveyResponseDetailData" showNote="true" />

	</aon:div>

</ui:composition>
