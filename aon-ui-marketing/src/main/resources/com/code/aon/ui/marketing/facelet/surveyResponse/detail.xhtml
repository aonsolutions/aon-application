<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<aon:div styleClass="aon-scroll-area">
	
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:param name="controller" value="#{surveyResponseDetail}" />
			<ui:param name="skipSelectButton" value="#{true}" />
			<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
			<ui:define name="columns">
	
				<aon:column styleClass="aon-editDataTable-textColumn"
					alias="SurveyResponseDetail.question.text">
					<f:facet name="header">
						<aon:outputText value="#{bundle.registry_question}" />
					</f:facet>
					<aon:outputText value="#{to.question.text}"/>
				</aon:column>
				
				<aon:column styleClass="aon-editDataTable-textColumn"
					alias="SurveyResponseDetail.question.type">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_type}" />
					</f:facet>
					<aon:outputText value="#{to.question.type}"/>
				</aon:column>
			
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.registry_response}" />
					</f:facet>
					<ui:include src="/com/code/aon/ui/registry/facelet/valueHolder/outputValue.xhtml" >
						<ui:param name="valueHolder" value="#{to}" />
					</ui:include>
				</aon:column>
				
			</ui:define>
		</ui:decorate>

	</aon:div>

</ui:composition>
