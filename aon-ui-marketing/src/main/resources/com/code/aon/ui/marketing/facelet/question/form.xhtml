<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="questionForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_question_module}" />
				<ui:param name="controller" value="#{question}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid id="menuGrid" columns="2" dir="true">

					<aon:outputLabel for="Question_id"
						rendered="#{!question.new}" value="#{bundle.aon_id}" />
					<aon:inputText id="Question_id" value="#{question.to.id}"
						rendered="#{!question.new}" size="15" disabled="true" />

					<aon:outputLabel for="Question_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Question_type" required="true"
						value="#{question.to.type}" disabled="#{!question.new}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{marketingCollections.questionTypes}" />
					</aon:selectOneMenu>
	
					<aon:outputLabel for="Question_text"
						value="#{bundle.aon_description}" />
					<aon:inputTextarea id="Question_text" required="true"
						value="#{question.to.text}" cols="60" rows="4" >
						<f:validateLength  maximum="255"/>
					</aon:inputTextarea>

					<aon:outputLabel for="Question_argument"
						value="#{marketingBundle.marketing_question_argument}" />
					<aon:inputTextarea id="Question_argument" 
						value="#{question.to.argument}" cols="60" rows="4" >
						<f:validateLength  maximum="1024"/>
					</aon:inputTextarea>
					
					<aon:outputLabel for="Question_active"
						value="#{marketingBundle.marketing_active}" />
					<aon:selectBooleanCheckbox id="Question_active" 
						value="#{question.to.active}" />

				</aon:panelGrid>

				<aon:div styleClass="aon-form-group" rendered="#{(!question.new) and (question.to.type != 'INFO')}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="questionValueData" value="#{marketingBundle.marketing_question_values}" />
						</aon:div>
					</aon:div>
					<ui:include src="/com/code/aon/ui/marketing/facelet/question/valueGrid.xhtml" />
				</aon:div>

			</aon:div>
		</aon:form>		
	</ui:define>
</ui:composition>

</body>
</html>
