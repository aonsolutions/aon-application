<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
		<ui:param name="searchController" value="#{scopeSearch}" />
	</aon:if>
					
	<aon:outputLabel for="RegistryAttachment_description"
		value="#{bundle.aon_name}" />
	<aon:inputText id="RegistryAttachment_description" size="60"
		valueChangeListener="#{controller.addExpression}" />

	<ui:include
		src="/com/code/aon/ui/config/facelet/scope/searchContent.xhtml" />		
	
	<aon:outputLabel for="RegistryAttachment_attachDate-From"
		value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="RegistryAttachment_attachDate-From" styleClass="aon-form-date-label aon-padding-right"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="RegistryAttachment_attachDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>

		<aon:outputLabel for="RegistryAttachment_attachDate-To" styleClass="aon-form-date-label aon-padding-right"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="RegistryAttachment_attachDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>

</ui:composition>
