<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="marketingTemplateSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_template_module}" />
				<ui:param name="controller" value="#{marketingTemplate}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{marketingTemplate}" />
				<ui:define name="searchContent">
					
					<aon:outputLabel for="Template_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Template_id" size="60"
						valueChangeListener="#{controller.addExpression}" />		
			
					<aon:outputLabel for="Template_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="Template_name" size="60"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Template_subject"
						value="#{webmailBundle.webmail_subject}" />
					<aon:inputText id="Template_subject" size="60"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Template_data"
						value="#{marketingBundle.marketing_template}" />
					<aon:inputText id="Template_data" size="60"
						valueChangeListener="#{controller.addExpression}" />
		
					<aon:outputLabel for="Template_scope_id"
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Template_scope_id"
						value="#{configCollections.scope}"
						valueChangeListener="#{controller.addIdEqualExpression}" >
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>
				
					<aon:outputText value="#{marketingBundle.marketing_creationDate}" />
					<aon:div>
						<aon:outputLabel for="Template_creationDate-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Template_creationDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
			
						<aon:outputLabel for="Template_creationDate-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Template_creationDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
					</aon:div>
									
					<aon:outputLabel for="Template_appendSignature"
						value="#{marketingBundle.marketing_template_append_signature}" />
					<aon:selectOneMenu id="Template_appendSignature"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="#{true}"/>
						<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="#{false}"/>
					</aon:selectOneMenu>
									
					<aon:outputLabel for="Template_active"				
						value="#{bundle.aon_status}"/>
					<aon:selectOneMenu id="Template_active"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="#{true}"/>
						<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="#{false}"/>
					</aon:selectOneMenu>

				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
	</ui:define>
		
</ui:composition>
