<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-scroll-area">
	
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:param name="controller" value="#{campaignAction}" />
			<ui:param name="showDataTable" value="#{true}" />
			<ui:param name="showNote" value="#{false}" />

			<ui:define name="selectFooterContent">
				<aon:commandButton alt="[#{bundle.aon_reset}]" value="&#160;"
					styleClass="aon-editDataTable-button aon-icon-reset"
					action="campaignAction_form" actionListener="#{campaignAction.onReset}"
					accesskey="#{bundle.aon_key_new_line}" />
			</ui:define>
			
			<ui:define name="columns">

				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{marketingBundle.marketing_action_media_type}" />
					</f:facet>
					<aon:outputText value="#{to.mediaType}"/>
				</aon:column>
		
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{marketingBundle.marketing_action_start_date}" />
					</f:facet>
					<aon:outputText value="#{to.startDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>					
				</aon:column>
	
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{marketingBundle.marketing_action_end_date}" />
					</f:facet>
					<aon:outputText value="#{to.endDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>					
				</aon:column>
		
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{marketingBundle.marketing_survey}" />
					</f:facet>
					<aon:outputText value="#{to.survey.description}"/>
				</aon:column>
	
			</ui:define>
			
		</ui:decorate>	
	</aon:div>

</ui:composition>
