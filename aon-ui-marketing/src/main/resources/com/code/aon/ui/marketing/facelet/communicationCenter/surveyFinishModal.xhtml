<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<rich:modalPanel id="surveyFinishModalPanel" 
		minWidth="540" minHeight="180">
		<f:facet name="header">
			<aon:div styleClass="aon-popupWindow-title">
				<aon:outputText value="#{marketingBundle.marketing_survey_finish}" />
			</aon:div>
		</f:facet>
		<aon:form>
			<aon:div styleClass="aon-popupWindow-content">
				<aon:div styleClass="aon-popupWindow-content-internal">
					<aon:div id="signToolbar" styleClass="aon-toolbar">
						<aon:commandButton id="save"
							title="#{bundle.aon_key_save_accelerator}"
							value="#{bundle.aon_save}"
							action="communicationCenter"
							actionListener="#{communicationCenter.onFinishSurvey}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" >
							<rich:componentControl for="surveyFinishModalPanel"
								operation="hide" event="onclick" />
						</aon:commandButton>
						<aon:commandButton id="cancel"
							title="#{bundle.aon_key_cancel_accelerator}"
							value="#{bundle.aon_cancel}"
							immediate="true" reRender="aonStatus"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}" >
							<aon:actionHotKey key="esc" />
							<rich:componentControl for="surveyFinishModalPanel"
								operation="hide" event="onclick" />
						</aon:commandButton>
					</aon:div>
					
					<aon:panelGrid columns="2" >					
						<ui:include src="actionTargetStatus.xhtml" />	
					</aon:panelGrid>

				</aon:div>
			</aon:div>
		</aon:form>
	</rich:modalPanel>

</ui:composition>
