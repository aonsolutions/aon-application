<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="surveyResponseSearch">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_survey_response_module}" />
				<ui:param name="controller" value="#{surveyResponse}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{surveyResponse}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="SurveyResponse_survey_id"
						value="#{marketingBundle.marketing_survey}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="SurveyResponse_survey_id"
							lookup="#{surveyLookup}"
							reRender="SurveyResponse_survey_name"
							value="#{surveyResponseSearch.survey.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton 
							windowTitle="#{marketingBundle.marketing_survey_selection}"
							selectReRender="SurveyResponse_survey_id,SurveyResponse_survey_name"
							lookup="#{surveyLookup}" minHeight="460"
							property="#{surveyResponseSearch.survey}">
						</aon:lookupButton>
						<aon:inputText id="SurveyResponse_survey_name"
							value="#{surveyResponseSearch.survey.description}"
							size="80" disabled="true" />
					</aon:div>
					
					<aon:outputLabel for="SurveyResponse_action_id" 
						value="#{marketingBundle.marketing_campaign_action}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="SurveyResponse_action_id"
							lookup="#{campaignActionLookup}" 
							reRender="SurveyResponse_action_detail"
							value="#{surveyResponseSearch.action.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton
							windowTitle="#{marketingBundle.marketing_action_selection}"
							selectReRender="SurveyResponse_action_id,SurveyResponse_action_detail"
							lookup="#{campaignActionLookup}" minHeight="440"
							property="#{surveyResponseSearch.action}">
						</aon:lookupButton>
						<aon:inputText id="SurveyResponse_action_detail"
							value="#{surveyResponseSearch.action.campaign.description}"
							size="80" disabled="true" />
					</aon:div>
					
					<aon:outputLabel for="SurveyResponse_target_id"
						value="#{commercialBundle.commercial_target}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="SurveyResponse_target_id"
							lookup="#{targetLookup}"
							reRender="SurveyResponse_target_name"
							value="#{surveyResponseSearch.target.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton 
							windowTitle="#{commercialBundle.commercial_target_selection}" actionType="search"
							selectReRender="SurveyResponse_target_id,SurveyResponse_target_name"
							lookup="#{targetLookup}" minHeight="460" minWidth="650"
							property="#{surveyResponseSearch.target}">
						</aon:lookupButton>
						<aon:inputText id="SurveyResponse_target_name"
							value="#{(surveyResponseSearch.target.registry.name!=null)?(surveyResponseSearch.target.registry.fullName):('')}"
							size="80" disabled="true" />
					</aon:div>

					<aon:outputLabel for="SurveyResponse_user_name"
						value="#{bundle.aon_login_user}" />
					<aon:inputText id="SurveyResponse_user_name" size="60"
						valueChangeListener="#{surveyResponse.addExpression}" />		
			
				</ui:define>			
			</ui:decorate>
							 
		</aon:form>
		<aon:lookupButtonPopup lookup="#{surveyLookup}" />
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
		<aon:lookupButtonPopup lookup="#{campaignActionLookup}" />
	</ui:define>
		
</ui:composition>
