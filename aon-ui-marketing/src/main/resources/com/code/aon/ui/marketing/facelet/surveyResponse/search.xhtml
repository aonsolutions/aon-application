<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="surveyResponseSearch">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.marketing_survey_response_module}" />
				<ui:param name="controller" value="#{surveyResponse}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{surveyResponse}" />
				<ui:define name="searchContent">

					<ui:include src="/com/code/aon/ui/marketing/facelet/survey/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{surveyResponseSearch.survey}" />
					</ui:include>	

					<ui:include src="/com/code/aon/ui/marketing/facelet/campaignAction/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{surveyResponseSearch.action}" />
					</ui:include>	
					
					<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
						<ui:param name="lookupTo" value="#{surveyResponseSearch.registry}" />
						<ui:param name="lookupLabel" value="#{bundle.marketing_survey_respondent}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>					
					
					<ui:include src="/com/code/aon/ui/config/facelet/user/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{surveyResponseSearch.user}" />
					</ui:include>								
			
					<aon:outputText value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="SurveyResponse_date-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="SurveyResponse_date-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
				
						<aon:outputLabel for="SurveyResponse_date-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="SurveyResponse_date-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
					</aon:div>		
					
					<ui:include src="/com/code/aon/ui/registry/facelet/question/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{surveyResponseSearch.question}" />
						<ui:param name="lookupControllerListener" value="#{question.notInfoListener}" />
						<ui:param name="lookupReRender" value="registryProfileValueId" />
						<aon:methodParam name="lookupChangeListener"
							value="#{surveyResponseSearch.questionChanged}" type="lookupChangeListener" />														
					</ui:include>				
			
					<aon:div styleClass="aon-padding-top">				
						<aon:outputLabel for="RegistryProfile_value"
							value="#{bundle.aon_value}" />
					</aon:div>
					<aon:div id="registryProfileValueId">
						<aon:div rendered="#{surveyResponseSearch.questionResolved}">
							<ui:include src="/com/code/aon/ui/registry/facelet/valueHolder/inputValueEx.xhtml" >
								<ui:param name="inputId" value="RegistryProfile_value" />
								<ui:param name="valueHolder" value="#{surveyResponseSearch.questionValue}" />
								<ui:param name="questionValueId" value="#{surveyResponseSearch.questionValueId}" />
								<ui:param name="questionValues" value="#{surveyResponseSearch.questionValues}" />
							</ui:include>
						</aon:div>								
					</aon:div>
			
				</ui:define>			
			</ui:decorate>
							 
		</aon:form>
		<aon:lookupButtonPopup lookup="#{surveyLookup}" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
		<aon:lookupButtonPopup lookup="#{campaignActionLookup}" />
		<aon:lookupButtonPopup lookup="#{userLookup}" />
		<aon:lookupButtonPopup lookup="#{questionLookup}" />
	</ui:define>
		
</ui:composition>
