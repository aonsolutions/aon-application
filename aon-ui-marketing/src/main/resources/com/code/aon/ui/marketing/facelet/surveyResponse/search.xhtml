<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="surveyResponseSearch">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_survey_response_module}" />
				<ui:param name="controller" value="#{surveyResponse}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{surveyResponse}" />
				<ui:define name="searchContent">

					<ui:include src="/com/code/aon/ui/marketing/facelet/survey/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{communicationCenter.survey}" />
					</ui:include>	
					
					<aon:outputLabel for="SurveyResponse_action_id" 
						value="#{marketingBundle.marketing_campaign_action}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="SurveyResponse_action_id"
							lookup="#{campaignActionLookup}" 
							reRender="SurveyResponse_action_detail"
							value="#{surveyResponseSearch.action.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton
							windowTitle="#{marketingBundle.marketing_action_selection}"
							selectReRender="SurveyResponse_action_id,SurveyResponse_action_detail"
							lookup="#{campaignActionLookup}" minHeight="440"
							property="#{surveyResponseSearch.action}">
						</aon:lookupButton>
						<aon:inputText id="SurveyResponse_action_detail"
							value="#{surveyResponseSearch.action.campaign.description}"
							size="80" disabled="true" />
					</aon:div>
					
					<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{surveyResponseSearch.target}" />
					</ui:include>						

					<aon:outputLabel for="SurveyResponse_user_name"
						value="#{bundle.aon_login_user}" />
					<aon:inputText id="SurveyResponse_user_name" size="60"
						valueChangeListener="#{surveyResponse.addExpression}" />		
			
				</ui:define>			
			</ui:decorate>
							 
		</aon:form>
		<aon:lookupButtonPopup lookup="#{surveyLookup}" />
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
		<aon:lookupButtonPopup lookup="#{campaignActionLookup}" />
	</ui:define>
		
</ui:composition>
