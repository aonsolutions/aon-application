<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{surveyQuestion}" />
			<ui:param name="columnClasses" value="aon-editDataTable-numberColumn aon-width-80, aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
			<ui:param name="formEdit" value="#{(to==surveyQuestion.to) and (!surveyQuestion.showSurveyWorkflowWindow)}" />		
			<ui:param name="formList" value="#{(to!=surveyQuestion.to) or surveyQuestion.showSurveyWorkflowWindow}" />
			<ui:define name="columns">
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel for="SurveyQuestion_position" value="#{marketingBundle.marketing_survey_question_position}" />
					</f:facet>
					<aon:outputText value="#{to.position}"
						rendered="#{formList}" />
					<aon:inputText id="SurveyQuestion_position" rendered="#{formEdit}"
						value="#{controller.to.position}"
						size="5" required="true" maxlength="10" />
					<f:facet name="footer">
						<aon:inputText id="SurveyQuestion_position-New" rendered="#{formNew}"
							value="#{controller.to.position}"
							required="true" size="5" maxlength="10" />
					</f:facet>
				</aon:column>
							
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel for="SurveyQuestion_question_id" value="#{marketingBundle.marketing_question}" />
					</f:facet>
					<aon:outputText value="#{to.question.text}"
						rendered="#{formList}" >
						<aon:abbreviateConverter maxWidth="80" />
					</aon:outputText>					
					<aon:div styleClass="aon-lookup" rendered="#{formEdit}">
						<aon:lookupInputText id="SurveyQuestion_question_id"
							lookup="#{questionLookup}" required="true"
							reRender="SurveyQuestion_question_detail"
							value="#{surveyQuestion.to.question.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton windowTitle="#{marketingBundle.marketing_question_selection}" 
							selectReRender="SurveyQuestion_question_id,SurveyQuestion_question_detail"
							lookup="#{questionLookup}" minHeight="460" minWidth="650"
							property="#{surveyQuestion.to.question}">
						</aon:lookupButton>
						<aon:inputText id="SurveyQuestion_question_detail"
							value="#{controller.to.question.text}"
							size="80" disabled="true" />
					</aon:div>				
					<f:facet name="footer">
						<aon:div styleClass="aon-lookup" rendered="#{formNew}">
							<aon:lookupInputText id="SurveyQuestion_question_id-New"
								lookup="#{questionLookup}" required="true"
								reRender="SurveyQuestion_question_detail-New"
								value="#{surveyQuestion.to.question.id}" size="5">
							</aon:lookupInputText>
							<aon:lookupButton windowTitle="#{marketingBundle.marketing_question_selection}" 
								selectReRender="SurveyQuestion_question_id-New,SurveyQuestion_question_detail-New"
								lookup="#{questionLookup}" minHeight="460" minWidth="650"
								property="#{surveyQuestion.to.question}">
							</aon:lookupButton>
							<aon:inputText id="SurveyQuestion_question_detail-New"
								value="#{controller.to.question.text}"
								size="80" disabled="true" />
						</aon:div>
					</f:facet>				
				</aon:column>
								
				<aon:column width="80">
					<f:facet name="header">
						<aon:outputText value="#{marketingBundle.marketing_survey_workflow}" />
					</f:facet>
					<aon:commandButton style="border:0;" styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
						actionListener="#{surveyQuestion.onShowSurveyWorflow}"
						onmouseover="disableRowSelector();" oncomplete="enableRowSelector();" onmouseout="enableRowSelector();"
						rendered="#{to.question.type != 'INFO'}" immediate="true"
						reRender="surveyWorkflowWindow">
						<aon:outputText value="&#160;" />
					</aon:commandButton>					
				</aon:column>
														
			</ui:define>
		</ui:decorate>

	</aon:div>
</ui:composition>
