<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{surveyQuestion}" />
			<ui:param name="formEdit" value="#{(to==surveyQuestion.to) and (!surveyQuestion.showSurveyWorkflowWindow)}" />		
			<ui:param name="formList" value="#{(to!=surveyQuestion.to) or surveyQuestion.showSurveyWorkflowWindow}" />
			<ui:define name="columns">
				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
					<f:facet name="header">
						<aon:outputLabel for="SurveyQuestion_position" value="#{bundle.aon_position}" />
					</f:facet>
					<aon:outputText value="#{to.position}"
						rendered="#{formList}" />
					<aon:inputText id="SurveyQuestion_position" rendered="#{formEdit}"
						value="#{controller.to.position}"
						size="5" required="true" maxlength="10" />
					<f:facet name="footer">
						<aon:inputText id="SurveyQuestion_position-New" rendered="#{formNew}"
							value="#{controller.to.position}"
							required="true" size="5" maxlength="10" />
					</f:facet>
				</aon:column>
							
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="Question_id" value="#{registryBundle.registry_question}" />
					</f:facet>
					<aon:outputText value="#{to.question.text}"
						rendered="#{formList}" >
						<aon:abbreviateConverter maxWidth="80" />
					</aon:outputText>					
					
					<ui:include src="/com/code/aon/ui/registry/facelet/question/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{surveyQuestion.to.question}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formEdit}" />
					</ui:include>
					<f:facet name="footer" >
						<ui:include src="/com/code/aon/ui/registry/facelet/question/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{surveyQuestion.to.question}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupSuffix" value="-New" />
						</ui:include>
					</f:facet>					
				</aon:column>
								
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_sequence}" />
					</f:facet>
					<aon:commandButton style="border:0;" styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
						actionListener="#{surveyQuestion.onShowSurveyWorflow}"
						onmouseover="disableRowSelector();" oncomplete="enableRowSelector();" onmouseout="enableRowSelector();"
						rendered="#{to.question.type != 'INFO'}" immediate="true"
						reRender="surveyWorkflowWindow">
						<aon:outputText value="&#160;" />
					</aon:commandButton>					
				</aon:column>
														
			</ui:define>
		</ui:decorate>

	</aon:div>
</ui:composition>
