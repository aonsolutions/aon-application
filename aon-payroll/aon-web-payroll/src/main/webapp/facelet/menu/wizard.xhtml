<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="wizardMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGrid id="group_wizard"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-master aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.certificate_menu_group}" />
						</f:facet>					
						<aon:div styleClass="aon-direct-access-list">

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="contractGenerationWizard" 
									action="contractGenerationWizard_step0"
									actionListener="#{contractGenerationWizard.onStart}"
									value="#{payrollBundle.contractGenerationWizard_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="parteitGenerationWizard" 
									action="certificateBatchGenerationWizard_step0"
									disabled="true"
									value="#{payrollBundle.parteitWizard_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="contractModificationWizard" 
									action="certificateBatchGenerationWizard_step0"
									disabled="true"
									value="#{payrollBundle.contractModificationWizard_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="contractDegenerationWizard" 
									action="certificateBatchGenerationWizard_step0"
									disabled="true"
									value="#{payrollBundle.contractSuspensionWizard_module}" />
							</aon:div>
							
	
						</aon:div>
					</aon:panelGrid>

					<aon:panelGrid id="certificate_wizard"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-master aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.certificate_menu_group}" />
						</f:facet>					
						<aon:div styleClass="aon-direct-access-list">

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="certificateBatchGenerationWizard" 
									action="certificateBatchGenerationWizard_step0"
									actionListener="#{certificateBatchGenerationWizard.onStart}"
									value="#{payrollBundle.certificateBatchGenerationWizard_module}" />
							</aon:div>
							
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="certificateFileGenerationWizard" 
									action="certificateFileGenerationWizard_step0"
									actionListener="#{certificateFileGenerationWizard.onStart}"
									value="#{payrollBundle.certificateFileGenerationWizard_module}" />
							</aon:div>
								
						</aon:div>
					</aon:panelGrid>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
