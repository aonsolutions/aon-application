<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="cashFlowForecastReportForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_cashflow_forecast_report_module}" />
				<ui:param name="controller" value="#{cashFlowForecastReport}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipBackButton" value="#{true}" />
			</ui:include>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{cashFlowForecastReport}" />
				<ui:define name="searchContent">

					<aon:outputLabel for="CashFlowForecastReport_fromDate" 
						value="#{financeBundle.finance_cashflow_from_date}" />
					<aon:selectInputDate id="CashFlowForecastReport_fromDate"
						value="#{controller.fromDate}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
						<a4j:support event="oninputchange" reRender="fromContainer"/>
						<a4j:support event="onchanged" reRender="fromContainer"/>
					</aon:selectInputDate>
						
					<aon:outputLabel for="CashFlowForecastReport_toDate" 
						 value="#{financeBundle.finance_cashflow_to_date}" />
					<aon:selectInputDate id="CashFlowForecastReport_toDate"
						value="#{controller.toDate}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputText value="&#160;"/>
					<aon:div>
						<aon:selectBooleanCheckbox id="CashFlowForecastReport_include_returned"
							value="#{controller.returnedFinanceIncluded}"/>
						<aon:outputLabel for="CashFlowForecastReport_include_returned" 
							value="#{financeBundle.finance_cashflow_include_returned}" />
					</aon:div>

					<aon:outputText value="&#160;"/>
					<aon:div id="fromContainer">
						<aon:selectBooleanCheckbox id="CashFlowForecastReport_include_pending" 
							value="#{controller.pendingFinanceIncluded}"/>
						<aon:outputLabel for="CashFlowForecastReport_include_pending" 
							value="#{financeBundle.finance_cashflow_include_pending} " />
						<aon:outputText value="#{cashFlowForecastReport.fromDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
							
					</aon:div>

					<aon:outputText value="#{financeBundle.finance_cashflow_banks}"/>
					<aon:div id="bankContainer">
						
						<aon:dataTable value="#{cashFlowForecastReport.bankModel}" var="cashFlowBank"
							rowClasses="none,none"
							style="background-color: #f6f5ff;">
						
							<aon:column styleClass="aon-editDataTable-iconColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:selectBooleanCheckbox value="#{cashFlowBank.enabled}"/>
							</aon:column>
							
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{configBundle.config_bank}" />
								</f:facet>
								<aon:outputText value="#{cashFlowBank.description}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-numberColumn">
								<f:facet name="header">
									<aon:outputText value="#{financeBundle.finance_cashflow_initial_balance}" />
								</f:facet>
								<aon:inputText value="#{cashFlowBank.initialBalance}" size="10"/>
							</aon:column>
							
						</aon:dataTable>
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
