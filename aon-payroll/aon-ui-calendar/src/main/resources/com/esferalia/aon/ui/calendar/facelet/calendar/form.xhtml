<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="calendarForm">
			<aon:methodParam name="removeAction" value="#{calendar.backAction}" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{calendarBundle.aon_calendar_menu}" />
				<ui:param name="controller" value="#{calendar}" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:htmlCommandLink id="calendarReport_list"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						actionListener="#{calendarPrint.onLoad}"
						value="#{bundle.aon_report}"
						rendered="#{!calendar.new}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="calendarReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<h:panelGrid columns="3"
					columnClasses="
					aon-vertical-align-top, 
					aon-vertical-align-top,
					aon-vertical-align-top">
				
					<aon:div>
						<aon:panel rendered="#{!calendar.missingSource}">
							<aon:panelGrid columns="2" id="calendar_header" style="width:100%;"
								columnClasses="aon-panelGrid-even aon-noborder aon-bold,
								aon-panelGrid-even aon-noborder">
								<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/form_header.xhtml" />
							</aon:panelGrid>
						</aon:panel>
						
						<aon:panel rendered="#{calendar.new}"> 
						<aon:panelGrid columns="2" id="calendar_data_new"
							columnClasses="aon-panelGrid-even aon-noborder aon-bold,
								aon-panelGrid-even aon-noborder">

							<aon:div>
								<aon:outputText value="#{calendarBundle.aon_calendar_use_existing}"
									style="padding-right:5px;" 
									rendered="#{calendar.new or calendar.usingExisting}" />
								<aon:selectBooleanCheckbox value="#{calendar.usingExisting}"
									rendered="#{calendar.new or calendar.usingExisting}">
									<a4j:support event="onclick" reRender="calendarForm" >
										<aon:actionListener method="#{calendar.onChangeUsingExisting}" />
									</a4j:support>
								</aon:selectBooleanCheckbox>
							</aon:div>
							<aon:div styleClass="aon-lookup" 
								rendered="#{calendar.usingExisting}">
								<aon:lookupInputText id="Calendar_masterCalendar_id-new"
									disabled="#{!calendar.usingExisting}"
									value="#{calendar.masterCalendar.id}" size="5"
									lookup="#{calendarLookup}" 
									lookupChangeListener="#{calendar.onCalendarLookupChanged}"
									reRender="Calendar_masterCalendar_name-new,calendar_data,calendar_data_new" />
								<aon:lookupButton
									disabled="#{!calendar.usingExisting}"
									windowTitle="#{calendarBundle.aon_calendar_calendar_select}"
									minHeight="460" minWidth="650" 
									lookup="#{calendarLookup}"
									lookupChangeListener="#{calendar.onCalendarLookupChanged}"
									selectReRender="Calendar_masterCalendar_id-new,Calendar_masterCalendar_name-new,calendar_data,calendar_data_new"
									actionType="search"
									property="#{calendar.masterCalendar}">
								</aon:lookupButton>
								<aon:inputText id="Calendar_masterCalendar_name-new"
									value="#{calendar.masterCalendar.description}"
									disabled="true" size="60" />
							</aon:div>
							
						</aon:panelGrid>
						</aon:panel>

						<aon:panelGrid columns="2" id="calendar_data" style="width:100%;"
							rendered="#{!(calendar.new and calendar.usingExisting)}">
							
							<aon:outputLabel for="Calendar_masterCalendar_id"
								value="#{calendarBundle.aon_calendar_inherit_from}" />
							<aon:div>
							<aon:div styleClass="aon-lookup" 
								rendered="#{calendar.editable}">
								<aon:lookupInputText id="Calendar_masterCalendar_id"
									value="#{calendar.masterCalendar.id}" size="5"
									lookup="#{calendarLookup}" 
									lookupChangeListener="#{calendar.onCalendarLookupChanged}"
									reRender="Calendar_masterCalendar_name,calendar_data" />
								<aon:lookupButton
									windowTitle="#{calendarBundle.aon_calendar_calendar_select}"
									minHeight="460" minWidth="650" 
									lookup="#{calendarLookup}"
									lookupChangeListener="#{calendar.onCalendarLookupChanged}"
									selectReRender="Calendar_masterCalendar_id,Calendar_masterCalendar_name,calendar_data"
									actionType="search"
									property="#{calendar.masterCalendar}">
								</aon:lookupButton>
								<aon:inputText id="Calendar_masterCalendar_name"
									value="#{calendar.masterCalendar.description}"
									disabled="true" size="60" />
							</aon:div>
							<aon:outputText value="#{calendar.to.calendar.description}"
								rendered="#{!calendar.editable}" />
							</aon:div>
								
							<aon:outputLabel rendered="#{!calendar.new}"
								value="#{bundle.aon_year}" />
							<rich:inputNumberSpinner value="#{calendar.year}"
							 	rendered="#{!calendar.new}"
								inputSize="4" minValue="2000" maxValue="2100"
								enableManualInput="true" step="1"
								ignoreDupResponses="true"
								cycled="false"  style="width:5px;height:5px;" >
								<a4j:support event="onchange" reRender="calendarForm, tabPanel, schedule"
									actionListener="#{calendar.onChangeYear}"
									ignoreDupResponses="true" />
							</rich:inputNumberSpinner>
					
							<aon:outputLabel for="Calendar_description"
								value="#{bundle.aon_description}" />
							<aon:inputText id="Calendar_description" size="40" maxlength="32"
								rendered="#{calendar.editable}"
								value="#{calendar.to.description}"  />
							<aon:outputText id="Calendar_description_edit" size="40" 
								rendered="#{!calendar.editable}"
								value="#{calendar.to.description}"  />
							
							<aon:outputLabel for="Calendar_anualHours"
								value="#{calendarBundle.aon_calendar_anual_hours}" />
							<aon:inputText id="Calendar_anualHours" size="10" maxlength="6"
								rendered="#{calendar.editable}"
								value="#{calendar.to.anualHours}" />
							<aon:outputText id="Calendar_anualHours_edit" size="10" 
								rendered="#{!calendar.editable}"
								value="#{calendar.to.anualHours}" />
								
							<aon:outputLabel for="Holiday_id"
								value="#{calendarBundle.aon_calendar_holiday}" />
							<aon:div styleClass="aon-lookup" rendered="#{calendar.editable}">
								<aon:lookupInputText id="Holiday_id"
									value="#{calendar.to.holiday.id}" size="5"
									lookup="#{holidayLookup}" reRender="Holiday_name" />
								<aon:lookupButton
									windowTitle="#{calendarBundle.aon_calendar_holiday}"
									minHeight="460" minWidth="650" property="#{calendar.to.holiday}"
									lookup="#{holidayLookup}"
									selectReRender="Holiday_id,Holiday_name"
									actionType="list">
								</aon:lookupButton>
								<aon:inputText id="Holiday_name"
									value="#{calendar.to.holiday.description}"
									disabled="true" size="60" />
							</aon:div>
							<aon:outputText id="Holiday_name_edit" size="60" 
								rendered="#{!calendar.editable}"
								value="#{calendar.to.holiday.description}" />
							
							<aon:outputLabel for="Calendar_comments"
								value="#{bundle.aon_comment}" />
							<aon:inputTextarea id="Calendar_comments"
								disabled="#{!calendar.editable}"
								value="#{calendar.to.comments}" cols="60" rows="5">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
						</aon:panelGrid>
					</aon:div>
					
					<aon:div id="schedule" styleClass="aon-scroll-area"
						rendered="#{!(calendar.new and calendar.usingExisting)}">
						<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/schedule_panel.xhtml" />
					</aon:div>
					
					<aon:div styleClass="aon-scroll-area">
						<c:if test="#{!calendar.new}" >
							<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/holiday_panel.xhtml" />
						</c:if>
					</aon:div>

				</h:panelGrid>
				
				<c:if test="#{!calendar.new}">
					<aon:div>
						<aon:panelTabSet id="tabPanel">
							<aon:panelTab label="#{calendarBundle.aon_calendar_holidays}">
<!--  
-->
								<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/inheritHolidays.xhtml" />
								<c:if test="#{calendar.editable}">
									<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendarHoliday/tab_grid.xhtml" />
								</c:if>
								<c:if test="#{!calendar.editable}">
									<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendarHoliday/tab_list.xhtml" />
								</c:if>
							</aon:panelTab>
							<aon:panelTab label="#{calendarBundle.aon_calendar_periods}">
<!--  
-->
								<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/inheritPeriods.xhtml" />
								<c:if test="#{calendar.editable}">
									<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendarPeriod/tab_grid.xhtml" />
								</c:if>
								<c:if test="#{!calendar.editable}">
									<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendarPeriod/tab_list.xhtml" />
								</c:if>
							</aon:panelTab>
							<aon:panelTab label="#{calendarBundle.aon_calendar_inherited}"
								rendered="#{calendar.masterCalendar!=null and calendar.masterCalendar.id!=null}">
								<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/inheritHolidays.xhtml" />
								<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/inheritPeriods.xhtml" />
							</aon:panelTab>
						</aon:panelTabSet>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>

		<aon:lookupButtonPopup lookup="#{holidayLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		<aon:lookupButtonPopup lookup="#{contractLookup}" />
		<aon:lookupButtonPopup lookup="#{calendarLookup}" />
		
	</ui:define>
</ui:composition>
