<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="httrabajadorList">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_avanzadas_hojas}" />
				<ui:param name="controller" value="#{httrabajador}"/>
				
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="httrabajadorData" value="#{httrabajador.model}"
					var="to" rows="20" 
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn">

					<aon:rowSelector action="httrabajador_form" actionListener="#{httrabajador.onSelect}" />
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.actividad.cdg}"/>
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_avanzadas_hojas_cen}" />
						</f:facet>
						<aon:outputText value="#{to.domicilio.cdg}"/>
					</aon:column>
					
						<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_avanzadas_hojas_ape1}" />
						</f:facet>
						<aon:outputText value="#{to.apellido1}"/>
					</aon:column>

 				</aon:dataTable>

				<aon:dataScroller2 for="httrabajadorData" showNote="true"   />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
