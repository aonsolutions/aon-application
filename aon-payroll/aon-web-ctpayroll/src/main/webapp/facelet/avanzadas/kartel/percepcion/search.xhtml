<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="percepcionSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_cotizacion_bases}" />
				<ui:param name="controller" value="#{percepcion}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>
			<!-- end toolbar navigation -->

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{percepcion.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="percepcion_list" />

					<aon:outputLabel for="Percepcion_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Percepcion_cdg" size="10" maxlength="15"
						valueChangeListener="#{percepcion.addExpression}" />

					<aon:outputLabel for="Percepcion_descripcion"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Percepcion_descripcion" size="60" maxlength="40"
						valueChangeListener="#{percepcion.addExpression}" />
						
					<aon:outputLabel for="Percepcion_tipo"
						value="#{appBundle.aon_payroll_avanzadas_kartel_percepcion_tipo}" />
					<aon:selectOneMenu id="Percepcion_tipo" valueChangeListener="#{percepcion.addExpression}" >
						<aon:enumConverter enum="com.code.aon.payroll.enumeration.TipoPercepcion" />
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{percepcion.listaTipos}" />
					</aon:selectOneMenu>

					<!-- Lineas de percepcion -->
					
					<aon:outputLabel for="Percepcion_linpercepcion_id_fecini"
						value="#{appBundle.aon_payroll_inicio}" />
					<aon:selectInputDate id="Percepcion_linpercepcion_id_fecini"
						renderAsPopup="true"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{percepcion.searchFecini}" />

					<aon:outputLabel for="Percepcion_linpercepcion_fecfin"
						value="#{appBundle.aon_payroll_fin}" />
					<aon:selectInputDate id="Percepcion_linpercepcion_fecfin"
						renderAsPopup="true"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{percepcion.searchFecfin}" />

					<aon:outputLabel for="Percepcion_linpercepcion_importe"
						value="#{appBundle.aon_payroll_avanzadas_kartel_percepcion_salario}" />
					<aon:inputText id="Percepcion_linpercepcion_importe" size="60"
						maxlength="60"
						valueChangeListener="#{percepcion.addExpression}" />

					<aon:outputLabel for="Percepcion_linpercepcion_empresa"
						value="#{appBundle.aon_payroll_avanzadas_kartel_percepcion_comp_empresa}" />
					<aon:inputText id="Percepcion_linpercepcion_empresa" size="60"
						maxlength="60"
						valueChangeListener="#{percepcion.addExpression}" />

					<aon:outputLabel for="Percepcion_linpercepcion_nocturno"
						value="#{appBundle.aon_payroll_avanzadas_kartel_percepcion_comp_nocturno}" />
					<aon:inputText id="Percepcion_linpercepcion_nocturno" size="60"
						maxlength="60"
						valueChangeListener="#{percepcion.addExpression}" />

				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>

</ui:composition>
