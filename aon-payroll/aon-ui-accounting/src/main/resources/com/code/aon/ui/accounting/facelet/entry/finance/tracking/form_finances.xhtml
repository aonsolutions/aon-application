<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-toolbar" rendered="#{financeTrackingEntry.finances.rowCount > 0}">
	
		<aon:commandButton title="#{bundle.aon_check_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkAll"
			value="#{bundle.aon_check_all}"
			actionListener="#{financeTrackingEntry.checkAllFinances}" reRender="financeDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
		<aon:commandButton title="#{bundle.aon_uncheck_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkNone"
			value="#{bundle.aon_uncheck_all}"
			actionListener="#{financeTrackingEntry.checkNoneFinances}" reRender="financeDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
		<aon:commandButton title="#{accountingBundle.accounting_finance_add_record_list}"
			styleClass="aon-finding-toolbar-item aon-icon-newFolder"
			value="#{accountingBundle.accounting_finance_add_record_list}"
			actionListener="#{financeTrackingEntry.onAddSelected}" 
			reRender="financeTrackingEntryForm,financePanelTabSet"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
	</aon:div>

	<aon:div id="financeDataDiv">
		<aon:dataTable id="financeData" value="#{financeTrackingEntry.finances}"  sortMode="multi"
			var="to" rows="20" rendered="#{financeTrackingEntry.finances.rowCount > 0}"
			columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
				aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
				aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn">				
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:selectBooleanCheckbox id="Checked_Finances"
					value="#{financeTrackingEntry.rowCheckedFinances}"
					valueChangeListener="#{financeTrackingEntry.rowSelectedFinances}" />
			</aon:column>
			
			<aon:column sortBy="#{to.finance.invoice.referenceCode}"
				sortOrder="#{financeTrackingEntry.order['Finance_tracking_finance_invoice_referenceCode']}">
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_invoice}" />
				</f:facet>
				<aon:outputText value="#{to.finance.invoice.referenceCode}" />
			</aon:column>
			
			<aon:column sortBy="#{to.finance.invoice.registryName}"
				sortOrder="#{financeTrackingEntry.order['Finance_tracking_finance_invoice_registryName']}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.finance.invoice.registryName}" />
			</aon:column>
	
			<aon:column sortBy="#{to.trackingDate}"
				sortOrder="#{financeTrackingEntry.order['Finance_tracking_tracking_date']}">
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_finance_date}" />
				</f:facet>
				<aon:outputText value="#{to.trackingDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column sortBy="#{to.finance.payMethod.name}"
				sortOrder="#{financeTrackingEntry.order['Finance_tracking_finance_payMethod_name']}">
				<f:facet name="header">
					<aon:outputText value="#{configBundle.config_pay_method}" />
				</f:facet>
				<aon:outputText value="#{to.finance.payMethod.name}" />
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_deposit}" />
				</f:facet>
				<aon:outputText value="#{to.registryBank.fullName}" rendered="#{to.registryBank != null}"/>
				<aon:outputText value="#{to.payMethodTypeDetail.description}" rendered="#{to.payMethodTypeDetail != null}"/>
			</aon:column>
	
			<aon:column sortBy="#{to.type}"
				sortOrder="#{financeTrackingEntry.order['Finance_tracking_type']}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.type}"/>
			</aon:column>
	
			<aon:column sortBy="#{to.finance.totalAmount}"
				sortOrder="#{financeEntry.order['Finance_tracking_finance_totalAmount']}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText value="#{to.finance.totalAmount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
			
		</aon:dataTable>
		
		<aon:dataScroller2 for="financeData" showNote="false" />
	</aon:div>
	
</ui:composition>
