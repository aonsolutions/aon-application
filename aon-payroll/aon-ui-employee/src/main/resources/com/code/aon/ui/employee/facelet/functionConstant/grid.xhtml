<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="functionConstantGrid">

			<aon:div ajaxRendered="true" layout="none">
			
				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{employeeBundle.employee_functionConstant_module}" />
					<ui:param name="controller" value="#{functionConstant}" />
				</ui:include>			

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
	
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{functionConstant}" />
						<ui:define name="columns">	
						
							<aon:column alias="ContractPayment.description"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="FunctionConstant_name"
										value="#{bundle.aon_name}" />
								</f:facet>
								<aon:outputText rendered="#{formList}" 
									value="#{to.name}" />
								<aon:inputText id="FunctionConstant_name" rendered="#{formEdit}" 
									size="64" maxlength="64"
									value="#{controller.to.name}" />
								<f:facet name="footer">
									<aon:inputText id="FunctionConstant_name-New" rendered="#{formNew}" 
										size="64" maxlength="64"
										value="#{controller.to.name}" />
								</f:facet>		
							</aon:column>
							
							<aon:column alias="ContractPayment.expression"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="FunctionConstant_value"
										value="#{bundle.aon_value}" />
								</f:facet>
								<aon:outputText rendered="#{formList}"
									value="#{to.value}" >
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>		
								<aon:inputText id="FunctionConstant_value" rendered="#{formEdit}" size="18"
										maxlength="18" value="#{controller.to.value}"
										required="true" />
								<f:facet name="footer">
									<aon:inputText id="FunctionConstant_value-New" rendered="#{formNew}" size="18"
											maxlength="18" value="#{controller.to.value}"
											required="true" />
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
