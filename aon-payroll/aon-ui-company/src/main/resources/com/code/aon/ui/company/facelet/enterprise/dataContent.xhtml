<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/company/facelet/enterprise/treeTemplate.xhtml">

	<ui:define name="content">	

		<aon:div styleClass="aon-scroll-area">
			<aon:panelGrid columns="4" styleClass="aon-width-all" >
						
				<aon:outputLabel value="#{bundle.aon_company_alias}" />
				<aon:outputText value="#{enterprise.to.registry.alias}" size="32" />
					
				<aon:outputLabel value="#{bundle.aon_id}" />
				<aon:outputText value="#{enterprise.to.id}" size="15" />
					
				<aon:outputLabel value="#{bundle.aon_company_name}" />
				<aon:outputText value="#{enterprise.to.registry.name}" size="64" />
				
				<aon:outputText value="#{bundle.aon_entity}" />
				<aon:outputText value="#{enterprise.to.registry.type}"/>		
			
				<aon:outputLabel value="#{companyBundle.company_activity}" />
				<aon:outputText value="#{enterprise.activity.cnae.id} - #{enterprise.activity.description}"  />
			
				<aon:outputLabel value="#{companyBundle.company_enterprise_ccc}" />
				<aon:outputText value="#{enterprise.CCC.CCC}" />
			
			</aon:panelGrid>

			<aon:form>
				<aon:div styleClass="aon-form-group" >
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputText value="#{enterpriseTree.currentNode.label}" />
						</aon:div>
					</aon:div>
					
					<c:if test="#{enterpriseTree.currentNode.id == 'enterpriseAddress'}">
						<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
							<ui:param name="controller" value="#{enterpriseAddress}" />
						</ui:include>
					</c:if>					

					<c:if test="#{enterpriseTree.currentNode.id == 'enterpriseMedia'}">
						<ui:include	src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
							<ui:param name="controller" value="#{enterpriseMedia}" />
						</ui:include>
					</c:if>					
		
				</aon:div>
			</aon:form>

		</aon:div>		
		
	</ui:define>

</ui:composition>
