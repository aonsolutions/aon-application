<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/company/facelet/enterprise/treeTemplate.xhtml">

	<ui:define name="content">
	
		<aon:form id="contractForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{companyBundle.company_employee}" />
				<ui:param name="toolbarDescription" value="&#160;" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="edit"
						value="#{bundle.aon_edit}"
						action="salary_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept" >
					</aon:commandButton>
					<aon:commandButton id="person"
						value="#{registryBundle.registry_person}"
						action="person_form" actionListener="#{enterpriseTree.onEditPerson}"
						styleClass="aon-finding-toolbar-item aon-icon-contact" >
					</aon:commandButton>
					<aon:commandButton id="contract"
						value="#{employeeBundle.employee_contract}"
						action="contract_form" actionListener="#{enterpriseTree.onEditContract}"
						styleClass="aon-finding-toolbar-item aon-icon-category" >
					</aon:commandButton>
					<aon:htmlCommandLink id="currentSalary-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{employeeBundle.employee_salary}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="currentSalaryReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>					
				</ui:define>				
			</ui:decorate>		

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width:100%"
					columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even">
					
					<aon:outputText value="#{bundle.aon_document}" />
					<aon:panelGroup>
						<aon:inputText value="#{enterpriseTree.contract.person.registry.document}"
							readonly="true" />						
						<aon:outputText value="#{bundle.aon_type}" styleClass="aon-margin-left aon-italic"/>
						<aon:inputText value="#{enterpriseTree.contract.person.registry.documentType}"
							styleClass="aon-margin-left" readonly="true" />
						<aon:outputText value="#{bundle.aon_document_country}" styleClass="aon-margin-left aon-italic"/>
						<aon:inputText value="#{enterpriseTree.contract.person.registry.documentCountry}"
							styleClass="aon-margin-left" readonly="true" />
					</aon:panelGroup>
					
					<aon:outputText value="#{registryBundle.registry_person_nss}" />
					<aon:outputText value="#{enterpriseTree.contract.person.socialSecurityNumber}" />

					<aon:outputText value="#{employeeBundle.employee_contract}" />
					<aon:panelGroup>
						<aon:outputText value="#{bundle.aon_start_date}" styleClass="aon-italic"/>
						<aon:inputText value="#{enterpriseTree.contract.startDate}"
							styleClass="aon-margin-left" readonly="true" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:inputText>		
						<aon:outputText value="#{bundle.aon_end_date}" styleClass="aon-margin-left aon-italic"/>
						<aon:inputText value="#{enterpriseTree.contract.endDate}"
							styleClass="aon-margin-left" readonly="true" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:inputText>		
					</aon:panelGroup>
					
					<c:if test="#{enterpriseTree.phone != null}" >
						<aon:outputText value="#{registryBundle.registry_phone}" />
						<aon:outputText value="#{enterpriseTree.phone.value}" />
					</c:if>

					<c:if test="#{enterpriseTree.fax != null}" >
						<aon:outputText value="#{registryBundle.registry_fax}" />
						<aon:outputText value="#{enterpriseTree.fax.value}" />
					</c:if>

					<c:if test="#{enterpriseTree.email != null}" >
						<aon:outputText value="#{registryBundle.registry_email}" />
						<aon:outputText value="#{enterpriseTree.email.value}" />
					</c:if>
							
				</aon:panelGrid>
				
				<c:if test="#{salary.model.rowCount > 0}" >
					<aon:div styleClass="aon-margin-top">
						<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
							<ui:param name="toolbarDescription" value="#{employeeBundle.employee_salary_module}" />
							<ui:param name="showMainStyleClass" value="#{false}" />
							<ui:param name="innerToolbar" value="#{true}" />
							<ui:param name="toolbarID" value="salaryToolbar" />
							<ui:define name="toolbarContent">
								<aon:spin id="enterpriseSpin" controller="#{salary}" />
							</ui:define>				
						</ui:decorate>
					</aon:div>
					
					<ui:include src="/com/code/aon/ui/employee/facelet/salary/formEditContent.xhtml" >
						<ui:param name="controller" value="#{salary}" />
					</ui:include>
		
					<aon:div styleClass="aon-padding-top">
						<aon:div styleClass="aon-form-group-title">
							<aon:div styleClass="aon-form-group-title-internal">
								<aon:outputText value="#{employeeBundle.employee_salary_payment}" />
							</aon:div>
						</aon:div>
						<ui:include src="/com/code/aon/ui/employee/facelet/payment/gridContent.xhtml" >
							<ui:param name="controller" value="#{salaryPayment}" />
							<ui:param name="skipStartDateColumn" value="true" />
							<ui:param name="skipEndDateColumn" value="true" />
						</ui:include>
						<aon:div styleClass="aon-form-group-title">
							<aon:div styleClass="aon-form-group-title-internal">
								<aon:outputText value="#{employeeBundle.employee_salary_deduction}" />
							</aon:div>
						</aon:div>
						<ui:include src="/com/code/aon/ui/employee/facelet/deduction/gridContent.xhtml" >
							<ui:param name="controller" value="#{salaryDeduction}" />
							<ui:param name="skipStartDateColumn" value="true" />
							<ui:param name="skipEndDateColumn" value="true" />
						</ui:include>
					</aon:div>
												
				</c:if>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
