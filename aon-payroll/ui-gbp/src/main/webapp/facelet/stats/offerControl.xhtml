<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_offer_control_report}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{bundle.aon_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandLink target="_blank" value="#{appBundle.gbp_print}"
							styleClass="aon-finding-toolbar-item aon-icon-printer"
							action="#{report.onExecute}">
							<f:param name="reportKey" value="offer_control_stat" />
							<f:param name="outputFormat" value="PDF" />
						</h:commandLink>
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="campaignGrid" columns="2" dir="true">

					<aon:outputLabel for="Campaign_startDate"
						value="#{appBundle.gbp_campaign_start_date}" />
					<aon:selectInputDate id="Campaign_startDate"
						value="#{offerControlReport.fromDate}" required="true"
						datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
						inputSize="15" />

					<aon:outputLabel for="Campaign_endDate"
						value="#{appBundle.gbp_campaign_end_date}" />
					<aon:selectInputDate id="Campaign_endDate"
						value="#{offerControlReport.toDate}"
						datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
						inputSize="15" />

					<aon:outputLabel for="Campaign_area_id"
						value="#{appBundle.gbp_campaign_area}" />
					<aon:selectOneMenu id="Campaign_area_id"
						value="#{offerControlReport.area.id}">
						<f:selectItems value="#{GBPCollections.areasByGroup}" />
					</aon:selectOneMenu>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
