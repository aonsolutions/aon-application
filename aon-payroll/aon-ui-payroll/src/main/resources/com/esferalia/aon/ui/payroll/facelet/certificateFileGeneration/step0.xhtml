<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/certificateFileGeneration/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.certificateFileGeneration_step0}" />
	</ui:define>

	<ui:define name="step_content">
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
			<ui:param name="skipSearchButton" value="true" />

			<ui:define name="searchContent">
				<aon:outputLabel value="#{payrollBundle.payroll_empresa}: " />
				<aon:inputText size="20" maxlength="25"
					value="#{certificateFileGenerationWizard.params.enterprise}" />
	
<!--  
				<aon:outputLabel value="#{payrollBundle.payroll_numeroCcc}" />
				<aon:outputText value="#{certificateFileGenerationWizard.remesa.numeroCcc}" />
-->
	
				<aon:outputLabel for="fecha" value="#{payrollBundle.payroll_fecha_remesa}: " />
				<aon:selectInputDate id="fecha" 
					required="true"
					value="#{certificateFileGenerationWizard.params.date}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				
				<aon:outputLabel for="estado"
					value="#{payrollBundle.payroll_estado}: " />
				<aon:selectManyCheckbox id="estado"
					value="#{certificateFileGenerationWizard.params.statusList}">
					<f:selectItems value="#{payrollCollections.fileStatus}" />
				</aon:selectManyCheckbox>
			</ui:define>
		</ui:decorate>
	</ui:define>

</ui:composition>
