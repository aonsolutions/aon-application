<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<meta name="gwt:property" content="locale=es_ES" />

	<aon:valueParam name="edit" default="#{true}" />
	<aon:valueParam name="entryPoint" default="EmployeeTree" />

	<aon:if test="#{gwt.entryPoint != entryPoint }">
		<aon:form id="entryPointForm" style="display:none">
			<aon:inputText id="gwtEntryPointText" value="#{gwt.entryPoint}" />
			<aon:commandButton id="gwtEntryPointButton" reRender="entryPointForm" />
			<script type="text/javascript">
           	//<![CDATA[
				#{rich:element('gwtEntryPointText')}.value = '#{entryPoint}';	
				#{rich:element('gwtEntryPointButton')}.click();	
           	//]]>
			</script>
		</aon:form>
	</aon:if>

	<style>
		body {
			margin: 0;
		}
	</style>
	
	<ui:include
		src="/com/code/aon/ui/resources/facelet/shared/messages.xhtml" />

	<ui:include src="/facelet/homepage/menu.xhtml" />

	<script type="text/javascript">
        //<![CDATA[
        	
        /* LOADS 'CLEAN.CSS' IF IT HAS BEEN REMOVED */
        if ([...document.styleSheets].filter(sts => /^.*clean\/clean\.css$/.test(sts.href)).length < 1) {
            let head  = document.getElementsByTagName('head')[0];
            let link  = document.createElement('link');
            link.rel  = 'stylesheet';
            link.type = 'text/css';
            link.href = '/aon_gwt_payroll/gwt/clean/clean.css';
            link.media = 'all';
            head.appendChild(link);
        }
        	
		localStorage.removeItem('rootPanel');
		localStorage.removeItem('aon_solutions');
	    localStorage.removeItem('aon_session_id');
        var search = "/aon_gwt_payroll.nocache.js";
        var scripts = document.getElementsByTagName("script");
        for (var i = 0; i < scripts.length; ++i) {
                var script = scripts[i];
                if (script.src != null && script.src.indexOf(search) != -1) {
                        var parent = script.parentNode;
                        parent.removeChild(script);
                        break;
                }
        }
        
		function isSysAdmin (){
			return #{aonRole.sysAdmin};
		}

		function isNewAONTheme (){
			return #{userUtils.newAONTheme};
		}

        function getCurrentUser() {
        	return '#{domainSwitcher.currentUser}';
        }

        function getCurrentDomainNameURL() {
        	return '#{domainSwitcher.currentDomainNameURL}';
        }

        var iframes = document.getElementsByTagName("iframe");
        for (var i = 0; i < iframes.length; ++i) {
                var iframe = iframes[i];
                if (iframe.name && iframe.name.startsWith('FormPanel')) {
                        var parent = iframe.parentNode;
                        parent.removeChild(iframe);
                }
        }
        
        //]]>
    </script>
    
    


	<script type="text/javascript"
		src="aon_gwt_payroll/aon_gwt_payroll.nocache.js?entryPoint=#{entryPoint}&amp;horribleFix=666&amp;employeeSearch=#{employeeSearch}" />

	<div id="rootPanel"
		style="width: 100%; min-height: 100%; height: auto !important; height: 100%; margin: 0;">
	</div>




	<script type="text/javascript">
		//<![CDATA[ 
				aon_gwt_payroll.onInjectionDone('aon_gwt_payroll');
		//]]>
	</script>
	


</ui:composition>
