<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<style>
.aon-group-body-internal .aon-panelGrid {
	width: 100%;
}
</style>


	<aon:form id="contractForm" style="#{ !edit ? 'display:none': ''}" >
		<aon:if test="#{edit}">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.payroll_contract_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />


				<ui:define name="toolbarContent">
					<aon:commandButton id="Contract-Save" 
						reRender="contractMainGrid"
						value="#{bundle.aon_accept}"
						oncomplete="refreshEmployee();" 
						styleClass="aon-finding-toolbar-item aon-icon-accept">
						<aon:actionListener method="#{person.accept}" />
						<aon:actionListener method="#{contract.accept}" />
					</aon:commandButton>
				</ui:define>

			</ui:decorate>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="payrollToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.aon_module_payroll}" />
				<ui:param name="toolbarDescription"
					value="#{bundle.payroll_salary_menu_group}" />


				<ui:define name="toolbarContent">

					<aon:commandButton id="Contract-Calc" ajaxSingle="true"
						reRender="contractMainGrid"
						value="#{bundle.menu_main_calculator}"
						styleClass="aon-finding-toolbar-item aon-icon-task-start"
						onclick="employeeCalc();">
					</aon:commandButton>

					<aon:commandButton id="View-Results" ajaxSingle="true"
						reRender="contractMainGrid" value="#{bundle.aon_results}"
						styleClass="aon-finding-toolbar-item aon-icon-time"
						onclick="viewResults();">
					</aon:commandButton>

				</ui:define>

			</ui:decorate>
		</aon:if>
		<aon:if test="#{!edit}">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.payroll_contract_module}" />
			</ui:decorate>
		</aon:if>

		<aon:div
			style="overflow: auto; position: absolute; left: 0px; top: 4em; right: 0px; bottom: 0px;">

			<aon:div style="position: relative">

				<aon:panelGrid id="contractMainGrid" columns="1" cellspacing="10"
					styleClass="aon-panelGrid-formatting" columnClasses="aon-width-all">

					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{bundle.payroll_contract_data}" />
						</aon:div>
						<aon:div styleClass="aon-group-body">
							<aon:div styleClass="aon-group-body-internal">
								<ui:include
									src="/com/esferalia/aon/ui/payroll/facelet/contract/formContent.xhtml">
									<ui:param name="controller" value="#{contract}" />
								</ui:include>
							</aon:div>
						</aon:div>
					</aon:div>

					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{bundle.payroll_person_data}" />
						</aon:div>
						<aon:div styleClass="aon-group-body">
							<aon:div styleClass="aon-group-body-internal">
								<ui:include
									src="/com/code/aon/ui/registry/facelet/person/formContent.xhtml">
									<ui:param name="controller" value="#{person}" />
								</ui:include>
							</aon:div>
						</aon:div>
					</aon:div>


				</aon:panelGrid>
			</aon:div>

		</aon:div>
	</aon:form>

	<aon:lookupButtonPopup lookup="#{agreementLookup}" />

	<ui:include
		src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
	
	<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/workdayDuration/modalWorkdayHours.xhtml" >
		<ui:param name="reRender" value="contractMainGrid" />
	</ui:include>

	<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
		<ui:param name="bankAccountController" value="#{personPayMethodForm.accountHelper}" />
		<ui:param name="modalReRender" value="contractMainGrid" />
	</ui:include>

	<aon:if test="#{!edit}">
		<ui:include src="readonly.xhtml">
			<ui:param name="form" value="contractForm" />
			<ui:param name="hide" value="/enterpriseActivities|Contract_contractModel|Agreement_name|quote_group|occupationType|CNO_id|Person_id|Person_alias|Person_gender|Person_address_municipality|Person_telephone|Person_cellular|Person_email|RegistryPayMethod_payment|agreementLevelCategory-content/g" />
		</ui:include>
	</aon:if>

</ui:composition>
