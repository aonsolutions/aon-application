<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form>
		<aon:if test="#{edit}">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.aon_activity}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
	
	
					<ui:define name="toolbarContent">
						<aon:commandButton id="Activity-Save" value="#{bundle.aon_accept}"
							reRender="ActivityMainGrid"
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<aon:actionListener method="#{enterpriseActivity.accept}" />
						</aon:commandButton>
					</ui:define>
	
			</ui:decorate>
		</aon:if>
		<aon:div
			style="overflow: auto; position: absolute; left: 0px; top: 2em; right: 0px; bottom: 0px;">

			<aon:div style="position: relative">

				<aon:panelGrid id="activityMainGrid" columns="1" cellspacing="10"
					styleClass="aon-panelGrid-formatting" columnClasses="aon-width-all">

					<aon:div styleClass="aon-scroll-area">
						
						<ui:include	src="/com/esferalia/aon/ui/payroll/facelet/enterpriseActivity/form_content.xhtml" >
							<ui:param name="controller" value="#{enterpriseActivity}" />
							<ui:param name="skipFiscalInfo" value="#{true}" />
						</ui:include>

						<aon:div>
							<aon:div styleClass="aon-form-group"
								rendered="#{!enterpriseActivity.nevv}">
								<aon:div styleClass="aon-form-group-title">
									<aon:div styleClass="aon-form-group-title-internal">
										<aon:outputLabel for="enterpriseCCCData"
											value="#{bundle.company_enterprise_ccc}" />
									</aon:div>
								</aon:div>

								<ui:include
									src="/com/esferalia/aon/ui/payroll/facelet/enterpriseCCC/tab_grid.xhtml">
									<ui:param name="controller" value="#{enterpriseCCC}" />
								</ui:include>
							</aon:div>
						</aon:div>

					</aon:div>
				</aon:panelGrid>

			</aon:div>

		</aon:div>
	</aon:form>

	<aon:lookupButtonPopup lookup="#{cnae2009Lookup}" />

	<ui:include
		src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />

</ui:composition>
