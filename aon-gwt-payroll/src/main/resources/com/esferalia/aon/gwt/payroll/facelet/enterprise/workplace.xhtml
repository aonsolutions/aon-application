<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include
		src="/com/code/aon/ui/resources/facelet/shared/messages.xhtml" />


	<aon:form>
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
			<ui:param name="toolbarTitle"
				value="#{companyBundle.company_workplace}" />
			<ui:param name="toolbarDescription" value="#{payrollWorkPlace.to.description}" />


			<ui:define name="toolbarContent">
			</ui:define>

		</ui:decorate>

		<aon:div
			style="overflow: auto; position: absolute; left: 0px; top: 2em; right: 0px; bottom: 0px;">

			<aon:div style="position: relative">

				<aon:panelGrid id="workPlaceMainGrid" columns="1" cellspacing="10"
					styleClass="aon-panelGrid-formatting" columnClasses="aon-width-all">

					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{companyBundle.company_workplace_data}" />
						</aon:div>
						<aon:div styleClass="aon-group-body">
							<aon:div styleClass="aon-group-body-internal">
									<aon:panelGrid id="dataTable" columns="2"
										styleClass="aon-width-all">

										<aon:outputLabel for="WorkPlace_description"
											value="#{bundle.aon_description}" />
										<aon:inputText id="WorkPlace_description"
											value="#{payrollWorkPlace.to.description}" required="true"
											size="40" maxlength="64" />

										<aon:outputLabel for="WorkPlace_address_id"
											value="#{companyBundle.company_workplace_address}" />
										<aon:selectOneMenu id="WorkPlace_address_id"
											value="#{payrollWorkPlace.to.address}" required="true">
											<c:if test="#{showEnterpriseData}">
												<f:selectItems value="#{enterprise.addresses}" />
											</c:if>
											<c:if test="#{!showEnterpriseData}">
												<f:selectItems
													value="#{companyCollections.companyAddresses}" />
											</c:if>
										</aon:selectOneMenu>

										<aon:outputText for="WorkPlace_economicAgreement"
											value="#{configBundle.config_administration}" />
										<aon:selectOneMenu id="WorkPlace_economicAgreement"
											value="#{payrollWorkPlace.to.economicAgreement}">
											<f:selectItem itemLabel="-" value="#{null}" />
											<f:selectItems value="#{configCollections.administrations}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="WorkPlace_active"
											value="#{bundle.aon_active}" />
										<aon:selectBooleanCheckbox id="WorkPlace_active"
											styleClass="aon-margin-left"
											value="#{payrollWorkPlace.to.active}" />

									</aon:panelGrid>
							</aon:div>
						</aon:div>
					</aon:div>


					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{companyBundle.company_workplace_payroll_data}" />
						</aon:div>
						<aon:div styleClass="aon-group-body">
							<aon:div styleClass="aon-group-body-internal">
									<aon:panelGrid columns="2" styleClass="aon-width-all">

										<ui:include
											src="/com/esferalia/aon/ui/calendar/facelet/calendar/lookup.xhtml">
											<ui:param name="lookupTo"
												value="#{payrollWorkPlace.payrollWorkPlace.calendar}" />
											<ui:param name="skipNewButton" value="#{true}" />
											<ui:param name="lookupInputSuggestSize" value="40" />
											<ui:param name="lookupSuffix" value="-PayrollWorkPlace" />
										</ui:include>

										<ui:include
											src="/com/esferalia/aon/ui/payroll/facelet/agreement/lookup.xhtml">
											<ui:param name="lookupTo"
												value="#{payrollWorkPlace.payrollWorkPlace.agreement}" />
											<ui:param name="skipNewButton" value="#{true}" />
											<ui:param name="lookupInputSuggestSize" value="40" />
										</ui:include>

										<aon:outputLabel for="PayrollWorkPlace_enterpriseActivity"
											value="#{payrollBundle.payroll_activity}" />
										<aon:selectOneMenu id="PayrollWorkPlace_enterpriseActivity"
											value="#{payrollWorkPlace.payrollWorkPlace.enterpriseActivity}">
											<f:selectItem itemLabel="-" value="#{null}" />
											<f:selectItems value="#{enterprisePayroll.activities}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
							</aon:div>
						</aon:div>
					</aon:div>


				</aon:panelGrid>

			</aon:div>

		</aon:div>
	</aon:form>


	<aon:lookupButtonPopup lookup="#{agreementLookup}" />
	<aon:lookupButtonPopup lookup="#{calendarLookup}" />

	<ui:include
		src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />

</ui:composition>
