<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="jsf" style="display:none;">

		<script type="text/javascript">
           	//<![CDATA[
				rerenderHandler = function(){
				}
           	//]]>
		</script>

		<aon:form style="display:none">
			<aon:commandButton id="jsfBonusConceptsButton" reRender="xhtmlPanel"
				actionListener="#{employeeTree.onBonusConceptsSelected}" />
			<script type="text/javascript">
            	//<![CDATA[
					bonusConceptsSelected = function(id){
						#{rich:element('jsfBonusConceptsButton')}.click();	
					}
            	//]]>
			</script>
		</aon:form>

		<aon:form style="display:none">
			<aon:commandButton id="jsfPaymentConceptsButton"
				reRender="xhtmlPanel"
				actionListener="#{employeeTree.onPaymentConceptsSelected}" />
			<script type="text/javascript">
            	//<![CDATA[
					paymentConceptsSelected = function(id){
						#{rich:element('jsfPaymentConceptsButton')}.click();	
					}
            	//]]>
			</script>
		</aon:form>

		<aon:form style="display:none">
			<aon:commandButton id="jsfDeductionConceptsButton"
				reRender="xhtmlPanel"
				actionListener="#{employeeTree.onDeductionConceptsSelected}" />
			<script type="text/javascript">
            	//<![CDATA[
					deductionConceptsSelected = function(id){
						#{rich:element('jsfDeductionConceptsButton')}.click();	
					}
            	//]]>
			</script>
		</aon:form>

		<aon:form style="display:none">
			<aon:inputText id="jsfEnterpriseText"
				value="#{employeeTree.enterpriseId}" />
			<aon:commandButton id="jsfEnterpriseButton" reRender="xhtmlPanel"
				actionListener="#{employeeTree.onEnterpriseSelected}" />
			<script type="text/javascript">
            	//<![CDATA[
					enterpriseSelected = function(id){
						#{rich:element('jsfEnterpriseText')}.value = id;
						#{rich:element('jsfEnterpriseButton')}.click();	
					}
            	//]]>
			</script> 
		</aon:form>

		<aon:form style="display:none">
			<aon:inputText id="jsfWorkplaceText"
				value="#{employeeTree.workplaceId}" />
			<aon:commandButton id="jsfWorkplaceButton" reRender="xhtmlPanel"
				actionListener="#{employeeTree.onWorkplaceSelected}" />
			<script type="text/javascript">
            	//<![CDATA[
					workplaceSelected = function(id){
						#{rich:element('jsfWorkplaceText')}.value = id;
						#{rich:element('jsfWorkplaceButton')}.click();	
					}
            	//]]>
			</script>
		</aon:form>

		<aon:form style="display:none">
			<aon:inputText id="jsfEmployeeText"
				value="#{employeeTree.employeeId}" />
			<aon:commandButton id="jsfEmployeeButton" reRender="xhtmlPanel"
				actionListener="#{employeeTree.onEmployeeSelected}" />
			<script type="text/javascript">
            	//<![CDATA[
					employeeSelected = function(id){
						#{rich:element('jsfEmployeeText')}.value = id;
						#{rich:element('jsfEmployeeButton')}.click();	
					}
            	//]]>
			</script>
		</aon:form>

		<aon:form style="display:none">
			<aon:inputText id="jsfActivityText"
				value="#{employeeTree.activityId}" />
			<aon:commandButton id="jsfActivityButton" reRender="xhtmlPanel"
				actionListener="#{employeeTree.onActivitySelected}" />
			<script type="text/javascript">
            	//<![CDATA[
					activitySelected = function(id){
						#{rich:element('jsfActivityText')}.value = id;
						#{rich:element('jsfActivityButton')}.click();	
					}
            	//]]>
			</script>
		</aon:form>

		<aon:div id="xhtmlPanel">
			<aon:if test="#{employeeTree.employeeSelected}">
				<ui:include
					src="/com/esferalia/aon/gwt/payroll/facelet/employee/contract.xhtml" />
			</aon:if>
			<aon:if test="#{employeeTree.activitySelected}">
				<ui:include
					src="/com/esferalia/aon/gwt/payroll/facelet/employee/activity.xhtml" />
			</aon:if>
			<aon:if test="#{employeeTree.workplaceSelected}">
				<ui:include
					src="/com/esferalia/aon/gwt/payroll/facelet/employee/workplace.xhtml" />
			</aon:if>
			<aon:if test="#{employeeTree.enterpriseSelected}">
				<ui:include
					src="/com/esferalia/aon/gwt/payroll/facelet/employee/enterprise.xhtml">
					<ui:param name="edit" value="#{edit}" />
				</ui:include>
			</aon:if>
			<aon:if test="#{employeeTree.bonusConceptsSelected}">
				<ui:include
					src="/com/esferalia/aon/gwt/payroll/facelet/employee/bonus_concept.xhtml"/>
			</aon:if>
			<aon:if test="#{employeeTree.paymentConceptsSelected}">
				<ui:include
					src="/com/esferalia/aon/gwt/payroll/facelet/employee/payment_concept.xhtml"/>
			</aon:if>
			<aon:if test="#{employeeTree.deductionConceptsSelected}">
				<ui:include
					src="/com/esferalia/aon/gwt/payroll/facelet/employee/deduction_concept.xhtml"/>
			</aon:if>
			<script type="text/javascript">
	           	//<![CDATA[
					rerenderHandler(); 
	           	//]]>
			</script>
		</aon:div>
		<script type="text/javascript">
           	//<![CDATA[
				jsf = #{rich:element('jsf')};
           	//]]>
		</script>
		
	</aon:div>
</ui:composition>
