<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:form id="#{controller.beanName}ConceptsForm">

		<aon:div id="#{controller.beanName}ConceptsContent">


			<aon:div rendered="#{controller.to != null}">

				<aon:methodParam name="backAction" value="" />
				<aon:methodParam name="saveAction" value="" />
				<aon:methodParam name="resetAction" value="" />
				<aon:methodParam name="cancelAction" value="" />
				<aon:methodParam name="removeAction" value="" />
				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="skipSpin" value="#{true}" />
					<ui:param name="skipSearchButton" value="#{true}" />
					<ui:param name="toolbarID" value="#{controller.beanName}ConceptsFormToolBar" />
					<ui:param name="backButtonReRender" value="#{controller.beanName}ConceptsContent" />
					<ui:param name="saveButtonReRender" value="#{controller.beanName}ConceptsContent" />
					<ui:param name="resetButtonReRender" value="#{controller.beanName}ConceptsContent" />
					<ui:param name="cancelButtonReRender" value="#{controller.beanName}ConceptsContent" />
					<ui:param name="removeButtonReRender" value="#{controller.beanName}ConceptsContent" />
				</ui:include>

				<aon:div
					style="overflow: auto; position: absolute; left: 0px; top: 4em; right: 0px; bottom: 0px;">
					<aon:div style="position: relative">
						<ui:include src="#{formContent}">
						</ui:include>
					</aon:div>

				</aon:div>

			</aon:div>

			<aon:div rendered="#{controller.to == null}">

				<aon:methodParam name="resetAction" value="" />
				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
					<ui:param name="skipSearchButton" value="#{true}" />
					<ui:param name="resetButtonReRender" value="#{controller.beanName}ConceptsContent" />
					<ui:param name="toolbarID" value="#{controller.beanName}ConceptsListToolBar" />
				</ui:include>

				<aon:div
					style="overflow: auto; position: absolute; left: 0px; top: 4em; right: 5px; bottom: 0px;">

					<aon:div style="position: relative">
						<aon:methodParam name="rowSelectorAction" value="" />
						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">

							<ui:param name="rowSelectorReRender" value="#{controller.beanName}ConceptsContent" />

							<ui:define name="columns">
								<aon:if test="#{!skipCode}">
									<aon:column alias="#{controller.beanName}.code"
										styleClass="aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_id}" />
										</f:facet>
										<aon:outputText value="#{to.code}" />
									</aon:column>
								</aon:if>

								<aon:if test="#{!skipType}">
									<aon:column alias="#{controller.beanName}.type"
										styleClass="aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_type}" />
										</f:facet>
										<aon:outputText value="#{to.type}" />
									</aon:column>
								</aon:if>

								<aon:column alias="#{controller.beanName}.description"
									styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_description}" />
									</f:facet>
									<aon:outputText value="#{to.description}" />
								</aon:column>

							</ui:define>
						</ui:decorate>
					</aon:div>
				</aon:div>

			</aon:div>

		</aon:div>

	</aon:form>


</ui:composition>
