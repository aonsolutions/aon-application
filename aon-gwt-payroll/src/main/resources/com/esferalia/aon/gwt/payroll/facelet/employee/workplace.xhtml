<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<aon:form id="workplaceForm" style="#{ !edit ? 'display:none': ''}">
		<aon:if test="#{edit}">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.purchase_workplace}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />


				<ui:define name="toolbarContent">
					<aon:commandButton id="Workplace-Save" 
						value="#{bundle.aon_accept}"
						reRender="workPlaceMainGrid"
						oncomplete="refreshWorkplace()"
						styleClass="aon-finding-toolbar-item aon-icon-accept">
						<aon:actionListener method="#{payrollWorkPlace.accept}" />
					</aon:commandButton>

					<aon:commandButton id="Contract-reset" ajaxSingle="true"
						title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						value="#{bundle.payroll_contract_new}"
						reRender="#{contract.beanName}ModalContainer"
						styleClass="aon-finding-toolbar-item aon-icon-reset">
						<aon:actionListener
							method="#{employeeTree.onShowNewContractModal}" />
					</aon:commandButton>

				</ui:define>


			</ui:decorate>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="payrollToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.aon_module_payroll}" />
				<ui:param name="toolbarDescription"
					value="#{bundle.payroll_salary_menu_group}" />


				<ui:define name="toolbarContent">

					<aon:commandButton id="Workplace-Calc" ajaxSingle="true"
						reRender="workPlaceMainGrid"
						value="#{bundle.menu_main_calculator}"
						styleClass="aon-finding-toolbar-item aon-icon-task-start"
						onclick="workplaceCalc();">
					</aon:commandButton>

					<aon:commandButton id="View-Results" ajaxSingle="true"
						reRender="workPlaceMainGrid" value="#{bundle.aon_results}"
						styleClass="aon-finding-toolbar-item aon-icon-time"
						onclick="viewResults();">
					</aon:commandButton>

				</ui:define>

			</ui:decorate>

		</aon:if>
		<aon:if test="#{!edit}">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.purchase_workplace}" />
			</ui:decorate>
		</aon:if>

		<aon:div
			style="overflow: auto; position: absolute; left: 0px; top: 4em; right: 0px; bottom: 0px;">

			<aon:div style="position: relative">

				<aon:panelGrid id="workPlaceMainGrid" columns="1" cellspacing="10"
					styleClass="aon-panelGrid-formatting" columnClasses="aon-width-all">

					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{bundle.company_workplace_data}" />
						</aon:div>
						<aon:div styleClass="aon-group-body">
							<aon:div styleClass="aon-group-body-internal">
								<aon:panelGrid id="dataTable" columns="2"
									styleClass="aon-width-all">

									<aon:outputLabel for="WorkPlace_description"
										value="#{bundle.aon_description}" />
									<aon:inputText id="WorkPlace_description"
										value="#{payrollWorkPlace.to.workPlace.description}"
										required="true" size="40" maxlength="64" />

									<aon:outputLabel for="WorkPlace_address_id"
										value="#{bundle.aon_address}" />
									<aon:if test="#{edit}">
										<aon:selectOneMenu id="WorkPlace_address_id"
											value="#{payrollWorkPlace.to.workPlace.address}"
											required="true">
											<aon:if test="#{showEnterpriseData}">
												<f:selectItems value="#{enterprise.addresses}" />
											</aon:if>
											<aon:if test="#{!showEnterpriseData}">
												<f:selectItems
													value="#{companyCollections.companyAddresses}" />
											</aon:if>
										</aon:selectOneMenu>
									</aon:if>
									<aon:if test="#{!edit}">
										<aon:inputText id="WorkPlace_fulladdress"
											value="#{payrollWorkPlace.to.workPlace.address.fullAddress}" />
									</aon:if>

									<aon:outputText for="WorkPlace_economicAgreement"
										value="#{bundle.config_administration}" />
									<aon:selectOneMenu id="WorkPlace_economicAgreement"
										value="#{payrollWorkPlace.to.workPlace.economicAgreement}">
										<f:selectItem itemLabel="-" value="#{null}" />
										<f:selectItems value="#{configCollections.administrations}" />
									</aon:selectOneMenu>

									<aon:outputLabel for="WorkPlace_active"
										value="#{bundle.aon_active}" />
									<aon:selectBooleanCheckbox id="WorkPlace_active"
										styleClass="aon-margin-left"
										value="#{payrollWorkPlace.to.workPlace.active}" />

								</aon:panelGrid>
							</aon:div>
						</aon:div>
					</aon:div>

					<aon:if test="#{edit}">
						<aon:div styleClass="aon-group">
							<aon:div styleClass="aon-group-title">
								<aon:outputText value="#{bundle.company_workplace_payroll_data}" />
							</aon:div>
							<aon:div styleClass="aon-group-body">
								<aon:div styleClass="aon-group-body-internal">
									<aon:panelGrid columns="2" styleClass="aon-width-all">

										<ui:include
											src="/com/esferalia/aon/ui/calendar/facelet/calendar/lookup.xhtml">
											<ui:param name="lookupTo"
												value="#{payrollWorkPlace.to.calendar}" />
											<ui:param name="skipNewButton" value="#{true}" />
											<ui:param name="lookupInputSuggestSize" value="40" />
											<ui:param name="lookupSuffix" value="-PayrollWorkPlace" />
										</ui:include>

										<ui:include
											src="/com/esferalia/aon/ui/payroll/facelet/agreement/lookup.xhtml">
											<ui:param name="lookupTo"
												value="#{payrollWorkPlace.to.agreement}" />
											<ui:param name="lookupSuffix" value="_workplace" />
											<ui:param name="skipNewButton" value="#{true}" />
											<ui:param name="lookupInputSuggestSize" value="40" />
										</ui:include>

										<aon:outputLabel for="PayrollWorkPlace_enterpriseActivity"
											value="#{bundle.aon_activity}" />
										<aon:selectOneMenu id="PayrollWorkPlace_enterpriseActivity"
											value="#{payrollWorkPlace.to.enterpriseActivity}">
											<f:selectItem itemLabel="-" value="#{null}" />
											<f:selectItems value="#{enterprisePayroll.activities}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:if>

				</aon:panelGrid>

			</aon:div>

		</aon:div>
	</aon:form>


	<aon:lookupButtonPopup lookup="#{agreementLookup}" />
	<aon:lookupButtonPopup lookup="#{calendarLookup}" />
	<aon:lookupButtonPopup lookup="#{personLookup}" />


	<ui:include
		src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />

	<ui:include
		src="/com/esferalia/aon/ui/payroll/facelet/contract/modalNewContract.xhtml">
		<ui:param name="controller" value="#{contract}" />
		<ui:param name="popupWindowTitle" value="#{bundle.payroll_contract}" />
		<ui:param name="lookupDisabled" value="true" />
	</ui:include>

	<aon:if test="#{!edit}">
		<ui:include src="readonly.xhtml">
			<ui:param name="form" value="workplaceForm" />
			<ui:param name="hide"
				value="/WorkPlace_active|Calendar_id-PayrollWorkPlace|PayrollWorkPlace_enterpriseActivity/g" />
		</ui:include>
	</aon:if>

</ui:composition>
