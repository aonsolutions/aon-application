<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<aon:form id="enterpriseForm" style="#{ !edit ? 'display:none': ''}">
		<aon:if test="#{edit}">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.aon_module_enterprise}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />


				<ui:define name="toolbarContent">
					<aon:commandButton id="Enterprise-Save"
						value="#{bundle.aon_accept}" 
						reRender="enterpriseMainGrid"
						oncomplete="refreshEnterprise();" 
						styleClass="aon-finding-toolbar-item aon-icon-accept">
						<aon:actionListener method="#{enterprise.accept}" />
					</aon:commandButton>

					<aon:commandButton id="Workplace-reset" ajaxSingle="true"
						title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						value="#{bundle.enterprise_activity_new}"
						reRender="#{contract.beanName}ModalContainer"
						styleClass="aon-finding-toolbar-item aon-icon-reset">
						<aon:actionListener
							method="#{employeeTree.onShowNewWorkplaceModal}" />
					</aon:commandButton>

					<aon:commandButton id="Activity-reset" ajaxSingle="true"
						title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
						value="#{bundle.workplace_new}"
						reRender="#{contract.beanName}ModalContainer"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						limitToList="true">
						<aon:actionListener
							method="#{employeeTree.onShowNewActivityModal}" />
					</aon:commandButton>


				</ui:define>

			</ui:decorate>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="payrollToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.aon_module_payroll}" />
				<ui:param name="toolbarDescription"
					value="#{bundle.payroll_salary_menu_group}" />


				<ui:define name="toolbarContent">

					<aon:commandButton id="Enterprise-Calc" ajaxSingle="true"
						reRender="enterpriseMainGrid"
						value="#{bundle.menu_main_calculator}"
						styleClass="aon-finding-toolbar-item aon-icon-task-start"
						onclick="enterpriseCalc();">
					</aon:commandButton>

					<aon:commandButton id="View-Results" ajaxSingle="true"
						reRender="enterpriseMainGrid" value="#{bundle.aon_results}"
						styleClass="aon-finding-toolbar-item aon-icon-time"
						onclick="viewResults();">
					</aon:commandButton>


				</ui:define>

			</ui:decorate>

		</aon:if>
		<aon:if test="#{!edit}">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.aon_module_enterprise}" />
			</ui:decorate>
		</aon:if>


		<aon:div
			style="overflow: auto; position: absolute; left: 0px; top: 4em; right: 0px; bottom: 0px;">

			<aon:div style="position: relative">

				<aon:panelGrid id="enterpriseMainGrid" columns="1" cellspacing="10"
					styleClass="aon-panelGrid-formatting" columnClasses="aon-width-all">

					<ui:include
						src="/com/code/aon/ui/company/facelet/enterprise/formContent.xhtml">
						<ui:param name="controller" value="#{enterprise}" />
					</ui:include>
				</aon:panelGrid>

			</aon:div>

		</aon:div>
	</aon:form>


	<aon:lookupButtonPopup lookup="#{agreementLookup}" />
	<aon:lookupButtonPopup lookup="#{calendarLookup}" />

	<ui:include
		src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />

	<aon:if test="#{!edit}">
		<ui:include src="readonly.xhtml">
			<ui:param name="form" value="enterpriseForm" />
			<ui:param name="hide"
				value="/Company_alias|Company_address_municipality|Enterprise_scope_id|salary_model|enterprise_salary_model|salary_sending_method|Agreement_id-enterpriseParam|Calendar_id|Company_email|Company_web|Enterprise_workplace_description/g" />
		</ui:include>
	</aon:if>

	<img style="display: none;"
		src="#{aonResource.resolve['/com/esferalia/aon/gwt/common/client/css/images/blank.png']}"
		onload="onLoadJSF(this.parentNode);" />

</ui:composition>
