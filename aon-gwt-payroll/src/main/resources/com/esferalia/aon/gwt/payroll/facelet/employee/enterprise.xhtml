<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include
		src="/com/code/aon/ui/resources/facelet/shared/messages.xhtml" />


	<aon:form>
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
			<ui:param name="toolbarTitle"
				value="#{companyBundle.company_enterprise_module}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />


			<ui:define name="toolbarContent">
				<aon:commandButton id="Enterprise-Save" value="#{bundle.aon_accept}"
					reRender="enterpriseMainGrid"
					styleClass="aon-finding-toolbar-item aon-icon-accept">
					<aon:actionListener method="#{enterprise.accept}" />
				</aon:commandButton>

                <aon:commandButton id="Contract-reset" ajaxSingle="true"
                        title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
                        value="#{payrollBundle.payroll_contract_new}"
                        reRender="#{contract.beanName}ModalContainer"
                        styleClass="aon-finding-toolbar-item aon-icon-reset" >
                        <aon:actionListener method="#{contract.onShowNewContractModal}" />
                </aon:commandButton>

			</ui:define>

		</ui:decorate>


		<aon:div style="overflow: auto; position: absolute; left: 0px; top: 2em; right: 0px; bottom: 0px;" >

			<aon:div style="position: relative" >

				<aon:panelGrid id="enterpriseMainGrid" columns="1" cellspacing="10"
					styleClass="aon-panelGrid-formatting"
					columnClasses="aon-width-all" >
	
					<ui:include
						src="/com/code/aon/ui/company/facelet/enterprise/formContent.xhtml">
						<ui:param name="controller" value="#{enterprise}" />
					</ui:include>
				</aon:panelGrid>

			</aon:div>

		</aon:div>
	</aon:form>


	<aon:lookupButtonPopup lookup="#{agreementLookup}" />
	<aon:lookupButtonPopup lookup="#{calendarLookup}" />

	<ui:include
		src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />

</ui:composition>
