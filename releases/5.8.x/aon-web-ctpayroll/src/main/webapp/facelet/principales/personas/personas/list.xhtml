<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="personaList">

					<ui:include
						src="/facelet/templates/listPrintToolbar.xhtml">
						<ui:param name="toolbarTitle"
							value="#{appBundle.aon_payroll_pricipales_personas_mnto_personas}" />
						<ui:param name="controller" value="#{persona}" />
	                    <ui:param name="reportKey" value="personasList" />
					</ui:include>

					<!--  aon-region-body -->
					<aon:div styleClass="aon-scroll-area">

						<aon:dataTable id="personaData"
							value="#{persona.model}" var="to" rows="20"
							columnClasses="aon-width-150
							, aon-editDataTable-textColumn, aon-editDataTable-textColumn
							, aon-editDataTable-textColumn">

							<aon:rowSelector action="persona_form"
								actionListener="#{persona.onSelect}" />

							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_principales_personas_otrperc_per}" />
								</f:facet>
								<aon:outputText value="#{to.cdg}" />
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_pricipales_personas_apellido1}" />
								</f:facet>
								<aon:outputText
									value="#{to.descripcion}" />
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_pricipales_personas_apellido2}" />
								</f:facet>
								<aon:outputText value="#{to.apellido2}" />
							</aon:column>
							
														<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{appBundle.aon_payroll_pricipales_personas_nombre}" />
								</f:facet>
								<aon:outputText value="#{to.nombre}" />
							</aon:column>

						</aon:dataTable>

						<aon:dataScroller2 for="personaData"
							showNote="true" />

					</aon:div>
				</aon:form>

			</ui:define>

		</ui:composition>

	</body>
</html>
