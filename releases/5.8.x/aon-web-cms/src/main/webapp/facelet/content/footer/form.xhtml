<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="headerForm">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.footer}" />
				<ui:param name="controller" value="#{footer}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>		
					
			<aon:panelTabSet id="tabPanelTypesForm"> 
				<aon:panelTab id="contentTab" label="#{appBundle.aon_content}">
		
					<aon:div styleClass="aon-scroll-area">
						<aon:div style="width:99%;">
			
							<aon:panelGrid columns="2" dir="true">
								<aon:outputText value="#{appBundle.cms_alias}" 
									for="alias"/>
								<aon:inputText id="alias" required="true"
									value="#{footer.to.alias}" size="40" maxlength="64" />
								
								<aon:outputLabel for="menu"
									value="#{appBundle.footer_menu}"/>
								<aon:selectOneMenu id="menu"  
									value="#{footer.to.menu.id}">
									<f:selectItem itemLabel="-" value="#{null}" />
									<f:selectItems value="#{collections.menuFootList}" />
								</aon:selectOneMenu> 
									
								<ui:include src="/facelet/content/utils/contentInput.xhtml" >
									<ui:param name="inputTextId" value="content" />
									<ui:param name="inputTextValue" value="#{footer.toI18n.content}" />
									<ui:param name="richTextEnabled" value="#{footer.richTextEnabled}" />
								</ui:include>																																		
							
							</aon:panelGrid>
						</aon:div>
		
					</aon:div>
			
				</aon:panelTab>

				<aon:panelTab id="meta_tags" label="#{appBundle.banner_category}"
					rendered="#{!footer.new}">

					<aon:div id="footer_banner_category_DataDiv">
						<aon:dataTable id="footer_banner_category_Data" 
							value="#{footer_banner_category.model}" var="to"
							rows="#{footer_banner_category.pageLimit}"
							columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
									aon-editDataTable-buttonsColumn">
					
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:outputText value="&#160;" rendered="#{to==footer_banner_category.to}" />
								<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
									rendered="#{to!=footer_banner_category.to}"
									styleClass="aon-editDataTable-button aon-icon-delete"
									reRender="footer_banner_category_DataDiv" immediate="true">
									<aon:actionListener method="#{footer_banner_category.onRemoveRow}" />
								</aon:commandButton>
								<f:facet name="footer">
									<aon:div>
										<aon:commandButton id="reset"
											title="[#{bundle.aon_reset}]"
											styleClass="aon-editDataTable-button aon-icon-reset" value=""
											immediate="true" reRender="footer_banner_category_DataDiv"
											rendered="#{!footer_banner_category.new}" 
											accesskey="#{bundle.aon_key_new_line}">
											<aon:actionListener method="#{footer_banner_category.onReset}" />
										</aon:commandButton>
									</aon:div>
								</f:facet>
							</aon:column>
					
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.cms_alias}" />
								</f:facet>
								<aon:outputText value="#{to.bannerCategory.alias}" 
									rendered="#{to!=footer_banner_category.to}" />
								<f:facet name="footer">
									<aon:selectOneMenu styleClass="aon-form-selectOneMenu-field"
										rendered="#{footer_banner_category.new}" 
										value="#{footer_banner_category.to.bannerCategory.id}">
										<f:selectItems value="#{collections.bannerGroupList}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
					
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<f:verbatim rendered="#{to!=footer_banner_category.to}">&#160;</f:verbatim>
								<f:facet name="footer">
									<aon:div rendered="#{footer_banner_category.new}">
										<f:verbatim rendered="#{!footer_banner_category.new}">&#160;</f:verbatim>
										<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
											styleClass="aon-editDataTable-button aon-icon-accept"
											reRender="footer_banner_category_DataDiv">
											<aon:actionListener method="#{footer_banner_category.onAccept}" />
										</aon:commandButton>
										<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
											styleClass="aon-editDataTable-button aon-icon-cancel"
											reRender="footer_banner_category_DataDiv" immediate="true">
											<aon:actionListener method="#{footer_banner_category.onCancel}" />
										</aon:commandButton>
									</aon:div>
								</f:facet>
							</aon:column>
						</aon:dataTable>
						
						<aon:dataScroller2 for="footer_banner_category_Data" />
					</aon:div>					
					
				</aon:panelTab>			

			</aon:panelTabSet>
			
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
