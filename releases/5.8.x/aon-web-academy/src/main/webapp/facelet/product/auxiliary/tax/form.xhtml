<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
		<t:stylesheet path="/jscalendar-1.0/calendar-system.css" />
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/lang/calendar-es.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar-setup.js">
			// nothing
		</script>
	</ui:define>
	<ui:define name="content">
		<h:form id="taxForm"  styleClass="aon-form">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<h:commandButton id="save" value="#{bundle.aon_save}"
						forceId="#{true}" actionListener="#{tax.accept}"
						onclick="return (confirm('#{bundle.aon_save_confirm}'));" 
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
						accesskey="#{bundle.aon_key_save}"/>
					<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
						actionListener="#{tax.onCancel}" action="tax_list"
						immediate="#{true}"
						onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
						accesskey="#{bundle.aon_key_cancel}"/>
					<t:commandButton id="remove" value="#{bundle.aon_remove}"
						forceId="#{true}" actionListener="#{tax.onRemove}"
						action="tax_list" rendered="#{!tax.new}"
						onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'" 
						accesskey="#{bundle.aon_key_remove}"/>
					<h:commandButton id="reset" value="#{bundle.aon_reset}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
						actionListener="#{tax.onReset}" rendered="#{!tax.new}"
						action="tax_form" 
						accesskey="#{bundle.aon_key_new}"/>
				</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText
						value="#{tax.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</t:div>
			</t:div>
			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<h:outputLabel for="Tax_description"
							styleClass="aon-form-input-text-label"
							value="#{productBundle.tax_description}" />
						<t:inputText id="Tax_description" value="#{tax.to.name}"
							styleClass="aon-form-input-text"
							forceId="#{true}" size="25" maxlength="30"
							required="#{true}">
							<f:validateLength maximum="32" />
						</t:inputText>

						<t:outputLabel for="Tax_type"
							styleClass="aon-form-selectOneMenu-label"
							value="#{productBundle.tax_type}" />
						<h:selectOneMenu id="Tax_type"
							styleClass="aon-form-selectOneMenu-field"
							value="#{tax.to.type}">
							<f:selectItems value="#{productCollections.taxTypes}" />
						</h:selectOneMenu>

						<h:outputLabel for="Tax_startDate"
							value="#{productBundle.tax_start_date}"
							styleClass="aon-form-input-text-label " />
						<t:div styleClass="aon-form-nowrap">
							<t:inputText id="Tax_startDate"
								styleClass="aon-form-input-text"
								required="true" forceId="#{true}"
								value="#{tax.to.startDate}" size="10" maxlength="12">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</t:inputText>
							<t:commandButton styleClass="aon-form-calendar-button"
								id="Tax_startDate_button" forceId="#{true}" value=""
								immediate="true" />
							<script type="text/javascript">
							  Calendar.setup( {
								inputField  : "Tax_startDate", button : "Tax_startDate_button",
								ifFormat    : "%d/%m/%Y" } );
							</script>
						</t:div>

						<h:outputLabel for="Tax_percentage"
							styleClass="aon-form-input-text-label"
							value="#{productBundle.tax_percentage}" />
						<t:inputText id="Tax_percentage" value="#{tax.to.percentage}"
							styleClass="aon-form-input-text"
							forceId="#{true}" size="5"
							required="#{true}" />

						<h:outputLabel for="Tax_surcharge"
							styleClass="aon-form-input-text-label"
							value="#{productBundle.tax_surcharge}" />
						<t:inputText id="Tax_surcharge" value="#{tax.to.surcharge}"
							styleClass="aon-form-input-text"
							forceId="#{true}" size="5"
							required="#{true}" />

					</h:panelGrid>

					<t:div styleClass="aon-form-group" rendered="#{!tax.new}">
						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="taxDetailData" var="to"
								styleClass="aon-edit-table" headerClass="aon-edit-table-header"
								footerClass="aon-edit-table-footer" cellpadding="0"
								cellspacing="0" value="#{taxDetail.model}"
								rowOnMouseOver="selectRow( this )" rows="20"
								rowIndexVar="rowIndex" rowOnMouseOut="unselectRow( this )"
								rowOnClick="sendRow( this )" rendered="#{!tax.new}"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body aon-edit-table-body-string,aon-edit-table-body aon-edit-table-body-string,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-buttons">

								<h:column>
									<f:facet name="header">
										<h:outputLabel for="TaxDetail_startDate" value="#{productBundle.tax_detail_start_date}" />
									</f:facet>
									<t:commandLink immediate="#{true}"
										styleClass="aon-table-row-selected"
										rendered="#{to!=taxDetail.to}"
										actionListener="#{taxDetail.onSelect}" />
									<h:outputText value="#{to.startDate}" rendered="#{to.id!=taxDetail.to.id}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</h:outputText>
									<h:panelGrid columns="1" rendered="#{to.id==taxDetail.to.id}" >
										<t:div styleClass="aon-form-nowrap">
											<t:inputText styleClass="aon-form-input-text"
												id="TaxDetail_startDate" required="true" forceId="#{true}"
												value="#{taxDetail.to.startDate}" size="10" maxlength="12">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</t:inputText>
											<t:commandButton styleClass="aon-form-calendar-button"
												id="TaxDetail_startDate_button" forceId="#{true}" value=""
												immediate="true" />
											<script type="text/javascript">
											  		Calendar.setup( {
													inputField  : "TaxDetail_startDate[#{rowIndex}]", button : "TaxDetail_startDate_button[#{rowIndex}]",
													ifFormat    : "%d/%m/%Y" } );
												</script>
										</t:div>
									</h:panelGrid>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputLabel for="TaxDetail_endDate" value="#{productBundle.tax_detail_end_date}" />
									</f:facet>
									<h:outputText value="#{to.endDate}" rendered="#{to.id!=taxDetail.to.id}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</h:outputText>
									<h:panelGrid columns="1" rendered="#{to.id==taxDetail.to.id}" >
										<t:div styleClass="aon-form-nowrap">
											<t:inputText styleClass="aon-form-input-text"
												id="TaxDetail_endDate" required="true" forceId="#{true}"
												value="#{taxDetail.to.endDate}" size="10" maxlength="12">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</t:inputText>
											<t:commandButton styleClass="aon-form-calendar-button"
												id="TaxDetail_endDate_button" forceId="#{true}" value=""
												immediate="true" />
											<script type="text/javascript">
											  		Calendar.setup( {
													inputField  : "TaxDetail_endDate[#{rowIndex}]", button : "TaxDetail_endDate_button[#{rowIndex}]",
													ifFormat    : "%d/%m/%Y" } );
												</script>
										</t:div>
									</h:panelGrid>
								</h:column>

								<t:column width="60">
									<f:facet name="header">
										<t:outputLabel for="TaxDetail_value" value="#{productBundle.tax_detail_value}" />
									</f:facet>
									<t:outputText value="#{to.value}"
										rendered="#{to!=taxDetail.to}" />
									<t:inputText id="TaxDetail_value"
										rendered="#{to==taxDetail.to}" forceId="#{true}"
										value="#{taxDetail.to.value}" required="#{true}"
										styleClass="aon-form-input-text" size="7" />
								</t:column>

								<t:column width="60">
									<f:facet name="header">
										<t:outputLabel for="TaxDetail_surcharge" value="#{productBundle.tax_detail_surcharge}" />
									</f:facet>
									<t:outputText value="#{to.surcharge}"
										rendered="#{to!=taxDetail.to}" />
									<t:inputText id="TaxDetail_surcharge"
										rendered="#{to==taxDetail.to}" forceId="#{true}"
										value="#{taxDetail.to.surcharge}" required="#{true}"
										styleClass="aon-form-input-text" size="7" />
								</t:column>

								<t:column width="60">
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:div rendered="#{to==taxDetail.to}">
										<t:commandButton title="#{bundle.aon_save}"
											actionListener="#{taxDetail.onAccept}"
											value=""
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
											accesskey="#{bundle.aon_key_save_line}" />
										<t:commandButton title="#{bundle.aon_cancel}"
											actionListener="#{taxDetail.onCancel}"
											immediate="#{true}"
											onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
											value=""
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
											accesskey="#{bundle.aon_key_cancel_line}" />
										<t:commandButton title="#{bundle.aon_remove}"
											actionListener="#{taxDetail.onRemove}"
											immediate="#{true}"
											onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
											value=""
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
											accesskey="#{bundle.aon_key_remove_line}" />
									</t:div>
								</t:column>
 
 							</t:dataTable>
							
							<ui:include src="/facelet/shared/dataScroller.xhtml">
								<ui:param name="dataTable" value="taxDetailData" />
								<ui:param name="model" value="#{taxDetail.model}" />
								<ui:param name="showNote" value="#{false}" />
							</ui:include>
							
						</t:div>
					</t:div>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
