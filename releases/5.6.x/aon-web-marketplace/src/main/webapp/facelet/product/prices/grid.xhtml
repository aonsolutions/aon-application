<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">

<body>
<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/js/Calculations.js">
			// nothing
		</script>
	</ui:define>

	<ui:define name="content">
	
		<h:form id="itemList">
			<!--  toolbar navigation -->
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<h:commandButton id="search" value="#{bundle.aon_search}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-accept"
						actionListener="#{itemPrices.onSearch}"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-accept'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-accept'" 
						accesskey="#{bundle.aon_key_search}"/>
					<t:commandButton id="itemPrices" value="#{bundle.aon_listing}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-list"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-list'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-list'"
						forceId="#{true}" 
						rendered="#{itemPrices.model.rowCount > 0 and itemPrices.to==null and !itemPrices.new}"
						onclick="reportWindow(this, 'itemAuxForm', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
						accesskey="#{bundle.aon_key_print}"/>
				</t:div>
				</t:div>
			</t:div>
			
			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<!-- start of bag panel -->
					<!-- start of flow layout -->
					<h:panelGrid columns="2" 
						dir="true" 
						styleClass="aon-form-table" 
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
		
						<h:outputLabel for="Item_product_category"
							value="#{productBundle.item_category}:" forceId="#{true}" />
						<h:selectOneMenu id="Item_product_category"
							valueChangeListener="#{itemPrices.addCategoryCriteria}" 
							converter="IntegerEmptyConverter" forceId="#{true}">
							<f:selectItem itemValue="" itemLabel="" />
							<f:selectItems value="#{productCollections.categoriesByGroup}" />
						</h:selectOneMenu>
		
					</h:panelGrid>
				</t:div>
				
				<t:div styleClass="aon-scroll-area-internal">
					<t:div styleClass="aon-table-hack">
						<t:dataTable id="itemDataList" 
							value="#{itemPrices.model}" 
							rows="20" var="to"
							rendered="#{itemPrices.model.rowCount > 0}"
							rowOnMouseOver="selectRow( this )"
							rowOnMouseOut="unselectRow( this )" 
							rowOnClick="sendRow( this )"
							rowIndexVar="rowIndex"
							styleClass="aon-edit-table" headerClass="aon-edit-table-header" footerClass="aon-edit-table-footer"
							rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
							columnClasses="aon-edit-table-body aon-edit-table-body-string,
								aon-edit-table-body aon-edit-table-body-string,
								aon-edit-table-body aon-edit-table-body-number,
								aon-edit-table-body aon-edit-table-body-number,
								aon-edit-table-body aon-edit-table-body-number,
								aon-edit-table-body aon-edit-table-body-number,
								aon-edit-table-body aon-edit-table-body-number">

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{productBundle.item_code}" />
								</f:facet>
								<t:commandLink immediate="#{true}"  
									styleClass="aon-table-row-selected"
									rendered="#{to!=itemPrices.to}"
									actionListener="#{itemPrices.onSelect}" />
								<h:outputText value="#{to.product.code}" />
								<f:facet name="footer">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
							</h:column>
		
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{productBundle.item_description}" />
								</f:facet>
								<h:outputText value="#{to.product.name} #{to.detail}" />
								<f:facet name="footer">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{productBundle.item_current_cost}" />
								</f:facet>
								<t:outputText id="Item_basePrice" 
									forceId="#{true}" 
									value="#{itemPrices.rowIndexRealBasePrice}" 
									rendered="#{to==itemPrices.to}" />
								<t:inputHidden id="Item_purchasePrice" 
									forceId="#{true}"
									value="#{itemPrices.to.purchasePrice}" 
									rendered="#{to==itemPrices.to}"/>
								<h:outputText value="#{itemPrices.rowIndexRealBasePrice}"
									rendered="#{to!=itemPrices.to}">
									<f:convertNumber pattern="#,##0.000" />
								</h:outputText>
								<f:facet name="footer">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
							</h:column>
		
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{productBundle.item_last_purchase_cost}" />
								</f:facet>
								<t:outputText id="Item_lastBasePrice" 
									forceId="#{true}" 
									value="#{itemPrices.rowIndexBasePrice}" 
									rendered="#{to==itemPrices.to}" />
								<t:inputHidden id="Item_lastPurchasePrice" 
									forceId="#{true}"
									value="#{itemPrices.rowIndexPurchasePrice}" 
									rendered="#{to==itemPrices.to}"/>
								<h:outputText value="#{itemPrices.rowIndexBasePrice}"
									rendered="#{to!=itemPrices.to}">
									<f:convertNumber pattern="#,##0.000" />
								</h:outputText>
								<f:facet name="footer">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
							</h:column>
		
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{productBundle.item_salesPrice}" />
								</f:facet>
								<h:outputText value="#{itemPrices.rowIndexTotalPrice}"
									rendered="#{to!=itemPrices.to}">
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
								<t:inputText rendered="#{to==itemPrices.to}" size="12"
									id="Item_rowIndexTotalPrice" forceId="#{true}" 
									onchange="salesChange(#{rowIndex});"
									value="#{itemPrices.rowIndexTotalPrice}" required="#{true}" />
								<t:inputHidden id="Item_tax2" forceId="#{true}"
									value="#{itemPrices.rowIndexTaxPercentage}" 
									rendered="#{to==itemPrices.to}"/>
								<t:inputHidden id="Item_price" forceId="#{true}"
									value="#{itemPrices.to.price}" 
									rendered="#{to==itemPrices.to}"/>
								<f:facet name="footer">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
							</h:column>
		
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{productBundle.item_benefitPercent}" />
								</f:facet>
								<t:inputHidden id="Item_profitPercent" 
									forceId="#{true}"
									value="#{to.profitPercent}" 
									rendered="#{to==itemPrices.to}"/>
								<t:outputText value="#{itemPrices.rowIndexProfitPercent}"
									rendered="#{to!=itemPrices.to}">
									<f:convertNumber pattern="#,##0.000" />
								</t:outputText>
								<t:inputText id="Item_profit_percent" forceId="#{true}" 
							 		size="12"
									value="#{itemPrices.rowIndexProfitPercent}" 
									onchange="profitChange(#{rowIndex});"
									rendered="#{to==itemPrices.to}" />
								<f:facet name="footer">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
							</h:column>
		
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{productBundle.item_benefitPercent2}" />
								</f:facet>
								<h:outputText value="#{itemPrices.rowIndexProfitPercent2}"
									rendered="#{to!=itemPrices.to}">
									<f:convertNumber pattern="#,##0.000" />
								</h:outputText>
								<t:inputText id="Item_profit_percent2" forceId="#{true}" 
							 		size="12"
									value="#{itemPrices.rowIndexProfitPercent2}"
									onchange="benefitChange(#{rowIndex});"
									rendered="#{to==itemPrices.to}" />
								<f:facet name="footer">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
							</h:column>
		
							<h:column>
								<f:facet name="header">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
								<t:commandButton title="#{bundle.aon_accept}" 
									actionListener="#{itemPrices.onAcceptNext}"
									onclick="updateRealData(#{rowIndex});return (confirm('#{bundle.aon_accept_confirm}'));" 
									styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
									value="" rendered="#{to==itemPrices.to}"
									accesskey="#{bundle.aon_key_save_line}"/>
								<t:commandButton title="#{bundle.aon_cancel}" 
									actionListener="#{itemPrices.onCancel}"
									immediate="#{true}" 
									onclick="return (confirm('#{bundle.aon_cancel_confirm}'));" 
									styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
									value="" accesskey="#{bundle.aon_key_cancel_line}"
									rendered="#{to==itemPrices.to}"/>
									<f:verbatim rendered="#{to.id!=itemPrices.to.id}">&#160;</f:verbatim>
							</h:column>
						</t:dataTable>

						<t:div styleClass="aon-datascroller"
							rendered="#{itemPrices.model.rowCount > 20}">
							<h:panelGrid columns="2"
								columnClasses="aon-datascroller-text,aon-datascroller-buttons">
								<t:dataScroller id="scroll_1" for="itemDataList"
									rowsCountVar="rowsCount" firstRowIndexVar="firstRowIndex"
									lastRowIndexVar="lastRowIndex"
									rendered="#{itemPrices.model.rowCount > 20}">
									<h:outputFormat value="#{bundle.aon_scroll}">
										<f:param value="#{firstRowIndex}" />
										<f:param value="#{lastRowIndex}" />
										<f:param value="#{rowsCount}" />
									</h:outputFormat>
								</t:dataScroller>

								<t:dataScroller id="scroll_0" for="itemDataList" fastStep="5"
									paginator="#{true}" paginatorMaxPages="5"
									paginatorActiveColumnClass="aon-datascroller-currentpage"
									paginatorColumnClass="aon-datascroller-page"
									rendered="#{itemPrices.model.rowCount > 20}">
		
									<f:facet name="first">
										<t:div styleClass="aon-datascroller-button-first">&#160;</t:div>
									</f:facet>
									<f:facet name="last">
										<t:div styleClass="aon-datascroller-button-last">&#160;</t:div>
									</f:facet>
									<f:facet name="previous">
										<t:div styleClass="aon-datascroller-button-previous">&#160;</t:div>
									</f:facet>
									<f:facet name="next">
										<t:div styleClass="aon-datascroller-button-next">&#160;</t:div>
									</f:facet>
									<f:facet name="fastforward">
										<t:div styleClass="aon-datascroller-button-fastforward">&#160;</t:div>
									</f:facet>
									<f:facet name="fastrewind">
										<t:div styleClass="aon-datascroller-button-fastrewind">&#160;</t:div>
									</f:facet>
								</t:dataScroller>
							</h:panelGrid>
						</t:div>
					</t:div>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="itemAuxForm" target="list" />
		<script>
			function salesChange(rowIndex){
				document.getElementById('Item_rowIndexTotalPrice[' + rowIndex + ']').value = redondea(document.getElementById('Item_rowIndexTotalPrice[' + rowIndex + ']').value, 2);
				salePrice = new Number(document.getElementById('Item_rowIndexTotalPrice[' + rowIndex + ']').value);
				tax = new Number(document.getElementById('Item_tax2[' + rowIndex + ']').value);
				taxableBase = new Number(redondea(salePrice / (1 + tax / 100), 3));
				document.getElementById('Item_price[' + rowIndex + ']').value = redondea(taxableBase, 3);
				basePrice = new Number(document.getElementById('Item_lastBasePrice[' + rowIndex + ']').innerText);
				profit = new Number(salePrice - basePrice);
				if (basePrice != 0) {
					document.getElementById('Item_profit_percent[' + rowIndex + ']').value = redondea(profit * 100 / basePrice, 3);
				} else {
					document.getElementById('Item_profit_percent[' + rowIndex + ']').value = 0;
				}
				if (salePrice != 0) {
					document.getElementById('Item_profit_percent2[' + rowIndex + ']').value = redondea(profit * 100 / salePrice, 3);
				} else {
					document.getElementById('Item_profit_percent2[' + rowIndex + ']').value = 0;
				}
			}

			function profitChange(rowIndex){
				document.getElementById('Item_profit_percent[' + rowIndex + ']').value = redondea(document.getElementById('Item_profit_percent[' + rowIndex + ']').value, 3);
				profitPercent = new Number(document.getElementById('Item_profit_percent[' + rowIndex + ']').value);
				basePrice = new Number(document.getElementById('Item_lastBasePrice[' + rowIndex + ']').innerText);
				profit = new Number(redondea(profitPercent * basePrice / 100, 3));
				salePrice = new Number(profit + basePrice);
				document.getElementById('Item_profit_percent2[' + rowIndex + ']').value = redondea(profit * 100 / salePrice, 3);
				tax = new Number(document.getElementById('Item_tax2[' + rowIndex + ']').value);
				document.getElementById('Item_price[' + rowIndex + ']').value = redondea(salePrice / (1 + tax / 100), 3);
				document.getElementById('Item_rowIndexTotalPrice[' + rowIndex + ']').value = redondea(salePrice, 2);
			}

			function benefitChange(rowIndex){
				document.getElementById('Item_profit_percent2[' + rowIndex + ']').value = redondea(document.getElementById('Item_profit_percent2[' + rowIndex + ']').value, 3);
				if (document.getElementById('Item_profit_percent2[' + rowIndex + ']').value >= 100) {
					alert("Valor incorrecto.");
					document.getElementById('Item_profit_percent2[' + rowIndex + ']').focus();
				} else {
					basePrice = new Number(document.getElementById('Item_lastBasePrice[' + rowIndex + ']').innerText);
					profitPercent2 = new Number(document.getElementById('Item_profit_percent2[' + rowIndex + ']').value);
					salePrice = new Number( redondea((basePrice * 100) / (100 - profitPercent2), 2));
					document.getElementById('Item_rowIndexTotalPrice[' + rowIndex + ']').value = salePrice;
					tax = new Number(document.getElementById('Item_tax2[' + rowIndex + ']').value);
					taxableBase = new Number(redondea((salePrice / (1 + tax / 100)) ,3));
					document.getElementById('Item_price[' + rowIndex + ']').value = taxableBase;
					profit = new Number(salePrice - basePrice);
					if (basePrice != 0) {
						document.getElementById('Item_profit_percent[' + rowIndex + ']').value = redondea(profit * 100 / basePrice, 3);
					} else {
						document.getElementById('Item_profit_percent[' + rowIndex + ']').value = 0;
					}
				}
			}

			function updateRealData(rowIndex){
				document.getElementById('Item_purchasePrice[' + rowIndex + ']').value = redondea(document.getElementById('Item_lastPurchasePrice[' + rowIndex + ']').value, 3);
				document.getElementById('Item_profitPercent[' + rowIndex + ']').value = document.getElementById('Item_profit_percent[' + rowIndex + ']').value;
			}
		</script>
	</ui:define>
</ui:composition>
</body>
</html>
