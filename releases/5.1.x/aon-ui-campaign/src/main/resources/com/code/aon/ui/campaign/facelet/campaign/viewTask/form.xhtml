<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">


	<ui:define name="content">
		<aon:form id="activityProcessForm" styleClass="aon-form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{campaignBundle.aon_process_monitor_module}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{campaignBundle.campaign_view_task}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandButton id="cancel" value="#{bundle.aon_back}"
							actionListener="#{activityProcess.onCancel}"
							action="campaign_form" immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="dataTable" columns="2">
					<aon:outputText value="#{campaignBundle.campaign_label}" />
					<aon:outputText value="#{campaign.to.description}"/>

					<aon:outputText value="#{customerBundle.customer_customer}" />
					<aon:outputText value="#{activityProcess.campaignDossierExtended.campaignDossier.dossier.customer.registry.fullName}" />						

					<aon:outputText value="#{projectBundle.dossier_dossier}" />
					<aon:outputText value="#{activityProcess.campaignDossierExtended.campaignDossier.dossier.number}"/>
				</aon:panelGrid>


				<aon:div styleClass="aon-form-group">
					<aon:div styleClass="aon-form-group-title">
						<aon:outputText value="#{campaignBundle.aon_tasks}" />
					</aon:div>

					<aon:div styleClass="aon-form-group-body">
						<aon:dataTable id="ActivityProcessDataList" var="to"
							value="#{activityProcess.model}" rows="20">

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.task.description}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-iconColumn">
								<f:facet name="header">
									<aon:outputText value="C" />
								</f:facet>
								<aon:div style="display:inline;cursor:pointer;"
									rendered="#{to.task.comments != null and to.task.comments!=''}">
									<aon:graphicImage url="/css/images/icons/aon-task-comment.gif" />
									<rich:toolTip value="#{to.task.comments}" showEvent="onclick"
										style="width: 400px;"
										hideDelay="2000">
										<f:facet name="defaultContent">
											<aon:outputText value="#{bundle.aon_in_progress}" />
										</f:facet>
									</rich:toolTip>
								</aon:div>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{campaignBundle.aon_initial_date}" />
								</f:facet>
								<aon:outputText value="#{to.task.startDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{campaignBundle.aon_final_date}" />
								</f:facet>
								<aon:outputText value="#{to.task.endDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{projectBundle.aon_due_date}" />
								</f:facet>
								<aon:outputText value="#{to.task.dueDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_status}" />
								</f:facet>
								<aon:outputText value="#{to.task.status}" />
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{campaignBundle.aon_work_group}" />
								</f:facet>
								<aon:outputText value="#{to.task.workGroup.description}" />
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText
										value="#{projectBundle.aon_daily_tracking_user}" />
								</f:facet>
								<aon:outputText value="#{to.task.user.name}" />
							</aon:column>
						</aon:dataTable>

						<aon:dataScroller2 for="ActivityProcessDataList" showNote="true" />
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
