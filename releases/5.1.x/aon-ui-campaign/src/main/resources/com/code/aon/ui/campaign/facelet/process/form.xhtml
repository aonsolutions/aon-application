<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="processForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{campaignBundle.process_process}" />
				<ui:param name="controller" value="#{process}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="launch"
						value="#{campaignBundle.process_wizard}" immediate="true"
						rendered="#{!process.new}" action="#{processWizard.start}"
						styleClass="aon-finding-toolbar-item aon-icon-launch-process" />
				</ui:define>
			</ui:decorate>

			<aon:div id="fieldContainer" styleClass="aon-scroll-area">

				<aon:panelGrid columns="4" dir="true" style="width: 90%;"
					columnClasses="aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-auto
						,aon-panelGrid-odd aon-width-100
						,aon-panelGrid-even aon-width-250">
					<aon:outputLabel for="Process_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Process_description"
						value="#{process.to.description}" size="70" maxlength="64">
						<f:validateLength maximum="64" />
					</aon:inputText>
					
					<aon:outputText value="#{bundle.aon_status}"/>
					<aon:selectOneMenu value="#{process.to.status}">
						<f:selectItems value="#{campaignCollections.processStatus}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
				
				<aon:div styleClass="aon-form-group" rendered="#{!process.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:outputLabel for="ProcessDetailDataList"
							value="#{campaignBundle.process_actions}" />
					</aon:div>

					<aon:div id="detailContainer" styleClass="aon-form-group-body">
						<aon:editDataTable id="detailDataList" var="to"
							value="#{processDetail.model}" rows="20">

							<aon:column styleClass="aon-editDataTable-iconColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:commandButton focus="desc_edit" immediate="true"
									styleClass="aon-icon-commandButton aon-icon-rowSelector"
									actionListener="#{processDetailTransition.onCancel}">
									<aon:actionListener method="#{processDetail.onSelect}" />
								</aon:commandButton>
								<f:facet name="footer">
									<aon:div>
										<aon:commandButton value="" focus="desc_new"
											styleClass="aon-editDataTable-button aon-icon-new"
											actionListener="#{processDetailTransition.onCancel}"
											rendered="#{!processDetail.new}"
											accesskey="#{bundle.aon_key_new_line}">
											<aon:actionListener
												method="#{processDetail.onReset}" />
										</aon:commandButton>
										<aon:outputText rendered="#{processDetail.new}" value="&#160;" />
									</aon:div>
								</f:facet>
							</aon:column>
							<aon:column styleClass="aon-editDataTable-iconColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:div styleClass="aon-nowrap">
									<aon:graphicImage url="/css/images/icons/aon-arrow-up.gif"
										style="cursor:pointer" rendered="#{to.position != 0}">
										<a4j:support event="onclick"
											actionListener="#{processDetail.onMoveUp}"
											reRender="detailDataList" />
									</aon:graphicImage>

									<aon:graphicImage url="/css/images/icons/aon-arrow-down.gif"
										style="cursor:pointer"
										rendered="#{to.position &lt; (processDetail.model.rowCount-1)}">
										<a4j:support event="onclick"
											actionListener="#{processDetail.onMoveDown}"
											reRender="detailDataList" />
									</aon:graphicImage>
								</aon:div>
								<f:facet name="footer">
									<aon:outputText value="&#160;" />
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}"
									rendered="#{to!=processDetail.to}" />
								<aon:inputText id="desc_edit"
									value="#{processDetail.to.description}"
									styleClass="aon-form-input-text"
									rendered="#{to==processDetail.to}" required="true"
									maxlength="64" size="30" />
								<f:facet name="footer">
									<aon:div>
										<aon:inputText id="desc_new"
											value="#{processDetail.to.description}"
											styleClass="aon-form-input-text"
											rendered="#{processDetail.new}" required="true"
											maxlength="64" size="30" />
									</aon:div>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{campaignBundle.process_reference}" />
								</f:facet>
								<aon:outputText value="#{to.dateReference}"
									rendered="#{to!=processDetail.to}" />
								<aon:selectOneMenu value="#{processDetail.to.dateReference}"
									rendered="#{to==processDetail.to}">
									<f:selectItems value="#{campaignCollections.dateReferences}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:div>
										<aon:selectOneMenu value="#{processDetail.to.dateReference}"
											rendered="#{processDetail.new}">
											<f:selectItems value="#{campaignCollections.dateReferences}" />
										</aon:selectOneMenu>
									</aon:div>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-numberColumn">
								<f:facet name="header">
									<aon:outputText value="#{campaignBundle.process_days}" />
								</f:facet>
								<aon:outputText value="#{to.days}"
									rendered="#{to!=processDetail.to}" />
								<aon:inputText value="#{processDetail.to.days}"
									rendered="#{to==processDetail.to}" required="true"
									maxlength="5" size="8" />
								<f:facet name="footer">
									<aon:div>
										<aon:inputText value="#{processDetail.to.days}"
											rendered="#{processDetail.new}" required="true" maxlength="5"
											size="8" />
									</aon:div>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-numberColumn">
								<f:facet name="header">
									<aon:outputText
										value="#{campaignBundle.process_alert_beforehand}" />
								</f:facet>
								<aon:outputText value="#{to.alertDays}"
									rendered="#{to!=processDetail.to}" />
								<aon:inputText value="#{processDetail.to.alertDays}"
									rendered="#{to==processDetail.to}" required="true"
									maxlength="5" size="8" />
								<f:facet name="footer">
									<aon:div>
										<aon:inputText value="#{processDetail.to.alertDays}"
											rendered="#{processDetail.new}" required="true" maxlength="5"
											size="8" />
									</aon:div>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{campaignBundle.aon_work_group}" />
								</f:facet>
								<aon:outputText value="#{to.workgroup.description}"
									rendered="#{to!=processDetail.to}" />
								<aon:selectOneMenu value="#{processDetail.to.workgroup}"
									rendered="#{to==processDetail.to}">
									<f:selectItem itemLabel="-" value="#{null}"/>
									<f:selectItems value="#{configCollections.workgroups}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:div>
										<aon:selectOneMenu value="#{processDetail.to.workgroup}"
											rendered="#{processDetail.new}">
											<f:selectItem itemLabel="-" value="#{null}"/>
											<f:selectItems value="#{configCollections.workgroups}" />
										</aon:selectOneMenu>
									</aon:div>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{projectBundle.task_priority}" />
								</f:facet>
								<aon:outputText value="#{to.priority}" rendered="#{to!=processDetail.to}" />
								<aon:selectOneMenu value="#{processDetail.to.priority}"
										rendered="#{to==processDetail.to}">
									<f:selectItems value="#{projectCollections.taskPriorities}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu value="#{processDetail.to.priority}"
											rendered="#{processDetail.new}">
										<f:selectItems value="#{projectCollections.taskPriorities}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_status}"/>
								</f:facet>
								<aon:outputText value="#{to.status}" rendered="#{to!=processDetail.to}" />
								<aon:selectOneMenu value="#{processDetail.to.status}"
									rendered="#{to==processDetail.to}">
									<f:selectItems value="#{campaignCollections.processDetailStatus}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu value="#{processDetail.to.status}"
										rendered="#{processDetail.new}">
										<f:selectItems value="#{campaignCollections.processDetailStatus}" /> 
										<f:selectItems value="#{campaignCollections.processDetailStatus}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:div>
									<aon:commandButton title="#{bundle.aon_save}"
										rendered="#{to==processDetail.to}"
										actionListener="#{processDetailTransition.onCancel}"
										onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
										styleClass="aon-editDataTable-button aon-icon-accept" value=""
										accesskey="#{bundle.aon_key_save_line}">
										<aon:actionListener
											method="#{processDetail.onAccept}" />
									</aon:commandButton>
									<aon:commandButton title="#{bundle.aon_cancel}"
										rendered="#{to==processDetail.to}"
										actionListener="#{processDetailTransition.onCancel}" immediate="true"
										onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
										styleClass="aon-editDataTable-button aon-icon-cancel" value=""
										accesskey="#{bundle.aon_key_cancel_line}">
										<aon:actionListener
											method="#{processDetail.onCancel}" />
									</aon:commandButton>
									<aon:commandButton title="#{bundle.aon_remove}"
										rendered="#{to==processDetail.to}"
										actionListener="#{processDetailTransition.onCancel}" immediate="true"
										onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
										styleClass="aon-editDataTable-button aon-icon-delete" value=""
										accesskey="#{bundle.aon_key_remove_line}">
										<aon:actionListener
											method="#{processDetail.onRemove}" />
									</aon:commandButton>
									<aon:commandButton value="" title="#{campaignBundle.process_transition_new}"
										styleClass="aon-editDataTable-button aon-icon-new"
										actionListener="#{processDetailTransition.onReset}"
										rendered="#{to==processDetail.to and !processDetailTransition.new}"
										focus="type_new"
										accesskey="#{bundle.aon_key_new_line}">
									</aon:commandButton>
								</aon:div>
								<f:facet name="footer">
									<aon:div>
										<aon:div rendered="#{processDetail.new}">
											<aon:commandButton title="#{bundle.aon_save}"
												actionListener="#{processDetail.onAccept}"
												onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
												styleClass="aon-editDataTable-button aon-icon-accept"
												value="" accesskey="#{bundle.aon_key_save_line}" />
											<aon:commandButton title="#{bundle.aon_cancel}"
												actionListener="#{processDetail.onCancel}" immediate="true"
												onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
												styleClass="aon-editDataTable-button aon-icon-cancel"
												value="" accesskey="#{bundle.aon_key_cancel_line}" />
										</aon:div>
										<aon:outputText rendered="#{!processDetail.new}" value="&#160;" />
									</aon:div>
								</f:facet>
							</aon:column>

							<ui:include src="/com/code/aon/ui/campaign/facelet/process/form_transition.xhtml" />

						</aon:editDataTable>

						<aon:dataScroller2 for="detailDataList" showNote="true"/>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
