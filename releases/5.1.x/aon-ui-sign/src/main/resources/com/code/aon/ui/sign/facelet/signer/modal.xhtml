<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showSignWindow">
		<c:if test="#{certificate.showSignWindow}">
			<rich:modalPanel id="invoiceSignerModalPanel" 
				rendered="#{certificate.showSignWindow}" showWhenRendered="true"
				minWidth="380" minHeight="370" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{signBundle.sign_sign_selected}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showSignWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{certificate.showSignWindow}" value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="passwordForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div id="signToolbar" styleClass="aon-toolbar">
								<aon:commandButton id="sign_selected"
									value="#{signBundle.sign_sign}"
									rendered="#{!certificate.usingSmartCard}"
									reRender="showSignWindow,#{signButtonreRender}"
									styleClass="aon-finding-toolbar-item aon-icon-accept"
									actionListener="#{signActionListener}"
									onclick="Richfaces.showModalPanel('waitProccess')" 
						     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
								<aon:commandButton id="sign"
									value="#{signBundle.sign_sign}"
									rendered="#{certificate.usingSmartCard}"
									reRender="showSignWindow,#{signButtonreRender}"
									styleClass="aon-finding-toolbar-item aon-icon-accept"
									actionListener="#{signActionListener}"
									onclick="if (!signPdf()){return true}" />						     													
								<aon:commandButton id="sign-cancel"
									value="#{bundle.aon_cancel}"
									reRender="showSignWindow"
									immediate="true"
									styleClass="aon-finding-toolbar-item aon-icon-cancel">
									<f:setPropertyActionListener
										target="#{certificate.showSignWindow}"
										value="#{false}" />
								</aon:commandButton>
							</aon:div>
							
							<aon:panelTabSet selectedTab="#{certificate.selectedTab}">

								<aon:panelTab id="software" label="#{signBundle.sign_software_certificate}"
									reRender="signToolbar" rendered="#{certificate.certificateCount>0}" >
									<ui:include src="/com/code/aon/ui/sign/facelet/signer/software.xhtml" />
								</aon:panelTab>

								<aon:panelTab id="smartCard" label="#{signBundle.sign_smartCard_certificate}"
									reRender="signToolbar" rendered="#{company.smartCard and (!skipSmartCardTab) }" >
									<ui:include src="/com/code/aon/ui/sign/facelet/signer/smartCard.xhtml" />
								</aon:panelTab>

							</aon:panelTabSet>							

						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
