<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="#{bank_id}Container" rendered="#{renderedAttr}">
		<a4j:region>
			<aon:inputText id="#{bank_id}" value="#{bankEntity}"
				disabled="#{disabled}" required="#{required}" size="5">
				<a4j:support event="onkeyup"
					onsubmit="if(event.keyCode != 113) return false;"
					eventsQueue="#{bank_id}KeyUp" ignoreDupResponses="true"
					requestDelay="100" actionListener="#{bankWizard.onShow}"
					immediate="true" reRender="#{bank_id}Container"
					oncomplete="searchFieldForFocus('#{bank_id}searchName')">
				</a4j:support>

				<a4j:support eventsQueue="#{bank_id}OnChange"
					actionListener="#{bankWizard.onLookup}" ignoreDupResponses="true"
					requestDelay="100" event="onchange"
					reRender="#{bank_id}Name,#{reRenderAttr}">
					<a4j:actionparam name="bankActionParam" value="#{bankELExpression}"
						assignTo="#{bankWizard.valueExpression}">
					</a4j:actionparam>
					<a4j:actionparam name="lookupActionParam"
						value="#{onLookupELExpression}"
						assignTo="#{bankWizard.extendedAttributesValueExpression}">
					</a4j:actionparam>
					<a4j:actionparam name="valueChangeListener"
						value="#{valueChangeListener}"
						assignTo="#{bankWizard.valueChangeListener}">
					</a4j:actionparam>
				</a4j:support>
			</aon:inputText>
		</a4j:region>
		<a4j:commandButton styleClass="aon-lookupButton" value=""
			disabled="#{disabled}" actionListener="#{bankWizard.onShow}"
			immediate="true"
			oncomplete="searchFieldForFocus('#{bank_id}searchName')"
			reRender="#{bank_id}Container" />
		<aon:div id="#{bank_id}Name" style="display:inline">
			<aon:outputText rendered="#{bankEntity.name != null}"
				value="#{bankEntity.name}" />
			<aon:outputText rendered="#{bankEntity.name == null}"
				value="---------------------------------" />
		</aon:div>
		<rich:modalPanel id="#{bank_id}bankPanel" minHeight="600"
			rendered="#{bankWizard.visible}" showWhenRendered="true"
			minWidth="650" top="50" left="100" height="600" width="650"
			zindex="2000" resizeable="true">

			<a4j:support event="onkeyup"
				onsubmit="if(event.keyCode != 27) return false;"
				eventsQueue="#{bank_id}EscKeyUp" ignoreDupResponses="true"
				requestDelay="100" actionListener="#{bankWizard.onClose}"
				immediate="true" reRender="#{bank_id}Container"
				oncomplete="searchFieldForFocus('#{bank_id}')">
			</a4j:support>

			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<h:outputText value="#{financeBundle.aon_banks}" />
				</aon:div>
			</f:facet>
			<f:facet name="controls">
				<a4j:commandButton type="button" styleClass="aon-popupWindow-close"
					actionListener="#{bankWizard.onClose}" immediate="true"
					reRender="#{bank_id}Container"
					oncomplete="searchFieldForFocus('#{bank_id}')">
				</a4j:commandButton>
			</f:facet>
			<a4j:region>
				<aon:panelGrid columns="2">
					<aon:outputText value="#{financeBundle.aon_bank_name}" />
					<aon:inputText value="#{bankWizard.name}" size="40">
						<a4j:support event="onchange" ajaxSingle="true"
							eventsQueue="#{bank_id}nm" ignoreDupResponses="true"
							requestDelay="100" actionListener="#{bankWizard.inputChanged}" />
					</aon:inputText>

					<aon:outputText value="#{financeBundle.aon_bank_code}" />
					<aon:div>
						<aon:inputText value="#{bankWizard.code}" size="40">
							<a4j:support event="onchange" ajaxSingle="true"
								eventsQueue="#{bank_id}sn" ignoreDupResponses="true"
								requestDelay="100" actionListener="#{bankWizard.inputChanged}" />
						</aon:inputText>
						<a4j:commandButton value="#{bundle.aon_search}"
							style="margin-left: 5px;" actionListener="#{bankWizard.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							eventsQueue="#{bank_id}SearchQueue" ignoreDupResponses="true"
							requestDelay="100" reRender="#{bank_id}tableContainer"
							oncomplete="selectFirstRow('#{bank_id}table')">
						</a4j:commandButton>
					</aon:div>
				</aon:panelGrid>
			</a4j:region>

			<rich:separator height="2px;"
				style="margin-top: 5px;margin-bottom: 5px;" />

			<aon:div id="#{bank_id}tableContainer">
				<aon:div styleClass="aon-form-note"
					rendered="#{bankWizard.model.rowCount == 0}">
					<aon:div styleClass="aon-form-note-internal">
						<aon:panelGroup>
							<aon:outputText value="#{bundle.aon_search_no_results}" />
						</aon:panelGroup>
					</aon:div>
				</aon:div>
				<aon:editDataTable id="#{bank_id}table" value="#{bankWizard.model}"
					var="bnk" rendered="#{bankWizard.model.rowCount > 0}"
					columnClasses="aon-editDataTable-iconColumn,
						aon-editDataTable-textColumn,
						aon-editDataTable-textColumn,
						aon-editDataTable-textColumn">
					<h:column>
						<aon:commandButton id="#{bank_id}RowSelector"
							styleClass="aon-editDataTable-button aon-icon-rowSelector"
							actionListener="#{bankWizard.onSelect}" immediate="true"
							ajaxSingle="true" eventsQueue="#{bank_id}SelectQueue"
							requestDelay="100" ignoreDupResponses="true"
							onkeyup="tableKeyUp(event.keyCode)"
							reRender="#{bank_id}Container,#{reRenderAttr}">
							<a4j:actionparam name="bankActionParam"
								value="#{bankELExpression}"
								assignTo="#{bankWizard.valueExpression}">
							</a4j:actionparam>
							<a4j:actionparam name="lookupActionParam"
								value="#{onLookupELExpression}"
								assignTo="#{bankWizard.extendedAttributesValueExpression}">
							</a4j:actionparam>
						</aon:commandButton>
					</h:column>

					<h:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.bank_code}" />
						</f:facet>
						<aon:outputText value="#{bnk.code}" />
					</h:column>
					<h:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.bank_name}" />
						</f:facet>
						<aon:outputText value="#{bnk.name}" />
					</h:column>
				</aon:editDataTable>

				<aon:panelGrid columns="2" style="border: 0;" cellpadding="5"
					columnClasses="aon-dataScroller-text,aon-dataScroller-buttons">

					<aon:div style="padding-left: 2em;">
						<a4j:commandButton immediate="true"
							eventsQueue="#{bank_id}PreviousQueue" requestDelay="100"
							ignoreDupResponses="true" reRender="#{bank_id}tableContainer"
							styleClass="aon-dataScroller-button aon-dataScroller-button-previous"
							rendered="#{bankWizard.previousPageAvailable}"
							actionListener="#{bankWizard.previousPage}"
							oncomplete="selectFirstRow('#{bank_id}table')" />

						<a4j:commandButton immediate="true"
							eventsQueue="#{bank_id}NextQueue" ignoreDupResponses="true"
							requestDelay="100" reRender="#{bank_id}tableContainer"
							styleClass="aon-dataScroller-button aon-dataScroller-button-next"
							rendered="#{bankWizard.nextPageAvailable}"
							actionListener="#{bankWizard.nextPage}"
							oncomplete="selectFirstRow('#{bank_id}table')" />
					</aon:div>

				</aon:panelGrid>

			</aon:div>
		</rich:modalPanel>

		<a4j:loadScript src="/facelet/sw/bank/bankId.js" />

	</aon:div>
</ui:composition>
