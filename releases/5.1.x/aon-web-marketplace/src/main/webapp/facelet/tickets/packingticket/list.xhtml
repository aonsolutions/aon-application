<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">
		<h:form id="ticketForm">
			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<t:dataTable id="compositionlist" 
						value="#{packingticket.compositionModel}" rows="20" var="to" 
						rowOnMouseOver="selectRow( this )"
						rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
						styleClass="aon-table" headerClass="aon-table-header"
						rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
						columnClasses="aon-table-body aon-table-body-string">

						<h:column>
							<f:facet name="header">
								<h:outputText value="#{appBundle.ticket_elaborations}" />
							</f:facet>
							<t:commandLink styleClass="aon-table-row-selected"
								actionListener="#{packingticket.onSelectComposition}" action="packingticket"
								rendered="#{packingticket.compositionModel.rowCount > 0}" />
						    <h:outputText value="#{to.item.product.name} #{to.item.detail}"/>
						</h:column>
					</t:dataTable>

					<t:div styleClass="aon-form-note"
						rendered="#{packingticket.compositionModel.rowCount == 0}">
						<t:div styleClass="aon-form-note-internal">
							<h:panelGroup>
								<h:outputText value="#{bundle.aon_search_no_results}" />
							</h:panelGroup>
						</t:div>
					</t:div>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="packingticketAuxForm" target="list" />
		
	</ui:define>
</ui:composition>

</body>
</html>
