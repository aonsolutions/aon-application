<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">
		<h:form id="compositionList">
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="reset" value="#{bundle.aon_reset}"
							action="elaboration_form" actionListener="#{composition.onReset}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'" 
							accesskey="#{bundle.aon_key_new}"/>
						<t:commandButton id="search" value="#{bundle.aon_search}"
							action="elaboration_search" actionListener="#{composition.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'" 
							accesskey="#{bundle.aon_key_search}"/>
					</t:div>
				</t:div>
			</t:div>

			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<t:div styleClass="aon-table-hack">
						<t:dataTable id="compositionDataList" cellpadding="0" cellspacing="0"
							var="to" value="#{composition.model}" rows="20" styleClass="aon-table"
							rowOnMouseOver="selectRow( this )"
							rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
							rendered="#{composition.model.rowCount > 0}"
							headerClass="aon-table-header"
							rowClasses="aon-table-row-odd,aon-table-row-even"
							columnClasses="aon-table-body aon-table-body-string,
							aon-table-body aon-table-body-string,
							aon-table-body aon-table-body-number,
							aon-table-body aon-table-body-number">

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{compositionBundle.composition_description}" />
								</f:facet>
								<h:outputText value="#{to.description}" />
								<t:commandLink immediate="#{true}" 
									styleClass="aon-table-row-selected"
									action="elaboration_form" 
									actionListener="#{composition.onSelect}" />
							</h:column>
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{compositionBundle.composition_item}" />
								</f:facet>
								<h:outputText value="#{to.item.product.name} #{to.item.detail}" />
							</h:column>
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{compositionBundle.composition_weight}" />
								</f:facet>
								<h:outputText value="#{to.quantity}" />
							</h:column>
							<h:column>
								<f:facet name="header">
									<h:outputText value="#{compositionBundle.composition_salePrice}" />
								</f:facet>
								<h:outputText value="#{to.price}" />
							</h:column>
						</t:dataTable>
					</t:div>

					<t:div styleClass="aon-form-note" 
						rendered="#{composition.model.rowCount == 0}">
						<t:div styleClass="aon-form-note-internal">
							<h:panelGroup>
								<h:outputText value="#{bundle.aon_search_no_results}" />
							</h:panelGroup>
						</t:div>
					</t:div>
					<t:div styleClass="aon-datascroller"
						rendered="#{composition.model.rowCount > 20}">
						<h:panelGrid columns="2"
							columnClasses="aon-datascroller-text,aon-datascroller-buttons">
							<t:dataScroller id="scroll_0" for="compositionDataList"
								rowsCountVar="rowsCount" firstRowIndexVar="firstRowIndex"
								lastRowIndexVar="lastRowIndex"
								rendered="#{composition.model.rowCount > 20}">
								<h:outputFormat value="#{bundle.aon_scroll}">
									<f:param value="#{firstRowIndex}" />
									<f:param value="#{lastRowIndex}" />
									<f:param value="#{rowsCount}" />
								</h:outputFormat>
							</t:dataScroller>

							<t:dataScroller id="scroll_1" for="compositionDataList" fastStep="5"
								paginator="#{true}" paginatorMaxPages="5"
								paginatorActiveColumnClass="aon-datascroller-currentpage"
								paginatorColumnClass="aon-datascroller-page"
								rendered="#{composition.model.rowCount > 20}">

								<f:facet name="first">
									<t:div styleClass="aon-datascroller-button-first">&#160;</t:div>
								</f:facet>
								<f:facet name="last">
									<t:div styleClass="aon-datascroller-button-last">&#160;</t:div>
								</f:facet>
								<f:facet name="previous">
									<t:div styleClass="aon-datascroller-button-previous">&#160;</t:div>
								</f:facet>
								<f:facet name="next">
									<t:div styleClass="aon-datascroller-button-next">&#160;</t:div>
								</f:facet>
								<f:facet name="fastforward">
									<t:div styleClass="aon-datascroller-button-fastforward">&#160;</t:div>
								</f:facet>
								<f:facet name="fastrewind">
									<t:div styleClass="aon-datascroller-button-fastrewind">&#160;</t:div>
								</f:facet>
							</t:dataScroller>
						</h:panelGrid>
					</t:div>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
