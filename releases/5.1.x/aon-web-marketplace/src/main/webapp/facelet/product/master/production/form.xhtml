<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
		<t:stylesheet path="/jscalendar-1.0/calendar-system.css" />
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/lang/calendar-es.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar-setup.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/js/itemLookup.js">
			// nothing
		</script>
	</ui:define>

	<ui:define name="content">
		<h:form id="productionForm">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" actionListener="#{production.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'" 
							disabled="#{productionDetail.to!=null || productionExpense.to != null}"
							accesskey="#{bundle.aon_key_save}"/>
						<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
							actionListener="#{production.onCancel}"
							action="production_list" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
							disabled="#{productionDetail.to!=null || productionExpense.to != null}"
							accesskey="#{bundle.aon_key_cancel}"/>
						<t:commandButton id="remove" value="#{bundle.aon_remove}"
							forceId="#{true}" actionListener="#{production.onRemove}"
							action="production_list" rendered="#{!production.new}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'" 
							disabled="#{productionDetail.to!=null || productionExpense.to != null}"
							accesskey="#{bundle.aon_key_remove}"/>
						<t:commandButton id="search" value="#{bundle.aon_search}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							forceId="#{true}" actionListener="#{production.onEditSearch}"
							action="production_search" immediate="#{true}" 
							disabled="#{productionDetail.to!=null || productionExpense.to != null}"
							accesskey="#{bundle.aon_key_search}"/>
						<t:commandButton id="production" value="#{bundle.aon_report}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							forceId="#{true}" rendered="#{!production.new}"
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
							disabled="#{productionDetail.to!=null || productionExpense.to != null}"
							accesskey="#{bundle.aon_key_print}" />	
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText
						value="#{production.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="Production_description" 
							value="#{compositionBundle.composition_description}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputText id="Production_description" size="64"
							styleClass="aon-form-input-text" required="#{true}"
							forceId="#{true}" value="#{production.to.description}">
							<f:validateLength minimum="1" maximum="64" />
						</t:inputText>

						<t:outputLabel for="Production_lotCode" 
							value="#{compositionBundle.production_lot_code}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputText id="Production_lotCode" size="32"
							styleClass="aon-form-input-text"
							forceId="#{true}" value="#{production.to.lotCode}">
							<f:validateLength minimum="1" maximum="25" />
						</t:inputText>

						<h:outputLabel for="Production_productionDate"
							value="#{compositionBundle.production_date}"
							styleClass="aon-form-input-text-label " />
						<t:div>
							<t:inputText id="Production_productionDate" forceId="#{true}" size="10"
								styleClass="aon-form-input-text" required="true" 
								value="#{production.to.productionDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</t:inputText>
							<t:commandButton id="Production_productionDate_button" forceId="#{true}" 
								styleClass="aon-form-lookup-button"
								value="" immediate="true" />
							<script type="text/javascript">
							  Calendar.setup( {
								inputField  : "Production_productionDate", button : "Production_productionDate_button",
								ifFormat    : "%d/%m/%Y" } );
							</script>
						</t:div>

						<h:outputLabel for="Item_id"
							value="#{compositionBundle.composition_item}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:panelGroup>
							<t:inputText id="Item_product_code" size="10"
								styleClass="aon-form-input-text" disabled="true"
								forceId="#{true}" value="#{production.to.item.product.code}" />
							<t:inputText id="Item_full_name" size="47"
								styleClass="aon-form-input-text" disabled="#{true}"
								forceId="#{true}" value="#{production.to.item.product.name} #{production.to.item.detail}"
								style="padding-left:3px;" />
						</h:panelGroup>

						<h:outputLabel for="Production_quantity"
							value="#{compositionBundle.composition_weight}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:inputText id="Production_quantity" size="10"
							styleClass="aon-form-input-text" required="#{true}"
							value="#{production.to.quantity}"
							valueChangeListener="#{production.productionQuantityChanged}">
							<f:validateDoubleRange />
						</h:inputText>

						<t:outputLabel for="Item_total_price"
							value="#{compositionBundle.composition_salePrice}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputText id="Item_total_price" size="10"
							styleClass="aon-form-input-text" disabled="#{true}"
							forceId="#{true}" value="#{production.to.price}">
						</t:inputText>
					</h:panelGrid>

					<t:div styleClass="aon-form-collapsiblePanel" rendered="#{!production.new}" >
						<t:collapsiblePanel value="false"
							styleClass="aon-form-collapsiblePanel-title"
							title="#{compositionBundle.composition_expenses}">
							<t:div styleClass="aon-form-collapsiblePanel-body">

								<t:dataTable id="productionExpenseDataList"
									value="#{productionExpense.model}" var="to"
									rowOnMouseOver="selectRow( this )"
									rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
									styleClass="aon-edit-table" headerClass="aon-edit-table-header"
									footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
									rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
									columnClasses="aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-buttons">

									<h:column>
										<f:facet name="header">
											<h:outputText value="#{compositionBundle.composition_description}" />
										</f:facet>
										<t:outputText value="#{to.description}"
											rendered="#{to!=productionExpense.to}" />
										<h:inputText value="#{productionExpense.to.description}"
											styleClass="aon-form-input-text"
											rendered="#{to==productionExpense.to}" disabled="#{true}"
											size="55" />
										<t:commandLink immediate="#{true}"
											rendered="#{to!=productionExpense.to}"
											styleClass="aon-table-row-selected"
											actionListener="#{productionExpense.onSelect}">
										</t:commandLink>
										<f:facet name="footer">
											<t:div>
												<f:verbatim>&#160;</f:verbatim>
											</t:div>
										</f:facet>
									</h:column>
									<t:column width="60">
										<f:facet name="header">
											<t:outputText value="#{compositionBundle.composition_quantity}" />
										</f:facet>
										<t:outputText value="#{to.quantity}"
											rendered="#{to!=productionExpense.to}">
											<f:convertNumber pattern="#,##0.000" />
										</t:outputText>
										<h:inputText value="#{productionExpense.to.quantity}"
											styleClass="aon-form-input-text"
											rendered="#{to==productionExpense.to}" required="#{true}"
											size="8">
											<f:validateDoubleRange />
										</h:inputText>
										<f:facet name="footer">
											<t:div>
												<f:verbatim>&#160;</f:verbatim>
											</t:div>
										</f:facet>
									</t:column>
									<t:column width="60">
										<f:facet name="header">
											<t:outputText value="#{compositionBundle.composition_price}" />
										</f:facet>
										<t:outputText value="#{to.price}"
											rendered="#{to!=productionExpense.to}">
											<f:convertNumber pattern="#,##0.00" />
										</t:outputText>
										<h:inputText value="#{productionExpense.to.price}"
											styleClass="aon-form-input-text"
											rendered="#{to==productionExpense.to}" disabled="#{true}"
											size="8">
											<f:validateDoubleRange />
										</h:inputText>
										<f:facet name="footer">
											<t:div>
												<f:verbatim>&#160;</f:verbatim>
											</t:div>
										</f:facet>
									</t:column>
									<t:column width="60">
										<f:facet name="header">
											<t:outputText value="#{compositionBundle.composition_total}" />
										</f:facet>
										<t:outputText value="#{productionExpense.listTotal}">
											<f:convertNumber pattern="#,##0.00" />
										</t:outputText>
										<f:facet name="footer">
											<t:div style="text-align:right; font-weight:normal;">
												<t:outputText value="#{production.totalExpenses}">
													<f:convertNumber pattern="#,##0.00" />
												</t:outputText>
											</t:div>
										</f:facet>
									</t:column>
									<t:column width="60">
										<f:facet name="header">
											<f:verbatim>&#160;</f:verbatim>
										</f:facet>
										<t:div>
											<f:verbatim rendered="#{to!=productionExpense.to}">&#160;</f:verbatim>
	
											<t:commandButton title="#{bundle.aon_save}"
												actionListener="#{productionExpense.onAccept}"
												rendered="#{to==productionExpense.to}" value=""
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
												accesskey="#{bundle.aon_key_save_line}"/>
											<t:commandButton title="#{bundle.aon_cancel}"
												actionListener="#{productionExpense.onCancel}"
												immediate="#{true}"
												onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
												value="" rendered="#{to==productionExpense.to}" 
												accesskey="#{bundle.aon_key_cancel_line}"/>
										</t:div>
										<f:facet name="footer">
											<t:div>
												<f:verbatim>&#160;</f:verbatim>
											</t:div>
										</f:facet>
									</t:column>
								</t:dataTable>
							</t:div>
						</t:collapsiblePanel>
					</t:div>

					<t:div styleClass="aon-form-collapsiblePanel" rendered="#{!production.new}" >
						<t:collapsiblePanel value="false"
							styleClass="aon-form-collapsiblePanel-title"
							title="#{compositionBundle.composition_totals}">
							<t:div styleClass="aon-form-collapsiblePanel-body">

								<h:panelGrid columns="6" styleClass="aon-form-table"
									columnClasses="aon-form-table-column-odd,aon-form-table-column-even,aon-form-table-column-odd,aon-form-table-column-even,aon-form-table-column-odd,aon-form-table-column-even">
	
									<t:outputLabel for="Production_total_purchase"
										value="#{compositionBundle.composition_total_cost}:" />
									<t:outputText id="Production_total_purchase"
										value="#{production.totalPurchase}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
	
									<t:outputLabel for="Production_total_sale"
										value="#{compositionBundle.composition_total_sale}:" />
									<t:outputText id="Production_total_sale"
										value="#{production.totalSale}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
	
									<t:outputLabel for="Production_profit"
										value="#{compositionBundle.composition_profit}:" />
									<t:outputText id="Production_profit"
										value="#{production.profit}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
	
									<t:outputLabel for="Production_purchase_profit"
										value="#{compositionBundle.composition_cost_profit}:" />
									<t:outputText id="Production_purchase_profit"
										value="#{production.purchaseProfit}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
	
									<t:outputLabel for="Production_sale_profit"
										value="#{compositionBundle.composition_sale_profit}:" />
									<t:outputText id="Production_sale_profit"
										value="#{production.saleProfit}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
	
									<f:verbatim>&#160;</f:verbatim>
									<f:verbatim>&#160;</f:verbatim>
								</h:panelGrid>
							</t:div>
						</t:collapsiblePanel>
					</t:div>

					<t:div styleClass="aon-form-collapsiblePanel" rendered="#{!production.new}" >
						<t:collapsiblePanel value="false"
							styleClass="aon-form-collapsiblePanel-title"
							title="#{compositionBundle.composition_details}">
							<t:div styleClass="aon-form-collapsiblePanel-body">

								<t:dataTable id="productionDetailDataList"
									value="#{productionDetail.model}" var="to"
									rowOnMouseOver="selectRow( this )"
									rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
									styleClass="aon-edit-table" headerClass="aon-edit-table-header"
									footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
									rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
									columnClasses="aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-buttons">
	
									<h:column>
										<f:facet name="header">
											<h:outputText value="#{compositionBundle.composition_item}" />
										</f:facet>
										<t:outputText value="#{to.description}"
											rendered="#{to!=productionDetail.to}" />
										<h:panelGroup rendered="#{to==productionDetail.to}">
											<t:inputText size="10" id="Item_product_code-Edit"
												styleClass="aon-form-input-text"
												disabled="#{true}" forceId="#{true}"
												value="#{productionDetail.to.item.product.code}" />
											<t:inputText id="Item_full_name-Edit"
												size="40" forceId="#{true}" disabled="#{true}"
												styleClass="aon-form-input-text"
												value="#{productionDetail.to.description}" />
										</h:panelGroup>
										<t:commandLink immediate="#{true}"
											rendered="#{to!=productionDetail.to}"
											styleClass="aon-table-row-selected"
											actionListener="#{productionDetail.onSelect}">
										</t:commandLink>
										<f:facet name="footer">
											<t:div>
												<f:verbatim>&#160;</f:verbatim>
											</t:div>
										</f:facet>
									</h:column>
									<t:column width="60">
										<f:facet name="header">
											<t:outputText
												value="#{compositionBundle.composition_weight}" />
										</f:facet>
										<t:outputText value="#{to.quantity}"
											rendered="#{to!=productionDetail.to}">
											<f:convertNumber pattern="#,##0.000" />
										</t:outputText>
										<h:inputText value="#{productionDetail.to.quantity}"
											styleClass="aon-form-input-text"
											rendered="#{to==productionDetail.to}" required="#{true}"
											size="8">
											<f:validateDoubleRange />
										</h:inputText>
										<f:facet name="footer">
											<t:div style="text-align:right;">
												<t:outputText value="#{production.saleQuantity}">
													<f:convertNumber pattern="#,##0.000" />
												</t:outputText>
											</t:div>
										</f:facet>
									</t:column>
									<t:column width="50">
										<f:facet name="header">
											<t:outputText value="#{compositionBundle.composition_percentage}" />
										</f:facet>
										<t:outputText value="#{productionDetail.listPercentage}">
											<f:convertNumber pattern="#,##0.00" />
										</t:outputText>
										<f:facet name="footer">
											<t:div style="text-align:right;">
												<t:outputText value="#{production.salePercentage}">
													<f:convertNumber pattern="#,##0.00" />
												</t:outputText>
											</t:div>
										</f:facet>
									</t:column>
									<t:column width="60">
										<f:facet name="header">
											<t:outputText
												value="#{compositionBundle.composition_costPrice}" />
										</f:facet>
										<t:outputText value="#{to.price}"
											rendered="#{to!=productionDetail.to}">
											<f:convertNumber pattern="#,##0.00" />
										</t:outputText>
										<t:inputText id="Item_base_price-Edit" forceId="#{true}"
											styleClass="aon-form-input-text"
											value="#{productionDetail.to.price}"
											rendered="#{to==productionDetail.to}" disabled="#{true}"
											size="8">
										</t:inputText>
										<f:facet name="footer">
											<t:div>
												<f:verbatim>&#160;</f:verbatim>
											</t:div>
										</f:facet>
									</t:column>
									<t:column width="60">
										<f:facet name="header">
											<t:outputText value="#{compositionBundle.composition_total}" />
										</f:facet>
										<t:outputText value="#{productionDetail.listTotal}">
											<f:convertNumber pattern="#,##0.00" />
										</t:outputText>
										<f:facet name="footer">
											<t:div style="text-align:right;">
												<t:outputText value="#{production.totalDetails}">
													<f:convertNumber pattern="#,##0.00" />
												</t:outputText>
											</t:div>
										</f:facet>
									</t:column>
									<t:column width="60">
										<f:facet name="header">
											<f:verbatim>&#160;</f:verbatim>
										</f:facet>
										<t:div>
											<f:verbatim rendered="#{to!=productionDetail.to}">&#160;</f:verbatim>
	
											<t:commandButton title="#{bundle.aon_save}"
												actionListener="#{productionDetail.onAccept}"
												rendered="#{to==productionDetail.to}" value=""
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
												accesskey="#{bundle.aon_key_save_line}"/>
											<t:commandButton title="#{bundle.aon_cancel}"
												actionListener="#{productionDetail.onCancel}"
												immediate="#{true}"
												onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
												value="" rendered="#{to==productionDetail.to}" 
												accesskey="#{bundle.aon_key_cancel_line}"/>
										</t:div>
										<f:facet name="footer">
											<t:div>
												<f:verbatim>&#160;</f:verbatim>
											</t:div>
										</f:facet>
									</t:column>
								</t:dataTable>
	
								<t:div styleClass="aon-datascroller"
									rendered="#{productionDetail.model.rowCount > 20}">
									<h:panelGrid columns="2"
										columnClasses="aon-datascroller-text,aon-datascroller-buttons">
										<t:dataScroller id="scroll_0" for="productionDetailDataList"
											rowsCountVar="rowsCount" firstRowIndexVar="firstRowIndex"
											lastRowIndexVar="lastRowIndex"
											rendered="#{productionDetail.model.rowCount > 20}">
											<h:outputFormat value="#{bundle.aon_scroll}">

										<t:dataScroller id="scroll_1" for="productionDetailDataList" fastStep="5" 
											paginator="#{true}" paginatorMaxPages="5"
											paginatorActiveColumnClass="aon-datascroller-currentpage"
											paginatorColumnClass="aon-datascroller-page"
											rendered="#{productionDetail.model.rowCount > 20}">
	
											<f:facet name="first">

											<f:facet name="last">

											</f:facet>
											<f:facet name="previous">

											</f:facet>
											<f:facet name="next">
												<t:div styleClass="aon-datascroller-button-next">&#160;</t:div>
											</f:facet>
											<f:facet name="fastforward">
												<t:div styleClass="aon-datascroller-button-fastforward">&#160;</t:div>
											</f:facet>
											<f:facet name="fastrewind">
												<t:div styleClass="aon-datascroller-button-fastrewind">&#160;</t:div>
											</f:facet>
										</t:dataScroller>
	 								</h:panelGrid>
								</t:div>
							</t:div>
						</t:collapsiblePanel>
					</t:div>
				</t:div>
			</t:div>
		</h:form>

		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
