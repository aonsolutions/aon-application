<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
		<t:stylesheet path="/jscalendar-1.0/calendar-system.css" />
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/lang/calendar-es.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar-setup.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/js/itemLookup.js">
			// nothing
		</script>		
	</ui:define>

	<ui:define name="content">
		<h:form id="productionForm">
			<t:div styleClass="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="search" value="#{bundle.aon_search}"
							action="production_list" actionListener="#{production.onSearch}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'" 
							accesskey="#{bundle.aon_key_search}"/>
						<t:commandButton id="cancel" value="#{bundle.aon_cancel}"
							action="production_list" actionListener="#{production.onCancel}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
							accesskey="#{bundle.aon_key_cancel}"/>
						<h:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-reset"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-reset'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-reset'" />
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText value="#{bundle.aon_search_header}" />
				</t:div>
			</t:div>

			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="Production_description"
							value="#{compositionBundle.composition_description}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputText id="Production_description" size="57"
							styleClass="aon-form-input-text"
							valueChangeListener="#{production.addExpression}" />
	
						<t:outputLabel for="Production_lotCode"
							value="#{compositionBundle.production_lot_code}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputText id="Production_lotCode" size="32"
							styleClass="aon-form-input-text"
							valueChangeListener="#{production.addExpression}" />
	
						<h:outputLabel for="Production_startDate"
							value="#{compositionBundle.production_date}"
							styleClass="aon-form-input-text-label " />
						<t:div>
							<t:div styleClass="aon-form-unit aon-form-layout-unit-inline-label-block">
								<h:outputLabel value="#{compositionBundle.production_from_date}" 
									styleClass="aon-form-input-text-label aon-form-layout-label-block" />
								<t:div styleClass="aon-form-nowrap">
									<t:inputText id="Production_fromDate" forceId="#{true}" size="10"
										styleClass="aon-form-input-text"
										valueChangeListener="#{production.addProductionDateGreaterThanExpression}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</t:inputText>
									<t:commandButton id="Production_fromDate_button" forceId="#{true}" 
										styleClass="aon-form-lookup-button"
										value="" immediate="true" />
									<script type="text/javascript">
									  Calendar.setup( {
										inputField  : "Production_fromDate", button : "Production_fromDate_button",
										ifFormat    : "%d/%m/%Y" } );
									</script>
								</t:div>
							</t:div>
							<t:div styleClass="aon-form-unit aon-form-layout-unit-inline-label-block">
								<h:outputLabel value="#{compositionBundle.production_to_date}" 
									styleClass="aon-form-input-text-label aon-form-layout-label-block" />
								<t:div styleClass="aon-form-nowrap">
									<t:inputText id="Production_toDate" forceId="#{true}" size="10"
										styleClass="aon-form-input-text"
										valueChangeListener="#{production.addProductionDateLessThanExpression}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</t:inputText>
									<t:commandButton id="Production_toDate_button" forceId="#{true}" 
										styleClass="aon-form-lookup-button"
										value="" immediate="true" />
									<script type="text/javascript">
									  Calendar.setup( {
										inputField  : "Production_toDate", button : "Production_toDate_button",
										ifFormat    : "%d/%m/%Y" } );
									</script>
								</t:div>
							</t:div>
						</t:div>

						<h:outputLabel for="Production_item_id"
							value="#{compositionBundle.composition_item}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:panelGroup>
							<t:inputHidden id="Production_item_id" forceId="#{true}"
								valueChangeListener="#{production.addExpression}" />
							<t:inputHidden id="Item_id" forceId="#{true}" />
							<t:inputText id="Item_product_code" forceId="#{true}"
								styleClass="aon-form-input-text" size="10"
								onchange="return findItemLookup(event, '#{facesContext.externalContext.request.contextPath}', 'com.code.aon.product.Item');"/>
							<h:commandButton id="find_Item"
								onclick="selectWindow(this, 'placeList', '#{itemSearch.encodedPagePath}'); return false;"
								action="showPlace" value="" immediate="true"
								styleClass="aon-form-lookup-button" />
							<t:inputText id="Item_full_name" forceId="#{true}" 
								styleClass="aon-form-input-text" size="40"
								onchange="document.getElementById('Production_item_id').value = document.getElementById('Item_id').value"
								style="padding-left:3px;" disabled="#{true}" />
						</h:panelGroup>
					</h:panelGrid>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
