<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="financeFractionForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_fractioning}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">
					<aon:confirmButton id="save"
						value="#{bundle.aon_accept}"
						rendered="#{financeFraction.fractionable}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_accept_confirm}"
						confirmActionListener="#{financeFraction.onAcceptFractions}"
						confirmAction="finance_list"						
						accesskey="#{bundle.aon_key_save}" />
					<aon:confirmButton id="cancel"
						value="#{bundle.aon_cancel}" immediate="true" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_cancel_confirm}"
						confirmAction="finance_form"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150
						,aon-panelGrid-even aon-width-auto
						,aon-panelGrid-odd aon-width-150
						,aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Finance_invoice_referenceCode"
						value="#{financeBundle.finance_invoice}" />
					<aon:div> 
						<aon:inputText id="Finance_invoice_referenceCode"
							value="#{financeFraction.targetFinance.invoice.referenceCode}"
							disabled="true" size="20" />

						<aon:selectOneMenu id="Finance_securityLevel"
							styleClass="aon-margin-left" disabled="true"
							value="#{financeFraction.targetFinance.securityLevel}">
							<f:selectItems value="#{commonCollections.securityLevels}" />
						</aon:selectOneMenu>

						<aon:outputText styleClass="aon-margin-left"
							value="#{financeFraction.targetFinance.financeStatus}" />
					</aon:div>

					<aon:outputLabel for="Finance_invoice_issueDate"
						value="#{financeBundle.finance_invoice_date}" />
					<aon:inputText id="Finance_invoice_issueDate"
						value="#{financeFraction.targetFinance.invoice.issueDate}"
						disabled="true" size="10">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:inputText>

					<aon:outputLabel for="Finance_registry_id"
						value="#{financeFraction.targetFinance.payment ? (financeBundle.finance_creditor) : (financeBundle.finance_debtor)}" />
					<aon:div>
						<aon:inputText id="Finance_registry_id"
							value="#{financeFraction.targetFinance.registry.id}"
							disabled="true" size="5" />	
						<aon:inputText id="Finance_invoice_registryName"
							styleClass="aon-margin-left"
							value="#{financeFraction.targetFinance.invoice.registryName}"
							disabled="true" size="50" />
						<aon:inputText id="Finance_invoice_registryDocument"
							styleClass="aon-margin-left"
							value="#{financeFraction.targetFinance.invoice.registryDocument}"
							disabled="true" size="10" />
					</aon:div>												

					<aon:outputLabel for="Finance_amount"
						value="#{bundle.aon_amount}" />
					<aon:outputText id="Finance_amount"
					 	styleClass="aon-bold"
						value="#{financeFraction.targetFinance.amount}"
						size="15">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>	

					<aon:outputLabel for="Finance_payMethod_id"
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneMenu id="Finance_payMethod_id"
						value="#{financeFraction.targetFinance.payMethod}"
						valueChangeListener="#{finance.onPayMethodChanged}"
						reRender="Finance_registryBank_id,Finance_bankAccount"
						disabled="true">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Finance_expenses"
						value="#{financeBundle.finance_expenses}" />
					<aon:outputText id="Finance_expenses"
					 	styleClass="aon-bold"
						value="#{financeFraction.targetFinance.expenses}"
						size="15">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>	

					<aon:outputLabel for="Finance_bankAccount"
						value="#{configBundle.config_bank_account}" />
					<aon:div id="Finance_bankAccount" styleClass="aon-lookup">
						<aon:inputText id="Finance_bank_code"
							value="#{financeFraction.targetFinance.bank.code}"
							disabled="true" size="3" />
						<aon:inputText id="Finance_bank_name"
							value="#{financeFraction.targetFinance.bank.name}"
							disabled="true" size="30" />
						<aon:inputText id="Finance_bankAccount_office"
							value="#{financeFraction.targetFinance.bankAccount.office}"
							disabled="true" size="3" />
						<aon:inputText id="Finance_bankAccount_control"
							value="#{financeFraction.targetFinance.bankAccount.control}"
							disabled="true" size="1" />
						<aon:inputText id="Finance_bankAccount_account"
							value="#{financeFraction.targetFinance.bankAccount.account}"
							disabled="true" size="10" />
					</aon:div>

					<aon:outputLabel for="Finance_total"
						value="#{bundle.aon_total}" />
					<aon:outputText id="Finance_total"
					 	styleClass="aon-bold"
						value="#{financeFraction.targetFinance.totalAmount}"
						size="15">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>	

				</aon:panelGrid>
					
				<aon:div styleClass="aon-form-group">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="financeFractionData" value="#{financeBundle.finance_resulting_finances}" />
						</aon:div>
					</aon:div>
					<aon:div styleClass="aon-scroll-area">

						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
							<ui:param name="controller" value="#{financeFraction}" />
							<ui:param name="columnClasses" value="aon-editDataTable-text,aon-editDataTable-numberColumn,aon-editDataTable-numberColumn" />
							<ui:param name="skipRemoveButton" value="#{!financeFraction.removableFraction}" />
							<ui:param name="saveButtonReRender" value="aonToolbar" />
							<ui:param name="removeButtonReRender" value="aonToolbar" />
							<ui:param name="newSaveButtonReRender" value="aonToolbar" />

							<ui:define name="columns">

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.finance_finance_date}" />
									</f:facet>
									<aon:outputText value="#{to.dueDate}" rendered="#{formList}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
									<aon:selectInputDate required="true"
										value="#{financeFraction.to.dueDate}"
										rendered="#{formEdit}"
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}"/>											
									<f:facet name="footer">
										<aon:selectInputDate required="true"
											value="#{financeFraction.to.dueDate}"
											rendered="#{formNew}"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"/>
									</f:facet>
								</aon:column>
								
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.finance_expenses}" />
									</f:facet>
									<aon:outputText value="#{to.expenses}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:column>
								
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_amount}" />
									</f:facet>
									<aon:outputText value="#{to.amount}" 
										rendered="#{formList}" >
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:inputText required="true"
										rendered="#{formEdit}"
										value="#{financeFraction.to.amount}" />
									<f:facet name="footer">
										<aon:inputText rendered="#{formNew}" required="true"
											value="#{financeFraction.to.amount}">
										</aon:inputText>
									</f:facet>
								</aon:column>

							</ui:define>
						</ui:decorate>
					
					</aon:div>
				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
