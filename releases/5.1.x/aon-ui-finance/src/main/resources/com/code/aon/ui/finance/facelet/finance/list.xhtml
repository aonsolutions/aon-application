<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="financeList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{(finance.payment) ? (financeBundle.finance_payment_module) : (financeBundle.finance_charge_module)}" />
				<ui:param name="controller" value="#{finance}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="financeList-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						actionListener="#{finance.onOrderFinanceList}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="financeList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="financeList-report"
						value="#{bundle.aon_listing}" target="_blank" action="#{report.onExecute}"
						actionListener="#{finance.onOrderFinanceList}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="financeList" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="financeListByAccount-report"
						value="#{financeBundle.finance_list_by_account}"
						target="_blank" action="#{report.onExecute}"
						actionListener="#{finance.onOrderFinanceListByRegistry}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="financeListByAccount" />
					</aon:htmlCommandLink>

					<aon:htmlCommandLink id="financeListByDate-report"
						value="#{financeBundle.finance_list_by_date}"
						target="_blank" action="#{report.onExecute}"
						actionListener="#{finance.onOrderFinanceListByDate}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="financeListByDate" />
					</aon:htmlCommandLink>

					<aon:htmlCommandLink id="financeListByPayment-report"
						value="#{financeBundle.finance_list_by_paymethod}"
						target="_blank" action="#{report.onExecute}"
						actionListener="#{finance.onOrderFinanceListByPayment}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="financeListByPayment" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="receiptFinance-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="receiptFinance" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="receiptFinance-report"
						value="#{financeBundle.finance_receipts}"
						target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="receiptFinance" />
					</aon:htmlCommandLink>
				</ui:define>

			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{finance}" />
					<ui:define name="columns">
						<aon:column alias="Finance.invoice.referenceCode"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{financeBundle.finance_invoice}" />
							</f:facet>
							<aon:outputText value="#{to.invoice.referenceCode}" />
						</aon:column>
	
						<aon:column alias="Finance.dueDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.dueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
	
						<aon:column alias="Finance.invoice.registryName"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText
									value="#{(finance.payment) ? (financeBundle.finance_creditor) : (financeBundle.finance_debtor)}" />
							</f:facet>
							<aon:outputText value="#{to.invoice.registryName}" />
						</aon:column>
	
						<aon:column alias="Finance.invoice.registryDocument"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.invoice.registryDocument}" />
						</aon:column>
	
						<aon:column alias="Finance.payMethod.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{configBundle.config_pay_method}" />
							</f:facet>
							<aon:outputText value="#{to.payMethod.name}" />
						</aon:column>
	
						<aon:column alias="Finance.financeStatus"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.financeStatus}" />
								<f:facet name="footer">
								<aon:outputText value="#{financeBundle.finance_total_amount}" />
								</f:facet>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{to.totalAmount}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							
							<f:facet name="footer">
								<aon:div style="float:right">
									<aon:outputText style="text-align:right" value="#{finance.totalFinanceAmount}" >
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>
