<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="#{searchController.preffix}medias_mediaType"
		value="#{registryBundle.registry_media_type}" />
	<aon:div id="mediaTypeDiv">
		<a4j:region>
			<a4j:repeat value="#{searchController.mediaTypes}" rowKeyVar="index" var="mediaType">
				<aon:div styleClass="#{(index != 0)?'aon-padding-top':''}">
					<aon:selectOneMenu id="#{searchController.preffix}medias_mediaType"
						converter="aon.EnumConverter" 
						value="#{searchController.mediaTypes[index]}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{registryCollections.mediaTypes}" />
						<a4j:support event="onchange" reRender="mediaTypeDiv"/>
					</aon:selectOneMenu>
					<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" reRender="mediaTypeDiv"
						actionListener="#{searchController.onRemoveMediaType}" value="&#160;"
						rendered="#{mediaType != null}">
						<f:param name="index" value="#{index}" />
					</aon:commandButton>
					<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" reRender="mediaTypeDiv"
						actionListener="#{searchController.onAddMediaType}" value="&#160;"
						rendered="#{(mediaType != null) and (index == (searchController.mediaTypesSize-1))}"/>					
				</aon:div>						
			</a4j:repeat>
		</a4j:region>
	</aon:div>			
	
	<aon:outputLabel for="#{searchController.preffix}medias_value"
		value="#{bundle.aon_value}" />
	<aon:inputText id="#{searchController.preffix}medias_value" size="60"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="#{searchController.preffix}medias_comment"
		value="#{bundle.aon_comment}" />
	<aon:inputText id="#{searchController.preffix}medias_comment" size="60"
		valueChangeListener="#{controller.addExpression}" />
		
	<aon:outputLabel for="#{searchController.preffix}medias_administrative"
		value="#{registryBundle.registry_administrative}" />
	<aon:selectOneMenu id="#{searchController.preffix}medias_administrative"
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="-"	itemValue="#{null}" />
		<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
		<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
	</aon:selectOneMenu>								

	<aon:outputLabel for="#{searchController.preffix}medias_commercial"
		value="#{registryBundle.registry_commercial}" />
	<aon:selectOneMenu id="#{searchController.preffix}medias_commercial"
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="-"	itemValue="#{null}" />
		<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
		<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
	</aon:selectOneMenu>								

	<aon:outputLabel for="#{searchController.preffix}medias_technical"
		value="#{registryBundle.registry_technical}" />
	<aon:selectOneMenu id="#{searchController.preffix}medias_technical"
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="-"	itemValue="#{null}" />
		<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
		<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
	</aon:selectOneMenu>								

</ui:composition>
