<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core">

	<ui:include
		src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
		<ui:param name="toolbarID" value="rdListToolbar" />		
		<ui:param name="toolbarTitle" value="#{registryBundle.registry_rd_module}" />
		<ui:param name="skipSearchButton" value="true" />
		<aon:methodParam name="resetAction" value="" />
		<ui:param name="resetButtonReRender" value="recordDataContent" />		
	</ui:include>
	
	<aon:div id="recordDataDiv" styleClass="aon-scroll-area">
		<aon:dataTable id="recordDataDataList" value="#{controller.model}"
			rows="20" var="to" rendered="#{controller.model.rowCount > 0}">

			<aon:rowSelector actionListener="#{controller.onSelect}" reRender="recordDataContent" />
			<aon:column width="85">
				<f:facet name="header">
					<aon:outputText
						value="#{registryBundle.registry_rd_creation_date}" />
				</f:facet>
				<aon:outputText value="#{to.creationDate}"
					rendered="#{to.id!=recordData.to.id}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}"
					rendered="#{to.id!=recordData.to.id}" />
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.registry_rd_notary}" />
				</f:facet>
				<aon:outputText value="#{to.notary}"
					rendered="#{to.id!=recordData.to.id}" />
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.registry_rd_number}" />
				</f:facet>
				<aon:outputText value="#{to.number}"
					rendered="#{to.id!=recordData.to.id}" />
			</aon:column>
		</aon:dataTable>
		<aon:dataScroller2 for="recordDataDataList" showNote="true" />
	</aon:div>
</ui:composition>
