<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="userLoginForm">

			<aon:div styleClass="menu" />
			
			<aon:div styleClass="back-button" >
				<aon:commandButton id="aonToolbar-back" value="#{bundle.aon_back}"
					action="shop_form"
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					immediate="true" accesskey="#{bundle.aon_key_cancel}" />
			</aon:div>
				
			<aon:panelGrid columns="1" columnClasses="registryColumn">
				<aon:div styleClass="user-login-box">
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{ecommerceBundle.aon_ecommerce_contact_form}" />
						</f:facet>
						<aon:panelGrid columns="2" dir="true">
							<aon:outputLabel for="contact_enterprise" value="#{ecommerceBundle.aon_ecommerce_contact_enterprise}" />
							<aon:inputText id="contact_enterprise" size="30" 
								value="#{ecContact.enterprise}"/>
							
							<aon:outputLabel for="contact_name" value="#{ecommerceBundle.aon_ecommerce_contact_name}*" />
							<aon:inputText id="contact_name" size="30" required="true"
								value="#{ecContact.name}"/>
			
							<aon:outputLabel for="contact_telephone" value="#{ecommerceBundle.aon_ecommerce_contact_telephone}" />
							<aon:inputText id="contact_telephone" size="15" 
								value="#{ecContact.telephone}"/>
							
							<aon:outputLabel for="contact_email" value="#{ecommerceBundle.aon_ecommerce_contact_email}*" />
							<aon:inputText id="contact_email" size="30" required="true"
								value="#{ecContact.email}"/>
							
							<aon:outputLabel for="contact_issue" value="#{ecommerceBundle.aon_ecommerce_contact_issue}*" />
							<aon:inputTextarea id="contact_issue" cols="70" rows="10" required="true"
								value="#{ecContact.issue}"/>

							<aon:outputLabel for="contact_email-buttom" value="&#160;" />
							<aon:div>
							<aon:outputLabel styleClass="none" value="*campos obligatorios" />
							<aon:commandButton id="contact_email-buttom" 
								action="shop_form"
								value="#{ecommerceBundle.aon_ecommerce_contact_send}"
								actionListener="#{ecContact.onEmail}"
								styleClass="aon-finding-toolbar-item aon-icon-letter">
							</aon:commandButton>
							</aon:div>
						</aon:panelGrid>
					</aon:panel>
				</aon:div>
			</aon:panelGrid>
		</aon:form>
	</ui:define>
</ui:composition>
