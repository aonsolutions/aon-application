<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:valueParam name="fileInputRendered" default="#{true}" />
	
	<aon:fileUpload id="#{fileInputId}"
		rendered="#{fileInputRendered}"
		fileUploadListener="#{controller.fileUploaded}">							
		<f:facet name="label">
			<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
		</f:facet>
		<a4j:support event="onuploadcomplete" reRender="#{onCompleteReRender}" />
		<a4j:support event="onupload" oncomplete="showFileUploadProgress();" />
		<a4j:support event="onclear" oncomplete="hideFileUploadProgress();" />
	</aon:fileUpload>
	<rich:jQuery name="showFileUploadProgress"
		timing="onJScall" rendered="#{fileInputRendered}"
		selector="##{fileInputId} .rich-fileupload-list-overflow" query="height(70);" />
	<rich:jQuery name="hideFileUploadProgress"
		timing="onJScall" rendered="#{fileInputRendered}"
		selector="##{fileInputId} .rich-fileupload-list-overflow" query="height(0);" />

</ui:composition>
