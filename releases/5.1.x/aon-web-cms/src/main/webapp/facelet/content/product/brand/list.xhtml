<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="brand_form">
		
			<aon:div ajaxRendered="true" layout="none">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{appBundle.brand}" />
					<ui:param name="controller" value="#{brand}" />
					<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
					<ui:param name="skipRemoveButton" value="#{!cms.roleEditor}" />
					<ui:define name="additionalToolbarContent">
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="#{productCategory.getBack}" 
							actionListener="#{brand.onCancel}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
					</ui:define>
				</ui:decorate>		
	
				<aon:div styleClass="aon-scroll-area">
	
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{brand}" />
						<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
						<ui:param name="skipRemoveButton" value="#{!cms.roleEditor}" />					
						<ui:define name="columns">
	
							<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.cms_alias}" />
								</f:facet>
								<aon:outputText value="#{to.alias}"
									rendered="#{to!=brand.to}" >
								</aon:outputText>	
								<aon:inputText value="#{to.alias}"
									id="#{to.id}_alias"
									rendered="#{to==brand.to}"
									required="#{true}" size="35" maxlength="32">
									<f:validator validatorId="AliasValidator" />
								</aon:inputText>
								<f:facet name="footer">
									<aon:div>
										<aon:inputText value="#{brand.to.alias}"
											id="new_alias"
											rendered="#{brand.new}"
											required="#{true}" size="35" maxlength="32">
											<f:validator validatorId="AliasValidator" />
										</aon:inputText>
									</aon:div>
								</f:facet>
							</aon:column>
		
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.brand_label}" />
								</f:facet>
								<aon:outputText value="#{brand.i18nLabel}"
									rendered="#{to!=brand.to}" >
								</aon:outputText>	
								<aon:inputText value="#{brand.toI18n.label}"
									id="#{to.id}_label"
									rendered="#{to==brand.to}"
									required="#{true}" size="70" maxlength="64" />
								<f:facet name="footer">
									<aon:div>
										<aon:inputText value="#{brand.toI18n.label}"
											id="new_label"
											rendered="#{brand.new}"
											required="#{true}" size="70" maxlength="64" />
									</aon:div>
								</f:facet>
							</aon:column>
		
							<aon:column styleClass="aon-editDataTable-iconColumn">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.brand_active}" />
								</f:facet>
								<aon:div onmouseover="disableRowSelector();"
									onmouseout="enableRowSelector();" >																																					
									<aon:commandLink title="#{appBundle.brand_activate}" 
										reRender="dataTable"
										actionListener="#{brand.onActivate}" 
										rendered="#{!to.active}">
										<aon:graphicImage id="Brand_active" alt="#{appBundle.brand_activate}"
											url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
									</aon:commandLink>
									<aon:commandLink title="#{appBundle.brand_deactivate}" 
										reRender="dataTable"
										actionListener="#{brand.onDeactivate}" 
										rendered="#{to.active}">
										<aon:graphicImage id="Brand_deactive" alt="#{appBundle.brand_deactivate}"
											url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
									</aon:commandLink>
								</aon:div>
							</aon:column>
						</ui:define>
					</ui:decorate>
				
				</aon:div>
				
			</aon:div>			
		</aon:form>
	</ui:define>
</ui:composition>
