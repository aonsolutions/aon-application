<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="aon-scroll-area">
		<aon:div>
			<aon:div style="text-align:center;padding-top: 100px;">
				<rich:panel styleClass="aon-width-400" style="height:120px;" >
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_error_title}"/>
					</f:facet>					
					<aon:div styleClass="aon-message-server-error aon-icon-big-error">
						<aon:div>								
							<aon:outputText value="#{webmailBundle.webmail_connect_error}:&lt;br&gt;" escape="false" />
							<aon:outputText value="#{webmail.initErrorMessage}" />
						</aon:div>						
					</aon:div>					
				</rich:panel>
			</aon:div>
		</aon:div>
	</aon:div>
	
</ui:composition>
