<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-margin-bottom aon-margin-top">
		<aon:div styleClass="aon-form-group-title">
			<aon:div styleClass="aon-form-group-title-internal">
				<aon:outputText value="#{webmailBundle.webmail_contact_data}"/>
			</aon:div>
		</aon:div>
		<aon:panelGrid columns="2" dir="true" styleClass="aon-width-500">
			<aon:outputLabel for="Contact_displayName"
				value="#{webmailBundle.webmail_contact_displayName}" />
			<aon:inputText id="Contact_displayName"
				maxlength="128" size="77" required="true"
				value="#{contact.to.displayName}" />
	
			<aon:outputLabel for="Contact_outlookName"
				value="#{bundle.aon_name}" />
			<aon:inputText id="Contact_outlookName"
				maxlength="128" size="95"
				value="#{contact.to.outlookName}" />
	
			<aon:outputLabel for="Contact_surname"
				value="#{webmailBundle.webmail_contact_surname}" />
			<aon:inputText id="Contact_surname"
				maxlength="128" size="95"
				value="#{contact.to.surname}" />
	
			<aon:outputLabel for="Contact_address"
				value="#{webmailBundle.webmail_contact_address}" />
			<aon:inputText id="Contact_address"
				maxlength="128" size="95"
				value="#{contact.to.address}" />
	
			<aon:outputLabel for="Contact_postal_code"
				value="#{webmailBundle.webmail_contact_postal_code}" />
			<aon:panelGrid id="contactAddress" columns="5" dir="true" 
				columnClasses="aon-text-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left">
				<aon:inputText id="Contact_postal_code"
					maxlength="40" size="11"
					value="#{contact.to.postalCode}" />
	
				<aon:outputLabel for="Contact_outlookCity"
					value="#{webmailBundle.webmail_contact_city}" />
				<aon:inputText id="Contact_outlookCity"
					maxlength="128" size="22"
					value="#{contact.to.outlookCity}" />
	
				<aon:outputLabel for="Contact_state"
					value="#{webmailBundle.webmail_contact_state}" />
				<aon:inputText id="Contact_state"
					maxlength="128" size="22"
					value="#{contact.to.state}" />
			</aon:panelGrid>
			
			<aon:outputLabel for="Contact_country"
				value="#{webmailBundle.webmail_contact_country}" />
			<aon:inputText id="Contact_country"
				maxlength="128" size="77"
				value="#{contact.to.country}" />
			
			<aon:outputLabel for="Contact_phone"
				value="#{webmailBundle.webmail_contact_phone}" />
			<aon:panelGrid id="contactPhone" columns="5" dir="true" 
				columnClasses="aon-text-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left">
				<aon:inputText id="Contact_phone"
					maxlength="128" size="16"
					value="#{contact.to.phone}" />
	
				<aon:outputLabel for="Contact_cellularPhone"
					value="#{webmailBundle.webmail_contact_cellular_phone}" />
				<aon:inputText id="Contact_cellularPhone"
					maxlength="128" size="16"
					value="#{contact.to.cellularPhone}" />
	
				<aon:outputLabel for="Contact_fax"
					value="#{webmailBundle.webmail_contact_fax}" />
				<aon:inputText id="Contact_fax"
					maxlength="128" size="16"
					value="#{contact.to.fax}" />
	
			</aon:panelGrid>
	
			<aon:outputLabel for="Contact_email"
				value="#{webmailBundle.webmail_contact_email}" />
			<aon:inputText id="Contact_email"
				maxlength="256" size="95"
				value="#{contact.to.email}" />
	
			<aon:outputLabel for="Contact_note" 
				value="#{webmailBundle.webmail_contact_note}" />
			<aon:inputTextarea id="Contact_note"
				value="#{contact.to.note}" cols="98" rows="7" >
				<f:validateLength maximum="2048" />
			</aon:inputTextarea>
		</aon:panelGrid>
	</aon:div>
	
	<aon:div styleClass="aon-margin-top">
		<aon:div styleClass="aon-form-group-title">
			<aon:div styleClass="aon-form-group-title-internal">
				<aon:outputText value="#{webmailBundle.webmail_organization_data}"/>
			</aon:div>
		</aon:div>
		<aon:panelGrid columns="2" dir="true" styleClass="aon-width-500">
			<aon:outputLabel for="Contact_organization"
				value="#{webmailBundle.webmail_contact_organization}" />
			<aon:inputText id="Contact_organization"
				maxlength="64" size="95"
				value="#{contact.to.organization}" />
	
			<aon:outputLabel for="Contact_title"
				value="#{webmailBundle.webmail_contact_category}" />
			<aon:inputText id="Contact_title"
				maxlength="128" size="95"
				value="#{contact.to.title}" />
	
			<aon:outputLabel for="Contact_organization_address"
				value="#{webmailBundle.webmail_contact_address}" />
			<aon:inputText id="Contact_organization_address"
				maxlength="128" size="95"
				value="#{contact.to.organizationAddress}" />
	
			<aon:outputLabel for="Contact_organization_postal_code"
				value="#{webmailBundle.webmail_contact_postal_code}" />
			<aon:panelGrid id="contactOrganizationAddress" columns="5" dir="true" 
				columnClasses="aon-text-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left">
				<aon:inputText id="Contact_organization_postal_code"
					maxlength="16" size="11"
					value="#{contact.to.organizationPostalCode}" />
	
				<aon:outputLabel for="Contact_organization_city"
					value="#{webmailBundle.webmail_contact_city}" />
				<aon:inputText id="Contact_organization_city"
					maxlength="64" size="22"
					value="#{contact.to.organizationCity}" />
	
				<aon:outputLabel for="Contact_organization_state"
					value="#{webmailBundle.webmail_contact_state}" />
				<aon:inputText id="Contact_organization_state"
					maxlength="128" size="22"
					value="#{contact.to.organizationState}" />
			</aon:panelGrid>
			<aon:outputLabel for="Contact_organization_phone"
				value="#{webmailBundle.webmail_contact_phone}" />
			<aon:panelGrid id="contactOrganizationPhone" columns="5" dir="true" 
				columnClasses="aon-text-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left,aon-text-left aon-bold aon-padding-left,aon-text-left aon-padding-left">
				<aon:inputText id="Contact_organization_phone"
					maxlength="32" size="16"
					value="#{contact.to.organizationPhone}" />
	
				<aon:outputLabel for="Contact_organization_fax"
					value="#{webmailBundle.webmail_contact_fax}" />
				<aon:inputText id="Contact_organization_fax"
					maxlength="20" size="16"
					value="#{contact.to.organizationFax}" />
	
				<aon:outputLabel for="Contact_organization_web"
					value="#{webmailBundle.webmail_contact_web}" />
				<aon:inputText id="Contact_organization_web"
					maxlength="20" size="35"
					value="#{contact.to.web}" />
	
			</aon:panelGrid>
	
		</aon:panelGrid>
	</aon:div>

</ui:composition>
