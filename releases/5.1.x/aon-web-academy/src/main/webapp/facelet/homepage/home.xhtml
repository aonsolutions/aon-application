<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"				
	xmlns:ui="http://java.sun.com/jsf/facelets">
<c:forEach items="#{aonConfiguration.applicationBundleList}" var="appBundle">
	<f:loadBundle basename="#{appBundle.value}" var="#{appBundle.key}" />
</c:forEach>
<f:view>
	<head>
		<title>
			<ui:insert name="title">
				<h:outputText value="#{appBundle.aon_application_title}" />
			</ui:insert>
		</title>
		<link rel="shortcut icon" type="image/x-icon" href="#{facesContext.externalContext.requestContextPath}/images/favicon.ico" />
		<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
		<meta http-equiv="Expires" content="0" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Cache-Control" content="no-store" />
	</head>
	
	<frameset rows="69,*,23" scrolling="no" frameborder="0" framespacing="0"> 
		<frame id="header" src="${facesContext.externalContext.requestContextPath}/facelet/homepage/header.faces" scrolling="no" noresize="yes" frameborder="0" />
		<frame id="content" src="${company.companyNavigation}" scrolling="no" noresize="yes" frameborder="0" />
		<frame id="footer" src="${facesContext.externalContext.requestContextPath}/facelet/homepage/footer.faces" scrolling="no" noresize="yes" frameborder="0" />
	</frameset>

</f:view>
</html>
