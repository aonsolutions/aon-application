<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-form-group" rendered="#{!course.new}">
		<t:div styleClass="aon-form-group-title">
			<t:outputLabel for="courseScheduleDataTable" value="#{appBundle.schedule_schedule}" />
		</t:div>

		<t:div styleClass="aon-form-group-body">
			<t:dataTable id="courseScheduleDataTable"
				value="#{courseSchedule.model}" var="to"
				rowOnMouseOver="selectRow( this )"
				rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
				styleClass="aon-edit-table" headerClass="aon-edit-table-header"
				footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
				rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
				columnClasses="aon-edit-table-body aon-edit-table-body-icon,
					aon-edit-table-body aon-edit-table-body-string,
					aon-edit-table-body aon-edit-table-body-string,
					aon-edit-table-body aon-edit-table-body-string,
					aon-edit-table-body aon-edit-table-body-buttons">

				<h:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<f:verbatim>&#160;</f:verbatim>
					<t:commandLink immediate="#{true}"
						rendered="#{to!=courseSchedule.to}"
						styleClass="aon-table-row-selected"
						actionListener="#{courseSchedule.onSelect}">
					</t:commandLink>
					<f:facet name="footer">
						<t:div>
							<t:commandButton id="reset"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
								value="" immediate="#{true}" rendered="#{!courseSchedule.new}"
								actionListener="#{courseSchedule.onReset}"
								accesskey="#{bundle.aon_key_new_line}">
							</t:commandButton>
						</t:div>
					</f:facet>
				</h:column>

				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.schedule_day}" />
					</f:facet>
					<t:outputText value="#{to.day}"
						rendered="#{to!=courseSchedule.to}" />
					<h:selectOneMenu value="#{courseSchedule.to.day}"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{to==courseSchedule.to}">
						<f:selectItems value="#{academyCollections.weekDays}" />
					</h:selectOneMenu>
					<f:facet name="footer">
						<t:div rendered="#{courseSchedule.new}">
							<h:selectOneMenu value="#{courseSchedule.to.day}"
								styleClass="aon-form-selectOneMenu-field"
								rendered="#{courseSchedule.new}">
								<f:selectItems value="#{academyCollections.weekDays}" />
							</h:selectOneMenu>
						</t:div>
					</f:facet>
				</h:column>
				
				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.schedule_start_time}" />
					</f:facet>
					<t:outputText value="#{to.startTime}" rendered="#{to!=courseSchedule.to}" >
						<f:convertDateTime pattern="#{appBundle.aon_short_time_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</t:outputText>		
					<t:inputDate value="#{courseSchedule.to.startTime}"
						type="short_time" rendered="#{to==courseSchedule.to}"/>
					<f:facet name="footer">
						<t:div rendered="#{courseSchedule.new}">
							<t:inputDate value="#{courseSchedule.to.startTime}"
								type="short_time" rendered="#{courseSchedule.new}"/>
						</t:div>
					</f:facet>
				</h:column>

				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.schedule_end_time}" />
					</f:facet>
					<t:outputText value="#{to.endTime}" rendered="#{to!=courseSchedule.to}" >
						<f:convertDateTime pattern="#{appBundle.aon_short_time_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</t:outputText>		
					<t:inputDate value="#{courseSchedule.to.endTime}"
						type="short_time" rendered="#{to==courseSchedule.to}"/>
					<f:facet name="footer">
						<t:div rendered="#{courseSchedule.new}">
							<t:inputDate value="#{courseSchedule.to.endTime}"
								type="short_time" rendered="#{courseSchedule.new}"/>
						</t:div>
					</f:facet>
				</h:column>
				
				<h:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<t:div>
						<f:verbatim rendered="#{to!=courseSchedule.to}">&#160;</f:verbatim>

						<t:commandButton title="#{bundle.aon_save}"
							actionListener="#{courseSchedule.onAccept}"
							rendered="#{to==courseSchedule.to}" value=""
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
							accesskey="#{bundle.aon_key_save_line}" />
						<t:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{courseSchedule.onCancel}" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
							value="" rendered="#{to==courseSchedule.to}"
							accesskey="#{bundle.aon_key_cancel_line}" />
						<t:commandButton title="#{bundle.aon_remove}"
							actionListener="#{courseSchedule.onRemove}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
							rendered="#{to==courseSchedule.to}"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
							value="" accesskey="#{bundle.aon_key_remove_line}" />
					</t:div>
					<f:facet name="footer">
						<t:div>
							<f:verbatim rendered="#{!courseSchedule.new}">&#160;</f:verbatim>
							<t:commandButton title="#{bundle.aon_save}"
								actionListener="#{courseSchedule.onAccept}"
								rendered="#{courseSchedule.new}" value=""
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
								accesskey="#{bundle.aon_key_save_line}" />
							<t:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{courseSchedule.onCancel}"
								immediate="#{true}"
								onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
								rendered="#{courseSchedule.new}"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
								value="" accesskey="#{bundle.aon_key_cancel_line}" />
						</t:div>
					</f:facet>
				</h:column>
			</t:dataTable>

			<ui:include src="/facelet/shared/dataScroller.xhtml">
				<ui:param name="dataTable" value="courseScheduleDataTable" />
				<ui:param name="model" value="#{courseSchedule.model}" />
				<ui:param name="showNote" value="#{false}" />
			</ui:include>

		</t:div>
	</t:div>

</ui:composition>
</body>
</html>
