<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>
<ui:composition>

	<aon:form id="folderModalPanelForm">
		<aon:panelGroup id="showFolderModalPanel">
			<rich:modalPanel id="folderModalPanel"
					rendered="#{manager.menu.showFolderModalPanel}" showWhenRendered="true"
					headerClass="aon-popupWindow-title"
					minHeight="120" height="120" width="400" top="50" left="200" zindex="2000">
				<f:facet name="header">
	            	<h:outputText value="#{appBundle.aon_cdr_add_folder}"/>
				</f:facet>
				<f:facet name="controls">
					<aon:commandButton type="button" styleClass="aon-popupWindow-close" immediate="true">
						<f:setPropertyActionListener target="#{manager.menu.showFolderModalPanel}" value="#{false}" />
						<rich:componentControl for="folderModalPanel" operation="hide" event="onclick" />
					</aon:commandButton>
				</f:facet>
				<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting">
					<aon:outputLabel for="folder_path" value="#{appBundle.aon_cdr_path}" />
					<aon:outputText id="folder_path" 
						value="#{manager.folders.selectedNode.node.path}/" style="font-weight:normal;" />
				
					<aon:outputLabel for="folder_name" value="#{appBundle.aon_cdr_name}" />
					<aon:inputText id="folder_name" value="#{manager.folders.name}" size="45" />
				</aon:panelGrid>
				<aon:div style="text-align:right;padding-top:2px;">
					<aon:div styleClass="aon-toolbar" 
							style="padding:1px 1em;margin-bottom:2px;margin-top:1em;float:right">
						<aon:commandButton id="acceptFolder" value="#{menuBundle.aon_ecm_accept}" 
								reRender="folderPanel, documentPanel"
								actionListener="#{manager.folders.add}"
								styleClass="aon-finding-toolbar-item aon-icon-accept">
							<f:setPropertyActionListener target="#{manager.menu.showFolderModalPanel}" value="#{false}" />
							<rich:componentControl for="folderModalPanel" operation="hide" event="onclick" />
						</aon:commandButton>
						<aon:commandButton id="closeFolder" value="#{menuBundle.aon_ecm_close}" immediate="true" 
								styleClass="aon-finding-toolbar-item aon-icon-cancel" style="border-right:0;" >
							<f:setPropertyActionListener target="#{manager.menu.showFolderModalPanel}" value="#{false}" />
							<rich:componentControl for="folderModalPanel" operation="hide" event="onclick" />
						</aon:commandButton>
					</aon:div>
				</aon:div>
			</rich:modalPanel>
		</aon:panelGroup>
	</aon:form>
</ui:composition>
</body>
</html>
