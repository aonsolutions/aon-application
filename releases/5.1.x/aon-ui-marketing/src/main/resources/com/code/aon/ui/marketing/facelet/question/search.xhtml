<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="questionSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_question_module}" />
				<ui:param name="controller" value="#{question}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{question.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="question_list" />		
					
					<aon:outputLabel for="Question_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Question_id" size="60"
						valueChangeListener="#{question.addExpression}" />		
			
					<aon:outputLabel for="Question_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Question_type"
						converter="aon.EnumConverter" 
						valueChangeListener="#{question.addEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{marketingCollections.questionTypes}" />
					</aon:selectOneMenu>		
					
					<aon:outputLabel for="Question_text"
						value="#{marketingBundle.marketing_question}" />
					<aon:inputText id="Question_text" size="60"
						valueChangeListener="#{question.addExpression}" />

					<aon:outputLabel for="Question_argument"
						value="#{marketingBundle.marketing_question_argument}" />
					<aon:inputText id="Question_argument" size="60"
						valueChangeListener="#{question.addExpression}" />
				
					<aon:outputLabel for="Question_active"				
						value="#{bundle.aon_status}"/>
					<aon:selectOneMenu id="Question_active"
						valueChangeListener="#{question.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItem itemLabel="#{marketingBundle.marketing_active}" itemValue="#{true}"/>
						<f:selectItem itemLabel="#{marketingBundle.marketing_inactive}" itemValue="#{false}"/>
					</aon:selectOneMenu>
				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
	</ui:define>
		
</ui:composition>
