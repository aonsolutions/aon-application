#SCALE MODEL ENUMERATION
aon_enum_scalemodel_NONE=NONE
aon_enum_scalemodel_EUROSCALE=EPELSA EUROSCALE (HYDRA)
aon_enum_scalemodel_DIBAL=DIBAL (RMS)
aon_enum_scalemodel_BIZERBA=BIZERBA (SXCom)

#SCALE MODEL SELECT CATEGORY AND SUBCATEGORY
aon_enum_scalemodel_selectcategory_EUROSCALE=SELECT codi_sub, '', codi_fam, '' FROM familia WHERE borrado = 0 ORDER BY codi_sub, codi_fam
aon_enum_scalemodel_selectcategory_DIBAL=SELECT familia.cod_familia, familia.nombre_familia, subfamilia.cod_subfamilia, subfamilia.nombre_subfamilia FROM familia, subfamilia WHERE subfamilia.cod_familia = familia.cod_familia ORDER BY familia.cod_familia, subfamilia.cod_subfamilia

#SCALE MODEL SELECT ITEM
aon_enum_scalemodel_selectitem_EUROSCALE=SELECT codigo, codi_sub, codi_fam, plu, euros, des_plu1, art_cb, codi_pes FROM articulo WHERE borrado = 0
aon_enum_scalemodel_selectitem_DIBAL=SELECT cod_articulo, cod_familia, cod_subfamilia, cod_rapido, precio, nombre, ean_scanner, tipo FROM articulo

#SCALE MODEL SELECT TICKET
aon_enum_scalemodel_selectticket_EUROSCALE=SELECT d_fecha, code, plu, item, price, SUM(amount) AS cant, SUM(weight) AS peso, SUM(units) AS unidad FROM tickets WHERE d_fecha BETWEEN ? AND ? AND lincan = '0' GROUP BY d_fecha, code, plu, item, price ORDER BY d_fecha
aon_enum_scalemodel_selectticket_DIBAL=SELECT cabecera_ticket_venta.fecha, linea_ticket_venta.codigo, articulo.cod_rapido, linea_ticket_venta.nombre_articulo, linea_ticket_venta.precio, SUM(linea_ticket_venta.importe) as cant, SUM(linea_ticket_venta.peso) as peso, SUM(0) as unidad FROM cabecera_ticket_venta, linea_ticket_venta, articulo WHERE cabecera_ticket_venta.cod_ticket = linea_ticket_venta.cod_ticket AND linea_ticket_venta.codigo = articulo.cod_articulo AND fecha BETWEEN ? AND ? GROUP BY cabecera_ticket_venta.fecha, linea_ticket_venta.codigo, articulo.cod_rapido, articulo.ean_scanner, linea_ticket_venta.nombre_articulo, linea_ticket_venta.precio ORDER BY cabecera_ticket_venta.fecha

#SCALE MODEL INSERT CATEGORY
aon_enum_scalemodel_insertcategory_EUROSCALE=INSERT INTO subsec (codi_ident, codi_sub, borrado) VALUES (?,?,0)
aon_enum_scalemodel_insertcategory_DIBAL=INSERT INTO familia (cod_familia, nombre_familia) VALUES (?,?)

#SCALE MODEL SELECT MAX CATEGORY
aon_enum_scalemodel_maxcategory_EUROSCALE=SELECT MAX(codi_sub) FROM subsec
aon_enum_scalemodel_maxcategory_DIBAL=SELECT MAX(cod_familia) FROM familia

#SCALE MODEL INSERT SUBCATEGORY
aon_enum_scalemodel_insertsubcategory_EUROSCALE=INSERT INTO familia (codi_ident, secc_maqui, codi_sub, codi_fam, borrado) VALUES (?,?,?,?,0)
aon_enum_scalemodel_insertsubcategory_DIBAL=INSERT INTO subfamilia (cod_familia, cod_subfamilia, nombre_subfamilia, coste) VALUES (?,?,?,0)

#SCALE MODEL SELECT MAX SUBCATEGORY
aon_enum_scalemodel_maxsubcategory_EUROSCALE=SELECT MAX(codi_fam) FROM familia
aon_enum_scalemodel_maxsubcategory_DIBAL=SELECT MAX(cod_subfamilia) FROM subfamilia

#SCALE MODEL UPDATE CATEGORY
aon_enum_scalemodel_updatecategory_EUROSCALE=
aon_enum_scalemodel_updatecategory_DIBAL=UPDATE familia SET nombre_familia = ? WHERE cod_familia = ?

#SCALE MODEL UPDATE SUBCATEGORY
aon_enum_scalemodel_updatesubcategory_EUROSCALE=
aon_enum_scalemodel_updatesubcategory_DIBAL=UPDATE subfamilia SET nombre_subfamilia = ? WHERE cod_familia = ? AND cod_subfamilia = ?

#SCALE MODEL EXISTS CATEGORY
aon_enum_scalemodel_existscategory_EUROSCALE=SELECT codi_sub FROM subsec WHERE codi_ident = ? AND codi_sub = ?
aon_enum_scalemodel_existscategory_DIBAL=SELECT cod_familia FROM familia WHERE cod_familia = ?

#SCALE MODEL EXISTS SUBCATEGORY
aon_enum_scalemodel_existssubcategory_EUROSCALE=SELECT codi_sub, codi_fam FROM familia WHERE codi_ident = ? AND secc_maqui = ? AND codi_sub = ? AND codi_fam = ?
aon_enum_scalemodel_existssubcategory_DIBAL=SELECT cod_subfamilia FROM subfamilia WHERE cod_subfamilia = ?

#SCALE MODEL EXISTS SUBCATEGORY
aon_enum_scalemodel_getsubcategory_EUROSCALE=SELECT codi_sub, codi_fam FROM familia WHERE codi_sub = ? AND codi_fam = ?
aon_enum_scalemodel_getsubcategory_DIBAL=SELECT nombre_familia, nombre_subfamilia FROM familia, subfamilia WHERE familia.cod_familia = subfamilia.cod_familia AND familia.cod_familia = ? AND subfamilia.cod_subfamilia = ?

