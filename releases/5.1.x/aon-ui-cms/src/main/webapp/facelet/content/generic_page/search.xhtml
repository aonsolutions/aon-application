<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="genericPageForm">
			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
			cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">

				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.generic_page}" />					
				</aon:div>		
							
				<!--  toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">

						<aon:commandButton id="search"
							value="#{bundle.aon_search}"
							action="generic_page_list" actionListener="#{generic_page.onSearch}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}"/>
						<aon:commandButton id="reset"
							value="#{bundle.aon_reset}"
							action="generic_page_form" actionListener="#{generic_page.onReset}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:commandButton id="cancel"
							value="#{bundle.aon_cancel}"
							action="generic_page_list" actionListener="#{generic_page.onCancel}"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}"/>

					</aon:div>
				</aon:div>			
			<!-- end toolbar navigation -->
		</aon:panelGrid>	

		<aon:div styleClass="aon-scroll-area" forceId="#{true}">
			<aon:div styleClass="aon-scroll-area-internal">				
							
				<aon:div styleClass="aon-content-subtitle" >
					<aon:div styleClass="aon-content-subtitle-internal">
						<aon:outputText value="#{bundle.aon_search}" />
					</aon:div>
				</aon:div>
			

				<aon:panelGrid columns="2" styleClass="aon-formTable"
					cellpadding="0" cellspacing="0"
					columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

					<aon:outputLabel for="GenericPage_alias"
						styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
						value="#{appBundle.generic_page_alias}" />
					<aon:inputText id="GenericPage_alias" size="50"
						styleClass="aon-form-input-text"
						valueChangeListener="#{generic_page.addExpression}" />

					<aon:outputLabel for="GenericPage_create_date"
						styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
						value="#{appBundle.generic_page_create_date}" />
					<aon:div>
						<aon:selectInputDate id="GenericPage_create_date_from" styleClass="aon-calendar-"
							 style="z-index:2001;margin:0;vertical-align:middle;"
							 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
							 popupDateFormat="#{bundle.aon_date_pattern}"
							 renderAsPopup="true" valueChangeListener="#{generic_page.addFromDateExpression}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
						</aon:selectInputDate>
						<aon:selectInputDate id="GenericPage_create_date_to" styleClass="aon-calendar-"
							 style="z-index:2002;margin:0;vertical-align:middle;"
							 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
							 popupDateFormat="#{bundle.aon_date_pattern}"
							 renderAsPopup="true" valueChangeListener="#{generic_page.addToDateExpression}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
						</aon:selectInputDate>
					</aon:div>

				</aon:panelGrid>

				</aon:div>
			
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
