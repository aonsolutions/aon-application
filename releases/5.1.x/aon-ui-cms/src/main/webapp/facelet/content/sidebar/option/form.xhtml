<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="sidebarOptionForm" partialSubmit="false">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
			cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.sidebar_option}" />					
				</aon:div>		
			
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" rendered="#{sidebar_option.to!=null or sidebar_option.new}"
							actionListener="#{sidebar_option.onAccept}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:commandButton id="cancel"
							value="#{bundle.aon_cancel}" rendered="#{sidebar_option.to!=null or sidebar_option.new}" immediate="#{true}"
							actionListener="#{sidebar_option.onCancel}" action="sidebar_option_list"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!sidebar_option.new}" immediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{sidebar_option.onRemoveI18n}" confirmAction="sidebar_option_form"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{sidebar_option.onReset}" rendered="#{!sidebar_option.new}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<aon:div styleClass="aon-content-subtitle-internal">
					<aon:outputText
						value="#{sidebar_option.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</aon:div>
			</aon:div>
			<aon:div id="aon-scroll-area" forceId="#{true}">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:panelGrid columns="2">
						<aon:panelGrid columns="2" dir="true" styleClass="aon-form-table"
							columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

							<aon:outputLabel for="SidebarOption_alias" style="width:100px"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.sidebar_option_alias}" />
							<aon:inputText id="SidebarOption_alias"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="32" maxlength="32"
								value="#{sidebar_option.to.alias}" />

							<aon:outputLabel for="SidebarOptionDetail_label"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.sidebar_option_label}" />
							<aon:inputText id="SidebarOptionDetail_label"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="50" maxlength="64"
								value="#{sidebar_option.toI18n.label}" />

							<aon:outputLabel for="SidebarOption_type"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.sidebar_option_type}" />
							<aon:selectOneMenu id="SidebarOption_type" 
								styleClass="aon-form-selectOneSidebar-field"
								value="#{sidebar_option.to.type}" 
								required="true"
								partialSubmit="true">
								<f:selectItems value="#{collections.sidebarTypes}" />
							</aon:selectOneMenu> 

							<aon:outputLabel for="SidebarOption_ident"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.sidebar_option_ident}" rendered="#{sidebar_option.visibleIdent}"/>
							<aon:selectOneMenu id="SidebarOption_ident" rendered="#{sidebar_option.visibleIdent}" 
								styleClass="aon-form-selectOneMenu-field"
								value="#{sidebar_option.to.ident}">
								<f:selectItems value="#{sidebar_option.idents}" />
							</aon:selectOneMenu> 

<!-- 
							<aon:outputLabel for="SidebarOption_level"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.sidebar_option_level}" />
							<aon:selectOneMenu id="SidebarOption_level"  
								styleClass="aon-form-selectOneSidebar-field"
								value="#{sidebar_option.to.level}" >
								<f:selectItems value="#{collections.contentLevels}" />
							</aon:selectOneMenu> 
 -->

							<aon:outputLabel for="SidebarOption_side"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.sidebar_option_side}" />
							<aon:selectOneMenu id="SidebarOption_side" 
								styleClass="aon-form-selectOneSidebar-field"
								value="#{sidebar_option.to.side}" >
								<f:selectItems value="#{collections.sidebarSides}" />
							</aon:selectOneMenu> 

						</aon:panelGrid>
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>
</ui:composition>

</body>
</html>
