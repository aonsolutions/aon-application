<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="genericPageForm" partialSubmit="false">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar" 
				cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.generic_page}" />					
				</aon:div>		
			
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:commandButton id="save"
						value="#{bundle.aon_save}" rendered="#{generic_page.to!=null or generic_page.new}"
						actionListener="#{generic_page.onAccept}"
						styleClass="aon-content-toolbar-item aon-icon-accept"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
						accesskey="#{bundle.aon_key_save}"/>
					<aon:commandButton id="cancel"
						value="#{bundle.aon_cancel}" rendered="#{generic_page.to!=null or generic_page.new}" immediate="#{true}"
						actionListener="#{generic_page.onCancel}" action="generic_page_list"
						styleClass="aon-content-toolbar-item aon-icon-cancel"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
						accesskey="#{bundle.aon_key_cancel}"/>
					<aon:confirmButton id="remove"
						value="#{bundle.aon_remove}" rendered="#{!generic_page.new}" immediate="true"
						confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{generic_page.onRemoveI18n}" confirmAction="generic_page_form"
						styleClass="aon-content-toolbar-item aon-icon-delete"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
						accesskey="#{bundle.aon_key_remove}"/>
					<aon:commandButton id="search"
						value="#{bundle.aon_search}" immediate="true"
						action="generic_page_search" actionListener="#{generic_page.onEditSearch}"
						styleClass="aon-content-toolbar-item aon-icon-search"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-search'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-search aon-content-toolbar-item-hover'"
						accesskey="#{bundle.aon_key_search}"/>
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						actionListener="#{generic_page.onReset}" rendered="#{!generic_page.new}"
						styleClass="aon-content-toolbar-item aon-icon-reset"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
						accesskey="#{bundle.aon_key_new}" />
				</aon:div>
			</aon:panelGrid>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">	

					<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
						forceId="#{true}">
						<aon:div styleClass="aon-content-subtitle-internal">
							<aon:outputText
								value="#{generic_page.new?(bundle.aon_reset):(bundle.aon_editing)}" />
						</aon:div>
					</aon:div>
					<aon:div id="aon-scroll-area" forceId="#{true}">
						<aon:div styleClass="aon-scroll-area-internal">
							<ice:panelTabSet id="menuTabSet">
								<ice:panelTab id="content" label="#{appBundle.aon_content}">
									<aon:panelGrid columns="2">
										<aon:panelGrid columns="2" dir="true" styleClass="aon-form-table" style="width:100%"
											columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
				
											<aon:outputLabel for="GenericPage_alias"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.generic_page_alias}" />
											<aon:inputText id="GenericPage_alias"
												styleClass="aon-form-input-text aon-form-input-text-number"
												required="true" size="32" maxlength="32"
												value="#{generic_page.to.alias}" />
				
											<aon:outputLabel for="GenericPageDetail_title"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.generic_page_title}" />
											<aon:inputText id="GenericPageDetail_title"
												styleClass="aon-form-input-text aon-form-input-text-number"
												required="true" size="100" maxlength="255"
												value="#{generic_page.toI18n.title}" />
				
											<aon:outputLabel for="GenericPageDetail_richTextEnabled"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.generic_page_richtext_enabled}" />
											<aon:selectBooleanCheckbox id="GenericPageDetail_richTextEnabled"
												partialSubmit="true" 
												value="#{generic_page.richTextEnabled}" />
				
											<aon:outputLabel for="GenericPageDetail_content"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.generic_page_content}" 
												rendered="#{generic_page.richTextEnabled}" />
											<aon:inputRichText id="GenericPageDetail_content"
												rendered="#{generic_page.richTextEnabled}" 
												toolbarSet="Default" 
												value="#{generic_page.toI18n.content}"/>
				
											<aon:outputLabel for="GenericPageDetail_content_TA"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.generic_page_content}" 
												rendered="#{!generic_page.richTextEnabled}"/>
											<aon:inputTextarea id="GenericPageDetail_content_TA"
												rendered="#{!generic_page.richTextEnabled}" 
												cols="60" rows="20" 
												value="#{generic_page.toI18n.content}"/>
				
											<aon:outputLabel for="GenericPage_menu"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.generic_page_menu}" />
											<aon:selectOneMenu id="GenericPage_menu" 
												styleClass="aon-form-selectOneMenu-field"
												value="#{generic_page.to.menu}">
												<f:selectItems value="#{generic_page.menus}" />
											</aon:selectOneMenu> 

											<aon:outputLabel for="GenericPage_section"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.section}"/>
											<aon:selectOneMenu id="GenericPage_section"  
												styleClass="aon-form-selectOneMenu-field"
												value="#{generic_page.to.section.id}">
												<f:selectItem itemLabel="-" itemValue="-1" />
												<f:selectItems value="#{collections.sectionList}" />
											</aon:selectOneMenu>
				
										</aon:panelGrid>
									</aon:panelGrid>
			                    </ice:panelTab>
		
								<ice:panelTab id="meta_tags" label="#{appBundle.aon_meta_tags}">
									<aon:panelGrid columns="2" dir="true" styleClass="aon-form-table" style="width:100%"
										columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
			
										<aon:outputLabel for="GenericPage_description"
											styleClass="aon-form-input-text-label"
											value="#{appBundle.generic_page_description}" />
										<aon:inputTextarea id="GenericPage_description" style="width:300px;height:60px"
											styleClass="aon-form-input-text aon-form-input-text-number" partialSubmit="false"
											value="#{generic_page.toI18n.description}" />
			
										<aon:outputLabel for="GenericPage_keywords" 
											styleClass="aon-form-input-text-label"
											value="#{appBundle.generic_page_keywords}" />
										<aon:inputTextarea id="GenericPage_keywords" style="width:300px;height:60px"
											styleClass="aon-form-input-text aon-form-input-text-number" partialSubmit="false"
											value="#{generic_page.toI18n.keywords}" />
			
									</aon:panelGrid>
			                    </ice:panelTab>
							</ice:panelTabSet>
		
						</aon:div>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>
</ui:composition>

</body>
</html>
