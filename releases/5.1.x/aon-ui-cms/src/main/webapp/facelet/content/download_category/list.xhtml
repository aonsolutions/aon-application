<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-ice-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="downloadCategoryList">
			
			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
			cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.download_category}" />					
				</aon:div>		
			
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="download_category_form" actionListener="#{download_category.onReset}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!download_category.checklistEmpty}" inmediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{download_category.onRemoveSelected}" confirmAction="download_category_list"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="home" styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_close}"/>
					</aon:div>
				</aon:div>
			<!-- end toolbar navigation -->
			</aon:panelGrid> 
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">	
				
					<aon:div styleClass="aon-content-subTitle">
						<aon:div styleClass="aon-content-subTitle-internal">
							<aon:outputText value="Listado registros" />
						</aon:div>
					</aon:div>
					
					<aon:outputLabel for="DownloadCategory_section"
						styleClass="aon-form-input-text-label"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="DownloadCategory_section"  
						styleClass="aon-form-selectOneMenu-field"
						value="#{generator_config.sectionId}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
					
					<aon:commandButton id="save"
						value="#{bundle.aon_save}" 
						actionListener="#{generator_config.onSaveDownloadConfig}"
						styleClass="aon-content-toolbar-item aon-icon-accept"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
						accesskey="#{bundle.aon_key_save}"/>
						
					<aon:dataTable id="downloadCategoryDataList" styleClass="aon-dataTable"
					 	columnWidths="120,200,50,*,50,60" 
						value="#{download_category.model}" var="to" rows="0"
						rowClasses="aon-dataTable-odd, aon-dataTable-even"
						columnClasses="aon-table-body aon-table-body-icon,
							aon-table-body aon-table-body-string,
							aon-table-body aon-table-body-string,
							aon-table-body aon-table-body-icon,
							aon-table-body aon-table-body-icon,
							aon-table-body aon-table-body-icon">

							<aon:column>
								<aon:rowSelector selectionListener="#{download_category.onSelect}" toggleOnClick="true"/>
								<f:facet name="header">
									<aon:div>
										<aon:outputText value="#{bundle.aon_check}" />
										<aon:div>
											<aon:commandLink id="all" value="#{bundle.aon_check_all}" 
											styleClass="aon-table-header-link-secundary"
											onclick="selectAll();return false;" />
											<aon:commandLink id="none" value="#{bundle.aon_uncheck_all}"
											styleClass="aon-table-header-link-secundary"
											onclick="unSelectAll();return false;" />
											<aon:commandLink id="inverse" value="#{bundle.aon_inverse_all}"
											styleClass="aon-table-header-link-secundary"
											onclick="inverseAll();return false;" />
										</aon:div>										
									</aon:div>	
								</f:facet>
								<aon:selectBooleanCheckbox id="Row_checked" forceId="#{true}"
										value="#{download_category.rowChecked}" partialSubmit="true" 
										valueChangeListener="#{download_category.onChecked}"/>
							</aon:column>
					
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.download_category_alias}" />
								</f:facet>
								<aon:outputText value="#{to.alias}"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.download_category_label}" />
								</f:facet>
								<aon:outputText value="#{download_category.i18nLabel}"
									style="padding-left:20px"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.download_category_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.download_category_activate}" action="download_category_list"
									actionListener="#{download_category.onActivate}" 
									rendered="#{!to.active}">
									<aon:graphicImage id="DownloadCategory_active" alt="#{appBundle.download_category_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.download_category_deactivate}" action="download_category_list"
									actionListener="#{download_category.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="DownloadCategory_deactive" alt="#{appBundle.download_category_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText for="DownloadCategory_position" 
										value="#{appBundle.download_category_position}" />
								</f:facet>
								<aon:graphicImage rendered="#{to.position == 0}"
									url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
								<aon:commandButton id="moveUp" 
									actionListener="#{download_category.onMoveUp}" 
									rendered="#{to.position != 0}"
									image="/images/cms/up.gif" style="margin-left: 4px;"/>
								<aon:commandButton id="moveDown" 
									actionListener="#{download_category.onMoveDown}"
									rendered="#{to.position &lt; (download_category.model.rowCount - 1)}"
									image="/images/cms/down.gif" style="margin-left: 4px;" />
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText for="downloads" value="#{appBundle.download_category_downloads}" />
								</f:facet>
									<aon:commandLink title="#{appBundle.download_category_downloads}" 
										action="download_list"
										actionListener="#{download_category.onSelectDownloads}">
										<aon:graphicImage id="CategoryDownloads_downloads" 
											alt="#{appBundle.download_category_downloads}"
											url="/images/cms/content.gif" />
									</aon:commandLink>
							</aon:column>
						
						</aon:dataTable>
						
						<ui:include src="/facelet/shared/dataScroller.xhtml">
							<ui:param name="dataTable" value="downloadCategoryDataList" />
							<ui:param name="model" value="#{download_category.model}" />
							<ui:param name="showNote" value="#{false}" />
						</ui:include>
					
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
