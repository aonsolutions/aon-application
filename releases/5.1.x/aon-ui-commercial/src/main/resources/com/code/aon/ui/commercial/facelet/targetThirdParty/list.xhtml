<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core">

	<ui:include
		src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
		<ui:param name="toolbarID" value="ttpListToolbar" />		
		<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_target_distributor_info}" />
		<ui:param name="skipSearchButton" value="true" />
		<aon:methodParam name="resetAction" value="" />
		<ui:param name="resetButtonReRender" value="targetThirdPartyContent" />		
	</ui:include>
	
	<aon:div id="targetThirdPartyDiv" styleClass="aon-scroll-area">
		<aon:dataTable id="targetThirdPartyDataList" value="#{controller.model}"
			rows="20" var="to" rendered="#{controller.model.rowCount > 0}">

			<aon:rowSelector actionListener="#{controller.onSelect}" reRender="targetThirdPartyContent" />
			<aon:column width="85">
				<f:facet name="header">
					<aon:outputText
						value="#{commercialBundle.commercial_offer_distributor}" />
				</f:facet>
				<aon:outputText value="#{to.thirdParty.registry.fullName}"
					rendered="#{true}" />
			</aon:column>

		</aon:dataTable>
		<aon:dataScroller2 for="targetThirdPartyDataList" showNote="true" />
	</aon:div>
</ui:composition>
