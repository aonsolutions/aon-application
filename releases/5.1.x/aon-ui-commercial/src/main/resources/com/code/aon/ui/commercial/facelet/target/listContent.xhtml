<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<!--  aon-region-body -->
	<aon:div styleClass="aon-scroll-area">		
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:param name="controller" value="#{target}" />
			<ui:define name="columns">
			
				<ui:include
					src="/com/code/aon/ui/commercial/facelet/target/listBasic.xhtml" />
	
				<aon:column alias="Target.registry.alias"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_company_alias}" />
					</f:facet>
					<aon:outputText value="#{to.registry.alias}" />
				</aon:column>
	
				<aon:column alias="Target.advertising"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{commercialBundle.commercial_target_advertising}" />
					</f:facet>
					<aon:outputText value="#{to.advertising}"/>
				</aon:column>
			</ui:define>
		</ui:decorate>
	</aon:div>

</ui:composition>
