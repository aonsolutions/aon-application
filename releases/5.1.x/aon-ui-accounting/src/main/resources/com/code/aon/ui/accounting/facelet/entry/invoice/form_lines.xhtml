<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">


	<aon:panel rendered="#{invoiceEntry.registryFilled}">
		<f:facet name="header">
			<aon:outputText value="#{accountingBundle.accounting_concepts}" />
		</f:facet>


		<aon:editDataTable id="TaxesData" var="to" rows="0"
			value="#{invoiceEntry.details}">

			<aon:rowSelector immediate="true"
				rendered="#{!invoiceEntry.newDetail and to!=invoiceEntry.currentDetail}"
				actionListener="#{invoiceEntry.onSelectDetail}" />

			<aon:column styleClass="aon-editDataTable-iconColumn aon-width-20">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton value=""
							styleClass="aon-editDataTable-button aon-icon-new"
							reRender="TaxesData,invoiceContainer"
							actionListener="#{invoiceEntry.onNewDetail}"
							rendered="#{!invoiceEntry.newDetail}"
							accesskey="#{bundle.aon_key_new_line}"
							focus="Account_Taxable_Base-New">
						</aon:commandButton>
						<aon:outputText rendered="#{invoiceEntry.newDetail}"
							value="&#160;" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel for="Account_Taxable_Base" value="#{bundle.aon_taxable_base}" />
				</f:facet>
				<aon:outputText 
					rendered="#{to!=invoiceEntry.currentDetail}"
					value="#{to.taxableBase}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText size="8" id="Account_Taxable_Base"
					reRender="editRetention,editVat,editSurcharge,editTotal,invoiceTotal"
					rendered="#{to==invoiceEntry.currentDetail}"
					valueChangeListener="#{invoiceEntry.onChangeTaxableBase}"
					value="#{invoiceEntry.currentDetail.taxableBase}" required="true" 
					focus="Account_Vat"/>
				<f:facet name="footer">
					<aon:div styleClass="aon-text-right">
						<aon:inputText id="Account_Taxable_Base-New" size="8"
							reRender="newRetention,newVat,newSurcharge,newTotal"
							rendered="#{invoiceEntry.newDetail}"
							valueChangeListener="#{invoiceEntry.onChangeTaxableBase}"
							value="#{invoiceEntry.currentDetail.taxableBase}"
							focus="Account_Vat-New">

							<a4j:support event="onkeyup"
								onsubmit="if(event.keyCode != 27) return false;"
								eventsQueue="lineEscKeyUp" ignoreDupResponses="true"
								requestDelay="100"
								reRender="TaxesData,aonToolbar,invoiceContainer"
								actionListener="#{invoiceEntry.onCancelDetail}" immediate="true"
								focus="newFinance">
							</a4j:support>
						</aon:inputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100">
				<f:facet name="header">
					<aon:outputLabel for="Account_Vat" value="#{bundle.aon_vat}" />
				</f:facet>
				<aon:outputText value="#{to.vatPercent}"
					rendered="#{to!=invoiceEntry.currentDetail}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="Account_Vat" size="5"
					rendered="#{to==invoiceEntry.currentDetail}"
					value="#{invoiceEntry.currentDetail.vatPercent}"
					valueChangeListener="#{invoiceEntry.onChangeVatPercent}"
					reRender="editRetention,editVat,editSurcharge,editTotal,invoiceTotal"
					required="true" focus="editVat"/>
				<f:facet name="footer">
					<aon:inputText id="Account_Vat-New" size="5"
						rendered="#{invoiceEntry.newDetail}"
						value="#{invoiceEntry.currentDetail.vatPercent}"
						valueChangeListener="#{invoiceEntry.onChangeVatPercent}"
						reRender="newRetention,newVat,newSurcharge,newTotal"
						required="true" focus="newVat"/>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_vat_quota}" />
				</f:facet>
				<aon:outputText value="#{to.vatQuota}"
					rendered="#{to!=invoiceEntry.currentDetail}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="editVat" size="8"
					rendered="#{to==invoiceEntry.currentDetail}"
					value="#{invoiceEntry.currentDetail.vatQuota}"
					reRender="editRetention,editVat,editSurcharge,editTotal,invoiceTotal"
					required="true" 
					focus="Account_Surcharge-Edit"/>
				<f:facet name="footer">
					<aon:inputText id="newVat" size="8"
						rendered="#{invoiceEntry.newDetail}" 
						value="#{invoiceEntry.currentDetail.vatQuota}"
						reRender="newRetention,newVat,newSurcharge,newTotal"
						required="true" 
						focus="Account_Surcharge-New"/>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100"
				rendered="#{invoiceEntry.header.surcharge}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_surcharge}" />
				</f:facet>
				<aon:outputText value="#{to.surchargePercent}"
					rendered="#{to!=invoiceEntry.currentDetail}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="Account_Surcharge-Edit" size="5"
					rendered="#{to==invoiceEntry.currentDetail}"
					value="#{invoiceEntry.currentDetail.surchargePercent}"
					valueChangeListener="#{invoiceEntry.onChangeSurchargePercent}"
					reRender="editRetention,editVat,editSurcharge,editTotal,invoiceTotal"
					focus="editSurcharge"
					/>
				<f:facet name="footer">
					<aon:inputText id="Account_Surcharge-New" size="5"
						rendered="#{invoiceEntry.newDetail}"
						value="#{invoiceEntry.currentDetail.surchargePercent}"
						valueChangeListener="#{invoiceEntry.onChangeSurchargePercent}"
						reRender="newRetention,newVat,newSurcharge,newTotal"
						focus="newSurcharge"
						/>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100"
				rendered="#{invoiceEntry.header.surcharge}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_surcharge_quota}" />
				</f:facet>
				<aon:outputText value="#{to.surchargeQuota}"
					rendered="#{to!=invoiceEntry.currentDetail}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="editSurcharge" size="8"
					rendered="#{to==invoiceEntry.currentDetail}"
					value="#{invoiceEntry.currentDetail.surchargeQuota}"
					reRender="editRetention,editVat,editSurcharge,editTotal,invoiceTotal"
					required="true" focus="Account_Retention" />
				<f:facet name="footer">
					<aon:inputText id="newSurcharge" size="8"
						rendered="#{invoiceEntry.newDetail}"
						value="#{invoiceEntry.currentDetail.surchargeQuota}"
						reRender="newRetention,newVat,newSurcharge,newTotal" 
						focus="Account_Retention-New" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-100"
				rendered="#{invoiceEntry.header.withholding}">
				<f:facet name="header">
					<aon:outputLabel for="Account_Retention" value="#{bundle.aon_retention}" />
				</f:facet>
				<aon:outputText value="#{to.retentionPercent}"
					rendered="#{to!=invoiceEntry.currentDetail}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="Account_Retention" size="5"
					reRender="editRetention,editVat,editSurcharge,editTotal,invoiceTotal"
					rendered="#{to==invoiceEntry.currentDetail}"
					valueChangeListener="#{invoiceEntry.onChangeRetentionPercent}"
					value="#{invoiceEntry.currentDetail.retentionPercent}" 
					focus="editRetention"/>
				<f:facet name="footer">
					<aon:div styleClass="aon-text-right">
						<aon:inputText id="Account_Retention-New" size="5"
							rendered="#{invoiceEntry.newDetail}"
							value="#{invoiceEntry.currentDetail.retentionPercent}"
							valueChangeListener="#{invoiceEntry.onChangeRetentionPercent}"
							focus="newRetention"
							reRender="newRetention,newVat,newSurcharge,newTotal" />
						<aon:outputText rendered="#{!invoiceEntry.newDetail}"
							value="&#160;" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150"
				rendered="#{invoiceEntry.header.withholding}">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_retention_quota}" />
				</f:facet>
				<aon:outputText rendered="#{to!=invoiceEntry.currentDetail}" 
					value="#{to.retentionQuota}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="editRetention" size="8"
					rendered="#{to==invoiceEntry.currentDetail}"
					value="#{invoiceEntry.currentDetail.retentionQuota}"
					reRender="editRetention,editVat,editSurcharge,editTotal,invoiceTotal"
					focus="accountId"
					required="true" />
				<f:facet name="footer">
					<aon:inputText id="newRetention" size="8"
						rendered="#{invoiceEntry.newDetail}" 
						value="#{invoiceEntry.currentDetail.retentionQuota}"
						reRender="newRetention,newVat,newSurcharge,newTotal"
						focus="accountId-New"
						required="true" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_total}" />
				</f:facet>
				<aon:outputText id="editTotal" value="#{to.total}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div id="newTotal" styleClass="aon-text-right">
						<aon:outputText rendered="#{invoiceEntry.newDetail}" 
							value="#{invoiceEntry.currentDetail.total}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:outputText id="invoiceTotal" rendered="#{!invoiceEntry.newDetail}" 
							value="#{invoiceEntry.invoiceTotal}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputText 
						value="#{accountBundle.account_account}" />
				</f:facet>
				
				<aon:div style="width: 90%;" rendered="#{to!=invoiceEntry.currentDetail}" ajaxRendered="true">
					<aon:outputText value="#{to.account}" />
					<rich:toolTip value="#{to.account.description}"
							hideEvent="onmouseout" showDelay="200">
					</rich:toolTip>
				</aon:div>
					
				<ui:include
					src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
					<ui:param name="wizard" value="#{accountWizard}" />
					<ui:param name="id" value="accountId" />
					<ui:param name="required" value="#{true}" />
					<ui:param name="renderDescription" value="#{false}" />
					<ui:param name="renderedAttr"
						value="#{to==invoiceEntry.currentDetail}" />
					<ui:param name="disabled" value="#{false}" />
					<ui:param name="reRenderAttr" value="none" />
					<ui:param name="entity"
						value="#{invoiceEntry.currentDetail.account}" />
					<ui:param name="ELExpression"
						value="invoiceEntry.currentDetail.account" />
				</ui:include>
				<f:facet name="footer">
					<aon:div>
						<ui:include
							src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
							<ui:param name="wizard" value="#{accountWizard}" />
							<ui:param name="id" value="accountId-New" />
							<ui:param name="required" value="#{true}" />
							<ui:param name="renderDescription" value="#{false}" />
							<ui:param name="renderedAttr" value="#{invoiceEntry.newDetail}" />
							<ui:param name="disabled" value="#{false}" />
							<ui:param name="reRenderAttr" value="none" />
							<ui:param name="entity"
								value="#{invoiceEntry.currentDetail.account}" />
							<ui:param name="ELExpression"
								value="invoiceEntry.currentDetail.account" />
						</ui:include>
						<aon:outputText rendered="#{!invoiceEntry.newDetail}"
							value="&#160;" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column
				styleClass="aon-editDataTable-buttonsColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div rendered="#{to==invoiceEntry.currentDetail}">
					<aon:commandButton title="#{bundle.aon_save}"
						reRender="TaxesData,aonToolbar,financesTotal"
						actionListener="#{invoiceEntry.onUpdateDetail}"
						styleClass="aon-editDataTable-button aon-icon-accept" value=""
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="#{bundle.aon_cancel}"
						reRender="TaxesData,aonToolbar,invoiceContainer,financesTotal"
						actionListener="#{invoiceEntry.onCancelDetail}" immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
						styleClass="aon-editDataTable-button aon-icon-cancel" value=""
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:commandButton title="#{bundle.aon_remove}"
						reRender="TaxesData,aonToolbar,financesTotal"
						actionListener="#{invoiceEntry.onRemoveDetail}" immediate="true"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;;"
						styleClass="aon-editDataTable-button aon-icon-delete" value=""
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<aon:div rendered="#{invoiceEntry.newDetail}">
							<aon:commandButton title="#{bundle.aon_save}"
								reRender="TaxesData,aonToolbar,financesTotal"
								actionListener="#{invoiceEntry.onAddDetail}"
								styleClass="aon-editDataTable-button aon-icon-accept" value=""
								accesskey="#{bundle.aon_key_save_line}"
								focus="Account_Taxable_Base-New" />
							<aon:commandButton title="#{bundle.aon_cancel}"
								reRender="TaxesData,aonToolbar,invoiceContainer,financesTotal"
								actionListener="#{invoiceEntry.onCancelDetail}" immediate="true"
								styleClass="aon-editDataTable-button aon-icon-cancel" value=""
								accesskey="#{bundle.aon_key_cancel_line}" />
						</aon:div>
						<aon:outputText rendered="#{!invoiceEntry.newDetail}"
							value="&#160;" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>
	</aon:panel>
</ui:composition>
