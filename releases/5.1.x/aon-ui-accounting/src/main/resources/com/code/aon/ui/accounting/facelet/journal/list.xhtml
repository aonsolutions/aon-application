<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountEntryReportList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_journal_module}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener"
						value="#{journalReport.onEditSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="journal_search" />
				</ui:define>
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="update" value="#{accountingBundle.accounting_refresh}"
						accesskey="Q" title="#{accountingBundle.accounting_refresh}"
						actionListener="#{journalReport.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh"
						immediate="true" />
				
					<aon:htmlCommandLink id="journalBookXls-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						title="#{bundle.aon_listing} MS Excel"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="journalBookXls" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="journalBook-word-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						title="#{bundle.aon_listing} MS Word 2007"
						styleClass="aon-finding-toolbar-item aon-icon-word aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="journalBook" />
						<f:param name="outputFormat" value="DOCX" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="journalBook-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}" action="#{report.onExecute}">
						<f:param name="reportKey" value="journalBook" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="8" style="width:100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-100,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-100,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-100,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="reportDate"
						value="#{accountingBundle.accounting_report_date}" />
					<aon:outputText
						value="#{journalReport.date}"
						timeZone="#{timeZoneController.timeZone}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
					</aon:outputText>
					
					<aon:outputLabel 
						value="#{accountingBundle.accounting_period}" />
					<aon:outputText styleClass="aon-bold"
						value="#{journalReport.period.id}" />
					
					<aon:outputLabel
						value="#{bundle.aon_date_from}" />
					<aon:outputText 
						value="#{journalReport.fromDate}"
						timeZone="#{timeZoneController.timeZone}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
					</aon:outputText>

					<aon:outputLabel
						value="#{bundle.aon_date_to}" />
					<aon:outputText 
						value="#{journalReport.toDate}"
						timeZone="#{timeZoneController.timeZone}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
					</aon:outputText>
				</aon:panelGrid>
				
				<aon:div rendered="#{journalReport.model.rowCount > 0}" styleClass="aon-margin-top">
					<aon:dataTable id="journalReportList" value="#{journalReport.model}" rows="20" var="to">
						<f:facet name="header">
							<rich:columnGroup>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{accountBundle.account_account}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{bundle.aon_description}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{bundle.aon_concept}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{accountingBundle.accounting_debit}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{accountingBundle.accounting_credit}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText
										value="#{accountingBundle.accounting_balancing_account}" />
								</aon:column>
							</rich:columnGroup>
						</f:facet>

						<aon:column colspan="6" rendered="#{journalReport.firstEntry}" 
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							
							
								<aon:div style="text-align:center; font-size: 1em;">
									<h:commandLink immediate="true" 
										styleClass="aon-dataTable-link"
										title="#{accountingBundle.accounting_lookup_account_entry}"
										actionListener="#{journalReport.onAccountEntry}"
										action="accountEntry_form">
										<aon:outputText styleClass="aon-italic" value="#{accountingBundle.accounting_account_entry}: " />
										<aon:outputText styleClass="aon-bold" value="#{to.accountEntry.id}" rendered="#{!journalReport.journal}"/>
										<aon:outputText styleClass="aon-bold" value="#{to.accountEntry.journal}" rendered="#{journalReport.journal}"/>
										<aon:outputText styleClass="aon-italic" value=" #{bundle.aon_date}: " />
										<aon:outputText styleClass="aon-bold" value="#{to.accountEntry.entryDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>
									</h:commandLink>
								</aon:div>
						</aon:column>
						
						<aon:column breakBefore="#{journalReport.firstEntry}" styleClass="aon-editDataTable-textColumn aon-width-100"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.account.id}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.account.description}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-200"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.concept}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-50"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.debit}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column	styleClass="aon-editDataTable-numberColumn aon-width-50"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.credit}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100"
							style="#{journalReport.odd?'background-color:#f2f2f2;':'background-color:#FFFFFF;'}">
							<aon:outputText value="#{to.balancingAccount.id}" />
						</aon:column>
					</aon:dataTable>
				</aon:div>
				<aon:dataScroller2 for="journalReportList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
