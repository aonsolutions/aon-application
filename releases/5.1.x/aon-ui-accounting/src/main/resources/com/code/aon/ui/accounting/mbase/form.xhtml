<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="mbaseForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="TITLE" />
				<ui:param name="toolbarDescription" value="DESCRIPTION" />
				<ui:define name="toolbarContent">
				
					<aon:commandButton id="execute" 
						value="EJECUTAR"
						actionListener="#{mbase.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						rendered="#{mbase.aonFile.size > 0}"
						onclick="if (!confirm('Se va a ejecutar el contenido del archivo. Desea continuar?')) return false;"
						/>

					<aon:commandButton id="view" 
						value="VER CONTENIDO"
						actionListener="#{mbase.onView}"
						reRender="fileContainer"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						rendered="#{mbase.aonFile.size > 0}" />

				</ui:define>
			</ui:decorate>

			<aon:panelGrid columns="2" style="width:90%; margin:10px;">
				<aon:outputLabel for="attach_file" value="FICHERO" />
				<a4j:region>
					<h:panelGrid id="attachGrid" columns="2">
						<aon:outputText rendered="#{mbase.aonFile.size > 0}"
							value="#{mbase.aonFile.fileName} - ( #{mbase.aonFile.size} bytes)" />
						<aon:fileUpload id="attach_file"
							addControlLabel="#{bundle.aon_fileUpload_add}"
							stopControlLabel="#{bundle.aon_fileUpload_stop}"
							stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
							uploadControlLabel="#{bundle.aon_fileUpload_upload}"
							fileUploadListener="#{mbase.fileUploaded}" immediateUpload="true"
							autoclear="true" listWidth="0px" listHeight="0px">
							<f:facet name="label">
								<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
							</f:facet>
							<a4j:support event="onuploadcomplete" reRender="attachGrid,aonToolbar" />
						</aon:fileUpload>
					</h:panelGrid>
				</a4j:region>
			</aon:panelGrid>

			<aon:div id="fileContainer" style="width:90%; margin:10px;text-align: center;">
				<aon:dataTable value="#{mbase.statements}" var="stmt" style="text-align: left;">
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="SENTENCIA SQL" />	
						</f:facet>
						<aon:outputText value="#{stmt}" style="font-familiy: Courier; font-size: 10px;"/>
					</aon:column>
				</aon:dataTable>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
