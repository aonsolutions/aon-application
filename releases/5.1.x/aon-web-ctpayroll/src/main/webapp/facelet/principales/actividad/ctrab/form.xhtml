<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">


		<aon:form id="ctrbForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_principales_act_ctrab}" />
				<ui:param name="controller" value="#{emprctra}" />
				<aon:methodParam name="backAction" value="actividad_form"/>	
			
				
			</ui:include>


			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" dir="true" width="100%"
					style="margin-bottom=2px;">


					<aon:outputLabel for="Actividad_cdg"
						value="#{appBundle.aon_payroll_principales_tipocuenta_actividad}" />
					<aon:div>
						<aon:inputText id="Acti_cdg" value="#{emprctra.to.actividad.cdg}"
							size="5" disabled="true" />

						<aon:inputText id="Acti_description"
							value="#{emprctra.to.actividad.descripcion}" size="60"
							disabled="true" />
					</aon:div>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_tipocuenta_empresa}" />
					<aon:div>
						<aon:inputText id="Empre_cdg" value="#{emprctra.to.empresa.cdg}"
							size="5" disabled="true" />

						<aon:inputText id="Empre_description"
							value="#{emprctra.to.empresa.descripcion}" size="60"
							disabled="true" />
					</aon:div>


					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_localidad}" />

					<aon:inputText value="#{emprctra.to.domicilio.localidad}" size="50" />

					<aon:outputLabel for="Domicilio_cdg"
						value="#{appBundle.aon_payroll_principales_tipodomcilio_domicilio}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Dom_cdg" lookup="#{domicilioLookup}"
							reRender="Dom_description" value="#{emprctra.to.domicilio.cdg}"
							size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Dom_lookup"
							windowTitle="#{appBundle.aon_payroll_principales_tipodomcilio_domicilio}"
							selectReRender="Dom_cdg,Dom_description"
							lookup="#{domicilioLookup}" minHeight="440"
							property="#{emprctra.to.domicilio}">
						</aon:lookupButton>
						<aon:inputText id="Dom_description"
							value="#{(emprctra.to.domicilio.nomvia!=null)?(emprctra.to.domicilio.nomvia):('')}"
							size="60" disabled="true" />
					</aon:div>

					<aon:outputLabel for="Domicilio_cdg"
						value="#{appBundle.aon_payroll_principales_act_ctrab_con}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Con_cdg" lookup="#{convenioLookup}"
							reRender="Con_description" value="#{emprctra.to.convenio.cdg}"
							size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Con_lookup"
							windowTitle="#{appBundle.aon_payroll_principales_act_ctrab_con}"
							selectReRender="Con_cdg,Con_description"
							lookup="#{convenioLookup}" minHeight="440"
							property="#{emprctra.to.convenio}">
						</aon:lookupButton>
						<aon:inputText id="Con_description"
							value="#{(emprctra.to.convenio.description!=null)?(emprctra.to.convenio.description):('')}"
							size="60" disabled="true" />
					</aon:div>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_pot}" />

					<aon:inputText value="#{emprctra.to.pelectri}" size="50" />


					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_maq}" />

					<aon:inputText value="#{emprctra.to.maquina}" size="50" />



					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_sup}" />

					<aon:inputText value="#{emprctra.to.superficie}" size="50" />



					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_min}" />

					<aon:inputText value="#{emprctra.to.jornada}" size="50" />


					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_hor}" />
					<h:inputTextarea value="#{emprctra.to.horario}" cols="50" rows="4"
						size="150" maxlength="100" />


					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_fiest}" />
					<h:inputText value="#{emprctra.to.fiestas}" cols="50" rows="4"
						size="50" maxlength="40" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_act_ctrab_env}" />
					<aon:selectOneMenu value="#{emprctra.to.envioss}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{emprctra.listaenvios}" />
					</aon:selectOneMenu>

					<aon:panelGroup>
						<aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{emprctra.to.indcal}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_act_ctrab_cal}" />
							</aon:div>
							<br></br>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{emprctra.to. indnom}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_act_ctrab_nom}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{emprctra.to.indcoste}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_act_ctrab_est}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{emprctra.to.toxicos}" />
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_act_ctrab_tox}" />
							</aon:div>


						</aon:div>
					</aon:panelGroup>



					<aon:panelGroup>
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_act_ctrab_rep}" />
						<aon:selectOneRadio value="#{emprctra.to.represen}"
							layout="pageDirection">
							<f:selectItems value="#{emprctra.listarepre}" />
						</aon:selectOneRadio>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_act_ctrab_ind}" />
						<aon:selectOneRadio value="#{emprctra.to.inddia}"
							layout="pageDirection">
							<f:selectItems value="#{emprctra.listainddia}" />
						</aon:selectOneRadio>
					</aon:panelGroup>
		
		
			<aon:outputLabel
							value=" " />
			</aon:panelGrid>

		</aon:div>


		</aon:form>



	</ui:define>
</ui:composition>

</body>
</html>
