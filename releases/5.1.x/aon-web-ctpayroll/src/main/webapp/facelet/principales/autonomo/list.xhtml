<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="otrpercList">

			<ui:include src="/facelet/templates/listPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_principales_autonomos}" />
				<ui:param name="controller" value="#{autonomo}" />

				<ui:param name="reportKey" value="autonomosList" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="otrpercData" value="#{autonomo.model}" var="to"
					rows="20" rendered="#{autonomo.model.rowCount > 0}"
					columnClasses="aon-width-150, aon-editDataTable-numberColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-textColumn">

					<aon:rowSelector action="autonomo_form"
						actionListener="#{autonomo.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.cdg}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_personas_otrperc_per}" />
						</f:facet>
						<aon:outputText value="#{to.persona.cdg}" />
					</aon:column>
					
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_clientes_nom}" />
						</f:facet>
						<aon:outputText value="#{to.persona.nombre} #{to.persona.descripcion} #{to.persona.apellido2}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_autonomos_nuss}" />
						</f:facet>
						<aon:outputText value="#{to.persona.numss}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_autonomos_tipoautonomo}" />
						</f:facet>
						<aon:outputText value="#{to.tipautonomo}" />
					</aon:column>






				</aon:dataTable>

				<aon:dataScroller2 for="otrpercData" showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
