<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="geotreeParentList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="toolbarTitle" value="#{geozoneBundle.geozone_module}" />
				<ui:param name="controller" value="#{geotreeParent}" />
			</ui:include>

			<aon:div id="geotreeParentData" styleClass="aon-scroll-area">
				<aon:dataTable id="geotreeParentDataList" value="#{geotreeParent.model}"
					rows="20" var="to" rendered="#{geotreeParent.model.rowCount > 0}">

					<aon:rowSelector action="geotreeParent_form" 
						actionListener="#{geotreeParent.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{geozoneBundle.geozone_country}" />
						</f:facet>
						<aon:outputText value="#{to.child.name}" />
					</aon:column>
				</aon:dataTable>
				<aon:dataScroller2 for="geotreeParentDataList"
					showNote="true" />
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
