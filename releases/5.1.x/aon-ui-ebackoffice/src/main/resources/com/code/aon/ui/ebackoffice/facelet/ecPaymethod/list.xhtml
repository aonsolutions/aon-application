<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="itemList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{configBundle.config_paymethod_module}"  />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="controller" value="#{pmethod}" />
			</ui:include>

			<aon:div id="itemData" styleClass="aon-scroll-area">
				<aon:dataTable id="paymethodDataList" value="#{pmethod.model}"
					rows="20" var="to" rendered="#{pmethod.model.rowCount > 0}">

					<aon:rowSelector action="pmethod_form" 
						actionListener="#{pmethod.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_type}" />
						</f:facet>
						<aon:outputText value="#{to.type}" />
					</aon:column>

					
				</aon:dataTable>
				<aon:dataScroller2 for="paymethodDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
