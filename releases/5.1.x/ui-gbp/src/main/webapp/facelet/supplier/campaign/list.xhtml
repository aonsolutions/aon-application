<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<h:dataTable id="supplierCampaignDataTable" value="#{supplierCampaign.model}" var="to"
		rows="20" styleClass="dr-table rich-table aon-editDataTable"
		headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
		footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
		rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
		cellpadding="0" cellspacing="0"
		columnClasses="dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_campaign_code}" />
			</f:facet>
			<aon:outputText value="#{to.campaign.code}"/>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_campaign_name}" />
			</f:facet>
			<aon:outputText value="#{to.campaign.name}"/>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_campaign_start_date}" />
			</f:facet>
			<aon:outputText value="#{to.campaign.startDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_campaign_status}" />
			</f:facet>
			<aon:outputText value="#{to.campaign.status}"/>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_campaign_budget}" />
			</f:facet>
			<aon:outputText value="#{to.campaign.budget}">
				<f:convertNumber pattern="#,##0.00" />			
			</aon:outputText>
		</aon:column>

	</h:dataTable>

	<aon:dataScroller dataTable="supplierCampaignDataTable" model="#{supplierCampaign.model}" />

</ui:composition>

</body>
</html>
