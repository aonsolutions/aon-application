<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:div id="proFormaBankDefault">
		<aon:div styleClass="aon-toolbar">
			<h:commandButton id="default_percents" value="#{appBundle.gbp_assign_default_percents}"
				styleClass="aon-finding-toolbar-item aon-icon-signature"
				reRender="proFormaSignatureDataTable"
				actionListener="#{proFormaBank.onDefault}"/>
		</aon:div>
	</aon:div>	

	<h:dataTable id="proFormaBankDataTable" value="#{proFormaBank.model}" var="to"
		rows="20" styleClass="dr-table rich-table aon-editDataTable"
		headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
		footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
		rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
		cellpadding="0" cellspacing="0"
		columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="&#160;" rendered="#{to==proFormaBank.to}" />
			<aon:commandButton rendered="#{to!=proFormaBank.to}"
				styleClass="aon-editDataTable-button aon-icon-rowSelector"
				actionListener="#{proFormaBank.onSelect}" value="" immediate="true"
				reRender="proFormaBankDataTable">
			</aon:commandButton>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton id="reset"
						title="[#{bundle.aon_reset}]"
						styleClass="aon-editDataTable-button aon-icon-reset" value=""
						immediate="true" reRender="proFormaBankDataTable"
						rendered="#{!proFormaBank.new}" actionListener="#{proFormaBank.onReset}"
						accesskey="#{bundle.aon_key_new_line}">
					</aon:commandButton>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_bank_percent_bank}" />
			</f:facet>
			<aon:outputText value="#{to.bank.name}" rendered="#{to!=proFormaBank.to}" />
			<aon:selectOneMenu value="#{proFormaBank.to.bank.id}"
				rendered="#{to==proFormaBank.to}">
				<f:selectItems value="#{GBPCollections.banks}" />
			</aon:selectOneMenu>
			<f:facet name="footer">
				<aon:div>
					<aon:selectOneMenu value="#{proFormaBank.to.bank.id}"
						rendered="#{proFormaBank.new}">
						<f:selectItems value="#{GBPCollections.banks}" />
					</aon:selectOneMenu>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_bank_percent_distributionPercent}" />
			</f:facet>
			<aon:outputText value="#{to.percent}" rendered="#{to!=proFormaBank.to}" />
			<aon:inputText value="#{to.percent}"
				rendered="#{to==proFormaBank.to}" size="40" maxlength="64" />
			<f:facet name="footer">
				<aon:div>
					<aon:inputText value="#{proFormaBank.to.percent}"
						rendered="#{proFormaBank.new}" size="40" maxlength="64" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<f:verbatim rendered="#{to!=proFormaBank.to}">&#160;</f:verbatim>
			<aon:div rendered="#{to==proFormaBank.to}">
				<h:commandButton id="lineAccept" title="[#{bundle.aon_accept}]"
					styleClass="aon-editDataTable-button aon-icon-accept"
					reRender="proFormaBankDataTable"
					actionListener="#{proFormaBank.onAccept}" />
				<aon:commandButton id="lineCancel" title="[#{bundle.aon_cancel}]"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					reRender="proFormaBankDataTable" immediate="true"
					actionListener="#{proFormaBank.onCancel}" />
				<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
					styleClass="aon-editDataTable-button aon-icon-delete"
					reRender="proFormaBankDataTable" immediate="true"
					actionListener="#{proFormaBank.onRemove}" />
			</aon:div>
			<f:facet name="footer">
				<aon:div rendered="#{proFormaBank.new}">
					<f:verbatim rendered="#{!proFormaBank.new}">&#160;</f:verbatim>
					<h:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
						styleClass="aon-editDataTable-button aon-icon-accept"
						reRender="proFormaBankDataTable"
						actionListener="#{proFormaBank.onAccept}" />
					<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						reRender="proFormaBankDataTable" immediate="true"
						actionListener="#{proFormaBank.onCancel}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</h:dataTable>

	<aon:dataScroller dataTable="proFormaBankDataTable" model="#{proFormaBank.model}" />

</ui:composition>

</body>
</html>
