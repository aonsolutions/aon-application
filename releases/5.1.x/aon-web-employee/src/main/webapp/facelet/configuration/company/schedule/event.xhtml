<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/formHead.xhtml" />
		<t:stylesheet path="/jscalendar-1.0/calendar-system.css" />
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/lang/calendar-es.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar-setup.js">
			// nothing
		</script>
		<script type='text/javascript' src="${facesContext.externalContext.requestContextPath}/js/Event.js">
			// nothing
		</script>
	</ui:define>

	<ui:define name="content">

		<h:form id="companyForm">
			<t:div styleClass="aon-content-menu-aux" >
				<h:outputText value="#{company.to.name} #{company.to.surname} #{company.to.document}" />
			</t:div>
			<t:div styleClass="aon-content-menu" rendered="#{!company.new}" id="aon-content-menu" forceId="#{true}">
				<t:panelGrid columns="2" cellpadding="0" cellspacing="0" border="0">
					<t:panelGroup>
							<t:commandLink id="company_data" forceId="#{true}" value="#{rBundle.aon_company_data}" 
								action="company" 
								styleClass="aon-content-menu-item" />
					</t:panelGroup>
					<t:panelGroup>
							<t:commandLink id="company_schedule" forceId="#{true}" value="#{rBundle.aon_calendar_data}"
								actionListener="#{company.onSchedule}" action="#{planner.calendarOutcome}" 
								styleClass="aon-content-menu-item-active" />
					</t:panelGroup>	
				</t:panelGrid>
			</t:div>

			<ui:include src="/facelet/schedule/action/event.xhtml" />

		</h:form>
 	</ui:define>

</ui:composition>

</body>
</html>
