<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

		<t:panelGrid columns="2" cellpadding="0" cellspacing="0"
			styleClass="aon-form-table" style="width:100%"
			columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

			<t:panelGroup>
				<h:outputText value="#{appBundle.calculator_unfair_dismissal_compensation}" styleClass="aon-form-input-text-label" />
			</t:panelGroup>
			<t:panelGroup style="width:100%; text-align:right">
				<h:outputText value="#{calculator.dismissalExpenses.unfairDismissalCompensation}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</t:panelGroup>

			<t:panelGroup>
				<h:outputText value="#{appBundle.calculator_layoff_as_unfair_dismissal_compensation}" styleClass="aon-form-input-text-label" />
			</t:panelGroup>
			<t:panelGroup style="width:100%; text-align:right">
				<h:outputText value="#{calculator.dismissalExpenses.layoffAsUnfairDismissalCompensation}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</t:panelGroup>

			<t:panelGroup>
				<h:outputText value="#{appBundle.calculator_layoff_compensation}" styleClass="aon-form-input-text-label" />
			</t:panelGroup>
			<t:panelGroup style="width:100%; text-align:right">
				<h:outputText value="#{calculator.dismissalExpenses.layoffCompensation}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</t:panelGroup>

 		</t:panelGrid>

</ui:composition>

</body>
</html>
