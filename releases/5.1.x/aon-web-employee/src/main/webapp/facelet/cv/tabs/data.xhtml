<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition >
	
		<t:outputLabel for="Curriculum_birthPlace"
			styleClass="aon-form-input-text-label"
			value="#{appBundle.curriculum_birthplace}" />
		<t:selectOneMenu id="Curriculum_birthPlace" forceId="#{true}"
						styleClass="aon-form-selectOneMenu-field"
						value="#{curriculum.to.birthPlace}">
			<f:selectItems value="#{CVitaeCollections.countries}" />
		</t:selectOneMenu>

		<t:outputLabel for="Curriculum_birthDate"
			styleClass="aon-form-input-text-label"
			value="#{appBundle.curriculum_birthdate}" />
		<h:panelGroup>
		<t:inputText id="Curriculum_birthDate" forceId="#{true}"
				styleClass="aon-form-input-text" maxlength="12"
				value="#{curriculum.to.birthDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</t:inputText>
		<t:commandButton styleClass="aon-form-calendar-button"
						id="Curriculum_birthDate_button" forceId="#{true}" 
						value=""
						onclick="displayCalendar(this.form.Curriculum_birthDate,'dd/mm/yyyy',this);return false;"
						immediate="true" />
		</h:panelGroup>

        <h:outputLabel for="Curriculum_gender" 
			styleClass="aon-form-input-text-label"
			value="#{rBundle.aon_gender}"  />
        <h:selectOneMenu id="Curriculum_gender" forceId="#{true}"
						styleClass="aon-form-selectOneMenu-field"
						value="#{curriculum.to.gender}">
			<f:selectItems value="#{CVitaeCollections.genders}" />
        </h:selectOneMenu>


		<t:outputLabel for="Curriculum_residencePlace"
			styleClass="aon-form-input-text-label"
			value="#{appBundle.curriculum_residenceplace}" />
		<t:selectOneMenu id="Curriculum_residencePlace" forceId="#{true}"
						styleClass="aon-form-selectOneMenu-field"
						value="#{curriculum.to.residencePlace}">
			<f:selectItems value="#{CVitaeCollections.countries}" />
		</t:selectOneMenu>

		<t:outputLabel for="Curriculum_geoZone_id"
			styleClass="aon-form-input-text-label"
			value="#{appBundle.curriculum_geozone}" />
		<t:selectOneMenu id="Curriculum_geoZone_id" forceId="#{true}"
			styleClass="aon-form-selectOneMenu-field"
			value="#{curriculum.to.geoZone.id}">
			<f:selectItems value="#{employeeCollections.geoZones}" />
		</t:selectOneMenu>

		<t:outputLabel for="Curriculum_city"
			styleClass="aon-form-input-text-label"
			value="#{appBundle.curriculum_city}" />
		<t:inputText id="Curriculum_city"
			styleClass="aon-form-input-text" forceId="#{true}"
			value="#{curriculum.to.city}" size="32">
			<f:validateLength minimum="1" maximum="32" />
		</t:inputText>

		<t:outputLabel for="Curriculum_zip"
			styleClass="aon-form-input-text-label"
			value="#{appBundle.curriculum_zip}" />
		<t:inputText id="Curriculum_zip"
			styleClass="aon-form-input-text" forceId="#{true}"
			value="#{curriculum.to.zip}" size="10">
			<f:validateLength minimum="1" maximum="10" />
		</t:inputText>
		
		<t:outputLabel for="Curriculum_address"
			styleClass="aon-form-input-text-label"
			value="#{appBundle.curriculum_address}" />
		<t:inputText id="Curriculum_address"
			styleClass="aon-form-input-text" forceId="#{true}"
			value="#{curriculum.to.address}" size="64">
			<f:validateLength minimum="1" maximum="64" />
		</t:inputText>

		<t:outputLabel for="Curriculum_phone"
			styleClass="aon-form-input-text-label"
			value="#{appBundle.curriculum_phone}" />
		<t:inputText id="Curriculum_phone"
			styleClass="aon-form-input-text" forceId="#{true}"
			value="#{curriculum.to.phone}" size="16">
			<f:validateLength minimum="1" maximum="16" />
		</t:inputText>
		
		<t:outputLabel for="Curriculum_driverLicenses"
			styleClass="aon-form-input-text-label"
			value="#{appBundle.curriculum_driver_licenses}" />
		<t:selectManyCheckbox id="Curriculum_driverLicenses"
			value="#{curriculum.driverLicenses}" 
			layout="pageDirection" layoutWidth="5" >
			<f:selectItems value="#{CVitaeCollections.driverLicenses}" />
		</t:selectManyCheckbox>	
		
		<t:outputLabel for="Curriculum_driverLiceseDate"
			styleClass="aon-form-input-text-label"
			value="#{appBundle.curriculum_driver_license_date}" />
		<h:panelGroup>
			<t:inputText id="Curriculum_driverLiceseDate" forceId="#{true}"
					styleClass="aon-form-input-text" maxlength="12"
					value="#{curriculum.to.driverLiceseDate}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</t:inputText>
			<t:commandButton styleClass="aon-form-calendar-button"
							id="Curriculum_driverLiceseDate_button" forceId="#{true}" 
							value=""
							onclick="displayCalendar(this.form.Curriculum_driverLiceseDate,'dd/mm/yyyy',this);return false;"
							immediate="true" />
		</h:panelGroup>

</ui:composition>

</body>
</html>
