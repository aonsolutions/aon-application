<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="content">

		<h:form id="employeeForm">

			<t:div id="aon-content-subtitle" forceId="#{true}" styleClass="aon-content-menu-aux" >
				<h:outputText value="#{calendars.name}" />
			</t:div>
			<t:div styleClass="aon-content-menu" id="aon-content-menu" forceId="#{true}">
				<t:panelGrid columns="2" cellpadding="0" cellspacing="0" border="0">
					<t:panelGroup>
						<t:commandLink id="calendars_form" value="Arbol" 
							forceId="#{true}" action="calendars_form"
							styleClass="aon-content-menu-item"	/>					
					</t:panelGroup>	
					<t:panelGroup>
						<t:commandLink id="calendar_data" forceId="#{true}" value="#{rBundle.aon_calendar_data}"
							actionListener="#{calendars.onSchedule}" action="calendars_calendar" 
							styleClass="aon-content-menu-item-active" />
					</t:panelGroup>
				</t:panelGrid>
			</t:div>

			<ui:include src="/facelet/schedule/search/list.xhtml" />

		</h:form>
 	</ui:define>
			
</ui:composition>
</body>
</html>
