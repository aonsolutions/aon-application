<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">

<body>
<ui:composition>

	<t:div styleClass="aon-content-subtitle-calendar-actions">
		<t:div styleClass="aon-content-subtitle-internal-calendar-actions" style="padding:5px 0 4px 1em;">
			<h:outputText value="#{appBundle.aon_workplace_add_child} #{appBundle.aon_employee}" 
				rendered="#{calendars.workActivityNode}"/>
			<h:outputText value="#{bundle.aon_update} #{appBundle.aon_employee}" 
				rendered="#{calendars.employeeNode}"/>
	
			<h:outputText value="#{appBundle.aon_workplace_add_child} " 
				rendered="#{calendars.workPlaceNode}" />
			<t:selectOneMenu id="WorkPlace_child" forceId="#{true}" 
					value="#{calendars.workPlaceSelectedChild}" 
					onchange="loadWorkPlaceChild(this);" 
					rendered="#{calendars.workPlaceNode}">
	            <f:selectItem itemValue="workactivity" itemLabel="#{appBundle.aon_workactivity}" />
	            <f:selectItem itemValue="employee" itemLabel="#{appBundle.aon_employee}" />
			</t:selectOneMenu>
		</t:div>
	</t:div>
	<t:div styleClass="aon-form-group-body">
		<t:div id="WorkPlace_workactivity" forceId="#{true}" rendered="#{calendars.workPlaceNode}" >
			<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
					styleClass="aon-form-table" style="width:100%;"
					columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
				<t:outputLabel for="WorkActivity_description"
					styleClass="aon-form-input-text-label"
					value="#{rBundle.aon_description}" />
				<t:inputText id="WorkActivity_description"
						styleClass="aon-form-input-text" forceId="#{true}"
						value="#{workactivity.to.description}" size="45">
					<f:validateLength minimum="1" maximum="45" />
				</t:inputText>
			</h:panelGrid>
		</t:div>
	
		<t:div id="WorkPlace_employee" forceId="#{true}" >
			<ui:include src="/facelet/employee/data.xhtml" />
		</t:div>
	</t:div>

</ui:composition>
</body>
</html>
