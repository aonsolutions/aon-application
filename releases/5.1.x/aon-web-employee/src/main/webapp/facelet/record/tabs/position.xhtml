<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition >

	<t:dataTable id="PositionDataList" var="to" value="#{position.model}" 
		styleClass="aon-edit-table" style="width:100%;"
		headerClass="aon-edit-table-header"
		footerClass="aon-edit-table-footer" rowIndexVar="rowIndex"
		rows="20"
		rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
		rowOnMouseOver="selectRow( this )"
		rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
		cellpadding="0" cellspacing="0"
		columnClasses="aon-edit-table-body-icon,
					   	aon-edit-table-body aon-edit-table-body-string,
					   	aon-edit-table-body aon-edit-table-body-string,
						aon-edit-table-body aon-edit-table-body-string,
					   	aon-edit-table-body aon-edit-table-body-string,
						aon-edit-table-body aon-edit-table-body-string,
					   	aon-edit-table-body aon-edit-table-body-buttons">
					   
		<h:column>
			<f:facet name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			<t:commandLink
				styleClass="aon-table-row-selected"
				rendered="#{to!=position.to}"
				actionListener="#{position.onSelect}" />
			<f:facet name="footer">
				<t:div>
					<t:div rendered="#{!position.new}">
						<t:commandButton value=""
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
							actionListener="#{position.onReset}"
							immediate="#{true}" />
					</t:div>
				</t:div>
			</f:facet>
		</h:column>
					   
		<h:column>
			<f:facet name="header">
				<t:outputText value="#{appBundle.aon_start_date}" />
			</f:facet>
			<t:outputText value="#{to.startingDate}" rendered="#{to!=position.to}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</t:outputText>
			<t:inputCalendar size="8" id="Position_startingDate-Edit"
					value="#{position.to.startingDate}"
					monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
					currentDayCellClass="currentDayCell"
					renderAsPopup="true" rendered="#{to==position.to}"
					popupButtonStyleClass="aon-form-calendar-button"
					styleClass="aon-form-input-text"
					popupTodayString="#{bundle.aon_popup_today}"
					popupWeekString="#{bundle.aon_popup_week}" />	
			<f:facet name="footer">
				<t:inputCalendar size="8" id="Position_startingDate-New"
					value="#{position.to.startingDate}"
					monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
					currentDayCellClass="currentDayCell"
					renderAsPopup="true" rendered="#{position.new}"
					popupButtonStyleClass="aon-form-calendar-button"
					styleClass="aon-form-input-text"
					popupTodayString="#{bundle.aon_popup_today}"
					popupWeekString="#{bundle.aon_popup_week}" />	
			</f:facet>
		</h:column>
		
		<h:column>
			<f:facet name="header">
				<t:outputText value="#{appBundle.aon_end_date}" />
			</f:facet>
			<t:outputText value="#{to.endingDate}" rendered="#{to!=position.to}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</t:outputText>
			<t:inputCalendar size="8" id="Position_endingDate-Edit"
					value="#{position.to.endingDate}"
					monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
					currentDayCellClass="currentDayCell"
					renderAsPopup="true" rendered="#{to==position.to}"
					popupButtonStyleClass="aon-form-calendar-button"
					styleClass="aon-form-input-text"
					popupTodayString="#{bundle.aon_popup_today}"
					popupWeekString="#{bundle.aon_popup_week}" />	
			<f:facet name="footer">
				<t:inputCalendar size="8" id="Position_endingDate-New"
					value="#{position.to.endingDate}"
					monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
					currentDayCellClass="currentDayCell"
					renderAsPopup="true" rendered="#{position.new}"
					popupButtonStyleClass="aon-form-calendar-button"
					styleClass="aon-form-input-text"
					popupTodayString="#{bundle.aon_popup_today}"
					popupWeekString="#{bundle.aon_popup_week}" />	
			</f:facet>
		</h:column>

		<h:column>
			<f:facet name="header">
				<t:outputText value="#{appBundle.record_workplace}" />
			</f:facet>
			<t:outputText value="#{to.workPlace.description}" rendered="#{to!=position.to}" />
			<t:selectOneMenu id="Position_workPlace_id-Edit" forceId="#{true}"
							styleClass="aon-form-selectOneMenu-field"
							value="#{position.to.workPlace.id}"
							rendered="#{to==position.to}"
							valueChangeListener="#{position.workingPlaceChanged}" 
							onchange="this.form.submit();" >
				<f:selectItems value="#{workplace.all}" />
			</t:selectOneMenu>	
			<f:facet name="footer">
				<t:selectOneMenu id="Position_workPlace_id-New" forceId="#{true}"
								styleClass="aon-form-selectOneMenu-field"
								value="#{position.to.workPlace.id}"
								rendered="#{position.new}"
								valueChangeListener="#{position.workingPlaceChanged}" 
								onchange="this.form.submit();" >
					<f:selectItems value="#{workplace.all}" />
				</t:selectOneMenu>	
			</f:facet>
		</h:column>
		
		<h:column>
			<f:facet name="header">
				<t:outputText value="#{appBundle.record_workactivity}" />
			</f:facet>
			<t:outputText value="#{to.workActivity.description}" rendered="#{to!=position.to}" />
			<t:selectOneMenu id="Position_workActivity_id-Edit" forceId="#{true}"
							styleClass="aon-form-selectOneMenu-field"
							value="#{position.to.workActivity.id}"
							rendered="#{to==position.to}" >
				<f:selectItems value="#{position.workActivities}" />
			</t:selectOneMenu>	
			<f:facet name="footer">
				<t:selectOneMenu id="Position_workActivity_id-New" forceId="#{true}"
								styleClass="aon-form-selectOneMenu-field"
								value="#{position.to.workActivity.id}"
								rendered="#{position.new}" >
					<f:selectItems value="#{position.workActivities}" />
				</t:selectOneMenu>	
			</f:facet>
		</h:column>

		<h:column>
			<f:facet name="header">
				<t:outputText value="#{rBundle.aon_description}" />
			</f:facet>
			<t:outputText value="#{to.description}" rendered="#{to!=position.to}" />
			<t:inputText styleClass="aon-form-input-text"
				rendered="#{to==position.to}" id="Position_description-Edit"
				forceId="#{true}" value="#{position.to.description}" size="32"
				maxlength="32" />
			<f:facet name="footer">
				<t:inputText styleClass="aon-form-input-text"
					rendered="#{position.new}" id="Position_description-New"
					forceId="#{true}" value="#{position.to.description}" size="32"
					maxlength="32" />
			</f:facet>
		</h:column>

		<t:column width="60">
			<f:facet name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			<t:div rendered="#{to==position.to}">
				<t:commandButton title="#{bundle.aon_save}"
					styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save" value=""
					actionListener="#{position.onAccept}" />
				<t:commandButton title="#{bundle.aon_cancel}"
					styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel" value=""
					onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
					actionListener="#{position.onCancel}" immediate="true" />
				<t:commandButton title="#{bundle.aon_remove}"
					styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete" value=""
					actionListener="#{position.onRemove}" immediate="true"
					onclick="return (confirm('#{bundle.aon_remove_confirm}'));" />
			</t:div>
			<f:facet name="footer">
				<t:div>
					<t:div rendered="#{position.new}">
						<t:commandButton title="#{bundle.aon_save}"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save" value=""
							actionListener="#{position.onAccept}" />
						<t:commandButton title="#{bundle.aon_cancel}"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel" value=""
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
							actionListener="#{position.onCancel}" immediate="true" />
					</t:div>
				</t:div>
			</f:facet>
		</t:column>
		
	</t:dataTable>

</ui:composition>

</body>
</html>
