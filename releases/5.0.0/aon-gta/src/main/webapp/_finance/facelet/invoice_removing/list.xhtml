<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">

		<h:form id="invoiceRemovingList">

			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<t:commandButton id="search" value="#{bundle.aon_search}"
						action="invoice_remover_search"
						actionListener="#{invoiceRemover.onEditSearch}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'" 
						accesskey="#{bundle.aon_key_search}"/>
					<t:commandButton id="remove_selected" value="#{financeBundle.aon_remove_selected}"
						actionListener="#{invoiceRemover.onRemoveSelected}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'" 
						accesskey="#{bundle.aon_key_search}"/>
				</t:div>
				</t:div>
			</t:div>

			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<t:div styleClass="aon-table-hack">

						<t:div>
							<t:commandButton title="#{financeBundle.aon_select_all}"
								styleClass="aon-form-button-plus"
								onclick="viewDialog.show();"
								value="#{financeBundle.aon_select_all}"
								actionListener="#{invoiceRemover.checkAll}"/>
							<t:commandButton title="#{financeBundle.aon_select_none}"
								styleClass="aon-form-button-minus"
								onclick="viewDialog.show();"
								value="#{financeBundle.aon_select_none}"
								actionListener="#{invoiceRemover.checkNone}"/>
						</t:div>

						<t:dataTable id="invoiceRemovingData" cellpadding="0" cellspacing="0"
							var="to" value="#{invoiceRemover.model}" rows="20"
							styleClass="aon-table" headerClass="aon-table-header"
							rowClasses="aon-table-row-odd,aon-table-row-even"
							columnClasses="aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-number">

							<h:column>
								<f:facet name="header">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
								<t:selectBooleanCheckbox id="Included_Row_checked"
									value="#{invoiceRemover.rowChecked}"
									rendered="#{invoiceRemover.modelToRemovable}"
									valueChangeListener="#{invoiceRemover.rowSelected}"
									styleClass="aon-form-selectBooleanCheckbox-field" />	
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{financeBundle.aon_series_number}" />
								</f:facet>
								<h:outputText value="#{to.series} / #{to.number}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{customerBundle.customer_customer}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText
									value="#{to.registryName}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{financeBundle.aon_date}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.issueDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</h:outputText>
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{financeBundle.aon_status}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.status}" />
							</h:column>

						</t:dataTable>
					</t:div>
					
					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="invoiceRemovingData" />
						<ui:param name="model" value="#{invoiceRemover.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>
					
				</t:div>
			</t:div>

			<s:modalDialog
		       dialogId="viewDialog"
		       dialogVar="viewDialog"
		       closeButton="false">
		       <t:div styleClass="aon-timer">		       		
		       		<h:graphicImage value="/css/images/content/aon-timer.gif" />
		       		<t:div styleClass="aon-timer-title" >
		       			<t:outputText value="#{appBundle.aon_in_progress}" /> 
		       		</t:div>
  			   </t:div>
			</s:modalDialog>

		</h:form>

	</ui:define>

</ui:composition>

</body>
</html>
