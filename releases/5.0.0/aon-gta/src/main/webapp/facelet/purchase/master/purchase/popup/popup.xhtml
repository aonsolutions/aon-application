<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:jstl="http://java.sun.com/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div id="popup" forceId="#{true}" styleClass="aon-popup-window"
		style="position: absolute;left: 290px;_left:110px; top: 230px;">
		<t:div styleClass="aon-popup-window-title">
			<t:commandButton id="popupClose" value=" "
				onclick="document.getElementById('Item_product_code-New').disabled = true;"
				actionListener="#{purchaseSales.onClose}"
				styleClass="aon-popup-window-close"
				accesskey="#{bundle.aon_key_close}" />

			<t:outputLabel value="#{salesBundle.aon_sales}" />

		</t:div>
		<t:div styleClass="aon-popup-window-body">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:commandButton id="popupUpdate" value="#{bundle.aon_accept}"
						actionListener="#{purchaseSales.onSave}"
						onclick="document.getElementById('Item_product_code-New').disabled = true;return validate('false');"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
						accesskey="#{bundle.aon_key_accept}" />
				</t:div>
			</t:div>
			<t:div styleClass="aon-popup-window-scroll-area">
				<h:panelGrid columns="2" styleClass="aon-form-table"
					columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
					
					<h:outputLabel for="SupportOrder_id"
						styleClass="aon-form-input-text-label"
						value="#{tasBundle.supportOrder_order}" />
					<t:div>	
						<t:selectOneMenu id="SupportOrder_id" forceId="#{true}"
							styleClass="aon-form-selectOneMenu-field"
							value="#{purchaseSales.supportOrderId}"
							onchange="document.getElementById('Item_product_code-New').disabled = true; submit();"
							valueChangeListener="#{purchaseSales.supportOrderChanged}">
							<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
							<f:selectItems value="#{TASCollections.pendingOrActiveSupportOrders}" />
						</t:selectOneMenu>
						<t:outputText id="SupportOrder_required" forceId="#{true}"
							value="#{tasBundle.aon_supportorder_required}"
							style="display:none;color:#cc3333" />
					</t:div>	
					
					<t:outputLabel for="Customer_scope_id"
						rendered="#{purchaseSales.scopeNeeded}"
						styleClass="aon-form-selectOneMenu-label"
						value="#{configBundle.scope_scope}" />
					<h:selectOneMenu id="Customer_scope_id"
						rendered="#{purchaseSales.scopeNeeded}"
						styleClass="aon-form-selectOneMenu-field"
						value="#{delivery.scopeId}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</h:selectOneMenu>

					<t:outputLabel for="Delivery_series"
						styleClass="aon-form-input-text-label"
						value="#{purchaseBundle.aon_inc_num}" />
					<t:div>
						<t:selectOneMenu id="Delivery_series"
							value="#{purchaseSales.delivery.series}"
							disabled="#{purchaseSales.delivery.id != null}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItem itemValue="" itemLabel=" " />
							<f:selectItems value="#{configCollections.series}" />
						</t:selectOneMenu>
						<t:inputText id="Delivery_number"
							disabled="#{purchaseSales.delivery.id != null}"
							styleClass="aon-form-input-text" forceId="#{true}"
							value="#{purchaseSales.delivery.number}" />
						<t:outputText id="Number_required" forceId="#{true}"
							value="#{purchaseBundle.aon_income_number_required}"
							style="display:none;color:#cc3333" />
					</t:div>

					<t:outputLabel for="Delivery_issueTime"
						styleClass="aon-form-input-text-label"
						value="#{purchaseBundle.aon_date}" />
					<t:div styleClass="aon-form-nowrap">
						<t:inputText styleClass="aon-form-input-text"
							id="Delivery_issueTime" forceId="#{true}" size="10"
							maxlength="12" disabled="#{purchaseSales.delivery.id != null}"
							value="#{purchaseSales.delivery.issueTime}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</t:inputText>
						<t:commandButton styleClass="aon-form-calendar-button"
							id="Delivery_issueTime_button" forceId="#{true}" value=""
							immediate="true" rendered="#{purchaseSales.delivery.id == null}"/>
						<t:outputText id="Date_required" forceId="#{true}"
							value="#{purchaseBundle.aon_income_date_required}"
							style="display:none;color:#cc3333" />
						<script type="text/javascript">
						  Calendar.setup( {
							inputField  : "Delivery_issueTime", button : "Delivery_issueTime_button",
							ifFormat    : "%d/%m/%Y" } );
						</script>
					</t:div>

					<t:outputLabel for="DeliveryDetail_warehouse_id"
						styleClass="aon-form-selectOneMenu-label"
						value="#{warehouseBundle.aon_warehouse}" />
					<t:selectOneMenu id="DeliveryDetail_warehouse_id"
						styleClass="aon-form-selectOneMenu-field" forceId="#{true}"
						value="#{purchaseSales.deliveryDetail.warehouse.id}">
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</t:selectOneMenu>

					<t:outputLabel for="Item_id-Popup"
						styleClass="aon-form-input-text-label"
						value="#{productBundle.item_item}" />
					<t:div styleClass="aon-form-nowrap">
						<t:inputHidden id="Item_id-Popup" forceId="#{true}"
							value="#{purchaseSales.deliveryDetail.item.id}" />
						<t:inputHidden id="Item_product_id-Popup" forceId="#{true}"
							value="#{purchaseSales.deliveryDetail.item.product.id}" />
						<t:inputHidden id="Item_purchase_price-Popup" forceId="#{true}"
							value="#{purchaseSales.deliveryDetail.item.purchasePrice}" />
						<t:inputText size="10" id="Item_product_code-Popup"
							forceId="#{true}" value="#{purchaseSales.deliveryDetail.item.product.code}"
							styleClass="aon-form-input-text" onblur="toUpperCase(this);"
							onchange="return findItemLookup(event,'#{facesContext.externalContext.request.contextPath}','com.code.aon.product.Item','Item_id-Popup,Item_product_code-Popup,Item_full_name-Popup,Item_price-Popup,Item_product_category_id-Popup,Item_product_id-Popup,Item_purchase_price-Popup');" />
						<h:commandButton id="findPopup_Item"
							onclick="selectWindow(this, 'placeList', '#{itemSearch.encodedPagePath}', 'Item_id-Popup,Item_product_code-Popup,Item_full_name-Popup,Item_price-Popup,Item_product_category_id-Popup,Item_product_id-Popup,Item_purchase_price-Popup'); return false;"
							action="showPlace" value="" immediate="true"
							styleClass="aon-form-lookup-button"/>
						<h:commandButton id="addPopup_Item"
							onclick="selectWindow(this, 'placeList', '#{itemAdd.encodedPagePath}', 'Item_id-Popup,Item_product_code-Popup,Item_full_name-Popup,Item_price-Popup,Item_product_category_id-Popup,Item_product_id-Popup,Item_purchase_price-Popup'); return false;"
							action="showPlace" value="" immediate="true"
							styleClass="aon-form-new-button" />
						<t:inputText id="Item_full_name-Popup" size="36"
							forceId="#{true}" styleClass="aon-form-input-text"
							value="#{purchaseSales.deliveryDetail.description}" />
						<t:outputText id="Product_code_required" forceId="#{true}"
							value="#{productBundle.aon_product_code_required}"
							style="display:none;color:#cc3333" />
						<t:outputText id="Product_name_required" forceId="#{true}"
							value="#{productBundle.aon_product_name_required}"
							style="display:none;color:#cc3333" />
					</t:div>

					<t:outputLabel for="Item_product_category_id-Popup"
						styleClass="aon-form-input-text-label"
						value="#{productBundle.item_category}" />
					<t:div styleClass="aon-form-nowrap">
						<t:selectOneMenu id="Item_product_category_id-Popup"
							forceId="#{true}" styleClass="aon-form-selectOneMenu-field"
							value="#{purchaseSales.deliveryDetail.item.product.category.id}">
							<f:selectItems value="#{productCollections.categories}" />
						</t:selectOneMenu>
						<t:outputText id="Item_product_category_required"
							forceId="#{true}"
							value="#{productBundle.aon_category_required}"
							style="display:none;color:#cc3333" />
					</t:div>

					<t:outputLabel for="Item_price-Popup"
						styleClass="aon-form-input-text-label"
						value="#{warehouseBundle.aon_price}" />
					<t:div styleClass="aon-form-nowrap">
						<t:inputText id="Item_price-Popup"
							styleClass="aon-form-input-text"
							forceId="#{true}" size="20" maxlength="20"
							value="#{purchaseSales.deliveryDetail.price}" />
						<t:outputText id="Item_price_required"
							forceId="#{true}"
							value="#{productBundle.aon_price_required}"
							style="display:none;color:#cc3333" />
					</t:div>

					<t:outputLabel for="Item_quantity-Popup"
						styleClass="aon-form-input-text-label"
						value="#{warehouseBundle.aon_quantity}" />
					<t:div styleClass="aon-form-nowrap">
						<t:inputText id="Item_quantity-Popup"
							styleClass="aon-form-input-text"
							forceId="#{true}" size="20" maxlength="20"
							value="#{purchaseSales.deliveryDetail.quantity}" />
						<t:outputText id="Item_quantity_required"
							forceId="#{true}"
							value="#{productBundle.aon_quantity_required}"
							style="display:none;color:#cc3333" />
					</t:div>
				</h:panelGrid>
			</t:div>
		</t:div>
	</t:div>
	<script>
		function hidePopup(){
			document.getElementById( "DeliveryDetail_warehouse_id" ).disabled = false;
			document.getElementById( "popup" ).style.display='none';
			document.getElementById( "SupportOrder_required" ).style.display = 'none';
			document.getElementById( "Number_required" ).style.display = 'none';
			document.getElementById( "Date_required" ).style.display = 'none';
			document.getElementById( "Product_code_required" ).style.display = 'none';
			document.getElementById( "Product_name_required" ).style.display = 'none';
			document.getElementById( "Item_product_category_required" ).style.display = 'none';
			document.getElementById( "Item_price_required" ).style.display = 'none';
			document.getElementById( "Item_quantity_required" ).style.display = 'none';
		}
		function validate(isNew){ 
			if(document.getElementById( "SupportOrder_id" ).value == ""){
				document.getElementById( "SupportOrder_required" ).style.display = 'block';
				document.getElementById( "Number_required" ).style.display = 'none';
				document.getElementById( "Date_required" ).style.display = 'none';
				document.getElementById( "Product_code_required" ).style.display = 'none';
				document.getElementById( "Product_name_required" ).style.display = 'none';
				document.getElementById( "Item_product_category_required" ).style.display = 'none';
				document.getElementById( "Item_price_required" ).style.display = 'none';
				document.getElementById( "Item_quantity_required" ).style.display = 'none';
				document.getElementById( "Delivery_number" ).focus();
				return false;
			}
			if(document.getElementById( "Delivery_number" ).value == ""){
				document.getElementById( "Number_required" ).style.display = 'block';
				document.getElementById( "SupportOrder_required" ).style.display = 'none';
				document.getElementById( "Date_required" ).style.display = 'none';
				document.getElementById( "Product_code_required" ).style.display = 'none';
				document.getElementById( "Product_name_required" ).style.display = 'none';
				document.getElementById( "Item_product_category_required" ).style.display = 'none';
				document.getElementById( "Item_price_required" ).style.display = 'none';
				document.getElementById( "Item_quantity_required" ).style.display = 'none';
				document.getElementById( "Delivery_number" ).focus();
				return false;
			}
			if(document.getElementById( "Delivery_issueTime" ).value == ""){
				document.getElementById( "Date_required" ).style.display = 'block';
				document.getElementById( "SupportOrder_required" ).style.display = 'none';
				document.getElementById( "Number_required" ).style.display = 'none';
				document.getElementById( "Product_code_required" ).style.display = 'none';
				document.getElementById( "Product_name_required" ).style.display = 'none';
				document.getElementById( "Item_product_category_required" ).style.display = 'none';
				document.getElementById( "Item_price_required" ).style.display = 'none';
				document.getElementById( "Item_quantity_required" ).style.display = 'none';
				document.getElementById( "Delivery_issueTime" ).focus();
				return false;
			}
			if(document.getElementById( "Item_product_code-Popup" ).value == ""){
				document.getElementById( "Product_code_required" ).style.display = 'block';
				document.getElementById( "SupportOrder_required" ).style.display = 'none';
				document.getElementById( "Number_required" ).style.display = 'none';
				document.getElementById( "Date_required" ).style.display = 'none';
				document.getElementById( "Product_name_required" ).style.display = 'none';
				document.getElementById( "Item_product_category_required" ).style.display = 'none';
				document.getElementById( "Item_price_required" ).style.display = 'none';
				document.getElementById( "Item_quantity_required" ).style.display = 'none';
				document.getElementById( "Item_product_code-Popup" ).focus();
				return false;
			}
			if(document.getElementById( "Item_full_name-Popup" ).value == ""){
				document.getElementById( "Product_name_required" ).style.display = 'block';
				document.getElementById( "SupportOrder_required" ).style.display = 'none';
				document.getElementById( "Number_required" ).style.display = 'none';
				document.getElementById( "Date_required" ).style.display = 'none';
				document.getElementById( "Product_code_required" ).style.display = 'none';
				document.getElementById( "Item_product_category_required" ).style.display = 'none';
				document.getElementById( "Item_price_required" ).style.display = 'none';
				document.getElementById( "Item_quantity_required" ).style.display = 'none';
				document.getElementById( "Item_full_name-Popup" ).focus();
				return false;
			}
			if(document.getElementById( "Item_product_category_id-Popup" ).value == ""){
				document.getElementById( "Item_product_category_required" ).style.display = 'block';
				document.getElementById( "SupportOrder_required" ).style.display = 'none';
				document.getElementById( "Number_required" ).style.display = 'none';
				document.getElementById( "Date_required" ).style.display = 'none';
				document.getElementById( "Product_code_required" ).style.display = 'none';
				document.getElementById( "Product_name_required" ).style.display = 'none';
				document.getElementById( "Item_price_required" ).style.display = 'none';
				document.getElementById( "Item_quantity_required" ).style.display = 'none';
				document.getElementById( "Item_product_category_id-Popup" ).focus();
				return false;
			}
			if(document.getElementById( "Item_price-Popup" ).value == ""){
				document.getElementById( "Item_price_required" ).style.display = 'block';
				document.getElementById( "SupportOrder_required" ).style.display = 'none';
				document.getElementById( "Number_required" ).style.display = 'none';
				document.getElementById( "Date_required" ).style.display = 'none';
				document.getElementById( "Product_code_required" ).style.display = 'none';
				document.getElementById( "Product_name_required" ).style.display = 'none';
				document.getElementById( "Item_product_category_required" ).style.display = 'none';
				document.getElementById( "Item_quantity_required" ).style.display = 'none';
				document.getElementById( "Item_price-Popup" ).focus();
				return false;
			}
			if(document.getElementById( "Item_quantity-Popup" ).value == ""){
				document.getElementById( "Item_quantity_required" ).style.display = 'block';
				document.getElementById( "SupportOrder_required" ).style.display = 'none';
				document.getElementById( "Number_required" ).style.display = 'none';
				document.getElementById( "Date_required" ).style.display = 'none';
				document.getElementById( "Product_code_required" ).style.display = 'none';
				document.getElementById( "Product_name_required" ).style.display = 'none';
				document.getElementById( "Item_product_category_required" ).style.display = 'none';
				document.getElementById( "Item_price_required" ).style.display = 'none';
				document.getElementById( "Item_quantity-Popup" ).focus();
				return false;
			}
			document.getElementById( "SupportOrder_required" ).style.display = 'none';
			document.getElementById( "Number_required" ).style.display = 'none';
			document.getElementById( "Date_required" ).style.display = 'none';
			document.getElementById( "Product_code_required" ).style.display = 'none';
			document.getElementById( "Product_name_required" ).style.display = 'none';
			document.getElementById( "Item_product_category_required" ).style.display = 'none';
			document.getElementById( "Item_price_required" ).style.display = 'none';
			document.getElementById( "Item_quantity_required" ).style.display = 'none';
			if(isNew){
				document.getElementById( "Item_product_code-New" ).disabled = true;
			}
			return true;
		}
		function isUnsignedInteger(number) {
			var Template = /^\d+$/ 
			res = (Template.test(number)) ? true : false
			return res;
		}
	</script>
</ui:composition>

</body>
	</html>
