<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{supplierBundle.supplier_module}" />
				<ui:param name="controller" value="#{supplier}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="supplierReport-excel-report" value="&#160;"
						target="_new" rendered="#{!supplier.new}"
						action="#{report.onExecute}"
						disabled="#{supplier.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="supplierReport" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="supplierReport-report" value="#{bundle.aon_listing}"
						target="_new" rendered="#{!supplier.new}"
						action="#{report.onExecute}"
						disabled="#{supplier.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="supplierReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="supplierDetailExcelReport-excel-report" value="&#160;"
						target="_new" rendered="#{!supplier.new}"
						action="#{report.onExecute}"
						disabled="#{supplier.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="supplierDetailExcelReport" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="supplierDetailReport-report" value="#{bundle.aon_detailed_listing}"
						target="_new" rendered="#{!supplier.new}"
						action="#{report.onExecute}"
						disabled="#{supplier.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="supplierDetailReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

		<aon:div styleClass="aon-scroll-area">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
				<ui:param name="controller" value="#{supplier}" />
				<ui:param name="columnClasses" value="
					aon-editDataTable-numberColumn, aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
				<ui:define name="columns">
				
					<ui:include
						src="/com/code/aon/ui/supplier/facelet/supplier/listBasic.xhtml" />

					<aon:column alias="Supplier.status"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}" />
					</aon:column>
				</ui:define>
			</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
