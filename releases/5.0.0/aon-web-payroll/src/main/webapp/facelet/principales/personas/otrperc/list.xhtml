<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="otrpercList">
			<ui:include
				src="/facelet/templates/listPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_principales_personas_otrperc}" />
				<ui:param name="controller" value="#{otraspercep}"/>
				<ui:param name="reportKey" value="otrasPercepcionesList" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="otrpercData" value="#{otraspercep.model}"
					var="to" rows="20" rendered="#{otraspercep.model.rowCount > 0}"
					columnClasses="aon-width-150, aon-editDataTable-dateColumn,
					aon-editDataTable-textColumn, aon-editDataTable-textColumn">

					<aon:rowSelector action="otrperc_form"
						actionListener="#{otraspercep.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.cdg}" size="5" />
					</aon:column>

					
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_personas_otrperc_fecha}" />
						</f:facet>
						<aon:outputText value="#{to.fecha}" size="8" />
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_personas_otrperc_concep}" />
						</f:facet>
						<aon:outputText value="#{to.concepto}" size="20" />
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_personas_otrperc_claveper}" />
						</f:facet>
						<aon:outputText value="#{to.clave}" size="10" />
					</aon:column>
					



				</aon:dataTable>

				<aon:dataScroller2 for="otrpercData"  showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
