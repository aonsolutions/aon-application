<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	 
		<aon:form id="cuentasForm">
		
			<ui:include src="/facelet/templates/formPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_principales_cuenta}" />
				<ui:param name="controller" value="#{cuenta}"/>
				<ui:param name="reportKey" value="CuentaList"/>
				<ui:param name="reportKeyXls" value="CuentaListXLS"/>
				<aon:methodParam name="backAction" value="cliente_form"/>	
			</ui:include>
			 <aon:div id="cuentas" styleClass="aon-scroll-area aon-scroll-area-principales">
			
			  <aon:div id="datos2" styleClass="aon-scroll-area">		
				<aon:panelGrid columns="2" dir="true" width="100%" style="margin-bottom=2px;">
				
	
						
					<aon:outputLabel value="#{appBundle.aon_payroll_principales_cuenta_cdg}" />
					<aon:inputText value="#{cuenta.to.cdg}" 
						 size="50" maxlength="20" />
						 
						 <aon:outputLabel for="Cliente_cdg" 
						value="#{appBundle.aon_payroll_principales_domicilio_cli}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Cliente_cdg"
							lookup="#{clienteLookup}"
							reRender="Cliente_description"
							value="#{cuenta.to.cliente.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Cliente_lookup"
							windowTitle="#{appBundle.aon_payroll_principales_clientes}"
							selectReRender="Cliente_cdg,Cliente_description"
							lookup="#{clienteLookup}" minHeight="440"
							property="#{cuenta.to.cliente}">
						</aon:lookupButton>
						<aon:inputText id="Cliente_description"
							value="#{(cuenta.to.cliente.descripcion!=null)?(cuenta.to.cliente.descripcion):('')}"   
							size="60" disabled="true" />
					</aon:div>
						
			  <aon:outputLabel for="Cuenta_entidad" 
						value="#{appBundle.aon_payroll_principales_cuenta_entidad_nom}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Cuenta_ent"
							lookup="#{entidadLookup}"
							reRender="Cuenta_entdesc,sucursalLookupDiv"
							value="#{cuenta.to.entidad.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Cuenta_lookup"
							windowTitle="#{appBundle.aon_payroll_principales_cuenta_entidad_nom}"
							selectReRender="Cuenta_ent,Cuenta_entdesc"
							lookup="#{entidadLookup}" minHeight="440"
							property="#{cuenta.to.entidad}">
						</aon:lookupButton>
						<aon:inputText id="Cuenta_entdesc"
							value="#{(cuenta.to.entidad.description!=null)?(cuenta.to.entidad.description):('')}"   
							size="60" disabled="true" />
					</aon:div>
						
					 <aon:outputLabel for="Cuenta_sucursal" 
						value="#{appBundle.aon_payroll_principales_cuenta_sucursal}" />
						<aon:div id="sucursalLookupDiv" styleClass="aon-lookup">
							<aon:lookupInputText id="Cuenta_suc" lookup="#{sucursalLookup}"
								reRender="Cuenta_sucdesc" value="#{cuenta.to.sucursal.id.cdg}"
								size="5">
							</aon:lookupInputText>
							<aon:lookupButton id="Cuentasuc_lookup"
								windowTitle="#{appBundle.aon_payroll_principales_cuenta_sucursal}"
								selectReRender="Cuenta_suc,Cuenta_sucdesc"
								lookup="#{sucursalLookup}" minHeight="440"
								property="#{cuenta.to.sucursal}">
							</aon:lookupButton>
							<aon:inputText id="Cuenta_sucdesc"
								value="#{(cuenta.to.sucursal.id.codent!=null)?(cuenta.to.sucursal.id.codent):('')}"
								size="60" disabled="true" />
						</aon:div>
						
						
							<aon:outputLabel for="entidades"
							value="#{appBundle.aon_payroll_principales_cuenta_entidad_nom}" />
						
						
						<aon:selectOneMenu id="entidades" value="#{cuenta.entidad.cdg}"
							reRender="sucursales"
							valueChangeListener="#{cuenta.refreshSucursales}">

							<f:selectItem value="#{null}" itemLabel="    " />
							<f:selectItems value="#{calendar.listaEntidades}" />
						</aon:selectOneMenu>


						<aon:outputLabel for="sucursales"
							value="#{appBundle.aon_payroll_principales_cuenta_sucursal}" />

						<aon:selectOneMenu id="sucursales"
							value="#{calendar.sucursal.id.cdg}" reRender="dc"
							valueChangeListener="#{calendar.refreshDc}">
							<f:selectItem value="#{null}" itemLabel="    " />
							<f:selectItems value="#{calendar.listaSucursales}" />
						</aon:selectOneMenu>
						
						

						<aon:outputLabel id="dc"  value="#{appBundle.aon_payroll_principales_cuenta_dc}" />
					<aon:inputText value="#{cuenta.to.dc}" 
						 size="50" maxlength="20" />
			  		
		            <aon:outputLabel value="#{appBundle.aon_payroll_principales_cuenta_numcta}" />
					<aon:inputText value="#{cuenta.to.numcta}" 
						 size="50" maxlength="20" />
			  		
						
	     	</aon:panelGrid>	
				
	         </aon:div> 
	         
		
		</aon:div>
		</aon:form>
       <aon:lookupButtonPopup lookup="#{clienteLookup}" />	
	   <aon:lookupButtonPopup lookup="#{entidadLookup}" />
       <aon:lookupButtonPopup lookup="#{sucursalLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
