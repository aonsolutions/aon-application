<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">

<body>

<ui:composition>

	<t:div id="aon-scroll-area" forceId="#{true}">
		<t:div styleClass="aon-scroll-area-internal">
			
			<h:panelGrid columns="2">
				<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
					styleClass="aon-form-table"
					columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

					<h:outputLabel 
						for="Company_id" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_id}" 
						rendered="false"/>
					<h:inputText id="Company_id" 
						value="#{company.to.id}" 
						styleClass="aon-form-input-text"
						required="true" size="1" 
						rendered="false" disabled="true"/>

					<h:outputLabel 
						for="Company_name" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_name}" />
					<h:inputText id="Company_name" 
						styleClass="aon-form-input-text"
						value="#{company.to.name}" 
						required="true" size="45"/>
													
					<h:outputLabel 
						for="Company_document" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_cif}" />
					<h:inputText id="Company_document" 
						styleClass="aon-form-input-text"
						value="#{company.to.document}" 
						required="true" size="10" onblur="toUpperCase(this);" />
					
					<h:outputLabel 
						for="Company_alias" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_alias}" />
					<h:inputText  
						styleClass="aon-form-input-text"
						id="Company_alias" 
						value="#{company.to.alias}" 
						size="45" onblur="toUpperCase(this);"/>
						
					<t:outputLabel 
						for="RegistryAttachment_id" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_company_logo}" />
					<t:inputFileUpload 
					    id="RegistryAttachment_id"
				    	value="#{company.file}"
						storage="file"
						size="29" />
						
					<t:outputLabel 
						for="preview" 
						rendered="#{company.imageAttached}" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_company_logo_preview}" />	
					<t:graphicImage id="preview" height="161" width="161"
						rendered="#{company.imageAttached}" 
						url="company.logo"/>	
						
				</h:panelGrid>
				<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
					styleClass="aon-form-table"
					columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
					
					<t:outputLabel 
						for="Company_address" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_address}" />
					<h:panelGrid columns="1">
						<h:inputText id="Company_address"
							styleClass="aon-form-input-text" required="true"
							value="#{company.mainAddress.address}"
							valueChangeListener="#{company.addressChanged}" size="45"/>
						<h:inputText id="Company_address2"
							styleClass="aon-form-input-text"
							value="#{company.mainAddress.address2}"
							valueChangeListener="#{company.addressChanged}" size="45"/>
						<h:inputText id="Company_address3"
							styleClass="aon-form-input-text"
							value="#{company.mainAddress.address3}"
							valueChangeListener="#{company.addressChanged}" size="45"/>		
					</h:panelGrid>
					
					<h:outputLabel for="Company_address_city" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_city}" />
					<h:inputText id="Company_address_city" 
						styleClass="aon-form-input-text"
						value="#{company.mainAddress.city}"
						valueChangeListener="#{company.addressChanged}" size="30"/>
						
					<h:outputLabel for="Company_address_zip" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_zip}" />
					<h:inputText id="Company_address_zip" 
						styleClass="aon-form-input-text"
						value="#{company.mainAddress.zip}"
						valueChangeListener="#{company.addressChanged}" size="30"/>
						
					<h:outputLabel for="Company_address_geozone" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_geozone}" />
					<h:selectOneMenu id="Company_address_geozone"
						value="#{company.mainAddress.geozone.id}"
						styleClass="aon-form-selectOneMenu-field"
						valueChangeListener="#{company.addressChanged}">
						<f:selectItems value="#{geozoneCollections.geoZones}" />
					</h:selectOneMenu>
					
					<h:outputLabel 
						for="Company_telephone" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_phone}" />
					<h:inputText  
						styleClass="aon-form-input-text"
						id="Company_telephone" 
						value="#{company.phone.value}" 
						valueChangeListener="#{company.phoneChanged}" size="15"/>
						
					<h:outputLabel 
						for="Company_fax" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_fax}" />
					<h:inputText  
						styleClass="aon-form-input-text"
						id="Company_fax" 
						value="#{company.fax.value}" 
						valueChangeListener="#{company.faxChanged}" size="15"/>
						
					<h:outputLabel 
						for="Company_email" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_email}" />
					<h:inputText  
						styleClass="aon-form-input-text"
						id="Company_email" 
						value="#{company.email.value}" onblur="toLowerCase(this);" 
						valueChangeListener="#{company.emailChanged}" size="45"/>
						
					<h:outputLabel 
						for="Company_web" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_web}" />
					<h:inputText  
						styleClass="aon-form-input-text"
						id="Company_web" 
						value="#{company.web.value}" onblur="toLowerCase(this);" 
						valueChangeListener="#{company.webChanged}" size="45"/>
						
					<t:outputLabel 
						for="Company_surcharge" 
						styleClass="aon-form-input-text-label"
						value="#{rBundle.aon_company_surcharge}" />
					<h:selectBooleanCheckbox 
						styleClass="aon-form-input-text"
						id="Company_surcharge" 
						value="#{company.to.surcharge}" />		
					
				</h:panelGrid>	
			</h:panelGrid>
	
			<t:div styleClass="aon-form-collapsiblePanel"
				rendered="#{!company.new}">
				<t:collapsiblePanel value="false" styleClass="aon-form-collapsiblePanel-title"
					title="#{rBundle.aon_addresses}"
					rendered="#{!company.new}">
					<t:div styleClass="aon-form-collapsiblePanel-body"
						rendered="#{!company.new}">
						<t:dataTable id="companyAddressDataList"
							value="#{companyAddress.model}" var="to"
							rowOnMouseOver="selectRow( this )"
							rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
							styleClass="aon-edit-table" headerClass="aon-edit-table-header"
							footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
							rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
							columnClasses="aon-edit-table-body aon-edit-table-body-icon,
							aon-edit-table-body aon-edit-table-body-string,
							aon-edit-table-body aon-edit-table-body-string,
							aon-edit-table-body aon-edit-table-body-string,
							aon-edit-table-body aon-edit-table-body-string,
							aon-edit-table-body aon-edit-table-body-buttons">
	
							<h:column>
								<f:facet name="header">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
								<f:verbatim>&#160;</f:verbatim>
								<t:commandLink immediate="#{true}"
									rendered="#{to!=companyAddress.to}"
									styleClass="aon-table-row-selected"
									actionListener="#{companyAddress.onSelect}">
								</t:commandLink>
								<f:facet name="footer">
									<t:div>
										<t:commandButton id="reset"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
											value="" immediate="#{true}" 
											rendered="#{!companyAddress.new}" title="#{bundle.aon_reset}"
											actionListener="#{companyAddress.onReset}"
											accesskey="#{bundle.aon_key_new_line}">
										</t:commandButton>
									</t:div>				
								</f:facet>
							</h:column>
	
							<t:column width="300">
								<f:facet name="header">
									<t:outputText
										value="#{rBundle.aon_address}" />
								</f:facet>
								<t:outputText value="#{to.address} #{to.address2} #{to.address3}"
									rendered="#{to!=companyAddress.to}" />
								<t:inputText value="#{companyAddress.to.address}"
									styleClass="aon-form-input-text" 
									rendered="#{to==companyAddress.to}" required="#{true}"
									size="40" />
								<t:inputText value="#{companyAddress.to.address2}"
									styleClass="aon-form-input-text" 
									rendered="#{to==companyAddress.to}"
									size="40" />
								<t:inputText value="#{companyAddress.to.address3}"
									styleClass="aon-form-input-text" 
									rendered="#{to==companyAddress.to}"
									size="40" />
								<f:facet name="footer">
									<t:div>
										<t:inputText id="Direccion_Empresa" value="#{companyAddress.to.address}"
											styleClass="aon-form-input-text" 
											rendered="#{companyAddress.new}" required="#{true}"
											size="40" />
										<t:inputText value="#{companyAddress.to.address2}"
											styleClass="aon-form-input-text" 
											rendered="#{companyAddress.new}"
											size="40" />
										<t:inputText value="#{companyAddress.to.address3}"
											styleClass="aon-form-input-text" 
											rendered="#{companyAddress.new}"
											size="40" />
									</t:div>
								</f:facet>
							</t:column>
	
							<t:column width="50">
								<f:facet name="header">
									<t:outputText
										value="#{rBundle.aon_zip}" />
								</f:facet>
								<t:outputText value="#{to.zip}"
									rendered="#{to!=companyAddress.to}" />
								<t:inputText value="#{companyAddress.to.zip}"
									styleClass="aon-form-input-text" 
									rendered="#{to==companyAddress.to}" required="#{true}"
									size="8" />
								<f:facet name="footer">
									<t:div>
										<t:inputText id="Codigo_Postal_Empresa" value="#{companyAddress.to.zip}"
											styleClass="aon-form-input-text" 
											rendered="#{companyAddress.new}" required="#{true}"
											size="8" />
									</t:div>
								</f:facet>
							</t:column>
	
							<t:column width="150">
								<f:facet name="header">
									<t:outputText
										value="#{rBundle.aon_city}" />
								</f:facet>
								<t:outputText value="#{to.city}"
									rendered="#{to!=companyAddress.to}" />
								<t:inputText value="#{companyAddress.to.city}"
									styleClass="aon-form-input-text" 
									rendered="#{to==companyAddress.to}" required="#{true}"
									size="20" />
								<f:facet name="footer">
									<t:div>
										<t:inputText id="Ciudad_Empresa" value="#{companyAddress.to.city}"
											styleClass="aon-form-input-text" 
											rendered="#{companyAddress.new}" required="#{true}"
											size="20" />
									</t:div>
								</f:facet>
							</t:column>
	
							<t:column width="130">
								<f:facet name="header">
									<t:outputText
										value="#{rBundle.aon_geozone}" />
								</f:facet>
								<t:outputText value="#{to.geozone.name}"
									rendered="#{to!=companyAddress.to}" />
								<h:selectOneMenu value="#{companyAddress.to.geozone.id}"
									styleClass="aon-form-selectOneMenu-field"
									rendered="#{to==companyAddress.to}"
									valueChangeListener="#{company.onChangeGeoZone}">
									<f:selectItems value="#{geozoneCollections.geoZones}" />
								</h:selectOneMenu>
								<f:facet name="footer">
									<t:div>
										<h:selectOneMenu value="#{companyAddress.to.geozone.id}"
											styleClass="aon-form-selectOneMenu-field"
											rendered="#{companyAddress.new}">
											<f:selectItems value="#{geozoneCollections.geoZones}" />
										</h:selectOneMenu>
									</t:div>
								</f:facet>
							</t:column>

							<h:column>
								<f:facet name="header">
									<f:verbatim>&#160;</f:verbatim>
								</f:facet>
								<t:div>
									<f:verbatim rendered="#{to!=companyAddress.to}">&#160;</f:verbatim>
	
									<t:commandButton title="#{bundle.aon_save}"
										actionListener="#{companyAddress.onAccept}"
										rendered="#{to==companyAddress.to}" value=""
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
										accesskey="#{bundle.aon_key_save_line}"/>
									<t:commandButton title="#{bundle.aon_cancel}"
										actionListener="#{companyAddress.onCancel}"
										immediate="#{true}"
										onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
										value="" rendered="#{to==companyAddress.to}" 
										accesskey="#{bundle.aon_key_cancel_line}"/>
									<t:commandButton title="#{bundle.aon_remove}"
										actionListener="#{companyAddress.onRemove}"
										onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
										rendered="#{to==companyAddress.to}"
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-delete"
										value="" accesskey="#{bundle.aon_key_remove_line}"/>
								</t:div>
								<f:facet name="footer">
									<t:div>
										<f:verbatim rendered="#{!companyAddress.new}">&#160;</f:verbatim>
										<t:commandButton title="#{bundle.aon_save}"
											actionListener="#{companyAddress.onAccept}"
											rendered="#{companyAddress.new}" value=""
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
											accesskey="#{bundle.aon_key_save_line}"/>
										<t:commandButton title="#{bundle.aon_cancel}"
											actionListener="#{companyAddress.onCancel}"
											immediate="#{true}"
											onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
											rendered="#{companyAddress.new}"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
											value="" accesskey="#{bundle.aon_key_cancel_line}"/>
									</t:div>
								</f:facet>
							</h:column>
						</t:dataTable>
	
						<t:div styleClass="aon-datascroller"
							rendered="#{companyAddress.model.rowCount > 20}">
							<h:panelGrid columns="2"
								columnClasses="aon-datascroller-text,aon-datascroller-buttons">
								<t:dataScroller id="scroll_2" for="companyAddressDataList"
									rowsCountVar="rowsCount" firstRowIndexVar="firstRowIndex"
									lastRowIndexVar="lastRowIndex"
									rendered="#{companyAddress.model.rowCount > 20}">
									<h:outputFormat value="#{appBundle.aon_scroll}">
										<f:param value="#{firstRowIndex}" />
										<f:param value="#{lastRowIndex}" />
										<f:param value="#{rowsCount}" />
									</h:outputFormat>
								</t:dataScroller>
	
								<t:dataScroller id="scroll_3" for="companyAddressDataList" fastStep="5" 
									paginator="#{true}" paginatorMaxPages="5"
									paginatorActiveColumnClass="aon-datascroller-currentpage"
									paginatorColumnClass="aon-datascroller-page"
									rendered="#{companyAddress.model.rowCount > 20}">
	
									<f:facet name="first">
										<t:div styleClass="aon-datascroller-button-first">&#160;</t:div>
									</f:facet>
									<f:facet name="last">
										<t:div styleClass="aon-datascroller-button-last">&#160;</t:div>
									</f:facet>
									<f:facet name="previous">
										<t:div styleClass="aon-datascroller-button-previous">&#160;</t:div>
									</f:facet>
									<f:facet name="next">
										<t:div styleClass="aon-datascroller-button-next">&#160;</t:div>
									</f:facet>
									<f:facet name="fastforward">
										<t:div styleClass="aon-datascroller-button-fastforward">&#160;</t:div>
									</f:facet>
									<f:facet name="fastrewind">
										<t:div styleClass="aon-datascroller-button-fastrewind">&#160;</t:div>
									</f:facet>
								</t:dataScroller>
							</h:panelGrid>
						</t:div>
					</t:div>
				</t:collapsiblePanel>
			</t:div>
		</t:div>
	</t:div>	

</ui:composition>
</body>
</html>
