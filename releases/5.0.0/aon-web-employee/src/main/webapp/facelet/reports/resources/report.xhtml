<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
		<t:stylesheet path="/jscalendar/dhtmlgoodies_calendar.css" />
		<script type="text/javascript" 
				src="${facesContext.externalContext.requestContextPath}/jscalendar/dhtmlgoodies_calendar.js">
			// nothing
		</script>
	</ui:define>

	<ui:define name="content">

		<h:form id="resourcesReportForm">
			<t:div styleClass="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="resourcesList" forceId="#{true}" value="Informe"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-list"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-list'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-list'"
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/reports/preferences.faces');return false;"  />
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText value="#{appBundle.aon_report_parameters}" />
				</t:div>
			</t:div>

			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">

					<h:panelGrid columns="2" styleClass="aon-form-table"
								columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
						<t:outputLabel for="ResourcesReport_startingDate"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.aon_start_date}" />
						<h:panelGroup>
							<t:inputText id="ResourcesReport_startingDate" forceId="#{true}"
									styleClass="aon-form-input-text" maxlength="12"
									value="#{resourcesReport.startingDate}" 
									valueChangeListener="#{resourcesReport.startingDateChanged}" 
									onchange="this.form.submit();" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</t:inputText>
							<t:commandButton styleClass="aon-form-calendar-button"
											id="ResourcesReport_startingDate_button" forceId="#{true}" 
											value=""
											onclick="displayCalendar(this.form.ResourcesReport_startingDate,'dd/mm/yyyy',this);return false;"
											immediate="true" />
						</h:panelGroup>

						<t:outputLabel for="ResourcesReport_endingDate"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.aon_end_date}" />
						<h:panelGroup>
							<t:inputText id="ResourcesReport_endingDate" forceId="#{true}"
									styleClass="aon-form-input-text" maxlength="12"
									value="#{resourcesReport.endingDate}"
									valueChangeListener="#{resourcesReport.endingDateChanged}" 
									onchange="this.form.submit();" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</t:inputText>
							<t:commandButton styleClass="aon-form-calendar-button"
											id="ResourcesReport_endingDate_button" forceId="#{true}" 
											value=""
											onclick="displayCalendar(this.form.ResourcesReport_endingDate,'dd/mm/yyyy',this);return false;"
											immediate="true" />
						</h:panelGroup>
					</h:panelGrid>
				
					<h:panelGrid columns="2" styleClass="aon-form-table"
								columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
						<t:outputLabel for="ResourcesReport_workPlace"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.aon_workplace}" />
						<t:selectOneMenu id="ResourcesReport_workPlace" forceId="#{true}"
										styleClass="aon-form-selectOneMenu-field"
										value="#{resourcesReport.workPlace.id}" 
										valueChangeListener="#{resourcesReport.workingPlaceChanged}" 
										onchange="this.form.submit();" >
							<f:selectItems value="#{workplace.companyWorkPlaces}" />
						</t:selectOneMenu>	
				
						<t:outputLabel for="ResourcesReport_workActivity"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.aon_workactivity}" />
						<t:selectOneMenu id="ResourcesReport_workActivity" forceId="#{true}"
										styleClass="aon-form-selectOneMenu-field"
										value="#{resourcesReport.workActivity.id}"
										valueChangeListener="#{resourcesReport.workingActivityChanged}"
										onchange="this.form.submit();" >
							<f:selectItems value="#{resourcesReport.workActivities}" />
						</t:selectOneMenu>	
	
						<t:outputLabel for="ResourcesReport_employee"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.aon_employee}" />
						<t:selectOneMenu id="ResourcesReport_employee" forceId="#{true}"
										styleClass="aon-form-selectOneMenu-field"
										value="#{resourcesReport.employeeId}"
										valueChangeListener="#{resourcesReport.employeeChanged}" 
										onchange="this.form.submit();" >
							<f:selectItems value="#{resourcesReport.employees}" />
						</t:selectOneMenu>	
					</h:panelGrid>

				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
