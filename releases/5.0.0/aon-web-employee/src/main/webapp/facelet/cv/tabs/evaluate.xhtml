<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition >

	<t:div styleClass="aon-content-toolbar" >
		<t:div styleClass="aon-content-toolbar-internal">
			<t:div styleClass="aon-content-toolbar-item-group">
				<t:commandButton id="evaluate_save" value="#{bundle.aon_save}"
					forceId="#{true}" actionListener="#{evaluate.accept}"
					onclick="return (confirm('#{bundle.aon_save_confirm}'))"
					styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
					onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
					onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'" 
					accesskey="#{bundle.aon_key_save}"/>
			</t:div>
		</t:div>
	</t:div>

	<t:div styleClass="aon-scroll-area-internal">

		<h:panelGrid columns="1" cellpadding="0" cellspacing="0" style="width:720px;" >

			<t:dataTable id="EvaluateDataList" var="to"
					value="#{evaluate.types}" 
					styleClass="aon-form-table" 
					rowIndexVar="rowIndex"
					rendered="#{evaluate.types.rowCount > 0}" 
					cellpadding="0" cellspacing="0"
					columnClasses="aon-form-table-column-odd, aon-form-table-column-even">
				<h:column>
					<t:outputText value="#{to.evaluateType.name}" />
				</h:column>

				<h:column>
					<t:selectOneMenu id="Evaluate_value" forceId="#{true}"
						styleClass="aon-form-selectOneMenu-field"
						value="#{to.value}">
						<f:selectItems value="#{CVitaeCollections.evaluateLevels}" />
					</t:selectOneMenu>
				</h:column>
			</t:dataTable>

			<h:panelGrid columns="2" cellpadding="2" cellspacing="2" style="width:100%">
				<t:div styleClass="aon-form-group" style="width:100%;">
					<t:div styleClass="aon-form-group-title" >
								<t:outputLabel for="EvaluateSummary_strengths"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.evaluate_strengths}" />
					</t:div>
					<t:div styleClass="aon-form-group-body">
								<t:inputTextarea id="EvaluateSummary_strengths"
									forceId="#{true}" style="width:100%;"
									value="#{evaluate.to.strengths}" rows="4" />
					</t:div>
				</t:div>
	
				<t:div styleClass="aon-form-group" style="width:100%;">
					<t:div styleClass="aon-form-group-title" >
								<t:outputLabel for="EvaluateSummary_weaknesses"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.evaluate_weaknesses}" />
					</t:div>
					<t:div styleClass="aon-form-group-body">
								<t:inputTextarea id="EvaluateSummary_weaknesses"
									 forceId="#{true}" style="width:100%;"
									value="#{evaluate.to.weaknesses}" rows="4" />
					</t:div>
				</t:div>
			</h:panelGrid>

			<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
					styleClass="aon-form-table" style="width:100%;"
					columnClasses="aon-form-table-column-odd, 
								aon-form-table-column-even aon-form-table-mainColumn">
				<t:outputLabel for="EvaluateSummary_score"
					value="#{appBundle.evaluate_score}" />
				<h:panelGroup>
					<t:outputText id="EvaluateSummary_score" value="#{evaluate.score}" />
					<f:verbatim> / </f:verbatim>
					<t:outputText id="EvaluateSummary_total_score" value="#{evaluate.totalScore}" />
				</h:panelGroup>

				<t:outputLabel for="EvaluateSummary_profile"
					value="#{appBundle.evaluate_profile}" />
				<t:selectOneMenu id="EvaluateSummary_profile" forceId="#{true}"
					styleClass="aon-form-selectOneMenu-field"
					value="#{evaluate.to.profile}">
					<f:selectItems value="#{CVitaeCollections.evaluateLevels}" />
				</t:selectOneMenu>

				<t:outputLabel for="EvaluateSummary_comments"
					value="#{appBundle.evaluate_comments}" />
				<t:inputTextarea id="EvaluateSummary_comments"
					styleClass="aon-form-textarea-field" forceId="#{true}"
					value="#{evaluate.to.comments}" rows="4" />
			</h:panelGrid>

		</h:panelGrid>

	</t:div>

</ui:composition>

</body>
</html>
