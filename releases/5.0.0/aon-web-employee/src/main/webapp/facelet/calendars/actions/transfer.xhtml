<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">

<body>
<ui:composition>

	<t:div styleClass="aon-content-subtitle-calendar-actions">
		<t:div styleClass="aon-content-subtitle-internal-calendar-actions" style="padding:5px 0 4px 1em;">
			<h:outputText value="#{appBundle.aon_transfer} #{appBundle.aon_employee}" />
		</t:div>
	</t:div>
	<t:div styleClass="aon-form-group-body">
		<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
				styleClass="aon-form-table" style="width:100%;"
				columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
		
			<t:outputLabel for="Transfer_workPlace"
				styleClass="aon-form-input-text-label"
				value="#{appBundle.aon_workplace}" />
			<t:selectOneMenu id="Transfer_workPlace" forceId="#{true}"
							styleClass="aon-form-selectOneMenu-field"
							value="#{employee.resource.workPlace.id}" 
							valueChangeListener="#{employee.workingPlaceChanged}" 
							onchange="this.form.submit();" >
				<f:selectItems value="#{workplace.all}" />
			</t:selectOneMenu>	
		
			<t:outputLabel for="Transfer_workActivity"
				styleClass="aon-form-input-text-label"
				value="Actividad" />
			<t:selectOneMenu id="Transfer_workActivity" forceId="#{true}"
							styleClass="aon-form-selectOneMenu-field"
							value="#{employee.activityId}"
							valueChangeListener="#{employee.workingActivityChanged}" >
				<f:selectItems value="#{employee.workActivities}" />
			</t:selectOneMenu>	
		
			<h:outputLabel for="Transfer_keep_events" 
				styleClass="aon-form-input-text-label" 
				value="#{appBundle.aon_keep_events}" />
			<h:selectBooleanCheckbox id="Transfer_keep_events" 
				styleClass="aon-form-input-text"
				value="#{calendars.transfer.keepAppointments}" />
		
			<t:outputLabel for="Transfer_position"
				styleClass="aon-form-input-text-label"
				value="#{appBundle.record_position}" />
			<t:inputText id="Transfer_position" forceId="#{true}"
				styleClass="aon-form-input-text" 
				value="#{calendars.transfer.description}" size="32" />
		</h:panelGrid>
	</t:div>

</ui:composition>
</body>
</html>
