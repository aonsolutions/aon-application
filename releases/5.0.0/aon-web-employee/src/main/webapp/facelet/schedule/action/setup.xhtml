<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>
<ui:composition>

<!-- SETUP -->
	<t:panelTab id="setup" label="#{plannerBundle.aon_planner_event_setup}" >
		<h:panelGrid columns="2" cellpadding="0" cellspacing="0" >
			<h:outputLabel for="Event_title" value="#{plannerBundle.aon_planner_subject_label}" 
			styleClass="aon-form-input-text-label"/>
			<t:inputText id="Event_title" forceId="#{true}" size="64" 
				styleClass="aon-form-input-text"
				value="#{event.event.title}" 
				valueChangeListener="#{event.setupChanged}" />
		
			<h:outputLabel for="Event_subtitle" value="#{plannerBundle.aon_planner_event_location}" 
			styleClass="aon-form-input-text-label"/>
			<h:inputText id="Event_subtitle" size="26" 
				styleClass="aon-form-input-text"
				value="#{event.event.subtitle}" 
				valueChangeListener="#{event.setupChanged}" />
		
			<h:outputLabel for="Event_description" value="#{rBundle.aon_description}" styleClass="aon-form-input-text-label"/>
			<t:inputText id="Event_description" forceId="#{true}" size="64" 
				styleClass="aon-form-input-text"
				value="#{event.event.description}" 
				valueChangeListener="#{event.setupChanged}" />
				
		</h:panelGrid>
		<t:div styleClass="aon-form-group-separation">&nbsp;</t:div>
<!-- FECHA Y HORA DE INICIO Y FIN DE UN EVENTO NO PERIODICO -->
		<h:panelGrid columns="2" cellpadding="0" cellspacing="0" >

			<h:outputLabel for="Event_startTime" styleClass="aon-form-input-text-label"
				rendered="#{!event.event.allDay and !event.recur}"
				value="#{plannerBundle.aon_planner_event_start}" />
			<t:div>
				<t:inputDate id="Event_startTime" styleClass="aon-form-input-text" type="both" 
					rendered="#{!event.event.allDay and !event.recur}"
					value="#{event.startTime}" 
					valueChangeListener="#{event.startTimeChanged}"
				/>
 
				<t:div style="display:inline;">
					<h:outputLabel for="Event_startTime_allday" styleClass="aon-form-input-text-label"
						rendered="#{event.event.allDay and !event.recur}"
						value="#{plannerBundle.aon_planner_event_start}" />
					<f:verbatim>&#160;&#160;&#160;</f:verbatim>
					<t:inputDate id="Event_startTime_allday" type="date" 
						rendered="#{event.event.allDay and !event.recur}"
						value="#{event.startTime}"
						valueChangeListener="#{event.startTimeChanged}"
					/>
					<h:selectBooleanCheckbox id="Event_allday" styleClass="checkbox"
						disabled="#{event.event.holiday}"
						value="#{event.event.allDay}" 
						valueChangeListener="#{event.eventModeChanged}"
						onclick="this.form.submit();" />
					<h:outputLabel for="Event_allday" styleClass="aon-form-input-text-label"
						value="#{plannerBundle.aon_planner_event_allday}" />

					<t:div style="padding-top:10px;" rendered="#{event.recur}" >
						<h:outputLabel styleClass="aon-form-input-text-label"
							rendered="#{event.recur}"
							value="#{plannerBundle.aon_planner_event_recurrence}" />
						<f:verbatim>Desde el&#160;</f:verbatim>
						<t:inputText id="Event_startDate_recur_summary" forceId="#{true}" readonly="#{true}" size="6" 
								value="#{event.startDate}" 
								style="border:0;display:inline;padding:0;position:relative;top:1;" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
						</t:inputText>
						<f:verbatim>&#160;a las&#160;</f:verbatim>
						<t:inputText id="Event_startTime_recur_summary" forceId="#{true}" readonly="#{true}" size="2"
								value="#{event.startTime}"
								style="border:0;display:inline;padding:0;position:relative;top:1;" >
							<f:convertDateTime pattern="#{appBundle.aon_time_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
						</t:inputText>
						<h:panelGroup rendered="#{event.recurrence.until != null}" >
							<f:verbatim>Hasta el&#160;</f:verbatim>
							<t:inputText id="Event_endDate_recur_summary" forceId="#{true}" readonly="#{true}" size="6"
									value="#{event.recurrence.until}"
									style="border:0;display:inline;padding:0;position:relative;top:1;" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
							</t:inputText>
							<f:verbatim>&#160;a las&#160;</f:verbatim>
							<t:inputText id="Event_endTime_recur_summary" forceId="#{true}" readonly="#{true}" size="2"
									value="#{event.endTime}"
									style="border:0;display:inline;padding:0;position:relative;top:1;" >
								<f:convertDateTime pattern="#{appBundle.aon_time_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
							</t:inputText>
						</h:panelGroup>
					</t:div>

				</t:div>

			</t:div>
			<h:outputLabel for="Event_endTime" rendered="#{!event.event.allDay and !event.recur}"
				value="#{plannerBundle.aon_planner_event_end}" styleClass="aon-form-input-text-label"/>
				
			<t:inputDate id="Event_endTime" styleClass="aon-form-input-text" type="both"
				rendered="#{!event.event.allDay and !event.recur}"
				value="#{event.endTime}" 
				valueChangeListener="#{event.endTimeChanged}"
				/>

		</h:panelGrid>
<!-- ****************************************************** -->
		<t:div styleClass="aon-form-group-separation">&nbsp;</t:div>
	
		<h:panelGrid columns="3" cellpadding="5" cellspacing="5" >
			<t:div rendered="#{event.event.statusVisible}">
				<h:outputLabel for="Event_state" value="#{plannerBundle.aon_planner_status_label}" styleClass="aon-form-input-text-label"/>
				<h:selectOneMenu id="Event_state" 
						value="#{event.event.state}"
						valueChangeListener="#{event.setupChanged}" >
					<f:selectItems id="eventStatus" value="#{event.eventStatus}" />
				</h:selectOneMenu>
			</t:div>
			<t:div>
				<h:outputLabel for="Event_category" value="#{plannerBundle.aon_planner_event_category}" 
					styleClass="aon-form-input-text-label"/>
				<h:selectOneMenu id="Event_category" value="#{event.event.category}" >
					<f:selectItems id="categories" value="#{event.categories}" />
				</h:selectOneMenu>
			</t:div>
			<t:div>
				<t:selectBooleanCheckbox id="selone" forceId="#{true}" styleClass="radio" 
					value="#{event.recur}" 
					valueChangeListener="#{event.allowRecurrence}"
					onclick="if ( this.form.Event_title.value == '') {alert('#{plannerBundle.aon_planner_event_fill_subject}');this.form.Event_title.focus();this.checked = false;return false;}this.form.submit();" />
				<h:outputLabel for="selone" value="#{plannerBundle.aon_planner_event_recurrence_panel}" styleClass="aon-form-input-text-label" />
			</t:div>
		</h:panelGrid>
	</t:panelTab>

</ui:composition>
</body>
</html>
