<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>
<ui:composition>
	<style>
	.infoR {
	    height: 300px;
	    width: 96%;
	    overflow: auto;
	}
	</style>


	<aon:panelGroup id="showResourceModalPanel">
		<rich:modalPanel id="resourceModalPanel"
				rendered="#{webPage.showResourceModalPanel}" showWhenRendered="true"
				headerClass="aon-popupWindow-title"
				minHeight="400" height="400" width="580" top="50" left="100" zindex="1000">
	
			<f:facet name="header">
	           	<h:outputText value="#{appBundle.aon_web_info_page_resource}"/>
			</f:facet>

	<aon:form id="pagesResourcesForm">
				<aon:div id="infoR" ajaxRendered="true">
					<rich:panel bodyClass="infoR">
						<aon:editDataTable id="WebInfoPageResource_datatable" value="#{webPage.resources}"
							var="to" rows="10" 
							columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
								aon-editDataTable-textColumn aon-width-auto, aon-editDataTable-textColumn, 
								aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
					
							<aon:rowSelector toggleOnClick="false"/>
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;"/>
								</f:facet>
								<a4j:support actionListener="#{webPage.onSelectResource}" event="onclick" />
								<aon:outputText value="&#160;"/>
								<f:facet name="footer">
									<aon:div>
										<aon:commandButton id="resetR"
											styleClass="aon-icon-reset aon-icon-commandButton"
											value="" rendered="#{!webPage.newResource}" actionListener="#{webPage.onResetResource}"
											accesskey="#{bundle.aon_key_new_line}">
										</aon:commandButton>
									</aon:div>
								</f:facet>
							</aon:column>
					
							<aon:column style="width:140px">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_web_info_page_resource}" />
								</f:facet>
								<aon:div rendered="#{to != webPage.resource}">
									<a4j:support actionListener="#{webPage.onSelectResource}" event="onclick" />
									<aon:outputText value="#{to.rattach.description}" />
								</aon:div>
								<aon:div rendered="#{to == webPage.resource}" >
									<h:selectOneMenu id="WebInfoPageResource_rattach" value="#{webPage.rattachId}">
										<f:selectItems value="#{webPage.images}" />
									</h:selectOneMenu>
								</aon:div>
								<f:facet name="footer">
									<aon:div>
										<aon:div rendered="#{webPage.newResource}">				
											<h:selectOneMenu id="WebInfoPageResource_rattach_new" value="#{webPage.rattachId}">
												<f:selectItems value="#{webPage.images}" />
											</h:selectOneMenu>
										</aon:div>
									</aon:div>
								</f:facet>
							</aon:column>
					
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_web_info_page_resource_description}" />
								</f:facet>
								<aon:div rendered="#{to!=webPage.resource}">
									<a4j:support actionListener="#{webPage.onSelectResource}" event="onclick" />
									<aon:outputText value="#{to.content}" />
								</aon:div>
								<aon:div rendered="#{to==webPage.resource}" >
									<aon:inputText value="#{webPage.resource.content}" size="32" />
								</aon:div>
								<f:facet name="footer">
									<aon:div>
										<aon:div rendered="#{webPage.newResource}">				
											<aon:inputText value="#{webPage.resource.content}" size="32" />
										</aon:div>
									</aon:div>
								</f:facet>
							</aon:column>
					
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;"/>
								</f:facet>
								<aon:div rendered="#{to == webPage.resource}" >
									<aon:commandButton title="#{bundle.aon_save}"
										actionListener="#{webPage.onAcceptResource}"
										value="" styleClass="aon-editDataTable-button aon-icon-accept"
										accesskey="#{bundle.aon_key_save_line}" reRender="infoR" />
									<aon:commandButton title="#{bundle.aon_cancel}"
										actionListener="#{webPage.onCancelResource}" immediate="#{true}"
										styleClass="aon-editDataTable-button aon-icon-cancel" reRender="infoR"
										value="" accesskey="#{bundle.aon_key_cancel_line}" />
									<aon:commandButton title="#{bundle.aon_remove}"
										actionListener="#{webPage.onRemoveResource}"
										styleClass="aon-editDataTable-button aon-icon-delete"
										value="" accesskey="#{bundle.aon_key_remove_line}" reRender="infoR"/>
								</aon:div>
								<f:facet name="footer">		
									<aon:div>
										<aon:outputText rendered="#{!webPage.newResource}" value="&#160;"/>
										<aon:commandButton title="#{bundle.aon_save}"
											actionListener="#{webPage.onAcceptResource}"
											rendered="#{webPage.newResource}" value=""
											styleClass="aon-editDataTable-button aon-icon-accept"
											accesskey="#{bundle.aon_key_save_line}" reRender="infoR"/>
										<aon:commandButton title="#{bundle.aon_cancel}"
											actionListener="#{webPage.onCancelResource}" immediate="#{true}"
											rendered="#{webPage.newResource}" reRender="infoR"
											styleClass="aon-editDataTable-button aon-icon-cancel"
											value="" accesskey="#{bundle.aon_key_cancel_line}" />
									</aon:div>
								</f:facet>
							</aon:column>
						</aon:editDataTable>
						
						<aon:dataScroller dataTable="WebInfoPageResource_datatable" for="WebInfoPageResource_datatable"
							model="#{webPage.resources}" rowCount="10" showNote="true"  />

					</rich:panel>
				</aon:div>

				<aon:div id="closeResourceModalPanel" >
					<aon:div style="text-align:right;">
						<rich:spacer height="3"/>
						<br/>
			            <aon:panelGrid style="float:right;border:1px gray solid">
							<aon:commandButton 
									reRender="infoR, closeResourceModalPanel"  style="padding-right:15px"
									value="#{appBundle.aon_web_info_close}" immediate="true"
									styleClass="aon-icon-commandButton aon-icon-cancel">
								<f:setPropertyActionListener target="#{webPage.showResourceModalPanel}" value="#{false}" />
								<rich:componentControl for="resourceModalPanel" operation="hide" event="onclick" />
							</aon:commandButton>
						</aon:panelGrid>
					</aon:div>
				</aon:div>
	</aon:form>
		</rich:modalPanel>
	</aon:panelGroup>	
</ui:composition>
</body>
</html>
