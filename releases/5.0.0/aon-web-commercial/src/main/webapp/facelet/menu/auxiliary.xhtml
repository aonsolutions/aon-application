<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="auxiliaryMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">			

					<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
						columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">
	
						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-icon-auxiliary aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_auxiliaries}" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">							
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="segment"
										action="segment_form"
										value="#{registryBundle.registry_segment_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="commercialActivity"
										action="commercialActivity" actionListener="#{commercialActivity.onSearch}" 
										value="#{commercialBundle.commercial_activity_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="commercialTerm"
										action="commercialTerm" actionListener="#{commercialTerm.onSearch}" 
										value="#{commercialBundle.commercial_term_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="commercialExpense"
										action="commercialExpense" actionListener="#{expense.onSearch}" 
										value="#{commercialBundle.commercial_expense_module}" />
								</aon:div>
							</aon:div>
						</h:panelGrid>

						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-icon-product aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{commercialBundle.commercial_product_auxiliars_module_group}" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">														
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="productCategory" 
										action="productCategory" 
										value="#{productBundle.product_category_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="tax" 
										action="tax" 
										value="#{configBundle.config_tax_module}" />
								</aon:div>
							</aon:div>
						</h:panelGrid>
	
					</h:panelGrid>
				</aon:componentGroup>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
