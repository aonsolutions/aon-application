<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/front/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="frontOfferForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_front_offer}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{bundle.aon_editing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{frontOffer.to!=null or frontOffer.new}"
							reRender="gridToolbar,frontOfferGrid" 
							disabled="#{!frontOffer.new and !frontOffer.pending}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{frontOffer.accept}"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{frontOffer.to!=null or frontOffer.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}" action="front_offer_list"
							actionListener="#{frontOffer.onCancel}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="discard" value="#{appBundle.gbp_discard}"
							rendered="#{!frontOffer.new and !frontOffer.discarded}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{appBundle.gbp_discard_confirm}"
							confirmActionListener="#{frontOffer.onDiscard}"
							confirmAction="front_offer_list"/>
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="front_offer_search"
							actionListener="#{frontOffer.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" reRender="gridToolbar,frontOfferGrid,frontOfferTab"
							value="#{bundle.aon_reset}" actionListener="#{frontOffer.onReset}"
							rendered="#{!frontOffer.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="transfer"
							value="#{appBundle.gbp_offer_transfer}"
							actionListener="#{frontOffer.onTransfer}"
							action="front_pro_forma_form"
							rendered="#{!frontOffer.new and frontOffer.accepted}"
							styleClass="aon-finding-toolbar-item aon-icon-transfer"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="frontOfferGrid" columns="2" dir="true">

					<aon:outputLabel for="Offer_type"
						value="#{appBundle.gbp_offer_type}" />
					<aon:selectOneMenu id="Offer_type"
						required="true" disabled="#{!frontOffer.new}"
						value="#{frontOffer.to.type}">
						<f:selectItems value="#{GBPCollections.offerTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_campaign_code"
						value="#{appBundle.gbp_offer_campaign_code}" />
					<aon:selectOneMenu id="Offer_campaign_code-New"
						required="true" rendered="#{frontOffer.new}"
						value="#{frontOffer.to.campaign.id}"
						valueChangeListener="#{frontOffer.campaignChanged}">
						<f:selectItems value="#{FrontGBPCollections.pendingCampaigns}" />
					</aon:selectOneMenu>
					<aon:inputText id="Offer_campaign_code"
						rendered="#{!frontOffer.new}" size="16"
						disabled="true" styleClass="aon-inputText-disabled"
						maxlength="16" value="#{frontOffer.to.campaign.code}" />

					<aon:outputLabel for="Offer_offerDate"
						rendered="#{!frontOffer.new}"
						value="#{appBundle.gbp_offer_offer_date}" />
					<aon:inputText id="Offer_offerDate" 
						size="16" maxlength="16" rendered="#{!frontOffer.new}"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{frontOffer.to.offerDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:inputText>	

					<aon:outputLabel for="Offer_price"
						value="#{appBundle.gbp_offer_price}" />
					<aon:inputText id="Offer_price"
						size="16" maxlength="16"
						disabled="#{!frontOffer.new and !frontOffer.pending}"
						value="#{frontOffer.to.price}" />

					<aon:outputLabel for="Offer_deliveryDate"
						value="#{appBundle.gbp_offer_delivery_date}" />
					<aon:inputText id="Offer_deliveryDate" 
						size="20" maxlength="20"
						disabled="#{!frontOffer.new and !frontOffer.pending}"
						value="#{frontOffer.to.deliveryDate}" />

					<aon:outputLabel for="Offer_stockProvision"
						value="#{appBundle.gbp_offer_stock_provision}" />
					<aon:inputText id="Offer_stockProvision" 
						size="16" maxlength="16"
						disabled="#{!frontOffer.new and !frontOffer.pending}"
						value="#{frontOffer.to.stockProvision}" />
						
					<aon:outputLabel for="Offer_quality"
						value="#{appBundle.gbp_offer_quality}" />
					<aon:inputTextarea id="Offer_quality"
						value="#{frontOffer.to.quality}"
						disabled="#{!frontOffer.new and !frontOffer.pending}"
						cols="80" rows="5" />

					<aon:outputLabel for="Offer_defectiveGoods"
						value="#{appBundle.gbp_offer_defective_goods}" />
					<aon:inputTextarea id="Offer_defectiveGoods"
						value="#{frontOffer.to.defectiveGoods}"
						disabled="#{!frontOffer.new and !frontOffer.pending}"
						cols="80" rows="5" />

					<aon:outputLabel for="Offer_additionalConditions"
						value="#{appBundle.gbp_offer_additional_conditions}" />
					<aon:inputTextarea id="Offer_additionalConditions"
						value="#{frontOffer.to.additionalConditions}"
						disabled="#{!frontOffer.new and !frontOffer.pending}"
						cols="80" rows="5" />

					<aon:outputLabel for="Offer_status"
						rendered="#{!frontOffer.new}"
						value="#{appBundle.gbp_offer_status}" />
					<aon:selectOneMenu id="Offer_status" rendered="#{!frontOffer.new}"
						value="#{frontOffer.to.status}" disabled="true">
						<f:selectItems value="#{GBPCollections.offerStatus}" />
					</aon:selectOneMenu>

				</aon:panelGrid>

				<aon:div id="frontOfferTab" rendered="#{frontOfferIncidence.model.rowCount > 0}">
					<aon:panelTabSet>

						<aon:panelTab id="incidences" label="#{appBundle.gbp_incidences}" >
							<ui:include src="/front/incidence/grid.xhtml">
								<ui:param name="controllerAlias" value="#{frontOfferIncidence}" />
								<ui:param name="dataTable" value="frontOfferIncidenceDataTable" />
								<ui:param name="parentGrid" value="frontOfferGrid" />
							</ui:include>
						</aon:panelTab>
							
					</aon:panelTabSet>
				</aon:div>

			</aon:div>	
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
