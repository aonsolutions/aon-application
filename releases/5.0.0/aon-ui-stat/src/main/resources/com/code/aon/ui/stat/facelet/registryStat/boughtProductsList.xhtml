<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:editDataTable id="products"
		value="#{registryStat.boughtProductModel}" rows="20"
		columnClasses="aon-editDataTable-dateColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-numberColumn,
		 aon-editDataTable-numberColumn,aon-editDataTable-numberColumn,aon-editDataTable-numberColumn"
		var="to">

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date}" />
			</f:facet>
			<aon:outputText value="#{to.invoice.issueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_id}" />
			</f:facet>
			<aon:outputText value="#{to.item.product.code}" />
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_description}" />
			</f:facet>
			<aon:outputText value="#{to.item.product.name} #{to.item.detail}" />
		</aon:column>
<!-- 
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{productBundle.product_category}" />
			</f:facet>
			<aon:outputText value="#{to.item.product.category.name}" />
		</aon:column> -->
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_quantity}" />
			</f:facet>
			<aon:outputText value="#{to.quantity}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_price}" />
			</f:facet>
			<aon:outputText value="#{to.price}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_discount}" />
			</f:facet>
			<aon:outputText value="#{to.discountExpression.discountExpr}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_amount}" />
			</f:facet>
			<aon:outputText value="#{to.taxableBase}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

	</aon:editDataTable>
	<aon:dataScroller2 for="products" showNote="true" />
</ui:composition>
