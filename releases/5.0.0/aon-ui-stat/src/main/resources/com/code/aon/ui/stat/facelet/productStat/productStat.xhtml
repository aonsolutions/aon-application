<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml"
	xmlns:a4j="http://richfaces.org/a4j">
	<ui:define name="content">
		<aon:form id="records">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="Informacion del Producto" />
				<ui:define name="beforeToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="item_form"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">
					<aon:outputLabel value="#{statBundle.registry_stat_code}" />
					<aon:outputText value="#{productStat.item.product.code}" size="30" />
					<aon:outputLabel value="#{statBundle.registry_stat_customer}" />
					<aon:outputText value="#{productStat.item.product.name}" size="70" />
				</aon:panelGrid>

				<aon:panelTabSet switchType="client">
					<aon:panelTab id="tab1"
						label="Stockaje">
						
					<aon:panelGrid columns="2">
					<aon:outputLabel value="#{statBundle.product_stat_stock}" />
					<aon:outputText value="#{productStat.totalStock}" size="70">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:outputLabel value="#{statBundle.product_stat_pending}" />
					<aon:outputText value="#{productStat.pendingSaleQuantity}" size="70"
						disabled="true">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:outputLabel value="#{statBundle.product_stat_recieve}" />
					<aon:outputText value="#{productStat.pendingPurhaseQuantity}"
						size="70" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:outputLabel value="#{statBundle.product_stat_price}" />
					<aon:outputText value="#{productStat.item.price}" size="70"
						 >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:outputLabel value="#{statBundle.product_stat_puc}" />
					<aon:outputText value="0" size="70"  >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:outputLabel value="#{statBundle.product_stat_ppc}" />
					<aon:outputText value="#{productStat.averagePurchasePrice}" size="70">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:outputLabel value="#{statBundle.product_stat_puv}" />
					<aon:outputText value="0" size="70"  >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:outputLabel value="#{statBundle.product_stat_theoric_stock}" />
					<aon:outputText value="#{productStat.theoricStock}" size="70">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:panelGrid>
					</aon:panelTab>
					<aon:panelTab id="tab2"
						label="#{statBundle.product_stat_latest_entries}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/productStat/latestEntriesList.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab3"
						label="#{statBundle.product_stat_latest_sales}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/productStat/latestShipmentsList.xhtml" />
					</aon:panelTab>
				</aon:panelTabSet>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
