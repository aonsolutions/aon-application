<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="pending" value="#{registryStat.pendingInvoiceModel}"
		rows="20"
		columnClasses="aon-editDataTable-textColumn, aon-editDataTable-dateColumn, aon-editDataTable-textColumn,aon-editDataTable-numberColumn"
		var="to">

	<!--  	<aon:rowSelector action="saleInvoice_form">
			<aon:actionListener method="#{saleInvoice.onEditSearch}"/>	
			<f:setPropertyActionListener value="registry_stats"	target="#{saleInvoice.backAction}" />
			<f:setPropertyActionListener value="#{to.id}"	target="#{saleInvoice.to.id}" />
			<aon:actionListener method="#{saleInvoice.onInvoiceSelect}"/>	
		</aon:rowSelector>-->
		
		<h:column>
			<f:facet name="header">
				<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
			</f:facet>
			<h:outputText value="#{to.referenceCode}" />
		</h:column>

		<h:column>
			<f:facet name="header">
				<h:panelGroup>
					<h:outputText value="#{bundle.aon_date}" />
				</h:panelGroup>
			</f:facet>
			<h:outputText value="#{to.issueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</h:outputText>
		</h:column>

		<!--  <h:column>
			<f:facet name="header">
				<h:panelGroup>
					<h:outputText value="#{customerBundle.customer_customer}" />
				</h:panelGroup>
			</f:facet>
			<h:outputText value="#{to.registryName}" />
		</h:column>

		<h:column>
			<f:facet name="header">
				<h:panelGroup>
					<h:outputText value="#{bundle.aon_company_document}" />
				</h:panelGroup>
			</f:facet>
			<h:outputText value="#{to.registryDocument}" />
		</h:column>-->
		<h:column>
			<f:facet name="header">
				<h:panelGroup>
					<h:outputText value="#{bundle.aon_status}" />
				</h:panelGroup>
			</f:facet>
			<aon:outputText value="#{to.status}" />
		</h:column>
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_total}" />
			</f:facet>
			<aon:outputText value="#{registryStat.pendingInvoicesTotalPrice}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

	</aon:dataTable>


	<aon:dataScroller2 for="pending" showNote="true" />
</ui:composition>
