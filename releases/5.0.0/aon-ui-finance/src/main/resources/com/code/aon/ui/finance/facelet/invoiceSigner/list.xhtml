<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="invoiceSignerList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_invoice_signing_module}" />
				<ui:param name="controller" value="#{invoiceSigner}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
					<ui:include src="/com/code/aon/ui/sign/facelet/signer/signToolbar.xhtml">
						<aon:methodParam name="signActionListener" value="#{invoiceSigner.onSignSelected}" type="actionListener" />
						<aon:methodParam name="cancelSignActionListener" value="#{invoiceSigner.onCancelSignSelected}" type="actionListener" />					
						<ui:param name="signController" value="#{saleInvoiceSigner}" />
						<ui:param name="skipSignButton" value="#{invoiceSigner.selectionEmpty}" />
						<ui:param name="skipCancelSignButton" value="#{invoiceSigner.selectionEmpty}" />
						<ui:param name="signButtonReRender" value="invoiceSignerDataDiv,aonToolbar" />
					</ui:include>
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:div styleClass="aon-toolbar" rendered="#{invoiceSigner.model.rowCount > 0}">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						ajaxSingle="true" reRender="invoiceSignerDataDiv, aonToolbar"
						actionListener="#{invoiceSigner.checkAll}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						ajaxSingle="true" reRender="invoiceSignerDataDiv, aonToolbar"
						actionListener="#{invoiceSigner.checkNone}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
				</aon:div>

				<aon:div id="invoiceSignerDataDiv">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{invoiceSigner}" />
						<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
						<ui:param name="skipSelectButton" value="#{true}" />
						<ui:define name="columns">

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:selectBooleanCheckbox id="Included_Row_checked"
									value="#{invoiceSigner.rowChecked}"
									ajaxSingle="true" reRender="aonToolbar" />	
							</aon:column>
		
							<aon:column alias="Invoice.referenceCode"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
								</f:facet>
								<aon:outputText value="#{to.referenceCode}" />
							</aon:column>
	
							<aon:column alias="Invoice.registryName"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{customerBundle.customer_customer}" />
								</f:facet>
								<aon:outputText value="#{to.registryName}" />
							</aon:column>
		
							<aon:column alias="Invoice.issueDate"
								styleClass="aon-editDataTable-textColumn aon-width-150">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_date}" />
								</f:facet>
								<aon:outputText value="#{to.issueDate}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:column>
	
							<aon:column alias="Invoice.status"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_status}" />
								</f:facet>
								<aon:outputText value="#{to.status}" />
							</aon:column>
	
							<aon:column alias="Invoice.signed"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{signBundle.sign_signature}" />
								</f:facet>
								<aon:outputText value="&#160;" rendered="#{to.signed}"
									title="#{signBundle.sign_signed}"
									styleClass="aon-icon aon-icon-signed" />
								<aon:outputText value="&#160;" rendered="#{!to.signed}"
									title="#{signBundle.sign_sign_pending}"
									styleClass="aon-icon aon-icon-unsigned" />
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/sign/facelet/signer/modal.xhtml" >
			<ui:param name="signButtonreRender" value="invoiceSignerDataDiv,aonToolbar" />
			<ui:param name="skipSmartCardTab" value="#{true}" />
			<aon:methodParam name="signActionListener" value="#{invoiceSigner.onSignSelected}" type="actionListener" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />		
	</ui:define>
</ui:composition>
