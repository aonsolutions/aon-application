<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="albumForm" partialSubmit="false">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
			cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.album}" />					
				</aon:div>		
			
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" rendered="#{album.to!=null or album.new}"
							actionListener="#{album.onAccept}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:commandButton id="cancel"
							value="#{bundle.aon_cancel}" rendered="#{album.to!=null or album.new}" immediate="#{true}"
							actionListener="#{album.onCancel}" action="album_list"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!album.new}" immediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{album.onRemoveI18n}" confirmAction="album_list"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{album.onReset}" rendered="#{!album.new}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<aon:div styleClass="aon-content-subtitle-internal">
					<aon:outputText
						value="#{album.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</aon:div>
			</aon:div>
			<aon:div id="aon-scroll-area" forceId="#{true}">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:panelGrid columns="2">
						<aon:panelGrid columns="2" dir="true" styleClass="aon-form-table"
							columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

							<aon:outputLabel for="Album_alias" style="width:100px"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.album_alias}" />
							<aon:inputText id="Album_alias"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="32" maxlength="32"
								value="#{album.to.alias}" />

							<aon:outputLabel for="Album_publishDate" style="width:100px"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.album_publish_date}" />
							<aon:selectInputDate id="Album_publishDate" 
								 style="z-index:2001;margin:0;vertical-align:middle;"
								 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								 value="#{album.to.publishDate}" renderAsPopup="true"
								 popupDateFormat="#{bundle.aon_date_pattern}">
								 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
							</aon:selectInputDate>			

							<aon:outputLabel for="Album_itemsPerPage"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.album_items_per_page}" />
							<aon:inputText id="Album_itemsPerPage"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="5" maxlength="5"
								value="#{album.to.itemsPerPage}" />
								
							<aon:outputLabel for="AlbumDetail_title"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.album_title}" />
							<aon:inputText id="AlbumDetail_title"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="128" maxlength="128"
								value="#{album.toI18n.title}" />
							
							<aon:outputLabel for="AlbumDetail_description"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.album_description}" />
							<aon:inputTextarea id="AlbumDetail_description" style="width:300px;height:60px"
								styleClass="aon-form-input-text aon-form-input-text-number" partialSubmit="false"
								value="#{album.toI18n.description}" />

							<aon:outputLabel for="AlbumDetail_alt"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.album_alt}" />
							<aon:inputText id="AlbumDetail_alt"
								styleClass="aon-form-input-text aon-form-input-text-number"
								size="64" maxlength="64"
								value="#{album.toI18n.alt}" />
							
							<aon:outputLabel for="Album_image"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.album_image}" />
							<aon:div>
								<ice:graphicImage
									id="Album_image" 
									url="#{album.to.image}.thumbnail" 
									alt="#{album.to.image}"/>
								<aon:commandButton
									title="OPEN"
									value="OPEN"
									rendered="#{!album.imageSelectionVisible}"
									immediate="true"
									actionListener="#{album.onShowImages}"
									styleClass="aon-icon-attach aon-content-toolbar-item">
								</aon:commandButton>
								<aon:commandButton
									title="CLOSE"
									value="CLOSE"
									rendered="#{album.imageSelectionVisible}"
									immediate="true"
									actionListener="#{album.onCloseImages}"
									styleClass="aon-icon-attach aon-content-toolbar-item">
								</aon:commandButton>
								<aon:div visible="#{album.imageSelectionVisible}"
									forceId="#{true}">
									<aon:div styleClass="aon-scroll-area-internal">
										<aon:panelGrid columns="2" style="width:100%;">
										    <ice:tree id="tree" style="height:250px"
										              value="#{gallery.tree}"
										              var="item"
										              hideRootNode="false"
										              hideNavigation="false">
										        <ice:treeNode>
										            <f:facet name="icon">
										                <aon:panelGroup style="display: inline">
										                     <aon:graphicImage value="#{item.userObject.icon}"/>
										                </aon:panelGroup>
										            </f:facet>
										            <f:facet name="content">
										                <aon:panelGroup style="display: inline">
										                    <ice:commandLink rendered="#{!item.userObject.selected}"
																	immediate="#{true}"
										                            actionListener="#{item.userObject.onSelectFolder}"
										                            value="#{item.userObject.text}"/>
										                    <ice:outputText value="#{item.userObject.text}" 
										                    		rendered="#{item.userObject.selected}"
										                    		style="color:white;background:darkblue"/>
										                </aon:panelGroup>
										            </f:facet>
										        </ice:treeNode>
										    </ice:tree>
										    <aon:panelGroup>
												<ice:panelSeries id="panelSeries" value="#{gallery.model}" var="item">
													<aon:panelGrid columns="2" cellpadding="5px" cellspacing="0px">
									                    <ice:commandLink
									                    	immediate="#{true}"
								                            actionListener="#{album.onSelectImage}">
												            <ice:graphicImage url="#{item.thumb}" alt="#{item.name}"/>
												        </ice:commandLink>
									                    <ice:commandLink
									                    	immediate="#{true}"
								                            actionListener="#{album.onSelectImage}"
								                            value="#{item.name}"/>
													</aon:panelGrid>
												</ice:panelSeries>
											</aon:panelGroup>
										</aon:panelGrid>
									</aon:div>
								</aon:div>
							</aon:div>
							
						</aon:panelGrid>
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>
</ui:composition>

</body>
</html>
