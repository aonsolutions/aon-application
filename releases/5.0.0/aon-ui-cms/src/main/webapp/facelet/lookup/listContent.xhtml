<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<!-- start toolbar navigation -->
	<aon:div styleClass="aon-content-toolbar" rendered="#{lookup.showSearchButtons}">
		<aon:div styleClass="aon-content-toolbar-internal">
			<aon:div styleClass="aon-content-toolbar-item-group">

				<aon:commandButton value="#{bundle.aon_search}"
					actionListener="#{lookup.onListCancel}"				
					styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
					onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
					onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
					accesskey="#{bundle.aon_key_search}"/>
				<aon:commandButton value="#{bundle.aon_cancel}"
					actionListener="#{lookup.onCloseWindow}"
					styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
					onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
					onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'"
					accesskey="#{bundle.aon_key_cancel}" />

			</aon:div>
		</aon:div>
	</aon:div>
	<!-- end toolbar navigation -->
	<aon:div styleClass="aon-popup-scroll-Body">
		<aon:panelGroup styleClass="aon-scroll-area-internal">
			<aon:panelGroup>
				<aon:dataTable id="#{lookup.beanName}Data" styleClass="aon-table"
					var="to" value="#{lookup.model}" rows="20"
					headerClass="aon-table-header" footerClass="aon-table-foot"
					columnClasses="aon-table-body,aon-table-body,"
					rowClasses="aon-table-row-odd, aon-table-row-even">

					<ui:include src="#{lookup.listPagePath}" />

				</aon:dataTable>
			</aon:panelGroup>

			<aon:div styleClass="aon-form-note" rendered="#{model.rowCount == 0}">
				<aon:div styleClass="aon-form-note-internal">
					<aon:panelGroup>
						<aon:outputText value="#{bundle.aon_search_no_results}" />
					</aon:panelGroup>
				</aon:div>
			</aon:div>

			<aon:panelGroup styleClass="aon-datascroller"
				rendered="#{lookup.model.rowCount>0}">
				<aon:panelGrid columns="2"
					columnClasses="aon-datascroller-text,aon-datascroller-buttons">
					<aon:dataPaginator for="#{lookup.beanName}Data"
						rowsCountVar="rowsCount" firstRowIndexVar="firstRowIndex"
						lastRowIndexVar="lastRowIndex">
						<h:outputFormat value="#{bundle.aon_scroll}">
							<f:param value="#{firstRowIndex}" />
							<f:param value="#{lastRowIndex}" />
							<f:param value="#{rowsCount}" />
						</h:outputFormat>
					</aon:dataPaginator>
					<aon:dataPaginator for="#{lookup.beanName}Data" fastStep="5"
						paginator="true" paginatorMaxPages="5"
						rendered="#{lookup.model.rowCount>20}">

						<f:facet name="first">
							<aon:div styleClass="aon-datascroller-button-first">&#160;</aon:div>
						</f:facet>
						<f:facet name="last">
							<aon:div styleClass="aon-datascroller-button-last">&#160;</aon:div>
						</f:facet>
						<f:facet name="previous">
							<aon:div styleClass="aon-datascroller-button-previous">&#160;</aon:div>
						</f:facet>
						<f:facet name="next">
							<aon:div styleClass="aon-datascroller-button-next">&#160;</aon:div>
						</f:facet>
						<f:facet name="fastforward">
							<aon:div styleClass="aon-datascroller-button-fastforward">&#160;</aon:div>
						</f:facet>
						<f:facet name="fastrewind">
							<aon:div styleClass="aon-datascroller-button-fastrewind">&#160;</aon:div>
						</f:facet>
					</aon:dataPaginator>

				</aon:panelGrid>
			</aon:panelGroup>
		</aon:panelGroup>
	</aon:div>
</ui:composition>

</body>
</html>
