<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-ice-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="templateList">
			
			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
			cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.template}" />					
				</aon:div>		
			
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="template_upload" actionListener="#{template.onNewTemplate}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!template.checklistEmpty}" inmediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{template.onRemoveSelected}" confirmAction="template_list"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="home" styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_close}"/>
					</aon:div>
				</aon:div>
			<!-- end toolbar navigation -->
			</aon:panelGrid> 
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">	
				
					<aon:div styleClass="aon-content-subTitle">
						<aon:div styleClass="aon-content-subTitle-internal">
							<aon:outputText value="Listado registros" />
						</aon:div>
					</aon:div>

					<aon:dataTable id="templateDataList" columnWidths="120,*,30,100,80,120" 
						value="#{template.templates}" var="to" rows="0"
						rowClasses="aon-dataTable-odd, aon-dataTable-even"
						columnClasses="aon-table-body aon-table-body-icon,
						 	aon-table-body aon-table-body-string,
						 	aon-table-body aon-table-body-icon,
						 	aon-table-body aon-table-body-string,
						 	aon-table-body aon-table-body-icon,
						 	aon-table-body aon-table-body-icon">

						<aon:column>
							<f:facet name="header">
								<aon:div>
									<aon:outputText value="#{bundle.aon_check}" />
									<aon:div>
										<aon:commandLink id="all" value="#{bundle.aon_check_all}" 
										styleClass="aon-table-header-link-secundary"
										onclick="selectAll();return false;" />
										<aon:commandLink id="none" value="#{bundle.aon_uncheck_all}"
										styleClass="aon-table-header-link-secundary"
										onclick="unSelectAll();return false;" />
										<aon:commandLink id="inverse" value="#{bundle.aon_inverse_all}"
										styleClass="aon-table-header-link-secundary"
										onclick="inverseAll();return false;" />
									</aon:div>										
								</aon:div>	
							</f:facet>
							<aon:selectBooleanCheckbox id="Row_checked" forceId="#{true}"
									partialSubmit="true" rendered="#{!to.defaultTemplate}"
									value="#{template.rowChecked}"/>
							<aon:graphicImage id="Template_selected_blocked" rendered="#{to.defaultTemplate}"
								url="/images/cms/blocked.gif" alt="#{appBundle.template_blocked}"/>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText for="Template_name" value="#{appBundle.template_name}" />
							</f:facet>
							<aon:outputText id="Template_id" value="#{to.name}"/>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText for="Template_defaultMenu" value="#{appBundle.template_defaultTemplate}" />
							</f:facet>
							<aon:selectBooleanCheckbox id="Template_defaultTemplate" forceId="#{true}"
									value="#{to.defaultTemplate}" partialSubmit="true"
									rendered="#{!to.defaultTemplate}"
									valueChangeListener="#{template.defaultTemplateChanged}"/>
							<aon:graphicImage id="Template_default_blocked" rendered="#{to.defaultTemplate}"
								url="/images/cms/selected.gif" alt="#{appBundle.template_blocked}"/>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText for="Template_author" value="#{appBundle.template_author}" />
							</f:facet>
							<aon:outputText id="Template_author" value="#{to.author}"/>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText for="Template_version" value="#{appBundle.template_version}" />
							</f:facet>
							<aon:outputText id="Template_version" value="#{to.version}"/>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText for="Template_creationDate" value="#{appBundle.template_creationDate}" />
							</f:facet>
							<aon:outputText id="Template_creationDate" value="#{to.creationDate}"/>
						</aon:column>

					</aon:dataTable>

				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
