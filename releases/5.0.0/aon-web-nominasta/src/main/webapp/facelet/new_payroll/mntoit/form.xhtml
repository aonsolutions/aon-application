<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="mntoitForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_newpayroll_it}" />
				<ui:param name="controller" value="#{itWizard}" />

				<aon:methodParam name="saveAction" value="mntoit_form" />
				<aon:methodParam name="searchAction" value="mntoit_search" />
				<aon:methodParam name="backAction" value="mntoit_list" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSaveButton" value="true" />
				<ui:param name="skipCancelButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				<ui:param name="skipSpin" value="true" />

				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="parteconf-finalize"
						value="FINALIZAR" 
						rendered="#{!itWizard.finished}"
						actionListener="#{itWizard.onFinalize}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}" />
					<aon:commandButton id="parteconf-save-search"
						value="CONFIRMAR Y BUSCAR" 
						rendered="#{itWizard.finished}"
						action="mntoit_search"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}" >
						<aon:actionListener method="#{itWizard.onSave}"/>
						<aon:actionListener method="#{itWizard.onResetModel}"/>
					</aon:commandButton>
					<aon:commandButton id="parteconf-save-select"
						value="CONFIRMAR Y SELECCIONAR" 
						rendered="#{itWizard.finished}"
						action="mntoit_list"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}" >
						<aon:actionListener method="#{itWizard.onSave}"/>
						<aon:actionListener method="#{itWizard.onResetTo}"/>
					</aon:commandButton>
				</ui:define>
				
			</ui:decorate>
			
			<ui:include 
				src="./navigation/toolbar.xhtml">
				<ui:param name="flowPosition" value="form" />
			</ui:include>

			<!--	FIN HEADER & TOOLBAR	-->

			<aon:div id="mntoitFormData" styleClass="aon-scroll-area">
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_newpayroll_it_employee_data}" />
				</f:facet>
				<aon:panelGrid columns="6" dir="true" width="100%">
					<aon:outputLabel value="#{appBundle.aon_payroll_principales_clientes_numdoc}" />
					<aon:outputText value="#{itWizard.to.persona.numdoc}" />

					<aon:outputLabel value="#{bundle.aon_name}" />
					<aon:outputText value="#{itWizard.to.persona.descripcion} #{itWizard.to.persona.apellido2}, #{itWizard.to.persona.nombre}" />
					
					<aon:outputLabel value="#{appBundle.aon_payroll_pricipales_personas_numss}" />
					<aon:outputText value="#{itWizard.to.persona.numss}" />
				</aon:panelGrid>
			</aon:panel>
			
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_newpayroll_it_contract_data}" />
				</f:facet>
				<aon:dataTable id="contratosData" value="#{itWizard.contratos}"
					var="to" rows="20"
					columnClasses="
						aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-dateColumn, aon-editDataTable-dateColumn">

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_trabajador_empresa}" />
						</f:facet>
						<aon:outputText value="#{to.empresa.descripcion}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_trabajador_activ}" />
						</f:facet>
						<aon:outputText value="#{to.actividad.descripcion}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecha_alta}" />
						</f:facet>
						<aon:outputText value="#{to.fecalt}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecha_baja}" />
						</f:facet>
						<aon:outputText value="#{to.fecbaj}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>
			</aon:panel>
			
			<aon:div styleClass="aon-scroll-area" id="parteit_form" style="float:left;">
			<aon:panel>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_newpayroll_it_wizard_parteit}" />
				</f:facet>
					<aon:panelGrid columns="2" dir="true" width="auto">
						<aon:outputLabel
							value="#{appBundle.aon_payroll_newpayroll_status_change}" />
						<aon:div id="trabajadorStatus">
							<aon:outputText 
								rendered="#{itWizard.finished}"
								value="#{itWizard.parteRen.status}"/>
							<aon:selectOneMenu id="estado"
								rendered="#{!itWizard.finished}"
								value="#{itWizard.parteRen.status}">
								<f:selectItems value="#{itWizard.listaItStatus}" />
								<a4j:support event="onchange" reRender="trabajadorStatus">
									<aon:actionListener method="#{itWizard.onChangeStatus}" />
								</a4j:support>
							</aon:selectOneMenu>
							<aon:outputLabel
								rendered="#{itWizard.renovacion}"
								value="&#160;#{appBundle.aon_payroll_newpayroll_it_ren_number}" />
							<aon:inputText size="2"
								rendered="#{itWizard.renovacion}"
								value="#{itWizard.numParteRenovacion}"/>
						</aon:div>
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_mntoit_fecha}" />
						<aon:div>
							<aon:outputText 
								rendered="#{itWizard.finished}"
								value="#{itWizard.parteRen.fecconf}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate id="fecha" 
								value="#{itWizard.parteRen.fecconf}" inputSize="10"
								renderAsPopup="true" enableManualInput="true"
								rendered="#{!itWizard.finished}"
								required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{appBundle.aon_date_pattern}" />
						</aon:div>
	
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_mntoit_colegiado}" />
						<aon:div>
							<aon:outputText 
								rendered="#{itWizard.finished}"
								value="#{itWizard.parteRen.numcol}"/>
							<aon:inputText id="colegiado"
								rendered="#{!itWizard.finished}"
								value="#{itWizard.parteRen.numcol}" >
								<a4j:support event="onblur">
									<aon:actionListener method="#{itWizard.onCheckNumCol}" />
								</a4j:support>
							</aon:inputText>
						</aon:div>
	
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_mntoit_cias}" />
						<aon:div>
							<aon:outputText 
								rendered="#{itWizard.finished}"
								value="#{itWizard.parteRen.cias}"/>
							<aon:inputText id="cias"
								rendered="#{!itWizard.finished}"
								value="#{itWizard.parteRen.cias}" >
								<a4j:support event="onblur">
									<aon:actionListener method="#{itWizard.onCheckCias}" />
								</a4j:support>
							</aon:inputText>
						</aon:div>
	
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_inciit_tipoit}" />
						<aon:div>
							<aon:outputText 
								rendered="#{itWizard.finished}"
								value="#{itWizard.parteRen.parteit.tipoit}"/>
							<aon:selectOneMenu id="tipoit"
								rendered="#{!itWizard.finished}"
								value="#{itWizard.parteRen.parteit.tipoit}">
								<f:selectItems value="#{itWizard.listaTipoIt}" />
							</aon:selectOneMenu>
						</aon:div>	
						
						<aon:outputLabel
							rendered="#{itWizard.recaida}" 
							value="#{appBundle.aon_payroll_principales_integralTra_recaida_ant_it}" />
						<aon:selectBooleanCheckbox
							rendered="#{itWizard.recaida}" 
							disabled="#{itWizard.finished}"
							value="#{itWizard.parteRen.parteit.recaida}"/>
	
					</aon:panelGrid>
				</aon:panel>
			</aon:div>
				
			<aon:div styleClass="aon-scroll-area" id="parteit_list" style="float:left;">
					<aon:panel>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_mntoit_partes_baja}" />
						</f:facet>
						<aon:editDataTable id="parteitList" var="to" rows="55" width="auto"
								value="#{itWizard.parteitList}" 
								columnClasses="
								aon-editDataTable-dateColumn, aon-editDataTable-dateColumn, 
								aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
								aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
								aon-editDataTable-buttonsColumn">
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecha_baja}" />
								</f:facet>
								<aon:outputText value="#{to.id.fecini}" >
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:column>
							 
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_fecha_alta}" />
								</f:facet>
								<aon:outputText value="#{to.fecfin}"  >
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_tipo_it}" />
								</f:facet>
								<aon:outputText value="#{to.tipoit}" />
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_recaida_ant_it}" />
								</f:facet>
								<aon:selectBooleanCheckbox value="#{to.recaida}" disabled="#{true}"/>
								<!--  
								<aon:outputText value="#{to.recaida}"  />
								-->
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_procesado}" />
								</f:facet>
								<aon:selectBooleanCheckbox value="#{to.procesado}" disabled="#{true}"/>
								<!--  
								<aon:outputText value="#{to.procesado}"  />
								-->
							</aon:column>
						</aon:editDataTable>	
					</aon:panel>			
					
					<aon:panel rendered="#{(itWizard.parteconfList!=null)}">
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_mntoit_partes_confirm}" />
						</f:facet>
							
						<aon:editDataTable id="pconfData" var="to" rows="20"
							value="#{itWizard.parteconfList}" 
							columnClasses=" 
							aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, 
							aon-editDataTable-numberColumn, aon-editDataTable-dateColumn, 
							aon-editDataTable-textColumn">
						
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_payroll_principales_mntoit_numero}" />
								</f:facet>
								<aon:outputText value="#{to.id.numero}"  />
							</aon:column>
							
							<aon:column  >
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_payroll_principales_mntoit_colegiado}" />
								</f:facet>
								<aon:outputText value="#{to.numcol}"  />
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_payroll_principales_mntoit_cias}" />
								</f:facet>
								<aon:outputText value="#{to.cias}"  />
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_payroll_principales_mntoit_fecha}" />
								</f:facet>
								
								<aon:outputText value="#{to.fecconf}"  >
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_payroll_principales_mntoit_procesado}" />
								</f:facet>
								<aon:outputText value="#{to.parproc}"  />
							</aon:column>
						</aon:editDataTable>
	<!--  
						<aon:dataScroller2 for="pconfData" showNote="true" />
	-->					
					</aon:panel>
				
			</aon:div>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
</body>
</html>
