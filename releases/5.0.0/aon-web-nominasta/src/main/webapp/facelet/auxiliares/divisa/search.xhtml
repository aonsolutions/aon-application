<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="divisaMaestroSearch">

		<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_auxiliares_divisa}" />
				<ui:param name="controller" value="#{divisaMaestro}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{divisaMaestro.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="divisaMaestro_list" />				
				
					<aon:outputLabel for="Divisa_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="divisa_cdg" size="5" maxlength="3"
						valueChangeListener="#{divisaMaestro.addExpression}" />

					<aon:outputLabel for="Divisa_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Divisa_description" size="30" maxlength="25"
						valueChangeListener="#{divisaMaestro.addExpression}" />
						
					<aon:outputLabel for="Divisa_redondeo" value="#{appBundle.aon_payroll_auxiliares_cotizacion__pro}" />
					<aon:selectOneMenu id="Divisa_redondeo" value="#{divisaMaestro.to.redondeo}" valueChangeListener="#{divisaMaestro.addEqualExpression}" >	
					   <aon:enumConverter enum="com.code.aon.payroll.enumeration.Divisas" />	
					    <f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{divisaMaestro.listaRedondeos}"/>											
					</aon:selectOneMenu>
						
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
