<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="reportsMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300">

					<aon:panelGrid id="group_finance"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-treasury aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_menu_group}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="finance_charge" 
									action="finance_search-charge" actionListener="#{finance.onEditSearchCharge}"
									value="#{financeBundle.finance_charge_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="finance_payment" 
									action="finance_search" actionListener="#{finance.onEditSearchPayment}"
									value="#{financeBundle.finance_payment_module}"/>
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="aon_fbatch" action="fbatch_search"
									actionListener="#{fbatch.onEditSearch}"
									value="#{financeBundle.finance_fbatch_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="financialStatement" 
									action="financialStatement_search" actionListener="#{financialStatement.onReset}"
									value="#{accountingBundle.accounting_financial_statements}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
