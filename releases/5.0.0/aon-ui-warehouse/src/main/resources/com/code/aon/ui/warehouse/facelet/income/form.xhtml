<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="incomeForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{warehouseBundle.warehouse_income_module}" />
					<ui:param name="controller" value="#{income}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{!income.pending}" />
					<ui:param name="skipRemoveButton" value="#{!income.pending}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton id="purchaseTransfer"
							value="#{warehouseBundle.warehouse_income_purchase}"
							immediate="#{true}" rendered="#{!income.new and income.pending}"
							styleClass="aon-finding-toolbar-item aon-icon-sincronize"
							actionListener="#{income.onPurchaseTransferShow}"
							reRender="showPurchaseTransferWindow">
							<f:setPropertyActionListener target="#{income.showPurchaseTransferWindow}"
								value="#{true}" />
						</aon:commandButton>
						<c:if test="#{aonRole.financeOperator}">
							<aon:commandButton id="invoice"
								value="#{warehouseBundle.warehouse_income_to_invoice}"
								immediate="#{true}" rendered="#{income.pending and incomeDetail.model.rowCount > 0}"
								styleClass="aon-finding-toolbar-item aon-icon-favorite"
								actionListener="#{income.onInvoiceShow}"
								reRender="showInvoiceWindow">
								<f:setPropertyActionListener target="#{income.showInvoiceWindow}"
									value="#{true}" />
							</aon:commandButton>
						</c:if>
						<aon:htmlCommandLink id="incomeForm-report" value="#{warehouseBundle.warehouse_income}"
							target="_new" rendered="#{!income.new and incomeDetail.model.rowCount > 0}"
							action="#{report.onExecute}" 
							disabled="#{incomeDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="incomeForm" />
							<f:param name="outputFormat" value="PDF" />
						</aon:htmlCommandLink>
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Income_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<aon:div>
								<aon:inputText id="Income_series" 
									value="#{income.to.series}" rendered="#{income.pending}"
									size="4" />
								<aon:inputText id="Income_number" styleClass="aon-margin-left" 
									value="#{income.to.number}" rendered="#{income.pending}"
									required="true" size="7" />
								<aon:outputText styleClass="aon-bold aon-margin-right"
									value="#{income.to.referenceCode}"
									rendered="#{!income.pending}" />
							</aon:div>
							<aon:div>
								<c:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Income_securityLevel"
										value="#{income.to.confidential}"
										rendered="#{income.pending}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{income.pending}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{!income.pending and income.to.confidential}" />
								</c:if>

								<aon:outputText styleClass="aon-margin-left"
									value="#{income.to.status}" />
								<aon:outputText styleClass="aon-italic aon-margin-left"
									value="(#{financeBundle.finance_invoice}: "
									rendered="#{income.invoiced}" />
								<aon:outputText styleClass="aon-bold"
									value="#{income.invoiceCode}"
									rendered="#{income.invoiced}" />
								<aon:outputText styleClass="aon-italic" value=")"
									rendered="#{income.invoiced}" />
							</aon:div>
						</h:panelGrid>
 					</aon:div>

					<aon:outputLabel for="Income_issueTime" 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Income_issueTime"
						value="#{income.to.issueTime}" 
						required="true" disabled="#{!income.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Supplier_id" 
						value="#{supplierBundle.supplier_supplier}" />
					<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="Supplier_id" 
								value="#{income.to.supplier.registry.id}"
								disabled="#{!income.pending}" size="5" 
								lookupProperty="registry" lookup="#{supplierLookup}" 
								lookupChangeListener="#{income.supplierData}" 
								reRender="Supplier_full_name,Supplier_registry_document,IncomeAddress,
									Income_scope,Income_defaultPayMethod,payMethodDiv"
								ajaxSingle="true" required="true" />
							<aon:lookupButton
								windowTitle="#{supplierBundle.supplier_selection}"
								disabled="#{!income.pending}" minHeight="460" minWidth="650"
								property="#{income.to.supplier.registry}" lookupProperty="registry" lookup="#{supplierLookup}" 
								lookupChangeListener="#{income.supplierData}" 
								selectReRender="Supplier_id,Supplier_full_name,Supplier_registry_document,IncomeAddress,
									Income_scope,Income_defaultPayMethod,payMethodDiv"
								actionType="search">
							</aon:lookupButton>
							<aon:lookupButton 
								windowTitle="#{supplierBundle.supplier_new}"
								disabled="#{!income.pending}" minWidth="650" minHeight="600"
								property="#{income.to.supplier.registry}" lookupProperty="registry" lookup="#{supplierLookup}"
								lookupChangeListener="#{income.supplierData}"
								selectReRender="Supplier_id,Supplier_full_name,Supplier_registry_document,IncomeAddress,
									Income_scope,Income_defaultPayMethod,payMethodDiv"
								actionType="new">
							</aon:lookupButton>
							<aon:inputText id="Supplier_full_name" 
								value="#{(income.to.supplier.registry.fullName!=null)?(income.to.supplier.registry.fullName):('')}"
								disabled="true" size="60" />
						</a4j:region>
					</aon:div>

					<aon:outputLabel for="Supplier_registry_document" 
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Supplier_registry_document" 
						value="#{income.to.supplier.registry.document}"
						disabled="true" size="10" />

					<aon:outputLabel for="Income_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="IncomeAddress">
						<aon:selectOneMenu id="Income_address" 
							value="#{income.to.registryAddress}" rendered="#{income.addressCount > 0}"
							disabled="#{!income.pending}">
							<f:selectItems value="#{income.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{registryBundle.registry_no_address_available}"
							rendered="#{income.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Income_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Income_scope" 
						value="#{income.to.scope}"
						disabled="#{!income.pending}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Income_warehouse" 
						value="#{warehouseBundle.warehouse_warehouse}" />
					<aon:selectOneMenu id="Income_warehouse" 
						value="#{income.warehouse}"
						disabled="#{!income.new}">
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Income_workPlace" 
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Income_workPlace" 
						value="#{income.to.workPlace}"
						disabled="#{!income.pending}">
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Income_defaultPayMethod" 
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneRadio id="Income_defaultPayMethod" 
						value="#{income.defaultPayMethod}"
						disabled="#{!income.pending}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{warehouseBundle.warehouse_income_habitual}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{warehouseBundle.warehouse_income_to_specify}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Income_total" 
						value="#{bundle.aon_total}" />
					<aon:outputText id="Income_total" styleClass="aon-bold" 
						value="#{income.totalPrice}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:panel rendered="#{income.defaultPayMethod != null and !income.defaultPayMethod}">
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_pay_method}" />
						</f:facet>
						<aon:panelGrid columns="7" style="width:100%; font-size:0.9em;"
							rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
							columnClasses="aon-panelGrid-even aon-width-200,
								aon-panelGrid-even aon-width-80,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-110,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-auto,
								aon-panelGrid-even aon-width-200">

							<aon:outputText value="#{bundle.aon_type}"/>
							<aon:outputText value="#{registryBundle.registry_number_of_payments}" />
							<aon:outputText value="#{registryBundle.registry_days_to_first_payment}" />
							<aon:outputText value="#{registryBundle.registry_days_between_payments}" />
							<aon:outputText value="#{registryBundle.registry_payment_days}" />
							<aon:outputText value="#{configBundle.config_bank}" />
							<aon:outputText value="#{configBundle.config_bank_account}" />

							<aon:selectOneMenu id="Income_payMethod" 
								value="#{income.to.payMethod}"
								disabled="#{!income.pending}">
								<f:selectItems value="#{configCollections.payMethods}" />
							</aon:selectOneMenu>
							<aon:inputText id="Income_numberOfPayments"
								value="#{income.to.numberOfPayments}"
								disabled="#{!income.pending}" size="5" >
								<f:validateLongRange minimum="1" />
							</aon:inputText>	
							<aon:inputText id="Income_daysToFirstPayment"
								value="#{income.to.daysToFirstPayment}"
								disabled="#{!income.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Income_daysBetweenPayments"
								value="#{income.to.daysBetweenPayments}"
								disabled="#{!income.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Income_paymentDays"
								value="#{income.to.paymentDays}" 
								disabled="#{!income.pending}" size="5" />
							<aon:div styleClass="aon-lookup">
								<a4j:region>
									<aon:lookupInputText id="Income_bank_code"
										value="#{income.to.bank.code}"
										disabled="#{!income.pending}" size="5"
										property="#{income.to.bank}" lookup="#{bankLookup}"
										reRender="Income_bank_name">
										<aon:joinProperty alias="Bank_code" value="#{income.to.bank.code}" />
									</aon:lookupInputText>
									<aon:lookupButton 
										windowTitle="#{configBundle.config_bank_selection}"
										disabled="#{!income.pending}" minHeight="460" minWidth="650"
										property="#{income.to.bank}" lookup="#{bankLookup}"
										selectReRender="Income_bank_code,Income_bank_name"
										actionType="search">
									</aon:lookupButton>
									<aon:inputText id="Income_bank_name"
										value="#{income.to.bank.name}"
										disabled="true" size="40" />							
								</a4j:region>
							</aon:div>
							<aon:div>
								<aon:inputText id="Income_bank_office"
									value="#{income.to.bankAccount.office}"
									disabled="#{!income.pending}" size="4" maxlength="4">
									<f:validateLength minimum="4" maximum="4" />
								</aon:inputText>
								<aon:inputText id="Income_bank_control"
									value="#{income.to.bankAccount.control}"
									disabled="#{!income.pending}" size="2" maxlength="2">
									<f:validateLength minimum="2" maximum="2" />
								</aon:inputText>
								<aon:inputText id="Income_bank_account"
									value="#{income.to.bankAccount.account}"
									disabled="#{!income.pending}" size="10" maxlength="10">
									<f:validateLength minimum="10" maximum="10" />
								</aon:inputText>
							</aon:div>

						</aon:panelGrid>
					</aon:panel>
				</aon:div>

				<aon:div styleClass="aon-padding-top">
					<aon:panel rendered="#{!income.new}">
						<f:facet name="header">
							<aon:outputText value="#{warehouseBundle.warehouse_income_detail}" />
						</f:facet>
						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
							<ui:param name="dataTableId" value="incomeDetails" />
							<ui:param name="controller" value="#{incomeDetail}" />
							<ui:param name="rows" value="0" />
							<ui:param name="showNote" value="false" />
							<ui:param name="showDataScroller" value="false" />
							<ui:param name="skipResetButton" value="#{!income.pending}" />
							<ui:param name="skipLineEdition" value="#{!income.pending}" />
							<ui:param name="skipSaveButton" value="#{incomeDetail.purchaseSource}" />
							<ui:param name="rowSelectorReRender" value="menuExt" />
							<ui:param name="resetButtonReRender" value="menuExt" />
							<ui:param name="newCancelButtonReRender" value="menuExt" />
							<ui:param name="cancelButtonReRender" value="menuExt" />
							<ui:param name="newSaveButtonReRender" value="menuExt,Income_total" />
							<ui:param name="saveButtonReRender" value="menuExt,Income_total" />
							<ui:param name="removeButtonReRender" value="menuExt,Income_total" />
							<ui:param name="focusOnAdd" value="IncomeDetail_item_product_code-New" />
							<ui:param name="focusOnSelect" value="IncomeDetail_item_product_code" />

							<ui:define name="columns">

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
									<f:facet name="header">
										<aon:outputLabel for="IncomeDetail_line" value="#{warehouseBundle.warehouse_income_detail_line}" />
									</f:facet>
									<aon:outputText value="#{to.line}"
										rendered="#{formList}" />
									<aon:inputText id="IncomeDetail_line" 
										value="#{controller.to.line}" rendered="#{formEdit}"
										required="true" size="1" maxlength="3" />
									<f:facet name="footer">
										<aon:inputText id="IncomeDetail_line-New" 
											value="#{controller.to.line}" rendered="#{formNew}"
											required="true" size="1" maxlength="3" />
									</f:facet>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
									<f:facet name="header">
										<aon:outputLabel for="IncomeDetail_item_product_code" value="#{productBundle.product_item}" />
									</f:facet>
									<aon:outputText value="#{to.description}"
										rendered="#{formList}">
										<aon:abbreviateConverter maxWidth="64" />
									</aon:outputText>
									<aon:div id="incomeDetailItemEdit" styleClass="aon-lookup" rendered="#{formEdit}">
										<a4j:region>
											<aon:lookupInputText id="IncomeDetail_item_product_code" 
												value="#{incomeDetail.to.item.product.code}"
												lookup="#{itemLookup}" 
												lookupChangeListener="#{incomeDetail.onItemChanged}" 
												reRender="incomeDetailItemEdit,IncomeDetail_quantity,IncomeDetail_price,
													IncomeDetail_amount"  
												ajaxSingle="false" required="true" size="10"
												onblur="toUpperCase(this);" focus="IncomeDetail_item_product_name">
												<aon:joinProperty alias="Item_product_code"	value="#{incomeDetail.to.item.product.code}" />
											</aon:lookupInputText>
											<aon:lookupButton
												windowTitle="#{productBundle.product_item_selection}"
												minHeight="460" minWidth="650" 
												property="#{incomeDetail.to.item}" lookup="#{itemLookup}"
												lookupChangeListener="#{incomeDetail.onItemChanged}"
												selectReRender="incomeDetailItemEdit,IncomeDetail_quantity,IncomeDetail_price,
													IncomeDetail_amount"
												actionType="search">
											</aon:lookupButton>
											<aon:lookupButton
												windowTitle="#{productBundle.product_item_new}"
												minHeight="360" minWidth="780"
												property="#{incomeDetail.to.item}" lookup="#{itemLookup}"
												lookupChangeListener="#{incomeDetail.onItemChanged}" 
												selectReRender="incomeDetailItemEdit,IncomeDetail_quantity,IncomeDetail_price,
													IncomeDetail_amount"
												actionType="new">
											</aon:lookupButton>
										</a4j:region>
										<aon:inputTextarea id="IncomeDetail_item_product_name" 
											value="#{incomeDetail.to.description}"
											cols="60" rows="#{!incomeDetail.longDescription?1:5}"
											style="#{!incomeDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
											<f:validateLength maximum="1024" />
										</aon:inputTextarea>
										<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
											actionListener="#{incomeDetail.onShortDescription}" reRender="IncomeDetail_item_product_name"
											rendered="#{incomeDetail.longDescription and incomeDetail.to.item.product.code != null}" />
										<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
											actionListener="#{incomeDetail.onLongDescription}" reRender="IncomeDetail_item_product_name"
											rendered="#{!incomeDetail.longDescription and incomeDetail.to.item.product.code != null}" />
									</aon:div>
									<f:facet name="footer">
										<aon:div id="incomeDetailItemNew" styleClass="aon-lookup" rendered="#{formNew}">
											<a4j:region>
												<aon:lookupInputText id="IncomeDetail_item_product_code-New" 
													value="#{incomeDetail.to.item.product.code}"
													lookup="#{itemLookup}" 
													lookupChangeListener="#{incomeDetail.onItemChanged}" 
													reRender="incomeDetailItemNew,IncomeDetail_quantity-New,IncomeDetail_price-New,
														IncomeDetail_amount-New"  
													ajaxSingle="false" required="true" size="10"
													onblur="toUpperCase(this);" focus="IncomeDetail_item_product_name-New">
													<aon:joinProperty alias="Item_product_code"	value="#{incomeDetail.to.item.product.code}" />
												</aon:lookupInputText>
												<aon:lookupButton
													windowTitle="#{productBundle.product_item_selection}"
													minHeight="460" minWidth="650" 
													property="#{incomeDetail.to.item}" lookup="#{itemLookup}"
													lookupChangeListener="#{incomeDetail.onItemChanged}"
													selectReRender="incomeDetailItemNew,IncomeDetail_quantity-New,IncomeDetail_price-New,
														IncomeDetail_amount-New"
													actionType="search">
												</aon:lookupButton>
												<aon:lookupButton
													windowTitle="#{productBundle.product_item_new}"
													minHeight="360" minWidth="780"
													property="#{incomeDetail.to.item}" lookup="#{itemLookup}"
													lookupChangeListener="#{incomeDetail.onItemChanged}" 
													selectReRender="incomeDetailItemNew,IncomeDetail_quantity-New,IncomeDetail_price-New,
														IncomeDetail_amount-New"
													actionType="new">
												</aon:lookupButton>
											</a4j:region>
											<aon:inputTextarea id="IncomeDetail_item_product_name-New" 
												value="#{incomeDetail.to.description}"
												cols="60" rows="#{!incomeDetail.longDescription?1:5}"
												style="#{!incomeDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
												<f:validateLength maximum="1024" />
											</aon:inputTextarea>
											<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
												actionListener="#{incomeDetail.onShortDescription}" reRender="IncomeDetail_item_product_name-New"
												rendered="#{incomeDetail.longDescription and incomeDetail.to.item.product.code != null}" />
											<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
												actionListener="#{incomeDetail.onLongDescription}" reRender="IncomeDetail_item_product_name-New"
												rendered="#{!incomeDetail.longDescription and incomeDetail.to.item.product.code != null}" />
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel for="IncomeDetail_quantity" value="#{bundle.aon_quantity}" />
									</f:facet>
									<aon:outputText value="#{to.quantity}"
										rendered="#{formList}">
										<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
									</aon:outputText>
									<aon:inputText id="IncomeDetail_quantity" 
										value="#{controller.to.quantity}" rendered="#{formEdit}"
										reRender="IncomeDetail_amount" 
										required="true" size="5" />
									<f:facet name="footer">
										<aon:inputText id="IncomeDetail_quantity-New" 
											value="#{controller.to.quantity}" rendered="#{formNew}" 
											reRender="IncomeDetail_amount-New" 
											required="true" size="5" />
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel for="IncomeDetail_price" value="#{bundle.aon_price}" />
									</f:facet>
									<aon:outputText value="#{to.price}"
										rendered="#{formList}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:inputText id="IncomeDetail_price" 
										value="#{controller.to.price}" rendered="#{formEdit}"
										reRender="IncomeDetail_amount" 
										required="true" size="5" />
									<f:facet name="footer">
										<aon:inputText id="IncomeDetail_price-New"
