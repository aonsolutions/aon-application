aon_sms_esendex_error=An unexpected error sending the sms.

aon_sms_esendex_0=Send the full exception details to Esendex for more info.
aon_sms_esendex_1=Send the full exception details to Esendex for more info.
aon_sms_esendex_2=The username/password is invalid, or you are not permitted to access the account you specified.
aon_sms_esendex_3=The SOAP XML you posted was missing the SOAP Header when one was expected.
aon_sms_esendex_4=There was no recipient to send the message to.
aon_sms_esendex_5=Your account has not started, or has expired.
aon_sms_esendex_6=The method you called is not enabled.
aon_sms_esendex_7=You tried to put a service alias on an message that doesn't support it.
aon_sms_esendex_8=A message with the ID you specified could not be found.
aon_sms_esendex_9=The recipient you entered was not a valid mobile number.
aon_sms_esendex_10=You do not have enough credits to send the messages submitted.
aon_sms_esendex_11=The ID you specified is not a valid GUID.
aon_sms_esendex_12=Reserved,
aon_sms_esendex_13=You attempted to add a Contact with a name that already exists.
aon_sms_esendex_14=You attempted to add a Contact Group with a name that already exists.
aon_sms_esendex_15=You attempted to add a Contact Group and/or Contact with a name that already exists.
aon_sms_esendex_16=You are not authorised to carry out the request submitted.
aon_sms_esendex_17=The contact or group you tried to create contains a field with invalid details. You will receive information on the field in error.
aon_sms_esendex_18=You attempted to send a premium rate message to a recipient who doesn't have an active subscription (someone who has not texted in, or has stopped their subscription).
aon_sms_esendex_19=You attempted to submit a scheduled message at an invalid date/time.
aon_sms_esendex_20=A subscription for the mobile number does not exist for this account.

