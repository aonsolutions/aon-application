<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="identityForm">

			<aon:div ajaxRendered="true" layout="none">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{appBundle.aon_corporate_identity}" />
					<ui:param name="toolbarDescription" value="#{corporateIdentity.identityReport.company.fullName}" />
					<ui:param name="controller" value="#{corporateIdentityAttach}" />
					<ui:param name="skipResetButton" value="#{!loggedUser.userInRole['CorporativeDocumentsManager']}" />
					<ui:param name="skipSearchButton" value="false" />
					<ui:define name="additionalToolbarContent">
						<aon:commandButton id="category" value="#{registryBundle.registry_category_module}"
							renderedOnUserRole="CorporativeDocumentsManager"
							action="corporate_identity_category" actionListener="#{category.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-category" />
					</ui:define>
				</ui:decorate>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
			
				<aon:div styleClass="aon-form-group" rendered="#{loggedUser.userInRole['PredefinedDocumentsExecutable']}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel value="#{appBundle.aon_corporate_identity_predefined_documents}" />
						</aon:div>
					</aon:div>
			
					<aon:panelGrid columns="4" styleClass="aon-panelGrid-formatting"
						columnClasses="aon-portlets-column1,aon-portlets-column1,aon-portlets-column1">
		
						<aon:div styleClass="aon-portlet aon-width-150">
							<aon:div styleClass="aon-portlet-title">
								<aon:outputText value="#{appBundle.aon_corporate_identity_fax}" styleClass="aon-portlet-title-text"/>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:commandLink action="corporate_identity_fax"
									actionListener="#{corporateIdentity.onInit}">
									<h:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon-big-fax.png']}" />
								</aon:commandLink>
							</aon:div>
						</aon:div>
			
						<aon:div styleClass="aon-portlet aon-width-150">
							<aon:div styleClass="aon-portlet-title">
								<aon:outputText value="#{appBundle.aon_corporate_identity_letter}" styleClass="aon-portlet-title-text"/>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:commandLink action="corporate_identity_letter"
									actionListener="#{corporateIdentity.onInit}">
									<h:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon-big-carta.png']}" />
								</aon:commandLink>
							</aon:div>
						</aon:div>
						
						<aon:div styleClass="aon-portlet aon-width-150">
							<aon:div styleClass="aon-portlet-title">
								<aon:outputText value="#{appBundle.aon_corporate_identity_label}" styleClass="aon-portlet-title-text"/>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:commandLink action="corporate_identity_label"
									actionListener="#{corporateIdentity.onInit}">
									<h:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon-big-etiquetas.png']}" />
								</aon:commandLink>
							</aon:div>
						</aon:div>
			
						<aon:div styleClass="aon-portlet aon-width-150">
							<aon:div styleClass="aon-portlet-title">
								<aon:outputText value="#{appBundle.aon_corporate_identity_recibi}" styleClass="aon-portlet-title-text"/>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:commandLink action="corporate_identity_recibi"
									actionListener="#{corporateIdentity.onInit}">
									<h:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon-big-recibi.png']}" />
								</aon:commandLink>
							</aon:div>
						</aon:div>
			
					</aon:panelGrid>
				</aon:div>
			
				<aon:div styleClass="aon-form-group">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel value="#{appBundle.aon_corporate_identity_other_documents}" />
						</aon:div>
					</aon:div>
					
					<ui:include src="/com/code/aon/ui/registry/facelet/rattach/tab_grid.xhtml">
						<ui:param name="controller" value="#{corporateIdentityAttach}" />
						<ui:param name="sortColumns" value="#{true}" />
						<ui:param name="skipLineEdition" value="#{!loggedUser.userInRole['CorporativeDocumentsManager']}" />
						<ui:param name="skipResetButton" value="#{!loggedUser.userInRole['CorporativeDocumentsManager']}" />
					</ui:include>

				</aon:div>
				
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
