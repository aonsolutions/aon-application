<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="utilitiesMenu">
		
			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_utilities_general"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-sales aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_general}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="checks" action="util_checking"
										value="#{financeBundle.finance_checking_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

					<aon:panelGroup>
						<c:if test="#{aonRole.accountingOperator}">
							<aon:panelGrid id="group_utilities_utilities"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-sales aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_utilities}"/>
								</f:facet>					
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="invoiceRecorder"
											value="#{financeBundle.finance_sale_invoice_recording_module}"
											actionListener="#{invoiceRecorder.onEditSearch}"
											action="invoiceRecorder_search" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:outputLink value="#" style="text-decoration: line-through;">
											<aon:outputText value="#{financeBundle.finance_purchase_invoice_recording_module}"/>
										</aon:outputLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:outputLink value="#" style="text-decoration: line-through;">
											<aon:outputText value="#{financeBundle.finance_expense_invoice_recording_module}"/>
										</aon:outputLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:outputLink value="#" style="text-decoration: line-through;">
											<aon:outputText value="#{financeBundle.finance_charge_recording_module}"/>
										</aon:outputLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:outputLink value="#" style="text-decoration: line-through;">
											<aon:outputText value="#{financeBundle.finance_payment_recording_module}"/>
										</aon:outputLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
					</aon:panelGroup>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
