<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<rich:panelMenu>
		<c:forEach var="group" items="#{categoryGadget.categoryGroupList}">
			<rich:panelMenuGroup styleClass="box-header"
				label="#{(group.pcg.name!=null)?(group.pcg.name):(ecommerceBundle.aon_ecommerce_category_others)}">
				<c:forEach var="cat" items="#{group.categoryList}">
					<rich:panelMenuItem label="#{cat.name}" value="#{cat}"
						actionListener="#{categoryGadget.onCategorySelect}">
					</rich:panelMenuItem>
				</c:forEach>
			</rich:panelMenuGroup>
		</c:forEach>
	</rich:panelMenu>
	
	<aon:div id="left-banner-image" styleClass="left-banner-image">
		<a4j:mediaOutput id="image-left" element="img"
			rendered="#{ecConfig.leftBanner}"
			cacheable="false" value="#{ecConfig.activeConfig.id}"
			createContent="#{ecConfig.paintLeftBanner}" />
	</aon:div>

</ui:composition>
