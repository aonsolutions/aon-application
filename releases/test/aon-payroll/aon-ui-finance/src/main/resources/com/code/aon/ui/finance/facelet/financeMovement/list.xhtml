<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="financeList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{financeBundle.finance_payment_movement}" />
				<ui:param name="controller" value="#{financeMovement}" />
				<ui:param name="rowSelectorReRender" value="false" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="movement_report" target="_blank"
						action="#{report.onExecute}"
						value="#{financeBundle.finance_payment_movement}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="movementFinanceList" />
					</aon:htmlCommandLink>

				</ui:define>

			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div>
					<aon:panelGrid columns="2">
						<aon:outputText value="#{financeBundle.finance_balance}" />
						<aon:outputText value="#{financeMovement.balance}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:panelGrid>
				</aon:div>
				<rich:spacer height="10px"/>
				
				<aon:editDataTable id="movements" value="#{financeMovement.model}"
					rows="20"
					columnClasses="aon-editDataTable-textColumn,, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,aon-editDataTable-numberColumn"
					var="to">
				

					<aon:column alias="Finance.dueDate"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.dueDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>
					<aon:column alias="Finance.invoice.referenceCode"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_invoice}" />
						</f:facet>
						<aon:outputText value="#{to.invoice.referenceCode}" />
					</aon:column>

					<aon:column alias="Finance.invoice.registryName"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText
								value="#{(finance.payment) ? (financeBundle.finance_creditor) : (financeBundle.finance_debtor)}" />
						</f:facet>
						<aon:outputText value="#{to.invoice.registryName}" />
					</aon:column>

					<aon:column alias="Finance.invoice.registryDocument"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.invoice.registryDocument}" />
					</aon:column>

					<aon:column alias="Finance.payMethod.name"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_pay_method}" />
						</f:facet>
						<aon:outputText value="#{to.payMethod.name}" />
					</aon:column>

					<aon:column  styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_bank}" />
						</f:facet>
						<aon:outputText value="#{to.bank.name}" />
					</aon:column>

					<aon:column alias="Finance.financeStatus"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.financeStatus}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_amount}" />
						</f:facet>
						<aon:outputText value="#{to.totalAmount}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
			
					</aon:column>
					
					<!--  <aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_balance}" />
						</f:facet>
						<aon:outputText value="#{financeMovement.currentBalance}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
			
					</aon:column>-->

				</aon:editDataTable>
				<aon:dataScroller2 for="movements" showNote="true" />
			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>
