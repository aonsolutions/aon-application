<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<c:if test="#{!renting.new}">
		<aon:div styleClass="aon-margin-top">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
				<ui:param name="controller" value="#{rentingDetail}" />
				<ui:param name="skipSelectButton" value="true" />
				<ui:param name="rowSelectorToggleOnClick" value="false" />
				<ui:param name="rows" value="0" />

				<ui:define name="columns">

					<aon:column styleClass="aon-editDataTable-iconColumn">
						<aon:commandLink id="selectButton"
							styleClass="aon-table-row-link" value="&#160;"
							requestDelay="100" action="#{rentingDetail.invoiceView}"
							actionListener="#{rentingDetail.onLoadInvoice}">
						</aon:commandLink>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_document}" />
						</f:facet>
						<aon:outputText value="#{to.document}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_accrual_period_abbr}" />
						</f:facet>
						<aon:outputText value="#{to.accrualPeriod}" />
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-textColumn aon-text-center aon-width-80">
						<f:facet name="header">
							<aon:outputText
								value="#{fiscalBundle.fiscal_renting_detail_kind}" />
						</f:facet>
						<aon:outputText value="#{to.type}" />
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-100">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_paid_returns_abbr}" />
						</f:facet>
						<aon:outputText value="#{to.paidReturns}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-100">
						<f:facet name="header">
							<aon:outputText value="%" />
						</f:facet>
						<aon:outputText value="#{to.percent}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column
						styleClass="aon-editDataTable-numberColumn aon-width-100">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_account_deposit_abbr}" />
						</f:facet>
						<aon:outputText value="#{to.accountDeposit}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
				</ui:define>
			</ui:decorate>
		</aon:div>
	</c:if>
</ui:composition>
