<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="commercialTrackingList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_tracking_module}" />
				<ui:param name="controller" value="#{commercialTracking}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="commercialTrackingFile-report"
						value="#{commercialBundle.commercial_tracking_file_tracing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="commercialTrackingFileList" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="commercialTracking-excel-report"
						value="&#160;" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="commercialTracking" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>	
					<aon:htmlCommandLink id="commercialTracking-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="commercialTracking" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="commercialTrackingDetail-excel-report"
						value="&#160;" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="commercialTrackingDetailExcel" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="commercialTrackingDetail-report"
						value="#{bundle.aon_detailed_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="commercialTrackingDetail" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{commercialTracking}" />
					<ui:param name="columnClasses" value="aon-editDataTable-dateColumn, 
						aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
						aon-editDataTable-textColumn aon-width-350, aon-editDataTable-textColumn, 
						aon-editDataTable-textColumn" />
					<ui:define name="columns">
					
						<aon:column alias="CommercialTracking.date">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>	
						</aon:column>
	
	 					<aon:column alias="CommercialTracking.seller.registry.surname">
							<f:facet name="header">
								<aon:outputText value="#{salesBundle.sales_seller}" />
							</f:facet>
							<aon:outputText value="#{to.seller.registry.fullName}"/>
						</aon:column>
	
	 					<aon:column alias="CommercialTracking.target.registry.name">
							<f:facet name="header">
								<aon:outputText value="#{commercialBundle.commercial_target}" />
							</f:facet>
							<aon:outputText value="#{to.target.registry.fullName}"/>
						</aon:column>
	
	 					<aon:column alias="CommercialTracking.comments">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_comment}" />
							</f:facet>
							<aon:outputText value="#{to.comments}"/>
						</aon:column>
	
	 					<aon:column alias="CommercialTracking.activity.name">
							<f:facet name="header">
								<aon:outputText value="#{commercialBundle.commercial_tracking_activity}" />
							</f:facet>
							<aon:outputText value="#{to.activity.name}"/>
						</aon:column>
	
	 					<aon:column alias="CommercialTracking.status">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}"/>
						</aon:column>
						
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
