<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="taxList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="toolbarTitle" value="#{configBundle.config_tax_module}" />
				<ui:param name="controller" value="#{tax}" />
			</ui:include>
			
			<aon:div styleClass="aon-scroll-area">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
				<ui:param name="controller" value="#{tax}" />
				<ui:param name="columnClasses" 
					value="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
					aon-editDataTable-textColumn, aon-editDataTable-numberColumn,
					aon-editDataTable-numberColumn" />
				<ui:define name="columns">
					<aon:column>
						<f:facet name="header">
							<aon:outputLabel value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputLabel value="#{configBundle.config_tax}" />
						</f:facet>
						<aon:div>
							<aon:outputText value="#{to.type}" />
							<aon:outputText value=" - " rendered="#{to.vat or to.retention}" />
							<aon:outputText value="#{to.vatDeductionType}" rendered="#{to.vat}" />
							<aon:outputText value="#{to.withholdingType}" rendered="#{to.retention}" />
						</aon:div>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputLabel value="#{bundle.aon_date_from}" />
						</f:facet>
						<aon:outputText value="#{to.startDate}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputLabel value="#{bundle.aon_percentage}" />
						</f:facet>
						<aon:outputText value="#{to.percentage}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputLabel value="#{bundle.aon_surcharge}" />
						</f:facet>
						<aon:outputText value="#{to.surcharge}" />
					</aon:column>

				</ui:define>
			</ui:decorate>
			</aon:div>
			
		</aon:form>

	</ui:define>

</ui:composition>
