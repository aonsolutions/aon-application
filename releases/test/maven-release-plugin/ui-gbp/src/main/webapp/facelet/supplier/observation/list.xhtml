<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<h:dataTable id="supplierObservationDataTable" value="#{supplierObservation.model}" var="to"
		rows="20" styleClass="dr-table rich-table aon-editDataTable"
		headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
		footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
		rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
		cellpadding="0" cellspacing="0"
		columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="&#160;" rendered="#{to==supplierObservation.to}" />
			<aon:commandButton rendered="#{to!=supplierObservation.to}"
				styleClass="aon-editDataTable-button aon-icon-rowSelector"
				actionListener="#{supplierObservation.onSelect}" value="" immediate="true"
				reRender="supplierObservationDataTable">
			</aon:commandButton>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton id="reset"
						title="[#{bundle.aon_reset}]"
						styleClass="aon-editDataTable-button aon-icon-reset" value=""
						immediate="true" reRender="supplierObservationDataTable"
						rendered="#{!supplierObservation.new}" actionListener="#{supplierObservation.onReset}"
						accesskey="#{bundle.aon_key_new_line}">
					</aon:commandButton>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_observation_date}" />
			</f:facet>
			<aon:outputText value="#{to.observationDate}" rendered="#{to!=supplierObservation.to}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>		
			<aon:selectInputDate value="#{supplierObservation.to.observationDate}"
				inputSize="15" datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
				rendered="#{to==supplierObservation.to}"/>
			<f:facet name="footer">
				<aon:div>
					<aon:selectInputDate value="#{supplierObservation.to.observationDate}"
						inputSize="15" datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
						rendered="#{supplierObservation.new}"/>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_observation_observation}" />
			</f:facet>
			<aon:outputText value="#{to.shortObservation}" rendered="#{to!=supplierObservation.to}" />
			<aon:inputTextarea value="#{to.observation}"
				rendered="#{to==supplierObservation.to}" cols="80" rows="5" />
			<f:facet name="footer">
				<aon:div>
					<aon:inputTextarea value="#{supplierObservation.to.observation}"
						rendered="#{supplierObservation.new}" cols="80" rows="5" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<f:verbatim rendered="#{to!=supplierObservation.to}">&#160;</f:verbatim>
			<aon:div rendered="#{to==supplierObservation.to}">
				<aon:commandButton id="lineAccept" title="[#{bundle.aon_accept}]"
					styleClass="aon-editDataTable-button aon-icon-accept"
					reRender="supplierObservationDataTable"
					actionListener="#{supplierObservation.onAccept}" />
				<aon:commandButton id="lineCancel" title="[#{bundle.aon_cancel}]"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					reRender="supplierObservationDataTable" immediate="true"
					actionListener="#{supplierObservation.onCancel}" />
				<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
					styleClass="aon-editDataTable-button aon-icon-delete"
					reRender="supplierObservationDataTable" immediate="true"
					actionListener="#{supplierObservation.onRemove}" />
			</aon:div>
			<f:facet name="footer">
				<aon:div rendered="#{supplierObservation.new}">
					<f:verbatim rendered="#{!supplierObservation.new}">&#160;</f:verbatim>
					<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
						styleClass="aon-editDataTable-button aon-icon-accept"
						reRender="supplierObservationDataTable"
						actionListener="#{supplierObservation.onAccept}" />
					<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						reRender="supplierObservationDataTable" immediate="true"
						actionListener="#{supplierObservation.onCancel}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</h:dataTable>

	<aon:dataScroller dataTable="supplierObservationDataTable" model="#{supplierObservation.model}" />

</ui:composition>

</body>
</html>
