<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_campaign_comparer_report}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{bundle.aon_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandLink target="_blank" value="#{appBundle.gbp_print}"
							styleClass="aon-finding-toolbar-item aon-icon-printer"
							action="#{report.onExecute}">
							<f:param name="reportKey" value="campaign_comparer_stat" />
							<f:param name="outputFormat" value="PDF" />
						</h:commandLink>
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="campaignGrid" columns="2" dir="true">

					<aon:outputLabel for="Campaign1_Id-Edit"
						value="#{appBundle.gbp_campaign_campaign} 1" />
					<aon:div id="cmpLookUp1" styleClass="aon-lookup">
						<aon:lookupInputText id="Campaign1_Id-Edit" required="true"
							lookup="#{campaignLookup}"
							value="#{campaignComparerReport.campaign1.id}" size="5"
							reRender="cmpLookUp1">
						</aon:lookupInputText>
						<aon:lookupButton id="Campaign1_Lookup-Edit"
							windowTitle="#{appBundle.gbp_supplier_campaigns}"
							selectReRender="cmpLookUp1" lookup="#{campaignLookup}"
							actionType="search"
							property="#{campaignComparerReport.campaign1}">
						</aon:lookupButton>
						<aon:inputText id="Campaign1_name-Edit"
							value="#{campaignComparerReport.campaign1.name}" size="64"
							disabled="true" />
					</aon:div>

					<aon:outputLabel for="Campaign2_Id-Edit"
						value="#{appBundle.gbp_campaign_campaign} 2" />
					<aon:div id="cmpLookUp2" styleClass="aon-lookup">
						<aon:lookupInputText id="Campaign2_Id-Edit" required="true"
							lookup="#{campaignLookup}"
							value="#{campaignComparerReport.campaign2.id}" size="5"
							reRender="cmpLookUp2">
						</aon:lookupInputText>
						<aon:lookupButton id="Campaign2_Lookup-Edit"
							windowTitle="#{appBundle.gbp_supplier_campaigns}"
							selectReRender="cmpLookUp2" lookup="#{campaignLookup}"
							actionType="search"
							property="#{campaignComparerReport.campaign2}">
						</aon:lookupButton>
						<aon:inputText id="Campaign2_name-Edit"
							value="#{campaignComparerReport.campaign2.name}" size="64"
							disabled="true" />
					</aon:div>
					
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{campaignLookup}" />
	</ui:define>

</ui:composition>
