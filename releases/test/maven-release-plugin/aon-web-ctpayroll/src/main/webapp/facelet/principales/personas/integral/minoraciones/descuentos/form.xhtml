<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="trabdtoForm">

					<!-- 
						<ui:include
						src="/facelet/templates/formPrintToolbar.xhtml">
					-->
					<ui:include
						src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
						<ui:param name="toolbarTitle"
							value="#{appBundle.aon_payroll_principales_trabdto_mnto}" />
						<ui:param name="controller" value="#{trabdto}" />

						<aon:methodParam name="backAction"
							value="integralTrab_form" />
						<aon:methodParam name="cancelAction"
							value="integralTrab_form" />

					</ui:include>

					<!--	FIN HEADER & TOOLBAR	-->

					<aon:div id="trabdtoData"
						styleClass="aon-scroll-area">
						
						
						<aon:panelGrid columns="2" dir="true"
							width="100%">

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_bonifica_trabajador}" />
							<aon:outputText value="#{trabajador.to.cdg}" size="3" maxlength="3" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_bonifica_nom_ape}" />
							<aon:div>
								<aon:outputText value="#{trabajador.to.persona.descripcion} " />
								<aon:outputText value="#{trabajador.to.persona.apellido2}, " />
								<aon:outputText value="#{trabajador.to.persona.nombre} " />
							</aon:div>
							
						</aon:panelGrid>

						<aon:panelGrid columns="4" dir="true"
							width="100%">
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_trabdto_num_orden}" />
							<aon:inputText value="#{trabdto.to.id.orden}"
								readonly="#{true}" size="2" maxlength="2" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_trabdto_num_linea}" />
							<aon:inputText value="#{trabdto.to.linea}"
								size="2" maxlength="2" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_trabdto_fecini_desc}" />
							<aon:selectInputDate renderAsPopup="true" 
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{trabdto.to.fecini}" enableManualInput="true" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_trabdto_fecfin_Desc}" />
							<aon:selectInputDate renderAsPopup="true" 
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{trabdto.to.fecfin}" enableManualInput="true" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_trabdto_concep_minor}" />
							<aon:inputText value="#{trabdto.to.concepto}"
								size="20" maxlength="30" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_trabdto_importe_minor}" />
							<aon:inputText value="#{trabdto.to.importe}"
								size="7" maxlength="10" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_trabdto_importe_indicar}" />
							<aon:selectOneRadio 
								value="#{trabdto.to.indimp}">
								<f:selectItems
									value="#{trabdto.listaImporteIndicar}" />
							</aon:selectOneRadio>
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_trabdto_afecta}" />
							<aon:selectOneRadio 
								value="#{trabdto.to.afecta}">
								<f:selectItems
									value="#{trabdto.listaAfectados}" />
							</aon:selectOneRadio>


						</aon:panelGrid>
					</aon:div>
				</aon:form>

			</ui:define>
		</ui:composition>
	</body>
</html>
