<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<aon:div styleClass="aon-login">
		<h:panelGrid styleClass="aon-width-all aon-height-all"
			columnClasses="#{companyDisplay.show?'aon-width-300,':''} aon-width-auto" columns="2">
			<c:if test="#{companyDisplay.show}">
				<ui:include src="/com/code/aon/ui/company/facelet/companyDisplay/info.xhtml" />
			</c:if>
			<aon:div styleClass="aon-login-box-internal">
				<form id="login" method="post" action="j_security_check">
					<aon:div styleClass="aon-login-title">
						<aon:outputText value=" / #{appBundle.aon_application_title}"/>
					</aon:div>
					<aon:div styleClass="aon-login-box">
						<aon:outputText value="#{securityBundle.aon_login_label}" styleClass="aon-login-help"/>
						<ui:insert name="error"/>
						
						<aon:panelGrid styleClass="aon-width-all" columns="2" columnClasses="aon-login-box-left,aon-login-box-right">
					
							<aon:outputLabel for="j_username_view" value="#{securityBundle.aon_login_user}:" styleClass="aon-login-label" />
							<aon:inputText id="j_username_view" styleClass="aon-login-input" />
						
							<aon:outputLabel for="j_password" value="#{securityBundle.aon_login_passwd}:"  styleClass="aon-login-label"/>
							<aon:inputSecret id="j_password" styleClass="aon-login-input" />
							
							<aon:outputText value="&#160;" />
							<input id="login_btn" name="login_btn" type="submit" value="#{securityBundle.aon_login_validate}" 
									onclick="concatHost();" class="aon-login-button"/>
										
						</aon:panelGrid>
						<input type="hidden" id="login_domain" name="login_domain"
							value="#{domainResolver.domain}" />
						<input type="hidden" id="j_username" name="j_username" />
						
						<aon:div styleClass="aon-login-info">
							<aon:div styleClass="aon-login-info-title">
								<aon:outputText value="#{bundle.aon_login_support}:" />
							</aon:div>

							<aon:div styleClass="aon-bold">
								<aon:outputText value="#{bundle.aon_login_phone}" />
							</aon:div>
							<aon:div>
								<h:outputLink value="mailto:#{bundle.aon_login_email}" target="_blank" >
									<aon:outputText value="#{bundle.aon_login_email}" />
								</h:outputLink>
							</aon:div>
						</aon:div>							

						<aon:div styleClass="aon-login-info2">						
							 <aon:outputText value="#{bundle.aon_trademark}" />
							 <aon:outputText value="#{bundle.aon_esferalia} #{bundle.aon_networks}"
							 	styleClass="aon-footer-company-label"/>
						</aon:div>	
					</aon:div>
				</form>
			</aon:div>
		</h:panelGrid>
	</aon:div>	

</ui:composition>
