<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-form-group" rendered="#{!employee.new and instructorCourse.model.rowCount > 0}">
		<t:div styleClass="aon-form-group-title">
			<t:outputLabel for="instructorWeekHourDataList"
				value="#{appBundle.schedule_summary_hours}" />
		</t:div>

		<t:div styleClass="aon-form-group-body">
			<t:dataTable id="instructorWeekHourDataList" cellpadding="0" cellspacing="0"
				var="to" value="#{instructorCourse.totalWeeklyHours}" rows="20" rowIndexVar="rowIndex"
				rendered="#{instructorCourse.model.rowCount > 0}"
				styleClass="aon-table" headerClass="aon-table-header"
				rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
				columnClasses="aon-table-body aon-table-body-number">

				<t:columns value="#{instructorCourse.instructorWeeklyHoursHeader}" var="column">
					<f:facet name="header">
						<t:div>
							<f:verbatim>&#160;</f:verbatim>
							<h:outputText value="#{column.weekDay}" />
						</t:div>
					</f:facet>
					<t:outputText value="#{to.valuesFormatted[column.position]}" />
				</t:columns>

			</t:dataTable>

			<ui:include src="/facelet/shared/dataScroller.xhtml">
				<ui:param name="dataTable" value="instructorWeekHourDataList" />
				<ui:param name="model" value="#{instructorCourse.totalWeeklyHours}" />
				<ui:param name="showNote" value="#{false}" />
			</ui:include>

		</t:div>
	</t:div>

</ui:composition>
</body>
</html>
