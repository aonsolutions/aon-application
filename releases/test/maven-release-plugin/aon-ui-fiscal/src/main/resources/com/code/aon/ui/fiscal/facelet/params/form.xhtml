<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{fiscalBundle.fiscal_parameters_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />

				<ui:define name="toolbarContent">

					<aon:commandButton id="save" value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{fiscalParams.onAccept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>


			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="default_period"
						value="#{fiscalBundle.fiscal_parameters_year}" />
					<aon:selectOneMenu id="default_period" value="#{fiscalParams.defaultYear}">
						<f:selectItem itemValue="" itemLabel=" " />
						<f:selectItems value="#{accountingCollections.allAccountPeriodKeys}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="default_administration"
						value="#{fiscalBundle.fiscal_default_administration}" />
					<aon:selectOneMenu id="default_administration"
						value="#{fiscalParams.defaultAdministration}">
						<f:selectItems value="#{fiscalCollections.administrations}" />
					</aon:selectOneMenu>


					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="default_tax_refund_registry"
							value="#{fiscalParams.taxRefundRegistry}">
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="default_tax_refund_registry"
							value="#{fiscalBundle.fiscal_tax_refund_registry}" />
					</aon:div>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
