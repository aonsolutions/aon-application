<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="tc1List">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.aon_payroll_resultados_tc1}" />
				<ui:param name="controller" value="#{tc1}"/>
				<ui:param name="skipBackButton" value="false" />
				<aon:methodParam name="cancelAction" value="tc1_form"/>	
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="tc2Data" value="#{tc1.model}" var="to" rows="20" 
					columnClasses="aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn, aon-editDataTable-textColumn">

					<aon:rowSelector action="tc1_form" actionListener="#{tc1.onSelect}" />
					
 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_integralTra_cod_act}" />
						</f:facet>
						<aon:outputText value="#{to.codact.cdg}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_tc2_act}" />
						</f:facet>
						<aon:outputText value="#{to.codact.descripcion}"/>
					</aon:column>
		
					

 				</aon:dataTable>

				<aon:dataScroller2 for="tc2Data"  showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
