<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{fiscalBundle.fiscal_model_303_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:define name="toolbarActions">
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-back" 
						value="#{bundle.aon_back}"
						action="model303_search" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						accesskey="#{bundle.aon_key_cancel}" />			
					<aon:commandButton id="#{toolbarID}-recalculate" 
						value="#{fiscalBundle.fiscal_recalculate}"
						actionListener="#{model303.onRecalculate}" 
						styleClass="aon-finding-toolbar-item aon-icon-refresh"/>			
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div id="model303Data" styleClass="aon-scroll-area">
				<aon:dataTable id="model303List" value="#{model303.model}"
					style="width: 100%;"
					rows="0" var="to" rendered="#{model303.model.rowCount > 0}">
 
						<f:facet name="header">
							<rich:columnGroup>
								<aon:column styleClass="aon-dataTable-header" colspan="2">
									<aon:panelGroup>
										<aon:outputText value="#{model303.params.vatPeriod}"/>
										<aon:outputText value=" - "/>
										<aon:outputText value="#{model303.params.year}"/>
									</aon:panelGroup>
								</aon:column>
								<aon:column styleClass="aon-dataTable-header" colspan="2">
									<aon:outputText value="ACUMULADO" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header" colspan="2">
									<aon:outputText value="DECLARADO" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header" colspan="2">
									<aon:outputText value="RESULTADO" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header" colspan="2">
									<aon:outputText value="A DECLARAR" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header" colspan="2">
									<aon:outputText value="AJUSTES" />
								</aon:column>
							</rich:columnGroup>
						</f:facet>
						
            		<aon:column styleClass="aon-editDataTable-textColumn aon-width-300" style="font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_type}" />
						</f:facet>
						<aon:outputText value="#{to.key}"  
							style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}"/>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40" style="font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="%" />
						</f:facet>
						<aon:div rendered="#{to.key.detailed}">
							<aon:outputText value="#{to.percent}" >
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:outputText value="%" />
						</aon:div>
					</aon:column>
					
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
						</f:facet>
						<aon:outputText value="#{to.acumuladoTaxableBase}" rendered="#{to.key.detailed}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_fee}" />
						</f:facet>
						<aon:outputText value="#{to.acumuladoQuota}"   
							style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
						</f:facet>
						<aon:outputText value="#{to.declaradoTaxableBase}" rendered="#{to.key.detailed}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_fee}" />
						</f:facet>
						<aon:outputText value="#{to.declaradoQuota}"   
							style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
						</f:facet>
						<aon:outputText value="#{to.resultadoTaxableBase}" rendered="#{to.key.detailed}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_fee}" />
						</f:facet>
						<aon:outputText value="#{to.resultadoQuota}"   
							style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
						</f:facet>
						<aon:outputText value="#{to.declararTaxableBase}" rendered="#{to.key.detailed}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="font-size: 0.9em;"> 
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_fee}" />
						</f:facet>
						<aon:outputText value="#{to.declararQuota}" rendered="#{to.key.total or to.key.subtotal}"   
							style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:inputText value="#{to.declararQuota}" rendered="#{!to.key.total and !to.key.subtotal}" 
							size="8" >
						</aon:inputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_tax_base}" />
						</f:facet>
						<aon:outputText value="#{to.ajusteTaxableBase}" rendered="#{to.key.detailed}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80" style="background-color:#f6f5e3;font-size: 0.9em;">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_fee}" />
						</f:facet>
						<aon:outputText id="ajusteQuota" value="#{to.ajusteQuota}"   
							style="#{to.key.subtotal?'font-weight: bold;font-size: 1em;':''}#{to.key.total?'font-size: 1.1em;':''}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
