<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_financial_statements}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{financialStatement.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction"
						value="financialStatement_list" />

					<aon:outputLabel for="Statement_Month"
						value="#{accountingBundle.accounting_financial_statements_month}" />
					<aon:panelGrid columns="3">
						<aon:selectOneMenu id="Statement_Month"
							value="#{financialStatement.financialMonth}">
							<f:selectItems value="#{commonCollections.months}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="Statement_Year"
							value="#{bundle.aon_year}" />
						<aon:inputText id="Statement_Year" size="5"
							value="#{financialStatement.financialYear}" />
					</aon:panelGrid>

					<aon:outputLabel for="Finance_Date"
						value="#{accountingBundle.accounting_exclude_finaces}" />
					<aon:panelGrid columns="1">
						<aon:selectInputDate id="Finance_Date" 
							value="#{financialStatement.financeDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>
					<aon:outputLabel for="Expense_Month"
						value="#{accountingBundle.accounting_include_expenses}" />
					<aon:panelGrid columns="3">
						<aon:selectOneMenu id="Expense_Month"
							value="#{financialStatement.expensesMonth}">
							<f:selectItems value="#{commonCollections.months}" />
						</aon:selectOneMenu>
						
						<aon:outputLabel for="Expense_Year"
							value="#{bundle.aon_year}" />
						<aon:inputText id="Expense_Year" size="5"
							value="#{financialStatement.expensesYear}" />
					</aon:panelGrid>
						
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
