<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.article}" />
				<ui:param name="controller" value="#{article}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="generate" reRender="aonStatus"
						value="#{appBundle.aon_generate}" immediate="true"
						actionListener="#{generator.onGenerateArticles}"
						rendered="#{cms.roleEditor}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}">
						<a4j:support 
							event="onclick" reRender="poll,grid" ajaxSingle="true"
							actionListener="#{generator_status.onActivePoll}"  
							onclick="javascript:Richfaces.showModalPanel('showGeneratorLogModalPanel');" />
					</aon:commandButton>	
					<aon:commandButton id="home"
						value="#{bundle.aon_home}"
						action="home" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
					<aon:commandButton id="categories"
						value="#{appBundle.article_category}"
						action="articleCategory_list"
						actionListener="#{articleCategory.onSearch}"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item-no-icon">
						<aon:actionListener method="#{articleCategory.onInit}" />
					</aon:commandButton>
					<aon:commandButton id="diary"
						value="#{appBundle.diary}"
						action="diary_form"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item-no-icon">
						<aon:actionListener method="#{diary.onInit}" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{article}" />
					<ui:define name="columns">			
					
						<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.cms_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}"/>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.article_title}" />
							</f:facet>
							<aon:outputText value="#{article.i18nTitle}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>
						
						<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.article_category}" />
							</f:facet>
							<aon:outputText value="#{to.articleCategory.alias}" />
						</aon:column>
						
						<aon:column styleClass="aon-width-80 aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.article_expireDate}" />
							</f:facet>
							<aon:outputText value="#{to.expireDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
									
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.article_active}" />
							</f:facet>
							<aon:div onmouseover="disableRowSelector();"
								onmouseout="enableRowSelector();" >										
								<aon:commandLink title="#{appBundle.article_activate}" 
									action="article_list" ajaxSingle="true"
									actionListener="#{article.onActivate}" 
									rendered="#{!to.active}">
									<aon:graphicImage id="Article_active" alt="#{appBundle.article_activate}"
										url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.article_deactivate}" 
									action="article_list" ajaxSingle="true"
									actionListener="#{article.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="Article_deactive" alt="#{appBundle.article_deactivate}"
										url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
								</aon:commandLink>
							</aon:div>
						</aon:column>
					</ui:define>
				</ui:decorate>		

			</aon:div>
		</aon:form>

		<ui:include src="/facelet/content/utils/gen_log_modal.xhtml" />
		
	</ui:define>

</ui:composition>

</body>
</html>
