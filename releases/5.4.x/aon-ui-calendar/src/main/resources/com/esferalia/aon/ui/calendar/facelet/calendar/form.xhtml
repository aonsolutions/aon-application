<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="calendarForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{calendarBundle.aon_calendar_menu}" />
				<ui:param name="controller" value="#{calendar}" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipSpin" value="true" />
				
				<ui:define name="beforeSpinToolbarContent">
				
					<aon:htmlCommandLink id="export2pdf" value="CALENDARIO"
						title="Listado Pdf" actionListener="#{calendar.onInitCalendar}"
						styleClass="aon-finding-toolbar-item aon-icon-info"
						action="calendar_calendar" target="_blank">
						<f:param name="reportKey" value="yearStatsList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>

				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">
				<h:panelGrid columns="3">
					<aon:div styleClass="aon-scroll-area">
					
						<aon:panelGrid columns="2">
							<aon:outputLabel value="#{bundle.aon_year}" />
							<rich:inputNumberSpinner value="#{calendar.year}" 
								inputSize="4" minValue="2010" maxValue="2100"
								enableManualInput="true" step="1"
								ignoreDupResponses="true"
								cycled="false"  style="width:5px;height:5px;" >
								<a4j:support event="onchange" reRender="tabPanel"
									actionListener="#{calendar.onChangeYear}"
									ignoreDupResponses="true" />
							</rich:inputNumberSpinner>
						</aon:panelGrid>
					
						<aon:panelGrid columns="2">
							<aon:outputLabel value="#{calendarBundle.aon_calendar_calendar}" />
							<aon:inputText id="Calendar_description" size="40" maxlength="32"
								value="#{calendar.to.description}" required="true" />
<!--  
							<aon:outputLabel value="#{bundle.aon_year}" />
							<rich:inputNumberSpinner value="#{calendar.year}" 
								inputSize="4" minValue="2010" maxValue="2100"
								enableManualInput="true" step="1"
								ignoreDupResponses="true"
								cycled="false"  style="width:5px;height:5px;" >
								<a4j:support event="onchange" reRender="tabPanel"
									actionListener="#{calendar.onChangeYear}"
									ignoreDupResponses="true" />
							</rich:inputNumberSpinner>
-->							
							
							<aon:outputLabel
								value="#{calendarBundle.aon_calendar_anual_hours}" />
							<aon:inputText id="Calendar_anualHours" size="10" maxlength="6"
								value="#{calendar.to.anualHours}" />
								
							<aon:outputLabel for="Holiday_id"
								value="#{calendarBundle.aon_calendar_holiday}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Holiday_id"
									value="#{calendar.to.holiday.id}" size="5"
									lookup="#{holidayLookup}" reRender="Holiday_name" />
								<aon:lookupButton
									windowTitle="#{calendarBundle.aon_calendar_holiday}"
									minHeight="460" minWidth="650" property="#{calendar.to.holiday}"
									lookup="#{holidayLookup}"
									selectReRender="Holiday_id,Holiday_name"
									actionType="list">
								</aon:lookupButton>
								<aon:inputText id="Holiday_name"
									value="#{calendar.to.holiday.description}"
									disabled="true" size="60" />
							</aon:div>
							
							<aon:outputLabel value="#{bundle.aon_comment}" />
							<aon:inputTextarea id="Calendar_comments"
								value="#{calendar.to.comments}" cols="60" rows="5">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
						</aon:panelGrid>
					</aon:div>
					
					<aon:div styleClass="aon-scroll-area">
						<aon:panelGrid columns="2">
							<aon:outputLabel value="#{calendarBundle.aon_calendar_monday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.monday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.mondayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_tuesday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.tuesday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.tuesdayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_wednesday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.wednesday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.wednesdayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_thursday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.thursday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.thursdayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_friday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.friday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.fridayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_saturday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.saturday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.saturdayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_sunday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.sunday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.sundayHours}" />
							</aon:div>
						</aon:panelGrid>
					</aon:div>
					
					<aon:div styleClass="aon-scroll-area">
<!--  
					<c:if test="#{calendar.new}">
						<aon:panel style="height=80px"  width="100" header="#{calendarBundle.aon_calendar_import_holidays}">
							<h:panelGrid columns="2">
							<aon:outputText value="#{calendarBundle.aon_calendar_import_national}" />
							<aon:selectBooleanCheckbox />
							<aon:outputText value="#{calendarBundle.aon_calendar_import_regional}" />
							<aon:selectBooleanCheckbox />
							<aon:outputText value="#{calendarBundle.aon_calendar_import_local}" />
							<aon:selectBooleanCheckbox />
							</h:panelGrid>
						</aon:panel>
					</c:if>
-->					
					</aon:div>
				</h:panelGrid>
				
				<c:if test="#{!calendar.new}">
					<aon:div>
						<aon:panelTabSet id="tabPanel">
							<aon:panelTab label="#{calendarBundle.aon_calendar_holidays}">
								<ui:include src="grid.xhtml" />
							</aon:panelTab>
							<aon:panelTab label="#{calendarBundle.aon_calendar_period}">
								<ui:include src="period_grid.xhtml" />
							</aon:panelTab>
						</aon:panelTabSet>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{holidayLookup}" />
	</ui:define>
</ui:composition>
