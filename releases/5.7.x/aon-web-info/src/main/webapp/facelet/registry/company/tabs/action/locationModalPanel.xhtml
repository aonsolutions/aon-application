<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>
<ui:composition>
	<style>
	.infoL {
	    height: 110px;
	    width: 96%;
	    overflow: auto;
	}
	</style>


	<aon:panelGroup id="showLocationModalPanel">
		<rich:modalPanel id="locationModalPanel"
				rendered="#{webPage.showLocationModalPanel}" showWhenRendered="true"
				headerClass="aon-popupWindow-title"
				minHeight="200" height="200" minWidth="650" width="650" top="50" left="100" zindex="1000">
			<f:facet name="header">
	           	<h:outputText value="#{appBundle.aon_web_info_page_location}"/>
			</f:facet>

			<aon:form id="pagesLocationForm">
				<aon:div id="infoL">
					<rich:panel bodyClass="infoL">

						<aon:div styleClass="aon-toolbar">
							<aon:commandButton id="savel" value="#{bundle.aon_save}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								actionListener="#{webPage.onAcceptDetail}">
								<f:setPropertyActionListener target="#{webPage.showLocationModalPanel}" value="#{false}" />
								<rich:componentControl for="locationModalPanel" operation="hide" event="onclick" />
							</aon:commandButton>
						</aon:div>

						<aon:div style="float:left;margin-right:20px;">
							<aon:panelGrid columns="2" dir="true" >
						
								<aon:outputLabel for="Generic_extra" value="#{appBundle.aon_web_info_page_extra_coords}" />
								<aon:inputText id="Generic_extra" 
									size="60" maxlength="255" value="#{webPage.detail.extra}" />

								<aon:outputLabel value="&#160;" />
								<aon:outputText value="#{appBundle.aon_web_info_page_extra_coords_exp}"/>
							</aon:panelGrid>
						</aon:div>
					</rich:panel>
				</aon:div>

				<aon:div id="closeLocationModalPanel" >
					<aon:div style="text-align:right;">
						<rich:spacer height="3"/>
						<br/>
			            <aon:panelGrid style="float:right;border:1px gray solid">
							<aon:commandButton  
									reRender="infoL, closeLocationModalPanel"  style="padding-right:15px"
									value="#{appBundle.aon_web_info_close}" immediate="true"
									styleClass="aon-icon-commandButton aon-icon-cancel">
								<f:setPropertyActionListener target="#{webPage.showLocationModalPanel}" value="#{false}" />
								<rich:componentControl for="locationModalPanel" operation="hide" event="onclick" />
							</aon:commandButton>
						</aon:panelGrid>
					</aon:div>
				</aon:div>
			</aon:form>	
		</rich:modalPanel>
	</aon:panelGroup>
</ui:composition>
</body>
</html>
