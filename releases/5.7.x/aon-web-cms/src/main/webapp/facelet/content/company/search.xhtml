<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="companySearch">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.company}" />
				<ui:param name="controller" value="#{company}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
			</ui:include>		

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{company}" />
				<ui:define name="searchContent">
	
					<aon:outputLabel for="Company_name"
						value="#{appBundle.company_name}" />
					<aon:inputText id="Company_name" size="50"
						valueChangeListener="#{company.addExpression}" />

					<aon:outputLabel for="Company_locality"
						value="#{appBundle.company_locality}" />
					<aon:inputText id="Company_locality" size="50"
						valueChangeListener="#{company.addExpression}" />

					<aon:outputLabel for="Company_province"
						value="#{appBundle.company_province}" />
					<aon:inputText id="Company_province" size="50"
						valueChangeListener="#{company.addExpression}" />
	
				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
