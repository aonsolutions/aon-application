<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>
<ui:composition>
	<aon:panelGroup id="showDocumentModalPanel">
		<rich:modalPanel id="documentModalPanel"
				rendered="#{manager.menu.showDocumentModalPanel}" showWhenRendered="true"
				headerClass="aon-popupWindow-title"
				minHeight="560" height="560" width="680" top="50" left="300" zindex="1000">
			<f:facet name="header">
           	<h:outputText value="#{appBundle.aon_cdr_add_document}"/>
			</f:facet>
			<f:facet name="controls">
				<a4j:form ajaxSingle="true">
					<aon:commandButton type="button" styleClass="aon-popupWindow-close" immediate="true">
						<f:setPropertyActionListener target="#{manager.menu.showDocumentModalPanel}" value="#{false}" />
						<rich:componentControl for="documentModalPanel" operation="hide" event="onclick" />
					</aon:commandButton>
				</a4j:form>
			</f:facet>
			<aon:form id="documentModalPanelForm">
				<aon:fileUpload id="upload" reRender="table"
					addControlLabel="#{bundle.aon_fileUpload_add}" 
					stopControlLabel="#{bundle.aon_fileUpload_stop}" 
					stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
					uploadControlLabel="#{bundle.aon_fileUpload_upload}"
					fileUploadListener="#{manager.documents.upload.listener}"
					maxFilesQuantity="#{manager.documents.upload.uploadsAvailable}" 
					immediateUpload="true" autoclear="true"
					listHeight="0px"
					onupload="startUpload();" onuploadcanceled="endUpload();" onerror="endUpload();">
					<f:facet name="label">
						<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
					</f:facet>								
					<a4j:support event="onuploadcomplete" reRender="info, closeModalPanel" oncomplete="endUpload();" />
				</aon:fileUpload>								
				<aon:div id="info">
					<aon:div rendered="#{manager.documents.upload.size>0}">
						<aon:div styleClass="aon-section-title" >
							<h:outputText value="#{appBundle.aon_cdr_index_title}" />
						</aon:div>
						<aon:div styleClass="aon-group">
						    <aon:div styleClass="aon-group-body">
								<h:messages />   
								<aon:div styleClass="info-scroll">
									<rich:dataList columns="1" value="#{manager.documents.upload.documents}"
											var="document" rowKeyVar="row" style="border:0;list-style-type:none;" >
										<aon:div styleClass="aon-toolbar" 
												style="padding:1px 1em;margin-bottom:2px;margin-top:1em;">						          
							                <a4j:commandButton id="acceptDocument" value="#{appBundle.aon_cdr_index}"
							                	actionListener="#{manager.onAddDocument}" 
												reRender="documentModalPanelForm, documentPanel"
												styleClass="aon-finding-toolbar-item aon-icon-file-entrance" >
									            <a4j:actionparam name="selected" value="#{row}" assignTo="#{manager.documents.upload.selected}"/>
									        </a4j:commandButton>									
										</aon:div>
										<aon:panelGrid columns="2" style="width:100%">
											<aon:outputLabel for="document_name" 
												value="#{appBundle.aon_cdr_name}" />
											<aon:inputText id="document_name"
												value="#{document.name}" size="30" disabled="true"/>
											<aon:outputLabel for="document_title" 
												value="#{appBundle.aon_cdr_title}" />
											<aon:inputText id="document_title"
												value="#{document.title}" size="30" />

											<aon:outputLabel for="document_keywords" 
												value="#{appBundle.aon_cdr_keywords}" />
											<aon:inputText id="document_keywords"
												value="#{document.keywords}" size="70" />
											<aon:outputLabel for="document_nowords" 
												value="#{appBundle.aon_cdr_nowords}" />
											<aon:inputText id="document_nowords"
												value="#{document.nowords}" size="70" />

											<aon:outputLabel for="document_category" 
												value="#{appBundle.aon_cdr_category}" />
											<aon:selectOneMenu id="document_category" 
													value="#{document.category}" >
												<f:selectItems value="#{manager.categories.categoryItems}"/>
											</aon:selectOneMenu>						
		
											<aon:outputLabel for="document_language"
												value="#{appBundle.aon_cdr_language}"  />
											<aon:selectOneMenu id="document_language" 
													value="#{document.language}" >
												<f:selectItems value="#{search.parameters.languages}"/>
											</aon:selectOneMenu>

											<aon:outputLabel value="#{appBundle.aon_permission_accesslevel}" />
											<aon:selectOneMenu value="#{document.level}">
												<f:selectItems value="#{manager.users.accessLevels}"/>
											</aon:selectOneMenu>						
										</aon:panelGrid>
									</rich:dataList>
								</aon:div>
							</aon:div>				
						</aon:div>					        
					</aon:div>
				</aon:div>
			</aon:form>
		</rich:modalPanel>
	</aon:panelGroup>	
</ui:composition>
</body>
</html>
