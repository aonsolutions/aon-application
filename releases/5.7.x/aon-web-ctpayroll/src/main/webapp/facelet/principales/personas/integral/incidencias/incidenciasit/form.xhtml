<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="nominaitForm">

					<!-- 
						<ui:include
						src="/facelet/templates/formPrintToolbar.xhtml">
					-->
					<ui:include
						src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
						<ui:param name="toolbarTitle"
							value="#{appBundle.aon_payroll_principales_inciit_mnto}" />
						<ui:param name="controller" value="#{nominait}" />

						<aon:methodParam name="backAction"
							value="integralTrab_form" />
						<aon:methodParam name="cancelAction"
							value="integralTrab_form" />

					</ui:include>

					<!--	FIN HEADER & TOOLBAR	-->

					<aon:div id="bonificaData"
						styleClass="aon-scroll-area">
						
						<aon:panelGrid columns="2" dir="true"
							width="100%">

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_bonifica_trabajador}" />
							<aon:outputText value="#{trabajador.to.cdg}" size="3" maxlength="3" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_bonifica_nom_ape}" />
							<aon:div>
								<aon:outputText value="#{trabajador.to.persona.descripcion} " />
								<aon:outputText value="#{trabajador.to.persona.apellido2}, " />
								<aon:outputText value="#{trabajador.to.persona.nombre} " />
							</aon:div>
							
						</aon:panelGrid>
						
						<rich:spacer />

						<aon:panelGrid columns="6" dir="true"
							width="100%">

							<!--  
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_codtra}" />
							<aon:inputText value="#{trabajador.to.cdg}" readonly="#{!bonifica.new}"
								size="" maxlength="" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_datos_tra}" />
							<aon:div>
								<aon:outputText value="#{trabajador.to.persona.descripcion} " />
								<aon:outputText value="#{trabajador.to.persona.apellido2}, " />
								<aon:outputText value="#{trabajador.to.persona.nombre} " />
							</aon:div>
							-->
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_fecini_inci}" />
							<aon:selectInputDate renderAsPopup="true" readonly="#{!nominait.new}"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								id="fecini_inci" required="true"
								value="#{nominait.to.id.feciniit}" enableManualInput="true" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_fecini_inci_nomi}" />
							<aon:selectInputDate renderAsPopup="true" readonly="#{!nominait.new}"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								id="fecini_inci_nomi" required="true"
								value="#{nominait.to.id.fecini}" enableManualInput="true" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_fecfin_inci_nomi}" />
							<aon:selectInputDate renderAsPopup="true" 
								id="fecfin_inci_nomi" required="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{nominait.to.fecfin}" enableManualInput="true" />
								
						</aon:panelGrid>
						
						<rich:spacer />
						
						<aon:panelGrid columns="4" dir="true"
							width="100%">
 
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_dias_it}" />
							<aon:inputText value="#{nominait.to.diasit}"
								id="dias_it" required="true"
								size="2" maxlength="2" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_dias_presta_it}" />
							<aon:inputText value="#{nominait.to.diasemp}"
								id="dias_presta_it" required="true"
								size="2" maxlength="2" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_dias_presta_60}" />
							<aon:inputText value="#{nominait.to.dias60}"
								id="dias_presta_60" required="true"
								size="2" maxlength="2" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_dias_presta}" />
							<aon:inputText value="#{nominait.to.diasSs}"
								id="dias_presta" required="true"
								size="2" maxlength="2" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_dias_sin_presta}" />
							<aon:inputText value="#{nominait.to.diasin}"
								id="dias_sin_presta" required="true"
								size="2" maxlength="2" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_dias_presta_75}" />
							<aon:inputText value="#{nominait.to.dias75}"
								id="dias_presta_75" required="true"
								size="2" maxlength="2" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_importe_presta_ss}" />
							<aon:inputText value="#{nominait.to.ptsSs}"
								id="importe_presta_ss" required="true"
								size="11" maxlength="11" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_importe_presta_empresa}" />
							<aon:inputText value="#{nominait.to.ptsemp}"
								id="importe_presta_empresa" required="true"
								size="11" maxlength="11" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_base_conting_gen}" />
							<aon:inputText value="#{nominait.to.basecon}"
								id="base_conting_gen" required="true"
								size="11" maxlength="11" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_base_accidentes}" />
							<aon:inputText value="#{nominait.to.baseacc}"
								id="base_accidentes" required="true"
								size="11" maxlength="11" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_base_cg_nom}" />
							<aon:inputText value="#{nominait.to.baseconTotal}"
								id="base_cg_nom" required="true"
								size="11" maxlength="11" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_base_acc}" />
							<aon:inputText value="#{nominait.to.baseaccTotal}"
								id="base_acc" required="true"
								size="11" maxlength="11" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_tipoit}" />
							<aon:selectOneRadio id="tipo_it" required="true"
								value="#{nominait.to.tipoit}">
								<f:selectItems
									value="#{nominait.listaTipoIt}" />
							</aon:selectOneRadio>
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_riesgo_embarazo}" />
							<aon:selectBooleanCheckbox value="#{nominait.to.riesgo}" />

						</aon:panelGrid>

					</aon:div>
				</aon:form>

			</ui:define>
		</ui:composition>
	</body>
</html>
