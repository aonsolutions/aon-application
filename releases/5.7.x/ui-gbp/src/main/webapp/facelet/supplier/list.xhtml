<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="supplierList">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid columns="3" dir="true" 
			columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{menuBundle.gbp_supplier}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.gbp_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="supplier_form" actionListener="#{supplier.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}"/>
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						action="supplier_search" actionListener="#{supplier.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}"/>
					<t:commandButton id="suppliers" value="#{appBundle.gbp_print}"
						immediate="true" forceId="true" action="supplier_list"
						onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.jsf');return false;"
						styleClass="aon-finding-toolbar-item aon-icon-printer"
						accesskey="#{bundle.aon_key_print}" />
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">					
			<aon:dataTable id="supplierDataList" 
				value="#{supplier.model}" var="to" rows="20"
				columnClasses="aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left" >
					<aon:rowSelector action="supplier_form" actionListener="#{supplier.onSelect}" />
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_supplier_document}" />
						</f:facet>
						<aon:outputText value="#{to.document}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_supplier_name}" />
						</f:facet>
						<aon:div styleClass="aon-nowrap">
							<aon:outputText value="#{to.name}"/>
						</aon:div>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_supplier_supplierType}" />
						</f:facet>
						<aon:div>
							<aon:outputText value="#{to.supplierType.description}" />
						</aon:div>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_supplier_city}" />
						</f:facet>
						<aon:div>
							<aon:outputText value="#{to.city}" />
						</aon:div>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_supplier_geozone}" />
						</f:facet>
						<aon:div>
							<aon:outputText value="#{to.geozone.name}" />
						</aon:div>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_supplier_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}"/>
					</aon:column>
					
				</aon:dataTable>
						
				<aon:dataScroller dataTable="supplierDataList"
					model="#{supplier.model}" showNote="true" />					
				
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
