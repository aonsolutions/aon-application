<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="productMenu">
		
			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGrid id="group_product"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-product aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.menu_product}"/>
						</f:facet>					
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="item" 
									action="item_search" actionListener="#{item.onEditSearch}"
									value="#{productBundle.product_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="productCategory" 
									action="productCategory" 
									value="#{productBundle.product_category_module}" />
							</aon:div>
							
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="productCategoryGroup" 
									action="productCategoryGroup" 
									value="#{productBundle.product_categoryGroup_module}" />
							</aon:div>
				
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="brand" 
									action="brand"
									value="#{productBundle.product_brand_module}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
	
					<aon:panelGrid id="group_product_price_module"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-sales aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{productBundle.product_price_module}"/>
						</f:facet>					
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="tariff" 
									action="tariff_list" actionListener="#{tariff.onSearch}"
									value="#{productBundle.product_tariff_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="catalogue" 
									action="catalogue_search" actionListener="#{catalogue.onEditSearch}"
									value="#{productBundle.product_catalogue_module}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
	
				</h:panelGrid>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
