<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="pending" value="#{registryStat.pendingInvoiceModel}"
		rows="20"
		columnClasses="aon-editDataTable-dateColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,aon-editDataTable-numberColumn"
		var="to">

		<!--  	<aon:rowSelector action="saleInvoice_form">
			<aon:actionListener method="#{saleInvoice.onEditSearch}"/>	
			<f:setPropertyActionListener value="registry_stats"	target="#{saleInvoice.backAction}" />
			<f:setPropertyActionListener value="#{to.id}"	target="#{saleInvoice.to.id}" />
			<aon:actionListener method="#{saleInvoice.onInvoiceSelect}"/>	
		</aon:rowSelector>-->

		<aon:column alias="Invoice.issueDate"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date}" />
			</f:facet>
			<h:outputText value="#{to.issueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</h:outputText>
		</aon:column>

		<aon:column alias="Invoice.referenceCode"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{financeBundle.finance_invoice_number}" />
			</f:facet>
			<h:outputText value="#{to.referenceCode}" />
		</aon:column>

		<aon:column alias="Invoice.series, Invoice.number"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{financeBundle.finance_invoice_order}" />
			</f:facet>
			<h:outputText value="#{to.documentNumber}" />
		</aon:column>

	<!--  	<aon:column alias="Invoice.registryName"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{customerBundle.customer_customer}" />
			</f:facet>
			<h:outputText value="#{to.registryName}" />
		</aon:column>

		<aon:column alias="Invoice.registryDocument"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_company_document}" />
			</f:facet>
			<h:outputText value="#{to.registryDocument}" />
		</aon:column>-->

		<aon:column alias="Invoice.status"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_status}" />
			</f:facet>
			<aon:outputText value="#{to.status}" />
		</aon:column>
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_total}" />
			</f:facet>
			<aon:outputText value="#{registryStat.pendingInvoicesTotalPrice}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>
		<!--  <aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText
					value="#{financeBundle.finance_checking_finance_status_abbrv}" />
			</f:facet>
			<aon:outputText value="#{registryStat.financeStatus}" />
		</aon:column>-->
		<aon:column
			styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:htmlCommandLink id="invoicePrint-report" title="Ver Factura"
				value="&#160;&#160;&#160;&#160;&#160;&#160;" target="_blank"
				action="#{report.onExecute}"
				actionListener="#{registryStat.onInvoicePdf}"
				styleClass="aon-icon-pdf">
				<f:param name="reportKey" value="invoicePrint" />
			</aon:htmlCommandLink>
		</aon:column>

	</aon:dataTable>


	<aon:dataScroller2 for="pending" showNote="true" />
</ui:composition>
