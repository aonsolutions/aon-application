<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="content">

		<h:form id="expendituresForm">

			<t:div id="aon-content-toolbar" forceId="#{true}" styleClass="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="cancel" value="#{bundle.aon_cancel}"
							forceId="#{true}" immediate="#{true}" action="employee_expenditures_list"
							actionListener="#{expenditures.onCancelEmployee}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
							accesskey="#{bundle.aon_key_cancel}"/>
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">

					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table" style="width:100%"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

							<t:outputLabel for="Employee_registry_document"
								styleClass="aon-form-input-text-label"
								value="#{rBundle.aon_cif}" />
							<t:inputText id="Employee_registry_document" forceId="#{true}"
									styleClass="aon-form-input-text-disabled" disabled="true"
									size="40" value="#{expenditures.resource.employee.registry.document}" />
							
							<t:outputLabel for="Employee_registry_name"
								styleClass="aon-form-input-text-label"
								value="#{rBundle.aon_name}" />
							<t:inputText id="Employee_registry_name" forceId="#{true}"
									styleClass="aon-form-input-text-disabled" disabled="true"
									size="40" value="#{expenditures.resource.employee.registry.name}" />
									
							<t:outputLabel for="Employee_registry_surname"
								styleClass="aon-form-input-text-label"
								value="#{rBundle.aon_surname}" />
							<t:inputText id="Employee_registry_surname" forceId="#{true}"
									styleClass="aon-form-input-text-disabled" disabled="true"
									size="40" value="#{expenditures.resource.employee.registry.surname}" />
					</h:panelGrid>

					<t:dataTable id="ExpendituresDataList" var="to" style="width:100%"
						value="#{expenditures.model}" styleClass="aon-edit-table"
						headerClass="aon-edit-table-header"
						footerClass="aon-edit-table-footer" rowIndexVar="rowIndex"
						rows="20"
						rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
						rowOnMouseOver="selectRow( this )"
						rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
						cellpadding="0" cellspacing="0"
						columnClasses="aon-edit-table-body-icon,
									   aon-edit-table-body aon-edit-table-body-string,
									   aon-edit-table-body aon-edit-table-body-string,
									   aon-edit-table-body aon-edit-table-body-number,
									   aon-edit-table-body aon-edit-table-body-buttons">
									   
						<h:column>
							<f:facet name="header">
								<f:verbatim>&#160;</f:verbatim>
							</f:facet>
							<t:commandLink
								styleClass="aon-table-row-selected"
								rendered="#{to!=expenditures.to}"
								actionListener="#{expenditures.onSelect}" />
							<f:facet name="footer">
								<t:div>
									<t:div rendered="#{!expenditures.new}">
										<t:commandButton value=""
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
											actionListener="#{expenditures.onReset}"
											immediate="#{true}" />
									</t:div>
								</t:div>
							</f:facet>
						</h:column>
									   
						<h:column>
							<f:facet name="header">
								<h:outputText value="#{rBundle.aon_type}" />
							</f:facet>
							<t:outputText value="#{to.item.name}"
								rendered="#{to!=expenditures.to}" />
							<h:selectOneMenu value="#{expenditures.to.item.id}"
								styleClass="aon-form-selectOneMenu-field"
								rendered="#{to==expenditures.to}">
								<f:selectItems value="#{employeeCollections.expendituresItems}" />
							</h:selectOneMenu>
							<f:facet name="footer">
								<t:div>
									<h:selectOneMenu value="#{expenditures.to.item.id}"
										styleClass="aon-form-selectOneMenu-field"
										rendered="#{expenditures.new}">
										<f:selectItems value="#{employeeCollections.expendituresItems}" />
									</h:selectOneMenu>
								</t:div>
							</f:facet>
						</h:column>

						<h:column>
							<f:facet name="header">
								<t:outputText value="#{appBundle.aon_date}" />
							</f:facet>
							<t:outputText value="#{to.date}" rendered="#{to!=expenditures.to}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</t:outputText>
							<t:inputCalendar size="8" id="Expenditures_date-Edit" required="#{true}"
									value="#{expenditures.to.date}"
									monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
									currentDayCellClass="currentDayCell"
									renderAsPopup="true" rendered="#{to==expenditures.to}"
									popupButtonStyleClass="aon-form-calendar-button"
									styleClass="aon-form-input-text"
									popupTodayString="#{bundle.aon_popup_today}"
									popupWeekString="#{bundle.aon_popup_week}" />	
							<f:facet name="footer">
								<t:inputCalendar size="8" id="Fecha" required="#{true}"
									value="#{expenditures.to.date}"
									monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
									currentDayCellClass="currentDayCell"
									renderAsPopup="true" rendered="#{expenditures.new}"
									popupButtonStyleClass="aon-form-calendar-button"
									styleClass="aon-form-input-text"
									popupTodayString="#{bundle.aon_popup_today}"
									popupWeekString="#{bundle.aon_popup_week}" />	
							</f:facet>
						</h:column>
						
						<h:column>
							<f:facet name="header">
								<t:outputText value="#{appBundle.aon_amount}" />
							</f:facet>
							<t:outputText value="#{to.amount}" rendered="#{to!=expenditures.to}" />
							<t:inputText styleClass="aon-form-input-text"
								rendered="#{to==expenditures.to}" 
								id="Expenditures_amount-Edit" required="#{true}"
								forceId="#{true}" value="#{expenditures.to.amount}" size="32"
								maxlength="32" />
							<f:facet name="footer">
								<t:inputText styleClass="aon-form-input-text"
									rendered="#{expenditures.new}" 
									id="Importe" required="#{true}"
									forceId="#{true}" value="#{expenditures.to.amount}" size="32"
									maxlength="32" />
							</f:facet>
						</h:column>
						
						<t:column width="60">
							<f:facet name="header">
								<f:verbatim>&#160;</f:verbatim>
							</f:facet>
							<t:div rendered="#{to==expenditures.to}">
								<t:commandButton title="#{bundle.aon_save}"
									styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save" value=""
									actionListener="#{expenditures.onAccept}" />
								<t:commandButton title="#{bundle.aon_cancel}"
									styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel" value=""
									onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
									actionListener="#{expenditures.onCancel}" immediate="true" />
								<t:commandButton title="#{bundle.aon_remove}"
									styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete" value=""
									actionListener="#{expenditures.onRemove}" immediate="true"
									onclick="return (confirm('#{bundle.aon_remove_confirm}'));" />
							</t:div>
							<f:facet name="footer">
								<t:div>
									<t:div rendered="#{expenditures.new}">
										<t:commandButton title="#{bundle.aon_save}"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save" value=""
											actionListener="#{expenditures.onAccept}" />
										<t:commandButton title="#{bundle.aon_cancel}"
											styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel" value=""
											onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
											actionListener="#{expenditures.onCancel}" immediate="true" />
									</t:div>
								</t:div>
							</f:facet>
						</t:column>
						
					</t:dataTable>

				</t:div>
			</t:div>

		</h:form>

	</ui:define>
</ui:composition>
</body>
</html>
