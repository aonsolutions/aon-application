<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="content">

		<h:form id="workplaceForm" >

			<t:div id="aon-content-menu" forceId="#{true}" styleClass="aon-content-menu" rendered="#{!employee.new}" >
				<t:panelGrid columns="4" cellpadding="0" cellspacing="0" border="0">
					<t:panelGroup>						
							<t:commandLink id="workplace_data" forceId="#{true}" value="#{appBundle.aon_workplace_data}" 
								styleClass="aon-content-menu-item-active" />
					</t:panelGroup>	
					<t:panelGroup>
							<t:commandLink id="workplace_calendar" forceId="#{true}" value="#{rBundle.aon_calendar_data}"
								actionListener="#{workplace.onSchedule}" action="workplace_calendar" 
								styleClass="aon-content-menu-item" />
					</t:panelGroup>	
					<t:panelGroup>
							<t:commandLink id="employee_incidences" forceId="#{true}" value="#{appBundle.aon_employee_incidences}"
								actionListener="#{incidences.onWorkPlace}" action="workplace_incidences" 
								styleClass="aon-content-menu-item" />
					</t:panelGroup>	
					<t:panelGroup>
							<t:commandLink id="workplace_hoursaday" forceId="#{true}" value="#{appBundle.aon_employee_hoursaday}"
								actionListener="#{weeklysummary.onInit}" action="workplace_hoursaday" 
								styleClass="aon-content-menu-item" />
					</t:panelGroup>	
				</t:panelGrid>
			</t:div>

			<t:div id="aon-content-toolbar" forceId="#{true}" styleClass="aon-content-toolbar" >
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							actionListener="#{workplace.accept}" 
							forceId="#{true}"
							onclick="return (confirm('#{bundle.aon_accept_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'" 
							disabled="#{companyAddress.to!=null}"
							accesskey="#{bundle.aon_key_save}"/>
						<t:commandButton id="cancel" value="#{bundle.aon_cancel}"
							forceId="#{true}" immediate="#{true}" action="workplace"
							actionListener="#{workplace.onCancel}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
							accesskey="#{bundle.aon_key_cancel}"/>
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
				
					<h:panelGrid columns="2">
						<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
							styleClass="aon-form-table"
							columnClasses="aon-form-table-column-odd, aon-form-table-column-even">

							<h:outputLabel for="Company_document" value="#{rBundle.aon_cif}" 
								styleClass="aon-form-input-text-label" />
							<h:inputText id="Company_document" value="#{company.to.document}" 
								disabled="#{true}" styleClass="aon-form-input-text" size="10" />
							
							<h:outputLabel for="Company_name" value="#{rBundle.aon_name}" 
								styleClass="aon-form-input-text-label" />
							<h:inputText id="Company_name" value="#{company.to.name}" 
								disabled="#{true}" styleClass="aon-form-input-text" size="45" />
							
							<h:outputLabel for="Company_alias" value="#{rBundle.aon_alias}" 
								styleClass="aon-form-input-text-label" />
							<h:inputText id="Company_alias" value="#{company.to.alias}" 
								disabled="#{true}" styleClass="aon-form-input-text" size="45" />

							<h:outputLabel for="WorkPlace_description" value="#{appBundle.aon_workplace_name}" 
								styleClass="aon-form-input-text-label" />
							<h:inputText id="WorkPlace_description" value="#{workplace.to.description}" 
								styleClass="aon-form-input-text" size="45" />
						</h:panelGrid>

						<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
							styleClass="aon-form-table"
							columnClasses="aon-form-table-column-odd, aon-form-table-column-even">

							<h:outputLabel for="Address_type" value="#{rBundle.aon_type}" 
								styleClass="aon-form-input-text-label" />
							<h:selectOneMenu id="Address_type" styleClass="aon-form-selectOneMenu-field"
									value="#{workplace.to.address.addressType}" 
									valueChangeListener="#{workplace.addressChanged}" >
								<f:selectItems value="#{registryCollections.addressTypes}" />
							</h:selectOneMenu>

							<h:outputLabel for="Address_address" value="#{rBundle.aon_address}" 
								styleClass="aon-form-input-text-label" />
							<h:inputText id="Address_address" styleClass="aon-form-input-text" size="40" 
								value="#{workplace.to.address.address}" 
								valueChangeListener="#{workplace.addressChanged}" />

							<h:outputLabel for="Address_zip" value="#{rBundle.aon_zip}" 
								styleClass="aon-form-input-text-label" />
							<h:inputText id="Address_zip" styleClass="aon-form-input-text" size="10" 
								value="#{workplace.to.address.zip}" 
								valueChangeListener="#{workplace.addressChanged}" />

							<h:outputLabel for="Address_city" styleClass="aon-form-input-text-label" 
								value="#{rBundle.aon_city}" 
								valueChangeListener="#{workplace.addressChanged}" />
							<h:inputText id="Address_city" value="#{workplace.to.address.city}" 
								styleClass="aon-form-input-text" size="25" />

							<h:outputLabel for="Address_geozone" value="#{rBundle.aon_geozone}" 
								styleClass="aon-form-input-text-label" />
							<h:selectOneMenu id="Address_geozone" styleClass="aon-form-selectOneMenu-field"
									value="#{workplace.to.address.geozone.id}"
									valueChangeListener="#{workplace.addressChanged}" >
								<f:selectItems value="#{geozoneCollections.geoZones}" />
							</h:selectOneMenu>
							
						</h:panelGrid>	
					</h:panelGrid>

				</t:div>
			</t:div>
		</h:form>

		<h:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
