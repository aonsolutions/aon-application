<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">

<body>
<ui:composition>

	<t:div styleClass="aon-content-subtitle-calendar-actions">
		<t:div styleClass="aon-content-subtitle-internal-calendar-actions" style="padding:5px 0 4px 1em;">
			<h:outputText value="#{appBundle.aon_workplace_add_child} #{appBundle.aon_workplace}" />
		</t:div>
	</t:div>
	<t:div styleClass="aon-form-group-body">
		<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
				styleClass="aon-form-table" style="width:100%;"
				columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
			<t:outputLabel 
				for="Company_address" 
				styleClass="aon-form-input-text-label"
				value="#{rBundle.aon_address}" />
			<h:panelGrid columns="1">
				<h:inputText id="Company_address"
					styleClass="aon-form-input-text"
					value="#{workplace.to.address.address}"
					size="45"/>
				<h:inputText id="Company_address2"
					styleClass="aon-form-input-text"
					value="#{workplace.to.address.address2}"
					size="45"/>
				<h:inputText id="Company_address3"
					styleClass="aon-form-input-text"
					value="#{workplace.to.address.address3}"
					size="45"/>		
			</h:panelGrid>
			
			<h:outputLabel for="Company_address_city" 
				styleClass="aon-form-input-text-label"
				value="#{rBundle.aon_city}" />
			<h:inputText id="Company_address_city" 
				styleClass="aon-form-input-text"
				value="#{workplace.to.address.city}"
				size="30"/>
				
			<h:outputLabel for="Company_address_zip" 
				styleClass="aon-form-input-text-label"
				value="#{rBundle.aon_zip}" />
			<h:inputText id="Company_address_zip" 
				styleClass="aon-form-input-text"
				value="#{workplace.to.address.zip}"
				size="30"/>
				
			<h:outputLabel for="Company_address_geozone" 
				styleClass="aon-form-input-text-label"
				value="#{rBundle.aon_geozone}" />
			<h:selectOneMenu id="Company_address_geozone"
					value="#{workplace.to.address.geozone.id}"
					styleClass="aon-form-selectOneMenu-field">
				<f:selectItems value="#{geozoneCollections.geoZones}" />
			</h:selectOneMenu>
		</h:panelGrid>
	</t:div>
	
</ui:composition>
</body>
</html>
