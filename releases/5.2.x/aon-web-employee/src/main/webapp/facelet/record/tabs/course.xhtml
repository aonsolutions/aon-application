<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition >

	<t:dataTable id="CourseDataList" var="to" style="width:100%"
		value="#{lhcourse.model}" styleClass="aon-edit-table"
		headerClass="aon-edit-table-header"
		footerClass="aon-edit-table-footer" rowIndexVar="rowIndex"
		rows="20"
		rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
		rowOnMouseOver="selectRow( this )"
		rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
		cellpadding="0" cellspacing="0"
		columnClasses="aon-edit-table-body-icon,
					   aon-edit-table-body aon-edit-table-body-string,
					   aon-edit-table-body aon-edit-table-body-string,
					   aon-edit-table-body aon-edit-table-body-string,
					   aon-edit-table-body aon-edit-table-body-buttons">
					   
		<h:column>
			<f:facet name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			<t:commandLink
				styleClass="aon-table-row-selected"
				rendered="#{to!=lhcourse.to}"
				actionListener="#{lhcourse.onSelect}" />
			<f:facet name="footer">
				<t:div>
					<t:div rendered="#{!lhcourse.new}">
						<t:commandButton value=""
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
							actionListener="#{lhcourse.onReset}"
							immediate="#{true}" />
					</t:div>
				</t:div>
			</f:facet>
		</h:column>
					   
		<h:column>
			<f:facet name="header">
				<t:outputText value="#{appBundle.aon_start_date}" />
			</f:facet>
			<t:outputText value="#{to.startingDate}" rendered="#{to!=lhcourse.to}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</t:outputText>
			<t:inputCalendar size="8" id="Course_startingDate-Edit"
					value="#{lhcourse.to.startingDate}"
					monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
					currentDayCellClass="currentDayCell"
					renderAsPopup="true" rendered="#{to==lhcourse.to}"
					popupButtonStyleClass="aon-form-calendar-button"
					styleClass="aon-form-input-text"
					popupTodayString="#{bundle.aon_popup_today}"
					popupWeekString="#{bundle.aon_popup_week}" />	
			<f:facet name="footer">
				<t:inputCalendar size="8" id="Course_startingDate-New"
					value="#{lhcourse.to.startingDate}"
					monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
					currentDayCellClass="currentDayCell"
					renderAsPopup="true" rendered="#{lhcourse.new}"
					popupButtonStyleClass="aon-form-calendar-button"
					styleClass="aon-form-input-text"
					popupTodayString="#{bundle.aon_popup_today}"
					popupWeekString="#{bundle.aon_popup_week}" />	
			</f:facet>
		</h:column>
		
		<h:column>
			<f:facet name="header">
				<t:outputText value="#{appBundle.aon_end_date}" />
			</f:facet>
			<t:outputText value="#{to.endingDate}" rendered="#{to!=lhcourse.to}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</t:outputText>
			<t:inputCalendar size="8" id="Course_endingDate-Edit"
					value="#{lhcourse.to.endingDate}"
					monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
					currentDayCellClass="currentDayCell"
					renderAsPopup="true" rendered="#{to==lhcourse.to}"
					popupButtonStyleClass="aon-form-calendar-button"
					styleClass="aon-form-input-text"
					popupTodayString="#{bundle.aon_popup_today}"
					popupWeekString="#{bundle.aon_popup_week}" />	
			<f:facet name="footer">
				<t:inputCalendar size="8" id="Course_endingDate-New"
					value="#{lhcourse.to.endingDate}"
					monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
					currentDayCellClass="currentDayCell"
					renderAsPopup="true" rendered="#{lhcourse.new}"
					popupButtonStyleClass="aon-form-calendar-button"
					styleClass="aon-form-input-text"
					popupTodayString="#{bundle.aon_popup_today}"
					popupWeekString="#{bundle.aon_popup_week}" />	
			</f:facet>
		</h:column>
		
		<h:column>
			<f:facet name="header">
				<t:outputText value="#{rBundle.aon_description}" />
			</f:facet>
			<t:outputText value="#{to.description}" rendered="#{to!=lhcourse.to}" />
			<t:inputText styleClass="aon-form-input-text"
				rendered="#{to==lhcourse.to}" id="Course_description-Edit"
				forceId="#{true}" value="#{lhcourse.to.description}" size="32"
				maxlength="32" />
			<f:facet name="footer">
				<t:inputText styleClass="aon-form-input-text"
					rendered="#{lhcourse.new}" id="Course_description-New"
					forceId="#{true}" value="#{lhcourse.to.description}" size="32"
					maxlength="32" />
			</f:facet>
		</h:column>
		
		<t:column width="60">
			<f:facet name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			<t:div rendered="#{to==lhcourse.to}">
				<t:commandButton title="#{bundle.aon_save}"
					styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save" value=""
					actionListener="#{lhcourse.onAccept}" />
				<t:commandButton title="#{bundle.aon_cancel}"
					styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel" value=""
					onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
					actionListener="#{lhcourse.onCancel}" immediate="true" />
				<t:commandButton title="#{bundle.aon_remove}"
					styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete" value=""
					actionListener="#{lhcourse.onRemove}" immediate="true"
					onclick="return (confirm('#{bundle.aon_remove_confirm}'));" />
			</t:div>
			<f:facet name="footer">
				<t:div>
					<t:div rendered="#{lhcourse.new}">
						<t:commandButton title="#{bundle.aon_save}"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save" value=""
							actionListener="#{lhcourse.onAccept}" />
						<t:commandButton title="#{bundle.aon_cancel}"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel" value=""
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
							actionListener="#{lhcourse.onCancel}" immediate="true" />
					</t:div>
				</t:div>
			</f:facet>
		</t:column>
		
	</t:dataTable>

</ui:composition>

</body>
</html>
