<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">
		<h:form id="expensesDismissal">
			<t:div id="aon-content-toolbar" forceId="#{true}"
				styleClass="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{appBundle.calculator_calculate}"
							actionListener="#{calculator.onCalculateCompanyExpensesFromDismissal}" 
							action="calculate_company_expenses_from_dismissal"
							forceId="#{true}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							accesskey="#{bundle.aon_key_save}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table" style="width:70%"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="expensesDismissal_salary"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.calculator_annual_gross_salary}" />
						<t:inputText id="expensesDismissal_salary" size="10" forceId="#{true}"
							styleClass="aon-form-input-text" required="true"
							value="#{calculator.grossSalary}" />

						<t:outputLabel for="expensesDismissal_seniorityDate"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.calculator_seniority_date}" />
						<t:inputCalendar size="10" id="expensesDismissal_seniorityDate"
							value="#{calculator.seniorityDate}"
							monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
							currentDayCellClass="currentDayCell"
							renderAsPopup="true"
							popupButtonStyleClass="aon-form-calendar-button"
							styleClass="aon-form-input-text"
							popupTodayString="#{bundle.aon_popup_today}"
							popupWeekString="#{bundle.aon_popup_week}" />
					</h:panelGrid>

					<ui:insert name="calculation" />
				</t:div>
			</t:div>
		</h:form>
	</ui:define>

</ui:composition>

</ui:composition>

</body>
</html>
