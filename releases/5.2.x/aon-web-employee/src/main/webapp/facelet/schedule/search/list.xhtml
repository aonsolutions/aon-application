<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<!-- toolbar navigation -->
	<t:div id="aon-content-toolbar" forceId="#{true}" styleClass="aon-content-toolbar" >
		<t:div styleClass="aon-content-toolbar-internal">
			<t:div styleClass="aon-content-toolbar-item-group">
				<t:commandButton id="search_event" forceId="#{true}" 
					value="#{bundle.aon_search} #{plannerBundle.aon_planner_event_label}s"
					styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
					actionListener="#{eventFinder.init}" action="find_events" 
					onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
					onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'" />
				<h:commandButton id="back" value="#{bundle.aon_back}" immediate="#{true}"
						actionListener="#{eventFinder.onCancel}" action="#{planner.calendarOutcome}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" />
			</t:div>
		</t:div>
	</t:div>

	<t:div id="aon-content-subtitle" forceId="#{true}" styleClass="aon-content-subtitle" >
		<t:div styleClass="aon-content-subtitle-internal" >
			<h:outputText value="#{plannerBundle.aon_planner_find_event}(s)" />
		</t:div>
	</t:div>

	<t:div id="aon-scroll-area" forceId="#{true}">
		<t:div styleClass="aon-scroll-area-internal" style="margin:0px;">
			<!-- start of bag panel -->
			<!-- start of flow layout -->
			<t:dataTable id="plannerData" var="to"
				value="#{eventFinder.events}" 
				styleClass="aon-edit-table" headerClass="aon-edit-table-header" footerClass="aon-edit-table-footer" 
				rows="20"
				rowClasses="aon-edit-table-row-odd, aon-edit-table-row-even"
				rowOnMouseOver="selectRow( this )" rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-table-body aon-table-body-string,
							   aon-table-body aon-table-body-string,
							   aon-table-body aon-table-body-string,
							   aon-table-body aon-table-body-string,
							   aon-table-body aon-table-body-string,
							   aon-table-body aon-table-body-number">
		
				<h:column>
					<f:facet name="header">
						<h:outputText value="#{plannerBundle.aon_planner_subject_label}" />
					</f:facet>
					<h:outputText value="#{to.title}" />
					<t:commandLink immediate="#{true}"  
						styleClass="aon-table-row-selected"
						actionListener="#{eventFinder.onSelect}" action="#{planner.eventOutcome}" />
				</h:column>
		
				<h:column>
					<f:facet name="header">
						<h:outputText value="#{plannerBundle.aon_planner_event_category}" />
					</f:facet>
					<h:outputText value="#{to.category}" />
				</h:column>
		
				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.aon_start_date}" />
					</f:facet>
					<t:outputText value="#{to.startTime}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</t:outputText>
				</h:column>
		
				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.aon_end_date}" />
					</f:facet>
					<t:outputText value="#{to.endTime}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</t:outputText>
				</h:column>
		
				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.aon_gap}" />
					</f:facet>
					<t:outputText value="#{to.startTime}" >
						<f:convertDateTime pattern="#{appBundle.aon_time_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</t:outputText>
					<f:verbatim>&#160;-&#160;</f:verbatim>
					<t:outputText value="#{to.endTime}" >
						<f:convertDateTime pattern="#{appBundle.aon_time_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</t:outputText>
				</h:column>
		
				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.aon_length}" />
					</f:facet>
					<t:outputText value="#{to.dur}" />
				</h:column>
			</t:dataTable>
		</t:div>
	</t:div>

</ui:composition>
</body>
</html>
