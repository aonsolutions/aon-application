<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>
<ui:composition>

	<!--  toolbar navigation -->
	<t:div id="aon-content-toolbar" forceId="#{true}" styleClass="aon-content-toolbar" >
		<t:div styleClass="aon-content-toolbar-internal">
			<t:div styleClass="aon-content-toolbar-item-group">
				<h:commandButton id="accept" value="#{bundle.aon_accept}" 
						actionListener="#{event.accept}" action="#{planner.calendarOutcome}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" />
				<h:commandButton id="remove" value="#{bundle.aon_remove}" disabled="#{event.new}"
						actionListener="#{event.remove}" action="#{planner.calendarOutcome}"
						onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" />
				<h:commandButton id="back" value="#{bundle.aon_back}" immediate="#{true}"
						actionListener="#{event.onCancel}" action="#{planner.calendarOutcome}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" />
			</t:div>
		</t:div>
	</t:div>

	<t:div id="aon-content-subtitle" forceId="#{true}" styleClass="aon-content-subtitle" >
		<t:div styleClass="aon-content-subtitle-internal" >
			<h:outputText value="#{event.title}" />
		</t:div>
	</t:div>

	<t:div id="aon-scroll-area" forceId="#{true}">
		<t:div styleClass="aon-scroll-area-internal" style="margin:0px;">
			<!-- start of bag panel -->
			<!-- start of flow layout -->
			<h:panelGrid columns="2" cellspacing="0" cellpadding="0" dir="true" 
						columnClasses="aon-form-table-column-odd-label, aon-form-table-column-even-label"> 

			   	<t:div style="padding:1.7em 1em 0 0;" >
				    <h:panelGrid columns="1" cellspacing="0" cellpadding="0" >
					   	<t:div id="plannerNavigator" forceId="#{true}"
					   			style="border:#CCC 1px solid;padding:1em" >
					        <t:inputCalendar
					            monthYearRowClass="yearMonthHeader"
					            weekRowClass="weekHeader"
					            currentDayCellClass="currentDayCell"
					            value="#{planner.date}"
					            valueChangeListener="#{planner.calendarValueChanged}"
					            binding="#{planner.dateInput}"/>
						</t:div>
				    </h:panelGrid>
				</t:div>

				<t:panelTabbedPane id="schedule_event" forceId="#{true}" 
							styleClass="aon-tabpanel" style="width:490px;"
							activeTabStyleClass="aon-tabpanel-active" 
							inactiveTabStyleClass="aon-tabpanel-inactive" 
						   	serverSideTabSwitch="#{false}" >

					<!-- SETUP -->
					<ui:include src="/facelet/schedule/action/setup.xhtml" />
				
					<!-- RECURRENCE -->
					<ui:include src="/facelet/schedule/action/recurrence.xhtml" />

				</t:panelTabbedPane>

			</h:panelGrid>
		</t:div>
	</t:div>
			
</ui:composition>
</body>
</html>
