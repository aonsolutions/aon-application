<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<!-- toolbar navigation -->
	<t:div id="aon-content-toolbar" forceId="#{true}" styleClass="aon-content-toolbar" >
		<t:div styleClass="aon-content-toolbar-internal">
			<t:div styleClass="aon-content-toolbar-item-group">
				<h:commandButton id="search" value="#{bundle.aon_search}" 
						actionListener="#{eventFinder.onAccept}" action="found_events_list"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" />
				<h:commandButton id="back" value="#{bundle.aon_back}" immediate="#{true}"
						actionListener="#{eventFinder.onCancel}" action="#{planner.calendarOutcome}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" />
			</t:div>
		</t:div>
	</t:div>

	<t:div id="aon-content-subtitle" forceId="#{true}" styleClass="aon-content-subtitle" >
		<t:div styleClass="aon-content-subtitle-internal" >
			<h:outputText value="#{plannerBundle.aon_planner_find_event}(s)" />
		</t:div>
	</t:div>

	<t:div id="aon-scroll-area" forceId="#{true}">
		<t:div styleClass="aon-scroll-area-internal" style="margin:0px;">
			<!-- start of bag panel -->
			<!-- start of flow layout -->
			<h:panelGrid columns="2" cellpadding="0" cellspacing="0" >
				<h:outputLabel for="Event_title" value="#{plannerBundle.aon_planner_subject_label}" 
							styleClass="aon-form-input-text-label"/>
				<t:inputText id="Event_title" forceId="#{true}" value="#{eventFinder.title}" size="64" 
							styleClass="aon-form-input-text"/>

				<h:outputLabel for="Event_category" value="#{plannerBundle.aon_planner_event_category}" styleClass="aon-form-input-text-label"/>
				<h:selectOneMenu id="Event_category" value="#{eventFinder.category}" >
					<f:selectItems id="categories" value="#{eventFinder.categories}" />
				</h:selectOneMenu>

				<h:outputLabel for="Event_date" value="#{appBundle.aon_date}" styleClass="aon-form-input-text-label"/>
				<h:panelGroup style="white-space:nowrap;width:100%;">
					<t:inputText id="Event_date" forceId="#{true}"
							styleClass="aon-form-input-text" maxlength="12"
							value="#{eventFinder.date}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</t:inputText>
					<t:commandButton styleClass="aon-form-calendar-button"
						id="Event_date_button" forceId="#{true}" 
						value=""
						immediate="true" />
					<script type="text/javascript">
					  Calendar.setup( {
						inputField  : "Event_date", button : "Event_date_button",
						ifFormat    : "#{appBundle.aon_calendar_pattern}" } );
					</script>
             	</h:panelGroup>
			</h:panelGrid>
		</t:div>
	</t:div>

</ui:composition>

</body>
</html>
