<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<rich:jQuery timing="onload" selector="#Account_invoiceType"
			query="focus()" />

		<aon:form id="invoiceEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_entry_invoice_module}" />
				<ui:param name="toolbarDescription"
					value="#{invoiceEntry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="toolbarContent">

					<aon:commandButton
						value="#{accountingBundle.accounting_entry_generate}"
						id="saveInvoice"
						title="#{accountingBundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{invoiceEntry.onGenerate}"
						action="#{invoiceEntry.generate}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						disabled="#{invoiceEntry.details.rowCount == 0}"
						onclick="if (!confirm('#{accountingBundle.accounting_entry_generate}?'))  return false;" />
					<aon:commandButton value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						title="#{bundle.aon_reset} (ALT+#{bundle.aon_key_new})"
						actionListener="#{invoiceEntry.onReset}"
						rendered="#{!invoiceEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset" />
					<aon:commandButton value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="accountEntry_search"
						title="#{bundle.aon_remove} (ALT+#{bundle.aon_key_remove})"
						actionListener="#{invoiceEntry.onRemove}"
						rendered="#{!invoiceEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;" />

					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_form" rendered="#{!invoiceEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_search" rendered="#{invoiceEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />

					<aon:commandButton id="finances" reRender="FinancesData"
						value="#{accountingBundle.accounting_generate_finances}"
						title="#{accountingBundle.accounting_generate_finances} (ALT+W)"
						actionListener="#{invoiceEntry.generateFinances}" accesskey="W"
						styleClass="aon-finding-toolbar-item aon-icon-sincronize"
						rendered="#{invoiceEntry.details.rowCount > 0 and invoiceEntry.finances.rowCount==0}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:div id="invoiceContainer">

					<aon:panelGrid id="invoiceTables1" columns="4" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-100
							,aon-panelGrid-even aon-width-300
							,aon-panelGrid-odd aon-width-100
							,aon-panelGrid-even aon-width-auto">

						<aon:outputLabel for="Account_invoiceType"
							value="#{bundle.aon_type}" />
						<aon:div>
							<aon:selectOneMenu id="Account_invoiceType"
								disabled="#{invoiceEntry.details.rowCount > 0 or invoiceEntry.newDetail}"
								value="#{invoiceEntry.header.type}">
								<f:selectItems value="#{accountingCollections.invoiceTypes}" />
								<a4j:support event="onchange" ajaxSingle="true"
									actionListener="#{invoiceEntry.onTypeChanged}"
									reRender="invoiceContainer,TaxesData,retentionTable"
									focus="Account_invoiceTransactionType">
								</a4j:support>
							</aon:selectOneMenu>
							<aon:div style="display:inline; margin-left: 5px;">
								<aon:selectOneMenu id="Account_invoiceTransactionType"
									disabled="#{invoiceEntry.newDetail}"
									value="#{invoiceEntry.header.transaction}">
									<f:selectItems
										value="#{configCollections.invoiceTransactionTypes}" />
								</aon:selectOneMenu>
							</aon:div>
							<aon:div style="display:inline; margin-left: 5px;"
								rendered="#{invoiceEntry.purchase or invoiceEntry.expense}">
								<aon:selectBooleanCheckbox id="Account_investment"
									disabled="#{invoiceEntry.newDetail}"
									value="#{invoiceEntry.header.investment}">
									<a4j:support event="onchange" ajaxSingle="true"
										actionListener="#{invoiceEntry.onInvestmentChanged}"
										reRender="Account_Related" focus="Account_investment">
									</a4j:support>
								</aon:selectBooleanCheckbox>
								<aon:outputLabel for="Account_investment"
									value="#{accountingBundle.accounting_investment}" />
							</aon:div>
						</aon:div>

						<aon:outputLabel for="Account_invoice_series"
							rendered="#{invoiceEntry.sales and invoiceEntry.new}"
							value="#{bundle.aon_series}/#{bundle.aon_number}" />
						<aon:outputLabel for="Account_invoice_seriesI"
							rendered="#{invoiceEntry.sales and !invoiceEntry.new}"
							value="#{bundle.aon_series}/#{bundle.aon_number}" />
						<aon:outputLabel for="Account_invoice_referenceCode"
							rendered="#{!invoiceEntry.sales}"
							value="#{financeBundle.finance_invoice_number}" />
						<aon:panelGroup>
							<aon:selectOneMenu id="Account_invoice_series"
								rendered="#{invoiceEntry.sales}"
								disabled="#{invoiceEntry.newDetail or invoiceEntry.finances.rowCount!=0}"
								valueChangeListener="#{invoiceEntry.onSeriesChanged}"
								reRender="Account_invoice_number"
								value="#{invoiceEntry.header.series}">
								<f:selectItem itemValue="" itemLabel=" " />
								<f:selectItems value="#{configCollections.seriesIds}" />
							</aon:selectOneMenu>
							<aon:inputText id="Account_invoice_number"
								style="margin-left: 5px; margin-bottom: 2px;"
								rendered="#{invoiceEntry.sales}" required="true"
								disabled="#{invoiceEntry.newDetail or invoiceEntry.finances.rowCount!=0}"
								value="#{invoiceEntry.header.number}" size="7" maxlength="7">
								<f:validateLength maximum="7" />
							</aon:inputText>

							<aon:inputText id="Account_invoice_referenceCode"
								rendered="#{!invoiceEntry.sales}" required="true"
								disabled="#{invoiceEntry.newDetail or invoiceEntry.finances.rowCount!=0}"
								value="#{invoiceEntry.header.referenceCode}" size="25"
								maxlength="25" onblur="toUpperCase(this);">
								<f:validateLength maximum="32" />
							</aon:inputText>
						</aon:panelGroup>

						<aon:outputLabel for="AccountEntry_accountPeriod"
							value="#{accountingBundle.accounting_period}" />
						<h:panelGrid columns="2">
							<aon:selectOneMenu id="Account_Period"
								disabled="#{invoiceEntry.newDetail}"
								value="#{invoiceEntry.header.period}"
								focus="Account_invoiceType">
								<f:selectItems
									value="#{accountingCollections.enabledAccountPeriods}" />
							</aon:selectOneMenu>
							<aon:selectOneRadio id="AccountEntry_securityLevel"
								style="display:inline;" disabled="#{invoiceEntry.newDetail}"
								value="#{invoiceEntry.header.securityLevel}">
								<f:selectItems value="#{commonCollections.securityLevels}" />
							</aon:selectOneRadio>
						</h:panelGrid>

						<aon:outputLabel for="Account_date" value="#{bundle.aon_date}" />
						<aon:div>
							<aon:selectInputDate size="8" id="Account_date"
								disabled="#{invoiceEntry.newDetail}"
								value="#{invoiceEntry.header.date}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}">
								<a4j:support ajaxSingle="true" event="oninputchange"
									actionListener="#{invoiceEntry.onDateChanged}"
									reRender="Account_taxDate"
									focus="#{invoiceEntry.sales?'Customer_id':(invoiceEntry.purchase?'Supplier_id':'Creditor_id')}" />
								<a4j:support ajaxSingle="true" event="onchanged"
									actionListener="#{invoiceEntry.onDateChanged}"
									reRender="Account_taxDate"
									focus="#{invoiceEntry.sales?'Customer_id':(invoiceEntry.purchase?'Supplier_id':'Creditor_id')}" />
							</aon:selectInputDate>

							<aon:outputLabel for="Account_taxDate"
								styleClass="aon-form-date-label" style="margin-right: 5px;"
								value="#{accountingBundle.accounting_tax_date}" />
							<aon:selectInputDate size="8" id="Account_taxDate"
								disabled="#{invoiceEntry.newDetail}"
								value="#{invoiceEntry.header.taxDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />
						</aon:div>
					</aon:panelGrid>

					<aon:panelGrid id="invoiceTables2" columns="2" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-100
							,aon-panelGrid-even aon-width-auto">

						<aon:outputText value="#{customerBundle.customer_customer}"
							rendered="#{invoiceEntry.sales}" />
						<aon:outputText value="#{supplierBundle.supplier_supplier}"
							rendered="#{invoiceEntry.purchase}" />
						<aon:outputText value="#{financeBundle.finance_creditor}"
							rendered="#{invoiceEntry.expense}" />

						<aon:div id="aon-lookup" styleClass="aon-lookup">

							<aon:panelGroup rendered="#{invoiceEntry.sales}">
								<a4j:region>
									<aon:lookupInputText id="Customer_id"
										lookup="#{customerLookup}"
										reRender="aon-lookup,invoiceDetails,Account_Related,InvoiceWizard,retentionTable"
										lookupProperty="registry" ajaxSingle="false"
										disabled="#{invoiceEntry.newDetail}"
										lookupChangeListener="#{invoiceEntry.registryChanged}"
										focus="Customer_name"
										value="#{invoiceEntry.header.registry.id}" size="5" />
									<aon:lookupButton
										windowTitle="#{customerBundle.customer_selection}"
										selectReRender="aon-lookup,invoiceDetails,Account_Related,InvoiceWizard,retentionTable"
										lookupChangeListener="#{invoiceEntry.registryChanged}"
										disabled="#{invoiceEntry.newDetail}"
										actionType="search" lookup="#{customerLookup}" minHeight="460"
										minWidth="650" property="#{invoiceEntry.header.registry}"
										focus="Customer_name" lookupProperty="registry">
									</aon:lookupButton>
									<aon:lookupButton windowTitle="#{customerBundle.customer_new}"
										selectReRender="aon-lookup,Account_Related,invoiceDetails,aonToolbar,InvoiceWizard,retentionTable"
										lookup="#{customerLookup}" actionType="new"
										disabled="#{invoiceEntry.newDetail}"
										minWidth="650" minHeight="650"
										lookupChangeListener="#{invoiceEntry.registryChanged}"
										property="#{invoiceEntry.header.registry}"
										lookupProperty="registry">
									</aon:lookupButton>
									<aon:outputLabel for="Customer_name"
										styleClass="aon-form-date-label" style="margin-right: 5px;"
										value="#{bundle.aon_company_name}" />
									<aon:inputText id="Customer_name"
										disabled="#{invoiceEntry.newDetail}"
										value="#{invoiceEntry.header.name}" size="60" />
									<aon:outputLabel for="Customer_document"
										styleClass="aon-form-date-label" style="margin-right: 5px;"
										value="#{bundle.aon_company_document}" />
									<aon:inputText id="Customer_document"
										value="#{invoiceEntry.header.document}" size="12"
										disabled="#{invoiceEntry.newDetail}" >
											<f:validateLength minimum="1" maximum="16" />
											<a4j:support event="onchange" focus="Account_Related"
												reRender="registryDocumentPanel" ajaxSingle="true"/>
									</aon:inputText>
								</a4j:region>
							</aon:panelGroup>

							<aon:panelGroup rendered="#{invoiceEntry.purchase}">
								<a4j:region>
									<aon:lookupInputText id="Supplier_id"
										lookup="#{supplierLookup}"
										reRender="aon-lookup,invoiceDetails,Account_Related,InvoiceWizard,retentionTable"
										lookupProperty="registry" ajaxSingle="false"
										lookupChangeListener="#{invoiceEntry.registryChanged}"
										focus="Supplier_name"
										disabled="#{invoiceEntry.newDetail}"
										value="#{invoiceEntry.header.registry.id}" size="5" />
									<aon:lookupButton
										windowTitle="#{supplierBundle.supplier_selection}"
										selectReRender="aon-lookup,invoiceDetails,Account_Related,InvoiceWizard,retentionTable"
										lookupChangeListener="#{invoiceEntry.registryChanged}"
										disabled="#{invoiceEntry.newDetail}"
										actionType="search" lookup="#{supplierLookup}" minHeight="460"
										minWidth="650" property="#{invoiceEntry.header.registry}"
										focus="Supplier_name" lookupProperty="registry">
									</aon:lookupButton>
									<aon:lookupButton windowTitle="#{supplierBundle.supplier_new}"
										selectReRender="aon-lookup,Account_Related,invoiceDetails,aonToolbar,InvoiceWizard,retentionTable"
										disabled="#{invoiceEntry.newDetail}"
										lookup="#{supplierLookup}" actionType="new" minWidth="650"
										minHeight="650"
										lookupChangeListener="#{invoiceEntry.registryChanged}"
										property="#{invoiceEntry.header.registry}"
										lookupProperty="registry">
									</aon:lookupButton>
									<aon:outputLabel for="Supplier_name"
										styleClass="aon-form-date-label" style="margin-right: 5px;"
										value="#{bundle.aon_company_name}" />
									<aon:inputText id="Supplier_name"
										disabled="#{invoiceEntry.newDetail}"
										value="#{invoiceEntry.header.name}" size="60" />
									<aon:outputLabel for="Supplier_document"
										styleClass="aon-form-date-label" style="margin-right: 5px;"
										value="#{bundle.aon_company_document}" />
									<aon:inputText id="Supplier_document"
										value="#{invoiceEntry.header.document}" size="12"
										disabled="#{invoiceEntry.newDetail}" >
											<f:validateLength minimum="1" maximum="16" />
											<a4j:support event="onchange" focus="Account_Related"
												reRender="registryDocumentPanel" ajaxSingle="true"/>
									</aon:inputText>
								</a4j:region>
							</aon:panelGroup>

							<aon:panelGroup rendered="#{invoiceEntry.expense}">
								<a4j:region>
									<aon:lookupInputText id="Creditor_id"
										lookup="#{creditorLookup}"
										reRender="aon-lookup,invoiceDetails,Account_Related,InvoiceWizard,retentionTable"
										lookupProperty="registry" ajaxSingle="false"
										disabled="#{invoiceEntry.newDetail}"
										lookupChangeListener="#{invoiceEntry.registryChanged}"
										focus="Creditor_name"
										value="#{invoiceEntry.header.registry.id}" size="5" />
									<aon:lookupButton
										windowTitle="#{financeBundle.finance_creditor_selection}"
										selectReRender="aon-lookup,invoiceDetails,Account_Related,InvoiceWizard,retentionTable"
										disabled="#{invoiceEntry.newDetail}"
										lookupChangeListener="#{invoiceEntry.registryChanged}"
										actionType="search" lookup="#{creditorLookup}" minHeight="460"
										minWidth="650" property="#{invoiceEntry.header.registry}"
										focus="Creditor_name" lookupProperty="registry">
									</aon:lookupButton>
									<aon:lookupButton
										windowTitle="#{financeBundle.finance_creditor_new}"
										selectReRender="aon-lookup,Account_Related,invoiceDetails,aonToolbar,InvoiceWizard,retentionTable"
										lookup="#{creditorLookup}" actionType="new"
										disabled="#{invoiceEntry.newDetail}"
										minWidth="650" minHeight="650"
										lookupChangeListener="#{invoiceEntry.registryChanged}"
										property="#{invoiceEntry.header.registry}"
										lookupProperty="registry">
									</aon:lookupButton>
									<aon:outputLabel for="Creditor_name"
										styleClass="aon-form-date-label" style="margin-right: 5px;"
										value="#{bundle.aon_company_name}" />
									<aon:inputText id="Creditor_name"
										value="#{invoiceEntry.header.name}"
										disabled="#{invoiceEntry.newDetail}" size="60" />
									<aon:outputLabel for="Creditor_document"
										styleClass="aon-form-date-label" style="margin-right: 5px;"
										value="#{bundle.aon_company_document}" />
									<aon:inputText id="Creditor_document"
										value="#{invoiceEntry.header.document}" size="12"
										disabled="#{invoiceEntry.newDetail}" >
											<f:validateLength minimum="1" maximum="16" />
											<a4j:support event="onchange" focus="Account_Related"
												reRender="registryDocumentPanel" ajaxSingle="true"/>
									</aon:inputText>
								</a4j:region>
							</aon:panelGroup>
							<aon:panelGroup id="registryDocumentPanel">
								<aon:outputText 
									rendered="#{invoiceEntry.header.validDocument}"
									styleClass="aon-icon-predetermine"
									style="padding-left: 15px;"
									value="&#160;" />
								<aon:outputText 
									rendered="#{!invoiceEntry.header.validDocument}"
									styleClass="aon-icon-exception"
									style="padding-left: 15px;"
									value="&#160;" />
							</aon:panelGroup>
							<aon:panelGroup>
								<aon:panelGroup
									rendered="#{invoiceEntry.sales or invoiceEntry.purchase}">
									<aon:selectBooleanCheckbox id="Header_surcharge"
										reRender="invoiceDetails,aonToolbar,InvoiceWizard,retentionTable"
										styleClass="aon-margin-left"
										value="#{invoiceEntry.header.surcharge}" />
									<aon:outputLabel for="Header_surcharge" styleClass="aon-italic"
										value="#{bundle.aon_surcharge}" />
								</aon:panelGroup>
								<aon:selectBooleanCheckbox id="Header_withholding"
									styleClass="aon-margin-left"
									reRender="invoiceDetails,aonToolbar,InvoiceWizard,retentionTable"
									value="#{invoiceEntry.header.withholding}" />
								<aon:outputLabel for="Header_withholding"
									styleClass="aon-italic" value="#{bundle.aon_retention}" />
							</aon:panelGroup>
						</aon:div>

						<aon:outputLabel for="Account_Related"
							value="#{accountBundle.account_account}" />
						<aon:selectOneMenu id="Account_Related"
							disabled="#{invoiceEntry.newDetail}"
							value="#{invoiceEntry.header.account}" style="width: 380px;">
							<f:selectItems value="#{invoiceEntry.relatedAccounts}" />
						</aon:selectOneMenu>
					</aon:panelGrid>

					<aon:panelGrid id="retentionTable" columns="2" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-100
							,aon-panelGrid-even aon-width-auto">
						<aon:outputLabel for="Invoice_charged_retention_account"
							rendered="#{invoiceEntry.header.withholding and !invoiceEntry.sales}"
							value="#{accountingBundle.accounting_retention_account}" />
						<aon:selectOneMenu id="Invoice_charged_retention_account"
							rendered="#{invoiceEntry.header.withholding and !invoiceEntry.sales}"
							value="#{invoiceEntry.header.retentionAccount}">
							<f:selectItems
								value="#{accountCollections.chargedRetentionAccounts}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="Invoice_paid_retention_account"
							rendered="#{invoiceEntry.header.withholding and invoiceEntry.sales}"
							value="#{accountingBundle.accounting_retention_account}" />
						<aon:selectOneMenu id="Invoice_paid_retention_account"
							rendered="#{invoiceEntry.header.withholding and invoiceEntry.sales}"
							value="#{invoiceEntry.header.retentionAccount}">
							<f:selectItems
								value="#{accountCollections.paidRetentionAccounts}" />
						</aon:selectOneMenu>

					</aon:panelGrid>
					<aon:div id="InvoiceWizard" styleClass="aon-panelGrid-search">
						<aon:panelGrid columns="11" style="width: 100%;"
							rendered="#{invoiceEntry.registryFilled}"
							styleClass="aon-margin-top"
							columnClasses="aon-panelGrid-odd aon-width-100
							,aon-panelGrid-even aon-width-auto
							,aon-panelGrid-odd  aon-width-120
							,aon-panelGrid-even aon-width-80
							,aon-panelGrid-odd aon-width-60
							,aon-panelGrid-even aon-width-60
							,aon-panelGrid-odd aon-width-60
							,aon-panelGrid-even aon-width-60
							,aon-panelGrid-odd aon-width-60
							,aon-panelGrid-even aon-width-60
							,aon-panelGrid-even aon-width-80">



							<aon:outputLabel for="AccountEntry_concept"
								value="#{bundle.aon_concept}" />
							<rich:comboBox id="AccountEntry_concept" style="display:inline;"
								disabled="#{invoiceEntry.newDetail}"
								suggestionValues="#{accountingCollections.conceptsDescriptions}"
								value="#{invoiceEntry.header.concept}" maxlength="32"
								width="150" directInputSuggestions="true"
								inputStyle="font-family: arial,lucida Grande, Trebuchet MS,sans-serif;font-size:1em;"
								buttonDisabledStyle="display:none;"
								buttonInactiveStyle="display:none;" buttonStyle="display:none;" />

							<aon:outputLabel for="Invoice_TaxableBase"
								value="#{bundle.aon_taxable_base} (F9)" />
							<aon:inputText id="Invoice_TaxableBase"
								value="#{invoiceEntry.header.taxableBase}" size="10"
								disabled="#{invoiceEntry.newDetail}">
								<a4j:support event="onkeyup"
									onsubmit="if(event.keyCode != 120) return false;"
									eventsQueue="debitKeyUp" ignoreDupResponses="true"
									requestDelay="100"
									reRender="InvoiceWizard,invoiceDetails,TaxesData,aonToolbar,financesTotal"
									actionListener="#{invoiceEntry.onAdjustTaxableBase}"
									focus="Invoice_TaxableBase">
								</a4j:support>
							</aon:inputText>

							<aon:outputLabel for="Invoice_TaxPercent"
								value="% #{bundle.aon_vat}" />

							<aon:inputText id="Invoice_TaxPercent"
								value="#{invoiceEntry.header.taxPercent}" size="2"
								disabled="#{invoiceEntry.newDetail}">
								<a4j:support event="onkeyup"
									onsubmit="if(event.keyCode != 120) return false;"
									eventsQueue="debitKeyUp" ignoreDupResponses="true"
									requestDelay="100"
									reRender="invoiceContainer,invoiceDetails,TaxesData,aonToolbar,financesTotal"
									actionListener="#{invoiceEntry.onAdjustTaxableBase}"
									focus="Invoice_TaxableBase">
								</a4j:support>
							</aon:inputText>

							<aon:div>
								<aon:outputLabel for="Invoice_SurchargePercent"
									rendered="#{invoiceEntry.header.surcharge}"
									value="% #{bundle.aon_surcharge}" />
							</aon:div>
							<aon:div>
								<aon:inputText id="Invoice_SurchargePercent"
									value="#{invoiceEntry.header.surchargePercent}" size="2"
									rendered="#{invoiceEntry.header.surcharge}"
									disabled="#{invoiceEntry.newDetail}">
									<a4j:support event="onkeyup"
										onsubmit="if(event.keyCode != 120) return false;"
										eventsQueue="debitKeyUp" ignoreDupResponses="true"
										requestDelay="100"
										reRender="invoiceContainer,invoiceDetails,TaxesData,aonToolbar,financesTotal"
										actionListener="#{invoiceEntry.onAdjustTaxableBase}"
										focus="Invoice_TaxableBase">
									</a4j:support>
								</aon:inputText>
							</aon:div>

							<aon:div>
								<aon:outputLabel for="Invoice_RetPercent"
									rendered="#{invoiceEntry.header.withholding}"
									value="% #{bundle.aon_retention} (F9)" />
							</aon:div>
							<aon:div>
								<aon:inputText id="Invoice_RetPercent"
									value="#{invoiceEntry.header.retPercent}" size="2"
									rendered="#{invoiceEntry.header.withholding}"
									disabled="#{invoiceEntry.newDetail}">
									<a4j:support event="onkeyup"
										onsubmit="if(event.keyCode != 120) return false;"
										eventsQueue="debitKeyUp" ignoreDupResponses="true"
										requestDelay="100"
										reRender="invoiceContainer,invoiceDetails,TaxesData,aonToolbar,financesTotal"
										actionListener="#{invoiceEntry.onAdjustTaxableBase}"
										focus="Invoice_TaxableBase">
									</a4j:support>
								</aon:inputText>
							</aon:div>

							<aon:div>
								<aon:commandButton value="#{accountingBundle.accounting_add}"
									rendered="#{invoiceEntry.registryFilled}"
									disabled="#{invoiceEntry.newDetail}"
									styleClass="aon-finding-toolbar-item aon-icon-favorite"
									actionListener="#{invoiceEntry.onTaxableBaseWizard}"
									reRender="invoiceContainer,invoiceDetails,TaxesData,aonToolbar,financesTotal"
									focus="Invoice_TaxableBase">
								</aon:commandButton>
							</aon:div>
						</aon:panelGrid>
					</aon:div>
				</aon:div>
				<aon:div id="invoiceDetails">
					<ui:include
						src="/com/code/aon/ui/accounting/facelet/entry/invoice/form_lines.xhtml" />

					<ui:include
						src="/com/code/aon/ui/accounting/facelet/entry/invoice/form_finances.xhtml" />
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
	</ui:define>
</ui:composition>
