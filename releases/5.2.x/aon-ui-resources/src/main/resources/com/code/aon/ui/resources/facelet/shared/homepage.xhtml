<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<h:panelGrid styleClass="aon-width-all aon-height-all aon-margin-top aon-padding-right"
		columnClasses="#{companyDisplay.show?'aon-width-300,':''}">
		<f:facet name="header">
			<aon:outputText styleClass="aon-date-label" value="#{aonConfiguration.currentDate}" />
		</f:facet>		
		<c:if test="#{companyDisplay.show}">
			<ui:include src="/com/code/aon/ui/company/facelet/companyDisplay/info.xhtml" >
				<ui:param name="skipConnectedLabel" value="#{true}" />
				<ui:param name="skipRightBorder" value="#{true}" />				
			</ui:include>
		</c:if>
	</h:panelGrid>
	<ui:include src="/com/code/aon/ui/resources/facelet/shared/footer.xhtml" />
</ui:composition>
