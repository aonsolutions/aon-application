<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="employeeForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{companyBundle.company_employee_module}" />
				<ui:param name="controller" value="#{employee}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<c:if test="#{employee.new}">
					<ui:include src="/com/code/aon/ui/company/facelet/employee/formNewContent.xhtml">
						<ui:param name="controller" value="#{employee}" />
					</ui:include>				
				</c:if>							
				<c:if test="#{!employee.new}">			
					<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-150,
							aon-panelGrid-even aon-width-auto,
							aon-panelGrid-odd aon-width-120,
							aon-panelGrid-even aon-width-auto">
	
						<ui:include 
							src="/com/code/aon/ui/company/facelet/employee/formContent.xhtml">
							<ui:param name="controller" value="#{employee}" />
						</ui:include>
					</aon:panelGrid>

					<aon:panelTabSet selectedTab="#{employee.selectedTab}">
						<aon:panelTab id="address" label="#{registryBundle.registry_address_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{employeeAddress}" />
							</ui:include>
						</aon:panelTab>
	
						<aon:panelTab id="media" label="#{registryBundle.registry_media_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{employeeMedia}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{workActivityLookup}" />
		<c:if test="#{aonConfiguration.bean.rmedia.showSendEmail}">
			<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		</c:if>
	</ui:define>
</ui:composition>
