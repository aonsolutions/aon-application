<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition>

	<aon:panelGroup id="showCheckinModalPanel">
		<rich:modalPanel id="checkinModalPanel"
				rendered="#{manager.menu.showCheckinModalPanel}" showWhenRendered="true"
				headerClass="aon-popupWindow-title"
				minHeight="200" height="200" width="425" top="100" left="250" zindex="2000">
			<f:facet name="header">
            	<h:outputText value="#{appBundle.aon_cdr_checkin_document}"/>
			</f:facet>
			<f:facet name="controls">
				<aon:commandButton type="button" styleClass="aon-popupWindow-close" immediate="true">
					<f:setPropertyActionListener target="#{manager.menu.showCheckinModalPanel}" value="#{false}" />
					<rich:componentControl for="checkinModalPanel" operation="hide" event="onclick" />
				</aon:commandButton>
			</f:facet>

			
				
			<aon:form id="checkinModalPanelForm">				
				
				<aon:fileUpload id="upload" reRender="table"
					addControlLabel="#{menuBundle.aon_ecm_selectDocument}" 
					stopControlLabel="#{bundle.aon_fileUpload_stop}" 
					stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
					uploadControlLabel="#{bundle.aon_fileUpload_upload}"
					clearControlLabel="#{menuBundle.aon_ecm_clear}" clearAllControlLabel="#{menuBundle.aon_ecm_clearall}"
					fileUploadListener="#{manager.documents.upload.listener}"
					maxFilesQuantity="1" 
					immediateUpload="true" listHeight="6em">
					<f:facet name="label">
						<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
					</f:facet>								
					<a4j:support event="onuploadcomplete" reRender="closeModalPanel" />
				</aon:fileUpload>								

				<aon:div id="closeModalPanel" >
					<aon:div style="text-align:right;" rendered="#{manager.documents.upload.size>0}">
						<aon:div styleClass="aon-toolbar" 
								style="padding:1px 1em;margin-bottom:2px;margin-top:1em;float:right">
							<aon:commandButton value="#{menuBundle.aon_version_checkin}" immediate="true"
									reRender="checkinModalPanel, documentPanel"
									actionListener="#{manager.onCheckin}" 
									styleClass="aon-finding-toolbar-item aon-icon-file-entrance">
								<f:setPropertyActionListener target="#{manager.menu.showCheckinModalPanel}" value="#{false}" />
								<rich:componentControl for="checkinModalPanel" operation="hide" event="onclick" />
							</aon:commandButton>
							<aon:commandButton value="#{menuBundle.aon_ecm_close}" immediate="true"
									reRender="checkinModalPanel"
									actionListener="#{manager.documents.upload.clearUploadData}" 
									styleClass="aon-finding-toolbar-item aon-icon-cancel" style="border-right:0;">
								<f:setPropertyActionListener target="#{manager.menu.showCheckinModalPanel}" value="#{false}" />
								<rich:componentControl for="checkinModalPanel" operation="hide" event="onclick" />
							</aon:commandButton>
						</aon:div>
					</aon:div>
				</aon:div>
			</aon:form>
		</rich:modalPanel>
	</aon:panelGroup>

</ui:composition>
</body>
</html>
