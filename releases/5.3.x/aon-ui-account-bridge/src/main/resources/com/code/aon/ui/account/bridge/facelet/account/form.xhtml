<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{accountBridgeBundle.account_relationships_module}" />
				<ui:param name="controller" value="#{accountManager}" />
				<aon:methodParam name="backAction" value="#{accountManager.backAction}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Account_id" value="#{bundle.aon_id}" />
					<aon:inputText id="Account_id" value="#{accountManager.to.id}"
						required="#{true}" size="10" maxlength="9"
						disabled="#{!accountManager.new}">
						<f:validateLength maximum="9" />
						<a4j:support event="onchange" ajaxSingle="true"
							actionListener="#{accountManager.onIdentifierChanged}"
							reRender="dataTable" focus="Account_description" />
					</aon:inputText>

					<aon:outputLabel for="Account_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Account_description"
						value="#{accountManager.to.description}" required="#{true}"
						size="100">
						<f:validateLength maximum="100" />
					</aon:inputText>

					<aon:outputLabel for="Account_alias" value="#{bundle.aon_alias}" />
					<aon:inputText id="Account_alias"
						value="#{accountManager.to.alias}" size="20">
						<f:validateLength maximum="32" />
					</aon:inputText>
				</aon:panelGrid>

				<c:if
					test="#{!accountManager.new and accountManager.to.entryEnabled}">
					<aon:panelTabSet id="accountTab"
						selectedTab="#{accountManager.selectedTab}">
						<aon:panelTab id="customer"
							label="#{customerBundle.customer_module}">
							<ui:include
								src="/com/code/aon/ui/account/bridge/facelet/account/customerAccountGrid.xhtml" />
						</aon:panelTab>
						<aon:panelTab id="creditor"
							label="#{financeBundle.finance_creditor_module}">
							<ui:include
								src="/com/code/aon/ui/account/bridge/facelet/account/creditorAccountGrid.xhtml" />
						</aon:panelTab>
						<aon:panelTab id="supplier"
							label="#{supplierBundle.supplier_module}">
							<ui:include
								src="/com/code/aon/ui/account/bridge/facelet/account/supplierAccountGrid.xhtml" />
						</aon:panelTab>
						<aon:panelTab id="bank" label="#{configBundle.config_bank_module}">
							<ui:include
								src="/com/code/aon/ui/account/bridge/facelet/account/registryBankAccountGrid.xhtml" />
						</aon:panelTab>
						<aon:panelTab id="tax" label="#{configBundle.config_tax_module}">
							<ui:include
								src="/com/code/aon/ui/account/bridge/facelet/account/taxAccountGrid.xhtml" />
						</aon:panelTab>
						<aon:panelTab id="loan"
							label="#{accountingBundle.accounting_loan_module}">
							<ui:include
								src="/com/code/aon/ui/account/bridge/facelet/account/loanAccountGrid.xhtml" />
						</aon:panelTab>
						<aon:panelTab id="product" label="#{productBundle.product_module}">
							<ui:include
								src="/com/code/aon/ui/account/bridge/facelet/account/productAccountGrid.xhtml" />
						</aon:panelTab>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
	</ui:define>
</ui:composition>
