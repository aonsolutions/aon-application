<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.hiru_course}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{bundle.aon_search}" />
				</aon:div>					
					

				<!--  toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						action="hiru_course_list"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_search}">
						<aon:actionListener method="#{hiru_course.onSearch}" />
					</aon:commandButton>					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						rendered="#{cms.roleEditor}"
						action="hiru_course_search"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}">
						<aon:actionListener method="#{hiru_course.onReset}" />
					</aon:commandButton>
					<aon:commandButton id="cancel"
						value="#{bundle.aon_cancel}"
						action="hiru_course_list" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}">
						<aon:actionListener method="#{hiru_course.onCancel}" />
					</aon:commandButton>
				</aon:div>			
			<!-- end toolbar navigation -->
			</aon:panelGrid>	
		</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="HiruCourse_alias"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="HiruCourse_alias" size="50"
						valueChangeListener="#{hiru_course.addExpression}" />

					<aon:outputLabel for="HiruCourse_initDate"
						value="#{appBundle.hiru_course_initDate}" />
					<aon:div>
						<aon:outputLabel for="HiruCourse_initDate-From"
							value="#{appBundle.aon_date_from}" />
						<aon:selectInputDate id="HiruCourse_initDate-From"
							value="#{hiru_course.initDateFrom}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>

						<aon:outputLabel for="HiruCourse_initDate-To"
							value="#{appBundle.aon_date_to}" />
						<aon:selectInputDate id="HiruCourse_initDate-To"
							value="#{hiru_course.initDateTo}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
					</aon:div>					

					<aon:outputLabel for="HiruCourse_endDate"
						value="#{appBundle.hiru_course_endDate}" />
					<aon:div>
						<aon:outputLabel for="HiruCourse_endDate-From"
							value="#{appBundle.aon_date_from}" />
						<aon:selectInputDate id="HiruCourse_endDate-From"
							value="#{hiru_course.endDateFrom}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>

						<aon:outputLabel for="HiruCourse_endDate-To"
							value="#{appBundle.aon_date_to}" />
						<aon:selectInputDate id="HiruCourse_endDate-To"
							value="#{hiru_course.endDateTo}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true">
						</aon:selectInputDate>
					</aon:div>					

					<aon:outputLabel for="HiruCourse_hiruOrganizerCentre_id"
						value="#{appBundle.hiru_course_hiruOrganizerCentre}"/>
					<aon:selectOneMenu id="HiruCourse_hiruOrganizerCentre_id"  
						valueChangeListener="#{hiru_course.addExpression}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.hiruOrganizerCentreList}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="HiruCourse_active"
						value="#{appBundle.hiru_course_active}"/>
					<aon:selectOneMenu id="HiruCourse_active"  
						value="#{hiru_course.activeTo}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItem itemLabel="#{appBundle.hiru_course_active}" itemValue="true" />
						<f:selectItem itemLabel="#{appBundle.hiru_course_inactive}" itemValue="false" />
					</aon:selectOneMenu>

				</aon:panelGrid>
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
