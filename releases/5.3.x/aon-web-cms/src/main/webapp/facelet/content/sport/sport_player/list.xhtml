<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.sport_player}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="sport_player_form"
							rendered="#{cms.roleEditor}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{sport_player.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="sport_player_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{sport_player.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="home"
							value="#{bundle.aon_home}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
		
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="dataTable" value="#{sport_player.model}" var="to"
					rows="#{sport_player.pageLimit}" rendered="#{sport_player.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
							aon-editDataTable-textColumn">
							
					<aon:rowSelector
						action="sport_player_form" actionListener="#{sport_player.onSelect}" />												
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_player_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_player_sportClub}" />
						</f:facet>
						<aon:outputText value="#{to.sportClub.description}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sport_player_active}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >																											
							<aon:commandLink title="#{appBundle.sport_player_activate}" 
								action="sport_player_list"
								actionListener="#{sport_player.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="SP_active" alt="#{appBundle.sport_player_activate}"
									url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.sport_player_deactivate}" 
								action="sport_player_list"
								actionListener="#{sport_player.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="SP_deactive" alt="#{appBundle.sport_player_deactivate}"
									url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:column>

				</aon:dataTable>
			
				<aon:dataScroller2 for="dataTable" showNote="true" />					

			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
