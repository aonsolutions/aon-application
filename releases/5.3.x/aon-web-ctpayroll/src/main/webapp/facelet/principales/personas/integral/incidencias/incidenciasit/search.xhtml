<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="nominaitSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_principales_inciit_mnto}" />
				<ui:param name="controller" value="#{nominait}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{nominait.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="nominait_list" />



					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_fecini_inci}" />
					<aon:selectInputDate renderAsPopup="true"
						valueChangeListener="#{nominait.addEqualExpression}"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						id="Nominait_id_feciniit" enableManualInput="true" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_fecini_inci_nomi}" />
					<aon:selectInputDate renderAsPopup="true"
						valueChangeListener="#{nominait.addEqualExpression}"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						id="Nominait_id_fecini" enableManualInput="true" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_fecfin_inci_nomi}" />
					<aon:selectInputDate renderAsPopup="true"
						valueChangeListener="#{nominait.addEqualExpression}"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						id="Nominait_fecfin" enableManualInput="true" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_dias_it}" />
					<aon:inputText id="Nominait_diasit" size="" maxlength="" 
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_dias_presta_it}" />
					<aon:inputText id="Nominait_diasemp" size="" maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_dias_presta_60}" />
					<aon:inputText id="Nominait_dias60" size="" maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_dias_presta}" />
					<aon:inputText id="Nominait_diasSs" size="" maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_dias_sin_presta}" />
					<aon:inputText id="Nominait_diasin" size="" maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_dias_presta_75}" />
					<aon:inputText id="Nominait_dias75" size="" maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_importe_presta_ss}" />
					<aon:inputText id="Nominait_ptsSs" size="" maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_importe_presta_empresa}" />
					<aon:inputText id="Nominait_ptsemp" size="" maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_base_conting_gen}" />
					<aon:inputText id="Nominait_basecon" size="" maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_base_accidentes}" />
					<aon:inputText id="Nominait_baseacc" size="" maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_base_cg_nom}" />
					<aon:inputText id="Nominait_baseconTotal" size=""	maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_base_acc}" />
					<aon:inputText id="Nominait_baseaccTotal" size=""	maxlength=""  
						valueChangeListener="#{nominait.addExpression}"/>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_tipoit}" />
					<aon:selectOneRadio id="Nominait_tipoit" 
						valueChangeListener="#{nominait.addExpression}">
						<aon:enumConverter
							enum="com.code.aon.payroll.enumeration.Tipoit" />
						<f:selectItems value="#{nominait.listaTipoIt}" />
					</aon:selectOneRadio>

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_inciit_riesgo_embarazo}" />
					<aon:selectBooleanCheckbox id="Nominait_riesgo"  
						valueChangeListener="#{nominait.addEqualExpression}" />



				</ui:define>
			</ui:decorate>

		</aon:form>


	</ui:define>

</ui:composition>
