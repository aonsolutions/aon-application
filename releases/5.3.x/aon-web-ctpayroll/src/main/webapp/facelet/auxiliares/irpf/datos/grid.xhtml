<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="irpfData" value="#{irpf.model}" 
			var="to" rows="20"
			
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{irpf.to == null}" actionListener="#{irpf.onSelect}" 
			/>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{irpf.onReset}" value=""
							rendered="#{!irpf.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
					
				</f:facet>
			</aon:column>
			
			
			    <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__datos_desde}" />
				</f:facet>
				<aon:outputText value="#{to.id.fecini}" rendered="#{to!=irpf.to}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					       <aon:selectInputDate required="true"
								requiredMessage="fecini"
							rendered="#{to==irpf.to}"
								value="#{irpf.to.id.fecini}" inputSize="10"
								renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
							</aon:selectInputDate>
															
							<f:facet name="footer">
							<aon:selectInputDate required="true"
								requiredMessage="fecini"
							     rendered="#{irpf.new}"
								value="#{irpf.to.id.fecini}" inputSize="10"
								renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
							</aon:selectInputDate>
								</f:facet>
					</aon:column>
				
			
	         <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__datos_hasta}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}" rendered="#{to!=irpf.to}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
		              </aon:outputText>
						<aon:selectInputDate required="true"
								requiredMessage="fecfin"
							rendered="#{to==irpf.to}"
								value="#{irpf.to.fecfin}" inputSize="10"
								renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
							</aon:selectInputDate>
															
							<f:facet name="footer">
										<aon:selectInputDate required="true"
								requiredMessage="fecini"
							rendered="#{irpf.new}"
								value="#{irpf.to.fecfin}" inputSize="10"
								renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
							</aon:selectInputDate>
								</f:facet>
					</aon:column>
				
		        <aon:column>
				 <f:facet name="header">
				 	<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__datos_Hastaimp}" />
				 </f:facet>
				 <aon:outputText value="#{to.hasta}" rendered="#{to!=irpf.to}" />
					
			
				 <aon:inputText  styleClass="aon-form-input-text"
					rendered="#{to==irpf.to}" 
					value="#{irpf.to.hasta}" maxlength="20" size="20"  />
				<f:facet name="footer">
					<aon:inputText  styleClass="aon-form-input-text"  
						rendered="#{irpf.new}" 
						value="#{irpf.to.hasta}" maxlength="20" size="20"  />
				</f:facet>
					</aon:column>
				
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf__datos_impelem}" />
				</f:facet>
				<aon:outputText value="#{to.importe}" rendered="#{to!=irpf.to}" />
					
			
				<aon:inputText styleClass="aon-form-input-text"
					rendered="#{to==irpf.to}" 
					value="#{irpf.to.importe}" maxlength="20" size="20"  />
				<f:facet name="footer">
					<aon:inputText  styleClass="aon-form-input-text"  
						rendered="#{irpf.new}" 
						value="#{irpf.to.importe}" maxlength="20" size="20"  />
				</f:facet>
			</aon:column>
			 
			

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=irpf.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==irpf.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{irpf.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==irpf.to}"
						actionListener="#{irpf.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==irpf.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{irpf.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!irpf.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{irpf.new}"
							actionListener="#{irpf.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{irpf.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{irpf.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
		<aon:dataScroller2 for="irpfData"  />
	</aon:div>

</ui:composition>
