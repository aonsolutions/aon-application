<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="marketingMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGrid id="group_marketing_marketing"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-marketing aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{marketingBundle.marketing_marketing}" />
						</f:facet>							
						<aon:div styleClass="aon-direct-access-list">	
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="campaign"
									action="campaign_list" actionListener="#{campaign.onSearch}"
									value="#{marketingBundle.marketing_campaign_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="communicationCenter"
									action="communicationCenter" actionListener="#{communicationCenter.onInit}"
									value="#{commercialBundle.commercial_communication_center_module}" />										
							</aon:div>
						</aon:div>
					</aon:panelGrid>
					
					<aon:panelGrid id="group_marketing_general"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-general">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.menu_general}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="question"
									action="question_list" actionListener="#{question.onSearch}"
									value="#{marketingBundle.marketing_question_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="surveyResponse"
									action="surveyResponse_list" actionListener="#{surveyResponse.onSearch}"
									value="#{marketingBundle.marketing_survey_response_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="survey"
									action="survey_list" actionListener="#{survey.onSearch}" 
									value="#{marketingBundle.marketing_survey_module}" />
							</aon:div>								
						</aon:div>
					</aon:panelGrid>							
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
