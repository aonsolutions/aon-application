<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="tariffForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="toolbarTitle" value="#{productBundle.product_tariff_module}" />
				<ui:param name="controller" value="#{tariff}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">
					<aon:outputLabel for="Tariff_name" value="#{productBundle.product_tariff}" />
					<aon:inputText id="Tariff_name" value="#{tariff.to.name}"
						required="#{true}" size="40" />
				</aon:panelGrid>

				<c:if test="#{!tariff.new}">
					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{productBundle.product_catalogue_module}"/>
						</aon:div>
						<aon:div styleClass="aon-group-body"> 
							<aon:div styleClass="aon-group-body-internal">
								<ui:decorate
									template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
									<ui:param name="controller" value="#{tariffCatalogue}" />
									<ui:param name="columnClasses"
										value="aon-editDataTable-textColumn aon-width-200" />
									<ui:define name="columns">

										<aon:column>
											<f:facet name="header">
												<aon:outputText value="#{productBundle.product_catalogue}" />
											</f:facet>
											<aon:outputText value="#{to.catalogue.name}"
												rendered="#{formList}" />
											<aon:selectOneMenu value="#{tariffCatalogue.to.catalogue}"
												rendered="#{formEdit}" required="#{true}">
												<f:selectItems value="#{productCollections.catalogues}" />
											</aon:selectOneMenu>
											<f:facet name="footer">
												<aon:selectOneMenu value="#{tariffCatalogue.to.catalogue}"
													rendered="#{formNew}" required="#{true}">
													<f:selectItems value="#{productCollections.catalogues}" />
												</aon:selectOneMenu>
											</f:facet>
										</aon:column>

									</ui:define>
								</ui:decorate>
							</aon:div>
						</aon:div>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
