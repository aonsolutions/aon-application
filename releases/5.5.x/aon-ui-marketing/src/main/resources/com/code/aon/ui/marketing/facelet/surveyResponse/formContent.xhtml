<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-scroll-area">
	
		<aon:panelGrid id="menuGrid" columns="2" dir="true">

			<aon:outputLabel for="SurveyResponse_id"
				value="#{bundle.aon_id}" />
			<aon:outputText id="SurveyResponse_id" 
				value="#{surveyResponse.to.id}" />

			<aon:outputLabel for="SurveyResponse_survey_id" 
				value="#{marketingBundle.marketing_survey}" />
			<aon:outputText id="SurveyResponse_survey_id"
				value="#{surveyResponse.to.survey.id} (#{surveyResponse.to.survey.description})" />

			<c:if test="#{surveyResponse.to.action.id != null}" >
				<aon:outputLabel for="SurveyResponse_action_id" 
					value="#{marketingBundle.marketing_campaign_action}" />
				<aon:outputText id="SurveyResponse_action_id"
					value="#{surveyResponse.to.action.id} (#{surveyResponse.to.action.campaign.description})" />
			</c:if>
				
			<aon:outputLabel for="SurveyResponse_target_id"
				value="#{target.bundle.commercial_target}" />
			<aon:outputText id="SurveyResponse_target_id"
				value="#{surveyResponse.to.target.registry.fullName}" />						

			<aon:outputLabel for="SurveyResponse_user_id"
				value="#{bundle.aon_login_user}" />
			<aon:outputText id="SurveyResponse_user_id"
				value="#{surveyResponse.to.user.name}" />						

			<aon:outputLabel for="SurveyResponse_date"
				value="#{bundle.aon_date}" />
			<aon:outputText id="SurveyResponse_date" value="#{surveyResponse.to.date}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>					

			<aon:outputLabel for="SurveyResponse_creationDate"
				value="#{marketingBundle.marketing_creationDate}" />
			<aon:outputText id="SurveyResponse_creationDate" value="#{surveyResponse.to.creationDate}" >
				<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>					

		</aon:panelGrid>

		<aon:div styleClass="aon-form-group" rendered="#{!surveyResponse.new}">
			<aon:div styleClass="aon-form-group-title">
				<aon:div styleClass="aon-form-group-title-internal">
					<aon:outputLabel for="surveyResponseDetailData" value="#{marketingBundle.marketing_responses}" />
				</aon:div>
			</aon:div>
			<ui:include src="/com/code/aon/ui/marketing/facelet/surveyResponse/detail.xhtml" />
		</aon:div>

	</aon:div>
	
</ui:composition>
