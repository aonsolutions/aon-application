<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/company/facelet/enterprise/treeTemplate.xhtml">

	<ui:define name="content">
	
		<aon:form id="enterpriseForm">
			<aon:methodParam name="backAction" value="enterprise_form" />
			<aon:methodParam name="removeAction" value="enterprise_form" />
			<aon:methodParam name="cancelAction" value="enterprise_form" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{companyBundle.company_workplace}" />
				<ui:param name="controller" value="#{enterpriseWorkplace}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="multiple_tracking"
						value="#{calendarBundle.aon_calendar_menu}"
						action="calendar_form" 
						actionListener="#{calendar.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-open-popup">
						<f:setPropertyActionListener target="#{calendar.sourceKey}"
							value="1" />
						<f:setPropertyActionListener target="#{calendar.sourceId}"
							value="#{enterpriseWorkplace.to.id}" />
						<aon:actionListener method="#{calendar.onInitialize}" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2" >

					<aon:outputLabel for="WorkPlace_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="WorkPlace_description" size="64"
						maxlength="64" value="#{enterpriseWorkplace.to.description}"
						required="true" />

					<aon:outputLabel for="WorkPlace_address_id"
						value="#{companyBundle.company_workplace_address}" />	
					<aon:selectOneMenu id="WorkPlace_address_id"
						value="#{enterpriseWorkplace.to.address}" required="true">
						<f:selectItems value="#{enterprise.addresses}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="WorkPlace_economicAgreement"
						value="#{companyBundle.company_workplace_economic_agreement}" />	
					<aon:selectOneMenu id="WorkPlace_economicAgreement"
						value="#{enterpriseWorkplace.to.economicAgreement}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{companyCollections.economicAgreements}" />
					</aon:selectOneMenu>					

				</aon:panelGrid>
				
				<c:if test="#{contract != null}">
					<aon:div id="detail_panel">
						<aon:div styleClass="aon-form-group" rendered="#{!enterpriseActivity.new}">
							<aon:div styleClass="aon-form-group-title">
								<aon:div styleClass="aon-form-group-title-internal">
									<aon:outputLabel for="contractData" value="#{companyBundle.company_employee_module}" />
								</aon:div>
							</aon:div>
							
							<aon:methodParam name="rowSelectorAction" value="contractView_form" />
							<ui:include src="/com/code/aon/ui/employee/facelet/contract/listContent.xhtml" >
								<ui:param name="skipEnterpriseColumn" value="#{true}" />
							</ui:include>						
	
						</aon:div>
					</aon:div>
				</c:if>								

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
