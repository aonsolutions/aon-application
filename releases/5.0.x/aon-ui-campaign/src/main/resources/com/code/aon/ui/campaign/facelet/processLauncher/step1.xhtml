<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/com/code/aon/ui/campaign/facelet/processLauncher/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{campaignBundle.process_wizard_step1}" />
	</ui:define>

	<ui:define name="step_content">
		<aon:panelGrid columns="2" dir="true" style="width: 90%;">
			<aon:outputLabel for="wzd_process"
				value="#{campaignBundle.process_process}" />
			<aon:outputText value="#{processWizard.process.description}" />
			<aon:outputLabel for="Campaign_description"
				value="#{bundle.aon_description}" />
			<aon:inputText id="Campaign_description"
				value="#{processWizard.description}" required="true" size="60" />

			<aon:outputLabel for="Campaign_startDate"
				value="#{campaignBundle.aon_initial_date}" />
			<aon:selectInputDate id="Campaign_startDate" required="true"
				value="#{processWizard.startDate}" renderAsPopup="true"
				popupDateFormat="#{bundle.aon_date_pattern}"
				enableManualInput="true">
			</aon:selectInputDate>

			<aon:outputLabel for="Campaign_endDate"
				value="#{campaignBundle.aon_final_date}" />
			<aon:selectInputDate id="Campaign_endDate" required="true"
				value="#{processWizard.endDate}" renderAsPopup="true"
				popupDateFormat="#{bundle.aon_date_pattern}"
				enableManualInput="true">
			</aon:selectInputDate>

			<aon:outputLabel for="Campaign_workGroup"
				value="#{campaignBundle.campaign_supervisor}" />
			<aon:selectOneMenu id="Campaign_workGroup" required="true"
				value="#{processWizard.workGroup}">
				<f:selectItem value="#{nullSelectItem.value}" />
				<f:selectItems value="#{configCollections.workgroupEntities}" />
			</aon:selectOneMenu>
		</aon:panelGrid>
	</ui:define>
</ui:composition>
