<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="undeductibleInvoiceForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{financeBundle.finance_undeductible_invoice_management_module}" />
					<ui:param name="controller" value="#{undeductibleInvoice}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{undeductibleInvoice.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{!undeductibleInvoice.removable or !undeductibleInvoiceFinance.allPending}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							actionListener="#{undeductibleInvoice.generateFinances}"
							rendered="#{undeductibleInvoiceDetail.model.rowCount > 0 and (!undeductibleInvoice.recorded or undeductibleInvoiceFinance.model.rowCount == 0)}"
							styleClass="aon-finding-toolbar-item aon-icon-tree"
							accesskey="#{bundle.aon_key_finance}" />
						<c:if test="#{aonRole.accountingOperator}">
							<aon:commandButton id="record"
								value="#{financeBundle.finance_record}"
								actionListener="#{undeductibleInvoice.onRecordInvoice}"
								rendered="#{undeductibleInvoiceDetail.model.rowCount > 0 and !undeductibleInvoice.recorded}"
								styleClass="aon-finding-toolbar-item aon-icon-task-assume"
								reRender="undeductibleInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandButton id="unrecord"
								value="#{financeBundle.finance_unrecord}"
								actionListener="#{undeductibleInvoice.onUnrecordInvoice}"
								rendered="#{undeductibleInvoice.recorded and !undeductibleInvoice.accountSource}"
								styleClass="aon-finding-toolbar-item aon-icon-task-liberate"
								reRender="undeductibleInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</c:if>
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signToolbar.xhtml">
							<ui:param name="signController" value="#{undeductibleInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{undeductibleInvoice.new or (!undeductibleInvoiceAttachment.attachmentAvailable) or undeductibleInvoice.to.signed or (!certificate.signable)}" />
							<ui:param name="skipCancelSignButton" value="#{undeductibleInvoice.new or (!undeductibleInvoiceAttachment.attachmentAvailable) or (!undeductibleInvoice.to.signed)}" />
							<ui:param name="signButtonReRender" value="undeductibleInvoiceForm,showNewMessageWindow" />
						</ui:include>							
					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Invoice_referenceCode"
						value="#{financeBundle.finance_invoice_number}" />
					<aon:div>
						<aon:inputText id="Invoice_referenceCode" 
							value="#{undeductibleInvoice.to.referenceCode}"
							rendered="#{!undeductibleInvoice.readOnly}" size="15" />
						<aon:outputText styleClass="aon-bold"
							value="#{undeductibleInvoice.to.referenceCode}"
							rendered="#{undeductibleInvoice.readOnly}" />

						<aon:selectOneMenu id="Invoice_securityLevel" styleClass="aon-margin-left"
							value="#{undeductibleInvoice.to.securityLevel}" disabled="#{undeductibleInvoice.readOnly}">
							<f:selectItems value="#{commonCollections.securityLevels}" />
						</aon:selectOneMenu>

						<c:if test="#{company.EInvoice}">
							<aon:outputText value="&#160;"
								rendered="#{!undeductibleInvoice.new and undeductibleInvoice.to.signed}"
								title="#{signBundle.sign_signed}"
								styleClass="aon-icon aon-icon-signed" />
							<aon:outputText value="&#160;"
								rendered="#{!undeductibleInvoice.new and !undeductibleInvoice.to.signed}"
								title="#{signBundle.sign_sign_pending}"
								styleClass="aon-icon aon-icon-unsigned" />
						</c:if>						

						<aon:outputText value="#{undeductibleInvoice.to.status}" />
						<aon:outputText styleClass="aon-italic aon-margin-left"
							value="(#{financeBundle.finance_account_entry}:"
							rendered="#{undeductibleInvoice.recorded}" />
						<aon:outputText styleClass="aon-bold"
							value="#{undeductibleInvoice.accountEntryId}"
							rendered="#{undeductibleInvoice.recorded}" />
						<aon:outputText styleClass="aon-italic" value=")"
							rendered="#{undeductibleInvoice.recorded}" />
					</aon:div>

					<aon:outputLabel for="Invoice_issueDate"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Invoice_issueDate"
						value="#{undeductibleInvoice.to.issueDate}" required="true"
						disabled="#{undeductibleInvoice.readOnly}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Creditor_id"
						value="#{financeBundle.finance_creditor}" />
					<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="Creditor_id"
								value="#{undeductibleInvoice.to.registry.id}"
								disabled="#{undeductibleInvoice.readOnly or !undeductibleInvoiceFinance.allPending}" size="5"
								lookupProperty="registry" lookup="#{creditorLookup}"
								lookupChangeListener="#{undeductibleInvoice.creditorData}"
								reRender="Creditor_full_name,Creditor_registry_document,InvoiceAddress"
								ajaxSingle="true" required="true" />
							<aon:lookupButton
								windowTitle="#{financeBundle.finance_creditor_selection}"
								disabled="#{undeductibleInvoice.readOnly or !undeductibleInvoiceFinance.allPending}" minHeight="460" minWidth="650" 
								property="#{undeductibleInvoice.to.registry}" lookupProperty="registry" lookup="#{creditorLookup}"
								lookupChangeListener="#{undeductibleInvoice.creditorData}"
								selectReRender="Creditor_id,Creditor_full_name,Creditor_registry_document,InvoiceAddress"
								actionType="search">
							</aon:lookupButton>
							<aon:lookupButton 
								windowTitle="#{financeBundle.finance_creditor_new}"
								disabled="#{undeductibleInvoice.readOnly or !undeductibleInvoiceFinance.allPending}" minWidth="650" minHeight="600"
								property="#{undeductibleInvoice.to.registry}" lookupProperty="registry" lookup="#{creditorLookup}"
								lookupChangeListener="#{undeductibleInvoice.creditorData}"
								selectReRender="Creditor_id,Creditor_full_name,Creditor_registry_document,InvoiceAddress"
								actionType="new">
							</aon:lookupButton>
							<aon:inputText id="Creditor_full_name" disabled="#{undeductibleInvoice.readOnly}"
								value="#{undeductibleInvoice.to.registryName}" size="60" />
						</a4j:region>
					</aon:div>

					<aon:outputLabel for="Creditor_registry_document"
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Creditor_registry_document"
						value="#{undeductibleInvoice.to.registryDocument}"
						disabled="#{undeductibleInvoice.readOnly}" size="10" />

					<aon:outputLabel for="Invoice_registryAddress_id"
						value="#{registryBundle.registry_address}" />
					<aon:div id="InvoiceAddress">
						<aon:selectOneMenu id="Invoice_registryAddress_id"
							rendered="#{(undeductibleInvoice.new or undeductibleInvoiceAddress.to.id == null) and undeductibleInvoice.addressCount > 0}"
							disabled="#{undeductibleInvoice.readOnly}"
							value="#{undeductibleInvoice.to.registryAddress.id}">
							<f:selectItems value="#{undeductibleInvoice.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel styleClass="aon-italic"
							value="#{registryBundle.registry_no_address_available}"
							rendered="#{(undeductibleInvoice.new or undeductibleInvoiceAddress.to.id == null) and undeductibleInvoice.addressCount == 0}" />
						<aon:inputText id="Invoice_registryAddress_address"
							rendered="#{!undeductibleInvoice.new and undeductibleInvoiceAddress.to.id != null}"
							value="#{undeductibleInvoice.address}" disabled="true" size="33" />
						<aon:inputText id="Invoice_registryAddress_city"
							rendered="#{!undeductibleInvoice.new and undeductibleInvoiceAddress.to.id != null}"
							value="#{undeductibleInvoice.city}" disabled="true" size="16" />
						<aon:div layout="inline" styleClass="aon-margin-left">
							<aon:commandButton id="popupButton"
								reRender="showInvoiceAddressWindow"
								rendered="#{!undeductibleInvoice.new and !undeductibleInvoice.readOnly}"
								actionListener="#{undeductibleInvoice.onInvoiceAddressShow}"
								styleClass="aon-icon-commandButton aon-icon-file-entrance"
								value="#{registryBundle.registry_address_other}" >
								<f:setPropertyActionListener target="#{undeductibleInvoice.showInvoiceAddressWindow}"
									value="#{true}" />								
							</aon:commandButton>
						</aon:div>
					</aon:div>
					 
					<aon:outputLabel for="Invoice_total" 
						value="#{bundle.aon_total}" />
					<aon:outputText id="Invoice_total" size="15" styleClass="aon-bold"
						value="#{undeductibleInvoice.toInvoiceTotalPrice}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>

				<aon:panelGrid columns="2" style="width: 100%;"
					styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Invoice_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="Invoice_comments" cols="150" rows="2"
						disabled="#{undeductibleInvoice.readOnly}"
						value="#{undeductibleInvoice.to.comments}" />

				</aon:panelGrid>

				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel value="#{financeBundle.finance_invoice_document_number}"
						rendered="#{!undeductibleInvoice.new}" />
					<aon:outputText styleClass="aon-bold"
						value="#{undeductibleInvoice.to.documentNumber}"
						rendered="#{!undeductibleInvoice.new}" />

					<aon:outputLabel for="Invoice_file" rendered="#{!undeductibleInvoice.new and !undeductibleInvoice.to.signed}"
						value="#{financeBundle.finance_invoice_file}" />
					<aon:div id="Invoice_fileDiv" rendered="#{!undeductibleInvoice.new and !undeductibleInvoice.to.signed}">
						<a4j:region>
							<h:panelGrid columns="#{undeductibleInvoiceAttachment.uploaded?3:1}">
								<h:commandLink id="download" value="&#160;" target="_blank"
									immediate="true" rendered="#{undeductibleInvoiceAttachment.uploaded}"
									title="#{financeBundle.finance_download_disk}"
									actionListener="#{undeductibleInvoiceAttachment.downloadAttachment}"
									styleClass="aon-icon-commandButton aon-icon-file-download" />				
								<aon:commandButton id="removeFile" value="&#160;"
									actionListener="#{undeductibleInvoiceAttachment.removeAttachment}" 
									title="#{bundle.aon_fileUpload_remove}" reRender="Invoice_fileDiv"
									immediate="true" rendered="#{undeductibleInvoiceAttachment.uploaded}"
									styleClass="aon-icon-commandButton aon-icon-delete" />
								<aon:fileUpload id="Invoice_file"
									addControlLabel="#{bundle.aon_fileUpload_add}"
									stopControlLabel="#{bundle.aon_fileUpload_stop}"
									stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
									uploadControlLabel="#{bundle.aon_fileUpload_upload}"
									fileUploadListener="#{undeductibleInvoiceAttachment.fileUploaded}"
									listHeight="0px" immediateUpload="true" autoclear="true">
									<f:facet name="label">
										<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
									</f:facet>														
									<a4j:support event="onuploadcomplete" reRender="Invoice_fileDiv" />
								</aon:fileUpload>
							</h:panelGrid>							
						</a4j:region>
					</aon:div>	

				</aon:panelGrid>

				<ui:include	src="/com/code/aon/ui/finance/facelet/undeductibleInvoice/form_detail.xhtml">
					<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
					<ui:param name="detailController" value="#{undeductibleInvoiceDetail}" />
				</ui:include>

				<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/form_finances.xhtml">
					<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
					<ui:param name="detailController" value="#{undeductibleInvoiceDetail}" />
					<ui:param name="financeController" value="#{undeductibleInvoiceFinance}" />
				</ui:include>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAddress.xhtml">
			<ui:param name="invoiceController" value="#{undeductibleInvoice}" />
			<ui:param name="invoiceAddress" value="#{undeductibleInvoiceAddress}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/sign/facelet/signer/modal.xhtml" >
			<ui:param name="signButtonreRender" value="undeductibleInvoiceForm,showNewMessageWindow" />
			<aon:methodParam name="signActionListener" value="#{undeductibleInvoiceSigner.onSign}" type="actionListener" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
	</ui:define>
</ui:composition>
