<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinancePaymentWindow">
		<c:if test="#{finance.showFinancePaymentWindow}">
			<rich:modalPanel id="financePaymentModalPanel" minHeight="240"
				minWidth="520" rendered="#{finance.showFinancePaymentWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{(finance.payment) ? (financeBundle.finance_payment) : (financeBundle.finance_charge)}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFinancePaymentWindow" immediate="true">
							<f:setPropertyActionListener
								target="#{finance.showFinancePaymentWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="financePaymentForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="financePayment-payment"
										value="#{(finance.payment) ? (financeBundle.finance_to_pay) : (financeBundle.finance_to_charge)}"
										reRender="showFinancePaymentWindow,financeForm"
										actionListener="#{finance.onFinancePayment}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<f:setPropertyActionListener
											target="#{finance.showFinancePaymentWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="financePayment-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showFinancePaymentWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{finance.showFinancePaymentWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 80%;">

										<aon:outputLabel for="Finance_paymentDate"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Finance_paymentDate" 
											value="#{finance.paymentDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-110" />

										<aon:outputLabel for="Finance_paymentAmount"
											value="#{bundle.aon_amount}" />
										<aon:inputText id="Finance_paymentAmount"
											value="#{finance.paymentAmount}"
											required="true" size="10" />

										<aon:outputLabel for="Finance_paymentRegistryBank"
											value="#{configBundle.config_bank}"
											rendered="#{finance.paymentRegistryBank != null}" />
										<aon:selectOneMenu id="Finance_paymentRegistryBank"
											value="#{finance.paymentRegistryBank}"
											rendered="#{finance.paymentRegistryBank != null}">
											<f:selectItems value="#{companyCollections.companyBanks}" />
										</aon:selectOneMenu>
										<aon:outputLabel for="Finance_paymentCashAccount"
											value="#{configBundle.config_bank}"
											rendered="#{finance.paymentRegistryBank == null and finance.cashAccountsSize > 1}" />
										<aon:selectOneMenu id="Finance_paymentCashAccount"
											value="#{finance.paymentCashAccount}"
											rendered="#{finance.paymentRegistryBank == null and finance.cashAccountsSize > 1}">
											<f:selectItems value="#{finance.cashAccounts}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="Finance_paymentPayMethod"
											value="#{configBundle.config_pay_method}"
											rendered="#{finance.to.payMethod != null and finance.to.payMethod.id != null}" />
										<aon:outputText id="Finance_paymentPayMethod"
										 	styleClass="aon-bold"
											value="#{finance.to.payMethod.name}"
											rendered="#{finance.to.payMethod != null and finance.to.payMethod.id != null}" />

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
