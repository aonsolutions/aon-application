<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="generatorForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="2" dir="true"
					columnClasses="aon-finding-title,aon-finding-toolbar">
	
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{appBundle.aon_application_title}" />
					</aon:div>
		
					<aon:div styleClass="aon-finding-toolbar-item-group" ajaxRendered="true">
						<aon:commandButton id="generate"
							value="#{infowebBundle.infoweb_generate}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{generator.onGenerate}" immediate="true"
							onclick="Richfaces.showModalPanel('waitProccess')" 
				     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
						<h:outputLink id="preview" value="#{generator.previewPage}" target="_blank"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							rendered="#{generator.generated}" > 
							<aon:outputText value="#{infowebBundle.infoweb_preview}"/>
						</h:outputLink>				     									
						<aon:commandButton id="publish"
							value="#{infowebBundle.infoweb_publish}"
							rendered="#{generator.generated}"
							styleClass="aon-finding-toolbar-item aon-icon-file-upload"
							actionListener="#{generator.onPublish}" immediate="true"
							onclick="Richfaces.showModalPanel('waitProccess')" 
				     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />								
						<h:outputLink id="web" value="#{generator.webPage}" target="_blank"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							rendered="#{generator.published}">
							<aon:outputText value="#{infowebBundle.infoweb_view}"/>
						</h:outputLink>
					</aon:div>
				</aon:panelGrid>
			</aon:div>
		<rich:panel styleClass="aon-content-home">
		</rich:panel>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />		
	</ui:define>
</ui:composition>
