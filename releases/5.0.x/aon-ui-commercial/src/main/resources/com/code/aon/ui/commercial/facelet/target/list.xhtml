<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="targetList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{target.bundle.commercial_target_module}" />
				<ui:param name="controller" value="#{target}" />
				
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<c:if test="#{aonConfiguration.bean.target.showSearchOnlyCustomers}">
							<f:param name="reportKey" value="marketingTargetList" />
						</c:if>
						<c:if test="#{!aonConfiguration.bean.target.showSearchOnlyCustomers}">
							<f:param name="reportKey" value="targetList" />
						</c:if>
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<c:if test="#{aonConfiguration.bean.target.showSearchOnlyCustomers}">
							<f:param name="reportKey" value="marketingTargetList" />
						</c:if>
						<c:if test="#{!aonConfiguration.bean.target.showSearchOnlyCustomers}">
							<f:param name="reportKey" value="targetList" />
						</c:if>
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>						
				</ui:define>				
			</ui:decorate>		
			
			<ui:include src="/com/code/aon/ui/commercial/facelet/target/listContent.xhtml" />

		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
