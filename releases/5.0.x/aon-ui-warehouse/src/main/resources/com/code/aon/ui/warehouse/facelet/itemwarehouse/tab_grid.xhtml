<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{itemWarehouse}" />

		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-150 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="ItemWarehouse_Warehouse" value="#{warehouseBundle.warehouse_warehouse}" />
				</f:facet>
				<aon:outputText value="#{to.warehouse.name}" rendered="#{formList}" />
				<aon:selectOneMenu id="ItemWarehouse_Warehouse" 
					value="#{itemWarehouse.to.warehouse}"
					rendered="#{formEdit}">
					<f:selectItems value="#{warehouseCollections.warehouses}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="ItemWarehouse_Warehouse-New" 
						value="#{itemWarehouse.to.warehouse}"
						rendered="#{formNew}">
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-vertical-align-top aon-width-150 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="StockMax" value="#{warehouseBundle.warehouse_stock_max}" />
				</f:facet>
				<aon:outputText value="#{to.stockMax}" rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:inputText id="StockMax" 
					value="#{itemWarehouse.to.stockMax}"
					rendered="#{formEdit}" size="20" />
				<f:facet name="footer">
					<aon:inputText id="StockMax-New"
						value="#{itemWarehouse.to.stockMax}" 
						rendered="#{formNew}" size="20" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-vertical-align-top aon-width-150 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="StockMin" value="#{warehouseBundle.warehouse_stock_min}" />
				</f:facet>
				<aon:outputText value="#{to.stockMin}" rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:inputText id="StockMin" 
					value="#{itemWarehouse.to.stockMin}"
					rendered="#{formEdit}" size="20" />
				<f:facet name="footer">
					<aon:inputText id="StockMin-New"
						value="#{itemWarehouse.to.stockMin}" 
						rendered="#{formNew}" size="20" />
				</f:facet>
			</aon:column>


			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-auto aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="Location" value="#{warehouseBundle.warehouse_location}" />
				</f:facet>
				<aon:outputText value="#{to.location}" rendered="#{formList}"/>
				<aon:inputText id="Location" 
					value="#{itemWarehouse.to.location}"
					rendered="#{formEdit}" size="25" maxlength="32"/>
				<f:facet name="footer">
					<aon:inputText id="Location-New"
						value="#{itemWarehouse.to.location}" 
						maxlength="32" rendered="#{formNew}" size="20" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-vertical-align-top aon-width-150 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="StockMax" value="#{warehouseBundle.warehouse_item_stock_actual}" />
				</f:facet>
				<aon:outputText value="#{to.stock}" rendered="#{formList or formEdit}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:outputText value="&#160;" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
