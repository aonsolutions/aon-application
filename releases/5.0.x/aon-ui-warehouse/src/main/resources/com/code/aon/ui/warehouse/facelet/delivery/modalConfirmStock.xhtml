<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showConfirmStockWindow">
		<c:if test="#{deliveryDetail.stockWarning}">
			<rich:modalPanel id="confirmStockModalPanel" height="130"
				minWidth="640" rendered="#{deliveryDetail.stockWarning}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_confirm_title}"/>
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showConfirmStockWindow" immediate="true">
							<f:setPropertyActionListener
								target="#{deliveryDetail.stockWarning}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="confirmStockForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">

							<aon:div styleClass="aon-message-big aon-icon-big-info">								
								<aon:outputText value="#{warehouseBundle.warehouse_delivery_not_enough_stock_msg}" />
							</aon:div>					

							<aon:div styleClass="aon-text-center">
								<aon:commandButton id="confirmStock-yes"
									value="#{bundle.aon_yes}"
									actionListener="#{deliveryDetail.onAccept}"
									styleClass="aon-commandButton">
									<f:setPropertyActionListener
										target="#{deliveryDetail.stockWarning}"
										value="#{false}" />
								</aon:commandButton>
								<aon:commandButton id="confirmStock-no"
									value="#{bundle.aon_no}"
									reRender="showConfirmStockWindow" 
									immediate="true"
									styleClass="aon-commandButton">
									<f:setPropertyActionListener
										target="#{deliveryDetail.stockWarning}"
										value="#{false}" />
								</aon:commandButton>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
