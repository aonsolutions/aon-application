<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition>
	<aon:form id="webinfoForm">

	<aon:div styleClass="aon-toolbar">
		<aon:commandButton id="savew" value="#{bundle.aon_save}"
			styleClass="aon-finding-toolbar-item aon-icon-accept"
			actionListener="#{companyWebInfo.accept}"/>
	</aon:div>

	<aon:div style="float:left;margin-right:20px;">
		<aon:panelGrid columns="2" dir="true" style="width:99%">
	
			<aon:outputLabel for="WebInfo_slogan" value="#{registryBundle.web_info_slogan}" />
			<aon:inputText id="WebInfo_slogan" 
				size="64" maxlength="64" value="#{companyWebInfo.to.slogan}" />
	
			<aon:outputLabel for="WebInfo_schedule" value="#{registryBundle.web_info_schedule}" />
			<aon:inputTextarea id="WebInfo_schedule" styleClass="aon-inputText"
				cols="90" rows="3" value="#{companyWebInfo.to.schedule}" />
	
			<aon:outputLabel for="WebInfo_commercialDescription" value="#{appBundle.aon_web_info_description}" />
			<aon:inputTextarea id="WebInfo_commercialDescription"
				value="#{companyWebInfo.to.commercialDescription}" cols="90" rows="15"/>
		</aon:panelGrid>
	</aon:div>

	</aon:form>
</ui:composition>
</body>
</html>
