<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="reportsMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">
		
					<aon:panelGrid columns="1" styleClass="aon-width-all"
						columnClasses="aon-vertical-align-top aon-width-300">

						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-icon-fixed-asset aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.account_fixed_assets}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="amortization" 
										action="amortization_list"
										value="#{accountingBundle.accounting_amortization_form_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="periodAmortization" 
										action="periodAmortization_search"
										value="#{accountingBundle.accounting_period_amortization_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="amortizationType" 
										action="amortizationType_list"
										value="#{accountingBundle.accounting_amortization_type_module}" />
								</aon:div>
							</aon:div>
						</h:panelGrid>
					</aon:panelGrid>
				</aon:componentGroup>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
