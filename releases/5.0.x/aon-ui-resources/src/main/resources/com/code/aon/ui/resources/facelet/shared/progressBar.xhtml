<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:form id="progressBarForm">
		<rich:modalPanel id="progressBarPanel" minWidth="325" autosized="true"
			showWhenRendered="true" zindex="2000" rendered="#{panelVisible}">
			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="#{progressLabel}" />
				</aon:div>
			</f:facet>

			<aon:div styleClass="aon-popupWindow-content">
				<aon:div styleClass="aon-popupWindow-content-internal">
					<a4j:outputPanel id="progressPanel" layout="block">
						<rich:progressBar id="progressBarComponent" style="width:100%"
							value="#{progressBarBean.progressionCurrentValue}"
							enabled="#{progressBarBean.progressionEnabled}" interval="2000"
							label="#{progressBarBean.progressionCurrentValue} %"
							minValue="-1" maxValue="100"
							reRenderAfterComplete="progressPanel">
							<f:facet name="initial">
								<aon:div styleClass="aon-text-center">
									<aon:div>
										<aon:outputText value="#{initialMessage}" />
									</aon:div>
									<aon:div styleClass="aon-margin-top">
										<c:if test="#{!redirect}">
											<aon:commandButton value="#{startMessage}"
												actionListener="#{startActionListener}"
												reRender="progressBarForm" />
										</c:if>
										<c:if test="#{redirect}">
											<aon:commandButton value="#{startMessage}"
												actionListener="#{startActionListener}"
												action="#{redirectAction}" />
										</c:if>
										<aon:commandButton reRender="progressBarForm"
											styleClass="aon-margin-left"
											actionListener="#{closeActionListener}"
											value="#{bundle.aon_close}" />
									</aon:div>
								</aon:div>
							</f:facet>
							<c:if test="#{redirect}">
								<f:facet name="complete">
									<aon:div styleClass="aon-text-center">
										<aon:div>
											<aon:outputText value="#{redirectMessage}" />
										</aon:div>
									</aon:div>
								</f:facet>
							</c:if>
							<c:if test="#{!redirect}">
								<f:facet name="complete">
									<aon:div styleClass="aon-text-center">
										<aon:div>
											<aon:outputText value="#{completeMessage}" />
										</aon:div>
										<aon:div styleClass="aon-margin-top">
											<aon:commandButton reRender="progressBarForm"
												actionListener="#{closeActionListener}"
												value="#{bundle.aon_close}" />
										</aon:div>
									</aon:div>
								</f:facet>
							</c:if>
						</rich:progressBar>
					</a4j:outputPanel>
				</aon:div>
			</aon:div>
		</rich:modalPanel>
	</aon:form>

</ui:composition>
