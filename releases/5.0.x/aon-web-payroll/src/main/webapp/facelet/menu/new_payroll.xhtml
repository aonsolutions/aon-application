<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="newPayrollMenu">
		
			<aon:div styleClass="aon-scroll-area-menu">		
		
				<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column,aon-portlets-column">
	
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{menuBundle.new_payroll_incidencias}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div>
								<aon:commandLink id="mntoit" action="mntoit_search"
									value="#{menuBundle.new_payroll_mntoit}"  >
									<aon:actionListener method="#{itWizard.onEditSearch}" />
									<aon:actionListener method="#{itWizard.onReset}" />
								</aon:commandLink>
							</aon:div>
						</aon:div>
					</aon:panel>
					
				</aon:panelGrid>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
