<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="embargoBasicForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_pricipales_personas_embargos}" />
				<ui:param name="controller" value="#{embargoBasic}" />
				<!--  
				<ui:param name="skipResetButton" value="true" />
				-->
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{embargoBasic.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="embargoBasic_list" />

					<aon:div id="embargoBasic"
						styleClass="aon-scroll-area aon-scroll-area-clientes">
						<aon:panel>
							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_principales_trabajador_cod_persona}" />
							</f:facet>
							<aon:div>
								<aon:inputText id="Embargo_codper" size="4" maxlength="10"
									valueChangeListener="#{embargoBasic.addExpression}" />

							</aon:div>
						</aon:panel>

						<aon:div id="datos" styleClass="aon-scroll-area">
							<aon:panelGrid columns="2" dir="true" width="100%"
								style="margin-bottom=2px;">

								<aon:outputLabel for="Trabajador_cdg"
									value="#{appBundle.aon_payroll_pricipales_personas_embargos_cdg}" />
								<aon:div styleClass="aon-lookup">
									<aon:lookupInputText id="Trabajador_cdg"
										lookup="#{trabajadorLookup}" reRender="Trabajador_codnsz"
										value="#{embargoBasic.trabajador.cdg}" size="5">
									</aon:lookupInputText>
									<aon:lookupButton id="Trabajador_lookup"
										windowTitle="#{appBundle.aon_payroll_pricipales_personas_embargos_cdg}"
										selectReRender="Trabajador_cdg,Trabajador_codnsz"
										lookup="#{trabajadorLookup}" minHeight="440"
										property="#{embargoBasic.trabajador}">
									</aon:lookupButton>
									<!--  
										<aon:inputText
											id="Trabajador_codnsz"
											value="#{(embargoBasic.to.trabajador.codnsz!=null)?(embargoBasic.to.trabajador.codnsz):('')}"
											size="55" disabled="true" />
										-->
								</aon:div>

								<aon:outputLabel for="Embargo_id_fecha"
									value="#{appBundle.aon_payroll_pricipales_personas_embargos_comienzo}" />
								<aon:selectInputDate id="Embargo_id_fecha"
									value="#{embargoBasic.fecha}" renderAsPopup="true"
									enableManualInput="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>

								<aon:outputLabel for="Embargo_concepto"
									value="#{appBundle.aon_payroll_pricipales_personas_embargos_concepto}" />
								<aon:inputText id="Embargo_concepto" size="35" maxlength="30"
									valueChangeListener="#{embargoBasic.addExpression}" />

								<aon:outputLabel for="Embargo_importe"
									value="#{appBundle.aon_payroll_pricipales_personas_embargos_importe}" />
								<aon:inputText id="Embargo_importe" size="15" maxlength="10"
									valueChangeListener="#{embargoBasic.addExpression}" />

								<aon:outputLabel for="Embargo_afecta"
									value="#{appBundle.aon_payroll_pricipales_personas_embargos_afecta}" />
								<aon:selectOneRadio id="Embargo_afecta"
									valueChangeListener="#{embargoBasic.addExpression}">
									<aon:enumConverter
										enum="com.code.aon.payroll.enumeration.Afectados" />
									<f:selectItems value="#{embargoBasic.listaAfectados}" />
								</aon:selectOneRadio>

							</aon:panelGrid>

						</aon:div>

					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>

		<aon:lookupButtonPopup lookup="#{trabajadorLookup}" />

	</ui:define>
</ui:composition>

</body>
</html>
