<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="otrpercList">
			<ui:include	src="/facelet/templates/listPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_principales_personas_percep}" />
				<ui:param name="controller" value="#{percepbasic}"/>
				<aon:methodParam name="resetAction" default="percep_form" resolve="true" />
				<aon:methodParam name="searchAction" value="percep_search" />
				
				<ui:param name="reportKey" value="percepcionesList" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="otrpercData" value="#{percepbasic.model}"
					var="to" rows="20" 
					columnClasses="aon-editDataTable-numberColumn, 
					aon-editDataTable-numberColumn
					aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn,
					aon-editDataTable-textColumn,
					aon-editDataTable-numberColumn">

					<aon:rowSelector action="percep_form"
						actionListener="#{percepbasic.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.id.cdg}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_personas_otrperc_per}" />
						</f:facet>
						<aon:outputText value="#{to.id.numero}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_personas_percep_trab}" />
						</f:facet>
						<aon:outputText value="#{to.trabajador.persona.descripcion} #{to.trabajador.persona.apellido2}, #{to.trabajador.persona.nombre}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_personas_percep_act}" />
						</f:facet>
						<aon:outputText value="#{to.trabajador.actividad.descripcion}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_personas_percep_desc}" />
						</f:facet>
						<aon:outputText value="#{to.descom}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_principales_personas_percep_import}" />
						</f:facet>
						<aon:outputText value="#{to.importe}" />
					</aon:column>

				</aon:dataTable>
				<aon:dataScroller2 for="otrpercData"  showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
</body>
</html>
