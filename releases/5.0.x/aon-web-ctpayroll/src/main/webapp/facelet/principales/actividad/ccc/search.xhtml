<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">


		<aon:form id="avisoSearch">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_principales_act_ccc}" />
				<ui:param name="controller" value="#{emprccc}" />
				<ui:param name="skipResetButton" value="true" />

			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{emprccc.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="emprccc_list" />






					<aon:div id="datos" styleClass="aon-scroll-area">

						<aon:panelGrid columns="2" dir="true" width="100%"
							style="margin-bottom=2px;">




							<aon:outputLabel for="Actividad_cdg"
								value="#{appBundle.aon_payroll_principales_tipocuenta_actividad}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Acti_cdg" lookup="#{actividadLookup}"
									reRender="Acti_description" value="#{emprccc.actividad.cdg}"
									size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Acti_lookup"
									windowTitle="#{appBundle.aon_payroll_principales_tipocuenta_actividad}"
									selectReRender="Acti_cdg,Acti_description"
									lookup="#{actividadLookup}" minHeight="440"
									property="#{emprccc.actividad}">
								</aon:lookupButton>
								<aon:inputText id="Acti_description"
									value="#{(emprccc.actividad.descripcion!=null)?(emprccc.actividad.descripcion):('')}"
									size="60" disabled="true" />
							</aon:div>



							<aon:outputLabel for="Actividad_cdg"
								value="#{appBundle.aon_payroll_principales_act_ccc_num}" />

							<aon:inputText value="#{emprccc.to.descripcion}" size="50" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_autonomos_mutua}" />

							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Mutua_cdg" lookup="#{mutuaLookup}"
									reRender="Mutua_description" value="#{emprccc.mutua.cdg}"
									size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Mut_lookup"
									windowTitle="#{appBundle.aon_payroll_principales_autonomos_mutua}"
									selectReRender="Mutua_cdg,Mutua_description"
									lookup="#{mutuaLookup}" minHeight="440"
									property="#{emprccc.mutua}">
								</aon:lookupButton>
								<aon:inputText id="Mutua_description"
									value="#{(emprccc.mutua.description!=null)?(emprccc.mutua.description):('')}"
									size="34" disabled="true" />
							</aon:div>


							<aon:outputLabel for="Actividad_cdg"
								value="#{appBundle.aon_payroll_principales_act_ccc_tc2}" />

							<aon:inputText id="Emprccc_concol"
								valueChangeListener="#{emprccc.addExpression}" size="50" />

							<aon:outputLabel for="Actividad_cdg"
								value="#{appBundle.aon_payroll_principales_act_ccc_seguro}" />

							<aon:inputText id="Emprccc_seguro"
								valueChangeListener="#{emprccc.addExpression}" size="50" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_act_ccc_indss}" />

							<aon:selectBooleanCheckbox value="#{emprccc.indss}" />

							<aon:outputLabel for="Actividad_cdg" value="  " />

							<aon:panelGroup>
								<aon:outputLabel
									value="#{appBundle.aon_payroll_principales_act_ccc_tipo}" />
								<aon:selectOneRadio id="Emprccc_id_tipccc"
									valueChangeListener="#{emprccc.addExpression}"
									layout="pageDirection">

									<aon:enumConverter
										enum="com.code.aon.payroll.enumeration.Tipccc" />

									<f:selectItems value="#{emprccc.listatipos}" />
								</aon:selectOneRadio>
							</aon:panelGroup>



						</aon:panelGrid>
					</aon:div>
				</ui:define>
			</ui:decorate>


		</aon:form>
		<aon:lookupButtonPopup lookup="#{mutuaLookup}" />
		<aon:lookupButtonPopup lookup="#{actividadLookup}" />

	</ui:define>
</ui:composition>

</body>
</html>
