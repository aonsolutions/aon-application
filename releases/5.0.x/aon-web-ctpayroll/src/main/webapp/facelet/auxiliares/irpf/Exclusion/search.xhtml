<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="exclusionSearch">

			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_auxiliares_irpf__exclusion}" />
				<ui:param name="controller" value="#{exclusion}" />
				<ui:param name="skipResetButton" value="true" />
				<aon:methodParam name="backAction" value="exclusion_form"/>
		     	</ui:include>
			<!-- end toolbar navigation -->

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{exclusion.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="exclusion_form" />				
									
					<aon:outputLabel for="Exclusion_id_fecini"
						value="#{appBundle.aon_payroll_auxiliares_irpf__exclusion_desde}" />
					<aon:selectInputDate id="Exclusion_id_fecini" value="#{exclusion.searchFecini}"
						enableManualInput="true"
						renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}"/>
					
					<aon:outputLabel for="Exclusion_fecfin"
						value="#{appBundle.aon_payroll_auxiliares_irpf__exclusion_hasta}" />
					<aon:selectInputDate id="Exclusion_fecfin" value="#{exclusion.searchFecfin}" 
						enableManualInput="true"
						renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}"/>
						
					<aon:outputLabel for="Exclusion_id_situacion"
						value="#{appBundle.aon_payroll_auxiliares_irpf__exclusion_situacion}" />
					<aon:inputText id="Exclusion_id_situacion" size="10" maxlength="10"
						valueChangeListener="#{exclusion.addExpression}" />
						
					<aon:outputLabel for="Exclusion_id_hijos"
						value="#{appBundle.aon_payroll_auxiliares_irpf__exclusion_nhijos}" />
					<aon:inputText id="Exclusion_id_hijos" size="25" maxlength="25"
						valueChangeListener="#{exclusion.addExpression}" />
						
					<aon:outputLabel for="Exclusion_importe"
						value="#{appBundle.aon_payroll_auxiliares_irpf__exclusion_importe}" />
					<aon:inputText id="Exclusion_importe" size="25" maxlength="25"
						valueChangeListener="#{exclusion.addExpression}" />
						
					
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
