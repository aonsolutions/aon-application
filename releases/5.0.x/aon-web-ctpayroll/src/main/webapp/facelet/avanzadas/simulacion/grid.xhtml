<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="lbonificaData"
			value="#{lbonifica.model}" var="to" rows="0"
			rendered="#{!percepcion.new}"
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				, aon-editDataTable-numberColumn, 
				, aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{lbonifica.to == null}"
				actionListener="#{lbonifica.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{lbonifica.onReset}" value=""
							rendered="#{!lbonifica.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>

				</f:facet>
			</aon:column>

			



			
			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_simulacion_codi}" />
				</f:facet>
				<aon:outputText value="#{to.id.codbon}"
					rendered="#{to!=lbonifica.to}">
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text " 
					rendered="#{to==lbonifica.to}" size="5"
					value="#{lbonifica.to.id.codbon}" maxlength="2" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" 
						rendered="#{lbonifica.new}" size="5"
						value="#{lbonifica.to.id.codbon}" maxlength="2" />
				</f:facet>
			</aon:column>

<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_simulacion_fecinio}" />
				</f:facet>
				<aon:outputText value="#{to.id.fecini}" rendered="#{to!=lbonifica.to}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate required="true" requiredMessage="fecini"
					rendered="#{to==lbonifica.to}" inputSize="10"
					value="#{lbonifica.to.id.fecini}" renderAsPopup="true"
					popupDateFormat="#{appBundle.aon_date_pattern}">
				</aon:selectInputDate>

				<f:facet name="footer">
					<aon:selectInputDate required="true" requiredMessage="fecini"
						rendered="#{lbonifica.new}" value="#{lbonifica.to.id.fecini}"
						inputSize="10" renderAsPopup="true"
						popupDateFormat="#{appBundle.aon_date_pattern}">
					</aon:selectInputDate>

				</f:facet>
			</aon:column>

<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_simulacion_fecfin}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}" rendered="#{to!=lbonifica.to}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate required="true" requiredMessage="fecfin"
					rendered="#{to==lbonifica.to}" inputSize="10"
					value="#{lbonifica.to.fecfin}" renderAsPopup="true"
					popupDateFormat="#{appBundle.aon_date_pattern}">
				</aon:selectInputDate>

				<f:facet name="footer">
					<aon:selectInputDate required="true" requiredMessage="fecini"
						rendered="#{lbonifica.new}" value="#{lbonifica.to.fecfin}"
						inputSize="10" renderAsPopup="true"
						popupDateFormat="#{appBundle.aon_date_pattern}">
					</aon:selectInputDate>

				</f:facet>
			</aon:column>
						
			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_simulacion_hor}" />
				</f:facet>
				<aon:outputText value="#{to.horas}"
					rendered="#{to!=lbonifica.to}">
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text " 
					rendered="#{to==lbonifica.to}" size="5"
					value="#{lbonifica.to.horas}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" 
						rendered="#{lbonifica.new}" size="5"
						value="#{lbonifica.to.horas}" maxlength="10" />
				</f:facet>
			</aon:column>
						
			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_resultados_devengos_importe}" />
				</f:facet>
				<aon:outputText value="#{to.importe}"
					rendered="#{to!=lbonifica.to}">
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text " 
					rendered="#{to==lbonifica.to}" size="5"
					value="#{lbonifica.to.importe}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" 
						rendered="#{lbonifica.new}" size="5"
						value="#{lbonifica.to.importe}" maxlength="10" />
				</f:facet>
			</aon:column>



			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=lbonifica.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]"
						rendered="#{to==lbonifica.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{lbonifica.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==lbonifica.to}"
						actionListener="#{lbonifica.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje"
						title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==lbonifica.to}"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{lbonifica.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!lbonifica.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]"
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{lbonifica.new}"
							actionListener="#{lbonifica.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje"
							title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{lbonifica.new}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{lbonifica.onCancel}"
							immediate="true" accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

		</aon:editDataTable>
	</aon:div>

</ui:composition>
