<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">


	<aon:div id="impresos190ResumenData"
		styleClass="aon-scroll-area aon-scroll-area-clientes">
		
		<rich:panel>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.aon_payroll_resultados_irpf_impresos190_agencia_tribu}"/>
			</f:facet>
			<aon:panelGrid columns="4" dir="true"
				width="100%" style="margin-bottom=2px;">
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_cod_secuencial}" />
				<aon:inputText value="#{impresos190.to.cdg}" size="5" maxlength="4" 
					readonly="#{true}"/>
					
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_anio_devengo}" />
				<aon:inputText value="#{impresos190.to.anio}" size="3" maxlength="2" />
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_empresa_nif}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="impresos190_emprnif_cdg" required="#{true}"
						lookup="#{empresaLookup}" reRender="impresos190_emprnif_descripcion"
						value="#{impresos190.to.emprnif.cdg}" size="5" >
					</aon:lookupInputText>
					<aon:lookupButton id="impresos190_emprnif_lookup"
						windowTitle="#{appBundle.aon_payroll_resultados_irpf_impresos190_empresa_nif}"
						selectReRender="impresos190_emprnif_cdg,impresos190_emprnif_descripcion"
						lookup="#{empresaLookup}" minHeight="440"
						property="#{impresos190.to.emprnif}">
					</aon:lookupButton>
					<aon:inputText id="impresos190_emprnif_descripcion"
						value="#{(impresos190.to.emprnif.descripcion!=null)?(impresos190.to.emprnif.descripcion):('')}"
						size="45" disabled="true" />
				</aon:div>
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_admon_hacienda}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="impresos190_admon_cdg"
						lookup="#{admonLookup}" reRender="impresos190_admon_descripcion"
						value="#{impresos190.to.admon.cdg}" size="5">
					</aon:lookupInputText>
					<aon:lookupButton id="impresos190_admon_lookup"
						windowTitle="#{appBundle.aon_payroll_resultados_irpf_impresos190_empresa_nif}"
						selectReRender="impresos190_admon_cdg,impresos190_admon_descripcion"
						lookup="#{admonLookup}" minHeight="440"
						property="#{impresos190.to.admon}">
					</aon:lookupButton>
					<aon:inputText id="impresos190_admon_descripcion"
						value="#{(impresos190.to.admon.description!=null)?(impresos190.to.admon.description):('')}"
						size="45" disabled="true" />
				</aon:div>
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_provincia}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="impresos190_provincia_cdg" 
						lookup="#{provinciaLookup}" reRender="impresos190_provincia_descripcion"
						value="#{impresos190.to.provincia.cdg}" size="5">
					</aon:lookupInputText>
					<aon:lookupButton id="impresos190_provincia_lookup"
						windowTitle="#{appBundle.aon_payroll_resultados_irpf_impresos190_provincia}"
						selectReRender="impresos190_provincia_cdg,impresos190_provincia_descripcion"
						lookup="#{provinciaLookup}" minHeight="440"
						property="#{impresos190.to.provincia}">
					</aon:lookupButton>
					<aon:inputText id="impresos190_provincia_descripcion"
						value="#{(impresos190.to.provincia.descripcion!=null)?(impresos190.to.provincia.descripcion):('')}"
						size="45" disabled="true" />
				</aon:div>
				
				<aon:outputLabel value="&#160;" />
				<aon:outputText rendered="#{impresos190.to.descuadrado}"
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_descuadro}" />
				
			</aon:panelGrid>
		</rich:panel>
		
		<rich:panel>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.aon_payroll_resultados_irpf_impresos190_resumen_datos}"/>
			</f:facet>
			<aon:panelGrid columns="2" dir="true"
				width="100%" style="margin-bottom=2px;">

				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_num_perceptores}" />
				<aon:inputText value="#{impresos190.to.numPercep}" size="3" maxlength="2" />
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_importe_percepciones}" />
				<aon:inputText value="#{impresos190.to.impPercep}" size="14" maxlength="11" />
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_importe_ret}" />
				<aon:inputText value="#{impresos190.to.impRetenc}" size="14" maxlength="11" />

			</aon:panelGrid>
		</rich:panel>
		
		<rich:panel>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.aon_payroll_resultados_irpf_impresos190_fecha_firma}"/>
			</f:facet>
			<aon:panelGrid columns="4" dir="true"
				width="100%" style="margin-bottom=2px;">
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_representante}" />
				<aon:inputText value="#{impresos190.to.emprnif.representante}" size="70" maxlength="60" />
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_fecha_calculo}" />	
				<aon:selectInputDate renderAsPopup="true"
					popupDateFormat="#{appBundle.aon_date_pattern}"
					value="#{impresos190.to.fecha}" enableManualInput="true" />
					
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_cargo}" />
				<aon:inputText value="#{impresos190.to.emprnif.cargo}" size="70" maxlength="60" />		
				
			</aon:panelGrid>
		</rich:panel>
		
	</aon:div>
</ui:composition>
