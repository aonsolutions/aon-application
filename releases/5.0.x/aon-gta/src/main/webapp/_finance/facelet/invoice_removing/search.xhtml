<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">

<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>
	
	<ui:define name="content">
		<h:form id="invoiceRemovingForm" styleClass="aon-form">

			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<h:commandButton id="search" value="#{bundle.aon_search}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							actionListener="#{invoiceRemover.onSearch}" action="invoice_remover_list"
							accesskey="#{bundle.aon_key_search}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText value="#{bundle.aon_search_header}" />
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<h:outputLabel for="Invoice_series"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.aon_series_number}" />
						<h:panelGrid columns="5">
							<t:inputText id="Invoice_series"
								value="#{invoiceRemover.removingParams.series}"
								styleClass="aon-form-input-text" forceId="#{true}"
								size="5" maxlength="5" />
							<h:outputLabel for="Invoice_fromNumber"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_date_from}" />
							<t:inputText id="Invoice_fromNumber"
								value="#{invoiceRemover.removingParams.fromNumber}"
								styleClass="aon-form-input-text" forceId="#{true}"
								size="7" maxlength="10" />
							<h:outputLabel for="Invoice_toNumber"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_date_to}" />
							<t:inputText id="Invoice_toNumber"
								value="#{invoiceRemover.removingParams.toNumber}"
								styleClass="aon-form-input-text" forceId="#{true}"
								size="7" maxlength="10" />
						</h:panelGrid>

						<t:outputLabel for="Customer_Lookup_id"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.aon_customer}" />
						<t:div>
							<t:inputText id="Customer_Lookup_id" size="5" forceId="#{true}"
								styleClass="aon-form-input-text"
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');"
								value="#{invoiceRemover.removingParams.customerId}"/>
							<h:commandButton id="find_Customer_Lookup_id"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');return false;" />
							<t:inputText id="Customer_full_name" forceId="#{true}"
								styleClass="aon-form-input-text-disabled"
								disabledOnClientSide="true" size="40" />
						</t:div>
							
						<h:outputLabel styleClass="aon-form-input-text-label"
							value="#{financeBundle.aon_invoice_date}" />
						<h:panelGrid columns="4">
							<h:outputLabel for="Invoice_issueDate-From"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_date_from}" />
							<t:inputCalendar size="8" id="Invoice_issueDate-From"
								value="#{invoiceRemover.removingParams.fromDate}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								popupButtonStyleClass="aon-form-calendar-button"
								styleClass="aon-form-input-text"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />
							
							<h:outputLabel for="Invoice_issueDate-To"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_date_to}" />
							<t:inputCalendar size="8" id="Invoice_issueDate-To"
								value="#{invoiceRemover.removingParams.toDate}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								popupButtonStyleClass="aon-form-calendar-button"
								styleClass="aon-form-input-text"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />	
						</h:panelGrid>

						<t:outputLabel for="Invoice_securityLevel"
							styleClass="aon-form-selectOneMenu-label"
							value="#{financeBundle.aon_security_level}" />
						<h:selectOneMenu id="Invoice_securityLevel"
							styleClass="aon-form-selectOneMenu-field"
							value="#{invoiceRemover.removingParams.securityLevel}">
							<f:selectItems value="#{financeCollections.securityLevels}" />
						</h:selectOneMenu>
						
					</h:panelGrid>
				</t:div>
			</t:div>

		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
