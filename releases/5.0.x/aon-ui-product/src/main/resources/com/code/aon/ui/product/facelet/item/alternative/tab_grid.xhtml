<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{itemAlternative}" />

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel value="#{productBundle.product_alternative_priority}" />
				</f:facet>
				<aon:outputText value="#{to.priority}"
					rendered="#{formList}" />
				<aon:inputText id="ItemAlternative_priority" 
					value="#{controller.to.priority}" rendered="#{formEdit}"
					required="true" size="2" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText id="ItemAlternative_priority-New" 
						value="#{controller.to.priority}" rendered="#{formNew}"
						required="true" size="2" maxlength="3" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-auto aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="itemAlternative_AlternativeItem"
						value="#{productBundle.product_item}" />
				</f:facet>
				<aon:outputText value="#{to.alternativeItem.product.code} - #{to.alternativeItem.product.name}"
					rendered="#{formList}" />
				<aon:div id="alternativeItemEdit" styleClass="aon-lookup" rendered="#{formEdit}">
					<a4j:region>
						<aon:lookupInputText id="ItemAlternative_alternativeItem_product_code"
							value="#{itemAlternative.to.alternativeItem.product.code}"
							lookup="#{itemLookup}"
							lookupChangeListener="#{itemAlternative.onAlternativeItemChanged}"
							reRender="alternativeItemEdit" ajaxSingle="false" size="10"
							onblur="toUpperCase(this);">
							<aon:joinProperty alias="Item_product_code"
								value="#{itemAlternative.to.alternativeItem.product.code}" />
						</aon:lookupInputText>
						<aon:lookupButton
							windowTitle="#{productBundle.product_item_selection}"
							minHeight="460" minWidth="650"
							property="#{itemAlternative.to.alternativeItem}" lookup="#{itemLookup}"
							lookupChangeListener="#{itemAlternative.onAlternativeItemChanged}"
							selectReRender="alternativeItemEdit" actionType="search">
						</aon:lookupButton>
						<aon:inputText id="Item_alternative_item_product_name"
							value="#{itemAlternative.to.alternativeItem.product.name}" disabled="true"
							size="100" />
					</a4j:region>
				</aon:div>
				<f:facet name="footer">
					<aon:div id="alternativeItemNew" styleClass="aon-lookup" rendered="#{formNew}">
						<a4j:region>
							<aon:lookupInputText id="ItemAlternative_alternativeItem_product_code-New"
								value="#{itemAlternative.to.alternativeItem.product.code}"
								lookup="#{itemLookup}"
								lookupChangeListener="#{itemAlternative.onAlternativeItemChanged}"
								reRender="alternativeItemNew" ajaxSingle="false" size="10"
								onblur="toUpperCase(this);">
								<aon:joinProperty alias="Item_product_code"
									value="#{itemAlternative.to.alternativeItem.product.code}" />
							</aon:lookupInputText>
							<aon:lookupButton
								windowTitle="#{productBundle.product_item_selection}"
								minHeight="460" minWidth="650"
								property="#{itemAlternative.to.alternativeItem}" lookup="#{itemLookup}"
								lookupChangeListener="#{itemAlternative.onAlternativeItemChanged}"
								selectReRender="alternativeItemNew" actionType="search">
							</aon:lookupButton>
							<aon:inputText id="Item_alternative_item_product_name-New"
								value="#{itemAlternative.to.alternativeItem.product.name}" disabled="true"
								size="100" />
						</a4j:region>
					</aon:div>
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>
</ui:composition>
