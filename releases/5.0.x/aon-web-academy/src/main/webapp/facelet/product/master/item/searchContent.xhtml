<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
		forceId="#{true}">
		<t:div styleClass="aon-content-subtitle-internal">
			<h:outputText value="#{bundle.aon_search_header}" />
		</t:div>
	</t:div>
	<t:div forceId="#{true}" id="aon-scroll-area">
		<t:div styleClass="aon-scroll-area-internal">
			<h:panelGrid columns="2" styleClass="aon-form-table"
				columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
				<h:outputLabel
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
					for="Item_product_code" value="#{productBundle.item_code}" />
				<t:inputText id="Item_product_code" size="10"
					styleClass="aon-form-input-text" onblur="toUpperCase(this);"
					valueChangeListener="#{itemAlias.addExpression}" />

				<h:outputLabel
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
					for="Item_product_name" value="#{productBundle.item_description}" />
				<t:inputText id="Item_product_name" size="50"
					styleClass="aon-form-input-text"
					valueChangeListener="#{itemAlias.addExpression}" />

				<h:outputLabel
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
					for="Item_product_category_id"
					value="#{productBundle.item_category}" />
				<h:selectOneMenu styleClass="aon-form-selectOneMenu-field"
					id="Item_product_category_id"
					converter="IntegerEmptyConverter"
					valueChangeListener="#{itemAlias.addExpression}">
					<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
					<f:selectItems value="#{productCollections.categories}" />
				</h:selectOneMenu>

				<h:outputLabel
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
					for="Item_status" value="#{productBundle.item_status}" />
				<h:selectOneMenu styleClass="aon-form-selectOneMenu-field"
					id="Item_status" valueChangeListener="#{itemAlias.addDirectExpression}"
					converter="aonProductStatusConverter">
					<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
					<f:selectItems value="#{productCollections.productStatuses}" />
				</h:selectOneMenu>
			</h:panelGrid>
		</t:div>
	</t:div>
</ui:composition>

</body>
</html>
