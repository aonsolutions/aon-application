<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />	
		<t:stylesheet path="/jscalendar-1.0/calendar-system.css" />
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/lang/calendar-es.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar-setup.js">
			// nothing
		</script>
	</ui:define>
	
	<ui:define name="content">	
	
		<h:form id="ticketForm">

			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" 
							actionListener="#{packingticket.onSave}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							accesskey="#{bundle.aon_key_save}" />
						<t:commandButton id="remove" value="#{bundle.aon_remove}"
							forceId="#{true}" actionListener="#{packingticket.onRemove}"
							action="packingticket" 
							onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'"
							accesskey="#{bundle.aon_key_remove}" />
						<t:commandButton id="reset" value="#{bundle.aon_reset}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
							actionListener="#{packingticket.onNew}"
							accesskey="#{bundle.aon_key_new}" />
						<t:commandButton  
							action="packingticket_compositionlist"
							value="#{appBundle.ticket_add_composition}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
							actionListener="#{packingticket.onListComposition}"
							accesskey="#{bundle.aon_key_new}" />
						<t:commandButton id="packingticket" 
							value="#{appBundle.ticket_button_1}"
							forceId="#{true}"
							rendered="#{packingticket.model.rowCount > 0}"
							accesskey="P"
							onclick="reportWindow(this, 'packingticketAuxForm', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'" />
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="Ticket_item" 
							styleClass="aon-form-input-text-label" 
							value="#{appBundle.ticket_item}" />
						<t:inputText id="Ticket_item" size="30" 
							styleClass="aon-form-input-text"
							value="#{packingticket.to.item}" />

						<t:outputLabel for="Ticket_sanataryId" 
							styleClass="aon-form-input-text-label" 
							value="#{appBundle.ticket_sanataryId}" />
						<t:inputText id="Ticket_sanataryId" size="50" 
							styleClass="aon-form-input-text"
							value="#{packingticket.to.sanataryId}" />

						<t:outputLabel for="Ticket_ingredients" 
							styleClass="aon-form-input-text-label" 
							value="#{appBundle.ticket_ingredients}" />
						<t:inputTextarea id="Ticket_ingredients" cols="49"
							styleClass="aon-form-input-text"
							value="#{packingticket.to.ingredients}" />

						<t:outputLabel for="Ticket_netQuantity" 
							styleClass="aon-form-input-text-label" 
							value="#{appBundle.ticket_netQuantity}" />
						<t:inputText id="Ticket_netQuantity"  size="50" 
							styleClass="aon-form-input-text"
							value="#{packingticket.to.netQuantity}" />

						<t:outputLabel for="Ticket_expiry" 
							styleClass="aon-form-input-text-label" 
							value="#{appBundle.ticket_expiry}" />
						<t:div>
							<t:inputText styleClass="aon-form-input-text"
								id="Ticket_expiry" forceId="#{true}"
								value="#{packingticket.to.expiry}" size="10" maxlength="12">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</t:inputText>
							<t:commandButton styleClass="aon-form-lookup-button"
								id="Ticket_expiry_button" forceId="#{true}" value=""
								immediate="true"/>
							<script type="text/javascript">
						  Calendar.setup( {
							inputField  : "Ticket_expiry", button : "Ticket_expiry_button",
							ifFormat    : "%d/%m/%Y" } );
							</script>								
						</t:div>

						<t:outputLabel for="Ticket_conditions" 
							styleClass="aon-form-input-text-label" 
							value="#{appBundle.ticket_conditions}" />
						<t:inputText id="Ticket_conditions"  size="70" 
							styleClass="aon-form-input-text"
							value="#{packingticket.to.conditions}" />

						<t:outputLabel for="Ticket_quantity" 
							styleClass="aon-form-input-text-label" 
							value="#{appBundle.ticket_quantity}" />
						<t:inputText id="Ticket_quantity" size="5" 
							styleClass="aon-form-input-text"
							value="#{packingticket.to.quantity}" />
					</h:panelGrid>
					
					<t:dataTable id="packingticketlist" 
						value="#{packingticket.model}" rows="20"
						var="to" 
						rowOnMouseOver="selectRow( this )"
						rowOnMouseOut="unselectRow( this )" 
						rowOnClick="sendRow( this )"
						styleClass="aon-table" 
						headerClass="aon-table-header"
						rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
						columnClasses="aon-table-body ,aon-table-body aon-table-body-string,aon-table-body aon-table-body-string,aon-table-body aon-table-body-string">
		
						<h:column>
							<f:facet name="header">
								<f:verbatim>&#160;</f:verbatim>
							</f:facet>
							<t:commandLink styleClass="aon-table-row-selected"
								actionListener="#{packingticket.onSelect}" />
						    <h:outputText value="*" rendered="#{to.item==packingticket.to.item}"/>	
						    <f:verbatim>&#160;</f:verbatim>		    
						</h:column>
						
						<h:column>
							<f:facet name="header">
								<h:outputText value="#{appBundle.ticket_item}" />
							</f:facet>
						    <h:outputText value="#{to.item}"/>
						    <f:verbatim>&#160;</f:verbatim>
						</h:column>
						
						<h:column>
							<f:facet name="header">
								<h:outputText value="#{appBundle.ticket_sanataryId}" />
							</f:facet>
						    <h:outputText value="#{to.sanataryId}"/>
						    <f:verbatim>&#160;</f:verbatim>
						</h:column>
						
						<h:column>
							<f:facet name="header">
								<h:outputText value="#{appBundle.ticket_quantity}" />
							</f:facet>
						    <h:outputText value="#{to.quantity}"/>
						    <f:verbatim>&#160;</f:verbatim>
						</h:column>				
					</t:dataTable>
				</t:div>
			</t:div>
		</h:form>
		
	<h:form id="packingticketAuxForm" target="list" />
		
	</ui:define>
</ui:composition>

</body>
</html>
