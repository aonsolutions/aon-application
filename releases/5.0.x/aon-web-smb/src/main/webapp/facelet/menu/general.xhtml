<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<h:panelGrid styleClass="aon-width-all"
		headerClass="aon-direct-access-panel aon-icon-general">
		<f:facet name="header">
			<aon:outputText value="#{appBundle.menu_general}" />
		</f:facet>
		<aon:div styleClass="aon-direct-access-list">
			<ui:insert name="beforeContent"/>
			<aon:div styleClass="aon-direct-access-list-element">
				<aon:commandLink id="productCategory" 
					action="productCategory"
					value="#{productBundle.product_category_module}" />
			</aon:div>
			<aon:div styleClass="aon-direct-access-list-element">
				<aon:commandLink id="segment" 
					action="segment_form" 
					value="#{registryBundle.registry_segment_module}" />
			</aon:div>
			<aon:div styleClass="aon-direct-access-list-element">
				<aon:commandLink id="geotreeParent" 
					action="geotreeParent_list"	actionListener="#{geotreeParent.onSearch}"
					value="#{geozoneBundle.geozone_module}" />
			</aon:div>
		</aon:div>
	</h:panelGrid>

</ui:composition>
