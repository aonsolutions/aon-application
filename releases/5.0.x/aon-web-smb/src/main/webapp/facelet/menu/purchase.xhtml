<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="purchaseMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">				
		
					<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
						columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">
	
						<aon:panelGroup>
							<h:panelGrid styleClass="aon-width-all"
								headerClass="aon-icon-purchase aon-direct-access-panel">		
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_purchase}"/>
								</f:facet>					
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="supplier" 
											action="supplier_search" actionListener="#{supplier.onEditSearch}"
											value="#{supplierBundle.supplier_module}" >
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseInvoiceManagement"
											action="purchaseInvoice_search"
											actionListener="#{purchaseInvoice.onEditSearch}"
											value="#{financeBundle.finance_purchase_invoice_management_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="financePayment-purchase"
											action="finance_search"
											actionListener="#{finance.onEditSearchPayment}"
											value="#{financeBundle.finance_payment_module}" />
									</aon:div>									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="payMethod" 
											action="payMethod" 
											value="#{configBundle.config_paymethod_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="bank"
											action="bank"
											value="#{configBundle.config_bank_module}" />
									</aon:div>																											
								</aon:div>
							</h:panelGrid>

							<ui:include src="/facelet/menu/generalProduct.xhtml" >
								<ui:param name="category" value="purchase" />
							</ui:include>
							
						</aon:panelGroup>

						<aon:panelGroup>
							<h:panelGrid styleClass="aon-width-all"
								headerClass="aon-icon-statistics aon-direct-access-panel">		
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_reports}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseAccumulate"
											action="sales_accumulate_search" 
											value="#{statBundle.stat_menu_acumulado2}">
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseCategoryStats"
											action="category_stats_search" 
											value="#{statBundle.stat_menu_category}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
		
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseSummaryStats"
											action="summary_stats_search" 
											value="#{statBundle.stat_menu_summary}"  >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseABCStats"
											action="abc_stats_search" 
											value="#{statBundle.stat_abc_supplier}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseABCStatsProduct"
											action="abc_stats_searchProduct" 
											value="#{statBundle.stat_abc_product}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseABCStatsCategory"
											action="abc_stats_searchCategory" 
											value="#{statBundle.stat_abc_category}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</h:panelGrid>
							
							<ui:include src="/facelet/menu/utility.xhtml" >
								<ui:param name="category" value="purchase" />
							</ui:include>

						</aon:panelGroup>						
					</h:panelGrid>
				</aon:componentGroup>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
