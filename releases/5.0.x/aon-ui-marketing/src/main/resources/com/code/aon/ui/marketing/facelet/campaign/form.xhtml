<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="campaignForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_campaign_module}" />
				<ui:param name="controller" value="#{campaign}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid id="menuGrid" columns="2" dir="true">

					<aon:outputLabel for="Campaign_id"
						rendered="#{!campaign.new}" value="#{bundle.aon_id}" />
					<aon:inputText id="Campaign_id" value="#{campaign.to.id}"
						rendered="#{!campaign.new}" size="15" disabled="true" />

					<aon:outputLabel for="Campaign_text"
						value="#{bundle.aon_description}" />
					<aon:inputTextarea id="Campaign_text" required="true"
						value="#{campaign.to.description}" cols="60" rows="4" >
						<f:validateLength  maximum="64"/>
					</aon:inputTextarea>
					
					<aon:outputLabel for="Campaign_active"
						value="#{marketingBundle.marketing_active}" />
					<aon:selectBooleanCheckbox id="Campaign_active" 
						value="#{campaign.to.active}" />

				</aon:panelGrid>

				<aon:div styleClass="aon-form-group" rendered="#{!campaign.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="campaignActionData" value="#{marketingBundle.marketing_actions}" />
						</aon:div>
					</aon:div>
					<ui:include src="/com/code/aon/ui/marketing/facelet/campaignAction/list.xhtml" />
				</aon:div>

			</aon:div>
		</aon:form>
		
	</ui:define>
</ui:composition>

</body>
</html>
