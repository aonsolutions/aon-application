<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="marketingMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">			

					<h:panelGrid styleClass="aon-width-all" cellspacing="15"
						columnClasses="aon-vertical-align-top aon-width-300">
	
						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-icon-marketing aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{marketingBundle.marketing_marketing}" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">	
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="campaign"
										action="campaign_list" actionListener="#{campaign.onSearch}"
										value="#{marketingBundle.marketing_campaign_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="survey"
										action="survey_list" actionListener="#{survey.onSearch}" 
										value="#{marketingBundle.marketing_survey_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="surveyResponse"
										action="surveyResponse_list" actionListener="#{surveyResponse.onSearch}"
										value="#{marketingBundle.marketing_survey_response_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="question"
										action="question_list" actionListener="#{question.onSearch}"
										value="#{marketingBundle.marketing_question_module}" />
								</aon:div>
							</aon:div>
						</h:panelGrid>
	
					</h:panelGrid>
				</aon:componentGroup>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
