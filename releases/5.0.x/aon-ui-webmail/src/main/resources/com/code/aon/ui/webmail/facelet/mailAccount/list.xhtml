<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="list">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{webmailBundle.webmail_mailAccount}" />
				<ui:param name="controller" value="#{mailAccount}" />
				<ui:param name="skipSearchButton" value="true" />
			</ui:include>			

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{mailAccount}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{webmailBundle.webmail_mailAccount_name}" />
							</f:facet>
							<aon:outputText value="#{to.name}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{webmailBundle.webmail_mailAccount_email}" />
							</f:facet>
							<aon:outputText value="#{to.email}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{webmailBundle.webmail_signature_signature}" />
							</f:facet>
							<aon:outputText value="#{to.signature.name}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText
									value="#{webmailBundle.webmail_mailAccount_active}" />
							</f:facet>
							<aon:outputText
								value="#{webmailBundle.webmail_mailAccount_user_account}"
								rendered="#{!mailAccount.currentToDefaultAccount}">
							</aon:outputText>
							<aon:outputText
								value="#{webmailBundle.webmail_mailAccount_default_account}"
								rendered="#{mailAccount.currentToDefaultAccount}" />
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&nbsp;" />
							</f:facet>
							<aon:outputText
								value="#{webmailBundle.webmail_signature_active}"
								rendered="#{mailAccount.currentToActiveAccount}" />
							<aon:commandButton id="mailAccountChange"
								rendered="#{!mailAccount.currentToActiveAccount}"
								onmouseover="disableRowSelector();" onmouseout="enableRowSelector();"
								title="#{webmailBundle.webmail_mailAccountChange}"
								action="mailAccount_list" actionListener="#{mailAccount.onChangeServer}"
								value="#{webmailBundle.webmail_mailAccountChange}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								styleClass="aon-icon-commandButton aon-icon-predetermine">
							</aon:commandButton>
						</aon:column>
					</ui:define>
					
				</ui:decorate>

			</aon:div>
		</aon:form>
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />

	</ui:define>

</ui:composition>

</body>
</html>
