<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/front/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="frontProofList">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid columns="3" dir="true" 
			columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{menuBundle.gbp_proof_of_payment}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.gbp_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						action="front_proof_search" actionListener="#{frontProof.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}"/>
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">					
			<aon:dataTable id="frontProofDataList" 
				value="#{frontProof.model}" var="to" rows="20">
					<aon:rowSelector action="front_proof_form" actionListener="#{frontProof.onSelect}" />
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_proforma_invoice_campaign_code}" />
						</f:facet>
						<aon:outputText value="#{to.campaign.code}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_proforma_invoice_number}" />
						</f:facet>
						<aon:outputText value="#{to.number}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_proforma_invoice_invoice_date}" />
						</f:facet>
						<aon:outputText value="#{to.invoiceDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>						
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_proforma_invoice_payment_date}" />
						</f:facet>
						<aon:outputText value="#{to.paymentDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>						
					</aon:column>

				</aon:dataTable>
						
				<aon:dataScroller dataTable="frontProofDataList"
					model="#{frontProof.model}" showNote="true" />					
				
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
