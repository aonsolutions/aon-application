<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="requirementForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_requirement}" />
					</aon:div>						

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.gbp_listing}- #{appBundle.gbp_editing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">

						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{requirement.onReset}"
							rendered="#{!requirement.new}"
							reRender="requirementDataTable,gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{requirement.to!=null}"
							reRender="requirementDataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{requirement.onAccept}"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{requirement.to!=null}"
							reRender="requirementDataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}" actionListener="#{requirement.onCancel}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{requirement.to!=null and !requirement.new}"
							reRender="requirementDataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{requirement.onRemove}"
							accesskey="#{bundle.aon_key_remove}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<h:dataTable id="requirementDataTable"
					value="#{requirement.model}" var="to" rows="20"
					styleClass="dr-table rich-table aon-editDataTable"
					headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
					footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
					rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
					cellpadding="0" cellspacing="0"
					columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-numberColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-numberColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-numberColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText value="&#160;" rendered="#{to==requirement.to}" />
						<aon:commandButton rendered="#{to!=requirement.to and !to.system}"
							styleClass="aon-editDataTable-button aon-icon-rowSelector"
							actionListener="#{requirement.onSelect}" value="" immediate="true"
							reRender="requirementDataTable,gridToolbar">
						</aon:commandButton>
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset"
									value="" immediate="true"
									reRender="requirementDataTable,gridToolbar"
									rendered="#{!requirement.new}"
									actionListener="#{requirement.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_requirement_application_date}" />
						</f:facet>
						<aon:outputText value="#{to.applicationDate}" rendered="#{to!=requirement.to}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:selectInputDate value="#{requirement.to.applicationDate}"
							inputSize="15" datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
							rendered="#{to==requirement.to}"/>
						<f:facet name="footer">
							<aon:div>
								<aon:selectInputDate value="#{requirement.to.applicationDate}"
									inputSize="15" datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
									rendered="#{requirement.new}"/>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_requirement_document_type}" />
						</f:facet>
						<aon:outputText value="#{to.documentType}" rendered="#{to!=requirement.to}" />
						<aon:selectOneMenu value="#{requirement.to.documentType}"
							rendered="#{to==requirement.to}">
							<f:selectItems value="#{GBPCollections.documentTypes}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:div>
								<aon:selectOneMenu value="#{requirement.to.documentType}"
									rendered="#{requirement.new}">
									<f:selectItems value="#{GBPCollections.documentTypes}" />
								</aon:selectOneMenu>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_requirement_amount}" />
						</f:facet>
						<aon:outputText value="#{to.amount}" rendered="#{to!=requirement.to}">
							<f:convertNumber pattern="#,##0.00" />			
						</aon:outputText>
						<aon:inputText value="#{requirement.to.amount}"
							rendered="#{to==requirement.to}" size="8" maxlength="8" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{requirement.to.amount}"
									rendered="#{requirement.new}" size="8" maxlength="8" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_requirement_manager_number}" />
						</f:facet>
						<aon:outputText value="#{to.managerNumber}" rendered="#{to!=requirement.to}"/>
						<aon:inputText value="#{requirement.to.managerNumber}"
							rendered="#{to==requirement.to}" size="8" maxlength="8" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{requirement.to.managerNumber}"
									rendered="#{requirement.new}" size="8" maxlength="8" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_requirement_supervisor_number}" />
						</f:facet>
						<aon:outputText value="#{to.supervisorNumber}" rendered="#{to!=requirement.to}"/>
						<aon:inputText value="#{requirement.to.supervisorNumber}"
							rendered="#{to==requirement.to}" size="8" maxlength="8" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{requirement.to.supervisorNumber}"
									rendered="#{requirement.new}" size="8" maxlength="8" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=requirement.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==requirement.to}">
							<aon:commandButton id="lineAccept"
								title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="requirementDataTable,gridToolbar"
								actionListener="#{requirement.onAccept}" />
							<aon:commandButton id="lineCancel"
								title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="requirementDataTable,gridToolbar" immediate="true"
								actionListener="#{requirement.onCancel}" />
							<aon:commandButton id="lineRemove"
								title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="requirementDataTable,gridToolbar" immediate="true"
								actionListener="#{requirement.onRemove}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{requirement.new}">
								<f:verbatim rendered="#{!requirement.new}">&#160;</f:verbatim>
								<aon:commandButton id="newAccept"
									title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="requirementDataTable,gridToolbar"
									actionListener="#{requirement.onAccept}" />
								<aon:commandButton id="newCancel"
									title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="requirementDataTable,gridToolbar" immediate="true"
									actionListener="#{requirement.onCancel}" />
							</aon:div>
						</f:facet>
					</aon:column>
				</h:dataTable>

				<aon:dataScroller dataTable="requirementDataTable"
					model="#{requirement.model}" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
</body>
</html>
