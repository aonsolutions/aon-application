<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="proFormaForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_pro_forma}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{bundle.aon_editing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{proForma.to!=null or proForma.new}"
							reRender="gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{proForma.accept}"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{proForma.to!=null or proForma.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}" action="pro_forma_list"
							actionListener="#{proForma.onCancel}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="pro_forma_search"
							actionListener="#{proForma.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<t:commandButton id="proforma" value="#{menuBundle.gbp_proof_of_payment}"
							immediate="true" action="front_proof_search" forceId="true"
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.jsf');return false;"
							styleClass="aon-finding-toolbar-item aon-icon-printer"
							accesskey="#{bundle.aon_key_print}" />
						<t:commandButton id="proForma_to" value="#{appBundle.gbp_print}"
							immediate="true" forceId="true" 
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.jsf');return false;"
							styleClass="aon-finding-toolbar-item aon-icon-printer"
							accesskey="#{bundle.aon_key_print}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="proFormaGrid" columns="2" dir="true">

					<aon:outputLabel for="ProFormaInvoice_campaign_code"
						value="#{appBundle.gbp_proforma_invoice_campaign_code}" />
					<aon:div>
						<aon:inputText id="ProFormaInvoice_campaign_code" size="16"
							disabled="true" styleClass="aon-inputText-disabled"
							maxlength="16" value="#{proForma.to.campaign.code}" />
						<aon:inputText id="ProFormaInvoice_campaign_name" size="60"
							disabled="true" styleClass="aon-inputText-disabled"
							value="#{proForma.to.campaign.name}" />
					</aon:div>

					<aon:outputLabel for="ProFormaInvoice_supplier"
						value="#{appBundle.gbp_proforma_invoice_supplier}" />
					<aon:inputText id="ProFormaInvoice_supplier" size="64"
						disabled="true" styleClass="aon-inputText-disabled"
						maxlength="64" value="#{proForma.to.supplier.name}" />

					<aon:outputLabel for="ProFormaInvoice_number"
						value="#{appBundle.gbp_proforma_invoice_number}" />
					<aon:inputText id="ProFormaInvoice_number" 
						size="16" maxlength="16"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{proForma.to.number}" />

					<aon:outputLabel for="ProFormaInvoice_concept"
						value="#{appBundle.gbp_proforma_invoice_concept}" />
					<aon:inputText id="ProFormaInvoice_concept" 
						size="128" maxlength="128" 
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{proForma.to.concept}" />
						
					<aon:outputLabel for="ProFormaInvoice_invoiceDate"
						value="#{appBundle.gbp_proforma_invoice_invoice_date}" />
					<aon:inputText id="ProFormaInvoice_invoiceDate" 
						size="16" maxlength="16"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{proForma.to.invoiceDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:inputText>	

					<aon:outputLabel for="ProFormaInvoice_amount"
						value="#{appBundle.gbp_proforma_invoice_amount}" />
					<aon:inputText id="ProFormaInvoice_amount" 
						size="16" maxlength="16"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{proForma.to.amount}">
						<f:convertNumber pattern="#,##0.000" />
					</aon:inputText>

					<aon:outputLabel for="ProFormaInvoice_offer_quality"
						value="#{appBundle.gbp_proforma_invoice_quality}" />
					<aon:inputTextarea id="ProFormaInvoice_offer_quality"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{proForma.to.offer.quality}"
						cols="80" rows="5" />

					<aon:outputLabel for="ProFormaInvoice_offer_defectiveGoods"
						value="#{appBundle.gbp_proforma_invoice_defective_goods}" />
					<aon:inputTextarea id="ProFormaInvoice_offer_defectiveGoods"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{proForma.to.offer.defectiveGoods}"
						cols="80" rows="5" />

					<aon:outputLabel for="ProFormaInvoice_offer_additionalConditions"
						value="#{appBundle.gbp_proforma_invoice_additional_conditions}" />
					<aon:inputTextarea id="ProFormaInvoice_offer_additionalConditions"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{proForma.to.offer.additionalConditions}"
						cols="80" rows="5" />

					<aon:outputLabel for="ProFormaInvoice_office_id"
						value="#{appBundle.gbp_proforma_invoice_office}" />
					<aon:selectOneMenu id="ProFormaInvoice_office_id"
						value="#{proForma.to.office.id}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{GBPCollections.offices}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ProFormaInvoice_costType"
						value="#{appBundle.gbp_proforma_invoice_cost_type}" />
					<aon:selectOneMenu id="ProFormaInvoice_costType"
						value="#{proForma.to.costType}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{GBPCollections.costTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ProFormaInvoice_accountContact_id"
						value="#{appBundle.gbp_proforma_invoice_account_contact}" />
					<aon:selectOneMenu id="ProFormaInvoice_accountContact_id"
						value="#{proForma.to.accountContact.id}">
						<f:selectItems value="#{GBPCollections.accountContacts}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ProFormaInvoice_paymentTerm"
						value="#{appBundle.gbp_proforma_invoice_payment_term}" />
					<aon:inputText id="ProFormaInvoice_paymentTerm" 
						size="3" maxlength="3"
						value="#{proForma.to.paymentTerm}" >
						<f:validateLongRange />
					</aon:inputText>	

					<aon:outputLabel for="ProFormaInvoice_status"
						value="#{appBundle.gbp_proforma_invoice_status}" />
					<aon:selectOneMenu id="ProFormaInvoice_status"
						value="#{proForma.to.status}" disabled="true">
						<f:selectItems value="#{GBPCollections.proformaInvoiceStatus}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ProFormaInvoice_paymentDate"
						value="#{appBundle.gbp_proforma_invoice_payment_date}" />
					<aon:inputText id="ProFormaInvoice_paymentDate" 
						size="16" maxlength="16"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{proForma.to.paymentDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:inputText>	

				</aon:panelGrid>

				<aon:div id="proFormaTab">
					<aon:panelTabSet>

						<aon:panelTab id="incidences" label="#{appBundle.gbp_incidences}">
							<ui:include src="/facelet/incidence/grid.xhtml">
								<ui:param name="controllerAlias" value="#{proFormaIncidence}" />
								<ui:param name="dataTable" value="proFormaIncidenceDataTable" />
								<ui:param name="parentGrid" value="proFormaGrid" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="signatures" label="#{appBundle.gbp_pro_forma_signature_signatures}">
							<ui:include src="/facelet/pro_forma/signature/list.xhtml"/>
						</aon:panelTab>

						<aon:panelTab id="bank" label="#{appBundle.gbp_pro_forma_banks}">
							<ui:include src="/facelet/pro_forma/bank/grid.xhtml"/>
						</aon:panelTab>

					</aon:panelTabSet>
				</aon:div>

			</aon:div>
		</aon:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
