<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-ice-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="genericPageList">
			
			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar" 
				cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.generic_page}" />					
				</aon:div>		
			
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal" >
						<aon:commandButton id="reset" value="#{bundle.aon_reset}" 
							action="generic_page_form" actionListener="#{generic_page.onReset}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:confirmButton id="remove" 
							value="#{bundle.aon_remove}" rendered="#{!generic_page.checklistEmpty}" inmediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{generic_page.onRemoveSelected}" confirmAction="generic_page_list"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search" value="#{bundle.aon_search}" 
							action="generic_page_search" actionListener="#{generic_page.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-icon-search"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-search'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-search aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}"/>
				</aon:div>
			<!-- end toolbar navigation -->
			</aon:panelGrid> 
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">	
				
					<aon:div styleClass="aon-content-subTitle">
						<aon:div styleClass="aon-content-subTitle-internal">
							<aon:outputText value="Listado registros" />
						</aon:div>
					</aon:div>
					
					<aon:dataTable id="genericPageDataList" styleClass="aon-dataTable"
					 	columnWidths="120,200,*,50,150" 
						value="#{generic_page.model}" var="to" rows="20"
						rowClasses="aon-dataTable-odd, aon-dataTable-even"
						columnClasses="aon-table-body aon-table-body-icon,
							aon-table-body aon-table-body-string,
							aon-table-body aon-table-body-string,
							aon-table-body aon-table-body-icon,
							aon-table-body aon-table-body-icon">

							<aon:column>
								<aon:rowSelector selectionListener="#{generic_page.onSelect}" toggleOnClick="true"/>
								<f:facet name="header">
									<aon:div>
										<aon:outputText value="#{bundle.aon_check}" />
										<aon:div>
											<aon:commandLink id="all" value="#{bundle.aon_check_all}" 
											styleClass="aon-table-header-link-secundary"
											onclick="selectAll();return false;" />
											<aon:commandLink id="none" value="#{bundle.aon_uncheck_all}"
											styleClass="aon-table-header-link-secundary"
											onclick="unSelectAll();return false;" />
											<aon:commandLink id="inverse" value="#{bundle.aon_inverse_all}"
											styleClass="aon-table-header-link-secundary"
											onclick="inverseAll();return false;" />
										</aon:div>										
									</aon:div>	
								</f:facet>
								<aon:selectBooleanCheckbox id="Row_checked" forceId="#{true}"
										value="#{generic_page.rowChecked}" partialSubmit="false" 
										valueChangeListener="#{generic_page.onChecked}"/>
							</aon:column>
					
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.generic_page_alias}" />
								</f:facet>
								<aon:outputText value="#{to.alias}"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.generic_page_title}" />
								</f:facet>
								<aon:outputText value="#{generic_page.i18nTitle}"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.generic_page_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.generic_page_activate}" action="generic_page_list"
									actionListener="#{generic_page.onActivate}" 
									rendered="#{!to.active}">
									<aon:graphicImage id="GenericPage_active" alt="#{appBundle.generic_page_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.generic_page_deactivate}" action="generic_page_list"
									actionListener="#{generic_page.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="GenericPage_deactive" alt="#{appBundle.generic_page_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.generic_page_create_date}" />
								</f:facet>
								<aon:outputText value="#{to.create_date}">
									<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"/>
								</aon:outputText>
							</aon:column>

						</aon:dataTable>
						
						<ui:include src="/facelet/shared/dataScroller.xhtml">
							<ui:param name="dataTable" value="genericPageDataList" />
							<ui:param name="model" value="#{generic_page.model}" />
							<ui:param name="showNote" value="#{false}" />
						</ui:include>
					
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
