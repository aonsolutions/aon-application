<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="documentForm" partialSubmit="true">

			<aon:div styleClass="aon-content-toolbar" forceId="#{true}" id="aon-content-toolbar">
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="home" styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_close}"/>
					</aon:div>
				</aon:div>
			</aon:div>

			<aon:div id="aon-scroll-area" forceId="#{true}">
				<aon:div styleClass="aon-scroll-area-internal">
					<aon:panelGrid columns="2" style="width:100%;">
					    <ice:tree id="tree" style="height:500px"
					              value="#{document.tree}"
					              var="item"
					              hideRootNode="false"
					              hideNavigation="false">
					        <ice:treeNode>
					            <f:facet name="icon">
					                <aon:panelGroup style="display: inline">
					                     <aon:graphicImage value="#{item.userObject.icon}"/>
					                </aon:panelGroup>
					            </f:facet>
					            <f:facet name="content">
					                <aon:panelGroup style="display: inline">
					                    <ice:commandLink rendered="#{!item.userObject.selected}"
					                            actionListener="#{item.userObject.onSelectFolder}"
					                            value="#{item.userObject.text}"/>
					                    <ice:outputText value="#{item.userObject.text}" 
					                    		rendered="#{item.userObject.selected}"
					                    		style="color:white;background:darkblue"/>
					                </aon:panelGroup>
					            </f:facet>
					        </ice:treeNode>
					    </ice:tree>
					    <aon:panelGroup>
							<aon:panelGrid columns="2" dir="true" styleClass="aon-form-table" style="width:100%"
								columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
								<aon:outputLabel for="image_file"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.image_file}" />
			                    <aon:panelGroup id="image_file">
			                        <ice:inputFile uploadDirectory="#{document.currentPath}"
			                        		uniqueFolder="false"
			                        		uploadDirectoryAbsolute="true"
			                                actionListener="#{document.action}"/>
			                    </aon:panelGroup>
				                <aon:messages/>
							</aon:panelGrid>
							<ice:panelSeries id="panelSeries" value="#{document.model}" var="item" style="width:100%;height:450px;overflow:auto;background:#FFF;padding:1px;">
								<aon:div id="imagePanel" styleClass="item_explorer">
									<aon:div styleClass="text_item_explorer">
							            <aon:outputText id="name" value="#{item.name}"/>
									</aon:div>
								</aon:div>
							</ice:panelSeries>
						</aon:panelGroup>
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>
</ui:composition>

</body>
</html>
