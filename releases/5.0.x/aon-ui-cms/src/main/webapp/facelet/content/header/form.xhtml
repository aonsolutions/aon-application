<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="headerForm" partialSubmit="false">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
			cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.header}" />					
				</aon:div>		
			
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" rendered="#{headers.to!=null or header.new}"
							actionListener="#{headers.onAccept}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:commandButton id="cancel"
							value="#{bundle.aon_cancel}" rendered="#{headers.to!=null or header.new}" immediate="#{true}"
							actionListener="#{headers.onCancel}" action="header_list"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!header.new and !header.to.default_}" immediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{headers.onRemoveI18n}" confirmAction="header_form"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{headers.onReset}" rendered="#{!header.new}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<aon:div styleClass="aon-content-subtitle-internal">
					<aon:outputText
						value="#{headers.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</aon:div>
			</aon:div>
			<aon:div id="aon-scroll-area" forceId="#{true}">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:panelGrid columns="2">
						<aon:panelGrid columns="2" dir="true" styleClass="aon-form-table"
							columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

							<aon:outputLabel for="header_alias" style="width:100px"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.header_alias}" />
							<aon:inputText id="header_alias"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="32" maxlength="32"
								value="#{headers.to.alias}" />

							<aon:outputLabel for="header_menu"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.header_menu}"/>
							<aon:selectOneMenu id="header_menu"  
								styleClass="aon-form-selectOneMenu-field"
								value="#{headers.to.menu.id}">
								<f:selectItems value="#{collections.menuTopList}" />
							</aon:selectOneMenu> 

							
							<aon:outputLabel for="header_language_menu"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.header_hasmenu}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="header_language_menu" 
									value="#{headers.to.language_menu}" />
								<aon:outputLabel for="header_menutype"
									styleClass="aon-form-input-text-label"
									value="#{appBundle.header_menutype}" />
								<aon:selectOneMenu id="header_menutype" 
									styleClass="aon-form-selectOneMenu-field"
									value="#{headers.to.language_menu_type}">
									<f:selectItems value="#{collections.languageTypes}" />
								</aon:selectOneMenu> 
							</aon:div>
									
							<aon:outputLabel for="headerDetail_sitename"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.header_sitename}" />
							<aon:inputText id="headerDetail_sitename"
								styleClass="aon-form-input-text aon-form-input-text-number"
								size="90" maxlength="255"
								value="#{headers.toI18n.sitename}" />
							
							<aon:outputLabel for="headerDetail_content"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.header_content}" />
							<aon:inputRichText id="headerDetail_content" 
								toolbarSet="Default" 
								value="#{headers.toI18n.content}" />
								
							<aon:outputLabel for="headerDetail_image"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.header_image}" />
							<aon:div>
								<ice:graphicImage url="#{headers.toI18n.image}.thumbnail" 
									alt="#{headers.toI18n.image}"/>
								<aon:commandButton
									title="OPEN"
									value="OPEN"
									rendered="#{!headers.imageSelectionVisible}"
									immediate="true"
									actionListener="#{headers.onShowImages}"
									styleClass="aon-icon-attach aon-content-toolbar-item">
								</aon:commandButton>
								<aon:commandButton
									title="CLOSE"
									value="CLOSE"
									rendered="#{headers.imageSelectionVisible}"
									immediate="true"
									actionListener="#{headers.onCloseImages}"
									styleClass="aon-icon-attach aon-content-toolbar-item">
								</aon:commandButton>
								<aon:commandButton
									title="DEL"
									value="DEL"
									immediate="true"
									actionListener="#{headers.onDelImage}"
									styleClass="aon-icon-attach aon-content-toolbar-item">
								</aon:commandButton>
								<aon:div visible="#{headers.imageSelectionVisible}"
									forceId="#{true}">
									<aon:div styleClass="aon-scroll-area-internal">
										<aon:panelGrid columns="2" style="width:100%;">
										    <ice:tree id="tree" style="height:250px"
										              value="#{gallery.tree}"
										              var="item"
										              hideRootNode="false"
										              hideNavigation="false">
										        <ice:treeNode>
										            <f:facet name="icon">
										                <aon:panelGroup style="display: inline">
										                     <aon:graphicImage value="#{item.userObject.icon}"/>
										                </aon:panelGroup>
										            </f:facet>
										            <f:facet name="content">
										                <aon:panelGroup style="display: inline">
										                    <ice:commandLink rendered="#{!item.userObject.selected}"
										                            actionListener="#{item.userObject.onSelectFolder}"
										                            value="#{item.userObject.text}"/>
										                    <ice:outputText value="#{item.userObject.text}" 
										                    		rendered="#{item.userObject.selected}"
										                    		style="color:white;background:darkblue"/>
										                </aon:panelGroup>
										            </f:facet>
										        </ice:treeNode>
										    </ice:tree>
										    <aon:panelGroup>
												<ice:panelSeries id="panelSeries" value="#{gallery.model}" var="item">
													<aon:panelGrid columns="2" cellpadding="5px" cellspacing="0px">
									                    <ice:commandLink
									                    	immediate="#{true}"
								                            actionListener="#{headers.onSelectImage}">
												            <ice:graphicImage url="#{item.thumb}" alt="#{item.name}"/>
												        </ice:commandLink>
									                    <ice:commandLink
									                    	immediate="#{true}"
								                            actionListener="#{headers.onSelectImage}"
								                            value="#{item.name}"/>
													</aon:panelGrid>
												</ice:panelSeries>
											</aon:panelGroup>
										</aon:panelGrid>
									</aon:div>
								</aon:div>								
							</aon:div>								
							
							<aon:outputLabel for="alt"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.header_alt}" />
							<aon:inputText id="alt"
								styleClass="aon-form-input-text aon-form-input-text-number"
								size="64" maxlength="64"
								value="#{headers.toI18n.alt}" />
		
							<aon:outputLabel for="header_css" style="width:100px"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.header_css}" />
							<aon:inputTextarea id="headerDetail_css"
								cols="60" rows="20" 
								value="#{headers.to.css}"/>

							<aon:outputLabel for="header_javascript" style="width:100px"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.header_javascript}" />
							<aon:inputTextarea id="headerDetail_javascript"
								cols="60" rows="20" 
								value="#{headers.to.javascript}"/>

						</aon:panelGrid>
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>
</ui:composition>

</body>
</html>
