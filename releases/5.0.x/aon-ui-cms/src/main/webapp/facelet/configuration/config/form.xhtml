<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="configForm" partialSubmit="false">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar" 
				cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.config}" />					
				</aon:div>		
			
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:confirmButton id="save"
						value="#{bundle.aon_save}" 
						confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_save_confirm}"
						confirmActionListener="#{config.onAccept}"
						styleClass="aon-content-toolbar-item aon-icon-accept"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
						accesskey="#{bundle.aon_key_save}"/>
					<aon:commandButton id="exit" value="#{bundle.aon_close}"
						action="home" styleClass="aon-content-toolbar-item aon-icon-cancel"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
						accesskey="#{bundle.aon_key_close}"/>
				</aon:div>
			</aon:panelGrid>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">	

					<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
						forceId="#{true}">
						<aon:div styleClass="aon-content-subtitle-internal">
							<aon:outputText
								value="#{config.new?(bundle.aon_reset):(bundle.aon_editing)}" />
						</aon:div>
					</aon:div>
					<aon:div id="aon-scroll-area" forceId="#{true}">
						<aon:div styleClass="aon-scroll-area-internal">
							<ice:panelTabSet id="menuTabSet">
							
								<ice:panelTab id="content" label="#{appBundle.aon_content}">
									<aon:panelGrid columns="2">
										<aon:panelGrid columns="2" dir="true" styleClass="aon-form-table" style="width:100%"
											columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

											<aon:outputLabel for="Config_sitename"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.config_sitename}" />
											<aon:inputText id="Config_sitename"
												styleClass="aon-form-input-text"
												required="true" size="75" maxlength="75"
												value="#{config.toI18n.sitename}" />

											<aon:outputLabel for="ConfigDetail_offline_message"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.config_offline_message}" />
											<aon:inputRichText id="ConfigDetail_offline_message"
												toolbarSet="Default" 
												value="#{config.toI18n.offline_message}"/>
				
											<aon:outputLabel for="Config_css"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.config_css}" />
											<aon:inputTextarea id="Config_css"
												cols="60" rows="20" 
												value="#{config.toI18n.css}"/>

											<aon:outputLabel for="Config_javascript"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.config_javascript}" />
											<aon:inputTextarea id="Config_javascript"
												cols="60" rows="20" 
												value="#{config.toI18n.javascript}"/>

											<aon:outputLabel for="ConfigDetail_keywords"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.config_keywords}" />
											<aon:inputTextarea id="ConfigDetail_keywords"
												cols="60" rows="20" 
												value="#{config.toI18n.keywords}"/>

											<aon:outputLabel for="ConfigDetail_description"
												styleClass="aon-form-input-text-label"
												value="#{appBundle.config_description}" />
											<aon:inputTextarea id="ConfigDetail_description"
												cols="60" rows="20" 
												value="#{config.toI18n.description}"/>
				
										</aon:panelGrid>
									</aon:panelGrid>
			                    </ice:panelTab>
							</ice:panelTabSet>
		
						</aon:div>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>
</ui:composition>

</body>
</html>
