<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form id="userChanged">

		<aon:panelGroup id="userChangedWindow"
			styleClass="aon-popupWindow">

			<rich:modalPanel id="userChangedModalPanel"
				rendered="#{currentUser.showUserChangedWindow}"
				showWhenRendered="true" minWidth="600" width="600" height="120">

				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{appBundle.aon_application_title}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:commandButton type="button" styleClass="aon-popupWindow-close"
						immediate="true">
						<f:setPropertyActionListener
							target="#{currentUser.showUserChangedWindow}"
							value="#{false}" />
						<rich:componentControl for="userChangedModalPanel"
							event="onclick" disableDefault="true" operation="hide" />
					</aon:commandButton>
				</f:facet>

				<aon:div styleClass="aon-popupWindow-content">
					<aon:div styleClass="aon-popupWindow-content-internal">

						<aon:div styleClass="aon-message-big aon-icon-big-info">
							<aon:outputText value="#{appBundle.user_user_changed}" />
						</aon:div>

						<aon:div styleClass="aon-text-center">
							<aon:commandButton value="#{bundle.aon_close}"
								actionListener="#{currentUser.cancel}"
								action="#{currentUser.returnAction}"
								styleClass="aon-commandButton">
								<f:setPropertyActionListener
									target="#{currentUser.showUserChangedWindow}"
									value="#{false}" />
								<rich:componentControl for="userChangedModalPanel"
									event="onclick" disableDefault="true" operation="hide" />
							</aon:commandButton>
						</aon:div>
					</aon:div>
				</aon:div>

			</rich:modalPanel>
		</aon:panelGroup>

	</aon:form>

</ui:composition>
