<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="scopeList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{appBundle.aon_users}" />
					<ui:param name="toolbarDescription" value="#{appBundle.aon_scopes}" />					
					<ui:param name="controller" value="#{scope}" />
					
					<ui:define name="additionalToolbarContent">
						<aon:commandButton
							value="#{bundle.aon_back}" rendered="#{scope.to==null}"
							action="user" actionListener="#{user.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"/>					 
					</ui:define>				
				</ui:decorate>		

				<!--  aon-region-body -->
	 			<aon:div styleClass="aon-scroll-area">
	 			
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{scope}" />
						<ui:param name="columnClasses" value="aon-editDataTable-textColumn" />
						<ui:define name="columns">
	
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_scope}" />
								</f:facet>
								<aon:outputText value="#{to.description}" rendered="#{to!=scope.to}" />
								<aon:inputText styleClass="aon-form-input-text " required="true"
									rendered="#{to==scope.to}" size="60"
									value="#{scope.to.description}" maxlength="45" />
								<f:facet name="footer">
									<aon:inputText styleClass="aon-form-input-text" required="true"
										rendered="#{scope.new}" size="60"
										value="#{scope.to.description}" maxlength="45" />
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
