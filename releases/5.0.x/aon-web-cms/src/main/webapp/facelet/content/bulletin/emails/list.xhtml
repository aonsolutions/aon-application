<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="bulletinEmailGrid">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{appBundle.bulletin_emails}" />
					<ui:param name="controller" value="#{bulletin_email}" />
					<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
					<ui:param name="skipRemoveButton" value="#{!cms.roleEditor}" />			
				</ui:include>	

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
				
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{bulletin_email}" />
						<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
						<ui:param name="skipRemoveButton" value="#{!cms.roleEditor}" />									
						<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn aon-width-100" />
						<ui:define name="columns">
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel form="BulletinEmail_email" 
										value="#{appBundle.bulletin_email}" />
								</f:facet>
								<aon:outputText value="#{to.email}"	rendered="#{formList}" />	
								<aon:inputText id="BulletinEmail_email"
									value="#{to.email}" rendered="#{formEdit}"
									required="true" size="85" maxlength="255" />
								<f:facet name="footer">
									<aon:inputText id="BulletinEmail_email-New"
										value="#{bulletin_email.to.email}" rendered="#{formNew}"
										required="true" size="85" maxlength="255" />
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="BulletinEmail_language"
										value="#{appBundle.language_language}" />
								</f:facet>
								<aon:outputText value="#{to.language.description}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="BulletinEmail_language"
									rendered="#{formEdit}" 
									value="#{to.language.id}">
									<f:selectItems value="#{collections.languages}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="BulletinEmail_language-New"
										rendered="#{formNew}"
										value="#{bulletin_email.to.language.id}">
										<f:selectItems value="#{collections.languages}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
