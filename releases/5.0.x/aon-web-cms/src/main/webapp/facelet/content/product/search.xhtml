<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
		<aon:form id="list">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.product}" />
				<ui:param name="controller" value="#{product}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
			</ui:include>		
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{product}" />
				<ui:define name="searchContent">
	
					<aon:outputLabel for="Product_alias"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="Product_alias" size="50"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Product_details_shortLabel"
						value="#{appBundle.product_shorLabel}" />
					<aon:inputText id="Product_details_shortLabel" size="50"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Product_productCategory_id"
						value="#{appBundle.product_category}"/>
					<aon:selectOneMenu id="Product_productCategory_id"  
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.categories}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Product_brand_id"
						value="#{appBundle.product_brand}"/>
					<aon:selectOneMenu id="Product_brand_id"  
						valueChangeListener="#{controller.addIdEqualExpression}"
						value="#{collections.brand}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{collections.brandList}" />
					</aon:selectOneMenu>
						
					<aon:outputLabel for="Product_active"
						value="#{appBundle.cms_active}" />
					<aon:selectOneMenu id="Product_active"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-"	itemValue="#{null}" />
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
					</aon:selectOneMenu>	
						
				</ui:define>
			</ui:decorate>	
			
		</aon:form>
	</ui:define>
</ui:composition>
