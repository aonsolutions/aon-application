<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="productMenu">
		
			<aon:div styleClass="aon-scroll-area">
			
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">
					
					<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
						columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">
	
						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-icon-product aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_product}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="item" 
										action="item_search" actionListener="#{item.onEditSearch}"
										value="#{productBundle.product_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="productCategory" 
										action="productCategory" 
										value="#{productBundle.product_category_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="brand" 
										action="brand"
										value="#{productBundle.product_brand_module}" />
								</aon:div>
							</aon:div>
						</h:panelGrid>
		
						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-icon-sales aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{productBundle.product_price_module}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="tariff" 
										action="tariff_list" actionListener="#{tariff.onSearch}"
										value="#{productBundle.product_tariff_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="catalogue" 
										action="catalogue_search" actionListener="#{catalogue.onEditSearch}"
										value="#{productBundle.product_catalogue_module}" />
								</aon:div>
							</aon:div>
						</h:panelGrid>
	
						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-icon-utilities aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_utilities}"/>
							</f:facet>					
							<aon:set var="#{dbManager.pojos}" value="com.code.aon.product.Product,com.code.aon.product.Item" />
							<aon:set var="#{dbManager.ignoreDependencies}" value="#{true}" />
							<aon:set var="#{dbManager.replicationMode}" value="OVERWRITE" />
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="exportProducts" 
										action="dbManager_export"
										value="#{productBundle.product_export_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="importroducts" 
										action="dbManager_import" actionListener="#{dbManager.onInitImport}"
										value="#{productBundle.product_import_module}" />
								</aon:div>
							</aon:div>
						</h:panelGrid>
					</h:panelGrid>
				</aon:componentGroup>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
