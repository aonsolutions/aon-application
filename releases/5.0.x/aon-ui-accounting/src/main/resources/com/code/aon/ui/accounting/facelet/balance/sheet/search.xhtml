<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_balance_sheet}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />

					<aon:outputLabel for="balanceSheet_balance"
						value="#{accountingBundle.accounting_balance}" />
					<aon:selectOneMenu id="balanceSheet_balance"
						required="true"
						value="#{balanceSheet.balance}">
						<f:selectItem value="#{null}" itemLabel=" " />
						<f:selectItems value="#{balanceSheet.balances}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="balanceSheet_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu required="true" id="balanceSheet_accountPeriod"
						value="#{balanceSheet.parameters.period}">
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
					</aon:selectOneMenu>
 
					<aon:outputLabel for="balanceSheet_entryDate-From"
						value="#{bundle.aon_date_from}" />
					<aon:panelGrid columns="3">
						<aon:selectInputDate id="balanceSheet_entryDate-From"
							value="#{balanceSheet.parameters.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="balanceSheet_entryDate-To"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="balanceSheet_entryDate-To"
							value="#{balanceSheet.parameters.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_exclude_operating"
							value="#{balanceSheet.parameters.excludeOperatingEntry}" />
						<aon:outputLabel for="Account_exclude_operating"
							value="#{accountingBundle.accounting_exclude_operating_entry}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_exclude_closing"
							value="#{balanceSheet.parameters.excludeClosingEntry}" />
						<aon:outputLabel for="Account_exclude_closing"
							value="#{accountingBundle.accounting_exclude_closing_entry}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Show_Accounts"
							value="#{balanceSheet.flagAccounts}" />
						<aon:outputLabel for="Show_Accounts"
							value="#{accountingBundle.accounting_balance_sheet_show_accounts}" />
					</aon:div>

					<aon:outputLabel for="balanceSheet_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu id="balanceSheet_securityLevel"
						value="#{balanceSheet.parameters.securityLevel}">
						<f:selectItem itemValue="" itemLabel=" " />
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>

					<aon:outputText value="&#160;" />

					<aon:commandButton
						value="#{accountingBundle.accounting_balance_sheet_show}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"
						actionListener="#{balanceSheet.onBalance}"
						action="balance_sheet_list" />
				</ui:define>
			</ui:decorate>

		</aon:form>
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
