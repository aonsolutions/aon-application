<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="checkForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_check_balance_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_form}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="execute" 
						value="EJECUTAR"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"
						actionListener="#{accountCheck.onExecute}"
						action="check_list" 
						/>
				</ui:define>
			</ui:decorate>
			
		<aon:div>
			<aon:panelGrid columns="2" style="width:90%; margin:10px auto;">

				<aon:outputLabel for="accountPeriod"
					value="#{accountingBundle.accounting_period}" />
				<aon:selectOneMenu reRender="SearchButton" ajaxSingle="true" required="true"
					id="accountPeriod" value="#{accountCheck.params.period}">
					<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
					<f:selectItems value="#{accountingCollections.allAccountPeriods}" />
				</aon:selectOneMenu>
	
				<aon:outputText value="#{accountingBundle.accounting_check_list}" />
<!-- 
				<aon:dataTable value="#{accountCheck.accountChecks}" var="check" rows="0" style="width:90%; margin:10px auto;">
					<aon:column>
						<aon:selectBooleanCheckbox id="check" value="#{check.enabled}"/>
						<aon:outputLabel for="check" value="#{check.label}" />
					</aon:column>
				</aon:dataTable>
 -->		
 				<rich:dataList value="#{accountCheck.accountChecks}"
 					var="check" rows="0">
					<aon:div>
						<aon:selectBooleanCheckbox id="check" value="#{check.enabled}"/>
						<aon:outputLabel for="check" value="#{check.label}" />
					</aon:div>
 				</rich:dataList>	
			</aon:panelGrid>
			
		</aon:div>

		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>

</ui:composition>
