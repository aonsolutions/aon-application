<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-table-hack">

		<t:dataTable id="employeeMediaDataList" value="#{employeeMedia.model}"
			var="to" rowOnMouseOver="selectRow( this )"
			rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
			styleClass="aon-edit-table" headerClass="aon-edit-table-header"
			footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
			rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
			columnClasses="aon-edit-table-body aon-edit-table-body-icon,
							aon-edit-table-body aon-edit-table-body-string,
							aon-edit-table-body aon-edit-table-body-string,
							aon-edit-table-body aon-edit-table-body-string,
							aon-edit-table-body aon-edit-table-body-buttons">

			<h:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<f:verbatim>&#160;</f:verbatim>
				<t:commandLink immediate="#{true}"
					rendered="#{to!=employeeMedia.to}"
					styleClass="aon-table-row-selected"
					actionListener="#{employeeMedia.onSelect}">
				</t:commandLink>
				<f:facet name="footer">
					<t:div>
						<t:commandButton id="reset"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
							value="" immediate="#{true}"
							rendered="#{!employeeMedia.new}" title="#{bundle.aon_reset}"
							actionListener="#{employeeMedia.onReset}"
							accesskey="#{bundle.aon_key_new_line}">
						</t:commandButton>
					</t:div>
				</f:facet>
			</h:column>

			<h:column>
				<f:facet name="header">
					<h:outputText value="#{rBundle.aon_media}" />
				</f:facet>
				<t:outputText value="#{to.mediaType}"
					rendered="#{to!=employeeMedia.to}" />
				<h:selectOneMenu value="#{employeeMedia.to.mediaType}"
					styleClass="aon-form-selectOneMenu-field"
					rendered="#{to==employeeMedia.to}">
					<f:selectItems value="#{registryCollections.mediaTypes}" />
				</h:selectOneMenu>
				<f:facet name="footer">
					<t:div>
						<h:selectOneMenu value="#{employeeMedia.to.mediaType}"
							styleClass="aon-form-selectOneMenu-field"
							rendered="#{employeeMedia.new}">
							<f:selectItems value="#{registryCollections.mediaTypes}" />
						</h:selectOneMenu>
					</t:div>
				</f:facet>
			</h:column>

			<t:column width="200">
				<f:facet name="header">
					<t:outputText value="#{rBundle.aon_value}" />
				</f:facet>
				<t:outputText value="#{to.value}" rendered="#{to!=employeeMedia.to}" />
				<t:inputText value="#{to.value}" styleClass="aon-form-input-text"
					rendered="#{to==employeeMedia.to}" required="#{true}" size="40"
					onblur="toLowerCase(this);" />
				<f:facet name="footer">
					<t:div>
						<t:inputText value="#{employeeMedia.to.value}"
							styleClass="aon-form-input-text" rendered="#{employeeMedia.new}"
							required="#{true}" size="40" onblur="toLowerCase(this);" />
					</t:div>
				</f:facet>
			</t:column>

			<t:column width="330">
				<f:facet name="header">
					<t:outputText value="#{rBundle.aon_comment}" />
				</f:facet>
				<t:outputText value="#{to.comment}"
					rendered="#{to!=employeeMedia.to}" />
				<t:inputText value="#{to.comment}" styleClass="aon-form-input-text"
					rendered="#{to==employeeMedia.to}" size="40" />
				<f:facet name="footer">
					<t:div>
						<t:inputText value="#{employeeMedia.to.comment}"
							styleClass="aon-form-input-text" rendered="#{employeeMedia.new}"
							size="40" />
					</t:div>
				</f:facet>
			</t:column>

			<h:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<t:div>
					<f:verbatim rendered="#{to!=employeeMedia.to}">&#160;</f:verbatim>

					<t:commandButton title="#{bundle.aon_save}"
						actionListener="#{employeeMedia.onAccept}"
						rendered="#{to==employeeMedia.to}" value=""
						styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
						accesskey="#{bundle.aon_key_save_line}" />
					<t:commandButton title="#{bundle.aon_cancel}"
						actionListener="#{employeeMedia.onCancel}" immediate="#{true}"
						onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
						styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
						value="" rendered="#{to==employeeMedia.to}"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<t:commandButton title="#{bundle.aon_remove}"
						actionListener="#{employeeMedia.onRemove}"
						onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
						rendered="#{to==employeeMedia.to}"
						styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
						value="" accesskey="#{bundle.aon_key_remove_line}" />
				</t:div>
				<f:facet name="footer">
					<t:div>
						<f:verbatim rendered="#{!employeeMedia.new}">&#160;</f:verbatim>
						<t:commandButton title="#{bundle.aon_save}"
							actionListener="#{employeeMedia.onAccept}"
							rendered="#{employeeMedia.new}" value=""
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
							accesskey="#{bundle.aon_key_save_line}" />
						<t:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{employeeMedia.onCancel}" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
							rendered="#{employeeMedia.new}"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
							value="" accesskey="#{bundle.aon_key_cancel_line}" />
					</t:div>
				</f:facet>
			</h:column>
		</t:dataTable>
	</t:div>

	<t:div styleClass="aon-datascroller"
		rendered="#{employeeMedia.model.rowCount>0}">
		<h:panelGrid columns="2"
			columnClasses="aon-datascroller-text,aon-datascroller-buttons">
			<t:dataScroller id="scroll_2" for="employeeMediaDataList"
				rowsCountVar="rowsCount" firstRowIndexVar="firstRowIndex"
				lastRowIndexVar="lastRowIndex"
				rendered="#{employeeMedia.model.rowCount>0}">
				<h:outputFormat value="#{appBundle.aon_scroll}">
					<f:param value="#{firstRowIndex}" />
					<f:param value="#{lastRowIndex}" />
					<f:param value="#{rowsCount}" />
				</h:outputFormat>
			</t:dataScroller>

			<t:dataScroller id="scroll_3" for="employeeMediaDataList" fastStep="5"
				paginator="#{true}" paginatorMaxPages="5"
				paginatorActiveColumnClass="aon-datascroller-currentpage"
				paginatorColumnClass="aon-datascroller-page"
				rendered="#{employeeMedia.model.rowCount>20}">

				<f:facet name="first">
					<h:graphicImage
						url="/images/datascroller/aon-datascroller-first.gif"
						styleClass="aon-datascroller-button-first" />
				</f:facet>
				<f:facet name="last">
					<h:graphicImage
						url="/images/datascroller/aon-datascroller-last.gif"
						styleClass="aon-datascroller-button-last" />
				</f:facet>
				<f:facet name="previous">
					<h:graphicImage
						url="/images/datascroller/aon-datascroller-previous.gif"
						styleClass="aon-datascroller-button-previous" />
				</f:facet>
				<f:facet name="next">
					<h:graphicImage
						url="/images/datascroller/aon-datascroller-next.gif"
						styleClass="aon-datascroller-button-next" />
				</f:facet>
				<f:facet name="fastforward">
					<h:graphicImage
						url="/images/datascroller/aon-datascroller-fastforward.gif"
						styleClass="aon-datascroller-button-fastforward" />
				</f:facet>
				<f:facet name="fastrewind">
					<h:graphicImage
						url="/images/datascroller/aon-datascroller-fastrewind.gif"
						styleClass="aon-datascroller-button-fastrewind" />
				</f:facet>
			</t:dataScroller>
		</h:panelGrid>
	</t:div>

</ui:composition>

</body>
</html>
