<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="content">

		<h:form id="employeeForm">

			<t:div styleClass="aon-content-menu-aux" >
				<h:outputText value="#{employee.to.registry.name} #{employee.to.registry.surname} #{employee.to.registry.document}" />
			</t:div>
			<t:div styleClass="aon-content-menu" rendered="#{!employee.new}" id="aon-content-menu" forceId="#{true}">
				<t:panelGrid columns="5" cellpadding="0" cellspacing="0" border="0">
					<t:panelGroup>						
							<t:commandLink id="employee_data" value="#{rBundle.aon_personal_data}" 
								forceId="#{true}" action="employee_form"
								styleClass="aon-content-menu-item"	/>					
					</t:panelGroup>	
					<t:panelGroup>						
							<t:commandLink id="employee_calendar" forceId="#{true}" value="#{rBundle.aon_calendar_data}"
								actionListener="#{employee.onSchedule}" action="#{planner.calendarOutcome}" 
								styleClass="aon-content-menu-item-active" 
								 />						
					</t:panelGroup>	
					<t:panelGroup>						
							<t:commandLink id="employee_record" forceId="#{true}" value="#{appBundle.record_record}"
								actionListener="#{employee.onRecord}" action="employee_record" 
								styleClass="aon-content-menu-item" 
								 />						
					</t:panelGroup>	
					<t:panelGroup>						
							<t:commandLink id="employee_curriculum" forceId="#{true}" value="#{appBundle.curriculum_curriculum}"
								actionListener="#{employee.onCurriculum}" action="employee_curriculum" 
								styleClass="aon-content-menu-item" 
								 />						
					</t:panelGroup>	
					<t:panelGroup>
							<t:commandLink id="employee_tracking" forceId="#{true}" value="#{appBundle.aon_employee_tracking}"
								actionListener="#{employee.onTracking}" action="employee_tracking" 
								styleClass="aon-content-menu-item" 
								 />						
					</t:panelGroup>	
				</t:panelGrid>
			</t:div>

			<ui:include src="/facelet/schedule/search/list.xhtml" />

		</h:form>
 	</ui:define>
			
</ui:composition>
</body>
</html>
