<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

		<t:panelGrid columns="2" cellpadding="0" cellspacing="0"
			styleClass="aon-form-table" style="width:100%"
			columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

			<t:panelGroup>
				<h:outputText value="#{appBundle.calculator_monthly_gross_salary}" styleClass="aon-form-input-text-label" />
			</t:panelGroup>
			<t:panelGroup style="width:100%; text-align:right">
				<h:outputText value="#{calculator.employeeSalary.grossSalary}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</t:panelGroup>

			<h:panelGrid columns="2" cellpadding="0" cellspacing="0" style="width:100%; border:0">
				<h:outputText value="#{appBundle.calculator_common_contingencies}" styleClass="aon-form-input-text-label" />
				<t:panelGroup styleClass="aon-form-input-text-label" style="text-align:right; width:100%">
					<h:outputText value="#{calculator.employeeSalary.commonContingenciesPercent}">
						<f:convertNumber pattern="#,##0.00" />
					</h:outputText>
					<h:outputText value="%" styleClass="aon-form-input-text-label" />
				</t:panelGroup>
			</h:panelGrid>
			<t:panelGroup style="width:100%; text-align:right">
				<h:outputText value="#{calculator.employeeSalary.commonContingencies}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</t:panelGroup>

			<h:panelGrid columns="2" cellpadding="0" cellspacing="0" style="width:100%; border:0">
				<h:outputText value="#{appBundle.calculator_unemployment}" styleClass="aon-form-input-text-label" />
				<t:panelGroup styleClass="aon-form-input-text-label" style="text-align:right; width:100%">
					<h:outputText value="#{calculator.employeeSalary.unemploymentPercent}">
						<f:convertNumber pattern="#,##0.00" />
					</h:outputText>
					<h:outputText value="%" styleClass="aon-form-input-text-label" />
				</t:panelGroup>
			</h:panelGrid>
			<t:panelGroup style="width:100%; text-align:right">
				<h:outputText value="#{calculator.employeeSalary.unemployment}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</t:panelGroup>

			<h:panelGrid columns="2" cellpadding="0" cellspacing="0" style="width:100%; border:0">
				<h:outputText value="#{appBundle.calculator_occupational_training}" styleClass="aon-form-input-text-label" />
				<t:panelGroup styleClass="aon-form-input-text-label" style="text-align:right; width:100%">
					<h:outputText value="#{calculator.employeeSalary.occupationalTrainingPercent}">
						<f:convertNumber pattern="#,##0.00" />
					</h:outputText>
					<h:outputText value="%" styleClass="aon-form-input-text-label" />
				</t:panelGroup>
			</h:panelGrid>
			<t:panelGroup style="width:100%; text-align:right">
				<h:outputText value="#{calculator.employeeSalary.occupationalTraining}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</t:panelGroup>

			<h:panelGrid columns="2" cellpadding="0" cellspacing="0" style="width:100%; border:0">
				<h:outputText value="#{appBundle.calculator_income_tax}" styleClass="aon-form-input-text-label" />
				<t:panelGroup styleClass="aon-form-input-text-label" style="text-align:right; width:100%">
					<h:outputText value="#{calculator.employeeSalary.incomeTaxPercent}">
						<f:convertNumber pattern="#,##0.00" />
			 		</h:outputText>
					<h:outputText value="%" styleClass="aon-form-input-text-label" />
				</t:panelGroup>
			</h:panelGrid>
			<t:panelGroup style="width:100%; text-align:right">
				<h:outputText value="#{calculator.employeeSalary.incomeTax}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</t:panelGroup>

			<t:panelGroup styleClass="aon-form-table-column-odd-resume">
				<h:outputText value="#{appBundle.calculator_employee_net_salary}" styleClass="aon-form-input-text-label" />
			</t:panelGroup>
			<t:panelGroup styleClass="aon-form-table-column-even-resume">
				<h:outputText value="#{calculator.employeeSalary.netSalary}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</t:panelGroup>

			<t:panelGroup styleClass="aon-form-table-column-odd-resume">
				<h:outputText value="#{appBundle.calculator_employee_net_extra_salary}" styleClass="aon-form-input-text-label" />
			</t:panelGroup>
			<t:panelGroup styleClass="aon-form-table-column-even-resume">
				<h:outputText value="#{calculator.employeeSalary.netExtraSalary}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</t:panelGroup>
 		</t:panelGrid>

</ui:composition>

</body>
</html>
