<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">
		<h:form id="expensesNet">
			<t:div id="aon-content-toolbar" forceId="#{true}"
				styleClass="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{appBundle.calculator_calculate}"
							actionListener="#{calculator.onCalculateCompanyExpensesFromNetSalary}" 
							action="calculate_company_expenses_from_net_salary"
							forceId="#{true}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							accesskey="#{bundle.aon_key_save}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table" style="width:70%"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="expensesNet_salary"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.calculator_annual_net_salary}" />
						<t:inputText id="expensesNet_salary" size="10" forceId="#{true}"
							styleClass="aon-form-input-text" required="true"
							value="#{calculator.netSalary}" />

						<t:outputLabel for="expensesNet_wage_number"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.calculator_wage_number}" />
						<t:selectOneMenu id="expensesNet_wage_number"
							forceId="#{true}" styleClass="aon-form-selectOneMenu-field"
							value="#{calculator.wageNumber}">
							<f:selectItems value="#{calculatorCollections.wageNumbers}" />
						</t:selectOneMenu>

						<t:outputLabel for="expensesNet_offspring_number"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.calculator_offspring_number}" />
						<t:selectOneMenu id="expensesNet_offspring_number"
							forceId="#{true}" styleClass="aon-form-selectOneMenu-field"
							value="#{calculator.offspringNumber}">
							<f:selectItems value="#{calculatorCollections.offspringNumbers}" />
						</t:selectOneMenu>

						<t:outputLabel for="expensesNet_contract_type"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.calculator_contract_type}" />
						<t:selectOneMenu id="expensesNet_contract_type"
							forceId="#{true}" styleClass="aon-form-selectOneMenu-field"
							value="#{calculator.contractType}">
							<f:selectItems value="#{calculatorCollections.contractTypes}" />
						</t:selectOneMenu>
					</h:panelGrid>

					<ui:insert name="calculation" />
				</t:div>
			</t:div>
		</h:form>
	</ui:define>

</ui:composition>

</ui:composition>

</body>
</html>
