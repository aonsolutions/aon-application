<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition >
	<t:div style="padding-left:10px;">
	<t:div styleClass="aon-form-image">
			<t:div styleClass="aon-form-image-internal">
				<t:graphicImage id="preview" height="163" width="163"
					rendered="#{curriculum.imageAttached}" 
					url="#{curriculum.url}"/>
			</t:div>
		</t:div>
		<t:inputFileUpload 
		    id="RegistryAttachment_id"
	    	value="#{curriculum.file}"
			storage="file"
			size="11" />
	</t:div>		
</ui:composition>

</body>
</html>
