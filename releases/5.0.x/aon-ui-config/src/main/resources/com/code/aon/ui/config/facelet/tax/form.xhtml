<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="taxForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="saveButtonReRender" value="taxDetailTable" />
				<ui:param name="toolbarTitle" value="#{configBundle.config_tax_module}" />
				<ui:param name="controller" value="#{tax}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4">
					<aon:outputLabel for="Tax_name"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Tax_name" 
						value="#{tax.to.name}" required="true" />
					
					<aon:outputLabel for="Tax_type" value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Tax_type" 
						required="true" value="#{tax.to.type}">
						<f:selectItems value="#{configCollections.taxTypes}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Tax_startDate" value="#{bundle.aon_date_from}" />
					<aon:selectInputDate id="Tax_startDate"
						value="#{tax.to.startDate}" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
						
					<aon:outputLabel 
						value="&#160;" />
					<aon:outputText  
						value="&#160;" />

					<aon:outputLabel for="Tax_percentage" value="#{bundle.aon_percentage}" />
					<aon:inputText id="Tax_percentage" size="6"
						value="#{tax.to.percentage}" required="true" />

					<aon:outputLabel for="Tax_surcharge" value="#{bundle.aon_surcharge}" />
					<aon:inputText id="Tax_surcharge" size="6"
						value="#{tax.to.surcharge}" required="true" />

					<aon:outputLabel for="Tax_salesAccount" value="#{configBundle.config_tax_sales_account}" />
					<ui:include
						src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
						<ui:param name="wizard" value="#{accountWizard}" />
						<ui:param name="id" value="Tax_salesAccount" />
						<ui:param name="required" value="#{false}" />
						<ui:param name="size" value="12" />
						<ui:param name="maxlength" value="12" />
						<ui:param name="renderDescription" value="#{false}" />
						<ui:param name="renderedAttr" value="true" />
						<ui:param name="disabled" value="#{false}" />
						<ui:param name="reRenderAttr" value="none" />
						<ui:param name="entity" value="#{tax.to.salesAccount}" />
						<ui:param name="ELExpression" value="tax.to.salesAccount" />
					</ui:include>

					<aon:outputLabel for="Tax_purchaseAccount" value="#{configBundle.config_tax_purchase_account}" />
					<ui:include
						src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
						<ui:param name="wizard" value="#{accountWizard}" />
						<ui:param name="id" value="Tax_purchaseAccount" />
						<ui:param name="required" value="#{false}" />
						<ui:param name="size" value="12" />
						<ui:param name="maxlength" value="12" />
						<ui:param name="renderDescription" value="#{false}" />
						<ui:param name="renderedAttr" value="true" />
						<ui:param name="disabled" value="#{false}" />
						<ui:param name="reRenderAttr" value="none" />
						<ui:param name="entity" value="#{tax.to.purchaseAccount}" />
						<ui:param name="ELExpression" value="tax.to.purchaseAccount" />
					</ui:include>

				</aon:panelGrid>
			</aon:div>
				
			<aon:div id="taxDetailTable" styleClass="aon-scroll-area">	
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="controller" value="#{taxDetail}" />
					<ui:param name="skipResetButton" value="true" />
					<ui:param name="columnClasses"
						value="aon-editDataTable-textColumn aon-width-200" />
					<ui:define name="columns">
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date_from}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}" rendered="#{to!=taxDetail.to}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate id="Tax_startDate"
								value="#{taxDetail.to.startDate}" rendered="#{to==taxDetail.to}"
								required="#{true}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
							<f:facet name="footer">
								<aon:selectInputDate id="Tax_startDate-New"
									rendered="#{taxDetail.new}" value="#{taxDetail.to.startDate}"
									required="#{true}"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}"/>
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date_to}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}" rendered="#{to!=taxDetail.to}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate id="Tax_endDate"
								value="#{taxDetail.to.endDate}" rendered="#{to==taxDetail.to}"
								required="#{true}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
							<f:facet name="footer">
								<aon:selectInputDate id="Tax_endDate-New"
									rendered="#{taxDetail.new}" value="#{taxDetail.to.endDate}"
									required="#{true}"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}"/>
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputLabel for="Tax_value" value="#{bundle.aon_value}" />
							</f:facet>
							<aon:outputText value="#{to.value}"
								rendered="#{to!=taxDetail.to}" />
							<aon:inputText id="Tax_value" rendered="#{to==taxDetail.to}" size="6"
								value="#{taxDetail.to.value}" required="true" />
							<f:facet name="footer">
								<aon:inputText id="Tax_value-New" rendered="#{taxDetail.new}" size="6"
									value="#{taxDetail.to.value}" required="true" />
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputLabel for="Tax_surcharge" value="#{bundle.aon_surcharge}" />
							</f:facet>
							<aon:outputText value="#{to.surcharge}"
								rendered="#{to!=taxDetail.to}" />
							<aon:inputText id="Tax_surcharge" rendered="#{to==taxDetail.to}" size="6"
								value="#{taxDetail.to.surcharge}" required="true" />
							<f:facet name="footer">
								<aon:inputText id="Tax_surcharge-New" rendered="#{taxDetail.new}" size="6"
									value="#{taxDetail.to.surcharge}" required="true" />
							</f:facet>
						</aon:column>

					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
