<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:param name="controller" value="#{actionEntry}" />
			<ui:param name="skipSelectButton" value="#{true}" />
			<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
			<ui:define name="columns">

				<aon:column styleClass="aon-width-80 aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_id}" />
					</f:facet>
					<aon:outputText value="#{to.id}"/>
				</aon:column>
	
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{auditBundle.audit_action}" />
					</f:facet>
					<aon:outputText value="#{to.action.name}"/>
				</aon:column>
	
				<aon:column styleClass="aon-width-150 aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_date}" />
					</f:facet>
					<aon:outputText value="#{to.executionDate}">
						<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>							
				</aon:column>
			</ui:define>
		</ui:decorate>

	</aon:div>

</ui:composition>
