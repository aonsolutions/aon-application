<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-form-group" rendered="#{!course.new}">
		<t:div styleClass="aon-form-group-title">
			<t:outputLabel for="courseInstructorDataTable" value="#{appBundle.instructor_instructors}" />
		</t:div>

		<t:div styleClass="aon-form-group-body">
			<t:dataTable id="courseInstructorDataTable"
				value="#{courseInstructor.model}" var="to"
				rowOnMouseOver="selectRow( this )"
				rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
				styleClass="aon-edit-table" headerClass="aon-edit-table-header"
				footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
				rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
				columnClasses="aon-edit-table-body aon-edit-table-body-icon,
					aon-edit-table-body aon-edit-table-body-string,
					aon-edit-table-body aon-edit-table-body-string,
					aon-edit-table-body aon-edit-table-body-buttons">

				<h:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<f:verbatim>&#160;</f:verbatim>
					<t:commandLink immediate="#{true}"
						rendered="#{to!=courseInstructor.to}"
						styleClass="aon-table-row-selected"
						actionListener="#{courseInstructor.onSelect}">
					</t:commandLink>
					<f:facet name="footer">
						<t:div>
							<t:commandButton id="reset"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
								value="" immediate="#{true}" rendered="#{!courseInstructor.new}"
								actionListener="#{courseInstructor.onReset}"
								accesskey="#{bundle.aon_key_new_line}">
							</t:commandButton>
						</t:div>
					</f:facet>
				</h:column>

				<h:column>
					<f:facet name="header">
						<h:outputText value="#{appBundle.instructor_instructor}" />
					</f:facet>
					<t:outputText value="#{to.employee.registry.name} #{to.employee.registry.surname}" />
					<f:facet name="footer">
						<t:div>
							<h:selectOneMenu value="#{courseInstructor.to.employee.id}"
								styleClass="aon-form-selectOneMenu-field"
								valueChangeListener="#{courseInstructor.onInstructorChanged}"
								rendered="#{courseInstructor.new}">
								<f:selectItems value="#{academyCollections.instructors}" />
							</h:selectOneMenu>
						</t:div>
					</f:facet>
				</h:column>

				<t:column width="200">
					<f:facet name="header">
						<t:outputText value="#{appBundle.instructor_type}" />
					</f:facet>
					<t:outputText value="#{to.type}"
						rendered="#{to!=courseInstructor.to}" />
					<h:selectOneMenu value="#{courseInstructor.to.type}"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{to==courseInstructor.to}">
						<f:selectItems value="#{academyCollections.instructorTypes}" />
					</h:selectOneMenu>
					<f:facet name="footer">
						<t:div>
							<h:selectOneMenu value="#{courseInstructor.to.type}"
								styleClass="aon-form-selectOneMenu-field"
								rendered="#{courseInstructor.new}">
								<f:selectItems value="#{academyCollections.instructorTypes}" />
							</h:selectOneMenu>
						</t:div>
					</f:facet>
				</t:column>

				<h:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<t:div>
						<f:verbatim rendered="#{to!=courseInstructor.to}">&#160;</f:verbatim>

						<t:commandButton title="#{bundle.aon_save}"
							actionListener="#{courseInstructor.onAccept}"
							rendered="#{to==courseInstructor.to}" value=""
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
							accesskey="#{bundle.aon_key_save_line}" />
						<t:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{courseInstructor.onCancel}" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
							value="" rendered="#{to==courseInstructor.to}"
							accesskey="#{bundle.aon_key_cancel_line}" />
						<t:commandButton title="#{bundle.aon_remove}"
							actionListener="#{courseInstructor.onRemove}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
							rendered="#{to==courseInstructor.to}"
							styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
							value="" accesskey="#{bundle.aon_key_remove_line}" />
					</t:div>
					<f:facet name="footer">
						<t:div>
							<f:verbatim rendered="#{!courseInstructor.new}">&#160;</f:verbatim>
							<t:commandButton title="#{bundle.aon_save}"
								actionListener="#{courseInstructor.onAccept}"
								rendered="#{courseInstructor.new}" value=""
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
								accesskey="#{bundle.aon_key_save_line}" />
							<t:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{courseInstructor.onCancel}"
								immediate="#{true}"
								onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
								rendered="#{courseInstructor.new}"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
								value="" accesskey="#{bundle.aon_key_cancel_line}" />
						</t:div>
					</f:facet>
				</h:column>
			</t:dataTable>

			<ui:include src="/facelet/shared/dataScroller.xhtml">
				<ui:param name="dataTable" value="courseInstructorDataTable" />
				<ui:param name="model" value="#{courseInstructor.model}" />
				<ui:param name="showNote" value="#{false}" />
			</ui:include>

		</t:div>
	</t:div>

</ui:composition>
</body>
</html>
