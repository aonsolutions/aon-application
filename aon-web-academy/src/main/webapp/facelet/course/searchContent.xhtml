<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
		forceId="#{true}">
		<t:div styleClass="aon-content-subtitle-internal">
			<h:outputText value="#{bundle.aon_search_header}" />
		</t:div>
	</t:div>

	<t:div forceId="#{true}" id="aon-scroll-area">
		<t:div styleClass="aon-scroll-area-internal">
			<h:panelGrid columns="2" styleClass="aon-form-table"
				columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

				<t:outputLabel for="Course_code" value="#{appBundle.course_code}"
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
				<t:inputText id="Course_code"
					valueChangeListener="#{courseAlias.addExpression}" size="16"
					maxlength="15" styleClass="aon-form-input-text" />

				<t:outputLabel for="Course_academicYear_id"
					value="#{appBundle.course_academic_year}"
					styleClass="aon-form-input-text-label" />
				<h:selectOneMenu id="Course_academicYear_id"
					styleClass="aon-form-selectOneMenu-field"
					converter="IntegerEmptyConverter" forceId="#{true}"
					valueChangeListener="#{courseAlias.addDirectExpression}">
					<f:selectItem itemLabel="-" itemValue="" itemDisabled="true" />
					<f:selectItems value="#{academyCollections.academicYears}" />
				</h:selectOneMenu>

				<h:outputLabel
					value="#{appBundle.course_start_date}"
					styleClass="aon-form-input-text-label"
					rendered="#{hideDates==null}" />
				<h:panelGrid columns="4" rendered="#{hideDates==null}">
					<h:outputLabel for="Course_startDate-From"
						styleClass="aon-form-input-text-label"
						value="#{appBundle.aon_date_from}" />
					<t:inputCalendar size="8" id="Course_startDate-From"
						valueChangeListener="#{courseAlias.addStartDateFromExpression}"
						monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
						currentDayCellClass="currentDayCell" renderAsPopup="true"
						styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
						popupTodayString="#{bundle.aon_popup_today}"
						popupWeekString="#{bundle.aon_popup_week}" />
					
					<h:outputLabel for="Course_startDate-To"
						styleClass="aon-form-input-text-label"
						value="#{appBundle.aon_date_to}" />
					<t:inputCalendar size="8" id="Course_startDate-To"
						valueChangeListener="#{courseAlias.addStartDateToExpression}"
						monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
						currentDayCellClass="currentDayCell" renderAsPopup="true"
						styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
						popupTodayString="#{bundle.aon_popup_today}"
						popupWeekString="#{bundle.aon_popup_week}" />	
				</h:panelGrid>

				<h:outputLabel
					value="#{appBundle.course_end_date}"
					styleClass="aon-form-input-text-label"
					rendered="#{hideDates==null}" />
				<h:panelGrid columns="4" rendered="#{hideDates==null}">
					<h:outputLabel for="Course_endDate-From"
						styleClass="aon-form-input-text-label"
						value="#{appBundle.aon_date_from}" />
					<t:inputCalendar size="8" id="Course_endDate-From"
						valueChangeListener="#{courseAlias.addEndDateFromExpression}"
						monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
						currentDayCellClass="currentDayCell" renderAsPopup="true"
						styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
						popupTodayString="#{bundle.aon_popup_today}"
						popupWeekString="#{bundle.aon_popup_week}" />
					
					<h:outputLabel for="Course_endDate-To"
						styleClass="aon-form-input-text-label"
						value="#{appBundle.aon_date_to}" />
					<t:inputCalendar size="8" id="Course_endDate-To"
						valueChangeListener="#{courseAlias.addEndDateToExpression}"
						monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
						currentDayCellClass="currentDayCell" renderAsPopup="true"
						styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
						popupTodayString="#{bundle.aon_popup_today}"
						popupWeekString="#{bundle.aon_popup_week}" />	
				</h:panelGrid>

				<t:outputLabel for="Course_courseSubject_id"
					value="#{appBundle.course_subject}"
					styleClass="aon-form-input-text-label" />
				<h:selectOneMenu id="Course_courseSubject_id"
					styleClass="aon-form-selectOneMenu-field"
					converter="IntegerEmptyConverter" forceId="#{true}"
					valueChangeListener="#{courseAlias.addDirectExpression}">
					<f:selectItem itemLabel="-" itemValue="" itemDisabled="true" />
					<f:selectItems value="#{academyCollections.courseSubjects}" />
				</h:selectOneMenu>

				<t:outputLabel for="Course_courseLevel_id"
					value="#{appBundle.course_level}"
					styleClass="aon-form-input-text-label" />
				<h:selectOneMenu id="Course_courseLevel_id"
					styleClass="aon-form-selectOneMenu-field"
					converter="IntegerEmptyConverter" forceId="#{true}"
					valueChangeListener="#{courseAlias.addDirectExpression}">
					<f:selectItem itemLabel="-" itemValue="" itemDisabled="true" />
					<f:selectItems value="#{academyCollections.courseLevels}" />
				</h:selectOneMenu>

				<t:outputLabel for="Course_workPlace_id"
					value="#{appBundle.course_workplace}"
					styleClass="aon-form-input-text-label" />
				<h:selectOneMenu id="Course_workPlace_id"
					styleClass="aon-form-selectOneMenu-field"
					converter="IntegerEmptyConverter" forceId="#{true}"
					valueChangeListener="#{courseAlias.addDirectExpression}">
					<f:selectItem itemLabel="-" itemValue="" itemDisabled="true" />
					<f:selectItems value="#{companyCollections.workPlaces}" />
				</h:selectOneMenu>

				<t:outputLabel for="Course_status"
					value="#{appBundle.course_status}"
					styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
					rendered="#{hideStatus==null}" />
				<h:selectOneMenu id="Course_status"
					styleClass="aon-form-selectOneMenu-field"
					converter="aonCourseStatusConverter" forceId="#{true}"
					valueChangeListener="#{courseAlias.addExpression}"
					rendered="#{hideStatus==null}">
					<f:selectItems value="#{academyCollections.courseStatuses}" />
				</h:selectOneMenu>
			</h:panelGrid>
		</t:div>
	</t:div>

</ui:composition>

</body>
</html>
