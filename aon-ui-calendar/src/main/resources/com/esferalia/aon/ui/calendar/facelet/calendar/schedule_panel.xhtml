<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panel id="schedulePanel"   
		header="#{bundle.aon_calendar_schedule}">
	
		<aon:panelGrid columns="2" style="height:80px; width:100%;">
			<aon:outputLabel value="#{bundle.aon_monday}" />
			<aon:div >
				<aon:inputText size="2" maxlength="6" styleClass="aon-inputText aon-margin-right"
					value="#{calendar.to.mondayHours}" />
				<aon:outputText value="#{bundle.aon_type}:" styleClass="aon-italic aon-margin-right" />
				<aon:selectOneMenu value="#{calendar.to.monday}">
					<f:selectItems value="#{calendarCollections.dayTypes}" />
				</aon:selectOneMenu>
			</aon:div>
			
			<aon:outputLabel value="#{bundle.aon_tuesday}" />

				</aon:selectOneMenu>
			</aon:div>
			
			<aon:outputLabel value="#{bundle.aon_thursday}" />

				<aon:inputText size="2" maxlength="6" styleClass="aon-inputText aon-margin-right"
					value="#{calendar.to.thursdayHours}" />
				<aon:outputText value="#{bundle.aon_type}:" styleClass="aon-italic aon-margin-right" />

				<aon:inputText size="2" maxlength="6" styleClass="aon-inputText aon-margin-right"
