<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

<aon:div styleClass="aon-scroll-area" style="align:center">
	<h:panelGrid columns="2">
		<aon:div>
			<aon:panelGrid columns="2">
				<aon:outputLabel value="#{calendarBundle.aon_calendar_calendar}" />
				<aon:outputText id="Calendar_description" size="40" maxlength="32"
					value="#{calendar.to.description}" required="true" />
				<aon:outputLabel value="#{bundle.aon_year}" />
				<aon:outputText id="Calendar_year" size="10" maxlength="4"
					value="#{calendar.year}" />
				<aon:outputLabel value="#{calendarBundle.aon_calendar_anual_hours}" />
				<aon:outputText id="Calendar_anualHours" size="10" maxlength="6"
					value="#{calendar.to.anualHours}" />
				<aon:outputLabel value="#{bundle.aon_comment}" />
				<aon:outputText id="Calendar_comments" size="60"
					value="#{calendar.to.comments}" />

				<aon:outputLabel value="#{calendarBundle.aon_calendar_monday}" />
				<aon:div>
					<aon:outputText value="#{calendar.to.monday}">
					</aon:outputText>
					<aon:outputText size="1" maxlength="6"
						value="   #{calendar.to.mondayHours}" />
				</aon:div>
				<aon:outputLabel value="#{calendarBundle.aon_calendar_tuesday}" />
				<aon:div>
					<aon:outputText value="#{calendar.to.tuesday}"></aon:outputText>
					<aon:outputText size="1" maxlength="6"
						value="   #{calendar.to.tuesdayHours}" />
				</aon:div>
				<aon:outputLabel value="#{calendarBundle.aon_calendar_wednesday}" />
				<aon:div>
					<aon:outputText value="#{calendar.to.wednesday}" />
					<aon:outputText size="1" maxlength="6"
						value="   #{calendar.to.wednesdayHours}" />
				</aon:div>
				<aon:outputLabel value="#{calendarBundle.aon_calendar_thursday}" />
				<aon:div>
					<aon:outputText value="#{calendar.to.thursday}"></aon:outputText>
					<aon:outputText size="1" maxlength="6"
						value="   #{calendar.to.thursdayHours}" />
				</aon:div>
				<aon:outputLabel value="#{calendarBundle.aon_calendar_friday}" />
				<aon:div>
					<aon:outputText value="#{calendar.to.friday}"></aon:outputText>
					<aon:outputText size="1" maxlength="6"
						value="   #{calendar.to.fridayHours}" />
				</aon:div>
				<aon:outputLabel value="#{calendarBundle.aon_calendar_saturday}" />
				<aon:div>
					<aon:outputText value="#{calendar.to.saturday}"></aon:outputText>
					<aon:outputText size="1" maxlength="6"
						value="   #{calendar.to.saturdayHours}" />
				</aon:div>
				<aon:outputLabel value="#{calendarBundle.aon_calendar_sunday}" />
				<aon:div>
					<aon:outputText value="#{calendar.to.sunday}"></aon:outputText>
					<aon:outputText size="1" maxlength="6"
						value="   #{calendar.to.sundayHours}" />
				</aon:div>
			</aon:panelGrid>



			<aon:panel style="height=80px" width="100" header="Festivos">

				<h:panelGrid columns="1">

					<aon:outputText value="Mostrar aqui festivos correspondientes a este calendario para este anyo " />


				</h:panelGrid>

			</aon:panel>

			<aon:panel style="height=80px" width="100" header="Dias de Empresa">

				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{calendarHoliday}" />
					<ui:param name="showNote" value="false" />
					<ui:param name="showDataScroller" value="false" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSelectButton" value="true" />
					<ui:param name="rowSelectorToggleOnClick" value="#{null}" />

					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>

					</ui:define>
				</ui:decorate>

			</aon:panel>

			<aon:panel style="height=80px" width="100"
				header="Periodos Especiales">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{calendarPeriod}" />
					<ui:param name="showNote" value="false" />
					<ui:param name="showDataScroller" value="false" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSelectButton" value="true" />
					<ui:param name="rowSelectorToggleOnClick" value="#{null}" />

					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="Calendar_month"
									value="#{calendarBundle.aon_calendar_month}" />
							</f:facet>
							<aon:outputText value="#{to.month}" />

						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="Calendar_startDay"
									value="#{calendarBundle.aon_calendar_start_day}" />
							</f:facet>
							<aon:outputText value="#{to.startDay}" />

						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputLabel for="Calendar_period_end_day"
									value="#{calendarBundle.aon_calendar_end_day}" />
							</f:facet>
							<aon:outputText value="#{to.endDay}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:panel>


		</aon:div>
		<aon:div styleClass="aon-scroll-area">
			<h:panelGrid columns="3">
				<rich:calendar value="#{calendar.date0}"
					 popup="false"
					datePattern="dd/MM/yyyy" showApplyButton="false" cellWidth="25px"
					cellHeight="25px" showWeeksBar="false" showFooter="false"
					disabled="true">
				</rich:calendar>

				<rich:calendar value="#{calendar.date1}" popup="false"
					datePattern="dd/MM/yyyy" showApplyButton="false" cellWidth="25px"
					cellHeight="25px" showWeeksBar="false" showFooter="false"
					disabled="true">
				</rich:calendar>

				<rich:calendar value="#{calendar.date2}" popup="false"
					datePattern="dd/MM/yyyy" showApplyButton="false" cellWidth="25px"
					cellHeight="25px" showWeeksBar="false" showFooter="false"
					disabled="true">
				</rich:calendar>

				<rich:calendar value="#{calendar.date3}" popup="false"
					showApplyButton="false" cellWidth="25px" cellHeight="25px"
					showWeeksBar="false" showFooter="false" disabled="true">
				</rich:calendar>
				<rich:calendar value="#{calendar.date4}" popup="false"
					showApplyButton="false" cellWidth="25px" cellHeight="25px"
					showWeeksBar="false" showFooter="false" disabled="true">
				</rich:calendar>

				<rich:calendar dataModel="#{calendar.modelo}" popup="false"
					showApplyButton="false" cellWidth="25px" cellHeight="25px"
					showWeeksBar="false" showFooter="false" disabled="true">
				</rich:calendar>

				<rich:calendar dataModel="#{calendar.modelo}" popup="false"
					showApplyButton="false" cellWidth="25px" cellHeight="25px"
					showWeeksBar="false" showFooter="false" >
				</rich:calendar>

				<rich:calendar value="#{calendar.date7}" popup="false"
					showApplyButton="false" cellWidth="25px" cellHeight="25px"
					showWeeksBar="false" showFooter="false" disabled="true">
				</rich:calendar>

				<rich:calendar value="#{calendar.date8}" popup="false"
					showApplyButton="false" cellWidth="25px" cellHeight="25px"
					showWeeksBar="false" showFooter="false" disabled="true">
				</rich:calendar>

				<rich:calendar value="#{calendar.date9}" popup="false"
					showApplyButton="false" cellWidth="25px" cellHeight="25px"
					showWeeksBar="false" showFooter="false" disabled="true">
				</rich:calendar>

				<rich:calendar value="#{calendar.date10}" popup="false"
					showApplyButton="false" cellWidth="25px" cellHeight="25px"
					showWeeksBar="false" showFooter="false" disabled="true">
				</rich:calendar>

				<rich:calendar value="#{calendar.date11}" popup="false"
					disabled="true" showApplyButton="false" cellWidth="25px"
					cellHeight="25px" showWeeksBar="false" showFooter="false">
				</rich:calendar>
			</h:panelGrid>

		</aon:div>
	</h:panelGrid>

</aon:div>

</html>
