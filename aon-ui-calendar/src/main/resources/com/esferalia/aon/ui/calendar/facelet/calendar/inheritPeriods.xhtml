	<aon:panelCollapsible expanded="false" 
		label="#{calendarBundle.aon_calendar_inherit_periods}&#160;#{calendar.masterCalendar.description}"
		rendered="#{calendar.to.calendar!=null and calendar.inheritPeriodsModel.rowCount>0}">
		<aon:dataTable value="#{calendar.inheritPeriodsModel}" var="to" >
		
			<aon:column
				style="padding: 0px; border: none;background-color: #FBEDB6;">
				<h:panelGrid columns="5" style="font-size: 0.9em; width: 100%;"
					cellpadding="0" cellspacing="0" border="0"
					columnClasses="
	 				aon-width-40 aon-editDataTable-textdateColumn aon-form-text-label aon-bold aon-noborder,
	 				aon-width-auto aon-editDataTable-textColumn aon-noborder,
	 				aon-width-40 aon-editDataTable-textColumn aon-form-text-label aon-bold aon-noborder,
	 				aon-width-100 aon-editDataTable-textColumn aon-noborder,
	 				aon-width-270 aon-editDataTable-textColumn aon-noborder
	 				">

					<aon:outputLabel value="#{bundle.aon_description}:" />
					<aon:outputText value="#{to.description}" />

					<aon:outputLabel value="#{calendarBundle.aon_calendar_period}:" />
					<aon:div>
						<aon:outputText value="#{to.startDay}" />
						<aon:outputText value="-" />
						<aon:outputText value="#{to.endDay}" />
						<aon:outputText value="&#160;" />
						<aon:outputText value="#{to.month}" />
					</aon:div>

					<aon:div>
					
					<aon:outputLabel value="#{calendarBundle.aon_calendar_monday_abr}:" />
						<aon:outputText value="#{to.monday}" />
						<aon:outputText value="(#{to.mondayHours})" />
						<aon:outputText value="&#160;-&#160;" />

					<aon:outputLabel value="#{calendarBundle.aon_calendar_tuesday_abr}:" />
						<aon:outputText value="#{to.tuesday}" />
						<aon:outputText value="(#{to.tuesdayHours})" />
						<aon:outputText value="&#160;-&#160;" />

					<aon:outputLabel value="#{calendarBundle.aon_calendar_wednesday_abr}:" />
						<aon:outputText value="#{to.wednesday}" />
						<aon:outputText value="(#{to.wednesdayHours})" />
						<aon:outputText value="&#160;-&#160;" />

					<aon:outputLabel value="#{calendarBundle.aon_calendar_thursday_abr}:" />
						<aon:outputText value="#{to.thursday}" />
						<aon:outputText value="(#{to.thursdayHours})" />
						<aon:outputText value="&#160;-&#160;" />

					<aon:outputLabel value="#{calendarBundle.aon_calendar_friday_abr}:" />
						<aon:outputText value="#{to.friday}" />
						<aon:outputText value="(#{to.fridayHours})" />
						<aon:outputText value="&#160;-&#160;" />

					<aon:outputLabel value="#{calendarBundle.aon_calendar_saturday_abr}:" />
						<aon:outputText value="#{to.saturday}" />
						<aon:outputText value="(#{to.saturdayHours})" />
						<aon:outputText value="&#160;-&#160;" />

					<aon:outputLabel value="#{calendarBundle.aon_calendar_sunday_abr}:" />
						<aon:outputText value="#{to.sunday}" />
						<aon:outputText value="(#{to.sundayHours})" />
					
					</aon:div>














				</h:panelGrid>
	 		</aon:column>
