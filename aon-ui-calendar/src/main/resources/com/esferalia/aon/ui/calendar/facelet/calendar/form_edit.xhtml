<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{calendar.enterprise}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>
	
	<aon:outputLabel for="workPlace"
	rendered="#{calendar.nevv}"
		value="#{bundle.purchase_workplace}" />
	<aon:selectOneMenu id="workPlace"
		rendered="#{calendar.nevv}" 
		disabled="#{calendar.enterprise==null or calendar.enterprise.id==null}"
		value="#{calendar.workPlace}" >
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{calendar.workPlaces}" />
		<a4j:support event="onchange" reRender="calendar_data" >
			<aon:actionListener method="#{calendar.onWorkPlaceChanged}" />
		</a4j:support>
	</aon:selectOneMenu>

	<aon:div rendered="#{calendar.nevv}">
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{calendar.contract}" />
			<ui:param name="skipNewButton" value="#{true}" />
		</ui:include>
	</aon:div>
