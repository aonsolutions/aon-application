<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
		<ui:param name="controller" value="#{calendarHoliday}" />
		<ui:param name="skipSelectButton" value="true" />
		<ui:param name="rowSelectorToggleOnClick" value="false" />
		<ui:param name="showNote" value="false" />
		
			
		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-70">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.date}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
				<f:facet name="header">
					<aon:outputText 
						value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.dayType}"/>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-70">
				<f:facet name="header">
					<aon:outputText 
						value="#{bundle.aon_calendar_hours}" />
				</f:facet>
				<aon:outputText value="#{to.hours}" />
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputText 
						value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" />
			</aon:column>

		</ui:define>
	</ui:decorate>
</ui:composition>
