	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate

		<ui:param name="controller" value="#{calendarPeriod}" />

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{formList}" />
				<aon:inputText id="Calendar_period_description" rendered="#{formEdit}" size="15"
					value="#{calendarPeriod.to.description}" maxlength="64" />
				<f:facet name="footer">
					<aon:inputText id="Calendar_period_description-New" 
						rendered="#{formNew}" size="15" maxlength="64"
						value="#{calendarPeriod.to.description}" />
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
				<f:facet name="header">
					<aon:outputLabel for="Calendar_month"
						value="#{bundle.aon_month}" />
				</f:facet>
				<aon:outputText value="#{to.month}" rendered="#{formList}" />
				<aon:selectOneMenu id="Calendar_month"
					value="#{controller.to.month}" rendered="#{formEdit}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{commonCollections.months}" />
					<a4j:support event="onchange" reRender="#{dataTableId}" 
						actionListener="#{calendarPeriod.onMonthChanged}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="Calendar_month-New"
						value="#{controller.to.month}" rendered="#{formNew}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{commonCollections.months}" />
						<a4j:support event="onchange" reRender="#{dataTableId}" 
							actionListener="#{calendarPeriod.onMonthChanged}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-50">

						value="#{bundle.aon_calendar_start_day}" />

				<aon:outputText value="#{to.startDay}" rendered="#{formList}" />
				<aon:selectOneMenu id="Calendar_period_startDay"
					value="#{controller.to.startDay}" 
					disabled="#{controller.to.month==null}" rendered="#{formEdit}">
					<f:selectItems value="#{calendarCollections.monthDays}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="Calendar_period_startDay-New"
						value="#{controller.to.startDay}" 
						disabled="#{controller.to.month==null}" rendered="#{formNew}">
						<f:selectItems value="#{calendarCollections.monthDays}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-50">

				</f:facet>
			</aon:column>

				</f:facet>
				<aon:outputText rendered="#{formList}" value="#{to.monday}" />
				<aon:outputText rendered="#{formList}" value="(#{to.mondayHours})" />
				<aon:selectOneMenu rendered="#{formEdit}"
					value="#{controller.to.monday}">
					<f:selectItems value="#{calendarCollections.allDayTypes}" />
				</aon:selectOneMenu>
				<aon:inputText size="1" maxlength="6" rendered="#{formEdit}"
					value="#{controller.to.mondayHours}" />
				<f:facet name="footer">
