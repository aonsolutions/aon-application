<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="calendarForm">
			<aon:methodParam name="removeAction" value="#{calendar.backAction}" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{calendarBundle.aon_calendar_menu}" />
				<ui:param name="controller" value="#{calendar}" />
<!--  
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
-->
				<ui:define name="beforeSpinToolbarContent">
					<aon:htmlCommandLink id="calendarReport_list"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						actionListener="#{calendarPrint.onLoad}"
						value="#{bundle.aon_report}"
						rendered="#{!calendar.new}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="calendarReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width:100%;" 
					columnClasses="
					aon-panelGrid-even aon-noborder aon-vertical-align-top, 
					aon-panelGrid-even aon-noborder aon-vertical-align-top">
				
					<aon:div>

						<aon:panelGrid columns="2" id="calendar_data" style="width:100%;"
							rendered="#{!calendar.new}">
							
							<aon:outputLabel for="Calendar_masterCalendar_id"
								value="#{calendarBundle.aon_calendar_base_calendar}" />

							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Calendar_masterCalendar_id"
									value="#{calendar.to.calendar.id}" size="5"
									lookup="#{calendarLookup}" 
									lookupChangeListener="#{calendar.onCalendarLookupChanged}"
									reRender="Calendar_masterCalendar_name,calendar_data" />
								<aon:lookupButton
									windowTitle="#{calendarBundle.aon_calendar_calendar_select}"
									minHeight="460" minWidth="650" 
									lookup="#{calendarLookup}"
									lookupChangeListener="#{calendar.onCalendarLookupChanged}"
									selectReRender="Calendar_masterCalendar_id,Calendar_masterCalendar_name,calendar_data"
									actionType="search"
									property="#{calendar.to.calendar}">
								</aon:lookupButton>
								<aon:inputText id="Calendar_masterCalendar_name"
									value="#{calendar.to.calendar.description}"
									disabled="true" size="60" />
							</aon:div>
								
							<aon:outputLabel rendered="#{!calendar.new}"
								value="#{bundle.aon_year}" />
							<rich:inputNumberSpinner value="#{calendar.year}"
							 	rendered="#{!calendar.new}"
								inputSize="4" minValue="2000" maxValue="2100"
								enableManualInput="true" step="1"
								ignoreDupResponses="true"
								cycled="false"  style="width:5px;height:5px;" >
								<a4j:support event="onchange" reRender="calendarForm, tabPanel, schedule"
									actionListener="#{calendar.onChangeYear}"
									ignoreDupResponses="true" />
							</rich:inputNumberSpinner>
					
							<aon:outputLabel for="Calendar_description"
								value="#{bundle.aon_description}" />
							<aon:inputText id="Calendar_description" size="40" maxlength="32"
								value="#{calendar.to.description}"  />
							
							<aon:outputLabel for="Calendar_anualHours"
								value="#{calendarBundle.aon_calendar_anual_hours}" />
							<aon:inputText id="Calendar_anualHours" size="10" maxlength="6"
								value="#{calendar.to.anualHours}" />
								
							<aon:outputLabel for="Holiday_id"
								value="#{calendarBundle.aon_calendar_holiday}" />
							<aon:div styleClass="aon-lookup" >
								<aon:lookupInputText id="Holiday_id"
									value="#{calendar.to.holiday.id}" size="5"
									lookup="#{holidayLookup}" reRender="Holiday_name" />
								<aon:lookupButton
									windowTitle="#{calendarBundle.aon_calendar_holiday}"
									minHeight="460" minWidth="650" property="#{calendar.to.holiday}"
									lookup="#{holidayLookup}"
									selectReRender="Holiday_id,Holiday_name"
									actionType="list">
								</aon:lookupButton>
								<aon:inputText id="Holiday_name"
									value="#{calendar.to.holiday.description}"
									disabled="true" size="60" />
							</aon:div>
							
							<aon:outputLabel for="Calendar_comments"
								value="#{bundle.aon_comment}" />
							<aon:inputTextarea id="Calendar_comments"
								value="#{calendar.to.comments}" cols="77" rows="5">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
						</aon:panelGrid>
					</aon:div>
					
					<aon:div id="schedule" 
						rendered="#{!(calendar.new)}">
						<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/schedule_panel.xhtml" />
					</aon:div>

				</aon:panelGrid>
				
				<c:if test="#{!calendar.new}">
						<aon:panelTabSet id="tabPanel">
							<aon:panelTab label="#{calendarBundle.aon_calendar_days}">
								<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/holiday_panel.xhtml" />
								<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/inheritHolidays.xhtml" />
								<aon:panel 
									header="#{calendarBundle.aon_calendar_days}">
										<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendarHoliday/tab_grid.xhtml" />
								</aon:panel>
							</aon:panelTab>
							<aon:panelTab label="#{calendarBundle.aon_calendar_periods}">
								<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/inheritPeriods.xhtml" />
									<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendarPeriod/tab_grid.xhtml" />
							</aon:panelTab>
						</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>

		<aon:lookupButtonPopup lookup="#{holidayLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		<aon:lookupButtonPopup lookup="#{contractLookup}" />
		<aon:lookupButtonPopup lookup="#{calendarLookup}" />
		
	</ui:define>
</ui:composition>
