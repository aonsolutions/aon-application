<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="calendarForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{calendarBundle.aon_calendar_menu}" />
				<ui:param name="controller" value="#{calendar}" />
				<ui:param name="skipSpin" value="true" />
				<ui:define name="beforeSpinToolbarContent">
<!--  
					<aon:htmlCommandLink id="export2pdf" value="#{calendarBundle.aon_calendar_calendar}"
						rendered="#{!calendar.new}"
						title="Listado Pdf" actionListener="#{calendar.onInitCalendar}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						action="calendar_calendar" target="_blank">
						<f:param name="reportKey" value="yearStatsList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
-->				
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				
				<h:panelGrid columns="3">
					<aon:div styleClass="aon-scroll-area">
						<aon:panelGrid columns="2" id="calendar_data">
					
							<aon:outputText rendered="#{!calendar.new}"
								value="#{companyBundle.company_enterprise}" />
							<aon:outputText rendered="#{!calendar.new}"
								value="#{calendar.enterprise.registry.fullName}" />
							
							<aon:outputText rendered="#{!calendar.new and calendar.workPlace!=null}"
								value="#{companyBundle.company_workplace}" />
							<aon:outputText rendered="#{!calendar.new and calendar.workPlace!=null}"
								value="#{calendar.workPlace.description}" />
							
							<aon:outputText rendered="#{!calendar.new and calendar.contract!=null}"
								value="#{employeeBundle.employee_contract}" />
							<aon:outputText rendered="#{!calendar.new and calendar.contract!=null}"
								value="#{calendar.contract.person.fullName}" />
							
							<aon:outputLabel for="Enterprise_id"
								rendered="#{calendar.new}"
								value="#{companyBundle.company_enterprise}" />
							<aon:div styleClass="aon-lookup" rendered="#{calendar.new}">
								<aon:lookupInputText id="Enterprise_id" rendered="#{calendar.new}"
									lookup="#{enterpriseLookup}" lookupChangeListener="#{calendar.onEnterpriseChanged}"
									reRender="Enterprise_full_name,calendar_data"
									value="#{calendar.enterprise.id}" size="5" />
								<aon:lookupButton rendered="#{calendar.new}"
									windowTitle="#{companyBundle.company_enterprise_selection}"
									selectReRender="Enterprise_id,Enterprise_full_name,calendar_data"
									lookup="#{enterpriseLookup}" lookupChangeListener="#{calendar.onEnterpriseChanged}"
									minHeight="460" minWidth="650" actionType="search"
									property="#{calendar.enterprise}">
								</aon:lookupButton>
								<aon:inputText id="Enterprise_full_name" rendered="#{calendar.new}"
									value="#{(calendar.enterprise.registry.fullName!=null)?(calendar.enterprise.registry.fullName):('')}"
									size="50" disabled="true" />							
							</aon:div>
							
							<aon:outputLabel for="workPlace"
							rendered="#{calendar.new}"
								value="#{companyBundle.company_workplace}" />
							<aon:selectOneMenu id="workPlace"
								rendered="#{calendar.new}" 
								disabled="#{calendar.enterprise==null or calendar.enterprise.id==null}"
								value="#{calendar.workPlace}" >
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{calendar.workPlaces}" />
								<a4j:support event="onchange" reRender="calendar_data" >
									<aon:actionListener method="#{calendar.onWorkPlaceChanged}" />
								</a4j:support>
							</aon:selectOneMenu>
						
							<aon:outputLabel for="Contract_id"
								rendered="#{calendar.new}"
								value="#{employeeBundle.employee_contract}" />
							<aon:div styleClass="aon-lookup" rendered="#{calendar.new}">
								<aon:lookupInputText id="Contract_id" rendered="#{calendar.new}"
									disabled="#{calendar.workPlace==null or calendar.workPlace.id==null}"
									lookup="#{contractLookup}" lookupChangeListener="#{calendar.onContractChanged}"
									reRender="Enterprise_full_name"
									value="#{calendar.contract.id}" size="5" />
								<aon:lookupButton rendered="#{calendar.new}"
									disabled="#{calendar.workPlace==null or calendar.workPlace.id==null}"
									windowTitle="#{employeeBundle.employee_contract_selection}"
									selectReRender="Contract_id,Contract_full_name"
									lookup="#{contractLookup}" lookupChangeListener="#{calendar.onContractChanged}"
									minHeight="460" minWidth="650" actionType="list"
									property="#{calendar.contract}">
								</aon:lookupButton>
								<aon:inputText id="Contract_full_name" rendered="#{calendar.new}"
									value="#{(calendar.contract.person.fullName!=null)?(calendar.contract.person.fullName):('')}"
									size="50" disabled="true" />							
							</aon:div>
								
								
<!--  
							<aon:outputLabel rendered="#{calendar.new}"
								value="#{calendarBundle.aon_calendar_entity}" />
							<aon:selectOneMenu id="calendarSource"
								rendered="#{calendar.new}"
								value="#{calendar.to.source}" >
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{calendarCollections.calendarSources}" />
							</aon:selectOneMenu>
-->							
							
							<aon:outputLabel value="#{bundle.aon_year}" />
							<rich:inputNumberSpinner value="#{calendar.year}" 
								inputSize="4" minValue="2010" maxValue="2100"
								enableManualInput="true" step="1"
								ignoreDupResponses="true"
								cycled="false"  style="width:5px;height:5px;" >
								<a4j:support event="onchange" reRender="tabPanel"
									actionListener="#{calendar.onChangeYear}"
									ignoreDupResponses="true" />
							</rich:inputNumberSpinner>
					
							<aon:outputLabel value="#{calendarBundle.aon_calendar_calendar}" />
							<aon:inputText id="Calendar_description" size="40" maxlength="32"
								value="#{calendar.to.description}"  />
							
							<aon:outputLabel
								value="#{calendarBundle.aon_calendar_anual_hours}" />
							<aon:inputText id="Calendar_anualHours" size="10" maxlength="6"
								value="#{calendar.to.anualHours}" />
								
							<aon:outputLabel for="Holiday_id"
								value="#{calendarBundle.aon_calendar_holiday}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Holiday_id"
									value="#{calendar.to.holiday.id}" size="5"
									lookup="#{holidayLookup}" reRender="Holiday_name" />
								<aon:lookupButton
									windowTitle="#{calendarBundle.aon_calendar_holiday}"
									minHeight="460" minWidth="650" property="#{calendar.to.holiday}"
									lookup="#{holidayLookup}"
									selectReRender="Holiday_id,Holiday_name"
									actionType="list">
								</aon:lookupButton>
								<aon:inputText id="Holiday_name"
									value="#{calendar.to.holiday.description}"
									disabled="true" size="60" />
							</aon:div>
							
							<aon:outputLabel value="#{bundle.aon_comment}" />
							<aon:inputTextarea id="Calendar_comments"
								value="#{calendar.to.comments}" cols="60" rows="5">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
						</aon:panelGrid>
					</aon:div>
					
					<aon:div styleClass="aon-scroll-area">
						<aon:panelGrid columns="2">
							<aon:outputLabel value="#{calendarBundle.aon_calendar_monday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.monday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.mondayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_tuesday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.tuesday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.tuesdayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_wednesday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.wednesday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.wednesdayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_thursday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.thursday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.thursdayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_friday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.friday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.fridayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_saturday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.saturday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.saturdayHours}" />
							</aon:div>
							<aon:outputLabel value="#{calendarBundle.aon_calendar_sunday}" />
							<aon:div>
								<aon:selectOneMenu value="#{calendar.to.sunday}">
									<f:selectItems value="#{calendarCollections.dayTypes}" />
								</aon:selectOneMenu>
								<aon:inputText size="1" maxlength="6"
									value="#{calendar.to.sundayHours}" />
							</aon:div>
						</aon:panelGrid>
					</aon:div>
					
					<aon:div styleClass="aon-scroll-area">
<!--  
-->					
						<c:if test="#{calendar.new}">
							<aon:panel style="height=80px"  width="100" 
								header="#{calendarBundle.aon_calendar_import_holidays}">
								<h:panelGrid columns="2">
								<aon:outputText value="#{calendarBundle.aon_calendar_import_national}" />
								<aon:selectBooleanCheckbox />
								<aon:outputText value="#{calendarBundle.aon_calendar_import_regional}" />
								<aon:selectBooleanCheckbox />
								<aon:outputText value="#{calendarBundle.aon_calendar_import_local}" />
								<aon:selectBooleanCheckbox />
								</h:panelGrid>
							</aon:panel>
						</c:if>
					</aon:div>
				</h:panelGrid>
				
				<c:if test="#{!calendar.new}">
					<aon:div>
						<aon:panelTabSet id="tabPanel">
							<aon:panelTab label="#{calendarBundle.aon_calendar_holidays}">
								<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendarHoliday/tab_grid.xhtml" />
							</aon:panelTab>
							<aon:panelTab label="#{calendarBundle.aon_calendar_period}">
								<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendarPeriod/tab_grid.xhtml" />
							</aon:panelTab>
						</aon:panelTabSet>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{holidayLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
<!--  
		<aon:lookupButtonPopup lookup="#{workplaceLookup}" />
-->		
		<aon:lookupButtonPopup lookup="#{contractLookup}" />
	</ui:define>
</ui:composition>
