<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="calendarForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.aon_calendar_festivities_module}" />
				<ui:param name="controller" value="#{holiday}" />
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">
					<aon:outputLabel value="#{bundle.aon_calendar_inherit_from}" />
					<ui:include src="/com/esferalia/aon/ui/calendar/facelet/holiday/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{holiday.to.holiday}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<ui:param name="skipGoToButton" value="#{true}" />
						<ui:param name="lookupControllerListener" value="#{holiday.excludeCurrentHoliday}" />
					</ui:include>

					<aon:outputLabel value="#{bundle.aon_year}" />
					<rich:inputNumberSpinner value="#{holiday.year}" 
						inputSize="4" minValue="2000" maxValue="2100"
						enableManualInput="true" step="1"
						ignoreDupResponses="true"
						cycled="false"  style="width:5px;height:5px;" >
						<a4j:support event="onchange" reRender="tabPanel"
							actionListener="#{holiday.onChangeYear}"
							ignoreDupResponses="true" />
					</rich:inputNumberSpinner>
					
					<aon:outputLabel value="#{bundle.aon_description}" />
					<aon:inputText id="Holiday_description" size="40" maxlength="32"
						value="#{holiday.to.description}" required="true" />
					
					<aon:outputLabel value="#{bundle.aon_calendar_editable}" />
					<aon:selectBooleanCheckbox value="#{holiday.to.editable}" />
				</aon:panelGrid>

				<c:if test="#{!holiday.new}">
					<aon:div>
						<aon:panelTabSet id="tabPanel">
							<aon:panelTab label="#{bundle.calendar_holidays}">
								<ui:include src="grid.xhtml" >
									<ui:param name="skipResetButton" value="#{!controller.editableTo}" />
								</ui:include>
							</aon:panelTab>
						</aon:panelTabSet>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{holidayLookup}" />
	</ui:define>
</ui:composition>
