<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="calendarForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{calendarBundle.aon_calendar_holiday}" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="controller" value="#{holiday}" />
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">
					<aon:outputLabel value="#{bundle.aon_description}" />
					<aon:inputText id="Holiday_description" size="40" maxlength="32"
						value="#{holiday.to.description}" required="true" />
					<aon:outputLabel value="#{bundle.aon_description}" />
					<aon:selectBooleanCheckbox value="#{holiday.to.editable}">
					</aon:selectBooleanCheckbox>

					<aon:outputLabel for="Holiday_id"
						value="#{calendarBundle.aon_calendar_holiday}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Holiday_id"
							value="#{holiday.to.holiday.id}" size="5"
							lookup="#{holidayLookup}" reRender="Holiday_name" />
						<aon:lookupButton
							windowTitle="#{calendarBundle.aon_calendar_holiday}"
							minHeight="460" minWidth="650" property="#{holiday.to.holiday}"
							lookup="#{holidayLookup}"
							selectReRender="Holiday_id,Holiday_name"
							actionType="list">
						</aon:lookupButton>
						<aon:inputText id="Holiday_name"
							value="#{holiday.to.holiday.description}"
							disabled="true" size="60" />
					</aon:div>
				</aon:panelGrid>

				<c:if test="#{!holiday.new}">
					<aon:div>
						<aon:panelTabSet>
							<aon:panelTab label="#{calendarBundle.aon_calendar_holidays}">
								<ui:include src="grid.xhtml" />
							</aon:panelTab>
						</aon:panelTabSet>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{holidayLookup}" />
	</ui:define>
</ui:composition>
