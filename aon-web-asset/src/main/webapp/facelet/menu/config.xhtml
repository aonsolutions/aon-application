<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">
		<aon:form id="configMenu">
			<aon:div styleClass="aon-scroll-area">		
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_config_company"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-company aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{companyBundle.company_menu_group}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="company" 
										action="company" actionListener="#{company.onLoad}"
										value="#{companyBundle.company_data_module}">
									</aon:commandLink>
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>
					
					<aon:panelGroup>
						<aon:panelGrid id="group_config_predefined"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-account-entry aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{assetBundle.predefined_menu_group}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="asset" 
										value="#{assetBundle.asset_asset_module}"
										action="asset_search"
										actionListener="#{asset.onEditSearch}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="assetActivity" 
										value="#{assetBundle.asset_activity_module}"
										action="activityDialog_grid" >
										<aon:actionListener method="#{activityDialog.onInitialize}" />
										<aon:actionListener method="#{activityBasic.initializePendingList}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="assetType" 
										value="#{assetBundle.asset_type_module}"
										action="assetType_search" >
										<aon:actionListener method="#{assetType.onEditSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="feature" 
										value="#{assetBundle.asset_feature_module}"
										action="feature_search" >
										<aon:actionListener method="#{feature.onEditSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="assetInterval" 
										value="#{assetBundle.asset_interval_module}"
										action="assetInterval_search" >
										<aon:actionListener method="#{assetInterval.onEditSearch}" />
									</aon:commandLink>
								</aon:div>
								
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_config_statistic"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-statistics aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_reports}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="assetStat"
										value="#{assetBundle.asset_statistic_main}"
										actionListener="#{assetStat.onInitialize}"
										action="stat_form" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
	
					</aon:panelGroup>	
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
