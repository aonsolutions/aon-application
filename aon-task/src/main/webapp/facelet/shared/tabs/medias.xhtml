<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:editDataTable id="#{dataTable}" value="#{controllerAlias.model}"
		var="to" rows="20"
		columnClasses="aon-editDataTable-iconColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-buttonsColumn">


		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton focus="mediaType_edit" 
				styleClass="aon-icon-commandButton aon-icon-rowSelector"
				actionListener="#{controllerAlias.onSelect}" />
			<f:facet name="footer">
				<aon:commandButton id="reset" value="" focus="mediaType_new"
					rendered="#{!controllerAlias.new}"
					actionListener="#{controllerAlias.onReset}"
					styleClass="aon-editDataTable-button aon-icon-new"
					accesskey="#{bundle.aon_key_new_line}">
				</aon:commandButton>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_media}" />
			</f:facet>
			<aon:outputText value="#{to.mediaType}"
				rendered="#{to!=controllerAlias.to}" />
			<aon:selectOneMenu id="mediaType_edit"
				value="#{controllerAlias.to.mediaType}"
				rendered="#{to==controllerAlias.to}">
				<f:selectItems value="#{registryCollections.mediaTypes}" />
			</aon:selectOneMenu>
			<f:facet name="footer">
				<aon:selectOneMenu id="mediaType_new"
					value="#{controllerAlias.to.mediaType}"
					rendered="#{controllerAlias.new}">
					<f:selectItems value="#{registryCollections.mediaTypes}" />
				</aon:selectOneMenu>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_value}" />
			</f:facet>
			<aon:outputText value="#{to.value}"
				rendered="#{to!=controllerAlias.to}" />
			<aon:inputText value="#{to.value}" styleClass="aon-form-input-text"
				rendered="#{to==controllerAlias.to}" required="#{true}" size="40" />
			<f:facet name="footer">
				<aon:div>
					<aon:outputLabel for="Media" value="#{registryBundle.aon_value}"
						rendered="#{false}" />
					<aon:inputText id="Media" value="#{controllerAlias.to.value}"
						rendered="#{controllerAlias.new}" required="#{true}" size="40" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_comment}" />
			</f:facet>
			<aon:outputText value="#{to.comment}"
				rendered="#{to!=controllerAlias.to}" />
			<aon:inputText value="#{controllerAlias.to.comment}"
				rendered="#{to==controllerAlias.to}" size="40" />
			<f:facet name="footer">
				<aon:inputText value="#{controllerAlias.to.comment}"
					rendered="#{controllerAlias.new}" size="40" />
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:div>
				<aon:outputText rendered="#{to!=controllerAlias.to}" value="&#160;" />
				<aon:commandButton title="#{bundle.aon_save}"
					onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;"
					rendered="#{to==controllerAlias.to}" value=""
					styleClass="aon-editDataTable-button aon-icon-accept"
					accesskey="#{bundle.aon_key_save_line}">
					<aon:actionListener method="#{controllerAlias.onAccept}" />
				</aon:commandButton>
				<aon:commandButton title="#{bundle.aon_cancel}"
					onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
					immediate="#{true}"
					styleClass="aon-editDataTable-button aon-icon-cancel" value=""
					rendered="#{to==controllerAlias.to}"
					accesskey="#{bundle.aon_key_cancel_line}">
					<aon:actionListener method="#{controllerAlias.onCancel}" />
				</aon:commandButton>
				<aon:commandButton title="#{bundle.aon_remove}"
					onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
					rendered="#{to==controllerAlias.to}"
					styleClass="aon-editDataTable-button aon-icon-delete" value=""
					accesskey="#{bundle.aon_key_remove_line}">
					<aon:actionListener method="#{controllerAlias.onRemove}" />
				</aon:commandButton>
			</aon:div>
			<f:facet name="footer">
				<aon:div>
					<aon:outputText rendered="#{!controllerAlias.new}" value="&#160;" />
					<aon:commandButton title="#{bundle.aon_save}"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;"
						rendered="#{controllerAlias.new}" value=""
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}">
						<aon:actionListener method="#{controllerAlias.onAccept}" />
					</aon:commandButton>
					<aon:commandButton title="#{bundle.aon_cancel}" immediate="#{true}"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
						rendered="#{controllerAlias.new}"
						styleClass="aon-editDataTable-button aon-icon-cancel" value=""
						accesskey="#{bundle.aon_key_cancel_line}">
						<aon:actionListener method="#{controllerAlias.onCancel}" />
					</aon:commandButton>
				</aon:div>
			</f:facet>
		</aon:column>
	</aon:editDataTable>

	<aon:dataScroller for="#{dataTable}"
		rowCount="#{controllerAlias.model.rowCount}" />

</ui:composition>
</body>
</html>
