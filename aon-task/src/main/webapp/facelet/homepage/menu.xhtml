<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

		<aon:panelGroup>
			<!-- main menu declaration  -->
			<aon:form>
				<aon:menuBar id="menu">
					<aon:dropDownMenu  id="auxiliary" value="#{menuBundle.aon_auxiliary}" submitMode="ajax" event="onclick" >
						<aon:menuItem id="dossier_type" value="#{menuBundle.aon_dossier_type}"
							action="dossier_type_list" 
							/>
					</aon:dropDownMenu>	
					<aon:dropDownMenu  id="master" value="#{menuBundle.aon_master}" submitMode="ajax" event="onclick" >
						<aon:menuItem id="customer" value="#{menuBundle.aon_customer}" 
							action="customer" actionListener="#{customer.onReset}" 
							/>
						<aon:menuItem id="task" value="#{menuBundle.aon_task}"
							action="task" actionListener="#{task.onTaskInbox}"
							 />
						<aon:menuItem id="task_monitor" value="#{menuBundle.aon_task_monitor}"
							action="task_monitor" actionListener="#{taskMonitor.onEditSearch}"
							/>
						<aon:menuItem id="period_task" value="#{menuBundle.aon_period_task}"
							action="period_task" actionListener="#{periodTask.onReset}"							
							 />
							</aon:dropDownMenu>
				</aon:menuBar>
			</aon:form>
		</aon:panelGroup>
	</ui:composition>

</body>
</html>
