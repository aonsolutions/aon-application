<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="dossierTypeForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_dossier_type}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{dossierType.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:confirmButton id="save" value="#{bundle.aon_save}"
							rendered="#{dossierType.to!=null or dossierType.new}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_save_confirm}"
							confirmActionListener="#{dossierType.accept}"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" reRender="activityTypeDataList"
							value="#{bundle.aon_cancel}"
							rendered="#{dossierType.to!=null or dossierType.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{dossierType.onCancel}"
							confirmAction="dossier_type_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!dossierType.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{dossierType.onRemove}"
							confirmAction="dossier_type_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="dossier_type_search"
							actionListener="#{dossierType.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{dossierType.onReset}"
							rendered="#{!dossierType.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							action="dossier_type_form" accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="DossierType_description"
						value="#{projectBundle.aon_description}" />
					<aon:inputText id="DossierType_description" required="true"
						size="60" maxlength="45" value="#{dossierType.to.description}" />

				</aon:panelGrid>


				<aon:div styleClass="aon-form-group" rendered="#{!dossierType.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:outputLabel for="activityTypeDataList"
							value="#{projectBundle.activity_activity_types}" />
					</aon:div>

					<aon:div styleClass="aon-form-group-body">
						<aon:editDataTable id="activityTypeDataList" var="to"
							value="#{activityType.model}" rows="20"
							columnClasses="aon-editDataTable-iconColumn,
									aon-editDataTable-textColumn,
									aon-editDataTable-buttonsColumn">

							<aon:rowSelector toggleOnClick="#{activityType.to == null}"
								actionListener="#{activityType.onSelect}" />

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:outputText value="&#160;" />
								<f:facet name="footer">
									<aon:div>
										<aon:commandButton alt="[#{bundle.aon_reset}]"
											styleClass="aon-editDataTable-button aon-icon-new"
											actionListener="#{activityType.onReset}" value=""
											rendered="#{!activityType.new}"
											accesskey="#{bundle.aon_key_new_line}" />
									</aon:div>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{projectBundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}"
									rendered="#{to!=activityType.to}" />
								<aon:inputText styleClass="aon-form-input-text " required="true"
									rendered="#{to==activityType.to}" size="60"
									value="#{activityType.to.description}" maxlength="45" />
								<f:facet name="footer">
									<aon:inputText styleClass="aon-form-input-text" required="true"
										rendered="#{activityType.new}" size="60"
										value="#{activityType.to.description}" maxlength="45" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:div>
									<aon:outputText rendered="#{to!=activityType.to}" value="&#160;" />
									<aon:commandButton title="#{bundle.aon_save}"
										actionListener="#{activityType.onAccept}"
										rendered="#{to==activityType.to}" value=""
										styleClass="aon-editDataTable-button aon-icon-accept"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:commandButton title="#{bundle.aon_cancel}"
										actionListener="#{activityType.onCancel}" immediate="#{true}"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										value="" rendered="#{to==activityType.to}"
										accesskey="#{bundle.aon_key_cancel_line}" />
									<aon:commandButton title="#{bundle.aon_remove}"
										actionListener="#{activityType.onRemove}"
										rendered="#{to==activityType.to}"
										styleClass="aon-editDataTable-button aon-icon-delete"
										value="" accesskey="#{bundle.aon_key_remove_line}" />
								</aon:div>
								<f:facet name="footer">
									<aon:div>
										<aon:outputText rendered="#{!activityType.new}" value="&#160;" />
										<aon:commandButton title="#{bundle.aon_save}"
											actionListener="#{activityType.onAccept}"
											rendered="#{activityType.new}" value=""
											styleClass="aon-editDataTable-button aon-icon-accept"
											accesskey="#{bundle.aon_key_save_line}" />
										<aon:commandButton title="#{bundle.aon_cancel}"
											actionListener="#{activityType.onCancel}" immediate="#{true}"
											rendered="#{activityType.new}"
											styleClass="aon-editDataTable-button aon-icon-cancel" 
											value="" accesskey="#{bundle.aon_key_cancel_line}" />
									</aon:div>
								</f:facet>
							</aon:column>
						</aon:editDataTable>
					</aon:div>
				</aon:div>

			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
