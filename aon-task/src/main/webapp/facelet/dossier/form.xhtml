<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition>

	<aon:div styleClass="aon-toolbar">
		<aon:confirmButton id="saveDossier" value="#{bundle.aon_save}"
			reRender="customerTab" rendered="#{dossier.to!=null or dossier.new}"
			styleClass="aon-finding-toolbar-item aon-icon-accept"
			confirmTitle="Confirmation Dialog"
			confirmMessage="#{bundle.aon_save_confirm}"
			confirmActionListener="#{dossier.accept}"
			accesskey="#{bundle.aon_key_save}" />
		<aon:confirmButton id="cancelDossier" value="#{bundle.aon_cancel}"
			reRender="customerTab" rendered="#{dossier.to!=null or dossier.new}"
			styleClass="aon-finding-toolbar-item aon-icon-cancel"
			immediate="#{true}" confirmTitle="Confirmation Dialog"
			confirmMessage="#{bundle.aon_cancel_confirm}"
			confirmActionListener="#{dossier.onCancel}"
			accesskey="#{bundle.aon_key_cancel}" />
		<aon:confirmButton id="removeDossier" value="#{bundle.aon_remove}"
			reRender="customerTab" rendered="#{!dossier.new}"
			styleClass="aon-finding-toolbar-item aon-icon-delete"
			immediate="true" confirmTitle="Confirmation Dialog"
			confirmMessage="#{bundle.aon_remove_confirm}"
			confirmActionListener="#{dossier.onRemove}"
			accesskey="#{bundle.aon_key_remove}" />
		<aon:commandButton id="resetDossier" value="#{bundle.aon_reset}"
			reRender="customerTab" actionListener="#{dossier.onReset}"
			rendered="#{!dossier.new}"
			styleClass="aon-finding-toolbar-item aon-icon-reset"
			accesskey="#{bundle.aon_key_new}" />
	</aon:div>


	<aon:panelGrid columns="8" dir="true" styleClass="aon-formTable"
		cellpadding="0" cellspacing="0"
		columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

		<aon:outputLabel for="Dossier_dossierType_id"
			value="#{projectBundle.aon_type}" />
		<aon:selectOneMenu id="Dossier_dossierType_id"
			value="#{dossier.to.dossierType.id}">
			<f:selectItems value="#{projectCollections.dossierTypes}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="Dossier_number"
			value="#{projectBundle.dossier_number}" />
		<aon:inputText id="Dossier_number" styleClass="aon-inputText"
			required="true" size="18" maxlength="15" value="#{dossier.to.number}" />

		<aon:outputLabel for="Dossier_location"
			value="#{projectBundle.dossier_location}" />
		<aon:inputText id="Dossier_location" styleClass="aon-inputText"
			size="25" maxlength="20" value="#{dossier.to.location}" />

		<aon:outputLabel for="Dossier_status"
			value="#{projectBundle.aon_status}" />
		<aon:selectOneMenu id="Dossier_status" value="#{dossier.to.status}">
			<f:selectItems value="#{projectCollections.dossierStatus}" />
		</aon:selectOneMenu>

	</aon:panelGrid>


	<aon:div styleClass="aon-form-group" rendered="#{!dossier.new}">
		<aon:div styleClass="aon-form-group-title">
			<aon:outputLabel for="activityDataList"
				value="#{projectBundle.activity_activities}" />
		</aon:div>

		<aon:div styleClass="aon-form-group-body">
			<aon:editDataTable id="activityDataList" var="to"
				value="#{activity.model}" rows="20"
				columnClasses="aon-editDataTable-iconColumn,
							aon-editDataTable-textColumn,
							aon-editDataTable-textColumn,
							aon-editDataTable-buttonsColumn">

				<aon:rowSelector toggleOnClick="#{activity.to == null}"
					actionListener="#{activity.onSelect}" />

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:outputText value="&#160;" />
					<f:facet name="footer">
						<aon:div>
							<aon:commandButton alt="[#{bundle.aon_reset}]"
								styleClass="aon-editDataTable-button aon-icon-new"
								actionListener="#{activity.onReset}" value=""
								rendered="#{!activity.new}"
								accesskey="#{bundle.aon_key_new_line}" />
						</aon:div>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{projectBundle.aon_type}" />
					</f:facet>
					<aon:outputText value="#{to.activityType.description}"
						rendered="#{to!=activity.to}" />
					<aon:selectOneMenu rendered="#{to==activity.to}"
						value="#{activity.to.activityType.id}">
						<f:selectItems value="#{dossier.activityTypes}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu rendered="#{activity.new}"
							value="#{activity.to.activityType.id}">
							<f:selectItems value="#{dossier.activityTypes}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{projectBundle.activity_assigned}" />
					</f:facet>
					<aon:outputText value="#{to.workgroup.description}"
						rendered="#{to!=activity.to}" />
					<aon:selectOneMenu rendered="#{to==activity.to}"
						value="#{activity.to.workgroup.id}">
						<f:selectItems value="#{configCollections.workgroups}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu rendered="#{activity.new}"
							value="#{activity.to.workgroup.id}">
							<f:selectItems value="#{configCollections.workgroups}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:div>
						<aon:outputText rendered="#{to!=activity.to}" value="&#160;" />
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{activity.onAccept}"
							rendered="#{to==activity.to}" value=""
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{activity.onCancel}" immediate="#{true}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							value="" rendered="#{to==activity.to}"
							accesskey="#{bundle.aon_key_cancel_line}" />
						<aon:commandButton title="#{bundle.aon_remove}"
							actionListener="#{activity.onRemove}"
							rendered="#{to==activity.to}"
							styleClass="aon-editDataTable-button aon-icon-delete"
							value="" accesskey="#{bundle.aon_key_remove_line}" />
					</aon:div>
					<f:facet name="footer">
						<aon:div>
							<aon:outputText rendered="#{!activity.new}" value="&#160;"/>
							<aon:commandButton title="#{bundle.aon_save}"
								actionListener="#{activity.onAccept}" rendered="#{activity.new}"
								styleClass="aon-editDataTable-button aon-icon-accept"
								value="" accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{activity.onCancel}" immediate="#{true}"
								rendered="#{activity.new}"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								value="" accesskey="#{bundle.aon_key_cancel_line}" />
						</aon:div>
					</f:facet>
				</aon:column>
			</aon:editDataTable>

		</aon:div>
	</aon:div>
</ui:composition>

</body>
</html>
