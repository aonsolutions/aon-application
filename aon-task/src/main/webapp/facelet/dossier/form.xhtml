<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition>

	<aon:div styleClass="aon-finding-title-toolbar">
		<aon:panelGrid columns="1" dir="true"
			columnClasses="aon-finding-toolbar">

			<aon:div styleClass="aon-finding-toolbar-item-group">

				<aon:commandButton id="saveDossier" value="#{bundle.aon_save}"
					reRender="customerTab"
					rendered="#{dossier.to!=null or dossier.new}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;"
					actionListener="#{dossier.accept}"
					accesskey="#{bundle.aon_key_save}" />
				<aon:commandButton id="cancelDossier" value="#{bundle.aon_cancel}"
					reRender="customerTab"
					rendered="#{dossier.to!=null or dossier.new}"
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					immediate="#{true}"
					onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
					actionListener="#{dossier.onCancel}"
					accesskey="#{bundle.aon_key_cancel}" />
				<aon:commandButton id="removeDossier" value="#{bundle.aon_remove}"
					reRender="customerTab" rendered="#{!dossier.new}"
					styleClass="aon-finding-toolbar-item aon-icon-delete"
					immediate="true"
					onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
					confirmMessage="#{bundle.aon_remove_confirm}"
					actionListener="#{dossier.onRemove}"
					accesskey="#{bundle.aon_key_remove}" />
				<aon:commandButton id="resetDossier" value="#{bundle.aon_reset}"
					reRender="customerTab" actionListener="#{dossier.onReset}"
					rendered="#{!dossier.new}"
					styleClass="aon-finding-toolbar-item aon-icon-reset"
					accesskey="#{bundle.aon_key_new}" />
				<aon:commandButton id="importDossier"
					value="#{projectBundle.dossier_import}" reRender="importContainer"
					actionListener="#{activitiesImporter.onShowImportPanel}"
					styleClass="aon-finding-toolbar-item aon-icon-mailReply" />
			</aon:div>
		</aon:panelGrid>
	</aon:div>
	<aon:div styleClass="aon-scroll-area">

		<aon:panelGrid columns="6" dir="true">

			<aon:outputLabel for="Dossier_dossierType_id"
				value="#{projectBundle.aon_type}" />
			<aon:selectOneMenu id="Dossier_dossierType_id"
				disabled="#{activity.model.rowCount > 0}"
				value="#{dossier.to.dossierType.id}">
				<f:selectItems value="#{projectCollections.dossierTypes}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="Dossier_number"
				value="#{projectBundle.dossier_number} / #{projectBundle.dossier_alias}" />
			<aon:inputText id="Dossier_number" required="true" size="18"
				maxlength="15" value="#{dossier.to.number}" />
			<!-- 
			<aon:outputLabel for="Dossier_location"
				value="#{projectBundle.dossier_location}" />
			<aon:inputText id="Dossier_location" size="25" maxlength="20"
				value="#{dossier.to.location}" />
 -->
			<aon:outputLabel for="Dossier_status"
				value="#{projectBundle.aon_status}" />
			<aon:selectOneMenu id="Dossier_status" value="#{dossier.to.status}">
				<f:selectItems value="#{projectCollections.dossierStatus}" />
			</aon:selectOneMenu>

		</aon:panelGrid>


		<aon:div styleClass="aon-group" rendered="#{!dossier.new}">
			<aon:div styleClass="aon-group-title">
				<aon:outputLabel for="activityDataList"
					value="#{projectBundle.activity_activities}" />
			</aon:div>

			<aon:div styleClass="aon-group-body">


				<aon:editDataTable id="activityDataList" var="to"
					value="#{activity.model}" rows="20"
					columnClasses="aon-editDataTable-iconColumn,
							aon-editDataTable-textColumn,
							aon-editDataTable-textColumn,
							aon-editDataTable-buttonsColumn">


					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandButton focus="type_edit" 
							styleClass="aon-icon-commandButton aon-icon-rowSelector"
							actionListener="#{activity.onSelect}" />
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton alt="[#{bundle.aon_reset}]"
									focus="type_new"
									styleClass="aon-editDataTable-button aon-icon-new"
									actionListener="#{activity.onReset}" value=""
									rendered="#{!activity.new}"
									accesskey="#{bundle.aon_key_new_line}" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{projectBundle.aon_type}" />
						</f:facet>
						<aon:outputText value="#{to.activityType.description}"
							rendered="#{to!=activity.to}" />
						<h:selectOneMenu
							id="type_edit"
							rendered="#{dossier.to.dossierType != null and to==activity.to}"
							value="#{activity.to.activityType.id}">
							<f:selectItems value="#{dossier.activityTypes}" />
						</h:selectOneMenu>
						<f:facet name="footer">
							<h:selectOneMenu id="type_new"
								rendered="#{dossier.to.dossierType != null and activity.new}"
								value="#{activity.to.activityType.id}">
								<f:selectItems value="#{dossier.activityTypes}" />
							</h:selectOneMenu>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{projectBundle.activity_assigned}" />
						</f:facet>
						<aon:outputText value="#{to.workgroup.description}"
							rendered="#{to!=activity.to}" />
						<aon:selectOneMenu rendered="#{to==activity.to}"
							value="#{activity.to.workgroup.id}">
							<f:selectItems value="#{configCollections.workgroups}" />
						</aon:selectOneMenu>
						<f:facet name="footer">
							<aon:selectOneMenu rendered="#{activity.new}"
								value="#{activity.to.workgroup.id}">
								<f:selectItems value="#{configCollections.workgroups}" />
							</aon:selectOneMenu>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:div>
							<aon:outputText rendered="#{to!=activity.to}" value="&#160;" />
							<aon:commandButton title="#{bundle.aon_save}"
								rendered="#{to==activity.to}" value=""
								styleClass="aon-editDataTable-button aon-icon-accept"
								onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;"
								accesskey="#{bundle.aon_key_save_line}">
								<aon:actionListener method="#{activity.onAccept}" />
							</aon:commandButton>
							<aon:commandButton title="#{bundle.aon_cancel}"
								immediate="#{true}"
								onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
								styleClass="aon-editDataTable-button aon-icon-cancel" value=""
								rendered="#{to==activity.to}"
								accesskey="#{bundle.aon_key_cancel_line}">
								<aon:actionListener method="#{activity.onCancel}" />
							</aon:commandButton>

							<aon:commandButton title="#{bundle.aon_remove}"
								rendered="#{to==activity.to}"
								onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
								styleClass="aon-editDataTable-button aon-icon-delete" value=""
								accesskey="#{bundle.aon_key_remove_line}"
								reRender="aonMessagesContainer">
								<aon:actionListener method="#{activity.onRemove}" />
							</aon:commandButton>
						</aon:div>
						<f:facet name="footer">
							<aon:div>
								<aon:outputText rendered="#{!activity.new}" value="&#160;" />
								<aon:commandButton title="#{bundle.aon_save}"
									onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;"
									rendered="#{activity.new}"
									styleClass="aon-editDataTable-button aon-icon-accept" value=""
									accesskey="#{bundle.aon_key_save_line}">
									<aon:actionListener method="#{activity.onAccept}" />
								</aon:commandButton>
								<aon:commandButton title="#{bundle.aon_cancel}"
									immediate="#{true}"
									onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
									rendered="#{activity.new}"
									styleClass="aon-editDataTable-button aon-icon-cancel" value=""
									accesskey="#{bundle.aon_key_cancel_line}">
									<aon:actionListener method="#{activity.onCancel}" />
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
				</aon:editDataTable>
			</aon:div>
		</aon:div>
	</aon:div>
</ui:composition>

</body>
</html>
