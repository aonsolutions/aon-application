<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="customerForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_daily_tracking}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandButton id="accept" value="#{bundle.aon_search}"
							actionListener="#{dailyTracking.onSearch}"
							action="daily_tracking_list"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
							actionListener="#{dailyTracking.onCancel}"
							action="daily_tracking_list"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}" />
						<h:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{dailyTracking.onReset}"
							action="daily_tracking_form"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />

						<aon:selectBooleanCheckbox id="monitor"
							value="#{dailyTracking.monitor}" rendered="#{role.monitorRole}">
							<a4j:support event="onclick"
								reRender="searchPanel"
								actionListener="#{dailyTracking.onSwicthMonitor}">
							</a4j:support>
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="monitor" value="Monitor"
							rendered="#{role.monitorRole}" />

					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:panelGrid id="searchPanel" columns="2">

						<aon:outputLabel for="user" rendered="#{dailyTracking.monitor}"
							value="#{projectBundle.aon_daily_tracking_user}" />
						<aon:selectOneMenu id="user"
							rendered="#{dailyTracking.monitor}"
							value="#{dailyTracking.userId}">
							<f:selectItem value="#{nullSelectItem.value}" />
							<f:selectItems value="#{dailyTracking.users}" />
						</aon:selectOneMenu>
	
						<aon:outputText value="#{projectBundle.aon_customer}" />
						<ui:include src="/facelet/shared/customer/customerIdInput.xhtml">
							<ui:param name="customer_id" value="customerId" />
							<ui:param name="renderedAttr" value="#{true}" />
							<ui:param name="disabled" value="false" />
							<ui:param name="reRenderAttr" value="none" />
							<ui:param name="required" value="#{false}" />
							<ui:param name="customerEntity" value="#{dailyTracking.customer}" />
							<ui:param name="customerELExpression"
								value="dailyTracking.customer" />
						</ui:include>

						<aon:outputLabel for="DailyTracking_trackingDate-From"
							value="#{projectBundle.aon_date_from}" />
						<aon:selectInputDate id="DailyTracking_trackingDate-From"
							value="#{dailyTracking.trackingDateFrom}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true" />

						<aon:outputLabel for="DailyTracking_trackingDate-To"
							value="#{projectBundle.aon_date_to}" />
						<aon:selectInputDate id="DailyTracking_trackingDate-To"
							value="#{dailyTracking.trackingDateTo}"
							popupDateFormat="#{bundle.aon_date_pattern}" renderAsPopup="true" />

						<aon:outputLabel for="DailyTracking_jobType_id"
							value="#{projectBundle.aon_daily_tracking_job_type}" />
						<aon:selectOneMenu id="DailyTracking_jobType_id"
							value="#{dailyTracking.trackingJobTypeId}">
							<f:selectItem value="#{nullSelectItem.value}" />
							<f:selectItems value="#{projectCollections.jobTypes}" />
						</aon:selectOneMenu>

					</aon:panelGrid>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
