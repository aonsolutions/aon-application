<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<rich:subTable var="tran" style="background:color: yellow;"
		rendered="#{(processDetail.to==null or processDetail.to==to) and (processDetailTransition.model.rowCount > 0 or processDetailTransition.new)}"
		value="#{processDetailTransition.model}">
		<aon:column>
			<h:outputText value="&#160;" />
		</aon:column>
		<aon:column styleClass="aon-editDataTable-iconColumn">
			<aon:commandButton immediate="true" reRender="detailContainer"
				focus="type_upd"
				rendered="#{processDetail.to == to and processDetailTransition.to != tran}"
				styleClass="aon-icon-commandButton aon-icon-process-transition-selection"
				actionListener="#{processDetailTransition.onSelect}">
			</aon:commandButton>
		</aon:column>
		<aon:column styleClass="aon-editDataTable-textColumn">
			<h:outputText value="#{tran.processTransitionType.description}"
				rendered="#{processDetailTransition.to != tran}" />
			<aon:selectOneMenu id="type_upd" 
				value="#{processDetailTransition.to.processTransitionType}"
				rendered="#{processDetailTransition.to == tran}" required="#{true}">
				<f:selectItems value="#{campaignCollections.processTransitionTypes}" />
			</aon:selectOneMenu>

			<f:facet name="footer">
				<aon:selectOneMenu id="type_new"
					value="#{processDetailTransition.to.processTransitionType}"
					rendered="#{processDetailTransition.new}" required="#{true}">
					<f:selectItems
						value="#{campaignCollections.processTransitionTypes}" />
				</aon:selectOneMenu>
			</f:facet>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn" colspan="3">
			<h:outputText value="#{tran.nextProcessDetail.description}"
				rendered="#{processDetailTransition.to != tran}" />
			<aon:selectOneMenu id="next_upd" value="#{processDetailTransition.to.nextProcessDetail}"
				rendered="#{processDetailTransition.to == tran}" required="#{true}">
				<f:selectItems
					value="#{processDetailTransition.availableProcessDetails}" />
			</aon:selectOneMenu>
			<f:facet name="footer">
				<aon:selectOneMenu id="next_new"
					value="#{processDetailTransition.to.nextProcessDetail}"
					rendered="#{processDetailTransition.new}" required="#{true}">
					<f:selectItems
						value="#{processDetailTransition.availableProcessDetails}" />
				</aon:selectOneMenu>
			</f:facet>
		</aon:column>

		<aon:column>
			<aon:div>
				<aon:commandButton title="#{bundle.aon_save}"
					rendered="#{tran==processDetailTransition.to}"
					actionListener="#{processDetailTransition.onAccept}"
					onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
					styleClass="aon-editDataTable-button aon-icon-accept" value=""
					accesskey="#{bundle.aon_key_save_line}">
				</aon:commandButton>
				<aon:commandButton title="#{bundle.aon_cancel}"
					rendered="#{tran==processDetailTransition.to}"
					actionListener="#{processDetailTransition.onCancel}"
					immediate="true"
					onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
					styleClass="aon-editDataTable-button aon-icon-cancel" value=""
					accesskey="#{bundle.aon_key_cancel_line}">
				</aon:commandButton>
				<aon:commandButton title="#{bundle.aon_remove}"
					rendered="#{tran==processDetailTransition.to}"
					actionListener="#{processDetailTransition.onRemove}"
					immediate="true"
					onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
					styleClass="aon-editDataTable-button aon-icon-delete" value=""
					accesskey="#{bundle.aon_key_remove_line}">
				</aon:commandButton>
			</aon:div>
			<f:facet name="footer">
				<aon:div>
					<aon:div rendered="#{processDetailTransition.new}">
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{processDetailTransition.onAccept}"
							onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
							styleClass="aon-editDataTable-button aon-icon-accept" value=""
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{processDetailTransition.onCancel}"
							immediate="true"
							onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
							styleClass="aon-editDataTable-button aon-icon-cancel" value=""
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</aon:div>
			</f:facet>
		</aon:column>
		<aon:column>
			<h:outputText value="&#160;" />
		</aon:column>
	</rich:subTable>

</ui:composition>
