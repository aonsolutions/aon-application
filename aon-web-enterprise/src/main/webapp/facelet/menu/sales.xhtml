<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="salesMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column,aon-portlets-column">
	
					<aon:panel>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div>
								<aon:commandLink id="offer_form" 
									action="offer_form" actionListener="#{offer.onReset}"
									value="#{commercialBundle.commercial_offer_module}" />
							</aon:div>
							<aon:div>
								<aon:commandLink id="sales" 
									action="sales_form" actionListener="#{sales.onReset}"
									value="#{salesBundle.sales_module}" />
							</aon:div>
							<aon:div>
								<aon:commandLink id="delivery" 
									action="delivery_form" actionListener="#{delivery.onReset}"
									value="#{warehouseBundle.warehouse_delivery_module}" />
							</aon:div>
						</aon:div>
					</aon:panel>
	
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.menu_reports}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Ventas Anuales" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Ventas Mensuales" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Por Segmento Cliente y Cliente" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Por Categoría y Articulo" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Comparativa Periodos" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Resumen 12 + 1" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="ABC" />
							</aon:div>
						</aon:div>
					</aon:panel>

					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.menu_invoices}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div>
								<aon:commandLink id="aon_invoice_management" 
									action="saleInvoice_search" actionListener="#{saleInvoice.onEditSearch}"
									value="#{financeBundle.finance_sale_invoice_management_module}" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Impresión de Facturas" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Proceso Facturación" />
							</aon:div>
						</aon:div>
					</aon:panel>
					
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.menu_utilities}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Borrado Masivo" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Contabilización Masiva" />
							</aon:div>
						</aon:div>
					</aon:panel>
					
				</aon:panelGrid>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
