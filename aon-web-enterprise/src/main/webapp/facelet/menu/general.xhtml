<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<c:if test="#{aonRole.productOperator or aonRole.config}">
	
		<aon:methodParam name="general_item_search" value="item_search-#{category}" resolve="true" />	
		<aon:methodParam name="general_productCategory" value="productCategory-#{category}" resolve="true" />
		<aon:methodParam name="general_brand" value="brand-#{category}" resolve="true" />
		<aon:methodParam name="general_segment_form" value="segment_form-#{category}" resolve="true" />
		<aon:methodParam name="general_geotreeParent_list" value="geotreeParent_list-#{category}" resolve="true" />
	
		<aon:panelGrid id="group_general_#{category}"
			styleClass="aon-width-all" columnClasses="aon-padding"
			headerClass="aon-icon-general aon-direct-access-panel">
			<f:facet name="header">
				<aon:outputText value="#{appBundle.menu_general}" />
			</f:facet>
			<aon:div styleClass="aon-direct-access-list">
				<c:if test="#{aonRole.productOperator}">
					<aon:div styleClass="aon-direct-access-list-element">
						<aon:commandLink id="item_search-#{category}" 
							action="#{general_item_search}" actionListener="#{item.onEditSearch}"
							value="#{productBundle.product_module}" />
					</aon:div>
				</c:if>
				<c:if test="#{aonRole.config}">
					<aon:div styleClass="aon-direct-access-list-element">
						<aon:commandLink id="productCategory-#{category}" 
							action="#{general_productCategory}"
							value="#{productBundle.product_category_module}" />
					</aon:div>
					<aon:div styleClass="aon-direct-access-list-element">
						<aon:commandLink id="brand-#{category}"
							action="#{general_brand}"
							value="#{productBundle.product_brand_module}" />
					</aon:div>
					<aon:div styleClass="aon-direct-access-list-element">
						<aon:commandLink id="segment_form-#{category}" 
							action="#{general_segment_form}" 
							value="#{registryBundle.registry_segment_module}" />
					</aon:div>
					<aon:div styleClass="aon-direct-access-list-element">
						<aon:commandLink id="geotreeParent_list-#{category}" 
							action="#{general_geotreeParent_list}" actionListener="#{geotreeParent.onSearch}"
							value="#{geozoneBundle.geozone_module}" />
					</aon:div>
				</c:if>
			</aon:div>
		</aon:panelGrid>
	</c:if>

</ui:composition>
