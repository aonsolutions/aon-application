<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="commercialMenu">
		
			<aon:div styleClass="aon-scroll-area">
			
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">
					
					<aon:panelGrid columns="1" styleClass="aon-panelGrid-formatting"
						columnClasses="aon-portlets-column">
	
						<aon:panelGroup>
							<aon:panel headerClass="aon-panel-title">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_commercial}"/>
								</f:facet>						
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="target" 
											action="target_search" actionListener="#{target.onEditSearch}"
											value="#{commercialBundle.commercial_target_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="offer" 
											action="offer_search" actionListener="#{offer.onEditSearch}"
											value="#{commercialBundle.commercial_offer_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="seller" 
											action="seller_search" actionListener="#{seller.onEditSearch}"
											value="#{salesBundle.sales_seller_module}" />
									</aon:div>
								</aon:div>
							</aon:panel>
							
						</aon:panelGroup>
						
					</aon:panelGrid>
					
				</aon:componentGroup>

			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
