<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="aonHeader" styleClass="aon-header">
		<aon:panelGrid columns="2" width="100%"
			columnClasses="aon-header-name,aon-header-info">
			<aon:div style="margin-top: 15px">
				<aon:outputConnectionStatus id="aonStatus" layout="block"
					startStyleClass="aon-outputConnectionStatus-start"
					stopStyleClass="aon-outputConnectionStatus-stop"
					onstart="resetStatusError();" />
				<aon:div id="status_error" style="display: none"
					styleClass="aon-outputConnectionStatus-failed" />
				<aon:outputText value=" / #{appBundle.aon_application_title}"
					styleClass="aon-header-title" />
			</aon:div>

			<aon:div styleClass="aon-nowrap"
				style="border-left:1px solid #ccc;color:#999;">
				<aon:outputText value="#{loggedUser.companyName}"
					styleClass="aon-margin-left" />
				<aon:outputText value=" / " />
				<aon:outputText value="#{loggedUser.loggedUserName}"
					styleClass="aon-bold" />
			</aon:div>
		</aon:panelGrid>

		<aon:form>
			<aon:div styleClass="aon-header-additionalInfo">
				<c:if test="#{!aonConfiguration.properties.hideHeaderLinks}">
					<aon:div styleClass="aon-float-right">
						<aon:div styleClass="aon-header-menu-item">
							<h:outputLink target="_top"
								value="${facesContext.externalContext.requestContextPath}">
								<h:outputText value="#{bundle.aon_home}" />
							</h:outputLink>
							<aon:commandLink style="border-right:0;" action="logout"
								actionListener="#{aonConfiguration.logout}">
								<aon:outputText value="#{securityBundle.aon_login_user_logout}" />
							</aon:commandLink>
						</aon:div>
					</aon:div>
				</c:if>
				<aon:outputFormat value="#{bundle.aon_version}"
					styleClass="aon-applicationName" style="font-size:0.9em;margin-top:0.1em;"
					rendered="#{aonConfiguration.applicationVersion != null}" >
					<f:param value="#{aonConfiguration.applicationVersion}" />
				</aon:outputFormat>
			</aon:div>
		</aon:form>
	</aon:div>
</ui:composition>
