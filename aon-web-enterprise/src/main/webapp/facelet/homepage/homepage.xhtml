<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:div id="aon-scroll-area">
		<aon:form>
			<h:panelGrid styleClass="aon-width-all aon-height-all"
				columnClasses="#{companyDisplay.show?'aon-width-300,':''} aon-width-auto" columns="2">
				<c:if test="#{companyDisplay.show}">
					<ui:include src="/com/code/aon/ui/company/facelet/companyDisplay/info.xhtml" />
				</c:if>
				<h:panelGrid columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-auto" styleClass="aon-width-all" columns="2">
					<aon:panelGroup>
						<aon:dynamicInclude src="#{actionFavorite.template}" />
					</aon:panelGroup>
					<aon:panelGroup> 
						<aon:dynamicInclude src="#{actionFavorite.lastExecutedsTemplate}" />
					 </aon:panelGroup>				
				</h:panelGrid>
			</h:panelGrid>
		</aon:form>		
	</aon:div>
</ui:composition>
