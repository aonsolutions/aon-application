# REPORT
aon_footer_text_1=Los trabajos se abonarán al contado (a la entrega del vehículo). Esta reparación tiene tres meses de garantía o 2.000 Kms., a partir de la fecha de entrega. En las reparaciones dentro del periodo de garantía, el cliente pagará las piezas, como se especifica en el libro de garantía.
aon_footer_text_2=, no se hace responsable de los objetos depositados en el vehículo.
aon_legal_text_1=Mediante la cumplimentación voluntaria de este formulario, los datos de carácter personal que usted nos proporciona pasarán a formar parte de un fichero propiedad de
aon_legal_text_2=, previamente notificado a la Agencia de Protección de Datos y que cuenta con las medidas de seguridad necesarias para garantizar la seguridad de los datos así como para evitar la alteración, pérdida, tratamiento o acceso no autorizado a los mismos. El usuario podrá ejercer los derechos de acceso, cancelación, rectificación y oposición que expresamente reconoce la L.O.P.D. Para el ejercicio de estos derechos, el usuario deberá dirigir una solicitud escrita a
aon_legal_text_3=con los siguientes datos\: nombre y apellidos, domicilio a efectos de notificaciones, fotocopia del DNI o pasaporte, petici\u00F3n en que se concreta la solicitud, fecha y firma del interesado.