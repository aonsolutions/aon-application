<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="campaignList">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid columns="3" dir="true" 
			columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{menuBundle.gbp_campaign}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{appBundle.gbp_listing}" />
				</aon:div>					
					
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="campaign_form" actionListener="#{campaign.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}"/>
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						action="campaign_search" actionListener="#{campaign.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}"/>
					<t:commandButton id="campaigns" value="#{appBundle.gbp_print}"
						immediate="true" forceId="true" 
						onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.jsf');return false;"
						styleClass="aon-finding-toolbar-item aon-icon-printer"
						accesskey="#{bundle.aon_key_print}" />
			    </aon:div>
				
				<!-- end toolbar navigation -->
			</aon:panelGrid>
		</aon:div>
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">					
			<aon:dataTable id="campaignDataList" 
				value="#{campaign.model}" var="to" rows="20"
				columnClasses="aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left,
							   aon-width-auto aon-text-left">
					<aon:rowSelector action="campaign_form" actionListener="#{campaign.onSelect}" />
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_campaign_code}" />
						</f:facet>
						<aon:outputText value="#{to.code}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_campaign_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_campaign_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_campaign_start_date}" />
						</f:facet>
						<aon:outputText value="#{to.startDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_campaign_budget}" />
						</f:facet>
						<aon:outputText value="#{to.budget}"/>
					</aon:column>

				</aon:dataTable>
						
				<aon:dataScroller dataTable="campaignDataList"
					model="#{campaign.model}" showNote="true" />					
				
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
