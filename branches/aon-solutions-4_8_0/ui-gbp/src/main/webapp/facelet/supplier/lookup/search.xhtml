<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>
	<aon:panelGrid columns="2" dir="true">

		<aon:outputLabel for="Supplier_document"
			value="#{appBundle.gbp_supplier_document}" />
		<aon:inputText id="Supplier_document" size="16" maxlength="16"
			valueChangeListener="#{lookup.addExpression}" />

		<aon:outputLabel for="Supplier_name"
			value="#{appBundle.gbp_supplier_name}" />
		<aon:inputText id="Supplier_name" size="40" maxlength="64"
			valueChangeListener="#{lookup.addExpression}" />

	</aon:panelGrid>
</ui:composition>

</body>
</html>
