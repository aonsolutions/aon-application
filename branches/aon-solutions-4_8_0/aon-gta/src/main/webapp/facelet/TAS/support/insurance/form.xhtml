<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="supportOrderInsuranceForm">
		
			<t:div id="aon-content-menu" styleClass="aon-content-menu-aux"
				forceId="#{true}" style="margin-left:16px;margin-right:16px;">
				<h:outputText
					value="#{SupportOrder.to.series} / #{SupportOrder.to.number}: #{SupportOrder.to.tasItem.publicCode} / #{SupportOrder.to.tasItem.model.make.name} #{SupportOrder.to.tasItem.model.name}" />
			</t:div>

			<t:div styleClass="aon-content-menu" rendered="#{!SupportOrder.new}" id="aon-content-menu" forceId="#{true}">
				<t:panelGrid columns="7" cellpadding="0" cellspacing="0" border="0">
					<t:panelGroup>						
						<t:commandLink id="support_order_data" value="#{tasBundle.supportOrder_data}"
							action="SupportOrder_form" actionListener="#{SupportOrder.reloadMedias}"
							forceId="#{true}" styleClass="aon-content-menu-item" />					
					</t:panelGroup>	
					<t:panelGroup>						
						<t:commandLink id="support_order_customer_data" forceId="#{true}" value="#{tasBundle.supportOrder_customer_data}"
							actionListener="#{supportOrderTarget.onTarget}" action="supportOrder_customer_data" 
							styleClass="aon-content-menu-item"/>						
					</t:panelGroup>	
					<t:panelGroup>			
						<t:commandLink id="support_order_insurance_data" forceId="#{true}" 
							value="#{tasBundle.supportOrder_insurance_data}"
							styleClass="aon-content-menu-item-active" />						
					</t:panelGroup>
				</t:panelGrid>
			</t:div>

			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" actionListener="#{supportOrderInsurance.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							disabled="#{!SupportOrder.pending}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							accesskey="#{bundle.aon_key_save}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">

					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="Customer_Lookup_id"
							styleClass="aon-form-input-text-label"
							value="#{tasBundle.supportOrder_insurance_insurance}" />
						<h:panelGroup>
							<t:inputText id="Customer_Lookup_id" size="5" forceId="#{true}"
								styleClass="aon-form-input-text"
								disabled="#{!SupportOrder.pending}"
								onchange="return findBeanLookupAndSubmitExt(this.form, event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');"
								value="#{supportOrderInsurance.to.insurance.id}"
								valueChangeListener="#{supportOrderInsurance.customerData}" />
							<h:commandButton id="find_Customer_Lookup_id"
								disabled="#{!SupportOrder.pending}"
								onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');return false;"	
								value="" immediate="true" styleClass="aon-form-lookup-button"/>
							<t:inputText id="Customer_full_name" forceId="#{true}"
								styleClass="aon-form-input-text" disabled="#{true}" size="64"
								value="#{supportOrderInsurance.to.insurance.registry.name} #{supportOrderInsurance.to.insurance.registry.surname}" />
						</h:panelGroup>

						<h:outputLabel for="SupportOrderInsurance_appraiser_id"
							styleClass="aon-form-input-text-label"
							value="#{tasBundle.supportOrder_insurance_appraiser}" />
						<t:selectOneMenu id="SupportOrderInsurance_appraiser_id"
							value="#{supportOrderInsurance.to.appraiser.id}"
							disabled="#{!SupportOrder.pending}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItem itemValue="" itemDisabled="true" itemLabel="-" />
							<f:selectItems value="#{TASCollections.appraisers}" />
						</t:selectOneMenu>

						<t:outputLabel for="SupportOrderInsurance_claimNumber"
							styleClass="aon-form-input-text-label"
							value="#{tasBundle.supportOrder_insurance_claim_number}" />
						<t:inputText id="SupportOrderInsurance_claimNumber"
							disabled="#{!SupportOrder.pending}"
							styleClass="aon-form-input-text" forceId="#{true}"
							value="#{supportOrderInsurance.to.claimNumber}" size="32" maxlength="32"/>

						<t:outputLabel for="SupportOrderInsurance_policiType"
							styleClass="aon-form-input-text-label"
							value="#{tasBundle.supportOrder_insurance_policy_type}" />
						<t:inputText id="SupportOrderInsurance_policiType"
							disabled="#{!SupportOrder.pending}"
							styleClass="aon-form-input-text" forceId="#{true}"
							value="#{supportOrderInsurance.to.policiType}" size="32" maxlength="32"/>

						<t:outputLabel for="SupportOrderInsurance_franchise"
							styleClass="aon-form-input-text-label"
							value="#{tasBundle.supportOrder_insurance_franchise}" />
						<t:inputText id="SupportOrderInsurance_franchise"
							disabled="#{!SupportOrder.pending}"
							styleClass="aon-form-input-text" forceId="#{true}"
							value="#{supportOrderInsurance.to.franchise}" size="32" maxlength="32"/>

					</h:panelGrid>

				</t:div>
			</t:div>

		</h:form>

		<h:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
