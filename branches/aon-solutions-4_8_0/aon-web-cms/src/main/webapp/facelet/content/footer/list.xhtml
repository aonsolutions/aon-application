<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="footerList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.footer}" />
				<ui:param name="controller" value="#{footer}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="home"
						value="#{bundle.aon_home}"
						action="home" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable id="dataTable" value="#{footer.model}" var="to"
					rows="#{footer.pageLimit}" rendered="#{footer.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-iconColumn">
							
					<aon:rowSelector
						action="footer_form" actionListener="#{footer.onSelect}" />							
							
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText for="Footer_defaultMenu" 
								value="#{appBundle.menu_defaultMenu}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >																					
							<aon:selectBooleanCheckbox id="Footer_defaultMenu" 
								value="#{to.default_}" rendered="#{!to.default_}">
								<a4j:support 
									actionListener="#{footer.defaultChanged}"
									event="onclick"  
									reRender="dataTable" />
							</aon:selectBooleanCheckbox>
						</aon:div>
						<aon:graphicImage id="Footer_default_blocked" 
							rendered="#{to.default_}"
							url="#{aonResource.resolveLocal['/images/cms/selected.gif']}" 
							alt="#{appBundle.menu_blocked}"/>
					</aon:column>
					
				</aon:dataTable>
					
				<aon:dataScroller2 for="dataTable" showNote="true" />
					
			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
