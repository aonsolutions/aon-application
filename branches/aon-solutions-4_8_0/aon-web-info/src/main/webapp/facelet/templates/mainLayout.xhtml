<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:c="http://java.sun.com/jstl/core"			
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
<f:view>
<c:forEach items="#{aonConfiguration.applicationBundleList}" var="appBundle">
	<f:loadBundle basename="#{appBundle.value}" var="#{appBundle.key}" />
</c:forEach>
<head>
	<title><ui:insert name="title">Title</ui:insert></title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="Expires" content="0" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Cache-Control" content="no-store" />

	<c:forEach items="#{aonConfiguration.styleSheets}" var="styleSheet">
		<link href="#{facesContext.externalContext.requestContextPath}#{styleSheet}" rel="stylesheet" type="text/css"></link>
	</c:forEach>
	<link rel="shortcut icon" type="image/x-icon" href="#{facesContext.externalContext.requestContextPath}/favicon.ico" />
	
	<a4j:loadScript src="/js/Window.js"/>
	<a4j:loadScript src="/fckfaces/FCKeditor/fckeditor.js"/>
	<a4j:loadScript src="/js/colorpicker.js"/>
	<ui:insert name="head" />
</head>
<body class="aon-body" >
	<aon:div id="aon-content">		
		<ui:insert name="mainHeader" />
		<ui:include src="/facelet/homepage/messages.xhtml" />
		<ui:insert name="content" />	
	</aon:div>
</body>
</f:view>
</html>
