<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="linpercepcionData"
			value="#{linpercepcion.model}" var="to" rows="0"
			rendered="#{!percepcion.new}"
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				, aon-editDataTable-numberColumn, 
				, aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{linpercepcion.to == null}"
				actionListener="#{linpercepcion.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{linpercepcion.onReset}" value=""
							rendered="#{!linpercepcion.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>

				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_inicio}" />
				</f:facet>
				<aon:outputText value="#{to.id.fecini}"
					rendered="#{to!=linpercepcion.to}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="FachaInicio" value="#{linpercepcion.to.id.fecini}"
					inputSize="10" rendered="#{to==linpercepcion.to}" required="#{true}"
					disabled="#{to==linpercepcion.to}" renderAsPopup="true"
					popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate id="FachaInicioNew" value="#{linpercepcion.to.id.fecini}"
						rendered="#{linpercepcion.new}" inputSize="10" required="#{true}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_fin}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}"
					rendered="#{to!=linpercepcion.to}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="FachaFin" value="#{linpercepcion.to.fecfin}"
					rendered="#{to==linpercepcion.to}" inputSize="10"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate id="FachaFinNew" value="#{linpercepcion.to.fecfin}"
						rendered="#{linpercepcion.new}" inputSize="10"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_kartel_percepcion_salario}" />
				</f:facet>
				<aon:outputText value="#{to.importe}"
					rendered="#{to!=linpercepcion.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>

				<aon:inputText styleClass="aon-form-input-text " 
					rendered="#{to==linpercepcion.to}" size="5"
					value="#{linpercepcion.to.importe}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" 
						rendered="#{linpercepcion.new}" size="5"
						value="#{linpercepcion.to.importe}" maxlength="10" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_kartel_percepcion_comp_empresa}" />
				</f:facet>
				<aon:outputText value="#{to.empresa}"
					rendered="#{to!=linpercepcion.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text " 
					rendered="#{to==linpercepcion.to}" size="5"
					value="#{linpercepcion.to.empresa}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" 
						rendered="#{linpercepcion.new}" size="5"
						value="#{linpercepcion.to.empresa}" maxlength="10" />
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_avanzadas_kartel_percepcion_comp_nocturno}" />
				</f:facet>
				<aon:outputText value="#{to.nocturno}"
					rendered="#{to!=linpercepcion.to}">
					<f:convertNumber type="number" minFractionDigits="2"
						pattern="###,###.###" />
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text " 
					rendered="#{to==linpercepcion.to}" size="5"
					value="#{linpercepcion.to.nocturno}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" 
						rendered="#{linpercepcion.new}" size="5"
						value="#{linpercepcion.to.nocturno}" maxlength="10" />
				</f:facet>
			</aon:column>


			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=linpercepcion.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]"
						rendered="#{to==linpercepcion.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{linpercepcion.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==linpercepcion.to}"
						actionListener="#{linpercepcion.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje"
						title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==linpercepcion.to}"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{linpercepcion.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!linpercepcion.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]"
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{linpercepcion.new}"
							actionListener="#{linpercepcion.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje"
							title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{linpercepcion.new}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{linpercepcion.onCancel}"
							immediate="true" accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

		</aon:editDataTable>
	</aon:div>

</ui:composition>
