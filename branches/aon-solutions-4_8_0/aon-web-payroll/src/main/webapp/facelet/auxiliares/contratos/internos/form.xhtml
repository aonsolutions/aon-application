<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="contratosInternosForm">
			
			<ui:include src="/facelet/templates/formPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_contratos__tipocont}" />				
				<ui:param name="controller" value="#{contratosInternos}" />
				<ui:param name="reportKey" value="contratosInternosListPrint"/>
			</ui:include>

			<aon:div id="contratosInternos" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel for="codigo" value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="codigo" value="#{contratosInternos.to.cdg}" disabled="#{!contratosInternos.new}" 
						required="true" size="2" maxlength="2" />
				
					<aon:outputLabel for="descripcion" value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="descripcion" value="#{contratosInternos.to.description}" 
						required="true" size="90" maxlength="60" >
					</aon:inputText>

					<aon:outputLabel for="asimilado" value="#{appBundle.aon_payroll_asimiladoa}" />
					<aon:selectOneMenu id="asimilado"
						value="#{contratosInternos.to.porcentajeMaestro.cdg}">
						<f:selectItems value="#{contratosInternos.asimilados}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="desempleados" value="#{appBundle.aon_payroll_desempleado}" />
					<aon:selectOneMenu id="desempleados" 
						value="#{contratosInternos.to.desemple}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{contratosInternos.desempleados}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="contratosInternos_porcentaje_edit" value="#{appBundle.aon_payroll_minusvalia}" />
					<aon:inputText id="contratosInternos_porcentaje_edit" value="#{contratosInternos.to.gradomin}" size="1" maxlength="2" >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText>
					<aon:outputLabel value="" />
					<aon:panelGroup>
						<aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{contratosInternos.to.mujersub}" />
								<aon:outputLabel value="#{appBundle.aon_payroll_mujersub}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{contratosInternos.to.incaread}" />
								<aon:outputLabel value="#{appBundle.aon_payroll_incaread}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{contratosInternos.to.primertra}" />
								<aon:outputLabel value="#{appBundle.aon_payroll_primertra}" />
							</aon:div>
							<aon:div>
								<aon:selectBooleanCheckbox value="#{contratosInternos.to.excsocial}" />
								<aon:outputLabel value="#{appBundle.aon_payroll_excsocial}" />
							</aon:div>
						</aon:div>
					</aon:panelGroup>
				</aon:panelGrid>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
