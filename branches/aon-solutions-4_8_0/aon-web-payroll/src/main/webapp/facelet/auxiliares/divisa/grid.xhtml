<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="divisaData" value="#{divisa.model}" 
			var="to" rows="0"
		
			columnClasses="aon-editDataTable-iconColumn
				,  aon-editDataTable-numberColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-dateColumn,aon-editDataTable-dateColumn, aon-editDataTable-numberColumn
				, aon-editDataTable-numberColumn
				,aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{divisa.to == null}" actionListener="#{divisa.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{divisa.onReset}" value=""
							rendered="#{!divisa.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
					
				</f:facet>
			</aon:column>


			  <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_divisa_divdest}" />
				</f:facet>
			    	<aon:outputText value="#{to.divisa0.cdg}"   />	  
					   					
				  <f:facet name="footer">				
						<aon:lookupInputText id="Divisa1_cdg"
							lookup="#{divisaLookup}"
							reRender="Divisa1_description" rendered="#{divisa.new}"
							value="#{divisa.to.divisa0.cdg}" size="5">
						</aon:lookupInputText>	
						
				</f:facet>
				 </aon:column>
				 
				 
				    <aon:column rendered="#{divisa.new}" >							
			    	<f:facet name="footer">				
							<aon:lookupButton id="Divisa1_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_tipos__tipovia}"
							selectReRender="Divisa1_cdg,Divisa1_description" rendered="#{divisa.new}"
							lookup="#{divisaLookup}" minHeight="440"
							property="#{divisa.to.divisa0}">
						</aon:lookupButton>						
			      	</f:facet>
		        	</aon:column>
		        					 
	            <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_divisa_destdec}" />
				</f:facet>
			<aon:outputText value="#{to.divisa0.description}" />	  	
										
			    	<f:facet name="footer">
				
						<aon:inputText id="Divisa1_description" rendered="#{divisa.new}"
							value="#{(divisa.to.divisa0.description!=null)?(divisa.to.divisa0.description):('')}"
							size="34" disabled="true" />
								
						
			      	</f:facet>
		     	</aon:column>

         
            <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_divisa_fecini}" />
				</f:facet>
				<aon:outputText value="#{to.id.fecini}" rendered="#{to!=divisa.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{divisa.to.id.fecini}" disabled="true" 
					rendered="#{to==divisa.to}" 
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{divisa.to.id.fecini}"
						rendered="#{divisa.new}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>
			
			
		<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_divisa_fecfin}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}" rendered="#{to!=divisa.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{divisa.to.fecfin}"
					rendered="#{to==divisa.to}" 
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{divisa.to.fecfin}"
						rendered="#{divisa.new}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>
			
 <!--  	<aon:column  >
				<f:facet name="header">
					<aon:outputText value="divisaf" />
				</f:facet>
				<aon:outputText value="#{to.id.divisaFinal}" rendered="#{to!=divisa.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text"
					rendered="#{to==divisa.to}" 
					value="#{divisa.to.id.divisaFinal}" maxlength="8" size="10" />
				<f:facet name="footer">					
				  <aon:inputText styleClass="aon-form-input-text"  
						rendered="#{divisa.new}" 
						value="#{divisa.to.id.divisaFinal}" 
						maxlength="8" size="10"/>
				</f:facet>	
			
			</aon:column> -->
			
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_divisa_unidest}" />
				</f:facet>
				<aon:outputText value="#{to.unidades}" rendered="#{to!=divisa.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text"
					rendered="#{to==divisa.to}" 
					value="#{divisa.to.unidades}" maxlength="8" size="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text"  
						rendered="#{divisa.new}" 
						value="#{divisa.to.unidades}" maxlength="8" size="10"/>
				</f:facet>
			</aon:column>
			
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_auxiliares_divisa_impoteorigen}" />
				</f:facet>
				<aon:outputText value="#{to.importe}" rendered="#{to!=divisa.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<aon:inputText styleClass="aon-form-input-text"
					rendered="#{to==divisa.to}" 
					value="#{divisa.to.importe}" maxlength="8" size="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text"  
						rendered="#{divisa.new}" 
						value="#{divisa.to.importe}" maxlength="8" size="10"/>
				</f:facet>
			</aon:column>
			


			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=divisa.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==divisa.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{divisa.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==divisa.to}"
						actionListener="#{divisa.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==divisa.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{divisa.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!divisa.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{divisa.new}"
							actionListener="#{divisa.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{divisa.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{divisa.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
	
		
							
	</aon:div>

</ui:composition>
