<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/js/itemLookup.js">
			// nothing
		</script>
	</ui:define>

	<ui:define name="content">
		<h:form id="compositionForm">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" actionListener="#{composition.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'" 
							disabled="#{compositionDetail.to!=null || compositionExpense.to != null}"
							accesskey="#{bundle.aon_key_save}"/>
						<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
							actionListener="#{composition.onCancel}"
							action="composition_list" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'" 
							disabled="#{compositionDetail.to!=null || compositionExpense.to != null}"
							accesskey="#{bundle.aon_key_cancel}"/>
						<t:commandButton id="remove" value="#{bundle.aon_remove}"
							forceId="#{true}" actionListener="#{composition.onRemove}"
							action="composition_list" rendered="#{!composition.new}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'" 
							disabled="#{compositionDetail.to!=null || compositionExpense.to != null}"
							accesskey="#{bundle.aon_key_remove}"/>
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
							actionListener="#{composition.onReset}"
							rendered="#{!composition.new}" 
							disabled="#{compositionDetail.to!=null || compositionExpense.to != null}"
							accesskey="#{bundle.aon_key_new}"/>
						<t:commandButton id="search" value="#{bundle.aon_search}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							forceId="#{true}" actionListener="#{composition.onEditSearch}"
							action="composition_search" immediate="#{true}" 
							disabled="#{compositionDetail.to!=null || compositionExpense.to != null}"
							accesskey="#{bundle.aon_key_search}"/>
						<t:commandButton id="composition" value="#{bundle.aon_report}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							forceId="#{true}" rendered="#{!composition.new}"
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
							disabled="#{compositionDetail.to!=null || compositionExpense.to != null}"
							accesskey="#{bundle.aon_key_print}" />	
						<t:commandButton id="updatePrices" value="#{compositionBundle.composition_update_price}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							forceId="#{true}" actionListener="#{compositionDetail.updateItemPrices}"
							rendered="#{!composition.new}"
							disabled="#{compositionDetail.to!=null || compositionExpense.to != null}"/>
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText
						value="#{composition.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="Composition_description" 
							value="#{compositionBundle.composition_description}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<t:inputText id="Composition_description" size="64"
							styleClass="aon-form-input-text" required="#{true}"
							forceId="#{true}" value="#{composition.to.description}">
							<f:validateLength minimum="1" maximum="64" />
						</t:inputText>

						<h:outputLabel for="Item_product_code"
							value="#{compositionBundle.composition_item}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:panelGroup>
							<t:inputHidden id="Item_id"
								styleClass="aon-form-input-text"
								forceId="#{true}" value="#{composition.to.item.id}"
								valueChangeListener="#{composition.itemData}"/>
							<t:inputText id="Item_product_code" size="10"
								styleClass="aon-form-input-text" required="true"
								forceId="#{true}" value="#{composition.to.item.product.code}"
								onchange="return findItemLookup(event, '#{facesContext.externalContext.request.contextPath}', 'com.code.aon.product.Item');"/>
							<h:commandButton id="findItem"
								onclick="selectWindow(this, 'placeList', '#{itemSearch.encodedPagePath}'); return false;"
								action="showPlace" value="" immediate="true"
								styleClass="aon-form-lookup-button" />
							<h:commandButton id="addItem" 
								onclick="selectWindow(this, 'placeList', '#{itemAdd.encodedPagePath}'); return false;"
								value="" immediate="true" styleClass="aon-form-new-button" />
							<t:inputText id="Item_full_name" size="47"
								styleClass="aon-form-input-text" disabled="#{true}"
								forceId="#{true}" value="#{composition.to.item.product.name} #{composition.to.item.detail}"
								style="padding-left:3px;" />
						</h:panelGroup>

						<h:outputLabel for="Composition_quantity"
							value="#{compositionBundle.composition_weight}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:panelGroup>
							<h:inputText id="Composition_quantity" size="10"
								styleClass="aon-form-input-text" required="#{true}"
								value="#{composition.to.quantity}">
								<f:validateDoubleRange />
							</h:inputText>
							<t:outputLabel for="Item_purchase_price"
								value="#{compositionBundle.composition_purchase_price}"
								styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
							<t:inputText id="Item_purchase_price" size="10"
								styleClass="aon-form-input-text" required="#{true}"
								forceId="#{true}" value="#{composition.to.price}">
								<f:validateDoubleRange />
							</t:inputText>
						</h:panelGroup>

						<t:outputLabel for="Item_expenses_percent"
							value="#{compositionBundle.composition_expenses_percent}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:panelGroup>
							<t:inputText id="Item_expenses_percent" size="10"
								styleClass="aon-form-input-text"
								forceId="#{true}" value="#{composition.to.expensesPercent}">
								<f:validateDoubleRange />
							</t:inputText>
							<t:outputLabel for="Item_expenses_fixed"
								value="#{compositionBundle.composition_expenses_fixed}"
								styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
							<t:inputText id="Item_expenses_fixed" size="10"
								styleClass="aon-form-input-text"
								forceId="#{true}" value="#{composition.to.expensesFixed}">
								<f:validateDoubleRange />
							</t:inputText>
						</h:panelGroup>

						<t:outputLabel for="Item_vat"
							value="#{compositionBundle.composition_tax}"
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
						<h:panelGroup>
							<t:inputText id="Item_vat" size="10"
								styleClass="aon-form-input-text" disabled="#{true}"
								forceId="#{true}" value="#{composition.taxPercent}" />
							<h:panelGroup rendered="#{composition.surcharge}">
								<t:outputLabel for="Item_surcharge"
									value="#{compositionBundle.composition_surcharge}:"
									styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
								<t:inputText id="Item_surcharge" size="10"
									styleClass="aon-form-input-text" disabled="#{true}"
									forceId="#{true}" value="#{composition.surchargePercent}" />
							</h:panelGroup>
						</h:panelGroup>
					</h:panelGrid>

					<t:div styleClass="aon-form-collapsiblePanel" rendered="#{!composition.new}" >
						<t:collapsiblePanel value="false"
							styleClass="aon-form-collapsiblePanel-title"
							title="#{compositionBundle.composition_expenses}">
							<t:div styleClass="aon-form-collapsiblePanel-body">
								<t:dataTable id="compositionExpenseDataList"
									value="#{compositionExpense.model}" var="to"
									rowOnMouseOver="selectRow( this )"
									rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
									styleClass="aon-edit-table" headerClass="aon-edit-table-header"
									footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
									rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
									columnClasses="aon-edit-table-body aon-edit-table-body-icon,
									aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-buttons">

									<h:column>
										<f:facet name="header">
											<f:verbatim>&#160;</f:verbatim>
										</f:facet>
										<f:verbatim>&#160;</f:verbatim>
										<t:commandLink immediate="#{true}"
											rendered="#{to!=compositionExpense.to}"
											styleClass="aon-table-row-selected"
											actionListener="#{compositionExpense.onSelect}">
										</t:commandLink>
										<f:facet name="footer">
											<t:div>
												<f:verbatim rendered="#{compositionExpense.new}">&#160;</f:verbatim>
												<t:commandButton id="reset"
													styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
													value="" immediate="#{true}" rendered="#{!compositionExpense.new}"
													actionListener="#{compositionExpense.onReset}">
												</t:commandButton>
											</t:div>				
										</f:facet>
									</h:column>
									<h:column>
										<f:facet name="header">
											<h:outputText value="#{compositionBundle.composition_description}" />
										</f:facet>
										<t:outputText value="#{to.description}"
											rendered="#{to!=compositionExpense.to}" />
										<h:inputText value="#{compositionExpense.to.description}"
											styleClass="aon-form-input-text"
											rendered="#{to==compositionExpense.to}" required="#{true}"
											size="55">
											<f:validateLength minimum="1" maximum="64" />
										</h:inputText>
										<f:facet name="footer">
											<t:div>
												<f:verbatim rendered="#{!compositionExpense.new}">&#160;</f:verbatim>
												<h:inputText id="compositionExpense_to_description"
													value="#{compositionExpense.to.description}"
													styleClass="aon-form-input-text"
													rendered="#{compositionExpense.new}" required="#{true}"
													size="55">
													<f:validateLength minimum="1" maximum="64" />
												</h:inputText>
											</t:div>
										</f:facet>
									</h:column>
									<t:column width="60">
										<f:facet name="header">
											<t:outputText value="#{compositionBundle.composition_quantity}" />
										</f:facet>
										<t:outputText value="#{to.quantity}"
											rendered="#{to!=compositionExpense.to}">
											<f:convertNumber pattern="#,##0.000" />
										</t:outputText>
										<h:inputText value="#{compositionExpense.to.quantity}"
											styleClass="aon-form-input-text"
											rendered="#{to==compositionExpense.to}" required="#{true}"
											size="8">
											<f:validateDoubleRange />
										</h:inputText>
										<f:facet name="footer">
											<t:div>
												<f:verbatim rendered="#{!compositionExpense.new}">&#160;</f:verbatim>
												<h:inputText id="compositionExpense_to_quantity"
													value="#{compositionExpense.to.quantity}"
													styleClass="aon-form-input-text"
													rendered="#{compositionExpense.new}" required="#{true}"
													size="8">
													<f:validateDoubleRange />
												</h:inputText>
											</t:div>
										</f:facet>
									</t:column>
									<t:column width="60">
										<f:facet name="header">
											<t:outputText value="#{compositionBundle.composition_price}" />
										</f:facet>
										<t:outputText value="#{to.price}"
											rendered="#{to!=compositionExpense.to}">
											<f:convertNumber pattern="#,##0.00" />
										</t:outputText>
										<h:inputText value="#{compositionExpense.to.price}"
											styleClass="aon-form-input-text"
											rendered="#{to==compositionExpense.to}" required="#{true}"
											size="8">
											<f:validateDoubleRange />
										</h:inputText>
										<f:facet name="footer">
											<t:div>
												<f:verbatim rendered="#{!compositionExpense.new}">&#160;</f:verbatim>
												<h:inputText id="compositionExpense_to_price"
													value="#{compositionExpense.to.price}"
													styleClass="aon-form-input-text"
													rendered="#{compositionExpense.new}" required="#{true}"
													size="8">
													<f:validateDoubleRange />
												</h:inputText>
											</t:div>
										</f:facet>
									</t:column>
									<t:column width="60">
										<f:facet name="header">
											<t:outputText value="#{compositionBundle.composition_total}" />
										</f:facet>
										<t:outputText value="#{compositionExpense.listTotal}">
											<f:convertNumber pattern="#,##0.00" />
										</t:outputText>
										<f:facet name="footer">
											<t:div style="text-align:right; font-weight:normal;">
												<t:outputText value="#{composition.totalExpenses}">
													<f:convertNumber pattern="#,##0.00" />
												</t:outputText>
											</t:div>
										</f:facet>
									</t:column>
									<t:column width="60">
										<f:facet name="header">
											<f:verbatim>&#160;</f:verbatim>
										</f:facet>
										<t:div>
											<f:verbatim rendered="#{to!=compositionExpense.to}">&#160;</f:verbatim>
	
											<t:commandButton title="#{bundle.aon_save}"
												actionListener="#{compositionExpense.onAccept}"
												rendered="#{to==compositionExpense.to}" value=""
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
												accesskey="#{bundle.aon_key_save_line}"/>
											<t:commandButton title="#{bundle.aon_cancel}"
												actionListener="#{compositionExpense.onCancel}"
												immediate="#{true}"
												onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
												value="" rendered="#{to==compositionExpense.to}" 
												accesskey="#{bundle.aon_key_cancel_line}"/>
											<t:commandButton title="#{bundle.aon_remove}"
												actionListener="#{compositionExpense.onRemove}"
												onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
												rendered="#{to==compositionExpense.to}"
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
												value="" accesskey="#{bundle.aon_key_remove_line}"/>
										</t:div>
										<f:facet name="footer">
											<t:div>
												<f:verbatim rendered="#{!compositionExpense.new}">&#160;</f:verbatim>
												<t:commandButton title="#{bundle.aon_save}"
													actionListener="#{compositionExpense.onAccept}"
													rendered="#{compositionExpense.new}" value=""
													styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
													accesskey="#{bundle.aon_key_save_line}"/>
												<t:commandButton title="#{bundle.aon_cancel}"
													actionListener="#{compositionExpense.onCancel}"
													immediate="#{true}"
													onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
													rendered="#{compositionExpense.new}"
													styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
													value=""  accesskey="#{bundle.aon_key_cancel_line}"/>
											</t:div>
										</f:facet>
									</t:column>
								</t:dataTable>
							</t:div>
						</t:collapsiblePanel>
					</t:div>

					<t:div styleClass="aon-form-collapsiblePanel" rendered="#{!composition.new}" >
						<t:collapsiblePanel value="false"
							styleClass="aon-form-collapsiblePanel-title"
							title="#{compositionBundle.composition_totals}">
							<t:div styleClass="aon-form-collapsiblePanel-body">

								<h:panelGrid columns="6" styleClass="aon-form-table"
									columnClasses="aon-form-table-column-odd,aon-form-table-column-even,aon-form-table-column-odd,aon-form-table-column-even,aon-form-table-column-odd,aon-form-table-column-even">
	
									<t:outputLabel for="Composition_total_purchase"
										value="#{compositionBundle.composition_total_purchase}:" />
									<t:outputText id="Composition_total_purchase"
										value="#{composition.totalPurchase}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
	
									<t:outputLabel for="Composition_total_sale"
										value="#{compositionBundle.composition_total_sale}:" />
									<t:outputText id="Composition_total_sale"
										value="#{composition.totalSale}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
	
									<t:outputLabel for="Composition_profit"
										value="#{compositionBundle.composition_profit}:" />
									<t:outputText id="Composition_profit"
										value="#{composition.profit}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
	
									<t:outputLabel for="Composition_purchase_profit"
										value="#{compositionBundle.composition_purchase_profit}:" />
									<t:outputText id="Composition_purchase_profit"
										value="#{composition.purchaseProfit}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
	
									<t:outputLabel for="Composition_sale_profit"
										value="#{compositionBundle.composition_sale_profit}:" />
									<t:outputText id="Composition_sale_profit"
										value="#{composition.saleProfit}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
	
									<f:verbatim>&#160;</f:verbatim>
									<f:verbatim>&#160;</f:verbatim>
								</h:panelGrid>
							</t:div>
						</t:collapsiblePanel>
					</t:div>

					<t:div styleClass="aon-form-collapsiblePanel" rendered="#{!composition.new}" >
						<t:collapsiblePanel value="false"
							styleClass="aon-form-collapsiblePanel-title"
							title="#{compositionBundle.composition_details}">
							<t:div styleClass="aon-form-collapsiblePanel-body">

								<t:dataTable id="compositionDetailDataList"
									value="#{compositionDetail.model}" var="to"
									rowOnMouseOver="selectRow( this )"
									rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
									styleClass="aon-edit-table" headerClass="aon-edit-table-header"
									footerClass="aon-edit-table-footer" rows="0" rowIndexVar="rowIndex"
									rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
									columnClasses="aon-edit-table-body aon-edit-table-body-icon,
									aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-buttons">
	
									<h:column>
										<f:facet name="header">
											<f:verbatim>&#160;</f:verbatim>
										</f:facet>
										<f:verbatim>&#160;</f:verbatim>
										<t:commandLink immediate="#{true}"
											rendered="#{to!=compositionDetail.to}"
											styleClass="aon-table-row-selected"
											actionListener="#{compositionDetail.onSelect}">
										</t:commandLink>
										<f:facet name="footer">
											<t:div>
												<f:verbatim rendered="#{compositionDetail.new}">&#160;</f:verbatim>
												<t:commandButton id="reset"
													styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
													value="" immediate="#{true}" rendered="#{!compositionDetail.new}"
													actionListener="#{compositionDetail.onReset}"
													accesskey="#{bundle.aon_key_new_line}">
												</t:commandButton>
											</t:div>				
										</f:facet>
									</h:column>
									<h:column>
