<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGrid id="menuGrid" columns="2" dir="true">

		<aon:outputLabel for="keystore"
			value="#{signBundle.sign_keystore}" />
		<c:if test="#{empty certificate.certificates}">											
			<aon:selectOneMenu id="keystore"
				value="#{certificate.keystore}">
				<f:selectItems value="#{certificate.digitalCertificates}" />
			</aon:selectOneMenu>
		
			<aon:outputLabel for="password"
				value="#{bundle.aon_login_passwd}" />
			<aon:inputSecret id="password" 
				value="#{certificate.password}" />
		</c:if>

		<c:if test="#{!(empty certificate.certificates)}">
			<aon:outputText id="keystore"
				value="#{certificate.keystore.description}" />
			
			<aon:outputLabel for="certificates"
				value="#{signBundle.sign_digital_certificate}" />
			<aon:selectOneMenu id="certificates"
				value="#{certificate.alias}">
				<f:selectItems value="#{certificate.certificates}" />
			</aon:selectOneMenu>
		</c:if>
		<c:if test="#{certificate.showCertificatePassword}">
			<aon:outputLabel for="certificatePassword"
				value="#{signBundle.sign_digital_certificate_password}" />
			<aon:inputSecret id="certificatePassword" 
				value="#{certificate.certificatePassword}" />
		</c:if>										
	</aon:panelGrid>

	<h:panelGrid cellpadding="2" cellspacing="0" columns="2"
		styleClass="aon-panelGrid-formatting aon-margin-top">
		<aon:selectBooleanCheckbox id="storeCertificate"
			value="#{certificate.storeCertificate}" />				
		<aon:outputLabel for="storeCertificate"
			value="#{signBundle.sign_certificate_store}" />
	</h:panelGrid>								

</ui:composition>
