<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div id="activityDataDiv" styleClass="aon-scroll-area">
	
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{activityBasic}" />
			<ui:param name="columnClasses" value="
			aon-editDataTable-dateColumn, aon-editDataTable-dateColumn, 
			aon-editDataTable-dateColumn, aon-editDataTable-dateColumn, 
			aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
			
			<ui:param name="skipResetButton" value="#{true}" />
			<ui:param name="showDataTable" value="#{!activityBasic.new}" />
			<ui:param name="showDataScroller" value="#{!activityBasic.new}" />
			
			<ui:define name="columns">
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{assetBundle.asset_date}" />
						</f:facet>
						<aon:outputText value="#{to.date}" rendered="#{to!=activityBasic.to}"
						 	size="8" >
						 	<f:convertDateTime pattern="#{assetBundle.aon_date_pattern}" 
								timeZone="#{timeZoneController.timeZoneId}"  />
						</aon:outputText>
						<aon:selectInputDate renderAsPopup="true" rendered="#{to==activityBasic.to}"
							popupDateFormat="#{assetBundle.aon_date_pattern}" inputSize="8"
							value="#{activityBasic.to.date}" enableManualInput="true" />
						<f:facet name="footer">
							<aon:selectInputDate renderAsPopup="true" rendered="#{activityBasic.new}" 
								popupDateFormat="#{assetBundle.aon_date_pattern}" inputSize="8"
								value="#{activityBasic.to.date}" enableManualInput="true" />
						</f:facet>
					</aon:column>
 				
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{assetBundle.asset_fromTime}" />
						</f:facet>
						<aon:outputText value="#{to.fromTime}" rendered="#{to!=activityBasic.to}"
							size="5" >
							<f:convertDateTime pattern="#{assetBundle.aon_time_pattern}" 
								timeZone="#{timeZoneController.timeZoneId}" type="time" />
						</aon:outputText>
						<aon:div id="ActivityDialog_fromTime" rendered="#{to==activityBasic.to}">
							<aon:selectOneMenu id="fromTimeHours" 
								value="#{activityBasic.fromTimeHours}">
								<f:selectItems value="#{activityDialog.hours}" />
							</aon:selectOneMenu>
							<aon:outputLabel 
								value="#{assetBundle.asset_hours}" />
							<aon:selectOneMenu id="fromTimeMins" 
								value="#{activityBasic.fromTimeMins}">
								<f:selectItems value="#{activityDialog.mins}" />
							</aon:selectOneMenu>
							<aon:outputLabel
								value="#{assetBundle.asset_minutes}" />
						</aon:div>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{assetBundle.asset_toTime}" />
						</f:facet>
						<aon:outputText value="#{to.toTime}" rendered="#{to!=activityBasic.to}"
							size="5" >
							<f:convertDateTime pattern="#{assetBundle.aon_time_pattern}" 
								timeZone="#{timeZoneController.timeZoneId}" type="time" />
						</aon:outputText>
						<aon:div id="ActivityDialog_toTime" rendered="#{to==activityBasic.to}">
							<aon:selectOneMenu id="toTimeHours" 
								value="#{activityBasic.toTimeHours}">
								<f:selectItems value="#{activityDialog.hours}" />
							</aon:selectOneMenu>
							<aon:outputLabel 
								value="#{assetBundle.asset_hours}" />
							<aon:selectOneMenu id="toTimeMins" 
								value="#{activityBasic.toTimeMins}">
								<f:selectItems value="#{activityDialog.mins}" />
							</aon:selectOneMenu>
							<aon:outputLabel
								value="#{assetBundle.asset_minutes}" />
						</aon:div>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{assetBundle.asset_activity_who}" />
						</f:facet>
						<aon:outputText value="#{to.who}" rendered="#{to!=activityBasic.to}"
							size="15" />
						<aon:inputText value="#{activityBasic.to.who}" rendered="#{to==activityBasic.to}"
						 	size="15" required="#{true}" >
							<f:validateLength maximum="20" />
						</aon:inputText>
						<f:facet name="footer">
							<aon:inputText value="#{activityBasic.to.who}" rendered="#{activityBasic.new}"
							 	size="15" required="#{true}" >
								<f:validateLength maximum="20" />
							</aon:inputText>
						</f:facet>
					</aon:column>
 					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{assetBundle.asset_activity_why}" />
						</f:facet>
						<aon:outputText value="#{to.why}" rendered="#{to!=activityBasic.to}"
							size="25" />
						<aon:inputText value="#{activityBasic.to.why}" rendered="#{to==activityBasic.to}"
						 	size="30" required="#{true}" >
							<f:validateLength maximum="64" />
						</aon:inputText>
						<f:facet name="footer">
							<aon:inputText value="#{activityBasic.to.why}" rendered="#{activityBasic.new}"
							 	size="30" required="#{true}" >
								<f:validateLength maximum="64" />
							</aon:inputText>
						</f:facet>
					</aon:column>
					
			</ui:define>
		</ui:decorate>
	</aon:div>
</ui:composition>
