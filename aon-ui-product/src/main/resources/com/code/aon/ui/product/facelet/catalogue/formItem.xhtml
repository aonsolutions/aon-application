<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
		<ui:param name="showTitle" value="#{false}" />
		<ui:param name="showDescription" value="#{false}" />
		<ui:param name="innerToolbar" value="#{true}" />
		<ui:define name="toolbarActions">
			<aon:htmlCommandLink id="catalogueItem-excel-report"
				value="&#160;" target="_blank" action="#{report.onExecute}"
				styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
				<f:param name="reportKey" value="catalogueItemList" />
				<f:param name="outputFormat" value="MS Excel" />
			</aon:htmlCommandLink>
			<aon:htmlCommandLink id="catalogueItem_report"
				styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
				value="#{bundle.aon_listing}"
				action="#{report.onExecute}">
				<f:param name="reportKey" value="catalogueItemList" />
				<f:param name="outputFormat" value="PDF" />
			</aon:htmlCommandLink>	
		</ui:define>
	</ui:decorate>
	
	<aon:div >

		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
			<ui:param name="controller" value="#{catalogueItem}" />
			<ui:param name="newSaveButtonReRender" value="CatalogueTypeDiv" />
			<ui:param name="saveButtonReRender" value="CatalogueTypeDiv" />
			<ui:param name="removeButtonReRender" value="CatalogueTypeDiv" />
			<ui:define name="columns">
	
				<aon:column alias="CatalogueItem.product.code" 
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="Product_id" value="#{bundle.aon_product}" />
					</f:facet>
					<aon:outputText value="#{to.product.code} - #{to.itemName}" rendered="#{formList}" />
					<aon:div rendered="#{formEdit}">
						<ui:include src="/com/code/aon/ui/product/facelet/product/lookup.xhtml" >
							<ui:param name="lookupBean" value="#{catalogue.to.purchase ? purchaseProductLookup : saleProductLookup}" />
							<ui:param name="lookupTo" value="#{catalogueItem.to.product}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupInputOnFocus" value="CatalogueItem_quantity" />
							<ui:param name="lookupReRender" 
								value="CatalogueItemListDiv" />
							<aon:methodParam name="lookupChangeListener"
								value="#{catalogueItem.productData}" type="lookupChangeListener" />
						</ui:include>
						<aon:div id="CatalogueItemListDiv" styleClass="aon-margin-left" style="display:inline;">
							<aon:selectOneMenu id="CatalogueItem_item"
								value="#{catalogueItem.to.item}"
								rendered="#{catalogueItem.to.product.itemCount > 1}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{catalogueItem.itemList}" />
							</aon:selectOneMenu>
						</aon:div>
					</aon:div>						
					<f:facet name="footer">
						<aon:div rendered="#{formNew}">
							<ui:include src="/com/code/aon/ui/product/facelet/product/lookup.xhtml" >
								<ui:param name="lookupBean" value="#{catalogue.to.purchase ? purchaseProductLookup : saleProductLookup}" />
								<ui:param name="lookupTo" value="#{catalogueItem.to.product}" />
								<ui:param name="idRequired" value="#{true}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupSuffix" value="-New" />
								<ui:param name="lookupInputOnFocus" value="CatalogueItem_quantity-New" />
								<ui:param name="lookupReRender" 
									value="CatalogueItemListDiv-New" />
								<aon:methodParam name="lookupChangeListener"
									value="#{catalogueItem.productData}" type="lookupChangeListener" />
							</ui:include>						
							<aon:div id="CatalogueItemListDiv-New" styleClass="aon-margin-left" style="display:inline;">
								<aon:selectOneMenu id="CatalogueItem_item-New"
									value="#{catalogueItem.to.item}"
									rendered="#{catalogueItem.to.product.itemCount > 1}">
									<f:selectItem itemLabel="-" value="#{null}" />
									<f:selectItems value="#{catalogueItem.itemList}" />
								</aon:selectOneMenu>
							</aon:div>
						</aon:div>
					</f:facet>
				</aon:column>
	
				<aon:column alias="CatalogueItem.quantity" 
					styleClass="aon-editDataTable-numberColumn aon-width-100">
					<f:facet name="header">
						<aon:outputLabel for="CatalogueItem_quantity" value="#{bundle.aon_date_from} #{bundle.aon_quantity}" />
					</f:facet>
					<aon:outputText value="#{to.quantity}"
						rendered="#{formList}">
						<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
					</aon:outputText>
					<aon:inputText id="CatalogueItem_quantity" 
						value="#{catalogueItem.to.quantity}" 
						rendered="#{formEdit}" required="#{true}" size="7">
						<f:validateDoubleRange />
					</aon:inputText>
					<f:facet name="footer">
						<aon:inputText id="CatalogueItem_quantity-New" 
							value="#{catalogueItem.to.quantity}"
							rendered="#{formNew}" required="#{true}" size="7">
							<f:validateDoubleRange />
						</aon:inputText>
					</f:facet>
				</aon:column>
	
				<aon:column alias="CatalogueItem.price" 
					styleClass="aon-editDataTable-numberColumn aon-width-80">
					<f:facet name="header">
						<aon:outputLabel for="CatalogueItem_price" value="#{bundle.aon_price}" />
					</f:facet>
					<aon:outputText value="#{to.price}"
						rendered="#{formList}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:inputText id="CatalogueItem_price" 
						value="#{catalogueItem.to.price}"
						rendered="#{formEdit}" required="#{true}" size="7">
						<f:validateDoubleRange />
					</aon:inputText>
					<f:facet name="footer">
						<aon:inputText id="CatalogueItem_price-New" 
							value="#{catalogueItem.to.price}"
							rendered="#{formNew}" required="#{true}" size="7">
							<f:validateDoubleRange />
						</aon:inputText>
					</f:facet>
				</aon:column>
	
				<aon:column alias="CatalogueItem.discount" 
					styleClass="aon-editDataTable-numberColumn aon-width-80">
					<f:facet name="header">
						<aon:outputLabel for="CatalogueItem_discount" value="#{bundle.aon_discount}" />
					</f:facet>
					<aon:outputText value="#{to.discount}" 
						rendered="#{formList}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<aon:inputText id="CatalogueItem_discount"
						value="#{catalogueItem.to.discount}"
						rendered="#{formEdit}" required="#{true}" size="7">
						<f:validateDoubleRange />
					</aon:inputText>
					<f:facet name="footer">
						<aon:inputText id="CatalogueItem_discount-New"
							value="#{catalogueItem.to.discount}"
							rendered="#{formNew}" required="#{true}" size="7">
							<f:validateDoubleRange />
						</aon:inputText>
					</f:facet>
				</aon:column>
	
			</ui:define>
		</ui:decorate>
	</aon:div>
</ui:composition>
