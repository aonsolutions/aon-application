<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="productSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_role_product}" />
				<ui:param name="controller" value="#{product}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{product}" />
				<ui:define name="searchContent">
					<ui:include src="/com/code/aon/ui/product/facelet/product/searchContent.xhtml" >
						<ui:param name="searchController" value="#{productSearch}" />
					</ui:include>
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:if test="#{aonRole.accountingOperator and aonConfiguration.bean.product.showAccount}">
			<aon:lookupButtonPopup lookup="#{accountLookup}" />
		</aon:if>		
		<aon:if test="#{aonConfiguration.bean.product.showSuppliers}">
			<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		</aon:if>
	</ui:define>
</ui:composition>
