<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{itemCatalogue}" />

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel for="ItemCatalogue_catalogue" value="#{bundle.product_catalogueItem_catalogue}" />
				</f:facet>
				<aon:outputText id="ItemCatalogue_catalogue"
					value="#{to.catalogue.name}"
					rendered="#{formList or formEdit}" />
				<f:facet name="footer">
					<aon:selectOneMenu id="ItemCatalogue_catalogue-New"
						value="#{controller.to.catalogue}" rendered="#{formNew}"
						required="true"
						valueChangeListener="#{controller.onCatalogueChanged}"
						reRender="ItemCatalogue_catalogue_startDate-New,ItemCatalogue_catalogue_endDate-New"
						focus="ItemCatalogue_quantity">
						<f:selectItems value="#{configCollections.catalogues}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemCatalogue_catalogue_startDate" value="#{bundle.aon_date_from}" />
				</f:facet>
				<aon:outputText id="ItemCatalogue_catalogue_startDate"
					value="#{to.catalogue.startDate}"
					rendered="#{formList or formEdit}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:outputText id="ItemCatalogue_catalogue_startDate-New"
						value="#{controller.to.catalogue.startDate}"
						rendered="#{formNew}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemCatalogue_catalogue_endDate" value="#{bundle.aon_date_to}" />
				</f:facet>
				<aon:outputText id="ItemCatalogue_catalogue_endDate"
					value="#{to.catalogue.endDate}"
					rendered="#{formList or formEdit}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:outputText id="ItemCatalogue_catalogue_endDate-New"
						value="#{controller.to.catalogue.endDate}"
						rendered="#{formNew}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemCatalogue_quantity" value="#{bundle.aon_date_from} #{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
				<aon:inputText id="ItemCatalogue_quantity"
					value="#{controller.to.quantity}" rendered="#{formEdit}"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="ItemCatalogue_quantity-New"
						value="#{controller.to.quantity}" rendered="#{formNew}"
						required="true" size="5" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemCatalogue_price" value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:inputText id="ItemCatalogue_price"
					value="#{controller.to.price}" rendered="#{formEdit}"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="ItemCatalogue_price-New"
						value="#{controller.to.price}" rendered="#{formNew}"
						required="true" size="5" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemCatalogue_discount" value="#{bundle.aon_discount}" />
				</f:facet>
				<aon:outputText value="#{to.discount}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:inputText id="ItemCatalogue_discount"
					value="#{controller.to.discount}" rendered="#{formEdit}"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="ItemCatalogue_discount-New"
						value="#{controller.to.discount}" rendered="#{formNew}"
						required="true" size="5" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>
</ui:composition>
