<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="increaseItemList">
			<aon:div layout="none">

				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.aon_increases}" />
					<ui:param name="controller" value="#{increaseItem}" />
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">

					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{increaseItem}" />
						<ui:param name="columnClasses"
							value="aon-editDataTable-text,aon-editDataTable-text,aon-editDataTable-text,
									aon-editDataTable-text,aon-editDataTable-text,aon-editDataTable-text" />
	
						<ui:define name="columns">
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="IncreaseItem_product_code" value="#{bundle.aon_id}" />
								</f:facet>
								<aon:outputText value="#{to.product.code}"
									rendered="#{formList}" />
								<aon:inputText id="IncreaseItem_product_code" rendered="#{formEdit}"
									value="#{increaseItem.to.product.code}" required="true"
									size="10" maxlength="15"
									onblur="toUpperCase(this);" />
								<f:facet name="footer">
									<aon:inputText id="IncreaseItem_product_code-New" rendered="#{formNew}"
										value="#{increaseItem.to.product.code}" required="true"
										size="10" maxlength="15"
										onblur="toUpperCase(this);" />
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="IncreaseItem_product_name" value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.product.name}"
									rendered="#{formList}" />
								<aon:inputText id="IncreaseItem_product_name" rendered="#{formEdit}"
									value="#{increaseItem.to.product.name}" required="true" 
									size="35" maxlength="64" />
								<f:facet name="footer">
									<aon:inputText id="IncreaseItem_product_name-New" rendered="#{formNew}"
										value="#{increaseItem.to.product.name}" required="true"
										size="35" maxlength="64" />
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="IncreaseItem_product_category" value="#{bundle.aon_category}" />
								</f:facet>
								<aon:outputText value="#{to.product.category.name}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="IncreaseItem_product_category" rendered="#{formEdit}"
									value="#{increaseItem.to.product.category}">
									<f:selectItems value="#{productCollections.categories}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="IncreaseItem_product_category-New" rendered="#{formNew}"
										value="#{increaseItem.to.product.category}">
										<f:selectItems value="#{productCollections.categories}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="IncreaseItem_profitPercent" value="% #{bundle.aon_increase}" />
								</f:facet>
								<aon:outputText value="#{to.profitPercent}"
									rendered="#{formList}">
									<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
								</aon:outputText>
								<aon:inputText id="IncreaseItem_profitPercent" rendered="#{formEdit}"
									value="#{increaseItem.to.profitPercent}" required="true"
									size="1" maxlength="4">
									<f:validateDoubleRange />
								</aon:inputText>
								<f:facet name="footer">
									<aon:inputText id="IncreaseItem_profitPercent-New" rendered="#{formNew}"
										value="#{increaseItem.to.profitPercent}" required="true"
										size="1" maxlength="4">
										<f:validateDoubleRange />
									</aon:inputText>
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="IncreaseItem_product_vat" value="#{bundle.aon_vat}" />
								</f:facet>
								<aon:outputText value="#{to.product.vat.name}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="IncreaseItem_product_vat" rendered="#{formEdit}"
									value="#{increaseItem.to.product.vat}">
									<f:selectItems value="#{configCollections.vatTaxes}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="IncreaseItem_product_vat-New" rendered="#{formNew}"
										value="#{increaseItem.to.product.vat}">
										<f:selectItems value="#{configCollections.vatTaxes}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="IncreaseItem_product_retention" value="#{bundle.aon_retention}" />
								</f:facet>
								<aon:outputText value="#{to.product.retention.name}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="IncreaseItem_product_retention" rendered="#{formEdit}"
									value="#{increaseItem.to.product.retention}">
									<f:selectItem itemLabel="-" itemValue="" />
									<f:selectItems value="#{configCollections.retentionTaxes}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="IncreaseItem_product_retention-New" rendered="#{formNew}"
										value="#{increaseItem.to.product.retention}">
										<f:selectItem itemLabel="-" itemValue="" />
										<f:selectItems value="#{configCollections.retentionTaxes}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:if test="#{aonRole.accountingOperator}">
								<aon:column>
									<f:facet name="header">
										<aon:outputLabel for="Account_id-Sales" value="#{bundle.aon_sales_account}" />
									</f:facet>
									<aon:div style="width: 90%;" rendered="#{formList}" ajaxRendered="true">
										<aon:outputText value="#{to.product.salesAccount.code}" />
										<rich:toolTip value="#{to.product.salesAccount.description}"
											hideEvent="onmouseout" showDelay="200">
										</rich:toolTip>
									</aon:div>
									<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
										<ui:param name="lookupTo" value="#{increaseItem.to.product.salesAccount}" />
										<ui:param name="lookupSuffix" value="-Sales" />
										<ui:param name="lookupRendered" value="#{formEdit}" />
										<ui:param name="skipSuggestText" value="#{true}" />
									</ui:include>
									<f:facet name="footer">
										<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
											<ui:param name="lookupTo" value="#{increaseItem.to.product.salesAccount}" />
											<ui:param name="lookupSuffix" value="-Sales-New" />
											<ui:param name="lookupRendered" value="#{formNew}" />
											<ui:param name="skipSuggestText" value="#{true}" />
										</ui:include>
									</f:facet>
	 							</aon:column>
							</aon:if>
 						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{accountLookup}" />
	</ui:define>
</ui:composition>
