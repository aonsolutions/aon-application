<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="tariffSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.product_tariff_module2}" />
				<ui:param name="controller" value="#{tariff}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{tariff}" />
				<ui:define name="searchContent">
					
					<aon:outputLabel for="Tariff_code"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Tariff_code" size="32"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Tariff_name"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Tariff_name" size="32"
						valueChangeListener="#{controller.addExpression}" />
					
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
