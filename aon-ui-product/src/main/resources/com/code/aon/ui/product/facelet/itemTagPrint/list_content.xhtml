<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">
		
	<aon:div id="itemTagPrint_list">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{bundle.product_tag_print_module}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_listing}" />
			<ui:param name="controller" value="#{itemTagPrint}" />
			<ui:param name="skipResetButton" value="#{true}" />

			<ui:define name="beforeToolbarContent">
				<aon:if test="#{showItemTagReportTemplate}">
					<aon:selectOneMenu id="itemTagPrint_reportTemplate"
						value="#{itemTagPrint.reportTemplate}" >
						<f:selectItems value="#{companyCollections.itemTagTemplate}" />
						<a4j:support event="onchange" reRender="itemTagPrint-report" ajaxSingle="#{true}" />
					</aon:selectOneMenu>
				</aon:if>
				<aon:htmlCommandLink id="itemTagPrint-report"
					value="#{bundle.aon_report}" target="_blank"
					rendered="#{!(empty itemTagPrint.checkedItems) and itemTagPrint.checkedItems>0}"
					disabled="#{empty itemTagPrint.reportTemplate}"
					action="#{report.onExecute}" 
					styleClass="aon-finding-toolbar-item aon-icon-pdf"
					accesskey="#{bundle.aon_key_print}">
					<f:param name="reportKey" value="#{itemTagPrint.reportKey}" />
				</aon:htmlCommandLink>
			</ui:define>
		</ui:decorate>

		<aon:div styleClass="aon-scroll-area">
			<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
				<f:facet name="header">
					<aon:panelGroup>
						<aon:outputText value="#{bundle.aon_apply_to_selected}" />
					</aon:panelGroup>
				</f:facet>
			    <h:panelGrid columns="8">
					<aon:outputLabel for="startPosition" styleClass="aon-bold"
						value="Posición de inicio: " />
					<rich:inputNumberSpinner id="startPosition"
			   			inputSize="2" minValue="1" cycled="#{false}"
						value="#{itemTagPrint.startPosition}" >
						<a4j:support event="onchange" reRender="startPosition" ajaxSingle="true" />
					</rich:inputNumberSpinner>
						
					<aon:outputLabel for="freeTextAll-all" styleClass="aon-bold"
						value="#{bundle.aon_text}: " />
					<aon:inputText id="freeTextAll-all"
						value="#{itemTagPrint.freeTextAll}" >
						<a4j:support event="onblur" reRender="freeTextAll-all" ajaxSingle="true" />
					</aon:inputText>
			
					<aon:outputLabel for="tagRepeatCount-all" styleClass="aon-bold"
						value="Repeticiones: " />
					<rich:inputNumberSpinner id="tagRepeatCount-all"
				   		inputSize="2" minValue="1" cycled="#{false}"
						value="#{itemTagPrint.tagRepeatCountAll}" >
						<a4j:support event="onchange" reRender="tagRepeatCount-all" ajaxSingle="true" />
					</rich:inputNumberSpinner>
					
					<aon:commandButton styleClass="aon-commandButton"
						value="#{bundle.aon_refresh}" 
						reRender="itemTagPrint_list"
						actionListener="#{itemTagPrint.completeAllValues}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
			     </h:panelGrid>
			</aon:panel>
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
				<ui:param name="controller" value="#{itemTagPrint}" />
				<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
				<ui:param name="skipSelectButton" value="#{true}" />
				
				<ui:define name="columns">
					<aon:column styleClass="aon-editDataTable-iconColumn">
						<f:facet name="header">
							<aon:panelGroup rendered="#{showChecksButtons}">
								<aon:commandButton styleClass="aon-icon-commandButton aon-icon-checkAll"
									title="#{bundle.aon_check_all}"
									value="&#160;"
									reRender="itemTagPrint_list"
									actionListener="#{controller.checkAll}"
									ajaxSingle="true" 
									onclick="Richfaces.showModalPanel('waitProccess')" 
						     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
								<aon:commandButton styleClass="aon-icon-commandButton aon-icon-checkNone"
									title="#{bundle.aon_uncheck_all}"
									value="&#160;"
									reRender="itemTagPrint_list"
									actionListener="#{controller.checkNone}"
									ajaxSingle="true" 
									onclick="Richfaces.showModalPanel('waitProccess')" 
						     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
							</aon:panelGroup>
						</f:facet>
						<aon:selectBooleanCheckbox id="Included_Row_checked"
							value="#{controller.rowChecked}" >
							<a4j:support event="onclick" 
								ajaxSingle="true"
								ignoreDumpResponses="true"
								limitToList="true"
								eventsQueue="itemTagPrintChecks"
								reRender="itemTagPrint_list" />
						</aon:selectBooleanCheckbox>
						<f:facet name="footer">
							<aon:outputText value="#{controller.checkedItems}" />
						</f:facet>
					</aon:column>
					
					<aon:column alias="Item.product.code"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.product.code}"/>
					</aon:column>
					
					<aon:column alias="Item.product.name,Item.detail,Item.detail2,Item.detail3,Item.serialNumber"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.fullName}"/>
					</aon:column>
					
					<aon:column alias="Item.detail,Item.detail2,Item.detail3"
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.asset_features}" />
						</f:facet>
						<aon:outputText value="#{to.detail}#{empty to.detail2?'':', '}#{to.detail2}#{empty to.detail3?'':', '}#{to.detail3}" >
							<aon:abbreviateConverter maxWidth="80" />
						</aon:outputText>
					</aon:column>
				
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-50">
						<f:facet name="header">
							<aon:panelGroup>
								<aon:outputText value="Repeticiones" />
							</aon:panelGroup>
						</f:facet>
						<rich:inputNumberSpinner id="tagRepeatCount"
							styleClass="aon-inputNumberSpinner"
			   				inputSize="2" minValue="1" cycled="#{false}"
							disabled="#{!controller.rowChecked}"
							value="#{controller.tagRepeatCountChanged}" >
							<a4j:support event="onchange" reRender="tagRepeatCount" ajaxSingle="true" />
			   			</rich:inputNumberSpinner>
					</aon:column>
					
				</ui:define>
			</ui:decorate>
			
		</aon:div>
	</aon:div>
		
</ui:composition>
