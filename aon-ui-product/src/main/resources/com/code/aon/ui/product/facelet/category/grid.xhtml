<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/facelet/templates/aon.ui.content.xhtml"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:define name="content">
		<aon:form id="categoryList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{productBundle.product_category_module}" />
					<ui:param name="controller" value="#{productCategory}" />
				</ui:include>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{productCategory}" />
						<ui:define name="columns">

							<aon:column styleClass="aon-editDataTable-textColumn"
								alias="ProductCategory.name">
								<f:facet name="header">
									<aon:outputLabel for="ProductCategory_name"
										value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.name}" rendered="#{formList}" />
								<aon:inputText id="ProductCategory_name"
									size="32" maxlength="32" 
									rendered="#{formEdit}" required="true"
									value="#{controller.to.name}"  />
								<f:facet name="footer">
									<aon:inputText id="ProductCategory_name-New"
										size="32" maxlength="32" 
										rendered="#{formNew}" required="true"
										value="#{controller.to.name}"  />
								</f:facet>
							</aon:column>

							<c:if test="#{productCategory.showPosInfo}">
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-200"
									alias="ProductCategory.detail">
									<f:facet name="header">
										<aon:outputLabel for="ProductCategory_detail"
											value="#{productBundle.product_category_label_detail}" />
									</f:facet>
									<aon:outputText value="#{to.detail}" rendered="#{formList}" />
									<aon:inputText id="ProductCategory_detail"
										size="32" maxlength="32" rendered="#{formEdit}"
										value="#{controller.to.detail}"  />
									<f:facet name="footer">
										<aon:inputText id="ProductCategory_detail-New"
											size="32" maxlength="32" rendered="#{formNew}"
											value="#{controller.to.detail}"  />
									</f:facet>
								</aon:column>
	
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-200"
									alias="ProductCategory.detail2">
									<f:facet name="header">
										<aon:outputLabel for="ProductCategory_detail2"
											value="#{productBundle.product_category_label_detail2}" />
									</f:facet>
									<aon:outputText value="#{to.detail2}" rendered="#{formList}" />
									<aon:inputText id="ProductCategory_detail2"
										size="32" maxlength="32" rendered="#{formEdit}"
										value="#{controller.to.detail2}"  />
									<f:facet name="footer">
										<aon:inputText id="ProductCategory_detail2-New"
											size="32" maxlength="32" rendered="#{formNew}"
											value="#{controller.to.detail2}"  />
									</f:facet>
								</aon:column>
							</c:if>

							<c:if test="#{productCategory.showCategoryGroup and (productCategoryGroup.model.rowCount > 0)}">
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-150"
									alias="ProductCategory.group.name">
									<f:facet name="header">
										<aon:outputLabel for="ProductCategory_group"
											value="#{productBundle.product_categoryGroup_module}" />
									</f:facet>
									<aon:outputText value="#{to.group.name}"
										rendered="#{formList}" />
									<aon:selectOneMenu id="ProductCategory_group"
										rendered="#{formEdit}"
										value="#{productCategory.to.group}">
										<f:selectItem itemLabel="-" itemValue="{null}" />
										<f:selectItems
											value="#{productCollections.categoryGroups}" />
									</aon:selectOneMenu>
									<f:facet name="footer">
										<aon:selectOneMenu id="ProductCategory_group-New"
											value="#{productCategory.to.group}"
											rendered="#{formNew}">
											<f:selectItem itemLabel="-" itemValue="{null}" />
											<f:selectItems
												value="#{productCollections.categoryGroups}" />
										</aon:selectOneMenu>
									</f:facet>
								</aon:column>
							</c:if>
 
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
