<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich">

	<ui:decorate 
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="columnClasses" value="aon-editDataTable-textColumn aon-width-200,aon-editDataTable-textColumn aon-width-auto,
			aon-editDataTable-textColumn aon-width-100" />
		<ui:define name="columns">
			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="ItemAddInfo_attribute" value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{systemAddInfo.getAttr(to.attribute)}"
					rendered="#{ systemAddInfo.isSystem(controller.to.attribute) or formList}" />
				
				<aon:inputText id="ItemAddInfo_attribute"
					value="#{controller.to.attribute}"
					rendered="#{ !systemAddInfo.isSystem(controller.to.attribute) and formEdit }" required="true" 
					size="40" maxlength="32" />
				<f:facet name="footer">
					<aon:div>
						<rich:comboBox id="ItemAddInfo_attribute-New"
							directInputSuggestions="true"
							suggestionValues="#{productCollections.addInfoAttributes}"
							value="#{controller.to.attribute}"
							rendered="#{formNew}" required="true"
							maxlength="32" width="250"	
							inputStyle="font-family: arial,lucida Grande, Trebuchet MS,sans-serif; font-size:1em;" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="ItemAddInfo_value" value="#{bundle.aon_value}" />
				</f:facet>
				<aon:outputText value="#{to.value}"
					rendered="#{formList}" />
				<aon:inputText id="ItemAddInfo_value"
					value="#{controller.to.value}"
					rendered="#{formEdit}" required="true"
					size="100" maxlength="128"
					converter="aon.TrimStringConverter" /> 
				<f:facet name="footer">
					<aon:inputText id="ItemAddInfo_value-New"
						value="#{controller.to.value}"
						rendered="#{formNew}" required="true" 
						size="100" maxlength="128"
						converter="aon.TrimStringConverter" /> 
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="ItemAddInfo_valueDate" value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.valueDate}"
					rendered="#{formList}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="ItemAddInfo_valueDate"
					value="#{controller.to.valueDate}"
					rendered="#{formEdit}" 
					required="true" inputSize="7"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}" />
				<f:facet name="footer">
					<aon:selectInputDate id="ItemAddInfo_valueDate-New"
						value="#{controller.to.valueDate}"
						rendered="#{formNew}" 
						required="true" inputSize="7"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
