<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="itemList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{productBundle.product_module}" />
				<ui:param name="controller" value="#{item}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="itemList-excel-report" value="&#160;" 
						target="_new" action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="itemList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="itemList-report" value="#{bundle.aon_listing}"
						target="_new" action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="itemList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{item}" />
					<ui:define name="columns">
	
						<ui:include
							src="/com/code/aon/ui/product/facelet/item/listBasic.xhtml" />
	
						<c:if test="#{aonConfiguration.bean.product.showBrand}">
							<aon:column alias="Item.product.brand.name"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{productBundle.product_brand}" />
								</f:facet>
								<aon:outputText value="#{to.product.brand.name}" />
							</aon:column>
						</c:if>
	
						<aon:column alias="Item.status"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
	
						<c:if test="#{!aonConfiguration.bean.product.showSalesPrice}">
							<aon:column alias="Item.price"
								styleClass="aon-editDataTable-numberColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_taxable_base}" />
								</f:facet>
								<aon:outputText value="#{to.price}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:column>
						</c:if>
	
						<c:if test="#{aonConfiguration.bean.product.showSalesPrice}">
							<aon:column styleClass="aon-editDataTable-numberColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_sales_price}" />
								</f:facet>
								<aon:outputText value="#{to.salesPrice}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:column>
						</c:if>
	
					</ui:define>
				</ui:decorate>	
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
