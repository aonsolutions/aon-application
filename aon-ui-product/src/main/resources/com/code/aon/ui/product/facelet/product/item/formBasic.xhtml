<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

	<aon:panelGrid columns="2" styleClass="aon-width-all" >

		<ui:include src="/com/code/aon/ui/product/facelet/product/item/formNewContent.xhtml">
			<ui:param name="itemTo" value="#{controller.to}" />
		</ui:include>

		<aon:outputLabel for="#{controller.pojoShortName}_status" value="#{bundle.aon_status}" />
		<aon:selectOneRadio id="#{controller.pojoShortName}_status" value="#{controller.to.status}"
			disabled="#{controller.to.wildCard and controller.to.active}">
			<f:selectItems value="#{productCollections.productStatuses}" />
		</aon:selectOneRadio>

		<aon:if test="#{aonConfiguration.bean.product.showEcommerceData}">
			<aon:selectBooleanCheckbox id="#{controller.pojoShortName}_internet" 
				value="#{controller.to.internet}" />
			<aon:outputLabel for="#{controller.pojoShortName}_internet" styleClass="aon-margin-right aon-italic"
				value="#{bundle.product_ecommerce_available}" />
		</aon:if>
		
	</aon:panelGrid>

</ui:composition>
