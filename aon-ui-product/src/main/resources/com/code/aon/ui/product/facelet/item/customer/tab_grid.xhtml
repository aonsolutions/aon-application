<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{itemCustomer}" />

		<ui:define name="columns">
			<aon:column	styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-auto aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="Customer_id" value="#{bundle.aon_customer}" />
				</f:facet>
				<aon:outputText value="#{to.registry.fullName}"
					rendered="#{formList}" />
				<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
					<ui:param name="lookupTo" value="#{controller.to.registry}" />
					<ui:param name="lookupForRegistry" value="#{true}" />
					<ui:param name="idRequired" value="#{true}" />						
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<aon:methodParam name="lookupChangeListener"
						value="#{controller.onCustomerChanged}" type="lookupChangeListener" />
				</ui:include>
				<f:facet name="footer">
					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{controller.to.registry}" />
						<ui:param name="lookupForRegistry" value="#{true}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="lookupSuffix" value="-New" />
						<aon:methodParam name="lookupChangeListener"
							value="#{controller.onCustomerChanged}" type="lookupChangeListener" />
					</ui:include>
				</f:facet>
			</aon:column>

			<aon:column
				styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-150 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="ItemCustomer_Code" value="#{bundle.product_item_customer_code}" />
				</f:facet>
				<aon:outputText value="#{to.code}" rendered="#{formList}" />
				<aon:inputText id="ItemCustomer_Code"
					value="#{controller.to.code}" rendered="#{formEdit}" 
					size="15" maxlength="15" />
				<f:facet name="footer">
					<aon:inputText id="ItemCustomer_Code-New"
						value="#{controller.to.code}" rendered="#{formNew}"
						size="15" maxlength="15" />
				</f:facet>
			</aon:column>

			<aon:column
				styleClass="aon-editDataTable-numberColumn aon-vertical-align-top aon-width-80 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="ItemCustomer_Price" value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}" rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText> 
				<aon:inputText id="ItemCustomer_Price"
					value="#{controller.to.price}" rendered="#{formEdit}" 
					required="true" size="5"/>
				<f:facet name="footer">
					<aon:inputText id="ItemCustomer_Price-New"
						value="#{controller.to.price}" rendered="#{formNew}"
						required="true" size="5" />
				</f:facet>
			</aon:column>

			<aon:column
				styleClass="aon-editDataTable-numberColumn aon-vertical-align-top aon-width-80 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="ItemCustomer_Discount" value="#{bundle.aon_discount}" />
				</f:facet>
				<aon:outputText value="#{to.discountExpression.discountExpr}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:inputText id="ItemCustomer_Discount"
					value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="ItemCustomer_Discount-New"
						value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}"
						required="true" size="5" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>
</ui:composition>
