<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelGrid columns="2" cellpadding="5" styleClass="aon-panelGrid-formatting"
		columnClasses="aon-width-half aon-vertical-align-top,aon-width-half aon-vertical-align-top">

		<aon:div>
			<aon:div styleClass="aon-group">
				<aon:div styleClass="aon-group-title">
					<aon:outputText value="#{bundle.product_data}"/>
				</aon:div>
				<aon:div styleClass="aon-group-body"> 
					<aon:div styleClass="aon-group-body-internal">
						<aon:panelGrid columns="2" styleClass="aon-width-all"
							columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">

							<ui:include	src="/com/code/aon/ui/product/facelet/product/formBasic.xhtml">
								<ui:param name="controller" value="#{product}" />
								<ui:param name="categoryChangeReRender" value="itemDataGrid,itemData" />
							</ui:include>

							<aon:if test="#{aonRole.accountingOperator and aonConfiguration.bean.product.showAccount}">
								<aon:outputLabel value="#{bundle.aon_sales_account}"
									rendered="#{controller.to.salesAccount.id != null}" />
								<aon:outputText styleClass="aon-bold"
									value="#{controller.to.salesAccount.code} - #{controller.to.salesAccount.description}"
									rendered="#{controller.to.salesAccount.id != null}" />

								<aon:outputLabel value="#{bundle.aon_purchase_account}"
									rendered="#{controller.to.purchaseAccount.id != null}" />
								<aon:outputText styleClass="aon-bold"
									value="#{controller.to.purchaseAccount.code} - #{controller.to.purchaseAccount.description}"
									rendered="#{controller.to.purchaseAccount.id != null}" />
							</aon:if>

						</aon:panelGrid>
					</aon:div>
				</aon:div>
			</aon:div>

		</aon:div>
		
		<aon:panelGroup>
			<aon:div styleClass="aon-group">
				<aon:div styleClass="aon-group-title">
					<aon:outputText value="#{bundle.aon_detail}"/>
				</aon:div>
				<aon:div styleClass="aon-group-body"> 
					<aon:div styleClass="aon-group-body-internal">
					
						<ui:include	src="/com/code/aon/ui/product/facelet/product/item/formBasic.xhtml">
							<ui:param name="controller" value="#{item}" />
						</ui:include>
	
					</aon:div>
				</aon:div>
			</aon:div>
	
			<aon:div styleClass="aon-group">
				<aon:div styleClass="aon-group-title">
					<aon:outputText value="#{bundle.product_basic_sales_tariff}"/>
				</aon:div>
				<aon:div styleClass="aon-group-body"> 	
					<aon:div styleClass="aon-group-body-internal">
						<a4j:region>
							<aon:panelGrid columns="2" styleClass="aon-width-all"
								columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">

								<ui:include	src="/com/code/aon/ui/product/facelet/product/item/formPrices.xhtml">
									<ui:param name="controller" value="#{item}" />
									<ui:param name="itemTo" value="#{item.to}" />
								</ui:include>

							</aon:panelGrid>
						</a4j:region>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:panelGroup>
		
	</aon:panelGrid>
	 
</ui:composition>
