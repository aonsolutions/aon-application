<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputText value="" />
	<aon:div styleClass="aon-search-content-width">

		
		<aon:panelCollapsible styleClass="aonCard" expanded="false" label="#{bundle.aon_general}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/product/facelet/product/searchBasicContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>					
					
		
			<aon:panelCollapsible styleClass="aonCard" expanded="false" label="#{bundle.admin_advanced_search}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/product/facelet/product/searchAdvancedContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>							
					
		
		
		<aon:panelCollapsible styleClass="aonCard" expanded="false" label="#{bundle.aon_detail}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/product/facelet/product/item/searchContent.xhtml">
					<ui:param name="aliasPreffix" value="Product_items" />
				</ui:include>
			</aon:panelGrid>
		</aon:panelCollapsible>	
				
		<aon:if test="#{aonConfiguration.bean.product.showAddInfo}">	
			<aon:panelCollapsible styleClass="aonCard" expanded="false" label="#{bundle.aon_detail}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<aon:outputText value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Product_addInfos_valueDate-From"
							styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Product_addInfos_valueDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
				
						<aon:outputLabel for="Product_addInfos_valueDate-To"
							styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Product_addInfos_valueDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:div>					
	
					<aon:outputText for="Product_addInfos_attribute"
						value="#{bundle.aon_parameter}" />
					<aon:inputText id="Product_addInfos_attribute"
						valueChangeListener="#{controller.addExpression}" size="25" />
	
					<aon:outputText for="Product_addInfos_value"
						value="#{bundle.aon_value}" />
					<aon:inputText id="Product_addInfos_value"
						valueChangeListener="#{controller.addExpression}" size="25" />
			</aon:panelGrid>
		</aon:panelCollapsible>	
		</aon:if>		
				
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/searchContent.xhtml" >
			<ui:param name="valueController" value="#{productExport}" />
		</ui:include>
				
	</aon:div>
		
</ui:composition>
