<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="expenseItemList">
			<aon:div layout="none">

				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{bundle.aon_expenses}" />
					<ui:param name="controller" value="#{expenseItem}" />
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">

					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{expenseItem}" />
						<ui:param name="columnClasses"
							value="aon-editDataTable-text,aon-editDataTable-text,aon-editDataTable-text,
									aon-editDataTable-text,aon-editDataTable-text,aon-editDataTable-text" />
	
						<ui:define name="columns">
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="ExpenseItem_product_code" value="#{bundle.aon_id}" />
								</f:facet>
								<aon:outputText value="#{to.product.code}"
									rendered="#{formList}" />
								<aon:inputText id="ExpenseItem_product_code" rendered="#{formEdit}"
									value="#{expenseItem.to.product.code}" required="true"
									size="10" maxlength="15"
									onblur="toUpperCase(this);" />
								<f:facet name="footer">
									<aon:inputText id="ExpenseItem_product_code-New" rendered="#{formNew}"
										value="#{expenseItem.to.product.code}" required="true"
										size="15" maxlength="15"
										onblur="toUpperCase(this);" />
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="ExpenseItem_product_name" value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.product.name}"
									rendered="#{formList}" />
								<aon:inputText id="ExpenseItem_product_name" rendered="#{formEdit}"
									value="#{expenseItem.to.product.name}" required="true" 
									size="50" maxlength="64" />
								<f:facet name="footer">
									<aon:inputText id="ExpenseItem_product_name-New" rendered="#{formNew}"
										value="#{expenseItem.to.product.name}" required="true"
										size="50" maxlength="64" />
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="ExpenseItem_product_category" value="#{bundle.aon_category}" />
								</f:facet>
								<aon:outputText value="#{to.product.category.name}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="ExpenseItem_product_category" rendered="#{formEdit}"
									value="#{expenseItem.to.product.category}">
									<f:selectItems value="#{productCollections.categories}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="ExpenseItem_product_category-New" rendered="#{formNew}"
										value="#{expenseItem.to.product.category}">
										<f:selectItems value="#{productCollections.categories}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="ExpenseItem_product_vat" value="#{bundle.aon_vat}" />
								</f:facet>
								<aon:outputText value="#{to.product.vat.name}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="ExpenseItem_product_vat" rendered="#{formEdit}"
									value="#{expenseItem.to.product.vat}">
									<f:selectItems value="#{configCollections.vatTaxes}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="ExpenseItem_product_vat-New" rendered="#{formNew}"
										value="#{expenseItem.to.product.vat}">
										<f:selectItems value="#{configCollections.vatTaxes}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="ExpenseItem_product_retention" value="#{bundle.aon_retention}" />
								</f:facet>
								<aon:outputText value="#{to.product.retention.name}"
									rendered="#{formList}" />
								<aon:selectOneMenu id="ExpenseItem_product_retention" rendered="#{formEdit}"
									value="#{expenseItem.to.product.retention}">
									<f:selectItem itemLabel="-" itemValue="" />
									<f:selectItems value="#{configCollections.retentionTaxes}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="ExpenseItem_product_retention-New" rendered="#{formNew}"
										value="#{expenseItem.to.product.retention}">
										<f:selectItem itemLabel="-" itemValue="" />
										<f:selectItems value="#{configCollections.retentionTaxes}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
	
							<aon:if test="#{aonRole.accountingOperator}">
								<aon:column>
									<f:facet name="header">
										<aon:outputLabel for="Account_id" value="#{bundle.product_expense_account}" />
									</f:facet>
									<aon:div style="width: 90%;" rendered="#{formList}" ajaxRendered="true">
										<aon:outputText value="#{to.product.purchaseAccount.code}" />
										<rich:toolTip value="#{to.product.purchaseAccount.description}"
											hideEvent="onmouseout" showDelay="200">
										</rich:toolTip>
									</aon:div>
									<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
										<ui:param name="lookupTo" value="#{expenseItem.to.product.purchaseAccount}" />
										<ui:param name="lookupRendered" value="#{formEdit}" />
										<ui:param name="idRequired" value="#{true}" />						
										<ui:param name="skipSuggestText" value="#{true}" />
									</ui:include>
									<f:facet name="footer">
										<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
											<ui:param name="lookupTo" value="#{expenseItem.to.product.purchaseAccount}" />
											<ui:param name="lookupSuffix" value="-New" />
											<ui:param name="lookupRendered" value="#{formNew}" />
											<ui:param name="idRequired" value="#{true}" />						
											<ui:param name="skipSuggestText" value="#{true}" />
										</ui:include>
									</f:facet>
	 							</aon:column>
							</aon:if>
 						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{accountLookup}" />
	</ui:define>
	
	<ui:define name="additionalDataTableContent">
		<aon:div style="height:50px">
			<aon:outputText value=""/>
		</aon:div>
	</ui:define>
	
</ui:composition>
