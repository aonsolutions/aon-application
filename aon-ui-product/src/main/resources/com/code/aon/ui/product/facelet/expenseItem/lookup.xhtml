<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/lookup.xhtml" >
		<ui:param name="lookupBean" value="#{expenseItemLookup}" />
		<ui:param name="lookupInputValue" value="#{lookupTo.product.code}"/>
		<ui:param name="lookupInputSize" value="10"/>
		<ui:param name="lookupInputSuggestValue" value="#{lookupTo.product.name}"/>
		<ui:param name="lookupInputSuggestExpression" value="#{lto.product.name} (#{lto.product.code})"/>
		<ui:param name="lookupInputMaxLength" value="15"/>
		<ui:param name="lookupInputOnSubmit" value="toUpperCase(this);"/>		
		<ui:param name="lookupLabel" value="#{bundle.aon_concept}" />
		<ui:param name="controller" value="#{expenseItem}" />
		<ui:param name="lookupSelectType" value="list" />
		<ui:param name="searchButtonTitle" value="#{bundle.aon_expenses}" />
		<ui:param name="skipNewButton" value="#{true}" />
		<ui:param name="skipGoToButton" value="#{true}" />
				
		<ui:define name="lookupInputTextContent">
			<aon:joinProperty alias="Item_product_code" value="#{lookupInputValue}" />
			<aon:joinProperty alias="Item_barcode" value="#{lookupInputValue}" orExpression="#{true}" />
		</ui:define>		
	</ui:decorate>

</ui:composition>
