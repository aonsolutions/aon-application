<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showItemPackageWindow">
		<aon:if test="#{controller.showItemPackageWindow}">
			<rich:modalPanel id="itemPackageModalPanel" minHeight="260"
				minWidth="580" rendered="#{controller.showItemPackageWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_to_specify} #{bundle.product_packaged}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showItemPackageWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showItemPackageWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="itemPackageForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="itemPackage-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{controller.onAssignItemPackage}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="itemPackageModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showItemPackageWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="itemPackage-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showItemPackageWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{controller.showItemPackageWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="itemPackageGrid" columns="2" dir="true" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-auto">

										<aon:outputLabel styleClass="aon-uppercase"
											value="#{bundle.aon_product}" />
										<aon:outputText styleClass="aon-bold"
											value="#{controller.to.item.product.fullName}" />

										<aon:outputLabel for="ItemPackage_packFormatQuantity"
											value="#{controller.to.item.packFormatTag.name}" />
										<aon:div>
											<aon:inputText id="ItemPackage_packFormatQuantity" 
												value="#{controller.to.item.packFormatQuantity}" 
												required="true" size="5"
												reRender="itemPackageGrid" />
											<aon:outputText styleClass="aon-form-date-label"
												value="#{controller.to.item.packUnits}" /> 
											<aon:outputText styleClass="aon-form-date-label"
												value="#{controller.to.item.packUnitsTag.name}" /> 
										</aon:div>

										<aon:outputLabel for="ItemPackage_packUnitsQuantity"
											value="#{controller.to.item.packUnitsTag.name}" />
										<aon:div>
											<aon:inputText id="ItemPackage_packUnitsQuantity" 
												value="#{controller.to.item.packUnitsQuantity}" 
												required="true" size="5"
												reRender="itemPackageGrid" /> 
											<aon:outputText styleClass="aon-form-date-label"
												value="#{controller.to.item.packMeasurement}" /> 
											<aon:outputText styleClass="aon-form-date-label"
												value="#{controller.to.item.packMeasurementTag.name}" /> 
										</aon:div>

										<aon:outputLabel for="ItemPackage_packMeasurementQuantity"
											value="#{controller.to.item.packMeasurementTag.name}" />
										<aon:inputText id="ItemPackage_packMeasurementQuantity" 
											value="#{controller.to.item.packMeasurementQuantity}" 
											required="true" size="5"
											reRender="itemPackageGrid" /> 

										<aon:outputLabel for="ItemPackage_packStockQuantity"
											value="#{bundle.aon_quantity} (#{bundle.aon_unit_abrv}#{bundle.product_stock})" />
										<aon:div styleClass="aon-bold">
											<aon:outputText id="ItemPackage_packStockQuantity" 
												value="#{controller.to.item.packStockQuantity}">
												<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
											</aon:outputText>
											<aon:outputText styleClass="aon-margin-left aon-italic"
												value="#{controller.to.item.stockUnitTag.name}" /> 
										</aon:div> 

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
