<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:methodParam name="rowSelectorAction" value="product_form" />
	<aon:methodParam name="rowSelectorActionListener" value="#{product.onSelectItem}" type="actionListener" />

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
		<ui:param name="skipSelectButton" value="true" />
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-iconColumn">
				<aon:outputText value="&#160;"
					rendered="#{controller.to == to}"
					styleClass="aon-icon2 aon-icon-rowSelector" />																
			</aon:column>
			
			<c:if test="#{product.showDetail}">
				<aon:column alias="Item.detail"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{product.labelDetail}" />
					</f:facet>
					<aon:outputText value="#{to.detail}" />
				</aon:column>
			</c:if>

			<c:if test="#{product.showDetail2}">
				<aon:column alias="Item.detail2"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{product.labelDetail2}" />
					</f:facet>
					<aon:outputText value="#{to.detail2}" />
				</aon:column>
			</c:if>

			<c:if test="#{product.showDetail3}">
				<aon:column alias="Item.detail3"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{product.labelDetail3}" />
					</f:facet>
					<aon:outputText value="#{to.detail3}" />
				</aon:column>
			</c:if>

			<aon:column alias="Item.barcode"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{productBundle.product_barcode}" />
				</f:facet>
				<aon:outputText value="#{to.barcode}" />
			</aon:column>

			<aon:column alias="Item.price"
				styleClass="aon-editDataTable-numberColumn aon-width-100">
				<f:facet name="header">
					<aon:outputText value="#{productBundle.product_sales_base_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column alias="Product.status"
				styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}" />
			</aon:column>			
			
		</ui:define>
	</ui:decorate>
	 
</ui:composition>
