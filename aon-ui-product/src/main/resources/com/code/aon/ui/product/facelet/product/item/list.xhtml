<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:methodParam name="rowSelectorAction" value="product_form" />
	<aon:methodParam name="rowSelectorActionListener" value="#{product.onSelectItem}" type="actionListener" />

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
		<ui:param name="skipSelectButton" value="true" />
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-iconColumn">
				<aon:outputText value="&#160;"
					styleClass="aon-icon2 aon-icon-rowSelector"
					title="#{bundle.product_itemDetail_selected}"
					rendered="#{controller.to == to}" />
			</aon:column>

			<aon:if test="#{product.to.serializable}">
				<aon:column alias="Item.serialNumber"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{product.to.lotable ? bundle.aon_lot_number : bundle.aon_serial_number}" />
					</f:facet>
					<div>
						<aon:outputText value="#{to.serialNumber}" />
						<aon:outputText value="#{bundle.product_item_serializable_wildcard}"
							rendered="#{to.wildCard}" />
					</div>
				</aon:column>

				<aon:column alias="Item.serialDate"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{product.to.lotable ? bundle.aon_lot_date : bundle.aon_serial_date}" />
					</f:facet>
					<aon:outputText value="#{to.serialDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>
			</aon:if>

			<aon:if test="#{product.to.category != null and !empty product.to.category.detail}">
				<aon:column alias="Item.detail"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{product.to.category.detail}" />
					</f:facet>
					<aon:outputText value="#{to.detail}" />
				</aon:column>
			</aon:if>

			<aon:if test="#{product.to.category != null and !empty product.to.category.detail2}">
				<aon:column alias="Item.detail2"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{product.to.category.detail2}" />
					</f:facet>
					<aon:outputText value="#{to.detail2}" />
				</aon:column>
			</aon:if>

			<aon:if test="#{product.to.category != null and !empty product.to.category.detail3}">
				<aon:column alias="Item.detail3"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{product.to.category.detail3}" />
					</f:facet>
					<aon:outputText value="#{to.detail3}" />
				</aon:column>
			</aon:if>

			<aon:if test="#{product.to.packaged}">
				<aon:column alias="Item.packFormatTag"
						styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_format}" />
					</f:facet>
					<aon:outputText value="#{to.packFormatTag.name}" />
				</aon:column>

				<aon:column alias="Item.packUnits"
						styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_units} / #{bundle.product_package}" />
					</f:facet>
					<aon:outputText value="#{to.packUnits}" />
					<aon:outputText value="&#160;" />
					<aon:outputText value="#{to.packUnitsTag.name}" />
				</aon:column>

				<aon:column alias="Item.packMeasurement"
						styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_measurement}" />
					</f:facet>
					<aon:outputText value="#{to.packMeasurement}" />
					<aon:outputText value="&#160;" />
					<aon:outputText value="#{to.packMeasurementTag.name}" />
				</aon:column>
			</aon:if>

			<aon:column alias="Item.barcode"
					styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.product_barcode}" />
				</f:facet>
				<aon:outputText value="#{to.barcode}" />
			</aon:column>

			<aon:column alias="Item.purchasePrice"
				styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.product_purchase_price}" />
				</f:facet>
				<aon:outputText value="#{to.purchasePrice}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column alias="Item.price"
				styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.product_sales_base}" />
				</f:facet>
				<aon:outputText value="#{to.price}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_sales_price}" />
				</f:facet>
				<aon:outputText value="#{to.salesPrice}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:column>
			
			<aon:if test="#{product.to.inventoriable}">
				<aon:column styleClass="aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.product_stock}" />
					</f:facet>
					<aon:outputText value="#{to.stock}">
						<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
					</aon:outputText>
				</aon:column>
			</aon:if>			
			
			<aon:column alias="Product.status"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}" />
			</aon:column>			

		</ui:define>
	</ui:decorate>
	 
</ui:composition>
