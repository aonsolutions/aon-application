<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showAccountsWindow">
		<aon:if test="#{controller.showAccountsWindow}">
			<rich:modalPanel id="accountsModalPanel"
				minWidth="740" minHeight="200" zindex="90"
				showWhenRendered="#{controller.showAccountsWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.accounting_balance_detail_accounts}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showAccountsWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showAccountsWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="accountsForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="accounts-accept"
											value="#{bundle.aon_accept}"
											actionListener="#{controller.accept}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<rich:componentControl for="accountsModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showAccountsWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="accounts-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showAccountsWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{controller.showAccountsWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>
									
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">
												
											<aon:outputLabel for="Account_id-Sales"
												value="#{bundle.aon_sales_account}" />
											<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
												<ui:param name="lookupTo" value="#{controller.to.salesAccount}" />
												<ui:param name="lookupSuffix" value="-Sales" />
											</ui:include>

											<aon:outputLabel for="Account_id-Purchase"
												value="#{bundle.aon_purchase_account}" />
											<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
												<ui:param name="lookupTo" value="#{controller.to.purchaseAccount}" />
												<ui:param name="lookupSuffix" value="-Purchase" />
											</ui:include>

										</aon:panelGrid>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
