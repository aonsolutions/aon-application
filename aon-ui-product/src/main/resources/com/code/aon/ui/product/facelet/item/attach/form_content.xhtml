<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich">

	<aon:outputLabel for="ItemAttach_type" value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="ItemAttach_type"
		value="#{controller.to.type}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{itemAttach.typesList}" />
	</aon:selectOneMenu>									

	<aon:outputLabel for="ItemAttach_description" value="#{bundle.aon_description}" />
	<aon:inputText id="ItemAttach_description" required="true"
		value="#{controller.to.description}" maxlength="64" size="40" />
		
	<aon:outputText value="#{bundle.aon_fileupload_element}" />
	<aon:div id="attachFile">													
		<a4j:region>
			<aon:fileUpload 
				fileUploadListener="#{controller.fileUploaded}" >
				<f:facet name="label">
					<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
				</f:facet>														
				<a4j:support event="onuploadcomplete"
					reRender="attachFile,ItemAttach_description" />
				<a4j:support event="onupload"
					oncomplete="showFileUploadProgress();" />
				<a4j:support event="onclear"
					oncomplete="hideFileUploadProgress();" />
			</aon:fileUpload>
			<rich:jQuery name="showFileUploadProgress" timing="onJScall"
				selector="#attachFile .rich-fileupload-list-overflow" query="height(70);" />
			<rich:jQuery name="hideFileUploadProgress" timing="onJScall"
				selector="#attachFile .rich-fileupload-list-overflow" query="height(0);" />										
		</a4j:region>
	</aon:div>	

</ui:composition>
