<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">

	<aon:outputLabel for="ItemSupplier_priority" value="#{bundle.aon_priority}" />
	<aon:inputText id="ItemSupplier_priority" 
		value="#{controller.to.priority}"
		required="true" size="2" maxlength="3" />

	<aon:outputLabel for="Supplier_id" value="#{bundle.aon_supplier}" />
	<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
		<ui:param name="lookupTo" value="#{controller.to.supplier}" />
		<ui:param name="idRequired" value="#{true}" />
		<ui:param name="skipLabel" value="#{true}" />
		<aon:methodParam name="lookupChangeListener"
			value="#{controller.onSupplierChanged}" type="lookupChangeListener" />
	</ui:include>

	<aon:outputLabel for="ItemSupplier_Code" value="#{productBundle.product_item_supplier_code}" />
	<aon:inputText id="ItemSupplier_Code"
		value="#{controller.to.code}"
		size="15" maxlength="15" />

	<aon:outputLabel for="ItemSupplier_Price" value="#{bundle.aon_price}" />
	<aon:inputText id="ItemSupplier_Price"
		value="#{controller.to.price}"
		required="true" size="5" />

	<c:if test="#{companyCollections.currentUserWorkPlacesCount > 1}" >
		<aon:outputLabel for="ItemSupplier_workPlace" value="#{companyBundle.company_workplace}" />
		<aon:selectOneMenu id="ItemSupplier_workPlace-New" 
			value="#{controller.to.workPlace}">
			<f:selectItem itemLabel=" - " itemValue="null" />
			<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
		</aon:selectOneMenu>
	</c:if>

</ui:composition>
