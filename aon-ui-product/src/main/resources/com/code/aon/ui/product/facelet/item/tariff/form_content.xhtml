<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">

	<aon:outputLabel for="ItemTariff_tariff" value="#{bundle.report_tariff}" />
	<aon:selectOneMenu id="ItemTariff_tariff"
		value="#{controller.to.tariff}" required="true">
		<f:selectItems value="#{configCollections.tariffs}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ItemTariff_type" value="#{productBundle.product_tariff_type}" />
	<aon:selectOneMenu id="ItemTariff_type"
		value="#{controller.to.type}"
		valueChangeListener="#{controller.onTariffTypeChanged}"
		reRender="ItemTariff_profit_percent,ItemTariff_price,ItemTariff_sales_price">
		<f:selectItems value="#{productCollections.itemTariffTypes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ItemTariff_profit_percent" value="#{bundle.aon_percentage}" />
	<aon:inputText id="ItemTariff_profit_percent"
		value="#{controller.to.profitPercent}"
		disabled="#{controller.to.fixed}"
		valueChangeListener="#{controller.onProfitChanged}"
		reRender="ItemTariff_price,ItemTariff_sales_price"
		focus="ItemTariff_price"
		required="true" size="5" />

	<aon:outputLabel for="ItemTariff_price" value="#{productBundle.product_sales_base_price}" />
	<aon:inputText id="ItemTariff_price"
		value="#{controller.to.price}"
		valueChangeListener="#{controller.onPriceChanged}" 
		reRender="ItemTariff_profit_percent,ItemTariff_sales_price"
		focus="ItemTariff_sales_price"
		required="true" size="5" />

	<aon:outputLabel for="ItemTariff_sales_price" value="#{bundle.aon_sales_price}" />
	<aon:inputText id="ItemTariff_sales_price"
		value="#{controller.to.salesPrice}"
		valueChangeListener="#{controller.onSalesPriceChanged}" 
		reRender="ItemTariff_profit_percent,ItemTariff_price"
		required="true" size="5" />

</ui:composition>
