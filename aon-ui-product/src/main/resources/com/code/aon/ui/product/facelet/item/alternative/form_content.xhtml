<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">

	<aon:outputLabel for="ItemAlternative_priority" value="#{bundle.aon_priority}" />
	<aon:inputText id="ItemAlternative_priority" 
		value="#{controller.to.priority}"
		required="true" size="2" maxlength="3" />

	<aon:outputLabel for="Item_id_Alternative" value="#{bundle.aon_product}" />
	<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
		<ui:param name="lookupBean" value="#{(product.to.sale) ? saleItemLookup : (product.to.purchase) ? purchaseItemLookup : allItemLookup}" />
		<ui:param name="lookupTo" value="#{controller.to.alternativeItem}" />
		<ui:param name="idRequired" value="#{true}" />
		<ui:param name="skipLabel" value="#{true}" />
		<ui:param name="lookupSuffix" value="_Alternative" />
		<aon:methodParam name="lookupChangeListener"
			value="#{controller.onAlternativeItemChanged}" type="lookupChangeListener" />
	</ui:include>

</ui:composition>
