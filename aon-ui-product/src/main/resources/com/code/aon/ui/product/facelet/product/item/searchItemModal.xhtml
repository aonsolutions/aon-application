<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showSearchItemWindow">
		<aon:if test="#{controller.showSearchItemWindow}">
			<rich:modalPanel id="searchItemModalPanel"
				minWidth="640" minHeight="400" zindex="90"
				showWhenRendered="#{controller.showSearchItemWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.product_itemDetail_selection}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showSearchItemWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showSearchItemWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="searchItemForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="searchItem-search"
											value="#{bundle.aon_search}"
											actionListener="#{controller.searchItems}"
											reRender="#{modalReRender}"
											styleClass="aon-finding-toolbar-item aon-icon-search">
											<rich:componentControl for="searchItemModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showSearchItemWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="searchItem-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showSearchItemWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{controller.showSearchItemWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>

									<aon:div styleClass="aon-scroll-area" style="margin-top: 1em;">
										<aon:div styleClass="aon-panelGrid-search">
											<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

												<ui:include src="/com/code/aon/ui/product/facelet/product/item/searchContent.xhtml">
													<ui:param name="controller" value="#{item}" />
													<ui:param name="searchController" value="#{itemSearch}" />
													<ui:param name="aliasPreffix" value="Item" />
												</ui:include>

											</aon:panelGrid>
										</aon:div>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
