<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:if test="#{aonConfiguration.bean.product.showBarcode}">
		<aon:outputLabel for="#{aliasPreffix}_barcode"
			value="#{bundle.product_barcode}" />
		<aon:inputText id="#{aliasPreffix}_barcode" size="25"
			value="#{productExport.barcode}"
			valueChangeListener="#{controller.addExpression}" />
	</aon:if>

	<aon:if test="#{aonConfiguration.bean.product.showSerializable}">
		<aon:outputLabel for="#{aliasPreffix}_serialNumber"
			value="#{bundle.aon_serial_or_lot_number}" />
		<aon:inputText id="#{aliasPreffix}_serialNumber" size="25"
			value="#{productExport.serialNumber}"
			valueChangeListener="#{controller.addExpression}" />

		<aon:outputLabel value="#{bundle.aon_serial_or_lot_date}" />
		<aon:div>
			<aon:outputLabel for="#{aliasPreffix}_serialDate-From" styleClass="aon-form-date-label aon-padding-right" 
				value="#{bundle.aon_date_from}:" />
			<aon:selectInputDate id="#{aliasPreffix}_serialDate-From"
				value="#{productExport.itemSerialDate1}"
				valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />

			<aon:outputLabel for="#{aliasPreffix}_serialDate-To" styleClass="aon-form-date-label aon-padding-right"
				value="#{bundle.aon_date_to}" />
			<aon:selectInputDate id="#{aliasPreffix}_serialDate-To"
				value="#{productExport.itemSerialDate2}"
				valueChangeListener="#{controller.addLessThanOrEqualExpression}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
		</aon:div>
	</aon:if>

	<aon:if test="#{product.detailLevel &gt; 0}">
		<aon:outputLabel for="#{aliasPreffix}_detail"
			value="#{bundle.aon_detail}" />
		<aon:inputText id="#{aliasPreffix}_detail" size="25"
			value="#{productExport.detail}"
			valueChangeListener="#{controller.addExpression}" />
	
		<aon:if test="#{product.detailLevel &gt; 1}">
			<aon:outputLabel for="#{aliasPreffix}_detail2"
				value="#{bundle.product_detail2}" />
			<aon:inputText id="#{aliasPreffix}_detail2" size="25"
				value="#{productExport.detail2}"
				valueChangeListener="#{controller.addExpression}" />

			<aon:if test="#{product.detailLevel &gt; 2}">
				<aon:outputLabel for="#{aliasPreffix}_detail3"
					value="#{bundle.product_detail3}" />
				<aon:inputText id="#{aliasPreffix}_detail3" size="25"
					value="#{productExport.detail3}"
					valueChangeListener="#{controller.addExpression}" />
			</aon:if>
		</aon:if>
	</aon:if>
		
	<aon:outputLabel for="#{aliasPreffix}_description"
		value="#{bundle.aon_description}" />
	<aon:inputText id="#{aliasPreffix}_description" size="50"
		value="#{productExport.description}"
		valueChangeListener="#{controller.addExpression}" />
		
	<aon:if test="#{aonConfiguration.bean.product.showSuppliers}">
		<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
			<ui:param name="lookupTo" value="#{searchController.supplier}" />
			<ui:param name="skipNewButton" value="#{true}" />
			<ui:param name="lookupSuffix" value="-Item" />
		</ui:include>
		
		<aon:outputLabel for="#{aliasPreffix}_supplier_code"
			value="#{bundle.product_item_supplier_code_abbr}" />
		<aon:inputText id="#{aliasPreffix}_supplier_code" size="25"
			value="#{searchController.supplierCode}"  />
	</aon:if>
		
	<aon:outputLabel for="#{aliasPreffix}_purchasePrice"
		value="#{bundle.product_purchase_price}" />
	<aon:inputText id="#{aliasPreffix}_purchasePrice" size="25"
		value="#{productExport.purchasePrice}"
		valueChangeListener="#{controller.addExpression}" />
	
	<aon:outputLabel for="#{aliasPreffix}_profitPercent"
		value="% #{bundle.aon_profit}" />
	<aon:inputText id="#{aliasPreffix}_profitPercent" size="25"
		value="#{productExport.profitPercent}"
		valueChangeListener="#{controller.addExpression}" />
	
	<aon:outputLabel for="#{aliasPreffix}_price"
		value="#{bundle.product_sales_base_price}" />
	<aon:inputText id="#{aliasPreffix}_price" size="25"
		value="#{productExport.price}"
		valueChangeListener="#{controller.addExpression}" />
	
	<aon:if test="#{aonConfiguration.bean.product.showEcommerceData}">
		<aon:outputLabel for="#{aliasPreffix}_internet"
			value="#{bundle.product_ecommerce}" />
		<aon:selectOneRadio id="#{aliasPreffix}_internet"
			value="#{productExport.internet}"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneRadio>
	</aon:if>		
	
	<aon:outputText for="#{aliasPreffix}_status"
		value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox id="#{aliasPreffix}_status"
		value="#{searchController.itemStatuses}">
		<f:selectItems value="#{productCollections.productStatuses}"/>
	</aon:selectManyCheckbox>				
		
</ui:composition>
