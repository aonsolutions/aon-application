<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<c:if test="#{aonConfiguration.bean.product.showBarcode}">
		<aon:outputLabel for="Product_items_barcode"
			value="#{productBundle.product_barcode}" />
		<aon:inputText id="Product_items_barcode" size="25"
			valueChangeListener="#{controller.addExpression}" />
	</c:if>

	<c:if test="#{product.detailLevel &gt; 0}">
		<aon:outputLabel for="Product_items_detail"
			value="#{bundle.aon_detail}" />
		<aon:inputText id="Product_items_detail" size="50"
			valueChangeListener="#{controller.addExpression}" />
	
		<c:if test="#{product.detailLevel &gt; 1}">
			<aon:outputLabel for="Product_items_detail2"
				value="#{productBundle.product_detail2}" />
			<aon:inputText id="Product_items_detail2" size="50"
				valueChangeListener="#{controller.addExpression}" />

			<c:if test="#{product.detailLevel &gt; 2}">
				<aon:outputLabel for="Product_items_detail3"
					value="#{productBundle.product_detail3}" />
				<aon:inputText id="Product_items_detail3" size="50"
					valueChangeListener="#{controller.addExpression}" />
			</c:if>
		</c:if>
	
	</c:if>
		
	<aon:outputLabel for="Product_items_description"
		value="#{bundle.aon_description}" />
	<aon:inputText id="Product_items_description" size="50"
		valueChangeListener="#{controller.addExpression}" />
		
	<c:if test="#{aonConfiguration.bean.product.showSuppliers}">
		<ui:include src="/com/code/aon/ui/supplier/facelet/supplier/lookup.xhtml">
			<ui:param name="lookupTo" value="#{searchController.supplier}" />
			<ui:param name="skipNewButton" value="#{true}" />
			<ui:param name="lookupSuffix" value="-Item" />
		</ui:include>	
	</c:if>
		
	<c:if test="#{aonConfiguration.bean.product.showEcommerceData}">
		<aon:outputLabel for="Product_items_internet"
			value="#{productBundle.product_ecommerce}" />
		<aon:selectOneRadio id="Product_items_internet"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneRadio>
	</c:if>		
	
	<aon:outputLabel for="Product_items_purchasePrice"
		value="#{productBundle.product_purchase_price}" />
	<aon:inputText id="Product_items_purchasePrice" size="25"
		valueChangeListener="#{controller.addExpression}" />
	
	<aon:outputLabel for="Product_items_profitPercent"
		value="% #{bundle.aon_profit}" />
	<aon:inputText id="Product_items_profitPercent" size="25"
		valueChangeListener="#{controller.addExpression}" />
	
	<aon:outputLabel for="Product_items_price"
		value="#{productBundle.product_sales_base_price}" />
	<aon:inputText id="Product_items_price" size="25"
		valueChangeListener="#{controller.addExpression}" />
	
	<aon:outputText for="Product_items_status"
		value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox id="Product_items_status"
		value="#{searchController.itemStatuses}">
		<f:selectItems value="#{productCollections.productStatuses}"/>
	</aon:selectManyCheckbox>				
		
</ui:composition>
