<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="itemForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{productBundle.product_module}" />
				<ui:param name="controller" value="#{item}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{item.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="item_list" />

					<ui:include src="/com/code/aon/ui/product/facelet/item/searchContent.xhtml" >
						<ui:param name="controller" value="#{item}" />
					</ui:include>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
