<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="fieldDisabled" default="#{lookup != null and productTo.id != null}" />

	<aon:outputLabel for="Product_code" value="#{bundle.aon_id}" />
	<aon:inputText id="Product_code" 
		value="#{productTo.code}" size="20" maxlength="15" 
		onblur="toUpperCase(this);" required="true"
		disabled="#{fieldDisabled}" />

	<aon:outputLabel for="Product_name" value="#{bundle.aon_name}" />
	<aon:inputText id="Product_name" 
		value="#{productTo.name}" required="true"
		size="64" maxlength="64"
		disabled="#{fieldDisabled}" />

	<aon:if test="#{aonConfiguration.bean.product.showType}">
		<aon:outputLabel for="Product_type"
			value="#{bundle.aon_type}" />
		<aon:selectOneMenu id="Product_type" styleClass="aon-margin-right"
			value="#{productTo.type}" required="true"
			disabled="#{fieldDisabled}">
			<f:selectItems value="#{productCollections.commonProductTypes}" />
		</aon:selectOneMenu>
	</aon:if>

	<aon:outputLabel for="Product_category" value="#{bundle.aon_category}" />
	<aon:selectOneMenu id="Product_category"
		value="#{productTo.category}"
		disabled="#{fieldDisabled or (!controller.nevv and productTo.itemCount > 1)}"
		reRender="#{categoryChangeReRender}" ajaxSingle="false">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{productCollections.categories}" />
	</aon:selectOneMenu>

	<aon:if test="#{aonConfiguration.bean.product.showBrand and productCollections.brandsCount > 0}">
		<aon:outputLabel for="Product_brand" value="#{bundle.tas_make}" />
		<aon:selectOneMenu id="Product_brand" value="#{productTo.brand}"
			disabled="#{fieldDisabled}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{productCollections.brands}" />
		</aon:selectOneMenu>
	</aon:if>

	<aon:if test="#{productSearch.selectableTagsCount > 0}">
		<ui:include src="/com/code/aon/ui/config/facelet/tag/input.xhtml">
			<ui:param name="searchController" value="#{productSearch}" />
		</ui:include>	
	</aon:if>

	<aon:outputLabel for="Product_vat" value="#{bundle.aon_vat}" />
	<aon:div>
		<aon:selectOneMenu id="Product_vat" 
			value="#{productTo.vat}" required="true"
			disabled="#{fieldDisabled}"
			reRender="Product_vat_percentage,Item_sales_price" ajaxSingle="true">
			<f:selectItems value="#{configCollections.vatTaxes}" />
		</aon:selectOneMenu>
		<aon:outputLabel id="Product_vat_percentage" styleClass="aon-margin-left aon-italic"
			value="#{productTo.vat.percentage}">
			<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
		</aon:outputLabel>
		<aon:outputLabel value="%" />
	</aon:div>

	<aon:outputLabel for="Product_retention" value="#{bundle.aon_retention}" />
	<aon:div>
		<aon:selectOneMenu id="Product_retention" 
			value="#{productTo.retention}"
			disabled="#{fieldDisabled}"
			reRender="Product_retention_percentage,Item_sales_price" ajaxSingle="true">
			<f:selectItem itemLabel="-" itemValue="" />
			<f:selectItems value="#{configCollections.retentionTaxes}" />
		</aon:selectOneMenu>
		<aon:panelGroup id="Product_retention_percentage">
			<aon:outputLabel styleClass="aon-margin-left aon-italic"
				value="#{productTo.retention.percentage}"
				rendered="#{productTo.withholding}">
				<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
			</aon:outputLabel>
			<aon:outputLabel value="%" rendered="#{productTo.withholding}" />
		</aon:panelGroup>
	</aon:div>

	<aon:if test="#{aonConfiguration.bean.product.showSerializable and warehouseCollections.warehouseCount > 0}">
		<aon:outputLabel for="Product_serializable" value="#{bundle.aon_serializable}"
			rendered="#{controller.nevv or productTo.serializable or productTo.itemCount == 1}" />
		<aon:panelGrid id="Product_serializable_panel" styleClass="aon-noborder"
			columns="2" columnClasses="aon-width-110, aon-width-auto"
			rendered="#{controller.nevv or productTo.itemCount == 1}">
			<aon:selectOneRadio id="Product_serializable"
				styleClass="aon-vertical-align-middle" style="display:inline-table;" 
				value="#{productTo.serializable}"
				disabled="#{fieldDisabled or productTo.composition}"
				valueChangeListener="#{controller.onSerializableChanged}"
				ajaxSingle="true" reRender="Product_serializable_panel,Product_features">
				<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
				<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
			</aon:selectOneRadio>
			<aon:div style="display:inline;"
				rendered="#{productTo.serializable}">
				<aon:outputLabel for="Product_lotable" 
					styleClass="aon-margin-left aon-margin-right aon-bold aon-italic aon-vertical-align-middle"
					value="#{bundle.aon_serialization_type}" />
				<aon:selectOneRadio id="Product_lotable"
					styleClass="aon-vertical-align-middle" style="display:inline-table;" 
					value="#{productTo.lotable}"
					disabled="#{fieldDisabled}">
					<f:selectItem itemLabel="#{bundle.aon_serializable_unitary}" itemValue="#{false}" />
					<f:selectItem itemLabel="#{bundle.aon_serializable_batch}" itemValue="#{true}" />
				</aon:selectOneRadio>
			</aon:div>
		</aon:panelGrid>
		<aon:panelGroup rendered="#{!controller.nevv and productTo.serializable and productTo.itemCount > 1}">
			<aon:outputLabel styleClass="aon-bold aon-italic"
				value="#{bundle.aon_serializable_unitary}"
				rendered="#{!productTo.lotable}" />
			<aon:outputLabel styleClass="aon-bold aon-italic"
				value="#{bundle.aon_serializable_batch}"
				rendered="#{productTo.lotable}" />
		</aon:panelGroup>
	</aon:if>

	<aon:if test="#{aonConfiguration.bean.product.showStock or aonConfiguration.bean.product.showComposition}">
		<aon:outputLabel value="#{bundle.asset_features}" />
		<aon:div id="Product_features">
			<aon:if test="#{aonConfiguration.bean.product.showStock and warehouseCollections.warehouseCount > 0}">
				<aon:selectBooleanCheckbox id="Product_inventoriable"
					value="#{productTo.inventoriable}"
					rendered="#{!productTo.composition}"
					disabled="#{fieldDisabled or productTo.serializable or productTo.stock > 0}"
					ajaxSingle="true" reRender="Product_features" />
				<aon:outputLabel for="Product_inventoriable" styleClass="aon-margin-right aon-italic"
					value="#{bundle.product_inventoriable}"
					rendered="#{!productTo.composition}" />
			</aon:if>

			<aon:if test="#{aonConfiguration.bean.product.showComposition}">
				<aon:if test="#{warehouseCollections.warehouseCount > 0}">
					<aon:selectBooleanCheckbox id="Product_manufactured"
						value="#{productTo.manufactured}"
						disabled="#{fieldDisabled}"
						rendered="#{!productTo.composition}"
						valueChangeListener="#{controller.onManufacturedChanged}"
						ajaxSingle="true" reRender="Product_features" />
					<aon:outputLabel for="Product_manufactured" styleClass="aon-margin-right aon-italic"
						value="#{bundle.product_manufactured_product}"
						rendered="#{!productTo.composition}" />
				</aon:if>

				<aon:selectBooleanCheckbox id="Product_composition"
					value="#{productTo.composition}"
					disabled="#{fieldDisabled}"
					rendered="#{!productTo.inventoriable and !productTo.manufactured}"
					valueChangeListener="#{controller.onCompositionChanged}"
					ajaxSingle="true" reRender="Product_serializable_panel,Product_features" />
				<aon:outputLabel for="Product_composition" styleClass="aon-margin-right aon-italic"
					value="#{bundle.product_composite_product}"
					rendered="#{!productTo.inventoriable and !productTo.manufactured}" />

				<aon:panelGroup id="Product_composition_price">
					<aon:selectBooleanCheckbox value="#{productTo.compositionPrice}"
						disabled="#{fieldDisabled}"
						rendered="#{productTo.composition}" />
					<aon:outputLabel for="Product_composition_price" styleClass="aon-margin-right aon-italic"
						value="#{bundle.product_composition_price}"
						rendered="#{productTo.composition}" />
				</aon:panelGroup>
			</aon:if>
		</aon:div>
	</aon:if>

	<aon:outputLabel for="Product_status" value="#{bundle.aon_status}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-240, aon-width-auto">
		<aon:selectOneRadio id="Product_status" value="#{productTo.status}"
			disabled="#{fieldDisabled}">
			<f:selectItems value="#{productCollections.productStatuses}" />
		</aon:selectOneRadio>
		<aon:if test="#{!controller.nevv and productTo.inventoriable}">
			<aon:div>
				<aon:outputLabel styleClass="aon-margin-right aon-bold aon-uppercase"
					value="#{bundle.product_stock} #{bundle.aon_product}:" />
				<aon:outputText value="#{productTo.stock}" styleClass="aon-bold">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
			</aon:div>
		</aon:if>
	</aon:panelGrid>

</ui:composition>
