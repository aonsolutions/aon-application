<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/lookupAudit.xhtml" >
		<ui:param name="lookupBean" value="#{productLookup}" />
		<ui:param name="lookupInputValue" value="#{lookupTo.code}"/>
		<ui:param name="lookupInputSize" value="10"/>
		<ui:param name="lookupInputMaxLength" value="15"/>
		<ui:param name="lookupInputOnSubmit" value="toUpperCase(this);"/>
		<ui:param name="lookupInputSuggestValue" value="#{lookupTo.name}"/>
		<ui:param name="lookupInputSuggestExpression" value="#{lto.name} (#{lto.code})"/>		
		<ui:param name="lookupLabel" value="#{bundle.aon_product}" />
		<ui:param name="controller" value="#{product}" />
		<ui:param name="searchButtonTitle" value="#{bundle.product_item_selection}" />
		<ui:param name="skipNewButton" value="#{true}" />

		<ui:define name="lookupInputTextContent">
			<aon:joinProperty alias="Product_code" value="#{lookupInputValue}" />
		</ui:define>		
	</ui:decorate>

</ui:composition>
