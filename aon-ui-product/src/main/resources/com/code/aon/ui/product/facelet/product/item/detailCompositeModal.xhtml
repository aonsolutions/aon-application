<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showItemCompositionWindow">
		<aon:if test="#{controller.showItemCompositionWindow}">
			<rich:modalPanel id="itemCompositionModalPanel" minHeight="360"
				minWidth="780" rendered="#{controller.showItemCompositionWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_to_specify} #{bundle.product_composition}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showItemCompositionWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showItemCompositionWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="itemCompositionForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="itemComposition-accept"
										value="#{bundle.aon_accept}"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
										<rich:componentControl for="itemCompositionModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showItemCompositionWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="itemComposition-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showItemCompositionWindow"
										actionListener="#{controller.discard}"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<rich:componentControl for="itemCompositionModalPanel"
											event="onclick" operation="hide"/>
										<f:setPropertyActionListener
											target="#{controller.showItemCompositionWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 1em;">
								
								<aon:div id="compose-item">
									<aon:panel>
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_product}" />
										</f:facet>
										<aon:outputText value="#{controller.composeItem.fullName}" />
									</aon:panel>
								</aon:div>
								
								<aon:div id="item-composition">
									<aon:panel>
										<f:facet name="header">
											<aon:outputText value="#{bundle.product_composition}" />
										</f:facet>
										<aon:div styleClass="aon-margin-top">
											<aon:dataTable id="compositionData" var="to" rows="10" 
												value="#{controller.compositionModel}"
												rendered="#{controller.compositionModel.rowCount > 0}">
												
												<aon:column styleClass="aon-editDataTable-textColumn">
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_product}" />
													</f:facet>
													<aon:outputText value="#{to.compositionItem.fullName}" />
												</aon:column>
												
												<aon:column styleClass="aon-editDataTable-textColumn">
													<f:facet name="header">
														<aon:outputText value="#{bundle.aon_quantity}" />
													</f:facet>
													<aon:outputText value="#{to.quantity}" />
												</aon:column>
												
											</aon:dataTable>
											
											<aon:dataScroller for="compositionData" showNote="true" pageSize="10"
												rowCount="#{controller.compositionModel.rowCount}" />
										</aon:div> 
									</aon:panel>
								</aon:div>
								
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>
	
</ui:composition>
