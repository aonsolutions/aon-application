<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.filter.xhtml">

	<ui:define name="filterContent">
		<aon:inputText
			id="onEditSearch"
			style="display:none;" 
			valueChangeListener="#{product.onEditSearch}"
		/>
		<ui:include src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/shared/filterContent.xhtml">
			<ui:param name="controller" value="#{product}" />
			<ui:define name="searchContent">
				<ui:include src="/com/code/aon/ui/product/facelet/product/filterContent.xhtml" >
					<ui:param name="searchController" value="#{productSearch}" />
				</ui:include>
			</ui:define>
		</ui:decorate>
		<aon:if test="#{aonConfiguration.bean.product.showProduct}">
			<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
		</aon:if>			
		<aon:if test="#{aonConfiguration.bean.product.showSeller}">
			<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		</aon:if>
		<aon:if test="#{aonConfiguration.bean.product.showProfile}">
			<aon:lookupButtonPopup lookup="#{questionLookup}" />
		</aon:if>			
	</ui:define>
</ui:composition>
