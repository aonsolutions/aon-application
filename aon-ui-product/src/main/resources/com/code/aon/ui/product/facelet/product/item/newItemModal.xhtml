<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<aon:methodParam name="ndm_saveActionListener"
		value="#{product.onAcceptItem}" type="actionListener" />
	<aon:methodParam name="ndm_cancelActionListener"
		value="#{product.onCancelItem}" type="actionListener" />

	<ui:decorate template="/com/code/aon/ui/product/facelet/item/newDetailModal.xhtml">
		<ui:param name="detailId" value="Item" />
		<ui:param name="minWidth" value="640" />
		<ui:param name="minHeight" value="420" />
		<ui:param name="modalTitle" value="#{bundle.aon_detail}" />
		<ui:param name="showNewDetailWindow" value="#{controller.showNewItemWindow}" />
		<ui:param name="detailController" value="#{itemController}" />
	
		<ui:define name="afterContent">
			<aon:panelGrid id="productNewDiv" columns="2"
				columnClasses="aon-panelGrid-odd aon-width-150,	aon-panelGrid-even aon-width-450" >

				<ui:include src="/com/code/aon/ui/product/facelet/product/item/formNewContent.xhtml">
					<ui:param name="controller" value="#{itemController}" />
					<ui:param name="itemTo" value="#{itemController.to}" />
				</ui:include>

				<ui:include src="/com/code/aon/ui/product/facelet/product/item/formPrices.xhtml" >
					<ui:param name="controller" value="#{itemController}" />
					<ui:param name="itemTo" value="#{itemController.to}" />
				</ui:include>

			</aon:panelGrid>
		</ui:define>
		
	</ui:decorate>
	
</ui:composition>
