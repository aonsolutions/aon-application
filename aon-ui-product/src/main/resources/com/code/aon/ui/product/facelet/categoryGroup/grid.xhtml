<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="categoryList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{productBundle.product_categoryGroup_module}" />
					<ui:param name="controller" value="#{productCategoryGroup}" />
				</ui:include>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{productCategoryGroup}" />
						<ui:define name="columns">

							<aon:column styleClass="aon-editDataTable-textColumn"
								alias="ProductCategoryGroup.name">
								<f:facet name="header">
									<aon:outputLabel for="ProductCategoryGroup_name"
										value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.name}" rendered="#{formList}" />
								<aon:inputText id="ProductCategoryGroup_name"
									size="32" maxlength="32" 
									rendered="#{formEdit}" required="true"
									value="#{controller.to.name}"  />
								<f:facet name="footer">
									<aon:inputText id="ProductCategoryGroup_name-New"
										size="32" maxlength="32"									
										value="#{controller.to.name}"
										rendered="#{formNew}" required="true" />
								</f:facet>
							</aon:column>

						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
