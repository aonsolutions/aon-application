<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
		<ui:param name="searchController" value="#{productSearch}" />
	</aon:if>

	<aon:outputLabel for="Product_code" value="#{bundle.aon_id}" />
	<aon:inputText id="Product_code" size="25"
		value="#{productExport.code}"
		valueChangeListener="#{controller.addExpression}"
		onblur="toUpperCase(this);" />

	<aon:outputLabel for="Product_name"
		value="#{bundle.aon_name}" />
	<aon:inputText id="Product_name" size="50"
		value="#{productExport.name}"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Product_category_id"
		value="#{bundle.aon_category}" />
	<aon:selectOneMenu id="Product_category_id"
		value="#{searchController.category}">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{productCollections.categories}" />
	</aon:selectOneMenu>

	<aon:if test="#{searchController.selectableTagsCount > 0}">
		<ui:include src="/com/code/aon/ui/config/facelet/tag/input.xhtml" />
	</aon:if>

	<aon:if test="#{aonConfiguration.bean.product.showBrand and productCollections.brandsCount > 0}">
		<aon:outputLabel for="Product_brand_id"
			value="#{bundle.tas_make}" />
		<aon:selectOneMenu id="Product_brand_id"
			value="#{productExport.brand}"
			valueChangeListener="#{controller.addIdEqualExpression}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{productCollections.brands}" />
		</aon:selectOneMenu>
	</aon:if>
	
	<aon:if test="#{aonConfiguration.bean.product.showSerializable}">
		<aon:outputLabel for="Product_serializable"
			value="#{bundle.aon_serializable}" />
		<aon:selectOneRadio id="Product_serializable"
			value="#{productExport.serializable}"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
		</aon:selectOneRadio>
	</aon:if>	

	<aon:if test="#{aonConfiguration.bean.product.showStock and warehouseCollections.warehouseCount > 0}">
		<aon:outputLabel for="Product_inventoriable"
			value="#{bundle.product_inventoriable}" />
		<aon:selectOneRadio id="Product_inventoriable"
			value="#{productExport.inventoriable}"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneRadio>
	</aon:if>

	<aon:if test="#{aonConfiguration.bean.product.showComposition}">
		<aon:if test="#{warehouseCollections.warehouseCount > 0}">
			<aon:outputLabel for="Product_manufactured"
				value="#{bundle.product_manufactured_product}" />
			<aon:selectOneRadio id="Product_manufactured"
				value="#{productExport.manufactured}"
				valueChangeListener="#{controller.addExpression}">
				<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
				<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
			</aon:selectOneRadio>
		</aon:if>

		<aon:outputLabel for="Product_composition"
			value="#{bundle.product_composite_product}" />
		<aon:selectOneRadio id="Product_composition"
			value="#{productExport.composition}"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneRadio>
	</aon:if>

	<aon:if test="#{configCollections.packingTypeTagsCount > 0}">
		<aon:outputLabel for="Product_packaged"
			value="#{bundle.product_packaged}" />
		<aon:selectOneRadio id="Product_packaged"
			value="#{productExport.packaged}"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneRadio>
	</aon:if>

	<aon:outputText for="Product_status"
		value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox id="Product_status"
		value="#{searchController.statuses}">
		<f:selectItems value="#{productCollections.productStatuses}"/>
	</aon:selectManyCheckbox>				

</ui:composition>
