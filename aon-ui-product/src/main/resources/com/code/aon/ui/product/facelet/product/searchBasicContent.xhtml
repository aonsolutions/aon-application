<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<c:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
		<ui:param name="searchController" value="#{productSearch}" />
	</c:if>

	<aon:outputLabel for="Product_code" value="#{bundle.aon_id}" />
	<aon:inputText id="Product_code" size="25"
		valueChangeListener="#{controller.addExpression}"
		onblur="toUpperCase(this);" />

	<aon:outputLabel for="Product_name"
		value="#{bundle.aon_name}" />
	<aon:inputText id="Product_name" size="50"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Product_category_id"
		value="#{bundle.aon_category}" />
	<aon:selectOneMenu id="Product_category_id"
		value="#{productCollections.category}"
		valueChangeListener="#{controller.addIdEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{productCollections.categories}" />
	</aon:selectOneMenu>
	
	<ui:include 
		src="/com/code/aon/ui/config/facelet/tag/input.xhtml" />
	
	<c:if test="#{aonConfiguration.bean.product.showBrand and productCollections.brandsCount > 0}">
		<aon:outputLabel for="Product_brand_id"
			value="#{bundle.tas_make}" />
		<aon:selectOneMenu id="Product_brand_id"
			value="#{productCollections.brand}"
			valueChangeListener="#{controller.addIdEqualExpression}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{productCollections.brands}" />
		</aon:selectOneMenu>
	</c:if>
	
	<aon:outputLabel for="Product_vat" value="#{bundle.aon_vat}" />
	<aon:div id="Product_vatDiv">
		<aon:selectOneMenu id="Product_vat" value="#{searchController.vat}"
			ajaxSingle="true" reRender="Product_vatDiv"
			focus="Product_retention">
			<f:selectItem itemLabel="-" itemValue="" />
			<f:selectItems value="#{configCollections.vatTaxes}" />
		</aon:selectOneMenu>
		<c:if test="#{searchController.vat.id != null}">
			<aon:outputText styleClass="aon-margin-left aon-italic"
				value="#{searchController.vat.percentage}">
				<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
			</aon:outputText>
			<aon:outputLabel value="%" />
		</c:if>
	</aon:div>
	
	<aon:outputLabel for="Product_retention" value="#{bundle.aon_retention}" />
	<aon:div id="Product_retentionDiv">
		<aon:selectOneMenu id="Product_retention" value="#{searchController.retention}"
			ajaxSingle="true" reRender="Product_retentionDiv">
			<f:selectItem itemLabel="-" itemValue="" />
			<f:selectItems value="#{configCollections.retentionTaxes}" />
		</aon:selectOneMenu>
		<c:if test="#{searchController.retention.id != null}">
			<aon:outputLabel styleClass="aon-margin-left aon-italic"
				value="#{searchController.retention.percentage}" >
				<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
			</aon:outputLabel>
			<aon:outputLabel value="%" />
		</c:if>
	</aon:div>	
	
	<c:if test="#{aonRole.accountingOperator and aonConfiguration.bean.product.showAccount}">
		<aon:outputLabel for="Account_id-Sales"
			value="#{bundle.aon_sales_account}" />
		<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
			<ui:param name="lookupTo" value="#{searchController.salesAccount}" />
			<ui:param name="lookupSuffix" value="-Sales" />
			<ui:param name="skipNewButton" value="#{true}" />
		</ui:include>
		
		<aon:outputLabel for="Account_id-Purchase"
			value="#{bundle.aon_purchase_account}" />
		<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
			<ui:param name="lookupTo" value="#{searchController.purchaseAccount}" />
			<ui:param name="lookupSuffix" value="-Purchase" />
			<ui:param name="skipNewButton" value="#{true}" />
		</ui:include>
	</c:if>	
	
	<c:if test="#{aonConfiguration.bean.product.showStock}">
		<aon:outputLabel for="Product_inventoriable"
			value="#{bundle.product_inventoriable}" />
		<aon:selectOneRadio id="Product_inventoriable"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneRadio>
	</c:if>

	<c:if test="#{aonConfiguration.bean.product.showComposition}">
		<aon:outputLabel for="Product_composition"
			value="#{bundle.product_composite_product}" />
		<aon:selectOneRadio id="Product_composition"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneRadio>
	</c:if>

	<aon:outputText for="Product_status"
		value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox id="Product_status"
		value="#{searchController.statuses}">
		<f:selectItems value="#{productCollections.productStatuses}"/>
	</aon:selectManyCheckbox>				

	<c:if test="#{aonConfiguration.bean.product.showType}">
		<aon:outputLabel for="Product_type" value="#{bundle.aon_type}" />
		<aon:selectManyCheckbox id="Product_type"
			value="#{searchController.types}">
			<f:selectItems value="#{productCollections.noExpenseProductTypes}" />
		</aon:selectManyCheckbox>
	</c:if>	

</ui:composition>
