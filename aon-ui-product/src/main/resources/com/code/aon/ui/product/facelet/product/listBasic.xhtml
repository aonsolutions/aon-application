<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<c:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
		<ui:param name="abbreviateName" value="#{true}"/>
	</c:if>
	
	<aon:column alias="Product.category.name"
		styleClass="aon-editDataTable-textColumn aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{productBundle.product_category}" />
		</f:facet>
		<aon:outputText value="#{to.category.name}" />
	</aon:column>

	<aon:column alias="Product.name"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_name}" />
		</f:facet>
		<aon:outputText value="#{to.name}">
			<c:if test="#{abbreviateName}">
				<aon:abbreviateConverter maxWidth="40" />
			</c:if>		
		</aon:outputText>
	</aon:column>

	<aon:column alias="Product.code"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_id}" />
		</f:facet>
		<aon:outputText value="#{to.code}" />
	</aon:column>

</ui:composition>

</body>
</html>
