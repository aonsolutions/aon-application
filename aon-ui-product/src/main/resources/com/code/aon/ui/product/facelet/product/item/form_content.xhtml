<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

	<aon:panelGrid columns="2" cellpadding="5" styleClass="aon-panelGrid-formatting"
		columnClasses="aon-width-half aon-vertical-align-top,aon-width-half aon-vertical-align-top">

		<aon:panelGrid columns="2" styleClass="aon-width-all" >
	
			<aon:outputLabel for="Item_product_detail"
				value="#{productBundle.product_detail}" />
			<aon:inputText id="Item_product_detail" 
				value="#{controller.to.detail}" size="25" maxlength="15" />
	
			<c:if test="#{aonConfiguration.bean.product.showBarcode}">
				<aon:outputLabel for="Item_barcode"
					value="#{productBundle.product_barcode}" />
				<aon:inputText id="Item_barcode" 
					value="#{controller.to.barcode}" size="25" maxlength="32" />
	 		</c:if>
	
			<aon:outputLabel for="Item_description" value="#{bundle.aon_description}" />
		 	<aon:div style="margin-bottom: 0.5em;">
				<aon:inputTextarea id="Item_description"
					value="#{controller.to.description}" cols="64" rows="4" />
		 	</aon:div>
	
			<aon:outputLabel for="Item_status" value="#{bundle.aon_status}" />
			<aon:selectOneRadio id="Item_status" value="#{controller.to.status}">
				<f:selectItems value="#{productCollections.productStatuses}" />
			</aon:selectOneRadio>

			<c:if test="#{aonConfiguration.bean.product.showEcommerceData}">
				<aon:selectBooleanCheckbox id="Item_internet" 
					value="#{controller.to.internet}" />
				<aon:outputLabel for="Item_internet" styleClass="aon-margin-right aon-italic"
					value="#{productBundle.product_ecommerce_available}" />
			</c:if>
			
		</aon:panelGrid>
		
		<aon:div styleClass="aon-group">
			<aon:div styleClass="aon-group-title">
				<aon:outputText value="#{productBundle.product_basic_sales_tariff}"/>
			</aon:div>
			<aon:div styleClass="aon-group-body"> 	
				<aon:div styleClass="aon-group-body-internal">
					<a4j:region>
						<aon:panelGrid columns="2" styleClass="aon-width-all"
							columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">

							<ui:include src="/com/code/aon/ui/product/facelet/product/item/formPrices.xhtml" >
								<ui:param name="itemTo" value="#{controller.to}" />
							</ui:include>
							
						</aon:panelGrid>
					</a4j:region>
				</aon:div>
			</aon:div>
		</aon:div>
		
	</aon:panelGrid>

</ui:composition>
