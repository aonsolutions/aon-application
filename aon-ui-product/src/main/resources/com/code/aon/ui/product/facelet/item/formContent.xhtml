<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGrid columns="4" style="width: 100%;"
		columnClasses="aon-panelGrid-odd aon-width-150,
			aon-panelGrid-even aon-width-200,
			aon-panelGrid-odd aon-width-100,
			aon-panelGrid-even aon-width-auto">
		<aon:outputLabel for="Item_product_code" value="#{bundle.aon_id}" />
		<aon:inputText id="Item_product_code" value="#{controller.to.product.code}"
			required="true" size="20" maxLength="15" onblur="toUpperCase(this);" />
	
		<aon:outputLabel for="Item_status" value="#{bundle.aon_status}" />
		<aon:selectOneMenu id="Item_status" value="#{controller.to.status}">
			<f:selectItems value="#{productCollections.productStatuses}" />
		</aon:selectOneMenu>
	</aon:panelGrid>

	<aon:panelGrid styleClass="aon-margin-top"
		columns="2" style="width: 100%;"
		columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
		<aon:outputLabel for="Item_product_name" value="#{bundle.aon_description}" />
		<aon:inputText id="Item_product_name" value="#{controller.to.product.name}"
			required="true" size="100" maxLength="64" />
	
		<aon:outputLabel for="Item_product_detail" value="#{productBundle.product_detail}" />
		<aon:inputTextarea id="Item_product_detail" cols="100" rows="3" 
			value="#{controller.to.description}"/>
	</aon:panelGrid>

	<aon:panelGrid columns="4" styleClass="aon-margin-top" style="width: 100%;"
		columnClasses="aon-panelGrid-odd aon-width-150,
			aon-panelGrid-even aon-width-200,
			aon-panelGrid-odd aon-width-100,
			aon-panelGrid-even aon-width-auto">
		<aon:outputLabel for="Item_product_category" value="#{productBundle.product_category}" />
		<aon:selectOneMenu id="Item_product_category" value="#{controller.to.product.category}">
			<f:selectItems value="#{productCollections.categories}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="Item_product_brand" value="#{productBundle.product_brand}" />
		<aon:selectOneMenu id="Item_product_brand" value="#{controller.to.product.brand}">
			<f:selectItem itemLabel="-" itemValue="" />
			<f:selectItems value="#{productCollections.brands}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="Item_product_type" value="#{bundle.aon_type}" />
		<aon:selectOneMenu id="Item_product_type" value="#{controller.to.product.type}">
			<f:selectItems value="#{productCollections.productTypes}" />
		</aon:selectOneMenu>
		
		<aon:outputLabel for="Item_internet" value="#{productBundle.product_internet}" />
		<aon:selectOneRadio id="Item_internet" value="#{controller.to.internet}">
			<f:selectItem itemValue="#{false}" itemLabel="#{bundle.aon_no}"/>
			<f:selectItem itemValue="#{true}" itemLabel="#{bundle.aon_yes}" />
		</aon:selectOneRadio>
		
		<aon:outputLabel for="Item_purchase_price" value="#{productBundle.product_purchase_price}" />
		<aon:inputText id="Item_purchase_price" value="#{controller.to.purchasePrice}"
			size="10">
			<f:validateDoubleRange />
		</aon:inputText>

		<aon:outputLabel for="Item_product_vat" value="#{bundle.aon_vat}" />
		<aon:div>
			<aon:selectOneMenu id="Item_product_vat" value="#{controller.to.product.vat}"
				ajaxSingle="true" reRender="Item_product_vat_percentage,Item_sales_price">
				<f:selectItems value="#{configCollections.vatTaxes}" />
			</aon:selectOneMenu>
			<aon:outputText id="Item_product_vat_percentage" value="#{controller.to.product.vat.percentage}" />
			<aon:outputLabel value="%" />
		</aon:div>

		<aon:outputLabel for="Item_price" value="#{bundle.aon_taxable_base}" />
		<aon:inputText id="Item_price" value="#{controller.to.price}"
			reRender="Item_sales_price" required="true" size="10">
			<f:validateDoubleRange />
		</aon:inputText>

		<aon:outputLabel for="Item_product_retention" value="#{bundle.aon_retention}" />
		<aon:div>
			<aon:selectOneMenu id="Item_product_retention" value="#{controller.to.product.retention}"
				ajaxSingle="true" reRender="Item_product_retention_percentage,Item_sales_price">
				<f:selectItem itemLabel="-" itemValue="" />
				<f:selectItems value="#{configCollections.retentionTaxes}" />
			</aon:selectOneMenu>
			<aon:panelGroup id="Item_product_retention_percentage">
				<aon:outputText value="#{controller.to.product.retention.percentage}" />
				<aon:outputLabel value="%" rendered="#{controller.to.product.retention!=null}" />
			</aon:panelGroup>
		</aon:div>

		<aon:outputLabel for="Item_sales_price" value="#{bundle.aon_sales_price}" />
		<aon:inputText id="Item_sales_price" value="#{controller.salesPrice}"
			reRender="Item_price"
			valueChangeListener="#{controller.onSalesPriceChanged}"
			size="10">
			<f:validateDoubleRange/>
		</aon:inputText>
	
		<aon:outputLabel value="#{productBundle.product_inventoriable}" />
		<aon:selectBooleanCheckbox id="Item_product_inventoriable" value="#{controller.to.product.inventoriable}" />
	</aon:panelGrid>
				
</ui:composition>
