<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="itemCatalogueReportList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{productBundle.product_itemCatalogueReport_module}" />
				<ui:param name="controller" value="#{itemCatalogueReport}" />
				<ui:param name="skipResetButton" value="#{true}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="itemCatalogueReport-excel-report" value="&#160;" 
						target="_new" action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="itemCatalogueReport" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="itemCatalogueReport-report" value="#{bundle.aon_listing}"
						target="_new" action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="itemCatalogueReport" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
				
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
			
				<aon:dataTable id="itemCatalogueReportList" value="#{itemCatalogueReport.model}" var="to" rows="20"
					rendered="#{itemCatalogueReport.model.rowCount > 0}">
					
					<aon:rowSelector id="itemCatalogueReportList-select" toggleOnClick="#{false}" />
					
					<aon:column 
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.purchase_workplace}" />
						</f:facet>
						<aon:outputText value="#{to.workplaceDepartment.workPlace.description}"/>
					</aon:column>

					<aon:column 
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.purchase_department}" />
						</f:facet>
						<aon:outputText value="#{to.workplaceDepartment.department.name}"/>
					</aon:column>
					
					<aon:column 
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.catalogueItem.item.product.code}"/>
					</aon:column>
					
					<aon:column 
						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.catalogueItem.item.product.name} #{to.catalogueItem.item.detail}">
							<c:if test="#{abbreviateName}">
								<aon:abbreviateConverter maxWidth="40" />
							</c:if>
						</aon:outputText>
					</aon:column>
						
				</aon:dataTable>
				<aon:dataScroller2 for="itemCatalogueReportList" showNote="true" />
			
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
