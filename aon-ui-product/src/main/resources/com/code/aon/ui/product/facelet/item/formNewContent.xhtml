<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGrid id="productNewDiv" columns="2"
		columnClasses="aon-panelGrid-odd aon-width-150,	aon-panelGrid-even aon-width-450" >

		<aon:if test="#{lookup != null}">
			<ui:param name="controller" value="#{lookup}"/>
		</aon:if>

		<ui:include src="/com/code/aon/ui/product/facelet/product/formBasic.xhtml">
			<ui:param name="productTo" value="#{controller.to.product}" />
			<ui:param name="categoryChangeReRender" value="productNewDiv" />
		</ui:include>

		<ui:include src="/com/code/aon/ui/product/facelet/product/item/formNewContent.xhtml">
			<ui:param name="itemTo" value="#{controller.to}" />
		</ui:include>

		<ui:include src="/com/code/aon/ui/product/facelet/product/item/formPrices.xhtml" >
			<ui:param name="itemTo" value="#{controller.to}" />
		</ui:include>
	</aon:panelGrid>

</ui:composition>
