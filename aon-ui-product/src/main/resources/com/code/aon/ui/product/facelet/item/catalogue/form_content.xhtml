<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">

	<aon:outputLabel for="ItemCatalogue_catalogue" value="#{bundle.product_catalogueItem_catalogue}" />
	<aon:selectOneMenu id="ItemCatalogue_catalogue"
		value="#{controller.to.catalogue}" required="true"
		valueChangeListener="#{controller.onCatalogueChanged}"
		reRender="ItemCatalogue_catalogue_startDate,ItemCatalogue_catalogue_endDate"
		focus="ItemCatalogue_quantity">
		<aon:if test="#{controller.to.product.sale}">
			<f:selectItems value="#{configCollections.salesCatalogues}" />
		</aon:if>
		<aon:if test="#{controller.to.product.purchase}">
			<f:selectItems value="#{configCollections.purchaseCatalogues}" />
		</aon:if>
		<aon:if test="#{!controller.to.product.sale and !controller.to.product.purchase}">
			<f:selectItems value="#{configCollections.allCatalogues}" />
		</aon:if>
	</aon:selectOneMenu>

	<aon:outputLabel for="ItemCatalogue_catalogue_startDate" value="#{bundle.aon_date_from}" />
	<aon:outputText id="ItemCatalogue_catalogue_startDate"
		value="#{controller.to.catalogue.startDate}">
		<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
			timeZone="#{timeZoneController.timeZoneId}" />
	</aon:outputText>

	<aon:outputLabel for="ItemCatalogue_catalogue_endDate" value="#{bundle.aon_date_to}" />
	<aon:outputText id="ItemCatalogue_catalogue_endDate"
		value="#{controller.to.catalogue.endDate}">
		<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
			timeZone="#{timeZoneController.timeZoneId}" />
	</aon:outputText>

	<aon:if test="#{product.to.itemCount > 1}">
		<aon:outputLabel for="ItemCatalogue_item" value="#{bundle.aon_detail}" />
		<aon:selectOneMenu id="ItemCatalogue_item"
			value="#{controller.to.item}">
			<f:selectItem itemLabel="-" value="#{null}" />
			<f:selectItems value="#{controller.itemList}" />
		</aon:selectOneMenu>
	</aon:if>

	<aon:outputLabel for="ItemCatalogue_quantity" value="#{bundle.aon_date_from} #{bundle.aon_quantity}" />
	<aon:inputText id="ItemCatalogue_quantity"
		value="#{controller.to.quantity}"
		required="true" size="5" />

	<aon:outputLabel for="ItemCatalogue_price" value="#{bundle.aon_price}" />
	<aon:inputText id="ItemCatalogue_price"
		value="#{controller.to.price}"
		required="true" size="5" />

	<aon:outputLabel for="ItemCatalogue_discount" value="#{bundle.aon_discount}" />
	<aon:inputText id="ItemCatalogue_discount"
		value="#{controller.to.discount}"
		required="true" size="5" />

</ui:composition>
