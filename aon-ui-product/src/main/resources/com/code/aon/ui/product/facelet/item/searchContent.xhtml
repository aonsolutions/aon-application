<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="Item_product_code" value="#{bundle.aon_id}" />
	<aon:inputText id="Item_product_code" size="10"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Item_product_name"
		value="#{bundle.aon_description}" />
	<aon:inputText id="Item_product_name" size="50"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="Item_product_category_id"
		value="#{productBundle.product_category}" />
	<aon:selectOneMenu id="Item_product_category_id"
		valueChangeListener="#{controller.addEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" itemDisabled="true" />
		<f:selectItems value="#{productCollections.categories}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="Item_status"
		value="#{bundle.aon_status}" />
	<aon:selectOneMenu id="Item_status"
		valueChangeListener="#{item.addEqualExpression}">
		<aon:enumConverter enum="com.code.aon.product.enumeration.ProductStatus" />
		<f:selectItem itemLabel="-" itemValue="" itemDisabled="true" />
		<f:selectItems value="#{productCollections.productStatuses}" />
	</aon:selectOneMenu>

</ui:composition>
