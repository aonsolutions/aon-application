<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="productForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.aon_role_product}" />
				<ui:param name="controller" value="#{product}" />
				<ui:param name="showMoreMenu" value="#{!product.nevv}" />
				<ui:define name="moreMenuContent">
					<aon:if test="#{aonConfiguration.bean.product.showHistory}">
						<aon:menuItem id="ProductHistory" 
							action="product_stats" actionListener="#{item.onProductHistory}"
							value="#{bundle.aon_history}"
							iconClass="aon-icon-task-assume">
						</aon:menuItem>
						<rich:menuSeparator id="historyMenuSeparator" />		
					</aon:if>
					<aon:if test="#{aonRole.accountingOperator and aonConfiguration.bean.product.showAccount}">
						<aon:menuItem id="account-button"
							value="#{bundle.accounting_balance_detail_accounts}"
							reRender="showAccountsWindow"
							iconClass="aon-icon-account-entry">
							<f:setPropertyActionListener target="#{product.showAccountsWindow}" value="#{true}" />							
						</aon:menuItem>
					</aon:if>
					<aon:if test="#{aonConfiguration.bean.product.showTariff}">
						<aon:menuItem id="tariff-button"
							value="#{bundle.product_tariff_module2}"
							reRender="showNewTariffWindow"
							iconClass="aon-icon-tariff"
							actionListener="#{itemTariff.onReset}">
							<f:setPropertyActionListener target="#{item.showNewTariffWindow}" value="#{true}" />							
						</aon:menuItem>
					</aon:if>
					<aon:if test="#{aonConfiguration.bean.product.showCatalogues}">
						<aon:menuItem id="catalogue-button"
							value="#{bundle.product_catalogue_module}"
							reRender="showNewCatalogueWindow"
							iconClass="aon-icon-catalogue"
							actionListener="#{itemCatalogue.onReset}">
							<f:setPropertyActionListener target="#{item.showNewCatalogueWindow}" value="#{true}" />							
						</aon:menuItem>
					</aon:if>
					<aon:if test="#{controller.to.sale or controller.to.salePurchase}">
						<aon:menuItem id="customer-button"
							value="#{bundle.customer_finance_checking}"
							reRender="showNewItemCustomerWindow"
							iconClass="aon-icon-customer"
							actionListener="#{itemCustomer.onReset}">
							<f:setPropertyActionListener target="#{item.showNewCustomerWindow}" value="#{true}" />							
						</aon:menuItem>
					</aon:if>
					<aon:if test="#{controller.to.purchase or controller.to.salePurchase}">
						<aon:menuItem id="supplier-button"
							value="#{bundle.aon_suppliers}"
							reRender="showNewItemSupplierWindow"
							iconClass="aon-icon-supplier"
							actionListener="#{itemSupplier.onReset}">
							<f:setPropertyActionListener target="#{item.showNewSupplierWindow}" value="#{true}" />							
						</aon:menuItem>
					</aon:if>
					<aon:if test="#{aonConfiguration.bean.product.showAlternatives}">
						<aon:menuItem id="alternative-button"
							value="#{bundle.product_alternative_items}"
							reRender="showNewAlternativeWindow"
							iconClass="aon-icon-alternative"
							actionListener="#{itemAlternative.onReset}">
							<f:setPropertyActionListener target="#{item.showNewAlternativeWindow}" value="#{true}" />							
						</aon:menuItem>
					</aon:if>
					<aon:if test="#{aonConfiguration.bean.product.showAddInfo}">
						<aon:menuItem id="addInfo-button"
							value="#{bundle.aon_addInfo}"
							reRender="showNewAddInfoWindow"
							iconClass="aon-icon-addinfo"
							actionListener="#{itemAddInfo.onReset}">
							<f:setPropertyActionListener target="#{item.showNewAddInfoWindow}" value="#{true}" />							
						</aon:menuItem>
					</aon:if>
					<aon:if test="#{aonConfiguration.bean.product.showAttachment}">
						<aon:menuItem id="attachment-button"
							value="#{bundle.product_attachment}"
							reRender="showNewAttachmentWindow"
							iconClass="aon-icon-documents"
							actionListener="#{itemAttach.onReset}">
							<f:setPropertyActionListener target="#{item.showNewAttachmentWindow}" value="#{true}" />							
						</aon:menuItem>
					</aon:if>
					<ui:include src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" /> 
				</ui:define>
			</ui:decorate>

			<aon:div id="productDiv" styleClass="aon-scroll-area">
				<aon:if test="#{product.nevv}">
					<ui:include src="/com/code/aon/ui/product/facelet/product/formNewContent.xhtml">
						<ui:param name="controller" value="#{product}" />
					</ui:include>
				</aon:if>

				<aon:if test="#{!product.nevv}">
					<ui:include src="/com/code/aon/ui/product/facelet/product/formContent.xhtml">
						<ui:param name="controller" value="#{product}" />
					</ui:include>

					<aon:panelTabSet selectedTab="#{item.selectedTab}" styleClass="aon-nomargin">
						<aon:if test="#{product.to.serializable or product.to.packaged or !empty product.to.category.detail}">
							<aon:panelTab id="itemPanelTab"
								label="#{bundle.aon_detail}">
								<ui:include	src="/com/code/aon/ui/product/facelet/product/item/tab_grid.xhtml">
									<ui:param name="controller" value="#{item}" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
						<aon:if test="#{aonConfiguration.bean.product.showComposition and (product.to.composition or product.to.manufactured)}">
							<aon:panelTab id="itemCompositionPanelTab"
								label="#{bundle.product_composition}">
								<ui:include
									src="/com/code/aon/ui/product/facelet/item/composition/tab_grid.xhtml">
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.product.showStock and product.to.inventoriable}">
							<aon:panelTab id="itemWarehousePanelTab"
								label="#{bundle.warehouse_item_warehouse_module}">
								<ui:include
									src="/com/code/aon/ui/warehouse/facelet/itemwarehouse/tab_grid.xhtml">
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.product.showTariff and itemTariff.model.rowCount > 0}">
							<aon:panelTab id="itemTariffPanelTab"
								label="#{bundle.product_tariff_module2}">
								<ui:include	src="/com/code/aon/ui/product/facelet/item/tariff/tab_grid.xhtml">
									<ui:param name="controller" value="#{itemTariff}" />
									<ui:param name="removeButtonReRender" value="productDiv" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.product.showCatalogues and itemCatalogue.model.rowCount > 0}">
							<aon:panelTab id="itemCataloguePanelTab"
								label="#{bundle.product_catalogue_module}">
								<ui:include	src="/com/code/aon/ui/product/facelet/item/catalogue/tab_grid.xhtml">
									<ui:param name="controller" value="#{itemCatalogue}" />
									<ui:param name="removeButtonReRender" value="productDiv" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.product.showSuppliers and itemCustomer.model.rowCount > 0}">
							<aon:panelTab id="itemCustomerPanelTab"
								label="#{bundle.customer_finance_checking}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/ritem/tab_grid.xhtml">
									<ui:param name="controller" value="#{itemCustomer}" />
									<ui:param name="removeButtonReRender" value="productDiv" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.product.showSuppliers and itemSupplier.model.rowCount > 0}">
							<aon:panelTab id="itemSupplierPanelTab"
								label="#{bundle.aon_suppliers}">
								<ui:include src="/com/code/aon/ui/registry/facelet/ritem/tab_grid.xhtml">
									<ui:param name="controller" value="#{itemSupplier}" />
									<ui:param name="removeButtonReRender" value="productDiv" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.product.showAlternatives and itemAlternative.model.rowCount > 0}">
							<aon:panelTab id="itemAlternativePanelTab"
								label="#{bundle.product_alternative_items}">
								<ui:include	src="/com/code/aon/ui/product/facelet/item/alternative/tab_grid.xhtml">
									<ui:param name="controller" value="#{itemAlternative}" />
									<ui:param name="removeButtonReRender" value="productDiv" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.product.showAddInfo and itemAddInfo.model.rowCount > 0}">
							<aon:panelTab id="addInfoPanelTab"
								label="#{bundle.aon_addInfo}">
								<ui:include	src="/com/code/aon/ui/product/facelet/item/addinfo/tab_grid.xhtml">
									<ui:param name="controller" value="#{itemAddInfo}" />
									<ui:param name="removeButtonReRender" value="productDiv" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.product.showAttachment and itemAttach.model.rowCount > 0}">
							<aon:panelTab id="itemAttachPanelTab"
								label="#{bundle.product_attachment}">
								<ui:include	src="/com/code/aon/ui/product/facelet/item/attach/tab_grid.xhtml">
									<ui:param name="controller" value="#{itemAttach}" />
									<ui:param name="removeButtonReRender" value="productDiv" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
					</aon:panelTabSet>
				</aon:if>
			</aon:div>
		</aon:form>

		<aon:if test="#{!product.nevv}">
			<aon:if test="#{aonConfiguration.bean.product.showComposition or aonConfiguration.bean.product.showAlternatives}">
				<aon:lookupButtonPopup lookup="#{allItemLookup}" />
				<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
				<aon:lookupButtonPopup lookup="#{purchaseItemLookup}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.product.showSuppliers}">
				<aon:lookupButtonPopup lookup="#{customerLookup}" />
				<aon:lookupButtonPopup lookup="#{supplierLookup}" />
			</aon:if>
			<aon:if test="#{aonRole.accountingOperator and aonConfiguration.bean.product.showAccount}">
				<aon:lookupButtonPopup lookup="#{accountLookup}" />
			</aon:if>
			<ui:include src="/com/code/aon/ui/product/facelet/product/item/searchItemModal.xhtml">
				<ui:param name="controller" value="#{product}" />
				<ui:param name="itemController" value="#{item}" />
				<ui:param name="modalReRender" value="productDiv" />
			</ui:include>		
			<ui:include src="/com/code/aon/ui/product/facelet/product/item/newItemModal.xhtml">
				<ui:param name="controller" value="#{product}" />
				<ui:param name="itemController" value="#{item}" />
				<ui:param name="modalReRender" value="productDiv" />
			</ui:include>		
			<aon:if test="#{aonRole.accountingOperator and aonConfiguration.bean.product.showAccount}">
				<ui:include src="/com/code/aon/ui/product/facelet/product/modalAccounts.xhtml">
					<ui:param name="controller" value="#{product}" />
				</ui:include>		
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.product.showStock and product.to.inventoriable}">
				<ui:include src="/com/code/aon/ui/product/facelet/item/modalInfo.xhtml" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.product.showTariff}">
				<ui:include src="/com/code/aon/ui/product/facelet/item/tariff/newTariffModal.xhtml">
					<ui:param name="controller" value="#{item}" />
					<ui:param name="tariffController" value="#{itemTariff}" />
					<ui:param name="modalReRender" value="productDiv" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.product.showCatalogues}">
				<ui:include src="/com/code/aon/ui/product/facelet/item/catalogue/newCatalogueModal.xhtml">
					<ui:param name="controller" value="#{item}" />
					<ui:param name="catalogueController" value="#{itemCatalogue}" />
					<ui:param name="modalReRender" value="productDiv" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.product.showSuppliers}">
				<ui:include src="/com/code/aon/ui/registry/facelet/ritem/newItemModal.xhtml">
					<ui:param name="controller" value="#{item}" />
					<ui:param name="registryItemController" value="#{itemCustomer}" />
					<ui:param name="detailId" value="ItemCustomer" />
					<ui:param name="showNewDetailWindow" value="#{item.showNewCustomerWindow}" />
					<ui:param name="modalTitle" value="#{bundle.customer_finance_checking}" />
					<ui:param name="modalReRender" value="productDiv" />
				</ui:include>
				<ui:include src="/com/code/aon/ui/registry/facelet/ritem/newItemModal.xhtml">
					<ui:param name="controller" value="#{item}" />
					<ui:param name="registryItemController" value="#{itemSupplier}" />
					<ui:param name="detailId" value="ItemSupplier" />
					<ui:param name="showNewDetailWindow" value="#{item.showNewSupplierWindow}" />
					<ui:param name="modalTitle" value="#{bundle.aon_suppliers}" />
					<ui:param name="modalReRender" value="productDiv" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.product.showAlternatives}">
				<ui:include src="/com/code/aon/ui/product/facelet/item/alternative/newAlternativeModal.xhtml">
					<ui:param name="controller" value="#{item}" />
					<ui:param name="alternativeController" value="#{itemAlternative}" />
					<ui:param name="modalReRender" value="productDiv" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.product.showAddInfo}">
				<ui:include src="/com/code/aon/ui/product/facelet/item/addinfo/newAddInfoModal.xhtml">
					<ui:param name="controller" value="#{item}" />
					<ui:param name="addInfoController" value="#{itemAddInfo}" />
					<ui:param name="modalReRender" value="productDiv" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.product.showAttachment}">
				<ui:include src="/com/code/aon/ui/product/facelet/item/attach/newAttachmentModal.xhtml">
					<ui:param name="controller" value="#{item}" />
					<ui:param name="attachmentController" value="#{itemAttach}" />
					<ui:param name="modalReRender" value="productDiv" />
				</ui:include>
			</aon:if>
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
				<ui:param name="auditableController" value="#{product}" />
			</ui:include>			
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
				<ui:param name="auditableController" value="#{item}" />
				<ui:param name="auditInfoWindowId" value="showAuditInfoWindowItem" />
			</ui:include>			
		</aon:if>

	</ui:define>
</ui:composition>
