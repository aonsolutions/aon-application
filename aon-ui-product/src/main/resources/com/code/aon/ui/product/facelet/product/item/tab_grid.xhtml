<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-toolbar">
		<aon:commandButton id="saveItem" 
			styleClass="aon-finding-toolbar-item aon-icon-accept"
			value="#{bundle.aon_save}"					
			actionListener="#{product.onAcceptItem}" />
		<aon:confirmButton id="removeItem" immediate="true"
			styleClass="aon-finding-toolbar-item aon-icon-delete"
			value="#{bundle.aon_remove}"
			rendered="#{controller.model.rowCount > 1 and !controller.to.wildCard}"
			confirmTitle="#{bundle.aon_confirm_title}"
			confirmMessage="#{bundle.aon_remove_confirm}"
			confirmAction="product_form"
			confirmActionListener="#{product.onRemoveItem}" />
		<aon:commandButton id="searchItem" immediate="true"
			styleClass="aon-finding-toolbar-item aon-icon-search"
			value="#{bundle.aon_search}"
			actionListener="#{item.onEditSearch}"
			reRender="showSearchItemWindow">			
			<f:setPropertyActionListener target="#{product.showSearchItemWindow}" value="#{true}" />							
		</aon:commandButton>
		<aon:commandButton id="resetItem"
			styleClass="aon-finding-toolbar-item aon-icon-new"
			value="#{bundle.aon_reset}" 
			actionListener="#{product.onResetItem}"
			reRender="showNewItemWindow">			
			<f:setPropertyActionListener target="#{product.showNewItemWindow}" value="#{true}" />							
		</aon:commandButton>
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolbarContent.xhtml">
			<ui:param name="controller" value="#{item}" />
			<ui:param name="auditInfoWindowId" value="showAuditInfoWindowItem" />
		</ui:include>								
	</aon:div>	
									
	<ui:include src="/com/code/aon/ui/product/facelet/product/item/list.xhtml" />

</ui:composition>
