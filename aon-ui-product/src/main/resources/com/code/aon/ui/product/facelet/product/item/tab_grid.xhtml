<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-toolbar" >
		<aon:commandButton id="saveItem" value="#{bundle.aon_save}"					
			styleClass="aon-finding-toolbar-item aon-icon-accept"
			actionListener="#{product.acceptItem}" />
		<aon:confirmButton id="removeItem"
			rendered="#{controller.model.rowCount > 1}"
			value="#{bundle.aon_remove}" immediate="true"
			styleClass="aon-finding-toolbar-item aon-icon-delete"
			confirmTitle="#{bundle.aon_confirm_title}"
			confirmMessage="#{bundle.aon_remove_confirm}"
			confirmAction="product_form"
			confirmActionListener="#{product.onRemoveItem}" />
		<aon:commandButton id="resetItem"
			value="#{bundle.aon_reset}" reRender="showNewItemWindow"
			actionListener="#{product.onResetItem}"
			styleClass="aon-finding-toolbar-item aon-icon-new" >			
			<f:setPropertyActionListener target="#{product.showNewItemWindow}" value="#{true}" />							
		</aon:commandButton>
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolbarContent.xhtml">
			<ui:param name="controller" value="#{item}" />
			<ui:param name="auditInfoWindowId" value="showAuditInfoWindowItem" />
		</ui:include>								
	</aon:div>	
									
	<ui:include src="/com/code/aon/ui/product/facelet/product/item/form_content.xhtml" />

</ui:composition>
