<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="productList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_role_product}" />
				<ui:param name="controller" value="#{product}" />
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="productList-excel-report" value="&#160;" 
						target="_new" action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="productList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="productList-report" value="#{bundle.aon_listing}"
						target="_new" action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="productList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<ui:include
						src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />
							
					<aon:commandLink id="product-export" value="#{bundle.account_export}"
						onclick="productx('#{productExport.code}','#{productExport.name}','#{productExport.category.id}','#{productExport.tagsStr}','#{productExport.brand.id}','#{productExport.vat.id}','#{productExport.retention.id}','#{productExport.purchaseAccount.id}','#{productExport.salesAccount.id}','#{productExport.serializable}','#{productExport.inventoriable}','#{productExport.manufactured}','#{productExport.composition}', '#{productExport.statusesStr}','#{productExport.typesStr}'
											,'#{productExport.barcode}','#{productExport.serialNumber}','#{productExport.itemSerialDate1}','#{productExport.itemSerialDate2}','#{productExport.detail}','#{productExport.detail2}','#{productExport.detail3}','#{productExport.description}','#{productExport.purchasePrice}','#{productExport.profitPercent}','#{productExport.price}','#{productExport.internet}','#{productExport.itemStatusesStr}','#{productExport.supplierCode}'
											,'#{productExport.creationUser}','#{productExport.creationDate1}','#{productExport.creationDate2}','#{productExport.modificationUser}','#{productExport.modificationDate1}','#{productExport.modificationDate2}')"
						styleClass="aon-finding-toolbar-item aon-icon-export-excel-trans">
					</aon:commandLink>
			
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{product}" />
					<ui:define name="columns">
	
						<ui:include
							src="/com/code/aon/ui/product/facelet/product/listBasic.xhtml" />
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.registry_tag_module}" />
							</f:facet>
							<aon:outputText value="#{to.tagList}" />
						</aon:column>
	
						<aon:if test="#{aonConfiguration.bean.product.showBrand}">
							<aon:column alias="Product.brand.name"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.tas_make}" />
								</f:facet>
								<aon:outputText value="#{to.brand.name}" />
							</aon:column>
						</aon:if>
	
						<aon:column alias="Product.status"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
	
					</ui:define>
				</ui:decorate>	
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
