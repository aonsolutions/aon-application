<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="itemList">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{productBundle.product_module}" />
				<ui:param name="controller" value="#{product}" />
			</ui:include>
			
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{product}" />
					<ui:define name="columns">
	
						<ui:include
							src="/com/code/aon/ui/product/facelet/product/listBasic.xhtml" />
	
						<c:if test="#{aonConfiguration.bean.product.showBrand}">
							<aon:column alias="Product.brand.name"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{productBundle.product_brand}" />
								</f:facet>
								<aon:outputText value="#{to.brand.name}" />
							</aon:column>
						</c:if>
	
						<aon:column alias="Product.status"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
	
					</ui:define>
				</ui:decorate>	
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
