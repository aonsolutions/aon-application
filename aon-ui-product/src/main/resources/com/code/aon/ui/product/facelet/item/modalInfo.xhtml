<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="itemInfoContainer">
		<aon:if test="#{itemInfo.panelVisible}">
			<rich:modalPanel id="itemInfoModalPanel" minHeight="420"
				minWidth="620" rendered="#{itemInfo.panelVisible}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.product_info}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							actionListener="#{itemInfo.onHidePanel}"
							reRender="itemInfoContainer" immediate="true">
							<f:setPropertyActionListener 
								target="#{itemInfo.alternativesModel}"
								value="#{null}" />
							<f:setPropertyActionListener 
								target="#{itemInfo.stockModel}"
								value="#{null}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="itemInfoForm">
					<aon:div styleClass="aon-scroll-area">
		
						<aon:panelTabSet id="itemInfoTabSet">
							<aon:if test="#{aonConfiguration.bean.product.showStock and itemInfo.stockVisible}">
								<aon:panelTab id="itemInfoPanelTab" label="#{bundle.product_stock}">
			
									<aon:outputText value="#{bundle.aon_search_no_results}"
										style="aon-bold aon-margin-top"
										rendered="#{empty itemInfo.stockList}" />
	
									<aon:dataTable id="itemInfoData" value="#{itemInfo.stockModel}"
										var="to" rows="20" rendered="#{!empty itemInfo.stockList}"
										columnClasses="aon-editDataTable-textColumn, aon-editDataTable-numberColumn">
	
										<aon:column>
											<f:facet name="header">
												<h:outputText value="#{bundle.aon_module_warehouse}" />
											</f:facet>
											<aon:outputText value="#{to.warehouse.name}" />
										</aon:column>
			
										<aon:column>
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_quantity}" />
											</f:facet>
											<aon:outputText value="#{to.quantity + ((to.warehouse == itemInfo.warehouse) ? itemInfo.rowStock : 0)}">
												<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
											</aon:outputText>
										</aon:column>
									</aon:dataTable>
			
								</aon:panelTab>
							</aon:if>
		
							<aon:if test="#{aonConfiguration.bean.product.showAlternatives and itemInfo.alternativesVisible}">
								<aon:panelTab id="itemAlternativePanelTab" label="#{bundle.product_alternative_items}">
			
									<aon:outputText value="#{bundle.aon_search_no_results}"
										style="aon-bold aon-margin-top"
										rendered="#{empty itemInfo.alternativesList}" />

									<aon:dataTable id="itemAlternativeData" value="#{itemInfo.alternativesModel}"
										var="to" rows="20" rendered="#{!empty itemInfo.alternativesList}">

										<aon:column styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:commandButton 
												title="#{bundle.aon_check}" 
												actionListener="#{itemInfo.onSelectAlternative}"
												styleClass="aon-editDataTable-button aon-icon-rowSelector" />
										</aon:column>

										<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
											<f:facet name="header">
												<h:outputText value="#{bundle.aon_id}" />
											</f:facet>
											<aon:outputText value="#{to.alternativeItem.product.code}" />
										</aon:column>
			
										<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_description}" />
											</f:facet>
											<aon:outputText value="#{to.alternativeItem.fullName}" />
										</aon:column>

										<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_quantity}" />
											</f:facet>
											<aon:outputText value="#{itemInfo.alternativeStock}">
												<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
											</aon:outputText>
										</aon:column>
									</aon:dataTable>

								</aon:panelTab>
							</aon:if>
						</aon:panelTabSet>
		
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
