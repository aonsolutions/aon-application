<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="itemCatalogueReportSearch">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">	
			
				<ui:param name="toolbarTitle" value="#{bundle.product_itemCatalogueReport_module}" />
				<ui:param name="controller" value="#{itemCatalogueReport}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:define name="additionalToolbarContent">
					<ui:include
						src="/com/esferalia/aon/gwt/aio/facelet/templates/silent.xhtml" />
					<aon:commandLink id="product-export" value="#{bundle.account_export}"
						onclick="cataloguex()"
						styleClass="aon-finding-toolbar-item aon-icon-export-excel-trans">
					</aon:commandLink>
				</ui:define>
			</ui:decorate>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{itemCatalogueReport}" />
				<ui:param name="skipAfterSearch" value="#{true}" />

				<ui:define name="searchContent">
					
					<aon:outputLabel for="ItemCatalogueReport_workPlace"
						value="#{bundle.purchase_workplace}" />
					<aon:selectOneMenu id="ItemCatalogueReport_workPlace"
						value="#{itemCatalogueReport.workPlace}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						<a4j:support event="onchange" reRender="ItemCatalogueReport_department" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="ItemCatalogueReport_department"
						value="#{bundle.purchase_department}" />
					<aon:selectOneMenu id="ItemCatalogueReport_department"
						disabled="#{itemCatalogueReport.workPlace.id==null}"
						value="#{itemCatalogueReport.department}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{itemCatalogueReport.departments}" />
					</aon:selectOneMenu>
					
				</ui:define>
			</ui:decorate>
		</aon:form>

	</ui:define>
</ui:composition>
