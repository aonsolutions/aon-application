<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{itemComposition}" />

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel for="ItemComposition_sequence" value="#{bundle.aon_order}" />
				</f:facet>
				<aon:outputText value="#{to.sequence}"
					rendered="#{formList}" />
				<aon:inputText id="ItemComposition_sequence" 
					value="#{controller.to.sequence}" rendered="#{formEdit}"
					required="true" size="2" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText id="ItemComposition_sequence-New" 
						value="#{controller.to.sequence}" rendered="#{formNew}"
						required="true" size="2" maxlength="3" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-auto aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="Item_id_Composition" value="#{bundle.product_component}" />
				</f:facet>
				<aon:outputText value="#{to.description}" 
					rendered="#{formList}">
					<aon:abbreviateConverter maxWidth="64" />
				</aon:outputText>
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupBean" value="#{allItemLookup}" />
					<ui:param name="lookupTo" value="#{controller.to.compositionItem}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="skipSuggestText" value="#{controller.to.compositionItem != null and controller.to.compositionItem.id != null}" />
					<ui:param name="lookupInputOnFocus" value="ItemComposition_description" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<ui:param name="lookupSuffix" value="_Composition" />
					<ui:param name="lookupReRender" value="itemCompositionDescription,ItemComposition_quantity" />
					<aon:methodParam name="lookupChangeListener"
						value="#{controller.onCompositionItemChanged}" type="lookupChangeListener" />
				</ui:include>
				<aon:panelGroup id="itemCompositionDescription" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formEdit}">
					<aon:inputTextarea id="ItemComposition_description"
						value="#{controller.to.description}"
						rendered="#{controller.to.compositionItem != null and controller.to.compositionItem.id != null}"
						cols="60" rows="#{!controller.longDescription?1:5}"
						style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
						<f:validateLength maximum="1024" />
					</aon:inputTextarea>
					<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
						actionListener="#{controller.onShortDescription}" reRender="ItemComposition_description"
						rendered="#{controller.longDescription and controller.to.compositionItem.product.code != null}" />
					<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
						actionListener="#{controller.onLongDescription}" reRender="ItemComposition_description"
						rendered="#{!controller.longDescription and controller.to.compositionItem.product.code != null}" />
				</aon:panelGroup>
				<f:facet name="footer">
					<aon:div>
						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
							<ui:param name="lookupBean" value="#{allItemLookup}" />
							<ui:param name="lookupTo" value="#{controller.to.compositionItem}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="skipSuggestText" 
								value="#{controller.to.compositionItem != null and controller.to.compositionItem.id != null}" />
							<ui:param name="lookupInputOnFocus" value="ItemComposition_description-New" />
							<ui:param name="lookupSuffix" value="-New" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupSuffix" value="_Composition-New" />
							<ui:param name="lookupReRender" value="itemCompositionDescriptionNew,ItemComposition_quantity-New" />
							<aon:methodParam name="lookupChangeListener"
								value="#{controller.onCompositionItemChanged}" type="lookupChangeListener" />
						</ui:include>
						<aon:panelGroup id="itemCompositionDescriptionNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
							<aon:inputTextarea id="ItemComposition_description-New"
								value="#{controller.to.description}"
								rendered="#{controller.to.compositionItem != null and controller.to.compositionItem.id != null}"
								cols="60" rows="#{!controller.longDescription?1:5}"
								style="#{!controller.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
							<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
								actionListener="#{controller.onShortDescription}" reRender="ItemComposition_description-New"
								rendered="#{controller.longDescription and controller.to.compositionItem.product.code != null}" />
							<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
								actionListener="#{controller.onLongDescription}" reRender="ItemComposition_description-New"
								rendered="#{!controller.longDescription and controller.to.compositionItem.product.code != null}" />
						</aon:panelGroup>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemComposition_quantity" value="#{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
				<aon:inputText id="ItemComposition_quantity"
					value="#{controller.to.quantity}" rendered="#{formEdit}"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="ItemComposition_quantity-New"
						value="#{controller.to.quantity}" rendered="#{formNew}"
						required="true" size="5" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemComposition_discount" value="#{bundle.aon_discount}" />
				</f:facet>
				<aon:outputText value="#{to.discountExpression.discountExpr}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:inputText id="ItemComposition_discount"
					value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="ItemComposition_discount-New"
						value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}"
						required="true" size="5" />
				</f:facet>
			</aon:column>
	
		</ui:define>
	</ui:decorate>
</ui:composition>
