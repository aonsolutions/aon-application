<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:valueParam name="pojoName" default="#{controller.pojoShortName}"/>

	<aon:outputLabel for="#{pojoName}_purchase_price" value="#{bundle.product_purchase_price}" />
	<aon:panelGrid columns="3" columnClasses="aon-width-80,aon-width-180,aon-width-auto">
		<aon:inputText id="#{pojoName}_purchase_price" 
			value="#{itemTo.purchasePrice}" required="true" size="5"
			valueChangeListener="#{controller.onPurchasePriceChanged}" 
			reRender="#{pojoName}_profit_percent,#{pojoName}_price,#{pojoName}_sales_profit_percent,#{pojoName}_sales_price"
			focus="#{pojoName}_profit_percent">
			<f:validateDoubleRange />
		</aon:inputText>
		<aon:outputLabel for="#{pojoName}_profit_percent" value="% #{bundle.aon_profit} #{bundle.aon_over} #{bundle.aon_cost}" />
		<aon:inputText id="#{pojoName}_profit_percent" 
			value="#{itemTo.profitPercent}" required="true" size="2"
			valueChangeListener="#{controller.onProfitChanged}"
			reRender="#{pojoName}_price,#{pojoName}_sales_profit_percent,#{pojoName}_sales_price"
			focus="#{pojoName}_price">
			<f:validateDoubleRange />
		</aon:inputText>
	</aon:panelGrid>

	<aon:outputLabel for="#{pojoName}_price" value="#{bundle.product_sales_base_price}" />
	<aon:panelGrid columns="3" columnClasses="aon-width-80,aon-width-180,aon-width-auto">
		<aon:inputText id="#{pojoName}_price" 
			value="#{itemTo.price}" required="true" size="5"
			valueChangeListener="#{controller.onPriceChanged}" 
			reRender="#{pojoName}_profit_percent,#{pojoName}_sales_profit_percent,#{pojoName}_sales_price"
			focus="#{pojoName}_sales_profit_percent">
			<f:validateDoubleRange />
		</aon:inputText>
		<aon:outputLabel for="#{pojoName}_sales_profit_percent" value="% #{bundle.aon_profit} #{bundle.aon_over} #{bundle.accounting_sale}" />
		<aon:inputText id="#{pojoName}_sales_profit_percent" 
			value="#{itemTo.salesProfitPercent}" required="true" size="2"
			valueChangeListener="#{controller.onSalesProfitChanged}"
			reRender="#{pojoName}_profit_percent,#{pojoName}_price,#{pojoName}_sales_price"
			focus="#{pojoName}_sales_price">
			<f:validateDoubleRange />
		</aon:inputText>
	</aon:panelGrid>	

	<aon:outputLabel for="#{pojoName}_sales_price" value="#{bundle.aon_sales_price}" />
	<aon:inputText id="#{pojoName}_sales_price" 
		value="#{itemTo.salesPrice}" required="true" size="5"
		valueChangeListener="#{controller.onSalesPriceChanged}" 
		reRender="#{pojoName}_profit_percent,#{pojoName}_price,#{pojoName}_sales_profit_percent">
		<f:validateDoubleRange/>
	</aon:inputText>

</ui:composition>
