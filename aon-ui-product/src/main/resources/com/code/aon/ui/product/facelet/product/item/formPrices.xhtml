<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:outputLabel for="Item_purchase_price" value="#{productBundle.product_purchase_price}" />
	<aon:inputText id="Item_purchase_price" 
		value="#{itemTo.purchasePrice}" required="true" size="10"
		valueChangeListener="#{controller.onPurchasePriceChanged}" 
		reRender="Item_profit_percent,Item_price,Item_sales_price"
		focus="Item_profit_percent">
		<f:validateDoubleRange />
	</aon:inputText>
	
	<aon:outputLabel for="Item_profit_percent" value="% #{bundle.aon_profit}" />
	<aon:inputText id="Item_profit_percent" 
		value="#{itemTo.profitPercent}" required="true" size="10"
		valueChangeListener="#{controller.onProfitChanged}"
		reRender="Item_price,Item_sales_price"
		focus="Item_price">
		<f:validateDoubleRange />
	</aon:inputText>
	
	<aon:outputLabel for="Item_price" value="#{productBundle.product_sales_base_price}" />
	<aon:inputText id="Item_price" 
		value="#{itemTo.price}" required="true" size="10"
		valueChangeListener="#{controller.onPriceChanged}" 
		reRender="Item_profit_percent,Item_sales_price"
		focus="Item_product_vat">
		<f:validateDoubleRange />
	</aon:inputText>
	
	<aon:outputLabel for="Item_sales_price" value="#{bundle.aon_sales_price}" />
	<aon:inputText id="Item_sales_price" 
		value="#{itemTo.salesPrice}" required="true" size="10"
		valueChangeListener="#{controller.onSalesPriceChanged}" 
		reRender="Item_profit_percent,Item_price">
		<f:validateDoubleRange/>
	</aon:inputText>

</ui:composition>
