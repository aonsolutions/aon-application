<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{itemAlternative}" />

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_priority}" />
				</f:facet>
				<aon:outputText value="#{to.priority}"
					rendered="#{formList}" />
				<aon:inputText id="ItemAlternative_priority" 
					value="#{controller.to.priority}" rendered="#{formEdit}"
					required="true" size="2" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText id="ItemAlternative_priority-New" 
						value="#{controller.to.priority}" rendered="#{formNew}"
						required="true" size="2" maxlength="3" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-auto aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="Item_id"
						value="#{productBundle.product_item}" />
				</f:facet>
				<aon:outputText value="#{to.alternativeItem.product.code} - #{to.alternativeItem.product.name}"
					rendered="#{formList}" />
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupTo" value="#{itemAlternative.to.alternativeItem}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<aon:methodParam name="lookupChangeListener"
						value="#{itemAlternative.onAlternativeItemChanged}" type="lookupChangeListener" />
				</ui:include>
				<f:facet name="footer">
					<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{itemAlternative.to.alternativeItem}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="lookupSuffix" value="-New" />
						<aon:methodParam name="lookupChangeListener"
							value="#{itemAlternative.onAlternativeItemChanged}" type="lookupChangeListener" />
					</ui:include>
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>
</ui:composition>
