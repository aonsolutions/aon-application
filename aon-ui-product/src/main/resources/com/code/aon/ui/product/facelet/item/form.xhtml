<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="itemForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{productBundle.product_module}" />
				<ui:param name="controller" value="#{item}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">
					<aon:outputLabel for="Item_product_code" value="#{bundle.aon_id}" />
					<aon:inputText id="Item_product_code" value="#{item.to.product.code}"
						required="true" size="15" maxLength="15" onblur="toUpperCase(this);" />

					<aon:outputLabel for="Item_status" value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="Item_status" value="#{item.to.status}">
						<f:selectItems value="#{productCollections.productStatuses}" />
					</aon:selectOneMenu>
				</aon:panelGrid>

				<aon:panelGrid styleClass="aon-margin-top"
					columns="2" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
					<aon:outputLabel for="Item_product_name" value="#{bundle.aon_description}" />
					<aon:inputText id="Item_product_name" value="#{item.to.product.name}"
						required="true" size="64" maxLength="64" />

					<aon:outputLabel for="Item_product_detail" value="#{productBundle.product_detail}" />
					<aon:inputTextarea id="Item_product_detail" cols="120" rows="3" 
						value="#{item.to.description}"/>
				</aon:panelGrid>

				<aon:panelGrid columns="4" styleClass="aon-margin-top" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">
					<aon:outputLabel for="Item_product_category" value="#{productBundle.product_category}" />
					<aon:selectOneMenu id="Item_product_category" value="#{item.to.product.category}">
						<f:selectItems value="#{productCollections.categories}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Item_product_brand" value="#{productBundle.product_brand}" />
					<aon:selectOneMenu id="Item_product_brand" value="#{item.to.product.brand}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{productCollections.brands}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Item_product_type" value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Item_product_type" value="#{item.to.product.type}">
						<f:selectItems value="#{productCollections.productTypes}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel value="&#160;"/>
					<aon:outputText value="&#160;"/>
					
					<aon:outputLabel for="Item_purchase_price" value="#{productBundle.product_purchase_price}" />
					<aon:inputText id="Item_purchase_price" value="#{item.to.purchasePrice}"
						size="10">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Item_product_vat" value="#{bundle.aon_vat}" />
					<aon:div>
						<aon:selectOneMenu id="Item_product_vat" value="#{item.to.product.vat}"
							ajaxSingle="true" reRender="Item_product_vat_percentage,Item_sales_price">
							<f:selectItems value="#{configCollections.vatTaxes}" />
						</aon:selectOneMenu>
						<aon:outputText id="Item_product_vat_percentage" value="#{item.to.product.vat.percentage}" />
						<aon:outputLabel value="%" />
					</aon:div>

					<aon:outputLabel for="Item_price" value="#{bundle.aon_taxable_base}" />
					<aon:inputText id="Item_price" value="#{item.to.price}"
						reRender="Item_sales_price" required="true" size="10">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Item_product_retention" value="#{bundle.aon_retention}" />
					<aon:div>
						<aon:selectOneMenu id="Item_product_retention" value="#{item.to.product.retention}"
							ajaxSingle="true" reRender="Item_product_retention_percentage,Item_sales_price">
							<f:selectItem itemLabel="-" itemValue="" />
							<f:selectItems value="#{configCollections.retentionTaxes}" />
						</aon:selectOneMenu>
						<aon:panelGroup id="Item_product_retention_percentage">
							<aon:outputText value="#{item.to.product.retention.percentage}" />
							<aon:outputLabel value="%" rendered="#{item.to.product.retention!=null}" />
						</aon:panelGroup>
					</aon:div>

					<aon:outputLabel for="Item_sales_price" value="#{bundle.aon_sales_price}" />
					<aon:inputText id="Item_sales_price" value="#{item.salesPrice}"
						reRender="Item_price"
						valueChangeListener="#{item.onSalesPriceChanged}"
						size="10">
						<f:validateDoubleRange/>
					</aon:inputText>
				
					<aon:outputLabel value="#{productBundle.product_inventoriable}" />
					<aon:selectBooleanCheckbox id="Item_product_inventoriable" value="#{item.to.product.inventoriable}" />
				</aon:panelGrid>
				
				<aon:panelGrid styleClass="aon-margin-top"
					columns="2" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
					<c:if test="#{aonConfiguration.bean.product.showAccount}">
						<aon:outputLabel for="Item_product_sales_account" value="#{productBundle.product_sales_account}" />
						<aon:div>
							<ui:include
								src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
								<ui:param name="wizard" value="#{accountWizard}" />
								<ui:param name="id" value="Item_product_sales_account" />
								<ui:param name="required" value="#{false}" />
								<ui:param name="size" value="9" />
								<ui:param name="maxlength" value="9" />
								<ui:param name="renderDescription" value="#{true}" />
								<ui:param name="renderedAttr" value="#{true}" />
								<ui:param name="disabled" value="#{false}" />
								<ui:param name="reRenderAttr" value="none" />
								<ui:param name="entity" value="#{item.to.product.salesAccount}" />
								<ui:param name="ELExpression" value="item.to.product.salesAccount" />
							</ui:include>
						</aon:div>
	
						<aon:outputLabel for="Item_product_purchase_account" value="#{productBundle.product_purchase_account}" />
						<aon:div>
							<ui:include
								src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
								<ui:param name="wizard" value="#{accountWizard}" />
								<ui:param name="id" value="Item_product_purchase_account" />
								<ui:param name="required" value="#{false}" />
								<ui:param name="size" value="9" />
								<ui:param name="maxlength" value="9" />
								<ui:param name="renderDescription" value="#{true}" />
								<ui:param name="renderedAttr" value="#{true}" />
								<ui:param name="disabled" value="#{false}" />
								<ui:param name="reRenderAttr" value="none" />
								<ui:param name="entity" value="#{item.to.product.purchaseAccount}" />
								<ui:param name="ELExpression" value="item.to.product.purchaseAccount" />
							</ui:include>
						</aon:div>
					</c:if>
				</aon:panelGrid>
				
				<aon:panelTabSet id="itemAttachTab" >
					<c:if test="#{aonConfiguration.bean.product.showAttachment}">
						<aon:panelTab label="#{productBundle.product_attachment}">
							<ui:include src="/com/code/aon/ui/product/facelet/item/attach/tab_grid.xhtml">
								<ui:param name="controller" value="#{itemAttach}" />
								<ui:param name="skipCategoryColumn" value="true" />
							</ui:include>
						</aon:panelTab>	
					</c:if>
				</aon:panelTabSet>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
