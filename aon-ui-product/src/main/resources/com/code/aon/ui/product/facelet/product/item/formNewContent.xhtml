<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

	<aon:if test="#{itemTo.product.id != null and itemTo.product.serializable and !itemTo.wildCard}">
		<aon:outputLabel for="Item_serial_number"
			value="#{bundle.aon_serial_number}" />
		<aon:inputText id="Item_serial_number" 
			value="#{itemTo.serialNumber}" size="32" maxlength="32"
			required="true" converter="aon.TrimStringConverter" />

		<aon:outputLabel for="Item_serial_date"
			value="#{bundle.aon_date} #{bundle.aon_series}" />
		<aon:selectInputDate id="Item_serial_date"
			value="#{itemTo.serialDate}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />
	</aon:if>

	<aon:if test="#{itemTo.product.category != null and !empty itemTo.product.category.detail}">
		<aon:outputLabel for="Item_product_detail"
			value="#{itemTo.product.category.detail}" />
		<aon:inputText id="Item_product_detail" 
			value="#{itemTo.detail}" size="32" maxlength="15"
			required="#{itemTo.product.id != null}" converter="aon.TrimStringConverter" />
	</aon:if>

	<aon:if test="#{itemTo.product.category != null and !empty itemTo.product.category.detail2}">
		<aon:outputLabel for="Item_product_detail2"
			value="#{itemTo.product.category.detail2}" />
		<aon:inputText id="Item_product_detail2" 
			value="#{itemTo.detail2}" size="32" maxlength="15"
			required="#{itemTo.product.id != null}" converter="aon.TrimStringConverter" />
	</aon:if>

	<aon:if test="#{itemTo.product.category != null and !empty itemTo.product.category.detail3}">
		<aon:outputLabel for="Item_product_detail3"
			value="#{itemTo.1product.category.detail3}" />
		<aon:inputText id="Item_product_detail3" 
			value="#{itemTo.detail3}" size="32" maxlength="15"
			required="#{itemTo.product.id != null}" converter="aon.TrimStringConverter" />
	</aon:if>

	<aon:if test="#{aonConfiguration.bean.product.showBarcode}">
		<aon:outputLabel for="Item_barcode"
			value="#{bundle.product_barcode}" />
		<aon:inputText id="Item_barcode" 
			value="#{itemTo.barcode}" size="32" maxlength="32"
			converter="aon.TrimStringConverter" />
	</aon:if>

	<aon:outputLabel for="Item_description" value="#{bundle.aon_description}" />
	<aon:inputTextarea id="Item_description"
		value="#{itemTo.description}" cols="50" rows="4" />

</ui:composition>
