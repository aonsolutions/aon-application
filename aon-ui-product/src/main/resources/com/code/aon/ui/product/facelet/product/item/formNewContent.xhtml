<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

	<aon:valueParam name="fieldDisabled" default="#{lookup != null and itemTo.id != null}" />

	<aon:if test="#{itemTo.product.id != null and itemTo.product.serializable and !itemTo.wildCard}">
		<aon:outputLabel for="#{controller.pojoShortName}_serial_number"
			value="#{itemTo.product.lotable ? bundle.aon_lot_number : bundle.aon_serial_number}" />
		<aon:inputText id="#{controller.pojoShortName}_serial_number" 
			value="#{itemTo.serialNumber}" size="32" maxlength="32"
			required="true" onblur="toUpperCase(this);"
			disabled="#{fieldDisabled}"
			converter="aon.TrimStringConverter" />

		<aon:outputLabel for="#{controller.pojoShortName}_serial_date"
			value="#{itemTo.product.lotable ? bundle.aon_lot_date : bundle.aon_serial_date}" />
		<aon:selectInputDate id="#{controller.pojoShortName}_serial_date"
			value="#{itemTo.serialDate}"
			disabled="#{fieldDisabled}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />
	</aon:if>

	<aon:if test="#{itemTo.product.category != null and !empty itemTo.product.category.detail}">
		<aon:outputLabel for="#{controller.pojoShortName}_product_detail"
			value="#{itemTo.product.category.detail}" />
		<aon:inputText id="#{controller.pojoShortName}_product_detail" 
			value="#{itemTo.detail}" size="32" maxlength="15"
			disabled="#{fieldDisabled}"
			required="#{itemTo.product.id != null}"
			ajaxSingle="true"
			converter="aon.TrimStringConverter" />
	</aon:if>

	<aon:if test="#{itemTo.product.category != null and !empty itemTo.product.category.detail2}">
		<aon:outputLabel for="#{controller.pojoShortName}_product_detail2"
			value="#{itemTo.product.category.detail2}" />
		<aon:inputText id="#{controller.pojoShortName}_product_detail2" 
			value="#{itemTo.detail2}" size="32" maxlength="15"
			disabled="#{fieldDisabled}"
			required="#{itemTo.product.id != null}"
			ajaxSingle="true" 
			converter="aon.TrimStringConverter" />
	</aon:if>

	<aon:if test="#{itemTo.product.category != null and !empty itemTo.product.category.detail3}">
		<aon:outputLabel for="#{controller.pojoShortName}_product_detail3"
			value="#{itemTo.product.category.detail3}" />
		<aon:inputText id="#{controller.pojoShortName}_product_detail3" 
			value="#{itemTo.detail3}" size="32" maxlength="15"
			disabled="#{fieldDisabled}"
			required="#{itemTo.product.id != null}"
			ajaxSingle="true" 
			converter="aon.TrimStringConverter" />
	</aon:if>

	<aon:if test="#{configCollections.packingTypeTagsCount > 0}">
		<aon:outputLabel for="#{controller.pojoShortName}_packFormatTag"
			value="#{bundle.aon_format}" />
		<aon:div>
			<aon:selectOneMenu id="#{controller.pojoShortName}_packFormatTag" 
				value="#{itemTo.packFormatTag}" 
				required="#{itemTo.product.packaged}"
				ajaxSingle="true">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{configCollections.packingTypeTags}" />
			</aon:selectOneMenu>

			<aon:if test="#{itemTo.product.packaged}">
				<aon:outputLabel for="#{controller.pojoShortName}_packUnits"
					styleClass="aon-margin-left aon-margin-right aon-italic"
					value="#{bundle.aon_units}" />
				<aon:inputText id="#{controller.pojoShortName}_packUnits" 
					value="#{itemTo.packUnits}" size="1" maxlength="3"
					disabled="#{fieldDisabled}"
					required="#{true}"
					ajaxSingle="true" />

				<aon:outputLabel for="#{controller.pojoShortName}_packUnitsTag"
					styleClass="aon-margin-left aon-margin-right aon-italic"
					value="#{bundle.product_package}" />
				<aon:selectOneMenu id="#{controller.pojoShortName}_packUnitsTag" 
					value="#{itemTo.packUnitsTag}" 
					required="true"
					ajaxSingle="true">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{configCollections.packingTypeTags}" />
				</aon:selectOneMenu>
			</aon:if>
		</aon:div>

		<aon:if test="#{itemTo.product.packaged}">
			<aon:outputLabel for="#{controller.pojoShortName}_packMeasurement"
				value="#{bundle.aon_measurement}" />
			<aon:div>
				<aon:inputText id="#{controller.pojoShortName}_packMeasurement" 
					value="#{itemTo.packMeasurement}" size="2" maxlength="3"
					disabled="#{fieldDisabled}"
					required="#{true}"
					ajaxSingle="true" />

				<aon:outputLabel for="#{controller.pojoShortName}_packMeasurementTag"
					styleClass="aon-margin-left aon-margin-right aon-italic"
					value="#{bundle.aon_measurement_unit}" />
				<aon:selectOneMenu id="#{controller.pojoShortName}_packMeasurementTag" 
					value="#{itemTo.packMeasurementTag}" 
					required="true"
					ajaxSingle="true">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{configCollections.packingTypeTags}" />
				</aon:selectOneMenu>
			</aon:div>
		</aon:if>
	</aon:if>

	<aon:if test="#{aonConfiguration.bean.product.showBarcode}">
		<aon:outputLabel for="#{controller.pojoShortName}_barcode"
			value="#{bundle.product_barcode}" />
		<aon:inputText id="#{controller.pojoShortName}_barcode" 
			value="#{itemTo.barcode}" size="32" maxlength="32"
			disabled="#{fieldDisabled}"
			ajaxSingle="true"
			converter="aon.TrimStringConverter" />
	</aon:if>

	<aon:outputLabel for="#{controller.pojoShortName}_description" value="#{bundle.aon_description}" />
	<aon:inputTextarea id="#{controller.pojoShortName}_description"
		value="#{itemTo.description}" cols="50" rows="4"
		ajaxSingle="true" />

</ui:composition>
