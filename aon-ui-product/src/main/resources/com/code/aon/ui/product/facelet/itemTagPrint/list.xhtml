<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="itemTagPrint_list">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.product_tag_print_module}" />
				<ui:param name="controller" value="#{itemTagPrint}" />
				<ui:param name="skipResetButton" value="#{true}" />

				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="itemTagPrint-report"
						value="#{bundle.aon_listing} (55x40)" target="_blank"
						rendered="#{!(empty itemTagPrint.checkedItems) and itemTagPrint.checkedItems>0}"
						action="#{report.onExecute}" 
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="itemTagList" />
					</aon:htmlCommandLink>
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<f:facet name="header">
						<aon:panelGroup>
							<aon:outputText value="#{bundle.aon_apply_to_selected}" />
						</aon:panelGroup>
					</f:facet>
				    <h:panelGrid columns="8">
						<aon:outputLabel for="startPosition" styleClass="aon-bold"
							value="Posición de inicio: " />
						<rich:inputNumberSpinner id="startPosition"
				   			inputSize="2" minValue="1" cycled="#{false}"
							value="#{itemTagPrint.startPosition}" />
							
						<aon:outputLabel for="freeTextAll-all" styleClass="aon-bold"
							value="#{bundle.aon_text}: " />
						<aon:inputText id="freeTextAll-all"
							value="#{itemTagPrint.freeTextAll}" >
							<a4j:support event="onblur" reRender="freeTextAll-all" ajaxSingle="true" />
						</aon:inputText>
				
						<aon:outputLabel for="tagRepeatCount-all" styleClass="aon-bold"
							value="Repeticiones: " />
						<rich:inputNumberSpinner id="tagRepeatCount-all"
				   			inputSize="2" minValue="0" cycled="#{false}"
							value="#{itemTagPrint.tagRepeatCountAll}" />
						
						<aon:commandButton styleClass="aon-commandButton"
							value="#{bundle.aon_refresh}" 
							reRender="itemTagPrint_list"
							actionListener="#{itemTagPrint.completeAllValues}"
							onclick="Richfaces.showModalPanel('waitProccess')" 
				     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
				     </h:panelGrid>
				</aon:panel>
				
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{itemTagPrint}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					
					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:panelGroup>
									<aon:commandButton styleClass="aon-icon-commandButton aon-icon-checkAll"
										title="#{bundle.aon_check_all}"
										value="&#160;"
										reRender="itemTagPrint_list"
										actionListener="#{controller.checkAll}"
										ajaxSingle="true" 
										onclick="Richfaces.showModalPanel('waitProccess')" 
							     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
									<aon:commandButton styleClass="aon-icon-commandButton aon-icon-checkNone"
										title="#{bundle.aon_uncheck_all}"
										value="&#160;"
										reRender="itemTagPrint_list"
										actionListener="#{controller.checkNone}"
										ajaxSingle="true" 
										onclick="Richfaces.showModalPanel('waitProccess')" 
							     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
								</aon:panelGroup>
							</f:facet>
							<aon:selectBooleanCheckbox id="Included_Row_checked"
								value="#{controller.rowChecked}" >
								<a4j:support event="onclick" 
									ajaxSingle="true"
									ignoreDumpResponses="true"
									limitToList="true"
									eventsQueue="itemTagPrintChecks"
									reRender="itemTagPrint_list" />
							</aon:selectBooleanCheckbox>
							<f:facet name="footer">
								<aon:outputText value="#{controller.checkedItems}" />
							</f:facet>
						</aon:column>
						
						<ui:include src="/com/code/aon/ui/product/facelet/item/listBasic.xhtml" >
							<ui:param name="abbreviateName" value="#{false}" />
						</ui:include>
						
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-50">
							<f:facet name="header">
								<aon:panelGroup>
									<aon:outputText value="Repeticiones" />
								</aon:panelGroup>
							</f:facet>
							<aon:panelGroup>
								<rich:inputNumberSpinner id="tagRepeatCount"
					   				inputSize="2" minValue="1" cycled="#{false}"
									disabled="#{!controller.rowChecked}"
									value="#{controller.tagRepeatCountChanged}" >
									<a4j:support event="onchange" reRender="tagRepeatCount" ajaxSingle="true" />
					   			</rich:inputNumberSpinner>
							</aon:panelGroup>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:panelGroup style="white-space:nowrap;">
							<!--  
								<aon:commandLink id="customerLink" immediate="true"
									styleClass="aon-button-goto" style="padding-right: 15px;"
									value="&#160;" title="#{bundle.aon_go}" 
									actionListener="#{controller.onLoadCustomer}"
									action="customer_form"
									reRender="aonContent" />
								<aon:commandButton id="sddMandate-email"
									title="#{bundle.webmail_send_email}"
									value="&#160;"
									rendered="#{controller.rowChecked and controller.customerEmailAvailable}"
									actionListener="#{controller.onSendByEmail}"
									styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border"
									reRender="sepa_directDebit_list, showNewMessageWindow" />
								<aon:htmlCommandLink id="sddMandate-report"
									title="#{bundle.aon_report}"
									value="&#160;" target="_blank"
									rendered="#{controller.rowChecked}"
									action="#{report.onExecute}" 
									styleClass="aon-finding-toolbar-item aon-icon-pdf aon-finding-toolbar-item-no-border"
									accesskey="#{bundle.aon_key_print}">
									<f:param name="reportKey" value="sddMandate" />
								</aon:htmlCommandLink>
							-->
							</aon:panelGroup>
						</aon:column>
						
					</ui:define>
				</ui:decorate>
				
			</aon:div>
		</aon:form>
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" >
			<ui:param name="addWaitProcessPoll" value="sepa_directDebit_list-WaitProcess" />
		</ui:include>
		
	</ui:define>
</ui:composition>
