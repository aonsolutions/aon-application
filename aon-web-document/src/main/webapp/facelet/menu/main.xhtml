<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="generalMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-400, aon-vertical-align-top aon-width-400">

					<aon:panelGroup>
						<aon:panelGrid id="group_general"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-payroll aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_general}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="enterprise" action="#{enterprise.initialAction}"
										value="#{companyBundle.company_enterprise_module}">
										<aon:actionListener method="#{enterprise.onBasicViewSelect}" />
										<aon:actionListener method="#{enterprise.onEditSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="project" 
										action="project_search"
										actionListener="#{project.onEditSearch}"
										value="#{appBundle.menu_dossiers}">
									</aon:commandLink>
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>
					
					<aon:panelGroup>					
						<aon:panelGrid id="group_project_management"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-statistics">
							<f:facet name="header">
								<aon:outputText value="#{projectBundle.project_projects}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="project_type"
										action="projectType_list"
										actionListener="#{projectType.onSearch}"
										value="#{projectBundle.project_project_type}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="activity_type"
										action="activityTypeStandalone_grid"
										actionListener="#{activityTypeStandalone.onSearch}"
										value="#{projectBundle.project_activity_type}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>					

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
