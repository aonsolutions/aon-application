<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="documentMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-400, aon-vertical-align-top">

					<aon:panelGroup>
						<aon:panelGrid id="group_document"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-payroll aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_document}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="document_search" 
										action="enterpriseDocument_search"
										actionListener="#{enterpriseDocument.onEditSearch}"
										value="#{bundle.aon_toolbar_search}">
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="document_massive_upload" 
										action="enterpriseDocument_form"
										actionListener="#{enterpriseDocument.onReset}"
										value="#{documentBundle.document_massive_upload}">
									</aon:commandLink>
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					
					</aon:panelGroup>

					<aon:panelGrid id="group_document_auxiliaries"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-direct-access-panel aon-icon-general">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_auxiliaries}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="alfrescoCategory" 
									action="alfrescoCategory" 
									actionListener="#{alfrescoCategory.onSearch}" 
									value="#{registryBundle.registry_category}" />
							</aon:div>								
						</aon:div>
					</aon:panelGrid>							

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
