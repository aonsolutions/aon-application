<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/com/code/aon/ui/audit/facelet/shared/menu.xhtml">

	<ui:define name="menuContent">
		<aon:commandLink id="enterprise" 
			action="#{enterprise.initialAction}" immediate="true" 
			value="#{appBundle.menu_integral}"
			styleClass="aon-top-menu-item aon-icon-company">
			<aon:actionListener method="#{enterprise.onTreeViewSelect}" />
			<aon:actionListener method="#{enterprise.onEditSearch}" />
		</aon:commandLink>
		<aon:commandLink id="document_massive_upload" 
			action="enterpriseDocument_form" immediate="true"
			actionListener="#{enterpriseDocument.onReset}"
			value="#{documentBundle.document_upload}"
			styleClass="aon-top-menu-item aon-icon-payroll">
			<aon:actionListener method="#{enterprise.onBasicViewSelect}" />
			<aon:actionListener method="#{enterprise.onEditSearch}" />
		</aon:commandLink>
		<aon:commandLink id="config"
			value="#{bundle.aon_configuration}"
			action="menu_config" immediate="true"
			styleClass="aon-top-menu-item aon-icon-config" />		
		<rich:jQuery timing="onload"
			selector="body" query="removeClass('aon-overflow-hidden')" />				
	</ui:define>

	<ui:define name="beforeRightMenuContentEx" >
		<h:panelGrid columns="2">
			<aon:dropDownMenu>
	               <f:facet name="label"> 
					<aon:graphicImage title="#{bundle.aon_search}"
						value="#{aonResource.resolve['/images/aon-icon/aon-icon-lookup.png']}" />
	               </f:facet>					                
				<aon:menuItem id="advanced_search"
					value="#{documentBundle.document_advanced_search}"
					action="enterpriseDocument_search"
					actionListener="#{enterpriseDocument.onEditSearch}" 
					iconClass="aon-icon-go" >
					<f:setPropertyActionListener value="#{false}"
						target="#{enterpriseDocumentSearch.showList}"  />						
				</aon:menuItem>
			</aon:dropDownMenu>						
			<aon:inputText value="#{enterpriseDocumentSearch.mainText}"
				size="28" maxlength="32" tabindex="32767" >
				<rich:hotKey key="return" handler="mainSearch();return false;"/>
				<a4j:jsFunction name="mainSearch"
					action="enterpriseDocument_search" reRender="aonContent"
					actionListener="#{enterpriseDocumentSearch.onMainSearch}" />		
			</aon:inputText>
		</h:panelGrid>			
	</ui:define>
 </ui:composition>
