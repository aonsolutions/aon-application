<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="actionExecutionSearch">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_action_executions}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="search" value="#{bundle.aon_accept}"
							action="actionExecution_list" actionListener="#{actionExecution.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							action="actionExecution_list" actionListener="#{actionExecution.onCancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset" ajaxSingle="true"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<!-- end toolbar navigation -->

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:panelGrid columns="2">

						<aon:outputLabel for="ActionExecution_id"
							value="#{appBundle.aon_id}" />
						<aon:inputText id="ActionExecution_id" size="60"
							valueChangeListener="#{actionExecution.addExpression}" />

						<aon:outputLabel for="ActionExecution_session_id"
							value="#{appBundle.aon_session}" />
						<aon:inputText id="ActionExecution_session_id" size="60"
							valueChangeListener="#{actionExecution.addExpression}" />

						<aon:outputLabel for="ActionExecution_session_user_domain_name"
							value="#{appBundle.aon_domain}" />
						<aon:inputText id="ActionExecution_session_user_domain_name" size="60"
							valueChangeListener="#{actionExecution.addDirectExpression}" />

						<aon:outputLabel for="ActionExecution_session_application_name"
							value="#{appBundle.aon_application}" />
						<aon:inputText id="ActionExecution_session_application_name" size="60"
							valueChangeListener="#{actionExecution.addDirectExpression}" />

						<aon:outputLabel for="ActionExecution_session_user_login"
							value="#{appBundle.aon_user}" />
						<aon:inputText id="ActionExecution_session_user_login" size="60"
							valueChangeListener="#{actionExecution.addDirectExpression}" />

						<aon:outputLabel for="ActionExecution_action_name"
							value="#{appBundle.aon_action}" />
						<aon:inputText id="ActionExecution_action_name" size="60"
							valueChangeListener="#{actionExecution.addDirectExpression}" />

					</aon:panelGrid>

				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
