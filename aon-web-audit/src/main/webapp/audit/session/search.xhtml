<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="sessionSearch">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_sessions}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="search" value="#{bundle.aon_accept}"
							action="session_list" actionListener="#{auditSession.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							action="session_list" actionListener="#{auditSession.onCancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset" ajaxSingle="true"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<!-- end toolbar navigation -->

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:panelGrid columns="2">

						<aon:outputLabel for="Session_id"
							value="#{bundle.aon_id}" />
						<aon:inputText id="Session_id" size="60"
							valueChangeListener="#{auditSession.addExpression}" />

						<aon:outputLabel for="Session_user_domain_id"
							value="#{appBundle.aon_domain}" />
						<aon:selectOneMenu id="Session_user_domain_id"
							valueChangeListener="#{auditSession.addDirectExpression}">
							<f:selectItem value="#{null}" itemLabel="    " />
							<f:selectItems value="#{auditCollections.domains}" />
						</aon:selectOneMenu>					

						<aon:outputLabel for="Session_application_id"
							value="#{appBundle.aon_application}" />
						<aon:selectOneMenu id="Session_application_id"
							valueChangeListener="#{auditSession.addDirectExpression}">
							<f:selectItem value="#{null}" itemLabel="    " />
							<f:selectItems value="#{auditCollections.applications}" />
						</aon:selectOneMenu>					

						<aon:outputLabel for="Session_user_login"
							value="#{appBundle.aon_user}" />
						<aon:inputText id="Session_user_login" size="60"
							valueChangeListener="#{auditSession.addDirectExpression}" />

					</aon:panelGrid>

				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
