<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="sessionSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.aon_sessions}" />
				<ui:param name="controller" value="#{auditSession}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >

				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{auditSession.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="auditSession_list" />		

					<aon:outputLabel for="Session_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Session_id" size="60"
						valueChangeListener="#{auditSession.addExpression}" />

					<aon:outputLabel for="Session_user_domain_id"
						value="#{appBundle.aon_domain}" />
					<aon:selectOneMenu id="Session_user_domain_id"
						valueChangeListener="#{auditSession.addDirectExpression}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{auditCollections.domains}" />
					</aon:selectOneMenu>					

					<aon:outputLabel for="Session_application_id"
						value="#{appBundle.aon_application}" />
					<aon:selectOneMenu id="Session_application_id"
						valueChangeListener="#{auditSession.addDirectExpression}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{auditCollections.applications}" />
					</aon:selectOneMenu>					

					<aon:outputLabel for="Session_user_login"
						value="#{appBundle.aon_user}" />
					<aon:inputText id="Session_user_login" size="60"
						valueChangeListener="#{auditSession.addDirectExpression}" />
				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>
</ui:composition>
