<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<aon:dataTable id="actionExecutionData" value="#{actionExecution.model}"
			var="to" rows="20" rendered="#{actionExecution.model.rowCount > 0}"
			columnClasses="aon-editDataTable-numberColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn">

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_id}" />
				</f:facet>
				<aon:outputText value="#{to.id}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_action}" />
				</f:facet>
				<aon:outputText value="#{to.action.name}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.executionDate}">
					<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>							
			</aon:column>

		</aon:dataTable>

		<aon:dataScroller2 for="actionExecutionData" showNote="true" />

	</aon:div>

</ui:composition>
