<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<h:dataTable id="supplierEcDataDataTable" value="#{supplierEcData.model}" var="to"
		rows="20" styleClass="dr-table rich-table aon-editDataTable"
		headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
		footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
		rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
		cellpadding="0" cellspacing="0"
		columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
					   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:outputText value="&#160;" rendered="#{to==supplierEcData.to}" />
			<aon:commandButton rendered="#{to!=supplierEcData.to}"
				styleClass="aon-editDataTable-button aon-icon-rowSelector"
				actionListener="#{supplierEcData.onSelect}" value="" immediate="true"
				reRender="supplierEcDataDataTable">
			</aon:commandButton>
			<f:facet name="footer">
				<aon:div>
					<aon:commandButton id="reset"
						title="[#{bundle.aon_reset}]"
						styleClass="aon-editDataTable-button aon-icon-reset" value=""
						immediate="true" reRender="supplierEcDataDataTable"
						rendered="#{!supplierEcData.new}" actionListener="#{supplierEcData.onReset}"
						accesskey="#{bundle.aon_key_new_line}">
					</aon:commandButton>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_economic_data_date}" />
			</f:facet>
			<aon:outputText value="#{to.date}" rendered="#{to!=supplierEcData.to}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>		
			<aon:selectInputDate value="#{supplierEcData.to.date}"
				inputSize="15" datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
				rendered="#{to==supplierEcData.to}"/>
			<f:facet name="footer">
				<aon:div>
					<aon:selectInputDate value="#{supplierEcData.to.date}"
						inputSize="15" datePattern="#{bundle.aon_date_pattern}" enableManualInput="true"
						rendered="#{supplierEcData.new}"/>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_economic_data_description}" />
			</f:facet>
			<aon:outputText value="#{to.description}" rendered="#{to!=supplierEcData.to}" />
			<aon:inputText value="#{to.description}"
				rendered="#{to==supplierEcData.to}" size="80" maxlength="128" />
			<f:facet name="footer">
				<aon:div>
					<aon:inputText value="#{supplierEcData.to.description}"
						rendered="#{supplierEcData.new}" size="80" maxlength="128" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{appBundle.gbp_supplier_economic_data_file}" />
			</f:facet>
			<aon:outputText value="#{to.fileName}" rendered="#{to!=supplierEcData.to}"/>
			<aon:inputText value="#{supplierEcData.to.fileName}"
				rendered="#{to==supplierEcData.to}"
				size="30" maxlength="64" style="margin-right:0.5em;"/>
			<h:commandButton id="downloadFile" 
				rendered="#{to==supplierEcData.to}"
				title="[#{appBundle.gbp_supplier_economic_data_download}]"
				styleClass="aon-editDataTable-button aon-icon-file-download"
				actionListener="#{supplierEcData.downloadFile}" />
			<f:facet name="footer">
				<aon:div rendered="#{supplierEcData.new}">
					<t:inputFileUpload
						rendered="#{supplierEcData.fileData == null}"
						value="#{supplierEcData.file}"
						size="45" storage="file"
						required="true" style="margin-right:0.5em;" />
					<h:commandButton id="uploadFile" 
						rendered="#{supplierEcData.fileData == null}"
						title="[#{appBundle.gbp_supplier_economic_data_upload}]"
						styleClass="aon-editDataTable-button aon-icon-file-upload"
						actionListener="#{supplierEcData.fileUploaded}" />
					<aon:inputText value="#{supplierEcData.to.fileName}"
						rendered="#{supplierEcData.fileData != null}"
						size="30" maxlength="64" />
				</aon:div>	
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<f:verbatim rendered="#{to!=supplierEcData.to}">&#160;</f:verbatim>
			<aon:div rendered="#{to==supplierEcData.to}">
				<aon:commandButton id="lineAccept" title="[#{bundle.aon_accept}]"
					styleClass="aon-editDataTable-button aon-icon-accept"
					reRender="supplierEcDataDataTable"
					actionListener="#{supplierEcData.onAccept}" />
				<aon:commandButton id="lineCancel" title="[#{bundle.aon_cancel}]"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					reRender="supplierEcDataDataTable" immediate="true"
					actionListener="#{supplierEcData.onCancel}" />
				<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
					styleClass="aon-editDataTable-button aon-icon-delete"
					reRender="supplierEcDataDataTable" immediate="true"
					actionListener="#{supplierEcData.onRemove}" />
			</aon:div>
			<f:facet name="footer">
				<aon:div rendered="#{supplierEcData.new}">
					<f:verbatim rendered="#{!supplierEcData.new}">&#160;</f:verbatim>
					<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
						styleClass="aon-editDataTable-button aon-icon-accept"
						reRender="supplierEcDataDataTable"
						actionListener="#{supplierEcData.onAccept}" />
					<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						reRender="supplierEcDataDataTable" immediate="true"
						actionListener="#{supplierEcData.onCancel}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</h:dataTable>

	<aon:dataScroller dataTable="supplierEcDataDataTable" model="#{supplierEcData.model}" />

</ui:composition>

</body>
</html>
