<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountContactForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_account_contact}" />
					</aon:div>						

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.gbp_listing}- #{appBundle.gbp_editing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">

						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{accountContact.onReset}"
							rendered="#{!accountContact.new}"
							reRender="accountContactDataTable,gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{accountContact.to!=null}"
							reRender="accountContactDataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{accountContact.onAccept}"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{accountContact.to!=null}"
							reRender="accountContactDataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}"
							actionListener="#{accountContact.onCancel}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{accountContact.to!=null and !accountContact.new}"
							reRender="accountContactDataTable, gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{accountContact.onRemove}"
							accesskey="#{bundle.aon_key_remove}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<h:dataTable id="accountContactDataTable"
					value="#{accountContact.model}" var="to" rows="20"
					styleClass="dr-table rich-table aon-editDataTable"
					headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
					footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
					rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
					cellpadding="0" cellspacing="0"
					columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							   dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText value="&#160;" rendered="#{to==accountContact.to}" />
						<aon:commandButton rendered="#{to!=accountContact.to}"
							styleClass="aon-editDataTable-button aon-icon-rowSelector"
							actionListener="#{accountContact.onSelect}" value="" immediate="true"
							reRender="accountContactDataTable,gridToolbar">
						</aon:commandButton>
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset"
									value="" immediate="true"
									reRender="accountContactDataTable,gridToolbar"
									rendered="#{!accountContact.new}"
									actionListener="#{accountContact.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_account_contact_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}" rendered="#{to!=accountContact.to}" />
						<aon:inputText value="#{to.description}"
							styleClass="aon-form-input-text" 
							rendered="#{to==accountContact.to}"
							size="64" maxlength="64" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{accountContact.to.description}"
									styleClass="aon-form-input-text" 
									rendered="#{accountContact.new}"
									size="64" maxlength="64" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_account_contact_address}" />
						</f:facet>
						<aon:outputText value="#{to.address}" rendered="#{to!=accountContact.to}" />
						<aon:inputText value="#{to.address}"
							styleClass="aon-form-input-text" 
							rendered="#{to==accountContact.to}"
							size="64" maxlength="64" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{accountContact.to.address}"
									styleClass="aon-form-input-text" 
									rendered="#{accountContact.new}"
									size="64" maxlength="64" />
							</aon:div>
						</f:facet>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.gbp_account_contact_contact_person}" />
						</f:facet>
						<aon:outputText value="#{to.contactPerson}" rendered="#{to!=accountContact.to}" />
						<aon:inputText value="#{to.contactPerson}"
							styleClass="aon-form-input-text" 
							rendered="#{to==accountContact.to}"
							size="64" maxlength="64" />
						<f:facet name="footer">
							<aon:div>
								<aon:inputText value="#{accountContact.to.contactPerson}"
									styleClass="aon-form-input-text" 
									rendered="#{accountContact.new}"
									size="64" maxlength="64" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=accountContact.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==accountContact.to}">
							<aon:commandButton id="lineAccept"
								title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="accountContactDataTable,gridToolbar"
								actionListener="#{accountContact.onAccept}" />
							<aon:commandButton id="lineCancel"
								title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="accountContactDataTable,gridToolbar" immediate="true"
								actionListener="#{accountContact.onCancel}" />
							<aon:commandButton id="lineRemove"
								title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="accountContactDataTable,gridToolbar" immediate="true"
								actionListener="#{accountContact.onRemove}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{accountContact.new}">
								<f:verbatim rendered="#{!accountContact.new}">&#160;</f:verbatim>
								<aon:commandButton id="newAccept"
									title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="accountContactDataTable,gridToolbar"
									actionListener="#{accountContact.onAccept}" />
								<aon:commandButton id="newCancel"
									title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="accountContactDataTable,gridToolbar" immediate="true"
									actionListener="#{accountContact.onCancel}" />
							</aon:div>
						</f:facet>
					</aon:column>
				</h:dataTable>

				<aon:dataScroller dataTable="accountContactDataTable" model="#{accountContact.model}" />
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
</body>
</html>
