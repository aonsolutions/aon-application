<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/front/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="frontProFormaForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_front_pro_forma}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.gbp_searching}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							action="front_pro_forma_list"
							actionListener="#{frontProForma.onCancel}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="front_pro_forma_list"
							actionListener="#{frontProForma.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="ProFormaInvoice_campaign_code"
						value="#{appBundle.gbp_proforma_invoice_campaign_code}" />
					<aon:inputText id="ProFormaInvoice_campaign_code"
						size="16" maxlenght="16"
						valueChangeListener="#{frontProForma.addExpression}" />

					<aon:outputLabel for="ProFormaInvoice_number"
						value="#{appBundle.gbp_proforma_invoice_number}" />
					<aon:inputText id="ProFormaInvoice_number"
						size="16" maxlenght="16"
						valueChangeListener="#{frontProForma.addExpression}" />

					<aon:outputLabel for="ProFormaInvoice_invoiceDate"
						value="#{appBundle.gbp_proforma_invoice_invoice_date}" />
					<aon:div>
						<aon:outputLabel for="ProFormaInvoice_invoiceDate_from"
							value="#{appBundle.gbp_from}" />
						<aon:selectInputDate id="ProFormaInvoice_invoiceDate_from"
							valueChangeListener="#{frontProForma.addFromDateExpression}"
							datePattern="#{bundle.aon_date_pattern}"
							enableManualInput="true" inputSize="15" />
						<aon:outputLabel for="ProFormaInvoice_invoiceDate_to"
							value="#{appBundle.gbp_to}" />
						<aon:selectInputDate id="ProFormaInvoice_invoiceDate_to"
							valueChangeListener="#{frontProForma.addToDateExpression}"
							datePattern="#{bundle.aon_date_pattern}"
							enableManualInput="true" inputSize="15" />
					</aon:div>
					
					<aon:outputLabel for="ProFormaInvoice_status"
						value="#{appBundle.gbp_proforma_invoice_status}" />
					<aon:selectOneMenu id="ProFormaInvoice_status"
						converter="proFormaStatusConverter"
						valueChangeListener="#{frontProForma.addStatusExpression}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{GBPCollections.proformaInvoiceStatus}" />
					</aon:selectOneMenu>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
