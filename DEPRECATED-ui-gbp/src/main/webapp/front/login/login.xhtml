<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>
	<a4j:loadStyle src="/login/css/login-aon.css" rendered="#{login.supplier == null}"/>
	
	<aon:form>
	<aon:panelGrid style="width:100%;height:100%;" columns="1" columnClasses="aon-vertical-align-middle aon-text-center">
		<aon:div styleClass="aon-login-box">
			<aon:div styleClass="aon-login-title">
				<aon:outputText value="#{appBundle.gbp_supplier_application_title}" styleClass="aon-bold"/>
			</aon:div>

			<aon:div id="aon-errors" styleClass="aon-errors"
				rendered="#{facesContext.maximumSeverity != null}" >
				<aon:messages />
			</aon:div>
			
			<aon:outputText value="#{securityBundle.aon_login_label}" styleClass="aon-login-help"/>
			
			<aon:panelGrid style="width:100%;border:0;" columns="2" cellpadding="2" cellspacing="2"
				columnClasses="aon-login-box-left,aon-login-box-right">
	
				<aon:outputLabel for="login"
					value="#{securityBundle.aon_login_user}:"
					styleClass="aon-login-label" />
				<aon:inputText id="login" required="true" size="16"
					maxlength="16" value="#{login.login}" />
	
				<aon:outputLabel for="password"
					value="#{securityBundle.aon_login_passwd}:"
					styleClass="aon-login-label" />
				<aon:inputSecret id="password" 
					required="true" size="16"
					styleClass="aon-inputText"
					maxlength="16" value="#{login.password}" />
	
				<aon:outputLabel for="login_btn" value="" />
				<h:commandButton id="login_btn" 
					value="Validar"	action="#{login.validate}"
					styleClass="aon-login-button"/>
	
			</aon:panelGrid>
		</aon:div>
					<aon:div styleClass="aon-login-info2">						
						<aon:outputText value="#{appBundle.gbp_support}" />
						<a href="mailto:gbp@glodimark.com">gbp@glodimark.com</a>
					</aon:div>	
	</aon:panelGrid>
	</aon:form>
	<script>
		document.getElementsByTagName("input")[0].focus();
	</script>

</ui:composition>

</body>
</html>
