<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:column alias="ActivityType.description" styleClass="aon-editDataTable-text aon-width-350">
		<f:facet name="header">
			<aon:outputLabel for="ActivityType_description" value="#{bundle.aon_description}" />
		</f:facet>
		<aon:outputText value="#{to.description}" rendered="#{formList}"/>
		<aon:inputText id="ActivityType_description"
			rendered="#{formEdit}" size="40" required="true" 
			value="#{controller.to.description}"/>
		<f:facet name="footer">
			<aon:inputText id="ActivityType_description-New"
				rendered="#{formNew}" required="#{true}" size="40" 
				value="#{controller.to.description}"/>
		</f:facet>
	</aon:column>

	<c:if test="#{showProjectType}">
		<aon:column alias="ActivityType.projectType.id" styleClass="aon-editDataTable-text aon-width-auto">
			<f:facet name="header">
				<aon:outputLabel for="ActivityType_projectType" value="#{bundle.project_project_type}" />
			</f:facet>
			<aon:outputText value="#{to.projectType.description}" rendered="#{formList}"/>
			<aon:selectOneMenu id="ActivityType_projectType" rendered="#{formEdit}"
				value="#{controller.to.projectType}">
				<f:selectItem itemValue="-" value="#{null}" />
				<f:selectItems value="#{projectCollections.projectTypes}" />
			</aon:selectOneMenu>
			<f:facet name="footer">
				<aon:selectOneMenu id="ActivityType_projectType-New" rendered="#{formNew}"
					value="#{controller.to.projectType}">
				<f:selectItem itemValue="-" value="#{null}" />
					<f:selectItems value="#{projectCollections.projectTypes}" />
				</aon:selectOneMenu>
			</f:facet>
		</aon:column>
	</c:if>
	
	<aon:column alias="ActivityType.active" styleClass="aon-editDataTable-textColumn aon-width-40">
		<f:facet name="header">
			<aon:outputLabel for="ActivityType_active" value="#{bundle.aon_active}" />
		</f:facet>
		<aon:outputText rendered="#{formList}" value="&#160;"
			styleClass="#{(to.active)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'} aon-padding-bottom" />
		<aon:selectBooleanCheckbox id="ActivityType_active" 
			rendered="#{formEdit}" value="#{controller.to.active}" />	
		<f:facet name="footer">
			<aon:selectBooleanCheckbox id="ActivityType_active-New" 
				rendered="#{formNew}" value="#{controller.to.active}" />	
		</f:facet>
	</aon:column>							
</ui:composition>
