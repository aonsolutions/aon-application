<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="dailyTrackingList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarID" value="toolbar" />
				<ui:param name="toolbarTitle"
					value="#{projectBundle.aon_daily_tracking}" />
				<ui:param name="controller" value="#{dailyTracking}" />
				<ui:define name="additionalToolbarContent">
					<aon:selectBooleanCheckbox id="monitor"
						value="#{dailyTracking.monitor}" rendered="#{aonRole.taskMonitor}">
						<a4j:support event="onclick" reRender="toolbar,dailyTrackingData"
							actionListener="#{dailyTracking.onSwicthMonitor}">
						</a4j:support>
					</aon:selectBooleanCheckbox>
					<aon:outputLabel for="monitor" value="Monitor"
						rendered="#{aonRole.taskMonitor}" />
				</ui:define>>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div id="dailyTrackingData" styleClass="aon-scroll-area">

				<aon:dataTable id="dailyTrackingDataList"
					value="#{dailyTracking.model}" rows="20" var="to">
					<aon:column styleClass="aon-editDataTable-iconColumn">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandButton
							value="&#160;"
							styleClass="aon-icon-commandButton aon-icon-rowSelector"
							actionListener="#{dailyTracking.onSelect}"
							action="dailyTracking_form">
						</aon:commandButton>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-text">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.trackingDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-iconColumn">
						<f:facet name="header">
							<aon:outputText value="C" />
						</f:facet>
						<aon:div style="display:inline;cursor:pointer;"
							rendered="#{to.comments != null and to.comments!=''	}">
							<aon:graphicImage url="/css/images/icons/aon-task-comment.gif" />
							<rich:toolTip value="#{to.comments}" showEvent="onclick"
								hideDelay="2000">
								<f:facet name="defaultContent">
									<aon:outputText value="#{projectBundle.aon_wait}" />
								</f:facet>
							</rich:toolTip>
						</aon:div>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-text"
						rendered="#{dailyTracking.monitor}">
						<f:facet name="header">
							<aon:outputText value="#{projectBundle.task_user}" />
						</f:facet>
						<aon:outputText value="#{to.user.name}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-text">
						<f:facet name="header">
							<aon:outputText
								value="#{projectBundle.aon_daily_tracking_dossier}" />
						</f:facet>
						<aon:outputText value="#{to.dossier.number}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-text">
						<f:facet name="header">
							<aon:outputText
								value="#{projectBundle.aon_daily_tracking_activity}" />
						</f:facet>
						<aon:outputText value="#{to.activity.activityType.description}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-text">
						<f:facet name="header">
							<aon:outputText
								value="#{projectBundle.aon_daily_tracking_job_type}" />
						</f:facet>
						<aon:outputText value="#{to.jobType.description}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-text">
						<f:facet name="header">
							<aon:outputText value="#{customerBundle.customer_customer}" />
						</f:facet>
						<aon:outputText value="#{to.customer.registry.fullName}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-number">
						<f:facet name="header">
							<aon:outputText
								value="#{projectBundle.aon_daily_tracking_duration}" />
						</f:facet>
						<aon:outputText value="#{to.trackingDuration}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>
				</aon:dataTable>
				<aon:dataScroller2 for="dailyTrackingDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
