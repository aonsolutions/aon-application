<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="dossierTypeForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{projectBundle.aon_dossier_type}" />
				<ui:param name="controller" value="#{dossierType}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true">
					<aon:outputLabel for="DossierType_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="DossierType_description" required="true"
						size="60" maxlength="45" value="#{dossierType.to.description}" />
				</aon:panelGrid>


				<aon:div styleClass="aon-form-group" rendered="#{!dossierType.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:outputLabel for="activityTypeDataList"
							value="#{projectBundle.activity_activity_types}" />
					</aon:div>

					<aon:div styleClass="aon-form-group-body">

						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
							<ui:param name="controller" value="#{activityType}" />
							<ui:param name="columnClasses" value="aon-editDataTable-text" />

							<ui:define name="columns">
								<aon:column>
									<f:facet name="header">
										<h:outputText value="#{bundle.aon_description}" />
									</f:facet>
									<aon:outputText value="#{to.description}"
										rendered="#{to.id!=activityType.to.id}" />
									<aon:inputText rendered="#{to.id==activityType.to.id}"
										size="45" id="description_edit"
										value="#{activityType.to.description}" required="true" />
									<f:facet name="footer">
										<aon:inputText rendered="#{activityType.new}"
											id="description_new" value="#{activityType.to.description}"
											required="true" size="45" />
									</f:facet>
								</aon:column>
							</ui:define>
						</ui:decorate>
					</aon:div>
				</aon:div>

			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
