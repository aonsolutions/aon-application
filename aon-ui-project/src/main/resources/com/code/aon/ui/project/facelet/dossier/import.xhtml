<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

	<aon:form id="importActivitiesForm">
		<aon:div id="importContainer">
			<rich:modalPanel id="importActivities" top="100" left="100"
				rendered="#{activitiesImporter.importPanel}" showWhenRendered="true"
				minHeight="100" minWidth="100" height="500" width="600"
				zindex="1000">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<h:outputText value="#{projectBundle.dossier_import}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:commandButton type="button" styleClass="aon-popupWindow-close"
						actionListener="#{activitiesImporter.onCloseImportPanel}"
						reRender="importContainer" immediate="true" />
				</f:facet>
				<aon:div styleClass="aon-scroll-area" style="width: 90%;">
					<aon:div styleClass="aon-finding-title-toolbar">
						<aon:panelGrid columns="1" dir="true"
							columnClasses="aon-finding-toolbar">

							<aon:div styleClass="aon-finding-toolbar-item-group">
								<aon:commandButton id="import" ajaxSingle="true"
									value="#{projectBundle.dossier_import}"
									styleClass="aon-finding-toolbar-item aon-icon-accept"
									reRender="importContainer,customerTab"
									actionListener="#{activitiesImporter.onImport}" />
							</aon:div>
						</aon:panelGrid>
					</aon:div>
					<aon:div>
						<aon:panelGrid columns="6" dir="true"
							style="width: 95%;margin-top: 5px;">
							<aon:outputLabel for="import_dossier"
								value="#{projectBundle.dossier_import_from}" />
							<h:selectOneMenu id="import_dossier"
								value="#{activitiesImporter.dossierId}">
								<a4j:support event="onchange" reRender="activitiesContainer"
									actionListener="#{activitiesImporter.onChangeDossier}"
									ajaxSingle="true" />
								<f:selectItem value="#{nullSelectItem.value}" />
								<f:selectItems value="#{activitiesImporter.dossiers}" />
							</h:selectOneMenu>
						</aon:panelGrid>
						<aon:div id="activitiesContainer" style="margin-top: 5px;">
							<aon:editDataTable id="activitiesTable" var="to"
								style="width: 95%;" value="#{activitiesImporter.model}"
								rows="20"
								columnClasses="aon-editDataTable-iconColumn,
											   aon-editDataTable-textColumn,
											   aon-editDataTable-textColumn">

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:outputText value="&#160;&#160;&#160;&#160;&#160;&#160;" styleClass="aon-icon-mail-spam"
										rendered="#{!to.clickable}" />
									<h:selectBooleanCheckbox value="#{to.selected}"
										rendered="#{to.clickable}"> 
										<a4j:support event="onclick" ajaxSingle="true" eventsQueue="selectCheck"
											ignoreDupResponses="true" requestDelay="100" />
									</h:selectBooleanCheckbox>
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_type}" />
									</f:facet>
									<aon:outputText value="#{to.activity.activityType.description}" />
									<aon:outputText
										value=" (#{to.activity.activityType.dossierType.description})"
										rendered="#{to.activity.activityType.dossierType != null}" />
								</aon:column>

								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{projectBundle.activity_assigned}" />
									</f:facet>
									<aon:outputText value="#{to.activity.workgroup.description}" />
								</aon:column>
							</aon:editDataTable>
							<aon:dataScroller for="activitiesTable"
								rowCount="#{activitiesImporter.model.rowCount}" showNote="true" />
						</aon:div>
					</aon:div>
				</aon:div>
			</rich:modalPanel>
		</aon:div>
	</aon:form>
</ui:composition>
