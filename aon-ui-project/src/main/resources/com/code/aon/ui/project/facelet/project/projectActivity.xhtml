<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

		<aon:div styleClass="aon-form-group" rendered="#{!project.nevv}">
			<aon:div styleClass="aon-form-group-body">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="controller" value="#{projectActivity}" />
					<ui:param name="columnClasses" value="aon-editDataTable-text" />
					<ui:define name="columns">

						<aon:column alias="ProjectActivity.activityType.description" styleClass="aon-editDataTable-text aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel for="ProjectActivity_activityType" value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.activityType.description}" rendered="#{formList}"/>
							<aon:selectOneMenu id="ProjectActivity_activityType" rendered="#{formEdit}"
								required="true" value="#{controller.to.activityType}">
								<f:selectItem itemValue="-" value="#{null}" />
								<f:selectItems value="#{controller.activityTypes}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu id="ProjectActivity_activityType-New" rendered="#{formNew}"
									required="true" value="#{controller.to.activityType}">
									<f:selectItem itemValue="-" value="#{null}" />
									<f:selectItems value="#{controller.activityTypes}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>
						
						<aon:column alias="ProjectActivity.active" styleClass="aon-editDataTable-textColumn aon-width-40">
							<f:facet name="header">
								<aon:outputLabel for="ProjectActivity_active" value="#{bundle.aon_active}" />
							</f:facet>
							<aon:outputText rendered="#{formList}" value="&#160;"
								styleClass="#{(to.active)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'} aon-padding-bottom" />
							<aon:selectBooleanCheckbox id="ProjectActivity_active" 
								rendered="#{formEdit}" value="#{controller.to.active}" />	
							<f:facet name="footer">
								<aon:selectBooleanCheckbox id="ProjectActivity_active-New" 
									rendered="#{formNew}" value="#{controller.to.active}" />	
							</f:facet>
						</aon:column>							
					
					</ui:define>
				</ui:decorate>
				
			</aon:div>
		</aon:div>

</ui:composition>
