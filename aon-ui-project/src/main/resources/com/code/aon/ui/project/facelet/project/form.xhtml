<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	
	<ui:define name="content">

		<aon:form id="projectForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{projectBundle.project_projects}" />
				<ui:param name="controller" value="#{project}" />

				<ui:param name="skipRemoveButton" value="#{project.to != null and project.to.extended}" />
				<ui:param name="skipSaveButton" value="#{project.to != null and project.to.extended}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="importDossier"
						value="#{projectBundle.project_import}" reRender="importContainer"
						rendered="#{!project.new}"
						actionListener="#{activitiesImporter.onShowImportPanel}"
						styleClass="aon-finding-toolbar-item aon-icon-mailReply" />
					<c:if test="#{!project.new}">
						<aon:commandButton id="ProjectHistory" 
							action="project_stats" 
							actionListener="#{project.onProjectHistory}"
							value="#{statBundle.stat_dashboard}"
							styleClass="aon-finding-toolbar-item aon-icon-statistics" />
					</c:if>		
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2" dir="true" style="width: 100%;">
				
					<aon:outputLabel for="Project_id" rendered="#{!project.new}" 
						value="#{bundle.aon_id}" />
					<aon:div rendered="#{!project.new}">
						<aon:inputText id="Project_id" required="true" disabled="true"
							size="10" value="#{project.to.id}" />
						<aon:selectBooleanCheckbox id="Project_active" styleClass="aon-margin-left" 
							value="#{project.to.active}" />	
						<aon:outputLabel for="Project_active" value="#{bundle.aon_active}" />	
					</aon:div>

					<aon:outputLabel for="Project_name" value="#{bundle.aon_name}" />
					<aon:inputText id="Project_name" required="true"
						size="64" maxlength="64" value="#{project.to.name}" />
					
					<aon:outputLabel for="Project_alias" value="#{bundle.aon_alias}" />
					<aon:inputText id="Project_alias" 
						size="32" maxlength="32" value="#{project.to.alias}" />

					<aon:outputLabel for="Project_date" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Project_date"
						value="#{project.to.date}" required="#{true}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
					
					<aon:outputLabel for="Registry_id" value="#{projectBundle.project_assigned}"/>
					<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
						<ui:param name="lookupTo" value="#{project.to.registry}" />
						<ui:param name="skipLabel" value="#{true}" />
					</ui:include>
					
					<aon:outputLabel for="Project_projectType" value="#{projectBundle.project_project_type}"/>
					<aon:selectOneMenu id="Project_projectType"
						value="#{project.to.projectType}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{projectCollections.projectTypes}" />
					</aon:selectOneMenu>

				</aon:panelGrid>

				<ui:include src="/com/code/aon/ui/project/facelet/project/projectActivity.xhtml" />
				
			</aon:div>
			
		</aon:form>
		<ui:include src="/com/code/aon/ui/project/facelet/project/import.xhtml" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
	</ui:define>
</ui:composition>
