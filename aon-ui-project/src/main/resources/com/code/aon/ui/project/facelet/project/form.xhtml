<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="projectForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.aon_module_groupware}" />
				<ui:param name="controller" value="#{project}" />

				<ui:param name="skipRemoveButton" value="#{project.to != null and project.to.extended}" />
				<ui:param name="skipSaveButton" value="#{project.to != null and project.to.extended}" />

				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="importDossier"
						value="#{bundle.project_import}" reRender="importContainer"
						rendered="#{!project.nevv}"
						actionListener="#{activitiesImporter.onShowImportPanel}"
						styleClass="aon-finding-toolbar-item aon-icon-mailReply" />
					<aon:if test="#{!project.nevv}">
						<aon:commandButton id="ProjectHistory" 
							action="project_stats" 
							actionListener="#{project.onProjectHistory}"
							value="#{bundle.daily_tracking_graphic}"
							styleClass="aon-finding-toolbar-item aon-icon-statistics" />
					</aon:if>		
					
					<ui:include src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />

					<aon:commandLink id="resume-expedient-export" value="Analítica"
						onclick="resumeExpedient('#{project.to.id}')"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
					</aon:commandLink>
					
					<aon:commandLink id="full-expedient-export" value="Analítica Detallada"
						onclick="fullExpedient('#{project.to.id}')"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
					</aon:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{project.nevv}">
					<ui:include src="/com/code/aon/ui/project/facelet/project/formNewContent.xhtml">
						<ui:param name="controller" value="#{project}" />
					</ui:include>				
				</aon:if>							
				<aon:if test="#{!project.nevv}">			
					<aon:panelGrid columns="2" dir="true" styleClass="aon-width-all"
						columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-auto">

						<ui:include src="/com/code/aon/ui/project/facelet/project/formContent.xhtml">
							<ui:param name="controller" value="#{project}" />
						</ui:include>
					</aon:panelGrid>

					<aon:panelTabSet id="projectTabSet" selectedTab="#{project.selectedTab}">
						<aon:panelTab id="project_activities" label="#{bundle.aon_activities}">
							<aon:if test="#{project.selectedTab == 'project_activities' or project.selectedTab == null}">
								<ui:include src="/com/code/aon/ui/project/facelet/project/projectActivity.xhtml" />
							</aon:if>
						</aon:panelTab>
						<aon:panelTab id="#{project.graphTabId}" label="#{bundle.stat_economic_summary}"
							actionListener="#{project.onGraphicTab}">
							<aon:if test="#{project.selectedTab == project.graphTabId}">
								<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/economicSummary.xhtml" />
								<aon:outputText value="#{bundle.stat_project_comment}" styleClass="aon-italic"/>
							</aon:if>
						</aon:panelTab>
						<aon:panelTab id="#{project.ganttTabId}" label="Gantt" actionListener="#{project.onGraphicTab}">
							<aon:if test="#{project.selectedTab == project.ganttTabId}">
								<ui:include	src="/com/code/aon/ui/stat/facelet/projectStat/gantt.xhtml" />
							</aon:if>
						</aon:panelTab>
						<aon:panelTab id="documents" label="#{bundle.aon_documents}">
							<aon:if test="#{project.selectedTab == 'documents'}">
								<ui:include	src="/com/code/aon/ui/project/facelet/projectAttachment/tab_grid.xhtml" >
									<ui:param name="controller" value="#{projectAttach}" />
								</ui:include>
							</aon:if>
						</aon:panelTab>						
					</aon:panelTabSet>
				</aon:if>

			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/project/facelet/project/import.xhtml" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
	</ui:define>
</ui:composition>
