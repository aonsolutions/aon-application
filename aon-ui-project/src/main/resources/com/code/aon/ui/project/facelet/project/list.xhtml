<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="projectList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{projectBundle.project_projects}" />
				<ui:param name="controller" value="#{project}" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{project}" />
					<ui:define name="columns">
					
						<ui:include 
							src="/com/code/aon/ui/project/facelet/project/listBasic.xhtml" />

						<aon:column alias="Project.alias" styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}" />
						</aon:column>
						
						<aon:column alias="Project.date" styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
					
						<aon:column alias="Project.active" styleClass="aon-editDataTable-textColumn aon-width-40">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_active}" />
							</f:facet>
							<aon:outputText value="&#160;"
								styleClass="#{(to.active)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'} aon-padding-bottom" />
						</aon:column>							

					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
