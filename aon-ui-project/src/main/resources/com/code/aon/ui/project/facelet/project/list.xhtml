<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		
		<aon:form id="projectList">



			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_module_groupware}" />
				<ui:param name="controller" value="#{project}" />

				<ui:define name="additionalToolbarContent">
					
					<ui:include src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />

					<aon:commandLink id="resume-expedient-export" value="Analítica"
						onclick="resumeExpedient('#{projectExport.code}', '#{projectExport.name}', '#{projectExport.alias}', '#{projectSearchListener.registry.id}', '#{projectSearchListener.projectType.id}', '#{projectSearchListener.active}', '#{projectExport.fromStr}', '#{projectExport.toStr}')"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
					</aon:commandLink>
										
					<aon:commandLink id="full-expedient-export" value="Analítica Detallada"
						onclick="fullExpedient('#{projectExport.code}', '#{projectExport.name}', '#{projectExport.alias}', '#{projectSearchListener.registry.id}', '#{projectSearchListener.projectType.id}', '#{projectSearchListener.active}', '#{projectExport.fromStr}', '#{projectExport.toStr}')"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
					</aon:commandLink>
			
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{project}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<aon:commandLink id="#{dataTableId}-selectButton" 
								styleClass="#{(to.active) ? ('aon-icon-point-green') : ('aon-icon-point-red')}" 
								value="&#160;&#160;&#160;&#160;"
								title="#{(to.active) ? (bundle.aon_active) : (bundle.aon_inactive)}" 
								immediate="true" ajaxSingle="true" requestDelay="100"
								action="#{rowSelectorAction}"
								actionListener="#{rowSelectorActionListener}"
								onkeyup="#{dataTableId}KeyUp(this)"
								onfocus="disableRowSelector();#{dataTableId}SelectRow(this)"
								onblur="enableRowSelector();#{dataTableId}DeselectRow(this)"
								onmouseover="disableRowSelector();"
								onmouseout="enableRowSelector();"				
								focus="#{(focusOnSelect != null)?(focusOnSelect):''}"
								reRender="#{rowSelectorReRender}" >
							</aon:commandLink>
						</aon:column>
 
						<ui:include	src="/com/code/aon/ui/project/facelet/project/listBasic.xhtml" />

						<aon:column alias="Project.date" styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Project.projectType" styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.project_project_type}" />
							</f:facet>
							<aon:outputText value="#{to.projectType.description}" />
						</aon:column>

						<aon:if test="#{actionDenied.moduleEnabled['hotel'] or actionDenied.moduleEnabled['garage'] or actionDenied.moduleEnabled['commercial']}">
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_source}" />
								</f:facet>
								<aon:outputText value="#{bundle.tas_project_tas}" rendered="#{to.tas}" />
								<aon:outputText value="#{bundle.commercial_operation_module}" rendered="#{to.commercial}" />
								<aon:outputText value="#{bundle.aon_reservation} - #{bundle.aon_module_hotel}" rendered="#{to.reservation}" />
							</aon:column>
						</aon:if>

					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
