<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="activityTypeStandaloneList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{bundle.project_activity_type}" />
					<ui:param name="controller" value="#{activityTypeStandalone}" />
				</ui:include>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{activityTypeStandalone}" />

						<ui:define name="columns">
							<ui:include src="/com/code/aon/ui/project/facelet/activityType/gridColumnsContent.xhtml">
								<ui:param name="showProjectType" value="#{true}" />
							</ui:include>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
