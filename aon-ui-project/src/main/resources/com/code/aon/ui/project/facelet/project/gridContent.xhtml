<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:define name="columns">

			<aon:column alias="Project.name"
				styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel for="Project_name" value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.name}"
					rendered="#{formList}" />
				<aon:inputText id="Project_name"
					value="#{controller.to.name}"
					rendered="#{formEdit}" required="true" 
					size="20" maxlength="64" />
				<f:facet name="footer">
					<aon:inputText id="Project_name-New"
						value="#{controller.to.name}"
						rendered="#{formNew}" required="true" 
						size="20" maxlength="64" />
				</f:facet>
			</aon:column>

			<aon:column alias="Project.alias"
				styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel for="Project_alias" value="#{bundle.aon_alias}" />
				</f:facet>
				<aon:outputText value="#{to.name}"
					rendered="#{formList}" />
				<aon:inputText id="Project_alias"
					value="#{controller.to.alias}"
					rendered="#{formEdit}" size="20" maxlength="32" />
				<f:facet name="footer">
					<aon:inputText id="Project_alias-New"
						value="#{controller.to.alias}"
						rendered="#{formNew}" size="20" maxlength="32" />
				</f:facet>
			</aon:column>

			<aon:column alias="Project.date"
				styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel for="Project_date" value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.date}"
					rendered="#{formList}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="Project_date"
					value="#{controller.to.date}"
					rendered="#{formEdit}" 
					required="true" inputSize="7"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}" />
				<f:facet name="footer">
					<aon:selectInputDate id="Project_date-New"
						value="#{controller.to.date}"
						rendered="#{formNew}" 
						required="true" inputSize="7"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="Project_active" value="#{bundle.aon_active}" />
				</f:facet>
				<aon:div rendered="#{formList}" styleClass="#{to.active?'aon-icon-checked':'aon-icon-check'}">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:selectBooleanCheckbox id="Project_active" styleClass="aon-margin-left"
					value="#{controller.to.active}" rendered="#{formEdit}" required="true" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox id="Project_active-New" styleClass="aon-margin-left"
						value="#{controller.to.active}" rendered="#{formNew}" required="true" />
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="Registry_id" value="#{projectBundle.project_assigned}" />
				</f:facet>
				<aon:outputText value="#{to.registry.fullName}" rendered="#{formList}" />
				<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
					<ui:param name="lookupTo" value="#{controller.to.registry}" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="idRequired" value="#{true}" />
				</ui:include>
				<f:facet name="footer">
					<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
						<ui:param name="lookupTo" value="#{controller.to.registry}" />
						<ui:param name="lookupSuffix" value="-New" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="idRequired" value="#{true}" />
					</ui:include>
				</f:facet>
			</aon:column>

			<aon:column alias="Project.projectType.description"
				styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel for="Project_projectType" value="#{projectBundle.project_project_type}" />
				</f:facet>
				<aon:outputText value="#{to.projectType.description}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="Project_projectType"
					value="#{controller.to.projectType}" rendered="#{formEdit}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{projectCollections.projectTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="Project_projectType-New"
						value="#{controller.to.projectType}" rendered="#{formNew}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{projectCollections.projectTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
