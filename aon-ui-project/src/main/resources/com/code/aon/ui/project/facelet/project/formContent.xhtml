<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:outputLabel for="Project_projectType" value="#{bundle.project_project_type}"/>
	<aon:div>
		<aon:selectOneMenu id="Project_projectType"
			value="#{controller.to.projectType}">
			<f:selectItem itemLabel="-" value="#{null}"/>
			<f:selectItems value="#{projectCollections.projectTypes}" />
			<a4j:support event="onchange" reRender="Project_last_alias" ajaxSingle="true" />
		</aon:selectOneMenu>

		<aon:if test="#{controller.to.extended}">
			<aon:outputLabel value="#{bundle.aon_source}:" styleClass="aon-margin-left aon-margin-right aon-italic" />
			<aon:outputText value="#{bundle.tas_project_tas}" styleClass="aon-bold"
				rendered="#{controller.to.tas}" />
			<aon:outputText value="#{bundle.commercial_operation_module}" styleClass="aon-bold"
				rendered="#{controller.to.commercial}" />
			<aon:outputText value="#{bundle.aon_reservation} - #{bundle.aon_module_hotel}" styleClass="aon-bold"
				rendered="#{controller.to.reservation}" />
		</aon:if>
	</aon:div>

	<aon:if test="#{!controller.nevv}">  
		<aon:outputLabel value="#{bundle.aon_id}" />
		<aon:outputText id="Project_id"
			styleClass="aon-bold"
			value="#{controller.to.id}" />
	</aon:if>

	<aon:outputLabel for="Project_name" value="#{bundle.aon_name}" />
	<aon:inputText id="Project_name"
		value="#{controller.to.name}" required="true"
		size="64" maxlength="64" />
	
	<aon:outputLabel for="Project_alias" value="#{bundle.aon_alias}" />
	<aon:div>
		<aon:inputText id="Project_alias" 
			value="#{controller.to.alias}"
			size="32" maxlength="32" />
		<aon:outputLabel id="Project_last_alias" styleClass="aon-margin-left aon-italic"
							value="#{project.lastAlias}" />
	</aon:div>
	<aon:if test="#{!skipRegistryLookup}">  
		<aon:outputLabel for="Registry_id" value="#{bundle.aon_holder}"/>
		<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
			<ui:param name="lookupTo" value="#{controller.to.registry}" />
			<ui:param name="skipLabel" value="#{true}" />
			<ui:param name="idRequired" value="#{true}" />
		</ui:include>
	</aon:if>
	
	<aon:outputLabel for="Project_date" value="#{bundle.aon_date}" />
	<aon:selectInputDate id="Project_date"
		value="#{controller.to.date}" required="#{true}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}">
	</aon:selectInputDate>

	<aon:if test="#{!controller.nevv}">  
		<aon:outputLabel for="Project_status" value="#{bundle.aon_status}" />
		<aon:selectOneRadio id="Project_status" 
			value="#{controller.to.active}">
			<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="false" />
		</aon:selectOneRadio>
	</aon:if>

</ui:composition>
