<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showProjectWindow">
		<aon:if test="#{controller.showProjectWindow}">
			<rich:modalPanel id="projectModalPanel" minHeight="150"
				minWidth="650" rendered="#{controller.showProjectWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{projectLabel}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showProjectWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showProjectWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="projectForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:if test="#{!controller.showDetailProjectWindow}">
										<aon:commandButton id="project-save"
											value="#{bundle.aon_save}"
											reRender="showProjectWindow,#{parentReRender}"
											actionListener="#{parentActionListener}"
											styleClass="aon-finding-toolbar-item aon-icon-accept"
											accesskey="#{bundle.aon_key_save}">
											<rich:componentControl for="projectModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showProjectWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:if>
									<aon:if test="#{controller.showDetailProjectWindow}">
										<aon:commandButton id="project-save"
											value="#{bundle.aon_save}"
											reRender="showProjectWindow,#{detailReRender}"
											actionListener="#{detailActionListener}"
											styleClass="aon-finding-toolbar-item aon-icon-accept"
											accesskey="#{bundle.aon_key_save}">
											<rich:componentControl for="projectModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showProjectWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:if>
									<aon:commandButton id="project-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showProjectWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{controller.showProjectWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="menuGrid" columns="2" dir="true">

										<aon:outputLabel for="Project_id"
											value="#{projectLabel}" />
										<ui:include src="/com/code/aon/ui/project/facelet/project/lookup.xhtml" >
											<aon:if test="#{!controller.showDetailProjectWindow}">
												<ui:param name="lookupTo" value="#{parentValue}" />
											</aon:if>
											<aon:if test="#{controller.showDetailProjectWindow}">
												<ui:param name="lookupTo" value="#{detailValue}" />
											</aon:if>
											<ui:param name="skipLabel" value="#{true}" />
											<ui:param name="skipGoToButton" value="#{true}" />
											<ui:param name="lookupSuffix" value="-Modal" />
										</ui:include>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
