<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	
	<aon:if test="#{!skipCustomerId}">
		<aon:column alias="Customer.id"
			styleClass="aon-editDataTable-numberColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_id}" />
			</f:facet>
			<aon:outputText value="#{to.id}" />
		</aon:column>
	</aon:if>

	<aon:column alias="Customer.registry.document"
		styleClass="aon-editDataTable-textColumn aon-width-130">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_document}" />
		</f:facet>
		<aon:outputText value="#{to.registry.document}" />
	</aon:column>

	<aon:column alias="Customer.registry.name"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_company_name}" />
		</f:facet>
		<aon:div styleClass="aon-nowrap">
			<aon:outputText value="#{to.registry.fullName}"/>
		</aon:div>
	</aon:column>

</ui:composition>
