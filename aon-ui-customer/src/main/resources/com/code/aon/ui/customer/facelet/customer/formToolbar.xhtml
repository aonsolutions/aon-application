<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarTitle" value="#{(customer.showAlumnData)?(bundle.aon_alumns):(bundle.customer_finance_checking)}" />
		<ui:param name="controller" value="#{customer}" />
		<ui:param name="showMoreMenu" value="#{!customer.nevv}" />
		<ui:define name="moreMenuContent">
			<aon:if test="#{aonConfiguration.bean.customer.showHistory}">
				<aon:menuItem id="CustomerHistory" 
					action="registry_stats" actionListener="#{customer.onCustomerHistory}"
					value="#{bundle.aon_history}"
					iconClass="aon-icon-task-assume">
				</aon:menuItem>
				<rich:menuSeparator id="historyMenuSeparator" />
			</aon:if>
			<aon:if test="#{customer.showAlumnData}">
				<aon:if test="#{aonConfiguration.bean.customer.showCourse}">
					<aon:menuItem id="course-button"
						value="#{bundle.course_courses}"
						iconClass="aon-icon-data"
						reRender="showNewCourseWindow"
						actionListener="#{customerCourse.onReset}">
						<f:setPropertyActionListener target="#{customerCourse.showNewWindow}" value="#{true}" />							
					</aon:menuItem>
				</aon:if>
				<aon:if test="#{aonConfiguration.bean.customer.showAbsence}">
					<aon:menuItem id="absence-button"
						value="#{bundle.absence_absences}"
						iconClass="aon-icon-data"
						reRender="showNewAbsenceWindow"
						actionListener="#{customerAbsence.onReset}">
						<f:setPropertyActionListener target="#{customerAbsence.showNewWindow}" value="#{true}" />							
					</aon:menuItem>
				</aon:if>
				<aon:if test="#{aonConfiguration.bean.customer.showLoan}">
					<aon:menuItem id="loan-button"
						value="#{bundle.academy_loans}"
						iconClass="aon-icon-data"
						reRender="showNewLoanWindow"
						actionListener="#{customerLoan.onReset}">
						<f:setPropertyActionListener target="#{customerLoan.showNewWindow}" value="#{true}" />							
					</aon:menuItem>
				</aon:if>
			</aon:if>
			<ui:decorate template="/com/code/aon/ui/registry/facelet/registry/toolbarMoreMenu.xhtml">
				<ui:param name="controller" value="#{customer}" />
				<ui:param name="showFeeButton" value="#{aonConfiguration.bean.customer.showFinanceFeeData and aonRole.financeOperator}" />
				<ui:param name="showProjectButton" value="#{aonConfiguration.bean.customer.showProjectData}" />
				<ui:param name="showNotesButton" value="#{aonConfiguration.bean.customer.showNote}" />
				<ui:param name="showRelationshipButton" value="#{aonConfiguration.bean.customer.showRelationship}" />
				<ui:param name="showRecordDataButton" value="#{aonConfiguration.bean.customer.showRecordData}" />
				<ui:param name="showSegmentButton" value="#{aonConfiguration.bean.customer.showSegment}" />
				<ui:param name="showAddInfoButton" value="#{aonConfiguration.bean.customer.showAddInfo}" />
				<ui:param name="showDirStaffButton" value="#{aonConfiguration.bean.customer.showDirStaff}" />
				<ui:param name="showProductButton" value="#{aonConfiguration.bean.customer.showProduct}" />
				<ui:param name="showTaxButton" value="#{aonConfiguration.bean.customer.showTax}" />
				<ui:param name="showProfileButton" value="#{aonConfiguration.bean.customer.showProfile}" />
				<ui:param name="showRegistrySellerButton" value="#{aonConfiguration.bean.customer.showSeller}" />
				<ui:param name="showRegistrySupplierButton" value="#{aonConfiguration.bean.customer.showSupplier}" />							

				<ui:param name="feeController" value="#{customerFee}" />
				<ui:param name="projectController" value="#{customerProject}" />
				<ui:param name="notesController" value="#{customerNote}" /> 
				<ui:param name="relationshipController" value="#{customerRelationship}" /> 
				<ui:param name="recordDataController" value="#{customerRecordData}" /> 
				<ui:param name="segmentController" value="#{customerSegment}" /> 
				<ui:param name="addInfoController" value="#{customerAddInfo}" /> 
				<ui:param name="dirStaffController" value="#{customerDirStaff}" /> 
				<ui:param name="rAttachController" value="#{customerRAttach}" />
				<ui:param name="registryItemController" value="#{customerItem}" />
				<ui:param name="registryTaxController" value="#{customerTax}" />
				<ui:param name="registryProfileController" value="#{customerProfile}" />
				<ui:param name="registrySellerController" value="#{customerSeller}" />
				<ui:param name="registrySupplierController" value="#{customerSupplier}" />
			</ui:decorate>
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/menuContent.xhtml" />
			
			<aon:if test="#{customer.snapshot}">
				<aon:menuItem id="CustomerDomainLink" 
					actionListener="#{customer.onSigCustomerDomainLink}"
					value="Vincular Dominio"
					iconClass="aon-icon-domain">
				</aon:menuItem>
			</aon:if>
		</ui:define>
	</ui:decorate>
		
</ui:composition>
