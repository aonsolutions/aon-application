<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:if test="#{customer.showAlumnData}">
		<aon:methodParam name="searchActionListener" value="#{customer.onAlumnEditSearch}" type="actionListener" />
	</aon:if>
	
	<ui:decorate template="/com/code/aon/ui/customer/facelet/customer/listEx.xhtml" >
		<ui:define name="moreColumns">
			<aon:if test="#{customer.showAlumnData and customerSearch.showComments}">
				<aon:column 
					styleClass="aon-editDataTable-iconColumn">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:outputText value="&#160;"
						title="#{controller.rowCustomerComments}"
						rendered="#{not empty controller.rowCustomerComments}"
						styleClass="aon-editDataTable-button aon-icon-comment" />
				</aon:column>
			</aon:if>
		</ui:define>
	</ui:decorate>

</ui:composition>
