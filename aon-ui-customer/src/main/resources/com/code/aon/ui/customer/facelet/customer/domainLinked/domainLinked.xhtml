<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div id="customerDomainLinkedDiv">

		<aon:dataTable id="customerDomainLinkedDataTable" var="domainLinked" 
			value="#{customer.domainLinkedList}" 
			columnClasses=", #{columnClasses}," footerClass="#{dataTableFooterClass}">
			
			<aon:column>
				<f:facet name="header">
					<aon:outputLabel value="id" />
				</f:facet>
				<aon:outputText value="#{domainLinked.id}"/>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputLabel value="name" />
				</f:facet>
				<aon:outputText value="#{domainLinked.name}"/>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputLabel value="type" />
				</f:facet>
				<aon:outputText value="#{domainLinked.type}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel value="schema" />
				</f:facet>
				<aon:outputText value="#{domainLinked.schema}"/>
			</aon:column>		
		
		</aon:dataTable>
	</aon:div>

</ui:composition>
