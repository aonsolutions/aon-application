<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGrid id="FACeGrid"
		columns="2" styleClass="aon-margin-top aon-width-all" 
		columnClasses="aon-panelGrid-odd aon-width-200,
			aon-panelGrid-even aon-width-auto">

		<aon:outputLabel for="Customer_FACe_Fiscal"
			value="Oficina Contable" />
		<aon:div>
			<aon:inputText id="Customer_FACe_Fiscal"
				required="true"
				value="#{customerFACe.fiscal.comments}" size="10" maxlength="10" />	
			<aon:outputLabel for="Customer_FACe_FiscalAddress"
				styleClass="aon-italic aon-margin-left" style="margin-right: 10px;"
				value="#{bundle.aon_address}" />
			<aon:selectOneMenu id="Customer_FACe_FiscalAddress"
				required="true"
				value="#{customerFACe.fiscalAddress}">
				<f:selectItem itemLabel="-"	itemValue="#{null}" />
				<f:selectItems value="#{customerFACe.customerAddresses}" />
			</aon:selectOneMenu>
		</aon:div>

		<aon:outputLabel for="Customer_FACe_Receptor"
			value="Órgano Gestor" />
		<aon:div>
			<aon:inputText id="Customer_FACe_Receptor"
				required="true"
				value="#{customerFACe.receptor.comments}" size="10" maxlength="10" />	
			<aon:outputLabel for="Customer_FACe_ReceptorAddress"
				styleClass="aon-italic aon-margin-left" style="margin-right: 10px;"
				value="#{bundle.aon_address}" />
			<aon:selectOneMenu id="Customer_FACe_ReceptorAddress"
				required="true"
				value="#{customerFACe.receptorAddress}">
				<f:selectItem itemLabel="-"	itemValue="#{null}" />
				<f:selectItems value="#{customerFACe.customerAddresses}" />
			</aon:selectOneMenu>
		</aon:div>

		<aon:outputLabel for="Customer_FACe_Pagador"
			value="Unidad Tramitadora" />
		<aon:div>
			<aon:inputText id="Customer_FACe_Pagador"
				required="true"
				value="#{customerFACe.pagador.comments}" size="10" maxlength="10" />	
			<aon:outputLabel for="Customer_FACe_PagadorAddress"
				styleClass="aon-italic aon-margin-left" style="margin-right: 10px;"
				value="#{bundle.aon_address}" />
			<aon:selectOneMenu id="Customer_FACe_PagadorAddress"
				required="true"
				value="#{customerFACe.pagadorAddress}">
				<f:selectItem itemLabel="-"	itemValue="#{null}" />
				<f:selectItems value="#{customerFACe.customerAddresses}" />
			</aon:selectOneMenu>
		</aon:div>

		<aon:outputLabel for="Customer_FACe_Comprador"
			value="Órgano proponente" />
		<aon:div>
			<aon:inputText id="Customer_FACe_Comprador"
				value="#{customerFACe.comprador.comments}" size="10" maxlength="10" />	
			<aon:outputLabel for="Customer_FACe_CompradorAddress"
				styleClass="aon-italic aon-margin-left" style="margin-right: 10px;"
				value="#{bundle.aon_address}" />
			<aon:selectOneMenu id="Customer_FACe_CompradorAddress" 
				value="#{customerFACe.compradorAddress}">
				<f:selectItem itemLabel="-"	itemValue="#{null}" />
				<f:selectItems value="#{customerFACe.customerAddresses}" />
			</aon:selectOneMenu>
		</aon:div>
	</aon:panelGrid>
	
</ui:composition>
