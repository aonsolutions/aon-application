<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<ui:include src="/net/aonsolutions/aon/gwt/aio/facelet/templates/silent.xhtml" />
		<aon:form id="customerForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{(customer.showAlumnData)?(bundle.aon_alumns):(bundle.customer_finance_checking)}" />
				<ui:param name="controller" value="#{customer}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:if test="#{customer.ceconsulting}">
						<aon:commandLink id="customerIban-import" value="Importar IBAN"
							onclick="customerIban()"
							styleClass="aon-finding-toolbar-item aon-icon-import-excel-trans">
						</aon:commandLink>
					</aon:if>
				</ui:define>
			</ui:decorate>
			

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{customer}" />
				<ui:define name="searchContent">
					<ui:include src="/com/code/aon/ui/customer/facelet/customer/searchContent.xhtml" >
						<ui:param name="searchController" value="#{customerSearch}" />
					</ui:include>
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:if test="#{aonConfiguration.bean.customer.showProduct}">
			<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
		</aon:if>			
		<aon:if test="#{aonConfiguration.bean.customer.showSeller}">
			<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		</aon:if>
		<aon:if test="#{aonConfiguration.bean.customer.showProfile}">
			<aon:lookupButtonPopup lookup="#{questionLookup}" />
		</aon:if>			
	</ui:define>
</ui:composition>
