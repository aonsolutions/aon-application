<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="customerList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{customerBundle.customer_module}." />
				<ui:param name="controller" value="#{customer}" />
				<aon:methodParam name="resetAction" value="customer_consultant_form" />
				<aon:methodParam name="searchAction" value="customer_consultant_search" />				
				<ui:define name="additionalToolbarContent">
					<h:commandLink id="customerReportExcel" value="&#160;" 
						target="_new" rendered="#{!customer.new}"
						action="#{report.onExecute}"
						disabled="#{customer.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="customerReport" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink id="customerReportPdf" value="#{bundle.aon_listing}"
						target="_new" rendered="#{!customer.new}"
						action="#{report.onExecute}"
						disabled="#{customer.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="customerReport" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:methodParam name="rowSelectorAction" value="customer_consultant_form" />
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{customer}" />
					<ui:define name="columns">

						<ui:include
							src="/com/code/aon/ui/customer/facelet/customer/listBasic.xhtml" />

						<aon:column alias="Customer.registry.alias"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_alias}" />
							</f:facet>
							<aon:outputText value="#{to.registry.alias}" />
						</aon:column>
	
						<aon:column alias="Customer.status"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
