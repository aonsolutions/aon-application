<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGrid id="eInvoiceGrid"
		columns="2" styleClass="aon-margin-top aon-width-all"
		columnClasses="aon-panelGrid-odd aon-width-200,
			aon-panelGrid-even aon-width-auto" >
		
		<aon:outputLabel for="Customer_eInvoice_order"
			 value="#{bundle.aon_order_number}" />
		<aon:selectOneMenu id="Customer_eInvoice_order"
			value="#{customerFACe.orderNumber.comments}" >
			<f:selectItem itemLabel="No incluir" value="#{null}" />
			<f:selectItem itemLabel="Incluir número pedido" itemValue="#{false}" />
			<f:selectItem itemLabel="Incluir su referencia" itemValue="#{true}" />
		</aon:selectOneMenu>
   
		<aon:outputLabel for="Customer_eInvoice_delivery_note"
			value="#{bundle.aon_delivery_number}" />
		<aon:selectOneMenu id="Customer_eInvoice_delivery_note"
			value="#{customerFACe.deliveryNumber.comments}" >
			<f:selectItem itemLabel="No incluir" itemValue="#{false}" />
			<f:selectItem itemLabel="Incluir" itemValue="#{true}" />
		</aon:selectOneMenu>
		
		<aon:outputLabel for="Customer_eInvoice_center_identification"
			value="#{bundle.aon_center_identification}" />
		<aon:inputText id="Customer_eInvoice_center_identification"
			value="#{customerFACe.centerIdentification.comments}" >
			<f:validateDoubleRange />
		</aon:inputText>
		
	</aon:panelGrid>
		
	<aon:panel id="customerFACe-panel" label="#{bundle.finance_face}">
		<f:facet name="header">
			<aon:panelGroup>
				<aon:selectBooleanCheckbox id="customerFACe_check"
					value="#{customerFACe.enabled}" >
					<a4j:support event="onchange" ajaxSingle="true"
						actionListener="#{customerFACe.onEnabledChanged}"
						reRender="customerFACe-panel" />
				</aon:selectBooleanCheckbox>								
				<aon:outputLabel for="customerFACe_check" 
					styleClass="aon-italic"
					value="#{bundle.finance_face}" />
			</aon:panelGroup>
		</f:facet>
			
		<aon:if test="#{customerFACe.enabled}">
			<ui:include src="/com/code/aon/ui/customer/facelet/customer/formFACe.xhtml" />
		</aon:if>
		
	</aon:panel>
		
</ui:composition>
