<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/registry/facelet/registry/searchContent.xhtml">
		<ui:param name="controller" value="#{controller}" />
	</ui:include>
		
	<c:if test="#{company.EInvoice}">
		<aon:outputLabel for="Customer_EInvoice"
			value="#{customerBundle.customer_eInvoice}" />
		<aon:selectOneMenu id="Customer_EInvoice"
			valueChangeListener="#{controller.addExpression}">
			<f:selectItem itemLabel="-"	itemValue="#{null}" />
			<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
		</aon:selectOneMenu>								
	</c:if>
	
	<aon:outputText value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox value="#{customerSearch.customerStatuses}">
		<f:selectItems value="#{customerCollections.customerStatuses}"/>
	</aon:selectManyCheckbox>							

</ui:composition>
