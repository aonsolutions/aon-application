<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
			
			<aon:if test="#{!app.standAlone}" >
				<aon:form id="customerListForm">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{(customer.showAlumnData)?(bundle.aon_alumns):(bundle.customer_finance_checking)}" />
					<ui:param name="controller" value="#{customer}" />
					<ui:define name="additionalToolbarContent">
						<aon:if test="#{customer.showAlumnData}">
							<aon:htmlCommandLink id="alumnReport-excel-report" value="&#160;" 
								target="_new" rendered="#{!customer.nevv}"
								action="#{report.onExecute}"
								disabled="#{customer.to != null}"
								accesskey="#{bundle.aon_key_print}"
								styleClass="aon-finding-toolbar-item aon-icon-excel">
								<f:param name="reportKey" value="alumnList" />
								<f:param name="outputFormat" value="MS Excel" />
							</aon:htmlCommandLink>
							<aon:htmlCommandLink id="alumnReport-report" value="#{bundle.aon_listing}"
								target="_new" rendered="#{!customer.nevv}"
								action="#{report.onExecute}"
								disabled="#{customer.to != null}"
								accesskey="#{bundle.aon_key_print}"
								styleClass="aon-finding-toolbar-item aon-icon-pdf">
								<f:param name="reportKey" value="alumnList" />
								<f:param name="outputFormat" value="PDF" />
							</aon:htmlCommandLink>
						</aon:if>
						<aon:if test="#{!customer.showAlumnData}">
							<aon:htmlCommandLink id="customerReport-excel-report" value="&#160;" 
								target="_new" rendered="#{!customer.nevv}"
								action="#{report.onExecute}"
								disabled="#{customer.to != null}"
								accesskey="#{bundle.aon_key_print}"
								styleClass="aon-finding-toolbar-item aon-icon-excel">
								<f:param name="reportKey" value="customerReport" />
								<f:param name="outputFormat" value="MS Excel" />
							</aon:htmlCommandLink>
							<aon:htmlCommandLink id="customerReport2-excel-report" value="&#160;" 
								target="_new" rendered="#{!customer.nevv}"
								action="#{report.onExecute}"
								disabled="#{customer.to != null}"
								accesskey="#{bundle.aon_key_print}"
								styleClass="aon-finding-toolbar-item aon-icon-excel">
							</aon:htmlCommandLink>
							<aon:htmlCommandLink id="customerReport-report" value="#{bundle.aon_listing}"
								target="_new" rendered="#{!customer.nevv}"
								action="#{report.onExecute}"
								disabled="#{customer.to != null}"
								accesskey="#{bundle.aon_key_print}"
								styleClass="aon-finding-toolbar-item aon-icon-pdf">
								<f:param name="reportKey" value="customerReport" />
								<f:param name="outputFormat" value="PDF" />
							</aon:htmlCommandLink>
							<aon:htmlCommandLink id="customerReport2-report" value="#{bundle.aon_listing}"
	                            target="_new" rendered="#{!customer.nevv}"
	                            action="#{customer.onNewReport}"
	                            disabled="#{customer.to != null}"
	                            accesskey="#{bundle.aon_key_print}"
	                            styleClass="aon-finding-toolbar-item aon-icon-pdf">
	                        </aon:htmlCommandLink>
						</aon:if>
						<aon:htmlCommandLink id="customerDetailExcelReport-excel-report" 
							value="#{bundle.aon_detailed_listing}" 
							target="_new" rendered="#{!customer.nevv}"
							actionListener="#{customer.onDetailReport}"
							disabled="#{customer.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-excel">
						</aon:htmlCommandLink>
					</ui:define>
				</ui:decorate>
				<aon:div styleClass="aon-scroll-area">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{customer}" />
						
						<ui:param name="skipCustomerId" value="#{app.standAlone}" />
						
						<ui:define name="columns">
							<ui:include src="/com/code/aon/ui/customer/facelet/customer/listExtended.xhtml" />
							<ui:insert name="moreColumns"/>
						</ui:define>
					</ui:decorate>
				</aon:div>
				</aon:form>
			</aon:if>
			
			<aon:if test="#{app.standAlone}" >
				<script type="text/javascript">
				//<![CDATA[
					function setScroll() {
						var scroll = #{rich:element('customerListScroll')};
						var container = #{rich:element('customerListContainer')};
						scroll.value = container.scrollTop;
					}

					function adjustScroll(){
						var container = #{rich:element('customerListContainer')};
						/* container.scrollTop = 53 ; */
 						if ( container.scrollTop == 0 ) {
							container.scrollTop += 8;
						} else {
							container.scrollTop -= 8;
						}
					}
					
					function scrollAtTopOrBottom() {
						var container = #{rich:element('customerListContainer')};
						return ( container.scrollTop == 0 ) || ( container.offsetHeight + container.scrollTop >= container.scrollHeight );
					}
				//]]>
				</script>

				<aon:form id="customerToolbarForm">
				
				<aon:div id="customerToolbarContainer" >
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/appToolbar.xhtml" >
					<ui:param name="controller" value="#{customer}" />
					<ui:param name="filterController" value="#{customer}" />
					<ui:param name="filterReRender" value="customerListContainer" />
					<ui:param name="filterContainer" value="customerFilterContainer" />
					<ui:param name="toolbarTitle" value="#{(customer.showAlumnData)?(bundle.aon_alumns):(bundle.customer_finance_checking)}" />

				</ui:decorate>
				</aon:div>
				</aon:form>
				
				<aon:form id="customerListForm">
				
				<aon:inputText id="customerListScroll" value="#{customer.scroll}" style="display:none" />
				
				<aon:div  styleClass="aon-scroll-area aon-scroll"  style="display: flex; flex-direction: row; " >
					

					<aon:scroll 
					id="customerListContainer"
					style="overflow: auto; height: calc(100vh - 175px); flex-grow : 4" 
					>


						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
							<ui:param name="controller" value="#{customer}" />
							<ui:param name="rows" value="#{user.pageLimit}" />
							<ui:param name="showDataScroller" value="#{false}" />
							
							<ui:param name="skipCustomerId" value="#{app.standAlone}" />
							
							<ui:define name="columns">
								<ui:include src="/com/code/aon/ui/customer/facelet/customer/listExtended.xhtml" />
								<ui:insert name="moreColumns"/>
							</ui:define>
							
							<ui:define name="_selectFooterContent">
								<aon:outputText value="Clientes totales #{customer.rowCount} " />
							</ui:define>
						</ui:decorate>
						
						<a4j:support 
						event="onscroll"
						limitToList="true"
						oncomplete="adjustScroll()"
						eventsQueue="customerListScroll"
						reRender="#{customer.beanName}Data"
						actionListener="#{customer.onScroll}"
						onsubmit="if (scrollAtTopOrBottom()) { setScroll(); } else { return false; } "
						/>
	
					</aon:scroll>
	
					<aon:div id="customerFilterContainer" styleClass="aonFilterPopup" style="display:none" >
							<ui:decorate template="/com/code/aon/ui/customer/facelet/customer/filterEx.xhtml" >
								<ui:param name="searchReRender" value="customerListContainer,customerToolbarContainer" />
								<ui:define name="moreSearchBasicContent">
									<aon:if test="#{customer.showAlumnData}">
										<aon:outputText value="&#160;" />
										<aon:div>
											<aon:selectBooleanCheckbox id="customer_showComments"
												value="#{customerSearch.showComments}"/>
											<aon:outputLabel for="customer_showComments"
												value="#{bundle.aon_see} #{bundle.aon_remark}" />
										</aon:div>
									</aon:if>
								</ui:define>
							</ui:decorate>
					</aon:div>

						
				</aon:div>
				</aon:form>
			</aon:if>
	
	</ui:define>
</ui:composition>
