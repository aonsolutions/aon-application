<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="skipSaveButton" value="#{!controller.new}" />
		<ui:param name="skipCancelButton" value="#{!controller.new}" />
		<ui:param name="skipRemoveButton" value="#{true}" />
		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="Customer_id" value="#{bundle.aon_customer}" />
				</f:facet>
				<aon:outputText value="#{to.registry.fullName}" 
					rendered="#{formList}" />
				<f:facet name="footer">
					<aon:div rendered="#{formNew}">
						<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
							<ui:param name="lookupTo" value="#{controller.to.registry}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupForRegistry" value="#{true}" />
							<ui:param name="lookupReRender" value="IncludeFeesDiv" />
							<aon:methodParam name="lookupChangeListener"
								value="#{controller.onCustomerChanged}" type="lookupChangeListener" />
						</ui:include>

						<aon:div id="IncludeFeesDiv" styleClass="aon-margin-left" style="display: inline;">
							<c:if test="#{controller.customerFeesAvailables}">
								<aon:selectBooleanCheckbox id="Customer_feesIncluded"
									value="#{controller.feesIncluded}" />
								<aon:outputLabel for="Customer_feesIncluded" styleClass="aon-italic"
									value="#{customerBundle.customer_add_fees_to_invoicing_group}" />
							</c:if>
						</aon:div>
					</aon:div>
				</f:facet>
			</aon:column>								
		</ui:define>
		<ui:define name="endFormListContent">
			<aon:commandLink id="customer_link2" immediate="true"
				styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
				value="&#160;" title="#{bundle.aon_go}"
				actionListener="#{controller.onLoadCustomer}"
				action="customer_form"
				reRender="aonContent" />
			<aon:confirmButton id="remove_groupDetail" immediate="true"
				styleClass="aon-editDataTable-button aon-icon-delete"
				title="#{bundle.aon_remove}"
				confirmTitle="#{bundle.aon_confirm_title}"
				confirmMessage="#{customerBundle.customer_invoicing_group_delete_confirm}"
				confirmActionListener="#{controller.onRemove}"
				reRender="invoicingGroupForm" ajaxSingle="true" />
		</ui:define>
	</ui:decorate>

</ui:composition>
