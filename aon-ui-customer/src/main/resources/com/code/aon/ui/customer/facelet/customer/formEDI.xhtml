<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:dataTable var="address" 
		value="#{customerEdiSupport.customerAddresses}">
			
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_address}" />
			</f:facet>
			<aon:outputText value="#{address.fullAddress}" />
		</aon:column>
	
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Edi Cabecera" />
			</f:facet>
			<aon:inputText size="15" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][0]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Edi Pedidos" />
			</f:facet>
			<aon:inputText size="15" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][1]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Edi Pto Entrega" />
			</f:facet>
			<aon:inputText size="15" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][2]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Edi Factura" />
			</f:facet>
			<aon:inputText size="15" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][3]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Edi Financiera" />
			</f:facet>
			<aon:inputText size="15" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][4]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Edi Albaranes" />
			</f:facet>
			<aon:inputText size="15" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][5]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="#{bundle.product_package}" />
			</f:facet>
			<aon:selectOneMenu  
				value="#{customerEdiSupport.addressCodes[address.id][6]}">
				<f:selectItem itemLabel="-" itemValue="#{null}" />
				<!--  
				<f:selectItems value="#{configCollections.packingTypeTags}" />
				-->
				<f:selectItems value="#{customerEdiSupport.packingTypeTags}" />
			</aon:selectOneMenu>
		</aon:column>
		
	</aon:dataTable>
	
</ui:composition>
