<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:dataTable var="address" 
		value="#{customerEdiSupport.customerAddresses}">

		<f:facet name="header">
			<rich:columnGroup>
				<rich:column  colspan="1">
					<aon:outputText value="#{bundle.aon_address}" />
				</rich:column>
				<rich:column colspan="6">
					<aon:outputText value="#{bundle.aon_id} #{bundle.aon_edi}" />
				</rich:column>
				<rich:column colspan="2">
					<aon:outputText value="#{bundle.aon_measurement_unit}" />
				</rich:column>
				<aon:if test="#{customerEdiSupport.eci}">
					<rich:column colspan="1">
						<aon:outputText value="OTROS DATOS" />
					</rich:column>
				</aon:if>
			</rich:columnGroup>
		</f:facet>
		
		<aon:column breakBefore="true" styleClass="aon-editDataTable-textColumn" >
			<aon:div>
				<aon:outputText value="&#160;" title="#{bundle.aon_principal}"
					rendered="#{address.mainAddress}"
					styleClass="aon-icon-company aon-padding-right aon-margin-right" />
				<aon:outputText value="#{address.fullAddress}" />
			</aon:div>
		</aon:column>
	
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Cabecera" />
			</f:facet>
			<aon:inputText size="13" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][0]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Pedidos" />
			</f:facet>
			<aon:inputText size="13" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][1]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Pto Entrega" />
			</f:facet>
			<aon:inputText size="13" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][2]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Factura" />
			</f:facet>
			<aon:inputText size="13" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][3]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Financiera" />
			</f:facet>
			<aon:inputText size="13" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][4]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Albaranes" />
			</f:facet>
			<aon:inputText size="13" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][5]}" />
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_general}" />
			</f:facet>
			<aon:selectOneMenu 
				value="#{customerEdiSupport.addressCodes[address.id][6]}">
				<f:selectItem itemLabel="-" itemValue="#{null}" />
				<f:selectItems value="#{customerEdiSupport.packingTypeTags}" />
			</aon:selectOneMenu>
		</aon:column>
		
		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_invoice_abbr}" />
			</f:facet>
			<aon:selectOneMenu  
				value="#{customerEdiSupport.addressCodes[address.id][7]}">
				<f:selectItem itemLabel="-" itemValue="#{null}" />
				<f:selectItems value="#{customerEdiSupport.packingTypeTags}" />
			</aon:selectOneMenu>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn" >
			<f:facet name="header">
				<aon:outputText value="Departamento" />
			</f:facet>
			<aon:inputText size="13" maxlength="20"
				value="#{customerEdiSupport.addressCodes[address.id][8]}" />
		</aon:column>
		
	</aon:dataTable>
	
</ui:composition>
