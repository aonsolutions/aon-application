<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="customerForm">
		
			<ui:insert name="formToolbarContent" />
			
			<aon:div styleClass="aon-scroll-area">
				<aon:if test="#{customer.nevv}">
					<ui:include src="/com/code/aon/ui/customer/facelet/customer/formNewContent.xhtml" >
						<ui:param name="controller" value="#{customer}" />
					</ui:include>								
				</aon:if>			
				<aon:if test="#{!customer.nevv}">
					<aon:div 
					style="#{ app.standAlone ? 'display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));' : '' }" >
					<aon:panelGrid id="dataTable" columns="4" 
						styleClass="aon-width-all aonCard"
						columnClasses="aon-panelGrid-odd aon-width-140,
							aon-panelGrid-even aon-width-auto,
							aon-panelGrid-odd aon-width-120,
							aon-panelGrid-even aon-width-auto">
	
						<ui:include	src="/com/code/aon/ui/customer/facelet/customer/formContent.xhtml">
							<ui:param name="controller" value="#{customer}" />
							<ui:param name="showTargetLink" value="#{true}" />
						</ui:include>
					</aon:panelGrid>

					<aon:if test="#{(aonConfiguration.bean.customer.showPerson) and (controller.to.registry.type == 'NATURAL')}">
						<aon:div id="personInfoDiv" styleClass="aonCard" >
							<ui:include src="/com/code/aon/ui/customer/facelet/customer/formPersonContent.xhtml" >
								<ui:param name="controller" value="#{customer}" />
							</ui:include>
						</aon:div>
					</aon:if>
					
					<aon:panelGrid id="infoDataTable"
						styleClass="aon-margin-top aon-width-all aonCard" columns="2"
						columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-auto">
	
						<aon:if test="#{aonConfiguration.bean.customer.showTariff}">
							<aon:outputLabel for="Customer_tariff_id"
								value="#{bundle.report_tariff}" />
							<aon:selectOneMenu id="Customer_tariff_id"
								value="#{customer.to.tariff}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{configCollections.salesTariffs}" />
							</aon:selectOneMenu>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showFinanceFeeData or aonConfiguration.bean.customer.showDeliveryData}">
							<aon:outputText value="#{bundle.customer_invoicing_info}" />
							<aon:div styleClass="aon-selectMultiCheckbox" >
								<aon:if test="#{aonConfiguration.bean.customer.showDeliveryData}">
									<aon:outputText	styleClass="aon-margin-left aon-bold"
										value="#{bundle.config_series_deliveries}:" />
									<aon:selectBooleanCheckbox id="Customer_deliveryGrouped" styleClass="aon-margin-left"
										value="#{customer.to.deliveryGrouped}" />
									<aon:outputLabel for="Customer_deliveryGrouped" styleClass="aon-italic"
										value="#{bundle.customer_invoiceGrouped}" />
									<aon:selectBooleanCheckbox id="Customer_deliveryValuated" styleClass="aon-margin-left"
										value="#{customer.to.deliveryValuated}" />
									<aon:outputLabel for="Customer_deliveryValuated" styleClass="aon-italic"
										value="#{bundle.customer_printValuated}" />
								</aon:if>

								<aon:outputText	styleClass="aon-margin-left aon-bold"
									value="#{bundle.aon_module_groupware}:" />
								<aon:selectBooleanCheckbox id="Customer_projectGrouped" styleClass="aon-margin-left"
									value="#{customer.to.projectGrouped}" />
								<aon:outputLabel for="Customer_projectGrouped" styleClass="aon-italic"
										value="#{bundle.customer_invoiceGrouped}" />
							</aon:div>
						</aon:if>

						<aon:if test="#{company.ediSupportEnabled or company.EInvoice}">
							<aon:outputText value="#{bundle.aon_edi}" title="#{bundle.aon_edi_title}" />
							<aon:div id="eInvoice-panel" styleClass="aon-selectMultiCheckbox" >
								<aon:if test="#{company.EInvoice}">
									<aon:selectBooleanCheckbox id="Customer_eInvoice"
										styleClass="aon-margin-left" value="#{customer.to.EInvoice}"
										title="#{bundle.aon_activate}/#{bundle.aon_deactivate} #{bundle.customer_eInvoice}"
										valueChangeListener="#{customer.eInvoiceChange}">
										<a4j:support event="onchange" ajaxSingle="true"
											reRender="customerTab" />
									</aon:selectBooleanCheckbox>
									<aon:outputLabel for="Customer_eInvoice"
										value="#{bundle.customer_eInvoice}" />
								</aon:if>
								<aon:if test="#{company.ediSupportEnabled}">
									<aon:selectBooleanCheckbox id="Customer_edi"
										styleClass="aon-margin-left"
										value="#{customerEdiSupport.enabled}"
										title="#{bundle.aon_activate}/#{bundle.aon_deactivate} #{bundle.aon_edi_message}"
										valueChangeListener="#{customer.ediChange}">
										<a4j:support event="onchange" ajaxSingle="true"
											reRender="eInvoice-panel, customerTab" />
									</aon:selectBooleanCheckbox>
									<aon:outputLabel for="Customer_edi"
										value="#{bundle.aon_edi_message}" />
									<aon:if test="#{customerEdiSupport.enabled}">
										<aon:outputText	styleClass="aon-margin-left aon-bold"
											value="| Seresnet:" />
										<aon:selectBooleanCheckbox id="Customer_seres_autoCommitDelivery" styleClass="aon-margin-left"
											value="#{customerEdiSupport.seresAutoCommitDelivery}" />
										<aon:outputLabel for="Customer_seres_autoCommitDelivery" styleClass="aon-italic"
											value="Envío auto. albaranes" />
										<aon:selectBooleanCheckbox id="Customer_seres_invoicingMainAddress" styleClass="aon-margin-left"
											value="#{customerEdiSupport.seresInvoicingMainAddress}" />
										<aon:outputLabel for="Customer_seres_invoicingMainAddress" styleClass="aon-italic"
											value="Facturar a dir. principal" />
									</aon:if>
								</aon:if>
							</aon:div>
						</aon:if>

						<aon:if test="#{!customer.nevv and customer.to.invoicingGroup.id != null}">
							<aon:outputLabel value="#{bundle.customer_invoicingGroup}" />
							<aon:div>
								<aon:outputText	value="#{customer.to.invoicingGroup.description}" />
								<aon:if test="#{customer.invoicingGroupInMyScopes}">
									<aon:commandLink id="invoicingGroup_link" immediate="true"
										styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
										value="&#160;" title="#{bundle.aon_go}"
										actionListener="#{customer.onLoadInvoicingGroup}"
										action="invoicingGroup_form"
										reRender="aonContent" />
								</aon:if>
							</aon:div>
						</aon:if>
	
						<aon:if test="#{!customer.nevv and aonRole.accountingOperator and aonConfiguration.bean.customer.showAccount}">
							<aon:outputLabel for="Account_id" value="#{bundle.finance_account}" />
							<aon:panelGrid id="accountContainer" columns="2" columnClasses="none,none">
								<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
									<ui:param name="lookupTo" value="#{customer.to.account}" />
									<ui:param name="lookupReRender" value="accountLookupButtons" />
								</ui:include>
								<aon:div id="accountLookupButtons">
									<aon:commandButton
										value="#{bundle.account_synchronize}"
										title="#{bundle.account_synchronize}"
										style="border: #808080 1px solid;"
										styleClass="aon-finding-toolbar-item aon-icon-refresh"
										rendered="#{customer.accountSynchronizable}"
										actionListener="#{customer.onAccountSynchronize}"
										reRender="accountContainer">
									</aon:commandButton>
									<aon:commandButton
										value="#{bundle.account_new_account}" 
										title="#{bundle.account_new_account}"
										style="border: #808080 1px solid;"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										rendered="#{customer.to.account == null or customer.to.account.id == null}"
										actionListener="#{customer.onNewAccount}"
										reRender="accountContainer">
									</aon:commandButton>
								</aon:div>
							</aon:panelGrid>
						</aon:if>

						<aon:outputLabel for="Observation"
							value="#{bundle.registry_observation}" />
						<aon:inputTextarea id="Observation" cols="120" rows="3"
							value="#{customerObservation.observation.comments}" />

					</aon:panelGrid>

					</aon:div>
					
					<aon:panelTabSet id="customerTab" selectedTab="#{customer.selectedTab}">

						<aon:panelTab id="address"	label="#{bundle.registry_address_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{customerAddress}" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="media" label="#{bundle.aon_contacts}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{customerMedia}" />
							</ui:include>
						</aon:panelTab>

						<aon:if test="#{aonConfiguration.bean.customer.showFinanceData}">
							<aon:panelTab id="finance" label="#{bundle.registry_finance_data_module}">
								<aon:panel>
									<f:facet name="header">
										<aon:outputText	value="#{bundle.registry_banks_module}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerRbank}" />
									</ui:include>
								</aon:panel>
								<aon:panel>
									<f:facet name="header">
										<aon:outputText	value="#{bundle.config_predef_paymethod}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerRPayMethod}" />
									</ui:include>
								</aon:panel>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showFinanceFeeData and aonRole.financeOperator and customerFee.model.rowCount > 0}">
							<aon:panelTab id="fee" label="#{bundle.finance_fees_module}">
								<ui:include	src="/com/code/aon/ui/finance/facelet/fee/tab_grid.xhtml" >
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showProjectData and customerProject.model.rowCount > 0}">
							<aon:panelTab id="projects" label="#{bundle.aon_module_groupware}">
								<ui:include src="/com/code/aon/ui/project/facelet/project/tab_grid.xhtml">
									<ui:param name="controller" value="#{customerProject}" />
									<ui:param name="skipAssignedColumn" value="#{true}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showNote and customerNote.model.rowCount > 0}">
							<aon:panelTab id="rnotes" label="#{bundle.aon_notes}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/rnote/grid.xhtml">
									<ui:param name="controller" value="#{customerNote}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showRelationship and customerRelationship.model.rowCount > 0}">
							<aon:panelTab id="rrelationship" label="#{bundle.registry_relationship}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/rrelationship/grid.xhtml">
									<ui:param name="controller" value="#{customerRelationship}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showRecordData and customerRecordData.model.rowCount > 0}">
							<aon:panelTab id="recordData" label="#{bundle.registry_rd_module}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/record_data/tab_include.xhtml">
									<ui:param name="controller" value="#{customerRecordData}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showSegment and customerSegment.model.rowCount > 0}">
							<aon:panelTab id="segment" label="#{bundle.registry_segment_module}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/rsegment/tab_grid.xhtml">
									<ui:param name="controller" value="#{customerSegment}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showAddInfo and customerAddInfo.model.rowCount > 0}">
							<aon:panelTab id="addInfo" label="#{bundle.aon_addInfo}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/raddinfo/tab_grid.xhtml">
									<ui:param name="controller" value="#{customerAddInfo}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
						
						<aon:if test="#{customer.snapshot}">
							<aon:panelTab id="domainLinked" label="Dominios vinculados">
								<ui:include	src="/com/code/aon/ui/customer/facelet/customer/domainLinked/domainLinked.xhtml">

								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showDirStaff and customerDirStaff.model.rowCount > 0}">
							<aon:panelTab id="dirStaff" label="#{bundle.registry_dir_staff}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/rdirstaff/tab_grid.xhtml">
									<ui:param name="controller" value="#{customerDirStaff}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
						
						<aon:if test="#{aonRole.document and customerRAttach.model.rowCount > 0}">
							<aon:panelTab id="documentManagement" label="#{bundle.aon_documents}">
								<ui:include src="/com/code/aon/ui/registry/facelet/documentManager/tab_grid.xhtml">
									<ui:param name="controller" value="#{customerRAttach}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>								
							</aon:panelTab>
						</aon:if>
						
						<aon:if test="#{aonConfiguration.bean.customer.showProduct and customerItem.model.rowCount > 0}">
							<aon:panelTab id="customerItem" label="#{bundle.aon_role_product}">
								<ui:include src="/com/code/aon/ui/registry/facelet/ritem/tab_grid.xhtml" >
									<ui:param name="controller" value="#{customerItem}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showTax and customerTax.model.rowCount > 0}">
							<aon:panelTab id="customerTax" label="#{bundle.config_tax_module}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rtax/tab_grid.xhtml" >
									<ui:param name="controller" value="#{customerTax}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showSeller and customerSeller.model.rowCount > 0}">
							<aon:panelTab id="customerSeller" label="#{bundle.aon_module_commercial}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rseller/tab_grid.xhtml" >
									<ui:param name="controller" value="#{customerSeller}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>

						<aon:if test="#{aonConfiguration.bean.customer.showProfile and customerProfile.model.rowCount > 0}">
							<aon:panelTab id="customerProfile" label="#{bundle.registry_profile}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rprofile/tab_grid.xhtml" >
									<ui:param name="controller" value="#{customerProfile}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
						
						<aon:if test="#{aonConfiguration.bean.customer.showSupplier and customerSupplier.model.rowCount > 0}">
							<aon:panelTab id="customerSupplier" label="#{bundle.registry_supplier_info}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rsupplier/tab_include.xhtml">
									<ui:param name="controller" value="#{customerSupplier}" />
									<ui:param name="removeButtonReRender" value="customerTab" />
								</ui:include>
 							</aon:panelTab>
						</aon:if>						

						<aon:if test="#{customer.showAlumnData}">
							<aon:if test="#{aonConfiguration.bean.customer.showAbsence and customerAbsence.showTab}">
								<aon:panelTab id="absence" label="#{bundle.absence_absences}">
									<ui:include	src="/com/code/aon/ui/academy/facelet/customerAbsence/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerAbsence}" />
										<ui:param name="removeButtonReRender" value="customerTab" />
									</ui:include>
								</aon:panelTab>
							</aon:if>
	
							<aon:if test="#{aonConfiguration.bean.customer.showLoan and customerLoan.showTab}">
								<aon:panelTab id="loan" label="#{bundle.academy_loans}">
									<ui:include	src="/com/code/aon/ui/academy/facelet/customerLoan/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerLoan}" />
										<ui:param name="removeButtonReRender" value="customerTab" />
									</ui:include>
								</aon:panelTab>
							</aon:if>
	
							<aon:if test="#{aonConfiguration.bean.customer.showCourse and customerCourse.showTab}">
								<aon:panelTab id="course" label="#{bundle.aon_group}">
									<ui:include	src="/com/code/aon/ui/academy/facelet/customerCourse/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerCourse}" />
										<ui:param name="removeButtonReRender" value="customerTab" />
									</ui:include>
								</aon:panelTab>
							</aon:if>
						</aon:if>
						
						<aon:if test="#{customer.to.EInvoice}">
							<aon:panelTab id="customerEInvoice" label="#{bundle.customer_eInvoice}">
								<ui:include src="/com/code/aon/ui/customer/facelet/customer/formEInvoice.xhtml" >
									<ui:param name="controller" value="#{customer}" />
								</ui:include>
 							</aon:panelTab>
						</aon:if>						
						
						<aon:if test="#{company.ediSupportEnabled and customerEdiSupport.enabled}">
							<aon:panelTab id="customerEDI" label="#{bundle.aon_edi_message}">
								<ui:include src="/com/code/aon/ui/customer/facelet/customer/formEDI.xhtml"  />
							</aon:panelTab>
						</aon:if>						

					</aon:panelTabSet>
				</aon:if>
			</aon:div>
		</aon:form>
		<aon:if test="#{!customer.nevv}">
			<aon:if test="#{aonRole.accountingOperator}">
				<aon:lookupButtonPopup lookup="#{accountLookup}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.customer.showFinanceFeeData}">
				<aon:lookupButtonPopup lookup="#{invoicingGroupLookup}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.customer.showRelationship}">
				<aon:lookupButtonPopup lookup="#{registryLookup}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.customer.showProfile}">
				<aon:lookupButtonPopup lookup="#{questionLookup}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.customer.showSupplier}">
				<aon:lookupButtonPopup lookup="#{supplierLookup}" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.customer.showProduct or aonConfiguration.bean.customer.showFinanceFeeData}">
				<aon:lookupButtonPopup lookup="#{saleItemLookup}" />
			</aon:if>	
			<aon:if test="#{aonConfiguration.bean.customer.showSeller or aonConfiguration.bean.customer.showFinanceFeeData}">
				<aon:lookupButtonPopup lookup="#{sellerLookup}" />
			</aon:if>
			
			<aon:if test="#{aonConfiguration.bean.rmedia.showSendEmail}">
				<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.customer.showFinanceFeeData and aonRole.financeOperator}">
				<ui:include	src="/com/code/aon/ui/finance/facelet/fee/newFeeModal.xhtml">
					<ui:param name="controller" value="#{customer}" />
					<ui:param name="feeController" value="#{customerFee}" />
					<ui:param name="modalReRender" value="customerTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.customer.showProjectData}">
				<ui:include src="/com/code/aon/ui/project/facelet/project/newProjectModal.xhtml">
					<ui:param name="controller" value="#{customer}" />
					<ui:param name="projectController" value="#{customerProject}" />
					<ui:param name="modalReRender" value="customerTab" />
					<ui:param name="skipRegistryLookup" value="true" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.customer.showNote}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rnote/newNoteModal.xhtml">
					<ui:param name="controller" value="#{customer}" />
					<ui:param name="noteController" value="#{customerNote}" />
					<ui:param name="modalReRender" value="customerTab" />
				</ui:include>
			</aon:if>
			<aon:if test="#{aonConfiguration.bean.customer.showRelationship}">
				<ui:include src="/com/code/aon/ui/registry/facelet/rrelationship/newRelationshipModal.xhtml">
