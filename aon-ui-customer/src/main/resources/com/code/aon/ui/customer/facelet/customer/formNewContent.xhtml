<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">


		<aon:if test="#{lookup != null}">
			<ui:param name="controller" value="#{lookup}"/>
		</aon:if>
	
		<aon:if test="${!userUtils.newAONTheme}">
			<aon:panelGrid columns="2" columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/customer/facelet/customer/formContent.xhtml" />
				<aon:if test="#{aonConfiguration.bean.customer.showTariff}">
					<aon:outputLabel for="Customer_tariff_id"
						value="#{bundle.report_tariff}" />
					<aon:selectOneMenu id="Customer_tariff_id"
						value="#{controller.to.tariff}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.salesTariffs}" />
					</aon:selectOneMenu>
				</aon:if>
				<ui:include src="/com/code/aon/ui/registry/facelet/lookup/registry/formAddressMedia.xhtml">
					<ui:param name="controllerLookupListener" value="#{customerForm}"/>
				</ui:include>
			</aon:panelGrid>
			<aon:if test="#{aonConfiguration.bean.customer.showFinanceData}">
				<ui:include src="/com/code/aon/ui/registry/facelet/lookup/registry/formPayMethod.xhtml">
					<ui:param name="controllerLookupListener" value="#{customerForm}"/>
				</ui:include>
			</aon:if>	
		</aon:if>

		<aon:if test="${userUtils.newAONTheme}">
				
						
			<aon:valueParam name="skipPhone" default="#{false}"/>
			<aon:valueParam name="skipCellular" default="#{false}"/>
			<aon:valueParam name="skipFax" default="#{false}"/>
			<aon:valueParam name="skipEmail" default="#{false}"/>
			<aon:valueParam name="skipWeb" default="#{false}"/>
			
			<c:set var="pojoName" value="#{controller.pojoShortName}" />
			<c:set var="registry" value="#{controller.to.registry}"/>
			
			<aon:panelGrid 
				columns="2" 
				columnClasses="aon-padding aon-width-half aon-vertical-alig-top" >
				
				<!-- 
					Personal Data
				-->
				<aon:panelGrid 
					columns="1" 
					styleClass="aon-width-all"
					columnClasses="aon-padding-top" 
					headerClass="aon-direct-access-panel aon-padding" >
					<f:facet name="header">
						<aon:outputText value="Datos Personales" />
					</f:facet>
					
					<aon:panelGroup id="#{pojoName}DocumentPanel">
						<aon:panelGrid columns="5" columnClasses="aon-padding">
	
							<aon:if test="#{!skipRegistryType}">
								<aon:dropDownOneMenu 
									id="#{pojoName}_type" 
									value="#{registry.type}"
									title="#{bundle.aon_entity}"
									>
									<f:selectItems value="#{registryCollections.registryTypes}" />
									<a4j:support event="onclick" focus="#{pojoName}_document"
										actionListener="#{controller.onChangeRegistryType}"
										reRender="#{pojoName}DocumentPanel,#{registryTypeReRender}" 
										ajaxSingle="true" />
								</aon:dropDownOneMenu>
							</aon:if>
	
							<aon:dropDownOneMenu 
								id="#{controller.pojoShortName}_document_type"
								title="#{bundle.aon_document}" 
								value="#{registry.documentType}">
								<f:selectItems value="#{registryCollections.documentTypes}" />
								<a4j:support event="onchange" focus="#{pojoName}_document"
									actionListener="#{controller.onChangeDocument}"
									reRender="#{pojoName}DocumentPanel,#{pojoName}_type" 
									ajaxSingle="true" />
							</aon:dropDownOneMenu>
							
							<aon:dropDownOneMenu 
								id="#{pojoName}_document_country"
								__styleClass="aon-margin-left"  
								value="#{registry.documentCountry}"
								title="#{bundle.aon_document_country}"
								>
								<f:selectItems value="#{commonCollections.countryCodes}" />
								<a4j:support event="onchange" focus="#{pojoName}_document"
									actionListener="#{controller.onChangeDocument}"
									reRender="#{pojoName}DocumentPanel"
									ajaxSingle="true" />
							</aon:dropDownOneMenu>
							
							<aon:textField 
								id="#{pojoName}_document" 
								value="#{registry.document}" 
								title="#{bundle.aon_document}" 
								size="16" 
								maxlength="16">
								<f:validateLength minimum="1" maximum="16" />
								<a4j:support onsubmit="toUpperCase(this);"
									event="onchange" focus="#{pojoName}_name"
									actionListener="#{controller.onChangeDocument}"
									reRender="#{pojoName}DocumentPanel" 
									ajaxSingle="true" />
							</aon:textField>
							
							<aon:outputText 
								rendered="#{!registry.documentValidable}"
								styleClass="aon-icon-question"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{registry.documentValidable and registry.validDocument}"
								styleClass="aon-icon-predetermine"
								style="padding-left: 15px;"
								value="&#160;" />
							<aon:outputText 
								rendered="#{registry.documentValidable and !registry.validDocument}"
								styleClass="aon-icon-exception"
								style="padding-left: 15px;"
								value="&#160;" />
								
						</aon:panelGrid>
					</aon:panelGroup>
					
					<aon:panelGrid columns="2" columnClasses="aon-padding-left aon-padding-bottom" >
		
						<aon:dropDownOneMenu 
							id="#{pojoName}_nationality"
							value="#{registry.nationality}" 
							title="#{bundle.registry_nationality}" >
							<f:selectItem value="#{null}" itemLabel="-"/>
							<f:selectItems value="#{commonCollections.countries}" />
						</aon:dropDownOneMenu>
					
						<aon:textField 
							id="#{pojoName}_name" 
							size="64"
							maxlength="64"
							required="true"
							value="#{registry.name}" 
							title="#{bundle.aon_company_name}" >
							<f:validateLength minimum="1" maximum="64" />
						</aon:textField>
					
					</aon:panelGrid>
					
					<aon:panelGrid columns="2" columnClasses="aon-padding-left aon-padding-bottom" >
		
						<aon:if test="#{includeRegistryScope}">
							<aon:dropDownOneMenu 
								id="#{pojoName}_scope_id"
								title="#{bundle.aon_scope}" 
								value="#{controller.to.scope}"
								>
								<f:selectItems value="#{configCollections.currentUserScopes}" />
							</aon:dropDownOneMenu>
						</aon:if>
	
						<aon:textField 
							id="#{pojoName}_alias" 
							size="32"
							maxlength="32"
							value="#{registry.alias}" 
							title="#{bundle.aon_company_alias}">
							<f:validateLength minimum="1" maximum="32" />
						</aon:textField>
					
					</aon:panelGrid>
					
				</aon:panelGrid>

				<!-- 
					Address
				 -->
				<aon:panelGrid 
					columns="1" 
					styleClass="aon-width-all"
					columnClasses="aon-padding-top" 
					headerClass="aon-direct-access-panel aon-padding" >
					<f:facet name="header">
						<aon:outputText value="Dirección" />
					</f:facet>
						<aon:panelGrid columns="3"  
							columnClasses="aon-padding">
							
							<aon:dropDownOneMenu id="#{pojoName}_streetType"
								title="Vía"
								required="#{addressRequired}"
								label="#{bundle.registry_street_type}"
								value="#{registryAddress.streetType}">
								<f:selectItems value="#{registryCollections.streetTypes}" />
							</aon:dropDownOneMenu>
							<aon:textField 
								id="#{pojoName}_address" 
								style="margin-left: 5px;" 
								required="#{addressRequired}"
								title="#{bundle.aon_address}"  
								value="#{registryAddress.address}"
								maxlength="128" size="32" />
							<aon:textField 
								id="#{pojoName}_number" 
								style="margin-left: 5px;" 
								required="#{addressRequired}"
								title="#{bundle.aon_number}" 
								value="#{registryAddress.number}" maxlength="8" size="5" />
	
						</aon:panelGrid>
						<aon:panelGrid columns="2"  
							columnClasses="aon-padding-left aon-padding-bottom">
							<aon:textField 
								id="#{pojoName}_address2" 
								value="#{registryAddress.address2}" 
								title="#{bundle.registry_address_detail}" 
								style="display:inline" maxlength="128" size="32" />
				
							<aon:textField 
								id="#{pojoName}_address3" 
								value="#{registryAddress.address3}" 
								title="#{bundle.registry_address_detail}" 
								style="margin-left: 5px" maxlength="128" size="37" />
				
						</aon:panelGrid>

						<aon:panelGrid columns="4"  
							columnClasses="aon-padding-left aon-padding-bottom">
							<aon:textField 
								id="#{pojoName}_address_zip" 
								size="16" maxlength="16"
								value="#{registryAddress.zip}"
								title="#{bundle.aon_postal_code}" 
								reRender="#{pojoName}_address_geozone, #{pojoName}_address_municipality"
								focus="#{pojoName}#{showMunicipality?'_address_municipality':'_address_city'}"
								actionListener="#{controller.onLoadGeozone}" />
							
							<aon:dropDownOneMenu id="#{pojoName}_address_geozone"
								title="#{bundle.aon_state}"
								value="#{registryAddress.geozone}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{geozoneCollections.geoTrees}" />
								<a4j:support event="onchange" reRender="#{pojoName}_address_municipality" ajaxSingle="true" />
							</aon:dropDownOneMenu>
						
							<aon:if test="#{showMunicipality}">
									<aon:dropDownOneMenu id="#{pojoName}_address_municipality"
										required="#{true}"
										title="#{bundle.registry_municipality}"
										value="#{registryAddress.municipalityCode}">
										<f:selectItem itemLabel="-" value="#{null}" />
										<f:selectItems value="#{controller.municipalities}" />
									</aon:dropDownOneMenu>
									<aon:textField 
										id="#{pojoName}_address_city"
										title="#{bundle.registry_city}" 
										value="#{registryAddress.city}" size="30" maxlength="64"/>
							</aon:if>
							<aon:if test="#{!showMunicipality}">
								<aon:textField 
									id="#{pojoName}_address_city"
									title="#{bundle.registry_city}" 
									value="#{registryAddress.city}" size="64" maxlength="64"/>
							</aon:if>
						</aon:panelGrid>
							
				</aon:panelGrid>
				
				<!--  
					Economic Data
				-->
				<aon:panelGrid 
					columns="1" 
					styleClass="aon-width-all"
					columnClasses="aon-padding-top" 
					headerClass="aon-direct-access-panel aon-padding" >
					<f:facet name="header">
						<aon:outputText value="Datos Económicos" />
					</f:facet>
					<aon:panelGrid columns="3" columnClasses="aon-padding" >
		
						<aon:if test="#{aonConfiguration.bean.customer.showTaxInfoData}">
							<aon:dropDownOneMenu 
								id="Customer_transaction"
								value="#{controller.to.transaction}"
								title="#{bundle.aon_transaction_type}"  
								>
								<f:selectItems value="#{configCollections.invoiceTransactionTypes}" />
							</aon:dropDownOneMenu>
					
							<!-- aon:outputText value="#{bundle.customer_taxes}" /-->
							<aon:div>
								<aon:selectBooleanCheckbox id="Customer_surcharge"
									value="#{controller.to.surcharge}" />
								<aon:outputLabel for="Customer_surcharge" styleClass="aon-italic"
									value="#{bundle.aon_surcharge_full}" />
					
								<aon:selectBooleanCheckbox id="Customer_withholding" styleClass="aon-margin-left"
									value="#{controller.to.withholding}" />
								<aon:outputLabel for="Customer_withholding" styleClass="aon-italic"
									value="#{bundle.aon_retention}" />
							</aon:div>
						</aon:if>
			
						<aon:if test="#{aonConfiguration.bean.customer.showTariff}">
							<aon:dropDownOneMenu 
								id="Customer_tariff_id"
								value="#{controller.to.tariff}"
								title="#{bundle.report_tariff}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{configCollections.salesTariffs}" />
							</aon:dropDownOneMenu>
						</aon:if>

					</aon:panelGrid>
								
					<aon:panelGrid columns="1" columnClasses="aon-padding-left aon-padding-bottom" >
						
						<c:set var="controllerLookupListener" value="#{customerForm}" />
						
						<aon:if test="#{aonConfiguration.bean.customer.showFinanceData}">
							<aon:panelGrid columns="2" columnClasses="aon-padding-right aon-padding-top ">
						
								<aon:dropDownOneMenu 
									id="RegistryPayMethod_payment"
									title="#{bundle.finance_payMethod}" 
									reRender="Registry-PayMethodDiv,Registry-PayMethodDiv2"
									value="#{controllerLookupListener.registryPayMethod.payment}"
									valueChangeListener="#{controllerLookupListener.onPayMethodChanged}"
									>
									<f:selectItem value="#{null}" />
									<f:selectItems value="#{configCollections.payMethods}" />
								</aon:dropDownOneMenu>
								<aon:div></aon:div>
							</aon:panelGrid>				
						</aon:if>	
						
					</aon:panelGrid>
				</aon:panelGrid>
				
				<!--
					Contact Data 
				 -->
				<aon:panelGrid 
					columns="2" 
					styleClass="aon-width-all"
					columnClasses="aon-padding-top aon-vertical-align-top" 
					headerClass="aon-direct-access-panel aon-padding-top aon-padding-bottom" >
					<f:facet name="header">
						<aon:outputText value="Datos de Contacto" />
					</f:facet>
					<aon:panelGrid columns="2"  
						columnClasses="aon-padding-left aon-padding-top aon-vertical-align-top aon-padding-bottom">
						<aon:if test="#{!skipPhone}">
							<aon:textField id="#{pojoName}_telephone"
								title="#{bundle.aon_phone}" 
								value="#{controllerLookupListener.phone.value}" size="12" maxlength="64"/>
							<aon:textField 
								id="#{pojoName}_telephone_comment"
								title="#{bundle.aon_comment}" 
								value="#{controllerLookupListener.phone.comment}" size="44" maxlength="64"/>
						</aon:if>
						
						<aon:if test="#{!skipCellular}">
							<aon:textField id="#{pojoName}_cellular"
								title="#{bundle.aon_cellular}" 
								value="#{controllerLookupListener.cellular.value}" size="12" maxlength="64"/>
							<aon:textField 
								id="#{pojoName}_cellular_comment"
								title="#{bundle.aon_comment}"
								value="#{controllerLookupListener.cellular.comment}" size="44" maxlength="64"/>
						</aon:if>
							
						<aon:if test="#{!skipFax}">
								<aon:textField id="#{pojoName}_fax"
									title="#{bundle.aon_fax}"
									value="#{controllerLookupListener.fax.value}" size="12" maxlength="64"/>
								<aon:textField id="#{pojoName}_fax_comment"
									title="#{bundle.aon_comment}"
									value="#{controllerLookupListener.fax.comment}" size="44" maxlength="64"/>
						</aon:if>
			
					</aon:panelGrid>
					<aon:panelGrid columns="1"  
						columnClasses="aon-padding-left aon-padding-top aon-padding-bottom"
						headerClass="aon-direct-access-panel aon-padding-top aon-padding-bottom" >
						<aon:if test="#{!skipEmail}">
							<aon:textField id="#{pojoName}_email" 
								title="#{bundle.registry_email}"
								value="#{controllerLookupListener.email.value}" size="44" maxlength="64" onblur="toLowerCase(this);" />
						</aon:if>
					
						<aon:if test="#{!skipWeb}">
							<aon:textField id="#{pojoName}_web"
								title="#{bundle.aon_web}" 
								value="#{controllerLookupListener.web.value}" size="44" maxlength="64" onblur="toLowerCase(this);" />
						</aon:if>
					</aon:panelGrid>
				</aon:panelGrid>
				
			</aon:panelGrid>

		</aon:if>
	

</ui:composition>
