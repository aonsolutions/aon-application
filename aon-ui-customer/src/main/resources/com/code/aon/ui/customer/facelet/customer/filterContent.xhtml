<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputText value="" />
	<aon:div styleClass="aon-search-content-width">
		<aon:panelCollapsible styleClass="aonCard" expanded="false" label="#{bundle.aon_customer}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/customer/facelet/customer/searchBasicContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>
				
		<aon:panelCollapsible expanded="false" styleClass="aonCard" label="#{bundle.registry_address_module}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml">
					<ui:param name="searchController" value="#{customerSearch}" />
				</ui:include>
			</aon:panelGrid>
		</aon:panelCollapsible>
		
		<aon:panelCollapsible expanded="false" styleClass="aonCard" label="#{bundle.aon_contacts}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml">
					<ui:param name="searchController" value="#{customerSearch}" />
				</ui:include>
			</aon:panelGrid>
		</aon:panelCollapsible>
		
		

		<aon:if test="#{aonConfiguration.bean.customer.showFinanceData}">
		<aon:panelCollapsible expanded="false" styleClass="aonCard" label="#{bundle.registry_finance_data_module}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/registry/facelet/rpaymethod/searchContent.xhtml">
						<ui:param name="searchController" value="#{customerSearch}" />
					</ui:include>
			</aon:panelGrid>
		</aon:panelCollapsible>
		</aon:if>
		
		<aon:if test="#{aonConfiguration.bean.customer.showSegment}">
		<aon:panelCollapsible expanded="false" styleClass="aonCard" label="#{bundle.registry_segment_module}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/registry/facelet/rsegment/searchContent.xhtml">
						<ui:param name="searchController" value="#{customerSearch}" />
					</ui:include>
			</aon:panelGrid>
		</aon:panelCollapsible>
		</aon:if>		
		
		<aon:if test="#{aonConfiguration.bean.customer.showProduct}">
		<aon:panelCollapsible expanded="false" styleClass="aonCard" label="#{bundle.aon_role_product}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/registry/facelet/ritem/searchContent.xhtml">
						<ui:param name="rItemController" value="#{customerItem}" />
					</ui:include>	
			</aon:panelGrid>
		</aon:panelCollapsible>
		</aon:if>	
		
		<aon:if test="#{aonConfiguration.bean.customer.showSeller}">
		<aon:panelCollapsible expanded="false" styleClass="aonCard" label="#{bundle.aon_module_commercial}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/registry/facelet/rseller/searchContent.xhtml" />		
			</aon:panelGrid>
		</aon:panelCollapsible>
		</aon:if>					

		<aon:if test="#{aonConfiguration.bean.customer.showProfile}">	
		<aon:panelCollapsible expanded="false" styleClass="aonCard" label="#{bundle.registry_profile}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/registry/facelet/rprofile/searchContent.xhtml" />			
			</aon:panelGrid>
		</aon:panelCollapsible>
		</aon:if>	
						
        
		<aon:if test="#{aonRole.document}">
		<aon:panelCollapsible expanded="false" styleClass="aonCard" label="#{bundle.aon_documents}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/registry/facelet/rattach/searchContent.xhtml" />	
			</aon:panelGrid>
		</aon:panelCollapsible>
		</aon:if>	
		
		
		<aon:if test="#{aonConfiguration.bean.customer.showAddInfo}">	
		<aon:panelCollapsible expanded="false" styleClass="aonCard" label="#{bundle.aon_addInfo}">
			<aon:panelGrid 
			columns="2" 
			styleClass="aonCard"
			columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-500">
				<ui:include src="/com/code/aon/ui/registry/facelet/raddinfo/searchContent.xhtml" />	
			</aon:panelGrid>
		</aon:panelCollapsible>
		</aon:if>	
						
				
				
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/searchContent.xhtml" />
						
	</aon:div>

</ui:composition>
