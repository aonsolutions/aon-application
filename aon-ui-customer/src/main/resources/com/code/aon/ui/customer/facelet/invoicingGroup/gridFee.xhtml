<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="skipResetButton" value="#{true}" />
		<ui:param name="skipSaveButton" value="#{true}" />
		<ui:param name="skipCancelButton" value="#{true}" />
		<ui:param name="skipRemoveButton" value="#{true}" />
		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_customer}" />
				</f:facet>
				<aon:outputText value="#{to.customer.registry.fullName}" />
			</aon:column>								

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_product}" />
				</f:facet>
				<aon:outputText value="#{to.description}" />
			</aon:column>								

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_quantity_abrv}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText	value="#{to.price}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_discount_abrv}" />
				</f:facet>
				<aon:outputText value="#{to.discountExpression.discountExpr}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_date_from}" />
				</f:facet>
				<aon:outputText value="#{to.initialDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_date_to}" />
				</f:facet>
				<aon:outputText value="#{to.finalDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.finance_fee_billing_date_abrv}" />
				</f:facet>
				<aon:div styleClass="aon-nowrap">
					<aon:outputText value="#{to.billingDateMonth}" />
					<aon:outputText value="/#{to.billingDateYear}" />
				</aon:div>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_period}" />
				</f:facet>
				<aon:outputText value="#{to.period}" />
			</aon:column>

		</ui:define>
		<ui:define name="endFormListContent">
			<aon:commandLink id="customer_link3" immediate="true"
				styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
				value="&#160;" title="#{bundle.aon_go}"
				actionListener="#{controller.onLoadCustomer}"
				action="customer_form"
				reRender="aonContent" />
			<aon:confirmButton id="remove_groupFee" immediate="true"
				styleClass="aon-editDataTable-button aon-icon-delete"
				title="#{bundle.aon_remove}"
				confirmTitle="#{bundle.aon_confirm_title}"
				confirmMessage="#{bundle.customer_invoicing_group_delete_confirm}"
				confirmActionListener="#{controller.onRemove}"
				reRender="invoicingGroupForm" ajaxSingle="true" />
		</ui:define>
	</ui:decorate>

</ui:composition>
