<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountCheckerList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.customer_account_checker_module}" />
				<ui:param name="controller" value="#{customerAccountChecker}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{customerAccountChecker}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:define name="columns">
					
						<aon:column alias="Customer.id"
							styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>
					
						<aon:column alias="Customer.registry.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_name}" />
							</f:facet>
							<aon:outputText value="#{to.registry.name}" />
						</aon:column>
	
						<aon:column alias="Customer.account.code"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.account_account}" />
							</f:facet>
							<aon:outputText value="#{to.account.fullDescription}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<aon:commandLink id="CustomerAccountChecker_newAccount"
									value="#{bundle.account_new_account_abbrv}"
									title="#{bundle.account_new_account}"
									styleClass="aon-dataTable-link" 
									rendered="#{to.account == null or to.account.id == null}"
									actionListener="#{customerAccountChecker.onNewAccount}"
									reRender="#{dataTableId}">
								</aon:commandLink>
								<aon:commandLink id="CustomerAccountChecker_synchronizeAccount"
									value="#{bundle.account_synchronize_abbrv}"
									title="#{bundle.account_synchronize}"
									styleClass="aon-dataTable-link" 
									rendered="#{customerAccountChecker.accountSynchronizable}"
									actionListener="#{customerAccountChecker.onAccountSynchronize}"
									reRender="#{dataTableId}">
								</aon:commandLink>
							</aon:div>
						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
