<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="customerForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{customerBundle.customer_module}" />
				<ui:param name="controller" value="#{customer}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<ui:include src="/com/code/aon/ui/registry/facelet/registry/formContent.xhtml">
						<ui:param name="controller" value="#{customer}" />
					</ui:include>

					<aon:outputLabel for="Customer_tariff_id"
						value="#{productBundle.product_tariff}" />
					<aon:selectOneMenu id="Customer_tariff_id"
						value="#{customer.to.tariff}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{productCollections.tariffs}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Customer_customerSegment_id"
						value="#{bundle.aon_segment}" />
					<aon:selectOneMenu id="Customer_customerSegment_id"
						value="#{customer.to.customerSegment}">
						<f:selectItem itemLabel="-" value="#{null}"/>		
						<f:selectItems value="#{customerCollections.customerSegments}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Customer_scope_id"
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Customer_scope_id"
						value="#{customer.to.scope}">
						<f:selectItems value="#{configCollections.scopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Customer_status" value="#{bundle.aon_status}" />
					<aon:selectOneMenu id="Customer_status" value="#{customer.to.status}">
						<f:selectItems value="#{customerCollections.customerStatuses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Customer_surcharge"
						value="#{customerBundle.customer_surcharge}" />
					<aon:selectBooleanCheckbox id="Customer_surcharge"
						value="#{customer.to.surcharge}" />

					<aon:outputLabel for="Observation"
						value="#{customerBundle.customer_observation}" />
					<aon:inputTextarea id="Observation" cols="51" rows="5"
						value="#{customerObservation.observation.comments}" />
				</aon:panelGrid>

				<c:if test="#{!customer.new}">				
					<aon:panelTabSet selectedTab="#{customer.selectedTab}"> 
						<aon:panelTab id="adddress" label="#{registryBundle.registry_address_module}">
							<ui:include src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{customerAddress}" />
							</ui:include>
						</aon:panelTab>
						<aon:panelTab id="media" label="#{registryBundle.registry_media_module}">
							<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{customerMedia}" />
							</ui:include>
						</aon:panelTab>
						<c:if test="#{customer.showFinanceData}">
							<aon:panelTab id="finance" label="#{financeBundle.finance_data_module}">
								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{financeBundle.finance_banks}"/>
									</f:facet>					
									<ui:include	src="/com/code/aon/ui/finance/facelet/rbank/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerRbank}" />
									</ui:include>
								</aon:panel>
								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{configBundle.config_pay_methods}"/>
									</f:facet>					
									<ui:include	src="/com/code/aon/ui/finance/facelet/rpayMethod/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerRPayMethod}" />
									</ui:include>
								</aon:panel>
							</aon:panelTab>
						</c:if>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<c:if test="#{customer.showFinanceData}">
			<aon:lookupButtonPopup lookup="#{bankLookup}" />
		</c:if>
	</ui:define>
</ui:composition>
