<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="customerForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{customerBundle.customer_module}" />
				<ui:param name="controller" value="#{customer}" />
				<ui:define name="beforeSpinToolbarContent">
				<aon:commandButton value="Historial" id="CustomerData" action="registry_stats"
					styleClass="aon-finding-toolbar-item aon-icon-task-assume"
					actionListener="#{customer.onCustomerData}">
				</aon:commandButton>				
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">

				<c:if test="#{customer.new}">
					<ui:include src="/com/code/aon/ui/customer/facelet/customer/formNewContent.xhtml" >
						<ui:param name="controller" value="#{customer}" />
					</ui:include>								
				</c:if>			
				<c:if test="#{!customer.new}">
					<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-150,
							aon-panelGrid-even aon-width-auto,
							aon-panelGrid-odd aon-width-120,
							aon-panelGrid-even aon-width-auto">
	
						<ui:include
							src="/com/code/aon/ui/customer/facelet/customer/formContent.xhtml">
							<ui:param name="controller" value="#{customer}" />
						</ui:include>
					</aon:panelGrid>

					<aon:panelGrid id="infoDataTable" styleClass="aon-margin-top"
						columns="2" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
	
						<c:if test="#{aonConfiguration.bean.customer.showTariff}">
							<aon:outputLabel for="Customer_tariff_id"
								value="#{productBundle.product_tariff}" />
							<aon:selectOneMenu id="Customer_tariff_id"
								value="#{customer.to.tariff}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{configCollections.tariffs}" />
							</aon:selectOneMenu>
						</c:if>
	
						<c:if test="#{aonConfiguration.bean.customer.showDeliveryData}">
							<aon:outputText value="#{customerBundle.customer_delivery_info}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="Customer_deliveryGrouped" styleClass="aon-margin-left"
									value="#{customer.to.deliveryGrouped}" />
								<aon:outputLabel for="Customer_deliveryGrouped" styleClass="aon-italic"
									value="#{customerBundle.customer_deliveryGrouped}" />
								<aon:selectBooleanCheckbox id="Customer_deliveryValuated" styleClass="aon-margin-left"
									value="#{customer.to.deliveryValuated}" />
								<aon:outputLabel for="Customer_deliveryValuated" styleClass="aon-italic"
									value="#{customerBundle.customer_deliveryValuated}" />
							</aon:div>
						</c:if>
	
						<c:if test="#{company.EInvoice}">
							<aon:outputLabel for="Customer_eInvoice"
								value="#{customerBundle.customer_eInvoice}" />
							<aon:selectOneRadio id="Customer_eInvoice" value="#{customer.to.EInvoice}">
								<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
								<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
							</aon:selectOneRadio>
						</c:if>
	
						<c:if test="#{aonRole.accountingOperator and aonConfiguration.bean.customer.showAccount and !customer.new}">
							<aon:outputLabel for="Customer_account" value="#{accountBundle.account_accounting}" />
							<h:panelGrid columns="2" id="accountContainer">
								<ui:include
									src="/com/code/aon/ui/account/facelet/lookup/account/accountLookup.xhtml">
									<ui:param name="id" value="Customer_account" />
									<ui:param name="entity" value="#{customerAccount.account}" />
									<ui:param name="ELExpression" value="customerAccount.account" />
								</ui:include>
	
								<aon:commandButton
									value="#{accountBundle.account_synchronize}"
									title="#{accountBundle.account_synchronize}"
									style="border: #808080 1px solid;"
									styleClass="aon-finding-toolbar-item aon-icon-refresh"
									rendered="#{customerAccount.accountSynchronizable}"
									reRender="accountContainer"
									actionListener="#{customerAccount.onAccountSynchronize}">
								</aon:commandButton>
	
								<aon:commandButton
									value="#{accountBundle.account_new_account}" 
									title="#{accountBundle.account_new_account}"
									style="border: #808080 1px solid;"
									styleClass="aon-finding-toolbar-item aon-icon-reset"
									rendered="#{customerAccount.account == null}"
									reRender="accountContainer"
									actionListener="#{customerAccount.onNewAccount}">
								</aon:commandButton>
							</h:panelGrid>
						</c:if>
	
						<aon:outputLabel for="Observation"
							value="#{customerBundle.customer_observation}" />
						<aon:inputTextarea id="Observation" cols="120" rows="3"
							value="#{customerObservation.observation.comments}" />
					</aon:panelGrid>

					<aon:panelTabSet id="customerTab" selectedTab="#{customer.selectedTab}">
						<aon:panelTab id="adddress"	label="#{registryBundle.registry_address_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{customerAddress}" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="media" label="#{registryBundle.registry_media_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{customerMedia}" />
							</ui:include>
						</aon:panelTab>

						<c:if test="#{aonConfiguration.bean.customer.showFinanceData}">
							<aon:panelTab id="finance"
								label="#{registryBundle.registry_finance_data_module}">
								<aon:panel>
									<f:facet name="header">
										<aon:outputText
											value="#{registryBundle.registry_banks_module}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerRbank}" />
									</ui:include>
								</aon:panel>
								<aon:panel>
									<f:facet name="header">
										<aon:outputText	value="#{configBundle.config_predef_paymethod}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerRPayMethod}" />
									</ui:include>
								</aon:panel>
							</aon:panelTab>
						</c:if>

						<c:if test="#{aonConfiguration.bean.customer.showFinanceFeeData}">
							<aon:panelTab id="fee"
								label="#{financeBundle.finance_fees_module}">
								<ui:include
									src="/com/code/aon/ui/finance/facelet/fee/tab_grid.xhtml">
								</ui:include>
							</aon:panelTab>
						</c:if>
						
						<c:if test="#{aonConfiguration.bean.customer.showProjectData}">
							<aon:panelTab id="dossiers"
								label="#{projectBundle.dossier_dossiers}">
								<aon:div rendered="#{!customer.new and dossier.form}">
									<ui:include src="/com/code/aon/ui/project/facelet/dossier/form.xhtml" />
								</aon:div>
								<aon:div rendered="#{!customer.new and !dossier.form}">
									<ui:include src="/com/code/aon/ui/project/facelet/dossier/list.xhtml" />
								</aon:div>
							</aon:panelTab>
						</c:if>

						<c:if test="#{aonConfiguration.bean.customer.showNote}">
							<aon:panelTab id="rnotes"
								label="#{registryBundle.registry_note}">
								<aon:div rendered="#{true}">
									<ui:include	src="/com/code/aon/ui/registry/facelet/rnote/grid.xhtml">
										<ui:param name="controller" value="#{customerNote}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
						</c:if>

						<c:if test="#{aonConfiguration.bean.customer.showRelationship}">
							<aon:panelTab id="rrelationship"
								label="#{registryBundle.registry_relationship}">
								<aon:div rendered="#{true}">
									<ui:include	src="/com/code/aon/ui/registry/facelet/rrelationship/grid.xhtml">
										<ui:param name="controller" value="#{customerRelationship}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
						</c:if>

						<c:if test="#{aonConfiguration.bean.customer.showRecordData}">
							<aon:panelTab id="recordData"
								label="#{registryBundle.registry_rd_module}">
								<aon:div rendered="#{true}">
									<ui:include	src="/com/code/aon/ui/registry/facelet/record_data/tab_include.xhtml">
										<ui:param name="controller" value="#{customerRecordData}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
						</c:if>

						<c:if test="#{aonConfiguration.bean.customer.showSegment}">
							<aon:panelTab id="segment"
								label="#{registryBundle.registry_segment_module}">
								<aon:div rendered="#{true}">
									<ui:include	src="/com/code/aon/ui/registry/facelet/rsegment/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerSegment}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
						</c:if>

						<c:if test="#{aonConfiguration.bean.customer.showAddInfo}">
							<aon:panelTab id="addInfo"
								label="#{registryBundle.registry_addInfo}">
								<aon:div rendered="#{true}">
									<ui:include	src="/com/code/aon/ui/registry/facelet/raddinfo/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerAddInfo}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
						</c:if>

						<c:if test="#{aonConfiguration.bean.customer.showDirStaff}">
							<aon:panelTab id="dirStaff"
								label="#{registryBundle.registry_dir_staff}">
								<aon:div rendered="#{true}">
									<ui:include	src="/com/code/aon/ui/registry/facelet/rdirstaff/tab_grid.xhtml">
										<ui:param name="controller" value="#{customerDirStaff}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
						</c:if>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		
		<c:if test="#{aonConfiguration.bean.customer.showFinanceData}">
			<aon:lookupButtonPopup lookup="#{bankLookup}" />
		</c:if>

		<c:if test="#{!customer.new}">
			<c:if test="#{aonConfiguration.bean.customer.showRelationship}">
				<aon:lookupButtonPopup lookup="#{registryLookup}" />
			</c:if>
			
			<c:if test="#{aonConfiguration.bean.customer.showFinanceFeeData}">
				<aon:lookupButtonPopup lookup="#{itemLookup}" />
			</c:if>
			
			<c:if test="#{aonConfiguration.bean.customer.showProjectData}">
				<ui:include src="/com/code/aon/ui/project/facelet/dossier/import.xhtml" />
			</c:if>
			<c:if test="#{aonConfiguration.bean.rmedia.showSendEmail}">
				<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
			</c:if>
		</c:if>
	</ui:define>
</ui:composition>
