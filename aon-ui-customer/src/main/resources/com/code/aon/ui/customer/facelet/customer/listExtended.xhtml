<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/customer/facelet/customer/listBasic.xhtml" />

	<aon:column alias="Customer.registry.alias"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_company_alias}" />
		</f:facet>
		<aon:outputText value="#{to.registry.alias}" />
	</aon:column>
	
	<aon:column alias="Customer.scope&lt;description"
		styleClass="aon-editDataTable-textColumn aon-width-130">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_scope}" />
		</f:facet>
		<aon:outputText value="#{to.scope.description}" />
	</aon:column>

	<aon:column alias="Customer.status"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status}" />
		</f:facet>
		<aon:outputText value="#{to.status}" />
	</aon:column>

</ui:composition>
