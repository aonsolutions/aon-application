<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="workGroupList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{appBundle.aon_users}" />
					<ui:param name="toolbarDescription" value="#{appBundle.aon_workgroups}" />					
					<ui:param name="controller" value="#{workGroup}" />
					
					<ui:define name="additionalToolbarContent">
						<aon:commandButton
							value="#{bundle.aon_back}" rendered="#{workGroup.to==null}"
							action="user" actionListener="#{user.onSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"/>					 
					</ui:define>				
				</ui:decorate>		
			
				<!--  aon-region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{workGroup}" />
						<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn aon-width-150" />
						<ui:define name="columns">
					
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{groupwareBundle.aon_workgroup_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}" rendered="#{to!=workGroup.to}" />
								<aon:inputText styleClass="aon-form-input-text " required="true"
									rendered="#{to==workGroup.to}" size="60"
									value="#{workGroup.to.description}" maxlength="45" />
								<f:facet name="footer">
									<aon:inputText styleClass="aon-form-input-text" required="true"
										rendered="#{workGroup.new}" size="60"
										value="#{workGroup.to.description}" maxlength="45" />
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{groupwareBundle.aon_workgroup_status}" />
								</f:facet>
								<aon:outputText value="#{to.status}" rendered="#{to!=workGroup.to}" />
								<aon:selectOneMenu rendered="#{to==workGroup.to}" value="#{workGroup.to.status}">
									<f:selectItems value="#{configCollections.workGroupStatuses}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="workGroupStatuses" rendered="#{workGroup.new}" value="#{workGroup.to.status}">
										<f:selectItems value="#{configCollections.workGroupStatuses}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
