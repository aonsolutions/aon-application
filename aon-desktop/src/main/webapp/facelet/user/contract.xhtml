<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition>
		
	<aon:form id="contractForm">

		<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
			cellpadding="0" cellspacing="0"
			columnClasses="aon-content-title,aon-content-toolbar">

			<aon:div styleClass="aon-content-title-internal">
				<aon:outputText value="#{appBundle.aon_accept_contract}" />
			</aon:div>

			<aon:div styleClass="aon-content-toolbar-internal">
				<aon:div styleClass="aon-content-toolbar-item-group">
				</aon:div>
			</aon:div>
		</aon:panelGrid>
		
		<aon:div styleClass="aon-scroll-area">
			<aon:div styleClass="aon-scroll-area-internal">

				<aon:panelGrid columns="1">
					<aon:panelGrid columns="1" dir="true" 
						cellpadding="0" cellspacing="0">

						<aon:inputTextarea id="Contract" readonly="true"
							styleClass="aon-inputText" cols="120" rows="25"
							value="#{appBundle.aon_contract_text}" />

						<aon:selectBooleanCheckbox id="AcceptContract" 
								value="#{currentUser.accepted}" partialSubmit="true">
							<aon:outputText value="#{appBundle.aon_accept_contract_check}"/>
						</aon:selectBooleanCheckbox>

						<aon:div style="text-align:right">
							<aon:commandButton id="sign" value="#{appBundle.aon_continue_contract}"
								actionListener="#{currentUser.sign}"
								action="home" disabled="#{!currentUser.accepted}"
								styleClass="aon-content-toolbar-item aon-icon-accept"
								onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
								onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"/>
						</aon:div>							
					</aon:panelGrid>
				</aon:panelGrid>

			</aon:div>
		</aon:div>

	</aon:form>

</ui:composition>

</body>
</html>
