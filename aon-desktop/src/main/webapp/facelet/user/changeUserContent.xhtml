<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
		
		<aon:form id="userForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_user_data}" />
				<ui:param name="toolbarDescription"	value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{bundle.aon_save}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{currentUser.accept}"
						accesskey="#{bundle.aon_key_save}" />
					<aon:commandButton id="back"
						title="#{bundle.aon_key_cancel_accelerator}"
						value="#{bundle.aon_back}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true" action="home"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:commandButton id="changePassword"
						value="#{appBundle.aon_change_password}"
						immediate="true"
						action="changepassword_form"
						styleClass="aon-finding-toolbar-item aon-icon-user-change-password" />						
				</ui:define>				
			</ui:decorate>				

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">

					<aon:outputLabel for="User_name" style="width:200px"
						value="#{bundle.aon_login_user}" />
					<aon:inputText id="User_name"
						required="true" size="80"
						maxlength="64" value="#{currentUser.name}" />

					<aon:outputLabel for="User_surname" style="width:200px"
						value="#{bundle.aon_name}" />
					<aon:inputText id="User_surname"
						required="true" size="80"
						maxlength="64" value="#{currentUser.surname}" />

					<aon:outputLabel for="User_email"
						value="#{configBundle.config_user_alternative_email}" />
					<aon:inputText id="User_email"
						size="64"
						maxlength="64" value="#{currentUser.alternativeEmail}" />

					<aon:outputLabel for="User_cellular"
						value="#{configBundle.config_user_mobile}" />
					<aon:inputText id="User_cellular"
						size="20"
						maxlength="16" value="#{currentUser.cellular}" />
				</aon:panelGrid>

			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
