<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-form-group" rendered="#{!user.new}">
		<aon:div styleClass="aon-form-group-title">
			<aon:outputLabel for="userWorkGroupDataList"
				value="#{configBundle.workgroup_workgroups}" />
		</aon:div>

		<aon:div styleClass="aon-form-group-body">
			<aon:editDataTable id="userWorkGroupDataList" var="to"
				value="#{userWorkGroup.model}" rows="20"
				styleClass="aon-editTable"
				columnClasses="aon-editTable-icon,
									aon-editTable-cell,
									aon-editTable-buttons">

				<aon:column>
					<aon:rowSelector multiple="false"
						toggleOnClick="#{userWorkGroup.to == null}"
						selectionListener="#{userWorkGroup.onSelect}" />
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:outputText value="&#160;" />
					<f:facet name="footer">
						<aon:div>
							<aon:commandButton alt="[#{bundle.aon_reset}]"
								styleClass="aon-editTable-button aon-icon-reset"
								actionListener="#{userWorkGroup.onReset}" value=""
								rendered="#{!userWorkGroup.new}"
								accesskey="#{bundle.aon_key_new_line}" />
						</aon:div>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{configBundle.workgroup_description}" />
					</f:facet>
					<aon:outputText value="#{to.workGroup.description}"
						rendered="#{to!=userWorkGroup.to}" />
					<aon:selectOneMenu rendered="#{to==userWorkGroup.to}"
						valueChangeListener="#{userWorkGroup.onWorkGroupChanged}"
						value="#{userWorkGroup.to.workGroup.id}">
						<f:selectItems value="#{configCollections.workgroups}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu rendered="#{userWorkGroup.new}"
							valueChangeListener="#{userWorkGroup.onWorkGroupChanged}"
							value="#{userWorkGroup.to.workGroup.id}">
							<f:selectItems value="#{configCollections.workgroups}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<aon:div>
						<f:verbatim rendered="#{to!=userWorkGroup.to}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{userWorkGroup.onAccept}"
							rendered="#{to==userWorkGroup.to}" value=""
							styleClass="aon-editTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{userWorkGroup.onCancel}"
							immediate="#{true}"
							styleClass="aon-editTable-button aon-icon-cancel" value=""
							rendered="#{to==userWorkGroup.to}"
							accesskey="#{bundle.aon_key_cancel_line}" />
						<aon:commandButton title="#{bundle.aon_remove}"
							actionListener="#{userWorkGroup.onRemove}"
							rendered="#{to==userWorkGroup.to}"
							styleClass="aon-editTable-button aon-icon-delete" value=""
							accesskey="#{bundle.aon_key_remove_line}" />
					</aon:div>
					<f:facet name="footer">
						<aon:div>
							<f:verbatim rendered="#{!userWorkGroup.new}">&#160;</f:verbatim>
							<aon:commandButton title="#{bundle.aon_save}"
								actionListener="#{userWorkGroup.onAccept}"
								rendered="#{userWorkGroup.new}" value=""
								styleClass="aon-editTable-button aon-icon-accept"
								accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{userWorkGroup.onCancel}"
								immediate="#{true}" rendered="#{userWorkGroup.new}"
								styleClass="aon-editTable-button aon-icon-cancel" value=""
								accesskey="#{bundle.aon_key_cancel_line}" />
						</aon:div>
					</f:facet>
				</aon:column>
			</aon:editDataTable>
		</aon:div>
	</aon:div>
</ui:composition>
