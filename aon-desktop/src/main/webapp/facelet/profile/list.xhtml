<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	
	<ui:define name="head">
	</ui:define>

	<ui:define name="content">
		
		<aon:form id="profileForm">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">

				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.aon_profiles}" />		
				</aon:div>

				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="profile_form" rendered="#{domain.currentTab == 0}"
							actionListener="#{domain.onResetProfile}" 
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"/>
						<aon:commandButton id="cancel"
							action="application_list"
							value="#{bundle.aon_cancel}" 
							styleClass="aon-content-toolbar-item aon-icon-cancel" immediate="#{true}"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"/>
					</aon:div>
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle">
						<aon:div styleClass="aon-content-subtitle-internal">
							<aon:outputText value="#{appBundle.aon_application}" />		
							<aon:outputText value=" : " />		
							<aon:outputText value="#{domain.da.id}" />		
						</aon:div>
					</aon:div>

					<ice:panelTabSet id="applicationTabSet"
							selectedIndex="#{domain.currentTab}" 
	                     	tabChangeListener="#{domain.processTabChange}">
						<ice:panelTab id="profiles" label="#{appBundle.aon_profiles}">
							<aon:dataTable id="profileDataList" 
								value="#{domain.profiles}" var="to" rows="30"
								styleClass="aon-dataTable">
	
								<aon:column>
									<aon:rowSelector selectionListener="#{domain.onSelectProfile}" />
									<f:facet name="header">
										<aon:outputText value="#{securityBundle.aon_security_profiles}"/>
									</f:facet>
									<aon:outputText value="#{to.id}"/>
								</aon:column>
	
							</aon:dataTable>
	                    </ice:panelTab>

						<ice:panelTab id="users" label="#{appBundle.aon_users}">
							<aon:dataTable id="usersDataList" 
								value="#{domain.users}" var="to" rows="30"
								styleClass="aon-dataTable">
	
								<aon:column>
									<aon:rowSelector selectionListener="#{domain.onSelectUser}" />
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_users}"/>
									</f:facet>
									<aon:outputText value="#{to.id}"/>
								</aon:column>
	
							</aon:dataTable>
	                    </ice:panelTab>
					</ice:panelTabSet>

				</aon:div>
			</aon:div>

		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
