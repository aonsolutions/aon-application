<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="head">
	</ui:define>

	<ui:define name="content">

		<aon:form id="profileForm">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">

				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.aon_profile}" />
				</aon:div>

				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							actionListener="#{domain.acceptUser}"
							action="profile_list"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							actionListener="#{domain.cancel}"
							immediate="true" 
							action="profile_list"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}" />
					</aon:div>
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle">
						<aon:div styleClass="aon-content-subtitle-internal">
							<aon:outputText
								value="#{user.new?(bundle.aon_reset):(bundle.aon_editing)}" />
						</aon:div>
					</aon:div>

					<aon:panelGrid columns="2">
						<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
							cellpadding="0" cellspacing="0"
							columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

							<aon:outputLabel for="userId"
								value="#{securityBundle.aon_security_user}"
								styleClass="aon-form-input-text-label" />
							<aon:inputText id="userId" disabled="#{true}"
								styleClass="aon-inputText" required="true" size="20"
								maxlength="16" value="#{domain.domainManager.relation.id}" />

							<aon:outputLabel for="profileData"
								value="#{securityBundle.aon_security_profiles}"
								styleClass="aon-form-input-text-label" />
							<aon:selectManyCheckbox id="profileData"
								value="#{domain.domainManager.relations}" layout="pageDirection"
								layoutWidth="5" styleClass="selectManyCheckbox">
								<f:selectItems value="#{domain.domainManager.availableProfiles}" />
							</aon:selectManyCheckbox>

						</aon:panelGrid>
					</aon:panelGrid>

				</aon:div>
			</aon:div>

		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
