<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="applicationList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_profiles}" />
				<ui:param name="toolbarDescription" value="#{appBundle.aon_applications}" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:methodParam name="rowSelectorAction" value="profile_list" />
				<aon:methodParam name="rowSelectorActionListener" value="#{currentDomain.onSelectApplication}" type="actionListener" />
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="rows" value="20" />
					<ui:param name="dataTableId" value="applicationDataList" />
					<ui:param name="dataModel" value="#{currentDomain.applications}" />
					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_application}" />
							</f:facet>
							<aon:outputText value="#{to.id}"/>
						</aon:column>
					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
