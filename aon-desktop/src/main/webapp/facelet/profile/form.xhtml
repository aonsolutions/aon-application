<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="profileForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_profiles}" />
				<ui:param name="toolbarDescription" value="#{appBundle.aon_application} : #{domain.da.id} / #{appBundle.aon_profile} : #{domain.newProfile?(bundle.aon_reset):(bundle.aon_editing)}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{bundle.aon_save}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{domain.acceptProfile}"
						accesskey="#{bundle.aon_key_save}"
						rendered="#{!domain.selectedSystemProfile}" reRender="aonToolbar" />
					<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
						rendered="#{(!domain.newProfile) and (!domain.selectedSystemProfile)}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{domain.removeProfile}"
						confirmAction="profile_list"/>
					<aon:commandButton id="back" value="#{bundle.aon_back}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						actionListener="#{domain.cancel}"
						action="profile_list"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="profileId"
						value="#{appBundle.aon_profile}" />
					<aon:inputText id="profileId" disabled="#{!domain.newProfile}"
						required="true" size="20"
						maxlength="16" value="#{domain.domainManager.relation.id}" />

					<aon:outputLabel for="profileData"
						value="#{securityBundle.aon_security_roles}" />
					<aon:selectManyCheckbox id="profileData" disabled="#{domain.selectedSystemProfile}"
						value="#{domain.domainManager.relations}" layout="pageDirection" required="true"
						layoutWidth="5">
						<f:selectItems value="#{domain.domainManager.availableRoles}" />
					</aon:selectManyCheckbox>

				</aon:panelGrid>

			</aon:div>

		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
