<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition>
	<aon:div id="aon-header" styleClass="aon-desktop-header">
		<aon:div styleClass="aon-connection-status"><aon:outputConnectionStatus styleClass="aon-connection-control"/></aon:div>
		<aon:panelGrid columns="2" cellpadding="0" cellspacing="0" width="100%" dir="true">
			<aon:panelGroup>
				<aon:div styleClass="aon-logo">
					<h:graphicImage url="#{aonConfiguration.applicationLogoContextRelativePath}"/>
				</aon:div>
				<aon:div styleClass="aon-applicationName">
					<aon:outputText value="#{appBundle.aon_application_title}" />
				</aon:div>
			</aon:panelGroup>

			<aon:panelGroup>
				<aon:panelGrid columns="2" cellpadding="0" cellspacing="0" width="100%">
					<aon:panelGroup rendered="#{aonConfiguration.properties.middleHeader == null}">
						<aon:div styleClass="aon-header-userAdOnLeft">
							<aon:outputText value="&#160;"/>
						</aon:div>
					</aon:panelGroup>

					<aon:panelGroup
						rendered="#{aonConfiguration.properties.middleHeader != null}">
						<aon:div styleClass="aon-header-userAdOnLeft">
							<aon:outputText escape="false" value="#{aonConfiguration.properties.middleHeader}" />
						</aon:div>
					</aon:panelGroup>
					<aon:div style="text-align:right;">
						<aon:form>
						<aon:div styleClass="aon-desktop-header-tab">
							<aon:panelGrid columns="4" cellpadding="5" cellspacing="0">
								<aon:div style="white-space:nowrap;padding:1px 0.5em"><aon:outputText value="#{desktop.companyName}" /></aon:div>
								<aon:div style="white-space:nowrap;padding:1px 0em"><aon:outputText value="/" /></aon:div>
								<aon:div style="white-space:nowrap;border-left:#CCC 1px solid;border-top:#CCC 1px solid;border-right:#808080 1px solid;border-bottom:#808080 1px solid;padding:1px 0.5em">
									<aon:div style="display:inline;white-space:nowrap;">
										<aon:commandLink actionListener="#{currentUser.onLoadCurrentUser}" action="user_changepassword_form">
											<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-user.png" style="border:0px;height:11px"/>
										</aon:commandLink>
										<aon:commandLink actionListener="#{currentUser.onLoadCurrentUser}" action="user_changepassword_form">
											<aon:outputText value="#{desktop.loggedUserName}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:div>
						</aon:form>
					</aon:div>
				</aon:panelGrid>
			</aon:panelGroup>
		</aon:panelGrid>

		<aon:div styleClass="aon-header-bar">
			<aon:panelGrid columns="2" cellpadding="2" cellspacing="0" width="100%">
				<aon:div style="padding-left:1em;font-size:0.9em;color:#fff;">
					<aon:outputText value="#{desktop.currentDate}" style="color:#fff;"/>
				</aon:div>
				<aon:div style="text-align:right">
					<ice:outputLink style="text-align:right;padding-right:1em;font-size:0.9em;font-weight:bold;" 
						onclick="parent.window.close();" target="_top">
						<aon:outputText value="#{appBundle.aon_application_close}" style="color:#fff;"/>
					</ice:outputLink>
				</aon:div>
			</aon:panelGrid>
		</aon:div>
	</aon:div>
</ui:composition>

</body>
</html>
