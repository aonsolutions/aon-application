<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>
	<aon:form >
		<aon:div styleClass="aon-sidebarIcons-bottom">

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink action="home">
					<aon:graphicImage height="32" width="32"
						url="#{aonResource.resolveLocal['/images/aon-icon-big-home.png']}" />
					<aon:div><aon:outputText value="#{bundle.aon_home}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon" rendered="#{email.sidebarEnabled and email.mailActive}">
				<aon:outputLink value="/aon-webmail?aonDesktop=true" target="aonWebMail">
					<aon:graphicImage height="32" width="32"
						url="#{aonResource.resolveLocal['/images/aon-icon-big-correo.png']}" />
					<aon:div><aon:outputText value="#{appBundle.aon_webmail}" /></aon:div>
				</aon:outputLink>
			</aon:div>
			
			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink actionListener="#{notice.onSearch}" action="notice">
					<aon:graphicImage height="32" width="32"
						url="#{aonResource.resolveLocal['/images/aon-icon-big-avisos.png']}" />
					<aon:div><aon:outputText value="#{groupwareBundle.aon_alarms}" /></aon:div>
				</aon:commandLink>
			</aon:div>
			
			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink actionListener="#{note.onSearch}" action="note">
					<aon:graphicImage height="32" width="32"
						url="#{aonResource.resolveLocal['/images/aon-icon-big-notas.png']}" />
					<aon:div><aon:outputText value="#{groupwareBundle.aon_notes}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink rendered="#{currentUser.contactsEnabled}"
					actionListener="#{contact.onSearch}" action="contact_list">
					<aon:graphicImage height="32" width="32"
						url="#{aonResource.resolveLocal['/images/aon-icon-big-contactos.png']}" />
					<aon:div><aon:outputText value="#{webmailBundle.webmail_contacts}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon">
				<aon:commandLink actionListener="#{favorite.onSearch}" action="favorite">
					<aon:graphicImage height="32" width="32"
						url="#{aonResource.resolveLocal['/images/aon-icon-big-favoritos.png']}" />
					<aon:div><aon:outputText value="#{groupwareBundle.aon_favorites}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon" rendered="#{smsManager.sidebarEnabled}">
				<aon:commandLink actionListener="#{sms.reset}" action="sms">
					<aon:graphicImage height="32" width="32" 
						url="#{aonResource.resolveLocal['/images/aon-icon-big-sms.png']}" />
					<aon:div><aon:outputText value="#{smsBundle.sms_module}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon" renderedOnUserRole="DocumentsVisible">
				<aon:commandLink action="corporateIdentityAttach_list" actionListener="#{company.onLoad}">
					<aon:graphicImage height="32" width="32"
						url="#{aonResource.resolveLocal['/images/aon-icon-big-identity.gif']}" />
					<aon:div><aon:outputText value="#{appBundle.aon_corporate_identity}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon" renderedOnUserRole="Manager">
				<aon:commandLink actionListener="#{user.onSearch}" action="user">
					<aon:graphicImage height="32" width="32"
						url="#{aonResource.resolveLocal['/images/aon-icon-big-users.png']}" />
					<aon:div><aon:outputText value="#{appBundle.aon_users}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<aon:div styleClass="aon-sidebarIcons-icon" renderedOnUserRole="Manager">
				<aon:commandLink actionListener="#{currentDomain.onLoadCurrentDomain}" action="application_list">
					<aon:graphicImage height="32" width="32"
						url="#{aonResource.resolveLocal['/images/aon-icon-big-ambito.png']}" />
					<aon:div><aon:outputText value="#{appBundle.aon_profiles}" /></aon:div>
				</aon:commandLink>
			</aon:div>

			<c:if test="#{currentDomain.domainManagement}">
				<aon:div styleClass="aon-sidebarIcons-icon" renderedOnUserRole="Manager">
					<aon:commandLink actionListener="#{domain.onSearch}" action="domain_list">
						<aon:graphicImage height="32" width="32"
							url="#{aonResource.resolveLocal['/images/aon-icon-big-employee-group.png']}" />
						<aon:div><aon:outputText value="#{appBundle.aon_domains}" /></aon:div>
					</aon:commandLink>
				</aon:div>
			</c:if>
			
			<aon:div styleClass="aon-sidebarIcons-icon" renderedOnUserRole="Manager">
				<aon:commandLink action="company" actionListener="#{company.onLoad}">
					<aon:graphicImage height="32" width="32"
						url="#{aonResource.resolveLocal['/images/aon-icon-big-enterprise-configure.png']}" />
					<aon:div><aon:outputText value="#{companyBundle.company_data_module}"/></aon:div>
					<f:setPropertyActionListener value="#{false}" target="#{company.showRegistryBank}" />
					<f:setPropertyActionListener value="#{false}" target="#{company.showCompanyOtherData}" />
				</aon:commandLink>
			</aon:div>
			
		</aon:div>
	</aon:form>
</ui:composition>

</body>
</html>
