<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	>
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="faxForm" enctype="multipart/form-data">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_desktop_fax}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_editing}" />
					</aon:div> 

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="sendFAX"
							value="#{appBundle.aon_messaging_send}"
							styleClass="aon-icon-accept aon-finding-toolbar-item"
							actionListener="#{fax.send}"
							onclick="Richfaces.showModalPanel('waitProccess')" 
		     				oncomplete="Richfaces.hideModalPanel('waitProccess')"
							 />						
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2"  style="border:0;width:auto;"
						columnClasses="aon-vertical-align-top, aon-vertical-align-top">
					<aon:div id="faxSender" >
						<aon:panelGrid columns="2">
							<aon:outputLabel for="FAX_recipient" value="#{appBundle.aon_messaging_recipient}" />
								<aon:panelGrid columns="3" styleClass="aon-panelGrid-formatting" style="width:auto;" >
									<aon:outputLabel value="#{appBundle.aon_messaging_calling_code}: " />
									<aon:selectOneMenu value="#{fax.zone}" 
											styleClass="aon-form-selectOneMenu-field">
										<f:selectItems value="#{fax.zones}" />
									 	<a4j:support event="onchange" reRender="countrycodes" />
									</aon:selectOneMenu>
<!-- 
									<rich:comboBox id="countrycodes" value="#{fax.countrycode}"
											selectFirstOnUpdate="false" styleClass="aon-form-selectOneMenu-field" >
										<f:selectItems value="#{fax.countrycodes}" />
									</rich:comboBox>
 -->
									<aon:selectOneMenu id="countrycodes" value="#{fax.countrycode}" 
											styleClass="aon-form-selectOneMenu-field">
										<f:selectItems value="#{fax.countrycodes}" />
									</aon:selectOneMenu>

									<aon:outputLabel value="#{groupwareBundle.contact_phone}: " />
									<aon:inputText id="FAX_recipient" maxlength="9" size="9" 
											value="#{fax.recipientsTo}" >
										<f:validateLength maximum="9" />
										<f:validateLongRange maximum="999999999" />
									</aon:inputText>
								</aon:panelGrid>
							<aon:div>
								<aon:outputLabel for="FAX_Subject"  value="#{groupwareBundle.note_subject}: " />
							</aon:div>										
							<aon:inputText id="FAX_Subject" size="85" value="#{fax.subject}"/>			

							<aon:outputLabel for="attach_file" value="#{appBundle.aon_messaging_document}: " />
							<aon:div id="attachDiv" >
								<rich:fileUpload id="attach_file" disabled="#{!fax.enabled}"
									addControlLabel="#{appBundle.aon_fileUpload_add}" 
									stopControlLabel="#{appBundle.aon_fileUpload_stop}" 
									stopEntryControlLabel="#{appBundle.aon_fileUpload_stop}"
									uploadControlLabel="#{appBundle.aon_fileUpload_upload}"
									fileUploadListener="#{fax.fileUploaded}"
									listHeight="0px" listWidth="90%"
									immediateUpload="true" autoclear="true"
									onupload="startUpload();" onuploadcanceled="endUpload();" onerror="endUpload();">
									<f:facet name="label">
										<h:outputText value="#{appBundle.aon_fileUpload_upload_label}" />
									</f:facet>								
									<a4j:support event="onuploadcomplete" oncomplete="endUpload();" reRender="attachDataTable" />
								</rich:fileUpload>	
								<aon:div id="attachDataTable">
									<aon:dataTable  
										value="#{fax.files}" 
										var="attachment" style="width: 90%;background:transparent;border:0;">
											<aon:column style="background:transparent;border:0;">
												<aon:outputText value="#{attachment.fileName}" styleClass="aon-bold" />
												<aon:commandLink
													reRender="attachDiv" style="font-size:0.9em;margin-left:20px;"
													value="#{appBundle.aon_fileUpload_remove}"
													styleClass="aon-icon-commandButton aon-icon-delete"
													actionListener="#{attachment.fileDeleted}">
												</aon:commandLink>
											</aon:column>
									</aon:dataTable>									
								</aon:div>		
							</aon:div>

							<aon:outputLabel for="FAX_message" value="#{appBundle.aon_messaging_cover}" />
							<aon:div>
								<aon:div>
									<aon:selectBooleanCheckbox value="#{fax.allowCover}" >
									 	<a4j:support event="onclick" reRender="FAX_message" />
									</aon:selectBooleanCheckbox>
									<aon:outputText value="#{appBundle.aon_messaging_edit_cover}" />
								</aon:div>
								<aon:div id="FAX_message">
									<aon:inputTextarea rendered="#{fax.allowCover}" value="#{fax.content}" 
										cols="80" rows="20"/>
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:div>
				</aon:panelGrid>
			</aon:div>
   		</aon:form>
		<ui:include src="/facelet/messaging/fax/waitProcess.xhtml" />
	</ui:define>
</ui:composition>

</body>
</html>
