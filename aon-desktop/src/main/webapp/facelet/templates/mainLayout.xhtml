<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:c="http://java.sun.com/jstl/core"			
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
<f:view>

<head>
	<title><ui:insert name="title">Title</ui:insert></title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="Expires" content="0" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Cache-Control" content="no-store" />
	<c:forEach items="#{aonConfiguration.styleSheets}" var="styleSheet">
		<a4j:loadStyle src="#{styleSheet}"/>
	</c:forEach>

	<!-- Necesario si se pone el LoadScriptStrategy a ALL -->
	<a4j:loadScript src="#{aonResource.resolve['/com/code/aon/faces/component/richfaces/rowSelector/rowSelector.js']}"/>

	<a4j:loadScript src="#{aonResource.resolveLocal['/js/richFaces.js']}"/>
	<a4j:loadScript src="#{aonResource.resolveLocal['/js/sms.js']}"/>
	<link rel="shortcut icon" type="image/x-icon" href="#{facesContext.externalContext.requestContextPath}/#{aonResource.resolve['/images/favicon.ico']}" />
	<ui:insert name="head" />
</head>
<body>
	<aon:div id="aon-content">			
		<ui:insert name="mainHeader" />		
		<ui:insert name="mainContent" />
	</aon:div>
</body>
</f:view>
</html>
