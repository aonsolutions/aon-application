<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="identityForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_corporate_identity}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{corporateIdentity.identityReport.company.fullName}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandLink id="export2pdf_fax" value="PDF" title="PDF"
							styleClass="aon-finding-toolbar-item aon-icon-pdf"
							action="#{report.onExecute}" target="_blank">
							<f:param name="reportKey" value="fax_to" />
						</h:commandLink>
						<aon:commandButton id="remove" value="#{bundle.aon_clear}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							actionListener="#{corporateIdentity.onClear}" 
							action="corporate_identity_fax"
							immediate="true" accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_back}"
							action="corporate_identity"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="true"
							accesskey="#{bundle.aon_key_cancel}" /> 
					</aon:div>

				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="4" dir="true">

					<aon:outputLabel for="fax_to"
						value="#{appBundle.aon_corporate_identity_to}" />
					<aon:inputText id="fax_to" 
						size="50" 
						value="#{corporateIdentity.identityReport.fax_to}" />
	
					<aon:outputLabel for="fax_from"
						value="#{appBundle.aon_corporate_identity_from}" />
					<aon:inputText id="fax_from" 
						size="50" 
						value="#{corporateIdentity.identityReport.fax_from}" />

					<aon:outputLabel for="fax_number"
						value="#{appBundle.aon_corporate_identity_fax_number}" />
					<aon:inputText id="fax_number" 
						size="50" 
						value="#{corporateIdentity.identityReport.fax_number}" />
	
					<aon:outputLabel for="fax_page_number"
						value="#{appBundle.aon_corporate_identity_fax_page_number}" />
					<aon:inputText id="fax_page_number" 
						size="5" 
						value="#{corporateIdentity.identityReport.fax_page_number}" />

					<aon:outputLabel for="fax_phone_number"
						value="#{appBundle.aon_corporate_identity_fax_phone_number}" />
					<aon:inputText id="fax_phone_number" 
						size="50" 
						value="#{corporateIdentity.identityReport.fax_phone_number}" />
	
				</aon:panelGrid>
				<aon:div styleClass="aon-scroll-area">
				</aon:div>
				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="fax_subject"
						value="#{appBundle.aon_corporate_identity_subject}" />
					<aon:inputText id="fax_subject" 
						size="120" 
						value="#{corporateIdentity.identityReport.fax_subject}" />
		
					<aon:outputLabel for="fax_content"
						value="#{appBundle.aon_corporate_identity_content}" />
					<aon:inputTextarea id="letter_content"
						value="#{corporateIdentity.identityReport.fax_content}"
						cols="120" rows="25"/>
						
				</aon:panelGrid>
			</aon:div>
	
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
