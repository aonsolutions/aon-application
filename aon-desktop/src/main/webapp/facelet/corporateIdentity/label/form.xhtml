<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="identityForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_corporate_identity}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{corporateIdentity.identityReport.company.fullName}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="cancel" value="#{bundle.aon_back}"
							action="corporate_identity"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="true"
							accesskey="#{bundle.aon_key_cancel}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:panelGrid columns="3" styleClass="aon-panelGrid-formatting"
				columnClasses="aon-portlets-column1,aon-portlets-column1,aon-portlets-column1">

				<aon:div styleClass="aon-portlet">
					<aon:div styleClass="aon-portlet-title">
						<aon:outputText value="#{appBundle.aon_corporate_identity_label}" styleClass="aon-portlet-title-text"/>
					</aon:div>
					<aon:div styleClass="aon-portlet-body">
						<h:commandLink id="export2pdf_label" value="PDF"
								title=""
								styleClass="aon-finding-toolbar-item aon-icon-pdf"
								action="#{report.onExecute}"  
								target="_blank">
							<f:param name="reportKey" value="label_to" />
						</h:commandLink>
						<h:graphicImage url="#{aonResource.resolveLocal['/images/aon-icon-big-etiquetas.png']}" />
					</aon:div>
				</aon:div>
	
			</aon:panelGrid>

		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
