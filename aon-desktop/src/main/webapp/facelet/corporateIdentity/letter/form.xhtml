<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="identityForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_corporate_identity}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{corporateIdentity.identityReport.company.fullName}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandLink id="export2pdf_letter" value="PDF" title="PDF"
							styleClass="aon-finding-toolbar-item aon-icon-pdf"
								action="#{report.onExecute}" target="_blank">
							<f:param name="reportKey" value="letter_to" />
						</h:commandLink>
						<aon:commandButton id="remove" value="#{bundle.aon_clear}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							actionListener="#{corporateIdentity.onClear}" 
							action="corporate_identity_letter"
							immediate="true" accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_back}"
							action="corporate_identity"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="true"
							accesskey="#{bundle.aon_key_cancel}" /> 
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
	
				<aon:panelGrid columns="2" dir="true">
	
					<aon:outputLabel for="letter_date"
						value="#{appBundle.aon_corporate_identity_date}" />
					<aon:inputText id="letter_date" size="120" 
						value="#{corporateIdentity.identityReport.letter_date}" />
	
					<aon:outputLabel for="letter_salutation"
						value="#{appBundle.aon_corporate_identity_salutation}" />
					<aon:inputText id="letter_salutation" size="120" 
						value="#{corporateIdentity.identityReport.letter_salutation}" />
	
					<aon:outputLabel for="letter_content"
						value="#{appBundle.aon_corporate_identity_content}" />
					<aon:inputTextarea id="letter_content"
						value="#{corporateIdentity.identityReport.letter_content}"
						cols="120" rows="25"/>
	
					<aon:outputLabel for="letter_goodbye"
						value="#{appBundle.aon_corporate_identity_goodbye}" />
					<aon:inputText id="letter_goodbye" size="120" 
						value="#{corporateIdentity.identityReport.letter_goodbye}" />
	
					<aon:outputLabel for="letter_signature"
						value="#{appBundle.aon_corporate_identity_signature}" />
					<aon:inputTextarea id="letter_signature"
						value="#{corporateIdentity.identityReport.letter_signature}"
						cols="120" rows="3"/>

					<aon:outputLabel for="letter_registry_data"
						value="#{appBundle.aon_corporate_identity_registry_data}" />
					<aon:selectBooleanCheckbox id="letter_registry_data" 
							value="#{corporateIdentity.identityReport.printRegistryData}">
					</aon:selectBooleanCheckbox>

				</aon:panelGrid>
			</aon:div>


		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
