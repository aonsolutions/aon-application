<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"

	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="contactForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_domains}" />
				<ui:param name="controller" value="#{domain}" />
				<ui:param name="saveOnClick" value="Richfaces.showModalPanel('waitProccess')" />
				<ui:param name="saveOnComplete" value="Richfaces.hideModalPanel('waitProccess')" />
				<ui:param name="removeOnClick" value="Richfaces.showModalPanel('waitProccess')" />
				<ui:param name="removeOnComplete" value="Richfaces.hideModalPanel('waitProccess')" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="Domain_commonName"
						value="#{bundle.aon_name}" />
					<c:if test="#{domain.new}" >
						<aon:div>
							<aon:inputText id="Domain_commonName" validator="#{domain.domainNameCheck}"
								size="14" maxlength="11" required="true" disabled="#{!domain.new}"
								value="#{domain.to.commonName}" />
							<aon:outputText value="."  styleClass="aon-bold aon-margin-left aon-margin-right" />
							<aon:inputText id="Domain_suffix" 
								size="20" disabled="true" value="#{domain.domainSuffix}" />
						</aon:div>
					</c:if>
					<c:if test="#{!domain.new}" >
						<aon:inputText id="Domain_commonName" validator="#{domain.domainNameCheck}"
							size="60" disabled="true" value="#{domain.to.commonName}" />
					</c:if>

					<aon:outputLabel for="Domain_organizationName"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Domain_organizationName" required="true"
						size="95" value="#{domain.to.organizationName}" />

					<aon:outputLabel for="Domain_mail"
						value="#{webmailBundle.webmail_contact_email}" />
					<aon:inputText id="Domain_mail" size="60" maxlength="256"
						value="#{domain.to.mail}" />

					<aon:outputLabel for="Domain_mobile"
						value="#{webmailBundle.webmail_contact_cellular_phone}" />
					<aon:inputText id="Domain_mobile" size="40"
						value="#{domain.to.mobile}" />

					<!-- 
					<aon:outputLabel for="Domain_host"
						value="#{appBundle.desktop_domain_host}" />
					<aon:inputText id="Domain_host" size="40" maxlength="256"
						value="#{domain.to.host}" />

					<aon:outputLabel for="Domain_status"
						value="#{bundle.aon_status}" />
					<aon:inputText id="Domain_status" size="5"
						disabled="true" value="#{domain.to.status}" />

					<aon:outputLabel for="Domain_dnsManagement"
						value="#{appBundle.desktop_domain_dnsManagement}" />
	                <aon:selectBooleanCheckbox id="Domain_dnsManagement"
						disabled="true" value="#{domain.to.dnsManagement}"/>

					<aon:outputLabel for="Domain_userManagement"
						value="#{appBundle.desktop_domain_userManagement}" />
	                <aon:selectBooleanCheckbox id="Domain_userManagement"
						disabled="true" value="#{domain.to.userManagement}"/>

					<aon:outputLabel for="Domain_domainManagement"
						value="#{appBundle.desktop_domain_domainManagement}" />

						disabled="true" value="#{domain.to.domainManagement}"/>

			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
