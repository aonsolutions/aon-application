<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="domainList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_domains}" />
				<ui:param name="controller" value="#{domain}" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable id="domainDataList" value="#{domain.model}"
					var="to" rows="20" rendered="#{domain.model.rowCount > 0}">

					<aon:rowSelector action="domain_form" actionListener="#{domain.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.commonName}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.organizationName}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{webmailBundle.webmail_contact_email}" />
						</f:facet>
						<aon:outputText value="#{to.mail}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{webmailBundle.webmail_contact_cellular_phone}" />
						</f:facet>
						<aon:outputText value="#{to.mobile}"/>
					</aon:column>

				</aon:dataTable>

				<aon:dataScroller2 for="domainDataList" showNote="true" />

			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>
