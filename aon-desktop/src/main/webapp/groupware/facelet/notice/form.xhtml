<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="noticeForm">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">

				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{groupwareBundle.aon_notice}" />
				</aon:div>

				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{notice.to!=null or notice.new}"
							actionListener="#{notice.accept}"
							action="notice_list"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{notice.to!=null or notice.new}"
							actionListener="#{notice.cancel}"
							action="notice_list"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!notice.new}"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{notice.onRemove}"
							confirmAction="notice_list"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}" />
					 </aon:div>
					 <!--  
					 <aon:div styleClass="aon-content-toolbar-item-group">
					 
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="notice_search"
							actionListener="#{notice.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-icon-search"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-search'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-search aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="notice_form"
							rendered="#{!notice.new}"
							actionListener="#{notice.onReset}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>-->
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-scroll-area">


					<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle">
						<aon:div styleClass="aon-content-subtitle-internal">
							<aon:outputText
								value="#{notice.new?(bundle.aon_reset):(bundle.aon_editing)}" />
						</aon:div>
					</aon:div>


						<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
							cellpadding="0" cellspacing="0"
							columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

							<aon:outputLabel for="Notice_date"
								rendered="#{!notice.new}" 
								value="#{groupwareBundle.aon_date}" />
							<aon:outputText id="Notice_date" value="#{notice.to.date}"
								rendered="#{!notice.new}" styleClass="aon-text-disabled">
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>

							<aon:outputLabel for="Notice_workGroup_id"
								value="#{groupwareBundle.notice_work_group}" />
							<aon:selectOneMenu id="Notice_workGroup_id"
								value="#{notice.to.workGroup.id}" 
								partialSubmit="true"
								valueChangeListener="#{notice.workGroupChange}">
								<f:selectItems value="#{configCollections.workgroups}" />
							</aon:selectOneMenu>

							<aon:outputLabel for="Notice_recipient_id" 
								value="#{groupwareBundle.notice_recipient}" />
							<aon:selectOneMenu id="Notice_recipient_id"
								value="#{notice.to.recipient.id}">
								<f:selectItems value="#{notice.users}" />
							</aon:selectOneMenu>

							<aon:outputLabel for="Notice_source"
								value="#{groupwareBundle.notice_source}" />
							<aon:inputText id="Notice_source"
								maxlength="64" size="100"
								value="#{notice.to.source}" />

							<aon:outputLabel for="Notice_company"
								value="#{groupwareBundle.notice_company}" />
							<aon:inputText id="Notice_company"
								maxlength="64" size="100"
								value="#{notice.to.company}" />

							<aon:outputLabel for="Notice_phone"
								value="#{groupwareBundle.notice_phone}" />
							<aon:inputText id="Notice_phone"
								maxlength="16" size="20"
								value="#{notice.to.phone}" />
								
							<aon:outputLabel for="Notice_status" 
								value="#{groupwareBundle.notice_status}" />
							<aon:selectOneMenu id="Notice_status"
								value="#{notice.to.status}">
								<f:selectItems value="#{groupWareCollections.noticeStatuses}" />
							</aon:selectOneMenu>
							
							<aon:outputLabel for="Notice_type" 
								value="#{groupwareBundle.notice_type}" />
							<aon:selectOneMenu id="Notice_type"
								value="#{notice.to.type}">
								<f:selectItems value="#{groupWareCollections.noticeTypes}" />
							</aon:selectOneMenu>

							<aon:outputLabel for="Notice_priority" 
								value="#{groupwareBundle.notice_priority}" />
							<aon:selectOneMenu id="Notice_priority"
								value="#{notice.to.priority}">
								<f:selectItems value="#{groupWareCollections.priorities}" />
							</aon:selectOneMenu>

							<aon:outputLabel for="Notice_subject"
								value="#{groupwareBundle.notice_subject}" />
							<aon:inputTextarea id="Notice_subject"
								value="#{notice.to.subject}" cols="100" rows="7" />	

						</aon:panelGrid>
					
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
