<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="favoriteList">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{groupwareBundle.aon_favorite}" />
				</aon:div>

				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="favorite_form"
							actionListener="#{favorite.onReset}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
						
						<aon:commandButton id="favorite_category" value="#{groupwareBundle.aon_favorite_category}"
							immediate="true" action="favorite_category"
							styleClass="aon-content-toolbar-item aon-icon-category"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-category'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-category aon-content-toolbar-item-hover'"/>
							
							<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="favorite_search"
							actionListener="#{favorite.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-icon-search"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-search'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-search aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}" />
					</aon:div>
				</aon:div>
				<!-- end toolbar navigation -->
			</aon:panelGrid>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:dataTable id="favoriteDataList"
						value="#{favorite.model}" var="to" rows="20"
						rendered="#{favorite.model.rowCount > 0}"
						styleClass="aon-dataTable">

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.favorite_favorite_category}" />
							</f:facet>
							<aon:outputText value="#{to.favoriteCategory.description}"/>
						</aon:column>

						<aon:column>
							<aon:rowSelector selectionListener="#{favorite.onSelect}"/>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.favorite_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}"/>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.favorite_url}" />
							</f:facet>
							<aon:outputText value="#{to.url}"/>
						</aon:column>

						<aon:column style="text-align:center">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:commandLink actionListener="#{favorite.onSelectUrl}" onclick="window.open('#{to.url}');">
								<aon:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-file-entrance.png" style="border:0px;margin:2px;" alt="Abrir URL"/>
							</aon:commandLink>
						</aon:column>

					</aon:dataTable>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="favoriteDataList" />
						<ui:param name="model" value="#{favorite.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</aon:div>
			</aon:div>

		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
