<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="favoriteCategoryList">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
				<aon:div styleClass="aon-content-title-internal">				
					<aon:outputText value="#{groupwareBundle.aon_favorite}" />			
				</aon:div>
			
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{favoriteCategory.onReset}" rendered="#{!favoriteCategory.new}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="save"
							value="#{bundle.aon_save}"
							actionListener="#{favoriteCategory.onAccept}" 
							rendered="#{favoriteCategory.to!=null or favoriteCategory.new}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
					
						<aon:confirmButton id="cancel"
							value="#{bundle.aon_cancel}" rendered="#{favoriteCategory.to!=null or favoriteCategory.new}"
							styleClass="aon-content-toolbar-item aon-icon-cancel" immediate="#{true}"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{favoriteCategory.onCancel}"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{favoriteCategory.to!=null and !favoriteCategory.new}"
							styleClass="aon-content-toolbar-item aon-icon-delete" immediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{favoriteCategory.onRemove}"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="favorite_list" value="#{bundle.aon_cancel}" rendered="#{favoriteCategory.to==null}"
							immediate="true" action="favorite"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"/>
							 
					</aon:div>
				</aon:div>
			</aon:panelGrid>
			<!-- end toolbar navigation -->

			<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
					<aon:div styleClass="aon-content-subTitle">	
						<aon:outputText value="#{groupwareBundle.aon_favorite_category}" />		
					</aon:div>
					
					<aon:editDataTable id="favoriteCategoryData" var="to" rows="0"
						rendered="#{favoriteCategory.model.rowCount > 0 or favoriteCategory.new}" 
						value="#{favoriteCategory.model}"
						columnClasses="aon-editTable-icon,
							aon-editTable-cell,
							aon-editTable-buttons">

						<aon:column>
							<aon:rowSelector multiple="false"
								toggleOnClick="#{favoriteCategory.to == null}"
								selectionListener="#{favoriteCategory.onSelect}" />
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editTable-button aon-icon-reset"
										actionListener="#{favoriteCategory.onReset}" value=""
										rendered="#{!favoriteCategory.new}">
									</aon:commandButton>
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.favorite_category_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{to!=favoriteCategory.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==favoriteCategory.to}" size="100"
								value="#{favoriteCategory.to.description}" maxlength="64" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{favoriteCategory.new}" size="100"
									value="#{favoriteCategory.to.description}" maxlength="64" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=favoriteCategory.to}">&#160;</f:verbatim>
								<aon:commandButton 
									actionListener="#{favoriteCategory.onAccept}" 
									rendered="#{to==favoriteCategory.to}"
									alt="[#{bundle.aon_accept}]"
									styleClass="aon-editTable-button aon-icon-accept" />
								<aon:confirmButton alt="[#{bundle.aon_cancel}]"
									styleClass="aon-editTable-button aon-icon-cancel"
									rendered="#{to==favoriteCategory.to}"
									confirmTitle="Confirmation Dialog" 
									confirmMessage="#{bundle.aon_cancel_confirm}"
									confirmActionListener="#{favoriteCategory.onCancel}" immediate="true"/>
								<aon:confirmButton alt="[#{bundle.aon_remove}]"
									styleClass="aon-editTable-button aon-icon-delete"
									rendered="#{to==favoriteCategory.to}"
									confirmTitle="Confirmation Dialog" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{favoriteCategory.onRemove}" immediate="true"/>
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!favoriteCategory.new}">&#160;</f:verbatim>
									<aon:commandButton 
										actionListener="#{favoriteCategory.onAccept}" 
										rendered="#{favoriteCategory.new}"
										alt="[#{bundle.aon_accept}]"
										styleClass="aon-editTable-button aon-icon-accept" />
									<aon:confirmButton alt="[#{bundle.aon_cancel}]"
										styleClass="aon-editTable-button aon-icon-cancel"
										rendered="#{favoriteCategory.new}"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{favoriteCategory.onCancel}" immediate="true"/>
								</aon:div>
							</f:facet>
						</aon:column>
					</aon:editDataTable>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="favoriteCategoryData" />
						<ui:param name="model" value="#{favoriteCategory.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
