<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">

	<ui:define name="configContent">

		<aon:form id="sessionList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.audit_sessions_module}" />
				<ui:param name="controller" value="#{auditSession}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:define name="additionalToolbarContent" >
					<aon:commandButton id="optionMoreUsed"
						value="#{bundle.audit_more_used_module}"
						action="auditSession_moreUsed"
						actionListener="#{sessionMoreUsed.onInit}"
						styleClass="aon-finding-toolbar-item aon-icon-search" />
					<aon:htmlCommandLink id="toExcel" 
						value="Exportar" 
						target="_new" 
						actionListener="#{auditSession.onExcel}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
					</aon:htmlCommandLink>
					<aon:if test="#{aonRole.sysAdmin}">				
						<aon:confirmButton id="removeSessions"
							title="#{bundle.aon_key_remove_accelerator}"
							value="#{bundle.audit_remove_sessions}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="#{bundle.audit_remove_sessions}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{auditSession.onRemoveSessions}"
							accesskey="#{bundle.aon_key_remove}" />
					</aon:if>						
				</ui:define>						
			</ui:decorate>
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{auditSession}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="Session.sessionId">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.sessionId}"/>
						</aon:column>
	
	 					<aon:column styleClass="aon-editDataTable-textColumn aon-width-150"
	 						alias="Session.startDate">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_start_date}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>							
						</aon:column>
	
	 					<aon:column styleClass="aon-editDataTable-textColumn aon-width-150"
	 						alias="Session.endDate">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_end_date}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>							
						</aon:column>
	
	 					<aon:column styleClass="aon-editDataTable-textColumn"
	 						alias="Session.user.login">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_login_user}" />
							</f:facet>
							<aon:outputText value="#{to.user.login}"/>
						</aon:column>

	 					<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.marketing_actions}" />
							</f:facet>
							<aon:outputText value="#{auditSession.count}"/>
						</aon:column>
						
	 					<aon:column styleClass="aon-editDataTable-textColumn aon-width-140"
	 						alias="Session.remoteHost">
							<f:facet name="header">
								<aon:outputText value="#{bundle.audit_session_remoteHost}" />
							</f:facet>
							<aon:outputText value="#{to.remoteHost}"/>
						</aon:column>
							
	 					<aon:column styleClass="aon-editDataTable-textColumn aon-width-100"
	 						alias="Session.remoteAddress">
							<f:facet name="header">
								<aon:outputText value="#{bundle.audit_session_remoteAddress}" />
							</f:facet>
							<aon:outputText value="#{to.remoteAddress}"/>
						</aon:column>
					</ui:define>
				
				</ui:decorate>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
