<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="sessionSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.audit_sessions_module}" />
				<ui:param name="controller" value="#{auditSession}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{auditSession}" />
				<ui:define name="searchContent">
				
					<aon:outputLabel for="Session_sessionId"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Session_sessionId" size="60"
						valueChangeListener="#{auditSession.addExpression}" />

					<aon:outputLabel value="#{bundle.aon_start_date}" />
					<aon:div>
						<aon:outputLabel for="Session_startDate-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Session_startDate-From"
							valueChangeListener="#{auditSession.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}" inputSize="16"
							popupDateFormat="#{bundle.aon_timestamp2_pattern}"/>

						<aon:outputLabel for="Session_startDate-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Session_startDate-To"
							valueChangeListener="#{auditSession.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}" inputSize="16"
							popupDateFormat="#{bundle.aon_timestamp2_pattern}"/>
					</aon:div>

					<aon:outputLabel value="#{bundle.aon_end_date}" />
					<aon:div>
						<aon:outputLabel for="Session_endDate-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Session_endDate-From"
							valueChangeListener="#{auditSession.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}" inputSize="16"
							popupDateFormat="#{bundle.aon_timestamp2_pattern}"/>

						<aon:outputLabel for="Session_endDate-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Session_endDate-To"
							valueChangeListener="#{auditSession.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}" inputSize="16"
							popupDateFormat="#{bundle.aon_timestamp2_pattern}"/>
					</aon:div>

					<ui:include src="/com/code/aon/ui/config/facelet/user/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{auditSessionSearch.user}" />
						<ui:param name="lookupControllerListener" value="#{auditSession.listener}" />
					</ui:include>						
					
					<aon:outputText for="Session_action"
						value="#{bundle.audit_option}"/>
					<aon:selectOneMenu id="Session_action" 
						value="#{auditSessionSearch.action}" >
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{actionDenied.actionList}" />
					</aon:selectOneMenu>					
						
					<aon:outputLabel for="Session_remoteAddress"
						value="#{bundle.audit_session_remoteAddress}" />
					<aon:inputText id="Session_remoteAddress" size="60"
						valueChangeListener="#{auditSession.addExpression}" />

					<aon:outputLabel for="Session_remoteHost"
						value="#{bundle.audit_session_remoteHost}" />
					<aon:inputText id="Session_remoteHost" size="60"
						valueChangeListener="#{auditSession.addExpression}" />						
						
				</ui:define>
			</ui:decorate>
			
		</aon:form>
		<aon:lookupButtonPopup lookup="#{userLookup}" />
	</ui:define>
</ui:composition>
