<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/menu.xhtml" >
		<ui:define name="beforeRightMenuContent">
			<ui:insert name="beforeRightMenuContentEx" />
			<c:if test="#{not empty actionFavorite.favoriteAndMoreUsedOptions}">
				<aon:dropDownMenu>
					<aon:dynamicInclude value="#{actionFavorite.menuTemplate}" />
	                <f:facet name="label"> 
						<aon:graphicImage title="#{auditBundle.audit_favorite_module}"
							value="#{aonResource.resolve['/images/aon-main-menu/aon-icon-favorites.png']}" />
	                </f:facet>				
				</aon:dropDownMenu>
			</c:if>				
		</ui:define>
		<ui:define name="beforeHelpMenuContent">
			<ui:insert name="beforeWebMapMenuContent"/>
			<aon:menuItem id="webMap" action="webMap"
				iconClass="aon-icon-sitemap"
				value="#{bundle.aon_web_map}" />						
		</ui:define>
	</ui:decorate>
		
 </ui:composition>
