<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"	
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/menu.xhtml" >
		<ui:define name="beforeRightMenuContent">
			<ui:insert name="beforeRightMenuContentEx" />
			<aon:if test="#{(!aonConfiguration.properties.hideMenuFavorite) and (not empty actionFavorite.favoriteAndMoreUsedOptions)}">
				<aon:graphicImage id="aonLogo"
					title="#{bundle.aon_favorites}"
					value="#{aonResource.resolve['/images/aon-main-menu/aon-icon-favorites.png']}" >
					<a4j:support event="onclick"
						actionListener="#{actionFavorite.onRenderMenu}" 
						reRender="testContextMenu"
						oncomplete="Richfaces.componentControl.performOperation(event,'onclick','#aonContent\\:mainMenuForm\\:testContextMenu','show')"						
						ajaxSingle="true" />
			    	<aon:contextMenu id="testContextMenu"
			    		attached="aonLogo" submitMode="ajax">
			    		<aon:dynamicInclude include="#{actionFavorite.renderMenu}"
			    			value="#{actionFavorite.menuTemplate}" />
			        </aon:contextMenu> 														
				</aon:graphicImage>
			</aon:if>
		</ui:define>
		<ui:define name="beforeHelpMenuContent">
			<ui:insert name="beforeWebMapMenuContent"/>
			<aon:menuItem id="webMap" action="webMap"
				rendered="#{!aonConfiguration.properties.hideMenuWebMap}"
				iconClass="aon-icon-sitemap"
				value="#{bundle.aon_web_map}" />						
		</ui:define>
	</ui:decorate>
		
 </ui:composition>
