<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j" >

	<c:if test="#{!skipDeniedContentToolbar}">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.audit_option_denied_module}" />
			<ui:param name="toolbarDescription" value="&#160;" />
			<ui:param name="innerToolbar" value="#{skipUserLookup}" />
			<ui:param name="skipToolbarTitle" value="#{skipUserLookup}" />
			<ui:param name="skipToolbarDescription" value="#{skipUserLookup}" />
			<ui:define name="toolbarContent">	
				<aon:commandButton id="optionDenied-store"
					title="#{bundle.aon_key_save_accelerator}"
					value="#{bundle.aon_save}"
					actionListener="#{controller.accept}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" />
			</ui:define>
		</ui:decorate>
	</c:if>

	<aon:div styleClass="aon-scroll-area">
		<c:if test="#{!skipUserLookup}">
			<aon:panelGrid id="menuGrid" columns="2" styleClass="aon-margin-bottom">
				<ui:include src="/com/code/aon/ui/config/facelet/user/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{controller.user}" />
					<ui:param name="lookupReRender" value="optionList" />
					<ui:param name="lookupControllerListener" value="#{controller.listener}" />
					<aon:methodParam name="lookupChangeListener"
						value="#{controller.userChanged}" type="lookupChangeListener" />
				</ui:include>
			</aon:panelGrid>
		</c:if>			
	
		<rich:listShuttle id="optionList"
			sourceValue="#{controller.options}" targetValue="#{controller.selected}"
			converter="applicationOptionConverter" var="to"
			listsHeight="400" sourceListWidth="450" targetListWidth="450"
			orderControlsVisible="false" fastOrderControlsVisible="false"
			sourceCaptionLabel="#{bundle.audit_available_options}"
			targetCaptionLabel="#{bundle.audit_option_denied_module}"
			copyAllControlLabel="#{bundle.aon_copyAll}"
			copyControlLabel="#{bundle.aon_copy}"
			removeControlLabel="#{bundle.aon_remove}"
			removeAllControlLabel="#{bundle.aon_removeAll}" >
			<rich:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_group}" />
				</f:facet>					
				<aon:outputText value="#{to.group.category.name}" />
			</rich:column>
			<rich:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_name}" />
				</f:facet>					
				<aon:outputText id="Option_description" value="#{to.description}" >
					<aon:abbreviateConverter maxWidth="50" />
				</aon:outputText>
				<rich:toolTip for="Option_description">
					<aon:outputText value="#{to.group.description}" />
				</rich:toolTip>
			</rich:column>
		</rich:listShuttle>
	</aon:div>

</ui:composition>
