<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">

	<ui:define name="configContent">
		<aon:form>
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.audit_more_used_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="moreUsedBack"
						title="#{bundle.aon_key_cancel_accelerator}"
						value="#{bundle.aon_back}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						action="auditSession_list"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>		

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{sessionMoreUsed}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />					
					<ui:define name="columns">
			
						<aon:column styleClass="aon-width-100 aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.count}"/>
						</aon:column>
			
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.audit_option}" />
							</f:facet>
							<aon:outputText value="#{sessionMoreUsed.currentDescription}"/>
						</aon:column>
	
					</ui:define>
				</ui:decorate>
	
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
