<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/js/Calculations.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/js/itemLookup.js">
			// nothing
		</script>
		<t:stylesheet path="/jscalendar-1.0/calendar-system.css" />
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/lang/calendar-es.js">
			// nothing
		</script>
		<script type='text/javascript'
			src="${facesContext.externalContext.requestContextPath}/jscalendar-1.0/calendar-setup.js">
			// nothing
		</script>

	</ui:define>

	<ui:define name="content">

		<h:form id="salesInvoiceForm">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" actionListener="#{salesInvoicing.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							disabled="#{salesInvoicingDetail.to != null || salesFinance.to != null || !salesInvoicing.editable}"
							accesskey="#{bundle.aon_key_save}" />
						<t:commandButton id="cancel" value="#{bundle.aon_cancel}"
							forceId="#{true}" immediate="#{true}"
							action="sales_invoicing_list"
							actionListener="#{salesInvoicing.onCancel}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'"
							disabled="#{salesInvoicingDetail.to != null || salesFinance.to != null}"
							accesskey="#{bundle.aon_key_cancel}" />
						<t:commandButton id="remove" value="#{bundle.aon_remove}"
							forceId="#{true}" immediate="#{true}"
							onclick="if(confirm('#{bundle.aon_remove_confirm}')){viewDialog.show();}else{ return false; }"
							action="sales_invoicing_list"
							actionListener="#{salesInvoicing.onRemove}"
							rendered="#{!salesInvoicing.new}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'"
							disabled="#{salesInvoicingDetail.to != null || salesFinance.to != null || !salesInvoicing.editable}"
							accesskey="#{bundle.aon_key_remove}" />
						<t:commandButton id="reset" value="#{bundle.aon_reset}"
							action="sales_invoicing_form"
							actionListener="#{salesInvoicing.onReset}" forceId="#{true}"
							immediate="#{true}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-reset"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-reset'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-reset'"
							disabled="#{salesInvoicingDetail.to != null || salesFinance.to != null}"
							accesskey="#{bundle.aon_key_new}" />
						<t:commandButton id="search" value="#{bundle.aon_search}"
							forceId="#{true}" immediate="#{true}"
							action="sales_invoicing_search"
							actionListener="#{salesInvoicing.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							disabled="#{salesInvoicingDetail.to != null || salesFinance.to != null}"
							accesskey="#{bundle.aon_key_search}" />
						<t:commandButton id="record" value="#{accountBundle.to_record}"
							actionListener="#{salesInvoicing.onRecordInvoice}"
							rendered="#{salesInvoicingDetail.model.rowCount > 0 and !salesInvoicing.recorded}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
							disabled="#{salesInvoicingDetail.to != null || salesFinance.to != null}" />
						<t:commandButton id="unrecord" value="#{accountBundle.to_unrecord}"
							actionListener="#{salesInvoicing.onUnrecordInvoice}"
							rendered="#{salesInvoicing.recorded}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
							disabled="#{salesInvoicingDetail.to != null || salesFinance.to != null}" />
						<t:commandButton id="finances" value="#{financeBundle.finance_generate}"
							actionListener="#{salesInvoicing.generateFinances}"
							rendered="#{salesInvoicingDetail.model.rowCount > 0 and salesFinance.allPending}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
							disabled="#{salesInvoicingDetail.to != null || salesFinance.to != null}" />
						<t:commandButton id="salesInvoiceDisabled" value="#{bundle.aon_report}"
							forceId="#{true}" rendered="#{salesInvoicingDetail.to != null || salesFinance.to != null}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							disabled="#{true}" accesskey="#{bundle.aon_key_print}" />
						<t:commandLink id="salesInvoice" value="#{bundle.aon_report}" target="_new"
							forceId="#{true}" rendered="#{!salesInvoicing.new and salesInvoicingDetail.to == null and salesFinance.to == null}"
							action="#{report.onExecute}"
							actionListener="#{salesInvoicing.onReport}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							accesskey="#{bundle.aon_key_print}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText
						value="#{salesInvoicing.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</t:div>
			</t:div>
			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">

					<t:panelGrid columns="4"
						dir="true"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even,aon-form-table-column-odd,aon-form-table-column-even">

						<h:outputLabel for="Invoice_series"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.aon_series_number}" />
						<h:panelGrid columns="2" cellpadding="0" cellspacing="0"> 
							<t:selectOneMenu id="Invoice_series-New"
								value="#{salesInvoicing.to.series}"
								rendered="#{salesInvoicing.new}"
								styleClass="aon-form-selectOneMenu-field"
								onchange="submit();" valueChangeListener="#{salesInvoicing.onSeriesChanged}">
								<f:selectItem itemValue="" itemLabel=" " />
								<f:selectItems value="#{configCollections.series}" />
							</t:selectOneMenu>
							<t:inputText id="Invoice_series-Edit" forceId="#{true}"
								value="#{salesInvoicing.to.series}"
								rendered="#{!salesInvoicing.new}" disabled="#{true}"
								styleClass="aon-form-input-text" size="4" />
							<t:inputText id="Invoice_number" forceId="#{true}"
								value="#{salesInvoicing.to.number}" disabled="#{!salesInvoicing.new}"
								styleClass="aon-form-input-text" required="true" size="7" />
						</h:panelGrid>

						<t:outputLabel for="Invoice_status"
							styleClass="aon-form-selectOneMenu-label"
							value="#{financeBundle.aon_status}" />
						<h:selectOneMenu id="Invoice_status" disabled="true"
							styleClass="aon-form-selectOneMenu-field"
							value="#{salesInvoicing.to.status}">
							<f:selectItems value="#{financeCollections.invoiceStatuses}" />
						</h:selectOneMenu>
						
						<h:outputLabel for="Invoice_issueDate"
							value="#{financeBundle.aon_date}"
							styleClass="aon-form-input-text-label " />
						<t:div styleClass="aon-form-nowrap">
							<t:inputText styleClass="aon-form-input-text"
								id="Invoice_issueDate" required="true" forceId="#{true}"
								disabled="#{!salesInvoicing.editable}"
								value="#{salesInvoicing.to.issueDate}" size="10" maxlength="12">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</t:inputText>
							<t:commandButton styleClass="aon-form-calendar-button"
								id="Invoice_issueDate_button" forceId="#{true}" value=""
								disabled="#{!salesInvoicing.editable}"
								immediate="true" />
							<script type="text/javascript">
							  Calendar.setup( {
								inputField  : "Invoice_issueDate", button : "Invoice_issueDate_button",
								ifFormat    : "%d/%m/%Y" } );
							</script>
						</t:div>

						<t:outputLabel for="Invoice_securityLevel"
							styleClass="aon-form-selectOneMenu-label"
							value="#{financeBundle.aon_security_level}" />
						<h:selectOneMenu id="Invoice_securityLevel"
							styleClass="aon-form-selectOneMenu-field"
							disabled="#{!salesInvoicing.editable}"
							value="#{salesInvoicing.to.securityLevel}">
							<f:selectItems value="#{financeCollections.securityLevels}" />
						</h:selectOneMenu>

						<t:outputLabel for="Customer_Lookup_id"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.aon_customer}" />
						<h:panelGroup>
							<t:inputText id="Customer_Lookup_id" size="5" forceId="#{true}"
								styleClass="aon-form-input-text"
								onchange="return findBeanLookupAndSubmitExt(this.form, event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');"
								value="#{salesInvoicing.to.registry.id}"
								disabled="#{!salesInvoicing.editable}"
								valueChangeListener="#{salesInvoicing.customerData}" />
							<h:commandButton id="find_Customer_Lookup_id"
								onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');return false;"	
								value="" immediate="true" styleClass="aon-form-lookup-button"
								disabled="#{!salesInvoicing.editable}" />
							<h:commandButton styleClass="aon-form-new-button"
								id="addCustomer" value="" immediate="true"
								disabled="#{!salesInvoicing.editable}"
								onclick="lookupNewWindow(this, 'placeList', '#{customerLookup.encodedNewPagePath}','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');return false;" />
							<t:inputText id="Customer_full_name" forceId="#{true}"
								styleClass="aon-form-input-text"
								disabled="#{!salesInvoicing.editable}"
								size="40"
								value="#{salesInvoicing.to.registryName}" />
						</h:panelGroup>

						<t:outputLabel for="DeliveryDetail_warehouse_id"
							styleClass="aon-form-selectOneMenu-label"
							value="#{warehouseBundle.aon_warehouse}" />
						<h:selectOneMenu id="DeliveryDetail_warehouse_id" 
							disabled="#{!salesInvoicing.editable}"
							styleClass="aon-form-selectOneMenu-field"
							value="#{salesInvoicing.warehouseId}">
							<f:selectItems value="#{warehouseCollections.warehouses}" />
						</h:selectOneMenu>

						<t:outputLabel for="Customer_registry_document"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.aon_document}" />
						<t:inputText id="Customer_registry_document"
							value="#{salesInvoicing.to.registryDocument}"
							disabled="#{!salesInvoicing.editable}"
							styleClass="aon-form-input-text"
							forceId="#{true}" size="10" />	
						
						<t:outputLabel for="Pos_id"
							styleClass="aon-form-selectOneMenu-label"
							value="#{warehouseBundle.aon_pos}" />
						<h:selectOneMenu id="Pos_id"
							styleClass="aon-form-selectOneMenu-field"
							value="#{salesInvoicing.posId}"
							disabled="#{!salesInvoicing.editable}" >
							<f:selectItems value="#{salesCollections.pointsOfSale}" />
						</h:selectOneMenu>
						
						<h:outputLabel for="Invoice_registryAddress_id"
							styleClass="aon-form-input-text-label"
							value="#{warehouseBundle.aon_customer_address}" />
						<t:div>
							<h:selectOneMenu id="Invoice_registryAddress_id" forceId="#{true}"
								rendered="#{(salesInvoicing.new or salesInvoicingAddress.to.id == null) and salesInvoicing.addressCount > 0}"
								styleClass="aon-form-selectOneMenu-field"
								disabled="#{!salesInvoicing.editable}"
								value="#{salesInvoicing.to.registryAddress.id}">
								<f:selectItems value="#{salesInvoicing.addresses}" />
							</h:selectOneMenu>	
							<h:outputLabel value="#{financeBundle.invoice_no_available_address}"
								rendered="#{(salesInvoicing.new or salesInvoicingAddress.to.id == null) and salesInvoicing.addressCount == 0}" />
							<t:inputText id="Invoice_registryAddress_address" forceId="#{true}"
								rendered="#{!salesInvoicing.new and salesInvoicingAddress.to.id != null}"
								value="#{salesInvoicing.address}"
								disabled="#{true}"
								styleClass="aon-form-input-text" size="33" />
							<t:inputText id="Invoice_registryAddress_city" forceId="#{true}"
								rendered="#{!salesInvoicing.new and salesInvoicingAddress.to.id != null}"
								value="#{salesInvoicing.city}"
								disabled="#{true}"
								styleClass="aon-form-input-text" size="16" />
							<t:commandButton id="popupButton"
								rendered="#{!salesInvoicing.new and !salesInvoicing.recorded}"
								styleClass="aon-navigation-link"
								value="#{registryBundle.aon_address_other}"
								onclick="showPopup();return false;" />
						</t:div>

						<t:outputLabel for="Invoice_total"
							styleClass="aon-form-selectOneMenu-label"
							value="#{financeBundle.aon_total}" />
						<t:outputText id="Invoice_total" forceId="#{true}" size="15"
							styleClass="aon-form-input-text-label"
							value="#{salesInvoicing.toInvoiceTotalPrice}">
							<f:convertNumber pattern="#,##0.00" />
						</t:outputText>

						<h:outputLabel for="Invoice_comments"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.aon_invoice_comments}" />
						<t:panelGroup colspan="3">
							<t:inputTextarea id="Invoice_comments" forceId="#{true}"
								styleClass="aon-form-input-text" cols="100" rows="5"
								value="#{salesInvoicing.to.comments}" />
						</t:panelGroup>
					</t:panelGrid>

					<t:div styleClass="aon-form-group"
						rendered="#{!salesInvoicing.new and delivery.model.rowCount >0 and salesInvoicing.editable}">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="salesInvoicingLineData"
								value="#{financeBundle.aon_deliveries}" />
						</t:div>

						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="deliveryData" var="to" value="#{delivery.model}"
								rendered="#{delivery.model.rowCount > 0}"
								styleClass="aon-edit-table" headerClass="aon-edit-table-header"
								footerClass="aon-edit-table-footer" rows="20"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body-icon,aon-edit-table-body aon-edit-table-body-string,aon-edit-table-body aon-edit-table-body-string,aon-edit-table-body aon-edit-table-body-string,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-number,aon-edit-table-body aon-edit-table-body-string"
								cellpadding="0" cellspacing="0">

								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:selectBooleanCheckbox id="Row_checked" forceId="#{true}"
										rendered="#{!delivery.closed}" value="#{delivery.rowChecked}"
										valueChangeListener="#{delivery.rowSelected}"
										onmouseover="enableRowSubmit(false)"
										onmouseout="enableRowSubmit(true)"
										styleClass="aon-form-selectBooleanCheckbox-field" />
									<t:commandButton title="#{bundle.aon_remove}"
										actionListener="#{salesInvoicing.onRemoveDelivery}"
										immediate="#{true}" rendered="#{delivery.closed}"
										onclick="disableTblLink( this, true );ret = confirm('#{bundle.aon_remove_confirm}');if(!ret){disableTblLink( this, false );return ret;}"
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete" value=""/>
									<t:commandLink immediate="#{true}"
										styleClass="aon-table-row-selected"
										actionListener="#{delivery.onSelect}"
										action="sales_delivery_detail_list" />
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{warehouseBundle.aon_series_number}" />
									</f:facet>
									<h:outputText value="#{to.series} / #{to.number}" />
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{warehouseBundle.offer_tasItem_publicCode} / #{warehouseBundle.offer_tasItem_model}" />
									</f:facet>
									<h:outputText value="#{delivery.supportOrderData}" />
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{warehouseBundle.aon_date}" />
									</f:facet>
									<h:outputText value="#{to.issueTime}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</h:outputText>
								</h:column>

								<t:column width="60">
									<f:facet name="header">
										<h:outputText value="#{warehouseBundle.aon_taxable_base}" />
									</f:facet>
									<t:outputText value="#{delivery.deliveryBasePrice}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
								</t:column>

								<t:column width="60">
									<f:facet name="header">
										<h:outputText value="#{warehouseBundle.aon_vat}" />
									</f:facet>
									<t:outputText value="#{delivery.deliveryTotalTaxRate}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
								</t:column>

								<t:column width="60">
									<f:facet name="header">
										<h:outputText value="#{warehouseBundle.aon_surch}" />
									</f:facet>
									<t:outputText value="#{delivery.deliveryTotalSurchargeRate}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
								</t:column>

								<t:column width="60">
									<f:facet name="header">
										<h:outputText value="#{warehouseBundle.aon_total_delivery}" />
									</f:facet>
									<t:outputText id="Delivery_Total_Price" forceId="#{true}"
										value="#{delivery.deliveryTotalPrice}">
										<f:convertNumber pattern="#,##0.00" />
									</t:outputText>
								</t:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{warehouseBundle.aon_status}" />
									</f:facet>
									<h:outputText value="#{to.status}" />
								</h:column>
							</t:dataTable>

							<ui:include src="/facelet/shared/dataScroller.xhtml">
								<ui:param name="dataTable" value="deliveryData" />
								<ui:param name="model" value="#{delivery.model}" />
								<ui:param name="showNote" value="#{false}" />
							</ui:include>

							<t:div style="text-align:right;">
								<t:commandButton title="#{financeBundle.aon_transfer}"
									styleClass="aon-form-button"
									onclick="viewDialog.show();"
									value="#{financeBundle.aon_transfer}"
									actionListener="#{salesInvoicing.onInvoice}"
									accesskey="#{bundle.aon_key_invoice}" />
							</t:div>
						</t:div>
					</t:div>

					<t:div styleClass="aon-form-group"
						rendered="#{!salesInvoicing.new}">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="salesInvoicingLineData"
								value="#{financeBundle.aon_invoice_lines}" />
						</t:div>

						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="salesInvoicingLineData" var="to"
								styleClass="aon-edit-table" headerClass="aon-edit-table-header"
								footerClass="aon-edit-table-footer" cellpadding="0"
								cellspacing="0" value="#{salesInvoicingDetail.model}"
								rowOnMouseOver="selectRow( this )" rows="20"
								rowIndexVar="rowIndex" rowOnMouseOut="unselectRow( this )"

		<script>
			function calcPrice(index){
				priceName = "Item_price";
				quantityName = "Item_quantity";
				priceNewName = "Item_price_new"
				discountName = "Discount";
				if(index != -1){
					priceName = priceName + "-Edit[" + index + "]";
					quantityName = quantityName + "-Edit[" + index + "]";
					priceNewName = priceNewName + "-Edit[" + index + "]";
					discountName = discountName + "-Edit[" + index + "]";
				}else{
					priceName = priceName + "-New";
					quantityName = quantityName + "-New";
					priceNewName = priceNewName + "-New";
					discountName = discountName + "-New";					
				}
				price = document.getElementById( priceName );
				quantity = document.getElementById( quantityName );
				discount = document.getElementById( discountName );
				amount = document.getElementById( priceNewName );
				temp = redondea( price.value * quantity.value , 2 );
				amount.innerText = "" + redondea( temp - ( temp * discount.value / 100 ), 2 );
			}
			function redondea(xparam , digits ){
			    retvalue = xparam;
			    if ( digits > 0 ) {
			    	value = Math.pow(10,digits);
			        retvalue = Math.round(parseFloat(xparam)*value)/value;
			    }
			    if ( digits == 0 ) {
			        retvalue = Math.round(parseFloat(xparam));
			    }
			    if ( isNaN(parseFloat(retvalue)) ) {
			        retvalue = 0;
			    }
			    return retvalue;
			}
			function showPopup(){
				document.getElementById( "popup" ).style.display='block';
				document.getElementById( "Address_required" ).style.display = 'none';
				document.getElementById( "Zip_required" ).style.display = 'none';
				document.getElementById( "City_required" ).style.display = 'none';
				document.getElementById( "Geozone_required" ).style.display = 'none';
				document.getElementById( "InvoiceAddress_address" ).focus();
			}
		</script>
