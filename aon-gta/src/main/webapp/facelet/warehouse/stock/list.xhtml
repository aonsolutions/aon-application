<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">

		<h:form id="stockList">
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton value="#{bundle.aon_search}"
							actionListener="#{stock.onEditSearch}" action="stock_search"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							accesskey="#{bundle.aon_key_search}" />
						 <t:commandLink id="stockWarehouseList" value="#{warehouseBundle.aon_print_by_warehouse}" target="_new"
							onclick="reportWindow(this,'placeList', '${facesContext.externalContext.requestContextPath}/facelet/warehouse/stock/report/by_warehouse.faces');return false;"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"/>	
						 <t:commandLink id="stockItemList" value="#{warehouseBundle.aon_print_by_item}" target="_new"
							onclick="reportWindow(this,'placeList', '${facesContext.externalContext.requestContextPath}/facelet/warehouse/stock/report/by_item.faces');return false;"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"/>	
					</t:div>
				</t:div>
			</t:div>

			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<t:div styleClass="aon-table-hack">
						<t:dataTable id="stockDataList" cellpadding="0" cellspacing="0"
							var="to" value="#{stock.model}" rows="20"
							rendered="#{stock.model.rowCount > 0}" styleClass="aon-table"
							headerClass="aon-table-header"
							rowClasses="aon-table-row-odd,aon-table-row-even"
							columnClasses="aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-string,
								aon-table-body aon-table-body-number" 
							rowOnMouseOver="selectRow( this )"
							rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )">

							<t:column>
								<f:facet name="header">
									<h:outputText value="#{warehouseBundle.stock_warehouse}" />
								</f:facet>
								<h:outputText value="#{to.warehouse.name}" />
								<t:commandLink styleClass="aon-table-row-selected" 
									action="stock_form"
									actionListener="#{stock.onSelect}" />
							</t:column>
	
							<t:column>
								<f:facet name="header">
									<h:outputText value="#{warehouseBundle.stock_item}" />
								</f:facet>
								<h:outputText value="#{to.item.product.name} #{to.item.detail}" />
							</t:column>
	
							<t:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{warehouseBundle.stock_quantity}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.quantity}">
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
							</t:column>
						</t:dataTable>
					</t:div>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="stockDataList" />
						<ui:param name="model" value="#{stock.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</t:div>
			</t:div>

		</h:form>
		<h:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
