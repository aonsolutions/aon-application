<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-content-toolbar" forceId="#{true}"
		id="aon-content-toolbar" rendered="#{renderizeNew}">
		<t:div styleClass="aon-content-toolbar-internal">
			<t:div styleClass="aon-content-toolbar-item-group">
				<h:commandButton id="reset" value="#{bundle.aon_reset}"
					styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
					onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
					onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'"
					actionListener="#{recordData.onReset}"
					action="#{recordData.getFormNavigation}" accesskey="#{bundle.aon_key_new}" />
			</t:div>
		</t:div>
	</t:div>

	<t:div styleClass="aon-table-hack">
		<t:dataTable id="recordDataList" value="#{recordData.model}"
			rows="20" var="to" rowIndexVar="rowIndex"
			rendered="#{recordData.model.rowCount > 0}"
			rowOnMouseOver="selectRow( this )"
			rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
			styleClass="aon-table" headerClass="aon-table-header"
			rowClasses="aon-table-row-odd,aon-table-row-even"
			columnClasses="aon-table-body aon-table-body-string, 
				aon-table-body aon-table-body-string,
				aon-table-body aon-table-body-string,
				aon-table-body aon-table-body-string">

			<t:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<t:commandLink immediate="#{true}"
					styleClass="aon-table-row-selected" action="#{recordData.getFormNavigation}"
					rendered="#{to.id!=recordData.to.id}"
					actionListener="#{recordData.onSelect}" />
				<f:verbatim>&#160;</f:verbatim>
			</t:column>

			<t:column width="85">
				<f:facet name="header">
					<h:outputText
						value="#{registryBundle.aon_record_data_creation_date}" />
				</f:facet>
				<t:outputText value="#{to.creationDate}"
					rendered="#{to.id!=recordData.to.id}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</t:outputText>
			</t:column>

			<t:column>
				<f:facet name="header">
					<h:outputText value="#{registryBundle.aon_description}" />
				</f:facet>
				<h:outputText value="#{to.description}"
					rendered="#{to.id!=recordData.to.id}" />
			</t:column>

			<t:column>
				<f:facet name="header">
					<h:outputText value="#{registryBundle.aon_record_data_notary}" />
				</f:facet>
				<h:outputText value="#{to.notary}"
					rendered="#{to.id!=recordData.to.id}" />
			</t:column>

			<t:column>
				<f:facet name="header">
					<h:outputText value="#{registryBundle.aon_record_data_number}" />
				</f:facet>
				<h:outputText value="#{to.number}"
					rendered="#{to.id!=recordData.to.id}" />
			</t:column>

		</t:dataTable>
	</t:div>

	<ui:include src="/facelet/shared/dataScroller.xhtml">
		<ui:param name="dataTable" value="recordDataList" />
		<ui:param name="model" value="#{recordData.model}" />
		<ui:param name="showNote" value="#{true}" />
	</ui:include>

</ui:composition>

</body>
</html>
