<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">
	
		<h:form id="feePrintList">
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton value="#{bundle.aon_search}"
							actionListener="#{feePrint.onEditSearch}" action="fee_print_search"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'" 
							accesskey="#{bundle.aon_key_search}"/>
						<t:commandButton id="feePrintList" value="#{bundle.aon_listing}"
							forceId="#{true}"
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							accesskey="#{bundle.aon_key_print}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<t:div styleClass="aon-table-hack">
						<t:dataTable id="feePrintDataList" cellpadding="0" cellspacing="0"
							var="to" value="#{feePrint.model}" rows="20"
							rendered="#{feePrint.model.rowCount > 0}"
							styleClass="aon-table" headerClass="aon-table-header"
							rowClasses="aon-table-row-odd,aon-table-row-even"
							columnClasses="aon-table-body aon-table-body-string,
										   aon-table-body aon-table-body-string,
										   aon-table-body aon-table-body-string,
										   aon-table-body aon-table-body-number,
										   aon-table-body aon-table-body-number,
										   aon-table-body aon-table-body-number,
										   aon-table-body aon-table-body-string">

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{financeBundle.aon_customer}" />
								</f:facet>
								<h:outputText value="#{to.customer.registry.surname}, " rendered="#{to.customer.registry.surname != null and to.customer.registry.surname != ''}"/>								
								<h:outputText value="#{to.customer.registry.name}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{financeBundle.aon_status}" />
								</f:facet>
								<h:outputText value="#{to.customer.status}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:outputText value="#{financeBundle.finance_fee_item}" />
								</f:facet>
								<h:outputText value="#{to.description}" />
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{financeBundle.aon_quantity}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.quantity}"> 
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{financeBundle.aon_price}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.price}"> 
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
							</h:column>

							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{financeBundle.aon_discount}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.discountExpression.discountExpr}" />
							</h:column>
							
							<h:column>
								<f:facet name="header">
									<h:panelGroup>
										<h:outputText value="#{financeBundle.finance_fee_billing_date}" />
									</h:panelGroup>
								</f:facet>
								<h:outputText value="#{to.billingDateMonth}" />
								<h:outputText value=" / #{to.billingDateYear}" />
							</h:column>
						</t:dataTable>
					</t:div>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="feePrintDataList" />
						<ui:param name="model" value="#{feePrint.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
