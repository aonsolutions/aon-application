version: 0.2

#env:
  #variables:
     # key: "value"
     # key: "value"
  #parameter-store:
     # key: "value"
     # key: "value"
  #git-credential-helper: yes

phases:
  install:
    #Si utiliza la imagen estándar de Ubuntu 2.0 o posterior, debe especificar las versiones del tiempo de ejecución.
    #Si especifica las versiones del tiempo de ejecución y utiliza una imagen que no sea la estándar de Ubuntu 2.0, se produce un error en la compilación.
    #runtime-versions:
      # name: version
      # name: version
    commands:
      - echo Entered the install phase...
      - /usr/local/bin/docker-entrypoint.sh
      # - command
  pre_build:
    commands:
      - echo Entered the pre_build phase...
      - echo Logging in to Amazon ECR... $AWS_ACCOUNT_ID
      - $(aws ecr get-login --no-include-email --region $AWS_DEFAULT_REGION)
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/aonsolutions
      # - command
      # - command
  build:
    commands:
      - echo Entered the build phase...
      - echo Building TEST version...
      - echo Build started on `date`
      #- mvn --offline --fail-fast -DbuildNumber=666 -Dgwt.working=true clean install
      - mvn -B --fail-at-end -DbuildNumber=666 -Dgwt.working=true clean install
      - echo Building TEST Docker images...
      - docker build --no-cache -t aonsolutions/aon-application:test .
      - docker tag aonsolutions/aon-application:test $REPOSITORY_URI/aon-application:test
      - docker push $REPOSITORY_URI/aon-application:test      
      - docker build --no-cache -t aonsolutions/aon-db-up2date:test ./aon-db-up2date
      - mysql < aon-htmlunit/src/test/resources/com/esferalia/aon/htmlunit/payroll/test-aonsolutions-org.sql
      - |
        docker run \
        -e DB_USER=dbuser \
        -e DB_PASSWD=serubd2000 \
        -e DB_HOST=$(ip addr show docker0 | grep -oP 'inet \K[0-9\.]+') \
        aonsolutions/aon-db-up2date:test
      - |
        docker run \
        -d -p 8080:8080 \
        -e DB_USER=dbuser \
        -e DB_PASSWD=serubd2000 \
        -e DB_HOST=$(ip addr show docker0 | grep -oP 'inet \K[0-9\.]+') \
        aonsolutions/aon-application:test
      - |
        mvn -B \
        --fail-at-end \
        -Dintegration.test.user=admin \
        -Dintegration.test.password=org \
        -Dintegration.test.payroll.url=http://payroll-test.aonsolutions.org:8080/ \
        -Dintegration.test.general.payroll.url=http://general-payroll-test.aonsolutions.org:8080/ \
        -Dintegration.test.agrarian.payroll.url=http://agrarian-payroll-test.aonsolutions.org:8080/ \
        -Dintegration.test.trainning.payroll.url=http://trainning-payroll-test.aonsolutions.org:8080/ \
        -Dintegration.test.home.payroll.url=http://home-payroll-test.aonsolutions.org:8080/  \
        -f aon-htmlunit/pom.xml integration-test
      - echo Building PRODUCTION version...
      - mvn -B --resume-from aon-js-payroll -DbuildNumber=666 -Drpm.release=false -DskipTests=true clean install
      # - echo Building PRODUCTION Docker images...
      - docker build --no-cache -t aonsolutions/aon-application:${TAG:=snapshot} .
      # - docker build --no-cache -t aonsolutions/aon-db-up2date:${TAG:=snapshot} ./aon-db-up2date
      - docker build --no-cache -t aonsolutions/aon-solutions:${TAG:=snapshot} -f ./aon-solutions/Dockerfile .
      - docker tag aonsolutions/aon-db-up2date:test $REPOSITORY_URI/aon-db-up2date:${TAG:=snapshot}
      - docker tag aonsolutions/aon-application:${TAG:=snapshot} $REPOSITORY_URI/aon-application:${TAG:=snapshot}
      - docker tag aonsolutions/aon-solutions:${TAG:=snapshot} $REPOSITORY_URI/aon-solutions:${TAG:=snapshot}
      - mvn --fail-fast -DbuildNumber=666 -Daws.lambda=true -pl aon-oauth2 clean install
      - mvn --fail-fast -DbuildNumber=666 -Daws.lambda=true -pl aon-in-payroll clean install
      # - command
  post_build:
    commands:
      - echo Entered the post_build phase...
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $REPOSITORY_URI/aon-db-up2date:${TAG:=snapshot}
      - docker push $REPOSITORY_URI/aon-solutions:${TAG:=snapshot}
      - docker push $REPOSITORY_URI/aon-application:${TAG:=snapshot}
      - |
        [ "${COMMIT_MESSAGE#HOTFIX}" != "${COMMIT_MESSAGE}" ] \
        && docker tag aonsolutions/aon-solutions:${TAG:=snapshot} $REPOSITORY_URI/aon-solutions:hotfix \
        && docker push $REPOSITORY_URI/aon-solutions:hotfix \
        || echo $COMMIT_MESSAGE
      - |
        printf '[
        {"name":"SNAPSH0T","imageUri":"%s/aon-application:${TAG:=snapshot}"}
        ]' $REPOSITORY_URI $REPOSITORY_URI > snapshotimgdef.json
      - cat snapshotimgdef.json
      - |
        printf '[
        {"name":"SNAPSHOT-SOLUTIONS","imageUri":"%s/aon-solutions:${TAG:=snapshot}"}
        ]' $REPOSITORY_URI $REPOSITORY_URI > snapshotsolutionsimgdef.json
      - cat snapshotsolutionsimgdef.json
      - cp -av aon-oauth2/target/aon.oauth2-9.23-SNAPSHOT-jar-with-dependencies.jar aon-oauth2.jar
      - cp -av aon-in-payroll/target/aon.in.payroll-9.23-SNAPSHOT-jar-with-dependencies.jar aon-in-payroll.jar
      # - command
      # - command
artifacts:
  files:
    - aon-oauth2.jar
    - aon-in-payroll.jar
    - snapshotimgdef.json
    - snapshotsolutionsimgdef.json
    # - location
  #name: $(date +%Y-%m-%d)
  #discard-paths: yes
  #base-directory: location
#cache:
  #paths:
    # - paths
