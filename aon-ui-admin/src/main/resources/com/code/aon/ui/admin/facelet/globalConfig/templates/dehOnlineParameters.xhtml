<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigDehOnlineParametersForm">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.aon_external_dehOnline}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
			<ui:define name="toolbarContent">
				<aon:commandButton id="save"
					value="#{bundle.aon_save}"
					actionListener="#{dehOnline.acceptPassword}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" />
				<aon:if test="#{dehOnline.storedPassword != null}">
					<h:outputLink id="dehOnlineTest" target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="document.getElementById('dehonlineForm').submit();return false;" >
						<aon:outputText value="#{bundle.sepe_validateLogin}" />
					</h:outputLink>
				</aon:if>			
			</ui:define>				
		</ui:decorate>
	
		<aon:div styleClass="aon-scroll-area">
		
			<aon:panelGrid columns="2">
		
				<aon:outputLabel for="User_login"
					value="#{bundle.aon_login}" />
				<aon:inputText id="User_login" 
					required="true" size="20"
					maxlength="64" value="#{dehOnline.user}" />
		
				<aon:outputLabel for="User_Password"
					value="#{bundle.aon_login_passwd}" />
				<aon:inputSecret id="User_Password"
					required="true" size="20"
					maxlength="64" value="#{dehOnline.password}" />
		
				<aon:outputLabel for="User_ConfirmPassword"
					value="#{bundle.config_user_confirm_password}" />
				<aon:inputSecret id="User_ConfirmPassword"
					required="true" size="20"
					maxlength="64" value="#{dehOnline.confirmPassword}" />
		
			</aon:panelGrid>

		</aon:div>

	</aon:form>

	<aon:if test="#{dehOnline.user != null}">	
		<form id="dehonlineForm" action="https://panel.dehonline.es/login" method="post" target="_blank">
			<input type="hidden" name="identity" value="#{dehOnline.user}"/>
			<input type="hidden" name="password" value="#{dehOnline.storedPassword}"/>
		</form>
	</aon:if>

</ui:composition>
