<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="domainHistoryList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.admin_domain_history}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_toolbar_search}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="clear"
						value="#{bundle.aon_clear}" 
						actionListener="#{domainHistory.onClear}"
						styleClass="aon-finding-toolbar-item aon-icon-rubber" />
					<aon:commandButton value="#{bundle.aon_back}"
						action="domainPrint_search"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>		
			
			<aon:div styleClass="aon-scroll-area">
				<ui:include
					src="/com/code/aon/ui/admin/facelet/domainPrint/domainHistorySearch.xhtml" />
					
				<aon:if test="#{domainHistory.showList}">
						
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{domainHistory}" />
						<ui:param name="skipSelectButton" value="#{true}" />
						<ui:define name="columns">
							<ui:include
								src="/com/code/aon/ui/admin/facelet/adminDomain/historyList.xhtml" >
								<ui:param name="showModificationColumns" value="#{false}"/>
							</ui:include>
						</ui:define>
					</ui:decorate>
				</aon:if>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
