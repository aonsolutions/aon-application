<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigConectaParamsForm">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.finance_exporter}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_configuration}" />
			<ui:define name="toolbarContent">
				<aon:commandButton id="#{toolbarID}-save"
					title="#{bundle.aon_key_save_accelerator}"
					value="#{bundle.aon_save}"
					actionListener="#{exporter.onSaveConfiguration}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" />
			</ui:define>
		</ui:decorate>
	
		<aon:div styleClass="aon-scroll-area">
		
			<aon:panelGrid columns="2">
	
				<aon:outputLabel for="Exporter_type"
					value="#{bundle.aon_type}" />
				<aon:selectOneMenu id="Exporter_type"
					value="#{exporter.configuration.type}"
					actionListener="#{exporter.onTypeChanged}"
					reRender="globalConfigConectaParamsForm">
					<f:selectItem itemLabel=" - " itemValue="#{null}" />
					<f:selectItems value="#{financeCollections.invoiceExportTypes}" />
				</aon:selectOneMenu>
	
				<aon:if test="#{exporter.configuration.showEnterpriseCode}">
					<aon:outputLabel for="Exporter_enterpriseCode"
						value="#{bundle.aon_company_id}" />
					<aon:inputText id="Exporter_enterpriseCode"
						value="#{exporter.configuration.enterpriseCode}"
						size="10" maxlength="#{exporter.configuration.enterpriseCodeLength}"
						required="true" />
				</aon:if> 
				
				<aon:if test="#{exporter.configuration.showAccountSize}">
					<aon:outputLabel for="Exporter_accountSize"
						value="#{bundle.finance_exporter_account_size}" />
					<aon:selectOneMenu id="Exporter_accountSize"
						value="#{exporter.configuration.accountSize}" required="true">
						<aon:if test="#{exporter.configuration.type == 'A3'}">
							<f:selectItem itemLabel="7" itemValue="#{7}" />
							<f:selectItem itemLabel="8" itemValue="#{8}" />
						</aon:if>
						<f:selectItem itemLabel="9" itemValue="#{9}" />
						<f:selectItem itemLabel="10" itemValue="#{10}" />
						<f:selectItem itemLabel="11" itemValue="#{11}" />
						<f:selectItem itemLabel="12" itemValue="#{12}" />
						<aon:if test="#{exporter.configuration.type == 'EXCEL'}">
							<f:selectItem itemLabel="13" itemValue="#{13}" />
							<f:selectItem itemLabel="14" itemValue="#{14}" />
							<f:selectItem itemLabel="15" itemValue="#{15}" />
						</aon:if>
					</aon:selectOneMenu>
				</aon:if> 				
	
				<aon:if test="#{exporter.configuration.type == 'GEYCE'}">
					<aon:outputLabel for="Geyce_journal_general"
						value="#{bundle.finance_journal_general}" />
					<aon:inputText id="Geyce_journal_general"
						size="2" maxlength="2" required="true"
						value="#{exporter.configuration.generalJournal}" />
	
					<aon:outputLabel for="Geyce_journal_sales"
						value="#{bundle.finance_journal_sales}" />
					<aon:inputText id="Geyce_journal_sales"
						size="2" maxlength="2"
						value="#{exporter.configuration.salesJournal}" />
						
					<aon:outputLabel for="Geyce_journal_purchases"
						value="#{bundle.finance_journal_purchases}" />
					<aon:inputText id="Geyce_journal_purchases"
						size="2" maxlength="2"
						value="#{exporter.configuration.purchaseJournal}" />
	
					<aon:outputLabel for="Geyce_journal_expenses"
						value="#{bundle.finance_journal_expenses}" />
					<aon:inputText id="Geyce_journal_expenses"
						size="2" maxlength="2"
						value="#{exporter.configuration.expensesJournal}" />
				</aon:if>												

				<aon:if test="#{exporter.configuration.type == 'DSI_GESTION'}">
<!-- 
					<aon:outputLabel for="Dsi_defaultPortfolio"
						value="#{bundle.finance_exporter_portfolio_default}" />
					<aon:inputText id="Dsi_defaultPortfolio"
						size="3" maxlength="3" required="true"
						value="#{exporter.configuration.generalJournal}" />	
 -->
					<aon:outputLabel for="Dsi_chargesPortfolio"
						value="#{bundle.finance_exporter_portfolio_charges}" />
					<aon:inputText id="Dsi_chargesPortfolio"
						size="3" maxlength="3" required="true"
						value="#{exporter.configuration.salesJournal}" />	
					<aon:outputLabel for="Dsi_paymentsPortfolio"
						value="#{bundle.finance_exporter_portfolio_payments}" />
					<aon:inputText id="Dsi_paymentsPortfolio"
						size="3" maxlength="3" required="true"
						value="#{exporter.configuration.purchaseJournal}" />	
					<aon:outputLabel for="Dsi_vats"
						value="#{bundle.finance_exporter_vats}" />
					<aon:div id="vatsDiv">
						<a4j:region>
							<a4j:repeat value="#{exporter.configuration.taxs}" rowKeyVar="index" var="tax">
								<aon:div styleClass="#{(index != 0)?'aon-padding-top':''}">
									<aon:outputLabel for="Dsi_vatId" 
										styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_id}" />
									<aon:inputText id="Dsi_vatId"
										size="2" maxlength="2"
										value="#{exporter.configuration.vats[index]}" />	
									<aon:selectOneMenu id="Dsi_taxIds"
										style="margin-left: 5px;" 
										value="#{exporter.configuration.taxs[index]}">
										<f:selectItem itemLabel="-" value="#{null}"/>
										<f:selectItems value="#{exporter.selectableTaxs}" />
										<a4j:support event="onchange" reRender="vatsDiv"
											ajaxSingle="true" process="Dsi_vatId"/>
									</aon:selectOneMenu>
									<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" reRender="vatsDiv"
										actionListener="#{exporter.onRemoveVat}" value="&#160;"
										rendered="#{tax != null}" immediate="true">
										<f:param name="index" value="#{index}" />
									</aon:commandButton>
									<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" reRender="vatsDiv"
										actionListener="#{exporter.onAddVat}" value="&#160;"
										rendered="#{(tax != null) and (index == (fn:length(exporter.configuration.vats)-1))}"/>					
								</aon:div>						
							</a4j:repeat>
						</a4j:region>
					</aon:div>			
				</aon:if>												
					
				<aon:if test="#{exporter.configuration.type == 'DIAMACON'}">
					<aon:outputLabel for="Diamacon_invoiceNumberMaxLength"
						value="#{bundle.finance_exporter_invoice_number_max_length}" />
					<aon:inputText id="Diamacon_invoiceNumberMaxLength"
						size="2" maxlength="2" required="false"
						value="#{exporter.configuration.invoiceNumberMaxLength}" />
				</aon:if>
					
			</aon:panelGrid>
	
		</aon:div>
			
	</aon:form>

</ui:composition>
