<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigConectaParamsForm">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.finance_exporter}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_configuration}" />
			<ui:define name="toolbarContent">
				<aon:commandButton id="#{toolbarID}-save"
					title="#{bundle.aon_key_save_accelerator}"
					value="#{bundle.aon_save}"
					actionListener="#{exporter.onSaveConfiguration}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" />
			</ui:define>
		</ui:decorate>
	
		<aon:div styleClass="aon-scroll-area">
		
			<aon:panelGrid columns="2">
	
				<aon:outputLabel for="Exporter_type"
					value="#{bundle.aon_type}" />
				<aon:selectOneMenu id="Exporter_type"
					value="#{exporter.configuration.type}" required="true"
					actionListener="#{exporter.onTypeChanged}"
					reRender="globalConfigConectaParamsForm">
					<f:selectItem itemLabel=" - " itemValue="#{null}" />
					<f:selectItems value="#{financeCollections.invoiceExportTypes}" />
				</aon:selectOneMenu>
	
				<c:if test="#{(exporter.configuration.type == 'A3') or (exporter.configuration.type == 'GEYCE')}">
					<aon:outputLabel for="Exporter_enterpriseCode"
						value="#{bundle.aon_company_id}" />
					<aon:inputText id="Exporter_enterpriseCode"
						value="#{exporter.configuration.enterpriseCode}"
						size="10" maxlength="#{exporter.configuration.enterpriseCodeLength}"
						required="true" />
				</c:if> 
				
				<c:if test="#{(exporter.configuration.type == 'A3') or (exporter.configuration.type == 'EXCEL')}">
					<aon:outputLabel for="Exporter_accountSize"
						value="#{bundle.finance_exporter_account_size}" />
					<aon:selectOneMenu id="Exporter_accountSize"
						value="#{exporter.configuration.accountSize}" required="true">
						<f:selectItem itemLabel="9" itemValue="#{9}" />
						<f:selectItem itemLabel="10" itemValue="#{10}" />
						<f:selectItem itemLabel="11" itemValue="#{11}" />
						<f:selectItem itemLabel="12" itemValue="#{12}" />
						<c:if test="#{exporter.configuration.type == 'EXCEL'}">
							<f:selectItem itemLabel="13" itemValue="#{13}" />
							<f:selectItem itemLabel="14" itemValue="#{14}" />
							<f:selectItem itemLabel="15" itemValue="#{15}" />
						</c:if>
					</aon:selectOneMenu>
				</c:if> 				
	
				<c:if test="#{exporter.configuration.type == 'GEYCE'}">
					<aon:outputLabel for="Geyce_journal_general"
						value="#{bundle.finance_journal_general}" />
					<aon:inputText id="Geyce_journal_general"
						size="2" maxlength="2" required="true"
						value="#{exporter.configuration.generalJournal}" />
	
					<aon:outputLabel for="Geyce_journal_sales"
						value="#{bundle.finance_journal_sales}" />
					<aon:inputText id="Geyce_journal_sales"
						size="2" maxlength="2"
						value="#{exporter.configuration.salesJournal}" />
						
					<aon:outputLabel for="Geyce_journal_purchases"
						value="#{bundle.finance_journal_purchases}" />
					<aon:inputText id="Geyce_journal_purchases"
						size="2" maxlength="2"
						value="#{exporter.configuration.purchaseJournal}" />
	
					<aon:outputLabel for="Geyce_journal_expenses"
						value="#{bundle.finance_journal_expenses}" />
					<aon:inputText id="Geyce_journal_expenses"
						size="2" maxlength="2"
						value="#{exporter.configuration.expensesJournal}" />
						
				</c:if>												
					
			</aon:panelGrid>
	
		</aon:div>
			
	</aon:form>

</ui:composition>
