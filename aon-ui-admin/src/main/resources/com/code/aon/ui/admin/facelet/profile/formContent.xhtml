<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-scroll-area">

		<aon:panelGrid columns="2">

			<aon:outputLabel for="Profile_name"
				value="#{bundle.aon_name}" />
			<aon:inputText id="Profile_name"
				size="80" required="true"
				value="#{controller.to.name}" />
					
		</aon:panelGrid>

		<c:if test="#{!controller.new}" >
		
			<aon:panelTabSet selectedTab="#{controller.selectedTab}" >
			               
				<aon:panelTab name="roles" label="#{bundle.aon_permissions}">
					<a4j:repeat value="#{controller.roles}" var="profileRole">
						<aon:div>
							<aon:selectBooleanCheckbox value="#{profileRole.checked}" />								
							<aon:outputText value="#{profileRole.label}" />
						</aon:div>
					</a4j:repeat>
				</aon:panelTab>
			               
				<aon:panelTab name="deniedModules" label="#{adminBundle.admin_modules_denied}">
					<a4j:repeat value="#{controller.deniedModules}" var="profileDeniedModule">
						<aon:div>
							<aon:selectBooleanCheckbox value="#{profileDeniedModule.checked}" />								
							<aon:outputText value="#{profileDeniedModule.label}" />
						</aon:div>
					</a4j:repeat>
				</aon:panelTab>
			
				<aon:panelTab name="deniedOptions"
					label="#{auditBundle.audit_option_denied_module}">
					<ui:include src="/com/code/aon/ui/audit/facelet/action/deniedContent.xhtml" >
						<ui:param name="skipUserLookup" value="#{true}" />						
						<ui:param name="skipDeniedContentToolbar" value="#{true}" />
						<ui:param name="controller" value="#{profileActionDenied}" />
					</ui:include>
				</aon:panelTab>
	                    			
			</aon:panelTabSet>

		</c:if>		

	</aon:div>

</ui:composition>
