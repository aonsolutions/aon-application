<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j" >

	<aon:valueParam name="skipUseScopeToolbar" default="#{false}" />

	<aon:if test="#{!skipUseScopeToolbar}" >
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarID" value="userScopeToolbar" />
			<ui:param name="innerToolbar" value="#{true}" />
			<ui:define name="toolbarContent">	
				<aon:commandButton id="userScope-store"
					title="#{bundle.aon_key_save_accelerator}"
					value="#{bundle.aon_save}"
					actionListener="#{userScopeEx.accept}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" />
			</ui:define>
		</ui:decorate>
	</aon:if>

	<aon:div styleClass="aon-scroll-area">
		<aon:if  test="#{domainSwitcher.parentDomain and scope.ayudaT}">
			<aon:inputText value="#{userScopeEx.searchValue}">
				<a4j:support event="onchange" reRender="userScopeListShuttle" actionListener="#{userScopeEx.onChange}"/>
			</aon:inputText>
		</aon:if>
		<rich:listShuttle id="userScopeListShuttle" var="to"
			sourceValue="#{userScopeEx.scopes}" targetValue="#{userScopeEx.selected}"
			listsHeight="250" sourceListWidth="400" targetListWidth="400"
			orderControlsVisible="false" fastOrderControlsVisible="false"
			sourceCaptionLabel="#{bundle.admin_available_scopes}"
			targetCaptionLabel="#{bundle.admin_selected_scopes}"
			copyAllControlLabel="#{bundle.aon_copyAll}"
			copyControlLabel="#{bundle.aon_copy}"
			removeControlLabel="#{bundle.aon_remove}"
			removeAllControlLabel="#{bundle.aon_removeAll}" >
			<rich:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_name}" />
				</f:facet>					
				<aon:outputText value="#{to.description}" />
				<aon:outputText
					rendered="#{to.domain != domainSwitcher.domainId}"
					value=" (#{userScopeEx.parentDomainDescription})" />
			</rich:column>
      		</rich:listShuttle>

	</aon:div>

</ui:composition>
