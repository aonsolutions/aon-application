<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">

	<ui:define name="configContent">

		<aon:form id="domainSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.admin_users}" />
				<ui:param name="controller" value="#{domainUser}" />
				<ui:param name="skipResetButton" value="#{domainUser.skipUserReset}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{domainUser}" />
				<ui:define name="searchContent">
		
					<aon:outputLabel for="User_login"
						value="#{bundle.aon_login}" />
					<aon:inputText id="User_login" size="80"
						valueChangeListener="#{controller.addExpression}" />
		
					<aon:outputLabel for="User_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="User_name" size="80"
						maxlength="64" valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="User_active"
						value="#{bundle.aon_active}" />
					<aon:selectOneMenu id="User_active"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-"	itemValue="#{null}" />
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
					</aon:selectOneMenu>
					
					<aon:if test="#{userUtils.newAONTheme and (domainSwitcher.betaEnabled or domainSwitcher.alphaEnabled)}">
						<aon:outputLabel for="User_portal" value="Portal" />
						<aon:selectBooleanCheckbox id="User_portal" valueChangeListener="#{controller.addPortalExpression}" />
					</aon:if>
					
					<aon:outputText value="#{bundle.admin_domain_lastAccess}" />
					<aon:div>
						<aon:outputLabel for="User_lastAccess-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="User_lastAccess-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
				
						<aon:outputLabel for="User_lastAccess-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="User_lastAccess-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
					</aon:div>						

					<aon:if test="#{aonRole.sysAdmin}" >
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{domainUserSearch.enterprise}" />
							<ui:param name="skipNewButton" value="#{true}" />
						</ui:include>
									
						<ui:include src="/com/code/aon/ui/registry/facelet/registry/lookup.xhtml" >
							<ui:param name="lookupBean" value="#{registryLookup}" />
							<ui:param name="lookupTo" value="#{domainUserSearch.registry}" />
							<ui:param name="lookupLabel" value="#{bundle.aon_entity}"/>
							<ui:param name="skipGoToButton" value="#{true}" />
							<ui:param name="skipNewButton" value="#{true}" />
						</ui:include>
					</aon:if>
								
				</ui:define>
			</ui:decorate>
			
		</aon:form>
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
		<aon:lookupButtonPopup lookup="#{registryLookup}" />
	</ui:define>
</ui:composition>
