<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:include src="/com/code/aon/ui/webmail/facelet/util/formInnerToolbar.xhtml" >
		<ui:param name="skipSearchButton" value="#{true}" />
	</ui:include>		

	<aon:div styleClass="aon-scroll-area">

		<aon:panelGrid columns="2">

			<aon:outputLabel for="DomainApplicationUser_name"
				value="#{bundle.aon_name}" />
			<aon:selectOneMenu id="DomainApplicationUser_name-New"
				rendered="#{controller.new}" required="true" 
				value="#{controller.to.user}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{domainApplication.availableUsers}" />
			</aon:selectOneMenu>						
			<aon:inputText id="DomainApplicationUser_name"
				size="80" disabled="true" rendered="#{!controller.new}"
				value="#{controller.to.user.login}" />
					
			<aon:outputLabel for="ApplicationUser_active"
				value="#{bundle.aon_active}" />
			<aon:selectBooleanCheckbox id="ApplicationUser_active"
				value="#{controller.to.active}" />
					
			<aon:outputText value="#{bundle.admin_profiles}" />
			<a4j:repeat value="#{appUser.userProfiles}" var="userProfile">
				<aon:div>
					<aon:selectBooleanCheckbox value="#{userProfile.checked}" />								
					<aon:outputText value="#{userProfile.value.name}" />
				</aon:div>
			</a4j:repeat>

		</aon:panelGrid>
		
	</aon:div>

</ui:composition>
