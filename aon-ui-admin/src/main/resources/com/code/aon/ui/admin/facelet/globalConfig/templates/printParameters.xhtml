<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigPrintParametersForm">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.admin_global_print_parameters}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
			<ui:define name="toolbarContent">
				<aon:commandButton id="save"
					value="#{bundle.aon_save}"
					actionListener="#{company.accept}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" />
			</ui:define>				
		</ui:decorate>
	
		<aon:div styleClass="aon-scroll-area">	
			<aon:panelGrid columns="2">
				<ui:include
					src="/com/code/aon/ui/company/facelet/company/printParameters1.xhtml" />
				<ui:include
					src="/com/code/aon/ui/company/facelet/company/printParameters2.xhtml" />
			</aon:panelGrid>
			<c:if test="#{company.printSaleInvoiceFooter}">
				<aon:div styleClass="aon-margin-top">
					<ui:include
						src="/com/code/aon/ui/company/facelet/saleInvoiceFooter/tab_grid.xhtml" >
						<ui:param name="footerInputTextAreaSize" value="100" />
					</ui:include>
				</aon:div>
			</c:if>			
		</aon:div>
	</aon:form>

</ui:composition>
