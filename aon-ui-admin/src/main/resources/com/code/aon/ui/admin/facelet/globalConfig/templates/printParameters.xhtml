<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigPrintParametersForm">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.admin_global_print_parameters}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
			<ui:define name="toolbarContent">
				<aon:commandButton id="save"
					value="#{bundle.aon_save}"
					reRender="globalConfigPrintParametersForm"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" >
					<aon:actionListener method="#{company.accept}" />
					<aon:actionListener method="#{printParams.accept}" />
				</aon:commandButton>
			</ui:define>				
		</ui:decorate>
	
		<aon:div styleClass="aon-scroll-area">	
			<aon:panel>
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.admin_global_general_data}" />
				</f:facet>
				<h:panelGrid columns="2" columnClasses="aon-vertical-align-top, aon-vertical-align-top">
					<aon:panelGrid columns="2" style="width:350px">
						<ui:include src="/com/code/aon/ui/company/facelet/printParameters/form_general1.xhtml" />
					</aon:panelGrid>
					<aon:panelGrid columns="2" style="width:350px">
						<ui:include src="/com/code/aon/ui/company/facelet/printParameters/form_general2.xhtml" />
					</aon:panelGrid>
				</h:panelGrid>
				<h:panelGrid columns="1" columnClasses="aon-vertical-align-top, aon-vertical-align-top">
					<aon:panelGrid columns="2" style="width:700px">
						<aon:outputLabel for="Company_document_number_length"
							value="#{bundle.company_print_document_number_length}" />
						<aon:div id="Company_document_number_length-div" style="width:380px">
							<aon:div style="display:inline-block;">
								<rich:inputNumberSpinner id="Company_document_number_length"
									value="#{company.documentNumberLength}"
									minValue="1" maxValue="10" style="width:5px" size="3" >
									<a4j:support event="onchange" reRender="Company_document_number_length-div" />
								</rich:inputNumberSpinner>
							</aon:div>
							<aon:outputText styleClass="aon-margin-left"
								value="#{bundle.aon_series}/" />
							<c:forEach begin="1" end="#{empty company.documentNumberLength ? 6 : company.documentNumberLength}">
							    <aon:outputText value="0" />
							</c:forEach>
						</aon:div>
					</aon:panelGrid>
				</h:panelGrid>
			</aon:panel>
			
			<aon:panel id="SaleInvoice-params-panel">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.finance_sale_invoice_management_module}" />
				</f:facet>
				
				<aon:if test="#{aonRole.sysAdmin and printParams.saleInvoiceParams.customReportTemplate}">
					<aon:panel style="width:350px;">
						<f:facet name="header">
							<aon:div style="margin: -15px 0 0 5px; background-color: white; display: inline;">
								<aon:selectBooleanCheckbox id="Sale_invoice_customReportTemplate"
									value="#{printParams.saleInvoiceParams.customReportTemplate}" 
									reRender="SaleInvoice-params-panel"/>
								<aon:outputLabel for="Sale_invoice_customReportTemplate"
									value="#{bundle.company_custom_template}" />
							</aon:div>
						</f:facet>
						<aon:div style="white-space: nowrap;">
							<aon:outputText value="Directorio de la plantilla: " />
							<aon:selectOneMenu value="#{printParams.saleInvoiceParams.customSaleInvoiceTemplateName}"
								disabled="#{!printParams.saleInvoiceParams.customReportTemplate}">
								<f:selectItem itemLabel=" - " itemValue="#{null}" />
								<f:selectItems value="#{printParams.saleInvoiceParams.customSaleInvoiceTemplateNames}" />
							</aon:selectOneMenu>
						</aon:div>
					</aon:panel>
				</aon:if>
				
				<h:panelGrid columns="2" columnClasses="aon-vertical-align-top, aon-vertical-align-top">
					<aon:panelGrid columns="2" style="width:350px;">
						<aon:outputLabel for="Sale_invoice_template"
							value="#{bundle.company_saleInvoice_template}" />
						<aon:div>
							<aon:if test="#{!printParams.saleInvoiceParams.customReportTemplate}">
								<aon:selectOneMenu id="Sale_invoice_template"
									value="#{printParams.saleInvoiceParams.saleInvoiceTemplate}" 
									disabled="#{printParams.saleInvoiceDefault}">
									<f:selectItems value="#{printParams.saleInvoiceTemplates}" />
									<a4j:support event="onchange" reRender="globalConfigPrintParametersForm" ajaxSingle="#{true}" />
								</aon:selectOneMenu>
								
								<aon:if test="#{printParams.saleInvoiceDefault}">
									<aon:commandButton id="new_suite_invoice-2"
										value=""
										styleClass="aon-finding-toolbar-item aon-icon-config"
										action="new_suite_invoice">
									</aon:commandButton>			
								</aon:if>
							</aon:if>
							<aon:if test="#{printParams.saleInvoiceParams.customReportTemplate}">
								<aon:outputText id="Company_invoice_template"
									value="#{bundle.company_custom_template}" />
							</aon:if>
						</aon:div>
						<aon:if test="#{!printParams.saleInvoiceDefault}">
							<ui:include src="/com/code/aon/ui/company/facelet/printParameters/form_sales1.xhtml" />
						</aon:if>
					</aon:panelGrid>
					<aon:panelGrid columns="2" style="width:350px;">
						<aon:if test="#{!printParams.saleInvoiceDefault}">
							<ui:include src="/com/code/aon/ui/company/facelet/printParameters/form_sales2.xhtml" />
						</aon:if>
					</aon:panelGrid>
				</h:panelGrid>
				
			</aon:panel>
			
			<ui:include src="/com/code/aon/ui/company/facelet/printParameters/form_reportBackground.xhtml" />
			
			<aon:if test="#{!printParams.saleInvoiceDefault}">
				<ui:include src="/com/code/aon/ui/company/facelet/printParameters/form_saleInvoiceFooter.xhtml" />
			</aon:if>		
			<aon:panel>
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.finance_fPaymentPrint_module}" />
				</f:facet>
				<aon:panelGrid columns="2" style="width:350px">
					<aon:outputLabel for="Company_financePayment_template"
						value="#{bundle.company_financePayment_template}" />
					<aon:selectOneMenu id="Company_financePayment_template"
						value="#{company.financePaymentTemplate}" >
							<f:selectItems value="#{companyCollections.financePaymentTemplates}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:panel>
			
			<aon:if test="#{actionDenied.moduleEnabled['pos'] or actionDenied.moduleEnabled['warehouse']}">
				<aon:panel>
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.product_tag_module}" />
					</f:facet>
					<aon:panelGrid id="itemTag-panel" columns="2" style="width:350px">
						<aon:outputLabel for="Company_itemTag_template"
							value="#{bundle.product_tag_print_template}" />
						<aon:selectOneMenu id="Company_itemTag_template"
							value="#{company.itemTagTemplate}" >
							<f:selectItems value="#{companyCollections.itemTagTemplate}" />
							<a4j:support event="onchange" reRender="itemTag-panel" ajaxSingle="#{true}" />
						</aon:selectOneMenu>
							
						<!-- rendered only for TEMPLATE_3 (Zebra 101.6x76.2, 1 column) -->
						<aon:outputLabel for="Company_itemTag_serializable_barcode"
							value="#{bundle.product_tag_print_serializable_barcode}"
							rendered="#{company.itemTagTemplate=='TEMPLATE_3'}" />
						<aon:inputText id="Company_itemTag_serializable_barcode" size="64"
							value="#{company.itemTagBarcodePattern}"
							rendered="#{company.itemTagTemplate=='TEMPLATE_3'}"/>
						
						<aon:outputLabel for="Company_itemTag_default_text"
							value="#{bundle.aon_text}" />
						<aon:inputText id="Company_itemTag_default_text" size="64"
							value="#{company.itemTagDefaultText}"/>
					</aon:panelGrid>
				</aon:panel>
			</aon:if>
			
			<aon:if test="#{actionDenied.moduleEnabled['warehouse']}">
				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{bundle.warehouse_manufacturing_order}" />
					</f:facet>
					<aon:panelGrid id="manufacture-panel" columns="2" style="width:350px">
						<aon:outputLabel for="Manufacture_print_tag"
							value="#{bundle.company_manufacturingOrder_print_template_tag}" />
						<aon:selectOneMenu id="Manufacture_print_tag"
							value="#{company.manufacturingOrderTemplateTag}" >
							<f:selectItem itemLabel="-" itemValue="#{null}" />
							<f:selectItems value="#{configCollections.productTypeTags}" />
						</aon:selectOneMenu>
					</aon:panelGrid>
				</aon:panel>
			</aon:if>
			
		</aon:div>
	</aon:form>
	
	<ui:include src="/com/code/aon/ui/company/facelet/printParameters/modal_reportBackground.xhtml" />
	
</ui:composition>
