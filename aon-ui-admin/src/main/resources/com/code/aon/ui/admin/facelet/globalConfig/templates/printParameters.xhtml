<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigPrintParametersForm">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.admin_global_print_parameters}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
			<ui:define name="toolbarContent">
				<aon:commandButton id="save"
					value="#{bundle.aon_save}"
					reRender="globalConfigPrintParametersForm"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" >
					<aon:actionListener method="#{company.accept}" />
					<aon:actionListener method="#{companySaleInvoiceFooter.accept}" />
				</aon:commandButton>
			</ui:define>				
		</ui:decorate>
	
		<aon:div styleClass="aon-scroll-area">	
			<aon:panel>
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.admin_global_general_data}" />
				</f:facet>
				<h:panelGrid columns="2" columnClasses="aon-vertical-align-top, aon-vertical-align-top">
					<aon:panelGrid columns="2" style="width:350px">
						<ui:include src="/com/code/aon/ui/company/facelet/company/printParams_general1.xhtml" />
					</aon:panelGrid>
					<aon:panelGrid columns="2" style="width:350px">
						<ui:include src="/com/code/aon/ui/company/facelet/company/printParams_general2.xhtml" />
					</aon:panelGrid>
				</h:panelGrid>
			</aon:panel>
			
			<aon:panel id="SaleInvoice-params-panel">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.finance_sale_invoice_management_module}" />
				</f:facet>
				
				<aon:if test="#{aonRole.sysAdmin}">
					<aon:panel style="width:350px;">
						<f:facet name="header">
							<aon:div style="margin: -15px 0 0 5px; background-color: white; display: inline;">
								<aon:selectBooleanCheckbox id="Sale_invoice_customReportTemplate"
									value="#{company.customReportTemplate}" 
									reRender="SaleInvoice-params-panel"/>
								<aon:outputLabel for="Sale_invoice_customReportTemplate"
									value="#{bundle.company_custom_template}" />
							</aon:div>
						</f:facet>
						<aon:div style="white-space: nowrap;">
							<aon:outputText value="Directorio de la plantilla: " />
							<aon:selectOneMenu value="#{company.customSaleInvoiceTemplateName}"
								disabled="#{!company.customReportTemplate}">
								<f:selectItem itemLabel=" - " itemValue="#{null}" />
								<f:selectItems value="#{company.customSaleInvoiceTemplateNames}" />
							</aon:selectOneMenu>
						</aon:div>
					</aon:panel>
				</aon:if>
				
				<h:panelGrid columns="2" columnClasses="aon-vertical-align-top, aon-vertical-align-top">
					<aon:panelGrid columns="2" style="width:350px;">
						<aon:outputLabel for="Sale_invoice_template"
							value="#{bundle.company_saleInvoice_template}" />
						<aon:div>
							<aon:if test="#{!company.customReportTemplate}">
								<aon:selectOneMenu id="Sale_invoice_template"
									value="#{company.saleInvoiceTemplate}" >
									<f:selectItems value="#{companyCollections.saleInvoiceTemplates}" />
									<a4j:support event="onchange" reRender="saleInvoice_footer-panel" ajaxSingle="#{true}" />
								</aon:selectOneMenu>
							</aon:if>
							<aon:if test="#{company.customReportTemplate}">
								<aon:outputText id="Company_invoice_template"
									value="#{bundle.company_custom_template}" />
							</aon:if>
						</aon:div>
						<ui:include src="/com/code/aon/ui/company/facelet/company/printParams_sales1.xhtml" />
					</aon:panelGrid>
					<aon:panelGrid columns="2" style="width:350px;">
						<ui:include src="/com/code/aon/ui/company/facelet/company/printParams_sales2.xhtml" />
					</aon:panelGrid>
				</h:panelGrid>
				
			</aon:panel>
			
			<ui:include src="/com/code/aon/ui/company/facelet/company/printParams_background.xhtml" />
				
			<aon:panel id="saleInvoice_footer-panel">
				<f:facet name="header">
					<aon:div style="margin: -15px 0 0 5px; background-color: white; display: inline;">
						<aon:selectBooleanCheckbox id="Company_print_saleInvoice_footer"
							value="#{company.printSaleInvoiceFooter}" >
							<a4j:support event="onclick" reRender="saleInvoice_footer-panel" ajaxSingle="#{true}" />
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="Company_print_saleInvoice_footer"
							value="#{bundle.company_saleInvoice_footer_text}" />
					</aon:div>
				</f:facet>
				<h:panelGrid columns="1" rendered="#{company.printSaleInvoiceFooter}">
					<aon:inputTextarea id="SaleInvoice_footer_text"
						cols="130" rows="6"
						value="#{companySaleInvoiceFooter.text}"/>
					<aon:div styleClass="aon-width-all aon-text-right">
						<aon:commandButton id="saleInvoice_footer_text-importLOPD"
							title="#{bundle.company_create_LOPD_text}"
							value="#{bundle.company_invoice_footer_text_generate}" reRender="saleInvoice_footer-panel"
							actionListener="#{companySaleInvoiceFooter.createLOPD}"
							styleClass="aon-commandButton" />
					</aon:div>
				</h:panelGrid>
				<aon:div rendered="#{!company.printSaleInvoiceFooter 
					and companySaleInvoiceFooter.garageDomainType
					and companySaleInvoiceFooter.garageSaleInvoiceTemplate}" >
					<aon:outputText value="#{bundle.gta_footer_text_default}: " styleClass="aon-italic aon-underline" />
					<br />
					<aon:outputText value="#{companySaleInvoiceFooter.gtaDefaultText}" styleClass="aon-italic" />
				</aon:div>
				<aon:div rendered="#{!company.printSaleInvoiceFooter 
					and companySaleInvoiceFooter.hotelDomainType
					and companySaleInvoiceFooter.hotelSaleInvoiceTemplate}" >
					<aon:outputText value="#{bundle.hotel_footer_text_default}: " styleClass="aon-italic aon-underline" />
					<br />
					<aon:outputText value="#{companySaleInvoiceFooter.hotelDefaultText}" styleClass="aon-italic" />
				</aon:div>
			</aon:panel>
			
			<aon:panel>
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.finance_fPaymentPrint_module}" />
				</f:facet>
				<aon:panelGrid columns="2" style="width:350px">
					<aon:outputLabel for="Company_financePayment_template"
						value="#{bundle.company_financePayment_template}" />
					<aon:selectOneMenu id="Company_financePayment_template"
						value="#{company.financePaymentTemplate}" >
							<f:selectItems value="#{companyCollections.financePaymentTemplates}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:panel>
			
			<aon:if test="#{actionDenied.moduleEnabled['pos'] or actionDenied.moduleEnabled['warehouse']}">
				<aon:panel>
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.product_tag_module}" />
					</f:facet>
					<aon:panelGrid id="itemTag-panel" columns="2" style="width:350px">
						<aon:outputLabel for="Company_itemTag_template"
							value="#{bundle.product_tag_print_template}" />
						<aon:selectOneMenu id="Company_itemTag_template"
							value="#{company.itemTagTemplate}" >
							<f:selectItems value="#{companyCollections.itemTagTemplate}" />
							<a4j:support event="onchange" reRender="itemTag-panel" ajaxSingle="#{true}" />
						</aon:selectOneMenu>
							
						<!-- rendered only for TEMPLATE_3 (Zebra 101.6x76.2, 1 column) -->
						<aon:outputLabel for="Company_itemTag_serializable_barcode"
							value="#{bundle.product_tag_print_serializable_barcode}"
							rendered="#{company.itemTagTemplate=='TEMPLATE_3'}" />
						<aon:inputText id="Company_itemTag_serializable_barcode" size="64"
							value="#{company.itemTagBarcodePattern}"
							rendered="#{company.itemTagTemplate=='TEMPLATE_3'}"/>
						
						<aon:outputLabel for="Company_itemTag_default_text"
							value="#{bundle.aon_text}" />
						<aon:inputText id="Company_itemTag_default_text" size="64"
							value="#{company.itemTagDefaultText}"/>
					</aon:panelGrid>
				</aon:panel>
			</aon:if>
			
			<aon:if test="#{actionDenied.moduleEnabled['warehouse']}">
				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{bundle.warehouse_manufacturing_order}" />
					</f:facet>
					<aon:panelGrid id="manufacture-panel" columns="2" style="width:350px">
						<aon:outputLabel for="Manufacture_print_tag"
							value="#{bundle.company_manufacturingOrder_print_template_tag}" />
						<aon:selectOneMenu id="Manufacture_print_tag"
							value="#{company.manufacturingOrderTemplateTag}" >
							<f:selectItem itemLabel="-" itemValue="#{null}" />
							<f:selectItems value="#{configCollections.productTypeTags}" />
						</aon:selectOneMenu>
					</aon:panelGrid>
				</aon:panel>
			</aon:if>
			
		</aon:div>
	</aon:form>



	<rich:modalPanel id="saleInvoiceBackground-modal" autosized="true">
		<f:facet name="header">
			<aon:div styleClass="aon-popupWindow-title">
				<aon:outputText value="#{bundle.aon_preview}" />
				<aon:outputText value=" - " />
				<aon:outputText value="#{bundle.finance_sale_invoice_management_module}" />
			</aon:div>
		</f:facet>
		<f:facet name="controls">
			<aon:form>
				<aon:commandButton id="saleInvoiceBackground-hidelink" type="button"
					styleClass="aon-popupWindow-close" immediate="true">
					<rich:componentControl for="saleInvoiceBackground-modal"
						attachTo="saleInvoiceBackground-hidelink" operation="hide"
						event="onclick" />
					<aon:actionHotKey key="esc" />
				</aon:commandButton>
			</aon:form>
		</f:facet>
		<aon:panel style="overflow:auto; width:580px; height:620px; padding-top:10px;" >
			<a4j:mediaOutput element="img" mimeType="#{file.mime}"
				createContent="#{company.createSaleInvoiceBackgroundContent}"
				value="#{company.saleInvoiceBackgroundFile.key}"
				styleClass="aon-border" cacheable="false" />
		</aon:panel>
	</rich:modalPanel>

	<rich:modalPanel id="offerBackground-modal" autosized="true">
		<f:facet name="header">
			<aon:div styleClass="aon-popupWindow-title">
				<aon:outputText value="#{bundle.aon_preview}" />
				<aon:outputText value=" - " />
				<aon:outputText value="#{bundle.aon_invoice_offer}" />
			</aon:div>
		</f:facet>
		<f:facet name="controls">
			<aon:form>
				<aon:commandButton id="offerBackground-hidelink" type="button"
					styleClass="aon-popupWindow-close" immediate="true">
					<rich:componentControl for="offerBackground-modal"
						attachTo="offerBackground-hidelink" operation="hide"
						event="onclick" />
					<aon:actionHotKey key="esc" />
				</aon:commandButton>
			</aon:form>
		</f:facet>
		<aon:panel style="overflow:auto; width:580px; height:620px; padding-top:10px;" >
			<a4j:mediaOutput element="img" mimeType="#{file.mime}"
				createContent="#{company.createOfferBackgroundContent}"
				value="#{company.offerBackgroundFile.key}" 
				styleClass="aon-border" cacheable="false" />
		</aon:panel>
	</rich:modalPanel>

	<rich:modalPanel id="deliveryBackground-modal" autosized="true">
		<f:facet name="header">
			<aon:div styleClass="aon-popupWindow-title">
				<aon:outputText value="#{bundle.aon_preview}" />
				<aon:outputText value=" - " />
				<aon:outputText value="#{bundle.warehouse_delivery}" />
			</aon:div>
		</f:facet>
		<f:facet name="controls">
			<aon:form>
				<aon:commandButton id="deliveryBackground-hidelink" type="button"
					styleClass="aon-popupWindow-close" immediate="true">
					<rich:componentControl for="deliveryBackground-modal"
						attachTo="deliveryBackground-hidelink" operation="hide"
						event="onclick" />
					<aon:actionHotKey key="esc" />
				</aon:commandButton>
			</aon:form>
		</f:facet>
		<aon:panel style="overflow:auto; width:580px; height:620px; padding-top:10px;" >
			<a4j:mediaOutput element="img" mimeType="#{file.mime}"
				createContent="#{company.createDeliveryBackgroundContent}"
				value="#{company.deliveryBackgroundFile.key}"
				styleClass="aon-border" cacheable="false" />
		</aon:panel>
	</rich:modalPanel>

	<rich:modalPanel id="salesBackground-modal" autosized="true">
		<f:facet name="header">
			<aon:div styleClass="aon-popupWindow-title">
				<aon:outputText value="#{bundle.aon_preview}" />
				<aon:outputText value=" - " />
				<aon:outputText value="#{bundle.sales_module}" />
			</aon:div>
		</f:facet>
		<f:facet name="controls">
			<aon:form>
				<aon:commandButton id="salesBackground-hidelink" type="button"
					styleClass="aon-popupWindow-close" immediate="true">
					<rich:componentControl for="salesBackground-modal"
						attachTo="salesBackground-hidelink" operation="hide"
						event="onclick" />
					<aon:actionHotKey key="esc" />
				</aon:commandButton>
			</aon:form>
		</f:facet>
		<aon:panel style="overflow:auto; width:580px; height:620px; padding-top:10px;" >
			<a4j:mediaOutput element="img" mimeType="#{file.mime}"
				createContent="#{company.createSalesBackgroundContent}"
				value="#{company.salesBackgroundFile.key}" 
				styleClass="aon-border" cacheable="false" />
		</aon:panel>
	</rich:modalPanel>

</ui:composition>
