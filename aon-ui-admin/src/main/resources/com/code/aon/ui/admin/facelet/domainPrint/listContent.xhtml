<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap"
		alias="Domain.description" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_domain_displayName}" />
		</f:facet>							
		<aon:outputText value="#{to.description}" />
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-iconColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_history}" />
		</f:facet>
		<aon:div onmouseover="disableRowSelector();" onmouseup="disableRowSelector();"
			onmouseout="enableRowSelector();" >
			<aon:div layout="inline"
				rendered="#{controller.currentModifications != null}">
				<aon:outputText value="&#160;"
					style="padding-left:15px;" styleClass="aon-icon-comment"/>
				<rich:toolTip value="#{controller.currentModifications}"
					styleClass="aon-width-450" />						
			</aon:div>
			<aon:commandLink id="goToDomainHistory"
				title="#{bundle.admin_domain_history}"
				styleClass="aon-button-goto" style="padding-right: 20px;padding-top: 2px;" 
				value="&#160;" immediate="true" ajaxSingle="true"
				action="domainPrint_history"
				actionListener="#{controller.onGoToDomainHistory}">
			</aon:commandLink>											
		</aon:div>			
	</aon:column>	
	
	<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-140"
		alias="Domain.type" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_type}" />
		</f:facet>							
		<aon:outputText value="#{to.type}" />
		<aon:outputText
			rendered="#{(to.type == 'ENTERPRISE') and controller.currentDomainOne}"
			value=" - #{bundle.aon_module_aonOne}" />
		<aon:outputText
			rendered="#{(to.type == 'ENTERPRISE') and (!controller.currentDomainOne)}"
			value=" - #{bundle.admin_domain_aonAIO}" />
		<rich:toolTip styleClass="aon-width-200" rendered="#{to.parent != null}" >				
			<aon:outputText value="#{to.parent.description}" />
		</rich:toolTip>		
		<aon:div styleClass="aon-margin-left" layout="inline">
			<aon:outputText value="&#160;"
				rendered="#{to.domainManagement}"
				title="#{bundle.admin_domain_domainManagement}"
				style="padding-left: 12px;" styleClass="aon-icon-tree-root" />
			<aon:outputText value="&#160;"
				rendered="#{(to.parent != null) and to.enableHeredity}"
				title="#{bundle.aon_domian_enableHeredity}"
				style="padding-left: 12px;" styleClass="aon-icon-index" />														
			<aon:outputText value="&#160;"
				rendered="#{(to.parent != null) and (!to.enableHeredity)}"
				title="#{bundle.aon_domian_disableHeredity}"
				style="padding-left: 12px;" styleClass="aon-icon-disableHeredity" />
			<aon:outputText value="&#160;"
				rendered="#{controller.payer != null}"
				title="#{bundle.admin_domain_payer}: #{controller.payer}"
				style="margin-left: 0.7em;" styleClass="aon-icon16 aon-icon-moneybag" />
			<aon:div layout="inline" 
				onmouseover="disableRowSelector();" onmouseup="disableRowSelector();"
				onmouseout="enableRowSelector();" >
				<aon:commandLink id="goToDomainBooking"
					rendered="#{to.domainManagement or (to.parent != null)}"
					title="#{bundle.config_domain_booking}"
					styleClass="aon-button-goto" style="padding-right: 20px;padding-top: 2px;" 
					value="&#160;" immediate="true" ajaxSingle="true"
					action="domainBooking_list" actionListener="#{controller.onGoToDomainBooking}" />
			</aon:div>																																		
		</aon:div>																
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-numberColumn aon-nowrap aon-width-60">
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_users}" />
		</f:facet>							
		<aon:outputText value="#{controller.currentDomainUserNumber} / #{to.maxDefinedUsers}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap" 
		alias="Domain.creationDate" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_domain_created}" />
		</f:facet>							
		<aon:outputText rendered="#{to.creationDate != null}"
			value="#{to.creationDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<rich:toolTip styleClass="aon-width-200"
			rendered="#{(to.creationUser != null) or (to.creationDate != null)}" >				
			<aon:outputText rendered="#{to.creationUser != null}"
				value="#{to.creationUser} / " />
			<aon:outputText rendered="#{to.creationDate != null}"
				value="#{to.creationDate}" >
				<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</rich:toolTip>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap"
		alias="Domain.modificationDate" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_domain_modified}" />
		</f:facet>							
		<aon:outputText rendered="#{to.modificationDate != null}"
			value="#{to.modificationDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<rich:toolTip styleClass="aon-width-200" 
			rendered="#{(to.modificationUser != null) or (to.modificationDate != null)}" >
			<aon:outputText rendered="#{to.modificationUser != null}"
				value="#{to.modificationUser} / " />
			<aon:outputText rendered="#{to.modificationDate != null}"
				value="#{to.modificationDate}" >
				<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</rich:toolTip>
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap"
		alias="Domain.lastAccessDate" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_domain_access}" />
		</f:facet>							
		<aon:outputText rendered="#{to.modificationDate != null}"
			value="#{to.lastAccessDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<rich:toolTip styleClass="aon-width-200" 
			rendered="#{(to.lastAccessUser != null) or (to.lastAccessDate != null)}" >
			<aon:outputText rendered="#{to.lastAccessUser != null}"
				value="#{to.lastAccessUser} / " />
			<aon:outputText rendered="#{to.lastAccessDate != null}"
				value="#{to.lastAccessDate}" >
				<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</rich:toolTip>
	</aon:column>	

	<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_modules}" />
		</f:facet>							
		<aon:outputText value="#{controller.currentDomainModuleList}" />
		<aon:div styleClass="aon-margin-left" layout="inline"
			rendered="#{controller.currentTirant}">
			<h:graphicImage title="#{bundle.aon_external_tirant}"
				url="#{aonResource.resolve['/images/icon-tirant-asesores.png']}" />
		</aon:div>
		<aon:div styleClass="aon-margin-left" layout="inline"
			rendered="#{controller.currentDehOnline}">				
			<h:graphicImage title="#{bundle.aon_external_dehOnline}"
				url="#{aonResource.resolve['/images/icon-deh-online.png']}" />						
		</aon:div>																								
	</aon:column>

	<aon:column styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_module_document} (MB)" />
		</f:facet>							
		<aon:outputText value="#{controller.currentDomainUsedSpaceInMB} / #{to.maxTotalDocumentSize}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn  aon-nowrap aon-width-200"
		alias="Domain.name" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_domain_url}" />
		</f:facet>							
		<aon:div onmouseover="disableRowSelector();"
			onmouseup="disableRowSelector();"
			onmouseout="enableRowSelector();" >
			<aon:outputLink target="_blank" value="https://#{controller.currentDomainURL}" >
				<aon:outputText style="#{customize.fontStyle}" value="https://#{to.name}" />
		    </aon:outputLink>
		</aon:div>
	</aon:column>	

	<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40">
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_domain_childs_short}" />
		</f:facet>							
		<aon:outputText value="#{controller.currentDomainChildNumber}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-iconColumn"
		alias="Domain.active" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_active}" />
		</f:facet>
		<aon:outputText value="&#160;"
			styleClass="aon-icon #{(to.active)?'aon-icon-checked':'aon-icon-check'}" />							
	</aon:column>									

	<aon:column styleClass="aon-editDataTable-iconColumn"
		alias="Domain.enableHeredity" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_domain_heredity}" />
		</f:facet>
		<aon:outputText value="&#160;"
			styleClass="aon-icon #{(to.enableHeredity)?'aon-icon-checked':'aon-icon-check'}" />							
	</aon:column>									

	<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-80"
		alias="Domain.expirationDate" >
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_domain_expiration_short}" />
		</f:facet>							
		<aon:outputText value="#{to.expirationDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

</ui:composition>
