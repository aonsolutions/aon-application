<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputLabel for="Module_name" value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.module}" rendered="#{formList}" />
				<aon:selectOneMenu id="Module_name"
					rendered="#{formEdit}" required="true"
					value="#{controller.to.module}">
					<f:selectItems value="#{controller.modules}" />
				</aon:selectOneMenu>		
				<f:facet name="footer">
					<aon:selectOneMenu id="Module_name-New"
						rendered="#{formNew}" required="true"
						value="#{controller.to.module}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{controller.modules}" />
					</aon:selectOneMenu>		
				</f:facet>
			</aon:column>
			
		</ui:define>
	</ui:decorate>

</ui:composition>
