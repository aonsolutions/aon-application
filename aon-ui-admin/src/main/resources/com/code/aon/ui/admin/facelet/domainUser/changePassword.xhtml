<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showChangePasswordWindow">
		<c:if test="#{domainUser.showChangePasswordWindow}">
			<rich:modalPanel id="changePasswordModalPanel" 
				rendered="#{domainUser.showChangePasswordWindow}" showWhenRendered="true"
				minWidth="400" minHeight="100" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{adminBundle.admin_change_password}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showChangePasswordWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{domainUser.showChangePasswordWindow}" value="#{false}" />
							<rich:componentControl for="changePasswordModalPanel"
								disableDefault="true" event="onclick" operation="hide"/>									
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="passwordForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div id="signToolbar" styleClass="aon-toolbar">
								<aon:commandButton id="accept"
									value="#{bundle.aon_accept}"
									reRender="showChangePasswordWindow,passwordChangedWindow"
									actionListener="#{domainUser.onChangePassword}"
									styleClass="aon-finding-toolbar-item aon-icon-accept"
									accesskey="#{bundle.aon_key_save}">
									<aon:actionHotKey key="return" />
									<f:setPropertyActionListener
										target="#{domainUser.showChangePasswordWindow}"
										value="#{false}" />
									<rich:componentControl for="changePasswordModalPanel"
										disableDefault="true" event="onclick" operation="hide"/>
								</aon:commandButton>					
								<aon:commandButton id="cancel"
									value="#{bundle.aon_cancel}"
									immediate="true" reRender="showChangePasswordWindow"
									styleClass="aon-finding-toolbar-item aon-icon-cancel"
									accesskey="#{bundle.aon_key_cancel}">
									<f:setPropertyActionListener
										target="#{domainUser.showChangePasswordWindow}"
										value="#{false}" />									
									<rich:componentControl for="changePasswordModalPanel"
										disableDefault="true" event="onclick" operation="hide"/>
								</aon:commandButton>								
							</aon:div>
							
							<aon:panelGrid columns="2">
							
								<aon:outputLabel for="DomainUser_NewPassword"
									value="#{adminBundle.admin_new_password}" />
								<aon:inputSecret id="DomainUser_NewPassword"
									required="true" size="20" maxlength="16"
									value="#{domainUser.newPassword}">
									<f:validateLength minimum="4" />
								</aon:inputSecret>
			
								<aon:outputLabel for="DomainUser_ConfirmPassword"
									value="#{adminBundle.admin_confirm_password}" />
								<aon:inputSecret id="DomainUser_ConfirmPassword"
									required="true" size="20" maxlength="16"
									value="#{domainUser.confirmPassword}" >
									<f:validateLength minimum="4" />
								</aon:inputSecret>
								
							</aon:panelGrid>
												
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
