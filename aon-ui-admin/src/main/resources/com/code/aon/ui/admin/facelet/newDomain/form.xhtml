<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="newDomainForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.admin_new_domain}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="newDomainAccept" 
						value="#{bundle.aon_accept}" 
						action="home"
						actionListener="#{adminNewDomain.onSave}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"						
						styleClass="aon-finding-toolbar-item aon-icon-accept"/>
				</ui:define>
			</ui:decorate>

			<aon:div id="domainFormContainer" styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-200,aon-panelGrid-even aon-width-auto">
				
					<aon:div>
						<aon:outputLabel value="#{bundle.aon_login_passwd}" for="passwd"/>
						<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
							<aon:outputText value="#{bundle.admin_new_domain_passwd_help}" />
						</aon:div>
					</aon:div>
					<aon:inputSecret id="passwd" required="true" styleClass="aon-inputText"
						value="#{adminNewDomain.password}" size="20" maxlength="16" />
					
					<aon:div>
						<aon:outputLabel for="NewDomain_name" value="#{bundle.admin_new_domain_name}" />
						<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
							<aon:outputText value="#{bundle.admin_new_domain_name_help}"/>
						</aon:div>
					</aon:div>
					<aon:div>
						<aon:inputText id="NewDomain_name" required="true"
							size="40" maxlength="#{adminNewDomain.maxDomainNameLength}" 
							value="#{adminNewDomain.domainName}" />
						<aon:outputText value="#{adminNewDomain.domainSuffix}"
							rendered="#{adminNewDomain.domainSuffix != null}" 
							styleClass="aon-bold" style="margin-left: 5px;"/>
							
						<aon:selectBooleanCheckbox id="NewDomain_name_check" required="true" 
								value="#{adminNewDomain.nameCheck}" style="margin-left: 30px;">									
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="NewDomain_name_check"
							value="Activar validación de acceso como NIF" />
					</aon:div>
 
					<aon:div>
						<aon:outputLabel for="NewDomain_description" value="#{bundle.admin_new_domain_description}" />
						<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
							<aon:outputText value="#{bundle.admin_new_domain_description_help}"/>
						</aon:div>
					</aon:div>
					<aon:inputText id="NewDomain_description" required="true" size="40" maxlength="64" 
						value="#{adminNewDomain.domainDescription}" />

					<aon:div>
						<aon:outputLabel for="NewDomain_owner" value="#{bundle.admin_new_domain_owner}" />
						<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
							<aon:outputText value="#{bundle.admin_new_domain_owner_help}"/>
						</aon:div>
					</aon:div>
					<aon:inputText id="NewDomain_owner" size="80" maxlength="256" required="true"
						value="#{adminNewDomain.owner}" validator="#{adminDomain.ownerCheck}" />

					<aon:div>
						<aon:outputLabel for="NewDomain_expirationDate" value="#{bundle.admin_domain_expiration}" />
						<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
							<aon:outputText value="#{bundle.admin_domain_expiration_help}"/>
						</aon:div>
					</aon:div>
					<aon:div id="expirationDateDiv">
						<aon:selectBooleanCheckbox id="NewDomain_activeExpirationDate"
							disabled="#{!adminNewDomain.enableHeredity and !adminNewDomain.loadDefaultValuesEnabled}"
							value="#{adminNewDomain.activeExpirationDate}">
							<a4j:support event="onchange" ajaxSingle="true"
								process="expirationDateDiv"
								reRender="expirationDateDiv" />																	
						</aon:selectBooleanCheckbox>
						<aon:outputLabel for="NewDomain_activeExpirationDate"
							style="#{(!adminNewDomain.enableHeredity and !adminNewDomain.loadDefaultValuesEnabled)?'color: graytext;':''}"
							value="#{bundle.aon_activate}" />
						<aon:div styleClass="aon-margin-left" layout="inline">
							<aon:selectInputDate id="NewDomain_expirationDate" 
								value="#{adminNewDomain.expirationDate}" 
								disabled="#{!adminNewDomain.activeExpirationDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
							<aon:outputText
								styleClass="aon-bold aon-italic aon-label-error"
								value="#{bundle.admin_domain_expiration_warning}"
								rendered="#{adminNewDomain.activeExpirationDate}" />
						</aon:div>
 					</aon:div>
					<aon:div>
						<aon:outputLabel styleClass="aon-outputLabel aon-input-required"
							value="#{bundle.admin_new_domain_defaults}" />
						<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
							<aon:outputText value="#{bundle.admin_new_domain_defaults_help}"/>
						</aon:div>
					</aon:div>
					<aon:div id="valuesDiv">
						<aon:if test="#{adminNewDomain.parentDomain != null}">
							<aon:div styleClass="aon-margin-top">
								<aon:selectBooleanCheckbox
									id="Domain_enableHeredity" required="true" 
									value="#{adminNewDomain.enableHeredity}">
									<a4j:support event="onchange" ajaxSingle="true"
										process="valuesDiv,expirationDateDiv"
										actionListener="#{adminNewDomain.onChangedEnableHeredity}"
										reRender="valuesDiv,expirationDateDiv" />										
								</aon:selectBooleanCheckbox>
								<aon:outputLabel for="Domain_enableHeredity"
									value="#{bundle.admin_domain_enableHeredity}" />
								<aon:if test="#{adminNewDomain.loadDefaultValuesEnabled and !(empty company.domainScopes)}">
									<aon:outputLabel for="Domain_scope" style="margin-left:2em;margin-right:0.5em;"
										value="#{bundle.aon_scope}" />
									<aon:selectOneMenu id="Domain_scope" 
										value="#{adminNewDomain.scope}">
										<f:selectItem itemLabel="-" value="#{null}"/>
										<f:selectItems value="#{company.domainScopes}" />
									</aon:selectOneMenu>
									<aon:outputLabel for="Domain_type" style="margin-left:1em;"
										value="#{bundle.admin_domain_type}" />
									<aon:selectOneMenu id="Domain_type" 
										value="#{adminNewDomain.type}" required="true" >
										<f:selectItems value="#{adminCollections.newChildDomainTypes}" />
									</aon:selectOneMenu>										
								</aon:if>		
							</aon:div>										
						</aon:if>
						<aon:if test="#{!adminNewDomain.enableHeredity}">
							<aon:div styleClass="aon-margin-top">
							
								<aon:if test="#{adminNewDomain.allowDuplicateDomain}">
									<aon:selectOneMenu id="Domain_loadDefaults"
										required="true" reRender="valuesDiv,expirationDateDiv"
										actionListener="#{adminNewDomain.onChangedLoadDefaultValues}"
										value="#{adminNewDomain.loadDefaultValuesEnabled}">
										<f:selectItem itemValue="#{true}" itemLabel="#{bundle.admin_new_domain_defaults_1}" />
										<f:selectItem itemValue="#{false}" itemLabel="#{bundle.admin_new_domain_defaults_2}" />
									</aon:selectOneMenu>				
								</aon:if>
								<aon:if test="#{!adminNewDomain.allowDuplicateDomain}">
									<aon:outputText value="(#{bundle.admin_new_domain_defaults_1})" />
								</aon:if>
								
								<aon:if test="#{adminNewDomain.loadDefaultValuesEnabled and (adminNewDomain.parentDomain == null)}">
									<aon:div styleClass="aon-margin-top">
										<aon:outputLabel for="Domain_domainManagement"
											value="#{bundle.admin_domain_domainManagement}" />
										<aon:selectBooleanCheckbox id="Domain_domainManagement"
											value="#{adminNewDomain.domainManagement}" required="true" />
										<aon:outputLabel for="Domain_type" style="margin-left:1em;"
											value="#{bundle.admin_domain_type}" />
										<aon:selectOneMenu id="Domain_type" 
											value="#{adminNewDomain.type}" required="true" >
											<f:selectItems value="#{adminCollections.newDomainTypes}" />
										</aon:selectOneMenu>
									</aon:div>		
								</aon:if>
								
								<aon:if test="#{!adminNewDomain.loadDefaultValuesEnabled}">
									<aon:div styleClass="aon-margin-top">	
										<ui:include src="/com/code/aon/ui/config/facelet/domain/lookup.xhtml" >
											<ui:param name="lookupTo" value="#{adminNewDomain.templateDomain}" />
											<ui:param name="idRequired" value="#{true}" />
											<ui:param name="skipLabel" value="#{true}" />							
											<ui:param name="lookupControllerListener" value="#{adminNewDomain.templateDomainFilter}" />
										</ui:include>
									</aon:div>
								</aon:if>
							</aon:div>
						</aon:if>
					</aon:div>
					
				</aon:panelGrid>
				
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{domainLookup}" />
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
