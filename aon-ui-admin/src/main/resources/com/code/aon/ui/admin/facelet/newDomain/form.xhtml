<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="newDomainForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{adminBundle.admin_new_domain}" />
				<ui:param name="controller" value="#{adminNewDomain}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="newDomainAccept" 
						value="#{bundle.aon_accept}" 
						actionListener="#{adminNewDomain.onSave}"
						reRender="headerOptionsForm, domainFormContainer" 
						styleClass="aon-finding-toolbar-item aon-icon-accept"/>
				</ui:define>
			</ui:decorate>

			<aon:div id="domainFormContainer" styleClass="aon-scroll-area">

				<aon:panelGrid columns="2"
					styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-200,aon-panelGrid-even aon-width-auto">
				
					<aon:outputLabel value="#{securityBundle.aon_security_user_password}" 
						for="passwd"/>
					<aon:div>
						<aon:inputSecret id="passwd" required="true"
							styleClass="aon-inputText"
							value="#{adminNewDomain.password}" size="20" maxlength="20" />
						<aon:outputText value="Por motivos de seguridad, introduzca de nuevo su clave"
							style="margin-left: 147px;"
							styleClass="aon-margin-left aon-italic"/>
					</aon:div>
					
					<aon:outputLabel for="Domain_name"
						value="Nombre del nuevo dominio" />
					<aon:div id="domainNameContainer">
						<aon:inputText id="Domain_name" required="true"
							size="20" maxlength="20" 
							value="#{adminNewDomain.domainName}" />
						<aon:outputText value="#{adminNewDomain.domainSuffix}"
								styleClass="aon-bold" style="margin-left: 5px;"/>
						<aon:outputText value="Indique el nombre del dominio mediante el cual se accedera a la aplicacion."
							style="margin-left: 20px;"
							styleClass="aon-italic"/>
					</aon:div>

					<aon:outputLabel for="Domain_description"
						value="Descripcion del nuevo dominio" />
					<aon:div>
						<aon:inputText id="Domain_description" required="true"
							size="40" maxlength="64" 
							value="#{adminNewDomain.domainDescription}" />
						<aon:outputText value="Indique la descripcion del dominio, normalmente el nombre de la empresa."
							styleClass="aon-margin-left aon-italic"/>
					</aon:div>
					
					<aon:outputLabel for="Domain_loadDefaults"
						value="Valores por defecto" />
					<aon:div>
						<aon:selectOneMenu id="Domain_loadDefaults" required="true"
							 value="#{adminNewDomain.loadDefaultValuesEnabled}">
							<f:selectItem itemValue="#{true}" itemLabel="Cargar valores del sistema" />
							<f:selectItem itemValue="#{false}" itemLabel="Cargar valores desde el dominio padre" />
						</aon:selectOneMenu>
						<aon:outputText value="Configure la carga de valores por defecto."
							style="margin-left: 55px;"
							styleClass="aon-margin-left aon-italic"/>
					</aon:div>
					
				</aon:panelGrid>
				
				<aon:div styleClass="aon-margin-top aon-padding aon-text-center aon-width-all" 
					rendered="#{adminNewDomain.success}">

					<!-- Se utliza un <h:commandButton por la navegacion al action index -->
					<h:commandButton id="configureNewDomain" immediate="true"
						value="Pulse para configurar el nuevo dominio '#{adminNewDomain.domainDescription}'" 
						actionListener="#{adminNewDomain.onConfigure}"
						action="index"
						styleClass="aon-commandButton aon-icon-commandButton aon-icon-config aon-bold">
					</h:commandButton>
					
				</aon:div>
				
				<aon:div styleClass="aon-margin-top"
					style="background-color:#444444; color: #DDDDDD;font-family: Monospace; padding: 5px;" 
					rendered="#{!adminNewDomain.success and adminNewDomain.output != null}">
					<aon:outputText value="#{adminNewDomain.output}"
						escape="false"/>
				</aon:div>
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
