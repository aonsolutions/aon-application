<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigBanksForm">
		<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.registry_banks_module}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
			<ui:param name="logs" value="Logs bancarios" />
		</ui:include>
	
		<aon:div styleClass="aon-scroll-area">	
	
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{bundle.registry_banks_module}" />
				</f:facet>

				<aon:div ajaxRendered="true" layout="none">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
						<ui:param name="controller" value="#{companyRbank}" />
						<ui:param name="innerToolbar" value="#{true}" />
						<ui:param name="skipToolbarTitle" value="true" />
						<ui:param name="skipToolbarDescription" value="true" />
					</ui:decorate>
				</aon:div>				
				
				<ui:include src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
					<ui:param name="controller" value="#{companyRbank}" />
					<ui:param name="showSuffix" value="#{true}" />
				</ui:include>
			</aon:panel>
			
			<aon:div style="margin-top:2em;" />
			
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{bundle.config_predef_paymethod}" />
				</f:facet>

				<aon:div ajaxRendered="true" layout="none">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
						<ui:param name="controller" value="#{companyRPayMethod}" />
						<ui:param name="innerToolbar" value="#{true}" />
						<ui:param name="skipToolbarTitle" value="true" />
						<ui:param name="skipToolbarDescription" value="true" />
					</ui:decorate>
				</aon:div>				

				<ui:include src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
					<ui:param name="controller" value="#{companyRPayMethod}" />
				</ui:include>
			</aon:panel>
	
		</aon:div>
	</aon:form>
	<aon:lookupButtonPopup lookup="#{accountLookup}" />
	<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
		<ui:param name="bankAccountController" value="#{companyRbank.accountHelper}" />
		<ui:param name="modalReRender" value="companyRbankData" />
	</ui:include>

</ui:composition>
