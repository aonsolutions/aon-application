<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<a4j:region>
		<aon:panelCollapsible label="#{bundle.aon_search_info}"
			headerClass="aon-panelGrid-search-info" 
			bodyClass="aon-panelGrid-search"				
			value="#{domainSearch.showOpened}" >

			<aon:panelGrid columns="2">		

				<aon:outputLabel value="#{adminBundle.admin_domain_parent}" for="Domain_id"/>
				<ui:include src="/com/code/aon/ui/config/facelet/domain/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{domainSearch.parent}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupControllerListener" value="#{domainPrint.domainFilter}" />
				</ui:include>
				
				<aon:outputLabel for="Domain_type"
					value="#{adminBundle.admin_domain_type}" />
				<aon:div id="typeDiv">
					<a4j:region>
						<a4j:repeat value="#{domainSearch.types}" rowKeyVar="index" var="type">
							<aon:div styleClass="#{(index != 0)?'aon-padding-top':''}">
								<aon:selectOneMenu id="Domain_type"
									converter="aon.EnumConverter" 
									value="#{domainSearch.types[index]}">
									<f:selectItem itemLabel="-" value="#{null}"/>
									<f:selectItems value="#{adminCollections.newDomainTypes}" />
									<a4j:support event="onchange" reRender="typeDiv"/>
								</aon:selectOneMenu>
								<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" reRender="typeDiv"
									actionListener="#{domainSearch.onRemoveType}" value="&#160;"
									rendered="#{type != null}">
									<f:param name="index" value="#{index}" />
								</aon:commandButton>
								<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" reRender="typeDiv"
									actionListener="#{domainSearch.onAddType}" value="&#160;"
									rendered="#{(type != null) and (index == (domainSearch.typesSize-1))}"/>					
							</aon:div>						
						</a4j:repeat>
					</a4j:region>
				</aon:div>								
				
				<aon:outputLabel value="#{bundle.aon_creation_date}" />
				<aon:div>
					<aon:outputLabel for="Domain_creationDate-From"
						styleClass="aon-form-date-label aon-padding-right" 
						value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Domain_creationDate-From"
						value="#{domainSearch.creationDate[0]}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
			
					<aon:outputLabel for="Domain_creationDate-To"
						styleClass="aon-form-date-label aon-padding-right" 
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Domain_creationDate-To"
						value="#{domainSearch.creationDate[1]}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
				</aon:div>	

				<aon:outputLabel value="#{bundle.aon_modification_date}" />
				<aon:div>
					<aon:outputLabel for="Domain_modificationDate-From"
						styleClass="aon-form-date-label aon-padding-right" 
						value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Domain_modificationDate-From"
						value="#{domainSearch.modificationDate[0]}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
			
					<aon:outputLabel for="Domain_modificationDate-To"
						styleClass="aon-form-date-label aon-padding-right" 
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Domain_modificationDate-To"
						value="#{domainSearch.modificationDate[1]}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
				</aon:div>	
				
				<aon:outputLabel for="Domain_active"
					value="#{bundle.aon_active}" />
				<aon:selectOneMenu id="Domain_active"
					value="#{domainSearch.active}">
					<f:selectItem itemLabel="-"	itemValue="#{null}" />
					<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
					<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
				</aon:selectOneMenu>

				<aon:outputLabel for="Domain_enableHeredity"
					value="#{adminBundle.admin_domain_heredity}" />
				<aon:selectOneMenu id="Domain_enableHeredity"
					value="#{domainSearch.enableHeredity}">
					<f:selectItem itemLabel="-"	itemValue="#{null}" />
					<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
					<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
				</aon:selectOneMenu>

				<aon:outputLabel for="Domain_domainManagement"
					value="#{adminBundle.admin_domain_domainManagement}" />
				<aon:selectOneMenu id="Domain_domainManagement"
					value="#{domainSearch.domainManagement}">
					<f:selectItem itemLabel="-"	itemValue="#{null}" />
					<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="#{true}" />
					<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="#{false}" />
				</aon:selectOneMenu>
				
				<aon:outputText value="" />
				<aon:commandButton id="search"
					title="#{bundle.aon_key_search_accelerator}"
					value="#{bundle.aon_search}" status="aonStatus"
					styleClass="aon-icon-rubber aon-search-lookup-button"
					actionListener="#{domainPrint.onSearch}"
					requestDelay="100" accesskey="#{bundle.aon_key_search}" >
					<aon:actionHotKey key="return" />
					<ui:insert name="searchButtonContent"/>
				</aon:commandButton> 

			</aon:panelGrid>
		</aon:panelCollapsible>
	</a4j:region>

</ui:composition>
