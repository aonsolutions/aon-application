<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">


	<ui:define name="configContent">

		<aon:form id="googleForm">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarID" value="adminDomainToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.admin_domain_google}" />
				<ui:define name="toolbarContent">
					
					<h:outputLink target="_blank" value="https://console.developers.google.com" >		
						<aon:outputText value="#{bundle.admin_google_console}" styleClass="aon-finding-toolbar-item aon-icon-google-console2" />	
					</h:outputLink>	
					
					<!--BOTÓN GUARDAR  -->
					<aon:commandButton id="userGoogle-store"
						title="#{bundle.aon_key_save_accelerator}"
						value="#{bundle.aon_save}"
						actionListener="#{serviceAccount.createAccount}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}" 
						action="adminGoogle_form"
					/>

					<aon:commandButton id="userGoogle-cancel"
						title="#{bundle.aon_key_cancel_accelerator}"
						value="#{bundle.aon_cancel}"
						immediate="true"
						accesskey="#{bundle.aon_key_cancel}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						action="adminGoogle_form"
						actionListener="#{serviceAccount.initialize2}"
					/>
				 
				 
				</ui:define>	
		</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">
		
					
					<aon:outputLabel for="client_id"
						value="#{bundle.client_id}" />
					<aon:inputText id="client_id" required="true"
							size="90" maxlength="128" value="#{serviceAccount.client_id}" />
							
					<aon:outputLabel for="email_address"
						value="#{bundle.email_address}" />
						<aon:inputText id="email_address" size="90" required="true"
							value="#{serviceAccount.email_address}" />
						
					<aon:outputLabel for="dominio"
						value="#{bundle.dominio}" />
						<aon:inputText id="dominio" size="90" required="true"
							value="#{serviceAccount.domain}" />
					<aon:outputLabel for="public_key"
						value="#{bundle.public_key}" />
						<aon:inputText id="public_key" size="90" required="true"
							value="#{serviceAccount.public_key}" />
					<aon:outputLabel for="private_key"
						value="#{bundle.private_key}" />
						<a4j:region>
						
							<aon:fileUpload id="RecordData_file"
								addControlLabel="#{bundle.aon_fileUpload_add}"
								stopControlLabel="#{bundle.aon_fileUpload_stop}"
								stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
								uploadControlLabel="#{bundle.aon_fileUpload_upload}"
								fileUploadListener="#{serviceAccount.fileUploaded}"
								immediateUpload="true" autoclear="true" listWidth="0px"
								listHeight="0px">
								<f:facet name="label">
									<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
								</f:facet>
								<a4j:support event="onuploadcomplete" reRender="attachmentGrid" />
							</aon:fileUpload>
							
						
							<!--aon:fileUpload id="attachFile"
								fileUploadListener="#{serviceAccount.fileUploaded}">
								<f:facet name="label">
									<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
								</f:facet>
								<a4j:support event="onuploadcomplete"
									reRender="#{serviceAccount.beanName}_attachFileDiv" />
								<a4j:support event="onupload"
									oncomplete="showFileUploadProgress();" />
								<a4j:support event="onclear"
									oncomplete="hideFileUploadProgress();" />
							</aon:fileUpload>
							<rich:jQuery name="showFileUploadProgress" timing="onJScall"
								selector="#attachFile .rich-fileupload-list-overflow"
								query="height(70);" />
							<rich:jQuery name="hideFileUploadProgress" timing="onJScall"
								selector="#attachFile .rich-fileupload-list-overflow"
								query="height(0);" /-->
						</a4j:region>
							
					<aon:outputLabel for="client_secret"
						value="#{bundle.client_secret}" />
						<aon:inputText id="client_secret" size="90" disabled="true"
							value="" />
							
					<aon:outputLabel for="limit"
						value="#{bundle.limit}" />
						<aon:inputText id="limit" size="90" required="true"
							value="#{serviceAccount.limit}" />
					
					<aon:outputLabel for="google_account"
						value="Cuenta Google" />
						<aon:inputText id="google_account" size="90" required="true"
							value="#{serviceAccount.google_account}" />
				</aon:panelGrid>

			</aon:div>
		</aon:form>		
	</ui:define>
</ui:composition>
