<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">

	<ui:define name="configContent">

		<aon:form id="domainUserList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.admin_users} (#{adminDomain.to.name})" />
				<ui:param name="controller" value="#{domainUser}" />
				<ui:param name="skipResetButton" value="#{domainUser.skipUserReset}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-back"
						title="#{bundle.aon_key_cancel_accelerator}"
						value="#{bundle.aon_back}"
						rendered="#{domainUser.backAction != null}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						actionListener="#{domainUser.onBackActionListener}"
						action="#{domainUser.backAction}"
						accesskey="#{bundle.aon_key_cancel}" />				
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{domainUser}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="User.login" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_login_user}" />
							</f:facet>
							<aon:outputText value="#{to.login}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="User.name" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.name}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.admin_profiles}" />
							</f:facet>
							<aon:outputText value="#{controller.profileList}"/>
						</aon:column>

						<aon:column styleClass="aon-width-50 aon-editDataTable-textColumn"
							alias="User.active" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_active}" />
							</f:facet>
							<aon:outputText value="&#160;"
								styleClass="#{(to.active)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}" />							
						</aon:column>
							
					</ui:define>
					<ui:define name="additionalDataTableContent" >
						<aon:div styleClass="aon-margin-top" >
							<aon:outputText value="#{controller.detailMessage}" />
						</aon:div>
					</ui:define>			
				</ui:decorate>

			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>
