<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">

	<ui:define name="configContent">

		<aon:form id="domainForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarID" value="adminDomainToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.admin_domain_management}" />
				<ui:define name="toolbarContent">
					<aon:if test="#{adminMain.termsOfServiceAccepted or aonRole.sysAdmin}" >
						<aon:commandButton id="contract"
							title="#{bundle.aon_key_save_accelerator}"
							value="#{bundle.admin_domain_contract}"
							action="adminDomain_form" actionListener="#{adminDomain.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />						
					</aon:if>						
					<aon:htmlCommandLink id="showTermsOfService"
						rendered="#{!aonRole.sysAdmin}"
						value="#{bundle.admin_service_terms}" target="_blank"
						actionListener="#{adminDomain.onDownloadTermsOfService}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
					</aon:htmlCommandLink>
					<aon:commandButton id="domainHistory" 
						rendered="#{adminDomain.historyState.model.rowCount &gt; 1}"
						action="adminDomain_history"
						value="#{bundle.aon_history}"
						styleClass="aon-finding-toolbar-item aon-icon-info" />
					<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolbarContent.xhtml">
						<ui:param name="controller" value="#{adminDomain}" />
					</ui:include>								
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">
				
					<aon:outputLabel for="Domain_description"
						value="#{bundle.admin_domain_displayName}" />
					<aon:inputText id="Domain_description" required="true"
							size="90" maxlength="128" value="#{adminDomain.to.description}" />
							
					<aon:outputLabel for="Domain_type"
						value="#{bundle.admin_domain_type}" />
					<aon:if test="#{(!aonRole.sysAdmin) or (domainSwitcher.type == 'ADMIN')}">
						<aon:inputText id="Domain_type" size="60" disabled="true"
							value="#{adminDomain.to.type}" />
					</aon:if>
					<aon:if test="#{aonRole.sysAdmin and (domainSwitcher.type != 'ADMIN')}">						
						<aon:selectOneMenu id="Domain_type" 
							required="true" value="#{adminDomain.to.type}">
							<f:selectItems value="#{adminCollections.newDomainTypes}" />
						</aon:selectOneMenu>		
					</aon:if>				
							
					<aon:if test="#{aonRole.sysAdmin or domainSwitcher.parentDomainUserInChildDomain}">							
						<aon:outputLabel for="Domain_owner"
							value="#{bundle.admin_new_domain_owner}" />
						<aon:inputText id="Domain_owner" size="90" maxlength="256"
							title="#{bundle.admin_new_domain_owner_help}"
							validator="#{adminDomain.ownerCheck}" required="true"
							value="#{adminDomain.to.owner}" />
					</aon:if>									
							
					<aon:if test="#{(domainSwitcher.type == 'CONSULTANCY') and (!domainSwitcher.childDomain)}">
						<aon:outputLabel for="Domain_externalApplications"
							value="#{bundle.aon_external_applications}" />
						<aon:div>
							<aon:selectBooleanCheckbox id="ExternalApplication_DEHOnline"
								value="#{adminDomain.dehOnline}">
							</aon:selectBooleanCheckbox>
							<aon:outputLabel for="ExternalApplication_DEHOnline"
								value="#{bundle.aon_external_dehOnline}" />			
							<aon:selectBooleanCheckbox id="ExternalApplication_Tirant"
								value="#{adminDomain.tirant}">
							</aon:selectBooleanCheckbox>
							<aon:outputLabel for="ExternalApplication_Tirant"
								value="#{bundle.aon_external_tirant}" />						
						</aon:div>
					</aon:if>
					
					<aon:outputLabel for="Domain_name"
						value="#{bundle.admin_domain_url}" />
					<aon:if test="#{!aonRole.sysAdmin}">
						<aon:outputLink id="Domain_name" target="_blank" value="http://#{adminDomain.to.name}" >
							<aon:outputText value="http://#{adminDomain.to.name}" />
					    </aon:outputLink>
					</aon:if>
					<aon:if test="#{aonRole.sysAdmin}">
						<aon:inputText id="Domain_name" required="true"
							validator="#{adminDomain.domainNameCheck}"
							size="64" maxlength="#{adminDomain.maxDomainNameLength}" value="#{adminDomain.to.name}" />

						<aon:if test="#{!domainSwitcher.childDomain}" >							
							<aon:outputLabel for="Domain_subDomainSuffix"
								value="#{bundle.admin_domain_subDomainSuffix}" />
							<aon:inputText id="Domain_subDomainSuffix"
								validator="#{adminDomain.subDomainSuffixCheck}"
								size="64" maxlength="#{adminDomain.maxDomainNameLength-2}" value="#{adminDomain.to.subDomainSuffix}" />
						</aon:if>
					</aon:if>					   				

					<aon:if test="#{adminDomain.domainApplication != null}" >
						<aon:outputLabel for="DomainApplication_auditLevel"
							value="#{bundle.audit_audit_level}" />
						<aon:selectOneMenu id="DomainApplication_auditLevel" 
							value="#{adminDomain.domainApplication.auditLevel}">
							<f:selectItems value="#{auditCollections.auditLevels}" />
						</aon:selectOneMenu>
					</aon:if>	

					<aon:outputLabel for="Domain_productDetailLevel"
						value="#{bundle.admin_product_detail_level}" />
					<aon:selectOneMenu id="Domain_productDetailLevel"
						value="#{adminDomain.productDetailLevel}">
						<f:selectItem itemLabel="#{bundle.admin_product_no_features}" itemValue="#{0}" />
						<f:selectItem itemLabel="1" itemValue="#{1}" />
						<f:selectItem itemLabel="2" itemValue="#{2}" />
						<f:selectItem itemLabel="3" itemValue="#{3}" />
					</aon:selectOneMenu>
					
					<aon:if test="#{domainSwitcher.childDomain}" >
						<aon:outputLabel for="Domain_enableHeredity"
							value="#{bundle.admin_domain_enableHeredity}" />
						<aon:selectBooleanCheckbox id="Domain_enableHeredity"
							disabled="true"
							value="#{adminDomain.to.enableHeredity}" />
					</aon:if>								

					<aon:if test="#{aonRole.sysAdmin}" >
						<aon:outputLabel for="Domain_expirationDate"
							value="#{bundle.admin_domain_expiration}" />
						<aon:selectInputDate id="Domain_expirationDate" 
							value="#{adminDomain.to.expirationDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
											
						<aon:outputLabel for="Domain_active"
							value="#{bundle.aon_active}" />
						<aon:selectBooleanCheckbox id="Domain_active"
							value="#{adminDomain.to.active}" />								

						<aon:outputLabel for="Domain_disableDomainManagement"
							value="#{bundle.admin_domain_disableDomainManagement}" />
						<aon:selectBooleanCheckbox id="Domain_disableDomainManagement"
							value="#{adminDomain.to.disableDomainManagement}" />								

						<ui:include src="/com/code/aon/ui/config/facelet/domain/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{adminDomain.to.parent}" />
							<ui:param name="lookupLabel" value="#{bundle.admin_domain_parent}" />
							<ui:param name="lookupSuffix" value="-Parent" />
							<ui:param name="lookupControllerListener" value="#{adminDomain.parentDomainFilter}" />
						</ui:include>					

						<aon:outputLabel for="Domain_oem"
							value="#{bundle.aon_oem}" />
						<aon:selectBooleanCheckbox id="Domain_oem"
							value="#{adminDomain.OEM}" />

						<ui:include src="/com/code/aon/ui/config/facelet/domain/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{adminDomain.OEMDomain}" />
							<ui:param name="lookupLabel" value="#{bundle.aon_oem_template}" />							
							<ui:param name="lookupSuffix" value="-OEM" />
							<ui:param name="lookupControllerListener" value="#{adminDomain.OEMDomainFilter}" />
						</ui:include>
								
						<ui:include src="/com/code/aon/ui/config/facelet/domain/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{adminDomain.heritableOEMDomain}" />
							<ui:param name="lookupLabel" value="#{bundle.aon_heritable_oem_template}" />							
							<ui:param name="lookupSuffix" value="-HeritableOEM" />
							<ui:param name="lookupControllerListener" value="#{adminDomain.OEMDomainFilter}" />
						</ui:include>
					</aon:if>
					
				</aon:panelGrid>
								
				<aon:div styleClass="aon-form-group-title aon-margin-top">
					<aon:div styleClass="aon-form-group-title-internal">
						<aon:outputText value="#{bundle.admin_capabilities}"/>
					</aon:div>
				</aon:div>
				<aon:panelGrid columns="2" >
					<aon:outputLabel for="Domain_maxDefinedUsers"
						value="#{bundle.admin_domain_maxDefinedUsers}" />
					<aon:div>
						<aon:inputText id="Domain_maxDefinedUsers" required="true"
							size="10" value="#{adminDomain.to.maxDefinedUsers}" >
							<f:validateLongRange minimum="#{domainUser.minimumUserNumber}" />
						</aon:inputText>
						<aon:div styleClass="aon-margin-left"  layout="inline"
							rendered="#{adminDomain.to.maxDefinedUsers &gt; domainUser.numberOfActiveUsers}">
							<aon:outputText value="&#160;" styleClass="aon-icon-warning"
								style="padding-left:12px" />
							<rich:toolTip value="#{bundle.admin_domain_user_warning}" />
						</aon:div>						
						<aon:outputFormat styleClass="aon-margin-left" value="#{bundle.admin_active_users}">
							<f:param value="#{domainUser.numberOfActiveUsers}" />
						</aon:outputFormat>
						<aon:goToButton controller="#{domainUser}"
							actionListener="#{domainUser.onSearch}"	
							action="domainUser_list" rendered="true" />						
					</aon:div>
				
					<aon:if test="#{!domainSwitcher.childDomain}" >
						<aon:outputLabel for="Domain_domainManagement"
							value="#{bundle.admin_domain_domainManagement}" />
						<aon:selectBooleanCheckbox id="Domain_domainManagement"
							disabled="#{!aonRole.sysAdmin}"
							value="#{adminDomain.to.domainManagement}" />
					</aon:if>

					<aon:outputLabel for="Domain_maxDocumentSize"
						value="#{bundle.admin_domain_maxDocumentSize}" />
					<rich:inputNumberSlider id="Domain_maxDocumentSize"
						value="#{adminDomain.to.maxDocumentSize}"
						minValue="1" maxValue="16" width="300" />
									
					<aon:outputLabel for="Domain_maxTotalDocumentSize"
						value="#{bundle.admin_domain_maxTotalDocumentSize}" />
					<h:panelGrid columns="2">
						<aon:selectOneMenu id="Domain_maxTotalDocumentSize" 
							label="#{bundle.admin_domain_maxTotalDocumentSize}"
							required="true" value="#{adminDomain.to.maxTotalDocumentSize}">
							<f:selectItems value="#{adminDomain.bookingInfo.maxTotalDocumentSizes}" />
							<f:validateLongRange minimum="#{documentManager.usedSpaceInMB}" />
						</aon:selectOneMenu>		
						<aon:outputText styleClass="aon-margin-left"
							value="#{documentManager.usedSpaceMessage}" />
					</h:panelGrid>

				</aon:panelGrid>								

				<aon:if test="#{adminDomain.bookingInfo.showApplications}" >
					<aon:div styleClass="aon-form-group-title aon-margin-top">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputText value="#{bundle.admin_modules}"/>
						</aon:div>
					</aon:div>
					<ui:include src="/com/code/aon/ui/admin/facelet/adminDomain/applications_deprecated.xhtml" />
					
					<aon:if test="#{!aonRole.sysAdmin}" >
						<aon:div styleClass="aon-note aon-margin-bottom" style="background-color:#FFFFDD;">
							<aon:div styleClass="aon-note-internal">
								<aon:panelGroup>
									<aon:outputText value="#{bundle.admin_service_terms_note}" />
								</aon:panelGroup>
							</aon:div>
						</aon:div>	
					</aon:if>
					
					<ui:include src="/com/code/aon/ui/admin/facelet/adminDomain/termsOfService.xhtml" >
						<ui:param name="controller" value="#{adminDomain}" />
					</ui:include>
				</aon:if>
								
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{domainLookup}" />
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{adminDomain}" />
		</ui:include>		
	</ui:define>
</ui:composition>
