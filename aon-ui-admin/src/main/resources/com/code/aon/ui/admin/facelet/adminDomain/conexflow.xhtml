<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showConexFlowWindow">
		<aon:if test="#{controller.showConexFlowWindow}">
			<rich:modalPanel id="conexFlowModalPanel" minHeight="260" minWidth="580" 
				rendered="#{controller.showConexFlowWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.admin_conexflow}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{controller.onClose}"
							reRender="showConexFlowWindow , aonContent" immediate="true">
							<aon:actionHotKey key="esc" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="conexFlowForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="conexFlowModalToolbar" styleClass="aon-toolbar">
									<aon:commandButton id="conexFlow-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_save}"
										actionListener="#{controller.onSaveConexFlow}"
										reRender="aonContent">
										<rich:componentControl for="conexFlowModalPanel"
											event="onclick" operation="hide"/>		
										<f:setPropertyActionListener
											target="#{controller.showConexFlowWindow}"
											value="#{false}" />		
									</aon:commandButton>
									<aon:commandButton id="conexFlow-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										actionListener="#{controller.onClose}"
										reRender="showConexFlowWindow,aonContent">
										<rich:componentControl for="conexFlowModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showConexFlowWindow}"
											value="#{false}" />		
									</aon:commandButton>
								</aon:div>
								
								<aon:div id="conexFlowModalContent" styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">
								
										<aon:outputLabel for="conexFlow_server"
											value="#{bundle.aon_server}" />
										<aon:inputText id="conexFlow_server" 
											value="#{controller.server}"
											required="true" size="70" maxlength="96" />
										
										<aon:outputLabel for="conexFlow_server_ack"
											value="#{bundle.aon_server_ack}" />
										<aon:inputText id="conexFlow_server_ack" 
											value="#{controller.serverAck}"
											required="true" size="70" maxlength="96" />
												
										<aon:outputLabel for="conexFlow_user"
											value="#{bundle.aon_login_user}" />
										<aon:inputText id="conexFlow_user" 
											value="#{controller.user}"
											required="true" size="25" maxlength="16">
											<f:validateLength minimum="16" maximum="16" />
										</aon:inputText>
										
										<aon:outputLabel for="conexFlow_keyA" value="#{bundle.aon_key} A" />
										<aon:inputText id="conexFlow_keyA"
											value="#{controller.keyA}"
											required="true" size="25" maxlength="16">
										</aon:inputText>
								
										<aon:outputLabel for="conexFlow_keyB" value="#{bundle.aon_key} B" />
										<aon:inputText id="conexFlow_keyB" 
											value="#{controller.keyB}"
											required="true" size="25" maxlength="16">
										</aon:inputText>
										
										<aon:outputLabel for="conexFlow_payMethod" value="#{bundle.finance_payMethod}" />
										<aon:selectOneMenu id="conexFlow_payMethod"
											value="#{controller.payMethod}"
											required="true">
											<f:selectItem itemLabel="-" value="#{null}" />
											<f:selectItems value="#{configCollections.noCashDirectPayMethods}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
								
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
