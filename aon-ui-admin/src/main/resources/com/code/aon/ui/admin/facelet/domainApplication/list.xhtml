<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">

	<ui:define name="configContent">

		<aon:form id="domainApplicationList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.audit_applications_module} (#{adminDomain.to.name})" />
				<ui:param name="controller" value="#{domainApplication}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{domainApplication}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="DomainApplication.application.name" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.application.name}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="DomainApplication.auditLevel" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.audit_audit_level}" />
							</f:facet>
							<aon:outputText value="#{to.auditLevel}"/>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-iconColumn"
							alias="DomainApplication.active" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_active}" />
							</f:facet>
							<aon:outputText value="&#160;"
								styleClass="aon-icon #{(to.active)?'aon-icon-checked':'aon-icon-check'}" />							
						</aon:column>
						
					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>
