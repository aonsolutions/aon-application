<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<a4j:region>
		<aon:panelCollapsible label="#{bundle.aon_search_info}"
			headerClass="aon-panelGrid-search-info" 
			bodyClass="aon-panelGrid-search"				
			value="#{domainHistory.showOpened}" >

			<aon:panelGrid columns="2">		

				<aon:outputLabel for="Domain_name"
					value="#{bundle.aon_name}" />
				<aon:inputText id="Domain_name" size="80"
					value="#{domainHistory.name}" />
				
				<aon:outputLabel value="#{bundle.aon_date}" />
				<aon:div>
					<aon:outputLabel for="Domain_date-From"
						styleClass="aon-form-date-label aon-padding-right" 
						value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Domain_date-From"
						value="#{domainHistory.date[0]}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
			
					<aon:outputLabel for="Domain_date-To"
						styleClass="aon-form-date-label aon-padding-right" 
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Domain_date-To"
						value="#{domainHistory.date[1]}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
				</aon:div>	
				
				<aon:outputLabel for="Domain_type"
					value="#{bundle.aon_type}" />
				<aon:selectOneMenu id="Domain_type"
					converter="aon.EnumConverter"
					value="#{domainHistory.type}">
					<f:selectItem itemLabel="-"	itemValue="#{null}" />
					<f:selectItems value="#{domainHistory.domainInfoTypes}" />
				</aon:selectOneMenu>
				
				<aon:outputText value="" />
				<aon:commandButton id="search"
					title="#{bundle.aon_key_search_accelerator}"
					value="#{bundle.aon_search}" status="aonStatus"
					styleClass="aon-icon-rubber aon-search-lookup-button"
					actionListener="#{domainHistory.onSearch}"
					requestDelay="100" accesskey="#{bundle.aon_key_search}" >
					<aon:actionHotKey key="return" />
				</aon:commandButton> 

			</aon:panelGrid>
		</aon:panelCollapsible>
	</a4j:region>

</ui:composition>
