<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="removeDomainForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{adminBundle.admin_remove_domain}" />
				<ui:param name="controller" value="#{adminRemoveDomain}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="removeDomainAccept" 
						value="#{bundle.aon_remove}" 
						actionListener="#{adminRemoveDomain.onRemove}"
						reRender="domainFormContainer"
						disabled="#{adminRemoveDomain.domain == null}"
						onclick="if (!confirm('#{bundle.aon_remove} #{adminRemoveDomain.domain.description}?'))  return false;"
						styleClass="aon-finding-toolbar-item aon-icon-accept"/>
				</ui:define>
			</ui:decorate>

			<aon:div id="domainFormContainer" styleClass="aon-scroll-area">

				<aon:panelGrid columns="2"
					styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-200,aon-panelGrid-even aon-width-auto">
				
					<aon:outputLabel value="#{securityBundle.aon_security_user_password}" for="passwd"/>
					<aon:inputSecret id="passwd" required="true" styleClass="aon-inputText"
						value="#{adminRemoveDomain.password}" size="20" maxlength="20" />

					<aon:outputLabel value="#{adminBundle.admin_remove_domain_domain}" for="domain"/>
					<aon:div id="domainSelection">
						<aon:selectOneMenu id="domain" required="true"
							reRender="removeDomainAccept, domainSelection"
							value="#{adminRemoveDomain.domain}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{adminRemoveDomain.domains}" />
						</aon:selectOneMenu>
						<aon:outputText value="#{adminRemoveDomain.domain.name}" 
							rendered="#{adminRemoveDomain.domain != null}"
							styleClass="aon-margin-left aon-bold" />
					</aon:div>						

					<aon:outputLabel for="Domain_name" value="#{adminBundle.admin_remove_domain_name}" />
					<aon:inputText id="Domain_name" required="true" size="50" maxlength="64" 
						value="#{adminRemoveDomain.domainName}" />
				</aon:panelGrid>
				
				<aon:div styleClass="aon-margin-top"
					style="background-color:#DDDDDD; font-family: Monospace; padding: 5px;" 
					rendered="#{adminRemoveDomain.output != null}">
					<aon:outputText value="#{adminRemoveDomain.output}"
						escape="false"/>
				</aon:div>
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
