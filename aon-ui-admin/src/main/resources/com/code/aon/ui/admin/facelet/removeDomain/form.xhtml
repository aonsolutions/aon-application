<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="removeDomainForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.admin_remove_domain}" />
				<ui:define name="toolbarContent">
					<aon:confirmButton id="removeDomainAccept"
						title="#{bundle.aon_key_remove_accelerator}"
						value="#{bundle.aon_remove}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{adminRemoveDomain.onRemove}"
						confirmOnClick="Richfaces.showModalPanel('waitProccess')"
						confirmOnComplete="Richfaces.hideModalPanel('waitProccess')"
						accesskey="#{bundle.aon_key_remove}" />				
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:div id="domainRemoveWarning" styleClass="aon-text-center">
					<aon:div styleClass="aon-margin-bottom aon-padding aon-bold"
						 style="color:red; font-size: 1.4em; border: solid 1px red;"
						 rendered="#{adminRemoveDomain.domain.id != null}">
						<aon:outputText value="#{bundle.admin_remove_domain_warning}"/>
						<aon:outputText value="&#160;"/>
						<aon:div>
							<aon:outputText value="#{adminRemoveDomain.domain.description}"/>
						</aon:div>
					</aon:div>
				</aon:div>

				<aon:panelGrid columns="2">
				
					<aon:outputLabel value="#{bundle.admin_remove_domain_domain}" for="Domain_id"/>
					<ui:include src="/com/code/aon/ui/config/facelet/domain/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{adminRemoveDomain.domain}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />					
						<ui:param name="lookupDisabled" value="#{adminRemoveDomain.domainDisabled}" />		
						<ui:param name="lookupReRender" value="domainRemoveWarning" /> 
						<ui:param name="lookupControllerListener" value="#{adminRemoveDomain.domainFilter}" />
					</ui:include>
				
					<aon:outputLabel value="#{bundle.aon_login_passwd}" for="passwd"/>
					<aon:inputSecret id="passwd" required="true" styleClass="aon-inputText"
						value="#{adminRemoveDomain.password}" size="20" maxlength="16" />

				</aon:panelGrid>
				
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{domainLookup}" />
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />		
	</ui:define>
</ui:composition>
