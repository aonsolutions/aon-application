<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="applicationForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{adminBundle.admin_applications}" />
				<ui:param name="controller" value="#{adminApplication}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">

					<aon:outputLabel for="Applicaiton_name"
						value="#{bundle.aon_name}" />
					<c:if test="#{adminApplication.new}" >
						<aon:inputText id="Applicaiton_name"
							validator="#{adminApplication.idCheck}" 
							size="80" required="true"
							value="#{adminApplication.to.name}" />
					</c:if>
					<c:if test="#{!adminApplication.new}" >
						<aon:inputText id="Applicaiton_name"
							size="80" disabled="true" value="#{adminApplication.to.name}" />
					</c:if>

					<aon:outputLabel for="Applicaiton_description"
						value="#{bundle.aon_description}" />
					<aon:inputTextarea id="Applicaiton_description"
						value="#{adminApplication.to.description}"
						required="true" cols="80" rows="5" >
						<f:validateLength maximum="2048" />
					</aon:inputTextarea>

					<aon:outputLabel for="Applicaiton_contratable"
						value="#{adminBundle.admin_application_contratable}" />
	                <aon:selectBooleanCheckbox id="Applicaiton_contratable"
						value="#{adminApplication.to.contratable}"/>						
										
				</aon:panelGrid>
								
				<aon:panelTabSet rendered="#{!adminApplication.new}"
					selectedTab="#{adminApplication.selectedTab}">

					<aon:panelTab name="roles"
						label="#{adminBundle.admin_roles}">
						<ui:include src="/com/code/aon/ui/admin/facelet/role/grid.xhtml" />
                    </aon:panelTab>

					<aon:panelTab name="profiles"
						label="#{adminBundle.admin_profiles}">
						<ui:include src="/com/code/aon/ui/admin/facelet/profile/grid.xhtml" >
							<ui:param name="controller" value="#{applicationProfile}" />
						</ui:include>
                    </aon:panelTab>

				</aon:panelTabSet>		
												
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
