<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:form id="domainsList">

		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">			
			<aon:div styleClass="aon-portlet-title">
				<aon:div styleClass="aon-portlet-title-buttons" style="width:250px;border-left:0;">
					<aon:commandLink id="gwt_consoleModule-console"
						action="gwt_consoleModule-console"
						style="padding-top:2px;padding-bottom:2px;margin-right:5px;"
						value="[Console Module]" />
					<aon:commandLink id="serachDomainDesktop" 
						title="#{bundle.admin_domain_list}"
						value="&#160;" style="padding-top:2px;padding-bottom:2px;"
						styleClass="aon-icon-portlet aon-icon-category aon-margin-right" 
						actionListener="#{domainPrint.onEditSearch}"
						action="domainPrint_search" />
					<aon:if test="#{aonRole.admin}">
						<aon:commandLink id="newDomainDesktop" 
							title="#{bundle.admin_new_domain}"
							value="&#160;" style="padding-top:2px;padding-bottom:2px;"
							styleClass="aon-icon-portlet aon-icon-new" 
							actionListener="#{domains.onNewDomain}"
							action="newDomain_form"/>
					</aon:if> 
				</aon:div>
				<aon:outputText value="#{bundle.config_domain_module}"
					styleClass="aon-bold aon-icon aon-icon-company"/>
			</aon:div>
			<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
			
				<aon:div styleClass="aon-padding-bottom">
					<aon:outputLabel for="domainFilter"
						styleClass="aon-italic aon-margin-right aon-bold"
						value="#{bundle.aon_filter}:"/>
					<aon:inputText id="domainFilter" size="80" value="#{domains.filter}">
						<a4j:support 
							event="onkeyup"
							reRender="domainSwitcherTableContainer"
							eventsQueue="domainSwitcherFilterKeyUp"
							actionListener="#{domains.onChangeFilter}"
							requestDelay="500"
							ajaxSingle="true"
							ignoreDupResponses="true"
							limitToList="true"/>
					</aon:inputText>
					<aon:outputLabel for="Domains_allDomains"
						styleClass="aon-italic aon-bold aon-margin-left aon-margin-right" 
						value="#{bundle.admin_domain_all_domains}" />
					<aon:selectBooleanCheckbox id="Domains_allDomains"
						value="#{domains.allDomains}" >
						<a4j:support 
							event="onclick"
							reRender="domainSwitcherTableContainer"
							eventsQueue="domainSwitcherFilterKeyUp"
							actionListener="#{domains.onChangeAllDomains}"
							requestDelay="500"
							ajaxSingle="true"
							ignoreDupResponses="true"
							limitToList="true"/>						
					</aon:selectBooleanCheckbox>													
				</aon:div>
			
				<aon:div id="domainSwitcherTableContainer" styleClass="aon-width-all">
					<aon:methodParam name="rowSelectorAction" value="home" />
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
						<ui:param name="controller" value="#{domains}" />
						<ui:param name="rowSelectorReRender" value="aonHeader,aonContent" />
						<ui:param name="skipFocusFirst" value="true" />
						<ui:define name="columns">
							<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap"
								alias="Domain.description" >
								<f:facet name="header">
									<aon:outputText value="#{bundle.admin_domain_displayName}" />
								</f:facet>							
								<aon:outputText value="#{to.description}" />
							</aon:column>
							<aon:if test="#{domains.allDomains}">
								<aon:column styleClass="aon-editDataTable-textColumn  aon-nowrap"
									alias="Domain.parent&lt;description" >
									<f:facet name="header">
										<aon:outputText value="#{bundle.admin_domain_parent}" />
									</f:facet>							
									<aon:outputText value="#{to.parent.description}" />
								</aon:column>
							</aon:if>
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-80"
								alias="Domain.type" >
								<f:facet name="header">
									<aon:outputText value="#{bundle.admin_domain_type}" />
								</f:facet>							
								<aon:outputText value="#{to.type}" />
							</aon:column>
							<aon:column styleClass="aon-editDataTable-iconColumn"
								alias="Domain.active" >
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_active}" />
								</f:facet>
								<aon:outputText value="&#160;"
									styleClass="aon-icon #{(to.active)?'aon-icon-checked':'aon-icon-check'}" />							
							</aon:column>									
							<aon:column styleClass="aon-editDataTable-iconColumn"
								alias="Domain.domainManagement" >
								<f:facet name="header">
									<aon:outputText value="#{bundle.admin_domain_domainManagement}" />
								</f:facet>
								<aon:outputText value="&#160;"
									styleClass="aon-icon #{(to.domainManagement)?'aon-icon-checked':'aon-icon-check'}" />							
							</aon:column>									
							<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-200"
								alias="Domain.name" >
								<f:facet name="header">
									<aon:outputText value="#{bundle.admin_domain_url}" />
								</f:facet>							
								<aon:div onmouseover="disableRowSelector();"
									onmouseup="disableRowSelector();"
									onmouseout="enableRowSelector();" >
									<aon:outputLink target="_blank" value="https://#{domains.currentDomainURL}" >
										<aon:outputText style="#{customize.fontStyle}" value="https://#{to.name}" />
								    </aon:outputLink>
								</aon:div>
							</aon:column>
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40">
								<f:facet name="header">
									<aon:outputText value="#{bundle.admin_domain_childs_short}" />
								</f:facet>							
								<aon:outputText value="#{domains.currentDomainChildNumber}" />
							</aon:column>
							<aon:if test="#{aonRole.admin}">
								<aon:column styleClass="aon-width-30 aon-vertical-align-top">
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:commandButton id="#{dataTableId}-remove"
										onmouseover="disableRowSelector();"
										onmouseup="disableRowSelector();"
										onmouseout="enableRowSelector();"
										title="#{bundle.admin_remove_domain} (#{bundle.aon_key_remove_line_accelerator})"
										action="removeDomain_form" actionListener="#{domains.onRemoveDomain}"
										rendered="#{domains.currentDomainChildNumber == 0}"
										styleClass="aon-editDataTable-button aon-icon-delete"
										accesskey="#{bundle.aon_key_remove_line}" />
								</aon:column>
							</aon:if>
						</ui:define>
					</ui:decorate>
				</aon:div>

			</aon:div>

		</aon:div>

	</aon:form>

</ui:composition>
