<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="domainsList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{configBundle.config_domains}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">			
				<aon:div styleClass="aon-portlet-title">
					<aon:outputText value="#{configBundle.config_domain_module}"
						styleClass="aon-portlet-title-text aon-icon aon-icon-company"/>
				</aon:div>
				<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
				
					<aon:div styleClass="aon-padding-bottom">
						<aon:outputLabel for="domainFilter"
							styleClass="aon-italic aon-margin-right aon-bold"
							value="#{bundle.aon_filter}:"/>
						<aon:inputText id="domainFilter" size="80" value="#{domains.filter}">
							<a4j:support 
								event="onkeyup"
								reRender="domainSwitcherTableContainer"
								eventsQueue="domainSwitcherFilterKeyUp"
								requestDelay="500"
								ajaxSingle="true"
								ignoreDupResponses="true"
								limitToList="true"/>
						</aon:inputText>
					</aon:div>
				
					<aon:div id="domainSwitcherTableContainer" styleClass="aon-width-all">
						<aon:methodParam name="rowSelectorAction" value="start" />
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
							<ui:param name="controller" value="#{domains}" />
							<ui:param name="rows" value="40" />
							<ui:param name="skipFocusFirst" value="true" />
							<ui:define name="columns">
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
									<aon:outputText value="#{to.description}" />
								</aon:column>
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
									<aon:outputText value="#{to.name}" />
								</aon:column>
							</ui:define>
						</ui:decorate>
					</aon:div>

				</aon:div>

			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>
