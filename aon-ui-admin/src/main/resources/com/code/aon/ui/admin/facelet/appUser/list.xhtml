<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/webmail/facelet/util/listInnerToolbar.xhtml" >
		<ui:param name="skipSearchButton" value="#{true}" />
		<ui:define name="additionalToolbarContent" >
			<aon:commandButton id="#{toolbarID}-overload"
				value="#{bundle.admin_overload}"
				rendered="#{adminDomain.parentDomain != null}"
				reRender="#{controller.beanName}Div"
				styleClass="aon-finding-toolbar-item aon-icon-new" >
				<f:setPropertyActionListener value="#{true}"
					target="#{controller.showParentDomainUsers}" />
				<aon:actionListener method="#{controller.onReset}" />									
			</aon:commandButton>
		</ui:define>
	</ui:decorate>

	<aon:div styleClass="aon-scroll-area">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
			<ui:param name="showNote" value="#{false}" />
			<ui:define name="columns">
		
				<aon:column styleClass="aon-width-180 aon-editDataTable-textColumn"
					alias="ApplicationUser.user.login" >
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_name}" />
					</f:facet>
					<aon:outputText value="#{to.user.login}"/>
				</aon:column>
		
				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="#{bundle.admin_profiles}" />
					</f:facet>
					<aon:outputText value="#{controller.profileList}"/>
				</aon:column>
		
				<aon:if test="#{adminDomain.parentDomain != null}">		
					<aon:column styleClass="aon-width-160 aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company}" />
						</f:facet>
						<aon:outputText value="#{controller.userDomain.name}"/>
					</aon:column>
				</aon:if>
		
				<aon:column styleClass="aon-editDataTable-iconColumn"
					alias="ApplicationUser.active" >
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_active}" />
					</f:facet>
					<aon:outputText value="&#160;"
						styleClass="aon-icon #{(to.active)?'aon-icon-checked':'aon-icon-check'}" />							
				</aon:column>		

			</ui:define>
	
		</ui:decorate>
	</aon:div>

</ui:composition>
