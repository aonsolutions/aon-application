<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigContractParametersForm">
	
		<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.admin_global_contract_parameters}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
		</ui:include>
	 
		<aon:div styleClass="aon-scroll-area">	
	
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{bundle.payroll_contract_clauses}" />
				</f:facet>
				
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="controller" value="#{enterpriseClause}" />
					<ui:param name="innerToolbar" value="#{true}" />
					<ui:param name="skipToolbarTitle" value="true" />
					<ui:param name="skipToolbarDescription" value="true" />
				</ui:decorate>
	
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/additionalClauses/formContent.xhtml" >
					<ui:param name="controller" value="#{enterpriseClause}" />
				</ui:include>
				
			</aon:panel>
			
			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{bundle.payroll_contractDocument_default_values}" />
				</f:facet>
			
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/contractInfo/grid.xhtml" >
					<ui:param name="controller" value="#{contractCommonValues}" />
					<ui:param name="showContractFieldsColumn" value="#{true}" />
				</ui:include>
			
			</aon:panel>	
	
		</aon:div>
	</aon:form>

</ui:composition>
