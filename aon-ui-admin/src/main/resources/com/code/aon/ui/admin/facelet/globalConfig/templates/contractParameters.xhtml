		<aon:div styleClass="aon-scroll-area">

						<ui:param name="controller" value="#{enterpriseClauses}" />
						<ui:param name="innerToolbar" value="#{true}" />
						<ui:param name="skipToolbarTitle" value="true" />
						<ui:param name="skipToolbarDescription" value="true" />
					</ui:decorate>
				</aon:div>				
				
				<aon:div styleClass="aon-scroll-area">
					<ui:include src="/com/code/aon/ui/registry/facelet/documentManager/tab_grid.xhtml">

				</aon:div>
			</aon:panel>
