<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<meta name="gwt:property" content="locale=es_ES" />

	<aon:valueParam name="module" default="aon_gwt_payroll" />	
	<aon:valueParam name="entryPoint" default="MainCertificates" />
	<aon:valueParam name="subEntryPoint" default="" />
	<aon:valueParam name="gwtDomain" default="#{domainSwitcher.domainId}" />
	<aon:valueParam name="gwtDomainName" default="#{domainSwitcher.domainNameURL}" />
	<aon:valueParam name="gwtUser" default="#{domainSwitcher.currentUser}" />

	<style>
		body {
			margin: 0;
		}
	</style>

	<div id="rootPanel"
		style="position: absolute;width: calc(100% - 160px); min-height: 100%; height: auto !important; height: 100%; margin: 0;">
	</div>

	<script type="text/javascript">
	  //<![CDATA[
			
		function drawChartsCallback(){
		
		}
		
	 	function getCurrentDomain() {
			return #{gwtDomain};
		}
		function getCurrentDomainName() {
	       	return "#{gwtDomainName}"
	  	}
		function getCurrentDomainNameURL() {
        	return '#{domainSwitcher.currentDomainNameURL}';
        }
		function getCurrentUser() {
	       	return "#{gwtUser}"
	  	}
		
		function getSubEntryPoint() {
        	return "#{subEntryPoint}";
        }
		
		function isTediSnapshot() {
	       	return false;
	  	}

		var search = "/#{module}.nocache.js";
		var scripts = window.document.getElementsByTagName("script");
		for (var i = 0; i < scripts.length; ++i) {
			var script = scripts[i]; 
			if (script.src != null && script.src.indexOf(search) != -1) {
				var parent = script.parentNode;
				parent.removeChild(script);
				break;
			}
		}

		var iframes = window.document.getElementsByTagName("iframe");
		for (var i = 0; i < iframes.length; ++i) {
			var iframe = iframes[i]; 
			if (iframe.src != null && iframe.id == "#{module}") {
				var parent = iframe.parentNode;
				parent.removeChild(iframe);
				break;
			}
		}

	    	 
		function startModule() {
			localStorage.removeItem('rootPanel');
			localStorage.removeItem('aon_session_id');
			if (window.document.createElement && window.document.getElementsByTagName) {
				var script = window.document.createElement("script");
				script.type = "text/javascript";
				script.defer = "true";
				script.src = "#{module}/#{module}.nocache.js?entryPoint=#{entryPoint}";
				var heads = window.document.getElementsByTagName("head");
				if (heads && heads[0]) {
					heads[0].appendChild(script);
					triggerModuleStart();
				}
			}
		}
	
	    function triggerModuleStart(){
	        try{
	        	#{module}.onInjectionDone("#{module}");
	        	if ( !window.document.createEventObject ) {
	            	var evt = window.document.createEvent("HTMLEvents");
	            	evt.initEvent("DOMContentLoaded", true, true);
	            	window.document.dispatchEvent(evt);
	           	}
	        } catch ( e ) {
	        	// window.setTimeout("triggerModuleStart()", 100 );
	        } 
	    }
		localStorage.setItem('aon_domain_id', #{domainSwitcher.domainId});
		localStorage.setItem('aon_domain_name', '#{domainSwitcher.currentDomainNameURL}');
		localStorage.setItem('aon_domain_login', '#{domainSwitcher.currentUser}');
		localStorage.setItem('aon_solutions', 'true');
		startModule();
		//]]>
	</script>
</ui:composition>
