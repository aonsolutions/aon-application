<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigDigitalCertificatesForm">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.registry_digital_certificates}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
			<ui:define name="toolbarContent">
				<aon:commandButton id="save"
					value="#{bundle.aon_save}"
					actionListener="#{company.accept}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" />
			</ui:define>				
		</ui:decorate>
	
		<aon:div styleClass="aon-scroll-area">	
	
			<aon:panelGrid id="companyOtherData" columns="2">		
				<ui:include
					src="/com/code/aon/ui/company/facelet/company/digitalCerficateParameters.xhtml" />
			</aon:panelGrid>
						
			<aon:div styleClass="aon-margin-top">
				<ui:include src="/com/code/aon/ui/registry/facelet/rattach/tab_grid.xhtml">
					<ui:param name="controller" value="#{companyCertificate}" />
					<ui:param name="skipCategoryColumn" value="#{true}" />
				</ui:include>
			</aon:div>
	
		</aon:div>
	</aon:form>

</ui:composition>
