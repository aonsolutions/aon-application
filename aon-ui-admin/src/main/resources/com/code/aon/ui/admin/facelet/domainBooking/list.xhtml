<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="domainBookingList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.config_domain_booking}" />
				<ui:param name="toolbarDescription" value="" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="back"
						value="#{bundle.aon_back}" immediate="true"
						rendered="#{domainBooking.showBackButton}"
						action="#{domainBooking.backAction}"
						title="#{bundle.aon_key_cancel_accelerator}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>					
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:div styleClass="aon-width-all aon-text-right aon-margin-bottom">
					<aon:outputText 
						styleClass="aon-italic aon-bold aon-margin-right" 
						value="#{bundle.admin_domain_show}:" />
					<aon:outputLabel for="Domains_showInactive"
						styleClass="aon-italic" 
						value="SMB" />
					<aon:selectBooleanCheckbox id="Domains_showSMB"
						value="#{domainBooking.showSMB}" >
						<a4j:support 
							event="onclick"
							reRender="domainBookingList"
							actionListener="#{domainBooking.onChangeShow}"
							requestDelay="500"
							ajaxSingle="true"
							ignoreDupResponses="true"
							limitToList="true"/>						
					</aon:selectBooleanCheckbox>
					<aon:outputLabel for="Domains_showInactive"
						styleClass="aon-italic" 
						value="AiO" />
					<aon:selectBooleanCheckbox id="Domains_showAio"
						value="#{domainBooking.showAio}" >
						<a4j:support 
							event="onclick"
							reRender="domainBookingList"
							actionListener="#{domainBooking.onChangeShow}"
							requestDelay="500"
							ajaxSingle="true"
							ignoreDupResponses="true"
							limitToList="true"/>						
					</aon:selectBooleanCheckbox>
					
					<aon:outputLabel for="Domains_showInactive"
						styleClass="aon-italic" 
						value="#{bundle.admin_domain_show_inactives}" />
					<aon:selectBooleanCheckbox id="Domains_showInactive"
						value="#{domainBooking.showInactive}" >
						<a4j:support 
							event="onclick"
							reRender="domainBookingList"
							actionListener="#{domainBooking.onChangeShow}"
							requestDelay="500"
							ajaxSingle="true"
							ignoreDupResponses="true"
							limitToList="true"/>						
					</aon:selectBooleanCheckbox>			
					<aon:outputLabel for="Domains_showExpired"
						styleClass="aon-italic" 
						value="#{bundle.admin_domain_show_expired}" />										
					<aon:selectBooleanCheckbox id="Domains_showExpired"
						value="#{domainBooking.showExpired}" >
						<a4j:support 
							event="onclick"
							reRender="domainBookingList"
							actionListener="#{domainBooking.onChangeShow}"
							requestDelay="500"
							ajaxSingle="true"
							ignoreDupResponses="true"
							limitToList="true"/>						
					</aon:selectBooleanCheckbox>
				</aon:div>			
				
				<aon:div styleClass="aon-margin-bottom">
					<aon:panelCollapsible label="#{bundle.admin_domain_management}" >
						<aon:div styleClass="aon-margin-top">
						
							<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
								<ui:param name="controller" value="#{domainBooking.parentState}" />
								<ui:param name="showDataScroller" value="#{false}" />
								<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
								<ui:param name="skipSelectButton" value="#{true}" />					
								<ui:define name="columns">
								
									<aon:column styleClass="aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_name}" />
										</f:facet>							
										<aon:outputText value="#{to.description}"/>
									</aon:column>
								
									<aon:column styleClass="aon-editDataTable-textColumn">
										<f:facet name="header">
											<aon:outputText value="#{bundle.admin_modules_booked}" />
										</f:facet>							
										<aon:outputText value="#{domainBooking.bookingModuleList}"/>
									</aon:column>
									
									<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_type}" />
										</f:facet>							
										<aon:outputText value="#{to.type}" />
										<aon:div styleClass="aon-margin-left" layout="inline">
											<aon:outputText value="&#160;"
												rendered="#{domainBooking.bookingInfo.payerDomain.id != null}"
												title="#{bundle.admin_domain_payer}: #{domainBooking.bookingInfo.payerDomain.description}"
												styleClass="aon-icon16 aon-icon-moneybag" />
										</aon:div>																										
									</aon:column>
									
									<aon:column styleClass="aon-text-center aon-width-40 aon-nowrap">
										<f:facet name="header">
											<aon:outputText value="#{bundle.admin_users}" />
										</f:facet>							
										<aon:outputText
											style="#{(domainBooking.numberOfActiveUsers!=to.maxDefinedUsers)?'color:red;':''}"
											value="#{domainBooking.numberOfActiveUsers} / #{to.maxDefinedUsers}" />											
									</aon:column>		
									
									<aon:column styleClass="aon-text-center aon-nowrap aon-width-60 ">
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_module_document}" />
										</f:facet>							
										<aon:outputText value="#{domainBooking.maxTotalDocumentSize}" />
									</aon:column>

								</ui:define>
							</ui:decorate>						
						</aon:div>				
					</aon:panelCollapsible>
				</aon:div>
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{domainBooking}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />					
					<ui:define name="columns">
				
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_name}" />
							</f:facet>							
							<aon:outputText value="#{to.description}"
								title="#{(!to.active)?bundle.admin_domain_inactive:''}#{(to.expired)?bundle.admin_domain_expired:''}"
								style="#{(!to.active or to.expired)?'color:red;font-style:italic;':''}"/>
							<f:facet name="footer">
								<aon:div style="float:right">
									<aon:outputText	styleClass="aon-italic"
										value="#{bundle.config_domain_booking_total}" />
								</aon:div>
							</f:facet>
						</aon:column>
				
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_type}" />
							</f:facet>							
							<aon:outputText value="#{to.type}" />
							<aon:div styleClass="aon-margin-left" layout="inline">
								<aon:outputText value="&#160;"
									rendered="#{to.enableHeredity}"
									title="#{bundle.aon_domian_enableHeredity}"
									styleClass="aon-icon2 aon-icon-index" />														
								<aon:outputText value="&#160;"
									rendered="#{!to.enableHeredity}"
									title="#{bundle.aon_domian_disableHeredity}"
									styleClass="aon-icon2 aon-icon-disableHeredity" />
								<aon:outputText value="&#160;"
									rendered="#{to.payerDomain != null}"
									title="#{bundle.admin_domain_payer}: #{to.payerDomain}"
									styleClass="aon-icon16 aon-icon-moneybag" />
							</aon:div>																
						</aon:column>
						
						<aon:column styleClass="aon-text-center aon-nowrap aon-width-60 ">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_document}" />
							</f:facet>							
							<aon:outputText value="#{to.maxTotalDocumentSize}" />
						</aon:column>
						
						<aon:column styleClass="aon-text-center aon-width-40 aon-nowrap">
							<f:facet name="header">
								<aon:outputText style="text-transform: none;"
									value="#{bundle.admin_domain_aonSMB}" />
							</f:facet>							
							<aon:outputText rendered="#{!to.aonSmb}" value="-" />
							<aon:outputText rendered="#{to.aonSmb and to.maxDefinedUsers > 0}"
								style="#{(to.payerDomain != null)?'color:blue;':((to.activeUsers!=to.maxDefinedUsers)?'color:red;':'')}"
								value="#{to.activeUsers} / #{to.maxDefinedUsers}" />
							<aon:outputText rendered="#{to.aonSmb and to.maxDefinedUsers == 0}" 
								styleClass="aon-icon-check-black" style="padding-left:12px" value=""/>
							<f:facet name="footer">
								<aon:div style="float:right">
									<aon:outputText	styleClass="aon-italic"
										value="#{controller.totalSmbUsers}" />
								</aon:div>
							</f:facet>																					
						</aon:column>
						<aon:column styleClass="aon-text-center aon-width-40 aon-nowrap">
							<f:facet name="header">
								<aon:outputText style="text-transform: none;"
									 value="#{bundle.admin_domain_aonAIO}" />
							</f:facet>							
							<aon:outputText rendered="#{!to.aonAio}" value="-" />
							<aon:outputText rendered="#{to.aonAio and to.maxDefinedUsers > 0}"
								style="#{(to.payerDomain != null)?'color:blue;':((to.activeUsers!=to.maxDefinedUsers)?'color:red;':'')}"
								value="#{to.activeUsers} / #{to.maxDefinedUsers}" />
							<aon:outputText rendered="#{to.aonAio and to.maxDefinedUsers == 0}" 
								styleClass="aon-icon-check-black" style="padding-left:12px" value=""/>
							
							<f:facet name="footer">
								<aon:div style="float:right">
									<aon:outputText	styleClass="aon-italic"
										value="#{controller.totalAiOUsers}" />
								</aon:div>
							</f:facet>															
						</aon:column>
						<aon:column styleClass="aon-editDataTable-iconColumn aon-text-center">
							<f:facet name="header">
								<aon:outputText value="Portal" />
							</f:facet>						
							<aon:outputText rendered=" #{!to.portal}" value="-" />
							<aon:outputText value="#{to.portalDescription}"
								rendered="#{to.portal}" styleClass="aon-icon-check-black"
								style="padding-left:15px" />
							<f:facet name="footer">
								<aon:div style="float:right">
									<aon:outputText	styleClass="aon-italic"
										value="#{controller.totalPortals}" />
								</aon:div>
							</f:facet>									
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-iconColumn aon-text-center">
							<f:facet name="header">
								<aon:outputText value="Tedi Center" />
							</f:facet>
							<aon:outputText rendered="#{!to.tediCenter}" value="-" />
							<aon:outputText value="&#160;"
								rendered="#{to.tediCenter}" styleClass="aon-icon-check-black"
								style="padding-left:12px" />	
							<f:facet name="footer">
								<aon:div style="float:right">
									<aon:outputText	styleClass="aon-italic"
										value="#{controller.totalTedis}" />
								</aon:div>
							</f:facet>									
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
