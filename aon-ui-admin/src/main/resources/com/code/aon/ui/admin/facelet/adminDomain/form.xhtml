<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="domainForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{adminBundle.admin_domain_management}" />
				<ui:param name="controller" value="#{adminDomain}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipRemoveButton" value="#{true}" />
				<ui:param name="skipBackButton" value="#{true}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:param name="skipSaveButton" value="#{!(adminMain.termsOfServiceAccepted or aonRole.sysAdmin)}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">
				
					<aon:outputLabel for="Domain_description"
						value="#{bundle.aon_name}" />
					<aon:inputText id="Domain_description" required="true"
						size="90" maxlength="128" value="#{adminDomain.to.description}" />				

					<aon:outputText value="#{adminBundle.admin_domain_url}" />
					<aon:outputLink target="_blank" value="http://#{adminDomain.to.name}" >
						<aon:outputText value="http://#{adminDomain.to.name}" />
				    </aon:outputLink>				

					<c:if test="#{adminMain.config.showDomainActive}" >
						<aon:outputLabel for="Domain_active"
							value="#{bundle.aon_active}" />
						<aon:selectBooleanCheckbox id="Domain_active"
							value="#{adminDomain.to.active}" />								
					</c:if>				

					<c:if test="#{domainSwitcher.domainManagementAvailable}" >
						<aon:outputLabel for="Domain_subDomainSuffix"
							value="#{adminBundle.admin_domain_subDomainSuffix}" />
						<aon:inputText id="Domain_subDomainSuffix" size="60" maxlength="64"
							disabled="#{!aonRole.sysAdmin}" value="#{adminDomain.to.subDomainSuffix}" />
					</c:if>

					<c:if test="#{domainSwitcher.childDomain}" >
						<aon:outputLabel for="Domain_parentDomain"
							value="#{adminBundle.admin_domain_parent}" />
						<aon:inputText id="Domain_parentDomain" size="60" disabled="true"
							value="#{adminDomain.to.parent.name}" />
					</c:if>								
					
				</aon:panelGrid>
								
				<aon:div styleClass="aon-form-group-title aon-margin-top">
					<aon:div styleClass="aon-form-group-title-internal">
						<aon:outputText value="#{adminBundle.admin_capabilities}"/>
					</aon:div>
				</aon:div>
				<aon:panelGrid columns="2" >
					<aon:outputLabel for="Domain_maxDefinedUsers"
						validator="#{adminDomain.numberOfUsersCheck}"
						value="#{adminBundle.admin_domain_maxDefinedUsers}" />
					<aon:div>
						<aon:inputText id="Domain_maxDefinedUsers" required="true"
							size="10" value="#{adminDomain.to.maxDefinedUsers}" >
							<f:validateLongRange minimum="#{domainUser.minimumUserNumber}" />
						</aon:inputText>
						<aon:outputText styleClass="aon-margin-left"
							value="#{domainUser.activeUsersMessage}"/>
					</aon:div>
				
					<c:if test="#{!domainSwitcher.childDomain}" >
						<aon:outputLabel for="Domain_domainManagement"
							value="#{adminBundle.admin_domain_domainManagement}" />
						<aon:selectBooleanCheckbox id="Domain_domainManagement"
							disabled="#{!aonRole.sysAdmin}"
							value="#{adminDomain.to.domainManagement}" />
					</c:if>

					<aon:outputLabel for="Domain_maxDocumentSize"
						value="#{adminBundle.admin_domain_maxDocumentSize}" />
					<rich:inputNumberSlider id="Domain_maxDocumentSize"
						value="#{adminDomain.to.maxDocumentSize}"
						minValue="1" maxValue="16" width="300" />
									
					<aon:outputLabel for="Domain_maxTotalDocumentSize"
						value="#{adminBundle.admin_domain_maxTotalDocumentSize}" />
					<rich:inputNumberSlider id="Domain_maxTotalDocumentSize"
						disabled="#{!adminDomain.documental.checked}"
						value="#{adminDomain.to.maxTotalDocumentSize}"
						minValue="100" maxValue="1500" step="100" width="300" />

				</aon:panelGrid>								

				<aon:div styleClass="aon-form-group-title aon-margin-top">
					<aon:div styleClass="aon-form-group-title-internal">
						<aon:outputText value="#{adminBundle.admin_applications}"/>
					</aon:div>
				</aon:div>
				<ui:include src="/com/code/aon/ui/admin/facelet/adminDomain/applications.xhtml" />
				
				<ui:include src="/com/code/aon/ui/admin/facelet/adminDomain/termsOfService.xhtml" >
					<ui:param name="controller" value="#{adminDomain}" />
					<ui:param name="termsOfServiceURL" value="#{adminMain.properties.updateDomainURL}" />
				</ui:include>
								
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
