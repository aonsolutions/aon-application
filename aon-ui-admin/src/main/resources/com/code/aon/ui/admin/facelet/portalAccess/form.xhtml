<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">

	<ui:define name="configContent">

		<aon:form id="portalAccessForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.admin_global_portal_access}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="portalAccess-save"
						value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{portalAccess.accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept" />
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area" style="padding-bottom: 0;">
			
				<aon:panelGrid columns="2">
				
					<aon:outputLabel for="PortalAccess_active"
						value="#{bundle.aon_active}" />
					<aon:div id="portalAccessOptionsDiv">
						<aon:div>
							<aon:selectBooleanCheckbox id="PortalAccess_active"
								reRender="portalAccessOptionsDiv,portalAccessUserDiv"
								value="#{portalAccess.active}" />
							<aon:outputLabel for="PortalAccess_payrollPortal"
								rendered="#{portalAccess.showPayrollPortal and !portalAccess.showInfo and portalAccess.active}"
								value="#{bundle.menu_integral}" />
						</aon:div>
						<aon:div>
							<aon:div rendered="#{portalAccess.active}">
							
								<aon:div styleClass="aon-margin-top" >
									<aon:selectOneRadio id="Domain_aonOne" 
										layout="pageDirection"
										rendered="#{portalAccess.showPayrollPortal and portalAccess.showInfo}"
										value="#{portalAccess.payrollPortal}" >
										<f:selectItem itemLabel="#{bundle.menu_integral}" itemValue="#{true}" />
										<f:selectItem itemLabel="#{bundle.admin_portal_show}:" itemValue="#{false}" />
										<a4j:support event="onchange" ajaxSingle="true"
											actionListener="#{portalAccess.onPayrollPortalChanged}"
											reRender="portalAccessOptionsDiv" />
									</aon:selectOneRadio>
								</aon:div>					
														
								<aon:div rendered="#{portalAccess.showInfo}"
									style="margin-left:2em;">														
									<aon:if test="#{portalAccess.showFiscalInfo}">			
										<aon:selectBooleanCheckbox id="PortalAccess_fiscalInfo"
											disabled="#{portalAccess.payrollPortal}"
											actionListener="#{portalAccess.onInfoChanged}"
											value="#{portalAccess.fiscalInfo}">
										</aon:selectBooleanCheckbox>
										<aon:outputLabel for="PortalAccess_fiscalInfo"
											value="#{bundle.admin_portal_fiscal_info}"
											style="#{(portalAccess.payrollPortal)?'color: graytext;':''}" />
									</aon:if>							
									<aon:if test="#{portalAccess.showAccountingInfo}">			
										<aon:selectBooleanCheckbox id="PortalAccess_accountingInfo"
											disabled="#{portalAccess.payrollPortal}"
											actionListener="#{portalAccess.onInfoChanged}"
											value="#{portalAccess.accountingInfo}">
										</aon:selectBooleanCheckbox>
										<aon:outputLabel for="PortalAccess_accountingInfo"
											value="#{bundle.admin_portal_accounting_info}"
											style="#{(portalAccess.payrollPortal)?'color: graytext;':''}" />
									</aon:if>							
									<aon:if test="#{portalAccess.showPayrollInfo}">
										<aon:selectBooleanCheckbox id="PortalAccess_payrollInfo"
											disabled="#{portalAccess.payrollPortal}"
											actionListener="#{portalAccess.onInfoChanged}"
											value="#{portalAccess.payrollInfo}">
										</aon:selectBooleanCheckbox>
										<aon:outputLabel for="PortalAccess_payrollInfo"
											value="#{bundle.admin_portal_payroll_info}"
											style="#{(portalAccess.payrollPortal)?'color: graytext;':''}" />
									</aon:if>							
									<aon:if test="#{portalAccess.showDocumentalInfo}">
										<aon:selectBooleanCheckbox id="PortalAccess_documentalInfo"
											disabled="#{portalAccess.payrollPortal}"
											actionListener="#{portalAccess.onInfoChanged}"
											value="#{portalAccess.documentalInfo}">
										</aon:selectBooleanCheckbox>
										<aon:outputLabel for="PortalAccess_documentalInfo"
											value="#{bundle.admin_portal_documental_info}"
											style="#{(portalAccess.payrollPortal)?'color: graytext;':''}" />
									</aon:if>
								</aon:div>				

							</aon:div>		
						</aon:div>								
					</aon:div>						
				</aon:panelGrid>
			</aon:div>
		
			<aon:div styleClass="aon-scroll-area">
	
				<aon:div id="portalAccessUserDiv">
					<aon:panel rendered="#{portalAccess.active}">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_login_user}" />
						</f:facet>
		
						<aon:if test="#{portalAccess.user.id != null}" >					
							<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
								<ui:param name="toolbarID" value="portalAccessUserToolbar" />
								<ui:param name="innerToolbar" value="#{true}" />
								<ui:param name="skipToolbarTitle" value="true" />
								<ui:param name="skipToolbarDescription" value="true" />
								<ui:define name="toolbarContent">
									<aon:commandButton id="portalAccessUser-changePasswordAdmin"
										value="#{bundle.admin_change_password}"
										actionListener="#{portalAccess.onShowChangePasswordWindow}"
										reRender="showChangePasswordWindow"  immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-utilities" />															
								</ui:define>				
							</ui:decorate>
						</aon:if>
			
						<aon:panelGrid columns="2">
						
							<aon:outputLabel for="User_login"
								value="#{bundle.aon_login}" />
							<aon:inputText id="User_login"
								required="true" size="20" maxlength="16" 
								validator="#{portalAccess.idCheck}"
								value="#{portalAccess.user.login}" />
								
							<aon:outputLabel for="User_name"
								value="#{bundle.aon_name}" />
							<aon:inputText id="User_name"
								size="55" maxlength="64" required="true" 
								value="#{portalAccess.user.name}" />		
							
						</aon:panelGrid>
	
						<aon:if test="#{portalAccess.user.id != null}" >
							<aon:div styleClass="aon-form-group-title aon-margin-top">
								<aon:div styleClass="aon-form-group-title-internal">
									<aon:outputText value="#{bundle.config_scopes}"/>
								</aon:div>
							</aon:div>
							<ui:include src="/com/code/aon/ui/admin/facelet/userScope/form.xhtml" >
								<ui:param name="skipUseScopeToolbar" value="#{true}" />
							</ui:include>
						</aon:if>
												
					</aon:panel>
				</aon:div>
															
			</aon:div>

		</aon:form>
		<ui:include src="/com/code/aon/ui/admin/facelet/domainUser/changePassword.xhtml" >
			<ui:param name="controller" value="#{portalAccess}" />
		</ui:include>
	</ui:define>
</ui:composition>
