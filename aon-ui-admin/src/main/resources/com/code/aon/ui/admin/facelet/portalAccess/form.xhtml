<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">

	<ui:define name="configContent">

		<aon:form id="portalAccessForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.admin_global_portal_access}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="portalAccess-save"
						value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{portalAccess.accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept" />
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area" style="padding-bottom: 0;">
			
				<aon:panelGrid id="portalAccessGrid" columns="2">

					<aon:outputLabel for="PortalAccess_active"
						value="#{bundle.aon_active}" />
					<aon:selectBooleanCheckbox id="PortalAccess_active"
						reRender="portalAccessGrid,portalAccessUserDiv"
						value="#{portalAccess.info.active}" />
				
					<aon:if test="#{portalAccess.info.showManagement}">
						<aon:outputLabel for="PortalAccess_access"
							value="#{bundle.admin_domain_access}"
							rendered="#{portalAccess.info.active}" />
						<aon:div rendered="#{portalAccess.info.active}">
							<aon:if test="#{portalAccess.info.showFinanceManagement}">
								<aon:selectBooleanCheckbox id="PortalAccess_financeManagement"
									disabled="#{portalAccess.info.payrollPortal}"
									value="#{portalAccess.info.financeManagement}">
								</aon:selectBooleanCheckbox>
								<aon:outputLabel for="PortalAccess_financeManagement"
									value="#{bundle.aon_module_management}"
									style="#{(portalAccess.info.payrollPortal)?'color: graytext;':''}"
									styleClass="aon-margin-right" />
							</aon:if>
							<aon:if test="#{portalAccess.info.showDocumentalInfo}">
								<aon:selectBooleanCheckbox id="PortalAccess_documentalManagement"
									disabled="#{portalAccess.info.payrollPortal}"
									value="#{portalAccess.info.documentalManagement}">
								</aon:selectBooleanCheckbox>
								<aon:outputLabel for="PortalAccess_documentalManagement"
									value="#{bundle.aon_module_document}"
									style="#{(portalAccess.info.payrollPortal)?'color: graytext;':''}"
									styleClass="aon-margin-right" />
							</aon:if>
						</aon:div>
					</aon:if>

					<aon:if test="#{portalAccess.info.showInfo}">
						<aon:outputLabel for="PortalAccess_info"
							value="#{bundle.aon_information}"
							rendered="#{portalAccess.info.active}" />
						<aon:div rendered="#{portalAccess.info.active}">
							<aon:if test="#{portalAccess.info.showFiscalInfo}">			
								<aon:selectBooleanCheckbox id="PortalAccess_fiscalInfo"
									disabled="#{portalAccess.info.payrollPortal}"
									value="#{portalAccess.info.fiscalInfo}">
								</aon:selectBooleanCheckbox>
								<aon:outputLabel for="PortalAccess_fiscalInfo"
									value="#{bundle.aon_module_fiscal}"
									style="#{(portalAccess.info.payrollPortal)?'color: graytext;':''}"
									styleClass="aon-margin-right" />
							</aon:if>							
							<aon:if test="#{portalAccess.info.showAccountingInfo}">			
								<aon:selectBooleanCheckbox id="PortalAccess_accountingInfo"
									disabled="#{portalAccess.info.payrollPortal}"
									value="#{portalAccess.info.accountingInfo}">
								</aon:selectBooleanCheckbox>
								<aon:outputLabel for="PortalAccess_accountingInfo"
									value="#{bundle.aon_module_accounting}"
									style="#{(portalAccess.info.payrollPortal)?'color: graytext;':''}"
									styleClass="aon-margin-right" />
							</aon:if>							
							<aon:if test="#{portalAccess.info.showPayrollInfo}">
								<aon:selectBooleanCheckbox id="PortalAccess_payrollInfo"
									disabled="#{portalAccess.info.payrollPortal}"
									value="#{portalAccess.info.payrollInfo}">
								</aon:selectBooleanCheckbox>
								<aon:outputLabel for="PortalAccess_payrollInfo"
									value="#{bundle.aon_module_payroll}"
									style="#{(portalAccess.info.payrollPortal)?'color: graytext;':''}"
									styleClass="aon-margin-right" />
							</aon:if>							
							<aon:if test="#{portalAccess.info.showDocumentalInfo}">
								<aon:selectBooleanCheckbox id="PortalAccess_documentalInfo"
									disabled="#{portalAccess.info.payrollPortal}"
									value="#{portalAccess.info.documentalInfo}">
								</aon:selectBooleanCheckbox>
								<aon:outputLabel for="PortalAccess_documentalInfo"
									value="#{bundle.aon_module_document}"
									style="#{(portalAccess.info.payrollPortal)?'color: graytext;':''}"
									styleClass="aon-margin-right" />
							</aon:if>
						</aon:div>
					</aon:if>

				</aon:panelGrid>
			</aon:div>
		
			<aon:div styleClass="aon-scroll-area">
	
				<aon:div id="portalAccessUserDiv">
					<aon:panel rendered="#{portalAccess.info.active}">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_login_user}" />
						</f:facet>
		
						<aon:if test="#{portalAccess.user.id != null}" >					
							<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
								<ui:param name="toolbarID" value="portalAccessUserToolbar" />
								<ui:param name="innerToolbar" value="#{true}" />
								<ui:param name="skipToolbarTitle" value="true" />
								<ui:param name="skipToolbarDescription" value="true" />
								<ui:define name="toolbarContent">
									<aon:commandButton id="portalAccessUser-changePasswordAdmin"
										value="#{bundle.admin_change_password}"
										actionListener="#{portalAccess.onShowChangePasswordWindow}"
										reRender="showChangePasswordWindow"  immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-utilities" />															
								</ui:define>				
							</ui:decorate>
						</aon:if>
			
						<aon:panelGrid columns="2">
						
							<aon:outputLabel for="User_login"
								value="#{bundle.aon_login}" />
							<aon:inputText id="User_login"
								required="true" size="20" maxlength="16" 
								validator="#{portalAccess.idCheck}"
								value="#{portalAccess.user.login}" />
								
							<aon:outputLabel for="User_name"
								value="#{bundle.aon_name}" />
							<aon:inputText id="User_name"
								size="55" maxlength="64" required="true" 
								value="#{portalAccess.user.name}" />		
							
						</aon:panelGrid>
	
						<aon:if test="#{portalAccess.user.id != null}" >
							<aon:div styleClass="aon-form-group-title aon-margin-top">
								<aon:div styleClass="aon-form-group-title-internal">
									<aon:outputText value="#{bundle.config_scopes}"/>
								</aon:div>
							</aon:div>
							<ui:include src="/com/code/aon/ui/admin/facelet/userScope/form.xhtml" >
								<ui:param name="skipUseScopeToolbar" value="#{true}" />
							</ui:include>
						</aon:if>
												
					</aon:panel>
				</aon:div>
															
			</aon:div>

		</aon:form>
		<ui:include src="/com/code/aon/ui/admin/facelet/domainUser/changePassword.xhtml" >
			<ui:param name="controller" value="#{portalAccess}" />
		</ui:include>
	</ui:define>
</ui:composition>
