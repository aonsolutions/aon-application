<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{profileRole}" />
		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-textColumn"
				alias="ProfileRole.applicationRole.role.name" >
				<f:facet name="header">
					<aon:outputLabel for="ProfileRole_name" value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.applicationRole.role.name}" rendered="#{formList}" />
				<aon:selectOneMenu id="ProfileRole_name"
					value="#{controller.to.applicationRole}" layout="pageDirection"
					rendered="#{formEdit}" required="true">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{domainApplicationProfile.availableRoles}" />
				</aon:selectOneMenu>				
				<f:facet name="footer">
					<aon:selectOneMenu id="ProfileRole_name-New"
						value="#{controller.to.applicationRole}" layout="pageDirection"
						rendered="#{formNew}" required="true">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{domainApplicationProfile.availableRoles}" />
					</aon:selectOneMenu>				
				</f:facet>
			</aon:column>
			
		</ui:define>
	</ui:decorate>

</ui:composition>
