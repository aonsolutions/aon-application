<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigScopesForm">
		<aon:div ajaxRendered="true" layout="none">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.config_scopes}" />
				<ui:param name="controller" value="#{scope}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:if  test="#{domainSwitcher.parentDomain and (scope.ayudaT or domainSwitcher.betaUser)}">
						<aon:commandButton id="send"
							value="Generar por Empresa"
							styleClass="aon-icon-accept aon-finding-toolbar-item"
							actionListener="#{scope.generateCompanyScopes}">
						</aon:commandButton>
					</aon:if>		
				</ui:define>
			</ui:decorate>
		</aon:div>				
		<aon:div styleClass="aon-scroll-area">
			<ui:include src="/com/code/aon/ui/config/facelet/scope/gridContent.xhtml" >
				<ui:param name="controller" value="#{scope}" />
			</ui:include>
		</aon:div>
	</aon:form>

</ui:composition>
