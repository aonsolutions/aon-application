<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigScopesForm">
		<aon:div ajaxRendered="true" layout="none">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.config_scopes}" />
				<ui:param name="controller" value="#{scope}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-reassign"
						title="#Reasignar"
						rendered="#{!formNew}"
						styleClass="aon-finding-toolbar-item aon-icon-transfer"
						actionListener="#{scope.onReassignShow}"
						reRender="showReassignWindow">
						<f:setPropertyActionListener target="#{scope.showReassignWindow}"
							value="#{true}" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>
		</aon:div>				
		<aon:div styleClass="aon-scroll-area">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
				<ui:param name="controller" value="#{scope}" />
				<ui:define name="columns">
					<aon:column styleClass="aon-editDataTable-textColumn"
						alias="Scope.description" >
						<f:facet name="header">
							<aon:outputLabel for="Scope_description" value="#{bundle.aon_scope}" />
						</f:facet>
						
						<aon:outputText value="#{to.description}"
							style="color: #{scope.used?'default':'orange'};" 
							rendered="#{formList}" />
						
						<aon:inputText id="Scope_description"
							rendered="#{formEdit}" size="20" maxlength="16"
							value="#{controller.to.description}" required="true" />
						<f:facet name="footer">
							<aon:inputText id="Scope_description-New" 
								rendered="#{formNew}" size="20" maxlength="16"
								value="#{controller.to.description}" required="true" />
						</f:facet>
					</aon:column>
		
				</ui:define>
			</ui:decorate>
		
		</aon:div>
	</aon:form>
	<aon:panelGroup id="showReassignWindow">
		<aon:if test="#{scope.showReassignWindow}">
			<rich:modalPanel id="reassignModalPanel"
				minHeight="260" minWidth="680" zindex="90"
				showWhenRendered="#{scope.showReassignWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="Reasginar" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showReassignWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{scope.showReassignWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="reassignForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="reassign-accept"
											value="Reasignar"
											actionListener="#{scope.onReassign}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<rich:componentControl for="reassignModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{scope.showReassignWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="reassign-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showReassignWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{scope.showReassignWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>
									<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
										<aon:div>
											<aon:outputText  value="Sustituir el #{bundle.aon_scope} " style="margin-right: 1em;"/>
											<aon:selectOneMenu id="scope_old" value="#{scope.oldScope}">
												<f:selectItem item="-" value="#{null}" />
												<f:selectItems value="#{scope.usedScopes}" />
												<a4j:support event="onchange"  
													actionListener="#{scope.onScopeOldChanged}" 
													reRender="scope_old_delete_div" 
													ajaxSingle="true" />
											</aon:selectOneMenu>
	
											<aon:outputText value="por el #{bundle.aon_scope}" style="margin-right: 1em;margin-left: 1em;"/>
											<aon:selectOneMenu id="scope_new" value="#{scope.newScope}">
												<f:selectItem item="-" value="#{null}" />
												<f:selectItems value="#{scope.scopes}" />
											</aon:selectOneMenu>
											
											<aon:div id="scope_old_delete_div" style="margin-top: 10px;">
												<aon:selectBooleanCheckbox 
													id="scope_old_delete"
													rendered="#{scope.removableOldScope}"
													value="#{scope.removeOldScope}" />
												<aon:outputText styleClass="aon-italic"
													rendered="#{scope.removableOldScope}"
													value="#{scope.deleteLabel}" />
											</aon:div>
										</aon:div>	
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
