<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:componentGroup
			family="javax.faces.Command"
			method="#{aonRole.doNothing}">
	
			<aon:form id="advancedModeForm">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{adminBundle.admin_advanced_mode}" />
					<ui:param name="toolbarDescription" value="#{bundle.aon_login_validate}" />
					<ui:define name="toolbarContent">
						<aon:commandButton id="accept"
							value="#{bundle.aon_accept}"
							action="home"
							actionListener="#{adminMain.onAccept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionHotKey key="return" />
						</aon:commandButton>					
					</ui:define>
				</ui:decorate>		
						
				<aon:div styleClass="aon-scroll-area">
	
					<aon:div styleClass="aon-center">
				
						<aon:panelGrid columns="2">
						
							<aon:outputLabel value="#{bundle.aon_login_user}" 
								for="user"/>
							<aon:inputText id="user" 
								value="#{adminMain.user}" size="30" maxlength="20" />
	
							<aon:outputLabel value="#{bundle.aon_login_passwd}" 
								for="passwd"/>
							<aon:inputSecret id="passwd" 
								value="#{adminMain.passwd}" size="30" maxlength="20" />
								
						</aon:panelGrid>
	
					</aon:div>
			
				</aon:div>
				
				<rich:jQuery timing="onload" selector="#user" query="focus()" />
				
			</aon:form>

		</aon:componentGroup>

	</ui:define>
</ui:composition>
