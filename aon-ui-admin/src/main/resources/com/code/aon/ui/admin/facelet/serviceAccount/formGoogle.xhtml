				<!--  CONTAINER 2 -->

			
					<aon:div id="table_div2"
						style="width: 100%; height: 180px;" />
						
					<aon:div id="table_div3"
						style="display:none" />
						
					<script type='text/javascript' src='https://www.google.com/jsapi'></script>
					<script type='text/javascript'>
					google.load("visualization", "1", {'callback' : 'drawTable' ,'packages':["table"], 'language': 'en'});
      			
      				function drawTable() {
      					
      					var data = new google.visualization.DataTable();
        				data.addColumn('string', '#{bundle.dominio}');
        				data.addColumn('string', '#{bundle.client_id}');
        				data.addColumn('string', '#{bundle.sa_size}');
        				data.addColumn('string', '#{bundle.limit}');
						data.addColumn('string', 'Cuenta Google')
						
      					var data2 = new google.visualization.DataTable();
        				data2.addColumn('string', 'email');
        				data2.addColumn('string', 'public_key');
        				data2.addColumn('string', 'limite');

        				<c:forEach var="account" items="#{serviceAccount.accounts}">		
						
							data.addRow(['#{account.domain}',
						             '#{account.client_id}',
					             	'#{account.sizestr}',
					             	'#{account.limitstr}',
					             	'#{account.google_account}']);	
						
							data2.addRow(['#{account.email_address}',
							             '#{account.public_key}',
						             	'#{account.limit}']);
							

						</c:forEach>
						
						var cssClasses = {headerRow: 'aon-chart-table-header', headerCell:'aon-chart-table-header-cell'};
						
						var options = {
        						showRowNumber: false,
        						cssClassNames:cssClasses
						      };
        				var table = new google.visualization.Table(#{rich:element('table_div2')});
        				var table2 = new google.visualization.Table(#{rich:element('table_div3')});
						

           				table.draw(data, options);
           				table2.draw(data2, options);

           				// Every time the table fires the "select" event, it should call your
           				// selectHandler() function.
           				
           				google.visualization.events.addListener(table, 'select', selectHandler);

           				function selectHandler(e) {
           					var client_id = data.getValue(table.getSelection()[0].row, 1);
           					var domain = data.getValue(table.getSelection()[0].row, 0);
           					var email = data2.getValue(table.getSelection()[0].row, 0);
           					var public_key = data2.getValue(table.getSelection()[0].row, 1);
           					var limite = data2.getValue(table.getSelection()[0].row, 2);
           					var google_account = data.getValue(table.getSelection()[0].row,4)
    						document.getElementById('aonContent:googleForm:domain_hidden').value = domain;
    						document.getElementById('aonContent:googleForm:client_id_hidden').value = client_id;
    						document.getElementById('aonContent:googleForm:limit_hidden').value = limite;
    						document.getElementById('aonContent:googleForm:public_key_hidden').value = public_key;
    						document.getElementById('aonContent:googleForm:email_hidden').value = email;
    						document.getElementById('aonContent:googleForm:google_account_hidden').value = google_account;
    						document.getElementById('aonContent:googleForm:tracking-editgoogle').click();
    				
           				}
      				}
    				</script>
