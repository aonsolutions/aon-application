<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:include src="/com/code/aon/ui/webmail/facelet/util/formInnerToolbar.xhtml" >
		<ui:param name="skipSearchButton" value="#{true}" />
		<ui:param name="removeConfirmMessage" value="#{adminBundle.admin_domain_application_profile_remove_confirm}" />
	</ui:include>	

	<aon:div styleClass="aon-scroll-area">

		<aon:panelGrid columns="2">

			<aon:outputLabel for="Profile_name"
				value="#{bundle.aon_name}" />
			<aon:inputText id="Profile_name"
				size="80" required="true"
				value="#{controller.to.name}" />
					
		</aon:panelGrid>

		<c:if test="#{!controller.new}" >
			<aon:panelTabSet>

				<aon:panelTab name="roles" label="#{adminBundle.admin_roles}">
					<ui:include src="/com/code/aon/ui/admin/facelet/profile/roleGrid.xhtml" />
                   </aon:panelTab>
                
                <aon:panelTab name="modules" label="#{adminBundle.admin_modules_denied}">   
					<ui:include src="/com/code/aon/ui/admin/facelet/domainApplicationModule/grid.xhtml" >
						<ui:param name="controller" value="#{profileModuleDenied}" />
					</ui:include>
				</aon:panelTab>

			</aon:panelTabSet>
		</c:if>		

	</aon:div>

</ui:composition>
