<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:include src="/com/code/aon/ui/webmail/facelet/util/formInnerToolbar.xhtml" >
		<ui:param name="skipSearchButton" value="#{true}" />
		<ui:param name="removeConfirmMessage" value="#{adminBundle.admin_domain_application_profile_remove_confirm}" />
	</ui:include>	

	<aon:div styleClass="aon-scroll-area">

		<aon:panelGrid columns="2">

			<aon:outputLabel for="Profile_name"
				value="#{bundle.aon_name}" />
			<aon:inputText id="Profile_name"
				size="80" required="true"
				validator="#{controller.idCheck}"
				value="#{controller.to.name}" />
					
			<aon:outputLabel for="Profile_roles"
				value="#{adminBundle.admin_roles}" />
			<aon:selectManyCheckbox id="Profile_roles"
				value="#{controller.currentRoles}" layout="pageDirection"
				required="true">
				<f:selectItems value="#{controller.availableRoles}" />
			</aon:selectManyCheckbox>				

		</aon:panelGrid>
	</aon:div>

</ui:composition>
