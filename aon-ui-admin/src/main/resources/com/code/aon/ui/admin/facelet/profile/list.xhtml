<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="profileList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >

				<ui:param name="controller" value="#{domainApplicationProfile}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:define name="additionalToolbarContent" >
					<aon:commandButton id="systemProfiles"
						value="#{adminBundle.admin_systemProfiles}"
						styleClass="aon-finding-toolbar-item aon-icon-index"
						action="applicationProfile_list" immediate="true" />
				</ui:define>
			</ui:decorate>

			<ui:include src="/com/code/aon/ui/admin/facelet/profile/listContent.xhtml" >
				<ui:param name="controller" value="#{domainApplicationProfile}" />
			</ui:include>

		</aon:form>

</ui:composition>
