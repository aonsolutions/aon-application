<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">

	<ui:define name="configContent">

		<aon:form id="profileList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.admin_profiles}" />
				<ui:param name="controller" value="#{domainApplicationProfile}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:param name="skipResetButton" value="#{domainApplicationProfile.noRegisteredApplications}" />
				<ui:define name="additionalToolbarContent" >
					<aon:commandButton id="systemProfiles"
						value="#{bundle.admin_systemProfiles}"
						styleClass="aon-finding-toolbar-item aon-icon-index"
						action="applicationProfile_list" immediate="true" />
				</ui:define>
			</ui:decorate>

			<aon:if test="#{!domainApplicationProfile.noRegisteredApplications}">
				<ui:include src="/com/code/aon/ui/admin/facelet/profile/listContent.xhtml" >
					<ui:param name="controller" value="#{domainApplicationProfile}" />
					<ui:param name="skipDomainColumn" value="#{domainSwitcher.parentDomain}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{to.domain.id == domainSwitcher.domainId}" />
				</ui:include>
			</aon:if>
		</aon:form>
	</ui:define>

</ui:composition>
