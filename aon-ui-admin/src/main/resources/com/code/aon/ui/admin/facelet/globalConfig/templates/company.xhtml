<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:form id="globalConfigCompanyForm">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
			<ui:param name="toolbarTitle" value="#{bundle.admin_global_general_data}" />
			<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
			<ui:define name="toolbarContent">
				<aon:commandButton id="save"
					value="#{bundle.aon_save}"
					actionListener="#{company.accept}"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_save}" />
			</ui:define>				
		</ui:decorate>
	
		<aon:div styleClass="aon-scroll-area">	
			
			<aon:if test="#{aonRole.sysAdmin}">
				<aon:panel style="width:100%;" >
					<f:facet name="header">
						<aon:outputText value="Opciones de desarrollo" />
					</f:facet>
					<aon:panelGrid  columns="2" style="padding:10px;">
						<aon:outputText value="Opciones BETA" />
						<aon:commandButton value="No habilitado" title="#{bundle.aon_enable}"
							rendered="#{!domainSwitcher.betaEnabled}"
							reRender="globalConfigCompanyForm"
							styleClass="aon-finding-toolbar-item aon-noborder aon-icon-check"
							actionListener="#{company.onEnableBetaDomain}" />
						<aon:commandButton value="Habilitado" title="#{bundle.aon_disable}"
							rendered="#{domainSwitcher.betaEnabled}"
							reRender="globalConfigCompanyForm"
							styleClass="aon-finding-toolbar-item aon-noborder aon-icon-checked"
							actionListener="#{company.onDisableBetaDomain}" />
					</aon:panelGrid>
				</aon:panel>
				<aon:panel style="width:100%;" >
					<f:facet name="header">
						<aon:outputText value="Otros parametros" />
					</f:facet>
					<aon:panelGrid  columns="2" style="padding:10px;">
						<aon:outputText value="Soporte EDI" />
						<aon:selectOneMenu value="#{company.ediSupport}">
							<f:selectItem itemLabel="No Habilitado" itemValue="#{null}" />
							<f:selectItem itemLabel="Seresnet estandar" itemValue="seresnet_standard" />
							<f:selectItem itemLabel="Seresnet Udapa" itemValue="seresnet_udapa" />
							<a4j:support event="onchange" reRender="globalConfigCompanyForm" ajaxSingle="#{true}" />
						</aon:selectOneMenu>
					</aon:panelGrid>
				</aon:panel>
			</aon:if>
						
			<ui:include
				src="/com/code/aon/ui/company/facelet/company/formContent.xhtml" />
				
			<aon:div styleClass="aon-margin-top">
				<ui:include
					src="/com/code/aon/ui/company/facelet/company/logoSignatureContent.xhtml" />
			</aon:div>			
		</aon:div>
	</aon:form>

</ui:composition>
