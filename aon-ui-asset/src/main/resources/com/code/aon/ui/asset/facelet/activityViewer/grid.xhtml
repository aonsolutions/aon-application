<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<c:if test="#{activityViewer.assetModel==null or activityViewer.assetModel.rowCount le 0 }" >
		<aon:div style="width:100%;" > 
			<aon:outputText value="No se encontraron resultados -i18n-" />
		</aon:div>
	</c:if>

	<c:if test="#{activityViewer.assetModel!=null and activityViewer.assetModel.rowCount gt 0 }" >
	<rich:dataTable id="assetActivityCalendar" value="#{activityViewer.assetModel}" var="to">
		<f:facet name="header" >
			<rich:columnGroup>
				<rich:column>
					<aon:outputText value="&#160;" />
				</rich:column>
				
				<rich:columns value="#{activityViewer.viewerDays}" var="days" index="idx"	>
					<aon:outputText styleClass="calendar-header" value="#{days.time}" >
						<f:convertDateTime pattern="#{assetBundle.aon_simple_date_pattern}" 
							timeZone="#{timeZoneController.timeZoneId}"  />
					</aon:outputText>
				</rich:columns>
			</rich:columnGroup>
		</f:facet>
		
		<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
		<!--  
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
		-->
			<aon:outputText value="#{to.asset.name}" />
		</aon:column>
		
		<rich:columns styleClass="aon-editDataTable-textColumn no-padding" 
			value="#{activityViewer.assetModel.rowData.assetDayModel.wrappedData}" var="list" index="idx"	>
			<!--  
			<f:facet name="header">
				<aon:outputText styleClass="calendar-header"
					value="#{idx%(60/activityViewer.fractionTime)==0?'00':times}" />
			</f:facet>
			-->

			<c:forEach items="#{list.fractions}" var="fraction" >
				<aon:div styleClass="#{(fraction.reserved)?'reserved-cell':'available-cell'}">
					
					<aon:outputText value="&#160;&#160;&#160;" 
						styleClass="#{fraction.first?'aon-icon-info':'none'}" />
					<rich:toolTip followMouse="true" direction="top-right" showDelay="250" 
					 	rendered="#{fraction.first}" >
			            <span style="white-space:nowrap">
			                <aon:div><aon:outputText value="#{list.asset.description}" /></aon:div>
			            </span>
			            
			            <h:panelGrid columns="2" >
			                <aon:outputLabel value="#{bundle.aon_holder}" />
							<aon:outputText value="#{fraction.activity.holder}" />
				                
							<aon:outputLabel value="#{bundle.aon_remark}" />
							<aon:outputText value="#{fraction.activity.comments}" />
			            </h:panelGrid>
			        </rich:toolTip>
			        
					
			        <!--  
					<aon:commandButton ignoreDupResponses="true" ajaxSingle="true"
						value="-"
						reRender="activityInfo"
						styleClass="aon-commandLink font-small"
						actionListener="#{activityViewer.onSelectActivity}" >
			        	<f:setPropertyActionListener target="#{activityViewer.selectedAssetActivity}"
							value="#{fraction.activity}" />	
					</aon:commandButton>
			        -->
					
			        <a4j:support event="onclick" reRender="filter" >
			        	<f:setPropertyActionListener target="#{activityViewer.selectedAssetActivity}"
							value="#{fraction.activity}" />	
						<aon:actionListener method="#{activityViewer.onSelectActivity}" ajaxSingle="#{true}" />
						
					</a4j:support>
			        
				</aon:div>
			</c:forEach>

		</rich:columns>
		
	
	</rich:dataTable>
	</c:if>
	
</ui:composition>
