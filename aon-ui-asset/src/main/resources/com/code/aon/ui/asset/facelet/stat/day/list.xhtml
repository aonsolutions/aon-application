<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

			<aon:div id="assetData" styleClass="aon-scroll-area">
 
				<aon:editDataTable id="yearsStats" value="#{assetStat.stats}" width="300px"
					var="to">

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{assetBundle.asset_stat_day}" />
						</f:facet>
						<aon:outputText  value="#{to.name}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{assetBundle.asset_stat_hours}" />
						</f:facet>
						<aon:outputText value="#{to.hours}" style="#{to.hours==0.0?('color:#999999;'):('none')}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{assetBundle.asset_stat_request}" />
						</f:facet>
						<aon:outputText value="#{to.request}" style="#{to.hours==0.0?('color:#999999;'):('none')}"/>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{assetBundle.asset_stat_request_hours}" />
						</f:facet>
						<aon:outputText value="#{to.average}" style="#{to.hours==0.0?('color:#999999;'):('none')}">
							<f:convertNumber maxFractionDigits="2" />
						</aon:outputText>
					</aon:column>
					
				</aon:editDataTable>
				
			</aon:div>	
</ui:composition>
