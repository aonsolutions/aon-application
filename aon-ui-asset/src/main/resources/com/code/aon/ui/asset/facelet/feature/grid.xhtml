<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="featureForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.asset_feature_module}" />
				<ui:param name="controller" value="#{feature}" />
			</ui:decorate>
	
	<aon:div styleClass="aon-scroll-area">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
			<ui:param name="controller" value="#{feature}" />
					
			<ui:define name="columns">
				
				<aon:column alias="Feature.id"
					styleClass="aon-editDataTable-textColumn aon-width-100">
					<f:facet name="header">
						<h:outputText value="#{bundle.aon_id}" />
					</f:facet>
					<aon:outputText value="#{to.id}" />
				</aon:column>
				
				<aon:column alias="Feature.name"
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<h:outputText value="#{bundle.aon_name}" />
					</f:facet>
					<aon:outputText value="#{to.name}" rendered="#{formList}" />
					<aon:inputText id="Feature_name" rendered="#{formEdit}"
						value="#{feature.to.name}" 
						maxlength="32" size="40" >
						<f:validateLength maximum="32" />
					</aon:inputText>
					<f:facet name="footer">
						<aon:inputText id="Feature_name-New" rendered="#{formNew}"
							value="#{feature.to.name}" 
							maxlength="32" size="40" >
							<f:validateLength maximum="32" />
						</aon:inputText>
					</f:facet>
				</aon:column>
				
				<!--  
				<aon:column 
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<h:outputText value="#{bundle.aon_description}" />
					</f:facet>
					<aon:outputText value="#{to.description}" />
				</aon:column>
				
				<aon:column 
					styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<h:outputText value="#{bundle.asset_assetType}" />
					</f:facet>
					<aon:outputText value="#{to.type.name}" />
				</aon:column>
				-->
				
			</ui:define>
		</ui:decorate>
	</aon:div>
</aon:form>
</ui:define>			

</ui:composition>
