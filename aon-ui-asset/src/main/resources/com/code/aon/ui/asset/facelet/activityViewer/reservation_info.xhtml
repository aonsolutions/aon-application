<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:panel id="activityInfo" 
		rendered="#{activityViewer.selectedAssetActivity!=null}">
		<f:facet name="header" >
			<aon:outputText value="#{assetBundle.asset_reservation_info}" />
		</f:facet>
		
		<aon:panelGrid columns="2"  style="width:100%;"
			columnClasses="aon-panelGrid-odd aon-width-50, 
			aon-panelGrid-even aon-width-auto">
			
				<aon:outputLabel value="#{bundle.aon_date}" />
				<aon:outputText value="#{activityViewer.selectedAssetActivity.day}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}" 
						timeZone="#{timeZoneController.timeZoneId}"  />
				</aon:outputText>
				
				<aon:outputLabel value="#{bundle.aon_name}" />
				<aon:outputText value="#{activityViewer.selectedAssetActivity.asset.name}" />
				
				<aon:outputLabel value="#{assetBundle.asset_activity_who}" />
				<aon:outputText value="#{activityViewer.selectedAssetActivity.holder}" />
	                
				<aon:outputLabel value="#{assetBundle.asset_activity_why}" />
				<aon:outputText value="#{activityViewer.selectedAssetActivity.comments}" />
				
		</aon:panelGrid>
		
	</aon:panel>	
		
</ui:composition>
