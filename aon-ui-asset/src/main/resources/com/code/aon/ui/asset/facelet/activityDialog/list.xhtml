<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

		<aon:div id="assetListData" styleClass="aon-scroll-area">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
				<ui:param name="controller" value="#{activityBasic}" />
				<ui:define name="columns">
<!--  
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_id}" />
					</f:facet>
					<aon:outputText value="#{to.id}" />
				</aon:column>
-->
 			
					<aon:column styleClass="aon-editDataTable-dateColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.date}" rendered="#{to!=activityBasic.to}"
						 	size="8" >
						 	<f:convertDateTime pattern="#{bundle.aon_date2_pattern}" 
								timeZone="#{timeZoneController.timeZoneId}"  />
						</aon:outputText>
						
					</aon:column>
 				
					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.asset_fromTime}" />
						</f:facet>
						<aon:outputText value="#{to.fromTime}" rendered="#{to!=activityBasic.to}"
							size="5" >
							<f:convertDateTime pattern="#{bundle.aon_time2_pattern}" 
								timeZone="#{timeZoneController.timeZoneId}" type="time" />
						</aon:outputText>
						
					</aon:column>
					
					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.asset_toTime}" />
						</f:facet>
						<aon:outputText value="#{to.toTime}" rendered="#{to!=activityBasic.to}"
							size="5" >
							<f:convertDateTime pattern="#{bundle.aon_time2_pattern}" 
								timeZone="#{timeZoneController.timeZoneId}" type="time" />
						</aon:outputText>
						
					</aon:column>
					
					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_holder}" />
						</f:facet>
						<aon:outputText value="#{to.who}" rendered="#{to!=activityBasic.to}"
							size="15" />
						
					</aon:column>
 					
					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_remark}" />
						</f:facet>
						<aon:outputText value="#{to.why}" rendered="#{to!=activityBasic.to}"
							size="25" />
						
					</aon:column>		
				
					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}" rendered="#{to!=activityBasic.to}"
							size="25" />
						
					</aon:column>
				
					<aon:column styleClass="aon-editDataTable-buttonsColumn">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandButton
								id="activity-accept" title="#{bundle.aon_accept}"
								actionListener="#{activityBasic.acceptPendingAsset}"
								reRender="assetListData"
								styleClass="aon-editDataTable-button aon-icon-accept"
								rendered="#{to==activityBasic.to}"
								/>
						<aon:commandButton
								id="activity-cancel" title="#{bundle.aon_cancel}"
								actionListener="#{activityBasic.cancelPendingAsset}"
								reRender="assetListData"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								rendered="#{to==activityBasic.to}"
								/>
					</aon:column>
				</ui:define>
			</ui:decorate>
		</aon:div>
</ui:composition>
