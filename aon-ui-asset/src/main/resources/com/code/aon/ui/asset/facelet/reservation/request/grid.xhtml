<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGrid id="activityDialogTable" columns="2" width="100%">

		<ui:include src="/com/code/aon/ui/asset/facelet/asset/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{activityDialog.asset}" />
			<ui:param name="skipNewButton" value="#{true}" />
		</ui:include>

		<aon:outputLabel for="ActivityDialog_startDate"
			value="#{bundle.aon_start_date}" />
		<aon:selectInputDate renderAsPopup="true" id="ActivityDialog_startDate"
			popupDateFormat="#{bundle.aon_date2_pattern}" inputSize="8"
			value="#{activityDialog.fromDate}" enableManualInput="true" 
			disabled="#{!activityDialog.new}"/>

		<aon:outputLabel for="ActivityDialog_endDate"
			value="#{bundle.aon_end_date}" />
		<aon:selectInputDate renderAsPopup="true" id="ActivityDialog_endDate"
			popupDateFormat="#{bundle.aon_date2_pattern}" inputSize="8"
			value="#{activityDialog.toDate}" enableManualInput="true" 
			disabled="#{!activityDialog.new}"/>

		<aon:outputLabel for="ActivityDialog_fromTime"
			value="#{bundle.asset_fromTime}" />
		<aon:div id="ActivityDialog_fromTime">
			<aon:selectOneMenu id="fromTimeHours" disabled="#{!activityDialog.new}"
				value="#{activityDialog.fromTimeHours}">
				<f:selectItems value="#{activityDialog.hours}" />
			</aon:selectOneMenu>
			<aon:outputLabel 
				value="#{bundle.asset_hours}" />
			<aon:selectOneMenu id="fromTimeMins" disabled="#{!activityDialog.new}"
				value="#{activityDialog.fromTimeMins}">
				<f:selectItems value="#{activityDialog.mins}" />
			</aon:selectOneMenu>
			<aon:outputLabel
				value="#{bundle.asset_minutes}" />
		</aon:div>

		<aon:outputLabel for="ActivityDialog_toTime"
			value="#{bundle.asset_toTime}" />
		<aon:div id="ActivityDialog_toTime">
			<aon:selectOneMenu id="toTimeHours" disabled="#{!activityDialog.new}"
				value="#{activityDialog.toTimeHours}">
				<f:selectItems value="#{activityDialog.hours}" />
			</aon:selectOneMenu>
			<aon:outputLabel 
				value="#{bundle.asset_hours}" />
			<aon:selectOneMenu id="toTimeMins" disabled="#{!activityDialog.new}"
				value="#{activityDialog.toTimeMins}">
				<f:selectItems value="#{activityDialog.mins}" />
			</aon:selectOneMenu>
			<aon:outputLabel
				value="#{bundle.asset_minutes}" />
		</aon:div>

		<aon:outputLabel for="ActivityDialog_weekDays"
			value="#{bundle.asset_activity_days}" />
		<aon:div>
			<aon:outputLabel for="ActivityDialog_weekDays_monday"
				value="#{bundle.aon_monday}" />
			<h:selectBooleanCheckbox id="ActivityDialog_weekDays_monday"
				value="#{activityDialog.monday}" style="margin-right: 10px;"/>
			<aon:outputLabel for="ActivityDialog_weekDays_tuesday"
				value="#{bundle.aon_tuesday}" />
			<h:selectBooleanCheckbox id="ActivityDialog_weekDays_tuesday"
				value="#{activityDialog.tuesday}" style="margin-right: 10px;"/>
			<aon:outputLabel for="ActivityDialog_weekDays_wednesday"
				value="#{bundle.aon_wednesday}" />
			<h:selectBooleanCheckbox id="ActivityDialog_weekDays_wednesday"
				value="#{activityDialog.wednesday}" style="margin-right: 10px;"/>
			<aon:outputLabel for="ActivityDialog_weekDays_thursday"
				value="#{bundle.aon_thursday}" />
			<h:selectBooleanCheckbox id="ActivityDialog_weekDays_thursday"
				value="#{activityDialog.thursday}" style="margin-right: 10px;"/>
			<aon:outputLabel for="ActivityDialog_weekDays_friday"
				value="#{bundle.aon_friday}" />
			<h:selectBooleanCheckbox id="ActivityDialog_weekDays_friday"
				value="#{activityDialog.friday}" style="margin-right: 10px;"/>
			<aon:outputLabel for="ActivityDialog_weekDays_saturday"
				value="#{bundle.aon_saturday}" />
			<h:selectBooleanCheckbox id="ActivityDialog_weekDays_saturday"
				value="#{activityDialog.saturday}" style="margin-right: 10px;"/>
			<aon:outputLabel for="ActivityDialog_weekDays_sunday"
				value="#{bundle.aon_sunday}" />
			<h:selectBooleanCheckbox id="ActivityDialog_weekDays_sunday"
				value="#{activityDialog.sunday}" style="margin-right: 10px;"/>
		</aon:div>

		<aon:outputLabel for="ActivityDialog_who"
			value="#{bundle.aon_holder}" />
		<aon:div>
			<aon:inputText id="ActivityDialog_who" value="#{activityDialog.login}"
				required="#{true}" size="20" disabled="#{(!activityDialog.new) or activityDialog.request}">
				<f:validateLength maximum="20" />
			</aon:inputText>
			<aon:outputText id="ActivityDialog_who_request" value="#{activityDialog.who}"
				size="20" />
		</aon:div>
		
		<aon:outputLabel for="ActivityDialog_why"
			value="#{bundle.aon_remark}" />
		<aon:inputTextarea id="ActivityDialog_why" value="#{activityDialog.why}"
			required="#{true}" cols="50" rows="4" disabled="#{!activityDialog.new}">
			<f:validateLength maximum="128" />
		</aon:inputTextarea>
		
		<aon:outputLabel 
			value="&#160;" />
		<aon:div>
			<aon:commandButton id="activityDialog-reset"
				value="#{bundle.aon_reset}" reRender="activityDialogTable"
				rendered="#{!activityDialog.new and activityDialog.request}" 
				styleClass="aon-icon-new"
				accesskey="#{bundle.aon_key_new}" >
				<aon:actionListener method="#{activityDialog.onInitializeRequest}" />
			</aon:commandButton>
			<aon:commandButton id="activityDialog-email"
				value="#{bundle.webmail_send_email}" reRender="activityDialogTable"
				rendered="#{activityDialog.new and activityDialog.request}"
				styleClass="aon-icon-webmail2"
				accesskey="#{bundle.aon_key_new}" >
				<aon:actionListener method="#{activityDialog.onAccept}" />
				<aon:actionListener method="#{activityDialog.onEmail}" />
			</aon:commandButton>
		</aon:div>
	</aon:panelGrid>
		
</ui:composition>
