<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="assetTypeForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.asset_type_module}" />
				<ui:param name="controller" value="#{assetType}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
			<aon:panelGrid columns="2" style="width: 100%;" 
				columnClasses="aon-panelGrid-odd aon-width-200, aon-panelGrid-even aon-width-auto" >
			
				<aon:outputLabel for="assetType_name" 
					value="#{bundle.aon_name}" />
				<aon:inputText id="assetType_name"
					value="#{assetType.to.name}" 
					maxlength="32" size="45" >
					<f:validateLength maximum="32" />
				</aon:inputText>
				
				<ui:include src="/com/code/aon/ui/asset/facelet/assetStretch/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{assetType.to.assetStretch}" />
					<ui:param name="skipNewButton" value="#{true}" />
				</ui:include>
		
			</aon:panelGrid>
			
				
			</aon:div>
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{assetStretchLookup}" />

	</ui:define>
</ui:composition>
