<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="assetStretch">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.asset_asset_module}" />
				<ui:param name="controller" value="#{asset}" />
			</ui:include>
				
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{asset}" />

				<ui:define name="searchContent">
						
					<aon:outputLabel value="#{bundle.aon_name}" />
					<aon:inputText id="asset_name" 
						valueChangeListener="#{asset.addExpression}" />
					
					<aon:outputLabel value="#{bundle.aon_description}" />
					<aon:inputText id="asset_description"  
						valueChangeListener="#{asset.addExpression}" />
					
					<!--  
					<ui:include src="/com/code/aon/ui/asset/facelet/assetType/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{asset.to.assetType}" />
						<ui:param name="skipNewButton" value="#{true}" />
					</ui:include>
					-->
						
				</ui:define>
			</ui:decorate>				
		</aon:form>
		
	</ui:define>
</ui:composition>
