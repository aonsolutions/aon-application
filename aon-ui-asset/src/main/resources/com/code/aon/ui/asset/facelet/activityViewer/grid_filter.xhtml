<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:div styleClass="aon-panelGrid-search">
		<aon:div styleClass="aon-panelGrid-search-info">
			<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
		</aon:div>	
		<aon:div styleClass="aon-text-center aon-margin-bottom" >
			<aon:commandButton id="prev" ignoreDupResponses="true"
				value="Anterior"
				reRender="dayActivities, filter"
				styleClass="aon-commandButton font-small"
				actionListener="#{controller.decreaseStartDate}" />
			<aon:selectOneMenu 
				styleClass="aon-margin-left aon-margin-right"
				value="#{controller.startDateIncrease}" >
				<f:selectItem itemLabel="Dia" itemValue="1" />
				<f:selectItem itemLabel="Semana" itemValue="7" />
				<f:selectItem itemLabel="Mes" itemValue="30" />
			</aon:selectOneMenu>
			<aon:commandButton id="next" ignoreDupResponses="true"
				value="Siguiente"
				reRender="dayActivities, filter"
				styleClass="aon-commandButton font-small"
				actionListener="#{controller.increaseStartDate}" />
		</aon:div>
				
		<aon:panelGrid columns="2"  style="width:100%;"
			columnClasses="aon-panelGrid-odd aon-width-50, 
			aon-panelGrid-even aon-width-auto">
			
				<!--  
				<aon:outputLabel styleClass="aon-italic aon-margin-left aon-margin-right"
					value="#{bundle.asset_filter_viewerType}" />
				<aon:selectOneMenu 
					styleClass="aon-margin-right"
					value="#{controller.viewerType}" >
					<f:selectItems value="#{assetCollections.viewerTypes}" />
					<a4j:support event="onchange" reRender="availabilityForm" ignoreDupResponses="true" >
						<aon:actionListener method="#{controller.onInitialize}" />
					</a4j:support>
				</aon:selectOneMenu>
				-->
					<!--  
				<aon:outputText value="&#160;" />
				<aon:div >
					<aon:commandButton id="prev" ignoreDupResponses="true"
						value="Anterior"
						reRender="dayActivities, filter"
						styleClass="aon-commandButton font-small"
						actionListener="#{controller.decreaseStartDate}" />
					<aon:selectOneMenu 
						styleClass="aon-margin-left aon-margin-right"
						value="#{controller.startDateIncrease}" >
						<f:selectItem itemLabel="Dia" itemValue="1" />
						<f:selectItem itemLabel="Semana" itemValue="7" />
						<f:selectItem itemLabel="Mes" itemValue="30" />
					</aon:selectOneMenu>
					<aon:commandButton id="next" ignoreDupResponses="true"
						value="Siguiente"
						reRender="dayActivities, filter"
						styleClass="aon-commandButton font-small"
						actionListener="#{controller.increaseStartDate}" />
				</aon:div>
					-->
			
				<aon:outputLabel 
					value="#{bundle.aon_start_date}" />
				<aon:selectInputDate  
					value="#{controller.viewerStartDate}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
					<a4j:support event="onchanged" reRender="dayActivities" ignoreDupResponses="true">
						<aon:actionListener method="#{controller.reloadViewer}" />
					</a4j:support>
					<a4j:support event="oninputchange" reRender="dayActivities" ignoreDupResponses="true">
						<aon:actionListener method="#{controller.reloadViewer}" />
					</a4j:support>
				</aon:selectInputDate>
				
				<aon:outputLabel value="#{bundle.asset_filter_availability}" />
				<h:panelGrid columns="2" >
					<rich:inputNumberSpinner 
						value="#{controller.assetAvailability}" inputSize="2" >
						<a4j:support event="onchange" reRender="dayActivities" ignoreDupResponses="true">
							<aon:actionListener method="#{controller.reloadViewer}" />
						</a4j:support>
						<a4j:support event="oninputchanged" reRender="dayActivities" ignoreDupResponses="true">
							<aon:actionListener method="#{controller.reloadViewer}" />
						</a4j:support>
			  		</rich:inputNumberSpinner>
					<aon:outputText styleClass="aon-margin-left" 
						value="#{bundle.asset_activity_days}" />
				</h:panelGrid>
				
				<aon:outputText value="&#160;" />
				<hr />
				
				<!--  
				<ui:include src="/com/code/aon/ui/asset/facelet/assetType/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{controller.assetType}" />
					<ui:param name="skipNewButton" value="#{true}" />
				</ui:include>
				-->
				<!--  
				<aon:outputLabel 
					value="#{bundle.asset_features}" />
				<aon:div>
					<aon:selectOneMenu 
						value="#{controller.featureFilter}" >
						<f:selectItem itemLabel="-" itemValue="#{null}" />
						<f:selectItems value="#{controller.featuresList}" />
					</aon:selectOneMenu>
					<aon:commandButton id="addFeature" ignoreDupResponses="true"
						reRender="filter"
						styleClass="aon-dataScroller-button aon-icon-search-add"
						actionListener="#{controller.addFeature}" />
					<aon:commandButton id="cleanFeature" ignoreDupResponses="true"
						reRender="filter"
						styleClass="aon-dataScroller-button aon-icon-delete"
						actionListener="#{controller.cleanFeatureFilter}" />
					<h:panelGrid columns="2">
						<c:forEach items="#{controller.featureFilterList}" var="feature" >
							<aon:outputText value="#{feature.name}" />
							<aon:commandButton id="removeFeature-#{feature.id}" ignoreDupResponses="true"
								reRender="filter"
								styleClass="aon-dataScroller-button aon-icon-search-minus"
								actionListener="#{controller.removeFeature}" />
						</c:forEach>
					</h:panelGrid>
				</aon:div>
				-->
				<aon:outputLabel 
					value="#{bundle.asset_features}" />
				<aon:div>
					<aon:selectManyCheckbox layout="pageDirection" 
						value="#{controller.featureFilter}" >
						<f:selectItems value="#{controller.featuresList}" />
					</aon:selectManyCheckbox>
					<aon:commandButton id="addFeature" ignoreDupResponses="true"
						value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
						reRender="dayActivities, filter" 
						actionListener="#{controller.reloadViewer}" />
				</aon:div>
			
				<!--  
				<ui:include src="/com/code/aon/ui/asset/facelet/feature/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{controller.feature}" />
					<ui:param name="skipNewButton" value="#{true}" />
					<aon:methodParam name="lookupChangeListener" value="#{controller.reloadViewer}" type="lookupChangeListener" />
				</ui:include>
				-->
		
		</aon:panelGrid>
		
	</aon:div>	
		
</ui:composition>
