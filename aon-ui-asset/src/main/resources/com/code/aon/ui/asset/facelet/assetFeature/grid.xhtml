<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-scroll-area">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
			<ui:param name="controller" value="#{controller}" />
			<ui:param name="columnClasses" value="aon-editDataTable-textColumn" />
			
			<ui:define name="columns">
				
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel value="#{assetBundle.asset_feature}" />
					</f:facet>
					<aon:outputText value="#{to.feature.name}" rendered="#{formList}"  />
					<aon:selectOneMenu id="AssetFeature_feature" rendered="#{formEdit}"
						value="#{controller.to.feature}" >
						<f:selectItem itemLabel="-" itemValue="#{null}" />
						<f:selectItems value="#{assetCollections.featureList}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu id="AssetFeature_feature-New" rendered="#{formNew}"
							value="#{controller.to.feature}" >
							<f:selectItem itemLabel="-" itemValue="#{null}" />
							<f:selectItems value="#{assetCollections.featureList}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
				
			</ui:define>
			
		</ui:decorate>
	</aon:div>
</ui:composition>
