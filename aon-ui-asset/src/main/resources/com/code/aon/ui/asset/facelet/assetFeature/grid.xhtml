<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-scroll-area">

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
			<ui:param name="controller" value="#{assetFeature}" />
			<ui:param name="columnClasses" value="aon-editDataTable-textColumn" />
			
			<ui:define name="columns">
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel value="#{assetBundle.asset_feature}" />
					</f:facet>
					<aon:outputText value="#{to.feature.name}" rendered="#{formList}"  />
					<aon:selectOneMenu id="AssetFeature_feature" rendered="#{formEdit}"
						value="#{assetFeature.to.feature}" >
						<f:selectItem itemLabel="-" itemValue="#{null}" />
						<f:selectItems value="#{assetCollections.featureList}" />
					</aon:selectOneMenu>
					<!--  
					<ui:include src="/com/code/aon/ui/asset/facelet/feature/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{assetFeature.to.feature}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formEdit}" />
					</ui:include>
					-->
					<f:facet name="footer">
						<aon:selectOneMenu id="AssetFeature_feature-New" rendered="#{formNew}"
							value="#{assetFeature.to.feature}" >
							<f:selectItem itemLabel="-" itemValue="#{null}" />
							<f:selectItems value="#{assetCollections.featureList}" />
						</aon:selectOneMenu>
						<!--  
						<ui:include src="/com/code/aon/ui/asset/facelet/feature/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{assetFeature.to.feature}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupSuffix" value="-New" />
						</ui:include>
						-->
					</f:facet>
				</aon:column>
			</ui:define>
			
		</ui:decorate>
	</aon:div>
</ui:composition>
