<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/certificateBatchGeneration/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.certificateBatchGeneration_step1}" />
	</ui:define>

	<ui:define name="step_content">
		<aon:div styleClass="aon-scroll-area">
			<aon:dataTable id="empleadoData" value="#{certificateBatchGenerationWizard.model}"
				var="to" rows="20" rendered="#{certificateBatchGenerationWizard.model.rowCount > 0}"
				columnClasses="
				aon-editDataTable-iconColumn, 
				aon-editDataTable-textColumn, 
				aon-editDataTable-textColumn, 
				aon-editDataTable-textColumn, 
				aon-editDataTable-dateColumn,
				aon-editDataTable-textColumn aon-width-250">

				<aon:column>
					<f:facet name="header">
						<aon:div layout="none">
							<aon:commandButton id="selectButton" 
								actionListener="#{certificateBatchGenerationWizard.onSelectAll}"
								reRender="empleadoData"
								onclick="if (!confirm('Desea marcar #{certificateBatchGenerationWizard.model.rowCount} filas?')) {return false;}"
								value="&#160;" style="margin-right: 0px;"
								styleClass="aon-editDataTable-button aon-icon-checkAll aon-vertical-align-top" />
							<aon:commandButton id="deselectButton" 	
								actionListener="#{certificateBatchGenerationWizard.onDeselectAll}"
								reRender="empleadoData"
								onclick="if (!confirm('Desea desmarcar #{certificateBatchGenerationWizard.model.rowCount} filas?')) {return false;}"
								value="&#160;" style="margin-right: 0px;"
								styleClass="aon-editDataTable-button aon-icon-checkNone aon-vertical-align-top" />
						</aon:div>
					</f:facet>
					<aon:selectBooleanCheckbox id="checkMessage" value="#{to.selected}"
						style="cursor: default;" styleClass="aon-vertical-align-middle">
						<a4j:support event="onclick"
							reRender="checkMessage, empleadoData"  />
					</aon:selectBooleanCheckbox>
				</aon:column>
				
				<ui:include src="/com/esferalia/aon/ui/payroll/facelet/certificateBatchGeneration/columns.xhtml" />
				
				<aon:column >
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.payroll_causa_suspension}" />
					</f:facet>
				    <aon:outputText rendered="#{!to.selected}" value="&#160;" />
					 <rich:inplaceSelect rendered="#{to.selected}" 
					 	id="suspensionCause" 
					 	value="#{to.suspensionCause}"
					 	listHeight="300px" listWidth="300px" 
					 	style="width:250px; overflow:hidden; white-space:normal; border-bottom-style:none; cursor: pointer;"
				        defaultLabel="&#160;-&#160;" >
						<f:selectItems value="#{payrollCollections.suspensionCause}" />
					</rich:inplaceSelect>
				</aon:column>
			</aon:dataTable>
			<aon:dataScroller2 for="empleadoData" showNote="true" />
		</aon:div>

	</ui:define>
</ui:composition>
