<set-icon
  *ngIf='!matIcon'
  matTooltip= "{{ toolTip }}"
  [attr.shape]="shape"
  [ngStyle]="{
    'width': size,
    'height': size,
    'color': color,
    'padding': padding,
    'backgroundColor': backgroundColor,
    'border': border,
    'borderRadius': borderRadius
  }"
></set-icon>

<mat-icon
  *ngIf='matIcon'
  svgIcon="{{ shape }}"
  [ngStyle]="{
    'width': size,
    'height': size,
    'color': color,
    'padding': padding,
    'backgroundColor': backgroundColor,
    'border': border,
    'borderRadius': borderRadius
  }"
></mat-icon>
