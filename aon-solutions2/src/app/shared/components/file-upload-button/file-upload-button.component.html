<!-- (filesChangeEmiter)="onDrop($event)" -->
<label
  appDragAndDrop
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
  (dragleave)="onDragLeave($event)"
  [ngClass]="{'drag-over': isDropOver}"
  id="file-upload"
>
  <input
    multiple
    type="file"
    (click)="uploadDocument($event)"
    (change)="onFileSelected($event)"
  />
  <ng-content></ng-content>
</label>

<!-- Modal -->
<app-modal-controller #modal></app-modal-controller>
<!-- Fin Modal -->
