<ng2-pdfjs-viewer *ngIf="this.fileBytes && pdfSrc.FileType.split('/')[1] === 'pdf'"
  [zoom]  = "zoom"
  [locale]= "locale"
  [pdfSrc]= "fileBytes"
></ng2-pdfjs-viewer>
<img *ngIf="this.fileBytes && pdfSrc.FileType.split('/')[1] !== 'pdf'" [src]="'data:'+ pdfSrc.FileType +';base64,' + fileBytes" alt="Image">
