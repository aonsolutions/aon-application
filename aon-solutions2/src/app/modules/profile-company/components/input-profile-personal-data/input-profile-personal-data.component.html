<div class="form">
  <app-input
    [type]="'text'"
    [label]="'PROFILE.NAME' | translate"
    [placeholder]="'PROFILE.PLACEHOLDER' | translate"
    [required]="'required'"
  ></app-input>
  <app-input
    [type]="'text'"
    [label]="'PROFILE.LAST_NAME' | translate"
    [placeholder]="'PROFILE.PLACEHOLDER' | translate"
    [required]="'required'"
  ></app-input>
</div>
<div class="form">
  <app-input
    [type]="'text'"
    [label]="'PROFILE.EMAIL' | translate"
    [placeholder]="'PROFILE.PLACEHOLDER' | translate"
    [required]="'required'"
  ></app-input>
  <app-input
    [type]="'text'"
    [label]="'PROFILE.PHONE' | translate"
    [placeholder]="'PROFILE.PLACEHOLDER' | translate"
    [required]="'required'"
  ></app-input>
</div>
<div class="form">
  <app-input
    [type]="'password'"
    [label]="'PROFILE.PASSWORD' | translate"
    [placeholder]="'PROFILE.PLACEHOLDER' | translate"
    [required]="'required'" 
    [suffixShowIcon]="true"
  >
    <app-icon [shape]="'edit'" suffix></app-icon>
  </app-input>
</div>
