<div class="models">
    <div class="modelsHeader">
        <div class="modelsHeaderName">
            <div class="modelsHeaderLine"></div>
            <div class="modelsHeaderText">
                Impuestos
            </div>
        </div>
        <div class="modelsHeaderFilters">
            <div class="modelsHeaderFilterText">
                {{selected}}
            </div>
            <div class="modelsHeaderFilterIcon" [matMenuTriggerFor]="menu">
                <set-icon shape="more_vert" set-color [ngStyle]="{'color': 'black'}" size="21"></set-icon>
            </div>
            <mat-menu #menu="matMenu" xPosition="before">
                <button *ngFor="let item of items" mat-menu-item (click)="selected=item" class="menuText">{{item}}</button>
            </mat-menu>
        </div>
    </div>
    <div class="modelsContent">
        <div *ngFor="let model of models" class="modelsContentElement">
            <div class="modelsContentElementName">{{model.name}}</div>
            <div class="modelsContentElementAmount">
                <div class="modelsContentElementAmountText">
                    <div stlye="width=10px;">
                        <div class="modelsContentElementAmountPoint"></div>
                    </div>
                    {{model.amount}}
                </div>
                <div class="modelsContentElementAmountIcon">
                    <set-icon shape="arrow_forward_ios" set-color [ngStyle]="{'color': '#b4b4bb'}" size="21"></set-icon>
                </div>
            </div>
        </div>
    </div>
</div>
