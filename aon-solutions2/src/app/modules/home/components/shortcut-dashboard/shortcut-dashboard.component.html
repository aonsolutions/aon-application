<div class="shortcutDashboard">
  <app-button
    [border]="'.05rem'"
    [borderRadius]="'.2rem'"
    [fontSize]="'14'"
    [height]="'3.05rem'"
    [width]="'100%'"
    [backgroundColor]="'white'"
    appGlobalHover>
    <div class="shortcutDashboardIcon">
      <app-icon
        [shape]="shape"
        set-color
        color="gray"
        size="21"
        backgroundColor="#F0F0F1">
      </app-icon>
    </div>
    <span class="">{{ name }}</span>
  </app-button>
</div>
