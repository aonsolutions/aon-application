<app-content>
    <app-button
        [width]="'14rem'" 
        [height]="'4rem'" 
        [border]="'.0625rem solid #7985cb'" 
        [borderRadius]="'0.4rem'"
        [backgroundColor]="'#7985cb'"
        [color]="'white'"
        [hoverBackgroundColor]="'#97a0d6'"
        [hoverBorderColor]="'#97a0d6'"
        [padding]="'1rem'"
        [align]="'left'"
        [fontSize]="'1rem'"
        >
        <app-icon [shape]="'send'" [color]="'white'" size="1.5rem"></app-icon>
        &nbsp;&nbsp;
        ENVIAR
    </app-button>
    <app-button [width]="'100%'" 
    [height]="'auto'" 
    [border]="'.0625rem solid black'" 
    [borderRadius]="'0.4rem'"
    [backgroundColor]="'white'"
    [color]="'black'"
    [hoverBackgroundColor]="'black'"
    [hoverBorderColor]="'black'"
    [hoverColor]="'white'"
    [padding]="'.5rem'"
    [align]="'center'"
    [fontSize]="'1rem'"
    >INICIAR SESIÓN</app-button>
</app-content>
