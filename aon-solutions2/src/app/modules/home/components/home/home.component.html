<app-content>
    <app-tabs [tabs]="tabs" (changeTabIndex)="this.tabIndex = $event" [tabColor]="'#2eb8a1'" [paddingLeftHeader]="'1rem'">
        <div tool><span>Example</span>&nbsp;&nbsp;<app-icon shape="create" color="black" size="1.2rem"></app-icon></div>
        <div content *ngIf="this.tabIndex == 0">content 1</div>
        <div content *ngIf="this.tabIndex == 1">content 2</div>
        <div content *ngIf="this.tabIndex == 2">content 2</div>
    </app-tabs>
</app-content>
