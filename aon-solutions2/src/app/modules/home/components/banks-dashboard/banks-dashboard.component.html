<app-card class="dashboard min blue">
  <div header>
    <div class="line"></div>
    <div class="text">{{ 'HOME.YOUR_BANKS'| translate }}</div>
    <div class="options">
      <app-icon [shape]="'add'" [routerLink]="'/billing/creacion'"></app-icon>
    </div>
  </div>
  <div
    body
    class="list-bank"
  >
    <app-spinner *ngIf="spinner"></app-spinner>
    <div *ngIf="!spinner && hasBanks()">
      <div *ngFor="let bank of banks" class="list-bank-row">
        <div class="list-bank-name">
          {{ bank.Name }}
          <!-- {{ bank.Logo }} -->
        </div>
        <div class="list-bank-money">{{ formatTotal(bank.Total) }} €</div>
      </div>
    </div>
    <div class="bank-link-create" *ngIf="!hasBanks()">
      <h5 class="title" [routerLink]="'/billing/creacion'">
        {{ 'HOME.CREATE_YOUR_FIRST_BANK'|translate }}
      </h5>
    </div>
    <div class="banks-create-text" *ngIf="!hasBanks()">
      {{ 'HOME.CONNECT_AON'|translate }}
    </div>
  </div>
<div
*ngIf="!spinner && hasBanks()"
footer
class="list-bank-footer"
>
{{  formatTotal(totalAmount) }} €
</div>
</app-card>
