<app-card class="dashboard min blue">
  <div header>
    <div class="line"></div>
    <div class="text">{{ 'HOME.YOUR_BANKS'| translate }}</div>
    <div class="options">
      <app-icon [shape]="'add'"></app-icon>
    </div>
  </div>
  <app-spinner body *ngIf="spinner"></app-spinner>
  <div
    *ngIf="!spinner"
    body
    class="list-bank"
  >
    <div *ngFor="let bank of banks" class="list-bank-row">
      <div class="list-bank-name">
        {{ bank.Name }}
        <!-- {{ bank.Logo }} -->
      </div>
      <div class="list-bank-money">{{ bank.Total }} €</div>
    </div>
    <div class="bank-link-create" *ngIf="!hasBanks()">{{ 'HOME.CREATE_YOUR_FIRST_BANK'|translate }}</div>
    <div class="banks-create-text" *ngIf="!hasBanks()">
      {{ 'HOME.CONNECT_AON'|translate }}
    </div>
  </div>
  <div
    *ngIf="!spinner"
    footer
    class="list-bank-footer"
  >
    {{ totalAmount }} €
  </div>
</app-card>
