 <app-card [class]="class">
  <div body>
    <div class="line"></div>
    <div class="button-content">
      <div class="icon-background">
        <set-icon [attr.shape]="shape"></set-icon>
      </div>
      <div class="button-content-text">
        {{ name }}
      </div>
    </div>
    <div class="button-arrow">
      <app-icon
        class="arrow"
        shape="arrow_forward_ios"
      ></app-icon>
    </div>
  </div>
</app-card>
