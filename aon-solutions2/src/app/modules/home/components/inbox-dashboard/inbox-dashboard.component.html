<div id="home-inbox">
  <div header>
    <div class="line"></div>
    <div class="text">{{ 'HOME.INBOX'|translate }}</div>
  </div>
  <app-table
    mat-table
    mat-flat-table
    [displayedColumns]="displayedColumns"
    [data]="bodyTable"
    (listenParentRow)="rowClick($event)"
    (listenParentHandler)="actionIcon($event)"
  ></app-table>
  <hr>
  <div id="home-inbox-total">
    <span class="text" [routerLink]="routerlink" >{{ "HOME.ALL_MESSAGES" | translate}}</span> <span class="circle red">{{ messageTotal }}</span>
  </div>
</div>
