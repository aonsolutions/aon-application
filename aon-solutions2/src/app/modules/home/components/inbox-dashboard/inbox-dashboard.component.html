<div id="home-inbox">
  <div header>
    <div class="line"></div>
    <div class="text">{{ 'HOME.INBOX'|translate }}</div>
  </div>
  <app-table
    mat-table
    mat-flat-table
    [displayedColumns]="displayedColumns"
    [data]="bodyTable"
    (listenParentRow)="rowClick($event)"
  ></app-table>
  <hr>
  <div id="home-inbox-total">
    <span class="text" [routerLink]="routerlink" >ver todo los mensajes</span> <span class="total">{{ messageTotal }}</span>
  </div>
</div>
