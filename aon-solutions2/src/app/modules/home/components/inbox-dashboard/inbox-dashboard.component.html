<app-card
  [headerHeight]="'10%'"
  [footerHeight]="'15%'"
  [padding]="'0.75rem'"
  [width]="'100%'"
  [height]="'23.15rem'"
  [border]="'0.05rem solid #D2D2D6'"
  [borderRadius]="'0.2rem'"
>
  <div header class="head-card">
    <div class="line-head"></div>
    <div class="text">Bandeja</div>
  </div>
  <div body class="content-center">
    <app-list-dashboard
      *ngFor="let item of messages"
      [name]="item.name"
      [type]="item.type"
      [subject]="item.subject"
      [date]="item.date"
      [description]="item.description"
    ></app-list-dashboard>
  </div>
  <div footer class="messages-footer">
    <div class="see-all">Ver todos los mensajes</div>
    <div class="circle"><span class="number-circle">14</span></div>
  </div>
</app-card>
