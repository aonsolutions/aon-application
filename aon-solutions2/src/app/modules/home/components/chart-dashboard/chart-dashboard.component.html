<app-card class="dashboard blue">
  <div header>
    <div class="line"></div>
    <div class="text">{{ name }}</div>
    <div class="options-text">{{ selected }}</div>
    <div class="options">
      <app-icon shape="more_vert" [matMenuTriggerFor]="menu"></app-icon>
      <mat-menu #menu="matMenu">
        <button *ngFor="let item of items" mat-menu-item (click)="selected = item">
          {{ item }}
        </button>
      </mat-menu>
    </div>
  </div>
  <div body>
    <app-chart
      [chartLabels]="labels"
      [chartType]="chartType"
      [chartData]="data"
      [colors]="colors"
    >
    </app-chart>
  </div>
  <div footer>
    <app-icon (click)="toggleChartType()" [shape]="getToggleIcon()"></app-icon>
  </div>
</app-card>
