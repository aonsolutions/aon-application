<app-card class="dashboard blue">
  <div header>
    <div class="line"></div>
    <div class="text">{{ name }}</div>
    <div class="options-text">{{ selected }}</div>
    <div class="options">
      <app-icon shape="more_vert" (click)="dropdownMenuComponent.openDropdownMenu();"></app-icon>
      <app-dropdown-menu #chart *ngIf="menuItem.length > 0" [menuItem]="menuItem"></app-dropdown-menu>
    </div>
  </div>
  <div body>
    <app-spinner *ngIf="spinner"></app-spinner>
    <app-chart
      [chartType]       = "chartType"
      [chartDataLabel]  = "chartDataLabel"
      [chartData]       = "chartData"
      [chartLabels]     = "chartLabels"
      [colors]          = "chartColors"
    >
    </app-chart>
  </div>
  <div footer>
    <app-icon (click)="toggleChartType()" [shape]="getToggleIcon()"></app-icon>
  </div>
</app-card>
