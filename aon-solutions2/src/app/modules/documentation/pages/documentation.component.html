<app-grid-layout>
<!--Header-->
  <div header>
  <!-- Subir documentacion -->
    <mat-grid-list class="margin-top margin-bottom" [cols]="24" [rowHeight]="'2.8rem'">
      <mat-grid-tile [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"></mat-grid-tile>
      <mat-grid-tile [gridCols]="{ xs: 22, sm: 22, md: 22, lg: 22, xl: 22 }">
        <app-file-upload-button>
          {{ 'COMMON.FILE_UPLOAD_BUTTON'|translate }}
          <app-icon shape="cloud_upload" class="margin-left"></app-icon>
        </app-file-upload-button>
      </mat-grid-tile>
    </mat-grid-list>
  <!-- FIN Subir documentacion -->
  <!-- Busqueda y opciones en los documentos -->
    <!--<mat-grid-list class="margin-top margin-bottom" [cols]="24" [rowHeight]="'3.8rem'">-->
    <mat-grid-list class="margin-top margin-bottom" [cols]="24" [rowHeight]="'3.8rem'">
      <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
      <!--Buscar-->
      <mat-grid-tile [gridCols]="{xs:20,sm:18,md:14,lg:11,xl:11}">
        <app-input
          [appearance]="'outline'"
          [appearanceDetail]="''"
          [class]="'search'"
          [type]="'search'"
          [value]="search"
          (inputValue)="searchDocumentation(search = $event)"
        ></app-input>
      </mat-grid-tile>
      <!--FIN Buscar-->
      <!--Opciones en los ficheros-->
      <mat-grid-tile
        id="document-options"
        *ngIf="showFiles"
        [gridCols]="{xs:23,sm:23,md:23,lg:11,xl:11}"
      >
        <div id="selected-elements">
          <span *ngIf="showSelectedCount" (click)="toggleSelectAll()">
            <app-icon shape="indeterminate_check_box"></app-icon>
            {{ selectedCards.length }} seleccionados
          </span>
        </div>
        <app-button
          *ngIf="showSelectAllBtn"
          class="icon-border"
          [toolTip]="'DOCUMENTATION.FILE_SELECT_ALL' | translate"
          (click)="toggleSelectAll()"
        >
          <app-icon
            [shape]="'select_all'"
          >
          </app-icon>
        </app-button>
        <app-button
          class="icon-border"
          [toolTip]="'DOCUMENTATION.FILE_SELECT_MOVE_TO' | translate"
        >
          <app-icon [shape]="'folder_special'"></app-icon>
        </app-button>
        <app-button
          class="icon-border"
          [toolTip]="'DOCUMENTATION.FILE_SELECT_DOWLOAD' | translate"
        >
          <app-icon [shape]="'cloud_download'"></app-icon>
        </app-button>
        <app-button
          class="icon-border"
          [toolTip]="'DOCUMENTATION.FILE_SELECT_DELETE' | translate"
        >
          <app-icon [shape]="'delete'"></app-icon>
        </app-button>
      </mat-grid-tile>
      <!--Opciones en los ficheros-->
    </mat-grid-list>
  <!-- FIN Busqueda y opciones en los documentos -->
  </div>
<!--FIN Header-->
<!--Nav-->
  <div id="list-folder" nav *ngIf="showMenu">
    <app-button
      *ngFor="let folder of documentationListFolders; let i = index"
      (click)="
        getDocumentation(folder.Path);
        selectFolder(folder.Path)
      "
      [id]="folder.Path"
      [ngClass]="{'select-folder': selecFolder == folder.Path}"
      class="folder icon-background-pink bold item-folder left"
      [width]="'100%'"
    ><app-icon [shape]="'folder_open'"></app-icon>
      {{ folder.Name }}
      <app-icon [shape]="'arrow_forward_ios'" class="icon-right"></app-icon>
    </app-button>
  </div>
<!--FIN Nav-->
<!--Content-->
  <div content id="document-content" class="margin">
  <!--No ducumentos-->
    <div *ngIf="showNoElements">
      No hay elementos que mostrar
    </div>
  <!--FIN No ducumentos-->
  <!--Mostrar carpetas-->
    <ng-container *ngIf="!showFiles">
      <app-button
        *ngFor="let folder of ( !showMenu ? documentationListFolders : documentationListSubFolders); let i = index"
        (click)="
          getDocumentation(folder.Path, folder.Path);
        "
        class="icon-background-pink bold left"
        width="width"
      >
        <app-icon [shape]="'folder_open'"></app-icon>
        {{ folder.Name }}
        <app-icon [shape]="'arrow_forward_ios'" class="icon-right"></app-icon>
      </app-button>
    </ng-container>
  <!--FIN Mostrar carpetas-->
  <!--Mostrar ficheros-->
    <ng-container *ngIf="showFiles">
      <app-card
        [class]="'file pink'"
        *ngFor="let cardFile of documentsList; let i = index"
        [id]="'file-'+i"
        (click)="loadFile(cardFile, 'file-'+i)"
      >
        <div header>
          <input [id]="'fileCheck-'+i" (click)="selectViewFile('file-'+i)" type="checkbox">
          <!--Menu del archivo-->
          <span
            class='card-menu'
            (click)="this.dropdownMenuComponent.openDropdownMenu();"
          >
            <app-icon [shape]="'more_vert'"></app-icon>
            <app-dropdown-menu #file *ngIf="this.menuItem.length > 0" [menuItem]="this.menuItem"></app-dropdown-menu>
          </span>
        </div>
        <div body>
          <span class="icon-background">
            <app-icon
              [shape]="'picture_as_pdf'"
            ></app-icon>
          </span>
        </div>
        <div footer>
          <div class="bold">
            {{ getNameWithExtension(cardFile.FileName, cardFile.FileType) }}
          </div>
          <div class="griss">
            dd/mm/yyyy
          </div>
        </div>
      </app-card>
    </ng-container>
  <!--FIN Mostrar ficheros-->
  </div>
<!--FIN Content-->
<!--Detail-->
  <div detail *ngIf="showDetail">
  <!--Nombre fichero-->
    <div id='file-detail'>
      <span
        class="name"
      >
        {{ getNameWithExtension(fileToShow.FileName, fileToShow.FileType) }}
      </span>
      <span
        class="close"
        (click)="
          closeShowDocumentation()
        "
      >
        <app-icon [shape]="'close'"></app-icon>
      </span>
    </div>
  <!--FIN Nombre fichero-->
  <!--Mostrar previo del fichero-->
    <!--Mostrar PDF-->
    <div id="doc-file-viewer" *ngIf="fileToShow.FileType.split('/')[1] === 'pdf'; else showImage">
      <app-file-viewer
        [locale]="localePDF"
        [zoom]="'auto'"
        [pdfSrc]="fileToShow.File"
      ></app-file-viewer>
    </div>
    <!--FIN Mostrar PDF-->
    <!--Mostrar imagen-->
    <ng-template #showImage>
      <img [src]="'data:'+ fileToShow.FileType +';base64,' + fileToShow.File" alt="Image">
    </ng-template>
    <!--FIN Mostrar imagen-->
  <!--FIN Mostrar previo del fichero-->
  </div>
<!--FIN Detail-->
</app-grid-layout>
