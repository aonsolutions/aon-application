<app-grid-layout
  [navCols]="5"
  [contentCols]="9"
  [detailCols]="10"
  [showDetail]="detail"
>
<!-- Bloque submenu izquierda -->
  <div id="documentation-menu" detail class="allSize" nav style="overflow: auto;">
    <mat-grid-list class="nav-documentation" [cols]="24" [rowHeight]="'4.2rem'">

      <mat-grid-tile [gridCols]="{xs:24,sm:24,md:24,lg:24,xl:24}" *ngFor="let folder of documentationListFolders">
        <app-button class="icon-background-pink bold item-folder left" [width]="'100%'">
          <app-icon [shape]="'folder_open'"></app-icon>
          {{ folder.Name }}
          <app-icon [shape]="'arrow_forward_ios'" class="iconRight"></app-icon>
        </app-button>
      </mat-grid-tile>

    </mat-grid-list>
  </div>

  <!-- Bloque contenido -->
  <div id="documentation-content" class="allSize" content style="overflow: auto;">

    <!-- Subir documentación -->
    <mat-grid-list class="mt mb" [cols]="24" [rowHeight]="'2.8rem'">
      <mat-grid-tile [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"></mat-grid-tile>
      <mat-grid-tile  [gridCols]="{ xs: 22, sm: 22, md: 22, lg: 22, xl: 22 }">
        <app-file-upload-button> Subir documentación
          <app-icon shape="cloud_upload" class="ml" set-color color="black" size="24"></app-icon>
        </app-file-upload-button>
      </mat-grid-tile>
    </mat-grid-list>

    <!-- Búsqueda -->
    <mat-grid-list class="mt mb" [cols]="24" [rowHeight]="''">
      <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
      <mat-grid-tile class="" [gridCols]="{xs:8,sm:8,md:8,lg:8,xl:8}">
        <app-input
          [appearance]="'outline'"
          [appearanceDetail]="''"
          [class]="'search allSize'"
          [type]="'search'"
        ></app-input>

      </mat-grid-tile>
    </mat-grid-list>

    <!-- linea divisoria -->
    <mat-grid-list [cols]="24" [rowHeight]="'1px'">
      <mat-grid-tile [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"></mat-grid-tile>
      <mat-grid-tile class="line-div" [gridCols]="{ xs: 24, sm: 24, md: 24, lg: 24, xl: 24 }">
      </mat-grid-tile>
    </mat-grid-list>

    <!-- Listado carpetas -->
    <!-- <mat-grid-list class="list-folders mt" [cols]="24" [rowHeight]="'4.6rem'">
      <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
      <mat-grid-tile class="container-folder left-content" [gridCols]="{xs:22,sm:22,md:22,lg:22,xl:22}">
        <app-button
          class="icon-background-pink bold folder-item"
          [width]="'width'"
          *ngFor="let folder of documentationListFolders"
          (click)="detail ? detail = false : detail = true"
        >
          <app-icon [shape]="'folder_open'"></app-icon>
          {{ folder.Name }}
          <app-icon [shape]="'arrow_forward_ios'"></app-icon>
        </app-button>
      </mat-grid-tile>
    </mat-grid-list> -->

    <!-- Listado ficheros -->
    <mat-grid-list class="list-folders mt" [cols]="24" [rowHeight]="'8rem'">
      <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
      <mat-grid-tile class="" [gridCols]="{xs:22,sm:22,md:22,lg:20,xl:22}">
        <div class="card-file" *ngFor="let cardFile of documentsList" >
          <app-card
            [headerHeight]="'35px'"
            [padding]="'0.2rem 0.5rem'"
            (click)="detail ? detail = false : detail = true"
          >
            <div header class="card-file-header">
              <input type="checkbox">
              <div class="iconRight" [matMenuTriggerFor]="menu">
                <set-icon shape="more_vert" set-color [ngStyle]="{ color: 'black' }" size="21"></set-icon>
              </div>
              <mat-menu #menu="matMenu" xPosition="before">
                <button *ngFor="let item of fileOptions" mat-menu-item (click)="item" class="menuText">
                  <app-icon shape="{{ item.shape }}"></app-icon>
                  {{ item.text }}
                </button>
              </mat-menu>
            </div>
            <div body class="card-file-body">
              <app-icon
                [shape]="'picture_as_pdf'"
                [size]="'1.2rem'"
                [backgroundColor]="'#fdedf2'"
                [borderRadius]="'.4rem'"
                [padding]="'0.5rem'"
                class="pink icon-card-file"
            ></app-icon>
            <span class="bold file-card-name">{{ getNameWithExtension(cardFile.FileName, cardFile.FileType) }}</span>
            <span class="file-card-date">{{ getFormattedDate() }}</span>
            </div>
        </app-card>
        </div>
      </mat-grid-tile>
    </mat-grid-list>

  </div>

  <!-- Bloque detalles -->
  <div id="documentation-detail" class="allSize" detail style="overflow: auto;">
    <app-file-viewer
      [locale]="'es-ES'"
      [zoom]="'auto'"
      [pdfSrc]="'https://vadimdez.github.io/ng2-pdf-viewer/assets/pdf-test.pdf'"
    ></app-file-viewer>
  </div>
</app-grid-layout>
