<app-content>
  <!-- Subir documentación -->
  <mat-grid-list class="mt mb" [cols]="24" [rowHeight]="'2.8rem'">
    <mat-grid-tile [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"></mat-grid-tile>
    <mat-grid-tile  [gridCols]="{ xs: 22, sm: 22, md: 22, lg: 22, xl: 22 }">
      <app-file-upload-button> Subir documentación
        <app-icon shape="cloud_upload" class="ml" set-color color="black" size="24"></app-icon>
      </app-file-upload-button>
    </mat-grid-tile>
  </mat-grid-list>

  <!-- Búsqueda -->
  <mat-grid-list class="" [cols]="24" [rowHeight]="''">
    <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
    <mat-grid-tile class="" [gridCols]="{xs:8,sm:8,md:8,lg:8,xl:8}">
      <app-input
        [appearance]="'outline'"
        [appearanceDetail]="''"
        [class]="'search allSize'"
        [type]="'search'"
      ></app-input>

    </mat-grid-tile>
  </mat-grid-list>

  <hr>

  <!-- Listado carpetas -->
  <mat-grid-list class="list-folders" [cols]="24" [rowHeight]="'4.6rem'">
    <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
    <mat-grid-tile class="container-folder left-content" [gridCols]="{xs:22,sm:22,md:22,lg:22,xl:22}">
      <app-button class="icon-background-pink bold folder-item" [width]="'width'" *ngFor="let folder of documentationListFolders" routerLink="{{ folder.Path.split('/')[1] }}">
        <app-icon [shape]="'folder_open'"></app-icon>
        {{ folder.Name }}
        <app-icon [shape]="'arrow_forward_ios'"></app-icon>
      </app-button>
    </mat-grid-tile>
  </mat-grid-list>
</app-content>
