<app-content>
  <!-- Subir documentación -->
  <mat-grid-list class="up-doc" [cols]="24" [rowHeight]="'2.8rem'">
    <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
    <mat-grid-tile class="dashed" [gridCols]="{xs:22,sm:22,md:22,lg:22,xl:22}">
      <app-file-upload-button [width]="'100%'" [height]="'100%'">
        Subir documentación
        <set-icon shape="cloud_upload" style="margin-left: 15px;" set-color color="black" size="24"></set-icon>
      </app-file-upload-button>
    </mat-grid-tile>
  </mat-grid-list>

  <!-- Búsqueda -->
  <mat-grid-list class="in-search" [cols]="24" [rowHeight]="'2.4rem'">
    <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
    <mat-grid-tile class="inpt-search" [gridCols]="{xs:7,sm:7,md:7,lg:7,xl:7}">
      <app-input
      [type]="'search'"
      [width]="'100%'"
      [appearance]="'outline'"
      [appearanceDetail]= "'mat-form-field-appearance-bold-outline'"
      [placeholder]="'Texto'"
      class="detSearch"
      ></app-input>

    </mat-grid-tile>
  </mat-grid-list>

  <hr>

  <!-- Listado carpetas -->
  <mat-grid-list class="listFolders" [cols]="24" [rowHeight]="'4.6rem'">
    <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
    <mat-grid-tile class="container-folder" [gridCols]="{xs:22,sm:22,md:22,lg:22,xl:22}">
      <app-button *ngFor="let folder of documentationListFolders"
      [class]="'folder-item'"
      >
        <app-icon shape="folder_open">
        </app-icon>
        <span class="txt-btn">{{ folder.Name }}</span>
        <app-icon
          class="icon-arrow"
          shape="keyboard_arrow_right"
          [color]="'#d2d2d6'"
        ></app-icon>
    </app-button>
  </mat-grid-tile>
</mat-grid-list>
</app-content>
