<app-content>
  <!-- Subir documnetación -->
  <mat-grid-list class="upDoc" [cols]="24" [rowHeight]="'2.8rem'">
    <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
    <mat-grid-tile class="dashed" [gridCols]="{xs:22,sm:22,md:22,lg:22,xl:22}">
      <app-file-upload-button [width]="'100%'" [height]="'100%'">
        Subir documentación
        <set-icon shape="cloud_upload" style="margin-left: 15px;" set-color color="black" size="24"></set-icon>
      </app-file-upload-button>
    </mat-grid-tile>
  </mat-grid-list>

  <!-- Búsqueda -->
  <mat-grid-list class="inSearch" [cols]="24" [rowHeight]="'2.4rem'">
    <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
    <mat-grid-tile class="inptSearch" [gridCols]="{xs:7,sm:7,md:7,lg:7,xl:7}">
      <app-input
        [appearance]="'outline'"
        appearanceDetail= "mat-form-field-appearance-bold-outline"
        [type]="'search'"
        [placeholder]="'Texto'"
        [width]="'100%'"
        class="inptSearch2"
        style="margin-bottom: 1.6rem;"
      ></app-input>
    </mat-grid-tile>
  </mat-grid-list>

  <hr>

  <!-- Listado carpetas -->
  <mat-grid-list class="listFolders" [cols]="24" [rowHeight]="'4.6rem'">
    <mat-grid-tile [gridCols]="{xs:1,sm:1,md:1,lg:1,xl:1}"></mat-grid-tile>
    <mat-grid-tile class="container-folder" [gridCols]="{xs:22,sm:22,md:22,lg:22,xl:22}">
      <app-button
        [class]="'folder-item'"
        [padding]="'1rem'"
        [color]="'#292a31'"
        [backgroundColor]="'#fff'"
        [border]="'.1rem solid #d2d2d6'"
        [borderRadius]="'0.2rem'"
        [hoverBorderColor]="'#ef6292'"
        [fontSize]="'1.2rem'"
        [align]="'left'"
        >
        <app-icon
          shape="folder_open"
          [color]="'#f6655a'"
          [backgroundColor]="'#fdedf2'"
          [padding]="'0.5rem'"
          [borderRadius]="'0.2rem'"
        ></app-icon>
        &nbsp;&nbsp;A contabilizar
        <app-icon
          shape="keyboard_arrow_right"
          [color]="'#d2d2d6'"
          [padding]="'0.5rem'"
        ></app-icon>
      </app-button>
      <app-button
        [class]="'folder-item'"
        [padding]="'1rem'"
        [color]="'#292a31'"
        [backgroundColor]="'#fff'"
        [border]="'.1rem solid #d2d2d6'"
        [borderRadius]="'0.2rem'"
        [hoverBorderColor]="'#ef6292'"
        [fontSize]="'1.2rem'"
        [align]="'left'"
        >
        <app-icon
          shape="folder_open"
          [color]="'#f6655a'"
          [backgroundColor]="'#fdedf2'"
          [padding]="'0.5rem'"
          [borderRadius]="'0.2rem'"
        ></app-icon>
        &nbsp;&nbsp;Contabilizados
        <app-icon
          shape="keyboard_arrow_right"
          [color]="'#d2d2d6'"
          [padding]="'0.5rem'"
        ></app-icon>
      </app-button>
      <app-button
        [class]="'folder-item'"
        [padding]="'1rem'"
        [color]="'#292a31'"
        [backgroundColor]="'#fff'"
        [border]="'.1rem solid #d2d2d6'"
        [borderRadius]="'0.2rem'"
        [hoverBorderColor]="'#ef6292'"
        [fontSize]="'1.2rem'"
        [align]="'left'"
        >
        <app-icon
          shape="folder_open"
          [color]="'#f6655a'"
          [backgroundColor]="'#fdedf2'"
          [padding]="'0.5rem'"
          [borderRadius]="'0.2rem'"
        ></app-icon>
        &nbsp;&nbsp;Fiscal
        <app-icon
          shape="keyboard_arrow_right"
          [color]="'#d2d2d6'"
          [padding]="'0.5rem'"
        ></app-icon>
      </app-button>
      <app-button
        [class]="'folder-item'"
        [padding]="'1rem'"
        [color]="'#292a31'"
        [backgroundColor]="'#fff'"
        [border]="'.1rem solid #d2d2d6'"
        [borderRadius]="'0.2rem'"
        [hoverBorderColor]="'#ef6292'"
        [fontSize]="'1.2rem'"
        [align]="'left'"
        >
        <app-icon
          shape="folder_open"
          [color]="'#f6655a'"

          [padding]="'0.5rem'"
          [borderRadius]="'0.2rem'"
        ></app-icon>
        &nbsp;&nbsp;Laboral
        <app-icon
          shape="keyboard_arrow_right"
          [color]="'#d2d2d6'"
          [padding]="'0.5rem'"
        ></app-icon>
      </app-button>
      <app-button
        [class]="'folder-item'"
        [padding]="'1rem'"
        [color]="'#292a31'"
        [backgroundColor]="'#fff'"
        [border]="'.1rem solid #d2d2d6'"
        [borderRadius]="'0.2rem'"
        [hoverBorderColor]="'#ef6292'"
        [fontSize]="'1.2rem'"
        [align]="'left'"
        >
        <app-icon
          shape="folder_open"
          [color]="'#f6655a'"
          [backgroundColor]="'#fdedf2'"
          [padding]="'0.5rem'"
          [borderRadius]="'0.2rem'"
        ></app-icon>
        &nbsp;&nbsp;Papelera
        <app-icon
          shape="keyboard_arrow_right"
          [color]="'#d2d2d6'"
          [padding]="'0.5rem'"
        ></app-icon>
      </app-button>
    </mat-grid-tile>
  </mat-grid-list>
</app-content>
