
<app-table
mat-table
mat-flat-table
[dataSource]="dataSource"
        color="primary"
>
<ng-container matColumnDef="name">
  <th mat-header-cell *matHeaderCellDef> Modelo </th>
  <td mat-cell *matCellDef="let model"> Modelo {{model.name}}
    <div> {{model.taxType}} </div>
  </td>
</ng-container>

<ng-container matColumnDef="result">
  <th mat-header-cell *matHeaderCellDef> Resultado </th>
  <td mat-cell *matCellDef="let model"> {{model.result}} € </td>
</ng-container>

<ng-container matColumnDef="status">
  <th mat-header-cell *matHeaderCellDef> Estado </th>
  <td mat-cell *matCellDef="let model"> {{model.status}} </td>
</ng-container>

<ng-container matColumnDef="paymentMethod">
  <th mat-header-cell *matHeaderCellDef> Método de pago </th>
  <td mat-cell *matCellDef="let model"> {{model.paymentMethod}} </td>
</ng-container>

<ng-container matColumnDef="acciones">
  <th mat-header-cell *matHeaderCellDef> Acciones </th>
  <td mat-cell *matCellDef="let model"> {{model.acciones}} </td>
</ng-container>

<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
 <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</app-table>
