<app-tabs
  [tabs]="tabs"
  (changeTabIndex)="this.tabIndex = $event"
  [tabColor]="'#fcaf5c'"
  [paddingLeftHeader]="'1rem'"
>
  <div tool >

    <app-input
    [type]="'select'"
    [label]="'Modelo'"
    [placeholder]="'Usuario'"

    [(ngModel)]={{ model.name }}
    ></app-input>

    <!-- <app-input
    [type]="'select'"
    [label]="'Año'"

    ></app-input> -->

  </div>
  <div content *ngIf="this.tabIndex == 0">

  </div>
  <div content *ngIf="this.tabIndex == 1">
    <!-- <app-table-tax-model></app-table-tax-model> -->
  </div>

  <div content *ngIf="this.tabIndex == 2">

  </div>

  <div content *ngIf="this.tabIndex == 3">
    <!-- <app-table-tax-model></app-table-tax-model> -->
  </div>

  <div content *ngIf="this.tabIndex == 4">

  </div>

</app-tabs>
