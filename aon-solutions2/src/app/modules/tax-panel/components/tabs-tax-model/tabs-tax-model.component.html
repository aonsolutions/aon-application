<app-tabs
  [tabs]="tabs"
  (changeTabIndex)="this.tabIndex = $event"
  [tabColor]="'#fcaf5c'"
  [paddingLeftHeader]="'1rem'"
>
  <div tool >
    <app-input
    [type]="'select'"
    [label]="'Modelo'"
    [label]="'Modelo'"
    [placeholder]="'Modelo'"
    ></app-input>
  </div>
  <div content *ngIf="this.tabIndex == 0">
    <mat-grid-list [cols]="24" [rowHeight]="'30rem'">
      <mat-grid-tile
        [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"
      ></mat-grid-tile>
      <mat-grid-tile class="position-top-col" [gridCols]="{ xs: 22, sm: 22, md: 22, lg: 22, xl: 22 }">
        <app-table-tax-model [trimester]="1"></app-table-tax-model>
      </mat-grid-tile>
    </mat-grid-list>
  </div>
    
  <div content *ngIf="this.tabIndex == 1">
    <app-table-tax-model [trimester]="2"></app-table-tax-model>
  </div>

  <div content *ngIf="this.tabIndex == 2">
    <app-table-tax-model [trimester]="3"></app-table-tax-model>
  </div>

  <div content *ngIf="this.tabIndex == 3">
    <app-table-tax-model [trimester]="4"></app-table-tax-model>
  </div>

  <div content *ngIf="this.tabIndex == 4">
    <app-table-tax-model></app-table-tax-model>
  </div>

</app-tabs>
