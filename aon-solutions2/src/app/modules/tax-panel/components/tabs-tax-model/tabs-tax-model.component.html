<app-tabs
  [tabs]="tabs"
  [tabIndex]="tabIndex"
  (changeTabIndex)="this.tabIndex = $event"
  [tabColor]="'orange'"
>
  <div tool>
    <div class="input-tax-model">
      <app-input
        (inputValue)="filterModel($event, 1)"
        [type]="'select'"
        [label]="'TAX_PANEL.MODEL' | translate"
        [options]="modelsList"
        [value]="this.selectedModel"
      ></app-input>
      <app-input
        (inputValue)="filterModel($event, 2)"
        [type]="'select'"
        [label]="'TAX_PANEL.YEAR' | translate"
        [options]="modelsYears"
        [value]="this.selectedYear"
      ></app-input>
    </div>
  </div>
  <div content *ngIf="this.tabIndex == 0">
    <mat-grid-list [cols]="24">
      <mat-grid-tile
        [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"
      ></mat-grid-tile>
      <mat-grid-tile
        class="position-top-col"
        [gridCols]="{ xs: 22, sm: 22, md: 22, lg: 22, xl: 22 }"
      >
        <app-table-tax-model
          [trimester]="1"
          [inputModel]="this.selectedModel"
          [inputYear]="this.selectedYear"
        ></app-table-tax-model>
      </mat-grid-tile>
    </mat-grid-list>
  </div>

  <div content *ngIf="this.tabIndex == 1">
    <mat-grid-list [cols]="24">
      <mat-grid-tile
        [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"
      ></mat-grid-tile>
      <mat-grid-tile
        class="position-top-col"
        [gridCols]="{ xs: 22, sm: 22, md: 22, lg: 22, xl: 22 }"
      >
        <app-table-tax-model
          [trimester]="2"
          [inputModel]="this.selectedModel"
          [inputYear]="this.selectedYear"
        ></app-table-tax-model>
      </mat-grid-tile>
    </mat-grid-list>
  </div>

  <div content *ngIf="this.tabIndex == 2">
    <mat-grid-list [cols]="24">
      <mat-grid-tile
        [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"
      ></mat-grid-tile>
      <mat-grid-tile
        class="position-top-col"
        [gridCols]="{ xs: 22, sm: 22, md: 22, lg: 22, xl: 22 }"
      >
        <app-table-tax-model
          [trimester]="3"
          [inputModel]="this.selectedModel"
          [inputYear]="this.selectedYear"
        ></app-table-tax-model>
      </mat-grid-tile>
    </mat-grid-list>
  </div>

  <div content *ngIf="this.tabIndex == 3">
    <mat-grid-list [cols]="24">
      <mat-grid-tile
        [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"
      ></mat-grid-tile>
      <mat-grid-tile
        class="position-top-col"
        [gridCols]="{ xs: 22, sm: 22, md: 22, lg: 22, xl: 22 }"
      >
        <app-table-tax-model
          [trimester]="4"
          [inputModel]="this.selectedModel"
          [inputYear]="this.selectedYear"
        ></app-table-tax-model>
      </mat-grid-tile>
    </mat-grid-list>
  </div>

  <div content *ngIf="this.tabIndex == 4">
    <mat-grid-list [cols]="24">
      <mat-grid-tile
        [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"
      ></mat-grid-tile>
      <mat-grid-tile
        class="position-top-col"
        [gridCols]="{ xs: 22, sm: 22, md: 22, lg: 22, xl: 22 }"
      >
        <app-table-tax-model
          [inputModel]="this.selectedModel"
          [inputYear]="this.selectedYear"
        ></app-table-tax-model>
      </mat-grid-tile>
    </mat-grid-list>
  </div>
</app-tabs>
