<app-grid-layout [contentCols]="24" [showDetail]="false">
  <div class="allSize" content style="overflow: auto">
    <mat-grid-list [cols]="24" [rowHeight]="'30rem'">
      <mat-grid-tile
        [gridCols]="{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1 }"
      ></mat-grid-tile>
      <mat-grid-tile [gridCols]="{ xs: 22, sm: 22, md: 22, lg: 22, xl: 22 }">
     <app-tabs-tax-model></app-tabs-tax-model>
      </mat-grid-tile>
    </mat-grid-list>
  </div>
</app-grid-layout>
