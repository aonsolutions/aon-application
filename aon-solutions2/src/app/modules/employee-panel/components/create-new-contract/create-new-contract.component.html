<div class="register-employee">
  <div class="header padding">
    <div class="arrow">
      <app-icon
        class="griss button"
        shape="arrow_back"
        (click)="paginaAtras()"
      ></app-icon>
      {{ "EMPLOYEE_PANEL.REGISTER_EMPLOYEE" | translate }}
    </div>

    <app-button class="green button" [align]="'left'">
      <app-icon shape="person_add"></app-icon>
      {{ "EMPLOYEE_PANEL.TO_REGISTER" | translate }}
    </app-button>
  </div>
  <hr />
</div>

<div class="form">
  <div class="structure-form">
    <div class="title">
      {{ "EMPLOYEE_PANEL.EMPLOYEE_DATA" | translate }}
    </div>
    <hr />
    <div class="form">
      <app-input
        [type]="'text'"
        [label]="'EMPLOYEE_PANEL.ID_NUMBER' | translate"
        [placeholder]="'EMPLOYEE_PANEL.ID_NUMBER' | translate"
        [value]=""
      >
      </app-input>

      <app-input
        [type]="'text'"
        [label]="'EMPLOYEE_PANEL.SURNAME_1' | translate"
        [placeholder]="'EMPLOYEE_PANEL.SURNAME_1' | translate"
        [value]=""
      >
      </app-input>

      <app-input
        [type]="'text'"
        [label]="'EMPLOYEE_PANEL.SURNAME_2' | translate"
        [placeholder]="'EMPLOYEE_PANEL.SURNAME_2' | translate"
        [value]=""
      >
      </app-input>
    </div>

    <div class="form">
      <app-input
        [type]="'text'"
        [label]="'PROFILE.NAME' | translate"
        [placeholder]="'PROFILE.NAME' | translate"
        [disabled]="'disabled'"
      >
      </app-input>
      <app-input
        [type]="'text'"
        [label]="'EMPLOYEE_PANEL.SSN' | translate"
        [placeholder]="'EMPLOYEE_PANEL.SSN' | translate"
        [disabled]="'disabled'"
      >
      </app-input>
    </div>
    <div class="title">
      {{ "PROFILE.COMPANY_INFORMATION" | translate }}
    </div>
    <hr />
    <div class="form">
      <app-input
        [type]="'select'"
        [label]="'EMPLOYEE_PANEL.WORKCENTER' | translate"
        [placeholder]="'EMPLOYEE_PANEL.WORKCENTER' | translate"
        [options]=""
        [value]=""
      >
      </app-input>
    </div>

    <div class="form">
      <app-input
        [type]="'select'"
        [label]="'EMPLOYEE_PANEL.CONTRIBUTION_ACCOUNT' | translate"
        [placeholder]="'EMPLOYEE_PANEL.CONTRIBUTION_ACCOUNT' | translate"
        [options]=""
        [value]=""
      >
      </app-input>
    </div>
  </div>
  <div class="structure-form">
    <div class="title">
      {{ "EMPLOYEE_PANEL.CONTRACT_DETAILS" | translate }}
    </div>
    <hr />
    <div class="form">
      <app-input
        [label]="'PROFILE.REGISTRATION_DATE' | translate"
        [type]="'date'"
      ></app-input>

      <app-input
        [type]="'select'"
        [label]="'EMPLOYEE_PANEL.TYPE_OF_CONTRACT' | translate"
        [placeholder]="'EMPLOYEE_PANEL.TYPE_OF_CONTRACT' | translate"
        [options]=""
        [value]=""
      >
      </app-input>
    </div>
    <div class="form">
      <app-input
        [type]="'select'"
        [label]="'EMPLOYEE_PANEL.TYPE_OF_CONTRACT' | translate"
        [placeholder]="'EMPLOYEE_PANEL.TYPE_OF_CONTRACT' | translate"
        [options]=""
        [value]=""
      >
      </app-input>

      <app-input
        [type]="'select'"
        [label]="'EMPLOYEE_PANEL.TYPE_OF_CONTRACT' | translate"
        [placeholder]="'EMPLOYEE_PANEL.TYPE_OF_CONTRACT' | translate"
        [options]=""
        [value]=""
      >
      </app-input>
    </div>

    <div class="form">
      <app-input
        [type]="'select'"
        [label]="'PROFILE.COUNTRY' | translate"
        [placeholder]="'PROFILE.COUNTRY' | translate"
        [options]=""
        [value]=""
      >
      </app-input>
      <app-input
        [type]="'select'"
        [label]="'PROFILE.CITY' | translate"
        [placeholder]="'PROFILE.CITY' | translate"
        [options]=""
      >
      </app-input>
    </div>

    <div class="form">
      <app-input
        [type]="'text'"
        [label]="'PROFILE.LEGAL_NAME' | translate"
        [placeholder]="'PROFILE.LEGAL_NAME' | translate"
        [disabled]="'disabled'"
      >
      </app-input>
      <app-input
        [type]="'text'"
        [label]="'PROFILE.TIN' | translate"
        [placeholder]="'PROFILE.TIN' | translate"
        [disabled]="'disabled'"
      >
      </app-input>
    </div>
  </div>
</div>
