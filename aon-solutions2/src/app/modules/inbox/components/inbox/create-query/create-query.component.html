<div class="modal-container">
  <div class="issue">
    <div>
      <span class="new-query Roboto-24-sp-H5">
        {{ "INBOX.NEW_QUERY" | translate }}
      </span>
    </div>
    <div class="buttons">
      <app-icon shape="fullscreen_exit"></app-icon>
      <app-icon shape="close"></app-icon>
    </div>
  </div>

  <div class="content">
    <div class="line-6"></div>
    <app-input
      [type]="'text'"
      [placeholder]="'INBOX.SUBJECT' | translate"
      class="inputSubject"
    ></app-input>
    <div class="line-7"></div>
    <app-input
      [type]="'text'"
      [placeholder]="'INBOX.TEXT' | translate"
      class="inputText"
    ></app-input>
  </div>
  <div class="button">
    <app-button [class]="'*color *position left red'" [width]="'226px'">
      <app-icon shape="send"></app-icon>
      {{ "COMMON.SEND" | translate }}
    </app-button>
  </div>
</div>
