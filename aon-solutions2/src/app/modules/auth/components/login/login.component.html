<app-content>
  <mat-grid-list [cols]="24" rowHeight="fit" [style.height]="'100%'">
    <!-- Tratar de omitir primet tiel, a favor de un offset o colspan -->
    <mat-grid-tile [gridCols]="{xs:2,sm:2,md:8,lg:8,xl:8}"></mat-grid-tile>
    <mat-grid-tile [gridCols]="{xs:20,sm:20,md:8,lg:8,xl:8}">
      <div class="contTitleLogin">
        <div class="titleAuth">
          <div>Inicia Sesión</div>
          <span>Entra en tu cuenta de AON</span>
        </div>
        <app-list-element class="inptCont" widthContainer="'100%'">
          <div class="cardBody">
            <app-input
                (inputValue)="username=$event"
                [type]="'text'"
                [label]="'Usuario'"
                [placeholder]="'Usuario'"
                [required]="'required'"
                class="inputLogin"
            ></app-input>
            <app-input
                (inputValue)="password=$event"
                [type]="'password'"
                [label]="'Contraseña'"
                [placeholder]="'Contraseña'"
                [required]="'required'"
                class="inputLogin"
            ></app-input>
            <app-button [class]="'white'" [width]="'100%'" (click)="loginUser()">
              INICIAR SESIÓN
            </app-button>
            <div class="divider">
              O INICIA SESIÓN
            </div>
            <app-button [class]="'dark'" [width]="'100%'">
              SIN CONTRASEÑA
            </app-button>
          </div>
        </app-list-element>
      </div>
    </mat-grid-tile>
  </mat-grid-list>
</app-content>
