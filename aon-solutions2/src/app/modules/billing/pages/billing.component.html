<app-grid-layout>
  <div content class="padding">
    <!-- Facturación -->
    <div class="box">
      <div class="header">
        <div class="line"></div>
        <div class="text">{{ "BILLING.BILLING" | translate }}</div>
      </div>
      <div class="data">
        <div id="charts">
          <div class="chart" *ngFor="let chartItem of chartItems">
            <app-chart-dashboard
              [name]      = "chartItem.name"
              [typeDate]  = "chartItem.typeDate"
              [direction] = "chartItem.direction"
            ></app-chart-dashboard>
          </div>
        </div>
      </div>
    </div>
    <!-- Fin facturación -->
    <!-- Tesoreria -->
    <div class="box tesoreria">
      <div class="header">
        <div class="line"></div>
        <div class="text">{{ "BILLING.TREASURY" | translate }}</div>
      </div>
      <div class="data">
        <div class="chart">
          <app-banks-dashboard [bankList]="banks$"></app-banks-dashboard>
        </div>
      </div>
    </div>
    <!-- Fin Tesoreria -->
  </div>
</app-grid-layout>
