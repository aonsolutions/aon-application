<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="campaignList">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_process_monitor}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandButton id="accept" value="#{bundle.aon_accept}"
							actionListener="#{campaign.onSearch}" action="campaign_list"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_search}" />
						<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
							actionListener="#{campaign.onCancel}" action="campaign_list"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}" />
						<h:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{campaign.onReset}" action="campaign_form"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="Campaign_description"
						value="#{campaignBundle.aon_description}" />
					<aon:inputText id="Campaign_description" size="60"
						valueChangeListener="#{campaign.addExpression}" />

					<aon:outputLabel for="Campaign_process_id"
						value="#{campaignBundle.process_process}" />
					<aon:selectOneMenu id="Campaign_process_id"
						valueChangeListener="#{campaign.addEqualExpression}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{campaignCollections.processes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Campaign_activityType_id"
						value="#{projectBundle.activity_activity_type}" />
					<aon:selectOneMenu id="Campaign_activityType_id"
						valueChangeListener="#{campaign.addEqualExpression}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{projectCollections.activityTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Campaign_status"
						value="#{campaignBundle.aon_status}" />
					<aon:selectOneMenu id="Campaign_status"
						valueChangeListener="#{campaign.addExpression}"
						converter="aonCampaignStatusConverter">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{campaignCollections.campaignStatus}" />
					</aon:selectOneMenu>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
