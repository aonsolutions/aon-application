<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="dailyTrackingForm" styleClass="aon-form">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_daily_tracking}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{dailyTracking.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandButton id="save" value="#{bundle.aon_save}"
							actionListener="#{dailyTracking.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
							actionListener="#{dailyTracking.onCancel}"
							action="daily_tracking_list" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}" />
						<h:commandButton id="remove" value="#{bundle.aon_remove}"
							actionListener="#{dailyTracking.onRemove}"
							action="daily_tracking_list" rendered="#{!dailyTracking.new}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}" />
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							actionListener="#{dailyTracking.onReset}"
							rendered="#{!dailyTracking.new}" action="daily_tracking_form"
							accesskey="#{bundle.aon_key_new}" />
						<h:commandButton id="search" value="#{bundle.aon_search}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							actionListener="#{dailyTracking.onEditSearch}"
							action="daily_tracking_search"
							accesskey="#{bundle.aon_key_search}" />
 
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel for="DailyTracking_trackingDate"
						value="#{projectBundle.aon_date}"
						styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
					<aon:selectInputDate id="DailyTracking_trackingDate"
						value="#{dailyTracking.to.trackingDate}" required="#{true}"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>

					<aon:outputLabel for="user" rendered="#{!dailyTracking.new and dailyTracking.monitor}"
						value="#{projectBundle.aon_daily_tracking_user}" />
					<aon:selectOneMenu id="user"
						rendered="#{!dailyTracking.new and dailyTracking.monitor}"
						value="#{dailyTracking.to.user.id}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{dailyTracking.users}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="DailyTracking_dossier"
						value="#{projectBundle.aon_daily_tracking_dossier}"
						styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
					<aon:selectOneMenu id="DailyTracking_dossier"
						value="#{dailyTracking.to.dossier.id}"
						styleClass="aon-form-selectOneMenu-field"
						reRender="customerIdContainer,DailyTracking_activity,DailyTracking_dossier"
						valueChangeListener="#{dailyTracking.dossierChange}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{dailyTracking.availableDossiers}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Customer_Lookup_id"
						value="#{customerBundle.customer_customer}"
						styleClass="aon-form-input-text-label" />
					<ui:include src="/facelet/shared/customer/customerIdInput.xhtml">
						<ui:param name="customer_id" value="customerId" />
						<ui:param name="renderedAttr" value="true" />
						<ui:param name="disabled" value="false" />
						<ui:param name="reRenderAttr"
							value="DailyTracking_dossier, DailyTracking_activity" />
						<ui:param name="required" value="false" />
						<ui:param name="customerEntity"
							value="#{dailyTracking.to.customer}" />
						<ui:param name="customerELExpression"
							value="dailyTracking.to.customer" />
						<ui:param name="valueChangeListener"
							value="dailyTracking.customerPojoChange" />
					</ui:include>

					<aon:outputLabel for="DailyTracking_activity"
						value="#{projectBundle.aon_daily_tracking_activity}"
						styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
					<aon:selectOneMenu id="DailyTracking_activity"
						value="#{dailyTracking.to.activity.id}"
						styleClass="aon-form-selectOneMenu-field">
						<f:selectItem itemLabel="-" itemValue=""/>
						<f:selectItems value="#{dailyTracking.activities}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="DailyTracking_jobType"
						value="#{projectBundle.aon_daily_tracking_job_type}"
						styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
					<aon:selectOneMenu id="DailyTracking_jobType"
						value="#{dailyTracking.to.jobType.id}"
						styleClass="aon-form-selectOneMenu-field">
						<f:selectItems value="#{projectCollections.jobTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="DailyTracking_duration"
						value="#{projectBundle.aon_daily_tracking_duration}"
						styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
					<aon:inputText id="DailyTracking_duration"
						value="#{dailyTracking.to.trackingDuration}" required="#{true}"
						styleClass="aon-form-input-text" size="5" />

					<aon:outputLabel for="DailyTracking_comments"
						value="#{projectBundle.aon_daily_tracking_comments}"
						styleClass="aon-form-input-text-label aon-form-table-column-odd-label" />
					<aon:inputTextarea id="DailyTracking_comments"
						value="#{dailyTracking.to.comments}" cols="51" rows="5"
						styleClass="aon-form-input-text" />
				</aon:panelGrid>
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
