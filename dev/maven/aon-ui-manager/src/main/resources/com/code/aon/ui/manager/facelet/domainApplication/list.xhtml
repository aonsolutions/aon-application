<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="domainApplicationList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{managerBundle.manager_applications} (#{domain.to.commonName})" />
				<ui:param name="controller" value="#{domainApplication}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:param name="skipResetButton" value="#{!manager.config.showDomainApplicationReset}" />
				<ui:define name="additionalToolbarContent">				
					<aon:commandButton id="back"
						title="#{bundle.aon_key_cancel_accelerator}"
						value="#{bundle.aon_back}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						action="domain_form"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{domainApplication}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.commonName}"/>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{managerBundle.manager_db_connection}" />
							</f:facet>
							<aon:outputText value="#{to.dataSource.commonName}"/>
						</aon:column>
	
						<c:if test="#{manager.administrator}">	
							<aon:column styleClass="aon-width-80 aon-editDataTable-numberColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_status}" />
								</f:facet>
								<aon:outputText value="#{to.status}"/>
							</aon:column>
						</c:if>
						
					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>
