<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_annual_report_module}" />
				<ui:param name="controller" value="#{annualReport}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">

				<ui:param name="controller" value="#{annualReport}" />
				<ui:define name="searchContent">
				
					<aon:outputLabel for="AnnualReport_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="AnnualReport_id" size="10"
						valueChangeListener="#{annualReport.addExpression}" />

					<aon:outputLabel for="AnnualReport_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="AnnualReport_name" size="40"
						valueChangeListener="#{annualReport.addExpression}" />
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
