<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="productForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.product}" />
				<ui:param name="controller" value="#{product}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:param name="skipRemoveButton" value="#{!cms.roleEditor}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="product_categories"
						value="#{appBundle.product_category}"
						action="productCategory_list"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item-no-icon">
						<aon:actionListener method="#{productCategory.onSearch}" />
					</aon:commandButton>
					<aon:commandButton id="brands"
						value="#{appBundle.brand}"
						action="brand_list"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item-no-icon">
						<aon:actionListener method="#{brand.onSearch}" />
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>
					
			<aon:div styleClass="aon-scroll-area" style="width:99%;">
	
					<aon:panelGrid columns="2" dir="true" >
							
						<aon:outputLabel for="product_alias"
							value="#{appBundle.cms_alias}" />
						<aon:inputText id="product_alias"
							required="true" size="32" maxlength="32"
							value="#{product.to.alias}">
							<f:validator validatorId="AliasValidator" />
						</aon:inputText>

						<aon:outputLabel for="productDetail_shortLabel"
							value="#{appBundle.product_shorLabel}" />
						<aon:inputText id="productDetail_shortLabel"
							size="80" maxlength="64" required="true"
							value="#{product.toI18n.shortLabel}" />
							
						<ui:include src="/facelet/content/utils/contentInput.xhtml" >
							<ui:param name="labelValue" value="#{appBundle.product_label}" />
							<ui:param name="inputTextId" value="productDetail_label" />
							<ui:param name="inputTextValue" value="#{product.toI18n.label}" />
							<ui:param name="inputTextRequired" value="#{true}" />
							<ui:param name="richTextEnabled" value="#{product.richTextEnabled}" />
						</ui:include>																	
							
						<aon:outputLabel for="product_brand"
							value="#{appBundle.product_brand}" />
						<aon:selectOneMenu id="product_brand"  
							value="#{product.to.brand}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{collections.brandList}" />
						</aon:selectOneMenu> 

						<aon:outputLabel for="product_category"
							value="#{appBundle.product_category}" />
						<aon:selectOneMenu id="product_category"  
							value="#{product.to.productCategory.id}">
							<f:selectItems value="#{collections.categories}" />
						</aon:selectOneMenu> 
						
						<aon:outputLabel for="productDetail_price"
							value="#{appBundle.product_price}" />
						<aon:inputText id="productDetail_price"
							size="20" maxlength="15"
							value="#{product.to.price}" />

						<aon:outputLabel for="productDetail_price2"
							value="#{appBundle.product_offer_price}" />
						<aon:inputText id="productDetail_price2"
							size="20" maxlength="15"
							value="#{product.to.offerPrice}" />

						<aon:outputLabel 
							value="#{appBundle.cms_image}" />
						<aon:panelGroup id="thumbnail_preview">
							<aon:graphicImage styleClass="aon-padding aon-border"
								url="#{product.to.image}.thumbnail" 
								alt="#{product.to.image}"/>
							<ui:include src="/facelet/content/utils/image_modal_button.xhtml">
								<ui:param name="listenerBean" value="#{product}" />
								<ui:param name="reRender" value="thumbnail_preview" />
								<ui:param name="thumbnail" value="#{false}" />
							</ui:include>
			                <aon:commandLink style="padding:2px"
			                	immediate="#{true}"
			                	reRender="thumbnail_preview"
			                    actionListener="#{product.onDelImage}">
								<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}"  alt="#{bundle.aon_remove}" />
			        		</aon:commandLink>
						</aon:panelGroup>

						<aon:outputLabel for="ProductDetail_alt"
							value="#{appBundle.product_alt}" />
						<aon:inputText id="ProductDetail_alt"
							size="64" maxlength="64"
							value="#{product.toI18n.alt}" />
														
						<aon:outputLabel for="Product_active"
							value="#{appBundle.product_active}"/>
						<aon:selectBooleanCheckbox id="Product_active" 
							value="#{product.to.active}" />
						
					</aon:panelGrid>

			</aon:div>
			
		</aon:form>
		<ui:include src="/facelet/content/utils/image_modal.xhtml" />
	</ui:define>
</ui:composition>
