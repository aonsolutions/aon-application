<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="trabinciForm">

					<!-- 
						<ui:include
						src="/facelet/templates/formPrintToolbar.xhtml">
					-->
					<ui:include
						src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
						<ui:param name="toolbarTitle"
							value="#{appBundle.aon_payroll_principales_otrasinci_mnto}" />
						<ui:param name="controller" value="#{trabinci}" />

						<aon:methodParam name="backAction"
							value="integralTrab_form" />
						<aon:methodParam name="cancelAction"
							value="integralTrab_form" />

					</ui:include>

					<!--	FIN HEADER & TOOLBAR	-->

					<aon:div id="bonificaData"
						styleClass="aon-scroll-area">
						
						<aon:panelGrid columns="2" dir="true"
							width="100%">

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_bonifica_trabajador}" />
							<aon:outputText value="#{trabajador.to.cdg}" size="3" maxlength="3" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_bonifica_nom_ape}" />
							<aon:div>
								<aon:outputText value="#{trabajador.to.persona.descripcion} " />
								<aon:outputText value="#{trabajador.to.persona.apellido2}, " />
								<aon:outputText value="#{trabajador.to.persona.nombre} " />
							</aon:div>
							
						</aon:panelGrid>

						<aon:panelGrid columns="2" dir="true"
							width="100%">

							<!--  
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_codtra}" />
							<aon:inputText value="#{trabajador.to.cdg}" readonly="#{!bonifica.new}"
								size="" maxlength="" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_datos_tra}" />
							<aon:div>
								<aon:outputText value="#{trabajador.to.persona.descripcion} " />
								<aon:outputText value="#{trabajador.to.persona.apellido2}, " />
								<aon:outputText value="#{trabajador.to.persona.nombre} " />
							</aon:div>
							-->
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_fecini_inci}" />
							<aon:selectInputDate id="fecini" renderAsPopup="true" readonly="#{!trabinci.new}"
								popupDateFormat="#{appBundle.aon_date_pattern}" required="true"
								value="#{trabinci.to.id.fecini}" enableManualInput="true" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_inciit_fecfin_inci}" />
							<aon:selectInputDate id="fecfin" renderAsPopup="true" required="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{trabinci.to.fecfin}" enableManualInput="true" />
					

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_otrasinci_tipo_inci}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="tipinc_cdg" readonly="#{!trabinci.new}"
									lookup="#{tipincLookup}" reRender="tipinc_descripcion" required="true"
									value="#{trabinci.to.tipinc.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="tipinc_lookup" disabled="#{!trabinci.new}"
									windowTitle="#{appBundle.aon_payroll_principales_otrasinci_tipo_inci}"
									selectReRender="tipinc_cdg,tipinc_descripcion"
									lookup="#{tipincLookup}" minHeight="440"
									property="#{trabinci.to.tipinc}">
								</aon:lookupButton>
								<aon:inputText id="tipinc_descripcion"
									value="#{(trabinci.to.tipinc.descripcion!=null)?(trabinci.to.tipinc.descripcion):('')}"
									size="45" disabled="true" />
							</aon:div>	
							
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_otrasinci_importe}" />
							<aon:inputText id="importe" value="#{trabinci.to.importe}"
								size="8" maxlength="8" />
							
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_otrasinci_horas_dias}" />
							<aon:inputText id="cantidad" value="#{trabinci.to.cantidad}" required="true"
								size="2" maxlength="2" />
							
						</aon:panelGrid>

					</aon:div>
				</aon:form>
				
				<aon:lookupButtonPopup lookup="#{tipincLookup}" />
				
			</ui:define>
		</ui:composition>
	</body>
</html>
