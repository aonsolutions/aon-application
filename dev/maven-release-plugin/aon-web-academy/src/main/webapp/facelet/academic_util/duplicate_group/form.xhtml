<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="duplicateForm" styleClass="aon-form">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="accept" value="#{bundle.aon_accept}"
							forceId="#{true}" actionListener="#{duplicateGroup.onDuplicate}"
							action="course_list" onclick="if(confirm('#{bundle.aon_accept_confirm}')){viewDialog.show();}else{ return false; }"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							rendered="#{duplicateGroup.model.rowCount >0}"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"/>
						<h:commandButton id="search" value="#{bundle.aon_cancel}"
							immediate="#{true}" action="duplicate_group_search"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							actionListener="#{duplicateGroup.onEditSearch}"
							accesskey="#{bundle.aon_key_search}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<h:outputLabel for="AcademicYear_id"
							styleClass="aon-form-input-text-label"
							value="#{bundle.aon_reset} #{appBundle.course_academic_year}" />
						<h:selectOneMenu id="AcademicYear_id"
							value="#{duplicateGroup.academicYearId}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItems value="#{academyCollections.academicYears}" />
						</h:selectOneMenu>	

						<h:outputLabel for="Date_Increment"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.course_dates_increment}" />
						<h:selectOneMenu id="Date_Increment"
							value="#{duplicateGroup.dateIncrement}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItem itemLabel="1 #{appBundle.aon_month}" itemValue="1" />
							<f:selectItem itemLabel="2 #{appBundle.aon_months}" itemValue="2" />
							<f:selectItem itemLabel="3 #{appBundle.aon_months}" itemValue="3" />
							<f:selectItem itemLabel="4 #{appBundle.aon_months}" itemValue="4" />
							<f:selectItem itemLabel="6 #{appBundle.aon_months}" itemValue="6" />
							<f:selectItem itemLabel="1 #{appBundle.aon_year}" itemValue="12" />
							<f:selectItem itemLabel="2 #{appBundle.aon_years}" itemValue="24" />
						</h:selectOneMenu>	

						<h:outputLabel for="Instructors"
							styleClass="aon-form-input-text-label"
							value="#{appBundle.course_transfer_data}" />
						<t:div>
							<h:selectBooleanCheckbox id="Instructors"
								styleClass="aon-form-selectBooleanCheckbox-field"
								value="#{duplicateGroup.instructors}" />
							<t:outputLabel for="Instructors"
								styleClass="aon-form-selectBooleanCheckbox-label"
								value="#{appBundle.instructor_instructors}" forceId="#{true}" />
							<f:verbatim>&#160;</f:verbatim>
							<f:verbatim>&#160;</f:verbatim>
							<h:selectBooleanCheckbox id="Schedules"
								styleClass="aon-form-selectBooleanCheckbox-field"
								value="#{duplicateGroup.schedules}" />
							<t:outputLabel for="Schedules"
								styleClass="aon-form-selectBooleanCheckbox-label"
								value="#{appBundle.schedule_schedules}" forceId="#{true}" />
							<f:verbatim>&#160;</f:verbatim>
							<f:verbatim>&#160;</f:verbatim>
							<h:selectBooleanCheckbox id="Skills"
								styleClass="aon-form-selectBooleanCheckbox-field"
								value="#{duplicateGroup.skills}" />
							<t:outputLabel for="Skills"
								styleClass="aon-form-selectBooleanCheckbox-label"
								value="#{appBundle.academicSkill_academicSkills}" forceId="#{true}" />
						</t:div>

					</h:panelGrid>

					<t:div styleClass="aon-form-group">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="duplicateGroupDataList"
								value="#{appBundle.course_courses}" />
						</t:div>
						<t:div styleClass="aon-form-group-body" rendered="#{duplicateGroup.model.rowCount >0}">
							<t:div>
								<t:commandButton title="#{financeBundle.aon_select_all}"
									styleClass="aon-form-button-plus" onclick="viewDialog.show();"
									value="#{financeBundle.aon_select_all}"
									actionListener="#{duplicateGroup.checkAll}" />
								<t:commandButton title="#{financeBundle.aon_select_none}"
									styleClass="aon-form-button-minus" onclick="viewDialog.show();"
									value="#{financeBundle.aon_select_none}"
									actionListener="#{duplicateGroup.checkNone}" />
							</t:div>

							<t:dataTable id="duplicateGroupDataList" cellpadding="0" cellspacing="0"
								var="to" value="#{duplicateGroup.model}" rows="20"
								rendered="#{duplicateGroup.model.rowCount > 0}" styleClass="aon-table"
								headerClass="aon-table-header"
								rowClasses="aon-table-row-odd,aon-table-row-even"
								columnClasses="aon-table-body aon-table-body-icon,
											   aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-string,
											   aon-table-body aon-table-body-string">

								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:selectBooleanCheckbox id="Included_Row_checked"
										value="#{duplicateGroup.rowChecked}"
										valueChangeListener="#{duplicateGroup.rowSelected}"
										styleClass="aon-form-selectBooleanCheckbox-field" />	
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{appBundle.course_code}" />
									</f:facet>
									<h:outputText value="#{to.code}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{appBundle.course_academic_year}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.academicYear.description}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{appBundle.course_start_date}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.startDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</h:outputText>
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{appBundle.course_end_date}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.endDate}">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</h:outputText>
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{appBundle.course_subject}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.courseSubject.description}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{appBundle.course_level}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.courseLevel.description}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{appBundle.course_workplace}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.workPlace.description}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:panelGroup>
											<h:outputText value="#{appBundle.course_status}" />
										</h:panelGroup>
									</f:facet>
									<h:outputText value="#{to.status}" />
									<f:verbatim>&#160;</f:verbatim>
								</h:column>
							</t:dataTable>

						</t:div>

						<ui:include src="/facelet/shared/dataScroller.xhtml">
							<ui:param name="dataTable" value="duplicateGroupDataList" />
							<ui:param name="model" value="#{duplicateGroup.model}" />
							<ui:param name="showNote" value="#{true}" />
						</ui:include>

					</t:div>

				</t:div>
			</t:div>

			<s:modalDialog dialogId="viewDialog" dialogVar="viewDialog"
				closeButton="false">
				<t:div styleClass="aon-timer">
					<h:graphicImage value="/css/images/content/aon-timer.gif" />
					<t:div styleClass="aon-timer-title">
						<t:outputText value="#{appBundle.aon_in_progress}" />
					</t:div>
				</t:div>
			</s:modalDialog>

		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
