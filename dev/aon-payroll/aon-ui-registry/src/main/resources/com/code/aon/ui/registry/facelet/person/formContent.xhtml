<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<ui:decorate template="/com/code/aon/ui/registry/facelet/person/formContentEx.xhtml">
		<ui:param name="skipId" value="true"/>
		<ui:param name="skipRegistryType" value="true"/>
		<ui:define name="dataPanel">

		<c:if test="#{!skipId}">
			<aon:outputLabel for="Registry_id" value="#{bundle.aon_id}" />
			<aon:inputText id="Registry_id" value="#{controller.to.id}"
				rendered="#{!controller.new}" size="15" disabled="true" />
			<aon:outputText value="--------" rendered="#{controller.new}" />
		</c:if>		
	
		<aon:outputLabel for="Registry_document"
			value="#{bundle.aon_company_document}" />
		<aon:panelGroup id="registryDocumentPanel">
			<aon:inputText id="Registry_document" maxlength="16"
				value="#{controller.to.registry.document}" size="16">
				<f:validateLength minimum="1" maximum="16" />
				<a4j:support event="onchange" focus="Registry_name"
					actionListener="#{controller.onChangeDocument}" 
					reRender="registryDocumentPanel"  
					ajaxSingle="true"/>
			</aon:inputText>
			<aon:outputText 
				rendered="#{controller.to.registry.validDocument}"
				styleClass="aon-icon-predetermine"
				style="padding-left: 15px;"
				value="&#160;" />
			<aon:outputText 
				rendered="#{!controller.to.registry.validDocument}"
				styleClass="aon-icon-exception"
				style="padding-left: 15px;"
				value="&#160;" />
			</aon:panelGroup>
	
		<aon:outputLabel for="Registry_name"
			value="#{bundle.aon_name}" />
		<aon:inputText id="Registry_name" maxlength="64"
			value="#{controller.to.name}" size="64">
			<f:validateLength minimum="1" maximum="64" />
		</aon:inputText>

		<aon:outputLabel for="Registry_firstSurname"
			value="#{registryBundle.registry_person_firstSurname}" />
		<aon:inputText id="Registry_firstSurname" maxlength="64"
			value="#{controller.to.firstSurname}" size="64">
			<f:validateLength minimum="1" maximum="64" />
		</aon:inputText>

		<aon:outputLabel for="Registry_secondSurname"
			value="#{registryBundle.registry_person_secondSurname}" />
		<aon:inputText id="Registry_secondSurname" maxlength="64"
			value="#{controller.to.secondSurname}" size="64">
			<f:validateLength minimum="1" maximum="64" />
		</aon:inputText>
					
		<aon:outputLabel for="Registry_alias"
			value="#{bundle.aon_alias}" />
		<aon:inputText id="Registry_alias" maxlength="32"
			value="#{controller.to.registry.alias}" size="32">
			<f:validateLength minimum="1" maximum="32" />
		</aon:inputText>
	
		<c:if test="#{!skipRegistryType}">
			<aon:outputText for="Registry_type" value="#{bundle.aon_entity}" />
			<aon:selectOneRadio id="Registry_type" value="#{controller.to.registry.type}">
				<f:selectItems value="#{registryCollections.registryTypes}" />
			</aon:selectOneRadio>
		</c:if>


			<aon:outputLabel for="Person_birthDate"
				value="#{registryBundle.registry_person_birthDate}" />
			<aon:selectInputDate id="Person_birthDate" 
				value="#{controller.to.birthDate}"
				inputSize="10" renderAsPopup="true" enableManualInput="true"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}">
			</aon:selectInputDate>
		
			<aon:outputLabel for="Person_socialSecurityNumber"
				value="#{registryBundle.registry_person_nss}" />
			<aon:inputText id="Person_socialSecurityNumber"
				value="#{controller.to.socialSecurityNumber}"
				size="32" maxlength="32" />
		
			<aon:outputLabel for="Person_gender"
				value="#{registryBundle.registry_person_gender}" />
			<aon:selectOneMenu id="Person_gender"
				value="#{controller.to.gender}" requiered="true">
				<f:selectItems value="#{registryCollections.genders}" />
			</aon:selectOneMenu>
						
			<aon:outputLabel for="Person_maritalStatus"
				value="#{registryBundle.registry_person_marital_status}" />
			<aon:selectOneMenu id="Person_maritalStatus"
				value="#{controller.to.maritalStatus}" requiered="true">
				<f:selectItems value="#{registryCollections.maritalStatuses}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel for="Person_address"
				value="#{registryBundle.registry_address}" />
			<aon:div>
				<aon:selectOneMenu id="RegistryAddress_streetType"
					valueChangeListener="#{person.addressChanged}" 	
					value="#{person.mainAddress.streetType}">
					<f:selectItems value="#{registryCollections.streetTypes}" />
				</aon:selectOneMenu>
				<aon:inputText id="Person_address" required="true" style="margin-left: 5px;"
					value="#{person.mainAddress.address}"
					valueChangeListener="#{person.addressChanged}" maxlength="128" size="30" />
				<aon:outputLabel for="Person_number" styleClass="aon-italic aon-margin-left"
					value="#{bundle.aon_number}" />
				<aon:inputText id="Person_number" style="margin-left: 5px;"
					value="#{person.mainAddress.number}"
					valueChangeListener="#{person.addressChanged}" maxlength="8" size="5" />
			</aon:div>

			<aon:outputLabel for="Person_address2"
				value="#{registryBundle.registry_address_detail}" />
			<aon:div>
				<aon:inputText id="Person_address2"
					value="#{person.mainAddress.address2}" style="display:block"
					valueChangeListener="#{person.addressChanged}" maxlength="128" size="40" />
				<aon:inputText id="Person_address3"
					value="#{person.mainAddress.address3}" style="display:block"
					valueChangeListener="#{person.addressChanged}" maxlength="128" size="40" />
			</aon:div>

			<aon:outputLabel for="Person_address_city"
				value="#{registryBundle.registry_city}" />
			<aon:inputText id="Person_address_city"
				value="#{person.mainAddress.city}" maxlength="64"
				valueChangeListener="#{person.addressChanged}" size="30" />
				
			<aon:outputLabel for="Person_address_zip"
				value="#{registryBundle.registry_zip}" />
			<aon:inputText id="Person_address_zip"
				value="#{person.mainAddress.zip}" maxlength="16"
				valueChangeListener="#{person.addressChanged}" size="16" />

			<aon:outputLabel for="Person_address_geozone"
				value="#{registryBundle.registry_geozone}" />
			<aon:selectOneMenu id="Person_address_geozone"
				value="#{person.mainAddress.geozone}"
				styleClass="aon-form-selectOneMenu-field"
				valueChangeListener="#{person.addressChanged}">
				<f:selectItems value="#{geozoneCollections.geoTrees}" />
			</aon:selectOneMenu>
				
			<aon:outputLabel for="Person_telephone"
				value="#{registryBundle.registry_phone}" />
			<aon:inputText id="Person_telephone" value="#{person.phone.value}"
				valueChangeListener="#{person.phoneChanged}" maxlength="64" size="15" />

			<aon:outputLabel for="Person_fax"
				value="#{registryBundle.registry_fax}" />
			<aon:inputText id="Person_fax" value="#{person.fax.value}"
				valueChangeListener="#{person.faxChanged}" maxlength="64" size="15" />

			<aon:outputLabel for="Person_email"
				value="#{registryBundle.registry_email}" />
			<aon:inputText id="Person_email" value="#{person.email.value}"
				onblur="toLowerCase(this);" maxlength="64"
				valueChangeListener="#{person.emailChanged}" size="45" />

			<aon:outputLabel for="Person_web"
				value="#{registryBundle.registry_web}" />
			<aon:inputText id="Person_web" value="#{person.web.value}"
				onblur="toLowerCase(this);" maxlength="64"
				valueChangeListener="#{person.webChanged}" size="45" />
		</ui:define>
		
		<ui:define name="securityPanel">
			<aon:outputLabel for="Registry_id" value="#{bundle.aon_id}" />
			<aon:inputText id="Registry_id" value="#{controller.to.id}"
				rendered="#{!controller.new}" size="15" disabled="true" />
			<aon:outputText value="" rendered="#{controller.new}" />	
		</ui:define>
		
		<ui:define name="othersPanel">
			
			<aon:outputLabel for="RegistryPayMethod_payment" 
				value="#{configBundle.config_pay_method}" />
			<aon:selectOneMenu id="RegistryPayMethod_payment"
				valueChangeListener="#{person.onPayMethodChanged}"
				reRender="companyOtherData"
				focus="RegistryPayMethod_bank"
				value="#{person.registryPayMethod.payment}">
				<f:selectItem value="#{null}" />
				<f:selectItems value="#{configCollections.payMethods}" />
			</aon:selectOneMenu>				

			<c:if test="#{person.registryPayMethod.payment.type != null}">
				<c:if test="#{person.showCompanyBanks}">
					<aon:outputLabel for="RegistryPayMethod_bank" value="#{configBundle.config_bank}" />
					<aon:selectOneMenu id="RegistryPayMethod_bank"
						valueChangeListener="#{person.registryBankChanged}"
						value="#{person.registryBank}">
						<f:selectItem value="#{null}" />
						<f:selectItems value="#{companyCollections.companyBanks}" />
					</aon:selectOneMenu>
				</c:if>					
				<c:if test="#{!person.showCompanyBanks and !person.cash}">
					<aon:outputLabel for="RegistryPayMethod_bank" value="#{configBundle.config_bank}" />
					<aon:panelGroup>
						<aon:lookupInputText id="RegistryPayMethod_bank" property="#{person.registryBank.bank}"
							reRender="RegistryBank_name" lookup="#{bankLookup}"
							valueChangeListener="#{person.registryBankChanged}"
							value="#{person.registryBank.bank.code}" size="5">
							<aon:joinProperty alias="Bank_code" value="#{person.registryBank.bank.code}" />
						</aon:lookupInputText>
						<aon:lookupButton 
							windowTitle="#{configBundle.config_bank_selection}"
							selectReRender="RegistryPayMethod_bank,RegistryBank_name" actionType="search"
							lookup="#{bankLookup}" minHeight="460" minWidth="650"
							property="#{person.registryBank.bank}">
						</aon:lookupButton>
						<aon:inputText id="RegistryBank_name"
							value="#{person.registryBank.bank.name}"
							size="20" disabled="true" />
							
						<aon:div>
							<aon:inputText label="#{configBundle.config_bank_code}" 
								value="#{person.registryBank.bankAccount.office}"
								valueChangeListener="#{person.registryBankChanged}"
								required="true" size="4" maxlength="4">
								<f:validateLength minimum="4" maximum="4" />
							</aon:inputText>
							<aon:inputText label="#{configBundle.config_bank_control}"
								value="#{person.registryBank.bankAccount.control}"
								valueChangeListener="#{person.registryBankChanged}"
								required="true" size="2" maxlength="2">
								<f:validateLength minimum="2" maximum="2" />
							</aon:inputText>
							<aon:inputText label="#{configBundle.config_bank_account}"
								valueChangeListener="#{person.registryBankChanged}"
								value="#{person.registryBank.bankAccount.account}"
								required="true" size="10" maxlength="10">
								<f:validateLength minimum="10" maximum="10" />
							</aon:inputText>
						</aon:div>
					</aon:panelGroup>
				</c:if>
			</c:if>			
			<c:if test="#{person.registryPayMethod.payment.type != null}">				
				<aon:outputLabel for="RegistryPayMethod_numberOfPayments" 
					value="#{registryBundle.registry_number_of_payments}" />
				<aon:inputText id="RegistryPayMethod_numberOfPayments"
					valueChangeListener="#{person.registryPayMethodChanged}"
					value="#{person.registryPayMethod.numberOfPayments}" required="true" size="5" >
					<f:validateLongRange minimum="1" />
				</aon:inputText>	
				
				<aon:outputLabel for="RegistryPayMethod_daysToFirstPayment" 
					value="#{registryBundle.registry_days_to_first_payment}" />
				<aon:inputText id="RegistryPayMethod_daysToFirstPayment"
					valueChangeListener="#{person.registryPayMethodChanged}"
					value="#{person.registryPayMethod.daysToFirstPayment}" required="true" size="5" />
			
				<aon:outputLabel for="RegistryPayMethod_daysBetweenPayments" 
					value="#{registryBundle.registry_days_between_payments}" />
				<aon:inputText id="RegistryPayMethod_daysBetweenPayments"
					valueChangeListener="#{person.registryPayMethodChanged}"
					value="#{person.registryPayMethod.daysBetweenPayments}" required="true" size="5" />
			
				<aon:outputLabel for="RegistryPayMethod_paymentDays"
					valueChangeListener="#{person.registryPayMethodChanged}" 
					value="#{registryBundle.registry_payment_days}" />
				<aon:inputText id="RegistryPayMethod_paymentDays"
					value="#{person.registryPayMethod.paymentDays}" size="5" />
			</c:if>
		</ui:define>

		<ui:define name="logoPanel">
			<a4j:mediaOutput element="img" cacheable="false"
				style="width: 100px;" value="#{person.aonFile.key}"
				rendered="#{person.aonFile.size > 0}"
				createContent="#{person.createCurrentLogoContent}">
			</a4j:mediaOutput>
			<aon:fileUpload id="attach_file"
				fileUploadListener="#{person.fileUploaded}" >
				<f:facet name="label">
					<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
				</f:facet>
				<a4j:support event="onuploadcomplete" reRender="attachGrid" />
			</aon:fileUpload>
		</ui:define>
		
	</ui:decorate>
</ui:composition>
