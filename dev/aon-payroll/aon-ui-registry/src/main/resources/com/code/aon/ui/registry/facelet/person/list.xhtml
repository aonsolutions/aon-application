<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{registryBundle.registry_person_module}" />
				<ui:param name="controller" value="#{person}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{person}" />
					<ui:define name="columns">

						<aon:column alias="person.id" styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>

						<aon:column alias="person.registry.documentType,person.registry.document" 
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.registry.documentCountry.value}" />
							<aon:outputText value="&#160;" />
							<aon:outputText value="#{to.registry.documentType}" />
							<aon:outputText value="&#160;" />
							<aon:outputText value="#{to.registry.document}" />
						</aon:column>

						<aon:column alias="person.socialSecurityNumber"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{registryBundle.registry_person_nss}" />
							</f:facet>
							<aon:outputText value="#{to.socialSecurityNumber}" />
						</aon:column>

						<aon:column alias="person.firstSurname,person.secondSurname,person.name"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_name}" />
							</f:facet>
							<aon:div styleClass="aon-nowrap">
								<aon:outputText value="#{to.fullName}" />
							</aon:div>
						</aon:column>

						<aon:column alias="person.birthDate"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{registryBundle.registry_person_birthDate}" />
							</f:facet>
							<aon:outputText value="#{to.birthDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>		
						</aon:column>

					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
