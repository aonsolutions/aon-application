<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showMultipleTrackingWindow">
		<c:if test="#{contractCalendarEvent.showMultipleTrackingWindow}">
			<rich:modalPanel id="multipleTrackingModalPanel" 
				rendered="#{contractCalendarEvent.showMultipleTrackingWindow}" showWhenRendered="true"
				minWidth="380" minHeight="360" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{employeeBundle.employee_multiple_tracking}" />
					</aon:div>
				</f:facet>
				
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showMultipleTrackingWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{contractCalendarEvent.showMultipleTrackingWindow}" value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				
				<aon:form id="passwordForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div styleClass="aon-popupWindow-content-internal">
							
							<aon:div styleClass="aon-toolbar">
								<aon:commandButton id="contractCalendarEvent-accept"
									value="#{bundle.aon_accept}"
									actionListener="#{contractCalendarEvent.onAcceptMultipleTracking}"
									action="contractCalendarEvent_form"
									styleClass="aon-finding-toolbar-item aon-icon-accept">
									<rich:componentControl for="multipleTrackingModalPanel"
										event="onclick" reRender="contractTypeForm" operation="hide"/>																					
									<f:setPropertyActionListener 
										target="#{contractCalendarEvent.showMultipleTrackingWindow}"
										value="#{false}" />
								</aon:commandButton>
								<aon:commandButton id="contractCalendarEvent-cancel"
									value="#{bundle.aon_cancel}"
									reRender="showMultipleTrackingWindow"
									immediate="true"
									styleClass="aon-finding-toolbar-item aon-icon-cancel">
									<f:setPropertyActionListener
										target="#{contractCalendarEvent.showMultipleTrackingWindow}"
										value="#{false}" />
								</aon:commandButton>
							</aon:div>
						
							
							<aon:panelGrid columns="2" id="ContractCalendarEventData">
								<aon:outputLabel for="contractCalendarEvent_startDate" value="#{bundle.aon_start_date}" />
								<aon:selectInputDate id="contractCalendarEvent_startDate" 
									value="#{contractCalendarEvent.startDate}" required="true"
									inputSize="10" renderAsPopup="true" enableManualInput="true"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
								
								<aon:outputLabel for="ContractCalendarEvent_endDate" value="#{bundle.aon_end_date}" />
								<aon:selectInputDate id="ContractCalendarEvent_endDate" 
									value="#{contractCalendarEvent.endDate}" required="true"
									inputSize="10" renderAsPopup="true" enableManualInput="true"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
								
								<aon:outputLabel for="ContractCalendarEvent_type" value="#{bundle.aon_type}" />
								<aon:selectOneMenu id="ContractCalendarEvent_type" required="true"
									value="#{contractCalendarEvent.event.type}" >
									<f:selectItems value="#{employeeCollections.contractCalendarEventTypes}" />
								</aon:selectOneMenu>
<!--  
								<aon:outputLabel for="ContractTracking_fullTime" value="#{employeeBundle.employee_contractTracking_fullTime}" />
								<aon:selectBooleanCheckbox id="ContractTracking_fullTime"
									value="#{contractTracking.fullTime}" >
									<a4j:support event="onclick" reRender="ContractTrackingData"
										actionListener="#{contractTracking.onSelectFullTime}" />
								</aon:selectBooleanCheckbox>
-->								
			
								<aon:outputLabel for="ContractCalendarEvent_duration" 
									value="#{employeeBundle.employee_contractCalendarEvent_duration}" />
								<aon:inputText id="ContractCalendarEvent_duration" required="true"
									disabled="#{contractCalendarEvent.fullTime}"
									size="2" maxlength="2"
									value="#{contractCalendarEvent.event.duration}" />
							</aon:panelGrid>					

						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
