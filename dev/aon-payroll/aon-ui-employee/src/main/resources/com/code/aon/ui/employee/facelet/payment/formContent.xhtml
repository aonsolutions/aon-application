<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:outputLabel for="ContractPayment_startDate" value="#{bundle.aon_start_date}" />
	<aon:selectInputDate id="ContractPayment_startDate" value="#{controller.to.startDate}" required="true"
		timeZone="#{timeZoneController.timeZone}" popupDateFormat="#{bundle.aon_date_pattern}"/>
	
	<aon:outputLabel for="ContractPayment_endDate" value="#{bundle.aon_end_date}" />
	<aon:selectInputDate id="ContractPayment_endDate" value="#{controller.to.endDate}"
		timeZone="#{timeZoneController.timeZone}" popupDateFormat="#{bundle.aon_date_pattern}"/>

	<aon:outputLabel for="ContractPayment_month" value="#{employeeBundle.employee_salary_payment_month}" />
	<aon:selectOneMenu id="ContractPayment_month" value="#{controller.to.month}">
		<f:selectItem value="#{null}" itemLabel=" - " />
		<f:selectItem value="#{controller.currentMonth}"  />
	</aon:selectOneMenu>

	<aon:outputLabel for="ContractPayment_type" value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="ContractPayment_type" value="#{controller.to.type}" required="true">
		<a4j:support event="onchange" actionListener="#{controller.onTypeChange}" reRender="ContractPayment_PaymentConcept" ajaxSingle="true"/>
		<f:selectItem value="#{null}" itemLabel=" - " />
		<f:selectItems value="#{employeeCollections.paymentTypes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ContractPayment_PaymentConcept" value="#{employeeBundle.employee_salary_payment_type}" />
	<aon:selectOneMenu id="ContractPayment_PaymentConcept" value="#{controller.to.paymentConcept}" style="width: 300px;">
		<a4j:support event="onchange" actionListener="#{controller.onPaymentConceptChange}" reRender="ContractPayment_description" ajaxSingle="true"/>
		<f:selectItem value="#{null}" itemLabel=" - " />
		<f:selectItems value="#{controller.paymentConcepts}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ContractPayment_description" value="#{bundle.aon_description}" />
	<aon:inputText id="ContractPayment_description" size="40" maxlength="64" required="true"
		value="#{controller.to.description}" />
	
	<aon:outputLabel for="ContractPayment_expression" value="#{employeeBundle.employee_salary_expression}" />
	<aon:inputTextarea id="ContractPayment_expression" cols="38" rows="2" maxlength="128"
		value="#{controller.to.expression}" required="true">
		<f:validateLength maximum="128"/>
		<a4j:region>
			<rich:suggestionbox
				for="ContractPayment_expression"
				suggestionAction="#{controller.expressionContext}" var="exp"
				similarityGroupingId=""
				tokens=" +-/*%()" minChars="2"
				fetchValue="#{exp.name}"
				immediate="true" limitToList="true" ajaxSingle="true"
				eventsQueue="ContractPayment_expressionSug" ignoreDupResponses="true"
				requestDelay="100" width="500" height="200"
				nothingLabel="#{bundle.aon_search_no_results}">
				<aon:column>
					<aon:outputText value="#{exp.name}" />
				</aon:column>
				<aon:column>
					<aon:outputText value="#{exp.expression}" />
				</aon:column>
			</rich:suggestionbox>
		</a4j:region>
	</aon:inputTextarea>
	
</ui:composition>
