<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salaryDraftSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<aon:methodParam name="backAction" value="salaryDraft_list" />
				<ui:param name="toolbarTitle" value="#{employeeBundle.employee_salaryDraft_module}" />
				<ui:param name="controller" value="#{contract}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<aon:methodParam name="searchAction" default="salaryDraft_list" resolve="true" />
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{contract}" />
				<ui:define name="searchContent">
				
					<aon:outputLabel for="Person_id"
						value="#{registryBundle.registry_person}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Person_id" lookup="#{personLookup}"
							reRender="Person_full_name"
							value="#{contractSearch.person.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{registryBundle.registry_person_selection}"
							selectReRender="Person_id,Person_full_name" actionType="search"
							lookup="#{personLookup}" minHeight="460" minWidth="650"
							property="#{contractSearch.person}">
						</aon:lookupButton>
						<aon:inputText id="Person_full_name"
							value="#{(contractSearch.person.registry.fullName!=null)?(contractSearch.person.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>

					<aon:outputLabel for="Enterprise_id"
						value="#{companyBundle.company_enterprise}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Enterprise_id" lookup="#{enterpriseLookup}"
							reRender="Enterprise_full_name"
							value="#{contractSearch.enterprise.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{companyBundle.company_enterprise_selection}"
							selectReRender="Enterprise_id,Enterprise_full_name" actionType="search"
							lookup="#{enterpriseLookup}" minHeight="460" minWidth="650"
							property="#{contractSearch.enterprise}">
						</aon:lookupButton>
						<aon:inputText id="Enterprise_full_name"
							value="#{(contractSearch.enterprise.registry.fullName!=null)?(contractSearch.enterprise.registry.fullName):('')}"
							size="50" disabled="true" />							
					</aon:div>
				
					<aon:outputLabel for="Contract_startDate"
						value="#{bundle.aon_start_date}" />
					<aon:selectInputDate id="Contract_startDate"
						valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
			
					<aon:outputLabel for="Contract_endDate"
						value="#{bundle.aon_end_date}" />
					<aon:selectInputDate id="Contract_endDate"
						value="#{contractSearch.endDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
<!--  
					<aon:selectInputDate id="Contract_endDate"
						valueChangeListener="#{controller.addLessThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
-->

<!--  
					<aon:outputText value="#{employeeBundle.employee_salary_totalPayment}" />
					<aon:outputText value="#{controller.to.totalPayment}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
			
					<aon:outputText value="#{employeeBundle.employee_salary_totalLiquid}" />
					<aon:outputText value="#{controller.to.totalLiquid}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
			
					<aon:outputText value="#{employeeBundle.employee_salary_totalDeduction}" />
					<aon:outputText value="#{controller.to.totalDeduction}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
-->
					
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{personLookup}" />
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
