<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<c:if test="#{aonConfiguration.bean.salary.showPersonColumn and !skipPersonColumn}">
		<aon:column alias="Salary.contract.person.registry.fullName"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{employeeBundle.employee_name}" />
			</f:facet>
			<aon:outputText value="#{to.employeeName}" />
		</aon:column>
	</c:if>
	
	<c:if test="#{aonConfiguration.bean.salary.showEnterpriseColumn and !skipEnterpriseColumn}">
		<aon:column alias="Salary.contract.workPlace.enterprise.registry.fullName"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{companyBundle.company_enterprise}" />
			</f:facet>
			<aon:outputText value="#{to.enterpriseName}" />
		</aon:column>
	</c:if>
		
	<c:if test="#{aonConfiguration.bean.salary.showIssueDateColumn and !skipIssueDateColumn}">
		<aon:column alias="Salary.issueDate"
			styleClass="aon-editDataTable-dateColumn">
			<f:facet name="header">
				<aon:outputText value="#{employeeBundle.employee_salary_issue_date}" />
			</f:facet>
			<aon:outputText value="#{to.issueDate}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>		
		</aon:column>
	</c:if>
	
	<c:if test="#{!skipStartDateColumn}">
		<aon:column alias="Salary.startDate"
			styleClass="aon-editDataTable-dateColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_start_date}" />
			</f:facet>
			<aon:outputText value="#{to.startDate}" >
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>		
		</aon:column>
	</c:if>
	
	<aon:column alias="Salary.endDate"
		styleClass="aon-editDataTable-dateColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_end_date}" />
		</f:facet>
		<aon:outputText value="#{to.endDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
	</aon:column>

	<aon:column alias="Salary.totalPayment"
		styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{employeeBundle.employee_salary_totalPayment}" />
		</f:facet>
		<aon:outputText value="#{to.totalPayment}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Salary.totalDeduction"
		styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{employeeBundle.employee_salary_totalDeduction}" />
		</f:facet>
		<aon:outputText value="#{to.totalDeduction}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="Salary.totalLiquid"
		styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{employeeBundle.employee_salary_totalLiquid}" />
		</f:facet>
		<aon:outputText value="#{to.totalLiquid}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
	</aon:column>

</ui:composition>
