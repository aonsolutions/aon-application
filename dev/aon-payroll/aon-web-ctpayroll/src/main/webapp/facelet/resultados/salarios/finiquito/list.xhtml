<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="finiquitoList">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.resultados_recibos_salarios__finiquitos}" />
				<ui:param name="controller" value="#{finiquito}"/>
				<ui:param name="skipBackButton" value="false" />
				<aon:methodParam name="cancelAction" value="finiquito_form"/>	
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="finiquitoData" value="#{finiquito.model}" var="to" rows="20" 
					columnClasses="aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn,aon-editDataTable-textColumn,
					aon-editDataTable-textColumn">

					<aon:rowSelector action="finiquito_form" actionListener="#{finiquito.onSelect}" />
					
 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_salarios_finiquito_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.cdg}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_salarios_finiquito_cdg_trabajador}" />
						</f:facet>
						<aon:outputText value="#{to.emprper.cdg}"/>
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_resultados_salarios_finiquito_fecha_baja}" />
						</f:facet>
						<aon:outputText value="#{to.fecbaj}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>
					
 				</aon:dataTable>

				<aon:dataScroller2 for="finiquitoData"  showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
