<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/certificateBatchGeneration/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.certificateBatchGeneration_step0}" />
	</ui:define>

	<ui:define name="step_content">
		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
			<ui:param name="skipSearchButton" value="true" />

			<ui:define name="searchContent">
				<aon:outputLabel for="empresa"
					value="#{payrollBundle.payroll_empresa}" />
				<aon:inputText id="empresa" size="20" maxlength="25"
					value="#{certificateBatchGenerationWizard.params.enterprise}" />

				<aon:outputLabel for="documento"
					value="#{payrollBundle.payroll_documento}" />
				<aon:inputText id="documento" size="10" maxlength="10"
					value="#{certificateBatchGenerationWizard.params.document}">
				</aon:inputText>
				
				<aon:outputLabel for="nombre"
					value="#{payrollBundle.payroll_nombre}" />
				<aon:inputText id="nombre" size="20" maxlength="25"
					value="#{certificateBatchGenerationWizard.params.name}" />

				<aon:outputLabel for="apellido"
					value="#{payrollBundle.payroll_apellido}" />
				<aon:inputText id="apellido" size="20" maxlength="35"
					value="#{certificateBatchGenerationWizard.params.surname}" />

				<aon:outputLabel for="apellido2"
					value="#{payrollBundle.payroll_apellido2}" />
				<aon:inputText id="apellido2" size="20" maxlength="25"
					value="#{certificateBatchGenerationWizard.params.surname2}" />

				<aon:outputLabel for="fecha-desde"
					value="#{payrollBundle.payroll_fecha_cese_desde}" />
				<aon:selectInputDate id="fecha-desde" 
					value="#{certificateBatchGenerationWizard.params.startDate}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>

				<aon:outputLabel for="fecha-hasta"
					value="#{payrollBundle.payroll_fecha_cese_hasta}" />
				<aon:selectInputDate id="fecha-hasta" 
					value="#{certificateBatchGenerationWizard.params.endDate}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
					<a4j:support event="oninputchange" reRender="#{searchContentID}">
						<aon:actionListener method="#{certificateBatchGenerationWizard.onChangeRemesableDate}" />
					</a4j:support>
					<a4j:support event="onchanged" reRender="#{searchContentID}">
						<aon:actionListener method="#{certificateBatchGenerationWizard.onChangeRemesableDate}" />
					</a4j:support>
				</aon:selectInputDate>
	
				<aon:outputText rendered="#{!certificateBatchGenerationWizard.remesable}"
					value="&#160;"/>
				<aon:outputText id="remesable"
					style="font-style:italic; color:red;" 
					rendered="#{!certificateBatchGenerationWizard.remesable}"
					value="#{payrollBundle.payroll_date_greater_than_today}"/>
				
			</ui:define>
		</ui:decorate>
	</ui:define>

</ui:composition>
