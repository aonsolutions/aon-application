<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="agreementLevelForm">
		
			<aon:div id="menuExt"> 
				<aon:methodParam name="backAction" value="agreement_grid" />
				<aon:methodParam name="backActionListener" value="#{agreement.onCancel}" type="actionListener" />
				<aon:methodParam name="cancelAction" value="agreement_grid" />
				<aon:methodParam name="removeAction" value="agreement_grid" />
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{companyBundle.company_agreementLevel_module}" />
					<ui:param name="controller" value="#{agreementLevel}" />
					<ui:param name="skipSearchButton" value="true" />
				</ui:decorate>
			</aon:div>	

			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true" width="100%">
					<aon:outputLabel for="Agreement_description" 
						value="#{companyBundle.company_agreement}" />
					<aon:outputText id="Agreement_description"
						value="#{agreement.to.description}" 
						size="64" />
						
<!--  
						<aon:outputLabel value="#{bundle.aon_id}" />
						<aon:outputText value="#{agreementLevel.to.id}" />
-->

					<aon:outputLabel for="AgreementLevel_description" 
						value="#{companyBundle.company_agreementLevel}" />
					<aon:inputText id="AgreementLevel_description"
						value="#{agreementLevel.to.description}" 
						size="64" maxlenght="64"/>

				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" style="width: 100%;"
					columnClasses="
					aon-noborder aon-padding-left aon-width-auto aon-vertical-align-top,
					aon-noborder aon-padding-left aon-width-auto aon-vertical-align-top">
				
					<aon:panelTabSet rendered="#{!agreementLevel.new}" >
						<aon:panelTab id="category" 
							label="#{companyBundle.company_agreementLevel_category}">
							<aon:div rendered="#{agreementLevel.model!=null}">
								<ui:include	src="/com/code/aon/ui/company/facelet/agreementLevelCategory/tab_grid.xhtml" >
									<ui:param name="controller" value="#{agreementLevelCategory}" />
								</ui:include>
							</aon:div>
						</aon:panelTab>
						<aon:panelTab id="payment" disabled="#{agreementLevel.model==null}"
							label="#{companyBundle.company_agreementLevel_payment}">
							<ui:include	src="/com/code/aon/ui/company/facelet/agreementLevelPayment/tab_grid.xhtml" >
								<ui:param name="controller" value="#{agreementLevelPayment}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</aon:panelGrid>
			</aon:div>
				
		</aon:form>
	</ui:define>

</ui:composition>
