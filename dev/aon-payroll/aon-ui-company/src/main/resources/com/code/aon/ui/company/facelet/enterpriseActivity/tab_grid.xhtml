<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:define name="columns">
		
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="EnterpriseActivity_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{formList}" />
				<aon:inputText id="EnterpriseActivity_description"
					value="#{controller.to.description}"
					rendered="#{formEdit}" required="true" maxlength="32" size="20" />
				<f:facet name="footer">
					<aon:inputText id="EnterpriseActivity_description-New"
						value="#{controller.to.description}"
						rendered="#{formNew}" required="true" maxlength="32" size="20" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="EnterpriseActivity_type"
						value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.type}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="EnterpriseActivity_type" required="true"
					value="#{controller.to.type}" rendered="#{formEdit}">
					<f:selectItems value="#{companyCollections.enterpriseActivityTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="EnterpriseActivity_type-New" required="true"
						value="#{controller.to.type}" rendered="#{formNew}">
						<f:selectItems value="#{companyCollections.enterpriseActivityTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="EnterpriseActivity_cnae_id"
						value="#{companyBundle.company_cnae_module}" />
				</f:facet>
				<aon:outputText value="#{to.cnae.title}"
					rendered="#{formList}" />
				<aon:div styleClass="aon-lookup" rendered="#{formEdit}">
					<aon:lookupInputText id="EnterpriseActivity_cnae_id"
						lookup="#{cnaeLookup}"
						reRender="EnterpriseActivity_cnae_detail"
						value="#{controller.to.cnae.id}" size="5" />
					<aon:lookupButton
						windowTitle="#{companyBundle.company_cnae_selection}"
						selectReRender="EnterpriseActivity_cnae_id,EnterpriseActivity_cnae_detail"
						lookup="#{cnaeLookup}"
						minHeight="460" minWidth="650" actionType="search"
						property="#{controller.to.cnae}">
					</aon:lookupButton>
					<aon:inputText id="EnterpriseActivity_cnae_detail"
						value="#{controller.to.cnae.title}"
						size="50" disabled="true" />							
				</aon:div>					
				<f:facet name="footer">
					<aon:div styleClass="aon-lookup" rendered="#{formNew}">
						<aon:lookupInputText id="EnterpriseActivity_cnae_id-New"
							lookup="#{cnaeLookup}"
							reRender="EnterpriseActivity_cnae_detail-New"
							value="#{controller.to.cnae.id}" size="5" />
						<aon:lookupButton
							windowTitle="#{companyBundle.company_cnae_selection}"
							selectReRender="EnterpriseActivity_cnae_id-New,EnterpriseActivity_cnae_detail-New"
							lookup="#{cnaeLookup}"
							minHeight="460" minWidth="650" actionType="search"
							property="#{controller.to.cnae}">
						</aon:lookupButton>
						<aon:inputText id="EnterpriseActivity_cnae_detail-New"
							value="#{controller.to.cnae.title}"
							size="50" disabled="true" />							
					</aon:div>						
				</f:facet>
			</aon:column>
		</ui:define>
		
	</ui:decorate>
</ui:composition>
