<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:form id="enterpriseTreeForm">
		<rich:tree id="enterpriseTree"
			selectedClass="aon-tree-node-active"
			highlightedClass="aon-tree-node-highlighted"			
			adviseNodeSelected="#{enterpriseTree.adviseNodeSelected}" 
			adviseNodeOpened="#{enterpriseTree.adviseNodeOpened}"
			nodeSelectListener="#{enterpriseTree.processSelection}" 
			switchType="server"
			value="#{enterpriseTree.rootNode}" var="enterpriseNode"
			nodeFace="#{enterpriseNode.typeName}">
			
			<rich:treeNode type="ENTERPRISE" 
				iconLeaf="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-root.png']}"
				icon="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-root.png']}">
				<aon:commandLink action="enterprise_form" value="#{enterpriseNode.label}" />
			</rich:treeNode>
			<rich:treeNode type="WORKPLACE"
				iconLeaf="#{aonResource.resolve['/images/aon-icon/aon-icon-tree.png']}" 
				icon="#{aonResource.resolve['/images/aon-icon/aon-icon-tree.png']}">
				<aon:commandLink value="#{enterpriseNode.label}"
					action="enterpriseWorkplace_form"
					actionListener="#{enterpriseTree.onSelectWorkPlace}"/>
			</rich:treeNode>
			<rich:treeNode type="CONTRACT"
				iconLeaf="#{aonResource.resolve['/images/aon-icon/aon-icon-contact.png']}" 
				icon="#{aonResource.resolve['/images/aon-icon/aon-icon-contact.png']}">
				<aon:commandLink
					action="contractView_form"
					actionListener="#{enterpriseTree.onSelectContract}">
					<aon:outputText value="#{enterpriseNode.label}" >
						<aon:abbreviateConverter maxWidth="20" />
					</aon:outputText>
				</aon:commandLink>
			</rich:treeNode>				
		</rich:tree>
	</aon:form>	
	
</ui:composition>
