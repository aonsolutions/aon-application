<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{lookup != null}">
		<ui:param name="controller" value="#{lookup}"/>
	</aon:if>

	<aon:panelGrid columns="2"
		columnClasses="aon-panelGrid-odd aon-width-150,	aon-panelGrid-even aon-width-450" >

		<ui:decorate template="/com/code/aon/ui/registry/facelet/registry/formContent.xhtml">
			<ui:param name="skipId" value="true"/>
		</ui:decorate>

		<aon:outputLabel for="Enterprise_scope_id" value="#{bundle.aon_scope}" />
		<aon:selectOneMenu id="Enterprise_scope_id" value="#{controller.to.scope}">
			<f:selectItems value="#{configCollections.currentUserScopes}" />
		</aon:selectOneMenu>

		<ui:include src="/com/code/aon/ui/registry/facelet/lookup/registry/formAddressMedia.xhtml">
			<ui:param name="controllerLookupListener" value="#{enterpriseForm}"/>
			<ui:param name="addressRequired" value="#{true}"/>
			<ui:param name="showMunicipality" value="#{true}" />
		</ui:include>
		
	</aon:panelGrid>

</ui:composition>
