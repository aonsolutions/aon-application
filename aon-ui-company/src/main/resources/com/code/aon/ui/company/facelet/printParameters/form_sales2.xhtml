<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j" >

	<aon:if test="#{aonConfiguration.bean.company.showSaleInvoiceReportParams}">
			
		<aon:outputLabel for="Company_print_referenceCode"
			value="#{bundle.company_print_referenceCode}" />
		<aon:selectBooleanCheckbox id="Company_print_referenceCode"
			value="#{printParams.saleInvoiceParams.printReferenceCode}" />
			
		<aon:outputLabel for="Sale_invoice_discountInPrice"
			value="#{bundle.company_invoice_discountInPrice}" />
		<aon:selectBooleanCheckbox id="Sale_invoice_discountInPrice"
			value="#{printParams.saleInvoiceParams.printDiscountPriceApplied}" />
			
		<aon:outputLabel for="Sale_invoice_productPackage"
			value="#{bundle.company_invoice_productPackage}" />
		<aon:selectBooleanCheckbox id="Sale_invoice_productPackage"
			value="#{printParams.saleInvoiceParams.printProductPackage}" />
	</aon:if>
	
</ui:composition>
