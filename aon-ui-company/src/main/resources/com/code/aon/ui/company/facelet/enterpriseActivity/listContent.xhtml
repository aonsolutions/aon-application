<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

		
	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{enterpriseActivity}" />
		<ui:param name="showDataScroller" value="false" />
<!--  
-->
		<ui:param name="rowSelectorReRender" value="activitiesDiv" />
		<ui:param name="resetButtonReRender" value="activitiesDiv" />
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_description}" />
				</f:facet>
				<aon:inputText id="EnterpriseActivity_description" value="#{to.description}"
					rendered="#{formEdit}" required="true" maxlength="32" size="20" />
				<aon:outputText rendered="#{formList}"
					value="#{to.description}" />
				<f:facet name="footer">
					<aon:inputText id="EnterpriseActivity_description-New" value="#{controller.to.description}"
						rendered="#{formNew}" required="true" maxlength="32" size="20" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText rendered="#{formList}"
						value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.type}" />
				<aon:selectOneMenu id="EnterpriseActivity_type" required="true"
					rendered="#{formEdit}"
					value="#{enterpriseActivity.to.type}">
					<f:selectItems value="#{companyCollections.enterpriseActivityTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="EnterpriseActivity_type-New" required="true"
						rendered="#{formNew}"
						value="#{enterpriseActivity.to.type}">
						<f:selectItems value="#{companyCollections.enterpriseActivityTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{companyBundle.company_cnae_module}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.cnae.code} - #{to.cnae.title}"  />
				<aon:div styleClass="aon-lookup" rendered="#{formEdit}">
						<aon:lookupInputText id="EnterpriseActivity_cnae_id"
							lookup="#{cnaeLookup}"
							reRender="EnterpriseActivity_cnae_detail"
							value="#{enterpriseActivity.to.cnae.id}" size="5" />
						<aon:lookupButton
							windowTitle="#{companyBundle.company_cnae_selection}"
							selectReRender="EnterpriseActivity_cnae_id,EnterpriseActivity_cnae_detail"
							lookup="#{cnaeLookup}"
							minHeight="460" minWidth="650" actionType="search"
							property="#{enterpriseActivity.to.cnae}">
						</aon:lookupButton>
						<aon:inputText id="EnterpriseActivity_cnae_detail"
							value="#{enterpriseActivity.to.cnae.title}"
							size="50" disabled="true" />							
					</aon:div>		
				<f:facet name="footer">
					<aon:div styleClass="aon-lookup" rendered="#{formNew}">
						<aon:lookupInputText id="EnterpriseActivity_cnae_id-New"
							lookup="#{cnaeLookup}"
							reRender="EnterpriseActivity_cnae_detail-New"
							value="#{enterpriseActivity.to.cnae.id}" size="5" />
						<aon:lookupButton
							windowTitle="#{companyBundle.company_cnae_selection}"
							selectReRender="EnterpriseActivity_cnae_id-New,EnterpriseActivity_cnae_detail-New"
							lookup="#{cnaeLookup}"
							minHeight="460" minWidth="650" actionType="search"
							property="#{enterpriseActivity.to.cnae}">
						</aon:lookupButton>
						<aon:inputText id="EnterpriseActivity_cnae_detail-New"
							value="#{enterpriseActivity.to.cnae.title}"
							size="50" disabled="true" />							
					</aon:div>		
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>
		
</ui:composition>
