<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/company/facelet/enterprise/treeTemplate.xhtml">

	<ui:define name="content">
	
		<aon:form id="workActivityForm">
			<aon:methodParam name="backAction" value="enterpriseWorkplace_form" />
			<aon:methodParam name="removeAction" value="enterpriseWorkplace_form" />
			<aon:methodParam name="cancelAction" value="enterpriseWorkplace_form" />
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{companyBundle.company_activity}" />
				<ui:param name="controller" value="#{workActivity}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2" >

					<aon:outputLabel for="WorkActivity_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="WorkActivity_description" size="64"
						maxlength="64" value="#{workActivity.to.description}"
						required="true" />

					<aon:outputLabel for="WorkActivity_enterpriseCCC_id"
						value="#{companyBundle.company_activity_ccc}" />	
					<aon:selectOneMenu id="WorkActivity_enterpriseCCC_id"
						value="#{workActivity.to.enterpriseCCC}" required="true">
						<f:selectItems value="#{enterprise.CCCs}" />
					</aon:selectOneMenu>

				</aon:panelGrid>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
