<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="investAssetList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.accounting_invest_asset_form_module}" />
				<ui:param name="controller" value="#{investAsset}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{investAsset}" />
					<ui:define name="columns">

						<aon:column alias="InvestAsset.description"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>
	
						<aon:column alias="InvestAsset.activity.id"
							styleClass="aon-editDataTable-textColumn aon-width-220">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_activity}" />
							</f:facet>
							<aon:outputText value="#{bundle.aon_common_all}" rendered="#{to.activity == null}" />
							<aon:outputText value="#{to.activity.description}" rendered="#{to.activity != null}" />
						</aon:column>

						<aon:column alias="InvestAsset.type"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.type}" />
						</aon:column>

						<aon:column alias="InvestAsset.regime"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_regime}" />
							</f:facet>
							<aon:outputText value="#{to.regime}" />
						</aon:column>

						<aon:column alias="InvestAsset.vatPercent"
							styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="% #{bundle.accounting_invest_asset_vat_encumbrance}" />
							</f:facet>
							<aon:outputText value="#{to.vatPercent}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="InvestAsset.retentionPercent"
							styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="% #{bundle.accounting_invest_asset_retention_encumbrance}" />
							</f:facet>
							<aon:outputText value="#{to.retentionPercent}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>

					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
