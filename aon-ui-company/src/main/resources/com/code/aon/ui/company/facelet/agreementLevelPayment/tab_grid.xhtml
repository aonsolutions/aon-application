<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:define name="columns">
		
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="AgreementLevelPayment_type" value="#{companyBundle.company_agreementLevel_type}" />
				</f:facet>
				<aon:outputText value="#{to.type}" rendered="#{formList}" />
				<aon:selectOneMenu id="AgreementLevelPayment_type" required="true"
					value="#{controller.to.type}" rendered="#{formEdit}">
					<f:selectItems value="#{payrollCollections.paymentTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="AgreementLevelPayment_type-New" required="true"
						value="#{controller.to.type}" rendered="#{formNew}">
						<f:selectItems value="#{payrollCollections.paymentTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
		
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="AgreementLevelPayment_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{formList}" />

					value="#{controller.to.description}"

						rendered="#{formNew}" required="true" maxlength="64" size="40" />

			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="AgreementLevelPayment_expression" value="#{payrollBundle.payroll_salary_expression}" />
				</f:facet>
				<aon:outputText value="#{to.expression}" rendered="#{formList}" />
				<aon:inputText id="AgreementLevelPayment_expression"
					value="#{controller.to.expression}"
					rendered="#{formEdit}" required="true" maxlength="128" size="40" />
				<f:facet name="footer">
					<aon:inputText id="AgreementLevelPayment_expression-New"
						value="#{controller.to.expression}"
						rendered="#{formNew}" required="true" maxlength="128" size="40" />
				</f:facet>
