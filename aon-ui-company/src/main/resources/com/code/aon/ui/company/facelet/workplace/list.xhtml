<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

<!--  
	<aon:div styleClass="aon-toolbar" >
		<aon:commandButton id="workPlace-reset"
			title="#{bundle.aon_key_new_accelerator}"
			value="#{bundle.aon_reset}"
			action="enterpriseWorkplace_form" actionListener="#{enterpriseWorkplace.onReset}"
			styleClass="aon-finding-toolbar-item aon-icon-new" />	
	</aon:div>
-->	

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{enterpriseWorkplace}" />
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{formList}"/>
				<aon:inputText id="WorkPlace_description" size="64"
					rendered="#{formEdit}"
					maxlength="64" value="#{to.description}"
					required="true" />
				<f:facet name="footer">
					<aon:inputText id="WorkPlace_description-New" size="64"
						rendered="#{formNew}"
						maxlength="64" value="#{enterpriseWorkplace.to.description}"
						required="true" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{companyBundle.company_workplace_address}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.address.shortAddress}" />
				<aon:selectOneMenu id="WorkPlace_address_id"
					rendered="#{formEdit}"
					value="#{to.address}" required="true">
					<f:selectItems value="#{enterprise.addresses}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="WorkPlace_address_id-New"
						rendered="#{formNew}"
						value="#{enterpriseWorkplace.to.address}" required="true">
						<f:selectItems value="#{enterprise.addresses}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>			

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{companyBundle.company_workplace_economic_agreement}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{enterpriseWorkplace.to.economicAgreement}" />
				<aon:selectOneMenu id="WorkPlace_economicAgreement"
					rendered="#{formEdit}"
					value="#{to.economicAgreement}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{configCollections.administrations}" />
				</aon:selectOneMenu>	
				<f:facet name="footer">
					<aon:selectOneMenu id="WorkPlace_economicAgreement-New"
						rendered="#{formNew}"
						value="#{enterpriseWorkplace.to.economicAgreement}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.administrations}" />
					</aon:selectOneMenu>	
				</f:facet>
			</aon:column>			
			
		</ui:define>
	</ui:decorate>

</ui:composition>
