<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<c:if test="#{enterprise.activity != null}" >	
		<aon:outputText value="#{companyBundle.company_activity}" />
		<aon:outputText value="#{enterprise.activity.cnae.code} - #{enterprise.activity.description}" />
	</c:if>

	<c:if test="#{enterprise.ccc != null}" >	
		<aon:outputText value="#{companyBundle.company_enterprise_ccc}" />
		<aon:outputText value="#{enterprise.ccc.ccc}" />
	</c:if>

	<aon:outputText value="#{companyBundle.company_workplace}" />
	<aon:div>
		<aon:outputText value="#{enterprise.workplace.description}" />
		<c:if test="#{enterprise.workplace.economicAgreement != null}" >
			<aon:outputText value=" (" />
			<aon:outputText value="#{enterprise.workplace.economicAgreement}" />
			<aon:outputText value=" )" />
		</c:if>
	</aon:div>
				
	<c:if test="#{enterprise.dirStaff != null}" >
		<aon:outputText value="#{registryBundle.registry_dir_staff_representative_labor}" />
		<aon:outputText value="#{enterprise.dirStaff.name}, #{bundle.aon_company_document} #{enterprise.dirStaff.document}" />
	</c:if>
	
	<c:if test="#{aonConfiguration.bean.enterprise.showEnterpriseParams}" >
		<aon:outputLabel for="salary_model" value="#{companyBundle.company_enterprise_params_salary_model}" />
		<aon:selectOneMenu id="salary_model"
			value="#{enterpriseParams.parameters['REPORT_salary'].expression}">
			<f:selectItems value="#{companyCollections.salaryTemplates}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="enterprise_salary_model" value="#{companyBundle.company_enterprise_params_enterprise_salary_model}" />
		<aon:selectOneMenu id="enterprise_salary_model"
			value="#{enterpriseParams.parameters['REPORT_enterpriseSalary'].expression}">
			<f:selectItems value="#{companyCollections.enterpriseSalaryTemplates}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="salary_sending_method" value="#{companyBundle.company_enterprise_params_salary_sending_method}" />
		<aon:selectOneMenu id="salary_sending_method"
			value="#{enterpriseParams.parameters['PAY_salarySendingMethod_PAY'].expression}">
			<f:selectItems value="#{companyCollections.salarySendingMethods}" />
		</aon:selectOneMenu>
	</c:if>
	
	
	
</ui:composition>
