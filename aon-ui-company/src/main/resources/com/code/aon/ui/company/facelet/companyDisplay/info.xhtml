<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div styleClass="aon-text-center">
		<aon:div rendered="#{companyDisplay.companyLogo == null}"
			style="font-weight: bold;font-size:14px;padding:2em;">
			<aon:outputText value="#{companyDisplay.companyLabel}" />
		</aon:div>
		<a4j:mediaOutput element="img"
			rendered="#{companyDisplay.companyLogo != null}" 
			value="#{companyDisplay.logoKey}"
			title="#{companyDisplay.companyLabel}"
			style="#{companyDisplay.bigLogo?'width:200px':''}"
			createContent="#{companyDisplay.createLogoContent}" />
	</aon:div>
				
</ui:composition>
