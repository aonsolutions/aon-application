<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="#{(enterprise.new)?'/facelet/templates/aon.ui.content.xhtml':'/com/code/aon/ui/company/facelet/enterprise/treeTemplate.xhtml'}">

	<ui:define name="content">
	
		<aon:form id="enterpriseForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{companyBundle.company_enterprise_module}" />
				<ui:param name="controller" value="#{enterprise}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="activities"
						rendered="#{!formNew}"
						value="#{companyBundle.company_activity_module}"
						action="enterpriseActivity_list" 
						styleClass="aon-finding-toolbar-item aon-icon-task-assume" >
					</aon:commandButton>
					<aon:commandButton id="multiple_tracking"
						value="#{calendarBundle.aon_calendar_menu}"
						action="calendar_form" 
						actionListener="#{calendar.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-open-popup">
						<f:setPropertyActionListener target="#{calendar.sourceKey}"
							value="0" />
						<f:setPropertyActionListener target="#{calendar.sourceId}"
							value="#{enterprise.to.registry.id}" />
						<aon:actionListener method="#{calendar.onInitialize}" />
					</aon:commandButton>					
				</ui:define>					
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<c:if test="#{enterprise.new}">
					<ui:include src="/com/code/aon/ui/company/facelet/enterprise/formNewContent.xhtml">
						<ui:param name="controller" value="#{enterprise}" />
					</ui:include>				
				</c:if>							
				<c:if test="#{!enterprise.new}">			
					<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-150,
							aon-panelGrid-even aon-width-auto,
							aon-panelGrid-odd aon-width-120,
							aon-panelGrid-even aon-width-auto">
	
						<ui:include 
							src="/com/code/aon/ui/company/facelet/enterprise/formContent.xhtml">
							<ui:param name="controller" value="#{enterprise}" />
						</ui:include>
					</aon:panelGrid>

					<aon:panelTabSet selectedTab="#{enterprise.selectedTab}">
						<aon:panelTab id="workplace" label="#{companyBundle.company_workplace}">
							<ui:include	src="/com/code/aon/ui/company/facelet/workplace/list.xhtml" />
						</aon:panelTab>

						<aon:panelTab id="address" label="#{registryBundle.registry_address_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{enterpriseAddress}" />
							</ui:include>
						</aon:panelTab>
	
						<aon:panelTab id="media" label="#{registryBundle.registry_media_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{enterpriseMedia}" />
							</ui:include>
						</aon:panelTab>
						
						<c:if test="#{aonConfiguration.bean.enterprise.showFinanceData and aonRole.financeOperator}">
							<aon:panelTab id="finance"
								label="#{registryBundle.registry_finance_data_module}">
								<aon:panel>
									<f:facet name="header">
										<aon:outputText
											value="#{registryBundle.registry_banks_module}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
										<ui:param name="controller" value="#{enterpriseRbank}" />
									</ui:include>
								</aon:panel>
								<aon:panel>
									<f:facet name="header">
										<aon:outputText	value="#{configBundle.config_predef_paymethod}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
										<ui:param name="controller" value="#{enterpriseRPayMethod}" />
									</ui:include>
								</aon:panel>
							</aon:panelTab>
						</c:if>

						<c:if test="#{aonConfiguration.bean.enterprise.showDirStaff}">
							<aon:panelTab id="dirStaff"
								label="#{registryBundle.registry_dir_staff}">
								<aon:div rendered="#{true}">
									<ui:include	src="/com/code/aon/ui/registry/facelet/rdirstaff/tab_grid.xhtml">
										<ui:param name="controller" value="#{enterpriseDirStaff}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
						</c:if>
											
						<c:if test="#{aonConfiguration.bean.enterprise.showAddInfo}">
							<aon:panelTab id="addInfo"
								label="#{registryBundle.registry_addInfo}">
								<aon:div rendered="#{true}">
									<ui:include	src="/com/code/aon/ui/registry/facelet/raddinfo/tab_grid.xhtml">
										<ui:param name="controller" value="#{enterpriseAddInfo}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
						</c:if>
						
						<c:if test="#{company.documentManagement}">
							<aon:panelTab id="documentManagement"
								label="#{bundle.aon_documents}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rattach/tab_grid.xhtml">
									<ui:param name="controller" value="#{enterpriseRAttach}" />
									<ui:param name="sortColumns" value="#{true}" />
								</ui:include>								
							</aon:panelTab>
						</c:if>						
						
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{cnaeLookup}" />
	</ui:define>
</ui:composition>
