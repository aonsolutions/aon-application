<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="#{(enterprise.new or !enterprise.treeView)?'/facelet/templates/aon.ui.content.xhtml':'/com/code/aon/ui/company/facelet/enterprise/treeTemplate.xhtml'}">

	<ui:define name="content">
	
		<aon:form id="enterpriseForm">
			<ui:include src="/com/code/aon/ui/company/facelet/enterprise/formToolbar.xhtml" />
			
			<aon:div styleClass="aon-scroll-area">
				<c:if test="#{enterprise.new}">
					<aon:panelGrid columns="2" cellspacing="10" 
						styleClass="aon-panelGrid-formatting"
						columnClasses="aon-width-50percent,aon-width-50percent aon-vertical-align-top">
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/formNewContent.xhtml">
							<ui:param name="controller" value="#{enterprise}" />
						</ui:include>
					</aon:panelGrid>				
				</c:if>							
				<c:if test="#{!enterprise.new}">			
	
					<aon:panelGrid columns="2" cellspacing="10" 
						styleClass="aon-panelGrid-formatting"
						columnClasses="aon-width-50percent,aon-width-50percent aon-vertical-align-top">

						<ui:include 
							src="/com/code/aon/ui/company/facelet/enterprise/formContent.xhtml">
							<ui:param name="controller" value="#{enterprise}" />
						</ui:include>
					</aon:panelGrid>

					<c:if test="#{!enterprise.treeView}">
						<aon:panelTabSet selectedTab="#{enterprise.selectedTab}">

							<aon:panelTab id="activities" label="#{companyBundle.company_activity_module}">
								<aon:div id="activitiesDiv">
									<ui:include	src="/com/code/aon/ui/company/facelet/enterpriseActivity/listContent.xhtml" />
									<aon:div id="detail_panel">
										<aon:div styleClass="aon-form-group" rendered="#{!enterpriseActivity.new}">
											<aon:div styleClass="aon-form-group-title">
												<aon:div styleClass="aon-form-group-title-internal">
													<aon:outputLabel for="enterpriseCCCData" value="#{companyBundle.company_enterprise_ccc}" />
												</aon:div>
											</aon:div>
											
											<ui:include	src="/com/code/aon/ui/company/facelet/enterpriseCCC/tab_grid.xhtml" >
												<ui:param name="controller" value="#{enterpriseCCC}" />
											</ui:include>
										</aon:div>
									</aon:div>
							
								</aon:div>
							</aon:panelTab>
							
							<aon:panelTab id="workplace" label="#{companyBundle.company_workplace}">
								<ui:include	src="/com/code/aon/ui/company/facelet/workplace/gridContent.xhtml" >
									<ui:param name="controller" value="#{enterpriseWorkplace}" />
								</ui:include>
							</aon:panelTab>
	
							<aon:panelTab id="address" label="#{registryBundle.registry_address_module}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
									<ui:param name="controller" value="#{enterpriseAddress}" />
								</ui:include>
							</aon:panelTab>
		
							<aon:panelTab id="media" label="#{registryBundle.registry_media_module}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
									<ui:param name="controller" value="#{enterpriseMedia}" />
								</ui:include>
							</aon:panelTab>
							
							<c:if test="#{aonConfiguration.bean.enterprise.showFinanceData and aonRole.financeOperator}">
								<aon:panelTab id="finance"
									label="#{registryBundle.registry_finance_data_module}">
									<aon:panel>
										<f:facet name="header">
											<aon:outputText
												value="#{registryBundle.registry_banks_module}" />
										</f:facet>
										<ui:include
											src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
											<ui:param name="controller" value="#{enterpriseRbank}" />
										</ui:include>
									</aon:panel>
									<aon:panel>
										<f:facet name="header">
											<aon:outputText	value="#{configBundle.config_predef_paymethod}" />
										</f:facet>
										<ui:include
											src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
											<ui:param name="controller" value="#{enterpriseRPayMethod}" />
										</ui:include>
									</aon:panel>
								</aon:panelTab>
							</c:if>
	
							<c:if test="#{aonConfiguration.bean.enterprise.showDirStaff}">
								<aon:panelTab id="dirStaff"
									label="#{registryBundle.registry_dir_staff}">
									<aon:div rendered="#{true}">
										<ui:include	src="/com/code/aon/ui/registry/facelet/rdirstaff/tab_grid.xhtml">
											<ui:param name="controller" value="#{enterpriseDirStaff}" />
										</ui:include>
									</aon:div>
								</aon:panelTab>
							</c:if>
												
							<c:if test="#{aonConfiguration.bean.enterprise.showAddInfo}">
								<aon:panelTab id="addInfo"
									label="#{registryBundle.registry_addInfo}">
									<aon:div rendered="#{true}">
										<ui:include	src="/com/code/aon/ui/registry/facelet/raddinfo/tab_grid.xhtml">
											<ui:param name="controller" value="#{enterpriseAddInfo}" />
										</ui:include>
									</aon:div>
								</aon:panelTab>
							</c:if>
							
						</aon:panelTabSet>
					</c:if>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{cnaeLookup}" />
	</ui:define>
</ui:composition>
