<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="enterpriseForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_company}" />
				<ui:param name="toolbarDescription" value="#{(enterprise.nevv)?(bundle.aon_reset):(bundle.aon_editing)}" />
				<ui:define name="toolbarContent">
					<aon:if test="#{enterprise.nevv}" >
						<aon:commandButton id="enterprise-save"
							value="#{bundle.aon_save}" reRender="aonHeader,aonContent"
							action="home" actionListener="#{enterprise.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
					</aon:if>
					<aon:if test="#{!enterprise.nevv}" >
						<aon:commandButton id="enterprise-save"
							value="#{bundle.aon_save}"
							action="company_form" actionListener="#{enterprise.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:if test="#{domainSwitcher.domainManagementAvailable}">
							<aon:commandButton id="enterprise-back"
								title="#{bundle.aon_key_cancel_accelerator}"
								value="#{bundle.aon_back}" 
								immediate="true"
								styleClass="aon-finding-toolbar-item aon-icon-cancel"
								actionListener="#{enterprise.onBackActionListener}"
								action="#{enterprise.backAction}"
								accesskey="#{bundle.aon_key_cancel}" />
						</aon:if>
					</aon:if>
				</ui:define>				
			</ui:decorate>
				
			<aon:panelGrid id="listData" columns="2" cellspacing="10" styleClass="aon-panelGrid-formatting"
				columnClasses="aon-width-half-plus aon-vertical-align-top,aon-width-half-minus aon-vertical-align-top">
				<ui:include 
					src="/com/code/aon/ui/company/facelet/enterprise/formContent.xhtml">
					<ui:param name="controller" value="#{enterprise}" />
				</ui:include>
			</aon:panelGrid>
				
			<aon:div styleClass="aon-scroll-area">
				<aon:panelTabSet id="enterpriseTab" selectedTab="#{enterprise.selectedTab}">				
					
					<aon:panelTab label="#{bundle.registry_addresses}">
						<ui:include src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
							<ui:param name="skipTypeColumn" value="true" />
							<ui:param name="controller" value="#{companyAddress}" />
							<ui:param name="showMunicipality" value="#{true}" />
						</ui:include>
					</aon:panelTab>
					
					<aon:if test="#{aonConfiguration.bean.enterprise.showPayrollData}" >
						<aon:panelTab id="activities" label="#{bundle.aon_activities}">
							<ui:include	src="/com/esferalia/aon/ui/payroll/facelet/enterpriseActivity/gridContent.xhtml" >
								<ui:param name="controller" value="#{enterpriseActivity}" />
							</ui:include>
						</aon:panelTab>
					</aon:if>
					
					<aon:panelTab id="workplace" label="#{bundle.company_workplaces}">
						<ui:include	src="/com/code/aon/ui/company/facelet/workplace/tab_grid.xhtml">
							<ui:param name="controller" value="#{enterpriseWorkPlace}" />
							<ui:param name="showPayrollData" value="#{true}" />
						</ui:include>
					</aon:panelTab>
					
					<aon:if test="#{aonConfiguration.bean.company.showRegistryBank}">
						<aon:panelTab label="#{bundle.registry_banks_module}">
							<aon:panel>
								<f:facet name="header">
									<aon:outputText
										value="#{bundle.registry_banks_module}" />
								</f:facet>
								<ui:include src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
									<ui:param name="controller" value="#{companyRbank}" />
									<ui:param name="showSuffix" value="#{true}" />
								</ui:include>
							</aon:panel>
							<aon:panel>
								<f:facet name="header">
									<aon:outputText value="#{bundle.config_predef_paymethod}" />
								</f:facet>
								<ui:include src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
									<ui:param name="controller" value="#{companyRPayMethod}" />
								</ui:include>
							</aon:panel>
						</aon:panelTab>
					</aon:if>
									
					<aon:if test="#{aonConfiguration.bean.company.showDirStaff}">
						<aon:panelTab id="dirStaff"
							label="#{bundle.registry_dir_staff}">
							<aon:div rendered="#{true}">
								<ui:include	src="/com/code/aon/ui/registry/facelet/rdirstaff/tab_grid.xhtml">
									<ui:param name="controller" value="#{companyDirStaff}" />
								</ui:include>
							</aon:div>
						</aon:panelTab>
					</aon:if>
					
					<aon:if test="#{aonConfiguration.bean.enterprise.showFinanceData and aonRole.financeOperator}">
						<aon:panelTab id="finance" label="#{bundle.registry_finance_data_module}">
							<ui:include	src="/com/code/aon/ui/company/facelet/enterprise/financeTemplate.xhtml" />
						</aon:panelTab>
					</aon:if>
					
					<aon:if test="#{aonConfiguration.bean.enterprise.showProject}" >
						<aon:panelTab id="projects" label="#{bundle.aon_module_groupware}">
							<ui:include	src="/com/code/aon/ui/project/facelet/project/gridContent.xhtml" >
								<ui:param name="controller" value="#{enterpriseProject}" />
							</ui:include>
						</aon:panelTab>
					</aon:if>
										
					<aon:if test="#{aonConfiguration.bean.enterprise.showAddInfo}">
						<aon:panelTab id="addInfo"
							label="#{bundle.aon_addInfo}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddinfo/tab_grid.xhtml">
								<ui:param name="controller" value="#{enterpriseAddInfo}" />
							</ui:include>
						</aon:panelTab>
					</aon:if>
					
					<aon:if test="#{aonRole.document}">
						<aon:panelTab id="documentManagement" label="#{bundle.aon_documents}">
							<ui:include src="/com/code/aon/ui/registry/facelet/documentManager/tab_grid.xhtml">
								<ui:param name="controller" value="#{enterpriseRAttach}" />
								<ui:param name="allowDocumentEdit" value="#{aonRole.documentManager}" />
							</ui:include>								
						</aon:panelTab>
					</aon:if>	
								
					<aon:if test="#{aonConfiguration.bean.enterprise.showPayrollData}" >
						<aon:panelTab id="contractClauses" label="#{bundle.payroll_contract_clauses}">
							<ui:include src="/com/code/aon/ui/registry/facelet/documentManager/tab_grid.xhtml">
								<ui:param name="controller" value="#{enterpriseClauses}" />
								<ui:param name="allowDocumentEdit" value="#{aonRole.documentManager}" />
							</ui:include>
						</aon:panelTab>
					</aon:if>		
					
				</aon:panelTabSet>
				
			</aon:div>
		</aon:form>
		<aon:if test="#{aonConfiguration.bean.enterprise.showPayrollData}" >
			<aon:lookupButtonPopup lookup="#{cnae2009Lookup}" />
			<aon:lookupButtonPopup lookup="#{iaeLookup}" />
			<aon:lookupButtonPopup lookup="#{agreementLookup}" />
			<aon:lookupButtonPopup lookup="#{calendarLookup}" />
		</aon:if>
		<aon:if test="#{aonConfiguration.bean.enterprise.showProject}" >
			<aon:lookupButtonPopup lookup="#{registryLookup}" />
		</aon:if>
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		<aon:if test="#{aonConfiguration.bean.company.showRegistryBank}">
			<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
				<ui:param name="bankAccountController" value="#{companyRbank.accountHelper}" />
				<ui:param name="modalReRender" value="enterpriseTab" />
				<ui:param name="bankAccountWindowSuffix" value="-Company" />
			</ui:include>
		</aon:if>
		<aon:if test="#{aonConfiguration.bean.enterprise.showFinanceData and aonRole.financeOperator}">
			<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
				<ui:param name="bankAccountController" value="#{enterpriseRbank.accountHelper}" />
				<ui:param name="modalReRender" value="enterpriseTab" />
			</ui:include>
		</aon:if>

	</ui:define>
</ui:composition>
