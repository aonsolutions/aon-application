<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/com/code/aon/ui/company/facelet/enterprise/treeTemplate.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{companyBundle.company_activity_module}" />
				<ui:param name="controller" value="#{enterpriseActivity}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>
			
			<aon:div styleClass="aon-scroll-area">
				
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{enterpriseActivity}" />
					<ui:define name="columns">
			
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>
			
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.type}" />
						</aon:column>
			
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{companyBundle.company_cnae_module}" />
							</f:facet>
							<aon:outputText value="#{to.cnae.title}"  />
						</aon:column>
			
					</ui:define>
				</ui:decorate>
				
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
