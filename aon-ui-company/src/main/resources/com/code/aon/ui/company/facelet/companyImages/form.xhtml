<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="companyImagesForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.company_images_module}" />
				<ui:param name="controller" value="#{companyImages}" />
				<ui:param name="skipResetButton" value="#{documentManager.freeSpace &lt; 1}" />
			</ui:include>	

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid id="imagePanelGrid" columns="2" >
				
					<aon:outputLabel for="RegistryAttachment_description" value="#{bundle.aon_name}" />
					<aon:div>
						<aon:inputText id="RegistryAttachment_description" required="true"
							validator="#{companyImages.imageNameCheck}"
							value="#{companyImages.to.description}" maxlength="64" size="45" />
						<aon:div styleClass="aon-margin-top" rendered="#{companyImages.to.size &gt; 0}" >
							<aon:outputText styleClass="aon-italic" 
								value="#{companyImages.to.mimeType}" />			
							<aon:outputText styleClass="aon-margin-left aon-italic"
								value="#{companyImages.to.sizeToDisplay}" />
						</aon:div>			
					</aon:div>
						
					<aon:outputLabel for="RegistryAttachment_inputFile" value="#{bundle.company_image}" />
					<a4j:region>
						<h:panelGrid>
							<aon:fileUpload id="RegistryAttachment_inputFile" 
								fileUploadListener="#{companyImages.fileUploaded}" >
								<f:facet name="label">
									<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
								</f:facet>														
								<a4j:support event="onuploadcomplete" reRender="imagePanelGrid" />
								<a4j:support event="onupload" oncomplete="showFileUploadProgress();" />
								<a4j:support event="onclear" oncomplete="hideFileUploadProgress();" />
							</aon:fileUpload>
							<rich:jQuery name="showFileUploadProgress" timing="onJScall"
								selector="#RegistryAttachment_inputFile .rich-fileupload-list-overflow" query="height(70);" />
							<rich:jQuery name="hideFileUploadProgress" timing="onJScall"
								selector="#RegistryAttachment_inputFile .rich-fileupload-list-overflow" query="height(0);" />										
							<a4j:mediaOutput id="RegistryAttachment_preview" 
								element="img" cacheable="false"
								value="#{companyImages.aonFile.key}" style="width:200px"
								rendered="#{(companyImages.aonFile.size > 0) and companyImages.image}" 
								createContent="#{companyImages.paint}" 
								mimeType="#{companyImages.aonFile.mimeType}" />
						</h:panelGrid>
					</a4j:region>
		
					<aon:if test="#{companyImages.dimensionEditable}">
						<aon:outputLabel for="ratio" value="#{bundle.aon_image_ratio}"/>
						<aon:selectBooleanCheckbox id="ratio" value="#{companyImages.ratio}" />
		
						<aon:outputLabel for="width" value="#{bundle.aon_width}" />
						<rich:inputNumberSlider id="width" 
							value="#{companyImages.width}" width="500"
							minValue="1" maxValue="#{companyImages.originalWidth}">
							<a4j:support event="onchange"
								requestDelay="1500" reRender="imagePanelGrid"
								actionListener="#{companyImages.onChangeWidth}" />
						</rich:inputNumberSlider>
		
						<aon:outputLabel for="height" value="#{bundle.aon_height}" />
						<rich:inputNumberSlider id="height" 
							value="#{companyImages.height}" width="500" 
							minValue="1" maxValue="#{companyImages.originalHeight}">
							<a4j:support event="onchange" 
								requestDelay="1500" reRender="imagePanelGrid"
								actionListener="#{companyImages.onChangeHeight}" />
						</rich:inputNumberSlider>
					</aon:if>					
					
					<aon:if test="#{!companyImages.nevv}" >
						<aon:outputText value="#{bundle.aon_document_download_url}" />
						<aon:outputLink target="_blank" value="#{companyImages.downloadURL}" >
							<aon:outputText value="#{companyImages.downloadURL}" />
					    </aon:outputLink>					    
					</aon:if>				
				
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
