<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="companyImagesForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{companyBundle.company_images_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
			</ui:include>
			
			<aon:div styleClass="aon-scroll-area">			
				<aon:panelGrid id="imagesPanel"
					cellpadding="5" cellspacing="0" border="0" columns="2" styleClass="aon-noborder"
					columnClasses="aon-midle-width  aon-vertical-align-top,aon-midle-width aon-vertical-align-top">	
					<aon:div styleClass="aon-width-300">
						<aon:editDataTable id="companyImages"
							var="to" value="#{companyImages.model}"
							columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn">
			
							<aon:rowSelector toggleOnClick="#{true}" actionListener="#{companyImages.onSelect}" reRender="image_form"/>
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="&#160;"/>
								</f:facet>
								<aon:outputText value="&#160;"/>
								<f:facet name="footer">
									<aon:div rendered="#{(companyImages.maximumNumber == 0) or (companyImages.model.rowCount &lt; companyImages.maximumNumber)}">
										<aon:commandButton id="reset" reRender="imagesPanel"
											styleClass="aon-editDataTable-button aon-icon-reset"
											value="" rendered="#{!companyImages.new}"
											actionListener="#{companyImages.onReset}"
											accesskey="#{bundle.aon_key_new_line}">
										</aon:commandButton>
									</aon:div>
								</f:facet>
							</aon:column>
					
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_name}" />
								</f:facet>
								<aon:outputText value="#{to.description}"/>
								<c:if test="#{companyImages.maximumNumber != 0}">
									<f:facet name="footer">
										<aon:div>				
											<aon:outputFormat value="#{companyBundle.company_max_number_images}" rendered="#{companyImages.model.rowCount &lt; companyImages.maximumNumber}">
												<f:param value="#{companyImages.maximumNumber}" />
											</aon:outputFormat>
											<aon:outputFormat value="#{companyBundle.company_max_images_reached}" rendered="#{companyImages.model.rowCount &gt;= companyImages.maximumNumber}">
												<f:param value="#{companyImages.maximumNumber}" />
											</aon:outputFormat>
										</aon:div>
									</f:facet>
								</c:if>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_type}" />
								</f:facet>
								<aon:outputText value="#{to.mimeType}"/>
							</aon:column>
					
						</aon:editDataTable>
	
						<aon:dataScroller2 for="companyImages" showNote="true" />
					</aon:div>	
					
					<aon:div id="image_form" styleClass="aon-width-auto">	
						<aon:div rendered="#{(companyImages.to != null) or (companyImages.new)}">
							<aon:panel>
								<f:facet name="header">
									<aon:outputLabel for="RegistryAttachment_preview" value="#{companyBundle.company_images_preview}" />
								</f:facet>
								<aon:div styleClass="aon-group-body">
									<aon:div styleClass="aon-toolbar" >
										<aon:commandButton id="save_image" value="#{bundle.aon_save}"					
											styleClass="aon-icon-accept aon-finding-toolbar-item"
											actionListener="#{companyImages.onAccept}" reRender="imagesPanel"/>
										<aon:confirmButton id="remove_image"
											value="#{bundle.aon_remove}" reRender="imagesPanel"
											rendered="#{!companyImages.new}" immediate="true"
											styleClass="aon-icon-delete aon-finding-toolbar-item"
											confirmTitle="#{bundle.aon_confirm_title}"
											confirmMessage="#{bundle.aon_remove_confirm}"
											confirmActionListener="#{companyImages.onRemove}"
											accesskey="#{bundle.aon_key_remove}" />											
										<aon:commandButton id="cancel_image" value="#{bundle.aon_cancel}" immediate="true"
											styleClass="aon-icon-cancel aon-finding-toolbar-item" reRender="imagesPanel"
											actionListener="#{companyImages.onCancel}"/>	
									</aon:div>	
			
									<aon:panelGrid id="imagePanelGrid" columns="2">	
																			
										<aon:outputLabel for="RegistryAttachment_description" value="#{bundle.aon_name}" />
										<aon:inputText id="RegistryAttachment_description" size="45" required="true"
											validator="#{companyImages.imageNameCheck}"
											maxlength="50" value="#{companyImages.to.description}" />		
				
										<c:if test="#{companyImages.aonFile.mimeType != null}">
											<aon:outputText value="#{bundle.aon_type}" />
											<aon:outputText value="#{companyImages.aonFile.mimeType}"/>
										</c:if>
											
										<aon:outputLabel for="RegistryAttachment_inputFile" value="#{companyBundle.company_image}" />
										<a4j:region>
											<h:panelGrid>
												<aon:fileUpload id="RegistryAttachment_inputFile"
													addControlLabel="#{bundle.aon_fileUpload_add}"
													stopControlLabel="#{bundle.aon_fileUpload_stop}"
													stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
													uploadControlLabel="#{bundle.aon_fileUpload_upload}"
													fileUploadListener="#{companyImages.fileUploaded}"
													immediateUpload="true" autoclear="true"
													listWidth="0px" listHeight="0px">
													<f:facet name="label">
														<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
													</f:facet>
													<a4j:support event="onuploadcomplete" reRender="imagePanelGrid" />
												</aon:fileUpload>
												<a4j:mediaOutput id="RegistryAttachment_preview" 
													element="img" cacheable="false"
													value="#{companyImages.aonFile.key}" style="width:200px"
													rendered="#{companyImages.aonFile.size > 0}" 
													createContent="#{companyImages.paint}" 
													mimeType="#{companyImages.aonFile.mimeType}" />
											</h:panelGrid>
										</a4j:region>

										<c:if test="#{companyImages.image != null}">
											<aon:outputLabel for="ratio" value="#{companyBundle.aon_image_ratio}"/>
											<aon:selectBooleanCheckbox id="ratio" value="#{companyImages.ratio}" />
	
											<aon:outputLabel for="width" value="#{companyBundle.aon_width}" />
											<rich:inputNumberSlider id="width" 
												value="#{companyImages.width}" width="500"
												minValue="1" maxValue="#{companyImages.maxWidth}">
												<a4j:support event="onchange"
													requestDelay="1500" reRender="imagePanelGrid"
													actionListener="#{companyImages.onChangeWidth}" />
											</rich:inputNumberSlider>
	
											<aon:outputLabel for="height" value="#{companyBundle.aon_height}" />
											<rich:inputNumberSlider id="height" 
												value="#{companyImages.height}" width="500" 
												minValue="1" maxValue="#{companyImages.maxHeight}">
												<a4j:support event="onchange" 
													requestDelay="1500" reRender="imagePanelGrid"
													actionListener="#{companyImages.onChangeHeight}" />
											</rich:inputNumberSlider>
										</c:if>										
									</aon:panelGrid>
								</aon:div>
							</aon:panel>			
						</aon:div>	
					</aon:div>	
			
				</aon:panelGrid>
			</aon:div>		
		</aon:form>
	</ui:define>
</ui:composition>
