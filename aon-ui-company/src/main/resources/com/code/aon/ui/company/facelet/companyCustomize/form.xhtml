<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/com/code/aon/ui/admin/facelet/globalConfig/configLayout.xhtml">

	<ui:define name="configContent">

		<aon:form id="customizeForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_oem}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="save"
						title="#{bundle.aon_key_save_accelerator}"
						value="#{bundle.aon_save}"
						actionListener="#{companyCustomize.onSave}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}" />
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">

					<aon:outputLabel for="CompanyCustomize_title"
						value="#{bundle.company_oem_title}" />
					<aon:inputText id="CompanyCustomize_title"
						value="#{companyCustomize.title}" maxlength="64" size="45" />
		
					<aon:outputLabel for="CompanyCustomize_color"
						value="#{bundle.company_oem_color}" />
					<rich:colorPicker id="CompanyCustomize_color"
						value="#{companyCustomize.color}" colorMode="rgb" />

					<aon:outputLabel for="CompanyCustomize_supportPhone"
						value="#{bundle.aon_support_telephone}" />
					<aon:inputText id="CompanyCustomize_supportPhone"
						value="#{companyCustomize.supportPhone}" maxlength="64" size="15" />

					<aon:outputLabel for="CompanyCustomize_supportEmail"
						value="#{bundle.aon_support_email}" />
					<aon:inputText id="CompanyCustomize_supportEmail" onblur="toLowerCase(this);" 
						value="#{companyCustomize.supportEmail}" maxlength="64" size="45" />
						
					<c:if test="#{aonRole.sysAdmin}">
						<aon:outputLabel for="CompanyCustomize_hideTrademark"
							value="#{bundle.aon_hide_trademark}" />					
						<aon:selectBooleanCheckbox id="CompanyCustomize_hideTrademark"
							value="#{companyCustomize.hideTrademark}" />
					
						<aon:outputLabel for="CompanyCustomize_hideVersion"
							value="#{bundle.aon_hide_version}" />					
						<aon:selectBooleanCheckbox id="CompanyCustomize_hideVersion"
							value="#{companyCustomize.hideVersion}" />
					</c:if>						

				</aon:panelGrid>

				<aon:div styleClass="aon-form-group-title aon-margin-top">
					<aon:div styleClass="aon-form-group-title-internal">
						<aon:outputText value="#{bundle.company_images_module}"/>
					</aon:div>
					
					<ui:include src="/com/code/aon/ui/company/facelet/companyCustomize/tab_grid.xhtml" >
						<ui:param name="controller" value="#{companyCustomize}" />
					</ui:include>					
					
				</aon:div>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
