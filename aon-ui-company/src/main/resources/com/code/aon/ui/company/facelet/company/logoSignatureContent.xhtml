<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j" >

	<aon:panelGrid columns="4" style="width:100%">
		<aon:outputLabel for="attach_file"
			value="#{bundle.company_logo}" />
		<a4j:region>
			<h:panelGrid id="attachGrid" columns="2">
				<a4j:mediaOutput element="img" cacheable="false"
					style="width: 100px;" value="#{company.logoFile.key}"
					rendered="#{company.logoFile.size > 0}"
					createContent="#{company.createCurrentLogoContent}">
				</a4j:mediaOutput>
				<h:panelGrid columns="1">
					<aon:fileUpload id="attach_file" listWidth="100"
						fileUploadListener="#{company.logoFileUploaded}" >
						<f:facet name="label">
							<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
						</f:facet>
						<a4j:support event="onuploadcomplete" reRender="attachGrid" />
					</aon:fileUpload>
					<aon:div style="margin-left: 0.5em;"
						styleClass="rich-fileupload-button rich-fileupload-button-content"
						rendered="#{company.logoFile.size > 0}">
						<a4j:commandButton
							action="#{company.clearLogoUploadData}"
							reRender="attachGrid"
							value="#{bundle.aon_remove}" title="#{bundle.aon_remove}"
							styleClass="aon-icon-commandButton aon-icon-close" />
					</aon:div>
				</h:panelGrid>				
			</h:panelGrid>
		</a4j:region>
		<aon:outputLabel for="signatureAttach_file"
			value="#{bundle.aon_signature}" />
		<a4j:region>
			<h:panelGrid id="signatureAttachGrid" columns="2">
				<a4j:mediaOutput element="img" cacheable="false"
					style="width: 100px;" value="#{company.signatureFile.key}"
					rendered="#{company.signatureFile.size > 0}"
					createContent="#{company.createCurrentSignatureContent}">
				</a4j:mediaOutput>
				<h:panelGrid columns="1">
					<aon:fileUpload id="signatureAttach_file" listWidth="100"
						fileUploadListener="#{company.signatureFileUploaded}" >
						<f:facet name="label">
							<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
						</f:facet>
						<a4j:support event="onuploadcomplete" reRender="signatureAttachGrid" />
					</aon:fileUpload>
					<aon:div style="margin-left: 0.5em;"
						styleClass="rich-fileupload-button rich-fileupload-button-content"
						rendered="#{company.signatureFile.size > 0}">
						<a4j:commandButton
							action="#{company.clearSignatureUploadData}"
							reRender="signatureAttachGrid"
							value="#{bundle.aon_remove}" title="#{bundle.aon_remove}"
							styleClass="aon-icon-commandButton aon-icon-close" />
					</aon:div>
				</h:panelGrid>
			</h:panelGrid>
		</a4j:region>
	</aon:panelGrid>

</ui:composition>
