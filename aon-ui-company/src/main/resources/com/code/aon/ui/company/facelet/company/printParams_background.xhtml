<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j" >

	<aon:panel id="reportBackgroundGrid">
		<f:facet name="header">
			<aon:panelGroup>
				<aon:outputText value="#{bundle.company_reports_background}" />
				<aon:div styleClass="aon-margin-left" layout="inline">
					<aon:outputText value="(Dim: 196 x 276) " />
					<aon:outputText value="&#160;" styleClass="aon-icon2 aon-icon-info"/>
					<rich:toolTip styleClass="aon-width-200"
						value="La imagen se redimensiona a un tamaño de 196 x 276 mm" />
				</aon:div>
			</aon:panelGroup>
		</f:facet>
		<h:panelGrid columns="4"
	    	columnClasses="aon-vertical-align-top, aon-vertical-align-top, aon-vertical-align-top, aon-vertical-align-top">
			
			<aon:if test="#{!company.customReportTemplate}">
				<h:panelGroup id="saleInvoiceBackground-panel">
	                <rich:panel>
	                    <f:facet name="header">
	                        <aon:outputText value="#{bundle.finance_sale_invoice_management_module}" />
	                    </f:facet>
			            <h:panelGrid columns="2">
		                    <aon:div styleClass="aon-text-center" rendered="#{company.saleInvoiceBackgroundFile.size > 0}" >
	                               <a4j:mediaOutput id="saleInvoiceBackground-link" element="img" mimeType="#{file.mime}"
	                                   createContent="#{company.createSaleInvoiceBackgroundContent}"
	                                   value="#{company.saleInvoiceBackgroundFile.key}"
	                                   styleClass="aon-border aon-commandButton"
	                                   style="width:80px; padding:0 !important;" cacheable="false">
									<rich:componentControl for="saleInvoiceBackground-modal"
										attachTo="saleInvoiceBackground-link" operation="show"
										event="onclick" />
								</a4j:mediaOutput>
	                           </aon:div>
				            <h:panelGrid columns="1">
					            <aon:fileUpload id="saleInvoiceBackground-upload" listWidth="100"
					            	fileUploadListener="#{company.saleInvoiceBackgroundFileUploaded}"
								    immediateUpload="#{true}"
					                acceptedTypes="jpg, jpeg, gif, png, bmp" allowFlash="#{false}">
									<a4j:support event="onuploadcomplete"
										reRender="saleInvoiceBackground-panel, saleInvoiceBackground-modal" />
								</aon:fileUpload>
					            <aon:div style="margin-left: 0.4em;" 
		                    		styleClass="rich-fileupload-button rich-fileupload-button-content"
		                    		rendered="#{company.saleInvoiceBackgroundFile.size > 0}" >
					                <a4j:commandButton action="#{company.clearSaleInvoiceBackgroundUploadData}"
					                    reRender="saleInvoiceBackground-panel, saleInvoiceBackground-upload" 
					                    value="#{bundle.aon_remove}" title="#{bundle.aon_remove}"
					                    styleClass="aon-icon-commandButton aon-icon-close" />
		                    	</aon:div>
				            </h:panelGrid>
			            </h:panelGrid>
	                </rich:panel>
	            </h:panelGroup>
			</aon:if>
	           
		    <h:panelGroup id="offerBackground-panel">
	               <rich:panel>
	                   <f:facet name="header">
						<aon:outputText value="#{bundle.aon_invoice_offer}" />
	                   </f:facet>
		            <h:panelGrid columns="2">
	                    <aon:div styleClass="aon-text-center" rendered="#{company.offerBackgroundFile.size > 0}" >
	                              <a4j:mediaOutput id="offerBackground-link" element="img" mimeType="#{file.mime}"
	                                  createContent="#{company.createOfferBackgroundContent}"
	                                  value="#{company.offerBackgroundFile.key}"
	                                  styleClass="aon-border aon-commandButton"
	                                  style="width:80px; padding:0 !important;" cacheable="false">
	                                  <rich:componentControl for="offerBackground-modal" attachTo="offerBackground-link" operation="show" event="onclick"/>
	                              </a4j:mediaOutput>
	                          </aon:div>
			            <h:panelGrid columns="1">
				            <aon:fileUpload id="offerBackground-upload" listWidth="100"
								fileUploadListener="#{company.offerBackgroundFileUploaded}"
								immediateUpload="#{true}"
				                acceptedTypes="jpg, jpeg, gif, png, bmp" allowFlash="#{false}">
				                <a4j:support event="onuploadcomplete" 
				                	reRender="offerBackground-panel, offerBackground-modal" />
				            </aon:fileUpload>
				            <aon:div style="margin-left: 0.4em;" 
	                    		styleClass="rich-fileupload-button rich-fileupload-button-content"
	                    		rendered="#{company.offerBackgroundFile.size > 0}" >
				                <a4j:commandButton action="#{company.clearOfferBackgroundUploadData}"
				                    reRender="offerBackground-panel, offerBackground-upload"
				                    value="#{bundle.aon_remove}" title="#{bundle.aon_remove}"
				                    styleClass="aon-icon-commandButton aon-icon-close" />
	                    	</aon:div>
			            </h:panelGrid>
		            </h:panelGrid>
	               </rich:panel>
	          </h:panelGroup>
	             
		    <h:panelGroup id="deliveryBackground-panel">
	               <rich:panel>
	                   <f:facet name="header">
	                       <aon:outputText value="#{bundle.warehouse_delivery}" />
	                   </f:facet>
		            <h:panelGrid columns="2">
	                    <aon:div styleClass="aon-text-center" rendered="#{company.deliveryBackgroundFile.size > 0}" >
	                              <a4j:mediaOutput id="deliveryBackground-link" element="img" mimeType="#{file.mime}"
	                                  createContent="#{company.createDeliveryBackgroundContent}"
	                                  value="#{company.deliveryBackgroundFile.key}"
	                                  styleClass="aon-border aon-commandButton"
	                                  style="width:80px; padding:0 !important;" cacheable="false">
	                                  <rich:componentControl for="deliveryBackground-modal" attachTo="deliveryBackground-link" operation="show" event="onclick"/>
	                              </a4j:mediaOutput>
	                          </aon:div>
			            <h:panelGrid columns="1">
				            <aon:fileUpload id="deliveryBackground-upload" listWidth="100"
								fileUploadListener="#{company.deliveryBackgroundFileUploaded}"
								immediateUpload="#{true}"
				                acceptedTypes="jpg, jpeg, gif, png, bmp" allowFlash="#{false}">
				                <a4j:support event="onuploadcomplete" 
				                	reRender="deliveryBackground-panel, deliveryBackground-modal" />
				            </aon:fileUpload>
				            <aon:div style="margin-left: 0.4em;" 
	                    		styleClass="rich-fileupload-button rich-fileupload-button-content"
	                    		rendered="#{company.deliveryBackgroundFile.size > 0}" >
				                <a4j:commandButton action="#{company.clearDeliveryBackgroundUploadData}"
				                    reRender="deliveryBackground-panel, deliveryBackground-upload"
				                    value="#{bundle.aon_remove}" title="#{bundle.aon_remove}"
				                    styleClass="aon-icon-commandButton aon-icon-close" />
	                    	</aon:div>
			            </h:panelGrid>
		            </h:panelGrid>
	               </rich:panel>
	          </h:panelGroup>
	          
		    <h:panelGroup id="salesBackground-panel">
	               <rich:panel>
	                   <f:facet name="header">
						<aon:outputText value="#{bundle.sales_module}" />
	                   </f:facet>
		            <h:panelGrid columns="2">
	                    <aon:div styleClass="aon-text-center" rendered="#{company.salesBackgroundFile.size > 0}" >
	                              <a4j:mediaOutput id="salesBackground-link" element="img" mimeType="#{file.mime}"
	                                  createContent="#{company.createSalesBackgroundContent}"
	                                  value="#{company.salesBackgroundFile.key}"
	                                  styleClass="aon-border aon-commandButton"
	                                  style="width:80px; padding:0 !important;" cacheable="false">
	                                  <rich:componentControl for="salesBackground-modal" attachTo="salesBackground-link" operation="show" event="onclick"/>
	                              </a4j:mediaOutput>
	                          </aon:div>
			            <h:panelGrid columns="1">
				            <aon:fileUpload id="salesBackground-upload" listWidth="100"
								fileUploadListener="#{company.salesBackgroundFileUploaded}"
								immediateUpload="#{true}"
				                acceptedTypes="jpg, jpeg, gif, png, bmp" allowFlash="#{false}">
				                <a4j:support event="onuploadcomplete" 
				                	reRender="salesBackground-panel, salesBackground-modal" />
				            </aon:fileUpload>
	                    	<aon:div style="margin-left: 0.4em;" 
	                    		styleClass="rich-fileupload-button rich-fileupload-button-content"
	                    		rendered="#{company.salesBackgroundFile.size > 0}" >
					                <a4j:commandButton action="#{company.clearSalesBackgroundUploadData}"
					                    reRender="salesBackground-panel, salesBackground-upload" 
					                    value="#{bundle.aon_remove}" title="#{bundle.aon_remove}"
					                    styleClass="aon-icon-commandButton aon-icon-close" />
	                    	</aon:div>
	                    </h:panelGrid>
		            </h:panelGrid>
	               </rich:panel>
	          </h:panelGroup>
		</h:panelGrid>
	
	</aon:panel>
	
</ui:composition>
