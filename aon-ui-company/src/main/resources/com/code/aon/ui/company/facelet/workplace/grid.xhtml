<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="workplaceList">
			<aon:div ajaxRendered="true" layout="none">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="skipResetButton" value="true" />
					<ui:param name="toolbarTitle"
						value="#{companyBundle.company_workplace_module}" />
					<ui:param name="controller" value="#{workplace}" />
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="skipResetButton" value="true" />
						<ui:param name="controller" value="#{workplace}" />
						<ui:define name="columns">
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_id}" />
								</f:facet>
								<aon:outputText value="#{to.id}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText rendered="#{to.id!=workplace.to.id}"
									value="#{to.description}" />
								<aon:inputText rendered="#{to.id==workplace.to.id}" size="40"
									maxlength="32" value="#{workplace.to.description}"
									required="#{true}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText
										value="#{companyBundle.company_workplace_address}" />
								</f:facet>
								<aon:outputText
									value="#{to.address.address} #{to.address.address2} #{to.address.address3}" />
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
