<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="workplaceList">
			<aon:div ajaxRendered="true" layout="none">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="skipResetButton" value="true" />
					<ui:param name="toolbarTitle"
						value="#{companyBundle.company_workplace_module}" />
					<ui:param name="controller" value="#{workplace}" />
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">
					<ui:include src="/com/code/aon/ui/company/facelet/workplace/gridContent.xhtml" >
						<ui:param name="controller" value="#{workplace}" />
					</ui:include>
				</aon:div>
			</aon:div>
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{calendarLookup}" />

	</ui:define>

</ui:composition>
