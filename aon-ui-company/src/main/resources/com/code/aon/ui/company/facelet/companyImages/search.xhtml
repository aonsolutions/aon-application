<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="companyImagesSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.company_images_module}" />
				<ui:param name="controller" value="#{companyImages}" />
				<ui:param name="skipResetButton" value="#{documentManager.freeSpace &lt; 1}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:param name="controller" value="#{companyImages}" />
				<ui:define name="searchContent">
		
					<aon:outputLabel for="RegistryAttachment_description"
						value="#{bundle.aon_name}" />
					<aon:inputText id="RegistryAttachment_description" size="60"
						valueChangeListener="#{controller.addExpression}" />
					
					<aon:outputLabel for="RegistryAttachment_mimeType"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="RegistryAttachment_mimeType"
						converter="aon.EnumConverter"
						valueChangeListener="#{controller.addEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{commonCollections.mimeTypes}" />
					</aon:selectOneMenu>
				
					<aon:outputLabel for="RegistryAttachment_size-From"
						value="#{bundle.aon_size} (KB)" />
					<aon:div>
						<aon:outputLabel for="RegistryAttachment_size-From" styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_from}:" />
						<aon:inputText id="RegistryAttachment_size-From" size="10"
							value="#{companyImagesSearch.sizeFrom}" />
				
						<aon:outputLabel for="RegistryAttachment_size-To" styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_to}:" />
						<aon:inputText id="RegistryAttachment_size-To" size="10"
							value="#{companyImagesSearch.sizeTo}" />
					</aon:div>
						
				</ui:define>
			</ui:decorate>
	
		</aon:form>
	</ui:define>
</ui:composition>
