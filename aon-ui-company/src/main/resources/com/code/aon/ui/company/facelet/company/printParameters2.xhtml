<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j" >

	<aon:if test="#{aonConfiguration.bean.company.showSaleInvoiceReportParams}">
		<aon:outputLabel for="Company_print_name"
			value="#{bundle.company_print_name}" />
		<aon:selectOneMenu id="Company_print_name"
			value="#{company.printName}" >
			<f:selectItems value="#{companyCollections.reportPrintOptions}" />
		</aon:selectOneMenu>
			
		<aon:outputLabel for="Company_print_nif"
			value="#{bundle.company_print_nif}" />
		<aon:selectOneMenu id="Company_print_nif"
			value="#{company.printNif}" >
			<f:selectItems value="#{companyCollections.reportPrintOptions}" />
		</aon:selectOneMenu>
			
		<aon:outputLabel for="Company_print_address"
			value="#{bundle.company_print_address}" />
		<aon:selectOneMenu id="Company_print_address"
			value="#{company.printAddress}" >
			<f:selectItems value="#{companyCollections.shortReportPrintOptions}" />
		</aon:selectOneMenu>
			
		<aon:outputLabel for="Company_print_internet_data"
			value="#{bundle.company_print_internet_data}" />
		<aon:selectOneMenu id="Company_print_internet_data"
			value="#{company.printInternetData}">
			<f:selectItems value="#{companyCollections.shortReportPrintOptions}" />
		</aon:selectOneMenu>
		
		<aon:outputLabel for="Company_print_productCode"
			value="#{bundle.company_print_productCode}" />
		<aon:selectBooleanCheckbox id="Company_print_productCode"
			value="#{company.printProductCode}" />
			
		<aon:outputLabel for="Company_print_referenceCode"
			value="#{bundle.company_print_referenceCode}" />
		<aon:selectBooleanCheckbox id="Company_print_referenceCode"
			value="#{company.printReferenceCode}" />
			
		<aon:outputLabel for="Company_print_project"
			value="#{bundle.company_print_project}" />
		<aon:selectBooleanCheckbox id="Company_print_project"
			value="#{company.printProject}" />
			
		<aon:outputLabel for="Sale_invoice_discountInPrice"
			value="#{bundle.company_invoice_discountInPrice}" />
		<aon:selectBooleanCheckbox id="Sale_invoice_discountInPrice"
			value="#{company.printDiscountPriceApplied}" />
	</aon:if>
	
</ui:composition>
