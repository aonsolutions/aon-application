<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j" >

	<c:if test="#{aonConfiguration.bean.company.showSaleInvoiceReportParams}">
		<aon:outputLabel for="Company_invoice_template"
			value="#{bundle.company_saleInvoice_template}" />
		<c:if test="#{!company.customReportTemplate}">
			<aon:selectOneMenu id="Company_invoice_template"
				value="#{company.saleInvoiceTemplate}" >
					<f:selectItems value="#{companyCollections.saleInvoiceTemplates}" />
			</aon:selectOneMenu>
		</c:if>
		<c:if test="#{company.customReportTemplate}">
			<aon:outputText id="Company_invoice_template"
				value="#{bundle.company_custom_template}" />
		</c:if>
			
		<aon:outputLabel for="Company_print_logo"
			value="#{bundle.company_print_logo}" />
		<aon:selectBooleanCheckbox id="Company_print_logo"
			value="#{company.printLogo}" />
			
		<aon:outputLabel for="Company_print_name"
			value="#{bundle.company_print_name}" />
		<aon:selectOneMenu id="Company_print_name"
			value="#{company.printName}" >
			<f:selectItems value="#{companyCollections.reportPrintOptions}" />
		</aon:selectOneMenu>
			
		<aon:outputLabel for="Company_print_nif"
			value="#{bundle.company_print_nif}" />
		<aon:selectOneMenu id="Company_print_nif"
			value="#{company.printNif}" >
			<f:selectItems value="#{companyCollections.reportPrintOptions}" />
		</aon:selectOneMenu>
			
		<aon:outputLabel for="Company_print_address"
			value="#{bundle.company_print_address}" />
		<aon:selectOneMenu id="Company_print_address"
			value="#{company.printAddress}" >
			<f:selectItems value="#{companyCollections.shortReportPrintOptions}" />
		</aon:selectOneMenu>
			
		<aon:outputLabel for="Company_print_internet_data"
			value="#{bundle.company_print_internet_data}" />
		<aon:selectOneMenu id="Company_print_internet_data"
			value="#{company.printInternetData}">
			<f:selectItems value="#{companyCollections.shortReportPrintOptions}" />
		</aon:selectOneMenu>
		
		<aon:outputLabel for="Company_print_saleInvoice_footer"
			value="#{bundle.company_saleInvoice_footer_text}" />
		<aon:selectBooleanCheckbox id="Company_print_saleInvoice_footer"
			value="#{company.printSaleInvoiceFooter}" />
	</c:if>

</ui:composition>
