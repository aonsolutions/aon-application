<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
			
	<aon:div>
		<aon:div styleClass="aon-group">
			<aon:div styleClass="aon-group-title">
				<aon:outputText value="#{bundle.company_data_module}"/>
			</aon:div>
			<aon:div styleClass="aon-group-body"> 
				<aon:div styleClass="aon-group-body-internal">
					<aon:panelGrid columns="2" style="width:100%">
						<ui:include
							src="/com/code/aon/ui/company/facelet/company/formNewContent.xhtml" >
							<ui:param name="controller" value="#{company}" />
							<ui:param name="showMunicipality" value="#{true}" />									
						</ui:include>		
						
						<aon:outputLabel for="Enterprise_scope_id"
							value="#{bundle.aon_scope}" />
						<aon:selectOneMenu id="Enterprise_scope_id"
							value="#{enterprise.to.scope}">
							<f:selectItems value="#{configCollections.currentUserScopes}" />
						</aon:selectOneMenu>					
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:div>
	</aon:div>

	<aon:div>
		<aon:div styleClass="aon-group">
			<aon:div styleClass="aon-group-title">
				<aon:outputText value="#{bundle.company_logo_and_signature}"/>
			</aon:div>
			<aon:div styleClass="aon-group-body"> 
				<aon:div styleClass="aon-group-body-internal">
					<ui:include
						src="/com/code/aon/ui/company/facelet/company/logoSignatureContent.xhtml" />
				</aon:div>
			</aon:div>
		</aon:div>
		
		<aon:div styleClass="aon-group">
			<aon:div styleClass="aon-group-title">
				<aon:outputText value="#{bundle.aon_addInfo}"/>
			</aon:div>
			<aon:div styleClass="aon-group-body"> 	
				<aon:div styleClass="aon-group-body-internal">
					<aon:panelGrid  columns="2" style="width:100%">	
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/formOtherContent.xhtml" />
						
						<ui:include src="/com/code/aon/ui/company/facelet/enterprise/formParamsContent.xhtml" />
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:div>
	</aon:div>
	
</ui:composition>
