<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/code/aon/ui/company/facelet/enterprise/treeTemplate.xhtml">

	<ui:define name="content">
	
		<aon:form id="enterpriseForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{companyBundle.company_activity_module}" />
				<ui:param name="controller" value="#{enterpriseActivity}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2" >

					<aon:outputLabel for="EnterpriseActivity_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="EnterpriseActivity_description" size="32"
						maxlength="32" value="#{enterpriseActivity.to.description}"
						required="true" />

					<aon:outputLabel for="EnterpriseActivity_type"
						value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="EnterpriseActivity_type" required="true"
						value="#{enterpriseActivity.to.type}">
						<f:selectItems value="#{companyCollections.enterpriseActivityTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="EnterpriseActivity_cnae_id"
						value="#{companyBundle.company_cnae_module}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="EnterpriseActivity_cnae_id"
							lookup="#{cnaeLookup}"
							reRender="EnterpriseActivity_cnae_detail"
							value="#{enterpriseActivity.to.cnae.id}" size="5" />
						<aon:lookupButton
							windowTitle="#{companyBundle.company_cnae_selection}"
							selectReRender="EnterpriseActivity_cnae_id,EnterpriseActivity_cnae_detail"
							lookup="#{cnaeLookup}"
							minHeight="460" minWidth="650" actionType="search"
							property="#{enterpriseActivity.to.cnae}">
						</aon:lookupButton>
						<aon:inputText id="EnterpriseActivity_cnae_detail"
							value="#{enterpriseActivity.to.cnae.title}"
							size="50" disabled="true" />							
					</aon:div>					

				</aon:panelGrid>

				<aon:div id="detail_panel">
					<aon:div styleClass="aon-form-group" rendered="#{!enterpriseActivity.new}">
						<aon:div styleClass="aon-form-group-title">
							<aon:div styleClass="aon-form-group-title-internal">
								<aon:outputLabel for="enterpriseCCCData" value="#{companyBundle.company_enterprise_ccc}" />
							</aon:div>
						</aon:div>
						
						<ui:include	src="/com/code/aon/ui/company/facelet/enterpriseCCC/tab_grid.xhtml" >
							<ui:param name="controller" value="#{enterpriseCCC}" />
						</ui:include>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{cnaeLookup}" />
	</ui:define>
</ui:composition>
