<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="companyForm">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.company_data_module}" />
				<ui:param name="toolbarDescription"
					value="#{formNew?(bundle.aon_reset):(bundle.aon_editing)}" />
				<ui:define name="toolbarContent">
					<aon:if test="#{company.nevv}" >
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" reRender="aonHeader,aonContent"
							action="start" actionListener="#{company.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" >
							<f:setPropertyActionListener target="#{company.hideHeaderContent}"
								value="#{false}" />
						</aon:commandButton>
					</aon:if>
					<aon:if test="#{!company.nevv}" >
						<aon:commandButton id="save"
							value="#{bundle.aon_save}"
							action="company_form" actionListener="#{company.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
					</aon:if>
				</ui:define>				
			</ui:decorate>
	
			<aon:panelGrid id="listData" columns="2" cellspacing="10" styleClass="aon-panelGrid-formatting"
				columnClasses="aon-width-half-plus aon-vertical-align-top,aon-width-half-minus aon-vertical-align-top">
				<aon:div styleClass="aon-group">
					<aon:div styleClass="aon-group-title">
						<aon:outputText value="#{bundle.company_data_module}"/>
					</aon:div>
					<aon:div styleClass="aon-group-body"> 
						<aon:div styleClass="aon-group-body-internal">
							<ui:include
								src="/com/code/aon/ui/company/facelet/company/formContent.xhtml" />
						</aon:div>
					</aon:div>
				</aon:div>
				<aon:div>
					<aon:div styleClass="aon-group">
						<aon:div styleClass="aon-group-title">
							<aon:outputText value="#{bundle.company_logo_and_signature}"/>
						</aon:div>
						<aon:div styleClass="aon-group-body"> 
							<aon:div styleClass="aon-group-body-internal">
								<ui:include
									src="/com/code/aon/ui/company/facelet/company/logoSignatureContent.xhtml" />
							</aon:div>
						</aon:div>
					</aon:div>
					<aon:if test="#{aonConfiguration.bean.company.showCompanyOtherData}">
						<aon:div styleClass="aon-group">
							<aon:div styleClass="aon-group-title">
								<aon:outputText value="#{bundle.aon_addInfo}"/>
							</aon:div>
							<aon:div styleClass="aon-group-body"> 	
								<aon:div styleClass="aon-group-body-internal">
									<a4j:region>
										<aon:panelGrid id="companyOtherData" columns="2" styleClass="aon-width-all"
											columnClasses="aon-width-half-plus aon-vertical-align-top,aon-width-half-minus aon-vertical-align-top">
											<aon:panelGrid  columns="2" styleClass="aon-width-all">
												<ui:include
													src="/com/code/aon/ui/company/facelet/company/fiscalParameters.xhtml" />
												<ui:include
													src="/com/code/aon/ui/company/facelet/company/digitalCerficateParameters.xhtml" />
												<ui:include
													src="/com/code/aon/ui/company/facelet/company/printParameters1.xhtml" />
											</aon:panelGrid>
											<aon:if test="#{aonConfiguration.bean.company.showSaleInvoiceReportParams}">
												<aon:panelGrid columns="2" styleClass="aon-width-all">
													<ui:include
														src="/com/code/aon/ui/company/facelet/company/printParameters2.xhtml" />
												</aon:panelGrid>
											</aon:if>
										</aon:panelGrid>
									</a4j:region>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:if>
				</aon:div>
			</aon:panelGrid>
	 
	 		<aon:if test="#{aonConfiguration.bean.company.showPanelTabSet}">
				<aon:div styleClass="aon-scroll-area">
					<aon:panelTabSet id="companyTab">
						<aon:panelTab label="#{bundle.registry_addresses}">
							<ui:include src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="skipTypeColumn" value="true" />
								<ui:param name="controller" value="#{companyAddress}" />
							</ui:include>
						</aon:panelTab>
						<aon:panelTab label="#{bundle.company_workplaces}">
							<ui:include	src="/com/code/aon/ui/company/facelet/workplace/tab_grid.xhtml" >
								<ui:param name="controller" value="#{companyWorkPlace}" />
								<ui:param name="showPayrollData" value="#{false}" />
							</ui:include>
						</aon:panelTab>
						<aon:if test="#{aonConfiguration.bean.company.showRegistryBank}">
							<aon:panelTab label="#{bundle.registry_banks_module}">
								<aon:panel>
									<f:facet name="header">
										<aon:outputText
											value="#{bundle.registry_banks_module}" />
									</f:facet>
									<ui:include src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
										<ui:param name="controller" value="#{companyRbank}" />
										<ui:param name="showSuffix" value="#{true}" />
									</ui:include>
								</aon:panel>
								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{bundle.config_predef_paymethod}" />
									</f:facet>
									<ui:include src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
										<ui:param name="controller" value="#{companyRPayMethod}" />
									</ui:include>
								</aon:panel>
							</aon:panelTab>
						</aon:if>				
						<aon:panelTab label="#{bundle.registry_rd_module}">
							<ui:include src="/com/code/aon/ui/registry/facelet/record_data/tab_include.xhtml">
								<ui:param name="controller" value="#{companyRecordData}" />
							</ui:include>
						</aon:panelTab>
						
						<aon:if test="#{aonConfiguration.bean.company.showDirStaff}">
							<aon:panelTab id="dirStaff"
								label="#{bundle.registry_dir_staff}">
								<aon:div rendered="#{true}">
									<ui:include	src="/com/code/aon/ui/registry/facelet/rdirstaff/tab_grid.xhtml">
										<ui:param name="controller" value="#{companyDirStaff}" />
									</ui:include>
								</aon:div>
							</aon:panelTab>
						</aon:if>
										
						<aon:if test="#{aonConfiguration.bean.company.showDigitalCertificate}">
							<aon:panelTab label="#{bundle.registry_digital_certificates}">
								<ui:include src="/com/code/aon/ui/registry/facelet/rattach/tab_grid.xhtml">
									<ui:param name="controller" value="#{companyCertificate}" />
									<ui:param name="skipCategoryColumn" value="#{true}" />
								</ui:include>
							</aon:panelTab>
						</aon:if>
						
						<aon:if test="#{actionDenied.moduleEnabled['pos']}">
							<aon:panelTab label="#{bundle.finance_posInvoice_params}"
								actionListener="#{posInvoiceParams.onInit}">
								<ui:include src="/com/code/aon/ui/finance/facelet/posInvoiceParams/tab_grid.xhtml" />
							</aon:panelTab>
						</aon:if>
						
					</aon:panelTabSet>
				</aon:div>
			</aon:if>
		</aon:form>
		<aon:if test="#{aonConfiguration.bean.company.showRegistryBank}">
			<aon:lookupButtonPopup lookup="#{accountLookup}" />
		</aon:if>
		<aon:if test="#{aonConfiguration.bean.enterprise.showPayrollData}" >
			<aon:lookupButtonPopup lookup="#{agreementLookup}" />
			<aon:lookupButtonPopup lookup="#{calendarLookup}" />
		</aon:if>
		<aon:if test="#{aonConfiguration.bean.company.showRegistryBank}">
			<ui:include src="/com/code/aon/ui/registry/facelet/rbank/newBankAccountModal.xhtml">
				<ui:param name="bankAccountController" value="#{companyRbank.accountHelper}" />
				<ui:param name="modalReRender" value="companyTab" />
			</ui:include>
		</aon:if>						
	</ui:define>

</ui:composition>
