<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-scroll-area">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
			<ui:param name="skipResetButton" value="#{controller.model.rowCount &gt; 6}" />
			<ui:param name="showDataScroller" value="#{false}" />
			<ui:define name="columns">
			
				<aon:column sortable="#{sortColumns}" alias="RegistryAttachment.description"
					styleClass="aon-editDataTable-textColumn aon-width-200 aon-nowrap">
					<f:facet name="header">
						<aon:outputLabel for="#{controller.beanName}_description-New"
							value="#{bundle.aon_description}" />
					</f:facet>
					<aon:outputText value="#{to.description}" />
					<f:facet name="footer">
						<aon:selectOneMenu id="#{controller.beanName}_description-New"
							required="true" rendered="#{formNew}" 
							value="#{controller.to.description}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{controller.images}" />
							<a4j:support event="onchange" status="aonStatus" ajaxSingle="true" />							
						</aon:selectOneMenu>	
					</f:facet>
				</aon:column>
	 			
	 			<ui:include src="/com/code/aon/faces/attachment/fileColumn.xhtml" />
			
			</ui:define>
		</ui:decorate>
	</aon:div>
	
</ui:composition>
