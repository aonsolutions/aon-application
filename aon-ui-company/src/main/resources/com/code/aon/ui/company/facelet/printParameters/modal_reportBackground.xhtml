<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<rich:modalPanel id="saleInvoiceBackground-modal" autosized="true">
		<f:facet name="header">
			<aon:div styleClass="aon-popupWindow-title">
				<aon:outputText value="#{bundle.aon_preview}" />
				<aon:outputText value=" - " />
				<aon:outputText value="#{bundle.finance_sale_invoice_management_module}" />
			</aon:div>
		</f:facet>
		<f:facet name="controls">
			<aon:form>
				<aon:commandButton id="saleInvoiceBackground-hidelink" type="button"
					styleClass="aon-popupWindow-close" immediate="true">
					<rich:componentControl for="saleInvoiceBackground-modal"
						attachTo="saleInvoiceBackground-hidelink" operation="hide"
						event="onclick" />
					<aon:actionHotKey key="esc" />
				</aon:commandButton>
			</aon:form>
		</f:facet>
		<aon:panel style="overflow:auto; width:580px; height:620px; padding-top:10px;" >
			<a4j:mediaOutput element="img" mimeType="#{file.mime}"
				createContent="#{printParams.reportBackground.createSaleInvoiceBackgroundContent}"
				value="#{printParams.reportBackground.saleInvoiceBackgroundFile.key}"
				styleClass="aon-border" cacheable="false" />
		</aon:panel>
	</rich:modalPanel>
