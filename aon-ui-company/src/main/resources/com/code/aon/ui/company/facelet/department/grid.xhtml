<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
		<aon:form id="departmentForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_department_module}" />
				<ui:param name="controller" value="#{department}" />
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="controller" value="#{department}" />
			
					<ui:define name="columns">
						
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputLabel for="Department_name" value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.name}" rendered="#{formList}" />
							<aon:inputText value="#{to.name}" rendered="#{formEdit}" size="40" >
								<f:validateLength maximum="32" />
							</aon:inputText>
							<f:facet name="footer">
								<aon:inputText value="#{controller.to.name}" rendered="#{formNew}" >
									<f:validateLength maximum="32" />
								</aon:inputText>
							</f:facet>
						</aon:column>
			
					</ui:define>
				</ui:decorate>
				
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
