<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="cnaeList">

			<aon:div ajaxRendered="true" layout="none">
			
				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{companyBundle.company_cnae_module}" />
					<ui:param name="controller" value="#{cnae}" />
				</ui:include>			

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">

					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{cnae}" />
						<ui:define name="columns">
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
								<f:facet name="header">
									<aon:outputLabel for="CNAE_code"
										value="#{bundle.aon_id}" />
								</f:facet>
								<aon:outputText value="#{to.code}" rendered="#{formList}" />
								<aon:inputText id="CNAE_code" required="true"
									rendered="#{formEdit}" size="10"
									value="#{cnae.to.code}" maxlength="5" />
								<f:facet name="footer">
									<aon:inputText id="CNAE_code-New" required="true"
										rendered="#{formNew}" size="10"
										value="#{cnae.to.code}" maxlength="5" />
								</f:facet>
							</aon:column>
	
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputLabel for="CNAE_title"
										value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.title}"
									rendered="#{formList}" />
								<aon:inputText id="CNAE_title" required="true"
									rendered="#{formEdit}" size="64"
									value="#{cnae.to.title}" maxlength="255" />
								<f:facet name="footer">
									<aon:inputText id="CNAE_title-New" required="true"
										rendered="#{formNew}" size="64"
										value="#{cnae.to.title}" maxlength="255" />
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
