<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="investAssetForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.accounting_invest_asset_form_module}" />
				<ui:param name="controller" value="#{investAsset}" />
			</ui:decorate>

			<aon:div id="investAssetDiv" styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2" styleClass="aon-width-half"
					columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="InvestAsset_description" value="#{bundle.aon_description}" />
					<aon:inputText id="InvestAsset_description" 
						value="#{investAsset.to.description}" required="#{true}"
						size="40" maxlength="64" />

					<aon:outputLabel for="InvestAsset_activity" value="#{bundle.aon_activity}" />
					<aon:selectOneMenu id="InvestAsset_activity"
						value="#{investAsset.to.activity}">
						<f:selectItem itemLabel="- #{bundle.aon_common_all} -" value="#{null}" />
						<aon:if test="#{investAsset.nevv or investAsset.to.endDate == null}">
							<f:selectItems value="#{companyCollections.activeCompanyActivities}" />
						</aon:if>
						<aon:if test="#{!investAsset.nevv and investAsset.to.endDate != null}">
							<f:selectItems value="#{companyCollections.companyActivities}" />
						</aon:if>
					</aon:selectOneMenu>

					<aon:outputLabel for="InvestAsset_type" value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="InvestAsset_type"
						value="#{investAsset.to.type}" required="#{true}">
						<f:selectItems value="#{companyCollections.investAssetTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="InvestAsset_regime" value="#{bundle.pms_regime}" />
					<aon:selectOneMenu id="InvestAsset_regime"
						value="#{investAsset.to.regime}" required="#{true}">
						<f:selectItems value="#{companyCollections.investAssetRegimes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="InvestAsset_startDate" value="#{bundle.accounting_initial_date}" />
					<aon:selectInputDate id="InvestAsset_startDate"
						value="#{investAsset.to.startDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="InvestAsset_endDate" value="#{bundle.accounting_cancellation_date}" />
					<aon:selectInputDate id="InvestAsset_endDate"
						value="#{investAsset.to.endDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="InvestAsset_vatPercent" value="% #{bundle.accounting_invest_asset_vat_encumbrance}" />
					<aon:inputText id="InvestAsset_vatPercent"
						value="#{investAsset.to.vatPercent}" required="#{true}"
						size="5" maxlength="5">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="InvestAsset_retentionPercent" value="% #{bundle.accounting_invest_asset_retention_encumbrance}" />
					<aon:inputText id="InvestAsset_retentionPercent"
						value="#{investAsset.to.retentionPercent}" required="#{true}"
						size="5" maxlength="5">
						<f:validateDoubleRange />
					</aon:inputText>

				</aon:panelGrid>

			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
