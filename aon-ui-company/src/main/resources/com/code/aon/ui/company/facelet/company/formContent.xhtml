<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelGrid columns="2" styleClass="aon-width-all">
		<ui:include
			src="/com/code/aon/ui/company/facelet/company/formNewContent.xhtml" >
			<ui:param name="controller" value="#{company}" />									
		</ui:include>							
		
		<aon:if test="#{domainSwitcher.childDomain and !company.nevv}" >
			<aon:outputLabel for="Domain_scope"
				value="#{bundle.aon_scope}" />
			<aon:if test="#{!(domainSwitcher.parentDomainUserInChildDomain or aonRole.sysAdmin)}">
				<aon:inputText id="Domain_scope" size="60" disabled="true"
					value="#{company.scope.description}" />
			</aon:if>
			<aon:if test="#{domainSwitcher.parentDomainUserInChildDomain or aonRole.sysAdmin}">						
				<aon:selectOneMenu id="Domain_scope" 
					value="#{company.scope}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{company.domainScopes}" />
				</aon:selectOneMenu>		
			</aon:if>													
		</aon:if>										
		<aon:if test="#{domainSwitcher.parentDomainUserInChildDomain and !company.nevv}">
			<aon:outputLabel for="Domain_active"
				value="#{bundle.aon_active}" />
			<aon:selectBooleanCheckbox id="Domain_active"
				value="#{company.active}" />										
		</aon:if>
		
		<aon:if test="#{company.ediSupportEnabled}">
			<aon:outputLabel for="Company_ediCompanyCode"
				value="Cod. Punto operacional EDI" />
			<aon:inputText id="Company_ediCompanyCode" size="60"
				value="#{company.ediCompanyCode}" />
		</aon:if>
		
		<aon:if test="#{!company.nevv}" >
			<aon:outputText value="#{bundle.aon_lastAccess_date}" />
			<aon:panelGroup>
				<aon:outputText value="#{company.lastAccessDate}" >
					<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
				<aon:outputText rendered="#{company.lastAccessDate != null}"
					value=" (#{company.lastAccessUser})" />
			</aon:panelGroup>
		</aon:if>
				
	</aon:panelGrid>

</ui:composition>
