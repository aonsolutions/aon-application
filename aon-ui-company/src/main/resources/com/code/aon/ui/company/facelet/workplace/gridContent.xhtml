<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="WorkPlace_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.description}" />
				<aon:inputText id="WorkPlace_description" rendered="#{formEdit}" size="40"
					maxlength="64" value="#{controller.to.description}"
					required="true" />
				<f:facet name="footer">
					<aon:inputText id="WorkPlace_description-New" rendered="#{formNew}" size="40"
						maxlength="64" value="#{controller.to.description}"
						required="true" />
				</f:facet>								
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="WorkPlace_address_id"
						value="#{companyBundle.company_workplace_address}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.address.shortAddress}" />
				<aon:selectOneMenu id="WorkPlace_address_id" required="true"
					value="#{controller.to.address}" rendered="#{formEdit}">
					<f:selectItems value="#{enterprise.addresses}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="WorkPlace_address_id-New" required="true"
						value="#{controller.to.address}" rendered="#{formNew}">
						<f:selectItems value="#{enterprise.addresses}" />
					</aon:selectOneMenu>
				</f:facet>								
			</aon:column>			
			
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{companyBundle.company_workplace_economic_agreement}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.economicAgreement}" />
				<aon:selectOneMenu id="WorkPlace_economicAgreement"
					rendered="#{formEdit}"
					value="#{controller.to.economicAgreement}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{companyCollections.economicAgreements}" />
				</aon:selectOneMenu>	
				<f:facet name="footer">
					<aon:selectOneMenu id="WorkPlace_economicAgreement-New"
						rendered="#{formNew}"
						value="#{controller.to.economicAgreement}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{companyCollections.economicAgreements}" />
					</aon:selectOneMenu>	
				</f:facet>
			</aon:column>		
			
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{calendarBundle.aon_calendar_calendar}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.calendar.description}" />
				<aon:div styleClass="aon-lookup" rendered="#{formEdit}">
					<aon:lookupInputText id="WorkPlace_calendar_id"
						lookup="#{calendarLookup}"
						reRender="WorkPlace_calendar_description"
						value="#{controller.to.calendar.id}" size="5" />
					<aon:lookupButton 
						windowTitle="#{calendarBundle.aon_calendar_selection}"
						selectReRender="WorkPlace_calendar_id, WorkPlace_calendar_description"
						lookup="#{calendarLookup}" minHeight="460" minWidth="650"
						actionType="search"
						property="#{controller.to.calendar}">
					</aon:lookupButton>	
					<aon:inputText id="WorkPlace_calendar_description"
						value="#{controller.to.calendar.description}"
						size="50" disabled="true" />	
				</aon:div>	
				<f:facet name="footer">
					<aon:div styleClass="aon-lookup" rendered="#{formNew}">
						<aon:lookupInputText id="WorkPlace_calendar_id-New"
							lookup="#{calendarLookup}"
							reRender="WorkPlace_calendar_description-New"
							value="#{workplace.to.calendar.id}" size="5" />
						<aon:lookupButton 
							windowTitle="#{calendarBundle.aon_calendar_selection}"
							selectReRender="WorkPlace_calendar_id-New, WorkPlace_calendar_description-New"
							lookup="#{calendarLookup}" minHeight="460" minWidth="650"
							actionType="search"
							property="#{workplace.to.calendar}">
						</aon:lookupButton>	
						<aon:inputText id="WorkPlace_calendar_description-New"
							value="#{workplace.to.calendar.description}"
							size="50" disabled="true" />	
					</aon:div>
				</f:facet>
			</aon:column>		
			
		</ui:define>
	</ui:decorate>

</ui:composition>
