<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_id}" />
				</f:facet>
				<aon:outputText value="#{to.id}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
				<f:facet name="header">
					<aon:outputLabel for="WorkPlace_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.description}" />
				<aon:inputText id="WorkPlace_description" rendered="#{formEdit}" size="40"
					maxlength="64" value="#{controller.to.description}"
					required="true" />
				<f:facet name="footer">
					<aon:inputText id="WorkPlace_description-New" rendered="#{formNew}" size="40"
						maxlength="64" value="#{controller.to.description}"
						required="true" />
				</f:facet>								
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="WorkPlace_address_id"
						value="#{companyBundle.company_workplace_address}" />
				</f:facet>
				<aon:outputText rendered="#{formList}"
					value="#{to.address.address} #{to.address.address2} #{to.address.address3}" />
				<aon:selectOneMenu id="WorkPlace_address_id" required="true"
					value="#{controller.to.address}" rendered="#{formEdit}">
					<f:selectItems value="#{companyCollections.companyAddresses}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="WorkPlace_address_id-New" required="true"
						value="#{controller.to.address}" rendered="#{formNew}">
						<f:selectItems value="#{companyCollections.companyAddresses}" />
					</aon:selectOneMenu>
				</f:facet>								
			</aon:column>			
			
		</ui:define>
	</ui:decorate>

</ui:composition>
