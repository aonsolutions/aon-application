<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:if test="#{aonConfiguration.bean.enterprise.showEnterpriseParams}" >
	
		<aon:outputLabel for="salary_model" value="#{bundle.company_enterprise_params_salary_model}" />
		<aon:div>
			<aon:if test="#{aonRole.sysAdmin}">
				<aon:panel style="width:350px;" id="optionalTemplatesPanel">
					<f:facet name="header">
						<aon:div style="margin: -15px 0 0 5px; background-color: white; display: inline;">
							<aon:outputText value="Plantillas opcionales" />
						</aon:div>
					</f:facet>
					<aon:div>
						<aon:selectManyCheckbox layout="pageDirection"
							value="#{enterpriseParams.enabledSalaryTemplates}" 
							reRender="SaleInvoice-params-panel">
							<f:selectItems value="#{enterpriseParams.optionalSalaryTemplates}" />
							<a4j:support event="onclick" reRender="optionalTemplatesPanel, salary_model" />
						</aon:selectManyCheckbox>
					</aon:div>
				</aon:panel>
			</aon:if>
			<aon:selectOneMenu id="salary_model"
				value="#{enterpriseParams.parameters['PAY_REPORT_salary_PAY'].expression}">
				<f:selectItems value="#{payrollCollections.salaryTemplates}" />
			</aon:selectOneMenu>
		</aon:div>

		<aon:outputLabel for="enterprise_salary_model" value="#{bundle.company_enterprise_params_enterprise_salary_model}" />
		<aon:selectOneMenu id="enterprise_salary_model"
			value="#{enterpriseParams.parameters['PAY_REPORT_enterpriseSalary_PAY'].expression}">
			<f:selectItems value="#{companyCollections.enterpriseSalaryTemplates}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="salary_sending_method" value="#{bundle.company_enterprise_params_salary_sending_method}" />
		<aon:div id="salary_sending_method-div">
			<aon:selectOneMenu id="salary_sending_method"
				value="#{enterpriseParams.parameters['PAY_salarySendingMethod_PAY'].expression}">
				<f:selectItems value="#{companyCollections.salarySendingMethods}" />
				<a4j:support event="onchange" reRender="salary_sending_method-div" />
			</aon:selectOneMenu>
			<aon:outputText value="A la direccion:" styleClass="aon-margin-left"
				rendered="#{enterpriseParams.parameters['PAY_salarySendingMethod_PAY'].expression == 'EMAIL'}" />
			<aon:inputText id="salarySending_email" size="50"
				rendered="#{enterpriseParams.parameters['PAY_salarySendingMethod_PAY'].expression == 'EMAIL'}"
				value="#{enterpriseParams.parameters['PAY_salarySending_email_PAY'].expression}" />
		</aon:div>
		
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/agreement/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{enterpriseParams.agreement}" />
			<ui:param name="lookupSuffix" value="-enterpriseParam" />
			<ui:param name="skipNewButton" value="#{true}" />
			<ui:param name="lookupInputSuggestSize" value="40" />
		</ui:include>
		
		<ui:include src="/com/esferalia/aon/ui/calendar/facelet/calendar/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{enterprise.to.calendar}" />
			<ui:param name="skipNewButton" value="#{true}" />
			<ui:param name="lookupInputSuggestSize" value="40" />
		</ui:include>
		
	</aon:if>
	
</ui:composition>
