<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:param name="toolbarTitle" value="#{bundle.company_saleInvoice_footer_text}" />
		<ui:param name="toolbarDescription" value="#{bundle.aon_edit}" />
		<ui:param name="toolbarID" value="aonToolbar-saleInvoice_footer_text" />
		
		<ui:define name="toolbarContent">
			<aon:commandButton id="saleInvoice_footer_text-save"
				title="#{bundle.aon_key_save_accelerator}"
				value="#{bundle.aon_save}" 
				actionListener="#{companySaleInvoiceFooter.onAccept}"
				styleClass="aon-finding-toolbar-item aon-icon-accept"
				accesskey="#{bundle.aon_key_save}" />
			<aon:commandButton id="saleInvoice_footer_text-import"
				title="#{bundle.company_create_LOPD_text}"
				value="#{bundle.company_create_LOPD_text}" reRender="tab_content"
				actionListener="#{companySaleInvoiceFooter.createLOPD}"
				styleClass="aon-finding-toolbar-item aon-icon-sincronize" />
		</ui:define>				
	</ui:decorate>	
	
	<aon:div id="tab_content" styleClass="aon-scroll-area">
		
		<aon:panelGrid  columns="2" style="width:100%">
			<aon:outputLabel for="SaleInvoice_footer_text"
				value="#{bundle.company_invoice_footer_text}" />
			<aon:inputTextarea id="SaleInvoice_footer_text" cols="150" rows="6"
				value="#{companySaleInvoiceFooter.text}"/>
				
		</aon:panelGrid>


	</aon:div>
	
</ui:composition>
