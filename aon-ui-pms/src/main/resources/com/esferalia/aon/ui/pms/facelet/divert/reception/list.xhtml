<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="divertReceptionList">
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_divertReception_module}" />
				<ui:param name="controller" value="#{divertReception}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{divertReception}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">
					
						<aon:column alias="ProjectReservationDivert.projectReservation.id"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_reservation}" />
							</f:facet>
							<aon:div>
								<aon:outputText value="#{to.projectReservation.id}" />
								<aon:outputText value=" - " />
								<aon:outputText value="#{to.projectReservation.code} - #{to.projectReservation.guestFullName}" />
								<aon:outputText value=" - " />
								<aon:outputText value="#{to.projectReservation.startDate}" >
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:outputText value=" - " />
								<aon:outputText value="#{to.projectReservation.endDate}" >
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:div>
						</aon:column>
						
						<aon:column alias="ProjectReservationDivert.requestHotel.workPlace.description"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_source}" />
							</f:facet>
							<aon:outputText value="#{to.requestHotel.workPlace.description}" />
						</aon:column>
			
						<aon:column alias="ProjectReservationDivert.divertHotel.workPlace.description"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.warehouse_stock_target}" />
							</f:facet>
							<aon:outputText value="#{to.divertHotel.workPlace.description}" />
						</aon:column>
			
						<aon:column alias="ProjectReservationDivert.divertDate"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.divertDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
			
						<aon:column alias="ProjectReservationDivert.status"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
			
						<aon:column alias="ProjectReservationDivert.requestUser"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.pms_divert_request}" />
							</f:facet>
							<aon:outputText value="#{to.requestUser.name}" />
						</aon:column>
	
						<aon:column alias="ProjectReservationDivert.responseUser"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.pms_divert_response}" />
							</f:facet>
							<aon:outputText value="#{to.responseUser.name}" />
						</aon:column>
			
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-60 aon-vertical-align-top">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:commandLink id="accept-divert"
								value="&#160;" title="#{bundle.aon_accept}"
								rendered="#{divertReception.acceptable}"
								reRender="showRoomDetailWindow"
								styleClass="aon-editDataTable-button aon-icon-accept">
								<aon:actionListener method="#{divertReception.onSelect}" />
								<aon:actionListener method="#{divertReception.onConfirmDivert}" />
								<f:setPropertyActionListener target="#{divertReception.showRoomDetailWindow}"
									value="#{true}" />
							</aon:commandLink>
							<aon:commandButton id="cancel-divert"
								value="&#160;" title="#{bundle.aon_cancel}"
								rendered="#{to.pending}"
								actionListener="#{divertReception.onCancelDivert}"
								styleClass="aon-editDataTable-button aon-icon-removed">
							</aon:commandButton>
						</aon:column>
						
					</ui:define>
				</ui:decorate>					
				
			</aon:div>

		</aon:form>
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/divert/reception/modalRoomDetail.xhtml">
			<ui:param name="modalController" value="#{divertReception}" />
			<ui:param name="controller" value="#{reservationRoom}" />
		</ui:include>
		
	</ui:define>
</ui:composition>
