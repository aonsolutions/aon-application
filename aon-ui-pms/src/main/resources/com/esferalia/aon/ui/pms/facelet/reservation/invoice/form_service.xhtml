<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="invoiceServicesDiv" styleClass="aon-group" style="width: 100%; margin-top: 2em;">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{pmsBundle.pms_services}"/>
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
				<aon:dataTable id="serviceList"
					value="#{controller.reservationInvoiceTo.services}" var="hotelInvoiceService">

					<aon:column styleClass="aon-panelGrid-odd aon-width-100 aon-editDataTable-textColumn">
						<aon:outputLabel for="ProjectReservation_serviceItem"
							value="#{pmsBundle.pms_service}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-300 aon-editDataTable-textColumn">
						<aon:selectOneMenu id="ProjectReservation_serviceItem" styleClass="aon-width-300"
							value="#{hotelInvoiceService.item}" required="true">
							<a4j:support event="onchange" 
								actionListener="#{controller.onInvoiceServiceChanged}"
								reRender="ProjectReservation_serviceAmount,invoiceFinancesDiv" />
							<f:selectItems value="#{controller.hotelServices}" />
						</aon:selectOneMenu>
					</aon:column>

					<aon:column styleClass="aon-panelGrid-odd aon-width-50 aon-editDataTable-textColumn">
						<aon:outputLabel for="ProjectReservation_serviceQuantity"
							value="#{pmsBundle.pms_units}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-40 aon-editDataTable-textColumn">
						<aon:inputText id="ProjectReservation_serviceQuantity"
							value="#{hotelInvoiceService.quantity}"
							required="true" size="1">
							<a4j:support event="onchange" 
								actionListener="#{controller.onInvoiceServiceChanged}"
								reRender="ProjectReservation_serviceAmount,invoiceFinancesDiv" />
						</aon:inputText>
					</aon:column>

					<aon:column styleClass="aon-panelGrid-odd aon-width-40 aon-editDataTable-textColumn">
						<aon:outputLabel for="ProjectReservation_serviceFromDate" 
							value="#{bundle.aon_date_from}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-event aon-width-100 aon-editDataTable-textColumn">
						<aon:selectInputDate id="ProjectReservation_serviceFromDate"
							value="#{hotelInvoiceService.fromDate}" required="true" inputSize="6" 
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="oninputchange"
								actionListener="#{controller.onInvoiceServiceChanged}"
								reRender="ProjectReservation_serviceAmount,invoiceFinancesDiv"
								focus="ProjectReservation_serviceToDate" />
							<a4j:support event="onchanged"
								actionListener="#{controller.onInvoiceServiceChanged}"
								reRender="ProjectReservation_serviceAmount,invoiceFinancesDiv"
								focus="ProjectReservation_serviceToDate" />
						</aon:selectInputDate>
					</aon:column>

					<aon:column styleClass="aon-panelGrid-odd aon-width-40 aon-editDataTable-textColumn">
						<aon:outputLabel for="ProjectReservation_serviceToDate" 
							value="#{bundle.aon_date_to}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-100 aon-editDataTable-textColumn">
						<aon:selectInputDate id="ProjectReservation_serviceToDate"
							value="#{hotelInvoiceService.toDate}" required="true" inputSize="6"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="oninputchange"
								actionListener="#{controller.onInvoiceServiceChanged}"
								reRender="ProjectReservation_serviceAmount,invoiceFinancesDiv"
								focus="Service-newButton" />
							<a4j:support event="onchanged"
								actionListener="#{controller.onInvoiceServiceChanged}"
								reRender="ProjectReservation_serviceAmount,invoiceFinancesDiv"
								focus="Service-newButton" />
						</aon:selectInputDate>
					</aon:column>

					<aon:column styleClass="aon-panelGrid-odd aon-width-40 aon-editDataTable-textColumn">
						<aon:outputLabel for="ProjectReservation_serviceAmount" 
							value="#{bundle.aon_total}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-auto aon-editDataTable-textColumn">
						<aon:outputText id="ProjectReservation_serviceAmount" value="#{hotelInvoiceService.total}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:commandButton
							id="Service-newButton" title="#{bundle.aon_reset}"
							styleClass="aon-editDataTable-button aon-margin-left aon-vertical-align-middle aon-icon-reset"
							rendered="#{hotelInvoiceService == controller.reservationInvoiceTo.lastService}"
							actionListener="#{controller.onNewService}"
							reRender="invoiceHotelDiv,invoiceRoomDiv,invoiceServicesDiv,invoiceFinancesDiv" />
					</aon:column>

				</aon:dataTable>
			</aon:div>
		</aon:div>
	</aon:div>

</ui:composition>
