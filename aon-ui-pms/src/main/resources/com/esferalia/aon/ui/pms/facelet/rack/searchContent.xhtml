<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputText value="" />
	<aon:div style="width:600px;">

		<aon:panelCollapsible expanded="true" label="#{pmsBundle.pms_rooms}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">

				<c:if test="#{pmsCollections.currentUserHotelsCount > 1}">
					<aon:outputLabel for="Room_hotel_id"
						value="#{bundle.aon_module_hotel}" />
					<aon:selectOneMenu id="Room_hotel_id"
						value="#{searchController.hotel}"
						valueChangeListener="#{controller.onHotelChanged}"
						reRender="Room_item_id">
						<f:selectItems value="#{pmsCollections.currentUserHotels}" />
					</aon:selectOneMenu>
				</c:if>

				<aon:outputLabel for="Room_item_id"
					value="#{pmsBundle.pms_room_type}" />
				<aon:selectOneMenu id="Room_item_id"
					value="#{searchController.item}" >
					<f:selectItem itemLabel=" - " itemValue="#{null}" />
					<f:selectItems value="#{searchController.hotelRoomItems}" />
				</aon:selectOneMenu>

				<aon:outputText for="Room_asset_name"
					value="#{pmsBundle.pms_room_number}" />
				<aon:inputText id="Room_asset_name"
					value="#{searchController.roomName}"
					size="3" maxlength="5" />

				<aon:outputText for="Rack_viewerStartDate"
					value="#{bundle.aon_start_date}" />
				<aon:selectInputDate id="Rack_viewerStartDate"
					value="#{controller.filterParams.viewerStartDate}"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}"/>

			</aon:panelGrid>
		</aon:panelCollapsible>

	</aon:div>

</ui:composition>
