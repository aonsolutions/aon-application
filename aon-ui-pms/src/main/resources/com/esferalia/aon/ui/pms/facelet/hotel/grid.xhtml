<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="hotelList">
			<aon:div ajaxRendered="true" layout="none">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{pmsBundle.pms_hotel_module}" />
					<ui:param name="controller" value="#{hotel}" />
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{hotel}" />
						<ui:define name="columns">
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
								<f:facet name="header">
									<aon:outputLabel for="Hotel_name" value="#{bundle.aon_name}" />
								</f:facet>
								<aon:outputText value="#{to.name}" rendered="#{formList}" />
								<aon:inputText id="Hotel_name" value="#{hotel.to.name}"
									rendered="#{formEdit}" size="40" maxlength="64"	required="#{true}" />
								<f:facet name="footer">
									<aon:inputText id="Hotel_name-New" value="#{hotel.to.name}"
										rendered="#{formNew}" size="40" maxlength="64"	required="#{true}" />
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
								<f:facet name="header">
									<aon:outputLabel for="Hotel_code" value="#{bundle.aon_id}" />
								</f:facet>
								<aon:outputText value="#{to.code}" rendered="#{formList}" />
								<aon:inputText id="Hotel_code" value="#{hotel.to.code}"
									rendered="#{formEdit}" size="10" maxlength="16"	required="#{true}" />
								<f:facet name="footer">
									<aon:inputText id="Hotel_code-New" value="#{hotel.to.code}"
										rendered="#{formNew}" size="10" maxlength="16"	required="#{true}" />
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-width-250">
								<f:facet name="header">
									<aon:outputLabel for="Hotel_workPlace" value="#{companyBundle.company_workplace}" />
								</f:facet>
								<aon:outputText value="#{to.workPlace.description}" rendered="#{formList}" />
								<aon:selectOneMenu id="Hotel_workPlace"	styleClass="aon-margin-left aon-form-input-text"
									value="#{hotel.to.workPlace}" rendered="#{formEdit}" required="#{true}">
									<f:selectItems value="#{companyCollections.workPlaces}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="Hotel_workPlace-New"	styleClass="aon-margin-left aon-form-input-text"
										value="#{hotel.to.workPlace}" rendered="#{formNew}" required="#{true}">
										<f:selectItems value="#{companyCollections.workPlaces}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-width-250">
								<f:facet name="header">
									<aon:outputLabel for="Hotel_scope" value="#{configBundle.config_scope}" />
								</f:facet>
								<aon:outputText value="#{to.scope.description}" rendered="#{formList}" />
								<aon:selectOneMenu id="Hotel_scope"	styleClass="aon-margin-left aon-form-input-text"
									value="#{hotel.to.scope}" rendered="#{formEdit}" required="#{true}">
									<f:selectItems value="#{configCollections.scopes}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="Hotel_scope-New"	styleClass="aon-margin-left aon-form-input-text"
										value="#{hotel.to.scope}" rendered="#{formNew}" required="#{true}">
										<f:selectItems value="#{configCollections.currentUserScopes}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column styleClass="aon-editDataTable-textColumn aon-width-50">
								<f:facet name="header">
									<aon:outputLabel for="Hotel_active" value="#{bundle.aon_active}" />
								</f:facet>
								<aon:outputText value="&#160;" rendered="#{formList}"
									styleClass="#{to.active?'aon-icon-checked':'aon-icon-check'}" 
									style="padding-left:20px" />
								<aon:selectBooleanCheckbox id="Hotel_active"
									value="#{hotel.to.active}" rendered="#{formEdit}" />
								<f:facet name="footer">
									<aon:selectBooleanCheckbox id="Hotel_active-New"
										value="#{hotel.to.active}" rendered="#{formNew}" />
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
