<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="CardFinanceToolBarDiv" styleClass="aon-toolbar"
		rendered="#{paymentCardSettle.paymentCardModel.rowCount > 0}">
     	<aon:commandButton title="#{bundle.pms_exclude} #{bundle.aon_all}"
			styleClass="aon-finding-toolbar-item aon-icon-deleteFolder"
			value="#{bundle.pms_exclude} #{bundle.aon_all}"
			actionListener="#{paymentCardSettle.onRemoveAllFinancesFromCard}" reRender="paymentCardSettleList"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
     	<aon:commandButton title="#{bundle.finance_to_fraction} #{bundle.pms_differences}"
			styleClass="aon-finding-toolbar-item aon-icon-fraction"
			value="#{bundle.finance_to_fraction} #{bundle.pms_differences}"
			rendered="#{paymentCardSettle.existAmountDifferences}"
			reRender="showFinanceFractionWindow">
			<f:setPropertyActionListener target="#{paymentCardSettle.showFinanceFractionWindow}"
				value="#{true}" />
		</aon:commandButton>
		<aon:commandButton title="#{bundle.finance_to_batch}"
			styleClass="aon-finding-toolbar-item aon-icon-newFolder"
			value="#{bundle.finance_to_batch}"
			actionListener="#{paymentCardSettle.onFinanceBatchShow}" 
			reRender="showFinanceBatchWindow">
			<f:setPropertyActionListener target="#{paymentCardSettle.showFinanceBatchWindow}"
				value="#{true}" />
		</aon:commandButton>
	</aon:div>

	<aon:div id="CardFinanceDataDiv">
	
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
			<ui:param name="controller" value="#{paymentCardSettle.paymentCardState}" />
			<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
			<ui:param name="skipSelectButton" value="#{true}" />
			<ui:define name="columns">

				<aon:column styleClass="aon-editDataTable-iconColumn">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:commandButton title="#{bundle.pms_exclude}" immediate="true"
						styleClass="aon-editDataTable-button aon-icon-delete"
						actionListener="#{paymentCardSettle.onRemoveFinanceFromCard}"
						reRender="paymentCardSettleList"
						onclick="Richfaces.showModalPanel('waitProccess')" 
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-width-60">
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_finance_date_abbrv}" />
					</f:facet>
					<aon:outputText value="#{to.financeDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_invoice_number}" />
					</f:facet>
					<aon:commandLink id="invoiceLink" immediate="true" 
						styleClass="aon-dataTable-link"
						title="#{bundle.aon_go}"
						rendered="#{to.invoiceId != null}" 
						actionListener="#{paymentCardSettle.onLoadInvoice}"
						action="saleInvoice_form">
						<aon:outputText value="#{to.invoiceCode}" 
							style="#{to.rectified ? 'color:red' : to.rectifier ? 'color:blue' : ''}" />
					</aon:commandLink>
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout"
						rendered="#{to.rectified}">
						<aon:outputFormat value="#{bundle.finance_invoice_rectified_message2}" styleClass="aon-bold aon-label-error">
							<f:param value="#{to.rectificationInvoiceCode}" />
						</aon:outputFormat>
					</rich:toolTip>
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout"
						rendered="#{to.rectifier}">
						<aon:outputFormat value="#{bundle.finance_invoice_rectifier_message2}" styleClass="aon-bold aon-label-error">
							<f:param value="#{to.rectificationInvoiceCode}" />
						</aon:outputFormat>
					</rich:toolTip>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-80">
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_payMethod}" />
					</f:facet>
					<aon:outputText value="#{to.payMethod}">
						<aon:abbreviateConverter maxWidth="15" />
					</aon:outputText>
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout"
						rendered="#{to.payMethodLength > 15}">
						<aon:outputText value="#{to.payMethod}" />
					</rich:toolTip>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_reservation}" />
					</f:facet>
					<aon:commandLink id="reservationLink" immediate="true" 
						styleClass="aon-dataTable-link"
						title="#{bundle.aon_go}"
						rendered="#{to.reservationId != null}" 
						actionListener="#{paymentCardSettle.onLoadReservation}"
						action="reservation_form">
						<aon:outputText value="#{to.reservationId}" />
					</aon:commandLink>
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout">
						<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic,aon-noborder aon-bold">
							<aon:outputText value="#{bundle.report_checkin}:" />
							<aon:outputText value="#{to.reservationStartDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>

							<aon:outputText value="#{bundle.report_checkout}:" />
							<aon:outputText value="#{to.reservationEndDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:panelGrid>
					</rich:toolTip>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
					<f:facet name="header">
						<aon:outputText value="#{bundle.report_reservation_code}" />
					</f:facet>
					<aon:outputText value="#{to.reservationCode}">
						<aon:abbreviateConverter maxWidth="15" />
					</aon:outputText>
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout"
						rendered="#{to.reservationCodeLength > 15}">
						<aon:outputText value="#{to.reservationCode}" />
					</rich:toolTip>
				</aon:column>

				<c:if test="#{paymentCardSettle.agenciesSize > 1}">
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
						<f:facet name="header">
							<aon:outputText value="#{bundle.report_agency}" />
						</f:facet>
						<aon:outputText value="#{to.agency}" />
					</aon:column>
				</c:if>

				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_module_hotel}" />
					</f:facet>
					<aon:outputText value="#{to.reservationHotel}">
						<aon:abbreviateConverter maxWidth="#{paymentCardSettle.agenciesSize > 1 ? 20 : 30}" />
					</aon:outputText>
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout"
						rendered="#{paymentCardSettle.agenciesSize > 1 ? to.reservationHotelLength > 20 : to.reservationHotelLength > 30}">
						<aon:outputText value="#{to.reservationHotel}" />
					</rich:toolTip>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputText value="#{bundle.report_guest}" />
					</f:facet>
					<aon:outputText value="#{to.reservationGuest}">
						<aon:abbreviateConverter maxWidth="#{paymentCardSettle.agenciesSize > 1 ? 20 : 30}" />
					</aon:outputText>
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout"
						rendered="#{paymentCardSettle.agenciesSize > 1 ? to.reservationGuestLength > 20 : to.reservationGuestLength > 30}">
						<aon:outputText value="#{to.reservationGuest}" />
					</rich:toolTip>
					<f:facet name="footer">
						<aon:outputText value="#{bundle.stat_total}" />
					</f:facet>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_total}" />
					</f:facet>
					<aon:outputText value="#{to.totalAmount}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<f:facet name="footer">
						<aon:div style="float:right">
							<aon:outputText style="text-align:right" value="#{paymentCardSettle.cardFinanceTotalAmount}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:div>
					</f:facet>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
					<f:facet name="header">
						<aon:outputText value="#{bundle.finance_payment} #{bundle.report_agency}" />
					</f:facet>
					<aon:inputText value="#{to.newAmount}" size="4"
						reRender="CardFinanceToolBarDiv,CardFinanceDataDiv">
					</aon:inputText>
					<f:facet name="footer">
						<aon:div style="float:right">
							<aon:outputText styleClass="aon-text-right" value="#{paymentCardSettle.cardFinanceTotalNewAmount}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:div>
					</f:facet>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
					<f:facet name="header">
						<aon:outputText value="#{bundle.pms_difference}" />
					</f:facet>
					<aon:outputText value="#{(empty to.newAmount) ? '' : to.newAmount - to.totalAmount}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
					<f:facet name="footer">
						<aon:div style="float:right">
							<aon:outputText styleClass="aon-text-right" value="#{paymentCardSettle.cardFinanceTotalDifference}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:div>
					</f:facet>
				</aon:column>
			
			</ui:define>
		</ui:decorate>

	</aon:div>

</ui:composition>
