<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showInvoiceWindow">
		<aon:if test="#{controller.showInvoiceWindow}">
			<rich:modalPanel id="invoiceModalPanel" minHeight="340" minWidth="580" 
				rendered="#{controller.showInvoiceWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.pms_noShow_invoice_module}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showInvoiceWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showInvoiceWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="invoiceForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="invoiceModalToolbar" styleClass="aon-toolbar">
									<aon:commandButton id="invoice-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_key_invoice_description}"
										actionListener="#{controller.onNoShowInvoice}"
										reRender="aonContent"
										onclick="Richfaces.showModalPanel('waitProccess')"
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="invoiceModalPanel"
											event="onclick" operation="hide"/>
										<f:setPropertyActionListener
											target="#{controller.showInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="invoice-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										reRender="showInvoiceWindow">
										<f:setPropertyActionListener
											target="#{controller.showInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div id="invoiceModalContent" styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

										<aon:outputLabel for="NoShowInvoice_issueDate"
											value="#{bundle.finance_invoice_date}" />
										<aon:selectInputDate id="NoShowInvoice_issueDate" 
											value="#{controller.noShowDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}">
											<a4j:support ajaxSingle="true" event="oninputchange"
												reRender="NoShowInvoice_dueDate"
												focus="NoShowInvoice_payMethod" />
											<a4j:support ajaxSingle="true" event="onchanged"
												reRender="NoShowInvoice_dueDate"
												focus="NoShowInvoice_payMethod" />
										</aon:selectInputDate>

										<aon:if test="#{searchListener.manual}">
											<aon:outputLabel for="NoShowInvoice_noShowPenalty"
												value="#{bundle.pms_penalty}" />
											<aon:selectOneMenu id="NoShowInvoice_noShowPenalty"
												value="#{controller.noShowPenaltyValue}" required="true"
												ajaxSingle="true">
												<f:selectItem itemLabel=" - " value="#{null}" />
												<f:selectItem itemLabel="1N"  itemValue="1D" />
												<f:selectItem itemLabel="2N" itemValue="2D" />
												<f:selectItem itemLabel="50%" itemValue="50P" />
												<f:selectItem itemLabel="100%" itemValue="100P" />
											</aon:selectOneMenu>
										</aon:if>

										<aon:outputLabel for="NoShowInvoice_payMethod"
											value="#{bundle.finance_payMethod}" />
										<aon:if test="#{searchListener.guestReservationSearch}">
											<aon:selectOneMenu id="NoShowInvoice_payMethod"
												value="#{controller.noShowPayMethod}" required="true" 
												ajaxSingle="true">
												<f:selectItems value="#{configCollections.directPayMethods}" />
											</aon:selectOneMenu>
										</aon:if>
										<aon:if test="#{!searchListener.guestReservationSearch}">
											<aon:selectOneMenu id="NoShowInvoice_payMethod"
												value="#{controller.noShowPayMethod}" required="true"
												reRender="invoiceModalContent" ajaxSingle="true">
												<f:selectItems value="#{configCollections.payMethods}" />
											</aon:selectOneMenu>
										</aon:if>

										<aon:outputLabel for="NoShowInvoice_bank"
											rendered="#{controller.bankRequired}"
											value="#{bundle.aon_bank}" />
										<aon:selectOneMenu id="NoShowInvoice_bank"
											rendered="#{controller.bankRequired}"
											value="#{controller.noShowBank}" required="true"
											ajaxSingle="true">
											<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="NoShowInvoice_daysToPayment"
											value="#{bundle.registry_days_to_first_payment}" />
										<aon:panelGroup>
											<aon:inputText id="NoShowInvoice_daysToPayment"
												value="#{controller.noShowDaysToPayment}"
												required="true" size="3" maxlength="3"
												reRender="NoShowInvoice_dueDate" ajaxSingle="true"> 
												<f:validateDoubleRange minimum="0" />
											</aon:inputText>

											<aon:outputText value="#{bundle.finance_pay_date}" 
												styleClass="aon-italic aon-margin-left"/>
											<aon:outputText id="NoShowInvoice_dueDate" 
												value="#{controller.noShowPaymentDate}" 
												styleClass="aon-italic aon-bold aon-margin-left">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:panelGroup>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
