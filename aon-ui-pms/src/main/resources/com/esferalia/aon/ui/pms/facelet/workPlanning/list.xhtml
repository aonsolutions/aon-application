<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="workPlanningList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_workPlanning_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="workPlanning-search"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						value="#{bundle.aon_search}" 
						action="workPlanning_search"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="workPlanning-excel-report"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						value="&#160;" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="workPlanning" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="workPlanning-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_listing}" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="workPlanning" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="roomCleaningControl-excel-report"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						value="&#160;" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="roomCleaningControl" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="roomCleaningControl-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.pms_roomCleaningControl}" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="roomCleaningControl" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic" />
					<aon:outputText value="#{workPlanning.hotel.workPlace.description}" styleClass="aon-margin-left aon-bold" />

					<aon:outputText value="#{bundle.aon_date}:" styleClass="aon-margin-left aon-italic" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{workPlanning.date}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:panel>

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{workPlanning}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_room}" />
							</f:facet>
							<aon:outputText value="#{to.roomNumber}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_guests}" />
							</f:facet>
							<aon:outputText value="#{to.pax}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_operation}" />
							</f:facet>
							<aon:outputText value="#{to.action}" />
						</aon:column>

					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
