<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="roomBlockForm">

			<aon:methodParam name="searchAction" value="roomBlock_search" />
			<aon:methodParam name="backAction" value="roomBlock_list" />
			<aon:methodParam name="saveAction" value="roomBlock_grid" />
			<aon:methodParam name="saveActionListener" value="#{roomBlock.onSelectRoom}" type="actionListener" />
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_roomBlock_module}" />
				<ui:param name="controller" value="#{room}" />
				
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipSaveButton" value="#{true}" />
				<ui:param name="skipRemoveButton" value="#{true}" />
				
				<ui:define name="beforeSpinToolbarContent" >
					
					<aon:commandButton id="multiple_block" value="#{pmsBundle.pms_roomBlock_multiple_block}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						actionListener="#{roomBlock.onShowMultipleBlockWindow}"
						reRender="showMultipleBlockWindow">	
						<f:setPropertyActionListener target="#{roomBlock.showMultipleBlockWindow}"
							value="#{true}" />
					</aon:commandButton>		
					
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="6" width="100%">
					
					<aon:outputLabel value="#{pmsBundle.pms_hotel}" />
					<aon:outputText value="#{room.to.hotel.workPlace.description}" />
					 
					<aon:outputLabel value="#{bundle.aon_number}" />
					<aon:outputText value="#{room.to.asset.name}" /> 

					<aon:outputLabel value="#{bundle.aon_type}" />
					<aon:div>
						<aon:outputText value="#{room.to.item.product.code}" />
						<aon:outputText value=" - " />
						<aon:outputText value="#{room.to.item.product.name}" />
					</aon:div>
					
				</aon:panelGrid>
				
			</aon:div>
			
			<ui:include src="/com/esferalia/aon/ui/pms/facelet/roomBlock/grid_content.xhtml" >
				<ui:param name="controller" value="#{roomBlock}" />
			</ui:include>
			
		</aon:form>
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/roomBlock/modalBlock.xhtml">
			<ui:param name="controller" value="#{roomBlock}" />
			<ui:param name="modalReRender" value="roomBlockForm" />
		</ui:include>

	</ui:define>
</ui:composition>
