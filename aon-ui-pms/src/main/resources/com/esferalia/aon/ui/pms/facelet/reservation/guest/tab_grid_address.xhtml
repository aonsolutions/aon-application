<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="GuestAddressDiv#{suffix}" styleClass="aon-width-all">
		<aon:panelGrid columns="2" columnClasses="aon-italic,">
			<aon:outputLabel for="ProjectReservationGuest_address" value="#{bundle.aon_address}" />
			<aon:inputText id="ProjectReservationGuest_address#{suffix}" styleClass="aon-form-input-text"
				value="#{controller.to.address}" size="25" maxlength="256" ajaxSingle="true" />

			<aon:outputLabel for="ProjectReservationGuest_number" value="#{bundle.aon_number}" />
			<aon:div>
				<aon:inputText id="ProjectReservationGuest_number#{suffix}" styleClass="aon-form-input-text"
					value="#{controller.to.number}" size="3" maxlength="12" ajaxSingle="true" />
				<aon:outputLabel for="ProjectReservationGuest_address2" value="#{bundle.fiscal_streetFloor}" styleClass="aon-italic aon-margin-left" />
				<aon:inputText id="ProjectReservationGuest_address2#{suffix}" styleClass="aon-margin-left aon-form-input-text"
					value="#{controller.to.address2}" size="9" maxlength="25" ajaxSingle="true" />
			</aon:div>

			<aon:outputLabel for="ProjectReservationGuest_city" value="#{bundle.aon_city}" />
			<aon:inputText id="ProjectReservationGuest_city#{suffix}" styleClass="aon-form-input-text"
				value="#{controller.to.city}" size="25" maxlength="64" ajaxSingle="true" />

			<aon:outputLabel for="ProjectReservationGuest_zip" value="#{bundle.aon_postal_code_abbrv}" />
			<aon:inputText id="ProjectReservationGuest_zip#{suffix}" styleClass="aon-form-input-text"
				value="#{controller.to.zip}" size="25" maxlength="16" ajaxSingle="true" />

			<aon:outputLabel for="ProjectReservationGuest_country" value="#{bundle.aon_country}" />
			<aon:selectOneMenu id="ProjectReservationGuest_country#{suffix}" styleClass="aon-width-180 aon-form-input-text"
				value="#{controller.to.country}" ajaxSingle="true"
				reRender="GuestAddressDiv#{suffix}">
				<f:selectItems value="#{commonCollections.countries}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="ProjectReservationGuest_province" value="#{bundle.aon_state}" />
			<aon:inputText id="ProjectReservationGuest_province-Input#{suffix}" styleClass="aon-form-input-text"
				value="#{controller.to.province}" size="25" maxlength="64" ajaxSingle="true"
				rendered="#{controller.to.country != 'ES'}" />
			<aon:selectOneMenu id="ProjectReservationGuest_province-List#{suffix}" styleClass="aon-width-180 aon-form-input-text"
				value="#{controller.to.province}" ajaxSingle="true"
				rendered="#{controller.to.country == 'ES'}">
				<f:selectItem itemLabel="-" value="#{null}" />		
				<f:selectItems value="#{geozoneCollections.systemGeoTrees}" />
			</aon:selectOneMenu>
		</aon:panelGrid>
 	</aon:div>
</ui:composition>
