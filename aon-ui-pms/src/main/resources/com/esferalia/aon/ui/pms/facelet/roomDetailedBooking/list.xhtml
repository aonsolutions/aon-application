<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="roomDetailedBookingList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_room_detailed_booking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="roomDetailedBooking_search"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="roomDetailedBooking-excel-report"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						value="#{bundle.aon_listing}" action="#{roomDetailedBooking.onExcelReport}" target="_blank">
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic"
						rendered="#{!empty roomDetailedBooking.hotels}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{roomDetailedBooking.hotelNames}"
						rendered="#{!empty roomDetailedBooking.hotels}" />

					<aon:outputText value="#{bundle.report_agency}:" styleClass="aon-margin-left aon-italic"
						rendered="#{!empty roomDetailedBooking.agencies}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{roomDetailedBooking.agencyNames}"
						rendered="#{!empty roomDetailedBooking.agencies}" />
				</aon:panel>

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{roomDetailedBooking}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<f:facet name="header">
							<rich:columnGroup>
								<rich:column colspan="2">
									<aon:outputText value="&#160;" />
								</rich:column>

								<rich:column colspan="6">
									<aon:outputText value="#{bundle.aon_module_hotel}" />
								</rich:column>

								<c:forEach items="#{roomDetailedBooking.roomTypeList}" var="roomType" varStatus="roomTypeIdx" begin="0" step="1">
									<rich:column colspan="6">
										<aon:outputText value="#{roomType}"
											style="#{(roomTypeIdx.index >= roomDetailedBooking.hotelRoomTypesCount) ? ('color:red;') : ('color:blue')}" />
									</rich:column>
								</c:forEach>
							</rich:columnGroup>
						</f:facet>

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-200 aon-nowrap">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotel}" />
						</aon:column>	

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-70">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>	

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkin_abbrv}" />
							</f:facet>
							<aon:outputText value="#{to.roomCheckin}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkout_abbrv}" />
							</f:facet>
							<aon:outputText value="#{to.roomCheckout}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_occupation_abbrv}" />
							</f:facet>
							<aon:outputText value="#{to.roomBusy}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_free}" />
							</f:facet>
							<aon:outputText value="#{to.roomFree}"
								style="#{(to.roomFree &lt; 0) ? ('color: red;') : ('')}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_blocked_abbrv}" />
							</f:facet>
							<aon:outputText value="#{to.roomBlocked}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.roomTotal}" />
						</aon:column>				

						<c:forEach items="#{roomDetailedBooking.roomTypeList}" var="roomType" varStatus="roomTypeIdx" begin="0" step="1">
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{roomTypeIdx.odd ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="#{bundle.report_checkin_abbrv}" />
								</f:facet>
								<aon:outputText value="#{to.roomTypeBookingMap[roomType].roomCheckin}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{roomTypeIdx.odd ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="#{bundle.report_checkout_abbrv}" />
								</f:facet>
								<aon:outputText value="#{to.roomTypeBookingMap[roomType].roomCheckout}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{roomTypeIdx.odd ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="#{bundle.report_occupation_abbrv}" />
								</f:facet>
								<aon:outputText value="#{to.roomTypeBookingMap[roomType].roomBusy}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{roomTypeIdx.odd ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="#{bundle.report_free}" />
								</f:facet>
								<aon:outputText value="#{to.roomTypeBookingMap[roomType].roomFree}"
									style="#{(to.roomTypeBookingMap[roomType].roomFree &lt; 0) ? ('color: red;') : ('')}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{roomTypeIdx.odd ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="#{bundle.pms_blocked_abbrv}" />
								</f:facet>
								<aon:outputText value="#{to.roomTypeBookingMap[roomType].roomBlocked}" />
							</aon:column>

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{roomTypeIdx.odd ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_total}" />
								</f:facet>
								<aon:outputText value="#{to.roomTypeBookingMap[roomType].roomTotal}" />
							</aon:column>
						</c:forEach>

					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
