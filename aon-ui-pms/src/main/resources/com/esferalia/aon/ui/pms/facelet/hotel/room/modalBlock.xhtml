<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showRoomBlockWindow">
		<c:if test="#{controller.showRoomBlockWindow}">
			<rich:modalPanel id="roomBlockModalPanel" minHeight="320" minWidth="580" 
				rendered="#{controller.showRoomBlockWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{(controller.blockMode) ? (pmsBundle.pms_room_block) : (pmsBundle.pms_room_unblock)}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="aonContent" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showRoomBlockWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="roomBlockFrom">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="roomBlock-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{(controller.blockMode) ? (pmsBundle.pms_to_block) : (pmsBundle.pms_to_unblock)}"
										actionListener="#{controller.onBlockOrUnblockRooms}"
										onclick="Richfaces.showModalPanel('waitProccess')"
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="roomBlockModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showRoomBlockWindow}"
											value="#{false}" />
									</aon:commandButton>	
									<aon:commandButton id="roomBlock-back"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}" 
										reRender="aonContent" immediate="true">
										<f:setPropertyActionListener
											target="#{controller.showRoomBlockWindow}"
											value="#{false}" />
									</aon:commandButton>	
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid columns="2" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-120, aon-panelGrid-even aon-width-auto">

										<aon:outputLabel value="#{bundle.aon_date}" />
										<aon:div>
											<aon:outputLabel for="Room_blockFromDate" 
												styleClass="aon-margin-right aon-italic"
												value="#{bundle.aon_date_from}" />
											<aon:selectInputDate id="Room_blockFromDate" 
												value="#{controller.blockFromDate}" required="true"
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}" />
											<aon:outputLabel for="Room_blockToDate" 
												styleClass="aon-margin-right aon-italic"
												value="#{bundle.aon_date_to}" />
											<aon:selectInputDate id="Room_blockToDate" 
												value="#{controller.blockToDate}" required="true"
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}" />
										</aon:div>

										<c:if test="#{controller.blockMode}">
											<aon:outputLabel for="Room_blockStatus"
												value="#{bundle.aon_status}" />
											<aon:selectOneMenu id="Room_blockStatus" 
												value="#{controller.blockStatus}">
												<f:selectItems value="#{controller.blockStatuses}" />
											</aon:selectOneMenu>

											<aon:outputLabel for="Room_blockRemarks" 
												value="#{bundle.aon_remark}" />
											<aon:inputText id="Room_blockRemarks" 
												value="#{controller.blockRemarks}" 
												size="52" maxlength="40" required="true"/>
										</c:if>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
