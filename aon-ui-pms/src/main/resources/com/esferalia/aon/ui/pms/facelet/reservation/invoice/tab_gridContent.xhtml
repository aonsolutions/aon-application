<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:column styleClass="aon-editDataTable-dateColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.issueDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-130">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_invoice_number}" />
		</f:facet>
		<aon:outputText value="#{to.referenceCode}" />
	</aon:column>

	<aon:if test="#{showReservation}">
		<aon:column styleClass="aon-editDataTable-dateColumn aon-width-80">
			<f:facet name="header">
				<aon:outputText value="#{bundle.report_id}" />
			</f:facet>
			<aon:outputText value="#{to.project.id}" />
		</aon:column>
	</aon:if>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_customer}" />
		</f:facet>
		<aon:outputText value="#{to.registryName}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_company_document}" />
		</f:facet>
		<aon:outputText value="#{to.registryDocument}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_source}" />
		</f:facet>
		<aon:outputText value="#{bundle.aon_reservation}" rendered="#{!to.service and !to.advance}" />
		<aon:outputText value="#{bundle.finance_service}" rendered="#{to.service}" />
		<aon:outputText value="#{bundle.finance_money_advance}" rendered="#{to.advance}" />
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_type}" />
		</f:facet>
		<aon:outputText value="#{bundle.finance_invoice}"
			rendered="#{!to.rectifier and !to.rectified}" />
		<aon:div rendered="#{to.rectifier}">
			<aon:outputText value="#{to.rectificationType}" />
			<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250">
				<aon:outputFormat value="#{bundle.finance_invoice_rectifier_message2}" styleClass="aon-bold aon-label-error">
					<f:param value="#{to.rectificationInvoice.referenceCode}" />
				</aon:outputFormat>
			</rich:toolTip>
		</aon:div>
		<aon:div rendered="#{to.rectified}">
			<aon:outputText value="#{to.rectificationType}" />
			<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250">
				<aon:outputFormat value="#{bundle.finance_invoice_rectified_message2}" styleClass="aon-bold">
					<f:param value="#{to.rectificationInvoicesString}" />
				</aon:outputFormat>
			</rich:toolTip>
		</aon:div>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-130">
		<f:facet name="header">
			<aon:outputText value="#{bundle.finance_payMethod}" />
		</f:facet>
		<aon:outputText value="#{to.payMethod}">
			<aon:abbreviateConverter maxWidth="15" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_total}" />
		</f:facet>
		<aon:outputText value="#{to.total}">
			<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
		</aon:outputText>
	</aon:column>

	<aon:column	styleClass="aon-editDataTable-textColumn aon-width-80 aon-vertical-align-top">
		<f:facet name="header">
			<aon:outputText value="&#160;" />
		</f:facet>
		<aon:if test="#{!skipRectifyButton}">
			<aon:commandButton id="reservationInvoice-rectify"
				styleClass="aon-icon-removed aon-noborder"
				value="&#160;" title="#{bundle.pms_to_return_label}"
				rendered="#{controller.invoiceRectificable}"
				actionListener="#{controller.onRectifyInvoiceShow}"
				reRender="showRectificationWindow">
				<f:setPropertyActionListener target="#{controller.showRectificationWindow}"
					value="#{true}" />
			</aon:commandButton>
			<aon:commandButton id="reservationInvoice-modify"
				styleClass="aon-icon-edit aon-noborder"
				value="&#160;" title="#{bundle.pms_to_modify_invoice_label}"
				rendered="#{to.noRectification and (to.service or reservation.to.guestHolder)}"
				actionListener="#{controller.onModifyInvoiceShow}"
				reRender="showModificationWindow">
				<f:setPropertyActionListener target="#{controller.showModificationWindow}"
					value="#{true}" />
			</aon:commandButton>
		</aon:if>
		<aon:if test="#{showInvoiceLink and aonRole.financeOperator}">
			<aon:commandLink id="reservationInvoice-link" immediate="true"
				styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
				value="&#160;" title="#{bundle.aon_go}"
				actionListener="#{controller.onLoadInvoice}"
				action="saleInvoice_form" />
		</aon:if>
		<aon:if test="#{!showInvoiceLink or !aonRole.financeOperator or aonRole.guest}">
			<aon:htmlCommandLink id="reservationInvoice-report" target="_blank"
				styleClass="aon-icon-pdf"
				value="&#160;&#160;&#160;&#160;&#160;&#160;" 
				title="#{bundle.aon_report}"
				actionListener="#{controller.onPrintInvoice}"
				action="#{saleInvoiceSigner.onReport}">
				<aon:actionListener method="#{printParams.onInit}" />
				<f:param name="reportKey" value="#{printParams.saleInvoiceParams.saleInvoiceTemplateValue}" />
				<f:setPropertyActionListener target="#{saleInvoiceSigner.reportKey}"
					value="#{printParams.saleInvoiceParams.saleInvoiceTemplateValue}" />
			</aon:htmlCommandLink>
		</aon:if>
	</aon:column>

</ui:composition>
