<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="skipResetButton" value="#{!reservationRequest.to.active or controller.model.rowCount > 0}" />
		<ui:param name="skipLineEdition" value="#{!reservationRequest.to.active}" />

		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-20">
				<f:facet name="header">
					<aon:outputLabel for="ReservationRequestGuest_guestIndex" value="#{bundle.aon_order}" />
				</f:facet>
				<aon:outputText id="ReservationRequestGuest_guestIndex" value="#{to.guestIndex}" 
					rendered="#{formList or formEdit}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top">
				<f:facet name="header">
					<aon:outputLabel value="#{pmsBundle.pms_guest}" />
				</f:facet>
				<aon:outputText value="#{to.fullName}" rendered="#{formList}" />
				<aon:div rendered="#{formEdit}">
					<ui:include src="tab_grid_name.xhtml">
						<ui:param name="suffix" value="" />
					</ui:include>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{formNew}">
						<ui:include src="tab_grid_name.xhtml">
							<ui:param name="suffix" value="-New" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-250 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_contact_data}" />
				</f:facet>
				<aon:outputText value="t:" rendered="#{formList and !empty to.phone}" />
				<aon:outputText styleClass="aon-margin-right" value="#{to.phone}" rendered="#{formList and !empty to.phone}" />
				<aon:outputText value="e:" rendered="#{formList and !empty to.email}" />
				<aon:outputText value="#{to.email}" rendered="#{formList}">
					<aon:abbreviateConverter maxWidth="25" />
				</aon:outputText>
				<rich:toolTip rendered="#{formList and !empty to.email}">
					<aon:outputText value="#{to.email}" />
				</rich:toolTip>
				<aon:div rendered="#{formEdit}">
					<ui:include src="tab_grid_contact.xhtml">
						<ui:param name="suffix" value="" />
					</ui:include>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{formNew}">
						<ui:include src="tab_grid_contact.xhtml">
							<ui:param name="suffix" value="-New" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-350 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_address}" />
				</f:facet>
				<aon:outputText value="#{to.fullAddress}" rendered="#{formList}">
					<aon:abbreviateConverter maxWidth="50" />
				</aon:outputText>
				<rich:toolTip rendered="#{formList and !empty to.fullAddress}">
					<aon:outputText value="#{to.fullAddress}" />
				</rich:toolTip>
				<aon:div rendered="#{formEdit}">
					<ui:include src="tab_grid_address.xhtml">
						<ui:param name="suffix" value="" />
					</ui:include>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{formNew}">
						<ui:include src="tab_grid_address.xhtml">
							<ui:param name="suffix" value="-New" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
