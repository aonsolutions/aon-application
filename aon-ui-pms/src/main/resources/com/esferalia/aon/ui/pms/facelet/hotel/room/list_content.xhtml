<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<c:if test="#{aonRole.admin}">
		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="S" />
			</f:facet>
			<aon:commandLink id="#{dataTableId}-selectButton" 
				styleClass="#{(to.active) ? ('aon-icon-point-green') : ('aon-icon-point-red')}"
				value="&#160;&#160;&#160;&#160;"
				title="#{(to.active) ? (bundle.aon_active) : (bundle.aon_inactive)}" 
				immediate="true" ajaxSingle="true" requestDelay="100"
				action="#{rowSelectorAction}"
				actionListener="#{rowSelectorActionListener}"
				onkeyup="#{dataTableId}KeyUp(this)"
				onfocus="disableRowSelector();#{dataTableId}SelectRow(this)"
				onblur="enableRowSelector();#{dataTableId}DeselectRow(this)"
				onmouseover="disableRowSelector();"
				onmouseout="enableRowSelector();"				
				focus="#{(focusOnSelect != null)?(focusOnSelect):''}"
				reRender="#{rowSelectorReRender}" >
			</aon:commandLink>
			<f:facet name="footer">
				<ui:insert name="selectFooterContent"/>
			</f:facet>
		</aon:column>
	</c:if>

	<aon:column styleClass="aon-editDataTable-iconColumn">
		<f:facet name="header">
			<aon:outputText value="#{controller.checkedCount}" />
		</f:facet>
		<aon:selectBooleanCheckbox id="RoomCheck"
			value="#{controller.rowChecked}"
			valueChangeListener="#{controller.rowSelected}"
			reRender="aonContent" />	
	</aon:column>

	<aon:column alias="Room.asset.name">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_number}" />
		</f:facet>
		<aon:outputText value="#{to.asset.name}" />
	</aon:column>

	<aon:column alias="Room.hotel.workPlace.description">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_module_hotel}" />
		</f:facet>
		<aon:outputText value="#{to.hotel.workPlace.description}" />
	</aon:column>

	<aon:column alias="Room.item.product.code">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_type}" />
		</f:facet>
		<aon:div>
			<aon:outputText value="#{to.item.product.code}" />
			<aon:outputText value=" - " />
			<aon:outputText value="#{to.item.product.name}" />
		</aon:div>
	</aon:column>

	<aon:column alias="Room.active">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status}" />
		</f:facet>
		<aon:outputText value="#{bundle.aon_active}" rendered="#{to.active}" />
		<aon:outputText value="#{bundle.aon_inactive}" rendered="#{!to.active}" />
	</aon:column>

</ui:composition>
