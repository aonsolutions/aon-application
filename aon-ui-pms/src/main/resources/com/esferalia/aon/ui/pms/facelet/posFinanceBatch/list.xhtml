<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posFinanceList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_posFinanceBatch_module}" />
				<ui:param name="controller" value="#{posFinanceBatch}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>
 

			<aon:div styleClass="aon-scroll-area">
			
				<aon:div styleClass="aon-toolbar" rendered="#{posFinanceBatch.model.rowCount > 0}">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						ajaxSingle="true"
						actionListener="#{posFinanceBatch.checkAll}" reRender="posFinanceList"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						ajaxSingle="true"
						actionListener="#{posFinanceBatch.checkNone}" reRender="posFinanceList"
						onclick="Richfaces.showModalPanel('waitProccess')"
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
			     	<aon:commandButton title="#{financeBundle.finance_add_batch}"
						styleClass="aon-finding-toolbar-item aon-icon-newFolder"
						value="#{financeBundle.finance_add_batch}"
						rendered="#{not empty posFinanceBatch.checkedFinances}"
						actionListener="#{posFinanceBatch.onCompleteBatch}" reRender="financeDataDiv,showFinanceBatchWindow"
						/>
						
				</aon:div>
			
				<aon:div id="financeDataDiv">
					<aon:dataTable id="financeData" value="#{posFinanceBatch.model}"
						var="to" rows="20" rendered="#{posFinanceBatch.model.rowCount > 0}"
						columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
							aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
							aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn,
							aon-editDataTable-textColumn aon-width-40">
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:selectBooleanCheckbox id="Included_Row_checked"
								value="#{posFinanceBatch.rowChecked}"
								reRender="posFinanceList"
								valueChangeListener="#{posFinanceBatch.rowSelected}" />	
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{financeBundle.finance_finance_date}" />
							</f:facet>
							<aon:outputText value="#{to.dueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
				
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{financeBundle.finance_invoice_document_number}" />
							</f:facet>
							<aon:outputText styleClass="aon-nowrap" 
								value="#{to.documentNumber}" />
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{financeBundle.finance_debtor}" />
							</f:facet>
							<aon:outputText value="#{to.registryName}" />
						</aon:column>
				
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{configBundle.config_pay_method}" />
							</f:facet>
							<aon:outputText value="#{to.payMethod.name}" />
						</aon:column>
				
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{configBundle.config_bank_account}" />
							</f:facet>
							<aon:outputText value="#{to.bankAccount}"/>
						</aon:column>
				
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.financeStatus}"/>
							<f:facet name="footer">
								<aon:outputText value="#{bundle.aon_total}(#{pmsBundle.pms_selected})" />
							</f:facet>
						</aon:column>
				
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{to.totalAmount}" >
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div style="float:right">
									<aon:outputText style="text-align:right" value="#{posFinanceBatch.selectedAmount}" >
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>

							</aon:div>
						</aon:column>
			
					</aon:dataTable>
					
					<aon:dataScroller2 for="financeData" showNote="true" />
				</aon:div>
				
			</aon:div>

		</aon:form>
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/posFinanceBatch/batchModal.xhtml" >
			<ui:param name="modalReRender" value="posFinanceList" />
		</ui:include>
		
	</ui:define>
</ui:composition>
