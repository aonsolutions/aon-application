<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="allotmentBooking">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_allotment_booking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="allotmentBooking_search"
						actionListener="#{allotmentBooking.onInit}"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="allotmentBooking-excel-report"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						value="#{bundle.aon_listing}" action="#{allotmentBooking.onExcelReport}" target="_blank">
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{(allotmentBooking.hotel!=null and allotmentBooking.hotel.id!=null) ? (allotmentBooking.hotel.workPlace.description) : ('-')}" />

					<aon:outputText value="#{bundle.report_agency}:" styleClass="aon-margin-left aon-italic"/>
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{(allotmentBooking.agency!=null and allotmentBooking.agency.id!=null) ? (allotmentBooking.agency.registry.fullName) : ('-')}" />

					<aon:outputText value="#{bundle.aon_group}:" styleClass="aon-margin-left aon-italic"/>
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{(allotmentBooking.agencyGroup!=null and allotmentBooking.agencyGroup.id!=null) ? (allotmentBooking.agencyGroup.description) : ('-')}" />
				</aon:panel>

				<aon:dataTable id="allotmentBookingData" value="#{allotmentBooking.model}" 
					rendered="#{allotmentBooking.model!=null and allotmentBooking.model.rowCount > 0}" rows="20" var="to">

						<f:facet name="header">
							<rich:columnGroup>
								<rich:column colspan="2">
									<aon:outputText value="&#160;" />
								</rich:column>

								<rich:column colspan="4">
									<aon:outputText value="Real" />
								</rich:column>

								<rich:column colspan="4">
									<aon:outputText value="Potencial" />
								</rich:column>

								<c:forEach items="#{allotmentBooking.agencies}" var="agency">
									<rich:column colspan="3">
										<aon:outputText style="color:blue; font-size:0.8em;"
											value="#{agency}">
											<aon:abbreviateConverter maxWidth="25" />
										</aon:outputText>
									</rich:column>
								</c:forEach>
							</rich:columnGroup>
						</f:facet>

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-200 aon-nowrap">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotel}" />
						</aon:column>	

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-70">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>	

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="Ocup." />
							</f:facet>
							<aon:outputText value="#{to.roomBusy}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_free}" />
							</f:facet>
							<aon:outputText value="#{to.roomFree}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="Bloq." />
							</f:facet>
							<aon:outputText value="#{to.roomBlocked}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.roomTotal}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
							<f:facet name="header">
								<aon:outputText value="Cupo" />
							</f:facet>
							<aon:outputText value="#{to.roomAllotment}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
							<f:facet name="header">
								<aon:outputText value="Disp." />
							</f:facet>
							<aon:outputText value="#{to.roomAvailable}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
							<f:facet name="header">
								<aon:outputText value="Ocup." />
							</f:facet>
							<aon:outputText value="#{to.roomBusyPotential}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
							<f:facet name="header">
								<aon:outputText value="Libre" />
							</f:facet>
							<aon:outputText style="#{(to.roomFreePotential >= 0) ? ('') : ('color:red;')}"
								value="#{to.roomFreePotential}" />
						</aon:column>				

						<c:forEach items="#{allotmentBooking.agencies}" var="agency" varStatus="agencyIdx" begin="0" step="1">
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{agencyIdx.even ? 'background-color:#f2f2f2;' : ''}">
 								<f:facet name="header">
									<aon:outputText value="Cupo" />
								</f:facet>
								<aon:outputText value="#{to.agencyBookingMap[agency].roomAllotment}" />
							</aon:column>				

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{agencyIdx.even ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="Ocup." />
								</f:facet>
								<aon:outputText value="#{to.agencyBookingMap[agency].roomBusy}"
									style="#{(to.agencyBookingMap[agency].roomAllotment > to.agencyBookingMap[agency].roomBusy) ? ('') : ('color:forestgreen;')}"
									 />
							</aon:column>				

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{agencyIdx.even ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="Disp." />
								</f:facet>
								<aon:outputText value="#{to.agencyBookingMap[agency].roomAvailable}"
									style="#{(to.roomFreePotential >= 0 or to.agencyBookingMap[agency].roomAvailable == 0) ? ('') : ('color:red;')}" />
							</aon:column>				
						</c:forEach>

				</aon:dataTable>

				<aon:dataScroller2 for="allotmentBookingData" showNote="true" />

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
