<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="allotmentBookingList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_allotment_booking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="allotmentBooking_search"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="allotmentBooking-excel-report"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						value="#{bundle.aon_listing}" action="#{allotmentBooking.onExcelReport}" target="_blank">
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic"
						rendered="#{!empty allotmentBooking.hotels}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{allotmentBooking.hotelNames}"
						rendered="#{!empty allotmentBooking.hotels}" />

					<aon:outputText value="#{bundle.report_agency}:" styleClass="aon-margin-left aon-italic"
						rendered="#{!empty allotmentBooking.agencies}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{allotmentBooking.agencyNames}"
						rendered="#{!empty allotmentBooking.agencies}" />

					<aon:outputText value="#{bundle.aon_group}:" styleClass="aon-margin-left aon-italic"
						rendered="#{!empty allotmentBooking.agencyGroups}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{allotmentBooking.agencyGroupNames}" 
						rendered="#{!empty allotmentBooking.agencyGroups}" />
				</aon:panel>

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{allotmentBooking}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<f:facet name="header">
							<rich:columnGroup>
								<rich:column colspan="2">
									<aon:outputText value="&#160;" />
								</rich:column>

								<rich:column colspan="4">
									<aon:outputText value="#{bundle.aon_real}" />
								</rich:column>

								<rich:column colspan="4">
									<aon:outputText value="#{bundle.aon_potential}" />
								</rich:column>

								<c:forEach items="#{allotmentBooking.holderList}" var="holder">
									<rich:column colspan="#{allotmentBooking.holderBreakdownMap[holder].breakdownsSize}">
										<aon:outputText style="color:blue; font-size:0.8em;"
											value="#{holder}">
											<aon:abbreviateConverter maxWidth="25" />
										</aon:outputText>
									</rich:column>
								</c:forEach>
							</rich:columnGroup>
						</f:facet>

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-200 aon-nowrap">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotel}" />
						</aon:column>	

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-70">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>	

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_occupation_abbrv}" />
							</f:facet>
							<aon:outputText value="#{to.roomBusy}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_free}" />
							</f:facet>
							<aon:outputText value="#{to.roomFree}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_blocked_abbrv}" />
							</f:facet>
							<aon:outputText value="#{to.roomBlocked}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.roomTotal}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_allotment}" />
							</f:facet>
							<aon:outputText value="#{to.roomAllotment}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_availability_abbrv}" />
							</f:facet>
							<aon:outputText value="#{to.roomAvailable}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_occupation_abbrv}" />
							</f:facet>
							<aon:outputText value="#{to.roomBusyPotential}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_free}" />
							</f:facet>
							<aon:outputText style="#{(to.roomFreePotential >= 0) ? ('') : ('color:red;')}"
								value="#{to.roomFreePotential}" />
						</aon:column>				

						<c:forEach items="#{allotmentBooking.holderList}" var="holder" varStatus="holderIdx" begin="0" step="1">
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{holderIdx.even ? 'background-color:#f2f2f2;' : ''}">
 								<f:facet name="header">
									<aon:outputText value="#{bundle.pms_allotment}" />
								</f:facet>
								<aon:outputText value="#{to.holderBookingMap[holder].roomAllotment}" />
							</aon:column>				

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{holderIdx.even ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="#{bundle.report_occupation_abbrv}" />
								</f:facet>
								<aon:outputText value="#{to.holderBookingMap[holder].roomBusy}"
									style="#{(to.holderBookingMap[holder].roomAllotment > to.holderBookingMap[holder].roomBusy) ? ('') : ('color:forestgreen;')}" />
							</aon:column>				

							<aon:if test="#{allotmentBooking.breakdownType != null}">
								<c:forEach items="#{allotmentBooking.holderBreakdownMap[holder].breakdowns}" var="holderBreakdown" begin="0" step="1">
									<aon:column styleClass="aon-editDataTable-numberColumn aon-width-10"
										style="#{holderIdx.even ? 'background-color:#f2f2f2;' : ''}">
										<f:facet name="header">
											<aon:outputText style="color:slateblue; font-size:0.9em;"
												value="#{holderBreakdown}" />
										</f:facet>
										<aon:outputText style="color:slateblue; font-size:0.9em;"
											value="#{to.holderBookingMap[holder].occupationBreakdownMap[holderBreakdown]}" />
									</aon:column>
								</c:forEach>
							</aon:if>

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{holderIdx.even ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="#{bundle.pms_availability_abbrv}" />
								</f:facet>
								<aon:outputText value="#{to.holderBookingMap[holder].roomAvailable}"
									style="#{(to.roomFreePotential >= 0 or to.holderBookingMap[holder].roomAvailable == 0) ? ('') : ('color:red;')}" />
							</aon:column>				

						</c:forEach>

					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
