<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

						
	<c:if test="#{pmsCollections.currentUserHotelsCount > 1}">
		<aon:outputLabel value="#{pmsBundle.pms_hotel}" />
		<aon:selectOneMenu id="Room_hotel"
			value="#{roomSearch.hotel}" >
			<f:selectItems value="#{pmsCollections.currentUserHotels}" />
		</aon:selectOneMenu>
	</c:if>
	
	<aon:outputLabel value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="Room_item"
		value="#{roomSearch.item}" >
		<f:selectItem itemLabel=" - " itemValue="#{null}" />
		<f:selectItems value="#{pmsCollections.roomItems}" />
	</aon:selectOneMenu>
		
	<aon:outputLabel value="#{bundle.aon_number}" />
	<aon:inputText id="Room_asset_name" size="5"
		valueChangeListener="#{room.addExpression}" />
						
</ui:composition>
