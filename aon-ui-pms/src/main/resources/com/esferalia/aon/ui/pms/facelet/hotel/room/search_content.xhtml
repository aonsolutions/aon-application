<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:if test="#{pmsCollections.currentUserHotelsCount > 1}">
		<aon:outputLabel value="#{bundle.aon_module_hotel}" />
		<aon:selectOneMenu id="Room_hotel"
			value="#{roomSearch.hotel}" >
			<f:selectItems value="#{pmsCollections.currentUserHotels}" />
			<a4j:support event="onchange" reRender="Room_item" ignoreDupResponses="true" />
			<a4j:support event="oninputchanged" reRender="Room_item" ignoreDupResponses="true" />	
		</aon:selectOneMenu>
	</aon:if>

	<aon:outputLabel value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="Room_item"
		value="#{roomSearch.item}" >
		<f:selectItem itemLabel=" - " itemValue="#{null}" />
		<f:selectItems value="#{roomSearch.hotelRoomItems}" />
	</aon:selectOneMenu>

	<aon:outputLabel value="#{bundle.aon_number}" />
	<aon:inputText id="Room_asset_name" size="5"
		valueChangeListener="#{room.addExpression}" />

	<aon:outputLabel value="#{bundle.aon_status}" />
	<aon:selectOneRadio id="Rooom_active"
		value="#{roomSearch.active}">
		<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="#{true}" />
		<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="#{false}" />
		<f:selectItem itemLabel="#{bundle.aon_indifferent}" itemValue="#{null}" />
	</aon:selectOneRadio>				

</ui:composition>
