<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_allotment_module}" />
				<ui:param name="controller" value="#{allotment}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{allotment}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<aon:commandLink id="#{dataTableId}-selectButton" 
								styleClass="#{(to.active) ? ('aon-icon-point-green') : ('aon-icon-point-red')}" 
								value="&#160;&#160;&#160;&#160;"
								title="#{(to.active) ? (bundle.aon_active) : (bundle.aon_inactive)}" 
								immediate="true" ajaxSingle="true" requestDelay="100"
								action="#{rowSelectorAction}"
								actionListener="#{rowSelectorActionListener}"
								onkeyup="#{dataTableId}KeyUp(this)"
								onfocus="disableRowSelector();#{dataTableId}SelectRow(this)"
								onblur="enableRowSelector();#{dataTableId}DeselectRow(this)"
								onmouseover="disableRowSelector();"
								onmouseout="enableRowSelector();"				
								focus="#{(focusOnSelect != null)?(focusOnSelect):''}"
								reRender="#{rowSelectorReRender}" >
							</aon:commandLink>
							<f:facet name="footer">
								<ui:insert name="selectFooterContent"/>
							</f:facet>
						</aon:column>

						<aon:column alias="Allotment.hotel.workPlace.description"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotel.workPlace.description}" />
						</aon:column>

						<aon:column alias="Allotment.rateCode"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.rateCode}" />
						</aon:column>

						<aon:column alias="Allotment.agency&lt;registry&lt;name,Allotment.agencyGroup&lt;description"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_agency} / #{bundle.aon_group}" />
							</f:facet>
							<aon:outputText value="#{to.group ? to.agencyGroup.description : to.agency.registry.fullName}" />
							<aon:outputText styleClass="aon-margin-left aon-icon-group"
								value="&#160;&#160;&#160;&#160;"
								rendered="#{to.group}" />
						</aon:column>

						<aon:column alias="Allotment.startDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_start_date}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Allotment.endDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_end_date}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Allotment.quantity"
							styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_allotment}" />
							</f:facet>
							<aon:outputText value="#{to.quantity}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_rooms}" />
							</f:facet>
							<aon:outputText value="#{to.roomTypeCodes}">
								<aon:abbreviateConverter maxWidth="20" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.product_tariff_module2}" />
							</f:facet>
							<aon:outputText value="#{to.tariffCodes}">
								<aon:abbreviateConverter maxWidth="20" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Allotment.active"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{(to.active) ? (bundle.aon_active) : (bundle.aon_inactive)}" />

						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
