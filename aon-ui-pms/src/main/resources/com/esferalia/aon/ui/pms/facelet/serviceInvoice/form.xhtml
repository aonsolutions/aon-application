<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="serviceInvoiceForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_service_invoice_module}" />
				<ui:param name="controller" value="#{serviceInvoice}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipSaveButton" value="#{true}" />
				<ui:param name="skipCancelButton" value="#{true}" />
				<ui:param name="skipRemoveButton" value="#{true}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="service-invoice"
						value="#{bundle.aon_key_invoice_description}"
						styleClass="aon-finding-toolbar-item aon-icon-favorite"
						actionListener="#{serviceInvoice.onInvoice}"
						action="serviceInvoice_list" />
					<aon:commandButton id="service-cancel"
						title="#{bundle.aon_key_cancel_accelerator}"
						value="#{bundle.aon_cancel}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						action="serviceInvoice_list"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:include src="/com/esferalia/aon/ui/pms/facelet/serviceInvoice/formContent.xhtml">
					<ui:param name="controller" value="#{serviceInvoice}" />
					<ui:param name="service" value="#{true}" />
				</ui:include>
 			</aon:div>

		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{reservationLookup}" />

	</ui:define>
</ui:composition>
