<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="emptyRoomList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_emptyRoom_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="emptyRoom_search"
						actionListener="#{emptyRoom.onInit}"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="emptyRoom-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="emptyRoomList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="emptyRoom-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="emptyRoomList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panel>
					<aon:panelGrid columns="4" 
						columnClasses="aon-panelGrid-even aon-noborder, 
						aon-panelGrid-even aon-noborder">
						<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic aon-bold" />
						<aon:outputText value="#{emptyRoom.hotel.workPlace.description}" />
						
						<aon:outputText value="#{bundle.aon_date}:" styleClass="aon-italic aon-bold" />
						<aon:outputText value="#{emptyRoom.date}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:panelGrid>
				</aon:panel>
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{emptyRoom}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

 						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_room}" />
							</f:facet>
							<aon:outputText value="#{to.room.asset.name}" />
						</aon:column>
 
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{(to.free)?(bundle.report_free):(bundle.pms_blocked)}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
								
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
