<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showAllotmentFractionWindow">
		<aon:if test="#{controller.showAllotmentFractionWindow}">
			<rich:modalPanel id="allotmentFractionModalPanel" minHeight="200"
				minWidth="450" rendered="#{controller.showAllotmentFractionWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText 
							value="#{bundle.finance_to_fraction}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showAllotmentFractionWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showAllotmentFractionWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="allotmentFractionForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="allotmentFraction-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{controller.onAllotmentFraction}"
										onclick="Richfaces.showModalPanel('waitProccess')" 
							     		oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<aon:actionHotKey key="return" />
										<rich:componentControl for="allotmentFractionModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showAllotmentFractionWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="allotmentFraction-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_cancel}">
										<f:setPropertyActionListener
											target="#{controller.showAllotmentFractionWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

										<aon:outputLabel for="AllotmentFraction_startDate" value="#{bundle.aon_start_date}" />
										<aon:selectInputDate id="AllotmentFraction_startDate" value="#{controller.allotmentAux.startDate}" 
											required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}" />

										<aon:outputLabel for="AllotmentFraction_endDate" value="#{bundle.aon_end_date}" />
										<aon:selectInputDate id="AllotmentFraction_endDate" value="#{controller.allotmentAux.endDate}" 
											required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}" />

										<aon:outputLabel for="AllotmentFraction_quantity" value="#{bundle.pms_allotment}" />
										<aon:inputText id="AllotmentFraction_quantity" value="#{controller.allotmentAux.quantity}"
											size="3" maxlength="4" required="true"
											ajaxSingle="true" />

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
