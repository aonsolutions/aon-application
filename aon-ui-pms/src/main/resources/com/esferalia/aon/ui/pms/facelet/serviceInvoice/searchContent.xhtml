<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="serviceInvoiceSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" />

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">

					<aon:outputText value="" />
					<aon:div style="width:600px;">

						<aon:panelCollapsible expanded="true" label="#{financeBundle.finance_invoice}">
							<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">

								<aon:outputLabel for="Invoice_referenceCode"
									value="#{bundle.aon_invoice_number}" />
								<aon:inputText id="Invoice_referenceCode"
									valueChangeListener="#{controller.addExpression}"
									size="25" maxlength="25" />

								<aon:outputLabel value="#{bundle.aon_date}" />
								<aon:div>
									<aon:outputLabel for="Invoice_issueDate-From" styleClass="aon-form-date-label aon-padding-right" 
										value="#{bundle.aon_date_from}:" />
									<aon:selectInputDate id="Invoice_issueDate-From"
										valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}" />
						
									<aon:outputLabel for="Invoice_issueDate-To" styleClass="aon-form-date-label aon-padding-right" 
										value="#{bundle.aon_date_to}:" />
									<aon:selectInputDate id="Invoice_issueDate-To"
										valueChangeListener="#{controller.addLessThanOrEqualExpression}"
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}" />
								</aon:div>

								<aon:outputLabel for="Invoice_registryName"
									value="#{bundle.aon_customer}" />
								<aon:inputText id="Invoice_registryName" size="60"
									valueChangeListener="#{controller.addExpression}" />

								<aon:outputLabel for="Invoice_project_id"
									value="#{pmsBundle.pms_reservation_id}" />
								<aon:inputText id="Invoice_project_id" size="25"
									valueChangeListener="#{controller.addExpression}" />
		
							</aon:panelGrid>
						</aon:panelCollapsible>					

					</aon:div>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
