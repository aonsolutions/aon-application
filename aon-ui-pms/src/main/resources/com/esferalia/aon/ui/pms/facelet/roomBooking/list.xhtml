<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="roomBooking">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.report_booking_list}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="roomBooking_search"
						actionListener="#{roomBooking.onInit}"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="roomBooking-excel-report"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						value="&#160;" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="roomBooking" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="roomBooking_report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_listing}" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="roomBooking" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{(roomBooking.hotel!=null and roomBooking.hotel.id!=null) ? (roomBooking.hotel.workPlace.description) : ('-')}" />

					<aon:outputText value="#{bundle.report_agency}:" styleClass="aon-margin-left aon-italic"/>
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{(roomBooking.agency!=null and roomBooking.agency.id!=null) ? (roomBooking.agency.registry.fullName) : ('-')}" />

					<aon:outputText value="#{bundle.pms_room_type}:" styleClass="aon-margin-left aon-italic"/>
					<aon:div style="display: inline;">
						<aon:outputText styleClass="aon-margin-left aon-bold"
							value="#{roomBooking.item.product.code} - #{roomBooking.item.product.name}"
							rendered="#{(roomBooking.item!=null and roomBooking.item.id!=null)}" />
						<aon:outputText styleClass="aon-margin-left aon-bold"
							value="-"
							rendered="#{roomBooking.item==null or roomBooking.item.id==null}" />
					</aon:div>
				</aon:panel>

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{roomBooking}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<f:facet name="header">
							<rich:columnGroup>
								<rich:column colspan="2">
									<aon:outputText value="&#160;" />
								</rich:column>
								
								<rich:column colspan="6">
									<aon:outputText value="#{bundle.report_rooms}" />
								</rich:column>
								
								<rich:column colspan="3">
									<aon:outputText value="#{bundle.pms_guests}" />
								</rich:column>
							</rich:columnGroup>
						</f:facet>
	
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotel}" />
						</aon:column>	
	
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>	
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkin}" />
							</f:facet>
							<aon:outputText value="#{to.roomCheckin}" />
						</aon:column>				
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkout}" />
							</f:facet>
							<aon:outputText value="#{to.roomCheckout}" />
						</aon:column>				
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_occupation}" />
							</f:facet>
							<aon:outputText value="#{to.roomBusy}" />
						</aon:column>				
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_free}" />
							</f:facet>
							<aon:outputText value="#{to.roomFree}" />
						</aon:column>				
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_blocked}" />
							</f:facet>
							<aon:outputText value="#{to.roomBlocked}" />
						</aon:column>				
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.roomTotal}" />
						</aon:column>				
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkin}" />
							</f:facet>
							<aon:outputText value="#{to.guestCheckin}" />
						</aon:column>				
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkout}" />
							</f:facet>
							<aon:outputText value="#{to.guestCheckout}" />
						</aon:column>				
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.guestTotal}" />
						</aon:column>				

					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
