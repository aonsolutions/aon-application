<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="hotelSearch">

			<aon:valueParam name="currentUserScopes" default="#{configCollections.currentUserScopes}" />

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_hotel_module}" />
				<ui:param name="controller" value="#{hotel}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{hotel}" />
				<ui:define name="searchContent">

						<aon:outputLabel for="Hotel_code"
							value="#{bundle.aon_id}" />
						<aon:inputText id="Hotel_code" size="20"
							valueChangeListener="#{controller.addExpression}" />
	
						<aon:outputLabel for="Hotel_workPlace_description"
							value="#{bundle.aon_name}" />
						<aon:inputText id="Hotel_workPlace_description" size="60"
							valueChangeListener="#{controller.addExpression}" />

						<aon:if test="#{companyCollections.currentUserEnterprisesCount > 1}">
							<aon:outputLabel for="Hotel_workPlace_enterprise_id" 
								value="#{bundle.aon_company}" />
							<aon:selectOneMenu id="Hotel_workPlace_enterprise_id"
								value="#{companyCollections.enterprise}"
								valueChangeListener="#{controller.addIdEqualExpression}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{companyCollections.currentUserEnterprises}" />
							</aon:selectOneMenu>
						</aon:if>

						<aon:outputLabel for="Hotel_active"				
							value="#{bundle.aon_status}"/>
						<aon:selectOneMenu id="Hotel_active"
							valueChangeListener="#{controller.addExpression}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="#{true}"/>
							<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="#{false}"/>
						</aon:selectOneMenu>
					
						<aon:if test="#{currentUserScopes[1] != null}">
							<aon:outputLabel for="Hotel_scope_id"
								value="#{bundle.aon_scope}" />
							<aon:selectOneMenu id="Hotel_scope_id"
								value="#{configCollections.scope}"
								valueChangeListener="#{controller.addIdEqualExpression}">
								<f:selectItem itemLabel="-" value="#{null}"/> 
								<f:selectItems value="#{currentUserScopes}" />
							</aon:selectOneMenu>
						</aon:if>

						<aon:outputLabel for="Hotel_workPlace_address_address"
							value="#{bundle.aon_address}" />
						<aon:inputText id="Hotel_workPlace_address_address" size="60"
							valueChangeListener="#{controller.addExpression}" />
										
						<aon:outputLabel for="Hotel_workPlace_address_number"
							value="#{bundle.aon_number}" />
						<aon:inputText id="Hotel_workPlace_address_number" size="20"
							valueChangeListener="#{controller.addExpression}" />

						<aon:outputLabel for="Hotel_workPlace_address_city"
							value="#{bundle.registry_city}" />
						<aon:inputText id="Hotel_workPlace_address_city" size="60"
							valueChangeListener="#{controller.addExpression}" />
										
						<aon:outputLabel for="Hotel_workPlace_address_zip"
							value="#{bundle.aon_postal_code}" />
						<aon:inputText id="Hotel_workPlace_address_zip" size="20"
							valueChangeListener="#{controller.addExpression}" />
					
				</ui:define>
			</ui:decorate>
		</aon:form>
		
	</ui:define>
</ui:composition>
