<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="roomForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{bundle.report_rooms}" />
				<ui:param name="controller" value="#{room}" />
				<ui:param name="skipRemoveButton" value="true" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="roomTable" columns="2" width="100%">
					
					<aon:outputLabel for="Room_hotel" value="#{bundle.aon_module_hotel}" />
					<aon:selectOneMenu id="Room_hotel" 
						value="#{room.to.hotel}" required="true">
						<f:selectItems value="#{pmsCollections.currentUserHotels}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Room_item" value="#{bundle.aon_type}" />
					<aon:selectOneMenu id="Room_item" 
						value="#{room.to.item}" required="true"
						rendered="#{!room.to.usedRoom}">
						<f:selectItems value="#{pmsCollections.roomItems}" />
					</aon:selectOneMenu>
					<aon:outputText styleClass="aon-bold"
						value="#{room.to.item.product.code} - #{room.to.item.product.name}"
						rendered="#{room.to.usedRoom}" />
					
					<aon:outputLabel for="Room_name" value="#{bundle.aon_number}" />
					<aon:inputText id="Room_name" value="#{room.to.asset.name}" 
						size="5" maxlength="5" required="true" />

					<aon:outputLabel for="Room_active" value="#{bundle.aon_status}" />
					<aon:selectOneRadio id="Room_active" value="#{room.to.active}" required="true">
						<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="#{false}" />
					</aon:selectOneRadio>

				</aon:panelGrid>
				
				<aon:div styleClass="aon-group" style="width: 100%; margin-top: 2em;">
					<aon:div styleClass="aon-group-title">
						<aon:outputText value="#{bundle.asset_feature_module}"/>
					</aon:div>
					<aon:div styleClass="aon-group-body"> 
						<aon:div styleClass="aon-group-body-internal">
							<ui:include src="/com/code/aon/ui/asset/facelet/assetFeature/grid.xhtml" >
								<ui:param name="controller" value="#{roomFeature}" />
							</ui:include>
						</aon:div>
					</aon:div>
				</aon:div>
				
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
