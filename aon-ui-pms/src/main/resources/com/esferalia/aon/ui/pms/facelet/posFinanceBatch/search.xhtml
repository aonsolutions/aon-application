<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="posFinanceSearch">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_posFinanceBatch_module}" />
				<ui:param name="controller" value="#{posFinanceBatch}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>
				
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{posFinanceBatch}" />

				<ui:define name="searchContent">
				
					<aon:outputLabel for="PosShift_hotel" 
						value="#{pmsBundle.pms_hotel}" />
					<aon:selectOneMenu id="PosShift_hotel" required="true" 
						value="#{posFinanceBatch.hotel}" >
						<f:selectItems value="#{pmsCollections.currentUserHotels}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="Finance_dueTime-From"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="Finance_dueTime-From"
							required="true"
							size="16" inputSize="10" renderAsPopup="true" enableManualInput="true"
							value="#{posFinanceBatch.startDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"
							/>
						<aon:outputLabel for="Finance_dueTime-To"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="Finance_dueTime-To"
							required="true"
							size="16" inputSize="10" renderAsPopup="true" enableManualInput="true"
							value="#{posFinanceBatch.endDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"
							/>
					</aon:div>
					
					<aon:outputLabel for="Finance_PayMethod" value="#{configBundle.config_pay_method}" />
					<aon:selectOneMenu id="Finance_PayMethod" 
						required="true"
						value="#{posFinanceBatch.payMethod}">
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel value="#{pmsBundle.pms_shift}" />
					<aon:selectOneMenu  
						value="#{posFinanceBatch.shift}" >
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{pmsCollections.shifts}" />
					</aon:selectOneMenu>
						
				</ui:define>
			</ui:decorate>				
		</aon:form>
		
	</ui:define>
</ui:composition>
