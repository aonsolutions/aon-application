<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="rackSearch">

			<ui:decorate 
				template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.pms_rack_module}" />
				<ui:param name="controller" value="#{rack}" />
				<ui:param name="skipClearButton" value="#{true}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipBackButton" value="#{true}" />
				<ui:define name="additionalToolbarContent">
					<aon:div styleClass="aon-spin-control">
						<aon:outputText value="#{bundle.aon_results}" styleClass="aon-margin-left" />
						<aon:selectOneMenu 
							styleClass="aon-margin-left aon-margin-right"
							value="#{rack.pageLimit}">
							<f:selectItem itemLabel="20" itemValue="20" />
							<f:selectItem itemLabel="50" itemValue="50" />
							<f:selectItem itemLabel="100" itemValue="100" />
							<f:selectItem itemLabel="#{bundle.aon_all}" itemValue="-1" />
						</aon:selectOneMenu>
					</aon:div>
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{rack}" />
				<ui:param name="searchController" value="#{rackSearch}" />
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:define name="searchContent">
					<ui:include src="/com/esferalia/aon/ui/pms/facelet/rack/searchContent.xhtml" />
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
</ui:composition>
