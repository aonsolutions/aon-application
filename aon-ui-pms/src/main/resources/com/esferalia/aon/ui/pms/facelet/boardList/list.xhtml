<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="boardList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_boardList_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="boardList-search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						value="#{bundle.aon_search}" 
						actionListener="#{boardList.onSearch}"
						action="boardList_list"
						accesskey="#{bundle.aon_key_search}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')" />
					<aon:htmlCommandLink id="boardList-excel-report"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						rendered="#{boardList.model.rowCount > 0}"
						value="&#160;" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="boardList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="boardList-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						rendered="#{boardList.model!=null and boardList.model.rowCount > 0}"
						value="#{bundle.aon_listing}" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="boardList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:div styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:panelGrid columns="8" 
						columnClasses="aon-panelGrid-even aon-noborder,aon-panelGrid-even aon-noborder">

						<aon:outputLabel for="BoardList_hotel_id" styleClass="aon-bold aon-margin-left"
							value="#{bundle.aon_module_hotel}" />
						<aon:selectOneMenu id="BoardList_hotel_id"
							valueChangeListener="#{boardList.onHotelChanged}"
							value="#{boardList.hotel}" required="true"
							reRender="boardList" ajaxSingle="false">
							<f:selectItem itemLabel=" - " itemValue="#{null}" />
							<f:selectItems value="#{pmsCollections.currentUserHotels}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="BoardList_date" styleClass="aon-bold aon-margin-left"
							value="#{bundle.aon_date}" />
						<aon:selectInputDate id="BoardList_date"	
							value="#{boardList.date}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="BoardList_item_id" styleClass="aon-bold aon-margin-left"
							value="#{bundle.pms_board}" />
						<aon:selectOneMenu id="BoardList_item_id"
							value="#{boardList.item}">
							<f:selectItem itemLabel=" - " itemValue="null" />
							<f:selectItems value="#{pmsCollections.boardItems}" />
						</aon:selectOneMenu>

						<aon:outputText value="&#160;" />
						<aon:div>
							<h:selectBooleanCheckbox id="BoardList_pageBreak" 
								value="#{boardList.pageBreak}" />
							<aon:outputLabel for="BoardList_pageBreak"
								value="#{bundle.pms_board_page_break}" />
						</aon:div>
					</aon:panelGrid>

					<aon:div styleClass="aon-margin-top" rendered="#{boardList.model.rowCount > 0}" >
						<aon:outputText styleClass="aon-bold aon-margin-left"
							value="#{bundle.aon_total}:" />
						<c:forEach items="#{boardList.boardTotalList}" var="boardTotal">
							<aon:outputText value="#{boardTotal.boardName} (#{boardTotal.quantity})" 
								styleClass="aon-bold aon-margin-left" />
						</c:forEach>
					</aon:div>
				</aon:div>
				
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{boardList}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-250">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_board}" />
							</f:facet>
							<aon:outputText value="#{to.boardName}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_room}" />
							</f:facet>
							<aon:outputText value="#{to.roomNumber}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_pax}" />
							</f:facet>
							<aon:outputText value="#{to.quantity}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_guest}" />
							</f:facet>
							<aon:outputText value="#{to.guestName}" />
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_id}" />
							</f:facet>
							<aon:outputText value="#{to.reservationId}" />
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkin}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkout}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
