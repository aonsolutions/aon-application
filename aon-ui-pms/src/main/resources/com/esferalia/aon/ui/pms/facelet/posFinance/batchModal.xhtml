<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinanceBatchWindow">
		<c:if test="#{controller.showFinanceBatchWindow}">
			<rich:modalPanel id="financeBatchModalPanel" minHeight="280" minWidth="620"  
				rendered="#{controller.showFinanceBatchWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{financeBundle.finance_to_batch}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFinanceBatchWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showFinanceBatchWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="financeBatchForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="financeBatch-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{controller.onFinanceBatch}" action="fbatch_form"
										onclick="Richfaces.showModalPanel('waitProccess')" 
							     		oncomplete="Richfaces.hideModalPanel('waitProccess')">	
										<rich:componentControl for="financeBatchModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showFinanceBatchWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="financeBatch-back"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										reRender="showFinanceBatchWindow" immediate="true">
										<rich:componentControl for="financeBatchModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showFinanceBatchWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:selectOneRadio styleClass="aon-padding-bottom"
										value="#{controller.newBatch}">
										<f:selectItem itemLabel="#{pmsBundle.pms_create_finance_batch}" itemValue="#{true}" />
										<f:selectItem itemLabel="#{pmsBundle.pms_modify_finance_batch}" itemValue="#{false}" />
										<a4j:support event="onclick" ajaxSingle="true" 
											actionListener="#{controller.onBatchModeChanged}" reRender="financeBatchGrid" />
									</aon:selectOneRadio>

									<aon:panelGrid id="financeBatchGrid" 
										columns="2" columnClasses="aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-350">

										<aon:outputLabel for="FinanceBatch_issueDate"
											value="#{bundle.aon_date}"
											rendered="#{controller.newBatch}" />
										<aon:selectInputDate id="FinanceBatch_issueDate" 
											value="#{controller.financeBatch.issueDate}" required="true"
											rendered="#{controller.newBatch}"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"/>

										<aon:outputLabel for="FinanceBatch_description"
											value="#{bundle.aon_description}"
											rendered="#{controller.newBatch}" />
										<aon:inputText id="FinanceBatch_description"
											value="#{controller.financeBatch.description}" required="true"
											rendered="#{controller.newBatch}" size="40" maxlength="32" />

										<aon:outputLabel for="FinanceBatch_registryBank"
											value="#{configBundle.config_bank}"
											rendered="#{controller.newBatch}" />
										<aon:selectOneMenu id="FinanceBatch_registryBank"
											value="#{controller.financeBatch.registryBank}" required="true"
											rendered="#{controller.newBatch}">
											<f:selectItem itemLabel=" - " itemValue="#{null}" />
											<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="FinanceBatchList"
											value="#{financeBundle.finance_batches}"
											rendered="#{!controller.newBatch}" />
										<aon:selectOneMenu id="FinanceBatchList"
											value="#{controller.financeBatch}" required="true"
											rendered="#{!controller.newBatch}">
											<f:selectItems value="#{controller.financeBatchList}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
