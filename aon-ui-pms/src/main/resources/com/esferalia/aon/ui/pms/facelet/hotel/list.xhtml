<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="hotelList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_hotel_module}" />
				<ui:param name="controller" value="#{hotel}" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="#{companyCollections.currentUserEnterprisesCount == 0}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{hotel}" />

					<ui:define name="columns">
						<aon:column alias="Hotel.workPlace.description"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.workPlace.description}" />
						</aon:column>

						<aon:column alias="Hotel.code"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{to.code}" />
						</aon:column>

						<aon:column alias="Hotel.workPlace.enterprise.registry.name"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_company}" />
							</f:facet>
							<aon:outputText value="#{to.workPlace.enterprise.registry.name}" />
						</aon:column>

						<aon:column alias="Hotel.scope.description"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_scope}" />
							</f:facet>
							<aon:outputText value="#{to.scope.description}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_address}" />
							</f:facet>
							<aon:outputText value="#{to.workPlace.address.fullAddress}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="Hotel.active"
							styleClass="aon-editDataTable-textColumn aon-width-60">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_active}" />
							</f:facet>
							<aon:outputText value="&#160;" 
								styleClass="#{to.active?'aon-icon-checked':'aon-icon-check'}" 
								style="padding-left:40px" />
						</aon:column>
				</ui:define>
			</ui:decorate>
			</aon:div>
			
		</aon:form>

	</ui:define>

</ui:composition>
