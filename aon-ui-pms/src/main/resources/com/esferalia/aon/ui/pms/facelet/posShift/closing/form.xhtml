<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posClosingForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_posCashCount_module}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
						title="#{bundle.aon_key_cancel_accelerator}"
						rendered="#{posClosing.posShift!=null}"
						reRender="posClosingForm"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						actionListener="#{posClosing.onCancel}"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:commandButton id="save" value="#{pmsBundle.pms_close_pos}"
						title="#{bundle.aon_key_accept_accelerator}"
						disabled="#{posClosing.posShift==null or !(posShiftCount.model.rowCount>0)}"
						rendered="#{posClosing.posShift!=null and posClosing.posShift.endTime==null}"
						reRender="aonContent"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{posClosing.onAccept}"
						accesskey="#{bundle.aon_key_save}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area" id="posClosingPanel">

				<aon:panelGrid columns="2" columnClasses="aon-panelGrid-even aon-vertical-align-top aon-noborder,  aon-panelGrid-even aon-vertical-align-top aon-noborder">
					<aon:panelGrid columns="2" styleClass="aon-width-400" >
					
						<c:if test="#{!(posClosing.posShift!=null and posShiftCount.model.rowCount>0)}">
							<aon:outputLabel value="#{pmsBundle.pms_hotel}" />
							<aon:selectOneMenu
								disabled="#{posClosing.posShift!=null and posShiftCount.model!=null and posShiftCount.model.rowCount>0}" 
								value="#{posClosing.hotel}" >
								<f:selectItem itemLabel=" - " itemValue="#{null}" />
								<f:selectItems value="#{pmsCollections.currentUserHotels}" />
								<a4j:support event="onchange" reRender="posClosingPanel" ignoreDupResponses="true" ajaxSingle="true"
									actionListener="#{posClosing.onHotelChange}" />
								<a4j:support event="oninputchanged" reRender="posClosingPanel" ignoreDupResponses="true" ajaxSingle="true"
									actionListener="#{posClosing.onHotelChange}" />
							</aon:selectOneMenu>
						
							<aon:outputLabel for="PosClosing_posShift" value="#{pmsBundle.pms_pos}" />
							<aon:selectOneMenu id="PosClosing_posShift" required="true"
								disabled="#{posClosing.posShift!=null and posShiftCount.model!=null and posShiftCount.model.rowCount>0}" 
								value="#{posClosing.posShift}" >
								<f:selectItem itemLabel=" - " itemValue="#{null}" />
								<f:selectItems value="#{posClosing.openedPosList}" />
								<a4j:support event="onchange" reRender="posClosingForm" ignoreDupResponses="true" ajaxSingle="true" 
									actionListener="#{posClosing.onPosChange}" />
							</aon:selectOneMenu>
							
						</c:if>
						
						<c:if test="#{posClosing.posShift!=null and posShiftCount.model.rowCount>0}">
							<aon:outputText value="#{pmsBundle.pms_hotel}" />
							<aon:outputText value="#{posClosing.hotel.workPlace.description}" />
						
							<aon:outputText value="#{pmsBundle.pms_pos}" />
							<aon:outputText value="#{posClosing.posShift.pos.name}" />
							
							<aon:outputText value="#{pmsBundle.pms_shift}" />
							<aon:outputText value="#{posClosing.posShift.shift}" />
							
							<aon:outputText value="#{pmsBundle.pms_opening}" />
							<aon:outputText value="#{posClosing.posShift.startTime}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							
							<aon:outputText value="#{pmsBundle.pms_closing}" />
							<aon:outputText value="#{posClosing.posShift.endTime}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							
							<aon:outputText value="#{pmsBundle.pms_initial_amount}" />
							<aon:outputText value="#{posClosing.posShift.initialAmount}" >
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
							
							<aon:outputText rendered="#{posClosing.totalCashAmount>0}"
								value="#{pmsBundle.pms_cash_payMethod_name}" />
							<aon:outputText rendered="#{posClosing.totalCashAmount>0}"
								value="#{posClosing.totalCashAmount}" >
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
							
							<aon:outputLabel rendered="#{posClosing.totalCashAmount>0}"
								value="#{pmsBundle.pms_bank_income}" />
							<aon:outputText rendered="#{posClosing.totalCashAmount>0}"
								value="#{posClosing.totalCashAmount - posClosing.posShift.initialAmount}" >
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
						</c:if>
						
					</aon:panelGrid>
					
					<aon:panelGrid columns="2" styleClass="aon-width-600" rendered="#{posClosing.posShift!=null}">
						<aon:outputLabel for="PosClosing_remarks"
							value="#{bundle.aon_remark}" />
						<aon:inputTextarea id="PosClosing_remarks" cols="80" rows="6"
							disabled="#{posClosing.posShift.endTime!=null}"
							value="#{posClosing.posShift.remarks}" />
					</aon:panelGrid>
				</aon:panelGrid>
				
				<br />
							
				<aon:div rendered="#{posClosing.posShift!=null}">
					<aon:panelTabSet id="countTab">
						<aon:panelTab label="#{pmsBundle.pms_cash_count}">
							<ui:include src="/com/esferalia/aon/ui/pms/facelet/posShift/count_grid.xhtml">
								<ui:param name="controller" value="#{posShiftCount}" />
								<ui:param name="modalController" value="#{posShift}" />
								<ui:param name="disabledGrid" value="#{posClosing.posShift.endTime!=null}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</aon:div>
			</aon:div>
	
		</aon:form>
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/posShift/calculator/calculatorModal.xhtml" >
			<ui:param name="controller" value="#{posClosing}" />								
			<ui:param name="modalReRender" value="posClosingForm" />
		</ui:include>
		
	</ui:define>
</ui:composition>
