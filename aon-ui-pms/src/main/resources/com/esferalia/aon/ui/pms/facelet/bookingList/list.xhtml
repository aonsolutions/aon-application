<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="bookingList">
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_bookingList_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="bookingList_search"
						actionListener="#{bookingList.onInit}"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="bookingList-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="bookingList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="bookingList_report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="bookingList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panel>
					<aon:outputText value="#{pmsBundle.pms_hotel}:" styleClass="aon-bold" />
					<aon:outputText styleClass="aon-margin-left "
						value="#{(bookingList.hotel!=null)?(bookingList.hotel.workPlace.description):('-')}"/>

					<aon:outputText value="#{pmsBundle.pms_agency}:" styleClass="aon-bold aon-margin-left"/>
					<aon:outputText styleClass="aon-margin-left"
						value="#{(bookingList.agency!=null and bookingList.agency.id!=null)?(bookingList.agency.registry.fullName):('-')}"/>

					<aon:outputText value="#{pmsBundle.pms_room_type}:" styleClass="aon-bold aon-margin-left"/>
					<aon:div style="display: inline;">
						<aon:outputText styleClass="aon-margin-left"
							rendered="#{(bookingList.item!=null and bookingList.item.id!=null)}"
							value="#{bookingList.item.product.code} - #{bookingList.item.product.name}"/>
						<aon:outputText styleClass="aon-margin-left"
							rendered="#{bookingList.item==null or bookingList.item.id==null}"
							value=" - "/>
					</aon:div>
				</aon:panel>
			
				<aon:dataTable id="bookingListData" value="#{bookingList.model}" 
					rendered="#{bookingList.model!=null and bookingList.model.rowCount > 0}" rows="20" var="to">
					
						<f:facet name="header" >
							<rich:columnGroup>
								<rich:column>
									<aon:outputText value="&#160;" />
								</rich:column>
								<rich:column>
									<aon:outputText value="&#160;" />
								</rich:column>
								
								<rich:column colspan="5" >
									<aon:outputText value="#{pmsBundle.pms_rooms}" />
								</rich:column>
								
								<rich:column colspan="3" >
									<aon:outputText value="#{pmsBundle.pms_guests}" />
								</rich:column>
							</rich:columnGroup>
						</f:facet>
						
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-300">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotel}" />
						</aon:column>	
						
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>	
									
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkIn}" />
							</f:facet>
							<aon:outputText value="#{to.roomCheckin}" />
						</aon:column>				
									
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkOut}" />
							</f:facet>
							<aon:outputText value="#{to.roomCheckout}" />
						</aon:column>				
									
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_occupation_group}" />
							</f:facet>
							<aon:outputText value="#{to.roomBusy}" />
						</aon:column>				
									
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_free}" />
							</f:facet>
							<aon:outputText value="#{to.roomTotal - to.roomBusy}" />
						</aon:column>				
									
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.roomTotal}" />
						</aon:column>				
									
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkIn}" />
							</f:facet>
							<aon:outputText value="#{to.guestCheckin}" />
						</aon:column>				
									
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkOut}" />
							</f:facet>
							<aon:outputText value="#{to.guestCheckout}" />
						</aon:column>				
									
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.guestTotal}" />
						</aon:column>				
				
				</aon:dataTable>
			
				<aon:dataScroller2 for="bookingListData" showNote="true" />
				
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
