<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:outputLabel for="ReservationRequest_hotel_id" value="#{bundle.aon_module_hotel}" />
	<aon:outputText	value="#{reservationRequest.to.hotel.workPlace.description}" styleClass="aon-bold"
		rendered="#{!reservationRequest.nevv}" />
	<aon:selectOneMenu id="ReservationRequest_hotel_id" value="#{reservationRequest.to.hotel}" 
		rendered="#{reservationRequest.nevv}" required="true" ajaxSingle="true">
		<f:selectItems value="#{pmsCollections.currentUserHotels}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ReservationRequest_id" value="#{bundle.pms_reservation_request_id}"
		rendered="#{!reservationRequest.nevv}" />
	<aon:outputText	id="ReservationRequest_id" value="#{reservationRequest.to.id}" 
		styleClass="aon-bold" rendered="#{!reservationRequest.nevv}" />

	<aon:outputLabel for="ReservationRequest_code" value="#{bundle.report_reservation_code}" />
	<aon:outputText	value="#{reservationRequest.to.code}" styleClass="aon-bold"
		rendered="#{!reservationRequest.to.active}" />
	<aon:inputText id="ReservationRequest_code" value="#{reservationRequest.to.code}"
		size="64" maxlength="48" required="true"
		rendered="#{reservationRequest.to.active}" ajaxSingle="true" />

	<aon:outputLabel for="ReservationRequest_startDate" value="#{bundle.report_checkin}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130, aon-width-auto">
		<aon:outputText	value="#{reservationRequest.to.startDate}" styleClass="aon-bold"
			rendered="#{!reservationRequest.to.active}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<aon:selectInputDate id="ReservationRequest_startDate" value="#{reservationRequest.to.startDate}" 
			required="true" rendered="#{reservationRequest.to.active}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
			<a4j:support ajaxSingle="true" event="oninputchange"
				actionListener="#{reservationRequest.onStartDateChanged}"
				reRender="ReservationRequest_nights,ReservationRequest_endDate"
				focus="ReservationRequest_nights" />
			<a4j:support ajaxSingle="true" event="onchanged"
				actionListener="#{reservationRequest.onStartDateChanged}"
				reRender="ReservationRequest_nights,ReservationRequest_endDate"
				focus="ReservationRequest_nights" />
		</aon:selectInputDate>
		<aon:div>
			<aon:outputLabel for="ReservationRequest_nights" value="#{bundle.pms_nights}:" 
				styleClass="aon-margin-right aon-italic" />
			<aon:outputText value="#{reservationRequest.nights}" styleClass="aon-bold" 
				rendered="#{!reservationRequest.to.active}" />
			<aon:inputText id="ReservationRequest_nights" value="#{reservationRequest.nights}"
				size="1" maxlength="3"
				rendered="#{reservationRequest.to.active}"
				valueChangeListener="#{reservationRequest.onNightsChanged}"
				reRender="ReservationRequest_endDate"
				focus="ReservationRequest_bookingHolder">
				<f:validateDoubleRange minimum="1" />
			</aon:inputText>
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="ReservationRequest_endDate" value="#{bundle.report_checkout}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130, aon-width-auto">
		<aon:outputText	value="#{reservationRequest.to.endDate}" styleClass="aon-bold"
			rendered="#{!reservationRequest.to.active}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<aon:selectInputDate id="ReservationRequest_endDate" value="#{reservationRequest.to.endDate}" 
			required="true" rendered="#{reservationRequest.to.active}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
			<a4j:support ajaxSingle="true" event="oninputchange"
				actionListener="#{reservationRequest.onEndDateChanged}"
				reRender="ReservationRequest_nights,ReservationRequest_endDate"
				focus="ReservationRequest_bookingHolder" />
			<a4j:support ajaxSingle="true" event="onchanged"
				actionListener="#{reservationRequest.onEndDateChanged}"
				reRender="ReservationRequest_nights,ReservationRequest_endDate"
				focus="ReservationRequest_bookingHolder" />
		</aon:selectInputDate>
		<aon:div rendered="#{!reservationRequest.nevv}">
			<aon:outputLabel value="#{bundle.pms_rate_plans}:" styleClass="aon-margin-right aon-italic" />
			<aon:outputText value="#{reservationRequest.ratePlans}" styleClass="aon-bold" />
		</aon:div>
	</aon:panelGrid>

	<aon:if test="#{aonRole.commercialOperator and !reservationRequest.agencyUser}">
		<aon:outputLabel for="ReservationRequest_bookingHolder" value="#{bundle.pms_reservation_holder}" />
		<aon:panelGrid columns="2" columnClasses="aon-width-130, aon-width-auto">
			<aon:outputText value="#{reservationRequest.to.bookingHolder}" styleClass="aon-bold" 
				rendered="#{!reservationRequest.to.active or !aonRole.commercialOperator or reservationRequest.agencyUser}" />
			<aon:selectOneMenu id="ReservationRequest_bookingHolder" value="#{reservationRequest.to.bookingHolder}" 
				required="true" rendered="#{reservationRequest.to.active and aonRole.commercialOperator and !reservationRequest.agencyUser}"
				valueChangeListener="#{reservationRequest.onHolderChanged}"
				reRender="BookingHolderLabelDiv,BookingHolderContentDiv">
				<f:selectItems value="#{pmsCollections.bookingHolders}" />
			</aon:selectOneMenu>
			<aon:div rendered="#{!reservationRequest.nevv and reservationRequest.to.agencyHolder}">
				<aon:outputLabel value="#{bundle.pms_promo_code}:" styleClass="aon-margin-right aon-italic" />
				<aon:outputText value="#{reservationRequest.promoCode}" styleClass="aon-bold" />
			</aon:div>
		</aon:panelGrid>
	</aon:if>

	<aon:if test="#{aonRole.commercialOperator or reservationRequest.agencyUser}">
		<aon:div id="BookingHolderLabelDiv">
			<aon:outputLabel for="ReservationRequest_agency" value="#{bundle.report_agency}"
				 rendered="#{!reservationRequest.to.companyHolder}" />
			<aon:outputLabel for="ReservationRequest_company" value="#{bundle.aon_company}"
				rendered="#{reservationRequest.to.companyHolder}" />
		</aon:div>

		<aon:div id="BookingHolderContentDiv">
			<aon:outputText value="#{reservationRequest.to.agency.registry.fullName}" styleClass="aon-bold" 
				rendered="#{!reservationRequest.to.active and !reservationRequest.to.companyHolder}"  />
			<aon:selectOneMenu id="ReservationRequest_agency" value="#{reservationRequest.to.agency}" 
				required="true" styleClass="aon-width-350"
				rendered="#{reservationRequest.to.active and !reservationRequest.to.companyHolder}"
				disabled="#{reservationRequest.to.guestHolder}">
				<aon:if test="#{reservationRequest.to.guestHolder}">
					<f:selectItem itemLabel="-" value="#{null}" />		
				</aon:if>
				<f:selectItems value="#{pmsCollections.agencies}" />
			</aon:selectOneMenu>
			<aon:outputText value="#{reservationRequest.to.company.registry.fullName}" styleClass="aon-bold" 
				rendered="#{!reservationRequest.to.active and reservationRequest.to.companyHolder}"  />
			<aon:selectOneMenu id="ReservationRequest_company" value="#{reservationRequest.to.company}" 
				required="true" styleClass="aon-width-350"
				rendered="#{reservationRequest.to.active and reservationRequest.to.companyHolder}">
				<f:selectItems value="#{pmsCollections.companies}" />
			</aon:selectOneMenu>
		</aon:div>
	</aon:if>

	<aon:if test="#{!reservationRequest.agencyUser}">
		<aon:outputLabel for="ReservationRequest_remarks" value="#{bundle.aon_remark}" />
		<aon:inputTextarea id="ReservationRequest_remarks" value="#{reservationRequest.to.remarks}"
			rows="4" cols="75" ajaxSingle="true">
			<f:validateLength maximum="166" />
		</aon:inputTextarea>
	</aon:if>

 </ui:composition>
