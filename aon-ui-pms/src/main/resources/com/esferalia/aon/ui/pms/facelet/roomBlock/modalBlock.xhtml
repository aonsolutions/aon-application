<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showMultipleBlockWindow">
		<c:if test="#{controller.showMultipleBlockWindow}">
			<rich:modalPanel id="multipleBlockModalPanel" 
				height="450" width="450"  
				rendered="#{controller.showMultipleBlockWindow}"
				showWhenRendered="true" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{pmsBundle.pms_roomBlock_multiple_block}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showMultipleBlockWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showMultipleBlockWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="multipleBlockForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="modal-accept"
										title="#{bundle.aon_key_accept_accelerator}" 
										value="#{bundle.aon_accept}" 
										reRender="showMultipleBlockWindow, #{modalReRender}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_cancel}" >
										<rich:componentControl for="multipleBlockModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showMultipleBlockWindow}"
											value="#{false}" />
										<aon:actionListener method="#{controller.onAcceptMultipleBlock}" />
									</aon:commandButton>	
									<aon:commandButton id="modal-back"
										title="#{bundle.aon_key_cancel_accelerator}"
										value="#{bundle.aon_back}" immediate="true"
										reRender="showMultipleBlockWindow"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}" >
										<rich:componentControl for="multipleBlockModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showMultipleBlockWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								
								<aon:div id="divertContent" styleClass="aon-scroll-area">
				
									<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
										columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-auto">
										
										<aon:outputLabel value="#{pmsBundle.pms_hotel}" />
										<aon:outputText value="#{room.to.hotel.workPlace.description}" />
										 
										<aon:outputLabel value="#{bundle.aon_number}" />
										<aon:outputText value="#{room.to.asset.name}" /> 
					
										<aon:outputLabel value="#{bundle.aon_type}" />
										<aon:div>
											<aon:outputText value="#{room.to.item.product.code}" />
											<aon:outputText value=" - " />
											<aon:outputText value="#{room.to.item.product.name}" />
										</aon:div>
										
										<aon:outputLabel for="RoomBlock_startDate"
											styleClass="aon-italic aon-margin-right" 
											value="#{bundle.aon_date_from}" />
										<aon:selectInputDate id="RoomBlock_startDate"
											required="true"	
											value="#{controller.fromDate}"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"/>
											
										<aon:outputLabel for="RoomBlock_endDate"
											styleClass="aon-italic aon-margin-right" 
											value="#{bundle.aon_date_to}" />
										<aon:selectInputDate id="RoomBlock_endDate"
											required="true"	
											value="#{controller.toDate}"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"/>
											
										<aon:outputLabel for="RoomBlock_comments" 
											value="#{assetBundle.asset_activity_why}" />
										<aon:inputTextarea value="#{controller.comments}" id="RoomBlock_comments"
											cols="50" rows="4" >
											<f:validateLength maximum="128" />
										</aon:inputTextarea>
										
									</aon:panelGrid>
									
								</aon:div>
									
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
