<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showDivertWindow">
		<c:if test="#{controller.showDivertWindow}">
			<rich:modalPanel id="divertModalPanel" 
				height="350" width="370"  
				rendered="#{controller.showDivertWindow}"
				showWhenRendered="true" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{pmsBundle.pms_divert_reservation}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showDivertWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showDivertWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="divertForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="modal-accept"
										title="#{bundle.aon_key_accept_accelerator}" 
										value="#{bundle.aon_accept}" 
										reRender="showDivertWindow, #{modalReRender}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_cancel}" >
										<rich:componentControl for="divertModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showDivertWindow}"
											value="#{false}" />
										<aon:actionListener method="#{divert.onAccept}" />
									</aon:commandButton>	
									<aon:commandButton id="modal-back"
										title="#{bundle.aon_key_cancel_accelerator}"
										value="#{bundle.aon_back}" immediate="true"
										reRender="showDivertWindow"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}" >
										<rich:componentControl for="divertModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showDivertWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								
								<aon:div id="divertContent" styleClass="aon-scroll-area">
				
									<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
										columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-auto">
										
										<ui:include src="/com/esferalia/aon/ui/pms/facelet/divert/form_content.xhtml" />
					
									</aon:panelGrid>
									
								</aon:div>
									
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
