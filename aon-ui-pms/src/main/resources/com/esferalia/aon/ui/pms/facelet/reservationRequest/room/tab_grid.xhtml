<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="skipLineEdition" value="true" />

		<ui:define name="beginFormListContent">
			<aon:commandLink id="requestRoom-selectButton"
				styleClass="aon-table-row-link" value="&#160;"
				immediate="true" ajaxSingle="true" requestDelay="100"
				rendered="#{empty to.crsCode}"
				actionListener="#{controller.onSelect}"
				reRender="aonContent"
				onkeyup="#{dataTableId}KeyUp(this)"
				onfocus="#{dataTableId}SelectRow(this)"
				onblur="#{dataTableId}DeselectRow(this)"
				focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
			</aon:commandLink>
		</ui:define>

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
				<f:facet name="header">
					<aon:outputLabel for="ReservationRequestRoom_roomIndex" value="#{bundle.aon_order}" />
				</f:facet>
				<aon:outputText id="ReservationRequestRoom_roomIndex" value="#{to.roomIndex}" 
					rendered="#{formList or formEdit}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ReservationRequestRoom_units" value="#{bundle.pms_room_count}" />
				</f:facet>
				<aon:outputText value="#{to.units}" rendered="#{formList}" />
				<aon:selectOneMenu id="ReservationRequestRoom_units" 
					value="#{controller.to.units}" required="true"
					rendered="#{formEdit}">
					<f:selectItem itemValue="1" />
					<f:selectItem itemValue="2" />
					<f:selectItem itemValue="3" />
					<f:selectItem itemValue="4" />
					<f:selectItem itemValue="5" />
					<f:selectItem itemValue="6" />
					<f:selectItem itemValue="7" />
					<f:selectItem itemValue="8" />
					<f:selectItem itemValue="9" />
					<f:selectItem itemValue="10" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="ReservationRequestRoom_units-New" 
						value="#{controller.to.units}" required="true"
						rendered="#{formNew}">
						<f:selectItem itemValue="1" />
						<f:selectItem itemValue="2" />
						<f:selectItem itemValue="3" />
						<f:selectItem itemValue="4" />
						<f:selectItem itemValue="5" />
						<f:selectItem itemValue="6" />
						<f:selectItem itemValue="7" />
						<f:selectItem itemValue="8" />
						<f:selectItem itemValue="9" />
						<f:selectItem itemValue="10" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="ReservationRequestRoom_item" value="#{bundle.pms_room_type}" />
				</f:facet>
				<aon:outputText value="#{to.item.product.code} - #{to.item.product.name}" 
					rendered="#{formList}" />
				<aon:selectOneMenu id="ReservationRequestRoom_item" 
					value="#{controller.to.item}" required="true"
					rendered="#{formEdit}">
					<f:selectItems value="#{controller.hotelRoomItems}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="ReservationRequestRoom_item-New" 
						value="#{controller.to.item}" required="true"
						rendered="#{formNew}">
						<f:selectItems value="#{controller.hotelRoomItems}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ReservationRequestRoom_adults" value="#{bundle.pms_adults}" />
				</f:facet>
				<aon:outputText value="#{to.adults}" rendered="#{formList}" />
				<aon:inputText id="ReservationRequestRoom_adults" 
					value="#{controller.to.adults}" rendered="#{formEdit}"
					required="true" size="2" maxlength="3">
					<f:validateLongRange minimum = "1" />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="ReservationRequestRoom_adults-New" 
						value="#{controller.to.adults}" rendered="#{formNew}"
						required="true" size="2" maxlength="3">
						<f:validateLongRange minimum = "1" />
					</aon:inputText>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ReservationRequestRoom_babies" value="#{bundle.pms_children} 0-5 #{bundle.aon_years}" />
				</f:facet>
				<aon:outputText value="#{to.babies}" rendered="#{formList}" />
				<aon:inputText id="ReservationRequestRoom_babies" 
					value="#{controller.to.babies}" rendered="#{formEdit}"
					required="true" size="2" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText id="ReservationRequestRoom_babies-New" 
						value="#{controller.to.babies}" rendered="#{formNew}"
						required="true" size="2" maxlength="3" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ReservationRequestRoom_children" value="#{bundle.pms_children} 6-11 #{bundle.aon_years}" />
				</f:facet>
				<aon:outputText value="#{to.children}" rendered="#{formList}" />
				<aon:inputText id="ReservationRequestRoom_children" 
					value="#{controller.to.children}" rendered="#{formEdit}"
					required="true" size="2" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText id="ReservationRequestRoom_children-New" 
						value="#{controller.to.children}" rendered="#{formNew}"
						required="true" size="2" maxlength="3" />
				</f:facet>
			</aon:column>
		</ui:define>

		<ui:define name="endFormListContent">
			<aon:div>
				<aon:commandButton id="requestRoom-AvailabilityQuery"
					value="&#160;" styleClass="aon-icon-question aon-noborder"
					title="#{bundle.asset_filter_availability}" immediate="true"
					rendered="#{empty to.crsCode}"
					actionListener="#{controller.sendAvailabilityQuery}"
					reRender="aonContent"
					onclick="Richfaces.showModalPanel('waitProccess')"
					oncomplete="Richfaces.hideModalPanel('waitProccess')" />
				<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
					<ui:param name="auditableTO" value="#{to}" />
				</ui:include>
			</aon:div>
			<rich:subTable id="availableRoomStayTable"
				value="#{controller.availableRoomStayList}" var="availableRoomStay"
				rendered="#{controller.idInAvailableRoomStayMap}"
				headerClass="aon-editDataTable-textColumn aon-subTable-column aon-subTable-column-green-header aon-italic aon-bold"
				rowClasses="aon-subTable-column-green"
				onRowMouseOver="onDataTableOver(this,'aon-table-row-selected','aon-subTable-column-green-selected');"
				onRowMouseOut="onDataTableOut(this,'aon-table-row-selected');">

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<aon:outputText value="&#160;" />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.report_tariff}" />
					</f:facet>
					<aon:outputText value="#{availableRoomStay.tariffCode}"
						 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}" />
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto"
						rendered="#{!availableRoomStay.error}">
						<aon:outputText value="#{availableRoomStay.tariffDescription}" />
					</rich:toolTip>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.pms_regime}" />
					</f:facet>
					<aon:outputText value="#{availableRoomStay.mealPlan}" 
						 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}"
						 rendered="#{!availableRoomStay.error}" />
					<aon:outputText value="ERROR" style="color: red;"
						rendered="#{availableRoomStay.error}" />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.pms_room_type}" />
					</f:facet>
					<aon:outputText value="#{availableRoomStay.roomCode} - #{availableRoomStay.roomDescription}" 
						 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}"
						 rendered="#{!availableRoomStay.error}" />
					<aon:outputText value="&#160;" styleClass="aon-icon-info aon-noborder aon-margin-left aon-padding-left"
						rendered="#{!availableRoomStay.error and !empty availableRoomStay.cancelPenalty}" />
					<rich:toolTip showEvent="onclick" hideEvent="onmouseout" direction="auto"
						rendered="#{!availableRoomStay.error and !empty availableRoomStay.cancelPenalty}">
						<aon:outputText value="#{availableRoomStay.cancelPenalty}" />
					</rich:toolTip>
					<aon:outputText value="#{availableRoomStay.errorMessage}" style="color: red;"
						rendered="#{availableRoomStay.error}" />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_price} #{bundle.aon_day}" />
					</f:facet>
					<aon:outputText value="#{availableRoomStay.dailyPrice}"
						 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_price} #{bundle.aon_total}" />
					</f:facet>
					<aon:outputText value="#{availableRoomStay.totalPrice}"
						 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.asset_filter_availability}" />
					</f:facet>
					<aon:outputText value="#{availableRoomStay.availability}"
						 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}" />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<aon:commandLink id="requestRoom-bookingButton"
						value="#{bundle.pms_to_book}" 
						styleClass="aon-italic" style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}"
						rendered="#{!availableRoomStay.error and !availableRoomStay.tariffStopSales and availableRoomStay.availability >= to.units}"
						actionListener="#{controller.sendBookingQuery}"
						reRender="aonContent"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')">
						<f:param name="availableRoomStayIndex" value="#{availableRoomStay.index}"/>
					</aon:commandLink>
					<aon:outputText value="#{bundle.pms_no_availability_abbrv}" style="color: red;"
						rendered="#{!availableRoomStay.error and !availableRoomStay.tariffStopSales and to.units > availableRoomStay.availability}" />
					<aon:outputText value="#{bundle.pms_stop_sales_abbrv}" style="color: red;"
						rendered="#{!availableRoomStay.error and availableRoomStay.tariffStopSales}" />
				</aon:column>

			</rich:subTable>

			<rich:subTable id="reservationDataTable"
				value="#{to}" var="reservationData"
				rendered="#{!empty to.crsCode}"
				headerClass="aon-editDataTable-textColumn aon-subTable-column aon-subTable-column-yellow-header aon-italic aon-bold"
				rowClasses="aon-subTable-column-yellow">

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<aon:outputText value="&#160;" />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.report_tariff}" />
					</f:facet>
					<aon:outputText value="#{reservationData.tariffCode}" />
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
						<aon:outputText value="#{reservationData.tariffDescription}" />
					</rich:toolTip>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.pms_regime}" />
					</f:facet>
					<aon:outputText value="#{reservationData.mealPlan}" />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.pms_room_type}" />
					</f:facet>
					<aon:outputText value="#{reservationData.roomCode} - #{reservationData.roomDescription}" />
					<aon:outputText value="&#160;" styleClass="aon-margin-left aon-padding-left aon-icon-commandButton aon-icon-info"
						rendered="#{!empty reservationData.cancelPenalty}" />
					<rich:toolTip showEvent="onclick" hideEvent="onmouseout" direction="auto"
						rendered="#{!empty reservationData.cancelPenalty}">
						<aon:outputText value="#{reservationData.cancelPenalty}" />
					</rich:toolTip>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_price} #{bundle.aon_day}" />
					</f:facet>
					<aon:outputText value="#{reservationData.dailyPrice}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_price} #{bundle.aon_total}" />
					</f:facet>
					<aon:outputText value="#{reservationData.totalPrice}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_reservation} #{bundle.pms_crs}" />
					</f:facet>
					<aon:div>
						<aon:outputText value="#{reservationData.crsCode}" />
						<aon:commandLink id="reservationLink"
							styleClass="aon-button-goto" style="padding-right: 20px;" 
							value="&#160;" immediate="true"
							rendered="#{!empty reservationData.crsCode and !reservationRequest.agencyUser}" 
							actionListener="#{controller.onLoadRoomReservation}"
							action="#{controller.getReservationPage}"
							reRender="aonContent">
						</aon:commandLink>
					</aon:div>  
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<aon:outputText value="&#160;" />
				</aon:column>

			</rich:subTable>
		</ui:define>

	</ui:decorate>

</ui:composition>
