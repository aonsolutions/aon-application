<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="boardBookingList">
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_boardBooking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="boardBooking-search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="boardBooking_search"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="boardBooking-excel-report"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						value="&#160;" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="boardBooking" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="boardBooking-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_listing}" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="boardBooking" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{boardBooking.hotel.workPlace.description}"/>

					<aon:outputText styleClass="aon-margin-left aon-italic" 
						value="#{bundle.aon_date_from}:" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{boardBooking.fromDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>

					<aon:outputText styleClass="aon-margin-left aon-italic" 
						value="#{bundle.aon_date_to}:" />
					<aon:outputText styleClass="aon-margin-left aon-bold" 
						value="#{boardBooking.toDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:panel>

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{boardBooking}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotel}" />
						</aon:column>	
						
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-110">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.boardDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>	

						<c:set var="index" value="0" />
						<c:forEach items="#{boardBooking.boardLabels}" var="boardLabel">
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-130">
								<f:facet name="header">
									<aon:outputText value="#{boardLabel}" />
								</f:facet>
								<aon:outputText value="#{to.quantityList[index]}" />
 							</aon:column>				
							<c:set var="index" value="#{index + 1}" />
						</c:forEach>
					</ui:define>
				</ui:decorate>
								
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
