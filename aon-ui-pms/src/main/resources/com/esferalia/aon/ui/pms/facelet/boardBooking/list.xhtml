<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="boardBookingList">
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_boardBooking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="boardBooking_search"
						actionListener="#{boardBooking.onInit}"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="boardBooking-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="boardBooking" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="boardBooking_report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="boardBooking" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panel>
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-bold" />
					<aon:outputText styleClass="aon-margin-left"
						value="#{(boardBooking.hotel!=null)?(boardBooking.hotel.workPlace.description):(bundle.aon_all)}"/>
			
					<aon:outputText styleClass="aon-bold aon-margin-left" 
						value="#{bundle.aon_date_from}:" />
					<aon:outputText styleClass="aon-margin-left "
						value="#{boardBooking.fromDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
									
					<aon:outputText
						styleClass="aon-bold aon-margin-left" 
						value="#{bundle.aon_date_to}:" />
					<aon:outputText styleClass="aon-margin-left" 
						value="#{boardBooking.toDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:panel>
			
			
				<aon:dataTable id="boardBookingData" value="#{boardBooking.model}" 
					rendered="#{boardBooking.model!=null and boardBooking.model.rowCount > 0}" rows="20" var="to">
						
					<aon:column styleClass="aon-editDataTable-dateColumn aon-width-300">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_module_hotel}" />
						</f:facet>
						<aon:outputText value="#{to.hotelName}" />
					</aon:column>	
					
					<aon:column styleClass="aon-editDataTable-dateColumn aon-width-150">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.date}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>	
					
					<c:set var="index" value="0" />
					<c:forEach items="#{boardBooking.boardItems}" var="board" >
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{board.product.name}" />
							</f:facet>
							<aon:outputText value="#{to.quantityList[index]}" />
						</aon:column>				
						<c:set var="index" value="#{index + 1}" />
					</c:forEach>
					
				</aon:dataTable>
			
				<aon:dataScroller2 for="boardBookingData" showNote="true" />
				
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
