<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="roomList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_room_module}" />
				<ui:param name="controller" value="#{room}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="room-selectAll"
						value="#{bundle.aon_check_all}" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						actionListener="#{room.checkAll}" />
					<aon:commandButton id="room-selectNone"
						value="#{bundle.aon_uncheck_all}" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						actionListener="#{room.checkNone}" />
					<aon:commandButton id="room-Block"
						value="#{pmsBundle.pms_to_block}" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-lock"
						actionListener="#{room.onShowRoomBlockWindow}">
						<f:setPropertyActionListener target="#{room.showRoomBlockWindow}"
							value="#{true}" />
						<f:setPropertyActionListener target="#{room.blockMode}"
							value="#{true}" />
					</aon:commandButton>
					<aon:commandButton id="room-Unblock"
						value="#{pmsBundle.pms_to_unblock}" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-unlock"
						actionListener="#{room.onShowRoomBlockWindow}">
						<f:setPropertyActionListener target="#{room.showRoomBlockWindow}"
							value="#{true}" />
						<f:setPropertyActionListener target="#{room.blockMode}"
							value="#{false}" />
					</aon:commandButton>
				</ui:define>							
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{room}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:define name="beginFormListContent">
						<aon:commandLink id="Room-selectButton"
							styleClass="aon-table-row-link" value="&#160;"
							immediate="true" ajaxSingle="true" requestDelay="100"
							actionListener="#{controller.onSelect}"
							reRender="aonContent"
							onkeyup="#{dataTableId}KeyUp(this)"
							onfocus="#{dataTableId}SelectRow(this)"
							onblur="#{dataTableId}DeselectRow(this)"
							focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
						</aon:commandLink>
					</ui:define>
 					<ui:define name="columns">
						<ui:include src="/com/esferalia/aon/ui/pms/facelet/hotel/room/list_content.xhtml" />
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/hotel/room/modalBlock.xhtml">
			<ui:param name="controller" value="#{room}" />
		</ui:include>
	</ui:define>
</ui:composition>
