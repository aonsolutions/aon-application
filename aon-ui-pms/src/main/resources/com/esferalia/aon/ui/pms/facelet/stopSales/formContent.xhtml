<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelGrid columns="2" 	
		columnClasses="aon-panelGrid-odd aon-width-150,	aon-panelGrid-even aon-width-500">

		<aon:outputLabel for="StopSales_hotel_id" value="#{bundle.aon_module_hotel}" />
		<aon:outputText	value="#{stopSales.to.hotel.workPlace.description}" styleClass="aon-bold"
			rendered="#{!stopSales.nevv}" />
		<aon:selectOneMenu id="StopSales_hotel_id" value="#{stopSales.to.hotel}" 
			rendered="#{stopSales.nevv}" required="true"
			valueChangeListener="#{stopSales.onHotelChanged}" 
			reRender="StopSalesItemDiv" ajaxSingle="true">
			<c:if test="#{stopSales.nevv}">
				<f:selectItem itemLabel="-" value="#{null}"/>
			</c:if>
			<f:selectItems value="#{pmsCollections.currentUserHotels}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="StopSales_startDate" value="#{bundle.aon_start_date}" />
		<aon:selectInputDate id="StopSales_startDate" value="#{stopSales.to.startDate}" 
			required="true"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />

		<aon:outputLabel for="StopSales_endDate" value="#{bundle.aon_end_date}" />
		<aon:selectInputDate id="StopSales_endDate" value="#{stopSales.to.endDate}" 
			required="true"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />

		<aon:outputLabel value="#{bundle.report_rooms}" />
		<aon:div id="StopSalesItemDiv">
			<a4j:region>
				<a4j:repeat value="#{stopSales.items}" rowKeyVar="stopSalesItemIdx" var="stopSalesItem">
					<aon:div>
						<aon:panelGrid columns="2" 	
							columnClasses="aon-width-300,aon-width-auto">
							<aon:outputText	value="#{stopSales.items[stopSalesItemIdx].product.code} - #{stopSales.items[stopSalesItemIdx].product.name}" 
								styleClass="aon-bold" />
							<aon:commandButton id="StopSalesItem-remove"
								styleClass="aon-finding-toolbar-item aon-search-minus"
								value="&#160;" immediate="true"
								actionListener="#{stopSales.onRemoveItem}"
								reRender="StopSalesItemDiv">
								<f:param name="stopSalesItemIdx" value="#{stopSalesItemIdx}" />
							</aon:commandButton>
						</aon:panelGrid>
					</aon:div>						
				</a4j:repeat>
			</a4j:region>
			<aon:panelGrid columns="2"
				columnClasses="aon-width-300,aon-width-auto">
				<aon:selectOneMenu id="StopSales_item" value="#{stopSales.item}"
					styleClass="aon-width-300"
					valueChangeListener="#{stopSales.onItemChanged}" 
					reRender="StopSalesItemDiv">
					<f:selectItem itemLabel="#{(stopSales.itemsSize > 0)?'-':bundle.aon_common_all}" value="#{null}"/>
					<c:if test="#{stopSales.to.hotel != null and stopSales.to.hotel.id != null}">
						<f:selectItems value="#{stopSales.hotelRoomItems}" />
					</c:if>
				</aon:selectOneMenu>
				<aon:commandButton id="StopSalesItem-add"
					styleClass="aon-finding-toolbar-item aon-search-add"
					value="&#160;" immediate="true"
					rendered="#{stopSales.item != null}"
					actionListener="#{stopSales.onAddItem}"
					reRender="StopSalesItemDiv" />
			</aon:panelGrid>
		</aon:div>			

		<aon:outputLabel value="#{bundle.product_tariff_module2}" />
		<aon:div id="StopSalesTariffDiv">
			<a4j:region>
				<a4j:repeat value="#{stopSales.tariffs}" rowKeyVar="stopSalesTariffIdx" var="stopSalesTariff">
					<aon:div >
						<aon:panelGrid columns="2" 	
							columnClasses="aon-width-300,aon-width-auto">
							<aon:outputText	value="#{stopSales.tariffs[stopSalesTariffIdx].code} - #{stopSales.tariffs[stopSalesTariffIdx].name}" 
								styleClass="aon-bold" />
							<aon:commandButton id="StopSalesTariff-remove"
								styleClass="aon-finding-toolbar-item aon-search-minus"
								value="&#160;" immediate="true"
								actionListener="#{stopSales.onRemoveTariff}"
								reRender="StopSalesTariffDiv">
								<f:param name="stopSalesTariffIdx" value="#{stopSalesTariffIdx}" />
							</aon:commandButton>
						</aon:panelGrid>
					</aon:div>						
				</a4j:repeat>
			</a4j:region>
			<aon:panelGrid columns="2"
				columnClasses="aon-width-300,aon-width-auto">
				<aon:selectOneMenu id="StopSales_tariff" value="#{stopSales.tariff}"
					styleClass="aon-width-300"
					valueChangeListener="#{stopSales.onTariffChanged}" 
					reRender="StopSalesTariffDiv">
					<f:selectItem itemLabel="#{(stopSales.tariffsSize > 0)?'-':bundle.aon_common_all}" value="#{null}"/>
					<f:selectItems value="#{stopSales.roomTariffs}" />
				</aon:selectOneMenu>
				<aon:commandButton id="StopSalesTariff-add"
					styleClass="aon-finding-toolbar-item aon-search-add"
					value="&#160;" immediate="true"
					rendered="#{stopSales.tariff != null}"
					actionListener="#{stopSales.onAddTariff}"
					reRender="StopSalesTariffDiv" />
			</aon:panelGrid>
		</aon:div>			

		<aon:outputLabel for="StopSales_remarks" value="#{bundle.aon_remark}" />
		<aon:inputTextarea id="StopSales_remarks" value="#{stopSales.to.remarks}"
 			cols="66" rows="4"
			ajaxSingle="true" />

		<aon:outputLabel for="StopSales_active" value="#{bundle.aon_status}" />
		<aon:selectOneRadio id="StopSales_active" value="#{stopSales.to.active}">
			<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="false" />
		</aon:selectOneRadio>				

	</aon:panelGrid>

 </ui:composition>
