<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showPreauthorizationWindow">
		<aon:if test="#{controller.showPreauthorizationWindow}">
			<rich:modalPanel id="preauthorizationModalPanel" minHeight="225" minWidth="525" 
				rendered="#{controller.showPreauthorizationWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.conexflow_preauthorization_current}"
							rendered="#{controller.to.conexFlowPreauthorizedOk}" />
						<aon:outputText value="#{bundle.conexflow_preauthorization_cancelled}"
							rendered="#{controller.to.conexFlowPreauthorizedCancelled}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{reservation.refreshEntireReservation}"
							reRender="showPreauthorizationWindow,showInvoiceWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showPreauthorizationWindow}"
								value="#{false}" />
							<f:setPropertyActionListener
								target="#{controller.showInvoiceWindow}"
								value="#{controller.showInvoiceWindow and !reservation.to.conexFlowPreauthorizedOk}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="preauthorizationForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="preauthorizationModalToolbar" styleClass="aon-toolbar">
									<aon:commandButton id="conexFlow-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										actionListener="#{reservation.refreshEntireReservation}"
										reRender="showPreauthorizationWindow,showInvoiceWindow">
										<f:setPropertyActionListener
											target="#{controller.showPreauthorizationWindow}"
											value="#{false}" />
										<f:setPropertyActionListener
											target="#{controller.showInvoiceWindow}"
											value="#{controller.showInvoiceWindow and !reservation.to.conexFlowPreauthorizedOk}" />
									</aon:commandButton>
								</aon:div>

								<aon:div styleClass="aon-scroll-area aon-margin-top">
									<aon:panelGrid id="creditCardGrid" columns="4" dir="true" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto,
											aon-panelGrid-odd aon-width-80,aon-panelGrid-even aon-width-60">

										<aon:outputLabel value="#{bundle.conexflow_preauthorization}" />
										<aon:div rendered="#{controller.to.conexFlowPreauthorizedOk}">
											<aon:outputText value="#{bundle.aon_current_label}" 
												styleClass="aon-uppercase" />
											<aon:outputLabel value="-" styleClass="aon-margin-left aon-margin-right" />
											<aon:outputText value="#{controller.reservationConexFlow.conexFlowDefaultPayMethod.name}" 
												styleClass="aon-uppercase" />
										</aon:div>
										<aon:outputText value="#{bundle.pms_cancelled}"
											rendered="#{controller.to.conexFlowPreauthorizedCancelled}" />

										<aon:outputLabel value="#{bundle.aon_amount}" />
										<aon:outputText value="#{controller.to.conexFlowOperationAmount}">
											<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
										</aon:outputText>

										<aon:outputLabel value="#{bundle.aon_credit_card_number}" />
										<aon:outputText value="#{controller.to.secureCreditCardNumber}" />

										<aon:outputLabel value="#{bundle.aon_expiration}" />
										<aon:div>
											<aon:outputText value="#{controller.to.creditCardExpirationMonth}" />
											<aon:outputLabel value="/" styleClass="aon-margin-left aon-margin-right" />
											<aon:outputText value="#{controller.to.creditCardExpirationYear}" />
										</aon:div>

									</aon:panelGrid>

								</aon:div>

								<aon:div styleClass="aon-margin-top aon-text-center">
									<aon:commandButton id="preautorization-cancel"
										styleClass="aon-commandButton"
										value="#{bundle.conexflow_preauthorization_cancel}"
										rendered="#{controller.to.conexFlowPreauthorizedOk}"
										actionListener="#{controller.reservationConexFlow.cancelPreauthorization}"
										onclick="Richfaces.showModalPanel('waitProccess')"
										oncomplete="Richfaces.hideModalPanel('waitProccess')"
										reRender="showPreauthorizationWindow,aonContent">
										<f:setPropertyActionListener
											target="#{reservation.to.lastConexFlowOperation}"
											value="#{null}" />
										<f:setPropertyActionListener
											target="#{controller.showPreauthorizationWindow}"
											value="#{false}" />
										<f:setPropertyActionListener
											target="#{controller.showInvoiceWindow}"
											value="#{controller.showInvoiceWindow and !reservation.to.conexFlowPreauthorizedOk}" />
										<aon:actionListener method="#{controller.refreshAttachments}" />
									</aon:commandButton>
								</aon:div>

							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
