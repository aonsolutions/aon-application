<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="webpolExporterList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.pms_webpolExporter_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				<ui:param name="controller" value="#{webpolExporter}" />
				<ui:define name="toolbarContent">
					<h:panelGrid columns="4">
						<aon:outputLabel value="#{bundle.aon_counter}:"
							rendered="#{webpolExporter.model.rowCount>0}" />
						<rich:inputNumberSpinner value="#{webpolExporter.fileCount}"
							rendered="#{webpolExporter.model.rowCount>0}"
							disabled="#{not empty webpolExporter.data}"
			   				inputSize="3" minValue="001" maxValue="999">
			   			</rich:inputNumberSpinner>
						<aon:commandButton id="export" 
							value="#{bundle.aon_generate}"
							rendered="#{webpolExporter.model.rowCount>0 and empty webpolExporter.data}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{webpolExporter.onCreateDisk}"
							reRender="aonStatus, aonToolbar"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						<aon:htmlCommandLink id="download" target="_blank"
							rendered="#{not empty webpolExporter.data}"
							value="#{bundle.aon_fileupload_download}"
							actionListener="#{webpolExporter.onDownloadFile}"
							styleClass="aon-icon-commandButton aon-icon-mail-save aon-margin-left" />
					</h:panelGrid>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>	
					<aon:panelGrid columns="2" 
						columnClasses="aon-panelGrid-odd aon-width-80, aon-panelGrid-even aon-width-auto">
	
						<aon:outputLabel for="webpolExporter_hotel"
							value="#{bundle.aon_module_hotel}" />
						<aon:selectManyListbox id="webpolExporter_hotel"
							style="width:250px;"
							value="#{webpolExporter.hotels}" size="6"
							required="true">
							<f:selectItems value="#{pmsCollections.currentUserHotels}" />
						</aon:selectManyListbox>
	
						<aon:outputLabel value="#{bundle.aon_period}" />
						<aon:div>
							<aon:outputLabel for="webpolExporter_fromDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate id="webpolExporter_fromDate"
								value="#{webpolExporter.fromDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
	
							<aon:outputLabel for="webpolExporter_toDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate id="webpolExporter_toDate"
								value="#{webpolExporter.toDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
						</aon:div>
						
						<aon:outputText value="&#160;" />
						<aon:commandButton id="search" ignoreDupResponses="true"
							value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
							action="webpolExporter_list"
							actionListener="#{webpolExporter.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />
	
					</aon:panelGrid>
				</aon:div>
				
				<rich:spacer/>
				
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{webpolExporter}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					
					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<aon:outputText value="&#160;" 
									title="Faltan datos de la persona"
									rendered="#{controller.invalidGuestData}"
									styleClass="aon-icon-commandButton aon-icon-exception" />
							</aon:div>
							<f:facet name="footer">
								<aon:outputText value="#{controller.model.rowCount}" />
							</f:facet>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-80 aon-nowrap">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.registry_nationality}" />
							</f:facet>
							<aon:outputText value="#{to.documentCountry.value}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-80 aon-nowrap">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_document_type}" />
							</f:facet>
							<aon:outputText value="#{to.documentType}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-100 aon-nowrap">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_document}" />
							</f:facet>
							<aon:outputText value="#{to.document}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-dateColumn aon-vertical-align-top aon-width-100 aon-nowrap">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_expedition_date}" />
							</f:facet>
							<aon:outputText value="#{to.documentExpDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-auto aon-nowrap">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.name}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-auto aon-nowrap">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_surname_1}" />
							</f:facet>
							<aon:outputText value="#{to.surname}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-auto aon-nowrap">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_surname_2}" />
							</f:facet>
							<aon:outputText value="#{to.surname2}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-dateColumn aon-vertical-align-top aon-width-100 aon-nowrap">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.registry_person_birthDate}" />
							</f:facet>
							<aon:outputText value="#{to.birthDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:commandButton id="person-edit"
								value="&#160;" title="#{bundle.aon_reservation}"
								action="reservation_form"
								styleClass="aon-icon-commandButton aon-button-goto aon-bold aon-italic"
								actionListener="#{webpolExporter.onLoadReservation}" />
						</aon:column>
					</ui:define>
			
					<ui:define name="endFormListContent">
						<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
							<ui:param name="auditableTO" value="#{to}" />
						</ui:include>
					</ui:define>
			
				</ui:decorate>
			</aon:div>

		</aon:form>
		
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
				
	</ui:define>

</ui:composition>
