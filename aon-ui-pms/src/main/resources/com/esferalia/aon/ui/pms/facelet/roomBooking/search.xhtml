<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="roomBookingSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.pms_room_booking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_search}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>	

					<aon:panelGrid columns="2" style="width:100%;"
						columnClasses="aon-panelGrid-odd aon-width-50, 
						aon-panelGrid-even aon-width-auto">

						<aon:outputLabel for="RoomBooking_hotels"
							value="#{bundle.aon_module_hotel}" />
						<aon:panelGrid columns="5"
							columnClasses="aon-panelGrid-even aon-width-200,aon-panelGrid-odd aon-width-50,
								aon-panelGrid-even aon-width-200,aon-panelGrid-odd aon-width-50,aon-panelGrid-even aon-width-200">

							<aon:selectManyListbox id="RoomBooking_hotels"
								style="width:250px;"
								value="#{roomBooking.hotels}" size="10"
								required="true">
								<f:selectItems value="#{pmsCollections.currentUserHotels}" />
							</aon:selectManyListbox>
							<aon:outputLabel for="RoomBooking_items" 
								value="#{bundle.pms_room_type}" />
							<aon:selectManyListbox id="RoomBooking_items"
								style="width:250px;"
								value="#{roomBooking.items}" size="10">
								<f:selectItems value="#{roomBooking.hotelRoomItems}" />
							</aon:selectManyListbox>
							<aon:outputLabel for="RoomBooking_agencies" 
								value="#{bundle.report_agency}" />
							<aon:selectManyListbox id="RoomBooking_agencies"
								style="width:250px;"
								value="#{roomBooking.agencies}" size="10">
								<f:selectItems value="#{pmsCollections.agencies}" />
							</aon:selectManyListbox>

						</aon:panelGrid>

						<aon:outputText value="#{bundle.aon_date}" />
						<aon:div>
							<aon:outputLabel for="RoomBooking_startDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate id="RoomBooking_startDate"
								value="#{roomBooking.fromDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>

							<aon:outputLabel for="RoomBooking_endDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate id="RoomBooking_endDate"
								value="#{roomBooking.toDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
						</aon:div>

						<aon:outputText value="&#160;"/>
						<aon:div>
							<aon:selectBooleanCheckbox id="RoomBooking_showCancelled" 
								value="#{roomBooking.showCancelled}" />
							<aon:outputLabel for="RoomBooking_showCancelled"
								value="#{bundle.pms_show_cancelled_rooms}"/>
						</aon:div>

						<aon:outputText value="&#160;" />
						<aon:commandButton id="search" ignoreDupResponses="true"
							value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
							action="roomBooking_list"
							actionListener="#{roomBooking.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							
					</aon:panelGrid>
				</aon:div>
			</aon:div>
			
		</aon:form>
		
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
	</ui:define>
</ui:composition>
