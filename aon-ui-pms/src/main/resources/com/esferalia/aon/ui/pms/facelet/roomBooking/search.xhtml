<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="roomBookingSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.report_booking_list}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_search}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>	

					<aon:panelGrid columns="2"  style="width:100%;"
						columnClasses="aon-panelGrid-odd aon-width-50, 
						aon-panelGrid-even aon-width-auto">

						<aon:outputLabel for="RoomBooking_hotel_id"
							value="#{bundle.aon_module_hotel}" />
						<aon:selectOneMenu id="RoomBooking_hotel_id"
							value="#{roomBooking.hotel}" >
							<f:selectItem itemLabel="-" itemValue="null" />
							<f:selectItems value="#{pmsCollections.currentUserHotels}" />
							<a4j:support event="onchange" reRender="RoomBooking_item_id" ignoreDupResponses="true" />
							<a4j:support event="oninputchanged" reRender="RoomBooking_item_id" ignoreDupResponses="true" />	
						</aon:selectOneMenu>

						<aon:outputLabel for="RoomBooking_item_id"
							value="#{bundle.pms_room_type}" />
						<aon:selectOneMenu id="RoomBooking_item_id"
							value="#{roomBooking.item}" >
							<f:selectItem itemLabel="-" itemValue="#{null}" />
							<f:selectItems value="#{roomBooking.hotelRoomItems}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="RoomBooking_agency" 
							value="#{bundle.report_agency}" />
						<aon:selectOneMenu id="RoomBooking_agency" 
							value="#{roomBooking.agency}"
							styleClass="aon-width-350">
							<f:selectItem itemLabel="-" value="#{null}" />		
							<f:selectItems value="#{pmsCollections.agencies}" />
						</aon:selectOneMenu>

						<aon:outputText value="#{bundle.aon_date}" />
						<aon:div>
							<aon:outputLabel for="RoomBooking_startDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate id="RoomBooking_startDate"
								value="#{roomBooking.fromDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>

							<aon:outputLabel for="RoomBooking_endDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate id="RoomBooking_endDate"
								value="#{roomBooking.toDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
						</aon:div>

						<aon:outputText value="&#160;" />
						<aon:commandButton id="search" ignoreDupResponses="true"
							value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
							action="roomBooking_list"
							actionListener="#{roomBooking.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							
					</aon:panelGrid>
				</aon:div>
			</aon:div>
			
		</aon:form>
		
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
	</ui:define>
</ui:composition>
