<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showInvoiceWindow">
		<aon:if test="#{controller.showInvoiceWindow}">
			<rich:modalPanel id="invoiceModalPanel" minHeight="340" minWidth="580" 
				rendered="#{controller.showInvoiceWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.pms_advance_invoice_module}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showInvoiceWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showInvoiceWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="invoiceForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="invoiceModalToolbar" styleClass="aon-toolbar">
									<aon:commandButton id="invoice-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_key_invoice_description}"
										actionListener="#{controller.onAdvanceInvoice}"
										reRender="aonContent"
										onclick="Richfaces.showModalPanel('waitProccess')"
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="invoiceModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="invoice-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										reRender="showInvoiceWindow">
										<f:setPropertyActionListener
											target="#{controller.showInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div id="invoiceModalContent" styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">

										<aon:outputLabel for="AdvanceInvoice_issueDate"
											value="#{bundle.finance_invoice_date}" />
										<aon:selectInputDate id="AdvanceInvoice_issueDate" 
											value="#{controller.advanceDate}" required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}">
											<a4j:support ajaxSingle="true" event="oninputchange"
												reRender="AdvanceInvoice_dueDate"
												focus="AdvanceInvoice_percent" />
											<a4j:support ajaxSingle="true" event="onchanged"
												reRender="AdvanceInvoice_dueDate"
												focus="AdvanceInvoice_percent" />
										</aon:selectInputDate>

										<aon:if test="#{!searchListener.guestReservationSearch}">
											<aon:div id="AdvanceInvoice_modeLabel">
												<aon:outputLabel for="AdvanceInvoice_amount"
													value="#{bundle.pms_invoice_amount}"
													rendered="#{!controller.percent}" />
												<aon:outputLabel for="AdvanceInvoice_percent"
													value="#{bundle.pms_invoice_percent}"
													rendered="#{controller.percent}" />
											</aon:div>

											<aon:panelGrid id="AdvanceInvoice_mode" columns="2" styleClass="aon-width-all"
												columnClasses="aon-width-130 aon-width-auto">

												<aon:inputText id="AdvanceInvoice_amount" 
													value="#{controller.advanceAmount}" 
													required="true" size="10"
													rendered="#{!controller.percent}" 
													ajaxSingle="true">
													<f:validateDoubleRange minimum="1" />
												</aon:inputText>
												<aon:commandButton id="AdvanceInvoice_percentMode" immediate="true"
													value="&#160;" styleClass="aon-icon-percentage aon-icon-commandButton aon-noborder"
													title="#{bundle.pms_change_to_percent}"
													rendered="#{!controller.percent}" 
													actionListener="#{controller.onAdvancePercentMode}"
													reRender="AdvanceInvoice_modeLabel,AdvanceInvoice_mode" />

												<aon:inputText id="AdvanceInvoice_percent" 
													value="#{controller.advancePercent}" 
													required="true" size="3" maxlength="3"
													rendered="#{controller.percent}" 
													ajaxSingle="true">
													<f:validateDoubleRange minimum="1" maximum="100" />
												</aon:inputText>
												<aon:commandButton id="AdvanceInvoice_amountMode" immediate="true"
													value="&#160;" styleClass="aon-icon-pay aon-icon-commandButton aon-noborder"
													title="#{bundle.pms_change_to_amount}"
													rendered="#{controller.percent}" 
													actionListener="#{controller.onAdvanceAmountMode}"
													reRender="AdvanceInvoice_modeLabel,AdvanceInvoice_mode" />

											</aon:panelGrid>
										</aon:if>

										<aon:outputLabel for="AdvanceInvoice_payMethod"
											value="#{bundle.finance_payMethod}" />
										<aon:selectOneMenu id="AdvanceInvoice_payMethod"
											value="#{controller.advancePayMethod}" required="true"
											reRender="invoiceModalContent" ajaxSingle="true">
											<f:selectItems value="#{configCollections.payMethods}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="AdvanceInvoice_bank"
											rendered="#{controller.bankRequired}"
											value="#{bundle.aon_bank}" />
										<aon:selectOneMenu id="AdvanceInvoice_bank"
											rendered="#{controller.bankRequired}"
											value="#{controller.advanceBank}" required="true"
											ajaxSingle="true">
											<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="AdvanceInvoice_daysToPayment"
											value="#{bundle.registry_days_to_first_payment}" />
										<aon:panelGroup>
											<aon:inputText id="AdvanceInvoice_daysToPayment"
												value="#{controller.advanceDaysToPayment}"
												required="true" size="3" maxlength="3"
												reRender="AdvanceInvoice_dueDate" ajaxSingle="true"> 
												<f:validateDoubleRange minimum="0" />
											</aon:inputText>

											<aon:outputText value="#{bundle.finance_pay_date}" 
												styleClass="aon-italic aon-margin-left"/>
											<aon:outputText id="AdvanceInvoice_dueDate" 
												value="#{controller.advancePaymentDate}" 
												styleClass="aon-italic aon-bold aon-margin-left">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:panelGroup>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
