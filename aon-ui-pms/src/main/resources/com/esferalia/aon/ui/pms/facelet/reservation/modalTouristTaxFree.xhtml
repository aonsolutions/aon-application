<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showTouristTaxFreeWindow">
		<aon:if test="#{controller.showTouristTaxFreeWindow}">
			<rich:modalPanel id="touristTaxFreeModalPanel" minHeight="170" minWidth="450" 
				rendered="#{controller.showTouristTaxFreeWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.pms_tourist_tax_free}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showTouristTaxFreeWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showTouristTaxFreeWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="touristTaxFreeForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="touristTaxFreeModalToolbar" styleClass="aon-toolbar">
									<aon:commandButton id="touristTaxFree-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{controller.onTouristTaxFree}"
										reRender="aonContent"
										onclick="Richfaces.showModalPanel('waitProccess')"
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="touristTaxFreeModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showTouristTaxFreeWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="touristTaxFree-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										reRender="showTouristTaxFreeWindow">
										<f:setPropertyActionListener
											target="#{controller.showTouristTaxFreeWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div id="touristTaxFreeModalContent" styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">

										<aon:outputLabel for="TouristTaxFree_cause"
											value="#{bundle.finance_cause}" />
										<aon:selectOneMenu id="TouristTaxFree_cause"
											value="#{controller.reservationInvoiceTo.touristTaxFreeCause}" required="true">
											<f:selectItems value="#{pmsCollections.touristTaxFreeCauses}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
