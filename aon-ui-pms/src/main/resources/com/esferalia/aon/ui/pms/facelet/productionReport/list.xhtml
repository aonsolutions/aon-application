<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<a4j:region>
			<h:form>
				<a4j:poll status="aonStatus" interval="15000" reRender="productionReport-list" />
			</h:form>
		</a4j:region>
	
		<aon:form id="productionReport-list">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.pms_productionReport_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				<ui:param name="controller" value="#{productionReport}" />
				<ui:define name="toolbarContent">
					<aon:htmlCommandLink id="excel-report"
						value="#{bundle.webmail_download}"
						rendered="#{!productionReport.nevv}"
						target="_blank" action="#{productionReport.onExcelReport}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>	
					<aon:panelGrid columns="2" 
						columnClasses="aon-panelGrid-odd aon-width-80, aon-panelGrid-even aon-width-auto">
	
						<aon:outputLabel for="productionReport_hotel"
							value="#{bundle.aon_module_hotel}" />
						<aon:selectOneMenu id="productionReport_hotel"
							value="#{productionReport.hotel}" required="true">
							<f:selectItem itemLabel="-" value="#{null}" />		
							<f:selectItems value="#{pmsCollections.currentUserHotels}" />
						</aon:selectOneMenu>
						
						<aon:outputLabel for="productionReport_date"
							value="#{bundle.aon_date}" />
						<aon:selectInputDate id="productionReport_date"
							value="#{productionReport.date}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						
						<aon:outputText value="&#160;" />
						<aon:commandButton id="search" ignoreDupResponses="true"
							value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
							action="productionReport_list"
							actionListener="#{productionReport.onSearch}"
							reRender="productionReport-list"
							accesskey="#{bundle.aon_key_search}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />
	
					</aon:panelGrid>
				</aon:div>
			
				<aon:div id="productionReport-listData">
					<ui:decorate template="/com/esferalia/aon/ui/pms/facelet/productionReport/list_detail.xhtml">
						<ui:param name="model" value="#{productionReport.productionModel}" />
						<ui:param name="tableHeader" value="FACTURACION POR AREA" />
						<ui:param name="name" value="PRODUCCION" />
						<ui:param name="totalTo" value="#{productionReport.productionTotal}" />
						<ui:param name="testing" value="#{productionReport.testingProductionQuery}" />
					</ui:decorate>
					
					<ui:decorate template="/com/esferalia/aon/ui/pms/facelet/productionReport/list_detail.xhtml">
						<ui:param name="model" value="#{productionReport.pendingProductionModel}" />
						<ui:param name="tableHeader" value="PRODUCCION" />
						<ui:param name="skipHeaders" value="#{true}" />
						<ui:param name="skipFooters" value="#{true}" />
						<ui:param name="testing" value="#{productionReport.testingPendingQuery}" />
					</ui:decorate>
	
					<ui:decorate template="/com/esferalia/aon/ui/pms/facelet/productionReport/list_detail.xhtml">
						<ui:param name="model" value="#{productionReport.paxModel}" />
						<ui:param name="tableHeader" value="PAX" />
						<ui:param name="skipHeaders" value="#{true}" />
						<ui:param name="skipFooters" value="#{true}" />
						<ui:param name="skipTableHeader" value="#{true}" />
						<ui:param name="amountPattern" value="#{bundle.aon_integer_pattern}" />
						<ui:param name="testing" value="#{productionReport.testingPaxQuery}" />
					</ui:decorate>
					
					<ui:decorate template="/com/esferalia/aon/ui/pms/facelet/productionReport/list_detail.xhtml">
						<ui:param name="model" value="#{productionReport.ratioModel}" />
						<ui:param name="tableHeader" value="RATIOS" />
						<ui:param name="skipHeaders" value="#{true}" />
						<ui:param name="totalTo" value="#{productionReport.ratioTotal}" />
					</ui:decorate>
					
					<ui:decorate template="/com/esferalia/aon/ui/pms/facelet/productionReport/list_detail.xhtml">
						<ui:param name="model" value="#{productionReport.advancePaymethodModel}" />
						<ui:param name="tableHeader" value="FACTURAS ANTICIPO" />
						<ui:param name="totalTo" value="#{productionReport.advancePaymethodTotal}" />
						<ui:param name="testing" value="#{productionReport.testingPaymethodQuery}" />
					</ui:decorate>
					
					<ui:decorate template="/com/esferalia/aon/ui/pms/facelet/productionReport/list_detail.xhtml">
						<ui:param name="model" value="#{productionReport.paymethodModel}" />
						<ui:param name="tableHeader" value="FACTURAS" />
						<ui:param name="name" value="Forma de pago" />
						<ui:param name="totalTo" value="#{productionReport.paymethodTotal}" />
						<ui:param name="testing" value="#{productionReport.testingPaymethodQuery}" />
					</ui:decorate>
					
					<ui:decorate template="/com/esferalia/aon/ui/pms/facelet/productionReport/list_detail.xhtml">
						<ui:param name="model" value="#{productionReport.summaryModel}" />
						<ui:param name="tableHeader" value="RESUMEN" />
						<ui:param name="skipHeaders" value="#{true}" />
						<ui:param name="skipFooters" value="#{true}" />
						<ui:param name="defaultEmpty" value="#{true}" />
						<ui:param name="amountPattern" value="" />
					</ui:decorate>
					
				</aon:div>
				
			</aon:div>

		</aon:form>
		
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
				
	</ui:define>

</ui:composition>
