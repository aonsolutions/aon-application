<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="earlyCheckOutPaymentTotalDiv" 
		styleClass="aon-group aon-width-all" style="margin-top: 2em;"
		rendered="#{!empty controller.totalSummary}" ajaxRendered="true">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{bundle.aon_total} #{bundle.pms_liquidation}" styleClass="aon-uppercase" />
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
				<aon:dataTable id="earlyCheckOutPaymentTotalList"
					value="#{controller.totalSummary}" var="earlyCheckOutTotalSummary">

					<aon:column styleClass="aon-width-auto aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.finance_payMethod}" />
						</f:facet>
						<aon:outputText value="#{earlyCheckOutTotalSummary.payMethod.name}" />
					</aon:column>

					<aon:column styleClass="aon-width-100 aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_reservation}" />
						</f:facet>
						<aon:outputText value="#{earlyCheckOutTotalSummary.reservationAmountAbs}"
							styleClass="#{(earlyCheckOutTotalSummary.reservationAmount >= 0) ? ('aon-label-info') : ('aon-label-error')}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-width-100 aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.pms_services}" />
						</f:facet>
						<aon:outputText value="#{earlyCheckOutTotalSummary.servicesAmountAbs}"
							styleClass="#{(earlyCheckOutTotalSummary.servicesAmount >= 0) ? ('aon-label-info') : ('aon-label-error')}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-bold aon-text-right" style="font-size: 0.9em;">
								<aon:outputText value="#{bundle.aon_total}" styleClass="aon-uppercase" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column styleClass="aon-width-100 aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.pms_liquidation}" />
						</f:facet>
						<aon:outputText value="#{earlyCheckOutTotalSummary.totalAmountAbs}"
							styleClass="#{(earlyCheckOutTotalSummary.totalAmount >= 0) ? ('aon-label-info') : ('aon-label-error')}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-bold aon-text-right" style="font-size: 0.9em;">
								<aon:outputText value="#{controller.totalAmountAbs}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

				</aon:dataTable>
			</aon:div>
		</aon:div>
	</aon:div>

</ui:composition>
