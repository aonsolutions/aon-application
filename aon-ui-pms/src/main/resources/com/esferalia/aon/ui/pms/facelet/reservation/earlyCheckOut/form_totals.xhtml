<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="earlyCheckOutPaymentTotalDiv" 
		styleClass="aon-group aon-width-all" style="margin-top: 2em;"
		ajaxRendered="true">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{bundle.aon_total} #{bundle.pms_liquidation}" styleClass="aon-uppercase" />
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
				<aon:dataTable id="earlyCheckOutPaymentTotalList"
					value="#{controller.totalSummary}" var="earlyCheckOutTotalSummary">

					<aon:column styleClass="aon-width-auto aon-editDataTable-textColumn">
						<aon:outputText value="#{(!earlyCheckOutTotalSummary.service) ? bundle.aon_reservation : bundle.pms_services}" 
							styleClass="aon-uppercase" />
					</aon:column>

					<aon:column styleClass="aon-width-100 aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.pms_total_to_return}" />
						</f:facet>
						<aon:outputText value="#{earlyCheckOutTotalSummary.returnAmount}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-width-100 aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.pms_total_to_charge}" />
						</f:facet>
						<aon:outputText value="#{earlyCheckOutTotalSummary.paymentAmount}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
					</aon:column>

					<aon:column styleClass="aon-width-100 aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.pms_liquidation}" />
						</f:facet>
						<aon:outputText value="#{earlyCheckOutTotalSummary.liquidationAmountAbs}"
							styleClass="#{(earlyCheckOutTotalSummary.liquidationAmount >= 0) ? ('aon-label-info') : ('aon-label-error')}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
					</aon:column>

				</aon:dataTable>
			</aon:div>
		</aon:div>
	</aon:div>

</ui:composition>
