<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="paymentTotalsDiv" styleClass="aon-group" style="width: 100%; margin-top: 2em;" ajaxRendered="true">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{pmsBundle.pms_totals}"/>
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
				<aon:dataTable id="paymentTotalsList"
					value="#{controller.totals}" var="paymentTotal">

					<aon:column styleClass="aon-panelGrid-odd aon-width-100 aon-editDataTable-textColumn">
						<aon:outputLabel value="#{configBundle.config_pay_method}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-180 aon-editDataTable-textColumn">
						<aon:outputText value="#{paymentTotal.payMethod.name}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-odd aon-width-80 aon-editDataTable-textColumn">
						<aon:outputLabel value="#{(paymentTotal.totalAmount >= 0) ? (pmsBundle.pms_total_to_pay) : (pmsBundle.pms_total_to_return)}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-auto aon-editDataTable-textColumn">
						<aon:outputText value="#{paymentTotal.totalAmountAbs}"
							styleClass="#{(paymentTotal.totalAmount >= 0) ? ('aon-label-info') : ('aon-label-error')}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText	value="&#160;" styleClass="aon-margin-left aon-icon-commandButton aon-icon-info" />
						<rich:toolTip showEvent="onclick" hideEvent="onmouseout" direction="bottom-left">
							<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-80,aon-noborder aon-bold aon-text-right">
								<aon:outputLabel value="#{pmsBundle.pms_returns}:" />
								<aon:outputText	value="#{paymentTotal.totalReturnAmount}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>

								<aon:outputLabel value="#{pmsBundle.pms_payments}:" />
								<aon:outputText	value="#{paymentTotal.paymentAmount}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:panelGrid>
						</rich:toolTip>
					</aon:column>

				</aon:dataTable>
			</aon:div>
		</aon:div>
	</aon:div>

</ui:composition>
