<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="paymentReturnsDiv" styleClass="aon-group" style="width: 100%; margin-top: 2em;">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{pmsBundle.pms_returns}"/>
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
				<aon:panelGrid columns="5" styleClass="aon-margin-bottom aon-noborder"
					columnClasses="aon-width-120,aon-width-120,aon-width-70,aon-width-120,aon-width-auto">
					<aon:outputText value="&#160;" />
					<aon:outputText value="#{bundle.aon_reservation}:" styleClass="aon-bold" />
					<aon:div>
						<aon:outputText value="#{controller.reservationReturnAmount}" styleClass="aon-bold">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText value=" €" styleClass="aon-bold" />
					</aon:div>
					<aon:outputText value="#{pmsBundle.pms_services}:" styleClass="aon-bold" />
					<aon:div>
						<aon:outputText value="#{controller.servicesReturnAmount}" styleClass="aon-bold">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText value=" €" styleClass="aon-bold" />
					</aon:div>
				</aon:panelGrid>

				<aon:dataTable id="paymentReturnsList"
					value="#{controller.returns}" var="paymentReturn">

					<aon:column styleClass="aon-panelGrid-odd aon-width-100 aon-editDataTable-textColumn">
						<aon:outputLabel value="#{bundle.finance_payMethod}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-180 aon-editDataTable-textColumn">
						<aon:outputText value="#{paymentReturn.payMethod.name}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-odd aon-width-80 aon-editDataTable-textColumn">
						<aon:outputLabel value="#{pmsBundle.pms_total_to_return}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-auto aon-editDataTable-textColumn">
						<aon:outputText value="#{paymentReturn.totalReturnAmount}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText	value="&#160;" styleClass="aon-margin-left aon-icon-commandButton aon-icon-info" />
						<rich:toolTip showEvent="onclick" hideEvent="onmouseout" direction="bottom-left">
							<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-80,aon-noborder aon-bold aon-text-right">
								<aon:outputLabel value="#{bundle.aon_reservation}:"
									rendered="#{paymentReturn.reservationReturnAmount != 0}" />
								<aon:outputText	value="#{paymentReturn.reservationReturnAmount}"
									rendered="#{paymentReturn.reservationReturnAmount != 0}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>

								<aon:outputLabel value="#{pmsBundle.pms_services}:"
									rendered="#{paymentReturn.servicesReturnAmount != 0}" />
								<aon:outputText	value="#{paymentReturn.servicesReturnAmount}"
									rendered="#{paymentReturn.servicesReturnAmount != 0}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:panelGrid>
						</rich:toolTip>
					</aon:column>

				</aon:dataTable>

				<aon:panelGrid columns="3" styleClass="aon-margin-top aon-noborder"
					columnClasses="aon-width-120,aon-width-120,aon-width-auto">
					<aon:outputText value="&#160;" />
					<aon:outputText value="#{pmsBundle.pms_total_returns}:" styleClass="aon-bold" />
					<aon:div>
						<aon:outputText value="#{controller.returnsAmount}" styleClass="aon-bold">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText value=" €" styleClass="aon-bold" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
		</aon:div>
	</aon:div>

</ui:composition>
