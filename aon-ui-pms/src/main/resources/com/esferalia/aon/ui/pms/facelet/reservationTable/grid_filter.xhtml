<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<aon:div styleClass="aon-panelGrid-search">
		<aon:div styleClass="aon-panelGrid-search-info">
			<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
		</aon:div>	
		
		<aon:div styleClass="aon-text-center aon-margin-bottom" >
			<aon:commandButton id="prev" ignoreDupResponses="true"
				value="Anterior"
				reRender="availableRoomTable, filter"
				styleClass="aon-commandButton font-small"
				actionListener="#{controller.decreaseStartDate}" />
			<aon:selectOneMenu 
				styleClass="aon-margin-left aon-margin-right"
				value="#{controller.filterParams.startDateIncrease}" >
				<f:selectItem itemLabel="Dia" itemValue="1" />
				<f:selectItem itemLabel="Semana" itemValue="7" />
				<f:selectItem itemLabel="Mes" itemValue="30" />
			</aon:selectOneMenu>
			<aon:commandButton id="next" ignoreDupResponses="true"
				value="Siguiente"
				reRender="availableRoomTable, filter"
				styleClass="aon-commandButton font-small"
				actionListener="#{controller.increaseStartDate}" />
		</aon:div>
				
		<aon:panelGrid columns="2"  style="width:100%;"
			columnClasses="aon-panelGrid-odd aon-width-50, 
			aon-panelGrid-even aon-width-auto">
			
				<aon:outputLabel value="#{pmsBundle.pms_hotel}" />
				<aon:selectOneMenu id="Room_hotel"
					value="#{controller.filterParams.hotel}" >
					<f:selectItem itemLabel=" - " itemValue="#{null}" />
					<f:selectItems value="#{pmsCollections.currentUserHotels}" />
					<a4j:support event="onchange" reRender="availableRoomTable" ignoreDupResponses="true">
						<aon:actionListener method="#{controller.reloadViewer}" />
					</a4j:support>
					<a4j:support event="oninputchanged" reRender="availableRoomTable" ignoreDupResponses="true">
						<aon:actionListener method="#{controller.reloadViewer}" />
					</a4j:support>
				</aon:selectOneMenu>
			
				<aon:outputLabel 
					value="#{bundle.aon_start_date}" />
				<aon:selectInputDate  
					value="#{controller.filterParams.viewerStartDate}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
					<a4j:support event="onchanged" reRender="availableRoomTable" ignoreDupResponses="true">
						<aon:actionListener method="#{controller.reloadViewer}" />
					</a4j:support>
					<a4j:support event="oninputchange" reRender="availableRoomTable" ignoreDupResponses="true">
						<aon:actionListener method="#{controller.reloadViewer}" />
					</a4j:support>
				</aon:selectInputDate>
				
				<aon:outputLabel value="#{assetBundle.asset_filter_availability}" />
				<h:panelGrid columns="2" >
					<rich:inputNumberSpinner 
						value="#{controller.filterParams.assetAvailability}" inputSize="2" >
						<a4j:support event="onchange" reRender="availableRoomTable" ignoreDupResponses="true">
							<aon:actionListener method="#{controller.reloadViewer}" />
						</a4j:support>
						<a4j:support event="oninputchanged" reRender="availableRoomTable" ignoreDupResponses="true">
							<aon:actionListener method="#{controller.reloadViewer}" />
						</a4j:support>
			  		</rich:inputNumberSpinner>
					<aon:outputText styleClass="aon-margin-left" 
						value="#{assetBundle.asset_activity_days}" />
				</h:panelGrid>
				
				<aon:outputLabel value="#{bundle.aon_type}" />
				<aon:selectOneMenu id="Room_item"
					value="#{controller.filterParams.item}" >
					<f:selectItem itemLabel=" - " itemValue="#{null}" />
					<f:selectItems value="#{pmsCollections.roomItems}" />
					<a4j:support event="onchange" reRender="availableRoomTable" ignoreDupResponses="true">
						<aon:actionListener method="#{controller.reloadViewer}" />
					</a4j:support>
					<a4j:support event="oninputchanged" reRender="availableRoomTable" ignoreDupResponses="true">
						<aon:actionListener method="#{controller.reloadViewer}" />
					</a4j:support>
				</aon:selectOneMenu>
				
				<aon:outputText value="&#160;" />
				<hr />
				
				<aon:outputLabel 
					value="#{assetBundle.asset_features}" />
				<aon:div>
					<aon:selectManyCheckbox layout="pageDirection" 
						value="#{controller.filterParams.featureFilter}" >
						<f:selectItems value="#{controller.featuresList}" />
					</aon:selectManyCheckbox>
					<aon:commandButton id="addFeature" ignoreDupResponses="true"
						value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
						reRender="availableRoomTable, filter" 
						actionListener="#{controller.reloadViewer}" />
				</aon:div>
			
		</aon:panelGrid>

	</aon:div>	
		
</ui:composition>
