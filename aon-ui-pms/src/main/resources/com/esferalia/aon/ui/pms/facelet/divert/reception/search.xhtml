<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="divertReceptionSearch">
			
			<ui:include	src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_divertReception_module}" />
				<ui:param name="controller" value="#{divertReception}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>
			
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{divertReception}" />
				<ui:param name="searchController" value="#{divertReceptionSearch}" />

				<ui:define name="searchContent">
					<aon:outputLabel for="ProjectReservationDivert_divertDate" 
						value="#{bundle.aon_date}" />
					<aon:div id="ProjectReservationDivert_divertDate">
						<aon:outputLabel for="ProjectReservationDivert_divertDate-From"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="ProjectReservationDivert_divertDate-From"
							valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="ProjectReservationDivert_divertDate-To"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="ProjectReservationDivert_divertDate-To"
							valueChangeListener="#{controller.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
				
					<aon:outputText value="#{bundle.aon_status}"/>
					<aon:selectManyCheckbox value="#{searchController.reservationDivertStatuses}">
						<f:selectItems value="#{pmsCollections.reservationDivertStatuses}"/>
					</aon:selectManyCheckbox>	
				</ui:define>
			</ui:decorate>
			
		</aon:form>
		
	</ui:define>
</ui:composition>
