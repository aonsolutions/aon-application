<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">

	<aon:panelGrid id="FinanceSearchPanel"
		columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">

		<c:if test="#{!skipAgency}">
			<aon:outputLabel value="&#160;" rendered="#{paymentCardSettle.agenciesSize > 0}" />
			<aon:div id="agenciesDiv" rendered="#{paymentCardSettle.agenciesSize > 0}">
				<a4j:repeat value="#{paymentCardSettle.agencies}" var="agency" rowKeyVar="agencyIdx">
					<aon:div>
						<aon:panelGrid columns="2" 	
							columnClasses="aon-width-350,aon-width-auto">
							<aon:outputText value="#{agency.registry.name}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
							<aon:commandButton id="PaymentCardFinanceAgency-remove"
								styleClass="aon-finding-toolbar-item aon-search-minus"
								value="&#160;" immediate="true"
								actionListener="#{paymentCardSettle.onRemoveAgency}"
								reRender="FinanceSearchPanel">
								<f:param name="agencyIdx" value="#{agencyIdx}" />
							</aon:commandButton>
						</aon:panelGrid>
					</aon:div>						
				</a4j:repeat>
			</aon:div>

			<aon:outputLabel for="PaymentCardFinance_agency" 
				value="#{bundle.report_agency}" />
			<aon:div id="PaymentCardFinanceAgencyDiv">
				<aon:selectOneMenu id="PaymentCardFinance_agency"
					value="#{paymentCardSettle.agency}"
					styleClass="aon-width-350"
					required="#{paymentCardSettle.agenciesSize == 0}">
				 	<a4j:support event="onchange" reRender="PaymentCardFinanceAgencyDiv" />
					<f:selectItem itemLabel="-" value="#{null}" />		
					<f:selectItems value="#{pmsCollections.agencies}" />
				</aon:selectOneMenu>
				<aon:commandButton id="PaymentCardFinanceAgency-add"
					styleClass="aon-finding-toolbar-item aon-search-add"
					value="&#160;" immediate="true"
					rendered="#{paymentCardSettle.agency.id != null}"
					actionListener="#{paymentCardSettle.onAddAgency}"
					reRender="FinanceSearchPanel" />
			</aon:div>					
		</c:if>

		<aon:outputLabel for="PaymentCardFinance_hotel" 
			value="#{bundle.aon_module_hotel}" />
		<aon:selectOneMenu id="PaymentCardFinance_hotel" 
			value="#{paymentCardSettle.hotel}" >
			<f:selectItem itemLabel=" - " itemValue="#{null}" />
			<f:selectItems value="#{pmsCollections.currentUserHotels}" />
		</aon:selectOneMenu>
		
		<aon:outputLabel value="&#160;" rendered="#{paymentCardSettle.referenceCodesSize > 0}" />
		<aon:div id="referencesCodesDiv" rendered="#{paymentCardSettle.referenceCodesSize > 0}">
			<a4j:repeat value="#{paymentCardSettle.referenceCodes}" var="referenceCode" rowKeyVar="referenceCodeIdx">
				<aon:div>
					<aon:panelGrid columns="2" 	
						columnClasses="aon-width-150,aon-width-auto">
						<aon:outputText value="#{referenceCode}" />
						<aon:commandButton id="PaymentCardFinance_invoiceReferenceCode-remove"
							styleClass="aon-finding-toolbar-item aon-search-minus"
							value="&#160;" immediate="true"
							actionListener="#{paymentCardSettle.onRemoveReferenceCode}"
							reRender="FinanceSearchPanel">
							<f:param name="referenceCodeIdx" value="#{referenceCodeIdx}" />
						</aon:commandButton>
					</aon:panelGrid>
				</aon:div>						
			</a4j:repeat>
		</aon:div>
		<aon:outputLabel for="PaymentCardFinance_invoiceReferenceCode" 
			value="#{bundle.aon_invoice_number}" />
		<aon:div id="PaymentCardFinance_invoiceReferenceCode-Div">
			<aon:inputText id="PaymentCardFinance_invoiceReferenceCode"
				value="#{paymentCardSettle.referenceCode}" size="23" >
				<a4j:support event="onkeyup" ignoreDumpResponses="true" requestDelay="500" 
					reRender="PaymentCardFinance_invoiceReferenceCode-Div" />
			</aon:inputText>
			<aon:commandButton id="PaymentCardFinance_invoiceReferenceCode-add"
				styleClass="aon-finding-toolbar-item aon-search-add"
				value="&#160;" immediate="true"
				rendered="#{not empty paymentCardSettle.referenceCode}"
				actionListener="#{paymentCardSettle.onAddReferenceCode}"
				reRender="FinanceSearchPanel" />
		</aon:div>

		<aon:outputLabel value="#{bundle.finance_invoice_date}" />
		<aon:div>
			<aon:outputLabel for="PaymentCardFinance_issueDateFrom"
				styleClass="aon-italic aon-margin-left aon-margin-right" 
				value="#{bundle.aon_date_from}" />
			<aon:selectInputDate id="PaymentCardFinance_issueDateFrom"
				value="#{paymentCardSettle.issueDateFrom}" 
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
			<aon:outputLabel for="PaymentCardFinance_issueDateTo"
				styleClass="aon-italic aon-margin-left aon-margin-right" 
				value="#{bundle.aon_date_to}" />
			<aon:selectInputDate id="PaymentCardFinance_issueDateTo"
				value="#{paymentCardSettle.issueDateTo}" 
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
		</aon:div>
		
		<aon:outputLabel value="#{bundle.finance_finance_date_abbrv}" />
		<aon:div>
			<aon:outputLabel for="PaymentCardFinance_dueDateFrom"
				styleClass="aon-italic aon-margin-left aon-margin-right" 
				value="#{bundle.aon_date_from}" />
			<aon:selectInputDate id="PaymentCardFinance_dueDateFrom"
				value="#{paymentCardSettle.dueDateFrom}" 
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
			<aon:outputLabel for="PaymentCardFinance_dueDateTo"
				styleClass="aon-italic aon-margin-left aon-margin-right" 
				value="#{bundle.aon_date_to}" />
			<aon:selectInputDate id="PaymentCardFinance_dueDateTo"
				value="#{paymentCardSettle.dueDateTo}" 
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}" />
		</aon:div>
		
		<aon:outputLabel for="PaymentCardFinance_payMethod"
			value="#{bundle.finance_payMethod}" />
		<aon:div id="PaymentCardFinancePayMethodDiv">
			<a4j:repeat value="#{paymentCardSettle.payMethods}" var="payMth" rowKeyVar="payMthIdx">
				<aon:div styleClass="#{(payMthIdx != 0) ? 'aon-padding-top' : ''}">
					<aon:selectOneMenu id="PaymentCardFinance_payMethod"
						value="#{paymentCardSettle.payMethods[payMthIdx]}">
					 	<a4j:support event="onchange" reRender="PaymentCardFinancePayMethodDiv" />
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>
					<aon:commandButton id="PaymentCardFinancePayMethod-remove"
						styleClass="aon-finding-toolbar-item aon-search-minus"
						value="&#160;" immediate="true"
						rendered="#{payMth.id != null}"
						actionListener="#{paymentCardSettle.onRemovePayMethod}"
						reRender="PaymentCardFinancePayMethodDiv">
						<f:param name="payMethodIdx" value="#{payMthIdx}" />
					</aon:commandButton>
					<aon:commandButton id="PaymentCardFinancePayMethod-add"
						styleClass="aon-finding-toolbar-item aon-search-add"
						value="&#160;" immediate="true"
						rendered="#{payMth.id != null and payMthIdx == (paymentCardSettle.payMethodsSize-1)}"
						actionListener="#{paymentCardSettle.onAddPayMethod}"
						reRender="PaymentCardFinancePayMethodDiv" />
				</aon:div>						
			</a4j:repeat>
		</aon:div>

		<aon:outputLabel for="PaymentCardFinance_amount" 
			value="#{bundle.aon_amount}" />
		<aon:inputText id="PaymentCardFinance_amount"
			value="#{paymentCardSettle.amount}" size="10" />

	</aon:panelGrid>

</ui:composition>
