<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="paymentCardSettleToolBarDiv" styleClass="aon-toolbar"
		rendered="#{paymentCardSettle.financeModel.rowCount > 0}">
     	<aon:commandButton title="#{pmsBundle.pms_exclude} #{bundle.aon_all}"
			styleClass="aon-finding-toolbar-item aon-icon-deleteFolder"
			value="#{pmsBundle.pms_exclude} #{bundle.aon_all}"
			rendered="#{paymentCardSettle.financeModel.rowCount > 0}"
			actionListener="#{paymentCardSettle.onRemoveAllSelected}" reRender="paymentCardSettleList"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
     		
     		
     	<aon:commandButton title="#{financeBundle.finance_to_fraction} #{pmsBundle.pms_differences}"
			styleClass="aon-finding-toolbar-item aon-icon-fraction"
			value="#{financeBundle.finance_to_fraction} #{pmsBundle.pms_differences}"
			rendered="#{paymentCardSettle.financeModel.rowCount > 0 and paymentCardSettle.totalDifferenceAmount>0}"
			reRender="showFinanceFractionWindow">
			<f:setPropertyActionListener target="#{paymentCardSettle.showFinanceFractionWindow}"
				value="#{true}" />
		</aon:commandButton>
		<aon:commandButton title="#{financeBundle.finance_add_batch}"
			styleClass="aon-finding-toolbar-item aon-icon-newFolder"
			value="#{financeBundle.finance_to_batch}"
			rendered="#{paymentCardSettle.financeModel.rowCount > 0 and paymentCardSettle.totalDifferenceAmount == 0}"
			actionListener="#{paymentCardSettle.onFinanceBatchShow}" 
			reRender="showFinanceBatchWindow">
			<f:setPropertyActionListener target="#{paymentCardSettle.showFinanceBatchWindow}"
				value="#{true}" />
		</aon:commandButton>
	</aon:div>
 
	<aon:div id="paymentCardSettleDataDiv">
	
		<aon:dataTable id="paymentCardSettleData" value="#{paymentCardSettle.financeModel}"
			var="to" rows="0" rendered="#{paymentCardSettle.financeModel.rowCount > 0}" >
			
			<aon:rowSelector toggleOnClick="#{false}" immediate="#{true}" />				
	
			<aon:column alias="Finance.dueDate"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.finance.dueDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column alias="Finance.invoice&lt;referenceCode"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_invoice}" />
				</f:facet>
				<aon:outputText value="#{to.finance.referenceCode}" />
			</aon:column>
			
			<aon:column alias="Finance.payMethod.name"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{configBundle.config_pay_method}" />
				</f:facet>
				<aon:outputText value="#{to.finance.payMethod.name}" />
			</aon:column>

			<aon:column alias="Finance.invoice.project.id"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_reservation}" />
				</f:facet>
				<aon:commandLink id="reservationLink" immediate="true"
					styleClass="aon-button-goto"
					style="padding-right: 10px;" 
					value="&#160;"  
					rendered="#{!to.finance.invoice.service}" 
					actionListener="#{paymentCardSettle.onLoadReservation}"
					action="reservation_form"
					reRender="aonContent">
				</aon:commandLink>
				<aon:outputText rendered="#{!to.finance.invoice.service}"
					value="#{to.finance.invoice.project.id}" />
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{financeBundle.finance_invoice}"
					rendered="#{!to.finance.invoice.rectifier and !to.finance.invoice.rectified}" />
				<aon:div rendered="#{to.finance.invoice.rectifier}">
					<aon:outputText value="#{to.finance.invoice.rectificationType}" />
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250">
						<aon:outputFormat value="#{financeBundle.finance_invoice_rectifier_message}" styleClass="aon-bold aon-label-error">
							<f:param value="#{to.finance.invoice.rectificationInvoice.referenceCode}" />
						</aon:outputFormat>
					</rich:toolTip>
				</aon:div>
				<aon:div rendered="#{to.finance.invoice.rectified}">
					<aon:outputText value="#{to.finance.invoice.rectificationType}" />
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250">
						<aon:outputFormat value="#{financeBundle.finance_invoice_rectified_message}" styleClass="aon-bold">
							<f:param value="#{to.finance.invoice.rectificationInvoicesString}" />
						</aon:outputFormat>
					</rich:toolTip>
				</aon:div>
			</aon:column>

			<aon:column 
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_reservation_code}" />
				</f:facet>
				<aon:outputText rendered="#{!to.finance.invoice.service}"
					value="#{paymentCardSettle.financeProjectReservation.code}" />
			</aon:column>
	
			<aon:column 
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_guest}" />
				</f:facet>
				<aon:outputText rendered="#{!to.finance.invoice.service}"
					value="#{paymentCardSettle.financeProjectReservation.guestFullName}" />
			</aon:column>
	
			<aon:column 
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_hotel}" />
				</f:facet>
				<aon:outputText rendered="#{!to.finance.invoice.service}"
					value="#{paymentCardSettle.financeProjectReservation.hotelReservation.workPlace.description}" />
			</aon:column>
	
			<aon:column 
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_checkIn}" />
				</f:facet>
				<aon:outputText rendered="#{!to.finance.invoice.service}"
					value="#{paymentCardSettle.financeProjectReservation.startDate}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column 
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_checkOut}" />
				</f:facet>
				<aon:outputText rendered="#{!to.finance.invoice.service}"
					value="#{paymentCardSettle.financeProjectReservation.endDate}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:outputText value="#{financeBundle.finance_total_amount}" />
				</f:facet>
			</aon:column>
	
<!--  
			<aon:column alias="Finance.financeStatus"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.finance.financeStatus}" />  
			</aon:column>
-->
	
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_total}" />
				</f:facet>
				<aon:outputText value="#{to.finance.totalAmount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div style="float:right">
						<aon:outputText id="finance_total_amount" style="text-align:right" value="#{paymentCardSettle.totalFinanceAmount}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_amount} #{pmsBundle.pms_agency}" />
				</f:facet>
				<aon:inputText value="#{to.amount}" size="10" >
					<a4j:support event="onblur" reRender="paymentCardSettleToolBarDiv, agency_total_amount, difference_total_amount, difference_amount" />
				</aon:inputText>
				<f:facet name="footer">
					<aon:div style="float:right">
						<aon:outputText id="agency_total_amount" 
							style="text-align:right" value="#{paymentCardSettle.totalFinanceAmount - paymentCardSettle.totalDifferenceAmount}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_difference}" />
				</f:facet>
				<aon:outputText id="difference_amount" value="#{ (empty to.amount)?(''):(to.finance.totalAmount - to.amount)}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div style="float:right">
						<aon:outputText id="difference_total_amount" style="text-align:right" value="#{paymentCardSettle.totalDifferenceAmount}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-iconColumn" >
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:commandButton
					id="remove-button" title="#{pmsBundle.pms_exclude}"
					immediate="true"  
					reRender="paymentCardSettleList"
					actionListener="#{paymentCardSettle.onRemoveSelected}"
					styleClass="aon-editDataTable-button aon-icon-delete" />	
			</aon:column>
	
		</aon:dataTable>	
		
		<aon:dataScroller2 for="paymentCardSettleData" showNote="true" />
	
	</aon:div>
			

</ui:composition>
