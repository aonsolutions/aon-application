<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
	
		<a4j:region>
			<h:form>
				<a4j:poll status="aonStatus" interval="300000"
					actionListener="#{cleanStatus.onRefresh}" reRender="cleanStatusList" />
			</h:form>
		</a4j:region>
		
		<script type="text/javascript">
			function showClean(elem) {
				elem.disabled = true;
				elem.style.background = 'LightGreen';
			}
			function showDoNotDisturb(elem) {
				elem.disabled = true;
				elem.style.background = 'Orange';
			}
			function showDirty(elem) {
				elem.disabled = true;
				elem.style.background = 'Salmon';
			}
		</script>
		
		<aon:form id="cleanStatusList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_cleanStatus_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="reservation-Refresh"
						rendered="#{not empty cleanStatus.hotel}"
						value="#{bundle.webmail_refresh}" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh"
						actionListener="#{cleanStatus.onRefresh}"
						reRender="aonContent" />
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic" />
					<aon:selectOneMenu value="#{cleanStatus.hotel}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{pmsCollections.currentUserHotels}" />
						<a4j:support event="onchange" reRender="cleanStatusList" 
							actionListener="#{cleanStatus.onSearch}" />
					</aon:selectOneMenu>
					
					<aon:outputText value="#{bundle.pms_floor}:" styleClass="aon-margin-left aon-italic" />
					<c:forEach items="#{cleanStatus.floorList}" var="floor" varStatus="floorIdx" begin="0" step="1">
						<aon:commandButton value="#{floor}"
							styleClass="aon-commandButton"
							style="margin:2px; width:50px; height:30px; #{cleanStatus.selectedFloor==floorIdx.index?'background:gray;color:white;':''}"
							actionListener="#{cleanStatus.onSelectFloor}"
							reRender="cleanStatusList" >
							<f:param name="selectedFloorId" value="#{floorIdx.index}"/>
						</aon:commandButton>
					</c:forEach>
					
					<aon:div style="font-size:0.7em; font-weight:bold; text-align:center; float:right;">
						<h:panelGrid columns="3">
							<aon:div style="width:65px; background:LightGrey;">
								<aon:outputText value="BLOQUEADA" />
							</aon:div>
							<aon:div style="width:65px; background:LightGreen;" >
								<aon:outputText value="LIMPIA" />
							</aon:div>
							<aon:div style="width:65px; background:Orange;" >
								<aon:outputText value="NO MOLESTAR" />
							</aon:div>
							
							<aon:div style="width:65px; background:Red;">
								<aon:outputText value="CHECKOUT" />
							</aon:div>
							<aon:div style="width:65px; background:Salmon;">
								<aon:outputText value="SUCIA" />
							</aon:div>
						</h:panelGrid>
					</aon:div>
				</aon:panel>
					
				<aon:div id="cleanStatus-grid">
					
					<c:set var="currentFloorIdx" value="#{(not empty cleanStatus.selectedFloor)?(cleanStatus.selectedFloor):(-1)}" />
					
					<c:forEach items="#{cleanStatus.roomList}" var="roomTo" varStatus="status" begin="0" step="1">
						
						<c:if test="#{status.first or (currentFloorIdx lt 0) or (not roomTo.asset.name.startsWith(cleanStatus.floorList[currentFloorIdx]))}" >
							<c:if test="#{status.first or empty cleanStatus.selectedFloor}">
								<c:set var="currentFloorIdx" value="#{(not empty cleanStatus.selectedFloor)?(cleanStatus.selectedFloor):(currentFloorIdx + 1)}" />
								<aon:div styleClass="aon-margin-top">
									<aon:div styleClass="aon-form-group-title">
										<aon:div styleClass="aon-form-group-title-internal">
											<aon:outputText value="#{bundle.pms_floor} #{cleanStatus.floorList[currentFloorIdx]}" />
										</aon:div>
									</aon:div>
								</aon:div>
							</c:if>
						</c:if>
						
						<aon:div id="roomStatus-#{status.index}" 
							style="display:inline-block; margin:2px; width:70px; height:70px;" 
							rendered="#{empty cleanStatus.selectedFloor or roomTo.asset.name.startsWith(cleanStatus.floorList[currentFloorIdx])}" >
							
							<!-- BLOCKED -->
							<aon:commandButton value="#{roomTo.asset.name}"
								title="#{bundle.pms_room} #{bundle.pms_blocked} (#{cleanStatus.blockedRooms[roomTo.asset.id]})"
								rendered="#{not empty cleanStatus.blockedRooms[roomTo.asset.id]}"
								disabled="#{true}" styleClass="aon-commandButton"
								style="margin:2px; width:70px; height:70px;" />
								
							<aon:div rendered="#{empty cleanStatus.blockedRooms[roomTo.asset.id]}" >
								
								<!-- CLEAN -->
								<aon:commandButton value="#{roomTo.asset.name}"
									rendered="#{roomTo.status=='CLEAN' 
										and not roomTo.cleaningDateExpired
										and (roomTo.todayLastCleaningDate 
											or (empty cleanStatus.busyRooms[roomTo.asset.id] and empty cleanStatus.checkoutRooms[roomTo.asset.id]))}"
									styleClass="aon-commandButton" 
									style="margin:2px; width:70px; height:70px; background:LightGreen;"
									onclick="showDoNotDisturb(this)"
									actionListener="#{cleanStatus.onSelectRoom}">
									<f:param name="selectedRoomId" value="#{status.index}" />
									<f:param name="selectedRoomStatus" value="CLEAN" />
									<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
										<aon:outputText	value="#{bundle.pms_room} limpia " />
										<aon:outputText	value="(" />
										<aon:outputText	value="#{roomTo.lastCleaningDate}" >
											<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>
										<aon:outputText	value=")" />
									</rich:toolTip>
								</aon:commandButton>
								
								<!-- DO NOT DISTURB -->
								<aon:commandButton value="#{roomTo.asset.name}"
									title="#{bundle.pms_room} ocupada (#{roomTo.lastCleaningDate})"
									rendered="#{roomTo.status=='DO_NOT_DISTURB' and roomTo.todayLastCleaningDate}"
									styleClass="aon-commandButton" 
									style="margin:2px; width:70px; height:70px; background:Orange;"
									onclick="showDirty(this)"
									actionListener="#{cleanStatus.onSelectRoom}">
									<f:param name="selectedRoomId" value="#{status.index}" />
									<f:param name="selectedRoomStatus" value="DO_NOT_DISTURB" />
								</aon:commandButton>
								
								<!-- DIRTY or CHECKOUT -->
								<aon:div rendered="#{!(roomTo.todayLastCleaningDate and roomTo.status=='CLEAN')
									 and !(roomTo.todayLastCleaningDate and roomTo.status=='DO_NOT_DISTURB')}" >
									<!-- DIRTY -->
									<aon:commandButton value="#{roomTo.asset.name}"
										title="#{bundle.pms_room} sucia"
										rendered="#{(not empty cleanStatus.busyRooms[roomTo.asset.id] or roomTo.status!='CLEAN' or roomTo.cleaningDateExpired)
											and empty cleanStatus.checkoutRooms[roomTo.asset.id]}"
										styleClass="aon-commandButton" 
										style="margin:2px; width:70px; height:70px; background:Salmon;"
										onclick="showClean(this)"
										actionListener="#{cleanStatus.onSelectRoom}">
										<f:param name="selectedRoomId" value="#{status.index}" />
										<f:param name="selectedRoomStatus" value="DIRTY" />
									</aon:commandButton>
									<!-- CHECKOUT -->
									<aon:commandButton value="#{roomTo.asset.name}"
										title="#{bundle.pms_room} sucia por checkout"
										rendered="#{not empty cleanStatus.checkoutRooms[roomTo.asset.id]}"
										styleClass="aon-commandButton" 
										style="margin:2px; width:70px; height:70px; background:Red;"
										onclick="showClean(this)"
										actionListener="#{cleanStatus.onSelectRoom}">
										<f:param name="selectedRoomId" value="#{status.index}" />
										<f:param name="selectedRoomStatus" value="DIRTY" />
									</aon:commandButton>
								</aon:div>
								
							</aon:div>
							
						</aon:div>
						
						<c:set var="previousRoom" value="#{roomTo.asset.name}" />
						
					</c:forEach>
				</aon:div>
					
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
