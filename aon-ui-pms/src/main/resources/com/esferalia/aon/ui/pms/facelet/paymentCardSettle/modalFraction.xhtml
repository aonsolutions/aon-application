<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinanceFractionWindow">
		<c:if test="#{controller.showFinanceFractionWindow}">
			<rich:modalPanel id="financeFractionModalPanel" minHeight="150"
				minWidth="400" rendered="#{controller.showFinanceFractionWindow}"
				showWhenRendered="true" zindex="100">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.finance_to_fraction}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFinanceSearchWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showFinanceFractionWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="financeFractionForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
										<aon:commandButton id="financeFraction-accept"
											value="#{bundle.aon_accept}"
											reRender="showFinanceSearchWindow,#{fractionReRender}"
											actionListener="#{controller.onFractionDifferences}"
											styleClass="aon-finding-toolbar-item aon-icon-accept">
											<rich:componentControl for="financeFractionModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showFinanceFractionWindow}"
												value="#{false}" />
										</aon:commandButton>
										<aon:commandButton id="financeFraction-cancel"
											value="#{bundle.aon_cancel}"
											reRender="showFinanceFractionWindow"
											immediate="true"
											styleClass="aon-finding-toolbar-item aon-icon-cancel">
											<f:setPropertyActionListener
												target="#{controller.showFinanceFractionWindow}"
												value="#{false}" />
										</aon:commandButton>
									</aon:div>
									<aon:div style="margin-top: 2em;">
										<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

											<aon:outputLabel for="PaymentCardFinance_fractionPayMethod"
												value="#{bundle.finance_payMethod}" />
											<aon:selectOneMenu id="PaymentCardFinance_fractionPayMethod" 
												value="#{controller.fractionPayMethod}" required="#{true}">
												<f:selectItem itemLabel=" - " itemValue="#{null}" />
												<f:selectItems value="#{configCollections.payMethods}" />
											</aon:selectOneMenu>

										</aon:panelGrid>
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
