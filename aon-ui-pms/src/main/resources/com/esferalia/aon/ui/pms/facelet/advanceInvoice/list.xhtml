<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_advance_invoice_module}" />
				<ui:param name="controller" value="#{advanceInvoice}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="invoice"
						value="#{financeBundle.finance_invoicing}"
						styleClass="aon-finding-toolbar-item aon-icon-favorite"
						onclick="if (confirm('#{financeBundle.finance_invoicing}?')){Richfaces.showModalPanel('waitProccess')} else {return false;}"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"
						actionListener="#{advanceInvoice.onInvoice}">
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>

			<aon:div id="advanceInvoicesContainer" styleClass="aon-scroll-area">
			
				<aon:div style="background-color:#f6f5e3; padding: 5px; margin-bottom: 5px;">
					<aon:div styleClass="aon-bold">
						<aon:outputText value="#{pmsBundle.pms_guest_reservation}" 
							rendered="#{advanceInvoiceSearch.guestReservationSearch}"/>						
						<aon:outputText value="#{pmsBundle.pms_agency_reservation}" 
							rendered="#{!advanceInvoiceSearch.guestReservationSearch}"/>
					</aon:div>
				</aon:div>
				
				<aon:div id="advanceInvoiceParameters" styleClass="aon-margin-bottom">
					<aon:panelGrid columns="7" styleClass="aon-width-all"
						columnClasses="aon-panelGrid-even aon-width-120
									,aon-panelGrid-odd aon-width-120
									,aon-panelGrid-even aon-width-120
									,aon-panelGrid-odd aon-width-120
									,aon-panelGrid-even aon-width-150
									,aon-panelGrid-odd aon-width-120
									,aon-panelGrid-even aon-width-auto
									">
						<aon:panelGroup>
							<aon:outputText style="margin-right:5px;" value="#{pmsBundle.pms_selected}:" />
							<aon:outputText id="checkCounter" value="#{advanceInvoice.checkCounter}" />
						</aon:panelGroup>
						
						<aon:outputLabel for="advanceInvoice_date" value="#{financeBundle.finance_invoice_date}" />
						<aon:selectInputDate id="advanceInvoice_date" required="true"
								value="#{advanceInvoice.invoiceDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}">
							<a4j:support event="oninputchange" reRender="paymentDate" ajaxSingle="true" />
							<a4j:support event="onchanged" reRender="paymentDate" ajaxSingle="true" />
						</aon:selectInputDate>
		
						<aon:outputLabel for="advanceInvoice_financePayMethod"
							value="#{configBundle.config_pay_method}" />
						<aon:selectOneMenu id="advanceInvoice_financePayMethod-guest"
						 	rendered="#{advanceInvoiceSearch.guestReservationSearch}"
							value="#{advanceInvoice.payMethod}" required="true">
							<f:selectItems value="#{configCollections.directPayMethods}"/>
						</aon:selectOneMenu>
						<aon:selectOneMenu id="advanceInvoice_financePayMethod-agency"
							rendered="#{!advanceInvoiceSearch.guestReservationSearch}"
							value="#{advanceInvoice.payMethod}" required="true">
							<f:selectItems value="#{advanceInvoice.agencyPayMethods}"/>
							<a4j:support event="onchange" ajaxSingle="true"
								reRender="advanceInvoiceParameters"/>
						</aon:selectOneMenu>
						
						<aon:outputLabel for="advanceInvoice_daysToPayment"
							value="#{registryBundle.registry_days_to_first_payment}" />
						<aon:panelGroup>
							<aon:inputText id="advanceInvoice_daysToPayment" size="3"
								reRender="paymentDate" ajaxSingle="true" 
								value="#{advanceInvoice.daysToPayment}" required="true" />
							<aon:outputText value="#{financeBundle.finance_finance_date}" styleClass="aon-italic aon-margin-left"/>
							<aon:outputText id="paymentDate" value="#{advanceInvoice.paymentDate}" styleClass="aon-italic aon-bold aon-margin-left">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:panelGroup>
					</aon:panelGrid>
					
					<aon:panelGrid columns="5" styleClass="aon-width-all"
						rendered="#{!advanceInvoiceSearch.guestReservationSearch}"
						columnClasses="aon-panelGrid-even aon-width-120
									,aon-panelGrid-odd aon-width-120
									,aon-panelGrid-even aon-width-120
									,aon-panelGrid-odd aon-width-120
									,aon-panelGrid-even aon-width-auto">
						<aon:outputText value="&#160;" />
						
						<aon:outputLabel for="advanceInvoice_percent"
							value="#{pmsBundle.pms_invoice_percent}" />
						<aon:inputText id="advanceInvoice_percent" size="6"
							value="#{advanceInvoice.percent}" required="true" />
		
						<aon:outputLabel for="advanceInvoice_rbank"
							rendered="#{advanceInvoice.bankRequired}"
							value="#{configBundle.config_bank}" />
						<aon:selectOneMenu id="advanceInvoice_rbank"
							rendered="#{advanceInvoice.bankRequired}"
							value="#{advanceInvoice.rbank}" required="true">
							<f:selectItems value="#{companyCollections.activeCompanyBanks}"/>
						</aon:selectOneMenu>
		
						<aon:outputText value="&#160;" rendered="#{!advanceInvoice.bankRequired}"/>
						<aon:outputText value="&#160;" rendered="#{!advanceInvoice.bankRequired}"/>
					</aon:panelGrid>
				</aon:div>
				
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{advanceInvoice}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					
					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:div layout="none">
									<aon:commandButton id="selectButton"
										actionListener="#{controller.checkAll}"
										value="&#160;" style="border: 0px; cursor: pointer"
										styleClass="aon-icon-checkAll aon-vertical-align-top" />
									<aon:commandButton id="unselectButton"
										actionListener="#{controller.checkNone}"
										value="&#160;" style="border: 0px; cursor: pointer" 
										styleClass="aon-icon-checkNone aon-vertical-align-top" />
								</aon:div>
							</f:facet>
							<aon:selectBooleanCheckbox id="ProjectReservation_check"
								rendered="#{to.total != 0}"
								value="#{controller.rowChecked}">
								<a4j:support event="onclick"
									actionListener="#{controller.onCheck}" 
									ignoreDumpResponses="true"
									reRender="checkCounter"
									limitToList="true"
									ajaxSingle="true" />
							</aon:selectBooleanCheckbox>	
						</aon:column>

						<aon:column alias="ProjectReservation.hotel.workPlace.description"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_hotel}" />
							</f:facet>
							<h:outputText value="#{to.hotel.workPlace.description}" />
						</aon:column>

						<aon:column alias="ProjectReservation.rooms.tariff.id"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{productBundle.product_tariff}" />
							</f:facet>
							<h:outputText value="#{to.tariffInfo}" />
						</aon:column>

						<aon:column alias="ProjectReservation.code"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_reservation_code}" />
							</f:facet>
							<aon:outputText value="#{to.code}" />
						</aon:column>

						<aon:column alias="ProjectReservation.startDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkIn}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="ProjectReservation.endDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkOut}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_guest}" />
							</f:facet>
							<aon:outputText value="#{to.guestFullName}" />
						</aon:column>

						<aon:column alias="ProjectReservation.agency.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_agency}" />
							</f:facet>
							<aon:outputText value="#{to.agency.registry.fullName}" />
						</aon:column>

						<aon:column alias="ProjectReservation.advance"
							styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_advance}" />
							</f:facet>
							<aon:outputText value="#{to.advance}">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="ProjectReservation.total"
							styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.total}">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
						</aon:column>
					</ui:define>
					
				</ui:decorate>
			</aon:div>
		</aon:form>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
