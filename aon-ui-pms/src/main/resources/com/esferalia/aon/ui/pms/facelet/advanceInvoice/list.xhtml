<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="advanceInvoiceList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_advance_invoice_module}" />
				<ui:param name="controller" value="#{advanceInvoice}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="advanceInvoice-selectAll"
						value="#{bundle.aon_check_all}" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						actionListener="#{advanceInvoice.checkAll}" />
					<aon:commandButton id="advanceInvoice-selectNone"
						value="#{bundle.aon_uncheck_all}" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						actionListener="#{advanceInvoice.checkNone}" />
					<aon:commandButton id="advanceInvoice-invoice"
						value="#{pmsBundle.pms_to_invoice}"
						immediate="#{true}" rendered="#{advanceInvoice.checkedCount > 0}"
						styleClass="aon-finding-toolbar-item aon-icon-favorite"
						actionListener="#{advanceInvoice.onAdvanceInvoiceShow}"
						reRender="showInvoiceWindow">
						<f:setPropertyActionListener target="#{advanceInvoice.showInvoiceWindow}"
							value="#{true}" />
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{advanceInvoice}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="#{controller.checkedCount}" />
							</f:facet>
							<aon:selectBooleanCheckbox id="ProjectReservation_check"
								rendered="#{to.hotelReservation.itemAdvance != null and to.hotelReservation.itemAdvance.id != null}"
								value="#{controller.rowChecked}"
								valueChangeListener="#{controller.rowSelected}"
								reRender="aonContent" />	
							<aon:div style="display:inline;cursor:pointer;">
								<aon:outputText value="&#160;"
									styleClass="aon-icon-exception" style="padding-left:20px"
									rendered="#{to.hotelReservation.itemAdvance == null or to.hotelReservation.itemAdvance.id == null}" />
								<rich:toolTip value="#{pmsBundle.pms_advance_item_not_defined_msg}" />
							</aon:div>
						</aon:column>

						<aon:column alias="ProjectReservation.hotelReservation.workPlace.description"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotelReservation.workPlace.description}" />
						</aon:column>

						<aon:column alias="ProjectReservation.project.id"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_reservation_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>

						<aon:column alias="ProjectReservation.code"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_reservation_code}" />
							</f:facet>
							<aon:outputText value="#{to.code}" />
						</aon:column>

						<aon:column alias="ProjectReservation.startDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkIn}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="ProjectReservation.endDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkOut}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_guest}" />
							</f:facet>
							<aon:outputText value="#{to.guestFullName}" />
						</aon:column>

						<aon:column alias="ProjectReservation.agency.registry.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_agency}" />
							</f:facet>
							<aon:outputText value="#{to.agency.registry.fullName}" />
						</aon:column>

						<c:if test="#{advanceInvoiceSearch.guestReservationSearch}">
							<aon:column alias="ProjectReservation.advance"
								styleClass="aon-editDataTable-numberColumn">
								<f:facet name="header">
									<aon:outputText value="#{pmsBundle.pms_advance}" />
								</f:facet>
								<aon:outputText value="#{to.advance}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
							</aon:column>
						</c:if>

						<aon:column alias="ProjectReservation.total"
							styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.total}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/advanceInvoice/modalInvoice.xhtml">
			<ui:param name="controller" value="#{advanceInvoice}" />
			<ui:param name="searchListener" value="#{advanceInvoiceSearch}" />
		</ui:include>

	</ui:define>
</ui:composition>
