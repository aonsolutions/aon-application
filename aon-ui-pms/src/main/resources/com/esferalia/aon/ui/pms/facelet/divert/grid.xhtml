<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="divertForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_divert_module}" />
				<ui:param name="controller" value="#{divert}" />
				<ui:param name="skipSearchButton" value="#{false}" />
			</ui:decorate>
	
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
				
					<ui:param name="controller" value="#{divert}" />
					<ui:param name="columnClasses" value="
						aon-editDataTable-textColumn, aon-editDataTable-dateColumn, 
						aon-editDataTable-textColumn, aon-editDataTable-dateColumn, 
						aon-editDataTable-textColumn, aon-editDataTable-dateColumn, 
						aon-editDataTable-dateColumn, aon-editDataTable-dateColumn, 
						aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
			
					<ui:define name="columns">
			
						<aon:column alias="ProjectReservationDivert.projectReservation.id"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel for="Divert_projectReservation"
									value="#{pmsBundle.pms_reservation}" />
							</f:facet>
							<aon:div rendered="#{formList}" >
								<aon:outputText value="#{to.projectReservation.code} - #{to.projectReservation.guestFullName}" />
								<aon:outputText value=" - " />
								<aon:outputText value="#{to.projectReservation.startDate}" >
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:outputText value=" - " />
								<aon:outputText value="#{to.projectReservation.endDate}" >
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
							</aon:div>
							
							<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservation/lookup.xhtml">
								<ui:param name="lookupTo" value="#{divert.to.projectReservation}" />
								<ui:param name="skipNewButton" value="#{true}" />
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupRendered" value="#{formEdit}" />
								<ui:param name="lookupControllerListener" value="#{divert.divertFilter}" />
							</ui:include>
								
							<f:facet name="footer">
								<aon:inputText id="Divert_projectReservation-New" rendered="#{formNew}"
									value="#{divert.to.projectReservation}" />
								<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservation/lookup.xhtml">
									<ui:param name="lookupTo" value="#{divert.to.projectReservation}" />
									<ui:param name="skipNewButton" value="#{true}" />
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="lookupSuffix" value="-New" />
									<ui:param name="lookupRendered" value="#{formNew}" />
									<ui:param name="lookupControllerListener" value="#{divert.divertedReservationFilter}" />
								</ui:include>
							</f:facet>
						</aon:column>
						
						<aon:column alias="ProjectReservationDivert.requestHotel.workPlace.description"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel value="#{pmsBundle.pms_divert_request}" />
							</f:facet>
							<aon:outputText value="#{to.requestHotel.workPlace.description}" />
						</aon:column>
			
						<aon:column alias="ProjectReservationDivert.divertHotel.workPlace.description"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel for="Divert_hotel_id" 
									value="#{pmsBundle.pms_divert_destination}" />
							</f:facet>
							<aon:outputText value="#{to.divertHotel.workPlace.description}" rendered="#{formList}"/>
							<aon:selectOneMenu id="Divert_hotel_id" rendered="#{formEdit}"
								value="#{divert.to.divertHotel}">
								<f:selectItem itemLabel="-" value="#{null}" />		
								<f:selectItems value="#{divert.availableHotels}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu id="Divert_hotel_id-New" rendered="#{formNew}"
									value="#{divert.to.divertHotel}">
									<f:selectItem itemLabel="-" value="#{null}" />		
									<f:selectItems value="#{divert.availableHotels}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>
			
						<aon:column alias="ProjectReservationDivert.divertDate"
							styleClass="aon-editDataTable-dateColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel for="Divert_divertDate"
									value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.divertDate}" rendered="#{formList}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate id="Divert_divertDate" rendered="#{formEdit}"  
								value="#{divert.to.divertDate}" size="20"
								inputSize="16" renderAsPopup="true" enableManualInput="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}">
							</aon:selectInputDate>
							<f:facet name="footer">
								<aon:selectInputDate id="Divert_divertDate-New" rendered="#{formNew}"  
									value="#{divert.to.divertDate}" size="20"
									inputSize="16" renderAsPopup="true" enableManualInput="true"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
							</f:facet>
						</aon:column>
			
						<aon:column alias="ProjectReservationDivert.status"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel for="Divert_status"
									value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText id="Divert_status"
								value="#{to.status}" />
						</aon:column>
						
					</ui:define>
			
				</ui:decorate>
			</aon:div>
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{reservationLookup}" />
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		
	</ui:define>

</ui:composition>
