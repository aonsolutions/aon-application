<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<rich:subTable id="availableRoomStayTable#{roomStaySuffix}"
		value="#{controller.availableRoomStayList}" var="availableRoomStay"
		rendered="#{controller.idInAvailableRoomStayMap}"
		headerClass="aon-editDataTable-textColumn aon-subTable-column aon-subTable-column-green-header aon-italic aon-bold"
		rowClasses="aon-subTable-column-green"
		onRowMouseOver="onDataTableOver(this,'aon-table-row-selected','aon-subTable-column-green-selected');"
		onRowMouseOut="onDataTableOut(this,'aon-table-row-selected');">

		<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
			<aon:outputText value="&#160;" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
			<f:facet name="header">
				<aon:outputText value="#{bundle.report_tariff}" />
			</f:facet>
			<aon:outputText value="#{availableRoomStay.tariffCode}"
				 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}" />
			<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto"
				rendered="#{!availableRoomStay.error}">
				<aon:outputText value="#{availableRoomStay.tariffDescription}" />
			</rich:toolTip>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
			<f:facet name="header">
				<aon:outputText value="#{bundle.pms_regime}" />
			</f:facet>
			<aon:outputText value="#{availableRoomStay.mealPlan}" 
				 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}"
				 rendered="#{!availableRoomStay.error}" />
			<aon:outputText value="ERROR" style="color: red;"
				rendered="#{availableRoomStay.error}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column"
			colspan="#{(controller.agreedPriceVisible) ? '2' : '1'}">
			<f:facet name="header">
				<aon:outputText value="#{bundle.pms_room_type}" />
			</f:facet>
			<aon:outputText value="#{availableRoomStay.roomCode} - #{availableRoomStay.roomDescription}" 
				 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}"
				 rendered="#{!availableRoomStay.error}" />
			<aon:outputText value="&#160;" styleClass="aon-icon-info aon-noborder aon-margin-left aon-padding-left"
				rendered="#{!availableRoomStay.error and !empty availableRoomStay.cancelPenalty}" />
			<rich:toolTip showEvent="onclick" hideEvent="onmouseout" direction="auto"
				rendered="#{!availableRoomStay.error and !empty availableRoomStay.cancelPenalty}">
				<aon:outputText value="#{availableRoomStay.cancelPenalty}" />
			</rich:toolTip>
			<aon:outputText value="#{availableRoomStay.errorMessage}" style="color: red;"
				rendered="#{availableRoomStay.error}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
			<f:facet name="header">
				<aon:outputText value="#{bundle.asset_filter_availability}" />
			</f:facet>
			<aon:outputText value="#{availableRoomStay.availability}"
				 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}" />
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-bold aon-subTable-column">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_price} #{bundle.aon_day}" />
			</f:facet>
			<aon:outputText value="#{availableRoomStay.dailyPrice}"
				 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}">
				<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-numberColumn aon-bold aon-subTable-column">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_price} #{bundle.aon_total}" />
			</f:facet>
			<aon:outputText value="#{availableRoomStay.totalPrice}"
				 style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}">
				<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
			</aon:outputText>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
			<aon:commandLink id="requestRoom-bookingButton#{roomStaySuffix}"
				value="#{bundle.pms_to_book}" 
				styleClass="aon-italic" style="#{(availableRoomStay.roomCode == to.item.product.code) ? 'color: #2152A5;' : ''}"
				rendered="#{!availableRoomStay.error and !availableRoomStay.tariffStopSales and availableRoomStay.availability >= to.units}"
				actionListener="#{controller.sendBookingQuery}"
				reRender="aonContent"
				onclick="Richfaces.showModalPanel('waitProccess')"
				oncomplete="Richfaces.hideModalPanel('waitProccess')">
				<f:param name="availableRoomStayIndex" value="#{availableRoomStay.index}"/>
			</aon:commandLink>
			<aon:outputText value="#{bundle.pms_no_availability_abbrv}" style="color: red;"
				rendered="#{!availableRoomStay.error and !availableRoomStay.tariffStopSales and to.units > availableRoomStay.availability}" />
			<aon:outputText value="#{bundle.pms_stop_sales_abbrv}" style="color: red;"
				rendered="#{!availableRoomStay.error and availableRoomStay.tariffStopSales}" />
		</aon:column>

	</rich:subTable>

</ui:composition>
