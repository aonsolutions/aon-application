<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="skipResetButton" value="#{true}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="skipNewSaveButton" value="#{true}" />
		<ui:param name="skipNewCancelButton" value="#{true}" />
		<ui:param name="skipSaveButton" value="#{true}" />
		<ui:param name="skipCancelButton" value="#{true}" />
		<ui:param name="skipRemoveButton" value="#{true}" />

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-iconColumn">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:commandLink id="Service-selectButton"
					styleClass="aon-table-row-link" value="&#160;"
					immediate="true" ajaxSingle="true" requestDelay="100"
					rendered="#{reservation.active and (!reservation.to.crs or reservation.to.roomAssignedCount > 1)}"
					actionListener="#{controller.onSelect}"
					reRender="showServiceDetailWindow"
					onkeyup="#{dataTableId}KeyUp(this)"
					onfocus="#{dataTableId}SelectRow(this)"
					onblur="#{dataTableId}DeselectRow(this)"
					focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
					<f:setPropertyActionListener target="#{controller.showServiceDetailWindow}"
						value="#{true}" />
				</aon:commandLink>
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton
							id="Service-resetButton" title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
							styleClass="aon-editDataTable-button aon-icon-reset"
							rendered="#{!reservation.to.crs and reservation.active}" 
							actionListener="#{controller.onReset}"
							reRender="showServiceDetailWindow"
							accesskey="#{bundle.aon_key_new_line}" 
							focus="#{(focusOnAdd != null)?(focusOnAdd):''}">
							<f:setPropertyActionListener target="#{controller.showServiceDetailWindow}"
								value="#{true}" />
						</aon:commandButton>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-20">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_order}" />
				</f:facet>
				<aon:outputText value="#{to.serviceIndex}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel value="#{pmsBundle.pms_service}" />
				</f:facet>
				<aon:outputText value="#{to.item.product.code} - #{to.item.product.name}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
				<f:facet name="header">
					<aon:outputLabel value="#{pmsBundle.pms_source}" />
				</f:facet>
				<aon:outputText value="#{pmsBundle.pms_reservation}" rendered="#{!to.extra}" />
				<aon:outputText value="#{pmsBundle.pms_hotel}" rendered="#{to.extra}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel value="#{pmsBundle.pms_room_number}" />
				</f:facet>
				<aon:outputText value="#{to.roomNumber}" />
			</aon:column>
		</ui:define>

		<ui:define name="endFormListContent">
			<aon:div>
				<aon:commandButton id="showServiceDetailTable"
					value="&#160;" styleClass="aon-icon-tree-root aon-noborder"
					title="#{pmsBundle.pms_to_breakdown}"
					rendered="#{!to.showServiceDetail}" 
					actionListener="#{controller.onShowServiceDetails}"
					reRender="#{dataTableId}" />
				<aon:commandButton id="hideServiceDetailTable"
					value="&#160;" styleClass="aon-icon-index aon-noborder"
					title="#{pmsBundle.pms_to_hide}"
					rendered="#{to.showServiceDetail}" 
					actionListener="#{controller.onHideServiceDetails}"
					reRender="#{dataTableId}" />
			</aon:div>
			<rich:subTable id="serviceDetailTable" 
				rendered="#{controller.showServiceDetail}"
				value="#{controller.serviceDetailList}" var="serviceDetail">

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-yellow-column">
					<aon:outputText value="&#160;" />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-yellow-column">
					<aon:outputText value="&#160;" />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-yellow-column">
					<aon:panelGrid columns="4" 
						columnClasses="aon-noborder aon-width-150, aon-noborder aon-width-100, aon-noborder aon-width-120, aon-noborder aon-width-auto">
						<aon:div>
							<aon:outputLabel value="#{bundle.aon_date}:" styleClass="aon-margin-right"/>
							<aon:outputText value="#{serviceDetail.effectiveDate}" styleClass="aon-italic">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:div>
						<aon:div>
							<aon:outputLabel value="#{pmsBundle.pms_units}:" styleClass="aon-margin-right" />
							<aon:outputText value="#{serviceDetail.quantity}" styleClass="aon-italic">
								<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
							</aon:outputText>
						</aon:div>
						<aon:div>
							<aon:outputLabel value="#{bundle.aon_price}:" styleClass="aon-margin-right" />
							<aon:outputText value="#{serviceDetail.salesPrice}" styleClass="aon-italic">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
						</aon:div>
						<aon:div>
							<aon:outputLabel value="#{bundle.aon_total}:" styleClass="aon-margin-right" />
							<aon:outputText value="#{serviceDetail.totalPrice}" styleClass="aon-italic">
								<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
							</aon:outputText>
						</aon:div>
					</aon:panelGrid>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-yellow-column">
					<aon:outputText value="&#160;" />
				</aon:column>

				<aon:column colspan="2" styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-yellow-column">
					<aon:div>
						<aon:outputLabel value="#{pmsBundle.pms_room}:" styleClass="aon-margin-right" />
						<aon:outputText value="#{serviceDetail.projectReservationRoomDetail.assetActivity.asset.name}" styleClass="aon-italic"
							rendered="#{serviceDetail.projectReservationRoomDetail != null}" />
						<aon:outputText value="--" styleClass="aon-italic"
							rendered="#{serviceDetail.projectReservationRoomDetail == null}" />
					</aon:div>
				</aon:column>

			</rich:subTable>
		</ui:define>

	</ui:decorate>

</ui:composition>
