<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_reservation_request_module}" />
				<ui:param name="controller" value="#{reservationRequest}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{reservationRequest}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-iconColumn">
							<aon:commandLink id="#{dataTableId}-selectButton" 
								styleClass="#{(to.active) ? ('aon-icon-point-red') : ('aon-icon-point-green')}" 
								value="&#160;&#160;&#160;&#160;"
								title="#{(to.active) ? (pmsBundle.pms_reservation_request_pending) : (pmsBundle.pms_reservation_request_processed)}" 
								immediate="true" ajaxSingle="true" requestDelay="100"
								action="#{rowSelectorAction}"
								actionListener="#{rowSelectorActionListener}"
								onkeyup="#{dataTableId}KeyUp(this)"
								onfocus="disableRowSelector();#{dataTableId}SelectRow(this)"
								onblur="enableRowSelector();#{dataTableId}DeselectRow(this)"
								onmouseover="disableRowSelector();"
								onmouseout="enableRowSelector();"				
								focus="#{(focusOnSelect != null)?(focusOnSelect):''}"
								reRender="#{rowSelectorReRender}" >
							</aon:commandLink>
							<f:facet name="footer">
								<ui:insert name="selectFooterContent"/>
							</f:facet>
						</aon:column>

						<aon:column alias="ReservationRequest.hotel.workPlace.description"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotel.workPlace.description}" />
						</aon:column>

						<aon:column alias="ReservationRequest.id"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_reservation_request_id}" />
							</f:facet>
							<aon:outputText value="#{to.id}" />
						</aon:column>

						<aon:column alias="ReservationRequest.code"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_reservation_code}" />
							</f:facet>
							<aon:outputText value="#{to.code}" />
						</aon:column>

						<aon:column alias="ReservationRequest.startDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkIn}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="ReservationRequest.endDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkOut}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_guest}" />
							</f:facet>
							<aon:outputText value="#{to.guestFullName}" />
						</aon:column>

						<c:if test="#{aonRole.saleOperator}">
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{pmsBundle.pms_agency} / #{pmsBundle.pms_company}" />
								</f:facet>
								<aon:outputText value="#{(to.agencyHolder) ? (to.agency.registry.fullName) : (to.company.registry.fullName)}" />
							</aon:column>
						</c:if>

						<aon:column alias="ReservationRequest.active"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{(to.active) ? (pmsBundle.pms_reservation_request_pending) : (pmsBundle.pms_reservation_request_processed)}" />

						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
