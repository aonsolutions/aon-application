<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="hotelGuestList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_hotelGuest_module}" />
				
				<ui:define name="additionalToolbarContent">
				
					<aon:commandButton id="hotelGuest-search"
						title="#{bundle.aon_key_search_accelerator}"
						value="#{bundle.aon_search}" 
						action="hotelGuest_search" actionListener="#{hotelGuest.onInit}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}" />
					
					<aon:htmlCommandLink id="hotelGuest-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="hotelGuest" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="hotelGuest_list"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}"
						action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="hotelGuest" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				
				</ui:define>
				
			</ui:decorate>
 
			<aon:div styleClass="aon-scroll-area">
			
				<aon:panel>
					<aon:panelGrid columns="4" 
						columnClasses="aon-panelGrid-even aon-noborder, 
						aon-panelGrid-even aon-noborder">
				
						<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-bold" />
						<aon:outputText value="#{hotelGuest.hotel.workPlace.description}" />
						
						<aon:outputText value="#{bundle.aon_date}:" styleClass="aon-bold" />
						<aon:outputText value="#{hotelGuest.date}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>

					</aon:panelGrid>
				
				</aon:panel>
			
				<aon:dataTable id="hotelGuestDataList" value="#{hotelGuest.model}" 
					rendered="#{hotelGuest.model!=null and hotelGuest.model.rowCount > 0}" rows="20" var="to">
			
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_guest}" />
							</f:facet>
							<aon:outputText value="#{to.guestName}" />
						</aon:column>
					
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_room}" />
							</f:facet>
							<aon:outputText value="#{to.roomNumber}" />
						</aon:column>
			
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_guests}" />
							</f:facet>
							<aon:outputText value="#{to.guestCount}" />
						</aon:column>
			
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_document}" />
							</f:facet>
							<aon:outputText value="#{to.document}" />
						</aon:column>
			 
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_phone}" />
							</f:facet>
							<aon:outputText value="#{to.telephone}" />
						</aon:column>
			 
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_email}" />
							</f:facet>
							<aon:outputText value="#{to.email}" />
						</aon:column>
			 
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_reservation}" />
							</f:facet>
							<aon:outputText value="#{to.reservationId}" />
						</aon:column>
			 
						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_start_date}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_end_date}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
				</aon:dataTable>
			
				<aon:dataScroller2 for="hotelGuestDataList" showNote="true" />
				
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
