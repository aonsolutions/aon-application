<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="hotelGuestList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_hotelGuest_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="hotelGuest-search"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						value="#{bundle.aon_search}" 
						action="hotelGuest_search"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="hotelGuest-excel-report"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						value="&#160;" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="hotelGuest" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="hotelGuest-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_listing}" action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="hotelGuest" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
					<aon:htmlCommandLink id="hotelGuest-excel-country"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						value="#{bundle.aon_country_order}" 
						action="#{hotelGuest.onByCountry}" target="_blank">
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic" />
					<aon:outputText value="#{hotelGuest.hotel.workPlace.description}" styleClass="aon-margin-left aon-bold" />

					<aon:outputText value="#{bundle.aon_date}:" styleClass="aon-margin-left aon-italic" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{hotelGuest.date}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:panel>

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{hotelGuest}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_guest}" />
							</f:facet>
							<aon:outputText value="#{to.guestName}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_room_number}" />
							</f:facet>
							<aon:outputText value="#{to.roomNumber}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_pax}" />
							</f:facet>
							<aon:outputText value="#{to.guestCount}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-120">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_document}" />
							</f:facet>
							<aon:outputText value="#{to.guestDocument}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-120">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_phone}" />
							</f:facet>
							<aon:outputText value="#{to.guestPhone}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-250">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_email}" />
							</f:facet>
							<aon:outputText value="#{to.guestEmail}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-70">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_id}" />
							</f:facet>
							<aon:outputText value="#{to.reservationId}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkin}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkout}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
