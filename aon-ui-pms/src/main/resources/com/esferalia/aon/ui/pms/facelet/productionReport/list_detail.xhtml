<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">
	
	<aon:panel>
		<c:if test="#{!skipTableHeader}">
			<f:facet name="header">
				<aon:outputLabel value="#{tableHeader}" />
			</f:facet>
		</c:if>
		<aon:dataTable value="#{model}" var="to"
			styleClass="aon-width-all aon-margin-top">
			
			<aon:rowSelector toggleOnClick="#{false}" />
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto aon-nowrap">
				<c:if test="#{!skipHeaders}">
					<f:facet name="header">
						<aon:outputLabel value="#{name}" />
					</f:facet>
				</c:if>
				<aon:outputText value="#{to.description}"  />
				<c:if test="#{!skipFooters}">
					<f:facet name="footer">
						<aon:outputText value="#{bundle.aon_total}"  />
					</f:facet>
				</c:if>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
				<c:if test="#{!skipHeaders}">
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.aon_day}" />
					</f:facet>
				</c:if>
				<aon:outputText value="#{to.dayAmount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<c:if test="#{!skipFooters}">
					<f:facet name="footer">
				
					</f:facet>
				</c:if>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
				<c:if test="#{!skipHeaders}">
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.aon_day} (#{productionReport.previousYear})" />
					</f:facet>
				</c:if>
				<aon:outputText value="#{to.previousDayAmount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<c:if test="#{!skipFooters}">
					<f:facet name="footer">
				
					</f:facet>
				</c:if>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
				<c:if test="#{!skipHeaders}">
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.aon_month}" />
					</f:facet>
				</c:if>
				<aon:outputText value="#{to.monthAmount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<c:if test="#{!skipFooters}">
					<f:facet name="footer">
				
					</f:facet>
				</c:if>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
				<c:if test="#{!skipHeaders}">
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.aon_month} (#{productionReport.previousYear})" />
					</f:facet>
				</c:if>
				<aon:outputText value="#{to.previousMonthAmount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<c:if test="#{!skipFooters}">
					<f:facet name="footer">
				
					</f:facet>
				</c:if>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
				<c:if test="#{!skipHeaders}">
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.aon_year}" />
					</f:facet>
				</c:if>
				<aon:outputText value="#{to.yearAmount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<c:if test="#{!skipFooters}">
					<f:facet name="footer">
				
					</f:facet>
				</c:if>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-150">
				<c:if test="#{!skipHeaders}">
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.aon_year} (#{productionReport.previousYear})" />
					</f:facet>
				</c:if>
				<aon:outputText value="#{to.previousYearAmount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<c:if test="#{!skipFooters}">
					<f:facet name="footer">
				
					</f:facet>
				</c:if>
			</aon:column>
			
		</aon:dataTable>
	</aon:panel>
