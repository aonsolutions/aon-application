<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showRoomDetailWindow">
		<aon:if test="#{controller.showRoomDetailWindow}">
			<rich:modalPanel id="roomDetailModalPanel" minHeight="425" minWidth="760" 
				showWhenRendered="#{controller.showRoomDetailWindow}"
				zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{(controller.to.roomNumber == null) ? (bundle.pms_room_assign) : (bundle.pms_room_change)}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{controller.onCancel}"
							reRender="aonContent" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showRoomDetailWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="roomDetailForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="roomDetail-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_save} #{bundle.pms_stay}"
										rendered="#{reservation.reservationPermission.acceptReservationRoomAllowed}"
										actionListener="#{controller.onAcceptReservationRoom}">
										<rich:componentControl for="roomDetailModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showRoomDetailWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="roomDetail-cancel"
										styleClass="aon-finding-toolbar-item aon-icon-removed"
										value="#{bundle.pms_room_assign_cancel}"
										rendered="#{reservation.reservationPermission.cancelReservationRoomAllowed}"
										actionListener="#{controller.onCancelReservationRoom}"
										reRender="showRoomDetailWindow" immediate="true">
										<f:setPropertyActionListener
											target="#{roomAvailability.availableRoomList}"
											value="#{null}" />
									</aon:commandButton>
									<aon:commandButton id="roomDetail-remove"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										value="#{bundle.aon_remove} #{bundle.pms_stay}"
										rendered="#{!controller.nevv and reservation.reservationPermission.removeReservationRoomAllowed}"
										actionListener="#{controller.onRemoveReservationRoom}"
										immediate="true">
										<rich:componentControl for="roomDetailModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showRoomDetailWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="roomDetail-back"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}" 
										actionListener="#{controller.onCancel}"
										reRender="aonContent" immediate="true">
										<f:setPropertyActionListener
											target="#{controller.showRoomDetailWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid columns="2" columnClasses="aon-margin-top aon-width-500, aon-vertical-align-top aon-padding-left aon-width-auto">
										<aon:panelGrid columns="2" columnClasses="aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-350">

											<aon:outputLabel value="Periodo Cambio"
												rendered="#{!reservation.reservationPermission.reservationRoomServicesEditable}" />
											<aon:div id="ProjectReservationRoomDates" rendered="#{!reservation.reservationPermission.reservationRoomServicesEditable}">
												<aon:outputText value="#{bundle.aon_date_from}" styleClass="aon-italic aon-margin-right" />
												<aon:commandButton id="previousStartDate" 
													styleClass="aon-text-center"
													value="-" ignoreDupResponses="true"
													reRender="ProjectReservationRoomDates,ProjectReservationRoomAvailability"
													actionListener="#{controller.onMinusStartDate}" />
												<aon:outputText value="#{roomAvailability.filterParams.viewerStartDate}" styleClass="aon-bold">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
												<aon:commandButton id="nextStartDate" 
													styleClass="aon-text-center"
													value="+" ignoreDupResponses="true"
													reRender="ProjectReservationRoomDates,ProjectReservationRoomAvailability"
													actionListener="#{controller.onPlusStartDate}" />

												<aon:outputText value="#{bundle.aon_date_to}" styleClass="aon-italic aon-margin-left aon-margin-right" />
												<aon:commandButton id="previousEndDate" 
													styleClass="aon-text-center"
													value="-" ignoreDupResponses="true"
													reRender="ProjectReservationRoomDates,ProjectReservationRoomAvailability"
													actionListener="#{controller.onMinusEndDate}" />
												<aon:outputText value="#{roomAvailability.filterParams.viewerEndDate}" styleClass="aon-bold">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
												<aon:commandButton id="nextEndDate" 
													styleClass="aon-text-center"
													value="+" ignoreDupResponses="true"
													reRender="ProjectReservationRoomDates,ProjectReservationRoomAvailability"
													actionListener="#{controller.onPlusEndDate}" />
											</aon:div>

											<aon:outputLabel for="ProjectReservationRoom_item"
												value="#{bundle.pms_room_type}" />
											<aon:selectOneMenu id="ProjectReservationRoom_item" styleClass="aon-width-350"
												value="#{roomAvailability.filterParams.item}" required="#{controller.nevv}"
												valueChangeListener="#{roomAvailability.onItemFilterChanged}"
												reRender="ProjectReservationRoomAvailability">
												<f:selectItem itemLabel="-" value="#{null}" />
												<f:selectItems value="#{reservation.hotelRoomItems}" />
											</aon:selectOneMenu>

											<aon:outputLabel for="ProjectReservationRoom_tariff"
												value="#{bundle.report_tariff}"
												rendered="#{controller.nevv or reservation.reservationPermission.reservationRoomTariffAllowed}" />
											<aon:selectOneMenu id="ProjectReservationRoom_tariff" 
												value="#{controller.to.tariff}" required="true"
												rendered="#{controller.nevv or reservation.reservationPermission.reservationRoomTariffAllowed}"
												disabled="#{!reservation.reservationPermission.reservationRoomTariffEditable}">
												<f:selectItems value="#{pmsCollections.tariffs}" />
											</aon:selectOneMenu>

											<aon:outputLabel for="ProjectReservationRoom_adults"
												value="#{bundle.pms_adults}" />
											<aon:outputText	value="#{controller.to.adults}" styleClass="aon-bold" 
												rendered="#{!reservation.reservationPermission.reservationRoomPaxesEditable}" />
											<aon:inputText id="ProjectReservationRoom_adults" 
												value="#{controller.to.adults}" required="true"
												rendered="#{reservation.reservationPermission.reservationRoomPaxesEditable}"
												size="2" maxlength="2" />

											<aon:outputLabel for="ProjectReservationRoom_children"
												value="#{bundle.pms_children}" />
											<aon:outputText	value="#{controller.to.children}" styleClass="aon-bold" 
												rendered="#{!reservation.reservationPermission.reservationRoomPaxesEditable}" />
											<aon:inputText id="ProjectReservationRoom_children" 
												value="#{controller.to.children}" required="true"
												rendered="#{reservation.reservationPermission.reservationRoomPaxesEditable}"
												size="2" maxlength="2" />

											<aon:outputLabel value="#{bundle.pms_available_rooms}" />
											<aon:div id="ProjectReservationRoomAvailability" style="white-space:normal; display:inline;">
												<aon:outputText value="#{bundle.pms_no_room_available_msg}" styleClass="aon-bold aon-label-error"
													rendered="#{roomAvailability.availableRoomCount == 0}" />
												<a4j:repeat value="#{roomAvailability.availableRoomList}" var="availableRoom"
													rendered="#{roomAvailability.availableRoomCount > 0}">
													<aon:commandLink styleClass="aon-dataTable-link-noicon aon-bold aon-nowrap"
														value="#{availableRoom.asset.name}" immediate="true"
														actionListener="#{controller.onAssignReservationRoom}">
														<f:param name="availableRoom" value="#{availableRoom.asset.id}"/>
														<f:setPropertyActionListener
															target="#{controller.showRoomDetailWindow}"
															value="#{false}" />
														<rich:componentControl for="roomDetailModalPanel"
															event="onclick" operation="hide"/>																					
													</aon:commandLink>
													<aon:outputText value=" " />
												</a4j:repeat>
											</aon:div>

											<aon:outputLabel for="ProjectReservationRoom_serviceList"
												value="#{bundle.pms_room_services}" />
											<aon:div>
												<aon:selectManyCheckbox id="ProjectReservationRoom_serviceList" layout="pageDirection" 
													value="#{controller.linkedServices}" ajaxSingle="true"
													rendered="#{reservation.reservationPermission.reservationRoomServicesEditable}">
													<f:selectItems value="#{controller.availableServicesList}" />
												</aon:selectManyCheckbox>
												<aon:dataTable id="linkedServicesList" styleClass="aon-noborder"
													value="#{controller.linkedServicesList}" var="linkedService"
													rendered="#{!reservation.reservationPermission.reservationRoomServicesEditable}">
													<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-noborder"
														style="font-size: 0.9em;">
														<aon:outputText value="#{linkedService.description}" />
													</aon:column>
												</aon:dataTable>
											</aon:div>

										</aon:panelGrid>

										<aon:div id="ProjectReservationRoomFilters" styleClass="aon-panelGrid-search aon-nomargin aon-text-center aon-width-170">
											<aon:div>
												<aon:outputText value="#{bundle.pms_room_number}" styleClass="aon-italic aon-margin-right" />
												<aon:inputText value="#{roomAvailability.filterParams.name}" 
													size="3" maxlength="5" />
											</aon:div>
											<aon:selectManyCheckbox styleClass="aon-text-left" layout="pageDirection"
												value="#{roomAvailability.filterParams.featureFilter}">
												<f:selectItems value="#{assetCollections.featuresIds}" />
											</aon:selectManyCheckbox>
											<aon:commandButton id="addFeature" ignoreDupResponses="true"
												value="#{bundle.aon_filter}" styleClass="aon-margin-top"
												actionListener="#{roomAvailability.onFilter}"
												reRender="ProjectReservationRoomAvailability,ProjectReservationRoomFilters" />
										</aon:div>

									</aon:panelGrid>

								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
