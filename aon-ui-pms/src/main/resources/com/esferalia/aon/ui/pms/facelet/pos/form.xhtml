<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{pmsBundle.pms_pos_module}" />
				<ui:param name="controller" value="#{pos}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="posPanel" columns="2" >
					<aon:outputLabel for="pos_name" value="#{bundle.aon_name}" />
					<aon:inputText id="pos_name" value="#{pos.to.name}" 
						size="32" required="true">
						<f:validateLength maximum="32" />
					</aon:inputText>
					
					<aon:outputLabel value="#{pmsBundle.pms_hotel}" />
					<aon:selectOneMenu 
						value="#{pos.to.workPlace}" >
						<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel value="#{pmsBundle.pms_invoiceable}" />
					<aon:selectBooleanCheckbox value="#{pos.to.invoiceable}" >
						<a4j:support event="onclick" reRender="posPanel" ignoreDumpResponses="true" ajaxSingle="true" />
					</aon:selectBooleanCheckbox>
					
					<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
						<ui:param name="lookupTo" value="#{pos.to.item}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipNewButton" value="#{true}" />
						<ui:param name="lookupRendered" value="#{pos.to.invoiceable}" />
					</ui:include>
					
				</aon:panelGrid>
				
			</aon:div>
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
		
	</ui:define>
</ui:composition>
