<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showAdvanceInvoiceWindow">
		<aon:if test="#{controller.showAdvanceInvoiceWindow}">
			<rich:modalPanel id="advanceInvoiceModalPanel" minHeight="240" minWidth="580" 
				rendered="#{controller.showAdvanceInvoiceWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.pms_advance_invoice_module}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showAdvanceInvoiceWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showAdvanceInvoiceWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="advanceInvoiceForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="advanceInvoiceModalToolbar" styleClass="aon-toolbar">
									<aon:commandButton id="advanceInvoice-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_key_invoice_description}"
										actionListener="#{controller.onAdvanceInvoice}"
										reRender="aonContent"
										onclick="Richfaces.showModalPanel('waitProccess')"
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="advanceInvoiceModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showAdvanceInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="advanceInvoice-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										reRender="showAdvanceInvoiceWindow">
										<f:setPropertyActionListener
											target="#{controller.showAdvanceInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div id="advanceInvoiceModalContent" styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">

										<aon:outputLabel for="AdvanceInvoice_amount"
											value="#{bundle.pms_invoice_amount}" />
										<aon:outputText value="#{controller.advanceInvoiceTo.amount}" 
											rendered="#{controller.to.advance != 0 and !reservation.reservationPermission.advanceEditable}"	
											styleClass="aon-bold">
											<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
										</aon:outputText>
										<aon:inputText id="AdvanceInvoice_amount" 
											value="#{controller.advanceInvoiceTo.amount}"
											required="true" size="10"
											rendered="#{controller.to.advance == 0 or controller.reservationPermission.advanceEditable}"
											ajaxSingle="true">
										</aon:inputText>

										<aon:outputLabel for="AdvanceInvoice_payMethod"
											value="#{bundle.finance_payMethod}" />
										<aon:selectOneMenu id="AdvanceInvoice_payMethod"
											value="#{controller.advanceInvoiceTo.payMethod}" required="true"
											reRender="advanceInvoiceModalContent" ajaxSingle="true">
											<f:selectItem itemLabel="-" value="#{null}" />
											<f:selectItems value="#{configCollections.directPayMethods}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
