<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="GuestDocumentDiv#{suffix}" styleClass="aon-width-all">
		<aon:panelGrid columns="2" columnClasses="aon-italic,">
			<aon:outputLabel for="ProjectReservationGuest_documentType" value="#{bundle.aon_type}" />
			<aon:selectOneMenu id="ProjectReservationGuest_documentType#{suffix}" styleClass="aon-form-input-text"
				value="#{controller.to.documentType}"
				valueChangeListener="#{controller.onDocumentTypeChanged}"
				reRender="GuestDocumentDiv#{suffix},GuestNameDiv#{suffix},GuestContactDiv#{suffix},GuestAddressDiv#{suffix}"
				focus="ProjectReservationGuest_documentCountry#{suffix}">
				<f:selectItems value="#{pmsCollections.personDocumentTypes}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="ProjectReservationGuest_documentCountry" value="#{bundle.aon_country}" />
			<aon:div>
				<aon:selectOneMenu id="ProjectReservationGuest_documentCountry#{suffix}" styleClass="aon-form-input-text aon-margin-right"
					value="#{controller.to.documentCountry}"
					valueChangeListener="#{controller.onDocumentCountryChanged}"
					reRender="GuestDocumentDiv#{suffix},GuestNameDiv#{suffix},GuestContactDiv#{suffix},GuestAddressDiv#{suffix}"
					focus="ProjectReservationGuest_document#{suffix}">
					<f:selectItems value="#{commonCollections.countryCodes}" />
				</aon:selectOneMenu>
				<aon:outputText value="&#160;" styleClass="aon-icon-commandButton aon-icon-contact"
					title="#{bundle.pms_reservation_guest_type_newInHotel}"
					rendered="#{controller.to.person.id != null and controller.to.guestNewInHotel}" />
				<aon:outputText value="&#160;" styleClass="aon-icon-commandButton aon-icon-contact-new"
					title="#{bundle.pms_reservation_guest_type_newInChain}"
					rendered="#{!empty controller.to.document and !controller.to.guestNewInHotel and !controller.to.guestPreviouslyStayedInHotel}" />
				<aon:outputText value="&#160;" styleClass="aon-icon-commandButton aon-icon-contact-error"
					title="#{bundle.pms_reservation_guest_type_previouslyStayedInHotel}"
					rendered="#{controller.to.person.id != null and controller.to.guestPreviouslyStayedInHotel}" />
			</aon:div>

			<aon:outputLabel for="ProjectReservationGuest_document" value="#{bundle.aon_number}" />
			<aon:inputText id="ProjectReservationGuest_document#{suffix}" styleClass="aon-form-input-text"
				value="#{controller.to.document}" size="15" maxlength="16"
				valueChangeListener="#{controller.onDocumentChanged}"
				reRender="GuestDocumentDiv#{suffix},GuestNameDiv#{suffix},GuestContactDiv#{suffix},GuestAddressDiv#{suffix}"
				onblur="toUpperCase(this);" ajaxSingle="true"
				converter="aon.TrimStringConverter"
				focus="ProjectReservationGuest_name#{suffix}" />

			<aon:outputLabel for="ProjectReservationGuest_documentExpDate" value="#{bundle.aon_expedition_date}" />
			<aon:selectInputDate id="ProjectReservationGuest_documentExpDate#{suffix}" inputClass="aon-form-input-text"
				value="#{controller.to.documentExpDate}" 
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}">
				<a4j:support event="oninputchange"
					reRender="ProjectReservationGuest_documentExpDate#{suffix}" ajaxSingle="true" />
				<a4j:support event="onchanged"
					reRender="ProjectReservationGuest_documentExpDate#{suffix}" ajaxSingle="true" />
			</aon:selectInputDate>
		</aon:panelGrid>

		<aon:outputText value="#{bundle.registry_document_incorrect}" styleClass="aon-label-error aon-margin-left"
			rendered="#{!empty controller.to.document and controller.to.documentValidable and !controller.to.validDocument}" />
 	</aon:div>
</ui:composition>
