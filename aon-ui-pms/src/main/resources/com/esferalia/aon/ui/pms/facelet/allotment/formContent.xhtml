<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelGrid columns="2" 	
		columnClasses="aon-panelGrid-odd aon-width-150,	aon-panelGrid-even aon-width-500">

		<aon:outputLabel for="Allotment_hotel_id" value="#{bundle.aon_module_hotel}" />
		<aon:outputText	value="#{allotment.to.hotel.workPlace.description}" styleClass="aon-bold"
			rendered="#{!allotment.nevv}" />
		<aon:selectOneMenu id="Allotment_hotel_id" value="#{allotment.to.hotel}" 
			rendered="#{allotment.nevv}" required="true"
			valueChangeListener="#{allotment.onHotelChanged}" 
			reRender="AllotmentItemDiv" ajaxSingle="true">
			<aon:if test="#{allotment.nevv}">
				<f:selectItem itemLabel="-" value="#{null}"/>
			</aon:if>
			<f:selectItems value="#{pmsCollections.currentUserHotels}" />
		</aon:selectOneMenu>

		<aon:div id="AllotmentHolderLabel">
			<aon:outputLabel for="Allotment_rateCode" value="#{bundle.aon_id}"
				rendered="#{allotment.rateCode}" />
			<aon:outputLabel for="Allotment_agency" value="#{bundle.report_agency}"
				rendered="#{!allotment.rateCode and !allotment.group}" />
			<aon:outputLabel for="Allotment_agencyGroup" value="#{bundle.aon_group}"
				rendered="#{!allotment.rateCode and allotment.group}" />
		</aon:div>
		<aon:panelGrid id="AllotmentHolderPanel" columns="2" columnClasses="aon-width-400, aon-width-auto">
			<aon:div>
				<aon:outputText value="#{allotment.to.rateCode}" styleClass="aon-bold" 
					rendered="#{!allotment.nevv and allotment.rateCode}"  />
				<aon:inputText id="Allotment_rateCode" value="#{allotment.to.rateCode}"
					size="10" maxlength="8" required="true"
					rendered="#{allotment.nevv and allotment.rateCode}"
					ajaxSingle="true" />

				<aon:outputText value="#{allotment.to.agency.registry.fullName}" styleClass="aon-bold" 
					rendered="#{!allotment.nevv and !allotment.rateCode and !allotment.group}"  />
				<aon:selectOneMenu id="Allotment_agency" value="#{allotment.to.agency}" 
					required="true" styleClass="aon-width-350"
					rendered="#{allotment.nevv and !allotment.rateCode and !allotment.group}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{pmsCollections.agencies}" />
				</aon:selectOneMenu>

				<aon:outputText value="#{allotment.to.agencyGroup.description}" styleClass="aon-bold" 
					rendered="#{!allotment.nevv and !allotment.rateCode and allotment.group}"  />
				<aon:selectOneMenu id="Allotment_agencyGroup" value="#{allotment.to.agencyGroup}" 
					required="true" styleClass="aon-width-350"
					rendered="#{allotment.nevv and !allotment.rateCode and allotment.group}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{pmsCollections.agencyGroups}" />
				</aon:selectOneMenu>
			</aon:div>
			<aon:div rendered="#{allotment.nevv}">
				<aon:commandLink id="Allotment-mode" immediate="true"
					styleClass="aon-italic" style="text-decoration:underline;"
					value="#{allotment.rateCode ? bundle.report_agency : !allotment.group ? bundle.aon_group : bundle.aon_id}"
					rendered="#{pmsCollections.agencyGroupsCount > 0}"
					actionListener="#{allotment.onChangeHolder}"
					reRender="allotmentForm" />
			</aon:div>
		</aon:panelGrid>

		<aon:outputLabel for="Allotment_startDate" value="#{bundle.aon_start_date}" />
		<aon:selectInputDate id="Allotment_startDate" value="#{allotment.to.startDate}" 
			required="true"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />

		<aon:outputLabel for="Allotment_endDate" value="#{bundle.aon_end_date}" />
		<aon:selectInputDate id="Allotment_endDate" value="#{allotment.to.endDate}" 
			required="true"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />

		<aon:outputLabel for="Allotment_quantity" value="#{bundle.pms_allotment}" />
		<aon:inputText id="Allotment_quantity" value="#{allotment.to.quantity}"
			size="3" maxlength="4" required="true"
			ajaxSingle="true" />

		<aon:outputLabel for="Allotment_item" value="#{bundle.pms_room}" 
			rendered="#{allotment.rateCode}" />
		<aon:outputLabel value="#{bundle.report_rooms}" rendered="#{!allotment.rateCode}" />
		<aon:div id="AllotmentItemDiv">
			<a4j:region rendered="#{!allotment.rateCode}">
				<a4j:repeat value="#{allotment.items}" rowKeyVar="allotmentItemIdx" var="allotmentItem">
					<aon:div>
						<aon:panelGrid columns="2" 	
							columnClasses="aon-width-300,aon-width-auto">
							<aon:outputText	value="#{allotment.items[allotmentItemIdx].product.code} - #{allotment.items[allotmentItemIdx].product.name}" 
								styleClass="aon-bold" />
							<aon:commandButton id="AllotmentItem-remove"
								styleClass="aon-finding-toolbar-item aon-search-minus"
								value="&#160;" immediate="true"
								actionListener="#{allotment.onRemoveItem}"
								reRender="AllotmentItemDiv">
								<f:param name="allotmentItemIdx" value="#{allotmentItemIdx}" />
							</aon:commandButton>
						</aon:panelGrid>
					</aon:div>						
				</a4j:repeat>
			</a4j:region>
			<aon:panelGrid columns="2"
				columnClasses="aon-width-300,aon-width-auto">
				<aon:selectOneMenu id="Allotment_item" value="#{allotment.item}"
					styleClass="aon-width-300" required="#{allotment.rateCode}"
					valueChangeListener="#{allotment.onItemChanged}" 
					reRender="AllotmentItemDiv">
					<f:selectItem itemLabel="#{(allotment.rateCode or allotment.itemsSize > 0)?'-':bundle.aon_common_all}" value="#{null}" />
					<aon:if test="#{allotment.to.hotel != null and allotment.to.hotel.id != null}">
						<f:selectItems value="#{allotment.hotelRoomItems}" />
					</aon:if>
				</aon:selectOneMenu>
				<aon:commandButton id="AllotmentItem-add"
					styleClass="aon-finding-toolbar-item aon-search-add"
					value="&#160;" immediate="true"
					rendered="#{!allotment.rateCode and allotment.item != null}"
					actionListener="#{allotment.onAddItem}"
					reRender="AllotmentItemDiv" />
			</aon:panelGrid>
		</aon:div>			

		<aon:outputLabel value="#{bundle.product_tariff_module2}" rendered="#{!allotment.rateCode}" />
		<aon:div id="AllotmentTariffDiv" rendered="#{!allotment.rateCode}">
			<a4j:region>
				<a4j:repeat value="#{allotment.tariffs}" rowKeyVar="allotmentTariffIdx" var="allotmentTariff">
					<aon:div >
						<aon:panelGrid columns="2" 	
							columnClasses="aon-width-300,aon-width-auto">
							<aon:outputText	value="#{allotment.tariffs[allotmentTariffIdx].code} - #{allotment.tariffs[allotmentTariffIdx].name}" 
								styleClass="aon-bold" />
							<aon:commandButton id="AllotmentTariff-remove"
								styleClass="aon-finding-toolbar-item aon-search-minus"
								value="&#160;" immediate="true"
								actionListener="#{allotment.onRemoveTariff}"
								reRender="AllotmentTariffDiv">
								<f:param name="allotmentTariffIdx" value="#{allotmentTariffIdx}" />
							</aon:commandButton>
						</aon:panelGrid>
					</aon:div>						
				</a4j:repeat>
			</a4j:region>
			<aon:panelGrid columns="2"
				columnClasses="aon-width-300,aon-width-auto">
				<aon:selectOneMenu id="Allotment_tariff" value="#{allotment.tariff}"
					styleClass="aon-width-300"
					valueChangeListener="#{allotment.onTariffChanged}" 
					reRender="AllotmentTariffDiv">
					<f:selectItem itemLabel="#{(allotment.tariffsSize > 0)?'-':bundle.aon_common_all}" value="#{null}"/>
					<f:selectItems value="#{allotment.roomTariffs}" />
				</aon:selectOneMenu>
				<aon:commandButton id="AllotmentTariff-add"
					styleClass="aon-finding-toolbar-item aon-search-add"
					value="&#160;" immediate="true"
					rendered="#{allotment.tariff != null}"
					actionListener="#{allotment.onAddTariff}"
					reRender="AllotmentTariffDiv" />
			</aon:panelGrid>
		</aon:div>			

		<aon:outputLabel for="Allotment_remarks" value="#{bundle.aon_remark}" />
		<aon:inputTextarea id="Allotment_remarks" value="#{allotment.to.remarks}"
 			cols="66" rows="4"
			ajaxSingle="true" />

		<aon:outputLabel for="Allotment_active" value="#{bundle.aon_status}" />
		<aon:selectOneRadio id="Allotment_active" value="#{allotment.to.active}">
			<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="true" />
			<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="false" />
		</aon:selectOneRadio>				

	</aon:panelGrid>

 </ui:composition>
