<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinanceSearchWindow">
		<aon:if test="#{controller.showFinanceSearchWindow}">
			<rich:modalPanel id="financeSearchModalPanel" minHeight="450"
				minWidth="600" rendered="#{controller.showFinanceSearchWindow}"
				showWhenRendered="true" zindex="100" style="overflow: auto;">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.finance_refine_search}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFinanceSearchWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showFinanceSearchWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="financeSearchForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="financeSearch-clear"
										value="#{bundle.aon_clear}"
										ajaxSingle="true"
										actionListener="#{controller.onClear}"
										styleClass="aon-finding-toolbar-item aon-icon-rubber" />
									<aon:commandButton id="financeSearch-search"
										value="#{bundle.aon_search}"
										reRender="showFinanceSearchWindow,#{searchReRender}"
										actionListener="#{controller.onSearch}"
										styleClass="aon-finding-toolbar-item aon-icon-search">
										<rich:componentControl for="financeSearchModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showFinanceSearchWindow}"
											value="#{false}" />
										<aon:actionHotKey key="return" />
									</aon:commandButton>
									<aon:commandButton id="financeSearch-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showFinanceSearchWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{controller.showFinanceSearchWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area">
									<aon:panel>
										<f:facet name="header">
											<aon:outputText value="#{bundle.finance_finance}" />
										</f:facet>
										<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/searchFinance.xhtml">
											<ui:param name="skipAgency" value="#{true}" />
										</ui:include>
									</aon:panel>

									<aon:panel>
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_reservation}" />
										</f:facet>
										<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/searchReservation.xhtml" />
									</aon:panel>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
