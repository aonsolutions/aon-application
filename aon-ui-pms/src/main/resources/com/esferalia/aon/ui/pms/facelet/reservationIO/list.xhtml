<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posShiftList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_reservationIO_module}" />
				<ui:param name="controller" value="#{reservationIO}" />
				<ui:param name="skipResetButton" value="#{true}" />
				
				<ui:define name="additionalToolbarContent">
				
					<aon:htmlCommandLink id="expense_list"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="reservationIO" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				
				</ui:define>
				
			</ui:decorate>
 

			<aon:div styleClass="aon-scroll-area">
				
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{reservationIO}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					
					<ui:define name="columns">
					
						<aon:column 
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputLabel value="#{pmsBundle.pms_room_number}" />
							</f:facet>
							<aon:outputText value="#{to.roomNumber}" />
						</aon:column>
 
						<aon:column alias="ProjectReservationRoom.item.product.code"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputLabel value="#{pmsBundle.pms_room_type}" />
							</f:facet>
							<aon:outputText value="#{to.item.product.code} - #{to.item.product.name}" />
						</aon:column>
 
						<aon:column   
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_guest}" />
							</f:facet>
							<aon:outputText value="#{to.projectReservation.guestFullName}" />
						</aon:column>
	
						<aon:column alias="ProjectReservationRoom.projectReservation.startDate"
							styleClass="aon-editDataTable-dateColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_start_date}" />
							</f:facet>
							<aon:outputText value="#{to.projectReservation.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
						<aon:column alias="ProjectReservationRoom.projectReservation.endDate"
							styleClass="aon-editDataTable-dateColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_end_date}" />
							</f:facet>
							<aon:outputText value="#{to.projectReservation.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="ProjectReservationRoom.projectReservation.id"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputLabel value="#{pmsBundle.pms_reservation_id}" />
							</f:facet>
							<aon:outputText value="#{to.projectReservation.id}" />
						</aon:column>

						<aon:column alias="ProjectReservationRoom.projectReservation.code" 
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputLabel value="#{pmsBundle.pms_reservation_code}" />
							</f:facet>
							<aon:outputText value="#{to.projectReservation.code}" />
						</aon:column>

						<aon:column alias="ProjectReservationRoom.projectReservation.status"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.projectReservation.status}"   />
						</aon:column>
	
					</ui:define>
				</ui:decorate>
				
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
