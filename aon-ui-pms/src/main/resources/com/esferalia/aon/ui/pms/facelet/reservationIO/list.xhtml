<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="reservationIOList">
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_reservationIO_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="reservationIO_search" 
						actionListener="#{reservationIO.onInit}"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="reservationIO-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="reservationIO" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="reservationIO-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="reservationIO" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{(reservationIO.hotel!=null and reservationIO.hotel.id!=null) ? (reservationIO.hotel.workPlace.description) : ('-')}" />

					<aon:outputText value="#{reservationIO.checkin ? bundle.report_checkin : bundle.report_checkout}:" styleClass="aon-margin-left aon-italic"/>
					<aon:div style="display: inline;">
						<aon:outputText value="#{bundle.aon_date_from}:" styleClass="aon-margin-left aon-italic" />
						<aon:outputText value="#{reservationIO.fromDate}" styleClass="aon-margin-left aon-bold">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>

						<aon:outputText value="#{bundle.aon_date_to}:" styleClass="aon-italic aon-margin-left" />
						<aon:outputText value="#{reservationIO.toDate}" styleClass="aon-margin-left aon-bold">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:div>
				</aon:panel>

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{reservationIO}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<f:facet name="header">
							<rich:columnGroup>
								<rich:column colspan="3">
									<aon:outputText value="&#160;" />
								</rich:column>
								
								<rich:column colspan="4">
									<aon:outputText value="#{bundle.pms_room}" />
								</rich:column>
								
								<rich:column colspan="#{reservationIO.checkin ? 8 : 7}">
									<aon:outputText value="#{bundle.aon_reservation}" />
								</rich:column>
							</rich:columnGroup>
						</f:facet>
	
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="S" />
							</f:facet>
							<aon:commandLink id="reservationIOData-selectButton" 
								styleClass="#{(to.invoiced) ? 
												('aon-icon-predetermine') : 
												((to.blocked) ? 
													('aon-icon-lock') : 
													((to.roomNumber == null) ?
														('aon-icon-point-red') :
														((to.mealPlan == null) ?
															('aon-icon-point-yellow') :
															('aon-icon-point-green'))))}" 
								value="&#160;&#160;&#160;&#160;"
								title="#{(to.invoiced) ? 
											(bundle.pms_invoiced) :
											((to.blocked) ?
												(bundle.pms_blocked) :
												((to.roomNumber == null) ?
													(bundle.pms_room_assignation_pending_msg) :
													((to.mealPlan == null) ?
														(bundle.pms_service_assignation_pending_msg) :
														(bundle.pms_active))))}" 
								immediate="true" ajaxSingle="true" requestDelay="100"
								action="reservation_form"
								actionListener="#{reservationIO.onSelect}">
							</aon:commandLink>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="C" />
							</f:facet>
							<aon:outputText value="&#160;" 
								styleClass="aon-icon-commandButton #{(to.checkIn) ? ('aon-icon-check-in') : ((to.checkOut) ? ('aon-icon-check-out') : (''))}"
								title="#{(to.checkIn) ? (bundle.pms_check_in) : ((to.checkOut) ? (bundle.pms_check_out) : (''))}" /> 
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="O" />
							</f:facet>
							<aon:outputText value="&#160;" 
								styleClass="aon-icon-commandButton #{(to.wrongCheck) ? ('aon-icon-comment-red') : ('aon-icon-comment')}"
								rendered="#{!empty to.comments}" /> 
							<rich:toolTip showEvent="onclick" hideEvent="onmouseout" rendered="#{!empty to.comments}">
								<aon:outputText value="#{to.comments}" /> 
							</rich:toolTip>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-30">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_number_abr}" />
							</f:facet>
							<aon:outputText value="#{to.roomNumber}"  
								style="#{(to.roomDirty or (to.diverted and !to.myDivert)) ? ('color:red;') : 
											((to.roomOccupied ) ? ('color:orange;') : ((to.roomClean or to.myDivert) ? ('color:forestgreen;') : ''))}"
								title="#{(to.roomDirty) ? (bundle.pms_room_dirty) : 
											((to.roomOccupied) ? (bundle.pms_room_occupied) : ((to.roomClean) ? (bundle.pms_room_clean) : ''))}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-30">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.roomCode}"
								style="#{(to.diverted || to.noRooms) ? ((!to.myDivert || to.noRooms) ? ('color:red;') : ('color:forestgreen;')) : ''}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.report_pax}" />
							</f:facet>
							<aon:outputText value="#{to.pax}"
								style="#{(to.diverted) ? ((!to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-30">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.pms_board}" />
							</f:facet>
							<aon:outputText value="#{to.mealPlan}"
								style="#{(to.diverted) ? ((!to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{to.total}" 
								style="#{(to.diverted) ? ((!to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}"
								rendered="#{to.guestHolder}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:outputText value="#{bundle.pms_credit}" 
								style="#{(to.diverted) ? ((!to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}"
								rendered="#{to.agencyHolder}" />
						</aon:column>

						<aon:if test="#{reservationIO.checkin and reservationIO.touristTaxItem != null}">
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-40">
								<f:facet name="header">
									<aon:outputText value="#{bundle.pms_tourist_tax_abrv}" />
								</f:facet>
								<aon:outputText value="#{to.touristTaxAmount}" 
									style="#{(to.diverted) ? ((!to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}"
									rendered="#{to.touristTaxFree == null}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
								<aon:outputText value="#{bundle.aon_exempt}" 
									style="#{(to.diverted) ? ((!to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}"
									rendered="#{to.touristTaxFree != null}" />
							</aon:column>
						</aon:if>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-50">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_number}" />
							</f:facet>
							<aon:outputText value="#{to.reservation}"
								style="#{(to.diverted) ? ((!to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}" />
							<aon:outputText value="&#160;" 
								styleClass="aon-dataTable-link"
								rendered="#{to.diverted}" /> 
							<rich:toolTip showEvent="onclick" hideEvent="onmouseout" rendered="#{to.diverted}">
								<aon:outputText value="#{(!to.myDivert) ? to.hotelName : to.hotelReservationName}" /> 
							</rich:toolTip>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-60">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkin}" />
							</f:facet>
							<aon:outputText value="#{to.checkInDate}"
								style="#{(to.lateCheckIn or to.diverted) ? ((to.lateCheckIn or !to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-60">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkout}" />
							</f:facet>
							<aon:outputText value="#{to.checkOutDate}"
								style="#{(to.earlyCheckOut or to.diverted) ? ((to.earlyCheckOut or !to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_guest}" />
							</f:facet>
							<aon:outputText value="#{to.guest}"
								style="#{(to.diverted) ? ((!to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}" />
							<aon:outputText value="&#160;" styleClass="aon-icon-call-error aon-padding-left aon-margin-left" 
								rendered="#{empty to.phone}" />
							<aon:outputText value="&#160;" styleClass="aon-icon-mailInbox-error aon-padding-left aon-margin-left" 
								rendered="#{empty to.email}" />
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_agency}" />
							</f:facet>
							<aon:outputText value="#{to.agency}"
								style="#{(to.diverted) ? ((!to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}" />
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-110">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_reservation_code}" />
							</f:facet>
							<aon:outputText value="#{to.code}"
								style="#{(to.diverted) ? ((!to.myDivert) ? ('color:red;') : ('color:forestgreen;')) : ''}" />
						</aon:column>
						
					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
