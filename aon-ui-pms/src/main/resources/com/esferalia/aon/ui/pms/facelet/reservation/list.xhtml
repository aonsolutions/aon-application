<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.asset_activity_module}" />
				<ui:param name="controller" value="#{reservation}" />
				<ui:param name="skipResetButton" value="#{!reservation.reservationPermission.newReservationAllowed}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="reservation-Refresh"
						value="#{bundle.webmail_refresh}" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh"
						actionListener="#{reservation.onSearch}"
						reRender="aonContent" />
					<aon:htmlCommandLink id="reservation-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="reservationList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="reservation-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="reservationList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>							
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{reservation}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">
					
						<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservation/listContent.xhtml" />

					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
