<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_reservation_module}" />
				<ui:param name="controller" value="#{reservation}" />
				<ui:param name="skipResetButton" value="#{!aonRole.saleOperator}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="inputOutput_list"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{pmsBundle.pms_input_output_listing}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="reservationInputOuput" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{reservation}" />
					<ui:define name="columns">
				
						<aon:column alias="ProjectReservation.hotel.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_hotel}" />
							</f:facet>
							<h:outputText value="#{to.hotel.workPlace.description}" />
						</aon:column>

						<aon:column alias="ProjectReservation.project.id"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_reservation_id}" />
							</f:facet>
							<h:outputText value="#{to.id}" />
						</aon:column>

						<aon:column alias="ProjectReservation.code"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_reservation_code}" />
							</f:facet>
							<aon:outputText value="#{to.code}" />
						</aon:column>

						<aon:column alias="ProjectReservation.startDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkIn}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="ProjectReservation.endDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_checkOut}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_guest}" />
							</f:facet>
							<aon:outputText value="#{to.guestFullName}" />
						</aon:column>

						<aon:column alias="ProjectReservation.agency.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_agency}" />
							</f:facet>
							<aon:outputText value="#{to.agency.registry.fullName}" />
						</aon:column>

						<aon:column alias="ProjectReservation.status"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
