<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="GuestContactDiv#{suffix}" styleClass="aon-width-all">
		<aon:panelGrid columns="2" columnClasses="aon-italic,">
			<aon:outputLabel for="ProjectReservationGuest_phone" value="#{bundle.aon_phone}"/>
			<aon:inputText id="ProjectReservationGuest_phone#{suffix}" styleClass="aon-form-input-text"
				value="#{controller.to.phone}" size="15" maxlength="32" />

			<aon:outputLabel for="ProjectReservationGuest_email" value="Email"/>
			<aon:inputText id="ProjectReservationGuest_email#{suffix}" styleClass="aon-form-input-text"
				value="#{controller.to.email}" size="15" maxlength="128"
				onblur="toLowCase(this);" />
		</aon:panelGrid>
 	</aon:div>
</ui:composition>
