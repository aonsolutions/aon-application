<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div id="GuestContactDiv#{suffix}" styleClass="aon-width-all">
		<aon:panelGrid columns="2" columnClasses="aon-italic,">
			<aon:div>
				<aon:outputLabel for="ProjectReservationGuest_phone" value="#{bundle.aon_phone}" style="display: none;" />
				<aon:outputText value="&#160;" styleClass="aon-icon-call aon-padding-left" />
			</aon:div>
			<aon:inputText id="ProjectReservationGuest_phone#{suffix}" styleClass="aon-form-input-text"
				value="#{controller.to.phone}" size="20" maxlength="32" ajaxSingle="true" />

			<aon:div>
				<aon:outputLabel for="ProjectReservationGuest_email" value="#{bundle.aon_email_abrv}" style="display: none;" />
				<aon:outputText value="&#160;" styleClass="aon-icon-mailInbox aon-padding-left" />
			</aon:div>
			<aon:inputText id="ProjectReservationGuest_email#{suffix}" styleClass="aon-form-input-text"
				value="#{controller.to.email}" size="20" maxlength="128" 
				onblur="toLowCase(this);" ajaxSingle="true" />
		</aon:panelGrid>
 	</aon:div>
</ui:composition>
