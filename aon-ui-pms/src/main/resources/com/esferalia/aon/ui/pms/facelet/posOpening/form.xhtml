<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posOpeningForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_posOpening_module}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{bundle.aon_save}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{posOpening.onAccept}"
						accesskey="#{bundle.aon_key_save}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="posOpeningPanel" columns="2" >
				
					<aon:outputLabel 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate  
						value="#{posOpening.posShift.startTime}"
						inputSize="10" renderAsPopup="true" enableManualInput="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
					
					<aon:outputLabel value="#{pmsBundle.pms_shift}" />
					<aon:selectOneMenu 
						value="#{posOpening.posShift.shift}" >
						<f:selectItem itemLabel=" 1 " itemValue="1" />
						<f:selectItem itemLabel=" 2 " itemValue="2" />
						<f:selectItem itemLabel=" 3 " itemValue="3" />
						<f:selectItem itemLabel=" 4 " itemValue="4" />
						<f:selectItem itemLabel=" 5 " itemValue="5" />
						<f:selectItem itemLabel=" 6 " itemValue="6" />
					</aon:selectOneMenu>
				
					<aon:outputLabel value="#{pmsBundle.pms_hotel}" />
					<aon:selectOneMenu 
						value="#{posOpening.hotel}" >
						<f:selectItems value="#{pmsCollections.currentUserHotels}" />
						<a4j:support event="onchange" reRender="posOpeningPanel" ignoreDupResponses="true">
						</a4j:support>
						<a4j:support event="oninputchanged" reRender="posOpeningPanel" ignoreDupResponses="true">
						</a4j:support>
					</aon:selectOneMenu>
				
					<aon:outputLabel value="#{pmsBundle.pms_pos}" />
					<aon:selectOneMenu 
						value="#{posOpening.posShift.pos}" >
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{posOpening.closedPos}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel value="#{pmsBundle.pms_initial_amount}" />
					<aon:inputText value="#{posOpening.posShift.initialAmount}" >
						<f:validateDoubleRange minimum="0.0" />
					</aon:inputText>
					
				</aon:panelGrid>
				
			</aon:div>
		</aon:form>
		
	</ui:define>
</ui:composition>
