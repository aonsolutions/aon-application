<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="paymentCardSettleList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_paymentCardSettle_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="paymentCardSettle_search" 
						actionListener="#{paymentCardSettle.onInit}"
						accesskey="#{bundle.aon_key_search}" />
				</ui:define>
				
			</ui:decorate>
 
			<aon:div styleClass="aon-scroll-area">
			
				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.report_agency}:" styleClass="aon-italic"/>
					<a4j:repeat value="#{paymentCardSettle.agencies}" var="agency" rowKeyVar="agencyIdx">
						<aon:outputText styleClass="aon-margin-left aon-bold"
							value="#{agency.registry.fullName}"/>
						<aon:outputText value=","
							rendered="#{paymentCardSettle.agenciesSize-1 > agencyIdx}" />
					</a4j:repeat>

					<aon:outputText styleClass="aon-margin-left aon-italic"
						value="#{bundle.aon_module_hotel}:"
						rendered="#{paymentCardSettle.hotel != null}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{paymentCardSettle.hotel.workPlace.description}"
						rendered="#{paymentCardSettle.hotel != null}" />

					<aon:outputText styleClass="aon-margin-left aon-italic"
						value="#{bundle.finance_payMethod}:"
						rendered="#{paymentCardSettle.payMethodsSize > 0 and not empty paymentCardSettle.payMethods[0].name}" />
					<a4j:repeat value="#{paymentCardSettle.payMethods}" var="payMth" rowKeyVar="payMthIdx">
						<aon:outputText styleClass="aon-margin-left aon-bold"
							value="#{payMth.name}"
							rendered="#{paymentCardSettle.payMethodsSize > 0}" />
						<aon:outputText value=","
							rendered="#{paymentCardSettle.payMethodsSize-1 > payMthIdx}" />
					</a4j:repeat>

					<aon:outputText styleClass="aon-margin-left aon-italic" 
						value="#{bundle.aon_reservation}:"
						rendered="#{not empty paymentCardSettle.reservationId}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{paymentCardSettle.reservationId}"
						rendered="#{not empty paymentCardSettle.reservationId}" />

					<aon:outputText styleClass="aon-margin-left aon-italic"
						value="#{bundle.report_reservation_code}:"
						rendered="#{paymentCardSettle.reservationCodesSize > 0}" />
					<a4j:repeat value="#{paymentCardSettle.reservationCodes}" var="reservationCode" rowKeyVar="reservationCodeIdx">
						<aon:outputText styleClass="aon-margin-left aon-bold"
							value="#{reservationCode}"
							rendered="#{paymentCardSettle.reservationCodesSize > 0}" />
						<aon:outputText value=","
							rendered="#{paymentCardSettle.reservationCodesSize-1 > reservationCodeIdx}" />
					</a4j:repeat>

					<aon:outputText styleClass="aon-margin-left aon-italic" 
						value="#{bundle.report_guest}:"
						rendered="#{not empty paymentCardSettle.guestName or not empty paymentCardSettle.guestSurname}" />
					<aon:div style="display:inline;">
						<aon:outputText styleClass="aon-margin-left aon-bold"
							value="#{paymentCardSettle.guestName}"
							rendered="#{not empty paymentCardSettle.guestName}" />
						<aon:outputText styleClass="aon-margin-left aon-bold"
							value="#{paymentCardSettle.guestSurname}"
							rendered="#{not empty paymentCardSettle.guestSurname}" />
					</aon:div>
				</aon:panel>

				<aon:panelTabSet selectedTab="#{paymentCardSettle.selectedTab}">
					<aon:panelTab id="#{paymentCardSettle.paymentCardFinancesTabName}" label="#{bundle.pms_finances_in_card}">
						<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/listCardFinance.xhtml" />
					</aon:panelTab>

					<aon:panelTab id="#{paymentCardSettle.pendingFinancesTabName}" label="#{bundle.pms_pending_finances}">
						<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/listFinance.xhtml" />
					</aon:panelTab>
				</aon:panelTabSet>
			</aon:div>

		</aon:form>

		<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/modalSearch.xhtml">
			<ui:param name="controller" value="#{paymentCardSettle}" />
			<ui:param name="searchReRender" value="paymentCardSettleList" />
		</ui:include>

		<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/modalFraction.xhtml" >
			<ui:param name="controller" value="#{paymentCardSettle}" />
			<ui:param name="fractionReRender" value="paymentCardSettleList" />
		</ui:include>

		<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/modalBatch.xhtml">
			<ui:param name="controller" value="#{paymentCardSettle}" />
		</ui:include>

		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />

	</ui:define>
</ui:composition>
