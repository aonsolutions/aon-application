<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="paymentCardSettleList">

			<!--  
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_paymentCardSettle_module}" />
				<ui:param name="controller" value="#{paymentCardSettle}" />
				<ui:param name="skipResetButton" value="true" />
				
				<ui:define name="additionalToolbarContent">
				
				</ui:define>
				
			</ui:decorate>
			-->
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_paymentCardSettle_module}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="paymentCardSettle-search"
						title="#{bundle.aon_key_search_accelerator}"
						value="#{bundle.aon_search}" 
						action="paymentCardSettle_search" actionListener="#{paymentCardSettle.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}" />
				</ui:define>
				
			</ui:decorate>
 
			<aon:div styleClass="aon-scroll-area">
			
				<aon:panel>
					<aon:outputText value="#{pmsBundle.pms_agency}:" styleClass="aon-bold"/>
					<aon:outputText styleClass="aon-margin-left"
						value="#{(paymentCardSettle.agency!=null and paymentCardSettle.agency.id!=null)?(paymentCardSettle.agency.registry.fullName):('-')}"/>
					
					<aon:outputText styleClass="aon-margin-left aon-bold"
						rendered="#{paymentCardSettle.payMethod.id!=null}"
						value="#{configBundle.config_pay_method}:" />
					<aon:outputText styleClass="aon-margin-left "
						rendered="#{paymentCardSettle.payMethod.id!=null}"
						value="#{paymentCardSettle.payMethod.name}"/>

					<aon:outputText styleClass="aon-margin-left aon-bold"
						rendered="#{paymentCardSettle.hotel!=null}"
						value="#{pmsBundle.pms_hotel}:" />
					<aon:outputText styleClass="aon-margin-left "
						rendered="#{paymentCardSettle.hotel!=null}"
						value="#{paymentCardSettle.hotel.workPlace.description}"/>

					<aon:outputText styleClass="aon-margin-left aon-bold" 
						rendered="#{not empty paymentCardSettle.reservationId}"
						value="#{pmsBundle.pms_reservation}:" />
					<aon:outputText styleClass="aon-margin-left "
						rendered="#{not empty paymentCardSettle.reservationId}"
						value="#{paymentCardSettle.reservationId}"/>

					<aon:outputText styleClass="aon-margin-left aon-bold" 
						rendered="#{not empty paymentCardSettle.reservationCode}"
						value="#{pmsBundle.pms_reservation_code}:" />
					<aon:outputText styleClass="aon-margin-left "
						rendered="#{not empty paymentCardSettle.reservationCode}"
						value="#{paymentCardSettle.reservationCode}"/>

					<aon:outputText styleClass="aon-margin-left aon-bold" 
						rendered="#{not empty paymentCardSettle.guestName or not empty paymentCardSettle.guestSurname}"
						value="#{pmsBundle.pms_guest}:" />
					<aon:div style="display:inline;">
						<aon:outputText styleClass="aon-margin-left "
							rendered="#{not empty paymentCardSettle.guestName}"
							value="#{paymentCardSettle.guestName}"/>
						<aon:outputText styleClass="aon-margin-left "
							rendered="#{not empty paymentCardSettle.guestSurname}"
							value="#{paymentCardSettle.guestSurname}"/>
					</aon:div>
				
				</aon:panel>
			
				<aon:panelTabSet selectedTab="#{paymentCardSettle.selectedTab}">
	
					<aon:panelTab id="tab1" label="Vencimientos incluidos en la carta" reRender="paymentCardSettleList">
						<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/listSelected.xhtml" />
					</aon:panelTab>
					
					<c:if test="#{!paymentCardSettle.fractioned}">
						<aon:panelTab id="tab2" label="Vencimientos pendientes" reRender="paymentCardSettleList">
							<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/listPayment.xhtml" />
						</aon:panelTab>
					</c:if>
	
				</aon:panelTabSet>
			</aon:div>
			
			
		</aon:form>
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/modalSearch.xhtml">
			<ui:param name="masterController" value="#{paymentCardSettle}" />
			<ui:param name="controller" value="#{financeList}" />
			<ui:param name="showType" value="false" />
			<ui:param name="payMethodSearchList" value="#{configCollections.payMethods}" />
			<ui:param name="searchReRender" value="paymentCardSettleList" />
		</ui:include>
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/modalFraction.xhtml" >
			<ui:param name="fractionReRender" value="paymentCardSettleList" />
		</ui:include>
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/modalBatch.xhtml">
			<ui:param name="controller" value="#{paymentCardSettle}" />
		</ui:include>
		
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
	</ui:define>
</ui:composition>
