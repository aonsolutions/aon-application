<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="reservationIOSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_reservationIO_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_search}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>	
					
					<aon:panelGrid columns="2"  style="width:100%;"
						columnClasses="aon-panelGrid-odd aon-width-50, 
						aon-panelGrid-even aon-width-auto">

						<aon:outputLabel for="ReservationIO_hotel_id"
							value="#{bundle.aon_module_hotel}" />
						<aon:selectOneMenu id="ReservationIO_hotel_id"
							value="#{reservationIO.hotel}" >
							<f:selectItems value="#{pmsCollections.currentUserHotels}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="ReservationIO_checkin" 
							value="#{bundle.aon_type}"/>
						<aon:selectOneRadio id="ReservationIO_checkin" 
							value="#{reservationIO.checkin}">
							<f:selectItem itemLabel="#{bundle.report_checkin}" itemValue="#{true}" />
							<f:selectItem itemLabel="#{bundle.report_checkout}" itemValue="#{false}" />
							<a4j:support event="onclick" reRender="ReservationIO_checkStatuses" ignoreDupResponses="true" />
						</aon:selectOneRadio>	

						<aon:outputLabel for="ReservationIO_checkStatuses" 
							value="#{bundle.pms_check}"/>
						<aon:selectManyCheckbox id="ReservationIO_checkStatuses"
							value="#{reservationIO.checkStatuses}" >
							<c:if test="#{reservationIO.checkin}">
								<f:selectItems value="#{pmsCollections.abbreviatedReservationInCheckStatuses}"/>
							</c:if>
							<c:if test="#{!reservationIO.checkin}">
								<f:selectItems value="#{pmsCollections.abbreviatedReservationInOutCheckStatuses}"/>
							</c:if>
						</aon:selectManyCheckbox>

						<aon:outputLabel value="#{bundle.aon_date}" />
						<aon:div>
							<aon:outputLabel for="ReservationIO_fromDate" 
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate id="ReservationIO_fromDate"	
								value="#{reservationIO.fromDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
							<aon:outputLabel for="ReservationIO_toDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate id="ReservationIO_toDate"
								value="#{reservationIO.toDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
						</aon:div>

						<aon:outputLabel for="ReservationIO_sortMode" 
							value="#{bundle.pms_order_by}"/>
						<aon:selectOneRadio id="ReservationIO_sortMode" 
							value="#{reservationIO.sortMode}" layout="pageDirection">
							<f:selectItem itemLabel="#{bundle.aon_reservation}" itemValue="0" />
							<f:selectItem itemLabel="#{bundle.report_guest}" itemValue="1" />
							<f:selectItem itemLabel="#{bundle.report_agency} + #{bundle.report_guest}" itemValue="2" />
							<f:selectItem itemLabel="#{bundle.report_agency}" itemValue="3" />
							<f:selectItem itemLabel="#{bundle.pms_room}" itemValue="4" />
						</aon:selectOneRadio>	

						<aon:outputText value="&#160;" />
						<aon:commandButton id="search" ignoreDupResponses="true"
							value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
							action="reservationIO_list"
							actionListener="#{reservationIO.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />

					</aon:panelGrid>
				</aon:div>
			</aon:div>				
		</aon:form>

		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
	</ui:define>
</ui:composition>
