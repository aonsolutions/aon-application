<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="reservationIOSearch">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_reservationIO_module}" />
				<ui:param name="controller" value="#{reservationIO}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>
				
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{reservationIO}" />

				<ui:define name="searchContent">
				
					<aon:methodParam name="searchAction" value="reservationIO_list" />
					
					<aon:outputLabel for="ProjectReservation_hotel_id"
						value="#{pmsBundle.pms_hotel}" />
					<aon:selectOneMenu id="ProjectReservation_hotel_id" ajaxSingle="true"
						required="true"
						value="#{reservationIOSearch.hotel}" >
						<f:selectItems value="#{pmsCollections.currentUserHotels}" />
					</aon:selectOneMenu>
				
					<aon:outputText value="#{bundle.aon_type}"/>
					<aon:selectOneMenu value="#{reservationIOSearch.checkin}" ajaxSingle="true">
						<f:selectItem itemLabel="#{pmsBundle.pms_checkIn}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{pmsBundle.pms_checkOut}" itemValue="#{false}" />
						<a4j:support event="onchange" reRender="reservationIOSearch" ignoreDupResponses="true"  ajaxSingle="true"/>
						<a4j:support event="oninputchanged" reRender="reservationIOSearch" ignoreDupResponses="true"  ajaxSingle="true"/>
					</aon:selectOneMenu>	
					
					<aon:outputLabel for="ProjectReservation_startDate"
						rendered="#{reservationIOSearch.checkin}" 
						value="#{pmsBundle.pms_checkIn}" />
					<aon:div id="ProjectReservation_startDate" 
						rendered="#{reservationIOSearch.checkin}">
						<aon:outputLabel for="ProjectReservation_startDate-From"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="ProjectReservation_startDate-From"	
							required="true"
							value="#{reservationIOSearch.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="ProjectReservation_startDate-To"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="ProjectReservation_startDate-To"
							required="true"
							value="#{reservationIOSearch.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
				
					<aon:outputLabel for="ProjectReservation_endDate" 
						rendered="#{!reservationIOSearch.checkin}" 
						value="#{pmsBundle.pms_checkOut}" />
					<aon:div id="ProjectReservation_endDate" 
						rendered="#{!reservationIOSearch.checkin}">
						<aon:outputLabel for="ProjectReservation_endDate-From"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="ProjectReservation_endDate-From"
							required="true"
							value="#{reservationIOSearch.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="ProjectReservation_endDate-To"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="ProjectReservation_endDate-To"
							required="true"
							value="#{reservationIOSearch.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>
				
						
				</ui:define>
			</ui:decorate>				
		</aon:form>
		
	</ui:define>
</ui:composition>
