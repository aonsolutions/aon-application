<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showRoomOccupationWindow">
		<c:if test="#{controller.showRoomOccupationWindow}">
			<rich:modalPanel id="roomOccupationModalPanel" 
				height="600" width="650"  
				rendered="#{controller.showRoomOccupationWindow}"
				showWhenRendered="true" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{pmsBundle.pms_roomOccupation}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showRoomOccupationWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showRoomOccupationWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="roomOccupationFrom">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="modal-back"
										title="#{bundle.aon_key_cancel_accelerator}"
										value="#{bundle.aon_back}" immediate="true"
										reRender="showRoomOccupationWindow"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}" >
										<rich:componentControl for="roomOccupationModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showRoomOccupationWindow}"
											value="#{false}" />
									</aon:commandButton>	
								</aon:div>
								
								<aon:div >
									
									<h:panelGrid columns="2"
										columnClasses="aon-vertical-align-top aon-padding-top aon-width-all, aon-vertical-align-top aon-width-350">
										<aon:div id="availableRoomTable" >
										
											<c:if test="#{reservationTable.assetModel==null or reservationTable.assetModel.rowCount le 0 }" >
												<aon:div styleClass="aon-note" > 
													<aon:div styleClass="aon-note-internal" > 
														<aon:outputText  
															value="#{bundle.aon_search_no_results}" />
													</aon:div>
												</aon:div>
											</c:if>
										
											<c:if test="#{reservationTable.assetModel!=null and reservationTable.assetModel.rowCount gt 0 }" >
												<aon:dataTable id="room-select" var="to" value="#{reservationTable.assetModel}" 
													rows="10" rendered="#{reservationTable.assetModel!=null and reservationTable.assetModel.rowCount>0}" >
											
													<aon:rowSelector id="room-select" actionListener="#{reservationTable.onSelectRoomModal}" >
														<f:setPropertyActionListener target="#{controller.showRoomOccupationWindow}" value="#{false}" />
													</aon:rowSelector>
											
													<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
														<f:facet name="header" >
															<aon:outputText value="#{pmsBundle.pms_rooms}" />
														</f:facet>
														<aon:outputText value="#{to.asset.name}" />
													</aon:column>
													
												</aon:dataTable>
											</c:if>
									
										</aon:div>
										<aon:div id="filter" >
											<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservationTable/grid_filter.xhtml" >
												<ui:param name="controller" value="#{reservationTable}" />
											</ui:include>
										</aon:div>
									</h:panelGrid>
										
								</aon:div>
									
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
