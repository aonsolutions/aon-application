<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="NAVdataTransmissionList">

			<aon:methodParam name="searchAction" value="NAVdataTransmission_search" />
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_nav_data_transmission}" />
				<ui:param name="controller" value="#{NAVdataTransmission}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{NAVdataTransmission}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-iconColumn aon-width-30">
							<f:facet name="header">
								<aon:outputText value="A" />
							</f:facet>
							<aon:outputText id="#{dataTableId}-selectButton" 
								styleClass="#{(to.typeRequest) ? 
												('aon-icon-predetermine') :
												((to.typeResponseError) ?
													('aon-icon-point-red') :
													('aon-icon-point-green'))}" 
								value="&#160;&#160;&#160;&#160;"
								title="#{to.type}" />
							<f:facet name="footer">
								<ui:insert name="selectFooterContent"/>
							</f:facet>
						</aon:column>

						<aon:column alias="DataAttachment.source"
							styleClass="aon-editDataTable-textColumn aon-width-200">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.source}" />
						</aon:column>

						<aon:column alias="DataAttachment.creationDate"
							styleClass="aon-editDataTable-textColumn aon-width-250">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.creationDate}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="DataAttachment.description"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-nowrap aon-width-120">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_fileupload_element}" />
							</f:facet>
							<aon:div id="DataAttachment_data">													
								<aon:htmlCommandLink id="download" target="_blank"
									actionListener="#{controller.downloadAttachment}"
									styleClass="aon-icon aon-icon-mail-save"
									style="line-height:16px;margin-right:0;"
									title="#{bundle.aon_fileupload_download}">
									<f:param name="index" value="#{to.id}" />
									<aon:outputText value="&#160;" />
								</aon:htmlCommandLink>
							</aon:div>
						</aon:column>					

					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
