<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="workPlanningSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_workPlanning_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_search}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>	

					<aon:panelGrid columns="2" style="width:100%;"
						columnClasses="aon-panelGrid-odd aon-width-50, 
						aon-panelGrid-even aon-width-auto">

						<aon:outputLabel for="WorkPlanning_hotel_id"
							value="#{bundle.aon_module_hotel}" />
						<aon:selectOneMenu id="WorkPlanning_hotel_id"
							value="#{workPlanning.hotel}" required="true"
							valueChangeListener="#{workPlanning.onHotelChanged}"
							reRender="WorkPlanning_rooms">
							<f:selectItem itemLabel="-" value="#{null}" />		
							<f:selectItems value="#{pmsCollections.currentUserHotels}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="WorkPlanning_date"
							value="#{bundle.aon_date}" />
						<aon:selectInputDate id="WorkPlanning_date"
							value="#{workPlanning.date}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="WorkPlanning_rooms"
							value="#{bundle.report_rooms}" />
						<aon:panelGrid columns="3"
							columnClasses="aon-panelGrid-even aon-width-100,aon-panelGrid-odd aon-width-50,
								aon-panelGrid-even aon-width-200 aon-vertical-align-top">

							<aon:selectManyListbox id="WorkPlanning_rooms"
								style="width:80px;"
								value="#{workPlanning.rooms}" size="10">
								<f:selectItems value="#{workPlanning.hotelRooms}" />
							</aon:selectManyListbox>
							<aon:outputLabel for="WorkPlanning_roomFilter" 
								value="#{bundle.aon_filter}" />
							<aon:inputText id="WorkPlanning_roomFilter"
								value="#{workPlanning.roomFilter}" size="5"
								valueChangeListener="#{workPlanning.onRoomFilterChanged}"
								reRender="WorkPlanning_rooms" />

						</aon:panelGrid>

						<aon:outputText value="&#160;" />
						<aon:commandButton id="search" ignoreDupResponses="true"
							value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
							action="workPlanning_list"
							actionListener="#{workPlanning.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />

					</aon:panelGrid>
				</aon:div>
			</aon:div>

		</aon:form>

		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
	</ui:define>
</ui:composition>
