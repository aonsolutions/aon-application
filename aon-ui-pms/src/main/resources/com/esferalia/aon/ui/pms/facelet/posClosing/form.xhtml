<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posClosingForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_posClosing_module}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{bundle.aon_save}"
						rendered="#{posClosing.posShift==null}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{posClosing.onAccept}"
						accesskey="#{bundle.aon_key_save}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="posClosingPanel" columns="2" >
				
				<c:if test="#{posClosing.posShift==null}">
					<aon:outputLabel value="#{pmsBundle.pms_hotel}" />
					<aon:selectOneMenu 
						value="#{posClosing.hotel}" >
						<f:selectItems value="#{pmsCollections.currentUserHotels}" />
						<a4j:support event="onchange" reRender="posClosingPanel" ignoreDupResponses="true">
						</a4j:support>
						<a4j:support event="oninputchanged" reRender="posClosingPanel" ignoreDupResponses="true">
						</a4j:support>
					</aon:selectOneMenu>
				
					<aon:outputLabel for="PosClosing_posShift" value="#{pmsBundle.pms_pos}" />
					<aon:selectOneMenu id="PosClosing_posShift" required="true"
						value="#{posClosing.posShift}" >
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{posClosing.openedPos}" />
					</aon:selectOneMenu>
				</c:if>
				
				<c:if test="#{posClosing.posShift!=null}">
					<aon:outputText value="#{pmsBundle.pms_hotel}" />
					<aon:outputText value="#{posClosing.hotel.workPlace.description}" />
				
					<aon:outputText value="#{pmsBundle.pms_pos}" />
					<aon:outputText value="#{posClosing.posShift.pos.name}" />
					
					<aon:outputText value="#{pmsBundle.pms_shift}" />
					<aon:outputText value="#{posClosing.posShift.shift}" />
					
					<aon:outputText value="#{pmsBundle.pms_opening}" />
					<aon:outputText value="#{posClosing.posShift.startTime}">
						<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					
					<aon:outputText value="#{pmsBundle.pms_closing}" />
					<aon:outputText value="#{posClosing.posShift.endTime}">
						<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					
					<aon:outputText value="#{pmsBundle.pms_initial_amount}" />
					<aon:outputText value="#{posClosing.posShift.initialAmount}" >
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>
					
					<aon:outputText value="#{pmsBundle.pms_cash_payMethod_name}" />
					<aon:outputText value="#{posClosing.cashAmount}" >
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>
				</c:if>
					
				</aon:panelGrid>
				
				<br />
				
				<aon:panelGrid columns="2" rendered="#{posClosing.posShift==null}">
					<aon:outputLabel for="PosShiftCount_amount" value="#{pmsBundle.pms_cash_payMethod_name}" />
					<aon:div>
						<aon:inputText id="PosShiftCount_amount" required="true"
							value="#{posClosing.calculator.cashAmount}" >
							<f:validateDoubleRange minimum="0.0" />
						</aon:inputText>
						<aon:commandButton 
							reRender="showCalculatorWindow" ajaxSingle="true"
							styleClass="aon-editDataTable-button aon-icon-calc aon-margin-left"
							actionListener="#{posClosing.onShowCalculatorWindow}" >
							<f:setPropertyActionListener target="#{posClosing.calculator.showCalculatorWindow}"
								value="#{true}" />								
						</aon:commandButton>
					</aon:div>
				</aon:panelGrid>
			</aon:div>
				
				<!--  
			<aon:div styleClass="aon-scroll-area">
				<aon:div rendered="#{posClosing.posShift!=null and posClosing.posShift.id!=null}">
				
					<aon:panelTabSet id="countTab">
						<aon:panelTab label="#{pmsBundle.pms_cash_count}">
							<ui:include src="/com/esferalia/aon/ui/pms/facelet/posClosing/count_grid.xhtml">
								<ui:param name="controller" value="#{posShiftCount}" />
								<ui:param name="modalController" value="#{posClosing}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</aon:div>
			
			</aon:div>
				-->
			
			
		</aon:form>
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/posClosing/calculatorModal.xhtml" >
			<ui:param name="controller" value="#{posClosing}" />								
			<ui:param name="modalReRender" value="posClosingForm" />
		</ui:include>
		
	</ui:define>
</ui:composition>
