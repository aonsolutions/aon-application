<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posClosingForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_posClosing_module}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{bundle.aon_save}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{posClosing.onAccept}"
						accesskey="#{bundle.aon_key_save}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="posClosingPanel" columns="2" >
				
					<aon:outputLabel value="#{pmsBundle.pms_hotel}" />
					<aon:selectOneMenu 
						value="#{posClosing.hotel}" >
						<f:selectItems value="#{pmsCollections.currentUserHotels}" />
						<a4j:support event="onchange" reRender="posClosingPanel" ignoreDupResponses="true">
						</a4j:support>
						<a4j:support event="oninputchanged" reRender="posClosingPanel" ignoreDupResponses="true">
						</a4j:support>
					</aon:selectOneMenu>
				
					<aon:outputLabel value="#{pmsBundle.pms_pos}" />
					<aon:selectOneMenu 
						value="#{posClosing.posShift}" >
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{posClosing.openedPos}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</aon:div>
				
			<aon:div styleClass="aon-scroll-area">
				<aon:div rendered="#{posClosing.posShift!=null and posClosing.posShift.id!=null}">
				<!--  
				<aon:panel label="Arqueo -i18n-" rendered="#{posClosing.posShift.id!=null}">
				</aon:panel>
					<ui:decorate template="/com/esferalia/aon/ui/pms/facelet/posClosing/count_grid.xhtml">
						<ui:param name="controller" value="#{posShiftCount}" />
					</ui:decorate>
				-->
				
					<aon:panelTabSet id="countTab">
						<aon:panelTab label="Arqueo -i18n-">
							<ui:include src="/com/esferalia/aon/ui/pms/facelet/posClosing/count_grid.xhtml">
								<ui:param name="controller" value="#{posShiftCount}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</aon:div>
			
			</aon:div>
			
			
		</aon:form>
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/posClosing/calculatorModal.xhtml" >
			<ui:param name="controller" value="#{posClosing}" />								
		</ui:include>
		
	</ui:define>
</ui:composition>
