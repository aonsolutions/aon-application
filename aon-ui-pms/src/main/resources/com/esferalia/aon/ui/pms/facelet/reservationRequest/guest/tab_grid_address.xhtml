<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div style="width: 100%;">
		<aon:panelGrid columns="2" columnClasses="aon-italic,">
			<aon:outputLabel for="ReservationRequestGuest_address" value="#{bundle.aon_address}"/>
			<aon:inputText id="ReservationRequestGuest_address#{suffix}" styleClass="aon-margin-left aon-form-input-text"
				value="#{controller.to.address}" size="25" maxlength="256" />

			<aon:outputLabel for="ReservationRequestGuest_city" value="#{bundle.aon_city}"/>
			<aon:inputText id="ReservationRequestGuest_city#{suffix}" styleClass="aon-margin-left aon-form-input-text"
				value="#{controller.to.city}" size="25" maxlength="64" />

			<aon:outputLabel for="ReservationRequestGuest_province" value="#{bundle.aon_state}"/>
			<aon:inputText id="ReservationRequestGuest_province#{suffix}" styleClass="aon-margin-left aon-form-input-text"
				value="#{controller.to.province}" size="25" maxlength="64" />

			<aon:outputLabel for="ReservationRequestGuest_zip" value="#{bundle.aon_postal_code}"/>
			<aon:div>
				<aon:inputText id="ReservationRequestGuest_zip#{suffix}" styleClass="aon-margin-left aon-form-input-text"
					value="#{controller.to.zip}" size="9" maxlength="16" />
				<aon:outputLabel for="ReservationRequestGuest_country" value="#{bundle.aon_country}" styleClass="aon-italic aon-margin-left"/>
				<aon:inputText id="ReservationRequestGuest_country#{suffix}" styleClass="aon-margin-left aon-form-input-text"
					value="#{controller.to.country}" size="3" maxlength="2" />
			</aon:div>
		</aon:panelGrid>
 	</aon:div>
</ui:composition>
