<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="agencyBookingList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_agency_booking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="agencyBooking_search"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="agencyBooking-excel-report"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
						value="#{bundle.aon_listing}" action="#{agencyBooking.onExcelReport}" target="_blank">
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panel styleClass="aon-panelGrid-search aon-margin-bottom">
					<aon:outputText value="#{bundle.aon_module_hotel}:" styleClass="aon-italic"
						rendered="#{!empty agencyBooking.hotels}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{agencyBooking.hotelNames}"
						rendered="#{!empty agencyBooking.hotels}" />

					<aon:outputText value="#{bundle.report_agency}:" styleClass="aon-margin-left aon-italic"
						rendered="#{!empty agencyBooking.agencies}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{agencyBooking.agencyNames}"
						rendered="#{!empty agencyBooking.agencies}" />

					<aon:outputText value="#{bundle.aon_group}:" styleClass="aon-margin-left aon-italic"
						rendered="#{!empty agencyBooking.agencyGroups}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{agencyBooking.agencyGroupNames}" 
						rendered="#{!empty agencyBooking.agencyGroups}" />

					<aon:outputText value="#{bundle.aon_creation}:" styleClass="aon-margin-left aon-italic"
						rendered="#{agencyBooking.reservationFromDate != null or agencyBooking.reservationToDate != null}" />
					<aon:outputText value="#{bundle.aon_date_from}" styleClass="aon-margin-left aon-italic"
						rendered="#{agencyBooking.reservationFromDate != null}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{agencyBooking.reservationFromDate}"
						rendered="#{agencyBooking.reservationFromDate != null}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:outputText value="#{bundle.aon_date_to}" styleClass="aon-margin-left aon-italic"
						rendered="#{agencyBooking.reservationToDate != null}" />
					<aon:outputText styleClass="aon-margin-left aon-bold"
						value="#{agencyBooking.reservationToDate}"
						rendered="#{agencyBooking.reservationToDate != null}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:panel>

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{agencyBooking}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">

						<f:facet name="header">
							<rich:columnGroup>
								<rich:column colspan="2">
									<aon:outputText value="&#160;" />
								</rich:column>

								<rich:column colspan="4">
									<aon:outputText value="#{bundle.aon_real}" />
								</rich:column>

								<c:forEach items="#{agencyBooking.agencyList}" var="agency">
									<rich:column colspan="2">
										<aon:outputText style="color:blue; font-size:0.8em;"
											value="#{agency}">
											<aon:abbreviateConverter maxWidth="25" />
										</aon:outputText>
									</rich:column>
								</c:forEach>
							</rich:columnGroup>
						</f:facet>

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-200 aon-nowrap">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotel}" />
						</aon:column>	

						<aon:column styleClass="aon-editDataTable-dateColumn aon-width-70">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>	

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_occupation_abbrv}" />
							</f:facet>
							<aon:outputText value="#{to.roomBusy}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_free}" />
							</f:facet>
							<aon:outputText value="#{to.roomFree}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.pms_blocked_abbrv}" />
							</f:facet>
							<aon:outputText value="#{to.roomBlocked}" />
						</aon:column>				

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20" style="background-color:#f2f2f2;">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{to.roomTotal}" />
						</aon:column>				

						<c:forEach items="#{agencyBooking.agencyList}" var="agency" varStatus="agencyIdx" begin="0" step="1">
							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{agencyIdx.odd ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="#{bundle.report_occupation_abbrv}" />
								</f:facet>
								<aon:outputText value="#{to.agencyBookingMap[agency].roomBusy}" />
							</aon:column>				

							<aon:column styleClass="aon-editDataTable-numberColumn aon-width-20"
								style="#{agencyIdx.odd ? 'background-color:#f2f2f2;' : ''}">
								<f:facet name="header">
									<aon:outputText value="#{bundle.pms_cancelled_abbrv}" />
								</f:facet>
								<aon:outputText style="#{(to.agencyBookingMap[agency].roomCancelled >= 0) ? ('color:red;') : ('')}"
									value="#{to.agencyBookingMap[agency].roomCancelled}" />
							</aon:column>				
						</c:forEach>

					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
