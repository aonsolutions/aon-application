<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:if test="#{service}">
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservation/lookup.xhtml">
			<ui:param name="lookupTo" value="#{controller.projectReservation}" />
			<ui:param name="skipNewButton" value="#{true}" />
			<ui:param name="lookupReRender" value="ProjectReservation_invoiceRoom,ProjectReservation_invoiceGuest,invoiceServicesDiv,invoiceFinancesDiv,invoiceHotelDiv,invoiceRoomDiv" />
			<ui:param name="lookupControllerListener" value="#{controller.currentReservationFilter}" />
			<aon:methodParam name="lookupChangeListener" value="#{controller.onReservationChanged}" type="lookupChangeListener" />
		</ui:include>

		<aon:outputLabel for="ProjectReservation_invoiceHotel"
			value="#{bundle.aon_module_hotel}" />
		<aon:div id="invoiceHotelDiv">
			<aon:selectOneMenu id="ProjectReservation_invoiceHotel"
				value="#{controller.reservationInvoiceTo.hotel}" required="true"
				rendered="#{controller.reservationInvoiceTo.room == null and controller.invoiceServicesCount == 1 and pmsCollections.currentUserServiceHotelsCount > 1 and controller.projectReservation.id == null}"
				valueChangeListener="#{controller.onInvoiceHotelChanged}" 
				reRender="ProjectReservation_invoiceRoom,ProjectReservation_invoiceGuest,invoiceServicesDiv,invoiceFinancesDiv">
				<f:selectItems value="#{pmsCollections.currentUserServiceHotels}" />
			</aon:selectOneMenu>
			<aon:outputText value="#{controller.reservationInvoiceTo.hotel.workPlace.description}" styleClass="aon-bold"
				rendered="#{controller.reservationInvoiceTo.room != null or controller.invoiceServicesCount > 1 or pmsCollections.currentUserServiceHotelsCount == 1 or controller.projectReservation.id != null}" />
		</aon:div>

		<aon:outputLabel for="ProjectReservation_invoiceRoom"
			value="#{bundle.pms_room}" />
		<aon:div id="invoiceRoomDiv">
			<aon:selectOneMenu id="ProjectReservation_invoiceRoom"
				value="#{controller.reservationInvoiceTo.room}"
				rendered="#{controller.reservationInvoiceTo.room == null and controller.invoiceServicesCount == 1}"
				valueChangeListener="#{controller.onInvoiceRoomChanged}"
				reRender="invoiceHotelDiv,invoiceRoomDiv,ProjectReservation_invoiceGuest,invoiceServicesDiv,invoiceFinancesDiv">
				<f:selectItem itemLabel=" - " itemValue="#{null}" />
				<f:selectItems value="#{controller.roomList}" />
			</aon:selectOneMenu>
			<aon:outputText value="#{controller.reservationInvoiceTo.room.room.asset.name}" styleClass="aon-bold"
				rendered="#{controller.reservationInvoiceTo.room != null or controller.invoiceServicesCount > 1}" />
		</aon:div>
	</aon:if>

	<aon:outputLabel for="ProjectReservation_invoiceGuest"
		value="#{bundle.report_guest}"
		rendered="#{controller.reservationInvoiceTo.directCustomer}" />
	<aon:selectOneMenu id="ProjectReservation_invoiceGuest"
		value="#{controller.reservationInvoiceTo.guest}" 
		rendered="#{controller.reservationInvoiceTo.directCustomer}"
		valueChangeListener="#{controller.onInvoiceGuestChanged}"
		reRender="invoiceNameDiv,invoiceDocumentDiv,invoiceAddressDiv,invoiceCityDiv,invoiceProvinceDiv">
		<f:selectItem itemLabel=" - " itemValue="#{null}" />
		<f:selectItems value="#{controller.guests}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_invoiceCustomerName"
		value="#{bundle.aon_company_name}" />
	<aon:div id="invoiceNameDiv">
		<aon:inputText id="ProjectReservation_invoiceCustomerName"
			value="#{controller.reservationInvoiceTo.registry.name}"
			required="true" size="55" maxlength="128"
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:outputText value="#{controller.reservationInvoiceTo.registry.name}" styleClass="aon-bold"
			rendered="#{!controller.reservationInvoiceTo.directCustomer}" />
	</aon:div>

	<aon:outputLabel for="ProjectReservation_invoiceCustomerDocument"
		value="#{bundle.aon_company_document}" />
	<aon:div id="invoiceDocumentDiv">
		<aon:selectOneMenu id="ProjectReservation_invoiceCustomerDocumentType"
			value="#{controller.reservationInvoiceTo.registry.documentType}" 
			rendered="#{controller.reservationInvoiceTo.directCustomer}"
			reRender="InvoiceCustomer_document_icon">
			<f:selectItems value="#{registryCollections.documentTypes}" />
		</aon:selectOneMenu>
		<aon:outputText styleClass="aon-margin-left aon-italic"
			value="#{bundle.aon_country}"
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:selectOneMenu id="ProjectReservation_customerDocumentCountry" styleClass="aon-margin-left" 
			value="#{controller.reservationInvoiceTo.registry.documentCountry}"
			rendered="#{controller.reservationInvoiceTo.directCustomer}"
			reRender="InvoiceCustomer_document_icon">
			<f:selectItems value="#{commonCollections.countryCodes}" />
		</aon:selectOneMenu>
		<aon:inputText id="ProjectReservation_invoiceCustomerDocument"	style="margin-left: 2px;"
			value="#{controller.reservationInvoiceTo.registry.document}"
			required="#{!service}" size="17" maxlength="16"
			rendered="#{controller.reservationInvoiceTo.directCustomer}"
			reRender="InvoiceCustomer_document_icon"
			onblur="toUpperCase(this);" />
		<aon:panelGroup id="InvoiceCustomer_document_icon">
			<aon:outputText 
				rendered="#{!controller.reservationInvoiceTo.registry.documentValidable}"
				styleClass="aon-icon-question"
				style="padding-left: 15px;"
				value="&#160;" />
			<aon:outputText 
				rendered="#{controller.reservationInvoiceTo.registry.documentValidable and controller.reservationInvoiceTo.registry.validDocument}"
				styleClass="aon-icon-predetermine"
				style="padding-left: 15px;"
				value="&#160;" />
			<aon:outputText 
				rendered="#{controller.reservationInvoiceTo.registry.documentValidable and !controller.reservationInvoiceTo.registry.validDocument}"
				styleClass="aon-icon-exception"
				style="padding-left: 15px;"
				value="&#160;" />
			</aon:panelGroup>
		<aon:outputText value="#{controller.reservationInvoiceTo.registry.documentCountry.value}" styleClass="aon-bold"
			rendered="#{!controller.reservationInvoiceTo.directCustomer}" />
		<aon:outputText value="#{controller.reservationInvoiceTo.registry.document}" styleClass="aon-margin-left aon-bold"
			rendered="#{!controller.reservationInvoiceTo.directCustomer}" />
	</aon:div>

	<aon:outputLabel for="ProjectReservation_invoiceCustomerAddress"
		value="#{bundle.aon_address}" />
	<aon:div id="invoiceAddressDiv">
		<aon:inputText id="ProjectReservation_invoiceCustomerAddress"
			value="#{controller.reservationInvoiceTo.address.address}"
			size="28" maxlength="45"
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:outputText styleClass="aon-italic" style="margin-left: 0.4em;"
			value="#{bundle.aon_number_abr}"
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:inputText id="ProjectReservation_invoiceCustomerNumber"
		 	style="margin-left: 0.3em;"
			value="#{controller.reservationInvoiceTo.address.number}"
			size="2" maxlength="12"
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:outputText styleClass="aon-italic" style="margin-left: 0.3em;"
			value="#{bundle.fiscal_streetFloor}"
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:inputText id="ProjectReservation_invoiceCustomerAddress2"
		 	style="margin-left: 0.3em;"
			value="#{controller.reservationInvoiceTo.address.address2}"
			size="2" maxlength="45"
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:outputText value="#{controller.reservationInvoiceTo.address.fullAddress}" styleClass="aon-bold"
			rendered="#{!controller.reservationInvoiceTo.directCustomer}" />
	</aon:div>

	<aon:outputLabel for="ProjectReservation_invoiceCustomerCity"
		value="#{bundle.aon_city}" />
	<aon:div id="invoiceCityDiv">
		<aon:inputText id="ProjectReservation_invoiceCustomerCity"
			value="#{controller.reservationInvoiceTo.address.city}"
			size="55" maxlength="45"
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:outputText value="#{controller.reservationInvoiceTo.address.city}" styleClass="aon-bold"
			rendered="#{!controller.reservationInvoiceTo.directCustomer}" />
	</aon:div>

	<aon:outputLabel for="ProjectReservation_invoiceCustomerProvince"
		value="#{bundle.aon_state}" />
	<aon:div id="invoiceProvinceDiv">
		<aon:inputText id="ProjectReservation_invoiceCustomerProvince"
			value="#{controller.reservationInvoiceTo.address.province}"
			size="31" maxlength="45"
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:outputText styleClass="aon-margin-left aon-margin-right aon-italic"
			value="C.P."
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:inputText id="ProjectReservation_invoiceCustomerZip"
			value="#{controller.reservationInvoiceTo.address.zip}"
			size="10" maxlength="16"
			rendered="#{controller.reservationInvoiceTo.directCustomer}" />
		<aon:outputText value="#{controller.reservationInvoiceTo.address.geozone.name}" styleClass="aon-bold"
			rendered="#{!controller.reservationInvoiceTo.directCustomer}" />
		<aon:outputText value="#{controller.reservationInvoiceTo.address.zip}" styleClass="aon-margin-left aon-bold"
			rendered="#{!controller.reservationInvoiceTo.directCustomer}" />
	</aon:div>

	<aon:if test="#{service}">
		<aon:outputLabel for="ProjectReservation_serviceType"
			value="#{bundle.aon_type}" />
		<aon:selectOneRadio id="ProjectReservation_serviceType"
			value="#{controller.reservationInvoiceTo.serviceType}" required="true"
			disabled="#{controller.invoiceServicesCount > 1}"
			valueChangeListener="#{controller.onInvoiceServiceTypeChanged}"
			reRender="invoiceServicesDiv,invoiceFinancesDiv">
			<f:selectItems value="#{controller.serviceTypes}" />
		</aon:selectOneRadio>				
	</aon:if>

</ui:composition>
