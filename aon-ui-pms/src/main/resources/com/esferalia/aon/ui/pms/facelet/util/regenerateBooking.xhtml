<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="regenerateBookingForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.pms_regenerate_booking_module}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="regenerateBooking-execute" 
						value="#{bundle.aon_execute}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{bookingRegenerator.regenerateBooking}"
						reRender="aonStatus">
						<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<aon:div>
				<aon:panelGrid columns="2" styleClass="aon-width-600 aon-padding aon-margin-left"
					columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="RegenerateBooking_hotel"
						value="#{bundle.aon_module_hotel}" />
					<aon:selectOneMenu id="RegenerateBooking_hotel"
						value="#{bookingRegenerator.hotel}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{pmsCollections.currentUserHotels}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_period}" />
					<aon:div>
						<aon:outputLabel for="RegenerateBooking_fromDate"
							styleClass="aon-italic aon-margin-right" 
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="RegenerateBooking_fromDate"
							value="#{bookingRegenerator.fromDate}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="RegenerateBooking_toDate"
							styleClass="aon-italic aon-margin-right" 
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="RegenerateBooking_toDate"
							value="#{bookingRegenerator.toDate}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>

				</aon:panelGrid>
			</aon:div>

		</aon:form>

		<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
			<ui:param name="logPanelTitle" value="#{bundle.pms_regenerate_booking_module}" />
		</ui:include>		
	</ui:define>

</ui:composition>
