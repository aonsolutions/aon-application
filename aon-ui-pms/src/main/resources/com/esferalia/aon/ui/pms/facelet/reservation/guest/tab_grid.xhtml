<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="skipSelectRow" value="#{true}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="newSaveButtonReRender" value="reservationForm" />
		<ui:param name="saveButtonReRender" value="reservationForm" />
		<ui:param name="skipRemoveButton" value="#{controller.to.guestIndex == 1}" />
		<ui:param name="focusOnAdd" value="ProjectReservationGuest_document-New" />
		<ui:param name="focusOnSelect" value="ProjectReservationGuest_document" />

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-iconColumn">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:commandButton id="Guest-selectButton"
					styleClass="aon-editDataTable-button aon-table-row-link"
					rendered="#{reservation.reservationPermission.editReservationGuestAllowed}"
					actionListener="#{controller.onSelect}"
					focus="#{(focusOnSelect != null)?(focusOnSelect):''}" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton id="Guest-resetButton" 
							title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
							styleClass="aon-editDataTable-button aon-icon-reset"
							rendered="#{reservation.reservationPermission.newReservationGuestAllowed}" 
							actionListener="#{controller.onReset}"
							accesskey="#{bundle.aon_key_new_line}" 
							focus="#{(focusOnAdd != null)?(focusOnAdd):''}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-220 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_document}" />
				</f:facet>
				<aon:div rendered="#{formList}" style="display:inline;">
					<aon:outputText value="#{to.fullDocument}" rendered="#{formList}">
						<aon:abbreviateConverter maxWidth="25" />
					</aon:outputText>
					<aon:outputText value="&#160;" styleClass="aon-icon-commandButton aon-icon-contact"
						title="#{bundle.pms_reservation_guest_type_newInHotel}"
						rendered="#{to.person.id != null and to.guestNewInHotel}" />
					<aon:outputText value="&#160;" styleClass="aon-icon-commandButton aon-icon-contact-new"
						title="#{bundle.pms_reservation_guest_type_newInChain}"
						rendered="#{to.person.id != null and to.guestNewInChain}" />
					<aon:outputText value="&#160;" styleClass="aon-icon-commandButton aon-icon-contact-error"
						title="#{bundle.pms_reservation_guest_type_previouslyStayedInHotel}"
						rendered="#{to.person.id != null and to.guestPreviouslyStayedInHotel}" />
				</aon:div>
				<aon:div rendered="#{formEdit}">
					<ui:include src="tab_grid_document.xhtml">
						<ui:param name="suffix" value="" />
					</ui:include>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{formNew}">
						<ui:include src="tab_grid_document.xhtml">
							<ui:param name="suffix" value="-New" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.report_guest}" />
				</f:facet>
				<aon:div rendered="#{formList}">
					<aon:outputText value="#{to.fullName}"  />
					<aon:div rendered="#{!empty to.barcode}" style="display:inline;">
						<aon:outputText value="(" styleClass="aon-margin-left" />
						<aon:outputText value="#{bundle.pms_barcode}:" styleClass="aon-italic" />
						<aon:outputText value="#{to.barcode}" styleClass="aon-bold aon-margin-left" />
						<aon:outputText value=")" />
					</aon:div>
				</aon:div>
				<aon:div rendered="#{formEdit}">
					<ui:include src="tab_grid_name.xhtml">
						<ui:param name="suffix" value="" />
					</ui:include>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{formNew}">
						<ui:include src="tab_grid_name.xhtml">
							<ui:param name="suffix" value="-New" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-220 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_contact_data}" />
				</f:facet>
				<aon:outputText value="&#160;" styleClass="aon-icon-call-error aon-padding-left aon-margin-right" rendered="#{formList and empty to.phone}" />
				<aon:outputText value="&#160;" styleClass="aon-icon-call aon-padding-left" rendered="#{formList and !empty to.phone}" />
				<aon:outputText styleClass="aon-margin-right" value="#{to.phone}" rendered="#{formList and !empty to.phone}" />
				<aon:outputText value="&#160;" styleClass="aon-icon-mailInbox-error aon-padding-left aon-margin-left" rendered="#{formList and empty to.email}" />
				<aon:outputText value="&#160;" styleClass="aon-icon-mailInbox aon-padding-left" rendered="#{formList and !empty to.email}" />
				<aon:outputText value="#{to.email}" rendered="#{formList}">
					<aon:abbreviateConverter maxWidth="15" />
				</aon:outputText>
				<rich:toolTip rendered="#{formList and !empty to.email}">
					<aon:outputText value="#{to.email}" />
				</rich:toolTip>
				<aon:div rendered="#{formEdit}">
					<ui:include src="tab_grid_contact.xhtml">
						<ui:param name="suffix" value="" />
					</ui:include>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{formNew}">
						<ui:include src="tab_grid_contact.xhtml">
							<ui:param name="suffix" value="-New" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-280 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_address}" />
				</f:facet>
				<aon:outputText value="#{to.fullAddress}" rendered="#{formList}">
					<aon:abbreviateConverter maxWidth="50" />
				</aon:outputText>
				<rich:toolTip rendered="#{formList and !empty to.fullAddress}">
					<aon:outputText value="#{to.fullAddress}" />
				</rich:toolTip>
				<aon:div rendered="#{formEdit}">
					<ui:include src="tab_grid_address.xhtml">
						<ui:param name="suffix" value="" />
					</ui:include>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{formNew}">
						<ui:include src="tab_grid_address.xhtml">
							<ui:param name="suffix" value="-New" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>
		</ui:define>

		<ui:define name="endFormListContent">
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
				<ui:param name="auditableTO" value="#{to}" />
			</ui:include>
		</ui:define>

	</ui:decorate>

</ui:composition>
