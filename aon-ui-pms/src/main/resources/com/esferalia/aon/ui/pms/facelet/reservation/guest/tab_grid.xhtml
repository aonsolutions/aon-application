<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">

		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-20">
				<f:facet name="header">
					<aon:outputLabel for="ProjectReservationGuest_guestIndex" value="#{bundle.aon_order}" />
				</f:facet>
				<aon:outputText value="#{to.guestIndex}" rendered="#{formList or formEdit}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top">
				<f:facet name="header">
					<aon:outputLabel for="ProjectReservationGuest_fullName" value="#{pmsBundle.pms_guest}" />
				</f:facet>
				<aon:outputText value="#{to.fullName}" rendered="#{formList}" />
				<aon:div rendered="#{formEdit}">
					<ui:include src="tab_grid_name.xhtml">
						<ui:param name="suffix" value="" />
					</ui:include>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{formNew}">
						<ui:include src="tab_grid_name.xhtml">
							<ui:param name="suffix" value="-New" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-150 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="ProjectReservationGuest_phone" value="#{bundle.aon_phone}" />
				</f:facet>
				<aon:outputText value="#{to.phone}" rendered="#{formList}" />
				<aon:inputText id="ProjectReservationGuest_phone" value="#{controller.to.phone}"
					rendered="#{formEdit}" size="20" maxlength="32" />
				<f:facet name="footer">
					<aon:inputText id="ProjectReservationGuest_phone-New" value="#{controller.to.phone}"
						rendered="#{formNew}" size="20" maxlength="32" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-200 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="ProjectReservationGuest_email" value="#{bundle.aon_email}" />
				</f:facet>
				<aon:outputText value="#{to.email}" rendered="#{formList}" />
				<aon:inputText id="ProjectReservationGuest_email" value="#{controller.to.email}"
					rendered="#{formEdit}" size="25" maxlength="128" />
				<f:facet name="footer">
					<aon:inputText id="ProjectReservationGuest_email-New" value="#{controller.to.email}"
						rendered="#{formNew}" size="25" maxlength="128" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-vertical-align-top aon-width-300 aon-nowrap">
				<f:facet name="header">
					<aon:outputLabel for="ProjectReservationGuest_fullAddress" value="#{bundle.aon_address}" />
				</f:facet>
				<aon:outputText value="#{to.fullAddress}" rendered="#{formList}">
					<aon:abbreviateConverter maxWidth="50" />
				</aon:outputText>
				<rich:toolTip rendered="#{formList and !empty to.fullAddress}">
					<aon:outputText value="#{to.fullAddress}" />
				</rich:toolTip>
				<aon:div rendered="#{formEdit}">
					<ui:include src="tab_grid_address.xhtml">
						<ui:param name="suffix" value="" />
					</ui:include>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{formNew}">
						<ui:include src="tab_grid_address.xhtml">
							<ui:param name="suffix" value="-New" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
