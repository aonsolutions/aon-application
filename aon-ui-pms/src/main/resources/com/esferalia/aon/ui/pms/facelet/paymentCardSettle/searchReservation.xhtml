<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">

	<aon:panelGrid id="ReservationSearchPanel" 
		columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">

		<aon:outputLabel for="PaymentCardFinance_reservationId" 
			value="#{bundle.report_id}" />
		<aon:inputText id="PaymentCardFinance_reservationId"
			value="#{paymentCardSettle.reservationId}" size="20" />

		<aon:outputLabel value="&#160;" rendered="#{paymentCardSettle.reservationCodesSize > 0}" />
		<aon:div id="reservationCodesDiv" rendered="#{paymentCardSettle.reservationCodesSize > 0}">
			<a4j:repeat value="#{paymentCardSettle.reservationCodes}" var="reservationCode" rowKeyVar="reservationCodeIdx">
				<aon:div>
					<aon:panelGrid columns="2" 	
						columnClasses="aon-width-150,aon-width-auto">
						<aon:outputText value="#{reservationCode}" />
						<aon:commandButton id="PaymentCardFinance_reservationCode-remove"
							styleClass="aon-finding-toolbar-item aon-search-minus"
							value="&#160;" immediate="true"
							actionListener="#{paymentCardSettle.onRemoveReservationCode}"
							reRender="ReservationSearchPanel"
							focus="PaymentCardFinance_reservationCode">
							<f:param name="reservationCodeIdx" value="#{reservationCodeIdx}" />
						</aon:commandButton>
					</aon:panelGrid>
				</aon:div>						
			</a4j:repeat>
		</aon:div>
		<aon:outputLabel for="PaymentCardFinance_reservationCode" 
			value="#{bundle.report_reservation_code}" />
		<aon:div id="PaymentCardFinance_reservationCode-Div"> 
			<aon:panelGrid columns="2"
				columnClasses="aon-width-150,aon-width-auto">
				<aon:inputText id="PaymentCardFinance_reservationCode"
					value="#{paymentCardSettle.reservationCode}" size="20" >
					<a4j:support event="onblur" ignoreDumpResponses="true" 
						reRender="PaymentCardFinance_reservationCode-Div" ajaxSingle="#{true}" /> 
				</aon:inputText>
				<aon:commandButton id="PaymentCardFinance_reservationCode-add" 
					styleClass="aon-finding-toolbar-item aon-search-add"
					value="&#160;" immediate="true"
					rendered="#{not empty paymentCardSettle.reservationCode}"
					actionListener="#{paymentCardSettle.onAddReservationCode}"
					reRender="ReservationSearchPanel"
					focus="PaymentCardFinance_reservationCode" />
			</aon:panelGrid>
		</aon:div>

		<aon:outputLabel value="#{bundle.report_guest}" />
		<aon:div>
			<aon:outputLabel for="PaymentCardFinance_reservationGuestName"
				styleClass="aon-italic aon-margin-right" 
				value="#{bundle.aon_name}" />
			<aon:inputText id="PaymentCardFinance_reservationGuestName"
				value="#{paymentCardSettle.guestName}" size="15" />
			<aon:outputLabel for="PaymentCardFinance_reservationGuestSurname"
				styleClass="aon-italic aon-margin-left aon-margin-right" 
				value="#{bundle.aon_surname}" />
			<aon:inputText id="PaymentCardFinance_reservationGuestSurname"
				value="#{paymentCardSettle.guestSurname}" size="20" />
		</aon:div>

	</aon:panelGrid>

</ui:composition>
