<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showAllotmentCopyWindow">
		<aon:if test="#{controller.showAllotmentCopyWindow}">
			<rich:modalPanel id="allotmentCopyModalPanel" minHeight="240"
				minWidth="450" rendered="#{controller.showAllotmentCopyWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText 
							value="#{bundle.aon_copy}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showAllotmentCopyWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showAllotmentCopyWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="allotmentCopyForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="allotmentCopy-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_accept}"
										actionListener="#{controller.onAllotmentCopy}"
										onclick="Richfaces.showModalPanel('waitProccess')" 
							     		oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<aon:actionHotKey key="return" />
										<rich:componentControl for="allotmentCopyModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showAllotmentCopyWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="allotmentCopy-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_cancel}">
										<f:setPropertyActionListener
											target="#{controller.showAllotmentCopyWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 100%;">

										<aon:outputLabel for="AllotmentCopy_hotel" value="#{bundle.aon_module_hotel}" />
										<aon:selectOneMenu id="AllotmentCopy_hotel"
											value="#{controller.allotmentAux.hotel}" required="true"
											valueChangeListener="#{allotment.onHotelAuxChanged}" 
											reRender="AllotmentCopy_item" ajaxSingle="true">
											<f:selectItems value="#{pmsCollections.currentUserHotels}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="AllotmentCopy_item" value="#{bundle.pms_room}" />
										<aon:selectOneMenu id="AllotmentCopy_item"
											value="#{controller.itemAux}" required="true">
											<f:selectItem itemLabel="-" value="#{null}" />
											<f:selectItems value="#{controller.hotelAuxRoomItems}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
