<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showRoomDetailWindow">
		<c:if test="#{modalController.showRoomDetailWindow}">
			<rich:modalPanel id="roomDetailModalPanel" minHeight="425" minWidth="750" 
				rendered="#{modalController.showRoomDetailWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{(controller.to.roomNumber == null) ? (bundle.pms_room_assign) : (bundle.pms_room_change)}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{controller.onCancel}"
							reRender="aonContent" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{modalController.showRoomDetailWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="roomDetailFrom">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="roomDetail-accept"
										rendered="#{modalController.allReallocated or modalController.noRoomAssigned}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_save} #{bundle.pms_stay}"
										actionListener="#{modalController.onAcceptDivert}">
										<rich:componentControl for="roomDetailModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{modalController.showRoomDetailWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="roomDetail-back"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}" 
										actionListener="#{controller.onCancel}"
										reRender="showRoomDetailWindow" immediate="true">
										<f:setPropertyActionListener
											target="#{modalController.showRoomDetailWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 1em;" id="roomDetailGrid">
								
									<aon:panelGrid columns="2" columnClasses="aon-margin-top aon-width-500, aon-vertical-align-top aon-padding-left aon-width-auto">
										<aon:panelGrid columns="2" columnClasses="aon-panelGrid-odd aon-width-150, aon-panelGrid-even aon-width-350">
											
											<aon:outputText value="#{bundle.aon_reservation}" />
											<aon:div>
												<aon:outputText value="#{modalController.to.projectReservation.id}" />
												<aon:outputText value=" - " />
												<aon:outputText value="#{modalController.to.projectReservation.code} - #{modalController.to.projectReservation.guestFullName}" />
												<aon:outputText value=" - " />
												<aon:outputText value="#{modalController.to.projectReservation.startDate}" >
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
												<aon:outputText value=" - " />
												<aon:outputText value="#{modalController.to.projectReservation.endDate}" >
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
											</aon:div>

											<aon:outputLabel value="Periodo Cambio" />
											<aon:div id="ProjectReservationRoomDates" >
												<aon:outputText value="#{bundle.aon_date_from}" styleClass="aon-italic aon-margin-right" />
												<aon:outputText value="#{roomAvailability.filterParams.viewerStartDate}" styleClass="aon-bold">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>

												<aon:outputText value="#{bundle.aon_date_to}" styleClass="aon-italic aon-margin-left aon-margin-right" />
												<aon:outputText value="#{roomAvailability.filterParams.viewerEndDate}" styleClass="aon-bold">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
											</aon:div>
											
											<c:if test="#{!modalController.allReallocated}" >
												<aon:outputLabel for="ProjectReservationRoom_projectReservation_item"
													value="#{bundle.pms_room}" />
												<aon:selectOneMenu id="ProjectReservationRoom_projectReservation_item" styleClass="aon-width-350"
													value="#{modalController.pendingRoom}" 
													valueChangeListener="#{modalController.onPendingRoomChanged}"
													reRender="roomDetailGrid">
													<f:selectItem itemLabel=" - " itemValue="null" />
													<f:selectItems value="#{modalController.pendingRooms}" />
												</aon:selectOneMenu>
	
												<aon:outputLabel for="ProjectReservationRoom_item"
													value="#{bundle.pms_room_type}" />
												<aon:selectOneMenu id="ProjectReservationRoom_item" styleClass="aon-width-350"
													value="#{roomAvailability.filterParams.item}" required="true"
													valueChangeListener="#{roomAvailability.onItemFilterChanged}"
													reRender="ProjectReservationRoomAvailability">
													<f:selectItems value="#{modalController.hotelRoomItems}" />
												</aon:selectOneMenu>
	
												<aon:outputLabel for="ProjectReservationRoom_adults"
													value="#{bundle.pms_adults}" />
												<aon:outputText id="ProjectReservationRoom_adults"
													value="#{modalController.pendingRoom.adults}" />
	
												<aon:outputLabel for="ProjectReservationRoom_children"
													value="#{bundle.pms_children}" />
												<aon:outputText id="ProjectReservationRoom_children" 
													value="#{modalController.pendingRoom.children}" />
	
												<aon:outputLabel value="#{bundle.pms_available_rooms}" />
												<aon:div id="ProjectReservationRoomAvailability" style="white-space:normal; display:inline;">
													<aon:outputText value="#{bundle.pms_no_room_available_msg}" styleClass="aon-bold aon-label-error"
														rendered="#{roomAvailability.availableRoomCount == 0}" />
													<a4j:repeat value="#{modalController.availableRoomList}" var="availableRoom"
														rendered="#{roomAvailability.availableRoomCount > 0}">
														<aon:commandLink styleClass="aon-dataTable-link-noicon aon-bold aon-nowrap"
															value="#{availableRoom.asset.name}"
															reRender="roomDetailFrom"
															actionListener="#{modalController.onAssignReservationRoom}">
															<f:param name="availableRoom" value="#{availableRoom.asset.id}"/>
														</aon:commandLink>
														<aon:outputText value=" " />
													</a4j:repeat>
												</aon:div>
											</c:if>

											<aon:outputLabel value="Reasignadas" />
											<aon:div>
												<aon:dataTable  styleClass="aon-noborder"
													value="#{modalController.asignedList}" var="asignedRoom">
													<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-noborder"
														style="font-size: 0.9em;">
														<aon:div>
															<aon:outputText value="#{asignedRoom.reservationRoom.item.product.code}"
																rendered="#{asignedRoom.room!=null}" />
															<aon:outputText value=" - " 
																rendered="#{asignedRoom.room!=null}" />
															<aon:outputText value="#{asignedRoom.reservationRoom.item.product.name}"
																rendered="#{asignedRoom.room!=null}" />
														</aon:div>
													</aon:column>
													<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-noborder"
														style="font-size: 0.9em;">
														<aon:outputText value="(#{asignedRoom.room.asset.name})" 
															rendered="#{asignedRoom.room!=null}" />
													</aon:column>
												</aon:dataTable>
											</aon:div>

										</aon:panelGrid>

										<aon:div id="ProjectReservationRoomFilters" styleClass="aon-panelGrid-search aon-nomargin aon-text-center aon-width-170"
											rendered="#{!modalController.allReallocated}">
											<aon:div>
												<aon:outputText value="#{bundle.pms_room_number}" styleClass="aon-italic aon-margin-right" />
												<aon:inputText value="#{roomAvailability.filterParams.name}" 
													size="3" maxlength="5" />
											</aon:div>
											<aon:selectManyCheckbox styleClass="aon-text-left" layout="pageDirection"
												value="#{roomAvailability.filterParams.featureFilter}">
												<f:selectItems value="#{assetCollections.featuresIds}" />
											</aon:selectManyCheckbox>
											<aon:commandButton id="addFeature" ignoreDupResponses="true"
												value="#{bundle.aon_filter}" styleClass="aon-margin-top"
												actionListener="#{roomAvailability.onFilter}"
												reRender="ProjectReservationRoomAvailability,ProjectReservationRoomFilters" />
										</aon:div>

									</aon:panelGrid>

								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
