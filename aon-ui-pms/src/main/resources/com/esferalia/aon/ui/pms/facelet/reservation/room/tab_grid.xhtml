<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:valueParam name="allotmentRateCode" default="#{reservation.to.allotmentRateCode}" />

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="skipSelectRow" value="#{true}" />
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="skipNewSaveButton" value="#{true}" />
		<ui:param name="skipNewCancelButton" value="#{true}" />
		<ui:param name="skipSaveButton" value="#{true}" />
		<ui:param name="skipCancelButton" value="#{true}" />
		<ui:param name="skipRemoveButton" value="#{true}" />

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-iconColumn">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:commandButton id="Room-selectButton"
					styleClass="aon-editDataTable-button aon-table-row-link"
					rendered="#{reservation.reservationPermission.selectReservationRoomAllowed}"
					actionListener="#{controller.onSelect}"
					reRender="showRoomDetailWindow"
					focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
					<f:setPropertyActionListener target="#{controller.showFeatures}"
						value="#{false}" />
					<f:setPropertyActionListener target="#{controller.showRoomDetailWindow}"
						value="#{true}" />
				</aon:commandButton>
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton id="Room-resetButton" 
							title="#{bundle.aon_reset} (#{bundle.aon_key_new_line_accelerator})"
							styleClass="aon-editDataTable-button aon-icon-reset"
							rendered="#{reservation.reservationPermission.newReservationRoomAllowed}" 
							actionListener="#{controller.onReset}"
							reRender="showRoomDetailWindow"
							accesskey="#{bundle.aon_key_new_line}" 
							focus="#{(focusOnAdd != null)?(focusOnAdd):''}">
							<f:setPropertyActionListener target="#{controller.showRoomDetailWindow}"
								value="#{true}" />
						</aon:commandButton>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.pms_room_type}" />
				</f:facet>
				<aon:outputText value="#{to.item.product.code} - #{to.item.product.name}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.pms_room_number}" />
				</f:facet>
				<aon:outputText value="#{to.roomNumber}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-300">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.report_tariff}" />
				</f:facet>
				<aon:outputText value="#{to.tariff.code} - #{to.tariff.name}" />
			</aon:column>

			<aon:if test="#{allotmentRateCode != null}">
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-70">
					<f:facet name="header">
						<aon:outputLabel value="#{bundle.pms_allotment}" />
					</f:facet>
					<aon:outputText value="#{to.allotmentRateCode}" />
				</aon:column>
			</aon:if>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.pms_adults}" />
				</f:facet>
				<aon:outputText value="#{to.adults}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.pms_children}" />
				</f:facet>
				<aon:outputText value="#{to.children}" />
			</aon:column>
		</ui:define>

		<ui:define name="endFormListContent">
			<aon:div>
				<aon:commandButton id="showRoomDetailTable"
					value="&#160;" styleClass="aon-icon-tree-root aon-noborder"
					title="#{bundle.finance_tobreakdown}"
					rendered="#{to.roomNumber != null and !to.showRoomDetail}" 
					actionListener="#{controller.onShowRoomDetails}"
					reRender="#{dataTableId}" />
				<aon:commandButton id="hideRoomDetailTable"
					value="&#160;" styleClass="aon-icon-index aon-noborder"
					title="#{bundle.finance_hide}"
					rendered="#{to.roomNumber != null and to.showRoomDetail}" 
					actionListener="#{controller.onHideRoomDetails}"
					reRender="#{dataTableId}" />
				<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
					<ui:param name="auditableTO" value="#{to}" />
				</ui:include>
			</aon:div>
			<rich:subTable id="roomDetailTable" 
				rendered="#{controller.showRoomDetail}"
				value="#{controller.roomDetailList}" var="roomDetail"
				rowClasses="aon-subTable-column-green">

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<aon:outputText value="&#160;" />
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<aon:panelGrid columns="2" columnClasses="aon-noborder aon-width-120, aon-noborder aon-width-auto">
						<aon:div>
							<aon:outputLabel value="#{bundle.aon_date}:" styleClass="aon-margin-right"/>
							<aon:outputText value="#{roomDetail.assetActivity.date}" styleClass="aon-italic">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:div>
						<aon:div rendered="#{roomDetail.room.item.id != roomDetail.projectReservationRoom.item.id}">
							<aon:outputLabel value="#{bundle.aon_type}:" styleClass="aon-margin-right" />
							<aon:outputText value="#{roomDetail.room.item.product.code} - #{roomDetail.room.item.product.name}" styleClass="aon-italic" />
							<aon:outputText value="&#160;" />
						</aon:div>
					</aon:panelGrid>
				</aon:column>

				<aon:column colspan="#{(allotmentRateCode == null) ? '5' : '6'}" styleClass="aon-editDataTable-textColumn aon-bold aon-subTable-column">
					<aon:panelGrid columns="2" columnClasses="aon-noborder aon-width-130, aon-noborder aon-width-auto">
						<aon:div>
							<aon:outputLabel value="#{bundle.pms_room}:" styleClass="aon-margin-right" />
							<aon:outputText value="#{roomDetail.assetActivity.asset.name}" styleClass="aon-italic" />
						</aon:div>
						<aon:div rendered="#{roomDetail.room.hotel.id != reservation.to.hotel.id}">
							<aon:outputLabel value="#{bundle.aon_module_hotel}:" styleClass="aon-margin-right" />
							<aon:outputText value="#{roomDetail.room.hotel.workPlace.description}" styleClass="aon-italic" />
							<aon:outputText value="&#160;" />
						</aon:div>
					</aon:panelGrid>
				</aon:column>

			</rich:subTable>
		</ui:define>

	</ui:decorate>

</ui:composition>
