<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:outputLabel for="ProjectReservation_hotel_id" value="#{pmsBundle.pms_hotel}" />
	<aon:div rendered="#{!reservation.new}">
		<aon:outputText	value="#{reservation.to.hotel.workPlace.description}" styleClass="aon-bold" />
		<aon:div style="display: inline;"
			rendered="#{reservation.to.hotel.id != reservation.to.hotelReservation.id}" >
			<aon:outputText	value="&#160;" styleClass="aon-margin-left aon-icon-commandButton aon-icon-info" />
			<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
				<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-70, aon-noborder aon-bold aon-text-left">
					<aon:outputText	value="#{pmsBundle.pms_source}:" styleClass="aon-margin-left" />
					<aon:outputText	value="#{reservation.to.hotelReservation.workPlace.description}" />
				</aon:panelGrid>
			</rich:toolTip>
		</aon:div>
	</aon:div>
	<aon:selectOneMenu id="ProjectReservation_hotel_id" value="#{reservation.to.hotel}" 
		rendered="#{reservation.new}" required="true"
		valueChangeListener="#{reservation.onHotelChanged}"
		reRender="ProjectReservation_roomItem,ProjectReservation_roomTariff">
		<f:selectItems value="#{pmsCollections.currentUserHotels}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_status" value="#{bundle.aon_status}"
		rendered="#{!reservation.new}" />
	<aon:div rendered="#{!reservation.new}">
		<aon:outputText id="ProjectReservation_status" value="#{reservation.to.status}" 
			styleClass="aon-bold" rendered="#{!reservation.new}" />
		<aon:outputText value="#{pmsBundle.pms_no_show}" 
			styleClass="aon-bold aon-label-error aon-margin-left" rendered="#{!reservation.new and reservation.to.noShow}" />
		<aon:commandButton id="block" value="&#160;"
			actionListener="#{reservation.onBlock}"
			title="#{pmsBundle.pms_to_block}"
			immediate="true" rendered="#{!reservation.new and reservation.active and aonRole.saleOperator}"
			styleClass="aon-icon-commandButton aon-icon-lock aon-margin-left">
		</aon:commandButton>
		<aon:commandButton id="unblock" value="&#160;"
			actionListener="#{reservation.onUnblock}"
			title="#{pmsBundle.pms_to_unblock}"
			immediate="true" rendered="#{reservation.blocked and aonRole.saleOperator}"
			styleClass="aon-icon-commandButton aon-icon-unlock aon-margin-left">
		</aon:commandButton>
		<aon:outputText value="#{pmsBundle.pms_reservation_divert_requested}" 
			styleClass="aon-bold aon-label-info aon-margin-left" rendered="#{!reservation.new and reservation.pendingDivert}" />
	</aon:div>

	<aon:outputLabel for="ProjectReservation_guest" value="#{pmsBundle.pms_guest}" />
	<aon:outputText	id="ProjectReservation_guest" value="#{reservation.to.guestFullName}" 
		styleClass="aon-bold" rendered="#{!reservation.new}" />
	<aon:div rendered="#{reservation.new}">
		<aon:outputLabel for="ProjectReservation_guestName" value="#{bundle.aon_name}"
			styleClass="aon-margin-left aon-margin-right aon-italic" />
		<aon:inputText id="ProjectReservation_guestName" value="#{reservation.guestName}" 
			size="30" maxlength="64" required="true" />
		<aon:outputLabel for="ProjectReservation_guestSurname" value="#{bundle.aon_surname}"
			styleClass="aon-margin-left aon-margin-right aon-italic" />
		<aon:inputText id="ProjectReservation_guestSurname" value="#{reservation.guestSurname}" 
			size="30" maxlength="64" required="true" />
	</aon:div>

	<aon:outputLabel for="ProjectReservation_creationDate" value="#{pmsBundle.pms_reservation_creationDate}"
		rendered="#{!reservation.new}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130, aon-width-auto" rendered="#{!reservation.new}">
		<aon:outputText id="ProjectReservation_creationDate" value="#{reservation.to.creationDate}"
			styleClass="aon-bold">
			<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<aon:div>
			<aon:outputLabel for="ProjectReservation_modificationDate" value="#{pmsBundle.pms_reservation_modificacionDate}:"
				styleClass="aon-margin-right aon-italic" rendered="#{reservation.to.modificationDate != null}" />
			<aon:outputText id="ProjectReservation_modificationDate" value="#{reservation.to.modificationDate}" 
				styleClass="aon-bold" rendered="#{reservation.to.modificationDate != null}">
				<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="ProjectReservation_project_id" value="#{pmsBundle.pms_reservation_id}"
		rendered="#{!reservation.new}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130,aon-width-auto"
		rendered="#{!reservation.new}">
		<aon:outputText	id="ProjectReservation_project_id" value="#{reservation.to.id}" 
			styleClass="aon-bold" />
		<aon:div>
			<aon:outputLabel for="ProjectReservation_crsCode" value="#{pmsBundle.pms_crs}:"
				styleClass="aon-margin-right aon-italic" rendered="#{!empty reservation.to.crsCode}" />
			<aon:div rendered="#{!empty reservation.to.crsCode}" style="display:inline;">
				<aon:outputText id="ProjectReservation_crsCode" value="#{reservation.to.crsCode}"  
					styleClass="aon-bold" />
				<c:if test="#{aonRole.admin}">
					<aon:commandButton id="crsBlock" value="&#160;"
						actionListener="#{reservation.onCrsBlock}"
						title="#{pmsBundle.pms_to_block}"
						immediate="true" rendered="#{!reservation.to.crs and reservation.active}"
						styleClass="aon-icon-commandButton aon-icon-lock aon-margin-left">
					</aon:commandButton>
					<aon:commandButton id="crsUnblock" value="&#160;"
						actionListener="#{reservation.onCrsUnblock}"
						title="#{pmsBundle.pms_to_unblock}"
						immediate="true" rendered="#{reservation.to.crs}"
						styleClass="aon-icon-commandButton aon-icon-unlock aon-margin-left">
					</aon:commandButton>
				</c:if>
			</aon:div>
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="ProjectReservation_code" value="#{pmsBundle.pms_reservation_code}" />
	<aon:outputText	value="#{reservation.to.code}" styleClass="aon-bold"
		rendered="#{reservation.to.crs or !reservation.active or !aonRole.saleOperator}" />
	<aon:inputText id="ProjectReservation_code" value="#{reservation.to.code}"
		size="30" maxlength="32" required="true"
		rendered="#{!reservation.to.crs and reservation.active and aonRole.saleOperator}" />

	<aon:outputLabel for="ProjectReservation_startDate" value="#{pmsBundle.pms_checkIn}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130, aon-width-auto">
		<aon:outputText	value="#{reservation.to.startDate}" styleClass="aon-bold"
			rendered="#{reservation.to.crs or !reservation.active or reservation.to.inUse or !aonRole.saleOperator}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<aon:selectInputDate id="ProjectReservation_startDate" value="#{reservation.to.startDate}" 
			required="true" rendered="#{!reservation.to.crs and reservation.active and !reservation.to.inUse and aonRole.saleOperator}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
			<a4j:support ajaxSingle="true" event="oninputchange"
				actionListener="#{reservation.onStartDateChanged}"
				reRender="ProjectReservation_nights,ProjectReservation_endDate"
				focus="ProjectReservation_nights" />
			<a4j:support ajaxSingle="true" event="onchanged"
				actionListener="#{reservation.onStartDateChanged}"
				reRender="ProjectReservation_nights,ProjectReservation_endDate"
				focus="ProjectReservation_nights" />
		</aon:selectInputDate>
		<aon:div>
			<aon:outputLabel for="ProjectReservation_nights" value="#{pmsBundle.pms_nights}:" 
				styleClass="aon-margin-right aon-italic" />
			<aon:outputText value="#{reservation.nights}" styleClass="aon-bold" 
				rendered="#{reservation.to.crs or !reservation.active or reservation.to.inUse or !aonRole.saleOperator}" />
			<aon:inputText id="ProjectReservation_nights" value="#{reservation.nights}"
				size="1" maxlength="3"
				rendered="#{!reservation.to.crs and reservation.active and !reservation.to.inUse and aonRole.saleOperator}"
				valueChangeListener="#{reservation.onNightsChanged}"
				reRender="ProjectReservation_endDate"
				focus="ProjectReservation_bookingHolder" />
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="ProjectReservation_startTime" value="#{pmsBundle.pms_checkIn_hour}"
		rendered="#{!reservation.new}" />
	<aon:selectOneMenu id="ProjectReservation_startTime" value="#{reservation.startTime}"
		rendered="#{!reservation.new}">
		<f:selectItems value="#{reservation.reservationTimes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_endDate" value="#{pmsBundle.pms_checkOut}" />
	<aon:outputText	value="#{reservation.to.endDate}" styleClass="aon-bold"
		rendered="#{reservation.to.crs or !reservation.active or reservation.to.inUse or !aonRole.saleOperator}">
		<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
			timeZone="#{timeZoneController.timeZoneId}" />
	</aon:outputText>
	<aon:selectInputDate id="ProjectReservation_endDate" value="#{reservation.to.endDate}" 
		required="true" rendered="#{!reservation.to.crs and reservation.active and !reservation.to.inUse and aonRole.saleOperator}"
		timeZone="#{timeZoneController.timeZone}"
		popupDateFormat="#{bundle.aon_date_pattern}">
		<a4j:support ajaxSingle="true" event="oninputchange"
			actionListener="#{reservation.onEndDateChanged}"
			reRender="ProjectReservation_startDate,ProjectReservation_nights"
			focus="ProjectReservation_bookingHolder" />
		<a4j:support ajaxSingle="true" event="onchanged"
			actionListener="#{reservation.onEndDateChanged}"
			reRender="ProjectReservation_startDate,ProjectReservation_nights"
			focus="ProjectReservation_bookingHolder" />
	</aon:selectInputDate>

	<aon:outputLabel for="ProjectReservation_endTime" value="#{pmsBundle.pms_checkOut_hour}" 
		rendered="#{!reservation.new}" />
	<aon:selectOneMenu id="ProjectReservation_endTime" value="#{reservation.endTime}"
		rendered="#{!reservation.new}">
		<f:selectItems value="#{reservation.reservationTimes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_bookingHolder" value="#{pmsBundle.pms_reservation_holder}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130, aon-width-auto" rendered="#{!reservation.new}">
		<aon:div>
			<aon:outputText value="#{reservation.to.bookingHolder}" styleClass="aon-bold" 
				rendered="#{!reservation.active or !aonRole.saleOperator}"  />
			<aon:selectOneMenu id="ProjectReservation_bookingHolder" value="#{reservation.to.bookingHolder}" 
				required="true" rendered="#{reservation.active and aonRole.saleOperator}"
				valueChangeListener="#{reservation.onHolderChanged}"
				reRender="BookingHolderLabelDiv,BookingHolderValueDiv,ProjectReservation_roomTariff">
				<f:selectItems value="#{pmsCollections.bookingHolders}" />
			</aon:selectOneMenu>
		</aon:div>

		<aon:div>
			<aon:outputLabel value="#{pmsBundle.pms_advance}:" 
				rendered="#{aonRole.saleOperator or (!aonRole.saleOperator and reservation.to.advance>0)}"
				styleClass="aon-margin-right aon-italic" />
			<aon:outputText rendered="#{!aonRole.saleOperator and reservation.to.advance>0}"	
				value="#{reservation.to.advance}" styleClass="aon-bold" >
				<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
			</aon:outputText>
			<aon:inputText value="#{reservation.to.advance}"
				size="8" maxlength="12"
				rendered="#{reservation.active and aonRole.saleOperator}"
				disabled="#{reservation.to.advanceInvoiced}" />
		</aon:div>
	</aon:panelGrid>

	<aon:div id="BookingHolderLabelDiv">
		<aon:outputLabel for="Customer_id-Agency" value="#{pmsBundle.pms_agency}"
			 rendered="#{!reservation.to.companyHolder}" />
		<aon:outputLabel for="Customer_id-Company" value="#{pmsBundle.pms_company}"
			rendered="#{reservation.to.companyHolder}" />
	</aon:div>

	<aon:div id="BookingHolderValueDiv">
		<aon:outputText value="#{reservation.to.agency.registry.fullName}" styleClass="aon-bold" 
			rendered="#{!reservation.to.companyHolder and (!reservation.active or !aonRole.saleOperator)}"  />
		<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
			<ui:param name="lookupTo" value="#{reservation.to.agency}" />
			<ui:param name="lookupSuffix" value="-Agency" />
			<ui:param name="lookupRendered" value="#{!reservation.to.companyHolder and reservation.active and aonRole.saleOperator}" />
			<ui:param name="skipLabel" value="#{true}" />
			<ui:param name="skipNewButton" value="#{!reservation.active or !aonRole.saleOperator or !aonRole.financeOperator}" />
			<ui:param name="skipGoToButton" value="#{!aonRole.financeOperator}" />
			<ui:param name="lookupReRender" value="ProjectReservation_roomTariff" />
			<aon:methodParam name="lookupChangeListener"
				value="#{reservation.onAgencyChanged}" type="lookupChangeListener" />
		</ui:include>
		<aon:outputText value="#{reservation.to.company.registry.fullName}" styleClass="aon-bold" 
			rendered="#{reservation.to.companyHolder and (!reservation.active or !aonRole.saleOperator)}"  />
		<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
			<ui:param name="lookupTo" value="#{reservation.to.company}" />
			<ui:param name="lookupSuffix" value="-Company" />
			<ui:param name="lookupRendered" value="#{reservation.to.companyHolder and reservation.active and aonRole.saleOperator}" />
			<ui:param name="skipLabel" value="#{true}" />
			<ui:param name="skipNewButton" value="#{!reservation.active or !aonRole.saleOperator or !aonRole.financeOperator}" />
			<ui:param name="skipGoToButton" value="#{!aonRole.financeOperator}" />
			<ui:param name="lookupReRender" value="ProjectReservation_roomTariff" />
			<aon:methodParam name="lookupChangeListener"
				value="#{reservation.onCompanyChanged}" type="lookupChangeListener" />
		</ui:include>
	</aon:div>

	<aon:outputLabel value="#{bundle.aon_amount} #{bundle.aon_total}" rendered="#{!reservation.new}" />
	<aon:panelGrid columns="3" columnClasses="aon-width-130, aon-width-130, aon-width-auto" rendered="#{!reservation.new}">
		<aon:div>
			<aon:outputText	value="#{reservation.to.total}"	styleClass="aon-bold">
				<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
			</aon:outputText>
			<aon:outputText	value="&#160;" styleClass="aon-margin-left aon-icon-commandButton aon-icon-info"/>
			<rich:toolTip showEvent="onclick" hideEvent="onmouseout" direction="auto">
				<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-120,aon-noborder aon-bold aon-text-right">
					<aon:outputLabel value="#{bundle.aon_taxable_base}:" />
					<aon:outputText	value="#{reservation.to.taxableBase}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>

					<aon:outputLabel value="#{bundle.aon_vat}:" />
					<aon:outputText	value="#{reservation.to.vatQuota}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>

					<aon:outputLabel value="#{pmsBundle.pms_other_tax}:" />
					<aon:outputText	value="#{reservation.to.otherTaxQuota}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>

					<aon:outputLabel value="#{bundle.aon_total}:" />
					<aon:outputText	value="#{reservation.to.total}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>
				</aon:panelGrid>
			</rich:toolTip>
		</aon:div>
		<aon:div>
			<aon:outputLabel value="#{pmsBundle.pms_room_count}:" styleClass="aon-margin-right aon-italic" />
			<aon:outputText	value="#{reservation.to.roomCount}" styleClass="aon-bold" />
		</aon:div>
		<aon:div>
			<aon:outputLabel value="#{pmsBundle.pms_pax_count}:" styleClass="aon-margin-right aon-italic" />
			<aon:outputText	value="#{reservation.to.personCount}" styleClass="aon-bold" />
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="Seller_id" value="#{pmsBundle.pms_seller}" />
	<aon:outputText value="#{reservation.to.seller.registry.fullName}" styleClass="aon-bold" 
		rendered="#{!reservation.active or !aonRole.saleOperator}"  />
	<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml">
		<ui:param name="lookupTo" value="#{reservation.to.seller}" />
		<ui:param name="lookupRendered" value="#{reservation.active and aonRole.saleOperator}" />
		<ui:param name="skipLabel" value="#{true}" />
		<ui:param name="skipNewButton" value="#{!reservation.active or !aonRole.saleOperator}" />
		<ui:param name="skipGoToButton" value="#{!aonRole.saleOperator}" />
	</ui:include>

	<aon:outputLabel for="ProjectReservation_roomItem" value="#{pmsBundle.pms_room_type}" 
		rendered="#{reservation.new}" />
	<aon:selectOneMenu id="ProjectReservation_roomItem" value="#{reservation.roomItem}" 
		rendered="#{reservation.new}" required="true">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{reservation.hotelRoomItems}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_roomTariff" value="#{productBundle.product_tariff}" 
		rendered="#{reservation.new}" />
	<aon:selectOneMenu id="ProjectReservation_roomTariff" value="#{reservation.roomTariff}" 
		rendered="#{reservation.new}" required="true">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{pmsCollections.tariffs}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_comments" value="#{bundle.aon_remark} #{pmsBundle.pms_hotel}" />
	<aon:inputTextarea id="ProjectReservation_comments" value="#{reservation.to.comments}"
		cols="80" rows="5" />

	<aon:outputLabel for="ProjectReservation_remarks" value="#{bundle.aon_remark} #{pmsBundle.pms_reservation}" />
	<aon:inputTextarea id="ProjectReservation_remarks" value="#{reservation.to.remarks}"
		cols="80" rows="5" disabled="#{!aonRole.admin}" />

</ui:composition>
