<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:outputLabel for="ProjectReservation_hotel_id" value="#{bundle.aon_module_hotel}" />
	<aon:div rendered="#{!reservation.nevv}">
		<aon:outputText	value="#{reservation.to.hotel.workPlace.description}" styleClass="aon-bold" />
		<aon:outputText value="#{bundle.pms_reservation_divert_requested}" 
			styleClass="aon-bold aon-label-error aon-margin-left" rendered="#{reservation.reservationPermission.pendingDivertVisible}" />
		<aon:div style="display: inline;"
			rendered="#{reservation.reservationPermission.divertInfoVisible}" >
			<aon:outputText	value="&#160;" styleClass="aon-margin-left aon-icon-commandButton aon-icon-info" />
			<rich:toolTip showEvent="onclick" hideEvent="onmouseout" direction="auto">
				<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-70, aon-noborder aon-bold aon-text-left">
					<aon:outputText	value="#{bundle.aon_source}:" styleClass="aon-margin-left" />
					<aon:outputText	value="#{reservation.to.hotelReservation.workPlace.description}" />
				</aon:panelGrid>
			</rich:toolTip>
		</aon:div>
	</aon:div>
	<aon:selectOneMenu id="ProjectReservation_hotel_id" value="#{reservation.to.hotel}" 
		rendered="#{reservation.nevv}" required="true"
		valueChangeListener="#{reservation.onHotelChanged}"
		reRender="ProjectReservation_roomItem,ProjectReservation_roomTariff">
		<f:selectItems value="#{pmsCollections.currentUserHotels}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_status" value="#{bundle.aon_status}"
		rendered="#{!reservation.nevv}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130, aon-width-auto" rendered="#{!reservation.nevv}">
		<aon:div>
			<aon:outputText id="ProjectReservation_status" value="#{reservation.to.status}" 
				styleClass="aon-bold" />
			<aon:commandButton id="block" value="&#160;"
				styleClass="aon-icon-commandButton aon-icon-lock aon-margin-left"
				title="#{bundle.pms_to_block}" immediate="true" 
				actionListener="#{reservation.onBlock}"
				rendered="#{reservation.reservationPermission.blockAllowed}" />
			<aon:commandButton id="unblock" value="&#160;"
				styleClass="aon-icon-commandButton aon-icon-unlock aon-margin-left"
				title="#{bundle.pms_to_unblock}" immediate="true" 
				actionListener="#{reservation.onUnblock}"
				rendered="#{reservation.reservationPermission.unBlockAllowed}" />
		</aon:div>
		<aon:div>
			<aon:outputText value="#{reservation.to.checkStatus}" 
				styleClass="aon-bold aon-label-info" rendered="#{reservation.reservationPermission.checkStatusVisible}" />
			<aon:commandButton id="undo-CheckStatus" value="&#160;"
				styleClass="aon-icon-commandButton aon-icon-sincronize aon-margin-left"
				title="#{bundle.aon_undo}" immediate="true" 
				actionListener="#{reservation.onUndoCheckStatus}"
				rendered="#{reservation.reservationPermission.undoCheckStatusAllowed}">
				<f:setPropertyActionListener target="#{reservation.showConfirmWindow}"
					value="#{reservation.to.noShow}" />
				<f:setPropertyActionListener target="#{reservation.confirmNoShow}"
					value="#{false}" />
			</aon:commandButton>
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="ProjectReservation_guest" value="#{bundle.report_guest}" />
	<aon:outputText	id="ProjectReservation_guest" value="#{reservation.to.guestFullName}" 
		styleClass="aon-bold" rendered="#{!reservation.nevv}" />
	<aon:div rendered="#{reservation.nevv}">
		<aon:outputLabel for="ProjectReservation_guestName" value="#{bundle.aon_name}"
			styleClass="aon-margin-left aon-margin-right aon-italic" />
		<aon:inputText id="ProjectReservation_guestName" value="#{reservation.guestName}" 
			size="30" maxlength="64" required="true" />
		<aon:outputLabel for="ProjectReservation_guestSurname" value="#{bundle.aon_surname}"
			styleClass="aon-margin-left aon-margin-right aon-italic" />
		<aon:inputText id="ProjectReservation_guestSurname" value="#{reservation.guestSurname}" 
			size="30" maxlength="64" required="true" />
	</aon:div>

	<aon:outputLabel for="ProjectReservation_creationDate" value="#{bundle.registry_rd_creation_date}"
		rendered="#{!reservation.nevv}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130, aon-width-auto" rendered="#{!reservation.nevv}">
		<aon:outputText id="ProjectReservation_creationDate" value="#{reservation.to.creationDate}"
			styleClass="aon-bold">
			<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<aon:div rendered="#{!reservation.reservationPermission.cancellationDateVisible}">
			<aon:outputLabel for="ProjectReservation_modificationDate" value="#{bundle.aon_modification_date}:"
				styleClass="aon-margin-right aon-italic" rendered="#{reservation.reservationPermission.modificationDateVisible}" />
			<aon:outputText id="ProjectReservation_modificationDate" value="#{reservation.to.modificationDate}" 
				styleClass="aon-bold" rendered="#{reservation.reservationPermission.modificationDateVisible}">
				<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:div>
		<aon:div rendered="#{reservation.reservationPermission.cancellationDateVisible}">
			<aon:outputLabel for="ProjectReservation_cancellationDate" value="#{bundle.aon_cancellation_date}:"
				styleClass="aon-margin-right aon-italic" rendered="#{reservation.reservationPermission.cancellationDateVisible}" />
			<aon:outputText id="ProjectReservation_cancellationDate" value="#{reservation.to.cancellationDate}" 
				styleClass="aon-bold" rendered="#{reservation.reservationPermission.cancellationDateVisible}">
				<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="ProjectReservation_project_id" value="#{bundle.report_id}"
		rendered="#{!reservation.nevv}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130,aon-width-auto" rendered="#{!reservation.nevv}">
		<aon:outputText	id="ProjectReservation_project_id" value="#{reservation.to.id}" 
			styleClass="aon-bold" />
		<aon:div>
			<aon:outputLabel for="ProjectReservation_crsCode" value="#{bundle.pms_crs}:"
				styleClass="aon-margin-right aon-italic" rendered="#{reservation.reservationPermission.crsCodeVisible}" />
			<aon:div rendered="#{reservation.reservationPermission.crsCodeVisible}" style="display:inline;">
				<aon:outputText id="ProjectReservation_crsCode" value="#{reservation.to.crsCode}" 
					styleClass="aon-bold" style="#{(reservation.to.sourceRequest) ? 'color:red' : ''}" />
			</aon:div>
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="ProjectReservation_code" value="#{bundle.report_reservation_code}" />
	<aon:div>
		<aon:outputText	value="#{reservation.to.code}" styleClass="aon-bold"
			rendered="#{!reservation.nevv and !reservation.reservationPermission.reservationCodeEditable}" />
		<aon:inputText id="ProjectReservation_code" value="#{reservation.to.code}"
			size="30" maxlength="32" required="true"
			rendered="#{reservation.nevv or reservation.reservationPermission.reservationCodeEditable}" />
		<aon:div style="display:inline; cursor:pointer;" styleClass="aon-margin-left"
			rendered="#{reservation.multipleReservationSize > 0}">
			<aon:outputText value="&#160;" styleClass="aon-icon-list-warn"
				style="padding-left:12px" />
			<rich:toolTip showEvent="onclick" hideEvent="onmouseout" hideDelay="#{reservation.multipleReservationSize * 1000}">
				<aon:outputText value="#{bundle.aon_reservation_multiple}"
					styleClass="aon-uppercase" />
				<a4j:repeat value="#{reservation.multipleReservation}" var="multipleReservationId">
					<aon:panelGrid columns="2" dir="true"
						columnClasses="aon-panelGrid-even aon-noborder aon-bold, 
							aon-panelGrid-even aon-noborder aon-bold">

						<aon:outputText value="#{multipleReservationId}" />
						<aon:commandLink id="multipleReservation-link" immediate="true"
							styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
							value="&#160;" title="#{bundle.aon_go}"
							actionListener="#{reservation.onLoadMultipleReservation}">
							<f:param name="multipleReservation" value="#{multipleReservationId}"/>
						</aon:commandLink>

					</aon:panelGrid>
				</a4j:repeat>
			</rich:toolTip>
		</aon:div>
	</aon:div>

	<aon:outputLabel for="ProjectReservation_startDate" value="#{bundle.report_checkin}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130, aon-width-auto">
		<aon:outputText	value="#{reservation.to.startDate}" styleClass="aon-bold"
			rendered="#{!reservation.nevv and !reservation.reservationPermission.reservationDatesEditable}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<aon:selectInputDate id="ProjectReservation_startDate" value="#{reservation.to.startDate}" 
			required="true" rendered="#{reservation.nevv or reservation.reservationPermission.reservationDatesEditable}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
			<a4j:support ajaxSingle="true" event="oninputchange"
				actionListener="#{reservation.onStartDateChanged}"
				reRender="ProjectReservation_nights,ProjectReservation_endDate"
				focus="ProjectReservation_nights" />
			<a4j:support ajaxSingle="true" event="onchanged"
				actionListener="#{reservation.onStartDateChanged}"
				reRender="ProjectReservation_nights,ProjectReservation_endDate"
				focus="ProjectReservation_nights" />
		</aon:selectInputDate>
		<aon:div>
			<aon:outputLabel for="ProjectReservation_nights" value="#{bundle.pms_nights}:" 
				styleClass="aon-margin-right aon-italic" />
			<aon:outputText value="#{reservation.nights}" styleClass="aon-bold" 
				rendered="#{!reservation.nevv and !reservation.reservationPermission.reservationDatesEditable}" />
			<aon:inputText id="ProjectReservation_nights" value="#{reservation.nights}"
				size="1" maxlength="3"
				rendered="#{reservation.nevv or reservation.reservationPermission.reservationDatesEditable}"
				valueChangeListener="#{reservation.onNightsChanged}"
				reRender="ProjectReservation_endDate"
				focus="ProjectReservation_bookingHolder">
				<f:validateDoubleRange minimum="1" />
			</aon:inputText>
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="ProjectReservation_startTime" value="#{bundle.pms_checkIn_hour}"
		rendered="#{!reservation.nevv}" />
	<aon:selectOneMenu id="ProjectReservation_startTime" value="#{reservation.startTime}"
		rendered="#{!reservation.nevv}">
		<f:selectItems value="#{reservation.reservationTimes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_endDate" value="#{bundle.report_checkout}" />
	<aon:panelGrid columns="2" columnClasses="aon-width-130, aon-width-auto">
		<aon:outputText	value="#{reservation.to.endDate}" styleClass="aon-bold"
			rendered="#{!reservation.nevv and !reservation.reservationPermission.reservationDatesEditable}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
		<aon:selectInputDate id="ProjectReservation_endDate" value="#{reservation.to.endDate}" 
			required="true" rendered="#{reservation.nevv or reservation.reservationPermission.reservationDatesEditable}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
			<a4j:support ajaxSingle="true" event="oninputchange"
				actionListener="#{reservation.onEndDateChanged}"
				reRender="ProjectReservation_nights,ProjectReservation_endDate"
				focus="ProjectReservation_bookingHolder" />
			<a4j:support ajaxSingle="true" event="onchanged"
				actionListener="#{reservation.onEndDateChanged}"
				reRender="ProjectReservation_nights,ProjectReservation_endDate"
				focus="ProjectReservation_bookingHolder" />
		</aon:selectInputDate>
		<aon:div rendered="#{!reservation.nevv and reservation.to.earlyCheckOut}">
			<aon:outputText value="#{bundle.pms_early_check_out}" styleClass="aon-label-error" />
			<aon:outputText value="#{reservation.to.earlyCheckOutDate}" styleClass="aon-label-error aon-margin-left">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="ProjectReservation_endTime" value="#{bundle.pms_checkOut_hour}" 
		rendered="#{!reservation.nevv}" />
	<aon:selectOneMenu id="ProjectReservation_endTime" value="#{reservation.endTime}"
		rendered="#{!reservation.nevv}">
		<f:selectItems value="#{reservation.reservationTimes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_bookingHolder" value="#{bundle.pms_reservation_holder}" />
	<aon:panelGrid columns="3" columnClasses="aon-width-130, aon-width-130, aon-width-auto">
		<aon:div>
			<aon:outputText value="#{reservation.to.bookingHolder}" styleClass="aon-bold" 
				rendered="#{!reservation.nevv and !reservation.reservationPermission.bookingHolderEditable}" />
			<aon:selectOneMenu id="ProjectReservation_bookingHolder" value="#{reservation.to.bookingHolder}" 
				required="true" rendered="#{reservation.nevv or reservation.reservationPermission.bookingHolderEditable}"
				valueChangeListener="#{reservation.onHolderChanged}"
				reRender="BookingHolderLabelDiv,BookingHolderValueDiv,AdvanceDiv,ProjectReservation_roomTariff">
				<f:selectItems value="#{pmsCollections.bookingHolders}" />
			</aon:selectOneMenu>
		</aon:div>
		<aon:div rendered="#{!reservation.nevv}">
			<aon:outputLabel value="#{bundle.pms_room_count}:" styleClass="aon-margin-right aon-italic" />
			<aon:outputText	value="#{reservation.to.roomCount}" styleClass="aon-bold" />
		</aon:div>
		<aon:div rendered="#{!reservation.nevv}">
			<aon:outputLabel value="#{bundle.pms_pax_count}:" styleClass="aon-margin-right aon-italic" />
			<aon:outputText	value="#{reservation.to.personCount}" styleClass="aon-bold" />
		</aon:div>
	</aon:panelGrid>

	<aon:div id="BookingHolderLabelDiv">
		<aon:outputLabel for="ProjectReservation_agency" value="#{bundle.report_agency}"
			 rendered="#{reservation.reservationPermission.agencyVisible}" />
		<aon:outputLabel for="ProjectReservation_company" value="#{bundle.aon_company}"
			rendered="#{reservation.reservationPermission.companyVisible}" />
	</aon:div>

	<aon:div id="BookingHolderValueDiv">
		<aon:outputText value="#{reservation.to.agency.registry.fullName}" styleClass="aon-bold" 
			rendered="#{reservation.reservationPermission.agencyVisible and !reservation.nevv and !reservation.reservationPermission.agencyEditable}" />
		<aon:selectOneMenu id="ProjectReservation_agency" 
			value="#{reservation.to.agency}" styleClass="aon-width-350" required="#{reservation.to.agencyHolder}"
			rendered="#{reservation.reservationPermission.agencyVisible and (reservation.nevv or reservation.reservationPermission.agencyEditable)}"
			valueChangeListener="#{reservation.onAgencyChanged}"
			reRender="ProjectReservation_roomTariff">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{pmsCollections.agencies}" />
		</aon:selectOneMenu>
		<aon:outputText value="#{reservation.to.company.registry.fullName}" styleClass="aon-bold" 
			rendered="#{reservation.reservationPermission.companyVisible and !reservation.nevv and !reservation.reservationPermission.companyEditable}" />
		<aon:selectOneMenu id="ProjectReservation_company" 
			value="#{reservation.to.company}" styleClass="aon-width-350" required="#{reservation.to.companyHolder}"
			rendered="#{reservation.reservationPermission.companyVisible and (reservation.nevv or reservation.reservationPermission.companyEditable)}"
			valueChangeListener="#{reservation.onCompanyChanged}"
			reRender="ProjectReservation_roomTariff">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{pmsCollections.companies}" />
		</aon:selectOneMenu>
	</aon:div>

	<aon:outputLabel value="#{bundle.aon_amount} #{bundle.aon_total}" rendered="#{!reservation.nevv}" />
	<aon:panelGrid columns="3" columnClasses="aon-width-130, aon-width-130, aon-width-auto" rendered="#{!reservation.nevv}">
		<aon:div>
			<aon:outputText	value="#{reservation.to.total}"	styleClass="aon-bold">
				<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
			</aon:outputText>
			<aon:outputText	value="&#160;" styleClass="aon-margin-left aon-icon-commandButton aon-icon-info"/>
			<rich:toolTip showEvent="onclick" hideEvent="onmouseout" direction="auto">
				<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-120,aon-noborder aon-bold aon-text-right">
					<aon:outputLabel value="#{bundle.aon_taxable_base}:" />
					<aon:outputText	value="#{reservation.to.taxableBase}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>

					<aon:outputLabel value="#{bundle.aon_vat}:" />
					<aon:outputText	value="#{reservation.to.vatQuota}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>

					<aon:outputLabel value="#{bundle.pms_other_tax}:" />
					<aon:outputText	value="#{reservation.to.otherTaxQuota}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>

					<aon:outputLabel value="#{bundle.aon_total}:" />
					<aon:outputText	value="#{reservation.to.total}">
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>
				</aon:panelGrid>
			</rich:toolTip>
		</aon:div>
		<aon:div id="AdvanceDiv">
			<aon:outputLabel for="ProjectReservation_advance"
				value="#{bundle.finance_money_advance}:" 
				styleClass="aon-margin-right aon-italic" />
			<aon:outputText value="#{reservation.to.advancedAmount}"
				styleClass="aon-bold" 
				rendered="#{!reservation.reservationPermission.advanceEditable}">
				<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
			</aon:outputText>
			<aon:commandButton id="enable-Advance" value="&#160;"
				styleClass="aon-icon-commandButton aon-icon-plus-blue aon-margin-left"
				title="#{bundle.pms_advance_enabled}" immediate="true" 
				actionListener="#{reservation.onEnableAdvance}"
				rendered="#{reservation.reservationPermission.advanceEnable}" />
			<aon:inputText id="ProjectReservation_advance"
				value="#{reservation.to.advance}" size="6"
				rendered="#{reservation.reservationPermission.advanceEditable}" />
		</aon:div>
		<aon:div id="TouristTaxDiv" rendered="#{reservation.to.hotel.touristTax}">
			<aon:outputLabel for="ProjectReservation_touristTax"
				value="#{bundle.pms_tourist_tax}:" 
				styleClass="aon-margin-right aon-italic" />
			<aon:outputText value="#{reservation.to.touristTaxAmount}"
				styleClass="aon-bold" style="#{(reservation.to.touristTaxPending > 0) ? ('color:red;') : ('')}"
				rendered="#{reservation.to.touristTaxFree == null}">
				<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
			</aon:outputText>
			<aon:commandButton id="free-TouristTax" value="&#160;"
				styleClass="aon-icon-commandButton aon-icon-wrong aon-margin-left"
				title="#{bundle.pms_tourist_tax_free}" immediate="true" 
				actionListener="#{reservation.onTouristTaxFreeShow}"
				rendered="#{reservation.to.touristTaxFree == null and reservation.to.touristTaxPending == reservation.to.adultCount}">
				<f:setPropertyActionListener target="#{reservation.showTouristTaxFreeWindow}"
					value="#{true}" />
			</aon:commandButton>
			<aon:outputText value="#{bundle.aon_exempt}"
				styleClass="aon-bold"
				rendered="#{reservation.to.touristTaxFree != null}" />
			<aon:outputText	value="&#160;" styleClass="aon-margin-left aon-icon-commandButton aon-icon-info"
				rendered="#{reservation.to.touristTaxFree != null}" />
			<rich:toolTip showEvent="onclick" hideEvent="onmouseout" direction="auto" 
				rendered="#{reservation.to.touristTaxFree != null}">
				<aon:outputText	value="#{reservation.to.touristTaxFree}" />
			</rich:toolTip>
		</aon:div>
	</aon:panelGrid>

	<aon:outputLabel for="ProjectReservation_seller" 
		value="#{bundle.pms_seller}"
		rendered="#{!reservation.nevv or reservation.reservationPermission.sellerEditable}" />
	<aon:outputText value="#{reservation.to.seller.registry.fullName}" styleClass="aon-bold" 
		rendered="#{!reservation.nevv and !reservation.reservationPermission.sellerEditable}" />
	<aon:selectOneMenu id="ProjectReservation_seller" 
		value="#{reservation.to.seller}" styleClass="aon-width-350"
		rendered="#{reservation.reservationPermission.sellerEditable}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{pmsCollections.sellers}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_roomItem" value="#{bundle.pms_room_type}" 
		rendered="#{reservation.nevv}" />
	<aon:selectOneMenu id="ProjectReservation_roomItem" value="#{reservation.roomItem}" 
		rendered="#{reservation.nevv}" required="true">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{reservation.hotelRoomItems}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_roomTariff" value="#{bundle.report_tariff}" 
		rendered="#{reservation.nevv}" />
	<aon:selectOneMenu id="ProjectReservation_roomTariff" value="#{reservation.roomTariff}" 
		rendered="#{reservation.nevv}" required="true">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{pmsCollections.tariffs}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_comments" value="#{bundle.aon_remark} #{bundle.aon_module_hotel}" />
	<aon:inputTextarea id="ProjectReservation_comments" value="#{reservation.to.comments}"
		cols="80" rows="5" disabled="#{!reservation.nevv and !reservation.reservationPermission.commentsEditable}" />
