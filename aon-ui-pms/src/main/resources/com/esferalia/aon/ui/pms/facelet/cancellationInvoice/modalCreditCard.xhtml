<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showCreditCardWindow">
		<aon:if test="#{controller.showCreditCardWindow}">
			<rich:modalPanel id="creditCardModalPanel" minHeight="380" minWidth="480" 
				rendered="#{controller.showCreditCardWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_credit_card}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showCreditCardWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showCreditCardWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="creditCardForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="creditCardModalToolbar" styleClass="aon-toolbar">
									<aon:commandButton id="creditCard-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.finance_charge}"
										rendered="#{controller.showSale}"
										actionListener="#{controller.onChargeCreditCard}"
										reRender="aonContent"
										onclick="Richfaces.showModalPanel('waitProccess')"
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="creditCardModalPanel"
											event="onclick" operation="hide"/>																					
									</aon:commandButton>
									
									<aon:commandButton id="creditCard-back" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										reRender="showCreditCardWindow">
										<f:setPropertyActionListener
											target="#{controller.showCreditCardWindow}"
											value="#{false}" />

									</aon:commandButton>
								</aon:div>
								<aon:div id="creditCardModalContent" styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">

										<aon:outputLabel value="#{bundle.aon_holder}" />
										<aon:outputText value="#{controller.reservation.hrCreditCardHolder}" 
											styleClass="aon-bold" />

										<aon:outputLabel value="#{bundle.aon_credit_card_number}" />
										<aon:outputText value="#{controller.reservation.hrCreditCardNumber}" 
											styleClass="aon-bold" />

										<aon:outputLabel value="#{bundle.aon_expiration}" />
										<aon:div>
											<aon:outputText value="#{controller.reservation.hrCreditCardExpirationMonth}" 
												styleClass="aon-bold" />
											<aon:outputLabel value="/" styleClass="aon-bold aon-margin-left aon-margin-right" />
											<aon:outputText value="#{controller.reservation.hrCreditCardExpirationYear}" 
												styleClass="aon-bold" />
										</aon:div>

										<aon:outputLabel value="#{bundle.aon_credit_card_cvv}" />
										<aon:outputText value="#{controller.reservation.hrCreditCardCvv}" 
											styleClass="aon-bold" />

									</aon:panelGrid>

									<aon:panelGrid id="menuGrid2" columns="2" dir="true" styleClass="aon-width-all aon-margin-top"
										columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">

										<aon:outputLabel value="#{bundle.aon_module_hotel}" />
										<aon:outputText value="#{controller.reservation.hotelReservation.workPlace.description}" />

										<aon:outputLabel value="#{bundle.report_id}" />
										<aon:outputText value="#{controller.reservation.id}" />

										<aon:outputLabel value="#{bundle.report_reservation_code}" />
										<aon:outputText	value="#{controller.reservation.code}" />

										<aon:outputLabel value="#{bundle.report_checkin}" />
										<aon:outputText value="#{controller.reservation.startDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>

										<aon:outputLabel value="#{bundle.report_checkout}" />
										<aon:outputText value="#{controller.reservation.endDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>

										<aon:outputLabel value="#{bundle.report_guest}" />
										<aon:outputText value="#{controller.reservation.guestFullName}" />

										<aon:outputLabel value="#{bundle.report_agency}" />
										<aon:outputText	value="#{controller.reservation.agency.registry.fullName}" />

									</aon:panelGrid>
									
									<aon:if test="#{controller.showSale}">
										<aon:panelGrid id="menuGrid3" columns="2" dir="true" styleClass="aon-width-all aon-margin-top"
										columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">
											<aon:outputLabel for="preauthorization_amount"
												value="#{bundle.aon_amount}" />
											<aon:inputText id="preauthorization_amount" 
												value="#{controller.preauthorizationAmount}"
												required="true" size="5" maxlength="8"/>
										</aon:panelGrid>
									</aon:if>
									
									<aon:if test="#{controller.confirmPreauthorization}">
										<aon:panelGrid id="menuGrid3" columns="2" dir="true" styleClass="aon-width-all aon-margin-top"
											columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">
											<aon:outputLabel for="preauthorization_amount_label"
												value="#{bundle.aon_amount}" />
											<aon:outputLabel id="preauthorization_amount_label"
												value="#{controller.confirmPreauthorizationAmount}" />
										</aon:panelGrid>
									</aon:if>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
