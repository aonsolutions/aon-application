<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showFinanceBatchWindow">
		<c:if test="#{posFinanceBatch.showFinanceBatchWindow}">
			<rich:modalPanel id="financeBatchModalPanel" 
				minHeight="320" minWidth="800"  
				rendered="#{posFinanceBatch.showFinanceBatchWindow}"
				showWhenRendered="true" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{financeBundle.finance_fbatch_charge_module}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showFinanceBatchWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{posFinanceBatch.showFinanceBatchWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="financeBatchFrom">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="modal-accept"
										title="#{bundle.aon_key_accept_accelerator}" 
										value="#{bundle.aon_accept}"
										rendered="#{posFinanceBatch.financeBatch!=null}" 
										reRender="showFinanceBatchWindow, #{modalReRender}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_cancel}" >
										<rich:componentControl for="financeBatchModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{posFinanceBatch.showFinanceBatchWindow}"
											value="#{false}" />
										<aon:actionListener method="#{posFinanceBatch.onAcceptBatch}" />
									</aon:commandButton>	
									<aon:commandButton id="modal-back"
										title="#{bundle.aon_key_cancel_accelerator}"
										value="#{bundle.aon_back}" immediate="true"
										rendered="#{posFinanceBatch.financeBatchModel.rowCount > 0}"
										reRender="showFinanceBatchWindow"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}" >
										<rich:componentControl for="financeBatchModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{posFinanceBatch.showFinanceBatchWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="modal-list"
										title="#{bundle.aon_key_cancel_accelerator}"
										value="#{bundle.aon_back}" immediate="true"
										rendered="#{!(posFinanceBatch.financeBatchModel.rowCount > 0)}"
										reRender="showFinanceBatchWindow"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}" >
										<aon:actionListener method="#{posFinanceBatch.onCompleteBatch}" />
									</aon:commandButton>
									<aon:commandButton id="modal-reset"
										title="#{bundle.aon_key_reset_accelerator}"
										rendered="#{posFinanceBatch.financeBatch==null or posFinanceBatch.financeBatch.id!=null}"
										reRender="showFinanceBatchWindow"
										value="#{bundle.aon_reset}" 
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_reset}" >
										<aon:actionListener method="#{posFinanceBatch.onResetBatch}" />
									</aon:commandButton>
								</aon:div>
								
								<aon:div id="batchGrid" rendered="#{!(posFinanceBatch.financeBatchModel.rowCount > 0)}" >
								
									<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
										rendered="#{!(posFinanceBatch.financeBatchModel.rowCount > 0)}"
										columnClasses="aon-panelGrid-odd aon-width-150
											,aon-panelGrid-even aon-width-auto
											,aon-panelGrid-odd aon-width-150
											,aon-panelGrid-even aon-width-150">
					
										<aon:outputLabel for="FinanceBatch_id"
											value="#{bundle.aon_id}" />
										<aon:div> 
											<aon:inputText id="FinanceBatch_id" 
												value="#{posFinanceBatch.financeBatch.id}"
												disabled="true" size="10" />
					
											<c:if test="#{aonRole.confidentiality}">
												<aon:selectBooleanCheckbox id="FinanceBatch_securityLevel"
												    styleClass="aon-margin-left"
													value="#{posFinanceBatch.financeBatch.confidential}"
													rendered="#{posFinanceBatch.financeBatch.id==null}" />
												<aon:outputText styleClass="aon-italic aon-margin-right"
													value="#{bundle.aon_confidential}"
													rendered="#{posFinanceBatch.financeBatch.id==null}" />
											</c:if>
					
											<aon:outputText styleClass="aon-margin-left"
												value="#{posFinanceBatch.financeBatch.financeBatchStatus}" />
										</aon:div>
					
										<aon:outputLabel for="FinanceBatch_issueDate"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="FinanceBatch_issueDate" 
											value="#{posFinanceBatch.financeBatch.issueDate}" required="true"
											disabled="#{posFinanceBatch.financeBatch.id!=null}"
											direction="auto" size="10"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"/>
					
										<aon:outputLabel for="FinanceBatch_description"
											value="#{bundle.aon_description}" />
										<aon:inputText id="FinanceBatch_description"
											disabled="#{posFinanceBatch.financeBatch.id!=null}"
											value="#{posFinanceBatch.financeBatch.description}" required="true"
											size="40" maxlength="32" />
					
										<aon:outputLabel for="FinanceBatch_financeBatchType"
											value="#{financeBundle.finance_disk_type}" />
										<aon:selectOneMenu id="FinanceBatch_financeBatchType"
											value="#{posFinanceBatch.financeBatch.financeBatchType}"
											disabled="#{true}">
											<f:selectItems value="#{financeCollections.financeBatchPaymentTypes}" />
										</aon:selectOneMenu>
					
										<aon:outputLabel for="RegistryBank_Lookup_id"
											value="#{configBundle.config_bank}" />
										<aon:div>
											<aon:selectOneMenu id="RegistryBank_Lookup_id"
												disabled="#{posFinanceBatch.financeBatch.id!=null}"
												value="#{posFinanceBatch.financeBatch.registryBank}">
												<f:selectItem itemLabel="-" value="#{null}"  />
												<c:if test="#{posFinanceBatch.financeBatch.id==null}">
													<f:selectItems value="#{companyCollections.activeCompanyBanks}" />
												</c:if>
												<c:if test="#{posFinanceBatch.financeBatch.id!=null}">
													<f:selectItems value="#{companyCollections.allCompanyBanks}" />
												</c:if>
											</aon:selectOneMenu>
											
										</aon:div>
					
										<aon:outputLabel for="FinanceBatch_totalAmount"
											value="#{financeBundle.finance_total_amount}" />
										<aon:outputText id="FinanceBatch_totalAmount"
										 	styleClass="aon-bold"
											value="#{posFinanceBatch.financeBatch.financeBatchTotalAmount}"
											size="15">
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>
					
									</aon:panelGrid>
								</aon:div>
								
								<aon:div id="batchList" rendered="#{posFinanceBatch.financeBatchModel.rowCount > 0}" >
									<aon:dataTable id="financeBatchList" value="#{posFinanceBatch.financeBatchModel}"
										var="to" rows="5" rendered="#{posFinanceBatch.financeBatchModel.rowCount > 0}"
										columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
											aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
											aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn,
											aon-editDataTable-textColumn aon-width-40">
										<aon:rowSelector toggleOnClick="#{true}" actionListener="#{posFinanceBatch.onSelectBatch}" reRender="showFinanceBatchWindow"/>
										
										<aon:column alias="FinanceBatch.id"
											styleClass="aon-editDataTable-numberColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_id}" />
											</f:facet>
											<aon:outputText value="#{to.id}" />
										</aon:column>
										
										<aon:column alias="FinanceBatch.description"
											styleClass="aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_description}" />
											</f:facet>
											<aon:outputText value="#{to.description}" />
										</aon:column>
					
										<aon:column alias="FinanceBatch.issueDate"
											styleClass="aon-editDataTable-textColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_date}" />
											</f:facet>
											<aon:outputText value="#{to.issueDate}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>
										
										<aon:column styleClass="aon-editDataTable-numberColumn">
											<f:facet name="header">
												<aon:outputText value="#{financeBundle.finance_regs}" />
											</f:facet>
											<aon:outputText value="#{to.financeBatchTotalDetails}" >
												<f:convertNumber pattern="#{bundle.aon_integer_pattern}" />
											</aon:outputText>	
										</aon:column>
					
										<aon:column styleClass="aon-editDataTable-numberColumn">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_amount}" />
											</f:facet>
											<aon:outputText value="#{to.financeBatchTotalAmount}" >
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>	
										</aon:column>
										
									</aon:dataTable>
									<aon:dataScroller2 for="financeBatchList" showNote="true" />
								</aon:div>
									
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
