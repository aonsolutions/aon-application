<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="posForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_posShift_module}" />
				<ui:param name="controller" value="#{posShift}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:htmlCommandLink id="posShift_report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="posShift" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="posShiftInvoice-report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						rendered="#{controller.to.invoice!=null}"
						value="#{financeBundle.finance_invoice}"  
						title="#{bundle.aon_report}"
						action="#{report.onExecute}" 
						actionListener="#{controller.onPrintInvoice}" >
						<f:param name="reportKey" value="saleInvoice" />
					</aon:htmlCommandLink>
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area" id="posShiftPanel">

				<aon:panelGrid columns="2" styleClass="aon-width-400">
				
					<aon:outputLabel value="#{pmsBundle.pms_hotel}" />
					<aon:div>
						<aon:outputText rendered="#{!posShift.new}" 
							value="#{posShift.to.pos.workPlace.description}" />
						<aon:selectOneMenu rendered="#{posShift.new}"
							value="#{posShift.hotel}" >
							<f:selectItem itemLabel=" - " itemValue="#{null}" />
							<f:selectItems value="#{pmsCollections.currentUserHotels}" />
							<a4j:support event="onchange" reRender="posShiftPanel" ignoreDupResponses="true" />
							<a4j:support event="oninputchanged" reRender="posShiftPanel" ignoreDupResponses="true" />
						</aon:selectOneMenu>
					</aon:div>
				
					<aon:outputLabel for="PosShift_pos" value="#{pmsBundle.pms_pos}" />
					<aon:div>
						<aon:outputText rendered="#{!posShift.new}" 
							value="#{posShift.to.pos.name}" />
						<aon:selectOneMenu id="PosShift_pos"
							rendered="#{posShift.new}" 
							value="#{posShift.to.pos}" >
							<f:selectItems value="#{posShift.posList}" />
						</aon:selectOneMenu>
					</aon:div>
					
					<aon:outputLabel value="#{pmsBundle.pms_shift}" />
					<aon:selectOneMenu 
						value="#{posShift.to.shift}" >
						<f:selectItems value="#{pmsCollections.shifts}" />
					</aon:selectOneMenu>
				
					<aon:outputLabel 
						value="#{pmsBundle.pms_opening}" />
					<aon:selectInputDate  
						value="#{posShift.to.startTime}" size="20"
						inputSize="16" renderAsPopup="true" enableManualInput="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_timestamp2_pattern}">
					</aon:selectInputDate>
					
					<aon:outputLabel 
						value="#{pmsBundle.pms_closing}" />
					<aon:selectInputDate  
						value="#{posShift.to.endTime}" size="20"
						inputSize="16" renderAsPopup="true" enableManualInput="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_timestamp2_pattern}">
					</aon:selectInputDate>
					
					<aon:outputLabel for="PosShift_remarks"
						value="#{bundle.aon_remark}" />
					<aon:inputTextarea id="PosShift_remarks" cols="80" rows="3"
						value="#{posShift.to.remarks}" />
					
					<aon:outputLabel value="#{pmsBundle.pms_initial_amount}" />
					<aon:div>
						<aon:inputText value="#{posShift.to.initialAmount}" >
							<f:validateDoubleRange minimum="0.0" />
							<a4j:support event="onchange" reRender="posShiftPanel" ignoreDupResponses="true" ajaxSingle="true" />
							<a4j:support event="oninputchanged" reRender="posShiftPanel" ignoreDupResponses="true" ajaxSingle="true" />
						</aon:inputText>
						<aon:commandButton 
							reRender="showCalculatorWindow"
							styleClass="aon-editDataTable-button aon-icon-calc aon-margin-left"
							actionListener="#{posShift.onShowCalculatorWindow}" >
							<f:setPropertyActionListener target="#{posShift.calculator.showCalculatorWindow}"
								value="#{true}" />								
						</aon:commandButton>
					</aon:div>

					<aon:outputText rendered="#{posShift.totalCashAmount>0}"
						value="#{pmsBundle.pms_cash_payMethod_name}" />
					<aon:outputText rendered="#{posShift.totalCashAmount>0}"
						value="#{posShift.totalCashAmount}" >
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>
					
					<aon:outputLabel rendered="#{posShift.totalCashAmount > 0}"	
						value="#{pmsBundle.pms_bank_income}" />
					<aon:outputText rendered="#{posShift.totalCashAmount > 0}"
						value="#{posShift.totalCashAmount - posShift.to.initialAmount}" >
						<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
					</aon:outputText>
					
				</aon:panelGrid>
				
				<br />				
				
				<aon:div rendered="#{!posShift.new}">
					<aon:panelTabSet id="countTab">
						<aon:panelTab label="#{pmsBundle.pms_cash_count}">
							<ui:include src="/com/esferalia/aon/ui/pms/facelet/posShift/count_grid.xhtml">
								<ui:param name="controller" value="#{posShiftCount}" />
								<ui:param name="modalController" value="#{posShift}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</aon:div>
				
			</aon:div>
		</aon:form>
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/posShift/calculator/calculatorModal.xhtml" >
			<ui:param name="controller" value="#{posShift}" />								
			<ui:param name="modalReRender" value="posForm" />
		</ui:include>
		
	</ui:define>
</ui:composition>
