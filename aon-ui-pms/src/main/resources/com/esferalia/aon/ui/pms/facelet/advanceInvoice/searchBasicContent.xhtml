<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputText value="&#160;"/>
	<aon:div>
		<aon:selectBooleanCheckbox id="ProjectReservation_guestReservationSearch" 
			value="#{searchController.guestReservationSearch}" />
		<aon:outputLabel for="ProjectReservation_guestReservationSearch"
			value="#{bundle.pms_guest_reservation_search}"/>
	</aon:div>

	<aon:outputText value="&#160;"/>
	<aon:outputText value="&#160;"/>

	<aon:if test="#{pmsCollections.currentUserHotelsCount > 1}">
		<aon:outputLabel for="ProjectReservation_hotelReservation_id"
			value="#{bundle.aon_module_hotel}" />
		<aon:selectOneMenu id="ProjectReservation_hotelReservation_id"
			value="#{searchController.hotelReservation}">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{pmsCollections.currentUserHotels}" />
		</aon:selectOneMenu>
	</aon:if>

	<aon:outputLabel for="ProjectReservation_project_id" 
		value="#{bundle.report_id}" />
	<aon:inputText id="ProjectReservation_project_id"
		valueChangeListener="#{controller.addExpression}"
		size="20" />

	<aon:outputText value="#{bundle.report_checkin}" />
	<aon:div>
		<aon:outputLabel for="ProjectReservation_startDate-From"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
		<aon:selectInputDate id="ProjectReservation_startDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />
		<aon:outputLabel for="ProjectReservation_startDate-To"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
		<aon:selectInputDate id="ProjectReservation_startDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />
	</aon:div>

	<aon:outputText value="#{bundle.report_checkout}" />
	<aon:div>
		<aon:outputLabel for="ProjectReservation_endDate-From"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
		<aon:selectInputDate id="ProjectReservation_endDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />
		<aon:outputLabel for="ProjectReservation_endDate-To"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
		<aon:selectInputDate id="ProjectReservation_endDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}" />
	</aon:div>

	<aon:outputLabel for="ProjectReservation_agency"
		value="#{bundle.report_agency}" />
	<aon:selectOneMenu id="ProjectReservation_agency" 
		value="#{searchController.agency}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{pmsCollections.agencies}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_tariff"
		value="#{bundle.report_tariff}"/>
	<aon:selectOneMenu id="ProjectReservation_tariff" 
		value="#{searchController.tariff}">
		<f:selectItem itemLabel=" - " itemValue="#{null}" />
		<f:selectItems value="#{pmsCollections.tariffs}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="ProjectReservation_prepay" 
		value="#{bundle.pms_prepay}" />
	<aon:selectOneRadio id="ProjectReservation_prepay"
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
		<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
	</aon:selectOneRadio>				

</ui:composition>
