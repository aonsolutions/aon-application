<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="agencyBookingSearch">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.pms_agency_booking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_search}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="#{toolbarID}-clear"
						styleClass="aon-finding-toolbar-item aon-icon-rubber"
						value="#{bundle.aon_clear}"
						actionListener="#{agencyBooking.onInit}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>	

					<aon:panelGrid columns="2" styleClass="aon-width-all"
						columnClasses="aon-panelGrid-odd aon-width-50, 
						aon-panelGrid-even aon-width-auto">

						<aon:outputLabel for="AgencyBooking_hotels"
							value="#{bundle.aon_module_hotel}" />
						<aon:panelGrid columns="5"
							columnClasses="aon-panelGrid-even aon-width-200,aon-panelGrid-odd aon-width-50,
								aon-panelGrid-even aon-width-200,aon-panelGrid-odd aon-width-50,aon-panelGrid-even aon-width-200">

							<aon:selectManyListbox id="AgencyBooking_hotels"
								style="width:250px;"
								value="#{agencyBooking.hotels}" size="10"
								required="true">
								<f:selectItems value="#{pmsCollections.currentUserHotels}" />
							</aon:selectManyListbox>
							<aon:outputLabel for="AgencyBooking_agencies" 
								value="#{bundle.report_agency}" />
							<aon:selectManyListbox id="AgencyBooking_agencies"
								style="width:250px;"
								value="#{agencyBooking.agencies}" size="10">
								<f:selectItems value="#{pmsCollections.agencies}" />
							</aon:selectManyListbox>
							<c:if test="#{pmsCollections.agencyGroupsCount > 0}">
								<aon:outputLabel for="AgencyBooking_agencyGroups" 
									value="#{bundle.aon_group}" />
								<aon:selectManyListbox id="AgencyBooking_agencyGroups"
									style="width:250px;"
									value="#{agencyBooking.agencyGroups}" size="10">
									<f:selectItems value="#{pmsCollections.agencyGroups}" />
								</aon:selectManyListbox>
							</c:if>

						</aon:panelGrid>

						<aon:outputText value="#{bundle.aon_date}" />
						<aon:div>
							<aon:outputLabel for="AgencyBooking_startDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate id="AgencyBooking_startDate"
								value="#{agencyBooking.fromDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>

							<aon:outputLabel for="AgencyBooking_endDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate id="AgencyBooking_endDate"
								value="#{agencyBooking.toDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
						</aon:div>

						<aon:outputText value="#{bundle.aon_creation}" />
						<aon:div id="AgencyBookingReservationDatesDiv">
							<aon:outputLabel for="AgencyBooking_reservationFromDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate id="AgencyBooking_reservationFromDate"
								value="#{agencyBooking.reservationFromDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />

							<aon:outputLabel for="AgencyBooking_reservationToDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate id="AgencyBooking_reservationToDate"
								value="#{agencyBooking.reservationToDate}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}" />
						</aon:div>

						<aon:outputText value="&#160;"/>
						<aon:div>
							<aon:selectBooleanCheckbox id="AgencyBooking_groupAgencies" 
								value="#{agencyBooking.groupAgencies}" />
							<aon:outputLabel for="AgencyBooking_groupAgencies"
								value="#{bundle.pms_group_agencies}"/>
						</aon:div>

						<aon:outputText value="&#160;" />
						<aon:commandButton id="search" ignoreDupResponses="true"
							value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
							action="agencyBooking_list"
							actionListener="#{agencyBooking.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />

					</aon:panelGrid>

				</aon:div>
			</aon:div>
			
		</aon:form>
		
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />

	</ui:define>
</ui:composition>
