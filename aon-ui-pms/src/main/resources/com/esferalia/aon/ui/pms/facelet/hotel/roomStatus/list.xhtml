<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="roomStatusList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_roomStatus_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_list}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="search" ignoreDupResponses="true"
						styleClass="aon-finding-toolbar-item aon-icon-search" 
						value="#{bundle.aon_search}" 
						action="roomStatus_search"
						actionListener="#{roomStatus.onInit}"
						accesskey="#{bundle.aon_key_search}" />
					<aon:htmlCommandLink id="roomStatus-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="roomStatusList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="roomStatus_report"
						styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
						value="#{bundle.aon_listing}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="roomStatusList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>	
					<!--  
					-->
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:dataTable id="roomStatusData" value="#{roomStatus.model}" 
					rendered="#{roomStatus.model!=null and roomStatus.model.rowCount > 0}" rows="20" var="to">
 
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{pmsBundle.pms_room}" />
							</f:facet>
							<aon:outputText value="#{to.room}" />
						</aon:column>
 
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
				</aon:dataTable>
				<aon:dataScroller2 for="roomStatusData" showNote="true" />
				
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
