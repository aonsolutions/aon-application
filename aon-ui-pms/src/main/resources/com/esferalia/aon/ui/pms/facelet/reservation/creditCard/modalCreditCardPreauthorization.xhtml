<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showCreditCardPreauthorizationWindow">
		<aon:if test="#{controller.showCreditCardPreauthorizationWindow}">
			<rich:modalPanel id="creditCardPreauthorizationModalPanel" minHeight="240" minWidth="580" 
				rendered="#{controller.showCreditCardPreauthorizationWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.pms_preauthorize_card}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showCreditCardPreauthorizationWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showCreditCardPreauthorizationWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="creditCardPreauthorizationForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="creditCardPreauthorizationModalToolbar" styleClass="aon-toolbar">
									<aon:if test="#{!controller.cardOperationTo.operationOk}">
										<aon:commandButton id="creditCardPreauthorization-accept"
											styleClass="aon-finding-toolbar-item aon-icon-accept"
											value="#{bundle.pms_preauthorize}"
											actionListener="#{controller.onCreditCardPreauthorization}"
											reRender="aonContent"
											onclick="Richfaces.showModalPanel('waitProccess')"
											oncomplete="Richfaces.hideModalPanel('waitProccess')" />
									</aon:if>
									<aon:if test="#{controller.cardOperationTo.operationOk}">
										<aon:commandButton id="creditCardPreauthorization-cancelOp"
											styleClass="aon-finding-toolbar-item aon-icon-black-list"
											value="#{bundle.aon_cancel}"
											actionListener="#{controller.onCreditCardCancelPreauthorization}"
											reRender="aonContent"
											onclick="Richfaces.showModalPanel('waitProccess')"
											oncomplete="Richfaces.hideModalPanel('waitProccess')">
											<rich:componentControl for="creditCardPreauthorizationModalPanel"
												event="onclick" operation="hide"/>						
										</aon:commandButton>
									</aon:if>
									<aon:commandButton id="creditCardPreauthorization-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										reRender="showCreditCardPreauthorizationWindow">
										<f:setPropertyActionListener
											target="#{controller.showCreditCardPreauthorizationWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div id="creditCardPreauthorizationModalContent" styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">

										<aon:outputLabel for="Preauthorization_cardNumber"
											value="#{bundle.aon_credit_card_number}" />
										<aon:outputText id="Preauthorization_cardNumber"
											value="#{controller.cardOperationTo.cardNumber}"
											styleClass="aon-bold" />

										<aon:if test="#{!controller.cardOperationTo.operationOk}">
											<aon:outputLabel for="Preauthorization_operationAmount"
												value="#{bundle.aon_amount}" />
											<aon:inputText id="Preauthorization_operationAmount" 
												value="#{controller.cardOperationTo.operationAmount}"
												required="true" size="5" maxlength="8"/>
										</aon:if>
										<aon:if test="#{controller.cardOperationTo.operationOk}">
											<aon:outputLabel for="Preauthorization_operationDate"
												value="#{bundle.aon_date} #{bundle.pms_preauthorization}" />
											<aon:outputText id="Preauthorization_operationDate"
												value="#{controller.cardOperationTo.operationDate}"
												styleClass="aon-bold">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>

											<aon:outputLabel for="Preauthorization_operationAmount"
												value="#{bundle.aon_amount}" />
											<aon:outputText id="Preauthorization_operationAmount"
												value="#{controller.cardOperationTo.operationAmount}"
												styleClass="aon-bold">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>
										</aon:if>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
