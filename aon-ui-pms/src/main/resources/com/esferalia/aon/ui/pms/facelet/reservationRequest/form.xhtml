<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="reservationRequestForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_reservation_request_module}" />
				<ui:param name="controller" value="#{reservationRequest}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" 	
					columnClasses="aon-panelGrid-odd aon-width-150,	aon-panelGrid-even aon-width-500">
					<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservationRequest/formContent.xhtml" />
				</aon:panelGrid>

				<c:if test="#{!reservationRequest.new}">
					<aon:panelTabSet id="reservationRequestTab" selectedTab="#{reservationRequest.selectedTab}">
						<aon:panelTab id="room" label="#{pmsBundle.pms_rooms}">
							<ui:include	src="/com/esferalia/aon/ui/pms/facelet/reservationRequest/room/tab_grid.xhtml">
								<ui:param name="controller" value="#{reservationRequestRoom}" />
							</ui:include>
						</aon:panelTab>
	
						<aon:panelTab id="guest" label="#{pmsBundle.pms_guest}">
							<ui:include	src="/com/esferalia/aon/ui/pms/facelet/reservationRequest/guest/tab_grid.xhtml">
								<ui:param name="controller" value="#{reservationRequestGuest}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
