<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="reservationRequestForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.pms_reservation_request_module}" />
				<ui:param name="controller" value="#{reservationRequest}" />
				<ui:param name="skipRemoveButton" value="#{!reservationRequest.to.active}" />
				<ui:define name="beforeSpinToolbarContent">				
					<aon:commandButton id="audit-info"
						styleClass="aon-finding-toolbar-item aon-icon-audit"
						value="#{bundle.aon_audit}"
						rendered="#{!reservationRequest.new}"
						reRender="showAuditInfoWindow">
						<f:setPropertyActionListener target="#{reservationRequest.showAuditInfoWindow}"
							value="#{true}" />							
					</aon:commandButton>	
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<c:if test="#{reservationRequest.new}">
					<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservationRequest/formNewContent.xhtml" />
				</c:if>

				<c:if test="#{!reservationRequest.new}">
					<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservationRequest/formContent.xhtml" />

					<aon:panelTabSet id="reservationRequestTab" selectedTab="#{reservationRequest.selectedTab}">
						<aon:panelTab id="room" label="#{bundle.report_rooms}">
							<ui:include	src="/com/esferalia/aon/ui/pms/facelet/reservationRequest/room/tab_grid.xhtml">
								<ui:param name="controller" value="#{reservationRequestRoom}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservationRequest/modalConfirm.xhtml">
			<ui:param name="controller" value="#{reservationRequest}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{reservationRequest}" />
		</ui:include>
		
	</ui:define>
</ui:composition>
