<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<c:if test="#{controller.assetModel==null or controller.assetModel.rowCount le 0 }" >
		<aon:div styleClass="aon-note" > 
			<aon:div styleClass="aon-note-internal" > 
				<aon:outputText  
					value="#{bundle.aon_search_no_results}" />
			</aon:div>
		</aon:div>
	</c:if>

	<c:if test="#{controller.assetModel!=null and controller.assetModel.rowCount gt 0 }" >
		<rich:dataTable id="assetActivityCalendar" value="#{controller.assetModel}" var="to">
			<f:facet name="header" >
				<rich:columnGroup>
					<rich:column>
						<aon:outputText value="&#160;" />
					</rich:column>
					
					<rich:columns value="#{controller.viewerDays}" var="days" index="idx"	>
						<aon:outputText styleClass="calendar-header" value="#{days.time}" >
							<f:convertDateTime pattern="#{assetBundle.aon_simple_date_pattern}" 
								timeZone="#{timeZoneController.timeZoneId}"  />
						</aon:outputText>
					</rich:columns>
				</rich:columnGroup>
			</f:facet>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<aon:outputText value="#{to.asset.name}" />
			</aon:column>
			
			<rich:columns styleClass="aon-editDataTable-textColumn no-padding" 
				value="#{controller.assetModel.rowData.assetDayModel.wrappedData}" var="day" index="idx"	>

				<aon:div styleClass="#{(day.activity.id!=null)?'reserved-cell':'available-cell'}">
<!--  
					<aon:outputText value="&#160;&#160;&#160;" />
					<a4j:support event="onclick" reRender="filter" >
					      	<f:setPropertyActionListener target="#{controller.selectedAssetActivity}"
							value="#{day.activity}" />	
						<aon:actionListener method="#{controller.onSelectActivity}" />
					</a4j:support>
-->
					
						<aon:commandLink 
							reRender="filter"
							actionListener="#{controller.onSelectActivity}"
							value="&#160;"
							style="padding-right: 5px;padding-left: 18px"
							styleClass="aon-bold aon-icon-alarm-pending" >
							
						</aon:commandLink>
						<!-- 
						<aon:commandLink action="reservationTable_form" 
							styleClass="aon-icon-home"
							value="&#160;" >
							<a4j:support event="onclick" reRender="filter" >
							      	<f:setPropertyActionListener target="#{controller.selectedAssetActivity}"
									value="#{day.activity}" />	
								<aon:actionListener method="#{controller.onSelectActivity}" />
							</a4j:support>
						</aon:commandLink>
						-->
												
					
					
					<!--  
					<c:if test="#{aonConfiguration.bean.alarm.showPending}">
						<aon:commandLink id="pendingAlarms"
							title="#{alarm.pendingAlarmTitle}"
							value="(#{alarm.pendingCount})"
							rendered="#{alarm.pendingCount &gt; 0}"
							action="alarm_list" actionListener="#{alarm.onInit}" 
							style="padding-right: 5px;padding-left: 18px"
							styleClass="aon-bold aon-icon-alarm-pending" />					
					</c:if>
					<aon:commandLink action="home" 
						actionListener="#{homeActionListener}" 
						title="#{bundle.aon_home}"
						styleClass="aon-icon-home"
						value="&#160;" />
					-->
					
					
				</aon:div>
			
			</rich:columns>
			
				<!--  
			<rich:columns styleClass="aon-editDataTable-textColumn no-padding" 
				value="#{controller.assetModel.rowData.assetDayModel.wrappedData}" var="day" index="idx"	>

				<c:forEach items="#{list.fractions}" var="fraction" >
					<aon:div styleClass="#{(fraction.reserved)?'reserved-cell':'available-cell'}">
						
						<aon:outputText value="&#160;&#160;&#160;" 
							styleClass="#{fraction.first?'aon-icon-info':'none'}" />
						<rich:toolTip followMouse="true" direction="top-right" showDelay="250" 
						 	rendered="#{fraction.first}" >
				            <span style="white-space:nowrap">
				                <aon:div>
				                	<aon:outputText value="#{list.asset.description}" />
				                </aon:div>
				            </span>
				            
				            <h:panelGrid columns="2" >
				                <aon:outputLabel value="#{assetBundle.asset_activity_who}" />
								<aon:outputText value="#{fraction.activity.holder}" />
					                
								<aon:outputLabel value="#{assetBundle.asset_activity_why}" />
								<aon:outputText value="#{fraction.activity.comments}" />
				            </h:panelGrid>
				        </rich:toolTip>
				       
				        <a4j:support event="onclick" reRender="filter" >
				        	<f:setPropertyActionListener target="#{controller.selectedAssetActivity}"
								value="#{fraction.activity}" />	
							<aon:actionListener method="#{controller.onSelectActivity}" />
							
						</a4j:support>
				        
					</aon:div>
				</c:forEach>
	
			</rich:columns>
				-->
			
		
		</rich:dataTable>
	</c:if>
	
</ui:composition>
