<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<c:if test="#{controller.assetModel==null or controller.assetModel.rowCount le 0 }" >
		<aon:div styleClass="aon-note" > 
			<aon:div styleClass="aon-note-internal" > 
				<aon:outputText  
					value="#{bundle.aon_search_no_results}" />
			</aon:div>
		</aon:div>
	</c:if>

	<c:if test="#{controller.assetModel!=null and controller.assetModel.rowCount gt 0 }" >
		<rich:dataTable id="assetActivityCalendar" value="#{controller.assetModel}" var="to">
			<f:facet name="header" >
				<rich:columnGroup>
					<rich:column>
						<aon:outputText value="&#160;" />
					</rich:column>
					
					<rich:columns value="#{controller.viewerDays}" var="days" index="idx"	>
						<aon:outputText styleClass="calendar-header" value="#{days.time}" >
							<f:convertDateTime pattern="#{assetBundle.aon_simple_date_pattern}" 
								timeZone="#{timeZoneController.timeZoneId}"  />
						</aon:outputText>
					</rich:columns>
				</rich:columnGroup>
			</f:facet>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<aon:outputText value="#{to.asset.name}" />
			</aon:column>
			
			<rich:columns styleClass="aon-editDataTable-textColumn no-padding" 
				value="#{controller.assetModel.rowData.assetDayModel.wrappedData}" var="day" index="idx"	>

				<aon:div styleClass="#{(day.activity!=null and day.activity.id!=null)?'reserved-cell':'available-cell'}">
					<aon:outputText value="&#160;" />
				</aon:div>
			
			</rich:columns>
			
		</rich:dataTable>
	</c:if>
	
</ui:composition>
