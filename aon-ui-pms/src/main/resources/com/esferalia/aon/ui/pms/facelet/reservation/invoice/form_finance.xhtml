<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="invoiceFinancesDiv" styleClass="aon-group" style="width: 100%; margin-top: 2em;">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{bundle.finance_payment_menu}"/>
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
				<aon:dataTable id="financeList"
					value="#{controller.reservationInvoiceTo.finances}" rowKeyVar="hotelInvoiceFinanceKey" var="hotelInvoiceFinance">

					<aon:column styleClass="aon-panelGrid-odd aon-width-100 aon-editDataTable-textColumn">
						<aon:outputLabel for="ProjectReservation_financePayMethod"
							value="#{bundle.finance_payMethod}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-180 aon-editDataTable-textColumn">
						<aon:div rendered="#{!payMethodEditable}">
							<aon:outputText value="#{hotelInvoiceFinance.payMethod.name}" styleClass="aon-bold"
								rendered="#{hotelInvoiceFinance.payMethod != null}" />
							<aon:outputText value="#{bundle.aon_undefined}" styleClass="aon-bold aon-label-error"
								rendered="#{hotelInvoiceFinance.payMethod == null}" />
						</aon:div>
						<aon:selectOneMenu id="ProjectReservation_financePayMethod"
							value="#{hotelInvoiceFinance.payMethod}"
							rendered="#{payMethodEditable}"
							ajaxSingle="true">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{configCollections.extendedDirectPayMethods}" />
						</aon:selectOneMenu>
					</aon:column>

					<aon:column styleClass="aon-panelGrid-odd aon-width-80 aon-editDataTable-textColumn">
						<aon:outputLabel for="ProjectReservation_financeAmount"
							value="#{bundle.aon_total_to_pay}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-auto aon-editDataTable-textColumn">
						<aon:outputText value="#{hotelInvoiceFinance.amount}" styleClass="aon-bold"
							rendered="#{!amountEditable}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:div rendered="#{amountEditable}">
							<aon:inputText id="ProjectReservation_financeAmount"
								value="#{hotelInvoiceFinance.amount}"
								required="true" size="5"
								reRender="invoiceFinancesDiv" ajaxSingle="true" />
							<aon:commandButton
								id="Finance-removeButton" title="#{bundle.aon_remove}"
								styleClass="aon-editDataTable-button aon-margin-left aon-vertical-align-middle aon-search-minus"
								rendered="#{hotelInvoiceFinance != controller.reservationInvoiceTo.firstFinance}"
								actionListener="#{controller.onRemoveFinance}"
								reRender="invoiceFinancesDiv">
								<f:param name="hotelInvoiceFinanceIndex" value="#{hotelInvoiceFinanceKey}"/>
							</aon:commandButton>
							<aon:commandButton
								id="Finance-newButton" title="#{bundle.aon_reset}"
								styleClass="aon-editDataTable-button aon-margin-left aon-vertical-align-middle aon-search-add"
								rendered="#{hotelInvoiceFinance == controller.reservationInvoiceTo.lastFinance}"
								actionListener="#{controller.onNewFinance}"
								reRender="invoiceFinancesDiv" />
						</aon:div>
					</aon:column>

				</aon:dataTable>

				<aon:panelGrid columns="3" styleClass="aon-margin-top aon-noborder"
					columnClasses="aon-width-120,aon-width-120,aon-width-auto">
					<aon:outputText value="&#160;" />
					<aon:outputText value="#{bundle.pms_total_finances}:" styleClass="aon-bold" />
					<aon:div>
						<aon:outputText value="#{controller.reservationInvoiceTo.financesAmount}" styleClass="aon-bold">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText value=" €" styleClass="aon-bold" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
		</aon:div>
	</aon:div>

</ui:composition>
