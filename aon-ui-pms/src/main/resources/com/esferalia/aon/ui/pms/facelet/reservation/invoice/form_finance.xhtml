<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="invoiceFinancesDiv" styleClass="aon-group" style="width: 100%; margin-top: 2em;">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{pmsBundle.pms_payments}"/>
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
				<aon:dataTable id="financeList"
					value="#{controller.reservationInvoiceTo.finances}" var="hotelInvoiceFinance">

					<aon:column styleClass="aon-panelGrid-odd aon-width-100 aon-editDataTable-textColumn">
						<aon:outputLabel for="ProjectReservation_financePayMethod"
							value="#{configBundle.config_pay_method}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-150 aon-editDataTable-textColumn">
						<aon:div rendered="#{!controller.reservationInvoiceTo.directCustomer}">
							<aon:outputText value="#{hotelInvoiceFinance.payMethod.name}" styleClass="aon-bold"
								rendered="#{hotelInvoiceFinance.payMethod != null}" />
							<aon:outputText value="#{bundle.aon_undefined}" styleClass="aon-bold aon-label-error"
								rendered="#{hotelInvoiceFinance.payMethod == null}" />
						</aon:div>
						<aon:selectOneMenu id="ProjectReservation_financePayMethod"
							value="#{hotelInvoiceFinance.payMethod}" required="true"
							rendered="#{controller.reservationInvoiceTo.directCustomer}">
							<f:selectItems value="#{configCollections.directPayMethods}" />
						</aon:selectOneMenu>
					</aon:column>

					<aon:column styleClass="aon-panelGrid-odd aon-width-80 aon-editDataTable-textColumn">
						<aon:outputLabel for="ProjectReservation_financeAmount"
							value="#{bundle.aon_amount}" />
					</aon:column>

					<aon:column styleClass="aon-panelGrid-even aon-width-auto aon-editDataTable-textColumn">
						<aon:outputText value="#{hotelInvoiceFinance.amount}" styleClass="aon-bold"
							rendered="#{!controller.reservationInvoiceTo.directCustomer}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:div rendered="#{controller.reservationInvoiceTo.directCustomer}">
							<aon:inputText id="ProjectReservation_financeAmount"
								value="#{hotelInvoiceFinance.amount}"
								required="true" size="5" />
							<aon:commandButton
								id="Finance-newButton" title="#{bundle.aon_reset}"
								styleClass="aon-editDataTable-button aon-margin-left aon-vertical-align-middle aon-icon-reset"
								rendered="#{hotelInvoiceFinance == controller.reservationInvoiceTo.lastFinance}"
								actionListener="#{controller.onNewFinance}"
								reRender="financeList" />
						</aon:div>
					</aon:column>

				</aon:dataTable>
			</aon:div>
		</aon:div>
	</aon:div>

</ui:composition>
