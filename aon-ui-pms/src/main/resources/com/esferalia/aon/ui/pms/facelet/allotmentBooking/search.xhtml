<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="allotmentBookingSearch">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.pms_allotment_booking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_search}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="#{toolbarID}-clear"
						styleClass="aon-finding-toolbar-item aon-icon-rubber"
						value="#{bundle.aon_clear}"
						actionListener="#{allotmentBooking.onInit}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>	

					<aon:panelGrid columns="2" styleClass="aon-width-all"
						columnClasses="aon-panelGrid-odd aon-width-50, 
						aon-panelGrid-even aon-width-auto">

						<aon:outputLabel for="AllotmentBooking_type"
							value="#{bundle.aon_type}" />
						<aon:selectOneRadio id="AllotmentBooking_type"
							value="#{allotmentBooking.reportType}"
							required="true"
							reRender="AllotmentBooking_entity">
							<f:selectItem itemLabel="#{bundle.pms_by_agency}" itemValue="0" />		
							<f:selectItem itemLabel="#{bundle.pms_by_allotment}" itemValue="1" />		
						</aon:selectOneRadio>

						<aon:outputLabel for="AllotmentBooking_hotels"
							value="#{bundle.aon_module_hotel}" />
						<aon:panelGrid id="AllotmentBooking_entity" columns="5"
							columnClasses="aon-panelGrid-even aon-width-200,aon-panelGrid-odd aon-width-50,
								aon-panelGrid-even aon-width-200,aon-panelGrid-odd aon-width-50,aon-panelGrid-even aon-width-200">

							<aon:selectManyListbox id="AllotmentBooking_hotels"
								style="width:250px;"
								value="#{allotmentBooking.hotels}" size="10"
								required="true">
								<f:selectItems value="#{pmsCollections.currentUserHotels}" />
							</aon:selectManyListbox>
							<aon:if test="#{allotmentBooking.agencyReportType}">
								<aon:outputLabel for="AllotmentBooking_agencies" 
									value="#{bundle.report_agency}" />
								<aon:selectManyListbox id="AllotmentBooking_agencies"
									style="width:250px;"
									value="#{allotmentBooking.agencies}" size="10">
									<f:selectItems value="#{pmsCollections.allotmentAgencies}" />
								</aon:selectManyListbox>
								<aon:if test="#{pmsCollections.allotmentAgencyGroupsCount > 0}">
									<aon:outputLabel for="AllotmentBooking_agencyGroups" 
										value="#{bundle.aon_group}" />
									<aon:selectManyListbox id="AllotmentBooking_agencyGroups"
										style="width:250px;"
										value="#{allotmentBooking.agencyGroups}" size="10">
										<f:selectItems value="#{pmsCollections.allotmentAgencyGroups}" />
									</aon:selectManyListbox>
								</aon:if>
							</aon:if>
							<aon:if test="#{allotmentBooking.rateCodeReportType}">
								<aon:outputLabel for="AllotmentBooking_allotment" 
									value="#{bundle.pms_allotment}" />
								<aon:selectManyListbox id="AllotmentBooking_allotment"
									style="width:250px;"
									value="#{allotmentBooking.rateCodes}" size="10">
									<f:selectItems value="#{pmsCollections.allotmentRateCodes}" />
								</aon:selectManyListbox>
							</aon:if>

						</aon:panelGrid>

						<aon:outputText value="#{bundle.aon_date}" />
						<aon:div>
							<aon:outputLabel for="AllotmentBooking_startDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_from}" />
							<aon:selectInputDate id="AllotmentBooking_startDate"
								value="#{allotmentBooking.fromDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>

							<aon:outputLabel for="AllotmentBooking_endDate"
								styleClass="aon-italic aon-margin-right" 
								value="#{bundle.aon_date_to}" />
							<aon:selectInputDate id="AllotmentBooking_endDate"
								value="#{allotmentBooking.toDate}" required="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
						</aon:div>

						<aon:outputLabel for="AllotmentBooking_breakdownType" 
							value="#{bundle.finance_tobreakdown}" />
						<aon:selectOneRadio id="AllotmentBooking_breakdownType" 
							value="#{allotmentBooking.breakdownType}">
							<f:selectItem itemLabel="#{bundle.report_rooms}" itemValue="0" />		
							<f:selectItem itemLabel="#{bundle.product_tariff_module2}" itemValue="1" />		
						</aon:selectOneRadio>

						<aon:outputText value="&#160;" />
						<aon:commandButton id="search" ignoreDupResponses="true"
							value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
							action="allotmentBooking_list"
							actionListener="#{allotmentBooking.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />

					</aon:panelGrid>

				</aon:div>
			</aon:div>
			
		</aon:form>
		
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />

	</ui:define>
</ui:composition>
