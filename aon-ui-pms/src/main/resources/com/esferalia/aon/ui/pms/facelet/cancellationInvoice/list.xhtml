<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="cancellationInvoiceList">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_cancellation_invoice_module}" />
				<ui:param name="controller" value="#{cancellationInvoice}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="cancellationInvoice-selectAll"
						value="#{bundle.aon_check_all}" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						actionListener="#{cancellationInvoice.checkAll}" />
					<aon:commandButton id="cancellationInvoice-selectNone"
						value="#{bundle.aon_uncheck_all}" immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						actionListener="#{cancellationInvoice.checkNone}" />
					<aon:commandButton id="cancellationInvoice-invoice"
						value="#{bundle.aon_key_invoice_description}"
						immediate="#{true}" rendered="#{cancellationInvoice.checkedCount > 0}"
						styleClass="aon-finding-toolbar-item aon-icon-favorite"
						actionListener="#{cancellationInvoice.onCancellationInvoiceShow}"
						reRender="showInvoiceWindow">
						<f:setPropertyActionListener target="#{cancellationInvoice.showInvoiceWindow}"
							value="#{true}" />
					</aon:commandButton>
					<aon:commandButton id="cancellationInvoice-noInvoice"
						value="#{bundle.pms_no_invoiceable}"
						immediate="true" rendered="#{cancellationInvoice.checkedCount > 0}"
						styleClass="aon-finding-toolbar-item aon-icon-exit"
						reRender="showConfirmWindow">
						<f:setPropertyActionListener target="#{cancellationInvoice.showConfirmWindow}"
							value="#{true}" />
					</aon:commandButton>
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{cancellationInvoice}" />
					<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
					<ui:param name="skipSelectButton" value="#{true}" />
					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText id="ProjectReservation_checkCount"
									value="#{controller.checkedCount}" />
							</f:facet>
							<aon:selectBooleanCheckbox id="ProjectReservation_check"
								value="#{controller.rowChecked}"
								valueChangeListener="#{controller.rowSelected}"
								reRender="ProjectReservation_check,ProjectReservation_checkCount,cancellationInvoiceToolbar" />	
						</aon:column>

						<aon:column alias="ProjectReservation.hotelReservation.workPlace.description"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_hotel}" />
							</f:facet>
							<aon:outputText value="#{to.hotelReservation.workPlace.description}">
								<aon:abbreviateConverter maxWidth="25" />
							</aon:outputText>
							<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
								<aon:outputText	value="#{to.hotelReservation.workPlace.description}" />
							</rich:toolTip>
						</aon:column>

						<aon:column alias="ProjectReservation.project.id"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_id}" />
							</f:facet>
							<aon:panelGrid styleClass="aon-width-all aon-noborder" columns="2" 
								columnClasses="aon-width-auto aon-noborder aon-nopadding,aon-width-20 aon-noborder aon-nopadding">
								<aon:outputText value="#{to.id}" />
								<aon:commandLink id="reservation-link" immediate="true"
									styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
									value="&#160;" title="#{bundle.aon_go}"
									actionListener="#{controller.onLoadReservation}"
									action="reservation_form" />
							</aon:panelGrid>
						</aon:column>

						<aon:column alias="ProjectReservation.code"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_reservation_code}" />
							</f:facet>
							<aon:outputText value="#{to.code}">
								<aon:abbreviateConverter maxWidth="15" />
							</aon:outputText>
							<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
								<aon:outputText	value="#{to.code}" />
							</rich:toolTip>
						</aon:column>

						<aon:column alias="ProjectReservation.startDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkin}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="ProjectReservation.endDate"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_checkout}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_guest}" />
							</f:facet>
							<aon:outputText value="#{to.guestFullName}">
								<aon:abbreviateConverter maxWidth="25" />
							</aon:outputText>
						</aon:column>

						<aon:column alias="ProjectReservation.agency.registry.name"
							styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_agency}" />
							</f:facet>
							<aon:outputText value="#{to.agency.registry.fullName}">
								<aon:abbreviateConverter maxWidth="25" />
							</aon:outputText>
							<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto" rendered="#{!empty to.agency.registry.fullName}">
								<aon:outputText	value="#{to.agency.registry.fullName}" />
							</rich:toolTip>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.report_tariff}" />
							</f:facet>
							<aon:outputText value="#{to.mainTariffCode}" />
							<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
								<aon:outputText value="#{to.mainTariffName}" />
							</rich:toolTip>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:if test="#{!cancellationInvoiceSearch.manual}">
									<aon:outputText value="AUTO" />
								</aon:if>
								<aon:if test="#{cancellationInvoiceSearch.manual}">
									<aon:outputText value="1N" />
								</aon:if>
							</f:facet>
							<aon:panelGrid styleClass="aon-width-all aon-noborder" columns="2" 
								columnClasses="aon-width-20 aon-noborder aon-nopadding,aon-width-auto aon-noborder aon-nopadding">
								<aon:div>
									<aon:outputText	value="&#160;" rendered="#{to.advancedAmount == 0}" />
									<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-cash"
										rendered="#{to.advancedAmount != 0}" />
									<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto" rendered="#{to.advancedAmount != 0}">
										<aon:outputText	value="#{bundle.finance_money_advance_charged}:" styleClass="aon-margin-right" />
										<aon:outputText value="#{to.advancedAmount}" styleClass="aon-text-right">
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>
									</rich:toolTip>
								</aon:div>
								<aon:panelGroup styleClass="aon-text-right">
									<aon:if test="#{!cancellationInvoiceSearch.manual}">
										<aon:outputText value="#{(to.penaltyAmount!=0) ? to.penaltyAmount : to.autoCancellationPenaltyPrice}">
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>
									</aon:if>
									<aon:if test="#{cancellationInvoiceSearch.manual}">
										<aon:outputText value="#{to.firstNightCancellationPenaltyPrice}">
											<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
										</aon:outputText>
									</aon:if>
								</aon:panelGroup>
							</aon:panelGrid>
						</aon:column>

						<aon:if test="#{cancellationInvoiceSearch.manual}">
							<aon:column styleClass="aon-editDataTable-numberColumn">
								<f:facet name="header">
									<aon:outputText value="2N" />
								</f:facet>
								<aon:outputText value="#{to.firstTwoNightCancellationPenaltyPrice}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
							</aon:column>
						</aon:if>

						<aon:column alias="ProjectReservation.total"
							styleClass="aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:panelGrid styleClass="aon-width-all aon-noborder" columns="2" 
								columnClasses="aon-width-20 aon-noborder aon-nopadding,aon-width-auto aon-noborder aon-nopadding">
								<aon:div>
									<aon:outputText	value="&#160;" rendered="#{to.blankToken}" />
									<aon:div rendered="#{!to.blankToken and !to.invoiced and (!to.cancelled or !to.noInvoiceable) and to.conexFlow}">
										<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-grey"
											rendered="#{to.conexFlowCreateToken or to.conexFlowCancelOk or to.conexFlowPreauthorizedExpired}" />
										<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-green"
											rendered="#{to.conexFlowPreauthorizedCheck}" />
										<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-green-ok"
											rendered="#{to.conexFlowPreauthorizedOk}" />
										<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-red"
											rendered="#{to.conexFlowFail}" />
										<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-blue"
											rendered="#{to.conexFlowSaleOk}" />
										<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-purple"
											rendered="#{to.conexFlowRefundOk}" />
									</aon:div>
									<aon:div rendered="#{!to.blankToken and (to.invoiced or (to.cancelled and to.noInvoiceable) or !to.conexFlow)}">
										<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-grey" />
									</aon:div>
									<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto" rendered="#{to.conexFlow}">
										<aon:panelGrid columns="2" 
											columnClasses="aon-noborder aon-italic aon-width-70 aon-text-left, aon-noborder aon-bold aon-text-left">
											<aon:outputText	value="#{bundle.aon_date}:" styleClass="aon-margin-left" />
											<aon:outputText	value="#{to.lastConexFlowOperation.attachDate}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
											<aon:outputText	value="#{bundle.aon_amount}:" styleClass="aon-margin-left" />
											<aon:outputText value="#{to.conexFlowOperationAmount}" styleClass="aon-text-right">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:panelGrid>
									</rich:toolTip>
								</aon:div>
								<aon:panelGroup styleClass="aon-text-right">
									<aon:outputText value="#{to.total}" styleClass="aon-text-right">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:panelGroup>
							</aon:panelGrid>
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/cancellationInvoice/modalInvoice.xhtml">
			<ui:param name="controller" value="#{cancellationInvoice}" />
			<ui:param name="searchListener" value="#{cancellationInvoiceSearch}" />
		</ui:include>
		<ui:include src="/com/esferalia/aon/ui/pms/facelet/cancellationInvoice/modalNoInvoice.xhtml">
			<ui:param name="controller" value="#{cancellationInvoice}" />
			<ui:param name="searchListener" value="#{cancellationInvoiceSearch}" />
		</ui:include>

	</ui:define>
</ui:composition>
