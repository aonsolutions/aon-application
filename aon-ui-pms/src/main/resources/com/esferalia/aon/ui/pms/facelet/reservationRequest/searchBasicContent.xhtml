<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<c:if test="#{pmsCollections.currentUserHotelsCount > 1}">
		<aon:outputLabel for="ReservationRequest_hotel_id"
			value="#{pmsBundle.pms_hotel}" />
		<aon:selectOneMenu id="ReservationRequest_hotel_id"
			value="#{searchController.hotel}">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{pmsCollections.currentUserHotels}" />
		</aon:selectOneMenu>
	</c:if>

	<aon:outputLabel for="ReservationRequest_id" 
		value="#{pmsBundle.pms_reservation_request_id}" />
	<aon:div>
		<aon:inputText id="ReservationRequest_id"
			valueChangeListener="#{controller.addExpression}"
			size="20" />
	</aon:div>

	<aon:outputLabel for="ReservationRequest_code" 
		value="#{pmsBundle.pms_reservation_code}" />
	<aon:div>
		<aon:inputText id="ReservationRequest_code"
			valueChangeListener="#{controller.addExpression}"
			size="20" />
	</aon:div>

	<aon:outputLabel  
		value="#{pmsBundle.pms_checkIn}" />
	<aon:div>
		<aon:outputLabel for="ReservationRequest_startDate-From"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
		<aon:selectInputDate id="ReservationRequest_startDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
		<aon:outputLabel for="ReservationRequest_startDate-To"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
		<aon:selectInputDate id="ReservationRequest_startDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>

	<aon:outputLabel  
		value="#{pmsBundle.pms_checkOut}" />
	<aon:div>
		<aon:outputLabel for="ReservationRequest_endDate-From"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
		<aon:selectInputDate id="ReservationRequest_endDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
		<aon:outputLabel for="ReservationRequest_endDate-To"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
		<aon:selectInputDate id="ReservationRequest_endDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>

	<c:if test="#{aonRole.saleOperator}">
		<aon:outputLabel for="ReservationRequest_agency" 
			value="#{pmsBundle.pms_agency}" />
		<aon:selectOneMenu id="ReservationRequest_agency" 
			value="#{searchController.agency}">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{pmsCollections.agencies}" />
		</aon:selectOneMenu>

		<aon:outputLabel for="ReservationRequest_company" 
			value="#{pmsBundle.pms_company}" />
		<aon:selectOneMenu id="ReservationRequest_company" 
			value="#{searchController.company}">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{pmsCollections.companies}" />
		</aon:selectOneMenu>
	</c:if>

	<aon:outputLabel for="ReservationRequest_active" value="#{bundle.aon_status}" />
	<aon:selectOneRadio id="ReservationRequest_active"
		valueChangeListener="#{controller.addExpression}">
		<f:selectItem itemLabel="#{pmsBundle.pms_reservation_request_pending}" itemValue="true" />
		<f:selectItem itemLabel="#{pmsBundle.pms_reservation_request_processed}" itemValue="false" />
	</aon:selectOneRadio>				

</ui:composition>
