<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:if test="#{pmsCollections.currentUserHotelsCount > 1}">
		<aon:outputLabel for="Allotment_hotel_id"
			value="#{bundle.aon_module_hotel}" />
		<aon:selectOneMenu id="Allotment_hotel_id"
			value="#{searchController.hotel}">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{pmsCollections.currentUserHotels}" />
		</aon:selectOneMenu>
	</aon:if>

	<aon:outputLabel  
		value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="Allotment_fromDate-From"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
		<aon:selectInputDate id="Allotment_fromDate-From"
			value="#{searchController.fromDate}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
		<aon:outputLabel for="Allotment_fromDate-To"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
		<aon:selectInputDate id="Allotment_fromDate-To"
			value="#{searchController.toDate}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>

	<aon:outputLabel for="Allotment_rateCode" 
		value="#{bundle.aon_id}" />
	<aon:inputText id="Allotment_rateCode"
		valueChangeListener="#{controller.addExpression}"
		size="10" />

	<aon:outputLabel for="Allotment_agency" 
		value="#{bundle.report_agency}" />
	<aon:selectOneMenu id="Allotment_agency" 
		value="#{searchController.agency}"
		styleClass="aon-width-350">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{pmsCollections.agencies}" />
	</aon:selectOneMenu>

	<aon:if test="#{pmsCollections.agencyGroupsCount > 0}">
		<aon:outputLabel for="Allotment_agencyGroup" 
			value="#{bundle.aon_group}" />
		<aon:selectOneMenu id="Allotment_agencyGroup" 
			value="#{searchController.agencyGroup}"
			styleClass="aon-width-350">
			<f:selectItem itemLabel="-" value="#{null}" />		
			<f:selectItems value="#{pmsCollections.agencyGroups}" />
		</aon:selectOneMenu>
	</aon:if>

	<aon:outputLabel for="Allotment_remarks" 
		value="#{bundle.aon_remark}" />
	<aon:inputText id="Allotment_remarks"
		value="#{searchController.remarks}"
		size="64" />

	<aon:outputLabel for="Allotment_active" value="#{bundle.aon_status}" />
	<aon:selectOneRadio id="Allotment_active"
		value="#{searchController.active}">
		<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="true" />
		<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="false" />
	</aon:selectOneRadio>				

</ui:composition>
