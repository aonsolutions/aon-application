<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="allotmentForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.pms_allotment_module}" />
				<ui:param name="controller" value="#{allotment}" />
				<ui:define name="beforeSpinToolbarContent">				
					<aon:commandButton id="audit-info"
						styleClass="aon-finding-toolbar-item aon-icon-audit"
						value="#{bundle.aon_audit}"
						rendered="#{!allotment.new}"
						reRender="showAuditInfoWindow">
						<f:setPropertyActionListener target="#{allotment.showAuditInfoWindow}"
							value="#{true}" />							
					</aon:commandButton>	
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:include src="/com/esferalia/aon/ui/pms/facelet/allotment/formContent.xhtml" />
			</aon:div>
		</aon:form>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />

		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{allotment}" />
		</ui:include>

	</ui:define>
</ui:composition>
