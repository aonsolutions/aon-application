<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="allotmentForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.pms_allotment_module}" />
				<ui:param name="controller" value="#{allotment}" />
				<ui:param name="skipRemoveButton" value="#{allotment.rateCode}" />
				<ui:param name="showMoreMenu" value="#{!allotment.nevv and allotment.rateCode}" />
				<ui:define name="beforeSpinToolbarContent">				
					<ui:include
						src="/com/code/aon/ui/common/facelet/auditable/toolbarContent.xhtml" />											
				</ui:define>				
				<ui:define name="moreMenuContent">
					<aon:menuItem id="AllotmentCopy"
						value="#{bundle.aon_copy}"
						immediate="#{true}"
						iconClass="aon-icon-copy"
						actionListener="#{allotment.onAllotmentCopyShow}"
						reRender="showAllotmentCopyWindow">
						<f:setPropertyActionListener target="#{allotment.showAllotmentCopyWindow}"
							value="#{true}" />
					</aon:menuItem>
					<aon:menuItem id="AllotmentFraction"
						value="#{bundle.finance_to_fraction}"
						immediate="#{true}"
						iconClass="aon-icon-task-liberate"
						actionListener="#{allotment.onAllotmentFractionShow}"
						reRender="showAllotmentFractionWindow">
						<f:setPropertyActionListener target="#{allotment.showAllotmentFractionWindow}"
							value="#{true}" />
					</aon:menuItem>
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:include src="/com/esferalia/aon/ui/pms/facelet/allotment/formContent.xhtml" />
			</aon:div>
		</aon:form>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />

		<aon:if test="#{!allotment.nevv}">
			<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
				<ui:param name="auditableController" value="#{allotment}" />
			</ui:include>
			<ui:include src="/com/esferalia/aon/ui/pms/facelet/allotment/modalCopy.xhtml">
				<ui:param name="controller" value="#{allotment}" />
			</ui:include>
			<ui:include src="/com/esferalia/aon/ui/pms/facelet/allotment/modalFraction.xhtml">
				<ui:param name="controller" value="#{allotment}" />
			</ui:include>
		</aon:if>

	</ui:define>
</ui:composition>
