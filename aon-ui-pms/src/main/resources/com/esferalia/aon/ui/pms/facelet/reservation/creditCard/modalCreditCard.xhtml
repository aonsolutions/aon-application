<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showCreditCardWindow">
		<aon:if test="#{controller.showCreditCardWindow}">
			<rich:modalPanel id="creditCardModalPanel" minHeight="280" minWidth="580" 
				rendered="#{controller.showCreditCardWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_credit_card}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{reservation.refreshEntireReservation}"
							reRender="showCreditCardWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showCreditCardWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="creditCardForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="creditCardModalToolbar" styleClass="aon-toolbar">
									<aon:commandButton id="creditCard-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_save}"
										rendered="#{reservation.reservationPermission.creditCardEditable}"
										actionListener="#{controller.onSaveCreditCard}"
										reRender="aonContent"
										onclick="Richfaces.showModalPanel('waitProccess')"
										oncomplete="Richfaces.hideModalPanel('waitProccess')" />
									<aon:commandButton id="creditCard-edit"
										styleClass="aon-finding-toolbar-item aon-icon-edit"
										value="#{bundle.aon_edit}"
										rendered="#{!reservation.reservationPermission.creditCardEditable}"
										actionListener="#{controller.onEditCreditCard}"
										reRender="aonContent"
										onclick="Richfaces.showModalPanel('waitProccess')"
										oncomplete="Richfaces.hideModalPanel('waitProccess')" />
									<aon:commandButton id="creditCard-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										actionListener="#{reservation.refreshEntireReservation}"
										reRender="showCreditCardWindow">
										<f:setPropertyActionListener
											target="#{controller.showCreditCardWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div id="creditCardModalContent" styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto"
										rendered="#{reservation.to.blankToken}">

										<aon:outputLabel for="CreditCard_holder"
											value="#{bundle.aon_holder}" />
										<aon:outputText value="#{controller.to.hrCreditCardHolder}" 
											rendered="#{!reservation.reservationPermission.creditCardEditable}"	
											styleClass="aon-bold" />
										<aon:inputText id="CreditCard_holder" 
											value="#{controller.to.hrCreditCardHolder}"
											required="true" size="60" maxlength="64"
											rendered="#{reservation.reservationPermission.creditCardEditable}"	/>

										<aon:outputLabel for="CreditCard_number"
											value="#{bundle.aon_credit_card_number}" />
										<aon:outputText value="#{controller.to.hrSecureCreditCardNumber}" 
											rendered="#{!reservation.reservationPermission.creditCardEditable}"	
											styleClass="aon-bold" />
										<aon:inputText id="CreditCard_number" 
											value="#{controller.to.hrCreditCardNumber}"
											required="true" size="25" maxlength="20"
											rendered="#{reservation.reservationPermission.creditCardEditable}"	/>

										<aon:outputLabel for="CreditCard_expirationMonth"
											value="#{bundle.aon_expiration}" />
										<aon:div>
											<aon:outputText value="#{controller.to.hrCreditCardExpirationMonth}" 
												rendered="#{!reservation.reservationPermission.creditCardEditable}"	
												styleClass="aon-bold" />
											<aon:selectOneMenu id="CreditCard_expirationMonth"
												value="#{controller.to.hrCreditCardExpirationMonth}" required="true"
												rendered="#{reservation.reservationPermission.creditCardEditable}">
												<f:selectItem itemLabel="01" itemValue="01" />
												<f:selectItem itemLabel="02" itemValue="02" />
												<f:selectItem itemLabel="03" itemValue="03" />
												<f:selectItem itemLabel="04" itemValue="04" />
												<f:selectItem itemLabel="05" itemValue="05" />
												<f:selectItem itemLabel="06" itemValue="06" />
												<f:selectItem itemLabel="07" itemValue="07" />
												<f:selectItem itemLabel="08" itemValue="08" />
												<f:selectItem itemLabel="09" itemValue="09" />
												<f:selectItem itemLabel="10" itemValue="10" />
												<f:selectItem itemLabel="11" itemValue="11" />
												<f:selectItem itemLabel="12" itemValue="12" />
											</aon:selectOneMenu>
											<aon:outputLabel value="/" styleClass="aon-bold aon-margin-left aon-margin-right" />
											<aon:outputText value="#{controller.to.hrCreditCardExpirationYear}" 
												rendered="#{!reservation.reservationPermission.creditCardEditable}"	
												styleClass="aon-bold" />
											<aon:selectOneMenu id="CreditCard_expirationYear"
												value="#{controller.to.hrCreditCardExpirationYear}" required="true"
												rendered="#{reservation.reservationPermission.creditCardEditable}">
												<f:selectItems value="#{controller.creditCardYears}" />
											</aon:selectOneMenu>
										</aon:div>

										<aon:outputLabel for="CreditCard_cvv"
											value="#{bundle.aon_credit_card_cvv}" />
										<aon:outputText value="#{controller.to.hrSecureCreditCardCvv}" 
											rendered="#{!reservation.reservationPermission.creditCardEditable}"	
											styleClass="aon-bold" />
										<aon:inputText id="CreditCard_cvv" 
											value="#{controller.to.hrCreditCardCvv}"
											size="5" maxlength="8"
											rendered="#{reservation.reservationPermission.creditCardEditable}"	/>

									</aon:panelGrid>

									<aon:panelGrid id="menuGrid2" columns="2" dir="true" styleClass="aon-width-all aon-margin-top"
										columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto"
										rendered="#{reservation.reservationPermission.creditCardOperable and controller.reservationConexFlow.conexFlowActive}">

										<aon:outputLabel for="Conexflow_Amount"
											value="#{bundle.aon_amount}" />
										<aon:inputText id="Conexflow_Amount" 
											value="#{controller.reservationConexFlow.amount}"
											required="true" size="10" maxlength="10"/>
										
										<aon:outputLabel for="ConexflowOperation"
											value="#{bundle.aon_operation}" />
										<aon:div id="ConexflowOperation"  required="true">
											<aon:selectOneMenu value="#{controller.reservationConexFlow.conexflowOperation}" required="true">
												<aon:if test="#{controller.reservationConexFlow.showPreauthorization}">
													<f:selectItem itemLabel="#{bundle.pms_preauthorization}" itemValue="P" />
												</aon:if>
												<aon:if test="#{controller.reservationConexFlow.showCharge}">
													<f:selectItem itemLabel="#{bundle.pms_conexflow_charge}" itemValue="V" />
												</aon:if>
												<aon:if test="#{controller.reservationConexFlow.showCancelation}">
													<f:selectItem itemLabel="#{bundle.pms_conexflow_cancel_op}" itemValue="A" />
												</aon:if>
												<aon:if test="#{controller.reservationConexFlow.showConfirmPreauthorization}">
													<f:selectItem itemLabel="#{bundle.pms_conexflow_confirm_preauthorization}" itemValue="C" />
												</aon:if>
												<aon:if test="#{controller.reservationConexFlow.showRefund}">
													<f:selectItem rendered ="#{controller.reservationConexFlow.showRefund}" itemLabel="#{bundle.pms_conexflow_refund}" itemValue="D" />
												</aon:if>
										 		<a4j:support event="onchange"  actionListener="#{controller.onConexflowOperationChange}" 
										 		reRender="menuGrid2" ajaxSingle="true" />
											</aon:selectOneMenu>
											<aon:if  test="#{controller.reservationConexFlow.showCancelationOption}">
												<aon:selectOneMenu value="#{controller.reservationConexFlow.conexflowOperationCancelation}" required="true">
													<aon:if test="#{controller.reservationConexFlow.showConfirmPreauthorization}">
														<f:selectItem itemLabel="#{bundle.pms_preauthorization}" itemValue="P" />
													</aon:if>
													<aon:if test="#{controller.reservationConexFlow.charge}">
														<f:selectItem itemLabel="#{bundle.pms_conexflow_charge}" itemValue="V" />
													</aon:if>
													<aon:if test="#{controller.reservationConexFlow.confirmPreauthorization}">
														<f:selectItem itemLabel="#{bundle.pms_conexflow_confirm_preauthorization}" itemValue="C" />
													</aon:if>
													<aon:if test="#{controller.reservationConexFlow.refund}">
														<f:selectItem itemLabel="#{bundle.pms_conexflow_refund}" itemValue="D" />
													</aon:if>
												</aon:selectOneMenu>
											</aon:if>
											<aon:if  test="#{controller.reservationConexFlow.showRefundOption}">
												<aon:selectOneMenu value="#{controller.reservationConexFlow.conexflowOperationRefund}" required="true">
													<aon:if test="#{controller.reservationConexFlow.charge}">
														<f:selectItem itemLabel="#{bundle.pms_conexflow_charge}" itemValue="V" />
													</aon:if>
													<aon:if test="#{controller.reservationConexFlow.confirmPreauthorization}">
														<f:selectItem itemLabel="#{bundle.pms_conexflow_confirm_preauthorization}" itemValue="C" />
													</aon:if>
												</aon:selectOneMenu>
											</aon:if>

											<aon:commandButton id="conexflow-accept"
												styleClass="aon-commandButton"
												value="#{bundle.pms_execute_operation}"
												rendered="#{reservation.reservationPermission.creditCardOperable}"
												actionListener="#{controller.onConexflowOperation}"
												onclick="Richfaces.showModalPanel('waitProccess')"
												oncomplete="Richfaces.hideModalPanel('waitProccess')"
												reRender="menuGrid2,showNotifyWindow"/>
										

										</aon:div>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>
	<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservation/creditCard/modalNotify.xhtml">
			<ui:param name="controller" value="#{reservation}" />
	</ui:include>
</ui:composition>
