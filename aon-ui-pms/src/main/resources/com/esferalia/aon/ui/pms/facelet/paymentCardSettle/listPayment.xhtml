<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<aon:div id="financeToolBarDiv" styleClass="aon-toolbar">
		<aon:commandButton title="#{bundle.aon_check_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkAll"
			value="#{bundle.aon_check_all}"
			rendered="#{financeList.model.rowCount > 0}"
			actionListener="#{financeList.checkAll}" reRender="financeToolBarDiv,financeDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
		<aon:commandButton title="#{bundle.aon_uncheck_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkNone"
			value="#{bundle.aon_uncheck_all}"
			rendered="#{financeList.model.rowCount > 0}"
			actionListener="#{financeList.checkNone}" reRender="financeToolBarDiv,financeDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				

		<aon:commandButton title="#{financeBundle.finance_refine_search}"
			styleClass="aon-finding-toolbar-item aon-icon-search"
			value="#{financeBundle.finance_refine_search}"
			rendered="#{paymentCardSettle.selectedTab == 'tab2'}"
			actionListener="#{paymentCardSettle.onEditSearchFinance}" 
			reRender="showFinanceSearchWindow">
			<f:setPropertyActionListener target="#{financeList.showFinanceSearchWindow}"
				value="#{true}" />
		</aon:commandButton>

		<aon:commandButton title="#{pmsBundle.pms_include}"
			styleClass="aon-finding-toolbar-item aon-icon-newFolder"
			value="#{pmsBundle.pms_include}"
			rendered="#{financeList.checkedCount > 0}"
			actionListener="#{paymentCardSettle.onAddSelected}" reRender="financeToolBarDiv,financeDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
			oncomplete="Richfaces.hideModalPanel('waitProccess')" />
	</aon:div>
 
	<aon:div id="financeDataDiv">
	
		<aon:dataTable id="paymentListData" value="#{financeList.model}"
			var="to" rows="20" rendered="#{financeList.model.rowCount > 0}">
			
			<aon:rowSelector toggleOnClick="#{false}" immediate="#{true}" />				
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{financeList.checkedCount}" />
				</f:facet>
				<aon:selectBooleanCheckbox id="Included_Row_checked"
					value="#{financeList.rowChecked}"
					valueChangeListener="#{financeList.rowSelected}"
					reRender="financeToolBarDiv, financeDataDiv" />	
			</aon:column>
	
			<aon:column alias="Finance.dueDate"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.dueDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column alias="Finance.invoice&lt;referenceCode"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_invoice}" />
				</f:facet>
				<aon:commandLink id="invoiceLink" immediate="true"
					styleClass="aon-button-goto"
					style="padding-right: 10px;" 
					value="&#160;"  
					actionListener="#{paymentCardSettle.onLoadInvoice}"
					action="saleInvoice_form"
					reRender="aonContent" />
				<aon:outputText value="#{to.referenceCode}" />
			</aon:column>
			
			<aon:column alias="Finance.payMethod.name"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{configBundle.config_pay_method}" />
				</f:facet>
				<aon:outputText value="#{to.payMethod.name}" />
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_total}" />
				</f:facet>
				<aon:outputText value="#{to.totalAmount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column alias="Finance.invoice.project.id"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_reservation}" />
				</f:facet>
				<aon:commandLink id="reservationLink" immediate="true"
					styleClass="aon-button-goto"
					style="padding-right: 10px;" 
					value="&#160;"  
					rendered="#{!to.invoice.service and to.invoice.project.id!=null}" 
					actionListener="#{paymentCardSettle.onLoadReservation}"
					action="reservation_form"
					reRender="aonContent">
				</aon:commandLink>
				<aon:outputText rendered="#{!to.invoice.service}"
					value="#{to.invoice.project.id}" />
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{financeBundle.finance_invoice}"
					rendered="#{!to.invoice.rectifier and !to.invoice.rectified}" />
				<aon:div rendered="#{to.invoice.rectifier}">
					<aon:outputText value="#{to.invoice.rectificationType}" />
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250">
						<aon:outputFormat value="#{financeBundle.finance_invoice_rectifier_message}" styleClass="aon-bold aon-label-error">
							<f:param value="#{to.invoice.rectificationInvoice.referenceCode}" />
						</aon:outputFormat>
					</rich:toolTip>
				</aon:div>
				<aon:div rendered="#{to.invoice.rectified}">
					<aon:outputText value="#{to.invoice.rectificationType}" />
					<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="top-left" followMouse="true" showDelay="250">
						<aon:outputFormat value="#{financeBundle.finance_invoice_rectified_message}" styleClass="aon-bold">
							<f:param value="#{to.invoice.rectificationInvoicesString}" />
						</aon:outputFormat>
					</rich:toolTip>
				</aon:div>
			</aon:column>

			<aon:column 
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_reservation_code}" />
				</f:facet>
				<aon:outputText rendered="#{!to.invoice.service}"
					value="#{paymentCardSettle.financeListProjectReservation.code}" />
			</aon:column>
			
			<aon:column 
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_guest}" />
				</f:facet>
				<aon:outputText rendered="#{!to.invoice.service}"
					value="#{paymentCardSettle.financeListProjectReservation.guestFullName}" />
			</aon:column>
	
			<aon:column 
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_hotel}" />
				</f:facet>
				<aon:outputText rendered="#{!to.invoice.service}"
					value="#{paymentCardSettle.financeListProjectReservation.hotelReservation.workPlace.description}" />
			</aon:column>
			
			<aon:column 
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_checkIn}" />
				</f:facet>
				<aon:outputText rendered="#{!to.invoice.service}"
					value="#{paymentCardSettle.financeListProjectReservation.startDate}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column 
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{pmsBundle.pms_checkOut}" />
				</f:facet>
				<aon:outputText rendered="#{!to.invoice.service}"
					value="#{paymentCardSettle.financeListProjectReservation.endDate}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			
<!--  
			<aon:column alias="Finance.financeStatus"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.financeStatus}" />
			</aon:column>
-->
	
	
		</aon:dataTable>	
		
		<aon:dataScroller2 for="paymentListData" showNote="true" />
	
	</aon:div>
			

</ui:composition>
