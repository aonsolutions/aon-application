<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">


	<aon:div id="financeToolBarDiv" styleClass="aon-toolbar">
		<aon:commandButton title="#{bundle.aon_check_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkAll"
			value="#{bundle.aon_check_all}"
			rendered="#{financeList.model.rowCount > 0}"
			actionListener="#{financeList.checkAll}" reRender="financeToolBarDiv,financeDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
		<aon:commandButton title="#{bundle.aon_uncheck_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkNone"
			value="#{bundle.aon_uncheck_all}"
			rendered="#{financeList.model.rowCount > 0}"
			actionListener="#{financeList.checkNone}" reRender="financeToolBarDiv,financeDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				

		<aon:commandButton title="#{financeBundle.finance_refine_search}"
			styleClass="aon-finding-toolbar-item aon-icon-search"
			value="#{financeBundle.finance_refine_search}"
			rendered="#{paymentCardSettle.selectedTab == 'tab2'}"
			actionListener="#{paymentCardSettle.onEditSearchFinance}" 
			reRender="showFinanceSearchWindow">
			<f:setPropertyActionListener target="#{financeList.showFinanceSearchWindow}"
				value="#{true}" />
		</aon:commandButton>

		<aon:commandButton title="Incluir"
			styleClass="aon-finding-toolbar-item aon-icon-newFolder"
			value="Incluir"
			rendered="#{financeList.checkedCount > 0}"
			actionListener="#{paymentCardSettle.onAddSelected}" reRender="paymentCardSettleList"
			onclick="Richfaces.showModalPanel('waitProccess')" 
			oncomplete="Richfaces.hideModalPanel('waitProccess')" />
	</aon:div>
 
	<aon:div id="financeDataDiv">
	
		<aon:dataTable id="paymentListData" value="#{financeList.model}"
			var="to" rows="20" rendered="#{financeList.model.rowCount > 0}"
			columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
				aon-editDataTable-textColumn, aon-editDataTable-textColumn,
				aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
				aon-editDataTable-numberColumn">				
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{financeList.checkedCount}" />
				</f:facet>
				<aon:selectBooleanCheckbox id="Included_Row_checked"
					value="#{financeList.rowChecked}"
					valueChangeListener="#{financeList.rowSelected}"
					reRender="paymentCardSettleList" />	
			</aon:column>
	
			<aon:column alias="Finance.dueDate"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.dueDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
	
			<aon:column alias="Finance.invoice&lt;referenceCode"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_invoice}" />
				</f:facet>
				<aon:outputText value="#{to.referenceCode}" />
			</aon:column>
	
			<aon:column alias="Finance.concept"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_invoice_document_number}" />
				</f:facet>
				<aon:outputText value="#{to.concept}" />
			</aon:column>
	
			<aon:column alias="Finance.registryName"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText	value="#{(finance.payment) ? (financeBundle.finance_creditor) : (financeBundle.finance_debtor)}" />
				</f:facet>
				<aon:outputText value="#{to.registryName}" />
			</aon:column>
	
			<aon:column alias="Finance.registryDocument"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_company_document}" />
				</f:facet>
				<aon:outputText value="#{to.registryDocument}" />
			</aon:column>
	
			<aon:column alias="Finance.financeStatus"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.financeStatus}" />
			<!--  
				<f:facet name="footer">
					<aon:outputText value="#{financeBundle.finance_total_amount}" />
				</f:facet>
			-->
			</aon:column>
	
			<aon:column alias="Finance.payMethod.name"
				styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{configBundle.config_pay_method}" />
				</f:facet>
				<aon:outputText value="#{to.payMethod.name}" />
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_total}" />
				</f:facet>
				<aon:outputText value="#{to.totalAmount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<!--  
				<f:facet name="footer">
					<aon:div style="float:right">
						<aon:outputText style="text-align:right" value="#{finance.totalFinanceAmount}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
				-->
			</aon:column>
	
		</aon:dataTable>	
		
		<aon:dataScroller2 for="paymentListData" showNote="true" />
	
	</aon:div>
			

</ui:composition>
