<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showTouristTaxInvoiceWindow">
		<aon:if test="#{controller.showTouristTaxInvoiceWindow}">
			<rich:modalPanel id="touristTaxInvoiceModalPanel" minHeight="320" minWidth="580" 
				rendered="#{controller.showTouristTaxInvoiceWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.pms_tourist_tax_invoice}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showTouristTaxInvoiceWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{controller.showTouristTaxInvoiceWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="touristTaxInvoiceForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div id="touristTaxInvoiceModalToolbar" styleClass="aon-toolbar">
									<aon:commandButton id="touristTaxInvoice-accept"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_key_invoice_description}"
										actionListener="#{controller.onTouristTaxInvoice}"
										reRender="aonContent"
										onclick="Richfaces.showModalPanel('waitProccess')"
										oncomplete="Richfaces.hideModalPanel('waitProccess')">
										<rich:componentControl for="touristTaxInvoiceModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{controller.showTouristTaxInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="touristTaxInvoice-cancel" immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}"
										reRender="showTouristTaxInvoiceWindow">
										<f:setPropertyActionListener
											target="#{controller.showTouristTaxInvoiceWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div id="touristTaxInvoiceModalContent" styleClass="aon-scroll-area" style="margin-top: 1em;">
									<aon:panelGrid id="menuGrid" columns="2" dir="true" styleClass="aon-width-all"
										columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">

										<ui:include src="/com/esferalia/aon/ui/pms/facelet/reservation/invoice/form.xhtml" />

										<aon:outputLabel for="TouristTaxInvoice_payMethod"
											value="#{bundle.finance_payMethod}" />
										<aon:selectOneMenu id="TouristTaxInvoice_payMethod"
											value="#{controller.reservationInvoiceTo.firstFinance.payMethod}" required="true">
											<f:selectItem itemLabel="-" value="#{null}" />
											<f:selectItems value="#{configCollections.directPayMethods}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="TouristTaxInvoice_amount"
											value="#{bundle.pms_invoice_amount}" />
										<aon:panelGrid columns="2" columnClasses="aon-width-100,aon-width-auto">
											<aon:outputText id="TouristTaxInvoice_amount" 
												styleClass="aon-bold"
												value="#{controller.reservationInvoiceTo.firstFinance.amount}">
												<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
											</aon:outputText>

											<aon:div>
												<aon:outputLabel for="TouristTaxInvoice_quantity" 
													styleClass="aon-margin-left aon-italic"
													value="#{bundle.aon_number_abr} #{bundle.pms_adults}:" />
												<aon:outputText id="TouristTaxInvoice_quantity" 
													styleClass="aon-margin-left aon-bold"
													value="#{controller.reservationInvoiceTo.firstService.quantity}">
													<f:convertNumber pattern="#{bundle.aon_integer_pattern}" />
												</aon:outputText>
											</aon:div>
										</aon:panelGrid> 

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>

</ui:composition>
