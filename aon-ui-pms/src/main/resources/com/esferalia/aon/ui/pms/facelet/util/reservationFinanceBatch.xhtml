<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="reservationFinanceBatchForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{bundle.pms_reservation_finance_batch_module}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="reservationFinanceBatch-generate" 
						value="#{bundle.aon_generate}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						disabled="#{reservationFinanceBatch.reservationFile == null}"
						actionListener="#{reservationFinanceBatch.generateFinanceBatch}"
						reRender="aonStatus">
						<ui:include src="/com/code/aon/faces/logPanel/support.xhtml" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<aon:div>
				<aon:panelGrid id="ReservationFinanceBatch_dataGrid" columns="2" styleClass="aon-width-600 aon-padding aon-margin-left"
					columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="ReservationFinanceBatch_batchDescription"
						value="#{bundle.finance_fbatch_description}" />
					<aon:inputText id="ReservationFinanceBatch_batchDescription"
						value="#{reservationFinanceBatch.batchDescription}" required="true"
						size="30" maxlength="32">
					</aon:inputText>

					<aon:outputLabel for="ReservationFinanceBatch_payMethod" 
						value="#{bundle.finance_payMethod}" />
					<aon:selectOneMenu id="ReservationFinanceBatch_payMethod"
						value="#{reservationFinanceBatch.payMethod}" required="true">
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="ReservationFinanceBatch_reservationFile"
						value="#{bundle.pms_reservation_file}" />
					<aon:div>
						<aon:fileUpload id="ReservationFinanceBatch_reservationFile"
							addControlLabel="#{bundle.aon_fileUpload_add}"
							fileUploadListener="#{reservationFinanceBatch.fileUploaded}"
							maxFilesQuantity="1">
							<f:facet name="label">
								<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
							</f:facet>														
							<a4j:support event="onuploadcomplete" reRender="ReservationFinanceBatch_reservationFileName,reservationFinanceBatch-generate" immediate="true" />
						</aon:fileUpload>
						<aon:div id="ReservationFinanceBatch_reservationFileName">
							<aon:outputText value="#{reservationFinanceBatch.reservationFile.fileName}"
								 rendered="#{reservationFinanceBatch.reservationFile != null}" />
						</aon:div>
					</aon:div>	

				</aon:panelGrid>

				<aon:panelGrid id="ReservationFinanceBatch_batchGrid" columns="2" styleClass="aon-width-600 aon-padding aon-margin-left"
					columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">

					<aon:if test="#{reservationFinanceBatch.financeBatch != null}">
						<aon:outputLabel for="ReservationFinanceBatch_financeBatchGenerated"
							value="#{bundle.finance_fbatch_generated}" />
						<aon:div>
							<aon:outputText id="ReservationFinanceBatch_financeBatchGenerated"
								value="#{reservationFinanceBatch.financeBatch.description}" />
							<aon:commandLink id="financeBatch_link" immediate="true"
								styleClass="aon-button-goto aon-nowrap" style="padding-right: 20px;"
								value="&#160;" title="#{bundle.aon_finance_batch}"
								actionListener="#{reservationFinanceBatch.onLoadFinanceBatch}"
								action="fbatch_form" />
						</aon:div>
					</aon:if>

				</aon:panelGrid>
			</aon:div>

		</aon:form>

		<ui:include src="/com/code/aon/faces/logPanel/modal.xhtml" >
			<ui:param name="logPanelTitle" value="#{bundle.pms_reservation_finance_batch_module}" />
			<ui:param name="closeButtonReRender" value="ReservationFinanceBatch_batchGrid" />
		</ui:include>		
	</ui:define>

</ui:composition>
