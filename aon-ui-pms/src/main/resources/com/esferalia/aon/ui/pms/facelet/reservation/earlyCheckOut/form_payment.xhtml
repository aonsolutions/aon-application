<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:div id="earlyCheckOutPaymentDiv#{paymentSuffix}" 
		styleClass="aon-group aon-width-all" style="margin-top: 2em;"
		rendered="#{!empty paymentSummary}">
		<aon:div styleClass="aon-group-title">
			<aon:outputText value="#{paymentTitle}" styleClass="aon-uppercase" />
		</aon:div>
		<aon:div styleClass="aon-group-body"> 
			<aon:div styleClass="aon-group-body-internal">
				<aon:dataTable id="earlyCheckOutPaymentList#{paymentSuffix}"
					value="#{paymentSummary}" var="earlyCheckOutPaymentSummary">

					<aon:column styleClass="aon-width-auto aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.finance_payMethod}" />
						</f:facet>
						<aon:outputText value="#{earlyCheckOutPaymentSummary.payMethod.name}" />
						<f:facet name="footer">
							<aon:div styleClass="aon-bold aon-text-right" style="font-size: 0.9em;">
								<aon:outputText value="#{bundle.report_totals}" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column styleClass="aon-width-100 aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.pms_to_return}" />
						</f:facet>
						<aon:outputText value="#{earlyCheckOutPaymentSummary.returnAmount}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-bold aon-text-right" style="font-size: 0.9em;">
								<aon:outputText value="#{totalReturnAmount}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column styleClass="aon-width-100 aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.finance_to_charge}" />
						</f:facet>
						<aon:inputText id="EarlyCheckOut_reservationPaymentAmount"
							value="#{earlyCheckOutPaymentSummary.paymentAmount}"
							required="true" size="5"
							reRender="earlyCheckOutPaymentDiv#{paymentSuffix}" ajaxSingle="true" />
						<f:facet name="footer">
							<aon:div styleClass="aon-bold aon-text-right" style="font-size: 0.9em;">
								<aon:outputText value="&#160;"
									styleClass="aon-icon-exception" style="padding-left: 15px;"
									rendered="#{currentPaymentAmount != totalPaymentAmount}" />
								<aon:outputText value="#{currentPaymentAmount}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column styleClass="aon-width-100 aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.pms_liquidation}" />
						</f:facet>
						<aon:outputText value="#{earlyCheckOutPaymentSummary.liquidationAmountAbs}"
							styleClass="#{(earlyCheckOutPaymentSummary.liquidationAmount >= 0) ? ('aon-label-info') : ('aon-label-error')}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<f:facet name="footer">
							<aon:div styleClass="aon-bold aon-text-right" style="font-size: 0.9em;">
								<aon:outputText value="&#160;"
									styleClass="aon-icon-exception" style="padding-left: 15px;"
									rendered="#{currentPaymentAmount != totalPaymentAmount}" />
								<aon:outputText value="#{totalReturnAmount - currentPaymentAmount}">
									<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
								</aon:outputText>
							</aon:div>
						</f:facet>
					</aon:column>

				</aon:dataTable>
			</aon:div>
		</aon:div>
	</aon:div>

</ui:composition>
