<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:if test="#{!skipActivityButton}">
		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="S" />
			</f:facet>
			<aon:commandLink id="#{dataTableId}-selectButton" 
				styleClass="#{(to.invoiced) ? 
								('aon-icon-predetermine') :
								((to.cancelled) ?
									('aon-icon-wrong') :
									((to.blocked) ?
										('aon-icon-lock') :
										((reservation.pendingRoomAssignation) ?
											('aon-icon-point-red') :
											((reservation.pendingServiceAssignation) ?
												('aon-icon-point-yellow') :
												('aon-icon-point-green')))))}" 
				value="&#160;&#160;&#160;&#160;"
				title="#{(to.invoiced) ? 
							(bundle.pms_invoiced) :
							((to.cancelled) ?
								(bundle.pms_cancelled) :
								((to.blocked) ?
									(bundle.pms_blocked) :
									((reservation.pendingRoomAssignation) ?
										(bundle.pms_room_assignation_pending_msg) :
										((reservation.pendingServiceAssignation) ?
											(bundle.pms_service_assignation_pending_msg) :
											(bundle.pms_active)))))}" 
				immediate="true" ajaxSingle="true" requestDelay="100"
				action="#{rowSelectorAction}"
				actionListener="#{rowSelectorActionListener}"
				onkeyup="#{dataTableId}KeyUp(this)"
				onfocus="disableRowSelector();#{dataTableId}SelectRow(this)"
				onblur="enableRowSelector();#{dataTableId}DeselectRow(this)"
				onmouseover="disableRowSelector();"
				onmouseout="enableRowSelector();"				
				focus="#{(focusOnSelect != null)?(focusOnSelect):''}"
				reRender="#{rowSelectorReRender}" >
			</aon:commandLink>
			<f:facet name="footer">
				<ui:insert name="selectFooterContent"/>
			</f:facet>
		</aon:column>

		<aon:column styleClass="aon-editDataTable-iconColumn">
			<f:facet name="header">
				<aon:outputText value="C" />
			</f:facet>
			<aon:outputText value="&#160;" 
				styleClass="aon-icon-commandButton 
								#{(to.checkIn) ? 
									('aon-icon-check-in') : 
									((to.checkOut) ? 
										('aon-icon-check-out') : 
										((to.noShow) ? 
											((to.noInvoiceable) ? 'aon-icon-no-show' : 'aon-icon-no-show-invoiceable') :
											((to.checkCancelled) ?
												((to.noInvoiceable) ? 'aon-icon-removed' : 'aon-icon-invoiceable') :
												(''))))}" 
				title="#{(to.checkIn) ? 
							(bundle.pms_check_in) : 
							((to.checkOut) ? 
								(bundle.pms_check_out) : 
								((to.noShow) ? 
									((to.noInvoiceable) ? bundle.pms_no_invoiceable : bundle.pms_no_show) :
										((to.checkCancelled) ?
											((to.noInvoiceable) ? bundle.pms_no_invoiceable : bundle.pms_invoiceable) :
											(''))))}" />
		</aon:column>
	</aon:if>

	<aon:column alias="ProjectReservation.hotel.workPlace.description"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_module_hotel}" />
		</f:facet>
		<aon:div>
			<aon:outputText value="#{to.hotel.workPlace.description}"
				style="#{(to.diverted and !controller.myScope) ? ('color:red;') : ('')}" />
			<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto" rendered="#{to.diverted and !controller.myScope}">
				<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-70, aon-noborder aon-bold aon-text-left">
					<aon:outputText	value="#{bundle.aon_source}:" styleClass="aon-margin-left" />
					<aon:outputText	value="#{to.hotelReservation.workPlace.description}" />
				</aon:panelGrid>
			</rich:toolTip>
		</aon:div>
	</aon:column>

	<aon:column alias="ProjectReservation.project.id"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.report_id}" />
		</f:facet>
		<aon:outputText value="#{to.id}" />
	</aon:column>

	<aon:column 
		styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.report_reservation_room_count_abrv}" />
		</f:facet>
		<aon:outputText value="#{to.roomCount}" />
	</aon:column>

	<aon:column 
		styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.report_pax}" />
		</f:facet>
		<aon:outputText value="#{to.personCount}" />
	</aon:column>

	<aon:column 
		styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.pms_regime_abbrv}" />
		</f:facet>
		<aon:outputText value="#{to.mealPlan}" />
	</aon:column>

	<aon:column alias="ProjectReservation.code"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.report_reservation_code}" />
		</f:facet>
		<aon:outputText value="#{to.code}">
			<aon:abbreviateConverter maxWidth="15" />
		</aon:outputText>
		<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto">
			<aon:outputText	value="#{to.code}" />
		</rich:toolTip>
	</aon:column>

	<aon:column alias="ProjectReservation.startDate"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.report_checkin}" />
		</f:facet>
		<aon:outputText value="#{to.startDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="ProjectReservation.endDate"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.report_checkout}" />
		</f:facet>
		<aon:div>
			<aon:outputText value="#{to.endDate}"
				style="#{(to.earlyCheckOut) ? ('color:red;') : ('')}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
			<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto" rendered="#{to.earlyCheckOut}">
				<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-120, aon-noborder aon-bold aon-text-left">
					<aon:outputText	value="#{bundle.pms_early_check_out}:" styleClass="aon-margin-left" />
					<aon:outputText	value="#{to.earlyCheckOutDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:panelGrid>
			</rich:toolTip>
		</aon:div>
	</aon:column>

	<aon:if test="#{!skipGuest}">
		<aon:column styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.report_guest}" />
			</f:facet>
			<aon:outputText value="#{to.guestFullName}">
				<aon:abbreviateConverter maxWidth="30" />
			</aon:outputText>
		</aon:column>
	</aon:if>

	<aon:if test="#{!skipAgency}">
		<aon:column alias="ProjectReservation.agency.registry.name"
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.report_agency}" />
			</f:facet>
			<aon:outputText value="#{to.agency.registry.fullName}">
				<aon:abbreviateConverter maxWidth="25" />
			</aon:outputText>
			<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto" rendered="#{!empty to.agency.registry.fullName}">
				<aon:outputText	value="#{to.agency.registry.fullName}" />
			</rich:toolTip>
		</aon:column>
	</aon:if>

	<aon:column alias="ProjectReservation.total"
		styleClass="aon-editDataTable-numberColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_amount}" />
		</f:facet>
		<aon:panelGrid styleClass="aon-width-all aon-noborder" columns="2" 
			columnClasses="aon-width-20 aon-noborder aon-nopadding,aon-width-auto aon-noborder aon-nopadding">
			<aon:div rendered="#{!to.blankToken and !to.invoiced and (!to.cancelled or !to.noInvoiceable)}">
				<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-grey"
					rendered="#{to.lastConexFlowOperation == null or to.conexFlowCreateToken or to.conexFlowPreauthorizedExpired}" />
				<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-green"
					rendered="#{to.conexFlowPreauthorizedCheck}" />
				<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-green-ok"
					rendered="#{to.conexFlowPreauthorizedOk}" />
				<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-red"
					rendered="#{to.conexFlowFail}" />
				<aon:outputText	value="&#160;" styleClass="aon-icon-commandButton aon-icon-card-blue"
					rendered="#{to.conexFlowTransactionOk}" />
				<rich:toolTip showEvent="onmouseover" hideEvent="onmouseout" direction="auto" rendered="#{to.lastConexFlowOperation != null}">
					<aon:panelGrid columns="2" columnClasses="aon-noborder aon-italic aon-width-70 aon-text-left, aon-noborder aon-bold aon-text-left">
						<aon:outputText	value="#{bundle.aon_date}:" styleClass="aon-margin-left" />
						<aon:outputText	value="#{to.lastConexFlowOperation.attachDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:outputText	value="#{bundle.aon_amount}:" styleClass="aon-margin-left" />
						<aon:outputText value="#{to.conexFlowOperationAmount}" styleClass="aon-text-right">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:panelGrid>
				</rich:toolTip>
			</aon:div>
			<aon:outputText	value="&#160;" rendered="#{to.blankToken or to.invoiced or (to.cancelled and to.noInvoiceable)}" />
			<aon:panelGroup styleClass="aon-text-right">
				<aon:outputText value="#{to.total}" styleClass="aon-text-right">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:panelGroup>
		</aon:panelGrid>
	</aon:column>

</ui:composition>
