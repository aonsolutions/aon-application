<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:column styleClass="aon-editDataTable-iconColumn">
		<aon:commandLink id="#{dataTableId}-selectButton" 
			styleClass="#{(to.invoiced) ? 
							((to.noShow) ? ('aon-icon-predetermine2') : ('aon-icon-predetermine')) :
							((to.cancelled) ?
								((to.noShow) ? ('aon-icon-question') : ('aon-icon-wrong')) :
								((to.blocked) ?
									('aon-icon-lock') :
									((reservation.pendingRoomAssignation) ?
										('aon-icon-point-red') :
										((reservation.pendingServiceAssignation) ?
											('aon-icon-point-yellow') :
											('aon-icon-point-green')))))}" 
			value="&#160;&#160;&#160;&#160;"
			title="#{(to.invoiced) ? 
						(pmsBundle.pms_invoiced) :
						((to.cancelled) ?
							((to.noShow) ? (pmsBundle.pms_no_show) : (pmsBundle.pms_cancelled)) :
							((to.blocked) ?
								(pmsBundle.pms_blocked) :
								((reservation.pendingRoomAssignation) ?
									(pmsBundle.pms_room_assignation_pending_msg) :
									((reservation.pendingServiceAssignation) ?
										(pmsBundle.pms_service_assignation_pending_msg) :
										('OK')))))}" 
			immediate="true" ajaxSingle="true" requestDelay="100"
			action="#{rowSelectorAction}"
			actionListener="#{rowSelectorActionListener}"
			onkeyup="#{dataTableId}KeyUp(this)"
			onfocus="disableRowSelector();#{dataTableId}SelectRow(this)"
			onblur="enableRowSelector();#{dataTableId}DeselectRow(this)"
			onmouseover="disableRowSelector();"
			onmouseout="enableRowSelector();"				
			focus="#{(focusOnSelect != null)?(focusOnSelect):''}"
			reRender="#{rowSelectorReRender}" >
		</aon:commandLink>
		<f:facet name="footer">
			<ui:insert name="selectFooterContent"/>
		</f:facet>
	</aon:column>

	<aon:column alias="ProjectReservation.hotel.workPlace.description"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{pmsBundle.pms_hotel}" />
		</f:facet>
		<h:outputText value="#{to.hotel.workPlace.description}" />
	</aon:column>

	<aon:column alias="ProjectReservation.project.id"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{pmsBundle.pms_reservation_id}" />
		</f:facet>
		<h:outputText value="#{to.id}" />
	</aon:column>

	<aon:column alias="ProjectReservation.code"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{pmsBundle.pms_reservation_code}" />
		</f:facet>
		<aon:outputText value="#{to.code}" />
	</aon:column>

	<aon:column alias="ProjectReservation.startDate"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{pmsBundle.pms_checkIn}" />
		</f:facet>
		<aon:outputText value="#{to.startDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column alias="ProjectReservation.endDate"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{pmsBundle.pms_checkOut}" />
		</f:facet>
		<aon:outputText value="#{to.endDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{pmsBundle.pms_guest}" />
		</f:facet>
		<aon:outputText value="#{to.guestFullName}" />
	</aon:column>

	<aon:column alias="ProjectReservation.agency.name"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{pmsBundle.pms_agency}" />
		</f:facet>
		<aon:outputText value="#{to.agency.registry.fullName}" />
	</aon:column>

	<aon:column alias="ProjectReservation.status"
		styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_status}" />
		</f:facet>
		<aon:outputText value="#{to.status}" />
	</aon:column>

</ui:composition>
