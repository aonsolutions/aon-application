<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="posFinanceSearch">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{pmsBundle.pms_posFinance_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="controller" value="#{posFinance}" />
			</ui:include>
				
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="skipAfterSearch" value="#{true}" />
				<ui:param name="controller" value="#{posFinance}" />
				<ui:param name="searchController" value="#{posFinanceSearch}" />

				<ui:define name="searchContent">
				
					<aon:outputLabel for="PosFinance_hotel" 
						value="#{pmsBundle.pms_hotel}" />
					<aon:selectOneMenu id="PosFinance_hotel" 
						value="#{searchController.hotel}" required="true">
						<f:selectItems value="#{pmsCollections.currentUserHotels}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="PosFinance_dueDate_from"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
						<aon:selectInputDate id="PosFinance_dueDate_from"
							value="#{searchController.startDate}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
						<aon:outputLabel for="PosFinance_dueDate_to"
							styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="PosFinance_dueDate_to"
							value="#{searchController.endDate}" required="true"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>

					<aon:outputLabel for="PosFinance_payMethod" 
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneMenu id="PosFinance_payMethod"
						value="#{searchController.payMethod}" required="true">
						<f:selectItems value="#{configCollections.directPayMethods}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{pmsBundle.pms_shift}" />
					<aon:selectOneMenu  
						value="#{searchController.shift}">
						<f:selectItem itemLabel=" - " itemValue="#{null}" />
						<f:selectItems value="#{pmsCollections.shifts}" />
					</aon:selectOneMenu>

				</ui:define>
			</ui:decorate>				
		</aon:form>

	</ui:define>
</ui:composition>
