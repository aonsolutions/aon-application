<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputLabel for="DataAttachment_source"
		value="#{bundle.aon_type}" />
	<aon:selectOneMenu id="DataAttachment_source" required="true"
		valueChangeListener="#{controller.addExpression}"
		converter="aon.EnumConverter">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{NAVdataTransmission.navSources}" />
	</aon:selectOneMenu>

	<aon:outputLabel value="#{bundle.aon_date}" />
	<aon:div>
		<aon:outputLabel for="DataAttachment_creationDate-From"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_from}" />
		<aon:selectInputDate id="DataAttachment_creationDate-From"
			value="#{searchController.creationDateFrom}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
		<aon:outputLabel for="DataAttachment_creationDate-To"
			styleClass="aon-italic aon-margin-right" value="#{bundle.aon_date_to}" />
		<aon:selectInputDate id="DataAttachment_creationDate-To"
			value="#{searchController.creationDateTo}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
	</aon:div>

	<aon:outputLabel for="DataAttachment_description"
		value="#{bundle.aon_description}" />
	<aon:inputText id="DataAttachment_description" size="37"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputText value="#{bundle.aon_action}"/>
	<aon:selectManyCheckbox value="#{searchController.attachmentTypes}">
		<f:selectItems value="#{NAVdataTransmission.navTypes}"/>
	</aon:selectManyCheckbox>

</ui:composition>
