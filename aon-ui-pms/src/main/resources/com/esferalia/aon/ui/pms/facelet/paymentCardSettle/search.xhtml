<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="paymentCardSettleSearch">
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.pms_paymentCardSettle_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_search}" />
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>
					
					<aon:panelGrid columns="2" >
						<aon:outputText value="" />
						<aon:div style="width:600px;">
						
							<aon:panelCollapsible expanded="true" label="#{bundle.finance_finance}" id="FinanceSearchPanel">
								<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/searchFinance.xhtml" />
							</aon:panelCollapsible>

							<aon:panelCollapsible expanded="true" label="#{bundle.aon_reservation}">
								<ui:include src="/com/esferalia/aon/ui/pms/facelet/paymentCardSettle/searchReservation.xhtml" />
							</aon:panelCollapsible>			

						</aon:div>

						<aon:outputText value="&#160;" />
						<aon:commandButton id="search" ignoreDupResponses="true"
							value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
							action="paymentCardSettle_list"
							actionListener="#{paymentCardSettle.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />

					</aon:panelGrid>
					
				</aon:div>
			</aon:div>
				
		</aon:form>

		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />

	</ui:define>
</ui:composition>
