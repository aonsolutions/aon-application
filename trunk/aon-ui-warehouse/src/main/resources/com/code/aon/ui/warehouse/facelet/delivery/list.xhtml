<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="deliveryList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{warehouseBundle.warehouse_delivery_module}" />
				<ui:param name="controller" value="#{delivery}" />
				<ui:define name="additionalToolbarContent">
					<h:commandLink id="delivery_excel" value="&#160;" 
						target="_new" rendered="#{!delivery.new}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="deliveryList2" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink id="delivery" value="#{warehouseBundle.warehouse_list_report}"
						target="_new" rendered="#{!delivery.new}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="deliveryList2" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
					<h:commandLink id="detailledDelivery_excel" value="&#160;"
						target="_new" rendered="#{!delivery.new}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="deliveryDetailledList" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink id="detailledDelivery" value="#{warehouseBundle.warehouse_detailled_list_report}"
						target="_new" rendered="#{!delivery.new}"
						action="#{report.onExecute}" 
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="deliveryDetailledList" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{delivery}" />
					<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn" />
					<ui:define name="columns">
						<aon:column>
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
							</f:facet>
							<aon:outputText value="#{to.referenceCode}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.issueTime}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<h:outputText value="#{customerBundle.customer_customer}" />
							</f:facet>
							<aon:outputText value="#{to.customer.registry.fullName}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<h:outputText value="#{bundle.aon_company_document}" />
							</f:facet>
							<aon:outputText value="#{to.customer.registry.document}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_total}" />
							</f:facet>
							<aon:outputText value="#{delivery.deliveryTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
