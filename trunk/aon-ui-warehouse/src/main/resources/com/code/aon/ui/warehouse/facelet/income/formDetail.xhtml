<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="dataTableId" value="incomeDetails" />
		<ui:param name="controller" value="#{incomeDetail}" />
		<ui:param name="rows" value="0" />
		<ui:param name="showNote" value="false" />
		<ui:param name="showDataScroller" value="false" />
		<ui:param name="skipResetButton" value="#{!income.pending or (aonRole.warehouseOperator and !aonRole.purchaseOperator)}" />
		
		<!-- WAREHOUSE ACCESS IN READ-ONLY WITH REMOVE OPTION -->
		<ui:param name="readOnly" value="#{aonRole.warehouseOperator and !aonRole.purchaseOperator}" />	
		<ui:param name="skipSaveButton" value="#{readOnly}" />		
		<ui:param name="skipCancelButton" value="#{readOnly}" />
		<ui:param name="skipRemoveButton" value="#{readOnly}" />	
		
		<ui:param name="skipLineEdition" value="#{true}" />
		<ui:param name="rowSelectorReRender" value="menuExt" />
		<ui:param name="resetButtonReRender" value="menuExt" />
		<ui:param name="newCancelButtonReRender" value="menuExt" />
		<ui:param name="cancelButtonReRender" value="menuExt" />
		<ui:param name="newSaveButtonReRender" value="menuExt,Income_total" />
		<ui:param name="saveButtonReRender" value="menuExt,Income_total" />
		<ui:param name="removeButtonReRender" value="menuExt,Income_total" />
		<ui:param name="focusOnAdd" value="Item_id-New" />
		<ui:param name="focusOnSelect" value="Item_id" />
		<ui:define name="beginFormListContent">
			<aon:commandLink id="#{dataTableId}-selectButton"
				styleClass="aon-table-row-link" value="&#160;"
				immediate="true" ajaxSingle="true" requestDelay="100"
				rendered="#{income.pending}"
				actionListener="#{incomeDetail.onSelect}"
				onkeyup="#{dataTableId}KeyUp(this)"
				onfocus="#{dataTableId}SelectRow(this)"
				onblur="#{dataTableId}DeselectRow(this)"
				focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
			</aon:commandLink>
		</ui:define>
		<ui:define name="beforeEditLineButtons" >
			<c:if test="#{aonRole.warehouseOperator and !aonRole.purchaseOperator}" >
				<aon:commandButton
					id="#{dataTableId}-cancel" title="#{bundle.aon_cancel} (#{bundle.aon_key_cancel_line_accelerator})"
					action="#{cancelEditAction}" actionListener="#{cancelEditActionListener}"
					immediate="true" reRender="#{cancelButtonReRender}"
					styleClass="aon-editDataTable-button aon-icon-cancel"
					accesskey="#{bundle.aon_key_cancel_line}" />
				<aon:confirmButton
					id="#{dataTableId}-remove" title="#{bundle.aon_remove} (#{bundle.aon_key_remove_line_accelerator})"
					immediate="true"  
					reRender="#{dataTableId}Div#{(removeButtonReRender != null)?',':''}#{removeButtonReRender}"
					confirmTitle="#{bundle.aon_confirm_title}"
					confirmMessage="#{bundle.aon_remove_confirm}"
					confirmActionListener="#{removeActionListener}"
					confirmAction="#{removeAction}"
					styleClass="aon-editDataTable-button aon-icon-delete"
					accesskey="#{bundle.aon_key_remove_line}" />
			</c:if>				
		</ui:define>

		<ui:define name="columns">
		
			<c:if test="#{!income.pending or (aonRole.warehouseOperator and !aonRole.purchaseOperator)}" >
				<aon:column id="#{dataTableId}-selectColumn" 
					styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:div rendered="#{formList}" layout="none">
						<aon:commandLink id="#{dataTableId}-selectButton"
							styleClass="aon-table-row-link" value="&#160;"
							immediate="true" ajaxSingle="true" requestDelay="100"
							rendered="#{income.pending}"
							actionListener="#{incomeDetail.onSelect}"
							onkeyup="#{dataTableId}KeyUp(this)"
							onfocus="#{dataTableId}SelectRow(this)"
							onblur="#{dataTableId}DeselectRow(this)"
							focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
						</aon:commandLink>
					</aon:div>					
				</aon:column>
			</c:if>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
				<f:facet name="header">
					<aon:outputLabel for="IncomeDetail_line" value="#{warehouseBundle.warehouse_income_detail_line}" />
				</f:facet>
				<aon:outputText value="#{to.line}"
					rendered="#{formList or readOnly}" />
				<aon:inputText id="IncomeDetail_line" 
					value="#{controller.to.line}" rendered="#{formEdit and !readOnly}"
					required="true" size="1" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText id="IncomeDetail_line-New" 
						value="#{controller.to.line}" rendered="#{formNew}"
						required="true" size="1" maxlength="3" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputLabel for="Item_id" value="#{productBundle.product_item}" />
				</f:facet>
				<aon:outputText value="#{to.description}"
					rendered="#{formList or readOnly}">
					<aon:abbreviateConverter maxWidth="64" />
				</aon:outputText>
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
					<ui:param name="lookupTo" value="#{incomeDetail.to.item}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipGoToButton" value="#{!aonRole.config}" />
					<ui:param name="skipNewButton" value="#{!aonRole.config}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="skipSuggestText" value="#{incomeDetail.to.item != null and incomeDetail.to.item.id != null}" />
					<ui:param name="lookupInputOnFocus" value="IncomeDetail_description" />
					<ui:param name="lookupRendered" value="#{formEdit and !readOnly}" />
					<ui:param name="lookupDisabled" value="#{!controller.editable}" />
					<ui:param name="lookupReRender" 
						value="incomeDetailItemEdit,IncomeDetail_quantity,IncomeDetail_price,IncomeDetail_amount" />
					<aon:methodParam name="lookupChangeListener"
						value="#{incomeDetail.onItemChanged}" type="lookupChangeListener" />
				</ui:include>
				<aon:panelGroup id="incomeDetailItemEdit" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formEdit and !readOnly}">
					<aon:inputTextarea id="IncomeDetail_description" 
						value="#{incomeDetail.to.description}"
						rendered="#{incomeDetail.to.item != null and incomeDetail.to.item.id != null}"
						cols="60" rows="#{!incomeDetail.longDescription?1:5}"
						style="#{!incomeDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
						<f:validateLength maximum="1024" />
					</aon:inputTextarea>
					<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
						actionListener="#{incomeDetail.onShortDescription}" reRender="IncomeDetail_description"
						rendered="#{incomeDetail.longDescription and incomeDetail.to.item.product.code != null}" />
					<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
						actionListener="#{incomeDetail.onLongDescription}" reRender="IncomeDetail_description"
						rendered="#{!incomeDetail.longDescription and incomeDetail.to.item.product.code != null}" />
				</aon:panelGroup>
				<f:facet name="footer">
					<aon:div>
						<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{incomeDetail.to.item}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="skipGoToButton" value="#{!aonRole.config}" />
							<ui:param name="skipNewButton" value="#{!aonRole.config}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="skipSuggestText" value="#{incomeDetail.to.item != null and incomeDetail.to.item.id != null}" />
							<ui:param name="lookupInputOnFocus" value="IncomeDetail_description-New" />
							<ui:param name="lookupSuffix" value="-New" />
							<ui:param name="lookupRendered" value="#{formNew}" />
							<ui:param name="lookupReRender" 
								value="incomeDetailItemNew,IncomeDetail_quantity-New,IncomeDetail_price-New,IncomeDetail_amount-New" />
							<aon:methodParam name="lookupChangeListener"
								value="#{incomeDetail.onItemChanged}" type="lookupChangeListener" />
						</ui:include>
						<aon:panelGroup id="incomeDetailItemNew" styleClass="aon-nowrap aon-vertical-align-top" rendered="#{formNew}">
							<aon:inputTextarea id="IncomeDetail_description-New" 
								value="#{incomeDetail.to.description}"
								rendered="#{incomeDetail.to.item != null and incomeDetail.to.item.id != null}"
								cols="60" rows="#{!incomeDetail.longDescription?1:5}"
								style="#{!incomeDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
								<f:validateLength maximum="1024" />
							</aon:inputTextarea>
							<aon:commandButton styleClass="aon-icon aon-icon-edit-end"
								actionListener="#{incomeDetail.onShortDescription}" reRender="IncomeDetail_description-New"
								rendered="#{incomeDetail.longDescription and incomeDetail.to.item.product.code != null}" />
							<aon:commandButton styleClass="aon-icon aon-icon-edit-add"
								actionListener="#{incomeDetail.onLongDescription}" reRender="IncomeDetail_description-New"
								rendered="#{!incomeDetail.longDescription and incomeDetail.to.item.product.code != null}" />
						</aon:panelGroup>
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="IncomeDetail_quantity" value="#{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}"
					rendered="#{formList or !controller.modelEditable or readOnly}">
					<f:convertNumber pattern="#{bundle.aon_quantity_pattern}" />
				</aon:outputText>
				<aon:inputText id="IncomeDetail_quantity" 
					value="#{controller.to.quantity}" rendered="#{formEdit and controller.editable and !readOnly}"
					reRender="IncomeDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="IncomeDetail_quantity-New" 
						value="#{controller.to.quantity}" rendered="#{formNew}" 
						reRender="IncomeDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="IncomeDetail_price" value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}"
					rendered="#{formList or !aonRole.purchaseOperator or readOnly}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:inputText id="IncomeDetail_price" 
					value="#{controller.to.price}" rendered="#{formEdit and aonRole.purchaseOperator and !readOnly}"
					reRender="IncomeDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="IncomeDetail_price-New" 
						value="#{controller.to.price}" rendered="#{formNew and aonRole.purchaseOperator}"
						reRender="IncomeDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="IncomeDetail_discount" value="#{bundle.aon_discount}" />
				</f:facet>
				<aon:outputText value="#{to.discountExpression.discountExpr}"
					rendered="#{formList or !aonRole.purchaseOperator or readOnly}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:inputText id="IncomeDetail_discount" 
					value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit and aonRole.purchaseOperator and !readOnly}"
					reRender="IncomeDetail_amount" 
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="IncomeDetail_discount-New" 
						value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew and aonRole.purchaseOperator}"
						reRender="IncomeDetail_amount-New" 
						required="true" size="5" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="IncomeDetail_amount" value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText value="#{controller.modelAmount}"
					rendered="#{formList or readOnly}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:outputText id="IncomeDetail_amount" 
					value="#{controller.amount}" rendered="#{formEdit and !readOnly}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:outputText id="IncomeDetail_amount-New" 
							value="#{controller.amount}" rendered="#{formNew}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
						<aon:outputText id="Income_taxableBase" 
							value="#{income.taxableBase}" rendered="#{!formNew}">
							<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
				<f:facet name="header">
					<aon:outputLabel value="INFO" />
				</f:facet>
				<aon:commandLink id="incomeDetailSourceLink" immediate="true"
					styleClass="aon-button-goto" style="padding-right: 20px;"
					value="&#160;" title="#{bundle.aon_go}" 
					rendered="#{to.purchaseDetail != null and to.purchaseDetail.id != null}" 
					actionListener="#{controller.onLoadPurchase}"
					action="purchase_form"
					reRender="aonContent">
					<rich:toolTip value="#{controller.lineSourceInfo}" />
				</aon:commandLink>
				<aon:commandButton id="incomeDetailProject" value="&#160;"
					styleClass="#{(to.project != null and to.project.id == income.to.project.id) ? 
									('aon-icon-commandButton aon-icon-project-ok') : ('aon-icon-commandButton aon-icon-project-warn')}"
					rendered="#{to.project != null and to.project.id != null}"
					actionListener="#{controller.onIncomeDetailProjectShow}" 
					reRender="showProjectWindow">
					<rich:toolTip value="#{projectLabel} #{to.project.name}" />
					<f:setPropertyActionListener target="#{income.showProjectWindow}"
						value="#{income.pending}" />								
					<f:setPropertyActionListener target="#{income.showDetailProjectWindow}"
						value="#{income.pending}" />								
				</aon:commandButton>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
