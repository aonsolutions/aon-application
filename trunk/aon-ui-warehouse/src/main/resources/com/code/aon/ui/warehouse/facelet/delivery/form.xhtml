<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="deliveryForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{warehouseBundle.warehouse_delivery_module}" />
					<ui:param name="controller" value="#{delivery}" />
					<ui:param name="skipSaveButton" value="#{!delivery.pending}" />
					<ui:param name="skipRemoveButton" value="#{!delivery.pending}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton id="salesTransfer"
							value="#{warehouseBundle.warehouse_delivery_sales}"
							immediate="#{true}" rendered="#{!delivery.new and delivery.pending}"
							styleClass="aon-finding-toolbar-item aon-icon-sincronize"
							actionListener="#{delivery.onSalesTransferShow}"
							reRender="showSalesTransferWindow">
							<f:setPropertyActionListener target="#{delivery.showSalesTransferWindow}"
								value="#{true}" />
						</aon:commandButton>
						<aon:commandButton id="invoice"
							value="#{warehouseBundle.warehouse_delivery_to_invoice}"
							immediate="#{true}" rendered="#{delivery.pending and deliveryDetail.model.rowCount > 0}"
							styleClass="aon-finding-toolbar-item aon-icon-favorite"
							actionListener="#{delivery.onInvoiceShow}"
							reRender="showInvoiceWindow">
							<f:setPropertyActionListener target="#{delivery.showInvoiceWindow}"
								value="#{true}" />
						</aon:commandButton>
						<h:commandLink id="valuableDelivery" value="#{warehouseBundle.warehouse_delivery_detail_valuated}"
							target="_new" rendered="#{!delivery.new}"
							action="#{report.onExecute}" 
							disabled="#{deliveryDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="delivery" />
							<f:param name="outputFormat" value="PDF" />
							<f:setPropertyActionListener target="#{delivery.valuableDelivery}"
								value="#{true}" />
						</h:commandLink>
						<h:commandLink id="delivery" value="#{warehouseBundle.warehouse_delivery_detail_no_valuated}"
							target="_new" rendered="#{!delivery.new}"
							action="#{report.onExecute}" 
							disabled="#{deliveryDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="delivery" />
							<f:param name="outputFormat" value="PDF" />
							<f:setPropertyActionListener target="#{delivery.valuableDelivery}"
								value="#{false}" />
						</h:commandLink>					
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Delivery_series-New"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:selectOneMenu id="Delivery_series-New" 
							value="#{delivery.to.series}" rendered="#{delivery.new}"
							valueChangeListener="#{delivery.onSeriesChanged}" 
							reRender="Delivery_number,Delivery_securityLevel">
							<f:selectItem itemLabel=" " itemValue="#{null}" />
							<f:selectItems value="#{configCollections.seriesIds}" />
						</aon:selectOneMenu>
						<aon:inputText id="Delivery_series-Edit" 
							value="#{delivery.to.series}" rendered="#{!delivery.new}" 
							disabled="true" size="4" />
						<aon:inputText id="Delivery_number" styleClass="aon-margin-left" 
							value="#{delivery.to.number}" disabled="#{!delivery.new}" 
							required="true" size="7" />

						<aon:selectOneMenu id="Delivery_securityLevel" styleClass="aon-margin-left"
							value="#{delivery.to.securityLevel}" disabled="#{!delivery.pending}">
							<f:selectItems value="#{commonCollections.securityLevels}" />
						</aon:selectOneMenu>

						<aon:outputText styleClass="aon-margin-left"
							value="#{delivery.to.status}" />
						<aon:outputText styleClass="aon-italic aon-margin-left"
							value="(#{financeBundle.finance_invoice}:"
							rendered="#{delivery.invoiced}" />
						<aon:outputText styleClass="aon-bold"
							value="#{delivery.invoiceCode}"
							rendered="#{delivery.invoiced}" />
						<aon:outputText styleClass="aon-italic" value=")"
							rendered="#{delivery.invoiced}" />
 					</aon:div>

					<aon:outputLabel for="Delivery_issueTime" 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Delivery_issueTime"
						value="#{delivery.to.issueTime}" 
						required="true" disabled="#{!delivery.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Customer_id" 
						value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="Customer_id" 
								value="#{delivery.to.customer.registry.id}"
								disabled="#{!delivery.pending}" size="5" 
								lookupProperty="registry" lookup="#{customerLookup}" 
								lookupChangeListener="#{delivery.customerData}" 
								reRender="Customer_full_name,Customer_registry_document,DeliveryAddress,Delivery_scope,Delivery_defaultPayMethod,payMethodDiv"
								ajaxSingle="true" required="true" />
							<aon:lookupButton
								windowTitle="#{customerBundle.customer_selection}"
								disabled="#{!delivery.pending}" minHeight="460" minWidth="650"
								property="#{delivery.to.customer.registry}" lookupProperty="registry" lookup="#{customerLookup}" 
								lookupChangeListener="#{delivery.customerData}" 
								selectReRender="Customer_id,Customer_full_name,Customer_registry_document,DeliveryAddress,Delivery_scope,Delivery_defaultPayMethod,payMethodDiv"
								actionType="search">
							</aon:lookupButton>
							<aon:inputText id="Customer_full_name" 
								value="#{(delivery.to.customer.registry.fullName!=null)?(delivery.to.customer.registry.fullName):('')}"
								disabled="true" size="60" />
						</a4j:region>
					</aon:div>

					<aon:outputLabel for="Customer_registry_document" 
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Customer_registry_document" 
						value="#{delivery.to.customer.registry.document}"
						disabled="true" size="10" />

					<aon:outputLabel for="Delivery_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="DeliveryAddress">
						<aon:selectOneMenu id="Delivery_address" 
							value="#{delivery.to.raddress}" rendered="#{delivery.addressCount > 0}"
							disabled="#{!delivery.pending}">
							<f:selectItems value="#{delivery.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{registryBundle.registry_no_address_available}"
							rendered="#{delivery.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Delivery_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Delivery_scope" 
						value="#{delivery.to.scope}"
						disabled="#{!delivery.pending}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Delivery_warehouse" 
						value="#{warehouseBundle.warehouse_warehouse}" />
					<aon:selectOneMenu id="Delivery_warehouse" 
						value="#{delivery.warehouse}"
						disabled="#{!delivery.pending}">
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Delivery_workPlace" 
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Delivery_workPlace" 
						value="#{delivery.to.workPlace}"
						disabled="#{!delivery.pending}">
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Delivery_defaultPayMethod" 
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneRadio id="Delivery_defaultPayMethod" 
						value="#{delivery.defaultPayMethod}"
						disabled="#{!delivery.pending}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{warehouseBundle.warehouse_delivery_customer_pay_method}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{warehouseBundle.warehouse_delivery_define_another_one}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Delivery_total" 
						value="#{bundle.aon_total}" />
					<aon:outputText id="Delivery_total" styleClass="aon-bold" 
						value="#{delivery.totalPrice}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:panel rendered="#{delivery.defaultPayMethod != null and !delivery.defaultPayMethod}">
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_pay_method}" />
						</f:facet>
						<aon:panelGrid columns="7" style="width:100%; font-size:0.9em;"
							rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
							columnClasses="aon-panelGrid-even aon-width-200,
								aon-panelGrid-even aon-width-80,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-110,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-auto,
								aon-panelGrid-even aon-width-200">

							<aon:outputText value="#{bundle.aon_type}"/>
							<aon:outputText value="#{registryBundle.registry_number_of_payments}" />
							<aon:outputText value="#{registryBundle.registry_days_to_first_payment}" />
							<aon:outputText value="#{registryBundle.registry_days_between_payments}" />
							<aon:outputText value="#{registryBundle.registry_payment_days}" />
							<aon:outputText value="#{configBundle.config_bank}" />
							<aon:outputText value="#{configBundle.config_bank_account}" />

							<aon:selectOneMenu id="Delivery_payMethod" 
								value="#{delivery.to.payMethod}"
								disabled="#{!delivery.pending}">
								<f:selectItems value="#{configCollections.payMethods}" />
							</aon:selectOneMenu>
							<aon:inputText id="Delivery_numberOfPayments"
								value="#{delivery.to.numberOfPayments}"
								disabled="#{!delivery.pending}" size="5" >
								<f:validateLongRange minimum="1" />
							</aon:inputText>	
							<aon:inputText id="Delivery_daysToFirstPayment"
								value="#{delivery.to.daysToFirstPayment}"
								disabled="#{!delivery.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Delivery_daysBetweenPayments"
								value="#{delivery.to.daysBetweenPayments}"
								disabled="#{!delivery.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Delivery_paymentDays"
								value="#{delivery.to.paymentDays}" 
								disabled="#{!delivery.pending}" size="5" />
							<aon:div styleClass="aon-lookup">
								<a4j:region>
									<aon:lookupInputText id="Delivery_bank_code"
										value="#{delivery.to.bank.code}"
										disabled="#{!delivery.pending}" size="5"
										property="#{delivery.to.bank}" lookup="#{bankLookup}"
										reRender="Delivery_bank_name">
										<aon:joinProperty alias="Bank_code" value="#{delivery.to.bank.code}" />
									</aon:lookupInputText>
									<aon:lookupButton 
										windowTitle="#{configBundle.config_bank_selection}"
										disabled="#{!delivery.pending}" minHeight="460" minWidth="650"
										property="#{delivery.to.bank}" lookup="#{bankLookup}"
										selectReRender="Delivery_bank_code,Delivery_bank_name"
										actionType="search">
									</aon:lookupButton>
									<aon:inputText id="Delivery_bank_name"
										value="#{delivery.to.bank.name}"
										disabled="true" size="40" />							
								</a4j:region>
							</aon:div>
							<aon:div>
								<aon:inputText id="Delivery_bank_office"
									value="#{delivery.to.bankAccount.office}"
									disabled="#{!delivery.pending}" size="4" maxlength="4">
									<f:validateLength minimum="4" maximum="4" />
								</aon:inputText>
								<aon:inputText id="Delivery_bank_control"
									value="#{delivery.to.bankAccount.control}"
									disabled="#{!delivery.pending}" size="2" maxlength="2">
									<f:validateLength minimum="2" maximum="2" />
								</aon:inputText>
								<aon:inputText id="Delivery_bank_account"
									value="#{delivery.to.bankAccount.account}"
									disabled="#{!delivery.pending}" size="10" maxlength="10">
									<f:validateLength minimum="10" maximum="10" />
								</aon:inputText>
							</aon:div>

						</aon:panelGrid>
					</aon:panel>
				</aon:div>

				<aon:div styleClass="aon-padding-top">
					<aon:panel rendered="#{!delivery.new}">
						<f:facet name="header">
							<aon:outputText value="#{warehouseBundle.warehouse_delivery_detail}" />
						</f:facet>
						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
							<ui:param name="dataTableId" value="deliveryDetails" />
							<ui:param name="controller" value="#{deliveryDetail}" />
							<ui:param name="rows" value="0" />
							<ui:param name="showNote" value="false" />
							<ui:param name="showDataScroller" value="false" />
							<ui:param name="skipResetButton" value="#{!delivery.pending}" />
							<ui:param name="skipLineEdition" value="#{!delivery.pending}" />
							<ui:param name="skipSaveButton" value="#{deliveryDetail.salesSource}" />
							<ui:param name="rowSelectorReRender" value="menuExt" />
							<ui:param name="resetButtonReRender" value="menuExt" />
							<ui:param name="newCancelButtonReRender" value="menuExt" />
							<ui:param name="cancelButtonReRender" value="menuExt" />
							<ui:param name="newSaveButtonReRender" value="menuExt,Delivery_total" />
							<ui:param name="saveButtonReRender" value="menuExt,Delivery_total" />
							<ui:param name="removeButtonReRender" value="menuExt,Delivery_total" />
							<ui:param name="focusOnAdd" value="DeliveryDetail_item_product_code-New" />
							<ui:param name="focusOnSelect" value="DeliveryDetail_item_product_code" />

							<ui:define name="columns">

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
									<f:facet name="header">
										<aon:outputLabel value="#{warehouseBundle.warehouse_delivery_detail_line}" />
									</f:facet>
									<aon:outputText value="#{to.line}"
										rendered="#{formList}" />
									<aon:inputText id="DeliveryDetail_line" 
										value="#{controller.to.line}" rendered="#{formEdit}"
										required="true" size="2" maxlength="3" />
									<f:facet name="footer">
										<aon:inputText id="DeliveryDetail_line-New" 
											value="#{controller.to.line}" rendered="#{formNew}"
											required="true" size="2" maxlength="3" />
									</f:facet>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
									<f:facet name="header">
										<aon:outputLabel value="#{productBundle.product_item}" />
									</f:facet>
									<aon:outputText value="#{to.description}"
										rendered="#{formList}">
										<aon:abbreviateConverter maxWidth="64" />
									</aon:outputText>
									<aon:div id="deliveryDetailItemEdit" styleClass="aon-lookup" rendered="#{formEdit}">
										<a4j:region>
											<aon:lookupInputText id="DeliveryDetail_item_product_code" 
												value="#{deliveryDetail.to.item.product.code}"
												lookup="#{itemLookup}" 
												lookupChangeListener="#{deliveryDetail.onItemChanged}" 
												reRender="deliveryDetailItemEdit,DeliveryDetail_price,DeliveryDetail_discount,DeliveryDetail_amount"  
												ajaxSingle="false" required="true" size="10"
												onblur="toUpperCase(this);" focus="DeliveryDetail_item_product_name">
												<aon:joinProperty alias="Item_product_code"	value="#{deliveryDetail.to.item.product.code}" />
											</aon:lookupInputText>
											<aon:lookupButton
												windowTitle="#{productBundle.product_item_selection}"
												minHeight="460" minWidth="650" 
												property="#{deliveryDetail.to.item}" lookup="#{itemLookup}"
												lookupChangeListener="#{deliveryDetail.onItemChanged}"
												selectReRender="deliveryDetailItemEdit,DeliveryDetail_price,DeliveryDetail_discount,DeliveryDetail_amount"
												actionType="search">
											</aon:lookupButton>
											<aon:inputTextarea id="DeliveryDetail_item_product_name" 
												value="#{deliveryDetail.to.description}"
												cols="64" rows="#{!deliveryDetail.longDescription?1:5}"
												style="#{!deliveryDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
												<f:validateLength maximum="1024" />
											</aon:inputTextarea>
										</a4j:region>
										<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
											actionListener="#{deliveryDetail.onShortDescription}" reRender="DeliveryDetail_item_product_name"
											rendered="#{deliveryDetail.longDescription and deliveryDetail.to.item.product.code != null}" />
										<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" immediate="true"
											actionListener="#{deliveryDetail.onLongDescription}" reRender="DeliveryDetail_item_product_name"
											rendered="#{!deliveryDetail.longDescription and deliveryDetail.to.item.product.code != null}" />
									</aon:div>
									<f:facet name="footer">
										<aon:div id="deliveryDetailItemNew" styleClass="aon-lookup" rendered="#{formNew}">
											<a4j:region>
												<aon:lookupInputText id="DeliveryDetail_item_product_code-New" 
													value="#{deliveryDetail.to.item.product.code}"
													lookup="#{itemLookup}" 
													lookupChangeListener="#{deliveryDetail.onItemChanged}" 
													reRender="deliveryDetailItemNew,DeliveryDetail_price-New,DeliveryDetail_discount-New,DeliveryDetail_amount-New"  
													ajaxSingle="false" required="true" size="10"
													onblur="toUpperCase(this);" focus="DeliveryDetail_item_product_name-New">
													<aon:joinProperty alias="Item_product_code"	value="#{deliveryDetail.to.item.product.code}" />
												</aon:lookupInputText>
												<aon:lookupButton
													windowTitle="#{productBundle.product_item_selection}"
													minHeight="460" minWidth="650" 
													property="#{deliveryDetail.to.item}" lookup="#{itemLookup}"
													lookupChangeListener="#{deliveryDetail.onItemChanged}"
													selectReRender="deliveryDetailItemNew,DeliveryDetail_price-New,DeliveryDetail_discount-New,DeliveryDetail_amount-New"
													actionType="search">
												</aon:lookupButton>
												<aon:inputTextarea id="DeliveryDetail_item_product_name-New" 
													value="#{deliveryDetail.to.description}"
													cols="64" rows="#{!deliveryDetail.longDescription?1:5}"
													style="#{!deliveryDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
													<f:validateLength maximum="1024" />
												</aon:inputTextarea>
											</a4j:region>
											<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
												actionListener="#{deliveryDetail.onShortDescription}" reRender="DeliveryDetail_item_product_name-New"
												rendered="#{deliveryDetail.longDescription and deliveryDetail.to.item.product.code != null}" />
											<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" immediate="true"
												actionListener="#{deliveryDetail.onLongDescription}" reRender="DeliveryDetail_item_product_name-New"
												rendered="#{!deliveryDetail.longDescription and deliveryDetail.to.item.product.code != null}" />
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel value="#{bundle.aon_quantity}" />
									</f:facet>
									<aon:outputText value="#{to.quantity}"
										rendered="#{formList}">
										<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
									</aon:outputText>
									<aon:inputText id="DeliveryDetail_quantity" 
										value="#{controller.to.quantity}" rendered="#{formEdit}"
										valueChangeListener="#{controller.onQuantityChanged}" 
										reRender="DeliveryDetail_price,DeliveryDetail_discount,DeliveryDetail_amount" 
										required="true" size="7" focus="DeliveryDetail_price" />
									<f:facet name="footer">
										<aon:inputText id="DeliveryDetail_quantity-New" 
											value="#{controller.to.quantity}" rendered="#{formNew}" 
											valueChangeListener="#{controller.onQuantityChanged}" 
											reRender="DeliveryDetail_price-New,DeliveryDetail_discount-New,DeliveryDetail_amount-New" 
											required="true" size="7" focus="DeliveryDetail_price-New" />
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel value="#{bundle.aon_price}" />
									</f:facet>
									<aon:outputText value="#{to.price}"
										rendered="#{formList}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:inputText id="DeliveryDetail_price" 
										value="#{controller.to.price}" rendered="#{formEdit}"
										reRender="DeliveryDetail_amount" 
										required="true" size="7" />
									<f:facet name="footer">
										<aon:inputText id="DeliveryDetail_price-New" 
											value="#{controller.to.price}" rendered="#{formNew}"
											reRender="DeliveryDetail_amount-New" 
											required="true" size="7" />
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel value="#{bundle.aon_discount}" />
									</f:facet>
									<aon:outputText value="#{to.discountExpression.discountExpr}"
										rendered="#{formList}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:inputText id="DeliveryDetail_discount" 
										value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
										reRender="DeliveryDetail_amount" 
										required="true" size="7" />
									<f:facet name="footer">
										<aon:inputText id="DeliveryDetail_discount-New" 
											value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}"
											reRender="DeliveryDetail_amount-New" 
											required="true" size="7" />
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel value="#{bundle.aon_amount}" />
									</f:facet>
									<aon:outputText value="#{controller.modelAmount}"
										rendered="#{formList}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:outputText id="DeliveryDetail_amount" 
										value="#{controller.amount}" rendered="#{formEdit}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<f:facet name="footer">
										<aon:div style="text-align:right;">
											<aon:outputText id="DeliveryDetail_amount-New" 
												value="#{controller.amount}" rendered="#{formNew}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
											<aon:outputText id="Delivery_taxableBase" 
												value="#{delivery.taxableBase}" rendered="#{!formNew}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
									<f:facet name="header">
										<aon:outputLabel value="INFO" />
									</f:facet>
									<aon:div rendered="#{to.salesDetail != null and to.salesDetail.id != null}" 
										style="display:inline;cursor:pointer;">
										<aon:outputText value="&#160;"
											styleClass="aon-icon-transfer" style="padding-left:20px" />
										<rich:toolTip value="#{controller.lineSourceInfo}" />
									</aon:div>
									<aon:div rendered="#{delivery.invoiced}" style="display:inline;cursor:pointer;">
										<aon:outputText value="&#160;"
											styleClass="aon-icon-predetermine" style="padding-left:20px" />
										<rich:toolTip value="#{controller.lineStatusInfo}" />
									</aon:div>
								</aon:column>
							</ui:define>
						</ui:decorate>
					</aon:panel>
				</aon:div>
			</aon:div>
