<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="deliveryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{warehouseBundle.warehouse_delivery_module}" />
				<ui:param name="controller" value="#{delivery}" />
				<ui:param name="skipSaveButton" value="#{!delivery.pending}" />
				<ui:param name="skipRemoveButton" value="#{!delivery.pending}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="invoice" 
						value="FACTURAR"
						actionListener="#{saleInvoice.onImportDelivery}" action="saleInvoice_list"
						rendered="#{delivery.pending and deliveryDetail.model.rowCount > 0}"
						styleClass="aon-finding-toolbar-item aon-icon-sincronize" />
					<h:commandLink id="delivery" value="#{bundle.aon_report}"
						target="_new" rendered="#{!delivery.new}"
						action="#{report.onExecute}"
						disabled="#{deliveryDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-printer">
						<f:param name="reportKey" value="delivery" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Delivery_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:selectOneMenu id="Delivery_series" value="#{delivery.to.series}"
							rendered="#{delivery.new}"
							valueChangeListener="#{delivery.onSeriesChanged}" reRender="Delivery_number,Delivery_securityLevel">
							<f:selectItem itemValue="" itemLabel=" " />
							<f:selectItems value="#{configCollections.series}" />
						</aon:selectOneMenu>
						<aon:inputText id="Delivery_series-Edit" value="#{delivery.to.series}"
							rendered="#{!delivery.new}" disabled="true" size="4" />
						<aon:inputText id="Delivery_number" value="#{delivery.to.number}"
							required="true" disabled="#{!delivery.new}" size="7"
							styleClass="aon-margin-left" />

						<aon:selectOneMenu id="Delivery_securityLevel" value="#{delivery.to.securityLevel}"
							required="true" disabled="#{!delivery.pending}"
							styleClass="aon-margin-left">
							<f:selectItems value="#{commonCollections.securityLevels}" />
						</aon:selectOneMenu>

						<aon:outputText styleClass="aon-margin-left"
							value="#{delivery.to.status}" />
 					</aon:div>

					<aon:outputLabel for="Delivery_issueTime" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Delivery_issueTime"
						value="#{delivery.to.issueTime}" 
						required="true" disabled="#{!delivery.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Delivery_customer_id" value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Delivery_customer_id" value="#{delivery.to.customer.registry.id}"
							lookup="#{customerLookup}" ajaxSingle="true" reRender="Delivery_customer_full_name,Delivery_customer_registry_document,DeliveryAddress"
							lookupChangeListener="#{delivery.customerData}" lookupProperty="registry"
							required="true" disabled="#{!delivery.pending}" size="5" />
						<aon:lookupButton
							windowTitle="#{customerBundle.customer_selection}" actionType="search"
							property="#{delivery.to.customer.registry}" selectReRender="Delivery_customer_id,Delivery_customer_full_name,Delivery_customer_registry_document,DeliveryAddress"
							lookup="#{customerLookup}" minHeight="460" minWidth="650"
							lookupChangeListener="#{delivery.customerData}" lookupProperty="registry"
							disabled="#{!delivery.pending}">
						</aon:lookupButton>
						<aon:inputText id="Delivery_customer_full_name" 
							value="#{(delivery.to.customer.registry.name!=null)?(delivery.to.customer.registry.fullName):('')}"
							disabled="true" size="50" />
					</aon:div>

					<aon:outputLabel for="Delivery_customer_registry_document" value="#{bundle.aon_company_document}" />
					<aon:inputText id="Delivery_customer_registry_document" value="#{delivery.to.customer.registry.document}"
						disabled="#{!delivery.pending}" size="10" />

					<aon:outputLabel for="Delivery_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="DeliveryAddress">
						<aon:selectOneMenu id="Delivery_address" value="#{delivery.to.raddress}"
							rendered="#{delivery.addressCount > 0}"
							disabled="#{!delivery.pending}">
							<f:selectItems value="#{delivery.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{registryBundle.registry_no_address_available}"
							rendered="#{delivery.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Delivery_warehouse" value="#{warehouseBundle.warehouse_warehouse}" />
					<aon:selectOneMenu id="Delivery_warehouse" value="#{delivery.warehouse}"
						disabled="#{!delivery.pending}">
						<f:selectItems value="#{warehouseCollections.warehouses}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Delivery_total" value="#{bundle.aon_total}" />
					<aon:outputText id="Delivery_total" value="#{delivery.totalPrice}" 
						styleClass="aon-bold">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>
			</aon:div>

			<aon:panel rendered="#{!delivery.new}"
				styleClass="aon-padding-left aon-padding-right">
				<f:facet name="header">
					<aon:outputText value="#{warehouseBundle.warehouse_delivery_detail}" />
				</f:facet>
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="controller" value="#{deliveryDetail}" />
					<ui:param name="rows" value="0" />
					<ui:param name="showNote" value="false" />
					<ui:param name="skipResetButton" value="#{!delivery.pending}" />
					<ui:param name="skipLineEdition" value="#{!delivery.pending}" />
					<ui:param name="newSaveButtonReRender" value="Delivery_total" />
					<ui:param name="saveButtonReRender" value="Delivery_total" />
					<ui:param name="removeButtonReRender" value="Delivery_total" />
					<ui:param name="removeButtonReRender" value="Delivery_total" />
					<ui:param name="focusOnAdd" value="DeliveryDetail_item_product_code-New" />
					<ui:param name="focusOnSelect" value="DeliveryDetail_item_product_code-Edit" />
					<ui:param name="columnClasses"
						value="aon-editDataTable-textColumn,
							aon-editDataTable-numberColumn aon-width-80,
							aon-editDataTable-numberColumn aon-width-80,
							aon-editDataTable-numberColumn aon-width-80,
							aon-editDataTable-numberColumn aon-width-80" />

					<ui:define name="columns">

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{productBundle.product_item}" />
							</f:facet>
							<aon:outputText value="#{to.description}"
								rendered="#{to!=controller.to}" />
							<aon:div styleClass="aon-lookup" rendered="#{to==deliveryDetail.to}">
								<aon:lookupInputText id="DeliveryDetail_item_product_code-Edit" value="#{deliveryDetail.to.item.product.code}"
									lookup="#{itemLookup}" reRender="DeliveryDetail_item_product_name-Edit,DeliveryDetail_price-Edit,DeliveryDetail_discount-Edit,DeliveryDetail_amount-Edit"  
									lookupChangeListener="#{deliveryDetail.onItemChanged}" onblur="toUpperCase(this);"
									required="true" size="10">
									<aon:joinProperty alias="Item_product_code"	value="#{deliveryDetail.to.item.product.code}" />
								</aon:lookupInputText>
								<aon:lookupButton
									windowTitle="#{productBundle.product_item_selection}" actionType="search"
									property="#{deliveryDetail.to.item}" selectReRender="DeliveryDetail_item_product_code-Edit,DeliveryDetail_item_product_name-Edit,DeliveryDetail_price-Edit,DeliveryDetail_discount-Edit,DeliveryDetail_amount-Edit"
									lookup="#{itemLookup}" minHeight="460" minWidth="650"
									lookupChangeListener="#{deliveryDetail.onItemChanged}">
								</aon:lookupButton>
								<aon:inputText id="DeliveryDetail_item_product_name-Edit" 
									value="#{(deliveryDetail.to.item.product.name!=null)?(deliveryDetail.to.item.product.name):('')}"
									disabled="true" size="60" />
							</aon:div>
							<f:facet name="footer">
								<aon:div styleClass="aon-lookup" rendered="#{deliveryDetail.new}">
									<aon:lookupInputText id="DeliveryDetail_item_product_code-New" value="#{deliveryDetail.to.item.product.code}"
										lookup="#{itemLookup}" reRender="DeliveryDetail_item_product_name-New,DeliveryDetail_price-New,DeliveryDetail_discount-New,DeliveryDetail_amount-New"  
										lookupChangeListener="#{deliveryDetail.onItemChanged}" onblur="toUpperCase(this);"
										required="true" size="10">
										<aon:joinProperty alias="Item_product_code"	value="#{deliveryDetail.to.item.product.code}" />
									</aon:lookupInputText>
									<aon:lookupButton
										windowTitle="#{productBundle.product_item_selection}" actionType="search"
										property="#{deliveryDetail.to.item}" selectReRender="DeliveryDetail_item_product_code-New,DeliveryDetail_item_product_name-New,DeliveryDetail_price-New,DeliveryDetail_discount-New,DeliveryDetail_amount-New"
										lookup="#{itemLookup}" minHeight="460" minWidth="650"
										lookupChangeListener="#{deliveryDetail.onItemChanged}">
									</aon:lookupButton>
									<aon:inputText id="DeliveryDetail_item_product_name-New" 
										value="#{(deliveryDetail.to.item.product.name!=null)?(deliveryDetail.to.item.product.name):('')}"
										disabled="true" size="60" />
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_quantity}" />
							</f:facet>
							<aon:outputText value="#{to.quantity}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<aon:inputText id="DeliveryDetail_quantity-Edit" value="#{controller.to.quantity}"
								valueChangeListener="#{controller.onQuantityChanged}" reRender="DeliveryDetail_price-Edit,DeliveryDetail_discount-Edit,DeliveryDetail_amount-Edit" 
								rendered="#{to==controller.to}" required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="DeliveryDetail_quantity-New" value="#{controller.to.quantity}"
									valueChangeListener="#{controller.onQuantityChanged}" reRender="DeliveryDetail_price-New,DeliveryDetail_discount-New,DeliveryDetail_amount-New" 
									rendered="#{controller.new}" required="true" size="7" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_price}" />
							</f:facet>
							<aon:outputText value="#{to.price}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="DeliveryDetail_price-Edit" value="#{controller.to.price}"
								reRender="DeliveryDetail_amount-Edit" 
								rendered="#{to==controller.to}" required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="DeliveryDetail_price-New" value="#{controller.to.price}"
									reRender="DeliveryDetail_amount-New" 
									rendered="#{controller.new}" required="true" size="7" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_discount}" />
							</f:facet>
							<aon:outputText value="#{to.discountExpression.discountExpr}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="DeliveryDetail_discount-Edit" value="#{controller.to.discountExpression.discountExpr}"
								reRender="DeliveryDetail_amount-Edit" 
								rendered="#{to==controller.to}" required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="DeliveryDetail_discount-New" value="#{controller.to.discountExpression.discountExpr}"
									reRender="DeliveryDetail_amount-New" 
									rendered="#{controller.new}" required="true" size="7" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{controller.modelAmount}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:outputText id="DeliveryDetail_amount-Edit" value="#{controller.amount}"
								rendered="#{to==controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div style="text-align:right;">
									<aon:outputText id="DeliveryDetail_amount-New" value="#{controller.amount}"
										rendered="#{controller.new}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:outputText id="Delivery_taxableBase" value="#{delivery.taxableBase}"
										rendered="#{!controller.new}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:panel>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
	</ui:define>
</ui:composition>
