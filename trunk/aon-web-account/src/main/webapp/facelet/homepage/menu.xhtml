<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form>
		<aon:menuBar id="mainMenu"> 
			<aon:dropDownMenu value="#{appBundle.account_masters}">
				<aon:menuItem value="#{appBundle.account_entry}" action="accountEntry" style="color:red;"/>
				<aon:menuSeparator/>
				<aon:menuItem action="account_list" value="#{accountBundle.account_account_module}"/>
				<aon:menuItem action="autConcept" value="#{accountBundle.account_aut_concept_module}"/>
				<aon:menuItem actionListener="#{customer.onEditSearch}" action="customer_search" value="#{customerBundle.customer_module}"/>
				<aon:menuItem actionListener="#{supplier.onEditSearch}" action="supplier_search" value="#{supplierBundle.supplier_module}"/>
				<aon:menuItem actionListener="#{creditor.onEditSearch}" action="creditor_search" value="#{financeBundle.finance_creditor_module}"/>
				<aon:menuItem action="geozone_list" value="#{geozoneBundle.geozone_module}"/>
			</aon:dropDownMenu>
						
			<aon:dropDownMenu value="#{appBundle.account_pred_entries}">
				<aon:menuItem actionListener="#{accountInvoice.onReset}" action="accountInvoiceEntry" value="#{accountBundle.account_invoice_entry}" style="color:red;"/>
				<aon:menuItem actionListener="#{accountExpense.onStart}" action="accountExpenseEntry" value="#{accountBundle.account_expense_entry_module}"/>
				<aon:menuItem actionListener="#{accountSalary.onReset}" action="accountSalaryEntry" value="#{accountBundle.account_salary_entry_module}"/>
				<aon:menuItem actionListener="#{accountSocialInsurance.onReset}" action="accountSocialInsuranceEntry" value="#{accountBundle.account_social_insurance_entry_module}"/>
				<aon:menuItem actionListener="#{accountLoanFee.onReset}" action="accountLoanFeeEntry" value="#{accountBundle.account_loan_fee_entry_module}" />
				<aon:menuItem actionListener="#{accountLeasingFee.onReset}" action="accountLeasingFeeEntry" value="#{accountBundle.account_leasing_fee_entry_module}"/>
				<aon:menuItem value="#{appBundle.account_periodic_entries}" disabled="true"/>
				<aon:menuGroup value="#{appBundle.account_end_period_entries}">
					<aon:menuItem action="accountOperatingEntry" value="#{accountBundle.account_operating_entry_module}"/>
					<aon:menuItem action="accountClosingEntry" value="#{accountBundle.account_closing_entry_module}" />
					<aon:menuItem action="accountOpeningEntry" value="#{accountBundle.account_opening_entry_module}" />
				</aon:menuGroup>
			</aon:dropDownMenu>
			
			<aon:dropDownMenu value="#{appBundle.account_reports}">
				<aon:menuItem actionListener="#{accStatement.onReset}" action="accStatement_search" value="#{appBundle.account_abstract}"/>
				<aon:menuItem actionListener="#{accountEntryReport.onDayBook}" action="accountEntryDaybook" value="#{appBundle.account_daybook}"/>
				<aon:menuItem value="#{appBundle.account_trial_balance}" actionListener="#{accStatement.onReset}" action="trialBalance_search"/>
				<aon:menuItem actionListener="#{accountEntryReport.onProfitAndLoss}" action="profit_and_loss_search" value="#{appBundle.account_profit_and_loss}"/>
				<aon:menuGroup value="#{appBundle.account_balances}">
					<aon:menuItem disabled="true" value="#{appBundle.account_monthly_profit_and_loss}"/>
					<aon:menuItem disabled="true" value="#{appBundle.account_balance_sheet}"/>
					<aon:menuGroup value="#{appBundle.account_official_balances}">
						<aon:menuItem disabled="true" value="#{appBundle.account_profit_and_loss}"/>
						<aon:menuItem disabled="true" value="#{appBundle.account_balance_sheet}"/>
					</aon:menuGroup>
				</aon:menuGroup>
			</aon:dropDownMenu>
			
			<aon:dropDownMenu value="#{appBundle.account_vat}">
				<aon:menuItem disabled="true" value="#{appBundle.account_vat_book}"/>
				<aon:menuItem disabled="true" value="#{appBundle.account_vat_summary}"/>
				<aon:menuItem disabled="true" value="#{appBundle.account_outsiders_operations}"/>
			</aon:dropDownMenu>
			
			<aon:dropDownMenu value="#{appBundle.account_fixed_assets}">
				<aon:menuItem disabled="true" value="#{appBundle.accoung_amortization_form}"/>
				<aon:menuItem disabled="true" value="#{appBundle.accoung_amortization_report}"/>
				<aon:menuItem disabled="true" value="#{appBundle.accoung_amortization_entries}"/>
			</aon:dropDownMenu>

			<aon:dropDownMenu value="#{appBundle.account_budget}">
				<aon:menuItem disabled="true" value="#{appBundle.account_budget_control}"/>
				<aon:menuItem disabled="true" value="#{appBundle.account_budgeted_balance_sheet}"/>
				<aon:menuItem disabled="true" value="#{appBundle.account_compared_budgeted_balance_sheet}"/>
			</aon:dropDownMenu>

			<aon:dropDownMenu value="#{appBundle.account_utilities}">
				<aon:menuItem actionListener="#{accountLoan.onReset}" action="accountLoanEntry" value="#{appBundle.account_loan_entry}"/>
				<aon:menuItem actionListener="#{accountLeasing.onReset}" action="accountLeasingEntry" value="#{appBundle.account_leasing_entry}"/>
				<aon:menuItem style="color:red;" action="regenerateAccountSummary" value="#{appBundle.account_regenerate_summary}"/>
				<aon:menuItem disabled="true" value="#{appBundle.account_transfer}"/>
				<aon:menuItem disabled="true" value="#{appBundle.account_import_data}"/>
				<aon:menuItem disabled="true" value="#{appBundle.account_export_data}"/>
			</aon:dropDownMenu>

			<aon:dropDownMenu value="#{appBundle.account_configuration}">

				<aon:menuItem action="company" actionListener="#{company.onLoad}" value="#{companyBundle.company_data_module} SIN">
					<f:param name="skipTabFolder" value="true"/>
				</aon:menuItem>

				<aon:menuItem action="company" actionListener="#{company.onLoad}" value="#{companyBundle.company_data_module} CON">
				</aon:menuItem>

				<aon:menuItem action="accPeriod" value="#{accountBundle.account_accPeriod_module}"/>
				<aon:menuItem action="defaultParams" actionListener="#{accAppParams.onLoad}" value="#{accountBundle.account_default_params_module}"/>
				<aon:menuItem action="series" value="#{configBundle.config_series_module}"/>
				<aon:menuItem action="tax" value="#{productBundle.product_tax_module}"/>
				<aon:menuItem disabled="true"  value="#{appBundle.account_official_balance_sheet}"/>
				<aon:menuItem disabled="true" value="#{appBundle.account_official_trading_balance}" />
			</aon:dropDownMenu>
		</aon:menuBar>
	</aon:form>
</ui:composition>
