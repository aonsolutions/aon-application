<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:div style="width:100%;text-align:center;margin-top: 20px;">
		<aon:form>
			<aon:div style="width:100%;text-align:center;">
				<aon:div style="width:80%;text-align:left; margin-left: 30px;">
					<aon:panelCollapsible label="#{appBundle.account_pred_entries}">
						<h:panelGrid columns="2" style="width:100%"
							styleClass="aon-text-left"
							columnClasses="aon-column-middle-width,aon-column-middle-width,aon-column-middle-width">

							<aon:div>
								<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
									<aon:outputText
										value="#{accountingBundle.accounting_entry_module}" />
									<aon:commandLink immediate="true"
										actionListener="#{accountEntry.onReset}"
										action="accountEntry_form">
										<aon:outputText value="[#{bundle.aon_reset}]" />
									</aon:commandLink>
									<aon:commandLink immediate="true"
										actionListener="#{accountEntry.onEditSearch}"
										action="accountEntry_search">
										<aon:outputText value="[#{bundle.aon_search}]" />
									</aon:commandLink>
								</aon:div>
							</aon:div>

							<aon:div>
								<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">

									<aon:outputText
										value="#{accountingBundle.accounting_loan_fee_entry_module}" />
									<aon:commandLink immediate="true"
										actionListener="#{loanFeeEntry.onReset}"

										<aon:outputText value="[#{bundle.aon_reset}]" />
									</aon:commandLink>
								</aon:div>
							</aon:div>

							<aon:div>
								<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
									<aon:outputText
										value="#{accountingBundle.accounting_entry_finance_module}" />
									<aon:commandLink immediate="true"
										actionListener="#{financeEntry.onReset}"

										<aon:outputText value="[#{bundle.aon_reset}]" />

										<aon:outputText value="[#{bundle.aon_reset}]" />
									</aon:commandLink>
								</aon:div>
							</aon:div>
						</h:panelGrid>
					</aon:panelCollapsible>

					<aon:panelCollapsible label="#{appBundle.account_masters}">
						<h:panelGrid styleClass="aon-text-left" columns="2"
							style="width:100%; margin-top: 10px;"
							columnClasses="aon-column-middle-width,aon-column-middle-width">

							<aon:div>
								<aon:div styleClass="aonSubMenu aonSubMenuOption">
									<aon:outputText value="#{accountBundle.account_module}" />
									<aon:commandLink immediate="true"
										actionListener="#{account.onReset}" action="account_form">
										<aon:outputText value="[#{bundle.aon_reset}]" />
									</aon:commandLink>
									<aon:commandLink immediate="true"
										actionListener="#{account.onEditSearch}"
										action="account_search">
										<aon:outputText value="[#{bundle.aon_search}]" />
									</aon:commandLink>
								</aon:div>
							</aon:div>

							<aon:div>
								<aon:div styleClass="aonSubMenu aonSubMenuOption">
									<aon:outputText value="#{customerBundle.customer_module}" />
									<aon:commandLink immediate="true"
										actionListener="#{customer.onReset}" action="customer_form">
										<aon:outputText value="[#{bundle.aon_reset}]" />
										<f:setPropertyActionListener value="#{true}" 
											target="#{customer.showAccount}" />
									</aon:commandLink>
									<aon:commandLink immediate="true"
										actionListener="#{customer.onEditSearch}"
										action="customer_search">
										<aon:outputText value="[#{bundle.aon_search}]" />
										<f:setPropertyActionListener value="#{true}" 
											target="#{customer.showAccount}" />
									</aon:commandLink>
								</aon:div>
							</aon:div>

							<aon:div>
								<aon:div styleClass="aonSubMenu aonSubMenuOption">
									<aon:outputText value="#{accountingBundle.accounting_aut_concept_module}" />
									<aon:commandLink immediate="true"
										actionListener="#{autConcept.onSearch}"
										action="autConcept">
										<aon:outputText value="[#{bundle.aon_search}]" />
									</aon:commandLink>
								</aon:div>
							</aon:div>

							<aon:div>
								<aon:div styleClass="aonSubMenu aonSubMenuOption">
									<aon:outputText value="#{supplierBundle.supplier_module}" />
									<aon:commandLink immediate="true"
										actionListener="#{supplier.onReset}" action="supplier_form">

							</aon:div>

								</aon:div>
							</aon:div>

					<aon:panelCollapsible label="#{appBundle.account_reports}">

							style="width:100%; margin-top: 10px;"
							columnClasses="aon-column-middle-width,aon-column-middle-width">
							<aon:div>
								<aon:div styleClass="aonSubMenu aonSubMenuOptionReport">
									<aon:outputText
										value="#{accountingBundle.accounting_statement_module}" />
									<aon:commandLink immediate="true"
										actionListener="#{trialBalance.onReset}"
										action="account_statement_search">
										<aon:outputText value="[#{bundle.aon_listing}]" />
									</aon:commandLink>
								</aon:div>
							</aon:div>

							<aon:div>
								<aon:div styleClass="aonSubMenu aonSubMenuOptionReport">

									<aon:commandLink immediate="true"

										value="#{accountingBundle.accounting_profit_and_loss_module}" />
									<aon:commandLink immediate="true"
										actionListener="#{profitAndLossReport.onEditSearch}"
										action="profit_and_loss_search">
										<aon:outputText value="[#{bundle.aon_listing}]" />
									</aon:commandLink>
								</aon:div>
							</aon:div>
