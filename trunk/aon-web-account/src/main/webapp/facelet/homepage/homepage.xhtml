<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core">

	<aon:div style="width:100%;text-align:center;margin-top: 20px;">
		<aon:form>
			<aon:div style="width:80%;text-align:left;">
				<aon:panelCollapsible
					label="#{menuBundle.account_predefined_entries}">
					<h:panelGrid columns="2" style="width:100%"
						styleClass="aon-text-left"
						columnClasses="aon-column-middle-width,aon-column-middle-width">
						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
								<aon:outputText value="#{menuBundle.account_invoice_entry}"
									style="color:red;" />
								<h:commandLink immediate="true"
									actionListener="#{accountInvoice.onReset}"
									action="accountInvoiceEntry">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.account_invoice_entry}" />
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
								<aon:outputText value="#{menuBundle.account_expense_entry}" />
								<h:commandLink immediate="true"
									actionListener="#{accountExpense.onStart}"
									action="accountExpenseEntry">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.account_expense_entry}" />
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
								<aon:outputText value="#{menuBundle.account_salary_entry}" />
								<h:commandLink immediate="true"
									actionListener="#{accountSalary.onReset}"
									action="accountSalaryEntry">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.account_salary_entry}" />
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionEntry">
								<aon:outputText
									value="#{menuBundle.account_social_insurance_entry}" />
								<h:commandLink immediate="true"
									actionListener="#{accountSocialInsurance.onReset}"
									action="accountSocialInsuranceEntry">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText
									value="#{menuBundle.account_social_insurance_entry}" />
							</aon:div>
						</aon:div>

					</h:panelGrid>

				</aon:panelCollapsible>


				<aon:panelCollapsible label="#{menuBundle.aon_masters}">
					<h:panelGrid styleClass="aon-text-left" columns="2" style="width:100%; margin-top: 20px;"
						columnClasses="aon-column-middle-width,aon-column-middle-width">
						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOption">
								<aon:outputText value="#{menuBundle.account_entry}" />
								<h:commandLink immediate="true"
									actionListener="#{accountEntry.onReset}"
									action="account_entry_form">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
								<h:commandLink immediate="true"
									actionListener="#{accountEntry.onEditSearch}"
									action="account_entry_search">
									<aon:outputText value="[#{bundle.aon_search}]" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.account_entry}" />
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOption">
								<aon:outputText value="#{menuBundle.account_invoice_entry}" />
								<h:commandLink immediate="true"
									actionListener="#{accountInvoice.onReset}"
									action="accountInvoiceEntry">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.account_invoice_entry}" />
							</aon:div>
						</aon:div>



						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOption">
								<aon:outputText value="#{menuBundle.customer}" />
								<h:commandLink immediate="true"
									actionListener="#{customer.onReset}" action="customer_form">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
								<h:commandLink immediate="true"
									actionListener="#{customer.onEditSearch}"
									action="customer_search">
									<aon:outputText value="[#{bundle.aon_search}]" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.customer}" />
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOption">
								<aon:outputText value="#{menuBundle.account_supplier}" />
								<h:commandLink immediate="true"
									actionListener="#{accBasicSupplier.onReset}"
									action="accSupplier_form">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
								<h:commandLink immediate="true"
									actionListener="#{accBasicSupplier.onEditSearch}"
									action="accSupplier_search">
									<aon:outputText value="[#{bundle.aon_search}]" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.account_supplier}" />
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOption">
								<aon:outputText value="#{menuBundle.account_creditor}" />
								<h:commandLink immediate="true"
									actionListener="#{accBasicCreditor.onReset}"
									action="accCreditor_form">
									<aon:outputText value="[#{bundle.aon_reset}]" />
								</h:commandLink>
								<h:commandLink immediate="true"
									actionListener="#{accBasicCreditor.onEditSearch}"
									action="accCreditor_search">
									<aon:outputText value="[#{bundle.aon_search}]" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.account_creditor}" />
							</aon:div>
						</aon:div>
					</h:panelGrid>
				</aon:panelCollapsible>

				<aon:panelCollapsible label="#{menuBundle.aon_reports}">
					<h:panelGrid styleClass="aon-text-left" columns="2" style="width:100%; margin-top: 20px;"
						columnClasses="aon-column-middle-width,aon-column-middle-width">
						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionReport">
								<h:commandLink immediate="true"
									actionListener="#{accStatement.onReset}"
									action="accStatement_search">
									<aon:outputText value="#{menuBundle.account_abstract}" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.account_abstract}" />
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionReport">
								<h:commandLink immediate="true"
									actionListener="#{accStatement.onReset}"
									action="trialBalance_search">
									<aon:outputText value="#{menuBundle.account_trial_balance}" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.account_trial_balance}" />
							</aon:div>
						</aon:div>

						<aon:div>
							<aon:div styleClass="aonSubMenu aonSubMenuOptionReport">
								<h:commandLink immediate="true"
									actionListener="#{accountEntryReport.onProfitAndLoss}"
									action="profit_and_loss_search">
									<aon:outputText value="#{menuBundle.account_profit_and_loss}" />
								</h:commandLink>
							</aon:div>
							<aon:div styleClass="aonSubMenuDescription">
								<aon:outputText value="#{menuBundle.account_profit_and_loss}" />
							</aon:div>
						</aon:div>

						<aon:outputText value="&#160;" />

					</h:panelGrid>
				</aon:panelCollapsible>
			</aon:div>
		</aon:form>
	</aon:div>

</ui:composition>
