<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div rendered="#{!finance.new}">

		<aon:editDataTable id="#{dataTable}" value="#{controllerAlias.model}"
			rows="20" var="to">

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:commandButton rendered="#{to!=controllerAlias.to}"
					styleClass="aon-icon-commandButton aon-icon-rowSelector"
					actionListener="#{controllerAlias.onSelect}" />
				<f:facet name="footer">
					<aon:commandButton alt="[#{messages.aon_reset}]"
						styleClass="aon-editDataTable-button aon-icon-new"
						actionListener="#{controllerAlias.onReset}"
						rendered="#{!controllerAlias.new}"
						accesskey="#{bundle.aon_key_new_line}">
					</aon:commandButton>
				</f:facet>
			</aon:column>

			<aon:column width="300">
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.aon_bank_name}" />
				</f:facet>
				<aon:outputText value="#{to.bank.name}"
					rendered="#{to!=controllerAlias.to}" />
				<aon:div rendered="#{to==controllerAlias.to}">
					<ui:include src="/facelet/sw/bank/bankIdInput.xhtml">
						<ui:param name="controllerAlias" value="#{controllerAlias}" />
						<ui:param name="bank_id" value="bankIdUpd" />
						<ui:param name="renderedAttr" value="#{true}" />
						<ui:param name="disabled" value="#{false}" />
						<ui:param name="reRenderAttr" value="bankIdUpd" />
						<ui:param name="required" value="#{true}" />
						<ui:param name="bankEntity" value="#{controllerAlias.to.bank}" />
						<ui:param name="bankELExpression" value="controllerAlias.to.bank" />
					</ui:include>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{controllerAlias.new}">
						<ui:include src="/facelet/sw/bank/bankIdInput.xhtml">
							<ui:param name="controllerAlias" value="#{controllerAlias}" />
							<ui:param name="bank_id" value="bankIdNew" />
							<ui:param name="renderedAttr" value="#{true}" />
							<ui:param name="disabled" value="#{false}" />
							<ui:param name="reRenderAttr" value="bankIdNew" />
							<ui:param name="required" value="#{true}" />
							<ui:param name="bankEntity" value="#{controllerAlias.to.bank}" />
							<ui:param name="bankELExpression" value="controllerAlias.to.bank" />
						</ui:include>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.aon_bank_account}" />
				</f:facet>
				<aon:outputText value="#{to.formattedBankAccount}"
					rendered="#{to!=controllerAlias.to}" />
				<aon:div rendered="#{to==controllerAlias.to}">
					<aon:inputText value="#{controllerAlias.office}" required="#{true}"
						size="4" maxlength="4">
						<f:validateLength minimum="4" maximum="4" />
					</aon:inputText>
					<aon:inputText value="#{controllerAlias.control}"
						required="#{true}" size="2" maxlength="2">
						<f:validateLength minimum="2" maximum="2" />
					</aon:inputText>
					<aon:inputText value="#{controllerAlias.account}"
						required="#{true}" size="10" maxlength="10">
						<f:validateLength minimum="10" maximum="10" />
					</aon:inputText>
				</aon:div>
				<f:facet name="footer">
					<aon:div rendered="#{controllerAlias.new}">
						<aon:inputText value="#{controllerAlias.office}"
							required="#{true}" size="4" maxlength="4">
							<f:validateLength minimum="4" maximum="4" />
						</aon:inputText>
						<aon:inputText value="#{controllerAlias.control}"
							required="#{true}" size="2" maxlength="2">
							<f:validateLength minimum="2" maximum="2" />
						</aon:inputText>
						<aon:inputText value="#{controllerAlias.account}"
							required="#{true}" size="10" maxlength="10">
							<f:validateLength minimum="10" maximum="10" />
						</aon:inputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText rendered="#{to!=controllerAlias.to}" value="&#160;" />
				<aon:commandButton title="#{bundle.aon_save}"
					actionListener="#{controllerAlias.onAccept}"
					rendered="#{to==controllerAlias.to}" value=""
					onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
					styleClass="aon-editDataTable-button aon-icon-accept"
					accesskey="#{bundle.aon_key_save_line}" />
				<aon:commandButton title="#{bundle.aon_cancel}"
					actionListener="#{controllerAlias.onCancel}" immediate="#{true}"
					onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
					styleClass="aon-editDataTable-button aon-icon-cancel" value=""
					rendered="#{to==controllerAlias.to}"
					accesskey="#{bundle.aon_key_cancel_line}" />
				<aon:commandButton title="#{bundle.aon_remove}"
					actionListener="#{controllerAlias.onRemove}"
					onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
					rendered="#{to==controllerAlias.to}"
					styleClass="aon-editDataTable-button aon-icon-delete" value=""
					accesskey="#{bundle.aon_key_remove_line}" />
				<f:facet name="footer">
					<aon:div>
						<aon:outputText rendered="#{!controllerAlias.new}" value="&#160;" />
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{controllerAlias.onAccept}"
							rendered="#{controllerAlias.new}" value=""
							onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{controllerAlias.onCancel}" immediate="#{true}"
							onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
							rendered="#{controllerAlias.new}"
							styleClass="aon-editDataTable-button aon-icon-cancel" value=""
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>

		<aon:dataScroller for="#{dataTable}"
			rowCount="#{controllerAlias.model.rowCount}" showNote="false" />
	</aon:div>
</ui:composition>
