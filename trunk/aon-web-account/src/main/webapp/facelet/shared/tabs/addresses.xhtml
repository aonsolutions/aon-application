<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:editDataTable id="#{dataTable}" value="#{controllerAlias.model}"
		rows="20" var="to">

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:commandButton rendered="#{to!=controllerAlias.to}"
				styleClass="aon-icon-commandButton aon-icon-rowSelector"
				actionListener="#{controllerAlias.onSelect}" />
			<f:facet name="footer">
				<aon:commandButton alt="[#{messages.aon_reset}]"
					styleClass="aon-editDataTable-button aon-icon-new"
					actionListener="#{controllerAlias.onReset}"
					rendered="#{!controllerAlias.new}"
					accesskey="#{bundle.aon_key_new_line}">
				</aon:commandButton>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_type}" />
			</f:facet>
			<aon:outputText value="#{to.addressType}"
				rendered="#{to!=controllerAlias.to}" />
			<aon:selectOneMenu value="#{controllerAlias.to.addressType}"
				rendered="#{to==controllerAlias.to}">
				<f:selectItems value="#{registryCollections.addressTypes}" />
			</aon:selectOneMenu>
			<f:facet name="footer">
				<aon:selectOneMenu value="#{controllerAlias.to.addressType}"
					rendered="#{controllerAlias.new}">
					<f:selectItems value="#{registryCollections.addressTypes}" />
				</aon:selectOneMenu>
			</f:facet>
		</aon:column>

		<aon:column width="300">
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_address}" />
			</f:facet>
			<aon:outputText value="#{to.address} #{to.address2} #{to.address3}"
				rendered="#{to!=controllerAlias.to}" />
			<aon:inputText value="#{controllerAlias.to.address}"
				rendered="#{to==controllerAlias.to}" required="#{true}" size="40" />
			<aon:inputText value="#{controllerAlias.to.address2}"
				rendered="#{to==controllerAlias.to}" size="40" />
			<aon:inputText value="#{controllerAlias.to.address3}"
				rendered="#{to==controllerAlias.to}" size="40" />
			<f:facet name="footer">
				<aon:div layout="inline">
					<aon:inputText value="#{controllerAlias.to.address}"
						rendered="#{controllerAlias.new}" required="#{true}" size="40" />
					<aon:inputText value="#{controllerAlias.to.address2}"
						rendered="#{controllerAlias.new}" size="40" />
					<aon:inputText value="#{controllerAlias.to.address3}"
						rendered="#{controllerAlias.new}" size="40" />
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column width="50">
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_zip}" />
			</f:facet>
			<aon:outputText value="#{to.zip}"
				rendered="#{to!=controllerAlias.to}" />
			<aon:inputText value="#{controllerAlias.to.zip}"
				rendered="#{to==controllerAlias.to}" required="#{true}" size="8" />
			<f:facet name="footer">
				<aon:inputText value="#{controllerAlias.to.zip}"
					rendered="#{controllerAlias.new}" required="#{true}" size="8" />
			</f:facet>
		</aon:column>

		<aon:column width="150">
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_city}" />
			</f:facet>
			<aon:outputText value="#{to.city}"
				rendered="#{to!=controllerAlias.to}" />
			<aon:inputText value="#{controllerAlias.to.city}"
				rendered="#{to==controllerAlias.to}" required="#{true}" size="20" />
			<f:facet name="footer">
				<aon:inputText value="#{controllerAlias.to.city}"
					rendered="#{controllerAlias.new}" required="#{true}" size="20" />
			</f:facet>
		</aon:column>

		<aon:column width="130">
			<f:facet name="header">
				<aon:outputText value="#{registryBundle.aon_geozone}" />
			</f:facet>
			<aon:outputText value="#{to.geozone.name}"
				rendered="#{to!=controllerAlias.to}" />
			<aon:selectOneMenu value="#{controllerAlias.to.geozone.id}"
				rendered="#{to==controllerAlias.to}"
				valueChangeListener="#{controllerAlias.onChangeGeoZone}">
				<f:selectItems value="#{geozoneCollections.geoTrees}" />
			</aon:selectOneMenu>
			<f:facet name="footer">
				<aon:div>
					<aon:selectOneMenu value="#{controllerAlias.to.geozone.id}"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{controllerAlias.new}"
						valueChangeListener="#{controllerAlias.onChangeGeoZone}">
						<f:selectItems value="#{geozoneCollections.geoTrees}" />
					</aon:selectOneMenu>
				</aon:div>
			</f:facet>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="&#160;" />
			</f:facet>
			<aon:div>
				<aon:outputText value="&#160;" rendered="#{to!=controllerAlias.to}" />
				<aon:commandButton title="#{bundle.aon_save}"
					actionListener="#{controllerAlias.onAccept}"
					rendered="#{to==controllerAlias.to}" value=""
					onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
					styleClass="aon-editDataTable-button aon-icon-accept"
					accesskey="#{bundle.aon_key_save_line}" />
				<aon:commandButton title="#{bundle.aon_cancel}"
					actionListener="#{controllerAlias.onCancel}" immediate="#{true}"
					onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
					styleClass="aon-editDataTable-button aon-icon-cancel" value=""
					rendered="#{to==controllerAlias.to}"
					accesskey="#{bundle.aon_key_cancel_line}" />
				<aon:commandButton title="#{bundle.aon_remove}"
					actionListener="#{controllerAlias.onRemove}"
					onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
					rendered="#{to==controllerAlias.to}"
					styleClass="aon-editDataTable-button aon-icon-delete" value=""
					accesskey="#{bundle.aon_key_remove_line}" />
			</aon:div>
			<f:facet name="footer">
				<aon:div>
					<aon:outputText value="&#160;" rendered="#{!controllerAlias.new}" />
					<aon:commandButton title="#{bundle.aon_save}"
						actionListener="#{controllerAlias.onAccept}"
						rendered="#{controllerAlias.new}" value=""
						onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="#{bundle.aon_cancel}"
						actionListener="#{controllerAlias.onCancel}" immediate="#{true}"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
						rendered="#{controllerAlias.new}"
						styleClass="aon-editDataTable-button aon-icon-cancel" value=""
						accesskey="#{bundle.aon_key_cancel_line}" />
				</aon:div>
			</f:facet>
		</aon:column>
	</aon:editDataTable>
	<aon:dataScroller for="#{dataTable}"
		rowCount="#{controllerAlias.model.rowCount}" showNote="false" />


</ui:composition>
