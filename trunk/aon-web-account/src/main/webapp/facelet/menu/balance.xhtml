<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="reportsMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">
		
					<aon:panelGrid columns="1" styleClass="aon-panelGrid-formatting"
						columnClasses="aon-portlets-column aon-width-400">
	
						<aon:panel headerClass="aon-panel-title">
							<f:facet name="header">
								<aon:outputText value="#{accountingBundle.accounting_balance}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="closing_balance_sheet" 
										action="balance_sheet_search-closing" actionListener="#{balanceSheet.onClosingBalance}"
										value="#{accountingBundle.accounting_balance_menu_bs}"/>
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="operating_balance_sheet" 
										action="balance_sheet_search-operating" actionListener="#{balanceSheet.onOperatingBalance}"
										value="#{accountingBundle.accounting_balance_menu_pyg}" />
								</aon:div>

						
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="patrimony_balance_sheet" 
										action="balance_sheet_search-patrimony" actionListener="#{balanceSheet.onPatrimonyBalance}"
										value="#{accountingBundle.accounting_balance_menu_patrimony}" />
								</aon:div>

								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="custom_balance_sheet" 
										action="balance_sheet_search-custom" actionListener="#{balanceSheet.onCustomBalance}"
										value="#{accountingBundle.accounting_balance_menu_custom}" />
								</aon:div>

						 
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accounting_balance" 
										action="balance_list"
										value="#{accountingBundle.accounting_balance_menu}"/>
								</aon:div>
							</aon:div>
						</aon:panel>

						<c:if test="#{aonRole.admin}">								
							<aon:panel headerClass="aon-panel-title">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_configuration}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="actionDenied" 
												action="actionDenied" actionListener="#{actionDenied.onInit}"
												value="#{auditBundle.audit_option_denied_module}" />
										</aon:div>
								</aon:div>
							</aon:panel>
						</c:if>
					</aon:panelGrid>
				</aon:componentGroup>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
