<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="reportsMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">
		
					<aon:panelGrid columns="1" styleClass="aon-panelGrid-formatting"
						columnClasses="aon-portlets-column aon-width-400">
	
						<aon:panel headerClass="aon-panel-title">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.account_fixed_assets}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="accountBudget" 
										action="accountBudget_search" actionListener="#{accountBudget.onEditSearch}"
										value="#{accountingBundle.accounting_account_budget_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="budgetedProfitAndLossReport" 
										action="budgeted_profit_and_loss_search" actionListener="#{budgetedProfitAndLossReport.onEditSearch}"
										value="#{accountingBundle.accounting_budgeted_balance_sheet_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="budgetedProfitAndLossComparison" 
										action="compared_budgeted_profit_and_loss_search" actionListener="#{budgetedProfitAndLossComparison.onEditSearch}"
										value="#{accountingBundle.accounting_compared_budgeted_balance_sheet_module}" />
								</aon:div>
							</aon:div>
						</aon:panel>

						<c:if test="#{aonRole.admin}">								
							<aon:panel headerClass="aon-panel-title">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_configuration}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="actionDenied" 
												action="actionDenied" actionListener="#{actionDenied.onInit}"
												value="#{auditBundle.audit_option_denied_module}" />
										</aon:div>
								</aon:div>
							</aon:panel>
						</c:if>
					</aon:panelGrid>
				</aon:componentGroup>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
