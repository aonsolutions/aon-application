<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="mastersMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">
					<aon:panelGroup>
					<aon:panelGrid id="group_entries"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-sales aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.account_entries}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="accountEntry" action="accountEntry_search"
									actionListener="#{accountEntry.onEditSearch}"
									value="#{accountingBundle.accounting_entry_module}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>

					<aon:panelGrid id="group_pred_entries"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-account-entry aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.account_pred_entries}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="invoiceEntry" 
									action="account_invoice_entry" actionListener="#{invoiceEntry.onReset}"
									value="#{accountingBundle.accounting_entry_invoice_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="financeEntry" 
									action="account_finance_entry" actionListener="#{financeEntry.onReset}"
									value="#{accountingBundle.accounting_entry_finance_module}" />
							</aon:div>

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="financeTrackingEntry" 
									action="account_finance_tracking_entry" actionListener="#{financeTrackingEntry.onReset}"
									value="#{accountingBundle.accounting_entry_finance_tracking_module}" />
							</aon:div>

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="expenseEntry" 
									action="account_expense_entry" actionListener="#{expenseEntry.onReset}"
									value="#{accountingBundle.accounting_expense_entry_module}" />
							</aon:div>

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="salaryEntry" 
									action="account_salary_entry" actionListener="#{salaryEntry.onReset}"
									value="#{accountingBundle.accounting_salary_entry_module}" />
							</aon:div>

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="socialInsuranceEntry" 
									action="account_social_insurance_entry" actionListener="#{socialInsuranceEntry.onReset}"
									value="#{accountingBundle.accounting_social_insurance_entry_module}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>

					<aon:panelGrid id="group_pred_entries_end_period"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-account-entry aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.account_end_period_entries}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="accountOperatingEntry" 
									action="accountOperatingEntry" actionListener="#{endPeriodEntries.onInitOperatingEntry}"
									value="#{accountingBundle.accounting_operating_entry_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="accountClosingEntry" 
									action="accountClosingEntry" actionListener="#{endPeriodEntries.onInitClosingEntry}"
									value="#{accountingBundle.accounting_closing_entry_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="accountOpeningEntry" 
									action="accountOpeningEntry" actionListener="#{endPeriodEntries.onInitOpeningEntry}"
									value="#{accountingBundle.accounting_opening_entry_module}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
					</aon:panelGroup>
					
					<aon:panelGroup>
					
					<aon:panelGrid id="group_pred_entries_loan"
						styleClass="aon-width-all" columnClasses="aon-padding"
						headerClass="aon-icon-sales aon-direct-access-panel">
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_loan_module}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="loanEntry" 
									action="account_loan_entry" actionListener="#{loanEntry.onReset}"
									value="#{accountingBundle.accounting_loan_entry_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="loanFeeEntry" 
									action="account_loan_fee_entry" actionListener="#{loanFeeEntry.onReset}"
									value="#{accountingBundle.accounting_loan_fee_entry_module}" />
							</aon:div>
						</aon:div>
					</aon:panelGrid>
					
					 <aon:panelGrid id="group_invoice_recorder"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-utilities aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.management_entries}" />
								</f:facet>
					   	<aon:div styleClass="aon-direct-access-list">
								<c:if test="#{aonRole.accountingOperator}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="saleInvoiceRecorder"
											value="#{financeBundle.finance_sale_invoice_recording_module}"
											actionListener="#{saleInvoiceRecorder.onEditSearch}"
											action="saleInvoiceRecorder_search" />
									</aon:div>
								</c:if>
					 			<c:if test="#{aonRole.accountingOperator}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseInvoiceRecorder"
											value="#{financeBundle.finance_purchase_invoice_recording_module}"
											actionListener="#{purchaseInvoiceRecorder.onEditSearch}"
											action="purchaseInvoiceRecorder_search" />
									</aon:div>
								</c:if>
								<c:if test="#{aonRole.accountingOperator}">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="expenseInvoiceRecorder"
										value="#{financeBundle.finance_expense_invoice_recording_module}"
										actionListener="#{expenseInvoiceRecorder.onEditSearch}"
										action="expenseInvoiceRecorder_search" />
								</aon:div>
								</c:if>
								<c:if test="#{aonRole.accountingOperator}">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="undeductibleInvoiceRecorder"
										value="#{financeBundle.finance_undeductible_invoice_recording_module}"
										actionListener="#{undeductibleInvoiceRecorder.onEditSearch}"
										action="undeductibleInvoiceRecorder_search" />
								</aon:div>
								</c:if>
							</aon:div> 	
						</aon:panelGrid> 
						</aon:panelGroup>
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
