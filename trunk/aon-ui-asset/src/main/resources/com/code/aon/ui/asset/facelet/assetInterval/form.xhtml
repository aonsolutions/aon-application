<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="assetIntervalForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{assetBundle.asset_interval_module}" />
				<ui:param name="controller" value="#{assetInterval}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
			<aon:panelGrid columns="2" style="width: 100%;" 
				columnClasses="aon-panelGrid-odd aon-width-200, aon-panelGrid-even aon-width-auto" >
			
				<aon:outputLabel for="assetInterval_description" 
					value="#{bundle.aon_description}" />
				<aon:inputText id="assetInterval_description"
					value="#{assetInterval.to.description}" 
					maxlength="32" size="45" >
					<f:validateLength maximum="32" />
				</aon:inputText>
			
				<aon:outputLabel for="assetInterval_interval" 
					value="#{assetBundle.asset_interval_interval}" />
				<aon:inputText id="assetInterval_interval"
					value="#{assetStretch.to.interval}" size="5" >
					<f:validateDoubleRange  />
				</aon:inputText>
			
				<aon:outputLabel for="assetInterval_startTime" 
					value="#{assetBundle.asset_startTime}" />
				<aon:inputText id="assetInterval_startTime"
					value="#{assetInterval.to.startTime}" size="5" >
					<f:validateLength maximum="32" />
				</aon:inputText>
			
				<aon:outputLabel for="assetInterval_endTime" 
					value="#{assetBundle.asset_endTime}" />
				<aon:inputText id="assetInterval_endTime"
					value="#{assetInterval.to.endTime}" size="5" >
					<f:validateLength maximum="32" />
				</aon:inputText>
		
			</aon:panelGrid>
			
				
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
