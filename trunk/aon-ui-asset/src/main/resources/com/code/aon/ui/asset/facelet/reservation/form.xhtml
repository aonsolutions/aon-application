<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="reservationForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{assetBundle.asset_reservation_module}" />
				<ui:param name="controller" value="#{assetCalendar}" />
				<aon:valueParam name="skipResetButton" default="#{true}" />
				<aon:valueParam name="skipSearchButton" default="#{true}" />
			</ui:include>
			
			<h:panelGrid columns="2" width="100%" id="calendar" styleClass="calendar-panelGrid" >
				<aon:panel>
					<f:facet name="header">
						<aon:outputLabel value="#{assetBundle.asset_reservation_select}" />
					</f:facet>
					<aon:div styleClass="aon-scroll-area" >
						<rich:calendar value="#{assetCalendar.calendarDay}" popup="false" 
							showApplyButton="false" cellWidth="50px" cellHeight="33px"
							showWeeksBar="false" id="assetCalendar"
							showFooter="false" 
							valueChangeListener="#{assetCalendar.refreshSelectedDay}" >
		
							<a4j:support event="onchanged" reRender="dayActivities, activityRequestDiv" 
								ajaxSingle="true" actionListener="#{activityDialog.onInitializeRequest}" />										
		     			</rich:calendar>
					</aon:div>
				</aon:panel>
				<aon:panel>
					<f:facet name="header">
						<aon:outputLabel value="#{assetBundle.asset_reservation_resource_request}" />
					</f:facet>
					<aon:div styleClass="aon-scroll-area" id="activityRequestDiv" >
						<ui:include src="request/grid.xhtml" />
					</aon:div>
				</aon:panel>
			</h:panelGrid>
			
			<aon:div styleClass="aon-scroll-area" id="dayActivities" >
				<ui:include src="grid.xhtml" />
			</aon:div>
			
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{assetLookup}" />
	</ui:define>
</ui:composition>
