<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="activityForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{assetBundle.asset_reservation_module}" />
				<ui:define name="toolbarContent">
				
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-scroll-area" >
				<h:panelGrid columns="2"
					columnClasses="aon-vertical-align-top aon-width-auto, aon-vertical-align-top aon-width-350">
					<aon:div id="dayActivities" >
						<ui:include src="/com/code/aon/ui/asset/facelet/activityViewer/grid.xhtml" >
							<ui:param name="controller" value="#{activityViewer}" />
						</ui:include>
					</aon:div>
					<aon:div id="filter" >
						<ui:include src="/com/code/aon/ui/asset/facelet/activityViewer/grid_filter.xhtml" >
							<ui:param name="controller" value="#{activityViewer}" />
						</ui:include>
						<ui:include src="/com/code/aon/ui/asset/facelet/activityViewer/reservation_info.xhtml" >
							<ui:param name="controller" value="#{activityViewer}" />
						</ui:include>
					</aon:div>
				</h:panelGrid>
			</aon:div>
			
		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{assetTypeLookup}" />
		<aon:lookupButtonPopup lookup="#{featureLookup}" />
		
	</ui:define>
</ui:composition>
