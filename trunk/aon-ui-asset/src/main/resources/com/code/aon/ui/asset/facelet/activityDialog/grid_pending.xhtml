<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="activityDialogGrid">
	
	<!-- TOOLBAR -->
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
						value="#{assetBundle.asset_activity_module}" />
				<ui:param name="toolbarDescription"
						value="#{bundle.aon_editing}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="activityDialog-reset"
						value="#{bundle.aon_reset}" 
						action="activityDialog_form"
						actionListener="#{activityDialog.onInitialize}"
						styleClass="aon-finding-toolbar-item aon-icon-new"
						accesskey="#{bundle.aon_key_new}" />
					<aon:commandButton id="activityDialog-search"
						value="#{bundle.aon_search}" 
						action="activityDialog_search"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}" >
						<aon:actionListener method="#{activityBasic.initializePendingList}" />
					</aon:commandButton>
					<aon:commandButton
						id="activity-accept" title="#{bundle.aon_accept}"
						value="#{bundle.aon_accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept">
						<a4j:support event="onclick" reRender="activityDataDiv">
							<aon:actionListener method="#{activityBasic.acceptPendingAssetList}" />
						</a4j:support>
					</aon:commandButton>
					<aon:commandButton
						id="activity-cancel" title="#{assetBundle.asset_refuse}"
						value="#{assetBundle.asset_refuse}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel">
						<a4j:support event="onclick" reRender="activityDataDiv">
							<aon:actionListener method="#{activityBasic.cancelPendingAssetList}" />
						</a4j:support>
					</aon:commandButton>
				</ui:define>
			</ui:decorate>
			<!-- TOOLBAR END -->
	
	<aon:div id="activityDataDiv" styleClass="aon-scroll-area">
		<aon:dataTable id="assetList" var="to" rows="20" width="auto"
			value="#{activityBasic.model}"
			columnClasses="
				aon-dataTable-iconColumn, aon-dataTable-textColumn,
				aon-dataTable-dateColumn, 
				aon-dataTable-dateColumn, aon-dataTable-dateColumn, 
				aon-dataTable-textColumn, aon-dataTable-textColumn,
				aon-dataTable-textColumn">

				<aon:column>
					<f:facet name="header">
						<aon:div layout="none">
							<aon:outputText value="&#160;" 
								styleClass="aon-icon-commandButton-disabled aon-icon-checkNone"/>
							<aon:outputText value="&#160;" 
								styleClass="aon-icon-commandButton-disabled aon-icon-checkAll"/>
						</aon:div>
					</f:facet>
					<h:selectBooleanCheckbox value="#{to.check}" />
				</aon:column>
					
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_asset}" />
					</f:facet>
					<aon:outputText value="#{to.asset.name}" />
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_activity_who}" />
					</f:facet>
					<aon:outputText value="#{to.who}" 
						size="15" />
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_date}" />
					</f:facet>
					<aon:outputText value="#{to.date}" 
					 	size="8" >
					 	<f:convertDateTime pattern="#{assetBundle.aon_date_pattern}" 
							timeZone="#{timeZoneController.timeZoneId}"  />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_fromTime}" />
					</f:facet>
					<aon:outputText value="#{to.fromTime}" 
						size="5" >
						<f:convertDateTime pattern="#{assetBundle.aon_time_pattern}" 
							timeZone="#{timeZoneController.timeZoneId}" type="time" />
					</aon:outputText>
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_toTime}" />
					</f:facet>
					<aon:outputText value="#{to.toTime}" 
						size="5" >
						<f:convertDateTime pattern="#{assetBundle.aon_time_pattern}" 
							timeZone="#{timeZoneController.timeZoneId}" type="time" />
					</aon:outputText>
				</aon:column>
				 					
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_activity_why}" />
					</f:facet>
					<aon:outputText value="#{to.why}" 
						size="25" />
				</aon:column>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_activity_status}" />
					</f:facet>
					<aon:outputText value="#{to.status}" 
						size="10" />
				</aon:column>
			</aon:dataTable>
			<aon:dataScroller2 for="assetList" showNote="true" />
		</aon:div>
	</aon:form>
	</ui:define>
</ui:composition>
