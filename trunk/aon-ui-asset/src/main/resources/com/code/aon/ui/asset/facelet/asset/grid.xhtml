<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div id="assetActivityLinesDataDiv" styleClass="aon-scroll-area">

		<ui:decorate
			template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
			<ui:param name="controller" value="#{activityLines}" />
			<ui:param name="columnClasses"	value="
			aon-editDataTable-numberColumn,	aon-editDataTable-dateColumn, 
			aon-editDataTable-dateColumn, aon-editDataTable-dateColumn, 
			aon-editDataTable-textColumn, aon-editDataTable-textColumn" />

			<ui:param name="showDataTable" value="#{!asset.new and activityLines.model.rowCount!=0}" />
			<ui:param name="showDataScroller" value="#{!asset.new and activityLines.model.rowCount!=0}" />
			<ui:param name="showNote" value="#{true}" />
			<ui:param name="skipResetButton" value="#{true}" />

			<ui:define name="columns">

				<aon:column>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_date}" />
					</f:facet>
					<aon:outputText value="#{to.date}"
						rendered="#{to!=activityLines.to}" size="4">
						<f:convertDateTime pattern="#{assetBundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:selectInputDate renderAsPopup="true"
						rendered="#{to==activityLines.to}"
						popupDateFormat="#{assetBundle.aon_date_pattern}" inputSize="8"
						value="#{activityLines.to.date}" enableManualInput="true" />
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_fromTime}" />
					</f:facet>
					<aon:outputText value="#{to.fromTime}"
						rendered="#{to!=activityLines.to}" size="5">
						<f:convertDateTime pattern="#{assetBundle.aon_time_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" type="time" />
					</aon:outputText>
					<aon:div id="ActivityDialog_fromTime" rendered="#{to==activityLines.to}">
						<aon:selectOneMenu id="fromTimeHours" 
							value="#{activityLines.fromTimeHours}">
							<f:selectItems value="#{activityDialog.hours}" />
						</aon:selectOneMenu>
						<aon:outputLabel 
							value="#{assetBundle.asset_hours}" />
						<aon:selectOneMenu id="fromTimeMins" 
							value="#{activityLines.fromTimeMins}">
							<f:selectItems value="#{activityDialog.mins}" />
						</aon:selectOneMenu>
						<aon:outputLabel
							value="#{assetBundle.asset_minutes}" />
					</aon:div>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_toTime}" />
					</f:facet>
					<aon:outputText value="#{to.toTime}"
						rendered="#{to!=activityLines.to}" size="5">
						<f:convertDateTime pattern="#{assetBundle.aon_time_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" type="time" />
					</aon:outputText>
					<aon:div id="ActivityDialog_toTime" rendered="#{to==activityLines.to}">
						<aon:selectOneMenu id="toTimeHours" 
							value="#{activityLines.toTimeHours}">
							<f:selectItems value="#{activityDialog.hours}" />
						</aon:selectOneMenu>
						<aon:outputLabel 
							value="#{assetBundle.asset_hours}" />
						<aon:selectOneMenu id="toTimeMins" 
							value="#{activityLines.toTimeMins}">
							<f:selectItems value="#{activityDialog.mins}" />
						</aon:selectOneMenu>
						<aon:outputLabel
							value="#{assetBundle.asset_minutes}" />
					</aon:div>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_activity_who}" />
					</f:facet>
					<aon:outputText value="#{to.who}"
						rendered="#{to!=activityLines.to}" size="15" />
					<aon:inputText value="#{activityLines.to.who}"
						rendered="#{to==activityLines.to}" size="15" required="#{true}">
						<f:validateLength maximum="20" />
					</aon:inputText>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{assetBundle.asset_activity_why}" />
					</f:facet>
					<aon:outputText value="#{to.why}"
						rendered="#{to!=activityLines.to}" size="25" />
					<aon:inputTextarea value="#{activityLines.to.why}"
						rendered="#{to==activityLines.to}" cols="35" rows="2" required="#{true}">
						<f:validateLength maximum="128" />
					</aon:inputTextarea>
				</aon:column>

			</ui:define>
		</ui:decorate>
	</aon:div>
</ui:composition>
