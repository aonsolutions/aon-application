<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="statisticsMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">			

					<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
						columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">
	
						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-icon-statistics aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_statistics}" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">							
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink value="Ventas por Categoria y Articulo" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink value="Ventas por Zona" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink value="Ventas por Agente Comercial" />								
								</aon:div>
							</aon:div>
						</h:panelGrid>

						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-icon-task aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="cuadro de mando" />
							</f:facet>							
							<aon:div styleClass="aon-direct-access-list">														
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink value="Visitas Realizadas (Dia, Semana, Mes, Rango Fechas)" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink value="Presupuestos Realizados (Cantidad e Importes)" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink value="Presupuestos Cerrados (Cantidad e Importes)" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink value="Presupuestos Perdidos (Cantidad e Importes)" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink value="Ratios" />
								</aon:div>
							</aon:div>
						</h:panelGrid>
	
					</h:panelGrid>
				</aon:componentGroup>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
