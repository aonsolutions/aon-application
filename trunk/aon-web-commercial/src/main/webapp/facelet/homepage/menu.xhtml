<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:form id="commercialMenu">
	
		<aon:menuBar> 
			<aon:dropDownMenu value="#{menuBundle.aon_auxiliars}">
				<aon:menuItem value="#{menuBundle.aon_commercial_segments}" 
					iconClass="aon-commercial-segment-iconClass"
					action="commercialSegment" actionListener="#{commercialSegment.onSearch}" />
				<aon:menuItem value="#{menuBundle.aon_commercial_activities}"
					iconClass="aon-commercial-activity-iconClass"
					action="commercialActivity" actionListener="#{commercialActivity.onSearch}" />
				<aon:menuGroup value="#{menuBundle.aon_product_auxiliars}">
					<aon:menuItem value="#{menuBundle.aon_product_categories}" 
						action="productCategory" disabled="true" />
					<aon:menuItem value="#{menuBundle.aon_product_taxes}" 
						action="productTax" disabled="true" />
				</aon:menuGroup>					
			</aon:dropDownMenu>
			<aon:dropDownMenu value="#{menuBundle.aon_masters}">
				<aon:menuItem value="#{menuBundle.aon_targets}" 
					iconClass="aon-target-iconClass"
					action="target" actionListener="#{target.onEditSearch}" />
				<aon:menuItem value="#{menuBundle.aon_products}" 
					action="product" disabled="true" />
				<aon:menuItem value="#{menuBundle.aon_sellers}"
					iconClass="aon-seller-iconClass"
					action="seller" actionListener="#{seller.onEditSearch}" />
			</aon:dropDownMenu>
			<aon:dropDownMenu value="#{menuBundle.aon_commercial}">
				<aon:menuItem value="#{menuBundle.aon_commercial_tracking}" 
					iconClass="aon-commercial-tracking-iconClass"
					action="commercialTracking" actionListener="#{commercialTracking.onReset}" />
				<aon:menuItem value="#{menuBundle.aon_commercial_offers}" 
					action="offer" disabled="true" />					
			</aon:dropDownMenu>
			<aon:dropDownMenu value="#{marketingBundle.aon_marketing}">
				<aon:menuItem value="#{marketingBundle.aon_marketing_campaigns}"
					action="campaign" actionListener="#{campaign.onSearch}" />
				<aon:menuItem value="#{marketingBundle.aon_marketing_surveis}" 
					action="survey" actionListener="#{survey.onSearch}" />
				<aon:menuItem value="#{marketingBundle.aon_marketing_survey_responses}" 
					action="surveyResponse" actionListener="#{surveyResponse.onSearch}" />
				<aon:menuItem value="#{marketingBundle.aon_marketing_questions}"
					action="question" actionListener="#{question.onSearch}" />
			</aon:dropDownMenu>
			<aon:commandLink value="#{menuBundle.aon_communication_center}"
				styleClass="aon-top-menu-item aon-icon-call" immediate="true" 
				action="communicationCenter" actionListener="#{communicationCenter.onInit}" />
		</aon:menuBar>
			
	 </aon:form>

</ui:composition>

</body>
</html>
