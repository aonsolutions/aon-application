<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:form id="commercialList">
	
		<aon:div styleClass="aon-top-menu">
			<aon:div id="toolbar" styleClass="aon-finding-toolbar-item-group">
				<aon:commandButton id="commercialSegment" value="#{menuBundle.aon_commercial_segments}"
					immediate="true" action="commercialSegment" actionListener="#{commercialSegment.onSearch}"
					styleClass="aon-top-menu-item aon-icon-commercial-segment" />
				<aon:commandButton id="commercialActivity" value="#{menuBundle.aon_commercial_activities}"
					immediate="true" action="commercialActivity" actionListener="#{commercialActivity.onSearch}"
					styleClass="aon-top-menu-item aon-icon-commercial-activity" />
				<aon:commandButton id="seller" value="#{menuBundle.aon_sellers}"
					immediate="true" action="seller" actionListener="#{seller.onSearch}"
					styleClass="aon-top-menu-item aon-icon-seller" />
				<aon:commandButton id="commercialTracking" value="#{menuBundle.aon_commercial_tracking}"
					immediate="true" action="commercialTracking" actionListener="#{commercialTracking.onReset}"
					styleClass="aon-top-menu-item aon-icon-commercial-tracking" />
				<aon:commandButton id="target" value="#{menuBundle.aon_targets}"
					immediate="true" action="target" actionListener="#{target.onSearch}"
					styleClass="aon-top-menu-item aon-icon-target" />
			</aon:div>
		</aon:div>
	
	 </aon:form>

</ui:composition>

</body>
</html>
