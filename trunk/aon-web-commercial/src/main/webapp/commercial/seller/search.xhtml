<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="sellerSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.aon_sellers}" />
				<ui:param name="controller" value="#{seller}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{seller.onSearch}" type="actionListener"/>
					<aon:methodParam name="searchAction" value="seller_list" />
					
					<aon:outputLabel for="Seller_id"
						value="#{registryBundle.aon_id}" />
					<aon:inputText id="Seller_id" size="60"
						valueChangeListener="#{seller.addExpression}" />

					<aon:outputLabel for="Seller_registry_document"
						value="#{registryBundle.aon_nif}" />
					<aon:inputText id="Seller_registry_document" size="60"
						valueChangeListener="#{seller.addExpression}" onblur="toUpperCase(this);" />

					<aon:outputLabel for="Seller_registry_name"
						value="#{registryBundle.aon_name}" />
					<aon:inputText id="Seller_registry_name" size="60"
						valueChangeListener="#{seller.addExpression}" />

					<aon:outputLabel for="Seller_registry_surname"
						value="#{registryBundle.aon_surname}" />
					<aon:inputText id="Seller_registry_surname" size="60"
						valueChangeListener="#{seller.addExpression}" />

					<aon:outputLabel for="Seller_registry_alias"
						value="#{registryBundle.aon_alias}" />
					<aon:inputText id="Seller_registry_alias" size="60"
						valueChangeListener="#{seller.addExpression}" onblur="toUpperCase(this);" />

					<aon:outputLabel for="Seller_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Seller_description" size="60"
						valueChangeListener="#{seller.addExpression}" />
				</ui:define>
			
			</ui:decorate>

		</aon:form>
	</ui:define>
</ui:composition>
