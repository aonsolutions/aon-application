<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panel rendered="#{!target.new}">
		<f:facet name="header">
			<aon:outputLabel for="targetAddressData"
				value="#{configBundle.scope_scopes}" />
		</f:facet>

		<aon:editDataTable id="targetAddressData" var="to"
			value="#{targetAddress.model}" rows="20"
			columnClasses="aon-editDataTable-iconColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top,
				aon-editDataTable-textColumn aon-vertical-align-top, 
				aon-editDataTable-buttonsColumn aon-vertical-align-top">

			<aon:rowSelector toggleOnClick="#{targetAddress.to == null}"
				actionListener="#{targetAddress.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{targetAddress.onReset}" value=""
							rendered="#{!targetAddress.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column width="80">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.addressType}"
					rendered="#{to!=targetAddress.to}" />
				<aon:selectOneMenu rendered="#{to==targetAddress.to}"
					value="#{targetAddress.to.addressType}">
					<f:selectItems value="#{registryCollections.addressTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu rendered="#{targetAddress.new}"
						value="#{targetAddress.to.addressType}">
						<f:selectItems value="#{registryCollections.addressTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column width="300">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_address}" />
				</f:facet>
				<aon:outputText value="#{to.address} #{to.address2} #{to.address3}"
					rendered="#{to!=targetAddress.to}" />
				<aon:div>
					<aon:inputText value="#{targetAddress.to.address}"
						rendered="#{to==targetAddress.to}"
						required="true" size="40" maxlength="128" />
				</aon:div>
				<aon:div>
					<aon:inputText value="#{targetAddress.to.address2}"
						rendered="#{to==targetAddress.to}"
						size="40" maxlength="128" />
				</aon:div>
				<aon:div>
					<aon:inputText value="#{targetAddress.to.address3}"
						rendered="#{to==targetAddress.to}"
						size="40" maxlength="128" />
				</aon:div>						
				<f:facet name="footer">
					<aon:div>
						<aon:div>
							<aon:inputText id="Address" value="#{targetAddress.to.address}"
								rendered="#{targetAddress.new}"
								required="#{true}" size="40"  maxlength="128" />
						</aon:div>
						<aon:div>						
							<aon:inputText value="#{targetAddress.to.address2}"
								rendered="#{targetAddress.new}"
								size="40"  maxlength="128" />
						</aon:div>
						<aon:div>						
							<aon:inputText value="#{targetAddress.to.address3}"
								rendered="#{targetAddress.new}"
								size="40"  maxlength="128" />
						</aon:div>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column width="50">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_zip}" />
				</f:facet>
				<aon:outputText value="#{to.zip}" rendered="#{to!=targetAddress.to}" />
				<aon:inputText value="#{targetAddress.to.zip}"
					rendered="#{to==targetAddress.to}"
					required="true" size="8" maxlength="16" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText id="Zip" value="#{targetAddress.to.zip}"
							rendered="#{targetAddress.new}"
							required="#{true}" size="8" maxlength="16" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column width="150">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_city}" />
				</f:facet>
				<aon:outputText value="#{to.city}" rendered="#{to!=targetAddress.to}" />
				<aon:inputText value="#{targetAddress.to.city}"
					rendered="#{to==targetAddress.to}"
					required="true" size="20" maxlength="64" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText id="City" value="#{targetAddress.to.city}"
							rendered="#{targetAddress.new}"
							required="true" size="20" maxlength="64" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column width="130">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_geozone}" />
				</f:facet>
				<aon:outputText value="#{to.geozone.name}"
					rendered="#{to!=targetAddress.to}" />
				<aon:selectOneMenu value="#{targetAddress.to.geozone.id}"
					rendered="#{to==targetAddress.to}"
					valueChangeListener="#{targetAddress.onChangeGeoZone}">
					<f:selectItems value="#{geozoneCollections.geoTrees}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:div>
						<aon:selectOneMenu value="#{targetAddress.to.geozone.id}"
							rendered="#{targetAddress.new}">
							<f:selectItems value="#{geozoneCollections.geoTrees}" />
						</aon:selectOneMenu>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=targetAddress.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]"
						actionListener="#{targetAddress.onAccept}"
						rendered="#{to==targetAddress.to}" value=""
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton id="cancelEdit-targetAddress"
						title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==targetAddress.to}"
						actionListener="#{targetAddress.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="cancelRemove-targetAddress"
						title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==targetAddress.to}"
						confirmTitle="#{bundle.aon_confirm_title}"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{targetAddress.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!targetAddress.new}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{targetAddress.onAccept}"
							rendered="#{targetAddress.new}" value=""
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancelNew-targetAddress"
							title="#{bundle.aon_cancel}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{targetAddress.new}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{targetAddress.onCancel}"
							immediate="true" accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>

	</aon:panel>
</ui:composition>
