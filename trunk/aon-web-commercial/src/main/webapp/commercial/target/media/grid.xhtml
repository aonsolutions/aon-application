<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div rendered="#{!target.new}" >

		<aon:editDataTable id="targetMediaData" var="to"
			value="#{targetMedia.model}" rows="20"
			columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
				aon-editDataTable-textColumn, aon-editDataTable-textColumn,
				aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{targetMedia.to == null}"
				actionListener="#{targetMedia.onSelect}" />
				
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{targetMedia.onReset}" value=""
							rendered="#{!targetMedia.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_media}" />
				</f:facet>
				<aon:outputText value="#{to.mediaType}"
					rendered="#{to!=targetMedia.to}" />
				<aon:selectOneMenu rendered="#{to==targetMedia.to}"
					value="#{targetMedia.to.mediaType}">
					<f:selectItems value="#{registryCollections.mediaTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu rendered="#{targetMedia.new}"
						value="#{targetMedia.to.mediaType}">
						<f:selectItems value="#{registryCollections.mediaTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column width="200">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_value}" />
				</f:facet>
				<aon:outputText value="#{to.value}" rendered="#{to!=targetMedia.to}" />
				<aon:inputText value="#{to.value}"
					rendered="#{to==targetMedia.to}" required="true"
					maxlength="64" size="40" onblur="toLowerCase(this);" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText value="#{targetMedia.to.value}" 
							rendered="#{targetMedia.new}" required="true"
							maxlength="64" size="40" onblur="toLowerCase(this);" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column width="330">
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_comment}" />
				</f:facet>
				<aon:outputText value="#{to.comment}" rendered="#{to!=targetMedia.to}" />
				<aon:inputText value="#{to.comment}" size="40" maxlength="64"
					rendered="#{to==targetMedia.to}" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText value="#{targetMedia.to.comment}"
							rendered="#{targetMedia.new}"
							size="40" maxlength="64" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=targetMedia.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						actionListener="#{targetMedia.onAccept}" 
						rendered="#{to==targetMedia.to}" value=""
						reRender="targetMediaDataScroller"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton id="cancelEdit-targetMedia" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==targetMedia.to}"
						actionListener="#{targetMedia.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="cancelRemove-targetMedia" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==targetMedia.to}" reRender="targetMediaDataScroller"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{targetMedia.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!targetMedia.new}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{targetMedia.onAccept}"
							rendered="#{targetMedia.new}" value=""
							reRender="targetMediaDataScroller"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancelNew-targetMedia" title="#{bundle.aon_cancel}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{targetMedia.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{targetMedia.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>

		<aon:div id="targetMediaDataScroller" layout="none">
			<aon:dataScroller for="targetMediaData" rowCount="#{targetMedia.model.rowCount}" showNote="false" />
		</aon:div>

	</aon:div>
</ui:composition>
