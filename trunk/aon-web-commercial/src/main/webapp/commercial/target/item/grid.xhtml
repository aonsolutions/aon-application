<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<aon:editDataTable id="targetItemData" var="to"
			value="#{targetItem.model}" rows="20"
			columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

			<aon:rowSelector toggleOnClick="#{targetItem.to == null}"
				actionListener="#{targetItem.onSelect}" />
				
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{targetItem.onReset}" value=""
							rendered="#{!targetItem.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{productBundle.itempos_item}" />
				</f:facet>
				<aon:outputText value="#{to.item.product.name} #{to.item.detail}"
					rendered="#{to!=targetItem.to}" />
				<aon:div styleClass="aon-lookup" rendered="#{to==targetItem.to}">
					<aon:lookupInputText 
						lookup="#{itemLookup}" required="true"
						reRender="TargetItem_item_detail"
						value="#{targetItem.to.item.id}" size="5">
					</aon:lookupInputText>
					<aon:lookupButton
						windowTitle="#{appBundle.aon_lookup_item}" actionType="search"
						selectReRender="targetItemData"
						lookup="#{itemLookup}" minHeight="460" minWidth="650"
						property="#{targetItem.to.item}">
					</aon:lookupButton>
					<aon:inputText id="TargetItem_item_detail"
						value="#{(to.item.product.name!=null)?(to.item.product.name):('')}"
						size="80" disabled="true" />
				</aon:div>
				<f:facet name="footer">
					<aon:div styleClass="aon-lookup" rendered="#{targetItem.new}">
						<aon:lookupInputText id="TargetItem_item_id-New"
							lookup="#{itemLookup}" required="true"
							reRender="TargetItem_item_detail-New"
							value="#{targetItem.to.item.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="TargetItem_item_id_lookup-New"
							windowTitle="#{appBundle.aon_lookup_item}" actionType="search"
							selectReRender="TargetItem_item_id-New,TargetItem_item_detail-New"
							lookup="#{itemLookup}" minHeight="460" minWidth="650"
							property="#{targetItem.to.item}">
						</aon:lookupButton>
						<aon:inputText id="TargetItem_item_detail-New"
							value="#{(targetItem.to.item.product.name!=null)?(targetItem.to.item.product.name):('')}"
							size="80" disabled="true" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}"
					rendered="#{to!=targetItem.to}" />
				<aon:selectOneMenu rendered="#{to==targetItem.to}"
					required="true" value="#{to.status}">
					<f:selectItem value="#{null}" itemLabel="    " />
					<f:selectItems value="#{commecialCollections.targetItemStatuses}" />
				</aon:selectOneMenu>								
				<f:facet name="footer">
					<aon:selectOneMenu rendered="#{targetItem.new}"
						required="true" value="#{targetItem.to.status}">
						<f:selectItem value="#{null}" itemLabel="    " />
						<f:selectItems value="#{commecialCollections.targetItemStatuses}" />
					</aon:selectOneMenu>								
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=targetItem.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						actionListener="#{targetItem.onAccept}" 
						rendered="#{to==targetItem.to}" value=""
						reRender="targetItemDataScroller"
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton id="cancelEdit-targetItem" title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==targetItem.to}"
						actionListener="#{targetItem.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="cancelRemove-targetItem" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==targetItem.to}" reRender="targetItemDataScroller"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{targetItem.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!targetItem.new}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{targetItem.onAccept}"
							rendered="#{targetItem.new}" value=""
							reRender="targetItemDataScroller"
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancelNew-targetItem" title="#{bundle.aon_cancel}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{targetItem.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{targetItem.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>

		<aon:div id="targetItemDataScroller" layout="none">
			<aon:dataScroller2 for="targetItemData" showNote="false" />
		</aon:div>

	</aon:div>
</ui:composition>
