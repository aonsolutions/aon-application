<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="targetForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_targets}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{target.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="target_form"
							actionListener="#{target.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{target.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{target.onCancel}"
							confirmAction="target_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!target.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{target.onRemove}"
							confirmAction="target_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!target.new}" immediate="true"
							action="target_search" actionListener="#{target.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />														
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							rendered="#{!target.new}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{target.onCancel}"
							action="target_list"
							accesskey="#{bundle.aon_key_cancel}" />
							
						<aon:spin controller="#{target}" action="target_form" rendered="#{!target.new}" />
							
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true">

					<ui:include src="/commercial/target/formContent.xhtml">
						<ui:param name="targetController" value="#{target}"/>
					</ui:include>

				</aon:panelGrid>

				<aon:panelTabSet rendered="#{!target.new}" selectedTab="#{target.selectedTab}" valueChangeListener="#{target.tabChanged}">
					<aon:panelTab name="targetAddress" label="#{registryBundle.aon_address}">
						<ui:include src="/commercial/registry/address/grid.xhtml" >
							<ui:param name="controller" value="#{targetAddress}"/>
							<ui:param name="showDataScroller" value="#{true}"/>
						</ui:include>
                    </aon:panelTab>

					<aon:panelTab name="targetMedia" label="#{registryBundle.aon_media}">
						<ui:include src="/commercial/registry/media/grid.xhtml" >					
							<ui:param name="controller" value="#{targetMedia}"/>
							<ui:param name="showDataScroller" value="#{true}"/>
						</ui:include>
                    </aon:panelTab>

					<aon:panelTab name="targetSegment" label="#{appBundle.aon_target_segment}">
						<ui:include src="/commercial/target/segment/grid.xhtml" />
                    </aon:panelTab>

					<aon:panelTab name="targetItem" label="#{appBundle.aon_target_item}">
						<ui:include src="/commercial/target/item/grid.xhtml" />
                    </aon:panelTab>

					<aon:panelTab name="targetSeller" label="#{appBundle.aon_target_seller}">
						<ui:include src="/commercial/target/seller/grid.xhtml" />
                    </aon:panelTab>

					<aon:panelTab name="targetProfile" label="#{marketingBundle.aon_target_profile}">
						<ui:include src="/commercial/target/profile/grid.xhtml" />
                    </aon:panelTab>

					<aon:panelTab name="targetTracking" label="#{appBundle.aon_target_tracking}">
						<ui:include src="/commercial/target/tracking/list.xhtml" />
                    </aon:panelTab>

				</aon:panelTabSet>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />		
		<aon:lookupButtonPopup lookup="#{questionLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
