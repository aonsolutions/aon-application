<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="campaignSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.aon_marketing_campaigns}" />
				<ui:param name="controller" value="#{campaign}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{campaign.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="campaign_list" />		
					
					<aon:outputLabel for="Campaign_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Campaign_id" size="60"
						valueChangeListener="#{campaign.addExpression}" />		
			
					<aon:outputLabel for="Campaign_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Campaign_description" size="60"
						valueChangeListener="#{campaign.addExpression}" />
				
					<aon:outputText value="#{bundle.aon_status}"/>
					<aon:div>
						<aon:selectBooleanCheckbox id="st0" value="#{campaign.statusActive}" />
						<aon:outputLabel for="st0"
							value="#{marketingBundle.aon_active}" />
						<aon:selectBooleanCheckbox id="st1" value="#{campaign.statusInactive}" />
						<aon:outputLabel for="st1"
							value="#{marketingBundle.aon_inactive}" />
					</aon:div>

				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
	</ui:define>
		
</ui:composition>
