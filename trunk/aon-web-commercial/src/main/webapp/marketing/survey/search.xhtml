<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="surveySearch">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{marketingBundle.aon_marketing_surveis}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_toolbar_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset" ajaxSingle="true"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="survey_form" actionListener="#{survey.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							action="survey_list" actionListener="#{survey.onCancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
							accesskey="#{bundle.aon_key_cancel}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<!-- end toolbar navigation -->

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{survey.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="survey_list" />		
					
					<aon:outputLabel for="Survey_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Survey_id" size="60"
						valueChangeListener="#{survey.addExpression}" />		
			
					<aon:outputLabel for="Survey_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Survey_description" size="60"
						valueChangeListener="#{survey.addExpression}" />
				
					<aon:outputText value="#{bundle.aon_status}"/>
					<aon:div>
						<aon:selectBooleanCheckbox id="st0" value="#{survey.statusActive}" />
						<aon:outputLabel for="st0"
							value="#{marketingBundle.aon_active}" />
						<aon:selectBooleanCheckbox id="st1" value="#{survey.statusInactive}" />
						<aon:outputLabel for="st1"
							value="#{marketingBundle.aon_inactive}" />
					</aon:div>

				</ui:define>
			
			</ui:decorate>
							 
		</aon:form>
	</ui:define>
		
</ui:composition>
