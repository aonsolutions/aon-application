<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:c="http://java.sun.com/jstl/core"			
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
<f:view>
<c:forEach items="#{aonConfiguration.applicationBundleList}" var="aBundle">
	<f:loadBundle basename="#{aBundle.value}" var="#{aBundle.key}" />
</c:forEach>
<head>
	<title><ui:insert name="title">Title</ui:insert></title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="Expires" content="0" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Cache-Control" content="no-store" />

	<c:forEach items="#{aonConfiguration.styleSheets}" var="styleSheet">
		<a4j:loadStyle src="#{styleSheet}"/>
	</c:forEach>
	
	<a4j:loadScript src="/js/Utils.js"/>	
	<a4j:loadScript src="/js/Window.js"/>
	<a4j:loadScript src="/js/Form.js"/>
	<link rel="shortcut icon" type="image/x-icon" href="#{facesContext.externalContext.requestContextPath}/images/favicon.ico" />

	<ui:insert name="head" />
</head>
<body>
	<aon:div id="aon-content">
		<ui:insert name="mainHeader" />
		<ui:insert name="mainContent" />
	</aon:div>	
</body>
</f:view>
</html>
