<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="workGroupList">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.aon_users}" />				
				</aon:div>
			
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">

						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{workGroup.onReset}" rendered="#{!workGroup.new}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
						<aon:confirmButton id="save"
							value="#{bundle.aon_save}" rendered="#{workGroup.to!=null or workGroup.new}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_save_confirm}"
							confirmActionListener="#{workGroup.onAccept}"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:confirmButton id="cancel"
							value="#{bundle.aon_cancel}" rendered="#{workGroup.to!=null or workGroup.new}"
							styleClass="aon-content-toolbar-item aon-icon-cancel" immediate="#{true}"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{workGroup.onCancel}"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{workGroup.to!=null and !workGroup.new}"
							styleClass="aon-content-toolbar-item aon-icon-delete" immediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{workGroup.onRemove}"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="users" value="#{bundle.aon_cancel}"  rendered="#{workGroup.to==null and !workGroup.new}"
							action="user" actionListener="#{user.onSearch}"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"/>
							<!-- 
						<aon:commandButton id="scopes" value="#{appBundle.aon_scopes}"
							action="scope" actionListener="#{scope.onSearch}"
							styleClass="aon-content-toolbar-item aon-icon-ambito"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-ambito'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-ambito aon-content-toolbar-item-hover'"/>
							 -->
					</aon:div>
				</aon:div>
			</aon:panelGrid>
			<!-- end toolbar navigation -->
			<aon:div styleClass="aon-scroll-area">
			
					<aon:div styleClass="aon-content-subTitle">
						<aon:outputText value="#{appBundle.aon_workgroups}" />	
					</aon:div>					
					

					<aon:editDataTable id="workGroupData" var="to" rows="20"
						rendered="#{workGroup.model.rowCount > 0 or workGroup.new}" value="#{workGroup.model}"
						columnClasses="aon-editTable-icon,
							aon-editTable-cell,
							aon-editTable-cell,
							aon-editTable-buttons">

						<aon:column>
							<aon:rowSelector multiple="false"
								toggleOnClick="#{workGroup.to == null}"
								selectionListener="#{workGroup.onSelect}" />
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editTable-button aon-icon-reset"
										actionListener="#{workGroup.onReset}" value=""
										rendered="#{!workGroup.new}">
									</aon:commandButton>
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.aon_workgroup_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{to!=workGroup.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==workGroup.to}" size="60"
								value="#{workGroup.to.description}" maxlength="45" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{workGroup.new}" size="60"
									value="#{workGroup.to.description}" maxlength="45" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.aon_workgroup_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" rendered="#{to!=workGroup.to}" />
							<aon:selectOneMenu rendered="#{to==workGroup.to}" value="#{workGroup.to.status}">
								<f:selectItems value="#{configCollections.workGroupStatuses}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu rendered="#{workGroup.new}" value="#{workGroup.to.status}">
									<f:selectItems value="#{configCollections.workGroupStatuses}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=workGroup.to}">&#160;</f:verbatim>
								<aon:confirmButton alt="[#{bundle.aon_accept}]"
									styleClass="aon-editTable-button aon-icon-accept"
									rendered="#{to==workGroup.to}"
									confirmTitle="Confirmation Dialog" 
									confirmMessage="#{bundle.aon_save_confirm}"
									confirmActionListener="#{workGroup.onAccept}"/>
								<aon:confirmButton alt="[#{bundle.aon_cancel}]"
									styleClass="aon-editTable-button aon-icon-cancel"
									rendered="#{to==workGroup.to}"
									confirmTitle="Confirmation Dialog" 
									confirmMessage="#{bundle.aon_cancel_confirm}"
									confirmActionListener="#{workGroup.onCancel}" immediate="true"/>
								<aon:confirmButton alt="[#{bundle.aon_remove}]"
									styleClass="aon-editTable-button aon-icon-delete"
									rendered="#{to==workGroup.to}"
									confirmTitle="Confirmation Dialog" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{workGroup.onRemove}" immediate="true"/>
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!workGroup.new}">&#160;</f:verbatim>
									<aon:confirmButton alt="[#{bundle.aon_accept}]"
										styleClass="aon-editTable-button aon-icon-accept"
										rendered="#{workGroup.new}"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_save_confirm}"
										confirmActionListener="#{workGroup.onAccept}"/>
									<aon:confirmButton alt="[#{bundle.aon_cancel}]"
										styleClass="aon-editTable-button aon-icon-cancel"
										rendered="#{workGroup.new}"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{workGroup.onCancel}" immediate="true"/>
								</aon:div>
							</f:facet>
						</aon:column>
					</aon:editDataTable>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="workGroupData" />
						<ui:param name="model" value="#{workGroup.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
