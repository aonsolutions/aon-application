<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="smsForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_desktop_sms}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_editing}" />
					</aon:div> 

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{appBundle.aon_sms_send}"
							reRender="smsSender"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{sms.sendMessage}"
							accesskey="#{bundle.aon_key_save}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div id="smsSender" styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting" style="width:auto;"
						columnClasses="aon-width-500, aon-width-300">

					<aon:div >
						<aon:panelGrid columns="2">
							<aon:outputLabel for="SMS_from" value="#{appBundle.aon_sms_from}" />
							<aon:outputText id="SMS_from" size="40" value="#{desktop.loggedUserName}" />
		
							<aon:outputLabel for="SMS_message" value="#{appBundle.aon_sms_message}" />
							<aon:inputTextarea id="SMS_message" value="#{sms.message}" cols="80" rows="4" required="true"
									onkeyup="UpdateMessageLength()" onkeydown="UpdateMessageLength()" />

							<aon:outputText value="" />
							<aon:outputText id="messageLength" value="(max 160)" />
						</aon:panelGrid>

						<aon:panelGrid columnClasses="aon-editDataTable-textColumn">
							<rich:panel>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.aon_sms_sendto}" />
								</f:facet>

								<aon:div>
									<aon:panelGrid columns="2">
										<aon:outputLabel for="SMS_cellularPhone"
											value="#{groupwareBundle.contact_cellular_phone}" />
										<aon:panelGroup>
											<aon:inputText id="SMS_cellularPhone" maxlength="9" size="9" value="#{sms.recipient}" >
												<f:validateLength maximum="9" />
												<f:validateLongRange maximum="999999999" />
											</aon:inputText>
											<aon:commandButton id="add2List" value="" title="#{appBundle.aon_sms_add2list}"
												styleClass="aon-finding-toolbar-item aon-dataScroller-button-next"
												actionListener="#{sms.add2List}"
												reRender="SMS_cellularPhone, recipientList"
												accesskey="#{bundle.aon_key_save}" />
											<aon:commandButton id="findContact" value="" title="#{appBundle.aon_sms_find_contacts}"
												reRender="showWindow"
												styleClass="aon-finding-toolbar-item aon-icon-search"
												actionListener="#{sms.openContacts}" />
										</aon:panelGroup>
									</aon:panelGrid>
			
									<rich:dataList id="recipientList" var="recipient" value="#{sms.recipients}" rows="10"
											style="margin-left:1.1em;margin-top:1em;">
				           				<h:outputText value="#{recipient}"/>
							        </rich:dataList>
								</aon:div>
							</rich:panel>
						</aon:panelGrid>

						<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting" style="width:auto;">
							<aon:selectBooleanCheckbox id="priceInfo" styleClass="aon-float-left" />
							<aon:outputText value="#{appBundle.aon_sms_priceinfo}" styleClass="aon-float-left"/>
						</aon:panelGrid>
					</aon:div>

					<aon:div>
						<rich:panel>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_sms_summary}" />
							</f:facet>
							<aon:div>
								<aon:panelGrid columns="2">
									<aon:outputLabel for="SMS_user_messages" value="#{appBundle.aon_sms_user_messages}" />
									<aon:outputText id="SMS_user_messages" size="40" value="" />

									<aon:outputLabel for="SMS_company_messages" value="#{appBundle.aon_sms_company_messages}" />
									<aon:outputText id="SMS_company_messages" size="40" value="" />

									<aon:outputLabel for="SMS_total_month" value="#{appBundle.aon_sms_total_month}" />
									<aon:outputText id="SMS_total_month" size="40" value="" />
								</aon:panelGrid>
							</aon:div>
						</rich:panel>
						<rich:panel>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_sms_pricelist}" />
							</f:facet>
							<aon:div>
								<aon:panelGrid columns="2">
									
								</aon:panelGrid>
							</aon:div>
						</rich:panel>
					</aon:div>
					
				</aon:panelGrid>
			</aon:div>

   		</aon:form>
		<ui:include src="/facelet/sms/contacts.xhtml" />
	</ui:define>
</ui:composition>

</body>
</html>
