<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	
	<ui:define name="head">
	</ui:define>

	<ui:define name="content">
		
		<aon:form id="userForm">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">

				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.aon_users}" />
				</aon:div>

				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="user_search"
							actionListener="#{user.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-icon-search"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-search'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-search aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="groups" value="#{appBundle.aon_workgroups}"
							action="work_group" actionListener="#{workGroup.onSearch}"
							styleClass="aon-content-toolbar-item aon-icon-group"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-group'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-group aon-content-toolbar-item-hover'"/>
						<aon:commandButton id="scopes" value="#{appBundle.aon_scopes}"
							action="scope" actionListener="#{scope.onSearch}"
							styleClass="aon-content-toolbar-item aon-icon-ambito"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-ambito'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-ambito aon-content-toolbar-item-hover'"/>
					</aon:div>
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle">
						<aon:div styleClass="aon-content-subtitle-internal">
							<aon:outputText
								value="#{user.new?(bundle.aon_reset):(bundle.aon_editing)}" />
						</aon:div>
					</aon:div>

					<aon:panelGrid columns="2">
						<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
							cellpadding="0" cellspacing="0"
							columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

							<aon:outputLabel for="User_name"
								value="#{configBundle.user_name}" />
							<aon:inputText id="User_name"
								styleClass="aon-inputText" required="true" size="80"
								maxlength="64" value="#{user.to.name}" />

							<aon:outputLabel for="User_login"
								value="#{configBundle.user_login}" />
							<aon:inputText id="User_login" disabled="true"
								styleClass="aon-inputText" required="true" size="20"
								maxlength="16" value="#{user.to.login}" />

						</aon:panelGrid>
					</aon:panelGrid>
					
					<ui:include src="/facelet/user/userWorkGroup/grid.xhtml" />
							
					<ui:include src="/facelet/user/userScope/grid.xhtml" />

				</aon:div>
			</aon:div>

		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
