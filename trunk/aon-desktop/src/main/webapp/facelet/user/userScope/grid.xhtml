<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-form-group" rendered="#{!user.new}">
		<aon:div styleClass="aon-form-group-title">
			<aon:outputLabel for="userScopeDataList"
				value="#{configBundle.scope_scopes}" />

		</aon:div>

		<aon:div styleClass="aon-form-group-body">
			<aon:editDataTable id="userScopeDataList" var="to"
				value="#{userScope.model}" rows="20"
				styleClass="aon-editTable"
				columnClasses="aon-editTable-icon,
									aon-editTable-cell,
									aon-editTable-buttons">

				<aon:column>
					<aon:rowSelector multiple="false"
						toggleOnClick="#{userScope.to == null}"
						selectionListener="#{userScope.onSelect}" />
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:outputText value="&#160;" />
					<f:facet name="footer">
						<aon:div>
							<aon:commandButton alt="[#{bundle.aon_reset}]"
								styleClass="aon-editTable-button aon-icon-reset"
								actionListener="#{userScope.onReset}" value=""
								rendered="#{!userScope.new}"
								accesskey="#{bundle.aon_key_new_line}" />
						</aon:div>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{configBundle.scope_scope}" />
					</f:facet>
					<aon:outputText value="#{to.scope.description}"
						rendered="#{to!=userScope.to}" />
					<aon:selectOneMenu rendered="#{to==userScope.to}"
						valueChangeListener="#{userScope.onScopeChanged}"
						value="#{userScope.to.scope.id}">
						<f:selectItems value="#{configCollections.scopes}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu rendered="#{userScope.new}"
							valueChangeListener="#{userScope.onScopeChanged}"
							value="#{userScope.to.scope.id}">
							<f:selectItems value="#{configCollections.scopes}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<aon:div>
						<f:verbatim rendered="#{to!=userScope.to}">&#160;</f:verbatim>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{userScope.onAccept}"
							rendered="#{to==userScope.to}" value=""
							styleClass="aon-editTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{userScope.onCancel}"
							immediate="#{true}"
							styleClass="aon-editTable-button aon-icon-cancel" value=""
							rendered="#{to==userScope.to}"
							accesskey="#{bundle.aon_key_cancel_line}" />
						<aon:commandButton title="#{bundle.aon_remove}"
							actionListener="#{userScope.onRemove}"
							rendered="#{to==userScope.to}"
							styleClass="aon-editTable-button aon-icon-delete" value=""
							accesskey="#{bundle.aon_key_remove_line}" />
					</aon:div>
					<f:facet name="footer">
						<aon:div>
							<f:verbatim rendered="#{!userScope.new}">&#160;</f:verbatim>
							<aon:commandButton title="#{bundle.aon_save}"
								actionListener="#{userScope.onAccept}"
								rendered="#{userScope.new}" value=""
								styleClass="aon-editTable-button aon-icon-accept"
								accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{userScope.onCancel}"
								immediate="#{true}" rendered="#{userScope.new}"
								styleClass="aon-editTable-button aon-icon-cancel" value=""
								accesskey="#{bundle.aon_key_cancel_line}" />
						</aon:div>
					</f:facet>
				</aon:column>
			</aon:editDataTable>
		</aon:div>
	</aon:div>
</ui:composition>
