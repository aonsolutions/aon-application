<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="userList">

		<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
		cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			<aon:div styleClass="aon-content-title-internal">
				<aon:outputText value="#{appBundle.aon_users}" />				
			</aon:div>		

			<!-- start toolbar navigation -->
			<aon:div styleClass="aon-content-toolbar-internal">
				<aon:div styleClass="aon-content-toolbar-item-group">
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						action="user_search" actionListener="#{user.onEditSearch}"
						styleClass="aon-content-toolbar-item aon-icon-search"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-search'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-search aon-content-toolbar-item-hover'"
						accesskey="#{bundle.aon_key_search}"/>
					<aon:commandButton id="groups" value="#{appBundle.aon_workgroups}"
						action="work_group" actionListener="#{workGroup.onSearch}"
						styleClass="aon-content-toolbar-item aon-icon-group"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-group'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-group aon-content-toolbar-item-hover'"/>
					<aon:commandButton id="scopes" value="#{appBundle.aon_scopes}"
						action="scope" actionListener="#{scope.onSearch}"
						styleClass="aon-content-toolbar-item aon-icon-ambito"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-ambito'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-ambito aon-content-toolbar-item-hover'"/>
				</aon:div>
			</aon:div>
			<!-- end toolbar navigation -->
		</aon:panelGrid>
		
		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">					
					<aon:div styleClass="aon-content-subTitle">
						<aon:outputText value="#{appBundle.aon_users}" />		
					</aon:div>
					
					<aon:dataTable id="userDataList" 
						value="#{user.model}" var="to" rows="20"
						styleClass="aon-dataTable">
					
							<aon:column>
								<aon:rowSelector selectionListener="#{user.onSelect}" />
								<f:facet name="header">
									<aon:outputText value="#{configBundle.user_name}" />
								</f:facet>
								<aon:outputText value="#{to.name}"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{configBundle.user_login}" />
								</f:facet>
								<aon:outputText value="#{to.login}"/>
							</aon:column>

						</aon:dataTable>
						
						<ui:include src="/facelet/shared/dataScroller.xhtml">
							<ui:param name="dataTable" value="userDataList" />
							<ui:param name="model" value="#{user.model}" />
							<ui:param name="showNote" value="#{true}" />
						</ui:include>					
					
				</aon:div>
			</aon:div>
			
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
