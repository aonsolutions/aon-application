<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="userForm">
		
			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
			cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
					
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.aon_users}" />					
				</aon:div>		
				
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="search"
							value="#{bundle.aon_search}"
							action="user_list" actionListener="#{user.onSearch}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}"/>
						<aon:commandButton id="groups" value="#{bundle.aon_cancel}"
							action="user" actionListener="#{workGroup.onSearch}"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"/>
						<!-- 
						<aon:commandButton id="scopes" value="#{appBundle.aon_scopes}"
							action="scope" actionListener="#{scope.onSearch}"
							styleClass="aon-content-toolbar-item aon-icon-ambito"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-ambito'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-ambito aon-content-toolbar-item-hover'"/>
							 -->
					</aon:div>
				</aon:div>
			</aon:panelGrid>
			<!-- end toolbar navigation -->

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">		
					<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle">
						<aon:div styleClass="aon-content-subtitle-internal">
							<aon:outputText value="#{bundle.aon_search}" />
						</aon:div>
					</aon:div>
			
					<aon:panelGrid columns="2" styleClass="aon-formTable"
					cellpadding="0" cellspacing="0"
						columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

						<aon:outputLabel for="User_name"
							value="#{configBundle.user_name}" />
						<aon:inputText id="User_name" size="80"
							styleClass="aon-inputText"
							valueChangeListener="#{user.addExpression}" />

						<aon:outputLabel for="User_login"
							value="#{configBundle.user_login}" />
						<aon:inputText id="User_login" size="20"
							styleClass="aon-inputText"
							valueChangeListener="#{user.addExpression}" />
							
					</aon:panelGrid>

				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
