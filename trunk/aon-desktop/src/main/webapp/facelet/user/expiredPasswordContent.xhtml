<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="userForm">
	
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{companyBundle.company_data_module}" />
				<ui:param name="toolbarDescription"	value="#{user.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{appBundle.aon_save_password}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						reRender="aonHeader,aonContent"
						action="home" actionListener="#{currentUser.acceptPassword}"
						accesskey="#{bundle.aon_key_save}" >
						<f:setPropertyActionListener target="#{aonConfiguration.properties.hideHeaderLinks}" value="#{false}" />
						<f:setPropertyActionListener target="#{aonConfiguration.properties.hideMenuBar}" value="#{false}" />
					</aon:commandButton>						
				</ui:define>				
			</ui:decorate>			
	
			<aon:div styleClass="aon-scroll-area">
	
				<aon:div styleClass="aon-note aon-margin-bottom" style="width:580px;">
					<aon:div styleClass="aon-note-internal aon-icon-info aon-nowrap">
						<aon:div styleClass="aon-padding-left">
	                    	<aon:outputText value="#{appBundle.aon_desktop_expired_password_label_1}" />
						</aon:div>
						<aon:div styleClass="aon-padding-left">
	                    	<aon:outputText value="#{appBundle.aon_desktop_expired_password_label_2}" />
						</aon:div>
					</aon:div>
				</aon:div>
	
				<aon:panelGrid columns="2" dir="true" >
	
					<aon:outputLabel for="User_name" style="width:200px"
						value="#{configBundle.config_user_name}" />
					<aon:inputText id="User_name" disabled="true"
						required="true" size="80"
						maxlength="64" value="#{loggedUser.loggedUserName}" />
	
					<aon:outputLabel for="User_login"
						value="#{configBundle.config_user_login}" />
					<aon:inputText id="User_login" disabled="true"
						required="true" size="20"
						maxlength="16" value="#{currentUser.to.login}" />
	
					<aon:outputLabel for="User_Password" rendered="#{!currentUser.managerChangingPassword}"
						value="#{configBundle.config_user_password}" />
					<aon:inputSecret id="User_Password" styleClass="aon-inputText"
						required="true" size="20" rendered="#{!currentUser.managerChangingPassword}"
						maxlength="16" value="#{currentUser.userManager.password}" />
	
					<aon:outputLabel for="User_NewPassword"
						value="#{configBundle.config_user_new_password}" />
					<aon:inputSecret id="User_NewPassword"
						required="true" size="20" styleClass="aon-inputText"
						maxlength="16" value="#{currentUser.userManager.newPassword}">
						<f:validateLength minimum="4" />
					</aon:inputSecret>
	
					<aon:outputLabel for="User_ConfirmPassword"
						value="#{configBundle.config_user_confirm_password}" />
					<aon:inputSecret id="User_ConfirmPassword"
						required="true" size="20" styleClass="aon-inputText"
						maxlength="16" value="#{currentUser.userManager.confirmPassword}" >
						<f:validateLength minimum="4" />
					</aon:inputSecret>
	
				</aon:panelGrid>
			</aon:div>
	
		</aon:form>
		
	</ui:define>

</ui:composition>
