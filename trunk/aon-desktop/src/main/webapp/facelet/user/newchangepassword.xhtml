<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition>
		
	<aon:form id="userForm">

		<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
			cellpadding="0" cellspacing="0"
			columnClasses="aon-content-title,aon-content-toolbar">

			<aon:div styleClass="aon-content-title-internal">
				<aon:outputText value="#{appBundle.aon_change_password}" />
			</aon:div>

			<aon:div styleClass="aon-content-toolbar-internal">
				<aon:div styleClass="aon-content-toolbar-item-group">
					<aon:commandButton id="save" value="#{bundle.aon_save}"
						actionListener="#{currentUser.accept}"
						action="home"
						styleClass="aon-content-toolbar-item aon-icon-accept"
						onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
						onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
						accesskey="#{bundle.aon_key_save}" />
				</aon:div>
			</aon:div>
		</aon:panelGrid>

		<aon:div styleClass="aon-scroll-area">
			<aon:div styleClass="aon-scroll-area-internal">

				<aon:panelGrid columns="2">
					<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
						cellpadding="0" cellspacing="0"
						columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

						<aon:outputLabel for="User_login" style="width:200px"
							value="#{configBundle.user_login}" />
						<aon:inputText id="User_login" disabled="true"
							styleClass="aon-inputText" required="true" size="20"
							maxlength="16" value="#{currentUser.to.login}" />
						
						<ice:outputLabel for="User_Password" style="width:200px"
							value="#{appBundle.user_current_password}"
							styleClass="aon-form-input-text-label" />
						<ice:inputSecret id="User_Password" partialSubmit="false"
							styleClass="aon-inputText" required="true" size="20"
							maxlength="16" value="#{currentUser.userManager.password}" />
						
						<aon:outputLabel for="User_NewPassword" style="width:200px"
							value="#{appBundle.user_new_password}"
							styleClass="aon-form-input-text-label" />
						<ice:inputSecret id="User_NewPassword" partialSubmit="false"
							styleClass="aon-inputText" required="true" size="20"
							maxlength="16" value="#{currentUser.userManager.newPassword}" />

						<aon:outputLabel for="User_ConfirmPassword" style="width:200px"
							value="#{appBundle.user_confirm_password}"
							styleClass="aon-form-input-text-label" />
						<ice:inputSecret id="User_ConfirmPassword" partialSubmit="false"
							styleClass="aon-inputText" required="true" size="20"
							maxlength="16" value="#{currentUser.userManager.confirmPassword}" />
							
					</aon:panelGrid>
				</aon:panelGrid>

			</aon:div>
		</aon:div>

	</aon:form>

</ui:composition>

</body>
</html>
