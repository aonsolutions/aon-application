<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition>

   <a4j:region>
        <h:form>
            <a4j:poll status="aonStatus" interval="300000"
            	actionListener="#{desktop.onRefresh}"
            	reRender="desktopDiv1,desktopDiv2" />
        </h:form>
    </a4j:region>
    
	<aon:form id="mainForm">

		<aon:div styleClass="aon-scroll-area">		

				<aon:panelGrid columns="3" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column1,aon-portlets-column2,aon-portlets-column3">

					<aon:div id="desktopDiv1">
						<aon:div styleClass="aon-portlet" rendered="#{email.infobarEnabled and email.mailActive}">
							<aon:div styleClass="aon-portlet-title">
								<aon:outputLink value="/aon-webmail?aonDesktop=true" target="aonWebMail">
									<aon:outputText value="#{appBundle.desktop_mails}" styleClass="aon-portlet-title-text aon-icon aon-icon-webmail"/>
								</aon:outputLink>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:dataTable id="mailSummaryList"
									value="#{email.mailSummaryModel}" var="to"
									columnClasses="aon-table-portlet-column"
									rowClasses="aon-table-portlet-row"
									styleClass="aon-width-170 aon-table-portlet">

									<aon:column styleClass="aon-text-left" >
										<aon:outputText value="#{to.name}"/>
									</aon:column>

									<aon:column styleClass="aon-text-right" >
										<aon:outputText value="#{to.unreadMessageCount}"/>
									</aon:column>

								</aon:dataTable>
							</aon:div>
						</aon:div>

						<aon:div styleClass="aon-portlet" rendered="#{email.infobarEnabled and !email.mailActive}">
							<aon:div styleClass="aon-portlet-title">
								<aon:outputText value="#{appBundle.desktop_mails}" styleClass="aon-portlet-title-text aon-icon aon-icon-webmail"/>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:outputText value="#{appBundle.desktop_mail_error}"/>
							</aon:div>
						</aon:div>

						<aon:div styleClass="aon-portlet" rendered="#{taskManager.infobarEnabled and taskManager.taskHolderAvailable}">
							<aon:div styleClass="aon-portlet-title">
								<aon:outputLink value="/aon-project?aonDesktop=true" target="aonTask">
									<aon:outputText value="#{appBundle.desktop_tasks}"
										style="cursor: default;" 
										styleClass="aon-portlet-title-text aon-icon aon-icon-task-assume"/>
								</aon:outputLink>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:dataTable id="taskSummaryList"
									value="#{taskManager.taskSummaryModel}" var="to"
									columnClasses="aon-table-portlet-column"
									rowClasses="aon-table-portlet-row"
									styleClass="aon-width-170 aon-table-portlet">

									<aon:column styleClass="aon-text-left" >
										<aon:outputText value="#{to.description}"/>
									</aon:column>

									<aon:column styleClass="aon-text-right" >
										<aon:outputText value="#{to.total}"/>
									</aon:column>

								</aon:dataTable>
							</aon:div>
						</aon:div>

						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">								
								<aon:div styleClass="aon-portlet-title-buttons">
									<aon:commandLink actionListener="#{notice.onReset}" action="notice_form">
 										<aon:outputText value="&#160;" styleClass="aon-icon-portlet aon-icon-new"/>
									</aon:commandLink>
								</aon:div>
								<aon:commandLink actionListener="#{notice.onSearch}" action="notice_list">
									<aon:outputText value="#{appBundle.desktop_notices}" styleClass="aon-portlet-title-text aon-icon aon-icon-alarms"/>
								</aon:commandLink>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:dataTable id="noticeSummaryList" columns="3"
									value="#{desktop.noticeSummaryModel}" var="to"
									columnClasses="aon-table-portlet-column"
									rowClasses="aon-table-portlet-row"
									styleClass="aon-width-170 aon-table-portlet">

									<aon:column styleClass="aon-text-left" >
										<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-call.png']}" rendered="#{to.call}"/>
										<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-visit.png']}" rendered="#{to.visit}"/>
										<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-message.png']}" rendered="#{to.message}"/>
										<h:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-info.png']}" rendered="#{to.communication}"/>
									</aon:column>
									<aon:column styleClass="aon-text-left" >
										<aon:outputText value="#{to.noticeType}"/>
									</aon:column>
									<aon:column styleClass="aon-text-right" >
										<aon:outputText value="#{to.count}"/>
									</aon:column>

								</aon:dataTable>
							</aon:div>
						</aon:div>

						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">
								<aon:div styleClass="aon-portlet-title-buttons">
									<aon:commandLink actionListener="#{note.onReset}" action="note_form">
 										<aon:outputText value="&#160;"  styleClass="aon-icon-portlet aon-icon-new"/>
									</aon:commandLink>
								</aon:div>
								<aon:commandLink actionListener="#{note.onSearch}" action="note_list">
									<aon:outputText value="#{appBundle.desktop_notes}" styleClass="aon-portlet-title-text aon-icon aon-icon-notes"/>
								</aon:commandLink>	
							</aon:div>
							<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
								<aon:dataTable id="recentNoteList"
									value="#{desktop.recentNoteModel}" var="to" rows="5"
									columnClasses="aon-table-portlet-column"
									rowClasses="aon-table-portlet-row"
									styleClass="aon-width-170 aon-table-portlet">

									<aon:rowSelector action="note_form" actionListener="#{desktop.onSelectNote}"/>
									
									<aon:column>
										<aon:outputText value="#{to.subject}"/>
									</aon:column>			

								</aon:dataTable>
							</aon:div>
						</aon:div>
					</aon:div>

					<aon:div id="desktopDiv2">
						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">
								<aon:commandLink actionListener="#{notice.onSearch}" action="notice_list">
									<aon:outputText value="#{appBundle.desktop_notices_list}" styleClass="aon-portlet-title-text aon-icon aon-icon-alarms"/>
								</aon:commandLink>	
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
							
								<c:if test="#{loggedUser.userInRole['Admin'] and desktop.updatesAvailable}">
									<aon:panelCollapsible expanded="true" label="#{appBundle.desktop_update_title}">
										<aon:div>
											<aon:outputLink value="#{desktop.updateApplicationURL}" target="_blank">
												<aon:graphicImage url="#{aonResource.resolve['/images/aon-icon/aon-icon-warning.png']}" />											
												<aon:outputText value="#{appBundle.desktop_update_message}"
													style="font-family:arial;font-size:9pt;color:#e55302 !important;"
													styleClass="aon-bold aon-vertical-align-middle aon-margin-left" /> 
											</aon:outputLink>									
										</aon:div>
									</aon:panelCollapsible>
								</c:if>					
								
								<ui:include src="/com/code/aon/ui/groupware/facelet/alarm/listContent.xhtml" >
									<ui:param name="alarmDescriptionWidth" value="64" />
								</ui:include>		
													
							</aon:div>
						</aon:div>
					</aon:div>

					<aon:div>
						<c:if test="#{company.withLogo}">
							<aon:div styleClass="aon-text-center">
								<a4j:mediaOutput
									mimeType="#{company.logoMimeType}" 
									cacheable="false" element="img" 
									value="#{company.aonFile.key}" 
									style="#{desktop.bigLogo?'width:200px':''}"
									createContent="#{company.createLogoContent}">
								</a4j:mediaOutput>
							</aon:div>
						</c:if>
						<!--  soporte -->
						<aon:div styleClass="aon-support">
							<aon:div styleClass="aon-support-title">
								<h:graphicImage url="#{aonResource.resolve['/images/aon-content/aon-esferalia-logo.png']}" />
								<aon:div><aon:outputText value="#{appBundle.desktop_support_title}" /></aon:div>
							</aon:div>
							
							<aon:div styleClass="aon-support-telephone">
								<aon:div styleClass="aon-support-telephone-internal">
									<aon:outputText value="#{appBundle.desktop_support_telephone_number}" />
								</aon:div>
							</aon:div>		
							
							<aon:div styleClass="aon-support-mail">
								<aon:outputLink target="_blank" value="http://www.esferalia.com/aon-soporte/es/aon-soporte.html">	
										<aon:outputText value="#{appBundle.desktop_support_send_email}" />
							    </aon:outputLink>
							</aon:div>
						</aon:div>
						<!-- fin soporte -->
					</aon:div>
					
				</aon:panelGrid>

		</aon:div>

	</aon:form>

</ui:composition>

</body>
</html>
