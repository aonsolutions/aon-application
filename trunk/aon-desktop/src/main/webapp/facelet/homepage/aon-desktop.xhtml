<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition>

	<aon:form id="mainForm">

		<aon:div styleClass="aon-scroll-area" >
			<aon:div styleClass="aon-scroll-area-internal">

				<aon:panelGrid columns="3" cellpadding="5" cellspacing="0" border="0" style="width:100%"
					columnClasses="aon-portlets-column1,aon-portlets-column2,aon-portlets-column3">

					<aon:div>
						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">
								<ice:outputLink value="/aon-desktop/aon-webmail.auth" target="_blank">
									<aon:outputText value="#{appBundle.aon_desktop_mails}" styleClass="aon-portlet-title-text aon-icon aon-icon-webmail"/>
								</ice:outputLink>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:dataTable id="mailSummaryList"
									cellpadding="0" cellspacing="0"
									value="#{desktop.mailSummaryModel}" var="to"
									style="width:155px" columnClasses="aon-text-left,aon-text-right"
									styleClass="aon-table-portlet">

									<aon:column>
										<aon:outputText value="#{to.name}"/>
									</aon:column>

									<aon:column>
										<aon:outputText value="#{to.folder.unreadMessageCount}"/>
									</aon:column>

								</aon:dataTable>
							</aon:div>
						</aon:div>

						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">
								<ice:commandLink actionListener="#{notice.onSearch}" action="notice">
									<aon:outputText value="#{appBundle.aon_desktop_notices}" styleClass="aon-portlet-title-text aon-icon aon-icon-alarms"/>
								</ice:commandLink>
								<aon:div styleClass="aon-portlet-title-buttons">
									<ice:commandLink actionListener="#{notice.onReset}" action="notice_form">
 										<aon:outputText value="&#160;"  styleClass="aon-icon-portlet aon-icon-new"/>
									</ice:commandLink>
								</aon:div>
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<aon:dataTable id="noticeSummaryList" columns="3"
									value="#{desktop.noticeSummaryModel}" var="to"
									style="width:155px" columnClasses="aon-text-left,aon-text-left,aon-text-right"
									styleClass="aon-table-portlet" cellpadding="0" cellspacing="0">

									<aon:column>
										<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-call.png" rendered="#{to.call}"/>
										<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-visit.png" rendered="#{to.visit}"/>
										<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-message.png" rendered="#{to.message}"/>
										<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-info.png" rendered="#{to.communication}"/>
									</aon:column>
									<aon:column>
										<aon:outputText value="#{to.noticeType}"/>
									</aon:column>
									<aon:column>
										<aon:outputText value="#{to.count}"/>
									</aon:column>

								</aon:dataTable>
							</aon:div>
						</aon:div>

						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">
								<ice:commandLink actionListener="#{note.onSearch}" action="note">
									<aon:outputText value="#{appBundle.aon_desktop_notes}" styleClass="aon-portlet-title-text aon-icon aon-icon-notes"/>
								</ice:commandLink>	
								<aon:div styleClass="aon-portlet-title-buttons">
									<ice:commandLink actionListener="#{note.onReset}" action="note_form">
 										<aon:outputText value="&#160;"  styleClass="aon-icon-portlet aon-icon-new"/>
									</ice:commandLink>
								</aon:div>
							</aon:div>
							<aon:div styleClass="aon-portlet-body aon-box-outstanding2">
								<aon:dataTable id="recentNoteList" style="width:85%"
									value="#{desktop.recentNoteModel}" var="to" rows="5"
									styleClass="aon-table-portlet">

									<aon:column>
										<aon:rowSelector selectionListener="#{desktop.onSelectNote}"/>
										<aon:outputText value="#{to.subject}"/>
									</aon:column>			

								</aon:dataTable>
							</aon:div>
						</aon:div>
					</aon:div>

					<aon:div>
						<aon:div styleClass="aon-portlet">
							<aon:div styleClass="aon-portlet-title">
								<ice:commandLink actionListener="#{notice.onSearch}" action="notice">
									<aon:outputText value="#{appBundle.aon_desktop_notices_list}" styleClass="aon-portlet-title-text aon-icon aon-icon-alarms"/>
								</ice:commandLink>	
							</aon:div>
							<aon:div styleClass="aon-portlet-body">
								<ice:panelCollapsible expanded="true" styleClass="aon-collapsible-">
									<f:facet name="header"> 
										<aon:outputText value="#{appBundle.aon_desktop_today}"/>
									</f:facet>
									<aon:dataTable id="todayAlarmList" styleClass="aon-table-portlet" 
										value="#{desktop.todayAlarmModel}" var="to" border="0" 
										columns="3" columnClasses="aon-datatable-icon,aon-datatable-time,aon-text-left"
										>

										<aon:column>
											<aon:rowSelector selectionListener="#{desktop.onSelectTodayAlarm}"/>	
											<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-call.png" rendered="#{to.call}"/>
											<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-visit.png" rendered="#{to.visit}"/>
											<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-message.png" rendered="#{to.message}"/>
											<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-info.png" rendered="#{to.communication}"/>											
										
											<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-high-prty.png" rendered="#{to.highPrty}"/>
											<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-medium-prty.png" rendered="#{to.mediumPrty}"/>
											<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-low-prty.png" rendered="#{to.lowPrty}"/>
										</aon:column>
										<aon:column>
											<aon:outputText value="#{to.alarmDate}" styleClass="aon-bold">
												<f:convertDateTime pattern="#{bundle.aon_time_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>

										<aon:column>
											<aon:outputText value="#{to.descriptionHead}"/>
										</aon:column>

									</aon:dataTable>
								</ice:panelCollapsible>
					
								<ice:panelCollapsible expanded="true" styleClass="aon-collapsible-">
									<f:facet name="header"> 
										<aon:outputText value="#{appBundle.aon_desktop_recent}"/>
									</f:facet>
									<aon:dataTable id="recentAlarmList" columns="3" border="0"
										value="#{desktop.recentAlarmModel}" var="to"
										styleClass="aon-table-portlet" columnClasses="aon-datatable-icon,aon-datatable-date,aon-text-left">
										

										<aon:column>
											<aon:rowSelector selectionListener="#{desktop.onSelectRecentAlarm}"/>
	
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-call.png" rendered="#{to.call}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-visit.png" rendered="#{to.visit}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-message.png" rendered="#{to.message}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-info.png" rendered="#{to.communication}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-high-prty.png" rendered="#{to.highPrty}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-medium-prty.png" rendered="#{to.mediumPrty}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-low-prty.png" rendered="#{to.lowPrty}"/>
											
										</aon:column>
										<aon:column>
											<aon:outputText value="#{to.alarmDate}" styleClass="aon-bold">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>
										<aon:column>
											<aon:outputText value="#{to.descriptionHead}"/>
										</aon:column>

									</aon:dataTable>
								</ice:panelCollapsible>
	
								<ice:panelCollapsible expanded="true" styleClass="aon-collapsible-">
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_desktop_ancient}"/>
									</f:facet>
									<aon:dataTable id="ancientAlarmList" columns="3" border="0"
										value="#{desktop.ancientAlarmModel}" var="to" 
										styleClass="aon-table-portlet"	columnClasses="aon-datatable-icon,aon-datatable-date,aon-text-left"
										cellpadding="0" cellspacing="0" >

										<aon:column>
											<aon:rowSelector selectionListener="#{desktop.onSelectAncientAlarm}"/>

												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-call.png" rendered="#{to.call}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-visit.png" rendered="#{to.visit}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-message.png" rendered="#{to.message}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-info.png" rendered="#{to.communication}"/>
										
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-high-prty.png" rendered="#{to.highPrty}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-medium-prty.png" rendered="#{to.mediumPrty}"/>
												<h:graphicImage url="/css/iceCss/images/aon-icon/aon-icon-low-prty.png" rendered="#{to.lowPrty}"/>
											
										</aon:column>
										<aon:column>
											<aon:outputText value="#{to.alarmDate}" styleClass="aon-bold">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
										</aon:column>

										<aon:column>
											<aon:outputText value="#{to.descriptionHead}"/>
										</aon:column>

									</aon:dataTable>
								</ice:panelCollapsible>
							</aon:div>
						</aon:div>
					</aon:div>

					<aon:div>
						<aon:div styleClass="aon-company-logo">
							<aon:graphicImage id="Logo_preview" 
								rendered="#{desktop.logoAttached}"
								url="desktop.logo"/>	
						</aon:div>
						
						<ice:outputLink target="_blank" value="http://www.esferalia.com/es/contact.html">
							<h:graphicImage url="/images/icefaces/aon-soporte.png"/>
						</ice:outputLink>
					</aon:div>

				</aon:panelGrid>

			</aon:div>
		</aon:div>

	</aon:form>

</ui:composition>

</body>
</html>
