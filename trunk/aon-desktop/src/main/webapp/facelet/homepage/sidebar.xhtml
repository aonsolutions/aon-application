<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition>
	<aon:form>
		<aon:div styleClass="aon-sidebarIcons-bottom">

		<aon:commandLink styleClass="aon-icon-big aon-icon-big-home" action="home">
			<aon:outputText value="#{appBundle.aon_home}"/>
		</aon:commandLink>

		<ice:outputLink styleClass="aon-icon-big aon-icon-big-correo" value="/aon-webmail" target="_blank">
			<aon:outputText value="#{appBundle.aon_webmail}"/>
		</ice:outputLink>

		<aon:commandLink styleClass="aon-icon-big aon-icon-big-alarms" actionListener="#{notice.onSearch}" action="notice">
			<aon:outputText value="#{groupwareBundle.aon_alarms}"/>
		</aon:commandLink>
	
		<aon:commandLink styleClass="aon-icon-big aon-icon-big-notes" actionListener="#{note.onSearch}" action="note">
			<aon:outputText value="#{groupwareBundle.aon_notes}"/>
		</aon:commandLink>
	
		<aon:commandLink styleClass="aon-icon-big aon-icon-big-contacts" actionListener="#{contact.onSearch}" action="contact">
			<aon:outputText value="#{groupwareBundle.aon_contacts}"/>
		</aon:commandLink>

		<aon:commandLink styleClass="aon-icon-big aon-icon-big-favorites" actionListener="#{favorite.onSearch}" action="favorite">
			<aon:outputText value="#{groupwareBundle.aon_favorites}"/>
		</aon:commandLink>
			
		<aon:commandLink styleClass="aon-icon-big aon-icon-big-users" actionListener="#{user.onSearch}" action="user"
			renderedOnUserRole="Manager">
			<aon:outputText value="#{appBundle.aon_users}"/>
		</aon:commandLink>

		</aon:div>
	</aon:form>
</ui:composition>

</body>
</html>
