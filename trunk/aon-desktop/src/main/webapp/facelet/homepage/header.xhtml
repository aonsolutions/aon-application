<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>
	<aon:div id="aon-header">
		<aon:panelGrid cellpadding="0" cellspacing="0" border="0" columns="3"
			style="width:100%"
			columnClasses="aon-header-name,aon-header-slogan,aon-header-info">
			<aon:div>
				<aon:outputConnectionStatus styleClass="aon-outputConnectionStatus"
					startStyleClass="aon-outputConnectionStatus-start"
					stopStyleClass="aon-outputConnectionStatus-stop" />
				<aon:outputText value="#{appBundle.aon_application_title}"
					styleClass="aon-applicationName" style="margin-left:0.5em;" />
			</aon:div>

			<aon:div>
				<aon:div
					rendered="#{aonConfiguration.properties.middleHeader == null}">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:div
					rendered="#{aonConfiguration.properties.middleHeader != null}">
					<aon:outputText escape="false"
						value="#{aonConfiguration.properties.middleHeader}" />
				</aon:div>
			</aon:div>
			<aon:div style="white-space:nowrap;">
				<aon:div>
					<aon:panelGrid columns="3" cellpadding="5" cellspacing="0">
						<aon:div style="white-space:nowrap;padding:1px 0.5em">
							<aon:outputText value="#{desktop.companyName}" />
						</aon:div>
						<aon:div style="white-space:nowrap;padding:1px 0em">
							<aon:outputText value="/" />
						</aon:div>
						<aon:div
							style="white-space:nowrap;border-left:#CCC 1px solid;border-top:#CCC 1px solid;border-right:#808080 1px solid;border-bottom:#808080 1px solid;padding:1px 0.5em">
							<aon:div style="display:inline;white-space:nowrap;">
								<aon:form>
									<h:commandLink
										actionListener="#{currentUser.onLoadCurrentUser}"
										action="user_changepassword_form">
										<h:graphicImage
											url="/aonResource/images/aon-icon/aon-icon-user.png"
											style="border:0px;height:11px" />
										<aon:outputText value="#{desktop.loggedUserName}" />
									</h:commandLink>
								</aon:form>									
							</aon:div>
						</aon:div>
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:panelGrid>

		<aon:div styleClass="aon-header-additionalInfo">
			<aon:div styleClass="aon-float-right">
				<aon:div styleClass="aon-header-menu-item">
					<h:outputLink target="_top"
						value="${facesContext.externalContext.requestContextPath}">
						<h:outputText value="#{bundle.aon_home}" />
					</h:outputLink>
					<aon:commandLink style="border-right:0;"
						onclick="parent.window.close();" target="_top">
						<aon:outputText value="#{securityBundle.aon_login_user_logout}" />
					</aon:commandLink>
				</aon:div>
			</aon:div>
			<aon:outputText value="#{webmail.currentDate}" />
		</aon:div>
	</aon:div>

</ui:composition>
</body>
</html>
