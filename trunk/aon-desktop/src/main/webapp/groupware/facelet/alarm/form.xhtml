<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="alarmForm">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">

				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{groupwareBundle.aon_alarm}" />
				</aon:div>

				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							action="home" actionListener="#{alarm.onCancel}"
							immediate="true"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="alarm_delay" value="#{groupwareBundle.alarm_delay}"
							styleClass="aon-content-toolbar-item aon-icon-alarms-postpone"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-alarms-postpone'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-icon-alarms-postpone'"
							action="home" actionListener="#{alarm.onDelayAlarm}"/>	
						<aon:commandButton id="alarm_finish" value="#{groupwareBundle.alarm_finish}"
							styleClass="aon-content-toolbar-item aon-icon-alarms-finish"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-alarms-finish'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-icon-alarms-finish'"
							action="home" actionListener="#{alarm.onFinishAlarm}"/>	
					</aon:div>
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:panelGrid columns="2">
						<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
							cellpadding="0" cellspacing="0"
							columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

							<aon:outputLabel for="Alarm_alarmDate"
								value="#{groupwareBundle.aon_date}" />
							<aon:outputText id="Alarm_alarmDate" value="#{alarm.to.alarmDate}">
								<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>

							<aon:outputLabel for="Alarm_delayTime"
								value="#{groupwareBundle.alarm_delay_time}" />
							<aon:selectOneMenu id="Alarm_delayTime"
								value="#{alarm.delayTime}">
								<f:selectItems value="#{groupWareCollections.delayTimes}" />
							</aon:selectOneMenu>
							
							<aon:outputLabel for="Alarm_priority"
								value="#{groupwareBundle.alarm_priority}" />
							<aon:outputText id="Alarm_priority" value="#{alarm.to.priority}"/>
							
							<aon:outputLabel for="Alarm_status"
								value="#{groupwareBundle.alarm_status}" />
							<aon:outputText id="Alarm_status" value="#{alarm.to.status}"/>

							<aon:outputLabel for="Alarm_description"
								value="#{groupwareBundle.alarm_description}" />
							<aon:inputTextarea id="Alarm_description"
								cols="60" rows="7" 
								value="#{alarm.to.description}" />

						</aon:panelGrid>
					</aon:panelGrid>

				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
