<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="contactForm">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">

				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{groupwareBundle.aon_contact}" />
				</aon:div>

				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{contact.to!=null or contact.new}"
							actionListener="#{contact.accept}"
							action="contact_list"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}" />
							
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{contact.to!=null or contact.new}"
							actionListener="#{contact.cancel}"
							immediate="true" 
							action="contact_list"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}" />
								
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!contact.new}"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="Confirmation Dialog"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{contact.onRemove}"
							confirmAction="contact_list"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}" />
							<!-- 
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="contact_search"
							actionListener="#{contact.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-icon-search"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-search'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-search aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}" /> 
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="contact_form"
							rendered="#{!contact.new}"
							actionListener="#{contact.onReset}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />-->
					</aon:div>
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:div styleClass="aon-content-subtitle"
						id="aon-content-subtitle">
						<aon:div styleClass="aon-content-subtitle-internal">
							<aon:outputText
								value="#{contact.new?(bundle.aon_reset):(bundle.aon_editing)}" />
						</aon:div>
					</aon:div>


						<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
							cellpadding="0" cellspacing="0"
							columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

							<aon:outputLabel for="Contact_name"
								value="#{groupwareBundle.contact_name}" />
							<aon:inputText id="Contact_name"
								maxlength="64" size="80"
								value="#{contact.to.name}" />

							<aon:outputLabel for="Contact_organization"
								value="#{groupwareBundle.contact_organization}" />
							<aon:inputText id="Contact_organization"
								maxlength="64" size="80"
								value="#{contact.to.organization}" />

							<aon:outputLabel for="Contact_phone"
								value="#{groupwareBundle.contact_phone}" />
							<aon:inputText id="Contact_phone"
								maxlength="64" size="15"
								value="#{contact.to.phone}" />

							<aon:outputLabel for="Contact_cellularPhone"
								value="#{groupwareBundle.contact_cellular_phone}" />
							<aon:inputText id="Contact_cellularPhone"
								maxlength="64" size="15"
								value="#{contact.to.cellularPhone}" />

							<aon:outputLabel for="Contact_fax"
								value="#{groupwareBundle.contact_fax}" />
							<aon:inputText id="Contact_fax"
								maxlength="64" size="15"
								value="#{contact.to.fax}" />

							<aon:outputLabel for="Contact_email"
								value="#{groupwareBundle.contact_email}" />
							<aon:inputText id="Contact_email"
								maxlength="64" size="40"
								value="#{contact.to.email}" />

							<aon:outputLabel for="Contact_address"
								value="#{groupwareBundle.contact_address}" />
							<aon:inputText id="Contact_address"
								maxlength="128" size="80"
								value="#{contact.to.address}" />
							
							<aon:outputLabel for="Contact_note" value="#{groupwareBundle.contact_note}" />
							<aon:inputTextarea id="Contact_note"
								value="#{contact.to.note}" cols="81" rows="7" />

						</aon:panelGrid>


				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
