<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="favoriteCategoryList">

			<aon:div ajaxRendered="true" layout="none">

				<aon:div styleClass="aon-finding-title-toolbar">
					<aon:panelGrid columns="3" dir="true"
						columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
	
						<aon:div styleClass="aon-finding-title-internal">
							<aon:outputText value="#{groupwareBundle.aon_favorite}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{groupwareBundle.aon_favorite_category}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-toolbar-item-group">
							<aon:commandButton id="reset" value="#{bundle.aon_reset}"
								actionListener="#{favoriteCategory.onReset}" rendered="#{!favoriteCategory.new}"
								styleClass="aon-finding-toolbar-item aon-icon-reset"
								accesskey="#{bundle.aon_key_new}"/>
							<aon:commandButton id="save"
								value="#{bundle.aon_save}"
								actionListener="#{favoriteCategory.onAccept}" 
								rendered="#{favoriteCategory.to!=null or favoriteCategory.new}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								accesskey="#{bundle.aon_key_new}" />
							<aon:confirmButton id="cancelNew"
								value="#{bundle.aon_cancel}" rendered="#{favoriteCategory.new}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="#{true}"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{favoriteCategory.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:commandButton id="cancelEdit"
								value="#{bundle.aon_cancel}" rendered="#{favoriteCategory.to!=null and (!favoriteCategory.new)}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="#{true}"
								actionListener="#{favoriteCategory.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:confirmButton id="remove"
								value="#{bundle.aon_remove}" rendered="#{favoriteCategory.to!=null and !favoriteCategory.new}"
								styleClass="aon-finding-toolbar-item aon-icon-delete" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{favoriteCategory.onRemove}"
								accesskey="#{bundle.aon_key_remove}"/>
							<aon:commandButton id="favorite_list" value="#{bundle.aon_back}"
								rendered="#{favoriteCategory.to==null}"
								immediate="true" action="favorite"
								styleClass="aon-finding-toolbar-item aon-icon-cancel"/>
						</aon:div>
					</aon:panelGrid>
				</aon:div>
				<!-- end toolbar navigation -->
	
				<!--  aon-region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<aon:editDataTable id="favoriteCategoryData" var="to" rows="0"
						rendered="#{(favoriteCategory.model.rowCount > 0) or (favoriteCategory.new)}" 
						value="#{favoriteCategory.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
								
						<aon:rowSelector toggleOnClick="#{favoriteCategory.to == null}"
							actionListener="#{favoriteCategory.onSelect}" />
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{favoriteCategory.onReset}" value=""
										rendered="#{!favoriteCategory.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{groupwareBundle.favorite_category_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{to!=favoriteCategory.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==favoriteCategory.to}" size="100"
								value="#{favoriteCategory.to.description}" maxlength="64" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{favoriteCategory.new}" size="100"
									value="#{favoriteCategory.to.description}" maxlength="64" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=favoriteCategory.to}">&#160;</f:verbatim>
								<aon:commandButton title="[#{bundle.aon_accept}]" 
									actionListener="#{favoriteCategory.onAccept}" 
									rendered="#{to==favoriteCategory.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==favoriteCategory.to}"
									actionListener="#{favoriteCategory.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==favoriteCategory.to}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{favoriteCategory.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!favoriteCategory.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]" 
										actionListener="#{favoriteCategory.onAccept}" 
										rendered="#{favoriteCategory.new}"
										styleClass="aon-editDataTable-button aon-icon-accept"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{favoriteCategory.new}"
										confirmTitle="#{bundle.aon_confirm_title}" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{favoriteCategory.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
					</aon:editDataTable>
					<aon:dataScroller for="favoriteCategoryData" rowCount="#{favoriteCategory.model.rowCount}" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
