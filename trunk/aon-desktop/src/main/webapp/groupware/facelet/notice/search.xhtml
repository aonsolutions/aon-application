<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="noticeForm">
			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar"
				cellpadding="0" cellspacing="0"
				columnClasses="aon-content-title,aon-content-toolbar">

				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{groupwareBundle.aon_notice}" />
				</aon:div>

				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="notice_list" actionListener="#{notice.onSearch}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{notice.to!=null or notice.new}"
							actionListener="#{notice.cancel}"
							action="notice_list"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}" />
							
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="notice_form" actionListener="#{notice.onReset}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" /> 
					</aon:div>
				</aon:div>
			</aon:panelGrid>
			<!-- end toolbar navigation -->

			<aon:div styleClass="aon-scroll-area">

					<aon:div styleClass="aon-content-subtitle"
						id="aon-content-subtitle">
						<aon:div styleClass="aon-content-subtitle-internal">
							<aon:outputText value="#{bundle.aon_search}" />
						</aon:div>
					</aon:div>

					<aon:panelGrid columns="2" styleClass="aon-formTable"
						cellpadding="0" cellspacing="0"
						columnClasses="aon-formTable-column-odd,aon-formTable-column-even">

						
						
							<aon:outputLabel for="Notice_date-From"
								value="#{groupwareBundle.aon_date_from}" />
							<aon:selectInputDate id="Note_date-From"
								styleClass="aon-calendar-"
								style="z-index:2001;margin:0;vertical-align:middle;"
								imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								valueChangeListener="#{notice.addFromDateExpression}"
								popupDateFormat="#{bundle.aon_date_pattern}"
								renderAsPopup="true">
							</aon:selectInputDate>

							<aon:outputLabel for="Notice_date-To"
								value="#{groupwareBundle.aon_date_to}" />
							<aon:selectInputDate id="Notice_date-To"
								styleClass="aon-calendar-"
								style="z-index:2001;margin:0;vertical-align:middle;"
								imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								valueChangeListener="#{notice.addToDateExpression}"
								popupDateFormat="#{bundle.aon_date_pattern}"
								renderAsPopup="true">
							</aon:selectInputDate>
						
						<aon:outputLabel for="Notice_source"
							value="#{groupwareBundle.notice_source}" />
						<aon:inputText id="Notice_source" size="60"
							styleClass="aon-inputText"
							valueChangeListener="#{notice.addExpression}" />

						<aon:outputLabel for="Notice_company"
							value="#{groupwareBundle.notice_company}" />
						<aon:inputText id="Notice_company" size="60"
							styleClass="aon-inputText"
							valueChangeListener="#{notice.addExpression}" />

						<aon:outputLabel for="Notice_phone"
							value="#{groupwareBundle.notice_phone}" />
						<aon:inputText id="Notice_phone" size="20"
							styleClass="aon-inputText"
							valueChangeListener="#{notice.addExpression}" />

					</aon:panelGrid>

			</aon:div>


		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
