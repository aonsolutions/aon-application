<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{dbutilsBundle.dbutils_database_uptodate}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_form}" />
			</ui:decorate>
			
			<aon:div id="dbUptodateDiv" styleClass="aon-scroll-area" style="text-align: center;">
			
				<aon:div style="width: 60%; border: solid 1px black;margin-top: 20px;">
					<aon:div style="margin: 5px;">
						<aon:outputText value="#{dbutilsBundle.dbutils_database_version}: " />
						<aon:outputText value="#{dbUptodate.currentVersion}" />
					</aon:div>
				</aon:div>

				<aon:div rendered="#{dbUptodate.updatable}" style="width: 60%; border: solid 2px red;text-align: center;;margin-top: 20px;">
					<aon:div style="margin: 5px; color:red; font-size: 1.2em;">
						<aon:outputText value="#{dbutilsBundle.dbutils_update}" />
					</aon:div>
					<aon:div style="margin: 5px;">
						<aon:commandButton id="execute" 
							value="#{dbutilsBundle.dbutils_uptodate}"
							styleClass="aon-commandButton"
							actionListener="#{dbUptodate.onUptodate}"
							reRender="aonToolbar,dbUptodateDiv"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')"/>
					</aon:div>

				</aon:div>
				<aon:div rendered="#{!dbUptodate.updatable}" style="width: 60%; border: solid 1px black;;margin-top: 20px;">
					<aon:div style="margin: 5px; font-size: 1.2em;">
						<aon:outputText value="#{dbutilsBundle.dbutils_no_update}"/>
					</aon:div>
					<aon:div style="margin: 5px;">
						<h:outputLink target="_top"
							title="#{bundle.aon_home}"
							styleClass="aon-commandButton"
							value="${facesContext.externalContext.requestContextPath}">
							<h:outputText value="#{bundle.aon_back}" />
						</h:outputLink>			
					</aon:div>
				</aon:div>
				
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		
</ui:composition>
