<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="connectionErrorContainer">
		<aon:form id="connectionErrorForm">
			<rich:modalPanel id="choosePanel" 
				showWhenRendered="true" minHeight="100" minWidth="100" height="220"
				width="600" zindex="1000">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="ERROR" />
					</aon:div>
				</f:facet>
				<aon:div styleClass="aon-scroll-area" style="width: 90%;">
					<aon:div
						style="width: 100%; border: solid 1px black;margin-top: 20px;">
						<aon:div style="margin: 5px;">
							<aon:outputText value="#{dbutilsBundle.dbutils_database_error}" />
						</aon:div>
					</aon:div>
					<aon:div
						style="width: 100%; border: solid 2px red;text-align: center;;margin-top: 20px;">
						<aon:div style="margin: 5px; color:red; font-size: 1.2em;">
							<aon:outputText value="#{dbUptodate.connectionErrorMessage}" />
						</aon:div>
					</aon:div>
				</aon:div>
			</rich:modalPanel>
		</aon:form>
	</aon:div>
</ui:composition>
