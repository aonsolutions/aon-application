<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="feeInvoicingForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{financeBundle.finance_fee_invoicing_module}" />
				<ui:param name="controller" value="#{feeInvoicing}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="resetAction" value="" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="backAction" value="" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="feeInvoicing"
						value="#{financeBundle.finance_invoicing}"
						actionListener="#{feeInvoicing.onShowPanel}"
						styleClass="aon-finding-toolbar-item aon-icon-accept" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Invoice_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:panelGrid columns="2">
						<aon:selectOneMenu id="Invoice_series"
							value="#{feeInvoicing.params.series}"
							valueChangeListener="#{feeInvoicing.onSeriesChanged}"
							reRender="Invoice_number">
							<f:selectItem itemLabel=" " value="#{null}"/>
							<f:selectItems value="#{configCollections.series}" />
						</aon:selectOneMenu>
						<aon:inputText id="Invoice_number" required="true"
							value="#{feeInvoicing.params.number}" size="7" />
					</aon:panelGrid>

					<aon:outputLabel for="Customer_id"
						value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Customer_id" lookup="#{customerLookup}"
							reRender="Customer_full_name"
							value="#{feeInvoicing.params.customer.id}" size="5" />
						<aon:lookupButton
							windowTitle="#{customerBundle.customer_selection}"
							selectReRender="Customer_id,Customer_full_name"
							actionType="search" lookup="#{customerLookup}" minHeight="460"
							minWidth="650" property="#{feeInvoicing.params.customer}">
						</aon:lookupButton>
						<aon:inputText id="Customer_full_name"
							value="#{(feeInvoicing.params.customer.registry.name!=null)?(feeInvoicing.params.customer.registry.fullName):('')}"
							size="50" disabled="true" />
					</aon:div>

					<aon:outputLabel for="Item_product_code"
						value="#{productBundle.product_item}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Item_product_code" lookup="#{itemLookup}"
							reRender="Item_product_name"
							value="#{feeInvoicing.params.item.product.code}" size="5">
							<aon:joinProperty alias="Item_product_code"
								value="#{feeInvoicing.params.item.product.code}" />
						</aon:lookupInputText>
						<aon:lookupButton
							windowTitle="#{productBundle.product_selection}"
							selectReRender="Item_product_code,Item_product_name"
							actionType="search" lookup="#{itemLookup}" minHeight="460"
							minWidth="650" property="#{feeInvoicing.params.item}">
						</aon:lookupButton>
						<aon:inputText id="Item_product_name"
							value="#{feeInvoicing.params.item.product.name}"
							size="50" disabled="true" />
					</aon:div>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel for="BillingDate_Month"
							value="#{bundle.aon_month}" />
						<aon:selectOneMenu id="BillingDate_Month"
							value="#{feeInvoicing.params.month}">
							<f:selectItems value="#{commonCollections.months}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="BillingDate_Year"
							value="#{bundle.aon_year}" />
						<aon:inputText id="BillingDate_Year" size="5"
							value="#{feeInvoicing.params.year}" />
					</aon:panelGrid>

					<aon:outputLabel for="Invoicing_invoiceDate"
						value="#{financeBundle.finance_invoice_date}" />
					<aon:selectInputDate id="Invoicing_invoiceDate"
						value="#{feeInvoicing.params.invoiceDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />

					<aon:outputLabel for="Invoicing_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu id="Invoicing_securityLevel"
						value="#{feeInvoicing.params.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="CustomerFee_WorkPlace"
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="CustomerFee_WorkPlace"
						value="#{feeInvoicing.params.workPlace}">
						<f:selectItem itemLabel="-" itemValue="#{null}" />
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="CustomerFee_recordableInvoice"
							value="#{feeInvoicing.params.invoiceRecordable}" />	
						<aon:outputLabel for="CustomerFee_recordableInvoice"
							value="#{financeBundle.finance_record}" />
					</aon:div>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/progressBar.xhtml">
			<ui:param name="progressLabel" value="#{financeBundle.finance_fee_invoicing_module}" />
			<ui:param name="progressBarBean" value="#{feeInvoicing}" />
			<ui:param name="panelVisible" value="#{feeInvoicing.progressionPanelVisible}"/>
			<ui:param name="initialMessage" value="#{financeBundle.finance_fee_invoicing_initial}"/>
			<ui:param name="startMessage" value="#{financeBundle.finance_fee_invoicing_start}"/>
			<ui:param name="completeMessage" value="#{financeBundle.finance_fee_invoicing_complete}"/>
			<aon:methodParam name="startActionListener" default="#{feeInvoicing.onInvoice}" type="actionListener" />
			<aon:methodParam name="closeActionListener" default="#{feeInvoicing.onClosePanel}" type="actionListener" />
			<ui:param name="redirect" value="true" />
			<ui:param name="redirectMessage" value="#{financeBundle.finance_invoicing_wait}"/>
			<aon:methodParam name="redirectAction" default="#{feeInvoicing.invoice}"/>
		</ui:include>
	</ui:define>
</ui:composition>
