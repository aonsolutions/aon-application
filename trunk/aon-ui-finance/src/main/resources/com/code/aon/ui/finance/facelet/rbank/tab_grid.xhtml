<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">


	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{controllerAlias}" />
		<ui:param name="columnClasses"
			value="aon-nowrap aon-editDataTable-textColumn,
			aon-nowrap aon-editDataTable-textColumn,
			aon-width-150 aon-nowrap aon-editDataTable-textColumn" />

		<ui:define name="columns">
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.bank.name}"
					rendered="#{to!=controller.to}" />
				<aon:div rendered="#{to==controller.to}">
					<aon:lookupInputText id="Bank_code-Edit" lookup="#{bankLookup}"
						required="true" reRender="Bank_name-Edit"
						value="#{controller.to.bank.code}" size="5">
							<aon:joinProperty alias="Bank_code" value="#{controller.to.bank.code}" />
					</aon:lookupInputText>
					<aon:lookupButton id="Bank_lookup-Edit"
						windowTitle="#{financeBundle.finance_bank_selection}"
						selectReRender="Bank_code-Edit,Bank_name-Edit"
						lookup="#{bankLookup}" minHeight="440"
						property="#{controller.to.bank}">
					</aon:lookupButton>
					<aon:inputText id="Bank_name-Edit"
						value="#{controller.to.bank.name}"
						size="50" disabled="true" />
				</aon:div>

				<f:facet name="footer">
					<aon:div rendered="#{controller.new}">
						<aon:lookupInputText id="Bank_code-New" lookup="#{bankLookup}"
							required="true" reRender="Bank_code-New,Bank_name-New"
							value="#{controller.to.bank.code}" size="5">
							<aon:joinProperty alias="Bank_code" value="#{controller.to.bank.code}" />
						</aon:lookupInputText>
						<aon:lookupButton id="Bank_lookup-New"
							windowTitle="#{financeBundle.finance_bank_selection}"
							selectReRender="Bank_code-New,Bank_name-New"
							lookup="#{bankLookup}" minHeight="440"
							property="#{controller.to.bank}">
						</aon:lookupButton>
						<aon:inputText id="Bank_name-New"
							value="#{controller.to.bank.name}"
							size="50" disabled="true" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_bank_account}" />
				</f:facet>
				<aon:outputText value="#{to.formattedBankAccount}"
					rendered="#{to!=controller.to}" />
				<aon:div rendered="#{to==controller.to}">
					<aon:inputText value="#{controller.office}" required="true"
						size="4" maxlength="4">
						<f:validateLength minimum="4" maximum="4" />
					</aon:inputText>
					<aon:inputText value="#{controller.control}" required="true"
						size="2" maxlength="2">
						<f:validateLength minimum="2" maximum="2" />
					</aon:inputText>
					<aon:inputText value="#{controller.account}" required="true"
						size="10" maxlength="10">
						<f:validateLength minimum="10" maximum="10" />
					</aon:inputText>
				</aon:div>

				<f:facet name="footer">
					<aon:div rendered="#{controller.new}">
						<aon:inputText value="#{controller.office}" required="true"
							size="4" maxlength="4">
							<f:validateLength minimum="4" maximum="4" />
						</aon:inputText>
						<aon:inputText value="#{controller.control}" required="true"
							size="2" maxlength="2">
							<f:validateLength minimum="2" maximum="2" />
						</aon:inputText>
						<aon:inputText value="#{controller.account}" required="true"
							size="10" maxlength="10">
							<f:validateLength minimum="10" maximum="10" />
						</aon:inputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_bank_sufix}" />
				</f:facet>
				<aon:outputText value="#{to.sufix}" rendered="#{to!=controller.to}" />
				<aon:inputText value="#{to.sufix}" rendered="#{to==controller.to}"
					size="5" maxlength="3" />
				<f:facet name="footer">
					<aon:inputText value="#{controller.to.sufix}"
						rendered="#{controller.new}" size="5" maxlength="3" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
