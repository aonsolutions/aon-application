<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-toolbar" rendered="#{!fbatch.recorded}">
	
		<aon:commandButton title="#{bundle.aon_check_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkAll"
			value="#{bundle.aon_check_all}"
			actionListener="#{fBatchDetail.checkAll}" reRender="fBatchDetailDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
		<aon:commandButton title="#{bundle.aon_uncheck_all}"
			styleClass="aon-finding-toolbar-item aon-icon-checkNone"
			value="#{bundle.aon_uncheck_all}"
			actionListener="#{fBatchDetail.checkNone}" reRender="fBatchDetailDataDiv"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
		<aon:commandButton title="#{financeBundle.finance_remove_batch}"
			styleClass="aon-finding-toolbar-item aon-icon-deleteFolder"
			value="#{financeBundle.finance_remove_batch}"
			actionListener="#{fbatch.onRemoveSelected}" reRender="financeBatchForm,fbatchPanelTabSet"
			onclick="Richfaces.showModalPanel('waitProccess')" 
     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />				
		<h:commandLink target="_blank"
			title="#{fbatch.diskOk?(financeBundle.finance_download_disk):(financeBundle.finance_download_error)}"
			value="#{fbatch.diskOk?(financeBundle.finance_download_disk):(financeBundle.finance_download_error)}"
			actionListener="#{fbatch.downloadDisk}" rendered="#{fbatch.csbOutput!=null}"
			styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
	</aon:div>

	<aon:div id="fBatchDetailDataDiv">
		<aon:dataTable id="fBatchDetailData" value="#{fBatchDetail.model}"
			var="to" rows="20" rendered="#{fBatchDetail.model.rowCount > 0}"
			columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn, 
				aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
				aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn">				
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:selectBooleanCheckbox id="Included_Row_checked"
					value="#{fBatchDetail.rowChecked}"
					rendered="#{!fbatch.recorded}"
					valueChangeListener="#{fBatchDetail.rowSelected}" />	
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_invoice}" />
				</f:facet>
				<aon:outputText value="#{to.finance.invoice.referenceCode}" />
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.finance.invoice.registryName}" />
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{financeBundle.finance_finance_date}" />
				</f:facet>
				<aon:outputText value="#{to.finance.dueDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{configBundle.config_pay_method}" />
				</f:facet>
				<aon:outputText value="#{to.finance.payMethod.name}"/>
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{configBundle.config_bank_account}" />
				</f:facet>
				<aon:outputText value="#{to.finance.bankAccount}"/>
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}"/>
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText value="#{to.amount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
		</aon:dataTable>					
	
		<aon:dataScroller2 for="fBatchDetailData" showNote="true" />
	</aon:div>
	
</ui:composition>
