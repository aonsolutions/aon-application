<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="#{creditor_id}Container" rendered="#{renderedAttr}">
		<a4j:region>
			<aon:inputText id="#{creditor_id}" value="#{creditorEntity}"
				disabled="#{disabled}" required="#{required}" size="5">
				<!--
				El siguiente a4j:support activa el acelerador F2, para mostrar la ventana 
				de seleccion.
			 -->
				<a4j:support event="onkeyup"
					onsubmit="if(event.keyCode != 113) return false;"
					eventsQueue="#{creditor_id}KeyUp" ignoreDupResponses="true"
					requestDelay="100" actionListener="#{creditorWizard.onShow}"
					immediate="true" reRender="#{creditor_id}Container"
					oncomplete="searchFieldForFocus('#{creditor_id}searchName')">
				</a4j:support>

				<a4j:support eventsQueue="#{creditor_id}OnChange"
					actionListener="#{creditorWizard.onLookup}"
					ignoreDupResponses="true" requestDelay="100" event="onchange"
					reRender="#{creditor_id}Name,#{reRenderAttr}">
					<a4j:actionparam name="creditorActionParam"
						value="#{creditorELExpression}"
						assignTo="#{creditorWizard.valueExpression}">
					</a4j:actionparam>
					<a4j:actionparam name="lookupActionParam"
						value="#{onLookupELExpression}"
						assignTo="#{creditorWizard.extendedAttributesValueExpression}">
					</a4j:actionparam>
					<a4j:actionparam name="valueChangeListener"
						value="#{valueChangeListener}"
						assignTo="#{creditorWizard.valueChangeListener}">
					</a4j:actionparam>
				</a4j:support>
			</aon:inputText>
		</a4j:region>
		<a4j:commandButton styleClass="aon-lookupButton" value=""
			disabled="#{disabled}"
			actionListener="#{creditorWizard.onShow}" immediate="true"
			oncomplete="searchFieldForFocus('#{creditor_id}searchName')"
			reRender="#{creditor_id}Container" />
		<aon:div id="#{creditor_id}Name" style="display:inline">
			<aon:outputText rendered="#{creditorEntity.registry.name != null}"
				value="#{creditorEntity.registry.fullName}" />
			<aon:outputText rendered="#{creditorEntity.registry.name == null}"
				value="---------------------------------" />
		</aon:div>
		<rich:modalPanel id="#{creditor_id}creditorPanel" minHeight="600"
			rendered="#{creditorWizard.visible}" showWhenRendered="true"
			minWidth="650" top="50" left="100" height="600" width="650"
			zindex="2000" resizeable="true">

			<a4j:support event="onkeyup"
				onsubmit="if(event.keyCode != 27) return false;"
				eventsQueue="#{creditor_id}EscKeyUp" ignoreDupResponses="true"
				requestDelay="100" actionListener="#{creditorWizard.onClose}"
				immediate="true" reRender="#{creditor_id}Container"
				oncomplete="searchFieldForFocus('#{creditor_id}')">
			</a4j:support>

			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<h:outputText value="#{financeBundle.creditor_selection}" />
				</aon:div>
			</f:facet>
			<f:facet name="controls">
				<a4j:commandButton type="button" styleClass="aon-popupWindow-close"
						actionListener="#{creditorWizard.onClose}" immediate="true"
						reRender="#{creditor_id}Container"
						oncomplete="searchFieldForFocus('#{creditor_id}')">
				</a4j:commandButton>
			</f:facet>
			<a4j:region>
				<aon:panelGrid columns="2">
					<aon:outputText value="#{financeBundle.creditor_name}" />
					<aon:inputText value="#{creditorWizard.name}" size="40">
						<a4j:support event="onchange" ajaxSingle="true"
							eventsQueue="#{creditor_id}nm" ignoreDupResponses="true"
							requestDelay="100"
							actionListener="#{creditorWizard.inputChanged}" />
					</aon:inputText>

					<aon:outputText value="#{financeBundle.creditor_surname}" />
					<aon:inputText value="#{creditorWizard.surname}" size="40">
						<a4j:support event="onchange" ajaxSingle="true"
							eventsQueue="#{creditor_id}sn" ignoreDupResponses="true"
							requestDelay="100"
							actionListener="#{creditorWizard.inputChanged}" />
					</aon:inputText>

					<aon:outputText value="#{financeBundle.creditor_alias}" />
					<aon:inputText value="#{creditorWizard.alias}" size="20">
						<a4j:support event="onchange" ajaxSingle="true"
							eventsQueue="#{creditor_id}ac" ignoreDupResponses="true"
							requestDelay="100"
							actionListener="#{creditorWizard.inputChanged}" />
					</aon:inputText>

					<aon:outputText value="#{financeBundle.creditor_document}" />
					<aon:div>
						<aon:inputText value="#{creditorWizard.document}" size="15">
							<a4j:support event="onchange" ajaxSingle="true"
								eventsQueue="#{creditor_id}ic" ignoreDupResponses="true"
								requestDelay="100"
								actionListener="#{creditorWizard.inputChanged}" />
						</aon:inputText>
						<a4j:commandButton value="#{bundle.aon_search}"
							style="margin-left: 5px;"
							actionListener="#{creditorWizard.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							eventsQueue="#{creditor_id}SearchQueue" ignoreDupResponses="true"
							requestDelay="100" reRender="#{creditor_id}tableContainer"
							oncomplete="selectFirstRow('#{creditor_id}table')">
						</a4j:commandButton>
					</aon:div>
				</aon:panelGrid>
			</a4j:region>

			<rich:separator height="2px;"
				style="margin-top: 5px;margin-bottom: 5px;" />

			<aon:div id="#{creditor_id}tableContainer">
				<aon:div styleClass="aon-form-note"
					rendered="#{creditorWizard.model.rowCount == 0}">
					<aon:div styleClass="aon-form-note-internal">
						<aon:panelGroup>
							<aon:outputText value="#{bundle.aon_search_no_results}" />
						</aon:panelGroup>
					</aon:div>
				</aon:div>
				<aon:editDataTable id="#{creditor_id}table"
					value="#{creditorWizard.model}" var="cust"
					rendered="#{creditorWizard.model.rowCount > 0}"
					columnClasses="aon-editDataTable-iconColumn,
						aon-editDataTable-textColumn,
						aon-editDataTable-textColumn,
						aon-editDataTable-textColumn">
					<h:column>
						<aon:commandButton id="#{creditor_id}RowSelector"
							styleClass="aon-editDataTable-button aon-icon-rowSelector"
							actionListener="#{creditorWizard.onSelectToRegistry}" 
							immediate="true" ajaxSingle="true" 
							eventsQueue="#{creditor_id}SelectQueue" requestDelay="100" 
							ignoreDupResponses="true" onkeyup="tableKeyUp(event.keyCode)"
							reRender="#{creditor_id}Container,#{reRenderAttr}">
							<a4j:actionparam name="creditorActionParam"
								value="#{creditorELExpression}"
								assignTo="#{creditorWizard.valueExpression}">
							</a4j:actionparam>
							<a4j:actionparam name="lookupActionParam"
								value="#{onLookupELExpression}"
								assignTo="#{creditorWizard.extendedAttributesValueExpression}">
							</a4j:actionparam>
							<a4j:actionparam name="valueChangeListener"
								value="#{valueChangeListener}"
								assignTo="#{creditorWizard.valueChangeListener}">
							</a4j:actionparam>
						</aon:commandButton>
					</h:column>

					<h:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.creditor_code}" />
						</f:facet>
						<aon:outputText value="#{cust.id}" />
					</h:column>
					<h:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.creditor_document}" />
						</f:facet>
						<aon:outputText value="#{cust.registry.document}" />
					</h:column>
					<h:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.creditor_name}" />
						</f:facet>
						<aon:outputText value="#{cust.registry.fullName}" />
					</h:column>
				</aon:editDataTable>

				<aon:panelGrid columns="2" style="border: 0;" cellpadding="5"
					columnClasses="aon-dataScroller-text,aon-dataScroller-buttons">

					<aon:div style="padding-left: 2em;">
						<a4j:commandButton immediate="true"
							eventsQueue="#{creditor_id}PreviousQueue" requestDelay="100"
							ignoreDupResponses="true" reRender="#{creditor_id}tableContainer"
							styleClass="aon-dataScroller-button aon-dataScroller-button-previous"
							rendered="#{creditorWizard.previousPageAvailable}"
							actionListener="#{creditorWizard.previousPage}"
							oncomplete="selectFirstRow('#{creditor_id}table')" />

						<a4j:commandButton immediate="true"
							eventsQueue="#{creditor_id}NextQueue" ignoreDupResponses="true"
							requestDelay="100" reRender="#{creditor_id}tableContainer"
							styleClass="aon-dataScroller-button aon-dataScroller-button-next"
							rendered="#{creditorWizard.nextPageAvailable}"
							actionListener="#{creditorWizard.nextPage}"
							oncomplete="selectFirstRow('#{creditor_id}table')" />
					</aon:div>

				</aon:panelGrid>

			</aon:div>
		</rich:modalPanel>

		<a4j:loadScript src="/js/extendedInput.js" />

	</aon:div>
</ui:composition>
