<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="InvoicePrinterForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{financeBundle.finance_invoice_checking_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">
					<aon:htmlCommandLink id="noInvoiceChecking-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						actionListener="#{financeChecking.onNoFinanceList}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="noFinanceInvoiceList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="noInvoiceChecking-report"
						value="#{financeBundle.finance_invoice_checking_module_no_finance}"
						target="_blank" action="#{report.onExecute}"
						actionListener="#{financeChecking.onNoFinanceList}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="noFinanceInvoiceList" />
					</aon:htmlCommandLink>

					<aon:htmlCommandLink id="wrongFinanceChecking-excel-report"
						value="&#160;" target="_blank" action="#{report.onExecute}"
						actionListener="#{financeChecking.onWrongFinanceList}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="notEqualAmountInvoiceList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="wrongFinanceChecking-report" 
						value="#{financeBundle.finance_invoice_checking_module_wrong_finance}"
						target="_blank" action="#{report.onExecute}"
						actionListener="#{financeChecking.onWrongFinanceList}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="notEqualAmountInvoiceList" />
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			<rich:spacer height="7"></rich:spacer>
				<aon:panel  height="60" style="width: 25%;">
				<f:facet name="header">
				<aon:outputText value="Fechas" />
				</f:facet>
				<aon:panelGrid id="dataTable" columns="2" >
					<aon:outputLabel for="Invoice_issueDate-From"
						styleClass="aon-form-date-label" value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Invoice_issueDate-From"
						value="#{financeChecking.fromDate}" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Invoice_issueDate-To"
						styleClass="aon-form-date-label" value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Invoice_issueDate-To"
						value="#{financeChecking.toDate}" 
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</aon:panelGrid>
				</aon:panel>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
