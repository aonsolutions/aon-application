<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="creditorForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{financeBundle.finance_creditor_module}" />
				<ui:param name="controller" value="#{creditor}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-100,
						aon-panelGrid-even aon-width-auto">

					<ui:include src="/com/code/aon/ui/finance/facelet/creditor/formContent.xhtml">
						<ui:param name="controller" value="#{creditor}" />
					</ui:include>

				</aon:panelGrid>
				
				<aon:panelGrid id="accountDataTable" styleClass="aon-margin-top"
					columns="2" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
					<c:if test="#{aonConfiguration.bean.finance.showAccount and !creditor.new}">
						<aon:outputLabel for="Creditor_account" value="#{accountBundle.account_accounting}" />
						<h:panelGrid columns="2" id="accountContainer">
							<ui:include
								src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
								<ui:param name="wizard" value="#{accountWizard}" />
								<ui:param name="id" value="Creditor_account" />
								<ui:param name="required" value="#{false}" />
								<ui:param name="size" value="9" />
								<ui:param name="maxlength" value="9" />
								<ui:param name="renderDescription" value="#{true}" />
								<ui:param name="renderedAttr" value="#{true}" />
								<ui:param name="disabled" value="#{false}" />
								<ui:param name="reRenderAttr" value="none" />
								<ui:param name="entity" value="#{creditorAccount.account}" />
								<ui:param name="ELExpression" value="creditorAccount.account" />
							</ui:include>

							<aon:commandButton
								value="#{accountBundle.account_synchronize}"
								title="#{accountBundle.account_synchronize}"
								style="border: #808080 1px solid;"
								styleClass="aon-finding-toolbar-item aon-icon-refresh"
								rendered="#{creditorAccount.accountSynchronizable}"
								reRender="accountContainer"
								actionListener="#{creditorAccount.onAccountSynchronize}">
							</aon:commandButton>

							<aon:commandButton
								value="#{accountBundle.account_new_account}" 
								title="#{accountBundle.account_new_account}"
								style="border: #808080 1px solid;"
								styleClass="aon-finding-toolbar-item aon-icon-reset"
								rendered="#{creditorAccount.account == null}"
								reRender="accountContainer"
								actionListener="#{creditorAccount.onNewAccount}">
							</aon:commandButton>

						</h:panelGrid>
					</c:if>
				</aon:panelGrid>

				<c:if test="#{!creditor.new}">
					<aon:panelTabSet selectedTab="#{creditor.selectedTab}">
	
						<aon:panelTab id="address" label="#{registryBundle.registry_address_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/raddress/tab_grid.xhtml">
								<ui:param name="controller" value="#{creditorAddress}" />
							</ui:include>
						</aon:panelTab>
	
						<aon:panelTab id="media" label="#{registryBundle.registry_media_module}">
							<ui:include	src="/com/code/aon/ui/registry/facelet/rmedia/tab_grid.xhtml">
								<ui:param name="controller" value="#{creditorMedia}" />
							</ui:include>
						</aon:panelTab>
	
						<c:if test="#{aonConfiguration.bean.finance.showFinanceData}">
							<aon:panelTab id="finance"
								label="#{registryBundle.registry_finance_data_module}">
								<aon:panel>
									<f:facet name="header">
										<aon:outputText
											value="#{registryBundle.registry_banks_module}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rbank/tab_grid.xhtml">
										<ui:param name="controller" value="#{creditorRbank}" />
									</ui:include>
								</aon:panel>
								<aon:panel>
									<f:facet name="header">
										<aon:outputText value="#{configBundle.config_predef_paymethod}" />
									</f:facet>
									<ui:include
										src="/com/code/aon/ui/registry/facelet/rpaymethod/tab_grid.xhtml">
										<ui:param name="controller" value="#{creditorRPayMethod}" />
									</ui:include>
								</aon:panel>
							</aon:panelTab>
						</c:if>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<c:if test="#{aonConfiguration.bean.finance.showFinanceData}">
			<aon:lookupButtonPopup lookup="#{bankLookup}" />
		</c:if>
	</ui:define>
</ui:composition>
