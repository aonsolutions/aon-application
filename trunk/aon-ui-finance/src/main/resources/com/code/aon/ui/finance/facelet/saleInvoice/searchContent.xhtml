<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputText value="" />
	<aon:div style="width:600px;">
	
		<aon:panelCollapsible expanded="true" label="#{financeBundle.finance_sale_invoice}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:include src="/com/code/aon/ui/finance/facelet/saleInvoice/searchBasicContent.xhtml" />
			</aon:panelGrid>
		</aon:panelCollapsible>					
					
		<aon:panelCollapsible expanded="false" label="#{financeBundle.finance_invoice_lines}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
			
				<aon:outputLabel for="InvoiceDetail_item_code"
					value="#{productBundle.product_item}" />						
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="InvoiceDetail_item_code" 
						lookup="#{itemLookup}"
						reRender="InvoiceDetail_item_detail"
						value="#{searchController.item.product.code}" size="10">
						<aon:joinProperty alias="Item_product_code"
							value="#{searchController.item.product.code}" />
					</aon:lookupInputText>
					<aon:lookupButton
						windowTitle="#{productBundle.product_item_selection}" actionType="search"
						selectReRender="InvoiceDetail_item_code,InvoiceDetail_item_detail"
						lookup="#{itemLookup}" minHeight="460" minWidth="650"
						property="#{searchController.item}">
						<aon:joinProperty alias="Item_product_code"
							value="#{saleInvoiceDetail.to.item.product.code}" />
					</aon:lookupButton>
					<aon:inputText id="InvoiceDetail_item_detail"
						value="#{(searchController.item.product.name!=null)?(searchController.item.product.name):('')}"
						size="60" disabled="true" />
				</aon:div>
								
				<aon:outputLabel for="Invoice_lines_quantity"
					value="#{bundle.aon_quantity}" />
				<aon:inputText id="Invoice_lines_quantity"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Invoice_lines_price"
					value="#{bundle.aon_price}" />
				<aon:inputText id="Invoice_lines_price"
					valueChangeListener="#{controller.addExpression}" size="40" />

				<aon:outputLabel for="Invoice_lines_taxableBase"
					value="#{bundle.aon_amount}" />
				<aon:inputText id="Invoice_lines_taxableBase"
					valueChangeListener="#{controller.addExpression}" size="40" />
					
				<aon:outputLabel for="Invoice_lines_workPlace_id"
					value="#{companyBundle.company_workplace}" />
				<aon:selectOneMenu id="Invoice_lines_workPlace_id"
					value="#{companyCollections.workPlace}"
					valueChangeListener="#{controller.addIdEqualExpression}">
					<f:selectItem itemLabel="-" value="#{null}" />		
					<f:selectItems value="#{companyCollections.workPlaces}" />
				</aon:selectOneMenu>					
								
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{financeBundle.finance_finances}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">

				<aon:outputLabel 
					value="#{financeBundle.finance_finance_date}" />
				<aon:div>
					<aon:outputLabel for="Invoice_finances_dueDate-From" styleClass="aon-form-date-label"
						value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Invoice_finances_dueDate-From"
						valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Invoice_finances_dueDate-To" styleClass="aon-form-date-label"
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Invoice_finances_dueDate-To"
						valueChangeListener="#{controller.addLessThanOrEqualExpression}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</aon:div>
				
				<aon:outputLabel for="Bank_code"
					value="#{configBundle.config_bank}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="Bank_code" lookup="#{bankLookup}"
						reRender="Bank_name"
						value="#{searchController.bank.code}" size="5">
						<aon:joinProperty alias="Bank_code" value="#{searchController.bank.code}" />
					</aon:lookupInputText>
					<aon:lookupButton 
						windowTitle="#{configBundle.config_bank_selection}"
						selectReRender="Bank_code,Bank_name" actionType="search"
						lookup="#{bankLookup}" minHeight="460" minWidth="650"
						property="#{searchController.bank}">
					</aon:lookupButton>
					<aon:inputText id="Bank_name"
						value="#{searchController.bank.name}"
						size="50" disabled="true" />							
				</aon:div>
				
				<aon:outputLabel for="Invoice_finances_amount"
					value="#{bundle.aon_amount}" />
				<aon:inputText id="Invoice_finances_amount"
					valueChangeListener="#{controller.addExpression}"
					size="10" />
				
				<aon:outputLabel for="Invoice_finances_payMethod_id"
					value="#{configBundle.config_pay_method}" />
				<aon:selectOneMenu id="Invoice_finances_payMethod_id"
					value="#{configCollections.payMethod}"
					valueChangeListener="#{controller.addIdEqualExpression}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{configCollections.payMethods}" />
				</aon:selectOneMenu>

				<aon:outputLabel for="Invoice_finances_financeStatus"
					value="#{bundle.aon_status}" />
				<aon:selectOneMenu id="Invoice_finances_financeStatus"
					converter="aon.EnumConverter"
					valueChangeListener="#{controller.addEqualExpression}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{financeCollections.financeStatuses}" />
				</aon:selectOneMenu>

			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{financeBundle.finance_invoice_customer_data}" >
			<aon:panel style="text-align:right;">
				<f:facet name="header">
					<aon:outputLabel value="#{registryBundle.registry_address_module}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/raddress/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
			<aon:panel style="text-align:right;">
				<f:facet name="header">
					<aon:outputLabel value="#{registryBundle.registry_media_module}" />
				</f:facet>
				<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">		
					<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/searchContent.xhtml" />
				</aon:panelGrid>
			</aon:panel>
		</aon:panelCollapsible>

	</aon:div>

</ui:composition>
