<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="saleInvoiceForm">
			<aon:div id="menuExt">
				<aon:methodParam name="backAction" value="#{saleInvoice.backAction}" resolve="false" />
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{financeBundle.finance_sale_invoice_management_module}" />
					<ui:param name="controller" value="#{saleInvoice}" />
					<ui:param name="skipFocusFirst" value="true" />
					<ui:param name="skipSaveButton" value="#{saleInvoice.readOnly}" />
					<ui:param name="skipRemoveButton" value="#{!saleInvoice.removable or !saleInvoiceFinance.allPending}" />
					<ui:define name="beforeSpinToolbarContent">
						<c:if test="#{aonConfiguration.bean.invoice.showWarehouseData}">
							<aon:commandButton id="deliveryTransfer"
								value="#{financeBundle.finance_invoice_deliveries}"
								immediate="#{true}" rendered="#{!saleInvoice.new}"
								styleClass="aon-finding-toolbar-item aon-icon-sincronize"
								actionListener="#{saleInvoice.onDeliveryTransferShow}"
								reRender="showDeliveryTransferWindow">
								<f:setPropertyActionListener target="#{saleInvoice.showDeliveryTransferWindow}"
									value="#{true}" />
							</aon:commandButton>
						</c:if>
						<aon:commandButton id="finances"
							value="#{bundle.aon_key_finance_description}"
							title="#{bundle.aon_key_finance_accelerator}"
							actionListener="#{saleInvoice.generateFinances}"
							rendered="#{saleInvoiceDetail.model.rowCount > 0 and (!saleInvoice.recorded or saleInvoiceFinance.model.rowCount == 0)}"
							styleClass="aon-finding-toolbar-item aon-icon-tree"
							accesskey="#{bundle.aon_key_finance}" />
						<c:if test="#{aonRole.accountingOperator}">
							<aon:commandButton id="record"
								value="#{financeBundle.finance_record}"
								actionListener="#{saleInvoice.onRecordInvoice}"
								rendered="#{saleInvoiceDetail.model.rowCount > 0 and !saleInvoice.recorded}"
								styleClass="aon-finding-toolbar-item aon-icon-task-assume"
								reRender="saleInvoiceForm" 
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandButton id="unrecord"
								value="#{financeBundle.finance_unrecord}"
								actionListener="#{saleInvoice.onUnrecordInvoice}"
								rendered="#{saleInvoice.recorded and !saleInvoice.accountSource}"
								styleClass="aon-finding-toolbar-item aon-icon-task-liberate"
								reRender="saleInvoiceForm"
								onclick="Richfaces.showModalPanel('waitProccess')" 
					     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</c:if>
						<aon:commandButton value="&#160;" id="email"
							actionListener="#{saleInvoice.onSendInvoiceByEmail}"
							rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null}"
							styleClass="aon-finding-toolbar-item aon-icon-webmail2 aon-finding-toolbar-item-no-border"
							reRender="showNewMessageWindow">
						</aon:commandButton>						
						<aon:htmlCommandLink id="saleInvoice-report"
							value="#{financeBundle.finance_invoice}" target="_new" 
							rendered="#{saleInvoiceDetail.model.rowCount > 0 and saleInvoiceDetail.to == null and !saleInvoice.accountSource}"
							action="#{saleInvoiceSigner.onReport}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf">
							<f:param name="reportKey" value="saleInvoice" />
						</aon:htmlCommandLink>
						<ui:include src="/com/code/aon/ui/sign/facelet/signer/signToolbar.xhtml">
							<ui:param name="signController" value="#{saleInvoiceSigner}" />
							<ui:param name="skipSignButton" value="#{saleInvoice.new or saleInvoice.to.signed or (!certificate.signable)}" />
							<ui:param name="skipCancelSignButton" value="#{saleInvoice.new or (!saleInvoice.to.signed)}" />
							<ui:param name="signButtonReRender" value="saleInvoiceForm,showNewMessageWindow" />
						</ui:include>				
					</ui:define>
				</ui:decorate>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Invoice_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<h:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<aon:div>
								<aon:selectOneMenu id="Invoice_series"
									value="#{saleInvoice.to.series}" rendered="#{saleInvoice.new}"
									valueChangeListener="#{saleInvoice.onSeriesChanged}"
									reRender="Invoice_number,Invoice_securityLevel">
									<f:selectItem itemLabel=" " value="#{null}" />
									<f:selectItems value="#{configCollections.seriesIds}" />
								</aon:selectOneMenu>
								<aon:inputText id="Invoice_number" styleClass="aon-margin-left"
									value="#{saleInvoice.to.number}" rendered="#{saleInvoice.new}"
									required="true" size="7" />
								<aon:commandButton value="&#160;"
									title="#{financeBundle.finance_invoice_find_next_number}"
									styleClass="aon-finding-toolbar-item aon-icon-ambito aon-finding-toolbar-item-no-border"
		 							style="aon-margin-left aon-margin-right" rendered="#{saleInvoice.new}"
									actionListener="#{saleInvoice.onFindNextFreeNumber}"
									reRender="Invoice_number" ajaxSingle="true" process="Invoice_number">
								</aon:commandButton>															
								<aon:outputText styleClass="aon-bold aon-margin-right"
									value="#{saleInvoice.to.referenceCode}"
									rendered="#{!saleInvoice.new}" />
							</aon:div>
							<aon:div>
								<c:if test="#{aonRole.confidentiality}">
									<aon:selectBooleanCheckbox id="Invoice_securityLevel"
										value="#{saleInvoice.to.confidential}"
										rendered="#{!saleInvoice.readOnly}" />
									<aon:outputText styleClass="aon-italic aon-margin-right"
										value="#{bundle.aon_confidential}"
										rendered="#{!saleInvoice.readOnly}" />
									<aon:outputText styleClass="aon-icon aon-icon-confidential" 
										value="&#160;" title="#{bundle.aon_confidential}"
										rendered="#{saleInvoice.readOnly and saleInvoice.to.confidential}" />
								</c:if>

								<c:if test="#{company.EInvoice}">
									<aon:outputText value="&#160;"
										rendered="#{!saleInvoice.new and saleInvoice.to.signed}"
										title="#{signBundle.sign_signed}"
										styleClass="aon-icon aon-icon-signed" />
								</c:if>						

								<aon:outputText value="#{saleInvoice.to.status}" />
								<c:if test="#{aonRole.accountingOperator and saleInvoice.recorded}">
									<aon:outputText styleClass="aon-italic aon-margin-left"
										value="(#{financeBundle.finance_account_entry}: " />
									<aon:outputText styleClass="aon-bold"
										value="#{saleInvoice.accountEntryId}" />
									<aon:outputText styleClass="aon-italic" value=")" />
								</c:if>
							</aon:div>
						</h:panelGrid>
					</aon:div>

					<aon:outputLabel for="Invoice_issueDate"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Invoice_issueDate"
						value="#{saleInvoice.to.issueDate}" required="true"
						disabled="#{saleInvoice.readOnly}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Customer_id"
						value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="Customer_id"
								value="#{saleInvoice.to.registry.id}"
								disabled="#{saleInvoice.readOnly or !saleInvoiceFinance.allPending}" size="5"
								lookupProperty="registry" lookup="#{customerLookup}"
								lookupChangeListener="#{saleInvoice.customerData}"
								reRender="Customer_full_name,Customer_registry_document,InvoiceAddress"
								ajaxSingle="true" required="true" />
							<aon:lookupButton
								windowTitle="#{customerBundle.customer_selection}"
								disabled="#{saleInvoice.readOnly or !saleInvoiceFinance.allPending}" minHeight="460" minWidth="650" 
								property="#{saleInvoice.to.registry}" lookupProperty="registry" lookup="#{customerLookup}"
								lookupChangeListener="#{saleInvoice.customerData}"
								selectReRender="Customer_id,Customer_full_name,Customer_registry_document,InvoiceAddress"
								actionType="search">
							</aon:lookupButton>
							<aon:lookupButton 
								windowTitle="#{customerBundle.customer_new}"
								disabled="#{saleInvoice.readOnly or !saleInvoiceFinance.allPending}" minWidth="650" minHeight="650"
								property="#{saleInvoice.to.registry}" lookupProperty="registry" lookup="#{customerLookup}"
								lookupChangeListener="#{saleInvoice.customerData}"
								selectReRender="Customer_id,Customer_full_name,Customer_registry_document,InvoiceAddress"
								actionType="new">
							</aon:lookupButton>
							<aon:inputText id="Customer_full_name" disabled="#{saleInvoice.readOnly}"
								value="#{saleInvoice.to.registryName}" size="60" />
						</a4j:region>
					</aon:div>

					<aon:outputLabel for="Customer_registry_document"
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Customer_registry_document"
						value="#{saleInvoice.to.registryDocument}"
						disabled="#{saleInvoice.readOnly}" size="10" />

					<aon:outputLabel for="Invoice_registryAddress_id"
						value="#{registryBundle.registry_address}" />
					<aon:div id="InvoiceAddress">
						<aon:selectOneMenu id="Invoice_registryAddress_id"
							rendered="#{(saleInvoice.new or saleInvoiceAddress.to.id == null) and saleInvoice.addressCount > 0}"
							disabled="#{saleInvoice.readOnly}"
							value="#{saleInvoice.to.registryAddress.id}">
							<f:selectItems value="#{saleInvoice.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel styleClass="aon-italic"
							value="#{registryBundle.registry_no_address_available}"
							rendered="#{(saleInvoice.new or saleInvoiceAddress.to.id == null) and saleInvoice.addressCount == 0}" />
						<aon:inputText id="Invoice_registryAddress_address"
							rendered="#{!saleInvoice.new and saleInvoiceAddress.to.id != null}"
							value="#{saleInvoice.address}" disabled="true" size="33" />
						<aon:inputText id="Invoice_registryAddress_city"
							rendered="#{!saleInvoice.new and saleInvoiceAddress.to.id != null}"
							value="#{saleInvoice.city}" disabled="true" size="16" />
						<aon:div layout="inline" styleClass="aon-margin-left">
							<aon:commandButton id="popupButton"
								reRender="showInvoiceAddressWindow"
								rendered="#{!saleInvoice.new and !saleInvoice.readOnly}"
								actionListener="#{saleInvoice.onInvoiceAddressShow}"
								styleClass="aon-icon-commandButton aon-icon-file-entrance"
								value="#{registryBundle.registry_address_other}" >
								<f:setPropertyActionListener target="#{saleInvoice.showInvoiceAddressWindow}"
									value="#{true}" />								
							</aon:commandButton>
						</aon:div>
					</aon:div>
					 
					<aon:outputLabel for="Invoice_total" 
						value="#{bundle.aon_total}" />
					<aon:outputText id="Invoice_total" size="15" styleClass="aon-bold"
						value="#{saleInvoice.toInvoiceTotalPrice}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>

				<aon:panelGrid columns="2" style="width: 100%;"
					styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Invoice_comments"
						value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="Invoice_comments" cols="150" rows="2"
						disabled="#{saleInvoice.readOnly}"
						value="#{saleInvoice.to.comments}" />

					<aon:outputLabel value="#{financeBundle.finance_invoice_document_number}"
						rendered="#{!saleInvoice.new}" />
					<aon:outputText styleClass="aon-bold"
						value="#{saleInvoice.to.documentNumber}"
						rendered="#{!saleInvoice.new}" />

				</aon:panelGrid>

				<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/form_detail.xhtml">
					<ui:param name="invoiceController" value="#{saleInvoice}" />
					<ui:param name="detailController" value="#{saleInvoiceDetail}" />
				</ui:include>

				<ui:include	src="/com/code/aon/ui/finance/facelet/invoice/form_finances.xhtml">
					<ui:param name="invoiceController" value="#{saleInvoice}" />
					<ui:param name="detailController" value="#{saleInvoiceDetail}" />
					<ui:param name="financeController" value="#{saleInvoiceFinance}" />
				</ui:include>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAddress.xhtml">
			<ui:param name="invoiceController" value="#{saleInvoice}" />
			<ui:param name="invoiceAddress" value="#{saleInvoiceAddress}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/sign/facelet/signer/modal.xhtml" >
			<ui:param name="signButtonreRender" value="saleInvoiceForm,showNewMessageWindow" />
			<aon:methodParam name="signActionListener" value="#{saleInvoiceSigner.onSign}" type="actionListener" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/webmail/facelet/webmailMessage/messageNewModal.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/saleInvoice/delivery/modalTransfer.xhtml" />
	</ui:define>
</ui:composition>
