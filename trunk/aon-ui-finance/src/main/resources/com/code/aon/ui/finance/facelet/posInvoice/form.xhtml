<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	   <a4j:region>
	        <h:form>
	            <a4j:poll status="aonStatus" interval="300000" />
	        </h:form>
	    </a4j:region>

		<aon:form id="posInvoiceForm">
			<aon:div id="menuExt"> 
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{financeBundle.finance_pos_invoice_management_module}" />
					<ui:param name="controller" value="#{posInvoice}" />
					<ui:param name="skipFocusFirst" value="#{true}" />
					<ui:param name="skipResetButton" value="#{true}" />
					<ui:param name="skipSaveButton" value="#{true}" />
					<ui:param name="skipRemoveButton" value="#{true}" />
					<ui:param name="skipCancelButton" value="#{true}" />
					<ui:param name="skipSearchButton" value="#{true}" />
					<ui:param name="skipBackButton" value="#{true}" />
				</ui:decorate>
			</aon:div>
			
			<rich:jQuery timing="onload"
				selector="#Item_id" query="focus()" />			

			<aon:div styleClass="aon-padding">
				<aon:panelGrid styleClass="aon-width-all" columns="2" cellspacing="2"
					columnClasses="aon-panelGrid-even aon-vertical-align-top aon-width-auto,
						aon-panelGrid-even aon-vertical-align-top aon-width-350">
					<aon:panelGroup>

						<aon:panelGrid id="posInvoiceDatatable" columns="5"
							styleClass="aon-width-all aon-margin-bottom"
							columnClasses="aon-italic aon-width-10,
								aon-italic aon-width-70,
								aon-message-big2 aon-width-auto,
								aon-italic aon-width-80,
								aon-message-big2 aon-width-180">

							<c:if test="#{posInvoice.new}">
								<aon:outputText value="&#160;" />
								<aon:outputText value="&#160;" />
								<aon:outputText styleClass="aon-label-error"
									value="#{financeBundle.finance_pos_no_current_invoice}" />
							</c:if>

							<c:if test="#{!posInvoice.new}">
								<aon:outputText value="&#160;" />
								<aon:outputLabel value="#{financeBundle.finance_invoice_number}:" />
								<aon:panelGrid styleClass="aon-width-all" columns="3"
									columnClasses="aon-width-200,aon-normal aon-italic aon-width-50,aon-width-auto">
									<aon:outputText value="#{posInvoice.to.referenceCode}" />
									<c:if test="#{!empty posInvoice.to.registryDocument}">
										<aon:outputLabel value="#{bundle.aon_company_document}:" />
										<aon:outputText value="#{posInvoice.to.registryDocument}" />
									</c:if>
								</aon:panelGrid>

								<aon:outputLabel value="#{bundle.aon_date_time}:" />
								<aon:outputText value="#{(posInvoice.to.modificationDate != null) ? posInvoice.to.modificationDate : posInvoice.to.creationDate}">
									<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>

								<aon:outputText value="&#160;" />
								<aon:outputLabel value="#{customerBundle.customer_customer}:" />
								<aon:div>
									<aon:outputText value="#{posInvoice.to.registryName}">
										<aon:abbreviateConverter maxWidth="30" />
									</aon:outputText>
									<rich:toolTip>
										<aon:outputText value="#{posInvoice.to.registryName}" />
									</rich:toolTip>
									<aon:commandLink id="invoiceRegistryData" immediate="true"
										value="&#160;" title="#{bundle.aon_edit}"
										styleClass="aon-icon-edit-add-user" style="margin-left: 5px; padding-right: 12px;"
										ajaxSingle="true">
										<f:setPropertyActionListener target="#{posInvoice.showRegistryDataWindow}"
											value="#{true}" />
									</aon:commandLink>
								</aon:div>
								<aon:outputLabel value="#{financeBundle.finance_pos_seller_label}:" />
								<aon:div>
									<c:if test="#{posInvoice.to.seller.registry.id != null}">
										<aon:outputText value="#{posInvoice.to.seller.registry.fullName}">
											<aon:abbreviateConverter maxWidth="20" />
										</aon:outputText>
										<rich:toolTip>
											<aon:outputText value="#{posInvoice.to.seller.registry.fullName}" />
										</rich:toolTip>
									</c:if>
									<c:if test="#{posInvoice.to.seller.registry.id == null}">
										<aon:outputText styleClass="aon-label-error aon-italic"
											 value="#{bundle.aon_unspecified}" />
									</c:if>
									<aon:commandLink id="invoiceSellerData" immediate="true"
										value="&#160;" title="#{bundle.aon_edit}"
										styleClass="aon-icon-edit-add-user" style="margin-left: 5px; padding-right: 12px;"
										ajaxSingle="true">
										<f:setPropertyActionListener target="#{posInvoice.showSellerDataWindow}"
											value="#{true}" />
									</aon:commandLink>
								</aon:div>

								<aon:outputText value="&#160;" />
								<aon:outputLabel value="#{bundle.aon_address}:" />
								<aon:div styleClass="aon-nowrap">
									<c:if test="#{posInvoice.to.registryAddress.id != null or posInvoiceAddress.to.id != null}">
										<aon:outputText value="#{posInvoice.address}">
											<aon:abbreviateConverter maxWidth="30" />
										</aon:outputText>
										<aon:outputText styleClass="aon-margin-left" value="#{posInvoice.location}">
											<aon:abbreviateConverter maxWidth="20" />
										</aon:outputText>
										<rich:toolTip>
											<aon:outputText value="#{posInvoice.address} #{posInvoice.location}" />
										</rich:toolTip>
									</c:if>
									<c:if test="#{posInvoice.to.registryAddress.id == null and posInvoiceAddress.to.id == null}">
										<aon:outputText styleClass="aon-label-error aon-italic"
											 value="#{bundle.aon_unspecified}" />
									</c:if>
									<aon:commandLink id="invoiceAddressButton" immediate="true"
										value="&#160;" title="#{bundle.aon_edit} #{bundle.aon_address}"
										styleClass="aon-icon-edit-add-address" style="margin-left: 5px; padding-right: 12px;"
										actionListener="#{posInvoice.onInvoiceAddressShow}"
										reRender="showInvoiceAddressWindow">
										<f:setPropertyActionListener target="#{posInvoice.showInvoiceAddressWindow}"
											value="#{true}" />								
									</aon:commandLink>
								</aon:div>
								<aon:outputLabel value="#{financeBundle.finance_pos}:" />
								<aon:div>
									<aon:outputText value="#{posInvoice.to.posShift.pos.name}">
										<aon:abbreviateConverter maxWidth="20" />
									</aon:outputText>
									<rich:toolTip>
										<aon:outputText value="#{posInvoice.to.posShift.pos.workPlace.description}" />
									</rich:toolTip>
								</aon:div>
							</c:if>

						</aon:panelGrid>

						<aon:div id="PosInvoiceDetailWizard" styleClass="aon-margin-bottom">
							<aon:panelGrid id="posInvoiceDetailItemDataTable" columns="3"
								styleClass="aon-width-all" style="background-color:#f6f5e3; border:#d8d37a 1px solid;"
								columnClasses="aon-padding-left aon-width-60,aon-width-auto,aon-padding-top aon-text-center aon-width-70">

								<aon:outputLabel for="Item_id" value="#{productBundle.product_item}:" />
								<ui:include src="/com/code/aon/ui/product/facelet/item/lookupDetail.xhtml">
									<ui:param name="lookupTo" value="#{posInvoiceDetail.to.item}" />
									<ui:param name="idRequired" value="#{true}" />
									<ui:param name="skipLabel" value="#{true}" />
									<ui:param name="skipGoToButton" value="#{true}" />
									<ui:param name="skipNewButton" value="#{true}" />
									<ui:param name="lookupInputSuggestSize" value="40" />
									<ui:param name="lookupInputOnFocus" value="saveTicketDetail" />
									<ui:param name="lookupReRender"	value="PosInvoiceDetailWizard" />
									<aon:methodParam name="lookupChangeListener"
										value="#{posInvoiceDetail.onItemChanged}" type="lookupChangeListener" />
								</ui:include>
								<aon:commandButton id="saveTicketDetail"
									styleClass="aon-medium-commandButton aon-width-60"
									value="#{bundle.aon_key_save_description}"
									title="#{bundle.aon_key_save_accelerator}"
									disabled="#{posInvoice.new or posInvoiceDetail.to.item.id == null or posInvoiceFinance.rowCount > 0}"
									actionListener="#{posInvoiceDetail.onAccept}"
									accesskey="#{bundle.aon_key_save}" />

								<aon:outputLabel for="InvoiceDetail_price" styleClass="aon-input-required" 
									value="#{bundle.aon_price}:" />
								<aon:div styleClass="aon-nowrap">
									<aon:outputText id="InvoiceDetail_price" styleClass="aon-bold aon-margin-right"
										value="#{posInvoiceDetail.to.salesPrice}">
										<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
									</aon:outputText>
									<aon:outputLabel for="InvoiceDetail_discount" styleClass="aon-margin-left aon-margin-right"
										value="#{bundle.aon_discount}:" />
									<aon:inputText id="InvoiceDetail_discount"
										value="#{posInvoiceDetail.to.discountExpression.discountExpr}"
										required="true" size="3" maxlength="5"
										valueChangeListener="#{posInvoiceDetail.onDiscountChanged}"
										ajaxSingle="true" />
									<aon:outputText styleClass="aon-bold aon-margin-right" value=" %" />
									<aon:outputLabel for="InvoiceDetail_quantity" styleClass="aon-margin-left aon-margin-right"
										value="#{bundle.aon_quantity}:" />
									<aon:commandButton id="PosDetail-minusQuantity" immediate="true"
										styleClass="aon-medium-commandButton aon-width-30"
										value="-"
										actionListener="#{posInvoiceDetail.onMinusQuantity}"
										reRender="InvoiceDetail_quantity" ajaxSingle="true" />
									<aon:inputText id="InvoiceDetail_quantity"
										styleClass="aon-margin-right"
										value="#{posInvoiceDetail.to.quantity}" 
										required="true" size="3" maxlength="5"
										valueChangeListener="#{posInvoiceDetail.onQuantityChanged}"
										reRender="InvoiceDetail_discount,InvoiceDetail_price" ajaxSingle="true"
										focus="InvoiceDetail_discount" />
									<aon:commandButton id="PosDetail-plusQuantity" immediate="true"
										styleClass="aon-medium-commandButton aon-width-30"
										value="+"
										actionListener="#{posInvoiceDetail.onPlusQuantity}"
										reRender="InvoiceDetail_quantity" ajaxSingle="true" />
								</aon:div>
								<aon:commandButton id="PosDetail-itemInfo" immediate="true" 
									styleClass="aon-medium-commandButton aon-width-60"
									value="#{productBundle.product_stock}"
									disabled="#{posInvoiceDetail.to.item.id == null or !posInvoiceDetail.to.item.product.inventoriable}"
									actionListener="#{itemInfo.onShowPanel}"
									reRender="itemInfoContainer">
									<aon:set var="#{itemInfo.stockVisible}" value="#{true}" />
									<aon:set var="#{itemInfo.alternativesVisible}" value="#{true}" />
									<aon:set var="#{itemInfo.item}" value="#{posInvoiceDetail.to.item}" /> 
									<aon:set var="#{itemInfo.warehouse}" value="#{null}" /> 
									<aon:set var="#{itemInfo.rowStock}" value="#{posInvoiceDetail.rowStock}" /> 
									<aon:set var="#{itemInfo.componentId}" value="Item_id" />
									<aon:set var="#{itemInfo.alternativeMethod}" value="posInvoiceDetail.onItemChanged" />
								</aon:commandButton>															

							</aon:panelGrid>
 						</aon:div>

						<c:if test="#{!posInvoice.new and posInvoiceDetail.rowCount > 0}">
							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formDetail.xhtml">
								<ui:param name="invoiceController" value="#{posInvoice}" />
								<ui:param name="detailController" value="#{posInvoiceDetail}" />
								<ui:param name="financeController" value="#{posInvoiceFinance}" />
							</ui:include>
						</c:if>

						<c:if test="#{posInvoice.suspendedInvoiceCount > 0}">
							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formSuspended.xhtml">
								<ui:param name="invoiceController" value="#{posInvoice}" />
							</ui:include>
						</c:if>

					</aon:panelGroup>

					<aon:panelGroup>

						<aon:panelGrid styleClass="aon-width-all aon-margin-bottom" columns="3" cellspacing="5"
							columnClasses="aon-vertical-align-top,aon-vertical-align-top,aon-vertical-align-top">

							<aon:commandButton id="newTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="1 #{bundle.aon_reset}"
								title="Alt+{Mayús}+1"
								disabled="#{!posInvoice.new and posInvoice.pendingAmount != 0}"
								actionListener="#{posInvoice.onNewTicket}"
								reRender="posInvoiceForm" ajaxSingle="true"
								accesskey="1" />
							<aon:commandButton id="finishTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="2 #{financeBundle.finance_to_charge}"
								title="Alt+{Mayús}+2"
								disabled="#{posInvoice.new or posInvoice.pendingAmount == 0}"
								actionListener="#{posInvoice.onShowFinishTicket}"
								reRender="showFinishTicketWindow" ajaxSingle="true"
								accesskey="2">
								<f:setPropertyActionListener target="#{posInvoice.showFinishTicketWindow}"
									value="#{true}" />
							</aon:commandButton>				
							<aon:htmlCommandLink id="printTicketPDF" immediate="true" target="_new"
								styleClass="aon-big-commandButton aon-width-110"
								value="3 #{bundle.aon_report}"
								title="Alt+{Mayús}+3"
								disabled="#{posInvoice.new or posInvoice.toInvoiceTotalPrice == 0 or posInvoice.pendingAmount != 0}"
								rendered="#{posInvoiceParams.printPDF}"
								actionListener="#{posInvoiceParams.onInit}" 
								action="#{report.onExecute}" 
								accesskey="3">
								<f:param name="reportKey" value="posInvoice" /> 
							</aon:htmlCommandLink>
							<aon:commandButton id="printTicketRAW" immediate="true"
								styleClass="aon-big-commandButton aon-width-110"
								value="3 #{bundle.aon_report}"
								title="Alt+{Mayús}+3"
								disabled="#{posInvoice.new or posInvoice.toInvoiceTotalPrice == 0 or posInvoice.pendingAmount != 0}"
								rendered="#{!posInvoiceParams.printPDF}"
								actionListener="#{posInvoice.onShowPrintTicket}"
								reRender="showPrintTicketWindow" ajaxSingle="true"
								accesskey="3">
							</aon:commandButton>											
							<aon:commandButton id="parkTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="4 #{financeBundle.finance_pos_suspend}"
								title="Alt+{Mayús}+4"
								disabled="#{posInvoice.new or posInvoice.pendingAmount == 0}"
								actionListener="#{posInvoice.onSuspendTicket}"
								reRender="posInvoiceForm" ajaxSingle="true"
								accesskey="4" />
							<aon:commandButton id="recoverTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="5 #{financeBundle.finance_pos_recover}"
								title="Alt+{Mayús}+5"
								disabled="#{!posInvoice.new and (posInvoice.pendingAmount != 0 or posInvoiceFinance.rowCount == 0)}"
								actionListener="#{posInvoice.onShowRecoverTicket}"
								reRender="showRecoverTicketWindow" ajaxSingle="true"
								accesskey="5">
								<f:setPropertyActionListener target="#{posInvoice.showRecoverTicketWindow}"
									value="#{true}" />
							</aon:commandButton>				
							<aon:htmlCommandLink id="printGiftReceiptPDF" immediate="true" target="_new"
								styleClass="aon-big-commandButton aon-width-110"
								value="6 #{financeBundle.finance_pos_gift_receipt}"
								title="Alt+{Mayús}+6"
								disabled="#{posInvoice.new or posInvoice.toInvoiceTotalPrice == 0 or posInvoice.pendingAmount != 0}"
								rendered="#{posInvoiceParams.printPDF}"
								actionListener="#{posInvoiceParams.onInit}" 
								action="#{report.onExecute}" 
								accesskey="6">
								<f:param name="reportKey" value="giftReceipt" /> 
							</aon:htmlCommandLink>  	
							<aon:commandButton id="printGiftTicketRAW" immediate="true"
								styleClass="aon-big-commandButton aon-width-110"
								value="6 #{financeBundle.finance_pos_gift_receipt}"
								title="Alt+{Mayús}+6"
								disabled="#{posInvoice.new or posInvoice.toInvoiceTotalPrice == 0 or posInvoice.pendingAmount != 0}"
								rendered="#{!posInvoiceParams.printPDF}"
								actionListener="#{posInvoice.onShowPrintGiftTicket}"
								reRender="showPrintTicketWindow" ajaxSingle="true"
								accesskey="6">
							</aon:commandButton>											
							<aon:confirmButton id="cancelTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="7 #{bundle.aon_cancel}"
								title="Alt+{Mayús}+7"
								disabled="#{posInvoice.new or posInvoiceFinance.rowCount > 0 or (posInvoiceDetail.rowCount > 0 and posInvoice.to.totalQuantity == 0)}"
								confirmTitle="#{bundle.aon_confirm_title}"
								confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{posInvoice.onCancelTicket}"
								reRender="posInvoiceForm" ajaxSingle="true"
								accesskey="7" />
							<aon:confirmButton id="cancelLine" immediate="true"
								styleClass="aon-big-commandButton aon-width-105"
								value="8 #{financeBundle.finance_pos_cancel_line}"
								title="Alt+{Mayús}+8"
								disabled="#{posInvoice.new or posInvoiceFinance.rowCount > 0 or	(posInvoiceDetail.rowCount > 0 and posInvoice.to.totalQuantity == 0)}"
								confirmTitle="#{bundle.aon_confirm_title}"
								confirmMessage="#{financeBundle.finance_pos_cancel_line_confirm}"
								confirmActionListener="#{posInvoice.onCancelLine}"
								reRender="posInvoiceForm" ajaxSingle="true"
								accesskey="8" />
							<aon:confirmButton id="returnTicket" immediate="true"
								styleClass="aon-big-commandButton aon-width-110"
								value="9 #{financeBundle.finance_return}"
								title="Alt+{Mayús}+9"
								disabled="#{posInvoiceDetail.checkedCount == 0}"
								confirmTitle="#{bundle.aon_confirm_title}"
								confirmMessage="#{financeBundle.finance_return_confirm}"
								confirmActionListener="#{posInvoice.onReturnTicket}"
								reRender="posInvoiceForm" ajaxSingle="true"
								accesskey="9" />

						</aon:panelGrid>

						<c:if test="#{!posInvoice.new and posInvoiceDetail.rowCount > 0}">
							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formTotal.xhtml">
								<ui:param name="invoiceController" value="#{posInvoice}" />
							</ui:include>
						</c:if>

						<c:if test="#{!posInvoice.new and posInvoiceFinance.rowCount > 0}">
							<ui:include	src="/com/code/aon/ui/finance/facelet/posInvoice/formFinance.xhtml">
								<ui:param name="financeController" value="#{posInvoiceFinance}" />
							</ui:include>
						</c:if>

					</aon:panelGroup>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{itemDetailLookup}" />
		<aon:lookupButtonPopup lookup="#{productLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{bankLookup}" />
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalRegistryData.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalSellerData.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/invoice/modalAddress.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
			<ui:param name="invoiceAddress" value="#{posInvoiceAddress}" />
			<ui:param name="addressReRender" value="posInvoiceDatatable" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/product/facelet/item/modalInfo.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/posInvoice/modalFinishTicket.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
			<ui:param name="financeController" value="#{posInvoiceFinance}" />
		</ui:include>
		<ui:include src="/com/code/aon/ui/finance/facelet/posInvoice/modalRecoverTicket.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
		</ui:include>			
		<ui:include src="/com/code/aon/ui/finance/facelet/posInvoice/modalPrintTicket.xhtml">
			<ui:param name="invoiceController" value="#{posInvoice}" />
		</ui:include>
	</ui:define>
</ui:composition>
