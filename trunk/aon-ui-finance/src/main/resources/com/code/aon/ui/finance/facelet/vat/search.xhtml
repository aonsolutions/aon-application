<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{financeBundle.finance_vat_report_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{vatReport.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="vat_report_list" />

					<aon:outputLabel for="reportDate"
						value="#{financeBundle.finance_report_date}" />
					<aon:selectInputDate id="reportDate"
						value="#{vatReport.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="entryDate-From"
						value="#{bundle.aon_date_from}" />
					<aon:panelGrid columns="3">
						<aon:selectInputDate id="entryDate-From"
							value="#{vatReport.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="entryDate-To" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="entryDate-To"
							value="#{vatReport.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:panelGrid>

					<aon:outputLabel for="Vat_type" value="#{bundle.aon_type}" />
						<aon:selectOneRadio id="Vat_type"
							value="#{vatReport.vatType}">
							<f:selectItems value="#{financeCollections.vatTypes}" />
						</aon:selectOneRadio>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
