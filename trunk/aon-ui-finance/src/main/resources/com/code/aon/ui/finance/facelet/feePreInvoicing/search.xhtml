<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="preInvoicingForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_pre_invoicing_module}" />
				<ui:param name="controller" value="#{preInvoicing}" />
				<ui:param name="skipResetButton" value="true" />
<!-- 
					<t:commandLink id="preInvoicing" value="#{bundle.aon_report}" target="_new"
						forceId="#{true}" action="#{preInvoicing.onExecute}"
						actionListener="#{preInvoicing.onReport}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
						accesskey="#{bundle.aon_key_print}" />	
 -->				
			</ui:include>

		
			
			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal" >
					<h:outputText value="#{customerBundle.aon_customer_fee_selection}" />
				</t:div>
			</t:div>
			
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

 						<t:outputLabel for="Customer_Lookup_id" value="#{customerBundle.customer_customer}" 
							styleClass="aon-form-input-text-label" />
						<t:div>
							<t:inputText id="Customer_Lookup_id" forceId="#{true}"
								value="#{preInvoicing.invoicingParams.customerId}"
								styleClass="aon-form-input-text" size="5" 
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');"/>
							<h:commandButton id="find_Customer_Lookup_id"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');return false;" />	
							<t:inputText id="Customer_full_name"
								disabled="true" forceId="#{true}"
								styleClass="aon-form-input-text-disabled" size="40" />
						</t:div>
 
 						<h:outputLabel value="#{customerBundle.aon_date}"
							styleClass="aon-form-input-text-label" />
						<h:panelGrid columns="4">
							<h:outputLabel for="BillingDate_Month" value="#{customerBundle.aon_month}"
								styleClass="aon-form-input-text-label" />
							<h:selectOneMenu id="BillingDate_Month"
								value="#{preInvoicing.invoicingParams.month}"
								styleClass="aon-form-selectOneMenu-field">
								<f:selectItems value="#{salesCollections.months}" />
							</h:selectOneMenu>

							<h:outputLabel for="BillingDate_Year" value="#{customerBundle.aon_year}"
								styleClass="aon-form-input-text-label" />
							<h:inputText id="BillingDate_Year"
								styleClass="aon-form-input-text" size="5"
								value="#{preInvoicing.invoicingParams.year}" />
						</h:panelGrid>

						<t:outputLabel for="CustomerFee_securityLevel"
							styleClass="aon-form-selectOneMenu-label"
							value="#{customerBundle.security_level}" />
						<h:selectOneMenu id="CustomerFee_securityLevel"
							styleClass="aon-form-selectOneMenu-field"
							value="#{preInvoicing.invoicingParams.securityLevel}">
							<f:selectItems value="#{financeCollections.securityLevels}" />
						</h:selectOneMenu>

 						<h:outputLabel for="CustomerFee_WorkPlace"
 							value="#{customerBundle.aon_customer_fee_workplace_abrv}"
							styleClass="aon-form-input-text-label" />
						<h:selectOneMenu id="CustomerFee_WorkPlace"
							value="#{preInvoicing.invoicingParams.workPlaceId}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItem itemDisabled="true" itemLabel ="-" itemValue="" />
							<f:selectItems value="#{companyCollections.workPlacesDetailed}" />
						</h:selectOneMenu>

					</h:panelGrid>
				</t:div>
			</t:div>
		</h:form>
	</ui:define>
</ui:composition>
