<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="financePaymentForm">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_fbatch_module}" />
				<ui:param name="controller" value="#{fbatch}" />
				<ui:param name="skipSaveButton" value="#{fbatch.recorded}" />
				<ui:param name="skipRemoveButton" value="#{fbatch.recorded}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}" rendered="#{!fbatch.new}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="fBatch" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}" rendered="#{!fbatch.new}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="fBatch" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<aon:commandButton id="csb" value="#{financeBundle.finance_create_disk}"
						rendered="#{!fbatch.new and !fbatch.recorded and fbatch.diskMode and fbatch.filled and fbatch.to.registryBank.id != null}"
						styleClass="aon-finding-toolbar-item-no-icon"
						action="fbatch_form" actionListener="#{fbatch.onCreateDisk}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
					<aon:commandButton id="record" value="#{financeBundle.finance_record}"
						rendered="#{!fbatch.new and !fbatch.recorded and (fbatch.done or !fbatch.diskMode)}"
						styleClass="aon-finding-toolbar-item-no-icon"
						action="fbatch_form" actionListener="#{fbatch.onRecord}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	
					<aon:commandButton id="unrecord" value="#{financeBundle.finance_unrecord}"
						rendered="#{fbatch.recorded}"
						styleClass="aon-finding-toolbar-item-no-icon"
						action="fbatch_form" actionListener="#{fbatch.onUnrecord}"
						onclick="Richfaces.showModalPanel('waitProccess')" 
			     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />	

				</ui:define>				
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:div styleClass="aon-padding-bottom">
					<aon:panelGrid columns="2">
						<aon:outputLabel for="FinanceBatch_recordDate"
							value="#{financeBundle.finance_record_date}" 
							rendered="#{!fbatch.new and !fbatch.recorded and (fbatch.done or !fbatch.diskMode)}" />
						<aon:selectInputDate id="FinanceBatch_recordDate" 
							value="#{fbatch.recordDate}"
							rendered="#{!fbatch.new and !fbatch.recorded and (fbatch.done or !fbatch.diskMode)}" 
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:panelGrid>
				</aon:div>

				<aon:panelGrid columns="4">
	
					<aon:outputLabel for="FinanceBatch_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="FinanceBatch_id" value="#{fbatch.to.id}"
						required="true" size="8" disabled="true" />

					<aon:outputLabel for="FinanceBatch_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="FinanceBatch_description"
						value="#{fbatch.to.description}" disabled="#{fbatch.recorded}"
						required="true" size="45" />

					<aon:outputLabel for="FinanceBatch_issueDate"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="FinanceBatch_issueDate" 
						value="#{fbatch.to.issueDate}" 
						disabled="#{fbatch.recorded}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{financeBundle.finance_bank}" />
					<aon:selectOneMenu id="RegistryBank_Lookup_id"
						value="#{fbatch.to.registryBank}" disabled="#{!fbatch.todo}"
						reRender="RegistryBank_Lookup_bankAccount">
						<f:selectItem itemLabel="-" value="#{null}"  />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="FinanceBatch_payment"
						value="#{financeBundle.finance_fbatch_type}" />
					<aon:selectOneMenu id="FinanceBatch_payment"
						value="#{fbatch.to.payment}" disabled="#{!fbatch.new}">
						<f:selectItem itemLabel="#{financeBundle.finance_payment}" itemValue="true" />
						<f:selectItem itemLabel="#{financeBundle.finance_charge}" itemValue="#{false}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="RegistryBank_Lookup_bankAccount"
						value="#{financeBundle.finance_bank_account}" />
					<aon:inputText id="RegistryBank_Lookup_bankAccount"
						value="#{fbatch.to.registryBank.bankAccount}"
						disabled="true" size="40" />

					<aon:outputLabel for="FinanceBatch_financeBatchType"
						value="#{financeBundle.finance_disk_type}" />
					<aon:selectOneMenu id="FinanceBatch_financeBatchType"
						disabled="#{!fbatch.new}"
						value="#{fbatch.to.financeBatchType}">
						<f:selectItems value="#{financeCollections.financeBatchTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="FinanceBatch_financeBatchStatus"
						value="#{bundle.aon_status}" />
					<aon:div>
						<aon:selectOneMenu id="FinanceBatch_financeBatchStatus"
							value="#{fbatch.to.financeBatchStatus}" disabled="true" >
							<f:selectItems value="#{financeCollections.financeBatchStatus}" />
						</aon:selectOneMenu>
						<aon:div styleClass="aon-padding-left" layout="inline" rendered="#{fbatch.recorded}">
							<aon:outputLabel
								value="#{accountingBundle.accounting_account_entry}: #{fbatch.accountEntryId}" />
						</aon:div>
					</aon:div>

					<aon:outputLabel for="FinanceBatch_totalRegs"
						value="#{financeBundle.finance_total_regs}" />
					<aon:inputText id="FinanceBatch_totalRegs"
						disabled="true" size="8"
						value="#{fbatch.toTotalDetails}" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:inputText>	

					<aon:outputLabel for="FinanceBatch_totalAmount"
						value="#{financeBundle.finance_total_amount}" />
					<aon:inputText id="FinanceBatch_totalAmount"
						disabled="true" size="15"
						value="#{fbatch.toTotalAmount}" >
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:inputText>
	
				</aon:panelGrid>
				
				<aon:div id="fbatchPanelTabSet" >
					<aon:panelTabSet rendered="#{!fbatch.new}">
	
						<c:if test="#{fBatchDetail.model.rowCount > 0}" >
							<aon:panelTab name="fBatchDetail" label="#{financeBundle.finance_included_finance}">
								<ui:include src="/com/code/aon/ui/finance/facelet/fbatch/formDetail.xhtml" />
							</aon:panelTab>
						</c:if>
	
						<c:if test="#{!fbatch.recorded}" >
							<aon:panelTab name="finance" label="#{financeBundle.finance_not_batched_finances}">
								<ui:include src="/com/code/aon/ui/finance/facelet/fbatch/formFinance.xhtml" />
							</aon:panelTab>
						</c:if>
	
					</aon:panelTabSet>
				</aon:div>
				
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
