<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="fbachList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_fbatch_module}" />
				<ui:param name="controller" value="#{fbatch}" />
				
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="&#160;" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="fBatchList" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>			
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="fBatchList" />
					</h:commandLink>
				</ui:define>				
				
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="fbatchData" value="#{fbatch.model}"
					var="to" rows="20" rendered="#{fbatch.model.rowCount > 0}"
					columnClasses="aon-editDataTable-numberColumn, aon-editDataTable-textColumn, 
						aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn
						aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-numberColumn, aon-editDataTable-numberColumn">

					<aon:rowSelector action="fbatch_form" actionListener="#{fbatch.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.description}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_fbatch_type}" />
						</f:facet>
						<aon:outputText
							value="#{to.payment?(financeBundle.finance_payment):(financeBundle.finance_charge)}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.issueDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_bank}" />
						</f:facet>
						<aon:outputText value="#{to.registryBank.bank.name}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_bank_account}" />
						</f:facet>
						<aon:outputText value="#{to.registryBank.bankAccount}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.financeBatchStatus}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{financeBundle.finance_regs}" />
						</f:facet>
						<aon:outputText value="#{fbatch.modelToTotalDetails}" >
							<f:convertNumber pattern="#{bundle.aon_integer_pattern}" />
						</aon:outputText>	
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_amount}" />
						</f:facet>
						<aon:outputText value="#{fbatch.modelToTotalAmount}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>	
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="fbatchData" showNote="true" />
			</aon:div>
			
		</aon:form>

	</ui:define>

</ui:composition>
