<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoicingGroupForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_invoicing_group_module}" />
				<ui:param name="controller" value="#{invoicingGroup}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">
					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{invoicingGroup.to.parent}" />
						<ui:param name="idRequired" value="#{true}" />						
						<ui:param name="lookupForRegistry" value="#{true}" />
						<ui:param name="lookupDisabled" value="#{!invoicingGroup.new}" />
						<ui:param name="lookupLabel" value="#{financeBundle.finance_invoicing_group}"/>
					</ui:include>
				</aon:panelGrid>

				<c:if test="#{!invoicingGroup.new}">
					<aon:div styleClass="aon-padding-top">
						<aon:panel>
							<f:facet name="header">
								<aon:outputLabel for="invoicingGroupDetailData" value="#{financeBundle.finance_invoicing_group_members}" />
							</f:facet>

							<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
								<ui:param name="controller" value="#{invoicingGroupDetail}" />
								<ui:param name="skipLineEdition" value="#{true}" />
								<ui:param name="columnClasses" value="aon-editDataTable-textColumn" />
								<ui:define name="beginFormListContent">
									<aon:commandLink id="#{dataTableId}-selectButton"
										styleClass="aon-table-row-link" value="&#160;"
										immediate="true" ajaxSingle="true" requestDelay="100"
										actionListener="#{invoicingGroupDetail.onSelect}"
										onkeyup="#{dataTableId}KeyUp(this)"
										onfocus="#{dataTableId}SelectRow(this)"
										onblur="#{dataTableId}DeselectRow(this)"
										focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
									</aon:commandLink>
								</ui:define>

								<ui:define name="columns">
									<aon:column>
										<f:facet name="header">
											<aon:outputText value="#{bundle.aon_company_name}" />
										</f:facet>
										<aon:outputText value="#{to.child.fullName}" 
											rendered="#{formList}" />
										<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
											<ui:param name="lookupTo" value="#{invoicingGroupDetail.to.child}" />
											<ui:param name="idRequired" value="#{true}" />						
											<ui:param name="skipLabel" value="#{true}" />
											<ui:param name="lookupForRegistry" value="#{true}" />
											<ui:param name="lookupSuffix" value="-Edit" />
											<ui:param name="lookupRendered" value="#{formEdit}" />
										</ui:include>
										<f:facet name="footer">
											<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
												<ui:param name="lookupTo" value="#{invoicingGroupDetail.to.child}" />
												<ui:param name="idRequired" value="#{true}" />						
												<ui:param name="skipLabel" value="#{true}" />
												<ui:param name="lookupForRegistry" value="#{true}" />
												<ui:param name="lookupSuffix" value="-New" />
												<ui:param name="lookupRendered" value="#{formNew}" />
											</ui:include>
										</f:facet>
									</aon:column>								
								</ui:define>
								<ui:define name="endFormListContent">
									<aon:commandLink id="customer_link" immediate="true"
										styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
										value="&#160;" title="#{bundle.aon_go}"
										actionListener="#{invoicingGroupDetail.onLoadCustomer}"
										action="customer_form"
										reRender="aonContent" />
								</ui:define>
							</ui:decorate>
						</aon:panel>
					</aon:div>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>
</ui:composition>
