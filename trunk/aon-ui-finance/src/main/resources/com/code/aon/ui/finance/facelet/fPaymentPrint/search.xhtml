<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="fPaymentPrintSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{financeBundle.finance_fPaymentPrint_module}" />
				<ui:param name="controller" value="#{finance}" />
				<ui:param name="skipResetButton" value="true" />
				<aon:methodParam name="backAction" value="fPaymentPrint_list"/>
			</ui:include>
			
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{finance}" />
				<ui:param name="searchController" value="#{financeSearch}" />
				<ui:define name="searchContent">
					<aon:methodParam name="searchAction" value="fPaymentPrint_list" />
					<ui:include src="/com/code/aon/ui/finance/facelet/finance/searchContent.xhtml" />
				</ui:define>
			</ui:decorate>

		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{supplierLookup}" />
		<aon:lookupButtonPopup lookup="#{creditorLookup}" />
		
	</ui:define>
	
</ui:composition>
