<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{financeBundle.finance_model_347_report_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				

				<ui:define name="toolbarActions">
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-back" 
						value="#{bundle.aon_back}"
						action="model_347_report_search" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						accesskey="#{bundle.aon_key_cancel}" />			
					<h:commandLink value="&#160;" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border">
						<f:param name="reportKey" value="vatBook" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>							
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="vatBook" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				<aon:div id="totalPanel" style="width: 100%; margin-bottom: 1em;">
					<aon:panelGrid columns="3" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-200,aon-panelGrid-even aon-width-200,aon-panelGrid-even aon-width-auto">
					
						<aon:outputText value="#{financeBundle.finance_total_key_a}" rendered="#{model347Report.keyAVisible}"/>
						<aon:outputText value="#{model347Report.totalKeyA}" rendered="#{model347Report.keyAVisible}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:div>
							<aon:selectOneMenu id="Model_347_format" 
								value="#{model347Report.format}">
								<f:selectItems value="#{model347Report.mod347Formats}" />
							</aon:selectOneMenu>
							<aon:commandButton id="gen-disk" 
								value="#{financeBundle.finance_create_disk}"
								actionListener="#{model347Report.onCreateDisk}" 
								styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
								style="border-width: 0px 0px 0px 0px;"
								reRender="totalPanel" 
								accesskey="#{bundle.aon_key_cancel}" />
						</aon:div>			

						<aon:outputText value="#{financeBundle.finance_total_key_b}" rendered="#{model347Report.keyBVisible}" />
						<aon:outputText value="#{model347Report.totalKeyB}" rendered="#{model347Report.keyBVisible}" >
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
						<aon:div>
							<h:commandLink target="_blank"
								title="#{model347Report.diskOk?(financeBundle.finance_download_disk):(financeBundle.finance_download_error)}"
								value="#{model347Report.diskOk?(financeBundle.finance_download_disk):(financeBundle.finance_download_error)}"
								style="border-width: 0px 0px 0px 0px;"
								actionListener="#{model347Report.downloadDisk}" rendered="#{model347Report.fileOutput!=null}"
								styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
						</aon:div>
					</aon:panelGrid>
				</aon:div>
			
				<aon:dataTable id="model347ReportList" value="#{model347Report.model}"
					style="width: 100%;"
					rows="20" var="to" rendered="#{model347Report.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-textColumn,
								aon-editDataTable-numberColumn">
								
					<aon:rowSelector								
								actionListener="#{model347Report.onDisable}"
								reRender="accountEntryData,totalPanel"/>
								
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_type}" />
						</f:facet>
						<aon:outputText value="#{to.type}" style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}" style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.document.document}" 
							style="#{!to.document.valid?'color: red;':''};#{to.disabled?'text-decoration: line-through; color: #BBB;':''};"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{geozoneBundle.geozone_province}" />
						</f:facet>
						<aon:outputText value="#{to.geozoneName} (#{to.geozone})" style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{geozoneBundle.geozone_country}" />
						</f:facet>
						<aon:outputText value="#{to.countryName} (#{to.country})" style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_total}" />
						</f:facet>
							<aon:commandLink ajaxSingle="true" 
								styleClass="aon-dataTable-link-simple"
								actionListener="#{model347Report.onDisable}"
								reRender="accountEntryData,totalPanel"
								title="#{(to.disabled)?(financeBundle.finance_enable):(financeBundle.finance_disable)}">
								<aon:outputText value="#{to.total}" style="#{to.disabled?'text-decoration: line-through; color: #BBB;':''}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
							</aon:commandLink>
					</aon:column>
				</aon:dataTable>

				<aon:dataScroller2 for="model347ReportList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
