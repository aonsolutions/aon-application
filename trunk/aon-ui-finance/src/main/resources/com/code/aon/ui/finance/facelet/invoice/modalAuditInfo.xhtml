<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showAuditInfoWindow">
		<c:if test="#{invoiceController.showAuditInfoWindow}">
			<rich:modalPanel id="auditInfoModalPanel"
				minWidth="450" minHeight="200" zindex="90"
				showWhenRendered="#{invoiceController.showAuditInfoWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_audit}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showAuditInfoWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{invoiceController.showAuditInfoWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="auditInfoForm">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
							
								<aon:panelGrid id="menuGrid" columns="2" dir="true"
									styleClass="aon-margin-top"  
									columnClasses="aon-panelGrid-even aon-noborder aon-bold, 
										aon-panelGrid-even aon-noborder aon-bold">

									<aon:outputLabel value="#{bundle.aon_creation_user}:" />
									<aon:outputText value="#{invoiceController.to.creationUser}" />

									<aon:outputLabel value="#{bundle.aon_creation_date}:" />
									<aon:outputText value="#{invoiceController.to.creationDate}" >
										<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>

									<aon:outputLabel value="#{bundle.aon_modification_user}:" />
									<aon:outputText value="#{invoiceController.to.modificationUser}" />

									<aon:outputLabel value="#{bundle.aon_modification_date}:" />
									<aon:outputText value="#{invoiceController.to.modificationDate}">
										<f:convertDateTime pattern="#{bundle.aon_timestamp2_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
										
								</aon:panelGrid>
								
							</aon:div>
						</aon:div>
					</aon:div>							
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
