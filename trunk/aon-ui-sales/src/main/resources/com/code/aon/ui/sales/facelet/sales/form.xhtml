<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="salesForm">
			<aon:div id="menuExt"> 
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{salesBundle.sales_module}" />
					<ui:param name="controller" value="#{sales}" />
					<ui:param name="skipSaveButton" value="#{!sales.pending}" />
					<ui:param name="skipRemoveButton" value="#{!sales.pending}" />
					<ui:define name="beforeSpinToolbarContent">
						<aon:commandButton id="delivery"
							value="#{salesBundle.sales_to_delivery}"
							immediate="#{true}" rendered="#{sales.pending and salesDetail.model.rowCount > 0}"
							styleClass="aon-finding-toolbar-item aon-icon-open-popup" 
							actionListener="#{sales.onDeliveryShow}"
							reRender="showDeliveryWindow">
							<f:setPropertyActionListener target="#{sales.showDeliveryWindow}"
								value="#{true}" />
						</aon:commandButton>
						<aon:commandButton id="invoice"
							value="#{salesBundle.sales_to_invoice}"
							immediate="#{true}" rendered="#{sales.pending and salesDetail.model.rowCount > 0}"
							styleClass="aon-finding-toolbar-item aon-icon-favorite"
							actionListener="#{sales.onInvoiceShow}"
							reRender="showInvoiceWindow">
							<f:setPropertyActionListener target="#{sales.showInvoiceWindow}"
								value="#{true}" />
						</aon:commandButton>
						<h:commandLink id="sales" value="#{bundle.aon_report}"
							target="_new" rendered="#{!sales.new}"
							action="#{report.onExecute}"
							disabled="#{salesDetail.to != null}"
							accesskey="#{bundle.aon_key_print}"
							styleClass="aon-finding-toolbar-item aon-icon-printer">
							<f:param name="reportKey" value="sales" />
							<f:param name="outputFormat" value="PDF" />
						</h:commandLink>
					</ui:define>
				</ui:decorate>
			</aon:div>			

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Sales_series-New"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:selectOneMenu id="Sales_series-New" 
							value="#{sales.to.series}" rendered="#{sales.new}"
							valueChangeListener="#{sales.onSeriesChanged}" 
							reRender="Sales_number,Sales_securityLevel">
							<f:selectItem itemLabel=" " itemValue="#{null}" />
							<f:selectItems value="#{configCollections.seriesIds}" />
						</aon:selectOneMenu>
						<aon:inputText id="Sales_series-Edit" 
							value="#{sales.to.series}" rendered="#{!sales.new}" 
							disabled="true" size="4" />
						<aon:inputText id="Sales_number" styleClass="aon-margin-left"
							value="#{sales.to.number}" disabled="#{!sales.new}" 
							required="true" size="7" />

						<aon:selectOneMenu id="Sales_securityLevel" styleClass="aon-margin-left"
							value="#{sales.to.securityLevel}" disabled="#{!sales.pending}">
							<f:selectItems value="#{commonCollections.securityLevels}" />
						</aon:selectOneMenu>

						<aon:outputText styleClass="aon-margin-left"
							value="#{sales.to.status}" />
 					</aon:div>

					<aon:outputLabel for="Sales_issueDate" 
						value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Sales_issueDate"
						value="#{sales.to.issueDate}" 
						required="true" disabled="#{!sales.pending}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Customer_id" 
						value="#{customerBundle.customer_customer}" />
					<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="Customer_id" 
								value="#{sales.to.customer.registry.id}"
								disabled="#{!sales.pending}" size="5"
								lookupProperty="registry" lookup="#{customerLookup}" 
								lookupChangeListener="#{sales.customerData}" 
								reRender="Customer_full_name,Customer_registry_document,SalesAddress,Sales_scope,Sales_defaultPayMethod,payMethodDiv"
								ajaxSingle="true" required="true"  />
							<aon:lookupButton
								windowTitle="#{customerBundle.customer_selection}"
								disabled="#{!sales.pending}" minHeight="460" minWidth="650" 
								property="#{sales.to.customer.registry}" lookupProperty="registry" lookup="#{customerLookup}" 
								lookupChangeListener="#{sales.customerData}"
								selectReRender="Customer_id,Customer_full_name,Customer_registry_document,SalesAddress,Sales_scope,Sales_defaultPayMethod,payMethodDiv"								
								actionType="search">
							</aon:lookupButton>
							<aon:inputText id="Customer_full_name" 
								value="#{(sales.to.customer.registry.fullName!=null)?(sales.to.customer.registry.fullName):('')}"
								disabled="true" size="60" />
						</a4j:region>
					</aon:div>

					<aon:outputLabel for="Customer_registry_document" 
						value="#{bundle.aon_company_document}" />
					<aon:inputText id="Customer_registry_document" 
						value="#{sales.to.customer.registry.document}"
						disabled="true" size="10" />

					<aon:outputLabel for="Sales_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="SalesAddress">
						<aon:selectOneMenu id="Sales_address" 
							value="#{sales.to.shippingAddress}" rendered="#{sales.addressCount > 0}"
							disabled="#{!sales.pending}">
							<f:selectItems value="#{sales.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{registryBundle.registry_no_address_available}"
							rendered="#{sales.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Sales_scope" 
						value="#{bundle.aon_scope}" />
					<aon:selectOneMenu id="Sales_scope" 
						value="#{sales.to.scope}"
						disabled="#{!sales.pending}">
						<f:selectItems value="#{configCollections.currentUserScopes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Sales_seller_id" 
						value="#{salesBundle.sales_seller}" />
					<aon:div styleClass="aon-lookup">
						<a4j:region>
							<aon:lookupInputText id="Seller_id" 
								value="#{sales.to.seller.registry.id}"
								disabled="#{!sales.pending}" size="5" 
								lookupProperty="registry" lookup="#{sellerLookup}" 
								lookupChangeListener="#{sales.sellerData}" 
								reRender="Seller_full_name"
								ajaxSingle="true" />
							<aon:lookupButton
								windowTitle="#{salesBundle.sales_seller_selection}"
								disabled="#{!sales.pending}" minHeight="460" minWidth="650" 
								property="#{sales.to.seller.registry}" lookupProperty="registry" lookup="#{sellerLookup}"
								lookupChangeListener="#{sales.sellerData}"
								selectReRender="Seller_id,Seller_full_name"								
								actionType="search">
							</aon:lookupButton>
							<aon:inputText id="Seller_full_name" 
								value="#{(sales.to.seller.registry.fullName!=null)?(sales.to.seller.registry.fullName):('')}"
								disabled="true" size="50" />
						</a4j:region>
					</aon:div>

					<aon:outputLabel for="Sales_workPlace" 
						value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Sales_workPlace" 
						value="#{sales.to.workPlace}"
						disabled="#{!sales.pending}">
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Sales_defaultPayMethod" 
						value="#{configBundle.config_pay_method}" />
					<aon:selectOneRadio id="Sales_defaultPayMethod" 
						value="#{sales.defaultPayMethod}"
						disabled="#{!sales.pending}"
						reRender="payMethodDiv">
						<f:selectItem itemLabel="#{salesBundle.sales_customer_pay_method}" itemValue="#{true}" />
						<f:selectItem itemLabel="#{salesBundle.sales_define_another_one}" itemValue="#{false}" />
					</aon:selectOneRadio>

					<aon:outputLabel for="Sales_total" 
						value="#{bundle.aon_total}" />
					<aon:outputText id="Sales_total" styleClass="aon-bold"
						value="#{sales.totalPrice}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>

				<aon:div id="payMethodDiv" styleClass="aon-padding-top">
					<aon:panel rendered="#{sales.defaultPayMethod != null and !sales.defaultPayMethod}">
						<f:facet name="header">
							<aon:outputText value="#{configBundle.config_pay_method}" />
						</f:facet>
						<aon:panelGrid columns="7" style="width:100%; font-size:0.9em;"
							rowClasses="aon-panelGrid-odd aon-dataTable-header,aon-panelGrid-even"
							columnClasses="aon-panelGrid-even aon-width-200,
								aon-panelGrid-even aon-width-80,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-110,
								aon-panelGrid-even aon-width-100,
								aon-panelGrid-even aon-width-auto,
								aon-panelGrid-even aon-width-200">

							<aon:outputText value="#{bundle.aon_type}"/>
							<aon:outputText value="#{registryBundle.registry_number_of_payments}" />
							<aon:outputText value="#{registryBundle.registry_days_to_first_payment}" />
							<aon:outputText value="#{registryBundle.registry_days_between_payments}" />
							<aon:outputText value="#{registryBundle.registry_payment_days}" />
							<aon:outputText value="#{configBundle.config_bank}" />
							<aon:outputText value="#{configBundle.config_bank_account}" />

							<aon:selectOneMenu id="Sales_payMethod" 
								value="#{sales.to.payMethod}"
								disabled="#{!sales.pending}">
								<f:selectItems value="#{configCollections.payMethods}" />
							</aon:selectOneMenu>
							<aon:inputText id="Sales_numberOfPayments"
								value="#{sales.to.numberOfPayments}"
								disabled="#{!sales.pending}" size="5" >
								<f:validateLongRange minimum="1" />
							</aon:inputText>	
							<aon:inputText id="Sales_daysToFirstPayment"
								value="#{sales.to.daysToFirstPayment}"
								disabled="#{!sales.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Sales_daysBetweenPayments"
								value="#{sales.to.daysBetweenPayments}"
								disabled="#{!sales.pending}" size="5">
								<f:validateLongRange minimum="0" />
							</aon:inputText>	
							<aon:inputText id="Sales_paymentDays"
								value="#{sales.to.paymentDays}" 
								disabled="#{!sales.pending}" size="5" />
							<aon:div styleClass="aon-lookup">
								<a4j:region>
									<aon:lookupInputText id="Sales_bank_code"
										value="#{sales.to.bank.code}"
										disabled="#{!sales.pending}" size="5"
										property="#{sales.to.bank}" lookup="#{bankLookup}"
										reRender="Sales_bank_name">
										<aon:joinProperty alias="Bank_code" value="#{sales.to.bank.code}" />
									</aon:lookupInputText>
									<aon:lookupButton 
										windowTitle="#{configBundle.config_bank_selection}"
										disabled="#{!sales.pending}" minHeight="460" minWidth="650"
										property="#{sales.to.bank}" lookup="#{bankLookup}"
										selectReRender="Sales_bank_code,Sales_bank_name"
										actionType="search">
									</aon:lookupButton>
									<aon:inputText id="Sales_bank_name"
										value="#{sales.to.bank.name}"
										disabled="true" size="40" />							
								</a4j:region>
							</aon:div>
							<aon:div>
								<aon:inputText id="Sales_bank_office"
									value="#{sales.to.bankAccount.office}"
									disabled="#{!sales.pending}" size="4" maxlength="4">
									<f:validateLength minimum="4" maximum="4" />
								</aon:inputText>
								<aon:inputText id="Sales_bank_control"
									value="#{sales.to.bankAccount.control}"
									disabled="#{!sales.pending}" size="2" maxlength="2">
									<f:validateLength minimum="2" maximum="2" />
								</aon:inputText>
								<aon:inputText id="Sales_bank_account"
									value="#{sales.to.bankAccount.account}"
									disabled="#{!sales.pending}" size="10" maxlength="10">
									<f:validateLength minimum="10" maximum="10" />
								</aon:inputText>
							</aon:div>

						</aon:panelGrid>
					</aon:panel>
				</aon:div>

				<aon:div styleClass="aon-padding-top">
					<aon:panel rendered="#{!sales.new}">
						<f:facet name="header">
							<aon:outputText value="#{salesBundle.sales_detail}" />
						</f:facet>
						<ui:decorate
							template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
							<ui:param name="dataTableId" value="salesDetails" />
							<ui:param name="controller" value="#{salesDetail}" />
							<ui:param name="rows" value="0" />
							<ui:param name="showNote" value="false" />
							<ui:param name="showDataScroller" value="false" />
							<ui:param name="skipResetButton" value="#{!sales.pending}" />
							<ui:param name="skipLineEdition" value="#{!sales.pending or !salesDetail.pending}" />
							<ui:param name="skipSaveButton" value="#{salesDetail.offerSource}" />
							<ui:param name="rowSelectorReRender" value="menuExt" />
							<ui:param name="resetButtonReRender" value="menuExt" />
							<ui:param name="newCancelButtonReRender" value="menuExt" />
							<ui:param name="cancelButtonReRender" value="menuExt" />
							<ui:param name="newSaveButtonReRender" value="menuExt,Sales_total" />
							<ui:param name="saveButtonReRender" value="menuExt,Sales_total" />
							<ui:param name="removeButtonReRender" value="menuExt,Sales_total" />
							<ui:param name="focusOnAdd" value="SalesDetail_item_product_code-New" />
							<ui:param name="focusOnSelect" value="SalesDetail_item_product_code" />

							<ui:define name="columns">

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-60">
									<f:facet name="header">
										<aon:outputLabel value="#{salesBundle.sales_detail_line}" />
									</f:facet>
									<aon:outputText value="#{to.line}"
										rendered="#{formList}" />
									<aon:inputText id="SalesDetail_line" 
										value="#{controller.to.line}" rendered="#{formEdit}"
										required="true" size="2" maxlength="3" />
									<f:facet name="footer">
										<aon:inputText id="SalesDetail_line-New" 
											value="#{controller.to.line}" rendered="#{formNew}"
											required="true" size="2" maxlength="3" />
									</f:facet>
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
									<f:facet name="header">
										<aon:outputLabel value="#{productBundle.product_item}" />
									</f:facet>
									<aon:outputText value="#{to.description}"
										rendered="#{formList}">
										<aon:abbreviateConverter maxWidth="64" />
									</aon:outputText>
									<aon:div id="salesDetailItemEdit" styleClass="aon-lookup" rendered="#{formEdit}">
										<a4j:region>
											<aon:lookupInputText id="SalesDetail_item_product_code" 
												value="#{salesDetail.to.item.product.code}"
												lookup="#{itemLookup}" 
												lookupChangeListener="#{salesDetail.onItemChanged}"
												reRender="salesDetailItemEdit,SalesDetail_price,SalesDetail_discount,SalesDetail_amount"  
												ajaxSingle="false" required="true" size="10" 
												onblur="toUpperCase(this);" focus="SalesDetail_item_product_name">
												<aon:joinProperty alias="Item_product_code" value="#{salesDetail.to.item.product.code}" />
											</aon:lookupInputText>
											<aon:lookupButton
												windowTitle="#{productBundle.product_item_selection}" 
												minHeight="460" minWidth="650"
												property="#{salesDetail.to.item}" lookup="#{itemLookup}" 
												lookupChangeListener="#{salesDetail.onItemChanged}"
												selectReRender="salesDetailItemEdit,SalesDetail_price,SalesDetail_discount,SalesDetail_amount"
												actionType="search">
											</aon:lookupButton>
											<aon:inputTextarea id="SalesDetail_item_product_name" 
												value="#{salesDetail.to.description}"
												cols="64" rows="#{!salesDetail.longDescription?1:5}"
												style="#{!salesDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
												<f:validateLength maximum="1024" />
											</aon:inputTextarea>
										</a4j:region>
										<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
											actionListener="#{salesDetail.onShortDescription}" reRender="SalesDetail_item_product_name"
											rendered="#{salesDetail.longDescription and salesDetail.to.item.product.code != null}" />
										<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" immediate="true"
											actionListener="#{salesDetail.onLongDescription}" reRender="SalesDetail_item_product_name"
											rendered="#{!salesDetail.longDescription and salesDetail.to.item.product.code != null}" />
									</aon:div>
									<f:facet name="footer">
										<aon:div id="salesDetailItemNew" styleClass="aon-lookup" rendered="#{formNew}">
											<a4j:region>
												<aon:lookupInputText id="SalesDetail_item_product_code-New" 
													value="#{salesDetail.to.item.product.code}"
													lookup="#{itemLookup}" 
													lookupChangeListener="#{salesDetail.onItemChanged}" 
													reRender="salesDetailItemNew,SalesDetail_price-New,SalesDetail_discount-New,SalesDetail_amount-New"  
													ajaxSingle="false" required="true" size="10" 
													onblur="toUpperCase(this);" focus="SalesDetail_item_product_name-New">
													<aon:joinProperty alias="Item_product_code"	value="#{salesDetail.to.item.product.code}" />
												</aon:lookupInputText>
												<aon:lookupButton
													windowTitle="#{productBundle.product_item_selection}"
													minHeight="460" minWidth="650" 
													property="#{salesDetail.to.item}" lookup="#{itemLookup}" 
													lookupChangeListener="#{salesDetail.onItemChanged}"
													selectReRender="salesDetailItemNew,SalesDetail_price-New,SalesDetail_discount-New,SalesDetail_amount-New"
													actionType="search">
												</aon:lookupButton>
												<aon:inputTextarea id="SalesDetail_item_product_name-New"
													value="#{salesDetail.to.description}"
													cols="64" rows="#{!salesDetail.longDescription?1:5}"
													style="#{!salesDetail.longDescription?'overflow-y:hidden;':'overflow-y:auto;'}">
													<f:validateLength maximum="1024" />
												</aon:inputTextarea>
											</a4j:region>
											<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" immediate="true"
												actionListener="#{salesDetail.onShortDescription}" reRender="SalesDetail_item_product_name-New"
												rendered="#{salesDetail.longDescription and salesDetail.to.item.product.code != null}" />
											<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" immediate="true"
												actionListener="#{salesDetail.onLongDescription}" reRender="SalesDetail_item_product_name-New"
												rendered="#{!salesDetail.longDescription and salesDetail.to.item.product.code != null}" />
										</aon:div>
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel value="#{bundle.aon_quantity}" />
									</f:facet>
									<aon:outputText value="#{to.quantity}"
										rendered="#{formList}">
										<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
									</aon:outputText>
									<aon:inputText id="SalesDetail_quantity" 
										value="#{controller.to.quantity}" rendered="#{formEdit}"
										valueChangeListener="#{controller.onQuantityChanged}" 
										reRender="SalesDetail_price,SalesDetail_discount,SalesDetail_amount" 
										required="true" size="7" focus="SalesDetail_price" />
									<f:facet name="footer">
										<aon:inputText id="SalesDetail_quantity-New" 
											value="#{controller.to.quantity}" rendered="#{formNew}" 
											valueChangeListener="#{controller.onQuantityChanged}" 
											reRender="SalesDetail_price-New,SalesDetail_discount-New,SalesDetail_amount-New" 
											required="true" size="7" focus="SalesDetail_price-New" />
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel value="#{bundle.aon_price}" />
									</f:facet>
									<aon:outputText value="#{to.price}"
										rendered="#{formList}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:inputText id="SalesDetail_price" 
										value="#{controller.to.price}" rendered="#{formEdit}" 
										reRender="SalesDetail_amount" 
										required="true" size="7" />
									<f:facet name="footer">
										<aon:inputText id="SalesDetail_price-New" 
											value="#{controller.to.price}" rendered="#{formNew}" 
											reRender="SalesDetail_amount-New" 
											required="true" size="7" />
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel value="#{bundle.aon_discount}" />
									</f:facet>
									<aon:outputText value="#{to.discountExpression.discountExpr}"
										rendered="#{formList}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:inputText id="SalesDetail_discount" 
										value="#{controller.to.discountExpression.discountExpr}" rendered="#{formEdit}"
										reRender="SalesDetail_amount" 
										required="true" size="7" />
									<f:facet name="footer">
										<aon:inputText id="SalesDetail_discount-New" 
											value="#{controller.to.discountExpression.discountExpr}" rendered="#{formNew}" 
											reRender="SalesDetail_amount-New" 
											required="true" size="7" />
									</f:facet>
								</aon:column>

								<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
									<f:facet name="header">
										<aon:outputLabel value="#{bundle.aon_amount}" />
									</f:facet>
									<aon:outputText value="#{controller.modelAmount}"
										rendered="#{formList}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:outputText id="SalesDetail_amount" 
										value="#{controller.amount}" rendered="#{formEdit}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
