<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="sellerList">
		
			<ui:decorate 
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{salesBundle.sales_seller_module}" />
				<ui:param name="controller" value="#{seller}" />
				<ui:define name="additionalToolbarContent">
					<h:commandLink id="sellerReportExcel" value="&#160;"
						target="_new" rendered="#{!seller.new}"
						action="#{report.onExecute}"
						disabled="#{seller.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="sellerReport" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink id="sellerReportPdf" value="#{bundle.aon_listing}"
						target="_new" rendered="#{!seller.new}"
						action="#{report.onExecute}"
						disabled="#{seller.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="sellerReport" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
					<h:commandLink id="sellerDetailReportExcel" value="&#160;"
						target="_new" rendered="#{!seller.new}"
						action="#{report.onExecute}"
						disabled="#{seller.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="sellerDetailExcelReport" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
					<h:commandLink id="sellerDetailReportPdf" value="#{bundle.aon_detailed_listing}"
						target="_new" rendered="#{!seller.new}"
						action="#{report.onExecute}"
						disabled="#{seller.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="sellerDetailReport" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{seller}" />
					<ui:define name="columns">

					<ui:include
						src="/com/code/aon/ui/sales/facelet/seller/listBasic.xhtml" />

 					<aon:column alias="Seller.registry.alias"
 						styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_alias}" />
						</f:facet>
						<aon:outputText value="#{to.registry.alias}"/>
					</aon:column>

					<aon:column alias="Seller.status"
						styleClass="aon-editDataTable-textColumn aon-nowrap">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}"/>
					</aon:column>

				</ui:define>
			</ui:decorate>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
