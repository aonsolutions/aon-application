<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showDeliveryWindow">
		<c:if test="#{sales.showDeliveryWindow}">
			<rich:modalPanel id="deliveryModalPanel" minHeight="240"
				minWidth="520" rendered="#{sales.showDeliveryWindow}"
				showWhenRendered="true" zindex="90">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{salesBundle.sales_to_delivery}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showDeliveryWindow" immediate="true">
							<f:setPropertyActionListener
								target="#{sales.showDeliveryWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="deliveryForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="delivery-accept"
										value="#{salesBundle.sales_to_delivery}"
										actionListener="#{sales.onDelivery}"
										action="delivery_form"
										styleClass="aon-finding-toolbar-item aon-icon-accept">
									</aon:commandButton>
									<aon:commandButton id="delivery-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showDeliveryWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{sales.showDeliveryWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 2em;">
								
									<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width:80%;">

										<aon:outputLabel for="Sales_deliverySeries"
											value="#{bundle.aon_series}" />
										<aon:selectOneMenu id="Sales_deliverySeries"
											value="#{sales.deliverySeries}"
											valueChangeListener="#{sales.onDeliverySeriesChanged}" 
											reRender="Sales_deliveryNumber">
											<f:selectItem itemLabel=" " itemValue="#{null}" />
											<f:selectItems value="#{configCollections.seriesIds}" />
										</aon:selectOneMenu>

										<aon:outputLabel for="Sales_deliveryNumber"
											value="#{bundle.aon_number}" />
										<aon:inputText id="Sales_deliveryNumber"
											value="#{sales.deliveryNumber}"
											required="true" size="7" />

										<aon:outputLabel for="Sales_deliveryDate"
											value="#{bundle.aon_date}" />
										<aon:selectInputDate id="Sales_deliveryDate"
											jointPoint="bottom-right"
											direction="top-right"
											verticalOffset="-60"
											value="#{sales.deliveryDate}"
											required="true"
											timeZone="#{timeZoneController.timeZone}"
											popupDateFormat="#{bundle.aon_date_pattern}"/>

										<aon:outputLabel for="Sales_deliveryWarehouse" 
											value="#{warehouseBundle.warehouse_warehouse}" />
										<aon:selectOneMenu id="Sales_deliveryWarehouse" 
											value="#{sales.deliveryWarehouse}">
											<f:selectItems value="#{warehouseCollections.warehouses}" />
										</aon:selectOneMenu>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
