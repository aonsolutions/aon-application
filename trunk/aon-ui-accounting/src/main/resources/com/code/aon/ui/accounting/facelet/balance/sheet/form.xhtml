<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="balanceForm">

				
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_balance_sheet}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
			
							
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="officialBalance" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="officialBalance" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
				</ui:define>
				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:editDataTable id="balanceDetailData"
					value="#{balanceSheet.balanceModel}" var="to" rows="150"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
					aon-editDataTable-textColumn, aon-editDataTable-numberColumn">

					<!--  <aon:rowSelector toggleOnClick="#{balanceDetail.to == null}"
				actionListener="#{balanceDetail.onSelect}" />-->

<!--  
-->
		       <aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{accountingBundle.accounting_balance_cdg}" />
						</f:facet>
						<aon:outputText size="10" value="#{to.code}"
							rendered="#{to!=balanceDetail.to}">

						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{accountingBundle.accounting_account}" />
						</f:facet>
						<aon:outputText size="80" value="#{to.description}"
							rendered="#{to!=balanceDetail.to}">

						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{accountingBundle.accounting_balance_sheet_notes}" />
						</f:facet>
						<aon:outputText size="60" value="#{to.notes}" rendered="#{to!=balanceDetail.to}">

						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountingBundle.accounting_accumulated}" />
						</f:facet>
						<aon:outputText size="20" value="#{to.amount}" rendered="#{to!=balanceDetail.to}">

						</aon:outputText>
					</aon:column>

<!--  
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="AnyO-1" />
						</f:facet>
						<aon:outputText size="20"  value="#{to.amount2}" rendered="#{to!=balanceDetail.to}">

						</aon:outputText>
					</aon:column>
-->

				

				</aon:editDataTable>
				<aon:dataScroller2 for="balanceDetailData" showNote="true" />
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
