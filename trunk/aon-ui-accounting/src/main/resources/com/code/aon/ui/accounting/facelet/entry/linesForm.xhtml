<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="linesContainer" style="width: 99%;" >
		<aon:div rendered="#{!accountEntry.new}" >

			<aon:editDataTable id="entryDetailTable" var="to" footerClass="aon-dataTable-footerClass"
				value="#{accountEntryDetail.model}" rows="100">

				<c:if test="#{accountEntry.manual}">
<!-- 
					<aon:rowSelector id="entryDetailTable-select"
						toggleOnClick="#{accountEntryDetail.to == null and accountEntry.manual}"
						actionListener="#{accountEntryDetail.onSelect}"
						reRender="#{rowSelectorReRender}"
						focus="#{(focusOnSelect != null)?(focusOnSelect):''}" />
 -->
					<aon:column id="entryDetailTable-selectColumn"
						styleClass="aon-editDataTable-iconColumn aon-vertical-align-top">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:commandButton id="entryDetailTable-select"
							title="#{bundle.aon_reset}" 
							actionListener="#{accountEntryDetail.onSelect}"
							rendered="#{to!=accountEntryDetail.to}"
							reRender="#{resetButtonReRender}"
							styleClass="aon-editDataTable-button aon-icon-rowSelector"
							focus="accountId" />
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="entryDetailTable-reset"
									title="#{bundle.aon_reset} (ALT+#{bundle.aon_key_new_line})" 
									actionListener="#{accountEntryDetail.onReset}" rendered="#{!accountEntryDetail.new}"
									styleClass="aon-editDataTable-button aon-icon-reset"
									accesskey="#{bundle.aon_key_new_line}"
									focus="accountId-NEW" />

							</aon:div>
						</f:facet>
					</aon:column>
				</c:if>

				<f:facet name="footer">
					<rich:columnGroup
						 rendered="#{accountEntryDetail.new}">
						<aon:column colspan="#{accountEntry.manual?'3':'2'}">
							<aon:outputText value="&#160;" />
						</aon:column>
						<aon:column>
							<aon:div styleClass="aon-italic aon-bold aon-text-right">
								<aon:outputText value="#{accountEntry.totalDebit}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</aon:column>
						<aon:column>
							<aon:div styleClass="aon-italic aon-bold aon-text-right">
								<aon:outputText value="#{accountEntry.totalCredit}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:div>
						</aon:column>
						<aon:column colspan="2">
							<aon:outputText value="&#160;" />
						</aon:column>
					</rich:columnGroup>
				</f:facet>

				<aon:column
					styleClass="aon-editDataTable-textColumn aon-width-auto aon-nowrap">
					<f:facet name="header">
						<aon:outputText value="#{accountBundle.account_account}" />
					</f:facet>

					<aon:div style="width: 90%;"
						rendered="#{to!=accountEntryDetail.to}" styleClass="aon-nowrap">
						<h:commandLink immediate="#{true}"
							styleClass="aon-dataTable-link-simple"
							actionListener="#{accountEntryDetail.onAccountStatement}"
							title="#{accountingBundle.accounting_statement_module}"
							action="account_statement_list">
							<aon:panelGroup style="width: 90px;float: left;">
								<aon:outputText value="#{to.account.id}" />
							</aon:panelGroup>
						</h:commandLink>
						<aon:panelGroup styleClass="aon-italic"
							style="width: auto; font-size: 0.8em;">
							<aon:outputText value="#{to.account.description}">
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>
						</aon:panelGroup>
					</aon:div>

					<ui:include
						src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
						<ui:param name="wizard" value="#{accountWizard}" />
						<ui:param name="id" value="accountId" />
						<ui:param name="required" value="#{true}" />
						<ui:param name="renderDescription" value="#{true}" />
						<ui:param name="renderedAttr" value="#{to==accountEntryDetail.to}" />
						<ui:param name="disabled" value="#{false}" />
						<ui:param name="reRenderAttr" value="none" />
						<ui:param name="entity" value="#{accountEntryDetail.to.account}" />
						<ui:param name="ELExpression"
							value="accountEntryDetail.to.account" />
					</ui:include>
					<f:facet name="footer">
						<ui:include
							src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
							<ui:param name="wizard" value="#{accountWizard}" />
							<ui:param name="id" value="accountId-NEW" />
							<ui:param name="required" value="#{true}" />
							<ui:param name="renderDescription" value="#{true}" />
							<ui:param name="renderedAttr" value="#{accountEntryDetail.new}" />
							<ui:param name="disabled" value="#{false}" />
							<ui:param name="reRenderAttr" value="none" />
							<ui:param name="entity" value="#{accountEntryDetail.to.account}" />
							<ui:param name="ELExpression"
								value="accountEntryDetail.to.account" />
						</ui:include>
					</f:facet>
				</aon:column>

				<aon:column
					styleClass="aon-editDataTable-textColumn aon-nowrap aon-width-150">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_concept}" />
					</f:facet>
					<aon:outputText value="#{to.concept}" styleClass="aon-nowrap"
						rendered="#{to!=accountEntryDetail.to}" />
					<aon:inputText id="AccountEntryDetail_concept-Edit"
						value="#{accountEntryDetail.to.concept}"
						rendered="#{to==accountEntryDetail.to}" required="true" size="20" />
					<f:facet name="footer">
						<aon:inputText id="AccountEntryDetail_concept-New"
							value="#{accountEntryDetail.to.concept}"
							rendered="#{accountEntryDetail.new}" required="true" size="20" />
					</f:facet>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
					<f:facet name="header">
						<aon:outputText value="#{accountingBundle.accounting_debit}" />
					</f:facet>
					<aon:outputText value="#{to.debit}"
						rendered="#{to!=accountEntryDetail.to}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
					<aon:inputText value="#{accountEntryDetail.to.debit}"
						rendered="#{to==accountEntryDetail.to}" required="true" size="10">
						<f:validateDoubleRange />
					</aon:inputText>
					<f:facet name="footer">
						<aon:div styleClass="aon-italic"
							style="text-align:right; font-weight:bold;">
							<aon:inputText value="#{accountEntryDetail.to.debit}"
								rendered="#{accountEntryDetail.new}" required="true" size="10">
								<f:validateDoubleRange />
								<a4j:support event="onkeyup"
									onsubmit="if(event.keyCode != 120) return false;"
									eventsQueue="debitKeyUp" ignoreDupResponses="true"
									requestDelay="100"
									actionListener="#{accountEntryDetail.onBalanceAmount}">
								</a4j:support>
							</aon:inputText>
							<aon:outputText value="#{accountEntry.totalDebit}"
								rendered="#{!accountEntryDetail.new}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:div>
					</f:facet>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
					<f:facet name="header">
						<aon:outputText value="#{accountingBundle.accounting_credit}" />
					</f:facet>
					<aon:outputText value="#{to.credit}"
						rendered="#{to!=accountEntryDetail.to}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
					<aon:inputText value="#{accountEntryDetail.to.credit}"
						rendered="#{to==accountEntryDetail.to}" required="true" size="10">
						<f:validateDoubleRange />
					</aon:inputText>
					<f:facet name="footer">
						<aon:div styleClass="aon-italic"
							style="text-align:right; font-weight:bold;">
							<aon:inputText value="#{accountEntryDetail.to.credit}"
								rendered="#{accountEntryDetail.new}" required="true" size="10">
								<f:validateDoubleRange />
							</aon:inputText>
							<aon:outputText value="#{accountEntry.totalCredit}"
								rendered="#{!accountEntryDetail.new}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:div>
					</f:facet>
				</aon:column>

				<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
					<f:facet name="header">
						<aon:outputText
							value="#{accountingBundle.accounting_balancing_account}" />
					</f:facet>

					<aon:div style="width: 90%;"
						rendered="#{to!=accountEntryDetail.to}" ajaxRendered="true">

						<aon:outputText value="#{to.balancingAccount.id}">
							<rich:toolTip value="#{to.balancingAccount.description}"
								hideEvent="onmouseout" showDelay="200">
							</rich:toolTip>
						</aon:outputText>
						
						
					</aon:div>

					<ui:include
						src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
						<ui:param name="wizard" value="#{accountWizard}" />
						<ui:param name="id" value="balancingAccountId" />
						<ui:param name="required" value="#{false}" />
						<ui:param name="renderDescription" value="#{false}" />
						<ui:param name="renderedAttr" value="#{to==accountEntryDetail.to}" />
						<ui:param name="disabled" value="#{false}" />
						<ui:param name="reRenderAttr" value="none" />
						<ui:param name="entity"
							value="#{accountEntryDetail.to.balancingAccount}" />
						<ui:param name="ELExpression"
							value="accountEntryDetail.to.balancingAccount" />
					</ui:include>
					<f:facet name="footer">
						<ui:include
							src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
							<ui:param name="wizard" value="#{accountWizard}" />
							<ui:param name="id" value="balancingAccountId-NEW" />
							<ui:param name="required" value="#{false}" />
							<ui:param name="renderDescription" value="#{false}" />
							<ui:param name="renderedAttr" value="#{accountEntryDetail.new}" />
							<ui:param name="disabled" value="#{false}" />
							<ui:param name="reRenderAttr" value="none" />
							<ui:param name="entity"
								value="#{accountEntryDetail.to.balancingAccount}" />
							<ui:param name="ELExpression"
								value="accountEntryDetail.to.balancingAccount" />
						</ui:include>
					</f:facet>
				</aon:column>

				<c:if test="#{accountEntry.manual}">
					<aon:column
						styleClass="aon-editDataTable-buttonsColumn aon-vertical-align-top">
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:div>
							<aon:outputText value="&#160;" />
							<aon:commandButton id="entryDetailTable-save"
								title="#{bundle.aon_accept} (ALT+#{bundle.aon_key_save_line})" 
								actionListener="#{accountEntryDetail.onAccept}" rendered="#{to==accountEntryDetail.to}"
								reRender="entryDetailTableDataScroller"
								styleClass="aon-editDataTable-button aon-icon-accept"
								accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton id="entryDetailTable-cancel"
								title="#{bundle.aon_cancel} (ALT+#{bundle.aon_key_cancel_line})" 
								actionListener="#{accountEntryDetail.onCancel}" immediate="true"
								rendered="#{to==accountEntryDetail.to}" 
								styleClass="aon-editDataTable-button aon-icon-cancel"
								accesskey="#{bundle.aon_key_cancel_line}" />
							<aon:commandButton id="entryDetailTable-remove"
								title="#{bundle.aon_remove} (ALT+#{bundle.aon_key_remove_line})" 
								immediate="true" rendered="#{to==accountEntryDetail.to}"
								reRender="entryDetailTableDataScroller"
								onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
								actionListener="#{accountEntryDetail.onRemove}"
								styleClass="aon-editDataTable-button aon-icon-delete"
								accesskey="#{bundle.aon_key_remove_line}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div>
								<aon:outputText value="&#160;" />
								<aon:commandButton id="entryDetailTable-new-save"
									title="#{bundle.aon_save} (ALT+#{bundle.aon_key_save_line})" 
									actionListener="#{accountEntryDetail.onAccept}" rendered="#{accountEntryDetail.new}"
									reRender="entryDetailTableDataScroller"
									styleClass="aon-editDataTable-button aon-icon-accept"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton id="entryDetailTable-new-cancel"
									title="#{bundle.aon_cancel} (ALT+#{bundle.aon_key_cancel_line})" 
									rendered="#{accountEntryDetail.new}" immediate="true"
									confirmTitle="#{bundle.aon_confirm_title}"
									onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
									actionListener="#{accountEntryDetail.onCancel}"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									accesskey="#{bundle.aon_key_cancel_line}" />
							</aon:div>
						</f:facet>
					</aon:column>
				</c:if>
			</aon:editDataTable>

			<aon:div id="entryDetailTableDataScroller" layout="none">
				<aon:dataScroller2 for="entryDetailTable" showNote="true" />
			</aon:div>

		</aon:div>
	</aon:div>
</ui:composition>
