<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<aon:div styleClass="aon-scroll-area" >
			
			<aon:dataTable value="#{accountCheck.parentEntryModel}" var="to" 
				style="text-align: left;" rows="10" id="parentEntryCheck" >
					<f:facet name="header">
						<aon:outputText value="#{accountingBundle.accounting_check_parentEntry}" />	
					</f:facet>
				
				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_id}" />
					</f:facet>
					<aon:outputText value="#{to.id}" />
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_description}" />
					</f:facet>
					<aon:outputText value="#{to.description}" />
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_alias}" />
					</f:facet>
					<aon:outputText value="#{to.alias}" />
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{accountBundle.account_entryEnabled}" />
					</f:facet>
					<aon:div styleClass="#{to.entryEnabled?'aon-icon-checked':'aon-icon-check'}">
						<f:verbatim>&#160;</f:verbatim>
					</aon:div>
				</aon:column>
			</aon:dataTable>
			<aon:dataScroller2 for="parentEntryCheck" showNote="true" />
	</aon:div>
				
</ui:composition>
