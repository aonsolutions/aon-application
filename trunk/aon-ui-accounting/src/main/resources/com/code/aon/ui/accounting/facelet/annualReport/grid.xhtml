<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-margin-top" style="width: 100%;" rendered="#{!annualReport.new}">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
			<ui:param name="controller" value="#{annualReportDetail}" />
			<ui:define name="columns">
				<aon:column styleClass="aon-editDataTable-iconColumn aon-width-100">
					<f:facet name="header">
						<aon:outputText value="#{accountingBundle.accounting_sortkey}" />
					</f:facet>
					<aon:inputText required="true" 
						rendered="#{to==annualReportDetail.to}" value="#{annualReportDetail.to.sortKey}"
						maxlength="4" size="2" />
					<aon:outputText  rendered="#{to!=annualReportDetail.to}" value="#{to.sortKey}" />
					<f:facet name="footer">
						<aon:inputText required="true"
							rendered="#{annualReportDetail.new}" value="#{annualReportDetail.to.sortKey}"
							maxlength="4" size="2" />
					</f:facet>
				</aon:column>
				<aon:column styleClass="aon-editDataTable-iconColumn aon-width-200">
					<f:facet name="header">
						<aon:outputText value="#{accountingBundle.accounting_style}" />
					</f:facet>
					<aon:outputText  rendered="#{to!=annualReportDetail.to}" value="#{to.style}" />
					<aon:selectOneMenu rendered="#{to==annualReportDetail.to}"  
						value="#{annualReportDetail.to.style}">
						<f:selectItems value="#{accountingCollections.annualReportStyles}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu rendered="#{annualReportDetail.new}"  
							value="#{annualReportDetail.to.style}">
							<f:selectItems value="#{accountingCollections.annualReportStyles}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>



				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputText value="#{accountingBundle.accounting_content}" />
					</f:facet>
					<aon:div style="#{to.cssStyle}">
						<aon:outputText value="#{to.content}" escape="false" 
							rendered="#{to!=annualReportDetail.to}" />
					</aon:div>
					<aon:inputTextarea 
						rendered="#{to==annualReportDetail.to}" cols="100" rows="3" 
						value="#{annualReportDetail.to.content}"/>
					<f:facet name="footer">
						<aon:inputTextarea 
							rendered="#{annualReportDetail.new}" cols="100" rows="3"
							value="#{annualReportDetail.to.content}" />
					</f:facet>
				</aon:column>
			</ui:define>
		</ui:decorate>
	</aon:div>

</ui:composition>
