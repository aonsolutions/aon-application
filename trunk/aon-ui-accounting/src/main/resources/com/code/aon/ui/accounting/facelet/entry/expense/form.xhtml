<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="expenseEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_expense_entry_module}" />
				<ui:param name="toolbarDescription" value="#{expenseEntry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save" 
						value="#{accountingBundle.accounting_entry_generate}"
						accesskey="#{bundle.aon_key_save}"
						title="#{accountingBundle.accounting_entry_generate} (ALT+#{bundle.aon_key_save})"
						actionListener="#{expenseEntry.onAccept}"
						action="#{expenseEntry.accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{accountingBundle.accounting_entry_generate}?')) return false;" />
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						title="#{bundle.aon_reset} (ALT+#{bundle.aon_key_new})" 
						rendered="#{!expenseEntry.new}"
						actionListener="#{expenseEntry.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"/>
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" 
						title="#{bundle.aon_remove} (ALT+#{bundle.aon_key_remove})"
						action="accountEntry_search"
						actionListener="#{expenseEntry.onRemove}"
						rendered="#{!expenseEntry.new}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;" />

					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})" 
						action="accountEntry_form"
						rendered="#{!expenseEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"/>
					<aon:commandButton value="#{bundle.aon_back}"
						accesskey="#{bundle.aon_key_cancel}"
						title="#{bundle.aon_back} (ALT+#{bundle.aon_key_cancel})"
						action="accountEntry_search" rendered="#{expenseEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;" />
						
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					
					<aon:outputLabel for="date"
						value="#{bundle.aon_date}" />
					<aon:div id="div">
						<aon:selectInputDate id="date" required="true"
							value="#{expenseEntry.header.date}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" >
							<a4j:support event="oninputchange" reRender="dateMsg" ajaxSingle="true" />
							<a4j:support event="onchanged" reRender="dateMsg" ajaxSingle="true" />
						</aon:selectInputDate>
						<aon:outputText style="#{expenseEntry.periodMessage==null?'color:red;':''}" id="dateMsg" 
							value="Ejercicio #{(expenseEntry.periodMessage==null)?'no definido':expenseEntry.periodMessage}" />
					</aon:div>
						

					<aon:outputLabel for="Account_registryBank"
						value="#{configBundle.config_bank}" />
					<aon:selectOneMenu id="Account_registryBank"
						value="#{expenseEntry.header.registryBank}">
						<f:selectItem itemLabel="#{accountingBundle.accounting_def_cash_acc}" value="#{null}" />
						<f:selectItems value="#{expenseEntry.companyRegistryBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_concept"
						value="#{bundle.aon_concept}" />
					<aon:inputText id="Account_concept"
						value="#{expenseEntry.header.concept}" size="50" maxlength="32" />

					<aon:outputLabel for="Account_account"
						value="#{accountBundle.account_account}" />
					<aon:selectOneMenu id="Account_account" required="true"
						value="#{expenseEntry.header.account}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{accountCollections.expensesAccounts}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_account"
						value="#{accountBundle.account_account}" />
					<aon:outputText value="#{expenseEntry.header.account}"/>
						

					<aon:outputLabel for="AccountEntry_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu id="AccountEntry_securityLevel"
						value="#{expenseEntry.header.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_amount"
						value="#{bundle.aon_amount}" />
					<aon:inputText id="Account_amount"
						value="#{expenseEntry.header.amount}" size="15"	/>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
