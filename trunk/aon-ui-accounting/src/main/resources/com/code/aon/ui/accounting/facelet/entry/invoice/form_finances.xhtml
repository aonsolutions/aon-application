<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:panel rendered="#{invoiceEntry.registryFilled}">
		<f:facet name="header">
			<aon:outputText value="#{financeBundle.finance_finances}" />
		</f:facet>
		<aon:editDataTable id="FinancesData" var="financeTo" rows="0"
			value="#{invoiceEntry.finances}"
			columnClasses="aon-editDataTable-iconColumn, 
					aon-width-100  aon-editDataTable-textColumn,
					aon-width-200  aon-editDataTable-textColumn,
					aon-width-auto aon-editDataTable-textColumn,
					aon-width-80 aon-editDataTable-textColumn, 
					aon-width-100  aon-editDataTable-numberColumn,
					aon-editDataTable-buttonsColumn">

			<aon:rowSelector immediate="true"
				rendered="#{financeTo!=invoiceEntry.currentFinance}"
				actionListener="#{invoiceEntry.onSelectFinance}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton id="newFinance" value=""
							reRender="FinancesData"
							styleClass="aon-editDataTable-button aon-icon-new"
							title="#{bundle.aon_key_new_line}"
							actionListener="#{invoiceEntry.onNewFinance}"
							rendered="#{!invoiceEntry.newFinance}"
							focus="Account_Finance_DueDate"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel value="#{bundle.aon_date}"
						for="Account_Finance_DueDate" />
				</f:facet>
				<aon:outputText rendered="#{financeTo!=invoiceEntry.currentFinance}"
					value="#{financeTo.dueDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate id="Account_Finance_DueDate"
					rendered="#{financeTo==invoiceEntry.currentFinance}"
					value="#{invoiceEntry.currentFinance.dueDate}" inputSize="8"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}" />
				<f:facet name="footer">
					<aon:selectInputDate id="Account_Finance_DueDate-New"
						rendered="#{invoiceEntry.newFinance}"
						value="#{invoiceEntry.currentFinance.dueDate}" inputSize="8"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="Account_Finance_PayMethod"
						value="#{configBundle.config_pay_method}" />
				</f:facet>
				<aon:outputText value="#{financeTo.payMethod.name}"
					rendered="#{financeTo!=invoiceEntry.currentFinance}" />
				<aon:selectOneMenu id="Account_Finance_PayMethod"
					styleClass="aon-form-selectOneMenu-field"
					rendered="#{financeTo==invoiceEntry.currentFinance}"
					valueChangeListener="#{invoiceEntry.onPayMethodChanged}"
					reRender="RegistryBank_lookup"
					value="#{invoiceEntry.currentFinance.payMethod}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{configCollections.payMethods}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="Account_Finance_PayMethod-New"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{invoiceEntry.newFinance}"
						valueChangeListener="#{invoiceEntry.onPayMethodChanged}"
						reRender="RegistryBank_lookup-New"
						value="#{invoiceEntry.currentFinance.payMethod}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:div>
						<aon:outputLabel for="RegistryBank_code"
							value="#{configBundle.config_bank}" />
						<aon:outputText value=" - #{configBundle.config_bank_account}" />
					</aon:div>
				</f:facet>
				<aon:outputText value="#{financeTo.bank.name}"
					rendered="#{financeTo!=invoiceEntry.currentFinance}" />
				<aon:outputText rendered="#{financeTo!=invoiceEntry.currentFinance}"
					value=" #{financeTo.bankAccount}" />

				<aon:div id="RegistryBank_lookup" styleClass="aon-lookup"
					rendered="#{financeTo==invoiceEntry.currentFinance}">
					<aon:lookupInputText id="RegistryBank_code"
						property="#{financeTo.bank}" reRender="RegistryBank_lookup"
						lookup="#{bankLookup}" value="#{financeTo.bank.code}" size="3"
						lookupChangeListener="#{invoiceEntry.onBankChanged}" maxlength="4">
						<aon:joinProperty alias="Bank_code" value="#{financeTo.bank.code}" />
					</aon:lookupInputText>
					<aon:lookupButton
						windowTitle="#{configBundle.config_bank_selection}"
						selectReRender="RegistryBank_lookup" actionType="search"
						lookupChangeListener="#{invoiceEntry.onBankChanged}"
						lookup="#{bankLookup}" minHeight="460" minWidth="650"
						property="#{financeTo.bank}">
					</aon:lookupButton>
					<aon:inputText id="RegistryBank_name"
						value="#{financeTo.bank.name}" size="30" disabled="true" />
					<aon:inputText
						value="#{invoiceEntry.currentFinance.bankAccount.office}" size="3"
						maxlength="4">
						<f:validateLength minimum="4" maximum="4" />
					</aon:inputText>
					<aon:inputText
						value="#{invoiceEntry.currentFinance.bankAccount.control}"
						size="1" maxlength="2">
						<f:validateLength minimum="2" maximum="2" />
					</aon:inputText>
					<aon:inputText
						value="#{invoiceEntry.currentFinance.bankAccount.account}"
						size="8" maxlength="10">
						<f:validateLength minimum="10" maximum="10" />
					</aon:inputText>
					<aon:div style="font-size:0.9em;" styleClass="aon-italic">
						<aon:selectOneMenu id="Account_Finance_RegistryBank"
							style="margin-left: 50px;"
							reRender="RegistryBank_lookup" immediate="true"
							value="#{registryCollections.registryBank}"
							valueChangeListener="#{invoiceEntry.onRBankChanged}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{invoiceEntry.banks}" />
						</aon:selectOneMenu>
					</aon:div>
				</aon:div>
				<f:facet name="footer">
					<aon:div id="RegistryBank_lookup-New" styleClass="aon-lookup"
						rendered="#{invoiceEntry.newFinance}">
						<aon:lookupInputText id="RegistryBank_code-New"
							property="#{invoiceEntry.currentFinance.bank}"
							reRender="RegistryBank_lookup-New" lookup="#{bankLookup}"
							lookupChangeListener="#{invoiceEntry.onBankChanged}"
							value="#{invoiceEntry.currentFinance.bank.code}" size="3"
							maxlength="4">
							<aon:joinProperty alias="Bank_code"
								value="#{invoiceEntry.currentFinance.bank.code}" />
						</aon:lookupInputText>
						<aon:lookupButton
							windowTitle="#{configBundle.config_bank_selection}"
							selectReRender="RegistryBank_lookup-New"
							lookupChangeListener="#{invoiceEntry.onBankChanged}"
							actionType="search" lookup="#{bankLookup}" minHeight="460"
							minWidth="650" property="#{invoiceEntry.currentFinance.bank}">
						</aon:lookupButton>
						<aon:inputText id="RegistryBank_name-New"
							value="#{invoiceEntry.currentFinance.bank.name}" size="30"
							disabled="true" />
						<aon:inputText
							value="#{invoiceEntry.currentFinance.bankAccount.office}"
							size="3" maxlength="4">
							<f:validateLength minimum="4" maximum="4" />
						</aon:inputText>
						<aon:inputText
							value="#{invoiceEntry.currentFinance.bankAccount.control}"
							size="1" maxlength="2">
							<f:validateLength minimum="2" maximum="2" />
						</aon:inputText>
						<aon:inputText
							value="#{invoiceEntry.currentFinance.bankAccount.account}"
							size="8" maxlength="10">
							<f:validateLength minimum="10" maximum="10" />
						</aon:inputText>
						<aon:div style="font-size:0.9em;" styleClass="aon-italic">
							<aon:selectOneMenu id="Account_Finance_RegistryBank-New"
								style="margin-left: 50px;"
								valueChangeListener="#{invoiceEntry.onRBankChanged}"
								value="#{registryCollections.registryBank}" immediate="true"
								reRender="RegistryBank_lookup-New">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{invoiceEntry.banks}" />
							</aon:selectOneMenu>
						</aon:div>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{financeTo.financeStatus}" />
				<f:facet name="footer">
					<aon:outputText value="#{invoiceEntry.currentFinance.financeStatus}" 
						rendered="#{invoiceEntry.newFinance}"/>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="Account_Finance_Amount"
						value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText rendered="#{financeTo!=invoiceEntry.currentFinance}"
					value="#{financeTo.amount}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="Account_Finance_Amount" size="8"
					rendered="#{financeTo==invoiceEntry.currentFinance}"
					value="#{invoiceEntry.currentFinance.amount}" required="true" />
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:inputText id="Account_Finance_Amount-New" size="8"
							rendered="#{invoiceEntry.newFinance}"
							value="#{invoiceEntry.currentFinance.amount}">
						</aon:inputText>
						<aon:outputText id="financesTotal" rendered="#{!invoiceEntry.newFinance}"
							style="#{invoiceEntry.settled?'':'color:red;font-weight:bold;'}" 
							value="#{invoiceEntry.financeTotal}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<f:verbatim>&#160;</f:verbatim>
				</f:facet>
				<aon:div rendered="#{financeTo==invoiceEntry.currentFinance}">
					<aon:commandButton title="#{bundle.aon_save}"
						reRender="FinancesData,aonToolbar"
						actionListener="#{invoiceEntry.onUpdateFinance}"
						styleClass="aon-editDataTable-button aon-icon-accept" value=""
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="#{bundle.aon_cancel}"
						reRender="FinancesData,aonToolbar"
						actionListener="#{invoiceEntry.onCancelFinance}" immediate="true"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
						styleClass="aon-editDataTable-button aon-icon-cancel" value=""
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:commandButton title="#{bundle.aon_remove}"
						reRender="FinancesData,aonToolbar"
						actionListener="#{invoiceEntry.onRemoveFinance}" immediate="true"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
						styleClass="aon-editDataTable-button aon-icon-delete" value=""
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<aon:div rendered="#{invoiceEntry.newFinance}">
							<aon:commandButton title="#{bundle.aon_save}"
								reRender="FinancesData,aonToolbar" focus="saveInvoice"
								actionListener="#{invoiceEntry.onAddFinance}"
								styleClass="aon-editDataTable-button aon-icon-accept" value=""
								accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{invoiceEntry.onCancelFinance}"
								reRender="FinancesData,aonToolbar" immediate="true"
								styleClass="aon-editDataTable-button aon-icon-cancel" value=""
								accesskey="#{bundle.aon_key_cancel_line}" />
						</aon:div>
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>
	</aon:panel>
</ui:composition>
