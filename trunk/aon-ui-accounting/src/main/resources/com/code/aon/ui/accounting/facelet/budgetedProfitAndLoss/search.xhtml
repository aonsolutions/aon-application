<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_budgeted_balance_sheet_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{budgetedProfitAndLossReport.calculateSummaryCollections}"
						type="actionListener" />
					<aon:methodParam name="searchAction" value="budgeted_profit_and_loss_list" />

					<aon:outputLabel for="reportDate"
						value="#{accountingBundle.accounting_report_date}" />
					<aon:selectInputDate id="reportDate"
						value="#{budgetedProfitAndLossReport.parameters.date}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountingBundle.accounting_period}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{budgetedProfitAndLossReport.parameters.period}">
						<f:selectItems value="#{accountingCollections.activeAccountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate 
							id="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{budgetedProfitAndLossReport.parameters.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate 
							id="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{budgetedProfitAndLossReport.parameters.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:panelGrid>

					<aon:outputLabel for="Account_level"
						value="#{accountingBundle.accounting_level}" />
					<aon:div>
						<aon:selectOneRadio id="Account_level"
							value="#{budgetedProfitAndLossReport.parameters.accountLevel}">
							<f:selectItem itemLabel="1" itemValue="1" itemDisabled="true"/>
							<f:selectItem itemLabel="2"  itemValue="2" itemDisabled="true"/>
							<f:selectItem itemLabel="3" itemValue="3" />
							<f:selectItem itemLabel="4" itemValue="4" />
							<f:selectItem itemLabel="5" itemValue="5" />
						</aon:selectOneRadio>
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_zero_sum"
							value="#{budgetedProfitAndLossReport.parameters.noTouchedAccountVisible}" />
						<aon:outputLabel for="Account_zero_sum"
							value="#{accountingBundle.accounting_no_touched_account}" />
					</aon:div>

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_securityLevel"
						value="#{budgetedProfitAndLossReport.parameters.securityLevel}">
						<f:selectItem itemValue="" itemLabel=" " />
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
