<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountingBundle.accounting_profit_and_loss_module}" />
				<ui:param name="skipResetButton" value="true" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener"
						value="#{profitAndLossReport.onEditSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="profit_and_loss_search" />
				</ui:define>
				<ui:define name="additionalToolbarContent">
					<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_listing}" action="#{report.onExecute}">
						<f:param name="reportKey" value="profitAndLoss" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
					<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{accountingBundle.accounting_monthly_report}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="profitAndLossMonthly" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
										
					<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{accountingBundle.accounting_profit_and_loss_module_expense}"
						action="#{report.onExecute}">
						<f:param name="reportKey" value="profitAndLossTotalExpenses" />
						<f:param name="outputFormat" value="PDF" />
						<f:setPropertyActionListener value="#{accountingBundle.accounting_profit_and_loss_module_expense_graph}" target="#{profitAndLossReport.graphName}" />
					</h:commandLink>
					
					<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{accountingBundle.account_gross_margin_button}"
						action="#{report.onExecute}" actionListener="#{profitAndLossReport.onGenerateLists}">
						<f:param name="reportKey" value="profitAndLossGrossMargin" />
						<f:param name="outputFormat" value="PDF" />
					<f:setPropertyActionListener value="#{accountingBundle.account_gross_margin}" target="#{profitAndLossReport.graphName}" />
					</h:commandLink>
					
					<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{accountingBundle.accounting_profit_and_loss_module_net}"
						action="#{report.onExecute}" actionListener="#{profitAndLossReport.onNetExpenses}">
						<f:param name="reportKey" value="profitAndLossNetExpenses" />
						<f:param name="outputFormat" value="PDF" />
					<f:setPropertyActionListener value="#{accountingBundle.accounting_profit_and_loss_module_net_graph}" target="#{profitAndLossReport.graphName}" />
					</h:commandLink>
					
			<!-- 	<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{accountingBundle.accounting_profit_and_loss_module_month_graph}"
						action="#{report.onExecute}" >
						<f:param name="reportKey" value="profitAndLossMonthlyGraph" />
						<f:param name="outputFormat" value="PDF" />
					<f:setPropertyActionListener value="#{accountingBundle.accounting_profit_and_loss_module_month_graph}" target="#{profitAndLossReport.graphName}" />
					</h:commandLink> -->
					
				</ui:define>
			</ui:decorate>

			<aon:div id="accountData" styleClass="aon-scroll-area">

				<aon:div style="margin-bottom:0.75em;">
					<aon:panelGrid columns="6" style="width:100%;">
						<aon:outputLabel value="#{accountingBundle.accounting_period}" />
						<aon:outputText styleClass="aon-bold"
							value="#{profitAndLossReport.parameters.period.id}" />
							
						<aon:outputLabel
							value="#{bundle.aon_date_from}" />
						<aon:outputText 
							value="#{profitAndLossReport.parameters.fromDate}"
							timeZone="#{timeZoneController.timeZone}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
						</aon:outputText>
	
						<aon:outputLabel
							value="#{bundle.aon_date_to}" />
						<aon:outputText 
							value="#{profitAndLossReport.parameters.toDate}"
							timeZone="#{timeZoneController.timeZone}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"/>
						</aon:outputText>
					</aon:panelGrid>
				</aon:div>

				<aon:div>
					<aon:dataTable value="#{profitAndLossReport.controller}"
						var="controller">
	
						<f:facet name="header">
							<rich:columnGroup>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{accountBundle.account_account}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{bundle.aon_description}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{accountingBundle.accounting_debit_balance}" />
								</aon:column>
								<aon:column styleClass="aon-dataTable-header">
									<aon:outputText value="#{accountingBundle.accounting_credit_balance}" />
								</aon:column>
							</rich:columnGroup>
						</f:facet>
	
						<rich:subTable value="#{controller.grossMargin.sortedSummaryList}"
							var="to">
							<aon:column styleClass="aon-width-100">
								<aon:commandLink immediate="true"
									title="#{accountingBundle.accounting_statement_module}"
									styleClass="aon-dataTable-link" action="account_statement_list">
									<f:setPropertyActionListener value="#{to.id}"
										target="#{profitAndLossReport.accountStatement}" />
									<aon:actionListener method="#{profitAndLossReport.onStatement}" />
									<aon:outputText value="#{to.id}" />
									<f:setPropertyActionListener value="profit_and_loss_list"
										target="#{statement.backAction}" />
								</aon:commandLink>
							</aon:column>
	
							<aon:column>
								<aon:outputText value="#{to.description}" />
							</aon:column>
	
							<aon:column
								styleClass="aon-editDataTable-numberColumn aon-width-150">
								<aon:outputText value="#{to.unpaidBalance}" rendered="#{to.unpaidBalance != 0}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:column>
	
							<aon:column
								styleClass="aon-editDataTable-numberColumn aon-width-150">
								<aon:outputText value="#{to.creditBalance}" rendered="#{to.creditBalance != 0}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:column>
						</rich:subTable>
	
						<aon:column colspan="2" styleClass="aon-text-right">
							<aon:outputText value="#{accountingBundle.accounting_gross_margin}" />
						</aon:column>
						<aon:column styleClass="aon-text-right">
							<aon:outputText value="#{controller.grossMargin.unpaidBalance}" rendered="#{controller.grossMargin.unpaidBalance != 0}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>
						<aon:column styleClass="aon-text-right">
							<aon:outputText value="#{controller.grossMargin.creditBalance}" rendered="#{controller.grossMargin.creditBalance != 0}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>
	
						<rich:subTable value="#{controller.totalExpenses.sortedSummaryList}"
							var="to">
							<aon:column>
								<aon:commandLink immediate="true"
									title="#{accountingBundle.accounting_statement_module}"
									styleClass="aon-dataTable-link" action="account_statement_list">
									<f:setPropertyActionListener value="#{to.id}"
										target="#{profitAndLossReport.accountStatement}" />
									<aon:actionListener method="#{profitAndLossReport.onStatement}" />
									<aon:outputText value="#{to.id}" />
									<f:setPropertyActionListener value="profit_and_loss_list"
										target="#{statement.backAction}" />
								</aon:commandLink>
							</aon:column>
	
							<aon:column>
								<aon:outputText value="#{to.description}" />
							</aon:column>
	
							<aon:column styleClass="aon-editDataTable-numberColumn">
								<aon:outputText value="#{to.unpaidBalance}" rendered="#{to.unpaidBalance != 0}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:column>
	
							<aon:column styleClass="aon-editDataTable-numberColumn">
								<aon:outputText value="#{to.creditBalance}" rendered="#{to.creditBalance != 0}">
									<f:convertNumber pattern="#,##0.00" />
								</aon:outputText>
							</aon:column>
	
						</rich:subTable>
	
						<aon:column colspan="2" styleClass="aon-text-right">
							<aon:outputText value="#{accountingBundle.accounting_total_expenses}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<aon:outputText value="#{controller.totalExpenses.unpaidBalance}" rendered="#{controller.totalExpenses.unpaidBalance != 0}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<aon:outputText value="#{controller.totalExpenses.creditBalance}" rendered="#{controller.totalExpenses.creditBalance != 0}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>
	
						<aon:column breakBefore="true" colspan="2" styleClass="aon-text-right">
							<aon:outputText value="#{accountingBundle.accounting_total_result}" />
							<aon:outputText
								value=" ( #{accountingBundle.accounting_total_result_profit} )"
								rendered="#{profitAndLossReport.totalResult gt 0}" />
							<aon:outputText
								value=" ( #{accountingBundle.accounting_total_result_loss} )"
								rendered="#{profitAndLossReport.totalResult lt 0}" />
							<aon:outputText
								value=" ( #{accountingBundle.accounting_total_result_null} )"
								rendered="#{profitAndLossReport.totalResult == 0}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<aon:outputText value="#{profitAndLossReport.totalResult * (-1)}"
								rendered="#{profitAndLossReport.totalResult lt 0}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-numberColumn">
							<aon:outputText value="#{profitAndLossReport.totalResult}"
								rendered="#{profitAndLossReport.totalResult gt 0}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>
					</aon:dataTable>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
