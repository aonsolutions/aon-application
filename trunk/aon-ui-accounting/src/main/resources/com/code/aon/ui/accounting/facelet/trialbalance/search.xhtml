<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="trialBalanceForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{accountingBundle.accounting_trial_balance_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
				<ui:param name="skipClearButton" value="true" />
				
				<ui:define name="beforeToolbarContent">
					<aon:commandButton id="#{toolbarID}-clear"
							value="#{bundle.aon_clear}"
							actionListener="#{trialBalance.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
				</ui:define>
			</ui:decorate>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />
						
					<ui:include src="/com/code/aon/ui/accounting/facelet/trialbalance/searchContent.xhtml">
						<ui:param name="controller" value="#{trialBalance}" />
						<aon:methodParam name="action" value="trialBalance_list" />
					</ui:include>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
