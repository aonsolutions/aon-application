<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{accountManagerCustomer}" />
		<ui:param name="columnClasses" value="aon-editDataTable-textColumn" />
		<ui:define name="columns">
			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="Customer_id" value="#{customerBundle.customer_customer}" />
				</f:facet>
				<aon:outputText rendered="#{formList}" value="#{to.accountDescription}" />
				<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml" >
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupTo" value="#{accountManagerCustomer.to.customer}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<aon:methodParam name="lookupChangeListener" value="#{accountManagerCustomer.customerChanged}" type="lookupChangeListener" />
				</ui:include>
				<f:facet name="footer">
					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml" >
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupTo" value="#{accountManagerCustomer.to.customer}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="lookupRendered" value="#{formNew}" />				
						<ui:param name="lookupSuffix" value="-New" />				
						<aon:methodParam name="lookupChangeListener" value="#{accountManagerCustomer.customerChanged}" type="lookupChangeListener" />
					</ui:include>
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
