<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{accountManagerPayMethodType}" />
		<ui:param name="columnClasses"
			value="aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
		<ui:param name="newCancelButtonReRender" value="accountManagerPayMethodTypeDiv" />
		<ui:define name="columns">

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="PayMethodTypeDetail_type" value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.payMethodTypeDetail.type}" rendered="#{formList}" />
				<aon:selectOneMenu id="PayMethodTypeDetail_type" rendered="#{formEdit}"
					required="true" value="#{accountManagerPayMethodType.to.payMethodTypeDetail.type}">
					<f:selectItems value="#{accountManagerPayMethodType.payMethodTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="PayMethodTypeDetail_type-New" rendered="#{formNew}"
						required="true" value="#{accountManagerPayMethodType.to.payMethodTypeDetail.type}">
						<f:selectItems value="#{accountManagerPayMethodType.payMethodTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="PayMethodTypeDetail_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.payMethodTypeDetail.description}" rendered="#{formList}" />
				<aon:inputText id="PayMethodTypeDetail_description" rendered="#{formEdit}" required="true" 
					size="50" value="#{accountManagerPayMethodType.to.payMethodTypeDetail.description}"/>
				<f:facet name="footer">
					<aon:inputText id="PayMethodTypeDetail_description-NEW" rendered="#{formNew}" required="true" 
						size="50" value="#{accountManagerPayMethodType.to.payMethodTypeDetail.description}"/>
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
