<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="calendarForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{calendarBundle.aon_calendar_menu}"  />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="controller" value="#{calendar}" />
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">
					<aon:outputLabel   value="#{calendarBundle.aon_calendar_calendar}" />		
					<aon:inputText id="PayMethod_name"  size="40"
						maxlength="32" value="#{calendar.to.description}" required="true" />
				</aon:panelGrid>
				<aon:div rendered="!#{calendar.new}" >
				<aon:panelTabSet  style="width:50%" >				
				<aon:panelTab label="#{calendarBundle.aon_calendar_holidays}">
						<ui:include src="grid.xhtml"  />							
				</aon:panelTab>
				<aon:panelTab label="#{calendarBundle.aon_calendar_period}">							
						<ui:include src="period_grid.xhtml"  />	
				</aon:panelTab>
				</aon:panelTabSet>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
