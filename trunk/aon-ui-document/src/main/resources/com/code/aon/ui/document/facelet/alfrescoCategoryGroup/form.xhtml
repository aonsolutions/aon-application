<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="alfrescoCategoryGroupForm">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{documentBundle.document_categoryGroup}" />
				<ui:param name="controller" value="#{alfrescoCategoryGroup}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" >
		
					<aon:outputLabel for="cm_name" value="#{bundle.aon_name}" />
					<aon:inputText id="cm_name" required="true"
						value="#{alfrescoCategoryGroup.to.name}" size="32"  maxlength="32" />

					<aon:outputLabel for="cm_description" value="#{bundle.aon_description}" />
					<aon:inputText id="cm_description"
						value="#{alfrescoCategoryGroup.to.description}" size="64" maxlength="64" />
									
				</aon:panelGrid>
		
				<aon:div styleClass="aon-margin-top" rendered="#{!alfrescoCategoryGroup.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputText value="#{documentBundle.document_categories}"/>
						</aon:div>
					</aon:div>
					
					<ui:include
						src="/com/code/aon/ui/document/facelet/alfrescoCategory/grid.xhtml" />
					
				</aon:div>
		
			</aon:div>

		</aon:form>

	</ui:define>
</ui:composition>
