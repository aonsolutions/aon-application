<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{processDetailTransition}" />
		
		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="ProcessDetailTransition_ProcessTransitionType" 
						value="#{groupwareBundle.groupware_process_transition_type}" />
				</f:facet>
				<aon:outputText value="#{to.processTransitionType.description}" rendered="#{formList}" />
				<aon:selectOneMenu id="ProcessDetailTransition_processTransitionType" 
					value="#{processDetailTransition.to.processTransitionType}"
					rendered="#{formEdit}" required="true">
					<f:selectItem itemValue="-" value="#{null}" />
					<f:selectItems value="#{groupWareCollections.processTransitionTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="ProcessDetailTransition_processTransitionType-New" 
						value="#{processDetailTransition.to.processTransitionType}"
						rendered="#{formNew}" required="true">
						<f:selectItem itemValue="-" value="#{null}" />
						<f:selectItems value="#{groupWareCollections.processTransitionTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn" colspan="3">
				<f:facet name="header">
					<aon:outputLabel for="ProcessDetailTransition_NextProcessDetail" 
						value="#{groupwareBundle.groupware_process_next_process}" />
				</f:facet>
				<aon:outputText value="#{to.nextProcessDetail.description}" rendered="#{formList}" />
				<aon:selectOneMenu for="ProcessDetailTransition_NextProcessDetail" 
					value="#{processDetailTransition.to.nextProcessDetail}"
					rendered="#{formEdit}" required="true">
					<f:selectItem itemValue="-" value="#{null}" />
					<f:selectItems value="#{processDetailTransition.availableProcessDetails}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu for="ProcessDetailTransition_NextProcessDetail-New" 
						value="#{processDetailTransition.to.nextProcessDetail}"
						rendered="#{formNew}" required="true">
						<f:selectItem itemValue="-" value="#{null}" />
						<f:selectItems value="#{processDetailTransition.availableProcessDetails}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
		</ui:define>
		
	</ui:decorate>
</ui:composition>
