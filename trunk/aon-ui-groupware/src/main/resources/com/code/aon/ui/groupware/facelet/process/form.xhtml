<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="processForm">

			<rich:layout id="layout">
				
				<rich:layoutPanel position="top" width="100">
					<ui:include src="/com/code/aon/ui/groupware/facelet/process/formContent.xhtml" />
				</rich:layoutPanel>
				
				<rich:layoutPanel position="left" width="25%">
					<c:if test="#{!process.new}">
						<ui:include src="/com/code/aon/ui/groupware/facelet/process/sidebar.xhtml" />
					</c:if> 
				</rich:layoutPanel>
				
				<rich:layoutPanel position="center" width="75%">
					<aon:div style="border: solid #DDDDDD 1px;background-color: #EFEFEF;">
						<c:if test="#{!process.new and processDetail.to != null}">
							<ui:include src="/com/code/aon/ui/groupware/facelet/process/processDetailForm.xhtml" />
						</c:if>
						<c:if test="#{!process.new and processDetail.to == null}">
							<aon:div styleClass="aon-text-center" style="height: 250px;margin-top: 50px; font-style: italic;">
								<aon:outputText value="#{groupwareBundle.groupware_process_detail_help}"/>
							</aon:div>
						</c:if>
					</aon:div>	
				</rich:layoutPanel>
			</rich:layout>
		</aon:form>
	</ui:define>
</ui:composition>
