<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="newAlarmWindow">
		<c:if test="#{alarm.showNewAlarmWindow}">
		
			<rich:modalPanel id="newAlarmhModalPanel"
				showWhenRendered="#{alarm.showNewAlarmWindow}"
				minWidth="480" minHeight="300">
				
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{groupwareBundle.groupware_alarm_new}" />
					</aon:div>
				</f:facet>
				
				<aon:form>
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div styleClass="aon-toolbar">
								<aon:commandButton id="save"
									title="#{bundle.aon_key_save_accelerator}"
									value="#{bundle.aon_save}"
									actionListener="#{alarm.accept}"
									styleClass="aon-finding-toolbar-item aon-icon-accept"
									accesskey="#{bundle.aon_key_save}" >
									<f:setPropertyActionListener value="#{false}"
										target="#{alarm.showNewAlarmWindow}" />									
									<rich:componentControl for="newAlarmhModalPanel"
										operation="hide" event="onclick" />
								</aon:commandButton>
								<aon:commandButton id="cancel"
									title="#{bundle.aon_key_cancel_accelerator}"
									value="#{bundle.aon_cancel}"
									immediate="true" reRender="aonStatus"
									styleClass="aon-finding-toolbar-item aon-icon-cancel"
									accesskey="#{bundle.aon_key_cancel}" >
									<aon:actionHotKey key="esc" />
									<f:setPropertyActionListener value="#{false}"
										target="#{alarm.showNewAlarmWindow}" />									
									<rich:componentControl for="newAlarmhModalPanel"
										operation="hide" event="onclick" />
								</aon:commandButton>
							</aon:div>
							
							<ui:include
								src="/com/code/aon/ui/groupware/facelet/alarm/formContent.xhtml" />
		
						</aon:div>
					</aon:div>
				</aon:form>
			</rich:modalPanel>
			
		</c:if>
	</aon:panelGroup>

</ui:composition>
