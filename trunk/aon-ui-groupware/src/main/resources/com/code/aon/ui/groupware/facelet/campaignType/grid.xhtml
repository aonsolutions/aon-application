<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="jobTypeList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{groupwareBundle.groupware_campaign_types}" />
					<ui:param name="controller" value="#{campaignType}" />
				</ui:include>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{campaignType}" />
						
						<ui:param name="columnClasses" value="aon-editDataTable-text" />

						<ui:define name="columns">
							
							<aon:column alias="CampaignType.description">
								<f:facet name="header">
									<aon:outputLabel for="CampaignType_description" value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}" rendered="#{formList}" />
								<aon:inputText id="CampaignType_description-Edit" rendered="#{formEdit}" size="40" 
									value="#{controller.to.description}" required="true" />
								<f:facet name="footer">
									<aon:inputText id="CampaignType_description-New" rendered="#{formNew}"
										value="#{controller.to.description}" required="#{true}" size="40" />
								</f:facet>
							</aon:column>
							
							<aon:column alias="CampaignType.active" styleClass="aon-editDataTable-textColumn aon-width-40">
								<f:facet name="header">
									<aon:outputLabel for="CampaignType_active" value="#{bundle.aon_active}" />
								</f:facet>
								<aon:outputText rendered="#{formList}" value="&#160;"
									styleClass="#{(to.active)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'} aon-padding-bottom" />
								<aon:selectBooleanCheckbox id="CampaignType_active" 
									rendered="#{formEdit}" value="#{controller.to.active}" />	
								<f:facet name="footer">
									<aon:selectBooleanCheckbox id="CampaignType_active-New" 
										rendered="#{formNew}" value="#{controller.to.active}" />	
								</f:facet>
							</aon:column>							
							
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
