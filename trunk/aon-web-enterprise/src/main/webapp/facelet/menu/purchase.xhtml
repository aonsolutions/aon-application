<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="purchaseMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column,aon-portlets-column">
	
					<aon:panelGroup>
						<aon:panel>
							<f:facet name="header">
								<aon:outputText value="Compras" />
							</f:facet>											
							<aon:div styleClass="aon-direct-access-list">
								<aon:div>
									<aon:commandLink disabled="true" 
										value="Pedidos" />
								</aon:div>
								<aon:div>
									<aon:commandLink disabled="true" 
										value="Albaranes" />
								</aon:div>
								<aon:div>
									<aon:commandLink disabled="true" 
										value="Facturas" />
								</aon:div>
							</aon:div>
						</aon:panel>
	
						<aon:panel>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_utilities}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div>
									<aon:commandLink disabled="true" 
										value="Propuesta de Pedidos" />
								</aon:div>
							</aon:div>
						</aon:panel>
					</aon:panelGroup>
	
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.menu_reports}"/>
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Compras Anuales" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Compras Mensuales" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Por Segmento Cliente y Cliente" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Por Categoría y Articulo" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Comparativa Periodos" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="Resumen 12 + 1" />
							</aon:div>
							<aon:div>
								<aon:commandLink disabled="true" 
									value="ABC" />
							</aon:div>
						</aon:div>
					</aon:panel>
					
				</aon:panelGrid>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
