<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="expensesMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:componentGroup
					family="javax.faces.Command"
					method="#{actionDenied.renderedCommand}">
					
					<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
						columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

						<aon:panelGroup>
							<h:panelGrid styleClass="aon-width-all"
								headerClass="aon-icon-expenses aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{productBundle.product_expense_module}"/>
								</f:facet>					
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="creditor" 
											action="creditor_search" actionListener="#{creditor.onEditSearch}"
											value="#{financeBundle.finance_creditor_module}" >
										</aon:commandLink>
									</aon:div>													
	 								<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseInvoiceManagement"
											action="expenseInvoice_search"
											actionListener="#{expenseInvoice.onEditSearch}"
											value="#{financeBundle.finance_expense_invoice_management_module}" />
									</aon:div>
	 								<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="undeductibleInvoiceManagement"
											action="undeductibleInvoice_search"
											actionListener="#{undeductibleInvoice.onEditSearch}"
											value="#{financeBundle.finance_undeductible_invoice_management_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="financePayment"
											action="finance_search"
											actionListener="#{finance.onEditSearchPayment}"
											value="#{financeBundle.finance_payment_module}" />
									</aon:div>									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="payMethod-expenses" 
											action="payMethod" 
											value="#{configBundle.config_paymethod_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="bank-expenses"
											action="bank"
											value="#{configBundle.config_bank_module}" />
									</aon:div>																											
								</aon:div>
							</h:panelGrid>
						
							<ui:include src="/facelet/menu/utility.xhtml" >
								<ui:param name="category" value="expenses" />
							</ui:include>
						
						</aon:panelGroup>						

						<h:panelGrid styleClass="aon-width-all"
							headerClass="aon-direct-access-panel aon-icon-general">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_general}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="expenseItem"
										action="expenseItem" 
										value="#{productBundle.product_expense_module}" />
								</aon:div>							
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="productCategory-expenses" 
										action="productCategory"
										value="#{productBundle.product_category_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="segment-expenses" 
										action="segment_form" 
										value="#{registryBundle.registry_segment_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="geotreeParent-expenses" 
										action="geotreeParent_list"	actionListener="#{geotreeParent.onSearch}"
										value="#{geozoneBundle.geozone_module}" />
								</aon:div>
							</aon:div>
						</h:panelGrid>

					</h:panelGrid>
					
				</aon:componentGroup>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
