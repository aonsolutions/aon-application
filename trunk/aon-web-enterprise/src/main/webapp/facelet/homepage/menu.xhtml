<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form>
		<aon:menuBar id="mainMenu">

			<aon:commandLink id="sales"
				value="#{appBundle.menu_sales}"
				action="sales" immediate="true"
				styleClass="aon-top-menu-item" />
			<aon:commandLink id="purchase"
				value="Compras"
				action="purchase" immediate="true"
				styleClass="aon-top-menu-item" />
			<aon:commandLink id="warehouse"
				value="#{warehouseBundle.warehouse_menu_group}"
				action="warehouse" immediate="true"
				styleClass="aon-top-menu-item" />
			<aon:commandLink id="treasury"
				value="#{financeBundle.finance_menu_group}"
				action="treasury" immediate="true"
				styleClass="aon-top-menu-item" />
			<!-- 
			<aon:commandLink id="accounting"
				value="#{accountingBundle.menu_accounting}"
				action="accounting" immediate="true"
				styleClass="aon-top-menu-item" />
			-->
			<aon:dropDownMenu value="#{accountingBundle.menu_accounting}">
				<aon:menuGroup value="#{accountingBundle.menu_masters}">
					<aon:menuItem value="#{accountingBundle.accounting_entry_module}"
						action="accountEntry_search" />
					<aon:menuSeparator />
					<aon:menuItem action="account_list"
						value="#{accountBundle.account_module}" />
					<aon:menuItem action="autConcept"
						value="#{accountingBundle.accounting_aut_concept_module}" />
					<aon:menuSeparator />
				</aon:menuGroup>

				<aon:menuGroup value="#{accountingBundle.menu_pred_entries}">
					<aon:menuItem actionListener="#{invoiceEntry.onReset}"
						action="account_invoice_entry"
						value="#{accountingBundle.accounting_entry_invoice_module}" />
					<aon:menuSeparator />
					<aon:menuItem actionListener="#{expenseEntry.onReset}"
						action="account_expense_entry"
						value="#{accountingBundle.accounting_expense_entry_module}" />
					<aon:menuItem actionListener="#{salaryEntry.onReset}"
						action="account_salary_entry"
						value="#{accountingBundle.accounting_salary_entry_module}" />
					<aon:menuItem actionListener="#{socialInsuranceEntry.onReset}"
						action="account_social_insurance_entry"
						value="#{accountingBundle.accounting_social_insurance_entry_module}" />
					<aon:menuSeparator />
					<aon:menuItem actionListener="#{loanEntry.onReset}"
						action="account_loan_entry"
						value="#{accountingBundle.accounting_loan_entry_module}" />
					<aon:menuItem actionListener="#{loanFeeEntry.onReset}"
						action="account_loan_fee_entry"
						value="#{accountingBundle.accounting_loan_fee_entry_module}" />
					<aon:menuSeparator />
					<aon:menuItem actionListener="#{leasingEntry.onReset}"
						action="account_leasing_entry"
						value="#{accountingBundle.accounting_leasing_entry_module}" />
					<aon:menuItem actionListener="#{leasingFeeEntry.onReset}"
						action="account_leasing_fee_entry"
						value="#{accountingBundle.accounting_leasing_fee_entry_module}" />
					<aon:menuSeparator />
					<aon:menuGroup value="#{accountingBundle.menu_end_period_entries}">
						<aon:menuItem action="accountOperatingEntry"
							value="#{accountingBundle.accounting_operating_entry_module}" />
						<aon:menuItem action="accountClosingEntry"
							value="#{accountingBundle.accounting_closing_entry_module}" />
						<aon:menuItem action="accountOpeningEntry"
							value="#{accountingBundle.accounting_opening_entry_module}" />
					</aon:menuGroup>
				</aon:menuGroup>

				<aon:menuGroup value="#{accountingBundle.menu_reports}">
					<aon:menuItem actionListener="#{trialBalance.onReset}"
						action="account_statement_search"
						value="#{accountingBundle.accounting_statement_module}" />
					<aon:menuSeparator />
					<aon:menuItem actionListener="#{journalReport.onReset}"
						action="journal_search"
						value="#{accountingBundle.accounting_journal_module}" />
					<aon:menuSeparator />
					<aon:menuItem actionListener="#{trialBalance.onReset}"
						action="trialBalance_search"
						value="#{accountingBundle.accounting_trial_balance_module}" />
					<aon:menuItem actionListener="#{profitAndLossReport.onEditSearch}"
						action="profit_and_loss_search"
						value="#{accountingBundle.accounting_profit_and_loss_module}" />
					<aon:menuSeparator />
					<aon:menuItem action="vat_report_search"
						actionListener="#{vatReport.onReset}"
						value="#{financeBundle.finance_vat_report_module}" />
					<aon:menuSeparator />
					<aon:menuGroup value="#{accountingBundle.menu_official_balances}">
						<aon:menuItem disabled="true"
							value="#{accountingBundle.accounting_profit_and_loss_module}" />
						<aon:menuItem disabled="true"
							value="#{accountingBundle.accounting_balance_sheet_module}" />
					</aon:menuGroup>
				</aon:menuGroup>

				<aon:menuGroup value="#{accountingBundle.menu_fixed_assets}">
					<aon:menuItem style="color:red;" action="amortization_list"
						value="#{accountingBundle.accounting_amortization_form_module}" />
					<aon:menuSeparator />
					<aon:menuItem disabled="true"
						value="#{accountingBundle.accoung_amortization_report_module}" />
					<aon:menuItem disabled="true"
						value="#{accountingBundle.accoung_amortization_entries_module}" />
					<aon:menuSeparator />
					<aon:menuItem action="amortizationType_list"
						value="#{accountingBundle.accounting_amortization_type_module}" />
				</aon:menuGroup>

				<aon:menuGroup value="#{accountingBundle.menu_budget}">
					<aon:menuItem
						actionListener="#{budgetedProfitAndLossReport.onEditSearch}"
						action="budgeted_profit_and_loss_search"
						value="#{accountingBundle.accounting_budgeted_balance_sheet_module}" />
					<aon:menuItem disabled="true"
						value="#{accountingBundle.accounting_compared_budgeted_balance_sheet_module}" />
				</aon:menuGroup>
				<aon:menuGroup value="#{accountingBundle.menu_configuration}">
					<aon:menuSeparator />
					<aon:menuItem action="accPeriod"
						value="#{accountingBundle.accounting_period_module}" />
					<aon:menuItem action="defaultParams"
						actionListener="#{accAppParams.onLoad}"
						value="#{accountingBundle.accounting_default_params_module}" />
					<aon:menuSeparator />
					<aon:menuItem action="officialBalance_list"
						value="#{accountingBundle.accounting_official_balance_configuration_module}" />
					<aon:menuSeparator />
					<aon:menuItem action="regenerateAccountSummary"
						value="#{accountingBundle.accounting_regenerate_summary_module}" />
				</aon:menuGroup>
			</aon:dropDownMenu>
			
			<aon:commandLink id="config"
				value="#{appBundle.menu_configuration}"
				action="config" immediate="true"
				styleClass="aon-top-menu-item" />
 		</aon:menuBar>
	</aon:form>
 </ui:composition>
