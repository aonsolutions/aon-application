<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form>
		<aon:menuBar id="mainMenu">
			<aon:dropDownMenu value="#{appBundle.menu_master}">
				<aon:menuItem value="#{customerBundle.customer_module}" action="customer_search" actionListener="#{customer.onEditSearch}" />
				<aon:menuItem value="#{supplierBundle.supplier_module}" action="supplier_search" actionListener="#{supplier.onEditSearch}" />
				<aon:menuItem value="#{productBundle.product_module}" action="item_search" actionListener="#{item.onEditSearch}" />
				<aon:menuItem id="target"
					value="#{commercialBundle.commercial_target_module}" action="target_search" actionListener="#{target.onEditSearch}" />
				<aon:menuItem id="seller"
					value="#{salesBundle.sales_seller_module}" action="seller_search" actionListener="#{seller.onEditSearch}" />
			</aon:dropDownMenu>		 

			<aon:dropDownMenu value="#{appBundle.menu_auxiliar}">
				<aon:menuItem value="#{productBundle.product_category_module}" action="productCategory" />			
				<aon:menuItem value="#{financeBundle.finance_creditor_module}" action="creditor_search" actionListener="#{creditor.onEditSearch}" />
				<aon:menuItem value="#{productBundle.product_brand_module}" action="brand" />
				<aon:menuItem value="#{productBundle.product_catalogue_module}" action="catalogue_search" actionListener="#{catalogue.onEditSearch}" />
				<aon:menuItem value="#{productBundle.product_tariff_module}" action="tariff_list" actionListener="#{tariff.onSearch}" />
				<aon:menuSeparator/>
				<aon:menuItem id="commercialActivity" 
					value="#{commercialBundle.commercial_activity_module}" action="commercialActivity" actionListener="#{commercialActivity.onSearch}" />				
				<aon:menuItem id="commercialSegment"
					value="#{commercialBundle.commercial_segment_module}" action="commercialSegment" actionListener="#{commercialSegment.onSearch}" />
				<aon:menuSeparator/>
				<aon:menuItem id="warehouse" 
					value="#{warehouseBundle.warehouse_warehouse_module}" action="warehouse" actionListener="#{warehouse.onSearch}" />				
			</aon:dropDownMenu>

			<aon:dropDownMenu value="#{appBundle.menu_sales}">
				<aon:menuItem value="#{commercialBundle.commercial_offer_module}" action="offer_form" actionListener="#{offer.onReset}" />
				<aon:menuItem id="aon_invoice_management"
					value="#{financeBundle.finance_sale_invoice_management_module}" 
					actionListener="#{saleInvoice.onEditSearch}"
					action="saleInvoice_search"/>
			</aon:dropDownMenu>

			<aon:dropDownMenu id="inventory" value="#{warehouseBundle.warehouse_inventory_module}">
				<aon:menuItem id="inventory_remake"
					style="color:red;"
					value="#{warehouseBundle.warehouse_inventory_remake_module}" action="inventoryClose">
					<aon:actionListener method="#{inventory.onStartClosing}"/>
				</aon:menuItem>
			</aon:dropDownMenu>
			
			<aon:dropDownMenu id="finance" value="#{financeBundle.finance_menu_group}">
				<aon:menuItem id="aon_finance"
					value="#{financeBundle.finance_finance_module}" action="finance_search">
					<aon:actionListener method="#{finance.onEditSearch}"/>
				</aon:menuItem>				
				<aon:menuItem id="aon_finance_return"
					value="#{financeBundle.finance_finance_return_module}" action="financeReturn_search">
					<aon:actionListener method="#{financeReturn.onEditSearch}"/>
				</aon:menuItem>				
				<aon:menuItem id="aon_finance_payment"
					value="#{financeBundle.finance_finance_payment_module}" action="financePayment_search">
					<aon:actionListener method="#{financePayment.onEditSearch}"/>
				</aon:menuItem>				
				<aon:menuItem id="aon_fbatch"
					value="#{financeBundle.finance_fbatch_module}" action="fbatch_search" >
					<aon:actionListener method="#{fbatch.onEditSearch}"/>
				</aon:menuItem>
				<aon:menuGroup id="aon_finance_utilities"
					value="#{financeBundle.finance_finance_utilities_module}">
					<aon:menuItem id="checks"
						value="#{financeBundle.finance_checking_module}" action="util_checking" />
				</aon:menuGroup>			
			</aon:dropDownMenu>			

			<aon:dropDownMenu value="#{accountingBundle.menu_accounting}">
				<aon:menuGroup value="#{accountingBundle.menu_masters}">
					<aon:menuItem value="#{accountingBundle.accounting_entry_module}"
						action="accountEntry_search" />
					<aon:menuSeparator />
					<aon:menuItem action="account_list"
						value="#{accountBundle.account_module}" />
					<aon:menuItem action="autConcept"
						value="#{accountingBundle.accounting_aut_concept_module}" />
					<aon:menuSeparator />
				</aon:menuGroup>

				<aon:menuGroup value="#{accountingBundle.menu_pred_entries}">
					<aon:menuItem actionListener="#{invoiceEntry.onReset}"
						action="account_invoice_entry"
						value="#{accountingBundle.accounting_entry_invoice_module}" />
					<aon:menuSeparator />
					<aon:menuItem actionListener="#{expenseEntry.onReset}"
						action="account_expense_entry"
						value="#{accountingBundle.accounting_expense_entry_module}" />
					<aon:menuItem actionListener="#{salaryEntry.onReset}"
						action="account_salary_entry"
						value="#{accountingBundle.accounting_salary_entry_module}" />
					<aon:menuItem actionListener="#{socialInsuranceEntry.onReset}"
						action="account_social_insurance_entry"
						value="#{accountingBundle.accounting_social_insurance_entry_module}" />
					<aon:menuSeparator />
					<aon:menuItem actionListener="#{loanEntry.onReset}"
						action="account_loan_entry"
						value="#{accountingBundle.accounting_loan_entry_module}" />
					<aon:menuItem actionListener="#{loanFeeEntry.onReset}"
						action="account_loan_fee_entry"
						value="#{accountingBundle.accounting_loan_fee_entry_module}" />
					<aon:menuSeparator />
					<aon:menuItem actionListener="#{leasingEntry.onReset}"
						action="account_leasing_entry"
						value="#{accountingBundle.accounting_leasing_entry_module}" />
					<aon:menuItem actionListener="#{leasingFeeEntry.onReset}"
						action="account_leasing_fee_entry"
						value="#{accountingBundle.accounting_leasing_fee_entry_module}" />
					<aon:menuSeparator />
					<aon:menuGroup value="#{accountingBundle.menu_end_period_entries}">
						<aon:menuItem action="accountOperatingEntry"
							value="#{accountingBundle.accounting_operating_entry_module}" />
						<aon:menuItem action="accountClosingEntry"
							value="#{accountingBundle.accounting_closing_entry_module}" />
						<aon:menuItem action="accountOpeningEntry"
							value="#{accountingBundle.accounting_opening_entry_module}" />
					</aon:menuGroup>
				</aon:menuGroup>

				<aon:menuGroup value="#{accountingBundle.menu_reports}">
					<aon:menuItem actionListener="#{trialBalance.onReset}"
						action="account_statement_search"
						value="#{accountingBundle.accounting_statement_module}" />
					<aon:menuSeparator />
					<aon:menuItem actionListener="#{journalReport.onReset}"
						action="journal_search"
						value="#{accountingBundle.accounting_journal_module}" />
					<aon:menuSeparator />
					<aon:menuItem actionListener="#{trialBalance.onReset}"
						action="trialBalance_search"
						value="#{accountingBundle.accounting_trial_balance_module}" />
					<aon:menuItem actionListener="#{profitAndLossReport.onEditSearch}"
						action="profit_and_loss_search"
						value="#{accountingBundle.accounting_profit_and_loss_module}" />
					<aon:menuSeparator />
					<aon:menuItem action="vat_report_search"
						actionListener="#{vatReport.onReset}"
						value="#{financeBundle.finance_vat_report_module}" />
					<aon:menuSeparator />
					<aon:menuGroup value="#{accountingBundle.menu_official_balances}">
						<aon:menuItem disabled="true"
							value="#{accountingBundle.accounting_profit_and_loss_module}" />
						<aon:menuItem disabled="true"
							value="#{accountingBundle.accounting_balance_sheet_module}" />
					</aon:menuGroup>
				</aon:menuGroup>

				<aon:menuGroup value="#{accountingBundle.menu_fixed_assets}">
					<aon:menuItem style="color:red;" action="amortization_list"
						value="#{accountingBundle.accounting_amortization_form_module}" />
					<aon:menuSeparator />
					<aon:menuItem disabled="true"
						value="#{accountingBundle.accoung_amortization_report_module}" />
					<aon:menuItem disabled="true"
						value="#{accountingBundle.accoung_amortization_entries_module}" />
					<aon:menuSeparator />
					<aon:menuItem action="amortizationType_list"
						value="#{accountingBundle.accounting_amortization_type_module}" />
				</aon:menuGroup>

				<aon:menuGroup value="#{accountingBundle.menu_budget}">
					<aon:menuItem
						actionListener="#{budgetedProfitAndLossReport.onEditSearch}"
						action="budgeted_profit_and_loss_search"
						value="#{accountingBundle.accounting_budgeted_balance_sheet_module}" />
					<aon:menuItem disabled="true"
						value="#{accountingBundle.accounting_compared_budgeted_balance_sheet_module}" />
				</aon:menuGroup>
				<aon:menuGroup value="#{accountingBundle.menu_configuration}">
					<aon:menuSeparator />
					<aon:menuItem action="accPeriod"
						value="#{accountingBundle.accounting_period_module}" />
					<aon:menuItem action="defaultParams"
						actionListener="#{accAppParams.onLoad}"
						value="#{accountingBundle.accounting_default_params_module}" />
					<aon:menuSeparator />
					<aon:menuItem action="officialBalance_list"
						value="#{accountingBundle.accounting_official_balance_configuration_module}" />
					<aon:menuSeparator />
					<aon:menuItem action="regenerateAccountSummary"
						value="#{accountingBundle.accounting_regenerate_summary_module}" />
				</aon:menuGroup>
			</aon:dropDownMenu>

			<aon:dropDownMenu value="#{appBundle.menu_configuration}">
				<aon:menuItem value="#{companyBundle.company_data_module}" action="company" actionListener="#{company.onLoad}" />
				<aon:menuItem value="#{companyBundle.company_workplace_module}" action="workplace" />
				<aon:menuSeparator/>
				<aon:menuItem value="#{configBundle.config_tax_module}" action="tax" />
				<aon:menuItem value="#{configBundle.config_series_module}" action="series" />
				<aon:menuItem value="#{geozoneBundle.geozone_module}" action="geotreeParent_list" actionListener="#{geotreeParent.onSearch}" />
				<aon:menuSeparator/>
				<aon:menuItem value="#{configBundle.config_paymethod_module}" action="payMethod" actionListener="#{payMethod.onSearch}" />
			</aon:dropDownMenu>
 		</aon:menuBar>
	</aon:form>
 </ui:composition>
