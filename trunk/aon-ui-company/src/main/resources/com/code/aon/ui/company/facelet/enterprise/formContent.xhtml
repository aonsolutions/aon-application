<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
	
	<ui:decorate template="/com/code/aon/ui/registry/facelet/registry/formContentEx.xhtml">
		<ui:param name="skipSecurityPanel" value="true"/>
		
		<ui:define name="dataPanel">

			<aon:outputLabel for="Enterprise_scope_id" value="#{bundle.aon_scope}" />
			<aon:selectOneMenu id="Enterprise_scope_id" value="#{controller.to.scope}">
				<f:selectItems value="#{configCollections.currentUserScopes}" />
			</aon:selectOneMenu>
								
			<ui:include src="/com/code/aon/ui/registry/facelet/raddress/form.xhtml" />
				
			<ui:include src="/com/code/aon/ui/registry/facelet/rmedia/view.xhtml" />
			
		</ui:define>
		
		<ui:define name="logoPanel">
			<a4j:mediaOutput element="img" cacheable="false"
				style="width: 100px;" value="#{company.aonFile.key}"
				rendered="#{controller.aonFile.size > 0}"
				mimeType="#{controller.aonFile.mimeType}"
				createContent="#{controller.createCurrentLogoContent}">
			</a4j:mediaOutput>
			<aon:fileUpload id="attach_file"
				fileUploadListener="#{controller.fileUploaded}" >
				<f:facet name="label">
					<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
				</f:facet>
				<a4j:support event="onuploadcomplete" reRender="attachGrid" />
			</aon:fileUpload>
		</ui:define>
		
		<ui:define name="othersPanel">
			<ui:include src="/com/code/aon/ui/company/facelet/enterprise/formOtherContent.xhtml" />
			
			<ui:include src="/com/code/aon/ui/company/facelet/enterprise/formParamsContent.xhtml" />
		</ui:define>
		
	</ui:decorate>
	
</ui:composition>
