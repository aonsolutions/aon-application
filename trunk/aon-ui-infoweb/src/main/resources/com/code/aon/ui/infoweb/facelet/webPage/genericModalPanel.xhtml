<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelGroup id="showGenericModalPanel">
		<c:if test="#{webPage.showGenericModalPanel}">
			<rich:modalPanel id="genericModalPanel"
				rendered="#{webPage.showGenericModalPanel}" showWhenRendered="true"
				minHeight="600" height="600" minWidth="770" width="770">

				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{infowebBundle.infoweb_page_generic}" />
					</aon:div>
				</f:facet>				
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							reRender="showGenericModalPanel" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener target="#{webPage.showGenericModalPanel}" value="#{false}" />
							<rich:componentControl for="genericModalPanel" operation="hide" event="onclick" />
						</aon:commandButton>
					</aon:form>
				</f:facet>

				<aon:form id="pagesGenericForm">

					<rich:panel>

						<aon:div styleClass="aon-toolbar">
							<aon:commandButton id="saveg" value="#{bundle.aon_save}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								actionListener="#{webPage.onAcceptDetail}">
								<f:setPropertyActionListener
									target="#{webPage.showGenericModalPanel}" value="#{false}" />
								<rich:componentControl for="genericModalPanel" operation="hide"
									event="onclick" />
							</aon:commandButton>
							<aon:commandButton id="closeDocument"
								reRender="aonStatus" value="#{bundle.aon_close}" immediate="true"
								styleClass="aon-finding-toolbar-item aon-icon-cancel">
								<f:setPropertyActionListener
									target="#{webPage.showGenericModalPanel}" value="#{false}" />
								<rich:componentControl for="genericModalPanel" operation="hide"
									event="onclick" />
							</aon:commandButton>
						</aon:div>

						<aon:div id="genericDetail">
							<aon:panelGrid columns="2" dir="true">

								<aon:outputLabel for="Generic_title"
									value="#{infowebBundle.infoweb_page_title}" />
								<aon:inputText id="Generic_title" size="80" maxlength="255"
									value="#{webPage.detail.title}" />

								<aon:outputLabel for="Generic_layout"
									value="#{infowebBundle.infoweb_page_layout}" />
								<aon:selectOneMenu id="Generic_layout"
									value="#{webPage.detail.layout}">
									<f:selectItems value="#{webinfoCollections.layoutTypes}" />
								</aon:selectOneMenu>

								<aon:outputLabel for="Generic_content_richTextEnabled"
									value="#{infowebBundle.infoweb_page_rich_enable}" />
								<aon:selectBooleanCheckbox id="Generic_content_richTextEnabled"
									value="#{webPage.richTextEnabled}">
									<a4j:support ajaxSingle="true" event="onclick"
										reRender="genericDetail" />
								</aon:selectBooleanCheckbox>

								<aon:outputLabel for="Generic_content"
									value="#{infowebBundle.infoweb_page_content}" />
								<aon:inputTextarea id="Generic_content"
									rendered="#{!webPage.richTextEnabled}"
									value="#{webPage.detail.content}" cols="100" rows="12" />
								<aon:div style="width:600px"
									rendered="#{webPage.richTextEnabled}">
									<rich:editor 
										id="Generic_content-HTML" value="#{webPage.detail.content}"
										configuration="tinyMCE" height="280"
										language="#{facesContext.application.defaultLocale.language}" />
								</aon:div>

							</aon:panelGrid>
						</aon:div>

						<aon:div styleClass="aon-margin-top">
							<ui:include src="/com/code/aon/ui/infoweb/facelet/webPage/resourceGrid.xhtml" />
						</aon:div>

					</rich:panel>
				</aon:form>
									
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
