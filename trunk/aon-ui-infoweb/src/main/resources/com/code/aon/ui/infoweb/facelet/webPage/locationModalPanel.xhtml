<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelGroup id="showLocationModalPanel" styleClass="aon-popupWindow">
		<c:if test="#{webPage.showLocationModalPanel}">
			<rich:modalPanel id="locationModalPanel"
				rendered="#{webPage.showLocationModalPanel}" showWhenRendered="true"
				minHeight="190" height="190" minWidth="800" width="800">

				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{infowebBundle.infoweb_page_location}" />
					</aon:div>
				</f:facet>				
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							reRender="showLocationModalPanel" immediate="true">
							<f:setPropertyActionListener target="#{webPage.showLocationModalPanel}" value="#{false}" />
							<rich:componentControl for="locationModalPanel" operation="hide" event="onclick" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				
				<aon:form id="pagesLocationForm">
					<rich:panel>

						<aon:div styleClass="aon-toolbar">
							<aon:commandButton id="savel" value="#{bundle.aon_save}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								actionListener="#{webPage.onAcceptDetail}">
								<f:setPropertyActionListener target="#{webPage.showLocationModalPanel}" value="#{false}" />
								<rich:componentControl for="locationModalPanel" operation="hide" event="onclick" />
							</aon:commandButton>
							<aon:commandButton value="#{bundle.aon_close}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true" >
								<f:setPropertyActionListener target="#{webPage.showLocationModalPanel}" value="#{false}" />
								<rich:componentControl for="locationModalPanel" operation="hide" event="onclick" />
							</aon:commandButton>
							
						</aon:div>
	
						<aon:panelGrid columns="2" dir="true" >
					
							<aon:outputLabel for="Generic_extra" value="#{infowebBundle.infoweb_page_extra_coords}" />
							<aon:inputText id="Generic_extra" 
								size="70" maxlength="255" value="#{webPage.detail.extra}" />

							<aon:outputLabel value="&#160;" />
							<aon:div>
								<aon:outputText value="#{infowebBundle.infoweb_page_extra_coords_exp}. "/>
								<aon:outputText value=" #{infowebBundle.infoweb_page_extra_coords_exp2}"/>
							</aon:div>
						</aon:panelGrid>

					</rich:panel>
				</aon:form>	
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>
	
</ui:composition>
