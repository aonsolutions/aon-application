<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="content">

		<h:form id="companyForm" enctype="multipart/form-data">

			<t:div id="aon-content-menu" forceId="#{true}" styleClass="aon-content-menu" 
					rendered="#{!company.new}" >
				<t:panelGrid columns="2" cellpadding="0" cellspacing="0" border="0">
					<t:panelGroup>						
							<t:commandLink id="company_data" forceId="#{true}" value="#{rBundle.aon_company_data}" 
								styleClass="aon-content-menu-item-active"	/>					
					</t:panelGroup>	
					<t:panelGroup>						
							<t:commandLink id="company_schedule" forceId="#{true}" value="#{rBundle.aon_calendar_data}"
								actionListener="#{company.onSchedule}" action="company_calendar" 
								styleClass="aon-content-menu-item" />						
					</t:panelGroup>	
				</t:panelGrid>
			</t:div>

			<t:div id="aon-content-toolbar" forceId="#{true}" styleClass="aon-content-toolbar" >
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							actionListener="#{company.onAccept}" 
							onclick="return (confirm('#{bundle.aon_accept_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'" 
							disabled="#{companyAddress.to!=null}"
							accesskey="#{bundle.aon_key_save}"/>
					</t:div>
				</t:div>
			</t:div>

			<ui:include src="/facelet/configuration/company/content.xhtml" />

		</h:form>

	</ui:define>

</ui:composition>

</body>
</html>
