<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>
<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/formHead.xhtml" />
		<script>
			function enableData() {
				length_label = document.getElementById('incidencesForm:Incidence_length_label');
				length_id = document.getElementById('incidencesForm:Incidence_length');
				startTime_label = document.getElementById('incidencesForm:Incidence_startTime_label');
				startTime = document.getElementById('incidencesForm:Incidence_startTime');
				frecuency_label = document.getElementById('incidencesForm:Incidence_frecuency_label');
				frecuency = document.getElementById('incidencesForm:Incidence_frecuency');
				endDate_label = document.getElementById('incidencesForm:Incidence_endDate_label');
				endDate_div = document.getElementById('incidencesForm:Incidence_endDate_div');
				allday = document.getElementById('incidencesForm:Incidence_allday');
				if (allday.checked) {
					startTime_label.style.display='none'; 
					startTime.style.display='none'; 
					length_label.style.display='none'; 
					length_id.style.display='none'; 
					endDate_label.style.display='none';
					endDate_div.style.display='none';
					frecuency_label.style.display='none';
					frecuency.style.display='none';
				} else {
					startTime_label.style.display='block';
					startTime.style.display='block';
					frecuency_label.style.display='block';
					frecuency.style.display='block';
					if (frecuency.checked) {
						length_label.style.display='none'; 
						length_id.style.display='none'; 
						endDate_label.style.display='block';
						endDate_div.style.display='block';
					} else {
						length_label.style.display='block';
						length_id.style.display='block';
						endDate_label.style.display='none';
						endDate_div.style.display='none';
					}
				}
			}

			function enableStartTime(incidenceType) {
				checks = document.getElementById('incidencesForm:Incidence_checks');
				startTime_label = document.getElementById('incidencesForm:Incidence_startTime_label');
				startTime = document.getElementById('incidencesForm:Incidence_startTime');
				allday = document.getElementById('incidencesForm:Incidence_allday');
				if (incidenceType.options[incidenceType.selectedIndex].value == '9') {
					document.getElementById('incidencesForm:Incidence_frecuency').checked = false;
					allday.checked = false;
					enableData();
					startTime_label.style.display='none'; 
					startTime.style.display='none'; 
					checks.style.display='none'; 
				} else {
					if (!allday.checked) {
						startTime_label.style.display='block'; 
						startTime.style.display='block'; 
					}
					checks.style.display='block'; 
				}
			}
			
			// Este metodo se lanza al cargar la ventana.
			function loadInnerWindow() {
				enableData();
				incidenceType = document.getElementById('incidencesForm:Incidence_type');
				enableStartTime(incidenceType);
			}
		</script>
	</ui:define>

	<ui:define name="content">

		<h:form id="incidencesForm">

			<t:div styleClass="aon-content-menu-aux" >
				<h:outputText value="#{workplace.to.description}" />
			</t:div>

			<t:div id="aon-content-menu" forceId="#{true}" styleClass="aon-content-menu" rendered="#{!workplace.new}" >
				<t:panelGrid columns="4" cellpadding="0" cellspacing="0" border="0">
					<t:panelGroup>
							<t:commandLink id="workplace_data" forceId="#{true}" value="#{appBundle.aon_workplace_data}" 
								action="workplace_form" 
								styleClass="aon-content-menu-item" />
					</t:panelGroup>
					<t:panelGroup>
							<t:commandLink id="workplace_calendar" forceId="#{true}" value="#{rBundle.aon_calendar_data}"
								actionListener="#{workplace.onSchedule}" action="#{planner.calendarOutcome}" 
								styleClass="aon-content-menu-item" />
					</t:panelGroup>	
					<t:panelGroup>	
							<t:commandLink id="employee_incidences" forceId="#{true}" value="#{appBundle.aon_employee_incidences}"
								actionListener="#{incidences.onWorkPlace}" action="workplace_incidences" 
								styleClass="aon-content-menu-item-active" />
					</t:panelGroup>	
					<t:panelGroup>
							<t:commandLink id="workplace_hoursaday" forceId="#{true}" value="#{appBundle.aon_employee_hoursaday}"
								actionListener="#{weeklysummary.onInit}" action="workplace_hoursaday" 
								styleClass="aon-content-menu-item" />
					</t:panelGroup>	
				</t:panelGrid>
			</t:div>
		
			<!--  toolbar navigation -->
			<t:div id="aon-content-toolbar" forceId="#{true}" styleClass="aon-content-toolbar" >
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							actionListener="#{incidences.onAccept}" 
							forceId="#{true}"
							onclick="return (confirm('#{bundle.aon_accept_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'" 
							accesskey="#{bundle.aon_key_save}"/>
					</t:div>
				</t:div>
			</t:div>
		
			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<!-- start of bag panel -->
					<!-- start of flow layout -->
					<h:panelGrid columns="2" cellspacing="0" cellpadding="0" dir="true" 
								columnClasses="aon-form-table-column-odd-label, aon-form-table-mainColumn"> 

					   	<t:div style="padding:0em 1em 0 0;" >
						   	<t:div id="plannerNavigator" forceId="#{true}" style="border:#CCC 1px solid;padding:1em" >
						        <t:inputCalendar
						            monthYearRowClass="yearMonthHeader"
						            weekRowClass="weekHeader"
						            currentDayCellClass="currentDayCell"
						            value="#{incidences.date}"
						            valueChangeListener="#{incidences.calendarValueChanged}" />
							</t:div>
						</t:div>

						<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
									styleClass="aon-form-table"
									columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

							<h:outputLabel for="Incidence_startDate" styleClass="aon-form-input-text-label"
								value="#{appBundle.aon_start_date}" />
							<h:panelGroup id="Incidence_startDate" >
								<h:outputText value="#{incidences.to.startingDate}" styleClass="aon-datascroller-text" style="padding:0 0.5em;" >
									<f:convertDateTime type="date" pattern="EEE, d MMM yyyy" timeZone="ETC/GMT-2" />
								</h:outputText>
							</h:panelGroup>

							<h:outputLabel for="Incidence_resource" styleClass="aon-form-input-text-label"
								value="Empleado" />
							<h:selectOneMenu id="Incidence_resource" styleClass="aon-form-selectOneMenu-field"
									value="#{incidences.to.resource.id}" 
									valueChangeListener="#{incidences.resourceChanged}" >
								<f:selectItems value="#{incidences.resources}" />
							</h:selectOneMenu>

							<h:outputLabel for="Incidence_type" styleClass="aon-form-input-text-label"
								value="Tipo" />
							<h:selectOneMenu id="Incidence_type" styleClass="aon-form-selectOneMenu-field"
									value="#{incidences.to.incidenceType.id}" 
									valueChangeListener="#{incidences.incidenceTypeValueChanged}"
									onchange="enableStartTime(this);" >
								<f:selectItems value="#{employeeCollections.incidences}" />
							</h:selectOneMenu>

							<f:verbatim>&#160;</f:verbatim>
							<t:panelGrid id="Incidence_checks" columns="4" >
								<t:selectBooleanCheckbox id="Incidence_allday" styleClass="radio" 
									 value="#{incidences.allday}" onclick="enableData();" />
								<t:div style="padding-top:3px;">
									<h:outputLabel id="Incidence_allday_label" for="Incidence_allday" 
										value="Jornada Completa" styleClass="aon-form-input-text-label" />
								</t:div>
								<t:selectBooleanCheckbox id="Incidence_frecuency" styleClass="radio" 
									 value="#{incidences.frecuency}" onclick="enableData();" />
								<t:div style="padding-top:3px;">
									<h:outputLabel id="Incidence_frecuency_label" for="Incidence_frecuency" 
										value="Fecha Fin" styleClass="aon-form-input-text-label" />
								</t:div>
							</t:panelGrid >

							<h:outputLabel id="Incidence_startTime_label" for="Incidence_startTime" styleClass="aon-form-input-text-label"
								value="#{appBundle.aon_start_time}" />
							<h:panelGroup id="Incidence_startTime" >
								<h:selectOneMenu id="Init_hour" value="#{incidences.hour}">
									<f:selectItems value="#{incidences.hours}" />
								</h:selectOneMenu>
	
								<h:selectOneMenu id="Init_minute" value="#{incidences.minute}">
									<f:selectItems value="#{incidences.minutes}" />
								</h:selectOneMenu>
							</h:panelGroup>

							<h:outputLabel id="Incidence_length_label" for="Incidence_length" styleClass="aon-form-input-text-label" 
								value="#{appBundle.aon_length}" />
							<h:inputText id="Incidence_length" forceId="#{true}" styleClass="aon-form-input-text" size="4" 
								value="#{incidences.to.length}" />

							<h:outputLabel id="Incidence_endDate_label" forceId="#{true}" 
								for="Incidence_endDate_div" styleClass="aon-form-input-text-label"
								value="#{appBundle.aon_end_date}" style="display:none;" />
							<t:div id="Incidence_endDate_div" style="display:none;" >
								<t:inputCalendar size="8" id="Incidence_endDate"
										value="#{incidences.to.endingDate}"
										binding="#{incidences.endDate}"
										monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
										currentDayCellClass="currentDayCell"
										renderAsPopup="true" popupButtonStyleClass="aon-form-calendar-button"
										styleClass="aon-form-input-text" 
										popupTodayString="#{bundle.aon_popup_today}" 
										popupWeekString="#{bundle.aon_popup_week}" />	
							</t:div>

						</h:panelGrid>
					</h:panelGrid>
				</t:div>
			</t:div>
		
		</h:form>

	</ui:define>

</ui:composition>
</body>
</html>
