<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="sessionSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{auditBundle.audit_sessions_module}" />
				<ui:param name="controller" value="#{auditSession}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{auditSession}" />
				<ui:define name="searchContent">
					<aon:outputLabel for="Session_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Session_id" size="60"
						valueChangeListener="#{auditSession.addExpression}" />

					<aon:outputLabel for="Session_application_id"
						value="#{auditBundle.audit_application}" />
					<aon:selectOneMenu id="Session_application_id"
						valueChangeListener="#{auditSession.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{auditCollections.applications}" />
					</aon:selectOneMenu>					

					<aon:outputLabel value="#{bundle.aon_start_date}" />
					<aon:div>
						<aon:outputLabel for="Session_startDate-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Session_startDate-From"
							valueChangeListener="#{auditSession.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="Session_startDate-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Session_startDate-To"
							valueChangeListener="#{auditSession.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>

					<aon:outputLabel value="#{bundle.aon_end_date}" />
					<aon:div>
						<aon:outputLabel for="Session_endDate-From" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="Session_endDate-From"
							valueChangeListener="#{auditSession.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="Session_endDate-To" styleClass="aon-form-date-label"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="Session_endDate-To"
							valueChangeListener="#{auditSession.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>
					</aon:div>

					<aon:outputLabel for="Session_user_login"
						value="#{bundle.aon_login_user}" />
					<aon:inputText id="Session_user_login" size="60"
						valueChangeListener="#{auditSession.addExpression}" />
						
					<aon:outputLabel for="Session_remoteAddress"
						value="#{auditBundle.audit_session_remoteAddress}" />
					<aon:inputText id="Session_remoteAddress" size="60"
						valueChangeListener="#{auditSession.addExpression}" />

					<aon:outputLabel for="Session_remoteHost"
						value="#{auditBundle.audit_session_remoteHost}" />
					<aon:inputText id="Session_remoteHost" size="60"
						valueChangeListener="#{auditSession.addExpression}" />						
						
				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>
</ui:composition>
