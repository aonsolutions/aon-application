<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="domainForm">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{auditBundle.audit_domains_module}" />
				<ui:param name="controller" value="#{domain}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true" width="100%">
					<aon:outputLabel for="Domain_id"
						rendered="#{!domain.new}" value="#{bundle.aon_id}" />
					<aon:inputText id="Domain_id" value="#{domain.to.id}"
						rendered="#{!domain.new}" size="15" disabled="true" />
				
					<aon:outputLabel for="Domain_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="Domain_name" maxlength="64" required="true"
						value="#{domain.to.name}" size="64">
					</aon:inputText>
					
					<aon:outputLabel for="Domain_enableAudit"
						value="#{auditBundle.audit_domain_enable_audit}" />
					<aon:selectBooleanCheckbox id="Domain_enableAudit" 
						value="#{domain.to.enableAudit}" />
				</aon:panelGrid>
				
				<aon:panelTabSet rendered="#{!domain.new}" valueChangeListener="#{domain.tabChanged}">
					<aon:panelTab name="user" label="#{auditBundle.audit_users}">
						<ui:include src="/com/code/aon/ui/audit/facelet/user/tab_grid.xhtml" />
                    </aon:panelTab>

					<aon:panelTab name="domainApplication" label="#{auditBundle.audit_applications_module}">
						<ui:include src="/com/code/aon/ui/audit/facelet/domainApplication/tab_grid.xhtml" />
                    </aon:panelTab>
				</aon:panelTabSet>				
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
