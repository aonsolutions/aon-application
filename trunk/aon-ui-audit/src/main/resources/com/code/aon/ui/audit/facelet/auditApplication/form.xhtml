<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="applicationForm">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{auditBundle.audit_applications_module}" />
				<ui:param name="controller" value="#{auditApplication}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true" width="100%">
					<aon:outputLabel for="Application_id"
						rendered="#{!auditApplication.new}" value="#{bundle.aon_id}" />
					<aon:inputText id="Application_id" value="#{auditApplication.to.id}"
						rendered="#{!auditApplication.new}" size="15" disabled="true" />
				
					<aon:outputLabel for="Application_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="Application_name" maxlength="64"
						value="#{auditApplication.to.name}" size="64">
					</aon:inputText>
				</aon:panelGrid>
				
				<aon:div styleClass="aon-form-group" rendered="#{!seller.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="applicationActionData" value="#{auditBundle.audit_actions}" />
						</aon:div>
					</aon:div>
					<ui:include src="/com/code/aon/ui/audit/facelet/applicationAction/grid.xhtml"/>
				</aon:div>
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
