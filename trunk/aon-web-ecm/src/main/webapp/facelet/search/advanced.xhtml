<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">		
		<aon:div styleClass="aon-scroll-area">
			<aon:form id="searchForm" >

				<rich:panel style="padding:0" headerClass="outpanelHeader">
			        <f:facet name="header">
						<aon:outputText value="#{menuBundle.aon_search_advanced}" />
			        </f:facet>
			 		<aon:div styleClass="aon-section-toolbar">
						<aon:commandButton id="searchButton" value="#{menuBundle.aon_ecm_search}" 
							reRender="searchForm" 
							actionListener="#{search.onExecute}"
							styleClass="aon-content-toolbar-item aon-icon-accept" />

							<aon:div style="text-align:left;">
								
								<aon:div styleClass="aon-group">
									
									 <aon:div styleClass="aon-group-title" id="aon-content-subtitle" forceId="#{true}">
											<aon:outputLabel for="tree" value="#{appBundle.aon_search_title}" />
									 </aon:div>	
									
									<aon:div style="padding:0 1em;">
											
											<aon:panelGrid columns="2" dir="true"  cellpadding="0" cellspacing="0">
														<aon:div style="border-right:#ccc 1px solid;padding-right:1em;margin-right:1em;">
														<aon:panelGrid columns="1" dir="true" cellpadding="0" cellspacing="0">
															<aon:outputLabel for="document_allwords"
																value="#{appBundle.aon_search_allwords}" />
															<aon:inputText id="document_allwords"
																value="#{search.parameters.allwords}" size="50" />
								
															<aon:outputLabel for="document_phrase"
																value="#{appBundle.aon_search_phrase}" />
															<aon:inputText id="document_phrase"
																value="#{search.parameters.phrase}" size="50" />
								
															<aon:outputLabel for="document_somewords"
																value="#{appBundle.aon_search_somewords}" />
															<aon:inputText id="document_somewords"
																value="#{search.parameters.somewords}" size="50" />
								
															<aon:outputLabel for="document_nowords"
																value="#{appBundle.aon_search_nowords}" />
															<aon:inputText id="document_nowords"
																value="#{search.parameters.nowords}" size="50" />
														</aon:panelGrid>									
												</aon:div>
												
												<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
														cellpadding="0" cellspacing="0" columnClasses="aon-formTable-column-odd,aon-formTable-column-even">
													<aon:outputLabel for="document_language"
														value="#{appBundle.aon_search_language}" />
													<aon:selectOneMenu id="document_language" value="#{search.parameters.language}" >
														<f:selectItems value="#{search.parameters.languages}"/>
													</aon:selectOneMenu>
						
													<aon:outputLabel for="document_fileformat"
														value="#{appBundle.aon_search_fileformat}" />
													<aon:selectOneMenu id="document_fileformat" value="#{search.parameters.fileformat}" >
														<f:selectItems value="#{search.parameters.fileFormats}"/>
													</aon:selectOneMenu>
						
													<aon:outputLabel for="document_publishdate"
														value="#{appBundle.aon_search_publishdate}" />
													<aon:selectInputDate id="document_publishdate"
														value="#{search.parameters.publishDate}"
														renderAsPopup="true"/>
												</aon:panelGrid>									
										
											</aon:panelGrid>									
											
									</aon:div>	
								</aon:div>	
							</aon:div>		
						</aon:div>
					<ui:include src="/facelet/search/results.xhtml" />
				</rich:panel>
			</aon:form>
		</aon:div>

	</ui:define>
</ui:composition>

</body>
</html>
