<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-ice-components">
<body>

<ui:composition>

    <!-- panel popup code, modal type -->
    <ice:panelPopup id="folderPopupDiv"
                    rendered="true"
                    visible="#{manager.menu.showFolderModalPanel}"
                    modal="true"
                    styleClass="aon-popup-" 
                    style="width:25em;position:absolute;top:290px;left:15%;">

        <f:facet name="header">
        	<aon:div styleClass="aon-popup-title">  
        		
					<h:graphicImage styleClass="aon-panelPopup-logo"
						url="#{aonConfiguration.applicationLogoContextRelativePath}"
						alt="#{appBundle.aon_application_title}" />				
	            	<ice:outputText value="#{appBundle.aon_cdr_add_folder}"/>
	            
	        </aon:div>
        </f:facet>

        <f:facet name="body">
            <ice:panelGrid cellpadding="0" cellspacing="0">

				<aon:panelGrid columns="2" dir="true" >
	
					<aon:outputLabel for="folder_name"
						value="#{appBundle.aon_cdr_name}" />
					<aon:inputText id="folder_name"
						value="#{manager.folders.name}" size="45" />
	
				</aon:panelGrid>

				<aon:div style="text-align:right;">
		            <ice:panelGrid columns="2" cellpadding="0" cellspacing="0"
		            	columnClasses="aon-vertical-align-middle,aon-vertical-align-middle">
		                <ice:commandButton id="acceptFolder"
		                                   actionListener="#{manager.folders.add}"
		                                   value="Guardar"
		                                   styleClass="aon-form-button"
		                                   />
		                <ice:commandButton id="closeFolder"
		                                   actionListener="#{manager.onCloseModalPanel}"
		                                   value="Cerrar"
   		                                   styleClass="aon-form-button"
		                                   />
					</ice:panelGrid>
				</aon:div>
            </ice:panelGrid>
        </f:facet>

    </ice:panelPopup>

</ui:composition>

</body>
</html>
