<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>
<ui:composition>

	
		<rich:modalPanel id="folderModalPanel" top="100" left="200"
				minHeight="100" minWidth="100" height="100" width="400" zindex="1000"
				headerClass="aon-popupWindow-title">
			<f:facet name="header">
            	<h:outputText value="#{appBundle.aon_cdr_add_folder}"/>
			</f:facet>
			<f:facet name="controls">
				<h:graphicImage
					value="/aonResource/images/aon-icon/aon-icon-popupWindow-close.gif"
					style="cursor:pointer"
					onclick="Richfaces.hideModalPanel('folderModalPanel')" />
			</f:facet>
			<aon:form id="folderModalPanelForm">
					<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting">
						<aon:outputLabel for="folder_name" value="#{appBundle.aon_cdr_name}" />
						<aon:inputText id="folder_name" value="#{manager.folders.name}" size="45" />
					</aon:panelGrid>
					<aon:div style="text-align:right;">
			            <aon:panelGrid columns="2" cellpadding="0" cellspacing="0" 
			            styleClass="aon-panelGrid-formatting" style="width:auto">
							<h:commandButton id="acceptFolder" value="#{menuBundle.aon_ecm_accept}"
								actionListener="#{manager.folders.add}"
								reRender="tree"
								onclick="javascript:Richfaces.hideModalPanel('folderModalPanel')"
								styleClass="aon-commandButton" />
			                <h:commandButton id="closeFolder" value="#{menuBundle.aon_ecm_close}"
			                	actionListener="#{manager.onCloseModalPanel}"
								onclick="javascript:Richfaces.hideModalPanel('folderModalPanel')"
								styleClass="aon-commandButton" />
						</aon:panelGrid>
					</aon:div>
			</aon:form>
		</rich:modalPanel>
	

</ui:composition>
</body>
</html>
