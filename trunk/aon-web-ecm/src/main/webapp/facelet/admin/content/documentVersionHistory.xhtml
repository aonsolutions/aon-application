<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition>

	<aon:panelGrid columns="1" dir="true" 
			columnClasses="aon-text-left , aon-text-left"
			cellpadding="0" cellspacing="0"
			rendered="#{manager.documents.selected != null}" >

		<aon:dataTable id="docVersionList" 
				value="#{manager.documents.selected.versionHistory}" var="to"
				styleClass="aon-dataTable" style="font-size:1.1em;">

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_cdr_name}" />
				</f:facet>
				<aon:outputText value="#{to.UUID}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_cdr_entrydate}" />
				</f:facet>
				<aon:outputText value="#{to.created.time}">
					<f:convertDateTime pattern="dd/MM/yyyy"/>
				</aon:outputText>
				</aon:column>
		</aon:dataTable>

	</aon:panelGrid>

</ui:composition>

</body>
</html>
