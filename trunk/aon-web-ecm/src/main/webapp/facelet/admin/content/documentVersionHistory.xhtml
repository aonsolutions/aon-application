<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:panelGrid columns="1" dir="true" 
			columnClasses="aon-text-left , aon-text-left"
			cellpadding="0" cellspacing="0"
			rendered="#{manager.documents.selected != null}" >

		<aon:dataTable id="docVersionList" 
				value="#{manager.documents.versionHistoryModel}" var="to"
				styleClass="aon-dataTable" style="font-size:1.1em;" >

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="" />
				</f:facet>
				<aon:outputText style="display:inline;padding-left:16px;" 
					styleClass="#{(to.name == manager.documents.selected.version)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}" 
					value="&#160;" />
				<h:commandLink id="downloadVersion" value="|"
						title="#{menuBundle.aon_admin_document_download}"
						actionListener="#{manager.documents.downloadVersion}"
						styleClass="aon-icon-commandButton aon-icon-file-download"
						style="background-position:left 5px;"
						target="_blank" />
				<aon:commandButton id="restoreVersion"
					title="#{menuBundle.aon_version_restore}"
					actionListener="#{manager.documents.restoreVersion}"					
					styleClass="aon-icon-commandButton aon-icon-file-upload"
					style="background-position:left 5px;" 
					reRender="adminForm, docVersionList"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_cdr_version}" />
				</f:facet>
				<aon:outputText value="#{to.UUID}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_cdr_version}" />
				</f:facet>
				<aon:outputText value="#{to.name}"/>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_cdr_entrydate}" />
				</f:facet>
				<aon:outputText value="#{to.created.time}">
					<f:convertDateTime pattern="dd/MM/yyyy"/>
				</aon:outputText>
				</aon:column>
		</aon:dataTable>

	</aon:panelGrid>

</ui:composition>

</body>
</html>
