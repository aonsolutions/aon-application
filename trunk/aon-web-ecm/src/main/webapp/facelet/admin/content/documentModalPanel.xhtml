<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-ice-components">
<body>

<ui:composition>

    <!-- panel popup code, modal type -->
    <ice:panelPopup id="documentPopupDiv"
                    rendered="true"
                    visible="#{manager.menu.showDocumentModalPanel}"
                    modal="true"
                     styleClass="aon-popup-" 
                     style="width:43em;position:absolute;top:320px;left:20%;">


        <f:facet name="header">            
            <aon:div styleClass="aon-popup-title">  
        	 		
					<h:graphicImage styleClass="aon-panelPopup-logo"
						url="#{aonConfiguration.applicationLogoContextRelativePath}"
						alt="#{appBundle.aon_application_title}" />				
	            	<ice:outputText styleClass="popupTitle" value="#{appBundle.aon_cdr_add_document}"/>
	            
	        </aon:div>
        </f:facet>

        <f:facet name="body">
            <ice:panelGrid cellpadding="0" cellspacing="0" styleClass="popupModalBody" >
				<aon:panelGrid columns="1" dir="true" cellpadding="0" cellspacing="0"
				columnClasses="aon-bold, aon-text-left">
	
					<aon:outputLabel for="document_name"
						value="#{appBundle.aon_cdr_name}" />
					<aon:inputText id="document_name"
						value="#{manager.documents.upload.name}" size="100" />

					<aon:outputLabel for="document_keywords"
						value="#{appBundle.aon_cdr_keywords}" />
					<aon:inputText id="document_keywords"
						value="#{manager.documents.upload.keywords}" size="100" />

					<aon:outputLabel for="document_nowords"
						value="#{appBundle.aon_cdr_nowords}" />
					<aon:inputText id="document_nowords"
						value="#{manager.documents.upload.nowords}" size="100" />

					<aon:outputLabel for="document_category"
						value="#{appBundle.aon_cdr_category}" />
					<aon:inputText id="document_category"
						value="#{manager.documents.upload.category}" size="100" />				              
	               
				</aon:panelGrid>
				
				<aon:panelGrid columns="2" dir="true" cellpadding="0" cellspacing="0"
				columnClasses="aon-bold aon-padding-right, aon-text-left">
					
						<aon:outputLabel for="document_language"
							value="#{appBundle.aon_cdr_language}" />
						<aon:selectOneMenu id="document_language" 
								value="#{manager.documents.upload.language}" >
							<f:selectItems value="#{search.parameters.languages}"/>
						</aon:selectOneMenu>						
	              	
				</aon:panelGrid>
				
				<aon:div style="margin:0.5em 0;border:#fff 3px solid;background-color:#ccc 1px solid;
							padding:5px;">
						<ice:inputFile styleClass="aon-inputFile"
					      progressListener="#{manager.documents.upload.progress}"
	                      actionListener="#{manager.documents.upload.action}"/>
	             		<ice:outputProgress id="proDocument" value="#{manager.documents.upload.percent}"
	             		/>
	             </aon:div>

	              		
	            <ice:panelGrid columns="2" cellpadding="0" cellspacing="0" style="float:right">
	                <ice:commandButton id="acceptDocument"
	                                   actionListener="#{manager.onAddDocument}"
	                                   value="Guardar" 
	                                   styleClass="aon-form-button"/>
	                <ice:commandButton id="closeDocument"
	                                   actionListener="#{manager.onCloseModalPanel}"
	                                   value="Cerrar" 
	                                   styleClass="aon-form-button"/>
				</ice:panelGrid>

            </ice:panelGrid>
        </f:facet>

    </ice:panelPopup>

</ui:composition>

</body>
</html>
