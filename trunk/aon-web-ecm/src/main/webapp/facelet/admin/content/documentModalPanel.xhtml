<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>
<ui:composition>
<style>
.info {
    height: 320px;
    width: 97%;
    overflow: auto;
}
</style>

	
		<rich:modalPanel id="documentModalPanel" top="50" left="300"
				minHeight="100" minWidth="100" height="580" width="680" zindex="1000"
				headerClass="aon-popupWindow-title">
			<f:facet name="header">
            	<h:outputText value="#{appBundle.aon_cdr_add_document}"/>
			</f:facet>
			<f:facet name="controls">
				<h:graphicImage
					value="/aonResource/images/aon-icon/aon-icon-popupWindow-close.gif"
					style="cursor:pointer"
					onclick="Richfaces.hideModalPanel('documentModalPanel')" />
			</f:facet>
			<aon:form id="documentModalPanelForm">

				<rich:fileUpload id="upload" reRender="table"
						addControlLabel="#{menuBundle.aon_ecm_add}" 
						stopControlLabel="#{menuBundle.aon_ecm_stop}" 
						stopEntryControlLabel="#{menuBundle.aon_ecm_stop}"
						uploadControlLabel="#{menuBundle.aon_ecm_uploading}"
						fileUploadListener="#{manager.documents.upload.listener}"
						maxFilesQuantity="#{manager.documents.upload.uploadsAvailable}"
						immediateUpload="true" autoclear="true" listHeight="70px" listWidth="100%">
					<a4j:support event="onuploadcomplete" reRender="info, closeModalPanel" />
				</rich:fileUpload>

				<aon:div id="info" >
					<rich:panel bodyClass="info" rendered="#{manager.documents.upload.size>0}">
						<f:facet name="header" >
							<h:outputText value="#{appBundle.aon_cdr_index_title}" />
						</f:facet>

						<rich:dataGrid columns="1" value="#{manager.documents.upload.documents}"
							var="document" rowKeyVar="row" >

							<rich:simpleTogglePanel switchType="client" label="#{document.name}">
								<h:messages />   

								<aon:panelGrid columns="6" dir="true" cellpadding="0" cellspacing="0"
										columnClasses="aon-bold, aon-text-left,aon-bold, aon-text-left,aon-bold, aon-text-left" >
									<aon:outputLabel for="document_name"
										value="#{appBundle.aon_cdr_name}:" />
									<aon:inputText id="document_name"
										value="#{document.name}" size="30" />
<!-- 
									<aon:outputLabel for="document_category"
										value="#{appBundle.aon_cdr_category}:" style="margin-left:1em"/>
									<aon:selectOneMenu id="document_category" 
											value="#{document.category}" >
										<f:selectItems value="#{search.parameters.categories}"/>
									</aon:selectOneMenu>						

									<aon:outputLabel for="document_language"
										value="#{appBundle.aon_cdr_language}:" style="margin-left:1em" />
									<aon:selectOneMenu id="document_language" 
											value="#{document.language}" >
										<f:selectItems value="#{search.parameters.languages}"/>
									</aon:selectOneMenu>
	 -->		

								</aon:panelGrid>
				
								<aon:panelGrid columns="2" dir="true" cellpadding="0" cellspacing="0"
										columnClasses="aon-bold, aon-text-left" >
									<aon:outputLabel for="document_keywords"
										value="#{appBundle.aon_cdr_keywords}:" />
									<aon:inputText id="document_keywords"
										value="#{document.keywords}" size="70" />
				
									<aon:outputLabel for="document_nowords"
										value="#{appBundle.aon_cdr_nowords}:" />
									<aon:inputText id="document_nowords"
										value="#{document.nowords}" size="70" />
								</aon:panelGrid>
												
								<aon:div style="text-align:right;">
						            <aon:panelGrid columns="2" cellpadding="0" cellspacing="0" style="float:right">
						                <a4j:commandButton id="acceptDocument" value="#{appBundle.aon_cdr_index}"
						                	actionListener="#{manager.onAddDocument}" 
											reRender="documentModalPanelForm, documentPanel"
											styleClass="aon-form-button" >
								            <a4j:actionparam name="selected" value="#{row}" assignTo="#{manager.documents.upload.selected}"/>
								        </a4j:commandButton>
									</aon:panelGrid>
								</aon:div>
					        </rich:simpleTogglePanel>
						</rich:dataGrid>
					</rich:panel>
				</aon:div>

				<aon:div id="closeModalPanel" >
					<aon:div style="text-align:right;" rendered="#{manager.documents.upload.size>0}">
						<rich:spacer height="3"/>
						<br />
			            <aon:panelGrid style="float:right">
							<a4j:commandButton action="#{manager.documents.upload.clearUploadData}"
								reRender="info, closeModalPanel, upload" value="#{menuBundle.aon_ecm_close}"
								actionListener="#{manager.onCloseModalPanel}"
								onclick="javascript:Richfaces.hideModalPanel('documentModalPanel')"
								styleClass="aon-form-button"/>
						</aon:panelGrid>
					</aon:div>
				</aon:div>
			</aon:form>
		</rich:modalPanel>
	

</ui:composition>
</body>
</html>
