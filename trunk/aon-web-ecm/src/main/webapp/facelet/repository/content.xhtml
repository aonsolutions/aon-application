<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>
<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">
	
		<aon:div style="padding:0 5px;">		
			<aon:div styleClass="aon-section-title" style="padding-top:0;padding-left:1em;">
				<aon:outputText value="#{menuBundle.aon_ecm_repository}" />
			</aon:div>	

			<aon:form id="adminForm" >
				<aon:panelGrid style="width:100%" columns="2" styleClass="aon-panelGrid-formatting">

					<aon:div id="folderPanel">
						<aon:div styleClass="aon-toolbar">
							<aon:commandButton id="folderNew" value="" title="#{menuBundle.aon_ecm_add}"
								reRender="showFolderModalPanel"
								styleClass="aon-icon-commandButton aon-icon-newFolder"
								actionListener="#{manager.onNewFolder}" />
							<aon:commandButton id="folderDelete" value="" title="#{menuBundle.aon_ecm_delete}"
								reRender="folderPanel, documentPanel"
								actionListener="#{manager.folders.remove}"					
								styleClass="aon-icon-commandButton aon-icon-deleteFolder" />
						</aon:div> 
						<rich:tree id="tree" value="#{manager.folders.rootTreeNode}" var="item" 
								nodeFace="#{item.type}"
								nodeSelectListener="#{manager.folders.nodeSelected}"
								reRender="documentPanel"
								ajaxSubmitSelection="true"  
								switchType="ajax"
								styleClass="aon-tree aon-border">
				            <rich:treeNode type="folder" 
				            		iconLeaf="/aonResource/images/aon-icon/aon-icon-tree-inbox.png" 
				            		icon="/aonResource/images/aon-icon/aon-icon-tree-inbox.png">
				                <aon:outputText value="#{item.name}" />
				            </rich:treeNode>
						</rich:tree>
					</aon:div>

					<aon:div id="documentPanel" styleClass="aon-padding-left">
						<aon:div styleClass="aon-toolbar">

							<aon:commandButton id="documentAdd" value="#{menuBundle.aon_ecm_add}"
								title="#{menuBundle.aon_ecm_new}"
								reRender="showDocumentModalPanel"
								actionListener="#{manager.onNewDocument}"
								styleClass="aon-icon-commandButton aon-icon-reset" />

							<h:commandLink id="documentDownload"
								title="#{menuBundle.aon_admin_document_download}"
								actionListener="#{manager.documents.download}"
								styleClass="aon-icon-commandButton aon-icon-file-download"
								rendered="#{manager.menu.visible}" 
								target="_blank"
								value="#{menuBundle.aon_admin_document_download}"/>
	
							<aon:commandButton id="documentLock" 
								title="#{menuBundle.aon_admin_document_lock}"
								actionListener="#{manager.documents.lock}"					
								styleClass="aon-icon-commandButton aon-icon-document-lock"
								rendered="#{manager.menu.visible and !manager.documents.selected.locked}" 
								reRender="documentPanel"
								value="#{menuBundle.aon_admin_document_lock}" />
						
							<aon:commandButton id="documentUnlock"
								title="#{menuBundle.aon_admin_document_unlock}"
								actionListener="#{manager.documents.unlock}"					
								styleClass="aon-icon-commandButton aon-icon-document-unlock"
								rendered="#{manager.menu.visible and manager.documents.selected.locked}" 
								reRender="documentPanel"
								value="#{menuBundle.aon_admin_document_unlock}" />
							
							<aon:confirmButton id="documentDelete"
								title="#{menuBundle.aon_admin_document_delete}"
								confirmTitle="Confirmar" 
								confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{manager.documents.remove}"
								styleClass="aon-icon-commandButton aon-icon-delete"
								rendered="#{manager.menu.visible}" 
								reRender="documentPanel"
								value="#{menuBundle.aon_admin_document_delete}" />
		
							<aon:commandButton id="documentVersionCheckIn" 
								value="#{menuBundle.aon_version_checkin}"
								title="#{menuBundle.aon_version_checkin}"
								actionListener="#{manager.onStartCheckin}"
								styleClass="aon-icon-commandButton aon-icon-file-entrance"
								rendered="#{manager.menu.visible and manager.documents.checkedOut}" 
								reRender="showCheckinModalPanel" />
							
							<h:commandLink id="documentVersionCheckOut"
									title="#{menuBundle.aon_version_checkout}"
									actionListener="#{manager.documents.checkout}"
									styleClass="aon-icon-commandButton aon-icon-file-exit"
									rendered="#{manager.menu.visible and !manager.documents.checkedOut}"
									target="_blank"
									value="#{menuBundle.aon_version_checkout}" />
	
							<aon:commandButton id="restore"
								title="#{menuBundle.aon_version_uncheckout}"
								actionListener="#{manager.documents.restore}"
								styleClass="aon-icon-commandButton aon-icon-file-exit-cancel"
								rendered="#{manager.menu.visible and manager.documents.checkedOut}"
								reRender="documentPanel"
								value="#{menuBundle.aon_version_uncheckout}" />
						</aon:div>
						<aon:div>
							<aon:outputText id="path" value="#{manager.folders.selectedNode.node.path}/" />
							<aon:outputText value="#{manager.documents.selected.name}" styleClass="aon-bold" />
					
							<aon:dataTable id="docDataList" 
								value="#{manager.documents.model}" var="to"
								styleClass="aon-dataTable">									
								<aon:rowSelector actionListener="#{manager.documents.documentSelected}" 
									reRender="documentPanel"/>	
		
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_cdr_status}" />
									</f:facet>
									<aon:outputText value="#{to.status}"/>
								</aon:column>
		
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_cdr_name}" />
									</f:facet>
									<aon:outputText value="#{to.name}"/>
								</aon:column>
		
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_cdr_author}" />
									</f:facet>
									<aon:outputText value="#{to.author}"/>
								</aon:column>
		
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_cdr_version}" />
									</f:facet>
									<aon:outputText value="#{to.version}"/>
								</aon:column>
		
								<aon:column>
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aon_cdr_entrydate}" />
									</f:facet>
									<aon:outputText value="#{to.entryDate}">
										<f:convertDateTime pattern="dd/MM/yyyy"/>
									</aon:outputText>
								</aon:column>
							</aon:dataTable>
						</aon:div>
						<rich:tabPanel switchType="ajax" styleClass="aon-panelTabSet" 
									rendered="#{manager.documents.selected != null}" >
							<rich:tab label="#{menuBundle.aon_admin_document_properties}">
								<ui:include src="/facelet/repository/actions/documentProperties.xhtml" />	
							</rich:tab>
							<rich:tab label="#{menuBundle.aon_admin_document_versions}">
								<ui:include src="/facelet/repository/actions/documentVersionHistory.xhtml" />	
							</rich:tab>
						</rich:tabPanel>
					</aon:div>

				</aon:panelGrid>
			</aon:form>
		</aon:div>

		<ui:include src="/facelet/repository/actions/folderModalPanel.xhtml" />	
		<ui:include src="/facelet/repository/actions/documentModalPanel.xhtml" />	
		<ui:include src="/facelet/repository/actions/checkinModalPanel.xhtml" />
	</ui:define>

</ui:composition>
</body>
</html>
