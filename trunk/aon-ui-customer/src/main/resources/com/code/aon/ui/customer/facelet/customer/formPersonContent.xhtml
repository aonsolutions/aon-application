<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<c:if test="#{(aonConfiguration.bean.customer.showPerson) and (controller.to.registry.type == 'NATURAL')}">
		<aon:panelGrid columns="4" styleClass="aon-margin-top aon-width-all"
			columnClasses="aon-panelGrid-odd aon-width-140,
				aon-panelGrid-even aon-width-auto,
				aon-panelGrid-odd aon-width-120,
				aon-panelGrid-even aon-width-auto">
	
			<aon:outputLabel id="Person_birthDate_label" for="Person_birthDate"
				value="#{registryBundle.registry_person_birthDate}" />
			<aon:div>
				<aon:selectInputDate id="Person_birthDate"
					value="#{customerPersonListener.person.birthDate}"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
					<a4j:support event="onchanged" reRender="Person_ageDiv" ajaxSingle="true" />					
				</aon:selectInputDate>
				<aon:div id="Person_ageDiv" layout="inline">
					<aon:outputText rendered="#{customerPersonListener.person.birthDate != null}"
						value="#{customerPersonListener.years} #{bundle.aon_years}" />
				</aon:div>					
			</aon:div>
	
			<aon:outputLabel id="Person_gender_label" for="Person_gender"
				 value="#{registryBundle.registry_person_gender}" />
			<aon:selectOneMenu id="Person_gender" required="true"
				value="#{customerPersonListener.person.gender}">
				<f:selectItems value="#{registryCollections.genders}" />
			</aon:selectOneMenu>
			
			<aon:outputLabel id="Person_socialSecurityNumber_label" for="Person_socialSecurityNumber"
				value="#{registryBundle.registry_person_nss}" />
			<aon:inputText id="Person_socialSecurityNumber"
				value="#{customerPersonListener.person.socialSecurityNumber}" size="32" maxlength="32" />		
	
			<aon:outputLabel id="Person_maritalStatus_label" for="Person_maritalStatus"
				value="#{registryBundle.registry_person_marital_status}" />
			<aon:selectOneMenu id="Person_maritalStatus"
				value="#{customerPersonListener.person.maritalStatus}">
				<f:selectItems value="#{registryCollections.maritalStatuses}" />
			</aon:selectOneMenu>			
	
		</aon:panelGrid>
	</c:if>
	
</ui:composition>
