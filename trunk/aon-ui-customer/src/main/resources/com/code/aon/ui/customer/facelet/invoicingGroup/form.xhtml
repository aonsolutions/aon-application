<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="invoicingGroupForm">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{customerBundle.customer_invoicing_group_module}" />
				<ui:param name="controller" value="#{invoicingGroup}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-auto,
									aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Customer_id" value="#{customerBundle.customer_invoicing_group}" />
					<c:if test="#{invoicingGroup.new}">
						<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
							<ui:param name="lookupTo" value="#{invoicingGroup.to.customer}" />
							<ui:param name="idRequired" value="#{true}" />						
							<ui:param name="skipLabel" value="#{true}"/>
							<ui:param name="lookupReRender" value="InvoicingGroup_description" />
							<aon:methodParam name="lookupChangeListener"
								value="#{invoicingGroup.onCustomerChanged}" type="lookupChangeListener" />
						</ui:include>
					</c:if>
					<c:if test="#{!invoicingGroup.new}">
						<aon:div styleClass="aon-bold">
							<aon:outputText value="#{invoicingGroup.to.id}" />
							<aon:outputText value=" - " />
							<aon:outputText value="#{invoicingGroup.to.customer.registry.fullName}" />
							<aon:commandLink id="customer_link" immediate="true"
								styleClass="aon-button-goto aon-margin-left" style="padding-right: 20px;"
								value="&#160;" title="#{bundle.aon_go}"
								actionListener="#{invoicingGroup.onLoadCustomer}"
								action="customer_form"
								reRender="aonContent" />
						</aon:div>
					</c:if>

					<aon:outputLabel for="InvoicingGroup_description" value="#{bundle.aon_description}" />
					<aon:div>
						<aon:inputText id="InvoicingGroup_description" 
							value="#{invoicingGroup.to.description}"
							size="40" maxlength="64" />
						<aon:selectBooleanCheckbox id="InvoicingGroup_customerGrouped"
							styleClass="aon-margin-left"
							value="#{invoicingGroup.to.customerGrouped}" />
						<aon:outputLabel for="InvoicingGroup_customerGrouped" styleClass="aon-italic"
							value="#{customerBundle.customer_invoicing_group_customerGrouped}" />
					</aon:div>

				</aon:panelGrid>

				<c:if test="#{!invoicingGroup.new}">
					<aon:panelTabSet id="invoicingGroupTab" selectedTab="#{invoicingGroup.selectedTab}">
						<aon:panelTab id="customer" label="#{customerBundle.customer_invoicing_group_members}">
							<ui:include	src="/com/code/aon/ui/customer/facelet/invoicingGroup/gridCustomer.xhtml">
								<ui:param name="controller" value="#{invoicingGroupDetail}" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="customerFee" label="#{customerBundle.customer_invoicing_group_fees}">
							<ui:include	src="/com/code/aon/ui/customer/facelet/invoicingGroup/gridFee.xhtml">
								<ui:param name="controller" value="#{invoicingGroupFee}" />
							</ui:include>
						</aon:panelTab>
					</aon:panelTabSet>
				</c:if>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
	</ui:define>
</ui:composition>
