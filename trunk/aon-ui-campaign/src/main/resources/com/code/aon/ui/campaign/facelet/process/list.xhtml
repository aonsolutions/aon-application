<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="processList">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{campaignBundle.process_process}" />
				<ui:param name="controller" value="#{process}" />
			</ui:include>

			<aon:div id="taskTableContainer" styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:dataTable id="processDataList" value="#{process.model}"
						var="to" rows="20" rendered="#{process.model.rowCount > 0}">

						<aon:rowSelector actionListener="#{process.onSelect}"
							action="process_form" />

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>

					</aon:dataTable>
					<aon:dataScroller2 for="processDataList" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
