<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="processTransitionTypeList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{campaignBundle.aon_process_transition_type}" />
					<ui:param name="controller" value="#{processTransitionType}" />
				</ui:include>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{processTransitionType}" />
						<ui:param name="columnClasses"
							value="aon-editDataTable-text,aon-editDataTable-text" />

						<ui:define name="columns">
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.description}"
									rendered="#{to.id!=processTransitionType.to.id}" />
								<aon:inputText id="description_edit"
									rendered="#{to.id==processTransitionType.to.id}" size="40"
									value="#{processTransitionType.to.description}"
									required="true" />
								<f:facet name="footer">
									<aon:inputText id="description_new"
										rendered="#{processTransitionType.new}"
										value="#{processTransitionType.to.description}"
										required="#{true}" size="40" />
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
