<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="expenseMenu">

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column aon-width-400,aon-portlets-column aon-width-400">

					<aon:panel headerClass="aon-panel-title">
						<f:facet name="header">
							<aon:outputText value="#{appBundle.menu_expenses}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="expenseItem" 
									action="expenseItem" 
									value="#{productBundle.product_expense_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="creditor" 
									action="creditor_search" actionListener="#{creditor.onEditSearch}"
									value="#{financeBundle.finance_creditor_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="expenseInvoiceManagement"
									action="expenseInvoice_search" actionListener="#{expenseInvoice.onEditSearch}"
									value="#{financeBundle.finance_expense_invoice_management_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="undeductibleInvoiceManagement"
									action="undeductibleInvoice_search" actionListener="#{undeductibleInvoice.onEditSearch}"
									value="#{financeBundle.finance_undeductible_invoice_management_module}" />
							</aon:div>
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink id="aon_finance_payment"
									action="finance_search"	actionListener="#{finance.onEditSearchPayment}"
									value="#{financeBundle.finance_payment_module}" />
							</aon:div>
						</aon:div>
					</aon:panel>

					<ui:include src="/facelet/menu/general.xhtml" />

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
