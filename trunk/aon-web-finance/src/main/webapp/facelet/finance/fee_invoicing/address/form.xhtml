<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="feeInvoicingForm">

			<t:div id="aon-content-menu" styleClass="aon-content-menu-aux"
				forceId="#{true}" style="margin-left:16px;margin-right:16px;">
				<h:outputText
					value="#{feeInvoicing.to.series} / #{feeInvoicing.to.number}: #{feeInvoicing.to.registryName} #{feeInvoicing.to.registryDocument}" />
			</t:div>

			<t:div styleClass="aon-content-menu" rendered="#{!feeInvoicing.new}" id="aon-content-menu" forceId="#{true}">
				<t:panelGrid columns="2" cellpadding="0" cellspacing="0" border="0">
					<t:panelGroup>						
						<t:commandLink id="invoice_data" value="#{financeBundle.invoice_data}" immediate="true"
							action="fee_invoicing_form" styleClass="aon-content-menu-item" />					
					</t:panelGroup>	
					<t:panelGroup>						
						<t:commandLink id="invoice_address_data" value="#{financeBundle.invoice_address_data}"
							forceId="#{true}" styleClass="aon-content-menu-item-active"	/>					
					</t:panelGroup>	
				</t:panelGrid>
			</t:div>

			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" actionListener="#{feeInvoicingAddress.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							accesskey="#{bundle.aon_key_save}" />
						<t:commandButton id="remove" value="#{bundle.aon_remove}"
							actionListener="#{feeInvoicingAddress.onRemove}"
							action="fee_invoicing_form" forceId="#{true}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							disabled="#{feeInvoicingAddress.new}"
							accesskey="#{bundle.aon_key_remove}" />
					</t:div>
				</t:div>
			</t:div>
			
			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">

					<h:panelGrid columns="2" cellpadding="0" cellspacing="0"
						styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
						
						<t:outputLabel for="InvoiceAddress_address"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.invoice_address}" />
						<t:inputText id="InvoiceAddress_address" styleClass="aon-form-input-text"
							forceId="#{true}" value="#{feeInvoicingAddress.to.address}"
							size="45" maxlength="45" required="#{true}">
						</t:inputText>

						<t:outputLabel for="InvoiceAddress_address2"
							styleClass="aon-form-input-text-label"/>
						<t:inputText id="InvoiceAddress_address2" styleClass="aon-form-input-text"
							forceId="#{true}" value="#{feeInvoicingAddress.to.address2}"
							size="45" maxlength="45">
						</t:inputText>

						<t:outputLabel for="InvoiceAddress_zip"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.invoice_zip}" />
						<t:inputText id="InvoiceAddress_zip" styleClass="aon-form-input-text"
							forceId="#{true}" value="#{feeInvoicingAddress.to.zip}"
							size="16" maxlength="16" required="#{true}">
						</t:inputText>

						<t:outputLabel for="InvoiceAddress_city"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.invoice_city}" />
						<t:inputText id="InvoiceAddress_city" styleClass="aon-form-input-text"
							forceId="#{true}" value="#{feeInvoicingAddress.to.city}"
							size="45" maxlength="45" required="#{true}">
						</t:inputText>

						<t:outputLabel for="InvoiceAddress_geozone_id"
							styleClass="aon-form-input-text-label"
							value="#{financeBundle.invoice_geozone}" />
						<t:selectOneMenu id="InvoiceAddress_geozone_id"
							value="#{feeInvoicingAddress.to.geozone.id}"
							styleClass="aon-form-selectOneMenu-field">
							<f:selectItem itemValue="" itemLabel=" " />
							<f:selectItems value="#{geozoneCollections.geoTrees}" />
						</t:selectOneMenu>
						
					</h:panelGrid>
				</t:div>
			</t:div>		
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
