<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

		<t:div styleClass="aon-content-toolbar" forceId="#{true}" id="aon-content-toolbar">
			<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<t:commandButton id="reset" value="#{bundle.aon_reset}"
						actionListener="#{customerFee.onReset}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'" 
						accesskey="#{bundle.aon_key_new}"/>
				</t:div>
			</t:div>
		</t:div>

		<t:div styleClass="aon-table-hack">
			<t:dataTable id="customerFeeDataList" value="#{customerFee.model}" 
				rows="20" var="to" rowIndexVar="rowIndex"
				rowOnMouseOver="selectRow( this )"
				rowOnMouseOut="unselectRow( this )" 
				rowOnClick="sendRow( this )"
				styleClass="aon-table" headerClass="aon-table-header" footerClass="aon-table-footer"
				rowClasses="aon-table-row-odd,aon-table-row-even"
				columnClasses="aon-table-body aon-table-body-string,
					aon-table-body aon-table-body-number,
					aon-table-body aon-table-body-number,
					aon-table-body aon-table-body-number,
					aon-table-body aon-table-body-string,								
					aon-table-body aon-table-body-string,								
					aon-table-body aon-table-body-string,								
					aon-table-body aon-table-body-string,								
					aon-table-body aon-table-body-string,								
					aon-table-body aon-table-body-string">
	
				<t:column width="270">
					<f:facet name="header">
						<t:outputText value="#{customerBundle.fee_item}" />
					</f:facet>
					<t:outputText value="#{to.description}"/>
					<t:commandLink immediate="#{true}"  
						styleClass="aon-table-row-selected"
						actionListener="#{customerFee.onSelect}" />
					<f:verbatim>&#160;</f:verbatim>
				</t:column>
				
				<t:column width="30">
					<f:facet name="header">
						<h:outputText value="#{customerBundle.fee_quantity}" />
					</f:facet>
					<h:outputText value="#{to.quantity}">
						<f:convertNumber pattern="#,##0.00" />
					</h:outputText>	
				</t:column>
				
				<t:column width="70">
					<f:facet name="header">
						<h:outputText value="#{customerBundle.aon_customer_fee_price}" />
					</f:facet>
					<h:outputText value="#{to.price}" >
						<f:convertNumber pattern="#,##0.00" />
					</h:outputText>	
				</t:column>
				
				<t:column width="30">
					<f:facet name="header">
						<h:outputText value="#{customerBundle.fee_discount_expr}" />
					</f:facet>
					<h:outputText value="#{to.discountExpression.discountExpr}"/>
				</t:column>
				
				<t:column width="75">
					<f:facet name="header">
						<h:outputText value="#{customerBundle.aon_initial_date_abrv}" />
					</f:facet>
					<t:outputText value="#{to.initialDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</t:outputText>
				</t:column>
				
				<t:column width="75">
					<f:facet name="header">
						<h:outputText value="#{customerBundle.aon_final_date_abrv}" />
					</f:facet>
					<t:outputText value="#{to.finalDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</t:outputText>
				</t:column>
	
				<t:column width="105">
					<f:facet name="header">
						<h:outputText value="#{customerBundle.aon_billing_date_abrv}" />
					</f:facet>
					<h:outputText value="#{to.billingDateMonth}" />
					<h:outputText value=" / #{to.billingDateYear}" />
				</t:column>			
				
				<t:column width="70">
					<f:facet name="header">
						<h:outputText value="#{customerBundle.fee_period}" />
					</f:facet>
					<h:outputText value="#{to.period}" />
				</t:column>
				
				<t:column width="50">
					<f:facet name="header">
						<h:outputText value="#{customerBundle.security_level_abrv}" />
					</f:facet>
					<h:outputText value="#{to.securityLevel}" />
				</t:column>
				
				<t:column width="50">
					<f:facet name="header">
						<h:outputText value="#{customerBundle.aon_customer_fee_workplace_abrv}" />
					</f:facet>
					<h:outputText value="#{to.workPlace.description}" />
				</t:column>
				
			</t:dataTable>
		</t:div>	

		<ui:include src="/facelet/shared/dataScroller.xhtml">
			<ui:param name="dataTable" value="customerFeeDataList" />
			<ui:param name="model" value="#{customerFee.model}" />
			<ui:param name="showNote" value="#{true}" />
		</ui:include>

</ui:composition>
</body>
</html>
