<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form>
		<aon:menuBar id="mainMenu"> 
		
			<aon:commandLink id="customer" renderedOnUserRole="Clientes"
				value="#{customerBundle.customer_module}"
				action="customer_search" immediate="true"
				styleClass="aon-top-menu-item" >
				<aon:actionListener method="#{customer.onEditSearch}" />
			</aon:commandLink>
			<aon:commandLink id="supplier" renderedOnUserRole="Proveedores"
				value="#{supplierBundle.supplier_module}"
				action="supplier_search" immediate="true"
				styleClass="aon-top-menu-item" >
				<aon:actionListener method="#{supplier.onEditSearch}" />
			</aon:commandLink>
			<aon:dropDownMenu id="aon_invoice" 
				value="#{financeBundle.finance_invoice_module}">
				<aon:menuItem id="aon_invoice_management" renderedOnUserRole="FacturasVenta"
					value="#{financeBundle.finance_sale_invoice_management_module}" 
					actionListener="#{saleInvoice.onEditSearch}"
					action="saleInvoice_search"/>
				<aon:menuItem id="aon_purchase_invoice_management" renderedOnUserRole="FacturasCompra" 
					value="#{financeBundle.finance_purchase_invoice_management_module}" action="purchaseDirectInvoicing_search">
					<aon:actionListener method="#{purchaseDirectInvoicing.onEditSearch}"/>
				</aon:menuItem>
				<aon:menuItem id="aon_invoice_print" renderedOnUserRole="ImpresionFacturas"
					value="#{financeBundle.finance_invoice_print_module}" action="invoicePrint_search">
					<aon:actionListener method="#{invoicePrint.onEditSearch}"/>
				</aon:menuItem>
				<aon:menuItem id="aon_invoice_recording" renderedOnUserRole="ContabilizacionFacturas"
					value="#{financeBundle.finance_invoice_recording_module}" action="invoiceRecording_search">
					<aon:actionListener method="#{invoiceRecording.onEditSearch}"/>
				</aon:menuItem>
				<aon:menuItem id="aon_invoice_removing" renderedOnUserRole="BorradoFacturas"
					value="#{financeBundle.finance_invoice_removing_module}" action="invoiceRemover_search">
					<aon:actionListener method="#{invoiceRemover.onEditSearch}"/>
				</aon:menuItem>				
			</aon:dropDownMenu>
			<aon:dropDownMenu id="aon_fees"
				value="#{financeBundle.finance_fees_module}">
				<aon:menuItem id="aon_pre_invoicing" renderedOnUserRole="Prefacturacion" disabled="true"
					value="#{salesBundle.sales_pre_invoicing_module}" action="feePreInvoicing">
					<aon:actionListener method="#{preInvoicing.onInitialize}"/>
				</aon:menuItem>				
				<aon:menuItem id="aon_invoicing" renderedOnUserRole="FacturacionCuotas" disabled="true"
					value="#{salesBundle.sales_invoicing_module}" action="feeInvoicing">
					<aon:actionListener method="#{feeInvoicing.onInitialize}"/>
				</aon:menuItem>				
				<aon:menuItem id="aon_invoicing_group" renderedOnUserRole="GruposFacturacion"
					value="#{financeBundle.finance_invoicing_group_module}" action="invoicingGroup_list"/>
				<aon:menuItem id="aon_fee_print" renderedOnUserRole="ListadoCuotas"
					value="#{financeBundle.finance_fee_print_module}" action="feePrint_search">
					<aon:actionListener method="#{feePrint.onEditSearch}"/>
				</aon:menuItem>				
			</aon:dropDownMenu>
			<aon:dropDownMenu id="finance"
				value="#{financeBundle.finance_menu_group}">
				<aon:menuItem id="aon_finance" renderedOnUserRole="Vencimientos"
					value="#{financeBundle.finance_finance_module}" action="finance_search">
					<aon:actionListener method="#{finance.onEditSearch}"/>
				</aon:menuItem>				
				<aon:menuItem id="aon_finance_return" renderedOnUserRole="DevolucionVencimientos"
					value="#{financeBundle.finance_finance_return_module}" action="financeReturn_search">
					<aon:actionListener method="#{financeReturn.onEditSearch}"/>
				</aon:menuItem>				
				<aon:menuItem id="aon_finance_payment" renderedOnUserRole="GestionCartera"
					value="#{financeBundle.finance_finance_payment_module}" action="financePayment_search">
					<aon:actionListener method="#{financePayment.onEditSearch}"/>
				</aon:menuItem>				
				<aon:menuItem id="aon_fbatch" renderedOnUserRole="Remesas"
					value="#{financeBundle.finance_fbatch_module}" action="fbatch_search" >
					<aon:actionListener method="#{fbatch.onEditSearch}"/>
				</aon:menuItem>
				<aon:menuGroup id="aon_finance_utilities"
					value="#{financeBundle.finance_finance_utilities_module}">
					<aon:menuItem id="checks" renderedOnUserRole="ChecksTesoreria"
						value="#{financeBundle.finance_checking_module}" action="util_checking" />
				</aon:menuGroup>			
			</aon:dropDownMenu>
			<aon:dropDownMenu id="aon_auxiliar"
				value="#{financeBundle.finance_auxiliar_module}">
				<aon:menuGroup id="aon_invoicing_concepts"
					value="#{financeBundle.finance_invoicing_concepts_module}">
					<aon:menuItem id="aon_item" renderedOnUserRole="AuxiliaresProductos"
						value="#{productBundle.product_module}" action="item_search">
						<aon:actionListener method="#{item.onEditSearch}"/>
					</aon:menuItem>
					<aon:menuItem id="aon_product_category" renderedOnUserRole="AuxiliaresCategorias"
						value="#{productBundle.product_category_module}" action="productCategory" />
				</aon:menuGroup>
				<aon:menuItem id="aon_bank" renderedOnUserRole="AuxiliaresBancos"
					value="#{financeBundle.finance_banks}" action="bank" />
				<aon:menuItem id="aon_pay_method" renderedOnUserRole="AuxiliaresFormasDePago"
					value="#{financeBundle.finance_pay_methods}" action="payMethod" />
			</aon:dropDownMenu>			
			<aon:dropDownMenu id="aon_configuration" 
				value="#{financeBundle.finance_configuration_module}">
				<aon:menuItem id="aon_company" renderedOnUserRole="DatosEmpresa"
					value="#{companyBundle.company_data_module}" action="company">
					<aon:actionListener method="#{company.onLoad}"/>
				</aon:menuItem>
				<aon:menuItem id="aon_workplace" renderedOnUserRole="CentrosFormacion"
					value="#{companyBundle.company_workplace_module}" action="workplace">
					<aon:actionListener method="#{workplace.onSearch}"/>
				</aon:menuItem>
				<aon:menuItem id="aon_config_tax" renderedOnUserRole="ConfiguracionImpuestos"
					value="#{configBundle.config_tax_module}" action="tax" />
				<aon:menuItem id="aon_series" renderedOnUserRole="ConfiguracionSeries"
					value="#{configBundle.config_series_module}" action="series" />
				<aon:menuItem id="aon_geozone" renderedOnUserRole="ConfiguracionProvincias"
					value="#{geozoneBundle.geozone_module}" action="geotreeParent_list">
					<aon:actionListener method="#{geotreeParent.onSearch}"/>
				</aon:menuItem>
			</aon:dropDownMenu>			

		</aon:menuBar>
	</aon:form>
</ui:composition>
