<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form>
		<aon:menuBar id="mainMenu"> 
		
			<!-- role="Clientes" -->
			<aon:commandLink id="customer"
				value="#{customerBundle.customer_module}"
				action="customer" immediate="true"
				styleClass="aon-top-menu-item" >
				<aon:actionListener method="#{customer.onReset}" />
			</aon:commandLink>
			<!-- role="Proveedores" -->
			<aon:commandLink id="supplier"
				value="#{supplierBundle.supplier_module}"
				action="supplier" immediate="true"
				styleClass="aon-top-menu-item" >
				<aon:actionListener method="#{supplier.onReset}" />
			</aon:commandLink>
			<!-- role="MenuFacturas" -->
			<aon:dropDownMenu id="aon_invoice" value="#{accountBundle.account_entry_invoice_module}">
				<!-- role="FacturasVenta" -->
				<aon:menuItem id="aon_invoice_management"
					value="#{salesBundle.sales_invoice_management_module}" action="invoiceManagement"/>
				<!-- role="FacturasCompra" -->
				<aon:menuItem id="aon_purchase_invoice_management"
					value="#{financeBundle.finance_purchase_invoice_management_module}" action="purchaseInvoiceManagement"/>
				<!-- role="ImpresionFacturas" -->
				<aon:menuItem id="aon_invoice_print"
					value="#{financeBundle.finance_invoice_print_module}" action="invoicePrint">
					<f:actionListener action="#{invoicePrint.onEditSearch}"/>
				</aon:menuItem>
				<!-- role="ContabilizacionFacturas" -->
				<aon:menuItem id="aon_invoice_recording"
					value="#{financeBundle.finance_invoice_recording_module}" action="invoiceRecording">
					<f:actionListener action="#{invoiceRecording.onEditSearch}"/>
				</aon:menuItem>
				<!-- role="BorradoFacturas" -->
				<aon:menuItem id="aon_invoice_removing"
					value="#{financeBundle.finance_invoice_removing_module}" action="invoiceRemoving">
					<f:actionListener action="#{invoiceRemover.onEditSearch}"/>
				</aon:menuItem>				
			</aon:dropDownMenu>
			<!-- role="MenuCuotas" -->
			<aon:dropDownMenu id="aon_fees" value="#{financeBundle.finance_fees_module}">
				<!-- role="Prefacturacion" -->
				<aon:menuItem id="aon_pre_invoicing"
					value="#{salesBundle.sales_pre_invoicing_module}" action="feePreInvoicing">
					<f:actionListener action="#{preInvoicing.onInitialize}"/>
				</aon:menuItem>				
				<!-- role="FacturacionCuotas" -->
				<aon:menuItem id="aon_invoicing"
					value="#{salesBundle.sales_invoicing_module}" action="feeInvoicing">
					<f:actionListener action="#{feeInvoicing.onInitialize}"/>
				</aon:menuItem>				
				<!-- role="GruposFacturacion" -->
				<aon:menuItem id="aon_invoicing_group"
					value="#{financeBundle.finance_invoicing_group_module}" action="invoicingGroup"/>
				<!-- role="ListadoCuotas" -->
				<aon:menuItem id="aon_fee_print"
					value="#{financeBundle.finance_fee_print_module}" action="util_fee_print">
					<f:actionListener action="#{feePrint.onEditSearch}"/>
				</aon:menuItem>				
			</aon:dropDownMenu>
			<!-- role="MenuTesoreria" -->
			<aon:dropDownMenu id="finance" value="#{financeBundle.finance_menu_group}">
				<!-- role="Vencimientos" -->
				<aon:menuItem id="aon_finance"
					value="#{financeBundle.finance_finance_module}" action="finance">
					<f:actionListener action="#{finance.onEditSearch}"/>
				</aon:menuItem>				
				<!-- role="DevolucionVencimientos" -->
				<aon:menuItem id="aon_finance_return"
					value="#{financeBundle.finance_finance_return_module}" action="finance_return">
					<f:actionListener action="#{financeReturn.onEditSearch}"/>
				</aon:menuItem>				
				<!-- role="GestionCartera" -->
				<aon:menuItem id="aon_finance_payment"
					value="#{financeBundle.finance_finance_payment_module}" action="finance_payment">
					<f:actionListener action="#{financeReturn.onEditSearch}"/>
				</aon:menuItem>				
				<!-- role="Remesas" -->
				<aon:menuItem id="aon_fbatch"
					value="#{financeBundle.finance_fbatch_module}" action="fbatch" />
				<!-- role="MenuUtilidadesTesoreria" -->	
				<aon:menuGroup id="aon_finance_utilities" value="#{financeBundle.finance_finance_utilities_module}">
					<!-- role="ChecksTesoreria" -->
					<aon:menuItem id="checks"
						value="#{financeBundle.finance_checking_module}" action="util_checking" />
				</aon:menuGroup>			
			</aon:dropDownMenu>
			<!-- role="MenuAuxiliares" -->
			<aon:dropDownMenu id="aon_auxiliar" value="#{financeBundle.finance_auxiliar_module}">
				<!-- role="MenuAuxiliaresFacturacion" -->	
				<aon:menuGroup id="aon_invoicing_concepts" value="#{financeBundle.finance_invoicing_concepts_module}">
					<!-- role="AuxiliaresProductos" -->
					<aon:menuItem id="aon_item"
						value="#{financeBundle.finance_item_module}" action="item">
						<f:actionListener action="#{item.onReset}"/>
					</aon:menuItem>
					<!-- role="AuxiliaresCategorias" -->
					<aon:menuItem id="aon_product_category"
						value="#{financeBundle.finance_product_category_module}" action="productCategory" />
				</aon:menuGroup>
				<!-- role="AuxiliaresBancos" -->
				<aon:menuItem id="aon_bank"
					value="#{financeBundle.finance_banks}" action="bank" />
				<!-- role="AuxiliaresFormasDePago" -->
				<aon:menuItem id="aon_pay_method"
					value="#{financeBundle.finance_pay_methods}" action="payMethod" />
			</aon:dropDownMenu>			
			<!-- role="MenuConfiguracion" -->
			<aon:dropDownMenu id="aon_configuration" value="#{financeBundle.finance_configuration_module}">
				<!-- role="DatosEmpresa" -->
				<aon:menuItem id="aon_company"
					value="#{companyBundle.company_data_module}" action="company">
					<f:actionListener action="#{company.onLoad}"/>
				</aon:menuItem>
				<!-- role="CentrosFormacion" -->
				<aon:menuItem id="aon_workplace"
					value="#{companyBundle.company_workplace_module}" action="workplace">
					<f:actionListener action="#{workplace.onSearch}"/>
				</aon:menuItem>
				<!-- role="ConfiguracionImpuestos" -->
				<aon:menuItem id="aon_product_tax"
					value="#{productBundle.product_tax_module}" action="tax" />
				<!-- role="ConfiguracionSeries" -->
				<aon:menuItem id="aon_series"
					value="#{configBundle.config_series_module}" action="series" />
				<!-- role="ConfiguracionProvincias" -->
				<aon:menuItem id="aon_geozone"
					value="#{geozoneBundle.geozone_module}" action="geotreeParent_list">
					<f:actionListener action="#{geotreeParent.onSearch}"/>
				</aon:menuItem>
			</aon:dropDownMenu>			

		</aon:menuBar>
	</aon:form>
</ui:composition>
