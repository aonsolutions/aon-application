<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">
	<ui:define name="content">

		<h:form id="customerList">
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="customeFeeChecking"
							value="#{financeBundle.fee_checking}"
							onclick="submit();reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							accesskey="#{bundle.aon_key_print}" forceId="#{true}" />
					</t:div>
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="financeChecking"
							value="#{financeBundle.finance_checking}"
							onclick="submit();reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							accesskey="#{bundle.aon_key_print}" forceId="#{true}" />
					</t:div>
				</t:div>
			</t:div>
			
			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText value="#{financeBundle.finance_checking_print}" />
				</t:div>
			</t:div>
			
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="4" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even,aon-form-table-column-odd,aon-form-table-column-even">

							<h:outputLabel for="Customer_status"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_checking_customer_status}" />
							<h:selectOneMenu id="Customer_status"
								styleClass="aon-form-selectOneMenu-field"
								value="#{financePrint.customerStatus}"
								valueChangeListener="#{financePrint.onCustomerStatusChanged}">
								<f:selectItem itemValue="" itemLabel="-" itemDisabled="true" /> 
								<f:selectItems value="#{customerCollections.customerStatuses}" />
							</h:selectOneMenu>

							<h:outputLabel for="Finance_status"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_checking_finance_status}" />
							<h:selectOneMenu id="Finance_status"
								styleClass="aon-form-selectOneMenu-field"
								value="#{financePrint.financeStatus}"
								valueChangeListener="#{financePrint.onFinanceStatusChanged}">
								<f:selectItem itemValue="" itemLabel="-" itemDisabled="true" /> 
								<f:selectItems value="#{financeCollections.financeStatuses}" />
							</h:selectOneMenu>

					</h:panelGrid>

				</t:div>
			</t:div>
				
		</h:form>
		<h:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
