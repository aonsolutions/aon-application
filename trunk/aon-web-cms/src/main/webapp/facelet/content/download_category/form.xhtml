<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form" enctype="multipart/form-data">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.download_category}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{download_category.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							action="download_category_form"
							actionListener="#{download_category.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<h:commandButton id="save_new"
							value="#{bundle.aon_save}" 
							rendered="#{download_category.new}"
							action="download_category_form"
							actionListener="#{download_category.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<h:commandButton id="save_edit"
							value="#{bundle.aon_save}" 
							rendered="#{download_category.to!=null and !download_category.new}"
							actionListener="#{download_category.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!download_category.new}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{download_category.onRemove}"
							confirmAction="download_category_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<h:commandButton id="exit" value="#{bundle.aon_close}"
							action="download_category_list" 
							actionListener="#{download_category.onSearch}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}"/>
						<h:commandButton id="partial_generate"
							value="#{appBundle.aon_generate}" 
							rendered="#{download_category.to!=null}"
							actionListener="#{generator.onGenerateCurrentDownloadCategory}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>										
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="DownloadCategory_alias" style="width:100px"
						value="#{appBundle.download_category_alias}" />
					<aon:inputText id="DownloadCategory_alias"
						required="true" size="32" maxlength="32"
						value="#{download_category.to.alias}" />

					<aon:outputLabel for="DownloadCategoryDetail_label"
						value="#{appBundle.download_category_label}" />
					<aon:inputText id="DownloadCategoryDetail_label"
						required="true" size="50" maxlength="64"
						value="#{download_category.toI18n.label}" />

					<aon:outputLabel for="DownloadCategoryDetail_itemsPerPage"
						value="#{appBundle.album_items_per_page}" />
					<aon:inputText id="DownloadCategoryDetail_itemsPerPage"
						required="true" size="5" maxlength="5"
						value="#{download_category.to.itemsPerPage}" />
						
					<aon:outputLabel 
						value="#{appBundle.download_category_image}" />
					<aon:panelGroup id="thumbnail_preview">
						<aon:graphicImage 
							url="#{download_category.to.image}.thumbnail" 
							alt="#{download_category.to.image}"/>
		                <aon:commandLink
		                	immediate="#{true}"
		                	reRender="thumbnail_preview"
		                    actionListener="#{download_category.onDelImage}">
							<aon:graphicImage url="/images/cms/inactive.png" />
		        		</aon:commandLink>
						<ui:include src="/facelet/content/utils/image_modal.xhtml">
							<ui:param name="modalPanelName" value="mp" />
							<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
							<ui:param name="galleryBean" value="#{gallery}" />
							<ui:param name="listenerBean" value="#{download_category}" />
							<ui:param name="reRender" value="thumbnail_preview" />
							<ui:param name="image" value="#{true}" />
							<ui:param name="thumbnail" value="#{false}" />
						</ui:include>
		        	</aon:panelGroup>

					<aon:outputLabel for="DownloadCategory_section"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="DownloadCategory_section"  
						value="#{download_category.to.section.id}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
										
				</aon:panelGrid>
			</aon:div>
		
			<rich:panel id="detail_panel" rendered="#{!download_category.new and download_category.toI18n.id != null}">
				<f:facet name="header">#{appBundle.download}</f:facet>
				
				<aon:panelGrid columns="2" styleClass="none" columnClasses="aon-vertical-align-top,aon-vertical-align-top">
				
					<rich:panel id="detail_list_panel">
						<f:facet name="header">#{appBundle.aon_listing}</f:facet>
				
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<h:commandButton id="reset_list" value="#{bundle.aon_reset}"
										rendered="#{!download.new}"
										action="download_category_form"
										actionListener="#{download.onReset}"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}"/>
									<aon:confirmButton id="remove_list"
										value="#{bundle.aon_remove}" 
										rendered="#{!download.checklistEmpty and download.to==null}" 
										immediate="#{true}"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{download.onRemoveSelected}" 
										confirmAction="download_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>

						<aon:dataTable id="detail_list" value="#{download.model}" var="to"
							rows="#{download.pageLimit}"
							styleClass="dr-table rich-table aon-editDataTable"
							headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
							footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
							rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
							cellpadding="0" cellspacing="0"
							columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn">
									
							<aon:column>
								<f:facet name="header">
									<aon:div>
										&nbsp;
									</aon:div>	
								</f:facet>
								<aon:selectBooleanCheckbox 
										value="#{download.rowChecked}">
										<a4j:support 
											event="onclick"  
											reRender="detail_list,buttonsGrid_list" />
								</aon:selectBooleanCheckbox>
							</aon:column>
					
							<aon:column>
								<a4j:support 
									actionListener="#{download.onSelect}"
									event="onclick"
									immediate="#{true}"
									action="download_category_form" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.download_alias}" />
								</f:facet>
								<aon:outputText value="#{to.alias}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>

							<aon:column>
								<a4j:support 
									immediate="#{true}"
									actionListener="#{download.onSelect}"
									action="download_category_form"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.download_title}"/>
								</f:facet>
								<aon:outputText value="#{download.i18nTitle}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>
				
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.download_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.download_activate}" 
									actionListener="#{download.onActivate}"
									action="download_category_form"
									rendered="#{!to.active}">
									<aon:graphicImage alt="#{appBundle.download_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.download_deactivate}" 
									actionListener="#{download.onDeactivate}" 
									action="download_category_form"
									rendered="#{to.active}">
									<aon:graphicImage alt="#{appBundle.download_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>
				
							<aon:column>
								<f:facet name="header">
									<aon:outputText for="download_position" 
										value="#{appBundle.download_position}" />
								</f:facet>
								<aon:graphicImage rendered="#{to.position == 0}"
									url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
								<h:commandButton  
									action="download_category_form"
									actionListener="#{download.onMoveUp}" 
									rendered="#{to.position != 0 and download.to==null}"
									image="/images/cms/up.gif" styleClass="aon-icon-commandButton" />
								<h:commandButton 
									action="download_category_form"
									actionListener="#{download.onMoveDown}"
									rendered="#{to.position &lt; (download.model.rowCount - 1)  and download.to==null}"
									image="/images/cms/down.gif" styleClass="aon-icon-commandButton" />
							</aon:column>
				
						</aon:dataTable>
					</rich:panel>
					
					<rich:panel id="detail_edit_panel" rendered="#{download.new or download.to != null}">
        				<f:facet name="header">#{download.new?(bundle.aon_reset):(bundle.aon_editing)}</f:facet>

								<aon:div styleClass="aon-finding-title-toolbar">
									<aon:panelGrid id="buttonsGrid_list_form" columns="1" dir="true" 
										columnClasses="aon-finding-toolbar">				
										<aon:div styleClass="aon-finding-toolbar-item-group">
											<h:commandButton id="save_list_form"
												value="#{bundle.aon_save}" 
												rendered="#{download.to!=null or download.new}"
												action="download_category_form"
												actionListener="#{download.onAccept}"
												styleClass="aon-finding-toolbar-item aon-icon-accept"
												accesskey="#{bundle.aon_key_save}"/>
											<h:commandButton id="cancel_list_form"
												value="#{bundle.aon_cancel}" 
												rendered="#{download.to!=null or download.new}" immediate="#{true}"
												action="download_category_form"
												actionListener="#{download.onCancel}" 
												styleClass="aon-finding-toolbar-item aon-icon-cancel"
												accesskey="#{bundle.aon_key_cancel}"/>
											<aon:confirmButton id="remove_list_form"
												value="#{bundle.aon_remove}" rendered="#{!download.new}" 
												immediate="true"
												confirmAction="download_category_form"
												confirmTitle="Confirmation Dialog" 
												confirmMessage="#{bundle.aon_remove_confirm}"
												confirmActionListener="#{download.onRemove}" 
												styleClass="aon-finding-toolbar-item aon-icon-delete"
												accesskey="#{bundle.aon_key_remove}"/>
									    </aon:div>
										
									</aon:panelGrid>
								</aon:div>
					
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="detailOptionGrid" columns="2" dir="true">


										<aon:outputLabel for="Download_alias" style="width:100px"
											value="#{appBundle.download_alias}" />
										<aon:inputText id="Download_alias"
											required="true" size="32" maxlength="32"
											value="#{download.to.alias}" />
			
										<aon:outputLabel for="Download_publishDate"
											value="#{appBundle.download_publish_date}" />
										<aon:selectInputDate id="Download_publishDate" 
											 style="z-index:2001;margin:0;vertical-align:middle;"
											 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
											 value="#{download.to.publishDate}" renderAsPopup="true"
											 popupDateFormat="#{bundle.aon_date_pattern}">
											 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
										</aon:selectInputDate>	
			
										<aon:outputLabel 
											value="#{appBundle.download_file}" />
										<aon:panelGroup id="thumbnail_preview_detail">
											<aon:outputText value="#{download.toI18n.file}" />
												
											<a href="javascript:Richfaces.showModalPanel('mp_detail',{width:680, top:200})">select</a>
									        <rich:modalPanel  id="mp_detail" minHeight="200" minWidth="450" 
									            height="360" width="675" zindex="2000">
									            <f:facet name="header">
									                <h:outputText value="Modal Panel Title" />
									            </f:facet>
									            <f:facet name="controls">
									                <h:graphicImage value="/images/icefaces/popupclose.gif" style="cursor:pointer" onclick="Richfaces.hideModalPanel('mp_detail')" />
									            </f:facet>
												<h:panelGrid id="treeGrid_detail" columns="2">
										            <rich:panel bodyClass="body3">
													    <rich:tree style="width:300px"
													    	switchType="server" 
													    	stateAdvisor="#{treeStateAdvisor}">
													        <rich:recursiveTreeNodesAdaptor roots="#{fileSystemBean.documentRoots}" 
													        	var="item" 
													        	nodes="#{item.nodes}">
																<rich:treeNode>
													                <aon:commandLink
													                	action="#{item.onSelectFolder}" 
													                	value="#{item}"
													                	immediate="#{true}"
													                	reRender="treeGrid_detail" />
																</rich:treeNode>
													        </rich:recursiveTreeNodesAdaptor>
													    </rich:tree>
													</rich:panel>
										            <rich:panel bodyClass="body3">
														<aon:panelGroup>
															<aon:outputLabel value="#{document.currentRelativePath}" />
															<rich:dataList var="item" value="#{document.model}" >	
																<aon:panelGrid columns="2" cellpadding="5px" cellspacing="0px">
													                <aon:commandLink
													                	immediate="#{true}"
													                	reRender="thumbnail_preview_detail"
													                    actionListener="#{download.onSelectImage}"
													                    value="#{item.name}" />
																</aon:panelGrid>
															</rich:dataList>
														</aon:panelGroup>
													</rich:panel>
												</h:panelGrid>		
									        </rich:modalPanel>													
							        	</aon:panelGroup>
		        	
										<aon:outputLabel for="DownloadDetail_title"
											value="#{appBundle.download_title}" />
										<aon:inputText id="DownloadDetail_title"
											required="true" size="60" maxlength="128"
											value="#{download.toI18n.title}" />
			
										<aon:outputLabel for="DownloadDetail_description"
											value="#{appBundle.download_description}" />
										<aon:div style="width:400px">
											<aon:inputRichText style="width:100%" 
												id="DownloadDetail_description" 
												value="#{download.toI18n.description}" />
										</aon:div>
		
							        </aon:panelGrid>
								</aon:div>

					</rich:panel>

				</aon:panelGrid>
			</rich:panel>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
