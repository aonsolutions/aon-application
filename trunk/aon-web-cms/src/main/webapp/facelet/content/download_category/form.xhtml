<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.download_category}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{download_category.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!download_category.new and cms.roleEditor}"
							action="download_category_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{download_category.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{download_category.to!=null or download_category.new}"
							reRender="main_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{download_category.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!download_category.new and cms.roleEditor}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{download_category.onRemove}"
							confirmAction="download_category_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search" 
							value="#{bundle.aon_search}"
							immediate="#{true}"
							action="download_category_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{download_category.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="list"
							value="#{bundle.aon_list}"
							action="download_category_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{download_category.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="#{download_category.getBack}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{download_category.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="partial_generate" reRender="aonStatus"
							value="#{appBundle.aon_generate}" 
							rendered="#{download_category.to!=null and cms.roleEditor}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{generator.onGenerateCurrentDownloadCategory}" />
							<a4j:support 
								event="onclick" reRender="poll,grid" 
								actionListener="#{generator_status.onActivePoll}"  
								onclick="javascript:Richfaces.showModalPanel('gen_log');" />
						</aon:commandButton>										
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	

					<aon:outputLabel for="DownloadCategory_alias" style="width:100px"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="DownloadCategory_alias"
						required="true" size="32" maxlength="32"
						value="#{download_category.to.alias}">
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>

					<aon:outputLabel for="DownloadCategoryDetail_label"
						value="#{appBundle.download_category_label}" />
					<aon:inputText id="DownloadCategoryDetail_label"
						required="true" size="50" maxlength="64"
						value="#{download_category.toI18n.label}" />

					<aon:outputLabel for="DownloadCategoryDetail_itemsPerPage"
						value="#{appBundle.album_items_per_page}" />
					<rich:inputNumberSlider id="DownloadCategoryDetail_itemsPerPage" 
						value="#{download_category.to.itemsPerPage}" 
						width="500" 
						minValue="1" 
						maxValue="50" />
						
					<aon:outputLabel 
						value="#{appBundle.download_category_image}" />
					<aon:panelGroup id="thumbnail_preview">
						<aon:graphicImage 
							url="#{download_category.to.image}.thumbnail" 
							alt="#{download_category.to.image}"/>
		                <aon:commandLink
		                	immediate="#{true}"
		                	reRender="thumbnail_preview"
		                    actionListener="#{download_category.onDelImage}">
							<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
		        		</aon:commandLink>
						<ui:include src="/facelet/content/utils/image_modal.xhtml">
							<ui:param name="modalPanelName" value="mp" />
							<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
							<ui:param name="listenerBean" value="#{download_category}" />
							<ui:param name="reRender" value="thumbnail_preview" />
							<ui:param name="thumbnail" value="#{false}" />
						</ui:include>
		        	</aon:panelGroup>

					<aon:outputLabel for="DownloadCategory_section"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="DownloadCategory_section"  
						value="#{download_category.to.section.id}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="DownloadCategory_position"
						value="#{appBundle.download_category_position}"/>
					<aon:inputText id="DownloadCategory_position"
						required="true" size="10" maxlength="8"
						value="#{download_category.to.position}" />
					
					<aon:outputLabel for="DownloadCategory_active"
						value="#{appBundle.download_category_active}"/>
					<aon:selectBooleanCheckbox id="DownloadCategory_active" 
						value="#{download_category.to.active}" />
					
				</aon:panelGrid>
			</aon:div>
		
		</aon:form>
		<ui:include src="/facelet/content/utils/gen_log_modal.xhtml" />
	</ui:define>

</ui:composition>

</body>
</html>
