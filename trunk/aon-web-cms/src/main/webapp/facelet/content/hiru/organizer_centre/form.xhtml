<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.hiru_organizer_centre}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{hiru_organizer_centre.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!hiru_course.new and cms.roleEditor}"
							action="hiru_organizer_centre_form"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{hiru_organizer_centre.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{hiru_organizer_centre.to!=null or hiru_organizer_centre.new}"
							action="hiru_organizer_centre_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{hiru_organizer_centre.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!hiru_organizer_centre.new and cms.roleEditor}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{hiru_organizer_centre.onRemove}"
							confirmAction="hiru_organizer_centre_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="hiru_organizer_centre_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{hiru_organizer_centre.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="Hiru_organizer_centre_name" style="width:100px"
						value="#{appBundle.hiru_organizer_centre_name}" />
					<aon:inputText id="Hiru_organizer_centre_name"
						required="true" 
						size="70" maxlength="64"
						value="#{hiru_organizer_centre.to.name}" />

					<aon:outputLabel for="Hiru_organizer_centre_telephone" style="width:100px"
						value="#{appBundle.hiru_organizer_centre_telephone}" />
					<aon:inputText id="Hiru_organizer_centre_telephone"
						size="25" maxlength="20"
						value="#{hiru_organizer_centre.to.telephone}" />
						
					<aon:outputLabel for="Hiru_organizer_centre_fax" style="width:100px"
						value="#{appBundle.hiru_organizer_centre_fax}" />
					<aon:inputText id="Hiru_organizer_centre_fax"
						size="25" maxlength="20"
						value="#{hiru_organizer_centre.to.fax}" />
						
					<aon:outputLabel for="Hiru_organizer_centre_email" style="width:100px"
						value="#{appBundle.hiru_organizer_centre_email}" />
					<aon:inputText id="Hiru_organizer_centre_email"
						size="70" maxlength="64"
						value="#{hiru_organizer_centre.to.email}" />

					<aon:outputLabel for="Hiru_organizer_centre_address" style="width:100px"
						value="#{appBundle.hiru_organizer_centre_address}" />
					<aon:inputText id="Hiru_organizer_centre_address"
						size="90" maxlength="128"
						value="#{hiru_organizer_centre.to.address}" />

					<aon:outputLabel for="Hiru_organizer_centre_locality" style="width:100px"
						value="#{appBundle.hiru_organizer_centre_locality}" />
					<aon:inputText id="Hiru_organizer_centre_locality"
						size="70" maxlength="64"
						value="#{hiru_organizer_centre.to.locality}" />

					<aon:outputLabel for="Hiru_organizer_centre_postal_code" style="width:100px"
						value="#{appBundle.hiru_organizer_centre_postal_code}" />
					<aon:inputText id="Hiru_organizer_centre_postal_code"
						size="7" maxlength="5"
						value="#{hiru_organizer_centre.to.postal_code}" />

					<aon:outputLabel for="Hiru_organizer_centre_web" style="width:100px"
						value="#{appBundle.hiru_organizer_centre_web}" />
					<aon:inputText id="Hiru_organizer_centre_web"
						size="90" maxlength="128"
						value="#{hiru_organizer_centre.to.web}" />

				</aon:panelGrid>

			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
