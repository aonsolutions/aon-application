<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
	
		<aon:form id="albumCategoryForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.album_category}" />
				<ui:param name="controller" value="#{album_category}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:param name="skipRemoveButton" value="#{!cms.roleEditor or album_category.used}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="partial_generate" reRender="aonStatus"
						value="#{appBundle.aon_generate}" immediate="true"
						actionListener="#{generator.onGenerateCurrentAlbumCategory}"
						rendered="#{!album_category.new and cms.roleEditor}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}">
						<a4j:support 
							event="onclick" reRender="poll,grid"  ajaxSingle="true"
							actionListener="#{generator_status.onActivePoll}"   
							onclick="javascript:Richfaces.showModalPanel('showGeneratorLogModalPanel');" />
					</aon:commandButton>					
				</ui:define>
			</ui:decorate>
								
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="AlbumCategory_alias" style="width:100px"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="AlbumCategory_alias"
						required="true" size="32" maxlength="32"
						value="#{album_category.to.alias}">
						<f:validator validatorId="AliasValidator" />
					</aon:inputText>

					<aon:outputLabel for="AlbumCategoryDetail_label"
						value="#{appBundle.album_category_label}" />
					<aon:inputText id="AlbumCategoryDetail_label"
						required="true" size="50" maxlength="64"
						value="#{album_category.toI18n.label}" />

					<aon:outputLabel for="AlbumCategory_section"
						value="#{appBundle.cms_section}"/>
					<aon:selectOneMenu id="AlbumCategory_section"  
						value="#{album_category.to.section}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="AlbumCategory_position"
						value="#{appBundle.album_category_position}"/>
					<aon:inputText id="AlbumCategory_position"
						required="true" size="10" maxlength="8"
						value="#{album_category.to.position}" />
						
					<aon:outputLabel for="AlbumCategory_active"
						value="#{appBundle.album_category_active}"/>
					<aon:selectBooleanCheckbox id="AlbumCategory_active" 
						value="#{album_category.to.active}" />
					
				</aon:panelGrid>
			</aon:div>
		
		</aon:form>
		<ui:include src="/facelet/content/utils/gen_log_modal.xhtml" />
	</ui:define>

</ui:composition>

</body>
</html>
