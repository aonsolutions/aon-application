<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>
<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form" enctype="multipart/form-data">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.album}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{album.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="album_form"
							actionListener="#{album.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:commandButton id="save_new"
							value="#{bundle.aon_save}" 
							rendered="#{album.new}"
							action="album_form"
							actionListener="#{album.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:commandButton id="save_edit"
							value="#{bundle.aon_save}" 
							rendered="#{album.to!=null and !album.new}"
							action="album_form"
							actionListener="#{album.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!album.new}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{album.onRemove}"
							confirmAction="album_category_form"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="album_category_form" 
							actionListener="#{album_category.onSelectAlbums}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}"/>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="Album_alias" style="width:100px"
						value="#{appBundle.album_alias}" />
					<aon:inputText id="Album_alias"
						required="true" size="32" maxlength="32"
						value="#{album.to.alias}" />

					<aon:outputLabel for="Album_publishDate"
						value="#{appBundle.album_publish_date}" />
					<aon:selectInputDate id="Album_publishDate" 
						 style="z-index:2001;margin:0;vertical-align:middle;"
						 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
						 value="#{album.to.publishDate}" renderAsPopup="true"
						 popupDateFormat="#{bundle.aon_date_pattern}">
						 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
					</aon:selectInputDate>	
			
					<aon:outputLabel for="Album_itemsPerPage"
						value="#{appBundle.album_items_per_page}" />
					<rich:inputNumberSlider id="Album_itemsPerPage" 
						value="#{album.to.itemsPerPage}" 
						width="500" 
						minValue="1" 
						maxValue="50" />
						
					<aon:outputLabel for="AlbumDetail_title"
						value="#{appBundle.album_title}" />
					<aon:inputText id="AlbumDetail_title"
						required="true" size="80" maxlength="128"
						value="#{album.toI18n.title}" />
					
					<aon:outputLabel for="AlbumDetail_description"
						value="#{appBundle.album_description}" />
					<aon:inputTextarea id="AlbumDetail_description" 
						style="width:300px;height:60px"
						value="#{album.toI18n.description}" />

					<aon:outputLabel for="AlbumDetail_alt"
						value="#{appBundle.album_alt}" />
					<aon:inputText id="AlbumDetail_alt"
						size="64" maxlength="64"
						value="#{album.toI18n.alt}" />

					<aon:outputLabel 
						value="#{appBundle.album_image}" />
					<aon:panelGroup id="thumbnail_preview">
						<aon:graphicImage 
							url="#{album.to.image}.thumbnail" 
							alt="#{album.to.image}"/>
		                <aon:commandLink
		                	immediate="#{true}"
		                	reRender="thumbnail_preview"
		                    actionListener="#{album.onDelImage}">
							<aon:graphicImage url="/images/cms/inactive.png" />
		                </aon:commandLink>
						<ui:include src="/facelet/content/utils/image_modal.xhtml">
							<ui:param name="modalPanelName" value="mp" />
							<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
							<ui:param name="galleryBean" value="#{gallery}" />
							<ui:param name="listenerBean" value="#{album}" />
							<ui:param name="reRender" value="thumbnail_preview" />
							<ui:param name="image" value="#{true}" />
							<ui:param name="thumbnail" value="#{false}" />
						</ui:include>
		        	</aon:panelGroup>														
				</aon:panelGrid>
			</aon:div>
		
			<rich:panel id="detail_panel" rendered="#{!album.new and album.toI18n.id != null}">
				<f:facet name="header">#{appBundle.albumImage}</f:facet>
				
				<aon:panelGrid columns="2" styleClass="none" columnClasses="aon-vertical-align-top,aon-vertical-align-top">
				
					<rich:panel id="detail_list_panel">
						<f:facet name="header">#{appBundle.aon_listing}</f:facet>
				
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton id="reset_list" value="#{bundle.aon_reset}"
										rendered="#{!albumImage.new}"
										action="album_form"
										actionListener="#{albumImage.onReset}"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}"/>
									<aon:confirmButton id="remove_list"
										value="#{bundle.aon_remove}" 
										rendered="#{!albumImage.checklistEmpty and albumImage.to==null}" 
										immediate="#{true}"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{albumImage.onRemoveSelected}" 
										confirmAction="album_form"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>

						<aon:dataTable id="detail_list" value="#{albumImage.model}" var="to"
							rows="#{albumImage.pageLimit}"
							styleClass="dr-table rich-table aon-editDataTable"
							headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
							footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
							rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
							cellpadding="0" cellspacing="0"
							columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn">
									
							<aon:column>
								<f:facet name="header">
									<aon:div>
										&nbsp;
									</aon:div>	
								</f:facet>
								<aon:selectBooleanCheckbox 
										value="#{albumImage.rowChecked}">
										<a4j:support 
											event="onclick"  
											reRender="detail_list,buttonsGrid_list" />
								</aon:selectBooleanCheckbox>
							</aon:column>
					
							<aon:column>
								<a4j:support 
									immediate="#{true}"
									actionListener="#{albumImage.onSelect}"
									event="onclick"
									action="album_form" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.albumImage_thumbnail}" />
								</f:facet>
								<aon:graphicImage url="#{to.thumbnail}.thumbnail" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>

							<aon:column>
								<a4j:support 
									immediate="#{true}"
									action="album_form"
									actionListener="#{albumImage.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.albumImage_title}"/>
								</f:facet>
								<aon:outputText value="#{albumImage.i18nTitle}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>
				
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.albumImage_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.albumImage_activate}" 
									actionListener="#{albumImage.onActivate}"
									action="album_form"
									rendered="#{!to.active}">
									<aon:graphicImage alt="#{appBundle.albumImage_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.albumImage_deactivate}" 
									actionListener="#{albumImage.onDeactivate}" 
									action="album_form"
									rendered="#{to.active}">
									<aon:graphicImage alt="#{appBundle.albumImage_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>
				
							<aon:column>
								<f:facet name="header">
									<aon:outputText  
										value="#{appBundle.albumImage_position}" />
								</f:facet>
								<aon:graphicImage rendered="#{to.position == 0}"
									url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
								<aon:commandButton  
									action="album_form"
									actionListener="#{albumImage.onMoveUp}" 
									rendered="#{to.position != 0 and albumImage.to==null}"
									image="/images/cms/up.gif" styleClass="aon-icon-commandButton" />
								<aon:commandButton 
									action="album_form"
									actionListener="#{albumImage.onMoveDown}"
									rendered="#{to.position &lt; (albumImage.model.rowCount - 1)  and albumImage.to==null}"
									image="/images/cms/down.gif" styleClass="aon-icon-commandButton" />
							</aon:column>
				
						</aon:dataTable>
					</rich:panel>
					
					<rich:panel id="detail_edit_panel" rendered="#{albumImage.new or albumImage.to != null}">
        				<f:facet name="header">#{albumImage.new?(bundle.aon_reset):(bundle.aon_editing)}</f:facet>

								<aon:div styleClass="aon-finding-title-toolbar">
									<aon:panelGrid id="buttonsGrid_list_form" columns="1" dir="true" 
										columnClasses="aon-finding-toolbar">				
										<aon:div styleClass="aon-finding-toolbar-item-group">
											<aon:commandButton id="save_list_form"
												value="#{bundle.aon_save}" 
												rendered="#{albumImage.to!=null or albumImage.new}"
												action="album_form"
												actionListener="#{albumImage.onAccept}"
												styleClass="aon-finding-toolbar-item aon-icon-accept"
												accesskey="#{bundle.aon_key_save}"/>
											<aon:commandButton id="cancel_list_form"
												value="#{bundle.aon_cancel}" 
												rendered="#{albumImage.to!=null or albumImage.new}" 
												immediate="#{true}"
												action="album_form"
												actionListener="#{albumImage.onCancel}" 
												styleClass="aon-finding-toolbar-item aon-icon-cancel"
												accesskey="#{bundle.aon_key_cancel}"/>
											<aon:confirmButton id="remove_list_form"
												value="#{bundle.aon_remove}" 
												rendered="#{!albumImage.new}" 
												immediate="true"
												confirmAction="album_form"
												confirmTitle="Confirmation Dialog" 
												confirmMessage="#{bundle.aon_remove_confirm}"
												confirmActionListener="#{albumImage.onRemove}" 
												styleClass="aon-finding-toolbar-item aon-icon-delete"
												accesskey="#{bundle.aon_key_remove}"/>
									    </aon:div>
										
									</aon:panelGrid>
								</aon:div>
					
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="detailOptionGrid" columns="2" dir="true">

										<aon:outputLabel for="AlbumImageDetail_title"
											value="#{appBundle.albumImage_title}" />
										<aon:inputText id="AlbumImageDetail_title"
											required="true" size="64" maxlength="128"
											value="#{albumImage.toI18n.title}" />
										
										<aon:outputLabel for="AlbumImageDetail_description"
											value="#{appBundle.albumImage_description}" />
										<aon:inputTextarea id="AlbumImageDetail_description" 
											style="width:300px;height:60px"
											value="#{albumImage.toI18n.description}" />
			
										<aon:outputLabel for="AlbumImageDetail_alt"
											value="#{appBundle.albumImage_alt}" />
										<aon:inputText id="AlbumImageDetail_alt"
											size="64" maxlength="64"
											value="#{albumImage.toI18n.alt}" />
			
										<aon:outputLabel for="AlbumImageDetail_alt_thumbnail"
											value="#{appBundle.albumImage_alt_thumbnail}" />
										<aon:inputText id="AlbumImageDetail_alt_thumbnail"
											size="64" maxlength="64"
											value="#{albumImage.toI18n.alt_thumbnail}" />

										<aon:outputLabel 
											value="#{appBundle.albumImage_image}" />
										<aon:panelGroup id="thumbnail_preview_line1">
											<aon:graphicImage 
												url="#{albumImage.to.image}.thumbnail" 
												alt="#{albumImage.to.image}"/>
							                <aon:commandLink
							                	immediate="#{true}"
							                	reRender="thumbnail_preview_line1"
							                    actionListener="#{albumImage.onDelImage}">
												<aon:graphicImage url="/images/cms/inactive.png" />
							        		</aon:commandLink>
											<ui:include src="/facelet/content/utils/image_modal.xhtml">
												<ui:param name="modalPanelName" value="mp_line1" />
												<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
												<ui:param name="galleryBean" value="#{gallery}" />
												<ui:param name="listenerBean" value="#{albumImage}" />
												<ui:param name="reRender" value="thumbnail_preview_line1" />
												<ui:param name="image" value="#{true}" />
												<ui:param name="thumbnail" value="#{false}" />
											</ui:include>
        
											<aon:outputLabel 
												value="#{appBundle.article_thumbnail}" />
											<aon:graphicImage
												url="#{albumImage.to.thumbnail}.thumbnail" 
												alt="#{albumImage.to.thumbnail}"/>
							                <aon:commandLink
							                	immediate="#{true}"
							                	reRender="thumbnail_preview_line1"
							                    actionListener="#{albumImage.onDelThumbnail}">
												<aon:graphicImage url="/images/cms/inactive.png" />
							        		</aon:commandLink>
											<ui:include src="/facelet/content/utils/image_modal.xhtml">
												<ui:param name="modalPanelName" value="mp_thumbnail" />
												<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
												<ui:param name="galleryBean" value="#{gallery}" />
												<ui:param name="listenerBean" value="#{albumImage}" />
												<ui:param name="reRender" value="thumbnail_preview_line1" />
												<ui:param name="image" value="#{false}" />
												<ui:param name="thumbnail" value="#{true}" />
											</ui:include>
										</aon:panelGroup>
		
							        </aon:panelGrid>
								</aon:div>

					</rich:panel>

				</aon:panelGrid>
			</rich:panel>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
