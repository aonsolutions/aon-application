<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="albumImagelist">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.albumImage}" />
				<ui:param name="controller" value="#{albumImage}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="home"
						value="#{bundle.aon_home}"
						action="home" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}" >
					</aon:commandButton>
				</ui:define>
			</ui:decorate>		

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					
				<aon:dataTable id="dataTable" rows="#{albumImage.pageLimit}" var="to"					
					value="#{albumImage.model}" rendered="#{albumImage.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn aon-width-140, aon-editDataTable-textColumn,
							aon-editDataTable-textColumn, aon-editDataTable-iconColumn">
			
					<aon:rowSelector
						action="albumImage_form" actionListener="#{albumImage.onSelect}" />							
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.albumImage_thumbnail}" />
						</f:facet>
						<aon:graphicImage url="#{to.thumbnail}.thumbnail" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.albumImage_title}"/>
						</f:facet>
						<aon:outputText value="#{albumImage.i18nTitle}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.album}"/>
						</f:facet>
						<aon:outputText value="#{to.album.alias}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.albumImage_active}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >					
							<aon:commandLink title="#{appBundle.albumImage_activate}" 
								action="albumImage_list"
								actionListener="#{albumImage.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="AlbumImage_active" alt="#{appBundle.album_image_activate}"
									url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.albumImage_deactivate}" 
								action="albumImage_list"
								actionListener="#{albumImage.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="AlbumImage_deactive" alt="#{appBundle.album_image_deactivate}"
									url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:column>

				</aon:dataTable>
			
				<aon:dataScroller2 for="dataTable" showNote="true" />					

			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
