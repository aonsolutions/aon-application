<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="albumList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.album}" />
				<ui:param name="controller" value="#{album}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="exit"
						value="#{bundle.aon_close}"
						action="#{album.getBack}" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
					<aon:commandButton id="generate" reRender="aonStatus"
						actionListener="#{generator.onGenerateAlbums}"
						value="#{appBundle.aon_generate}" 
						rendered="#{cms.roleEditor}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}">							
						<a4j:support 
							event="onclick" reRender="poll,grid"
							actionListener="#{generator_status.onActivePoll}"   
							onclick="javascript:Richfaces.showModalPanel('showGeneratorLogModalPanel');" />
					</aon:commandButton>
					<aon:commandButton id="create_album" reRender="showAlbumWindow"
						value="#{appBundle.aon_create_album}"
						styleClass="aon-finding-toolbar-item aon-icon-reset">
						<f:setPropertyActionListener target="#{album.showAlbumWindow}"
							value="#{true}" />
					</aon:commandButton>							
					<aon:commandButton id="categories"
						value="#{appBundle.album_category}"
						action="album_category_list"
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item-no-icon">
						<aon:actionListener method="#{album_category.onInit}" />
						<aon:actionListener method="#{album_category.onSearch}" />
					</aon:commandButton>
				</ui:define>
			</ui:decorate>		

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					
				<aon:dataTable id="dataTable" rows="#{album.pageLimit}" var="to"  
					value="#{album.model}" rendered="#{album.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
							aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-iconColumn">
							
					<aon:rowSelector
						action="album_form" actionListener="#{album.onSelect}" />							
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.album_title}" />
						</f:facet>
						<aon:outputText value="#{album.i18nTitle}" >
							<aon:abbreviateConverter maxWidth="60" />
						</aon:outputText>						
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.album_category}" />
						</f:facet>
						<aon:outputText value="#{to.albumCategory.alias}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.album_position}" />
						</f:facet>
						<aon:outputText value="#{to.position}" />
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.album_active}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >					
							<aon:commandLink title="#{appBundle.album_activate}" 
								action="album_list"
								actionListener="#{album.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="Album_active" alt="#{appBundle.album_activate}"
									url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.album_deactivate}" 
								action="album_list"
								actionListener="#{album.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="Album_deactive" alt="#{appBundle.album_deactivate}"
									url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:column>

				</aon:dataTable>
			
				<aon:dataScroller2 for="dataTable" showNote="true" />					

			</aon:div>
			<ui:include src="/facelet/content/utils/album_modal.xhtml">
				<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
				<ui:param name="reRender" value="list" />
			</ui:include>			
		</aon:form>

		<ui:include src="/facelet/content/utils/gen_log_modal.xhtml" />
		
	</ui:define>

</ui:composition>

</body>
</html>
