<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="bulletinForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.bulletin}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{bulletin.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					

	
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="bulletin_form"
							rendered="#{!bulletin.new and cms.roleEditor}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{bulletin.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{bulletin.to!=null or bulletin.new}"
							action="bulletin_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{bulletin.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!bulletin.new and cms.roleEditor}" 
							immediate="true"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{bulletin.onRemove}" 
							confirmAction="bulletin_list"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="bulletin_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{bulletin.onCancel}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width:99%;">
	
					<aon:panelTabSet id="bulletinTabSet">
						<aon:panelTab id="general" label="#{appBundle.aon_content}">
						
							<aon:panelGrid columns="2" dir="true">
								<aon:outputText value="#{appBundle.cms_alias}" 
									for="alias"/>
								<aon:inputText id="alias" 
									required="true"
									value="#{bulletin.to.alias}" size="40" maxlength="64" />
		
								<aon:outputLabel for="bulletin_publishDate"
									value="#{appBundle.bulletin_publishDate}" />
								<aon:selectInputDate id="bulletin_publishDate" 
									required="true"
									 style="z-index:2001;margin:0;vertical-align:middle;"
									 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
									 value="#{bulletin.to.publish_date}" renderAsPopup="true"
									 enableManualInput="true"
									 popupDateFormat="#{bundle.aon_date_pattern}">
									 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
								</aon:selectInputDate>	
								
								<aon:outputLabel for="title"
									value="#{appBundle.bulletin_title}" />
								<aon:inputText id="title" 
									required="true"
									value="#{bulletin.toI18n.title}" size="85" maxlength="255" />
								
								<aon:outputLabel for="content"
									value="#{appBundle.bulletin_content}" />
								<aon:div style="width:600px">
									<aon:inputRichText style="width:100%" 
										id="content" 
										value="#{bulletin.toI18n.content}" />
								</aon:div>
							
							</aon:panelGrid>
						</aon:panelTab>
						
						<aon:panelTab id="articlesTab" label="#{appBundle.bulletin_articles}"
							rendered="#{!bulletin.new}" >

							<aon:outputLabel for="BulletinArticle_publishDate"
								value="#{appBundle.article_publishDate}" />
							<aon:selectInputDate id="BulletinArticle_publishDate"
								 style="z-index:2001;margin:0;vertical-align:middle;"
								 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								 value="#{bulletin.publishDate}" renderAsPopup="true"
								 enableManualInput="true"
								 popupDateFormat="#{bundle.aon_date_pattern}">
								 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
							</aon:selectInputDate>	
							
							<aon:outputLabel for="BulletinArticle_expireDate"
								value="#{appBundle.article_expireDate}" />
							<aon:selectInputDate id="BulletinArticle_expireDate" 
								 style="z-index:2001;margin:0;vertical-align:middle;"
								 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								 value="#{bulletin.expireDate}" renderAsPopup="true"
								 enableManualInput="true"
								 popupDateFormat="#{bundle.aon_date_pattern}">
								 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
							</aon:selectInputDate>	

							<aon:commandButton id="reset_articles" 
								value="#{appBundle.bulletin_refresh_articles}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								reRender="gridToolbar,gridDataTable" />

							<rich:panel id="detail_list_panel">
								<f:facet name="header">#{appBundle.aon_listing}</f:facet>
						
								<aon:div styleClass="aon-finding-title-toolbar">
									<aon:panelGrid id="gridToolbar" columns="1" dir="true" 
										columnClasses="aon-finding-toolbar">				
									
										<!-- start toolbar navigation -->
										<aon:div styleClass="aon-finding-toolbar-item-group">
											<aon:commandButton id="reset_list" value="#{bundle.aon_reset}"
												styleClass="aon-finding-toolbar-item aon-icon-reset"
												accesskey="#{bundle.aon_key_new}"
												reRender="detail_list_panel">
												<aon:actionListener method="#{bulletin_article.onReset}" />
											</aon:commandButton>
									    </aon:div>
										
										<!-- end toolbar navigation -->
									</aon:panelGrid>
								</aon:div>
						
								<aon:dataTable2 id="gridDataTable" 
									value="#{bulletin_article.model}" var="to"
									rows="#{bulletin_article.pageLimit}"
									columnClasses="aon-editDataTable-iconColumn,
											aon-editDataTable-textColumn,
											aon-editDataTable-textColumn,
											aon-editDataTable-buttonsColumn">
											
									<aon:column>
										<f:facet name="header">
											<aon:div>
												<aon:outputText value="&nbsp;" />
											</aon:div>	
										</f:facet>
										<aon:outputText value="&#160;" />
										<f:facet name="footer">
											<aon:div>
												<aon:commandButton id="reset"
													title="[#{bundle.aon_reset}]"
													styleClass="aon-editDataTable-button aon-icon-reset"
													value="" immediate="true"
													reRender="gridDataTable,gridToolbar"
													rendered="#{!bulletin_article.new}"
													accesskey="#{bundle.aon_key_new_line}">
													<aon:actionListener method="#{bulletin_article.onReset}" />
												</aon:commandButton>
											</aon:div>
										</f:facet>
									</aon:column>
							
									<aon:column>
										<a4j:support 
											actionListener="#{bulletin_article.onSelect}"
											event="onclick"  
											reRender="gridDataTable,gridToolbar" />
										<f:facet name="header">
											<aon:outputText value="#{appBundle.bulletin_article_article}"/>
										</f:facet>
										<aon:outputText value="#{to.article.alias}"
											rendered="#{to!=bulletin_article.to}" 
											styleClass="aon-editDataTable-button">
											<a4j:support 
												reRender="gridDataTable,gridToolbar"
												actionListener="#{bulletin_article.onSelect}"
												event="onclick" />
										</aon:outputText>	
										<aon:selectOneMenu
											required="#{true}"   
											rendered="#{to==bulletin_article.to}"
											value="#{to.article.id}">
											<f:selectItem itemLabel="-" itemValue="-1" />
											<f:selectItems value="#{bulletin.articleList}" />
										</aon:selectOneMenu>
										<f:facet name="footer">
											<aon:div>
												<aon:selectOneMenu
													required="#{true}"   
													rendered="#{bulletin_article.new}"
													value="#{bulletin_article.to.article.id}">
													<f:selectItem itemLabel="-" itemValue="-1" />
													<f:selectItems value="#{bulletin.articleList}" />
												</aon:selectOneMenu>
											</aon:div>
										</f:facet>
									</aon:column>
															
									<aon:column>
										<f:facet name="header">
											<aon:outputText for="position" value="#{appBundle.bulletin_article_position}" />
										</f:facet>
										<aon:outputText value="#{to.position}"
											rendered="#{to!=bulletin_article.to}" 
											styleClass="aon-editDataTable-button">
											<a4j:support 
												reRender="gridDataTable,gridToolbar"
												actionListener="#{bulletin_article.onSelect}"
												event="onclick" />
										</aon:outputText>	
										<aon:inputText value="#{bulletin_article.to.position}"
											id="#{to.id}_position"
											rendered="#{to==bulletin_article.to}"
											required="#{true}" size="70" maxlength="64" />
										<f:facet name="footer">
											<aon:div>
												<aon:inputText value="#{bulletin_article.to.position}"
													id="new_position"
													rendered="#{bulletin_article.new}"
													required="#{true}" size="70" maxlength="64" />
											</aon:div>
										</f:facet>
									</aon:column>
									
									<aon:column>
										<f:facet name="header">
											<aon:outputText value="&#160;" />
										</f:facet>
										<f:verbatim rendered="#{to!=bulletin_article.to}">&#160;</f:verbatim>
										<aon:div rendered="#{to==bulletin_article.to}">
											<aon:commandButton id="lineAccept"
												title="[#{bundle.aon_accept}]"
												styleClass="aon-editDataTable-button aon-icon-accept"
												reRender="gridDataTable,gridToolbar">
												<aon:actionListener method="#{bulletin_article.onAccept}" />
											</aon:commandButton>
											<aon:commandButton id="lineCancel"
												title="[#{bundle.aon_cancel}]"
												styleClass="aon-editDataTable-button aon-icon-cancel"
												reRender="gridDataTable,gridToolbar" immediate="true">
												<aon:actionListener method="#{bulletin_article.onCancel}" />
											</aon:commandButton>
											<aon:commandButton id="lineRemove"
												title="[#{bundle.aon_remove}]"
												styleClass="aon-editDataTable-button aon-icon-delete"
												reRender="gridDataTable,gridToolbar" immediate="true">
												<aon:actionListener method="#{bulletin_article.onRemove}" />
											</aon:commandButton>
										</aon:div>
										<f:facet name="footer">
											<aon:div rendered="#{bulletin_article.new}">
												<f:verbatim rendered="#{!bulletin_article.new}">&#160;</f:verbatim>
												<aon:commandButton id="newAccept"
													title="[#{bundle.aon_accept}]"
													styleClass="aon-editDataTable-button aon-icon-accept"
													reRender="gridDataTable,gridToolbar">
													<aon:actionListener method="#{bulletin_article.onAccept}" />
												</aon:commandButton>
												<aon:commandButton id="newCancel"
													title="[#{bundle.aon_cancel}]"
													styleClass="aon-editDataTable-button aon-icon-cancel"
													reRender="gridDataTable,gridToolbar" immediate="true">
													<aon:actionListener method="#{bulletin_article.onCancel}" />
												</aon:commandButton>
											</aon:div>
										</f:facet>
									</aon:column>

								</aon:dataTable>						
							</rich:panel>
						</aon:panelTab>
					</aon:panelTabSet>
				</aon:div>

			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
