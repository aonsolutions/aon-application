<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.modular_page}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="modular_page_grid"
							immediate="true" 
							actionListener="#{modular_page.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!modular_page.checklistEmpty}" 
							inmediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{modular_page.onRemoveSelected}"
							confirmAction="modular_page_grid"
							accesskey="#{bundle.aon_key_remove}"/>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
						
				<h:dataTable id="dataTable" value="#{modular_page.model}" var="to"
					rows="20" styleClass="dr-table rich-table aon-editDataTable"
					headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
					footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
					rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
					cellpadding="0" cellspacing="0"
					columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText value="&#160;" rendered="#{to==modular_page.to}" />
						<aon:commandButton rendered="#{to!=modular_page.to}"
							styleClass="aon-editDataTable-button aon-icon-rowSelector"
							actionListener="#{modular_page.onSelect}" value="" immediate="true"
							reRender="dataTable">
						</aon:commandButton>
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset" value=""
									immediate="true" reRender="dataTable"
									rendered="#{!modular_page.new}" 
									actionListener="#{modular_page.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
			
					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:outputText value="#{bundle.aon_check}" />
							</aon:div>	
						</f:facet>
						<aon:selectBooleanCheckbox id="Row_checked"
								value="#{modular_page.rowChecked}"  
								rendered="#{!to.homepage}">
								<a4j:support 
									event="onclick"  
									reRender="dataTable,buttonsGrid" />
						</aon:selectBooleanCheckbox>
						<aon:graphicImage id="Footer_selected_blocked" rendered="#{to.homepage}"
							url="/images/cms/blocked.gif" />
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.modular_page_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" rendered="#{to!=modular_page.to}" 
							styleClass="aon-editDataTable-button">
							<a4j:support 
								action="modular_page_option_grid"
								actionListener="#{modular_page.onSelectOptions}"
								event="onclick" />
						</aon:outputText>
						<aon:panelGrid columns="2" rendered="#{to==modular_page.to}" style="width:90%">
							<aon:outputLabel value="#{appBundle.modular_page_alias}" />
							<aon:inputText 
								required="true" size="32" maxlength="32"
								value="#{modular_page.to.alias}" />

							<aon:outputLabel 
								value="#{appBundle.modular_page_alias}" />
							<aon:inputText 
								required="true" size="32" maxlength="32"
								value="#{modular_page.toI18n.label}" />

							<aon:outputLabel 
								value="#{appBundle.section}"/>
							<aon:selectOneMenu   
								styleClass="aon-form-selectOneMenu-field"
								value="#{modular_page.to.section.id}">
								<f:selectItem itemLabel="-" itemValue="-1" />
								<f:selectItems value="#{collections.sectionList}" />
							</aon:selectOneMenu>
						</aon:panelGrid>
						<f:facet name="footer">
							<aon:panelGrid columns="2" rendered="#{modular_page.new}" 
								style="width:90%">
								<aon:outputLabel value="#{appBundle.modular_page_alias}" />
								<aon:inputText 
									required="true" size="32" maxlength="32"
									value="#{modular_page.to.alias}" />
	
								<aon:outputLabel 
									value="#{appBundle.modular_page_alias}" />
								<aon:inputText 
									required="true" size="32" maxlength="32"
									value="#{modular_page.toI18n.label}" />
	
								<aon:outputLabel 
									value="#{appBundle.section}"/>
								<aon:selectOneMenu
									styleClass="aon-form-selectOneMenu-field"
									value="#{modular_page.to.section.id}">
									<f:selectItem itemLabel="-" itemValue="-1" />
									<f:selectItems value="#{collections.sectionList}" />
								</aon:selectOneMenu>
							</aon:panelGrid>
						</f:facet>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText for="Modular_page_homepage" 
								value="#{appBundle.modular_page_homepage}" />
						</f:facet>
						<aon:selectBooleanCheckbox id="Modular_page_homepage" 
								value="#{to.homepage}" 
								rendered="#{!to.homepage}">
								<a4j:support 
									actionListener="#{modular_page.defaultHomepageChanged}"
									event="onclick"  
									reRender="dataTable" />
						</aon:selectBooleanCheckbox>
						<aon:graphicImage id="default_blocked" rendered="#{to.homepage}"
							url="/images/cms/selected.gif" />
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.modular_page_active}" />
						</f:facet>
						<aon:div rendered="#{!to.homepage}">
							<aon:commandLink title="#{appBundle.modular_page_activate}"
								action="modular_page_grid" 
								actionListener="#{modular_page.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="modular_page_active" 
									alt="#{appBundle.modular_page_activate}"
									url="/images/cms/inactive.png" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.modular_page_deactivate}" 
								action="modular_page_grid" 
								actionListener="#{modular_page.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="modular_page_deactive" 
									alt="#{appBundle.modular_page_deactivate}"
									url="/images/cms/active.png" />
							</aon:commandLink>
						</aon:div>
						<aon:div rendered="#{to.homepage}">
							<aon:graphicImage rendered="#{to.homepage}"
								url="/images/cms/selected.gif" 
								alt="#{appBundle.modular_page_homepage_blocked}"/>
						</aon:div>
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>
	
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=modular_page.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==modular_page.to}">
							<aon:commandButton id="lineAccept" title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="dataTable"
								actionListener="#{modular_page.onAccept}" />
							<aon:commandButton id="lineCancel" title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="dataTable" immediate="true"
								actionListener="#{modular_page.onCancel}" />
							<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="dataTable" immediate="true"
								actionListener="#{modular_page.onRemove}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{modular_page.new}">
								<f:verbatim rendered="#{!modular_page.new}">&#160;</f:verbatim>
								<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="dataTable"
									actionListener="#{modular_page.onAccept}" />
								<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="dataTable" immediate="true"
									actionListener="#{modular_page.onCancel}" />
							</aon:div>
						</f:facet>
					</aon:column>
				</h:dataTable>
			
				<aon:dataScroller dataTable="dataTable" model="#{modular_page.model}" />

			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
