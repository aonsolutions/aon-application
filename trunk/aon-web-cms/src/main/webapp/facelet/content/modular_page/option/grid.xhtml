<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.modular_page_option}"/>	
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing} #{modular_page_option.currentModularPage.alias}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="modular_page_option_grid"
							actionListener="#{modular_page_option.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!modular_page_option.checklistEmpty}" 
							inmediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{modular_page_option.onRemoveSelected}"
							confirmAction="modular_page_option_grid"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="modular_page_grid" 
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}"/>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
						
				<h:dataTable id="dataTable" value="#{modular_page_option.model}" var="to"
					rows="20" styleClass="dr-table rich-table aon-editDataTable"
					headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
					footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
					rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
					cellpadding="0" cellspacing="0"
					columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-textColumn,
							dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
							dr-table-cell rich-table-cell aon-editDataTable-buttonsColumn">
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText value="&#160;" rendered="#{to==modular_page_option.to}" />
						<aon:commandButton rendered="#{to!=modular_page_option.to}"
							styleClass="aon-editDataTable-button aon-icon-rowSelector"
							actionListener="#{modular_page_option.onSelect}" value="" immediate="true"
							reRender="dataTable">
						</aon:commandButton>
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton id="reset"
									title="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset" value=""
									immediate="true" reRender="dataTable"
									rendered="#{!modular_page_option.new}" actionListener="#{modular_page_option.onReset}"
									accesskey="#{bundle.aon_key_new_line}">
								</aon:commandButton>
							</aon:div>
						</f:facet>
					</aon:column>
			
					<aon:column>
						<f:facet name="header">
							<aon:div>
								<aon:outputText value="#{bundle.aon_check}" />
							</aon:div>	
						</f:facet>
						<aon:selectBooleanCheckbox id="Row_checked"
								value="#{modular_page_option.rowChecked}">
								<a4j:support 
									event="onclick"  
									reRender="dataTable,buttonsGrid" />
						</aon:selectBooleanCheckbox>
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.modular_page_option_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" rendered="#{to!=modular_page_option.to}" 
							styleClass="aon-editDataTable-button"/>
						<aon:panelGrid id="editData" styleClass="none" columnClasses="aon-text-right,none"
							columns="2" rendered="#{to==modular_page_option.to}">
							
							<aon:outputLabel 
								value="#{appBundle.modular_page_option_alias}" />
							<aon:inputText 
								required="true" size="32" maxlength="32"
								value="#{modular_page_option.to.alias}" />

							<aon:outputLabel 
								value="#{appBundle.modular_page_option_label}" />
							<aon:inputText 
								required="true" size="50" maxlength="64"
								value="#{modular_page_option.toI18n.label}" />

							<aon:outputLabel 
								value="#{appBundle.modular_page_option_type}" />
							<aon:selectOneMenu  
								value="#{modular_page_option.to.type}" 
								required="true">
								<f:selectItems value="#{collections.modularPageOptionTypes}" />
								<a4j:support 
									ajaxSingle="true" 
									event="onchange"  
									reRender="editData" />
							</aon:selectOneMenu> 

							<aon:outputLabel 
								value="#{appBundle.modular_page_option_ident}" 
								rendered="#{modular_page_option.visibleIdent}"/>
							<aon:selectOneMenu  
								rendered="#{modular_page_option.visibleIdent}" 
								value="#{modular_page_option.to.ident}">
								<f:selectItems value="#{modular_page_option.idents}" />
							</aon:selectOneMenu>
							 							
						</aon:panelGrid>
						<f:facet name="footer">
							<aon:panelGrid id="newData" 
								columns="2" rendered="#{modular_page_option.new}" 
								style="width:90%">
								
								<aon:outputLabel 
									value="#{appBundle.modular_page_option_alias}" />
								<aon:inputText 
									required="true" size="32" maxlength="32"
									value="#{modular_page_option.to.alias}" />
	
								<aon:outputLabel 
									value="#{appBundle.modular_page_option_label}" />
								<aon:inputText 
									required="true" size="50" maxlength="64"
									value="#{modular_page_option.toI18n.label}" />
	
								<aon:outputLabel 
									value="#{appBundle.modular_page_option_type}" />
								<aon:selectOneMenu  
									value="#{modular_page_option.to.type}" 
									required="true">
									<f:selectItems value="#{collections.modularPageOptionTypes}" />
									<a4j:support 
										ajaxSingle="true" 
										event="onchange"  
										reRender="newData" />
								</aon:selectOneMenu> 
	
								<aon:outputLabel 
									value="#{appBundle.modular_page_option_ident}" 
									rendered="#{modular_page_option.visibleIdent}"/>
								<aon:selectOneMenu  
									rendered="#{modular_page_option.visibleIdent}" 
									value="#{modular_page_option.to.ident}">
									<f:selectItems value="#{modular_page_option.idents}" />
								</aon:selectOneMenu>
								
							</aon:panelGrid>
						</f:facet>
					</aon:column>
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.sidebar_option_active}" />
						</f:facet>
						<aon:commandLink title="#{appBundle.modular_page_option_activate}" 
							action="modular_page_option_grid"
							actionListener="#{modular_page_option.onActivate}"
							reRender="dataTable" 
							rendered="#{!to.active}">
							<aon:graphicImage id="SidebarOption_active" alt="#{appBundle.sidebar_option_activate}"
								url="/images/cms/inactive.png" />
						</aon:commandLink>
						<aon:commandLink title="#{appBundle.sidebar_option_deactivate}" 
							action="modular_page_option_grid"
							actionListener="#{modular_page_option.onDeactivate}" 
							reRender="dataTable" 
							rendered="#{to.active}">
							<aon:graphicImage id="SidebarOption_deactive" 
								alt="#{appBundle.modular_page_option_deactivate}"
								url="/images/cms/active.png" />
						</aon:commandLink>
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText 
								value="#{appBundle.modular_page_option_position}" />
						</f:facet>
						<aon:div  styleClass="aon-nowrap" rendered="#{to!=modular_page_option.to}">
							<aon:graphicImage rendered="#{to.position == 0}"
								url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
							<aon:commandButton id="moveUp" 
								reRender="dataTable" 
								actionListener="#{modular_page_option.onMoveUp}" 
								rendered="#{to.position != 0}"
								image="/images/cms/up.gif" styleClass="aon-icon-commandButton"/>
							<aon:commandButton id="moveDown"
								reRender="dataTable"  
								actionListener="#{modular_page_option.onMoveDown}"
								rendered="#{to.position &lt; (modular_page_option.model.rowCount - 1)}"
								image="/images/cms/down.gif" styleClass="aon-icon-commandButton" />
						</aon:div>
						<f:facet name="footer">
							<aon:outputText value="&#160;" />
						</f:facet>
					</aon:column>
	
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<f:verbatim rendered="#{to!=modular_page_option.to}">&#160;</f:verbatim>
						<aon:div rendered="#{to==modular_page_option.to}">
							<aon:commandButton id="lineAccept" title="[#{bundle.aon_accept}]"
								styleClass="aon-editDataTable-button aon-icon-accept"
								reRender="dataTable"
								actionListener="#{modular_page_option.onAccept}" />
							<aon:commandButton id="lineCancel" title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								reRender="dataTable" immediate="true"
								actionListener="#{modular_page_option.onCancel}" />
							<aon:commandButton id="lineRemove" title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								reRender="dataTable" immediate="true"
								actionListener="#{modular_page_option.onRemove}" />
						</aon:div>
						<f:facet name="footer">
							<aon:div rendered="#{modular_page_option.new}">
								<f:verbatim rendered="#{!modular_page_option.new}">&#160;</f:verbatim>
								<aon:commandButton id="newAccept" title="[#{bundle.aon_accept}]"
									styleClass="aon-editDataTable-button aon-icon-accept"
									reRender="dataTable"
									actionListener="#{modular_page_option.onAccept}" />
								<aon:commandButton id="newCancel" title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									reRender="dataTable" immediate="true"
									actionListener="#{modular_page_option.onCancel}" />
							</aon:div>
						</f:facet>
					</aon:column>
				</h:dataTable>
			
				<aon:dataScroller dataTable="dataTable" model="#{modular_page_option.model}" />

			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
