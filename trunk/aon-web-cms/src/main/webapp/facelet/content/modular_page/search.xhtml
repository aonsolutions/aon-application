<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.modular_page}" />
				<ui:param name="controller" value="#{modular_page}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
			</ui:include>		

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{modular_page}" />
				<ui:define name="searchContent">
	
					<aon:outputLabel for="ModularPage_alias"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="ModularPage_alias" size="50"
						valueChangeListener="#{modular_page.addExpression}" />
	
					<aon:outputLabel for="ModularPage_title"
						value="#{appBundle.modular_page_label}" />
					<aon:inputText id="ModularPage_title" size="50"
						value="#{modular_page.title}" />

					<aon:outputLabel for="ModularPage_section_id"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="ModularPage_section_id"  
						valueChangeListener="#{modular_page.addExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
	
					<aon:outputLabel for="ModularPage_active"
						value="#{appBundle.cms_active}" />
					<aon:selectOneMenu id="ModularPage_active"
						valueChangeListener="#{controller.addExpression}">
						<f:selectItem itemLabel="-"	itemValue="#{null}" />
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
					</aon:selectOneMenu>		
					
				</ui:define>
			</ui:decorate>
			
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
