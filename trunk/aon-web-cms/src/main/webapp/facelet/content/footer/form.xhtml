<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="headerForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.footer}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{footer.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<h:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{footer.to!=null or header.new}"
							actionListener="#{footer.onAccept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<h:commandButton id="cancel"
							value="#{bundle.aon_cancel}" 
							rendered="#{footer.to!=null or header.new}" immediate="#{true}"
							actionListener="#{footer.onCancel}" action="footer_list"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!footer.new}" 
							immediate="true"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{footer.onRemove}" 
							confirmAction="footer_list"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}"/>
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							action="footer_form"
							actionListener="#{footer.onReset}" rendered="#{!menu_option.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<h:commandButton id="first" 
							immediate="#{true}"
							action="footer_form"
							rendered="#{!footer.new and !footer.inFirst}"
							styleClass="aon-icon-commandButton aon-dataScroller-button-first"
							actionListener="#{footer.onSelectFirst}"/>
						<h:commandButton id="previous" 
							immediate="#{true}"
							action="footer_form"
							rendered="#{!footer.new and !footer.inFirst}"
							styleClass="aon-icon-commandButton aon-dataScroller-button-previous"
							actionListener="#{footer.onSelectPrevious}"/>
						<h:commandButton id="next" 
							immediate="#{true}"
							action="footer_form"
							rendered="#{!footer.new and !footer.inLast}"
							styleClass="aon-icon-commandButton aon-dataScroller-button-next"
							actionListener="#{footer.onSelectNext}"/>
						<h:commandButton id="last" 
							immediate="#{true}"
							action="footer_form"
							rendered="#{!footer.new and !footer.inLast}"
							styleClass="aon-icon-commandButton aon-dataScroller-button-last"
							actionListener="#{footer.onSelectLast}"/>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width:99%;">
	
					<aon:panelGrid columns="2" dir="true">
						<aon:outputText value="#{appBundle.menu_alias}" 
							for="alias"/>
						<aon:inputText id="alias" 
							value="#{footer.to.alias}" size="40" maxlength="64" />
						
						<aon:outputLabel for="menu"
							value="#{appBundle.footer_menu}"/>
						<aon:selectOneMenu id="menu"  
							value="#{footer.to.menu.id}">
							<f:selectItems value="#{collections.menuFootList}" />
						</aon:selectOneMenu> 
							
						<aon:outputLabel for="content"
							value="#{appBundle.footer_content}" />
						<aon:div style="width:600px">
							<aon:inputRichText style="width:100%" 
								id="content" 
								value="#{footer.toI18n.content}" />
						</aon:div>
					
					</aon:panelGrid>
				</aon:div>

			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
