<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.company}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{company.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!company.new and cms.roleEditor}"
							action="company_form"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{company.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{company.to!=null or company.new}"
							action="company_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{company.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!company.new and cms.roleEditor}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{company.onRemove}"
							confirmAction="company_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search" 
							value="#{bundle.aon_search}"
							immediate="#{true}"
							action="company_search"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}">
							<aon:actionListener method="#{company.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="list"
							value="#{bundle.aon_list}"
							action="company_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{company.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{company.onCancel}" />
						</aon:commandButton>
						<aon:commandButton id="activities_link"
							value="#{appBundle.activity}"
							action="activity_list"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item-no-icon">
							<aon:actionListener method="#{activity.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="Company_name" style="width:100px"
						value="#{appBundle.company_name}" />
					<aon:inputText id="Company_name"
						required="true" 
						size="70" maxlength="64"
						value="#{company.to.name}" />

					<aon:outputLabel for="Company_telephone" style="width:100px"
						value="#{appBundle.company_telephone}" />
					<aon:inputText id="Company_telephone"
						size="25" maxlength="20"
						value="#{company.to.telephone}" />
						
					<aon:outputLabel for="Company_fax" style="width:100px"
						value="#{appBundle.company_fax}" />
					<aon:inputText id="Company_fax"
						size="25" maxlength="20"
						value="#{company.to.fax}" />
						
					<aon:outputLabel for="Company_email" style="width:100px"
						value="#{appBundle.company_email}" />
					<aon:inputText id="Company_email"
						size="70" maxlength="64"
						value="#{company.to.email}" />

					<aon:outputLabel for="Company_address" style="width:100px"
						value="#{appBundle.company_address}" />
					<aon:inputText id="Company_address"
						size="90" maxlength="128"
						value="#{company.to.address}" />

					<aon:outputLabel for="Company_locality" style="width:100px"
						value="#{appBundle.company_locality}" />
					<aon:inputText id="Company_locality"
						size="70" maxlength="64"
						value="#{company.to.locality}" />

					<aon:outputLabel for="Company_province" style="width:100px"
						value="#{appBundle.company_province}" />
					<aon:inputText id="Company_province"
						size="70" maxlength="64"
						value="#{company.to.province}" />

					<aon:outputLabel for="Company_postal_code" style="width:100px"
						value="#{appBundle.company_postal_code}" />
					<aon:inputText id="Company_postal_code"
						size="7" maxlength="5"
						value="#{company.to.postal_code}" />

					<aon:outputLabel for="Company_web" style="width:100px"
						value="#{appBundle.company_web}" />
					<aon:inputText id="Company_web"
						size="90" maxlength="128"
						value="#{company.to.web}" />

					<aon:outputLabel for="Company_logo" style="width:100px"
						value="#{appBundle.company_logo}" />
					<aon:panelGroup id="thumbnail_preview">
						<aon:graphicImage 
							url="#{company.to.logo}.thumbnail" 
							alt="#{company.to.logo}"/>
		                <aon:commandLink
		                	immediate="#{true}"
		                	reRender="thumbnail_preview"
		                    actionListener="#{company.onDelImage}">
							<aon:graphicImage url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
		        		</aon:commandLink>
						<ui:include src="/facelet/content/utils/image_modal.xhtml">
							<ui:param name="modalPanelName" value="mp" />
							<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
							<ui:param name="galleryBean" value="#{gallery}" />
							<ui:param name="listenerBean" value="#{company}" />
							<ui:param name="reRender" value="thumbnail_preview" />
							<ui:param name="image" value="#{true}" />
							<ui:param name="thumbnail" value="#{false}" />
						</ui:include>
		        	</aon:panelGroup>
		        	
				</aon:panelGrid>

				<rich:panel id="detail_list_panel" rendered="#{!company.new}">
					<f:facet name="header">#{appBundle.activity}</f:facet>
					<aon:panelGrid id="activities" columns="2" 
						styleClass="none" columnClasses="aon-vertical-align-top,aon-vertical-align-top">
						<aon:dataTable id="dataTable_1" value="#{company.currentActivitiesModel}" var="to"
							limit="1000"
							columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
									aon-editDataTable-textColumn">
							<aon:column>
								<f:facet name="header">
									<aon:div>
										<aon:outputText value="ACTUALES" />
									</aon:div>	
								</f:facet>
								<a4j:support 
									actionListener="#{company.removeCurrentActivity}"
									reRender="activities" 
									event="onclick" />
					            <h:outputText value="#{to.activity.alias}" styleClass="aon-editDataTable-button aon-icon-delete"/><br/>
							</aon:column>
				        </aon:dataTable>
				        
						<aon:dataTable id="dataTable_2" value="#{company.activityModel}" var="to"
							limit="1000"
							columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,
									aon-editDataTable-textColumn">
							<aon:column>
								<f:facet name="header">
									<aon:div>
										<aon:outputText value="DISPONIBLES" />
									</aon:div>	
								</f:facet>
								<a4j:support 
									actionListener="#{company.addCurrentActivity}"
									reRender="activities" 
									event="onclick" />
					            <h:outputText value="#{to.alias}" styleClass="aon-editDataTable-button aon-icon-accept"/><br/>
							</aon:column>
				        </aon:dataTable>
					</aon:panelGrid>
				</rich:panel>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
