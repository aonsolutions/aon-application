<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.faq_category}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{faq_category.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<h:commandButton id="reset" value="#{bundle.aon_reset}"
							action="faq_category_form"
							actionListener="#{faq_category.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<h:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{faq_category.to!=null or faq_category.new}"
							action="faq_category_form"
							actionListener="#{faq_category.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!faq_category.new}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{faq_category.onRemove}"
							confirmAction="faq_category_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<h:commandButton id="exit" value="#{bundle.aon_close}"
							action="faq_category_list" 
							actionListener="#{faq_category.onSearch}"
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}"/>
						<h:commandButton id="partial_generate"
							value="#{appBundle.aon_generate}" 
							rendered="#{faq_category.to!=null}"
							actionListener="#{generator.onGenerateCurrentFaqCategory}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>										
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="FaqCategory_alias" style="width:100px"
						value="#{appBundle.faq_category_alias}" />
					<aon:inputText id="FaqCategory_alias"
						required="true" size="32" maxlength="32"
						value="#{faq_category.to.alias}" />

					<aon:outputLabel for="FaqCategoryDetail_label"
						value="#{appBundle.faq_category_label}" />
					<aon:inputText id="FaqCategoryDetail_label"
						required="true" size="50" maxlength="64"
						value="#{faq_category.toI18n.label}" />

					<aon:outputLabel for="FaqCategory_section"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="FaqCategory_section"  
						value="#{faq_category.to.section.id}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</aon:div>
		
			<rich:panel id="detail_panel" rendered="#{!faq_category.new and faq_category.toI18n.id != null}">
				<f:facet name="header">#{appBundle.faq}</f:facet>
				
				<aon:panelGrid columns="2" styleClass="none" columnClasses="aon-vertical-align-top,aon-vertical-align-top">
				
					<rich:panel id="detail_list_panel">
						<f:facet name="header">#{appBundle.aon_listing}</f:facet>
				
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<h:commandButton id="reset_list" value="#{bundle.aon_reset}"
										rendered="#{!faq.new}"
										action="faq_category_form"
										actionListener="#{faq.onReset}"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}"/>
									<aon:confirmButton id="remove_list"
										value="#{bundle.aon_remove}" 
										rendered="#{!faq.checklistEmpty and faq.to==null}" 
										immediate="#{true}"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{faq.onRemoveSelected}" 
										confirmAction="faq_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>
						
						<aon:dataTable id="dataTable" value="#{faq.model}" var="to"
							rows="#{faq.pageLimit}"
							styleClass="dr-table rich-table aon-editDataTable"
							headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
							footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
							rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
							cellpadding="0" cellspacing="0"
							columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn">
									
							<aon:column>
								<f:facet name="header">
									<aon:div>
										&nbsp;
									</aon:div>	
								</f:facet>
								<aon:selectBooleanCheckbox id="Row_checked"
										value="#{faq.rowChecked}">
										<a4j:support 
											event="onclick"  
											reRender="dataTable,buttonsGrid_list" />
								</aon:selectBooleanCheckbox>
							</aon:column>
					
							<aon:column>
								<a4j:support 
									immediate="#{true}"
									action="faq_category_form"
									actionListener="#{faq.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.faq_alias}"/>
								</f:facet>
								<aon:outputText value="#{to.alias}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>

							<aon:column>
								<a4j:support 
									immediate="#{true}"
									action="faq_category_form"
									actionListener="#{faq.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.faq_question}"/>
								</f:facet>
								<aon:outputText value="#{faq.i18nQuestion}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>
							
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.faq_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.faq_activate}" 
									action="faq_category_form"
									actionListener="#{faq.onActivate}"
									rendered="#{!to.active}">
									<aon:graphicImage id="faq_active" alt="#{appBundle.faq_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.faq_deactivate}" 
									action="faq_category_form"
									actionListener="#{faq.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="faq_deactive" alt="#{appBundle.faq_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText for="faq_position" value="#{appBundle.faq_position}" />
								</f:facet>
								<aon:graphicImage rendered="#{to.position == 0}"
									url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
								<h:commandButton id="moveUp" 
									action="faq_category_form"
									actionListener="#{faq.onMoveUp}" 
									rendered="#{to.position != 0 and faq.to==null}"
									image="/images/cms/up.gif" styleClass="aon-icon-commandButton" />
								<h:commandButton id="moveDown"
									action="faq_category_form"
									actionListener="#{faq.onMoveDown}"
									rendered="#{to.position &lt; (faq.model.rowCount - 1)  and faq.to==null}"
									image="/images/cms/down.gif" styleClass="aon-icon-commandButton" />
							</aon:column>

						</aon:dataTable>
							
					</rich:panel>
					
					<rich:panel id="detail_edit_panel" rendered="#{faq.new or faq.to != null}">
        				<f:facet name="header">#{faq.new?(bundle.aon_reset):(bundle.aon_editing)}</f:facet>
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list_form" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<h:commandButton id="save_list_form"
										value="#{bundle.aon_save}" 
										rendered="#{faq.to!=null or faq.new}"
										action="faq_category_form"
										actionListener="#{faq.onAccept}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										accesskey="#{bundle.aon_key_save}"/>
									<h:commandButton id="cancel_list_form"
										value="#{bundle.aon_cancel}" 
										rendered="#{faq.to!=null or faq.new}" immediate="#{true}"
										actionListener="#{faq.onCancel}" 
										action="faq_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}"/>
									<aon:confirmButton id="remove_list_form"
										value="#{bundle.aon_remove}" rendered="#{!faq.new}" 
										immediate="true"
										confirmTitle="Confirmation Dialog" 
										confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{faq.onRemove}" 
										confirmAction="faq_category_form"
										styleClass="aon-finding-toolbar-item aon-icon-delete"
										accesskey="#{bundle.aon_key_remove}"/>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>
			
						<aon:div styleClass="aon-scroll-area">
							<aon:panelGrid id="sidebarOptionGrid" columns="2" dir="true">

								<aon:outputLabel for="Faq_alias" style="width:100px"
									value="#{appBundle.faq_alias}" />
								<aon:inputText id="Faq_alias"
									required="true" size="32" maxlength="32"
									value="#{faq.to.alias}" />
	
								<aon:outputLabel for="FaqDetail_question"
									value="#{appBundle.faq_question}" />
								<aon:inputText id="FaqDetail_question"
									required="true" size="50" maxlength="64"
									value="#{faq.toI18n.question}" />
	
								<aon:outputLabel for="FaqDetail_answer" style="width:100px"
									value="#{appBundle.faq_answer}" />
								<aon:div style="width:600px">
									<aon:inputRichText style="width:100%" 
										id="FaqDetail_answer" 
										value="#{faq.toI18n.answer}" />
								</aon:div>
													
							</aon:panelGrid>
						</aon:div>
					</rich:panel>
				</aon:panelGrid>
			</rich:panel>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
