<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="activity_form">
		
			<aon:div ajaxRendered="true" layout="none">		
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{appBundle.activity}" />
					<ui:param name="controller" value="#{activity}" />
					<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
					<ui:define name="additionalToolbarContent" >
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="#{activity.getBack}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
						<aon:commandButton id="generate" reRender="aonStatus"
							value="#{appBundle.aon_generate}" 
							rendered="#{cms.roleEditor}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{generator.onGenerateActivity}" />
							<a4j:support 
								event="onclick" reRender="poll,grid" 
								actionListener="#{generator_status.onActivePoll}"  
								onclick="javascript:Richfaces.showModalPanel('showGeneratorLogModalPanel');" />
						</aon:commandButton>	
					</ui:define>
				</ui:decorate>
				
				<aon:div styleClass="aon-finding-title-toolbar">
					<aon:panelGrid columns="2" dir="true"
						columnClasses="aon-finding-title,aon-finding-toolbar">				
						
							<aon:outputLabel for="ActivityConfig_section"
								styleClass="aon-margin-right" value="#{appBundle.cms_section_default}"/>
								
							<aon:div styleClass="aon-finding-toolbar-item-group">					
	
								<aon:selectOneMenu id="ActivityConfig_section"  
									value="#{generator_config.section}">
									<f:selectItem itemLabel="-" value="#{null}" />
									<f:selectItems value="#{collections.sectionList}" />
								</aon:selectOneMenu>
							
								<aon:commandButton id="save"
									value="#{bundle.aon_save}"
									styleClass="aon-finding-toolbar-item aon-icon-accept">
									<aon:actionListener method="#{generator_config.onSaveActivityConfig}" />
								</aon:commandButton>
							</aon:div>		
					</aon:panelGrid>
				</aon:div>			
	
				<aon:div styleClass="aon-scroll-area">
	
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{activity}" />
						<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
						<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />						
						<ui:define name="columns">
	
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.cms_alias}" />
								</f:facet>
								<aon:outputText value="#{to.alias}"
									rendered="#{formList}" >
								</aon:outputText>	
								<aon:inputText value="#{to.alias}"
									id="#{to.id}_alias"
									rendered="#{formEdit}"
									required="#{true}" size="35" maxlength="32">
									<f:validator validatorId="AliasValidator" />
								</aon:inputText>
								<f:facet name="footer">
									<aon:inputText value="#{activity.to.alias}"
										id="new_alias"
										rendered="#{formNew}"
										required="#{true}" size="35" maxlength="32">
										<f:validator validatorId="AliasValidator" />
									</aon:inputText>
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{activity.i18nDescription}"
									rendered="#{formList}" >
								</aon:outputText>	
								<aon:inputText value="#{activity.toI18n.description}"
									id="#{to.id}_description"
									rendered="#{formEdit}"
									required="#{true}" size="70" maxlength="64" />
								<f:facet name="footer">
									<aon:inputText value="#{activity.toI18n.description}"
										id="new_description"
										rendered="#{formNew}"
										required="#{true}" size="70" maxlength="64" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Activity_section"
										value="#{appBundle.cms_section}" />
								</f:facet>
								<aon:outputText value="#{to.section.alias}" rendered="#{formList}" />	
								<aon:selectOneMenu id="Activity_section"  
									value="#{activity.to.section}" rendered="#{formEdit}">
									<f:selectItem itemLabel="-" value="#{null}" />
									<f:selectItems value="#{collections.sectionList}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu id="Activity_section-New"  
										value="#{activity.to.section}" rendered="#{formNew}">
										<f:selectItem itemLabel="-" value="#{null}" />
										<f:selectItems value="#{collections.sectionList}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>
						</ui:define>

					</ui:decorate>
				
				</aon:div>
			</aon:div>
			
		</aon:form>

		<ui:include src="/facelet/content/utils/gen_log_modal.xhtml" />

	</ui:define>
</ui:composition>
</body>
</html>
