<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>


<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="main_form">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="1" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.document_gallery}"/>	  						
					</aon:div>					
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">

					<aon:panelGrid columns="2"> 
								<aon:div styleClass="aon-finding-title-toolbar">
									<aon:panelGrid columns="1" dir="true" 
										columnClasses="aon-finding-toolbar">				
										<aon:div styleClass="aon-finding-toolbar-item-group">
											<aon:outputText value="#{document.currentRelativePath}"/>	  						
											<aon:commandButton value="#{bundle.aon_remove}"
												rendered="#{document.emptyDir}"
												action="document_list"
												actionListener="#{document.deleteFolder}"/>
										</aon:div>					
									</aon:panelGrid>
									<aon:panelGrid columns="1" dir="true" 
										columnClasses="aon-finding-toolbar">				
									
										<aon:div styleClass="aon-finding-toolbar-item-group">
											<aon:inputText 
												size="25" maxlength="30"
												value="#{document.folderName}">
												<f:validator validatorId="AliasValidator" />
											</aon:inputText>
											<aon:commandButton value="crear carpeta"
												action="document_list"
												actionListener="#{document.createFolder}"/>
										</aon:div>					
										
									</aon:panelGrid>
								</aon:div>
								<aon:fileUpload id="attach_file" 
										width="100%" 
										addControlLabel="#{appBundle.aon_upload_add}" 
										stopControlLabel="#{appBundle.aon_upload_stop}" 
										stopEntryControlLabel="#{appBundle.aon_upload_stop}"
										uploadControlLabel="#{appBundle.aon_upload_upload}"
										cancelEntryControlLabel="#{appBundle.aon_upload_cancel}"
										clearAllControlLabel="#{appBundle.aon_upload_clear_all}" 
										clearControlLabel="#{appBundle.aon_upload_clear}"
										doneLabel="#{appBundle.aon_upload_done}" 
										progressLabel="#{appBundle.aon_upload_progress}" 
										sizeErrorLabel="#{appBundle.aon_upload_size_error}" 
										transferErrorLabel="#{appBundle.aon_upload_transfer_error}" 
										fileUploadListener="#{document.fileUploaded}"
										immediateUpload="true" autoclear="false" listHeight="70px" listWidth="100%">
									<a4j:support event="onuploadcomplete" action="document_list" />
								</aon:fileUpload>
					            <rich:panel bodyClass="bodyGalleryImages">
								    <rich:tree
								    	switchType="server" 
								    	stateAdvisor="#{treeStateAdvisor}">
								        <rich:recursiveTreeNodesAdaptor roots="#{fileSystemBean.documentRoots}" 
								        	var="item" 
								        	nodes="#{item.nodes}">
											<rich:treeNode>
								                <aon:commandLink
								                	action="#{item.onSelectFolder}" 
								                	value="#{item}"
								                	immediate="#{true}"
								                	reRender="main_form" />
											</rich:treeNode>
								        </rich:recursiveTreeNodesAdaptor>
								    </rich:tree>
								</rich:panel>
					            <rich:panel bodyClass="bodyImages">
									<aon:panelGroup>
										<rich:dataList var="item" value="#{document.model}">	
											<aon:panelGrid columns="2" cellpadding="5px" cellspacing="0px">
												<aon:outputText value="#{item.name}"/>	  						
							            		<aon:div>
													<aon:commandButton
									                	action="document_list"
									                    actionListener="#{document.onDeleteFile}"
														image="/images/cms/icons/24x24-no.png">
													</aon:commandButton> 
							            		</aon:div>
											</aon:panelGrid>
										</rich:dataList>
									</aon:panelGroup>
								</rich:panel>					
					
					
					</aon:panelGrid>					
			</aon:div>
					
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
