<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">
		<aon:form id="list">

		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.product}"/>	  						
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{bundle.aon_search}" />
				</aon:div>					
					

				<!--  toolbar navigation -->
				<aon:div styleClass="aon-finding-toolbar-item-group">					
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						action="product_list"
						rendered="#{cms.roleEditor}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_search}">
						<aon:actionListener method="#{product.onSearch}" />
					</aon:commandButton>					
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="product_form"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}">
						<aon:actionListener method="#{product.onReset}" />
					</aon:commandButton>
					<aon:commandButton id="cancel"
						value="#{bundle.aon_cancel}"
						action="product_list" 
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}">
						<aon:actionListener method="#{product.onCancel}" />
					</aon:commandButton>
				</aon:div>			
			<!-- end toolbar navigation -->
			</aon:panelGrid>	
		</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="Product_alias"
						value="#{appBundle.product_alias}" />
					<aon:inputText id="Product_alias" size="50"
						valueChangeListener="#{product.addExpression}" />

					<aon:outputLabel for="Product_shortDesc"
						value="#{appBundle.product_shorLabel}" />
					<aon:inputText id="Product_shortDesc" size="50"
						value="#{product.shortDesc}" />

					<aon:outputLabel for="Product_productCategory_id"
						value="#{appBundle.product_category}"/>
					<aon:selectOneMenu id="Product_productCategory_id"  
						valueChangeListener="#{product.addExpression}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.categories}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Product_brand_id"
						value="#{appBundle.product_brand}"/>
					<aon:selectOneMenu id="Product_brand_id"  
						valueChangeListener="#{product.addExpression}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.brands}" />
					</aon:selectOneMenu>
	
				</aon:panelGrid>
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
