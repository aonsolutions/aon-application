<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="productCategoryList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.product_category}" />
				<ui:param name="controller" value="#{productCategory}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="exit"
						value="#{bundle.aon_close}"
						action="#{productCategory.getBack}" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>	

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="sectionGrid" columns="2" dir="true" 
					columnClasses="aon-finding-title,aon-finding-toolbar">				
				
					<aon:outputLabel for="ProductCategory_section"
						styleClass="aon-margin-right" value="#{appBundle.cms_section_default}"/>
						
					<aon:div styleClass="aon-finding-toolbar-item-group">					

						<aon:selectOneMenu id="ProductCategory_section"  
							value="#{generator_config.section}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{collections.sectionList}" />
						</aon:selectOneMenu>
						
						<aon:commandButton id="save"
							value="#{bundle.aon_save}"
							action="productCategory_list" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<aon:actionListener method="#{generator_config.onSaveProductCategoryConfig}" />
						</aon:commandButton>
					</aon:div>		
				</aon:panelGrid>
			</aon:div>
		
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
		
				<aon:dataTable id="dataTable" value="#{productCategory.model}" var="to"
					rows="#{productCategory.pageLimit}" rendered="#{productCategory.model.rowCount > 0}"
					columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,
							aon-editDataTable-textColumn, aon-editDataTable-iconColumn">

					<aon:rowSelector
						action="productCategory_form" actionListener="#{productCategory.onSelect}" />							
			
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_alias}" />
						</f:facet>
						<aon:outputText value="#{to.alias}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.product_category_label}" />
						</f:facet>
						<aon:outputText value="#{productCategory.i18nLabel}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.cms_section}" />
						</f:facet>
						<aon:outputText value="#{to.section.alias}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.product_category_active}" />
						</f:facet>
						<aon:div onmouseover="disableRowSelector();"
							onmouseout="enableRowSelector();" >																																					
							<aon:commandLink title="#{appBundle.product_category_activate}" 
								reRender="dataTable"
								actionListener="#{productCategory.onActivate}" 
								rendered="#{!to.active}">
								<aon:graphicImage id="ProductCategory_active" alt="#{appBundle.product_category_activate}"
									url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
							</aon:commandLink>
							<aon:commandLink title="#{appBundle.product_category_deactivate}" 
								reRender="dataTable"
								actionListener="#{productCategory.onDeactivate}" 
								rendered="#{to.active}">
								<aon:graphicImage id="ProductCategory_deactive" 
									alt="#{appBundle.product_category_deactivate}"
									url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
							</aon:commandLink>
						</aon:div>
					</aon:column>

				</aon:dataTable>
			
				<aon:dataScroller2 for="dataTable" showNote="true" />					

			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
