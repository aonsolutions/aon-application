<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.banner}" />
				<ui:param name="controller" value="#{banner}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
			</ui:include>		
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:param name="controller" value="#{banner}" />
				<ui:define name="searchContent">
			
					<aon:outputLabel for="Banner_alias"
						value="#{appBundle.cms_alias}" />
					<aon:inputText id="Banner_alias" size="50"
						valueChangeListener="#{banner.addExpression}" />

					<aon:outputLabel for="Banner_label"
						value="#{appBundle.banner_label}" />
					<aon:inputText id="Banner_label" size="50"
						value="#{banner.label}" />

					<aon:outputLabel for="Banner_url"
						value="#{appBundle.banner_url}" />
					<aon:inputText id="Banner_url" size="50"
						value="#{banner.url}" />

					<aon:outputLabel for="Banner_bannerCategory_id"
						value="#{appBundle.banner_category}"/>
					<aon:selectOneMenu id="Banner_bannerCategory_id"  
						valueChangeListener="#{banner.addExpression}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{collections.bannerGroupList}" />
					</aon:selectOneMenu>
	
					<aon:outputLabel for="Banner_position"
						value="#{appBundle.banner_position}" />
					<aon:inputText id="Banner_position" size="10"
						valueChangeListener="#{banner.addExpression}" />
						
					<aon:outputLabel for="Banner_active"
						value="#{appBundle.cms_active}" />
					<aon:selectOneMenu id="Banner_active"
						valueChangeListener="#{banner.addExpression}">
						<f:selectItem itemLabel="-"	itemValue="#{null}" />
						<f:selectItem itemLabel="#{bundle.aon_yes}" itemValue="true" />
						<f:selectItem itemLabel="#{bundle.aon_no}" itemValue="false" />
					</aon:selectOneMenu>												
						
				</ui:define>
			</ui:decorate>	
			
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
