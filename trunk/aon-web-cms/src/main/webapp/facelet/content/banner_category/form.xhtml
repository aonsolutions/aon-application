<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">
		<aon:form id="main_form" enctype="multipart/form-data">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.banner_category}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{banner_category.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">					
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							reRender="main_form"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}">
							<aon:actionListener method="#{banner_category.onReset}" />
						</aon:commandButton>
						<aon:commandButton id="save_new"
							value="#{bundle.aon_save}" 
							rendered="#{banner_category.new}"
							reRender="main_form"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{banner_category.accept}" />
						</aon:commandButton>
						<aon:commandButton id="save_edit"
							value="#{bundle.aon_save}" 
							rendered="#{banner_category.to!=null and !banner_category.new}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}">
							<aon:actionListener method="#{banner_category.accept}" />
						</aon:commandButton>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!banner_category.new}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{banner_category.onRemove}"
							confirmAction="banner_category_list"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="banner_category_list" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
							<aon:actionListener method="#{banner_category.onSearch}" />
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="main_panel" columns="2" dir="true">
	
					<aon:outputLabel for="BannerCategory_alias" style="width:100px"
						value="#{appBundle.article_category_alias}" />
					<aon:inputText id="BannerCategory_alias"
						required="true" size="32" maxlength="32"
						value="#{banner_category.to.alias}" />

					<aon:outputLabel for="BannerCategoryDetail_label"
						value="#{appBundle.article_category_label}" />
					<aon:inputText id="BannerCategoryDetail_label"
						size="50" maxlength="64"
						value="#{banner_category.toI18n.label}" />

					<aon:outputLabel for="BannerCategory_section"
						value="#{appBundle.section}"/>
					<aon:selectOneMenu id="BannerCategory_section"  
						value="#{banner_category.to.section.id}">
						<f:selectItem itemLabel="-" itemValue="-1" />
						<f:selectItems value="#{collections.sectionList}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>
			</aon:div>
		
			<rich:panel id="detail_panel" rendered="#{!banner_category.new and banner_category.toI18n.id != null}">
				
					<rich:panel id="detail_list_panel" rendered="#{banner.to == null}">
						<f:facet name="header">#{appBundle.banner} - #{appBundle.aon_listing}</f:facet>
				
						<aon:div styleClass="aon-finding-title-toolbar">
							<aon:panelGrid id="buttonsGrid_list" columns="1" dir="true" 
								columnClasses="aon-finding-toolbar">				
							
								<!-- start toolbar navigation -->
								<aon:div styleClass="aon-finding-toolbar-item-group">
									<aon:commandButton id="reset_list" value="#{bundle.aon_reset}"
										rendered="#{!banner.new}"
										reRender="detail_panel"
										styleClass="aon-finding-toolbar-item aon-icon-reset"
										accesskey="#{bundle.aon_key_new}">
										<aon:actionListener method="#{banner.onReset}" />
									</aon:commandButton>
							    </aon:div>
								
								<!-- end toolbar navigation -->
							</aon:panelGrid>
						</aon:div>

						<aon:dataTable id="dataTable" value="#{banner.model}" var="to"
							rows="#{banner.pageLimit}"
							styleClass="dr-table rich-table aon-editDataTable"
							headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
							footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
							rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
							cellpadding="0" cellspacing="0"
							columnClasses="dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn,
									dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
									dr-table-cell rich-table-cell aon-editDataTable-textColumn">
									
							<aon:column>
								<a4j:support 
									immediate="#{true}"
									reRender="detail_panel"
									actionListener="#{banner.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.banner_alias}"/>
								</f:facet>
								<aon:outputText value="#{to.alias}" 
									styleClass="aon-editDataTable-button" />
							</aon:column>

							<aon:column>
								<a4j:support 
									immediate="#{true}"
									reRender="detail_panel"
									actionListener="#{banner.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.banner_label}"/>
								</f:facet>
								<aon:outputText value="#{banner.i18nLabel}" 
									styleClass="aon-editDataTable-button"/>
							</aon:column>
				
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.banner_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.banner_activate}" 
									actionListener="#{banner.onActivate}"
									reRender="dataTable"
									rendered="#{!to.active}">
									<aon:graphicImage alt="#{appBundle.banner_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.banner_deactivate}" 
									actionListener="#{banner.onDeactivate}" 
									reRender="dataTable"
									rendered="#{to.active}">
									<aon:graphicImage alt="#{appBundle.banner_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>
				
							<aon:column>
								<f:facet name="header">
									<aon:outputText for="banner_position" 
										value="#{appBundle.banner_position}" />
								</f:facet>
								<aon:graphicImage rendered="#{to.position == 0}"
									url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
								<aon:commandButton  
									reRender="dataTable"
									actionListener="#{banner.onMoveUp}" 
									rendered="#{to.position != 0 and banner.to==null}"
									image="/images/cms/up.gif" styleClass="aon-icon-commandButton" />
								<aon:commandButton 
									reRender="dataTable"
									actionListener="#{banner.onMoveDown}"
									rendered="#{to.position &lt; (banner.model.rowCount - 1)  and banner.to==null}"
									image="/images/cms/down.gif" styleClass="aon-icon-commandButton" />
							</aon:column>
				
						</aon:dataTable>
						
						<aon:dataScroller for="dataTable"
							rowCount="#{banner.model.rowCount}" 
							showNote="true" />					
							
					</rich:panel>
					
					<rich:panel id="detail_edit_panel" rendered="#{banner.new or banner.to != null}">
        				<f:facet name="header">#{appBundle.banner} - #{banner.new?(bundle.aon_reset):(bundle.aon_editing)}</f:facet>

								<aon:div styleClass="aon-finding-title-toolbar">
									<aon:panelGrid id="buttonsGrid_list_form" columns="1" dir="true" 
										columnClasses="aon-finding-toolbar">				
										<aon:div styleClass="aon-finding-toolbar-item-group">
											<aon:commandButton id="reset_list_form" value="#{bundle.aon_reset}"
												rendered="#{!banner.new}"
												reRender="detail_panel"
												styleClass="aon-finding-toolbar-item aon-icon-reset"
												accesskey="#{bundle.aon_key_new}">
												<aon:actionListener method="#{banner.onReset}" />
											</aon:commandButton>
											<aon:commandButton id="save_list_form"
												value="#{bundle.aon_save}" 
												rendered="#{banner.to!=null or banner.new}"
												reRender="detail_panel"
												styleClass="aon-finding-toolbar-item aon-icon-accept"
												accesskey="#{bundle.aon_key_save}">
												<aon:actionListener method="#{banner.onAccept}" />
											</aon:commandButton>
											<aon:commandButton id="cancel_list_form"
												value="#{bundle.aon_cancel}" 
												rendered="#{banner.to!=null or banner.new}" immediate="#{true}"
												reRender="detail_panel"
												styleClass="aon-finding-toolbar-item aon-icon-cancel"
												accesskey="#{bundle.aon_key_cancel}">
												<aon:actionListener method="#{banner.onCancel}" />
											</aon:commandButton>
											<aon:confirmButton id="remove_list_form"
												value="#{bundle.aon_remove}" rendered="#{!banner.new}" 
												immediate="true"
												confirmAction="banner_category_form"
												confirmTitle="Confirmation Dialog" 
												confirmMessage="#{bundle.aon_remove_confirm}"
												confirmActionListener="#{banner.onRemove}" 
												styleClass="aon-finding-toolbar-item aon-icon-delete"
												accesskey="#{bundle.aon_key_remove}"/>
									    </aon:div>
										
									</aon:panelGrid>
								</aon:div>
					
								<aon:div styleClass="aon-scroll-area">
									<aon:panelGrid id="detailOptionGrid" columns="2" dir="true">
		
										<aon:outputLabel for="Banner_alias" style="width:100px"
											value="#{appBundle.banner_alias}" />
										<aon:inputText id="Banner_alias"
											required="true" size="32" maxlength="32"
											value="#{banner.to.alias}" />
						
										<aon:outputLabel for="BannerDetail_label"
											value="#{appBundle.banner_label}" />
										<aon:inputText id="BannerDetail_label"
											required="true" size="80" maxlength="255"
											value="#{banner.toI18n.label}" />
			
										<aon:outputLabel for="BannerDetail_url"
											value="#{appBundle.banner_url}" />
										<aon:inputText id="BannerDetail_url"
											size="80" maxlength="255"
											value="#{banner.toI18n.url}" />
			
										<aon:outputLabel for="BannerDetail_description"
											value="#{appBundle.banner_description}" />
										<aon:inputText id="BannerDetail_description"
											size="80" maxlength="255"
											value="#{banner.toI18n.description}" />
			
										<aon:outputLabel 
											value="#{appBundle.banner_image}" />
										<aon:panelGroup id="thumbnail_preview">
											<aon:graphicImage 
												url="#{banner.toI18n.image}.thumbnail" 
												alt="#{banner.toI18n.image}"/>
							                <aon:commandLink
							                	immediate="#{true}"
							                	reRender="thumbnail_preview"
							                    actionListener="#{banner.onDelImage}">
												<aon:graphicImage url="/images/cms/inactive.png" />
							        		</aon:commandLink>
											<ui:include src="/facelet/content/utils/image_modal.xhtml">
												<ui:param name="modalPanelName" value="mp2" />
												<ui:param name="roots" value="#{fileSystemBean.imageRoots}" />
												<ui:param name="galleryBean" value="#{gallery}" />
												<ui:param name="listenerBean" value="#{banner}" />
												<ui:param name="reRender" value="thumbnail_preview" />
												<ui:param name="image" value="#{true}" />
												<ui:param name="thumbnail" value="#{false}" />
											</ui:include>
					
							        	</aon:panelGroup>
							        </aon:panelGrid>
								</aon:div>

					</rich:panel>

			</rich:panel>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
