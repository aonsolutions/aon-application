<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="menuOptionForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.menu_option}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{menu_option.new?(bundle.aon_reset):(bundle.aon_editing)} #{menu_option.currentMenu.alias}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" 
							rendered="#{menu_option.to!=null or menu_option.new}"
							actionListener="#{menu_option.onAccept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:commandButton id="cancel"
							value="#{bundle.aon_cancel}" 
							rendered="#{menu_option.to!=null or menu_option.new}" immediate="#{true}"
							actionListener="#{menu_option.onCancel}" action="menu_option_list"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!menu_option.new}" 
							immediate="true"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{menu_option.onRemoveI18n}" 
							confirmAction="menu_option_form"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="search"
							value="#{bundle.aon_search}" immediate="true"
							action="menu_option_search" actionListener="#{menu_option.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}"/>
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{menu_option.onReset}" rendered="#{!menu_option.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuOptionGrid" columns="2" dir="true">

					<aon:outputLabel for="MenuOption_alias" style="width:100px"
						value="#{appBundle.menu_option_alias}" />
					<aon:inputText id="MenuOption_alias"
						required="true" size="32" maxlength="32"
						value="#{menu_option.to.alias}" />

					<aon:outputLabel for="MenuOptionDetail_label"
						value="#{appBundle.menu_option_label}" />
					<aon:inputText id="MenuOptionDetail_label"
						required="true" size="50" maxlength="64"
						value="#{menu_option.toI18n.label}" />

					<aon:outputLabel for="MenuOption_type"
						value="#{appBundle.menu_option_type}" />
					<aon:selectOneMenu id="MenuOption_type" 
						value="#{menu_option.to.type}" >
						<f:selectItems value="#{collections.pageTypes}">
						</f:selectItems>
							<a4j:support 
								event="onchange"  
								reRender="menuOptionGrid" />
					</aon:selectOneMenu> 

					<aon:outputLabel for="MenuOption_level"
						value="#{appBundle.menu_option_level}" rendered="#{menu_option.visibleLevel}"/>
					<aon:selectOneMenu id="MenuOption_level" rendered="#{menu_option.visibleLevel}" 
						value="#{menu_option.to.level}">
						<f:selectItems value="#{menu_option.levels}">
						</f:selectItems>
							<a4j:support 
								event="onchange"  
								reRender="menuOptionGrid" />
					</aon:selectOneMenu>

					<aon:outputLabel for="MenuOption_ident"
						value="#{appBundle.menu_option_ident}" rendered="#{menu_option.visibleIdent}"/>
					<aon:selectOneMenu id="MenuOption_ident" rendered="#{menu_option.visibleIdent}" 
						value="#{menu_option.to.ident}">
						<f:selectItems value="#{menu_option.idents}" />
					</aon:selectOneMenu> 

					<aon:outputLabel for="MenuOptionDetail_url"
						value="#{appBundle.menu_option_url}" rendered="#{menu_option.visibleUrl}"/>
					<aon:inputText id="MenuOptionDetail_url" rendered="#{menu_option.visibleUrl}"
						size="100" maxlength="255"
						value="#{menu_option.toI18n.url}" />

				</aon:panelGrid>
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
