<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="menuOptionList">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
				
					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.menu_option}"/>	  						
					</aon:div>					
					
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.aon_listing} #{menu_option.currentMenu.alias}" />
					</aon:div>					
						
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							action="menu_option_form" actionListener="#{menu_option.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" 
							rendered="#{!menu_option.checklistEmpty}" 
							inmediate="true"
							confirmTitle="Confirmation Dialog" 
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{menu_option.onRemoveSelected}" 
							confirmAction="menu_option_list"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="exit" value="#{bundle.aon_close}"
							action="menu_grid" 
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}"/>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
					<aon:dataTable id="dataTable" value="#{menu_option.model}" var="to"
						rows="20" styleClass="dr-table rich-table aon-editDataTable"
						headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
						footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
						rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
						cellpadding="0" cellspacing="0"
						columnClasses="dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-iconColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn">
								
							<aon:column>
								<f:facet name="header">
									<aon:div>
										<aon:outputText value="#{bundle.aon_check}" />
									</aon:div>	
								</f:facet>
								<aon:selectBooleanCheckbox id="Row_checked"
										value="#{menu_option.rowChecked}">
										<a4j:support 
											event="onclick"  
											reRender="dataTable,buttonsGrid" />
								</aon:selectBooleanCheckbox>
							</aon:column>
					
							<aon:column>
								<a4j:support 
									action="menu_option_form"
									actionListener="#{menu_option.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_option_alias}" />
								</f:facet>
								<aon:outputText value="#{to.alias}"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_option_separator}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.menu_option_separator}" action="menu_option_list"
									actionListener="#{menu_option.onSetSeparator}" 
									rendered="#{!to.separator}">
									<aon:graphicImage id="MenuOption_unselected" alt="#{appBundle.menu_option_separator}"
										url="/images/cms/unselected.gif" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.menu_option_separator}" action="menu_option_list"
									actionListener="#{menu_option.onUnsetSeparator}" 
									rendered="#{to.separator}">
									<aon:graphicImage id="MenuOption_selected" alt="#{appBundle.menu_option_separator}"
										url="/images/cms/selected.gif" />
								</aon:commandLink>
							</aon:column>

							<aon:column>
								<a4j:support 
									action="menu_option_form"
									actionListener="#{menu_option.onSelect}"
									event="onclick" />
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_option_label}" />
								</f:facet>
								<aon:outputText value="#{menu_option.i18nLabel}" 
									style="font-weight:bold"
									rendered="#{to.separator}"/>
								<aon:outputText value="#{ menu_option.i18nLabel}"
									rendered="#{!to.separator}" style="padding-left:20px"/>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_option_active}" />
								</f:facet>
								<aon:commandLink title="#{appBundle.menu_option_activate}" action="menu_option_list"
									actionListener="#{menu_option.onActivate}" 
									rendered="#{!to.active}">
									<aon:graphicImage id="MenuOption_active" alt="#{appBundle.menu_option_activate}"
										url="/images/cms/inactive.png" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.menu_option_deactivate}" action="menu_option_list"
									actionListener="#{menu_option.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="MenuOption_deactive" alt="#{appBundle.menu_option_deactivate}"
										url="/images/cms/active.png" />
								</aon:commandLink>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText for="MenuOption_position" value="#{appBundle.menu_option_position}" />
								</f:facet>
								<aon:graphicImage rendered="#{to.position == 0}"
									url="/images/cms/spacer16.gif" style="margin-left: 8px;"/>
								<aon:commandButton id="moveUp" 
									reRender="dataTable"
									actionListener="#{menu_option.onMoveUp}" 
									rendered="#{to.position != 0}"
									image="/images/cms/up.gif" style="margin-left: 4px;"/>
								<aon:commandButton id="moveDown"
									reRender="dataTable" 
									actionListener="#{menu_option.onMoveDown}"
									rendered="#{to.position &lt; (menu_option.model.rowCount - 1)}"
									image="/images/cms/down.gif" style="margin-left: 4px;" />
							</aon:column>

						</aon:dataTable>
						
						<aon:dataScroller dataTable="dataTable"
							model="#{menu_option.model}" showNote="true" />					
					
				</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
