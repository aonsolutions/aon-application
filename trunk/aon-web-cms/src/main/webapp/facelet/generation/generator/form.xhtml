<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="generatorForm">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-toolbar">				
				
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="generate"
							value="#{appBundle.aon_generate}" 
							reRender="generatorForm"
							actionListener="#{generator.onGenerate}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept" />
						<aon:commandButton id="all"
							action="generator_form" 
							value="#{bundle.aon_check_all}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{generator.onSelectAll}"/>
						<aon:commandButton id="none"
							action="generator_form" 
							value="#{bundle.aon_uncheck_all}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{generator.onDeselectAll}" />
						<aon:commandButton id="publish"
							value="#{appBundle.aon_generate}" 
							reRender="generatorForm"
							rendered="#{generator.generated}"
							actionListener="#{generator.onPublish}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept" />
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width:99%;">
					<aon:panelGrid columns="4" dir="true" >
						<aon:panelGrid columns="2" dir="true" >

							<aon:outputLabel for="isModularPageToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isModularPageToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isModularPageToGenerate" 
									value="#{generator.modularPageToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isMenuToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isMenuToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isMenuToGenerate" 
									value="#{generator.menuToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isGenericToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isGenericToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isGenericToGenerate" 
									value="#{generator.genericToGenerate}" />
							</aon:div>
							
						</aon:panelGrid>
						
						<aon:panelGrid columns="2" dir="true" >
						
							<aon:outputLabel for="isFaqToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isFaqToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isFaqToGenerate" 
									value="#{generator.faqToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isLinkToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isLinkToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isLinkToGenerate" 
									value="#{generator.linkToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isDirectAccessToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isDirectAccessToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isDirectAccessToGenerate" 
									value="#{generator.directAccessToGenerate}" />
							</aon:div>
							
						</aon:panelGrid>
						
						<aon:panelGrid columns="2" dir="true" >
						
							<aon:outputLabel for="isAlbumToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isAlbumToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isAlbumToGenerate" 
									value="#{generator.albumToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isArticleToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isArticleToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isArticleToGenerate" 
									value="#{generator.articleToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isDownloadsToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isDownloadsToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isDownloadsToGenerate" 
									value="#{generator.downloadsToGenerate}" />
							</aon:div>
							
						</aon:panelGrid>
						
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
	    <a4j:region>
	        <h:form>
	            <a4j:poll id="poll" interval="2000" enabled="#{true}" reRender="poll,grid,grid_errors"/>
	        </h:form>
	    </a4j:region>
		<h:form>
			<rich:panel bodyClass="inpanelBody" id="grid_errors">
	        	<f:facet name="header">
	                    Error Console Log
	            </f:facet>
		        <rich:dataList id="dataList_Error" var="msg" value="#{generator_status.errors}" rows="5">
					<h:outputText style="color:red;" value="#{msg}"/>
				</rich:dataList>
				<rich:datascroller align="left"  for="dataList_Error" maxPages="20" />
			</rich:panel>
		</h:form>
		<h:form>
			<br/>
			<rich:separator height="2" lineType="dashed"/><br/>
			<rich:panel bodyClass="inpanelBody" id="grid">
	        	<f:facet name="header">
	                    Console Log
	            </f:facet>
		        <rich:dataList id="dataList" var="msg" value="#{generator_status.status}" rows="15">
					<h:outputText value="#{msg}"/>
				</rich:dataList>
				<rich:datascroller align="left"  for="dataList" maxPages="20" />
			</rich:panel>
	    </h:form>    
	</ui:define>
</ui:composition>

</body>
</html>
