<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="generatorForm">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-toolbar">				
				
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="generate"
							value="#{appBundle.aon_generate}" 
							reRender="generatorForm"
							actionListener="#{generator.onGenerate}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<a4j:support 
								event="onclick"
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid,grid_errors" />
						</aon:commandButton>
						<aon:commandButton id="all"
							action="generator_form" 
							value="#{bundle.aon_check_all}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{generator.onSelectAll}"/>
						<aon:commandButton id="none"
							action="generator_form" 
							value="#{bundle.aon_uncheck_all}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{generator.onDeselectAll}" />
						<aon:confirmButton id="publish_no_ok"
							rendered="#{generator_status.generated and !generator_status.correct}"
							value="#{appBundle.aon_publish}" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							confirmTitle="#{appBundle.aon_publish_modal_title}" 
							confirmMessage="#{appBundle.aon_publish_modal_msg}"
							confirmActionListener="#{generator_status.onPublish}"
							accesskey="#{bundle.aon_key_remove}">
							<a4j:support 
								event="onclick"
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid,grid_errors" />
						</aon:confirmButton>
						<aon:commandButton id="publish_ok"
							value="#{appBundle.aon_publish}" 
							reRender="generatorForm"
							rendered="#{generator_status.generated and generator_status.correct}"
							actionListener="#{generator_status.onPublish}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept">
							<a4j:support 
								event="onclick"
								actionListener="#{generator_status.onActivePoll}"  
								reRender="poll,grid,grid_errors" />
						</aon:commandButton>
						
						<h:outputLink 
							id="preview_url"
							rendered="#{generator_status.generated and generator_status.correct}"
							value="#{generator_status.previewURL}" 
							target="_blank"
							style="line-height:18px;">
							PREVIEW
						</h:outputLink>
							
						<h:outputLink 
							id="web_url"
							rendered="#{generator_status.published}"
							value="#{generator_status.webURL}" 
							target="_blank"
							style="line-height:18px;">
							WEB
						</h:outputLink>
						
						<aon:commandButton id="exit"
							value="#{bundle.aon_close}"
							action="home" 
							immediate="#{true}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							accesskey="#{bundle.aon_key_close}">
						</aon:commandButton>
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width:99%;">
					<aon:panelGrid columns="5" dir="true" >
						<aon:panelGrid columns="2" dir="true" >

							<aon:outputLabel for="isModularPageToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isModularPageToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isModularPageToGenerate" 
									value="#{generator.modularPageToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isGenericToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isGenericToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isGenericToGenerate" 
									value="#{generator.genericToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isArticleNEWSToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isArticleNEWSToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isArticleNEWSToGenerate" 
									value="#{generator.articleNEWSToGenerate}" />
							</aon:div>
							
						</aon:panelGrid>

						<aon:panelGrid columns="2" dir="true" >

							<aon:outputLabel for="isArticleEVENTSToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isArticleEVENTSToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isArticleEVENTSToGenerate" 
									value="#{generator.articleEVENTSToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isArticleSERVICESToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isArticleSERVICESToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isArticleSERVICESToGenerate" 
									value="#{generator.articleSERVICESToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isArticleOTHERToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isArticleOTHERToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isArticleOTHERToGenerate" 
									value="#{generator.articleOTHERToGenerate}" />
							</aon:div>
							
						</aon:panelGrid>
						
						<aon:panelGrid columns="2" dir="true" >
						
							<aon:outputLabel for="isArticleCalendarToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isArticleCalendarToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isArticleCalendarToGenerate" 
									value="#{generator.articleCalendarToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isLinkToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isLinkToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isLinkToGenerate" 
									value="#{generator.linkToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isDirectAccessToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isDirectAccessToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isDirectAccessToGenerate" 
									value="#{generator.directAccessToGenerate}" />
							</aon:div>
							
						</aon:panelGrid>
						
						<aon:panelGrid columns="2" dir="true" >
						
							<aon:outputLabel for="isFaqToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isFaqToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isFaqToGenerate" 
									value="#{generator.faqToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isAlbumToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isAlbumToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isAlbumToGenerate" 
									value="#{generator.albumToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isDownloadsToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isDownloadsToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isDownloadsToGenerate" 
									value="#{generator.downloadsToGenerate}" />
							</aon:div>
							
						</aon:panelGrid>

						<aon:panelGrid columns="2" dir="true" >
						
							<aon:outputLabel for="isHiruCourseToGenerate"
								rendered="#{domainUtils.hiruMenu}"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isHiruCourseToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isHiruCourseToGenerate" 
									value="#{generator.hiruCoursesToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isProductsToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isProductsToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isProductsToGenerate" 
									value="#{generator.productsToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isSportsToGenerate"
								rendered="#{domainUtils.sportMenu}"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isSportsToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isSportsToGenerate" 
									value="#{generator.sportsToGenerate}" />
							</aon:div>
							
						</aon:panelGrid>						
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
	    <a4j:region>
	        <h:form>
	            <a4j:poll id="poll" interval="2000" enabled="#{generator_status.activePoll}" reRender="poll,grid,grid_errors"/>
	        </h:form>
	    </a4j:region>
		<h:form>
			<rich:panel bodyClass="inpanelBody" id="grid_errors">
	        	<f:facet name="header">
	                    Error Console Log
	            </f:facet>
		        <rich:dataList id="dataList_Error" var="msg" value="#{generator_status.errors}" rows="10">
					<h:outputText style="color:red;" value="#{msg}"/>
				</rich:dataList>
				<rich:datascroller align="left"  for="dataList_Error" maxPages="20" />
			</rich:panel>
		</h:form>
		<h:form>
			<br/>
			<rich:separator height="2" lineType="dashed"/><br/>
			<rich:panel bodyClass="inpanelBody" id="grid">
	        	<f:facet name="header">
	                    Console Log
	            </f:facet>
		        <rich:dataList id="dataList" var="msg" value="#{generator_status.status}" rows="10">
					<h:outputText value="#{msg}"/>
				</rich:dataList>
				<rich:datascroller align="left"  for="dataList" maxPages="20" />
			</rich:panel>
	    </h:form>    
	</ui:define>
</ui:composition>

</body>
</html>
