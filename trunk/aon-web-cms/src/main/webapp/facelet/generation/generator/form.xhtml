<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="headerForm">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
					columnClasses="aon-finding-toolbar">				
				
					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="generate"
							value="#{appBundle.aon_generate}" 
							actionListener="#{generator.onGenerate}" 
							styleClass="aon-finding-toolbar-item aon-icon-accept" />
						<aon:commandButton id="all"
							action="generator_form" 
							value="#{bundle.aon_check_all}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{generator.onSelectAll}"/>
						<aon:commandButton id="none"
							action="generator_form" 
							value="#{bundle.aon_uncheck_all}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{generator.onDeselectAll}" />
				    </aon:div>
					
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width:99%;">
	
						<aon:panelGrid columns="2" dir="true" >

							<aon:outputLabel for="isLanguajePageToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isLanguajePageToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isLanguajePageToGenerate" 
									value="#{generator.languajePageToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isModularPageToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isModularPageToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isModularPageToGenerate" 
									value="#{generator.modularPageToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isMenuToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isMenuToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isMenuToGenerate" 
									value="#{generator.menuToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isGenericToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isGenericToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isGenericToGenerate" 
									value="#{generator.genericToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isFaqToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isFaqToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isFaqToGenerate" 
									value="#{generator.faqToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isLinkToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isLinkToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isLinkToGenerate" 
									value="#{generator.linkToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isDirectAccessToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isDirectAccessToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isDirectAccessToGenerate" 
									value="#{generator.directAccessToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isAlbumToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isAlbumToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isAlbumToGenerate" 
									value="#{generator.albumToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isArticleToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isArticleToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isArticleToGenerate" 
									value="#{generator.articleToGenerate}" />
							</aon:div>
							
							<aon:outputLabel for="isDownloadsToGenerate"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.isDownloadsToGenerate}" />
							<aon:div>
								<aon:selectBooleanCheckbox id="isDownloadsToGenerate" 
									value="#{generator.downloadsToGenerate}" />
							</aon:div>
							
						</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
    <a4j:region>
        <h:form>
            <a4j:poll id="poll" interval="5000" enabled="#{true}" reRender="poll,grid"/>
        </h:form>
    </a4j:region>
	<h:form>
        <h:panelGrid columns="2" width="80%" id="grid">
	        <rich:dataList var="msg" value="#{generator_status.status}" rows="0">
				<h:outputText value="#{msg}"/>
			</rich:dataList>
        </h:panelGrid>  
    </h:form>    
	</ui:define>
</ui:composition>

</body>
</html>
