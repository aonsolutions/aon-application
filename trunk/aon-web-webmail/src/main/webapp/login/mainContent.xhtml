<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components" version="1.2">

<body>
<ui:composition>

	<aon:panelGrid style="width:100%;" columns="2" columnClasses="aon-login-box-left,aon-login-box-right">

		<aon:outputLabel for="j_username_view" value="#{securityBundle.aon_login_user}:" styleClass="aon-login-label" />
		<input type="text" id="j_username_view" name="j_username_view" class="aon-login-input"/>
		
		<aon:outputLabel for="j_password" value="#{securityBundle.aon_login_passwd}:"  styleClass="aon-login-label"/>
		<input type="password" id="j_password" name="j_password" class="aon-login-input" />
		
		<aon:outputLabel for="login_btn" value="" />
		<input id="login_btn" name="login_btn" type="submit" value="Validar" 
					onclick="concatHost();" class="aon-login-button"/>
	</aon:panelGrid>
	<input type="hidden" id="j_username" name="j_username" />
<script>
	document.getElementById("j_username_view").focus();
</script>
</ui:composition>
</body>
</html>
