<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="list">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid id="buttonsGrid" columns="3" dir="true" 
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
			
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{appBundle.aon_webmail_mailAccount}" />
				</aon:div>					
				
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText value="#{bundle.aon_listing}" />
				</aon:div>				
				
				<aon:div styleClass="aon-section-toolbar">				
					<aon:commandButton
						id="back"
						title="#{appBundle.aon_webmail_back}"
						value="#{appBundle.aon_webmail_back}"
						action="folder"
						styleClass="aon-finding-toolbar-item aon-icon-cancel">
					</aon:commandButton>									
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						action="mailAccount_form" actionListener="#{mailAccount.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-newMailAccount"
						accesskey="#{bundle.aon_key_new}"/>			   
				</aon:div>
			</aon:panelGrid>
		</aon:div>

		<!--  aon-region-body -->
		<aon:div styleClass="aon-scroll-area">

					<aon:outputText value="#{mailAccount.error}"/>
					
					<aon:dataTable id="dataTable" value="#{mailAccount.model}" var="to"
						rows="20" 
						styleClass="dr-table rich-table aon-editDataTable"
						headerClass="dr-table-subheader rich-table-subheader aon-editDataTable-header"
						footerClass="dr-table-subfooter rich-table-subfooter aon-editDataTable-footer"
						rowClasses="aon-editDataTable-row-odd,dr-table-firstrow rich-table-firstrow aon-editDataTable-row-even"
						cellpadding="0" cellspacing="0"
						columnClasses="dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-textColumn,
								dr-table-cell rich-table-cell aon-editDataTable-iconColumn">
				
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_webmail_mailAccount_name}" />
							</f:facet>
							<aon:outputText value="#{to.email}"
								styleClass="aon-editDataTable-button"
								rendered="#{!mailAccount.currentToDefaultAccount}">
								<a4j:support
									action="mailAccount_form"
									actionListener="#{mailAccount.onSelect}"
									event="onclick" />
							</aon:outputText>
							<aon:outputText value="#{to.email}"
								styleClass="aon-editDataTable-button"
								rendered="#{mailAccount.currentToDefaultAccount}"/>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_webmail_mailAccount_active}" />
							</f:facet>
							<aon:outputText value="#{appBundle.aon_webmail_mailAccount_user_account}" 
								styleClass="aon-editDataTable-button"
								rendered="#{!mailAccount.currentToDefaultAccount}">
								<a4j:support
									action="mailAccount_form"
									actionListener="#{mailAccount.onSelect}"
									event="onclick" />
							</aon:outputText>
							<aon:outputText value="#{appBundle.aon_webmail_mailAccount_default_account}" 
								styleClass="aon-editDataTable-button"
								rendered="#{mailAccount.currentToDefaultAccount}"/>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&nbsp;" />
							</f:facet>
							<aon:commandButton
								id="mailAccountChange"
								title="#{appBundle.aon_webmail_mailAccountChange}"
								actionListener="#{mailAccount.onChangeServer}"
								value="#{appBundle.aon_webmail_mailAccountChange}"
								styleClass="aon-icon-commandButton aon-icon-mailAccountChange">
							</aon:commandButton>
						</aon:column>
						
					</aon:dataTable>
				
					<aon:div styleClass="aon-dataScroller">
						<rich:datascroller align="left"  for="dataTable" maxPages="20" />
					</aon:div>


			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
