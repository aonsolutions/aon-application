<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="webmailForm">

			<aon:div id="aon-scroll-area">
				<aon:div id="aon-scroll-area-internal" styleClass="aon-scroll-area-internal">

					<ui:include src="/webmail/facelet/webmailButtons.xhtml" />	

					<aon:panelGrid columns="2" cellpadding="0" cellspacing="0" style="width:100%"
					columnClasses="aon-menu-sidebar,aon-content-area">
						
						<ui:include src="/webmail/facelet/webmailTree.xhtml" />	
						
						<aon:panelGroup>
							<aon:div styleClass="aon-section-title">
								<aon:outputText value="Mensaje" />
							</aon:div>
							<aon:div styleClass="aon-section-toolbar">
								<aon:commandButton
									id="back"
									title="#{appBundle.aon_webmail_back}"
									value="#{appBundle.aon_webmail_back}"
									action="#{message.getReturnAction}"
									styleClass="aon-content-toolbar-item aon-icon-cancel">
								</aon:commandButton>									
							
								<!-- Reply to message  -->									
								<aon:commandButton
										id="replyButton"
										title="#{appBundle.aon_webmail_newmail_reply}"
										action="messageNew"
										actionListener="#{message.replyToSelectedMessage}"
										value="#{appBundle.aon_webmail_newmail_reply}"
										styleClass="aon-content-toolbar-item aon-icon-mailReply"
										>
								</aon:commandButton>									
				
								<!-- Reply to all button  -->										
								<aon:commandButton
										id="replyAllButton"
										title="#{appBundle.aon_webmail_newmail_replyAll}"
										action="messageNew"
										actionListener="#{message.replyToAllMessage}"
										value="#{appBundle.aon_webmail_newmail_replyAll}"
										styleClass="aon-content-toolbar-item aon-icon-mailReplyAll">
								</aon:commandButton>							
				
								<!-- Forward button  -->
								<aon:commandButton
										id="forwardButton"
										title="#{appBundle.aon_webmail_newmail_forward}"
										action="messageNew"
										actionListener="#{message.forwardMessage}"
										value="#{appBundle.aon_webmail_newmail_forward}"
										styleClass="aon-content-toolbar-item aon-icon-mailForward">
								</aon:commandButton>					
				
								<!-- Delete button  -->
								<aon:commandButton
										id="deleteButton"
										title="#{appBundle.aon_webmail_deletemail}"
										action="#{message.getDeleteReturnAction}"
										actionListener="#{message.deleteSelectedMessageAndMove}"
										value="#{appBundle.aon_webmail_deletemail}"
										styleClass="aon-content-toolbar-item aon-icon-mailDelete">
								</aon:commandButton>									
							
								<h:outputLink 
									id="save"
									value="#{webmail.context}/webmail/save.jsp" 
									target="_blank"
									styleClass="aon-icon aon-icon-mail-save aon-content-toolbar-item"
									style="line-height:16px;">
									<aon:outputText value="#{appBundle.aon_webmail_save}" />
								</h:outputLink>
							
								<h:outputLink 
									id="print"
									value="#{webmail.context}/webmail/print.jsp" 
									target="_blank"
									styleClass="aon-icon aon-icon-printer aon-content-toolbar-item"
									style="line-height:16px;">
									<aon:outputText value="#{appBundle.aon_webmail_print}" />
								</h:outputLink>
									
								<!-- Move button  -->
								<aon:commandButton
										id="moveButton"
										title="#{appBundle.aon_webmail_movemail}"
										actionListener="#{message.openFoldersPanelPopup}"
										value="#{appBundle.aon_webmail_movemail}"
										styleClass="aon-content-toolbar-item aon-icon-mail-move">
								</aon:commandButton>									
								
							</aon:div>
							
							<aon:commandButton
									title="#{appBundle.aon_webmail_previous_message}"
									rendered="#{message.previousMessage}"
									action="message"
									actionListener="#{message.previousMessage}"
									value="#{appBundle.aon_webmail_previous_message}"
									styleClass="aon-icon-commandButton aon-icon-mailPrevious">
							</aon:commandButton>

							<aon:commandButton
									title="#{appBundle.aon_webmail_previous_message}"
									rendered="#{!message.previousMessage}"
									value="#{appBundle.aon_webmail_previous_message}"
									styleClass="aon-icon-commandButton aon-icon-mailPrevious-dis">
							</aon:commandButton>

							<aon:commandButton
									title="#{appBundle.aon_webmail_next_message}"
									rendered="#{message.nextMessage}"
									action="message"
									actionListener="#{message.nextMessage}"
									value="#{appBundle.aon_webmail_next_message}"
									styleClass="aon-icon-commandButton aon-icon-mailNext">
							</aon:commandButton>
							
							<aon:commandButton
									title="#{appBundle.aon_webmail_next_message}"
									rendered="#{!message.nextMessage}"
									value="#{appBundle.aon_webmail_next_message}"
									styleClass="aon-icon-commandButton aon-icon-mailNext-dis">
							</aon:commandButton>
							
							<!-- icon to collapse message details -->
							<aon:div styleClass="aon-box aon-box-outstanding" >
				
									<aon:panelGrid columns="2" cellpadding="2">
										
										<!-- from -->
										<aon:outputText styleClass="aon-text-bold"											
											value="#{appBundle.aon_webmail_from}: " />
										<aon:div>
											<aon:outputText escape="false" converter="longString" value="#{message.message.sender}" />
											<aon:commandButton
												id="addToContacts"
												title="#{appBundle.aon_webmail_email_add}"
												actionListener="#{message.addToContacts}"
												value="#{appBundle.aon_webmail_email_add}"
												styleClass="aon-icon-commandButton aon-icon-agenda aon-italic aon-bold">
											</aon:commandButton>
											<aon:confirmButton id="add_white_list"
												rendered="#{blacklist.whiteListEmail}"
												value="#{appBundle.aon_webmail_add_white_list}" 
												styleClass="aon-icon-commandButton aon-icon-white-list aon-italic aon-bold"
												confirmTitle="Confirmation Dialog" 
												confirmMessage="#{appBundle.aon_webmail_add_white_list}"
												confirmActionListener="#{blacklist.onAddWhiteMessageFrom}" />
											<aon:confirmButton id="add_black_list"
												rendered="#{blacklist.blackListEmail}"
												value="#{appBundle.aon_webmail_add_black_list}" 
												styleClass="aon-icon-commandButton aon-icon-black-list aon-italic aon-bold"
												confirmTitle="Confirmation Dialog" 
												confirmMessage="#{appBundle.aon_webmail_add_black_list}"
												confirmActionListener="#{blacklist.onAddBlackMessageFrom}" />
										</aon:div>
										
										<!-- To -->
										<aon:outputText styleClass="aon-text-bold"
													value="#{appBundle.aon_webmail_to}: " />
										<aon:div>
											<aon:panelGrid columns="2" cellpadding="0"
												cellspacing="0">
												<aon:div>
													<aon:commandButton
														rendered="#{message.shotMessageToControlDown}" 
														actionListener="#{message.changeShotMessageTo}"
														styleClass="aon-icon-commandButton aon-icon-drop-down">
													</aon:commandButton>
													<aon:commandButton
														rendered="#{message.shotMessageToControlUp}" 
														actionListener="#{message.changeShotMessageTo}"
														styleClass="aon-icon-commandButton aon-icon-drop-up">
													</aon:commandButton>
												</aon:div>
												<aon:div>
													<aon:outputText escape="false"
														rendered="#{!message.shotMessageTo}" 
														converter="maxLenghtString" 
														value="#{message.message.recipientsTo}" />
													<aon:outputText escape="false" 
														rendered="#{message.shotMessageTo}" 
														converter="longString" 
														value="#{message.message.recipientsTo}" />
													<aon:outputText escape="false"
														rendered="#{message.shotMessageToControlDown}" 
														value="..." />
												</aon:div>
											</aon:panelGrid>
										</aon:div>
										<!-- Cc -->
										<aon:outputText styleClass="aon-text-bold"
												value="#{appBundle.aon_webmail_cc}: " />
										<aon:div>
											<aon:panelGrid columns="2" cellpadding="0"
												cellspacing="0">
												<aon:div>
													<aon:commandButton
														rendered="#{message.shotMessageCcControlDown}" 
														actionListener="#{message.changeShotMessageCc}"
														styleClass="aon-icon-commandButton aon-icon-drop-down">
													</aon:commandButton>
													<aon:commandButton
														rendered="#{message.shotMessageCcControlUp}" 
														actionListener="#{message.changeShotMessageCc}"
														styleClass="aon-icon-commandButton aon-icon-drop-up">
													</aon:commandButton>
												</aon:div>
												<aon:div>
													<aon:outputText escape="false"
														rendered="#{!message.shotMessageCc}" 
														converter="maxLenghtString" 
														value="#{message.message.recipientsCc}" />
													<aon:outputText escape="false" 
														rendered="#{message.shotMessageCc}" 
														converter="longString" 
														value="#{message.message.recipientsCc}" />
													<aon:outputText escape="false"
														rendered="#{message.shotMessageCcControlDown}" 
														value="..." />
												</aon:div>
											</aon:panelGrid>
										</aon:div>
									</aon:panelGrid>
							</aon:div>
							<aon:div styleClass="aon-box aon-box-outstanding2">
								<aon:panelGrid cellpadding="3" cellspacing="0" columns="2">
									<aon:outputText
									styleClass="aon-text-bold"
									value="#{appBundle.aon_webmail_subject}: " />
								
									<aon:outputText escape="false" converter="longString" value="#{message.message.subject}" />
									
									<!-- Date -->
										<aon:outputText style="font-weight:bold;"
											styleClass="aon-form-input-text-label"
											value="#{appBundle.aon_webmail_date}: " />
										<aon:outputText value="#{message.message.sentDateString}" />
								</aon:panelGrid>
							</aon:div>
							<aon:div styleClass="aon-icon-attach aon-icon">
								<aon:commandButton
									id="popupAttachOpen"
									rendered="#{attach.attachment and !attach.showAttachsPanel}"
									title="#{appBundle.aon_webmail_addattach}"
									value="#{appBundle.aon_webmail_addattach}"
									actionListener="#{attach.openAttachsPanel}" 
									styleClass="aon-icon-drop-down aon-icon-commandButton">
								</aon:commandButton>
							</aon:div>
							<aon:panelGroup rendered="#{attach.attachment and attach.showAttachsPanel}">
								<aon:div styleClass="aon-icon-attach aon-icon">
									<aon:commandButton id="popupAttachClose" 
										value="#{appBundle.aon_webmail_addattach}"
										styleClass="aon-icon-drop-up aon-icon-commandButton"
										actionListener="#{attach.closeAttachsPanel}" 
										/>
								</aon:div>
								<aon:div styleClass="aon-box">
									<aon:dataTable border="0"
										id="attachDataTable"
										rows="0"
										var="attachment"
										styleClass="aon-noborder-table"
										value="#{attach.attachments}">
										<aon:column style="border:0;">
											<h:outputLink 
												id="download"
												value="#{webmail.context}/webmail/download.jsp?pos=#{attachment.position}" 
												target="_blank">
												#{attachment.fileName}
											</h:outputLink>
										</aon:column>
										<aon:column>
											<aon:outputText value="&lt;#{attachment.fileSize}&gt;" />
										</aon:column>
									</aon:dataTable>
								</aon:div>
							</aon:panelGroup>
							<!-- Message Body -->
							<aon:panelGroup styleClass="aon-box" >
								<iframe src="#{webmail.context}/webmail/contentIframe.jsp?id=#{webmail.millis}" width="99%" height="430" frameborder="0">
								</iframe>
							</aon:panelGroup>
						</aon:panelGroup>
					</aon:panelGrid>
				</aon:div>
			</aon:div>
			
			<ice:panelPopup styleClass="aon-popup-"
				style="z-index:999; top: 200px; left: 300px; width: 400px; position:absolute; background: #FFFFFF;"
				modal="true"
				rendered="true"
				visible="#{message.showFoldersPanelPopup}">
			
				<f:facet name="header">
					<aon:panelGrid id="popupFoldersHeader" width="100%" cellpadding="0" cellspacing="0" columns="2" 
						columnClasses="popupIcon,aon-text-right popupButton">
						<aon:outputText value="#{appBundle.aon_webmail_folder}"/>
						<aon:commandButton id="popupFoldersClose" type="button" image="/images/icefaces/popupclose.gif"
							actionListener="#{message.closeFoldersPanelPopup}" style="cursor: pointer;"/>
					</aon:panelGrid>
				</f:facet>
			
				<f:facet name="body">
					<aon:div style="height:250px;overflow:auto;">
					<aon:panelGrid id="popupFoldersBody" width="100%" cellpadding="0" cellspacing="0" column="2">

							<aon:panelGrid columns="1" >
								<ice:tree id="tree2"
										  value="#{tree.model}"
										  var="item"
										  hideRootNode="true"
										  hideNavigation="false"
										  styleClass="aon-tree">
									<ice:treeNode>
						                <f:facet name="content">
						                    <ice:panelGroup style="display: inline"
												hoverclass="droptargethover"
												styleClass="aon-tree-item">
											
												<ice:graphicImage 
						                            value="#{item.userObject.branchExpandedIcon}"/>
												<aon:commandButton
													action="#{message.getDeleteReturnAction}"
													actionListener="#{item.userObject.moveMessageToFolder}"
													value="#{item.userObject.text}" 
													styleClass="aon-tree-item-commandButton" 
													>
												</aon:commandButton>
											</ice:panelGroup>
										</f:facet>
									</ice:treeNode>
								</ice:tree>
							</aon:panelGrid>
					
					</aon:panelGrid>
					</aon:div>
				</f:facet>
			</ice:panelPopup>			
			
			<ice:panelPopup styleClass="aon-popup-"
				modal="true"
				rendered="true"
				style="z-index:999; top: 200px; left: 400px; width: 300px; position:absolute; background: #FFFFFF;"
				visible="#{message.showAddContactPanelPopup}">
			
				<f:facet name="header">
					<h:panelGrid id="popupAddContactHeader" width="100%" cellpadding="0" cellspacing="0" columns="2" 
					columnClasses="popupIcon,aon-text-right popupButton">
						<aon:outputText value="#{appBundle.aon_webmail_email_alias}"/>
						<aon:commandButton id="popupCloseAddContact" type="button" image="/images/icefaces/popupclose.gif"
							actionListener="#{message.closeAddContactPanelPopup}" style="cursor: pointer;"/>
					</h:panelGrid>
				</f:facet>
			
				<f:facet name="body">
					<h:panelGrid id="popupAddContactBody" width="100%" cellpadding="0" cellspacing="0" columns="1"
						columnClasses="popupIcon,aon-text-right popupButton">
						<aon:outputText value="#{appBundle.aon_webmail_email_alias}" />
						<aon:inputText id="Contact_name"
							styleClass="aon-form-input-text"
							size="70" maxlength="64"
							value="#{message.contactName}" />
						<aon:commandButton id="closeModalAddContact" 
							styleClass="aon-icon-commandButton aon-icon-accept"
							actionListener="#{message.saveToContacts}" value="Ok"/>
					</h:panelGrid>
				</f:facet>
			</ice:panelPopup>			
		</aon:form>
		<aon:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
