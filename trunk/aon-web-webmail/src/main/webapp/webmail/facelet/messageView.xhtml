<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="webmailForm" styleClass="aon-form" >

			<aon:panelGrid columns="1" cellpadding="0" cellspacing="0" width="100%" 
				columnClasses="aon-vertical-align-top,aon-vertical-align-top">
								
				<aon:panelGrid id="messageGrid" columns="1" cellpadding="0" cellspacing="0" width="100%">

				<aon:panelGroup>
					<aon:div styleClass="aon-section-title">
						<aon:outputText value="#{folder.folder.name}"/>
					</aon:div>
					<aon:div styleClass="aon-section-toolbar">
						<aon:commandButton
							id="back"
							title="#{appBundle.aon_webmail_back}"
							value="#{appBundle.aon_webmail_back}"
							action="#{message.getReturnAction}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel">
						</aon:commandButton>									
					
						<!-- Reply to message  -->									
						<aon:commandButton
								id="replyButton"
								title="#{appBundle.aon_webmail_newmail_reply}"
								action="messageNew"
								actionListener="#{message.replyToSelectedMessage}"
								value="#{appBundle.aon_webmail_newmail_reply}"
								styleClass="aon-finding-toolbar-item aon-icon-mailReply"
								>
						</aon:commandButton>									
		
						<!-- Reply to all button  -->										
						<aon:commandButton
								id="replyAllButton"
								title="#{appBundle.aon_webmail_newmail_replyAll}"
								action="messageNew"
								actionListener="#{message.replyToAllMessage}"
								value="#{appBundle.aon_webmail_newmail_replyAll}"
								styleClass="aon-finding-toolbar-item aon-icon-mailReplyAll">
						</aon:commandButton>							
		
						<!-- Forward button  -->
						<aon:commandButton
								id="forwardButton"
								title="#{appBundle.aon_webmail_newmail_forward}"
								action="messageNew"
								actionListener="#{message.forwardMessage}"
								value="#{appBundle.aon_webmail_newmail_forward}"
								styleClass="aon-finding-toolbar-item aon-icon-mailForward">
						</aon:commandButton>					
		
						<!-- Delete button  -->
						<aon:commandButton
								id="deleteButton"
								title="#{appBundle.aon_webmail_deletemail}"
								action="#{message.getDeleteReturnAction}"
								actionListener="#{message.deleteSelectedMessageAndMove}"
								value="#{appBundle.aon_webmail_deletemail}"
								styleClass="aon-finding-toolbar-item aon-icon-mailDelete">
						</aon:commandButton>									
					
						<h:outputLink 
							id="save"
							value="#{webmail.context}/webmail/save.jsp" 
							target="_blank"
							styleClass="aon-icon aon-icon-mail-save aon-finding-toolbar-item"
							style="line-height:16px;">
							<aon:outputText value="#{appBundle.aon_webmail_save}" />
						</h:outputLink>
					
						<h:outputLink 
							id="print"
							value="#{webmail.context}/webmail/print.jsp" 
							target="_blank"
							styleClass="aon-icon aon-icon-printer aon-finding-toolbar-item"
							style="line-height:16px;">
							<aon:outputText value="#{appBundle.aon_webmail_print}" />
						</h:outputLink>
							
						<!-- Move button  -->
						<aon:commandButton
								id="moveButton"
								title="#{appBundle.aon_webmail_movemail}"
								value="#{appBundle.aon_webmail_movemail}"
								styleClass="aon-finding-toolbar-item aon-icon-mail-move"
								onclick="javascript:Richfaces.showModalPanel('msgMoveModalPanel',{width:310, top:100})">
						</aon:commandButton>									

						<ui:include src="/webmail/facelet/modal/moveMessage.xhtml" />
						
					</aon:div>
					
					<aon:commandButton
							title="#{appBundle.aon_webmail_previous_message}"
							rendered="#{message.previousMessage}"
							action="message"
							actionListener="#{message.previousMessage}"
							value="#{appBundle.aon_webmail_previous_message}"
							styleClass="aon-icon-commandButton aon-icon-mailPrevious">
					</aon:commandButton>
	
					<aon:commandButton
							title="#{appBundle.aon_webmail_previous_message}"
							rendered="#{!message.previousMessage}"
							value="#{appBundle.aon_webmail_previous_message}"
							styleClass="aon-icon-commandButton aon-icon-mailPrevious-dis">
					</aon:commandButton>
	
					<aon:commandButton
							title="#{appBundle.aon_webmail_next_message}"
							rendered="#{message.nextMessage}"
							action="message"
							actionListener="#{message.nextMessage}"
							value="#{appBundle.aon_webmail_next_message}"
							styleClass="aon-icon-commandButton aon-icon-mailNext">
					</aon:commandButton>
					
					<aon:commandButton
							title="#{appBundle.aon_webmail_next_message}"
							rendered="#{!message.nextMessage}"
							value="#{appBundle.aon_webmail_next_message}"
							styleClass="aon-icon-commandButton aon-icon-mailNext-dis">
					</aon:commandButton>
					
					<!-- icon to collapse message details -->
					<aon:div>
		
						<aon:panelGrid columns="2" cellpadding="2">
							
							<!-- from -->
							<aon:outputText styleClass="aon-text-bold"											
								value="#{appBundle.aon_webmail_from}: " />
							<aon:div>
								<aon:outputText escape="false" converter="longString" value="#{message.message.sender}" />
								<aon:commandButton
									id="addToContacts"
									title="#{appBundle.aon_webmail_email_add}"
									actionListener="#{message.addToContacts}"
									styleClass="aon-icon-commandButton aon-icon-agenda aon-italic aon-bold">
								</aon:commandButton>
								<aon:commandButton id="add_white_list"
									reRender="messageGrid"
									rendered="#{blacklist.whiteListEmail}"
									title="#{appBundle.aon_webmail_add_white_list}" 
									styleClass="aon-icon-commandButton aon-icon-white-list aon-italic aon-bold"
									actionListener="#{blacklist.onAddWhiteMessageFrom}" />
								<aon:commandButton id="add_black_list"
									reRender="messageGrid"
									rendered="#{blacklist.blackListEmail}"
									title="#{appBundle.aon_webmail_add_black_list}" 
									styleClass="aon-icon-commandButton aon-icon-black-list aon-italic aon-bold"
									actionListener="#{blacklist.onAddBlackMessageFrom}" />
							</aon:div>
							
							<!-- To -->
							<aon:outputText styleClass="aon-text-bold"
										value="#{appBundle.aon_webmail_to}: " />
							<aon:div>
								<aon:div>
									<aon:commandButton
										reRender="messageGrid"
										rendered="#{message.shotMessageToControlDown}" 
										actionListener="#{message.changeShotMessageTo}"
										styleClass="aon-icon-commandButton aon-icon-drop-down">
									</aon:commandButton>
									<aon:commandButton
										reRender="messageGrid"
										rendered="#{message.shotMessageToControlUp}" 
										actionListener="#{message.changeShotMessageTo}"
										styleClass="aon-icon-commandButton aon-icon-drop-up">
									</aon:commandButton>
									<aon:outputText escape="false"
										rendered="#{!message.shotMessageTo}" 
										converter="maxLenghtString" 
										value="#{message.message.recipientsTo}" />
									<aon:outputText escape="false" 
										rendered="#{message.shotMessageTo}" 
										converter="longString" 
										value="#{message.message.recipientsTo}" />
									<aon:outputText escape="false"
										rendered="#{message.shotMessageToControlDown}" 
										value="..." />
								</aon:div>
							</aon:div>
							<!-- Cc -->
							<aon:outputText styleClass="aon-text-bold"
									value="#{appBundle.aon_webmail_cc}: " />
							<aon:div>
								<aon:div>
									<aon:commandButton
										reRender="messageGrid"
										rendered="#{message.shotMessageCcControlDown}" 
										actionListener="#{message.changeShotMessageCc}"
										styleClass="aon-icon-commandButton aon-icon-drop-down">
									</aon:commandButton>
									<aon:commandButton
										reRender="messageGrid"
										rendered="#{message.shotMessageCcControlUp}" 
										actionListener="#{message.changeShotMessageCc}"
										styleClass="aon-icon-commandButton aon-icon-drop-up">
									</aon:commandButton>
									<aon:outputText escape="false"
										rendered="#{!message.shotMessageCc}" 
										converter="maxLenghtString" 
										value="#{message.message.recipientsCc}" />
									<aon:outputText escape="false" 
										rendered="#{message.shotMessageCc}" 
										converter="longString" 
										value="#{message.message.recipientsCc}" />
									<aon:outputText escape="false"
										rendered="#{message.shotMessageCcControlDown}" 
										value="..." />
								</aon:div>
							</aon:div>

							<aon:outputText
								styleClass="aon-text-bold"
								value="#{appBundle.aon_webmail_subject}: " />
							
							<aon:outputText escape="false" converter="longString" value="#{message.message.subject}" />
								
								<!-- Date -->
							<aon:outputText style="font-weight:bold;"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.aon_webmail_date}: " />
							<aon:outputText value="#{message.message.sentDateString}" />
						
							<aon:outputText style="font-weight:bold;"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.aon_webmail_attach_files}: " />
							<aon:panelGroup rendered="#{attach.attachment}" styleClass="aon-icon aon-icon-attach">
							
								<aon:selectOneMenu 
									id="attach"
									style="font-size: 0.9em;boder: #000 1px solid;"
									styleClass="aon-inputText"
									partialSubmit="true"
									value="#{attach.attachPos}">
									<f:selectItems value="#{attach.attachmentsDrop}" />
								</aon:selectOneMenu> 
								
								<h:outputLink 
									id="download"
									value="#{webmail.context}/webmail/download.jsp?pos=#{attach.attach.position}" 
									target="_blank"
									styleClass="aon-icon aon-icon-mail-save"
									title="#{appBundle.aon_webmail_download}"
									style="line-height:16px;margin-right:0;">
									&#160;
								</h:outputLink>
		
								<h:outputLink 
									id="downloadZip"
									value="#{webmail.context}/webmail/downloadZip.jsp" 
									target="_blank"
									styleClass="aon-icon aon-icon-zip"
									title="#{appBundle.aon_webmail_download_zipped}"
									style="line-height:18px;">
									&#160;
								</h:outputLink>
							
							</aon:panelGroup>
							
						</aon:panelGrid>
						<!-- Message Body -->
						<aon:panelGroup styleClass="aon-box" >
							<iframe src="#{webmail.context}/webmail/contentIframe.jsp?id=#{webmail.millis}" width="99%" height="430" frameborder="0">
							</iframe>
						</aon:panelGroup>
					</aon:div>
				</aon:panelGroup>
			</aon:panelGrid>
		</aon:panelGrid>

		</aon:form>

	</ui:define>
</ui:composition>

</body>
</html>
