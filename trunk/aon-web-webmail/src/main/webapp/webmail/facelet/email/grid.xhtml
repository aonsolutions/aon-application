<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">
		<aon:form id="emailList">
			<ui:include src="/webmail/facelet/webmailButtons.xhtml" />
				<aon:panelGrid columns="2" cellpadding="0" cellspacing="0"
					columnClasses="aon-menu-sidebar,aon-content-area">	
									
				<ui:include src="/webmail/facelet/webmailTree.xhtml" />	

				  <aon:panelGroup>
		
					<aon:div styleClass="aon-section-title">
						<aon:outputText value="#{appBundle.aon_webmail_email}" />: <aon:outputText value="#{bundle.aon_listing}- #{bundle.aon_editing}" />
					</aon:div>

				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-section-toolbar">		
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						actionListener="#{email.onReset}" rendered="#{!email.new}"
						styleClass="aon-content-toolbar-item aon-icon-agenda-newContact"
						accesskey="#{bundle.aon_key_new}" />
					<aon:confirmButton id="save"
						value="#{bundle.aon_save}" rendered="#{email.to!=null or email.new}"
						confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_save_confirm}"
						confirmActionListener="#{email.onAccept}"
						styleClass="aon-content-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_save}"/>
					<aon:confirmButton id="cancel"
						value="#{bundle.aon_cancel}" rendered="#{email.to!=null or email.new}"
						immediate="#{true}"
						confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_cancel_confirm}"
						confirmActionListener="#{email.onCancel}"
						styleClass="aon-content-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}"/>
					<aon:confirmButton id="remove"
						value="#{bundle.aon_remove}" rendered="#{email.to!=null and !email.new}"
						styleClass="aon-content-toolbar-item aon-icon-delete"
						confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{email.onRemove}"
						accesskey="#{bundle.aon_key_remove}"/>
				</aon:div>
			
			<!-- end toolbar navigation -->

			<!--  aon-region-body -->
			<aon:div>
				<aon:div>

								
					<aon:editDataTable id="emailData" var="to" rows="20"
						rendered="#{email.model.rowCount > 0 or email.new}"
						 value="#{email.model}" styleClass="aon-editTable"
						columnClasses="aon-editTable-icon, aon-editTable-cell, aon-editTable-cell,aon-editTable-buttons">

						<aon:column>
							<aon:rowSelector multiple="false"
								mouseOverClass="aon-table-row-hover"
								toggleOnClick="#{email.to == null}"
								selectedClass="aon-table-row-selected"
								selectionListener="#{email.onSelect}" />
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editTable-button aon-icon-reset"
										actionListener="#{email.onReset}" value=""
										rendered="#{!email.new}">
									</aon:commandButton>
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_webmail_email_alias}" />
							</f:facet>
							<aon:outputText value="#{to.name}" rendered="#{to!=email.to}" />
							<aon:inputText styleClass="aon-inputText" 
								rendered="#{to==email.to}" size="60"
								value="#{email.to.name}" maxlength="45" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-inputText" 
									rendered="#{email.new}" size="60"
									value="#{email.to.name}" maxlength="45" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_webmail_email_email}" />
							</f:facet>
							<aon:outputText value="#{to.email}" rendered="#{to!=email.to}" />
							<aon:inputText styleClass="aon-inputText" 
								rendered="#{to==email.to}" size="60"
								value="#{email.to.email}" maxlength="45" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-inputText" 
									rendered="#{email.new}" size="60"
									value="#{email.to.email}" maxlength="45" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div rendered="#{to==email.to}" styleClass="aon-nowrap">
								<aon:panelGrid cellpadding="0" cellspacing="0" border="0" columns="7">
									<aon:confirmButton alt="[#{bundle.aon_accept}]"
										styleClass="aon-editTable-button aon-icon-accept"
										confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_save_confirm}"
										confirmActionListener="#{email.onAccept}"/>
									<aon:confirmButton alt="[#{bundle.aon_cancel}]"
										styleClass="aon-editTable-button aon-icon-cancel"
										confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{email.onCancel}" immediate="true"/>
									<aon:confirmButton alt="[#{bundle.aon_remove}]"
										styleClass="aon-editTable-button aon-icon-delete"
										confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
										confirmActionListener="#{email.onRemove}" immediate="true"/>
								</aon:panelGrid>
							</aon:div>
							<f:facet name="footer">
								<aon:div styleClass="aon-nowrap" rendered="#{email.new}">
									<aon:confirmButton alt="[#{bundle.aon_accept}]"
										styleClass="aon-editTable-button aon-icon-accept"
										confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_save_confirm}"
										confirmActionListener="#{email.onAccept}"/>
									<aon:confirmButton alt="[#{bundle.aon_cancel}]"
										styleClass="aon-editTable-button aon-icon-cancel"
										confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{email.onCancel}" immediate="true"/>
								</aon:div>
							</f:facet>
						</aon:column>
					</aon:editDataTable>

					<ui:include src="/facelet/shared/dataScroller.xhtml">
						<ui:param name="dataTable" value="emailData" />
						<ui:param name="model" value="#{email.model}" />
						<ui:param name="showNote" value="#{true}" />
					</ui:include>

				</aon:div>
			</aon:div>
							
				        </aon:panelGroup>

					</aon:panelGrid>

		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
