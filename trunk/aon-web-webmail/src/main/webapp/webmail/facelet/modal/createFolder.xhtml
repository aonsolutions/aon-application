<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition>

        <rich:modalPanel  id="newFolderModalPanel"  
            height="150" width="290" zindex="2000">
            <f:facet name="header">
                <h:outputText value="#{appBundle.aon_webmail_folder_create_new}" />
            </f:facet>
            <f:facet name="controls">
                <h:graphicImage value="/images/icefaces/popupclose.gif" style="cursor:pointer" onclick="Richfaces.hideModalPanel('newFolderModalPanel')" />
            </f:facet>
            <aon:div styleClass="aon-toolbar">
            	<aon:commandButton 
					styleClass="aon-icon-commandButton aon-icon-accept"
					reRender="foldersTree"
					onclick="Richfaces.hideModalPanel('newFolderModalPanel')"
					actionListener="#{folder.createFolder}" value="Ok"/>
            </aon:div>
			<h:panelGrid id="newFolderModalPanel_panelGrid" width="100%" cellpadding="0" cellspacing="0" columns="1"
				columnClasses="popupIcon,aon-text-right popupButton">
				<aon:outputText value="#{appBundle.aon_webmail_folder_name}:" />
				<aon:inputText id="newFolderName"
					size="40"
					value="#{folder.newFolderName}"/>
				
			</h:panelGrid>
        </rich:modalPanel>													

</ui:composition>

</body>
</html>
