<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">	
<body>

<ui:composition>

<style>
.bodyPanel {
	width:300px;
    height:500px;
    overflow:auto;
}
</style>

        <rich:modalPanel  id="renameFolderModalPanel"  
            height="150" width="300" zindex="2000">
            <f:facet name="header">
                <h:outputText value="#{appBundle.aon_webmail_folder_rename}" />
            </f:facet>
            <f:facet name="controls">
                <h:graphicImage value="/images/icefaces/popupclose.gif" style="cursor:pointer" onclick="Richfaces.hideModalPanel('renameFolderModalPanel')" />
            </f:facet>
			<h:panelGrid id="renameFolderModalPanel_panelGrid" width="100%" cellpadding="0" cellspacing="0" columns="1"
				columnClasses="popupIcon,aon-text-right popupButton">
				<aon:outputText value="#{appBundle.aon_webmail_folder_name}:" />
				<aon:inputText id="renameFolderName"
					size="40"
					value="#{folder.renameFolderName}"/>
				<aon:commandButton 
					styleClass="aon-icon-commandButton aon-icon-accept"
					reRender="foldersTree"
					onclick="Richfaces.hideModalPanel('renameFolderModalPanel')"
					actionListener="#{folder.renameFolder}" value="Ok"/>
			</h:panelGrid>
        </rich:modalPanel>													

</ui:composition>

</body>
</html>
