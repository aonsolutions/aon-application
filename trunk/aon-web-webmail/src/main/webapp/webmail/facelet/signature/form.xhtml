<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">
	<ui:define name="content">

		<aon:form id="signatureList">

			<aon:div>
				<aon:div>

					<ui:include src="/webmail/facelet/webmailButtons.xhtml" />	

					<aon:panelGrid columns="2" cellpadding="0" cellspacing="0"
					columnClasses="aon-menu-sidebar,aon-content-area" style="width:100%;">
					
						<ui:include src="/webmail/facelet/webmailTree.xhtml" />	

				        <aon:panelGroup>


					<aon:div styleClass="aon-section-title">
						<aon:outputText value="#{appBundle.aon_webmail_signature}"/>
						<aon:outputText value="&#8226;" />
						<aon:outputText 
							value="#{signature.new?(bundle.aon_reset):(bundle.aon_editing)}" /> 						
					</aon:div>	

			
					<aon:div styleClass="aon-section-toolbar">						
							<aon:confirmButton id="save"
								value="#{bundle.aon_save}" rendered="#{signature.to!=null or signature.new}"
								styleClass="aon-content-toolbar-item aon-icon-accept"
								confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_save_confirm}"
								confirmActionListener="#{signature.accept}"
								confirmAction="signature_list"
								accesskey="#{bundle.aon_key_save}"/>
							<aon:confirmButton id="cancel"
								value="#{bundle.aon_cancel}" rendered="#{signature.to!=null or signature.new}"
								styleClass="aon-content-toolbar-item aon-icon-cancel"
								confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{signature.onCancel}" confirmAction="signature_list"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:confirmButton id="remove"
								value="#{bundle.aon_remove}" rendered="#{!signature.new}"
								styleClass="aon-content-toolbar-item aon-icon-delete"
								confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{signature.onRemove}" confirmAction="signature_list"
								accesskey="#{bundle.aon_key_remove}"/>
							<aon:commandButton id="reset" value="#{bundle.aon_reset}"
								actionListener="#{signature.onReset}" rendered="#{!signature.new}"
								styleClass="aon-content-toolbar-item aon-icon-newSignature"
								accesskey="#{bundle.aon_key_new}" />						
					</aon:div>


			
			<aon:div>
				<aon:div>	
				
						<aon:panelGrid columns="2" dir="true" styleClass="aon-formTable"
							columnClasses="aon-formTable-column-odd,aon-formTable-column-even"
							cellpadding="0" cellspacing="0">
							
							<aon:outputLabel for="Signature_name"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.aon_webmail_signature_name}" />
							<aon:inputText id="Signature_name"
								styleClass="aon-form-input-text aon-form-input-text-number"
								size="60" maxlength="45"
								value="#{signature.to.name}" />

							<aon:outputLabel for="Signature_signature"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.aon_webmail_signature_signature}" />
							<aon:inputRichText id="Signature_signature" value="#{signature.to.signature}"/>

							<aon:outputLabel for="Signature_active" 
								value="#{appBundle.aon_webmail_signature_active}" />
							<ice:selectOneRadio id="Signature_active" 
								partialSubmit="true"
								value="#{signature.to.active}">
								<f:selectItems value="#{signature.activeTypes}" />
							</ice:selectOneRadio>
							
						</aon:panelGrid>
					
				</aon:div>
			</aon:div>
							
				        </aon:panelGroup>

					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
