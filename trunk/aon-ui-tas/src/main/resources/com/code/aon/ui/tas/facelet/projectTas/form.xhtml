<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="projectTasForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{tasBundle.tas_projectTas_module}" />
				<ui:param name="controller" value="#{projectTas}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:htmlCommandLink id="projectTas-report"
						value="#{bundle.aon_report}" target="_new" 
						rendered="#{!projectTas.new}"
						action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="projectTas" />
					</aon:htmlCommandLink>
					<c:if test="#{!projectTas.new}">
						<aon:commandButton id="ProjectHistory" 
							action="project_stats" actionListener="#{projectTas.onProjectHistory}"
							value="#{bundle.aon_history}"
							styleClass="aon-finding-toolbar-item aon-icon-info" />
					</c:if>		
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:include src="/com/code/aon/ui/tas/facelet/projectTas/formContent.xhtml">
					<ui:param name="controller" value="#{projectTas}"/>
				</ui:include>				
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
		<aon:lookupButtonPopup lookup="#{tasItemLookup}" />
		<aon:lookupButtonPopup lookup="#{modelLookup}" />
	</ui:define>

</ui:composition>

</body>
</html>
