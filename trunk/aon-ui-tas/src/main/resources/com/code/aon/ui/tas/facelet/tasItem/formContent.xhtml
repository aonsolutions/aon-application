<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:include src="/com/code/aon/ui/tas/facelet/model/lookup.xhtml">
		<ui:param name="lookupTo" value="#{controller.to.model}" />
		<ui:param name="idRequired" value="#{true}" />						
	</ui:include>

	<aon:outputLabel for="tasItem_publicCode"
		value="#{tasBundle.tas_publicCode}" />
	<aon:inputText id="tasItem_publicCode"
		value="#{controller.to.publicCode}" required="#{true}" size="20">
		<f:validateLength maximum="100" />
	</aon:inputText>

	<aon:outputLabel for="tasItem_privateCode"
		value="#{tasBundle.tas_privateCode}" />
	<aon:inputText id="tasItem_privateCode"
		value="#{controller.to.privateCode}" size="20">
		<f:validateLength maximum="100" />
	</aon:inputText>

	<aon:outputLabel for="tasItem_description" value="#{bundle.aon_description}" />
	<aon:inputTextarea id="tasItem_description" value="#{controller.to.description}" 
		cols="80" rows="3"/>

	<aon:outputLabel for="tasItem_addInfo" value="#{tasBundle.tas_add_info}" />
	<aon:inputTextarea id="tasItem_addInfo" value="#{controller.to.addInfo}" 
		cols="80" rows="3"/>

</ui:composition>
