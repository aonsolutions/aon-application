<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include	src="/com/code/aon/ui/tas/facelet/tasItem/listBasic.xhtml" />

	<aon:column alias="TasItem.privateCode"
		styleClass="aon-editDataTable-textColumn aon-width-150">
		<f:facet name="header">
			<aon:outputText value="#{tasBundle.tas_privateCode}" />
		</f:facet>
		<aon:outputText value="#{to.privateCode}" />
	</aon:column>
						
	<aon:column alias="TasItem.description"
		styleClass="aon-editDataTable-textColumn aon-width-auto">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_description}" />
		</f:facet>
		<aon:outputText value="#{to.description}" />
	</aon:column>

</ui:composition>
