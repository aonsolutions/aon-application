<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="userOverloadForm">
	
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{adminBundle.admin_backup}" />
				<ui:param name="toolbarDescription" value="&#160;" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="makeBackup" 
						value="#{adminBundle.admin_make_backup}" 
						actionListener="#{backup.onPrepareBackup}"
						rendered="#{!backup.backupAvailable}"
						reRender="backupContent"
						styleClass="aon-finding-toolbar-item aon-icon-accept"/>
					<aon:htmlCommandLink id="download" target="_blank"
						rendered="#{backup.backupAvailable}"
						value="#{bundle.aon_fileupload_download}"
						actionListener="#{backup.onDownloadBackup}"
						styleClass="aon-finding-toolbar-item aon-icon-file-exit" >
					</aon:htmlCommandLink>
				</ui:define>
			</ui:decorate>	
						
			<aon:div id="backupContent" styleClass="aon-scroll-area">

				<c:if test="#{!backup.backupAvailable}">						
					<aon:panelGrid columns="2">
	
						<c:if test="#{domainSwitcher.domainManagementAvailable}">						
							<aon:outputLabel value="#{adminBundle.admin_domain_childs}" 
								for="Backup_childDomains"/>
							<aon:selectBooleanCheckbox id="Backup_childDomains"
								value="#{backup.includeChildDomains}" />								
						</c:if>
	
						<c:if test="#{!domainSwitcher.domainManagementAvailable}">						
							<aon:outputLabel value="#{adminBundle.admin_domain_parent}" 
								for="Backup_parentDomain"/>
							<aon:selectBooleanCheckbox id="Backup_parentDomain"
								value="#{backup.includeParentDomain}" />								
						</c:if>
							
					</aon:panelGrid>
				</c:if>	
		
				<h:panelGrid styleClass="aon-width-400">
					<rich:progressBar 
						value="#{backup.progressValue}" minValue="0"
						maxValue="#{backup.maxProgressValue}" interval="2000"
						enabled="#{backup.enabledProgressBar}"
						reRender="Backup_progressMessage" reRenderAfterComplete="aonContent">
						<aon:outputText value="#{backup.progressValuePercent} %"/>
					</rich:progressBar>
					<c:if test="#{backup.enabledProgressBar}">
						<aon:div styleClass="aon-note-internal">
							<aon:panelGroup>
								<aon:outputText id="Backup_progressMessage"
									 value="#{backup.progressMessage}"/>
							</aon:panelGroup>
						</aon:div>
					</c:if>	
				</h:panelGrid>
			</aon:div>
			
		</aon:form>
	</ui:define>

</ui:composition>
