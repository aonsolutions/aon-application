<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="newDomainForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{adminBundle.admin_new_domain}" />
				<ui:param name="controller" value="#{adminNewDomain}" />
				<ui:define name="toolbarContent">
					<!-- Se utliza un <h:commandButton por la navegacion al action index -->
					<h:commandButton id="newDomainAccept" 
						value="#{bundle.aon_accept}" 
						actionListener="#{adminNewDomain.onSave}"
						action="start"
						styleClass="aon-finding-toolbar-item aon-icon-accept"/>
				</ui:define>
			</ui:decorate>

			<aon:div id="domainFormContainer" styleClass="aon-scroll-area">

				<aon:panelGrid columns="2"
					styleClass="aon-width-all"
					columnClasses="aon-panelGrid-odd aon-width-200,aon-panelGrid-even aon-width-auto">
				
					<aon:div>
						<aon:outputLabel value="#{securityBundle.aon_security_user_password}" for="passwd"/>
						<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
							<aon:outputText value="#{adminBundle.admin_new_domain_passwd_help}" />
						</aon:div>
					</aon:div>
					<aon:inputSecret id="passwd" required="true" styleClass="aon-inputText"
						value="#{adminNewDomain.password}" size="20" maxlength="20" />
					
					<aon:div>
						<aon:outputLabel for="Domain_name" value="#{adminBundle.admin_new_domain_name}" />
						<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
							<aon:outputText value="#{adminBundle.admin_new_domain_name_help}"/>
						</aon:div>
					</aon:div>
					<aon:div id="domainNameContainer">
						<aon:inputText id="Domain_name" required="true" size="20" maxlength="20" 
							value="#{adminNewDomain.domainName}" />
						<aon:outputText value="#{adminNewDomain.domainSuffix}"
								styleClass="aon-bold" style="margin-left: 5px;"/>
					</aon:div>
 
					<aon:div>
						<aon:outputLabel for="Domain_description" value="#{adminBundle.admin_new_domain_description}" />
						<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
							<aon:outputText value="#{adminBundle.admin_new_domain_description_help}"/>
						</aon:div>
					</aon:div>
					<aon:inputText id="Domain_description" required="true" size="40" maxlength="64" 
						value="#{adminNewDomain.domainDescription}" />
 
					<aon:div>
						<aon:outputLabel for="Domain_loadDefaults" value="#{adminBundle.admin_new_domain_defaults}" />
						<aon:div style="padding-left: 10px;" styleClass="aon-italic aon-normal">
							<aon:outputText value="#{adminBundle.admin_new_domain_defaults_help}"/>
						</aon:div>
					</aon:div>
					<aon:selectOneMenu id="Domain_loadDefaults" required="true"
						 disabled="true"
						 value="#{adminNewDomain.loadDefaultValuesEnabled}">
						<f:selectItem itemValue="#{true}" itemLabel="#{adminBundle.admin_new_domain_defaults_1}" />
						<f:selectItem itemValue="#{false}" itemLabel="#{adminBundle.admin_new_domain_defaults_2}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
				
				<aon:div styleClass="aon-margin-top aon-padding aon-text-center aon-width-all" 
					rendered="#{adminNewDomain.success}">

					<!-- Se utliza un <h:commandButton por la navegacion al action index -->
					<h:commandButton id="configureNewDomain" immediate="true"
						value="{#adminBunlde.admin_new_domain_configure} '#{adminNewDomain.domainDescription}'" 
						actionListener="#{adminNewDomain.onConfigure}"
						action="index"
						styleClass="aon-commandButton aon-icon-commandButton aon-icon-config aon-bold">
					</h:commandButton>
					
				</aon:div>
				
				<aon:div styleClass="aon-margin-top"
					style="background-color:#444444; color: #DDDDDD;font-family: Monospace; padding: 5px;" 
					rendered="#{!adminNewDomain.success and adminNewDomain.output != null}">
					<aon:outputText value="#{adminNewDomain.output}"
						escape="false"/>
				</aon:div>
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
