<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j" >

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:param name="toolbarID" value="userWorkGroupToolbar" />
		<ui:param name="innerToolbar" value="#{true}" />
		<ui:define name="toolbarContent">	
			<aon:commandButton id="userWorkGroup-store"
				title="#{bundle.aon_key_save_accelerator}"
				value="#{bundle.aon_save}"
				actionListener="#{userWorkGroupEx.accept}"
				styleClass="aon-finding-toolbar-item aon-icon-accept"
				accesskey="#{bundle.aon_key_save}" />
		</ui:define>
	</ui:decorate>

	<aon:div styleClass="aon-scroll-area">
	
		<rich:listShuttle var="to"
			sourceValue="#{userWorkGroupEx.workGroups}" targetValue="#{userWorkGroupEx.selected}"
			listsHeight="250" sourceListWidth="400" targetListWidth="400"
			orderControlsVisible="false" fastOrderControlsVisible="false"
			sourceCaptionLabel="#{adminBundle.admin_available_workgroups}"
			targetCaptionLabel="#{adminBundle.admin_selected_workgroups}"
			copyAllControlLabel="#{bundle.aon_copyAll}"
			copyControlLabel="#{bundle.aon_copy}"
			removeControlLabel="#{bundle.aon_remove}"
			removeAllControlLabel="#{bundle.aon_removeAll}" >
			<rich:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_name}" />
				</f:facet>					
				<aon:outputText value="#{to.description}" />
			</rich:column>
      		</rich:listShuttle>

	</aon:div>

</ui:composition>
