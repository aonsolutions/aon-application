<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="userOverloadList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{adminBundle.admin_overload_users}" />
				<ui:param name="controller" value="#{userOverload}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{userOverload}" />
					<ui:define name="columns">

						<aon:column styleClass="aon-width-180 aon-editDataTable-textColumn"
							alias="ApplicationUser.user.login" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.user.login}"/>
						</aon:column>
				
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{adminBundle.admin_profiles}" />
							</f:facet>
							<aon:outputText value="#{controller.profileList}"/>
						</aon:column>
				
						<aon:column styleClass="aon-editDataTable-iconColumn"
							alias="ApplicationUser.active" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_active}" />
							</f:facet>
							<aon:outputText value="&#160;"
								styleClass="aon-icon #{(to.active)?'aon-icon-checked':'aon-icon-check'}" />							
						</aon:column>		
						
					</ui:define>
				</ui:decorate>

			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>
