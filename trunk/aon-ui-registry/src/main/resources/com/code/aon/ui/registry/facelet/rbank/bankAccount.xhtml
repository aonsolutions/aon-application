<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:valueParam name="renderBankAccount" default="#{true}" />

	<aon:div rendered="#{renderBankAccount}" >
		<aon:inputText label="#{configBundle.config_bank_code}"
			value="#{bankAccountTo.office}" required="true"
			size="4" maxlength="4">
			<f:validateLength minimum="4" maximum="4" />
		</aon:inputText>
		<aon:inputText label="#{configBundle.config_bank_control}"
			value="#{bankAccountTo.control}" required="true"
			size="2" maxlength="2">
			<f:validateLength minimum="2" maximum="2" />
		</aon:inputText>
		<aon:inputText label="#{configBundle.config_bank_account}"
			value="#{bankAccountTo.account}" required="true"
			size="10" maxlength="10">
			<f:validateLength minimum="10" maximum="10" />
		</aon:inputText>
	</aon:div>
					
</ui:composition>
