<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:column alias="RegistryAttachment.description"
		styleClass="aon-editDataTable-textColumn aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_description}" />
		</f:facet>
		<aon:outputText value="#{to.description}" />
	</aon:column>

	<aon:column alias="RegistryAttachment.size"
		styleClass="aon-editDataTable-numberColumn aon-width-60">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_size}" />
		</f:facet>
		<aon:outputText value="#{to.sizeToDisplay}" />
	</aon:column>

	<aon:column alias="RegistryAttachment.attachDate"
		styleClass="aon-editDataTable-textColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_date}" />
		</f:facet>
		<aon:outputText value="#{to.attachDate}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>
	
</ui:composition>
