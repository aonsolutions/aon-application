<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components" >
			
	<aon:panelGrid columns="4" styleClass="aon-panelGrid-formatting"
		columnClasses="aon-portlets-column1,aon-portlets-column1,aon-portlets-column1">
	
		<aon:div styleClass="aon-portlet aon-width-150">
			<aon:div styleClass="aon-portlet-title">
				<aon:outputText value="#{bundle.aon_fax}" styleClass="aon-portlet-title-text"/>
			</aon:div>
			<aon:div styleClass="aon-portlet-body">
				<aon:commandLink action="corporateIdentity_fax"
					actionListener="#{corporateIdentity.onInit}">
					<h:graphicImage url="#{aonResource.resolve['/images/aon-icon-big/aon-icon-big-fax.png']}" />
					<f:setPropertyActionListener value="#{true}"
						target="#{corporateIdentity.showBackButton}"  />										
				</aon:commandLink>
			</aon:div>
		</aon:div>
	
		<aon:div styleClass="aon-portlet aon-width-150">
			<aon:div styleClass="aon-portlet-title">
				<aon:outputText value="#{registryBundle.registry_corporateIdentity_letter}" styleClass="aon-portlet-title-text"/>
			</aon:div>
			<aon:div styleClass="aon-portlet-body">
				<aon:commandLink action="corporateIdentity_letter"
					actionListener="#{corporateIdentity.onInit}">
					<h:graphicImage url="#{aonResource.resolve['/images/aon-icon-big/aon-icon-big-letter.png']}" />
					<f:setPropertyActionListener value="#{true}"
						target="#{corporateIdentity.showBackButton}"  />										
				</aon:commandLink>
			</aon:div>
		</aon:div>
		
		<aon:div styleClass="aon-portlet aon-width-150">
			<aon:div styleClass="aon-portlet-title">
				<aon:outputText value="#{registryBundle.registry_corporateIdentity_label}" styleClass="aon-portlet-title-text"/>
			</aon:div>
			<aon:div styleClass="aon-portlet-body">
				<aon:commandLink action="corporateIdentity_label"
					actionListener="#{corporateIdentity.onInit}">
					<h:graphicImage url="#{aonResource.resolve['/images/aon-icon-big/aon-icon-big-label.png']}" />
					<f:setPropertyActionListener value="#{true}"
						target="#{corporateIdentity.showBackButton}"  />															
				</aon:commandLink>
			</aon:div>
		</aon:div>
	
		<aon:div styleClass="aon-portlet aon-width-150">
			<aon:div styleClass="aon-portlet-title">
				<aon:outputText value="#{registryBundle.registry_corporateIdentity_receipt}" styleClass="aon-portlet-title-text"/>
			</aon:div>
			<aon:div styleClass="aon-portlet-body">
				<aon:commandLink action="corporateIdentity_receipt"
					actionListener="#{corporateIdentity.onInit}">
					<h:graphicImage url="#{aonResource.resolve['/images/aon-icon-big/aon-icon-big-receipt.png']}" />
					<f:setPropertyActionListener value="#{true}"
						target="#{corporateIdentity.showBackButton}"  />															
				</aon:commandLink>
			</aon:div>
		</aon:div>
	
	</aon:panelGrid>

</ui:composition>
