<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<ui:decorate template="/com/code/aon/ui/registry/facelet/registry/newDetailModal.xhtml">
		<ui:param name="detailId" value="RecordData" />
		<ui:param name="minWidth" value="800" />
		<ui:param name="minHeight" value="400" />
		<ui:param name="contentColumns" value="4" />
		<ui:param name="modalTitle" value="#{registryBundle.registry_rd_module}" />
		<ui:param name="showNewDetailWindow" value="#{controller.showNewRecordDataWindow}" />
		<ui:param name="detailController" value="#{recordDataController}" />
	
		<ui:define name="content">
			<ui:include src="/com/code/aon/ui/registry/facelet/record_data/form_content.xhtml" >
				<ui:param name="controller" value="#{recordDataController}" />
			</ui:include>
		</ui:define>
		<ui:define name="afterContent">
			<aon:div styleClass="aon-padding-top" id="recordDataGrid">
				<aon:panelGrid columns="2" style="width: 100%"
					columnClasses="aon-panelGrid-odd aon-width-150,aon-panelGrid-even aon-width-auto">
				
					<aon:outputLabel for="RecordData_file"
						value="#{bundle.aon_fileupload_element}" />
					<aon:div id="attachmentGrid">
						<a4j:region>
							<aon:commandLink styleClass="aon-icon aon-icon-delete"
								rendered="#{recordDataController.attachAvailable}" reRender="attachmentGrid"
								actionListener="#{recordDataController.onAttachRemove}"
								title="#{bundle.aon_fileupload_remove}">
								<aon:outputText value="&#160;" />
							</aon:commandLink>
							<a4j:htmlCommandLink target="_blank"
								rendered="#{recordDataController.attachAvailable}"
								actionListener="#{recordDataController.downloadAttachment}"
								styleClass="aon-icon aon-icon-mail-save"
								title="#{bundle.aon_fileupload_download}">
								<aon:outputText value="#{recordDataController.attachDescription}" />
							</a4j:htmlCommandLink>									
							<aon:fileUpload id="RecordData_file"
								addControlLabel="#{bundle.aon_fileUpload_add}"
								stopControlLabel="#{bundle.aon_fileUpload_stop}"
								stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
								uploadControlLabel="#{bundle.aon_fileUpload_upload}"
								fileUploadListener="#{recordDataController.fileUploaded}"
								immediateUpload="true" autoclear="true" listWidth="0px"
								listHeight="0px">
								<f:facet name="label">
									<aon:outputText value="#{bundle.aon_fileUpload_upload_label}" />
								</f:facet>
								<a4j:support event="onuploadcomplete" reRender="attachmentGrid" />
							</aon:fileUpload>
						</a4j:region>				
					</aon:div>
				</aon:panelGrid>
			</aon:div>
		</ui:define>
		
	</ui:decorate>
	
</ui:composition>
