<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showNew#{detailId}Window">
		<c:if test="#{showNewDetailWindow}">
			<rich:modalPanel id="new#{detailId}ModalPanel"
				minWidth="#{minWidth}" minHeight="#{minHeight}" zindex="90"
				showWhenRendered="#{showNewDetailWindow}" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{modalTitle}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="close-button"
							styleClass="aon-popupWindow-close"
							actionListener="#{detailController.onCancel}"
							reRender="showNew#{detailId}Window" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{showNewDetailWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="new#{detailId}Form">
					<aon:div styleClass="aon-popupWindow-content">
						<aon:div style="width:100%">
							<aon:div styleClass="aon-popupWindow-content-internal">
								<aon:div style="width:99%">
									<aon:div styleClass="aon-toolbar">
									
										<h:panelGrid columns="2" cellspacing="0" cellpadding="0"
											columnClasses="aon-finding-subtitle, aon-finding-toolbar">
								
											<aon:div styleClass="aon-finding-subtitle-internal">
												<aon:outputText value="#{bundle.aon_reset} " />			
											</aon:div>
											
											<aon:div styleClass="aon-finding-toolbar-item-group">
												<aon:commandButton id="#{detailId}-save"
													styleClass="aon-finding-toolbar-item aon-icon-accept"
													value="#{bundle.aon_save}"
													actionListener="#{detailController.onAccept}"
													reRender="showNew#{detailId}Window,#{modalReRender}"
													accesskey="#{bundle.aon_key_save}">
													<rich:componentControl for="new#{detailId}ModalPanel"
														event="onclick" operation="hide"/>																					
													<f:setPropertyActionListener target="#{showNewDetailWindow}"
														value="#{false}" />
												</aon:commandButton>
												<aon:commandButton id="#{detailId}-cancel" immediate="true"
													styleClass="aon-finding-toolbar-item aon-icon-cancel"
													value="#{bundle.aon_cancel}"
													actionListener="#{detailController.onCancel}"
													reRender="showNew#{detailId}Window,#{modalReRender}">
													<f:setPropertyActionListener target="#{showNewDetailWindow}"
														value="#{false}" />
												</aon:commandButton>		
												<aon:commandButton id="#{detailId}-remove" immediate="true"
													styleClass="aon-finding-toolbar-item aon-icon-delete"
													value="#{bundle.aon_remove}"
													rendered="#{!detailController.new}"
													actionListener="#{detailController.onRemove}"
													reRender="showNew#{detailId}Window,#{modalReRender}">
													<f:setPropertyActionListener target="#{showNewDetailWindow}"
														value="#{false}" />
												</aon:commandButton>		
											</aon:div>
										</h:panelGrid>
									
									</aon:div>
									<aon:div styleClass="aon-scroll-area">
										<aon:panelGrid columns="#{(contentColumns!=null)?(contentColumns):('2')}" dir="true" style="width: 100%">
										
											<ui:insert name="content" />

										</aon:panelGrid>
										
										<ui:insert name="afterContent" />
										
									</aon:div>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:form>
			
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
