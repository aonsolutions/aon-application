<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="recordDataForm" enctype="multipart/form-data">

			<t:div id="aon-content-menu" styleClass="aon-content-menu-aux"
				forceId="#{true}" style="margin-left:16px;margin-right:16px;">
				<h:outputText
					value="#{company.to.name} #{company.to.surname}, #{registryBundle.aon_cif}: #{company.to.document}" />
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal" style="padding-top:0">

					<t:div styleClass="aon-content-menu" rendered="#{!company.new}" id="aon-content-menu" forceId="#{true}">
						<t:panelGrid columns="2" cellpadding="0" cellspacing="0" border="0">
							<t:panelGroup>						
								<t:commandLink id="company_data" forceId="#{true}"
									value="#{registryBundle.aon_company_data}" action="company"
									styleClass="aon-content-menu-item" />
							</t:panelGroup>	
							<t:panelGroup>
								<t:commandLink id="record_data"
									value="#{registryBundle.aon_record_data}" forceId="#{true}"
									styleClass="aon-content-menu-item-active" />
							</t:panelGroup>	
						</t:panelGrid>
					</t:div>

					<ui:include src="/facelet/record_data/form.xhtml">
						<ui:param name="recordData" value="#{companyRecordData}"/>
						<ui:param name="downloadPage" value="/facelet/registry/company/record_data/download.faces"/>
					</ui:include>

				</t:div>
			</t:div>

		</h:form>

		<h:form id="placeList" target="list" />

	</ui:define>

</ui:composition>

</body>
</html>
