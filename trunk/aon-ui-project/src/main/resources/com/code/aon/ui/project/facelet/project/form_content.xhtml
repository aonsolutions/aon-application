<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">


	<aon:outputLabel for="Project_id" rendered="#{!project.new}" 
		value="#{bundle.aon_id}" />
	<aon:div rendered="#{!project.new}">
		<aon:inputText id="Project_id" required="true" disabled="true"
			size="10" value="#{project.to.id}" />
		<aon:selectBooleanCheckbox id="Project_active" styleClass="aon-margin-left" 
			value="#{controller.to.active}" />	
		<aon:outputLabel for="Project_active" value="#{bundle.aon_active}" />	
	</aon:div>

	<aon:outputLabel for="Project_name" value="#{bundle.aon_name}" />
	<aon:inputText id="Project_name" required="true"
		size="64" maxlength="64" value="#{controller.to.name}" />
	
	<aon:outputLabel for="Project_alias" value="#{bundle.aon_alias}" />
	<aon:inputText id="Project_alias" 
		size="32" maxlength="32" value="#{controller.to.alias}" />

	<aon:outputLabel for="Project_date" value="#{bundle.aon_date}" />
	<aon:selectInputDate id="Project_date"
		value="#{controller.to.date}" required="#{true}"
		renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
	</aon:selectInputDate>
	
	<c:if test="#{!skipRegistryLookup}">  
		<aon:outputLabel for="Registry_id" value="#{projectBundle.project_assigned}"/>
		<ui:include src="/com/code/aon/ui/registry/facelet/registry/registryLookup.xhtml" >
			<ui:param name="lookupTo" value="#{controller.to.registry}" />
			<ui:param name="skipLabel" value="#{true}" />
			<ui:param name="idRequired" value="#{true}" />
		</ui:include>
	</c:if>
	
	<aon:outputLabel for="Project_projectType" value="#{projectBundle.project_project_type}"/>
	<aon:selectOneMenu id="Project_projectType"
		value="#{controller.to.projectType}">
		<f:selectItem itemLabel="-" value="#{null}"/>
		<f:selectItems value="#{projectCollections.projectTypes}" />
	</aon:selectOneMenu>
	
	<aon:outputText value="&#160;" />
	<aon:div>
		<aon:selectBooleanCheckbox id="Project_commercial" disabled="true" 
			styleClass="aon-margin-left" value="#{controller.to.commercial}" />	
		<aon:outputLabel for="Project_commercial" value="#{projectBundle.project_commercial}"/>
		<aon:selectBooleanCheckbox id="Project_tas" disabled="true" 
			styleClass="aon-margin-left" value="#{controller.to.tas}" />	
		<aon:outputLabel for="Project_tas" value="#{projectBundle.project_tas}"/>
		<aon:selectBooleanCheckbox id="Project_dossier" disabled="true" 
			styleClass="aon-margin-left" value="#{controller.to.dossier}" />	
		<aon:outputLabel for="Project_dossier" value="#{projectBundle.project_dossier}"/>
	</aon:div>

		
</ui:composition>
