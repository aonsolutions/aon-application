<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="projectTypeForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{projectBundle.project_project_type}" />
				<ui:param name="controller" value="#{projectType}" />
				<ui:param name="skipSearchButton" value="true" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2" dir="true">
					<aon:outputLabel for="ProjectType_description" value="#{bundle.aon_description}" />
					<aon:inputText id="ProjectType_description" required="true"
						size="60" maxlength="45" value="#{projectType.to.description}" />
					
					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="ProjectType_active" 
							value="#{projectType.to.active}" />	
						<aon:outputLabel for="ProjectType_active" value="#{bundle.aon_active}" />	
					</aon:div>
				</aon:panelGrid>

				<aon:div styleClass="aon-form-group" rendered="#{!projectType.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:outputLabel for="activityTypeDataList"
							value="#{projectBundle.project_activity_type}" />
					</aon:div>
					<aon:div styleClass="aon-form-group-body">

						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
							<ui:param name="controller" value="#{activityType}" />
							<ui:param name="columnClasses" value="aon-editDataTable-text" />
							<ui:define name="columns">
								<ui:include src="/com/code/aon/ui/project/facelet/activityType/gridColumnsContent.xhtml">
									<ui:param name="showProjectType" value="#{false}" />
								</ui:include>
							</ui:define>
						</ui:decorate>
						
					</aon:div>
				</aon:div>
			</aon:div>
			
		</aon:form>

	</ui:define>
</ui:composition>
