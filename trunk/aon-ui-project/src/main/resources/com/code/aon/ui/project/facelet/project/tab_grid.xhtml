<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich">
	
	<aon:methodParam name="rowSelectorAction" value="project_form"/>
			
	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
		<ui:define name="columns">
			<aon:column alias="Project.name" styleClass="aon-editDataTable-textColumn aon-width-200">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.name}" />
			</aon:column>

			<c:if test="#{!skipAssignedColumn}">
				<aon:column alias="Project.registry.name" styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputText value="#{projectBundle.project_assigned}" />
					</f:facet>
					<aon:outputText value="#{to.registry.fullName}" />
				</aon:column>
			</c:if>

			<aon:column alias="Project.alias" styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_alias}" />
				</f:facet>
				<aon:outputText value="#{to.alias}" />
			</aon:column>
			
			<aon:column alias="Project.date" styleClass="aon-editDataTable-textColumn aon-width-100">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.date}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column alias="Project.projectType" styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputText value="#{projectBundle.project_project_type}" />
				</f:facet>
				<aon:outputText value="#{to.projectType.description}" />
			</aon:column>

			<aon:column alias="Project.active" styleClass="aon-editDataTable-textColumn aon-width-40">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_active}" />
				</f:facet>
				<aon:outputText value="&#160;"
					styleClass="#{(to.active)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'} aon-padding-bottom" />
			</aon:column>							
		</ui:define>
	</ui:decorate>

</ui:composition>
