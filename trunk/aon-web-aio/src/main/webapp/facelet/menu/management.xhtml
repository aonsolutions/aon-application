<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="managementMenu">

			<aon:div styleClass="aon-scroll-area">
				<h:panelGrid styleClass="aon-width-all" columns="3" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-200
					             , aon-vertical-align-top aon-width-200
					             , aon-vertical-align-top aon-width-200">

					<c:if test="#{aonRole.saleOperator}">
						<aon:panelGroup>
							<aon:panelGrid id="group_management_holder_sales"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-sales aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_sales}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<c:if test="#{domainSwitcher.type == 'HOTEL'}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="advanceInvoice" 
												action="advanceInvoice_search"
												actionListener="#{advanceInvoice.onEditSearch}"
												value="#{pmsBundle.pms_advance_invoice_module}"/>
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="noShowInvoice" 
												action="noShowInvoice_search"
												actionListener="#{noShowInvoice.onEditSearch}"
												value="#{pmsBundle.pms_noShow_invoice_module}"/>
										</aon:div>
									</c:if>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="saleInvoiceManagement"
											action="saleInvoice_search"
											actionListener="#{saleInvoice.onEditSearch}"
											value="#{financeBundle.finance_sale_invoice_management_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sales-management" 
											action="sales_search-management"
											actionListener="#{sales.onEditSearch}"
											value="#{salesBundle.sales_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="customer-management"
											action="customer_search-management"
											actionListener="#{customer.onEditSearch}"
											value="#{customerBundle.customer_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="aon_invoicing_group-management"
											action="invoicingGroup_list-management"
											actionListener="#{invoicingGroup.onEditSearch}"
											value="#{customerBundle.customer_invoicing_group_module}">
											<aon:actionListener method="#{invoicingGroup.onSearch}"/>
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						
							<c:if test="#{aonRole.statisticsOperator}">
								<aon:panelGrid id="group_sales_reports"
									styleClass="aon-width-all" columnClasses="aon-padding"
									headerClass="aon-icon-statistics aon-direct-access-panel">
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aio_sales_report}" />
									</f:facet>
									<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="salesAccumulate"
												action="sales_accumulate_search-sales"
												actionListener="#{stat.onReset}" 
												value="#{statBundle.stat_menu_acumulado}">
												<aon:actionListener method="#{stat.onSaleType}"/>
											</aon:commandLink>
										</aon:div>
									
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="saleCategoryStats"
												action="category_stats_search-sales" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_menu_category}" >
												<aon:actionListener method="#{stat.onSaleType}"/>
											</aon:commandLink>
										</aon:div>
			
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="saleSummaryStats"
												action="summary_stats_search-sales"
												actionListener="#{stat.onReset}" 
												value="#{statBundle.stat_menu_summary}"  >
												<aon:actionListener method="#{stat.onSaleType}"/>
											</aon:commandLink>
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="saleABCStats"
												action="abc_stats_search-sales"
												actionListener="#{stat.onReset}" 
												value="#{statBundle.stat_abc_customer}" >
												<aon:actionListener method="#{stat.onSaleType}"/>
											</aon:commandLink>
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="saleABCStatsProduct"
												action="abc_stats_searchProduct-sales" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_abc_product}" >
												<aon:actionListener method="#{stat.onSaleType}"/>
											</aon:commandLink>
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="saleABCStatsCategory"
												action="abc_stats_searchCategory-sales" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_abc_category}" >
												<aon:actionListener method="#{stat.onSaleType}"/>
											</aon:commandLink>
										</aon:div>
									</aon:div>
								</aon:panelGrid>
							</c:if>
							
							<aon:panelGrid id="group_sales_finance"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-auxiliary aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{financeBundle.finance_fees_module}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="aon_fee_assignment" 
											action="feeAssignment_search"
											actionListener="#{feeAssignment.onEditSearch}"
											value="#{financeBundle.finance_fee_assignment_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="aon_invoicing"
											action="feeInvoicing"
											actionListener="#{feeInvoicing.onInitialize}"
											value="#{financeBundle.finance_fee_invoicing_module}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="aon_pre_invoicing"
											action="feePreInvoicing"
											actionListener="#{preInvoicing.onInitialize}"
											value="#{financeBundle.finance_pre_invoicing_module}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="aon_fee_print"
											action="feePrint_search"
											actionListener="#{feePrint.onEditSearch}"
											value="#{financeBundle.finance_fee_print_module}">
											<f:setPropertyActionListener value="#{false}"
												target="#{feePrintSearch.anual}" />
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="aon_fee_print_anual"
											action="feePrint_search-anual"
											actionListener="#{feePrint.onEditSearch}"
											value="#{financeBundle.finance_fee_print_proy_module}">
											<f:setPropertyActionListener value="#{true}"
												target="#{feePrintSearch.anual}" />
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
								
							<aon:panelGrid id="group_sales_utilities"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-utilities aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_utilities}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="invoicePrint"
											action="invoicePrint_search"
											actionListener="#{invoicePrint.onEditSearch}"
											value="#{financeBundle.finance_invoice_print_module}"/>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="delivery_invoicing"
											action="deliveryInvoicing"
											actionListener="#{deliveryInvoicing.onInitialize}"
											value="#{financeBundle.finance_delivery_invoicing_module}"/>
									</aon:div>									
		<!-- 
			Se quita esta opcion del menu por su peligrosidad obvia. Ahora mismo genera facturas que no son compatibles con la aplicacion 
			a la hora de imprimirlas o contabilizarlas. Si sigue adelante este tema habria que revisarlo con MAC para dejarlo bien.
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="rectifierInvoiceManagement"
												action="rectifierInvoice_search" actionListener="#{rectifierInvoice.onReset}"
												value="#{financeBundle.finance_special_rectifier_invoice_module}" />
										</aon:div>
		 -->								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="invoiceRemover"
											action="invoiceRemover_search"
											actionListener="#{invoiceRemover.onEditSearch}"
											value="#{financeBundle.finance_invoice_removing_module}"/>
									</aon:div>
									<c:if test="#{company.EInvoice and (certificate.certificateCount>0) and aonRole.ESignature}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="saleInvoiceSigner"
												action="invoiceSigner_search"
												actionListener="#{invoiceSigner.onEditSearch}"
												value="#{financeBundle.finance_invoice_signing_module}"/>
										</aon:div>								
									</c:if>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="no_fee_customers"
											action="noFeeCustomer_list"
											actionListener="#{customerFee.onNoFeeCustomers}"
											value="#{financeBundle.finance_fee_no_fee_customer_module}"/>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</aon:panelGroup>
					</c:if>

					<c:if test="#{aonRole.purchaseOperator}">
						<aon:panelGroup>
							<aon:panelGrid id="group_management_holder_purchases"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-purchase aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_purchases}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseInvoiceManagement"
											action="purchaseInvoice_search"
											actionListener="#{purchaseInvoice.onEditSearch}"
											value="#{financeBundle.finance_purchase_invoice_management_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchase" 
											action="purchase_search"
											actionListener="#{purchase.onEditSearch}"
											value="#{purchaseBundle.purchase_module}" />
									</aon:div>									
									<c:if test="#{(domainSwitcher.type == 'HOTEL') and (aonRole.warehouseOperator)}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="proposal"
												action="proposal_search"
												actionListener="#{proposal.onEditSearch}"
												value="#{purchaseBundle.purchase_proposal_module}">
											</aon:commandLink>
										</aon:div>				
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="purchaseOrder"
												action="purchaseOrder_grid"
												actionListener="#{purchaseOrder.onInit}"
												value="#{purchaseBundle.purchase_purchaseOrder_module}">
											</aon:commandLink>
										</aon:div>				
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="purchasePrint" 
												action="purchasePrint_search"
												actionListener="#{purchasePrint.onEditSearch}"
												value="#{purchaseBundle.purchase_purchasePrint_module}" />
										</aon:div>															
									</c:if>																											
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="supplier-management" 
											action="supplier_search-management"
											actionListener="#{supplier.onEditSearch}"
											value="#{supplierBundle.supplier_module}" />
									</aon:div>
									<c:if test="#{aonRole.productOperator}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="item-management" 
												action="item_search-management"
												actionListener="#{item.onEditSearch}"
												value="#{productBundle.product_module}" />												
										</aon:div>
									</c:if>									
								</aon:div>
							</aon:panelGrid>
							
							<c:if test="#{aonRole.statisticsOperator}">
								<aon:panelGrid id="group_purchase_reports"
									styleClass="aon-width-all" columnClasses="aon-padding"
									headerClass="aon-icon-statistics aon-direct-access-panel">		
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aio_purchase_report}" />
									</f:facet>
									<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="purchaseAccumulate"
												action="sales_accumulate_search-purchase" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_menu_acumulado2}">
												<aon:actionListener method="#{stat.onPurchaseType}"/>
											</aon:commandLink>
										</aon:div>
									
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="purchaseCategoryStats"
												action="category_stats_search-purchase"
												actionListener="#{stat.onReset}" 
												value="#{statBundle.stat_menu_category}" >
												<aon:actionListener method="#{stat.onPurchaseType}"/>
											</aon:commandLink>
										</aon:div>
			
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="purchaseSummaryStats"
												action="summary_stats_search-purchase" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_menu_summary}"  >
												<aon:actionListener method="#{stat.onPurchaseType}"/>
											</aon:commandLink>
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="purchaseABCStats"
												action="abc_stats_search-purchase" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_abc_supplier}" >
												<aon:actionListener method="#{stat.onPurchaseType}"/>
											</aon:commandLink>
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="purchaseABCStatsProduct"
												action="abc_stats_searchProduct-purchase"
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_abc_product}" >
												<aon:actionListener method="#{stat.onPurchaseType}"/>
											</aon:commandLink>
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="purchaseABCStatsCategory"
												action="abc_stats_searchCategory-purchase" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_abc_category}" >
												<aon:actionListener method="#{stat.onPurchaseType}"/>
											</aon:commandLink>
										</aon:div>
									</aon:div>
								</aon:panelGrid>
							</c:if>

						</aon:panelGroup>
					</c:if>

					<c:if test="#{aonRole.purchaseOperator}">
						<aon:panelGroup>
							<aon:panelGrid id="group_management_holder_expenses"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-expenses aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{productBundle.product_expense_module}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseInvoice-management"
											action="expenseInvoice_search-management"
											actionListener="#{expenseInvoice.onEditSearch}"
											value="#{financeBundle.finance_expense_invoice_management_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="undeductibleInvoiceManagement"
											action="undeductibleInvoice_search"
											actionListener="#{undeductibleInvoice.onEditSearch}"
											value="#{financeBundle.finance_undeductible_invoice_management_module}" />
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="creditor-management" 
											action="creditor_search-management"
											actionListener="#{creditor.onEditSearch}"
											value="#{financeBundle.finance_creditor_module}" >
										</aon:commandLink>
									</aon:div>
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseItem-management" 
											action="expenseItem-management" 
											value="#{productBundle.product_expense_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
	
							<c:if test="#{aonRole.statisticsOperator}">
								<aon:panelGrid id="group_expenses_reports"
									styleClass="aon-width-all" columnClasses="aon-padding"
									headerClass="aon-icon-statistics aon-direct-access-panel">		
									<f:facet name="header">
										<aon:outputText value="#{appBundle.aio_expenses_report}" />
									</f:facet>
									<aon:div styleClass="aon-direct-access-list">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="expenseAccumulate"
												action="sales_accumulate_search-expenses" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_menu_expense}">
												<aon:actionListener method="#{stat.onExpenseType}"/>
											</aon:commandLink>
										</aon:div>
									
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="expenseCategoryStats"
												action="category_stats_search-expenses" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_menu_category_expense}" >
												<aon:actionListener method="#{stat.onExpenseType}"/>
											</aon:commandLink>
										</aon:div>
			
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="expenseSummaryStats"
												action="summary_stats_search-expenses" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_menu_summary}"  >
												<aon:actionListener method="#{stat.onExpenseType}"/>
											</aon:commandLink>
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="expenseABCStats"
												action="abc_stats_search-expenses" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_abc_creditor}" >
												<aon:actionListener method="#{stat.onExpenseType}"/>
											</aon:commandLink>
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="expenseABCStatsProduct"
												action="abc_stats_searchProduct-expenses"
												actionListener="#{stat.onReset}"												
												value="#{statBundle.stat_abc_expense}" >
												<aon:actionListener method="#{stat.onExpenseType}"/>
											</aon:commandLink>
										</aon:div>
										
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="expenseABCStatsCategory"
												action="abc_stats_searchCategory-expenses" 
												actionListener="#{stat.onReset}"
												value="#{statBundle.stat_abc_category}" >
												<aon:actionListener method="#{stat.onExpenseType}"/>
											</aon:commandLink>
										</aon:div>
									</aon:div>
								</aon:panelGrid>
							</c:if>
						</aon:panelGroup>
					</c:if>
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
