<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="sessionList">
		
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_sessions}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_listing}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="session_search" actionListener="#{auditSession.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />				
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="sessionData" value="#{auditSession.model}"
					var="to" rows="20" rendered="#{auditSession.model.rowCount > 0}"
					columnClasses="aon-editDataTable-numberColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn">

					<aon:rowSelector action="session_form" actionListener="#{auditSession.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}"/>
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_session_startDate}" />
						</f:facet>
						<aon:outputText value="#{to.startDate}">
							<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>							
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_session_endDate}" />
						</f:facet>
						<aon:outputText value="#{to.endDate}">
							<f:convertDateTime pattern="#{bundle.aon_timestamp_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>							
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_domain}" />
						</f:facet>
						<aon:outputText value="#{to.user.domain.name}"/>
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_application}" />
						</f:facet>
						<aon:outputText value="#{to.application.name}"/>
					</aon:column>

 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_user}" />
						</f:facet>
						<aon:outputText value="#{to.user.login}"/>
					</aon:column>
 
				</aon:dataTable>

				<aon:dataScroller2 for="sessionData" showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
