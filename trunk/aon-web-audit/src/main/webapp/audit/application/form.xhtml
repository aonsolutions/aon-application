<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="applicationForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_applications}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{auditApplication.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="application_form"
							actionListener="#{auditApplication.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{auditApplication.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{auditApplication.onCancel}"
							confirmAction="application_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!auditApplication.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{auditApplication.onRemove}"
							confirmAction="application_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!auditApplication.new}" immediate="true"
							action="application_search" actionListener="#{auditApplication.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />														
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							rendered="#{!auditApplication.new}" immediate="true"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							actionListener="#{auditApplication.onCancel}"
							action="application_list"
							accesskey="#{bundle.aon_key_cancel}" />
							
						<aon:spin controller="#{auditApplication}" action="application_form" rendered="#{!auditApplication.new}" />
							
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" dir="true" width="100%">
					<aon:outputLabel for="Application_id"
						rendered="#{!auditApplication.new}" value="#{bundle.aon_id}" />
					<aon:inputText id="Application_id" value="#{auditApplication.to.id}"
						rendered="#{!auditApplication.new}" size="15" disabled="true" />
				
					<aon:outputLabel for="Application_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="Application_name" maxlength="64"
						value="#{auditApplication.to.name}" size="64">
					</aon:inputText>
				</aon:panelGrid>
				
				<aon:div styleClass="aon-form-group" rendered="#{!seller.new}">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel for="applicationActionData" value="#{menuBundle.aon_actions}" />
						</aon:div>
					</aon:div>
					<ui:include src="/audit/application/action/grid.xhtml"/>
				</aon:div>
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
