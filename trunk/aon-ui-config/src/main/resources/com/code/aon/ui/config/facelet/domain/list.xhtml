<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="mainContent">
		<aon:form id="domainList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="toolbarTitle" value="#{configBundle.config_domain_module}" />
				<ui:param name="controller" value="#{domainSwitcher}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-back"
						title="#{bundle.aon_key_cancel_accelerator}"
						value="#{bundle.aon_back}" rendered="#{!formNew}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						action="index" accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:div styleClass="aon-panelGrid-search aon-margin-bottom aon-padding-top aon-text-center">
					<aon:outputText styleClass="aon-italic aon-margin-right aon-bold" value="#{bundle.aon_filter}:"/>
					<aon:inputText id="domainFilter0" size="80" value="#{domainSwitcher.filter}">
						<a4j:support 
							event="onkeyup"
							reRender="domainSwitcherTableContainer"
							eventsQueue="domainSwitcherFilterKeyUp"
							requestDelay="500"
							ajaxSingle="true"
							ignoreDupResponses="true"
							limitToList="true"/>
					</aon:inputText>
				</aon:div>
				
				<aon:div id="domainSwitcherTableContainer" styleClass="aon-width-all">
					<aon:methodParam name="rowSelectorAction" value="index" />
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
						<ui:param name="controller" value="#{domainSwitcher}" />
						<ui:param name="rows" value="#{domainSwitcherRows}" />
						<ui:param name="skipFocusFirst" value="true" />
												
						<ui:define name="columns">
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto"
								style="#{to.parent==null?'color: #0072CF;':''}">
							
								<f:facet name="header">
									<aon:outputLabel value="#{bundle.aon_name}" />
								</f:facet>
								<aon:outputText value="#{to.description}" />
							</aon:column>
			
							<aon:column styleClass="aon-editDataTable-textColumn aon-width-200"
								style="#{to.parent==null?'color: #0072CF;':''}">
								<f:facet name="header">
									<aon:outputLabel value="#{bundle.aon_domain}" />
								</f:facet>
								<aon:outputText value="#{to.name}" />
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
