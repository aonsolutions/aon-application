<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="publicParameterForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{configBundle.config_publish_parameters_module}" />
				<ui:param name="toolbarDescription"	value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{bundle.aon_accept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						actionListener="#{publishParameter.accept}"
						accesskey="#{bundle.aon_key_save}" >
					</aon:commandButton>						
				</ui:define>				
			</ui:decorate>			

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">
				
					<ui:include
						src="/com/code/aon/ui/config/facelet/publishParameter/formContent.xhtml" />				

				</aon:panelGrid>

			</aon:div>

		</aon:form>

	</ui:define>
</ui:composition>
