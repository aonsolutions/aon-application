<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="taxList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{configBundle.config_tax_module}" />
					<ui:param name="controller" value="#{tax}" />
				</ui:include>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{tax}" />
						<ui:param name="columnClasses"
							value="aon-editDataTable-text,aon-editDataTable-text,aon-editDataTable-text,aon-editDataTable-text,aon-editDataTable-text" />

						<ui:define name="columns">

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText value="#{to.name}"
									rendered="#{to.id!=tax.to.id}" />
								<aon:inputText rendered="#{to.id==tax.to.id}"
									value="#{tax.to.name}" required="true" />
								<f:facet name="footer">
									<aon:inputText rendered="#{tax.new}" value="#{tax.to.name}"
										required="true" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_type}" />
								</f:facet>
								<aon:outputText value="#{to.type}"
									rendered="#{to.id!=tax.to.id}" />
								<aon:selectOneMenu rendered="#{to.id==tax.to.id}"
									required="true" value="#{tax.to.type}">
									<f:selectItems value="#{configCollections.taxTypes}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu rendered="#{tax.new}" required="true"
										value="#{tax.to.type}">
										<f:selectItems value="#{configCollections.taxTypes}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_date_from}" />
								</f:facet>
								<aon:outputText value="#{to.startDate}"
									rendered="#{to.id!=tax.to.id}">
									<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
								</aon:outputText>
								<aon:panelGrid columns="1" rendered="#{to.id==tax.to.id}">
									<aon:selectInputDate size="8" id="Tax_start_date-Edit"
										value="#{tax.to.startDate}" enableManualInput="true"
										datePattern="dd/MM/yyyy"
										timeZone="#{timeZoneController.timeZone}" />
								</aon:panelGrid>
								<f:facet name="footer">
									<aon:selectInputDate size="8" id="Tax_start_date-New"
										rendered="#{tax.new}" value="#{tax.to.startDate}"
										enableManualInput="true" datePattern="dd/MM/yyyy"
										timeZone="#{timeZoneController.timeZone}" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_percentage}" />
								</f:facet>
								<aon:outputText value="#{to.percentage}"
									rendered="#{to.id!=tax.to.id}" />
								<aon:inputText rendered="#{to.id==tax.to.id}" size="6"
									value="#{tax.to.percentage}" required="true" />
								<f:facet name="footer">
									<aon:inputText rendered="#{tax.new}"
										value="#{tax.to.percentage}" required="true" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_surcharge}" />
								</f:facet>
								<aon:outputText value="#{to.surcharge}"
									rendered="#{to.id!=tax.to.id}" />
								<aon:inputText rendered="#{to.id==tax.to.id}"
									value="#{tax.to.surcharge}" required="true" />
								<f:facet name="footer">
									<aon:inputText rendered="#{tax.new}"
										value="#{tax.to.surcharge}" required="true" />
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
