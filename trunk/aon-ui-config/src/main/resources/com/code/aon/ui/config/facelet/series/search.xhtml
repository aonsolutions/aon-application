<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:valueParam name="aliasPreffix" default="#{controller.pojoShortName}" />

	<aon:outputLabel for="#{aliasPreffix}_series"
		value="#{bundle.aon_series}" />
	<aon:div>
		<aon:inputText id="#{aliasPreffix}_series"
			onblur="toUpperCase(this);"
			valueChangeListener="#{controller.addExpression}"
			size="5" maxlength="5">
		</aon:inputText>
		<aon:outputLabel for="#{aliasPreffix}_number-From"
			styleClass="aon-form-date-label aon-padding-right"
			value="#{bundle.aon_date_from} #{bundle.aon_number}:" />
		<aon:inputText id="#{aliasPreffix}_number-From"
			converter="javax.faces.Integer" size="7"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}" />							
		<aon:outputLabel for="#{aliasPreffix}_number-To"
			styleClass="aon-form-date-label aon-padding-right"
			value="#{bundle.aon_date_to} #{bundle.aon_number}:" />							
		<aon:inputText id="#{aliasPreffix}_number-To"
			converter="javax.faces.Integer" size="7"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}" />
	</aon:div>
	
</ui:composition>
