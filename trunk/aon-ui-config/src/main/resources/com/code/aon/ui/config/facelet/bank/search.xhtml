<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryForm" styleClass="aon-form">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{configBundle.config_bank_module}" />
				<ui:param name="controller" value="#{bank}" />
				<aon:methodParam name="backAction" value="bank" />
				<aon:methodParam name="resetAction" value="bank" />
			</ui:include>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{bank}" />
				<ui:define name="searchContent">
					<aon:methodParam name="searchAction" value="bank" />

					<aon:outputLabel for="Bank_name" value="#{bundle.aon_name}" />
					<aon:inputText id="Bank_name" size="40" maxlength="64"
						valueChangeListener="#{bank.addExpression}"
						onblur="toUpperCase(this);" />

					<aon:outputLabel for="Bank_code" value="#{bundle.aon_id}" />
					<aon:inputText id="Bank_code" maxlength="4" size="6"
						valueChangeListener="#{bank.addExpression}" />
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
