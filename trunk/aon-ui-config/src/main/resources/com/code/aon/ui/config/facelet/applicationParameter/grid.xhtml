<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="applicatoinParameterGrid">
			<aon:div ajaxRendered="true" layout="none">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{configBundle.config_app_param_module}" />
					<ui:param name="controller" value="#{applicationParameter}" />
				</ui:decorate>
			</aon:div>				
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
					<ui:param name="controller" value="#{applicationParameter}" />
					<ui:define name="columns">
				
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-150"
							alias="ApplicationParameter.name" >
							<f:facet name="header">
								<aon:outputLabel for="ApplicationParameter_name" value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.name}" rendered="#{formList}" />
							<aon:inputText id="ApplicationParameter_name"
								rendered="#{formEdit}" size="32" maxlength="32"
								value="#{controller.to.name}" required="true" />
							<f:facet name="footer">
								<aon:inputText id="ApplicationParameter_name-New"
									rendered="#{formNew}" size="32" maxlength="32"
									value="#{controller.to.name}" required="true" />
							</f:facet>
						</aon:column>
				
						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="ApplicationParameter.value" >
							<f:facet name="header">
								<aon:outputLabel for="ApplicationParameter_value" value="#{bundle.aon_value}" />
							</f:facet>
							<aon:outputText value="#{to.value}" rendered="#{formList}" />
							<aon:inputText id="ApplicationParameter_value"
								rendered="#{formEdit}" size="64" maxlength="64"
								value="#{controller.to.value}" />
							<f:facet name="footer">
								<aon:inputText id="ApplicationParameter_value-New"
									rendered="#{formNew}" size="64" maxlength="64"
									value="#{controller.to.value}" required="true" />
							</f:facet>
						</aon:column>
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>			
	</ui:define>
</ui:composition>
