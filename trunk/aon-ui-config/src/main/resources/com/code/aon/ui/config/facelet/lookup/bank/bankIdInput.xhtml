<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="#{id}Container" rendered="#{renderedAttr}">
		<a4j:region>
			<aon:inputText id="#{id}" value="#{entity}" disabled="#{disabled}"
				required="#{required}" size="5">
				<f:converter converterId="BankCodeConverter" />
				<a4j:support event="onkeyup"
					onsubmit="if(event.keyCode != 113) return false;"
					eventsQueue="#{id}KeyUp" ignoreDupResponses="true"
					requestDelay="100" actionListener="#{wizard.onShow}"
					immediate="true" reRender="#{id}Container"
					oncomplete="searchFieldForFocus('#{id}searchName')">
				</a4j:support>

				<a4j:support eventsQueue="#{id}OnChange"
					actionListener="#{wizard.onLookup}" ignoreDupResponses="true"
					requestDelay="100" event="onchange"
					reRender="#{id}Name,#{reRenderAttr}">
					<a4j:actionparam name="lookupActionParam"
						value="#{onLookupELExpression}"
						assignTo="#{wizard.extendedAttributesValueExpression}">
					</a4j:actionparam>
					<a4j:actionparam name="valueChangeListener"
						value="#{valueChangeListener}"
						assignTo="#{wizard.valueChangeListener}">
					</a4j:actionparam>
				</a4j:support>
			</aon:inputText>
		</a4j:region>
		<a4j:commandButton styleClass="aon-lookupButton" value=""
			disabled="#{disabled}" actionListener="#{wizard.onShow}"
			immediate="true" oncomplete="searchFieldForFocus('#{id}searchName')"
			reRender="#{id}Container" />
		<aon:div id="#{id}Name" style="display:inline"
			rendered="#{renderDescription}">
			<aon:outputText rendered="#{entity != null and entity.name != null}"
				value="#{entity.name}" />
			<aon:outputText rendered="#{entity.name == null}"
				value="---------------------------------" />
		</aon:div>
		<c:if test="#{wizard.visible}">

			<rich:modalPanel id="#{id}Panel" minHeight="600"
				rendered="#{wizard.visible}" showWhenRendered="true" minWidth="650"
				top="50" left="100" height="600" width="650" zindex="2000"
				resizeable="true">

				<a4j:support event="onkeyup"
					onsubmit="if(event.keyCode != 27) return false;"
					eventsQueue="#{id}EscKeyUp" ignoreDupResponses="true"
					requestDelay="100" actionListener="#{wizard.onClose}"
					immediate="true" reRender="#{id}Container"
					oncomplete="searchFieldForFocus('#{id}')">
				</a4j:support>

				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<h:outputText value="#{financeBundle.finance_bank_selection}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<a4j:commandButton type="button" styleClass="aon-popupWindow-close"
						actionListener="#{wizard.onClose}" immediate="true"
						reRender="#{id}Container"
						oncomplete="searchFieldForFocus('#{id}')">
					</a4j:commandButton>
				</f:facet>
				<a4j:region>
					<aon:panelGrid columns="2">
						<aon:outputText value="#{bundle.aon_id}" />
						<aon:inputText value="#{wizard.id}" size="40">
							<a4j:support event="onchange" ajaxSingle="true"
								eventsQueue="#{id}nm" ignoreDupResponses="true"
								requestDelay="100" actionListener="#{wizard.inputChanged}" />
						</aon:inputText>

						<aon:outputText value="#{bundle.aon_name}" />
						<aon:inputText value="#{wizard.name}" size="40">
							<a4j:support event="onchange" ajaxSingle="true"
								eventsQueue="#{id}sn" ignoreDupResponses="true"
								requestDelay="100" actionListener="#{wizard.inputChanged}" />
						</aon:inputText>

						<aon:outputText value="#{financeBundle.finance_bank_code}" />
						<aon:div>
							<aon:inputText value="#{wizard.code}" size="20">
								<a4j:support event="onchange" ajaxSingle="true"
									eventsQueue="#{id}ac" ignoreDupResponses="true"
									requestDelay="100" actionListener="#{wizard.inputChanged}" />
							</aon:inputText>
							<a4j:commandButton value="#{bundle.aon_search}"
								style="margin-left: 5px;" actionListener="#{wizard.onSearch}"
								accesskey="#{bundle.aon_key_search}"
								eventsQueue="#{id}SearchQueue" ignoreDupResponses="true"
								requestDelay="100" reRender="#{id}tableContainer"
								oncomplete="selectFirstRow('#{id}table')">
							</a4j:commandButton>
						</aon:div>
					</aon:panelGrid>
				</a4j:region>

				<rich:separator height="2px;"
					style="margin-top: 5px;margin-bottom: 5px;" />

				<aon:div id="#{id}tableContainer">
					<aon:editDataTable id="#{id}table" value="#{wizard.model}"
						var="bnk" rendered="#{wizard.model.rowCount > 0}"
						columnClasses="aon-editDataTable-iconColumn,
						aon-editDataTable-textColumn,
						aon-editDataTable-textColumn">
						<h:column>
							<aon:commandButton id="#{id}RowSelector"
								styleClass="aon-editDataTable-button aon-icon-rowSelector"
								actionListener="#{wizard.onSelect}" immediate="true"
								ajaxSingle="true" eventsQueue="#{id}SelectQueue"
								requestDelay="100" ignoreDupResponses="true"
								onkeyup="tableKeyUp(event.keyCode)"
								reRender="#{id}Container,#{reRenderAttr}">
								<a4j:actionparam name="actionParam"
									value="#{ELExpression}"
									assignTo="#{wizard.valueExpression}">
								</a4j:actionparam>
								<a4j:actionparam name="lookupActionParam"
									value="#{onLookupELExpression}"
									assignTo="#{wizard.extendedAttributesValueExpression}">
								</a4j:actionparam>
								<a4j:actionparam name="valueChangeListener"
									value="#{valueChangeListener}"
									assignTo="#{wizard.valueChangeListener}">
								</a4j:actionparam>
							</aon:commandButton>
						</h:column>

						<h:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_id}" />
							</f:facet>
							<aon:outputText value="#{bnk.code}" />
						</h:column>
						<h:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{bnk.name}" />
						</h:column>
					</aon:editDataTable>

					<aon:dataScroller2 for="#{id}table" showNote="true" />
				</aon:div>
			</rich:modalPanel>
		</c:if>

		<a4j:loadScript src="/js/extendedInput.js" />

	</aon:div>
</ui:composition>
