<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:subForm>
		<aon:panelGroup styleClass="aon-popup-panel aon-confirm-box" >
		
			<rich:modalPanel 
				id="idModalPanel"
				styleClass="aon-popup-" minWidth="300">

				<f:facet name="header">
					<aon:div styleClass="aon-popup-title">
						<aon:outputText value="#{confirmTitle}"/>
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:commandButton type="button" styleClass="aon-popup-button-close" immediate="true"
						image="/images/icefaces/popupclose.gif"
						onclick="Richfaces.hideModalPanel('idModalPanel');">
					</aon:commandButton>	
				</f:facet>

				<aon:panelGrid columns="1" style="width:100%;">
					<aon:div styleClass="aon-popup-question">
						<aon:div styleClass="">			
							<aon:outputText value="#{confirmMessage}" />				
						</aon:div>
					</aon:div>
					<aon:panelGrid columns="1"  style="width:100%;">
						<aon:div styleClass="aon-popup-buttons" >
							<aon:commandButton value="#{bundle.aon_yes}"
								action="#{confirmAction}"
								styleClass="aon-popup-button"
								immediate="#{immediate}"
								onclick="Richfaces.hideModalPanel('idModalPanel');">
								<f:setPropertyActionListener target="#{confirmShowWindow}" value="#{false}" />
								<c:if test="#{confirmActionListener != null}">									
									<aon:actionListener method="#{confirmActionListener}" />
								</c:if>
							</aon:commandButton>
							<aon:commandButton value="#{bundle.aon_no}"
								styleClass="aon-popup-button" immediate="true"
								onclick="Richfaces.hideModalPanel('idModalPanel');">
							</aon:commandButton>
						</aon:div>
					</aon:panelGrid>
				</aon:panelGrid>

			</rich:modalPanel>
			
		</aon:panelGroup>
		
	</aon:subForm>

</ui:composition>

</body>
</html>
