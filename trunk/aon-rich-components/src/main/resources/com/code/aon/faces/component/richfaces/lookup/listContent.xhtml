<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<!-- start toolbar navigation -->
	
	<aon:div rendered="#{lookup.showSearchButtons}" styleClass="aon-finding-title-toolbar">
		<aon:panelGrid columns="2" dir="true" columnClasses="aon-finding-title,aon-finding-toolbar">	

			<aon:div styleClass="aon-finding-title-internal">
				<aon:outputText value="#{lookup.component.windowTitle}"/>
			</aon:div>	
			
			<aon:div styleClass="aon-finding-toolbar-item-group">
				<aon:commandButton value="#{bundle.aon_search}"
					actionListener="#{lookup.onListCancel}" reRender="lookupContent"				
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_search}"/>
				<aon:commandButton value="#{bundle.aon_cancel}"
					actionListener="#{lookup.onCloseWindow}"
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					accesskey="#{bundle.aon_key_cancel}">
					<rich:componentControl for="#{lookupId}" event="onclick"
						disableDefault="true" operation="hide"/>
				</aon:commandButton>
			</aon:div>
			
		</aon:panelGrid>
	</aon:div>
	
	<!-- end toolbar navigation -->
		
	<aon:dataTable id="#{lookup.beanName}Data" 
		var="to" value="#{lookup.model}" rows="20">
		<aon:rowSelector
			actionListener="#{lookup.onListSelect}"
			reRender="#{lookup.component.selectReRender}"
			oncomplete="Richfaces.hideModalPanel('#{lookupId}')"
		/>				
		<ui:include src="#{lookup.listPagePath}" />
	</aon:dataTable>
	
	<aon:dataScroller dataTable="#{lookup.beanName}Data"
		model="#{lookup.model}" showNote="true" />

		
</ui:composition>

</body>
</html>
