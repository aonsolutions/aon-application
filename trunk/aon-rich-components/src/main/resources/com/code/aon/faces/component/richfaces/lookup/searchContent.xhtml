<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:div styleClass="aon-toolbar">
		<aon:commandButton id="clear" value="#{bundle.aon_clear}"
			type="reset" ajaxSingle="true" reRender="#{lookupId}LookupContent"
			styleClass="aon-finding-toolbar-item aon-icon-rubber" />			
		<aon:commandButton id="back" value="#{bundle.aon_back}"
			reRender="#{lookupId}ReRender"
			actionListener="#{lookup.onCloseWindow}" immediate="true"
			styleClass="aon-finding-toolbar-item aon-icon-cancel"
			accesskey="#{bundle.aon_key_cancel}" >
			<rich:componentControl for="#{lookupId}" event="onclick"
				disableDefault="true" operation="hide" />
		</aon:commandButton>
	</aon:div>
	<!-- end toolbar navigation -->

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
		<ui:define name="searchContent">
			<ui:param name="searchReRender" value="#{lookupId}LookupContent" />
			<ui:param name="searchButtonId" value="#{lookupId}Search" />
			<ui:param name="searchOnComplete" value="#{selectFirstRow}" />
			<aon:methodParam name="searchActionListener" value="#{lookup.onFilterSearch}" type="actionListener" />
			<aon:methodParam name="searchAction" />
	
			<ui:include src="#{lookup.searchPagePath}" />
			
			<aon:hotKey key="return" elementId="#{searchButtonId}" handlerEx="{element}.click();"/>
		</ui:define>
	</ui:decorate>

</ui:composition>

</body>
</html>
