<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="fileManagerSearch">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{richBundle.rich_fileManager}" />
				<ui:param name="controller" value="#{fileManager}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{fileManager}" />
				<ui:define name="searchContent">
				
					<aon:outputLabel for="File_name"
						value="#{bundle.aon_name}" />
					<aon:inputText id="File_name" size="80"
						value="#{controller.searchName}" />

					<aon:outputLabel for="File_content"
						value="#{bundle.aon_value}" />
					<aon:inputText id="File_content" size="80"
						value="#{controller.searchContent}" />
						
				</ui:define>
			</ui:decorate>
		</aon:form>
		</ui:define>
</ui:composition>
