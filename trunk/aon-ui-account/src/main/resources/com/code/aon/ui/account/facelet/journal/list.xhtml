<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountEntryReportList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountBundle.account_journal_module}" />
				<ui:param name="skipResetButton" value="true" />

				<aon:methodParam name="searchActionListener"
					default="#{journalReport.onEditSearch}" type="actionListener" />
				<aon:methodParam name="searchAction" default="journal_search"
					resolve="true" />
				<ui:define name="additionalToolbarContent">
					<h:commandLink target="_blank"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						value="#{bundle.aon_listing}" action="#{report.onExecute}">
						<f:param name="reportKey" value="journalBook" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>					
			</ui:decorate>
			<!-- 			
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							accesskey="#{bundle.aon_key_search}" action="daybook_search"
							actionListener="#{accountEntryReport.onEditSearch}"
							styleClass="aon-content-toolbar-item"
							onmouseout="this.className='aon-content-toolbar-item'"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover'">
						</aon:commandButton>
						<aon:commandButton id="diary" value="#{bundle.aon_listing}"
							forceId="#{true}"
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.faces');return false;"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							accesskey="#{bundle.aon_key_print}" />
 -->

			<aon:div styleClass="aon-scroll-area">
				<aon:dataTable id="journalReportList" value="#{journalReport.model}"
					rows="20" var="to" rendered="#{journalReport.model.rowCount > 0}">
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.accountEntry.id}" />
					</aon:column>

					<aon:column groupBy="true">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.accountEntry.entryDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.account_account}" />
						</f:facet>
						<aon:outputText value="#{to.account.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.account.description}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.account_concept}" />
						</f:facet>
						<aon:outputText value="#{to.concept}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.account_debit}" />
						</f:facet>
						<aon:outputText value="#{to.debit}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.account_credit}" />
						</f:facet>
						<aon:outputText value="#{to.credit}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{accountBundle.account_balancing_account}" />
						</f:facet>
						<aon:outputText value="#{to.balancingAccount.id}" />
					</aon:column>
				</aon:dataTable>
				<aon:dataScroller2 for="journalReportList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
