<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelCollapsible>
		<f:facet name="header">
			<aon:outputText value="#{accountBundle.aon_details}" />
		</f:facet>
		<aon:editDataTable id="TaxesData" var="to" rows="0"
			value="#{accountInvoice.details}">

			<aon:column styleClass="aon-editDataTable-iconColumn aon-column-5">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:commandButton immediate="#{true}" reRender="TaxesData"
					styleClass="aon-icon-commandButton aon-icon-rowSelector"
					rendered="#{!accountInvoice.newDetail and to!=accountInvoice.currentDetail}"
					disabled="#{!accountInvoice.accountSource}"
					actionListener="#{accountInvoice.onSelectDetail}" />
				<f:facet name="footer">
					<aon:commandButton value=""
						styleClass="aon-editDataTable-button aon-icon-new"
						reRender="TaxesData,invoiceTables"
						title="#{accountBundle.aon_newLine}"
						actionListener="#{accountInvoice.onNewDetail}"
						rendered="#{!accountInvoice.newDetail}"
						disabled="#{!accountInvoice.accountSource}"
						accesskey="#{bundle.aon_key_new_line}" focus="Item_details_total">
					</aon:commandButton>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-column-10">
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_taxable_base}" />
				</f:facet>
				<aon:outputText id="Account_Taxable_Base"
					rendered="#{to!=accountInvoice.currentDetail}"
					value="#{to.taxableBase}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText id="Account_Taxable_Base_Upd" size="8"
					rendered="#{to==accountInvoice.currentDetail}"
					value="#{accountInvoice.currentDetail.taxableBase}"
					required="#{true}" />
				<f:facet name="footer">
					<aon:div style="text-align:right;">
						<aon:inputText id="Account_Taxable_Base_New" size="8"
							reRender="newRetention,newVat,newSurcharge,newTotal"
							rendered="#{accountInvoice.newDetail}"
							value="#{accountInvoice.currentDetail.taxableBase}">
						</aon:inputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-column-10">
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_retention}" />
				</f:facet>
				<aon:outputText value="#{to.retention.percentage}"
					rendered="#{to!=accountInvoice.currentDetail}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
					
				<aon:selectOneMenu id="Account_Retention-Edit"
					styleClass="aon-form-selectOneMenu-field"
					rendered="#{to==accountInvoice.currentDetail}"
					value="#{accountInvoice.currentDetail.retention.id}"
					valueChangeListener="#{accountInvoice.onTaxChange}">
					<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
					<f:selectItems value="#{productCollections.retentionTaxes}" />
				</aon:selectOneMenu>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:selectOneMenu id="Account_Retention-New"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{accountInvoice.newDetail}"
						value="#{accountInvoice.currentDetail.retention.id}"
						reRender="newRetention,newVat,newSurcharge,newTotal"
						valueChangeListener="#{accountInvoice.onTaxChange}">
						<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
						<f:selectItems value="#{productCollections.retentionTaxes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-column-15">
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_vat}" />
				</f:facet>
				<aon:outputText value="#{to.vat.percentage}"
					rendered="#{to!=accountInvoice.currentDetail}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:selectOneMenu id="Account_Vat-Edit"
					styleClass="aon-form-selectOneMenu-field"
					rendered="#{to==accountInvoice.currentDetail}"
					value="#{accountInvoice.currentDetail.vat.id}"
					valueChangeListener="#{accountInvoice.onTaxChange}">
					<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
					<f:selectItems value="#{productCollections.vatTaxes}" />
				</aon:selectOneMenu>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:selectOneMenu id="Account_Vat-New"
						styleClass="aon-form-selectOneMenu-field"
						rendered="#{accountInvoice.newDetail}"
						value="#{accountInvoice.currentDetail.vat.id}" ajaxSingle="true"
						reRender="newRetention,newVat,newSurcharge,newTotal"
						valueChangeListener="#{accountInvoice.onTaxChange}">
						<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
						<f:selectItems value="#{productCollections.vatTaxes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-column-10">
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_retention_quota}" />
				</f:facet>
				<aon:outputText value="#{to.retentionQuota}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div id="newRetention" rendered="#{accountInvoice.newDetail}">
						<aon:outputText value="#{accountInvoice.currentDetail.retentionQuota}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-column-10">
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_vat_quota}" />
				</f:facet>
				<aon:outputText value="#{to.vatQuota}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div id="newVat" rendered="#{accountInvoice.newDetail}">
						<aon:outputText value="#{accountInvoice.currentDetail.vatQuota}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-column-5">
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_surcharge}" />
				</f:facet>
				<aon:outputText value="#{to.surcharge}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<f:facet name="footer" rendered="#{accountInvoice.newDetail}">
					<aon:div id="newSurcharge">
						<aon:outputText value="#{accountInvoice.currentDetail.surcharge}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-column-10">
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_total}" />
				</f:facet>
				<aon:outputText value="#{to.total}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<f:facet name="footer">
					<aon:div id="newTotal" rendered="#{accountInvoice.newDetail}">
						<aon:outputText value="#{accountInvoice.currentDetail.total}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_account}" />
				</f:facet>
				<aon:outputText value="#{to.account}"
					rendered="#{to!=accountInvoice.currentDetail}" />
				<ui:include
					src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
					<ui:param name="wizard" value="#{accountWizard}" />
					<ui:param name="fieldID" value="accountUpdateId" />
					<ui:param name="required" value="#{false}" />
					<ui:param name="renderDescription" value="#{false}" />
					<ui:param name="renderedAttr"
						value="#{to==accountInvoice.currentDetail}" />
					<ui:param name="disabled" value="#{false}" />
					<ui:param name="reRenderAttr" value="none" />
					<ui:param name="required" value="false" />
					<ui:param name="fieldValue"
						value="#{accountInvoice.currentDetail.account}" />
					<ui:param name="fieldValueExpression"
						value="accountInvoice.currentDetail.account" />
				</ui:include>
				<f:facet name="footer">
					<ui:include
						src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
						<ui:param name="wizard" value="#{accountWizard}" />
						<ui:param name="fieldID" value="accountNewId" />
						<ui:param name="required" value="#{false}" />
						<ui:param name="renderDescription" value="#{false}" />
						<ui:param name="renderedAttr" value="#{accountInvoice.newDetail}" />
						<ui:param name="disabled" value="#{false}" />
						<ui:param name="reRenderAttr" value="none" />
						<ui:param name="required" value="false" />
						<ui:param name="fieldValue"
							value="#{accountInvoice.currentDetail.account}" />
						<ui:param name="fieldValueExpression"
							value="accountInvoice.currentDetail.account" />
					</ui:include>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-buttonsColumn aon-column-5">
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div rendered="#{to==accountInvoice.currentDetail}">
					<aon:commandButton title="#{bundle.aon_save}" reRender="TaxesData,aonToolbar"
						actionListener="#{accountInvoice.onUpdateDetail}"
						styleClass="aon-editDataTable-button aon-icon-accept" value=""
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="#{bundle.aon_cancel}"
						reRender="TaxesData,aonToolbar"
						actionListener="#{accountInvoice.onCancelDetail}"
						immediate="#{true}"
						onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
						styleClass="aon-editDataTable-button aon-icon-cancel" value=""
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:commandButton title="#{bundle.aon_remove}"
						reRender="TaxesData,aonToolbar"
						actionListener="#{accountInvoice.onRemoveDetail}"
						immediate="#{true}"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;;"
						styleClass="aon-editDataTable-button aon-icon-delete" value=""
						accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<aon:div rendered="#{accountInvoice.newDetail}">
							<aon:commandButton title="#{bundle.aon_save}"
								reRender="TaxesData,aonToolbar"
								actionListener="#{accountInvoice.onAddDetail}"
								onclick="if (!confirm('#{bundle.aon_accept_confirm}')) return false;"
								styleClass="aon-editDataTable-button aon-icon-accept" value=""
								accesskey="#{bundle.aon_key_save_line}"
								focus="Account_Taxable_Base_Upd" />
							<aon:commandButton title="#{bundle.aon_cancel}"
								reRender="TaxesData,aonToolbar"
								actionListener="#{accountInvoice.onCancelDetail}"
								immediate="#{true}"
								onclick="if (!confirm('#{bundle.aon_cancel_confirm}')) return false;"
								styleClass="aon-editDataTable-button aon-icon-cancel" value=""
								accesskey="#{bundle.aon_key_cancel_line}" />
						</aon:div>
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>
	</aon:panelCollapsible>

</ui:composition>
