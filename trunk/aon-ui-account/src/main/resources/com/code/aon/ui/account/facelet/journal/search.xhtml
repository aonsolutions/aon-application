<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountBundle.account_journal_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{journalReport.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="journal_list" />

					<aon:outputLabel for="reportDate"
						value="#{accountBundle.account_report_date}" />
					<aon:selectInputDate size="8" id="reportDate"
						value="#{journalReport.date}" enableManualInput="true"
						datePattern="dd/MM/yyyy" timeZone="#{timeZoneController.timeZone}" />

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountBundle.account_period}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{journalReport.period}">
						<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
						<f:selectItems value="#{accountCollections.accountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{bundle.aon_date_from}" />
						<aon:selectInputDate size="8"
							id="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{journalReport.fromDate}" enableManualInput="true"
							datePattern="dd/MM/yyyy"
							timeZone="#{timeZoneController.timeZone}" />

						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{bundle.aon_date_to}" />
						<aon:selectInputDate size="8"
							id="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{journalReport.toDate}" enableManualInput="true"
							datePattern="dd/MM/yyyy"
							timeZone="#{timeZoneController.timeZone}" />
					</aon:panelGrid>

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu value="#{journalReport.securityLevel}" 
						id="AccountEntryDetail_accountEntry_securityLevel">
						<f:selectItem value="#{nullItem.value}" />
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
