<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="linesContainer" style="width: 99%;">
		<aon:editDataTable id="accountEntryDetailData" var="to"
			value="#{accountEntryDetail.model}" 
			rows="20">

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<aon:commandButton immediate="#{true}"
					rendered="#{accountEntry.manual and to!=accountEntryDetail.to}"
					styleClass="aon-icon-commandButton aon-icon-rowSelector"
					actionListener="#{accountEntryDetail.onSelect}">
				</aon:commandButton>
				<f:facet name="footer">
					<aon:div>
						<aon:outputText value="&#160;" rendered="#{accountEntry.manual or accountEntryDetail.new}"/>
						<aon:commandButton id="reset" reRender="linesContainer" value=""
							styleClass="aon-editDataTable-button aon-icon-new"
							immediate="#{true}"
							rendered="#{accountEntry.manual and !accountEntryDetail.new}"
							actionListener="#{accountEntryDetail.onReset}">
						</aon:commandButton>
					</aon:div>
				</f:facet>
			</aon:column>
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_account}" />
				</f:facet>
				<aon:outputText value="#{to.account.id}"
					rendered="#{to!=accountEntryDetail.to}" />
				<aon:div rendered="#{to==accountEntryDetail.to}">
					<aon:inputText id="Account_Lookup_id-Edit"
						value="#{accountEntryDetail.to.account.id}"
						rendered="#{to==accountEntryDetail.to}" required="#{true}"
						onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','accountLookup','Account_Lookup_id-Edit[#{rowIndex}]','Account_id|Account_Lookup_id-Edit[#{rowIndex}],Account_description|Account_Lookup_description-Edit[#{rowIndex}],Account_entryEnabled|Account_Lookup_entryEnabled-Edit[#{rowIndex}]');"
						size="12">
						<f:validateLength minimum="1" maximum="12" />
					</aon:inputText>
					<aon:commandButton id="find_Account_Lookup-Edit"
						styleClass="aon-form-lookup-button" value="" immediate="true"
						onclick="lookupSearchWindow(this, 'placeList', '#{accountLookup.encodedSearchPagePath}','Account_id|Account_Lookup_id-Edit[#{rowIndex}],Account_description|Account_Lookup_description-Edit[#{rowIndex}],Account_entryEnabled|Account_Lookup_entryEnabled-Edit[#{rowIndex}]');return false;" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!accountEntryDetail.new}">&#160;</f:verbatim>
						<aon:div rendered="#{accountEntryDetail.new}">
<!-- 
							<ui:include src="/_account/facelet/shared/accountIdInput.xhtml">
								<ui:param name="account" value="#{accountEntryDetail.to.account}"/>
							</ui:include>
 -->
						</aon:div>
					</aon:div>
				</f:facet>
			</aon:column>
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.account.description}"
					rendered="#{to!=accountEntryDetail.to}" />
				<aon:inputText id="Account_Lookup_description-Edit"
					value="#{accountEntryDetail.to.account.description}"
					rendered="#{to==accountEntryDetail.to}" size="30"
					disabledOnClientSide="#{true}" />
				<aon:inputHidden id="Account_Lookup_entryEnabled-Edit"
					value="#{accountEntryDetail.to.account.entryEnabled}"
					rendered="#{to==accountEntryDetail.to}" />
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!accountEntryDetail.new}">&#160;</f:verbatim>
						<aon:inputText id="Account_Lookup_description-New"
							value="#{accountEntryDetail.to.account.description}"
							rendered="#{accountEntryDetail.new}" size="30"
							disabledOnClientSide="#{true}" />
						<rich:suggestionbox id="suggestionBoxDescription" for="Account_Lookup_description-New"
							suggestionAction="#{accountWizard.autocompleteDescription}" var="result"
							minchars="4" width="500" height="200"
							nothingLabel="#{bundle.aon_search_no_results}">
							<h:column>
								<h:outputText value="#{result.id}" />
							</h:column>
							<h:column>
								<h:outputText value="#{result.description}" />
							</h:column>
						</rich:suggestionbox>
					</aon:div>
				</f:facet>
			</aon:column>
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_concept}" />
				</f:facet>
				<aon:outputText value="#{to.concept}"
					rendered="#{to!=accountEntryDetail.to}" />
				<aon:inputText id="AccountEntryDetail_concept-Edit"
					value="#{accountEntryDetail.to.concept}"
					styleClass="aon-form-input-text"
					rendered="#{to==accountEntryDetail.to}" required="#{true}"
					size="20" forceId="#{true}" />
				<aon:commandButton id="find_AccountEntryDetail_concept-Edit"
					rendered="#{to==accountEntryDetail.to}"
					styleClass="aon-form-lookup-button" value="" immediate="true"
					onclick="lookupListWindow(this, 'placeList', '#{facesContext.externalContext.requestContextPath}/_account/facelet/sw/autConcept.faces','AutoConcept_description|AccountEntryDetail_concept-Edit[#{rowIndex}]');return false;" />
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!accountEntryDetail.new}">&#160;</f:verbatim>
						<aon:inputText id="AccountEntryDetail_concept-New"
							value="#{accountEntryDetail.to.concept}"
							rendered="#{accountEntryDetail.new}" required="#{true}" size="20"/>
						<aon:commandButton id="find_AccountEntryDetail_concept-New"
							rendered="#{accountEntryDetail.new}"
							value="" immediate="true"
							onclick="lookupListWindow(this, 'placeList', '#{facesContext.externalContext.requestContextPath}/_account/facelet/sw/autConcept.faces','AutoConcept_description|AccountEntryDetail_concept-New');return false;" />
					</aon:div>
				</f:facet>
			</aon:column>
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_debit}" />
				</f:facet>
				<aon:outputText value="#{to.debit}"
					rendered="#{to!=accountEntryDetail.to}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText value="#{accountEntryDetail.to.debit}"
					rendered="#{to==accountEntryDetail.to}" required="#{true}"
					size="10">
					<f:validateDoubleRange />
				</aon:inputText>
				<f:facet name="footer">
					<aon:div style="text-align:right; font-weight:bold;">
						<aon:outputText value="#{accountEntry.totalDebit}"
							rendered="#{!accountEntryDetail.new}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:inputText value="#{accountEntryDetail.to.debit}"
							rendered="#{accountEntryDetail.new}" required="#{true}" size="10">
							<f:validateDoubleRange />
						</aon:inputText>
					</aon:div>
				</f:facet>
			</aon:column>
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_credit}" />
				</f:facet>
				<aon:outputText value="#{to.credit}"
					rendered="#{to!=accountEntryDetail.to}">
					<f:convertNumber pattern="#,##0.00" />
				</aon:outputText>
				<aon:inputText value="#{accountEntryDetail.to.credit}"
					rendered="#{to==accountEntryDetail.to}" required="#{true}"
					size="10">
					<f:validateDoubleRange />
				</aon:inputText>
				<f:facet name="footer">
					<aon:div style="text-align:right; font-weight:bold;">
						<aon:outputText value="#{accountEntry.totalCredit}"
							rendered="#{!accountEntryDetail.new}">
							<f:convertNumber pattern="#,##0.00" />
						</aon:outputText>
						<aon:inputText value="#{accountEntryDetail.to.credit}"
							rendered="#{accountEntryDetail.new}" required="#{true}" size="10">
							<f:validateDoubleRange />
						</aon:inputText>
					</aon:div>
				</f:facet>
			</aon:column>
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{accountBundle.aon_balancing_account}" />
				</f:facet>
				<aon:outputText value="#{to.balancingAccount.id}"
					rendered="#{to!=accountEntryDetail.to}" />
				<aon:div rendered="#{to==accountEntryDetail.to}">
					<aon:inputText id="Account_Lookup_id-Balancing-Edit"
						value="#{accountEntryDetail.to.balancingAccount.id}"
						rendered="#{to==accountEntryDetail.to}"
						onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','accountLookup','Account_Lookup_id-Balancing-Edit[#{rowIndex}]','Account_id|Account_Lookup_id-Balancing-Edit[#{rowIndex}],Account_entryEnabled|Account_Lookup_entryEnabled-Balancing-Edit[#{rowIndex}]');"
						size="12">
						<f:validateLength minimum="1" maximum="12" />
					</aon:inputText>
					<aon:commandButton id="find_Account_Lookup_id-Balancing-Edit"
						styleClass="aon-form-lookup-button" value="" immediate="true"
						onclick="lookupSearchWindow(this, 'placeList', '#{accountLookup.encodedSearchPagePath}','Account_id|Account_Lookup_id-Balancing-Edit[#{rowIndex}],Account_entryEnabled|Account_Lookup_entryEnabled-Balancing-Edit[#{rowIndex}]');return false;" />
					<aon:inputHidden id="Account_Lookup_entryEnabled-Balancing-Edit"
						value="#{accountEntryDetail.to.balancingAccount.entryEnabled}"
						styleClass="aon-form-input-text" forceId="#{true}"
						rendered="#{to==accountEntryDetail.to}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!accountEntryDetail.new}">&#160;</f:verbatim>
						<aon:div rendered="#{accountEntryDetail.new}">
							<aon:inputText id="Account_Lookup_id-Balancing-New"
								value="#{accountEntryDetail.to.balancingAccount.id}"
								styleClass="aon-form-input-text" forceId="#{true}"
								rendered="#{accountEntryDetail.new}"
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','accountLookup','Account_Lookup_id-Balancing-New','Account_id|Account_Lookup_id-Balancing-New,Account_entryEnabled|Account_Lookup_entryEnabled-Balancing-New');"
								size="12">
								<f:validateLength minimum="1" maximum="12" />
							</aon:inputText>
							<aon:commandButton id="find_Account_Lookup-Balancing-New"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								onclick="lookupSearchWindow(this, 'placeList', '#{accountLookup.encodedSearchPagePath}','Account_id|Account_Lookup_id-Balancing-New,Account_entryEnabled|Account_Lookup_entryEnabled-Balancing-New');return false;" />
							<aon:inputHidden id="Account_Lookup_entryEnabled-Balancing-New"
								value="#{accountEntryDetail.to.balancingAccount.entryEnabled}"
								styleClass="aon-form-input-text" forceId="#{true}"
								rendered="#{accountEntryDetail.new}" />
						</aon:div>
					</aon:div>
				</f:facet>
			</aon:column>

						<ui:param name="controller" value="#{accountEntryDetail}" />
						<ui:param name="reRenderAttr" value="linesContainer" />
					</ui:include>
 -->

		</aon:editDataTable>

		</ui:include>

	</aon:div>


</ui:composition>
