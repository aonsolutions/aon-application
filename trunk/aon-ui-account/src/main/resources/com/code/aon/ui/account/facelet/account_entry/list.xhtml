<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.account_entry}" />
				<ui:param name="toolbarDescription" value="#{account_entry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="additionalToolbarContent">
					<h:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}" action="account_entry_form"
						actionListener="#{accountEntry.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-reset" />
					<h:commandButton id="search" value="#{bundle.aon_search}"
						accesskey="#{bundle.aon_key_search}" action="account_entry_search"
						actionListener="#{accountEntry.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search" />
				</ui:define>
			</ui:decorate>

			<aon:div id="accountEntryData" styleClass="aon-scroll-area">
				<aon:dataTable id="accountEntryDataList"
					value="#{accountEntry.model}" rows="20" var="to"
					rendered="#{accountEntry.model.rowCount > 0}">

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;XXX" />
						</f:facet>
						<h:commandButton
							styleClass="aon-icon-commandButton aon-icon-rowSelector"
							action="#{accountEntry.onNavigate}"
							actionListener="#{accountEntry.onSelectEntry}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_account_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_accPeriod_period}" />
						</f:facet>
						<aon:outputText value="#{to.accountPeriod}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.entryDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_type}" />
						</f:facet>
						<aon:outputText value="#{to.type}" />
					</aon:column>

				</aon:dataTable>
				<aon:dataScroller for="accountEntryDataList"
					rowCount="#{accountEntry.model.rowCount}" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
