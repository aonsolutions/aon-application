<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountInvoiceForm" styleClass="aon-form">
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{appBundle.account_invoice_entry}" />
				<ui:param name="toolbarDescription" value="#{account_entry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="toolbarContent">

					<aon:commandButton value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accountInvoice.accept}"
						action="account_entry_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						disabled="#{accountInvoice.details.rowCount == 0 or !accountInvoice.accountSource}"
						onclick="if (!confirm('#{bundle.aon_save_confirm}'))  return false;">
					</aon:commandButton>
					<aon:commandButton value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						actionListener="#{accountInvoice.onReset}"
						rendered="#{!accountInvoice.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset">
					</aon:commandButton>
					<aon:commandButton value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="account_entry_search"
						actionListener="#{accountInvoice.onRemove}"
						rendered="#{!accountInvoice.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;"
						disabled="#{!accountInvoice.accountSource}">
					</aon:commandButton>
					<aon:commandButton id="finances" reRender="FinancesData"
						value="#{accountBundle.aon_generate_finances}"
						actionListener="#{accountInvoice.generateFinances}"
						disabled="#{!accountInvoice.accountSource}"
						styleClass="aon-finding-toolbar-item"
						rendered="#{accountInvoice.details.rowCount > 0}">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<aon:div id="invoiceContainer" styleClass="aon-scroll-area">
				<aon:panelGrid id="invoiceTables" style="width: 95%;" columns="4">

					<aon:outputLabel for="AccountEntry_accountPeriod"
						value="#{accountBundle.aon_period}" />
					<aon:selectOneMenu id="Account_Period"
						disabled="#{accountInvoice.details.rowCount > 0 or accountInvoice.newDetail}"
						value="#{accountInvoice.header.period.id}">
						<f:selectItems value="#{accountCollections.accountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="AccountEntry_type"
						value="#{accountBundle.aon_type}" />
					<aon:selectOneMenu id="Account_invoiceType"
						disabled="#{accountInvoice.details.rowCount > 0 or accountInvoice.newDetail}"
						value="#{accountInvoice.header.type}">
						<f:selectItems value="#{accountInvoice.invoiceTypes}" />
						<a4j:support event="onchange" ajaxSingle="true"
							actionListener="#{accountInvoice.onTypeChanged}"
							reRender="invoiceTables">
						</a4j:support>
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_invoice_series"
						value="#{accountBundle.aon_series_number}" />

					<aon:div>
						<aon:selectOneMenu id="Account_invoice_series"
							rendered="#{accountInvoice.sales}"
							disabled="#{accountInvoice.details.rowCount > 0 or accountInvoice.newDetail}"
							value="#{accountInvoice.header.series}">
							<f:selectItem itemValue="" itemLabel=" " />
							<f:selectItems value="#{configCollections.series}" />
						</aon:selectOneMenu>

						<aon:inputText id="Account_invoice_number"
							style="margin-left: 5px; margin-bottom: 2px;"
							rendered="#{accountInvoice.sales}"
							disabled="#{accountInvoice.details.rowCount > 0 or accountInvoice.newDetail}"
							value="#{accountInvoice.header.number}" size="7" maxlength="7">
							<f:validateLength maximum="7" />
						</aon:inputText>

						<aon:inputText id="Account_invoice_referenceCode"
							rendered="#{!accountInvoice.sales}"
							disabled="#{accountInvoice.details.rowCount > 0 or accountInvoice.newDetail}"
							value="#{accountInvoice.header.referenceCode}" size="25"
							maxlength="32" styleClass="aon-form-input-text"
							onblur="toUpperCase(this);">
							<f:validateLength maximum="32" />
						</aon:inputText>
					</aon:div>

					<aon:outputLabel for="Account_date"
						value="#{accountBundle.aon_date}" />
					<aon:selectInputDate size="8" id="Account_date"
						disabled="#{accountInvoice.details.rowCount > 0 or accountInvoice.newDetail}"
						value="#{accountInvoice.header.date}" enableManualInput="true"
						datePattern="dd/MM/yyyy" timeZone="#{timeZoneController.timeZone}" />

					<aon:outputLabel for="AccountEntry_securityLevel"
						value="#{accountBundle.aon_account_security_level}" />
					<aon:selectOneRadio id="AccountEntry_securityLevel"
						style="display:inline;"
						disabled="#{accountInvoice.details.rowCount > 0 or accountInvoice.newDetail}"
						value="#{accountInvoice.header.securityLevel}">
						<f:selectItems value="#{accountCollections.securityLevels}" />
					</aon:selectOneRadio>

					<aon:outputText value="#{accountBundle.aon_customer}"
						rendered="#{accountInvoice.sales}" />
					<aon:outputText value="#{accountBundle.aon_supplier}"
						rendered="#{accountInvoice.purchase}" />
					<aon:outputText value="#{accountBundle.aon_creditor}"
						rendered="#{accountInvoice.expense}" />

						value="#{accountBundle.aon_document}" />
					<aon:inputText id="Invoice_document"
						value="#{accountInvoice.header.document}" size="10"
						disabled="#{accountInvoice.details.rowCount > 0 or accountInvoice.newDetail}">
					</aon:inputText>

				</aon:panelGrid>
			</aon:div>
<!-- 
			<rich:spacer height="5" style="display:block" />
			<ui:include src="/com/code/aon/ui/account/facelet/account_entry/invoice/form_lines.xhtml" />

			<rich:spacer height="5" style="display:block" />
			<ui:include src="/com/code/aon/ui/account/facelet/account_entry/invoice/form_finances.xhtml" />

		</aon:form>
	</ui:define>
