<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="autConceptList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.account_leasing_entry}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="save" value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accountLeasing.accept}"
						action="account_entry_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;" />
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						actionListener="#{accountLeasing.onReset}"
						rendered="#{!accountLeasing.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset" />
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="account_entry_search"
						actionListener="#{accountLeasing.onRemove}"
						rendered="#{!accountLeasing.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">
					<aon:outputLabel for="Account_date"
						value="#{accountBundle.aon_date}" />
					<aon:selectInputDate size="8" id="Account_date" required="true"
						value="#{accountLeasing.leasing.leasingDate}"
						enableManualInput="true" datePattern="dd/MM/yyyy"
						timeZone="#{timeZoneController.timeZone}">
					</aon:selectInputDate>

					<aon:outputLabel for="Account_supplierName"
						value="#{accountBundle.aon_leasing_supplier_name}" />
					<aon:inputText id="Account_supplierName"
						value="#{accountLeasing.leasing.supplierName}" size="40"
						maxlength="32" />

					<aon:outputLabel for="Account_supplierDocument"
						value="#{accountBundle.aon_leasing_supplier_document}" />
					<aon:inputText id="Account_supplierDocument"
						value="#{accountLeasing.leasing.supplierDocument}" size="16"
						maxlength="16" />

					<aon:outputLabel for="Account_description"
						value="#{accountBundle.aon_description}" />
					<aon:inputText id="Account_description"
						value="#{accountLeasing.leasing.description}" size="40"
						maxlength="32" />

					<aon:outputLabel for="Account_term"
						value="#{accountBundle.aon_leasing_term}" />
					<aon:inputText id="Account_term"
						value="#{accountLeasing.leasing.term}" size="16" maxlength="16" />

					<aon:outputLabel for="Account_interest_percent"
						value="#{accountBundle.aon_leasing_interest_percent}" />
					<aon:inputText id="Account_interest_percent"
						value="#{accountLeasing.leasing.interestPercent}" size="10"
						maxlength="16" />

					<aon:outputLabel for="Account_review"
						value="#{accountBundle.aon_leasing_review}" />
					<aon:inputText id="Account_review"
						value="#{accountLeasing.leasing.review}" size="16" maxlength="16" />

					<aon:outputLabel for="RegistryBank_id"
						value="#{accountBundle.aon_bank}" />
					<aon:selectOneMenu id="RegistryBank_id"
						value="#{accountLeasing.leasing.registryBank.id}"
						reRender="RegistryBank_bankAccount"
						valueChangeListener="#{accountLeasing.onRBankChange}">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="RegistryBank_bankAccount"
						value="#{financeBundle.aon_bank_account}" />
					<aon:inputText id="RegistryBank_bankAccount" disabled="true"
						value="#{accountLeasing.leasing.registryBank.bankAccount}"
						size="35" />

					<aon:outputLabel for="Account_amount"
						value="#{accountBundle.aon_leasing_amount}" />
					<aon:inputText id="Account_amount"
						value="#{accountLeasing.leasing.amount}" size="16">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="Fixed_asset_account"
						value="#{accountBundle.aon_leasing_fixed_asset_account}" />
					<aon:selectOneMenu id="Fixed_asset_account" required="true"
						value="#{accountLeasing.leasing.fixedAssetAccount.id}">
						<f:selectItems value="#{accountCollections.fixedAssestsAccounts}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Leasing_vat"
						value="#{accountBundle.aon_leasing_vat}" />
					<aon:selectOneMenu id="Leasing_vat"
						value="#{accountLeasing.leasing.vat.id}">
						<f:selectItems value="#{productCollections.vatTaxes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Leasing_securityLevel"
						value="#{accountBundle.aon_account_security_level}" />
					<aon:selectOneMenu id="Leasing_securityLevel"
						value="#{accountLeasing.leasing.securityLevel}">
						<f:selectItems value="#{accountCollections.securityLevels}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
