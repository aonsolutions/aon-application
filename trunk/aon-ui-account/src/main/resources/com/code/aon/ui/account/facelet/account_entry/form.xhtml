<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountEntryForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.account_entry}" />
				<ui:param name="toolbarDescription" value="#{account_entry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="additionalToolbarContent">
					<h:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}" action="account_entry_form"
						actionListener="#{accountEntry.onReset}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						rendered="#{!accountEntry.new}" />
					<h:commandButton id="save" value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accountEntry.accept}"
						disabled="#{!accountEntry.manual}"
						rendered="#{accountEntry.model.rowCount > 0 or accountEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="return (confirm('#{bundle.aon_save_confirm}'))" />
					<h:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="account_entry_form"
						actionListener="#{accountEntry.onRemove}"
						rendered="#{accountEntry.model.rowCount > 0 and !accountEntry.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true"
						onclick="return (confirm('#{bundle.aon_remove_confirm}'))" />
<!-- 
disabled="#{!accountEntry.manual}" 
 -->						
					<h:commandButton id="search" value="#{bundle.aon_search}"
						accesskey="#{bundle.aon_key_search}" action="account_entry_search"
						actionListener="#{accountEntry.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						immediate="true" />
					<h:commandButton id="update" value="#{bundle.aon_update}"
						action="#{accountEntry.onNavigate}"
						actionListener="#{accountEntry.onSelectEntry}"
						disabled="#{accountEntry.manual}"
						styleClass="aon-finding-toolbar-item aon-icon-update"
						immediate="true" />

					<aon:spin controller="#{accountEntry}" />

				</ui:define>
			</ui:decorate>



			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:div styleClass="aon-form-note"
					rendered="#{accountEntry.model.rowCount == 0 and !accountEntry.new}">
					<aon:div styleClass="aon-form-note-internal">
						<aon:panelGroup>
							<aon:outputText value="#{bundle.aon_search_no_results}" />
						</aon:panelGroup>
					</aon:div>
				</aon:div>

				<aon:div ajaxRendered="true"
					rendered="#{accountEntry.model.rowCount > 0 or accountEntry.new}">
					<aon:panelGrid columns="5" style="width: 99%;margin-bottom: 1em;"
						columnClasses="aon-panelGrid-even,aon-panelGrid-even,aon-panelGrid-even,aon-panelGrid-even,aon-panelGrid-even"
						rowClasses="aon-panelGrid-odd,aon-panelGrid-even">

						<aon:div>
							<aon:outputText value="#{accountBundle.aon_period}: " />
							<aon:selectOneMenu id="AccountEntry_accountPeriod"
								styleClass="aon-form-selectOneMenu-field"
								value="#{accountEntry.to.accountPeriod}"
								rendered="#{accountEntry.manual and accountEntry.new}">
								<f:selectItems value="#{accountCollections.accountPeriods}" />
							</aon:selectOneMenu>
							<aon:outputText value="#{accountEntry.to.accountPeriod}"
								rendered="#{!accountEntry.manual or !accountEntry.new}" />
						</aon:div>

						<aon:div rendered="#{!accountEntry.new}">
							<aon:outputText value="#{accountBundle.aon_id}: " />
							<aon:outputText value="#{accountEntry.to.id}&#160;" />
						</aon:div>

						<aon:div>
							<aon:outputText value="#{accountBundle.aon_date}: " />
							<aon:selectInputDate size="8" required="true"
								id="AccountEntry_entryDate" value="#{accountEntry.to.entryDate}"
								enableManualInput="true" rendered="#{accountEntry.manual}"
								datePattern="dd/MM/yyyy" 
								timeZone="#{timeZoneController.timeZone}">
							</aon:selectInputDate>
							<aon:outputText value="#{accountEntry.to.entryDate}"
								rendered="#{!accountEntry.manual}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:div>

						<aon:div rendered="#{!accountEntry.new}">
							<aon:outputText value="#{accountBundle.aon_type}: " />
							<aon:outputText value="#{accountEntry.to.type}&#160;" />
						</aon:div>

						<aon:div>
							<aon:outputText
								value="#{accountBundle.aon_account_security_level}: " />
							<aon:selectOneMenu id="AccountEntry_securityLevel"
								styleClass="aon-form-selectOneMenu-field"
								value="#{accountEntry.to.securityLevel}"
								rendered="#{accountEntry.manual and accountEntry.new}">
								<f:selectItems value="#{accountCollections.securityLevels}" />
							</aon:selectOneMenu>
							<aon:outputText value="#{accountEntry.to.securityLevel}&#160;"
								rendered="#{!accountEntry.manual or !accountEntry.new}" />
						</aon:div>
					</aon:panelGrid>

					<ui:include
						src="/com/code/aon/ui/account/facelet/account_entry/linesForm.xhtml" />
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
