<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="accountForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{accountBundle.account_account_module}" />
				<ui:param name="controller" value="#{account}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{account.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="account_list" />				
				
					<aon:outputLabel for="Account_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="Account_id" size="50"
						valueChangeListener="#{account.addExpression}" />

					<aon:outputLabel for="Account_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Account_description" size="50"
						valueChangeListener="#{account.addExpression}" />

					<aon:outputLabel for="Account_alias"
						value="#{accountBundle.account_alias}" />
					<aon:inputText id="Account_alias" size="50"
						valueChangeListener="#{account.addExpression}" />

					<aon:outputLabel for="Account_entryEnabled"
						value="#{accountBundle.account_entryEnabled}" />
					<aon:selectOneMenu id="Account_entryEnabled"
						valueChangeListener="#{account.addExpression}">
						<f:selectItem itemLabel="-" itemDisabled="true" itemValue="" />
						<f:selectItem itemLabel="#{bundle.aon_yes}"
							itemValue="true" />
						<f:selectItem itemLabel="#{bundle.aon_no}"
							itemValue="false" />
					</aon:selectOneMenu>
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
