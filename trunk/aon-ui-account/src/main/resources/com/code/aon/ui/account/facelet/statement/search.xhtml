<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				<ui:param name="toolbarTitle"
					value="#{accountBundle.account_statement_module}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<ui:param name="skipSearchButton" value="true" />

					<aon:outputLabel for="reportDate"
						value="#{accountBundle.account_report_date}" />
					<aon:selectInputDate size="8" id="reportDate"
						value="#{trialBalance.date}" enableManualInput="true"
						datePattern="dd/MM/yyyy" timeZone="#{timeZoneController.timeZone}" />

					<aon:outputLabel for="Account_id"
						value="#{accountBundle.account_account}" />
					<aon:inputText id="Account_id" value="#{trialBalance.account}"
						size="14" />

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountBundle.account_period}" />
					<aon:selectOneMenu reRender="SearchButton" ajaxSingle="true"
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{trialBalance.period}">
						<f:selectItem itemDisabled="true" itemLabel="-" itemValue="" />
						<f:selectItems value="#{accountCollections.accountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{bundle.aon_date}" />
					<aon:panelGrid columns="4">
						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-From"
							styleClass="aon-form-date-label" value="#{bundle.aon_date_from}" />
						<aon:selectInputDate size="8" 
							id="AccountEntryDetail_accountEntry_entryDate-From"
							value="#{trialBalance.fromDate}" enableManualInput="true"
							datePattern="dd/MM/yyyy"
							timeZone="#{timeZoneController.timeZone}">
							<a4j:support event="oninputchange" reRender="SearchButton" ajaxSingle="true" />
							<a4j:support event="onchanged" reRender="SearchButton" ajaxSingle="true" />
						</aon:selectInputDate>

						<aon:outputLabel
							for="AccountEntryDetail_accountEntry_entryDate-To"
							styleClass="aon-form-date-label" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate size="8" 
							id="AccountEntryDetail_accountEntry_entryDate-To"
							value="#{trialBalance.toDate}" enableManualInput="true"
							datePattern="dd/MM/yyyy"
							timeZone="#{timeZoneController.timeZone}">
							<a4j:support event="oninputchange" reRender="SearchButton" ajaxSingle="true" />
							<a4j:support event="onchanged" reRender="SearchButton" ajaxSingle="true" />
						</aon:selectInputDate>
					</aon:panelGrid>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Account_zero_sum"
							value="#{trialBalance.zeroSumVisible}" />
						<aon:outputLabel for="Account_zero_sum" styleClass="aon-bold"
							value="#{accountBundle.account_zero_account}" />
					</aon:div>

					<aon:outputText value="" />
					<aon:div styleClass="aon-search-commandButton-left">
						<aon:div styleClass="aon-search-commandButton-right">
							<aon:commandButton id="SearchButton" 
								value="#{bundle.aon_search}"
								action="account_statement_account_list"
								actionListener="#{trialBalance.onSearch}"
								disabled="#{trialBalance.period == null and trialBalance.fromDate == null and trialBalance.toDate == null}"
								reRender="#{searchReRender}"
								accesskey="#{bundle.aon_key_search}" />
						</aon:div>
					</aon:div>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
