<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">

				<ui:param name="toolbarTitle"
					value="#{menuBundle.account_leasing_fee_entry}" />
				<ui:param name="toolbarDescription"
					value="#{account_entry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="toolbarContent">
					<aon:commandButton id="save" value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accountLeasingFee.accept}"
						action="account_entry_form" styleClass="aon-content-toolbar-item"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return true;">
					</aon:commandButton>
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						actionListener="#{accountLeasingFee.onReset}"
						rendered="#{!accountLeasingFee.new}"
						styleClass="aon-content-toolbar-item">
					</aon:commandButton>
					<aon:commandButton id="remove" value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="account_entry_search"
						actionListener="#{accountLeasingFee.onRemove}"
						rendered="#{!accountLeasingFee.new}"
						styleClass="aon-content-toolbar-item" immediate="true"
						onclick="if (confirm('#{bundle.aon_remove_confirm}')) return true;">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Account_invoice_series"
						value="#{accountBundle.aon_series_number}" />
					<aon:div>
						<aon:inputText id="Account_invoice_series"
							value="#{accountLeasingFee.header.series}" size="4" maxlength="5" />
						<aon:inputText id="Account_invoice_number"
							value="#{accountLeasingFee.header.number}" size="7" maxlength="7">
							<f:validateLength maximum="7" />
						</aon:inputText>
					</aon:div>

					<aon:outputLabel for="Account_date"
						value="#{accountBundle.aon_date}" />
					<aon:selectInputDate size="8" id="Account_date" required="true"
						value="#{accountLeasingFee.header.leasingFeeDate}"
						enableManualInput="true" datePattern="dd/MM/yyyy"
						timeZone="#{timeZoneController.timeZone}" />

					<aon:outputLabel for="Leasing_Lookup_id"
						value="#{accountBundle.aon_leasing}" />
					<aon:selectOneMenu id="Leasing_Lookup_id" required="true"
						ajaxSingle="true"
						reRender="Leasing_Lookup_vat_percentage,Account_taxableBase,Account_total,Leasing_Lookup_supplierName,Leasing_Lookup_supplierDocument"
						value="#{accountLeasingFee.header.leasing}">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{accountCollections.accountLeasings}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Leasing_Lookup_supplierName"
						value="#{accountBundle.aon_leasing_supplier_name}" />
					<aon:inputText id="Leasing_Lookup_supplierName"
						value="#{accountLeasingFee.header.leasing.supplierName}" size="60" />

					<aon:outputLabel for="Leasing_Lookup_supplierDocument"
						value="#{accountBundle.aon_leasing_supplier_document}" />
					<aon:inputText id="Leasing_Lookup_supplierDocument"
						value="#{accountLeasingFee.header.leasing.supplierDocument}"
						size="12" />

					<aon:outputLabel for="Account_amortization"
						value="#{accountBundle.aon_leasing_amortization}" />
					<aon:inputText id="Account_amortization"
						reRender="Account_taxableBase" ajaxSingle="true"
						value="#{accountLeasingFee.header.amortization}" size="7" />

					<aon:outputLabel for="Account_interest"
						value="#{accountBundle.aon_leasing_interest}" />
					<aon:inputText id="Account_interest" reRender="Account_taxableBase"
						ajaxSingle="true" value="#{accountLeasingFee.header.interest}"
						size="7" />

					<aon:outputLabel for="Account_taxableBase"
						value="#{accountBundle.aon_leasing_taxableBase}" />
					<aon:inputText id="Account_taxableBase"
						value="#{accountLeasingFee.header.taxableBase}" disabled="true"
						size="7" />

					<aon:outputLabel for="Leasing_Lookup_vat_percentage"
						value="#{accountBundle.aon_leasing_vat}" />
					<aon:inputText id="Leasing_Lookup_vat_percentage" disabled="true"
						value="#{accountLeasingFee.header.leasing.vat.percentage}"
						size="7" />

					<aon:outputLabel for="Account_expenses"
						value="#{accountBundle.aon_leasing_expenses}" />
					<aon:inputText id="Account_expenses" reRender="Account_total"
						ajaxSingle="true" value="#{accountLeasingFee.header.expenses}"
						size="7" />

					<aon:outputLabel for="Account_total"
						value="#{accountBundle.aon_leasing_invoiceTotal}" />
					<aon:inputText id="Account_total"
						value="#{accountLeasingFee.header.total}" disabled="true" size="7" />

					<aon:outputLabel for="RegistryBank_Lookup_id"
						value="#{accountBundle.aon_bank}" />
					<aon:selectOneMenu id="RegistryBank_Lookup_id" required="true"
						value="#{accountLeasingFee.header.registryBank.id}"
						reRender="RegistryBank_bankAccount" ajaxSingle="true"
						valueChangeListener="#{accountLeasingFee.onRBankChange}">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="RegistryBank_bankAccount"
						value="#{financeBundle.aon_bank_account}" />
					<aon:inputText id="RegistryBank_bankAccount"
						value="#{accountLeasingFee.header.registryBank.bankAccount}"
						disabledOnClientSide="true" size="35" />

					<aon:outputLabel for="AccountEntry_securityLevel"
						value="#{accountBundle.aon_account_security_level}" />
					<aon:selectOneMenu id="AccountEntry_securityLevel"
						value="#{accountLeasingFee.header.securityLevel}">
						<f:selectItems value="#{accountCollections.securityLevels}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
