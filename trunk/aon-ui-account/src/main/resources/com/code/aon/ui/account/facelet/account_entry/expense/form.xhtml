<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{accountBundle.account_expense_entry_module}" />
				<ui:param name="toolbarDescription" value="#{accountExpense.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="additionalToolbarContent">
					<aon:commandButton value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accountExpense.accept}"
						action="account_entry_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;" />
					<aon:commandButton value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						actionListener="#{accountExpense.onReset}"
						rendered="#{!accountExpense.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"/>
					<aon:commandButton value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="account_entry_search"
						actionListener="#{accountExpense.onRemove}"
						rendered="#{!accountExpense.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true"
						onclick="if (!confirm('#{bundle.aon_remove_confirm}')) return false;" />
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">
					<aon:outputLabel for="Account_account"
						value="#{accountBundle.account_account}" />
					<aon:selectOneMenu id="Account_account"
						value="#{accountExpense.header.account}">
						<f:selectItems value="#{accountCollections.expensesAccounts}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_date"
						value="#{bundle.aon_date}" />
					<aon:selectInputDate size="8" id="Account_date" required="true"
						value="#{accountExpense.header.date}" enableManualInput="true"
						datePattern="dd/MM/yyyy" timeZone="#{timeZoneController.timeZone}" />

					<aon:outputLabel for="Account_Period"
						value="#{accountBundle.account_period}" />
					<aon:selectOneMenu id="Account_Period"
						value="#{accountExpense.header.period}">
						<f:selectItems value="#{accountCollections.accountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Account_description"
						value="#{accountExpense.header.description}" size="60" />

					<aon:outputLabel for="Account_amount"
						value="#{accountBundle.account_amount}" />
					<aon:inputText id="Account_amount"
						value="#{accountExpense.header.amount}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="RegistryBank_id"
						value="#{financeBundle.finance_bank}" />
					<aon:selectOneMenu id="RegistryBank_id" ajaxSingle="true"
						value="#{accountExpense.header.RBank}"
						reRender="RegistryBank_bankAccount">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{financeBundle.finance_bank_account}" />
					<aon:div id="RegistryBank_bankAccount">
						<aon:outputText value="#{accountExpense.header.RBank.bankAccount}" />
						<aon:outputText value="&#160;" />
					</aon:div>

					<aon:outputLabel for="AccountEntry_securityLevel"
						value="#{bundle.aon_security_level}" />
					<aon:selectOneMenu id="AccountEntry_securityLevel"
						value="#{accountExpense.header.securityLevel}">
						<f:selectItems value="#{commonCollections.securityLevels}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
