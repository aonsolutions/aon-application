<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountExpenseForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.account_abstract}" />
				<ui:param name="toolbarDescription" value="#{account_entry.new?(bundle.aon_reset):(bundle.aon_editing)}" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener"
						value="#{accStatement.onReset}" type="actionListener" />
					<aon:methodParam name="searchAction" value="accStatement_search" />
				</ui:define>
				<ui:define name="additionalToolbarContent">
					<h:commandButton value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{accountExpense.accept}"
						action="account_entry_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="return (confirm('#{bundle.aon_save_confirm}'))">
					</h:commandButton>
					<h:commandButton value="#{bundle.aon_reset}"
						accesskey="#{bundle.aon_key_new}"
						actionListener="#{accountExpense.onReset}"
						rendered="#{!accountExpense.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset">
					</h:commandButton>
					<h:commandButton value="#{bundle.aon_remove}"
						accesskey="#{bundle.aon_key_remove}" action="account_entry_search"
						actionListener="#{accountExpense.onRemove}"
						rendered="#{!accountExpense.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true"
						onclick="return (confirm('#{bundle.aon_remove_confirm}'))">
					</h:commandButton>
				</ui:define>
			</ui:decorate>

			<aon:div id="entryContainer" styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">
					<aon:outputLabel for="Account_account"
						value="#{accountBundle.aon_account}" />
					<aon:selectOneMenu id="Account_account"
						value="#{accountExpense.header.account.id}">
						<f:selectItems value="#{accountCollections.expensesAccounts}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_date"
						value="#{accountBundle.aon_date}" />
					<aon:selectInputDate size="8" id="Account_date" required="true"
						value="#{accountExpense.header.date}" enableManualInput="true"
						datePattern="dd/MM/yyyy" timeZone="#{timeZoneController.timeZone}">
					</aon:selectInputDate>

					<aon:outputLabel for="Account_Period"
						value="#{accountBundle.aon_accPeriod_period}" />
					<aon:selectOneMenu id="Account_Period"
						value="#{accountExpense.header.period.id}">
						<f:selectItems value="#{accountCollections.accountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_description"
						value="#{accountBundle.aon_description}" />
					<aon:inputText id="Account_description"
						value="#{accountExpense.header.description}" size="60" />

					<aon:outputLabel for="Account_amount"
						value="#{accountBundle.aon_amount}" />
					<aon:inputText id="Account_amount"
						value="#{accountExpense.header.amount}" size="15">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="RegistryBank_id"
						value="#{accountBundle.aon_bank}" />
					<aon:selectOneMenu id="RegistryBank_id"
						value="#{accountExpense.header.RBank.id}"
						reRender="RegistryBank_bankAccount"
						valueChangeListener="#{accountExpense.onRBankChange}">
						<f:selectItem itemDisabled="true" itemValue="" itemLabel="-" />
						<f:selectItems value="#{financeCollections.companyBanks}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="RegistryBank_bankAccount"
						value="#{financeBundle.aon_bank_account}" />
					<aon:inputText id="RegistryBank_bankAccount" disabled="true"
						value="#{accountExpense.header.RBank.bankAccount}" size="35" />

					<aon:outputLabel for="AccountEntry_securityLevel"
						value="#{accountBundle.aon_account_security_level}" />
					<aon:selectOneMenu id="AccountEntry_securityLevel"
						value="#{accountExpense.header.securityLevel}">
						<f:selectItems value="#{accountCollections.securityLevels}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
