<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.account_regenerate_summary}" />
				<ui:param name="toolbarDescription" value="" />

				<ui:define name="toolbarContent">
					<h:commandButton id="regenerate"
						value="#{accountBundle.aon_regenerate}"
						accesskey="#{bundle.aon_key_search}"
						actionListener="#{accountSummaryRegenerator.regenerateAccountSummary}"
						styleClass="aon-content-toolbar-item" />
					<h:commandButton type="reset" id="clear"
						value="#{bundle.aon_clear}" styleClass="aon-content-toolbar-item" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2">

					<aon:outputLabel
						for="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountBundle.aon_accPeriod_period}" />
					<aon:selectOneMenu
						id="AccountEntryDetail_accountEntry_accountPeriod"
						value="#{accountSummaryRegenerator.period}">
						<f:selectItems value="#{accountCollections.accountPeriods}" />
					</aon:selectOneMenu>
				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
