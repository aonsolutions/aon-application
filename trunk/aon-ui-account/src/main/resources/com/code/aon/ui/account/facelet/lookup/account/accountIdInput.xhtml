<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="#{fieldID}Container" rendered="#{renderedAttr}">
		<a4j:region>
			<aon:inputText id="#{fieldID}" value="#{fieldValue}"
				disabled="#{disabled}" required="#{required}" size="12">
				<a4j:support event="onkeyup"
					onsubmit="if(event.keyCode != 113) return false;"
					eventsQueue="#{fieldID}KeyUp" ignoreDupResponses="true"
					requestDelay="100" actionListener="#{wizard.onShow}"
					immediate="true" reRender="#{fieldID}Container"
					oncomplete="searchFieldForFocus('#{fieldID}searchName')">
				</a4j:support>

				<a4j:support eventsQueue="#{fieldID}OnChange"
					onsubmit="validateOnChange(this)"
					actionListener="#{wizard.onLookup}"
					ignoreDupResponses="true" requestDelay="100" event="onchange"
					reRender="#{fieldID}Name,#{reRenderAttr}">
					<a4j:actionparam name="accountActionParam"
						value="#{fieldValueExpression}"
						assignTo="#{wizard.valueExpression}">
					</a4j:actionparam>
					<a4j:actionparam name="lookupActionParam"
						value="#{onLookupELExpression}"
						assignTo="#{wizard.extendedAttributesValueExpression}">
					</a4j:actionparam>
					<a4j:actionparam name="valueChangeListener"
						value="#{valueChangeListener}"
						assignTo="#{wizard.valueChangeListener}">
					</a4j:actionparam>
				</a4j:support>
			</aon:inputText>
		</a4j:region>
		<rich:suggestionbox for="#{fieldID}"
			suggestionAction="#{wizard.autocompleteId}" var="result"
			onsubmit="if (!activateSuggestionBox(this)) return false;"
			immediate="true" eventsQueue="#{fieldID}Sug"
			ignoreDupResponses="true" requestDelay="100" width="500" height="200"
			nothingLabel="#{bundle.aon_search_no_results}">
			<h:column>
				<h:outputText value="#{result.id}" />
			</h:column>
			<h:column>
				<h:outputText value="#{result.description}" />
			</h:column>
			<a4j:support event="onselect" reRender="#{fieldID}Container">
				<f:setPropertyActionListener target="#{fieldValue}"
					value="#{result}" />
			</a4j:support>
		</rich:suggestionbox>
		<a4j:commandButton styleClass="aon-lookupButton" value=""
			disabled="#{disabled}"
			actionListener="#{wizard.onShow}" immediate="true"
			oncomplete="searchFieldForFocus('#{fieldID}searchName')"
			reRender="#{fieldID}Container" />
		<aon:div id="#{fieldID}Name" style="display:inline" rendered="#{renderDescription}">
			<aon:outputText rendered="#{fieldValue.description != null}"
				value="#{fieldValue.description}" />
			<aon:outputText rendered="#{fieldValue.description == null}"
				value="---------------------------------" />
		</aon:div>
		<rich:modalPanel id="#{fieldID}modalPanel" minHeight="600"
			rendered="#{wizard.visible}" showWhenRendered="true"
			minWidth="650" top="50" left="100" height="600" width="650"
			zindex="2000" resizeable="true">

			<a4j:support event="onkeyup"
				onsubmit="if(event.keyCode != 27) return false;"
				eventsQueue="#{fieldID}EscKeyUp" ignoreDupResponses="true"
				requestDelay="100" actionListener="#{wizard.onClose}"
				immediate="true" reRender="#{fieldID}Container"
				oncomplete="searchFieldForFocus('#{fieldID}')">
			</a4j:support>

			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<h:outputText value="#{accountBundle.aon_account_selection}" />
				</aon:div>
			</f:facet>
			<f:facet name="controls">
				<a4j:commandButton type="button" styleClass="aon-popupWindow-close"
						actionListener="#{wizard.onClose}" immediate="true"
						reRender="#{fieldID}Container"
						oncomplete="searchFieldForFocus('#{fieldID}')">
				</a4j:commandButton>
			</f:facet>
			<a4j:region>
				<aon:panelGrid columns="2">
					<aon:outputText value="#{accountBundle.aon_account_description}" />
					<aon:inputText value="#{wizard.description}" size="40">
						<a4j:support event="onchange" ajaxSingle="true"
							eventsQueue="#{fieldID}nm" ignoreDupResponses="true"
							requestDelay="100"
							actionListener="#{wizard.inputChanged}" />
					</aon:inputText>

					<aon:outputText value="#{accountBundle.aon_account_alias}" />
					<aon:inputText value="#{wizard.alias}" size="20">
						<a4j:support event="onchange" ajaxSingle="true"
							eventsQueue="#{fieldID}ac" ignoreDupResponses="true"
							requestDelay="100"
							actionListener="#{wizard.inputChanged}" />
					</aon:inputText>

					<aon:outputText value="#{accountBundle.aon_account}" />
					<aon:div>
						<aon:inputText value="#{wizard.id}" size="15">
							<a4j:support event="onchange" ajaxSingle="true"
								eventsQueue="#{fieldID}ic" ignoreDupResponses="true"
								requestDelay="100"
								actionListener="#{wizard.inputChanged}" />
						</aon:inputText>
						<a4j:commandButton value="#{bundle.aon_search}"
							style="margin-left: 5px;"
							actionListener="#{wizard.onSearch}"
							accesskey="#{bundle.aon_key_search}"
							eventsQueue="#{fieldID}SearchQueue" ignoreDupResponses="true"
							requestDelay="100" reRender="#{fieldID}tableContainer"
							oncomplete="selectFirstRow('#{fieldID}table')">
						</a4j:commandButton>
					</aon:div>
				</aon:panelGrid>
			</a4j:region>

			<rich:separator height="2px;"
				style="margin-top: 5px;margin-bottom: 5px;" />

			<aon:div id="#{fieldID}tableContainer">
				<aon:div styleClass="aon-form-note"
					rendered="#{wizard.model.rowCount == 0}">
					<aon:div styleClass="aon-form-note-internal">
						<aon:panelGroup>
							<aon:outputText value="#{bundle.aon_search_no_results}" />
						</aon:panelGroup>
					</aon:div>
				</aon:div>
				<aon:editDataTable id="#{fieldID}table"
					value="#{wizard.model}" var="item"
					rendered="#{wizard.model.rowCount > 0}"
					columnClasses="aon-editDataTable-iconColumn,
						aon-editDataTable-textColumn,
						aon-editDataTable-textColumn,
						aon-editDataTable-textColumn">
					<h:column>
						<aon:commandButton id="#{fieldID}RowSelector"
							styleClass="aon-editDataTable-button aon-icon-rowSelector"
							actionListener="#{wizard.onSelect}" immediate="true"
							ajaxSingle="true" eventsQueue="#{fieldID}SelectQueue"
							requestDelay="100" ignoreDupResponses="true"
							onkeyup="tableKeyUp(event.keyCode)"
							reRender="#{fieldID}Container,#{reRenderAttr}">
							<a4j:actionparam name="actionParam" 
								value="#{fieldValueExpression}"
								assignTo="#{wizard.valueExpression}">
							</a4j:actionparam>
							<a4j:actionparam name="lookupActionParam"
								value="#{onLookupELExpression}"
								assignTo="#{wizard.extendedAttributesValueExpression}">
							</a4j:actionparam>
							<a4j:actionparam name="valueChangeListener"
								value="#{valueChangeListener}"
								assignTo="#{wizard.valueChangeListener}">
							</a4j:actionparam>
						</aon:commandButton>
					</h:column>

					<h:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_account}" />
						</f:facet>
						<aon:outputText value="#{item.id}" />
					</h:column>
					<h:column>
						<f:facet name="header">
							<aon:outputText value="#{accountBundle.aon_account_description}" />
						</f:facet>
						<aon:outputText value="#{item.description}" />
					</h:column>
					
				</aon:editDataTable>

				<aon:panelGrid columns="2" style="border: 0;" cellpadding="5"
					columnClasses="aon-dataScroller-text,aon-dataScroller-buttons">

					<aon:div style="padding-left: 2em;">
						<a4j:commandButton immediate="true"
							eventsQueue="#{fieldID}PreviousQueue" requestDelay="100"
							ignoreDupResponses="true" reRender="#{fieldID}tableContainer"
							styleClass="aon-dataScroller-button aon-dataScroller-button-previous"
							rendered="#{wizard.previousPageAvailable}"
							actionListener="#{wizard.previousPage}"
							oncomplete="selectFirstRow('#{fieldID}table')" />

						<a4j:commandButton immediate="true"
							eventsQueue="#{fieldID}NextQueue" ignoreDupResponses="true"
							requestDelay="100" reRender="#{fieldID}tableContainer"
							styleClass="aon-dataScroller-button aon-dataScroller-button-next"
							rendered="#{wizard.nextPageAvailable}"
							actionListener="#{wizard.nextPage}"
							oncomplete="selectFirstRow('#{fieldID}table')" />
					</aon:div>

				</aon:panelGrid>

			</aon:div>
		</rich:modalPanel>

		<a4j:loadScript src="/js/extendedInput.js" />
		<a4j:loadScript src="/aonResource/com/code/aon/ui/account/facelet/account/lookup/accountIdInput.js" />
			
	</aon:div>
</ui:composition>
