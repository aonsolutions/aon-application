<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbarEx.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.account_abstract}" />
				<ui:param name="skipSaveButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipCancelButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				<ui:param name="controller" value="#{statementAccount}" />

				<ui:define name="toolbarActions">
					<aon:methodParam name="searchActionListener"
						value="#{accStatement.onReset}" type="actionListener" />
					<aon:methodParam name="searchAction" value="accStatement_search" />
					<aon:methodParam name="backActionListener"
						value="#{statementAccount.onCancel}" type="actionListener" />
					<aon:methodParam name="backAction"
						value="accStatement_account_list" />
					<aon:methodParam name="saveAction" value="accStatement_list" />
				</ui:define>

				<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="statement" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="statement" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>
				</ui:define>

			</ui:decorate>

			<aon:div styleClass="aon-scroll-area" ajaxRendered="true">

				<aon:panel style="background-color:#f6f5e3;">
					<aon:outputText styleClass="" value="#{accountBundle.aon_account}" />
					<aon:outputText value=":&#160;" />
					<aon:div style="display:inline;font-size: 1.1em;font-weight: bold;">
						<aon:outputText value="#{statementAccount.to.id}" />
					</aon:div>
					<aon:outputText value="&#160;-&#160;" />
					<aon:outputText value="#{statementAccount.to.description}" />
				</aon:panel>

				<aon:div id="linesContainer" style="width: 99%;">
					<aon:editDataTable id="statementAccountDetailData" var="to"
						value="#{statementAccount.detailModel}" rows="20">

						<f:facet name="header">
							<rich:columnGroup>
								<c:if test="#{statementAccount.openingEntryPresent}">
									<aon:column colspan="3" styleClass="aon-text-right"
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText value="#{accountBundle.opening_entry}" />
										<aon:outputText value=" (" />
										<aon:outputText
											value="#{statementAccount.openingEntry.fromDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>
										<aon:outputText value=")" />
									</aon:column>
									<aon:column styleClass="aon-text-right"
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText value="#{statementAccount.openingEntry.debit}">
											<f:convertNumber pattern="#,##0.00" />
										</aon:outputText>
									</aon:column>
									<aon:column styleClass="aon-text-right"
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText
											value="#{statementAccount.openingEntry.credit}">
											<f:convertNumber pattern="#,##0.00" />
										</aon:outputText>
									</aon:column>
									<aon:column styleClass="aon-text-right"
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText
											value="#{statementAccount.openingEntry.unpaidBalance}">
											<f:convertNumber pattern="#,##0.00" />
										</aon:outputText>
									</aon:column>
									<aon:column styleClass="aon-text-right"
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText
											value="#{statementAccount.openingEntry.creditBalance}">
											<f:convertNumber pattern="#,##0.00" />
										</aon:outputText>
									</aon:column>
									<aon:column
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText value="&#160;" />
									</aon:column>
								</c:if>

								<c:if test="#{statementAccount.fromOpeningEntryPresent}">
									<aon:column breakBefore="true" colspan="3"
										styleClass="aon-text-right"
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText
											value="#{accountBundle.previous_accumulated_amounts} " />
										<aon:outputText value=" (" />
										<aon:outputText value="#{accountBundle.aon_date_from} "
											rendered="#{statementAccount.fromOpeningEntry.fromDate != null}" />
										<aon:outputText
											value="#{statementAccount.fromOpeningEntry.fromDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>
										<aon:outputText value=" #{accountBundle.aon_date_to} "
											rendered="#{statementAccount.fromOpeningEntry.toDate != null}" />
										<aon:outputText
											value="#{statementAccount.fromOpeningEntry.toDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>
										<aon:outputText value=")" />
									</aon:column>
									<aon:column styleClass="aon-text-right"
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText
											value="#{statementAccount.fromOpeningEntry.debit}">
											<f:convertNumber pattern="#,##0.00" />
										</aon:outputText>
									</aon:column>
									<aon:column styleClass="aon-text-right"
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText
											value="#{statementAccount.fromOpeningEntry.credit}">
											<f:convertNumber pattern="#,##0.00" />
										</aon:outputText>
									</aon:column>
									<aon:column styleClass="aon-text-right"
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText
											value="#{statementAccount.fromOpeningEntry.unpaidBalance}">
											<f:convertNumber pattern="#,##0.00" />
										</aon:outputText>
									</aon:column>
									<aon:column styleClass="aon-text-right"
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText
											value="#{statementAccount.fromOpeningEntry.creditBalance}">
											<f:convertNumber pattern="#,##0.00" />
										</aon:outputText>
									</aon:column>
									<aon:column
										style="font-size: 1em;background: #FFF;font-weight: normal;">
										<aon:outputText value="&#160;" />
									</aon:column>
								</c:if>

								<aon:column breakBefore="true" colspan="3"
									styleClass="aon-text-right"
									style="font-size: 1em;background: #FFF;font-weight: normal;">
									<aon:outputText value="#{accountBundle.accumulated_amounts} " />
									<aon:panelGroup
										rendered="#{statementAccount.periodBalance.fromDate != null or statementAccount.periodBalance.toDate != null}">
										<aon:outputText value=" (" />
										<aon:outputText value="#{accountBundle.aon_date_from} "
											rendered="#{statementAccount.periodBalance.fromDate != null}" />
										<aon:outputText
											value="#{statementAccount.periodBalance.fromDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>
										<aon:outputText value=" #{accountBundle.aon_date_to} "
											rendered="#{statementAccount.periodBalance.toDate != null}" />
										<aon:outputText
											value="#{statementAccount.periodBalance.toDate}">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>
										<aon:outputText value=")" />
									</aon:panelGroup>
								</aon:column>
								<aon:column styleClass="aon-text-right"
									style="font-size: 1em;background: #FFF;font-weight: normal;">
									<aon:outputText value="#{statementAccount.periodBalance.debit}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:column>
								<aon:column styleClass="aon-text-right"
									style="font-size: 1em;background: #FFF;font-weight: normal;">
									<aon:outputText
										value="#{statementAccount.periodBalance.credit}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:column>
								<aon:column styleClass="aon-text-right"
									style="font-size: 1em;background: #FFF;font-weight: normal;">
									<aon:outputText
										value="#{statementAccount.periodBalance.unpaidBalance}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:column>
								<aon:column styleClass="aon-text-right"
									style="font-size: 1em;background: #FFF;font-weight: normal;">
									<aon:outputText
										value="#{statementAccount.periodBalance.creditBalance}">
										<f:convertNumber pattern="#,##0.00" />
									</aon:outputText>
								</aon:column>
								<aon:column
									style="font-size: 1em;background: #FFF;font-weight: normal;">
									<aon:outputText value="&#160;" />
								</aon:column>
							</rich:columnGroup>
						</f:facet>

						<aon:column styleClass="aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{accountBundle.aon_account_entry}" />
							</f:facet>
							<h:commandLink immediate="#{true}" target="_blank"
								styleClass="aon-dataTable-link"
								title="#{accountBundle.lookup_account_entry}"
								actionListener="#{accStatement.onAccountEntry}"
								action="account_entry_form">
								<aon:outputText value="#{to.accountEntry}" />
							</h:commandLink>
						</aon:column>

						<aon:column styleClass="aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{accountBundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.fromDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{accountBundle.aon_concept}" />
							</f:facet>
							<aon:outputText value="#{to.concept}" />
						</aon:column>

						<aon:column
							styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{accountBundle.aon_debit}" />
							</f:facet>
							<aon:outputText value="#{to.debit}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column
							styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{accountBundle.aon_credit}" />
							</f:facet>
							<aon:outputText value="#{to.credit}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column
							styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{accountBundle.aon_debit_balance}" />
							</f:facet>
							<aon:outputText value="#{to.unpaidBalance}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column
							styleClass="aon-editDataTable-numberColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{accountBundle.aon_credit_balance}" />
							</f:facet>
							<aon:outputText value="#{to.creditBalance}">
								<f:convertNumber pattern="#,##0.00" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{accountBundle.aon_balancing_account}" />
							</f:facet>
								<aon:outputText id="balancingAccount" value="#{to.balancingAccount}">
								<rich:toolTip value="#{to.balancingAccountDescription}"
								 	hideEvent="onmouseout"
									showDelay="200">
								</rich:toolTip>
								</aon:outputText>
							
						</aon:column>
					</aon:editDataTable>

					<aon:dataScroller2 for="statementAccountDetailData" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
