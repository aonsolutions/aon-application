<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.account_operating_entry}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />

				<ui:define name="toolbarContent">
					<h:commandButton id="save" value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{endPeriodEntries.onOperatingEntry}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="return (confirm('#{bundle.aon_save_confirm}'))" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Account_Period"
						value="#{accountBundle.aon_accPeriod_period}" />
					<aon:selectOneMenu id="Account_Period"
						value="#{endPeriodEntries.period}">
						<f:selectItems value="#{accountCollections.accountPeriods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Account_date"
						value="#{accountBundle.aon_date}" />
					<aon:selectInputDate size="8" id="Account_date"
						value="#{endPeriodEntries.date}" enableManualInput="true"
						datePattern="dd/MM/yyyy"
						timeZone="#{timeZoneController.timeZone}">
					</aon:selectInputDate>

					<aon:outputLabel for="Opening_Concept"
						value="#{accountBundle.aon_concept}" />
					<aon:inputText id="Opening_Concept"
						value="#{endPeriodEntries.concept}" />

					<aon:outputLabel for="Opening_securityLevel"
						value="#{accountBundle.aon_account_security_level}" />
					<aon:selectOneMenu id="Opening_securityLevel"
						value="#{endPeriodEntries.securityLevel}">
						<f:selectItems value="#{accountCollections.securityLevels}" />
					</aon:selectOneMenu>

				</aon:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
