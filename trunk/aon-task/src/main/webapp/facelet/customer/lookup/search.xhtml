<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:outputLabel for="Customer_registry_name"
		value="#{registryBundle.aon_name}" />
	<aon:inputText id="Customer_registry_name" size="50"
		styleClass="aon-inputText"
		valueChangeListener="#{lookup.addExpression}" />

	<aon:outputLabel for="Customer_registry_surname"
		value="#{registryBundle.aon_surname}" />
	<aon:inputText id="Customer_registry_surname" size="50"
		styleClass="aon-inputText"
		valueChangeListener="#{lookup.addExpression}" />

	<aon:outputLabel for="Customer_registry_document"
		value="#{registryBundle.aon_cif}" />
	<aon:inputText id="Customer_registry_document" size="20"
		styleClass="aon-inputText"
		valueChangeListener="#{lookup.addExpression}" />

</ui:composition>

</body>
</html>
