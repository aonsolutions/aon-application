<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="customerForm">
		<aon:div styleClass="aon-finding-title-toolbar">
			<aon:panelGrid columns="3" dir="true" 				
				columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">				
							
				<aon:div styleClass="aon-finding-title-internal">
					<aon:outputText value="#{menuBundle.aon_customer}" />
				</aon:div>						
			
				<aon:div styleClass="aon-finding-subtitle-internal">
					<aon:outputText
						value="#{customer.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</aon:div>				
				
				<aon:div styleClass="aon-finding-toolbar-item-group">
					<aon:confirmButton id="save" value="#{bundle.aon_save} #{customer.to.registry.surname}"
						rendered="#{customer.to!=null or customer.new}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						confirmTitle="Confirmation Dialog"
						confirmMessage="#{bundle.aon_save_confirm}"
						confirmActionListener="#{customer.accept}"
						accesskey="#{bundle.aon_key_save}" />
					<aon:confirmButton id="cancel" value="#{bundle.aon_cancel}"
						rendered="#{customer.to!=null or customer.new}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="#{true}" confirmTitle="Confirmation Dialog"
						confirmMessage="#{bundle.aon_cancel_confirm}"
						confirmActionListener="#{customer.onCancel}"
						confirmAction="customer_list"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
						rendered="#{!customer.new}"
						styleClass="aon-finding-toolbar-item aon-icon-delete"
						immediate="true" confirmTitle="Confirmation Dialog"
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{customer.onRemove}"
						confirmAction="customer_list"
						accesskey="#{bundle.aon_key_remove}" />
					<aon:commandButton id="search" value="#{bundle.aon_search}"
						immediate="true" action="customer_search"
						actionListener="#{customer.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}" />
					<aon:commandButton id="reset" value="#{bundle.aon_reset}"
						actionListener="#{customer.onReset}" rendered="#{!customer.new}"
						styleClass="aon-finding-toolbar-item aon-icon-reset"
						accesskey="#{bundle.aon_key_new}" />
				</aon:div>				
			</aon:panelGrid>
		</aon:div>
		<aon:div styleClass="aon-scroll-area">
		
			<aon:panelGrid columns="2" dir="true">

				<aon:outputLabel for="Customer_registry_document"
					value="#{registryBundle.aon_cif}" />
				<aon:inputText id="Customer_registry_document" label="#{registryBundle.aon_cif}"
					required="true" size="20"
					maxlength="16" value="#{customer.to.registry.document}" />

				<aon:outputLabel for="Customer_registry_name"
					value="#{registryBundle.aon_name}" />
				<aon:inputText id="Customer_registry_name"
					required="true" size="60"
					maxlength="64" value="#{customer.to.registry.name}" />

				<aon:outputLabel for="Customer_registry_surname"
					value="#{registryBundle.aon_surname}" />
				<aon:inputText id="Customer_registry_surname"
					size="60" 
					maxlength="64" value="#{customer.to.registry.surname}">
				</aon:inputText>

				<aon:outputLabel for="Customer_registry_alias"
					value="#{customerBundle.customer_alias}" />
				<aon:inputText id="Customer_registry_alias"
					size="60" maxlength="32"
					value="#{customer.to.registry.alias}" />
					
				<aon:outputLabel for="Customer_scope_id"
					value="#{customerBundle.customer_scope}" />
				<aon:selectOneMenu id="Customer_scope_id" value="#{customer.to.scope.id}" >
					<f:selectItems value="#{configCollections.scopes}" />
				</aon:selectOneMenu>
			</aon:panelGrid>					
				<aon:div>
					<aon:panelTabSet rendered="#{!customer.new}" id="customerTab">

						<aon:panelTab id="medias" label="#{registryBundle.aon_media}">
							<ui:include src="/facelet/shared/tabs/medias.xhtml">
								<ui:param name="controllerAlias" value="#{customerMedia}" />
								<ui:param name="dataTable" value="customerMediaDataList" />
							</ui:include>
						</aon:panelTab>

						<aon:panelTab id="dossiers"
							label="#{projectBundle.dossier_dossiers}">
							<aon:panelGroup rendered="#{dossier.form}">
								<ui:include src="/facelet/dossier/form.xhtml" />
							</aon:panelGroup>
							<aon:panelGroup rendered="#{!dossier.form}">
								<ui:include src="/facelet/dossier/list.xhtml" />
							</aon:panelGroup>
						</aon:panelTab>

					</aon:panelTabSet>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
