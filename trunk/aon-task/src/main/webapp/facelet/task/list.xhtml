<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="taskList">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.aon_task}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{bundle.aon_listing}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="resetTask" value="#{bundle.aon_reset}"
							action="task_form" actionListener="#{task.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							action="task_search" actionListener="#{task.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<aon:commandButton id="assumeSelected"
							value="#{projectBundle.task_assume_selected}"
							styleClass="aon-finding-toolbar-item aon-icon-task-assume"
							actionListener="#{task.onAssumeSelected}" />
						<aon:commandButton id="releaseSelected"
							value="#{projectBundle.task_release_selected}"
							styleClass="aon-finding-toolbar-item aon-icon-task-liberate"
							actionListener="#{task.onReleaseSelected}" />
						<aon:commandButton id="finishSelected"
							value="#{projectBundle.task_finish_selected}"
							styleClass="aon-finding-toolbar-item aon-icon-task-finish"
							actionListener="#{task.onFinishSelected}" />
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:dataTable id="taskDataList" value="#{task.model}" var="to"
						rows="20" rendered="#{task.model.rowCount > 0}"
						styleClass="aon-dataTable">

						<aon:rowSelector actionListener="#{task.onSelect}" />

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:selectBooleanCheckbox id="Row_checked"
								value="#{task.rowChecked}" partialSubmit="true"
								valueChangeListener="#{task.rowSelected}"
								rendered="#{task.listPending or task.listInProgress}" />
							<aon:div rendered="#{!task.listPending and !task.listInProgress}">
								<aon:outputText value="&#160;" />
							</aon:div>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" escape="false" />
							</f:facet>
							<aon:div style="width:14px; height:14px;"
								rendered="#{task.myListTask}">
								<aon:graphicImage url="/css/images/icons/aon-user-icon.gif"
									alt="#{projectBundle.task_user_task} #{to.user.name}" />
							</aon:div>
							<aon:div style="width:14px; height:14px;"
								rendered="#{!task.myListTask}">
								<aon:graphicImage url="/css/images/icons/aon-group-icon.gif"
									alt="#{projectBundle.task_group_task} #{to.workGroup.description}" />
							</aon:div>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{projectBundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{customerBundle.customer_customer}" />
							</f:facet>
							<aon:outputText
								value="#{to.dossier.customer.registry.name} #{to.dossier.customer.registry.surname}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{projectBundle.dossier_dossier}" />
							</f:facet>
							<aon:outputText value="#{to.dossier.number}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{projectBundle.aon_initial_date}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{projectBundle.aon_final_date}" />
							</f:facet>
							<aon:outputText value="#{to.dueDate}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{projectBundle.task_priority}" />
							</f:facet>
							<aon:outputText value="#{to.priority}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{projectBundle.task_percent_abv}" />
							</f:facet>
							<aon:outputText value="#{to.percent}" />
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{projectBundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>

					</aon:dataTable>

					<aon:dataScroller dataTable="taskDataList" model="#{task.model}"
						showNote="true" />

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>

</body>
</html>
