<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>
	<aon:div id="aon-header">
		<aon:panelGrid cellpadding="0" cellspacing="0" border="0" columns="3"
			style="width:100%"
			columnClasses="aon-header-name,aon-header-slogan,aon-header-info">
			<aon:div>
				<aon:outputConnectionStatus id="aonStatus"
					styleClass="aon-outputConnectionStatus"
					startStyleClass="aon-outputConnectionStatus-start"
					stopStyleClass="aon-outputConnectionStatus-stop" />
				<aon:div id="status_error" layout="inline"
					styleClass="aon-outputConnectionStatus-failed"
					style="display: none" />
				<aon:div style="padding-left: 16px;">
					<aon:outputText value="#{appBundle.aon_application_title}"
						styleClass="aon-applicationName" />
				</aon:div>
			</aon:div>

			<aon:div>
				<aon:div
					rendered="#{aonConfiguration.properties.middleHeader == null}">
					<aon:outputText value="&#160;" />
				</aon:div>
				<aon:div
					rendered="#{aonConfiguration.properties.middleHeader != null}">
					<aon:outputText escape="false"
						value="#{aonConfiguration.properties.middleHeader}" />
				</aon:div>
			</aon:div>
			<aon:div>
				<aon:outputText value="#{bundle.aon_login_user}: #{userUtils.loggedUser.name}" />
			</aon:div>
		</aon:panelGrid>
		<aon:div styleClass="aon-header-additionalInfo">
			<aon:div styleClass="aon-float-left">
				<aon:outputText value="#{timeZoneController.currentDate}"
					style="text-transform: uppercase;"
				>
					<f:convertDateTime dateStyle="full"/>
				</aon:outputText>
			</aon:div>
			<aon:div styleClass="aon-float-right">
				<aon:form>
					<aon:outputLink styleClass="aon-header-menu-item-link"
						target="_top"
						value="${facesContext.externalContext.requestContextPath}">
						<aon:outputText value="[#{bundle.aon_home}]" />
					</aon:outputLink>
					<aon:outputText value="&#160;" />
					<aon:commandLink style="border-right:0;" action="logout"
						actionListener="#{aonConfiguration.logout}">
						<aon:outputText value="#{securityBundle.aon_login_user_logout}" />
					</aon:commandLink>
				</aon:form>
					<h:outputText value="#{aonConfiguration.applicationVersion}"
						styleClass="aon-header-menu-item-link"
						rendered="#{aonConfiguration.applicationVersion != null}" />
			</aon:div>
		</aon:div>
	</aon:div>
</ui:composition>
</body>
</html>
