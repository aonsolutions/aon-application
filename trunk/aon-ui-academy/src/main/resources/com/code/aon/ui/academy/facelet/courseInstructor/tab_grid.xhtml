<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:define name="columns">
		
			<aon:column styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputLabel for="CourseInstructor_taskHolder"
						value="#{academyBundle.academy_teacher}" />
				</f:facet>
				<aon:outputText value="#{to.taskHolder.registry.fullName}" rendered="#{formList}" />
				<aon:selectOneMenu id="CourseInstructor_taskHolder"
					required="true" rendered="#{formEdit}"
					value="#{controller.to.taskHolder}" >
					<f:selectItem itemLabel="-" value="#{null}" />		
					<f:selectItems value="#{groupWareCollections.taskHolders}" />
				</aon:selectOneMenu>					
				<f:facet name="footer">
					<aon:selectOneMenu id="CourseInstructor_taskHolder-New"
						required="true" rendered="#{formNew}"
						value="#{controller.to.taskHolder}" >
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{groupWareCollections.taskHolders}" />
					</aon:selectOneMenu>					
				</f:facet>
			</aon:column>

			<aon:column alias="CourseInstructor.type"
				styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputLabel for="CourseInstructor_type" value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.type}" rendered="#{formList}" />
				<aon:selectOneMenu id="CourseInstructor_type" rendered="#{formEdit}"
					value="#{controller.to.type}">
					<f:selectItems value="#{academyCollections.instructorTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="CourseInstructor_type-New" rendered="#{formNew}"
						value="#{controller.to.type}">
						<f:selectItems value="#{academyCollections.instructorTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
