<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div styleClass="aon-margin-bottom">
		<aon:panelGrid columns="2">
			<aon:outputLabel for="CourseAlumnAbsence_evaluation"
				value="#{academyBundle.academy_mark_evaluation}" />
			<aon:selectOneMenu id="CourseAlumnAbsence_evaluation"
				reRender="CourseAlumnAbsenceGrid"
				value="#{controller.evaluation}"
				valueChangeListener="#{controller.onEvaluationChanged}">	
				<f:selectItems value="#{academyCollections.evaluations}" />
			</aon:selectOneMenu>			
		</aon:panelGrid>
	</aon:div>					

	<h:panelGrid id="CourseAlumnAbsenceGrid"
		styleClass="aon-width-all" columns="#{(controller.to != null)?2:1}"
		columnClasses="aon-vertical-align-top #{(controller.to != null)?'aon-width-400,aon-vertical-align-top':''}" >
		<aon:div>
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
				<ui:define name="columns">
				
					<aon:column alias="CourseAlumn.customer.registry.name"
						styleClass="aon-editDataTable-textColumn" >
						<f:facet name="header">
							<aon:outputText value="#{academyBundle.academy_alumn}" />
						</f:facet>
						<aon:outputText value="#{to.customer.registry.name}"
							styleClass="#{(controller.to == to)?'aon-bold aon-italic':''}" />
					</aon:column>
					
				</ui:define>
			</ui:decorate>
		</aon:div>		
		<aon:div rendered="#{controller.to != null}">

			<aon:panel>
				<f:facet name="header">
					<aon:outputText value="#{academyBundle.academy_date_parser}" />
				</f:facet>

				<h:panelGrid columns="3">
					<aon:panelGroup>
						<aon:outputText value="#{bundle.aon_year}" />
						<aon:inputText value="#{absence.year}" 
							size="6" maxlength="4" >
						</aon:inputText>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:outputText value="#{bundle.aon_month}" />
						<aon:selectOneMenu value="#{absence.month}" >
							<f:selectItems value="#{commonCollections.months}" />
						</aon:selectOneMenu>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:outputText value="#{bundle.aon_date}" />
						<aon:inputText value="#{absence.days}" size="30" />
						<aon:commandButton id="parseDays" 
							value="#{bundle.aon_accept}" reRender="CourseAlumnAbsenceGrid"
							actionListener="#{absence.onAddAbsences}" />
					</aon:panelGroup>

				</h:panelGrid>

			</aon:panel>				

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
				<ui:param name="controller" value="#{absence}" />
				<ui:param name="showDataScroller" value="#{false}" />
				<ui:define name="columns">
					
					<aon:column alias="Absence.absenceDate"
						styleClass="aon-editDataTable-textColumn aon-width-120">
						<f:facet name="header">
							<aon:outputLabel for="Absence_absenceDate" value="#{bundle.aon_date}" />
						</f:facet>
						<aon:outputText value="#{to.absenceDate}" rendered="#{formList}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>		
						<aon:selectInputDate id="Absence_absenceDate" 
							value="#{controller.to.absenceDate}" required="true"
							timeZone="#{timeZoneController.timeZone}" rendered="#{formEdit}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
						<f:facet name="footer">
							<aon:selectInputDate id="Absence_absenceDate-New" 
								value="#{controller.to.absenceDate}" required="true"
								timeZone="#{timeZoneController.timeZone}" rendered="#{formNew}"
								popupDateFormat="#{bundle.aon_date_pattern}" />
						</f:facet>
					</aon:column>
					
					<aon:column alias="Absence.comments"
						styleClass="aon-editDataTable-textColumn" >
						<f:facet name="header">
							<aon:outputLabel for="Absence_comments" value="#{bundle.aon_comment}" />
						</f:facet>
						<aon:outputText value="#{to.comments}" rendered="#{formList}" />
						<aon:inputText id="Absence_comments"
							rendered="#{formEdit}" size="40"
							value="#{controller.to.comments}" />
						<f:facet name="footer">
							<aon:inputText id="Absence_comments-New"
								rendered="#{formNew}" size="40"
								value="#{controller.to.comments}" />
						</f:facet>
					</aon:column>
						
				</ui:define>
			</ui:decorate>
		</aon:div>		
	</h:panelGrid>

</ui:composition>
