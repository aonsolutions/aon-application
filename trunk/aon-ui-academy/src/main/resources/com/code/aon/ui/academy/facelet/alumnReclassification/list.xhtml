<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{academyBundle.academy_alumn_reclassification}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_listing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="accept"
						value="#{bundle.aon_accept}"
						rendered="#{!(empty alumnReclassification.checkList)}"
						action="customer_list" actionListener="#{alumnReclassification.onAssign}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_accept}" >
					</aon:commandButton>				
					<aon:commandButton id="search"
						value="#{bundle.aon_search}"
						action="alumnReclassification_search" actionListener="#{alumnReclassification.onEditSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-search"
						accesskey="#{bundle.aon_key_search}" />
				</ui:define>
			</ui:decorate>			

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Customer_segment_id"
						value="#{bundle.aon_reset} #{bundle.aon_segment}" />
					<aon:selectOneMenu id="Customer_segment_id"
						value="#{alumnReclassification.segment}" >
						<f:selectItem itemLabel="-"	itemValue="#{null}" />
						<f:selectItems value="#{registryCollections.segments}" />
					</aon:selectOneMenu>	

					<aon:outputLabel for="Customer_status"
						value="#{bundle.aon_reset} #{bundle.aon_status}" />
					<aon:selectOneMenu id="Customer_status"
						value="#{alumnReclassification.customerStatus}">
						<f:selectItem itemLabel="-"	itemValue="#{null}" />
						<f:selectItems value="#{customerCollections.customerStatuses}" />
					</aon:selectOneMenu>	

				</aon:panelGrid>
								
				<aon:div styleClass="aon-toolbar aon-margin-top"
					rendered="#{alumnReclassification.model.rowCount > 0}">
					<aon:commandButton title="#{bundle.aon_check_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkAll"
						value="#{bundle.aon_check_all}"
						ajaxSingle="true" reRender="customerDataDiv,aonToolbar"
						actionListener="#{alumnReclassification.checkAll}"/>	
					<aon:commandButton title="#{bundle.aon_uncheck_all}"
						styleClass="aon-finding-toolbar-item aon-icon-checkNone"
						value="#{bundle.aon_uncheck_all}"
						ajaxSingle="true" reRender="customerDataDiv,aonToolbar"
						actionListener="#{alumnReclassification.checkNone}" />				
				</aon:div>
					
				<aon:div id="customerDataDiv">					
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
						<ui:param name="controller" value="#{alumnReclassification}" />
						<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
						<ui:param name="skipSelectButton" value="#{true}" />
						<ui:define name="columns">
						
							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="&#160;" />
								</f:facet>
								<aon:selectBooleanCheckbox id="Included_Row_checked"
									value="#{alumnReclassification.rowChecked}"
									ajaxSingle="true" reRender="aonToolbar" />
							</aon:column>
	
							<ui:include
								src="/com/code/aon/ui/customer/facelet/customer/listBasic.xhtml" />

							<aon:column styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_segment}" />
								</f:facet>
								<aon:outputText value="#{alumnReclassification.segmentList}" />
							</aon:column>
		
							<aon:column alias="Customer.status"
								styleClass="aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_status}" />
								</f:facet>
								<aon:outputText value="#{to.status}" />
							</aon:column>

						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
