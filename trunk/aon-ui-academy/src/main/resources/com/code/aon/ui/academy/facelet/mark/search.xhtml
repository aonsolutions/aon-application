<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="loanForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{academyBundle.academy_mark}" />
				<ui:param name="controller" value="#{mark}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{mark}" />
				<ui:define name="searchContent">

					<ui:include src="/com/code/aon/ui/customer/facelet/customer/lookup.xhtml">
						<ui:param name="lookupTo" value="#{markSearch.customer}" />
						<ui:param name="lookupLabel" value="#{academyBundle.academy_alumn}"/>						
						<ui:param name="skipNewButton" value="#{true}" />						
					</ui:include>
	
					<aon:outputLabel for="Mark_alumn_course_academicYear_id"
						value="#{academyBundle.academy_academic_year}" />
					<aon:selectOneMenu id="Mark_alumn_course_academicYear_id"
						value="#{academyCollections.academicYear}"
						valueChangeListener="#{controller.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{academyCollections.academicYears}" />
					</aon:selectOneMenu>					

					<aon:outputLabel for="Mark_alumn_course_courseSubject_id"
						value="#{academyBundle.academy_subject}" />
					<aon:selectOneMenu id="Mark_alumn_course_courseSubject_id"
						value="#{academyCollections.courseSubject}"
						valueChangeListener="#{controller.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{academyCollections.courseSubjects}" />
					</aon:selectOneMenu>					
				
					<aon:outputLabel for="Mark_alumn_course_courseLevel_id"
						value="#{academyBundle.academy_level}" />
					<aon:selectOneMenu id="Mark_alumn_course_courseLevel_id"
						value="#{academyCollections.courseLevel}"
						valueChangeListener="#{controller.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{academyCollections.courseLevels}" />
					</aon:selectOneMenu>					
	
					<aon:outputLabel for="Mark_evaluation"
						value="#{academyBundle.academy_mark_evaluation}" />
					<aon:inputText id="Mark_evaluation" size="10"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="Mark_subject_academicSkill_id"
						value="#{academyBundle.academy_academic_skill}" />
					<aon:selectOneMenu id="Mark_subject_academicSkill_id"
						value="#{academyCollections.academicSkill}"
						valueChangeListener="#{controller.addIdEqualExpression}">
						<f:selectItem itemLabel="-" value="#{null}" />		
						<f:selectItems value="#{academyCollections.academicSkills}" />
					</aon:selectOneMenu>					
	
					<aon:outputLabel for="Mark_mark"
						value="#{academyBundle.academy_mark_mark}" />
					<aon:inputText id="Mark_mark" size="10"
						valueChangeListener="#{controller.addExpression}" />

					<ui:include src="/com/code/aon/ui/academy/facelet/course/lookup.xhtml">
						<ui:param name="lookupTo" value="#{markSearch.course}" />			
					</ui:include>
									
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{customerLookup}" />
		<aon:lookupButtonPopup lookup="#{courseLookup}" />
	</ui:define>
</ui:composition>
