<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">

		<ui:define name="columns">
		
			<aon:column alias="CourseSchedule.dayOfWeek"
				styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputLabel for="CourseSchedule_dayOfWeek" value="#{bundle.aon_day}" />
				</f:facet>
				<aon:outputText value="#{to.dayOfWeek}" rendered="#{formList}" />
				<aon:selectOneMenu id="CourseSchedule_dayOfWeek"
					value="#{controller.to.dayOfWeek}" rendered="#{formEdit}" >
					<f:selectItems value="#{commonCollections.weekDays}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="CourseSchedule_dayOfWeek-New"
						value="#{controller.to.dayOfWeek}" rendered="#{formNew}">
						<f:selectItems value="#{commonCollections.weekDays}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
						
			<aon:column alias="CourseSchedule.startTime"
				styleClass="aon-editDataTable-textColumn aon-width-250">
				<f:facet name="header">
					<aon:outputLabel for="CourseSchedule_startTime" value="#{bundle.aon_start_time}" />
				</f:facet>
				<aon:outputText value="#{to.startTime}" rendered="#{formList}" >
					<f:convertDateTime pattern="#{bundle.aon_time2_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
				<h:panelGrid columns="3" styleClass="aon-noborder" rendered="#{formEdit}">
					<rich:inputNumberSpinner id="CourseSchedule_startTime"
						value="#{controller.startTimeHours}" required="true"
						enableManualInput="false" minValue="0" maxValue="23" inputSize="2" />
					<aon:outputText value=":" />						
					<rich:inputNumberSpinner id="CourseSchedule_startTime-Minutes"
						value="#{controller.startTimeMinutes}" required="true"
						enableManualInput="false" minValue="0" maxValue="59" inputSize="2" />
				</h:panelGrid>					
				<f:facet name="footer">
					<h:panelGrid columns="3" styleClass="aon-noborder" rendered="#{formNew}">
						<rich:inputNumberSpinner id="CourseSchedule_startTime-HoursNew"
							value="#{controller.startTimeHours}" required="true"
							enableManualInput="false" minValue="0" maxValue="23" inputSize="2" />
						<aon:outputText value=":" />							
						<rich:inputNumberSpinner id="CourseSchedule_startTime-MinutesNew"
							value="#{controller.startTimeMinutes}" required="true"
							enableManualInput="false" minValue="0" maxValue="59" inputSize="2" />
					</h:panelGrid>
				</f:facet>
			</aon:column>

			<aon:column alias="CourseSchedule.endTime"
				styleClass="aon-editDataTable-textColumn aon-width-250">
				<f:facet name="header">
					<aon:outputLabel for="CourseSchedule_endTime" value="#{bundle.aon_end_time}" />
				</f:facet>
				<aon:outputText value="#{to.endTime}" rendered="#{formList}" >
					<f:convertDateTime pattern="#{bundle.aon_time2_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>		
				<h:panelGrid columns="3" styleClass="aon-noborder" rendered="#{formEdit}">
					<rich:inputNumberSpinner id="CourseSchedule_endTime"
						value="#{controller.endTimeHours}" required="true"
						enableManualInput="false" minValue="0" maxValue="23" inputSize="2" />
					<aon:outputText value=":" />						
					<rich:inputNumberSpinner id="CourseSchedule_endTime-Minutes"
						value="#{controller.endTimeMinutes}" required="true"
						enableManualInput="false" minValue="0" maxValue="59" inputSize="2" />
				</h:panelGrid>					
				<f:facet name="footer">
					<h:panelGrid columns="3" styleClass="aon-noborder" rendered="#{formNew}">
						<rich:inputNumberSpinner id="CourseSchedule_endTime-HoursNew"
							value="#{controller.endTimeHours}" required="true"
							enableManualInput="false" minValue="0" maxValue="23" inputSize="2" />
						<aon:outputText value=":" />						
						<rich:inputNumberSpinner id="CourseSchedule_endTime-MinutesNew"
							value="#{controller.endTimeMinutes}" required="true"
							enableManualInput="false" minValue="0" maxValue="59" inputSize="2" />
					</h:panelGrid>					
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
