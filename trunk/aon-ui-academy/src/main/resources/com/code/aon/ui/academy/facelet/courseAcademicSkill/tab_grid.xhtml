<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="showDataScroller" value="false" />
		<ui:define name="columns">
		
			<aon:column alias="CourseAcademicSkill.academicSkill.description"
				styleClass="aon-editDataTable-textColumn" >
				<f:facet name="header">
					<aon:outputLabel for="CourseAcademicSkill_academicSkill"
						value="#{academyBundle.academy_academic_skill}" />
				</f:facet>
				<aon:outputText value="#{to.academicSkill.description}" rendered="#{formList}" />
				<aon:selectOneMenu id="CourseAcademicSkill_academicSkill" rendered="#{formEdit}"
					value="#{controller.to.academicSkill}">
					<f:selectItems value="#{controller.selectableAcademicSkills}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:div>
						<aon:selectOneMenu id="CourseAcademicSkill_academicSkill-New" rendered="#{formNew}"
							value="#{controller.to.academicSkill}">
							<f:selectItems value="#{controller.selectableAcademicSkills}" />
						</aon:selectOneMenu>
						<aon:outputText value="#{academyBundle.academy_weight_total}"
							rendered="#{!formNew}" />					
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column alias="CourseAcademicSkill.weight"
				styleClass="aon-editDataTable-numberColumn aon-width-120">
				<f:facet name="header">
					<aon:outputLabel for="CourseAcademicSkill_weight"
						value="#{academyBundle.academy_weight}" />
				</f:facet>
				<aon:outputText value="#{to.weight}" rendered="#{formList}" />
				<aon:inputText id="CourseAcademicSkill_weight"
					rendered="#{formEdit}" size="5" required="true"
					value="#{controller.to.weight}" />
				<f:facet name="footer">
					<aon:panelGroup>				
						<aon:inputText id="CourseAcademicSkill_weight-New"
							rendered="#{formNew}" size="5" required="true"
							value="#{controller.to.weight}" />
						<aon:div styleClass="aon-text-right" rendered="#{!formNew}">							
							<aon:outputText value="#{courseAcademicSkill.weightSum}" />
						</aon:div>
					</aon:panelGroup>						
				</f:facet>
			</aon:column>
							
		</ui:define>
	</ui:decorate>

</ui:composition>
