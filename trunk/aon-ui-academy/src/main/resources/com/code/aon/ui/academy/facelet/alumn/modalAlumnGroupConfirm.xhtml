<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showConfirmWindow">
		<c:if test="#{controller.showAlumnUpdateConfirmWindow}">
			<rich:modalPanel id="confirmModalPanel" minHeight="110" minWidth="530" 
				rendered="#{controller.showAlumnUpdateConfirmWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.aon_confirm_title}" />
					</aon:div>
				</f:facet>
				<aon:form id="confirmForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-scroll-area" style="margin-top: 1em;" >
									<aon:div style="margin-bottom:30px;">

										<aon:outputFormat styleClass="aon-bold"
											value="#{academyBundle.academy_course_alumn_update_confirm}" >
											<f:param value="#{controller.courseAlumnCount}"/>
										</aon:outputFormat>
										
									</aon:div>

									<aon:panelGrid columns="2" style="width: 100%;" styleClass="aon-panelGrid-formatting"
										columnClasses="aon-panelGrid-even aon-text-right aon-noborder,aon-panelGrid-even aon-text-left aon-noborder">
										<aon:commandButton id="confirm-save"
											styleClass="aon-commandButton"
											value="#{bundle.aon_save}"
											actionListener="#{controller.acceptOnly}">
											<rich:componentControl for="confirmModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showAlumnUpdateConfirmWindow}"
												value="#{false}" />
										</aon:commandButton>
										
										<aon:commandButton id="confirm-accept_update"
											styleClass="aon-commandButton"
											value="#{bundle.aon_update} #{bundle.aon_all}"
											actionListener="#{controller.acceptAndUpdate}">
											<rich:componentControl for="confirmModalPanel"
												event="onclick" operation="hide"/>																					
											<f:setPropertyActionListener
												target="#{controller.showAlumnUpdateConfirmWindow}"
												value="#{false}" />
										</aon:commandButton>

									</aon:panelGrid>
								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
