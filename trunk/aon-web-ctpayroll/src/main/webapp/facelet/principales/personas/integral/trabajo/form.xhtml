<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="trabajoForm">

					<!-- 
						<ui:include
						src="/facelet/templates/formPrintToolbar.xhtml">
					-->
					<ui:include
						src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
						<ui:param name="toolbarTitle" 
							value="#{appBundle.aon_payroll_principales_trabajo_mnto}" />
						<ui:param name="controller"	value="#{trabajo}" />
							
						<aon:methodParam name="backAction" value="integralTrab_form" />
						<aon:methodParam name="cancelAction" value="integralTrab_form" />
							
					</ui:include>
					
					<!--	FIN HEADER & TOOLBAR	-->

					





					<aon:panelGrid columns="4" dir="true" width="100%">
					
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajo_act}" />
						<aon:div>
							<aon:inputText value="#{trabajador.to.actividad.cdg}"
								readonly="#{true}" size="1" />
							<aon:inputText value="#{trabajador.to.actividad.descripcion}"
								readonly="#{true}" size="50" />
						</aon:div>
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajo_profesion}" />
						<aon:inputText value="#{trabajo.to.profesion}" size="25"
							maxlength="" />
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajo_cod_trab}" />
						<aon:inputText value="#{trabajador.to.cdg}" 
							readonly="#{true}" size="7" />
							
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajo_datos_trab}" />
						<aon:div>
							<aon:outputText value="#{trabajador.to.persona.nombre} " />
							<aon:outputText value="#{trabajador.to.persona.descripcion} " />
							<aon:outputText value="#{trabajador.to.persona.apellido2}" />
						</aon:div>
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajo_ini_vig_datos}" />
						<aon:selectInputDate id="inicio_vigencia_datos" renderAsPopup="true" required="#{true}"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{trabajo.to.id.fecini}" enableManualInput="true" />
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajo_fin_vig_datos}" />
						<aon:selectInputDate id="fin_vigencia_datos" renderAsPopup="true" required="#{true}"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{trabajo.to.fecfin}" enableManualInput="true" />
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajo_fecant}" />
						<aon:selectInputDate id="fecha_antiguedad" renderAsPopup="true" required="#{true}"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{trabajo.to.fecant}" enableManualInput="true" />
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajo_cuenta_cargo}" />
						<aon:inputText value="#{trabajo.to.ctacar}" size="12"
							maxlength="" />
						
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_trabajo_nuevo_per_vig}" />
						<aon:selectBooleanCheckbox  />
										
					</aon:panelGrid>
						
						
						
					<rich:tabPanel switchType="client" id="trabajoTabs" 
						selectedTab="#{trabajo.tabName}" 
						valueChangeListener="#{trabajo.changeTabValue}" >
	
						<rich:tab id="tab1"
							label="#{appBundle.aon_payroll_principales_trabajo_tab1}" >
							<aon:div id="trabajo">									 
								<ui:include src="tab1/form.xhtml" /> 
							</aon:div>
						</rich:tab>
						<rich:tab id="tab2"
							label="#{appBundle.aon_payroll_principales_trabajo_tab2}" >
							<aon:div id="bonificaciones">									 
								 
								<ui:include src="tab2/form.xhtml" />
								
							</aon:div>
						</rich:tab>
						<rich:tab id="tab3"
							label="#{appBundle.aon_payroll_principales_trabajo_tab3}" >
							<aon:div id="percepciones">									 
								<ui:include src="tab3/form.xhtml" /> 
							</aon:div>
						</rich:tab>
						
					</rich:tabPanel>
					
				</aon:form>
				
				<aon:lookupButtonPopup lookup="#{convenioLookup}" />
				<aon:lookupButtonPopup lookup="#{baseLookup}" />
				<aon:lookupButtonPopup lookup="#{epigrafeLookup}" />
				<aon:lookupButtonPopup lookup="#{tipocontratoLookup}" />
				<aon:lookupButtonPopup lookup="#{colectivosLookup}" />
				<aon:lookupButtonPopup lookup="#{contratostc2Lookup}" />
				<aon:lookupButtonPopup lookup="#{tipautLookup}" />
				
			</ui:define>
		</ui:composition>
	</body>
</html>
