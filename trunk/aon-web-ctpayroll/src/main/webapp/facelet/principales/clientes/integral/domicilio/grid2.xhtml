<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="tipdomiciliosDataDiv">

		<aon:panelGrid columns="2">
			<aon:div>
				<aon:editDataTable id="tipdomiciliosData" var="to" rows="5"
					styleClass="tablasmini"
					rendered="#{(tipdomicilio.model.rowCount > 0) or (tipdomicilio.new)}"
					value="#{tipdomicilio.model}"
					columnClasses="aon-editDataTable-iconColumn,aon-editDataTable-numberColumn, 
						aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-width-150">

					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>

						<aon:div>
							<aon:commandButton alt="[#{bundle.aon_reset}]"
								styleClass="aon-editDataTable-button aon-icon-rowSelector "
								actionListener="#{tipdomicilio.onSelect}"
								reRender="datos"
								accesskey="#{bundle.aon_key_new_line}" />
						</aon:div>
						<f:facet name="footer">
						
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.cdg}" />


					</aon:column>


					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{appBundle.aon_payroll_principales_domicilio_domiasin}" />
						</f:facet>
						<aon:outputText value="#{to.domicilio.nomvia}" />

					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_domicilio_tipodomicilio}" />
						</f:facet>
						<aon:outputText value="#{to.tipdom}"
							rendered="#{to!=tipdomicilio.to}" disabled="true" size="50"
							maxlength="20" />

						<aon:selectOneMenu id="TipoDoms" value="#{tipdomicilio.to.tipdom}"
							rendered="#{to==tipdomicilio.to}">
							<f:selectItem value="#{null}" itemLabel=" -  " />
							<f:selectItems value="#{tipdomicilio.listaTipos}" />
						</aon:selectOneMenu>
					
						<aon:commandButton title="[#{bundle.aon_accept}]"
							rendered="#{to==tipdomicilio.to}"
							styleClass="aon-editDataTable-button aon-icon-accept"
							actionListener="#{tipdomicilio.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:commandButton title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{to==tipdomicilio.to}"
							actionListener="#{tipdomicilio.onCancel}" immediate="true" reRender="datos"
							accesskey="#{bundle.aon_key_cancel_line}" />
						<aon:confirmButton id="remove-Porcentaje"
							title="[#{bundle.aon_remove}]"
							styleClass="aon-editDataTable-button aon-icon-delete"
							rendered="#{to==tipdomicilio.to}"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{tipdomicilio.onRemove}" immediate="true"
							accesskey="#{bundle.aon_key_remove_line}" />

					</aon:column>


				</aon:editDataTable>
					<rich:spacer>
				
				</rich:spacer>
				<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_tipodomcilio_ver}" />
				<aon:selectOneMenu id="Tipodomi" >
					<f:selectItem value="#{null}" itemLabel=" -  " />
					<f:selectItems value="#{tipdomicilio.listaTipos}" />
				</aon:selectOneMenu>
			</aon:div>

			<aon:div id="datos">

				<aon:panelGrid styleClass="tablasmini" columns="2" dir="true"
					width="100%" style="margin-bottom=2px;">
					
					

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_tipocuenta_empresa}" />
					<aon:outputText value="#{tipdomicilio.to.empresa.descripcion}"
						disabled="true" size="50" maxlength="20" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_tipocuenta_actividad}" />
					<aon:outputText value="#{tipdomicilio.to.actividad.descripcion}"
						disabled="true" size="50" maxlength="20" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_tipodomcilio_direccion}" />
					<aon:div>
						<aon:outputText value="#{tipdomicilio.to.domicilio.tipovia.cdg}       "
							disabled="true" size="50" maxlength="20" />

						<aon:outputText value="#{tipdomicilio.to.domicilio.nomvia}    "
							disabled="true" size="50" maxlength="20" />
						
						<aon:outputText value="#{tipdomicilio.to.domicilio.numero}     "
							disabled="true" size="50" maxlength="20" />
					
						<aon:outputText value="#{tipdomicilio.to.domicilio.otrdir}"
							disabled="true" size="50" maxlength="20" />
					</aon:div>
					<aon:outputText value="   " />
					<aon:div>
						<aon:outputText value="#{tipdomicilio.to.domicilio.codpos}     "
							disabled="true" size="50" maxlength="20" />
						

						<aon:outputText value="#{tipdomicilio.to.domicilio.localidad}         "
							disabled="true" size="50" maxlength="20" />
					

						<aon:outputText
							value="#{tipdomicilio.to.domicilio.provincia.descripcion}"
							disabled="true" size="50" maxlength="20" />

					</aon:div>
					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_clientes_perconta}" />
					<aon:outputText value="#{tipdomicilio.to.domicilio.persona}"
						disabled="true" size="50" maxlength="20" />

					<aon:outputLabel
						value="#{appBundle.aon_payroll_principales_clientes_email}" />
					<aon:outputText value="#{tipdomicilio.to.domicilio.email}"
						size="50" maxlength="20" />

				</aon:panelGrid>



			</aon:div>

		</aon:panelGrid>
		<aon:dataScroller2 for="tipdomiciliosData" showNote="true" />

	</aon:div>

</ui:composition>
