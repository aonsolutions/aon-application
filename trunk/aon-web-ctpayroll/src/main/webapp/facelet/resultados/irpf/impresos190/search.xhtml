<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="impresos190Search">

					<ui:include
						src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
						<ui:param name="toolbarTitle"
							value="#{appBundle.aon_payroll_resultados_irpf_impresos190_mnto_impresos}" />
						<ui:param name="controller" value="#{impresos190}" />
						<ui:param name="skipResetButton" value="true" />
					</ui:include>

					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
						<ui:define name="searchContent">
							<aon:methodParam name="searchActionListener"
								value="#{impresos190.onSearch}" type="actionListener" />
							<aon:methodParam name="searchAction"
								value="impresos190_list" />
							
	<!-- *********************************** -->
							
				<aon:outputLabel for="Impresos190_cdg"
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_cod_secuencial}" />
				<aon:inputText id="Impresos190_cdg" size="5" maxlength="4" 
					valueChangeListener="#{impresos190.addExpression}"/>
					
				<aon:outputLabel for="Impresos190_anio"
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_anio_devengo}" />
				<aon:inputText id="Impresos190_anio" size="3" maxlength="2" 
					valueChangeListener="#{impresos190.addExpression}"/>
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_empresa_nif}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="impresos190_emprnif_cdg" 
						lookup="#{empresaLookup}" reRender="impresos190_emprnif_descripcion"
						value="#{impresos190.emprnif.cdg}" size="5" >
					</aon:lookupInputText>
					<aon:lookupButton id="impresos190_emprnif_lookup"
						windowTitle="#{appBundle.aon_payroll_resultados_irpf_impresos190_empresa_nif}"
						selectReRender="impresos190_emprnif_cdg,impresos190_emprnif_descripcion"
						lookup="#{empresaLookup}" minHeight="440"
						property="#{impresos190.emprnif}">
					</aon:lookupButton>
					<aon:inputText id="impresos190_emprnif_descripcion"
						value="#{(impresos190.emprnif.descripcion!=null)?(impresos190.emprnif.descripcion):('')}"
						size="45" disabled="true" />
				</aon:div>
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_admon_hacienda}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="impresos190_admon_cdg"
						lookup="#{admonLookup}" reRender="impresos190_admon_descripcion"
						value="#{impresos190.admon.cdg}" size="5">
					</aon:lookupInputText>
					<aon:lookupButton id="impresos190_admon_lookup"
						windowTitle="#{appBundle.aon_payroll_resultados_irpf_impresos190_empresa_nif}"
						selectReRender="impresos190_admon_cdg,impresos190_admon_descripcion"
						lookup="#{admonLookup}" minHeight="440"
						property="#{impresos190.admon}">
					</aon:lookupButton>
					<aon:inputText id="impresos190_admon_descripcion"
						value="#{(impresos190.admon.description!=null)?(impresos190.admon.description):('')}"
						size="45" disabled="true" />
				</aon:div>
				
				<aon:outputLabel
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_provincia}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="impresos190_provincia_cdg" 
						lookup="#{provinciaLookup}" reRender="impresos190_provincia_descripcion"
						value="#{impresos190.provincia.cdg}" size="5">
					</aon:lookupInputText>
					<aon:lookupButton id="impresos190_provincia_lookup"
						windowTitle="#{appBundle.aon_payroll_resultados_irpf_impresos190_provincia}"
						selectReRender="impresos190_provincia_cdg,impresos190_provincia_descripcion"
						lookup="#{provinciaLookup}" minHeight="440"
						property="#{impresos190.provincia}">
					</aon:lookupButton>
					<aon:inputText id="impresos190_provincia_descripcion"
						value="#{(impresos190.provincia.descripcion!=null)?(impresos190.provincia.descripcion):('')}"
						size="45" disabled="true" />
				</aon:div>
				
				<aon:outputLabel for="Impresos190_descuadrado"
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_descuadro}" />
				<aon:selectBooleanCheckbox id="Impresos190_descuadrado" 
					valueChangeListener="#{impresos190.addEqualExpression}"/>
				
	<!-- *********************************** -->
						
				<aon:outputLabel for="Impresos190_numPercep"
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_num_perceptores}" />
				<aon:inputText id="Impresos190_numPercep" size="3" maxlength="2" 
					valueChangeListener="#{impresos190.addExpression}"/>
				
				<aon:outputLabel for="Impresos190_impPercep"
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_importe_percepciones}" />
				<aon:inputText id="Impresos190_impPercep" size="14" maxlength="11" 
					valueChangeListener="#{impresos190.addExpression}"/>
					
				<aon:outputLabel for="Impresos190_impRetenc"
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_importe_ret}" />
				<aon:inputText id="Impresos190_impRetenc" size="14" maxlength="11" 
					valueChangeListener="#{impresos190.addExpression}"/>
				
	<!-- *********************************** -->
							
				<aon:outputLabel for="Impresos190_emprnif_representante"
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_representante}" />
				<aon:inputText id="Impresos190_emprnif_representante" size="70" maxlength="60" 
					valueChangeListener="#{impresos190.addExpression}"/>
				
				<aon:outputLabel for="Impresos190_fecha"
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_fecha_calculo}" />	
				<aon:selectInputDate renderAsPopup="true"
					popupDateFormat="#{appBundle.aon_date_pattern}"
					id="Impresos190_fecha" enableManualInput="true" 
					valueChangeListener="#{impresos190.addEqualExpression}"/>
					
				<aon:outputLabel for="Impresos190_emprnif_cargo"
					value="#{appBundle.aon_payroll_resultados_irpf_impresos190_cargo}" />
				<aon:inputText id="Impresos190_emprnif_cargo" size="70" maxlength="60" 
					valueChangeListener="#{impresos190.addExpression}"/>
				
	<!-- *********************************** -->
							
						</ui:define>
					</ui:decorate>
				</aon:form>
				
				<aon:lookupButtonPopup lookup="#{empresaLookup}" />
				<aon:lookupButtonPopup lookup="#{admonLookup}" />
				<aon:lookupButtonPopup lookup="#{provinciaLookup}" />
				
			</ui:define>
		</ui:composition>

	</body>
</html>
