<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html">
<body>
	<ui:composition>
	
		<h:commandLink id="export2pdf" value="PDF"
				title="#{appBundle.aon_payroll_export_label} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_pdf_label}"
				styleClass="aon-finding-toolbar-item aon-icon-pdf"
				action="#{report.onExecute}" rendered="#{!manager.new}" 
				target="_blank">
			<f:param name="reportKey" value="#{reportKey}" />
		</h:commandLink>
		<h:commandLink id="export2excel" value="XLS"
				title="#{appBundle.aon_payroll_export_label} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_excel_label}"
				styleClass="aon-finding-toolbar-item aon-icon-excel"
				action="#{report.onExecute}" rendered="#{!manager.new}" 
				target="_blank">
			<f:param name="reportKey" value="#{reportKey}" />
			<f:param name="outputFormat" value="MS Excel" />
		</h:commandLink>
		<h:commandLink id="export2csv" value="CSV"
				title="#{appBundle.aon_payroll_export_label} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_csv_label}"
				styleClass="aon-finding-toolbar-item aon-icon-excel"
				action="#{report.onExecute}" rendered="#{!manager.new}" 
				target="_blank">
			<f:param name="reportKey" value="#{reportKey}" />
			<f:param name="outputFormat" value="CSV" />
		</h:commandLink>
	
	</ui:composition>
</body>
</html>
