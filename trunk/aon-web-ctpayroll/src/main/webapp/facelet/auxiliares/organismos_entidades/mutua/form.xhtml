<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="mutuaMaestroForm">
			
			<ui:include src="/facelet/templates/formPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_auxiliares_organismos_entidades__mutua}" />
				<ui:param name="controller" value="#{mutuaMaestro}" />
				<ui:param name="reportKey" value="MutuasList"/>
				<ui:param name="reportKeyXls" value="MutuasListXLS"/>
			</ui:include>	

	<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="mutuaMaestro" columns="2" dir="true" width="100%" style="margin-bottom=2px;">
				
				
					<aon:outputLabel value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText value="#{mutuaMaestro.to.cdg}" disabled="#{!mutuaMaestro.new}" 
						required="true" size="3" maxlength="3" />
				
					<aon:outputLabel  value="#{appBundle.aon_payroll_description}" />
					<aon:inputText value="#{mutuaMaestro.to.description}" 
						required="true" size="35" maxlength="35" >
					</aon:inputText>
						
			
				 
				</aon:panelGrid>

			 	<ui:include src="grid.xhtml" rendered="#{!mutuaMaestro.new}" />		 		
			</aon:div>

		
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
