<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>
<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="minoracionesGrid">
	
			<aon:div ajaxRendered="true" layout="none">
	
				<aon:div styleClass="aon-finding-title-toolbar">
					<aon:panelGrid columns="3" dir="true"
						columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
	
						<aon:div styleClass="aon-finding-title-internal">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf_foral__minor_48}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{appBundle.aon_payroll_crud}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-toolbar-item-group">
							<aon:commandButton id="reset" value="#{bundle.aon_reset}"
								actionListener="#{minoracionesVizcaya.onReset}" rendered="#{!minoracionesVizcaya.new}"
								styleClass="aon-finding-toolbar-item aon-icon-reset"
								accesskey="#{bundle.aon_key_new}"/>
							<aon:commandButton id="save"
								value="#{bundle.aon_save}" rendered="#{minoracionesVizcaya.to!=null or minoracionesVizcaya.new}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								actionListener="#{minoracionesVizcaya.onAccept}" 
								accesskey="#{bundle.aon_key_new}" />
							<aon:confirmButton id="cancelNew"
								value="#{bundle.aon_cancel}" rendered="#{minoracionesVizcaya.new}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{minoracionesVizcaya.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:commandButton id="cancelEdit"
								value="#{bundle.aon_cancel}" rendered="#{minoracionesVizcaya.to!=null and (!minoracionesVizcaya.new)}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								actionListener="#{minoracionesVizcaya.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:confirmButton id="remove"
								value="#{bundle.aon_remove}" rendered="#{minoracionesVizcaya.to!=null and !minoracionesVizcaya.new}"
								styleClass="aon-finding-toolbar-item aon-icon-delete" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{minoracionesVizcaya.onRemove}"
								accesskey="#{bundle.aon_key_remove}"/>
							<h:commandLink id="export2pdf" value="."
									title="#{appBundle.aon_payroll_export} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_pdf}"
									styleClass="aon-finding-toolbar-item aon-icon-pdf"
									action="#{report.onExecute}" rendered="#{!minoracionesVizcaya.new}" 
									target="_blank">
								<f:param name="reportKey" value="MinoracionesVizcayaList" />
							</h:commandLink>
							<h:commandLink id="export2excel" value="."
									title="#{appBundle.aon_payroll_export} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_excel}"
									styleClass="aon-finding-toolbar-item aon-icon-excel"
									action="#{report.onExecute}" rendered="#{!minoracionesVizcaya.new}" 
									target="_blank">
								<f:param name="reportKey" value="MinoracionesVizcayaList" />
								<f:param name="outputFormat" value="MS Excel" />
							</h:commandLink>
							<h:commandLink id="export2csv" value="."
									title="#{appBundle.aon_payroll_export} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_csv}"
									styleClass="aon-finding-toolbar-item aon-icon-excel"
									action="#{report.onExecute}" rendered="#{!minoracionesVizcaya.new}" 
									target="_blank">
								<f:param name="reportKey" value="MinoracionesVizcayaList" />
								<f:param name="outputFormat" value="CSV" />
							</h:commandLink>
						</aon:div>
					</aon:panelGrid>
				</aon:div>
	
				<!-- region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<aon:editDataTable id="minoracionesVizcayaData" var="to" rows="20"
						rendered="#{(minoracionesVizcaya.model.rowCount > 0) or (minoracionesVizcaya.new)}" value="#{minoracionesVizcaya.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-numberColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">
								
						<aon:rowSelector toggleOnClick="#{minoracionesVizcaya.to == null}"
							actionListener="#{minoracionesVizcaya.onSelect}" />
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{minoracionesVizcaya.onReset}" value=""
										rendered="#{!minoracionesVizcaya.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{aon_payroll_auxiliares_irpf_foral__minor_01_tramo}" />
							</f:facet>
							<aon:outputText value="#{to.id.numTramo}" rendered="#{to!=minoracionesVizcaya.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								requiredMessage="numTramo"
								rendered="#{to==minoracionesVizcaya.to}" size="2"
								value="#{minoracionesVizcaya.to.id.numTramo}" maxlength="2" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{minoracionesVizcaya.new}" size="2"
									value="#{minoracionesVizcaya.to.id.numTramo}" maxlength="2" 
									requiredMessage="numTramo" />
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf_foral__minor_01_fecini}" />
							</f:facet>
							<aon:outputText value="#{to.id.fecini}" rendered="#{to!=minoracionesVizcaya.to}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate required="true"
								requiredMessage="fecini"
								rendered="#{to==minoracionesVizcaya.to}"
								value="#{minoracionesVizcaya.to.id.fecini}"
								renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
							</aon:selectInputDate>
							<f:facet name="footer">
								<aon:selectInputDate required="true"
									requiredMessage="fecini"
									rendered="#{minoracionesVizcaya.new}" 
									value="#{minoracionesVizcaya.to.id.fecini}" 
									renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
								</aon:selectInputDate>
									
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf_foral__minor_01_fecfin}" />
							</f:facet>
							<aon:outputText value="#{to.fecfin}" rendered="#{to!=minoracionesVizcaya.to}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate required="true"
								requiredMessage="fecfin"
								rendered="#{to==minoracionesVizcaya.to}"
								value="#{minoracionesVizcaya.to.fecfin}"
								renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
							</aon:selectInputDate>
							<f:facet name="footer">
								<aon:selectInputDate required="true"
									requiredMessage="fecfin"
									rendered="#{minoracionesVizcaya.new}" 
									value="#{minoracionesVizcaya.to.fecfin}" 
									renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}">
								</aon:selectInputDate>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf_foral__minor_01_desdeimporte}" />
							</f:facet>
							<aon:outputText value="#{to.desdeImporte}" rendered="#{to!=minoracionesVizcaya.to}" >
								<f:convertNumber type="number" pattern="###,###.###" />
							</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text " required="true"
								requiredMessage="hasta"
								rendered="#{to==minoracionesVizcaya.to}" size="11"
								value="#{minoracionesVizcaya.to.desdeImporte}" maxlength="11" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									requiredMessage="hasta"
									rendered="#{minoracionesVizcaya.new}" size="11"
									value="#{minoracionesVizcaya.to.desdeImporte}" maxlength="11" />
							</f:facet>
						</aon:column>
						
							<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf_foral__minor_01_hastaimporte}" />
							</f:facet>
							<aon:outputText value="#{to.hastaImporte}" rendered="#{to!=minoracionesVizcaya.to}" >
								<f:convertNumber type="number" pattern="###,###.###" />
							</aon:outputText>
							<aon:inputText styleClass="aon-form-input-text " required="true"
								requiredMessage="hasta"
								rendered="#{to==minoracionesVizcaya.to}" size="11"
								value="#{minoracionesVizcaya.to.hastaImporte}" maxlength="11" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									requiredMessage="hasta"
									rendered="#{minoracionesVizcaya.new}" size="11"
									value="#{minoracionesVizcaya.to.hastaImporte}" maxlength="11" />
							</f:facet>
						</aon:column>					
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf_foral__minor_01_minMinus}" />
							</f:facet>
							<aon:outputText value="#{to.minMinus}" rendered="#{to!=minoracionesVizcaya.to}" >
								<f:convertNumber minFractionDigits="2" />
							</aon:outputText>
							<aon:inputText id="minminup" styleClass="aon-form-input-text"
								rendered="#{to==minoracionesVizcaya.to}" size="5"
								value="#{minoracionesVizcaya.to.minMinus}" maxlength="5" >
								<f:validator validatorId="porcentajeValidator" />
							</aon:inputText>
							<f:facet name="footer">
								<aon:inputText id="minminnew" styleClass="aon-form-input-text"
									rendered="#{minoracionesVizcaya.new}" size="5"
									value="#{minoracionesVizcaya.to.minMinus}" maxlength="5" >
								<f:validator validatorId="porcentajeValidator" />
							</aon:inputText>
							</f:facet>
						</aon:column>
						
							<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf_foral__minor_01_minAyuda}" />
							</f:facet>
							<aon:outputText value="#{to.minAyuda}" rendered="#{to!=minoracionesVizcaya.to}" >
								<f:convertNumber minFractionDigits="2" />
							</aon:outputText>
							<aon:inputText id="minayuup" styleClass="aon-form-input-text"
								rendered="#{to==minoracionesVizcaya.to}" size="5"
								value="#{minoracionesVizcaya.to.minAyuda}" maxlength="5" >
								<f:validator validatorId="porcentajeValidator" />
							</aon:inputText>
							<f:facet name="footer">
								<aon:inputText id="minayunew" styleClass="aon-form-input-text"
									rendered="#{minoracionesVizcaya.new}" size="5"
									value="#{minoracionesVizcaya.to.minAyuda}" maxlength="5" >
								<f:validator validatorId="porcentajeValidator" />
							</aon:inputText>
							</f:facet>
						</aon:column>
						
							<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_auxiliares_irpf_foral__minor_01_minGranminus}" />
							</f:facet>
							<aon:outputText value="#{to.minGranminus}" rendered="#{to!=minoracionesVizcaya.to}" >
								<f:convertNumber minFractionDigits="2" />
							</aon:outputText>
							<aon:inputText id="mingramup" styleClass="aon-form-input-text"
								rendered="#{to==minoracionesVizcaya.to}" size="5"
								value="#{minoracionesVizcaya.to.minGranminus}" maxlength="5" >
								<f:validator validatorId="porcentajeValidator" />
							</aon:inputText>
							<f:facet name="footer">
								<aon:inputText id="mingramnew" styleClass="aon-form-input-text"
									rendered="#{minoracionesVizcaya.new}" size="5"
									value="#{minoracionesVizcaya.to.minGranminus}" maxlength="5" >
								<f:validator validatorId="porcentajeValidator" />
							</aon:inputText>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=minoracionesVizcaya.to}">&#160;</f:verbatim>
								<aon:commandButton id="acceptEdit-Scope" title="[#{bundle.aon_accept}]" 
									rendered="#{to==minoracionesVizcaya.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{minoracionesVizcaya.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==minoracionesVizcaya.to}"
									actionListener="#{minoracionesVizcaya.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==minoracionesVizcaya.to}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{minoracionesVizcaya.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />								
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!minoracionesVizcaya.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]" 
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{minoracionesVizcaya.new}"
										actionListener="#{minoracionesVizcaya.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{minoracionesVizcaya.new}"
										confirmTitle="#{bundle.aon_confirm_title}" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{minoracionesVizcaya.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
						
					</aon:editDataTable>
					<aon:dataScroller2 for="minoracionesVizcayaData" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
</body>
</html>
