<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
		<aon:editDataTable id="ocupacionData" value="#{ocupacion.model}" 
			var="to" rows="0"
			rendered="#{(ocupacion.model.rowCount >= 0) or (ocupacion.new)}"
			columnClasses="aon-editDataTable-iconColumn
				, aon-editDataTable-dateColumn, aon-editDataTable-dateColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-numberColumn
				, aon-editDataTable-numberColumn, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{ocupacion.to == null}" actionListener="#{ocupacion.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{ocupacion.onReset}" value=""
							rendered="#{!ocupacion.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_fecini}" />
				</f:facet>
				<aon:outputText value="#{to.id.fecini}" rendered="#{to!=ocupacion.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{ocupacion.to.id.fecini}" id="FechaInicio"
					rendered="#{to==ocupacion.to}" disabled="#{to==ocupacion.to}" required="true"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{ocupacion.to.id.fecini}" id="FechaInicioNew"
						rendered="#{ocupacion.new}" required="true"
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_fecfin}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}" rendered="#{to!=ocupacion.to}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:selectInputDate value="#{ocupacion.to.fecfin}" id="FechaFin"
					rendered="#{to==ocupacion.to}" required="true"
					renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
				</aon:selectInputDate>
				<f:facet name="footer">
					<aon:selectInputDate value="#{ocupacion.to.fecfin}" id="FechaFinNew"
						rendered="#{ocupacion.new}" 
						renderAsPopup="true" popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pctit}" />
				</f:facet>
				<aon:outputText value="#{to.pctit}" rendered="#{to!=ocupacion.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<aon:inputText id="ocupacion_pctit_edit" styleClass="aon-form-input-text"
					rendered="#{to==ocupacion.to}" required="true"
					value="#{ocupacion.to.pctit}" maxlength="8" size="10" >
					<f:validator validatorId="porcentajeValidator" />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="ocupacion_pctit_new" styleClass="aon-form-input-text"  
						rendered="#{ocupacion.new}" required="true"
						value="#{ocupacion.to.pctit}" maxlength="8" size="10"  >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pctims}" />
				</f:facet>
				<aon:outputText value="#{to.pctims}" rendered="#{to!=ocupacion.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<aon:inputText id="ocupacion_pctims_edit" styleClass="aon-form-input-text"
					rendered="#{to==ocupacion.to}" required="true"
					value="#{ocupacion.to.pctims}" maxlength="8" size="10" >
					<f:validator validatorId="porcentajeValidator" />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="ocupacion_pctims_new" styleClass="aon-form-input-text"  
						rendered="#{ocupacion.new}" required="true"
						value="#{ocupacion.to.pctims}" maxlength="8" size="10"  >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cotizacion_pcttotal}" />
				</f:facet>
				<aon:outputText value="#{to.pcttotal}" rendered="#{to!=ocupacion.to}" >
					<f:convertNumber minFractionDigits="2" />
				</aon:outputText>
				<!-- aon:inputText id="ocupacion_pcttotal_edit" styleClass="aon-form-input-text"
					rendered="#{to==ocupacion.to}" required="true"
					value="#{ocupacion.to.pcttotal}" maxlength="8" size="10" >
					<f:validator validatorId="porcentajeValidator" />
				</aon:inputText-->
				<f:facet name="footer">
					<!-- aon:inputText id="ocupacion_pcttotal_new" styleClass="aon-form-input-text"  
						rendered="#{ocupacion.new}" required="true"
						value="#{ocupacion.to.pcttotal}" maxlength="8" size="10"  >
						<f:validator validatorId="porcentajeValidator" />
					</aon:inputText-->
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=ocupacion.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==ocupacion.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{ocupacion.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==ocupacion.to}"
						actionListener="#{ocupacion.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-ocupacion" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==ocupacion.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{ocupacion.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!ocupacion.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{ocupacion.new}"
							actionListener="#{ocupacion.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-ocupacion" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{ocupacion.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{ocupacion.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
	</aon:div>

</ui:composition>
