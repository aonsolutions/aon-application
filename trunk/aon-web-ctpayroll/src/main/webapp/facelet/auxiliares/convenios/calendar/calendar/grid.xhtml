<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich">

<aon:div id="calendarDiv">

	<aon:editDataTable id="calendarData" var="to" rows="3"
						value="#{calendar.model}"
						columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn,">
								
								
			 <aon:rowSelector 
			  >
			<aon:actionListener method="#{calendar.onSelect}" />
			</aon:rowSelector>


			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>

					<h:commandButton alt="[#{bundle.aon_reset}]"
						rendered="#{to==calendar.to}"
						styleClass="aon-editDataTable-button aon-icon-rowSelector "
						actionListener="#{calendar.onSelect}"  />

			
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_principales_actividad_con}" />
				</f:facet>
				<aon:outputText value="#{to.cdg}" />

			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_principales_actividad_nombre}" />
				</f:facet>
				<aon:outputText value="#{to.feccal}" />

			</aon:column>
			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_principales_actividad_nombre}" />
				</f:facet>
				<aon:outputText value="#{to.tipdia}" />

			</aon:column>







		</aon:editDataTable>
					<aon:dataScroller2 for="calendarData" showNote="true" />
	
</aon:div>

</ui:composition>
