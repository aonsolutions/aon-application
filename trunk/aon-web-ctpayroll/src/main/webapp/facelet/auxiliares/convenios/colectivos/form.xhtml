<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="conveniosForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.auxiliares_convenios__convenio}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{convenios.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="convenios_colectivos"
							actionListener="#{convenio.onAccept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{convenio.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{convenio.onCancel}"
							confirmAction="convenios_colectivos"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!convenio.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{convenio.onRemove}"
							confirmAction="convenios_colectivos"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!convenio.new}"
							action="convenios_colectivos" 
							actionListener="#{convenio.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!convenio.new}" immediate="true"
							action="convenios_colectivos_search" actionListener="#{convenio.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />														
						
						<aon:spin controller="#{convenio}" action="convenios_colectivos" rendered="#{!convenio.new}" />
						
						<!--  
						<ui:include src="/facelet/templates/aon.ui.printbuttons.xhtml">
							<ui:param name="manager" value="#{convenio}"/>
							<ui:param name="reportKey" value="BasesList"/>
						</ui:include>
						-->
					</aon:div>
					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>
			
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="convenio" columns="2" dir="true" width="100%" style="margin-bottom=2px;">
					<aon:outputLabel for="Convenio_cdg" value="#{appBundle.aon_payroll_cdg} #{appBundle.aon_payroll_auxiliares_convenios__convenio}"/>
					<aon:inputText id="Convenio_cdg" value="#{convenio.to.cdg}" disabled="#{!convenio.new}" 
						required="true" size="15" maxlength="10" />
				
					<aon:outputLabel for="Convenio_description" value="#{appBundle.aon_payroll_description} #{appBundle.aon_payroll_auxiliares_convenios__convenio}" />
					<aon:inputText id="Convenio_description" value="#{convenio.to.description}" 
						size="70" maxlength="50" >
					</aon:inputText>
					
					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_convenios__indicador}" />
					<aon:selectOneMenu id="IndicadorDias" value="#{convenio.to.inddiaenum}" >						
						<f:selectItem value="#{null}" itemLabel=" -  " />
						<f:selectItems value="#{convenio.listaIndicadorDias}"/>
					</aon:selectOneMenu>
					
					<aon:outputLabel value="#{appBundle.aon_payroll_auxiliares_convenios__tipo}" />
					<aon:selectOneMenu id="TipoConvenio" value="#{convenio.to.tipconenum}" >												
						<f:selectItem value="#{null}" itemLabel=" -  " />
						<f:selectItems value="#{convenio.listaTipoConvenios}" />
					</aon:selectOneMenu>
					
				</aon:panelGrid>


				<!-- rich:tabPanel switchType="client" selectedTab="#{(pagaext.to!=null)?'niveles':'pagas'}"-->
				<rich:tabPanel switchType="ajax" >
					<rich:tab id="niveles" label="#{appBundle.aon_payroll_auxiliares_convenios__niveles}">
						<aon:commandButton id="categoriasButtom2" title="[#{bundle.aon_categorias}]"
							rendered="#{!convenio.new}" immediate="true" disabled="#{convenio.new}"
							action="convenios_colectivos_search" actionListener="#{convenio.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-category"
							accesskey="#{bundle.aon_key_search}" />				
						<aon:commandButton id="percepcionesButtom2" title="[#{bundle.aon_percepciones}]"
							rendered="#{!convenio.new}" immediate="true" disabled="#{convenio.new}"
							action="convenios_colectivos_search" actionListener="#{convenio.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-notes"
							accesskey="#{bundle.aon_key_search}" />			
						<ui:include src="nivel/grid.xhtml" />
						<!--  
						<ui:include src="categoria/grid.xhtml" />
						<ui:include src="percepcion/grid.xhtml" />
						-->
					</rich:tab>
					<rich:tab id="pagas" label="#{appBundle.aon_payroll_auxiliares_convenios__pagas}">
						<ui:include src="pagas/grid.xhtml" />
					</rich:tab>
				</rich:tabPanel>
			
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
