<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include
		src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
		<ui:param name="toolbarID" value="profileToolbar" />	
		<ui:param name="innerToolbar" value="#{true}" />
		<ui:param name="controller" value="#{profile}" />	
		<ui:param name="skipToolbarDescription" value="true" />
		<ui:param name="skipSearchButton" value="true" />
		
		<aon:methodParam name="resetAction" value="" />
		<ui:param name="resetButtonReRender" value="profilesDiv" />		
	</ui:include>

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
		<ui:param name="controller" value="#{profile}" />
		<ui:define name="columns">
	
			<aon:column styleClass="aon-width-180 aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.commonName}"/>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText value="#{managerBundle.manager_roles}" />
				</f:facet>
				<aon:outputText value="#{to.roleList}"/>
			</aon:column>
	
		</ui:define>

	</ui:decorate>

</ui:composition>
