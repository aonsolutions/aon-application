<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="rows" value="15" />
		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-textColumn"
				alias="WorkGroup.description" >
				<f:facet name="header">
					<aon:outputLabel for="WorkGroup_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{formList}" />
				<aon:inputText id="WorkGroup_description"
					rendered="#{formEdit}" size="64" maxlength="64"
					value="#{controller.to.description}" required="true" />
				<f:facet name="footer">
					<aon:inputText id="WorkGroup_description-New"
						rendered="#{formNew}" size="64" maxlength="64"
						value="#{controller.to.description}" required="true" />
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150"
				alias="WorkGroup.status" >
				<f:facet name="header">
					<aon:outputLabel for="WorkGroup_status" value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}" rendered="#{formList}" />
				<aon:selectOneMenu id="WorkGroup_status"
					rendered="#{formEdit}" value="#{controller.to.status}">
					<f:selectItems value="#{manager.workGroupStatuses}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="WorkGroup_status-New"
						rendered="#{formNew}" value="#{controller.to.status}">
						<f:selectItems value="#{manager.workGroupStatuses}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
