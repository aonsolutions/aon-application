<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

				<aon:div>

					<aon:outputLabel value="Su importe asciende a " />

					<aon:panel id="paymethod-list" styleClass="aon-padding-right">
						<aon:outputLabel for="Offer_paymethod"
							value="#{ecommerceBundle.aon_ecommerce_paymethod}" />
						<aon:selectOneRadio id="Offer_paymethod" styleClass="offer-paymethod"

							required="true">
							<f:selectItems value="#{ecConfig.payMethodList}" />
							<a4j:support event="onclick" reRender="paymethod-accept"/>
						</aon:selectOneRadio>

						<img src="https://www.paypal.com/es_XC/i/logo/PayPal_mark_37x23.gif"

		<aon:div>
			<aon:panel id="paymethod-accept" styleClass="aon-padding-right">
				<c:if test="#{shop.paymethodPaypal}">
					<ui:include src="method/paypal.xhtml" />
				</c:if>
				<c:if test="#{shop.paymethodBankDraft}">
					<ui:include src="method/bankDraft.xhtml" />
				</c:if>
				<c:if test="#{shop.paymethodBankTransfer}">
					<ui:include src="method/bankTransfer.xhtml" />
				</c:if>
				<c:if test="#{shop.paymethodCashOnDelivery}">
					<ui:include src="method/cashOnDelivery.xhtml" />
				</c:if>
				<c:if test="#{shop.paymethodVisa}">
					<ui:include src="method/visa.xhtml" />
				</c:if>
			</aon:panel>
