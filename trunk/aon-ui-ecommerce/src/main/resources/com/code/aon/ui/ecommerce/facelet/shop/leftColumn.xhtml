<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:dataTable id="cataloguesGadget" value="#{catalogueGadget.model}"
		rows="20" var="to" style="width=90%">
		<aon:rowSelector actionListener="#{catalogueGadget.onSelect}"
			reRender="itemContent" />
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="catalogues -i18n-" />
			</f:facet>
			<aon:outputText value="#{to.name}" />
		</aon:column>
	</aon:dataTable>

	<rich:spacer height="20" />

	<aon:dataTable id="categoriesGadget" value="#{categoryGadget.model}"
		rows="20" var="to" style="width=90%">
		<aon:rowSelector actionListener="#{categoryGadget.onSelect}"
			reRender="itemContent" />
		<aon:column>
			<f:facet name="header">
				<aon:outputText value="category -i18n-" />
			</f:facet>
			<aon:outputText value="#{to.name}" />
		</aon:column>
	</aon:dataTable>

</ui:composition>
