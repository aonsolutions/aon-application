<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGrid columns="4" dir="true">
	
	<aon:outputLabel for="Registry_id" value="#{bundle.aon_id}" />
	<aon:inputText id="Registry_id"
		value="#{shoppingCart.cartTarget.ecTarget.target.registry.id}" size="15"
		disabled="true" />

	<aon:outputLabel for="Registry_document"
		value="#{bundle.aon_company_document}" />
	<aon:inputText id="Registry_document" maxlength="16"
		value="#{shoppingCart.cartTarget.ecTarget.target.registry.document}" size="16">
		<f:validateLength minimum="1" maximum="16" />
	</aon:inputText>

	<aon:outputLabel for="Registry_name" value="#{bundle.aon_company_name}" />
	<aon:inputText id="Registry_name" maxlength="64"
		value="#{shoppingCart.cartTarget.ecTarget.target.registry.name}" size="64">
		<f:validateLength minimum="1" maximum="64" />
	</aon:inputText>

	<aon:outputLabel for="Registry_surname"
		value="#{registryBundle.registry_surname}" />
	<aon:inputText id="Registry_surname" maxlength="64"
		value="#{shoppingCart.cartTarget.ecTarget.target.registry.surname}" size="64">
		<f:validateLength minimum="1" maximum="64" />
	</aon:inputText>

	<aon:outputLabel for="Registry_alias"
		value="#{bundle.aon_company_alias}" />
	<aon:inputText id="Registry_alias" maxlength="32"
		value="#{shoppingCart.cartTarget.ecTarget.target.registry.alias}" size="32">
		<f:validateLength minimum="1" maximum="32" />
	</aon:inputText>

	<aon:outputLabel for="Target_advertising"
		value="#{commercialBundle.commercial_target_advertising}" />
	<aon:selectOneMenu id="Target_advertising" required="true"
		value="#{shoppingCart.cartTarget.ecTarget.target.advertising}">
		<f:selectItem itemLabel="-" value="#{null}" />
		<f:selectItems value="#{commercialCollections.advertisings}" />
	</aon:selectOneMenu>
	
	
					
					<rich:spacer height="20" />
					<rich:spacer height="20" />
					
					<aon:outputLabel for="Company_address"
						value="#{registryBundle.registry_address}" />
					<aon:div>
						<aon:div>
							<aon:inputText id="Company_address"
								value="#{shoppingCart.cartTarget.mainAddress.address}" size="64"
								maxlength="128" />
						</aon:div>
						<aon:div>
							<aon:inputText id="Company_address2"
								value="#{shoppingCart.cartTarget.mainAddress.address2}"
								size="64" maxlength="128" />
						</aon:div>
						<aon:div>
							<aon:inputText id="Company_address3"
								value="#{shoppingCart.cartTarget.mainAddress.address3}"
								size="64" maxlength="128" />
						</aon:div>
					</aon:div>
					<aon:outputLabel for="Company_address_city"
						value="#{registryBundle.registry_city}" />
					<aon:inputText id="Company_address_city"
						value="#{shoppingCart.cartTarget.mainAddress.city}" size="64"
						maxlength="64" />

					<aon:outputLabel for="Company_address_zip"
						value="#{registryBundle.registry_zip}" />
					<aon:inputText id="Company_address_zip"
						value="#{shoppingCart.cartTarget.mainAddress.zip}" size="32"
						maxlength="16" />

					<aon:outputLabel for="Company_address_geozone"
						value="#{registryBundle.registry_geozone}" />
					<aon:selectOneMenu id="Company_address_geozone"
						value="#{shoppingCart.cartTarget.mainAddress.geozone}">
						<f:selectItems value="#{geozoneCollections.geoTrees}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Company_telephone"
						value="#{registryBundle.registry_phone}" />
					<aon:inputText id="Company_telephone"
						value="#{shoppingCart.cartTarget.phone.value}" size="32"
						maxlength="64" />

					<aon:outputLabel for="Company_fax"
						value="#{registryBundle.registry_fax}" />
					<aon:inputText id="Company_fax"
						value="#{shoppingCart.cartTarget.fax.value}" size="32"
						maxlength="64" />

					<aon:outputLabel for="Company_email"
						value="#{registryBundle.registry_email}" />
					<aon:inputText id="Company_email"
						value="#{shoppingCart.cartTarget.email.value}" size="64"
						maxlength="64" onblur="toLowerCase(this);" />

					<aon:outputLabel for="Company_web"
						value="#{registryBundle.registry_web}" />
					<aon:inputText id="Company_web"
						value="#{shoppingCart.cartTarget.web.value}" size="64"
						maxlength="64" onblur="toLowerCase(this);" />
				</aon:panelGrid>

</ui:composition>
