<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	
<!--  
		SEARCH BOX
-->
		
		<aon:div id="search-box" styleClass="search-box">
			<aon:inputText id="Item_product_name"
				value="#{shopItemsSearch.search}" maxLength="64" />
			<aon:commandButton id="search_bottom" value="&#160;"
				styleClass="aon-icon-commandButton-right aon-icon-search"
				title="#{bundle.aon_search}" accesskey="#{bundle.aon_key_accept}"
				reRender="itemContent">
				<aon:actionListener method="#{shopItemsSearch.onSearch}" />
			</aon:commandButton>
		</aon:div>

<!--  
		LOGIN BOX
-->
		<aon:div id="login-box" styleClass="login-box">
			<aon:div id="login-box-header" styleClass="box-header">
				<aon:div id="login-box-icon" styleClass="login-box-header-icon"></aon:div>
				<aon:outputText value="#{ecommerceBundle.aon_acommerce_user_registry}" />
			</aon:div>
		
		
			<aon:panelGrid columns="2" dir="true" rendered="#{shop.logged}">
				<aon:outputLabel for="User" value="#{ecommerceBundle.aon_acommerce_user_registered}" />
				<aon:outputText id="User" value="#{userLogin.login}" />
			</aon:panelGrid>
			<aon:commandButton style="border-right:0;" 
				value="#{securityBundle.aon_login_user_logout}"
				action="#"
				rendered="#{shop.logged}"
				actionListener="#{userLogin.onLogout}"
				styleClass="aon-finding-toolbar-item aon-icon-accept">
				<!--  
					<aon:outputText value="#{securityBundle.aon_login_user_logout}" />
				-->
			</aon:commandButton>

			<aon:panelGrid columns="2" dir="true" rendered="#{! shop.logged}">
				<aon:outputLabel for="Login" value="#{ecommerceBundle.aon_acommerce_user_name}" />
				<aon:inputText id="Login" value="#{userLogin.login}" />

				<aon:outputLabel for="Password" value="#{ecommerceBundle.aon_acommerce_user_passwd}" />
				<aon:inputText id="Password" value="#{userLogin.password}" />
			</aon:panelGrid>
			<aon:commandButton id="login-buttom" 
				value="#{bundle.aon_accept}"
				action="#"
				rendered="#{! shop.logged}"
				styleClass="aon-finding-toolbar-item aon-icon-accept">
				<aon:actionListener method="#{userLogin.onLogin}" />
			</aon:commandButton>
		</aon:div>

<!--  
		LIST INFO BOX
-->
		<aon:div id="list-info-box" styleClass="list-info-box">
			<aon:div id="list-info-box-header" styleClass="box-header">
				<aon:div id="list-info-box-icon" styleClass="list-info-box-header-icon"></aon:div>
				<aon:outputText value="#{ecommerceBundle.aon_acommerce_cart_summary}" />
			</aon:div>
			
			<aon:panelGrid columns="2" dir="true">
				<aon:outputLabel for="cart_quantity" value="#{ecommerceBundle.aon_acommerce_list_size}" />
				<aon:outputText id="cart_quantity" value="#{shoppingCart.quantity}" />
	
				<aon:outputLabel for="cart_total" value="#{ecommerceBundle.aon_acommerce_total}" />
				<aon:outputText id="cart_total" value="#{shoppingCart.total}">
					<f:convertNumber pattern="#,##0.00" />
				 </aon:outputText>
			</aon:panelGrid>

			<aon:commandButton id="lateral-view" rendered="true"
				value="#{ecommerceBundle.aon_acommerce_view_cart}" 
				action="shop_from" immediate="true"
				styleClass="aon-finding-toolbar-item aon-icon-cart">
				<aon:actionListener method="#{shop.onViewCart}" />
			</aon:commandButton>
		</aon:div>

<!--  
		HELPDESK BOX
-->
		
		<aon:div id="helpdesk-box" styleClass="helpdesk-box">
			<aon:div id="helpdesk-box-header" styleClass="box-header">
				<aon:div id="helpdesk-box-icon" styleClass="helpdesk-box-header-icon"></aon:div>
				<aon:outputText value="#{ecommerceBundle.aon_acommerce_contact}" />
			</aon:div>
			
			<aon:panelGrid columns="2" dir="true">
				<aon:outputLabel value="Telefono: " />
				<aon:outputText value="999229119" />

				
			</aon:panelGrid>
				<aon:commandButton rendered="true"
					value="Formulario" 
					action="shop_from" immediate="true"
					styleClass="aon-finding-toolbar-item aon-icon-letter">
					<aon:actionListener method="#{shop.onViewCart}" />
				</aon:commandButton>

		</aon:div>

				value="#{ecommerceBundle.aon_acommerce_helpdesk}" 
				/>
		</aon:div>

</ui:composition>
