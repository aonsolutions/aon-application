<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="shopItemForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="Registry -i18-" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="aonToolbar-back" value="#{bundle.aon_back}"
						action="shop_form"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						immediate="true" accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				
				<aon:panel>
					<f:facet name="header">
						<aon:inputText value="Usuario registrado -i18n-" />
					</f:facet>
					<aon:panelGrid columns="2" dir="true">
						<aon:outputLabel for="Login" value="login -i18n-" />
						<aon:inputText id="Login" value="" size="64" />

						<aon:outputLabel for="Password" value="password -i18n-" />
						<aon:inputText id="Password" value="" size="64" />
					</aon:panelGrid>
					<aon:commandButton id="login-buttom" value="Aceptar -i18n-"
						action="new_registry_form"
						styleClass="aon-finding-toolbar-item aon-icon-accept">
						<!--  
						<aon:actionListener method="#{shopItem.addToCart}" />
						-->
					</aon:commandButton>
				</aon:panel>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panel>
					<f:facet name="header">
						<aon:inputText value="Registro de usuario -i18n-" />
					</f:facet>

					<aon:commandButton id="newUser-buttom" value="Nuevo usuario -i18n-"
						action="new_registry_form"
						styleClass="aon-finding-toolbar-item aon-icon-new">
						<aon:actionListener method="#{shoppingCart.onResetTarget}" />
					</aon:commandButton>

				</aon:panel>
			</aon:div>
			
		</aon:form>
	</ui:define>
</ui:composition>
