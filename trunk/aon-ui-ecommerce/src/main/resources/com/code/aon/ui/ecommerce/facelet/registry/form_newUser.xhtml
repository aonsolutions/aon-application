<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="shopItemForm">
			<!--  
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{ecommerceBundle.aon_acommerce_user_registry}" />
				<ui:define name="toolbarContent">
				</ui:define>
			</ui:decorate>
			-->
			
			<aon:div styleClass="menu" />

			<aon:div styleClass="aon-scroll-area">
				<aon:commandButton id="aonToolbar-back" value="#{bundle.aon_back}"
					action="shop_form"
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					immediate="true" accesskey="#{bundle.aon_key_cancel}" />
				<h:commandButton id="aonToolbar-accept"
					value="#{bundle.aon_accept}" action="paymethod_form"
					styleClass="aon-finding-toolbar-item aon-icon-accept"
					accesskey="#{bundle.aon_key_accept}"
					actionListener="#{shoppingCart.onAddTarget}" />

				<aon:panel>
					<f:facet name="header">
						<aon:outputText value="#{ecommerceBundle.aon_acommerce_user_registry}" />
					</f:facet>
					<aon:panelGrid columns="2">
						<aon:outputLabel for="ectarget_email" value="#{ecommerceBundle.aon_ecommerce_email}" />
						<aon:inputText id="ectarget_email" required="true"
							value="#{shoppingCart.cartTarget.ecTarget.login}" size="20" maxlength="48"/>
	
						<aon:outputLabel for="ectarget_password" value="#{bundle.aon_login_passwd}" />
						<aon:inputText id="ectarget_password" required="true"
							value="#{shoppingCart.cartTarget.ecTarget.password}" size="20"  maxlength="32"/>
					
					</aon:panelGrid>
					
					<ui:include
						src="/com/code/aon/ui/ecommerce/facelet/shop/cart/target/formContent.xhtml">
						<ui:param name="controller" value="#{shoppingCart}" />
					</ui:include>
				</aon:panel>
				
			</aon:div>
		</aon:form>
		
	</ui:define>
</ui:composition>
