<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="shopItemForm">
			<!--  
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarID" value="aonToolbar" />
				<ui:param name="toolbarTitle" value="#{ecommerceBundle.aon_acommerce_user_registry}" />
				<ui:define name="toolbarContent">
				</ui:define>
			</ui:decorate>
			-->

			<aon:div styleClass="aon-scroll-area">
				<aon:commandButton id="aonToolbar-back" value="#{bundle.aon_back}"
					action="shop_form"
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					immediate="true" accesskey="#{bundle.aon_key_cancel}" />
				<h:commandButton id="aonToolbar-accept"
					value="#{bundle.aon_accept}" action="cartOffer_form"
					styleClass="aon-finding-toolbar-item aon-icon-cancel"
					accesskey="#{bundle.aon_key_accept}"
					actionListener="#{shoppingCart.onAcceptTarget}" />

				<aon:panelGrid columns="2" dir="true">

					<ui:include
						src="/com/code/aon/ui/ecommerce/facelet/shop/cart/target/formContent.xhtml">
						<ui:param name="controller" value="#{shoppingCart}" />
					</ui:include>

					<aon:outputLabel for="Company_address"
						value="#{registryBundle.registry_address}" />
					<aon:div>
						<aon:div>
							<aon:inputText id="Company_address"
								value="#{shoppingCart.cartTarget.mainAddress.address}" size="64"
								maxlength="128" />
						</aon:div>
						<aon:div>
							<aon:inputText id="Company_address2"
								value="#{shoppingCart.cartTarget.mainAddress.address2}"
								size="64" maxlength="128" />
						</aon:div>
						<aon:div>
							<aon:inputText id="Company_address3"
								value="#{shoppingCart.cartTarget.mainAddress.address3}"
								size="64" maxlength="128" />
						</aon:div>
					</aon:div>
					<aon:outputLabel for="Company_address_city"
						value="#{registryBundle.registry_city}" />
					<aon:inputText id="Company_address_city"
						value="#{shoppingCart.cartTarget.mainAddress.city}" size="64"
						maxlength="64" />

					<aon:outputLabel for="Company_address_zip"
						value="#{registryBundle.registry_zip}" />
					<aon:inputText id="Company_address_zip"
						value="#{shoppingCart.cartTarget.mainAddress.zip}" size="32"
						maxlength="16" />

					<aon:outputLabel for="Company_address_geozone"
						value="#{registryBundle.registry_geozone}" />
					<aon:selectOneMenu id="Company_address_geozone"
						value="#{shoppingCart.cartTarget.mainAddress.geozone}">
						<f:selectItems value="#{geozoneCollections.geoTrees}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Company_telephone"
						value="#{registryBundle.registry_phone}" />
					<aon:inputText id="Company_telephone"
						value="#{shoppingCart.cartTarget.phone.value}" size="32"
						maxlength="64" />

					<aon:outputLabel for="Company_fax"
						value="#{registryBundle.registry_fax}" />
					<aon:inputText id="Company_fax"
						value="#{shoppingCart.cartTarget.fax.value}" size="32"
						maxlength="64" />

					<aon:outputLabel for="Company_email"
						value="#{registryBundle.registry_email}" />
					<aon:inputText id="Company_email"
						value="#{shoppingCart.cartTarget.email.value}" size="64"
						maxlength="64" onblur="toLowerCase(this);" />

					<aon:outputLabel for="Company_web"
						value="#{registryBundle.registry_web}" />
					<aon:inputText id="Company_web"
						value="#{shoppingCart.cartTarget.web.value}" size="64"
						maxlength="64" onblur="toLowerCase(this);" />


				</aon:panelGrid>
			</aon:div>
		</aon:form>
		
	</ui:define>
</ui:composition>
