<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="sellerViewList">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{statBundle.seller_stat_control}" />
				<ui:define name="beforeToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="commercial_search_view"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:htmlCommandLink id="export2excel" value="XLS"
						title="Listado Xls"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="sellersList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="export2csv" value="CSV" title="CSV"
						styleClass="aon-finding-toolbar-item aon-icon-csv"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="sellersList" />
						<f:param name="outputFormat" value="CSV" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="graph" 
						value="PDF" title="Listado Pdf"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						action="#{report.onExecute}" target="_blank">
						<f:param name="reportKey" value="sellersList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
						
				</ui:define>
			</ui:decorate>
			<br/>
			<aon:div style="text-align:center;font-weight:bold ">

				<aon:outputText value="#{commercialStat.params.fromDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:outputText value="-" />
				<aon:outputText value="#{commercialStat.params.toDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>

			</aon:div>
			<aon:div styleClass="aon-scroll-area">
				<aon:editDataTable id="sellerView"
					value="#{commercialStat.summaryModel}" rows="20"
					columnClasses="aon-editDataTable-textColumn,aon-editDataTable-numberColumn,  aon-editDataTable-numberColumn, aon-editDataTable-numberColumn,aon-editDataTable-numberColumn,aon-editDataTable-numberColumn,aon-editDataTable-textColumn"
					var="to">
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{statBundle.stat_seller}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{statBundle.seller_stat_control_visit}" />
						</f:facet>
						<aon:outputText value="#{to.numVisits}" />
						<f:facet name="footer">
							<aon:outputText value="#{commercialStat.numVisitsTot}" style="float:right" />
						</f:facet>
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{statBundle.seller_stat_control_pending_visit}" />
						</f:facet>
						<aon:outputText value="#{to.numPendingVisits}" />
						<f:facet name="footer">
							<aon:outputText value="#{commercialStat.numPendingVisitsTot}" style="float:right" />
						</f:facet>
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{statBundle.seller_stat_control_offers}" />
						</f:facet>
						<aon:outputText value="#{to.numOffers}" />
						<f:facet name="footer">
							<aon:outputText value="#{commercialStat.numOffersTot}" style="float:right" />
						</f:facet>
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{statBundle.seller_stat_control_closed_offers}" />
						</f:facet>
						<aon:outputText value="#{to.numAprovedOffers}" />
						<f:facet name="footer">
							<aon:outputText value="#{commercialStat.numAprovedOffersTot}"  style="float:right"/>
						</f:facet>
					</aon:column>
					<aon:column>
						<f:facet name="header">
							<aon:outputText
								value="#{statBundle.seller_stat_control_lost_offers}"  />
						</f:facet>
						<aon:outputText value="#{to.numLostOffers}" />
						<f:facet name="footer">
							<aon:outputText value="#{commercialStat.numLostOffersTot}"  style="float:right"/>
						</f:facet>
					</aon:column>
					<aon:column>
						<f:facet name="header">

						</f:facet>
						<aon:htmlCommandLink styleClass="aon-dataTable-link-noicon"
							actionListener="#{commercialStat.onSellerDetail}"
							action="commercial_seller_stat"
							value="#{statBundle.stat_show_detail}"></aon:htmlCommandLink>
					</aon:column>
				</aon:editDataTable>
				<aon:dataScroller2 for="sellerView" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
