<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<h:panelGrid columns="2"
		columnClasses="aon-width-400
						 		,aon-width-400 aon-vertical-align-top
						 		,aon-width-auto aon-vertical-align-top">

		<aon:div styleClass="aon-width-all aon-text-center">
			<a4j:mediaOutput element="img" cacheable="false" session="false"
				createContent="#{projectStat.paintPieChart}" mimeType="image/jpeg">
				<!-- Se agrega este param para que no cachee el resultado -->
				<f:param name="value" value="#{projectStat.lastModified}" />
			</a4j:mediaOutput>
		</aon:div>

		<aon:div styleClass="aon-width-all">
			<aon:panelGrid columns="2" styleClass="aon-width-400"
				columnClasses="aon-panelGrid-odd aon-width-200 aon-text-right
												,aon-panelGrid-even aon-width-auto aon-text-right">
	
				<aon:outputText value="#{statBundle.stat_offer_amount}" />
				<aon:outputText value="#{projectStat.totalOffered}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				
				<aon:outputText value="&#160;" />
				<aon:outputText value="&#160;" />
	
				<aon:outputText value="#{statBundle.stat_income_amount}" />
				<aon:outputText value="#{projectStat.totalSales}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
	
				<aon:outputText value="#{statBundle.stat_cost_amount}" />
				<aon:outputText value="#{projectStat.totalCosts}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
	
				<aon:outputText value="#{statBundle.stat_result}" />
				<aon:outputText value="#{projectStat.totalResult}"
					styleClass="aon-bold"
					style="#{projectStat.totalResult lt -0?'color:red;':'color:blue;'}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:panelGrid>			
	
			<aon:panelGrid columns="2" styleClass="aon-width-400 aon-margin-top"
				columnClasses="aon-panelGrid-odd aon-width-200 aon-text-right
												,aon-panelGrid-even aon-width-auto aon-text-right">
				<f:facet name="header">
					<aon:outputText value="Desglose de Costos" />	
				</f:facet>
				<aon:outputText value="#{statBundle.stat_invoice_cost_amount}" />
				<aon:outputText value="#{projectStat.totalInvoiceCosts}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
	
				<aon:outputText value="#{statBundle.stat_labour_amount}" />
				<aon:outputText value="#{projectStat.totalLabour}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
			</aon:panelGrid>
		</aon:div>

		<aon:panelGrid columns="2" styleClass="aon-width-all"
			columnClasses="aon-panelGrid-odd aon-width-auto aon-text-right
						  ,aon-panelGrid-even aon-width-100 aon-text-right">

			<aon:outputText value="% Diferencia s/Presupuesto" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalSales * 100 / projectStat.totalOffered}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>

			<aon:outputText value="&#160;" />
			<aon:outputText value="&#160;" />

			<aon:outputText value="% Beneficio s/ Ingresos" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalResult * 100 / projectStat.totalSales}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>

			<aon:outputText value="% Beneficio s/ Costos" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalResult * 100 / projectStat.totalCosts}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>

			<aon:outputText value="&#160;" />
			<aon:outputText value="&#160;" />

			<aon:outputText value="% Mano de obra s/ Ingresos" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalLabour * 100 / projectStat.totalSales}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>

			<aon:outputText value="% Gastos y Compras s/ Ingresos" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalInvoiceCosts * 100 / projectStat.totalSales}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>
			
			<aon:outputText value="% Costo s/ Ingresos" />
			<aon:panelGroup>
				<aon:outputText value="#{projectStat.totalCosts * 100 / projectStat.totalSales}">
					<f:convertNumber pattern="#{bundle.aon_percent_pattern}" />
				</aon:outputText>
				<aon:outputText value="&#160;%" />
			</aon:panelGroup>
		</aon:panelGrid>
		
		<aon:div styleClass="aon-width-all aon-text-center">
			<a4j:mediaOutput element="img" cacheable="false" session="false"
				createContent="#{projectStat.paintBarChart}" mimeType="image/jpeg">
				<!-- Se agrega este param para que no cachee el resultado -->
				<f:param name="value" value="#{projectStat.lastModified}" />
			</a4j:mediaOutput>
		</aon:div>
	</h:panelGrid>
</ui:composition>
