<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbarEx.xhtml">
				
				<c:if test="#{stat.invoiceType==1}">
					<ui:param name="toolbarTitle" value="#{statBundle.stat_abc_customer}" />
				</c:if>
				<c:if test="#{stat.invoiceType==0}">
					<ui:param name="toolbarTitle" value="#{statBundle.stat_abc_supplier}" />
				</c:if>
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{stat.onCustomerAbcStats}" type="actionListener" />
					<aon:methodParam name="searchAction" value="abc_customer_stats" />

					<aon:outputLabel for="entryDate-From"
						value="#{bundle.aon_date_from}" />
					<aon:panelGrid columns="3">
						<aon:selectInputDate id="entryDate-From"
							value="#{stat.params.fromDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />

						<aon:outputLabel for="entryDate-To" value="#{bundle.aon_date_to}" />
						<aon:selectInputDate id="entryDate-To"
							value="#{stat.params.toDate}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}" />
					</aon:panelGrid>

				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
