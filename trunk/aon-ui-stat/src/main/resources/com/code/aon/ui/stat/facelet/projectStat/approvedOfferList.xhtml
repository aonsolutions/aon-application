<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:dataTable id="approvedOfferDataList" value="#{projectStat.approvedOfferModel}"
		rows="20" var="to"
		columnClasses="aon-editDataTable-dateColumn,aon-editDataTable-textColumn, 
						aon-editDataTable-textColumn,aon-editDataTable-textColumn,
						aon-editDataTable-numberColumn">

		<aon:column 
			styleClass="aon-editDataTable-textColumn">
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_date}" />
			</f:facet>
			<h:outputText value="#{to.issueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</h:outputText>
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<h:outputText value="#{bundle.aon_series}/#{bundle.aon_number}" />
			</f:facet>
			<aon:outputText value="#{to.referenceCode}" />
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{statBundle.stat_seller}" />
			</f:facet>
			<aon:outputText value="#{to.seller.registry.name}" />
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{statBundle.stat_workplace}" />
			</f:facet>
			<aon:outputText value="#{to.workPlace.description}" />
		</aon:column>

		<aon:column>
			<f:facet name="header">
				<aon:outputText value="#{bundle.aon_total}" />
			</f:facet>
			<aon:outputText value="#{projectStat.approvedOfferTotal}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:column>

	</aon:dataTable>
	<aon:dataScroller2 for="approvedOfferDataList" showNote="true" />
</ui:composition>
