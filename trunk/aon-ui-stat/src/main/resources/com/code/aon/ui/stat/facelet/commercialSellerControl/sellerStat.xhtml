<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml"
	xmlns:a4j="http://richfaces.org/a4j">
	<ui:define name="content">
		<aon:form id="records">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{statBundle.stat_show_seller}" />
				<ui:define name="beforeToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="commercial_seller_search"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />

					<c:if test="#{commercialStat.controlType==0}">
						<aon:commandButton value="#{statBundle.seller_stat_control}"
							action="commercial_seller_view"
							actionListener="#{commercialStat.onSummary}"
							styleClass="aon-finding-toolbar-item aon-icon-visit" />
					</c:if>
					<c:if test="#{commercialStat.controlType==1}">
						<aon:commandButton value="#{statBundle.seller_stat_control}"
							action="commercial_seller_view"
							actionListener="#{commercialStat.onTargetSummary}"
							styleClass="aon-finding-toolbar-item aon-icon-visit" />
					</c:if>
					<c:if test="#{commercialStat.controlType==2}">
						<aon:commandButton value="#{statBundle.seller_stat_control}"
							action="commercial_seller_view"
							actionListener="#{commercialStat.onProductSummary}"
							styleClass="aon-finding-toolbar-item aon-icon-visit" />
					</c:if>


				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">


				<aon:panelGrid columns="2">

					<c:if test="#{commercialStat.controlType==0}">
						<aon:outputLabel for="Target_trackings_seller_id"
							value="#{salesBundle.sales_seller}" />
						<aon:outputText value="#{commercialStat.seller.registry.fullName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==1}">
						<aon:outputLabel for="Target_trackings_seller_id"
							value="#{salesBundle.sales_seller}" />
						<aon:outputText value="#{commercialStat.seller.registry.fullName}"></aon:outputText>

					</c:if>
					<c:if test="#{commercialStat.controlType==2}">
						<aon:outputLabel for="Target_trackings_seller_id"
							value="#{salesBundle.sales_seller}" />
						<aon:outputText value="#{commercialStat.product.name}"></aon:outputText>

					</c:if>

					<aon:outputLabel for="Target_trackings_seller_id"
						value="#{statBundle.stat_period}" />
					<aon:div style="text-align:center;font-weight:bold ">
						<aon:outputText value="#{commercialStat.params.fromDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:outputText value="-" />
						<aon:outputText value="#{commercialStat.params.toDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:div>
				</aon:panelGrid>

				<aon:div>
					<h:panelGrid columns="2">

						<aon:div>
							<aon:panel style="height:100px;width:200;px"
								header="#{statBundle.seller_stat_control_vis}">
								<aon:panelGrid columns="2">
									<aon:outputLabel value="#{statBundle.seller_stat_control_done}" />
									<aon:outputText value="#{commercialStat.numVisits}" size="30"
										disabled="true" />
									<aon:outputLabel
										value="#{statBundle.seller_stat_control_pending}" />
									<aon:outputText value="#{commercialStat.numPendingVisits}"
										size="30" disabled="true" />
								</aon:panelGrid>
							</aon:panel>
						</aon:div>
						<aon:div>
							<aon:panel style="height:100px;width:200;px"
								header="#{statBundle.seller_stat_control_pre}">
								<aon:panelGrid columns="2">
									<aon:outputLabel value="#{statBundle.seller_stat_control_done}" />
									<aon:outputText value="#{commercialStat.numOffers}" size="30"
										disabled="true" />
									<aon:outputLabel
										value="#{statBundle.seller_stat_control_pending}" />
									<aon:outputText value="#{commercialStat.numPendingOffers}"
										size="30" disabled="true" />
									<aon:outputLabel
										value="#{statBundle.seller_stat_control_closed}" />
									<aon:outputText value="#{commercialStat.numAprovedOffers}"
										size="30" disabled="true" />
									<aon:outputLabel value="#{statBundle.seller_stat_control_lost}" />
									<aon:outputText value="#{commercialStat.numLostOffers}"
										size="30" disabled="true" />

								</aon:panelGrid>
							</aon:panel>
						</aon:div>
					</h:panelGrid>
				</aon:div>

				<aon:panelTabSet switchType="client">
					<aon:panelTab id="tab1"
						label="#{statBundle.seller_stat_control_visit}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/visitsList.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab2" label="Visitas Pendientes">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/pendingVisitsList.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab3"
						label="#{statBundle.seller_stat_control_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/doneOfferslist.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab4"
						label="#{statBundle.seller_stat_control_pending_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/pendingOfferslist.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab5"
						label="#{statBundle.seller_stat_control_closed_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/closedOfferslist.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab6"
						label="#{statBundle.seller_stat_control_lost_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/lostOfferslist.xhtml" />
					</aon:panelTab>
					<!-- <aon:panelTab id="tab5" label="#{statBundle.seller_stat_control_ratio}">
						
					</aon:panelTab> -->
				</aon:panelTabSet>
			</aon:div>

		</aon:form>
	</ui:define>
</ui:composition>
