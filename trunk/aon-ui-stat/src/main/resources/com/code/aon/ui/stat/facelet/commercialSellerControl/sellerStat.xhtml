<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml"
	xmlns:a4j="http://richfaces.org/a4j">
	<ui:define name="content">
		<aon:form id="records">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{statBundle.stat_show_seller}" />
				<ui:define name="beforeToolbarContent">
					<aon:commandButton value="#{bundle.aon_back}"
						action="commercial_seller_search"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_cancel}" />
					<aon:commandButton value="#{statBundle.seller_stat_control}"
						action="commercial_seller_view"
						styleClass="aon-finding-toolbar-item aon-icon-visit" />
					
				</ui:define>
			</ui:decorate>
			<aon:div styleClass="aon-scroll-area">

				<aon:div>
					<aon:div style="text-align:center;font-weight:bold ">

						<aon:outputText value="#{commercialStat.params.fromDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
						<aon:outputText value="-" />
						<aon:outputText value="#{commercialStat.params.toDate}">
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>

					</aon:div>

					<aon:panel height="60" style="width: 20%;"
						header="#{commercialStat.seller.registry.fullName}">
						<aon:panelGrid columns="2">
							<aon:outputLabel value="#{statBundle.seller_stat_control_visit}" />
							<aon:outputText value="#{commercialStat.numVisits}" size="30"
								disabled="true" />

							<aon:outputLabel
								value="#{statBundle.seller_stat_control_pending_visit}" />
							<aon:outputText value="#{commercialStat.numPendingVisits}"
								size="30" disabled="true" />

							<aon:outputLabel value="#{statBundle.seller_stat_control_offers}" />
							<aon:outputText value="#{commercialStat.numOffers}" size="30"
								disabled="true" />


							<aon:outputLabel
								value="#{statBundle.seller_stat_control_closed_offers}" />
							<aon:outputText value="#{commercialStat.numAprovedOffers}"
								size="30" disabled="true" />


							<aon:outputLabel
								value="#{statBundle.seller_stat_control_lost_offers}" />
							<aon:outputText value="#{commercialStat.numLostOffers}" size="30"
								disabled="true" />
						</aon:panelGrid>
					</aon:panel>


				</aon:div>


				<aon:panelTabSet switchType="client">
					<aon:panelTab id="tab1"
						label="#{statBundle.seller_stat_control_visit}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/visitsList.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab2" label="Visitas Pendientes">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/pendingVisitsList.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab3"
						label="#{statBundle.seller_stat_control_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/doneOfferslist.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab4"
						label="#{statBundle.seller_stat_control_closed_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/closedOfferslist.xhtml" />
					</aon:panelTab>
					<aon:panelTab id="tab5"
						label="#{statBundle.seller_stat_control_lost_offers}">
						<ui:include
							src="/com/code/aon/ui/stat/facelet/commercialSellerControl/lostOfferslist.xhtml" />
					</aon:panelTab>
					<!-- <aon:panelTab id="tab5" label="#{statBundle.seller_stat_control_ratio}">
						
					</aon:panelTab> -->
				</aon:panelTabSet>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
