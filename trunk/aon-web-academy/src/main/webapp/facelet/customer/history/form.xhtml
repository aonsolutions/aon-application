<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="historyForm">

			<t:div id="aon-content-menu" styleClass="aon-content-menu-aux" forceId="#{true}" style="margin-left:16px;margin-right:16px;">
				<h:outputText
					value="#{customer.to.registry.name} #{customer.to.registry.surname}, #{customerBundle.customer_document}: #{customer.to.registry.document}" />
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal" style="padding-top:0">

					<t:div styleClass="aon-content-menu" rendered="#{!customer.new}"
						id="aon-content-menu" forceId="#{true}">
						<t:panelGrid columns="7" cellpadding="0" cellspacing="0"
							border="0">
							<t:panelGroup>
								<t:commandLink id="customer_data" forceId="#{true}"
									value="#{appBundle.aon_alumn_data}" action="customer_form"
									styleClass="aon-content-menu-item" visibleOnUserRole="AlumnosDatosAlumno"/>
							</t:panelGroup>
							<t:panelGroup>						
								<t:commandLink id="personal_data" value="#{appBundle.aon_personal_data}" 
									action="personal_data" styleClass="aon-content-menu-item" visibleOnUserRole="AlumnosDatosPersonales"/>					
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="economic_data" forceId="#{true}" value="#{appBundle.aon_economic_data}"
									actionListener="#{customerFee.onCustomerFee}" action="economic_data" 
									styleClass="aon-content-menu-item" visibleOnUserRole="AlumnosDatosEconomicos"/>
							</t:panelGroup>
							<t:panelGroup>
								<t:commandLink id="customer_rnote" forceId="#{true}"
									value="#{appBundle.aon_monitoring}" visibleOnUserRole="AlumnosSeguimiento"
									actionListener="#{rnote.onSearch}" action="rnote"
									styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup rendered="#{customer.naturalType}">
								<t:commandLink id="customer_relationship" forceId="#{true}"
									value="#{appBundle.aon_rRelationship}" visibleOnUserRole="AlumnosRelaciones"
									actionListener="#{rRelationship.onSearch}"
									action="rrelationship" styleClass="aon-content-menu-item" />
							</t:panelGroup>
							<t:panelGroup rendered="#{customer.naturalType}">
								<t:commandLink id="customer_absence" forceId="#{true}" value="#{appBundle.absence_absences}"
									action="absence" styleClass="aon-content-menu-item" visibleOnUserRole="AlumnosAusencias"/>
							</t:panelGroup>	
							<t:panelGroup rendered="#{customer.naturalType}">
								<t:commandLink id="customer_history"
									value="#{appBundle.aon_history}" forceId="#{true}"
									styleClass="aon-content-menu-item-active" visibleOnUserRole="AlumnosHistorial"/>
							</t:panelGroup>	
						</t:panelGrid>
					</t:div>
					
					<t:panelTabbedPane styleClass="aon-tabpanel" id="historyTab"
						activeTabStyleClass="aon-tabpanel-active"
						inactiveTabStyleClass="aon-tabpanel-inactive"
						serverSideTabSwitch="true">

						<t:panelTab id="academic" label="#{appBundle.aon_history_academic}">
							<ui:include src="/facelet/customer/academic_data/grid.xhtml">
								<ui:param name="modelAlias" value="#{alumnCourse.inactiveCourseModel}"/>
								<ui:param name="editMode" value="#{false}"/>
							</ui:include>

							<ui:include src="/facelet/customer/loan/grid.xhtml">
								<ui:param name="modelAlias" value="#{alumnLoan.allLoanModel}"/>
								<ui:param name="editMode" value="#{false}"/>
							</ui:include>
						</t:panelTab>

						<t:panelTab id="administrative" label="#{appBundle.aon_history_administrative}">
							<ui:include src="/facelet/customer/invoice/grid.xhtml" />

							<ui:include src="/facelet/customer/finance/grid.xhtml" />
						</t:panelTab>
					</t:panelTabbedPane>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
