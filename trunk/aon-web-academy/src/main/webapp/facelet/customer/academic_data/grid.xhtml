<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition>

	<t:div styleClass="aon-form-group" rendered="#{!customer.new}">
		<t:div styleClass="aon-form-group-title">
			<t:outputLabel for="courseInstructorDataTable"
				value="#{appBundle.course_courses}" />
		</t:div>

		<t:div styleClass="aon-form-group-body">
			<t:dataTable id="alumnCourseDataList" value="#{alumnCourse.model}"
				rows="20" var="to" rowIndexVar="rowIndex"
				rowOnMouseOver="selectRow( this )"
				rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
				styleClass="aon-edit-table" headerClass="aon-edit-table-header"
				footerClass="aon-edit-table-footer"
				rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
				columnClasses="aon-edit-table-body aon-edit-table-body-icon, 
					aon-edit-table-body aon-edit-table-body-string,
					aon-edit-table-body aon-edit-table-body-buttons">

				<t:column width="40">
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<t:commandLink immediate="#{true}"
						styleClass="aon-table-row-selected"
						rendered="#{to.id!=alumnCourse.to.id}"
						actionListener="#{alumnCourse.onSelect}" />
					<f:verbatim>&#160;</f:verbatim>
					<f:facet name="footer">
						<t:div>
							<t:commandButton id="reset" alt="[#{bundle.aon_reset}]"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
								actionListener="#{alumnCourse.onReset}"
								rendered="#{!alumnCourse.new}" value=""
								accesskey="#{bundle.aon_key_new_line}">
							</t:commandButton>
						</t:div>
					</f:facet>
				</t:column>

				<t:column>
					<f:facet name="header">
						<t:outputText value="#{appBundle.course_course}" />
					</f:facet>
					<t:outputText value="#{to.course.code}  #{to.course.description}"
						rendered="#{!alumnCourse.new}" />
					<f:facet name="footer">
						<t:div rendered="#{alumnCourse.new}">
							<t:selectOneMenu id="Course_Lookup_academicYear-New" forceId="#{true}"
								value="#{alumnCourse.to.course.academicYear.id}"
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','courseLookup','Course_Lookup_academicYear-New,Course_Lookup_code-New','Course_id|Course_Lookup_id-New,Course_description|Course_Lookup_description-New,Course_academicYear_id|Course_Lookup_academicYear-New,Course_code|Course_Lookup_code-New');"								
								styleClass="aon-form-selectOneMenu-field">
								<f:selectItems value="#{academyCollections.academicYears}" />
							</t:selectOneMenu>
							<t:inputText id="Course_Lookup_code-New" size="5" forceId="#{true}"
								styleClass="aon-form-input-text"
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','courseLookup','Course_Lookup_academicYear-New,Course_Lookup_code-New','Course_id|Course_Lookup_id-New,Course_description|Course_Lookup_description-New,Course_academicYear_id|Course_Lookup_academicYear-New,Course_code|Course_Lookup_code-New');"
								value="#{alumnCourse.to.course.code}" />
							<h:commandButton id="find_Course_Lookup_id-New"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								onclick="lookupSearchWindow(this, 'placeList', '#{courseLookup.encodedSearchPagePath}','Course_id|Course_Lookup_id-New,Course_description|Course_Lookup_description-New,Course_academicYear_id|Course_Lookup_academicYear-New,Course_code|Course_Lookup_code-New');return false;" />
							<t:inputHidden id="Course_Lookup_id-New" forceId="#{true}"
								value="#{alumnCourse.to.course.id}" required="true"/>
							<t:inputText id="Course_Lookup_description-New" forceId="#{true}"
								styleClass="aon-form-input-text-disabled"
								value="#{alumnCourse.to.course.description}"
								disabled="true"	size="30" />
						</t:div>
					</f:facet>
				</t:column>
				
				<t:column>
					<f:facet name="header">
						<f:verbatim>&#160;</f:verbatim>
					</f:facet>
					<t:commandButton title="#{bundle.aon_cancel}"
						actionListener="#{alumnCourse.onCancel}" immediate="#{true}"
						onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
						styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
						value="" accesskey="#{bundle.aon_key_cancel_line}"
						rendered="#{to.id==alumnCourse.to.id}" />
					<t:commandButton title="#{bundle.aon_remove}"
						actionListener="#{alumnCourse.onRemove}"
						onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
						styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
						value="" accesskey="#{bundle.aon_key_remove_line}"
						rendered="#{to.id==alumnCourse.to.id}" />
					<f:verbatim rendered="#{to.id!=alumnCourse.to.id}">&#160;</f:verbatim>
					<f:facet name="footer">
						<t:div>
							<f:verbatim rendered="#{!alumnCourse.new}">&#160;</f:verbatim>
							<t:commandButton title="#{bundle.aon_accept}"
								actionListener="#{alumnCourse.onAccept}"
								onclick="return (confirm('#{bundle.aon_accept_confirm}'));"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
								value="" accesskey="#{bundle.aon_key_save_line}"
								rendered="#{alumnCourse.new}" />
							<t:commandButton title="#{bundle.aon_cancel}"
								actionListener="#{alumnCourse.onCancel}" immediate="#{true}"
								onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
								styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
								value="" accesskey="#{bundle.aon_key_cancel_line}"
								rendered="#{alumnCourse.new}" />
						</t:div>
					</f:facet>
				</t:column>

			</t:dataTable>

			<ui:include src="/facelet/shared/dataScroller.xhtml">
				<ui:param name="dataTable" value="alumnCourseDataList" />
				<ui:param name="model" value="#{alumnCourse.model}" />
				<ui:param name="showNote" value="#{false}" />
			</ui:include>

		</t:div>
	</t:div>

</ui:composition>
</body>
</html>
