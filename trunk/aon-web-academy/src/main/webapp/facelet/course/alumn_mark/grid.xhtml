<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="courseAlumnMarkList">
		
			<t:div id="aon-content-menu" styleClass="aon-content-menu-aux"
				forceId="#{true}" >
				<h:outputText
					value="#{appBundle.course_code} #{course.to.code}, #{course.to.courseSubject.description} #{course.to.courseLevel.description} #{course.to.academicYear.description}" />
			</t:div>
			
			<t:div styleClass="aon-content-menu" rendered="#{!customer.new}" id="aon-content-menu" forceId="#{true}">
				<t:panelGrid columns="7" cellpadding="0" cellspacing="0" border="0">
					<t:panelGroup>						
						<t:commandLink id="course_data" value="#{appBundle.course_course}" 
							action="course_form" styleClass="aon-content-menu-item"	visibleOnUserRole="GruposGrupo"/>
					</t:panelGroup>
					<t:panelGroup>						
						<t:commandLink id="academicSkill_data" value="#{appBundle.academicSkill_academicSkills}" 
							actionListener="#{courseAcademicSkill.onSearch}"
							action="course_academicSkill_data" visibleOnUserRole="GruposHabilidades"
							styleClass="aon-content-menu-item"	/>					
					</t:panelGroup>
					<t:panelGroup>						
						<t:commandLink id="alumn_data" value="#{appBundle.aon_alumns}" 
							action="course_alumn_data" visibleOnUserRole="GruposAlumnos"
							styleClass="aon-content-menu-item"	/>					
					</t:panelGroup>
					<t:panelGroup>						
						<t:commandLink id="alumn_absence_data" value="#{appBundle.absence_absences}" 
							actionListener="#{courseAlumnAbsence.onSearch}" 
							action="course_alumn_absence_data" visibleOnUserRole="GruposAusencias"
							styleClass="aon-content-menu-item"	/>					
					</t:panelGroup>
					<t:panelGroup>						
						<t:commandLink id="evaluation_data" 
							value="#{appBundle.course_evaluation}" 
							action="course_evaluation_data" visibleOnUserRole="GruposVCalidad"
							styleClass="aon-content-menu-item"	/>					
					</t:panelGroup>
					<t:panelGroup>						
						<t:commandLink id="course_mark_data" 
							value="#{appBundle.aon_mark_data}" 
							action="course_mark_data" visibleOnUserRole="GruposCalificaciones"
							actionListener="#{courseMark.onSearch}" 
							styleClass="aon-content-menu-item"	/>					
					</t:panelGroup>
					<t:panelGroup>						
						<t:commandLink id="alumn_mark_data" value="#{appBundle.mark_print}" 
							styleClass="aon-content-menu-item-active" visibleOnUserRole="GruposObservaciones"/>					
					</t:panelGroup>
				</t:panelGrid>
			</t:div>

			<!--  toolbar navigation -->
			<t:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<t:commandLink id="alumnMarkList" value="#{bundle.aon_report}"
						forceId="#{true}"  target="_new"
						action="#{courseAlumnMark.onExecute}"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
						accesskey="#{bundle.aon_key_print}" />
					<t:outputLabel for="Encoded_marks"
						styleClass="aon-form-input-text-label"
						value="#{appBundle.mark_encoded}" />
					<h:selectBooleanCheckbox 
						styleClass="aon-form-selectBooleanCheckbox-field"
						id="Encoded_marks" 
						value="#{markPrinter.encodedMarks}"/>		
				</t:div>
				</t:div>
			</t:div>

			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">

					<t:div styleClass="aon-form-note">
						<t:div styleClass="aon-form-note-internal">
							<t:panelGrid columns="1" width="95%">
								<t:div styleClass="aon-text-outstanding">
									<t:outputText rendered="#{courseAlumnMark.to != null}" style="font-style:italic;padding-right:1em;font-weight:normal;"
										value="#{courseAlumnMark.to.customer.registry.name} #{courseAlumnMark.to.customer.registry.surname}" />
									<h:outputText value="#{appBundle.mark_evaluation}: " />
									<t:outputText value="#{courseAlumnMark.evaluation}" />
								</t:div>
								<t:div>
									<t:inputText value="#{courseAlumnMark.evaluation}" 
										styleClass="aon-form-input-text" 
										size="4" maxlength="2"
										required="#{true}">
										<f:validateLongRange minimum="0" maximum="12"/>
									</t:inputText>
									<t:commandButton id="evalcahnge" 
										value="#{appBundle.evaluation_change}"
										actionListener="#{courseAlumnMark.onRefreshAll}"
										styleClass="aon-form-button" />
								</t:div>
							</t:panelGrid>
						</t:div>
					</t:div>

					
					<h:panelGrid columns="2" cellpadding="5" cellspacing="5"
						style="width:100%">

						<t:div>
																		
							<t:dataTable id="courseAlumnMarkDataTable"
								value="#{courseAlumnMark.model}" var="to"
								rowOnClick="sendRow( this )"
								rowOnMouseOver="selectRow( this )"
								rowOnMouseOut="unselectRow( this )" 
								styleClass="aon-edit-table" headerClass="aon-edit-table-header"
								footerClass="aon-edit-table-footer" rows="20" rowIndexVar="rowIndex"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body aon-edit-table-body-string">
				
								<h:column>
									<f:facet name="header">
										<h:outputText value="#{appBundle.course_alumn}" />
									</f:facet>
									<t:commandLink immediate="#{true}"
										styleClass="aon-table-row-selected"
										actionListener="#{courseAlumnMark.onSelect}">
									</t:commandLink>
									<h:outputText value="#{to.customer.registry.surname}, " rendered="#{to.customer.registry.surname != null and to.customer.registry.surname != ''}"/>								
									<h:outputText value="#{to.customer.registry.name}" />
								</h:column>
				
							</t:dataTable>
	
							<ui:include src="/facelet/shared/dataScroller.xhtml">
								<ui:param name="dataTable" value="courseAlumnMarkDataTable" />
								<ui:param name="model" value="#{courseAlumnMark.model}" />
								<ui:param name="showNote" value="#{false}" />
							</ui:include>
					
						</t:div>

						<t:div>
							
							<t:dataTable id="evaluation_observationDataList" value="#{evaluation_observation.model}" 
								var="to_evaluation_observation" rowIndexVar="rowIndex_observation"
								rowOnMouseOver="selectRow( this )"
								rowOnMouseOut="unselectRow( this )" 
								rowOnClick="sendRow( this )"
								rows="20" 
								rendered="#{courseAlumnMark.to != null}"
								styleClass="aon-edit-table" 
								headerClass="aon-edit-table-header" 
								footerClass="aon-edit-table-footer"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body aon-edit-table-body-icon,
								aon-edit-table-body aon-edit-table-body-string,
								aon-edit-table-body aon-edit-table-body-buttons">
	
								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<f:verbatim>&#160;</f:verbatim>
									<t:commandLink immediate="#{true}"
										rendered="#{to_evaluation_observation!=evaluation_observation.to}"
										styleClass="aon-table-row-selected"
										actionListener="#{evaluation_observation.onSelect}">
									</t:commandLink>
									<f:facet name="footer">
										<t:div>
											<t:commandButton id="reset"
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
												value="" immediate="#{true}" rendered="#{!evaluation_observation.new}"
												actionListener="#{evaluation_observation.onReset}"
												accesskey="#{bundle.aon_key_new_line}">
											</t:commandButton>
										</t:div>
									</f:facet>
								</h:column>
	
								<h:column>
									<f:facet name="header">
										<h:outputText value="#{appBundle.evaluation_observation_comment}" />
									</f:facet>
									<h:outputText value="#{to_evaluation_observation.commentsHead}" 
										rendered="#{to_evaluation_observation!=evaluation_observation.to}" />
									<t:inputText 
										id="Observation_Lookup_id"
										forceId="#{true}"
										rendered="#{to_evaluation_observation==evaluation_observation.to}" 
										styleClass="aon-form-input-text"
										onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','observationLookup','Observation_Lookup_id[#{rowIndex_observation}]','Observation_Lookup_id|Observation_Lookup_id[#{rowIndex_observation}],Observation_Lookup_description|Observation_Lookup_description[#{rowIndex_observation}]');"
										size="5" />
									<h:commandButton id="find_Observation_Lookup_id"
										rendered="#{to_evaluation_observation==evaluation_observation.to}" 
										styleClass="aon-form-lookup-button" value="" immediate="true"
										onclick="lookupSearchWindow(this, 'placeList', '#{observationLookup.encodedSearchPagePath}','Observation_Lookup_id|Observation_Lookup_id[#{rowIndex_observation}],Observation_Lookup_description|Observation_Lookup_description[#{rowIndex_observation}]');return false;" />	
									<t:inputTextarea
										id="Observation_Lookup_description"
										forceId="#{true}"
										rendered="#{to_evaluation_observation==evaluation_observation.to}" 
										styleClass="aon-form-input-text"
										cols="50" rows="5"
										value="#{evaluation_observation.to.comments}" required="#{true}" />
									<f:verbatim>&#160;</f:verbatim>
									<f:facet name="footer">
										<t:div rendered="#{evaluation_observation.new}" >
											<t:inputText 
												id="Observation_Lookup_id-New"
												forceId="#{true}"
												styleClass="aon-form-input-text"
												onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','observationLookup','Observation_Lookup_id-New','Observation_Lookup_id|Observation_Lookup_id-New,Observation_Lookup_description|Observation_Lookup_description-New');"
												size="5" />
											<h:commandButton id="find_Observation_Lookup_id-New"
												styleClass="aon-form-lookup-button" value="" immediate="true"
												onclick="lookupSearchWindow(this, 'placeList', '#{observationLookup.encodedSearchPagePath}','Observation_Lookup_id|Observation_Lookup_id-New,Observation_Lookup_description|Observation_Lookup_description-New');return false;" />	
											<t:inputTextarea
												id="Observation_Lookup_description-New"
												forceId="#{true}"
												styleClass="aon-form-input-text"
												cols="50" rows="5"
												value="#{evaluation_observation.to.comments}" required="#{true}" />
										</t:div>
									</f:facet>
								</h:column>
								
								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
				
									<t:commandButton title="#{bundle.aon_accept}" 
										actionListener="#{evaluation_observation.onAccept}"
										onclick="return (confirm('#{bundle.aon_accept_confirm}'));" 
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
										value=""
										rendered="#{to_evaluation_observation==evaluation_observation.to}"
										accesskey="#{bundle.aon_key_save_line}"/>
									<t:commandButton title="#{bundle.aon_cancel}" 
										actionListener="#{evaluation_observation.onCancel}"
										immediate="#{true}" 
										onclick="return (confirm('#{bundle.aon_cancel_confirm}'));" 
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
										value="" accesskey="#{bundle.aon_key_cancel_line}"
										rendered="#{to_evaluation_observation==evaluation_observation.to}"/>
									<t:commandButton title="#{bundle.aon_remove}" 
										actionListener="#{evaluation_observation.onRemove}" 
										onclick="return (confirm('#{bundle.aon_remove_confirm}'));" 
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
										value="" accesskey="#{bundle.aon_key_remove_line}"
										rendered="#{to_evaluation_observation==evaluation_observation.to}"/>
									<f:verbatim rendered="#{to_mark.id!=mark.to.id}">&#160;</f:verbatim>
									<f:facet name="footer">
										<t:div>
											<f:verbatim rendered="#{!evaluation_observation.new}">&#160;</f:verbatim>
											<t:commandButton title="#{bundle.aon_accept}" 
												actionListener="#{evaluation_observation.onAccept}"
												onclick="return (confirm('#{bundle.aon_accept_confirm}'));" 
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
												value="" accesskey="#{bundle.aon_key_save_line}"
												rendered="#{evaluation_observation.new}"/>
											<t:commandButton title="#{bundle.aon_cancel}" 
												actionListener="#{evaluation_observation.onCancel}"
												immediate="#{true}" 
												onclick="return (confirm('#{bundle.aon_cancel_confirm}'));" 
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
												value="" accesskey="#{bundle.aon_key_cancel_line}"
												rendered="#{evaluation_observation.new}"/>
										</t:div>
									</f:facet>		
								</h:column>
							</t:dataTable>
							
							<t:div rendered="#{courseAlumnMark.to != null}">
								<ui:include src="/facelet/shared/dataScroller.xhtml">
									<ui:param name="dataTable" value="evaluation_observationDataList" />
									<ui:param name="model" value="#{evaluation_observation.model}" />
									<ui:param name="showNote" value="#{false}" />
								</ui:include>
							</t:div>

							<t:dataTable id="markDataList" value="#{mark.model}" 
								var="to_mark" rowIndexVar="rowIndex_mark"
								rowOnMouseOver="selectRow( this )"
								rowOnMouseOut="unselectRow( this )" 
								rowOnClick="sendRow( this )"
								rows="20" 
								rendered="#{courseAlumnMark.to != null}"
								styleClass="aon-edit-table" 
								headerClass="aon-edit-table-header" 
								footerClass="aon-edit-table-footer"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body aon-edit-table-body-icon,
								aon-edit-table-body aon-edit-table-body-string,
								aon-edit-table-body aon-edit-table-body-number,
								aon-edit-table-body aon-edit-table-body-buttons">
	
								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<f:verbatim>&#160;</f:verbatim>
									<t:commandLink immediate="#{true}"
										rendered="#{to_mark!=mark.to}"
										styleClass="aon-table-row-selected"
										actionListener="#{mark.onSelect}">
									</t:commandLink>
									<f:facet name="footer">
										<t:div>
											<t:commandButton id="reset"
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
												value="" immediate="#{true}" rendered="#{!mark.new}"
												actionListener="#{mark.onReset}"
												accesskey="#{bundle.aon_key_new_line}">
											</t:commandButton>
										</t:div>
									</f:facet>
								</h:column>
	
								<h:column>
									<f:facet name="header">
										<h:outputText value="#{appBundle.mark_subject}" />
									</f:facet>
									<t:outputText value="#{to_mark.subject.academicSkill.code} #{to_mark.subject.academicSkill.description}"
										rendered="#{to_mark!=mark.to}" />
									<h:selectOneMenu value="#{mark.to.subject.id}"
										styleClass="aon-form-selectOneMenu-field"
										rendered="#{to_mark==mark.to}">
										<f:selectItems value="#{academyCollections.markSubjects}" />
									</h:selectOneMenu>
									<f:facet name="footer">
										<t:div>
											<h:selectOneMenu value="#{mark.to.subject.id}"
												styleClass="aon-form-selectOneMenu-field"
												rendered="#{mark.new}">
												<f:selectItems value="#{academyCollections.markSubjects}" />
											</h:selectOneMenu>
										</t:div>
									</f:facet>
								</h:column>
	
								<h:column>
									<f:facet name="header">
										<h:outputText value="#{appBundle.mark_mark}" />
									</f:facet>
									<h:outputText value="#{to_mark.mark}" rendered="#{to_mark.id!=mark.to.id}" />
									<t:inputText rendered="#{to_mark==mark.to}" 
										styleClass="aon-form-input-text" size="10" maxlength="8"
										value="#{mark.to.mark}" required="#{true}">
										<f:validateLongRange minimum="0" maximum="10" />
									</t:inputText>
									<f:verbatim>&#160;</f:verbatim>
									<f:facet name="footer">
										<t:inputText rendered="#{mark.new}" 
											styleClass="aon-form-input-text"
											value="#{mark.to.mark}"
											required="#{true}" size="10" maxlength="8" />
									</f:facet>
								</h:column>
								
								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
				
									<t:commandButton title="#{bundle.aon_accept}" 
										actionListener="#{mark.onAccept}"
										onclick="return (confirm('#{bundle.aon_accept_confirm}'));" 
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
										value=""
										rendered="#{to_mark==mark.to}"
										accesskey="#{bundle.aon_key_save_line}"/>
									<t:commandButton title="#{bundle.aon_cancel}" 
										actionListener="#{mark.onCancel}"
										immediate="#{true}" 
										onclick="return (confirm('#{bundle.aon_cancel_confirm}'));" 
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
										value="" accesskey="#{bundle.aon_key_cancel_line}"
										rendered="#{to_mark.id==mark.to.id}"/>
									<t:commandButton title="#{bundle.aon_remove}" 
										actionListener="#{mark.onRemove}" 
										onclick="return (confirm('#{bundle.aon_remove_confirm}'));" 
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
										value="" accesskey="#{bundle.aon_key_remove_line}"
										rendered="#{to_mark.id==mark.to.id}"/>
									<f:verbatim rendered="#{to_mark.id!=mark.to.id}">&#160;</f:verbatim>
									<f:facet name="footer">
										<t:div>
											<f:verbatim rendered="#{!mark.new}">&#160;</f:verbatim>
											<t:commandButton title="#{bundle.aon_accept}" 
												actionListener="#{mark.onAccept}"
												onclick="return (confirm('#{bundle.aon_accept_confirm}'));" 
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
												value="" accesskey="#{bundle.aon_key_save_line}"
												rendered="#{mark.new}"/>
											<t:commandButton title="#{bundle.aon_cancel}" 
												actionListener="#{mark.onCancel}"
												immediate="#{true}" 
												onclick="return (confirm('#{bundle.aon_cancel_confirm}'));" 
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
												value="" accesskey="#{bundle.aon_key_cancel_line}"
												rendered="#{mark.new}"/>
										</t:div>
									</f:facet>		
								</h:column>
							</t:dataTable>
							
							<t:div rendered="#{courseAlumnMark.to != null}">
								<ui:include src="/facelet/shared/dataScroller.xhtml">
									<ui:param name="dataTable" value="markDataList" />
									<ui:param name="model" value="#{mark.model}" />
									<ui:param name="showNote" value="#{false}" />
								</ui:include>
							</t:div>
							
						</t:div>
					</h:panelGrid>

				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>

</ui:composition>

</body>
</html>
