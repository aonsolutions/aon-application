<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">

<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="invoicingGroupForm" styleClass="aon-form">
			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" actionListener="#{invoicingGroup.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							accesskey="#{bundle.aon_key_save}" />
						<h:commandButton id="cancel" value="#{bundle.aon_cancel}"
							actionListener="#{invoicingGroup.onCancel}"
							action="invoicing_group_list" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'"
							accesskey="#{bundle.aon_key_cancel}" />
						<t:commandButton id="remove" value="#{bundle.aon_remove}"
							forceId="#{true}" immediate="#{true}"
							action="invoicing_group_list"
							actionListener="#{invoicingGroup.onRemove}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'"
							accesskey="#{bundle.aon_key_remove}" />
						<h:commandButton id="search" value="#{bundle.aon_search}"
							immediate="#{true}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							actionListener="#{invoicingGroup.onEditSearch}"
							action="invoicing_group_search"
							accesskey="#{bundle.aon_key_search}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText
						value="#{invoicingGroup.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</t:div>
			</t:div>

			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<!-- start of bag panel -->
					<!-- start of flow layout -->
					<h:panelGrid columns="2" dir="true" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

						<t:outputLabel for="Customer_Lookup_id"
							value="#{customerBundle.customer_customer}"
							styleClass="aon-form-input-text-label" />
						<t:div>
							<t:inputText id="Customer_Lookup_id" forceId="#{true}"
								value="#{invoicingGroup.to.parent.id}"
								disabled="#{!invoicingGroup.new}"
								styleClass="aon-form-input-text" size="5"
								onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');"
								valueChangeListener="#{invoicingGroup.onRegistryChanged}" />
							<h:commandButton id="find_Customer_Lookup_id"
								styleClass="aon-form-lookup-button" value="" immediate="true"
								disabled="#{!invoicingGroup.new}"
								onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id,Customer_full_name|Customer_full_name');return false;" />
							<t:inputText id="Customer_full_name"
								value="#{invoicingGroup.to.parent.name} #{invoicingGroup.to.parent.surname}"
								disabled="true" forceId="#{true}"
								styleClass="aon-form-input-text-disabled" size="40" />
						</t:div>

					</h:panelGrid>

					<t:div styleClass="aon-form-group"
						rendered="#{!invoicingGroup.new}">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="invoicingGroupDetailDataList"
								value="#{financeBundle.aon_details}" />
						</t:div>

						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="invoicingGroupDetailDataList"
								value="#{invoicingGroupDetail.model}" rows="20" var="to"
								rowIndexVar="rowIndex"
								rowOnMouseOver="selectRow( this )"
								rowOnMouseOut="unselectRow( this )" rowOnClick="sendRow( this )"
								styleClass="aon-edit-table" headerClass="aon-edit-table-header"
								footerClass="aon-edit-table-footer"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body aon-edit-table-body-icon,
									aon-edit-table-mainColumn aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-buttons">

								<t:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:commandLink immediate="#{true}"
										styleClass="aon-table-row-selected"
										rendered="#{to.id!=invoicingGroupDetail.to.id}"
										actionListener="#{invoicingGroupDetail.onSelect}" />
									<f:verbatim>&#160;</f:verbatim>
									<f:facet name="footer">
										<t:div>
											<t:commandButton id="reset" alt="[#{bundle.aon_reset}]"
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
												actionListener="#{invoicingGroupDetail.onReset}" rendered="#{!invoicingGroupDetail.new}"
												value="" accesskey="#{bundle.aon_key_new_line}">
											</t:commandButton>
										</t:div>
									</f:facet>
								</t:column>

								<t:column>
									<f:facet name="header">
										<t:outputText value="#{financeBundle.aon_name}" />
									</f:facet>
									<t:outputText value="#{to.child.name} #{to.child.surname}"
										rendered="#{to!=invoicingGroupDetail.to}" />
									<t:div rendered="#{to==invoicingGroupDetail.to}">
										<t:inputText id="Customer_Lookup_id-Edit" size="5"
											forceId="#{true}" styleClass="aon-form-input-text"
											valueChangeListener="#{invoicingGroupDetail.onRegistryChanged}"
											onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id-Edit[#{rowIndex}]','Customer_id|Customer_Lookup_id-Edit[#{rowIndex}],Customer_full_name|Customer_full_name-Edit[#{rowIndex}]');"
											value="#{invoicingGroupDetail.to.child.id}" />
										<h:commandButton id="find_Customer_Lookup_id-Edit"
											styleClass="aon-form-lookup-button" value="" immediate="true"
											onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id-Edit[#{rowIndex}],Customer_full_name|Customer_full_name-Edit[#{rowIndex}]');return false;" />
										<t:inputText id="Customer_full_name-Edit" forceId="#{true}"
											styleClass="aon-form-input-text-disabled"
											value="#{to.child.name} #{to.child.surname}" disabled="true"
											size="30" />
									</t:div>
									<f:facet name="footer">
										<t:div rendered="#{invoicingGroupDetail.new}">
											<t:inputText id="Customer_Lookup_id-New" size="5"
												forceId="#{true}" styleClass="aon-form-input-text"
												valueChangeListener="#{invoicingGroupDetail.onRegistryChanged}"
												onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id-New','Customer_id|Customer_Lookup_id-New,Customer_full_name|Customer_full_name-New');"
												value="#{invoicingGroupDetail.to.child.id}" />
											<h:commandButton id="find_Customer_Lookup_id-New"
												styleClass="aon-form-lookup-button" value=""
												immediate="true"
												onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id-New,Customer_full_name|Customer_full_name-New');return false;" />
											<t:inputText id="Customer_full_name-New" forceId="#{true}"
												styleClass="aon-form-input-text-disabled" disabled="true"
												value="#{to.child.name} #{to.child.surname}" size="30" />
										</t:div>
									</f:facet>
								</t:column>

								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>

									<t:commandButton title="#{bundle.aon_accept}"
										actionListener="#{invoicingGroupDetail.onAccept}"
										onclick="return (confirm('#{bundle.aon_accept_confirm}'));"
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
										value="" rendered="#{to.id==invoicingGroupDetail.to.id}"
										accesskey="#{bundle.aon_key_save_line}" />
									<t:commandButton title="#{bundle.aon_cancel}"
										actionListener="#{invoicingGroupDetail.onCancel}"
										immediate="#{true}"
										onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
										value="" accesskey="#{bundle.aon_key_cancel_line}"
										rendered="#{to.id==invoicingGroupDetail.to.id}" />
									<t:commandButton title="#{bundle.aon_remove}"
										actionListener="#{invoicingGroupDetail.onRemove}"
										onclick="return (confirm('#{bundle.aon_remove_confirm}'));"
										styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-delete"
										value="" accesskey="#{bundle.aon_key_remove_line}"
										rendered="#{to.id==invoicingGroupDetail.to.id}" />
									<f:verbatim rendered="#{to.id!=invoicingGroupDetail.to.id}">&#160;</f:verbatim>
									<f:facet name="footer">
										<t:div>
											<f:verbatim rendered="#{!invoicingGroupDetail.new}">&#160;</f:verbatim>
											<t:commandButton title="#{bundle.aon_accept}"
												actionListener="#{invoicingGroupDetail.onAccept}"
												onclick="return (confirm('#{bundle.aon_accept_confirm}'));"
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-save"
												value="" accesskey="#{bundle.aon_key_save_line}"
												rendered="#{invoicingGroupDetail.new}" />
											<t:commandButton title="#{bundle.aon_cancel}"
												actionListener="#{invoicingGroupDetail.onCancel}"
												immediate="#{true}"
												onclick="return (confirm('#{bundle.aon_cancel_confirm}'));"
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-cancel"
												value="" accesskey="#{bundle.aon_key_cancel_line}"
												rendered="#{invoicingGroupDetail.new}" />
										</t:div>
									</f:facet>
								</h:column>

							</t:dataTable>

							<ui:include src="/facelet/shared/dataScroller.xhtml">
								<ui:param name="dataTable" value="invoicingGroupDetailDataList" />
								<ui:param name="model" value="#{invoicingGroupDetail.model}" />
								<ui:param name="showNote" value="#{false}" />
							</ui:include>

						</t:div>
					</t:div>

				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>
</body>
</html>
