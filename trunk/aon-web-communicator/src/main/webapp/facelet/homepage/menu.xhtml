<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/com/code/aon/ui/resources/facelet/shared/menu.xhtml">

	<ui:define name="afterMenuContent">
		<aon:commandLink id="marketing"
			value="#{bundle.aon_module_marketing}"
			action="menu_marketing" immediate="true"
			styleClass="aon-top-menu-item aon-icon-marketing" />
		<aon:commandLink id="config"
			value="#{bundle.aon_configuration}"
			action="menu_config" immediate="true"
			styleClass="aon-top-menu-item aon-icon-config" />	
		<aon:commandLink id="communicationCenter"
			value="#{commercialBundle.commercial_communication_center_module}"
			styleClass="aon-top-menu-item aon-icon-telephone" immediate="true" 
			action="communicationCenter" actionListener="#{communicationCenter.onInit}" />
	</ui:define>
	
</ui:composition>
