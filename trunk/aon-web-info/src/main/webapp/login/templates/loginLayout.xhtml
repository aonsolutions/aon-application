<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:c="http://java.sun.com/jstl/core"		
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-components" version="1.2">

<c:forEach items="#{aonConfiguration.applicationBundleList}" var="bundle">
	<f:loadBundle basename="#{bundle.value}" var="#{bundle.key}" />
</c:forEach>
<f:view>
	<head>
		<title>
			<ui:insert name="title"/>
		</title>
		<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
		<meta http-equiv="Expires" content="0" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Cache-Control" content="no-store" />
		<link href="#{facesContext.externalContext.requestContextPath}/login/css/login-aon.css" rel="stylesheet" type="text/css"></link>
		<script type='text/javascript' src="${facesContext.externalContext.requestContextPath}/login/js/Login.js">
			// nothing
		</script>
		<script type='text/javascript'>
			window.onLoad=loadInnerWindow();
		</script>
	</head>

	<body id="aon-body">
		<aon:div styleClass="aon-login">
			<aon:panelGrid style="width:100%;height:100%;">
				<aon:div styleClass="aon-login-box-internal">
				<form id="login" method="post" action="j_security_check" style="display: inline;">
					<aon:div styleClass="aon-login-title">
						<aon:graphicImage url="images/login/main-logo.gif"/>
						<aon:outputText value=" / #{appBundle.aon_application_title}" styleClass="aon-bold"/>
					</aon:div>
					<aon:div styleClass="aon-login-box">
						<aon:outputText value="#{securityBundle.aon_login_label}" styleClass="aon-login-help"/>
						<ui:insert name="error"/>
						<ui:insert name="content"/>
						<aon:div styleClass="aon-login-info">
							<aon:div styleClass="aon-login-info-title">
								<aon:outputText value="#{appBundle.aon_login_support}." />
							</aon:div>

							<aon:div styleClass="aon-bold">
								<aon:outputText value="#{appBundle.aon_login_phone}" />
							</aon:div>
							<aon:div>
								<ice:outputLink value="mailto:#{appBundle.aon_login_email}" target="_blank" >
									<aon:outputText value="#{appBundle.aon_login_email}" />
								</ice:outputLink>
							</aon:div>
						</aon:div>							

						<aon:div styleClass="aon-login-info2">						
							 <aon:outputText value="#{appBundle.aon_trademark}" />
							 <aon:outputText value="#{appBundle.aon_esferalia}" style="font-weight:bold;font-style:italic;font-size:12;" />
							 <aon:outputText value="#{appBundle.aon_networks}" />
						</aon:div>	
					</aon:div>
					</form>
				</aon:div>
			</aon:panelGrid>
		</aon:div>	
	</body>
  
</f:view>
</html>
