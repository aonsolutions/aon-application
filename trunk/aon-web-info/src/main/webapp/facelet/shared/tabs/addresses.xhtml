<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:div layout="none" ajaxRendered="true">
		<aon:editDataTable id="#{dataTable}" value="#{controllerAlias.model}"
			var="to" rows="20" 
			columnClasses="aon-editDataTable-iconColumn,
				aon-editDataTable-textColumn aon-width-auto,
				aon-editDataTable-textColumn,
				aon-editDataTable-textColumn,
				aon-editDataTable-textColumn,
				aon-editDataTable-buttonsColumn">
	
			<aon:rowSelector 
				toggleOnClick="#{controllerAlias.to == null}"
				actionListener="#{controllerAlias.onSelect}"/>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;"/>
				</f:facet>
				
				<aon:outputText value="&#160;"/>
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton id="reset"
							styleClass="aon-icon-reset aon-icon-commandButton"
							value="" rendered="#{!controllerAlias.new}"
							actionListener="#{controllerAlias.onReset}"
							accesskey="#{bundle.aon_key_new_line}">
						</aon:commandButton>
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_address}" />
				</f:facet>
				<aon:outputText value="#{to.address} #{to.address2} #{to.address3}"
					rendered="#{to!=controllerAlias.to}" />
				<aon:div>
					<aon:inputText value="#{controllerAlias.to.address}"
						rendered="#{to==controllerAlias.to}" required="#{true}" size="50" />
				</aon:div>
				<aon:div>
					<aon:inputText value="#{controllerAlias.to.address2}"
						rendered="#{to==controllerAlias.to}" size="50" />
				</aon:div>
				<aon:div>				
					<aon:inputText value="#{controllerAlias.to.address3}"
						rendered="#{to==controllerAlias.to}" size="50" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<aon:div>				
							<aon:inputText value="#{controllerAlias.to.address}"
								rendered="#{controllerAlias.new}" required="#{true}" size="50" />
						</aon:div>
						<aon:div>					
							<aon:inputText value="#{controllerAlias.to.address2}"
								rendered="#{controllerAlias.new}" size="50" />
						</aon:div>
						<aon:div>
							<aon:inputText value="#{controllerAlias.to.address3}"
								rendered="#{controllerAlias.new}" size="50" />
						</aon:div>
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_zip}" />
				</f:facet>
				<aon:outputText value="#{to.zip}" rendered="#{to!=controllerAlias.to}" />
				<aon:inputText value="#{controllerAlias.to.zip}"
					rendered="#{to==controllerAlias.to}" required="#{true}" size="8" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText value="#{controllerAlias.to.zip}"
							rendered="#{controllerAlias.new}" required="#{true}" size="8" />
					</aon:div>
				</f:facet>
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_city}" />
				</f:facet>
				<aon:outputText value="#{to.city}" rendered="#{to!=controllerAlias.to}" />
				<aon:inputText value="#{controllerAlias.to.city}"
					rendered="#{to==controllerAlias.to}" size="40" />
				<f:facet name="footer">
					<aon:div>
						<aon:inputText value="#{controllerAlias.to.city}"
							rendered="#{controllerAlias.new}" size="40" />
					</aon:div>
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{registryBundle.aon_geozone}" />
				</f:facet>
				<aon:outputText value="#{to.geozone.name}" rendered="#{to!=controllerAlias.to}" />
				<aon:selectOneMenu value="#{controllerAlias.to.geozone.id}"
					rendered="#{to==controllerAlias.to}"
					valueChangeListener="#{company.onChangeGeoZone}">
					<f:selectItems value="#{geozoneCollections.geoZones}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu value="#{controllerAlias.to.geozone.id}"
						rendered="#{controllerAlias.new}"
						valueChangeListener="#{company.onChangeGeoZone}">
						<f:selectItems value="#{geozoneCollections.geoZones}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
	
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;"/>
				</f:facet>
				<aon:div>
					<aon:outputText rendered="#{to!=controllerAlias.to}" value="&#160;"/>
	
					<aon:commandButton title="#{bundle.aon_save}"
						actionListener="#{controllerAlias.onAccept}"
						rendered="#{to==controllerAlias.to}" value=""
						styleClass="aon-editDataTable-button aon-icon-accept"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="#{bundle.aon_cancel}"
						actionListener="#{controllerAlias.onCancel}" immediate="#{true}"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						value="" rendered="#{to==controllerAlias.to}"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:commandButton title="#{bundle.aon_remove}"
						actionListener="#{controllerAlias.onRemove}"
						rendered="#{to==controllerAlias.to}"
						styleClass="aon-editDataTable-button aon-icon-delete"
						value="" accesskey="#{bundle.aon_key_remove_line}" />
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<aon:outputText rendered="#{!controllerAlias.new}" value="&#160;"/>
						<aon:commandButton title="#{bundle.aon_save}"
							actionListener="#{controllerAlias.onAccept}"
							rendered="#{controllerAlias.new}" value=""
							styleClass="aon-editDataTable-button aon-icon-accept"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:commandButton title="#{bundle.aon_cancel}"
							actionListener="#{controllerAlias.onCancel}" immediate="#{true}"
							rendered="#{controllerAlias.new}"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							value="" accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
		</aon:editDataTable>
		
		<aon:dataScroller dataTable="#{dataTable}" for="#{dataTable}"
			model="#{controllerAlias.model}" rowCount="10" showNote="true"  />
	</aon:div>

</ui:composition>
</body>
</html>
