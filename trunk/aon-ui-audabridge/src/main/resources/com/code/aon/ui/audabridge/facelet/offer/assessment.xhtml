<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div rendered="#{calculationData != null}" styleClass="aon-margin-top" style="background-color:#FFFFFF;">

		<aon:panelGrid columns="4" style="width:100%;"
			columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-200,aon-panelGrid-odd aon-width-100,aon-panelGrid-even aon-width-auto">
		
			<aon:outputText value="N&#250;mero Valoraci&#243;n" />
			<aon:outputText value="#{calculationData.numeroValoracion}" />

			<aon:outputText value="Referencia" />
			<aon:outputText value="#{calculationData.referencia}" />

			<aon:outputText value="C&#243;digo Auda-Transfer" />
			<aon:outputText value="#{calculationData.codigoAudaTransfer}" />

			<aon:outputText value="Fecha Valoraci&#243;n" />
			<aon:div>
				<aon:outputText value="#{calculationData.fechaValoracionAsDate}">
					<f:convertDateTime pattern="dd/MM/yyyy" type="both" timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
				<aon:outputText value="Fecha Tarifa" styleClass="aon-italic aon-margin-left"/>
				<aon:outputText value="#{calculationData.fechaTarifaAsDate}" styleClass="aon-italic aon-margin-left">
					<f:convertDateTime pattern="dd/MM/yyyy" type="both" timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:div>

			<aon:outputText value="Fabricante" />
			<aon:outputText value="#{calculationData.totalGeneral.nombreFabricante}" />

			<aon:outputText value="Modelo" />
			<aon:outputText value="#{calculationData.totalGeneral.nombreModelo} #{calculationData.totalGeneral.nombreVariante}" />

			<aon:outputText value="N&#250;mero Chasis" />
			<aon:outputText value="#{calculationData.totalGeneral.chasis}" />

		</aon:panelGrid>
		
		<aon:panelCollapsible expanded="false" label="CARACTER&#205;STICAS EQUIPO" styleClass="aon-margin-top">
			<aon:dataTable value="#{calculationData.listaEquipo}" var="equipo" style="width:100%;">
				<aon:column styleClass="aon-width-100 aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="C&#243;digo Equipo" />
					</f:facet>
					<aon:outputText value="#{equipo.codigoEquipo}" />
				</aon:column>

				<aon:column styleClass="aon-width-auto aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="Descripci&#243;n" />
					</f:facet>
					<aon:outputText value="#{equipo.descripcion}" />
				</aon:column>
			</aon:dataTable>
		</aon:panelCollapsible>
			
		<aon:panelCollapsible expanded="false" label="PIEZAS" styleClass="aon-margin-top">
			<aon:dataTable value="#{calculationData.listaPiezas}" var="pieza" style="width:100%;">


				<aon:column styleClass="aon-width-50 aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="C&#243;digo" />
					</f:facet>
					<aon:outputText value="#{pieza.simbolo}" />
				</aon:column>

				<aon:column styleClass="aon-width-50 aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="Posici&#243;n" />
					</f:facet>
					<aon:outputText value="#{pieza.posicionDb}" />
				</aon:column>

				<aon:column styleClass="aon-width-150 aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="Referencia" />
					</f:facet>
					<aon:outputText value="#{pieza.numeroPieza}" />
				</aon:column>

				<aon:column styleClass="aon-width-auto aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="Descripci&#243;n" />
					</f:facet>
					<aon:outputText value="#{pieza.descripcion}" />
				</aon:column>

				<aon:column styleClass="aon-width-50 aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputText value="Dto." />
					</f:facet>
					<aon:outputText value="#{pieza.descuento}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
				</aon:column>
				
				<aon:column styleClass="aon-width-80 aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputText value="Precio" />
					</f:facet>
					<aon:outputText value="#{pieza.precio}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
				</aon:column>
			</aon:dataTable>
		</aon:panelCollapsible>
		
		<aon:panelCollapsible expanded="false" label="OPERACIONES" styleClass="aon-margin-top">
			<aon:dataTable value="#{calculationData.listaOperaciones}" var="operacion" style="width:100%;">

				<aon:column styleClass="aon-width-150 aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="N&#250;mero Oper." />
					</f:facet>
					<aon:outputText value="#{operacion.numeroOperacion}" />
				</aon:column>

				<aon:column styleClass="aon-width-auto aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="Descripci&#243;n" />
					</f:facet>
					<aon:outputText value="#{operacion.descripcion}" />
				</aon:column>

				<aon:column styleClass="aon-width-50 aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputText value="Unidades Tiempo" />
					</f:facet>
					<aon:outputText value="#{operacion.numeroUt}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
				</aon:column>
				
				<aon:column styleClass="aon-width-80 aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputText value="Importe" />
					</f:facet>
					<aon:outputText value="#{operacion.importe}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
				</aon:column>
			</aon:dataTable>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="PINTURA" styleClass="aon-margin-top">
			<aon:dataTable value="#{calculationData.listaPintura}" var="pintura" style="width:100%;">

				<aon:column styleClass="aon-width-50 aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="C&#243;digo" />
					</f:facet>
					<aon:outputText value="#{pintura.simbolo}" />
				</aon:column>

				<aon:column styleClass="aon-width-50 aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="Posici&#243;n" />
					</f:facet>
					<aon:outputText value="#{pintura.posicion}" />
				</aon:column>

				<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="Descripci&#243;n Pieza" />
					</f:facet>
					<aon:outputText value="#{pintura.descripcionPieza}" />
				</aon:column>

				<aon:column styleClass="aon-width-auto aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputText value="Descripci&#243;n Pintura" />
					</f:facet>
					<aon:outputText value="#{pintura.descripcionPintura}" />
				</aon:column>

				<aon:column styleClass="aon-width-50 aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputText value="Descuento" />
					</f:facet>
					<aon:outputText value="#{pintura.descuento}">
						<f:convertNumber pattern="#,##0.00" />
					</aon:outputText>
				</aon:column>
				
				<aon:column styleClass="aon-width-80 aon-editDataTable-numberColumn">
					<f:facet name="header">
						<aon:outputText value="Importe" />
					</f:facet>
					<aon:outputText value="#{pintura.cambioImporte}" />
				</aon:column>
			</aon:dataTable>
		</aon:panelCollapsible>

		<aon:panelGrid columns="10" styleClass="aon-margin-top"
			columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-100 aon-text-right">
			<aon:outputText value="Total Mano de Obra" />
			<aon:outputText value="#{calculationData.totalGeneral.totalMo}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>

			<aon:outputText value="Total Pintura" />
			<aon:outputText value="#{calculationData.totalGeneral.totalPintura}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
						
			<aon:outputText value="Total Piezas" />
			<aon:outputText value="#{calculationData.totalGeneral.totalPiezas}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>

			<aon:outputText value="Total Sin I.V.A." />
			<aon:outputText value="#{calculationData.totalGeneral.totalSinIva}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>

			<aon:outputText value="Total Descuentos" />
			<aon:outputText value="#{calculationData.totalGeneral.descuentos}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>

			<aon:outputText value="Base Imponible" />
			<aon:outputText value="#{calculationData.totalGeneral.baseImponible}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>

			<aon:outputText value="Porcentaje de I.V.A." />
			<aon:outputText value="#{calculationData.totalGeneral.porcentajeIva}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>

			<aon:outputText value="Cuota de I.V.A." />
			<aon:outputText value="#{calculationData.totalGeneral.importeIva}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>

			<aon:outputText value="Total Valoraci&#243;n" />
			<aon:outputText value="#{calculationData.totalGeneral.totalValoracion}">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>

			<aon:outputText value="Total a Pagar" />
			<aon:outputText value="#{calculationData.totalGeneral.totalPagar}"
				styleClass="aon-bold">
				<f:convertNumber pattern="#,##0.00" />
			</aon:outputText>
		</aon:panelGrid>

	</aon:div>
</ui:composition>
