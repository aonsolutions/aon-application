<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition>

	<aon:div>
  
		<aon:div styleClass="aon-toolbar"  id="buttonsGrid" 
			rendered="#{webmailTree.treeLoaded}" style="padding-bottom:0;">
							
			<aon:commandButton value="&#160;"
				id="newFolder" reRender="createSubFolderGrid"
				title="#{webmailBundle.webmail_newfolder}"
				styleClass="aon-icon-commandButton aon-icon-newFolder"
				actionListener="#{webmailFolder.openNewFolderPanelPopup}">
				<rich:componentControl for="newFolderModalPanel" operation="show" event="onclick"/>
				<f:setPropertyActionListener value="#{false}" target="#{webmailFolder.createAsSubfolder}" />
				<f:setPropertyActionListener value="#{null}" target="#{webmailFolder.newFolderName}" />
			</aon:commandButton>
				
			<aon:commandButton value="&#160;"
				id="deleteFolder_n"
				rendered="#{webmailFolder.folder.deleteable}"
				title="#{webmailBundle.webmail_delfolder}"
				actionListener="#{webmailFolder.deleteFolder}"
				reRender="foldersTree,buttonsGrid,messageGrid"
				styleClass="aon-icon-commandButton aon-icon-deleteFolder">
			</aon:commandButton>
			
			<aon:commandButton value="&#160;"
				id="deleteFolder_d" disabled="true"
				rendered="#{!webmailFolder.folder.deleteable}"
				title="#{webmailBundle.webmail_delfolder}"
				styleClass="aon-icon-commandButton-disabled aon-icon-deleteFolder-disabled">
			</aon:commandButton>
		
			<aon:commandButton value="&#160;"
				id="renameFolder_n" reRender="aonStatus"
				rendered="#{webmailFolder.folder.renameable}"
				title="#{webmailBundle.webmail_renamefolder}"
				actionListener="#{webmailFolder.openRenameFolderPanelPopup}"
				styleClass="aon-icon-commandButton aon-icon-renameFolder">
				<rich:componentControl for="renameFolderModalPanel" operation="show" event="onclick"/>
			</aon:commandButton>
			
			<aon:commandButton value="&#160;"
				id="renameFolder_d" disabled="true"
				rendered="#{!webmailFolder.folder.renameable}"
				title="#{webmailBundle.webmail_renamefolder}"					
				styleClass="aon-icon-commandButton-disabled aon-icon-renameFolder-disabled">
			</aon:commandButton>
		</aon:div>
		
		<aon:div  rendered="#{webmail.server.quotaAware}" styleClass="aon-margin-bottom">
			<aon:div>		
				<aon:graphicImage value="#{webmail.quotaImage}" styleClass="aon-border"
					width="200" height="10" />
			</aon:div>
			<aon:outputFormat value="#{webmailBundle.webmail_quota}" >
				<f:param value="#{webmail.quotaPercent}"/>
				<f:param value="#{webmail.quotaLimit}"/>
			</aon:outputFormat>
		</aon:div>

		<aon:div id="mailAccountDiv">
			<aon:outputText value="#{webmail.server.account.email}"
				rendered="#{!mailAccount.showMailAccountList}"
				styleClass="aon-icon-tree-root aon-icon"/>
			<h:panelGrid columns="2" rendered="#{mailAccount.showMailAccountList}">
				<aon:selectOneMenu 			
					valueChangeListener="#{mailAccount.onChangeMailAccount}"
					value="#{mailAccount.accountId}" >
					<f:selectItems value="#{mailAccount.mailAccounts}" />
					<a4j:support ajaxSingle="true" event="onchange" reRender="aonContent"
						onsubmit="Richfaces.showModalPanel('waitProccess')" />	
				</aon:selectOneMenu>
				<aon:commandButton reRender="mailAccountDiv" ajaxSingle="true"
					title="#{bundle.aon_cancel}"
					styleClass="aon-icon-commandButton aon-icon-cancel aon-margin-left">
					<f:setPropertyActionListener target="#{mailAccount.showMailAccountList}" value="#{false}" />
				</aon:commandButton>
			</h:panelGrid>			
			<aon:commandButton reRender="mailAccountDiv" ajaxSingle="true"
				rendered="#{(mailAccount.model.rowCount &gt; 1) and (!mailAccount.showMailAccountList)}"
				title="#{webmailBundle.webmail_mailAccount_select}"
				styleClass="aon-icon-commandButton aon-icon-dropDown">
				<f:setPropertyActionListener target="#{mailAccount.showMailAccountList}" value="#{true}" />
			</aon:commandButton>			
		</aon:div>	
	    
		<rich:tree nodeSelectListener="#{webmailTree.processSelection}" selectedClass="aon-tree-node-active" 
				id="foldersTree" styleClass="aon-normal" adviseNodeSelected="#{webmailTree.adviseNodeSelected}"
				reRender="buttonsGrid,folderButtonsGrid,messageGrid" ajaxSubmitSelection="true"  switchType="ajax"
				value="#{webmailTree.treeNode}" var="item"
				nodeFace="#{item.folderTypeName}">
			<rich:treeNode type="INBOX" 
				iconLeaf="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-inbox.png']}" 
				icon="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-inbox.png']}">
				<rich:dropSupport acceptedTypes="MESSAGE" dropValue="#{item}"
					dropListener="#{webmailFolder.messagesDrop}" reRender="messagesDiv,foldersTree" />							
				<aon:outputText 
	               	value="#{item.name} (#{item.unreadMessageCount})"
					rendered="#{item.unreadMessageCount>0}" />
				<aon:outputText
					value="#{item.name}" rendered="#{item.unreadMessageCount==0}" />
			</rich:treeNode>
			<rich:treeNode type="Enviados" 
				iconLeaf="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-sent.png']}" 
				icon="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-sent.png']}">
				<rich:dropSupport acceptedTypes="MESSAGE" dropValue="#{item}"
					dropListener="#{webmailFolder.messagesDrop}" reRender="messagesDiv,foldersTree" />							
				<aon:outputText 
	               	value="#{item.name} (#{item.unreadMessageCount})"
					rendered="#{item.unreadMessageCount>0}" />
				<aon:outputText 
	               	value="#{item.name}" rendered="#{item.unreadMessageCount==0}" />
			</rich:treeNode>
			<rich:treeNode type="spam" 
				iconLeaf="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-spam.png']}" 
				icon="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-spam.png']}">
				<rich:dropSupport acceptedTypes="MESSAGE" dropValue="#{item}"
					dropListener="#{webmailFolder.messagesDrop}" reRender="messagesDiv,foldersTree" />							
				<aon:outputText 
	               	value="#{item.name} (#{item.unreadMessageCount})"
					rendered="#{item.unreadMessageCount>0}" />
				<aon:outputText 
	               	value="#{item.name}"
					rendered="#{item.unreadMessageCount==0}" />
			</rich:treeNode>
			<rich:treeNode type="Papelera" 
				iconLeaf="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-trash.png']}" 
				icon="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-trash.png']}">
				<rich:dropSupport acceptedTypes="MESSAGE" dropValue="#{item}"
					dropListener="#{webmailFolder.messagesDrop}" reRender="messagesDiv,foldersTree" />							
				<aon:outputText 
	               	value="#{item.name} (#{item.unreadMessageCount})"
					rendered="#{item.unreadMessageCount>0}" />
				<aon:outputText 
	               	value="#{item.name}" rendered="#{item.unreadMessageCount==0}" />
			</rich:treeNode>
			<rich:treeNode type="Borrador" 
				iconLeaf="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-draft.png']}" 
				icon="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-draft.png']}">
				<rich:dropSupport acceptedTypes="MESSAGE" dropValue="#{item}"
					dropListener="#{webmailFolder.messagesDrop}" reRender="messagesDiv,foldersTree" />			
				<aon:outputText 
	               	value="#{item.name} (#{item.unreadMessageCount})"
					rendered="#{item.unreadMessageCount>0}" />
				<aon:outputText 
	               	value="#{item.name}" rendered="#{item.unreadMessageCount==0}" />
			</rich:treeNode>
			<rich:treeNode type="other" 
				iconLeaf="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-folder.png']}" 
				icon="#{aonResource.resolve['/images/aon-icon/aon-icon-tree-folder.png']}">
				<rich:dropSupport acceptedTypes="MESSAGE" dropValue="#{item}"
					dropListener="#{webmailFolder.messagesDrop}" reRender="messagesDiv,foldersTree" />			
				<aon:outputText 
					value="WebMail"
					rendered="#{item.root}" />
				<aon:outputText 
	               	value="#{item.name} (#{item.unreadMessageCount})"
					rendered="#{!item.root and item.unreadMessageCount>0}" />
				<aon:outputText 
	               	value="#{item.name}" rendered="#{!item.root and item.unreadMessageCount==0}" />
			</rich:treeNode>
		</rich:tree>	
	    
	</aon:div>
	
</ui:composition>

</body>
</html>
