<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">
		
	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
		<ui:param name="controller" value="#{signature}" />
		<ui:param name="skipSearchButton" value="true" />
		
		<c:if test="#{!innerToolbar}" >
			<ui:param name="toolbarTitle" value="#{webmailBundle.webmail_signature}" />
		</c:if>
		<c:if test="#{innerToolbar}" >
			<ui:param name="toolbarID" value="#{controller.beanName}Toolbar" />	
			<ui:param name="skipToolbarDescription" value="true" />
			<aon:methodParam name="saveAction" value="" />
			<ui:param name="saveButtonReRender" value="#{controller.beanName}Div" />
			<aon:methodParam name="cancelAction" value="" />
			<ui:param name="cancelButtonReRender" value="#{controller.beanName}Div" />
			<aon:methodParam name="removeAction" value="" />
			<ui:param name="removeButtonReRender" value="#{controller.beanName}Div" />
			<aon:methodParam name="resetAction" value="" />
			<ui:param name="resetButtonReRender" value="#{controller.beanName}Div" />
			<aon:methodParam name="backAction" value="" />
			<ui:param name="backButtonReRender" value="#{controller.beanName}Div" />									
		</c:if>		
	</ui:include>			
	
	<aon:div styleClass="aon-scroll-area">
		<aon:panelGrid id="menuGrid" columns="2" dir="true" width="100%" columnClasses="aon-panelGrid-odd aon-width-100,aon-panelGrid-even">
	
			<aon:outputLabel for="Signature_name"
				value="#{webmailBundle.webmail_signature_name}" />
			<aon:inputText id="Signature_name"
				validator="#{signature.idCheck}"
				size="60" maxlength="45" required="true"
				value="#{signature.to.name}"/>
			
			<aon:outputLabel for="Signature_signature"
				value="#{webmailBundle.webmail_signature_signature}" />
			<aon:div style="width:98%">
				<a4j:region>
					<aon:selectBooleanCheckbox id="Signature_signature_richTextEnabled"
						value="#{signature.richTextEnabled}" >
						<a4j:support reRender="Signature_signature" event="onclick"	/>
					</aon:selectBooleanCheckbox>
					<aon:outputLabel for="Signature_signature_richTextEnabled"
						value="#{webmailBundle.webmail_richtext_enabled}" />	
					<aon:inputRichText id="Signature_signature"
						viewMode="#{signature.richTextEnabled?'visual':'source'}"
						value="#{signature.to.signature}"
						height="400" width="640" configuration="tinyMCE" > 
					</aon:inputRichText>																		
				</a4j:region>								
			</aon:div>				
					
		</aon:panelGrid>
	</aon:div>

</ui:composition>
