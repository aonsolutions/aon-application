<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
		<c:if test="#{innerToolbar}" >
			<ui:param name="skipToolbarTitle" value="true" />
			<ui:param name="skipToolbarDescription" value="true" />
		
			<aon:methodParam name="saveAction" value="" />
			<ui:param name="saveButtonReRender" value="#{controller.beanName}Div" />
			<aon:methodParam name="cancelAction" value="" />
			<ui:param name="cancelButtonReRender" value="#{controller.beanName}Div" />
			<aon:methodParam name="removeAction" value="" />
			<ui:param name="removeButtonReRender" value="#{controller.beanName}Div" />
			<aon:methodParam name="resetAction" value="" />
			<ui:param name="resetButtonReRender" value="#{controller.beanName}Div" />
			<aon:methodParam name="backAction" value="" />
			<ui:param name="backButtonReRender" value="#{controller.beanName}Div" />		
			
		</c:if>	
	</ui:include>
			
</ui:composition>
