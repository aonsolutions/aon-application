<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="offerForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{commercialBundle.commercial_offer_module}" />
				<ui:param name="controller" value="#{offer}" />
				<ui:param name="skipSaveButton" value="#{offer.processed}" />
				<ui:param name="skipRemoveButton" value="#{offer.processed}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="sales"
						value="Hacer Pedido"
						actionListener="#{offer.createSales}" action="sales_list"
						rendered="#{!offer.processed and offerDetail.model.rowCount > 0}"
						styleClass="aon-finding-toolbar-item aon-icon-sincronize" />
					<h:commandLink id="offer" value="#{bundle.aon_report}"
						target="_new" rendered="#{!offer.new}"
						action="#{report.onExecute}"
						disabled="#{offerDetail.to != null}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-printer">
						<f:param name="reportKey" value="offer" />
						<f:param name="outputFormat" value="PDF" />
					</h:commandLink>
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="4" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-auto,
						aon-panelGrid-odd aon-width-150,
						aon-panelGrid-even aon-width-200">

					<aon:outputLabel for="Offer_series"
						value="#{bundle.aon_series}/#{bundle.aon_number}" />
					<aon:div>
						<aon:selectOneMenu id="Offer_series" value="#{offer.to.series}"
							rendered="#{offer.new}"
							valueChangeListener="#{offer.onSeriesChanged}" reRender="Offer_number,Offer_securityLevel,Offer_workPlace">
							<f:selectItem itemValue="" itemLabel=" " />
							<f:selectItems value="#{configCollections.series}" />
						</aon:selectOneMenu>
						<aon:inputText id="Offer_series-Edit" value="#{offer.to.series}"
							rendered="#{!offer.new}" disabled="true" size="4" />
						<aon:inputText id="Offer_number" value="#{offer.to.number}"
							required="true" disabled="#{!offer.new}" size="7"
							styleClass="aon-margin-left" />

						<aon:selectOneMenu id="Offer_securityLevel" value="#{offer.to.securityLevel}"
							required="true" disabled="#{offer.processed}"
							styleClass="aon-margin-left">
							<f:selectItems value="#{commonCollections.securityLevels}" />
						</aon:selectOneMenu>

						<aon:outputText styleClass="aon-margin-left"
							value="#{offer.to.status}" />
 					</aon:div>

					<aon:outputLabel for="Offer_issueDate" value="#{bundle.aon_date}" />
					<aon:selectInputDate id="Offer_issueDate"
						value="#{offer.to.issueDate}" 
						required="true" disabled="#{offer.processed}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Offer_target_id" value="#{commercialBundle.commercial_target}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Offer_target_id" value="#{offer.to.target.registry.id}"
							lookup="#{targetLookup}" ajaxSingle="true" reRender="Offer_target_full_name,Offer_target_registry_document,OfferAddress"
							lookupChangeListener="#{offer.targetData}" lookupProperty="registry"
							required="true" disabled="#{offer.processed}" size="5" />
						<aon:lookupButton
							windowTitle="#{commercialBundle.commercial_target_selection}" actionType="search"
							property="#{offer.to.target.registry}" selectReRender="Offer_target_id,Offer_target_full_name,Offer_target_registry_document,OfferAddress"
							lookup="#{targetLookup}" minHeight="460" minWidth="650"
							lookupChangeListener="#{offer.targetData}" lookupProperty="registry"
							disabled="#{offer.processed}">
						</aon:lookupButton>
						<aon:inputText id="Offer_target_full_name" 
							value="#{(offer.to.target.registry.name!=null)?(offer.to.target.registry.fullName):('')}"
							disabled="true" size="50" />
						<!-- FARSA BOTON -->
						<aon:commandButton
							value="Enviar"
							style="margin-left: 0.7em;"
							rendered="#{!offer.new and offer.to.target.registry.email != null}"
							title="Enviar Mail a #{offer.to.target.registry.email.value}"
							actionListener="#{offer.sendFarsaMail}"
							styleClass="aon-icon-commandButton aon-icon-mailForward"/>
						<aon:commandButton
							value="Sin Email"
							style="margin-left: 0.7em;"
							rendered="#{!offer.new and offer.to.target.registry.email == null}"
							title="#{offer.to.target.registry.fullName} no tiene eMail definido."
							styleClass="aon-icon-commandButton aon-icon-mailDelete"/>
						<!-- END FARSA BOTON -->
					</aon:div>

					<aon:outputLabel for="Offer_target_registry_document" value="#{bundle.aon_company_document}" />
					<aon:inputText id="Offer_target_registry_document" value="#{offer.to.target.registry.document}"
						disabled="#{offer.processed}" size="10" />

					<aon:outputLabel for="Offer_address"
						value="#{registryBundle.registry_address}" />
					<aon:div id="OfferAddress">
						<aon:selectOneMenu id="Offer_address" value="#{offer.to.address}"
							rendered="#{offer.addressCount > 0}"
							disabled="#{offer.processed}">
							<f:selectItems value="#{offer.addresses}" />
						</aon:selectOneMenu>
						<aon:outputLabel value="#{registryBundle.registry_no_address_available}"
							rendered="#{offer.addressCount == 0}"
							styleClass="aon-italic" />
					</aon:div>

					<aon:outputLabel for="Offer_workPlace" value="#{companyBundle.company_workplace}" />
					<aon:selectOneMenu id="Offer_workPlace" value="#{offer.to.workPlace}"
						disabled="#{offer.processed}">
						<f:selectItems value="#{companyCollections.workPlaces}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_seller_id" value="#{salesBundle.sales_seller}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Offer_seller_id" value="#{offer.to.seller.registry.id}"
							lookup="#{sellerLookup}" reRender="Offer_seller_full_name"
							lookupChangeListener="#{offer.sellerData}" lookupProperty="registry"
							disabled="#{offer.processed}" size="5" />
						<aon:lookupButton
							windowTitle="#{salesBundle.sales_seller_selection}" actionType="search"
							property="#{offer.to.seller.registry}" selectReRender="Offer_seller_id,Offer_seller_full_name"
							lookup="#{sellerLookup}" minHeight="460" minWidth="650"
							lookupChangeListener="#{offer.sellerData}" lookupProperty="registry"
							disabled="#{offer.processed}">
						</aon:lookupButton>
						<aon:inputText id="Offer_seller_full_name" 
							value="#{(offer.to.seller.registry.name!=null)?(offer.to.seller.registry.fullName):('')}"
							disabled="true" size="50" />
					</aon:div>

					<aon:outputLabel for="Offer_payMethod" value="#{configBundle.config_pay_method}" />
					<aon:selectOneMenu id="Offer_payMethod" value="#{offer.to.payMethod}"
						disabled="#{offer.processed}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{configCollections.payMethods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_tariff" value="#{productBundle.product_tariff}" />
					<aon:selectOneMenu id="Offer_tariff" value="#{offer.to.tariff}"
						disabled="#{offer.processed}">
						<f:selectItem itemLabel="-" itemValue="" />
						<f:selectItems value="#{productCollections.tariffs}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_total" value="#{bundle.aon_total}" />
					<aon:outputText id="Offer_total" value="#{offer.totalPrice}" 
						styleClass="aon-bold">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
 
				</aon:panelGrid>
			</aon:div>

			<aon:panel rendered="#{!offer.new}"
				styleClass="aon-padding-left aon-padding-right">
				<f:facet name="header">
					<aon:outputText value="#{commercialBundle.commercial_offer_detail}" />
				</f:facet>
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="controller" value="#{offerDetail}" />
					<ui:param name="rows" value="0" />
					<ui:param name="showNote" value="false" />
					<ui:param name="skipResetButton" value="#{offer.processed}" />
					<ui:param name="skipLineEdition" value="#{offer.processed}" />
					<ui:param name="newSaveButtonReRender" value="Offer_total" />
					<ui:param name="saveButtonReRender" value="Offer_total" />
					<ui:param name="removeButtonReRender" value="Offer_total" />
					<ui:param name="focusOnAdd" value="OfferDetail_item_product_code-New" />
					<ui:param name="focusOnSelect" value="OfferDetail_item_product_code-Edit" />
					<ui:param name="columnClasses"
						value="aon-editDataTable-textColumn,
							aon-editDataTable-numberColumn aon-width-80,
							aon-editDataTable-numberColumn aon-width-80,
							aon-editDataTable-numberColumn aon-width-80,
							aon-editDataTable-numberColumn aon-width-80" />

					<ui:define name="columns">

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{productBundle.product_item}" />
							</f:facet>
							<aon:outputText value="#{to.description}"
								rendered="#{to!=controller.to}" />
							<aon:div styleClass="aon-lookup" rendered="#{to==offerDetail.to}">
								<aon:lookupInputText id="OfferDetail_item_product_code-Edit" value="#{offerDetail.to.item.product.code}"
									lookup="#{itemLookup}" reRender="OfferDetail_item_product_name-Edit,OfferDetail_price-Edit,OfferDetail_discount-Edit,OfferDetail_amount-Edit"  
									lookupChangeListener="#{offerDetail.onItemChanged}" onblur="toUpperCase(this);"
									required="true" size="10">
									<aon:joinProperty alias="Item_product_code"	value="#{offerDetail.to.item.product.code}" />
								</aon:lookupInputText>
								<aon:lookupButton
									windowTitle="#{productBundle.product_item_selection}" actionType="search"
									property="#{offerDetail.to.item}" selectReRender="OfferDetail_item_product_code-Edit,OfferDetail_item_product_name-Edit,OfferDetail_price-Edit,OfferDetail_discount-Edit,OfferDetail_amount-Edit"
									lookup="#{itemLookup}" minHeight="460" minWidth="650"
									lookupChangeListener="#{offerDetail.onItemChanged}">
								</aon:lookupButton>
								<aon:inputText id="OfferDetail_item_product_name-Edit" 
									value="#{(offerDetail.to.item.product.name!=null)?(offerDetail.to.item.product.name):('')}"
									disabled="true" size="60" />
							</aon:div>
							<f:facet name="footer">
								<aon:div styleClass="aon-lookup" rendered="#{offerDetail.new}">
									<aon:lookupInputText id="OfferDetail_item_product_code-New" value="#{offerDetail.to.item.product.code}"
										lookup="#{itemLookup}" reRender="OfferDetail_item_product_name-New,OfferDetail_price-New,OfferDetail_discount-New,OfferDetail_amount-New"  
										lookupChangeListener="#{offerDetail.onItemChanged}" onblur="toUpperCase(this);"
										required="true" size="10">
										<aon:joinProperty alias="Item_product_code"	value="#{offerDetail.to.item.product.code}" />
									</aon:lookupInputText>
									<aon:lookupButton
										windowTitle="#{productBundle.product_item_selection}" actionType="search"
										property="#{offerDetail.to.item}" selectReRender="OfferDetail_item_product_code-New,OfferDetail_item_product_name-New,OfferDetail_price-New,OfferDetail_discount-New,OfferDetail_amount-New"
										lookup="#{itemLookup}" minHeight="460" minWidth="650"
										lookupChangeListener="#{offerDetail.onItemChanged}">
									</aon:lookupButton>
									<aon:inputText id="OfferDetail_item_product_name-New" 
										value="#{(offerDetail.to.item.product.name!=null)?(offerDetail.to.item.product.name):('')}"
										disabled="true" size="60" />
								</aon:div>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_quantity}" />
							</f:facet>
							<aon:outputText value="#{to.quantity}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
							</aon:outputText>
							<aon:inputText id="OfferDetail_quantity-Edit" value="#{controller.to.quantity}"
								valueChangeListener="#{controller.onQuantityChanged}" reRender="OfferDetail_price-Edit,OfferDetail_discount-Edit,OfferDetail_amount-Edit" 
								rendered="#{to==controller.to}" required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="OfferDetail_quantity-New" value="#{controller.to.quantity}"
									valueChangeListener="#{controller.onQuantityChanged}" reRender="OfferDetail_price-New,OfferDetail_discount-New,OfferDetail_amount-New" 
									rendered="#{controller.new}" required="true" size="7" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_price}" />
							</f:facet>
							<aon:outputText value="#{to.price}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="OfferDetail_price-Edit" value="#{controller.to.price}"
								reRender="OfferDetail_amount-Edit" 
								rendered="#{to==controller.to}" required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="OfferDetail_price-New" value="#{controller.to.price}"
									reRender="OfferDetail_amount-New" 
									rendered="#{controller.new}" required="true" size="7" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_discount}" />
							</f:facet>
							<aon:outputText value="#{to.discountExpression.discountExpr}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:inputText id="OfferDetail_discount-Edit" value="#{controller.to.discountExpression.discountExpr}"
								reRender="OfferDetail_amount-Edit" 
								rendered="#{to==controller.to}" required="true" size="7" />
							<f:facet name="footer">
								<aon:inputText id="OfferDetail_discount-New" value="#{controller.to.discountExpression.discountExpr}"
									reRender="OfferDetail_amount-New" 
									rendered="#{controller.new}" required="true" size="7" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_amount}" />
							</f:facet>
							<aon:outputText value="#{controller.modelAmount}"
								rendered="#{to!=controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<aon:outputText id="OfferDetail_amount-Edit" value="#{controller.amount}"
								rendered="#{to==controller.to}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
							<f:facet name="footer">
								<aon:div style="text-align:right;">
									<aon:outputText id="OfferDetail_amount-New" value="#{controller.amount}"
										rendered="#{controller.new}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:outputText id="Offer_taxableBase" value="#{offer.taxableBase}"
										rendered="#{!controller.new}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
							</f:facet>
						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:panel>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
		<aon:lookupButtonPopup lookup="#{sellerLookup}" />
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
	</ui:define>
</ui:composition>
