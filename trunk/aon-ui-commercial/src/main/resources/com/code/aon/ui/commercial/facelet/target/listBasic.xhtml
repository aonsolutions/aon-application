<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<c:if test="#{lookup != null}">
		<ui:param name="aliasPreffix" value="#{lookup.pojoShortName}"/>
	</c:if>
	<c:if test="#{lookup == null}">
		<ui:param name="aliasPreffix" value="#{controller.aliasPreffix}"/>
	</c:if>
		
	<aon:column alias="#{aliasPreffix}.id"
		styleClass="aon-editDataTable-numberColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_id}" />
		</f:facet>
		<aon:outputText value="#{to.id}"/>
	</aon:column>

	<aon:column alias="#{aliasPreffix}.registry.document"
		styleClass="aon-editDataTable-textColumn aon-width-100">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_document}" />
		</f:facet>
		<aon:outputText value="#{to.registry.document}" />
	</aon:column>

	<aon:column alias="#{aliasPreffix}.registry.name"
		styleClass="aon-editDataTable-textColumn aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_company_name}" />
		</f:facet>
		<aon:outputText value="#{to.registry.fullName}" />
	</aon:column>

</ui:composition>

</body>
</html>
