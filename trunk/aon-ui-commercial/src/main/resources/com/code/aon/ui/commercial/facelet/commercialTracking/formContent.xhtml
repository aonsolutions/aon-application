<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelGrid columns="2" style="width: 100%"
		columnClasses="aon-panelGrid-odd aon-width-170,aon-panelGrid-even">

		<c:if test="#{!skipProjectData}">
			<aon:outputLabel for="ProjectCommercial_id" 
				value="#{commercialBundle.commercial_operation_module}" />
			<aon:div>
				<ui:include src="/com/code/aon/ui/commercial/facelet/projectCommercial/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{commercialTracking.to.project}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="lookupReRender"
						value="CommercialTracking_project_detail" />
					<aon:methodParam name="lookupChangeListener"
						value="#{commercialTracking.projectChanged}" type="lookupChangeListener" />							
				</ui:include>
				<aon:div id="CommercialTracking_project_detail" >
					<aon:panelGrid styleClass="aon-margin-top aon-margin-bottom"
	 					columns="2" columnClasses="aon-noborder"
						rendered="#{commercialTracking.to.project.id != null}" >
						<aon:outputText value="#{commercialBundle.commercial_target}"	
							styleClass="aon-margin-right aon-italic aon-bold" />
						<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{commercialTracking.to.project.target}" />
							<ui:param name="lookupDisabled" value="#{true}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="lookupSuffix" value="-TrackingTarget" />
						</ui:include>					
						<aon:outputText value="#{bundle.aon_comment}"	
							styleClass="aon-margin-right aon-italic aon-bold" />
						<aon:inputTextarea cols="78" rows="2" disabled="true"
							value="#{commercialTracking.to.project.comments}"
							style="margin-top: 0.1em;" />
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</c:if>
	
		<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{commercialTracking.to.seller}" />
			<ui:param name="idRequired" value="#{true}" />
			<ui:param name="lookupSuffix" value="-TrackingSeller" />
		</ui:include>					
	
		<aon:outputLabel for="CommercialTracking_date"
			value="#{bundle.aon_date}" />
		<aon:div id="CommercialTracking_dateDiv">
			<a4j:region>
				<aon:selectInputDate id="CommercialTracking_date"
					value="#{commercialTracking.to.date}" required="true"
					timeZone="#{timeZoneController.timeZone}" inputSize="16"
					popupDateFormat="#{(commercialTracking.to.allDay)?(bundle.aon_date_pattern):(bundle.aon_timestamp2_pattern)}">									
				</aon:selectInputDate>
				<c:if test="#{!commercialTracking.to.allDay}" >
					<aon:outputLabel for="CommercialTracking_date-To"
						styleClass="aon-margin-left aon-margin-right aon-italic"
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="CommercialTracking_date-To"
						value="#{commercialTracking.to.endDate}"
						timeZone="#{timeZoneController.timeZone}" inputSize="16"
						popupDateFormat="#{bundle.aon_timestamp2_pattern}">									
					</aon:selectInputDate>
				</c:if>
				<aon:selectBooleanCheckbox id="CommercialTracking_allDay" 
					value="#{commercialTracking.to.allDay}" ajaxSingle="false"
					reRender="CommercialTracking_dateDiv" />						
				<aon:outputLabel for="CommercialTracking_allDay"
					value="#{commercialBundle.commercial_tracking_allDay}" />
			</a4j:region>
		</aon:div>
		
		<aon:outputLabel for="CommercialTracking_activity_id"
			value="#{commercialBundle.commercial_tracking_activity}" />
		<h:panelGrid columns="3" >						
			<aon:selectOneMenu id="CommercialTracking_activity_id"
				required="true" value="#{commercialTracking.to.activity}">
				<f:selectItem itemLabel="-" value="#{null}"/>
				<f:selectItems value="#{commercialCollections.activities}" />
			</aon:selectOneMenu>
			<aon:div styleClass="aon-margin-left">							
				<aon:selectBooleanCheckbox id="CommercialTracking_offer_check"
					reRender="CommercialTracking_activity_offer" 
					valueChangeListener="#{commercialTracking.offerChanged}"
					value="#{commercialTracking.offerChecked}">
				</aon:selectBooleanCheckbox>
				<aon:outputLabel for="CommercialTracking_offer_check"
					value="#{commercialBundle.commercial_offer}" />
			</aon:div>							
			<aon:div id="CommercialTracking_activity_offer"
				styleClass="aon-lookup aon-margin-left">
				<c:if test="#{commercialTracking.offerChecked}">
					<ui:decorate template="/com/code/aon/ui/commercial/facelet/offer/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{commercialTracking.to.offer}" />
						<ui:param name="lookupControllerListener" value="#{commercialTracking.offerFilter}" />
						<ui:define name="beforeLookupContent">
							<aon:inputText size="20" disabled="true" 
								value="#{commercialTracking.to.offer.referenceCode}" />
						</ui:define>
					</ui:decorate>								
				</c:if>					
			</aon:div>																			
		</h:panelGrid>
	
		<aon:outputLabel for="CommercialTracking_status"
			value="#{bundle.aon_status}" />
		<aon:selectOneRadio id="CommercialTracking_status"
			value="#{commercialTracking.to.status}">
			<f:selectItems
				value="#{commercialCollections.commercialTrackingStatuses}" />
		</aon:selectOneRadio>
	
		<aon:outputLabel for="CommercialTracking_comments"
			value="#{bundle.aon_comment}" />
		<aon:inputTextarea id="CommercialTracking_comments"
			value="#{commercialTracking.to.comments}" cols="82" rows="4">
			<f:validateLength maximum="65535" />
		</aon:inputTextarea>
			
		<aon:outputLabel for="CommercialTracking_location"
			value="#{commercialBundle.commercial_tracking_location}" />
		<aon:inputText id="CommercialTracking_location"
			value="#{commercialTracking.to.location}" size="80" maxlength="255" />											

		<aon:outputLabel for="CommercialTracking_next_id"
			value="#{commercialBundle.commercial_tracking_next_action}" />
		<aon:selectBooleanCheckbox id="CommercialTracking_next_id"
			reRender="next_action" process="CommercialTracking_location"
			actionListener="#{commercialTracking.onNextChanged}"
			value="#{commercialTracking.nextAction}">
		</aon:selectBooleanCheckbox>

	</aon:panelGrid>

	<aon:div id="next_action" styleClass="aon-margin-top">
		<aon:div styleClass="aon-group" rendered="#{commercialTracking.nextAction}">
			<aon:div styleClass="aon-group-title">
				<aon:outputText value="#{commercialBundle.commercial_tracking_next_action}"/>
			</aon:div>
			<aon:div styleClass="aon-group-body"> 
				<aon:div styleClass="aon-group-body-internal">
					<aon:panelGrid columns="2" style="width: 100%"
						columnClasses="aon-panelGrid-odd aon-width-160,aon-panelGrid-even">

						<ui:include src="/com/code/aon/ui/seller/facelet/seller/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{commercialTracking.next.seller}" />
							<ui:param name="lookupSuffix" value="-NextTrackingSeller" />
							<ui:param name="idRequired" value="#{true}" />
						</ui:include>	
	
						<aon:outputLabel for="CommercialTracking_next_date"
							value="#{bundle.aon_date}" />
						<aon:selectInputDate id="CommercialTracking_next_date"
							value="#{commercialTracking.next.date}" required="true"
							timeZone="#{timeZoneController.timeZone}" inputSize="16"
							popupDateFormat="#{bundle.aon_timestamp2_pattern}">									
						</aon:selectInputDate>

						<aon:outputLabel for="CommercialTracking_next_activity_id"
							value="#{commercialBundle.commercial_tracking_activity}" />
						<aon:selectOneMenu id="CommercialTracking_next_activity_id"
							required="true" value="#{commercialTracking.next.activity}">
							<f:selectItem itemLabel="-" value="#{null}"/>
							<f:selectItems value="#{commercialCollections.activities}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="CommercialTracking_next_comments"
							value="#{bundle.aon_comment}" />
						<aon:inputTextarea id="CommercialTracking_next_comments"
							value="#{commercialTracking.next.comments}" cols="82" rows="4">
							<f:validateLength maximum="65535" />
						</aon:inputTextarea>
					
						<aon:outputLabel for="CommercialTracking_next_location"
							value="#{commercialBundle.commercial_tracking_location}" />
						<aon:inputText id="CommercialTracking_next_location"
							value="#{commercialTracking.next.location}" size="80" maxlength="255" />									

					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:div>
	</aon:div>

</ui:composition>
