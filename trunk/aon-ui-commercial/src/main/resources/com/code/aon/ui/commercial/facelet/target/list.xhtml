<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="targetList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_target_module}" />
				<ui:param name="controller" value="#{target}" />
				
				<ui:define name="additionalToolbarContent">
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="targetList" />
					</h:commandLink>
					<h:commandLink value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-excel"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="targetList" />
						<f:param name="outputFormat" value="MS Excel" />
					</h:commandLink>						
				</ui:define>				
			</ui:decorate>		
			
			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
		
				<aon:dataTable id="targetData" value="#{target.model}"
					var="to" rows="20" rendered="#{target.model.rowCount > 0}"
					columnClasses="aon-editDataTable-numberColumn aon-width-70, aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn">
		
					<aon:rowSelector action="target_form" actionListener="#{target.onSelect}" />
					
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}"/>
					</aon:column>
		
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.registry.document}" />
					</aon:column>
		
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_name}" />
						</f:facet>
						<aon:outputText value="#{to.registry.name}" />
					</aon:column>
		
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{registryBundle.registry_surname}" />
						</f:facet>
						<aon:outputText value="#{to.registry.surname}" />
					</aon:column>
		
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_alias}" />
						</f:facet>
						<aon:outputText value="#{to.registry.alias}" />
					</aon:column>
		
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{commercialBundle.commercial_target_advertising}" />
						</f:facet>
						<aon:outputText value="#{to.advertising}"/>
					</aon:column>
		
				</aon:dataTable>
		
				<aon:dataScroller2 for="targetData" showNote="true" />
		
			</aon:div>

		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
