<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{targetItem}" />
		<ui:param name="columnClasses" value="aon-editDataTable-textColumn, aon-editDataTable-textColumn" />
		<ui:define name="columns">

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{productBundle.product_item}" />
				</f:facet>
				<aon:outputText value="#{to.item.product.name} #{to.item.detail}"
					rendered="#{to!=targetItem.to}" />
				<aon:div styleClass="aon-lookup" rendered="#{to==targetItem.to}">
					<aon:lookupInputText 
						lookup="#{itemLookup}" required="true"
						reRender="TargetItem_item_detail"
						value="#{targetItem.to.item.id}" size="5">
					</aon:lookupInputText>
					<aon:lookupButton
						windowTitle="#{productBundle.product_item_selection}" actionType="search"
						selectReRender="targetItemData"
						lookup="#{itemLookup}" minHeight="460" minWidth="650"
						property="#{targetItem.to.item}">
					</aon:lookupButton>
					<aon:inputText id="TargetItem_item_detail"
						value="#{(to.item.product.name!=null)?(to.item.product.name):('')}"
						size="60" disabled="true" />
				</aon:div>
				<f:facet name="footer">
					<aon:div styleClass="aon-lookup" rendered="#{targetItem.new}">
						<aon:lookupInputText id="TargetItem_item_id-New"
							lookup="#{itemLookup}" required="true"
							reRender="TargetItem_item_detail-New"
							value="#{targetItem.to.item.id}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="TargetItem_item_id_lookup-New"
							windowTitle="#{productBundle.product_item_selection}" actionType="search"
							selectReRender="TargetItem_item_id-New,TargetItem_item_detail-New"
							lookup="#{itemLookup}" minHeight="460" minWidth="650"
							property="#{targetItem.to.item}">
						</aon:lookupButton>
						<aon:inputText id="TargetItem_item_detail-New"
							value="#{(targetItem.to.item.product.name!=null)?(targetItem.to.item.product.name):('')}"
							size="60" disabled="true" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_status}" />
				</f:facet>
				<aon:outputText value="#{to.status}"
					rendered="#{to!=targetItem.to}" />
				<aon:selectOneMenu rendered="#{to==targetItem.to}"
					required="true" value="#{to.status}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{commercialCollections.targetItemStatuses}" />
				</aon:selectOneMenu>								
				<f:facet name="footer">
					<aon:selectOneMenu rendered="#{targetItem.new}"
						required="true" value="#{targetItem.to.status}">
						<f:selectItem itemLabel="-" value="#{null}"/>
						<f:selectItems value="#{commercialCollections.targetItemStatuses}" />
					</aon:selectOneMenu>								
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
