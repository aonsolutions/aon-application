<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="commercialTermList">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{commercialBundle.commercial_commission_control_module}" />
					<ui:param name="controller" value="#{offerDetailCommission}" />
					<ui:param name="skipSearchButton" value="false" />
					<ui:param name="skipResetButton" value="true" />
				</ui:include>

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">

					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{offerDetailCommission}" />
						<ui:param name="skipResetButton" value="true" />
						<ui:define name="columns">


							<aon:column style="aon-width-100 aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{salesBundle.sales_seller}" />
								</f:facet>
								<aon:outputText value="#{to.offer.seller.registry.fullName}">
									<aon:abbreviateConverter maxWidth="50" />
								</aon:outputText>
								<f:facet name="footer">
								</f:facet>
							</aon:column>

							<aon:column style="aon-width-200 aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{commercialBundle.commercial_offer}" />
								</f:facet>
								<aon:div style="vertical-align: bottom;">
									<aon:outputText value="#{to.offer.referenceCode}"
										style="font-weight: bold;" />
									<aon:outputText value="#{to.offer.issueDate}"
										styleClass="aon-nowrap"
										style="margin-left: 5px;">
										<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
											timeZone="#{timeZoneController.timeZoneId}" />
									</aon:outputText>
									<aon:outputText value="#{to.offer.status}"
										style="margin-left: 5px;" />
								</aon:div>
								<aon:div style="vertical-align: bottom;">
									<aon:outputText value="#{to.offer.target.registry.fullName}"
										style="padding-left: 10px;" />
								</aon:div>
								<aon:div style="vertical-align: bottom;" rendered="#{to.offer.thirdPartyType}">
									<aon:outputText value="#{to.offer.thirdParty.registry.fullName}"
										style="padding-left: 10px;" />
								</aon:div>
								<f:facet name="footer">
								</f:facet>
							</aon:column>

							<aon:column style="aon-width-200 aon-editDataTable-textColumn">
								<f:facet name="header">
									<aon:outputText value="#{productBundle.product_item}" />
								</f:facet>
								<aon:div>
									<aon:outputText value="#{to.offerDetail.description}">
										<aon:abbreviateConverter maxWidth="50" />
									</aon:outputText>
								</aon:div>
								<aon:div style="margin-left: 10px;">
									<aon:outputText styleClass="aon-form-date-label" value="#{bundle.aon_quantity}:" />
									<aon:outputText value="#{to.offerDetail.quantity}" style="margin-left: 5px;">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:outputText styleClass="aon-form-date-label" value="#{bundle.aon_price}:" />
									<aon:outputText value="#{to.offerDetail.price}" style="margin-left: 5px;">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
									<aon:outputText styleClass="aon-form-date-label" value="#{bundle.aon_discount}:" />
									<aon:outputText value="#{to.offerDetail.discountExpression.discountExpr}" style="margin-left: 5px;">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</aon:outputText>
								</aon:div>
								<f:facet name="footer">
								</f:facet>
							</aon:column>

							<aon:column
								styleClass="aon-editDataTable-numberColumn aon-width-80">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_taxable_base}" />
								</f:facet>
								<aon:outputText value="#{controller.rowAmount}">
									<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
								</aon:outputText>
								<f:facet name="footer">
								</f:facet>
							</aon:column>

							<aon:column
								styleClass="aon-editDataTable-numberColumn aon-width-80">
								<f:facet name="header">
									<aon:outputLabel for="OfferDetail_discount" value="#{bundle.aon_percentage}" />
								</f:facet>
								<aon:outputText value="#{to.commission}" rendered="#{!formEdit}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
								<aon:inputText id="OfferDetail_discount" rendered="#{formEdit}" 
									value="#{controller.to.commission}"
									valueChangeListener="#{controller.onChangeCommission}" 
									reRender="OfferDetail_amount" required="true" size="5"
									focus="OfferDetail_amount" />
								<f:facet name="footer">
								</f:facet>
							</aon:column>

							<aon:column
								styleClass="aon-editDataTable-numberColumn aon-width-80">
								<f:facet name="header">
									<aon:outputLabel for="OfferDetail_amount" value="#{bundle.aon_amount}" />
								</f:facet>
								<aon:outputText value="#{to.amount}" rendered="#{!formEdit}">
									<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
								</aon:outputText>
								<aon:inputText id="OfferDetail_amount" 
									value="#{controller.to.amount}" rendered="#{formEdit}"
									required="true" size="8" />
								<f:facet name="footer">
								</f:facet>
							</aon:column>

							<aon:column
								styleClass="aon-editDataTable-numberColumn aon-width-100">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_status}" />
								</f:facet>
								<aon:div rendered="#{!formEdit}">
									<aon:div>
										<aon:outputText value="#{to.status}"/>
									</aon:div>
									<aon:div style="margin-left: 10px; white-space: no-wrap;">
										<aon:outputText styleClass="aon-form-date-label" value="#{bundle.aon_date}:" />
										<aon:outputText value="#{to.payDate}"
											style="margin-left: 5px;">
											<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
												timeZone="#{timeZoneController.timeZoneId}" />
										</aon:outputText>
									</aon:div>
								</aon:div>
								<aon:selectOneMenu value="#{controller.to.status}" rendered="#{formEdit}">
									<f:selectItems value="#{commercialCollections.offerDetailCommissionStatuses}"/>
								</aon:selectOneMenu>
								<f:facet name="footer">
								</f:facet>
							</aon:column>

						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
