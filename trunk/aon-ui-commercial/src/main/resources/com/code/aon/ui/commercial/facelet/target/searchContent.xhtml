<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputText value="" />
	<aon:div style="width:510px;">
		<aon:panelCollapsible expanded="true" label="#{commercialBundle.commercial_target}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<ui:include src="/com/code/aon/ui/commercial/facelet/target/searchBasicContent.xhtml">
					<ui:param name="controller" value="#{target}"/>
				</ui:include>
			</aon:panelGrid>
		</aon:panelCollapsible>					
					
		<aon:panelCollapsible expanded="false" label="#{registryBundle.registry_address_module}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<aon:outputLabel for="Target_registry_addresses_address"
					value="#{registryBundle.registry_address}" />
				<aon:inputText id="Target_registry_addresses_address" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />
				<aon:outputLabel for="Target_registry_addresses_zip"
					value="#{registryBundle.registry_zip}" />
				<aon:inputText id="Target_registry_addresses_zip" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />
				<aon:outputLabel for="Target_registry_addresses_city"
					value="#{registryBundle.registry_city}" />
				<aon:inputText id="Target_registry_addresses_city" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />
				<aon:outputLabel for="Target_registry_addresses_geozone_id"
					value="#{registryBundle.registry_geozone}" />
				<aon:selectOneMenu id="Target_registry_addresses_geozone_id" 
					value="#{geozoneCollections.geoZone}"
					valueChangeListener="#{controller.addDirectIdEqualExpression}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{geozoneCollections.geoTrees}" />
				</aon:selectOneMenu>			
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{registryBundle.registry_media_module}" >
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">
				<aon:outputLabel for="Target_registry_medias_mediaType"
					value="#{registryBundle.registry_media_type}" />
				<aon:div id="mediaTypeDiv">
					<a4j:repeat value="#{targetSearch.mediaTypes}" rowKeyVar="index" var="mediaType">
						<aon:div styleClass="#{(index != 0)?'aon-padding-top':''}">
							<aon:selectOneMenu id="Target_registry_medias_mediaType"
								converter="aon.EnumConverter" 
								value="#{targetSearch.mediaTypes[index]}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{registryCollections.mediaTypes}" />
								<a4j:support event="onchange" reRender="mediaTypeDiv"/>
							</aon:selectOneMenu>
							<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-minus" reRender="mediaTypeDiv"
								actionListener="#{targetSearch.onRemoveMediaType}"
								rendered="#{mediaType != null}">
								<f:param name="index" value="#{index}" />
							</aon:commandButton>
							<aon:commandButton styleClass="aon-finding-toolbar-item aon-search-add" reRender="mediaTypeDiv"
								actionListener="#{targetSearch.onAddMediaType}"
								rendered="#{(mediaType != null) and (index == (targetSearch.mediaTypesSize-1))}"/>					
						</aon:div>						
					</a4j:repeat>
				</aon:div>			
				<aon:outputLabel for="Target_registry_medias_value"
					value="#{bundle.aon_value}" />
				<aon:inputText id="Target_registry_medias_value" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />
				<aon:outputLabel for="Target_registry_medias_comment"
					value="#{bundle.aon_comment}" />
				<aon:inputText id="Target_registry_medias_comment" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />
			</aon:panelGrid>
		</aon:panelCollapsible>
				
		<aon:panelCollapsible expanded="false" label="#{commercialBundle.commercial_target_segment_module}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even" style="width:460px;">					
				<aon:outputLabel for="Target_segments_segment_id"
					value="#{bundle.aon_name}" />
				<aon:selectOneMenu id="Target_segments_segment_id"
					valueChangeListener="#{controller.addDirectExpression}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{controller.segments}" />
				</aon:selectOneMenu>
			</aon:panelGrid>		
		</aon:panelCollapsible>
						
		<aon:panelCollapsible expanded="false" label="#{productBundle.product_module}" >					
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">					
				<aon:outputLabel for="Target_items_item_product_code"
					value="#{bundle.aon_id}" />
				<aon:inputText id="Target_items_item_product_code"
					size="20" valueChangeListener="#{controller.addDirectExpression}" />
				
				<aon:outputLabel for="Target_items_item_product_name"
					value="#{bundle.aon_description}" />
				<aon:inputText id="Target_items_item_product_name"
					size="60" valueChangeListener="#{controller.addDirectExpression}" />
				 
				<aon:outputLabel for="Target_items_item_product_category_id"
					value="#{productBundle.product_category}" />
				<aon:selectOneMenu id="Target_items_item_product_category_id"
					value="#{productCollections.category}"
					valueChangeListener="#{controller.addDirectIdEqualExpression}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{productCollections.categories}" />
				</aon:selectOneMenu>
				
				<aon:outputLabel for="Target_items_item_status"
					value="#{bundle.aon_status}" />
				<aon:selectOneMenu id="Target_items_item_status"
					converter="aon.EnumConverter"
					valueChangeListener="#{controller.addDirectExpression}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{productCollections.productStatuses}" />
				</aon:selectOneMenu>
			</aon:panelGrid>
		</aon:panelCollapsible>
						
		<aon:panelCollapsible expanded="false" label="#{salesBundle.sales_seller}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">					
				<aon:outputLabel for="Target_sellers_seller_id"
					value="#{bundle.aon_id}" />
				<aon:inputText id="Target_sellers_seller_id" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />
			
				<aon:outputLabel for="Target_sellers_seller_registry_document"
					value="#{bundle.aon_company_document}" />
				<aon:inputText id="Target_sellers_seller_registry_document" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />
			
				<aon:outputLabel for="Target_sellers_seller_registry_name"
					value="#{bundle.aon_company_name}" />
				<aon:inputText id="Target_sellers_seller_registry_name" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />
			
				<aon:outputLabel for="Target_sellers_seller_registry_surname"
					value="#{registryBundle.registry_surname}" />
				<aon:inputText id="Target_sellers_seller_registry_surname" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />
			
				<aon:outputLabel for="Target_sellers_seller_registry_alias"
					value="#{bundle.aon_company_alias}" />
				<aon:inputText id="Target_sellers_seller_registry_alias" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />
			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{commercialBundle.commercial_target_tracking_module}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
				<aon:outputText value="#{bundle.aon_date}" />
				<aon:div>
					<aon:outputLabel for="Target_trackings_date-From" styleClass="aon-form-date-label"
						value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Target_trackings_date-From"
						value="#{targetSearch.trackingDateFrom}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
		
					<aon:outputLabel for="Target_trackings_date-To" styleClass="aon-form-date-label"
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Target_trackings_date-To"
						value="#{targetSearch.trackingDateTo}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>
				</aon:div>
		
				<aon:outputLabel for="Target_trackings_seller_id"
					value="#{salesBundle.sales_seller}" />
				<aon:div styleClass="aon-lookup">
					<aon:lookupInputText id="Target_trackings_seller_id"
						lookup="#{sellerLookup}"
						reRender="Target_trackings_seller_name"
						value="#{targetSearch.seller.id}" size="5">
					</aon:lookupInputText>
					<aon:lookupButton id="Target_trackings_seller_lookup"
						windowTitle="#{appBundle.aon_lookup_seller}"
						selectReRender="Target_trackings_seller_id,Target_trackings_seller_name"
						lookup="#{sellerLookup}" minHeight="440"
						property="#{targetSearch.seller}">
					</aon:lookupButton>
					<aon:inputText id="Target_trackings_seller_name"
						value="#{(targetSearch.seller.registry.name!=null)?(targetSearch.seller.registry.fullName):('')}"
						size="44" disabled="true" />
				</aon:div>		
				
				<aon:outputLabel for="Target_trackings_activity_id"
					value="#{commercialBundle.commercial_tracking_activity}" />
				<aon:selectOneMenu id="Target_trackings_activity_id" 
					value="#{targetSearch.activity}">
					<f:selectItem itemLabel="-" value="#{null}"/>
					<f:selectItems value="#{commercialCollections.activities}" />
				</aon:selectOneMenu>

				<aon:outputText value="#{bundle.aon_status}"/>
				<aon:selectManyCheckbox value="#{targetSearch.trackingStatuses}">
					<f:selectItems value="#{commercialCollections.commercialTrackingStatuses}"/>
				</aon:selectManyCheckbox>							

				<aon:outputLabel for="Target_trackings_comments"
					value="#{bundle.aon_comment}" />
				<aon:inputText id="Target_trackings_comments" size="60"
					valueChangeListener="#{controller.addDirectExpression}" />													
			</aon:panelGrid>
		</aon:panelCollapsible>						
	</aon:div>

</ui:composition>
