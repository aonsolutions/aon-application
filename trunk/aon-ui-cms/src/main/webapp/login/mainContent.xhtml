<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-components" version="1.2">

<body>
<ui:composition>
	<aon:div styleClass="aon-login">
		<aon:div styleClass="aon-login-box-internal">
			<aon:div styleClass="aon-login-title">
				<aon:outputText value="#{securityBundle.aon_login_legend}" />
			</aon:div>
		</aon:div>
		<aon:div styleClass="aon-login-box">
			<aon:div styleClass="aon-login-box-internal">
				<aon:div styleClass="aon-login-instruction">
					<aon:outputText value="#{securityBundle.aon_login_label}" />
				</aon:div>
				<aon:div styleClass="aon-errors" rendered="#{failedLogin.exception}">
					<aon:div styleClass="aon-error-message">
						<aon:outputText value="#{failedLogin.message}" />
					</aon:div>
				</aon:div>
				<aon:div styleClass="aon-login-form">
					<form id="login" method="post"
						action="j_security_check" style="display: inline;">
						<aon:div
						styleClass="aon-login-form-group">
						<aon:div>
							<aon:outputLabel for="j_username"
								value="#{securityBundle.aon_login_user}:"
								styleClass="aon-form-input-text-label" />
						</aon:div>
						<aon:div>
							<input type="text" id="j_username" name="j_username"
								class="aon-form-input-text"
								onblur="this.value=this.value +'@localhost/cms';"
								onfocus="if (user_entry) this.form.j_password.focus()" />
						</aon:div>
					</aon:div> <aon:div styleClass="aon-login-form-group">
						<aon:div>
							<aon:outputLabel for="j_password"
								value="#{securityBundle.aon_login_passwd}:"
								styleClass="aon-form-input-text-label" />
						</aon:div>
						<aon:div>
							<input type="password" id="j_password" name="j_password"
								class="aon-form-input-text aon-form-input-text-password" />
							<input id="login_btn" name="login_btn" type="submit" value=""
								class="aon-login-button"/>
						</aon:div>
					</aon:div></form>
				</aon:div>
			</aon:div>
		</aon:div>
	</aon:div>
	
</ui:composition>
</body>
</html>
