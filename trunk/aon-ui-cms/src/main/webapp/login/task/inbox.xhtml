<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-components">
<body>

<ui:composition>

	<aon:dataTable id="taskDataList" value="#{task.inboxModel}" var="to"
		rows="20" 
		styleClass="aon-dataTable">

		<aon:column id="column1">
			<f:facet id="facet-task" name="header">
				<f:verbatim>&#160;</f:verbatim>
			</f:facet>
			<aon:div id="grapicImage-mytask" style="width:14px; height:14px;"
				rendered="#{task.myListTask}">
				<aon:graphicImage url="/css/images/icons/aon-user-icon.gif"
					alt="#{projectBundle.task_user_task} #{to.employee.registry.name} #{to.employee.registry.surname}" />
			</aon:div>
			<aon:div id="grapicImage-no-mytask" style="width:14px; height:14px;"
				rendered="#{!task.myListTask}">
				<aon:graphicImage url="/css/images/icons/aon-group-icon.gif"
					alt="#{projectBundle.task_group_task} #{to.workGroup.description}" />
			</aon:div>
		</aon:column>

		<aon:column id="column2">
			<f:facet id="facet-desc" name="header">
				<f:verbatim>&#160;</f:verbatim>
				<!-- 
				<aon:outputText id="ot1" value="#{projectBundle.aon_description}" />
				 -->
			</f:facet>
			<aon:outputText id="desc" value="#{to.description}" />
		</aon:column>

		<aon:column id="column3">
			<f:facet id="facet-customer" name="header">
				<f:verbatim>&#160;</f:verbatim>
				<!-- 
				<aon:outputText id="ot2" value="#{customerBundle.customer_customer}" />
				 -->
			</f:facet>
			<aon:outputText id="customer"
				value="#{to.dossier.customer.registry.name} #{to.dossier.customer.registry.surname}" />
		</aon:column>

		<aon:column id="column4">
			<f:facet id="facet-dossierNumber" name="header">
				<f:verbatim>&#160;</f:verbatim>
				<!-- 
				<aon:outputText id="ot3" value="#{projectBundle.dossier_dossier}" />
				 -->
			</f:facet>
			<aon:outputText id="dossierNumber" value="#{to.dossier.number}" />
		</aon:column>

		<aon:column id="column5">
			<f:facet id="facet-startDate" name="header">
				<f:verbatim>&#160;</f:verbatim>
				<!-- 
				<aon:outputText id="ot4" value="#{projectBundle.aon_initial_date}" />
				 -->
			</f:facet>
			<aon:outputText id="startDate" value="#{to.startDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column id="column6">
			<f:facet id="facet-dueDate" name="header">
				<f:verbatim>&#160;</f:verbatim>
				<!-- 
				<aon:outputText id="ot5" value="#{projectBundle.aon_final_date}" />
				 -->
			</f:facet>
			<aon:outputText id="dueDate" value="#{to.dueDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:column>

		<aon:column id="column7">
			<f:facet id="facet-priority" name="header">
				<f:verbatim>&#160;</f:verbatim>
				<!-- 
				<aon:outputText id="ot6" value="#{projectBundle.task_priority}" />
				 -->
			</f:facet>
			<aon:outputText id="priority" value="#{to.priority}" />
		</aon:column>

		<aon:column id="column8">
			<f:facet id="facet-percent" name="header">
				<f:verbatim>&#160;</f:verbatim>
				<!-- 
				<aon:outputText id="ot7" value="#{projectBundle.task_percent_abv}" />
				 -->
			</f:facet>
			<aon:outputText id="percent" value="#{to.percent}" />
		</aon:column>

		<aon:column id="column9">
			<f:facet id="facet-status" name="header">
				<f:verbatim>&#160;</f:verbatim>
				<!-- 
				<aon:outputText id="ot8" value="#{projectBundle.aon_status}" />
				 -->
			</f:facet>
			<aon:outputText id="status" value="#{to.status}" />
		</aon:column>

	</aon:dataTable>
	<!-- 
	<ui:include src="/facelet/shared/dataScroller.xhtml">
		<ui:param name="dataTable" value="taskDataList" />
		<ui:param name="model" value="#{task.model}" />
		<ui:param name="showNote" value="#{true}" />
	</ui:include>
 -->

</ui:composition>

</body>
</html>
