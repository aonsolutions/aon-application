<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ice="http://www.icesoft.com/icefaces/component"
	xmlns:aon="http://www.code.es/aon-ice-components">
<body>

<ui:composition>
	<aon:div id="aon-main-menu" forceId="#{true}">
		<aon:panelGroup id="menu_group">
			<!-- main menu declaration  -->
			<aon:form id="menu_form">
				<aon:menuBar id="menubar"
					imageDir="#{facesContext.externalContext.requestContextPath}/xmlhttp/css/xp/css-images/">
					<aon:menuItem id="configuration" value="#{menuBundle.cms_configuration}">
						<aon:menuItem id="language" value="#{menuBundle.cms_language}" 
							actionListener="#{language.onReset}" action="language_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="config" value="#{menuBundle.cms_config}" 
							actionListener="#{config.onInit}" action="config_form"
							styleClass="aon-main-menu-leaf"/>
					</aon:menuItem>
					<aon:menuItem id="content" value="#{menuBundle.cms_content}">
						<aon:menuItem id="menu" value="#{menuBundle.cms_menu}"
							actionListener="#{menu.onReset}" action="menu_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="header" value="#{menuBundle.cms_header}"
							actionListener="#{headers.onInit}" action="header_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="footer" value="#{menuBundle.cms_footer}"
							actionListener="#{footer.onReset}" action="footer_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="sidebar" value="#{menuBundle.cms_sidebar}"
							actionListener="#{sidebar.onReset}" action="sidebar_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="section" value="#{menuBundle.cms_section}"
							actionListener="#{section.onReset}" action="section_list"
							styleClass="aon-main-menu-leaf"/>							
						<aon:menuItem id="modular_page" value="#{menuBundle.cms_modular_page}"
							actionListener="#{modular_page.onReset}" action="modular_page_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="image_gallery" value="#{menuBundle.cms_image_gallery}"
							action="gallery_list"
							actionListener="#{gallery.onInit}"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="document_gallery" value="#{menuBundle.cms_document_gallery}"
							action="document_list"
							actionListener="#{document.onInit}"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="generic_page" value="#{menuBundle.cms_generic_page}"
							actionListener="#{generic_page.onReset}" action="generic_page_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="link_category" value="#{menuBundle.cms_link_category}"
							actionListener="#{link_category.onReset}" action="link_category_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="faq_category" value="#{menuBundle.cms_faq_category}"
							actionListener="#{faq_category.onReset}" action="faq_category_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="article_category" value="#{menuBundle.cms_article_category}"
							actionListener="#{article_category.onReset}" action="article_category_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="banner_category" value="#{menuBundle.cms_banner_category}"
							actionListener="#{banner_category.onReset}" action="banner_category_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="download_category" value="#{menuBundle.cms_download_category}"
							actionListener="#{download_category.onInit}" action="download_category_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="album_category" value="#{menuBundle.cms_album_category}"
							actionListener="#{album_category.onReset}" action="album_category_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="direct_access_group_page" value="#{menuBundle.cms_direct_access_group}"
							actionListener="#{direct_access_group.onReset}" action="direct_access_group_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="brand" value="#{menuBundle.cms_brand}"
							actionListener="#{brand.onReset}" action="brand_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="productCategory" value="#{menuBundle.cms_product_category}"
							actionListener="#{productCategory.onReset}" action="product_category_list"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="product" value="#{menuBundle.cms_product}"
							actionListener="#{product.onReset}" action="product_list"
							styleClass="aon-main-menu-leaf"/>
					</aon:menuItem>
					<aon:menuItem id="production" value="#{menuBundle.cms_production}">
						<aon:menuItem id="template" value="#{menuBundle.cms_template}"
							action="template_list" actionListener="#{template.onInit}" 
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="generator" value="#{menuBundle.cms_generate_pages}"
							action="generator_form"
							styleClass="aon-main-menu-leaf"/>
						<aon:menuItem id="preview" value="#{menuBundle.cms_preview}"
							actionListener="#{preview.onReset}" action="preview_form"
							styleClass="aon-main-menu-leaf"/>
					</aon:menuItem>
				</aon:menuBar>
			</aon:form>
		</aon:panelGroup>
	</aon:div>
</ui:composition>

</body>
</html>
