<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="downloadForm" partialSubmit="false">

			<aon:div styleClass="aon-content-toolbar" forceId="#{true}"
				id="aon-content-toolbar">
				<aon:div styleClass="aon-content-toolbar-internal">
					<aon:div styleClass="aon-content-toolbar-item-group">
						<aon:confirmButton id="save"
							value="#{bundle.aon_save}" rendered="#{download.to!=null or download.new}"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_save_confirm}"
							confirmActionListener="#{download.onAccept}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:confirmButton id="cancel"
							value="#{bundle.aon_cancel}" rendered="#{download.to!=null or download.new}" immediate="#{true}"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{download.onCancel}" confirmAction="download_list"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!download.new}" immediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{download.onRemoveI18n}" confirmAction="download_form"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{download.onReset}" rendered="#{!download.new}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
					</aon:div>
				</aon:div>
			</aon:div>

			<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<aon:div styleClass="aon-content-subtitle-internal">
					<aon:outputText
						value="#{download.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</aon:div>
			</aon:div>
			<aon:div id="aon-scroll-area" forceId="#{true}">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:panelGrid columns="2">
						<aon:panelGrid columns="2" dir="true" styleClass="aon-form-table"
							columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

							<aon:outputLabel for="Download_alias" style="width:100px"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.download_alias}" />
							<aon:inputText id="Download_alias"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="32" maxlength="32"
								value="#{download.to.alias}" />

							<aon:outputLabel for="Download_publishDate" style="width:100px"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.download_publish_date}" />
							<aon:selectInputDate id="Download_publishDate" 
								 required="true" style="z-index:2001;margin:0;vertical-align:middle;"
								 imageDir="#{aonConfiguration.stylePath}/images/selectInputDate/"
								 value="#{download.to.publishDate}" renderAsPopup="true"
								 popupDateFormat="#{bundle.aon_date_pattern}">
								 <f:convertDateTime pattern="#{bundle.aon_date_pattern}"
										timeZone="#{timeZoneController.timeZoneId}" />
							</aon:selectInputDate>			

							<aon:outputLabel for="DownloadDetail_file"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.download_file}" />
							<aon:inputText id="DownloadDetail_file"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="200" maxlength="255"
								value="#{download.toI18n.file}" />

							<aon:outputLabel for="DownloadDetail_title"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.download_title}" />
							<aon:inputText id="DownloadDetail_title"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="128" maxlength="128"
								value="#{download.toI18n.title}" />

							<aon:outputLabel for="DownloadDetail_description"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.download_description}" />
							<aon:inputTextarea id="DownloadDetail_description" style="width:300px;height:60px"
								styleClass="aon-form-input-text aon-form-input-text-number" partialSubmit="false"
								value="#{download.toI18n.description}" />

						</aon:panelGrid>
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>
</ui:composition>

</body>
</html>
