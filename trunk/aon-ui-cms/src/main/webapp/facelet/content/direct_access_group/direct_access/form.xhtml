<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-ice-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="content">

		<aon:form id="directAccessForm" partialSubmit="false">

			<aon:panelGrid columns="2" dir="true" styleClass="aon-title-toolbar" 
				cellpadding="0" cellspacing="0" columnClasses="aon-content-title,aon-content-toolbar">
			
				<aon:div styleClass="aon-content-title-internal">
					<aon:outputText value="#{appBundle.menu_option}" />					
				</aon:div>		
			
				<!-- start toolbar navigation -->
				<aon:div styleClass="aon-content-toolbar-internal">
						<aon:confirmButton id="save"
							value="#{bundle.aon_save}" rendered="#{direct_access.to!=null or direct_access.new}"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_save_confirm}"
							confirmActionListener="#{direct_access.onAccept}"
							styleClass="aon-content-toolbar-item aon-icon-accept"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-accept'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-accept aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_save}"/>
						<aon:confirmButton id="cancel"
							value="#{bundle.aon_cancel}" rendered="#{direct_access.to!=null or direct_access.new}" immediate="#{true}"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{direct_access.onCancel}" confirmAction="direct_access_list"
							styleClass="aon-content-toolbar-item aon-icon-cancel"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-cancel'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-cancel aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{!direct_access.new}" immediate="true"
							confirmTitle="Confirmation Dialog" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{direct_access.onRemoveI18n}" confirmAction="direct_access_form"
							styleClass="aon-content-toolbar-item aon-icon-delete"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-delete'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-delete aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_remove}"/>
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{direct_access.onReset}" rendered="#{!direct_access.new}"
							styleClass="aon-content-toolbar-item aon-icon-reset"
							onmouseout="this.className='aon-content-toolbar-item aon-icon-reset'"
							onmouseover="this.className='aon-content-toolbar-item aon-icon-reset aon-content-toolbar-item-hover'"
							accesskey="#{bundle.aon_key_new}" />
				</aon:div>
			</aon:panelGrid>

			<aon:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<aon:div styleClass="aon-content-subtitle-internal">
					<aon:outputText
						value="#{direct_access.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</aon:div>
			</aon:div>
			<aon:div id="aon-scroll-area" forceId="#{true}">
				<aon:div styleClass="aon-scroll-area-internal">

					<aon:panelGrid columns="2">
						<aon:panelGrid columns="2" dir="true" styleClass="aon-form-table"
							columnClasses="aon-form-table-column-odd,aon-form-table-column-even">

							<aon:outputLabel for="DirectAccess_alias" style="width:100px"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.direct_access_alias}" />
							<aon:inputText id="DirectAccess_alias"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="32" maxlength="32"
								value="#{direct_access.to.alias}" />

							<aon:outputLabel for="DirectAccessDetail_label"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.direct_access_label}" />
							<aon:inputText id="DirectAccessDetail_label"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="50" maxlength="64"
								value="#{direct_access.toI18n.label}" />

							<aon:outputLabel for="DirectAccess_image"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.direct_access_image}" />
							<aon:inputText id="DirectAccess_image"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="200" maxlength="255"
								value="#{direct_access.to.image}" />

							<aon:outputLabel for="DirectAccess_type"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.direct_access_type}" />
							<aon:selectOneMenu id="DirectAccess_type" 
								styleClass="aon-form-selectOneMenu-field"
								value="#{direct_access.to.type}" partialSubmit="true">
								<f:selectItems value="#{collections.pageTypes}" />
							</aon:selectOneMenu> 

							<aon:outputLabel for="DirectAccess_level"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.direct_access_level}" rendered="#{direct_access.visibleLevel}"/>
							<aon:selectOneMenu id="DirectAccess_level" rendered="#{direct_access.visibleLevel}" 
								styleClass="aon-form-selectOneMenu-field"
								value="#{direct_access.to.level}" partialSubmit="true">
								<f:selectItems value="#{direct_access.levels}" />
							</aon:selectOneMenu> 

							<aon:outputLabel for="DirectAccess_ident"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.direct_access_ident}" rendered="#{direct_access.visibleIdent}"/>
							<aon:selectOneMenu id="DirectAccess_ident" rendered="#{direct_access.visibleIdent}" 
								styleClass="aon-form-selectOneMenu-field"
								value="#{direct_access.to.ident}"
								 partialSubmit="true">
								<f:selectItems value="#{direct_access.idents}" />
							</aon:selectOneMenu> 

							<aon:outputLabel for="DirectAccessDetail_url"
								styleClass="aon-form-input-text-label"
								value="#{appBundle.direct_access_url}" rendered="#{direct_access.visibleUrl}"/>
							<aon:inputText id="DirectAccessDetail_url" rendered="#{direct_access.visibleUrl}"
								styleClass="aon-form-input-text aon-form-input-text-number"
								required="true" size="100" maxlength="255"
								value="#{direct_access.toI18n.url}" />

						</aon:panelGrid>
					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:form>
		<aon:form id="placeList" target="list" />

	</ui:define>
</ui:composition>

</body>
</html>
