<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/lookup.xhtml" >
		<ui:param name="lookupBean" value="#{articleLookup}" />
		<ui:param name="controller" value="#{article}" />		
		<ui:param name="lookupInputValue" value="#{lookupTo.alias}"/>
		<ui:param name="lookupInputSize" value="40"/>
		<ui:param name="lookupInputMaxLength" value="60"/>
		<ui:param name="searchButtonTitle" value="#{appBundle.cms_article_selection}" />
		<ui:param name="skipLabel" value="#{true}" />
		<ui:param name="skipGoToButton" value="#{true}" />		
		<ui:param name="skipNewButton" value="#{true}" />
		<ui:param name="skipSuggestText" value="#{true}" />		
		<ui:param name="searchButtonWidth" value="700"/>
		
		<ui:define name="lookupInputTextContent">
			<aon:joinProperty alias="Article_alias" value="#{lookupInputValue}" />
		</ui:define>			
	</ui:decorate>

</ui:composition>
