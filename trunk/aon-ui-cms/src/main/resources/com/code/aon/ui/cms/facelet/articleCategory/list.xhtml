<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="articleCategoryList">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.article_category}" />
				<ui:param name="controller" value="#{articleCategory}" />
				<ui:param name="skipResetButton" value="#{!cms.roleEditor}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="exit"
						value="#{bundle.aon_close}"
						action="#{articleCategory.getBack}" 
						immediate="#{true}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						accesskey="#{bundle.aon_key_close}">
					</aon:commandButton>				
				</ui:define>
			</ui:decorate>
			
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="sectionGrid" columns="2" dir="true" 
					columnClasses="aon-finding-title,aon-finding-toolbar">				
					
						<aon:outputLabel for="ArticleCategory_section"
							styleClass="aon-margin-right" value="#{appBundle.cms_section_default}"/>
							
						<aon:div styleClass="aon-finding-toolbar-item-group">					

							<aon:selectOneMenu id="ArticleCategory_section"  
								value="#{generator_config.section}">
								<f:selectItem itemLabel="-" value="#{null}" />
								<f:selectItems value="#{collections.sectionList}" />
							</aon:selectOneMenu>
						
							<aon:commandButton id="save"
								value="#{bundle.aon_save}"
								action="faq_category_list" 
								styleClass="aon-finding-toolbar-item aon-icon-accept">
								<aon:actionListener method="#{generator_config.onSaveArticleConfig}" />
							</aon:commandButton>
						</aon:div>		
				</aon:panelGrid>
			</aon:div>			

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{articleCategory}" />
					<ui:define name="columns">			
							
						<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.cms_alias}" />
							</f:facet>
							<aon:outputText value="#{to.alias}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.article_category_label}" />
							</f:facet>
							<aon:outputText value="#{articleCategory.i18nLabel}" >
								<aon:abbreviateConverter maxWidth="50" />
							</aon:outputText>							
						</aon:column>
	
						<aon:column styleClass="aon-width-200 aon-editDataTable-textColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.cms_section}" />
							</f:facet>
							<aon:outputText value="#{to.section.alias}" />
						</aon:column>
	
						<aon:column styleClass="aon-width-70 aon-editDataTable-numberColumn">
							<f:facet name="header">
								<aon:outputText for="ArticleCategory_position" 
									value="#{appBundle.article_category_position}" />
							</f:facet>
							<aon:outputText value="#{to.position}" />
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-iconColumn">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.article_category_active}" />
							</f:facet>
							<aon:div onmouseover="disableRowSelector();"
								onmouseout="enableRowSelector();" >															
								<aon:commandLink title="#{appBundle.article_category_activate}" 
									action="articleCategory_list"
									actionListener="#{articleCategory.onActivate}" 
									rendered="#{!to.active}">
									<aon:graphicImage id="ArticleCategory_active" alt="#{appBundle.article_category_activate}"
										url="#{aonResource.resolveLocal['/images/cms/inactive.png']}" />
								</aon:commandLink>
								<aon:commandLink title="#{appBundle.article_category_deactivate}" 
									action="articleCategory_list"
									actionListener="#{articleCategory.onDeactivate}" 
									rendered="#{to.active}">
									<aon:graphicImage id="ArticleCategory_deactive" alt="#{appBundle.article_category_deactivate}"
										url="#{aonResource.resolveLocal['/images/cms/active.png']}" />
								</aon:commandLink>
							</aon:div>
						</aon:column>
					</ui:define>
				</ui:decorate>

			</aon:div>
		</aon:form>
		
	</ui:define>

</ui:composition>

</body>
</html>
