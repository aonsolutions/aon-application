<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="delegacionSearch">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.auxiliares_organismos_entidades__delegacion}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{menuBundle.aon_toolbar_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset" ajaxSingle="true"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							action="delegacion_form" actionListener="#{delegacion.onCancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
							accesskey="#{bundle.aon_key_cancel}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<!-- end toolbar navigation -->

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{delegacion.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="delegacion_list" />				
				
					<aon:outputLabel for="Delegacion_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Delegacion_cdg" size="1" maxlength="3"
						valueChangeListener="#{delegacion.addExpression}" />

					<aon:outputLabel for="Delegacion_descripcion"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Delegacion_descripcion" size="60" maxlength="45"
						valueChangeListener="#{delegacion.addExpression}" />
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
