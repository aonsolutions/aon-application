<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="entidadMaestroForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="buttonsGrid" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.aon_payroll_cotizacion_entidades}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{entidadMaestro.new?(bundle.aon_reset):(bundle.aon_editing)}" />
					</aon:div>

					<!-- start toolbar navigation -->
					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							action="entidades_form"
							actionListener="#{entidadMaestro.accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							accesskey="#{bundle.aon_key_save}" />
						<aon:confirmButton id="cancel" immediate="true"
							value="#{bundle.aon_cancel}" rendered="#{entidadMaestro.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{entidadMaestro.onCancel}"
							confirmAction="entidades_list"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:confirmButton id="remove" value="#{bundle.aon_remove}"
							rendered="#{!entidadMaestro.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete"
							immediate="true" confirmTitle="#{bundle.aon_confirm_title}"
							confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{entidadMaestro.onRemove}"
							confirmAction="entidades_list"
							accesskey="#{bundle.aon_key_remove}" />
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							rendered="#{!entidadMaestro.new}"
							action="entidades_form" 
							actionListener="#{entidadMaestro.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							rendered="#{!entidadMaestro.new}" immediate="true"
							action="entidades_search" actionListener="#{entidadMaestro.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />														

	<aon:spin controller="#{entidadMaestro}" action="entidades_form" rendered="#{!entidadMaestro.new}" />
                       <h:commandLink id="export2pdf" value="PDF"
		             		title="#{appBundle.aon_payroll_export} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_pdf}"
			             	styleClass="aon-finding-toolbar-item aon-icon-pdf"
			            	action="#{report.onExecute}" rendered="#{!entidadMaestro.new}" 
			             	target="_blank">
			                <f:param name="reportKey" value="EntidadList" />
		               </h:commandLink>
	                	<h:commandLink id="export2excel" value="XLS"
	              			title="#{appBundle.aon_payroll_export} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_excel}"
		            		styleClass="aon-finding-toolbar-item aon-icon-excel"
		             		action="#{report.onExecute}" rendered="#{!entidadMaestro.new}" 
			            	target="_blank">
								<f:param name="reportKey" value="EntidadListXLS" />
								<f:param name="outputFormat" value="MS Excel" />
		                </h:commandLink>
		                <h:commandLink id="export2csv" value="CSV"
		            		title="#{appBundle.aon_payroll_export} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_csv}"
		             		styleClass="aon-finding-toolbar-item aon-icon-csv"
		            		action="#{report.onExecute}" rendered="#{!entidadMaestro.new}" 
		            		target="_blank">
								<f:param name="reportKey" value="EntidadListXLS" />
								<f:param name="outputFormat" value="CSV" />
		                </h:commandLink>
	
					</aon:div>

					<!-- end toolbar navigation -->
				</aon:panelGrid>
			</aon:div>

	   <aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="entidadMaestro" columns="2" dir="true" width="100%" style="margin-bottom=2px;">
				
				
					<aon:outputLabel value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText value="#{entidadMaestro.to.cdg}" disabled="#{!entidadMaestro.new}" 
						required="true" size="20" maxlength="3" />
				
					<aon:outputLabel  value="#{appBundle.aon_payroll_description}" />
					<aon:inputText value="#{entidadMaestro.to.description}" 
						required="true" size="30" maxlength="30" >
					</aon:inputText>
						
			
				 
				</aon:panelGrid>

			 	<ui:include src="grid.xhtml" rendered="#{!entidadMaestro.new}" />		 		
			
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>

</body>
</html>
