<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="cuotasSearch">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.auxiliares_irpf__cuota}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{menuBundle.aon_toolbar_search}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="clear" value="#{bundle.aon_clear}"
							type="reset" ajaxSingle="true"
							styleClass="aon-finding-toolbar-item aon-icon-rubber" />
						<aon:commandButton id="back" value="#{bundle.aon_back}"
							action="irpf_cuotas" actionListener="#{cuotas.onCancel}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="true" accesskey="#{bundle.aon_key_cancel}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<!-- end toolbar navigation -->

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{cuotas.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="irpf_cuotas" />


					<aon:outputLabel for="Cuota_id_numTramo"
						value="#{appBundle.aon_payroll_auxiliares_irpf_foral__cuota_01_tramo}" />
					<aon:inputText id="Cuota_id_numTramo" size="10" maxlength="10"
						valueChangeListener="#{cuotas.addExpression}" />

					<!--  <aon:outputLabel for="Cuota_id_fecini"
						value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_fecini2}" />
					<aon:selectInputDate id="Cuota_id_fecini" renderAsPopup="true"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						valueChangeListener="#{cuotas.addExpression}">
					</aon:selectInputDate>
					
					<aon:outputLabel for="Cuota_fecfin"
						value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_fecfin2}" />
					<aon:selectInputDate id="Cuota_fecfin" renderAsPopup="true"
						popupDateFormat="#{appBundle.aon_date_pattern}"
						valueChangeListener="#{cuotas.addExpression}">
					</aon:selectInputDate>-->

					<aon:outputLabel for="Cuota_hasta"
						value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_hasta}" />
					<aon:inputText id="Cuota_hasta" size="20" maxlength="20"
						valueChangeListener="#{cuotas.addExpression}" />

					<aon:outputLabel for="Cuota_pesetas"
						value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_pesetas}" />
					<aon:inputText id="Cuota_pesetas" size="20" maxlength="20"
						valueChangeListener="#{cuotas.addExpression}" />

					<aon:outputLabel for="Cuota_resto"
						value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_resto}" />
					<aon:inputText id="Cuota_resto" size="20" maxlength="20"
						valueChangeListener="#{cuotas.addExpression}" />
						
					<aon:outputLabel for="Cuota_porcentaje"
						value="#{appBundle.aon_payroll_auxiliares_irpf__cuota_porcentaje}" />
					<aon:inputText id="Cuota_porcentaje" size="20" maxlength="20"
						valueChangeListener="#{cuotas.addExpression}" />


				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>

</ui:composition>
