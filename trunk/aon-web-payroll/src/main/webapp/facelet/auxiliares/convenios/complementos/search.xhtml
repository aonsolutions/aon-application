<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="complementosSearch">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_convenios__complemento}" />
				<ui:param name="controller" value="#{complemento}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{complemento.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="complemento_list" />				
				
					<aon:outputLabel for="Complemento_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Complemento_cdg" size="1" maxlength="3"
						valueChangeListener="#{complemento.addExpression}" />

					<aon:outputLabel for="Complemento_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Complemento_description" size="100" maxlength="150"
						valueChangeListener="#{complemento.addExpression}" />
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>
		
</ui:composition>
