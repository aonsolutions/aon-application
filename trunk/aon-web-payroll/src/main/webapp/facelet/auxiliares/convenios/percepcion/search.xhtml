<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">
	
	<ui:define name="content">

		<aon:form id="categoriaSearch">
			 
			 <ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_auxiliares_convenios__percepciones}" />
				<ui:param name="controller" value="#{percepcion}" />
			</ui:include>
			
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{percepcion.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="percepcion_list" />				
				
			
					<aon:outputLabel for="Percepcion_convenio_description" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__convenio}"/>
					<aon:inputText id="Percepcion_convenio_description"  size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />
					
					<aon:outputLabel for="Percepcion_nivel_id_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__categoria_nivel}"/>
					<aon:inputText id="Percepcion_nivel_id_cdg" size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />
					
					<aon:outputLabel for="Percepcion_id_codcom" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__complemento}"/>
					<aon:inputText id="Percepcion_id_codcom" size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />
					  
					<aon:outputLabel for="Percepcion_descom" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__desc_comp}"/>
					<aon:inputText id="Percepcion_descom" size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />
					
					<aon:outputLabel for="Percepcion_desabr" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__short_desc_comp}"/>
					<aon:inputText id="Percepcion_desabr" size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />
					
					<aon:outputLabel for="Percepcion_tipcom" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__tip_comp}"/>
					<aon:selectOneMenu id="Percepcion_tipcom" 
						valueChangeListener="#{percepcion.addDirectEqualExpression}" >	
						<aon:enumConverter enum="com.code.aon.payroll.enumeration.TipoComplemento" />	
						<f:selectItem value="#{null}" itemLabel="  " />											
						<f:selectItems value="#{complemento.listaComplementos}"/>
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Percepcion_tipcot" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__tip_coti}"/>	
					<aon:selectOneMenu id="Percepcion_tipcot" 
						valueChangeListener="#{percepcion.addDirectEqualExpression}" >	
						<aon:enumConverter enum="com.code.aon.payroll.enumeration.TipoCotizaciones" />
						<f:selectItem value="#{null}" itemLabel="  " />
						<f:selectItems value="#{complemento.listaCotizaciones}" />
					</aon:selectOneMenu>					

					<aon:outputLabel for="Percepcion_calculo" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__calculo}"/>
					<aon:inputText id="Percepcion_calculo" size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />
						
					<aon:outputLabel for="Percepcion_mes" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__mes}"/>
					<aon:inputText id="Percepcion_mes" size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />
					
					<aon:outputLabel for="Percepcion_unidades" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__unid_comp}"/>
					<aon:inputText id="Percepcion_unidades" size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />	
					
					<aon:outputLabel for="Percepcion_impuni" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__importe_unit}"/>
					<aon:inputText id="Percepcion_impuni" size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />
						
					<aon:outputLabel for="Percepcion_importe" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__importe_comp}"/>
					<aon:inputText id="Percepcion_importe" size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />
						
					<aon:outputLabel for="Percepcion_garilt" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__ilt}"/>
					<aon:inputText id="Percepcion_garilt" size="35" maxlength="35" 
						valueChangeListener="#{percepcion.addExpression}" />
					
					<aon:outputLabel for="Complemento_cdg" 
						value="#{appBundle.aon_payroll_auxiliares_convenios__aplic_comp}"/>
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Complemento_cdg"
							lookup="#{complementoLookup}"
							reRender="Complemento_description"
							value="#{percepcion.complemento.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Complemento_lookup"
							windowTitle="#{appBundle.aon_payroll_auxiliares_convenios__aplic_comp}"
							selectReRender="Complemento_cdg,Complemento_description"
							lookup="#{complementoLookup}" minHeight="440"
							property="#{percepcion.complemento}">
						</aon:lookupButton>
						<aon:inputText id="Complemento_description"
							value="#{(percepcion.complemento.description!=null)?(percepcion.complemento.description):('')}"
							size="34" disabled="true" />
					</aon:div>		
					
					
					<aon:outputText value=" "/>
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__ind_comp}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="Percepcion_indcom" 
								valueChangeListener="#{percepcion.addDirectEqualExpression}" >	
					    		<aon:enumConverter enum="com.code.aon.payroll.enumeration.IndiceComplemento" />	
								<f:selectItems value="#{complemento.listaIndiceComplemento}"  />											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>
					
					<aon:outputText value="" />
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__redondeo}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="Percepcion_redext" 
								valueChangeListener="#{percepcion.addDirectEqualExpression}" >	
					    		<aon:enumConverter enum="com.code.aon.payroll.enumeration.PagaExtra" />	
								<f:selectItems value="#{percepcion.listaPagaExtra}"/>											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>					
					
					<aon:outputText value="" />
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__fijo_var}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="Percepcion_fijovar" 
								valueChangeListener="#{percepcion.addDirectEqualExpression}" >	
					    		<aon:enumConverter enum="com.code.aon.payroll.enumeration.FijoVariable" />
								<f:selectItems value="#{complemento.listaFijoVariable}"/>											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>
					
					<aon:outputText value="" />
					<aon:panel>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_auxiliares_convenios__retrib}"/>
						</f:facet>
						<aon:div styleClass="">
							<aon:selectOneRadio id="Percepcion_dinesp" 
								valueChangeListener="#{percepcion.addDirectEqualExpression}" >	
					    		<aon:enumConverter enum="com.code.aon.payroll.enumeration.Retribuciones" />	
								<f:selectItems value="#{complemento.listaRetribuciones}"/>											
							</aon:selectOneRadio>
						</aon:div>
					</aon:panel>
					
					
					
					
					
				</ui:define>
			</ui:decorate>

		</aon:form>
		
		<aon:lookupButtonPopup lookup="#{complementoLookup}" />
		
	</ui:define>
		
</ui:composition>
