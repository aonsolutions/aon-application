<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich">

<aon:div id="domDataDiv">

	<aon:editDataTable id="domicilioData" var="to" rows="3"
						value="#{tipdomicilio.model}"
						columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn,">
								
								
			 <aon:rowSelector 
			  reRender="calDiv">
			<aon:actionListener method="#{tipdomicilio.onSelect}" />
			</aon:rowSelector>


			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>

					<h:commandButton alt="[#{bundle.aon_reset}]"
						rendered="#{to==tipdomicilio.to}"
						styleClass="aon-editDataTable-button aon-icon-rowSelector "
						actionListener="#{tipdomicilio.onSelect}"  />

			
			</aon:column>

							<aon:column  >
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_actividad_con}" />
							</f:facet>
							<aon:outputText value="#{to.domicilio.cdg}"  />
							
						</aon:column>
						<aon:column  >
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_actividad_nombre}" />
							</f:facet>
							<aon:outputText value="#{to.domicilio.nomvia}"  />
							
						</aon:column>
				
					  
						
						
					</aon:editDataTable>
					<aon:dataScroller2 for="domicilioData" showNote="true" />
	
</aon:div>

</ui:composition>
