<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="nacionSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{menuBundle.auxiliares_geograficas__nacion}" />
				<ui:param name="controller" value="#{nacion}" />
				<ui:param name="skipResetButton" value="true" />
				<aon:methodParam name="backAction" value="nacion_form" />
			</ui:include>


			<!-- end toolbar navigation -->

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{nacion.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="nacion_form" />

					<aon:outputLabel for="Nacion_cdg"
						value="#{appBundle.aon_payroll_cdg}" />
					<aon:inputText id="Nacion_cdg" size="2" maxlength="3"
						valueChangeListener="#{nacion.addExpression}" />

					<aon:outputLabel for="Nacion_description"
						value="#{appBundle.aon_payroll_description}" />
					<aon:inputText id="Nacion_description" size="60" maxlength="45"
						valueChangeListener="#{nacion.addExpression}" />
				</ui:define>
			</ui:decorate>

		</aon:form>
	</ui:define>

</ui:composition>
