<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
	 <rich:spacer />
		<aon:editDataTable id="paisData" value="#{pais.model}" 
			var="to" rows="5"
			rendered="#{(pais.model.rowCount > 0) or (pais.new)}" 
			columnClasses="aon-editDataTable-iconColumn
				,aon-editDataTable-textColumn, aon-editDataTable-textColumn
				, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{pais.to == null}" actionListener="#{pais.onSelect}" 
				reRender="paisForm" />
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{pais.onReset}" value=""
							rendered="#{!pais.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
					
				</f:facet>
			</aon:column>

     	    <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cdg} #{appBundle.aon_payroll_auxiliares_geograficas__pais}" />
				</f:facet>
				<aon:outputText id="codigo" value="#{to.cdg}" rendered="#{to!=pais.to}" />
				
				<aon:inputText  id="modificar_codigo" styleClass="aon-form-input-text " required="true"
					rendered="#{to==pais.to}" size="5"
					value="#{pais.to.cdg}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText id="codigo_nuevo" styleClass="aon-form-input-text" required="true"
						rendered="#{pais.new}" size="5"
						value="#{pais.to.cdg}" maxlength="10" />
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_description} #{appBundle.aon_payroll_auxiliares_geograficas__pais}" />
				</f:facet>
				<aon:outputText id="descripcion" value="#{to.descripcion}" rendered="#{to!=pais.to}" />
				
				<aon:inputText id="modificar_descripcion" styleClass="aon-form-input-text " required="true"
					rendered="#{to==pais.to}" size="5"
					value="#{pais.to.descripcion}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText id="descripcion_nueva" styleClass="aon-form-input-text" required="true"
						rendered="#{pais.new}" size="5"
						value="#{pais.to.descripcion}" maxlength="10" />
				</f:facet>
			</aon:column>
					
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=pais.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==pais.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{pais.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==pais.to}"
						actionListener="#{pais.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==pais.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{pais.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!pais.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{pais.new}"
							actionListener="#{pais.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel-Porcentaje" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{pais.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{pais.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
		<aon:dataScroller2 disabled="#{pais.to != null}" for="paisData" showNote="true" />
	</aon:div>

</ui:composition>
