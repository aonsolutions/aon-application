<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>
	 <aon:div styleClass="aon-finding-toolbar-item-group">
		 <aon:commandButton id="resetComunidad" value="#{bundle.aon_reset}"
				rendered="#{(comunidad.model.rowCount == 0) and (!comunidad.new)}"
				action="pais"
				actionListener="#{comunidad.onReset}"
				styleClass="aon-finding-toolbar-item aon-icon-reset"
				accesskey="#{bundle.aon_key_new}" />
	 </aon:div>
	 
	<rich:spacer rendered="#{(comunidad.model.rowCount > 0) or (comunidad.new)}"/>		
		<aon:editDataTable id="comunidadData" value="#{comunidad.model}" 
			var="to" rows="5"
			rendered="#{(comunidad.model.rowCount > 0) or (comunidad.new)}" 
			columnClasses="aon-editDataTable-iconColumn
				,aon-editDataTable-textColumn, aon-editDataTable-textColumn
				, aon-editDataTable-buttonsColumn">
					
			<aon:rowSelector toggleOnClick="#{comunidad.to == null}" actionListener="#{comunidad.onSelect}" 
				reRender="comunidadPanelGrid"/>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:outputText value="&#160;" />
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{comunidad.onReset}" value=""
							rendered="#{!comunidad.new}"
							accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
					
				</f:facet>
			</aon:column>

     	    <aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cdg} #{appBundle.aon_payroll_auxiliares_geograficas__comunidad}" />
				</f:facet>
				<aon:outputText value="#{to.cdg}" rendered="#{to!=comunidad.to}" />
				
				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==comunidad.to}" size="5"
					value="#{comunidad.to.cdg}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{comunidad.new}" size="5"
						value="#{comunidad.to.cdg}" maxlength="10" />
				</f:facet>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_description} #{appBundle.aon_payroll_auxiliares_geograficas__comunidad}" />
				</f:facet>
				<aon:outputText value="#{to.descripcion}" rendered="#{to!=comunidad.to}" />
				
				<aon:inputText styleClass="aon-form-input-text " required="true"
					rendered="#{to==comunidad.to}" size="5"
					value="#{comunidad.to.descripcion}" maxlength="10" />
				<f:facet name="footer">
					<aon:inputText styleClass="aon-form-input-text" required="true"
						rendered="#{comunidad.new}" size="5"
						value="#{comunidad.to.descripcion}" maxlength="10" />
				</f:facet>
			</aon:column>
					
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>
				<aon:div>
					<f:verbatim rendered="#{to!=comunidad.to}">&#160;</f:verbatim>
					<aon:commandButton title="[#{bundle.aon_accept}]" 
						rendered="#{to==comunidad.to}"
						styleClass="aon-editDataTable-button aon-icon-accept"
						actionListener="#{comunidad.onAccept}"
						accesskey="#{bundle.aon_key_save_line}" />
					<aon:commandButton title="[#{bundle.aon_cancel}]"
						styleClass="aon-editDataTable-button aon-icon-cancel"
						rendered="#{to==comunidad.to}"
						actionListener="#{comunidad.onCancel}" immediate="true"
						accesskey="#{bundle.aon_key_cancel_line}" />
					<aon:confirmButton id="remove-Porcentaje" title="[#{bundle.aon_remove}]"
						styleClass="aon-editDataTable-button aon-icon-delete"
						rendered="#{to==comunidad.to}"
						confirmTitle="#{bundle.aon_confirm_title}" 
						confirmMessage="#{bundle.aon_remove_confirm}"
						confirmActionListener="#{comunidad.onRemove}" immediate="true"
						accesskey="#{bundle.aon_key_remove_line}" />								
				</aon:div>
				<f:facet name="footer">
					<aon:div>
						<f:verbatim rendered="#{!comunidad.new}">&#160;</f:verbatim>
						<aon:commandButton title="[#{bundle.aon_accept}]" 
							styleClass="aon-editDataTable-button aon-icon-accept"
							rendered="#{comunidad.new}"
							actionListener="#{comunidad.onAccept}"
							accesskey="#{bundle.aon_key_save_line}" />
						<aon:confirmButton id="cancel" title="[#{bundle.aon_cancel}]"
							styleClass="aon-editDataTable-button aon-icon-cancel"
							rendered="#{comunidad.new}"
							confirmTitle="#{bundle.aon_confirm_title}" 
							confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{comunidad.onCancel}" immediate="true"
							accesskey="#{bundle.aon_key_cancel_line}" />
					</aon:div>
				</f:facet>
			</aon:column>
			
		</aon:editDataTable>
		<aon:dataScroller2 for="comunidadData" showNote="true" />
		
	</aon:div>

</ui:composition>
