<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>
<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="incidenciaGrid">
	
			<aon:div ajaxRendered="true" layout="none">
	
				<aon:div styleClass="aon-finding-title-toolbar">
					<aon:panelGrid columns="3" dir="true"
						columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">
	
						<aon:div styleClass="aon-finding-title-internal">
							<aon:outputText value="#{menuBundle.auxiliares_tipos__tipinc}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-subtitle-internal">
							<aon:outputText
								value="#{menuBundle.aon_payroll_crud_label}" />
						</aon:div>
	
						<aon:div styleClass="aon-finding-toolbar-item-group">
							<aon:commandButton id="reset" value="#{bundle.aon_reset}"
								actionListener="#{tiposIncidencia.onReset}" rendered="#{!tiposIncidencia.new}"
								styleClass="aon-finding-toolbar-item aon-icon-reset"
								accesskey="#{bundle.aon_key_new}"/>
							<aon:commandButton id="save"
								value="#{bundle.aon_save}" rendered="#{tiposIncidencia.to!=null or tiposIncidencia.new}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								actionListener="#{tiposIncidencia.onAccept}" 
								accesskey="#{bundle.aon_key_new}" />
							<aon:confirmButton id="cancelNew"
								value="#{bundle.aon_cancel}" rendered="#{tiposIncidencia.new}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_cancel_confirm}"
								confirmActionListener="#{tiposIncidencia.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:commandButton id="cancelEdit"
								value="#{bundle.aon_cancel}" rendered="#{tiposIncidencia.to!=null and (!tiposIncidencia.new)}"
								styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
								actionListener="#{tiposIncidencia.onCancel}"
								accesskey="#{bundle.aon_key_cancel}"/>
							<aon:confirmButton id="remove"
								value="#{bundle.aon_remove}" rendered="#{tiposIncidencia.to!=null and !tiposIncidencia.new}"
								styleClass="aon-finding-toolbar-item aon-icon-delete" immediate="true"
								confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{tiposIncidencia.onRemove}"
								accesskey="#{bundle.aon_key_remove}"/>
							<h:commandLink id="export2pdf" value="."
									title="#{appBundle.aon_payroll_export_label} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_pdf_label}"
									styleClass="aon-finding-toolbar-item aon-icon-pdf"
									action="#{report.onExecute}" rendered="#{!tiposIncidencia.new}" 
									target="_blank">
								<f:param name="reportKey" value="tiposIncidenciaList" />
							</h:commandLink>
							<h:commandLink id="export2excel" value="."
									title="#{appBundle.aon_payroll_export_label} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_excel_label}"
									styleClass="aon-finding-toolbar-item aon-icon-excel"
									action="#{report.onExecute}" rendered="#{!tiposIncidencia.new}" 
									target="_blank">
								<f:param name="reportKey" value="tiposIncidenciaList" />
								<f:param name="outputFormat" value="MS Excel" />
							</h:commandLink>
							<h:commandLink id="export2csv" value="."
									title="#{appBundle.aon_payroll_export_label} #{appBundle.aon_payroll_to} #{appBundle.aon_payroll_csv_label}"
									styleClass="aon-finding-toolbar-item aon-icon-excel"
									action="#{report.onExecute}" rendered="#{!tiposIncidencia.new}" 
									target="_blank">
								<f:param name="reportKey" value="tiposIncidenciaList" />
								<f:param name="outputFormat" value="CSV" />
							</h:commandLink>
						</aon:div>
					</aon:panelGrid>
				</aon:div>
	
				<!-- region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<aon:editDataTable id="incidenciaData" var="to" rows="0"
						rendered="#{(tiposIncidencia.model.rowCount > 0) or (tiposIncidencia.new)}" value="#{tiposIncidencia.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-numberColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
								
						<aon:rowSelector toggleOnClick="#{tiposIncidencia.to == null}"
							actionListener="#{tiposIncidencia.onSelect}" />
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{tiposIncidencia.onReset}" value=""
										rendered="#{!tiposIncidencia.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.cdg}" rendered="#{to!=tiposIncidencia.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposIncidencia.to}" size="30"
								value="#{tiposIncidencia.to.cdg}" maxlength="1" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposIncidencia.new}" size="30"
									value="#{tiposIncidencia.to.cdg}" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{to!=tiposIncidencia.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposIncidencia.to}" size="60"
								value="#{tiposIncidencia.to.description}" maxlength="45" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposIncidencia.new}" size="60"
									value="#{tiposIncidencia.to.description}" maxlength="45" />
							</f:facet>
						</aon:column>
						
						
						 <aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.payroll_indresta_label}" />
							</f:facet>
							<!--  <aon:outputText value="#{to.indresta}" rendered="#{to!=tiposIncidencia.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposIncidencia.to}" size="5"
								value="#{tiposIncidencia.to.indresta}" maxlength="45" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposIncidencia.new}" size="5"
									value="#{tiposIncidencia.to.indresta}" maxlength="1" />
							</f:facet>-->
							
							
							 <aon:outputText value="&#160;&#160;&#160;&#160;&#160;"
							styleClass="aon-icon-check" 
							rendered="#{to!=tiposIncidencia.to and !to.isIndresta}" />
							<aon:outputText value="&#160;&#160;&#160;&#160;&#160;"
								styleClass="aon-icon-checked" 
								rendered="#{to!=tiposIncidencia.to and to.isIndresta}" />
								
					    	<h:selectBooleanCheckbox rendered="#{to==tiposIncidencia.to}"  value="#{tiposIncidencia.to.indresta}" >
                            
                           </h:selectBooleanCheckbox>
                           
                           <f:facet name="footer">
							<h:selectBooleanCheckbox rendered="#{tiposIncidencia.new}"  value="#{tiposIncidencia.to.indresta}"  >
                              
                             </h:selectBooleanCheckbox>
							</f:facet>
							
						</aon:column>
						
						
						 <aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.payroll_inddto_label}" />
							</f:facet>
							<!--  <aon:outputText value="#{to.inddto}" rendered="#{to!=tiposIncidencia.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposIncidencia.to}" size="5"
								value="#{tiposIncidencia.to.inddto}" maxlength="1" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposIncidencia.new}" size="5"
									value="#{tiposIncidencia.to.inddto}" maxlength="1" />
							</f:facet>-->
							
							
							  <aon:outputText value="&#160;&#160;&#160;&#160;&#160;"
							styleClass="aon-icon-check"
							rendered="#{to!=tiposIncidencia.to and !to.isInddto}" />
							<aon:outputText value="&#160;&#160;&#160;&#160;&#160;"
								styleClass="aon-icon-checked"
								rendered="#{to!=tiposIncidencia.to and to.isInddto}" />
								
					    	<h:selectBooleanCheckbox rendered="#{to==tiposIncidencia.to}"  value="#{tiposIncidencia.to.inddto}"  >
                            
                           </h:selectBooleanCheckbox>
                           
                           <f:facet name="footer">
							<h:selectBooleanCheckbox rendered="#{tiposIncidencia.new}" value="#{tiposIncidencia.to.inddto}" >
                              
                             </h:selectBooleanCheckbox>
							</f:facet>
						</aon:column>
						
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=tiposIncidencia.to}">&#160;</f:verbatim>
								<aon:commandButton id="acceptEdit-Scope" title="[#{bundle.aon_accept}]" 
									rendered="#{to==tiposIncidencia.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{tiposIncidencia.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==tiposIncidencia.to}"
									actionListener="#{tiposIncidencia.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==tiposIncidencia.to}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{tiposIncidencia.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />								
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!tiposIncidencia.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]" 
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{tiposIncidencia.new}"
										actionListener="#{tiposIncidencia.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{tiposIncidencia.new}"
										confirmTitle="#{bundle.aon_confirm_title}" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{tiposIncidencia.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
						
					</aon:editDataTable>
					<aon:dataScroller for="incidenciaData" rowCount="#{tiposIncidencia.model.rowCount}" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
</body>
</html>
