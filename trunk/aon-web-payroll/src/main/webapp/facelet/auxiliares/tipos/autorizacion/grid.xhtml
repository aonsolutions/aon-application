<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>
<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="autorizacionGrid">
	
			<aon:div ajaxRendered="true" layout="none">
				
			<ui:include src="/facelet/templates/gridPrintToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{menuBundle.auxiliares_tipos__tipaut}" />
				<ui:param name="controller" value="#{tiposAutorizacion}"/>
				<ui:param name="reportKey" value="tiposAutorizacionList"/>
				<aon:valueParam name="skipSearchButton" default="false" />
				<aon:valueParam name="skipBackButton" default="false" />
				<aon:methodParam name="backAction" value="auxiliares" />
			</ui:include>
	
				<!-- region-body -->
	 			<aon:div styleClass="aon-scroll-area">
					
					<aon:editDataTable id="autorizacionData" var="to" rows="20"
						rendered="#{(tiposAutorizacion.model.rowCount > 0) or (tiposAutorizacion.new)}" value="#{tiposAutorizacion.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-width-150, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
								
						<aon:rowSelector toggleOnClick="#{tiposAutorizacion.to == null}"
							actionListener="#{tiposAutorizacion.onSelect}" />
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:outputText value="&#160;" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{tiposAutorizacion.onReset}" value=""
										rendered="#{!tiposAutorizacion.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.cdg}" rendered="#{to!=tiposAutorizacion.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposAutorizacion.to}" size="3"
								value="#{tiposAutorizacion.to.cdg}" maxlength="3" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposAutorizacion.new}" size="3"
									value="#{tiposAutorizacion.to.cdg}" maxlength="3" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{to!=tiposAutorizacion.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==tiposAutorizacion.to}" size="70"
								value="#{tiposAutorizacion.to.description}" maxlength="70" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{tiposAutorizacion.new}" size="70"
									value="#{tiposAutorizacion.to.description}" maxlength="70" />
							</f:facet>
						</aon:column>
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=tiposAutorizacion.to}">&#160;</f:verbatim>
								<aon:commandButton id="acceptEdit-Scope" title="[#{bundle.aon_accept}]" 
									rendered="#{to==tiposAutorizacion.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{tiposAutorizacion.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==tiposAutorizacion.to}"
									actionListener="#{tiposAutorizacion.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==tiposAutorizacion.to}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{tiposAutorizacion.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />								
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									<f:verbatim rendered="#{!tiposAutorizacion.new}">&#160;</f:verbatim>
									<aon:commandButton title="[#{bundle.aon_accept}]" 
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{tiposAutorizacion.new}"
										actionListener="#{tiposAutorizacion.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{tiposAutorizacion.new}"
										confirmTitle="#{bundle.aon_confirm_title}" 
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{tiposAutorizacion.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
						
					</aon:editDataTable>
					<aon:dataScroller2 for="autorizacionData" showNote="true" />
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
</body>
</html>
