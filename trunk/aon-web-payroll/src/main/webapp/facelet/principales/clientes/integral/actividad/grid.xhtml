<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">

<aon:div id="actDataDiv">

	<aon:editDataTable id="actividadData" var="to" rows="4"
						value="#{actividad.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
								
					 
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-rowSelector "
										actionListener="#{actividad.onSelect}" 
										
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{actividad.onReset}"
										rendered="#{!actividad.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>
							</f:facet>
						</aon:column>
						
	                   	<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.cdg}"  />
							
						</aon:column>
						
						
						<aon:column  >
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_clientes_empresa}" />
							</f:facet>
							<aon:outputText value="#{to.descripcion}"  />
							
						</aon:column>
					
				 	
						<aon:column  >
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_clientes_empresa}" />
							</f:facet>
							<aon:outputText value="#{to.convenio.description}"  />
							
						</aon:column>
					  
					  
						<aon:column  >
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_principales_clientes_empresa}" />
							</f:facet>
							<aon:outputText value="#{to.indregimen}"  />
							
						</aon:column>
					  
						
						
					</aon:editDataTable>
					<aon:dataScroller2 for="actividadData" showNote="true" />
	
</aon:div>

</ui:composition>
