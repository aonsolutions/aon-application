<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich">

	<aon:div id="cuentasDataDiv">

		<aon:editDataTable id="cuentasData" var="to" rows="4"
			rendered="#{(cuenta.model.rowCount > 0) or (cuenta.new)}"
			value="#{cuenta.model}"
			columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

			<!-- 	<aon:rowSelector action="cuenta_form"
							actionListener="#{cuenta.onSelect}" /> -->

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>

				<aon:div>
					<aon:commandButton alt="[#{bundle.aon_reset}]"
						styleClass="aon-editDataTable-button aon-icon-rowSelector "
						actionListener="#{cuenta.onSelect}" action="cuenta_form"
						accesskey="#{bundle.aon_key_new_line}" />
				</aon:div>

				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{cuenta.onReset}" action="cuenta_form"
							rendered="#{!cuenta.new}" accesskey="#{bundle.aon_key_new_line}" />
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_principales_cuenta_cdg}" />
				</f:facet>
				<aon:outputText value="#{to.cdg}" />

			</aon:column>


			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_principales_cuenta_entidad_nom}" />
				</f:facet>
				<aon:outputText value="#{to.entidad.description}" />

			</aon:column>


			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_principales_cuenta_sucursal}" />
				</f:facet>
				<aon:outputText value="#{to.sucursal.domsuc}" />

			</aon:column>





		</aon:editDataTable>
		<aon:dataScroller2 for="cuentasData" showNote="true" />

		<aon:panelGrid columns="2">
			<aon:outputLabel for="Empresa_cdg"
				value="#{appBundle.aon_payroll_principales_tipocuenta_empresa}" />
			<aon:div styleClass="aon-lookup">
				<aon:lookupInputText id="Empr_cdg" lookup="#{empresaLookup}"
					reRender="Empr_description" value="#{tipcuenta.to.empresa.cdg}"
					size="5">
				</aon:lookupInputText>
				<aon:lookupButton id="Empr_lookup"
					windowTitle="#{appBundle.aon_payroll_principales_tipocuenta_empresa}"
					selectReRender="Empr_cdg,Empr_description"
					lookup="#{empresaLookup}" minHeight="440"
					property="#{tipcuenta.to.empresa}">
				</aon:lookupButton>
				<aon:inputText id="Empr_description"
					value="#{(tipcuenta.to.empresa.descripcion!=null)?(tipcuenta.to.empresa.descripcion):('')}"
					size="60" disabled="true" />
			</aon:div>


			<aon:outputLabel for="Actividad_cdg"
				value="#{appBundle.aon_payroll_principales_tipocuenta_actividad}" />
			<aon:div styleClass="aon-lookup">
				<aon:lookupInputText id="Act_cdg" lookup="#{actividadLookup}"
					reRender="Act_description" value="#{tipcuenta.to.actividad.cdg}"
					size="5">
				</aon:lookupInputText>
				<aon:lookupButton id="Act_lookup"
					windowTitle="#{appBundle.aon_payroll_principales_tipocuenta_actividad}"
					selectReRender="Act_cdg,Act_description"
					lookup="#{actividadLookup}" minHeight="440"
					property="#{tipcuenta.to.actividad}">
				</aon:lookupButton>
				<aon:inputText id="Act_description"
					value="#{(tipcuenta.to.actividad.descripcion!=null)?(tipcuenta.to.actividad.descripcion):('')}"
					size="60" disabled="true" />
			</aon:div>
			
				<aon:outputLabel
					value="#{appBundle.aon_payroll_principales_tipocuenta}" />
                <aon:div>
				<aon:selectOneMenu id="TipoCtas" value="#{tipcuenta.to.tipcta}">
					<f:selectItem value="#{null}" itemLabel=" -  " />
					<f:selectItems value="#{tipcuenta.listaTipos}" />
				</aon:selectOneMenu>
                <aon:outputLabel
				value="                                               " />
				<aon:commandButton id="asignarcta"
					value="#{appBundle.aon_payroll_principales_tipocuenta_asignar}"
					styleClass="aon-icon-transfer"
					action="integral_form" rendered="#{!controller.new}"
					actionListener="#{tipcuenta.onAccept}">
				</aon:commandButton>


			</aon:div>
		</aon:panelGrid>
	</aon:div>

</ui:composition>
