<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

<aon:div id="empresasDataDiv">

		<aon:editDataTable id="empresasData" var="to" rows="4"
			value="#{empresa.model}"
			columnClasses="aon-editDataTable-textColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn,">

			<aon:rowSelector toggleOnClick="#{empresa.to == null}"
				actionListener="#{empresa.onSelect}" reRender="tabsInfo" />


			<aon:column>
				<f:facet name="header">
					<aon:outputText value="&#160;" />
				</f:facet>

				
					<aon:commandButton alt="[#{bundle.aon_reset}]"
						styleClass="aon-editDataTable-button aon-icon-rowSelector "
						actionListener="#{empresa.onSelect}" reRender="tabsInfo"
						ondblclick="empresa_form" accesskey="#{bundle.aon_key_new_line}"/>
						 <a4j:support event="ondblclick" 
								action="empresa_form"/>
						
					
				<f:facet name="footer">
					<aon:div>
						<aon:commandButton alt="[#{bundle.aon_reset}]"
							styleClass="aon-editDataTable-button aon-icon-reset"
							actionListener="#{empresa.onReset}" action="empresa_form"
							rendered="#{!empresa.new}" accesskey="#{bundle.aon_key_new_line}" />
							
					
					</aon:div>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
				</f:facet>
				<aon:outputText value="#{to.cdg}" />

			</aon:column>


			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_principales_clientes_empresa}" />
				</f:facet>
				<aon:outputText value="#{to.descripcion}" />

			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_principales_clientes_inirel}" />
				</f:facet>
				<aon:outputText value="#{to.fecini}" />

			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{appBundle.aon_payroll_principales_clientes_finrel}" />
				</f:facet>
				<aon:outputText value="#{to.fecfin}" />

			</aon:column>

	

		</aon:editDataTable>
		<aon:dataScroller2 for="empresasData" showNote="true" />

	</aon:div>

</ui:composition>
