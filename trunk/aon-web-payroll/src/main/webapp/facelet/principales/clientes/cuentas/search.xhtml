<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
	
	<aon:form id="cuentaSearch">
	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_principales_cuenta}" />
				<ui:param name="controller" value="#{cuenta}"/>
				<ui:param name="skipResetButton" value="true" />
				
			</ui:include>	
      
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{cuenta.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="cuenta_list" />	
			
			
			  <aon:div id="datos2" styleClass="aon-scroll-area">		
				<aon:panelGrid columns="2" dir="true" width="100%" style="margin-bottom=2px;">
				
				
				
	   	<aon:outputLabel for="Cuentas_cdg" value="#{appBundle.aon_payroll_principales_cuenta_cdg}" />
					<aon:inputText id="Cuentas_cdg" valueChangeListener="#{cuenta.addExpression}"
						 size="50" maxlength="30" />
			 						 		
				
	 	 			
			 		<aon:outputLabel for="Cuentas_cliente_cdg" 
						value="#{appBundle.aon_payroll_principales_domicilio_cli}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Cuentas_cliente_cdg"
							lookup="#{clienteLookup}"
							reRender="Cuentas_cliente_descripcion"
							value="#{cuenta.cliente.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Cliente_lookup"
							windowTitle="#{appBundle.aon_payroll_principales_clientes}"
							selectReRender="Cuentas_cliente_cdg,Cuentas_cliente_descripcion"
							lookup="#{clienteLookup}" minHeight="440"
							property="#{cuenta.cliente}">
						</aon:lookupButton>
						<aon:inputText id="Cuentas_cliente_descripcion"
							value="#{(cuenta.cliente.descripcion!=null)?(cuenta.to.cliente.descripcion):('')}"   
							size="34" disabled="true" />
					</aon:div>
						
						
							<aon:outputLabel for="Cuentas_entidad_description" value="#{appBundle.aon_payroll_principales_cuenta_entidad_nom}" />
					<aon:inputText id="Cuentas_entidad_description" valueChangeListener="#{cuenta.addExpression}"
						 size="50" maxlength="20" />
						 
							<aon:outputLabel for="Cuentas_entidad_cdg" value="#{appBundle.aon_payroll_principales_cuenta_entidad}" />
					<aon:inputText id="Cuentas_entidad_cdg" valueChangeListener="#{cuenta.addExpression}"
						 size="50" maxlength="20" />
						
							<aon:outputLabel for="Cuentas_sucursal_id_cdg" value="#{appBundle.aon_payroll_principales_cuenta_sucursal}" />
					<aon:inputText id="Cuentas_sucursal_id_cdg" valueChangeListener="#{cuenta.addExpression}" 
						 size="50" maxlength="20" />
						
							<aon:outputLabel for="Cuentas_dc"  value="#{appBundle.aon_payroll_principales_cuenta_dc}" />
					<aon:inputText id="Cuentas_dc" valueChangeListener="#{cuenta.addExpression}" 
						 size="50" maxlength="20" />
			  		
		            <aon:outputLabel for="Cuentas_numcta" value="#{appBundle.aon_payroll_principales_cuenta_numcta}" />
					<aon:inputText id="Cuentas_numcta" valueChangeListener="#{cuenta.addExpression}"
						 size="50" maxlength="20" />
			  		
						
	     	</aon:panelGrid>				
	         </aon:div> 
	         
		 </ui:define>
			</ui:decorate>
		
		</aon:form>
       <aon:lookupButtonPopup lookup="#{clienteLookup}" />	
		

	</ui:define>
</ui:composition>

</body>
</html>
