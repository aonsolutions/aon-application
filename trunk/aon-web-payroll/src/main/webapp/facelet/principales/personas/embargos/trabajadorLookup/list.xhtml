<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{appBundle.aon_payroll_pricipales_personas_embargos_cdg}" />
		</f:facet>
		<aon:outputText value="#{to.cdg}"/>
	</aon:column>
	
	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{appBundle.aon_payroll_resultados_tc2_ape}" />
		</f:facet>
		<aon:outputText value="#{to.persona.nombre} #{to.persona.descripcion} #{to.persona.apellido2}"/>
	</aon:column>
		
	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{appBundle.aon_payroll_pricipales_personas_embargos_alta}" />
		</f:facet>
		<aon:outputText value="#{to.fecalt}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>
	
	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{appBundle.aon_payroll_pricipales_personas_embargos_baja}" />
		</f:facet>
		<aon:outputText value="#{to.fecbaj}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

</ui:composition>

</body>
</html>
