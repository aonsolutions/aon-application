<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="percepSearch">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_principales_personas_percep}" />
				<ui:param name="controller" value="#{percepbasic}" />
				<aon:methodParam name="backAction" value="principales" />
				<!--  
				<aon:methodParam name="resetActionListener" default="#{controller.onReset}" type="actionListener" />
				-->
				<aon:methodParam name="resetAction" default="percep_form" resolve="true" />	
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{percepbasic.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="percep_list" />

					<aon:div id="percep" styleClass="aon-scroll-area aon-scroll-area-search">

						<aon:panelGrid columns="4" dir="true" width="100%"
							style="margin-bottom=2px;">
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_cdg}" />
							<aon:inputText id="Percep_id_cdg" 
									valueChangeListener="#{percepbasic.addExpression}" 
								size="10" maxlength="6" />
                                
						<!--  	
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep}" />
							<aon:inputText value="#{percep.to.id.numero}" 
								size="10" maxlength="6" />
						-->

							<aon:outputLabel for="Trabajador_cdg"
								value="#{appBundle.aon_payroll_principales_personas_percep_trab}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText 
									 id="Trabajador_cdg"
									lookup="#{trabajadorLookup}"
									reRender="act,acti,fec,desc,ape,nom,Trabajador_cdg" 
									value="#{percepbasic.trabajador.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Trabajador_lookup"
									windowTitle="#{appBundle.aon_payroll_principales_personas_percep_trab}"
									selectReRender="act,acti,fec,desc,ape,nom,Trabajador_cdg" 
									lookup="#{trabajadorLookup}"
									minHeight="440" property="#{percepbasic.trabajador}">
								</aon:lookupButton>
							</aon:div>
						</aon:panelGrid>
					
						<aon:panelGrid columns="4" dir="true" width="100%"
							style="margin-bottom=2px;">

						<!-- 	
							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_fecalt}" />
							<aon:selectInputDate id="fec" renderAsPopup="true" disabled="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{(percep.to.trabajador.fecalt!=null)?(percep.to.trabajador.fecalt):('')}"
								enableManualInput="true" /> 
						-->

							<aon:outputLabel for="act"
								value="#{appBundle.aon_payroll_principales_personas_percep_act}" />
							<aon:div>
								<aon:inputText id="act" size="10" maxlength="6" disabled="true"
									value="#{(percepbasic.trabajador.actividad.cdg!=null)?(percepbasic.trabajador.actividad.cdg):('')}" />
								
								<aon:inputText id="acti" disabled="true"
									value="#{(percepbasic.trabajador.actividad.descripcion!=null)?(percepbasic.trabajador.actividad.descripcion):('')}"
									size="60" maxlength="30" />
							</aon:div>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_trab}" />
							<aon:div>
								<aon:inputText id="nom" disabled="true"
									value="#{(percepbasic.trabajador.persona.nombre!=null)?(percepbasic.trabajador.persona.nombre):('')}"
									size="20" maxlength="30" />

								<aon:inputText id="desc" disabled="true"
									value="#{(percepbasic.trabajador.persona.descripcion!=null)?(percepbasic.trabajador.persona.descripcion):('')}"
									size="20" maxlength="30" />

								<aon:inputText id="ape" disabled="true"
									value="#{(percepbasic.trabajador.persona.apellido2!=null)?(percepbasic.trabajador.persona.apellido2):('')}"
									size="20" maxlength="30" />
							</aon:div>
						</aon:panelGrid>


							
						<aon:panelGrid columns="4" dir="true" width="100%"
							style="margin-bottom=2px;">

							<aon:outputLabel for="Percepcion_id_codcom"
								value="#{appBundle.aon_payroll_principales_personas_percep_cocom}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Percepcion_id_codcom"
									lookup="#{complementoLookup}"
									reRender="Percepcion_complemento_description"
									value="#{percepbasic.complemento.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Percepcion_id_codcom_lookup"
									windowTitle="#{appBundle.aon_payroll_auxiliares_convenios__aplic_comp}"
									selectReRender="Percepcion_complemento_description,Percepcion_id_codcom"
									lookup="#{complementoLookup}" minHeight="440"
									property="#{percepbasic.complemento}">
								</aon:lookupButton>
								<aon:outputText id="Percepcion_complemento_description"
									value="#{(percepbasic.complemento.description!=null)?(percepbasic.complemento.description):('')}"
									size="34" disabled="true" />
							</aon:div>


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_mes}" />
							<aon:inputText id="Percep_mes" 
									valueChangeListener="#{percepbasic.addExpression}" 
								size="10" maxlength="6" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_import}" />
							<aon:inputText id="Percep_importe" 
									valueChangeListener="#{percepbasic.addExpression}" 
								size="10" maxlength="6" />


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_cal}" />
							<aon:inputText id="Percep_calculo" 
									valueChangeListener="#{percepbasic.addExpression}" 
								size="10" maxlength="6" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_tipo}" />
							<aon:inputText id="Percep_tipcot" 
									valueChangeListener="#{percepbasic.addExpression}"  
								size="10" maxlength="6" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_ilt}" />
							<aon:inputText id="Percep_garilt" 
									valueChangeListener="#{percepbasic.addExpression}"  
								size="10" maxlength="6" />


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_tip}" />
							<aon:selectOneMenu id="Percep_tipcom" 
									valueChangeListener="#{percepbasic.addExpression}" >
									<aon:enumConverter
									enum="com.code.aon.payroll.enumeration.TipoComplemento" />
								<f:selectItem value="#{null}" itemLabel="  " />
								<f:selectItems value="#{percepbasic.listaComplementos}" />
							</aon:selectOneMenu>


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_uds}" />
							<aon:inputText id="Percep_unidades" 
									valueChangeListener="#{percepbasic.addExpression}"  size="10"
								maxlength="6" />


							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_impuni}" />
							<aon:inputText id="Percep_impuni" 
									valueChangeListener="#{percepbasic.addExpression}"  size="10"
								maxlength="6" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_desc}" />
							<aon:inputText id="Percep_descom" 
									valueChangeListener="#{percepbasic.addExpression}"  size="50"
								maxlength="40" />



							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_descabre}" />
							<aon:inputText id="Percep_desabr" 
									valueChangeListener="#{percepbasic.addExpression}"  size="50"
								maxlength="40" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_fechaini}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{percepbasic.fecini}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_fechafin}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{percepbasic.fecfin}" enableManualInput="true" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_principales_personas_percep_fecharet}" />
							<aon:selectInputDate renderAsPopup="true"
								popupDateFormat="#{appBundle.aon_date_pattern}"
								value="#{percepbasic.fecret}" enableManualInput="true" />

							<aon:outputLabel for="Percepcion_id_codcom"
								value="#{appBundle.aon_payroll_principales_personas_percep_comp}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Percepcion_id_codcom1"
									lookup="#{complementoLookup}"
									reRender="Percepcion_complemento1_description"
									value="#{percepbasic.complemento1.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Percepcion_id_codcom1_lookup"
									windowTitle="#{appBundle.aon_payroll_principales_personas_percep_comp}"
									selectReRender="Percepcion_complemento1_description,Percepcion_id_codcom1"
									lookup="#{complementoLookup}" minHeight="440"
									property="#{percepbasic.complemento1}">
								</aon:lookupButton>
								<aon:outputText id="Percepcion_complemento1_description"
									value="#{(percepbasic.complemento1.description!=null)?(percepbasic.complemento1.description):('')}"
									size="34" disabled="true" />
							</aon:div>
						</aon:panelGrid>


						<aon:panelGrid id="percep_right" columns="4" dir="true"
							width="100%" style="margin-bottom=2px;">
								<aon:outputText	value="#{appBundle.aon_payroll_auxiliares_convenios__ind_comp}" />
								<aon:selectOneRadio id="Percep_indcom" 
									valueChangeListener="#{percepbasic.addExpression}">
									<aon:enumConverter enum="com.code.aon.payroll.enumeration.IndiceComplemento" />	
									<f:selectItems value="#{percepbasic.listaIndiceComplemento}" />
								</aon:selectOneRadio>
							
								<aon:outputText
										value="#{appBundle.aon_payroll_auxiliares_convenios__fijo_var}" />
								<aon:selectOneRadio id="Percep_fijovar" 
									valueChangeListener="#{percepbasic.addExpression}">
									<aon:enumConverter enum="com.code.aon.payroll.enumeration.FijoVariable" />
									<f:selectItems value="#{percepbasic.listaFijoVariable}" />
								</aon:selectOneRadio>
							
								<aon:outputText
										value="#{appBundle.aon_payroll_auxiliares_convenios__retrib}" />
								<aon:selectOneRadio id="Percep_dinesp" 
									valueChangeListener="#{percepbasic.addExpression}">
									<aon:enumConverter enum="com.code.aon.payroll.enumeration.Retribuciones" />	
									<f:selectItems value="#{percepbasic.listaRetribuciones}" />
								</aon:selectOneRadio>
						</aon:panelGrid>

					</aon:div>
				</ui:define>
			</ui:decorate>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{trabajadorLookup}" />
		<aon:lookupButtonPopup lookup="#{complementoLookup}" />
	</ui:define>
</ui:composition>
