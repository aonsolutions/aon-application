<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	<body>

		<ui:composition
			template="/facelet/templates/aon.ui.content.xhtml">

			<ui:define name="content">

				<aon:form id="personaForm">

					<!-- <ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">-->
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">

						<ui:param name="toolbarTitle"
							value="#{appBundle.aon_payroll_pricipales_personas_mnto_personas}" />
						<ui:param name="controller" value="#{persona}" />
						<ui:param name="reportKey" value="personaList" />
						<ui:param name="reportKeyXls"
							value="personaListXls" />

						<ui:define name="beforeSpinToolbarContent">
							<h:commandLink  target="_blank" value="Integral Trabajadores"
								title="#{appBundle.aon_payroll_principales_integral_trabajadores}"
								styleClass="aon-finding-toolbar-item aon-icon-tree"
								action="integralTrab_search" rendered="#{!controller.new}"
								>
							</h:commandLink>
							<h:commandLink  target="_blank" value="Otras Percepciones"
								title="#{appBundle.aon_payroll_principales_personas_otrperc}"
								styleClass="aon-finding-toolbar-item aon-icon-agenda"
								action="otrperc_search" rendered="#{!controller.new}"
								>
							</h:commandLink>
							
							<!-- 
							<aon:commandButton 
								title="#{appBundle.aon_payroll_principales_fichero_contrato}"
								styleClass="aon-finding-toolbar-item aon-icon-category"
								action="cuenta_form" rendered="#{!controller.new}"
								actionListener="#{cuenta.onSelectFirst}" disabled="#{true}">
							</aon:commandButton>
							-->
						</ui:define>
					</ui:decorate>

					<aon:div id="personaForm"
						styleClass="aon-scroll-area aon-scroll-area-principales">

						<aon:panelGrid columns="4" dir="true"
							width="100%">

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_cdg}" />
							<aon:inputText value="#{persona.to.cdg}"
								size="4" maxlength="4" readonly="#{true}" disabled="#{true}" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_alias}" />
							<aon:inputText value="#{persona.to.alias}"
								size="20" maxlength="25" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_nombre}" />
							<aon:inputText value="#{persona.to.nombre}"
								size="20" maxlength="25" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_apellido1}" />
							<aon:inputText
								value="#{persona.to.descripcion}" size="20" maxlength="35" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_apellido2}" />
							<aon:inputText
								value="#{persona.to.apellido2}" size="20" maxlength="25" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_alias_tc2}" />
							<aon:inputText
								value="#{persona.to.aliastc2}" size="5" maxlength="5" 
								readonly="#{true}" />
						</aon:panelGrid>

						<rich:spacer />

						<aon:panelGrid columns="4" dir="true"
							width="100%">

							<aon:outputLabel for="Documento_cdg"
								value="#{appBundle.aon_payroll_pricipales_personas_tip_doc}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Documento_cdg"
									lookup="#{documentoLookup}" reRender="Documento_description"
									value="#{persona.to.tipdoc.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Documento_lookup"
									windowTitle="#{appBundle.aon_payroll_pricipales_personas_tip_doc}"
									selectReRender="Documento_cdg,Documento_description"
									lookup="#{documentoLookup}" minHeight="440"
									property="#{persona.to.tipdoc}">
								</aon:lookupButton>
								<aon:inputText
									id="Documento_description"
									value="#{(persona.to.tipdoc.description!=null)?(persona.to.tipdoc.description):('')}"
									size="55" disabled="true" />
								<br />
								<aon:inputText id="Persona_numdoc"
									value="#{persona.to.numdoc}" size="10" maxlength="10"  required="#{true}" >
									
								</aon:inputText>
							</aon:div>

							<aon:outputLabel for="Pais_cdg"
								value="#{appBundle.aon_payroll_pricipales_personas_pais}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Pais_cdg"
									lookup="#{paisLookup}" reRender="Pais_description"
									value="#{persona.to.pais.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Pais_lookup"
									windowTitle="#{appBundle.aon_payroll_pricipales_personas_pais}"
									selectReRender="Pais_cdg,Pais_description"
									lookup="#{paisLookup}" minHeight="440"
									property="#{persona.to.pais}">
								</aon:lookupButton>
								<aon:inputText id="Pais_description"
									value="#{(persona.to.pais.descripcion!=null)?(persona.to.pais.descripcion):('')}"
									size="55" disabled="true" />
							</aon:div>
						</aon:panelGrid>

						<rich:spacer />

						<aon:panelGrid columns="4" dir="true"
							width="100%">

							<aon:outputLabel for="Documento_cdg"
								value="#{appBundle.aon_payroll_pricipales_personas_via}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Tipovia_cdg"
									lookup="#{tipoviaLookup}" reRender="Tipovia_description"
									value="#{persona.to.tipovia.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Tipovia_lookup"
									windowTitle="#{appBundle.aon_payroll_pricipales_personas_via}"
									selectReRender="Tipovia_cdg,Tipovia_description"
									lookup="#{tipoviaLookup}" minHeight="440"
									property="#{persona.to.tipovia}">
								</aon:lookupButton>
								<aon:inputText id="Tipovia_description"
									value="#{(persona.to.tipovia.description!=null)?(persona.to.tipovia.description):('')}"
									size="55" disabled="true" />
							</aon:div>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_desc_via}" />
							<aon:inputText value="#{persona.to.nomvia}"
								size="30" maxlength="40" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_numero}" />
							<aon:inputText value="#{persona.to.numero}"
								size="5" maxlength="5" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_otros}" />
							<aon:inputText value="#{persona.to.otrdir}"
								size="15" maxlength="12" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_cp}" />
							<aon:inputText value="#{persona.to.codpos}"
								size="5" maxlength="5" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_localidad}" />
							<aon:inputText
								value="#{persona.to.localidad}" size="20" maxlength="30" />

							<aon:outputLabel for="Provincia_cdg"
								value="#{appBundle.aon_payroll_pricipales_personas_provincia}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Provincia_cdg"
									lookup="#{provinciaLookup}" reRender="Provincia_description"
									value="#{persona.to.provincia.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Provincia_lookup"
									windowTitle="#{appBundle.aon_payroll_pricipales_personas_provincia}"
									selectReRender="Provincia_cdg,Provincia_description"
									lookup="#{provinciaLookup}" minHeight="440"
									property="#{persona.to.provincia}">
								</aon:lookupButton>
								<aon:inputText
									id="Provincia_description"
									value="#{(persona.to.provincia.descripcion!=null)?(persona.to.provincia.descripcion):('')}"
									size="55" disabled="true" />
							</aon:div>
						</aon:panelGrid>

						<rich:spacer />

						<aon:panelGrid columns="4" dir="true"
							width="100%">

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_telefono}" />
							<aon:inputText
								value="#{persona.to.telefono}" size="15" maxlength="12" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_fax}" />
							<aon:inputText value="#{persona.to.fax}"
								size="15" maxlength="12" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_email}" />
							<aon:inputText value="#{persona.to.email}"
								size="30" maxlength="40" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_numss}" />
							<aon:inputText value="#{persona.to.numss}"
								size="15" maxlength="12" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_lugar_ncmto}" />
							<aon:inputText value="#{persona.to.lugnac}"
								size="20" maxlength="30" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_fecha_ncmto}" />
							<aon:selectInputDate
								value="#{persona.to.fecnac}" renderAsPopup="true"
								enableManualInput="true"
								popupDateFormat="#{bundle.aon_date_pattern}">
							</aon:selectInputDate>

							<aon:outputLabel for="Provincia1_cdg"
								value="#{appBundle.aon_payroll_pricipales_personas_prov_ncmto}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Provincia1_cdg"
									lookup="#{provinciaLookup}" reRender="Provincia1_description"
									value="#{persona.to.provincia1.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Provincia1_lookup"
									windowTitle="#{appBundle.aon_payroll_pricipales_personas_prov_ncmto}"
									selectReRender="Provincia1_cdg,Provincia1_description"
									lookup="#{provinciaLookup}" minHeight="440"
									property="#{persona.to.provincia1}">
								</aon:lookupButton>
								<aon:inputText
									id="Provincia1_description"
									value="#{(persona.to.provincia1.descripcion!=null)?(persona.to.provincia1.descripcion):('')}"
									size="55" disabled="true" />
							</aon:div>

							<aon:outputLabel for="Pais1_cdg"
								value="#{appBundle.aon_payroll_pricipales_personas_pais_ncmto}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Pais1_cdg"
									lookup="#{paisLookup}" reRender="Pais1_description"
									value="#{persona.to.pais1.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Pais1_lookup"
									windowTitle="#{appBundle.aon_payroll_pricipales_personas_pais_ncmto}"
									selectReRender="Pais1_cdg,Pais1_description"
									lookup="#{paisLookup}" minHeight="440"
									property="#{persona.to.pais1}">
								</aon:lookupButton>
								<aon:inputText id="Pais1_description"
									value="#{(persona.to.pais1.descripcion!=null)?(persona.to.pais1.descripcion):('')}"
									size="55" disabled="true" />
							</aon:div>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_padre}" />
							<aon:inputText value="#{persona.to.padre}"
								size="20" maxlength="25" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_madre}" />
							<aon:inputText value="#{persona.to.madre}"
								size="20" maxlength="25" />

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_estado_civil}" />
							<aon:selectOneMenu
								value="#{persona.to.estciv}">
								<f:selectItems
									value="#{persona.listaEstciv}" />
							</aon:selectOneMenu>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_nacionalidad}" />
							<aon:div styleClass="aon-lookup">
								<aon:lookupInputText id="Nacion_cdg"
									lookup="#{nacionLookup}" reRender="Nacion_description"
									value="#{persona.to.nacion.cdg}" size="5">
								</aon:lookupInputText>
								<aon:lookupButton id="Nacion_lookup"
									windowTitle="#{appBundle.aon_payroll_pricipales_personas_nacionalidad}"
									selectReRender="Nacion_cdg,Nacion_description"
									lookup="#{nacionLookup}" minHeight="440"
									property="#{persona.to.nacion}">
								</aon:lookupButton>
								<aon:inputText id="Nacion_description"
									value="#{(persona.to.nacion.description!=null)?(persona.to.nacion.description):('')}"
									size="55" disabled="true" />
							</aon:div>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_genero}" />
							<aon:selectOneRadio
								value="#{persona.to.sexo}">
								<f:selectItems
									value="#{persona.listaSexo}" />
							</aon:selectOneRadio>

							<aon:outputLabel
								value="#{appBundle.aon_payroll_pricipales_personas_observaciones}" />
							<aon:inputTextarea
								value="#{persona.to.obsper}" cols="70" rows="5" size="1"
								maxlength="100" />

						</aon:panelGrid>
					</aon:div>
				</aon:form>
				
				<aon:lookupButtonPopup lookup="#{documentoLookup}" />
				<aon:lookupButtonPopup lookup="#{paisLookup}" />
				<aon:lookupButtonPopup lookup="#{tipoviaLookup}" />
				<aon:lookupButtonPopup lookup="#{provinciaLookup}" />
				<aon:lookupButtonPopup lookup="#{nacionLookup}" />
			</ui:define>
		</ui:composition>
	</body>
</html>
