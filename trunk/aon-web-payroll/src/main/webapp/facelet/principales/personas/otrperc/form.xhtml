<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="otrpercForm">

			<ui:include src="/facelet/templates/formPrintToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.auxiliares_organismos_entidades__otrperc}" />
				<ui:param name="controller" value="#{otrperc}" />
				<ui:param name="reportKey" value="DelegacionList" />
			</ui:include>

			<aon:div id="otrperc" styleClass="aon-scroll-area">


				<aon:div>
					<aon:panelGrid columns="2" dir="true" width="100%"
						style="margin-bottom=2px;">
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_num}" />
						<aon:inputText value="#{otrperc.to.cdg}" required="true" size="10"
							maxlength="6" />

						<aon:outputLabel for="Persona_cdg"
							value="#{appBundle.aon_payroll_principales_personas_otrperc_per}" />
						<aon:div styleClass="aon-lookup">
							<aon:lookupInputText id="Persona_cdg" lookup="#{personaLookup}"
								reRender="Persona_description" value="#{otrperc.to.persona.cdg}"
								size="5">
							</aon:lookupInputText>
							<aon:lookupButton id="Persona_lookup"
								windowTitle="#{appBundle.aon_payroll_auxiliares_tipos__tipovia}"
								selectReRender="Persona_cdg,Persona_description"
								lookup="#{personaLookup}" minHeight="440"
								property="#{otrperc.to.persona}">
							</aon:lookupButton>

						</aon:div>

						<aon:outputLabel for="Empresa_cdg"
							value="#{appBundle.aon_payroll_principales_personas_otrperc_emp}" />
						<aon:div styleClass="aon-lookup">
							<aon:lookupInputText id="Empre_cdg" lookup="#{empresaLookup}"
								reRender="Empr_description" value="#{otrperc.to.empresa.cdg}"
								size="5">
							</aon:lookupInputText>
							<aon:lookupButton id="Empre_lookup"
								windowTitle="#{appBundle.aon_payroll_principales_tipocuenta_empresa}"
								selectReRender="Empre_cdg,Empre_description"
								lookup="#{empresaLookup}" minHeight="440"
								property="#{otrperc.to.empresa}">
							</aon:lookupButton>
							<aon:inputText id="Empre_description"
								value="#{(otrperc.to.empresa.descripcion!=null)?(otrperc.to.empresa.descripcion):('')}"
								size="60" disabled="true" />
						</aon:div>

					</aon:panelGrid>
				</aon:div>
				<rich:spacer />

				<aon:div>
					<aon:panelGrid columns="2" dir="true" width="100%"
						style="margin-bottom=2px;">
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_nom}" />
						<aon:inputText value="#{otrperc.to.persona.nombre}" size="60"
							maxlength="20" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_ape1}" />
						<aon:inputText value="#{otrperc.to.persona.descripcion}" size="60"
							maxlength="20" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_ape2}" />
						<aon:inputText value="#{otrperc.to.persona.apellido2}" size="60"
							maxlength="20" />
					</aon:panelGrid>
				</aon:div>

				<aon:div>
					<aon:panelGrid columns="4" dir="true" width="100%">
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_fecha}" />
						<aon:selectInputDate renderAsPopup="true"
							popupDateFormat="#{appBundle.aon_date_pattern}"
							value="#{otrperc.to.fecha}" enableManualInput="true" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_concep}" />
						<aon:inputText value="#{otrperc.to.concepto}" size="60"
							maxlength="20" />
						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_claveper}" />
						<aon:inputText value="#{otrperc.to.clave}" size="60"
							maxlength="20" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_subclave}" />
						<aon:inputText value="#{otrperc.to.subclave}" size="60"
							maxlength="20" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_imp}" />
						<aon:inputText value="#{otrperc.to.importe}" size="60"
							maxlength="20" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_base}" />
						<aon:inputText value="#{otrperc.to.base}" size="60" maxlength="20" />


						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_porcen}" />
						<aon:inputText value="#{otrperc.to.prcret}" size="60"
							maxlength="20" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_ret}" />
						<aon:inputText value="#{otrperc.to.retencion}" size="60"
							maxlength="20" />



						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_apor}" />
						<aon:inputText value="#{otrperc.to.aportaSs}" size="60"
							maxlength="20" />


						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_anio}" />
						<aon:inputText value="#{otrperc.to.anio}" size="60" maxlength="20" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_nat}" />
						<aon:inputText value="#{otrperc.to.natret}" size="60"
							maxlength="20" />


						<aon:outputLabel
							value="#{appBundle.aon_payroll_principales_personas_otrperc_ingresocuenta}" />
						<aon:inputText value="#{otrperc.to.ingreso}" size="60"
							maxlength="20" />


						</aon:panelGrid>
							</aon:div>



							</aon:div></aon:form>
		<aon:lookupButtonPopup lookup="#{personaLookup}" />

	</ui:define>
</ui:composition>

</body>
</html>
