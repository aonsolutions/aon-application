<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="embargoList">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_principales_clientes}" />
				<ui:param name="controller" value="#{embargo}"/>
				<ui:param name="skipBackButton" value="false" />
				<aon:methodParam name="cancelAction" value="embargo_form"/>	
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<aon:dataTable id="embargoData" value="#{embargo.model}" var="to" rows="20" 
					columnClasses="aon-editDataTable-textColumn, 
					aon-editDataTable-textColumn, aon-editDataTable-textColumn">

					<aon:rowSelector action="embargo_form" actionListener="#{embargo.onSelect}" />
					
 					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_pricipales_personas_embargos_trabajador}" />
						</f:facet>
						<aon:outputText value="#{to.codper}"/>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_pricipales_personas_embargos_cdg}" />
						</f:facet>
						<aon:outputText value="#{to.id.cdg}"/>
					</aon:column>
		
					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.aon_payroll_pricipales_personas_embargos_comienzo}" />
						</f:facet>
						<aon:outputText value="#{to.id.fecha}" >
							<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
						</aon:outputText>
					</aon:column>

 				</aon:dataTable>

				<aon:dataScroller2 for="embargoData"  showNote="true" />

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
