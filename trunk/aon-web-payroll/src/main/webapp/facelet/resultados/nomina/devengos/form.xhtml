<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="percepForm">


			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{appBundle.aon_payroll_resultados_devengos}" />
				<ui:param name="controller" value="#{nominadev}" />
				<ui:param name="reportKey" value="DelegacionList" />
				<aon:methodParam name="backAction" value="nomina_form"/>	
				
			</ui:include>
			<aon:div id="clientes"
				styleClass="aon-scroll-area aon-scroll-area-principales">

				<aon:div id="percep" styleClass="aon-scroll-area">

					<aon:panelGrid columns="4" dir="true" width="100%"
						style="margin-bottom=2px;">

						<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_cdg}" />
						<aon:inputText value="#{nominadev.to.id.cdg}" size="10"  disabled="true"
							maxlength="6" />

						<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_ord}" />
						<aon:inputText value="#{nominadev.to.id.orden}" size="10"  disabled="true"
							maxlength="6" />
							
								<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_des}" />
						<aon:inputText value="#{nominadev.to.descom}" size="60"
							maxlength="6" />
							
										<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_uni}" />
						<aon:inputText value="#{nominadev.to.unidades}" size="10"
							maxlength="6" />
							
										<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_impuni}" />
						<aon:inputText value="#{nominadev.to.impuni}" size="10"
							maxlength="6" />
							
										<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_importe}" />
						<aon:inputText value="#{nominadev.to.importe}" size="10"
							maxlength="6" />
					

						<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_codcom}" />

						<aon:div id="CompleLookupDiv" styleClass="aon-lookup">
							<aon:lookupInputText id="Comple_cdg"
								lookup="#{complementoLookup}" value="#{nominadev.to.codcom}"
								size="5">
							</aon:lookupInputText>
							<aon:lookupButton id="Comple_lookup"
								windowTitle="#{appBundle.aon_payroll_resultados_devengos_codcom}"
								selectReRender="Comple_cdg" lookup="#{complementoLookup}"
								minHeight="440" property="#{nominadev.complemento}">
							</aon:lookupButton>

						</aon:div>


						<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_tipcom}" />
						<aon:selectOneMenu value="#{nominadev.to.tipcom}">

							<f:selectItem value="#{null}" itemLabel="    " />
							<f:selectItems value="#{nominadev.tipcom}" />
						</aon:selectOneMenu>
						
								<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_importe_fijovar}" />
						<aon:selectOneMenu value="#{nominadev.to.fijovar}">

							<f:selectItem value="#{null}" itemLabel="    " />
							<f:selectItems value="#{nominadev.fijovar}" />
						</aon:selectOneMenu>
						
						
								<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_importe_indcom}" />
						<aon:selectOneMenu value="#{nominadev.to.indcom}">

							<f:selectItem value="#{null}" itemLabel="    " />
							<f:selectItems value="#{nominadev.indicescom}" />
						</aon:selectOneMenu>
						
								<aon:outputLabel
							value="#{appBundle.aon_payroll_resultados_devengos_importe_ret}" />
						<aon:selectOneMenu value="#{nominadev.to.dinesp}">

							<f:selectItem value="#{null}" itemLabel="    " />
							<f:selectItems value="#{nominadev.dinesp}" />
						</aon:selectOneMenu>

					</aon:panelGrid>

				</aon:div>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{complementoLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
