<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="tc2Search">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{menuBundle.aon_payroll_resultados_tc1}" />
				<ui:param name="controller" value="#{tc1}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener"
						value="#{tc1.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="tc1_list" />
					
					
					<aon:div id="cliente"
						styleClass="aon-scroll-area aon-scroll-area-nom">

						
						<aon:panelGrid columns="6" dir="true" width="100%"
								style="margin-bottom=2px;">


								<aon:outputLabel
									value="#{appBundle.aon_payroll_resultados_tc2_act}" />
								<aon:div styleClass="aon-lookup">
									<aon:lookupInputText id="Acti_cdg" lookup="#{actividadLookup}"
										value="#{tc1.actividad.cdg}" size="5"></aon:lookupInputText>
									<aon:lookupButton id="Act_lookup"
										windowTitle="#{appBundle.aon_payroll_resultados_tc2_act}"
										selectReRender="Acti_cdg"
										lookup="#{actividadLookup}" minHeight="440"
										property="#{tc1.actividad}">
									</aon:lookupButton>
									</aon:div>
						</aon:panelGrid>
						
					</aon:div>
					
						
					

			

				</ui:define>
			</ui:decorate>
		</aon:form>

		<aon:lookupButtonPopup lookup="#{actividadLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
