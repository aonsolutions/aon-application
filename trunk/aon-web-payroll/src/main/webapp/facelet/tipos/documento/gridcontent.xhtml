<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition>

	<aon:form id="documentoGrid">

		<aon:div ajaxRendered="true" layout="none">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{appBundle.payroll_tipdoc_label}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{appBundle.payroll_crud_label}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="reset" value="#{bundle.aon_reset}"
							actionListener="#{tiposDocumento.onReset}" rendered="#{!tiposDocumento.new}"
							styleClass="aon-finding-toolbar-item aon-icon-reset"
							accesskey="#{bundle.aon_key_new}"/>
						<aon:commandButton id="save"
							value="#{bundle.aon_save}" rendered="#{tiposDocumento.to!=null or tiposDocumento.new}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{tiposDocumento.onAccept}" 
							accesskey="#{bundle.aon_key_new}" />
						<aon:confirmButton id="cancelNew"
							value="#{bundle.aon_cancel}" rendered="#{tiposDocumento.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
							confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_cancel_confirm}"
							confirmActionListener="#{tiposDocumento.onCancel}"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:commandButton id="cancelEdit"
							value="#{bundle.aon_cancel}" rendered="#{tiposDocumento.to!=null and (!tiposDocumento.new)}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
							actionListener="#{tiposDocumento.onCancel}"
							accesskey="#{bundle.aon_key_cancel}"/>
						<aon:confirmButton id="remove"
							value="#{bundle.aon_remove}" rendered="#{tiposDocumento.to!=null and !tiposDocumento.new}"
							styleClass="aon-finding-toolbar-item aon-icon-delete" immediate="true"
							confirmTitle="#{bundle.aon_confirm_title}" confirmMessage="#{bundle.aon_remove_confirm}"
							confirmActionListener="#{tiposDocumento.onRemove}"
							accesskey="#{bundle.aon_key_remove}"/>
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<!--  aon-region-body -->
 			<aon:div styleClass="aon-scroll-area">
				
				<aon:editDataTable id="documentoData" var="to" rows="0"
					rendered="#{(tiposDocumento.model.rowCount > 0) or (tiposDocumento.new)}" value="#{tiposDocumento.model}"
					columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-numberColumn, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">
							
					<aon:rowSelector toggleOnClick="#{tiposDocumento.to == null}"
						actionListener="#{tiposDocumento.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:outputText value="&#160;" />
						<f:facet name="footer">
							<aon:div>
								<aon:commandButton alt="[#{bundle.aon_reset}]"
									styleClass="aon-editDataTable-button aon-icon-reset"
									actionListener="#{tiposDocumento.onReset}" value=""
									rendered="#{!tiposDocumento.new}"
									accesskey="#{bundle.aon_key_new_line}" />
							</aon:div>
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.payroll_cdg_label}" />
						</f:facet>
						<aon:outputText value="#{to.cdg}" rendered="#{to!=tiposDocumento.to}" />
						<aon:inputText styleClass="aon-form-input-text " required="true"
							rendered="#{to==tiposDocumento.to}" size="2"
							value="#{tiposDocumento.to.cdg}" maxlength="1" />
						<f:facet name="footer">
							<aon:inputText styleClass="aon-form-input-text" required="true"
								rendered="#{tiposDocumento.new}" size="2"
								value="#{tiposDocumento.to.cdg}" maxlength="1" />
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{appBundle.payroll_description_label}" />
						</f:facet>
						<aon:outputText value="#{to.description}" rendered="#{to!=tiposDocumento.to}" />
						<aon:inputText styleClass="aon-form-input-text " required="true"
							rendered="#{to==tiposDocumento.to}" size="60"
							value="#{tiposDocumento.to.description}" maxlength="45" />
						<f:facet name="footer">
							<aon:inputText styleClass="aon-form-input-text" required="true"
								rendered="#{tiposDocumento.new}" size="60"
								value="#{tiposDocumento.to.description}" maxlength="45" />
						</f:facet>
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="&#160;" />
						</f:facet>
						<aon:div>
							<f:verbatim rendered="#{to!=tiposDocumento.to}">&#160;</f:verbatim>
							<aon:commandButton id="acceptEdit-Scope" title="[#{bundle.aon_accept}]" 
								rendered="#{to==tiposDocumento.to}"
								styleClass="aon-editDataTable-button aon-icon-accept"
								actionListener="#{tiposDocumento.onAccept}"
								accesskey="#{bundle.aon_key_save_line}" />
							<aon:commandButton title="[#{bundle.aon_cancel}]"
								styleClass="aon-editDataTable-button aon-icon-cancel"
								rendered="#{to==tiposDocumento.to}"
								actionListener="#{tiposDocumento.onCancel}" immediate="true"
								accesskey="#{bundle.aon_key_cancel_line}" />
							<aon:confirmButton title="[#{bundle.aon_remove}]"
								styleClass="aon-editDataTable-button aon-icon-delete"
								rendered="#{to==tiposDocumento.to}"
								confirmTitle="#{bundle.aon_confirm_title}" 
								confirmMessage="#{bundle.aon_remove_confirm}"
								confirmActionListener="#{tiposDocumento.onRemove}" immediate="true"
								accesskey="#{bundle.aon_key_remove_line}" />								
						</aon:div>
						<f:facet name="footer">
							<aon:div>
								<f:verbatim rendered="#{!tiposDocumento.new}">&#160;</f:verbatim>
								<aon:commandButton title="[#{bundle.aon_accept}]" 
									styleClass="aon-editDataTable-button aon-icon-accept"
									rendered="#{tiposDocumento.new}"
									actionListener="#{tiposDocumento.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:confirmButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{tiposDocumento.new}"
									confirmTitle="#{bundle.aon_confirm_title}" 
									confirmMessage="#{bundle.aon_cancel_confirm}"
									confirmActionListener="#{tiposDocumento.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
							</aon:div>
						</f:facet>
					</aon:column>
					
				</aon:editDataTable>
				<aon:dataScroller for="documentoData" rowCount="#{tiposDocumento.model.rowCount}" showNote="true" />
			</aon:div>
		</aon:div>
	</aon:form>

</ui:composition>

</body>
</html>
