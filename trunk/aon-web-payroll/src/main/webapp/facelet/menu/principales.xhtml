<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"

	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="principalesMenu">

				<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column,aon-portlets-column">
	
					<aon:panelGroup>
						<aon:panel>
							<f:facet name="header">
								<aon:outputText value="#{menuBundle.principales_clientes}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div>
									<aon:commandLink action="cliente_form"
										value="#{menuBundle.principales_clientes__cliente}"
										>
										<aon:actionListener method="#{cliente.onEditSearch}" />
										<aon:actionListener method="#{cliente.onSearch}" />
										<aon:actionListener method="#{cliente.onSelectFirst}" />
								
									</aon:commandLink>
								</aon:div>
								<aon:div>
									<aon:commandLink value="#{menuBundle.principales_clientes__integral_clientes}" 
										action="integral_form" >
										<aon:actionListener method="#{cliente.onEditSearch}" />
										<aon:actionListener method="#{cliente.onSearch}" />
										<aon:actionListener method="#{cliente.onSelectFirst}" />
										<aon:actionListener method="#{empresa.onSelectFirst}" />
									<!--  <aon:actionListener method="#{tipdomicilio.onSelectFirst}" />
										<aon:actionListener method="#{tipcuenta.onSelectFirst}" />-->
									</aon:commandLink>
								</aon:div>
								<aon:div>
									<aon:commandLink value="#{menuBundle.principales_clientes__empresa}" 
										action="empresa_form" >
										<aon:actionListener method="#{empresa.onEditSearch}" />
										<aon:actionListener method="#{empresa.onSearch}" />
										<aon:actionListener method="#{empresa.onSelectFirst}" />
									</aon:commandLink>
								</aon:div>
								<aon:div>
									<aon:commandLink value="#{menuBundle.principales_clientes__actividad}" 
										disabled="true" />
								</aon:div>
							</aon:div>
						</aon:panel>
				
						<aon:div styleClass="aon-padding-top">
							<aon:panel>
								<f:facet name="header">
									<aon:outputText value="#{menuBundle.principales_autonomos}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div>
										<aon:commandLink value="#{menuBundle.principales_autonomos__autonomos}" action="autonomo_form" >
										<aon:actionListener method="#{autonomo.onEditSearch}" />
										<aon:actionListener method="#{autonomo.onSearch}" />

									</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panel>
						</aon:div>
		
						<aon:div styleClass="aon-padding-top">		
							<aon:panel>
								<f:facet name="header">
									<aon:outputText value="#{menuBundle.principales_registro_documentos}"/>
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div>
										<aon:commandLink value="#{menuBundle.principales_registro_documentos__regiempr}" disabled="true" />
									</aon:div>
									<aon:div>
										<aon:commandLink value="#{menuBundle.principales_registro_documentos__regitrab}" disabled="true" />
									</aon:div>
								</aon:div>
							</aon:panel>
						</aon:div>

						<f:facet name="header">
							<aon:outputText value="#{menuBundle.principales_personas}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div>
								<aon:commandLink value="#{menuBundle.principales_personas__personas}" action="persona_form" >
									<aon:actionListener method="#{persona.onEditSearch}" />
									<aon:actionListener method="#{persona.onSearch}" />
									<aon:actionListener method="#{persona.onSelectFirst}" />
								</aon:commandLink>
							</aon:div>
							<aon:div>
								<aon:commandLink value="#{menuBundle.principales_personas__integral_per}" disabled="true" />

									<aon:actionListener method="#{percep.onSelectFirst}" />

								<aon:commandLink value="#{menuBundle.principales_personas__otrperc}" action="otrperc_form" >

										<aon:actionListener method="#{otrperc.onSelectFirst}" />
									</aon:commandLink>
							</aon:div>
							<aon:div>
								<aon:commandLink value="#{menuBundle.principales_personas__embargo}" action="embargo_form" >
									<aon:actionListener method="#{embargo.onEditSearch}" />
									<aon:actionListener method="#{embargo.onSearch}" />
									<aon:actionListener method="#{embargo.onSelectFirst}" />
								</aon:commandLink>
							</aon:div>
						</aon:div>
					</aon:panel>
	
					
				</aon:panelGrid>		

			</aon:div>
