<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form id="generatorForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="2" dir="true"
					columnClasses="aon-finding-title,aon-finding-toolbar">
	
					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText value="#{appBundle.aon_web_info}" />
					</aon:div>
		
					<aon:div styleClass="aon-finding-toolbar-item-group" ajaxRendered="true">
						<aon:commandButton id="generate"
							value="#{appBundle.aon_web_info_generate}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{generator.onGenerate}"/>
						<h:outputLink id="web" value="#{generator.webPage}" target="_new"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							rendered="#{generator.generate}">
							<aon:outputText value="#{appBundle.aon_web_info_view}"/>
						</h:outputLink>
					</aon:div>
				</aon:panelGrid>
			</aon:div>
		<rich:panel styleClass="aon-content-home">
		</rich:panel>
		</aon:form>
	</ui:define>
</ui:composition>
