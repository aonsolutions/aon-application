<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>
	<aon:div id="aon-header">	
		<aon:panelGrid cellpadding="0" cellspacing="0" border="0" columns="3" style="width:100%"
			columnClasses="aon-header-name,aon-header-slogan,aon-header-info">
			<aon:div>
				<aon:outputConnectionStatus	styleClass="aon-outputConnectionStatus"		
					startStyleClass="aon-outputConnectionStatus-start"
					stopStyleClass="aon-outputConnectionStatus-stop"/>
				<aon:outputText value="#{appBundle.aon_application_title}" styleClass="aon-applicationName"/>
			</aon:div>
	
			<aon:div> 
				<aon:div rendered="#{aonConfiguration.properties.middleHeader == null}">
					<aon:outputText value="&#160;"/>
				</aon:div>
				<aon:div rendered="#{aonConfiguration.properties.middleHeader != null}">
					<aon:outputText escape="false" value="#{aonConfiguration.properties.middleHeader}" />
				</aon:div>
			</aon:div>
	         <aon:div styleClass="aon-nowrap">
	            <aon:div style="white-space:nowrap;" rendered="#{loggedUser.logged}">
	               <aon:outputText value="#{loggedUser.companyName}" />
	               <aon:outputText value=" / " />
	               <aon:outputText value="#{loggedUser.loggedUserName}" styleClass="aon-bold"/>
	            </aon:div>
	         </aon:div>
	    </aon:panelGrid>
      <aon:form>
         <aon:div styleClass="aon-header-additionalInfo">            
            <aon:div styleClass="aon-float-right">
               <aon:div styleClass="aon-header-menu-item">
                  <h:outputLink 
                     target="_top"
                     value="${facesContext.externalContext.requestContextPath}">
                     <h:outputText value="#{bundle.aon_home}" />
                  </h:outputLink>
                  <aon:commandLink style="border-right:0;" action="logout"
                     actionListener="#{aonConfiguration.logout}">
                     <aon:outputText value="#{securityBundle.aon_login_user_logout}" />
                  </aon:commandLink>
               </aon:div>   
            </aon:div>
            <aon:outputText value="#{aonConfiguration.currentDate}" />
         </aon:div>
      </aon:form>   
   </aon:div>
</ui:composition>

</body>
</html>
