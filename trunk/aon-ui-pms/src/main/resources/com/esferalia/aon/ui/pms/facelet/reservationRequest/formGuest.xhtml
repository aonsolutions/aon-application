<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:outputLabel for="ReservationRequestGuest_name" value="#{bundle.aon_name}"/>
	<aon:outputText	value="#{reservationRequest.requestGuest.name}" styleClass="aon-bold"
		rendered="#{!reservationRequest.to.active}" />
	<aon:inputText id="ReservationRequestGuest_name"
		value="#{reservationRequest.requestGuest.name}" size="30" maxlength="64"
		required="#{reservationRequestRoom.availabilityRequested}" 
		onblur="toUpperCase(this);"
		rendered="#{reservationRequest.to.active}" />

	<aon:outputLabel for="ReservationRequestGuest_surname" value="#{bundle.aon_surname}"/>
	<aon:outputText	value="#{reservationRequest.requestGuest.surname}" styleClass="aon-bold"
		rendered="#{!reservationRequest.to.active}" />
	<aon:inputText id="ReservationRequestGuest_surname"
		value="#{reservationRequest.requestGuest.surname}" size="50" maxlength="64"
		required="#{reservationRequestRoom.availabilityRequested}" 
		onblur="toUpperCase(this);"
		rendered="#{reservationRequest.to.active}" />

	<aon:outputLabel for="ReservationRequestGuest_address" value="#{bundle.aon_address}"/>
	<aon:outputText	value="#{reservationRequest.requestGuest.address}" styleClass="aon-bold"
		rendered="#{!reservationRequest.to.active}" />
	<aon:inputText id="ReservationRequestGuest_address"
		value="#{reservationRequest.requestGuest.address}" size="50" maxlength="256"
		rendered="#{reservationRequest.to.active}" />

	<aon:outputLabel for="ReservationRequestGuest_city" value="#{bundle.aon_city}"/>
	<aon:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto" rendered="#{!reservationRequest.to.active}">
		<aon:outputText	value="#{reservationRequest.requestGuest.city}" styleClass="aon-bold" />
		<aon:div>
			<aon:outputLabel for="ReservationRequestGuest_zip" value="#{bundle.aon_postal_code}" styleClass="aon-italic aon-margin-left aon-margin-right" />
			<aon:outputText	value="#{reservationRequest.requestGuest.zip}" styleClass="aon-bold" />
		</aon:div>
	</aon:panelGrid>
	<aon:div rendered="#{reservationRequest.to.active}">
		<aon:inputText id="ReservationRequestGuest_city"
			value="#{reservationRequest.requestGuest.city}" size="30" maxlength="64" />
		<aon:outputLabel value="#{bundle.aon_postal_code}" styleClass="aon-italic aon-margin-left aon-margin-right" />
		<aon:inputText id="ReservationRequestGuest_zip"
			value="#{reservationRequest.requestGuest.zip}" size="9" maxlength="16" />
	</aon:div>

	<aon:outputLabel for="ReservationRequestGuest_province" value="#{bundle.aon_state}"/>
	<aon:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto" rendered="#{!reservationRequest.to.active}">
		<aon:outputText	value="#{reservationRequest.requestGuest.province}" styleClass="aon-bold" />
		<aon:div>
			<aon:outputLabel value="#{bundle.aon_country}" styleClass="aon-italic aon-margin-left aon-margin-right" />
			<aon:outputText	value="#{reservationRequest.requestGuest.country}" styleClass="aon-bold" />
		</aon:div>
	</aon:panelGrid>
	<aon:div rendered="#{reservationRequest.to.active}">
		<aon:inputText id="ReservationRequestGuest_province"
			value="#{reservationRequest.requestGuest.province}" size="30" maxlength="64" />
		<aon:outputLabel for="ReservationRequestGuest_country" value="#{bundle.aon_country}" styleClass="aon-italic aon-margin-left aon-margin-right" />
		<aon:inputText id="ReservationRequestGuest_country" 
			value="#{reservationRequest.requestGuest.country}" size="3" maxlength="2" />
	</aon:div>

	<aon:outputLabel for="ReservationRequestGuest_phone" value="#{bundle.aon_phone}"/>
	<aon:outputText	value="#{reservationRequest.requestGuest.phone}" styleClass="aon-bold"
		rendered="#{!reservationRequest.to.active}" />
	<aon:inputText id="ReservationRequestGuest_phone"
		value="#{reservationRequest.requestGuest.phone}" size="30" maxlength="32"
		rendered="#{reservationRequest.to.active}" />

	<aon:outputLabel for="ReservationRequestGuest_email" value="Email" />
	<aon:outputText	value="#{reservationRequest.requestGuest.email}" styleClass="aon-bold"
		rendered="#{!reservationRequest.to.active}" />
	<aon:inputText id="ReservationRequestGuest_email"
		value="#{reservationRequest.requestGuest.email}" size="50" maxlength="128"
		onblur="toLowCase(this);"
		rendered="#{reservationRequest.to.active}" />

</ui:composition>
