<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showRoomDetailWindow">
		<c:if test="#{modalController.showRoomDetailWindow}">
			<rich:modalPanel id="roomDetailModalPanel" minHeight="425" minWidth="750" 
				rendered="#{modalController.showRoomDetailWindow}"
				showWhenRendered="true" zindex="90" style="overflow-y:auto">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{(controller.to.roomNumber == null) ? (pmsBundle.pms_room_assign) : (pmsBundle.pms_room_change)}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							actionListener="#{controller.onCancel}"
							reRender="aonContent" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{modalController.showRoomDetailWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="roomDetailFrom">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="roomDetail-accept"
										rendered="#{modalController.allReallocated}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										value="#{bundle.aon_save} #{pmsBundle.pms_stay}"
										actionListener="#{modalController.onAcceptDivert}">
										<rich:componentControl for="roomDetailModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{modalController.showRoomDetailWindow}"
											value="#{false}" />
									</aon:commandButton>
									<aon:commandButton id="roomDetail-back"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										value="#{bundle.aon_back}" 
										actionListener="#{controller.onCancel}"
										reRender="showRoomDetailWindow" immediate="true">
										<f:setPropertyActionListener
											target="#{modalController.showRoomDetailWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
								<aon:div styleClass="aon-scroll-area" style="margin-top: 1em;" id="divertGrid">
								
									<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
										columnClasses="aon-panelGrid-odd aon-width-140,aon-panelGrid-even aon-width-auto">
										
										<ui:include src="/com/esferalia/aon/ui/pms/facelet/divert/form_content.xhtml" />
											
									</aon:panelGrid>

								</aon:div>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
