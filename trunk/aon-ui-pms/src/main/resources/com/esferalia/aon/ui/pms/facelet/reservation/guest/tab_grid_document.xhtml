<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:div style="width: 100%;">
		<aon:panelGrid columns="2" columnClasses="aon-italic,">
			<aon:outputLabel for="ProjectReservationGuest_documentType" value="#{bundle.aon_type}"/>
			<aon:selectOneMenu id="ProjectReservationGuest_documentType#{suffix}"
				value="#{controller.to.documentType}">
				<f:selectItems value="#{registryCollections.documentTypes}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="ProjectReservationGuest_documentCountry" value="#{bundle.aon_country}"/>
			<aon:selectOneMenu id="ProjectReservationGuest_documentCountry#{suffix}"
				value="#{controller.to.documentCountry}">
				<f:selectItems value="#{commonCollections.countryCodes}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="ProjectReservationGuest_document" value="#{bundle.aon_number}"/>
			<aon:inputText id="ProjectReservationGuest_document#{suffix}" styleClass="aon-margin-left aon-form-input-text"
				value="#{controller.to.document}" size="15" maxlength="16"
				onblur="toUpperCase(this);" />
		</aon:panelGrid>
 	</aon:div>
</ui:composition>
