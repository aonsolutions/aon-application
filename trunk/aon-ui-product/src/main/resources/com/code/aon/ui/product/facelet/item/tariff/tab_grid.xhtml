<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{itemTariff}" />

		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
				<f:facet name="header">
					<aon:outputLabel for="ItemTariff_tariff" value="#{productBundle.product_tariff}" />
				</f:facet>
				<aon:outputText id="ItemTariff_tariff"
					value="#{to.tariff.name}"
					rendered="#{formList or formEdit}" />
				<f:facet name="footer">
					<aon:selectOneMenu id="ItemTariff_tariff-New"
						value="#{controller.to.tariff}" rendered="#{formNew}">
						<f:selectItems value="#{configCollections.tariffs}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemTariff_type" value="#{productBundle.product_tariff_type}" />
				</f:facet>
				<aon:outputText value="#{to.type}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="ItemTariff_type"
					value="#{controller.to.type}" rendered="#{formEdit}"
					valueChangeListener="#{controller.onTariffTypeChanged}"
					reRender="ItemTariff_profit_percent,ItemTariff_price,ItemTariff_sales_price">
					<f:selectItems value="#{productCollections.itemTariffTypes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="ItemTariff_type-New"
						value="#{controller.to.type}" rendered="#{formNew}"
						valueChangeListener="#{controller.onTariffTypeChanged}"
						reRender="ItemTariff_profit_percent-New,ItemTariff_price-New,ItemTariff_sales_price-New">
						<f:selectItems value="#{productCollections.itemTariffTypes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemTariff_profit_percent" value="#{bundle.aon_percentage}" />
				</f:facet>
				<aon:outputText value="#{to.profitPercent}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:inputText id="ItemTariff_profit_percent"
					value="#{controller.to.profitPercent}" rendered="#{formEdit}"
					disabled="#{controller.to.fixed}"
					valueChangeListener="#{controller.onProfitChanged}"
					reRender="ItemTariff_price,ItemTariff_sales_price"
					focus="ItemTariff_price"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="ItemTariff_profit_percent-New"
						value="#{controller.to.profitPercent}" rendered="#{formNew}"
						disabled="#{controller.to.fixed}"
						valueChangeListener="#{controller.onProfitChanged}"
						reRender="ItemTariff_price-New,ItemTariff_sales_price-New"
						focus="ItemTariff_price-New"
						required="true" size="5" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemTariff_price" value="#{productBundle.product_sales_base_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:inputText id="ItemTariff_price"
					value="#{controller.to.price}" rendered="#{formEdit}"
					valueChangeListener="#{controller.onPriceChanged}" 
					reRender="ItemTariff_profit_percent,ItemTariff_sales_price"
					focus="ItemTariff_sales_price"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="ItemTariff_price-New"
						value="#{controller.to.price}" rendered="#{formNew}"
						valueChangeListener="#{controller.onPriceChanged}" 
						reRender="ItemTariff_profit_percent-New,ItemTariff_sales_price-New"
						focus="ItemTariff_sales_price-New"
						required="true" size="5" />
				</f:facet>
			</aon:column>

			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
				<f:facet name="header">
					<aon:outputLabel for="ItemTariff_sales_price" value="#{bundle.aon_sales_price}" />
				</f:facet>
				<aon:outputText value="#{to.salesPrice}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_price_pattern}" />
				</aon:outputText>
				<aon:inputText id="ItemTariff_sales_price"
					value="#{controller.to.salesPrice}" rendered="#{formEdit}"
					valueChangeListener="#{controller.onSalesPriceChanged}" 
					reRender="ItemTariff_profit_percent,ItemTariff_price"
					required="true" size="5" />
				<f:facet name="footer">
					<aon:inputText id="ItemTariff_sales_price-New"
						value="#{controller.to.salesPrice}" rendered="#{formNew}"
						valueChangeListener="#{controller.onSalesPriceChanged}" 
						reRender="ItemTariff_profit_percent-New,ItemTariff_price-New"
						required="true" size="5" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>
</ui:composition>
