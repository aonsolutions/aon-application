<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">

	<c:if test="#{product.showDetail}">
		<aon:outputLabel for="Item_product_detail"
			value="#{product.labelDetail}" />
		<aon:inputText id="Item_product_detail" 
			value="#{itemTo.detail}" size="25" maxlength="15" />
	</c:if>

	<c:if test="#{product.showDetail2}">
		<aon:outputLabel for="Item_product_detail2"
			value="#{product.labelDetail2}" />
		<aon:inputText id="Item_product_detail2" 
			value="#{itemTo.detail2}" size="25" maxlength="15" />
	</c:if>

	<c:if test="#{product.showDetail3}">
		<aon:outputLabel for="Item_product_detail3"
			value="#{product.labelDetail3}" />
		<aon:inputText id="Item_product_detail3" 
			value="#{itemTo.detail3}" size="25" maxlength="15" />
	</c:if>

	<c:if test="#{aonConfiguration.bean.product.showBarcode}">
		<aon:outputLabel for="Item_barcode"
			value="#{productBundle.product_barcode}" />
		<aon:inputText id="Item_barcode" 
			value="#{itemTo.barcode}" size="25" maxlength="32" />
		</c:if>

	<aon:outputLabel for="Item_description" value="#{bundle.aon_description}" />
 	<aon:div style="margin-bottom: 0.5em;">
		<aon:inputTextarea id="Item_description"
			value="#{itemTo.description}" cols="64" rows="4" />
 	</aon:div>

</ui:composition>
