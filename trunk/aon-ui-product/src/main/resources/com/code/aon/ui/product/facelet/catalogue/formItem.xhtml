<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{catalogueItem}" />
		<ui:param name="columnClasses"
			value="aon-editDataTable-textColumn,
					aon-editDataTable-numberColumn aon-width-100,
					aon-editDataTable-numberColumn aon-width-80,
					aon-editDataTable-numberColumn aon-width-80" />
		<ui:define name="columns">

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="Item_id" value="#{productBundle.product_item}" />
				</f:facet>
				<aon:outputText value="#{to.item.product.name}"
					rendered="#{formList}" />
				<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
					<ui:param name="lookupTo" value="#{catalogueItem.to.item}" />
					<ui:param name="idRequired" value="#{true}" />
					<ui:param name="skipLabel" value="#{true}" />
					<ui:param name="lookupInputOnFocus" value="CatalogueItem_quantity" />
					<ui:param name="lookupRendered" value="#{formEdit}" />
					<ui:param name="lookupReRender" 
						value="CatalogueItem_price" />
					<aon:methodParam name="lookupChangeListener"
						value="#{catalogueItem.itemData}" type="lookupChangeListener" />
				</ui:include>						
				<f:facet name="footer">
					<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml" >
						<ui:param name="lookupTo" value="#{catalogueItem.to.item}" />
						<ui:param name="idRequired" value="#{true}" />
						<ui:param name="skipLabel" value="#{true}" />
						<ui:param name="lookupSuffix" value="-New" />
						<ui:param name="lookupInputOnFocus" value="CatalogueItem_quantity-New" />
						<ui:param name="lookupRendered" value="#{formNew}" />
						<ui:param name="lookupReRender" 
							value="CatalogueItem_price-New" />
						<aon:methodParam name="lookupChangeListener"
							value="#{catalogueItem.itemData}" type="lookupChangeListener" />
					</ui:include>						
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="CatalogueItem_quantity" value="#{bundle.aon_date_from} #{bundle.aon_quantity}" />
				</f:facet>
				<aon:outputText value="#{to.quantity}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
				</aon:outputText>
				<aon:inputText id="CatalogueItem_quantity" 
					value="#{catalogueItem.to.quantity}" 
					rendered="#{formEdit}" required="#{true}" size="7">
					<f:validateDoubleRange />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="CatalogueItem_quantity-New" 
						value="#{catalogueItem.to.quantity}"
						rendered="#{formNew}" required="#{true}" size="7">
						<f:validateDoubleRange />
					</aon:inputText>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="CatalogueItem_price" value="#{bundle.aon_price}" />
				</f:facet>
				<aon:outputText value="#{to.price}"
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:inputText id="CatalogueItem_price" 
					value="#{catalogueItem.to.price}"
					rendered="#{formEdit}" required="#{true}" size="7">
					<f:validateDoubleRange />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="CatalogueItem_price-New" 
						value="#{catalogueItem.to.price}"
						rendered="#{formNew}" required="#{true}" size="7">
						<f:validateDoubleRange />
					</aon:inputText>
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="CatalogueItem_discount" value="#{bundle.aon_discount}" />
				</f:facet>
				<aon:outputText value="#{to.discount}" 
					rendered="#{formList}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
				<aon:inputText id="CatalogueItem_discount"
					value="#{catalogueItem.to.discount}"
					rendered="#{formEdit}" required="#{true}" size="7">
					<f:validateDoubleRange />
				</aon:inputText>
				<f:facet name="footer">
					<aon:inputText id="CatalogueItem_discount-New"
						value="#{catalogueItem.to.discount}"
						rendered="#{formNew}" required="#{true}" size="7">
						<f:validateDoubleRange />
					</aon:inputText>
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>
</ui:composition>
