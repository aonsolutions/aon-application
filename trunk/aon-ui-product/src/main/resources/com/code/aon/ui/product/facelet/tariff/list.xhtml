<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="tariffList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{productBundle.product_tariff_module}" />
				<ui:param name="controller" value="#{tariff}" />
				
				<ui:define name="additionalToolbarContent">
					<aon:htmlCommandLink id="tariffList-excel-report" value="&#160;" 
						target="_new" action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-excel">
						<f:param name="reportKey" value="tariffList" />
						<f:param name="outputFormat" value="MS Excel" />
					</aon:htmlCommandLink>
					<aon:htmlCommandLink id="tariffList-report" value="#{bundle.aon_listing}"
						target="_new" action="#{report.onExecute}"
						accesskey="#{bundle.aon_key_print}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf">
						<f:param name="reportKey" value="tariffList" />
						<f:param name="outputFormat" value="PDF" />
					</aon:htmlCommandLink>
				</ui:define>
				
			</ui:decorate>

			<aon:div id="tariffData" styleClass="aon-scroll-area">
				<aon:dataTable id="tariffDataList" value="#{tariff.model}"
					rows="20" var="to" rendered="#{tariff.model.rowCount > 0}">

					<aon:rowSelector action="tariff_form" 
						actionListener="#{tariff.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.code}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{productBundle.product_tariff}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>
				</aon:dataTable>
				<aon:dataScroller2 for="tariffDataList"
					showNote="true" />
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
