<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="itemList">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{productBundle.product_module}" />
				<ui:param name="controller" value="#{item}" />
			</ui:include>

			<aon:div id="itemData" styleClass="aon-scroll-area">
				<aon:dataTable id="itemDataList" value="#{item.model}"
					rows="20" var="to" rendered="#{item.model.rowCount > 0}">

					<aon:rowSelector action="item_form" 
						actionListener="#{item.onSelect}" />

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.product.code}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_description}" />
						</f:facet>
						<aon:outputText value="#{to.product.name} #{to.detail}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{productBundle.product_category}" />
						</f:facet>
						<aon:outputText value="#{to.product.category.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{productBundle.product_brand}" />
						</f:facet>
						<aon:outputText value="#{to.product.brand.name}" />
					</aon:column>

					<aon:column>
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-numberColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_taxable_base}" />
						</f:facet>
						<aon:outputText value="#{to.price}">
							<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
						</aon:outputText>
					</aon:column>

				</aon:dataTable>
				<aon:dataScroller2 for="itemDataList" showNote="true" />
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
