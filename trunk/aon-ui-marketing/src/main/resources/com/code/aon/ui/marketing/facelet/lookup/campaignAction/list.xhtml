<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_id}" />
		</f:facet>
		<aon:outputText value="#{to.id}"/>
	</aon:column>
	
	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_description}" />
		</f:facet>
		<aon:outputText value="#{to.campaign.description}">
			<aon:abbreviateConverter maxWidth="40" />
		</aon:outputText>
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{marketingBundle.marketing_action_media_type}" />
		</f:facet>
		<aon:outputText value="#{to.mediaType}"/>
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{marketingBundle.marketing_survey}" />
		</f:facet>
		<aon:outputText value="#{to.survey.description}"/>
	</aon:column>

</ui:composition>
