<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{questionValue}" />
			<ui:param name="columnClasses" value="aon-editDataTable-numberColumn aon-width-60, aon-editDataTable-textColumn" />
			<ui:define name="columns">

				<aon:column>
					<f:facet name="header">
						<aon:outputLabel
							value="#{bundle.aon_id}" />
					</f:facet>
					<aon:outputText value="#{to.id}" />
					<f:facet name="footer">
						<aon:outputText value="&#160;" />
					</f:facet>
				</aon:column>
	
				<aon:column>
					<f:facet name="header">
						<aon:outputLabel for="QuestionValue_value"
							value="#{bundle.aon_value}" />
					</f:facet>
					<aon:div layout="none" rendered="#{formList}">
						<ui:include src="/com/code/aon/ui/marketing/facelet/util/outputValue.xhtml" >
							<ui:param name="valueHolder" value="#{to}" />
						</ui:include>
					</aon:div>
					<aon:div layout="none" rendered="#{formEdit}">
						<ui:include src="/com/code/aon/ui/marketing/facelet/util/inputValue.xhtml" >
							<ui:param name="inputId" value="QuestionValue_value" />
							<ui:param name="valueHolder" value="#{questionValue.to}" />
						</ui:include>
					</aon:div>				
					<f:facet name="footer">
						<aon:div layout="none" rendered="#{formNew}">
							<ui:include src="/com/code/aon/ui/marketing/facelet/util/inputValue.xhtml" >
								<ui:param name="inputId" value="QuestionValue_value-New" />
								<ui:param name="valueHolder" value="#{questionValue.to}" />
							</ui:include>
						</aon:div>
					</f:facet>
				</aon:column>

			</ui:define>
		</ui:decorate>

	</aon:div>
</ui:composition>
