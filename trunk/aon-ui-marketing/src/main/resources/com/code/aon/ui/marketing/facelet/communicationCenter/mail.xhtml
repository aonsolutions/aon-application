<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="mailForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{commercialBundle.commercial_communication_center_module}" />
				<ui:param name="toolbarDescription" value="#{marketingBundle.marketing_mailing}" />
				<ui:define name="toolbarContent">
					<aon:htmlCommandLink id="download" value="#{bundle.aon_fileupload_download}"
						target="_blank" immediate="true"
						actionListener="#{communicationCenter.onDownloadMailing}"
						styleClass="aon-finding-toolbar-item aon-icon-mail-save" />						
					<aon:commandButton id="skip" value="#{bundle.aon_back}"
						action="communicationCenter" actionListener="#{communicationCenter.onInit}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						title="#{bundle.aon_key_cancel_accelerator}"
						accesskey="#{bundle.aon_key_cancel}"/>
				</ui:define>
			</ui:decorate>	
			
			<aon:div styleClass="aon-scroll-area">
			
				<aon:dataTable id="mailingData" value="#{communicationCenter.mailingModel}"
					var="to" rows="20" rendered="#{communicationCenter.mailingModel.rowCount > 0}"
					columnClasses="aon-editDataTable-numberColumn aon-width-70, aon-editDataTable-textColumn aon-width-150,
						aon-editDataTable-textColumn, aon-editDataTable-iconColumn">
					
					<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_id}" />
						</f:facet>
						<aon:outputText value="#{to.id}"/>
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_name}" />
						</f:facet>
						<aon:outputText value="#{to.name}" />
					</aon:column>

					<aon:column styleClass="aon-editDataTable-textColumn aon-width-150">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_company_document}" />
						</f:facet>
						<aon:outputText value="#{to.document}" />
					</aon:column>
 
				</aon:dataTable>

				<aon:dataScroller2 for="mailingData" showNote="true" />
				
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
