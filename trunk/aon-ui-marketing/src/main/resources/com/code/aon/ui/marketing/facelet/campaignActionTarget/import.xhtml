<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="importTargetsForm">
		
			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_action_import}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_listing}" />
				<ui:define name="toolbarContent">	
					<aon:commandButton id="accept" value="#{bundle.aon_accept}"
						action="campaignAction_form"
						actionListener="#{campaignActionTarget.onImport}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						accesskey="#{bundle.aon_key_accept}" />				
					<aon:commandButton value="#{bundle.aon_back}"
						action="campaignAction_form"
						actionListener="#{campaignActionTarget.onCancelImport}"
						styleClass="aon-finding-toolbar-item aon-icon-cancel" immediate="true"
						accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="menuGrid" columns="2" styleClass="aon-margin-bottom">
					<aon:outputLabel for="Import_action_id" 
						value="#{marketingBundle.marketing_campaign_action}" />
					<aon:div>
						<ui:include src="/com/code/aon/ui/marketing/facelet/campaignAction/lookup.xhtml" >
							<ui:param name="lookupTo" value="#{campaignActionTarget.action}" />
							<ui:param name="skipLabel" value="#{true}" />
							<ui:param name="skipGoToButton" value="#{true}" />
							<ui:param name="skipNewButton" value="#{true}" />
							<ui:param name="lookupReRender" value="Import_action_detail,targetDataDiv" />
							<aon:methodParam name="lookupChangeListener"
								value="#{campaignActionTarget.onActionLookupChange}" type="lookupChangeListener" />
						</ui:include>					
						<aon:div id="Import_action_detail">
							<aon:panelGrid styleClass="aon-margin-top" columns="2"
								rendered="#{campaignActionTarget.actionSelected}">
								<aon:outputText value="#{bundle.aon_type}" />									
								<aon:outputText size="40"
									value="#{campaignActionTarget.action.mediaType}" />
							</aon:panelGrid>
						</aon:div>
					</aon:div>
				</aon:panelGrid>			
			
				<aon:div id="targetDataDiv">			

					<c:if test="#{campaignActionTarget.actionSelected and campaignActionTarget.model.rowCount > 0}">

						<aon:div styleClass="aon-toolbar">
							<aon:commandButton title="#{bundle.aon_check_all}"
								styleClass="aon-finding-toolbar-item aon-icon-checkAll"
								value="#{bundle.aon_check_all}"
								ajaxSingle="true" reRender="targetDataDiv,aonToolbar"
								actionListener="#{campaignActionTarget.checkAll}"/>	
							<aon:commandButton title="#{bundle.aon_uncheck_all}"
								styleClass="aon-finding-toolbar-item aon-icon-checkNone"
								value="#{bundle.aon_uncheck_all}"
								ajaxSingle="true" reRender="targetDataDiv,aonToolbar"
								actionListener="#{campaignActionTarget.checkNone}" />				
						</aon:div>					
						
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
							<ui:param name="controller" value="#{campaignActionTarget}" />
							<ui:param name="rowSelectorToggleOnClick" value="#{false}" />
							<ui:param name="skipSelectButton" value="#{true}" />
							<ui:define name="columns">
							
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-40">
									<f:facet name="header">
										<aon:outputText value="&#160;" />
									</f:facet>
									<aon:selectBooleanCheckbox id="Included_Row_checked"
										value="#{campaignActionTarget.rowChecked}"
										ajaxSingle="true" reRender="aonToolbar" />	
								</aon:column>
	
								<aon:column alias="ActionTarget.target.registry.name"
									styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputText value="#{target.bundle.commercial_target}" />
									</f:facet>
									<aon:outputText value="#{to.target.registry.fullName}" />
								</aon:column>

								<aon:column alias="ActionTarget.status"
									styleClass="aon-editDataTable-textColumn aon-width-100">
									<f:facet name="header">
										<aon:outputText value="#{bundle.aon_status}" />
									</f:facet>
									<aon:outputText value="#{to.status}"/>
								</aon:column>		
								
								<aon:column alias="ActionTarget.target.advertising"
									styleClass="aon-editDataTable-textColumn aon-width-100">
									<f:facet name="header">
										<aon:outputText value="#{commercialBundle.commercial_target_advertising}" />
									</f:facet>
									<aon:outputText value="#{to.target.advertising}"/>
								</aon:column>		
							</ui:define>
						</ui:decorate>
					</c:if>
				</aon:div>
	
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{campaignActionLookup}" />
	</ui:define>
</ui:composition>
