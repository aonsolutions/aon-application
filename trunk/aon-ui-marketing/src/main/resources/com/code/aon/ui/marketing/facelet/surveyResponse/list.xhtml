<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="surveyResponseList">
		
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_survey_response_module}" />
				<ui:param name="controller" value="#{surveyResponse}" />
				<ui:param name="skipResetButton" value="true" />
			</ui:include>

			<!--  aon-region-body -->
			<aon:div styleClass="aon-scroll-area">

				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{surveyResponse}" />
					<ui:define name="columns">
					
						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="SurveyResponse.survey.description" >
							<f:facet name="header">
								<aon:outputText value="#{marketingBundle.marketing_survey}" />
							</f:facet>
							<aon:outputText value="#{to.survey.description}">
								<aon:abbreviateConverter maxWidth="40" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="SurveyResponse.action.campaign.description" >
							<f:facet name="header">
								<aon:outputText value="#{marketingBundle.marketing_campaign_action}" />
							</f:facet>
							<aon:outputText value="#{to.action.campaign.description}">
								<aon:abbreviateConverter maxWidth="40" />
							</aon:outputText>
						</aon:column>
	
						<aon:column styleClass="aon-editDataTable-textColumn"
							alias="SurveyResponse.target.registry.name" >
							<f:facet name="header">
								<aon:outputText value="#{target.bundle.commercial_target}" />
							</f:facet>
							<aon:outputText value="#{to.target.registry.fullName}"/>
						</aon:column>
	
	 					<aon:column styleClass="aon-editDataTable-textColumn"
	 						alias="SurveyResponse.date" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_date}" />
							</f:facet>
							<aon:outputText value="#{to.date}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
								timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>					
						</aon:column>
	
	 					<aon:column styleClass="aon-editDataTable-textColumn"
	 						alias="SurveyResponse.user.name" >
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_login_user}" />
							</f:facet>
							<aon:outputText value="#{to.user.name}"/>
						</aon:column>
 					</ui:define>
 				</ui:decorate>

			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>

</body>
</html>
