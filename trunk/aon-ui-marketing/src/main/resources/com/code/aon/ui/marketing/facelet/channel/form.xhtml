<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="channelForm">
			
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{marketingBundle.marketing_channel_module}" />
				<ui:param name="controller" value="#{channel}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
			
				<aon:panelGrid columns="2">

					<aon:outputLabel for="Category_name"
						value="#{marketingBundle.marketing_news_title}" />
					<aon:inputText id="Category_name" required="true"
						value="#{channel.to.name}" size="32" maxlength="32" />

					<aon:outputLabel for="Category_description"
						value="#{bundle.aon_description}" />
					<aon:inputTextarea id="Category_description" required="true"
						value="#{channel.to.description}" cols="60" rows="4" >
						<f:validateLength  maximum="1024"/>
					</aon:inputTextarea>						

					<aon:outputLabel for="Category_url"
						value="#{marketingBundle.marketing_news_url}" />
					<aon:inputText id="Category_url" required="true"
						value="#{channel.to.url}" size="80" maxlength="256" />
						
					<ui:include src="/com/code/aon/ui/registry/facelet/corporateIdentity/lookupImage.xhtml" >
						<ui:param name="lookupTo" value="#{channel.to.registryAttachment}" />
						<ui:param name="lookupControllerListener" value="#{newsletter.imageFilter}" />
					</ui:include>													
						
				</aon:panelGrid>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{imageLookup}" />		
	</ui:define>
</ui:composition>

</body>
</html>
