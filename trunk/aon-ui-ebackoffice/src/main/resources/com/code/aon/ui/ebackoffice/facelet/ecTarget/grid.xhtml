<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="ectargetGrid">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{ebackofficeBundle.aon_ebackoffice_ectarget}" />
					<ui:param name="controller" value="#{ectarget}" />

				</ui:include>

				<!-- region-body -->
				<aon:div styleClass="aon-scroll-area">

					<aon:editDataTable id="ectargetData" var="to" rows="20"
						rendered="#{(ectarget.model.rowCount > 0) or (ectarget.new)}"
						value="#{ectarget.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-textColumn, aon-editDataTable-dateColumn,  aon-editDataTable-buttonsColumn">

						<aon:rowSelector toggleOnClick="#{ectarget.to == null}"
							actionListener="#{ectarget.onSelect}" />

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:commandButton id="balanceDetailTable-select"
								actionListener="#{ectarget.onSelect}"
								rendered="#{to!=ectarget.to}"
								styleClass="aon-editDataTable-button aon-icon-rowSelector" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{ectarget.onReset}" value=""
										rendered="#{!ectarget.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>

							</f:facet>
						</aon:column>



						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ectarget_client}" />
							</f:facet>
							<aon:outputText value="#{to.target.registry.name}"
								rendered="#{to!=ectarget.to}" />

							<aon:lookupInputText id="Target_id1" rendered="#{to==ectarget.to}"
								value="#{ectarget.to.target.registry.id}"
								lookup="#{targetLookup}" reRender="Target_full_name1"
								required="true" size="5" />
							<aon:lookupButton actionType="search"
								windowTitle="#{commercialBundle.commercial_target_selection}"
								property="#{ectarget.to.target}" rendered="#{to==ectarget.to}"
								selectReRender="Target_id1,Target_full_name1"
								lookup="#{targetLookup}" minHeight="460" minWidth="650">
							</aon:lookupButton>
							<aon:inputText id="Target_full_name1"
								rendered="#{to==ectarget.to}"
								value="#{ectarget.to.target.registry.name}"
								disabled="true" size="30" />
							<f:facet name="footer">
							<aon:div>
								<aon:lookupInputText id="Target_id" rendered="#{ectarget.new}"
									value="#{ectarget.to.target.registry.id}"
									lookup="#{targetLookup}" reRender="Target_full_name"
									required="true" size="5" />
								<aon:lookupButton actionType="search"
									windowTitle="#{commercialBundle.commercial_target_selection}"
									property="#{ectarget.to.target}" rendered="#{ectarget.new}"
									selectReRender="Target_id,Target_full_name"
									lookup="#{targetLookup}" minHeight="460" minWidth="650">
								</aon:lookupButton>
								 <aon:inputText id="Target_full_name" rendered="#{ectarget.new}"
									value="#{ectarget.to.target.registry.name}"
									 size="20" />
						</aon:div>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ectarget_login}" />
							</f:facet>
							<aon:outputText value="#{to.login}" rendered="#{to!=ectarget.to}" />
							<aon:inputText  required="true"
								rendered="#{to==ectarget.to}" size="20"
								value="#{ectarget.to.login}" maxlength="20" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{ectarget.new}" size="20"
									value="#{ectarget.to.login}" maxlength="20" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ectarget_password}" />
							</f:facet>
							<aon:outputText value="#{to.password}"
								rendered="#{to!=ectarget.to}" />
							<aon:inputText required="true"
								rendered="#{to==ectarget.to}" size="20"
								value="#{ectarget.to.password}" maxlength="20" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{ectarget.new}" size="20"
									value="#{ectarget.to.password}" maxlength="20" />
							</f:facet>
						</aon:column>




						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ectarget_type}" />
							</f:facet>
							<aon:outputText value="#{to.type}" rendered="#{to!=ectarget.to}" />

							<aon:selectOneMenu value="#{ectarget.to.type}"
								rendered="#{to==ectarget.to}">
								<f:selectItems value="#{ectarget.targetTypes}" />
							</aon:selectOneMenu>


							<f:facet name="footer">
								<aon:selectOneMenu value="#{ectarget.to.type}"
									rendered="#{ectarget.new}">
									<f:selectItems value="#{ectarget.targetTypes}" />
								</aon:selectOneMenu>

							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_ectarget_lastAccess}" />
							</f:facet>
							<aon:outputText value="#{to.lastAccess}"
								rendered="#{to!=ectarget.to}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate value="#{ectarget.to.lastAccess}"
								inputSize="10" rendered="#{to==ectarget.to}"
								renderAsPopup="true"
								popupDateFormat="#{bundle.aon_date_pattern}">
							</aon:selectInputDate>
							<f:facet name="footer">
								<aon:selectInputDate styleClass="aon-form-input-text" value="#{ectarget.to.lastAccess}"
									rendered="#{ectarget.new}" inputSize="10" renderAsPopup="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
							</f:facet>
						</aon:column>


						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=ectarget.to}">&#160;</f:verbatim>
								<aon:commandButton title="[#{bundle.aon_accept}]"
									rendered="#{to==ectarget.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{ectarget.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==ectarget.to}"
									actionListener="#{ectarget.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton id="remove-Porcentaje"
									title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==ectarget.to}"
									confirmTitle="#{bundle.aon_confirm_title}"
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{ectarget.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />
							</aon:div>
							<f:facet name="footer">
								<aon:div>

									<aon:commandButton title="[#{bundle.aon_accept}]"
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{ectarget.new}"
										actionListener="#{ectarget.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton id="cancel-Porcentaje"
										title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{ectarget.new}"
										confirmTitle="#{bundle.aon_confirm_title}"
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{ectarget.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>


					</aon:editDataTable>
					<aon:dataScroller2 for="ectargetData" />
				</aon:div>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
	</ui:define>
</ui:composition>
