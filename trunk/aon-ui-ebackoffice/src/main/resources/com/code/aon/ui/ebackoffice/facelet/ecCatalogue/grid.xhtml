<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="ectargetGrid">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue}" />
					<ui:param name="controller" value="#{eccatalogue}" />

				</ui:include>



				<!-- region-body -->
				<aon:div styleClass="aon-scroll-area">
					<rich:spacer height="10"></rich:spacer>
					<aon:outputLink value="#" id="legal-note3"
						styleClass="aon-finding-toolbar-item">
						<aon:outputText
							value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_icons}" />
						<rich:componentControl for="IconsProcess" attachTo="legal-note3"
							operation="show" event="onclick" />
					</aon:outputLink>
					<rich:spacer height="10"></rich:spacer>
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{eccatalogue}" />
						<ui:param name="showDataTable"
							value="#{(eccatalogue.model.rowCount > 0) or (eccatalogue.new)}" />
						<ui:param name="columnClasses"
							value="aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn," />
						<ui:define name="columns">

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Eccatalogue_catalogue_id"
										value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_catalogue}" />
								</f:facet>
								<aon:outputText value="#{to.catalogue.name}"
									rendered="#{formList}" />

								<aon:selectOneMenu id="Eccatalogue_catalogue_id"
									value="#{eccatalogue.to.catalogue}" rendered="#{formEdit}"
									required="true">
									<f:selectItem itemValue="#{null}" itemLabel=" " />
									<f:selectItems value="#{eccatalogue.catalogues}" />
								</aon:selectOneMenu>

								<f:facet name="footer">

									<aon:selectOneMenu id="Eccatalogue_catalogue_id-New"
										value="#{eccatalogue.to.catalogue}" rendered="#{formNew}"
										required="true">
										<f:selectItem itemValue="#{null}" itemLabel=" " />
										<f:selectItems value="#{eccatalogue.catalogues}" />
									</aon:selectOneMenu>

								</f:facet>
							</aon:column>
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Eccatalogue_type"
										value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_type}" />
								</f:facet>
								<aon:outputText value="#{to.type}" rendered="#{formList}" />

								<aon:selectOneMenu id="Eccatalogue_type"
									value="#{eccatalogue.to.type}" rendered="#{to==eccatalogue.to}">
									<f:selectItems value="#{eccatalogue.catalogueTypes}" />
								</aon:selectOneMenu>

								<f:facet name="footer">
									<aon:selectOneMenu id="Eccatalogue_type-New"
										value="#{eccatalogue.to.type}" rendered="#{formNew}">
										<f:selectItems value="#{eccatalogue.catalogueTypes}" />
									</aon:selectOneMenu>

								</f:facet>
							</aon:column>
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Eccatalogue_catalogueImg"
										value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_img}" />
								</f:facet>
								<aon:div id="image">

									<a4j:mediaOutput element="img" rendered="#{formList}"
										cacheable="false" value="#{to.id}" style="width:60px"
										createContent="#{eccatalogue.paintImage}" />

									<h:panelGrid columns="2">
										<a4j:mediaOutput element="img" rendered="#{formEdit}"
											cacheable="false" value="#{eccatalogue.image.key}"
											style="width:60px" createContent="#{eccatalogue.paintImagee}" />

										<aon:fileUpload id="Eccatalogue_catalogueImg"
											rendered="#{formEdit}"
											addControlLabel="Cambiar"
											stopControlLabel="#{bundle.aon_fileUpload_stop}"
											stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
											uploadControlLabel="#{bundle.aon_fileUpload_upload}"
											fileUploadListener="#{eccatalogue.uploadImage}"
											listHeight="0px" listWidth="0px" immediateUpload="true"
											autoclear="true">
											<a4j:support event="onuploadcomplete" reRender="image" />
										</aon:fileUpload>
									</h:panelGrid>
								</aon:div>

								<f:facet name="footer">
									<aon:div rendered="#{formNew}">
										<h:panelGrid columns="2">
											<a4j:mediaOutput element="img" rendered="#{formNew}"
												cacheable="false" value="#{eccatalogue.image.key}"
												style="width:60px"
												createContent="#{eccatalogue.paintImagee}" />

											<aon:fileUpload id="Eccatalogue_catalogueImg-New"
												addControlLabel="#{bundle.aon_fileUpload_add}"
												stopControlLabel="#{bundle.aon_fileUpload_stop}"
												stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
												uploadControlLabel="#{bundle.aon_fileUpload_upload}"
												fileUploadListener="#{eccatalogue.uploadImage}"
												listWidth="0px" listHeight="0px" immediateUpload="true"
												autoclear="true">

											</aon:fileUpload>
										</h:panelGrid>

									</aon:div>

								</f:facet>
							</aon:column>

							<aon:column >
								<f:facet name="header">
									<aon:outputLabel for="Eccatalogue_catalogueIcon"
										value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_ico}" />
								</f:facet>

								<aon:div id="icon">

									<aon:div  rendered="#{formList}" >
										<a4j:mediaOutput element="img" cacheable="false" 
											value="#{to.id}" style="background-color:#787878; align:center;"
											createContent="#{eccatalogue.paintIcon}" />
									</aon:div>

									<h:panelGrid columns="2">

										<a4j:mediaOutput element="img" cacheable="false" style="background-color:#787878; align:center;"
											rendered="#{formEdit}" value="#{eccatalogue.icon.key}"
											 createContent="#{eccatalogue.paintIconn}" />


										<aon:fileUpload id="Eccatalogue_catalogueIcon"
											rendered="#{formEdit}"
											addControlLabel="Cambiar"
											stopControlLabel="#{bundle.aon_fileUpload_stop}"
											stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
											uploadControlLabel="#{bundle.aon_fileUpload_upload}"
											fileUploadListener="#{eccatalogue.uploadIcon}"
											listHeight="0px" listWidth="0px" immediateUpload="true"
											autoclear="true">
											<a4j:support event="onuploadcomplete" reRender="icon" />
										</aon:fileUpload>

									</h:panelGrid>
								</aon:div>

								<f:facet name="footer">

									<a4j:mediaOutput element="img" rendered="#{formNew}"
										cacheable="false" value="#{to.id}" 
										createContent="#{eccatalogue.paintIcon}" />
									<aon:div rendered="#{formNew}">
										<h:panelGrid columns="2">
											<a4j:mediaOutput element="img" rendered="#{formNew}"
												cacheable="false" value="#{eccatalogue.icon.key}"
												style="width:60px" createContent="#{eccatalogue.paintIconn}" />
											<aon:fileUpload id="Eccatalogue_catalogueIcon-New"
												addControlLabel="#{bundle.aon_fileUpload_add}"
												stopControlLabel="#{bundle.aon_fileUpload_stop}"
												stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
												uploadControlLabel="#{bundle.aon_fileUpload_upload}"
												fileUploadListener="#{eccatalogue.uploadIcon}"
												listHeight="0px" listWidth="0px" immediateUpload="true"
												autoclear="true">

											</aon:fileUpload>
										</h:panelGrid>
									</aon:div>

								</f:facet>
							</aon:column>


						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>

		</aon:form>
		<rich:modalPanel id="IconsProcess" height="490" width="570"
			zindex="2000" style="top: 0px; left:0px;">
			<rich:effect event="onshow" type="Highlight" params="duration:0.8" />
			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="Iconos" />
				</aon:div>
			</f:facet>
			<aon:div styleClass="aon-popupWindow-content">
				<aon:div styleClass="aon-popupWindow-content-internal">


					<h:outputText
						value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_down}" />
					<rich:spacer height="10">
					</rich:spacer>
					<br />
					<br />

					<h:panelGrid columns="10" border="1" cellspacing="10px"
						style="background-color:#787878;">

						<h:graphicImage value="/css/icons/bocadillo.png" />
						<h:graphicImage value="/css/icons/clip.png" />
						<h:graphicImage value="/css/icons/info.png" />
						<h:graphicImage value="/css/icons/novedad.png" />
						<h:graphicImage value="/css/icons/oferta.png" />
						<h:graphicImage value="/css/icons/star.png" />
						<h:graphicImage value="/css/icons/tick.png" />
					</h:panelGrid>

					<rich:spacer height="20"></rich:spacer>
					<aon:div styleClass="aon-text-center">
						<aon:outputLink id="legalNote3-hidelink" value="#">
							<aon:outputText value="[#{bundle.aon_close}]"
								style="color:black;" />
						</aon:outputLink>
						<rich:componentControl for="IconsProcess"
							attachTo="legalNote3-hidelink" operation="hide" event="onclick" />
					</aon:div>
				</aon:div>
			</aon:div>
		</rich:modalPanel>

	</ui:define>
</ui:composition>
