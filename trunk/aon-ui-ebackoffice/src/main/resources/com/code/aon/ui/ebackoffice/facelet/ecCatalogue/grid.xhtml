<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="ectargetGrid">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue}" />
					<ui:param name="controller" value="#{eccatalogue}" />

				</ui:include>

				<!-- region-body -->
				<aon:div styleClass="aon-scroll-area">
				
					<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
						<ui:param name="controller" value="#{eccatalogue}" />
						<ui:param name="showDataTable" value="#{(eccatalogue.model.rowCount > 0) or (eccatalogue.new)}" />
						<ui:param name="columnClasses" value="aon-editDataTable-textColumn,
							aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn" />
						<ui:define name="columns">

							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Eccatalogue_catalogue_id"
										value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_catalogue}" />
								</f:facet>
								<aon:outputText value="#{to.catalogue.name}"
									rendered="#{formList}" />
	
								<aon:selectOneMenu id="Eccatalogue_catalogue_id"
									value="#{eccatalogue.to.catalogue}"
									rendered="#{formEdit}" required="true">
									<f:selectItem itemValue="#{null}" itemLabel=" " />
									<f:selectItems value="#{eccatalogue.catalogues}" />
								</aon:selectOneMenu>
	
								<f:facet name="footer">
	
									<aon:selectOneMenu id="Eccatalogue_catalogue_id-New"
										value="#{eccatalogue.to.catalogue}"
										rendered="#{formNew}" required="true">
										<f:selectItem itemValue="#{null}" itemLabel=" " />
										<f:selectItems value="#{eccatalogue.catalogues}" />
									</aon:selectOneMenu>
	
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Eccatalogue_catalogueImg"
										value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_img}" />
								</f:facet>
	
								<a4j:mediaOutput element="img" rendered="#{formList}"
									cacheable="false" value="#{to.id}" style="width:30px"
									createContent="#{eccatalogue.paintImage}" />
	
								<aon:div rendered="#{formEdit}">
									
										<rich:fileUpload id="Eccatalogue_catalogueImg"
											addControlLabel="#{bundle.aon_fileUpload_add}"
											stopControlLabel="#{bundle.aon_fileUpload_stop}"
											stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
											uploadControlLabel="#{bundle.aon_fileUpload_upload}"
											fileUploadListener="#{eccatalogue.uploadImage}"
											listHeight="0px" immediateUpload="true" autoclear="true">
	
										</rich:fileUpload>
									
								</aon:div>
	
								<f:facet name="footer">
									<aon:div rendered="#{formNew}">
										<a4j:region>
											<aon:fileUpload id="Eccatalogue_catalogueImg-New"
												addControlLabel="#{bundle.aon_fileUpload_add}"
												stopControlLabel="#{bundle.aon_fileUpload_stop}"
												stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
												uploadControlLabel="#{bundle.aon_fileUpload_upload}"
												fileUploadListener="#{eccatalogue.uploadImage}"
												listHeight="0px" immediateUpload="true" autoclear="true">
	
											</aon:fileUpload>
										</a4j:region>
									</aon:div>
	
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Eccatalogue_catalogueIcon"
										value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_ico}" />
								</f:facet>
	
								<a4j:mediaOutput element="img" rendered="#{formList}"
									cacheable="false" value="#{to.id}" style="width:30px"
									createContent="#{eccatalogue.paintIcon}" />
	
								<aon:div rendered="#{formEdit}">
									<a4j:region>
										<aon:fileUpload id="Eccatalogue_catalogueIcon"
											addControlLabel="#{bundle.aon_fileUpload_add}"
											stopControlLabel="#{bundle.aon_fileUpload_stop}"
											stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
											uploadControlLabel="#{bundle.aon_fileUpload_upload}"
											fileUploadListener="#{eccatalogue.uploadIcon}"
											listHeight="0px" immediateUpload="true" autoclear="true">
	
										</aon:fileUpload>
									</a4j:region>
								</aon:div>
	
								<f:facet name="footer">
									<aon:div rendered="#{formNew}">
										<a4j:region>
											<aon:fileUpload id="Eccatalogue_catalogueIcon-New"
												addControlLabel="#{bundle.aon_fileUpload_add}"
												stopControlLabel="#{bundle.aon_fileUpload_stop}"
												stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
												uploadControlLabel="#{bundle.aon_fileUpload_upload}"
												fileUploadListener="#{eccatalogue.uploadIcon}"
												listHeight="0px" immediateUpload="true" autoclear="true">
	
											</aon:fileUpload>
										</a4j:region>
									</aon:div>
	
								</f:facet>
							</aon:column>
	
							<aon:column>
								<f:facet name="header">
									<aon:outputLabel for="Eccatalogue_type"
										value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_type}" />
								</f:facet>
								<aon:outputText value="#{to.type}"
									rendered="#{formList}" />
	
								<aon:selectOneMenu id="Eccatalogue_type"
									value="#{eccatalogue.to.type}"
									rendered="#{to==eccatalogue.to}">
									<f:selectItems value="#{eccatalogue.catalogueTypes}" />
								</aon:selectOneMenu>
	
								<f:facet name="footer">
									<aon:selectOneMenu id="Eccatalogue_type-New"
										value="#{eccatalogue.to.type}"
										rendered="#{formNew}">
										<f:selectItems value="#{eccatalogue.catalogueTypes}" />
									</aon:selectOneMenu>
	
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>

		</aon:form>

	</ui:define>
</ui:composition>
