<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="ectargetGrid">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle"
						value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue}" />
					<ui:param name="controller" value="#{eccatalogue}" />

				</ui:include>

				<!-- region-body -->
				<aon:div styleClass="aon-scroll-area">

					<aon:editDataTable id="eccatalogueData" var="to" rows="20"
						rendered="#{(eccatalogue.model.rowCount > 0) or (eccatalogue.new)}"
						value="#{eccatalogue.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-editDataTable-textColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

						<aon:rowSelector toggleOnClick="#{eccatalogue.to == null}"
							actionListener="#{eccatalogue.onSelect}" />

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:commandButton id="balanceDetailTable-select"
								actionListener="#{eccatalogue.onSelect}"
								rendered="#{to!=eccatalogue.to}"
								styleClass="aon-editDataTable-button aon-icon-rowSelector" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{eccatalogue.onReset}" value=""
										rendered="#{!eccatalogue.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>

							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_catalogue}" />
							</f:facet>
							<aon:outputText value="#{to.catalogue.name}"
								rendered="#{to!=eccatalogue.to}" />

							<aon:div>
								<aon:lookupInputText id="Catalogue_id"
									rendered="#{to==eccatalogue.to}"
									value="#{eccatalogue.to.catalogue.id}"
									lookup="#{catalogueLookup}" reRender="Catalogue_full_name"
									required="true" size="5" />
								<aon:lookupButton windowTitle="Catalogos"
									property="#{eccatalogue.to.catalogue}"
									rendered="#{to==eccatalogue.to}"
									selectReRender="Catalogue_id,Catalogue_full_name"
									lookup="#{catalogueLookup}" minHeight="460" minWidth="650">
								</aon:lookupButton>
								<aon:inputText id="Catalogue_full_name"
									rendered="#{to==eccatalogue.to}"
									value="#{eccatalogue.to.catalogue.name}" size="20" />
							</aon:div>
							<f:facet name="footer">
							<!--	<aon:div>
								<aon:lookupInputText id="Catalogue_id1"
									rendered="#{to==eccatalogue.to}"
									value="#{eccatalogue.to.catalogue.id}"
									lookup="#{catalogueLookup}" reRender="Catalogue_full_name1"
									required="true" size="5" />
								<aon:lookupButton windowTitle="Catalogos"
									property="#{eccatalogue.to.catalogue}"
									rendered="#{to==eccatalogue.to}"
									selectReRender="Catalogue_id1,Catalogue_full_name1"
									lookup="#{catalogueLookup}" minHeight="460" minWidth="650">
								</aon:lookupButton>
								<aon:inputText id="Catalogue_full_name1"
									rendered="#{to==eccatalogue.to}"
									value="#{eccatalogue.to.catalogue.name}" size="20" />
							</aon:div>  -->
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_img}" />
							</f:facet>

							<aon:div id="attachFile">
								<h:commandLink id="download" target="_blank"
									onmouseover="disableRowSelector();"
									onmouseout="enableRowSelector();"
									rendered="#{to!=eccatalogue.to}"
									actionListener="#{eccatalogue.downloadAttachment}"
									styleClass="aon-icon aon-icon-mail-save"
									style="line-height:16px;margin-right:0;"
									title="#{bundle.aon_fileupload_download}">
									<f:param name="index" value="#{to.catalogueImg}" />
									<aon:outputText value="&#160;" />
								</h:commandLink>
								<a4j:region>
									<aon:fileUpload rendered="#{formEdit}"
										addControlLabel="#{bundle.aon_fileUpload_add}"
										stopControlLabel="#{bundle.aon_fileUpload_stop}"
										stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
										uploadControlLabel="#{bundle.aon_fileUpload_upload}"
										fileUploadListener="#{eccatalogue.fileUploaded}"
										listHeight="0px" immediateUpload="true" autoclear="true">
										<f:facet name="label">
											<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
										</f:facet>
										<a4j:support event="onuploadcomplete"
											reRender="attachFile,ItemAttach_description" />
									</aon:fileUpload>
								</a4j:region>
							</aon:div>
							<aon:div id="attachFilechange" rendered="#{to==eccatalogue.to}">
								<a4j:region>
									<aon:fileUpload addControlLabel="#{bundle.aon_fileUpload_add}"
										stopControlLabel="#{bundle.aon_fileUpload_stop}"
										stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
										uploadControlLabel="#{bundle.aon_fileUpload_upload}"
										fileUploadListener="#{eccatalogue.fileUploaded}"
										listHeight="0px" immediateUpload="true" autoclear="true">
										<f:facet name="label">
											<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
										</f:facet>
										<a4j:support event="onuploadcomplete"
											reRender="attachFileNew,ItemAttach_description-New" />
									</aon:fileUpload>
								</a4j:region>
							</aon:div>

							<f:facet name="footer">
								<aon:div id="attachFileNew" rendered="#{eccatalogue.new}">
									<a4j:region>
										<aon:fileUpload addControlLabel="#{bundle.aon_fileUpload_add}"
											stopControlLabel="#{bundle.aon_fileUpload_stop}"
											stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
											uploadControlLabel="#{bundle.aon_fileUpload_upload}"
											fileUploadListener="#{eccatalogue.fileUploaded}"
											listHeight="0px" immediateUpload="true" autoclear="true">
											<f:facet name="label">
												<h:outputText value="#{bundle.aon_fileUpload_upload_label}" />
											</f:facet>
											<a4j:support event="onuploadcomplete"
												reRender="attachFileNew,ItemAttach_description-New" />
										</aon:fileUpload>
									</a4j:region>
								</aon:div>

							</f:facet>
						</aon:column>



						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_type}" />
							</f:facet>
							<aon:outputText value="#{to.type}"
								rendered="#{to!=eccatalogue.to}" />

							<aon:selectOneMenu value="#{eccatalogue.to.type}"
								rendered="#{to==eccatalogue.to}">
								<f:selectItems value="#{eccatalogue.catalogueTypes}" />
							</aon:selectOneMenu>

							<f:facet name="footer">
								<aon:selectOneMenu value="#{eccatalogue.to.type}"
									rendered="#{eccatalogue.new}">
									<f:selectItems value="#{eccatalogue.catalogueTypes}" />
								</aon:selectOneMenu>

							</f:facet>
						</aon:column>



						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=eccatalogue.to}">&#160;</f:verbatim>
								<aon:commandButton title="[#{bundle.aon_accept}]"
									rendered="#{to==eccatalogue.to}" reRender="ectargetGrid"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{eccatalogue.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==eccatalogue.to}"
									actionListener="#{eccatalogue.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton id="remove-Porcentaje"
									title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==eccatalogue.to}"
									confirmTitle="#{bundle.aon_confirm_title}"
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{eccatalogue.onRemove}"
									immediate="true" accesskey="#{bundle.aon_key_remove_line}" />
							</aon:div>
							<f:facet name="footer">
								<aon:div>

									<aon:commandButton title="[#{bundle.aon_accept}]"
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{eccatalogue.new}"
										actionListener="#{eccatalogue.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton id="cancel-Porcentaje"
										title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{eccatalogue.new}"
										confirmTitle="#{bundle.aon_confirm_title}"
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{eccatalogue.onCancel}"
										immediate="true" accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>


					</aon:editDataTable>
					<aon:dataScroller2 for="eccatalogueData" />
				</aon:div>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{catalogueLookup}" />
	</ui:define>
</ui:composition>
