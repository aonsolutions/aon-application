<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="ectargetGrid">

			<aon:div ajaxRendered="true" layout="none">

				<ui:include
					src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="MNTO" />
					<ui:param name="controller" value="#{eccatalogue}" />

				</ui:include>

				<!-- region-body -->
				<aon:div styleClass="aon-scroll-area">

					<aon:editDataTable id="eccatalogueData" var="to" rows="20"
						rendered="#{(eccatalogue.model.rowCount > 0) or (eccatalogue.new)}"
						value="#{eccatalogue.model}"
						columnClasses="aon-editDataTable-iconColumn, aon-width-150, aon-editDataTable-textColumn, aon-editDataTable-buttonsColumn">

						<aon:rowSelector toggleOnClick="#{eccatalogue.to == null}"
							actionListener="#{eccatalogue.onSelect}" />

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:commandButton id="balanceDetailTable-select"
								actionListener="#{eccatalogue.onSelect}"
								rendered="#{to!=eccatalogue.to}"
								styleClass="aon-editDataTable-button aon-icon-rowSelector" />
							<f:facet name="footer">
								<aon:div>
									<aon:commandButton alt="[#{bundle.aon_reset}]"
										styleClass="aon-editDataTable-button aon-icon-reset"
										actionListener="#{eccatalogue.onReset}" value=""
										rendered="#{!eccatalogue.new}"
										accesskey="#{bundle.aon_key_new_line}" />
								</aon:div>

							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.id}" rendered="#{to!=eccatalogue.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==eccatalogue.to}" size="2" value="#{eccatalogue.to.id}"
								maxlength="2" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true" 
									rendered="#{eccatalogue.new}" size="2" value="#{eccatalogue.to.id}"
									maxlength="2" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.target.registry.name}"
								rendered="#{to!=eccatalogue.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==eccatalogue.to}" size="2"
								value="#{eccatalogue.to.target.registry.name}" maxlength="20" />
							<f:facet name="footer">
								<!--  <aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{eccatalogue.new}" size="20"
									value="#{eccatalogue.to.target.registry.name}" maxlength="2" />-->

								<aon:lookupInputText id="Offer_target_id"
									rendered="#{eccatalogue.new}"
									value="#{eccatalogue.to.target.registry.id}"
									lookup="#{targetLookup}" ajaxSingle="true"
									lookupProperty="registry" required="true" size="5" />
								<aon:lookupButton
									windowTitle="#{commercialBundle.commercial_target_selection}"
									actionType="search" property="#{eccatalogue.to.target.registry}"
									lookup="#{targetLookup}" minHeight="460" minWidth="650"
									rendered="#{eccatalogue.new}" lookupProperty="registry">
								</aon:lookupButton>
								<aon:inputText id="Offer_target_full_name"
									rendered="#{eccatalogue.new}"
									value="#{(eccatalogue.to.target.registry.name!=null)?(eccatalogue.to.target.registry.fullName):('')}"
									disabled="true" size="50" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.login}" rendered="#{to!=eccatalogue.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==eccatalogue.to}" size="20"
								value="#{eccatalogue.to.login}" maxlength="20" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{eccatalogue.new}" size="20"
									value="#{eccatalogue.to.login}" maxlength="20" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.password}"
								rendered="#{to!=eccatalogue.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==eccatalogue.to}" size="20"
								value="#{eccatalogue.to.password}" maxlength="20" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{eccatalogue.new}" size="20"
									value="#{eccatalogue.to.password}" maxlength="20" />
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.password}"
								rendered="#{to!=eccatalogue.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==eccatalogue.to}" size="20"
								value="#{eccatalogue.to.password}" maxlength="20" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{eccatalogue.new}" size="20"
									value="#{eccatalogue.to.password}" maxlength="20" />
							</f:facet>
						</aon:column>


					<!-- 	<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{appBundle.aon_payroll_cdg}" />
							</f:facet>
							<aon:outputText value="#{to.type}" rendered="#{to!=eccatalogue.to}" />
							<aon:inputText styleClass="aon-form-input-text " required="true"
								rendered="#{to==eccatalogue.to}" size="20"
								value="#{eccatalogue.to.type}" maxlength="20" />
							<f:facet name="footer">
								<aon:inputText styleClass="aon-form-input-text" required="true"
									rendered="#{eccatalogue.new}" size="20"
									value="#{eccatalogue.to.type}" maxlength="20" />
							</f:facet>
						</aon:column> -->

						<aon:column>
							<f:facet name="header">
								<aon:outputText
									value="#{appBundle.aon_payroll_cotizacion_fecini}" />
							</f:facet>
							<aon:outputText value="#{to.lastAccess}"
								rendered="#{to!=eccatalogue.to}">
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate value="#{eccatalogue.to.lastAccess}"
								inputSize="10" rendered="#{to==eccatalogue.to}"
								disabled="#{to==eccatalogue.to}" renderAsPopup="true"
								popupDateFormat="#{bundle.aon_date_pattern}">
							</aon:selectInputDate>
							<f:facet name="footer">
								<aon:selectInputDate value="#{eccatalogue.to.lastAccess}"
									rendered="#{eccatalogue.new}" inputSize="10" renderAsPopup="true"
									popupDateFormat="#{bundle.aon_date_pattern}">
								</aon:selectInputDate>
							</f:facet>
						</aon:column>


						<aon:column>
							<f:facet name="header">
								<aon:outputText value="&#160;" />
							</f:facet>
							<aon:div>
								<f:verbatim rendered="#{to!=eccatalogue.to}">&#160;</f:verbatim>
								<aon:commandButton title="[#{bundle.aon_accept}]"
									rendered="#{to==eccatalogue.to}"
									styleClass="aon-editDataTable-button aon-icon-accept"
									actionListener="#{eccatalogue.onAccept}"
									accesskey="#{bundle.aon_key_save_line}" />
								<aon:commandButton title="[#{bundle.aon_cancel}]"
									styleClass="aon-editDataTable-button aon-icon-cancel"
									rendered="#{to==eccatalogue.to}"
									actionListener="#{eccatalogue.onCancel}" immediate="true"
									accesskey="#{bundle.aon_key_cancel_line}" />
								<aon:confirmButton id="remove-Porcentaje"
									title="[#{bundle.aon_remove}]"
									styleClass="aon-editDataTable-button aon-icon-delete"
									rendered="#{to==eccatalogue.to}"
									confirmTitle="#{bundle.aon_confirm_title}"
									confirmMessage="#{bundle.aon_remove_confirm}"
									confirmActionListener="#{eccatalogue.onRemove}" immediate="true"
									accesskey="#{bundle.aon_key_remove_line}" />
							</aon:div>
							<f:facet name="footer">
								<aon:div>
									
									<aon:commandButton title="[#{bundle.aon_accept}]"
										styleClass="aon-editDataTable-button aon-icon-accept"
										rendered="#{eccatalogue.new}"
										actionListener="#{eccatalogue.onAccept}"
										accesskey="#{bundle.aon_key_save_line}" />
									<aon:confirmButton id="cancel-Porcentaje"
										title="[#{bundle.aon_cancel}]"
										styleClass="aon-editDataTable-button aon-icon-cancel"
										rendered="#{eccatalogue.new}"
										confirmTitle="#{bundle.aon_confirm_title}"
										confirmMessage="#{bundle.aon_cancel_confirm}"
										confirmActionListener="#{eccatalogue.onCancel}" immediate="true"
										accesskey="#{bundle.aon_key_cancel_line}" />
								</aon:div>
							</f:facet>
						</aon:column>


					</aon:editDataTable>
					<aon:dataScroller2 for="eccatalogueData" />
				</aon:div>
			</aon:div>

		</aon:form>
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
	</ui:define>
</ui:composition>
