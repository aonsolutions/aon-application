<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{eccatalogue}" />
		<!--	<ui:param name="skipResetButton" value="#{(eccatalogue.getRowCount)"/>  -->
		<ui:param name="showDataScroller" value="#{false}" />
		<ui:param name="columnClasses"
			value="aon-editDataTable-iconColumn,aon-editDataTable-textColumn,aon-editDataTable-textColumn" />
		<ui:define name="columns">

			<aon:column>
				<f:facet name="header">
					<aon:outputText
						value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_visible}" />
				</f:facet>
				<div align="center"><aon:outputText value="&#160;"
					style="text-align:center;"
					styleClass="#{(to.visible)?'aon-icon aon-icon-checked':'aon-icon aon-icon-check'}"
					rendered="#{to!=eccatalogue.to}" /></div>
				<aon:selectBooleanCheckbox rendered="#{to==eccatalogue.to}"
					value="#{eccatalogue.to.visible}" />
				<f:facet name="footer">
					<aon:selectBooleanCheckbox rendered="#{eccatalogue.new}"
						value="#{eccatalogue.to.visible}" />
				</f:facet>
			</aon:column>

			<aon:column>
				<f:facet name="header">
					<aon:outputLabel for="Eccatalogue_catalogueIcon"
						value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_ico}" />
				</f:facet>

				<aon:div id="icon">

					<aon:div rendered="#{formList}">

						<a4j:mediaOutput element="img" cacheable="false" value="#{to.id}"
							style="background-color:#787878; align:center;width:20px"
							createContent="#{eccatalogue.paintIcon}" />
					</aon:div>
					<aon:div>

						<a4j:mediaOutput element="img" cacheable="false"
							style="background-color:#787878;" rendered="#{formEdit}"
							value="#{eccatalogue.icon.key}"
							createContent="#{eccatalogue.paintIconn}" />

						<h:panelGrid columns="2" rendered="#{formEdit}">
							<aon:fileUpload id="Eccatalogue_catalogueIcon"
								style="float:right" addControlLabel="Cambiar"
								stopControlLabel="#{bundle.aon_fileUpload_stop}"
								stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
								uploadControlLabel="#{bundle.aon_fileUpload_upload}"
								fileUploadListener="#{eccatalogue.uploadIcon}" listHeight="0px"
								listWidth="150px" immediateUpload="true" autoclear="true">
								<a4j:support event="onuploadcomplete" reRender="icon" />
							</aon:fileUpload>

							<aon:commandButton value="borrar" style="width:60px"
								id="deleteIco" actionListener="#{eccatalogue.deleteIcon}"
								reRender="icon" />
						</h:panelGrid>
					</aon:div>

				</aon:div>

				<f:facet name="footer">

					<aon:div id="footIcon" rendered="#{formNew}">
						<h:panelGrid columns="3">
							<a4j:mediaOutput element="img" rendered="#{formNew}"
								style="width:40px" cacheable="false"
								value="#{eccatalogue.icon.key}"
								createContent="#{eccatalogue.paintIconn}" />
							<aon:fileUpload id="Eccatalogue_catalogueIcon-New"
								addControlLabel="#{bundle.aon_fileUpload_add}"
								stopControlLabel="#{bundle.aon_fileUpload_stop}"
								stopEntryControlLabel="#{bundle.aon_fileUpload_stop}"
								uploadControlLabel="#{bundle.aon_fileUpload_upload}"
								fileUploadListener="#{eccatalogue.uploadIcon}" listHeight="0px"
								listWidth="150px" immediateUpload="true" autoclear="true">
								<a4j:support event="onuploadcomplete" reRender="footIcon" />
							</aon:fileUpload>

							<aon:commandButton value="borrar" styleClass=" aon-icon-remove"
								id="deleteIcoNew" actionListener="#{eccatalogue.deleteIcon}"
								reRender="footIcon" />
						</h:panelGrid>
					</aon:div>

				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>

	<rich:modalPanel id="IconsProcess" height="490" width="570"
		zindex="2000" style="top: 0px; left:0px;">
		<rich:effect event="onshow" type="Highlight" params="duration:0.8" />
		<f:facet name="header">
			<aon:div styleClass="aon-popupWindow-title">
				<aon:outputText value="Iconos" />
			</aon:div>
		</f:facet>
		<aon:div styleClass="aon-popupWindow-content">
			<aon:div styleClass="aon-popupWindow-content-internal">


				<h:outputText
					value="#{ebackofficeBundle.aon_ebackoffice_eccatalogue_down}" />
				<rich:spacer height="10">
				</rich:spacer>
				<br />
				<br />

				<h:panelGrid columns="10" border="1" cellspacing="10px"
					style="background-color:#787878;">

					<h:graphicImage value="/css/icons/bocadillo.png" />
					<h:graphicImage value="/css/icons/clip.png" />
					<h:graphicImage value="/css/icons/info.png" />
					<h:graphicImage value="/css/icons/novedad.png" />
					<h:graphicImage value="/css/icons/oferta.png" />
					<h:graphicImage value="/css/icons/star.png" />
					<h:graphicImage value="/css/icons/tick.png" />
				</h:panelGrid>

				<rich:spacer height="20"></rich:spacer>
				<aon:div styleClass="aon-text-center">
					<aon:outputLink id="legalNote3-hidelink" value="#">
						<aon:outputText value="[#{bundle.aon_close}]" style="color:black;" />
					</aon:outputLink>
					<rich:componentControl for="IconsProcess"
						attachTo="legalNote3-hidelink" operation="hide" event="onclick" />
				</aon:div>
			</aon:div>
		</aon:div>
	</rich:modalPanel>


</ui:composition>
