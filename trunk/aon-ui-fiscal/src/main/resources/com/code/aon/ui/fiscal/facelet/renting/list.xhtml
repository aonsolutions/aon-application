<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="rentingList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{fiscalBundle.fiscal_renting_module}" />
				<ui:param name="controller" value="#{renting}" />
				<ui:param name="skipRemoveButton" value="#{true}" />
				<ui:param name="skipSaveButton" value="#{true}" />
				<ui:param name="skipResetButton" value="#{true}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{renting}" />

					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_year}" />
							</f:facet>
							<aon:outputText value="#{to.year}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_period}" />
							</f:facet>
							<aon:outputText value="#{to.period}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{fiscalBundle.fiscal_administration}" />
							</f:facet>
							<aon:outputText value="#{to.administration}" />
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-50">
							<f:facet name="header">
								<aon:outputText value="#{fiscalBundle.fiscal_replacement_abbr}" />
							</f:facet>
							<aon:div styleClass="#{to.replacement?'aon-icon-checked':'aon-icon-check'}">
								<aon:outputText value="&#160;" />
							</aon:div>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-numberColumn aon-width-80">
							<f:facet name="header">
								<aon:outputText value="#{fiscalBundle.fiscal_total_tax_debt}" />
							</f:facet>
							<aon:outputText value="#{to.totalTaxDebt}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</aon:outputText>
						</aon:column>

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_status}" />
							</f:facet>
							<aon:outputText value="#{to.status}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
