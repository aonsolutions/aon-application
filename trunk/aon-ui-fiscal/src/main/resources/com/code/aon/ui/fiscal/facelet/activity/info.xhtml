<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:panelGrid id="epigraphAddInfoTable" columns="2" dir="true" width="100%"
		columnClasses="aon-panelGrid-odd aon-width-100
					  ,aon-panelGrid-even aon-width-auto">
 	
	 	<c:forEach items="#{fiscalActivity.activityInfoList}" var="info">
	 		<aon:div>
	 			<aon:outputText value="#{info.infoKey.value}" style="font-size: 0.8em; margin-right: 1em;" />
		 		<aon:outputLabel for="infoKey_#{info.infoKey}" value="#{info.infoKey}" />
	 		</aon:div>
	 			
			<aon:div>
				<aon:selectOneMenu id="infoKey_#{info.infoKey}-SELECT" 
					value="#{info.value}"
					required="#{info.infoKey.required}" 
					rendered="#{info.infoKey.choice}">
					<f:selectItems value="#{fiscalActivity.keyChoices[info.infoKey]}" />
					
					<a4j:support event="onchange" ajaxSingle="true"
						actionListener="#{fiscalActivity.onChangeInfo}"
						reRender="infoKey_#{info.infoKey}-SELECT"/>
				</aon:selectOneMenu>
				
				<aon:inputText id="infoKey_#{info.infoKey}" 
					value="#{info.value}" size="10"
					required="#{info.infoKey.required}" 
					rendered="#{!info.infoKey.choice}">
					<a4j:support event="onchange" ajaxSingle="true"
						actionListener="#{fiscalActivity.onChangeInfo}"
						reRender="infoKey_#{info.infoKey}"/>
				</aon:inputText>			
	 		</aon:div>	
	 	</c:forEach>
	 	
	 </aon:panelGrid>
 		
</ui:composition>
