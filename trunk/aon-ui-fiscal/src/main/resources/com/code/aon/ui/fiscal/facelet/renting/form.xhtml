<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">
	<ui:define name="content">

		<aon:form id="rentingForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{fiscalBundle.fiscal_renting_module}" />
				<ui:param name="controller" value="#{renting}" />
				<ui:param name="skipRemoveButton" value="#{renting.to.finished}" />
				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="#{toolbarID}-finish"
						value="#{fiscalBundle.fiscal_finish}"
						actionListener="#{renting.onFinish}"
						rendered="#{!renting.new and !renting.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-lock"
						onclick="if (!confirm('#{fiscalBundle.fiscal_finish}?')) return false;"/>
					<aon:commandButton id="#{toolbarID}-reopen"
						value="#{fiscalBundle.fiscal_reopen}"
						actionListener="#{renting.onReopen}"
						rendered="#{!renting.new and renting.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-unlock"
						onclick="if (!confirm('#{fiscalBundle.fiscal_reopen}?')) return false;"/>

					<aon:commandButton id="#{toolbarID}-recalculate"
						value="#{fiscalBundle.fiscal_recalculate}"
						actionListener="#{renting.onRecalculate}"
						accesskey="W" title="ALT+W [+May]" 
						rendered="#{!renting.new and !renting.to.finished}"
						styleClass="aon-finding-toolbar-item aon-icon-refresh" />

					<aon:htmlCommandLink id="#{toolbarID}-report"
						value="#{bundle.aon_listing}" target="_blank"
						action="#{report.onExecute}"
						styleClass="aon-finding-toolbar-item aon-icon-pdf"
						accesskey="#{bundle.aon_key_print}">
						<f:param name="reportKey" value="rentingReport" />
					</aon:htmlCommandLink>
					
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="panel1" columns="9" dir="true" width="100%"
					columnClasses="aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-80
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-80
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-100
								  ,aon-panelGrid-odd aon-width-80
								  ,aon-panelGrid-even aon-width-auto
								  ,aon-panelGrid-even aon-width-100">

					<aon:outputLabel for="renting_year" value="#{bundle.aon_year}" />
					<aon:inputText id="renting_year" size="5" value="#{renting.to.year}"
						required="true" disabled="#{renting.to.finished}"/>

					<aon:outputLabel for="renting_period"
						value="#{fiscalBundle.fiscal_period}" />
					<aon:selectOneMenu id="renting_period" value="#{renting.to.period}"
						required="true" disabled="#{renting.to.finished}">
						<f:selectItems value="#{fiscalCollections.periods}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="renting_administration"
						value="#{fiscalBundle.fiscal_administration}" />
					<aon:selectOneMenu id="renting_administration" value="#{renting.to.administration}"
						required="true" disabled="#{renting.to.finished}">
						<f:selectItems value="#{configCollections.administrations}" />
					</aon:selectOneMenu>

					<aon:outputText value="#{bundle.aon_status}" />
					<aon:div
						styleClass="aon-nowrap;#{renting.to.finished?'aon-icon-lock':'aon-icon-unlock'}"
						style="padding-left: 16px;">
						<aon:div>
							<aon:outputText value="#{renting.to.status}" />
						</aon:div>
					</aon:div>


					<c:if test="#{aonRole.confidentiality}">
						<aon:div>
							<aon:selectBooleanCheckbox id="renting_securityLevel"
								value="#{renting.to.confidential}" rendered="#{!renting.to.finished}"/>
							<aon:outputLabel for="renting_securityLevel" styleClass="aon-italic"
								value="#{bundle.aon_confidential}" rendered="#{!renting.to.finished}"/>
							<aon:outputText styleClass="aon-icon aon-icon-confidential"
								value="&#160;" title="#{bundle.aon_confidential}"
								rendered="#{renting.to.finished and renting.to.confidential}" />
						</aon:div>
					</c:if>
				</aon:panelGrid>
				
				<aon:panelGrid id="panel2" columns="4" style="width: 100%;" styleClass="aon-margin-top"
					columnClasses="aon-panelGrid-odd aon-width-100
								,aon-panelGrid-even aon-width-500
								,aon-panelGrid-even aon-width-100
								,aon-panelGrid-even aon-width-auto">
					
					<aon:outputLabel for="renting_comments" value="#{bundle.aon_comment}" />
					<aon:inputTextarea id="renting_comments" cols="80" rows="2" value="#{renting.to.comments}"/>

					<aon:div>
						<aon:div>
							<aon:selectBooleanCheckbox id="renting_replacement"
								disabled="#{renting.to.finished}"
								value="#{renting.to.replacement}"/>
							<aon:outputLabel for="renting_replacement" styleClass="aon-italic"
								value="#{fiscalBundle.fiscal_replacement}" />
						</aon:div>
					</aon:div>
					
					<aon:div>
						<aon:commandButton id="gen-disk"
							value="#{financeBundle.finance_create_disk}"
							actionListener="#{renting.onCreateDisk}"
							rendered="#{!renting.new and renting.to.finished}"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							style="border-width: 0px 0px 0px 0px;" reRender="panel2"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:htmlCommandLink target="_blank"
							title="#{renting.diskOk?(financeBundle.finance_download_disk):(financeBundle.finance_download_error)}"
							value="#{renting.diskOk?(financeBundle.finance_download_disk):(financeBundle.finance_download_error)}"
							style="border-width: 0px 0px 0px 0px;"
							actionListener="#{renting.downloadDisk}"
							rendered="#{!renting.new and renting.fileOutput!=null}"
							styleClass="aon-finding-toolbar-item aon-icon-mail-save" />
					</aon:div>
										
					<aon:outputLabel for="Renting_registryBank_id" value="#{configBundle.config_bank_account}" />
					<aon:selectOneMenu id="Renting_registryBank_id" disabled="#{renting.to.finished}"
						value="#{renting.to.registryBank}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{companyCollections.allCompanyBanks}" />
					</aon:selectOneMenu>
					<aon:outputText value="&#160;" />
					<aon:outputText value="&#160;" />
				</aon:panelGrid>

				<ui:include src="/com/code/aon/ui/fiscal/facelet/renting/amount.xhtml" />
				
				<ui:include src="/com/code/aon/ui/fiscal/facelet/renting/detail.xhtml" />

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
