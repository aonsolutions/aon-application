<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:form id="fiscalModelForm">
		<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
			<ui:param name="toolbarTitle" value="#{moduleLabel}" />
			<ui:param name="controller" value="#{controller}" />
		</ui:decorate>
	
		<aon:div styleClass="aon-scroll-area">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
				<ui:param name="controller" value="#{controller}" />
	
				<ui:define name="columns">
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_year}" />
						</f:facet>
						<aon:outputText value="#{to.year}" />
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_period}" />
						</f:facet>
						<aon:outputText value="#{to.period}" />
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_administration}" />
						</f:facet>
						<aon:outputText value="#{to.administration}" />
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-textColumn aon-text-center aon-width-50">
						<f:facet name="header">
							<aon:outputText value="#{fiscalBundle.fiscal_replacement_abbr}" />
						</f:facet>
						<aon:div styleClass="#{to.replacement?'aon-icon-checked':'aon-icon-check'}">
							<aon:outputText value="&#160;" />
						</aon:div>
					</aon:column>
	
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-80">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_status}" />
						</f:facet>
						<aon:outputText value="#{to.status}" />
					</aon:column>
					
					<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_comment}" />
						</f:facet>
						<aon:outputText value="#{to.comments}">
							<aon:abbreviateConverter maxWidth="100" />
						</aon:outputText>
					</aon:column>
					
				</ui:define>
			</ui:decorate>
		</aon:div>
	
	</aon:form>

</ui:composition>
