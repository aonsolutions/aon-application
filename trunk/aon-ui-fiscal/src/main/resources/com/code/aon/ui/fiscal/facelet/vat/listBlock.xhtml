<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<aon:panelGrid columns="4" style="margin-top: 1em;"
		columnClasses="aon-panelGrid2-header-first,
					   aon-panelGrid2-header,
					   aon-panelGrid2-header,
					   aon-panelGrid2-header">

		<c:if test="#{showBlockHeader}">
			<aon:div styleClass="aon-panelGrid2-header-text">
				<aon:commandLink styleClass="aon-dataTable-link-noicon"
					actionListener="#{vatReport.onDetail}" 
					action="vat_report_detail">
					<aon:outputText value="------"/>
				</aon:commandLink>
			</aon:div>
			<aon:div styleClass="aon-panelGrid2-header-text">
				<aon:commandLink styleClass="aon-dataTable-link-noicon"
					actionListener="#{vatReport.onDetail}" 
					action="vat_report_detail">
					<aon:outputText value="#{vatReport.output}"/>
					<f:param name="vatType" value="#{vatReport.output}"/>
				</aon:commandLink>
			</aon:div>
			<aon:div styleClass="aon-panelGrid2-header-text">
				<aon:commandLink styleClass="aon-dataTable-link-noicon"
					actionListener="#{vatReport.onDetail}" 
					action="vat_report_detail">
					<aon:outputText value="#{vatReport.input}"/>
					<f:param name="vatType" value="#{vatReport.input}"/>
				</aon:commandLink>
			</aon:div>
			<aon:div styleClass="aon-panelGrid2-header-text">
				<aon:commandLink styleClass="aon-dataTable-link-noicon"
					actionListener="#{vatReport.onDetail}" 
					action="vat_report_detail">
					<aon:outputText value="#{vatReport.investment}"/>
					<f:param name="vatType" value="#{vatReport.investment}"/>
				</aon:commandLink>
			</aon:div>
		</c:if>
		
		<!-- IVA TIPO -->				
		<aon:div styleClass="aon-panelGrid2-header-text">
			<aon:commandLink styleClass="aon-dataTable-link-noicon"
				actionListener="#{vatReport.onDetail}" 
				action="vat_report_detail">
				<aon:outputText value="#{blockType}"/>
				<f:param name="vatReportType" value="#{blockType}"/>
			</aon:commandLink>
		</aon:div>
	
		<!-- IVA REPERCUTIDO -->				
		<aon:dataTable var="rep" rows="0" rowClasses="none,none" style="width: 100%"
			columnClasses="aon-panelGrid2-odd,aon-panelGrid2-even,aon-panelGrid2-odd"
			value="#{vatReport.summary[vatReport.output].map[blockType].model}">
			<aon:column>
				<aon:outputText value="#{rep.base}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
			<aon:column>
				<aon:commandLink styleClass="aon-dataTable-link-noicon"
					actionListener="#{vatReport.onDetail}"
					action="vat_report_detail">
					<aon:outputText value="#{rep.percent} %" />
					<f:param name="vatType" value="#{vatReport.output}" />
					<f:param name="vatReportType" value="#{blockType}" />
					<f:param name="vatPercent" value="#{rep.percent}" />
				</aon:commandLink>
			</aon:column>
			<aon:column>
				<aon:outputText value="#{rep.quota}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
		</aon:dataTable>

		<!-- IVA SOPORTADO -->				
		<aon:dataTable var="rep" rows="0" rowClasses="none,none" style="width: 100%"
			columnClasses="aon-panelGrid2-odd,aon-panelGrid2-even,aon-panelGrid2-odd"
			value="#{vatReport.summary[vatReport.input].map[blockType].model}">
			<aon:column>
				<aon:outputText value="#{rep.base}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
			<aon:column>
				<aon:commandLink styleClass="aon-dataTable-link-noicon"
					actionListener="#{vatReport.onDetail}"
					action="vat_report_detail">
					<aon:outputText value="#{rep.percent} %" />
					<f:param name="vatType" value="#{vatReport.input}" />
					<f:param name="vatReportType" value="#{blockType}" />
					<f:param name="vatPercent" value="#{rep.percent}" />
				</aon:commandLink>
			</aon:column>
			<aon:column>
				<aon:outputText value="#{rep.quota}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
		</aon:dataTable>

		<!-- IVA INVERSION  -->				
		<aon:dataTable var="rep" rows="0" rowClasses="none,none" style="width: 100%"
			columnClasses="aon-panelGrid2-odd,aon-panelGrid2-even,aon-panelGrid2-odd"
			value="#{vatReport.summary[vatReport.investment].map[blockType].model}">
			<aon:column>
				<aon:outputText value="#{rep.base}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
			<aon:column>
				<aon:commandLink styleClass="aon-dataTable-link-noicon"
					actionListener="#{vatReport.onDetail}"
					action="vat_report_detail">
					<aon:outputText value="#{rep.percent} %" />
					<f:param name="vatType" value="#{vatReport.investment}" />
					<f:param name="vatReportType" value="#{blockType}" />
					<f:param name="vatPercent" value="#{rep.percent}" />
				</aon:commandLink>
			</aon:column>
			<aon:column>
				<aon:outputText value="#{rep.quota}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
		</aon:dataTable>

		<c:if test="#{showBlockTotal}">
			<aon:div styleClass="aon-panelGrid2-total-title">
				<aon:outputText value="#{bundle.aon_total}:"/>
			</aon:div>
			<!-- IVA REPERCUTIDO - TOTAL  -->				
			<aon:panelGrid columns="3" style="width: 100%"
				columnClasses="aon-panelGrid2-odd aon-panelGrid2-total-text,aon-panelGrid2-even aon-panelGrid2-total-text,aon-panelGrid2-odd aon-panelGrid2-total-text">				
				<aon:outputText value="#{vatReport.summary[vatReport.output].map[blockType].base}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{vatReport.summary[vatReport.output].map[blockType].quota}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
			</aon:panelGrid>						
			<!-- IVA SOPORTADO - TOTAL  -->				
			<aon:panelGrid columns="3" style="width: 100%"
				columnClasses="aon-panelGrid2-odd aon-panelGrid2-total-text,aon-panelGrid2-even aon-panelGrid2-total-text,aon-panelGrid2-odd aon-panelGrid2-total-text">				
				<aon:outputText value="#{vatReport.summary[vatReport.input].map[blockType].base}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{vatReport.summary[vatReport.input].map[blockType].quota}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
			</aon:panelGrid>
			<!-- IVA INVERSION - TOTAL  -->				
			<aon:panelGrid columns="3" style="width: 100%"
				columnClasses="aon-panelGrid2-odd aon-panelGrid2-total-text,aon-panelGrid2-even aon-panelGrid2-total-text,aon-panelGrid2-odd aon-panelGrid2-total-text">				
				<aon:outputText value="#{vatReport.summary[vatReport.investment].map[blockType].base}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{vatReport.summary[vatReport.investment].map[blockType].quota}"><f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" /></aon:outputText>
			</aon:panelGrid>
		</c:if>
	</aon:panelGrid>
</ui:composition>
