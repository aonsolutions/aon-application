<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:form  id="systemDeductionForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_systemDeduction_module}" />
				<ui:param name="controller" value="#{systemDeduction}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				<ui:param name="skipSaveButton" value="true" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="2" style="width: 100%;"
						columnClasses="aon-panelGrid-odd aon-width-200
								,aon-panelGrid-even aon-width-auto">
					
					
					<aon:outputText value="#{bundle.aon_start_date}" />
					<aon:outputText value="#{systemDeduction.to.startDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					
					<aon:outputText value="#{bundle.aon_end_date}" />
					<aon:outputText value="#{systemDeduction.to.endDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>

					<aon:outputText value="#{bundle.aon_type}" />
					<aon:outputText value="#{systemDeduction.to.type}" />


					<aon:outputText value="#{bundle.aon_concept}" />
					<aon:div>
						<aon:panelGrid columns="2" style="width: 100%;background-color: #f6f5e3;" 
							columnClasses="
								aon-panelGrid-even aon-bold aon-width-200
								,aon-panelGrid-even aon-width-auto">
							<aon:outputText value="#{bundle.aon_id}"/>
							<aon:outputText value="#{systemDeduction.to.deductionConcept.code}" />

							<aon:outputText value="#{bundle.aon_type}" />
							<aon:outputText value="#{systemDeduction.to.deductionConcept.type}" />

							<aon:outputText value="#{bundle.aon_description}" />
							<aon:outputText value="#{systemDeduction.to.deductionConcept.description}" />

							<aon:outputText	value="#{payrollBundle.payroll_salary_expression}" />
							<aon:outputText value="#{systemDeduction.to.deductionConcept.expression}" />
							
						</aon:panelGrid>
						
					</aon:div>

					<aon:outputText value="#{bundle.aon_description}" />
					<aon:outputText value="#{systemDeduction.to.description}" />
						
					<aon:outputText value="&#160;"/>
					<aon:panelGroup>
						<aon:selectBooleanCheckbox id="systemDeduction_decorateDescription" value="#{systemDeduction.to.descriptionDecorable}" disabled="true"/>
						<aon:outputLabel for="systemDeduction_decorateDescription" value="#{payrollBundle.payroll_salary_show_expression}" />
					</aon:panelGroup>

					<aon:outputText value="#{payrollBundle.payroll_salary_deduction_month}" />
					<aon:outputText value="#{systemDeduction.to.month}" />

					<aon:outputText	value="#{payrollBundle.payroll_salary_expression}" />
					<aon:outputText	value="#{systemDeduction.to.expression}" />

				</aon:panelGrid>

			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
