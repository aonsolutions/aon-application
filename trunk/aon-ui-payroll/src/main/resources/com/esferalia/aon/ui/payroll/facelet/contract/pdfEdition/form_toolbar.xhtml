<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
		<ui:param name="toolbarTitle" value="#{contractPdf.documentType}" />
		<ui:param name="toolbarDescription" value="#{contractPdf.new?bundle.aon_reset:bundle.aon_editing}" />
		
		<ui:define name="toolbarContent">
		
			<aon:commandButton id="contract-save"
				value="#{contractPdf.new?bundle.aon_accept:bundle.aon_save}"
				actionListener="#{contractPdf.onDocumentSave}"
				styleClass="aon-finding-toolbar-item aon-icon-accept" />	
			<!--  
			<aon:commandButton id="contract-refresh"
				value="#{payrollBundle.payroll_reload}"
				rendered="#{!contractPdf.new}"
				action="contractPdfEdition_form"
				actionListener="#{contractPdf.onDocumentReload}"
				onclick="if (!confirm('#{payrollBundle.payroll_refresh_confirm}')) { return false;}"
				styleClass="aon-finding-toolbar-item aon-icon-sincronize" />	
			-->
			<aon:commandButton id="prev" immediate="true"
				value="#{contractPdf.new?bundle.aon_cancel:bundle.aon_back}"
				action="#{contractPdf.backAction}"
				styleClass="aon-finding-toolbar-item aon-icon-cancel" />

			<aon:div style="display:inline; width:100%;">
			<aon:outputText styleClass="aon-margin-left" value="#{payrollBundle.payroll_contract_page}:" />
			<aon:div styleClass="aon-spin-control" >
				<aon:div styleClass="aon-spin-control-element"> 
					<aon:commandButton id="contractDetail-prev"  
						ajaxSingle="true" requestDelay="100" eventsQueue="aon_spin"
						disabled="#{contractPdf.firstDocumentPage}"
						reRender="#{toolbarReRender}"
						styleClass="aon-dataScroller-button #{contractPdf.firstDocumentPage?'aon-dataScroller-button-previous-disabled':'aon-dataScroller-button-previous'}"
						actionListener="#{contractPdf.onPreviousDocumentPage}" />
				</aon:div>
				<aon:div styleClass="aon-spin-control-element aon-nowrap"> 
					<aon:outputFormat value="#{bundle.aon_spin_result}">
						<f:param value="#{contractPdf.documentPage}" />
						<f:param value="#{contractPdf.numberOfDocumentPages}" />
					</aon:outputFormat>	
				</aon:div>
				<aon:div styleClass="aon-spin-control-element"> 
					<aon:commandButton id="contractDetail-next" 
						ajaxSingle="true" requestDelay="100" eventsQueue="aon_spin"
						disabled="#{contractPdf.lastDocumentPage}"
						reRender="#{toolbarReRender}"
						styleClass="aon-dataScroller-button #{contractPdf.lastDocumentPage?'aon-dataScroller-button-next-disabled':'aon-dataScroller-button-next'}"
						actionListener="#{contractPdf.onNextDocumentPage}" />				
				</aon:div>
			</aon:div>

			<aon:outputText styleClass="aon-margin-left" value="#{payrollBundle.payroll_size}:" />
			<aon:div styleClass="aon-spin-control" 
				style="display:inline-block; border:#000 1px solid;">
				<rich:inputNumberSlider maxValue="4" step="1"
					styleClass="aon-margin-left" width="150" style="height:12px;"
					value="#{contractPdf.zoomFactor}"
					showArrows="true" 
					showToolTip="true"  
					showBoundaryValues="false"
		            showInput="false"  
					enableManualInput="false" 
		            barClass=""
		            decreaseClass="aon-icon-zoom-decrease"
		            increaseClass="aon-icon-zoom-increase" >
		            <a4j:support event="onchange" reRender="#{toolbarReRender}"
		            	actionListener="#{contractPdf.onChangeZoomFactor}" />
		       </rich:inputNumberSlider>
			</aon:div>
			</aon:div>
			
		</ui:define>
	</ui:decorate>

</ui:composition>
