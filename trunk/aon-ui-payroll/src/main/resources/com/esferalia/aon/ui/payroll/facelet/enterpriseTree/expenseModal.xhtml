<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showSalaryExpenseWindow">
		<c:if test="#{salaryExpense.showSalaryExpenseWindow}">
			<rich:modalPanel id="expenseModalPanel" 
				height="170" width="400" resizeable="false" 
				rendered="#{salaryExpense.showSalaryExpenseWindow}"
				showWhenRendered="true" >
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{payrollBundle.payroll_salary_expense}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showSalaryExpenseWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{salaryExpense.showSalaryExpenseWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="salaryExpenseFrom">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="back"
										title="#{bundle.aon_key_cancel_accelerator}"
										value="#{bundle.aon_back}" immediate="true"
										reRender="showSalaryExpenseWindow"
										styleClass="aon-finding-toolbar-item aon-icon-cancel"
										accesskey="#{bundle.aon_key_cancel}" >
										<rich:componentControl for="expenseModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{salaryExpense.showSalaryExpenseWindow}"
											value="#{false}" />
									</aon:commandButton>	
									<aon:htmlCommandLink id="expense-excel_list"
										styleClass="aon-finding-toolbar-item aon-icon-excel aon-finding-toolbar-item-no-border"
										value="&#160;" title="#{bundle.aon_listing}" target="_blank"
										action="#{report.onExecute}">
										<f:param name="reportKey" value="salaryExpenseReport" />
										<f:param name="outputFormat" value="MS Excel" />
										<rich:componentControl for="expenseModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{salaryExpense.showSalaryExpenseWindow}"
											value="#{false}" />
									</aon:htmlCommandLink>
									<aon:htmlCommandLink id="expense_list"
										styleClass="aon-finding-toolbar-item aon-icon-pdf" target="_blank"
										value="#{bundle.aon_listing}" title="#{bundle.aon_listing}"
										action="#{report.onExecute}">
										<f:param name="reportKey" value="salaryExpenseReport" />
										<f:param name="outputFormat" value="PDF" />
										<rich:componentControl for="expenseModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{salaryExpense.showSalaryExpenseWindow}"
											value="#{false}" />
									</aon:htmlCommandLink>	
									<aon:commandButton id="salaryLauncher"
										value="#{payrollBundle.payroll_launch_salaries}" 
										rendered="#{!salaryExpense.allSalaryCalculated}"
										actionListener="#{salaryExpense.launchRemainingSalaries}"
										styleClass="aon-finding-toolbar-item aon-icon-accept"
										reRender="salaryExpenseFrom"
										onclick="Richfaces.showModalPanel('waitProccess')" 
							     		oncomplete="Richfaces.hideModalPanel('waitProccess')" />
								</aon:div>
								
								<aon:div id="modalContent" styleClass="salaryExpenseModalContent" >
								
									<aon:div id="incomplete-salary-warning" rendered="#{!salaryExpense.allSalaryCalculated}"
										styleClass="aon-margin-top aon-margin-bottom aon-border aon-padding" >
										
										<aon:outputText styleClass="aon-icon-errorwarning"
											value="&#160;&#160;&#160;&#160;&#160;&#160;&#160;" />
										<aon:outputText styleClass="aon-bold"
											style="color:red;"
											value="#{payrollBundle.payroll_enterprise_salaryCost_incomplete}" />
										
										<br />
										
										<aon:outputFormat styleClass="aon-margin-top" 
											value="#{payrollBundle.payroll_enterprise_salaryCost}">
											<f:param value="#{salaryExpense.activeEmployeeCount - salaryExpense.salaryCount}" />
											<f:param value="#{salaryExpense.activeEmployeeCount}" />
										</aon:outputFormat>
										
									</aon:div>
									
									<aon:panelGrid columns="4" styleClass="aon-width-all" >
										
										<aon:outputLabel for="Calendar_month"
											value="#{calendarBundle.aon_calendar_month}" />
										<aon:selectOneMenu id="Calendar_month"
											value="#{salaryExpense.month}" >
											<f:selectItems value="#{commonCollections.months}" />
											<a4j:support event="onchange" reRender="salaryExpenseFrom" />
										</aon:selectOneMenu>
						
										<aon:outputLabel value="#{bundle.aon_year}" />
										<rich:inputNumberSpinner value="#{salaryExpense.year}" 
											inputSize="4" minValue="2000" maxValue="2100"
											enableManualInput="true" step="1"
											ignoreDupResponses="true"
											cycled="false"  style="width:5px;height:5px;" >
											<a4j:support event="onchange" reRender="salaryExpenseFrom" />
										</rich:inputNumberSpinner>
										
									</aon:panelGrid>
									
								</aon:div>
									
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
				
				<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
				
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
