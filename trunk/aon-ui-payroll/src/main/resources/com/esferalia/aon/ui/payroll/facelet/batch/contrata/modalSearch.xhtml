<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<ui:decorate template="/com/esferalia/aon/ui/payroll/facelet/batch/modalSearch.xhtml">

		<ui:define name="modalContent" >

			<aon:outputLabel for="Contrata_fileType" value="Tipo de comunicacion" />
			<aon:selectOneMenu id="Contrata_fileType" required="true" 
				value="#{contrataList.fileType}">
				<f:selectItems value="#{contrataBatch.batchFileTypes}"  />
			</aon:selectOneMenu>

			<ui:include src="/com/code/aon/ui/registry/facelet/person/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{controller.person}" />
				<ui:param name="skipNewButton" value="#{true}" />
				<ui:param name="skipGoToButton" value="#{true}" />
			</ui:include>
			
		</ui:define>

		<ui:define name="afterFormContent" >
			<aon:lookupButtonPopup lookup="#{personLookup}" />
		</ui:define>
		
	</ui:decorate>
	
</ui:composition>
