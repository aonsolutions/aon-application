<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
	
	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
		<ui:param name="controller" value="#{contractSalaryEmbargo}" />
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
				<f:facet name="header">
					<aon:outputText	value="#{bundle.aon_type}" />
				</f:facet>
				<aon:outputText value="#{to.salary.type}"/>
			</aon:column>
 				
 			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
				<f:facet name="header">
					<aon:outputText	value="#{bundle.aon_start_date}" />
				</f:facet>
 				<aon:outputText value="#{to.salary.startDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-dateColumn aon-width-100">
				<f:facet name="header">
					<aon:outputText	value="#{bundle.aon_end_date}" />
				</f:facet>
				<aon:outputText value="#{to.salary.endDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-numberColumn aon-width-70">
				<f:facet name="header">
					<aon:outputText	value="#{bundle.aon_amount}" />
				</f:facet>
				<aon:outputText value="#{to.amount}" >
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
				<f:facet name="header">
					<aon:outputText	value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText value="#{to.description}"/>
			</aon:column>
				
		</ui:define>
	</ui:decorate>
	
</ui:composition>
