<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<rich:subTable id="partesConfirmacionList" var="to" rows="0"
		rendered="#{to.id == parteITWizard.parteIT.id}"
		width="auto" value="#{parteITWizard.partesConfirmacionModel}"
		columnClasses="aon-editDataTable-textColumn aon-width-80, 
				aon-editDataTable-textColumn aon-width-80,
				aon-editDataTable-textColumn aon-width-auto, 
				aon-editDataTable-iconColumn, 
				aon-editDataTable-iconColumn">

		<rich:column colspan="4" style="padding-left: 15px;">
			<aon:outputText value="#{payrollBundle.payroll_renov}: " />
			<aon:outputText value="#{payrollBundle.payroll_numero}" />
			<aon:outputText value="#{to.numero}" style="margin-left: 5px;" >
				<f:convertNumber pattern="00"/>			
			</aon:outputText>
			<aon:outputText value="#{payrollBundle.payroll_de_fecha}" style="margin-left: 5px;" />
			<aon:outputText value="#{to.fecha}" style="margin-left: 5px;">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
					timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</rich:column>>

		<aon:column>
			<aon:outputText value="&#160;" style="padding-left: 15px;"
				styleClass="aon-icon-check" rendered="#{!to.procesado}" />
			<aon:outputText value="&#160;" style="padding-left: 15px;"
				styleClass="aon-icon-checked" rendered="#{to.procesado}" />
		</aon:column>
		

	</rich:subTable>
	
</ui:composition>
