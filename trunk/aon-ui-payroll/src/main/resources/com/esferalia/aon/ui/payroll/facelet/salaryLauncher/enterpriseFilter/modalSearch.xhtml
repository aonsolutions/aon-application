<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:panelGroup id="showEnterpriseSearchWindow">
		<c:if test="#{enterpriseList.showSearchWindow}">
			<rich:modalPanel id="enterpriseSearchModalPanel" minHeight="440"
				minWidth="750" rendered="#{enterpriseList.showSearchWindow}"
				showWhenRendered="true" zindex="100" style="overflow:auto;">
				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{payrollBundle.payroll_refine_search}" />
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button"
							styleClass="aon-popupWindow-close"
							reRender="showListSearchWindow" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener
								target="#{enterpriseList.showSearchWindow}"
								value="#{false}" />
						</aon:commandButton>
					</aon:form>
				</f:facet>
				<aon:form id="listSearchForm">
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div style="width:100%">
						<aon:div styleClass="aon-popupWindow-content-internal">
							<aon:div style="width:99%">
								<aon:div styleClass="aon-toolbar">
									<aon:commandButton id="listSearch-search"
										value="#{bundle.aon_search}"
										reRender="#{searchReRender}"
										actionListener="#{filter.onSearchAvailableEnterprises}"
										styleClass="aon-finding-toolbar-item aon-icon-search">
										<rich:componentControl for="enterpriseSearchModalPanel"
											event="onclick" operation="hide"/>																					
										<f:setPropertyActionListener
											target="#{enterpriseList.showSearchWindow}"
											value="#{false}" />
										<aon:actionHotKey key="return" />
									</aon:commandButton>
									<aon:commandButton id="listSearch-cancel"
										value="#{bundle.aon_cancel}"
										reRender="showEnterpriseSearchWindow"
										immediate="true"
										styleClass="aon-finding-toolbar-item aon-icon-cancel">
										<f:setPropertyActionListener
											target="#{enterpriseList.showSearchWindow}"
											value="#{false}" />
									</aon:commandButton>
								</aon:div>
									
								<ui:decorate
									template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
									<ui:param name="controller" value="#{enterprise}" />
									<ui:param name="skipSearchButton" value="#{true}" />
									<ui:define name="searchContent">
										<ui:include src="/com/code/aon/ui/company/facelet/enterprise/searchContent.xhtml" />
									</ui:define>
								</ui:decorate>
								
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
				</aon:form>
				
			</rich:modalPanel>
		</c:if>
	</aon:panelGroup>

</ui:composition>
