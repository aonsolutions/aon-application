<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panel id="datosITPanel">
		<f:facet name="header">
			<aon:outputText
				value="#{payrollBundle.payroll_datos_parteIT}" />
		</f:facet>
		<aon:panelGrid columns="2" style="width: 100%;">

			<aon:outputText value="&#160;" />
			<aon:div>
				<aon:outputText
					styleClass="aon-bold"
					style="font-size: 1.2em;" 
					value="#{parteITWizard.operacion}"/>
			</aon:div>

			<aon:outputLabel for="fecha" value="#{payrollBundle.payroll_fecha}" />
			<aon:div>
				<aon:selectInputDate id="fecha" rendered="#{!confirmView}"
					value="#{parteITWizard.fecha}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}">
					<a4j:support event="oninputchange" 
						actionListener="#{parteITWizard.onChangeFechaInicio}" 
						reRender="prorrateo"/>
					<a4j:support event="ondateselected" 
						actionListener="#{parteITWizard.onChangeFechaInicio}" 
						reRender="prorrateo"/>
				</aon:selectInputDate>
				
				<aon:outputText value="#{parteITWizard.fecha}" rendered="#{confirmView}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:div>

			<aon:outputLabel for="colegiado" value="#{payrollBundle.payroll_colegiado}" />
			<aon:div>
				<aon:inputText id="colegiado" rendered="#{!confirmView}" 
					value="#{parteITWizard.numeroColegiado}" />
				<aon:outputText rendered="#{confirmView}" 
					value="#{parteITWizard.numeroColegiado}"/>
			</aon:div>

			<aon:outputLabel for="cias" value="#{payrollBundle.payroll_cias}" />
			<aon:div>
				<aon:inputText id="cias" rendered="#{!confirmView}"
					value="#{parteITWizard.cias}" />
				<aon:outputText rendered="#{confirmView}" 
					value="#{parteITWizard.cias}"/>
			</aon:div>

			<aon:outputLabel for="tipoit" value="#{payrollBundle.payroll_tipo_it}" />
			<aon:div>
				<aon:selectOneMenu id="tipoit" rendered="#{!confirmView}"
					value="#{parteITWizard.parteIT.tipoContingencia}">
					<f:selectItems value="#{payrollCollections.tiposContingencia}" />
					<a4j:support event="onchange" 
						actionListener="#{parteITWizard.onChangeTipoContingencia}" 
						reRender="datosITPanel"/>
				</aon:selectOneMenu>
				<aon:outputText rendered="#{confirmView}"
					value="#{parteITWizard.parteIT.tipoContingencia}"/>
			</aon:div>

			<aon:outputLabel for="prorrateo" value="#{payrollBundle.payroll_periodicidad}" />
			<aon:div>
				<aon:selectOneRadio id="prorrateo" rendered="#{!confirmView}" 
					value="#{parteITWizard.parteIT.prorrateoCotizacion}">
					<f:selectItems value="#{payrollCollections.periodicidades}" />
				</aon:selectOneRadio>
				<aon:outputText rendered="#{confirmView}"
					value="#{parteITWizard.parteIT.prorrateoCotizacion}"/>
			</aon:div>

			<aon:outputLabel for="recaida" 
				rendered="#{parteITWizard.recaidaAnterior}"
				value="#{payrollBundle.payroll_recaida}" />
			<aon:div>
				<aon:selectBooleanCheckbox id="recaida"
					rendered="#{parteITWizard.recaidaAnterior and !confirmView}"
					value="#{parteITWizard.parteIT.recaida}" />
				<aon:outputText value="&#160;" style="padding-left: 15px;"
					styleClass="aon-icon-check" 
					rendered="#{parteITWizard.recaidaAnterior and confirmView and !parteITWizard.parteIT.recaida}" />
				<aon:outputText value="&#160;" style="padding-left: 15px;"
					styleClass="aon-icon-checked" 
					rendered="#{parteITWizard.recaidaAnterior and confirmView and parteITWizard.parteIT.recaida}" />
			</aon:div>

		</aon:panelGrid>
	</aon:panel>
</ui:composition>
