<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panel id="datosITPanel">
		<f:facet name="header">
			<aon:outputText
				value="#{payrollBundle.payroll_datos_parteIT}" />
		</f:facet>
		<aon:panelGrid columns="2" style="width: 100%;">

			<aon:outputText value="&#160;" />
			<aon:div>
				<aon:outputText
					styleClass="aon-bold"
					style="font-size: 1.2em;" 
					value="#{parteITWizard.operacion}"/>
			</aon:div>

			<aon:outputLabel for="fecha" value="#{payrollBundle.payroll_fecha}" />
			<aon:div>
				<aon:selectInputDate id="fecha" value="#{parteITWizard.fecha}"
					inputSize="10" renderAsPopup="true" enableManualInput="true"
					timeZone="#{timeZoneController.timeZone}"
					popupDateFormat="#{bundle.aon_date_pattern}" />
			</aon:div>

			<aon:outputLabel for="colegiado" value="#{payrollBundle.payroll_colegiado}" />
			<aon:inputText id="colegiado"  value="#{parteITWizard.numeroColegiado}" />

			<aon:outputLabel for="cias" value="#{payrollBundle.payroll_cias}" />
			<aon:inputText id="cias" value="#{parteITWizard.cias}" />

			<aon:outputLabel for="tipoit" value="#{payrollBundle.payroll_tipo_it}" />
			<aon:selectOneMenu id="tipoit" 
				value="#{parteITWizard.parteIT.tipoContingencia}">
				<f:selectItems value="#{payrollCollections.tiposContingencia}" />
			</aon:selectOneMenu>

			<aon:outputLabel for="prorrateo" value="#{payrollBundle.payroll_periodicidad}" />
			<aon:selectOneRadio id="prorrateo" 
				value="#{parteITWizard.parteIT.prorrateoCotizacion}">
				<f:selectItems value="#{payrollCollections.periodicidades}" />
			</aon:selectOneRadio>

			<aon:outputLabel for="recaida" 
				rendered="#{parteITWizard.parteIT.recaida}"
				value="#{payrollBundle.payroll_recaida}" />
			<aon:selectBooleanCheckbox id="recaida" 
				rendered="#{parteITWizard.parteIT.recaida}"
				value="#{parteITWizard.parteIT.recaida}" />
<!--
-->			
		</aon:panelGrid>
	</aon:panel>
</ui:composition>
