<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

<aon:div styleClass="aon-noborder aon-margin-top aon-margin-left aon-padding"  style="width:815px;">
<style type="text/css">
	.irpf_bottom_border { border-bottom: solid #CCCCCC 1px; }
	.irpf_bold_bottom_border { border-bottom: solid #CCCCCC 2px; }
	.aon-border-top{border-top:#ccc 1px solid; }
	.aon-border-left{border-left:#ccc 1px solid; }
	.aon-border-right{border-right:#ccc 1px solid; }
	.irpf_background {background-color:#f6f5e3;}
</style>
	<aon:panelGrid styleClass="aon-margin-top "
				columns="3" style="width: 100%;"
				columnClasses="aon-noborder aon-bold aon-text-center 
							  ,aon-border aon-bold aon-text-center aon-padding
							  ,aon-noborder aon-width-150 aon-text-center aon-padding">
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/irpfResult/administration.xhtml" >
			<ui:param name="administration" value="irpf.administration" />
		</ui:include>
		<aon:outputText value="CÁLCULO DE RETENCIONES  - IRPF #{irpf.effectiveYear}"/>
		<aon:div styleClass="aon-border" >
			<aon:outputText value="#{irpf.effectiveDate}">
				<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
			</aon:outputText>
		</aon:div> 
	</aon:panelGrid>
	
	<ui:include src="formResultData.xhtml" />

	<!--  DATOS PERSONALES DEL PERCEPTOR -->
	<ui:include src="formPersonalData.xhtml" />
	

	<!--  DATOS ECONOMICOS -->
	<ui:include src="formEconomicData.xhtml" />
	
	
	<!--  DESCENDIENTES COMPUTADOS y ASCENDIENTES COMPUTADOS -->
	<ui:include src="formDescendantsData.xhtml" />

	<!--  REGULARIZACIÓN -->
	<c:if test="#{irpf.reason != null}">
		<ui:include src="formRegularizationData.xhtml" />
	</c:if>

</aon:div>


</ui:composition>
