<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="paymentUpdateSearch">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_payment_update_module}" />
				<ui:param name="controller" value="#{paymentUpdate}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>
			
			<aon:div styleClass="aon-scroll-area">
		
				<aon:div styleClass="aon-panelGrid-search">
					<aon:div styleClass="aon-panelGrid-search-info">
						<aon:outputText value="#{bundle.aon_search_info}" styleClass="aon-panelGrid-search-info-internal"/>
					</aon:div>			
					
					<aon:panelGrid columns="2">
			
						<c:if test="#{aonConfiguration.bean.paymentUpdate.showEnterpriseInSearch}">				
							<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
								<ui:param name="lookupTo" value="#{paymentUpdate.enterprise}" />
								<ui:param name="skipNewButton" value="#{true}" />
								<ui:param name="idRequired" value="#{true}" />
								<ui:param name="lookupReRender" value="enterprise_workPlace" />
							</ui:include>
						</c:if>
						
						<aon:outputLabel for="enterprise_workPlace" styleClass="aon-margin-left aon-margin-right" 
							value="#{companyBundle.company_workplace}" />
						<aon:selectOneMenu id="enterprise_workPlace" disabled="#{paymentUpdate.enterprise.id==null}"
							value="#{paymentUpdate.workPlace}" >
							<f:selectItem itemLabel=" - " itemValue="#{null}"  />
							<f:selectItems value="#{paymentUpdate.workPlaces}"  />
						</aon:selectOneMenu>
						
						<aon:outputText value="#{bundle.aon_date}"/>
						<h:panelGrid columns="2">
							<aon:selectOneMenu id="PaymentUpdate_month" value="#{paymentUpdate.month}" required="true">
								<f:selectItems value="#{commonCollections.months}"  />
							</aon:selectOneMenu>
				   			<rich:inputNumberSpinner id="PaymentUpdate_year" value="#{paymentUpdate.year}" 
				   				inputSize="4" minValue="2009" maxValue="2020" required="true"/>
						</h:panelGrid>
						
						<aon:outputText value="" />
						<aon:div >
							<aon:commandButton
								title="#{bundle.aon_key_search_accelerator}"
								value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
								action="paymentUpdate_list" actionListener="#{paymentUpdate.onSearch}"
								requestDelay="100" accesskey="#{bundle.aon_key_search}" >
							</aon:commandButton> 
						</aon:div>	
					
					</aon:panelGrid>
					
				</aon:div>		
			</aon:div>
			
		</aon:form>
		<aon:lookupButtonPopup lookup="#{enterpriseLookup}" />
	</ui:define>
</ui:composition>
