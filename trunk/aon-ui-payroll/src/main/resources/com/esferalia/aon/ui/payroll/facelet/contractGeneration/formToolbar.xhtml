<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components" >

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{payrollBundle.payroll_contractGenerationWizard_module}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<ui:insert name="step_name" />
					</aon:div>

					<aon:div id="toolbar" styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="prev" immediate="true"
							value="#{payrollBundle.payroll_back}"
							action="#{contractGenerationWizard.previous}"
							actionListener="#{contractGenerationWizard.onPrevious}"
							styleClass="aon-finding-toolbar-item aon-icon-previous"
							rendered="#{contractGenerationWizard.previousAvailable}" />
						<aon:commandButton id="next"
							value="#{payrollBundle.payroll_forward}"
							action="#{contractGenerationWizard.next}"
							actionListener="#{contractGenerationWizard.onNext}"
							rendered="#{contractGenerationWizard.nextAvailable}"
							styleClass="aon-finding-toolbar-item aon-icon-next" />
<!--  
						<aon:commandButton id="save"
							value="#{bundle.aon_save}"
							action="#{contractGenerationWizard.next}"
							actionListener="#{contractGenerationWizard.onSave}"
							onclick="if (!confirm('#{bundle.aon_save}?')) { return false;}"
							rendered="#{contractGenerationWizard.last}"
							styleClass="aon-finding-toolbar-item aon-icon-accept" />
-->
						<aon:commandButton id="end"
							value="#{payrollBundle.payroll_finalice}"
							action="#{contractGenerationWizard.next}"
							actionListener="#{contractGenerationWizard.onNext}"
							onclick="if (!confirm('#{payrollBundle.payroll_finalice}?')) { return false;}"
							rendered="#{contractGenerationWizard.last}"
							styleClass="aon-finding-toolbar-item aon-icon-accept" />

						<aon:commandButton id="enterprise_search"
							action="#"
							rendered="#{contractGenerationWizard.enterpriseListEnabled}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							value="#{bundle.aon_search}" >
							<aon:actionListener method="#{contractGenerationWizard.onResetEnterpriseSearch}" />
							<aon:actionListener method="#{enterprise.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="enterprisePopupButton"
							reRender="showNewEnterpriseWindow"
							rendered="#{contractGenerationWizard.currentStep==0 and (!contractGenerationWizard.enterpriseListEnabled)}"
							actionListener="#{enterprise.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-new"
							value="#{bundle.aon_reset}" >
							<f:setPropertyActionListener target="#{contractGenerationWizard.showNewEnterpriseWindow}"
								value="#{true}" />								
						</aon:commandButton>
						<aon:commandButton id="person_search"
							action="#"
							rendered="#{contractGenerationWizard.personListEnabled}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							value="#{bundle.aon_search}" >
							<aon:actionListener method="#{contractGenerationWizard.onResetPersonSearch}" />
							<aon:actionListener method="#{person.onEditSearch}" />
						</aon:commandButton>
						<aon:commandButton id="personPopupButton"
							reRender="showNewPersonWindow"
							rendered="#{(contractGenerationWizard.currentStep==1) and (!contractGenerationWizard.personListEnabled)}"
							actionListener="#{person.onReset}"
							styleClass="aon-finding-toolbar-item aon-icon-new"
							value="#{bundle.aon_reset}" >
							<f:setPropertyActionListener target="#{contractGenerationWizard.showNewPersonWindow}"
								value="#{true}" />								
						</aon:commandButton>
<!--  
Botones report
-->

						<aon:htmlCommandLink id="contract-report"
							value="CONTRATO" target="_blank" action="#{report.onExecute}"
							rendered="#{!contractGenerationWizard.nextAvailable}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf"
							accesskey="#{bundle.aon_key_print}">
							<f:param name="reportKey" value="contractReport" />
						</aon:htmlCommandLink>
							
						<aon:htmlCommandLink id="basicCopy-report"
							value="COPIA BASICA" target="_blank" action="#{report.onExecute}"
							rendered="#{!contractGenerationWizard.nextAvailable}"
							styleClass="aon-finding-toolbar-item aon-icon-pdf"
							accesskey="#{bundle.aon_key_print}">
							<f:param name="reportKey" value="contractBasicCopyReport" />
						</aon:htmlCommandLink>
-->
					</aon:div>
					
				</aon:panelGrid>
			</aon:div>


</ui:composition>
