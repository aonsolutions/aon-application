<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="remesaITForm">

			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{payrollBundle.remesaIT_module}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<ui:insert name="step_name" />
					</aon:div>

					<aon:div id="toolbar" styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="prev" immediate="true"
							value="#{payrollBundle.payroll_back}"
							action="#{remesaITWizard.previous}"
							actionListener="#{remesaITWizard.onPrevious}"
							styleClass="aon-finding-toolbar-item aon-icon-previous"
							rendered="#{remesaITWizard.previousAvailable}" />
						<aon:commandButton id="next"
							value="#{payrollBundle.payroll_forward}"
							action="#{remesaITWizard.next}"
							actionListener="#{remesaITWizard.onNext}"
							rendered="#{remesaITWizard.nextAvailable}"
							styleClass="aon-finding-toolbar-item aon-icon-next" />

						<aon:commandButton id="end"
							value="#{payrollBundle.payroll_finalice}"
							action="#{remesaITWizard.next}"
							actionListener="#{remesaITWizard.onNext}"
							onclick="if (!confirm('#{payrollBundle.payroll_finalice}?')) { return false;}"
							rendered="#{!remesaITWizard.nextAvailable}"
							styleClass="aon-finding-toolbar-item aon-icon-accept" />

					</aon:div>
				</aon:panelGrid>
			</aon:div>
			<aon:div styleClass="aon-scroll-area">
				<aon:div style="width: 100%;margin-bottom: 10px;">
					<h:panelGrid columns="6" styleClass="aon-text-center" style="width: 800px;"
						columnClasses="aon-width-200,aon-width-200,aon-width-200,aon-width-200">
						<aon:div style="border: solid 1px black;width: 100%;color: #{remesaITWizard.currentStep==0?'black;':'#CCCCCC;'}">
							<aon:outputText value="#{payrollBundle.remesaIT_step0}" />
						</aon:div>
						<aon:div style="border: solid 1px black;width: 100%;color: #{remesaITWizard.currentStep==1?'black;':'#CCCCCC;'}">
							<aon:outputText value="#{payrollBundle.remesaIT_step1}" />
						</aon:div>
						<aon:div style="border: solid 1px black;width: 100%;color: #{remesaITWizard.currentStep==2?'black;':'#CCCCCC;'}">
							<aon:outputText value="#{payrollBundle.remesaIT_step2}" />
						</aon:div>
					</h:panelGrid>
				</aon:div>

				<ui:insert name="step_content" />
			</aon:div>
		</aon:form>
		<ui:insert name="after_form" />
	</ui:define>
</ui:composition>
