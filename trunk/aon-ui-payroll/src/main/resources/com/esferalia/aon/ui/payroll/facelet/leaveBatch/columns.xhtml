<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="&#160;" />
		</f:facet>
		<aon:outputText value="B" rendered="#{to.leave}"/>
		<aon:outputText value="A" rendered="#{to.discharge}"/>
		<aon:outputText value="C" rendered="#{to.confirm}"/>
	</aon:column>

	<aon:column style="font-size: 0.8em;" styleClass="aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_enterprise}" />
		</f:facet>
		<aon:outputText value="#{to.leaveDetail.contractLeave.contract.workPlace.enterprise.registry.fullName}">
			<aon:abbreviateConverter maxWidth="50" />
		</aon:outputText>
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_document}" />
		</f:facet>
		<aon:outputText value="#{to.leaveDetail.contractLeave.contract.person.registry.document}" />
	</aon:column>

	<aon:column style="font-size: 0.8em;" styleClass="aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_employee_name}" />
		</f:facet>
		<aon:outputText value="#{to.leaveDetail.contractLeave.contract.person.registry.fullName}" />
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_leaveBatch_leave_date}" />
		</f:facet>
		<aon:outputText value="#{to.leaveDetail.contractLeave.startDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_leaveBatch_discharge_date}" />
		</f:facet>
		<aon:outputText value="#{to.leaveDetail.contractLeave.endDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_leaveBatch_parent_increment}" />
		</f:facet>
		<aon:outputText rendered="#{to.leaveDetail.confirm}"
			value="#{to.leaveDetail.confirmOrder}" />
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_leaveBatch_confirm_date}" />
		</f:facet>
		<aon:outputText value="#{to.leaveDetail.date}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

	<aon:column  styleClass="aon-nowrap">
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_contractLeave_type}" />
		</f:facet>
		<aon:outputText value="#{to.leaveDetail.contractLeave.type}" />
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_contractLeave_relapse}" />
		</f:facet>
		<aon:outputText value="&#160;" style="padding-left: 15px;"
			styleClass="aon-icon-check" rendered="#{to.leaveDetail.contractLeave.parent.id==null}" />
		<aon:outputText value="&#160;" style="padding-left: 15px;"
			styleClass="aon-icon-checked" rendered="#{to.leaveDetail.contractLeave.parent.id!=null}" />
	</aon:column>

</ui:composition>
