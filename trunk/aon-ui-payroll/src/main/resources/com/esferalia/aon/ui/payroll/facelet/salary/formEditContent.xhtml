<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >

		
		
			
		<aon:div styleClass="aon-margin-top " >

		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salary/header.xhtml">
			<ui:param name="salary" value="#{controller.to}" />
		</ui:include>

			<h:panelGrid columns="3" style="width: 100%;">
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{bundle.aon_type}:&#160;"/>
					<aon:panelGroup>
						<aon:outputText value="#{controller.to.type}" styleClass="aon-bold"/>
						<aon:outputText value="&#160;("/>
						<aon:outputText value="#{controller.to.month}"/>
						<aon:outputText styleClass="aon-italic" value="&#160;/&#160;"/>
						<aon:outputText value="#{controller.to.issueYear}"/>
						<aon:outputText value=")"/>
					</aon:panelGroup>
				</aon:div>
				
				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_issue_date}:&#160;"/>
					<aon:outputText styleClass="aon-bold" value="#{controller.to.issueDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
				</aon:div>

				<aon:div>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_period}"/>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_period_from}"/>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-bold" value="#{controller.to.startDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-italic" value="#{payrollBundle.payroll_salary_period_to}"/>
					<aon:outputText styleClass="aon-italic" value="&#160;"/>
					<aon:outputText styleClass="aon-bold" value="#{controller.to.endDate}">
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}" timeZone="#{timeZoneController.timeZoneId}" />
					</aon:outputText>
					
					<aon:outputText styleClass="aon-margin-left aon-italic" value="#{payrollBundle.payroll_salary_days}:"/>
					<aon:outputText styleClass="aon-margin-left aon-margin-right aon-bold" value="#{controller.to.timeUnits}"/>
				</aon:div>
				
			</h:panelGrid>
		
		</aon:div>

</ui:composition>
