<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="leaveBatchSearch">

			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_leaveBatchWizard_module}" />
				<ui:param name="controller" value="#{leaveBatch}" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{leaveBatch}" />
				<ui:define name="searchContent">

					<aon:outputLabel value="#{bundle.aon_date}" />
					<aon:div>
						<aon:outputLabel for="LeaveBatch_issueDate-From" styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_from}:" />
						<aon:selectInputDate id="LeaveBatch_issueDate-From"
							valueChangeListener="#{leaveBatch.addGreaterThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>

						<aon:outputLabel for="LeaveBatch_issueDate-To" styleClass="aon-form-date-label aon-padding-right"
							value="#{bundle.aon_date_to}:" />
						<aon:selectInputDate id="LeaveBatch_issueDate-To"
							valueChangeListener="#{leaveBatch.addLessThanOrEqualExpression}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}"/>							
					</aon:div>
										
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
	
</ui:composition>
