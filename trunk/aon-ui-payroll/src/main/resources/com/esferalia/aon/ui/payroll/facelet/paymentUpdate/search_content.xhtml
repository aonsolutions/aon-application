<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
	
	<aon:outputText value="#{payrollBundle.payroll_data_distribution}" />
	<aon:selectOneRadio value="#{paymentUpdate.viewType}" >
		<f:selectItems value="#{paymentUpdate.viewTypes}"  />
		<a4j:support event="onclick" actionListener="#{paymentUpdate.onChangeView}" reRender="paymentUpdate_list" ajaxSingle="true" />
	</aon:selectOneRadio>
	
	<c:if test="#{paymentUpdate.employeeView}">
		<c:if test="#{aonConfiguration.bean.paymentUpdate.showEnterpriseInSearch}">				
			<ui:include src="/com/code/aon/ui/company/facelet/enterprise/lookup.xhtml" >
				<ui:param name="lookupTo" value="#{paymentUpdate.enterprise}" />
				<ui:param name="skipNewButton" value="#{true}" />
				<ui:param name="idRequired" value="#{true}" />
				<ui:param name="lookupReRender" value="paymentUpdateSearch" />
				<aon:methodParam name="lookupChangeListener" 
					value="#{paymentUpdate.refreshVariables}" type="lookupChangeListener" />
			</ui:include>
		</c:if>
		
		<aon:outputLabel for="enterprise_workPlace" styleClass="aon-margin-left aon-margin-right" 
			value="#{companyBundle.company_workplace}" />
		<aon:selectOneMenu id="enterprise_workPlace" disabled="#{paymentUpdate.enterprise.id==null}"
			valueChangeListener="#{paymentUpdate.onChangeWorkPlace}"
			value="#{paymentUpdate.workPlace}" >
			<f:selectItem itemLabel=" - " itemValue="#{null}"  />
			<f:selectItems value="#{paymentUpdate.workPlaces}"  />
			<a4j:support event="onchange" reRender="paymentUpdateSearch" />
		</aon:selectOneMenu>
			
		<aon:outputText value="#{payrollBundle.payroll_contract_variable}" />
		<aon:selectOneMenu value="#{paymentUpdate.selectedVariable}" >
			<f:selectItem itemLabel=" - " itemValue="#{null}"  />
			<f:selectItems value="#{paymentUpdate.availableVariables}"  />
		</aon:selectOneMenu>
	</c:if>				
	
	<c:if test="#{paymentUpdate.variableView}">
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/contract/lookup.xhtml" >
			<ui:param name="lookupTo" value="#{paymentUpdate.contract}" />
			<ui:param name="skipNewButton" value="#{true}" />
			<ui:param name="idRequired" value="#{true}" />
			<ui:param name="lookupReRender" value="paymentUpdate_list" />
		</ui:include>
		
	</c:if>
	
	<aon:outputText value="#{bundle.aon_date}"/>
	<h:panelGrid columns="2">
		<aon:selectOneMenu id="PaymentUpdate_month" value="#{paymentUpdate.month}" required="true">
			<f:selectItems value="#{commonCollections.months}"  />
			<a4j:support event="onchange" reRender="paymentUpdateSearch" />
		</aon:selectOneMenu>
		<rich:inputNumberSpinner id="PaymentUpdate_year" value="#{paymentUpdate.year}" 
			inputSize="4" minValue="2009" maxValue="2020" required="true">
			<a4j:support event="onchange" reRender="paymentUpdateSearch" />
		</rich:inputNumberSpinner>
	</h:panelGrid>
	
	<aon:outputText value="" />
	<aon:div >
		<aon:commandButton
			title="#{bundle.aon_key_search_accelerator}"
			value="#{bundle.aon_search}" styleClass="aon-search-lookup-button"
			action="paymentUpdate_list" actionListener="#{paymentUpdate.onSearch}"
			requestDelay="100" accesskey="#{bundle.aon_key_search}" >
			<aon:actionHotKey key="return" />
		</aon:commandButton> 
	</aon:div>	
	
</ui:composition>
