<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/certifica2File/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.certifica2File_step2}" />
	</ui:define>

	<ui:define name="step_content">
	
		<aon:dataTable id="remesasData" value="#{certifica2FileWizard.selectedModel}"
			var="to" rows="20" 
			columnClasses="
			aon-editDataTable-textColumn, 
			aon-editDataTable-textColumn, 
			aon-editDataTable-dateColumn">
			
			<aon:rowSelector 
				actionListener="#{certifica2FileWizard.onSelect}" />

			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.payroll_enterprise}" />
				</f:facet>
				<aon:outputText value="#{to.certificate.enterprise.registry.name}" />
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{bundle.aon_date}" />
				</f:facet>
				<aon:outputText value="#{to.certificate.date}" >
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>
			</aon:column>
			
			<aon:column>
				<f:facet name="header">
					<aon:outputText value="#{payrollBundle.certifica2File_batch_status}" />
				</f:facet>
				<aon:outputText value="#{to.certificate.status}"  />
			</aon:column>
			
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/certifica2File/listaEmpleadosRemesa.xhtml" />
			
		</aon:dataTable>		
	
	</ui:define>
	<ui:define name="after_form">
		<ui:include
			src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>

</ui:composition>
