<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<aon:div styleClass="aon-margin-top aon-border" 
		style="margin-left: 5px;background-color:#f6f5e3;">
		
		<aon:panelGrid columns="1" style="width: 100%;margin-right:10px;"
			columnClasses="aon-noborder aon-padding-left aon-width-auto">
			
			<aon:outputText value="&#160;III. #{payrollBundle.payroll_salary_bonus}&#160;" 
				styleClass="aon-bold" style="position: relative; top: -8px; margin-left: 5px; background-color: white;"/>

		</aon:panelGrid>

		<aon:panelGrid columns="3" style="width: 100%;margin-right:10px;"
			columnClasses="aon-noborder aon-padding-left aon-width-auto
						  ,aon-noborder aon-padding-right aon-width-150 aon-text-right
						  ,aon-noborder aon-padding-right aon-width-100 aon-text-right aon-bold">

			<c:set var="total" value="#{0.00}" />
			<c:forEach items="#{sortedSalaryBonuses.items['SOCIAL_SECURITY'].list}" var="bonus">
				<aon:div style="margin-left: 30px; border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="#{bonus.description}"/>
				</aon:div>
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
				</aon:div>
				<aon:div style="border-bottom: solid #CCCCCC 1px;">
					<aon:outputText value="&#160;"/>
					<aon:outputText value="#{bonus.amount}">
						<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
					</aon:outputText>
				</aon:div>
				<c:set var="total" value="#{total + bonus.amount}" />
			</c:forEach>
			
			<aon:outputText value="&#160;"/>
			<aon:div style="width: 100%;text-align: right; ">
				<aon:outputText value="D. #{payrollBundle.payroll_salary_totalBonus}" styleClass="aon-bold"/>
			</aon:div>
			<aon:div style="">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{total}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
		</aon:panelGrid>		
		
	</aon:div>
</ui:composition>
