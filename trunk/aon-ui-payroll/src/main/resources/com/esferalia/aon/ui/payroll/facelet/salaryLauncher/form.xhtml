<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"	
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	
		
		<ui:decorate
			template="/com/esferalia/aon/ui/payroll/facelet/salaryLauncher/template.xhtml">
			<ui:param name="salaryLauncher" value="#{salaryLauncher}" />
			<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_salary_launcher_module}" />
			
			<ui:define name="messageRow" >
				<aon:outputText styleClass="lst lst_#{message.level}" value="#{message.level} : " />
				<aon:outputText value="#{message.enterpriseName} " 
					rendered="#{message.contractId!=null}" />
								
				<!--aon:commandLink  
					rendered="#{message.contractId!=null}"
					style="display: inline; text-decoration:underline;"
					action="contract_form" >
					<aon:outputText value="#{message.employeeName} " />
					<f:setPropertyActionListener value="#{message.contractId}" 
					target="#{salaryTestLauncher.contractId}" />
					<aon:actionListener method="#{salaryLauncher.onContract}" />
				</aon:commandLink-->	
				<aon:outputText styleClass="lst lst_#{message.level}" value="#{message.msg}" />
			</ui:define>	
			
			<ui:define name="addOnsCriteria">
						<aon:outputLabel value="#{payrollBundle.payroll_contract_period}"/>
						<aon:div id="salaryPeriod">
							<aon:outputLabel for="startDate" styleClass="aon-italic aon-margin-right"
								value="#{bundle.aon_start_date}:" />
							<aon:selectInputDate id="startDate"
								disabled="#{salaryLauncher.params.startDateDisabled}" 
								value="#{salaryLauncher.params.startDate}" required="true"
								inputSize="10" renderAsPopup="true" enableManualInput="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}">
							</aon:selectInputDate>
							<aon:outputLabel for="endDate" styleClass="aon-italic aon-margin-right"
								value="#{bundle.aon_end_date}:" />
							<aon:selectInputDate id="endDate" 
								disabled="#{salaryLauncher.params.endDateDisabled}" 
								value="#{salaryLauncher.params.endDate}" required="true"
								inputSize="10" renderAsPopup="true" enableManualInput="true"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}">
							</aon:selectInputDate>
						</aon:div>
						<aon:outputText value="&#160;" />
						<aon:outputText value="&#160;" />
			</ui:define>		

			<ui:define name="launchButton" >
				<aon:commandButton id="launchSalaries"
					value="#{payrollBundle.payroll_launch}" 
					styleClass="aon-search-lookup-button"
					disabled="#{salaryLauncher.pollEnabled}"
					reRender="showLauncherConfirmWindow"
					actionListener="#{salaryLauncher.onShowLauncherConfirm}">
						<f:setPropertyActionListener target="#{salaryLauncher.showLauncherConfirmWindow}"
								value="#{true}" />								
				</aon:commandButton>
			</ui:define>			

			<ui:define name="addOnsFirstRow" >
				<aon:selectBooleanCheckbox value="#{salaryLauncher.saveLog}" />
				<aon:outputText value="#{payrollBundle.payroll_launch_saveLog}" />
			</ui:define>			
			<ui:define name="addOnsSecondRow" >
				<aon:selectBooleanCheckbox value="#{salaryLauncher.debugEnabled}" />
				<aon:outputText value="#{payrollBundle.payroll_launch_debugEnabled}" />
			</ui:define>			
		
		</ui:decorate>
		
		<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryLauncher/confirmModal.xhtml" />
	

</ui:composition>
