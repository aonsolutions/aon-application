<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:column styleClass="aon-editDataTable-textColumn aon-width-160">
		<f:facet name="header">
			<aon:outputLabel for="#{controller.beanName}_name"
				value="#{bundle.aon_name}" />
		</f:facet>
		<aon:outputText value="#{to.name}" rendered="#{formList}" />
		<aon:div rendered="#{formEdit}" > 
			<aon:inputText id="#{controller.beanName}_name" required="true"
				size="16" 
				value="#{controller.handler.data.name}"  
				disabled="#{controller.handler.data.id==null}" >
				<a4j:support event="onchange" reRender="#{controller.beanName}VarContainer" ajaxSingle="true" />
			</aon:inputText>
			<aon:commandButton id="variableHelpName-select"
				title="#{payrollBundle.payroll_variable_helper}" ajaxSingle="true"
				value="&#160;"
				rendered="#{controller.handler.data.id!=null}"
				actionListener="#{controller.handler.onShowVariableNameHelp}"
				reRender="variableHelperModalContainer#{helperSuffix}"
				styleClass="aon-icon-commandButton aon-icon-lookup"/>
		</aon:div>
		<f:facet name="footer">
			<aon:div rendered="#{formNew}" > 
				<aon:inputText id="#{controller.beanName}_name-New" required="true"
					size="16" 
					value="#{controller.handler.data.name}"  
					disabled="#{controller.handler.data.id!=null}" >
					<a4j:support event="onchange" reRender="newVariableEditor" ajaxSingle="true" />
				</aon:inputText>
				<aon:commandButton id="variableHelpName-select-New"
					title="#{payrollBundle.payroll_variable_helper}" ajaxSingle="true"
					value="&#160;"
					rendered="#{controller.handler.data.id==null}"
					actionListener="#{controller.handler.onShowVariableNameHelp}"
					reRender="variableHelperModalContainer#{helperSuffix}"
					styleClass="aon-icon-commandButton aon-icon-lookup"/>
			</aon:div>
		</f:facet>
	</aon:column>
	
	<aon:column styleClass="aon-editDataTable-textColumn">
		<f:facet name="header">
			<aon:outputLabel 
				value="#{payrollBundle.payroll_salary_expression}" />
		</f:facet>
		<ui:include 
			src="/com/esferalia/aon/ui/payroll/facelet/variables/editor/grid.xhtml" >
			<ui:param name="controller" value="#{controller}" />
			<ui:param name="data" value="#{(to==controller.handler.data)?(controller.handler.data):(to)}" />
		</ui:include>
		<f:facet name="footer">
			<aon:div id="newVariableEditor">
				<ui:include 
					src="/com/esferalia/aon/ui/payroll/facelet/variables/editor/grid.xhtml" >
					<ui:param name="controller" value="#{controller}" />
					<ui:param name="data" value="#{controller.handler.data}" />
					<ui:param name="editorSuffix" value="-New" />
					<aon:valueParam name="formList" value="#{false}" />
					<aon:valueParam name="formEdit" value="#{false}" />
				</ui:include>
			</aon:div>
		</f:facet>
	</aon:column>  

	<aon:column styleClass="aon-editDataTable-dateColumn aon-width-120">
		<f:facet name="header">
			<aon:outputLabel for="#{controller.beanName}_startDate" value="#{bundle.aon_start_date}" />
		</f:facet>
		<aon:outputText value="#{to.startDate}" rendered="#{formList}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
		<aon:selectInputDate id="#{controller.beanName}_startDate" rendered="#{formEdit}"
			required="true"
			inputSize="10" renderAsPopup="true" enableManualInput="true" 
			value="#{controller.handler.data.startDate}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}"/>
		<f:facet name="footer">
			<aon:selectInputDate id="#{controller.beanName}_startDate-New" rendered="#{formNew}"
				required="true"
				inputSize="10" renderAsPopup="true" enableManualInput="true" 
				value="#{controller.handler.data.startDate}"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}"/>
		</f:facet>
	</aon:column>

	<aon:column styleClass="aon-editDataTable-dateColumn aon-width-120">
		<f:facet name="header">
			<aon:outputLabel for="#{controller.beanName}_endDate" value="#{bundle.aon_end_date}" />
		</f:facet>
		<aon:outputText value="#{to.endDate}" rendered="#{formList}">
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>		
		<aon:selectInputDate id="#{controller.beanName}_endDate" rendered="#{formEdit}"
			value="#{controller.handler.data.endDate}" 
			inputSize="10" renderAsPopup="true" enableManualInput="true"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>
		<f:facet name="footer">
			<aon:selectInputDate id="#{controller.beanName}_endDate-New" rendered="#{formNew}"
				value="#{controller.handler.data.endDate}"
				inputSize="10" renderAsPopup="true" enableManualInput="true"
				timeZone="#{timeZoneController.timeZone}"
				popupDateFormat="#{bundle.aon_date_pattern}"/>
		</f:facet>	
	</aon:column>

</ui:composition>
