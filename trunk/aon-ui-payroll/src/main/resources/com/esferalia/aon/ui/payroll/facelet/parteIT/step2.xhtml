<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/parteIT/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.parteIT_step2}" />
	</ui:define>

	<ui:define name="step_content">

		<aon:panel>
			<f:facet name="header">
				<aon:outputText value="#{payrollBundle.payroll_datos_empleado}" />
			</f:facet>
			<aon:panelGrid columns="6" dir="true" width="100%">

				<aon:outputText value="#{payrollBundle.payroll_documento}" />
				<aon:outputText
					value="#{parteITWizard.persona.registry.document.value}" />

				<aon:outputText value="#{payrollBundle.payroll_nombre}" />
				<aon:outputText value="#{parteITWizard.persona.fullName}" />

				<aon:outputText value="#{payrollBundle.payroll_numss}" />
				<aon:outputText value="#{parteITWizard.persona.numSS}" />
			</aon:panelGrid>
		</aon:panel>

		<aon:panel>
			<f:facet name="header">
				<aon:outputText value="#{payrollBundle.payroll_datos_contrato}" />
			</f:facet>
			<aon:dataTable id="contratosData"
				value="#{parteITWizard.empleosModel}" var="to" rows="20"
				columnClasses="
						aon-editDataTable-textColumn, aon-editDataTable-textColumn,
						aon-editDataTable-dateColumn, aon-editDataTable-dateColumn">

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.payroll_empresa}" />
					</f:facet>
					<aon:outputText value="#{to.empresa.name}" />
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.payroll_fecha_inicio}" />
					</f:facet>
					<aon:outputText value="#{to.fechaInicio}" />
				</aon:column>

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="#{payrollBundle.payroll_fecha_fin}" />
					</f:facet>
					<aon:outputText value="#{to.fechaFin}" />
				</aon:column>
			</aon:dataTable>
		</aon:panel>
	</ui:define>

</ui:composition>
