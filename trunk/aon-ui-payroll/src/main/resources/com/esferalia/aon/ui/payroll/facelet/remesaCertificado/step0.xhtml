	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"

	<ui:define name="step_name">

	<ui:define name="step_content">

					value="#{remesaCertificadoWizard.params.documento}">

<!--  
-->

					value="#{payrollBundle.payroll_apellido}" />

					value="#{remesaCertificadoWizard.params.empresa}" />
