<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html" >

	<aon:methodParam name="resetAction" value="" />
	
	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">	
		<ui:param name="showDescription" value="false" />		
		<ui:param name="innerToolbar" value="true" />
		<ui:param name="skipSearchButton" value="true" />
		<ui:param name="resetButtonReRender" value="#{controller.beanName}Content" />		
	</ui:include>

	<aon:methodParam name="rowSelectorAction" value="" />
	
	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
		
		<ui:param name="rowSelectorReRender" value="#{controller.beanName}Content" />
		
		<ui:define name="columns">
			
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="WorkPlace_description" value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText id="WorkPlace_description" value="#{to.description}" />
			</aon:column>

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="WorkPlace_address_shortAddress" 
						value="#{companyBundle.company_workplace_address}" />
				</f:facet>
				<aon:outputText id="WorkPlace_address_shortAddress" 
					value="#{to.address.shortAddress}" />
			</aon:column>			
			
<!--  
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputText for="WorkPlace_economicAgreement" value="#{configBundle.config_administration}" />
				</f:facet>
				<aon:outputText value="#{to.economicAgreement}" />
			</aon:column>		
-->
			
			<aon:column styleClass="aon-width-100">
				<f:facet name="header">
					<aon:outputLabel for="WorkPlace_active" value="#{bundle.aon_active}" />
				</f:facet>
				<aon:div styleClass="#{to.active?'aon-icon-checked':'aon-icon-check'}">
					<aon:outputText id="WorkPlace_active" value="&#160;" />
				</aon:div>
			</aon:column>
			
		</ui:define>
	</ui:decorate>

</ui:composition>
