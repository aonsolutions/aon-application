<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:methodParam name="resetAction" value="agreement_tree" />
	<aon:methodParam name="saveAction" value="agreement_tree" />
	<aon:methodParam name="removeAction" value="agreement_tree" />
	<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
		<ui:param name="toolbarTitle" value="#{payrollBundle.payroll_agreementLevel_module}" />
		<ui:param name="controller" value="#{agreementLevel}" />
		<ui:param name="skipSearchButton" value="true" />
		<ui:param name="skipBackButton" value="true" />
		<ui:param name="skipSpin" value="true" />
	</ui:decorate>
	
	<aon:div styleClass="aon-scroll-area">
		<aon:panelGrid columns="2" dir="true" width="100%">

			<aon:outputLabel value="#{bundle.aon_id}" rendered="#{!agreementLevel.new}"/>
			<aon:outputText value="#{agreementLevel.to.id}" rendered="#{!agreementLevel.new}"/>

			<aon:outputLabel value="#{payrollBundle.payroll_agreement}" rendered="#{!agreementLevel.new}"/>
			<aon:div rendered="#{!agreementLevel.new}">
				<aon:outputText value="#{agreementLevel.to.agreement.id}" />
				<aon:outputText value=" - " />
				<aon:outputText value="#{agreementLevel.to.agreement.description}" />
			</aon:div>

			<aon:outputLabel for="AgreementLevel_description"
				value="#{bundle.aon_description}" />
			<aon:inputText id="AgreementLevel_description"
				value="#{agreementLevel.to.description}" size="64" maxlength="64" />
		</aon:panelGrid>
		
		<aon:panelGrid columns="2" style="width: 100%;"
			columnClasses="
			aon-noborder aon-padding-left aon-width-auto aon-vertical-align-top,
			aon-noborder aon-padding-left aon-width-auto aon-vertical-align-top">
		
			<aon:panelTabSet rendered="#{!agreementLevel.new}" >

				

				<aon:panelTab id="levelData" disabled="#{agreementLevel.model==null}"
					actionListener="#{agreementLevel.onShowVariables}"
					label="#{payrollBundle.payroll_agreement_data}">
					<ui:include 
						src="/com/esferalia/aon/ui/payroll/facelet/variables/data/grid.xhtml" >
						<ui:param name="controller" value="#{agreementLevel}" />
						<ui:param name="showVariableFilter" value="true" />
					</ui:include>
				</aon:panelTab>

				<aon:panelTab id="category" label="#{payrollBundle.payroll_agreementLevel_category}">
						<aon:methodParam name="resetAction" value="" />
						<aon:methodParam name="saveAction" value="" />
						<aon:methodParam name="removeAction"  value="" />
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
							<ui:param name="controller" value="#{agreementLevelCategory}" />
							<ui:define name="columns">
								<aon:column styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputLabel for="EnterpriseActivityCategory_description" value="#{bundle.aon_description}" />
									</f:facet>
									<aon:outputText value="#{to.description}" rendered="#{formList}" />
									<aon:inputText id="EnterpriseActivityCategory_description"
										value="#{controller.to.description}"
										rendered="#{formEdit}" required="true" maxlength="64" size="64" />
									<f:facet name="footer">
										<aon:inputText id="EnterpriseActivityCategory_description-New"
											value="#{controller.to.description}"
											rendered="#{formNew}" required="true" maxlength="64" size="64" />
									</f:facet>
								</aon:column>
							</ui:define>
						</ui:decorate>
				</aon:panelTab>
				
				
			</aon:panelTabSet>
		</aon:panelGrid>
		
	</aon:div>
	
</ui:composition>
