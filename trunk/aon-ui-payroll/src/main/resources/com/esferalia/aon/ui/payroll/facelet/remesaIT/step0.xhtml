<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/com/esferalia/aon/ui/payroll/facelet/remesaIT/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.remesaIT_step0}"/>
	</ui:define>

	<ui:define name="step_content">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="skipSearchButton" value="true" />

				<ui:define name="searchContent">
					<aon:outputText
						value="#{payrollBundle.payroll_partes_pendientes}" />
					<aon:div>
						<aon:selectBooleanCheckbox id="baja" 
							value="#{remesaITWizard.params.baja}" />
						<aon:outputLabel for="baja" value="#{payrollBundle.payroll_baja}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="alta" 
							value="#{remesaITWizard.params.alta}" />
						<aon:outputLabel for="alta" value="#{payrollBundle.payroll_alta}" />
					</aon:div>

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="confirmacion"
							disabled="true" 
							value="#{remesaITWizard.params.confirmacion}" />
						<aon:outputLabel for="confirmacion" value="#{payrollBundle.payroll_confirmacion}" />
							
					</aon:div>
					
				</ui:define>
			</ui:decorate>
	</ui:define>
</ui:composition>
