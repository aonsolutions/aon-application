<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<rich:subTable id="remesaEmpleadosList" var="t" 
		rendered="#{to.showEmployees}"
		width="auto" value="#{to.remesableList}"
		columnClasses="aon-editDataTable-textColumn aon-width-80, 
				aon-editDataTable-textColumn aon-width-80,
				aon-editDataTable-textColumn aon-width-auto, 
				aon-editDataTable-iconColumn, 
				aon-editDataTable-iconColumn">

		<rich:column colspan="4" 
			style="padding: 0px; border: none;background-color: #FBEDB6;" >
			
			<h:panelGrid columns="7" style="font-size: 0.9em; width: 100%;"
				rendered="#{to.certificate.enterprise.registry.name==t.contract.workPlace.enterprise.registry.name}"
				cellpadding="0" cellspacing="0" border="0"
				columnClasses="
 				aon-width-40 aon-editDataTable-textColumn aon-form-text-label aon-noborder,
 				aon-width-250 aon-editDataTable-textColumn aon-noborder,
 				aon-width-100 aon-editDataTable-textColumn aon-form-text-label aon-noborder,
 				aon-width-70 aon-editDataTable-textColumn aon-noborder,
 				aon-width-80 aon-editDataTable-textColumn aon-form-text-label aon-noborder,
 				aon-width-70 aon-editDataTable-dateColumn aon-noborder,
 				aon-width-auto aon-editDataTable-textColumn aon-noborder
 				">
	
				<aon:outputText style="font-style:italic;"
					value="#{payrollBundle.payroll_employee_name}: " />
				<aon:outputText value="#{t.contract.person.fullName}" />

				<aon:outputText style="font-style:italic;"
					value="#{bundle.aon_document}: " />
				<aon:outputText value="#{t.contract.person.registry.document}" />

				<aon:outputText style="font-style:italic;"
					value="#{bundle.aon_end_date}: " />
				<aon:outputText value="#{t.contract.endDate}">
					<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
						timeZone="#{timeZoneController.timeZoneId}" />
				</aon:outputText>

				<aon:div>
					<aon:outputText style="font-style:italic;" 
						value="#{payrollBundle.certifica2Batch_suspension_cause}: " />
					<aon:outputText value="#{t.suspensionCause}" />
				</aon:div>
				
			</h:panelGrid>
		</rich:column>>
	</rich:subTable>
	
</ui:composition>
