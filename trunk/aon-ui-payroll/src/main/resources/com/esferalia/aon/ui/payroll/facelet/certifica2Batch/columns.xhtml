<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_enterprise}" />
		</f:facet>
		<aon:outputText value="#{to.contract.workPlace.enterprise.registry.fullName}" />
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_document}" />
		</f:facet>
		<aon:outputText value="#{to.contract.person.registry.document}" />
	</aon:column>

	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{payrollBundle.payroll_employee_name}" />
		</f:facet>
		<aon:outputText value="#{to.contract.person.registry.fullName}" />		
	</aon:column>
	
	<aon:column>
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_end_date}" />
		</f:facet>
		<aon:outputText value="#{to.contract.endDate}" >
			<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
				timeZone="#{timeZoneController.timeZoneId}" />
		</aon:outputText>
	</aon:column>

</ui:composition>
