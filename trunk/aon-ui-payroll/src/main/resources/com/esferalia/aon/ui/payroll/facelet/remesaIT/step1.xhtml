<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/remesaIT/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.remesaIT_step1}" />
	</ui:define>

	<ui:define name="step_content">
		<aon:dataTable id="remesaITList" var="to" rows="20" width="auto"
			value="#{remesaITWizard.model}"
			columnClasses="
						aon-editDataTable-iconColumn, 
						aon-editDataTable-textColumn aon-width-50,
						aon-editDataTable-textColumn aon-width-100,
						aon-editDataTable-textColumn aon-width-auto,
						aon-editDataTable-textColumn aon-width-auto,
						aon-editDataTable-textColumn aon-width-80, 
						aon-editDataTable-textColumn aon-width-80,
						aon-editDataTable-textColumn aon-width-150, 
						aon-editDataTable-iconColumn">

			<aon:column>
				<f:facet name="header">
					<aon:div layout="none">
						<aon:commandButton id="selectButton" 
							actionListener="#{remesaITWizard.onSelectAll}"
							reRender="remesaITList"
							onclick="if (!confirm('Desea marcar #{remesaITWizard.model.rowCount} filas?')) {return false;}"
							value="&#160;" style="margin-right: 0px; padding-right: 16px;"
							styleClass="aon-editDataTable-button aon-icon-checkAll aon-vertical-align-top" />
						<aon:commandButton id="deselectButton" 	
							actionListener="#{remesaITWizard.onDeselectAll}"
							reRender="remesaITList"
							onclick="if (!confirm('Desea desmarcar #{remesaITWizard.model.rowCount} filas?')) {return false;}"
							value="&#160;" style="margin-right: 0px; padding-left: 16px;"
							styleClass="aon-editDataTable-button aon-icon-checkNone aon-vertical-align-top" />
					</aon:div>
				</f:facet>
				<aon:selectBooleanCheckbox id="checkMessage" value="#{to.selected}"
					style="cursor: default;" styleClass="aon-vertical-align-middle">
					<a4j:support event="onclick"
						ajaxSingle="true"
						reRender="checkMessage"
						limitToList="true" />
				</aon:selectBooleanCheckbox>

			</aon:column>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/remesaIT/columns.xhtml" />
		</aon:dataTable>

		<aon:dataScroller2 for="remesaITList" showNote="true" />
	</ui:define>

</ui:composition>
