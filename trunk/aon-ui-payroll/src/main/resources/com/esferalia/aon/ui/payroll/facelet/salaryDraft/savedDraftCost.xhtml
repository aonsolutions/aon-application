<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >
	
	<aon:div styleClass="aon-margin-top aon-border" 
		style="background-color:#F6F6F6;">
		
		<aon:panelGrid columns="1" style="width: 100%;margin-right:10px;"
			columnClasses="aon-noborder aon-padding-left aon-width-auto">
			
			<aon:outputText value="&#160;&#160;" 
				styleClass="aon-bold" style="position: relative; top: -8px; margin-left: 5px; "/>

		</aon:panelGrid>
		

		<aon:panelGrid columns="1" style="width: 100%;margin-right:10px;"
			columnClasses="aon-noborder aon-padding-right aon-width-150 aon-text-right aon-bold">
					
			
			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftCost.xhtml" >
				<ui:param name="index" value="1" />
				<ui:param name="costs" value="#{sortedSalaryCosts.items['COMMON_CONTINGENCY']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftCost.xhtml" >
				<ui:param name="index" value="2" />
				<ui:param name="costs" value="#{sortedSalaryCosts.items['UNEMPLOYMENT']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftCost.xhtml" >
				<ui:param name="index" value="3" />
				<ui:param name="costs" value="#{sortedSalaryCosts.items['JOB_TRAINING']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftCost.xhtml" >
				<ui:param name="index" value="4" />
				<ui:param name="costs" value="#{sortedSalaryCosts.items['STRUCTURAL_OVERTIME']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftCost.xhtml" >
				<ui:param name="index" value="5" />
				<ui:param name="costs" value="#{sortedSalaryCosts.items['NON_STRUCTURAL_OVERTIME']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftCost.xhtml" >
				<ui:param name="index" value="6" />
				<ui:param name="costs" value="#{sortedSalaryCosts.items['FOGASA']}" />
			</ui:include>

			<ui:include src="/com/esferalia/aon/ui/payroll/facelet/salaryDraft/listDraftCost.xhtml" >
				<ui:param name="index" value="7" />
				<ui:param name="costs" value="#{sortedSalaryCosts.items['PROFESSIONAL_CONTINGENCY']}" />
			</ui:include>


			<aon:div style="">
				<aon:outputText value="&#160;"/>
				<aon:outputText value="#{oldTotal}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>

		</aon:panelGrid>		
	</aon:div>
</ui:composition>
