<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html" >


	<c:if test="#{costs.count == 0  }" >
		<aon:div style="border-bottom: solid #CCCCCC 1px;">
			<aon:outputText value="&#160;"/>
		</aon:div>
	</c:if>			
	

	<c:if test="#{costs.count == 1 }" >
		<aon:div style="border-bottom: solid #CCCCCC 1px;">
			<aon:outputText value="&#160;"/>
			<aon:outputText styleClass="#{costs.list[0].difference >= 0.01 ? 'aon-label-error' : ''}" value="#{costs.list[0].oldAmount}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:div>
	</c:if>			
	
	<c:if test="#{costs.count > 1}" >
		<aon:div >
			<aon:outputText value="&#160;"/>
		</aon:div>
		<c:set var="subTotal" value="#{0.00}" />
		<c:forEach var="cost" items="#{costs.list}">
			<aon:div style="border-bottom: solid #CCCCCC 1px;">
				<aon:outputText value="&#160;"/>
				<aon:outputText styleClass="#{cost.difference >= 0.01 ? 'aon-label-error' : ''}" value="#{cost.oldAmount}">
					<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
				</aon:outputText>
			</aon:div>
			<c:set var="subTotal" value="#{subTotal + cost.oldAmount}" />
		</c:forEach>
		<aon:div style="border-bottom: solid #CCCCCC 1px;">
			<aon:outputText value="&#160;"/>
			<aon:outputText value="#{subTotal}">
				<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
			</aon:outputText>
		</aon:div>
	</c:if>		
		

</ui:composition>
