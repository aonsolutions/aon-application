<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/esferalia/aon/ui/payroll/facelet/leaveBatch/step_template.xhtml">

	<ui:define name="step_name">
		<aon:outputText value="#{payrollBundle.leaveBatch_step2}" />
	</ui:define>

	<ui:define name="step_content">
		<aon:div id="leaveBatchListContainer" layout="none">
			<aon:dataTable id="leaveBatchList" var="to" rows="20" width="auto"
				value="#{leaveBatchWizard.selectedModel}"
				columnClasses="
						aon-editDataTable-iconColumn, 
						aon-editDataTable-textColumn aon-width-50,
						aon-editDataTable-textColumn aon-width-auto,
						aon-editDataTable-textColumn aon-width-100,
						aon-editDataTable-textColumn aon-width-auto,
						aon-editDataTable-textColumn aon-width-80, 
						aon-editDataTable-textColumn aon-width-80, 
						aon-editDataTable-textColumn aon-width-50,
						aon-editDataTable-textColumn aon-width-80,
						aon-editDataTable-textColumn aon-width-150, 
						aon-editDataTable-iconColumn">

				<aon:column>
					<f:facet name="header">
						<aon:outputText value="&#160;" />
					</f:facet>
					<aon:commandButton id="deselectButton"
						actionListener="#{leaveBatchWizard.onRemoveSelected}"
						reRender="leaveBatchListContainer"
						styleClass="aon-editDataTable-button aon-icon-delete" />
				</aon:column>

				<ui:include
					src="/com/esferalia/aon/ui/payroll/facelet/leaveBatch/columns.xhtml" />

			</aon:dataTable>

			<aon:dataScroller2 for="leaveBatchList" showNote="true" />
		</aon:div>
	</ui:define>

</ui:composition>
