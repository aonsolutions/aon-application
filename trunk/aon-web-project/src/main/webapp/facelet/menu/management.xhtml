<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="managementMenu">

			<aon:div styleClass="aon-scroll-area">

				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_project_management"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-statistics">
							<f:facet name="header">
								<aon:outputText value="#{projectBundle.project_projects}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="project"
										action="project_search"
										actionListener="#{project.onEditSearch}"
										value="#{projectBundle.project_projects}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="project_type"
										action="projectType_list"
										actionListener="#{projectType.onSearch}"
										value="#{projectBundle.project_project_type}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="activity_type"
										action="activityTypeStandalone_grid"
										actionListener="#{activityTypeStandalone.onSearch}"
										value="#{projectBundle.project_activity_type}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>

					<aon:panelGroup>
						<c:if test="#{aonRole.config}">
							<aon:panelGrid id="group_general_management"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-direct-access-panel aon-icon-general">
								<f:facet name="header">
									<aon:outputText value="#{appBundle.menu_general}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="geotreeParent-management"
											action="geotreeParent_list"
											actionListener="#{geotreeParent.onSearch}"
											value="#{geozoneBundle.geozone_module}" />
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
					</aon:panelGroup>

				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
