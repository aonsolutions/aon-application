<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html">
	
	<rich:modalPanel id="offerCreationPanel" minHeight="300"
		minWidth="700" rendered="#{audabridgeOffer.showOfferCreationPanel}"
		showWhenRendered="true" zindex="90">
		<f:facet name="header">
			<aon:div styleClass="aon-popupWindow-title">
				<aon:outputText value="#{audabridgeBundle.audabridge_offer_data}" />
			</aon:div>
		</f:facet>
		<f:facet name="controls">
			<aon:form>
				<aon:commandButton type="button"
					styleClass="aon-popupWindow-close"
					actionListener="#{audabridgeOffer.onHideOfferCreation}"
					reRender="offerCreationContainer"
					immediate="true">
					<aon:actionHotKey key="esc" />
				</aon:commandButton>
			</aon:form>
		</f:facet>
		<aon:form id="duplicateEntryForm">
			<aon:div styleClass="aon-popupWindow-content">
				<aon:div style="width:100%">
					<aon:div styleClass="aon-popupWindow-content-internal">
						<aon:div style="width:99%">
							<aon:div styleClass="aon-toolbar">
								<aon:commandButton id="OfferCreationAccept"
									value="#{bundle.aon_accept}"
									actionListener="#{audabridgeOffer.onOfferCreation}"
									reRender="offerCreationContainer"
									styleClass="aon-finding-toolbar-item aon-icon-accept">
								</aon:commandButton>
							</aon:div>
							<aon:div styleClass="aon-scroll-area aon-margin-top">
								<aon:panelGrid id="menuGrid" columns="2" dir="true" style="width: 80%;">
								
									<aon:outputLabel for="Offer_series" value="#{bundle.aon_series}/#{bundle.aon_number}" />
									<aon:div>
										<aon:selectOneMenu id="Offer_series" 
											value="#{audabridgeOffer.offer.series}" 
											valueChangeListener="#{audabridgeOffer.onSeriesChanged}" 
											reRender="Offer_number,securityLevelContainer">
											<f:selectItem itemLabel=" " itemValue="#{null}" />
											<f:selectItems value="#{configCollections.offerSeriesIds}" />
										</aon:selectOneMenu>
										<aon:inputText id="Offer_number" styleClass="aon-margin-left"
											value="#{audabridgeOffer.offer.number}" 
											required="true" size="7" />
									</aon:div>
									
									<c:if test="#{aonRole.confidentiality}">
										<aon:outputText value="&#160;"/>
										<aon:div id="securityLevelContainer">
											<aon:selectBooleanCheckbox id="Offer_securityLevel"
												value="#{audabridgeOffer.offer.confidential}"/>
											<aon:outputText styleClass="aon-italic aon-margin-right"
												value="#{bundle.aon_confidential}"/>
											<aon:outputText styleClass="aon-icon aon-icon-confidential" 
												value="&#160;" title="#{bundle.aon_confidential}"
												rendered="#{audabridgeOffer.offer.confidential}" />
										</aon:div>		
									</c:if>

									<aon:outputLabel for="Offer_date"
										value="#{bundle.aon_date}" />
									<aon:selectInputDate required="true"
										id="Offer_date" value="#{audabridgeOffer.offer.issueDate}"
										timeZone="#{timeZoneController.timeZone}"
										popupDateFormat="#{bundle.aon_date_pattern}"/>

									<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
										<ui:param name="lookupTo" value="#{audabridgeOffer.offer.target}" />
										<ui:param name="idRequired" value="#{true}" />
									</ui:include>
									
									<aon:outputLabel for="Offer_scope" value="#{bundle.aon_scope}" />
									<aon:selectOneMenu id="Offer_scope" value="#{audabridgeOffer.offer.scope}" required="true">
										<f:selectItems value="#{configCollections.currentUserScopes}" />
									</aon:selectOneMenu>
									
									<aon:outputLabel for="Offer_workPlace" value="#{bundle.purchase_workplace}" />
									<aon:selectOneMenu id="Offer_workPlace" required="true" value="#{audabridgeOffer.offer.workPlace}">
										<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
									</aon:selectOneMenu>
									
									
								</aon:panelGrid>
							</aon:div>
						</aon:div>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
	</rich:modalPanel>

</ui:composition>
