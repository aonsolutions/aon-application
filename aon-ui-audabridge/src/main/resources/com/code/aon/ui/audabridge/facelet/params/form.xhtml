<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.audabridge_parameters_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />

				<ui:define name="toolbarContent">

					<aon:commandButton id="save" value="#{bundle.aon_save}"
						accesskey="#{bundle.aon_key_save}"
						actionListener="#{audabridgeParams.onAccept}"
						styleClass="aon-finding-toolbar-item aon-icon-accept"
						onclick="if (!confirm('#{bundle.aon_save_confirm}')) return false;">
					</aon:commandButton>
				</ui:define>
			</ui:decorate>


			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="access_key" value="#{bundle.audabridge_access_key_param}" />
					<aon:inputText id="access_key" value="#{audabridgeParams.accessKey}" size="10"/>
						
					<aon:outputLabel for="customer_id" value="#{bundle.audabridge_customer_id_param}" />
					<aon:inputText id="customer_id" value="#{audabridgeParams.customerId}" size="10"/>
					
					<aon:outputText value="&#160;"/>
					<aon:outputText value="&#160;"/>

					<aon:outputLabel for="paintHourRate" value="#{bundle.audabridge_paint_hour_rate}" />
					<aon:inputText id="paintHourRate" value="#{audabridgeParams.paintHourRate}" size="8">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="bodyworkHourRate" value="#{bundle.audabridge_bodywork_hour_rate}" />
					<aon:inputText id="bodyworkHourRate" value="#{audabridgeParams.bodyworkHourRate}" size="8">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputLabel for="labourHourRate" value="#{bundle.audabridge_labour_hour_rate}" />
					<aon:inputText id="labourHourRate" value="#{audabridgeParams.labourHourRate}" size="8">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputText value="&#160;"/>
					<aon:outputText value="&#160;"/>

					<aon:outputLabel for="audagate_path" value="#{bundle.audabridge_audagate_path}" />
					<aon:inputText id="audagate_path" value="#{audabridgeParams.audaPlusPath}" size="50"/>

				</aon:panelGrid>

					<aon:panelCollapsible expanded="true" label="#{bundle.audabridge_offer_data}" styleClass="aon-margin-top">

						<aon:panelGrid columns="2" columnClasses="aon-panelGrid-odd aon-width-150 aon-text-left,aon-panelGrid-even aon-width-auto">

							<aon:outputLabel for="Item_id-OP" value="#{bundle.audabridge_operation_item}" />
							<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupTo" value="#{audabridgeParams.operationItem}" />
								<ui:param name="lookupSuffix" value="-OP" />
							</ui:include>

							<aon:outputLabel for="Item_id-SP" value="#{bundle.audabridge_spare_part_item}" />
							<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupTo" value="#{audabridgeParams.sparePartItem}" />
								<ui:param name="lookupSuffix" value="-SP" />
							</ui:include>

							
							<aon:outputLabel for="Item_id-PA" value="#{bundle.audabridge_paint_item}" />
							<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupTo" value="#{audabridgeParams.paintItem}" />
								<ui:param name="lookupSuffix" value="-PA" />
							</ui:include>

							<aon:outputLabel for="Item_id-DT" value="#{bundle.audabridge_discount_item}" />
							<ui:include src="/com/code/aon/ui/product/facelet/item/lookup.xhtml">
								<ui:param name="skipLabel" value="#{true}" />
								<ui:param name="lookupTo" value="#{audabridgeParams.discountItem}" />
								<ui:param name="lookupSuffix" value="-DT" />
							</ui:include>
							
							<aon:outputLabel for="integrationLevel" value="#{bundle.audabridge_integration_level}" />
							<aon:selectOneRadio id="integrationLevel" value="#{audabridgeParams.integrationLevel}">
								<f:selectItem itemLabel="#{bundle.audabridge_integration_level_0}" itemValue="0"/>
								<f:selectItem itemLabel="#{bundle.audabridge_integration_level_1}" itemValue="1"/>
							</aon:selectOneRadio>

						</aon:panelGrid>
					</aon:panelCollapsible>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{itemLookup}" />
	</ui:define>
</ui:composition>
