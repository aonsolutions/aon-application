<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{audabridgeBundle.audabridge_offer_module}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
				<ui:define name="toolbarContent">
					<aon:commandButton id="createAssessment" value="Crear Valoracion"
						rendered="#{audabridgeOffer.wan == null}"
						actionListener="#{audabridgeOffer.onCreateAssessment}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"
						styleClass="aon-finding-toolbar-item aon-icon-accept">
					</aon:commandButton>

					<aon:htmlCommandLink id="audagateCall" value="Editar Valoracion"
						rendered="#{audabridgeOffer.wan != null}" target="_new"
						actionListener="#{audabridgeOffer.onCallAudaGate}"
						styleClass="aon-finding-toolbar-item aon-icon-edit">
					</aon:htmlCommandLink>
					
					<aon:commandButton id="auditCalculation" value="Auditar Valoracion"
						rendered="#{audabridgeOffer.wan != null}"
						actionListener="#{audabridgeOffer.onAuditCalculation}"
						onclick="Richfaces.showModalPanel('waitProccess')"
						oncomplete="Richfaces.hideModalPanel('waitProccess')"
						styleClass="aon-finding-toolbar-item aon-icon-index">
					</aon:commandButton>

					<aon:htmlCommandLink id="assessmentReport" value="Informe"
						rendered="#{audabridgeOffer.wan != null}" target="_new"
						actionListener="#{audabridgeOffer.onReport}"
						style="padding-left: 25px;"
						styleClass="aon-finding-toolbar-item aon-icon-audatex">
					</aon:htmlCommandLink>
					
					<aon:commandButton id="offerCreation" value="Aceptar Valoración"
						rendered="#{audabridgeOffer.wan != null}"
						actionListener="#{audabridgeOffer.onShowOfferCreation}"
						reRender="offerCreationContainer,calculationDataContainer"
						styleClass="aon-finding-toolbar-item aon-icon-accept">
					</aon:commandButton>
					
				</ui:define>
			</ui:decorate>


			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2">

					<aon:outputLabel for="reference" value="#{audabridgeBundle.audabridge_reference_number}" />
					<aon:inputText id="reference" value="#{audabridgeOffer.assessment.referenceNumber}"
						size="15"/>

					<aon:outputLabel for="publicCode" value="#{bundle.tas_publicCode}" />
					<aon:inputText id="publicCode" value="#{audabridgeOffer.assessment.registration}" size="10"/>
						
					<aon:outputLabel for="registrationDate" value="#{tasBundle.tas_registrationDate}" />
					<aon:selectInputDate id="registrationDate"
						value="#{audabridgeOffer.assessment.registrationDate}"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}">
					</aon:selectInputDate>

					<aon:outputLabel for="odometer" value="#{tasBundle.tas_odometer}" />
					<aon:inputText id="odometer" value="#{audabridgeOffer.assessment.odometer}" size="10">
						<f:validateDoubleRange />
					</aon:inputText>

					<aon:outputText value="WAN" />
					<aon:outputText value="#{audabridgeOffer.wan}" />

				</aon:panelGrid>
				<aon:div id="calculationDataContainer">		
					<c:if test="#{audabridgeOffer.calculationData != null}">
						<ui:include src="/com/code/aon/ui/audabridge/facelet/offer/assessment.xhtml">
							<ui:param name="calculationData" value="#{audabridgeOffer.calculationData}" />
						</ui:include>
					</c:if>
				</aon:div>				
			</aon:div>
		</aon:form>
		<aon:div id="offerCreationContainer">
			<c:if test="#{audabridgeOffer.showOfferCreationPanel}">
				<ui:include src="/com/code/aon/ui/audabridge/facelet/offer/offer.xhtml" />
			</c:if>				
		</aon:div>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<aon:lookupButtonPopup lookup="#{targetLookup}" />
	</ui:define>
</ui:composition>
