<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputLabel for="Model_make_id"
		value="#{bundle.tas_make}" />

	<aon:selectOneMenu id="Model_make_id"
		value="#{tasCollections.make}"
		valueChangeListener="#{lookup.addIdEqualExpression}">
		<f:selectItem itemLabel=" - " value="#{null}" />
		<f:selectItems value="#{tasCollections.makes}" />
	</aon:selectOneMenu>

	<aon:outputLabel for="Model_name"
		value="#{bundle.aon_description}" />
	<aon:inputText id="Model_name" size="60"
		valueChangeListener="#{lookup.addExpression}" />

</ui:composition>
