<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/tas/facelet/model/lookup.xhtml">
		<ui:param name="lookupTo" value="#{tasItemSearch.model}" />
		<ui:param name="skipNewButton" value="#{true}" />
		<ui:param name="lookupInputSuggestSize" value="55" />
		<ui:param name="lookupSuffix" value="-TasItem" />
	</ui:include>

	<aon:outputLabel for="TasItem_publicCode"
		value="#{bundle.tas_publicCode}" />
	<aon:inputText id="TasItem_publicCode" size="20"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="TasItem_privateCode"
		value="#{bundle.tas_privateCode}" />
	<aon:inputText id="TasItem_privateCode" size="20"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="TasItem_description"
		value="#{bundle.aon_description}" />
	<aon:inputText id="TasItem_description" size="50"
		valueChangeListener="#{controller.addExpression}" />

	<aon:outputLabel for="TasItem_addInfo"
		value="#{bundle.tas_add_info}" />
	<aon:inputText id="TasItem_addInfo" size="50"
		valueChangeListener="#{controller.addExpression}" />
						
</ui:composition>
