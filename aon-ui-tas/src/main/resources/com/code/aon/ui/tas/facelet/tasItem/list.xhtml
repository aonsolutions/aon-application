<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountList">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{tasBundle.tas_tasItem_module}" />
				<ui:param name="controller" value="#{tasItem}" />
			</ui:decorate>			
 
			<aon:div styleClass="aon-scroll-area">
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
					<ui:param name="controller" value="#{tasItem}" />
					<ui:define name="columns">
					
						<aon:column alias="TasItem.model.make.name"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{tasBundle.tas_make}" />
							</f:facet>
							<aon:outputText value="#{to.model.make.name}" />
						</aon:column>

						<aon:column alias="TasItem.model.name"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{tasBundle.tas_model}" />
							</f:facet>
							<aon:outputText value="#{to.model.name}" />
						</aon:column>

						<aon:column alias="TasItem.publicCode"
							styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputText value="#{tasBundle.tas_publicCode}" />
							</f:facet>
							<aon:outputText value="#{to.publicCode}" />
						</aon:column>

						<aon:column alias="TasItem.privateCode"
							styleClass="aon-editDataTable-textColumn aon-width-150">
							<f:facet name="header">
								<aon:outputText value="#{tasBundle.tas_privateCode}" />
							</f:facet>
							<aon:outputText value="#{to.privateCode}" />
						</aon:column>
						
						<aon:column alias="TasItem.description"
							styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>

					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
