<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="tasItemForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{tasBundle.tas_tasItem_module}" />
				<ui:param name="controller" value="#{tasItem}" />
			</ui:include>

			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{tasItem}" />
				
				<ui:define name="searchContent">
				
					<aon:outputLabel for="TasItem_id"
						value="#{bundle.aon_id}" />
					<aon:inputText id="TasItem_id" size="10"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="TasItem_model_make_id" value="#{tasBundle.tas_make}" />
					<aon:selectOneMenu id="TasItem_model_make_id"
						value="#{TASCollections.make}"
						valueChangeListener="#{controller.addIdEqualExpression}">
						<f:selectItem itemLabel=" - " value="#{null}" />
						<f:selectItems value="#{TASCollections.makes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="TasItem_description"
						value="#{bundle.aon_description}" />
					<aon:inputText id="TasItem_description" size="50"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="TasItem_publicCode"
						value="#{tasBundle.tas_publicCode}" />
					<aon:inputText id="TasItem_publicCode" size="15"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="TasItem_privateCode"
						value="#{tasBundle.tas_privateCode}" />
					<aon:inputText id="TasItem_privateCode" size="15"
						valueChangeListener="#{controller.addExpression}" />

					<aon:outputLabel for="TasItem_addInfo"
						value="#{tasBundle.tas_add_info}" />
					<aon:inputText id="TasItem_addInfo" size="50"
						valueChangeListener="#{controller.addExpression}" />
						
				</ui:define>
			</ui:decorate>
			
			
		</aon:form>
	</ui:define>
</ui:composition>
