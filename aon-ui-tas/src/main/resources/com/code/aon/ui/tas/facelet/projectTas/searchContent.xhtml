<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:include src="/com/code/aon/ui/config/facelet/series/search.xhtml" />

	<aon:outputText value="#{bundle.aon_start_date}" />
	<aon:div>
		<aon:outputLabel for="ProjectTas_project_date-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="ProjectTas_project_date-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>

		<aon:outputLabel for="ProjectTas_project_date-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="ProjectTas_project_date-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>
	</aon:div>						
			
	<aon:outputText value="#{bundle.aon_end_date}" />
	<aon:div>
		<aon:outputLabel for="ProjectTas_statusDate-From" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_from}:" />
		<aon:selectInputDate id="ProjectTas_statusDate-From"
			valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>

		<aon:outputLabel for="ProjectTas_statusDate-To" styleClass="aon-form-date-label"
			value="#{bundle.aon_date_to}:" />
		<aon:selectInputDate id="ProjectTas_statusDate-To"
			valueChangeListener="#{controller.addLessThanOrEqualExpression}"
			timeZone="#{timeZoneController.timeZone}"
			popupDateFormat="#{bundle.aon_date_pattern}">
		</aon:selectInputDate>
	</aon:div>						
			
	<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml" >
		<ui:param name="lookupTo" value="#{projectTasSearch.target}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<ui:include src="/com/code/aon/ui/tas/facelet/tasItem/lookup.xhtml">
		<ui:param name="lookupTo" value="#{projectTasSearch.tasItem}" />
		<ui:param name="skipInputText" value="#{true}" />
		<ui:param name="skipNewButton" value="#{true}" />
	</ui:include>

	<aon:outputLabel for="ProjectTas_taskHolder_id"
		value="#{tasBundle.tas_projectTas_taskHolder}" />
	<aon:selectOneMenu id="ProjectTas_taskHolder_id"
		value="#{projectCollections.taskHolder}"
		valueChangeListener="#{controller.addIdEqualExpression}">
		<f:selectItem itemLabel="-" value="#{null}" />		
		<f:selectItems value="#{projectCollections.taskHolders}" />
	</aon:selectOneMenu>					

	<aon:outputLabel for="ProjectTas_comments"
		value="#{bundle.aon_description}" />
	<aon:inputText id="ProjectTas_comments" size="60"
		valueChangeListener="#{controller.addExpression}" />					

	<aon:outputText value="#{bundle.aon_status}"/>
	<aon:selectManyCheckbox value="#{projectTasSearch.projectStatuses}">
		<f:selectItems value="#{tasCollections.projectStatuses}" />
	</aon:selectManyCheckbox>							

</ui:composition>
