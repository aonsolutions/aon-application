<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div>
		<aon:div styleClass="aon-group">
			<aon:div styleClass="aon-group-title">
				<aon:outputText value="#{tasBundle.tas_projectTas_detail}"/>
			</aon:div>
			<aon:div styleClass="aon-group-body"> 
				<aon:div styleClass="aon-group-body-internal">
					<aon:panelGrid columns="2" styleClass="aon-width-all"
						columnClasses="aon-panelGrid-odd aon-width-120,aon-panelGrid-even aon-width-auto">

						<aon:outputLabel for="ProjectTas_number"
							value="#{bundle.aon_series}/#{bundle.aon_number}" />
						<aon:panelGrid columns="2" columnClasses="aon-width-180, aon-width-auto">
							<aon:div>
								<aon:selectOneMenu id="ProjectTas_series" 
									value="#{controller.to.series}" rendered="#{controller.new}"
									valueChangeListener="#{controller.onSeriesChanged}" 
									reRender="ProjectTas_number">
									<f:selectItem itemLabel=" " itemValue="#{null}" />
									<f:selectItems value="#{configCollections.tasSeriesIds}" />
								</aon:selectOneMenu>
								<aon:inputText id="ProjectTas_number" styleClass="aon-margin-left"
									value="#{controller.to.number}" rendered="#{controller.new}"
									required="true" size="7" />
								<aon:outputText styleClass="aon-bold aon-margin-right"
									value="#{controller.to.referenceCode}"
									rendered="#{!controller.new}" />
							</aon:div>
						</aon:panelGrid>

						<aon:outputLabel for="ProjectTas_project_date"
							value="#{bundle.aon_date}" />
						<aon:selectInputDate id="ProjectTas_project_date" 
							value="#{controller.to.project.date}" required="true"
							disabled="#{controller.finished}"
							timeZone="#{timeZoneController.timeZone}"
							popupDateFormat="#{bundle.aon_date_pattern}">
						</aon:selectInputDate>
						
						<ui:include src="/com/code/aon/ui/tas/facelet/tasItem/lookup.xhtml">
							<ui:param name="lookupTo" value="#{controller.to.tasItem}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="lookupDisabled"	value="#{controller.finished}" />
							<ui:param name="lookupReRender"	value="projectTasForm" />
							<aon:methodParam name="lookupChangeListener" value="#{controller.tasItemData}" type="lookupChangeListener" />
						</ui:include>
						
						<aon:outputText value="#{tasBundle.tas_projectTas_tasItemData}"/>
						<aon:panelGroup id="TasItemDiv" style="font-size: 0.9em;" styleClass="aon-italic aon-margin-left">
							<aon:panelGroup rendered="#{controller.to.tasItem.id != null}">
								<aon:outputLabel value="#{bundle.tas_privateCode}:" />
								<aon:outputText styleClass="aon-bold aon-margin-left" value="#{controller.to.tasItem.privateCode}"
									rendered="#{controller.to.tasItem.privateCode != null and controller.to.tasItem.privateCode != ''}" />
								<aon:outputText styleClass="aon-bold aon-margin-left" value="#{bundle.aon_undefined}"
									rendered="#{controller.to.tasItem.privateCode == null or controller.to.tasItem.privateCode == ''}" />

								<aon:outputLabel styleClass="aon-margin-left" value="#{bundle.aon_description}:" />
								<aon:outputText styleClass="aon-bold aon-margin-left" value="#{controller.to.tasItem.description}"
									rendered="#{controller.to.tasItem.description != null and controller.to.tasItem.description != ''}">
									<aon:abbreviateConverter maxWidth="64" />
								</aon:outputText>
								<aon:outputText styleClass="aon-bold aon-margin-left" value="#{bundle.aon_undefined}"
									rendered="#{controller.to.tasItem.description == null or controller.to.tasItem.description == ''}" />
							</aon:panelGroup>
						</aon:panelGroup>

						<ui:include src="/com/code/aon/ui/commercial/facelet/target/lookup.xhtml">
							<ui:param name="lookupTo" value="#{controller.to.target}" />
							<ui:param name="idRequired" value="#{true}" />
							<ui:param name="lookupDisabled"	value="#{controller.finished}" />
							<ui:param name="lookupReRender"	value="TasItemDiv,TargetDiv,lookupTasItem" />
							<aon:methodParam name="lookupChangeListener" value="#{controller.targetData}" type="lookupChangeListener" />
						</ui:include>

						<aon:outputText value="#{tasBundle.tas_projectTas_targetData}"/>
						<aon:panelGroup id="TargetDiv" style="font-size: 0.9em;" styleClass="aon-italic aon-margin-left">
							<aon:panelGroup rendered="#{controller.to.target.id != null}">
								<aon:outputText value="#{bundle.aon_company_document}:" />
								<aon:outputText styleClass="aon-bold aon-margin-left" value="#{controller.to.target.registry.document}"
									rendered="#{controller.to.target.registry.document != null and controller.to.target.registry.document != ''}" />
								<aon:outputText styleClass="aon-bold aon-margin-left" value="#{bundle.aon_undefined}"
									rendered="#{controller.to.target.registry.document == null or controller.to.target.registry.document == ''}" />
								
								<aon:outputText styleClass="aon-margin-left" value="#{bundle.aon_phone}:" />
								<aon:outputText styleClass="aon-bold aon-margin-left" value="#{controller.to.target.registry.phone.value}"
									rendered="#{controller.to.target.registry.phone.value != null}" />
								<aon:outputText styleClass="aon-bold aon-margin-left" value="#{bundle.aon_undefined}"
									rendered="#{controller.to.target.registry.phone.value == null}" />
								
								<aon:outputText styleClass="aon-margin-left" value="#{bundle.aon_cellular}:" />
								<aon:outputText styleClass="aon-bold aon-margin-left" value="#{controller.to.target.registry.cellular.value}"
									rendered="#{controller.to.target.registry.cellular.value != null}" />
								<aon:outputText styleClass="aon-bold aon-margin-left" value="#{bundle.aon_undefined}"
									rendered="#{controller.to.target.registry.cellular.value == null}" />
							</aon:panelGroup>
						</aon:panelGroup>

						<aon:outputLabel for="ProjectTas_counter" value="#{tasBundle.tas_odometer}" />
						<aon:inputText id="ProjectTas_counter" size="7" value="#{controller.to.counter}" disabled="#{controller.finished}">
							<f:validateDoubleRange />
						</aon:inputText>

						<aon:outputLabel for="ProjectTas_taskHolder" value="#{tasBundle.tas_projectTas_taskHolder}" />
						<aon:selectOneMenu id="ProjectTas_taskHolder"
							value="#{controller.to.taskHolder}"
							disabled="#{controller.finished}">
							<f:selectItem itemLabel="-" value="#{null}" />		
							<f:selectItems value="#{groupWareCollections.taskHolders}" />
						</aon:selectOneMenu>					

						<aon:outputLabel for="ProjectTas_workPlace" 
							value="#{bundle.purchase_workplace}" />
						<aon:selectOneMenu id="ProjectTas_workPlace" 
							value="#{controller.to.workPlace}"
							disabled="#{controller.finished}">
							<f:selectItems value="#{companyCollections.currentUserWorkPlaces}" />
						</aon:selectOneMenu>

						<aon:outputLabel for="ProjectTas_status" value="#{bundle.aon_status}" />
						<aon:selectOneRadio id="ProjectTas_status"
							value="#{controller.to.status}">
							<f:selectItems value="#{tasCollections.projectStatuses}" />
						</aon:selectOneRadio>					

						<aon:outputLabel for="ProjectTas_comments" value="#{bundle.aon_description}" />
						<aon:inputTextarea id="ProjectTas_comments" 
							value="#{controller.to.comments}" cols="100" rows="6"
							disabled="#{controller.finished}">
							<f:validateLength maximum="65536"/>
						</aon:inputTextarea>

					</aon:panelGrid>
				</aon:div>
			</aon:div>
		</aon:div>

	</aon:div>
</ui:composition>
