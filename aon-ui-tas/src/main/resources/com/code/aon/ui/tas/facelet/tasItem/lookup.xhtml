<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:h="http://java.sun.com/jsf/html">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/lookup.xhtml" >
		<ui:param name="lookupBean" value="#{tasItemLookup}" />
		<ui:param name="controller" value="#{tasItem}" />
		<ui:param name="skipInputText" value="#{true}"/>
		<ui:param name="lookupInputSuggestValue" value="#{lookupTo.model.fullName}"/>
		<ui:param name="lookupInputSuggestExpression" value="#{lto.publicCode} (#{lto.model.fullName})"/>
		<ui:param name="lookupLabel" value="#{tasBundle.tas_tasItem}" />
		<ui:param name="searchButtonTitle" value="#{tasBundle.tas_tasItem_selection}" />
		<ui:param name="skipNewButton" value="#{true}"/>

		<ui:define name="beforeLookupContent">
			<aon:lookupSuggestText id="#{pojoName}_id#{lookupSuffix}"
				lookup="#{lookupBean}" lookupProperty="#{lookupProperty}"
				lookupChangeListener="#{lookupChangeListener}"
				controllerListener="#{lookupControllerListener}"
				value="#{lookupTo.publicCode}" property="#{lookupTo}" 
				columnExpression="#{lookupInputSuggestExpression}"
				suggestAlias="TasItem_publicCode" matchBeginOnly="#{true}"
				required="#{idRequired}" disabled="#{lookupDisabled}"
				size="10" maxlength="25" minChars="2" 
				focus="#{lookupInputOnFocus}" selectReRender="#{lookup_reRender}" />		
		</ui:define>
		
	</ui:decorate>

</ui:composition>
