<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
	
	<aon:form id="avisoSearch">
	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{appBundle.aon_payroll_principales_aviso}" />
				<ui:param name="controller" value="#{aviso}"/>
				<ui:param name="skipResetButton" value="true" />
				
			</ui:include>	
      
			<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml" >
				<ui:define name="searchContent">
					<aon:methodParam name="searchActionListener" value="#{aviso.onSearch}" type="actionListener" />
					<aon:methodParam name="searchAction" value="aviso_list" />	
			
			
			  <aon:div id="datos2" styleClass="aon-scroll-area">		
				<aon:panelGrid columns="2" dir="true" width="100%" style="margin-bottom=2px;">
				
				
		 		
	    	<aon:outputLabel for="Avisos_cdg" value="#{appBundle.aon_payroll_principales_cuenta_cdg}" />
					<aon:inputText id="Avisos_cdg" valueChangeListener="#{cuenta.addExpression}"
						 size="50" maxlength="3" />
			 						 		
				
	 	 			
			 		<aon:outputLabel for="Avisos_cliente_cdg" 
						value="#{appBundle.aon_payroll_principales_domicilio_cli}" />
					<aon:div styleClass="aon-lookup">
						<aon:lookupInputText id="Avisos_cliente_cdg"
							lookup="#{clienteLookup}"
							reRender="Avisos_cliente_descripcion"
							value="#{aviso.cliente.cdg}" size="5">
						</aon:lookupInputText>
						<aon:lookupButton id="Cliente_lookup"
							windowTitle="#{appBundle.aon_payroll_principales_clientes}"
							selectReRender="Avisos_cliente_cdg,Avisos_cliente_descripcion"
							lookup="#{clienteLookup}" minHeight="440"
							property="#{aviso.cliente}">
						</aon:lookupButton>
						<aon:inputText id="Avisos_cliente_descripcion"
							value="#{(aviso.cliente.descripcion!=null)?(aviso.to.cliente.descripcion):('')}"   
							size="34" disabled="true" />
					</aon:div>
						
						
						<aon:outputLabel for="Avisos_descripcion" value="#{appBundle.aon_payroll_principales_cuenta_entidad_nom}" />
					<aon:inputText id="Avisos_descripcion" valueChangeListener="#{cuenta.addExpression}"
						 size="50" maxlength="20" />
						 
					<aon:outputLabel value="#{appBundle.aon_payroll_principales_aviso_fecha}" />
					<aon:selectInputDate 
						renderAsPopup="true" popupDateFormat="#{appBundle.aon_date_pattern}"
						value="#{aviso.fecha}"
						enableManualInput="true"/>
			  		
						
	     	</aon:panelGrid>				
	         </aon:div> 
	         
		 </ui:define>
			</ui:decorate>
		
		</aon:form>
       <aon:lookupButtonPopup lookup="#{clienteLookup}" />	
		

	</ui:define>
</ui:composition>

</body>
</html>
