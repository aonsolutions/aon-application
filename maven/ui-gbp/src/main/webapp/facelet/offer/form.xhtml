<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"            
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="offerForm">
			<aon:div styleClass="aon-finding-title-toolbar">
				<aon:panelGrid id="gridToolbar" columns="3" dir="true"
					columnClasses="aon-finding-title,aon-finding-subtitle,aon-finding-toolbar">

					<aon:div styleClass="aon-finding-title-internal">
						<aon:outputText value="#{menuBundle.gbp_offer}" />
					</aon:div>

					<aon:div styleClass="aon-finding-subtitle-internal">
						<aon:outputText
							value="#{bundle.aon_editing}" />
					</aon:div>

					<aon:div styleClass="aon-finding-toolbar-item-group">
						<aon:commandButton id="save" value="#{bundle.aon_save}"
							rendered="#{offer.to!=null or offer.new}"
							reRender="gridToolbar"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							actionListener="#{offer.accept}"
							accesskey="#{bundle.aon_key_save}" />
						<aon:commandButton id="cancel" value="#{bundle.aon_cancel}"
							rendered="#{offer.to!=null or offer.new}"
							styleClass="aon-finding-toolbar-item aon-icon-cancel"
							immediate="#{true}" action="offer_list"
							actionListener="#{offer.onCancel}"
							accesskey="#{bundle.aon_key_cancel}" />
						<aon:commandButton id="search" value="#{bundle.aon_search}"
							immediate="true" action="offer_search"
							actionListener="#{offer.onEditSearch}"
							styleClass="aon-finding-toolbar-item aon-icon-search"
							accesskey="#{bundle.aon_key_search}" />
						<t:commandButton id="offer_to" value="#{appBundle.gbp_print}"
							immediate="true" forceId="true" 
							onclick="reportWindow(this, 'placeList', '${facesContext.externalContext.requestContextPath}/facelet/report/preferences.jsf');return false;"
							styleClass="aon-finding-toolbar-item aon-icon-printer"
							accesskey="#{bundle.aon_key_print}" />
					</aon:div>
				</aon:panelGrid>
			</aon:div>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="offerGrid" columns="2" dir="true">

					<aon:outputLabel for="Offer_type"
						value="#{appBundle.gbp_offer_type}" />
					<aon:selectOneMenu id="Offer_type"
						disabled="true" value="#{frontOffer.to.type}">
						<f:selectItems value="#{GBPCollections.offerTypes}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_campaign_code"
						value="#{appBundle.gbp_offer_campaign_code}" />
					<aon:div>
						<aon:inputText id="Offer_campaign_code" size="16"
							disabled="true" styleClass="aon-inputText-disabled"
							maxlength="16" value="#{offer.to.campaign.code}" />
						<aon:inputText id="Offer_campaign_name" size="60"
							disabled="true" styleClass="aon-inputText-disabled"
							value="#{offer.to.campaign.name}" />
					</aon:div>

					<aon:outputLabel for="Offer_supplier"
						value="#{appBundle.gbp_offer_supplier}" />
					<aon:inputText id="Offer_supplier" size="64"
						disabled="true" styleClass="aon-inputText-disabled"
						maxlength="64" value="#{offer.to.supplier.name}" />

					<aon:outputLabel for="Offer_offerDate"
						value="#{appBundle.gbp_offer_offer_date}" />
					<aon:inputText id="Offer_offerDate" 
						size="16" maxlength="16"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{offer.to.offerDate}" >
						<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
							timeZone="#{timeZoneController.timeZoneId}" />
					</aon:inputText>	

					<aon:outputLabel for="Offer_price"
						value="#{appBundle.gbp_offer_price}" />
					<aon:inputText id="Offer_price" 
						size="16" maxlength="16"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{offer.to.price}">
						<f:convertNumber pattern="#,##0.000" />
					</aon:inputText>

					<aon:outputLabel for="Offer_deliveryDate"
						value="#{appBundle.gbp_offer_delivery_date}" />
					<aon:inputText id="Offer_deliveryDate" 
						size="20" maxlength="20"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{offer.to.deliveryDate}" />

					<aon:outputLabel for="Offer_stockProvision"
						value="#{appBundle.gbp_offer_stock_provision}" />
					<aon:inputText id="Offer_stockProvision" 
						size="16" maxlength="16"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{offer.to.stockProvision}">
						<f:convertNumber pattern="#,##0.000" />
					</aon:inputText>
						
					<aon:outputLabel for="Offer_quality"
						value="#{appBundle.gbp_offer_quality}" />
					<aon:inputTextarea id="Offer_quality"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{offer.to.quality}"
						cols="80" rows="5" />

					<aon:outputLabel for="Offer_defectiveGoods"
						value="#{appBundle.gbp_offer_defective_goods}" />
					<aon:inputTextarea id="Offer_defectiveGoods"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{offer.to.defectiveGoods}"
						cols="80" rows="5" />

					<aon:outputLabel for="Offer_additionalConditions"
						value="#{appBundle.gbp_offer_additional_conditions}" />
					<aon:inputTextarea id="Offer_additionalConditions"
						disabled="true" styleClass="aon-inputText-disabled"
						value="#{offer.to.additionalConditions}"
						cols="80" rows="5" />

					<aon:outputLabel for="Offer_office_id"
						value="#{appBundle.gbp_offer_office}" />
					<aon:div>
						<aon:lookupInputText id="Offer_office_id"
							lookup="#{officeLookup}"
							value="#{offer.to.office.id}" size="5"
							reRender="Offer_office_name">
						</aon:lookupInputText>
						<aon:lookupButton id="Offer_office_Lookup"
							windowTitle="#{appBundle.gbp_offer_office}"
							selectReRender="Offer_office_id,Offer_office_name"
							lookup="#{officeLookup}" actionType="search"
							property="#{offer.to.office}">
						</aon:lookupButton>
						<aon:inputText id="Offer_office_name"
							value="#{offer.to.office.name}"
							size="64" disabled="true" />
					</aon:div>
						
					<aon:outputLabel for="Offer_costType"
						value="#{appBundle.gbp_offer_cost_type}" />
					<aon:selectOneMenu id="Offer_costType"
						value="#{offer.to.costType}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{GBPCollections.costTypes}" />
					</aon:selectOneMenu>
					
					<aon:outputLabel for="Offer_accountContact_id"
						value="#{appBundle.gbp_offer_account_contact}" />
					<aon:selectOneMenu id="Offer_accountContact_id"
						value="#{offer.to.accountContact.id}">
						<f:selectItems value="#{GBPCollections.accountContacts}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_giftCode"
						value="#{appBundle.gbp_offer_gift_code}" />
					<aon:inputText id="Offer_giftCode" 
						size="10" maxlength="10"
						value="#{offer.to.giftCode}" />

					<aon:outputLabel for="Offer_paymentTerm"
						value="#{appBundle.gbp_offer_payment_term}" />
					<aon:inputText id="Offer_paymentTerm" 
						size="3" maxlength="3"
						value="#{offer.to.paymentTerm}" >
						<f:validateLongRange />
					</aon:inputText>	

					<aon:outputLabel for="Offer_status"
						value="#{appBundle.gbp_offer_status}" />
					<aon:selectOneMenu id="Offer_status"
						value="#{offer.to.status}" disabled="true">
						<f:selectItems value="#{GBPCollections.offerStatus}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_batch_config_id"
						value="#{appBundle.gbp_offer_batch_config}" />
					<aon:selectOneMenu id="Offer_batch_config_id"
						value="#{offer.to.batchConfig.id}">
						<f:selectItem value="#{nullSelectItem.value}" />
						<f:selectItems value="#{GBPCollections.batchConfigs}" />
					</aon:selectOneMenu>

					<aon:outputLabel for="Offer_breakdown"
						value="#{appBundle.gbp_offer_breakdown}" />
					<aon:inputText id="Offer_breakdown" 
						size="25" maxlength="20"
						value="#{offer.to.breakdown}" />

				</aon:panelGrid>

				<aon:div id="offerTab">
					<aon:panelTabSet>

						<aon:panelTab id="incidences" label="#{appBundle.gbp_incidences}">
							<ui:include src="/facelet/incidence/grid.xhtml">
								<ui:param name="controllerAlias" value="#{offerIncidence}" />
								<ui:param name="dataTable" value="offerIncidenceDataTable" />
								<ui:param name="parentGrid" value="offerGrid" />
							</ui:include>
						</aon:panelTab>
							
						<aon:panelTab id="signatures" label="#{appBundle.gbp_offer_signature_signatures}">
							<ui:include src="/facelet/offer/signature/list.xhtml"/>
						</aon:panelTab>

					</aon:panelTabSet>
				</aon:div>

			</aon:div>	
		</aon:form>
		<aon:form id="placeList" target="list" />
		<aon:lookupButtonPopup lookup="#{officeLookup}" />
	</ui:define>
</ui:composition>

</body>
</html>
