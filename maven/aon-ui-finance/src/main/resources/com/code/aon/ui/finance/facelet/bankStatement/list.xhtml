<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="bankStatementList">
			<aon:div ajaxRendered="true" layout="none">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{financeBundle.finance_bank_statement_module}" />
					<ui:param name="controller" value="#{bankStatement}" />
					<ui:param name="skipSearchButton" value="false" />

					<ui:define name="additionalToolbarContent">
						<aon:commandButton id="import-Popup"
							value="#{financeBundle.finance_bank_statement_import}"
							styleClass="aon-finding-toolbar-item aon-icon-file-entrance"
							rendered="#{!controller.new and controller.to == null}"
							actionListener="#{controller.onImportFileShow}"
							reRender="showImportFileWindow">
							<f:setPropertyActionListener target="#{controller.showImportFileWindow}"
								value="#{true}" />
						</aon:commandButton>
						<aon:commandButton id="checkLinks"
							value="#{financeBundle.finance_bank_statement_check_auto}"
							styleClass="aon-finding-toolbar-item aon-icon-attach-file"
							rendered="#{!controller.new and controller.to == null}"
							actionListener="#{controller.onCheckLinks}"
							reRender="#{dataTableId}"
							onclick="Richfaces.showModalPanel('waitProccess')"
							oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						<c:if test="#{aonRole.accountingOperator}">
							<aon:commandButton id="recordLinks"
								value="#{financeBundle.finance_record_selected}"
								styleClass="aon-finding-toolbar-item aon-icon-task-assume"
								rendered="#{!controller.new and controller.to == null}"
								actionListener="#{controller.onRecordLinks}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</c:if>
 					</ui:define>
				</ui:decorate>

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
					<aon:div style="background-color:#f6f5e3; padding:5px; margin-bottom:5px;"
						rendered="#{!bankStatement.new and bankStatement.to == null}">
						<aon:div id="bankStatementCommandContainer">
							<aon:outputText value="#{bundle.aon_see}:" styleClass="aon-bold" />
							<aon:commandLink value="#{financeBundle.finance_all}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeAll}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_list_pending}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeePending}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_list_checked}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeChecked}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_check_exact}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeExact}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_check_approximate}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeApproximate}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_check_ambiguous}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeAmbiguous}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_list_recorded}"
								style="padding-right:120px; margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSeeRecorded}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />

							<c:if test="#{aonRole.accountingOperator}">
								<aon:outputText value="#{financeBundle.finance_check_selected}:" styleClass="aon-bold" />
								<ui:include	src="/com/code/aon/ui/account/facelet/lookup/account/accountIdInput.xhtml">
									<ui:param name="wizard" value="#{accountWizard}" />
									<ui:param name="id" value="BankStatement_account" />
									<ui:param name="required" value="#{false}" />
									<ui:param name="style" value="display:inline; margin-left:0.7em;" />
									<ui:param name="size" value="12" />
									<ui:param name="maxlength" value="12" />
									<ui:param name="renderDescription" value="#{false}" />
									<ui:param name="renderedAttr" value="#{true}" />
									<ui:param name="disabled" value="#{false}" />
									<ui:param name="reRenderAttr" value="BankStatement_account_description" />
									<ui:param name="entity" value="#{bankStatement.account}" />
									<ui:param name="ELExpression" value="bankStatement.account" />
								</ui:include>
								<aon:inputText id="BankStatement_account_description"
									value="#{bankStatement.account.description}"
									styleClass="aon-bold"
									disabled="true" size="30" ajaxRendered="true" />
								<aon:commandButton id="checkSelectedByAccount"
									value="#{financeBundle.finance_bank_statement_check}"
									styleClass="aon-finding-toolbar-item aon-icon-attach-file aon-noborder"
									actionListener="#{bankStatement.onCheckSelectedByAccount}"
									reRender="#{dataTableId}"
									onclick="Richfaces.showModalPanel('waitProccess')"
									oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							</c:if>							
						</aon:div>
						<aon:div>
							<aon:outputText value="#{bundle.aon_check}:" styleClass="aon-bold" />
							<aon:commandLink value="#{financeBundle.finance_list_pending}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectPending}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_list_checked}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectChecked}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_check_exact}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectExact}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_check_approximate}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectApproximate}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_check_ambiguous}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectAmbiguous}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_list_recorded}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectRecorded}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_none}"
								style="padding-right:60px; margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onSelectNone}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />

							<aon:outputText value="#{financeBundle.finance_check_selected}:" styleClass="aon-bold" />
							<aon:selectOneMenu id="BankStatement_bankConcept"
								value="#{bankStatement.bankConcept}"
								styleClass="aon-margin-left">
								<f:selectItems value="#{financeCollections.bankConcepts}" />
							</aon:selectOneMenu>
							<aon:commandButton id="checkSelectedByConcept"
								value="#{financeBundle.finance_bank_statement_check}"
								styleClass="aon-finding-toolbar-item aon-icon-attach-file aon-noborder"
								actionListener="#{bankStatement.onCheckSelectedByConcept}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:div>
						<aon:div>
							<aon:outputText value="#{financeBundle.finance_tobreakdown}:" styleClass="aon-bold" />
							<aon:commandLink value="#{financeBundle.finance_checked}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onBreakdownSelected}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_list_current_page}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onBreakdownCurrentPage}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_none}"
								style="padding-right:308px; margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onBreakdownNone}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />

							<aon:outputText value="#{financeBundle.finance_cancel_checks}:" styleClass="aon-bold" />
							<aon:commandLink value="#{financeBundle.finance_all}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onCancelAll}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_checked}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onCancelSelected}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_check_exact}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onCancelExact}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_check_approximate}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onCancelApproximate}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
							<aon:commandLink value="#{financeBundle.finance_check_ambiguous}"
								style="margin-left:5px; text-decoration:underline;"
								actionListener="#{bankStatement.onCancelAmbiguous}"
								reRender="#{dataTableId}"
								onclick="Richfaces.showModalPanel('waitProccess')"
								oncomplete="Richfaces.hideModalPanel('waitProccess')" />
						</aon:div>
					</aon:div>

					<aon:div id="bankStatementDataContainer">
						<aon:panelGrid id="registryBankTable" columns="2" style="width:100%;"
							columnClasses="aon-panelGrid-odd aon-width-140
								,aon-panelGrid-even aon-width-auto">
							<aon:outputText value="#{configBundle.config_bank}" />
							<aon:selectOneMenu id="BankStatement_registryBank"
								value="#{bankStatement.registryBank}"
								valueChangeListener="#{bankStatement.onChangeBank}"
								reRender="bankStatementData"
								disabled="#{bankStatement.new or bankStatement.to != null}" 
								ajaxRendered="true">
								<f:selectItems value="#{companyCollections.companyBanks}" />
							</aon:selectOneMenu>
						</aon:panelGrid>

						<aon:div styleClass="aon-padding-top">
							<aon:panel>
								<f:facet name="header">
									<aon:outputLabel for="bankStatementData" 
										value="#{financeBundle.finance_bank_statement_detail}" />
								</f:facet>

								<ui:decorate
									template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
									<ui:param name="controller" value="#{bankStatement}" />
									<ui:param name="skipLineEdition" value="#{true}" />
									<ui:param name="skipRemoveButton" value="#{controller.to.recorded}" />
									<ui:define name="beginFormListContent">
										<aon:commandLink id="#{dataTableId}-selectButton"
											styleClass="aon-table-row-link" value="&#160;"
											immediate="true" ajaxSingle="true" requestDelay="100"
											actionListener="#{controller.onSelect}"
											onkeyup="#{dataTableId}KeyUp(this)"
											onfocus="#{dataTableId}SelectRow(this)"
											onblur="#{dataTableId}DeselectRow(this)"
											focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
										</aon:commandLink>
									</ui:define>
									<ui:define name="columns">
										<aon:column styleClass="aon-editDataTable-iconColumn">
											<f:facet name="header">
												<aon:outputText value="&#160;" />
											</f:facet>
											<aon:selectBooleanCheckbox id="BankStatementCheck"
												value="#{controller.bankStatementRowChecked}"
												valueChangeListener="#{controller.bankStatementRowSelected}" />	
										</aon:column>

										<aon:column styleClass="aon-editDataTable-iconColumn">
											<f:facet name="header">
												<aon:outputText value="I" />
											</f:facet>
											<aon:div style="display:inline; cursor:pointer;"
												rendered="#{controller.errorMessage != null}">
												<aon:outputText value="&#160;" styleClass="aon-icon-exception"
													style="padding-left:12px" />
												<rich:toolTip>
													<aon:outputText value="#{controller.errorMessage}" />
												</rich:toolTip>
											</aon:div>
											<aon:div style="display:inline; cursor:pointer;"
												rendered="#{to.checked and controller.errorMessage == null}">
												<aon:outputText value="&#160;" styleClass="aon-icon-point-green"
													style="padding-left:12px" rendered="#{to.exact}" />
												<aon:outputText value="&#160;" styleClass="aon-icon-point-light-green"
													style="padding-left:12px" rendered="#{to.approximate}" />
												<aon:outputText value="&#160;" styleClass="aon-icon-point-yellow"
													style="padding-left:12px" rendered="#{to.ambiguous}" />
												<aon:outputText value="&#160;" styleClass="aon-icon-point-orange"
													style="padding-left:12px" rendered="#{to.inexact}" />
												<rich:toolTip>
													<aon:outputText value="#{to.reliability}" />
												</rich:toolTip>
											</aon:div>
										</aon:column>

										<aon:column alias="BankStatement.lotNumber"
											styleClass="aon-editDataTable-textColumn aon-width-40">
											<f:facet name="header">
												<aon:outputText value="#{financeBundle.finance_bank_statement_lot}" />
											</f:facet>
											<aon:outputText value="#{to.lotNumber}" />
											<f:facet name="footer">
												<aon:outputText value="#{controller.to.lotNumber}" />
											</f:facet>
										</aon:column>

										<aon:column alias="BankStatement.operationDate"
											styleClass="aon-editDataTable-textColumn aon-width-120">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_date}" />
											</f:facet>
											<aon:outputText value="#{to.operationDate}" 
												rendered="#{formList or !controller.to.pending}">
												<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
													timeZone="#{timeZoneController.timeZoneId}" />
											</aon:outputText>
											<aon:selectInputDate id="BankStatement_operationDate" 
												value="#{controller.to.operationDate}"
												rendered="#{formEdit and controller.to.pending}" required="true"
												timeZone="#{timeZoneController.timeZone}"
												popupDateFormat="#{bundle.aon_date_pattern}"/>
											<f:facet name="footer">
												<aon:selectInputDate id="BankStatement_operationDate-New" 
													value="#{controller.to.operationDate}"
													rendered="#{formNew}" required="true"
													timeZone="#{timeZoneController.timeZone}"
													popupDateFormat="#{bundle.aon_date_pattern}"/>
											</f:facet>
										</aon:column>

										<aon:column alias="BankStatement.commonConcept"
											styleClass="aon-editDataTable-textColumn aon-width-120">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_operation}" />
											</f:facet>
											<aon:outputText value="#{to.commonConcept}"
												rendered="#{formList or !controller.to.pending}" />
											<aon:selectOneMenu id="BankStatement_concept"
												value="#{controller.to.commonConcept}"
												rendered="#{formEdit and controller.to.pending}">
												<f:selectItems value="#{financeCollections.statementConcepts}" />
											</aon:selectOneMenu>
											<f:facet name="footer">
												<aon:selectOneMenu id="BankStatement_concept-New"
													value="#{controller.to.commonConcept}"
													rendered="#{formNew}">
													<f:selectItems value="#{financeCollections.statementConcepts}" />
												</aon:selectOneMenu>
											</f:facet>
										</aon:column>

										<aon:column alias="BankStatement.description"
											styleClass="aon-editDataTable-textColumn aon-width-auto">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_concept}" />
											</f:facet>
											<aon:outputText value="#{to.description}"
												rendered="#{formList}">
												<aon:abbreviateConverter maxWidth="50" />
											</aon:outputText>
											<rich:toolTip rendered="#{controller.descriptionLength > 50}">
												<aon:outputText value="#{to.description}" />
											</rich:toolTip>
											<aon:inputText id="BankStatement_description"
												value="#{controller.to.description}"
												rendered="#{formEdit}" required="true"
												size="50" maxlength="80" />
											<f:facet name="footer">
												<aon:inputText id="BankStatement_description-New"
													value="#{controller.to.description}"
													rendered="#{formNew}" required="true"
													size="50" maxlength="80" />
											</f:facet>
										</aon:column>

										<aon:column alias="BankStatement.payment"
											styleClass="aon-editDataTable-textColumn aon-width-60">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_type}" />
											</f:facet>
											<aon:outputText value="#{financeBundle.finance_bank_statement_payment}"
												rendered="#{to.payment and (formList or controller.to.recorded)}" />
											<aon:outputText value="#{financeBundle.finance_bank_statement_charge}"
												rendered="#{!to.payment and (formList or controller.to.recorded)}" />
											<aon:selectOneMenu id="BankStatement_payment"
												value="#{controller.to.payment}"
												rendered="#{formEdit and !controller.to.recorded}">
												<f:selectItem itemLabel="#{financeBundle.finance_bank_statement_payment}" itemValue="#{true}" />
												<f:selectItem itemLabel="#{financeBundle.finance_bank_statement_charge}" itemValue="#{false}" />
											</aon:selectOneMenu>
											<f:facet name="footer">
												<aon:selectOneMenu id="BankStatement_payment-New"
													value="#{controller.to.payment}"
													rendered="#{formNew}">
													<f:selectItem itemLabel="#{financeBundle.finance_bank_statement_payment}" itemValue="#{true}" />
													<f:selectItem itemLabel="#{financeBundle.finance_bank_statement_charge}" itemValue="#{false}" />
												</aon:selectOneMenu>
											</f:facet>
										</aon:column>

										<aon:column alias="BankStatement.amount"
											styleClass="aon-editDataTable-numberColumn aon-width-80">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_amount}" />
											</f:facet>
											<aon:outputText value="#{to.amount}"
												rendered="#{formList or controller.to.recorded}">
												<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
											</aon:outputText>
											<aon:inputText id="BankStatement_amount"
												value="#{controller.to.amount}"
												rendered="#{formEdit and !controller.to.recorded}" required="true"
												size="8">
												<f:validateDoubleRange minimum="0.0" />
											</aon:inputText> 
											<f:facet name="footer">
												<aon:inputText id="BankStatement_amount-New"
													value="#{controller.to.amount}"
													rendered="#{formNew}" required="true"
													size="10">
													<f:validateDoubleRange minimum="0.0" />
												</aon:inputText> 
											</f:facet>
										</aon:column>

										<aon:column alias="BankStatement.status"
											styleClass="aon-editDataTable-textColumn aon-width-80">
											<f:facet name="header">
												<aon:outputText value="#{bundle.aon_status}" />
											</f:facet>
											<aon:outputText value="#{to.status}" />
											<f:facet name="footer">
												<aon:outputText value="#{controller.to.status}" />
											</f:facet>
										</aon:column>
				 					</ui:define>
									<ui:define name="endFormListContent">
										<aon:div>
											<aon:commandButton id="addLink"
												value="&#160;" styleClass="aon-icon-attach-file aon-noborder"
												title="#{financeBundle.finance_bank_statement_check_manual}"
												rendered="#{!to.recorded}"
												actionListener="#{controller.onAddLinkShow}"
												reRender="showLinkWindow">
												<f:setPropertyActionListener target="#{controller.showLinkWindow}"
													value="#{true}" />
											</aon:commandButton>
											<aon:commandButton id="showLink"
												value="&#160;" styleClass="aon-icon-tree-root aon-noborder"
												title="#{financeBundle.finance_tobreakdown}"
												rendered="#{(to.checked and !to.showBankStatementLink) or (to.recorded and !to.showAccountEntry)}" 
												actionListener="#{controller.onShowBankStatementLink}"
												reRender="#{dataTableId}" />
											<aon:commandButton id="hideLink"
												value="&#160;" styleClass="aon-icon-index aon-noborder"
												title="#{financeBundle.finance_hide}"
												rendered="#{(to.checked and to.showBankStatementLink) or (to.recorded and to.showAccountEntry)}" 
												actionListener="#{controller.onHideBankStatementLink}"
												reRender="#{dataTableId}" />
											<aon:div style="display:inline; cursor:pointer;" rendered="#{!empty to.comments}">
												<aon:outputText value="&#160;" styleClass="aon-icon-comment-red" 
													style="padding-left:30px" />
												<rich:toolTip direction="bottom-left">
													<aon:outputText value="#{to.comments}" />
												</rich:toolTip>
											</aon:div>
 										</aon:div>
										<rich:subTable id="bankStatementLinkTable" 
											rendered="#{to.checked and controller.showBankStatementLink}"
											value="#{controller.bankStatementLinkList}" var="statementLink">

											<aon:column colspan="4"	
												styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-yellow-column">
												<aon:outputText value="&#160;" />
											</aon:column>

											<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-yellow-column">
												<aon:outputText value="#{statementLink.date}">
													<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
														timeZone="#{timeZoneController.timeZoneId}" />
												</aon:outputText>
											</aon:column>

											<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-yellow-column">
												<aon:outputText value="#{financeBundle.finance_tracking_batched} "
													rendered="#{statementLink.financeBatch}" />
												<c:if test="#{aonRole.accountingOperator}">
													<aon:outputText value="#{statementLink.concept}" 
														rendered="#{statementLink.bankConcept or statementLink.account}" />
												</c:if>
												<aon:outputText value="#{statementLink.concept}" 
													rendered="#{statementLink.financeTracking or statementLink.financeBatch}" />
											</aon:column>

											<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-yellow-column">
												<aon:outputText value="#{statementLink.description}" />
											</aon:column>

											<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-yellow-column">
												<aon:outputText value="#{financeBundle.finance_return_abbrv}" 
													rendered="#{to.returned}" /> 
												<aon:outputText value="#{financeBundle.finance_payment}" 
													rendered="#{statementLink.payment}" /> 
												<aon:outputText value="#{financeBundle.finance_charge}"
													rendered="#{!statementLink.payment}" />
											</aon:column>

											<aon:column styleClass="aon-editDataTable-numberColumn aon-italic aon-bold aon-subTable-yellow-column">
												<aon:outputText value="#{statementLink.amount}">
													<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
												</aon:outputText>
											</aon:column>

											<aon:column colspan="2" 
												styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-yellow-column">
												<aon:outputText value="&#160;" />
											</aon:column>
										</rich:subTable>

										<rich:subTable id="accountEntryTable"
											rendered="#{aonRole.accountingOperator and to.recorded and controller.showAccountEntry}"
											value="#{controller.accountEntryDetails}" var="entryDetail"
											headerClass="aon-editDataTable-textColumn aon-subTable-green-header aon-italic aon-bold">

											<aon:column colspan="3" 
												styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-green-column">
												<f:facet name="header">
													<aon:div>
														<aon:outputText value="#{bundle.aon_confidential}" 
															rendered="#{controller.accountEntry.confidential}" />
													</aon:div>
												</f:facet>
												<aon:outputText value="&#160;" />
											</aon:column>

											<aon:column colspan="2" 
												styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-green-column">
												<f:facet name="header">
													<aon:div>
														<aon:outputText value="#{financeBundle.finance_account_entry}: " />
														<aon:outputText value="#{controller.accountEntry.id}" />
													</aon:div>
												</f:facet>
												<aon:outputText value="#{entryDetail.concept}" />
											</aon:column>

											<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-green-column">
												<f:facet name="header">
													<aon:div>
														<aon:outputText value="#{bundle.aon_date}: " />
														<aon:outputText value="#{controller.accountEntry.entryDate}">
															<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
																timeZone="#{timeZoneController.timeZoneId}" />
														</aon:outputText>
													</aon:div>
												</f:facet>
												<aon:outputText value="#{entryDetail.account.id}" />
											</aon:column>

											<aon:column styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-green-column">
												<f:facet name="header">
													<aon:outputText value="#{bundle.aon_concept}" />
												</f:facet>
												<aon:outputText value="#{entryDetail.account.description}" />
											</aon:column>

											<aon:column styleClass="aon-editDataTable-numberColumn aon-italic aon-bold aon-subTable-green-column">
												<f:facet name="header">
													<aon:outputText value="#{financeBundle.finance_debit}" />
												</f:facet>
												<aon:outputText value="#{entryDetail.debit}">
													<f:convertNumber pattern="#,##0.00" />
												</aon:outputText>
											</aon:column>

											<aon:column styleClass="aon-editDataTable-numberColumn aon-italic aon-bold aon-subTable-green-column">
												<f:facet name="header">
													<aon:outputText value="#{financeBundle.finance_credit}" />
												</f:facet>
												<aon:outputText value="#{entryDetail.credit}">
													<f:convertNumber pattern="#,##0.00" />
												</aon:outputText>
											</aon:column>

											<aon:column colspan="2"	
												styleClass="aon-editDataTable-textColumn aon-italic aon-bold aon-subTable-green-column">
												<aon:outputText value="#{entryDetail.balancingAccount.id}" />
											</aon:column>
										</rich:subTable>
									</ui:define>
 								</ui:decorate>
							</aon:panel>
						</aon:div>
					</aon:div>
				</aon:div>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/finance/facelet/bankStatement/modalImport.xhtml" />
		<ui:include src="/com/code/aon/ui/finance/facelet/bankStatement/modalLink.xhtml">
			<ui:param name="linkManager" value="#{bankStatement.bankStatementLinkManager}" />
		</ui:include>
		<ui:include	src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />

	</ui:define>
</ui:composition>
