<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="accountForm">
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/searchToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{toolbarTitle}" />
				<ui:param name="controller" value="#{controller}" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/shared/searchContent.xhtml">
				<ui:param name="controller" value="#{controller}" />
				<ui:define name="searchContent">
					<aon:outputLabel for="Customer_description"
						value="#{bundle.aon_company_name}" />
					<aon:inputText id="Customer_description" size="50"
						value="#{controller.companyName}" />

					<aon:outputText value="&#160;" />
					<aon:div>
						<aon:selectBooleanCheckbox id="Customer_showErrors"
							value="#{controller.showErrors}" />
						<aon:outputLabel for="Customer_showErrors" 
							value="#{accountBridgeBundle.account_bridge_show_errors}" />
					</aon:div>
						
					
				</ui:define>
			</ui:decorate>
		</aon:form>
	</ui:define>
</ui:composition>
