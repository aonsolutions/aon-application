<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="webinfoForm">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="toolbarTitle"
					value="#{infowebBundle.infoweb_data}" />
				<ui:param name="controller" value="#{companyWebInfo}" />
				<ui:param name="skipCancelButton" value="true" />
				<ui:param name="skipRemoveButton" value="true" />
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="skipBackButton" value="true" />
			</ui:include>
	
			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid columns="2" dir="true" style="width:100%">
			
					<aon:outputLabel for="WebInfo_slogan" value="#{infowebBundle.infoweb_data_slogan}" />
					<aon:inputText id="WebInfo_slogan" 
						size="64" maxlength="64" value="#{companyWebInfo.to.slogan}" />
			
					<aon:outputLabel for="WebInfo_schedule" value="#{infowebBundle.infoweb_data_schedule}" />
					<aon:inputTextarea id="WebInfo_schedule" styleClass="aon-inputText"
						cols="90" rows="3" value="#{companyWebInfo.to.schedule}" />
			
					<aon:outputLabel for="Generic_content_richTextEnabled"
						value="#{infowebBundle.infoweb_page_rich_enable}" />
					<aon:selectBooleanCheckbox id="Generic_content_richTextEnabled"
						value="#{webPage.richTextEnabled}">
						<a4j:support ajaxSingle="true" event="onclick"
							reRender="WebInfo_commercialDescription" />
					</aon:selectBooleanCheckbox>

					<aon:outputLabel for="WebInfo_commercialDescription" value="#{infowebBundle.infoweb_data_short_description}" />
					<rich:editor 
						id="WebInfo_commercialDescription"
						value="#{companyWebInfo.to.commercialDescription}"
						viewMode="#{webPage.richTextEnabled?'visual':'source'}"
						height="280" width="640" configuration="tinyMCE"
						language="#{facesContext.application.defaultLocale.language}" />
				</aon:panelGrid>
			</aon:div>
		
		</aon:form>
	</ui:define>
	
</ui:composition>
