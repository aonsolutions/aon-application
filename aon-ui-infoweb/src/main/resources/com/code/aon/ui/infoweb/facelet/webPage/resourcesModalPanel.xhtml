<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panelGroup id="showResourceModalPanel">
		<aon:if test="#{webPage.showResourceModalPanel}">
			<rich:modalPanel id="resourceModalPanel"
				rendered="#{webPage.showResourceModalPanel}" showWhenRendered="true"
				minHeight="400" height="400" width="580">

				<f:facet name="header">
					<aon:div styleClass="aon-popupWindow-title">
						<aon:outputText value="#{bundle.company_images_module}" />
					</aon:div>
				</f:facet>				
				<f:facet name="controls">
					<aon:form>
						<aon:commandButton type="button" styleClass="aon-popupWindow-close"
							reRender="showResourceModalPanel" immediate="true">
							<aon:actionHotKey key="esc" />
							<f:setPropertyActionListener target="#{webPage.showResourceModalPanel}" value="#{false}" />
							<rich:componentControl for="resourceModalPanel" operation="hide" event="onclick" />
						</aon:commandButton>
					</aon:form>
				</f:facet>

				<rich:panel id="pageResourcePanel">				

					<aon:form id="pagesResourcesForm">

						<aon:div styleClass="aon-toolbar">
							<aon:commandButton 
								reRender="showResourceModalPanel" value="#{bundle.aon_close}" immediate="true"
								styleClass="aon-finding-toolbar-item aon-icon-cancel">
								<f:setPropertyActionListener
									target="#{webPage.showResourceModalPanel}" value="#{false}" />
								<rich:componentControl for="resourceModalPanel" operation="hide"
									event="onclick" />
							</aon:commandButton>
						</aon:div>
						
						<ui:include src="/com/code/aon/ui/infoweb/facelet/webPage/resourceGrid.xhtml" />

					</aon:form>

				</rich:panel>

			</rich:modalPanel>
		</aon:if>
	</aon:panelGroup>
</ui:composition>
