<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<ui:decorate
		template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
		<ui:param name="controller" value="#{webPageResource}" />
		<ui:define name="columns">
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-140" >
				<f:facet name="header">
					<aon:outputLabel for="WebInfoPageResource_rattach"
						value="#{bundle.company_images_module}" />
				</f:facet>
				<aon:outputText
					value="#{to.rattach.description}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="WebInfoPageResource_rattach"
					value="#{controller.to.rattach}"
					rendered="#{formEdit}" required="true">
					<f:selectItems value="#{webPage.images}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="WebInfoPageResource_rattach-New"
						value="#{controller.to.rattach}" 
						rendered="#{formNew}" required="true">
						<f:selectItems value="#{webPage.images}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
	
			<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto" >
				<f:facet name="header">
					<aon:outputLabel for="WebInfoPageResource_content"
						value="#{bundle.aon_description}" />
				</f:facet>
				<aon:outputText 
					value="#{to.content}" rendered="#{formList}" />
				<aon:inputText id="WebInfoPageResource_content"
					value="#{controller.to.content}" maxlength="255"
					rendered="#{formEdit}" size="32" />
				<f:facet name="footer">
					<aon:inputText id="WebInfoPageResource_content-New"
						value="#{controller.to.content}" maxlength="255"
						rendered="#{formNew}" size="32" />
				</f:facet>
			</aon:column>
	
		</ui:define>
	</ui:decorate>

</ui:composition>
