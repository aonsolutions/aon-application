<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="pagesForm">

		<aon:div>
			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.infoweb_pages}" />
				<ui:param name="toolbarDescription" value="#{bundle.aon_editing}" />
			</ui:include>
			
			<rich:panel id="pagesPanel" styleClass="aon-content-home">
			
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
					<ui:param name="controller" value="#{webPage}" />
					<ui:param name="skipResetButton" value="#{(webPage.model.rowCount &gt; 7)}" />
					<ui:param name="columnClasses" value="aon-editDataTable-textColumn aon-width-auto,
						aon-editDataTable-textColumn aon-width-150,
						aon-editDataTable-textColumn aon-width-40,
						aon-editDataTable-textColumn aon-width-60,
						aon-editDataTable-textColumn aon-width-40" />					
					<ui:define name="columns">
			
						<aon:column>
							<f:facet name="header">
								<aon:outputLabel for="WebInfoPage_name" value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.name}" rendered="#{formList}" />
							<aon:inputText id="WebInfoPage_name" maxlength="15"
								validator="#{webPage.pageNameCheck}" rendered="#{formEdit}"
								value="#{webPage.to.name}" required="true" size="20" />
							<f:facet name="footer">
								<aon:div>				
									<aon:inputText id="WebInfoPage_name-New" maxlength="15"
										validator="#{webPage.pageNameCheck}"
										value="#{webPage.to.name}" rendered="#{formNew}"
										required="true" size="20" />
									<aon:outputText value="#{bundle.infoweb_max_number_pages}" rendered="#{!formNew and webPage.model.rowCount &lt; 9}"/>
									<aon:outputText value="#{bundle.infoweb_max_pages_exceeded}" rendered="#{!formNew and webPage.model.rowCount &gt; 8}"/>
								</aon:div>
							</f:facet>
						</aon:column>
			
						<aon:column>					
							<f:facet name="header">
								<aon:outputLabel for="WebInfoPage_type" value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.type}" rendered="#{formList}" />
							<aon:selectOneMenu id="WebInfoPage_type"
								value="#{webPage.to.type}" rendered="#{formEdit}">
								<f:selectItems value="#{webinfoCollections.pageTypes}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu id="WebInfoPage_type-New"
									value="#{webPage.to.type}" rendered="#{formNew}">
									<f:selectItems value="#{webinfoCollections.pageTypes}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_active}" />
							</f:facet>
							<aon:div onmouseover="disableRowSelector();" onmouseup="disableRowSelector();"
								onmouseout="enableRowSelector();">				
								<aon:commandButton id="activatePage"
									title="#{bundle.aon_activate}"								
									actionListener="#{webPage.onActivate}"
									rendered="#{!to.active}" ajaxSingle="true"
									styleClass="aon-editDataTable-button aon-icon-accept" />
								<aon:commandButton id="deactivatePage"
									title="#{bundle.aon_deactivate}"								
									actionListener="#{webPage.onDeactivate}"
									rendered="#{to.active}" ajaxSingle="true"
									styleClass="aon-editDataTable-button aon-icon-removed" />
							</aon:div>
						</aon:column>

						<aon:column>
							<f:facet name="header">
								<aon:outputText value="#{bundle.infoweb_page_position}" />
							</f:facet>
							<aon:div onmouseover="disableRowSelector();" onmouseup="disableRowSelector();"
								onmouseout="enableRowSelector();">				
								<aon:commandButton id="movePageUp"
									title="#{bundle.infoweb_page_up}"								
									actionListener="#{webPage.onMoveUp}"
									rendered="#{to.position != 0}" ajaxSingle="true"
									styleClass="aon-editDataTable-button aon-icon-up" />
								<aon:commandButton id="movePageDown"
									title="#{bundle.infoweb_page_down}"								
									actionListener="#{webPage.onMoveDown}"
									rendered="#{to.position &lt; (webPage.model.rowCount - 1)}" ajaxSingle="true"
									styleClass="aon-editDataTable-button aon-icon-down" />
							</aon:div>
						</aon:column>

					</ui:define>
					
					<ui:define name="endFormListContent">
						<aon:commandButton title="#{bundle.infoweb_page_detail}" 
							onmouseover="disableRowSelector();" onmouseout="enableRowSelector();" oncomplete="enableRowSelector();"
							actionListener="#{webPage.onSelectDetail}" rendered="#{to.detailed}" ajaxSingle="true"
							value="" styleClass="aon-editDataTable-button aon-icon-file-entrance"
							reRender="showGenericModalPanel, showLocationModalPanel, showResourceModalPanel"/>
					</ui:define>
					
				</ui:decorate>

			</rich:panel>
		</aon:div>
		</aon:form>
	
		<ui:include src="/com/code/aon/ui/infoweb/facelet/webPage/genericModalPanel.xhtml" />	
		<ui:include src="/com/code/aon/ui/infoweb/facelet/webPage/locationModalPanel.xhtml" />	
		<ui:include src="/com/code/aon/ui/infoweb/facelet/webPage/resourcesModalPanel.xhtml"/>	

	</ui:define>
</ui:composition>
