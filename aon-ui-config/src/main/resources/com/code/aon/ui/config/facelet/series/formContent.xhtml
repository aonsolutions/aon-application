<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:valueParam name="sfc_aliasPreffix" default="#{controller.pojoShortName}" />
	<aon:valueParam name="sfc_label" default="#{bundle.aon_series}/#{bundle.aon_number}" />
	<aon:valueParam name="sfc_div" default="#{sfc_aliasPreffix}_seriesNumberDiv" />
	<aon:valueParam name="sfc_editable" default="#{controller.nevv}" />
	<aon:valueParam name="sfc_disabled" default="#{false}" />
	<aon:valueParam name="sfc_seriesCodes" default="#{controller.seriesCodes}" />
	<aon:valueParam name="sfc_seriesCodesLength" default="#{controller.seriesListLength}" />
	<aon:valueParam name="sfc_seriesValid" default="#{true}" />
	<aon:valueParam name="sfc_seriesRequired" default="#{true}" />
	<aon:valueParam name="sfc_seriesProperty" default="#{controller.to.series}" />
	<aon:valueParam name="sfc_numberProperty" default="#{controller.to.number}" />
	<aon:valueParam name="sfc_numberEditable" default="#{controller.numberEditable}" />
	<aon:valueParam name="sfc_numberReset" default="#{true}" />
	<aon:methodParam name="sfc_onSeriesChanged" type="valueChangeListener"
		default="#{controller.onSeriesChanged}" />
	<aon:methodParam name="sfc_onNumberEditable" type="actionListener"
		default="#{controller.onNumberEditable}" />

	<c:if test="#{!skipSeriesLabel}">
		<aon:outputLabel for="#{sfc_aliasPreffix}_number" value="#{sfc_label}" />
	</c:if>
	<aon:div id="#{sfc_div}">
		<a4j:region>
			<c:if test="#{sfc_editable}">
				<c:if test="#{sfc_seriesValid and (sfc_seriesCodesLength > 0)}">
					<aon:selectOneMenu id="#{sfc_aliasPreffix}_number-Series" 
						value="#{sfc_seriesProperty}" required="#{sfc_seriesRequired}"
						disabled="#{sfc_disabled}"
						valueChangeListener="#{sfc_onSeriesChanged}"
						reRender="#{sfc_aliasPreffix}_number-Series,#{sfc_aliasPreffix}_numberDiv#{(seriesChangedReRender != null)?',':''}#{seriesChangedReRender}">
						<c:if test="#{(!sfc_seriesRequired or (sfc_seriesCodesLength > 1)) and (sfc_seriesProperty==null)}">
							<f:selectItem itemLabel=" - " itemValue="#{null}" />
						</c:if>
						<f:selectItems value="#{sfc_seriesCodes}" />
					</aon:selectOneMenu>
				</c:if>
				<c:if test="#{!sfc_seriesValid}">
					<aon:inputText id="#{sfc_aliasPreffix}_number-Series"
						value="#{sfc_seriesProperty}" size="5" maxlength="5" />
				</c:if>			
				<c:if test="#{!skipNumberInput}">
					<aon:div id="#{sfc_aliasPreffix}_numberDiv"
						layout="inline" styleClass="aon-margin-left">
						<c:if test="#{sfc_numberEditable or (sfc_numberProperty != 0)}">
							<aon:inputText id="#{sfc_aliasPreffix}_number"
								value="#{sfc_numberProperty}"
								required="true" size="6" maxlength="10"
								disabled="#{!sfc_numberEditable or sfc_disabled}"
								reRender="#{sfc_aliasPreffix}_number" />
						</c:if>
						<c:if test="#{!sfc_numberEditable and (sfc_numberProperty == 0)}">
							<aon:inputText id="#{sfc_aliasPreffix}_number"
								value=" &lt;Auto&gt;"
								size="6" maxlength="10" disabled="true" />
						</c:if>
					</aon:div>
					<aon:commandLink styleClass="aon-icon-edit-end-simple aon-margin-right"
					 	style="margin-left: 5px; padding-right: 12px;"
						value="&#160;" title="#{bundle.aon_cancel} #{bundle.aon_editing}"
						reRender="#{sfc_div}"
						rendered="#{sfc_numberEditable}" ajaxSingle="true" >
						<c:if test="#{sfc_numberReset}">
							<f:setPropertyActionListener
								target="#{sfc_numberProperty}" value="#{0}" />
						</c:if>
						<f:setPropertyActionListener
							target="#{sfc_numberEditable}" value="#{false}" />
					</aon:commandLink>
					<aon:commandLink styleClass="aon-icon-edit-add-simple aon-margin-right"
					 	style="margin-left: 5px; padding-right: 12px;"
						value="&#160;" title="#{bundle.aon_edit}"
						reRender="#{sfc_div}"
						focus="#{sfc_aliasPreffix}_number"
						actionListener="#{sfc_onNumberEditable}"
						rendered="#{!sfc_numberEditable}" ajaxSingle="true" >
						<f:setPropertyActionListener
							target="#{sfc_numberEditable}" value="#{true}" />
					</aon:commandLink>
				</c:if>
			</c:if>
			<aon:outputText styleClass="aon-bold aon-margin-right"
				value="#{controller.to.referenceCode}"
				rendered="#{!sfc_editable}" />
				
		</a4j:region>			

		<ui:insert name="additionalSeriesContent"/>				
				
	</aon:div>

</ui:composition>
