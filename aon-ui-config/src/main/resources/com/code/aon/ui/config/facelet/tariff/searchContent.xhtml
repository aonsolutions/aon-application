<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html">

	<aon:outputText value="" />
	<aon:div styleClass="aon-search-content-width">
		<aon:panelCollapsible expanded="true" label="#{bundle.report_tariff}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd,tbl-tab-search-even">
					
				<aon:outputLabel for="Tariff_code"
					value="#{bundle.aon_id}" />
				<aon:inputText id="Tariff_code" size="32"
					valueChangeListener="#{controller.addExpression}" />

				<aon:outputLabel for="Tariff_name"
					value="#{bundle.aon_description}" />
				<aon:inputText id="Tariff_name" size="32"
					valueChangeListener="#{controller.addExpression}" />
				
				<aon:outputLabel for="Tariff_purchase"
					value="#{bundle.aon_type}" />
				<aon:selectOneRadio id="Tariff_purchase"
					valueChangeListener="#{controller.addExpression}">
					<f:selectItem itemLabel="#{bundle.aon_sales}" itemValue="#{false}" />
					<f:selectItem itemLabel="#{bundle.aon_purchases}" itemValue="#{true}" />
				</aon:selectOneRadio>

			</aon:panelGrid>
		</aon:panelCollapsible>					

		<aon:panelCollapsible expanded="false" label="#{bundle.product_catalogue_module}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">

				<aon:outputText for="Tariff_catalogues_catalogue"
					value="#{bundle.aon_value}" />
				<aon:selectOneMenu id="Tariff_catalogues_catalogue"
					value="#{searchController.catalogue}">
					<f:selectItem itemLabel="-" value="#{null}" />
					<f:selectItems value="#{configCollections.allCatalogues}" />
				</aon:selectOneMenu>

			</aon:panelGrid>
		</aon:panelCollapsible>

		<aon:panelCollapsible expanded="false" label="#{bundle.aon_addInfo}">
			<aon:panelGrid columns="2" columnClasses="tbl-tab-search-odd aon-vertical-align-top,tbl-tab-search-even">

				<aon:outputText value="#{bundle.aon_date}" />
				<aon:div>
					<aon:outputLabel for="Tariff_addInfos_valueDate-From"
						styleClass="aon-form-date-label"
						value="#{bundle.aon_date_from}:" />
					<aon:selectInputDate id="Tariff_addInfos_valueDate-From"
						valueChangeListener="#{controller.addGreaterThanOrEqualExpression}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
			
					<aon:outputLabel for="Tariff_addInfos_valueDate-To"
						styleClass="aon-form-date-label"
						value="#{bundle.aon_date_to}:" />
					<aon:selectInputDate id="Tariff_addInfos_valueDate-To"
						valueChangeListener="#{controller.addLessThanOrEqualExpression}"
						popupDateFormat="#{bundle.aon_date_pattern}" />
				</aon:div>					

				<aon:outputText for="Tariff_addInfos_attribute"
					value="#{bundle.aon_parameter}" />
				<aon:inputText id="Tariff_addInfos_attribute"
					valueChangeListener="#{controller.addExpression}" size="25" />

				<aon:outputText for="Tariff_addInfos_value"
					value="#{bundle.aon_value}" />
				<aon:inputText id="Tariff_addInfos_value"
					valueChangeListener="#{controller.addExpression}" size="25" />

			</aon:panelGrid>
		</aon:panelCollapsible>
	</aon:div>

</ui:composition>
