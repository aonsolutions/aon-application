<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-textColumn"
				alias="Scope.description" >
				<f:facet name="header">
					<aon:outputLabel for="Scope_description" value="#{bundle.aon_scope}" />
				</f:facet>
				<aon:outputText value="#{to.description}" rendered="#{formList}" />
				<aon:inputText id="Scope_description"
					rendered="#{formEdit}" size="20" maxlength="16"
					value="#{controller.to.description}" required="true" />
				<f:facet name="footer">
					<aon:inputText id="Scope_description-New" 
						rendered="#{formNew}" size="20" maxlength="16"
						value="#{controller.to.description}" required="true" />
				</f:facet>
			</aon:column>

		</ui:define>
	</ui:decorate>

</ui:composition>
