<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
	
		<aon:componentGroup
			family="javax.faces.Command"
			method="#{aonRole.doNothing}">

			<aon:form id="userForm">
		
				<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/toolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{companyBundle.company_data_module}" />
					<ui:param name="toolbarDescription"	value="#{bundle.aon_editing}" />
					<ui:define name="toolbarContent">
						<aon:commandButton id="save" value="#{bundle.aon_accept}"
							styleClass="aon-finding-toolbar-item aon-icon-accept"
							action="logout" actionListener="#{changePassword.acceptPassword}"
							accesskey="#{bundle.aon_key_save}" >
							<aon:actionListener method="#{aonConfiguration.logout}" />
							<aon:actionHotKey key="return" />
						</aon:commandButton>						
					</ui:define>				
				</ui:decorate>			
		
				<aon:div styleClass="aon-scroll-area">
		
					<aon:div styleClass="aon-note aon-margin-bottom" style="width:580px;">
						<aon:div styleClass="aon-note-internal aon-icon-info aon-nowrap">
							<aon:div styleClass="aon-padding-left">
		                    	<aon:outputText value="#{configBundle.config_expired_password_label_1}" />
							</aon:div>
							<aon:div styleClass="aon-padding-left">
		                    	<aon:outputText value="#{configBundle.config_expired_password_label_2}" />
							</aon:div>
						</aon:div>
					</aon:div>
					
					<ui:include src="/com/code/aon/ui/config/facelet/changePassword/formContent.xhtml" />
		
				</aon:div>
		
			</aon:form>
			
		</aon:componentGroup>
		
	</ui:define>

</ui:composition>
