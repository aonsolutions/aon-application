<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:column alias="Domain.name" styleClass="aon-editDataTable-textColumn aon-width-200">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_name}" />
		</f:facet>
		<aon:outputText value="#{to.name}" />
	</aon:column>

	<aon:column alias="Domain.description" styleClass="aon-editDataTable-textColumn aon-width-auto">
		<f:facet name="header">
			<aon:outputText value="#{bundle.aon_description}" />
		</f:facet>
		<aon:outputText value="#{to.description}" />
	</aon:column>

	<aon:column alias="Domain.type" styleClass="aon-editDataTable-textColumn aon-width-80">
		<f:facet name="header">
			<aon:outputText value="#{bundle.admin_domain_type}" />
		</f:facet>							
		<aon:outputText value="#{to.type}" />
		<aon:div styleClass="aon-margin-left" layout="inline">
			<aon:outputText value="&#160;"
				rendered="#{to.domainManagement}"
				title="#{bundle.admin_domain_domainManagement}"
				styleClass="aon-icon2 aon-icon-tree-root" />
			<aon:outputText value="&#160;"
				rendered="#{(to.parent != null) and to.enableHeredity}"
				title="#{bundle.aon_domian_enableHeredity}"
				styleClass="aon-icon2 aon-icon-index" />														
			<aon:outputText value="&#160;"
				rendered="#{(to.parent != null) and (!to.enableHeredity)}"
				title="#{bundle.aon_domian_disableHeredity}"
				styleClass="aon-icon2 aon-icon-disableHeredity" />																	
		</aon:div>																		
	</aon:column>
							
</ui:composition>
