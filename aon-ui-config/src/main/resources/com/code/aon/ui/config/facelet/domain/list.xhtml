<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.main.xhtml">

	<ui:define name="mainContent">
		<aon:form id="domainList">

			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml">
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="skipResetButton" value="true" />
				<ui:param name="toolbarTitle" value="#{configBundle.config_domain_module}" />
				<ui:param name="controller" value="#{domainSwitcher}" />
				<ui:define name="additionalToolbarContent">
					<aon:commandButton id="#{toolbarID}-back"
						title="#{bundle.aon_key_cancel_accelerator}"
						value="#{bundle.aon_back}" rendered="#{!formNew}" immediate="true"
						styleClass="aon-finding-toolbar-item aon-icon-cancel"
						action="index" accesskey="#{bundle.aon_key_cancel}" />
				</ui:define>
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:methodParam name="rowSelectorAction" value="index" />
				<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
					<ui:param name="controller" value="#{domainSwitcher}" />
					<ui:param name="rows" value="20" />
					
					<ui:define name="columns">
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-200">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_domain}" />
							</f:facet>
							<aon:outputText value="#{to.name}" />
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel value="#{bundle.aon_name}" />
							</f:facet>
							<aon:outputText value="#{to.description}" />
						</aon:column>
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
