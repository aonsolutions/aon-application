<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="bankList">
			<ui:include
				src="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
				<ui:param name="toolbarTitle" value="#{bundle.config_paymethodTypeDetail_module}" />
				<ui:param name="controller" value="#{paymethodTypeDetail}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="controller" value="#{paymethodTypeDetail}" />
					<ui:param name="columnClasses" value="aon-editDataTable-text,aon-editDataTable-text" />

					<ui:define name="columns">

						<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
							<f:facet name="header">
								<aon:outputLabel for="PayMethodTypeDetail_type" value="#{bundle.aon_type}" />
							</f:facet>
							<aon:outputText value="#{to.type}" rendered="#{formList}" />
							<aon:selectOneMenu id="PayMethodTypeDetail_type" rendered="#{formEdit}"
								required="true" value="#{controller.to.type}">
								<f:selectItems value="#{configCollections.payMethodTypeForDetails}" />
							</aon:selectOneMenu>
							<f:facet name="footer">
								<aon:selectOneMenu id="PayMethodTypeDetail_type-New" rendered="#{formNew}"
									required="true" value="#{controller.to.type}">
								<f:selectItems value="#{configCollections.payMethodTypeForDetails}" />
								</aon:selectOneMenu>
							</f:facet>
						</aon:column>
			
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-350">
							<f:facet name="header">
								<aon:outputLabel for="PayMethodTypeDetail_description" value="#{bundle.aon_description}" />
							</f:facet>
							<aon:outputText value="#{to.description}" rendered="#{formList}" />
							<aon:inputText id="PayMethodTypeDetail_description" rendered="#{formEdit}" required="true" 
								size="40" value="#{controller.to.description}"/>
							<f:facet name="footer">
								<aon:inputText id="PayMethodTypeDetail_description-NEW" rendered="#{formNew}" required="true" 
									size="40" value="#{controller.to.description}"/>
							</f:facet>
						</aon:column>
						
						<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
							<f:facet name="header">
								<aon:outputLabel for="Account_id" value="#{bundle.account_account}" />
							</f:facet>
							<aon:outputText value="#{to.account.fullDescription}" rendered="#{formList}"/>
							<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
								<ui:param name="lookupTo" value="#{controller.to.account}" />
								<ui:param name="lookupRendered" value="#{formEdit}" />
								<ui:param name="idRequired" value="#{true}" />
							</ui:include>
							<f:facet name="footer">
								<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml" >
								<ui:param name="lookupTo" value="#{controller.to.account}" />
								<ui:param name="lookupSuffix" value="-New" />
								<ui:param name="lookupRendered" value="#{formNew}" />
								<ui:param name="idRequired" value="#{true}" />
								</ui:include>
							</f:facet>
						</aon:column>
						
					</ui:define>
				</ui:decorate>
			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{accountLookup}" />
	</ui:define>

</ui:composition>
