<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<a4j:region>
		<aon:panelCollapsible 
			label="#{bundle.aon_search_info}"
			headerClass="aon-panelGrid-search-info" 
			bodyClass="aon-panelGrid-search"				
			value="#{seriesListener.showFilterPanel}" >

			<aon:panelGrid columns="2">		

				<aon:outputText for="Series_active"
					value="#{bundle.aon_status}"/>
				<aon:selectManyCheckbox id="Series_active"
					value="#{seriesListener.statuses}">
					<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="true" />
					<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="false" />
				</aon:selectManyCheckbox>				

				<aon:outputLabel for="Series_scope_id"
					value="#{bundle.aon_scope}" />
				<aon:selectOneMenu id="Series_scope_id"
					value="#{seriesListener.scope}">
					<f:selectItem itemLabel="-" value="#{null}"/> 
					<f:selectItems value="#{configCollections.currentUserScopes}" />
				</aon:selectOneMenu>
					
				<aon:outputText value="" />
				<aon:commandButton id="search"
					title="#{bundle.aon_key_search_accelerator}"
					value="#{bundle.aon_search}" status="aonStatus"
					styleClass="aon-icon-rubber aon-search-lookup-button"
					actionListener="#{seriesListener.onFilter}"
					requestDelay="100" accesskey="#{bundle.aon_key_search}" >
				</aon:commandButton> 

			</aon:panelGrid>
		</aon:panelCollapsible>
	</a4j:region>

</ui:composition>
