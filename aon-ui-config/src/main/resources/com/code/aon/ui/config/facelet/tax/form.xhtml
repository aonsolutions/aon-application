<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">
		<aon:form id="taxForm">
			<ui:decorate
				template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml">
				<ui:param name="skipSearchButton" value="true" />
				<ui:param name="toolbarTitle" value="#{bundle.config_tax_module}" />
				<ui:param name="controller" value="#{tax}" />
				<ui:define name="beforeSpinToolbarContent">				
					<ui:include
						src="/com/code/aon/ui/common/facelet/auditable/toolbarContent.xhtml" />											
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">
				<aon:panelGrid id="dataTable" columns="6" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140
						,aon-panelGrid-even aon-width-200
						,aon-panelGrid-odd aon-width-140
						,aon-panelGrid-even aon-width-200
						,aon-panelGrid-odd aon-width-140
						,aon-panelGrid-even aon-width-auto">

					<aon:outputLabel for="Tax_name"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Tax_name" 
						value="#{tax.to.name}" required="true"
						size="25" maxlength="30" />
 
					<aon:outputLabel for="Tax_type" 
						value="#{bundle.config_tax}" />
					<aon:selectOneMenu id="Tax_type"
						value="#{tax.to.type}" required="true"
						reRender="Tax_type_label,Tax_type_value,Tax_surcharge">
						<f:selectItems value="#{configCollections.taxTypes}" />
					</aon:selectOneMenu>

					<aon:div id="Tax_type_label">
						<aon:outputLabel for="Tax_vatDeductionType" 
							value="#{bundle.aon_type}"
							rendered="#{tax.to.vat}" />
						<aon:outputLabel for="Tax_withholdingType" 
							value="#{bundle.aon_type}"
							rendered="#{tax.to.retention}" />
						<aon:outputText value="&#160;"
							rendered="#{!tax.to.vat and !tax.to.retention}" />
					</aon:div>
					<aon:div id="Tax_type_value">
						<aon:selectOneMenu id="Tax_vatDeductionType"
							value="#{tax.to.vatDeductionType}" required="true"
							rendered="#{tax.to.vat}">
							<f:selectItems value="#{configCollections.vatDeductionTypes}" />
						</aon:selectOneMenu>
						<aon:selectOneMenu id="Tax_withholdingType"
							style="width: 150px;"
							value="#{tax.to.withholdingType}" required="true"
							rendered="#{tax.to.retention}">
							<f:selectItems value="#{configCollections.withholdingTypes}" />
						</aon:selectOneMenu>
					</aon:div>

					<aon:outputLabel for="Tax_startDate" 
						value="#{bundle.aon_start_date}" />
					<aon:selectInputDate id="Tax_startDate"
						value="#{tax.to.startDate}" required="true"
						timeZone="#{timeZoneController.timeZone}"
						popupDateFormat="#{bundle.aon_date_pattern}"/>

					<aon:outputLabel for="Tax_percentage" 
						value="#{bundle.aon_percentage}" />
					<aon:inputText id="Tax_percentage" size="6"
						value="#{tax.to.percentage}" required="true" />

					<aon:outputLabel for="Tax_surcharge" 
						value="#{bundle.aon_surcharge}" />
					<aon:inputText id="Tax_surcharge" size="6"
						value="#{tax.to.surcharge}" required="true"
						disabled="#{!tax.to.vat}" />
				</aon:panelGrid>
				
				<aon:panelGrid columns="2" style="width: 100%;"
					columnClasses="aon-panelGrid-odd aon-width-140
						,aon-panelGrid-even aon-width-auto">

					<aon:if test="#{aonRole.accountingOperator}">
						<aon:outputLabel for="Account_id-Sales" value="#{bundle.aon_sales_account}" />
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
							<ui:param name="lookupTo" value="#{tax.to.salesAccount}" />
							<ui:param name="lookupSuffix" value="-Sales" />
						</ui:include>

						<aon:outputLabel for="Account_id-Purchase" value="#{bundle.aon_purchase_account}" />
						<ui:include src="/com/code/aon/ui/account/facelet/account/lookup.xhtml">
							<ui:param name="lookupTo" value="#{tax.to.purchaseAccount}" />
							<ui:param name="lookupSuffix" value="-Purchase" />
						</ui:include>
						
					</aon:if>

				</aon:panelGrid>
			</aon:div>
				
			<aon:div id="taxDetailTable" styleClass="aon-scroll-area" rendered="#{!tax.nevv}">	
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
					<ui:param name="controller" value="#{taxDetail}" />
					<ui:param name="skipResetButton" value="true" />
					<ui:param name="skipLineEdition" value="#{true}" />
					<ui:param name="columnClasses"
						value="aon-editDataTable-textColumn aon-width-200" />
					<ui:define name="beginFormListContent">
						<aon:commandLink id="#{dataTableId}-selectButton"
							styleClass="aon-table-row-link" value="&#160;"
							immediate="true" ajaxSingle="true" requestDelay="100"
							actionListener="#{taxDetail.onSelect}"
							onkeyup="#{dataTableId}KeyUp(this)"
							onfocus="#{dataTableId}SelectRow(this)"
							onblur="#{dataTableId}DeselectRow(this)"
							focus="#{(focusOnSelect != null)?(focusOnSelect):''}">
						</aon:commandLink>
					</ui:define>

					<ui:define name="columns">
	
						<aon:column>
							<f:facet name="header">
								<aon:outputText for="TaxDetail_startDate" value="#{bundle.aon_date_from}" />
							</f:facet>
							<aon:outputText value="#{to.startDate}" rendered="#{to!=taxDetail.to}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate id="TaxDetail_startDate"
								value="#{taxDetail.to.startDate}" rendered="#{to==taxDetail.to}"
								required="#{true}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
							<f:facet name="footer">
								<aon:selectInputDate id="TaxDetail_startDate-New"
									rendered="#{taxDetail.nevv}" value="#{taxDetail.to.startDate}"
									required="#{true}"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}"/>
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputText for="TaxDetail_endDate" value="#{bundle.aon_date_to}" />
							</f:facet>
							<aon:outputText value="#{to.endDate}" rendered="#{to!=taxDetail.to}" >
								<f:convertDateTime pattern="#{bundle.aon_date_pattern}"
									timeZone="#{timeZoneController.timeZoneId}" />
							</aon:outputText>
							<aon:selectInputDate id="TaxDetail_endDate"
								value="#{taxDetail.to.endDate}" rendered="#{to==taxDetail.to}"
								required="#{true}"
								timeZone="#{timeZoneController.timeZone}"
								popupDateFormat="#{bundle.aon_date_pattern}"/>
							<f:facet name="footer">
								<aon:selectInputDate id="TaxDetail_endDate-New"
									rendered="#{taxDetail.nevv}" value="#{taxDetail.to.endDate}"
									required="#{true}"
									timeZone="#{timeZoneController.timeZone}"
									popupDateFormat="#{bundle.aon_date_pattern}"/>
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputLabel for="TaxDetail_value" value="#{bundle.aon_percentage}" />
							</f:facet>
							<aon:outputText value="#{to.value}"
								rendered="#{to!=taxDetail.to}" />
							<aon:inputText id="TaxDetail_value" rendered="#{to==taxDetail.to}" size="6"
								value="#{taxDetail.to.value}" required="true" />
							<f:facet name="footer">
								<aon:inputText id="TaxDetail_value-New" rendered="#{taxDetail.nevv}" size="6"
									value="#{taxDetail.to.value}" required="true" />
							</f:facet>
						</aon:column>
						
						<aon:column>
							<f:facet name="header">
								<aon:outputLabel for="TaxDetail_surcharge" value="#{bundle.aon_surcharge}" />
							</f:facet>
							<aon:outputText value="#{to.surcharge}"
								rendered="#{to!=taxDetail.to}" />
							<aon:inputText id="TaxDetail_surcharge" rendered="#{to==taxDetail.to}" size="6"
								value="#{taxDetail.to.surcharge}" required="true" />
							<f:facet name="footer">
								<aon:inputText id="TaxDetail_surcharge-New" rendered="#{taxDetail.nevv}" size="6"
									value="#{taxDetail.to.surcharge}" required="true" />
							</f:facet>
						</aon:column>

					</ui:define>

					<ui:define name="endFormListContent">
						<aon:div>
							<ui:include src="/com/code/aon/ui/common/facelet/auditable/toolTipAuditInfo.xhtml">
								<ui:param name="auditableTO" value="#{to}" />
							</ui:include>
						</aon:div>
					</ui:define>

				</ui:decorate>

			</aon:div>
		</aon:form>
		<aon:lookupButtonPopup lookup="#{accountLookup}" />
		<ui:include src="/com/code/aon/ui/common/facelet/auditable/modalAuditInfo.xhtml">
			<ui:param name="auditableController" value="#{tax}" />
		</ui:include>
	</ui:define>
</ui:composition>
