<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="cnaeList">

			<aon:div ajaxRendered="true" layout="none">
				<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/listToolbar.xhtml" >
					<ui:param name="toolbarTitle" value="#{bundle.config_cnae_module}" />
					<ui:param name="controller" value="#{cnae}" />
					<ui:param name="skipResetButton" value="true" />
					<ui:param name="skipSearchButton" value="true" />
				</ui:include>			

				<!--  aon-region-body -->
				<aon:div styleClass="aon-scroll-area">
				
					<aon:div styleClass="aon-panelGrid-search aon-margin-bottom">
						<aon:div styleClass="aon-panelGrid-search-info">
							<aon:outputText value="#{bundle.aon_filter}" styleClass="aon-panelGrid-search-info-internal"/>
						</aon:div>
						<aon:panelGrid columns="1">
							<aon:inputText id="cnaeFilter" size="150" value="#{cnae.filter}">
								<a4j:support 
									event="onkeyup"
									reRender="cnaeTableContainer"
									eventsQueue="cnaeFilterKeyUp"
									requestDelay="500"
									ajaxSingle="true"
									ignoreDupResponses="true"
									limitToList="true"/>
							</aon:inputText>
						</aon:panelGrid>	
					</aon:div>
	
					<aon:div id="cnaeTableContainer">
						<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml" >
							<ui:param name="controller" value="#{cnae}" />
							<ui:param name="skipSelectButton" value="true" />
							<ui:define name="columns">
								<aon:column styleClass="aon-editDataTable-textColumn aon-width-100">
									<f:facet name="header">
										<aon:outputLabel 
											value="#{bundle.aon_id}" />
									</f:facet>
									<aon:outputText value="#{to.code}"  />
								</aon:column>
		
								<aon:column styleClass="aon-editDataTable-textColumn">
									<f:facet name="header">
										<aon:outputLabel 
											value="#{bundle.aon_description}" />
									</f:facet>
									<aon:outputText value="#{to.title}" />
								</aon:column>
							</ui:define>
						</ui:decorate>
					</aon:div>

				</aon:div>
			</aon:div>
		</aon:form>
	</ui:define>

</ui:composition>
