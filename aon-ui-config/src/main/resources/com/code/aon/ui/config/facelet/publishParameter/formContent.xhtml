<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:outputLabel for="FtpServer"
		value="#{configBundle.config_ftp_server}" />
	<aon:inputText id="FtpServer" value="#{publishParameter.to.ftpServer}"
		size="60" required="true" />

	<aon:outputLabel for="FtpUser"
		value="#{bundle.aon_login}" />
	<aon:inputText id="FtpUser" value="#{publishParameter.to.ftpUser}"
		size="20" required="true" />

	<aon:outputLabel for="FtpPassword"
		value="#{bundle.aon_login_passwd}" />
	<aon:inputText id="FtpPassword" value="#{publishParameter.to.ftpPassword}"
		size="20" required="true" />

	<c:if test="#{!publishParameter.showOnlyFTP}">
		<aon:outputLabel for="PreviewPath"
			value="#{configBundle.config_preview_path}" />
		<aon:inputText id="PreviewPath" value="#{publishParameter.to.previewPath}"
			size="60" required="true" />
	
		<aon:outputLabel for="PreviewURL"
			value="#{configBundle.config_preview_url}" />
		<aon:inputText id="PreviewURL" value="#{publishParameter.to.previewURL}"
			size="60" required="true" />
	</c:if>

	<aon:outputLabel for="PublishPath"
		value="#{configBundle.config_publish_path}" />
	<aon:inputText id="PublishPath" value="#{publishParameter.to.publishPath}"
		size="60" required="true" />

	<c:if test="#{!publishParameter.showOnlyFTP}">
		<aon:outputLabel for="PublishURL"
			value="#{configBundle.config_pubish_url}" />
		<aon:inputText id="PublishURL" value="#{publishParameter.to.publishURL}"
			size="60" required="true" />
	</c:if>

</ui:composition>
