<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
			
		
	<h:panelGrid columns="2" styleClass="aon-width-all aon-padding-bottom"
		columnClasses="aon-float-left,aon-float-right">		
		<aon:panelGroup  >
			<c:if test="#{domainSwitcher.adminDomain or !userUtils.newAONTheme }" >
			<aon:outputText styleClass="aon-margin-right aon-bold" value="#{bundle.aon_filter}:" />
			<aon:inputText id="domainFilter" size="90" styleClass="aon-input-search" value="#{domainSwitcher.filter}" >
				<a4j:support 
					event="onkeyup"
					reRender="domainSwitcherTableContainer"
					eventsQueue="domainSwitcherFilterKeyUp"
					requestDelay="500"
					ajaxSingle="true"
					ignoreDupResponses="true"
					limitToList="true"/>
			</aon:inputText>
			</c:if>
		</aon:panelGroup>
		<aon:panelGroup>
				<aon:commandLink id="domainBooking"
					actionListener="#{domainBooking.onInit}" action="domainBooking_list">
					<aon:outputText value="#{bundle.config_domain_booking}"
						style="padding-bottom: 1px;padding-top: 1px;"
						styleClass="aon-portlet-title-text aon-icon aon-button-goto"/>
					<f:setPropertyActionListener target="#{domainBooking.backAction}"
						value="#{null}"/>						
				</aon:commandLink>
		</aon:panelGroup>
		
	</h:panelGrid>
	<aon:div id="domainSwitcherTableContainer" styleClass="aon-width-all">
		<aon:methodParam name="rowSelectorAction" value="start" />
		<aon:methodParam name="rowSelectorActionListener" value="#{domains.onSelectChildDomain}" type="actionListener" />
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
			<ui:param name="rows" value="10" />
			<ui:param name="controller" value="#{domainSwitcher}" />
			<ui:param name="skipFocusFirst" value="true" />
			<ui:param name="showAonPaginator" value="true" />
			<ui:define name="columns">
				<aon:column styleClass="aon-width-30">
					<c:set var="heredity" value="#{to.enableHeredity ? bundle.aon_domian_enableHeredity : bundle.aon_domian_disableHeredity}"/>
					<aon:outputText 
						rendered="#{!to.active}"
						title="#{bundle.admin_domain_inactive}"
						styleClass="material-icons  aon-vertical-middle aon-gray" value="domain_disabled" />														
					<aon:outputText 
						rendered="#{to.active and to.office}"
						title="#{heredity}"
						styleClass="material-icons  aon-vertical-middle aon-gray" value="work" />
					<aon:outputText 
						rendered="#{to.active and to.consultancy}"
						title="#{heredity}"
						styleClass="material-icons  aon-vertical-middle aon-gray" value="apartment" />
					<aon:outputText 
						rendered="#{to.active and !to.office and !to.consultancy}"
						title="#{heredity}"
						styleClass="material-icons  aon-vertical-middle aon-gray" value="domain" 
					/>
				</aon:column>
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputText value="EMPRESAS" />
					</f:facet>							
					<aon:outputText value="#{to.description}"
						title="#{(!to.active)?bundle.admin_domain_inactive:''}#{(to.expired)?bundle.admin_domain_expired:''}"
					/>
					<br/>
					<aon:outputText value="#{( empty to.document)? 'SIN IDENTIFCACIÓN':to.document }"
						title="#{(!to.active)?bundle.admin_domain_inactive:''}#{(to.expired)?bundle.admin_domain_expired:''}"
						style="color:gray"/>
										
				</aon:column>

				<aon:column styleClass="aon-width-30">
					<aon:outputText 
						rendered="#{to.enableHeredity}"
						title="#{bundle.aon_domian_enableHeredity}"
						styleClass="material-icons  aon-vertical-middle aon-gray" value="arrow_upward" />
				</aon:column>

				<aon:column styleClass="aon-width-40">
					<aon:div onmouseover="disableRowSelector();" onmouseup="disableRowSelector();"
						onmouseout="enableRowSelector();" layout="inline" >										
						<h:outputLink 
							value="https://#{domainSwitcher.currentDomainURL}" target="_blank"
							title="https://#{to.name}"
							styleClass="aon-icon"
							style="background: url(#{aonResource.resolve['/images/aon-right-arrow.png']}) no-repeat scroll left center transparent; display: inline-block; height: 21px;vertical-align: middle;}" >
						</h:outputLink>
					</aon:div>
				</aon:column>
			</ui:define>
		</ui:decorate>
	</aon:div>

</ui:composition>
