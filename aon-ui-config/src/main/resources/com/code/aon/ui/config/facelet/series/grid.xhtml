<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="seriesList">
			<aon:div ajaxRendered="true" layout="none">
				<ui:decorate
					template="/com/code/aon/ui/resources/facelet/toolbar/gridToolbar.xhtml">
					<ui:param name="toolbarTitle" value="#{configBundle.config_series_module}" />
					<ui:param name="controller" value="#{series}" />
				</ui:decorate>

				<aon:div styleClass="aon-scroll-area">
					<ui:decorate
						template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml">
						<ui:param name="controller" value="#{series}" />
						<ui:param name="columnClasses"
							value="aon-editDataTable-textColumn aon-width-80,
									aon-editDataTable-textColumn aon-width-150,
									aon-editDataTable-textColumn,
									aon-editDataTable-textColumn aon-width-150,
									aon-editDataTable-textColumn aon-width-60" />
						<ui:define name="columns">
							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_id}" />
								</f:facet>
								<aon:outputText value="#{to.id}" />
								<f:facet name="footer">
									<aon:inputText rendered="#{series.new}" size="7" maxlength="5"
										value="#{series.to.id}" required="#{true}" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_description}" />
								</f:facet>
								<aon:outputText rendered="#{to.id!=series.to.id}"
									value="#{to.description}" />
								<aon:inputText rendered="#{to.id==series.to.id}" size="40" maxlength="32" 
									value="#{series.to.description}" required="#{true}" />
								<f:facet name="footer">
									<aon:inputText rendered="#{series.new}" size="40" maxlength="32" 
										value="#{series.to.description}" required="#{true}" />
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{configBundle.config_series_workplace}" />
								</f:facet>
								<aon:outputText rendered="#{to.id!=series.to.id}"
									value="#{to.workPlace.description}" />
								<aon:selectOneMenu rendered="#{to.id==series.to.id}"
									value="#{series.to.workPlace}">
									<f:selectItems value="#{companyCollections.workPlaces}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu rendered="#{series.new}"
										value="#{series.to.workPlace}">
										<f:selectItems value="#{companyCollections.workPlaces}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_security_level}" />
								</f:facet>
								<aon:outputText rendered="#{to.id!=series.to.id}"
									value="#{to.securityLevel}" />
								<aon:selectOneMenu rendered="#{to.id==series.to.id}"
									value="#{series.to.securityLevel}">
									<f:selectItems value="#{commonCollections.securityLevels}" />
								</aon:selectOneMenu>
								<f:facet name="footer">
									<aon:selectOneMenu rendered="#{series.new}"
										value="#{series.to.securityLevel}">
										<f:selectItems value="#{commonCollections.securityLevels}" />
									</aon:selectOneMenu>
								</f:facet>
							</aon:column>

							<aon:column>
								<f:facet name="header">
									<aon:outputText value="#{configBundle.config_series_active}" />
								</f:facet>
								<aon:outputText rendered="#{to.id!=series.to.id}"
									value="&#160;&#160;&#160;&#160;&#160;"
									styleClass="#{to.active?'aon-icon-checked':'aon-icon-check'}" />
								<aon:selectBooleanCheckbox rendered="#{to.id==series.to.id}"
									value="#{series.to.active}" />
								<f:facet name="footer">
									<aon:selectBooleanCheckbox rendered="#{series.new}"
										value="#{series.to.active}">
									</aon:selectBooleanCheckbox>
								</f:facet>
							</aon:column>
						</ui:define>
					</ui:decorate>
				</aon:div>
			</aon:div>
		</aon:form>

	</ui:define>

</ui:composition>
