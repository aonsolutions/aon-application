<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
			
		
	<aon:div styleClass="aon-padding-bottom">
		<aon:outputText styleClass="aon-italic aon-margin-right aon-bold" value="#{bundle.aon_filter}:"/>
		<aon:inputText id="domainFilter" size="70" value="#{domainSwitcher.filter}">
			<a4j:support 
				event="onkeyup"
				reRender="domainSwitcherTableContainer"
				eventsQueue="domainSwitcherFilterKeyUp"
				requestDelay="500"
				ajaxSingle="true"
				ignoreDupResponses="true"
				limitToList="true"/>
		</aon:inputText>
		<aon:outputLabel for="Domains_showInactive"
			style="margin-left:3em;" styleClass="aon-italic aon-bold aon-margin-right" 
			value="#{bundle.admin_domain_show_inactive}" />
		<aon:selectBooleanCheckbox id="Domains_showInactive"
			value="#{domainSwitcher.showInactive}" >
			<a4j:support 
				event="onclick"
				reRender="domainSwitcherTableContainer"
				eventsQueue="domainSwitcherFilterKeyUp"
				actionListener="#{domainSwitcher.onChangeShowInactive}"
				requestDelay="500"
				ajaxSingle="true"
				ignoreDupResponses="true"
				limitToList="true"/>						
		</aon:selectBooleanCheckbox>															
	</aon:div>

	<aon:div id="domainSwitcherTableContainer" styleClass="aon-width-all">
		<aon:methodParam name="rowSelectorAction" value="start" />
		<aon:methodParam name="rowSelectorActionListener" value="#{domains.onSelectChildDomain}" type="actionListener" />
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
			<ui:param name="controller" value="#{domainSwitcher}" />
			<ui:param name="skipFocusFirst" value="true" />
			<ui:define name="columns">
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
					<f:facet name="header">
						<aon:outputText value="#{bundle.aon_name}" />
					</f:facet>							
					<aon:outputText value="#{to.description}" />
				</aon:column>
				<aon:column styleClass="aon-text-center aon-width-40 aon-nowrap">
					<f:facet name="header">
						<aon:outputText style="text-transform: none;"
							value="One" />
					</f:facet>							
					<aon:outputText rendered="#{!to.aonOne}" value="-" />
					<aon:outputText rendered="#{to.aonOne}"
						value="#{to.activeUsers} / #{to.maxDefinedUsers}" />
				</aon:column>
				<aon:column styleClass="aon-text-center aon-width-40 aon-nowrap">
					<f:facet name="header">
						<aon:outputText style="text-transform: none;"
							 value="AiO" />
					</f:facet>							
					<aon:outputText rendered="#{to.aonOne}" value="-" />
					<aon:outputText rendered="#{!to.aonOne}"
						value="#{to.activeUsers} / #{to.maxDefinedUsers}" />
				</aon:column>
				<aon:column styleClass="aon-editDataTable-iconColumn aon-text-center">
					<f:facet name="header">
						<aon:outputText value="Portal" />
					</f:facet>						
					<aon:outputText rendered="#{!to.portal}" value="-" />
					<aon:outputText value="&#160;"
						rendered="#{to.portal}" styleClass="aon-icon-check-black"
						style="padding-left:12px" />				
				</aon:column>
				<aon:column styleClass="aon-width-40">
					<aon:outputText value="&#160;"
						rendered="#{to.enableHeredity}"
						title="#{bundle.aon_domian_enableHeredity}"
						styleClass="aon-icon2 aon-icon-index" />														
					<aon:outputText value="&#160;"
						rendered="#{!to.enableHeredity}"
						title="#{bundle.aon_domian_disableHeredity}"
						styleClass="aon-icon2 aon-icon-disableHeredity" />
					<aon:div onmouseover="disableRowSelector();" onmouseup="disableRowSelector();"
						onmouseout="enableRowSelector();" layout="inline" >										
						<h:outputLink 
							value="http://#{domainSwitcher.currentDomainURL}" target="_blank"
							title="http://#{to.name}"
							styleClass="aon-icon aon-icon-globe" />
					</aon:div>
				</aon:column>
			</ui:define>
		</ui:decorate>
	</aon:div>

</ui:composition>
