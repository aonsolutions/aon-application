<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich">
			
		
	<aon:div styleClass="aon-padding-bottom">
		<aon:outputText styleClass="aon-italic aon-margin-right aon-bold" value="#{bundle.aon_filter}:"/>
		<aon:inputText id="domainFilter" size="80" value="#{domainSwitcher.filter}">
			<a4j:support 
				event="onkeyup"
				reRender="domainSwitcherTableContainer"
				eventsQueue="domainSwitcherFilterKeyUp"
				requestDelay="500"
				ajaxSingle="true"
				ignoreDupResponses="true"
				limitToList="true"/>
		</aon:inputText>
	</aon:div>

	<aon:div id="domainSwitcherTableContainer" styleClass="aon-width-all">
		<aon:methodParam name="rowSelectorAction" value="start" />
		<aon:methodParam name="rowSelectorActionListener" value="#{domains.onSelectChildDomain}" type="actionListener" />
		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/list.xhtml">
			<ui:param name="controller" value="#{domainSwitcher}" />
			<ui:param name="skipFocusFirst" value="true" />
			<ui:define name="columns">
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-auto">
					<aon:outputText value="#{to.description}" />
				</aon:column>
				<aon:column styleClass="aon-editDataTable-textColumn aon-width-200 aon-nowrap">
					<aon:div onmouseover="disableRowSelector();"
						onmouseup="disableRowSelector();"
						onmouseout="enableRowSelector();" >
						<aon:outputLink target="_blank" value="http://#{to.name}" >
							<aon:outputText style="#{customize.fontStyle}" value="http://#{to.name}">
								<aon:abbreviateConverter maxWidth="40" />
							</aon:outputText>
					    </aon:outputLink>
					</aon:div>
				</aon:column>
				<aon:column styleClass="aon-editDataTable-iconColumn">				
					<aon:outputText value="&#160;"
						rendered="#{to.enableHeredity}"
						title="#{bundle.aon_domian_enableHeredity}"
						styleClass="aon-icon2 aon-icon-index" />														
					<aon:outputText value="&#160;"
						rendered="#{!to.enableHeredity}"
						title="#{bundle.aon_domian_disableHeredity}"
						styleClass="aon-icon2 aon-icon-disableHeredity" />														
				</aon:column>
			</ui:define>
		</ui:decorate>
	</aon:div>

</ui:composition>
