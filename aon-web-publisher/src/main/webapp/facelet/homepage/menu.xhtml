<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/com/code/aon/ui/resources/facelet/shared/menu.xhtml">

	<ui:define name="afterMenuContent">
				
		<aon:commandLink id="fileManager" 
			title="#{richBundle.rich_fileManager}" action="fileManager_list" 
			value="#{richBundle.rich_fileManager}"
			styleClass="aon-top-menu-item aon-icon-utilities">
			<f:setPropertyActionListener value="#{publisher.previewPath}"
				target="#{fileManager.startDirectory}" />
			<aon:actionListener method="#{fileManager.onInit}" />						
		</aon:commandLink>

		<aon:commandLink id="publisher" 
			title="#{publisherBundle.publisher_production_module}" action="publisher" 
			value="#{publisherBundle.publisher_production_module}"
			styleClass="aon-top-menu-item aon-icon-config">
		</aon:commandLink>
				
	</ui:define>
	
</ui:composition>
