<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>		

	<ui:define name="content">

		<h:form id="feePrintForm" styleClass="aon-form">

			<t:div styleClass="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<t:commandButton id="search" value="#{bundle.aon_search}"
						actionListener="#{feePrint.onSearch}" action="fee_print_list"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-accept"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-accept'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-accept'" 
						accesskey="#{bundle.aon_key_search}"/>
					<h:commandButton id="clear" value="#{bundle.aon_clear}"
						type="reset"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-reset"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-reset'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-reset'" />
				</t:div>
				</t:div>
			</t:div>
			
			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
				<h:outputText value="#{bundle.aon_search_header}" />
				</t:div>
			</t:div>
			
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
						
							<h:outputLabel styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_fee_item}" />
							<h:panelGrid columns="4">
								<t:inputText id="Item_Lookup_product_code" size="5" forceId="#{true}"
									styleClass="aon-form-input-text"
									onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','itemLookup','Item_Lookup_product_code','Item_product_code|Item_Lookup_product_code,Item_id|Item_Lookup_id,Item_full_name|Item_full_name');" />
								<h:commandButton id="find_Item_Lookup_id"
									styleClass="aon-form-lookup-button" value="" immediate="true"
									onclick="lookupSearchWindow(this, 'placeList', '#{itemLookup.encodedSearchPagePath}','Item_product_code|Item_Lookup_product_code,Item_id|Item_Lookup_id,Item_full_name|Item_full_name');return false;" />
								<t:inputHidden id="Item_Lookup_id" forceId="#{true}"
									value="#{feePrint.itemId}"/>
								<t:inputText id="Item_full_name" forceId="#{true}"
									styleClass="aon-form-input-text" size="27"/>
							</h:panelGrid>
						
							<h:outputLabel styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_fee_billing_date}" />
							<h:panelGrid columns="4">
								<h:selectOneMenu value="#{feePrint.billingDateMonth}"
									styleClass="aon-form-selectOneMenu-field">
									<f:selectItem itemValue="" itemLabel="-" itemDisabled="#{true}"/>
									<f:selectItems value="#{salesCollections.months}" />
								</h:selectOneMenu>
								<t:div>
									<h:outputLabel for="BillingDate_Year-Edit"
										value="#{appBundle.aon_year}" />
									<h:inputText id="BillingDate_Year-Edit" required="true"
										styleClass="aon-form-input-text" size="5"
										value="#{feePrint.billingDateYear}" />
								</t:div>
							</h:panelGrid>
							
							<h:outputLabel for="Customer_status"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.finance_checking_customer_status}" />
							<h:selectOneMenu id="Customer_status"
								styleClass="aon-form-selectOneMenu-field"
								value="#{feePrint.customerStatus}">
								<f:selectItem itemValue="" itemLabel="-" itemDisabled="true" /> 
								<f:selectItems value="#{customerCollections.customerStatuses}" />
							</h:selectOneMenu>

					</h:panelGrid>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
