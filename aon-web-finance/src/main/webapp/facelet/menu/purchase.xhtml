<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="purchaseMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<aon:panelGrid columns="2" styleClass="aon-panelGrid-formatting"
					columnClasses="aon-portlets-column,aon-portlets-column">

					<aon:panelGroup>
						<aon:panel headerClass="aon-panel-title">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_purchase}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="supplier" 
										action="supplier_search" actionListener="#{supplier.onEditSearch}"
										value="#{supplierBundle.supplier_module}" >
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="creditor" 
										action="creditor_search" actionListener="#{creditor.onEditSearch}"
										value="#{financeBundle.finance_creditor_module}" >
									</aon:commandLink>
								</aon:div>						
							</aon:div>
						</aon:panel>

						<aon:panel headerClass="aon-panel-title">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_invoice}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="aon_invoice_management"
										action="purchaseInvoice_search"
										actionListener="#{purchaseInvoice.onEditSearch}"
										value="#{financeBundle.finance_purchase_invoice_management_module}" />
								</aon:div>
							</aon:div>
						</aon:panel>
					</aon:panelGroup>

					<aon:panel headerClass="aon-panel-title">
						<f:facet name="header">
							<aon:outputText value="#{bundle.aon_reports}" />
						</f:facet>
						<aon:div styleClass="aon-direct-access-list">
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink action="sales_accumulate_search" 
									value="#{statBundle.stat_menu_acumulado2}">
									<aon:actionListener method="#{stat.onReset}"/>
									<aon:actionListener method="#{stat.onPurchaseType}"/>
								</aon:commandLink>
							</aon:div>
						
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink action="category_stats_search" 
									value="#{statBundle.stat_menu_category}" >
									<aon:actionListener method="#{stat.onReset}"/>
									<aon:actionListener method="#{stat.onPurchaseType}"/>
								</aon:commandLink>
							</aon:div>

							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink action="summary_stats_search" 
									value="#{statBundle.stat_menu_summary}"  >
									<aon:actionListener method="#{stat.onReset}"/>
									<aon:actionListener method="#{stat.onPurchaseType}"/>
								</aon:commandLink>
							</aon:div>
							
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink action="abc_stats_search" 
									value="#{statBundle.stat_abc_supplier}" >
									<aon:actionListener method="#{stat.onReset}"/>
									<aon:actionListener method="#{stat.onPurchaseType}"/>
								</aon:commandLink>
							</aon:div>
							
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink action="abc_stats_searchProduct" 
									value="#{statBundle.stat_abc_product}" >
									<aon:actionListener method="#{stat.onReset}"/>
									<aon:actionListener method="#{stat.onPurchaseType}"/>
								</aon:commandLink>
							</aon:div>
							
							<aon:div styleClass="aon-direct-access-list-element">
								<aon:commandLink action="abc_stats_searchCategory" 
									value="#{statBundle.stat_abc_category}" >
									<aon:actionListener method="#{stat.onReset}"/>
									<aon:actionListener method="#{stat.onPurchaseType}"/>
								</aon:commandLink>
							</aon:div>
						</aon:div>
					</aon:panel>

				</aon:panelGrid>
				
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
