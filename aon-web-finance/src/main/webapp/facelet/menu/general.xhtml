<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j">

	<aon:panel headerClass="aon-panel-title">
		<f:facet name="header">
			<aon:outputText value="#{appBundle.menu_general}" />
		</f:facet>
		<aon:div styleClass="aon-direct-access-list">
			<aon:div styleClass="aon-direct-access-list-element">
				<aon:commandLink id="productCategory" 
					action="productCategory"
					value="#{productBundle.product_category_module}" />
			</aon:div>
			<aon:div styleClass="aon-direct-access-list-element">
				<aon:commandLink id="geotreeParent" 
					action="geotreeParent_list"	actionListener="#{geotreeParent.onSearch}"
					value="#{geozoneBundle.geozone_module}" />
			</aon:div>
			<aon:div styleClass="aon-direct-access-list-element">
				<aon:commandLink id="payMethod" 
					action="payMethod"
					value="#{configBundle.config_paymethod_module}" />
			</aon:div>
			<aon:div styleClass="aon-direct-access-list-element">
				<aon:commandLink id="bank" 
					action="bank"
					value="#{configBundle.config_bank_module}" />
			</aon:div>
		</aon:div>
	</aon:panel>

</ui:composition>
