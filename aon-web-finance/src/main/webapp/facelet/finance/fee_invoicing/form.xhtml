<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>

	<ui:define name="content">

		<h:form id="feeInvoicingForm">

			<t:div styleClass="aon-content-toolbar" id="aon-content-toolbar"
				forceId="#{true}">
				<t:div styleClass="aon-content-toolbar-internal">
					<t:div styleClass="aon-content-toolbar-item-group">
						<t:commandButton id="save" value="#{bundle.aon_save}"
							forceId="#{true}" actionListener="#{feeInvoicing.accept}"
							onclick="return (confirm('#{bundle.aon_save_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-save"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-save'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-save'"
							disabled="#{feeInvoicingDetail.to != null or feeInvoicing.recorded}"
							accesskey="#{bundle.aon_key_save}" />
						<t:commandButton id="cancel" value="#{bundle.aon_cancel}"
							forceId="#{true}" immediate="#{true}"
							action="fee_invoicing_list"
							actionListener="#{feeInvoicing.onCancel}"
							onclick="return (confirm('#{bundle.aon_cancel_confirm}'))"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-cancel"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-cancel'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-cancel'"
							disabled="#{feeInvoicingDetail.to != null}"
							accesskey="#{bundle.aon_key_cancel}" />
						<t:commandButton id="remove" value="#{bundle.aon_remove}"
							forceId="#{true}" immediate="#{true}"
							onclick="return (confirm('#{bundle.aon_remove_confirm}'))"
							action="fee_invoicing_list"
							actionListener="#{feeInvoicing.onRemove}"
							rendered="#{!feeInvoicing.new}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-delete"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-delete'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-delete'"
							disabled="#{!feeInvoicing.removable or feeInvoicing.recorded}"
							accesskey="#{bundle.aon_key_remove}" />
						<t:commandButton id="reset" value="#{bundle.aon_reset}"
							action="fee_invoicing_form"
							actionListener="#{feeInvoicing.onReset}" forceId="#{true}"
							immediate="#{true}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-reset"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-reset'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-reset'"
							disabled="#{feeInvoicingDetail.to != null}"
							accesskey="#{bundle.aon_key_new}" />
						<t:commandButton id="search" value="#{bundle.aon_search}"
							forceId="#{true}" immediate="#{true}"
							action="fee_invoicing_search"
							actionListener="#{feeInvoicing.onEditSearch}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-search"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-search'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-search'"
							disabled="#{feeInvoicingDetail.to != null}"
							accesskey="#{bundle.aon_key_search}" />
						<t:commandButton id="finances" value="#{financeBundle.finance_generate}"
							actionListener="#{feeInvoicing.generateFinances}"
							rendered="#{feeInvoicingDetail.model.rowCount > 0 and feeFinance.allPending}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'" />
						<t:commandButton id="record" value="#{financeBundle.to_record}"
							actionListener="#{feeInvoicing.onRecordInvoice}"
							rendered="#{feeInvoicingDetail.model.rowCount > 0 and !feeInvoicing.recorded}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'" />
						<t:commandButton id="unrecord" value="#{financeBundle.to_unrecord}"
							actionListener="#{feeInvoicing.onUnrecordInvoice}"
							rendered="#{feeInvoicing.recorded}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-new"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-new'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-new'" />
						<t:commandLink id="feeInvoicing" value="#{bundle.aon_report}" target="_new"
							forceId="#{true}" rendered="#{!feeInvoicing.new}"
							action="#{report.onExecute}"
							actionListener="#{feeInvoicing.onReport}"
							styleClass="aon-content-toolbar-item aon-content-toolbar-item-print"
							onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-print'"
							onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-print'"
							disabled="#{feeInvoicingDetail.to != null}"
							accesskey="#{bundle.aon_key_print}" />
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
					<h:outputText
						value="#{feeInvoicing.new?(bundle.aon_reset):(bundle.aon_editing)}" />
				</t:div>
			</t:div>
			<t:div id="aon-scroll-area" forceId="#{true}">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2">
						<h:panelGrid columns="4" cellpadding="0" cellspacing="0"
							styleClass="aon-form-table"
							columnClasses="aon-form-table-column-odd,aon-form-table-column-even,aon-form-table-column-odd,aon-form-table-column-even">

							<h:outputLabel for="Invoice_series"
								styleClass="aon-form-input-text-label"
								value="#{financeBundle.aon_series_number}" />
							<h:panelGrid columns="2" cellpadding="0" cellspacing="0">
								<t:selectOneMenu id="Invoice_series-New"
									value="#{feeInvoicing.to.series}"
									rendered="#{feeInvoicing.new}"
									styleClass="aon-form-selectOneMenu-field"
									onchange="submit();" valueChangeListener="#{feeInvoicing.onSeriesChanged}">
									<f:selectItem itemValue="" itemLabel=" " />
									<f:selectItems value="#{configCollections.series}" />
								</t:selectOneMenu>
								<t:inputText id="Invoice_series-Edit" forceId="#{true}"
									value="#{feeInvoicing.to.series}"
									rendered="#{!feeInvoicing.new}" disabled="#{true}"
									styleClass="aon-form-input-text" size="4" />
								<t:inputText id="Invoice_number" forceId="#{true}"
									value="#{feeInvoicing.to.number}" disabled="#{!feeInvoicing.new}"
									styleClass="aon-form-input-text" required="true" size="7" />
							</h:panelGrid>

							<h:outputLabel for="Invoice_issueDate"
								value="#{financeBundle.aon_date}"
								styleClass="aon-form-input-text-label " />
							<t:inputCalendar id="Invoice_issueDate" size="10"
								required="#{true}" forceId="#{true}"
								value="#{feeInvoicing.to.issueDate}" disabled="#{feeInvoicing.recorded}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />

							<t:outputLabel for="Customer_Lookup_id" value="#{customerBundle.customer_customer}" 
								styleClass="aon-form-input-text-label" />
							<t:div>
								<t:inputText id="Customer_Lookup_id" forceId="#{true}"
									styleClass="aon-form-input-text" size="5" 
									onchange="return findBeanLookupAndSubmitExt(this.form, event,'#{facesContext.externalContext.requestContextPath}','customerLookup','Customer_Lookup_id','Customer_id|Customer_Lookup_id,Customer_registry_document|Customer_Lookup_registry_document,Customer_full_name|Customer_full_name');"
									value="#{feeInvoicing.to.registry.id}"
									disabled="#{feeInvoicing.recorded}"
									valueChangeListener="#{feeInvoicing.customerData}" />
								<h:commandButton id="find_Customer_Lookup_id"
									styleClass="aon-form-lookup-button" value="" immediate="true"
									disabled="#{feeInvoicing.recorded}"
									onclick="lookupSearchWindow(this, 'placeList', '#{customerLookup.encodedSearchPagePath}','Customer_id|Customer_Lookup_id,Customer_registry_document|Customer_Lookup_registry_document,Customer_full_name|Customer_full_name');return false;" />	
								<t:inputText id="Customer_full_name" forceId="#{true}"
									value="#{feeInvoicing.to.registryName}"
									disabled="#{feeInvoicing.recorded}"
									styleClass="aon-form-input-text" size="40" />
							</t:div>

							<h:outputLabel for="Customer_Lookup_registry_document"
								styleClass="aon-form-input-text-label"
								value="#{registryBundle.aon_nif}" />
							<t:inputText id="Customer_Lookup_registry_document" forceId="#{true}"
								value="#{feeInvoicing.to.registryDocument}"
								disabled="#{feeInvoicing.recorded}"
								styleClass="aon-form-input-text" size="10" />

							<h:outputLabel for="Invoice_registryAddress_id"
								styleClass="aon-form-input-text-label"
								value="#{registryBundle.aon_address}" />
							<t:div>
								<h:selectOneMenu id="Invoice_registryAddress_id" forceId="#{true}"
									rendered="#{(feeInvoicing.new or feeInvoicingAddress.to.id == null) and feeInvoicing.addressCount > 0}"
									styleClass="aon-form-selectOneMenu-field"
									disabled="#{feeInvoicing.recorded}"
									value="#{feeInvoicing.to.registryAddress.id}">
									<f:selectItems value="#{feeInvoicing.addresses}" />
								</h:selectOneMenu>	
								<h:outputLabel value="#{financeBundle.invoice_no_available_address}"
									rendered="#{(feeInvoicing.new or feeInvoicingAddress.to.id == null) and feeInvoicing.addressCount == 0}" />
								<t:inputText id="Invoice_registryAddress_address" forceId="#{true}"
									rendered="#{!feeInvoicing.new and feeInvoicingAddress.to.id != null}"
									value="#{feeInvoicing.address}"
									disabled="#{true}"
									styleClass="aon-form-input-text" size="33" />
								<t:inputText id="Invoice_registryAddress_city" forceId="#{true}"
									rendered="#{!feeInvoicing.new and feeInvoicingAddress.to.id != null}"
									value="#{feeInvoicing.city}"
									disabled="#{true}"
									styleClass="aon-form-input-text" size="16" />
								<t:commandButton id="popupButton"
									rendered="#{!feeInvoicing.new and !feeInvoicing.recorded}"
									styleClass="aon-navigation-link"
									value="#{registryBundle.aon_address_other}"
									onclick="showPopup();return false;" />
							</t:div>

							<t:outputLabel for="Invoice_securityLevel"
								styleClass="aon-form-selectOneMenu-label"
								value="#{financeBundle.aon_security_level}" />
							<h:selectOneMenu id="Invoice_securityLevel"
								styleClass="aon-form-selectOneMenu-field"
								disabled="#{feeInvoicing.recorded}"
								value="#{feeInvoicing.to.securityLevel}">
								<f:selectItems value="#{financeCollections.securityLevels}" />
							</h:selectOneMenu>

							<t:outputLabel for="Invoice_status"
								styleClass="aon-form-selectOneMenu-label"
								value="#{financeBundle.aon_status}" />
							<t:div>
								<h:selectOneMenu id="Invoice_status" disabled="true"
									styleClass="aon-form-selectOneMenu-field"
									value="#{feeInvoicing.to.status}">
									<f:selectItems value="#{financeCollections.invoiceStatuses}" />
								</h:selectOneMenu>
								<f:verbatim>&#160;</f:verbatim>
								<t:outputText styleClass="aon-form-input-text-label"
									value="#{financeBundle.aon_account_entry}: #{feeInvoicing.accountEntryId}"
									rendered="#{feeInvoicing.recorded}" />
							</t:div>

							<t:outputLabel for="Invoice_total"
								styleClass="aon-form-selectOneMenu-label"
								value="#{financeBundle.aon_total}" />
							<t:outputText id="Invoice_total" forceId="#{true}" size="15"
								styleClass="aon-form-input-text-label"
								value="#{feeInvoicing.toInvoiceTotalPrice}">
								<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
							</t:outputText>

						</h:panelGrid>
					</h:panelGrid>

					<t:div styleClass="aon-form-group"
						rendered="#{!feeInvoicing.new}">
						<t:div styleClass="aon-form-group-title">
							<t:outputLabel for="feeInvoicingLineData"
								value="#{financeBundle.aon_invoice_lines}" />
						</t:div>

						<t:div styleClass="aon-form-group-body">
							<t:dataTable id="feeInvoicingLineData" var="to"
								styleClass="aon-edit-table" headerClass="aon-edit-table-header"
								footerClass="aon-edit-table-footer" cellpadding="0"
								cellspacing="0" value="#{feeInvoicingDetail.model}"
								rowOnMouseOver="selectRow( this )" rows="20"
								rowIndexVar="rowIndex" rowOnMouseOut="unselectRow( this )"
								rowOnClick="sendRow( this )" rendered="#{!feeInvoicing.new}"
								rowClasses="aon-edit-table-row-odd,aon-edit-table-row-even"
								columnClasses="aon-edit-table-body aon-edit-table-body-icon,
									aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-number,
									aon-edit-table-body aon-edit-table-body-string,
									aon-edit-table-body aon-edit-table-body-buttons">

								<h:column>
									<f:facet name="header">
										<f:verbatim>&#160;</f:verbatim>
									</f:facet>
									<t:commandLink immediate="#{true}"
										styleClass="aon-table-row-selected"
										rendered="#{to!=feeInvoicingDetail.to and !feeInvoicing.recorded}"
										actionListener="#{feeInvoicingDetail.onSelect}" />
									<f:facet name="footer">
										<t:div>
											<t:commandButton value=""
												styleClass="aon-edit-table-icon-button aon-edit-table-icon-button-new"
												title="#{bundle.aon_reset}"
												actionListener="#{feeInvoicingDetail.onReset}"
												rendered="#{!feeInvoicingDetail.new and !feeInvoicing.recorded}"
												accesskey="#{bundle.aon_key_new_line}" />
										</t:div>
									</f:facet>
								</h:column>

								<h:column>
									<f:facet name="header">
										<h:outputText value="#{productBundle.item_item}" />
									</f:facet>
									<t:outputText value="#{to.description}"
										rendered="#{to!=feeInvoicingDetail.to}" />

									<h:panelGroup rendered="#{to==feeInvoicingDetail.to}">
										<t:inputHidden id="Item_Lookup_id-Edit" forceId="#{true}"
											value="#{feeInvoicingDetail.to.item.id}"
											valueChangeListener="#{feeInvoicingDetail.itemData}" />
										<t:inputText id="Item_Lookup_product_code-Edit" size="5" forceId="#{true}"
											styleClass="aon-form-input-text" maxlength="15"
											onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','itemLookup','Item_Lookup_product_code-Edit[#{rowIndex}]','Item_product_code|Item_Lookup_product_code-Edit[#{rowIndex}],Item_id|Item_Lookup_id-Edit[#{rowIndex}],Item_price|Item_Lookup_price-Edit[#{rowIndex}],Item_full_name|Item_full_name-Edit[#{rowIndex}]');"
											value="#{feeInvoicingDetail.to.item.product.code}"/>
										<h:commandButton id="find_Item_Lookup_id-Edit"
											styleClass="aon-form-lookup-button" value="" immediate="true"
											onclick="lookupSearchWindow(this, 'placeList', '#{itemLookup.encodedSearchPagePath}','Item_product_code|Item_Lookup_product_code-Edit[#{rowIndex}],Item_id|Item_Lookup_id-Edit[#{rowIndex}],Item_price|Item_Lookup_price-Edit[#{rowIndex}],Item_full_name|Item_full_name-Edit[#{rowIndex}]');return false;" />										
										<t:inputText id="Item_full_name-Edit" size="40"
											forceId="#{true}" required="#{true}"
											styleClass="aon-form-input-text" maxlength="64"
											value="#{feeInvoicingDetail.to.description}" />
									</h:panelGroup>

									<f:facet name="footer">
										<t:div>
											<h:panelGroup rendered="#{feeInvoicingDetail.new}">
												<t:inputHidden id="Item_Lookup_id-New" forceId="#{true}"
													value="#{feeInvoicingDetail.to.item.id}"
													valueChangeListener="#{feeInvoicingDetail.itemData}" />
												<t:inputText id="Item_Lookup_product_code-New" size="5" forceId="#{true}"
													styleClass="aon-form-input-text" maxlength="15"
													onchange="return findBeanLookupExt(event,'#{facesContext.externalContext.requestContextPath}','itemLookup','Item_Lookup_product_code-New','Item_product_code|Item_Lookup_product_code-New,Item_id|Item_Lookup_id-New,Item_price|Item_Lookup_price-New,Item_full_name|Item_full_name-New');"													
													value="#{feeInvoicingDetail.to.item.product.code}"/>
												<h:commandButton id="find_Item_Lookup_id-New"
													styleClass="aon-form-lookup-button" value="" immediate="true"
													onclick="lookupSearchWindow(this, 'placeList', '#{itemLookup.encodedSearchPagePath}','Item_product_code|Item_Lookup_product_code-New,Item_id|Item_Lookup_id-New,Item_price|Item_Lookup_price-New,Item_full_name|Item_full_name-New');return false;" />
												<t:inputText id="Item_full_name-New" size="40"
													forceId="#{true}" required="#{true}"
													styleClass="aon-form-input-text" maxlength="64"
													value="#{feeInvoicingDetail.to.description}" />
											</h:panelGroup>
										</t:div>
									</f:facet>
								</h:column>

								<t:column width="60">
									<f:facet name="header">
										<t:outputText value="#{financeBundle.aon_quantity}" />
									</f:facet>
									<t:outputText value="#{to.quantity}"
										rendered="#{to!=feeInvoicingDetail.to}">
										<f:convertNumber pattern="#{bundle.aon_decimal3_pattern}" />
									</t:outputText>
									<t:inputText id="Item_quantity-Edit"
										rendered="#{to==feeInvoicingDetail.to}" forceId="#{true}"
										value="#{feeInvoicingDetail.to.quantity}" required="#{true}"
										styleClass="aon-form-input-text" size="7"
										onchange="calcPrice( #{rowIndex} );" />
									<f:facet name="footer">
										<t:div>
											<t:inputText id="Item_quantity-New" forceId="#{true}"
												rendered="#{feeInvoicingDetail.new}" size="7"
												value="#{feeInvoicingDetail.to.quantity}"
												required="#{true}" styleClass="aon-form-input-text"
												onchange="calcPrice( -1 );" />
										</t:div>
									</f:facet>
								</t:column>

								<t:column width="60">
									<f:facet name="header">
										<t:outputText value="#{financeBundle.aon_price}" />
									</f:facet>
									<t:outputText value="#{to.price}"
										rendered="#{to!=feeInvoicingDetail.to}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</t:outputText>
									<t:inputText id="Item_Lookup_price-Edit" size="7" forceId="#{true}"
										rendered="#{to==feeInvoicingDetail.to}"
										value="#{feeInvoicingDetail.to.price}" required="#{true}"
										styleClass="aon-form-input-text"
										onchange="calcPrice( #{rowIndex} );" />
									<f:facet name="footer">
										<t:div>
											<t:inputText id="Item_Lookup_price-New" size="7" forceId="#{true}"
												rendered="#{feeInvoicingDetail.new}"
												value="#{feeInvoicingDetail.to.price}" required="#{true}"
												styleClass="aon-form-input-text" onchange="calcPrice( -1 );" />
										</t:div>
									</f:facet>
								</t:column>

								<t:column width="60">
									<f:facet name="header">
										<t:outputText value="#{financeBundle.aon_discount}" />
									</f:facet>
									<t:outputText id="Discount" forceId="#{true}"
										rendered="#{to!=feeInvoicingDetail.to}"
										value="#{to.discountExpression.discountExpr}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</t:outputText>
									<t:inputText id="Discount-Edit"
										rendered="#{to==feeInvoicingDetail.to}" forceId="#{true}"
										styleClass="aon-form-input-text" size="7"
										value="#{feeInvoicingDetail.to.discountExpression.discountExpr}"
										required="#{true}" onchange="calcPrice( #{rowIndex} );" />
									<f:facet name="footer">
										<t:inputText id="Discount-New"
											rendered="#{feeInvoicingDetail.new}" forceId="#{true}"
											styleClass="aon-form-input-text" size="7"
											value="#{feeInvoicingDetail.to.discountExpression.discountExpr}"
											required="#{true}" onchange="calcPrice( -1 );" />
									</f:facet>
								</t:column>

								<t:column width="60">
									<f:facet name="header">
										<t:outputText value="#{financeBundle.aon_amount}" />
									</f:facet>
									<t:outputText id="Item_price_new-Edit"
										value="#{to.taxableBase}" forceId="#{true}">
										<f:convertNumber pattern="#{bundle.aon_decimal2_pattern}" />
									</t:outputText>
									<f:facet name="footer">
										<t:div style="text-align:right;">
											<t:outputText id="Item_price_new-New"
												rendered="#{feeInvoicingDetail.new}" forceId="#{true}"
												value="#{feeInvoicingDetail.to.taxableBase}"
												required="#{true}" />
											<t:outputText id="Item_details_total"
												rendered="#{!feeInvoicingDetail.new}"
												value="#{feeInvoicingDetail.to.taxableBase}">

		<script>
			function calcPrice(index){
				priceName = "Item_Lookup_price";
				quantityName = "Item_quantity";
				priceNewName = "Item_price_new"
				discountName = "Discount";
				if(index != -1){
					priceName = priceName + "-Edit[" + index + "]";
					quantityName = quantityName + "-Edit[" + index + "]";
					priceNewName = priceNewName + "-Edit[" + index + "]";
					discountName = discountName + "-Edit[" + index + "]";
				}else{
					priceName = priceName + "-New";
					quantityName = quantityName + "-New";
					priceNewName = priceNewName + "-New";
					discountName = discountName + "-New";					
				}
				price = document.getElementById( priceName );
				quantity = document.getElementById( quantityName );
				discount = document.getElementById( discountName );
				amount = document.getElementById( priceNewName );
				temp = redondea( price.value * quantity.value , 2 );
				amount.innerText = "" + redondea( temp - ( temp * discount.value / 100 ), 2 );
			}
			function redondea(xparam , digits ){
			    retvalue = xparam;
			    if ( digits > 0 ) {
			    	value = Math.pow(10,digits);
			        retvalue = Math.round(parseFloat(xparam)*value)/value;
			    }
			    if ( digits == 0 ) {
			        retvalue = Math.round(parseFloat(xparam));
			    }
			    if ( isNaN(parseFloat(retvalue)) ) {
			        retvalue = 0;
			    }
			    return retvalue;
			}
			function showPopup(){
				document.getElementById( "popup" ).style.display='block';
				document.getElementById( "Address_required" ).style.display = 'none';
				document.getElementById( "Zip_required" ).style.display = 'none';
				document.getElementById( "City_required" ).style.display = 'none';
				document.getElementById( "Geozone_required" ).style.display = 'none';
				document.getElementById( "InvoiceAddress_address" ).focus();
			}
		</script>
