		<aon:panelGrid columns="3" width="100%"
			columnClasses="aon-logo-name,aon-header-slogan,aon-header-info">

			<aon:div>
				<aon:div id="company-logo">
					<h:outputLink target="_top"
						value="${facesContext.externalContext.requestContextPath}">
						<a4j:mediaOutput id="company-logo-left" element="img"
							cacheable="false" rendered="#{company.withLogo}"
							value="#{company.aonFile.key}"
							createContent="#{company.createLogoContent}" />
					</h:outputLink>
				</aon:div>
				<aon:div id="header-image">
					<a4j:mediaOutput id="header-image-right" element="img"
						cacheable="false" value="#{ecConfig.activeConfig.id}"
						createContent="#{ecConfig.paint}" />
