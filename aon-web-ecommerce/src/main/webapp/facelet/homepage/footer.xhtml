				<aon:outputText value="#{ecConfig.company.document}" />
				<aon:outputText value=" &#183; " />
				<aon:outputText value="#{ecConfig.company.defaultAddress.address}" />
				<aon:outputText value=" &#183; " />
				<aon:outputText value="#{ecConfig.company.defaultAddress.zip} " />
				<aon:outputText value=" &#183; " />
				<aon:outputText value="#{ecConfig.company.defaultAddress.city}" />
			</aon:div>

			<aon:div styleClass="aon-footer-buttoms">
				<aon:outputLink value="#" id="legal-note1"
					rendered="#{!(ecConfig.activeConfig.noteTitle1=='')}"
					styleClass="aon-finding-toolbar-item aon-icon-footer-note">
					<aon:outputText style="color:#ccc;" value="#{ecConfig.activeConfig.noteTitle1}" />
					<rich:componentControl for="legalNote1Process" attachTo="legal-note1"
						operation="show" event="onclick" />
				</aon:outputLink>
				<aon:outputLink value="#" id="legal-note2"
					rendered="#{!(ecConfig.activeConfig.noteTitle2=='')}"
					styleClass="aon-finding-toolbar-item aon-icon-footer-note">
					<aon:outputText style="color:#ccc;" value="#{ecConfig.activeConfig.noteTitle2}" />
					<rich:componentControl for="legalNote2Process" attachTo="legal-note2"
						operation="show" event="onclick" />
				</aon:outputLink>
				<aon:outputLink value="#" id="legal-note3"
					rendered="#{!(ecConfig.activeConfig.noteTitle3=='')}"
					styleClass="aon-finding-toolbar-item aon-icon-footer-note">
					<aon:outputText style="color:#ccc;" value="#{ecConfig.activeConfig.noteTitle3}" />
					<rich:componentControl for="legalNote3Process" attachTo="legal-note3"
						operation="show" event="onclick" />
				</aon:outputLink>
				
				<aon:div id="version-tag" style="text-align:right;" >
					<aon:outputText value="[#{aonConfiguration.applicationVersion}]"
						styleClass="aon-finding-toolbar-item aon-icon-footer-note" 
						style="font-size:0.9em;margin-top:0.3em;color:#ccc;"
						rendered="#{aonConfiguration.applicationVersion != null}" />
				</aon:div>
			</aon:div>
		</aon:form>
		
		<rich:modalPanel id="legalNote1Process" width="570" autosized="true"
			zindex="2000" style="top: 0px; left:0px;">
			<rich:effect event="onshow"  type="Highlight" params="duration:0.8" />
        	<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="#{ecConfig.activeConfig.noteTitle1}" />
				</aon:div>
			</f:facet>
			<aon:div styleClass="aon-popupWindow-content">
				<aon:div styleClass="aon-popupWindow-content-internal">
					<aon:div id="legalNote1" styleClass="extra-info">
						<aon:outputText escape="false"
							value="#{ecConfig.activeConfig.legalNote1}" />
					</aon:div>
					<aon:div styleClass="aon-text-center">
						<aon:outputLink id="legalNote1-hidelink" value="#">
							<aon:outputText value="[#{bundle.aon_close}]" style="color:black;"/>	
						</aon:outputLink>
						<rich:componentControl for="legalNote1Process" attachTo="legalNote1-hidelink" operation="hide" event="onclick"/>
					</aon:div>
				</aon:div>
			</aon:div>
		</rich:modalPanel>
		<rich:modalPanel id="legalNote2Process" width="570" autosized="true"
			zindex="2000" style="top: 0px; left:0px;">

					</aon:div>
					<aon:div styleClass="aon-text-center">

							<aon:outputText value="[#{bundle.aon_close}]" style="color:black;"/>	
						</aon:outputLink>

					</aon:div>
				</aon:div>
			</aon:div>
		</rich:modalPanel>
		<rich:modalPanel id="legalNote3Process" width="570" autosized="true"
			zindex="2000" style="top: 0px; left:0px;">
			<rich:effect event="onshow"  type="Highlight" params="duration:0.8" />
        	<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<h:outputText value="#{ecConfig.activeConfig.noteTitle3}" />
					
				</aon:div>
			</f:facet>
			<aon:div styleClass="aon-popupWindow-content">

					</aon:div>
				</aon:div>
			</aon:div>
		</rich:modalPanel>
	</aon:div>
