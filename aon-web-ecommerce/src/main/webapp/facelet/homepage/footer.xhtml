<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:div id="aonFooter" styleClass="aon-footer">
		<aon:form>
			<aon:div styleClass="aon-footer-additionalInfo">
				<aon:outputText value="#{ecConfig.company.name}" />
				<aon:outputText value=" &#183; " />
				<aon:outputText value="#{bundle.aon_person_document} " />
				<aon:outputText value="#{ecConfig.company.document}" />
				<aon:outputText value=" &#183; " />
				<aon:outputText value="#{ecConfig.company.defaultAddress.address}" />
				<aon:outputText value=" &#183; " />
				<aon:outputText value="#{ecConfig.company.defaultAddress.zip} " />
				<aon:outputText value=" &#183; " />
				<aon:outputText value="#{ecConfig.company.defaultAddress.city}" />
			</aon:div>
<!--  
				<aon:div styleClass="aon-float-right">
					<aon:div styleClass="aon-footer-menu-item">
						
						<h:outputLink target="_top"
							value="${facesContext.externalContext.requestContextPath}">
							<h:outputText value="#{bundle.aon_home}" />
						</h:outputLink>

						<aon:commandLink style="border-right:0;" action="#"
							rendered="#{shop.logged}" reRender="aonHeader"
							actionListener="#{userLogin.onLogout}">

						</aon:commandLink>
					</aon:div>
				</aon:div>
-->				

<!-- 
				<aon:commandButton action="#" value="privacidad-18n-"
					styleClass="aon-finding-toolbar-item aon-icon-footer-note">
					<f:param name="info" value="#{ecConfig.activeConfig.privatePolicy}" />
				</aon:commandButton>

				<aon:commandButton action="#" value="nota legal-18n-"
					reRender="itemContent"
					styleClass="aon-finding-toolbar-item aon-icon-footer-note">
					<aon:actionListener method="#{shop.onInfoView}" />
					<f:param name="info" value="#{ecConfig.activeConfig.legalNote}" />
				</aon:commandButton>
				<aon:commandLink action="#" value="proteccion de datos-18n-"
					reRender="itemContent"
					styleClass="aon-finding-toolbar-item aon-icon-footer-note">
					<aon:actionListener method="#{shop.onInfoView}" />
					<f:param name="info"
						value="#{ecConfig.activeConfig.dataProtection}" />
				</aon:commandLink>
-->
			<aon:div styleClass="aon-footer-buttoms">
				<aon:outputLink value="#" id="private-policy"
					rendered="#{!(ecConfig.activeConfig.privatePolicy=='')}"
					styleClass="aon-finding-toolbar-item aon-icon-footer-note">
					<aon:outputText value="#{ecommerceBundle.aon_ecommerce_private_policy}" />
					<rich:componentControl for="privatePolicyProcess" attachTo="private-policy"
						operation="show" event="onclick" />
				</aon:outputLink>
				<aon:outputLink value="#" id="legal-note"
					rendered="#{!(ecConfig.activeConfig.legalNote=='')}"
					styleClass="aon-finding-toolbar-item aon-icon-footer-note">
					<aon:outputText value="#{ecommerceBundle.aon_ecommerce_legal_note}" />
					<rich:componentControl for="legalNoteProcess" attachTo="legal-note"
						operation="show" event="onclick" />
				</aon:outputLink>
				<aon:outputLink value="#" id="data-protection"
					rendered="#{!(ecConfig.activeConfig.dataProtection=='')}"
					styleClass="aon-finding-toolbar-item aon-icon-footer-note">
					<aon:outputText value="#{ecommerceBundle.aon_ecommerce_data_protection}" />
					<rich:componentControl for="dataProtectionProcess" attachTo="data-protection"
						operation="show" event="onclick" />
				</aon:outputLink>

			</aon:div>
		</aon:form>

		<rich:modalPanel id="privatePolicyProcess" height="490" width="570"
			zindex="2000" style="top: 0px; left:0px;">

			<rich:effect event="onshow"  type="Highlight" params="duration:0.8" />

        	<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="POLITICA DE PRIVACIDAD" />
				</aon:div>
			</f:facet>
			<aon:div styleClass="aon-popupWindow-content">
				<aon:div styleClass="aon-popupWindow-content-internal">
					<aon:div id="privatePolicy" styleClass="extra-info">
						<aon:outputText value="#{ecConfig.activeConfig.privatePolicy}" />
					</aon:div>
					<aon:div styleClass="aon-text-center">
						<aon:outputLink id="privatePolicy-hidelink" value="#">
							<aon:outputText value="[#{bundle.aon_close}]" style="color:black;"/>	
						</aon:outputLink>
						<rich:componentControl for="privatePolicyProcess" attachTo="privatePolicy-hidelink" operation="hide" event="onclick"/>
					</aon:div>
				</aon:div>
			</aon:div>
		</rich:modalPanel>
		<rich:modalPanel id="legalNoteProcess" height="490" width="570"
			zindex="2000" style="top: 0px; left:0px;">

			<rich:effect event="onshow"  type="Highlight" params="duration:0.8" />

        	<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="NOTA LEGAL" />
				</aon:div>
			</f:facet>
			<aon:div styleClass="aon-popupWindow-content">
				<aon:div styleClass="aon-popupWindow-content-internal">
					<aon:div id="legalNote" styleClass="extra-info">
						<aon:outputText value="#{ecConfig.activeConfig.legalNote}" />
					</aon:div>
					<aon:div styleClass="aon-text-center">
						<aon:outputLink id="legalNote-hidelink" value="#">
							<aon:outputText value="[#{bundle.aon_close}]" style="color:black;"/>	
						</aon:outputLink>
						<rich:componentControl for="legalNoteProcess" attachTo="legalNote-hidelink" operation="hide" event="onclick"/>
					</aon:div>
				</aon:div>
			</aon:div>
		</rich:modalPanel>
		<rich:modalPanel id="dataProtectionProcess" height="490" width="570"
			zindex="2000" style="top: 0px; left:0px;">

			<rich:effect event="onshow"  type="Highlight" params="duration:0.8" />

        	<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="AVISO LEGAL" />
				</aon:div>
			</f:facet>
			<aon:div styleClass="aon-popupWindow-content">
				<aon:div styleClass="aon-popupWindow-content-internal">
					<aon:div id="dataProtection" styleClass="extra-info">
						<aon:outputText value="#{ecConfig.activeConfig.dataProtection}" />
					</aon:div>
					<aon:div styleClass="aon-text-center">
						<aon:outputLink id="dataProtection-hidelink" value="#">
							<aon:outputText value="[#{bundle.aon_close}]" style="color:black;"/>	
						</aon:outputLink>
						<rich:componentControl for="dataProtectionProcess" attachTo="dataProtection-hidelink" operation="hide" event="onclick"/>
					</aon:div>
				</aon:div>
			</aon:div>
		</rich:modalPanel>

	</aon:div>
</ui:composition>
