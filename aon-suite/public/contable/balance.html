        <!-- ChartJS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.js" crossorigin="anonymous"></script>
        <script>
            //
            // Cargamos las funciones
            //
            $(document).ready(function () {
                // Cogemos el listado de datos para mostrar
                var list = getList();

                createTable(list);

                //
                // Creamos la tabla con los datos a listar
                //
                function createTable(data) {
                    // recorremos los datos a mostrar
                    var tbody = '';
                    $('.anio_balance').html(data.year);
                    
                    var balance = data.balance;
                    
                    // Indicamos el año al que corresponde el desglose
                    // ACTIVOS
                    $.each(balance.activos, function (i, item) {
                        // Primero recorremos los datos, el genera, es la cabecera del desglose
                        tbody += '<tr>';
                            tbody += "<th scope='row' colspan='2'>"+item.name+"</th>";
                        tbody += '</tr>';
                        
                        // Comprobamos si existe desglose y lo recorremos
                        if( item.hasOwnProperty('breakdown') ) {
                            $.each(item.breakdown, function (key, val) {
                                tbody += '<tr>';
                                    tbody += "<td>"+val.name+"</td>";
                                    tbody += "<td>"+val.total+"</td>";
                                tbody += '</tr>';
                            });
                        }
                        
                        if( item.hasOwnProperty('total') ) {
                            tbody += '<tr>';
                                tbody += "<th scope='row' colspan='2'></th>";
                            tbody += '</tr>';
                            
                            tbody += '<tr>';
                                tbody += "<td>Total</td>";
                                tbody += "<td>"+item.total+"</td>";
                            tbody += '</tr>';
                            
                            tbody += '<tr>';
                                tbody += "<th scope='row' colspan='2'></th>";
                            tbody += '</tr>';
                        } else {
                            tbody += '<tr>';
                                tbody += "<th scope='row' colspan='2'></th>";
                            tbody += '</tr>';
                        }
                    });
                    
                    // Agregamos el cuerpo de la tabla
                    $('#table_balance_activo tbody').html(tbody);
                    
                    // PASIVOS
                    tbody = '';
                    $.each(balance.pasivos, function (i, item) {
                        // Primero recorremos los datos, el genera, es la cabecera del desglose
                        tbody += '<tr>';
                            tbody += "<th scope='row' colspan='2'>"+item.name+"</th>";
                        tbody += '</tr>';
                        
                        // Comprobamos si existe desglose y lo recorremos
                        if( item.hasOwnProperty('breakdown') ) {
                            $.each(item.breakdown, function (key, val) {
                                tbody += '<tr>';
                                    tbody += "<td>"+val.name+"</td>";
                                    tbody += "<td>"+val.total+"</td>";
                                tbody += '</tr>';
                            });
                        }
                        
                        if( item.hasOwnProperty('total') ) {
                            tbody += '<tr>';
                                tbody += "<th scope='row' colspan='2'></th>";
                            tbody += '</tr>';
                            
                            tbody += '<tr>';
                                tbody += "<td>Total</td>";
                                tbody += "<td>"+item.total+"</td>";
                            tbody += '</tr>';
                            
                            tbody += '<tr>';
                                tbody += "<th scope='row' colspan='2'></th>";
                            tbody += '</tr>';
                        } else {
                            tbody += '<tr>';
                                tbody += "<th scope='row' colspan='2'></th>";
                            tbody += '</tr>';
                        }
                    });
                    
                    // PATRIMONIO
                    
                    if( balance.hasOwnProperty('patrimonio') ) {
                        tbody += '<tr>';
                            tbody += "<th scope='row' colspan='2' class='text-center'>PATRIMONIO</th>";
                        tbody += '</tr>';
                        
                        $.each(balance.patrimonio, function (i, item) {
                            tbody += '<tr>';
                                tbody += "<td>"+item.name+"</th>";
                                tbody += "<td>"+item.total+"</th>";
                            tbody += '</tr>';
                        });
                    }
                        
                    // Agregamos el cuerpo de la tabla
                    $('#table_balance_pasivo tbody').html(tbody);
                    
                    var totales = balance.totales;
                    $('.total_activos').html(totales.total_activos);
                    $('.total_pasivos_patrimonio').html(totales.total_pasivos_patrimonio);
                    
                    // Montamos la gráfica
                    var ctx = $('#myChart');
                    var myChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Activos', 'Pasivos'],
                            datasets: [{
                                data: [parseFloat(totales.total_activos), parseFloat(totales.total_pasivos_patrimonio)],
                                backgroundColor: [
                                    'rgba(54, 162, 235, 1)',
                                    'rgba(255, 99, 132, 1)'
                                ]
                            }]
                        }
                    });
                }

                //
                // Listado para probar
                //
                function getList(uid = 'a5sa645-sa14') {
                    // Enviamos el usuarioID y el año que queremos
                    
                    var balance = {
                        "activos" : {
                            0 : {
                                name : "Activos corrientes",
                                total : "111.000,00 €", // Solo si en el desglose hay mas de un elemento
                                breakdown : {
                                    0 : {
                                        name : "Efectivo o caja",
                                        total : "46.000,00 €"
                                    },
                                    1 : {

                                        total : "50.000,00 €"
                                    },

                            2 : {

                                    }

                        "pasivos" : {

                                breakdown : {

                                        total : "50.000,00 €"
                                    },
                                    1 : {
                                        name : "",
                                        total : "10.000,00 €"

                                }
                            },
                            1 : {
                                name : "Pasivos no corrientes",
                                breakdown : {
                                    0 : {

                                        total : "20.000,00 €"

                        },
                        "patrimonio" : {

                                name : "Capital",
                                total : "60.000,00 €"
                            }
                        },
                        "totales" : {
                            "total_activos" : "140.000,00 €",
                            "total_pasivos_patrimonio" : "140.000,00 €" // Suma de pasivos + patrimonio
                        }
                    };

                    // Json que nos llegaria
                    var json = {
                        userId: uid,        // Al usuario que le pertenece el ppygg
                        year: "2020",       // Año correspondiente al ppygg
                        balance: balance         // Datos de ppygg
                    };

                    // Devolver los datos
                    return json;
                }
            });
        </script>
