                                                    <th scope="col">Cuenta contable</th>
                                                    <th scope="col">Nombre de cuenta contable</th>

        <!-- Scripts -->

        <!-- ChartJS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.js" crossorigin="anonymous"></script>
        <script>
            //
            // Cargamos las funciones
            //
            $(document).ready(function () {
                // Cogemos el listado de datos para mostrar
                var list = getList();

                createTable(list);

                //
                // Creamos la tabla con los datos a listar
                //
                function createTable(data) {
                    // recorremos los datos a mostrar
                    var tbody = '';
                    var contador = 0; // Contador de cuantos elementos hay
                    var arrayBases = [];
                    var arrayNames = [];
                    
                    // Indicamos el año al que corresponde el desglose
                    $('.anio_ppyg').html(data.year);
                    $.each(data.ppygg, function (i, item) {
                        // Si el contador es mayor que 0, generamos una linea vacía como separacion
                        if(contador > 0){
                            tbody += '<tr>';
                                tbody += "<td colspan='3'></td>";
                            tbody += '</tr>';
                        }
                        // Primero recorremos los datos, el genera, es la cabecera del desglose
                        tbody += '<tr>';
                            tbody += "<th scope='row'>"+item.account+"</th>";
                            tbody += "<th scope='row'>"+item.name+"</th>";
                            tbody += "<th scope='row'>"+item.base+"</th>";
                        tbody += '</tr>';
                        
                        // Comprobamos si existe desglose y lo recorremos
                        if( item.hasOwnProperty('breakdown') ) {
                            $.each(item.breakdown, function (key, val) {
                                 tbody += '<tr>';
                                    tbody += "<td>"+val.account+"</td>";
                                    tbody += "<td>"+val.name+"</td>";
                                    tbody += "<td>"+val.base+"</td>";
                                tbody += '</tr>';
                            });
                        }
                        
                        if(!item.result){
                            arrayNames[contador] = item.name;
                            arrayBases[contador] = parseFloat(item.base);
                        }
                            
                        // Sumamos 1 al contador
                        contador++;
                    });
                    
                    // Agregamos el cuerpo de la tabla
                    $('#table_ppygg_desglose tbody').html(tbody);
                    
                    var ctx = $('#myChart');
                    var myChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: arrayNames,
                            datasets: [{
                                data: arrayBases,
                                backgroundColor: [
                                    'rgba(54, 162, 235, 1)',
                                    'rgba(255, 99, 132, 1)'
                                ]
                            }]
                        }
                    });
                }

                //
                // Listado para probar
                //
                function getList(uid = 'a5sa645-sa14') {
                    // Enviamos el usuarioID y el año que queremos
                    
                    var ppygg = {
                        0 : {
                            name : "Ventas e ingresos",
                            base : 3255,
                            account : 7,
                            result: false, // Para saber si es el resultado final o no para no incluirlo en la gráfica
                            breakdown : { // Desglose
                                0 : {
                                    name : "Ventas",
                                    base : 3215,
                                    account : 70
                                },
                                1 : {
                                    name : "Prestación de servicios",
                                    base : 3215,
                                    account : 705
                                },
                                2 : {
                                    name : "Otros ingresos",
                                    base : 40,
                                    account : 75
                                },
                                3 : {
                                    name : "Ingresos por servicios diversos",
                                    base : 3215,
                                    account : 70
                                }
                            }
                        },
                        1 : {
                            name : "Compras y gastos",
                            base : 861,
                            account : 6,
                            result: false,
                            breakdown : {
                                0 : {
                                    name : "Servicios exteriores",
                                    base : 316,
                                    account : 62
                                },
                                1 : {
                                    name : "Otros",
                                    base : 316,
                                    account : 629
                                },
                                2 : {
                                    name : "Gastos de personal",
                                    base : 545,
                                    account : 64
                                },
                                3 : {
                                    name : "Sueldos y salarios",
                                    base : 530,
                                    account : 640
                                },
                                4 : {
                                    name : "Seguridad Social a cargo de la empresa",
                                    base : 15,
                                    account : 642
                                }
                            }
                        },
                        2 : {
                            name : "Resultado de explotación",
                            base : 2394,
                            account : "",
                            result: true
                        }
                    };

                    // Json que nos llegaria
                    var json = {
                        userId: uid,        // Al usuario que le pertenece el ppygg
                        year: "2020",       // Año correspondiente al ppygg
                        ppygg: ppygg         // Datos de ppygg
                    };

                    // Devolver los datos
                    return json;
                }
            });
        </script>
