<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Rubik:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet" type='text/css'>

        <!-- MATERIAL ICONS -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">

        <!-- MATERIAL COMPONENTS -->
        <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">

        <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>

        <link href="../css/app.css" rel="stylesheet" id="linkcss">
    </head>
    <body>
        <!-- start contenido centro -->
        <div class="col" id="atp_contenido_centro">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <!-- INICIO VISTA -->
                    <div class="col-12">
                        <div class="row">
                            <div class="col-12">
                                <h3>Nuevo ticket</h3>
                            </div>
                            <form method="post" id="formulario" enctype="multipart/form-data">
                                <div class="col-12 mt-2">
                                    <div class="row">
                                        <div class="col-12">
                                            <label class="font-weight-bold" for="subject">Asunto:</label>
                                            <input type="text" id="subject" name="subject" class="form-control" value="" placeholder="Asunto" />
                                            <label class="d-none errores error-subject text-ayudat font-weight-bold">Debe escribir el asunto del ticket</label>
                                        </div>
                                        <div class="col-12 mt-2">
                                            <div class="row">
                                                <div class="col-3">
                                                    <label class="font-weight-bold" for="subject">Departamento:</label>
                                                    <select class="form-control" id="postings" name="postings">
                                                        <option value="">Elija un departamento</option>
                                                    </select>
                                                    <label class="d-none errores error-postings text-ayudat font-weight-bold">Debe seleccionar el destinatario del ticket</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12 mt-2">
                                            <label class="font-weight-bold">Mensaje:</label>
                                            <label class="d-none errores error-msg text-ayudat font-weight-bold">Debe escribir el mensaje del ticket</label>
                                            <textarea id="editor"></textarea>
                                        </div>
                                        <div class="col-12 mt-2">
                                            <label class="font-weight-bold" for="subject">Adjuntar archivos:</label>
                                            <input type="file" id="attached" name="attached[]" class="form-control" multiple/>
                                        </div>
                                        <div class="col-12 mt-2">
                                            <button type="button" id="btn-send" class="btn btn-sm btn-info float-right">Enviar</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div><!-- end contenido centro -->
        
        <!-- Scripts -->
        <script src="../js/app.js"></script>
        <script src="../js/crud.js"></script>
        <script>
            //
            // Cargamos el CKEditor
            //
                let theEditor;
                // Inicializamos CKEditor
                ClassicEditor.create( document.querySelector('#editor'),{
                    language: 'es'
                })
                .then(editor => {
                    theEditor = editor;
                    $('<style type="text/css" scoped>.ck-editor .ck-editor__editable_inline {min-height: 200px !important;}</style>').insertAfter('#editor');
                })
                .catch( error => {
                    console.error( error );
                } );

            //
            // Agregamos los valores de los select
            //
                $(document).ready(function(){
                    // Datos del ticket en JSON
                    let nuevoTicket = {
                        postings : {                      // destinos posibles
                            0 : {
                                id : 1,
                                name : "Programación"
                            },
                            1 : {
                                id : 2,
                                name : "Calidad"
                            },
                            2 : {
                                id : 3,
                                name : "Administración"
                            }
                        }
                    };

                    // Leemos los datos del ticket y rellenamos los datos necesarios
                    for (const prop in nuevoTicket.postings) {
                        let posting = nuevoTicket.postings[prop];
                        // Agregamos el valor
                        $('#postings').append("<option value='"+posting.id+"'>"+posting.name+"</option>");
                    }
                });

            //
            // Enviar o crear mensage nuevo
            //
                $('#btn-send').click(function(){
                    let envio = true;

                    // Quitamos todos los errores
                    $('.errores').each(function(){
                        $(this).addClass('d-none');
                    });

                    // Creamos el formData para enviar
                    let formData = new FormData();

                    // Añadimos los adjuntos (archivos)
                    let files = $("#attached")[0].files;

                    for (const prop in files) {
                        formData.append('file', files[prop]);
                    }

                    // Añadimos textArea (CKEditor)
                    let msgUser = theEditor.getData();
                    if(msgUser == ''){
                        $('.error-msg').removeClass('d-none');
                        envio = false;
                    }
                    formData.append("message", msgUser);

                    // Añadimos el asunto
                    let subject = $("#subject").val();
                    if(subject == ''){
                        $('.error-subject').removeClass('d-none');
                        envio = false;
                    }
                    formData.append('subject', subject);

                    // Añadimos el destinatario
                    let postings = $("#postings").val();
                    if(postings == ''){
                        $('.error-postings').removeClass('d-none');
                        envio = false;
                    }
                    formData.append('postings', postings);

                    // Todo va correcto enviamos o creamos
                    if(envio){
                        // Recogemos los valores del formulario para crear el el mensaje o ticket
                        let formData = dataForm('#formulario');

                        // Creamos el Json de alamacenamiento
                        let from    = NameRandom();
                        let ticket  = {
                            id           : returNextID('messenger'),        // campo ticket
                            createDate   : Today(),                         // Creado
                            subject      : formData.subject,                // titulo del ticket
                            postings     : formData.postings,               // select del destinatario
                            from         : from,                            // creador del ticket
                            assignaedTo  : NameRandom(2),                   // asigando a
                            answer       : Math.floor((Math.random() * 2)), // tienes que responder = 0 : respondido | 1 : responder
                            message      : {
                                1 : {
                                    userName     : from,                                        // Nombre del usuario del mensaje
                                    userId       : "425",                                       // ID del usuario que crea el ticket
                                    userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                                    messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje
                                    message      : formData.editor,                             // Mensaje
                                }
                            }
                        }
                        //
                        // Almacenamos en el Storage
                        //
                            // No tenemos datos
                            let dataCreate = {
                                name : 'messenger', // tickets
                                json : ticket
                            };
                            let data = createJsonApi(dataCreate);
                        
                        // Al recibir que se ha creado, recibiremos el id del ticket, devolvemos a la pantalla del ticket
                        document.location.href = "show.html?ticket="+ticket.id;
                    } else {
                        return 0;
                    }
                });

            //
            // Coger valores del formulario
            //
                function dataForm(formID){
                    let fields   = 'input, select, textarea'
                    let formData = {};

                    $(formID).find(fields).each(function () {
                        if( this.type == 'radio' || this.type == 'checkbox'){
                            // Coger solo el valor con checked
                            if(this.checked){
                                formData[this.name] = this.value;
                            }
                        } else {
                            formData[this.name] = this.value;
                        }
                    });

                    // Agregar datos del CKEditor
                    formData['editor'] = theEditor.getData();

                    return formData;
                }
        </script>
        <!-- FIN Scripts -->
    </body>
</html>
