        <!-- MATERIAL ICONS -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">

        <!-- MATERIAL COMPONENTS -->
        <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">

    <body>
        <!-- start contenido centro -->
        <div class="col" id="atp_contenido_centro">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <!-- INICIO VISTA -->
                    <div class="col-12">
                        <div class="row">
                            <div class="col-12">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th scope="col">#</th>
                                            <th scope="col">De</th>
                                            <th scope="col">Asunto</th>
                                            <th scope="col">Asignado</th>
                                            <th scope="col">Estado</th>
                                            <th scope="col">Creado</th>
                                            <th scope="col"></th>
                                            <th scope="col"></th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                    <tfoot></tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div><!-- end contenido centro -->

        <!-- Scripts -->
        <script src="../js/app.js"></script>
        <script src="../js/crud.js"></script>
        <script>
            //
            // Cargamos las funciones
            //
                $(document).ready(function () {
                    //
                    // Cargamos la tabla
                    //
                        createTable(getList());
                });

            //
            // Creamos la tabla con los datos a listar
            //
                function createTable(data) { 
                    // Variables que usuamos
                    let tbody   = '';
                    let colspan = 7;
                    let a_href  = 'show.html';
                    
                    var orderColumn = ['#', 'De', 'Asunto', 'Asignado', 'Estado', 'Creado'];
                    
                    if(!data){
                        // No tenemos datos
                        let tbody =
                            '<tr>' +
                                '<td colspan="'+colspan+'">' +
                                    'Sin datos' +
                                '</td>'
                            '</tr>';
        
                        // Agregamos el cuerpo de la tabla
                        $('.table tfoot').html(tbody);
                    } else {
                        // Recorremos los datos
                        $.each(data.list, function (i, item) {
                            // Abrimos el <tr> // Si tenemos que responder lo ponemos como negrita
                            tbody += item.answer == 1 ? '<tr class="font-weight-bold">' : '<tr>';
                            // Recorremos los <td>
                            for(const order in orderColumn){
                                var column = orderColumn[order];
                                
                                switch(orderColumn[order]){
                                    case '#':
                                        tbody +=
                                            '<td>' +
                                                '<a class="text-dark text-decoration-none" href="' + a_href + '?ticket=' + item.id + '">' +
                                                    item.id +
                                                '</a>' +
                                            '</td>';
                                        break;
                                        
                                    case 'De':
                                        tbody +=
                                            '<td>' +
                                                '<a class="text-dark text-decoration-none" href="' + a_href + '?ticket=' + item.id + '">' +
                                                    item.from +
                                                '</a>' +
                                            '</td>';
                                        break;
                                        
                                    case 'Creado':
                                        tbody +=
                                            '<td>' +
                                                '<a class="text-dark" href="' + a_href + '?ticket=' + item.id + '">' +
                                                    item.createDate +
                                                '</a>' +
                                            '</td>';
                                        break;
                                        
                                    case 'Asunto':
                                        tbody +=
                                            '<td>' +
                                                '<a class="text-dark text-decoration-none" href="' + a_href + '?ticket=' + item.id + '">' +
                                                    item.subject +
                                                '</a>' +
                                            '</td>';
                                        break;
                                        
                                    case 'Asignado':
                                        tbody +=
                                            '<td>' +
                                                '<a class="text-dark text-decoration-none" href="' + a_href + '?ticket=' + item.id + '">' +
                                                    item.assignaedTo +
                                                '</a>' +
                                            '</td>';
                                        break;
                                        
                                    case 'Estado':
                                        var classStatus = "";
                                        var val = "";
                                        if(item.status == 1) {
                                            val = "Abierto";
                                            classStatus = "text-success";
                                        } else {
                                            val = "Cerrado";
                                            classStatus = "text-secondary";
                                        }
                                        
                                        tbody +=
                                            '<td>' +
                                                '<a class="text-dark text-decoration-none" href="' + a_href + '?ticket=' + item.id + '">' +
                                                    '<span class="'+classStatus+'">'+ val + '</span>' +
                                                '</a>' +
                                            '</td>';
                                        break;
                                }
                            }
                            // Agregamos opciones que tenga
                            tbody +=
                                '<td>' +
                                    '<a class="text-dark" href="' + a_href + '?ticket=' + item.id + '">' +
                                        '<small class="form-inline">' +
                                            '<i class="material-icons">comment</i> ' +
                                            '<span class="pl-1">' + Object.keys(item.message).length + '</span>' +
                                        '</small>' +
                                    '</a>' +
                                '</td>';
                            tbody +=
                                '<td>' +
                                    '<a class="text-dark text-decoration-none">' +
                                        '<i id="ticket-eliminar" class="material-icons pointer text-danger" title="Eliminar ticket"' +
                                            ' data-uid="' + data.user_id + '" ' +
                                            ' data-page="' + data.page + '" ' +
                                            ' data-id="' + item.id + '" ' +
                                            ' >delete_forever</i>' +
                                    '</a>' +
                                '</td>';
                            // Cerramos el <tr>
                            tbody += '</tr>';
                        });
        
                        // Agregamos el cuerpo de la tabla
                        $('.table tbody').html(tbody);
        
                        // Cogemos el paginado que tendía la tabla
                        var pagination = createPaginate(data.user_id, data.page, data.total_page)
        
                        // Agregamos el paginado en el footer de la tabla
                        var tfoot =
                            '<tr>' +
                                '<td colspan="'+colspan+'">' +
                                    '<div class="row">' +
                                        '<div class="col-md-6">' +
                                            'Mostrando del ' + data.shown_page + ' de un total de ' + data.total_date + ' elementos' +
                                        '</div>' +
                                        '<div class="col-md-6">' +
                                            pagination +
                                        '</div>' +
                                    '</div>' +
                                '</td>'
                            '</tr>';
        
                        // Agregamos el cuerpo de la tabla
                        $('.table tfoot').html(tfoot);
                    }
                }

            //
            // Eliminar ticket
            //
                $(document).on('click', '#ticket-eliminar', function () {
                    let uid     = $(this).data('uid');
                    let id      = $(this).data('id');
                    let page    = $(this).data('page');
                    let opcion  = confirm("Eliminar el #Ticket " + id);
                    let data    = {
                        // Json que mandamos
                        name : 'messenger',
                        id   : id,
                    };

                    // Confirma que se elimina el ticket
                    if (opcion == true) {
                        // Eliminar dato
                        deleteJsonApi(data);
                        
                        // Damos el aviso
                        alert('Eliminado el #Ticket ' + id + ' correctamente');

                        // Volvemos a recargar los datos
                        var list = getList(uid = 'a5sa645-sa14', page_this = 1);
                        createTable(list);
                    }

                });

            //
            // Crear el paginado
            //
                function createPaginate(uid, page, page_total) {
                    var paginate = '<ul class="pagination display-block float-right">';
                    // Agregamos el usuario que estamos paginando
                    paginate += '<input id="paginate-uid" type="hidden" value="' + uid + '">';

                    // Si tenemos paginas
                    if (page > 1) {
                        paginate +=
                            '<li class="pointer">' +
                            '<a class="go_page" data-page="1">' +
                            '<i class="material-icons" title="Principio">fast_rewind</i>' +
                            '</a>' +
                            '</li>' +

                            '<li class="pointer">' +
                            '<a class="go_page" data-page="' + (page - 1) + '">' +
                            '<i class="material-icons" title="Volver">arrow_left</i>' +
                            '</a>' +
                            '</li>';
                    }

                    if (page_total > 0) {
                        paginate += '<li class="ml-2 mr-2">' + page + '/' + page_total + '</li>';
                    }

                    if (page < page_total) {
                        paginate +=
                            '<li class="pointer">' +
                            '<a class="go_page" data-page="' + (page + 1) + '">' +
                            '<i class="material-icons .display-1" title="Siguiente">arrow_right</i>' +
                            '</a>' +
                            '</li>' +

                            '<li class="pointer">' +
                            '<a class="go_page" data-page="' + page_total + '">' +
                            '<i class="material-icons" title="Final">fast_forward</i>' +
                            '</a>' +
                            '</li>';
                    }
                    paginate += '</ul>';

                    return paginate;
                }

            //
            // Pasar de pagina
            //
                $(document).on('click', '.go_page', function () {
                    let user_id = $('#paginate-uid').val();
                    let page    = $(this).data('page');

                    // Actualizar siguiente pagina
                    // Cargamos la tabla
                        createTable(getList(user_id, page));

                    // Json que mandamos
                    var ticket_page = {
                        method: 'ticket_page',
                        uid: user_id,
                        id: page,
                    };
                    console.log('Pasar paginas de ticket Json que mandamos:');
                    console.log(ticket_page);
                });

            //
            // Listado para probar
            //
                function getList(uid = 'a5sa645-sa14', page_this = 1) {
                    // Leer los datos
                        let data = readJsonApi('messenger');
                    
                    // Si no tenemos datos
                        if(!data){
                            return null;
                        }

                    // Donde meteremos los valores a cargar
                        let dataList     = {};

                    // Datos totales por pagina
                        let totalDatePage   = 10;
                        let totalDate       = Object.keys(data).length;
                        let totalPage       = Math.ceil(totalDate / totalDatePage);

                    // Crear cantidades aletorias dependiendo de la pagina en la que estemos
                        page_this_element = page_this == 1 ? page_this : ((page_this - 1) * totalDatePage) + 1;
                        page_total        = page_this_element + totalDatePage;
                    
                    // Metemos los datos de la pagina en la que estemos
                        let countDate = 1;
                        let page      = 1;
                        for (let key in data){
                            // Miramos cuantos datos vamos metiendo
                            if( dataList[page] === undefined || countDate <= totalDatePage ){
                                if (dataList[page] === undefined){
                                    // El primer dato dela pagina 1
                                    dataList[page] = {[key] : data[key]};
                                } else {
                                    // vamos metiendo datos en esta pagina
                                    dataList[page][key] = data[key];
                                }
                                countDate++;
                            } else {
                                // Siguientes datos para las demas paginas
                                // Se metiron 'totalDatePage = 10' metemos datos para la siguiente pagina 
                                page++;
                                countDate = 1;
                                dataList[page] = {[key] : data[key]};
                                countDate++;
                            }
                        }

                    // Json de lo que nos llegaria
                        var dataJson = {
                            user_id     : uid,                                          // Al usuario que le pertenece los tickets
                            total_date  : totalDate,                                    // cantidad total de elementos
                            total_page  : totalPage,                                    // total de paginas
                            page        : page_this,                                    // pagina en la que estamos
                            shown_page  : page_this_element + ' - ' + (page_total - 1), // cantidad mostrada por paginas 1 - 10
                            list        : dataList[page_this],                          // listado de tickets, de la pagina en la que estamos
                        };

                        console.log(dataJson);

                    // Devolver los datos
                        return dataJson;
                }
        </script>
        <!-- FIN Scripts -->
    </body>
</html>
