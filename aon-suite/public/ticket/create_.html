        <!-- Scripts -->
        <script src="../js/app.js"></script>
        <script>
            let theEditor;
            // Inicializamos CKEditor
            ClassicEditor.create( document.querySelector('#editor'),{
                language: 'es'
            })
            .then(editor => {
                theEditor = editor;
                $('<style type="text/css" scoped>.ck-editor .ck-editor__editable_inline {min-height: 200px !important;}</style>').insertAfter('#editor');
            })
            .catch( error => {
                console.error( error );
            } );

            // Array de estados del ticket
            var statusArray = ['Cerrado', 'Abierto', 'Resuelto'];

            $(document).ready(function(){
                // Datos del ticket en JSON
                var nuevoTicket = {
                    userIdLogin : "425",              // ID del usuario logueado
                    postings : {                        // destinos posibles
                        0 : {
                            id : 1,
                            name : "Programación"
                        },
                        1 : {
                            id : 2,
                            name : "Calidad"
                        },
                        2 : {
                            id : 3,
                            name : "Administración"
                        }
                    }
                };

                // Leemos los datos del ticket y rellenamos los datos necesarios
                for (const prop in nuevoTicket.postings) {
                    var posting = nuevoTicket.postings[prop];

                    $('#select-postings').append("<option value='"+posting.id+"'>"+posting.name+"</option>");
                }
            });

            // Enviar mensage nuevo
            $('#btn-send').click(function(){
                var envio = true;

                // Quitamos todos los errores
                $('.errores').each(function(){
                    $(this).addClass('d-none');
                });

                // Creamos el formData para enviar
                var formData = new FormData();

                // Añadimos los adjuntos
                var files = $("#attached")[0].files;

                for (const prop in files) {
                    formData.append('file', files[prop]);
                }

                // Añadimos el resto de datos del formulario
                var msgUser = theEditor.getData();
                if(msgUser == ''){
                    $('.error-msg').removeClass('d-none');
                    envio = false;
                }
                formData.append("message", msgUser);

                var subject = $("#subject").val();
                if(subject == ''){
                    $('.error-subject').removeClass('d-none');
                    envio = false;
                }
                formData.append('subject', subject);

                var theme = $("#select-theme").val();
                if(theme == ''){
                    $('.error-theme').removeClass('d-none');
                    envio = false;
                }
                formData.append('theme', theme);

                var postings = $("#select-postings").val();
                if(postings == ''){
                    $('.error-postings').removeClass('d-none');
                    envio = false;
                }
                formData.append('postings', postings);

                var priority = $("#select-priority").val();
                if(priority == ''){
                    $('.error-priority').removeClass('d-none');
                    envio = false;
                }
                formData.append('priority', priority);

                if(envio){
                    // Enviamos los datos del nuevo ticket por AJAX
                    // TO-DO
                    var respuesta = {
                        ticketId : '245673'
                    };

                    // Al recibir que se ha creado, recibiremos el id del ticket, devolvemos a la pantalla del ticket
                    document.location.href = "show.html?id="+respuesta.ticketId;
                } else {
                    return 0;
                }
            });
        </script>
