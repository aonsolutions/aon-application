    <body>
        <!-- start contenido centro -->

                    <!-- INICIO VISTA -->
                    <div class="col-12">
                        <div class="row">

                            </div>
                        </div>
                        <div class="row">

                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-5">
                        <div class="row">
                            <div class="col-12">
                                <select class="atp_input" id="postings" name="postings"></select>
                            </div>

                        <div class="row">

                                <form>
                                    <div class="row mt-3">

                                            <div id="ticket-comentario-subir">
                                                <div class="row m-2">

    <!-- Scripts -->
    <script src="../js/app.js"></script>

    <script>
        //
        // Cargamos el CKEditor
        //
            let theEditor;
            // Inicializamos CKEditor
            ClassicEditor.create( document.querySelector('#editor'),{
                language: 'es'
            })
            .then(editor => {
                theEditor = editor;
                $('<style type="text/css" scoped>.ck-editor .ck-editor__editable_inline {min-height: 200px !important;}</style>').insertAfter('#editor');
            })
            .catch( error => {
                console.error( error );
            } );
        //
        // FIN CKEditor
        //

        // Funciones para editar
        $(document).ready(function(){
            //
            // Cogemos los parametros por GET
            //
                let params = getAllGetParams();

                for(var i in params){
                    switch (params[i][0]) {
                        case 'ticket':
                            //
                            // Leemos el ticket en el que estamos
                            // Como variables generales
                            //
                            let tickets = readJsonApi('messenger');
                            let key     = params[i][1];
                            // Como varible general para poder usarla
                            ticket  = (tickets[key]) ? tickets[key] :  alert('No existen datos');
                        break;
                    
                        default:
                            break;
                    }
                }

            //
            // Montamos la estructura, si tenemos datos
            //
                if (ticket !== undefined) {
                    // Departamento se llama postings como esta almacenado
                    let departament = [
                        '',             // En el primer valor no existe dato
                        "Programación",
                        "Calidad",
                        "Administración"
                    ];
                    
                    for(const keyDpt in departament){
                        if(departament[keyDpt] != ''){
                            var selected = false;
                            if(departament[ticket.postings] == departament[keyDpt]){
                                selected = true; 
                            }
                            $('#postings').append($('<option />',{
                                text : departament[keyDpt],
                                value : keyDpt,
                                selected : selected
                            }));
                        }
                    }

                    // Mostrar los datos
                    $('#id').html(ticket.id);
                    $('#subject').html(ticket.subject);
                    //$('#postings').html(departament[ticket.postings]);
                    $('#createDate').html(ticket.createDate);
                    $('#from').html(ticket.from);
                    $('#assignaedTo').html(ticket.assignaedTo);

                    // Añadimos al boton el data del UID del usuario logueado y el ID del ticket
                    // Usamos los nombres, pero tendría que ser los UID
                    $('#btn-send').attr('data-uid', ticket.from);
                    $('#btn-send').attr('data-id', ticket.id);
                    
                    // Formateamos los mensajes
                    // Usamos los nombres, pero tendría que ser los UID
                    var mensajesTickets = ticket.message;
                    // Convertimos el objeto a array para darle la vuelta y poner el
                    // más reciente arriba
                    var array = $.map(mensajesTickets, function(value, index) {
                        return [value];
                    });
                    mensajesTickets = array.reverse();
                    // Volvemos a convertirlo a Objeto para enviar a la función
                    mensajesTickets = Object.assign({}, mensajesTickets);
                    
                    let msg = messages(mensajesTickets, ticket.from);
                    
                    // Sacamos todos los adjuntos
                    var adjuntosTicket = adjuntosTicketTotal(mensajesTickets);
                    
                    // Mostramos los mensajes
                    $('#ticket-messages').html(msg);

                } else {
                    // No existe el dato, no permitimos el envio
                    $('#btn-send').addClass('hidden');
                }
        });

        // Enviar mensage nuevo
        $('#btn-send').click(function(){
            let id          = $(this).data('id');
            let from        = $(this).data('uid');
            let messageText = theEditor.getData();

            if (messageText != ''){
                // Coger documentos
                    let files     = document.getElementById("upload-file").files;
                    let filesName = {};
                    // Recorremos
                    for (let i = 0; i < files.length; i++){
                        // Agregamos dato
                        filesName[i] = files[i].name;
                    }

                // Recogemos los datos del mensaje nuevo
                let messageData = {
                    userName     : from,                                        // Nombre del usuario del mensaje
                    userId       : "425",                                       // ID del usuario que crea el ticket
                    userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                    messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje
                    message      : messageText,                                 // Mensaje
                    documents    : filesName                                    // Docuemntos
                };
    
                // Lo agregamos al resto
                ticket.message[Object.keys(ticket.message).length + 1] = messageData;

                // Mostramos el mensaje
                let msg = messages( {0 : messageData}, from);
                $('#ticket-messages').prepend(msg);
                
                // Enviamos para añadir los documentos (si hubiese) a la lista de adjuntos
                adjuntosTicketTotal({0 : messageData});
    
                // Limpiamos el editor
                theEditor.setData('');

                // Limpiar apartado de subir documentos
                $("#upload-file").val('');
                $(".archivos-previos").html('');
                
                //
                // Almacenamos los cambios en localStorage
                //
                    // Almacenamos el cambio del estado
                    let dataUpdateStatus = {
                        name        : 'messenger',
                        json        : ticket
                    };
                    updateJsonApi(dataUpdateStatus);
            } else {
                alert('Rellene para poder enviar');
            }
        });
        
        // Si cambiamos el destinatario, generamos una acción
        $(document).on('change', '#postings', function(){
            let id          = $('#btn-send').data('id');
            let from        = $('#btn-send').data('uid');
            var posting     = $(this);
            
            let messageData = {
                userName     : from,                                        // Nombre del usuario del mensaje
                userId       : "425",                                       // ID del usuario que crea el ticket
                messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje
                action       : {
                    message : "ha cambiado el destinatario a",
                    change  : posting.val(),
                    changeName : $('#postings option:selected').text(),
                    icon : "swap_horizontal_circle"
                }
            };
            
            var ticketActual = ticket;
            var nuevoTicket = {};
            for(const keyTck in ticketActual){
                ticketActual.postings = posting.val();
                
                nuevoTicket = ticketActual;
            }
            
            // Mostramos el mensaje de accion
            var msg = messages( { 0 : messageData }, from);
            $('#ticket-messages').prepend(msg);
            
            // Lo agregamos al resto
            nuevoTicket.message[Object.keys(nuevoTicket.message).length + 1] = messageData;
            
            //
            // Almacenamos los cambios en localStorage
            //
            // Almacenamos el cambio del estado
            let dataUpdateStatus = {
                name        : 'messenger',
                json        : nuevoTicket
            };
            updateJsonApi(dataUpdateStatus);
            
        });

        // Formatea el json de mensajes para mostrarlos
        function messages(messages, userLogin){
            let msg = "";
            
            for (const key in messages) {
                let message = messages[key];
                
                // Si no es una acción, sino que es un mensaje
                if(!message.action || message.action.length == 0){
                    // Tendría que comprar UID no nombres
                    if(message.userName == userLogin){ // El mensaje es del usuario logueado
                        msg += "<li class='right clearfix'>";
                            msg += "<div class='col-12 pt-2 pb-2 pl-5 '>";
                                msg += "<div class='row clearfix caja_mensaje_ticket_from'>";
                                    msg += "<div class='col-12'>";
                                        msg += "<div class='row'>";
                                            msg += "<div class='col-11'>";
                                                msg += "<div class='header'>";
                                                    msg += "<strong class='primary-font'>"+message.userName+"</strong>";
                                                    msg += "<small class='ml-2 text-muted'>"+message.messageDate+"</small>";
                                                msg += "</div>";
                                                msg += "<p>"+message.message+"</p>";
                                            msg += "</div>";
                                            msg += "<div class='col-1 p-0'>";
                                                msg += "<span class='ticket-img float-right'><img src='"+message.userAvatar+"' alt='User Avatar'/></span>";
                                            msg += "</div>";
                                        msg += "</div>";
                                    msg += "</div>";
                                    msg += "<div class='col-12'>";
                                        // Adjuntos
                                        if(message.documents && Object.keys(message.documents).length > 0){
                                            msg += "<div class='row pt-2 pb-2 adjuntos_mensaje'>";
                                                msg += "<div class='col-1'>";
                                                    msg += "<span class='material-icons align-middle'>attach_file</span>";
                                                msg += "</div>";
                                                msg += "<div class='col-11 pl-0'>";
                                                    for (const key in message.documents) {
                                                        msg += "<button class='btn btn-link mr-2'>"+message.documents[key]+"</button>";
                                                    }
                                                msg += "</div>";
                                            msg += "</div>";
                                        }
                                    msg += "</div>";
                                msg += "</div>";
                            msg += "</div>";
                        msg += "</li>";
                    } else { // El mensaje es respuesta al usuario que está leyendo
                        msg += "<li class='left clearfix'>";
                            msg += "<div class='col-12 pt-2 pb-2 pr-5'>";
                                msg += "<div class='row clearfix caja_mensaje_ticket_to'>";
                                    msg += "<div class='col-12'>";
                                        msg += "<div class='row'>";
                                            msg += "<div class='col-1 p-0'>";
                                                msg += "<span class='ticket-img float-left'><img src='"+message.userAvatar+"' alt='User Avatar'/></span>";
                                            msg += "</div>";
                                            msg += "<div class='col-11'>";
                                                msg += "<div class='header'>";
                                                    msg += "<strong class='primary-font'>"+message.userName+"</strong>";
                                                    msg += "<small class='ml-2 text-muted'>"+message.messageDate+"</small>";
                                                msg += "</div>";
                                                msg += "<p>"+message.message+"</p>";

                                            msg += "</div>";
                                        msg += "</div>";
                                    msg += "</div>";
                                    msg += "<div class='col-12'>";
                                        // Adjuntos
                                        if(message.documents && Object.keys(message.documents).length > 0){
                                            msg += "<div class='row pt-2 pb-2 adjuntos_mensaje'>";
                                                msg += "<div class='col-1'>";
                                                    msg += "<span class='material-icons align-middle'>attach_file</span>";
                                                msg += "</div>";
                                                msg += "<div class='col-11 pl-0'>";
                                                    for (const key in message.documents) {
                                                        msg += "<button class='btn btn-link mr-2'>"+message.documents[key]+"</button>";
                                                    }
                                                msg += "</div>";
                                            msg += "</div>";
                                        }
                                    msg += "</div>";
                                msg += "</div>";
                            msg += "</div>";
                        msg += "</li>";
                    }
                } else {
                    var action = message.action;
                    
                    var icon = "swap_horizontal_circle";
                    if(action.icon){
                        icon = action.icon;
                    }
                    
                    msg += "<li class='right clearfix'>";
                        msg += "<div class='col-12 pt-1 pb-2 pl-5 caja_accion'>";
                            msg += "<div class='row'>";
                                msg += "<div class='col-1 offset-1'>";
                                    msg += "<span class='material-icons'>"+icon+"</span>";
                                msg += "</div>";
                                msg += "<div class='col-7 pl-0'>";
                                    msg += "<label class='text-center'><strong class='primary-font'>" + message.userName + "</strong> " + action.message + " <strong class='primary-font'>" +action.changeName + "</strong></label>" ;
                                msg += "</div>";
                                msg += "<div class='col-3 justify-content-right'>";
                                    msg += "<small class='text-right'>"+ message.messageDate+"</small>";
                                msg += "</div>";
                            msg += "</div>";
                        msg += "</div>";
                    msg += "</li>";
                }
            }

            return msg;
        }

        //
        // Subir imagenes (ficticiamente)
        //
        if (typeof UploadDocumentos !== 'undefined') {
            // Esta cargado correctamente
            UploadDocumentos();
        }
        
        /*
         * Creamos una tabla con todos los adjuntos del ticket
         */
        function adjuntosTicketTotal(mensajes){
            var hayAdjuntos = false;
            
            // Comprobamos si existe ya la lista
            if ( $("#listado_adjuntos").length ) {
                // Recorremos los mensajes y añadimos al principio de la lista
                var lista = "";
                for(const i in mensajes){
                    var mensaje = mensajes[i];

                    if(mensaje.documents && Object.keys(mensaje.documents).length > 0){
                        for(const iAdjunto in mensaje.documents){
                            lista += "<li class='list-group-item'>";
                                lista += "<div class='col-12'>";
                                    lista += "<div class='row'>";
                                        lista += "<div class='col-11'>";
                                            lista += "<span class='align-middle'>"+mensaje.documents[iAdjunto]+"</span>";
                                        lista += "</div>";
                                        lista += "<div class='col-1'>";
                                            lista += "<a href='#'><span class='material-icons align-middle' data-doc='"+iAdjunto+"' data-msg='"+i+"'>save_alt</span></a>";
                                        lista += "</div>";
                                    lista += "</div>";
                                lista += "</div>";
                            lista += "</li>";
                        }
                        hayAdjuntos = true;
                    }
                }
                
                if(hayAdjuntos){
                    $("#listado_adjuntos").prepend(lista);
                }
            } else {
                var lista = "<ul class='list-group list-group-flush' id='listado_adjuntos'>";
                for(const i in mensajes){
                    var mensaje = mensajes[i];

                    if(mensaje.documents && Object.keys(mensaje.documents).length > 0){
                        for(const iAdjunto in mensaje.documents){
                            lista += "<li class='list-group-item'>";
                                lista += "<div class='col-12'>";
                                    lista += "<div class='row'>";
                                        lista += "<div class='col-11'>";
                                            lista += "<span class='align-middle'>"+mensaje.documents[iAdjunto]+"</span>";
                                        lista += "</div>";
                                        lista += "<div class='col-1'>";
                                            lista += "<a href='#'><span class='material-icons align-middle' data-doc='"+iAdjunto+"' data-msg='"+i+"'>save_alt</span></a>";
                                        lista += "</div>";
                                    lista += "</div>";
                                lista += "</div>";
                            lista += "</li>";
                        }
                        hayAdjuntos = true;
                    }
                }
                lista += "</ul>";

                // Si hay adjuntos, creamos la tabla
                if(hayAdjuntos){
                    var card = "<div class='card'>";
                        card += "<div class='card-header'>";
                            card += "<div class='col-12'>";
                                card += "<div class='row'>";
                                    card += "<div class='col-8'>";
                                        card += "Adjuntos";
                                    card += "</div>";
                                    card += "<div class='col-4 text-right pr-0'>";
                                        card += "<a href='#'>Descargar todo</a>";
                                    card += "</div>";
                                card += "</div>";
                            card += "</div>";
                        card += "</div>";
                        card += "<div class='card-body'>";
                            card += lista;
                        card += "</div>";
                    card += "</div>";

                    $('#div_adjuntos').html(card);
                }
            }
        }
    </script>
    <!-- FIN Scripts -->
