                        <div class="row">
                            <div class="col-12">
                                <table cellspacing="0" cellpadding="0" width="100%" border="0">
                                    <tbody>
                                        <tr>
                                            <td width="50%">
                                                <table border="0" cellspacing="" cellpadding="4" width="100%">

                                                        <tr>
                                                            <th>Departamento:</th>

                                                        <tr>

                                                </table>
                                            </td>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="../js/crud.js"></script>
    <script>
        //
        // Cargamos el CKEditor
        //
            let theEditor;
            // Inicializamos CKEditor
            ClassicEditor.create( document.querySelector('#editor'),{
                language: 'es'
            })
            .then(editor => {
                theEditor = editor;
                $('<style type="text/css" scoped>.ck-editor .ck-editor__editable_inline {min-height: 200px !important;}</style>').insertAfter('#editor');
            })
            .catch( error => {
                console.error( error );
            } );
        //
        // FIN CKEditor
        //

        // Funciones para editar
        $(document).ready(function(){
            //
            // Cogemos los parametros por GET
            //
                let params = getAllGetParams();

                for(var i in params){
                    switch (params[i][0]) {
                        case 'ticket':
                            //
                            // Leemos el ticket en el que estamos
                            // Como variables generales
                            //
                            let tickets = readJsonApi('messenger');
                            let key     = params[i][1];
                            // Como varible general para poder usarla
                            ticket  = (tickets[key]) ? tickets[key] :  alert('No existen datos');
                        break;
                    
                        default:
                            break;
                    }
                }

            //
            // Montamos la estructura, si tenemos datos
            //
                if (ticket !== undefined) {
                    // Departamento se llama postings como esta almacenado
                    let departament = [
                        '',             // En el primer valor no existe dato
                        "Programación",
                        "Calidad",
                        "Administración",
                    ];

                    console.log(ticket);

                    // Mostrar los datos
                    $('#id').html(ticket.id);
                    $('#subject').html(ticket.subject);
                    $('#postings').html(departament[ticket.postings]);
                    $('#createDate').html(ticket.createDate);
                    $('#from').html(ticket.from);
                    $('#assignaedTo').html(ticket.assignaedTo);

                    // Añadimos al boton el data del UID del usuario logueado y el ID del ticket
                    // Usamos los nombres, pero tendría que ser los UID
                    $('#btn-send').attr('data-uid', ticket.from);
                    $('#btn-send').attr('data-id', ticket.id);
                    
                    // Formateamos los mensajes
                    // Usamos los nombres, pero tendría que ser los UID
                    let msg = messages(ticket.message, ticket.from);
                    
                    // Mostramos los mensajes
                    $('#ticket-messages').html(msg);

                } else {
                    // No existe el dato, no permitimos el envio
                    $('#btn-send').addClass('hidden');
                }
        });

        // Enviar mensage nuevo
        $('#btn-send').click(function(){
            let id          = $(this).data('id');
            let from        = $(this).data('uid');
            let messageText = theEditor.getData();

            if (messageText != ''){
                // Recogemos los datos del mensaje nuevo
                let messageData = {
                    userName     : from,                                        // Nombre del usuario del mensaje
                    userId       : "425",                                       // ID del usuario que crea el ticket
                    userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                    messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje
                    message      : messageText,                                 // Mensaje
                }
    
                // Lo agregamos al resto
                ticket.message[Object.keys(ticket.message).length + 1] = messageData;

                // Mostramos el mensaje
                console.log(messageData);
                let msg = messages( ticket.message, from);
                $('#ticket-messages').html(msg);
    
                // Limpiamos el editor
                theEditor.setData('');
    
                //
                // Almacenamos los cambios en localStorage
                //
                    // Almacenamos el cambio del estado
                    let dataUpdateStatus = {
                        name        : 'messenger',
                        json        : ticket,
                    };
                    updateJsonApi(dataUpdateStatus);
            } else {
                alert('Rellene para poder enviar')
            }
        });

        // Formatea el json de mensajes para mostrarlos
        function messages(messages, userLogin){
            let msg = "";

            for (const key in messages) {
                let message = messages[key];
                // Tendría que comprar UID no nombres
                if(message.userName == userLogin){ // El mensaje es del usuario logueado
                    msg += "<li class='right clearfix'>";
                        msg += "<div class='col-12 pt-2 pb-2 pl-5'>";
                            msg += "<div class='row clearfix'>";
                                msg += "<div class='col-11 border-from'>";
                                    msg += "<div class='header'>";
                                        msg += "<strong class='primary-font'>"+message.userName+"</strong>";
                                        msg += "<small class='ml-2 text-muted'>"+message.messageDate+"</small>";
                                    msg += "</div>";
                                    msg += "<p>"+message.message+"</p>";
                                msg += "</div>";
                                msg += "<div class='col-1'>";
                                    msg += "<span class='ticket-img float-right'><img src='"+message.userAvatar+"' alt='User Avatar'/></span>";
                                msg += "</div>";
                            msg += "</div>";
                        msg += "</div>";
                    msg += "</li>";
                } else { // El mensaje es respuesta al usuario que está leyendo
                    msg += "<li class='left clearfix'>";
                        msg += "<div class='col-12 pt-2 pb-2 pr-5'>";
                            msg += "<div class='row clearfix'>";
                                msg += "<div class='col-1'>";
                                    msg += "<span class='ticket-img float-left'><img src='"+message.userAvatar+"' alt='User Avatar'/></span>";
                                msg += "</div>";
                                msg += "<div class='col-11 border-to'>";
                                    msg += "<div class='header'>";
                                        msg += "<strong class='primary-font'>"+message.userName+"</strong>";
                                        msg += "<small class='ml-2 text-muted'>"+message.messageDate+"</small>";
                                    msg += "</div>";
                                    msg += "<p>"+message.message+"</p>";
                                msg += "</div>";
                            msg += "</div>";
                        msg += "</div>";
                    msg += "</li>";
                }
            }

            return msg;
        }
    </script>
    <!-- FIN Scripts -->
