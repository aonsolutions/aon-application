    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script>
        //
        // Cargamos las funciones
        //
        $(document).ready(function () {
            // Cogemos el listado de datos para mostrar
            var list = getList();
            

            createTable(list);
        });
        
        //
        // Creamos la tabla con los datos a listar
        //
        function createTable(data) {
            // recorremos los datos a mostrar
            var tbody = '';

            $.each(data.nominas, function (i, item) {
                // Primero recorremos los datos, el genera, es la cabecera del desglose
                tbody += '<tr>';
                    tbody += "<td>"+item.fecha+"</td>";
                    tbody += "<td>"+item.nomina+"</td>";
                    tbody += "<td><i class='material-icons pointer nomina_download' title='Descargar nómina' data-nomina='"+item.nominaId+"'>save_alt</i></td>";
                tbody += '</tr>';
            });

            // Agregamos el cuerpo de la tabla
            $('#table_nominas tbody').html(tbody);

            // Cogemos el paginado que tendía la tabla
            var pagination = createPaginate(data.userId, data.page, data.totalPage);

            // Agregamos el paginado en el footer de la tabla
            var tfoot ='<tr>' +
                '<td colspan="7">' +
                    '<div class="row">' +
                        '<div class="col-md-6">' +
                            'Mostrando del ' + data.shownPage + ' de un total de ' + data.totalDate + ' elementos' +
                        '</div>' +
                        '<div class="col-md-6">' +
                            pagination +
                        '</div>' +
                    '</div>' +
                '</td>'
            '</tr>';

            // Agregamos el cuerpo de la tabla
            $('#table_nominas tfoot').html(tfoot);
        }

        //
        // Listado para probar
        //
        function getList(uid = 'a5sa645-sa14', pageThis = 1) {
            // Enviamos el usuarioID y el año que queremos
            var nominas = {
                0 : {
                    fecha : "27-01-2020",
                    nomina : "Nomina_enero_2020.pdf",
                    nominaId : 1
                },
                1 : {
                    fecha : "28-02-2020",
                    nomina : "Nomina_febrero_2020.pdf",
                    nominaId : 2
                },
                2 : {
                    fecha : "28-03-2020",
                    nomina : "Nomina_marzo_2020.pdf",
                    nominaId : 3
                },
                3 : {
                    fecha : "29-04-2020",
                    nomina : "Nomina_abril_2020.pdf",
                    nominaId : 4
                },
                4 : {
                    fecha : "25-05-2020",
                    nomina : "Nomina_mayo_2020.pdf",
                    nominaId : 5
                },
                5 : {
                    fecha : "26-06-2020",
                    nomina : "Nomina_junio_2020.pdf",
                    nominaId : 6
                }
            };

            var pageThisElement = pageThis == 1 ? pageThis : ((pageThis - 1) * 10) + 1;
            var pageTotal       = pageThisElement + 10;

            // Json que nos llegaria
            let json = {
                userId      : uid,                                          // Al usuario que le pertenece los tickets
                totalDate   : 100,                                          // cantidad total de elementos
                totalPage   : 10,                                           // total de paginas
                page        : pageThis,                                     // pagina en la que estamos
                shownPage   : pageThisElement + ' - ' + (pageTotal - 1),    // cantidad mostrada por paginas 1 - 10
                nominas     : nominas                                       // listado de datos
            };

            // Devolver los datos
            return json;
        }

        function createPaginate(uid, page, page_total) {
            var paginate = '<ul class="pagination display-block float-right">';
            // Agregamos el usuario que estamos paginando
            paginate += '<input id="paginate-uid" type="hidden" value="' + uid + '">';

            // Si tenemos paginas
            if (page > 1) {
                paginate +=
                    '<li class="pointer">' +
                    '<a class="go_page" data-page="1">' +
                    '<i class="material-icons" title="Principio">fast_rewind</i>' +
                    '</a>' +
                    '</li>' +

                    '<li class="pointer">' +
                    '<a class="go_page" data-page="' + (page - 1) + '">' +
                    '<i class="material-icons" title="Volver">arrow_left</i>' +
                    '</a>' +
                    '</li>';
            }

            if (page_total > 0) {
                paginate += '<li class="ml-2 mr-2">' + page + '/' + page_total + '</li>';
            }

            if (page < page_total) {
                paginate +=
                    '<li class="pointer">' +
                    '<a class="go_page" data-page="' + (page + 1) + '">' +
                    '<i class="material-icons .display-1" title="Siguiente">arrow_right</i>' +
                    '</a>' +
                    '</li>' +

                    '<li class="pointer">' +
                    '<a class="go_page" data-page="' + page_total + '">' +
                    '<i class="material-icons" title="Final">fast_forward</i>' +
                    '</a>' +
                    '</li>';
            }
            paginate += '</ul>';

            return paginate;
        }

        //
        // Pasar de pagina
        //
        $(document).on('click', '.go_page', function () {
            var userId = $('#paginate-uid').val();
            var page = $(this).data('page');
            var list = getList(userId, page);
            createTable(list);
            // Json que mandamos
            var ticket_page = {
                method: 'nominas_page',
                uid: userId,
                id: page,
            };
        });
        
        $(document).on('click', '.nomina_download', function(){
            var nominaId = $(this).data('nomina');
            
            alert('Descarga nómina '+nominaId);
        });
    </script>
    <!-- FIN Scripts -->
