        //
        // Coger parametros por get
        //
            function getAllGetParams() {
                let result  = [];
                let parts   = [];

                location.search
                    .substr(1)
                    .split("&")
                    .forEach(function (item) {
                        parts = item.split("=");
                        if(parts[0]!=""){     
                            result.push(parts);
                        }
                });

                return result;
            }

        //
        // Coger valores del formulario
        //
            function dataForm(formID){
                let fields   = 'input, select, textarea'
                let formData = {};

                $(formID).find(fields).each(function () {
                    if( this.type == 'radio' || this.type == 'checkbox'){
                        // Coger solo el valor con checked
                        if(this.checked){
                            formData[this.name] = this.value;
                        }
                    } else {
                        formData[this.name] = this.value;
                    }
                });

                return formData;
            }

        //
        // Rellenar formulario
        //
            function fillForm(formID){
                let fields   = 'input, select, textarea'
                
                $(formID).find(fields).each(function () {
                    switch (this.type) {
                        // Texto
                        case 'text':
                            switch (this.name) {
                                case 'nombre':
                                    $( "input[name*='"+this.name+"']" ).val("Manolo");
                                    break;
                                case 'dni':
                                    $( "input[name*='"+this.name+"']" ).val("91556716H");
                                    break;
                                case 'naf':
                                    $( "input[name*='"+this.name+"']" ).val("016896821030");
                                    break;
                                case 'nacionalidad':
                                    $( "input[name*='"+this.name+"']" ).val("España");
                                    break;
                                case 'domicilio':
                                    $( "input[name*='"+this.name+"']" ).val("calle de manolo");
                                    break;
                                    
                                default:
                                    $( "input[name*='"+this.name+"']" ).val("texto que ponemos en los input text...");
                                    break;
                            }
                        break;
                        // Numerico
                        case 'number':
                            switch (this.name) {
                                case 'cp':
                                    $( "input[name*='"+this.name+"']" ).val(11405);
                                    break;
                                
                                default:
                                    break;
                            }
                        break;
                        // Fecha
                        case 'date':
                            let now = new Date();
                            let day = ("0" + now.getDate()).slice(-2);
                            let month = ("0" + (now.getMonth() + 1)).slice(-2);
                            let today = now.getFullYear()+"-"+(month)+"-"+(day) ;
                            $( "input[name*='"+this.name+"']" ).val(today);
                        break;

                        default:
                            // Select
                            $( "select[name*='"+this.name+"']" ).val(1);
                            // Texto
                            $( "textarea[name*='"+this.name+"']" ).val("texto que ponemos en los textarea...");
                            break;
                    }
                });
            }
