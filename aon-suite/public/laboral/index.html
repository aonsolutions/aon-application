        <script src="../js/app.js"></script>
        <script>
            //
            // Cargamos las funciones
            //
            $(document).ready(function () {
                // Cogemos el listado de datos para mostrar
                var list = getList();

                createTable(list);

                //
                // Creamos la tabla con los datos a listar
                //
                function createTable(data) {
                    // recorremos los datos a mostrar
                    let tbody = '';
                    let aHref = 'index.html';
                    $.each(data.dateList, function (i, item) {
                        // Abrimos el <tr> // Si tenemos que responder lo ponemos como negrita
                        tbody += item.answer == 1 ? '<tr class="font-weight-bold">' : '<tr>';
                        // Recorremos los <td>    
                        $.each(item, function (key, val) {
                            switch (key) {
                                case 'id':
                                    // No metemos el ID
                                    break;  
                                default:
                                    tbody +=
                                        '<td>' +
                                            '<a class="text-dark" href="' + aHref + '?id=' + item.id + '">' +
                                                val +
                                            '</a>' +
                                        '</td>';
                                    break;
                            }
                        });
                        // Cerramos el <tr>
                        tbody += '</tr>';
                    });

                    // Agregamos el cuerpo de la tabla
                    $('.table tbody').html(tbody);

                    // Cogemos el paginado que tendía la tabla
                    var pagination = createPaginate(data.userId, data.page, data.totalPage)

                    // Agregamos el paginado en el footer de la tabla
                    var tfoot =
                        '<tr>' +
                        '<td colspan="7">' +
                        '<div class="row">' +
                        '<div class="col-md-6">' +
                        'Mostrando del ' + data.shownPage + ' de un total de ' + data.totalDate + ' elementos' +
                        '</div>' +
                        '<div class="col-md-6">' +
                        pagination +
                        '</div>' +
                        '</div>' +
                        '</td>'
                    '</tr>';

                    // Agregamos el cuerpo de la tabla
                    $('.table tfoot').html(tfoot);

                    // console.log(tbody);
                }

                // 
                // Crear el paginado
                //
                function createPaginate(uid, page, page_total) {
                    var paginate = '<ul class="pagination display-block float-right">';
                    // Agregamos el usuario que estamos paginando
                    paginate += '<input id="paginate-uid" type="hidden" value="' + uid + '">';

                    // Si tenemos paginas
                    if (page > 1) {
                        paginate +=
                            '<li class="pointer">' +
                            '<a class="go_page" data-page="1">' +
                            '<i class="material-icons" title="Principio">fast_rewind</i>' +
                            '</a>' +
                            '</li>' +

                            '<li class="pointer">' +
                            '<a class="go_page" data-page="' + (page - 1) + '">' +
                            '<i class="material-icons" title="Volver">arrow_left</i>' +
                            '</a>' +
                            '</li>';
                    }

                    if (page_total > 0) {
                        paginate += '<li class="ml-2 mr-2">' + page + '/' + page_total + '</li>';
                    }

                    if (page < page_total) {
                        paginate +=
                            '<li class="pointer">' +
                            '<a class="go_page" data-page="' + (page + 1) + '">' +
                            '<i class="material-icons .display-1" title="Siguiente">arrow_right</i>' +
                            '</a>' +
                            '</li>' +

                            '<li class="pointer">' +
                            '<a class="go_page" data-page="' + page_total + '">' +
                            '<i class="material-icons" title="Final">fast_forward</i>' +
                            '</a>' +
                            '</li>';
                    }
                    paginate += '</ul>';

                    return paginate;
                }

                //
                // Pasar de pagina
                //
                $(document).on('click', '.go_page', function () {
                    var userId = $('#paginate-uid').val();
                    var page = $(this).data('page');
                    var list = getList(userId, page);
                    createTable(list);
                    // Json que mandamos
                    var ticket_page = {
                        method: 'ticket_page',
                        uid: userId,
                        id: page,
                    };
                    console.log('Pasar paginas de ticket Json que mandamos:');
                    console.log(ticket_page);
                });

                //
                // Listado para probar
                //
                function getList(uid = 'a5sa645-sa14', pageThis = 1) {
                    // estados
                    let state = ['Alta', 'Baja']
                    // contrato
                    let contract = ['', 'Indefinido ordinario (sin bonificaciones)</option>','Indefinido bonificado (consultar al asesor)','Temporal. Eventual*','Temporal. Obra y servicio*','Contrato en prácticas (consultar al asesor)','Contrato de formación (consultar al asesor)','Otros*'];
                    // nombre
                    let name = ['', 'Carmen', 'Angela', 'Manuela', 'Margarita', 'Maribel', 'Desi', 'Inma', 'Jessica', 'Estefanía', 'Nieves'];
                    // dni
                    let dni = ['', '27913427Y', 'Y1269617P', '54624330C', '57305799B', '42394347B', '67076377M', '08269661B', '29788478M', '65356620G', '16729030A'];
                    // naf
                    let naf = ['', '383668252610', '041920521019', '452627672159', '258918249605', '486250663335', '058676319005', '122039048217', '441460550189', '303373718407', '240735203700'];
                    // coste
                    let coste = ['', '1434,54 €', '1842,68 €', '2096,85 €', '1587,00 €', '2182,47 €', '1965,78 €', '1540,50 €', '1789,65 €', '1920,25 €', '2349,51 €'];
                    // Donde meteremos los valores
                    let dateList = {};
                    // Crear cantidades aletorias dependiendo de la pagina en la que estemos
                    pageThisElement = pageThis == 1 ? pageThis : ((pageThis - 1) * 10) + 1;
                    pageTotal       = pageThisElement + 10;
                    // Metemos los valores de los tickets aleatoriamente
                    for (let i = pageThisElement; i < pageTotal; i++) {
                        dateList[i] = {
                            id: i,                                                      // ID
                            state: state[Math.floor((Math.random() * 2))],              // Alta o baja
                            date: '15-08-2020 15:30',                                    // Fecha
                            contract: contract[Math.floor((Math.random() * 6) + 1)],    // Contrato
                            name: name[Math.floor((Math.random() * 10) + 1)],           // Usuario
                            dni: dni[Math.floor((Math.random() * 10) + 1)],             // DNI
                            naf: naf[Math.floor((Math.random() * 10) + 1)],             // NAF
                            coste : coste[Math.floor((Math.random() * 10) + 1)]         // coste
                        };
                    };

                    // Json de lo que nos llegaria
                    let date = {
                        userId      : uid,                                          // Al usuario que le pertenece los tickets
                        totalDate   : 100,                                          // cantidad total de elementos
                        totalPage   : 10,                                           // total de paginas
                        page        : pageThis,                                     // pagina en la que estamos
                        shownPage   : pageThisElement + ' - ' + (pageTotal - 1),    // cantidad mostrada por paginas 1 - 10
                        dateList    : dateList,                                     // listado de datos
                    };

                    console.log('Json que recibimos:');
                    console.log(date);

                    // Devolver los datos
                    return date;
                }
            });
        </script>
