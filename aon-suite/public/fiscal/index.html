        <!-- MATERIAL ICONS -->

    <body>
        <!-- start contenido centro -->
        <div class="col" id="atp_contenido_centro">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <!-- INICIO VISTA -->
                    <div class="col-12">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col" class="align-middle text-center">Modelo</th>
                                    <th scope="col" class="align-middle text-center">Estado</th>
                                    <th scope="col" class="align-middle text-center">Resultado</th>
                                    <th scope="col" class="align-middle text-center">Método de pago</th>
                                    <th scope="col" class="align-middle text-center">Nota</th>
                                    <th scope="col" class="align-middle text-center">Documento asociado</th>

                            </thead>
                            <tbody></tbody>
                            <tfoot></tfoot>
                        </table>

                    <!-- FIN VISTA -->
                </div>
            </div>

        <!-- end contenido centro -->

        <!-- Modales -->
        <div class="modal fade" id="info_modelo" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header font-weight-bold">
                        <span>Modelo <span id="numero_modelo_modal_info"></span></span>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-6 d-flex align-items-center">
                                <button class="btn btn-outline-secondary d-flex" id="ver_listado_modelo">
                                    <i class="material-icons list mr-1"></i>
                                    <span class="d-flex align-items-center">Listado</span>
                                </button>
                            </div>
                            <div class="col-6 d-flex flex-column align-items-end">
                                <span class="text-muted">Resultado</span>
                                <span id="resultado_modelo" class="font-weight-bold">-73,50€</span>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-sm btn-primary">Confirmar</button>
                        <button type="button" class="btn btn-sm btn-danger">Rectificar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="nota_modelo" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header font-weight-bold">
                        <span>Nota sobre el modelo <span id="numero_modelo_modal_nota"></span></span>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-12 d-flex align-items-center justify-content-between">
                                <span id="mensaje_nota"></span>
                                <i title="Eliminar nota" id="eliminar_nota" class="material-icons text-danger pointer">delete_forever</i>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="listado_modelo" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header font-weight-bold">
                        <span>Listado</span>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-12 d-flex align-items-center">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="../js/app.js"></script>
        <script>
            var data = {
                "list": [
                    {
                        "model": 303,
                        "status": "Presentado",
                        "result": 5238.21,
                        "paymentMethod": {
                            "text": "Aplazamiento / Fraccionamiento",
                            "number": "ES3330622260951433920930",
                            "installmentsInfo": {
                                "firstInstallmentDate": "05-09-2020",
                                "numberOfInstallments": 5
                            }
                        },
                        "note": null,
                        "fileURL": "https://via.placeholder.com/768/" // URL de prueba
                    },
                    {
                        "model": 115,
                        "status": "Rectificar",
                        "result": -98.75,
                        "paymentMethod": null,
                        "note": "Este modelo necesita rectificación, el importe de la casilla 2 no es correcto",
                        "fileURL": null
                    },
                    {
                        "model": 111,
                        "status": "Pendiente",
                        "result": -25.78,
                        "paymentMethod": null,
                        "note": null,
                        "fileURL": null
                    },
                    {
                        "model": 130,
                        "status": "Confirmado",
                        "result": 0,
                        "paymentMethod": {
                            "text": "Negativa"
                        },
                        "note": "No cuadra el importe total de la base imponible de los ingresos",
                        "fileURL": null
                    },
                    {
                        "model": 349,
                        "status": "En proceso",
                        "result": "Informativa",
                        "paymentMethod": null,
                        "note": null,
                        "fileURL": null
                    }
                ],
                "totalData": 5,
                "totalPage": 1,
                "page": 1,
                "shownPage": "1-5"
            };

            $(document).ready(function(){
                createTable(data);

                //
                // Creamos la tabla con los datos a listar
                //
                function createTable(data){
                    var list = data.list;

                    // Recorremos los datos a mostrar
                    var tbody = '';

                    if (list.length) {
                        $.each(list, function(i, item) {
                            var clickable = (item.status === 'En proceso') ? '' : 'pointer';
                            var result = '';

                            if (item.result !== null) {
                                result = (item.result === 'Informativa') ? item.result : formatearNumero(item.result) + '€';
                            }

                            tbody+= '<tr class="' + clickable + ' fila_modelo" data-numero_modelo="' + item.model + '" data-resultado_modelo="' + result + '" data-mensaje_nota="' + item.note + '">';

                                // Recorremos los <td>
                                $.each(item, function(key, val) {
                                    switch (key) {
                                        case 'result':
                                            tbody+= '<td class="text-center"><span>'+result+'</span></td>';
                                            break;
                                        case 'paymentMethod':
                                            var text = (val !== null && typeof val.text !== 'undefined' && val.text !== null) ? val.text : '';
                                            var number = (val !== null && typeof val.number !== 'undefined' && val.number !== null) ? val.number : '';

                                            tbody+= '' +
                                                '<td class="col-4">' +
                                                    '<div class="row">' +
                                                        '<div class="col-6">' + text + '</div>' +
                                                        '<div class="col-6">';

                                                            if (text !== '' && text === 'Aplazamiento / Fraccionamiento') {
                                                                var firstInstallmentDate = (val.installmentsInfo !== null && val.installmentsInfo.firstInstallmentDate !== null) ? val.installmentsInfo.firstInstallmentDate : '';
                                                                var numberOfInstallments = (val.installmentsInfo !== null && val.installmentsInfo.numberOfInstallments !== null) ? val.installmentsInfo.numberOfInstallments : '';

                                                                tbody+= '<p>Fecha primer plazo: ' + firstInstallmentDate + '</p>' +
                                                                    '<p>Nº plazos: ' + numberOfInstallments + '</p>' +
                                                                    '<p class="text-break">' + number + '</p>';
                                                            } else {
                                                                tbody+= '<span>' + number + '</span>';
                                                            }

                                                        tbody+= '</div>' +
                                                    '</div>' +
                                                '</td>';
                                            break;
                                        case 'note':
                                            var note = (val !== null) ? '<i title="Ver nota" class="material-icons ver_nota text-primary">sticky_note_2</i>' : '';

                                            tbody+= '<td class="text-center"><span>'+note+'</span></td>';
                                            break;
                                        case 'fileURL':
                                            var fileURL = (val !== null) ? '<a class="ver_documento_asociado" href="../documental/show.html?document=Presentación modelo 303.pdf"><i class="material-icons text-primary" title="Ver documento asociado">visibility</i></a>' : '';

                                            tbody+= '<td class="text-center"><span>'+fileURL+'</span></td>';
                                            break;
                                        default:
                                            tbody+= '<td class="text-center"><span>'+val+'</span></td>';
                                            break;
                                    }
                                });
                            // Cerramos el <tr>
                            tbody+= '</tr>';
                        });
                    } else {
                        tbody+= '' +
                            '<tr>'+
                                '<td colspan="6">'+
                                    '<div class="row">'+
                                        '<div class="col-12 text-center">'+
                                            'No existen datos para mostrar'
                                        '</div>'+
                                    '</div>'+
                                '</td>'
                            '</tr>';
                    }

                    // Agregamos el cuerpo de la tabla
                    $('.table tbody').append(tbody);

                    // Cogemos el paginado que tenía la tabla
                    var pagination = createPaginate(data.page, data.totalPage)

                    // Agregamos el paginado en el footer de la tabla
                    var tfoot = 
                    '<tr>'+
                        '<td colspan="6">'+
                            '<div class="row">'+
                                '<div class="col-md-6">'+
                                    'Mostrando del '+data.shownPage+' de un total de '+data.totalData+' elementos'+
                                '</div>'+
                                '<div class="col-md-6">'+
                                    pagination+
                                '</div>'+
                            '</div>'+
                        '</td>'
                    '</tr>';

                    // Agregamos el pie de la tabla
                    $('.table tfoot').html(tfoot);
                }

                // 
                // Crear el paginado
                //
                function createPaginate(page, pageTotal){
                    var paginate = '<ul class="pagination display-block float-right">';

                    // Si tenemos paginas
                    if (page > 1){ 
                        paginate+= 
                            '<li class="pointer">'+
                                '<a class="go_page" data-page="1">'+
                                    '<i class="material-icons" title="Principio">fast_rewind</i>'+
                                '</a>'+
                            '</li>'+
        
                            '<li class="pointer">'+
                                '<a class="go_page" data-page="'+(page-1)+'">'+
                                    '<i class="material-icons" title="Volver">arrow_left</i>'+
                                '</a>'+
                            '</li>';
                    }

                    if(pageTotal > 0){
                        paginate+= '<li class="ml-2 mr-2">'+page+'/'+pageTotal+'</li>';
                    }

                    if (page < pageTotal) {
                        paginate+= 
                            '<li class="pointer">'+
                                '<a class="go_page" data-page="'+(page+1)+'">'+
                                    '<i class="material-icons .display-1" title="Siguiente">arrow_right</i>'+
                                '</a>'+
                            '</li>'+
    
                            '<li class="pointer">'+
                                '<a class="go_page" data-page="'+pageTotal+'">'+
                                    '<i class="material-icons" title="Final">fast_forward</i>'+
                                '</a>'+
                            '</li>';
                    }
                    paginate+= '</ul>';

                    return paginate;
                }
            });

            //
            // Eventos
            //
                // Cuando se hace click en una fila del listado de modelos
                $(document).on('click', '.pointer.fila_modelo', function() {
                    var numeroModelo = $(this).data('numero_modelo');
                    var resultadoModelo = $(this).data('resultado_modelo');

                    // Insertamos en el título del modal el número del modelo
                    $('#numero_modelo_modal_info').text(numeroModelo);

                    // Insertamos en el modal el resultado del modelo
                    $('#resultado_modelo').text(resultadoModelo);

                    // Mostramos el modal
                    $('#info_modelo').modal();
                });

                // Cuando se hace click en el botón de Listado
                $(document).on('click', '#ver_listado_modelo', function() {
                    // Mostramos el modal
                    $('#listado_modelo').modal();
                });

                // Cuando se hace click en el icono de ver la nota asociada al modelo
                $(document).on('click', '.ver_nota', function(e) {
                    // Evitar que se ejecute el evento del elemento contenedor
                    e.stopPropagation();

                    var fila = $(this).closest('.fila_modelo');
                    var numeroModelo = fila.data('numero_modelo');
                    var mensajeNota = fila.data('mensaje_nota')

                    // Insertamos en el título del modal el número del modelo
                    $('#numero_modelo_modal_nota').text(numeroModelo);

                    // Insertamos en el modal el mensaje de la nota
                    $('#mensaje_nota').text(mensajeNota);

                    // Mostramos el modal
                    $('#nota_modelo').modal();
                });

                // Cuando se hace click en el icono de eliminar nota
                $(document).on('click', '#eliminar_nota', function(e) {
                    alert('Nota eliminada con éxito');

                    // Ocultamos el modal
                    $('#nota_modelo').modal('hide');
                });

                // Cuando se hace click en el icono de ver el documento asociado al modelo
                $(document).on('click', '.ver_documento_asociado', function(e) {
                    // Evitar que se ejecute el evento del elemento contenedor
                    e.stopPropagation();
                });

            function formatearNumero(valor) {
                var numero              = (isNaN(parseFloat(valor))) ? 0 : parseFloat(valor); // Si isNaN devuelve true es que no es un numero
                var conDecimales        = numero.toFixed(2); // toFixed devuelve un string
                var conSeparadorMiles   = parseFloat(conDecimales).toLocaleString("es");
                var formateado          = insertarCerosTrasComa(conSeparadorMiles);

                return formateado;
            }

            function insertarCerosTrasComa(numero, nCeros) {
                var separadoPorComas    = numero.split(",");
                var numeroConCeros      = numero;
                var nCerosInsertar      = nCeros || 2; // Por defecto si no se le pasa este parametro tendra el valor detras del OR (||)

                // No tiene decimales (numero entero)
                if (separadoPorComas.length == 1) {
                    numeroConCeros += ",";
                } else if (separadoPorComas.length == 2) { // Tiene decimales
                    var decimales = separadoPorComas[1];

                    nCerosInsertar = nCerosInsertar - decimales.length;
                }

                for (var i = 0; i < nCerosInsertar; i++) {
                    numeroConCeros += "0";
                }

                return numeroConCeros;
            }
        </script>
    </body >
