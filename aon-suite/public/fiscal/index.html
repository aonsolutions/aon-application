                //

                function createTable(data){
                    var list = (year == 2020 && quarter == 3) ? data.list : [];

                    // Recorremos los datos a mostrar
                    var tbody = '';

                    if (list.length) {
                        $.each(list, function(i, item) {
                            var clickable = (item.status === 'En proceso') ? '' : 'pointer';
                            var result = '';

                            if (item.result !== null) {
                                result = (item.result === 'Informativa') ? item.result : formatearNumero(item.result) + '€';
                            }

                            tbody+= '<tr class="' + clickable + ' fila_modelo" data-numero_modelo="' + item.model + '" data-resultado_modelo="' + result + '" data-mensaje_nota="' + item.note + '">';

                                // Recorremos los <td>
                                $.each(item, function(key, val) {
                                    switch (key) {
                                        case 'result':
                                            tbody+= '<td class="text-center"><span>'+result+'</span></td>';
                                            break;
                                        case 'paymentMethod':
                                            var text = (val !== null && typeof val.text !== 'undefined' && val.text !== null) ? val.text : '';
                                            var number = (val !== null && typeof val.number !== 'undefined' && val.number !== null) ? val.number : '';

                        }

                                        }
                                    });
                                tbodyContent += '</tr>';
                            });
                        } else {
                            const numberOfColumns = $('#' + prop + ' th').length;

                            tbodyContent += `<tr>
                                                <td colspan="${numberOfColumns}" class="text-center">
                                                    No existen datos para mostrar
                                                </td>
                                            </tr>`;
                        }

                        $('#' + prop + ' tbody').append(tbodyContent);
                    }

                    // Mostramos el modal
                    $('#listado_modelo').modal();
                });

                // Cuando se hace click en el botón de rectificar
                $(document).on('click', '#ver_rectificar', function(e) {

                    // Mostramos el modal
                    $('#rectificar_modelo').modal()
                });

                $(document).on('click', '#enviar_rectificar', function(e) {
                    alert('Modelo ' + window.numeroModelo + ' rectificado');

                    // Recargamos la página
                    document.location.reload();
                });

                // Cuando se hace click en el icono de ver la nota asociada al modelo
                $(document).on('click', '.ver_nota', function(e) {
                    // Evitar que se ejecute el evento del elemento contenedor
                    e.stopPropagation();

                    var fila = $(this).closest('.fila_modelo');
                    var numeroModelo = fila.data('numero_modelo');
                    var mensajeNota = fila.data('mensaje_nota')

                    // Insertamos en el título del modal el número del modelo
                    $('#numero_modelo_modal_nota').text(numeroModelo);

                    // Insertamos en el modal el mensaje de la nota
                    $('#mensaje_nota').text(mensajeNota);

                    // Mostramos el modal
                    $('#nota_modelo').modal();
                });

                // Cuando se hace click en el icono de eliminar nota
                $(document).on('click', '#eliminar_nota', function(e) {
                    var confirmed = confirm('¿Estás seguro de que deseas eliminar la nota?');

                    if (confirmed) {
                        alert('Nota eliminada con éxito');

                        // Ocultamos el modal
                        $('#nota_modelo').modal('hide');
                    }
                });

                // Cuando se hace click en el icono de ver el documento asociado al modelo
                $(document).on('click', '.ver_documento_asociado', function(e) {
                    // Evitar que se ejecute el evento del elemento contenedor
                    e.stopPropagation();
                });

            function formatearNumero(valor) {
                var numero              = (isNaN(parseFloat(valor))) ? 0 : parseFloat(valor); // Si isNaN devuelve true es que no es un numero
                var conDecimales        = numero.toFixed(2); // toFixed devuelve un string
                var conSeparadorMiles   = parseFloat(conDecimales).toLocaleString("es");
                var formateado          = insertarCerosTrasComa(conSeparadorMiles);

                return formateado;
            }

            function insertarCerosTrasComa(numero, nCeros) {
                var separadoPorComas    = numero.split(",");
                var numeroConCeros      = numero;
                var nCerosInsertar      = nCeros || 2; // Por defecto si no se le pasa este parametro tendra el valor detras del OR (||)

                // No tiene decimales (numero entero)
                if (separadoPorComas.length == 1) {
                    numeroConCeros += ",";
                } else if (separadoPorComas.length == 2) { // Tiene decimales
                    var decimales = separadoPorComas[1];

                    nCerosInsertar = nCerosInsertar - decimales.length;
                }

                for (var i = 0; i < nCerosInsertar; i++) {
                    numeroConCeros += "0";
                }

                return numeroConCeros;
            }
        </script>
    </body >
</html>
