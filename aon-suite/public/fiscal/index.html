        // Confirmar el modelo
        function confirmarModelo() {
            var idModal = 'confirmar_modelo';
            var header = '<span id="confirmar_modelo_header"></span>';
            var body = '<div class="atp_caja_form"><form id="formularioConfirmar" name="formularioConfirmar" action="#" method="post"><div id="confirmar_modelo_body" class="col-12"></div></form></div>';

            createModal(idModal, header, body, footer);
        }

        function createModal(idModal, header, body, footer) {
            var htmlModal = getModal(idModal, header, body, footer);
            $(htmlModal).appendTo("#zonaModal");
        }

        // Cuando se hace click en el botón de confirmar

            var header = "<span></span>";
            var body = "<span></span>";
            switch (window.numeroModelo) {
                case 115: case 111:

                    if (isNaN(window.resultadoOriginal)) {
                        // window.resultadoOriginal === 'Informativa'
                        header = "<span>Confirmar modelo</span>";
                        body = '<span>' + window.resultadoOriginal + '</span>' +
                            '<input name="resultado" type="hidden" value="' + window.resultadoOriginal + '">';

                    } else if (window.resultadoOriginal === 0) {
                        header = "<span>Declaración negativa</span>";
                        body = '<span>La declaración es negativa</span>' +
                            '<input name="resultado" type="hidden" value="La declaración es negativa">';

                    } else if (window.resultadoOriginal > 0 || window.resultadoOriginal < 0) {

                        // esta opción solo aparece cuando el cliente no es Basic

                            body = body +

                                '<input class="form-check-input chb" type="checkbox" name="domiciliadosRadios" id="nrcRadio" value="option2">' +
                                '<label class="form-check-label d-block atp_inputs" for="nrcRadio">' +
                                '<input type="text" class="campoLabel" id="ncrText" name="ncrText" >' +
                                '<span>NRC (Banca online u oficina bancaria)</span></label>' +
                                '</div>';
                            hay = true
                        }

                        if (!hay) {
                            body = "<span>Fuera de fecha</span>";
                        }

                    }
                    break;

                case 303:
                    if (isNaN(window.resultadoOriginal)) {
                        // window.resultadoOriginal === 'Informativa'
                        header = "<span>Confirmar modelo</span>";
                        body = "<span>" + window.resultadoOriginal + "</span>" +
                            '<input name="resultado" type="hidden" value="' + window.resultadoOriginal + '">';

                                    '<div class="form-check">' +

        function formatearNumero(valor) {
            var numero = (isNaN(parseFloat(valor))) ? 0 : parseFloat(valor); // Si isNaN devuelve true es que no es un numero
            var conDecimales = numero.toFixed(2); // toFixed devuelve un string
            var conSeparadorMiles = parseFloat(conDecimales).toLocaleString("es");
            var formateado = insertarCerosTrasComa(conSeparadorMiles);

            return formateado;
        }

        function insertarCerosTrasComa(numero, nCeros) {
            var separadoPorComas = numero.split(",");
            var numeroConCeros = numero;
            var nCerosInsertar = nCeros || 2; // Por defecto si no se le pasa este parametro tendra el valor detras del OR (||)

            // No tiene decimales (numero entero)
            if (separadoPorComas.length == 1) {
                numeroConCeros += ",";
            } else if (separadoPorComas.length == 2) { // Tiene decimales
                var decimales = separadoPorComas[1];

                nCerosInsertar = nCerosInsertar - decimales.length;
            }

            for (var i = 0; i < nCerosInsertar; i++) {
                numeroConCeros += "0";
            }

            return numeroConCeros;
        }
