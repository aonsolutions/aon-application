            // Crear ticket
            //
                $(document).on('click', '#ticket', function () {
                    // Cantidad de datos a crear
                    let cantidad = $('#cantidad').val();

                    // datos aleatorios
                    let subject  = [
                        'Parece que...',
                        'El otro día...',
                        'Bienvenido al nuevo..',
                        'Estoy viendo..',
                        'Recuerdalo siempre..',
                    ];

                    // La cantidad es mayor a 1
                    if(cantidad > 0){
                        for (let index = 0; index < cantidad; index++) {
                            // Creamos el Json de alamacenamiento
                            let from        = NameRandom();
                            let assignaedTo = NameRandom(2);

                            let ticket      = {
                                id           : returnNextID('messenger'),                   // campo ticket
                                createDate   : Today(),                                     // Creado
                                subject      : subject[Math.floor((Math.random() * 5))],    // titulo del ticket
                                postings     : postings[Math.floor((Math.random() * 3))],   // select del destinatario
                                from         : from,                                        // creador del ticket
                                assignaedTo  : assignaedTo,                                 // asigando a
                                answer       : Math.floor((Math.random() * 2)),             // tienes que responder = 0 : respondido | 1 : responder
                                status       : 1,                                           // 0: Cerrado; 1: Abierto
                                message      : {
                                    1 : {
                                        userName     : from,                                        // Nombre del usuario del mensaje
                                        userId       : "425",                                       // ID del usuario que crea el ticket
                                        userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                                        messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje
                                        message      : text,                                        // Mensaje

                                    2 : {
                                        userName     : assignaedTo,                                 // Nombre del usuario del mensaje
                                        userId       : "426",                                       // ID del usuario que crea el ticket
                                        userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                                        messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje
                                        message      : text,                                        // Mensaje
                                    },
                                    3 : {
                                        userName     : from,                                        // Nombre del usuario del mensaje
                                        userId       : "425",                                       // ID del usuario que crea el ticket
                                        userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                                        messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje

                                        userId       : "426",                                       // ID del usuario que crea el ticket
                                        userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                                        messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje

                                // No tenemos datos
                                let dataCreate = {

                                let data = createJsonApi(dataCreate);

            //
            // Crear FAQ
            //
                $(document).on('click', '#faq', function () {
                    // Cantidad de datos a crear
                    let cantidad = $('#cantidad').val();

                    // datos aleatorios
                    let question  = [
                        '¿Hacer?',
                        '¿Como?',
                        '¿Cuando?',
                        '¿Tal vez?',
                        '¿Alta?',
                    ];
                    let reply    = "Lorem ipsum dolor sit amet, consectetuer adipiscing elit. Aenean commodo ligula eget dolor. Aenean massa. Cum sociis natoque penatibus et magnis dis parturient montes, nascetur ridiculus mus.";
            
                    // La cantidad es mayor a 1
                    if(cantidad > 0){
                        for (let index = 0; index < cantidad; index++) {
                            // Creamos el Json de alamacenamiento
                            let faq  = {
                                id          : returnNextID('faq'),                          // id
                                created_at  : Today(),                                      // fecha
                                from        : NameRandom(2),                                // creado
                                question    : question[Math.floor((Math.random() * 5))],    // pregunta
                                reply       : reply,                                        // respuesta
                            };

                            //
                            // Almacenamos en el Storage
                            //
                                // No tenemos datos
                                let dataCreate = {

                                    json : faq
                                };
                                let data = createJsonApi(dataCreate);
                        }

                        alert('Datos almacenados');
