        <script>
            //
            // Eliminar
            //
                // Eliminar valores de pruebas
                $(document).on('click', '.delete-pruebas', function () {
                    const name  = $(this).data('name');
                    const title = $(this).data('title');
                    // Preguntar que hacer
                    let opcion = confirm("Eliminar todo los datos de "+title);
                   
                    // Confirma que se elimina el ticket
                    if (opcion == true) {
                        // Eliminar dato
                        deleteStorage(name);
                        // Mensaje
                        avisoFlotante('Datos eliminados de '+title);
                        console.log('Datos eliminados de '+title);
                    }
                });
                
                // Eliminar todo los datos
                $(document).on('click', '.delete-todo', function () {
                    // Preguntar que hacer
                    let opcion = confirm("Eliminar todo los datos");
                    
                    // Confirma que se elimina el ticket
                    if (opcion == true) {
                        // Eliminar dato
                        clearStorage();
                        // Mensaje
                        avisoFlotante('Datos eliminados');
                        console.log('Datos eliminados');
                    }
                });

            //
            // Crear
            //
                $(document).on('click', '.crear-pruebas', function () {
                    const name      = $(this).data('name');
                    const cantidad  = $('#cantidad').val();

                    if(cantidadCrearPruebas(cantidad)){
                        for (let index = 0; index < cantidad; index++) {
                            //
                            // Almacenamos en el Storage
                            //
                                // No tenemos datos
                                let dataCreate = {
                                    name : name,            // Nombre del tipo que almacenamos
                                    json : randonData(name) // Datos que almacenamos
                                }
                                let data = createJsonApi(dataCreate);
                        }
                        
                        avisoFlotante('Datos almacenados');
                    }
                });

            //
            // Funciones utiles
            //
                // Comprobar la cantidad de datos a crear
                function cantidadCrearPruebas(cantidad){
                    // La cantidad esta entre 1 y 50
                    if(cantidad > 0 && cantidad < 51){
                        return true;
                    } else {
                        alert('min 1 y max 50');
                        return false;
                    }
                }
                
                // Obstener datos para rellenar
                function randonData(name){
                    switch (name) {
                        case 'messenger':
                            return randomMessenger();
                            break;
                        case 'faq':
                            return randomFaq();
                            break;
                    
                        default:
                            return console.log('No se puede crear dato');
                            break;
                    }
                    return console.log('Datos almacenados');
                }

                // Crear un ticket
                function randomMessenger(){
                    // datos aleatorios
                    const subject  = [
                        'Parece que...',
                        'El otro día...',
                        'Bienvenido al nuevo..',
                        'Estoy viendo..',
                        'Recuerdalo siempre..',
                    ];
                    const postings = [1, 2, 3];
                    const text     = "Lorem ipsum dolor sit amet, consectetuer adipiscing elit. Aenean commodo ligula eget dolor. Aenean massa. Cum sociis natoque penatibus et magnis dis parturient montes, nascetur ridiculus mus.";
            
                    // Creamos el Json de alamacenamiento
                    const from        = NameRandom();
                    const assignedTo  = NameRandom(2);

                    // Devolvemos el ticket
                    return ticket = {
                        id           : returnNextID('messenger'),                   // campo ticket
                        createDate   : Today(),                                     // Creado
                        subject      : subject[Math.floor((Math.random() * 5))],    // titulo del ticket
                        postings     : postings[Math.floor((Math.random() * 3))],   // select del destinatario
                        from         : from,                                        // creador del ticket
                        assignedTo   : assignedTo,                                 // asigando a
                        answer       : Math.floor((Math.random() * 2)),             // tienes que responder = 0 : respondido | 1 : responder
                        status       : 1,                                           // 0: Cerrado; 1: Abierto
                        message      : {
                            1 : {
                                userName     : from,                                        // Nombre del usuario del mensaje
                                userId       : "425",                                       // ID del usuario que crea el ticket
                                userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                                messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje
                                message      : text,                                        // Mensaje
                            },
                            2 : {
                                userName     : assignedTo,                                 // Nombre del usuario del mensaje
                                userId       : "426",                                       // ID del usuario que crea el ticket
                                userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                                messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje
                                message      : text,                                        // Mensaje
                            },
                            3 : {
                                userName     : from,                                        // Nombre del usuario del mensaje
                                userId       : "425",                                       // ID del usuario que crea el ticket
                                userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                                messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje
                                message      : text,                                        // Mensaje
                            },
                            4 : {
                                userName     : assignedTo,                                 // Nombre del usuario del mensaje
                                userId       : "426",                                       // ID del usuario que crea el ticket
                                userAvatar   : "http://placehold.it/50/55C1E7/fff&text=U",  // URL del avatar del usuario
                                messageDate  : Today(),                                     // Hora y fecha de la creación del mensaje
                                message      : text,                                        // Mensaje
                            }
                        }
                    }
                }
              
                // Crear un FAQ
                function randomFaq(){
                    // datos aleatorios
                    const question  = [
                        '¿Hacer?',
                        '¿Como?',
                        '¿Cuando?',
                        '¿Tal vez?',
                        '¿Alta?',
                    ];
                    const reply     = "Lorem ipsum dolor sit amet, consectetuer adipiscing elit. Aenean commodo ligula eget dolor. Aenean massa. Cum sociis natoque penatibus et magnis dis parturient montes, nascetur ridiculus mus.";
                    
                    // Devolvemos el FAQ
                    return faq  = {
                        id          : returnNextID('faq'),                          // id
                        created_at  : Today(),                                      // fecha
                        from        : NameRandom(2),                                // creado
                        question    : question[Math.floor((Math.random() * 5))],    // pregunta
                        reply       : reply,                                        // respuesta
                    };
                }
