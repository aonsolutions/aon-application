        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">

        <!-- MATERIAL COMPONENTS -->

    <body>
        <!-- start contenido centro -->
        <div class="col" id="atp_contenido_centro">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <!-- INICIO VISTA -->
                    <div class="col-12">
                        <div class="row">
                            <div class="col-12">
                                <h3>Nueva FAQ</h3>
                            </div>
                        </div>
                        <form method="post" id="formulario" enctype="multipart/form-data" class="atp_caja_form">
                            <div class="row">
                                <div class="col-12">
                                    <div class="form-group">
                                        <label class="d-block atp_inputs">
                                            <input type="text" id="question" name="question" value="" placeholder="" onchange="this.setAttribute('value', this.value);">
                                            <span>Pregunta</span>
                                        </label>
                                        <label class="d-none errores error-question text-ayudat font-weight-bold">Introduce la pregunta.</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12">
                                    <label class="font-weight-bold">Respuesta:</label>
                                    <label class="d-none errores error-editor text-ayudat font-weight-bold">Introduce la respuesta.</label>
                                    <div id="editor"></div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12 mt-2">
                                    <button type="button" id="btn-send" class="btn btn-sm btn-info float-right">Guardar</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- end contenido centro -->
    </body>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="../js/crud.js"></script>
    <script>
        //
        // Inicializamos CKEditor
        //
            var theEditor;
            ClassicEditor.create( document.querySelector('#editor'), {
                language: 'es'
            })
            .then(editor => {
                theEditor = editor;
                $('<style type="text/css" scoped>.ck-editor .ck-editor__editable_inline {min-height: 200px !important;}</style>').insertAfter('#editor');
            })
            .catch( error => {
                console.error( error );
            } );

        //
        // Enviar FAQ
        //
            $('#btn-send').click(function() {
                let envio = true;

                // Quitamos todos los errores
                    $('.errores').each(function() {
                        $(this).addClass('d-none');
                    });

                // Añadimos el resto de datos del formulario
                    let respuesta = theEditor.getData();
                    if(respuesta == '') {
                        $('.error-respuesta').removeClass('d-none');
                        envio = false;
                    }

                    let pregunta = $("#question").val();
                    if(pregunta == '') {
                        $('.error-question').removeClass('d-none');
                        envio = false;
                    }

                // Enviamos si todo va correcto                            
                if(envio) {
                    // Cogemos los valores de los formularios
                    let dataVal = dataForm('#formulario');
                    let faq  = {
                        id          : returnNextID('faq'),  // id
                        created_at  : Today(),              // fecha
                        from        : NameRandom(2),        // creado
                        question    : dataVal.question,     // pregunta
                        reply       : dataVal.editor,       // respuesta
                    };
                    
                    //
                    // Almacenamos en el Storage
                    //
                        // No tenemos datos
                        let dataCreate = {
                            name : 'faq',   // Donde almacenamos los datos
                            json : faq,     // Datos
                        };
                        let data = createJsonApi(dataCreate);

                    // Al recibir que se ha creado, recibiremos el FAQ ID, devolvemos a la pantalla de detalle del FAQ
                        document.location.href = "show.html?id=" + faq.id;
                } else {
                    return 0;
                }
            });

        //
        // Coger valores del formulario
        //
            function dataForm(formID){
                let fields   = 'input, select, textarea';
                let formData = {};

                $(formID).find(fields).each(function () {
                    if( this.type == 'radio' || this.type == 'checkbox' ){
                        // Coger solo el valor con checked
                        if(this.checked){
                            formData[this.name] = this.value;
                        }
                    } else {
                        formData[this.name] = this.value;
                    }
                });
                // Agregar datos del CKEditor
                formData['editor'] = theEditor.getData();
                // Enviamos
                return formData;
            }
    </script>
    <!-- FIN Scripts -->
</html>
