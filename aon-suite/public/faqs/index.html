    <script>
        /**
         * Crear paginado
         */
        function createPaginate(uid, page, page_total) {
            var paginate = '<ul class="pagination display-block float-right">';
            // Agregamos el usuario que estamos paginando
            paginate += '<input id="paginate-uid" type="hidden" value="' + uid + '">';

            // Si tenemos paginas
            if (page > 1) {
                paginate +=
                    '<li class="pointer">' +
                        '<a class="go_page" data-page="1">' +
                            '<i class="material-icons" title="Principio">fast_rewind</i>' +
                        '</a>' +
                    '</li>' +

                    '<li class="pointer">' +
                        '<a class="go_page" data-page="' + (page - 1) + '">' +
                            '<i class="material-icons" title="Volver">arrow_left</i>' +
                        '</a>' +
                    '</li>';
            }

            if (page_total > 0) {
                paginate += '<li class="ml-2 mr-2">' + page + '/' + page_total + '</li>';
            }

            if (page < page_total) {
                paginate +=
                    '<li class="pointer">' +
                        '<a class="go_page" data-page="' + (page + 1) + '">' +
                            '<i class="material-icons .display-1" title="Siguiente">arrow_right</i>' +
                        '</a>' +
                    '</li>' +

                    '<li class="pointer">' +
                        '<a class="go_page" data-page="' + page_total + '">' +
                            '<i class="material-icons" title="Final">fast_forward</i>' +
                        '</a>' +
                    '</li>';
            }
            paginate += '</ul>';

            return paginate;
        }

        /**
         * Obtiene los registros
         */
            function getList(uid = 'a5sa645-sa14', page_this = 1) {
                // Leer los datos
                    let data = readJsonApi('faq');
                
                // Si no tenemos datos
                    if(!data){
                        return null;
                    }

                // Donde meteremos los valores a cargar
                    let dataList     = {};

                // Datos totales por pagina
                    let totalDatePage   = 10;
                    let totalDate       = Object.keys(data).length;
                    let totalPage       = Math.ceil(totalDate / totalDatePage);

                // Crear cantidades aletorias dependiendo de la pagina en la que estemos
                    page_this_element = page_this == 1 ? page_this : ((page_this - 1) * totalDatePage) + 1;
                    page_total        = page_this_element + totalDatePage;
                
                // Metemos los datos de la pagina en la que estemos
                    let countDate = 1;
                    let page      = 1;
                    for (let key in data){
                        // Miramos cuantos datos vamos metiendo
                        if( dataList[page] === undefined || countDate <= totalDatePage ){
                            if (dataList[page] === undefined){
                                // El primer dato dela pagina 1
                                dataList[page] = {[key] : data[key]};
                            } else {
                                // vamos metiendo datos en esta pagina
                                dataList[page][key] = data[key];
                            }
                            countDate++;
                        } else {
                            // Siguientes datos para las demas paginas
                            // Se metiron 'totalDatePage = 10' metemos datos para la siguiente pagina 
                            page++;
                            countDate = 1;
                            dataList[page] = {[key] : data[key]};
                            countDate++;
                        }
                    }

                // Json de lo que nos llegaria
                    var dataJson = {
                        user_id     : uid,                                          // Al usuario que le pertenece los tickets
                        total_date  : totalDate,                                    // cantidad total de elementos
                        total_page  : totalPage,                                    // total de paginas
                        page        : page_this,                                    // pagina en la que estamos
                        shown_page  : page_this_element + ' - ' + (page_total - 1), // cantidad mostrada por paginas 1 - 10
                        list        : dataList[page_this],                          // listado de tickets, de la pagina en la que estamos
                    };

                    console.log(dataJson);

                // Devolver los datos
                    return dataJson;
            }

        /**
         * Generamos la tabla
         * @param data
         */
        function createTable(data) {
            // recorremos los datos a mostrar
            let tbody   = '';
            let colspan = 7;
            let a_href  = 'show.html';

            console.log(data.list)

            if(!data){
                // No tenemos datos
                let tbody =
                    '<tr>' +
                        '<td colspan="'+colspan+'">' +
                            'Sin datos' +
                        '</td>'
                    '</tr>';

                // Agregamos el cuerpo de la tabla
                $('.table tfoot').html(tbody);
            } else {
                // Recorrer
                $.each(data.list, function (i, item) {

                    console.log(i);
                    console.log(item);

                    // Abrimos el <tr> // Si tenemos que responder lo ponemos como negrita
                    tbody += item.answer == 1 ? '<tr class="font-weight-bold" data-toggle="collapse" data-target="#collapseme' + item.id + '">' : '<tr data-toggle="collapse" data-target="#collapseme' + item.id + '">';
                    // Recorremos los <td>
                    $.each(item, function (key, val) {
                        switch (key) {
                            case 'reply':
                                // No metemos el valor si tiene que responder o no
                                break;

                            default:
                                tbody += '<td>' + val + '</td>';
                                break;
                        }
                    });

                    // Agregamos opciones que tenga
                    tbody +=
                        '<td>' +
                            '<a class="text-dark text-decoration-none">' +
                                '<i id="faq-eliminar" class="material-icons pointer text-danger" title="Eliminar FAQ"' +
                                    ' data-uid="' + data.user_id + '" ' +
                                    ' data-page="' + data.page + '" ' +
                                    ' data-id="' + item.id + '" ' +
                                    '>delete_forever</i>' +
                            '</a>' +
                            '<a class="text-dark" href="' + a_href + '?faq=' + item.id + '">' +
                                '<i id="faq-editar" class="material-icons pointer text-primary" title="Editar FAQ"' +
                                    ' data-uid="' + data.user_id + '" ' +
                                    ' data-id="' + item.id + '" ' +
                                    '>edit</i>' +
                            '</a>' +
                        '</td>';
                    // Cerramos el <tr>
                    tbody += '</tr>';

                    // Añadimos colapsable
                    tbody += 
                        '<tr id="collapseme' + item.id + '" class="collapse out">'+
                            '<td colspan="'+colspan+'">'+
                                '<div><span class="font-weight-bold">Respuesta:</span> ' + item.reply + '</div>'+
                            '</td>'+
                        '</tr>';
                });
                
                // Agregamos el cuerpo de la tabla
                $('.table tbody').html(tbody);
                
                // Cogemos el paginado que tendía la tabla
                let pagination = createPaginate(data.user_id, data.page, data.total_page)
                
                // Agregamos el paginado en el footer de la tabla
                let tfoot =
                '<tr>' +
                    '<td colspan="'+colspan+'">' +
                        '<div class="row">' +
                            '<div class="col-md-6">' +
                                'Mostrando del ' + data.shown_page + ' de un total de ' + data.total_date + ' elementos' +
                            '</div>' +
                            '<div class="col-md-6">' +
                                pagination +
                            '</div>' +
                        '</div>' +
                    '</td>'
                '</tr>';
                                    
                // Agregamos el cuerpo de la tabla
                $('.table tfoot').html(tfoot);
                
                // console.log(tbody);
            }
        }

        // EVENTOS

        $(function() {
            // Cogemos el listado de datos para mostrar
            let list = getList();
            createTable(list);

            //
            // Eliminar FAQ
            //
            $(document).on('click', '#faq-eliminar', function () {
                let uid     = $(this).data('uid');
                let id      = $(this).data('id');
                let page    = $(this).data('page');
                let opcion  = confirm("Eliminar el #FAQ " + id);
                let data    = {
                    // Json que mandamos
                    name : 'faq',
                    id   : id,
                };

                // Confirma que se elimina el ticket
                if (opcion == true) {
                    // Eliminar dato
                    deleteJsonApi(data);
                    
                    // Damos el aviso
                    alert('Eliminado el #FAQ ' + id + ' correctamente');

                    // Volvemos a recargar los datos
                    var list = getList(uid = 'a5sa645-sa14', page_this = 1);
                    createTable(list);
                }

            });

            //
            // Pasar de pagina
            //
            $(document).on('click', '.go_page', function () {
                var user_id = $('#paginate-uid').val();
                var page = $(this).data('page');
                var list = getList(user_id, page);
                createTable(list);
                // Json que mandamos
                var ticket_page = {
                    method: 'ticket_page',
                    uid: user_id,
                    id: page,
                };
                console.log('Pasar paginas de ticket Json que mandamos:');
                console.log(ticket_page);
            });

        });
