        <!-- MATERIAL ICONS -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">

        <!-- MATERIAL COMPONENTS -->

    <body>
        <!-- start contenido centro -->
        <div class="col" id="atp_contenido_centro">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <!-- INICIO VISTA -->
                    <div class="col-12">
                        <div class="row">
                            <div class="col-12">
                                <h3>Nueva FAQ</h3>
                            </div>
                        </div>
                        <form method="post" id="formulario" enctype="multipart/form-data" class="atp_caja_form">
                            <div class="row">
                                <div class="col-12">
                                    <div class="form-group">
                                        <label class="d-block atp_inputs">
                                            <input type="text" id="question" name="question" value="" placeholder="" onchange="this.setAttribute('value', this.value);">
                                            <span>Pregunta</span>
                                        </label>
                                        <label class="d-none errores error-question text-ayudat font-weight-bold">Introduce la pregunta.</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12">
                                    <label class="font-weight-bold">Respuesta:</label>
                                    <label class="d-none errores error-editor text-ayudat font-weight-bold">Introduce la respuesta.</label>
                                    <div id="editor"></div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12 mt-2">
                                    <button type="button" id="btn-send" class="btn btn-sm btn-info float-right">Guardar</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div><!-- end contenido centro -->
    </body>
    
    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="../js/crud.js"></script>
    <script>
        //
        // Cargamos el CKEditor
        //
            let theEditor;
            // Inicializamos CKEditor
            ClassicEditor.create( document.querySelector('#editor'),{
                language: 'es'
            })
            .then(editor => {
                theEditor = editor;
                $('<style type="text/css" scoped>.ck-editor .ck-editor__editable_inline {min-height: 200px !important;}</style>').insertAfter('#editor');
            })
            .catch( error => {
                console.error( error );
            } );
        //
        // FIN CKEditor
        //

        $(function() {
            //
            // Cogemos los parametros por GET
            //
                let params = getAllGetParams();

                for(var i in params){
                    switch (params[i][0]) {
                        case 'faq':
                            //
                            // Leemos el ticket en el que estamos
                            // Como variables generales
                            //
                                faq = readJsonApi('faq');
                            let key = params[i][1];

                            // Como varible general para poder usarla
                            faq = (faq[key]) ? faq[key] :  alert('No existen datos');
                        break;
                    
                        default:
                            break;
                    }
                }

            //
            // Montamos la estructura, si tenemos datos
            //
                if (faq !== undefined) {
                    console.log(faq);

                    // Leemos los datos del FAQ y montamos la estructura
                        $('#question').attr('value', faq.question);
                        theEditor.setData(faq.reply);

                    // Añadimos al boton el data del UID del usuario logueado y el ID del ticket
                    // Usamos los nombres, pero tendría que ser los UID
                        $('#btn-send').attr('data-uid', faq.from);
                        $('#btn-send').attr('data-id', faq.id);
                            
                } else {
                    // No existe el dato, no permitimos el envio
                    $('#btn-send').addClass('hidden');
                }
        });

        // Guardar
        $('#btn-send').click(function(){
            let envio   = true;

            // Quitamos todos los errores
            $('.errores').each(function() {
                $(this).addClass('d-none');
            });

            // Añadimos el resto de datos del formulario
                let pregunta = $("#question").val();
                if(pregunta == '') {
                    $('.error-question').removeClass('d-none');
                    envio = false;
                }

                let respuesta = theEditor.getData();
                if(respuesta == '') {
                    $('.error-respuesta').removeClass('d-none');
                    envio = false;
                }
                
            
            if(envio) {
                faq["question"] = pregunta;
                faq["reply"]    = respuesta;
                
                //
                // Almacenamos los cambios en localStorage
                //
                    // Almacenamos el cambio del estado
                    let dataUpdateStatus = {
                        name        : 'faq',
                        json        : faq,
                    };
                    updateJsonApi(dataUpdateStatus);

                // Al recibir que se ha creado, recibiremos el FAQ ID, devolvemos a la pantalla de detalle del FAQ
                document.location.href = "show.html?faq=" + faq.id;
            } else {
                return 0;
            }
        });


    </script>
    <!-- FIN Scripts -->
</html>
