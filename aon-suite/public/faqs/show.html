        <script>

            let theEditor;
            // Inicializamos CKEditor
            ClassicEditor.create( document.querySelector('#editor'),{
                language: 'es'
            })
            .then(editor => {
                theEditor = editor;
                $('<style type="text/css" scoped>.ck-editor .ck-editor__editable_inline {min-height: 200px !important;}</style>').insertAfter('#editor');
            })
            .catch( error => {
                console.error( error );
            } );

            $(function() {
                // Datos del ticket en JSON
                let faq = {
                    id : "1",
                    question : "¿Se introduce aquí la pregunta?",
                    reply : "Teskiya, aquí no. Vayan a la ventanilla 1 por el pasillo de la izquierda. La última puerta a la derecha",
                    userIdLogin : "425",              // ID del usuario logueado
                };

                // Leemos los datos del FAQ y montamos la estructura
                $('#question').val(faq.question);
                theEditor.setData(faq.reply);

                // Añadimos al boton el data del id del usuario logueado y el id del ticket
                $('#btn-send').attr('data-user', ticket.userIdLogin);
                $('#btn-send').attr('data-ticket', ticket.id);
            });

            // Guardar
            $('#btn-send').click(function(){
                let envio = true;

                // Quitamos todos los errores
                $('.errores').each(function() {
                    $(this).addClass('d-none');
                });

                // Creamos el formData para enviar
                let formData = new FormData();

                // Añadimos el resto de datos del formulario
                let respuesta = theEditor.getData();
                if(respuesta == '') {
                    $('.error-respuesta').removeClass('d-none');
                    envio = false;
                }
                formData.append("answer", respuesta);

                let pregunta = $("#question").val();
                if(pregunta == '') {
                    $('.error-question').removeClass('d-none');
                    envio = false;
                }
                formData.append('question', pregunta);

                if(envio) {
                    // Enviamos los datos del nuevo ticket por AJAX
                    // TO-DO
                    let response = {
                        faqId : '1'
                    };

                    // Al recibir que se ha creado, recibiremos el FAQ ID, devolvemos a la pantalla de detalle del FAQ
                    document.location.href = "show.html?id=" + response.faqId;
                } else {
                    return 0;
                }
            });


        </script>
