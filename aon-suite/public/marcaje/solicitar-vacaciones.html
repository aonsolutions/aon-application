        function getFechaActual() {
            var fechaActual = new Date();
            var dia = fechaActual.getDate();
            var mes = fechaActual.getMonth() + 1;
            var annio = fechaActual.getFullYear();

            var str_dia = new String(dia)
            if (str_dia.length == 1) {
                dia = "0" + dia;
            };


            var str_mes = new String(mes)
            if (str_mes.length == 1) {
                mes = "0" + mes;
            }

            var str_annio = new String(annio)
            annio = str_annio;

            var fechaImprimible = dia + "/" + mes + "/" + annio;

            return fechaImprimible;
            // alert(fechaImprimible);
        }
