    <script>

        var idEmpleado = 0;

        jQuery(function () {
            // cargamos los datos en la db local, simulando lo que nos vendrá del servidor
            cargarDatosIniciales();
            // leemos los datos de la db local
            var datosEmpleado = readJsonApi('datosEmpleado');
            // cargamos los datos del usuario en pantalla
            cargarEmpleado(datosEmpleado[1]);
            mueveReloj();
            getFecha();

            var fechaActualDB = getFechaActualDB();
            var datosHistorial = readJsonApi('datosHistorial');
            cargarHistorial(datosHistorial, fechaActualDB);
            $('#dia').val(fechaActualDB);

        function cargarDatosIniciales() {

            var datos = {
                empleado: {
                    idEmpleado: '1',
                    documento: '12345678A',
                    nombre: 'Juan Muriel Fernadez',
                },
            };

            let dataCreate = {
                name: 'datosEmpleado',   // Donde almacenamos los datos
                json: datos,     // Datos
            };

            createJsonApi(dataCreate);

        }


        function cargarEmpleado(datosEmpleado) {
            var empleado = datosEmpleado['empleado'];
            idEmpleado = empleado['idEmpleado'];
            // $('#nombreApellido').val(empleado['nombre'])
            // $('#dni').val(empleado['documento'])
            $('#nombreApellido').attr('value', empleado['nombre']);
            $('#dni').attr('value', empleado['documento']);
            $('#idEmpleado').attr('value', empleado['idEmpleado']);
        }


        function mueveReloj() {
            var momentoActual = new Date();
            var hora = momentoActual.getHours();
            var minuto = momentoActual.getMinutes();
            var segundo = momentoActual.getSeconds();

            var str_segundo = new String(segundo)
            if (str_segundo.length == 1) {
                segundo = "0" + segundo
            }


            var str_minuto = new String(minuto)
            if (str_minuto.length == 1) {
                minuto = "0" + minuto;
            }

            var str_hora = new String(hora)
            if (str_hora.length == 1) {
                hora = "0" + hora;
            }

            var horaImprimible = hora + ":" + minuto + ":" + segundo;

            $('#reloj').val(horaImprimible);

            setTimeout("mueveReloj()", 1000);
        }


        function getFecha() {
            var fechaActual = new Date();
            var dia = fechaActual.getDate();
            var mes = fechaActual.getMonth() + 1;
            var annio = fechaActual.getFullYear();

            var str_dia = new String(dia)
            if (str_dia.length == 1) {
                dia = "0" + dia;
            };


            var str_mes = new String(mes)
            if (str_mes.length == 1) {
                mes = "0" + mes;
            }

            var str_annio = new String(annio)
            annio = str_annio;

            var fechaImprimible = dia + "/" + mes + "/" + annio;

            $('#fecha').val(fechaImprimible);

        }

        (function ($) {
            $.fn.serializeFormJSON = function () {
                var o = {};
                var a = this.serializeArray();
                $.each(a, function () {
                    if (o[this.name]) {
                        if (!o[this.name].push) {
                            o[this.name] = [o[this.name]];
                        }
                        o[this.name].push(this.value || '');
                    } else {
                        o[this.name] = this.value || '';
                    }
                });
                return o;
            };
        })(jQuery);

        $('#botonEntrada').on('click', function (e) {
            $('#marcaje').val('Entrada');

            guardarDatosYActualizarHistorial();
        })

        $('#botonSalida').on('click', function (e) {
            $('#marcaje').val('Salida');

        function guardarDatosYActualizarHistorial() {
            // var dato = $('form').serializeFormJSON();

            var fechaActual = getFechaActual();
            var fechaActualDB = getFechaActualDB();
            var datos = {

                fechaDB: fechaActualDB,
                fecha: fechaActual,
                reloj: $('#reloj').val(),
                tipoMarcajeId: $('#tipoMarcaje').val(),
                nota: $('#nota').val(),
                marcaje: $('#marcaje').val(),
                idEmpleado: idEmpleado,
                tipoMarcaje: $('#tipoMarcaje option:selected').text(),

            };

            let dataCreate = {
                name: 'datosHistorial',   // Donde almacenamos los datos
                json: datos,     // Datos
            };

            createJsonApi(dataCreate);

            // console.log(readJsonApi('datosHistorial'));

            var datosHistorial = readJsonApi('datosHistorial');

            cargarHistorial(datosHistorial, fechaActualDB);
        }

        function enviarDatosAjax(datos) {

            $.ajax({
                url: '',
                data: datos,
                type: 'POST',
                dataType: 'json',

                success: function (respuesta) {
                    console.log(respuesta);
                },
                error: function () {
                    console.log("No se ha podido obtener la información");
                },
                complete: function (xhr, status) {
                    console.log("Petición realizada");
                }

            });

        }


        function cargarHistorial(datosHistorial, fechaActualDB) {
            var historial = datosHistorial;
            var hijo = "";
            var mostrado = false;

            // var value;
            for (i in historial) {
                // value = Number.parseInt(i) + 1;
                if (fechaActualDB == historial[i]['fechaDB']) {
                    hijo = hijo + "<tr>";
                    // hijo = hijo + "<td>" + historial[i]['id'] + "</td>";
                    hijo = hijo + "<td>" + historial[i]['fecha'] + "</td>";
                    hijo = hijo + "<td>" + historial[i]['reloj'] + "</td>";
                    hijo = hijo + "<td>" + historial[i]['tipoMarcaje'] + "</td>";
                    hijo = hijo + "<td>" + historial[i]['nota'] + "</td>";
                    hijo = hijo + "<td>" + historial[i]['marcaje'] + "</td>";
                    hijo = hijo + "</tr>";
                    mostrado = true;
                }

            }

            $("#tablaMarcajes").empty();
            if (mostrado) {

            } else {
                hijo = "<tr><td colspan='6'>No hay datos para mostrar</td></tr>";
            }

            $(hijo).appendTo("#tablaMarcajes");
            $('#dia').val(fechaActualDB);

        }

        function getFechaActual() {
            var fechaActual = new Date();
            var dia = fechaActual.getDate();
            var mes = fechaActual.getMonth() + 1;
            var annio = fechaActual.getFullYear();

            var str_dia = new String(dia)
            if (str_dia.length == 1) {
                dia = "0" + dia;
            };


            var str_mes = new String(mes)
            if (str_mes.length == 1) {
                mes = "0" + mes;
            }

            var str_annio = new String(annio)
            annio = str_annio;

            var fechaImprimible = dia + "/" + mes + "/" + annio;

            return fechaImprimible;
            // alert(fechaImprimible);
        }

        function getFechaActualDB() {
            var fechaActual = new Date();
            var dia = fechaActual.getDate();
            var mes = fechaActual.getMonth() + 1;
            var annio = fechaActual.getFullYear();

            var str_dia = new String(dia)
            if (str_dia.length == 1) {
                dia = "0" + dia;
            };


            var str_mes = new String(mes)
            if (str_mes.length == 1) {
                mes = "0" + mes;
            }

            var str_annio = new String(annio)
            annio = str_annio;

            var fechaImprimible = annio + "-" + mes + "-" + dia;

            return fechaImprimible;
            // alert(fechaImprimible);
        }



        (function ($) {
            $.fn.serializeFormJSON = function () {
                var o = {};
                var a = this.serializeArray();
                $.each(a, function () {
                    if (o[this.name]) {
                        if (!o[this.name].push) {

                        }
                        o[this.name].push(this.value || '');
                    } else {
                        o[this.name] = this.value || '';
                    }
                });
                return o;
            };
