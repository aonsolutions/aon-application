        <!-- Modales -->
        <div class="modal fade" id="new_note_doc" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header font-weight-bold" id="title_new_note_doc">
                        Añadir nota a los documentos de tipo "Enviado" seleccionados
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-12">
                                <div class="atp_caja_form">
                                    <label class="d-block atp_inputs">
                                        <textarea id="note_doc" rows="3" class="" placeholder=" "></textarea>
                                        <span>Escribe aquí tu nota</span>

                                </div>
                            </div>
                        </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                        <button id="confirm_new_note_doc" type="button" class="btn btn-primary">Añadir</button>
                    </div>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script type="module">
        import { CARPETA_A_CONTABILIZAR, bidoq } from './aon-documental.js';
        import { createTable, getList } from './table.js';
        import { UploadDocumentos } from './upload.js';
        import {
            AVAILABLE_OPTIONS,
            MULTIPLE_DOWNLOAD_OPTION,
            ADD_NOTE_OPTION,
            MULTIPLE_DELETE_OPTION,
            getOptionButtons
        } from './toolbar_options.js';

        const MAX_FILE_SIZE = 5;

        //
        // Eventos
        //
            $(document).ready(async function() {
                window.aonDocumental = window.frameElement.ownerDocument.getElementById('aonDocumental');
                window.aonDocumentalContainer = window.frameElement.ownerDocument.querySelector('aon-documental');

                // Obtenemos las carpetas del cliente
                window.folders = $(window.aonDocumental).data('folders');

                try {
                    const list = await getList();

                    createTable(list);
                } catch (error) {
                    const list = {
                        "list": [],
                        "total_data": 0, // cantidad total de elementos
                        "total_page": 1, // total de paginas
                        "page": 1, // pagina en la que estamos
                        "shown_page": 0 + ' - ' + 0, // cantidad mostrada por paginas 1 - 10
                    }

                    createTable(list);

                    console.error(error);
                }

                //
                // Iniciamos el subir
                //
                    UploadDocumentos();

            });

            // Pasar de pagina
            $(document).on('click', '.go_page', async function () {
                const page = $(this).data('page');

                try {
                    const list = await getList(page);

                    createTable(list);
                } catch (error) {
                    console.error(error);
                }
            });

            // Hacer click en un documento para ir a la vista de detalles de este
            $(document).on('click', 'td.show_doc', function() {
                const id = $(this).closest('tr').data('id');
                const type = $(this).closest('tr').data('type');

                window.aonDocumentalContainer.loadShow(id, type);
            });

            // Seleccionar documentos
            $(document).on('change', '.select_doc', function() {
                // Recuperamos del DOM los botones correspondientes a las opciones
                const optionButtons = getOptionButtons(window.frameElement.ownerDocument);

                // Si hay algún documento seleccionado
                if ($('.select_doc:checked').length) {
                    const allowedOptionsText = [];

                    // Recorremos los documentos seleccionados
                    $('.select_doc:checked').each(function() {
                        const row = $(this).closest('tr');
                        // Comprobamos cuáles son las opciones permitidas para el documento seleccionado
                        const rowAllowedOptionsText = row.data('allowed_options').split(',');

                        // Almacenamos en un array las opciones que debemos añadir a la barra de herramientas
                        for (let i = 0; i < rowAllowedOptionsText.length; i++) {
                            const option = rowAllowedOptionsText[i];

                            if ($.inArray(option, allowedOptionsText) === -1) {
                                allowedOptionsText.push(option);
                            }
                        }

                        // Si ya estan todas las opciones disponibles en el array de opciones que vamos a añadir a la barra de herramientas, salimos del bucle
                        if (allowedOptionsText.length === AVAILABLE_OPTIONS.length) {
                            return false;
                        }
                    });

                    // Obtenemos las opciones permitidas a partir del texto de cada acción
                    const allowedOptions = allowedOptionsText.map((optionName) =>
                        AVAILABLE_OPTIONS.find((option) =>
                            optionName === option.name
                        )
                    );

                    for (let i = 0; i < optionButtons.length; i++) {
                        const optionButton = optionButtons[i];
                        // Buscamos la acción correspondiente al botón
                        const option = allowedOptions.find((option) => optionButton.name === option.name);

                        // Comprobamos si la acción que corresponde a este botón se encuentra entre las opciones permitidas
                        if (typeof option !== 'undefined') {
                            // Si el botón aún no existe en el DOM, lo creamos
                            if (optionButton.element === null) {
                                window.aonDocumental.addToolbarOption(option.name, option.icon, option.fn, option.title);
                            }
                        } else if (optionButton.element !== null) {
                            // Si la acción que corresponde a este botón no se encuentra entre las opciones permitidas, eliminamos dicho botón
                            window.aonDocumental.removeToolbarOptions([optionButton.name]);
                        }
                    }
                } else {
                    // Si no hay documentos seleccionados, eliminamos los botones correspondientes a las opciones de la barra de herramientas
                    window.aonDocumental.removeToolbarOptions([MULTIPLE_DOWNLOAD_OPTION, ADD_NOTE_OPTION, MULTIPLE_DELETE_OPTION]);
                }
            });

            // Al pulsar el boton de añadir nota desde el modal
            $(document).on('click', '#confirm_new_note_doc', async function() {
                // Recuperamos el texto que vamos a añadir a los documentos como nota
                const text = $('#note_doc').val();

                if (text.length) {
                    // Ocultamos los errores si están visibles
                    if (!$('.error-empty-note-doc').hasClass('d-none')) {
                        $('.error-empty-note-doc').addClass('d-none');
                    }

                    const data = await bidoq({
                        "method": "crear_editar_nota_docs",
                        "docs": JSON.stringify(window.docsCreateNote),
                        "texto": text,
                        "agregar": true
                    });

                    const response = JSON.parse(data);

                    if (typeof response !== 'undefined') {
                        if (typeof response.code !== 'undefined' && response.code === 0) {
                            alert('Nota añadida con éxito en los documentos de tipo "Enviado" seleccionados');
                        } else if (typeof response['1047'] !== 'undefined') {
                            alert(`Ocurrió un error al intentar añadir la nota`);
                        }
                    } else {
                        console.error('Ocurrió un error al intentar añadir la nota');
                    }

                    // Ocultamos el modal
                    $("#new_note_doc").modal('hide');
                } else {
                    $('.error-empty-note-doc').removeClass('d-none');
                }
            });
    </script>
