<html lang="es">
    <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>aon Suite</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Rubik:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet" type='text/css'>

    <!-- MATERIAL ICONS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">

    <!-- MATERIAL COMPONENTS -->
    <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">

    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>

    <link href="../css/app.css" rel="stylesheet" id="linkcss">

    </head>

    <body>

                <!-- start contenido centro -->
                <div class="col" id="atp_contenido_centro">
                    <div class="container-fluid">
                        <div class="row justify-content-center">
                            <!-- INICIO VISTA -->

                            <div class="col-10">
                                <div class="row mb-2">
                                    <div class="col-9">
                                        <p class="h3"><strong id="doc-file_name"></strong></p>
                                    </div>
                                    <div class="col-3">
                                        <button class="btn btn-primary btn-sm float-right d-flex">
                                            <i class="material-icons file_download mr-1"></i>
                                            <span class="d-flex align-items-center">Descargar</span>
                                        </button>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-6">
                                        <strong>Detalles</strong>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-6">
                                        <span class="text-muted">Fecha:</span> <span id="doc-date"></span>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-6">
                                        <span class="text-muted">Tamaño:</span> <span id="doc-size"></span>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-12 text-center pt-3 pb-2">
                                        <img id="doc-src" src="" alt="">
                                        <!-- <embed id="doc-src" src="" class="w-100 vh-100" type="application/pdf"> -->
                                    </div>
                                </div>
                            </div>

                            <!-- FIN VISTA -->
                        </div>
                    </div>
                </div>
                <!-- end contenido centro -->


        <!-- Scripts -->
        <script src="../js/app.js"></script>
        <script>
            $(document).ready(function(){
                // Datos del documento
                var fileName = new URLSearchParams(window.location.search).get('document');

                var doc = {
                    file_name : fileName, // Nombre del archivo
                    date: '23-09-2020 14:41',
                    size: '0,50 MB',
                    url: "https://via.placeholder.com/768/" // URL de prueba para el documento
                    // url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" // URL de prueba para el documento
                };

                // Leemos los datos del documento y montamos la estructura
                $('#doc-file_name').html(doc.file_name);
                $('#doc-src').attr('src', doc.url).attr('alt', 'Documento ' + fileName);
                $('#doc-date').html(doc.date);
                $('#doc-size').html(doc.size);
            });
        </script>
    </body >
</html>
