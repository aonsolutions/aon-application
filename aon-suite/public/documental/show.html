        <!-- Modales -->
        <div class="modal fade" id="edit_doc" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header font-weight-bold">

                            <div class="col-12">
                                <div class="atp_caja_form">

                                    <div class="form-group">

                    <div class="modal-footer">

        <!-- Scripts -->
        <script src="../js/app.js"></script>
        <script type="module">
            import { bidoq } from './aon-documental.js';
            import { AVAILABLE_OPTIONS, SINGLE_DOWNLOAD_OPTION, EDIT_OPTION, VIEW_NOTE_OPTION } from './toolbar_options.js';

            const SHOW_OPTIONS = [SINGLE_DOWNLOAD_OPTION, EDIT_OPTION, VIEW_NOTE_OPTION];

            $(document).ready(async function(){
                // ID del documento
                const id = new URLSearchParams(window.location.search).get('id');
                // Tipo del documento
                const type = new URLSearchParams(window.location.search).get('type');

                const data = await bidoq({
                    "method": "obtener_doc",
                    id,
                    type
                });

                const response = JSON.parse(data);

                if (typeof response !== 'undefined') {
                    if (response.code === 0) {
                        const doc = response.datos;
                        const storedFileNameSplitted = doc.stored_file_name.split('.');
                        const extension = storedFileNameSplitted[storedFileNameSplitted.length - 1].toLowerCase();

                        // Almacenamos en una variable global la información del documento que estamos viendo actualmente
                        window.currentFile = {id, type, ...doc};

                        let docTag = '';

                        if (extension === 'pdf') {
                            docTag = `<embed src="${doc.url}" class="w-100 vh-100" type="application/pdf">`;
                        } else {
                            // TODO: tener en cuenta otros tipos como .rar, .xlsx, etc.
                            docTag = `<img class="img-fluid" src="${doc.url}" alt="Documento ${doc.file_name}">`;
                        }

                        // Insertamos un etiqueta u otra dependiendo del tipo de archivo
                        $('#doc_container').html(docTag);

                        // Leemos los datos del documento y montamos la estructura
                        $('#doc-file_name').html(doc.file_name);
                        $('#doc-date').html(doc.date);
                        $('#doc-size').html(doc.size);
                    } else {
                        alert(`Ocurrió un error al intentar obtener los datos del documento`);

                        window.history.back();
                    }

                    window.aonDocumental = window.frameElement.ownerDocument.getElementById('aonDocumental');
                    // Obtenemos los tags del despacho del cliente
                    window.tags = $(window.aonDocumental).data('tags');

                    // Eliminamos todas las opciones de la barra de herramientas
                    window.aonDocumental.removeToolbarOptions();

                    // TODO: Comprobar si el documento es enviado o recibido para permitir o no ver notas
                    // Filtramos de todas las opciones disponibles las opciones que necesitamos en esta vista
                    AVAILABLE_OPTIONS.filter((option) => {
                        return SHOW_OPTIONS.includes(option.name);
                    }).map((option) => {
                        // Añadimos la opción a la barra de herramientas
                        window.aonDocumental.addToolbarOption(option.name, option.icon, option.fn, option.title);
                    });
                } else {
                    console.error('Ocurrió un error al intentar obtener los datos del documento');
                }
            });

            //
            // Eventos
            //
                // Al pulsar el boton de editar documento desde el modal
                $(document).on('click', '#confirm_edit_doc', async function() {
                    // Recuperamos el ID del documento que vamos a editar
                    const id = $('#edit_doc_id').attr('value');
                    // Recuperamos el tipo del documento que vamos a editar
                    const type = ($('#edit_doc_type').attr('value') === 'sent') ? 2 : 1;
                    const fileName = $('#file_name_doc').attr('value'); 
                    const tags = $('#tags_doc option:selected').map(function(i, element) {
                        return $(element).attr('value');
                    }).toArray();
                    const tagValues = tags.join(',');

                    if (fileName.length) {
                        const data = await bidoq({
                            "method": "editar_doc",
                            id,
                            "tipo": type,
                            "nombre": fileName,
                            tags
                        });

                        let response = JSON.parse(data);

                        if (typeof response !== 'undefined') {
                            if (response.code === 0) {
                                // Actualizamos el nombre en la vista
                                $('#doc-file_name').html($('#file_name_doc').attr('value'));

                                alert('Documento editado con éxito');
                            }
                        }

                        // Ocultamos los errores si están visibles
                        if (!$('.error-empty-file-name-doc').hasClass('d-none')) {
                            $('.error-empty-file-name-doc').addClass('d-none');
                        }

                        // Ocultamos el modal
                        $("#edit_doc").modal('hide')
                    } else {
                        $('.error-empty-file-name-doc').removeClass('d-none');
                    }
                });

                // Crear / editar nota
