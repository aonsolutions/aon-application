        <!-- Scripts -->
        <script src="../js/app.js"></script>
        <script type="module">
            import { bidoq } from './aon-documental.js';
            import { getList, createTable } from './table.js';
            import { AVAILABLE_OPTIONS, SINGLE_DOWNLOAD_OPTION, EDIT_OPTION, SINGLE_DELETE_OPTION, VIEW_NOTE_OPTION } from './toolbar_options.js';

            const DOC_SENT_OPTIONS      = [SINGLE_DOWNLOAD_OPTION, EDIT_OPTION, SINGLE_DELETE_OPTION, VIEW_NOTE_OPTION];
            const DOC_RECEIVED_OPTIONS  = [SINGLE_DOWNLOAD_OPTION, EDIT_OPTION];

            $(document).ready(async function() {
                const aonDocumentalContainer = window.frameElement.ownerDocument.querySelector('aon-documental');

                // ID del documento
                const id   = new URLSearchParams(window.location.search).get('id');
                // Tipo del documento
                const type = new URLSearchParams(window.location.search).get('type');

                const data = await bidoq({
                    "method": "obtener_doc",
                    id,
                    type
                });

                const response = JSON.parse(data);

                if (typeof response !== 'undefined') {
                    if (response.code === 0) {
                        const doc = response.datos;
                        const storedFileNameSplitted = doc.stored_file_name.split('.');
                        const extension = storedFileNameSplitted[storedFileNameSplitted.length - 1].toLowerCase();

                        //
                        // Marcar el documento como leído
                        //
                            if(type === 'received' && doc.read == 0){
                                // El documento es subido por el asesor, y no esta marcado como leido
                                UpdateReadDocument(id, type);
                            }

                        // Almacenamos en una variable global la información del documento que estamos viendo actualmente
                        window.currentFile = {id, type, ...doc};

                        window.aonDocumental = window.frameElement.ownerDocument.getElementById('aonDocumental');
                        // Obtenemos las etiquetas del despacho del cliente
                        window.tags = $(window.aonDocumental).data('tags');

                        // Obtenemos las carpetas del despacho del cliente
                        const folders = $(window.aonDocumental).data('folders');
                        // Recuperamos la carpeta a la que pertenece el documento
                        const docFolder = folders.find((folder) => {
                            return parseInt(doc.folder) === parseInt(folder.carpetaID);
                        })?.carpeta;

                        // Leemos los datos del documento y montamos la estructura
                        $('#doc-file_name').html(doc.file_name);
                        $('#doc_date').html(doc.date);
                        $('#doc_size').html(doc.size);
                        $('#doc_folder').html(docFolder);

                        if (doc.tags.length) {
                            const docTags = doc.tags.map((tag) => (
                                `<a class="documentTags" href="#" data-tag="${tag.id}">#${tag.name}</a>`
                            )).join(', ');

                            $('#doc_tags').html(`
                                <div class="col-12">
                                    <span class="text-muted">Etiquetas:</span> ${docTags}
                                </div>
                            `);
                        }

                        let fileContent = '';

                        if (extension === 'pdf') {
                            fileContent = `<embed src="${doc.url}" class="w-100 vh-100" type="application/pdf">`;
                        } else {
                            fileContent = `<img class="img-fluid" src="${doc.url}" alt="Documento ${doc.file_name}">`;
                        }

                        // Insertamos una etiqueta HTML u otra dependiendo del tipo de archivo
                        $('#file_container').html(fileContent);

                        // Eliminamos todas las opciones de la barra de herramientas
                        window.aonDocumental.removeToolbarOptions();

                        // Filtramos de todas las opciones disponibles las opciones que necesitamos en esta vista
                        AVAILABLE_OPTIONS.filter((option) => {
                            const optionsAllowed = (type === 'sent') ? DOC_SENT_OPTIONS : DOC_RECEIVED_OPTIONS;

                            return optionsAllowed.includes(option.name);
                        }).map((option) => {
                            // Añadimos la opción a la barra de herramientas
                            window.aonDocumental.addToolbarOption(option.name, option.icon, option.fn, option.title);
                        });
                    } else {
                        alert(`Ocurrió un error al intentar obtener los datos del documento`);

                        window.history.back();
                    }
                } else {
                    console.error('Ocurrió un error al intentar obtener los datos del documento');

                    window.history.back();
                }
            });

            //
            // Eventos
            //
                // Al pulsar el boton de editar documento desde el modal
                $(document).on('click', '#confirm_edit_doc', async function() {
                    // Recuperamos el ID del documento que vamos a editar
                    const id = $('#edit_doc_id').attr('value');
                    // Recuperamos el tipo del documento que vamos a editar
                    const type = ($('#edit_doc_type').attr('value') === 'sent') ? 2 : 1;
                    const fileName = $('#file_name_doc').attr('value'); 
                    const selectedTags = $('#tags_doc option:selected').map(function(i, element) {
                        return {
                            id: $(element).attr('value'),
                            name: $(element).text()
                        };
                    }).toArray();
                    const selectedTagsIDs = selectedTags.map((tag) => tag.id);

                    if (fileName.length) {
                        const data = await bidoq({
                            "method": "editar_doc",
                            id,
                            "tipo": type,
                            "nombre": fileName,
                            "tags": selectedTagsIDs
                        });

                        let response = JSON.parse(data);

                        if (typeof response !== 'undefined') {
                            if (response.code === 0) {
                                // Actualizamos con los tags seleccionados la variable global que contiene los datos del documento
                                window.currentFile.tags = selectedTags;

                                // Actualizamos el nombre en la vista
                                $('#doc-file_name').html($('#file_name_doc').attr('value'));
                                // Actualizamos los tags en la vista
                                if (selectedTags.length) {
                                    const docTags = selectedTags.map((tag) => (
                                        `<a class="documentTags" href="#" data-tag="${tag.id}">#${tag.name}</a>`
                                    )).join(', ');

                                    $('#doc_tags').html(`
                                        <div class="col-12">
                                            <span class="text-muted">Etiquetas:</span> ${docTags}
                                        </div>
                                    `);
                                } else {
                                    $('#doc_tags').html('');
                                }

                                alert('Documento editado con éxito');
                            }
                        }

                        // Ocultamos los errores si están visibles
                        if (!$('.error-empty-file-name-doc').hasClass('d-none')) {
                            $('.error-empty-file-name-doc').addClass('d-none');
                        }

                        // Ocultamos el modal
                        $("#edit_doc").modal('hide')
                    } else {
                        $('.error-empty-file-name-doc').removeClass('d-none');
                    }
                });

                // Al pulsar el boton de crear / editar nota desde el modal
                $(document).on('click', '#confirm_view_note_doc', async function() {
                    // Recuperamos el texto que vamos a añadir a los documentos como nota
                    const text = $('#note_doc').val();

                    if (text.length) {
                        const { id } = window.currentFile;
                        let { type } = window.currentFile;

                        type = (type === 'sent') ? 'Recibes' : 'Envias';

                        const docs = [{id, type}];

                        // Ocultamos los errores si están visibles
                        if (!$('.error-empty-note-doc').hasClass('d-none')) {
                            $('.error-empty-note-doc').addClass('d-none');
                        }

                        const data = await bidoq({
                            "method": "crear_editar_nota_docs",
                            "docs": JSON.stringify(docs),
                            "texto": text
                        });

                        const response = JSON.parse(data);

                        if (typeof response !== 'undefined') {
                            if (typeof response.code !== 'undefined' && response.code === 0) {
                                alert(`Nota ${(window.noteAction === 'add') ? 'añadida' : 'editada'} con éxito`);
                            } else if (typeof response['1047'] !== 'undefined') {
                                alert(`Ocurrió un error al intentar ${(window.noteAction === 'add') ? 'añadir' : 'editar'} la nota`);
                            }
                        } else {
                            console.error(`Ocurrió un error al intentar ${(window.noteAction === 'add') ? 'añadir' : 'editar'} la nota`);
                        }

                        // Ocultamos el modal
                        $("#view_note_doc").modal('hide');
                    } else {
                        $('.error-empty-note-doc').removeClass('d-none');
                    }
                });

                // Filtrar por tag
                $(document).on('click', '.documentTags', function () {
                    const aonDocumentalContainer = window.frameElement.ownerDocument.querySelector('aon-documental');
                    const tagID = $(this).data('tag');

                    aonDocumentalContainer.loadIndex({tag: tagID});
                });

            //
            // Marcar documento como leído
            //
                async function UpdateReadDocument(id, type){
                    type = (type === 'sent') ? 2 : 1;
                    
                    const data = await bidoq({
                        "method": "editar_doc_leido",
                        id,
                        "tipo": type
                    });

                    let response = JSON.parse(data);

                    if (typeof response !== 'undefined') {
                        if (response.code === 0) {
                            //alert('Documento marcado como leído con éxito');
                        }
                    }
                }
        </script>
