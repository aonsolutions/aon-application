<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<aon:subForm>
		<aon:panelGroup styleClass="aon-popup-panel aon-confirm-box" >
		
			<rich:modalPanel 
				id="#{confirmId}"
				styleClass="aon-popup-" minWidth="300">

				<f:facet name="header">
					<aon:div styleClass="aon-popup-title">
						<aon:outputText value="#{confirmTitle}"/>
					</aon:div>
				</f:facet>
				<f:facet name="controls">
					<aon:commandButton type="button" styleClass="aon-popup-button-close" immediate="true"
						image="/images/icefaces/popupclose.gif"
						onclick="Richfaces.hideModalPanel('#{confirmId}');">
					</aon:commandButton>	
				</f:facet>

				<aon:panelGrid columns="1" style="width:100%;">
					<aon:div styleClass="aon-popup-question">
						<aon:div styleClass="">			
							<aon:outputText value="#{confirmMessage}" />				
						</aon:div>
					</aon:div>
					<aon:panelGrid columns="1"  style="width:100%;">
						<aon:div styleClass="aon-popup-buttons" >
							<aon:commandButton value="#{bundle.aon_yes}"
								styleClass="aon-popup-button"
								immediate="#{immediate}"
								onclick="Richfaces.hideModalPanel('#{confirmId}');">
								<c:if test="#{confirmActionListener != null}">									
									<aon:actionListener method="#{company.onAccept}" />
								</c:if>
							</aon:commandButton>
							<aon:commandButton value="#{bundle.aon_no}"
								styleClass="aon-popup-button" immediate="true"
								onclick="Richfaces.hideModalPanel('#{confirmId}');">
							</aon:commandButton>
						</aon:div>
					</aon:panelGrid>
				</aon:panelGrid>

			</rich:modalPanel>
			
		</aon:panelGroup>
		
	</aon:subForm>

</ui:composition>
