<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:div styleClass="aon-toolbar">
		<aon:commandButton id="savew" value="#{bundle.aon_save}"
			styleClass="aon-finding-toolbar-item aon-icon-accept"
			actionListener="#{companyWebInfo.accept}"/>
	</aon:div>

	<aon:div style="float:left;margin-right:20px;">
		<aon:panelGrid columns="2" dir="true" >
	
			<aon:outputLabel for="WebInfo_slogan" value="#{registryBundle.web_info_slogan}" />
			<aon:inputText id="WebInfo_slogan" 
				required="true" size="64" maxlength="64" value="#{companyWebInfo.to.slogan}" />
	
			<aon:outputLabel for="WebInfo_schedule" value="#{registryBundle.web_info_schedule}" />
			<aon:inputTextarea id="WebInfo_schedule" styleClass="aon-inputText"
				required="true" cols="66" rows="3" value="#{companyWebInfo.to.schedule}" />
	
			<aon:outputLabel for="WebInfo_commercialDescription" value="#{appBundle.aon_web_info_description}" />
			<aon:inputTextarea id="WebInfo_commercialDescription"
				value="#{companyWebInfo.to.commercialDescription}" cols="66" rows="7"/>

			<aon:outputLabel for="WebInfo_title" value="#{registryBundle.web_info_title}" />
			<aon:inputText id="WebInfo_title" styleClass="aon-inputText"
				size="30" maxlength="32" value="#{companyWebInfo.to.title}" />
				
			<aon:outputLabel for="WebInfo_content" value="#{registryBundle.web_info_content}" />
			<aon:div style="width:600px">
				<aon:inputRichText style="width:100%" id="WebInfo_content" value="#{companyWebInfo.to.content}" />
			</aon:div>
		</aon:panelGrid>
	</aon:div>
</ui:composition>
</body>
</html>
