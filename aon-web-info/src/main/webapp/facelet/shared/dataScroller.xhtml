<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components">
<body>

<ui:composition>

	<aon:div styleClass="aon-form-note"
		rendered="#{model.rowCount == 0 and showNote}">
		<aon:div styleClass="aon-form-note-internal">
			<aon:panelGroup>
				<aon:outputText value="#{bundle.aon_search_no_results}" />
			</aon:panelGroup>
		</aon:div>
	</aon:div>

	<aon:div styleClass="aon-dataScroller" rendered="#{model.rowCount>0}">
		<aon:panelGrid columns="2"
			columnClasses="aon-dataScroller-text,aon-dataScroller-buttons">
			<aon:dataPaginator for="#{dataTable}" rowsCountVar="rowsCount"
				firstRowIndexVar="firstRowIndex" lastRowIndexVar="lastRowIndex">
				<f:facet name="pages">
					<h:outputFormat value="#{bundle.aon_scroll}">
						<f:param value="#{firstRowIndex}" />
						<f:param value="#{lastRowIndex}" />
						<f:param value="#{rowsCount}" />
					</h:outputFormat>
				</f:facet>
			</aon:dataPaginator>
			<!--			
			<rich:datascroller for="#{dataTable}" stepControls="hide" boundaryControls="hide"
				fastControls="hide"
				pageIndexVar="pageIndexVar" pagesVar="pagesVar">
				<f:facet name="pages">
					<h:outputFormat value="#{bundle.aon_scroll}">
						<f:param value="#{pageIndexVar}" />
						<f:param value="#{pagesVar}" />
						<f:param value="#{model.rowCount}" />
					</h:outputFormat>
				</f:facet>
			</rich:datascroller>
			 -->
			<aon:dataPaginator for="#{dataTable}" fastStep="5" paginator="true"
				paginatorMaxPages="5"
				rendered="#{model.rowCount>20}">

				<f:facet name="first">
					<aon:div styleClass="aon-dataScroller-first">&#160;</aon:div>
				</f:facet>
				<f:facet name="last">
					<aon:div styleClass="aon-dataScroller-last">&#160;</aon:div>
				</f:facet>
				<f:facet name="previous">
					<aon:div styleClass="aon-dataScroller-previous">&#160;</aon:div>
				</f:facet>
				<f:facet name="next">
					<aon:div styleClass="aon-dataScroller-next">&#160;</aon:div>
				</f:facet>
				<f:facet name="fastforward">
					<aon:div styleClass="aon-dataScroller-fastforward">&#160;</aon:div>
				</f:facet>
				<f:facet name="fastrewind">
					<aon:div styleClass="aon-dataScroller-fastrewind">&#160;</aon:div>
				</f:facet>
			</aon:dataPaginator>
			<!--
			<rich:datascroller for="#{dataTable}" fastStep="5"
				stepControls="auto" boundaryControls="auto" fastControls="auto"
				maxPages="5" rendered="#{model.rowCount>20}" >

				<f:facet name="first">
					<aon:div styleClass="aon-dataScroller-first">&#160;</aon:div>
				</f:facet>
				<f:facet name="last">
					<aon:div styleClass="aon-dataScroller-last">&#160;</aon:div>
				</f:facet>
				<f:facet name="previous">
					<aon:div styleClass="aon-dataScroller-previous">&#160;</aon:div>
				</f:facet>
				<f:facet name="next">
					<aon:div styleClass="aon-dataScroller-next">&#160;</aon:div>
				</f:facet>
				<f:facet name="fastforward">
					<aon:div styleClass="aon-dataScroller-fastforward">&#160;</aon:div>
				</f:facet>
				<f:facet name="fastrewind">
					<aon:div styleClass="aon-dataScroller-fastrewind">&#160;</aon:div>
				</f:facet>
			</rich:datascroller>
			-->
		</aon:panelGrid>
	</aon:div>

</ui:composition>

</body>
</html>
