<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:h="http://java.sun.com/jsf/html">
<body>

<ui:composition template="/facelet/templates/aon.ui.form.xhtml">

	<ui:define name="head">
		<ui:include src="/facelet/shared/head.xhtml" />
	</ui:define>		

	<ui:define name="content">

		<h:form id="catalogueForm" styleClass="aon-form">

			<t:div styleClass="aon-content-toolbar">
				<t:div styleClass="aon-content-toolbar-internal">
				<t:div styleClass="aon-content-toolbar-item-group">
					<t:commandButton id="search" value="#{bundle.aon_search}"
						actionListener="#{catalogue.onSearch}" action="catalogue_list"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-accept"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-accept'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-accept'" 
						accesskey="#{bundle.aon_key_search}"/>
					<h:commandButton id="clear" value="#{bundle.aon_clear}"
						type="reset"
						styleClass="aon-content-toolbar-item aon-content-toolbar-item-reset"
						onmouseover="this.className='aon-content-toolbar-item aon-content-toolbar-item-hover aon-content-toolbar-item-reset'"
						onmouseout="this.className='aon-content-toolbar-item aon-content-toolbar-item-reset'" />
				</t:div>
				</t:div>
			</t:div>
			
			<t:div styleClass="aon-content-subtitle" id="aon-content-subtitle"
				forceId="#{true}">
				<t:div styleClass="aon-content-subtitle-internal">
				<h:outputText value="#{bundle.aon_search_header}" />
				</t:div>
			</t:div>
			
			<t:div forceId="#{true}" id="aon-scroll-area">
				<t:div styleClass="aon-scroll-area-internal">
					<h:panelGrid columns="2" styleClass="aon-form-table"
						columnClasses="aon-form-table-column-odd,aon-form-table-column-even">
						
						<t:outputLabel for="Catalogue_name"
							styleClass="aon-form-input-text-label"
							value="#{productBundle.catalogue_catalogue}" />
						<t:inputText id="Catalogue_name" size="40" forceId="#{true}"
							styleClass="aon-form-input-text"
							valueChangeListener="#{catalogue.addExpression}"/>
							
						<h:outputLabel for="Catalogue_startDate" 
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
							value="#{productBundle.catalogue_start_date}" />
						<t:div>
							<h:outputLabel for="Catalogue_fromStartDate" value="#{bundle.aon_date_from}"
								styleClass="aon-form-input-text-label" />								
							<t:inputCalendar id="Catalogue_fromStartDate" size="10"
								valueChangeListener="#{catalogue.addStartDateGreaterThanExpression}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />
							<h:outputLabel for="Catalogue_toStartDate" value="#{bundle.aon_date_to}"
								styleClass="aon-form-input-text-label" />								
							<t:inputCalendar id="Catalogue_toStartDate" size="10"
								valueChangeListener="#{catalogue.addStartDateLessThanExpression}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />
						</t:div>

						<h:outputLabel for="Catalogue_endDate" 
							styleClass="aon-form-input-text-label aon-form-table-column-odd-label"
							value="#{productBundle.catalogue_end_date}" />
						<t:div>
							<h:outputLabel for="Catalogue_fromEndDate" value="#{bundle.aon_date_from}"
								styleClass="aon-form-input-text-label" />								
							<t:inputCalendar id="Catalogue_fromEndDate" size="10"
								valueChangeListener="#{catalogue.addEndDateGreaterThanExpression}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />
							<h:outputLabel for="Catalogue_toEndDate" value="#{bundle.aon_date_to}"
								styleClass="aon-form-input-text-label" />								
							<t:inputCalendar id="Catalogue_toEndDate" size="10"
								valueChangeListener="#{catalogue.addEndDateLessThanExpression}"
								monthYearRowClass="yearMonthHeader" weekRowClass="weekHeader"
								currentDayCellClass="currentDayCell" renderAsPopup="true"
								styleClass="aon-form-input-text" popupButtonStyleClass="aon-form-calendar-button"
								popupTodayString="#{bundle.aon_popup_today}"
								popupWeekString="#{bundle.aon_popup_week}" />
						</t:div>

					</h:panelGrid>
				</t:div>
			</t:div>
		</h:form>
		<h:form id="placeList" target="list" />
	</ui:define>
</ui:composition>

</body>
</html>
