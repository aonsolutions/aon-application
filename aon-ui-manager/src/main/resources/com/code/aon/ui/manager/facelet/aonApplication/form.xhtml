<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="applicationForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{managerBundle.manager_applications}" />
				<ui:param name="controller" value="#{aonApplication}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">

					<aon:outputLabel for="Applicaiton_commonName"
						value="#{bundle.aon_name}" />
					<c:if test="#{aonApplication.new}" >
						<aon:inputText id="Applicaiton_commonName"
							validator="#{aonApplication.idCheck}" 
							size="80" required="true"
							value="#{aonApplication.to.commonName}" />
					</c:if>
					<c:if test="#{!aonApplication.new}" >
						<aon:inputText id="Applicaiton_commonName"
							size="80" disabled="true" value="#{aonApplication.to.commonName}" />
					</c:if>

					<aon:outputLabel for="Applicaiton_serverId"
						value="#{managerBundle.manager_application_serverId}" />
					<aon:inputText id="Applicaiton_serverId" required="true"
						size="80" value="#{aonApplication.to.serverId}" />

					<aon:outputLabel for="Applicaiton_description"
						value="#{bundle.aon_description}" />
					<aon:inputTextarea id="Applicaiton_description"
						value="#{aonApplication.to.description}"
						required="true" cols="80" rows="5" >
						<f:validateLength maximum="2048" />
					</aon:inputTextarea>

					<aon:outputLabel for="Applicaiton_contratable"
						value="#{managerBundle.manager_application_contratable}" />
	                <aon:selectBooleanCheckbox id="Applicaiton_contratable"
						value="#{aonApplication.to.contratable}"/>						
										
				</aon:panelGrid>
								
				<aon:panelTabSet rendered="#{!aonApplication.new}"
					selectedTab="#{aonApplication.selectedTab}">
					<aon:panelTab name="roles"
						label="#{managerBundle.manager_roles}">
						<ui:include src="/com/code/aon/ui/manager/facelet/role/grid.xhtml" />
                    </aon:panelTab>

					<aon:panelTab name="profiles"
						label="#{managerBundle.manager_profiles}">
						<ui:include src="/com/code/aon/ui/manager/facelet/profile/grid.xhtml" >
							<ui:param name="controller" value="#{profile}" />
						</ui:include>
                    </aon:panelTab>
				</aon:panelTabSet>		
												
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
