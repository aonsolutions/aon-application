<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="domainApplicationForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{managerBundle.manager_applications} (#{domain.to.commonName})" />
				<ui:param name="controller" value="#{domainApplication}" />
				<ui:param name="skipSearchButton" value="#{true}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2" dir="true">

					<aon:outputLabel for="DomainApplication_commonName"
						value="#{bundle.aon_name}" />
					<aon:selectOneMenu id="DomainApplication_commonName"
						rendered="#{domainApplication.new}" required="true" 
						value="#{domainApplication.to.commonName}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{domainApplication.availableApplications}" />
					</aon:selectOneMenu>						
					<aon:inputText id="DomainApplication_commonName-New"
						size="80" disabled="true" rendered="#{!domainApplication.new}"
						value="#{domainApplication.to.commonName}" />

					<aon:outputLabel for="DomainApplication_dataSource"
						value="#{managerBundle.manager_db_connection}" />
					<aon:selectOneMenu id="DomainApplication_dataSource" 
						value="#{domainApplication.to.dataSource.id}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{domainDBConnection.dataSources}" />
					</aon:selectOneMenu>						

					<c:if test="#{manager.administrator}">
						<aon:outputLabel for="DomainApplication_status"
							value="#{bundle.aon_status}" />
						<aon:inputText id="DomainApplication_status" required="true"
							size="10" value="#{domainApplication.to.status}" />
					</c:if>
					
				</aon:panelGrid>
				
				<aon:div styleClass="aon-form-group">
					<aon:div styleClass="aon-form-group-title">
						<aon:div styleClass="aon-form-group-title-internal">
							<aon:outputLabel value="#{managerBundle.manager_profiles}" />
						</aon:div>
					</aon:div>

				</aon:div>
				
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
