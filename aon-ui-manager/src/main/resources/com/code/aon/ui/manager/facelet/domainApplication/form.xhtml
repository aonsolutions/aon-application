<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="domainApplicationForm">

			<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{managerBundle.manager_applications} (#{domain.to.commonName})" />
				<ui:param name="controller" value="#{domainApplication}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:param name="skipSaveButton" value="#{domainApplication.new and !manager.termsOfServiceAccepted}" />
				<ui:param name="skipResetButton" value="#{!manager.config.showDomainApplicationReset}" />
				<ui:param name="removeConfirmMessage" value="#{managerBundle.manager_domain_application_remove_confirm}" />
			</ui:include>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid id="domainApplicationGrid" columns="2">

					<aon:outputLabel for="DomainApplication_commonName"
						value="#{bundle.aon_name}" />
					<aon:selectOneMenu id="DomainApplication_commonName"
						reRender="domainApplicationGrid"
						rendered="#{domainApplication.new}" required="true"
						value="#{domainApplication.to.commonName}">
						<f:selectItem itemLabel="-" value="#{null}" />
						<f:selectItems value="#{domainApplication.availableApplications}" />
					</aon:selectOneMenu>						
					<aon:inputText id="DomainApplication_commonName-New"
						size="80" disabled="true" rendered="#{!domainApplication.new}"
						value="#{domainApplication.to.commonName}" />
					
					<c:if test="#{!domainApplication.withoutDB and manager.config.showDomainApplicationDBConnection}" >
						<aon:outputLabel for="DomainApplication_dataSource"
							value="#{managerBundle.manager_db_connection}" />
						<aon:selectOneMenu id="DomainApplication_dataSource" required="true"
							converter="#{domainDBConnection.converter}"
							value="#{domainApplication.to.dataSource}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{domainDBConnection.dataSources}" />
						</aon:selectOneMenu>
					</c:if>						

					<c:if test="#{manager.config.showDomainApplicationStatus}">
						<aon:outputLabel for="DomainApplication_status"
							value="#{bundle.aon_status}" />
						<aon:selectOneMenu id="DomainApplication_status" required="true"
							value="#{domainApplication.to.status}">
							<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="0" />
							<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="12" />
						</aon:selectOneMenu>								
					</c:if>
					
				</aon:panelGrid>

				<ui:include src="/com/code/aon/ui/manager/facelet/manager/termsOfService.xhtml" >
					<ui:param name="controller" value="#{domainApplication}" />
					<ui:param name="termsOfServiceURL" value="#{manager.properties.newDomainApplicationURL}" />
				</ui:include>
									
				<c:if test="#{!domainApplication.new}">
					<aon:panelTabSet selectedTab="#{domainApplication.selectedTab}">
						<aon:panelTab name="users"
							label="#{managerBundle.manager_users}">
							<ui:include src="/com/code/aon/ui/manager/facelet/appUser/grid.xhtml" >
								<ui:param name="controller" value="#{appUser}" />
							</ui:include>
	                    </aon:panelTab>
	
						<aon:panelTab name="profiles"
							label="#{managerBundle.manager_profiles}">
							<ui:include src="/com/code/aon/ui/manager/facelet/profile/grid.xhtml" >
								<ui:param name="controller" value="#{domainProfile}" />
							</ui:include>
	                    </aon:panelTab>
	                
	                    <c:if test="#{domainApplication.aonDB}">
							<aon:panelTab name="userWorkGroups" label="#{managerBundle.manager_workgroups}">
								<ui:include src="/com/code/aon/ui/manager/facelet/workGroup/grid.xhtml" >
									<ui:param name="controller" value="#{workGroup}" />
								</ui:include>
		                    </aon:panelTab>
		                                        
							<aon:panelTab name="scopes" label="#{managerBundle.manager_scopes}">
								<ui:include src="/com/code/aon/ui/manager/facelet/scope/grid.xhtml" >
									<ui:param name="controller" value="#{scope}" />
								</ui:include>
		                    </aon:panelTab>
						</c:if>
	                                                            
					</aon:panelTabSet>
				</c:if>						
				
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
