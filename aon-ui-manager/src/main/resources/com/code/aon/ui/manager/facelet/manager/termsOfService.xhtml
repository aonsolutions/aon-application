<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">
				
	<c:if test="#{controller.new and (!manager.administrator)}" >
		<aon:div styleClass="aon-margin-top">
			<aon:selectBooleanCheckbox id="termsOfService"
				reRender="#{controller.beanName}Toolbar" ajaxSingle="true"
				value="#{manager.termsOfServiceAccepted}">
			</aon:selectBooleanCheckbox>				
			<aon:outputLabel for="termsOfService" styleClass="aon-italic"
				value="#{managerBundle.manager_service_terms_text}" />
			<aon:outputLink target="_blank"
				styleClass="aon-margin-left" value="#{termsOfServiceURL}">
				<aon:outputText value="#{managerBundle.manager_service_terms}" />
			</aon:outputLink>	
		</aon:div>
	</c:if>

</ui:composition>
