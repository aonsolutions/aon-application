<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{role}" />
		<ui:define name="columns">
	
			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="Role_name" value="#{bundle.aon_name}" />
				</f:facet>
				<aon:outputText value="#{to.commonName}" rendered="#{formList}" />
				<aon:inputText id="Role_name" required="true"
					rendered="#{formEdit}" size="60"
					validator="#{controller.idCheck}"
					value="#{controller.to.commonName}" />				
				<f:facet name="footer">
					<aon:inputText id="Role_name-New" required="true"
						rendered="#{formNew}" size="60"
						validator="#{controller.idCheck}"
						value="#{controller.to.commonName}" />
				</f:facet>
			</aon:column>
			
		</ui:define>
	</ui:decorate>

</ui:composition>
