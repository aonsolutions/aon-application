<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<aon:div styleClass="aon-form-group" rendered="#{!appUser.new}">
		<aon:div styleClass="aon-form-group-title">
			<aon:div styleClass="aon-form-group-title-internal">
				<aon:outputLabel for="userWorkgroupData" value="#{managerBundle.manager_workgroups}" />
			</aon:div>
		</aon:div>

		<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
			<ui:param name="controller" value="#{userWorkgroup}" />
			<ui:param name="showDataScroller" value="#{false}" />
			<ui:define name="columns">

				<aon:column styleClass="aon-editDataTable-textColumn">
					<f:facet name="header">
						<aon:outputLabel for="UserWorkgroup_workgroup" value="#{bundle.aon_description}" />
					</f:facet>
					<aon:outputText value="#{to.workGroup.description}"
						rendered="#{formList}" />
					<aon:selectOneMenu id="UserWorkgroup_workgroup"
						converter="#{appUser.workgroupConverter}" required="true"
						rendered="#{formEdit}" value="#{controller.to.workGroup}">
						<f:selectItems value="#{domainApplication.workgroups}" />
					</aon:selectOneMenu>
					<f:facet name="footer">
						<aon:selectOneMenu id="UserWorkgroup_workgroup-New"
							converter="#{appUser.workgroupConverter}" required="true"
							rendered="#{formNew}" value="#{controller.to.workGroup}">
							<f:selectItems value="#{domainApplication.workgroups}" />
						</aon:selectOneMenu>
					</f:facet>
				</aon:column>
			</ui:define>
		</ui:decorate>

	</aon:div>
</ui:composition>
