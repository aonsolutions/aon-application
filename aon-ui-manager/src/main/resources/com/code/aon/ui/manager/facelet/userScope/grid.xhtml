<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:decorate template="/com/code/aon/ui/resources/facelet/shared/grid.xhtml" >
		<ui:param name="controller" value="#{userScopeEx}" />
		<ui:param name="showDataScroller" value="#{false}" />
		<ui:define name="columns">

			<aon:column styleClass="aon-editDataTable-textColumn">
				<f:facet name="header">
					<aon:outputLabel for="UserScope_scope" value="#{bundle.aon_scope}" />
				</f:facet>
				<aon:outputText value="#{to.scope.description}"
					rendered="#{formList}" />
				<aon:selectOneMenu id="UserScope_scope"
					converter="#{appUser.scopeConverter}" required="true"
					rendered="#{formEdit}" value="#{controller.to.scope}">
					<f:selectItems value="#{domainApplication.scopes}" />
				</aon:selectOneMenu>
				<f:facet name="footer">
					<aon:selectOneMenu id="UserScope_scope-New"
						converter="#{appUser.scopeConverter}" required="true"
						rendered="#{formNew}" value="#{controller.to.scope}">
						<f:selectItems value="#{domainApplication.scopes}" />
					</aon:selectOneMenu>
				</f:facet>
			</aon:column>
		</ui:define>
	</ui:decorate>

</ui:composition>
