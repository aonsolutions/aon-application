<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="domainUserForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{managerBundle.manager_users} (#{domain.to.commonName})" />
				<ui:param name="controller" value="#{domainUser}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:param name="skipResetButton" value="#{!manager.userManagement}" />
				<ui:param name="skipRemoveButton" value="#{!manager.userManagement}" />
				<ui:param name="removeConfirmMessage" value="#{managerBundle.manager_domain_user_remove_confirm}" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="resetPassword"
						value="#{managerBundle.manager_reset_password}"
						actionListener="#{domainUser.onResetPassword}"
						rendered="#{!domainUser.new}"
						styleClass="aon-finding-toolbar-item aon-icon-utilities">
						<aon:actionListener method="#{saveActionListener}" />
					</aon:commandButton>				
					<aon:commandButton id="changePassword"
						value="#{managerBundle.manager_change_password}"
						actionListener="#{domainUser.onShowChangePasswordWindow}"
						reRender="showChangePasswordWindow"
						rendered="#{(!domainUser.new) and manager.config.showDomainUserChangePassword}"
						styleClass="aon-finding-toolbar-item aon-icon-utilities">
					</aon:commandButton>
				</ui:define>								
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">

					<aon:outputLabel for="DomainUser_uid"
						value="#{bundle.aon_login}" />
					<h:panelGrid>
						<aon:inputText id="DomainUser_uid"
							size="80" required="true" 
							validator="#{domainUser.idCheck}"
							value="#{domainUser.to.uid}" />
						<aon:outputText value="#{managerBundle.manager_user_init_password}"
							styleClass="aon-margin-left"
							rendered="#{domainUser.new}" />							
					</h:panelGrid>
						
					<ui:include src="/com/code/aon/ui/resources/facelet/shared/fullNameContent.xhtml" >
						<ui:param name="controller" value="#{domainUser}" />
						<ui:param name="nameRequired" value="#{true}" />
						<ui:param name="surnameRequired" value="#{true}" />
					</ui:include>	
												
					<c:if test="#{manager.config.showDomainUserPasswordExpirationTimestamp}" >						
						<aon:outputLabel for="DomainUser_passwordExpirationTimestamp"
							value="#{managerBundle.manager_password_expiration}" />
						<aon:selectInputDate id="DomainUser_passwordExpirationTimestamp" 
							value="#{domainUser.to.passwordExpirationTimestamp}"
							timeZone="#{timeZoneController.timeZone}" inputSize="20"
							popupDateFormat="#{bundle.aon_timestamp2_pattern}"/>
					</c:if>

					<aon:outputLabel for="DomainUser_active"
						value="#{bundle.aon_active}" />
					<aon:selectBooleanCheckbox id="DomainUser_active" 
						value="#{domainUser.to.active}" />
				
				</aon:panelGrid>

				<aon:panelTabSet selectedTab="#{domainUser.selectedTab}" >
					<aon:panelTab name="contact"
						label="#{bundle.aon_contact_data}">
						<ui:include src="/com/code/aon/ui/resources/facelet/shared/contactContent.xhtml" >
							<ui:param name="controller" value="#{domainUser}" />
							<ui:param name="skipFullName" value="#{true}" />
						</ui:include>							
                    </aon:panelTab>

					<aon:panelTab name="organization"
						label="#{bundle.aon_organization_data}">
						<ui:include src="/com/code/aon/ui/resources/facelet/shared/organizationContent.xhtml" >
							<ui:param name="controller" value="#{domainUser}" />
						</ui:include>							
                    </aon:panelTab>

					<aon:panelTab name="contacts" rendered="#{(!domainUser.new) and domainUser.webmail}"
						label="#{webmailBundle.webmail_email}">						
						<ui:include src="/com/code/aon/ui/webmail/facelet/contact/grid.xhtml" >
							<ui:param name="controller" value="#{contact}" />
						</ui:include>						
                    </aon:panelTab>

					<aon:panelTab name="signature" rendered="#{(!domainUser.new) and domainUser.webmail}"
						label="#{webmailBundle.webmail_signature}">
						<ui:include src="/com/code/aon/ui/webmail/facelet/signature/grid.xhtml" >
							<ui:param name="controller" value="#{signature}" />
						</ui:include>						
                    </aon:panelTab>

					<aon:panelTab name="mailAccount" rendered="#{(!domainUser.new) and domainUser.webmail}"
						label="#{webmailBundle.webmail_mailAccount}">
						<ui:include src="/com/code/aon/ui/webmail/facelet/mailAccount/grid.xhtml" >
							<ui:param name="controller" value="#{mailAccount}" />
						</ui:include>						
                    </aon:panelTab>
                    
				</aon:panelTabSet>					

			</aon:div>
		</aon:form>

		<c:if test="#{manager.config.showDomainUserChangePassword}" >
			<ui:include src="/com/code/aon/ui/manager/facelet/domainUser/changePassword.xhtml" />
		</c:if>

	</ui:define>
</ui:composition>
