<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core">

	<ui:include src="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
		<ui:param name="toolbarID" value="appUserToolbar" />
		<ui:param name="innerToolbar" value="#{true}" />
		<ui:param name="skipToolbarDescription" value="true" />
		<ui:param name="skipSearchButton" value="#{true}" />
		
		<aon:methodParam name="saveAction" value="" />
		<ui:param name="saveButtonReRender" value="appUserDiv" />
		<aon:methodParam name="cancelAction" value="" />
		<ui:param name="cancelButtonReRender" value="appUserDiv" />
		<aon:methodParam name="removeAction" value="" />
		<ui:param name="removeButtonReRender" value="appUserDiv" />
		<aon:methodParam name="resetAction" value="" />
		<ui:param name="resetButtonReRender" value="appUserDiv" />
		<aon:methodParam name="backAction" value="" />
		<ui:param name="backButtonReRender" value="appUserDiv" />		
	</ui:include>

	<aon:div styleClass="aon-scroll-area">

		<aon:panelGrid columns="2" dir="true">

			<aon:outputLabel for="DomainApplicationUser_commonName"
				value="#{bundle.aon_name}" />
			<aon:selectOneMenu id="DomainApplicationUser_commonName-New"
				rendered="#{controller.new}" required="true" 
				value="#{controller.to.commonName}">
				<f:selectItem itemLabel="-" value="#{null}" />
				<f:selectItems value="#{controller.availableUsers}" />
			</aon:selectOneMenu>						
			<aon:inputText id="DomainApplicationUser_commonName"
				size="80" disabled="true" rendered="#{!controller.new}"
				value="#{controller.to.commonName}" />
					
			<aon:outputLabel for="DomainApplicationUser_profiles"
				value="#{managerBundle.manager_profiles}" />
			<aon:selectManyCheckbox id="DomainApplicationUser_profiles"
				value="#{controller.to.profiles}" layout="pageDirection"
				required="true">
				<f:selectItems value="#{domainApplication.availableProfiles}" />
			</aon:selectManyCheckbox>			

		</aon:panelGrid>

		<c:if test="#{domainApplication.aonDB}">
			<ui:include src="/com/code/aon/ui/manager/facelet/userScope/grid.xhtml" />
			
			<ui:include src="/com/code/aon/ui/manager/facelet/workGroup/grid.xhtml" />
		</c:if>	
		
	</aon:div>

</ui:composition>
