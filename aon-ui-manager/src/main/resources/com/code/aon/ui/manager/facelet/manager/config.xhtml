<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="configForm">

			<aon:methodParam name="backActionListener" value="" type="actionListener" />
			<aon:methodParam name="backAction" value="home" />									

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{bundle.aon_configuration}" />
				<ui:param name="controller" value="#{aonConfig}" />
				<ui:param name="skipSpin" value="#{true}" />
				<ui:param name="skipResetButton" value="#{true}" />
				<ui:param name="skipSearchButton" value="#{true}" />
				<ui:param name="skipRemoveButton" value="#{true}" />
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">

					<aon:outputLabel for="Config_maxDocumentSize"
						value="#{managerBundle.manager_domain_maxDocumentSize}" />
					<aon:inputText id="Config_maxDocumentSize" required="true"
						size="10" maxlength="20" value="#{aonConfig.to.maxDocumentSize}" >
						<f:validateLongRange minimum="1" maximum="16384" />
					</aon:inputText>

					<aon:outputLabel for="Config_maxTotalDocumentSize"
						value="#{managerBundle.manager_domain_maxTotalDocumentSize}" />
					<aon:inputText id="Config_maxTotalDocumentSize" required="true"
						size="10" maxlength="20" value="#{aonConfig.to.maxTotalDocumentSize}" >
						<f:validateLongRange minimum="1" />
					</aon:inputText>

				</aon:panelGrid>
								
			</aon:div>
		</aon:form>

	</ui:define>
</ui:composition>
