<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="domainForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{managerBundle.manager_domains}" />
				<ui:param name="controller" value="#{domain}" />
				<ui:param name="saveOnClick" value="Richfaces.showModalPanel('waitProccess')" />
				<ui:param name="saveOnComplete" value="Richfaces.hideModalPanel('waitProccess')" />
				<ui:param name="removeOnClick" value="Richfaces.showModalPanel('waitProccess')" />
				<ui:param name="removeOnComplete" value="Richfaces.hideModalPanel('waitProccess')" />
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="domainDBConnection" rendered="#{!domain.new}"
						value="#{managerBundle.manager_db_connections}"
						action="domainDBConnection_list" actionListener="#{domainDBConnection.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-master"/>
					<aon:commandButton id="domainApplications" rendered="#{!domain.new}"
						value="#{managerBundle.manager_applications}"
						action="domainApplication_list" actionListener="#{domainApplication.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-utilities"/>
					<aon:commandButton id="domainUsers" rendered="#{!domain.new}"
						value="#{managerBundle.manager_users}"
						action="domainUser_list" actionListener="#{domainUser.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-user"/>
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">

					<aon:outputLabel for="Domain_commonName"
						value="#{bundle.aon_name}" />
					<c:if test="#{domain.new}" >
						<aon:inputText id="Domain_commonName"
							validator="#{domain.domainNameCheck}" required="true"
							size="40" maxlength="#{domain.domainNameMaxLength}" 
							value="#{domain.to.commonName}" />
					</c:if>
					<c:if test="#{!domain.new}" >
						<aon:inputText id="Domain_commonName"
							size="60" disabled="true" value="#{domain.to.commonName}" />
					</c:if>

					<aon:outputLabel for="Domain_organizationName"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Domain_organizationName" required="true"
						size="95" value="#{domain.to.organizationName}" />

					<aon:outputLabel for="Domain_mail"
						value="#{bundle.aon_email}" />
					<aon:inputText id="Domain_mail" size="60" maxlength="256"
						value="#{domain.to.mail}" />

					<aon:outputLabel for="Domain_mobile"
						value="#{bundle.aon_cellular}" />
					<aon:inputText id="Domain_mobile" size="40"
						value="#{domain.to.mobile}" />

					<aon:outputLabel for="Domain_host"
						value="#{managerBundle.manager_domain_host}" />
					<aon:inputText id="Domain_host" size="40" maxlength="256"
						value="#{domain.to.host}" />

					<c:if test="#{manager.administrator}">
						<aon:outputLabel for="Domain_status"
							value="#{bundle.aon_status}" />
						<aon:inputText id="Domain_status" size="5"
							value="#{domain.to.status}" />
	
						<aon:outputLabel for="Domain_dnsManagement"
							value="#{managerBundle.manager_domain_dnsManagement}" />
		                <aon:selectBooleanCheckbox id="Domain_dnsManagement"
							value="#{domain.to.dnsManagement}"/>
	
						<aon:outputLabel for="Domain_userManagement"
							value="#{managerBundle.manager_domain_userManagement}" />
		                <aon:selectBooleanCheckbox id="Domain_userManagement"
							value="#{domain.to.userManagement}"/>
	
						<aon:outputLabel for="Domain_domainManagement"
							value="#{managerBundle.manager_domain_domainManagement}" />
		                <aon:selectBooleanCheckbox id="Domain_domainManagement"
							value="#{domain.to.domainManagement}"/>
					</c:if>
					
				</aon:panelGrid>
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
	</ui:define>
</ui:composition>
