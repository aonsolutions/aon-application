<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/facelet/templates/aon.ui.content.xhtml">

	<ui:define name="content">

		<aon:form id="domainForm">

			<ui:decorate template="/com/code/aon/ui/resources/facelet/toolbar/formToolbar.xhtml" >
				<ui:param name="toolbarTitle" value="#{managerBundle.manager_domains}" />
				<ui:param name="controller" value="#{domain}" />
				<ui:param name="skipResetButton" value="#{!manager.domainManagement}" />
				<ui:param name="skipSearchButton" value="#{!manager.config.showDomainSearch}" />
				<ui:param name="skipRemoveButton" value="#{!manager.domainManagement}" />
				<ui:param name="saveOnClick" value="Richfaces.showModalPanel('waitProccess')" />
				<ui:param name="saveOnComplete" value="Richfaces.hideModalPanel('waitProccess')" />				
				<ui:param name="removeOnClick" value="Richfaces.showModalPanel('waitProccess')" />
				<ui:param name="removeOnComplete" value="Richfaces.hideModalPanel('waitProccess')" />				
				<ui:define name="beforeSpinToolbarContent">
					<aon:commandButton id="domainApplications" rendered="#{!domain.new}"
						value="#{managerBundle.manager_applications}"
						action="domainApplication_list" actionListener="#{domainApplication.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-utilities"/>
					<aon:commandButton id="domainUsers" rendered="#{!domain.new}"
						value="#{managerBundle.manager_users}"
						action="domainUser_list" actionListener="#{domainUser.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-user"/>
					<aon:commandButton id="domainDBConnection" rendered="#{!domain.new and manager.config.showDBConnections}"
						value="#{managerBundle.manager_db_connections}"
						action="domainDBConnection_list" actionListener="#{domainDBConnection.onSearch}"
						styleClass="aon-finding-toolbar-item aon-icon-master"/>
				</ui:define>				
			</ui:decorate>

			<aon:div styleClass="aon-scroll-area">

				<aon:panelGrid columns="2">

					<aon:outputLabel for="Domain_commonName"
						value="#{bundle.aon_name}" />
					<c:if test="#{domain.new}" >
						<aon:div>
							<aon:inputText id="Domain_commonName"
								validator="#{domain.idCheck}" required="true"
								size="40" maxlength="#{domain.domainNameMaxLength}" 
								value="#{domain.to.commonName}" />
							<c:if test="#{domain.addDomainSuffix}" >								
								<aon:outputText value="."
									styleClass="aon-bold aon-margin-left aon-margin-right" />								
								<aon:inputText size="20" disabled="true"
									value="#{manager.currentDomain.subDomainSuffix}" />
							</c:if>			
						</aon:div>
					</c:if>
					<c:if test="#{!domain.new}" >
						<aon:inputText id="Domain_commonName"
							size="60" disabled="true" value="#{domain.to.commonName}" />							
					</c:if>

					<aon:outputLabel for="Domain_organizationName"
						value="#{bundle.aon_description}" />
					<aon:inputText id="Domain_organizationName" required="true"
						size="95" value="#{domain.to.organizationName}" />

					<c:if test="#{domain.new}">
						<aon:outputText value="#{managerBundle.manager_domain_administrator}" />
						<aon:div>
							<aon:outputLabel for="Domain_userUid"
								value="#{bundle.aon_login}" styleClass="aon-italic"/>						
							<aon:inputText id="Domain_userUid" required="true"
								styleClass="aon-inputText aon-margin-left"
								size="20" maxlength="256" value="#{domain.to.administrator.uid}" />
							<aon:outputLabel for="Domain_userName" styleClass="aon-margin-left aon-italic"
								value="#{bundle.aon_name}" />						
							<aon:inputText id="Domain_userName" required="true"
								styleClass="aon-inputText aon-margin-left"
								size="20" value="#{domain.to.administrator.name}" />
							<aon:outputLabel for="Domain_userSurname" styleClass="aon-margin-left aon-italic"
								value="#{bundle.aon_surname}" />						
							<aon:inputText id="Domain_userSurname" required="true"
								styleClass="aon-inputText aon-margin-left"
								size="20" value="#{domain.to.administrator.surname}" />
						</aon:div>					
					</c:if>

					<c:if test="#{manager.administrator}">
						<aon:outputLabel for="Domain_status"
							value="#{bundle.aon_status}" />
						<aon:selectOneMenu id="Domain_status"
							value="#{domain.to.status}">
							<f:selectItem itemLabel="#{bundle.aon_active}" itemValue="0" />
							<f:selectItem itemLabel="#{bundle.aon_inactive}" itemValue="11" />
						</aon:selectOneMenu>								

						<aon:outputLabel for="Domain_type"
							value="#{bundle.aon_type}" />
						<aon:selectOneMenu id="Domain_type" 
							value="#{domain.to.type}">
							<f:selectItems value="#{domain.domainTypes}" />
						</aon:selectOneMenu>		
						
						<aon:outputLabel for="Domain_dataBaseId"
							value="#{managerBundle.manager_domain_dataBaseId}" />
						<aon:inputText id="Domain_dataBaseId"
							size="10" maxlength="20"
							value="#{domain.to.dataBaseId}" />
							
						<aon:outputLabel for="Domain_administrator"
							value="#{managerBundle.manager_domain_administrator}" />
						<aon:selectOneMenu id="Domain_administrator"
							converter="#{domainUser.converter}"
							value="#{domain.to.administrator}">
							<f:selectItem itemLabel="-" value="#{null}" />
							<f:selectItems value="#{domainUser.userList}" />
						</aon:selectOneMenu>	
								
					</c:if>

					<c:if test="#{domain.showDomainSubDomainSuffix}" >
						<aon:outputLabel for="Domain_subDomainSuffix"
							value="#{managerBundle.manager_domain_subDomainSuffix}" />
						<aon:inputText id="Domain_subDomainSuffix" size="60" maxlength="256"
							value="#{domain.to.subDomainSuffix}" />
					</c:if>

					<c:if test="#{!domain.to.domainManagement}" >					
						<aon:outputLabel for="Domain_parentDomain"
							value="#{managerBundle.manager_domain_parent}" />
						<c:if test="#{manager.administrator}" >								
							<aon:selectOneMenu id="Domain_parentDomain"
								converter="#{domain.converter}"
								value="#{domain.to.parentDomain}">
								<f:selectItem itemLabel="-" value="#{null}"/>
								<f:selectItems value="#{domain.parentDomains}" />
							</aon:selectOneMenu>
						</c:if>								
						<c:if test="#{!manager.administrator}" >	
							<aon:inputText id="Domain_parentDomain" size="40" disabled="true"
								value="#{domain.to.parentDomain.commonName}" />
						</c:if>								
					</c:if>
					
				</aon:panelGrid>
				
				<c:if test="#{!domain.new or manager.config.showDomainManagementTab or manager.config.showDomainAccessPolicy}" >
					<aon:panelTabSet selectedTab="#{domain.selectedTab}" >
					
						<c:if test="#{!domain.new}" >
						
							<aon:panelTab name="aliases" label="#{managerBundle.manager_alias}">
								<ui:include src="/com/code/aon/ui/manager/facelet/alias/grid.xhtml" >
									<ui:param name="controller" value="#{alias}" />
								</ui:include>
		                    </aon:panelTab>

							<c:if test="#{domain.aonDB}" >					
								<aon:panelTab name="userWorkGroups" label="#{managerBundle.manager_workgroups}">
									<ui:include src="/com/code/aon/ui/manager/facelet/workGroup/grid.xhtml" >
										<ui:param name="controller" value="#{workGroup}" />
									</ui:include>
			                    </aon:panelTab>
	
								<aon:panelTab name="scopes" label="#{managerBundle.manager_scopes}">
									<ui:include src="/com/code/aon/ui/manager/facelet/scope/grid.xhtml" >
										<ui:param name="controller" value="#{scope}" />
									</ui:include>
			                    </aon:panelTab>
							</c:if>
						</c:if>

						<aon:panelTab name="domainManagament" rendered="#{manager.config.showDomainManagementTab}"
							label="#{managerBundle.manager_domain_management}">
							
							<aon:panelGrid columns="2">
	
								<aon:outputLabel for="Domain_documentManagement"
									value="#{managerBundle.manager_domain_documentManagement}" />
				                <aon:selectBooleanCheckbox id="Domain_documentManagement"
				                	valueChangeListener="#{domain.documentManagementChanged}"
									value="#{domain.to.documentManagement}"/>
									
								<c:if test="#{domain.to.documentManagement}" >
									<aon:outputLabel for="Config_maxDocumentSize"
										value="#{managerBundle.manager_domain_maxDocumentSize}" />
									<aon:inputText id="Config_maxDocumentSize" size="10" 
										maxlength="20" value="#{domain.to.maxDocumentSize}" >
										<f:validateLongRange minimum="1" maximum="16" />
									</aon:inputText>
				
									<aon:outputLabel for="Config_maxTotalDocumentSize"
										value="#{managerBundle.manager_domain_maxTotalDocumentSize}" />
									<aon:inputText id="Config_maxTotalDocumentSize" size="10"  
										maxlength="20" value="#{domain.to.maxTotalDocumentSize}" >
										<f:validateLongRange minimum="1" />
									</aon:inputText>	
								</c:if>								
				
								<aon:outputLabel for="Domain_userManagement"
									value="#{managerBundle.manager_domain_userManagement}" />
				                <aon:selectBooleanCheckbox id="Domain_userManagement"
				                	valueChangeListener="#{domain.userManagementChanged}"
									value="#{domain.to.userManagement}"/>
			
								<c:if test="#{manager.config.showDomainManagement}" >			
									<aon:outputLabel for="Domain_domainManagement"
										value="#{managerBundle.manager_domain_domainManagement}" />
					                <aon:selectBooleanCheckbox id="Domain_domainManagement"
					                	valueChangeListener="#{domain.domainManagementChanged}"
										value="#{domain.to.domainManagement}"/>
								</c:if>

							</aon:panelGrid>
							
	                    </aon:panelTab>
	
						<aon:panelTab name="accessPolicy" rendered="#{manager.config.showDomainAccessPolicy}"
							label="#{managerBundle.manager_access_policy}">
							
							<aon:panelGrid columns="2">
								<aon:outputLabel for="AccessPolicy_commonName"
									value="#{bundle.aon_type}" />
								<aon:selectOneMenu id="AccessPolicy_commonName" 
									value="#{domain.accessPolicy.commonName}">
									<f:selectItems value="#{domain.accessPolicies}" />
								</aon:selectOneMenu>									
	
								<aon:outputLabel for="AccessPolicy_maxDefinedUsers"
									value="#{managerBundle.manager_access_policy_maxDefinedUsers}" />
								<aon:inputText id="AccessPolicy_maxDefinedUsers"
									size="10" maxlength="20"
									value="#{domain.accessPolicy.maxDefinedUsers}" />
			
								<aon:outputLabel for="AccessPolicy_maxAllowedUsers"
									value="#{managerBundle.manager_access_policy_maxAllowedUsers}" />
								<aon:inputText id="AccessPolicy_maxAllowedUsers"
									size="10" maxlength="20"
									value="#{domain.accessPolicy.maxAllowedUsers}" />
	
								<aon:outputLabel for="AccessPolicy_maxSessions4User"
									value="#{managerBundle.manager_access_policy_maxSessions4User}" />
								<aon:inputText id="AccessPolicy_maxSessions4User"
									size="10" maxlength="20"
									value="#{domain.accessPolicy.maxSessions4User}" />
			
								<aon:outputLabel for="AccessPolicy_exceptionThrowableIfMaximumExceeded"
									value="#{managerBundle.manager_access_policy_exceptionThrowableIfMaximumExceeded}" />
								<aon:selectBooleanCheckbox id="AccessPolicy_exceptionThrowableIfMaximumExceeded" 
									value="#{domain.accessPolicy.exceptionThrowableIfMaximumExceeded}" />
							</aon:panelGrid>
													
	                    </aon:panelTab>
	
					</aon:panelTabSet>
				</c:if>		
								
			</aon:div>
		</aon:form>
		<ui:include src="/com/code/aon/ui/resources/facelet/shared/waitProcess.xhtml" />
		<ui:include src="/com/code/aon/ui/manager/facelet/domain/companyPopup.xhtml" />
		<c:if test="#{manager.currentDomain.type == 'CONSULTANCY'}" >
			<aon:lookupButtonPopup lookup="#{bankLookup}" />
		</c:if>
	</ui:define>
</ui:composition>
