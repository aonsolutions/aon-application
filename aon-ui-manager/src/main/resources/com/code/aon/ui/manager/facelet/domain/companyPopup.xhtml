<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:aon="http://www.code.es/aon-rich-components">

	<c:if test="#{domain.showCompanyWindow}">
		<rich:modalPanel id="companyWindow" zindex="90"
			showWhenRendered="true" minWidth="640" minHeight="400">

			<f:facet name="header">
				<aon:div styleClass="aon-popupWindow-title">
					<aon:outputText value="#{companyBundle.company_data_module}" />
				</aon:div>
			</f:facet>

			<aon:form>
				<aon:div styleClass="aon-popupWindow-content">
					<aon:div styleClass="aon-popupWindow-content-internal">
						<aon:div styleClass="aon-toolbar">
							<aon:commandButton id="save"
								value="#{bundle.aon_save}"
								actionListener="#{company.accept}"
								styleClass="aon-finding-toolbar-item aon-icon-accept"
								accesskey="#{bundle.aon_key_save}" >
								<f:setPropertyActionListener
									target="#{domain.showCompanyWindow}" value="#{false}" />								
								<rich:componentControl for="companyWindow" event="onclick"
									disableDefault="true" operation="hide" />								
							</aon:commandButton>
						</aon:div>
						
						<aon:panelGrid columns="2" style="width:100%">
							<ui:include
								src="/com/code/aon/ui/company/facelet/company/formNewContent.xhtml" >
								<ui:param name="controller" value="#{company}" />									
							</ui:include>
						</aon:panelGrid>							

					</aon:div>
				</aon:div>
			</aon:form>

		</rich:modalPanel> 

	</c:if>

</ui:composition>
