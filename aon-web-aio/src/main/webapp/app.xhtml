<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition 
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:rich="http://richfaces.org/rich"
	template="/facelet/templates/aon.ui.main.xhtml"
	>
	
	
	<ui:define name="head">
		<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" />
	</ui:define>

	<ui:define name="mainHeader">
		<aon:div id="#{app.standAloneAppId}" /> 
		<ui:include src="/facelet/app/header.xhtml" />
	</ui:define>
	
	<ui:define name="mainContent">
 		<a4j:include id="aonContent" ajaxRendered="false" viewId="#{app.viewId}" />
 	</ui:define>

</ui:composition>
