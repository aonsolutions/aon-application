	<script type="text/javascript">
	
			selected = -1;
		    helpTooltipTimeout = null;
			
			function showSearchResults(){
				if ( #{rich:element('smartFilter')}.value ) {
					#{rich:element('smartFilterTableContainer')}.classList.add("show");
				}
			}
			
			function hideSearchResults(){
				setTimeout(function() {
					if ( document.activeElement != #{rich:element('smartFilterTablePanel')} )
						#{rich:element('smartFilterTableContainer')}.classList.remove("show");
				}, 200);
			}
			
			
			function escSearchResults(e){
				if ( e.which === 27 ) {
					#{rich:element('smartFilterTableContainer')}.classList.remove("show");
					e.stopPropagation();
      				e.preventDefault();  
      				e.returnValue = false;
      				e.cancelBubble = true;
      				
      				hideHelpTooltip(true);
      				return false;
				}
				
				// if arrows or enter
				if(e.which === 38 || e.which === 40 || e.which === 13) {
					e.stopPropagation();
      				e.preventDefault();  
      				e.returnValue = false;
      				e.cancelBubble = true;
      				
      				const searchResults = #{rich:element('smartFilterTablePanel')}.querySelectorAll(".selectable");
      				if(searchResults.length == 0){
      					return;
      				}
      				
    				// Arrow up
    				if(e.which === 38) {
    					selected--;
    					
    					if(selected &lt; 0){
    						selected = searchResults.length -1;
    					}
    					
    					resetResultStates(searchResults, selected)
    					
    				}
    				
    				// Arrow down
    				if(e.which === 40) {
          				selected++;
          				
          				if(selected >= searchResults.length){
          					selected = 0;
          				}
          				
          				resetResultStates (searchResults, selected)
    				}
    				
    				// Enter
    				if(e.which === 13) {
    					
    					const link = searchResults[selected].querySelector("a");
    					searchResults[selected].click();
    					
    					if(link) {
    						link.click();
    					}
    					
    				}
      				
				} else {
					selected = -1;
				}
				

				
			}
			
			function resetResultStates (searchResults, selected) {
				searchResults.forEach(p => {
					p.style.background = "transparent";
				})
				
				hideHelpTooltip();
				
				const mouseover =  searchResults[selected].onmouseover;
				if(mouseover){
					mouseover({
						target : searchResults[selected],
						clientX : searchResults[selected].getBoundingClientRect().right - (searchResults[selected].offsetWidth / 2),
					});
				}
				
				searchResults[selected].style.background = "#f1f1f1";
			}
			
			function focusSearchResults(){
				setTimeout(function() {
					if ( #{rich:element('smartFilterTablePanel')} ) {
						#{rich:element('smartFilterTablePanel')}.classList.add("show");
					}
					#{rich:element('smartFilter')}.focus();
				}, 300);
			}

			
			/**
			* 	Show help tooltip
			*	@param event The event activating the function
			*   @param url The url to show
			*/
			function showHelpTooltip( event, url ){
				
					helpTooltipTimeout = setTimeout(function(){
						
						const tooltip = document.getElementById("helpTooltip");
						const frame = document.querySelector("#helpTooltip iframe");
						const optionRect = event.target.getBoundingClientRect();;
						
						if(!tooltip || !frame){
							return;
						}
						
						if(Math.abs(event.clientY - optionRect.top) > 18){
							return;
						}
						
						tooltip.dataset.url = url;
						
						// Set loading animation
						frame.style.transition = "none";
						frame.style.opacity = 1;
						

						// Get the right tooltip URL						
						const filename = url.substr( url.lastIndexOf('/') + 1, url.lastIndexOf('.pdf')-5);
						let name = url.substr( url.lastIndexOf('#') + 1);
						
						let tooltipUrl = "";
						
						if(url.lastIndexOf('#') == -1) {
							tooltipUrl = b64EncodeUnicode("../../Tooltip/?page=" + 0 + "&amp;filename=" + filename)						
						} else {
							tooltipUrl = b64EncodeUnicode("../../Tooltip/?name=" + name + "&amp;filename=" + filename)
						}
						
						frame.src =  "html/pdfjs/viewer.html?encoded=true&amp;file=" + tooltipUrl +"#zoom=page-width"; 
						
						// Show tooltip						
						tooltip.style.display = "block";
						tooltip.style.top = ( optionRect.top + 20 ) + "px";
						
						tooltip.style.left = event.clientX  + "px";
						tooltip.style.transform = "translateX(-50%)";
						setTimeout(() => tooltip.style.opacity = "1", 250);
												
					}, 150);

			}
			
			
			/**
			*	Encode unicode to base64 
			*	@param str The string to encode
			*/
			function b64EncodeUnicode(str) {
		        // first we use encodeURIComponent to get percent-encoded UTF-8,
		        // then we convert the percent encodings into raw bytes which
		        // can be fed into btoa.
		        return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
		            function toSolidBytes(match, p1) {
		                return String.fromCharCode('0x' + p1);
		        }));
		    }
			
			/**
			* Hide the help tooltip
			* @param force force the hide tooltip, false by default
			*/
			function hideHelpTooltip(force = false) {
				clearTimeout(helpTooltipTimeout);
				const tooltip = document.getElementById("helpTooltip");
				
				if(!tooltip){
					return;
				}
				
				if(!force &amp;&amp; tooltip.classList.contains("focus")){
					return;
				}
				
			
				
				tooltip.style.opacity = "0";
				setTimeout(() => tooltip.style.display = "none", 20);
			}
			
			
			function listenGlobalKeys(e) {
				const key = e.keyCode || e.witch;
				if(key == 113){
					
					const tooltip = document.getElementById("helpTooltip");
					const frame = document.querySelector("#helpTooltip iframe");
					const message = document.getElementById("tooltip-key-message");
					tooltip.onclick = () => tooltip.classList.remove("focus");
					
					if(!frame.src){
						return;
					}
					
					const isSearch = #{rich:element('smartFilterTableContainer')}.classList.contains("show");
	
					if(isSearch &amp;&amp; tooltip.className.indexOf("focus") == -1){
						tooltip.classList.add("focus");
						
						const content = frame.contentWindow || frame.contentDocument;
						content.addEventListener("keydown", (e) => {
							listenGlobalKeys(e);
							
							const key = e.keyCode || e.witch;
							if(key == 113 || key == 27){
								tooltip.classList.remove("focus");
								hideHelpTooltip();
							}
							
							 // CTRL + ENTER
				            if (event.ctrlKey &amp;&amp; event.code === 'Enter') {
				            	tooltip.classList.remove("focus");
				            	hideHelpTooltip(true);				            	
				            	window.open(tooltip.dataset.url,'_blank');
				            }
				               
						});
						
						frame.focus();
												
						const f2Icon = document.createElement("span");
						const ctrlIcon = document.createElement("span");
						const enterIcon = document.createElement("span");
						
						f2Icon.className = "keyboard-icon";
						ctrlIcon.className = "keyboard-icon";
						enterIcon.className = "keyboard-icon";
						
						f2Icon.innerHTML = "F2";
						ctrlIcon.innerHTML = "Ctrl";
						enterIcon.innerHTML = "Enter";
						
						message.innerHTML = "Pulse " + f2Icon.outerHTML + " para soltar la ventana | " + ctrlIcon.outerHTML + " " + enterIcon.outerHTML + " para ir al pdf";
					} else {
						tooltip.classList.remove("focus");
						
						const f2Icon = document.createElement("span");
						f2Icon.className = "keyboard-icon";
						f2Icon.innerHTML = "F2";
						
						message.innerHTML = "Pulse " + f2Icon.outerHTML + " para fijar la ventana";
					}
				}
			}
			
			function copyToClipboard(event,text) {
				
				 if (navigator &amp;&amp; navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
					navigator.clipboard.writeText(text)
				 } else {
					 console.log("Clipboard API not available, make sure that app is running via HTTPS protocol.");
					 console.log("Trying legacy method...");
					 legacyCopyToCliboard(text);
				 }
				 
				 showCopyTooltip(event);
			}
			
			function legacyCopyToCliboard(text) {
				  const el = document.createElement('textarea');
				  el.value = text;
				  el.setAttribute('readonly', '');
				  el.style.position = 'absolute';
				  el.style.left = '-9999px';
				  document.body.appendChild(el);
				  el.select();
				  document.execCommand('copy');
				  document.body.removeChild(el);
			}
			
			
			function showCopyTooltip(e){
				
				const tooltip = document.getElementById("copyTooltip");
				tooltip.style.top = e.target.getBoundingClientRect().top + "px"
				tooltip.style.left = e.target.getBoundingClientRect().left + "px"
				tooltip.classList.add("show");
				
				
				setTimeout(() => {
					tooltip.classList.add("up");

					setTimeout(() => {
						tooltip.classList.remove("up");
						
						setTimeout(() => {
							tooltip.classList.remove("show");
						}, 100);
						
					}, 1200);
				}, 100);
				
				
			}
			
			
			/**
			*  GLOBAL WINDOW CONTROLS
			*/
			document.documentElement.addEventListener("keydown", listenGlobalKeys)
			
			/**
			* SONAR : Keep session alive  
			*/
			sonar = new XMLHttpRequest();
			sonar.onload = function() {
				console.log(this.responseText);
			}
  			setInterval(function(){
				sonar.open("GET", "sonar");				
				sonar.send();				
				
			}, 300000);
			
		
	</script>
