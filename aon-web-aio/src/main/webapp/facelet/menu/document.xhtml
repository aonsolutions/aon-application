<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"	
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="documentMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_documental"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-payroll aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_module_document}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="corporateDocuments" 
										action="#{corporateIdentityAttach.initialAction}"
										actionListener="#{corporateIdentityAttach.onEditSearch}"
										value="#{bundle.aon_documents}">
										<f:setPropertyActionListener value="#{false}"
											target="#{corporateIdentityAttach.massiveUpload}"  />			
									</aon:commandLink>
								</aon:div>							
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="batchDocument" 
										action="batchDocument_form"
										value="#{registryBundle.registry_batch_document}"/>
								</aon:div>					
								<c:if test="#{aonRole.documentManager and domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="documentMassiveUpload" 
											action="corporateIdentityAttach_form"
											value="#{registryBundle.registry_document_massive_upload}">
											<f:setPropertyActionListener value="#{true}"
												target="#{corporateIdentityAttach.massiveUpload}"  />
											<aon:actionListener method="#{corporateIdentityAttach.onReset}" />
										</aon:commandLink>
									</aon:div>
								</c:if>							
								<c:if test="#{domainSwitcher.parentDomain and domainSwitcher.domainManagementAvailable}">									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="documentGlobal" 
											action="documentGlobal_search"
											actionListener="#{documentGlobal.onEditSearch}"
											value="#{registryBundle.registry_document_global_search}"/>
									</aon:div>					
								</c:if>								
							</aon:div>
						</aon:panelGrid>
					
					</aon:panelGroup>
					
					<aon:panelGroup>
						<c:if test="#{aonRole.documentManager}">													
							<aon:panelGrid id="group_documental_utilities"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-utilities aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{registryBundle.registry_qualifier_group}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="tag" 
											action="registryAttachmentTag_form" 
											actionListener="#{registryAttachmentTag.onCancel}"
											value="#{registryBundle.registry_tag_module}"/>	
									</aon:div>								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="category" 
											action="category_form"
											actionListener="#{category.onCancel}" 
											value="#{registryBundle.registry_category_module}"/>	
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
					</aon:panelGroup>					

				</h:panelGrid>
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
