<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"	
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="documentMenu">
		
			<aon:div styleClass="aon-scroll-area">		
		
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_documental"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-payroll aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_document}"/>
							</f:facet>					
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="documentTree" 
										action="#{enterprise.initialAction}" immediate="true" 
										value="#{documentBundle.document_documents}">
										<aon:actionListener method="#{enterpriseDocumentTree.onTreeViewSelect}" />
										<aon:actionListener method="#{enterprise.onEditSearch}" />
									</aon:commandLink>		
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="advanced_search" 
										action="enterpriseDocument_search" immediate="true"
										actionListener="#{enterpriseDocument.onEditSearch}"
										value="#{documentBundle.document_advanced_search}">
										<f:setPropertyActionListener value="#{false}"
											target="#{enterpriseDocumentSearch.showList}"  />
										<aon:actionListener method="#{enterprise.onBasicViewSelect}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="document_massive_upload" 
										action="enterpriseDocument_form" immediate="true"
										actionListener="#{enterpriseDocument.onReset}"
										value="#{documentBundle.document_upload}">
										<aon:actionListener method="#{enterprise.onBasicViewSelect}" />
										<aon:actionListener method="#{enterprise.onEditSearch}" />
									</aon:commandLink>
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="batchDocument" 
										rendered="#{manager.mainEnterprise}"
										action="batchDocument_form" immediate="true" 
										value="#{documentBundle.document_batch_document}">
									</aon:commandLink>
								</aon:div>								
							</aon:div>
						</aon:panelGrid>
					
					</aon:panelGroup>

					<c:if test="#{manager.administrator}">
						<aon:panelGrid id="group_documental_general"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-general">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_general}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="alfrescoCategoryGroup" 
										action="alfrescoCategoryGroup_list" 
										actionListener="#{alfrescoCategoryGroup.onSearch}" 
										value="#{registryBundle.registry_category}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="alfrescoGroup" 
										action="alfrescoGroup" 
										actionListener="#{alfrescoGroup.onSearch}" 
										value="#{configBundle.config_scopes}" />
								</aon:div>						
							</aon:div>
						</aon:panelGrid>
					</c:if>							

				</h:panelGrid>
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
