<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="managementMenu">

			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="3" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-200
					             , aon-vertical-align-top aon-width-200
					             , aon-vertical-align-top aon-width-200">

					<aon:panelGroup>
						<aon:panelGrid id="group_management_holder_sales"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-sales aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_sales}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="customer"
										action="customer_search" actionListener="#{customer.onEditSearch}"
										value="#{customerBundle.customer_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="saleInvoiceManagement"
										action="saleInvoice_search" actionListener="#{saleInvoice.onEditSearch}"
										value="#{financeBundle.finance_sale_invoice_management_module}" />
								</aon:div>
<!-- 
	Se quita esta opcion del menu por su peligrosidad obvia. Ahora mismo genera facturas que no son compatibles con la aplicacion 
	a la hora de imprimirlas o contabilizarlas. Si sigue adelante este tema habria que revisarlo con MAC para dejarlo bien.
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="rectifierInvoiceManagement"
										action="rectifierInvoice_search" actionListener="#{rectifierInvoice.onReset}"
										value="#{financeBundle.finance_special_rectifier_invoice_module}" />
								</aon:div>
 -->								
								<c:if test="#{aonRole.saleOperator}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="sales-management" 
											action="sales_search-management" actionListener="#{sales.onEditSearch}"
											value="#{salesBundle.sales_module}" />
									</aon:div>
								</c:if>
								<c:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseItem-sales" 
											action="item_search-sales" actionListener="#{item.onEditSearch}"
											value="#{productBundle.product_module}" />
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>

						<c:if test="#{aonRole.statisticsOperator}">
							<aon:panelGrid id="group_sales_reports"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-statistics aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_reports}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="salesAccumulate"
											action="sales_accumulate_search-sales" 
											value="#{statBundle.stat_menu_acumulado}">
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onSaleType}"/>
										</aon:commandLink>
									</aon:div>
								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="saleCategoryStats"
											action="category_stats_search-sales" 
											value="#{statBundle.stat_menu_category}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onSaleType}"/>
										</aon:commandLink>
									</aon:div>
		
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="saleSummaryStats"
											action="summary_stats_search-sales" 
											value="#{statBundle.stat_menu_summary}"  >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onSaleType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="saleABCStats"
											action="abc_stats_search-sales" 
											value="#{statBundle.stat_abc_customer}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onSaleType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="saleABCStatsProduct"
											action="abc_stats_searchProduct-sales" 
											value="#{statBundle.stat_abc_product}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onSaleType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="saleABCStatsCategory"
											action="abc_stats_searchCategory-sales" 
											value="#{statBundle.stat_abc_category}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onSaleType}"/>
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>

						<c:if test="#{aonRole.financeOperator or aonRole.accountingOperator}">
							<aon:panelGrid id="group_sales_utility"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-utilities aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_utilities}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<c:if test="#{company.EInvoice and (certificate.certificateCount>0) and aonRole.ESignature}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="saleInvoiceSigner"
												value="#{financeBundle.finance_invoice_signing_module}"
												actionListener="#{invoiceSigner.onEditSearch}"
												action="invoiceSigner_search" />
										</aon:div>
									</c:if>
									<c:if test="#{aonRole.accountingOperator}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="saleInvoiceRecorder"
												value="#{financeBundle.finance_sale_invoice_recording_module}"
												actionListener="#{saleInvoiceRecorder.onEditSearch}"
												action="saleInvoiceRecorder_search" />
										</aon:div>
									</c:if>
									<c:if test="#{aonRole.financeOperator}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="no_fee_customers"
												value="#{financeBundle.finance_fee_no_fee_customer_module}"
												actionListener="#{customerFee.onNoFeeCustomers}"
												action="noFeeCustomer_list" />
										</aon:div>
									</c:if>
								</aon:div>								
							</aon:panelGrid>
						</c:if>
						</c:if>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:panelGrid id="group_management_holder_purchases"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-purchase aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{appBundle.menu_purchase}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="supplier" 
										action="supplier_search" actionListener="#{supplier.onEditSearch}"
										value="#{supplierBundle.supplier_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="purchaseInvoiceManagement"
										action="purchaseInvoice_search"	actionListener="#{purchaseInvoice.onEditSearch}"
										value="#{financeBundle.finance_purchase_invoice_management_module}" />
								</aon:div>
								<c:if test="#{aonRole.purchaseOperator}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchase" 
											action="purchase_search" actionListener="#{purchase.onEditSearch}"
											value="#{purchaseBundle.purchase_module}" />
									</aon:div>
								</c:if>								
								<c:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseItem-purchase" 
											action="item_search-Purchase" actionListener="#{item.onEditSearch}"
											value="#{productBundle.product_module}" />
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>
						
						<c:if test="#{aonRole.statisticsOperator}">
							<aon:panelGrid id="group_purchase_reports"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-statistics aon-direct-access-panel">		
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_reports}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseAccumulate"
											action="sales_accumulate_search-purchase" 
											value="#{statBundle.stat_menu_acumulado2}">
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseCategoryStats"
											action="category_stats_search-purchase" 
											value="#{statBundle.stat_menu_category}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
		
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseSummaryStats"
											action="summary_stats_search-purchase" 
											value="#{statBundle.stat_menu_summary}"  >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseABCStats"
											action="abc_stats_search-purchase" 
											value="#{statBundle.stat_abc_supplier}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseABCStatsProduct"
											action="abc_stats_searchProduct-purchase"
											value="#{statBundle.stat_abc_product}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="purchaseABCStatsCategory"
											action="abc_stats_searchCategory-purchase" 
											value="#{statBundle.stat_abc_category}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onPurchaseType}"/>
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>

						<c:if test="#{aonRole.accountingOperator}">
							<aon:panelGrid id="group_purchase_utility"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-utilities aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_utilities}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<c:if test="#{aonRole.accountingOperator}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="purchaseInvoiceRecorder"
												value="#{financeBundle.finance_purchase_invoice_recording_module}"
												actionListener="#{purchaseInvoiceRecorder.onEditSearch}"
												action="purchaseInvoiceRecorder_search" />
										</aon:div>
									</c:if>
								</aon:div>								
							</aon:panelGrid>
						</c:if>
					</aon:panelGroup>

					<aon:panelGroup>
						<aon:panelGrid id="group_management_holder_expenses"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-expenses aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{productBundle.product_expense_module}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="creditor" 
										action="creditor_search" actionListener="#{creditor.onEditSearch}"
										value="#{financeBundle.finance_creditor_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="expenseInvoiceManagement"
										action="expenseInvoice_search" actionListener="#{expenseInvoice.onEditSearch}"
										value="#{financeBundle.finance_expense_invoice_management_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="undeductibleInvoiceManagement"
										action="undeductibleInvoice_search" actionListener="#{undeductibleInvoice.onEditSearch}"
										value="#{financeBundle.finance_undeductible_invoice_management_module}" />
								</aon:div>
								<c:if test="#{aonRole.config}">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseItem" 
											action="expenseItem" 
											value="#{productBundle.product_expense_module}" />
									</aon:div>
								</c:if>
							</aon:div>
						</aon:panelGrid>

						<c:if test="#{aonRole.statisticsOperator}">
							<aon:panelGrid id="group_expenses_reports"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-statistics aon-direct-access-panel">		
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_reports}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseAccumulate"
											action="sales_accumulate_search-expenses" 
											value="#{statBundle.stat_menu_expense}">
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onExpenseType}"/>
										</aon:commandLink>
									</aon:div>
								
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseCategoryStats"
											action="category_stats_search-expenses" 
											value="#{statBundle.stat_menu_category_expense}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onExpenseType}"/>
										</aon:commandLink>
									</aon:div>
		
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseSummaryStats"
											action="summary_stats_search-expenses" 
											value="#{statBundle.stat_menu_summary}"  >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onExpenseType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseABCStats"
											action="abc_stats_search-expenses" 
											value="#{statBundle.stat_abc_creditor}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onExpenseType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseABCStatsProduct"
											action="abc_stats_searchProduct-expenses"
											value="#{statBundle.stat_abc_expense}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onExpenseType}"/>
										</aon:commandLink>
									</aon:div>
									
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="expenseABCStatsCategory"
											action="abc_stats_searchCategory-expenses" 
											value="#{statBundle.stat_abc_category}" >
											<aon:actionListener method="#{stat.onReset}"/>
											<aon:actionListener method="#{stat.onExpenseType}"/>
										</aon:commandLink>
									</aon:div>
								</aon:div>
							</aon:panelGrid>
						</c:if>
						<c:if test="#{aonRole.accountingOperator}">
							<aon:panelGrid id="group_expenses_utility"
								styleClass="aon-width-all" columnClasses="aon-padding"
								headerClass="aon-icon-utilities aon-direct-access-panel">
								<f:facet name="header">
									<aon:outputText value="#{bundle.aon_utilities}" />
								</f:facet>
								<aon:div styleClass="aon-direct-access-list">
									<c:if test="#{aonRole.accountingOperator}">
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="expenseInvoiceRecorder"
												value="#{financeBundle.finance_expense_invoice_recording_module}"
												actionListener="#{expenseInvoiceRecorder.onEditSearch}"
												action="expenseInvoiceRecorder_search" />
										</aon:div>
										<aon:div styleClass="aon-direct-access-list-element">
											<aon:commandLink id="undeductibleInvoiceRecorder"
												value="#{financeBundle.finance_undeductible_invoice_recording_module}"
												actionListener="#{undeductibleInvoiceRecorder.onEditSearch}"
												action="undeductibleInvoiceRecorder_search" />
										</aon:div>
									</c:if>
								</aon:div>								
							</aon:panelGrid>
						</c:if>

					</aon:panelGroup>
					
				</h:panelGrid>
			</aon:div>
		</aon:form>
	</ui:define>
</ui:composition>
