<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:aon="http://www.code.es/aon-rich-components"
	xmlns:c="http://java.sun.com/jstl/core"
	xmlns:rich="http://richfaces.org/rich"
	xmlns:a4j="http://richfaces.org/a4j"	
	template="/com/code/aon/ui/audit/facelet/shared/menuContent.xhtml">

	<ui:define name="content">

		<aon:form id="warehouseMenu">
		
			<aon:div styleClass="aon-scroll-area">
			
				<h:panelGrid styleClass="aon-width-all" columns="2" cellspacing="15"
					columnClasses="aon-vertical-align-top aon-width-300, aon-vertical-align-top aon-width-300">

					<aon:panelGroup>
						<aon:panelGrid id="group_warehouse_movements"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-refresh aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{warehouseBundle.warehouse_warehouse_movements}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
 								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="income" 
										action="income_search" actionListener="#{income.onEditSearch}"
										value="#{warehouseBundle.warehouse_income_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="delivery" 
										action="delivery_search" actionListener="#{delivery.onEditSearch}"
										value="#{warehouseBundle.warehouse_delivery_module}" />
								</aon:div>								
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="warehouseTransfer" 
										action="warehouseTransfer_search" actionListener="#{warehouseTransfer.onEditSearch}"
										value="#{warehouseBundle.warehouse_transfer_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
						
						<aon:panelGrid id="group_warehouse_inventory"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-warehouse aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{warehouseBundle.warehouse_stock_module}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="inventory_close" 
										action="inventory_close" actionListener="#{inventory.onStartClosing}"
										value="#{warehouseBundle.warehouse_inventory_close_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="inventory" 
										action="inventory_search" actionListener="#{inventory.onEditSearch}"
										value="#{warehouseBundle.warehouse_inventory_closed_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="stock" 
										action="stock_search" actionListener="#{stock.onEditSearch}"
										value="#{warehouseBundle.warehouse_stock_module}" />
								</aon:div>
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="orderProposal" 
										action="orderProposal_search" actionListener="#{orderProposal.onEditSearch}"
										value="#{warehouseBundle.warehouse_order_proposal_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

					</aon:panelGroup>

					<aon:panelGroup>
						<aon:panelGrid id="group_warehouse_stock"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-icon-report aon-direct-access-panel">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_reports}"/>
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="stock_report_by_warehouse" 
										action="stock_report_search-warehouse" actionListener="#{stockReport.onReportByWarehouse}"
										value="#{warehouseBundle.warehouse_stock_by_warehouse_module}" />
								</aon:div>
								
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="stock_report_by_item" 
										action="stock_report_search-item" actionListener="#{stockReport.onReportByItem}"
										value="#{warehouseBundle.warehouse_stock_by_item_module}" />
								</aon:div>
								
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="stock_report_by_warehouse_valued" 
										action="stock_report_search-warehouseValued" actionListener="#{stockReport.onReportByWarehouseValued}"
										value="#{warehouseBundle.warehouse_stock_by_warehouse_valued_module}" />
								</aon:div>
								
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="stock_report_by_item_valued" 
										action="stock_report_search-itemValued" actionListener="#{stockReport.onReportByItemValued}"
										value="#{warehouseBundle.warehouse_stock_by_item_valued_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>

						<aon:panelGrid id="group_warehouse_utilities"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-utilities">
							<f:facet name="header">
								<aon:outputText value="#{bundle.aon_utilities}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
									<aon:div styleClass="aon-direct-access-list-element">
										<aon:commandLink id="corporateIdentityLabel" action="corporateIdentity_label"
											actionListener="#{corporateIdentity.onInit}"
											value="#{registryBundle.registry_corporateIdentity_label}" />
									</aon:div>
							</aon:div>
						</aon:panelGrid>									

						<aon:panelGrid id="group_warehouse_warehouses"
							styleClass="aon-width-all" columnClasses="aon-padding"
							headerClass="aon-direct-access-panel aon-icon-general">
							<f:facet name="header">
								<aon:outputText value="#{warehouseBundle.warehouse_warehouse_group}" />
							</f:facet>
							<aon:div styleClass="aon-direct-access-list">
								<aon:div styleClass="aon-direct-access-list-element">
									<aon:commandLink id="warehouse" 
										action="warehouse" 
										value="#{warehouseBundle.warehouse_warehouse_module}" />
								</aon:div>
							</aon:div>
						</aon:panelGrid>
					</aon:panelGroup>
				</h:panelGrid>
			</aon:div>
				
		</aon:form>

	</ui:define>

</ui:composition>
